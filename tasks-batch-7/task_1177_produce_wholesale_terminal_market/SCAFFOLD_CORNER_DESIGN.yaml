# =============================================================================
# Task 1177 — Scaffold Corner Design (§1.9 Coverage Index for Non-Difficulty Tests)
# Breadth probe across §1.1–§1.7 claims not already covered by §1.8.
# Negative-trigger instances capture $.data.error_id (and/or carry a
# *_returns_* / *_cannot_* name) by design.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: create_shipper_missing_required_field_returns_validation
        claim_type: required_fields
        grounds: [entities.Shipper.fields.name, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /market/shippers without the required `name` field is rejected with ERR_VALIDATION (422) before any persistence."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /market/shippers", payload: { paca_license: "PACA-001" }, as: MarketAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION, http 422"

      - name: customer_defaults_applied_on_create
        claim_type: defaults
        grounds: [entities.Customer.fields.terms_days, entities.Customer.fields.paca_special_agreement]
        distinguishing_aspect: "Omitting terms_days and paca_special_agreement yields defaults 10 and false; status starts ACTIVE; credit_exposure_cents starts 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /market/customers", payload: { name: "Buyer D", credit_limit_cents: 500000 }, as: MarketAdmin, captures: { terms: "$.data.terms_days", agr: "$.data.paca_special_agreement", st: "$.data.status", expo: "$.data.credit_exposure_cents" } }
          assert:
            - "terms_days == 10"
            - "paca_special_agreement == false"
            - "status == ACTIVE and credit_exposure_cents == 0"

      - name: commodity_invalid_ethylene_class_returns_validation
        claim_type: type_constraints
        grounds: [entities.Commodity.fields.ethylene_class, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "ethylene_class outside {PRODUCER, SENSITIVE, NEUTRAL} is a type-constraint violation -> ERR_VALIDATION (422)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /market/commodities", payload: { code: "XXX", name: "Mystery", ethylene_class: "EXPLOSIVE", temp_min_f: 34, temp_max_f: 40 }, as: MarketAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION, http 422"

      - name: purchase_lot_computed_fields_at_creation
        claim_type: computed_fields
        grounds: [entities.PurchaseLot.fields.available_units, entities.PurchaseLot.fields.provisional_cost_cents, calculations.lot_landed_cost]
        distinguishing_aspect: "On creation the system computes provisional/adjusted/payable (100000) and available_units == quantity_units (100); nothing about them is client-supplied."
        test_recipe:
          setup: ["Clock 2026-05-01T08:00:00Z; commodity + shipper + daily price band 8.00-12.00"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
          trigger:
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { prov: "$.data.provisional_cost_cents", adj: "$.data.adjusted_cost_cents", pay: "$.data.payable_cents", avl: "$.data.available_units", st: "$.data.status" } }
          assert:
            - "provisional_cost_cents == 100000 (100 * 10.00 * 100)"
            - "adjusted_cost_cents == 100000 and payable_cents == 100000 (FINAL not yet run)"
            - "available_units == 100 (no dumped/reserved/sold yet)"

      - name: get_purchase_lot_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET with a well-formed but unknown UUID -> ERR_NOT_FOUND (404), response_type error."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /market/purchase-lots/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Receiver, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: daily_price_mid_price_computed
        claim_type: computed_fields
        grounds: [entities.DailyPrice.fields.mid_price]
        distinguishing_aspect: "mid_price == round_half_up((low+high)/2, 2): 8.00 and 12.02 -> 10.01 exactly."
        test_recipe:
          setup: ["Commodity TOM exists"]
          setup_api_calls:
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55 }, as: MarketAdmin, captures: { com: "$.data.id" } }
          trigger:
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.02 }, as: MarketAdmin, captures: { mid: "$.data.mid_price" } }
          assert:
            - "mid_price == 10.01"

      - name: temperature_reading_in_band_not_out_of_range
        claim_type: computed_fields
        grounds: [entities.TemperatureReading.fields.out_of_range, calculations.cold_chain_accumulation]
        distinguishing_aspect: "A 50F reading inside the 45-55F band computes out_of_range == false and leaves violation_minutes at 0 and cold_chain_status OK."
        test_recipe:
          setup: ["Clock set; commodity band 45-55F; lot ORDERED (readings allowed in any lot status)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 10, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
          trigger:
            - { call: "POST /market/temperature-readings", payload: { purchase_lot_id: "${lot}", recorded_at: "2026-05-01T09:00:00Z", temp_f: 50, duration_minutes: 30 }, as: Receiver, captures: { oor: "$.data.out_of_range" } }
            - { call: "GET /market/purchase-lots/${lot}", payload: {}, as: Receiver, captures: { vm: "$.data.violation_minutes", ccs: "$.data.cold_chain_status" } }
          assert:
            - "out_of_range == false"
            - "lot.violation_minutes == 0 and cold_chain_status == OK"

      - name: invoice_dates_use_default_clock_when_unset
        claim_type: system_fields
        grounds: [entities.Invoice.fields.invoice_date, entities.Invoice.fields.due_date, entities.Invoice.fields.discount_eligible_until]
        distinguishing_aspect: "With no POST /_clock/set_current_utc ever issued, the logical clock reads its documented default 2026-05-01T00:00:00Z; the invoice issued under it stamps invoice_date 2026-05-01, due_date 2026-05-11 (terms_days 10), discount_eligible_until 2026-05-06."
        test_recipe:
          setup:
            - "No clock call in this chain: server default 2026-05-01T00:00:00Z holds"
            - "Lot ACCEPTED; customer terms_days 10; order delivery_date 2026-05-02 (next-day, clock time 00:00 <= 14:00 cut-off) confirmed, picked, delivered"
          setup_api_calls:
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/customers", payload: { name: "Buyer A", credit_limit_cents: 1000000, terms_days: 10 }, as: MarketAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-02", window_start: "08:00", window_end: "10:00", pallet_count: 1, lines: [ { lot_id: "${lot}", quantity: 1, unit_price: 50.00 } ] }, as: SalesDesk, captures: { ord: "$.data.id" } }
            - { call: "POST /market/sales-orders/${ord}/confirm", payload: {}, as: SalesDesk }
            - { call: "POST /market/sales-orders/${ord}/pick", payload: {}, as: Receiver }
            - { call: "POST /market/sales-orders/${ord}/deliver", payload: {}, as: Receiver }
          trigger:
            - { call: "POST /market/invoices", payload: { sales_order_id: "${ord}" }, as: BillingClerk, captures: { idate: "$.data.invoice_date", due: "$.data.due_date", elig: "$.data.discount_eligible_until" } }
          assert:
            - "invoice_date == 2026-05-01 (default clock, never set)"
            - "due_date == 2026-05-11 (invoice_date + terms_days 10)"
            - "discount_eligible_until == 2026-05-06 (invoice_date + 5 days)"

      - name: temperature_reading_is_immutable_without_version
        claim_type: immutability
        grounds: [entities.TemperatureReading, entities.TemperatureReading.fields.recorded_at]
        distinguishing_aspect: "TemperatureReading declares common_fields: false — its response carries id and created_at only; no version or updated_at fields exist, and no update/delete endpoint is declared for it (append-only probe log)."
        test_recipe:
          setup: ["Clock 2026-05-01T08:00:00Z; commodity + shipper + daily price; lot ORDERED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 10, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
          trigger:
            - { call: "POST /market/temperature-readings", payload: { purchase_lot_id: "${lot}", recorded_at: "2026-05-01T09:00:00Z", temp_f: 50, duration_minutes: 15 }, as: Receiver, captures: { rid: "$.data.id" } }
          assert:
            - "response data carries id and created_at"
            - "response data has no version and no updated_at field (common_fields: false)"

  - section: state_machines
    instances:
      - name: lot_initial_state_is_ordered
        claim_type: initial_state
        grounds: [state_machines.PurchaseLot]
        distinguishing_aspect: "A newly created lot starts in ORDERED with version 1."
        test_recipe:
          setup: ["Commodity, shipper, daily price in place"]
          setup_api_calls:
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
          trigger:
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 10, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { st: "$.data.status", v: "$.data.version" } }
          assert:
            - "status == ORDERED and version == 1"

      - name: receive_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PurchaseLot.ORDERED_to_RECEIVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RECEIVED -> receive is not in the transition table; second receive returns ERR_INVALID_STATE (409) and version does not advance."
        test_recipe:
          setup: ["Lot created and received once"]
          setup_api_calls:
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 10, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver, captures: { v1: "$.data.version" } }
          trigger:
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
            - "lot version remains ${v1} (no mutation on rejected transition)"

      - name: dispute_on_accepted_lot_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PurchaseLot.INSPECTED_to_DISPUTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "dispute is legal only from INSPECTED with a CERTIFIED FAIL; an ACCEPTED lot rejects dispute with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Lot fully accepted (PASS, defect 0)"]
          setup_api_calls:
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 10, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
          trigger:
            - { call: "POST /market/purchase-lots/${lot}/dispute", payload: { reason: "too late" }, as: Receiver, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"

      - name: cancel_delivered_order_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.SalesOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DELIVERED is past the cancellable set {PENDING, CONFIRMED, ON_HOLD}; cancel returns ERR_INVALID_STATE and no reservation movement occurs (already converted to sold)."
        test_recipe:
          setup: ["Order delivered (line 1 @ 10.00 on a 100-unit ACCEPTED lot)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/customers", payload: { name: "Buyer A", credit_limit_cents: 1000000 }, as: MarketAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-02", window_start: "08:00", window_end: "10:00", lines: [ { lot_id: "${lot}", quantity: 1, unit_price: 10.00 } ] }, as: SalesDesk, captures: { ord: "$.data.id" } }
            - { call: "POST /market/sales-orders/${ord}/confirm", payload: {}, as: SalesDesk }
            - { call: "POST /market/sales-orders/${ord}/pick", payload: {}, as: Receiver }
            - { call: "POST /market/sales-orders/${ord}/deliver", payload: {}, as: Receiver }
          trigger:
            - { call: "POST /market/sales-orders/${ord}/cancel", payload: {}, as: SalesDesk, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
            - "lot.sold_units == 1 unchanged (no compensation fired)"

      - name: close_lot_with_scheduled_booking_returns_invalid_state
        claim_type: precondition_enforcement
        grounds: [state_machines.PurchaseLot.ACCEPTED_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "An ACCEPTED lot cannot CLOSE while a SCHEDULED ripening booking references it; close returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Lot ACCEPTED; room R1; booking SCHEDULED 2026-05-02 10:00-12:00"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "BAN", name: "Banana", ethylene_class: "PRODUCER", temp_min_f: 56, temp_max_f: 62 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 5.00, high_price: 9.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 50, shipper_unit_price: 7.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/ripening-rooms", payload: { name: "R1", capacity_pallets: 50, ethylene_capable: true }, as: MarketAdmin, captures: { room: "$.data.id" } }
            - { call: "POST /market/ripening-bookings", payload: { room_id: "${room}", purchase_lot_id: "${lot}", pallet_count: 4, start_time: "2026-05-02T10:00:00Z", end_time: "2026-05-02T12:00:00Z", ethylene_enabled: false, target_stage: "STAGE_4" }, as: Receiver }
          trigger:
            - { call: "POST /market/purchase-lots/${lot}/close", payload: {}, as: Receiver, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
            - "lot remains ACCEPTED"

      - name: payment_on_paid_invoice_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.Invoice, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PAID is terminal for payments: a further payment attempt hits the state gate (priority 5) and returns ERR_INVALID_STATE, not the fiscal ERR_OVERPAYMENT, even though balance_cents == 0 < amount."
        test_recipe:
          setup: ["Invoice total 7500 fully paid on 2026-05-10 (past the discount window, so no discount): balance 0, status PAID"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
