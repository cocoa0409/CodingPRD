# =============================================================================
# Task 1252 — Composites & Fiberglass Fabrication (scaffold seed tables)
# =============================================================================

scenario: |
  generate task hard than expert level! 1252. Composites & Fiberglass Fabrication (composites fabricator): layup schedule & ply book, resin/catalyst ratio & pot-life window, cure cycle (oven/autoclave) & log, void/delamination inspection & repair, mold/plug maintenance, styrene emission permit, part weight tolerance, prototype tooling & production transition

domain_name: composites-fiberglass-fabrication
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit          # styrene permit quota, SoD inspection sign-off, cure log audit
  secondary_archetype: temporal_windowing      # pot-life windows, equipment windows, mold occupancy intervals
  complexity_layers:
    - optimistic_concurrency                   # OCC on PlyBook.version and Mold.version
    - cascading_side_effects                   # layup → resin → permit → posture; cure → mold wear → gating
    - dual_variant_calculation                 # pot-life nominal vs temperature-adjusted; weight tolerance prototype vs production
    - rate_threshold_triggers                  # permit quota, mold maintenance interval, inspection dispositions
  entity_topology: flat                        # peer entities linked by foreign keys, no nested URL ownership
  state_machine_shape: cyclic                  # WorkOrder repair loop; Mold maintenance loop; PlyBook supersede chain
  relationship_patterns:
    - one_to_many                              # Mold → WorkOrder, WorkOrder → Inspection/Repair/LayupSession/CureCycle
    - many_to_many                             # WorkOrder × ResinBatch via LayupSession junction
    - cross_aggregate                          # LayupSession.permit_id references the compliance aggregate
  role_model: segregation_of_duties            # inspector must not be a laminator of the same work order
  consistency_model: immediate                 # all derived fields updated inside the triggering request

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: EmissionPermit
    parent: null
    common_fields: true
    fields:
      - { name: permit_code, type: string, source: input, description: "Unique permit identifier (e.g. air-quality permit number)", constraints: "unique across all permits; ERR_DUPLICATE_CODE on conflict" }
      - { name: period_start, type: datetime, source: input, description: "Permit coverage window start (inclusive), ISO 8601 UTC" }
      - { name: period_end, type: datetime, source: input, description: "Permit coverage window end (exclusive), ISO 8601 UTC", constraints: "must be strictly after period_start" }
      - { name: styrene_quota_kg, type: number, source: input, description: "Maximum styrene emission allowance for the period, in kg", constraints: "> 0" }
      - { name: warning_threshold_pct, type: number, source: input, default: 0.85, description: "Fraction of quota at which over_warning flag is set on reads", constraints: "0 < value <= 1" }
      - { name: styrene_used_kg, type: number, source: computed, default: 0.0, description: "Sum of styrene_emitted_kg over LayupSessions with status ACTIVE whose permit_id == this permit; rounding pinned per calculations.styrene_emission_kg" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | CLOSED. ACTIVE at creation; EXHAUSTED set automatically when styrene_used_kg >= styrene_quota_kg; CLOSED via close action", constraints: "ACTIVE, EXHAUSTED, CLOSED" }

  - name: Mold
    parent: null
    common_fields: true
    fields:
      - { name: mold_code, type: string, source: input, description: "Unique mold/plug identifier", constraints: "unique; ERR_DUPLICATE_CODE on conflict" }
      - { name: tooling_phase, type: enum, source: input, default: "PROTOTYPE", description: "Tooling lifecycle phase: PROTOTYPE | TRANSITION | PRODUCTION. May be set to PROTOTYPE or PRODUCTION at creation; TRANSITION only via transition-phase", constraints: "PROTOTYPE, TRANSITION, PRODUCTION" }
      - { name: maintenance_interval_cycles, type: integer, source: input, description: "Number of completed mold-bearing cure cycles allowed before maintenance is due", constraints: ">= 1" }
      - { name: cycles_since_maintenance, type: integer, source: computed, default: 0, description: "Completed CureCycles with uses_mold=true on work orders of this mold since last completed maintenance" }
      - { name: prototype_parts_required, type: integer, source: input, description: "Accepted prototype parts required before promotion to TRANSITION", constraints: ">= 0" }
      - { name: prototype_parts_validated, type: integer, source: computed, default: 0, description: "Count of WorkOrders on this mold that transitioned to ACCEPTED while tooling_phase was PROTOTYPE; incremented at the ACCEPTED transition only" }
      - { name: status, type: enum, source: system, description: "ACTIVE | MAINTENANCE_DUE | IN_MAINTENANCE | RETIRED", constraints: "ACTIVE, MAINTENANCE_DUE, IN_MAINTENANCE, RETIRED" }

  - name: PlyBook
    parent: null
    common_fields: true
    fields:
      - { name: part_number, type: string, source: input, description: "Part number this layup schedule defines" }
      - { name: revision, type: string, source: input, description: "Revision label; (part_number, revision) pair is unique", constraints: "unique per part_number; ERR_DUPLICATE_CODE on conflict" }
      - { name: part_area_m2, type: number, source: input, description: "Net part surface area used by the theoretical weight calculation", constraints: "> 0" }
      - { name: plies, type: array, source: input, description: "Ordered ply schedule: array of {seq:int, material_code:string, orientation_deg:number, areal_weight_g_m2:number}", constraints: "at least 1 ply; seq unique and ascending" }
      - { name: resin_system, type: enum, source: input, description: "Resin chemistry required by this ply book", constraints: "POLYESTER, VINYL_ESTER, EPOXY" }
      - { name: target_fiber_volume_pct, type: number, source: input, description: "Target fiber volume fraction (0,1); drives theoretical part weight", constraints: "0 < value < 1" }
      - { name: tolerance_pct, type: number, source: input, default: 0.05, description: "Production weight-acceptance tolerance fraction", constraints: "0 < value <= 0.5" }
      - { name: max_repair_attempts, type: integer, source: input, default: 2, description: "Maximum Repairs that may be created per WorkOrder of this ply book", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | SUPERSEDED", constraints: "DRAFT, APPROVED, SUPERSEDED" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: work_order_no, type: string, source: input, description: "Unique work order number", constraints: "unique; ERR_DUPLICATE_CODE on conflict" }
      - { name: part_number, type: string, source: input, description: "Part being fabricated; must equal the referenced PlyBook.part_number" }
      - { name: mold_id, type: string, source: input, description: "FK -> Mold.id; the tool this order is laid up and cured on" }
      - { name: ply_book_id, type: string, source: input, description: "FK -> PlyBook.id; must reference an APPROVED ply book at creation" }
      - { name: pinned_ply_book_version, type: integer, source: system, description: "PlyBook.version captured at work order creation; the order is built to this revision even if the book is later superseded" }
      - { name: quantity, type: integer, source: input, description: "Number of parts in this order", constraints: ">= 1; on molds with tooling_phase PROTOTYPE or TRANSITION must be <= 5 (PROTOTYPE_MAX_QUANTITY)" }
      - { name: due_date, type: datetime, source: input, description: "Customer due date, ISO 8601 UTC" }
      - { name: target_part_weight_g, type: number, source: computed, description: "Theoretical per-part weight computed at creation via calculations.theoretical_part_weight_g" }
      - { name: actual_part_weight_g, type: number, source: input, description: "Measured per-part weight recorded at demold" }
      - { name: weight_deviation_pct, type: number, source: computed, description: "|actual_part_weight_g - target_part_weight_g| / target_part_weight_g, 4 decimals round_half_up, set at demold" }
      - { name: layup_started_at, type: datetime, source: system, description: "Logical-clock timestamp of the start-layup transition; mold occupancy interval start (closed)" }
      - { name: demolded_at, type: datetime, source: system, description: "Logical-clock timestamp of demold (or scrap after layup start); mold occupancy interval end (closed); null while occupied" }
      - { name: repair_count, type: integer, source: computed, default: 0, description: "Number of Repair entities ever created for this work order (any status)" }
      - { name: scrap_reason, type: enum, source: system, description: "WEIGHT_OUT_OF_TOLERANCE | INSPECTION_FAIL | MANUAL; set when status becomes SCRAPPED", constraints: "WEIGHT_OUT_OF_TOLERANCE, INSPECTION_FAIL, MANUAL" }
      - { name: status, type: enum, source: system, description: "RELEASED | LAYUP_IN_PROGRESS | AWAITING_CURE | CURE_SCHEDULED | IN_CURE | CURED | IN_INSPECTION | REPAIR | ACCEPTED | SCRAPPED", constraints: "see state_machines.WorkOrder" }

  - name: ResinBatch
    parent: null
    common_fields: true
    fields:
      - { name: batch_code, type: string, source: input, description: "Unique batch identifier", constraints: "unique; ERR_DUPLICATE_CODE on conflict" }
      - { name: resin_system, type: enum, source: input, description: "Resin chemistry of this batch", constraints: "POLYESTER, VINYL_ESTER, EPOXY" }
      - { name: resin_mass_g, type: number, source: input, description: "Resin component mass in grams", constraints: "> 0" }
      - { name: catalyst_mass_g, type: number, source: input, description: "Catalyst/hardener component mass in grams", constraints: "> 0" }
      - { name: target_ratio_pct, type: number, source: input, description: "Target catalyst mass as percent of resin mass", constraints: "> 0" }
      - { name: ratio_tolerance_pct, type: number, source: input, description: "Allowed absolute deviation of actual_ratio_pct from target_ratio_pct, in percentage points", constraints: "> 0" }
      - { name: actual_ratio_pct, type: number, source: computed, description: "catalyst_mass_g / resin_mass_g * 100, 4 decimals round_half_up" }
      - { name: nominal_pot_life_minutes, type: integer, source: input, description: "Nameplate pot life at the 20C reference temperature", constraints: ">= 1" }
      - { name: ambient_temp_c, type: number, source: input, description: "Shop ambient temperature at mix time; when present the temperature-adjusted pot-life variant applies", constraints: "optional; -10 to 60 when present" }
      - { name: effective_pot_life_minutes, type: integer, source: computed, description: "Per calculations.adjusted_pot_life_minutes: nominal when ambient_temp_c absent, otherwise temperature-adjusted" }
      - { name: mixed_at, type: datetime, source: system, description: "Logical-clock timestamp of batch creation" }
      - { name: expires_at, type: datetime, source: computed, description: "mixed_at + effective_pot_life_minutes" }
      - { name: total_mass_g, type: number, source: computed, description: "resin_mass_g + catalyst_mass_g" }
      - { name: consumed_mass_g, type: number, source: computed, default: 0, description: "Sum of resin_used_g over LayupSessions with status ACTIVE on this batch" }
      - { name: remaining_mass_g, type: number, source: computed, description: "total_mass_g - consumed_mass_g - quenched_mass_g" }
      - { name: quenched_mass_g, type: number, source: system, default: 0, description: "Mass disposed via quench; set to the remaining mass at quench time" }
      - { name: status, type: enum, source: system, description: "MIXED | PARTIALLY_CONSUMED | EXHAUSTED | EXPIRED | QUENCHED | REJECTED", constraints: "see state_machines.ResinBatch" }

  - name: LayupSession
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; must be LAYUP_IN_PROGRESS" }
      - { name: resin_batch_id, type: string, source: input, description: "FK -> ResinBatch.id; must be consumable (MIXED or PARTIALLY_CONSUMED, not past expires_at)" }
      - { name: permit_id, type: string, source: system, description: "FK -> EmissionPermit.id; the ACTIVE permit whose period covers session_at, resolved by the permit selector" }
      - { name: resin_used_g, type: number, source: input, description: "Mixed resin mass applied in this session", constraints: "> 0 and <= batch remaining_mass_g" }
      - { name: styrene_emitted_kg, type: number, source: computed, description: "Per calculations.styrene_emission_kg, rounded per session to 4 decimals before any aggregation" }
      - { name: laminator_id, type: string, source: system, description: "X-User-ID of the Laminator who performed the session; used by segregation-of-duties" }
      - { name: session_at, type: datetime, source: system, description: "Logical-clock timestamp of session creation" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOIDED", constraints: "ACTIVE, VOIDED" }

  - name: CureEquipment
    parent: null
    common_fields: true
    fields:
      - { name: equipment_code, type: string, source: input, description: "Unique equipment identifier", constraints: "unique; ERR_DUPLICATE_CODE on conflict" }
      - { name: kind, type: enum, source: input, description: "OVEN | AUTOCLAVE", constraints: "OVEN, AUTOCLAVE" }
      - { name: max_parts_per_cycle, type: integer, source: input, description: "Maximum combined part quantity of overlapping cycles on this equipment", constraints: ">= 1" }
      - { name: turnaround_minutes, type: integer, source: input, description: "Required gap after a cycle's scheduled_end before the next cycle's scheduled_start on AUTOCLAVE equipment; 0 for ovens", constraints: ">= 0" }
      - { name: max_temperature_c, type: number, source: input, description: "Maximum soak temperature the equipment supports", constraints: "> 0" }
      - { name: max_pressure_bar, type: number, source: input, description: "Maximum pressure; must be > 0 for AUTOCLAVE, 0 for OVEN", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OUT_OF_SERVICE", constraints: "AVAILABLE, OUT_OF_SERVICE" }

  - name: CureCycle
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; must be AWAITING_CURE or REPAIR" }
      - { name: equipment_id, type: string, source: input, description: "FK -> CureEquipment.id; must be AVAILABLE" }
      - { name: ramp_rate_c_per_min, type: number, source: input, description: "Programmed ramp rate", constraints: "> 0" }
      - { name: soak_temp_c, type: number, source: input, description: "Programmed soak temperature; must be <= equipment.max_temperature_c", constraints: "> 0" }
      - { name: soak_minutes, type: integer, source: input, description: "Programmed soak duration", constraints: ">= 1" }
      - { name: pressure_bar, type: number, source: input, description: "Autoclave pressure; required when equipment.kind == AUTOCLAVE (<= max_pressure_bar), must be absent when OVEN", constraints: "optional; conditional on equipment kind" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned window start, ISO 8601 UTC" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned window end (exclusive for overlap), ISO 8601 UTC", constraints: "strictly after scheduled_start" }
      - { name: uses_mold, type: boolean, source: computed, description: "True when the work order's demolded_at was null at cycle creation (first cure on the tool); false for post-repair re-cures" }
      - { name: recorded_min_temp_c, type: number, source: input, description: "Cure log: minimum recorded temperature, set at completion" }
      - { name: recorded_max_temp_c, type: number, source: input, description: "Cure log: maximum recorded temperature, set at completion" }
      - { name: recorded_soak_minutes, type: integer, source: input, description: "Cure log: achieved soak duration, set at completion" }
      - { name: recorded_ramp_rate_c_per_min, type: number, source: input, description: "Cure log: achieved ramp rate, set at completion" }
      - { name: cure_deviation_score, type: number, source: computed, description: "Per calculations.cure_deviation_score, set at completion" }
      - { name: cure_log_ok, type: boolean, source: computed, description: "Per calculations.cure_deviation_score acceptance rule, set at completion" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | RUNNING | COMPLETED | ABORTED", constraints: "SCHEDULED, RUNNING, COMPLETED, ABORTED" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; must be IN_INSPECTION" }
      - { name: inspector_id, type: string, source: system, description: "X-User-ID of the QualityInspector; must not equal laminator_id of any ACTIVE LayupSession on this work order (segregation of duties)" }
      - { name: method, type: enum, source: input, description: "NDT method used", constraints: "ULTRASONIC, TAP_TEST, VISUAL" }
      - { name: void_content_pct, type: number, source: input, description: "Measured void content percent", constraints: ">= 0" }
      - { name: delamination_area_cm2, type: number, source: input, description: "Measured total delamination area", constraints: ">= 0" }
      - { name: result, type: enum, source: computed, description: "PASS | REPAIR_REQUIRED | FAIL per calculations.inspection_disposition", constraints: "PASS, REPAIR_REQUIRED, FAIL" }
      - { name: inspected_at, type: datetime, source: system, description: "Logical-clock timestamp of inspection creation" }
      - { name: created_repair_id, type: string, source: system, description: "id of the Repair auto-created when result == REPAIR_REQUIRED; null otherwise" }

  - name: Repair
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; set at auto-creation from a REPAIR_REQUIRED inspection" }
      - { name: source_inspection_id, type: string, source: system, description: "FK -> Inspection.id; the inspection whose result created this repair" }
      - { name: repair_seq, type: integer, source: system, description: "1-based sequence of repairs on this work order, ordered by created_at" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | SUPERSEDED", constraints: "OPEN, CLOSED, SUPERSEDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EmissionPermit
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (automatic when styrene_used_kg >= styrene_quota_kg after a layup session posting)"
        actor: system
        preconditions: []
        side_effects:
          - "Permit no longer selected by the permit selector; subsequent layup sessions covering this period fail with ERR_NO_ACTIVE_PERMIT"
        note: "Boundary: styrene_used_kg exactly == styrene_quota_kg flips the permit to EXHAUSTED and the posting session itself succeeds (post-add <= quota is the admission rule)"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /emission-permits/{id}/close"
        actor: EHSOfficer
        preconditions: []
        side_effects: []
      - from: EXHAUSTED
        to: CLOSED
        trigger: "POST /emission-permits/{id}/close"
        actor: EHSOfficer
        preconditions: []
        side_effects: []

  - entity: Mold
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      # --- maintenance dimension (cyclic: ACTIVE -> MAINTENANCE_DUE -> IN_MAINTENANCE -> ACTIVE) ---
      - from: ACTIVE
        to: MAINTENANCE_DUE
        trigger: "system (automatic on CureCycle completion when uses_mold=true and the increment makes cycles_since_maintenance >= maintenance_interval_cycles)"
        actor: system
        preconditions: []
        side_effects:
          - "Work order creation with this mold still allowed, but start-layup and mold-bearing cure scheduling now fail with ERR_MOLD_NOT_AVAILABLE"
      - from: MAINTENANCE_DUE
        to: IN_MAINTENANCE
        trigger: "POST /molds/{id}/start-maintenance"
        actor: ToolingEngineer
        preconditions: []
        side_effects: []
      - from: IN_MAINTENANCE
        to: ACTIVE
        trigger: "POST /molds/{id}/complete-maintenance"
        actor: ToolingEngineer
        preconditions: []
        side_effects:
          - "cycles_since_maintenance reset to 0"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /molds/{id}/retire"
        actor: ToolingEngineer
        preconditions:
          - "No WorkOrder on this mold with layup_started_at set and demolded_at null (mold currently occupied)"
        side_effects: []
      - from: MAINTENANCE_DUE
        to: RETIRED
        trigger: "POST /molds/{id}/retire"
        actor: ToolingEngineer
        preconditions:
          - "No WorkOrder on this mold with layup_started_at set and demolded_at null"
        side_effects: []
      # --- tooling_phase dimension (parallel state axis; cyclic revert TRANSITION -> PROTOTYPE) ---
      - from: PROTOTYPE
        to: TRANSITION
        trigger: "POST /molds/{id}/transition-phase with target_phase=TRANSITION"
        actor: ToolingEngineer
        preconditions:
          - "prototype_parts_validated >= prototype_parts_required (ERR_TOOLING_PHASE_GATE)"
        side_effects: []
        note: "tooling_phase transitions are guarded by Mold.status != RETIRED (ERR_INVALID_STATE from terminal)"
      - from: TRANSITION
        to: PRODUCTION
        trigger: "POST /molds/{id}/transition-phase with target_phase=PRODUCTION"
        actor: ToolingEngineer
        preconditions:
          - "No WorkOrder on this mold in a non-terminal status (any status other than ACCEPTED or SCRAPPED) (ERR_TOOLING_PHASE_GATE)"
        side_effects: []
      - from: TRANSITION
        to: PROTOTYPE
        trigger: "POST /molds/{id}/transition-phase with target_phase=PROTOTYPE"
        actor: ToolingEngineer
        preconditions: []
        side_effects: []
        note: "Deliberate revert: a failed production-transition trial sends the tool back to prototype"

  - entity: PlyBook
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /ply-books/{id}/approve"
        actor: ToolingEngineer
        preconditions: []
        side_effects:
          - "Any other PlyBook with the same part_number in APPROVED status -> SUPERSEDED (revision supersede cascade)"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (automatic when a newer revision of the same part_number is approved)"
        actor: system
        preconditions: []
        side_effects:
          - "Existing WorkOrders keep building to pinned_ply_book_version; new WorkOrders must reference an APPROVED revision"

  - entity: WorkOrder
    initial_state: RELEASED
    terminal_states: [ACCEPTED, SCRAPPED]
    transitions:
      - from: RELEASED
        to: LAYUP_IN_PROGRESS
        trigger: "POST /work-orders/{id}/start-layup"
        actor: Laminator
        preconditions:
          - "mold.status == ACTIVE (ERR_MOLD_NOT_AVAILABLE)"
          - "An EmissionPermit with status ACTIVE whose [period_start, period_end) contains the current logical time must exist (ERR_NO_ACTIVE_PERMIT)"
          - "Mold occupancy: no other WorkOrder on the same mold with layup_started_at set and demolded_at null, and the current logical time must be strictly greater than every prior occupant's demolded_at (closed-interval semantics; ERR_MOLD_OCCUPANCY_CONFLICT)"
        side_effects:
          - "layup_started_at = current logical time (mold occupancy begins)"
      - from: LAYUP_IN_PROGRESS
        to: AWAITING_CURE
        trigger: "POST /work-orders/{id}/complete-layup"
        actor: Laminator
        preconditions:
          - "At least one LayupSession with status ACTIVE exists for this work order (ERR_INVALID_STATE)"
        side_effects: []
      - from: AWAITING_CURE
        to: CURE_SCHEDULED
        trigger: "POST /cure-cycles"
        actor: CureTechnician
        preconditions:
          - "When demolded_at is null (first cure): mold.status == ACTIVE (ERR_MOLD_NOT_AVAILABLE); when in REPAIR / demolded_at set: mold gate skipped"
        side_effects:
          - "CureCycle created in SCHEDULED with uses_mold = (demolded_at IS NULL)"
      - from: REPAIR
        to: CURE_SCHEDULED
        trigger: "POST /cure-cycles"
        actor: CureTechnician
        preconditions: []
        side_effects:
          - "CureCycle created in SCHEDULED with uses_mold = false (part already demolded; bench repair re-cure)"
      - from: CURE_SCHEDULED
        to: IN_CURE
        trigger: "POST /cure-cycles/{id}/start"
        actor: CureTechnician
        preconditions: []
        side_effects: []
      - from: IN_CURE
        to: CURED
        trigger: "POST /cure-cycles/{id}/complete with cure_log_ok == true"
        actor: CureTechnician
        preconditions: []
        side_effects:
          - "weight acceptance now pending at demold"
      - from: IN_CURE
        to: AWAITING_CURE
        trigger: "POST /cure-cycles/{id}/complete with cure_log_ok == false"
        actor: CureTechnician
        preconditions: []
        side_effects:
          - "Work order must be re-cured; this is the re-cure loop edge of the cyclic machine"
      - from: IN_CURE
        to: AWAITING_CURE
        trigger: "POST /cure-cycles/{id}/abort"
        actor: CureTechnician
        preconditions: []
        side_effects: []
      - from: CURED
        to: IN_INSPECTION
        trigger: "POST /work-orders/{id}/demold with weight acceptance PASS"
        actor: Laminator
        preconditions: []
        side_effects:
          - "demolded_at = current logical time (mold occupancy ends)"
          - "weight_deviation_pct recorded"
      - from: CURED
        to: SCRAPPED
        trigger: "POST /work-orders/{id}/demold with weight acceptance FAIL"
        actor: Laminator
        preconditions: []
        side_effects:
          - "demolded_at = current logical time"
          - "scrap_reason = WEIGHT_OUT_OF_TOLERANCE"
      - from: IN_INSPECTION
        to: ACCEPTED
        trigger: "POST /inspections with computed result PASS"
        actor: QualityInspector
        preconditions: []
        side_effects:
          - "All Repairs on this work order with status OPEN -> CLOSED"
          - "If mold.tooling_phase == PROTOTYPE at this moment: mold.prototype_parts_validated += 1"
      - from: IN_INSPECTION
        to: REPAIR
        trigger: "POST /inspections with computed result REPAIR_REQUIRED"
        actor: QualityInspector
        preconditions:
          - "repair_count < ply_book.max_repair_attempts, otherwise the inspection itself is rejected with ERR_REPAIR_LIMIT_EXCEEDED"
        side_effects:
          - "Repair auto-created (status OPEN, source_inspection_id = this inspection, repair_seq = repair_count + 1)"
          - "repair_count += 1"
      - from: IN_INSPECTION
        to: SCRAPPED
        trigger: "POST /inspections with computed result FAIL"
        actor: QualityInspector
        preconditions: []
        side_effects:
          - "scrap_reason = INSPECTION_FAIL"
          - "All Repairs on this work order with status OPEN -> SUPERSEDED"
      - from: RELEASED
        to: SCRAPPED
        trigger: "POST /work-orders/{id}/scrap"
        actor: ShopManager
        preconditions: []
        side_effects: ["scrap_reason = MANUAL"]
      - from: LAYUP_IN_PROGRESS
        to: SCRAPPED
        trigger: "POST /work-orders/{id}/scrap"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "scrap_reason = MANUAL"
          - "demolded_at = current logical time (compensation: frees mold occupancy)"
      - from: AWAITING_CURE
        to: SCRAPPED
        trigger: "POST /work-orders/{id}/scrap"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "scrap_reason = MANUAL"
          - "If demolded_at is null: demolded_at = current logical time (compensation: frees mold occupancy)"
      - from: CURE_SCHEDULED
        to: SCRAPPED
        trigger: "POST /work-orders/{id}/scrap"
        actor: ShopManager
        preconditions:
          - "Any CureCycle of this work order in SCHEDULED status is moved to ABORTED first (compensation)"
        side_effects:
          - "scrap_reason = MANUAL"
          - "If demolded_at is null: demolded_at = current logical time"
      - from: REPAIR
        to: SCRAPPED
        trigger: "POST /work-orders/{id}/scrap"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "scrap_reason = MANUAL"
          - "All Repairs with status OPEN -> SUPERSEDED"

  - entity: ResinBatch
    initial_state: MIXED
    terminal_states: [EXHAUSTED, EXPIRED, QUENCHED, REJECTED]
    transitions:
      - from: MIXED
        to: REJECTED
        trigger: "system (evaluated at creation: |actual_ratio_pct - target_ratio_pct| > ratio_tolerance_pct)"
        actor: system
        preconditions: []
        side_effects:
          - "Batch persisted but can never be consumed (ERR_RESIN_BATCH_NOT_USABLE)"
        note: "Creation itself succeeds with 201; the batch is born REJECTED"
      - from: MIXED
        to: PARTIALLY_CONSUMED
        trigger: "POST /layup-sessions leaving 0 < remaining_mass_g < total_mass_g"
        actor: Laminator
        preconditions:
          - "current logical time <= expires_at (ERR_RESIN_POT_LIFE_EXPIRED)"
          - "resin_used_g <= remaining_mass_g (ERR_RESIN_MASS_INSUFFICIENT)"
        side_effects:
          - "consumed_mass_g += resin_used_g (link 1 of the layup cascade)"
          - "The resin consumption posts the session's styrene_emitted_kg to the selected EmissionPermit: permit.styrene_used_kg += styrene_emitted_kg (link 2)"
          - "When that posting makes permit.styrene_used_kg >= permit.styrene_quota_kg, the permit flips ACTIVE -> EXHAUSTED (link 3)"
      - from: PARTIALLY_CONSUMED
        to: PARTIALLY_CONSUMED
        trigger: "POST /layup-sessions leaving 0 < remaining_mass_g"
        actor: Laminator
        preconditions:
          - "current logical time <= expires_at (ERR_RESIN_POT_LIFE_EXPIRED)"
          - "resin_used_g <= remaining_mass_g (ERR_RESIN_MASS_INSUFFICIENT)"
        side_effects:
          - "Same three-link cascade as MIXED -> PARTIALLY_CONSUMED (consume -> permit posting -> quota flip)"
      - from: MIXED
        to: EXHAUSTED
        trigger: "POST /layup-sessions leaving remaining_mass_g == 0 exactly"
        actor: Laminator
        preconditions:
          - "current logical time <= expires_at (ERR_RESIN_POT_LIFE_EXPIRED)"
        side_effects:
          - "Same three-link cascade as MIXED -> PARTIALLY_CONSUMED"
        note: "Boundary: resin_used_g exactly == remaining_mass_g is allowed and yields EXHAUSTED"
      - from: PARTIALLY_CONSUMED
        to: EXHAUSTED
        trigger: "POST /layup-sessions leaving remaining_mass_g == 0 exactly"
        actor: Laminator
        preconditions:
          - "current logical time <= expires_at (ERR_RESIN_POT_LIFE_EXPIRED)"
        side_effects:
          - "Same three-link cascade as MIXED -> PARTIALLY_CONSUMED"
      - from: MIXED
        to: EXPIRED
        trigger: "system (lazy evaluation: on any read of the batch or any layup session attempt, when current logical time > expires_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_CONSUMED
        to: EXPIRED
        trigger: "system (lazy evaluation as above)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MIXED
        to: QUENCHED
        trigger: "POST /resin-batches/{id}/quench"
        actor: Laminator
        preconditions: []
        side_effects:
          - "quenched_mass_g = remaining_mass_g at quench time; remaining_mass_g becomes 0"
      - from: PARTIALLY_CONSUMED
        to: QUENCHED
        trigger: "POST /resin-batches/{id}/quench"
        actor: Laminator
        preconditions: []
        side_effects:
          - "quenched_mass_g = remaining_mass_g at quench time; remaining_mass_g becomes 0"

  - entity: LayupSession
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /layup-sessions/{id}/void"
        actor: ShopManager
        preconditions:
          - "The session's ResinBatch must not be QUENCHED (ERR_INVALID_STATE: disposed mass cannot be returned)"
        side_effects:
          - "Compensation on ResinBatch: consumed_mass_g -= resin_used_g; remaining_mass_g += resin_used_g; status recomputed: remaining == total -> MIXED, 0 < remaining < total -> PARTIALLY_CONSUMED"
          - "Compensation on EmissionPermit: permit.styrene_used_kg -= this session's stored styrene_emitted_kg (exact stored value, never recomputed); if permit was EXHAUSTED and the subtraction makes styrene_used_kg < styrene_quota_kg, permit -> ACTIVE"

  - entity: CureEquipment
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /cure-equipment/{id}/out-of-service"
        actor: ShopManager
        preconditions:
          - "No CureCycle on this equipment in RUNNING status (ERR_INVALID_STATE)"
        side_effects: []
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "POST /cure-equipment/{id}/return-to-service"
        actor: ShopManager
        preconditions: []
        side_effects: []

  - entity: CureCycle
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /cure-cycles/{id}/start"
        actor: CureTechnician
        preconditions:
          - "equipment.status == AVAILABLE (ERR_EQUIPMENT_NOT_AVAILABLE)"
        side_effects:
          - "WorkOrder CURE_SCHEDULED -> IN_CURE"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /cure-cycles/{id}/complete"
        actor: CureTechnician
        preconditions: []
        side_effects:
          - "cure_deviation_score and cure_log_ok computed per calculations.cure_deviation_score"
          - "WorkOrder IN_CURE -> CURED when cure_log_ok, else IN_CURE -> AWAITING_CURE (re-cure loop)"
          - "Cascade link 1 (only when uses_mold == true): mold.cycles_since_maintenance += 1"
          - "Cascade link 2: when the increment makes cycles_since_maintenance >= maintenance_interval_cycles, mold ACTIVE -> MAINTENANCE_DUE, which gates further start-layup and first-cure scheduling on that tool"
      - from: RUNNING
        to: ABORTED
        trigger: "POST /cure-cycles/{id}/abort"
        actor: CureTechnician
        preconditions: []
        side_effects:
          - "WorkOrder IN_CURE -> AWAITING_CURE"
          - "mold.cycles_since_maintenance NOT incremented (aborted runs cause no maintenance wear)"

  - entity: Repair
    initial_state: OPEN
    terminal_states: [CLOSED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system (when a later Inspection on the same work order computes result PASS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: SUPERSEDED
        trigger: "system (when a later Inspection on the same work order computes result REPAIR_REQUIRED and a new Repair is created, or result FAIL and the work order is scrapped)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: plybook-patch-stale-version
    parent_entity: PlyBook
    write_endpoint: "PATCH /ply-books/{id}"
    occ_field: expected_ply_book_version
    description: |
      Patching a DRAFT PlyBook whose version has advanced since the client last
      observed it is rejected. A DRAFT stays patchable across many edits, so a
      second edit sent after a first edit completes observes no state-machine
      change; only the version check reveals that the client's base is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: mold-update-stale-version
    parent_entity: Mold
    write_endpoint: "PATCH /molds/{id}"
    occ_field: expected_mold_version
    description: |
      Updating a Mold's maintenance_interval_cycles or prototype_parts_required
      against a version the client no longer holds current is rejected. Neither
      field is part of any state machine, so a later update observes unchanged
      status and would silently overwrite an intervening edit without OCC.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: theoretical_part_weight_g
    trigger: "WorkOrder creation (stored on target_part_weight_g)"
    algorithm: forward_looking
    formula: |
      fiber_mass_g = sum over plies p of (p.areal_weight_g_m2 * part_area_m2)
      theoretical_part_weight_g = fiber_mass_g / target_fiber_volume_pct
      All inputs come from the pinned PlyBook revision (pinned_ply_book_version),
      never from a later revision.
    input_set: "The referenced PlyBook's plies, part_area_m2, target_fiber_volume_pct"
    precision: "1 decimal place, round_half_up"

  - name: weight_acceptance
    trigger: "POST /work-orders/{id}/demold"
    algorithm: threshold
    formula: |
      deviation = abs(actual_part_weight_g - target_part_weight_g) / target_part_weight_g
      deviation = round(deviation, 4) with round_half_up
      tolerance = ply_book.tolerance_pct            when mold.tooling_phase == PRODUCTION
      tolerance = PROTOTYPE_TOLERANCE_PCT           when mold.tooling_phase in {PROTOTYPE, TRANSITION}
      PASS (work order -> IN_INSPECTION) when deviation <= tolerance
      FAIL (work order -> SCRAPPED)      when deviation >  tolerance
      Boundary: deviation exactly == tolerance PASSES.
    input_set: "The demolding WorkOrder, its pinned PlyBook, its Mold's current tooling_phase"
    constants:
      PROTOTYPE_TOLERANCE_PCT: 0.08
    precision: "4 decimal places, round_half_up"
    variants:
      - name: production_acceptance
        when: "mold.tooling_phase == PRODUCTION at demold time"
        difference: "tolerance = pinned PlyBook.tolerance_pct (e.g. 0.05)"
      - name: prototype_acceptance
        when: "mold.tooling_phase in {PROTOTYPE, TRANSITION} at demold time"
        difference: "tolerance = PROTOTYPE_TOLERANCE_PCT (0.08); identical actual weight can pass on a prototype tool and scrap on a production tool"

  - name: adjusted_pot_life_minutes
    trigger: "ResinBatch creation (sets effective_pot_life_minutes and expires_at)"
    algorithm: decay_function
    formula: |
      nominal variant: effective = nominal_pot_life_minutes
      temperature-adjusted variant (ambient_temp_c present):
        effective = round_half_up(nominal_pot_life_minutes * 0.5 ** ((ambient_temp_c - 20) / 10))
        effective = max(effective, 5)
      expires_at = mixed_at + effective minutes
      A batch is expired when current logical time > expires_at (strictly greater;
      at exactly expires_at it is still usable).
    input_set: "The ResinBatch being created"
    constants:
      REFERENCE_TEMP_C: 20
      HALVING_STEP_C: 10
      MIN_POT_LIFE_MINUTES: 5
    precision: "integer minutes, round_half_up"
    variants:
      - name: nominal
        when: "ambient_temp_c is omitted"
        difference: "effective = nominal_pot_life_minutes; no temperature derate"
      - name: temperature_adjusted
        when: "ambient_temp_c is provided"
        difference: "pot life halves per 10C above the 20C reference (and doubles per 10C below), floored at 5 minutes; identical nominal pot life yields a shorter window in a hot shop"

  - name: cure_deviation_score
    trigger: "POST /cure-cycles/{id}/complete"
    algorithm: weighted_scoring
    formula: |
      temp_term  = 2.0 * max(0, abs(recorded_max_temp_c - soak_temp_c) - 10)
      soak_term  = 1.5 * max(0, soak_minutes - recorded_soak_minutes)
      ramp_term  = 1.0 * max(0, abs(recorded_ramp_rate_c_per_min - ramp_rate_c_per_min) - 0.5)
      score = temp_term + soak_term + ramp_term
      Auto-reject branch (evaluated first): when recorded_max_temp_c > soak_temp_c + 8,
        cure_log_ok = false regardless of score.
      Otherwise: cure_log_ok = (score <= 5.0). Boundary: score exactly 5.0 passes.
    input_set: "The completing CureCycle's program fields and recorded log fields"
    constants:
      TEMP_SLACK_C: 10
      TEMP_AUTOREJECT_OVER_C: 8
      SOAK_WEIGHT: 1.5
      TEMP_WEIGHT: 2.0
      RAMP_SLACK: 0.5
      PASS_MAX_SCORE: 5.0
    precision: "1 decimal place, round_half_up"

  - name: styrene_emission_kg
    trigger: "LayupSession creation (per-session value); EmissionPermit.styrene_used_kg (aggregation)"
    algorithm: aggregation
    formula: |
      Per session (rounding order pinned — round per session FIRST, then sum):
        session_kg = round(resin_used_g * STYRENE_CONTENT[batch.resin_system] * EMISSION_FACTOR / 1000, 4)
      Permit aggregate:
        styrene_used_kg = sum of session_kg over LayupSessions with status ACTIVE
                          whose permit_id == permit.id
      Voiding subtracts the session's stored session_kg exactly (no recomputation).
    input_set: "LayupSessions with status ACTIVE linked to the permit"
    constants:
      STYRENE_CONTENT_POLYESTER: 0.35
      STYRENE_CONTENT_VINYL_ESTER: 0.40
      STYRENE_CONTENT_EPOXY: 0.0
      EMISSION_FACTOR: 0.10
    precision: "4 decimal places, round_half_up, applied per session before summation"

  - name: inspection_disposition
    trigger: "POST /inspections (computes result)"
    algorithm: threshold
    formula: |
      PASS            when void_content_pct <= 2.0 AND delamination_area_cm2 == 0
      REPAIR_REQUIRED when void_content_pct <= 4.0 AND delamination_area_cm2 <= 25.0
      FAIL            otherwise
      Boundaries: void_content_pct exactly 2.0 with zero delamination PASSES;
      void exactly 4.0 with delamination exactly 25.0 is REPAIR_REQUIRED.
    input_set: "The Inspection's measured fields"
    constants:
      PASS_MAX_VOID_PCT: 2.0
      REPAIR_MAX_VOID_PCT: 4.0
      REPAIR_MAX_DELAM_CM2: 25.0
    precision: "inputs compared as given"

  - name: prototype_parts_validated
    trigger: "WorkOrder transition IN_INSPECTION -> ACCEPTED"
    algorithm: aggregation
    formula: |
      Increment mold.prototype_parts_validated by 1 when the accepting WorkOrder's
      mold has tooling_phase == PROTOTYPE at the moment of acceptance.
      Promotion gate: PROTOTYPE -> TRANSITION requires
      prototype_parts_validated >= prototype_parts_required (boundary: equal promotes).
    input_set: "WorkOrders of this mold reaching ACCEPTED while tooling_phase == PROTOTYPE"

  - name: equipment_window_capacity
    trigger: "POST /cure-cycles (admission control on the equipment window)"
    algorithm: interval_merge
    formula: |
      Let W = [scheduled_start, scheduled_end) of the new cycle (half-open: a
      window starting exactly at another's end does NOT overlap it).
      Candidates = CureCycles on the same equipment with status in {SCHEDULED, RUNNING}.
      Overlap(C, W) := C.scheduled_start < W.end AND W.start < C.scheduled_end.
      Reject with ERR_EQUIPMENT_CAPACITY_EXCEEDED when
        (sum of work_order.quantity over overlapping candidates) + new work_order.quantity
        > equipment.max_parts_per_cycle.
      AUTOCLAVE turnaround (independent additional rule): for equipment.kind ==
      AUTOCLAVE, for every candidate C require new.scheduled_start >= C.scheduled_end
      + turnaround_minutes OR new.scheduled_end + turnaround_minutes <=
      C.scheduled_start; violation -> ERR_TURNAROUND_BUFFER_VIOLATION.
      Boundary: scheduled_start exactly == C.scheduled_end + turnaround_minutes passes (>=).
      Ovens apply turnaround_minutes = 0, so adjacency is always allowed on ovens.
    input_set: "CureCycles with status in {SCHEDULED, RUNNING} on the same equipment"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id in the path and every FK id in the body exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: "Required fields present, types valid, enum members valid, ranges valid (masses > 0, percents in range, quantity >= 1, period_end > period_start)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version on PATCH endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /ply-books/{id}, PATCH /molds/{id}"

  - priority: 6
    category: state
    check: "Target entity is in a state from which the requested transition exists (incl. PlyBook DRAFT for patch/approve -> ERR_PLY_BOOK_NOT_DRAFT; ResinBatch consumable status -> ERR_RESIN_BATCH_NOT_USABLE; WorkOrder in the required status; LayupSession batch not QUENCHED on void)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Compliance gates on layup: an ACTIVE EmissionPermit covers current logical time (ERR_NO_ACTIVE_PERMIT); session's post-add styrene_used_kg <= styrene_quota_kg (ERR_PERMIT_QUOTA_EXCEEDED); resin batch not past expires_at (ERR_RESIN_POT_LIFE_EXPIRED)"
    error_id: ERR_NO_ACTIVE_PERMIT
    http_status: 409
    applies_to: "POST /work-orders/{id}/start-layup, POST /layup-sessions"

  - priority: 8
    category: business_constraint
    check: "Cross-entity configuration gates: mold available for layup/first cure (ERR_MOLD_NOT_AVAILABLE); ply book APPROVED and part_number matches (ERR_PLY_BOOK_NOT_APPROVED); batch resin_system == ply book resin_system (ERR_RESIN_SYSTEM_MISMATCH); prototype quantity cap (ERR_PROTOTYPE_QUANTITY_CAP); tooling phase gates (ERR_TOOLING_PHASE_GATE); inspector is not a laminator of this work order (ERR_SOD_INSPECTOR_LAMINATOR); repair_count < max_repair_attempts (ERR_REPAIR_LIMIT_EXCEEDED); uniqueness of codes (ERR_DUPLICATE_CODE); equipment AVAILABLE (ERR_EQUIPMENT_NOT_AVAILABLE)"
    error_id: ERR_MOLD_NOT_AVAILABLE
    http_status: 409
    applies_to: "work order, layup session, cure cycle, inspection, mold phase endpoints"

  - priority: 9
    category: business_temporal
    check: "Temporal/geometric rules: mold occupancy closed interval (ERR_MOLD_OCCUPANCY_CONFLICT); scheduled_end strictly after scheduled_start (ERR_INVALID_WINDOW); pressure only on autoclave and within envelope (ERR_PRESSURE_REQUIRES_AUTOCLAVE, ERR_CURE_ENVELOPE_EXCEEDED); autoclave turnaround buffer (ERR_TURNAROUND_BUFFER_VIOLATION)"
    error_id: ERR_MOLD_OCCUPANCY_CONFLICT
    http_status: 409
    applies_to: "POST /work-orders/{id}/start-layup, POST /cure-cycles"

  - priority: 10
    category: business_fiscal
    check: "Capacity: sum of part quantities of overlapping cycles + new quantity <= equipment.max_parts_per_cycle"
    error_id: ERR_EQUIPMENT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /cure-cycles"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving endpoint) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any call) is exactly 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time. All timestamps stamped by the system (mixed_at, session_at, layup_started_at, demolded_at, inspected_at) read this clock."
    roles: [ShopManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

  # --- EmissionPermit ---
  - method: POST
    path: "/emission-permits"
    description: "Register a styrene emission permit for a period"
    roles: [EHSOfficer]
    code: 201
    input: [permit_code, period_start, period_end, styrene_quota_kg, "warning_threshold_pct?"]
    output: EmissionPermit
    side_effects: ["status=ACTIVE, styrene_used_kg=0.0"]

  - method: GET
    path: "/emission-permits/{id}"
    description: "Get a permit (includes computed styrene_used_kg and status)"
    roles: [ShopManager, ToolingEngineer, Laminator, CureTechnician, QualityInspector, EHSOfficer]
    code: 200
    input: []
    output: EmissionPermit
    side_effects: []

  - method: POST
    path: "/emission-permits/{id}/close"
    description: "Close a permit (terminal)"
    roles: [EHSOfficer]
    code: 200
    input: []
    output: EmissionPermit
    side_effects: ["status -> CLOSED"]

  # --- Mold ---
  - method: POST
    path: "/molds"
    description: "Register a mold/plug"
    roles: [ToolingEngineer]
    code: 201
    input: [mold_code, maintenance_interval_cycles, prototype_parts_required, "tooling_phase?"]
    output: Mold
    side_effects: ["status=ACTIVE, cycles_since_maintenance=0, prototype_parts_validated=0, tooling_phase defaults PROTOTYPE"]

  - method: GET
    path: "/molds/{id}"
    description: "Get a mold"
    roles: [ShopManager, ToolingEngineer, Laminator, CureTechnician, QualityInspector, EHSOfficer]
    code: 200
    input: []
    output: Mold
    side_effects: []

  - method: PATCH
    path: "/molds/{id}"
    description: "Update mold maintenance parameters (OCC-guarded)"
    roles: [ToolingEngineer]
    code: 200
    input: [expected_mold_version, "maintenance_interval_cycles?", "prototype_parts_required?"]
    output: Mold
    side_effects: ["increments Mold.version by 1"]

  - method: POST
    path: "/molds/{id}/start-maintenance"
    description: "Begin maintenance on a MAINTENANCE_DUE mold"
    roles: [ToolingEngineer]
    code: 200
    input: []
    output: Mold
    side_effects: ["status -> IN_MAINTENANCE, increments Mold.version by 1"]

  - method: POST
    path: "/molds/{id}/complete-maintenance"
    description: "Finish maintenance; resets cycle counter"
    roles: [ToolingEngineer]
    code: 200
    input: []
    output: Mold
    side_effects: ["status -> ACTIVE, cycles_since_maintenance = 0, increments Mold.version by 1"]

  - method: POST
    path: "/molds/{id}/transition-phase"
    description: "Advance tooling phase (PROTOTYPE->TRANSITION->PRODUCTION) or revert TRANSITION->PROTOTYPE"
    roles: [ToolingEngineer]
    code: 200
    input: [target_phase]
    output: Mold
    side_effects: ["tooling_phase -> target_phase per guards, increments Mold.version by 1"]

  - method: POST
    path: "/molds/{id}/retire"
    description: "Retire a mold (terminal)"
    roles: [ToolingEngineer]
    code: 200
    input: []
    output: Mold
    side_effects: ["status -> RETIRED, increments Mold.version by 1"]

  # --- PlyBook ---
  - method: POST
    path: "/ply-books"
    description: "Create a ply book (layup schedule) in DRAFT"
    roles: [ToolingEngineer]
    code: 201
    input: [part_number, revision, part_area_m2, plies, resin_system, target_fiber_volume_pct, "tolerance_pct?", "max_repair_attempts?"]
    output: PlyBook
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/ply-books/{id}"
    description: "Get a ply book"
    roles: [ShopManager, ToolingEngineer, Laminator, CureTechnician, QualityInspector, EHSOfficer]
    code: 200
    input: []
    output: PlyBook
    side_effects: []

  - method: PATCH
    path: "/ply-books/{id}"
    description: "Edit a DRAFT ply book (OCC-guarded)"
    roles: [ToolingEngineer]
    code: 200
    input: [expected_ply_book_version, "part_area_m2?", "plies?", "target_fiber_volume_pct?", "tolerance_pct?", "max_repair_attempts?"]
    output: PlyBook
    side_effects: ["increments PlyBook.version by 1"]

  - method: POST
    path: "/ply-books/{id}/approve"
    description: "Approve a DRAFT ply book; supersedes the previously APPROVED revision of the same part_number"
    roles: [ToolingEngineer]
    code: 200
    input: []
    output: PlyBook
    side_effects: ["status -> APPROVED, increments PlyBook.version by 1", "prior APPROVED revision with same part_number -> SUPERSEDED"]

  # --- WorkOrder ---
  - method: POST
    path: "/work-orders"
    description: "Release a work order against an approved ply book and an available mold"
    roles: [ShopManager]
    code: 201
    input: [work_order_no, part_number, mold_id, ply_book_id, quantity, due_date]
    output: WorkOrder
    side_effects: ["status=RELEASED", "pinned_ply_book_version = PlyBook.version at creation", "target_part_weight_g computed per calculations.theoretical_part_weight_g"]

  - method: GET
    path: "/work-orders/{id}"
    description: "Get a work order"
    roles: [ShopManager, ToolingEngineer, Laminator, CureTechnician, QualityInspector, EHSOfficer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/work-orders"
    description: "List work orders with pagination and filters"
    roles: [ShopManager, ToolingEngineer, Laminator, CureTechnician, QualityInspector, EHSOfficer]
    code: 200
    input: ["mold_id?", "ply_book_id?", "status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/start-layup"
    description: "Begin layup; occupies the mold from this instant (closed interval until demold)"
    roles: [Laminator]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status -> LAYUP_IN_PROGRESS", "layup_started_at = current logical time"]

  - method: POST
    path: "/work-orders/{id}/complete-layup"
    description: "Finish layup; requires at least one ACTIVE layup session"
    roles: [Laminator]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status -> AWAITING_CURE"]

  - method: POST
    path: "/work-orders/{id}/demold"
    description: "Demold after cure; records actual weight and runs weight acceptance"
    roles: [Laminator]
    code: 200
    input: [actual_part_weight_g]
    output: WorkOrder
    side_effects: ["demolded_at = current logical time", "weight_deviation_pct computed per calculations.weight_acceptance", "status -> IN_INSPECTION on PASS, -> SCRAPPED (WEIGHT_OUT_OF_TOLERANCE) on FAIL"]

  - method: POST
    path: "/work-orders/{id}/scrap"
    description: "Scrap a non-terminal work order (frees mold occupancy)"
    roles: [ShopManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status -> SCRAPPED, scrap_reason=MANUAL", "SCHEDULED cure cycles -> ABORTED", "demolded_at set if layup had started", "OPEN repairs -> SUPERSEDED"]

  # --- ResinBatch ---
  - method: POST
    path: "/resin-batches"
    description: "Mix a resin batch; ratio check and pot-life variant applied at creation"
    roles: [Laminator]
    code: 201
    input: [batch_code, resin_system, resin_mass_g, catalyst_mass_g, target_ratio_pct, ratio_tolerance_pct, nominal_pot_life_minutes, "ambient_temp_c?"]
    output: ResinBatch
    side_effects: ["mixed_at = current logical time", "effective_pot_life_minutes and expires_at computed per calculations.adjusted_pot_life_minutes", "status=MIXED, or REJECTED when ratio out of tolerance"]

  - method: GET
    path: "/resin-batches/{id}"
    description: "Get a resin batch (lazy-expires when now > expires_at)"
    roles: [ShopManager, ToolingEngineer, Laminator, CureTechnician, QualityInspector, EHSOfficer]
    code: 200
    input: []
    output: ResinBatch
    side_effects: ["lazy EXPIRED transition when past expires_at"]

  - method: POST
    path: "/resin-batches/{id}/quench"
    description: "Dispose of remaining mixed resin"
    roles: [Laminator]
    code: 200
    input: []
    output: ResinBatch
    side_effects: ["status -> QUENCHED", "quenched_mass_g = remaining_mass_g, remaining_mass_g = 0"]

  # --- LayupSession ---
  - method: POST
    path: "/layup-sessions"
    description: "Record resin consumption against a work order; posts styrene emission to the covering ACTIVE permit"
    roles: [Laminator]
    code: 201
    input: [work_order_id, resin_batch_id, resin_used_g]
    output: LayupSession
    side_effects: ["session_at = current logical time, laminator_id = X-User-ID, status=ACTIVE", "permit_id resolved by selector (ACTIVE, period covers now; ties broken by earliest period_start then created_at ASC)", "batch consumed_mass_g/remaining_mass_g/status updated", "permit.styrene_used_kg += styrene_emitted_kg; permit -> EXHAUSTED at >= quota"]

  - method: GET
    path: "/layup-sessions/{id}"
    description: "Get a layup session"
    roles: [ShopManager, ToolingEngineer, Laminator, CureTechnician, QualityInspector, EHSOfficer]
    code: 200
    input: []
    output: LayupSession
    side_effects: []

  - method: GET
    path: "/layup-sessions"
    description: "List layup sessions with pagination and filters"
    roles: [ShopManager, ToolingEngineer, Laminator, CureTechnician, QualityInspector, EHSOfficer]
    code: 200
    input: ["work_order_id?", "resin_batch_id?", "permit_id?", "status?", "limit?", "offset?"]
    output: LayupSession[]
    side_effects: []

  - method: POST
    path: "/layup-sessions/{id}/void"
    description: "Void a session; compensates batch mass and permit emissions exactly"
    roles: [ShopManager]
    code: 200
    input: []
    output: LayupSession
    side_effects: ["status -> VOIDED", "batch consumed/remaining/status restored", "permit.styrene_used_kg -= stored styrene_emitted_kg; EXHAUSTED permit may return to ACTIVE"]

  # --- CureEquipment ---
  - method: POST
    path: "/cure-equipment"
    description: "Register an oven or autoclave"
    roles: [ShopManager]
    code: 201
    input: [equipment_code, kind, max_parts_per_cycle, turnaround_minutes, max_temperature_c, max_pressure_bar]
    output: CureEquipment
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/cure-equipment/{id}"
    description: "Get equipment"
    roles: [ShopManager, ToolingEngineer, Laminator, CureTechnician, QualityInspector, EHSOfficer]
    code: 200
    input: []
    output: CureEquipment
    side_effects: []

  - method: POST
    path: "/cure-equipment/{id}/out-of-service"
    description: "Take equipment out of service (blocked while a cycle is RUNNING)"
    roles: [ShopManager]
    code: 200
    input: []
    output: CureEquipment
    side_effects: ["status -> OUT_OF_SERVICE"]

  - method: POST
    path: "/cure-equipment/{id}/return-to-service"
    description: "Return equipment to service"
    roles: [ShopManager]
    code: 200
    input: []
    output: CureEquipment
    side_effects: ["status -> AVAILABLE"]

  # --- CureCycle ---
  - method: POST
    path: "/cure-cycles"
    description: "Schedule a cure cycle on equipment; admits by aggregate capacity, autoclave buffer, envelope and kind rules"
    roles: [CureTechnician]
    code: 201
    input: [work_order_id, equipment_id, ramp_rate_c_per_min, soak_temp_c, soak_minutes, scheduled_start, scheduled_end, "pressure_bar?"]
    output: CureCycle
    side_effects: ["status=SCHEDULED", "uses_mold computed", "WorkOrder AWAITING_CURE|REPAIR -> CURE_SCHEDULED"]

  - method: GET
    path: "/cure-cycles/{id}"
    description: "Get a cure cycle"
    roles: [ShopManager, ToolingEngineer, Laminator, CureTechnician, QualityInspector, EHSOfficer]
    code: 200
    input: []
    output: CureCycle
    side_effects: []

  - method: GET
    path: "/cure-cycles"
    description: "List cure cycles with pagination and filters"
    roles: [ShopManager, ToolingEngineer, Laminator, CureTechnician, QualityInspector, EHSOfficer]
    code: 200
    input: ["work_order_id?", "equipment_id?", "status?", "limit?", "offset?"]
    output: CureCycle[]
    side_effects: []

  - method: POST
    path: "/cure-cycles/{id}/start"
    description: "Start a scheduled cycle"
    roles: [CureTechnician]
    code: 200
    input: []
    output: CureCycle
    side_effects: ["status -> RUNNING", "WorkOrder CURE_SCHEDULED -> IN_CURE"]

  - method: POST
    path: "/cure-cycles/{id}/complete"
    description: "Complete a running cycle with the cure log; scores deviation; may send the work order back for re-cure"
    roles: [CureTechnician]
    code: 200
    input: [recorded_min_temp_c, recorded_max_temp_c, recorded_soak_minutes, recorded_ramp_rate_c_per_min]
    output: CureCycle
    side_effects: ["status -> COMPLETED", "cure_deviation_score and cure_log_ok computed", "WorkOrder -> CURED or -> AWAITING_CURE", "when uses_mold: mold.cycles_since_maintenance += 1, possibly -> MAINTENANCE_DUE"]

  - method: POST
    path: "/cure-cycles/{id}/abort"
    description: "Abort a running cycle (no mold wear)"
    roles: [CureTechnician]
    code: 200
    input: []
    output: CureCycle
    side_effects: ["status -> ABORTED", "WorkOrder IN_CURE -> AWAITING_CURE"]

  # --- Inspection ---
  - method: POST
    path: "/inspections"
    description: "Record an NDT inspection; computes disposition and drives work order outcome (segregation of duties enforced)"
    roles: [QualityInspector]
    code: 201
    input: [work_order_id, method, void_content_pct, delamination_area_cm2]
    output: Inspection
    side_effects: ["inspector_id = X-User-ID, inspected_at = current logical time", "result computed per calculations.inspection_disposition", "PASS -> WorkOrder ACCEPTED (+mold prototype_parts_validated when PROTOTYPE, OPEN repairs -> CLOSED)", "REPAIR_REQUIRED -> Repair auto-created and WorkOrder -> REPAIR (or rejected ERR_REPAIR_LIMIT_EXCEEDED at limit)", "FAIL -> WorkOrder SCRAPPED (INSPECTION_FAIL), OPEN repairs -> SUPERSEDED"]

  - method: GET
    path: "/inspections/{id}"
    description: "Get an inspection"
    roles: [ShopManager, ToolingEngineer, Laminator, CureTechnician, QualityInspector, EHSOfficer]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: GET
    path: "/inspections"
    description: "List inspections with pagination and filters"
    roles: [ShopManager, ToolingEngineer, Laminator, CureTechnician, QualityInspector, EHSOfficer]
    code: 200
    input: ["work_order_id?", "result?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  # --- Repair ---
  - method: GET
    path: "/repairs/{id}"
    description: "Get a repair"
    roles: [ShopManager, ToolingEngineer, Laminator, CureTechnician, QualityInspector, EHSOfficer]
    code: 200
    input: []
    output: Repair
    side_effects: []

  - method: GET
    path: "/repairs"
    description: "List repairs with pagination and filters"
    roles: [ShopManager, ToolingEngineer, Laminator, CureTechnician, QualityInspector, EHSOfficer]
    code: 200
    input: ["work_order_id?", "source_inspection_id?", "status?", "limit?", "offset?"]
    output: Repair[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, invalid enum member, or out-of-range scalar" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current version on OCC-guarded PATCH" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state from which the requested transition exists (incl. completing layup with no ACTIVE session, voiding a session on a QUENCHED batch, second close of a permit)" }
  - { id: ERR_PLY_BOOK_NOT_DRAFT, http: 409, condition: "PATCH or approve attempted on a PlyBook not in DRAFT" }
  - { id: ERR_PLY_BOOK_NOT_APPROVED, http: 409, condition: "Work order references a PlyBook not in APPROVED status, or part_number mismatch" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "permit_code / mold_code / batch_code / work_order_no / (part_number, revision) already exists" }
  - { id: ERR_MOLD_NOT_AVAILABLE, http: 409, condition: "Mold not usable for the requested step: start-layup and first-cure scheduling require status == ACTIVE (MAINTENANCE_DUE, IN_MAINTENANCE, RETIRED all fail); work order creation requires status != RETIRED (MAINTENANCE_DUE and IN_MAINTENANCE are admitted at release time)" }
  - { id: ERR_MOLD_OCCUPANCY_CONFLICT, http: 409, condition: "Another work order occupies the mold, or current time is not strictly after the prior occupant's demolded_at (closed interval)" }
  - { id: ERR_PROTOTYPE_QUANTITY_CAP, http: 409, condition: "quantity > 5 on a mold with tooling_phase PROTOTYPE or TRANSITION" }
  - { id: ERR_TOOLING_PHASE_GATE, http: 409, condition: "Promotion precondition failed: not enough validated prototype parts, or open work orders block PRODUCTION" }
  - { id: ERR_NO_ACTIVE_PERMIT, http: 409, condition: "No EmissionPermit with status ACTIVE covers the current logical time" }
  - { id: ERR_PERMIT_QUOTA_EXCEEDED, http: 409, condition: "Session's post-add styrene_used_kg would exceed the permit quota (equality allowed)" }
  - { id: ERR_RESIN_POT_LIFE_EXPIRED, http: 409, condition: "Current logical time > batch.expires_at at consumption; batch becomes EXPIRED" }
  - { id: ERR_RESIN_BATCH_NOT_USABLE, http: 409, condition: "Batch is REJECTED, EXHAUSTED, EXPIRED, or QUENCHED" }
  - { id: ERR_RESIN_MASS_INSUFFICIENT, http: 409, condition: "resin_used_g exceeds batch remaining_mass_g" }
  - { id: ERR_RESIN_SYSTEM_MISMATCH, http: 409, condition: "Batch resin_system differs from the work order's ply book resin_system" }
  - { id: ERR_EQUIPMENT_NOT_AVAILABLE, http: 409, condition: "Equipment OUT_OF_SERVICE at cycle scheduling or start" }
  - { id: ERR_EQUIPMENT_CAPACITY_EXCEEDED, http: 409, condition: "Sum of overlapping cycles' quantities + new quantity exceeds max_parts_per_cycle" }
  - { id: ERR_TURNAROUND_BUFFER_VIOLATION, http: 409, condition: "Autoclave turnaround gap violated: new window starts before an existing window's scheduled_end + turnaround_minutes (or ends too close before an existing start)" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "scheduled_end not strictly after scheduled_start" }
  - { id: ERR_PRESSURE_REQUIRES_AUTOCLAVE, http: 422, condition: "pressure_bar supplied for OVEN equipment, or exceeds equipment.max_pressure_bar, or missing for AUTOCLAVE" }
  - { id: ERR_CURE_ENVELOPE_EXCEEDED, http: 422, condition: "soak_temp_c exceeds equipment.max_temperature_c" }
  - { id: ERR_SOD_INSPECTOR_LAMINATOR, http: 403, condition: "Inspector's X-User-ID equals laminator_id of an ACTIVE LayupSession on this work order" }
  - { id: ERR_REPAIR_LIMIT_EXCEEDED, http: 409, condition: "Inspection disposition REPAIR_REQUIRED but repair_count >= ply_book.max_repair_attempts" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopManager
    description: "Front-office manager: releases and scraps work orders, registers equipment, voids layup sessions, drives the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /work-orders, POST /work-orders/{id}/scrap"
      - "POST /cure-equipment, POST /cure-equipment/{id}/out-of-service, POST /cure-equipment/{id}/return-to-service"
      - "POST /layup-sessions/{id}/void"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]

  - name: ToolingEngineer
    description: "Owns molds/plugs and ply books: registration, maintenance, phase transitions, revisions and approval"
    identity: opaque
    exclusive_operations:
      - "POST /molds, PATCH /molds/{id}, POST /molds/{id}/start-maintenance, POST /molds/{id}/complete-maintenance, POST /molds/{id}/transition-phase, POST /molds/{id}/retire"
      - "POST /ply-books, PATCH /ply-books/{id}, POST /ply-books/{id}/approve"
    shared_operations: ["all GET endpoints"]

  - name: Laminator
    description: "Layup floor operator: starts/completes layup, mixes resin, records layup sessions, demolds"
    identity: opaque
    exclusive_operations:
      - "POST /work-orders/{id}/start-layup, POST /work-orders/{id}/complete-layup, POST /work-orders/{id}/demold"
      - "POST /resin-batches, POST /resin-batches/{id}/quench"
      - "POST /layup-sessions"
    shared_operations: ["all GET endpoints"]

  - name: CureTechnician
    description: "Cure room operator: schedules, starts, completes, and aborts cure cycles; owns the cure log"
    identity: opaque
    exclusive_operations:
      - "POST /cure-cycles, POST /cure-cycles/{id}/start, POST /cure-cycles/{id}/complete, POST /cure-cycles/{id}/abort"
    shared_operations: ["all GET endpoints"]

  - name: QualityInspector
    description: "NDT inspector; segregation of duties forbids inspecting a work order the same user laminated"
    identity: opaque
    exclusive_operations:
      - "POST /inspections"
    shared_operations: ["all GET endpoints"]

  - name: EHSOfficer
    description: "Environmental health & safety: registers and closes styrene emission permits"
    identity: opaque
    exclusive_operations:
      - "POST /emission-permits, POST /emission-permits/{id}/close"
    shared_operations: ["all GET endpoints"]
