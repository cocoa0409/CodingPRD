            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${ls}", tonnes_as_received: 836.73, moisture_pct: 2.0 } }
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${cl}", tonnes_as_received: 204.55, moisture_pct: 12.0 }, captures: { dry: "$.data.dry_tonnes" } }
            - { call: "POST /cement-ops/blended-piles/${pa}/seal", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", blended_pile_id: "${pa}", clinker_silo_id: "${sc1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z" }, captures: { r1: "$.data.id" } }
            - { call: "POST /cement-ops/kiln-runs/${r1}/light", as: KilnOperator, payload: {} }
          trigger:
            - { call: "POST /cement-ops/kiln-runs/${r1}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${coal}", tonnes: 80.00 }, captures: { clinker: "$.data.clinker_tonnes", shc: "$.data.effective_shc_gj_per_tonne" } }
          assert:
            - "the pile reads dry_tonnes 1000.00 (820.00 + 180.00)"
            - "the trigger returns gross_energy_gj 2160.00 and provisional_clinker_tonnes exactly 600.00"
            - "effective_shc_gj_per_tonne == 3.70 (the 600.00 boundary belongs to tier 2)"
            - "clinker_tonnes == 583.78, NOT 540.00"
            - "nox_emitted_kg 756.00 and nox_intensity_kg_per_tonne 1.295 with nox_intensity_breach true"
            - "the completion succeeds because round(583.78 * 1.55, 2) = 904.86 <= 1000.00; a re-tiering implementation would compute 837.00 and still pass, so the feed check alone cannot substitute for asserting 583.78"
            - "a 79.00 t coal charge instead gives gross 2133.00, provisional 592.50 (tier 1, 4.00) and clinker_tonnes 533.25 — one tonne less fuel drops the output by 50.53 t"

      - name: tsr_at_exactly_the_ceiling_is_allowed_and_one_hundredth_over_is_refused
        grounds: >
          calculations.thermal_substitution_rate states that a charge is refused only when the
          resulting tsr_pct EXCEEDS effective_tsr_ceiling_pct, so equality is allowed; §1.4 priority
          71 carries ERR_TSR_CAP_EXCEEDED.
        distinguishing_aspect: >
          A `>=` implementation refuses the 45.00 t RDF charge that lands on exactly 25.00 and the
          run never gets its alternative fuel. The correct behaviour accepts 25.00 and refuses
          46.00 t (25.41). The rounding also matters: 828.00 / 3258.00 * 100 = 25.4142... must round
          HALF_UP to 25.41, not truncate to 25.41 by accident of a different rule — an
          implementation rounding to 25.4 and comparing at one decimal would wrongly accept.
        test_recipe:
          setup: >
            Plant permit 35.00, RDF-1 authorized to exactly 25.00 and unexpired, run lit with
            90.00 t of coal already charged (2430.00 GJ).
          setup_api_calls:
            - { call: "POST /cement-ops/plants", as: PlantAdmin, payload: { name: "Ash Grove West", region_code: "US-MW", permit_nox_kg_per_tonne_clinker_cap: 1.20, permit_annual_nox_budget_kg: 2000000, permit_max_tsr_pct: 35.00, permit_max_chlorine_kg_per_run: 500.00, peak_season_months: [5, 6, 7, 8, 9], clinker_free_lime_max_pct: 1.50 }, captures: { plant: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "LS-1", category: "LIMESTONE", cao_pct: 52.0, sio2_pct: 3.5, al2o3_pct: 1.0, fe2o3_pct: 0.5, so3_pct: 0.05, moisture_pct: 2.0, cost_per_tonne: 8.00 }, captures: { ls: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "CL-1", category: "CLAY", cao_pct: 1.0, sio2_pct: 60.0, al2o3_pct: 18.0, fe2o3_pct: 7.0, so3_pct: 0.10, moisture_pct: 12.0, cost_per_tonne: 12.00 }, captures: { cl: "$.data.id" } }
            - { call: "POST /cement-ops/fuels", as: EnvironmentalOfficer, payload: { code: "COAL-1", category: "COAL", lhv_gj_per_tonne: 27.00, nox_kg_per_gj: 0.35, co2_kg_per_gj: 96.0, chlorine_pct: 0.02 }, captures: { coal: "$.data.id" } }
            - { call: "POST /cement-ops/fuels", as: EnvironmentalOfficer, payload: { code: "RDF-1", category: "RDF", lhv_gj_per_tonne: 18.00, nox_kg_per_gj: 0.22, co2_kg_per_gj: 40.0, chlorine_pct: 0.80, is_alternative: true }, captures: { rdf: "$.data.id" } }
            - { call: "POST /cement-ops/burn-tests", as: EnvironmentalOfficer, payload: { plant_id: "${plant}", fuel_id: "${rdf}", requested_max_tsr_pct: 25.00, valid_days: 30 }, captures: { bt: "$.data.id" } }
            - { call: "POST /cement-ops/burn-tests/${bt}/start", as: LabTechnician, payload: {} }
            - { call: "POST /cement-ops/burn-tests/${bt}/record-result", as: LabTechnician, payload: { measured_chlorine_pct: 0.80, measured_nox_kg_per_gj: 0.22, stack_compliant: true } }
            - { call: "POST /cement-ops/burn-tests/${bt}/adjudicate", as: EnvironmentalOfficer, payload: { decision: "AUTHORIZED", authorized_max_tsr_pct: 25.00, decision_reason: "stack test passed" } }
            - { call: "POST /cement-ops/kilns", as: PlantAdmin, payload: { plant_id: "${plant}", code: "K1", nominal_shc_gj_per_tonne: 3.60, cooldown_buffer_hours: 12, reline_due_hours: 4000 }, captures: { k1: "$.data.id" } }
            - { call: "POST /cement-ops/silos", as: PlantAdmin, payload: { plant_id: "${plant}", code: "SC1", material_kind: "CLINKER", capacity_tonnes: 20000.00, draw_rate_tonnes_per_hour: 300.00 }, captures: { sc1: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs", as: ProcessEngineer, payload: { plant_id: "${plant}", code: "D2", target_lsf: 97.00, target_sm: 2.40, target_am: 2.45, components: [{ raw_material_id: "${ls}", mass_fraction_pct: 82.00 }, { raw_material_id: "${cl}", mass_fraction_pct: 18.00 }] }, captures: { d2: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs/${d2}/submit", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/raw-mix-designs/${d2}/approve", as: QualityManager, payload: {}, captures: { d2_v: "$.data.version" } }
            - { call: "POST /cement-ops/blended-piles", as: ProcessEngineer, payload: { plant_id: "${plant}", raw_mix_design_id: "${d2}", pile_code: "PA", expected_raw_mix_design_version: "${d2_v}" }, captures: { pa: "$.data.id" } }
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${ls}", tonnes_as_received: 2510.19, moisture_pct: 2.0 } }
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${cl}", tonnes_as_received: 613.65, moisture_pct: 12.0 } }
            - { call: "POST /cement-ops/blended-piles/${pa}/seal", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", blended_pile_id: "${pa}", clinker_silo_id: "${sc1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }, captures: { r1: "$.data.id" } }
            - { call: "POST /cement-ops/kiln-runs/${r1}/light", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/kiln-runs/${r1}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${coal}", tonnes: 90.00 }, captures: { gross0: "$.data.gross_energy_gj" } }
          trigger:
            - { call: "POST /cement-ops/kiln-runs/${r1}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${rdf}", tonnes: 45.00 }, captures: { tsr: "$.data.tsr_pct" } }
          assert:
            - "after the coal charge gross_energy_gj is 2430.00 and tsr_pct is 0.00"
            - "the trigger returns 201 with gross_energy_gj 3240.00 and tsr_pct exactly 25.00 — equality with the 25.00 ceiling is accepted"
            - "the run also reads nox_emitted_kg 1028.70 (850.50 + 178.20) and chlorine_input_kg 378.00 (18.00 + 360.00)"
            - "on a second, otherwise identical run charging 46.00 t of RDF instead, the charge is refused with 422 ERR_TSR_CAP_EXCEEDED at tsr_pct 25.41 (828.00 / 3258.00)"
            - "a third run charging 44.99 t of RDF is accepted at tsr_pct 24.99"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: lighting_a_kiln_requires_the_blended_pile_to_be_sealed
        grounds: >
          §1.2 KilnRun's light transition declares the cross-entity precondition
          `BlendedPile.status == SEALED`, and §1.4 priority 61 carries ERR_INVALID_PILE_STATE for
          exactly that gate. The run itself is a perfectly valid SCHEDULED run — nothing about its
          own fields is wrong.
        distinguishing_aspect: >
          An implementation that only checks the run's own process_state lights the kiln on an OPEN
          pile, and the pile is then never CONSUMED, so its dry_tonnes keeps growing while the kiln
          burns. The correct behaviour is 409 ERR_INVALID_PILE_STATE, and the same call succeeds the
          instant the pile is sealed — with the pile flipping SEALED -> CONSUMED as a side effect.
        test_recipe:
          setup: >
            Pile PA has two additions but has NOT been sealed. A run is scheduled against it inside
            the current window.
          setup_api_calls:
            - { call: "POST /cement-ops/plants", as: PlantAdmin, payload: { name: "Ash Grove West", region_code: "US-MW", permit_nox_kg_per_tonne_clinker_cap: 1.20, permit_annual_nox_budget_kg: 2000000, permit_max_tsr_pct: 35.00, permit_max_chlorine_kg_per_run: 500.00, peak_season_months: [5, 6, 7, 8, 9], clinker_free_lime_max_pct: 1.50 }, captures: { plant: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "LS-1", category: "LIMESTONE", cao_pct: 52.0, sio2_pct: 3.5, al2o3_pct: 1.0, fe2o3_pct: 0.5, so3_pct: 0.05, moisture_pct: 2.0, cost_per_tonne: 8.00 }, captures: { ls: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "CL-1", category: "CLAY", cao_pct: 1.0, sio2_pct: 60.0, al2o3_pct: 18.0, fe2o3_pct: 7.0, so3_pct: 0.10, moisture_pct: 12.0, cost_per_tonne: 12.00 }, captures: { cl: "$.data.id" } }
            - { call: "POST /cement-ops/kilns", as: PlantAdmin, payload: { plant_id: "${plant}", code: "K1", nominal_shc_gj_per_tonne: 3.60, cooldown_buffer_hours: 12, reline_due_hours: 4000 }, captures: { k1: "$.data.id" } }
            - { call: "POST /cement-ops/silos", as: PlantAdmin, payload: { plant_id: "${plant}", code: "SC1", material_kind: "CLINKER", capacity_tonnes: 20000.00, draw_rate_tonnes_per_hour: 300.00 }, captures: { sc1: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs", as: ProcessEngineer, payload: { plant_id: "${plant}", code: "D2", target_lsf: 97.00, target_sm: 2.40, target_am: 2.45, components: [{ raw_material_id: "${ls}", mass_fraction_pct: 82.00 }, { raw_material_id: "${cl}", mass_fraction_pct: 18.00 }] }, captures: { d2: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs/${d2}/submit", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/raw-mix-designs/${d2}/approve", as: QualityManager, payload: {}, captures: { d2_v: "$.data.version" } }
            - { call: "POST /cement-ops/blended-piles", as: ProcessEngineer, payload: { plant_id: "${plant}", raw_mix_design_id: "${d2}", pile_code: "PA", expected_raw_mix_design_version: "${d2_v}" }, captures: { pa: "$.data.id" } }
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${ls}", tonnes_as_received: 836.73, moisture_pct: 2.0 } }
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${cl}", tonnes_as_received: 204.55, moisture_pct: 12.0 }, captures: { pile_status: "$.data.status" } }
            - { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", blended_pile_id: "${pa}", clinker_silo_id: "${sc1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z" }, captures: { r1: "$.data.id" } }
          trigger:
            - { call: "POST /cement-ops/kiln-runs/${r1}/light", as: KilnOperator, payload: {}, captures: { err: "$.data.error_id" } }
          assert:
            - "the pile reads status OPEN with as_received_tonnes 1041.28 and dry_tonnes 1000.00 before the trigger"
            - "the run reads process_state SCHEDULED, quality_state PENDING_LAB, and Kiln.availability_state AVAILABLE — nothing on the run itself is invalid"
            - "the trigger returns 409 with error_id ERR_INVALID_PILE_STATE"
            - "the run is untouched: process_state still SCHEDULED with lit_at null, and Kiln.availability_state still AVAILABLE"
            - "after POST /cement-ops/blended-piles/${pa}/seal the identical light call returns 200: run process_state BURNING and the pile flips to status CONSUMED"

      - name: grinding_is_gated_on_a_feed_state_owned_by_a_different_entitys_quality_verdict
        grounds: >
          §1.2 CementBatch's start-grinding declares the precondition `feed_state == FEED_READY`,
          but feed_state is only ever changed by cascades originating on the clinker Silo or on a
          KilnRun's quality dimension (§1.2 KilnRun RELEASED -> QUARANTINED hop 2 and Silo
          OPEN -> BLOCKED). §1.4 priority 68 carries ERR_BATCH_FEED_SHORT.
        distinguishing_aspect: >
          An implementation that recomputes availability at grinding time instead of honouring the
          stored feed_state returns ERR_INSUFFICIENT_CLINKER, or worse, grinds successfully because
          the physical tonnage is still in the silo. The correct answer is 409 ERR_BATCH_FEED_SHORT
          — the clinker is physically present (tonnes_on_hand 583.78) but its quality release was
          withdrawn by a lab test on an entirely different entity.
        test_recipe:
          setup: >
            Batch B2 is created FEED_READY against a released run's clinker, and then LAB1 records a
            failing free lime on that run, which pushes B2 to FEED_SHORT via the withdrawal cascade.
          setup_api_calls:
            - { call: "POST /cement-ops/plants", as: PlantAdmin, payload: { name: "Ash Grove West", region_code: "US-MW", permit_nox_kg_per_tonne_clinker_cap: 1.20, permit_annual_nox_budget_kg: 2000000, permit_max_tsr_pct: 35.00, permit_max_chlorine_kg_per_run: 500.00, peak_season_months: [5, 6, 7, 8, 9], clinker_free_lime_max_pct: 1.50 }, captures: { plant: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "LS-1", category: "LIMESTONE", cao_pct: 52.0, sio2_pct: 3.5, al2o3_pct: 1.0, fe2o3_pct: 0.5, so3_pct: 0.05, moisture_pct: 2.0, cost_per_tonne: 8.00 }, captures: { ls: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "CL-1", category: "CLAY", cao_pct: 1.0, sio2_pct: 60.0, al2o3_pct: 18.0, fe2o3_pct: 7.0, so3_pct: 0.10, moisture_pct: 12.0, cost_per_tonne: 12.00 }, captures: { cl: "$.data.id" } }
            - { call: "POST /cement-ops/fuels", as: EnvironmentalOfficer, payload: { code: "GAS-1", category: "NATURAL_GAS", lhv_gj_per_tonne: 48.00, nox_kg_per_gj: 0.10, co2_kg_per_gj: 56.0, chlorine_pct: 0.00 }, captures: { gas: "$.data.id" } }
            - { call: "POST /cement-ops/kilns", as: PlantAdmin, payload: { plant_id: "${plant}", code: "K1", nominal_shc_gj_per_tonne: 3.60, cooldown_buffer_hours: 12, reline_due_hours: 4000 }, captures: { k1: "$.data.id" } }
            - { call: "POST /cement-ops/silos", as: PlantAdmin, payload: { plant_id: "${plant}", code: "SC1", material_kind: "CLINKER", capacity_tonnes: 20000.00, draw_rate_tonnes_per_hour: 300.00 }, captures: { sc1: "$.data.id" } }
            - { call: "POST /cement-ops/silos", as: PlantAdmin, payload: { plant_id: "${plant}", code: "SM1", material_kind: "CEMENT", capacity_tonnes: 8000.00, draw_rate_tonnes_per_hour: 250.00, loadout_spouts: 2 }, captures: { sm1: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs", as: ProcessEngineer, payload: { plant_id: "${plant}", code: "D2", target_lsf: 97.00, target_sm: 2.40, target_am: 2.45, components: [{ raw_material_id: "${ls}", mass_fraction_pct: 82.00 }, { raw_material_id: "${cl}", mass_fraction_pct: 18.00 }] }, captures: { d2: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs/${d2}/submit", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/raw-mix-designs/${d2}/approve", as: QualityManager, payload: {}, captures: { d2_v: "$.data.version" } }
            - { call: "POST /cement-ops/blended-piles", as: ProcessEngineer, payload: { plant_id: "${plant}", raw_mix_design_id: "${d2}", pile_code: "PA", expected_raw_mix_design_version: "${d2_v}" }, captures: { pa: "$.data.id" } }
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${ls}", tonnes_as_received: 836.73, moisture_pct: 2.0 } }
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${cl}", tonnes_as_received: 204.55, moisture_pct: 12.0 } }
            - { call: "POST /cement-ops/blended-piles/${pa}/seal", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", blended_pile_id: "${pa}", clinker_silo_id: "${sc1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z" }, captures: { r0: "$.data.id" } }
            - { call: "POST /cement-ops/kiln-runs/${r0}/light", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/kiln-runs/${r0}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${gas}", tonnes: 45.00 } }
            - { call: "POST /cement-ops/_clock/set_current_utc", as: PlantAdmin, payload: { to_iso8601: "2026-08-01T12:00:00Z" } }
            - { call: "POST /cement-ops/kiln-runs/${r0}/complete", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "FREE_LIME", value: 1.20, kiln_run_id: "${r0}" } }
            - { call: "POST /cement-ops/kiln-runs/${r0}/release-clinker", as: QualityManager, payload: {} }
            - { call: "GET /cement-ops/silos/${sc1}", as: ProcessEngineer, payload: {}, captures: { sc1_v: "$.data.version" } }
            - { call: "POST /cement-ops/cement-batches", as: ProcessEngineer, payload: { plant_id: "${plant}", clinker_silo_id: "${sc1}", cement_silo_id: "${sm1}", cement_type: "TYPE_IL", clinker_tonnes_drawn: 500.00, gypsum_pct: 5.00, limestone_pct: 8.00, blaine_target_m2_per_kg: 400, expected_clinker_silo_version: "${sc1_v}" }, captures: { b2: "$.data.id", feed0: "$.data.feed_state" } }
            - { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "FREE_LIME", value: 1.62, kiln_run_id: "${r0}" } }
            - { call: "GET /cement-ops/cement-batches/${b2}", as: ProcessEngineer, payload: {}, captures: { feed1: "$.data.feed_state" } }
          trigger:
            - { call: "POST /cement-ops/cement-batches/${b2}/start-grinding", as: KilnOperator, payload: {}, captures: { err: "$.data.error_id" } }
          assert:
            - "at creation B2 reads feed_state FEED_READY with status PLANNED"
            - "after the failing lab test B2 reads feed_state FEED_SHORT with status still PLANNED and clinker_tonnes_drawn still 500.00"
            - "SC1 still reads tonnes_on_hand 583.78 — the clinker is physically there, only its release was withdrawn"
            - "the trigger returns 409 with error_id ERR_BATCH_FEED_SHORT, NOT ERR_INSUFFICIENT_CLINKER and NOT ERR_SILO_BLOCKED"
            - "SC1 status is still OPEN, which is what rules ERR_SILO_BLOCKED out as the expected error"
            - "after FREE_LIME 1.40 plus release-clinker, B2 returns to FEED_READY and the same start-grinding call returns 200 with status GRINDING"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: kiln_run_windows_are_closed_intervals_so_touching_windows_conflict
        grounds: >
          §1.4 priority 85 kiln_window_free_of_runs states that a new run must not overlap the
          CLOSED interval [window_start, window_end] of any run on the same kiln with process_state
          IN {SCHEDULED, BURNING, COMPLETED}, and spells out that two runs which merely touch at an
          instant still conflict. §1.4 priority 107 uses the opposite, half-open convention for
          loadout windows, so the implementation cannot use one shared overlap helper.
        distinguishing_aspect: >
          A half-open implementation accepts the second run because [12:00, 24:00) does not overlap
          [00:00, 12:00) — the kiln would be double-booked at the changeover instant. The correct
          answer is 409 ERR_KILN_WINDOW_CONFLICT, and a window starting one second later
          (12:00:01Z) must be accepted, which pins the boundary rather than just the rejection.
        test_recipe:
          setup: >
            Kiln K1 already has run R0 scheduled for [2026-08-01T00:00:00Z, 2026-08-01T12:00:00Z]
            (still SCHEDULED, never lit). A second pile PB is prepared so the new run has its own
            feedstock and the refusal cannot be attributed to the pile.
          setup_api_calls:
            - { call: "POST /cement-ops/plants", as: PlantAdmin, payload: { name: "Ash Grove West", region_code: "US-MW", permit_nox_kg_per_tonne_clinker_cap: 1.20, permit_annual_nox_budget_kg: 2000000, permit_max_tsr_pct: 35.00, permit_max_chlorine_kg_per_run: 500.00, peak_season_months: [5, 6, 7, 8, 9], clinker_free_lime_max_pct: 1.50 }, captures: { plant: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "LS-1", category: "LIMESTONE", cao_pct: 52.0, sio2_pct: 3.5, al2o3_pct: 1.0, fe2o3_pct: 0.5, so3_pct: 0.05, moisture_pct: 2.0, cost_per_tonne: 8.00 }, captures: { ls: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "CL-1", category: "CLAY", cao_pct: 1.0, sio2_pct: 60.0, al2o3_pct: 18.0, fe2o3_pct: 7.0, so3_pct: 0.10, moisture_pct: 12.0, cost_per_tonne: 12.00 }, captures: { cl: "$.data.id" } }
            - { call: "POST /cement-ops/kilns", as: PlantAdmin, payload: { plant_id: "${plant}", code: "K1", nominal_shc_gj_per_tonne: 3.60, cooldown_buffer_hours: 12, reline_due_hours: 4000 }, captures: { k1: "$.data.id" } }
            - { call: "POST /cement-ops/silos", as: PlantAdmin, payload: { plant_id: "${plant}", code: "SC1", material_kind: "CLINKER", capacity_tonnes: 20000.00, draw_rate_tonnes_per_hour: 300.00 }, captures: { sc1: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs", as: ProcessEngineer, payload: { plant_id: "${plant}", code: "D2", target_lsf: 97.00, target_sm: 2.40, target_am: 2.45, components: [{ raw_material_id: "${ls}", mass_fraction_pct: 82.00 }, { raw_material_id: "${cl}", mass_fraction_pct: 18.00 }] }, captures: { d2: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs/${d2}/submit", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/raw-mix-designs/${d2}/approve", as: QualityManager, payload: {}, captures: { d2_v: "$.data.version" } }
            - { call: "POST /cement-ops/blended-piles", as: ProcessEngineer, payload: { plant_id: "${plant}", raw_mix_design_id: "${d2}", pile_code: "PA", expected_raw_mix_design_version: "${d2_v}" }, captures: { pa: "$.data.id" } }
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${ls}", tonnes_as_received: 836.73, moisture_pct: 2.0 } }
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${cl}", tonnes_as_received: 204.55, moisture_pct: 12.0 } }
            - { call: "POST /cement-ops/blended-piles/${pa}/seal", as: ProcessEngineer, payload: {} }
            - { call: "GET /cement-ops/raw-mix-designs/${d2}", as: ProcessEngineer, payload: {}, captures: { d2_v2: "$.data.version" } }
            - { call: "POST /cement-ops/blended-piles", as: ProcessEngineer, payload: { plant_id: "${plant}", raw_mix_design_id: "${d2}", pile_code: "PB", expected_raw_mix_design_version: "${d2_v2}" }, captures: { pb: "$.data.id" } }
            - { call: "POST /cement-ops/blended-piles/${pb}/additions", as: ProcessEngineer, payload: { raw_material_id: "${ls}", tonnes_as_received: 836.73, moisture_pct: 2.0 } }
            - { call: "POST /cement-ops/blended-piles/${pb}/additions", as: ProcessEngineer, payload: { raw_material_id: "${cl}", tonnes_as_received: 204.55, moisture_pct: 12.0 } }
            - { call: "POST /cement-ops/blended-piles/${pb}/seal", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", blended_pile_id: "${pa}", clinker_silo_id: "${sc1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z" }, captures: { r0: "$.data.id", hours: "$.data.scheduled_hours" } }
