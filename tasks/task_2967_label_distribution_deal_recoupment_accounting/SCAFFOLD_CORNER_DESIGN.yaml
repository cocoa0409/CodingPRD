      - name: deduction_buckets_fill_in_order_and_the_net_floors_at_zero
        claim_type: waterfall_allocation
        grounds:
          - calculations.artist_statement_net_payable.formula
          - entities.ArtistStatement.advance_applied_cents
          - entities.ArtistStatement.recording_applied_cents
