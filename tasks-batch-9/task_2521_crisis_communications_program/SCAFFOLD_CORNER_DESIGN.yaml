  - section: calculations
    instances:
      - name: corner_signal_score_sentiment_penalty_rounds_half_up
        claim_type: Precision
        grounds:
          - calculations.signal_escalation_score.precision
          - calculations.signal_escalation_score.constants.SENTIMENT_SCALE
        distinguishing_aspect: "Pins ROUND_HALF_UP at two decimals on the one sub-term that can produce a third decimal: a sentiment of -0.1025 scales to 3.075, which must become 3.08 (decimal arithmetic), not 3.07 (banker's rounding or binary float truncation)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One SOCIAL channel (bump 4) and one SocialListener."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crisis/team-members"
              payload: { full_name: "Ray Lund", org_title: "Social Analyst" }
              as: ProgramAdmin
              captures: { listener_id: $.data.id }
            - call: "POST /crisis/monitored-channels"
              payload: { name: "ShortVideo App", channel_type: "SOCIAL" }
              as: ProgramAdmin
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /crisis/issue-signals"
              payload: { channel_id: "${ch_id}", headline: "Clip of a queue outside the depot", reach_score: 55, sentiment_score: -0.1025, source_credibility_tier: "C" }
              as: SocialListener
              as_user_id: "${listener_id}"
              captures: { sig_id: $.data.id }
          assert:
            - "response status == 201"
            - "IssueSignal.${sig_id}.escalation_score == 40.08"
            - "the value is NOT 40.07 (base 33.00 from 55 * 0.6, sentiment penalty round(3.075, 2) = 3.08, SOCIAL bump 4)"
            - "IssueSignal.${sig_id}.state == OPEN"
            - "IssueSignal.${sig_id}.detected_at == 2026-08-10T09:00:00Z"

