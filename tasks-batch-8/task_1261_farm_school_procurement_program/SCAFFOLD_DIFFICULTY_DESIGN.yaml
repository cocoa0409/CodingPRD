      - name: delivery_state_beats_constraint_conflict
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
          - errors[ERR_QUANTITY_EXCEEDS_REMAINING]
        distinguishing_aspect: |
          Category pair state vs business_constraint: a delivery request on a
          CANCELLED agreement with quantity 999 (also exceeding the remainder)
          returns ERR_AGREEMENT_NOT_ACTIVE (priority 6), not
          ERR_QUANTITY_EXCEEDS_REMAINING (priority 10).
        test_recipe:
          setup:
            - "Standard chain through a SIGNED agreement committed 200; agreement then CANCELLED by admin"
          setup_api_calls:
            - { call: "POST /f2s/program-years", payload: { school_year_label: "Y1", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, preference_model: "TIERED", grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr: $.data.id } }
