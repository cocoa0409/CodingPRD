      - name: second_finalize_rejected_term_already_finalized
        claim_type: violation_to_error
        grounds: ["errors[ERR_TERM_ALREADY_FINALIZED]", state_machines.SchedulingRun.DRAFT_to_FINALIZED]
        distinguishing_aspect: "After one run FINALIZES a term, a second run (created fresh, superseding nothing since no DRAFT remains) cannot finalize: ERR_TERM_ALREADY_FINALIZED; the first run's results stand."
        test_recipe:
          setup: ["Term SCHEDULING with zero blocks; run1 created and finalized (placed_count 0); run2 created afterwards"]
          setup_api_calls:
            - { call: "POST /campus/terms", payload: { name: "Fall 2026", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2026-12-15T00:00:00Z", priority_open_at: "2026-08-10T00:00:00Z", general_open_at: "2026-09-01T00:00:00Z" }, as: Scheduler, captures: { term_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler }
            - { call: "GET /campus/terms/${term_id}", payload: {}, as: Scheduler, captures: { term_v: $.data.version } }
            - { call: "POST /campus/scheduling-runs", payload: { term_id: "${term_id}", expected_term_version: "${term_v}" }, as: Scheduler, captures: { run1: $.data.id } }
            - { call: "POST /campus/scheduling-runs/${run1}/finalize", payload: {}, as: Scheduler }
            - { call: "GET /campus/terms/${term_id}", payload: {}, as: Scheduler, captures: { term_v2: $.data.version } }
            - { call: "POST /campus/scheduling-runs", payload: { term_id: "${term_id}", expected_term_version: "${term_v2}" }, as: Scheduler, captures: { run2: $.data.id } }
          trigger:
            - { call: "POST /campus/scheduling-runs/${run2}/finalize", payload: {}, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_TERM_ALREADY_FINALIZED (http 409)"
            - "SchedulingRun.${run2}.status == DRAFT and SchedulingRun.${run1}.status == FINALIZED with placed_count == 0"

      - name: room_capacity_cut_blocked_by_confirmed_and_bumps_requested
        claim_type: conditional_validation
        grounds: ["errors[ERR_ROOM_EDIT_BLOCKED]", "endpoints[PATCH /campus/rooms/{id}]"]
        distinguishing_aspect: "A capacity cut to 60 is rejected while a CONFIRMED event for 80 exists (ERR_ROOM_EDIT_BLOCKED, nothing changes); a cut to 85 succeeds and auto-bumps only the REQUESTED event for 90 — the CONFIRMED event is untouched."
        test_recipe:
          setup: ["Room capacity 100; CONFIRMED event attendance 80 (2026-09-16 14:00-15:00); REQUESTED event attendance 90 (2026-09-17 14:00-15:00)"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept W", org_type: "INTERNAL_DEPARTMENT", contact_email: "w@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "CUT-1", building_code: "CUT", capacity: 100, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Confirmed", expected_attendance: 80, start_at: "2026-09-16T14:00:00Z", end_at: "2026-09-16T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e1: $.data.id } }
            - { call: "POST /campus/event-reservations/${e1}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${e1}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "GET /campus/rooms/${room_id}", payload: {}, as: Scheduler, captures: { room_v2: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Big ask", expected_attendance: 90, start_at: "2026-09-17T14:00:00Z", end_at: "2026-09-17T15:00:00Z", expected_room_version: "${room_v2}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e2: $.data.id } }
          trigger:
            - { call: "PATCH /campus/rooms/${room_id}", payload: { capacity: 60 }, as: FacilitiesManager, captures: { err: $.data.error_id } }
            - { call: "PATCH /campus/rooms/${room_id}", payload: { capacity: 85 }, as: FacilitiesManager, captures: { new_cap: $.data.capacity } }
          assert:
            - "${err} == ERR_ROOM_EDIT_BLOCKED (http 409); capacity stayed 100 after the rejected PATCH"
            - "${new_cap} == 85"
            - "EventReservation.${e2}.status == BUMPED and room_id == null (over-capacity REQUESTED auto-bumped)"
            - "EventReservation.${e1}.status == CONFIRMED and room_id == ${room_id} (80 <= 85)"

      - name: outage_overlapping_shielded_event_blocked
        claim_type: cross_entity_validation
        grounds: ["errors[ERR_ROOM_BLOCKED]", state_machines.Room.ACTIVE_to_OUT_OF_SERVICE]
        distinguishing_aspect: "An outage overlapping a CONFIRMED event fewer than 72h before start is rejected ERR_ROOM_BLOCKED (the event is shielded); the room stays ACTIVE and no outage window is recorded."
        test_recipe:
          setup: ["CONFIRMED event 2026-09-10 14:00-16:00; clock advanced to 2026-09-08T15:00 (start - now = 47h < 72h)"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept X", org_type: "INTERNAL_DEPARTMENT", contact_email: "x@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "BLK-1", building_code: "BLK", capacity: 30, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E", expected_attendance: 5, start_at: "2026-09-10T14:00:00Z", end_at: "2026-09-10T16:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${ev_id}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-08T15:00:00Z" }, as: Scheduler }
          trigger:
            - { call: "POST /campus/rooms/${room_id}/out-of-service", payload: { outage_start_at: "2026-09-10T08:00:00Z", outage_end_at: "2026-09-10T20:00:00Z" }, as: FacilitiesManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_ROOM_BLOCKED (http 409)"
            - "Room.${room_id}.status == ACTIVE and outage_windows == [] and EventReservation.${ev_id}.status == CONFIRMED"

      - name: overpayment_rejected_exact_payment_paid
        claim_type: violation_to_error
        grounds: ["errors[ERR_OVERPAYMENT]", state_machines.Invoice]
        distinguishing_aspect: "Paying 1 cent over the provisional balance is rejected; paying exactly the balance flips PROVISIONAL -> PAID (equality is the paid boundary)."
        test_recipe:
          setup: ["INTERNAL org; event approved 2026-09-14 14:00-15:00 (provisional total 1000)"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept Y", org_type: "INTERNAL_DEPARTMENT", contact_email: "y@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "PAY-1", building_code: "PAY", capacity: 30, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}" }, as: FinanceAdmin, captures: { inv_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /campus/invoices/${inv_id}/pay", payload: { amount_cents: 1001 }, as: FinanceAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /campus/invoices/${inv_id}/pay", payload: { amount_cents: 1000 }, as: FinanceAdmin, captures: { st: $.data.status } }
          assert:
            - "${err} == ERR_OVERPAYMENT (http 422); paid_cents stayed 0"
            - "${st} == PAID and paid_cents == 1000"

      - name: refund_exceeding_paid_rejected_partial_refunds_accumulate
        claim_type: violation_to_error
        grounds: ["errors[ERR_REFUND_EXCEEDS_PAID]", state_machines.Invoice.PAID_to_REFUNDED]
        distinguishing_aspect: "Refunds accumulate against paid_cents: 600 rejected over a 500 remainder; two partial refunds (4000 then 6000) flip PAID -> REFUNDED only at full equality."
        test_recipe:
          setup: ["Invoice PAID 10000 (provisional prepaid in full)"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept Z", org_type: "INTERNAL_DEPARTMENT", contact_email: "z@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "RFD-1", building_code: "RFD", capacity: 30, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T16:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}" }, as: FinanceAdmin, captures: { inv_id: "$.data[0].id" } }
            - { call: "POST /campus/invoices/${inv_id}/pay", payload: { amount_cents: 10000 }, as: FinanceAdmin }
          trigger:
            - { call: "POST /campus/invoices/${inv_id}/refund", payload: { amount_cents: 10001 }, as: FinanceAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /campus/invoices/${inv_id}/refund", payload: { amount_cents: 4000 }, as: FinanceAdmin, captures: { st1: $.data.status, ref1: $.data.refunded_cents } }
            - { call: "POST /campus/invoices/${inv_id}/refund", payload: { amount_cents: 6000 }, as: FinanceAdmin, captures: { st2: $.data.status } }
          assert:
            - "${err} == ERR_REFUND_EXCEEDS_PAID (http 422)"
            - "${st1} == PAID and ${ref1} == 4000 (partial refund accumulates without status change)"
            - "${st2} == REFUNDED (refunded_cents == paid_cents == 10000)"

      - name: waive_by_approving_user_blocked_segregation_of_duties
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]", entities.EventReservation.fields.approved_by_user_id, roles.FinanceAdmin]
        distinguishing_aspect: "The same opaque user id that approved the event cannot waive its invoice even under the FinanceAdmin role (403 ERR_SEGREGATION_OF_DUTIES); a different FinanceAdmin user waives 400 (within the 1000 total) successfully and the invoice stays PROVISIONAL."
        test_recipe:
          setup: ["Scheduler user sched-1 approved the event; provisional invoice total 1000"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept AA", org_type: "INTERNAL_DEPARTMENT", contact_email: "aa@univ.edu" }, as: Scheduler, as_user_id: "sched-9", captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "SOD-1", building_code: "SOD", capacity: 30, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler, as_user_id: "sched-1" }
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}" }, as: FinanceAdmin, captures: { inv_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /campus/invoices/${inv_id}/waive", payload: { amount_cents: 500, reason: "goodwill" }, as: FinanceAdmin, as_user_id: "sched-1", captures: { err: $.data.error_id } }
            - { call: "POST /campus/invoices/${inv_id}/waive", payload: { amount_cents: 400, reason: "goodwill" }, as: FinanceAdmin, as_user_id: "fin-1", captures: { waived: $.data.waived_cents } }
          assert:
            - "${err} == ERR_SEGREGATION_OF_DUTIES (http 403); waived_cents stayed 0 after the blocked attempt"
            - "${waived} == 400 and Invoice.${inv_id}.status == PROVISIONAL (partial waive; cap is total - paid - waived)"

      - name: checkin_window_early_and_late_boundaries
        claim_type: boundary_edge
        grounds: ["errors[ERR_CHECKIN_WINDOW_CLOSED]", state_machines.EventReservation.CONFIRMED_to_IN_PROGRESS]
        distinguishing_aspect: "Check-in window is [start-30m, start+15m] inclusive: 13:29 fails early, 14:15 succeeds exactly at the grace edge, 14:16 fails late."
        test_recipe:
          setup: ["Three CONFIRMED events on 2026-09-14/15/16, each 14:00-15:00, same room (buffer 30; different days so no conflicts)"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept AB", org_type: "INTERNAL_DEPARTMENT", contact_email: "ab@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "WIN-1", building_code: "WIN", capacity: 30, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "D1", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e1: $.data.id } }
            - { call: "GET /campus/rooms/${room_id}", payload: {}, as: Scheduler, captures: { room_v2: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "D2", expected_attendance: 5, start_at: "2026-09-15T14:00:00Z", end_at: "2026-09-15T15:00:00Z", expected_room_version: "${room_v2}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e2: $.data.id } }
            - { call: "GET /campus/rooms/${room_id}", payload: {}, as: Scheduler, captures: { room_v3: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "D3", expected_attendance: 5, start_at: "2026-09-16T14:00:00Z", end_at: "2026-09-16T15:00:00Z", expected_room_version: "${room_v3}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e3: $.data.id } }
            - { call: "POST /campus/event-reservations/${e1}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${e2}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${e3}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${e1}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /campus/event-reservations/${e2}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /campus/event-reservations/${e3}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-14T13:29:00Z" }, as: Scheduler }
            - { call: "POST /campus/event-reservations/${e1}/check-in", payload: {}, as: OrgRequester, as_user_id: "${org_id}", captures: { err_early: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T14:15:00Z" }, as: Scheduler }
            - { call: "POST /campus/event-reservations/${e2}/check-in", payload: {}, as: OrgRequester, as_user_id: "${org_id}", captures: { st_edge: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T14:16:00Z" }, as: Scheduler }
            - { call: "POST /campus/event-reservations/${e3}/check-in", payload: {}, as: OrgRequester, as_user_id: "${org_id}", captures: { err_late: $.data.error_id } }
          assert:
            - "${err_early} == ERR_CHECKIN_WINDOW_CLOSED (one minute before the window)"
            - "${st_edge} == IN_PROGRESS (exactly start+15m is inclusive)"
            - "${err_late} == ERR_CHECKIN_WINDOW_CLOSED (one minute past grace) and EventReservation.${e3}.status == CONFIRMED"

      - name: block_window_invalid_returns_422
        claim_type: violation_to_error
        grounds: ["errors[ERR_BLOCK_WINDOW_OUT_OF_TERM]"]
        distinguishing_aspect: "A block with start_time >= end_time is rejected ERR_BLOCK_WINDOW_OUT_OF_TERM before any placement machinery runs."
