- rule_id: compensating_invariant
  instances:
  - name: sale_void_conserves_realized_gain
    grounds:
    - state_machines.LeaseFleetSale.PENDING_SETTLEMENT_to_VOIDED
    - state_machines.LeaseFleetCar.SOLD_to_HELD
    - calculations.sale_gain_loss
    - calculations.fleet_capital_reconciliation
    - entities.LeaseFleetSale.fields.gain_loss_cents
    distinguishing_aspect: 'The conserved quantity is the MONETARY ledger scalar PortfolioLedger.realized_gain_cents:
      voiding a PENDING_SETTLEMENT sale must leave the ledger at exactly 97500, the value it held before
      the sale was created, while the LeaseFleetSale row itself survives as VOIDED and is excluded from
      the SETTLED-scoped disposal aggregate.'
    test_recipe:
      setup:
      - Logical clock pinned to 2026-10-01T00:00:00Z before any order is taken, so every date-dependent
        rule reads a fixed instant.
      - 'CarType TC-4700 (TANK, build_hours 6, regulatory_life_years 40, family FAM-A) carrying one WHEELSET
        bill-of-material row: WS-1001 at 4 per car, unit_cost 180000 cents, lead_time 30 days, opening
        on_hand_qty 200.'
      - RETAINED order A (quantity 1, planned_shop_days 6, priority_rank 1) reserved, released, changed
        over on FAM-A 2026-09-14..2026-09-20 and completed 2026-09-20; the committed quote is 1015000
        cents and the completion mints LeaseFleetCar A (acquisition_cost_cents 1015000, built_date 2026-09-20,
        status HELD).
      - Sale A on car A (sale_price 1100000, writeback_liability 0, sale_date 2026-09-25) created and
        then SETTLED, which moves PortfolioLedger.realized_gain_cents from 0 to 97500 and leaves it as
        the standing baseline the pair under test must not disturb.
      - RETAINED order B (quantity 1, priority_rank 2) reserved, released, changed over on FAM-A 2026-09-21..2026-09-27
        and completed 2026-09-27, minting LeaseFleetCar B; car A is already SOLD, so the live fleet never
        holds more than one car.
      - 'State at the trigger: realized_gain_cents == 97500, committed_capital_cents == 2030000, car B
        HELD with acquisition_cost_cents 1015000 and built_date 2026-09-27, no SETTLED-scoped disposal
        beyond sale A.'
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-10-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: TC-4700
          car_class: TANK
          build_hours: 6
          regulatory_life_years: 40
          line_count_family: FAM-A
        as: ProductionPlanner
        captures:
          car_type_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-1001
          component_class: WHEELSET
          unit_cost_cents: 180000
          lead_time_days: 30
          on_hand_qty: 200
        as: SupplyChainCoordinator
        captures:
          wheelset_id: $.data.id
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${car_type_id}
          component_id: ${wheelset_id}
          qty_per_car: 4
        as: ProductionPlanner
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${car_type_id}
          quantity: 1
          planned_shop_days: 6
          disposition: RETAINED
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2027-03-01'
        as: ProductionPlanner
        captures:
          order_a_id: $.data.id
      - call: POST /api/v1/production-orders/${order_a_id}/reserve-components
        payload: {}
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${order_a_id}/release
        payload: {}
        as: ProductionPlanner
      - call: POST /api/v1/production-lines/FAM-A/changeover
        payload:
          production_order_id: ${order_a_id}
          scheduled_start_date: '2026-09-14'
          scheduled_end_date: '2026-09-20'
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${order_a_id}/complete
        payload:
          completed_qty: 1
          completion_date: '2026-09-20'
        as: ProductionPlanner
      - call: GET /api/v1/lease-fleet-cars?production_order_id=${order_a_id}
        as: PortfolioManager
        captures:
          car_a_id: $.data[0].id
      - call: POST /api/v1/lease-fleet-sales
        payload:
          lease_fleet_car_id: ${car_a_id}
          buyer_name: Steel Wheel Partners
          sale_price_cents: 1100000
          writeback_liability_cents: 0
          sale_date: '2026-09-25'
        as: PortfolioManager
        captures:
          sale_a_id: $.data.id
      - call: POST /api/v1/lease-fleet-sales/${sale_a_id}/settle
        payload: {}
        as: PortfolioManager
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${car_type_id}
          quantity: 1
          planned_shop_days: 6
          disposition: RETAINED
          priority_rank: 2
          order_date: '2026-09-01'
          required_delivery_date: '2027-03-01'
        as: ProductionPlanner
        captures:
          order_b_id: $.data.id
      - call: POST /api/v1/production-orders/${order_b_id}/reserve-components
        payload: {}
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${order_b_id}/release
        payload: {}
        as: ProductionPlanner
      - call: POST /api/v1/production-lines/FAM-A/changeover
        payload:
          production_order_id: ${order_b_id}
          scheduled_start_date: '2026-09-21'
          scheduled_end_date: '2026-09-27'
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${order_b_id}/complete
        payload:
          completed_qty: 1
          completion_date: '2026-09-27'
        as: ProductionPlanner
      - call: GET /api/v1/lease-fleet-cars?production_order_id=${order_b_id}
        as: PortfolioManager
        captures:
          car_b_id: $.data[0].id
      - call: GET /api/v1/portfolio-ledger/reconciliation
        as: PortfolioManager
        captures:
          snap_realized_gain_cents: $.data.realized_gain_cents
      trigger:
      - call: POST /api/v1/lease-fleet-sales
        payload:
          lease_fleet_car_id: ${car_b_id}
          buyer_name: Great Lakes Rail Leasing
          sale_price_cents: 1200000
          writeback_liability_cents: 0
          sale_date: '2026-10-01'
        as: PortfolioManager
        captures:
          sale_b_id: $.data.id
          sale_b_gain_loss_cents: $.data.gain_loss_cents
      - call: GET /api/v1/portfolio-ledger/reconciliation
        as: PortfolioManager
        captures:
          midflight_realized_gain_cents: $.data.realized_gain_cents
          midflight_newest_basis_cents: $.data.newest_basis_cents
      - call: POST /api/v1/lease-fleet-sales/${sale_b_id}/void
        payload:
          reason: buyer financing fell through
        as: PortfolioManager
      - call: GET /api/v1/portfolio-ledger/reconciliation
        as: PortfolioManager
        captures:
          post_void_realized_gain_cents: $.data.realized_gain_cents
          post_void_newest_basis_cents: $.data.newest_basis_cents
      - call: GET /api/v1/lease-fleet-cars/${car_b_id}
        as: PortfolioManager
        captures:
          car_b_status: $.data.status
      assert:
      - 'PortfolioLedger.realized_gain_cents == 97500 after the void, and the two live reads agree: mid-flight
        ${midflight_realized_gain_cents} == 97500 and post-void ${post_void_realized_gain_cents} == 97500.'
      - PortfolioLedger.realized_gain_cents == ${snap_realized_gain_cents}, the snapshot taken before
        the forward action, so the pair is exactly compensating on the ledger scalar.
      - LeaseFleetCar.${car_b_id}.status == HELD and ${car_b_status} == HELD, restoring the car the forward
        action had driven to SOLD.
      - 'LeaseFleetSale.${sale_b_id}.status == VOIDED: the sale row is NOT deleted, so the LeaseFleetSale
        row count is legitimately not restored — the compensation is a status change, not a rollback of
        the row.'
      - LeaseFleetSale.${sale_b_id}.gain_loss_cents == 195000 with ${sale_b_gain_loss_cents} == 195000
        (the computed 1200000 - (1015000 - 4 * 2500) - 0), so the voided sale keeps its recorded gain
        on the row while contributing nothing to the ledger.
      - GET /portfolio-ledger/reconciliation oldest_basis_cents == 930000 == committed_capital_cents 2030000
        - disposal_proceeds_net 1100000, so the voided sale's 1200000 sale_price is excluded from the
        SETTLED-scoped disposal aggregate and sale A's 1100000 remains the only disposal counted.
      - GET /portfolio-ledger/reconciliation newest_basis_cents == 1005000 with ${post_void_newest_basis_cents}
        == 1005000 after the void, against ${midflight_newest_basis_cents} == 0 while car B stood SOLD
        and no live car remained, so the live-fleet NBV basis is restored as well.
      - GET /portfolio-ledger/reconciliation drift_cents == -75000 (930000 - 1005000).
      - PortfolioLedger.committed_capital_cents == 2030000 == 2 * 1015000, untouched by the sale/void
        pair because only the two RETAINED completions ever move it.
      - 'LeaseFleetCar.${car_a_id}.status == SOLD: sale A was settled and never compensated, so it is
        the standing baseline rather than part of the pair under test.'
  - name: reserve_cancel_conserves_component_on_hand
    grounds:
    - state_machines.ProductionOrder.DRAFT_to_COMPONENT_RESERVED
    - state_machines.ProductionOrder.COMPONENT_RESERVED_to_CANCELLED
    - calculations.component_allocation
    - entities.Component.fields.on_hand_qty
    - entities.Component.fields.reserved_qty
    distinguishing_aspect: 'The conserved quantity is the PHYSICAL inventory count Component.on_hand_qty:
      reserving wheelset and casting stock for an order and then cancelling it must return every covered
      component to its exact pre-reservation count, while Component.reserved_qty is legitimately left
      unchanged and COATING stock is never committed at all.'
    test_recipe:
      setup:
      - Logical clock pinned to 2026-10-01T00:00:00Z; empty DB.
      - 'CarType TC-5100 (BOXCAR, build_hours 5, regulatory_life_years 30, family FAM-B) with three bill-of-material
        rows: WHEELSET WS-2001 at 4 per car (unit_cost 150000, lead 20 days, on_hand 500), CASTING CS-2002
        at 2 per car (unit_cost 90000, lead 45 days, on_hand 300) and COATING CT-2003 at 6 per car (unit_cost
        30000, lead 90 days, on_hand 250).'
      - ProductionOrder of quantity 5 on TC-5100 (planned_shop_days 25 == build_hours 5 * quantity 5,
        disposition SOLD, priority_rank 1, order_date 2026-09-01, required_delivery_date 2027-03-01),
        sitting in DRAFT.
      - 'The lead-time gate passes: horizon 181 days >= worst gated lead ceil(45 / 2) = 23 days; the reservation
        gate passes: 500 >= 4 * 5 and 300 >= 2 * 5.'
      - 'State at the trigger: on_hand_qty WS-2001 500, CS-2002 300, CT-2003 250; reserved_qty 0 on all
        three; the order has never been RELEASED.'
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-10-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: TC-5100
          car_class: BOXCAR
          build_hours: 5
          regulatory_life_years: 30
          line_count_family: FAM-B
        as: ProductionPlanner
        captures:
          car_type_b_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-2001
          component_class: WHEELSET
          unit_cost_cents: 150000
          lead_time_days: 20
          on_hand_qty: 500
        as: SupplyChainCoordinator
        captures:
          ws_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CS-2002
          component_class: CASTING
          unit_cost_cents: 90000
          lead_time_days: 45
          on_hand_qty: 300
        as: SupplyChainCoordinator
        captures:
          cs_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CT-2003
          component_class: COATING
          unit_cost_cents: 30000
          lead_time_days: 90
          on_hand_qty: 250
        as: SupplyChainCoordinator
        captures:
          ct_id: $.data.id
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${car_type_b_id}
          component_id: ${ws_id}
          qty_per_car: 4
        as: ProductionPlanner
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${car_type_b_id}
          component_id: ${cs_id}
          qty_per_car: 2
        as: ProductionPlanner
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${car_type_b_id}
          component_id: ${ct_id}
          qty_per_car: 6
        as: ProductionPlanner
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${car_type_b_id}
          quantity: 5
          planned_shop_days: 25
          disposition: SOLD
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2027-03-01'
        as: ProductionPlanner
        captures:
          order_id: $.data.id
      - call: GET /api/v1/components/${ws_id}
        as: ProductionPlanner
        captures:
          snap_ws_on_hand: $.data.on_hand_qty
      - call: GET /api/v1/components/${cs_id}
        as: ProductionPlanner
        captures:
          snap_cs_on_hand: $.data.on_hand_qty
      - call: GET /api/v1/components/${ct_id}
        as: ProductionPlanner
        captures:
          snap_ct_on_hand: $.data.on_hand_qty
      trigger:
      - call: POST /api/v1/production-orders/${order_id}/reserve-components
        payload: {}
        as: ProductionPlanner
        captures:
          order_status_after_reserve: $.data.status
      - call: GET /api/v1/components/${ws_id}
        as: ProductionPlanner
        captures:
          mid_ws_on_hand: $.data.on_hand_qty
      - call: GET /api/v1/components/${cs_id}
        as: ProductionPlanner
        captures:
          mid_cs_on_hand: $.data.on_hand_qty
      - call: GET /api/v1/components/${ct_id}
        as: ProductionPlanner
        captures:
          mid_ct_on_hand: $.data.on_hand_qty
      - call: POST /api/v1/production-orders/${order_id}/cancel
        payload:
          reason: customer withdrew the order
        as: ProductionPlanner
      - call: GET /api/v1/components/${ws_id}
        as: ProductionPlanner
        captures:
          final_ws_on_hand: $.data.on_hand_qty
          final_ws_reserved: $.data.reserved_qty
      - call: GET /api/v1/components/${cs_id}
        as: ProductionPlanner
        captures:
          final_cs_on_hand: $.data.on_hand_qty
          final_cs_reserved: $.data.reserved_qty
      - call: GET /api/v1/components/${ct_id}
        as: ProductionPlanner
        captures:
          final_ct_on_hand: $.data.on_hand_qty
      - call: GET /api/v1/production-orders/${order_id}
        as: ProductionPlanner
        captures:
          final_order_status: $.data.status
      assert:
      - Component.${ws_id}.on_hand_qty == 500 with ${final_ws_on_hand} == 500 after the cancel, exactly
        the snapshot ${snap_ws_on_hand} == 500; the mid-flight read ${mid_ws_on_hand} == 480 proves the
        forward leg really moved it by qty_per_car 4 * quantity 5 = 20.
      - Component.${cs_id}.on_hand_qty == 300 with ${final_cs_on_hand} == 300 after the cancel, exactly
        the snapshot ${snap_cs_on_hand} == 300, restored from the mid-flight ${mid_cs_on_hand} == 290
        (decrement 2 * 5 = 10).
      - 'The conservation is stated as an explicit formula over the covered rows: 500 - 4 * 5 + 4 * 5
        == 500 for WS-2001 and 300 - 2 * 5 + 2 * 5 == 300 for CS-2002.'
      - Component.${ws_id}.reserved_qty == 0 and Component.${cs_id}.reserved_qty == 0, confirmed by ${final_ws_reserved}
        == 0 and ${final_cs_reserved} == 0; they are legitimately NOT restored because they never moved,
        since §1.3 component_allocation counts only RELEASED orders in its reservations term and this
        order never left COMPONENT_RESERVED.
      - Component.${ct_id}.on_hand_qty == 250 both before and after, so ${snap_ct_on_hand} == 250 and
        ${mid_ct_on_hand} == 250 and ${final_ct_on_hand} == 250; the COATING row is exempt from the stock-commit
        path, which is why the invariant is scoped to the WHEELSET and CASTING rows only.
      - ProductionOrder.${order_id}.status == CANCELLED with ${order_status_after_reserve} == COMPONENT_RESERVED
        and ${final_order_status} == CANCELLED, so the order row persists and the ProductionOrder row
        count is legitimately not restored.
      - 'Component.${ws_id}.on_hand_qty == ${snap_ws_on_hand} and Component.${cs_id}.on_hand_qty == ${snap_cs_on_hand}:
        each covered component equals its own pre-reservation snapshot, so no drift survives the pair.'
