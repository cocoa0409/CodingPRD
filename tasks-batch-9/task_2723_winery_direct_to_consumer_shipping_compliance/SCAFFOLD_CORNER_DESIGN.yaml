          setup:
            - "Two wineries exist: Estate 1 (with an ACTIVE TX permit and an APPROVED GSO enrollment) and Estate 2 (no permits, no enrollments)."
            - "Two consumers exist: Ada (ID-verified, the buyer) and Bo."
