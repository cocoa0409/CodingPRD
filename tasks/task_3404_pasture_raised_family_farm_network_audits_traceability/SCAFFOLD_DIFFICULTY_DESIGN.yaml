            - "http status == 422"

  - rule_id: boundary_precision_check
    instances:
      - name: bird_capacity_exact_equality_boundary
        grounds:
          - calculations.effective_bird_capacity
          - errors[ERR_BIRD_CAPACITY_INSUFFICIENT]
        distinguishing_aspect: |
          Bird-capacity ratio boundary on POST /farm-network/farms/{id}/activate: the binding
          constraint is the barn (90 sqft / 1.2 = 75 birds); declared 76 fails with
          ERR_BIRD_CAPACITY_INSUFFICIENT while exactly 75 passes (inclusive <=).
        test_recipe:
          setup:
            - "farm F with pasture_sqft 10800 (cap 100), barn_sqft 90 (cap 75), nest_box_count 20 (cap 100) -> effective_bird_capacity 75, declared_bird_count 76"
            - "INITIAL audit PASSED (certification CERTIFIED) and ACTIVE contract in place"
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Tight Barn Farm", region: "MN", pasture_sqft: 10800, barn_sqft: 90, nest_box_count: 20, declared_bird_count: 76 }
              as: NetworkManager
              captures: { f_id: $.data.id }
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "INITIAL", scheduled_for: "2026-09-03T00:00:00Z" }
              as: NetworkManager
              captures: { a_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a_id}/complete"
              payload: { outcome: "PASSED" }
              as: Auditor
              as_user_id: "auditor-a"
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
              captures: { f_v2: $.data.version }
            - call: "POST /farm-network/farms/${f_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 150, premium_cents_per_dozen: 90, start_date: "2026-09-01", end_date: "2027-08-31", expected_farm_version: "${f_v2}" }
              as: NetworkManager
          trigger:
            - call: "POST /farm-network/farms/${f_id}/activate"
              as: NetworkManager
              captures: { err: $.data.error_id }
            - call: "PATCH /farm-network/farms/${f_id}"
              payload: { declared_bird_count: 75 }
              as: NetworkManager
            - call: "POST /farm-network/farms/${f_id}/activate"
              as: NetworkManager
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
          assert:
            - "first activate (declared 76 > capacity 75) returns error_id == ERR_BIRD_CAPACITY_INSUFFICIENT, http 422"
            - "Farm.${f_id}.effective_bird_capacity == 75 (barn is the binding constraint: min(100, 75, 100))"
            - "second activate (declared 75 == capacity 75, inclusive boundary) succeeds: farm.status == ACTIVE"

      - name: route_capacity_exact_equality_boundary
        grounds:
          - calculations.route_load_reconciliation
          - errors[ERR_ROUTE_CAPACITY_EXCEEDED]
