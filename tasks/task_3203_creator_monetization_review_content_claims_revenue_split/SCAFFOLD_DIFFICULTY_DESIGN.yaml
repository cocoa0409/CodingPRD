            - "PayoutBatch.${b_q}.adjusted_net_cents == 0, below the 100-cent threshold, so lock left the batch in status DRAFT"
            - "the release is rejected with 409 ERR_INVALID_STATE (the priority-4 state rule fires before the priority-11 threshold rule)"
            - "a routing created one second earlier at 2026-09-30T23:59:59Z would have been inside the window and produced creator_share_cents 5500"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: dispute_then_release_restores_creator_share_cents_exactly
        grounds:
          - state_machines.Claim.ACTIVE_to_DISPUTED
          - state_machines.Claim.DISPUTED_to_RELEASED
          - calculations.royalty_share_split
        distinguishing_aspect: "The invariant is pinned over a cents quantity: after dispute-then-release, ContentItem.routed_revenue_cents returns to exactly 5500 and sum(RevenueRouting.creator_share_cents) equals sum(RevenueRouting.partner_share_cents) weighted by the AD rate with zero drift — a different conserved quantity from the total-period spend in the sibling instance."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Channel US approved, one AD routing of 10000 recorded as PAID_CREATOR with creator_share 5500 and partner_share 4500."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Invariant US", country_code: "US", lifetime_watch_hours: 8000, subscriber_count: 1500, tax_tin_status: "TIN_PROVIDED", payment_threshold_cents: 100 }
              as: Anonymous
              captures: { ch_v: $.data.id }
            - call: "POST /api/reference-files"
              payload: { rights_holder_name: "Invariant Rights", asset_kind: "AUDIO", reference_fingerprint: "fp-invariant-1", policy_mode: "MONETIZE", claimed_segment_seconds: 90 }
              as: RightsHolder
              as_user_id: "rh-invariant-1"
              captures: { rf_v: $.data.id }
            - call: "POST /api/channels/${ch_v}/content-items"
              payload: { title: "Invariant Source", duration_seconds: 800, category_code: "MUSIC" }
              as: Creator
              as_user_id: "${ch_v}"
              captures: { i_v: $.data.id }
            - call: "POST /api/channels/${ch_v}/content-items/${i_v}/requests-review"
              payload: {}
              as: Creator
              as_user_id: "${ch_v}"
            - call: "GET /api/content-items/${i_v}"
              payload: {}
              as: Any
              captures: { i_vv1: $.data.version }
            - call: "POST /api/revenue-routings"
              payload: { content_item_id: "${i_v}", stream_type: "AD", gross_revenue_cents: 10000, expected_content_item_version: "${i_vv1}" }
              as: PlatformAdmin
              captures: { r_v: $.data.id }
            - call: "GET /api/claims"
              payload: { content_item_id: "${i_v}" }
              as: Any
              captures: { "cl_v": "$.data[0].id", "cl_vv1": "$.data[0].version" }
          trigger:
            - call: "POST /api/claims/${cl_v}/dispute"
              payload: { expected_claim_version: "${cl_vv1}", reason_code: "LICENSED" }
              as: Creator
              as_user_id: "${ch_v}"
            - call: "POST /api/claims/${cl_v}/dispute/resolve"
              payload: { resolution: "RELEASE" }
              as: RightsHolder
              as_user_id: "${rf_v}"
          assert:
            - "after the dispute: ContentItem.${i_v}.routed_revenue_cents == 0 and RevenueRouting.${r_v}.creator_share_cents == 0"
            - "after the release: ContentItem.${i_v}.routed_revenue_cents == 5500"
            - "after the release: RevenueRouting.${r_v}.creator_share_cents == 5500 and partner_share_cents == 4500"
            - "creator_share_cents + partner_share_cents == 10000 on both sides of the compensation — zero drift"

      - name: takedown_then_counter_notification_release_conserves_period_total
        grounds:
          - state_machines.Claim.APPEALED_to_TAKEN_DOWN
          - state_machines.Claim.TAKEN_DOWN_to_RELEASED
          - calculations.strike_escalation_thresholds
        distinguishing_aspect: "The conserved quantity is total AD spend over the period: takedown parks the held creator share of 5500 and the counter-notification release pays exactly 5500 back, so sum of creator_share_cents over the whole stream is unchanged — an aggregate-spend invariant, not a per-item balance."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Channel US approved, one AD routing of 10000 already PAID_CREATOR, the claim advanced through dispute to a pending SECOND appeal."
          setup_api_calls:
