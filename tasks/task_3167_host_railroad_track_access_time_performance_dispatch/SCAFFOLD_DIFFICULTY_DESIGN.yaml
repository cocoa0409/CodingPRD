# =============================================================================
# §1.8 Scaffold Difficulty Design — task_3167 host railroad dispatch
# 9 rules × 2 instances. Anchors define the canonical setup chains once;
# aliases re-execute the same calls in each instance's fresh empty DB.
#
# Canonical corridor geometry (anchors):
#   seg1: IL, mileposts 0.0-10.0,  SINGLE, cap 20, pure 21 min, dwell 0
#   seg2: MO, mileposts 10.0-40.0, SINGLE, cap 20, pure 40 min, dwell 0
#   OA: threshold 15, penalty 50c/min, incentive 12c/train-mile, target 0.80,
#       allowance 0.25  => padded seg1 = ceil(26.25) = 27 min, seg2 = 50 min
#   1-run timetable T1: 2026-09-02 dep 08:00 -> passages [08:00,08:27) /
#   [08:27,09:17); scheduled arrival 09:17.
#   2-run timetable T2: 2026-09-03 dep 08:00 headway 120 -> run1 08:00-09:17,
#   run2 10:00-11:17.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: otp_endpoint_vs_all_stations_divergence
        grounds:
          - calculations.otp_measurement
          - entities.TrainRun.fields.on_time_endpoint
          - entities.TrainRun.fields.on_time_all_stations
        distinguishing_aspect: "Same completed run yields on_time_endpoint=true (arrival exactly 15 min late, at threshold) but on_time_all_stations=false (segment 1 exit 18 min late) — the two OTP variants operate on the TrainRun/performance domain and provably diverge for identical data."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Published 1-run timetable on 2026-09-02; run departed 08:00; passage 1 actual exit 18 min late; passage 2 exit and arrival exactly 15 min late."
          setup_api_calls:
            - &d_clock
              call: "POST /rail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - &d_host
              call: "POST /rail/host-railroads"
              payload: { name: "Great Plains Rail", reporting_mark: "GPR" }
              as: SystemAdmin
              captures: { host_id: $.data.id }
            - &d_corr
              call: "POST /rail/corridors"
              payload: { host_railroad_id: "${host_id}", code: "GP-1", name: "River Cities", endpoint_a: "CHI", endpoint_b: "KCY", service_type: "STATE_SUPPORTED", annual_cost_cents: 10000000 }
              as: SystemAdmin
              captures: { corr_id: $.data.id }
            - &d_seg1
              call: "POST /rail/track-segments"
              payload: { corridor_id: "${corr_id}", sequence_no: 1, milepost_start: 0.0, milepost_end: 10.0, state_code: "IL", track_class: "SINGLE", capacity_trains_per_day: 20, pure_run_minutes: 21, dwell_after_minutes: 0 }
              as: SystemAdmin
              captures: { seg1_id: $.data.id }
            - &d_seg2
              call: "POST /rail/track-segments"
              payload: { corridor_id: "${corr_id}", sequence_no: 2, milepost_start: 10.0, milepost_end: 40.0, state_code: "MO", track_class: "SINGLE", capacity_trains_per_day: 20, pure_run_minutes: 40, dwell_after_minutes: 0 }
              as: SystemAdmin
              captures: { seg2_id: $.data.id }
            - &d_oa
              call: "POST /rail/operating-agreements"
              payload: { host_railroad_id: "${host_id}", corridor_id: "${corr_id}", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", on_time_threshold_minutes: 15, penalty_rate_cents_per_minute: 50, incentive_rate_cents_per_train_mile: 12, otp_target_pct: 0.80, running_time_allowance_pct: 0.25 }
              as: PassengerOperator
              captures: { oa_id: $.data.id }
            - &d_oa_act
              call: "POST /rail/operating-agreements/${oa_id}/activate"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { oa_v: $.data.version }
            - &d_tt1
              call: "POST /rail/timetables"
              payload: { corridor_id: "${corr_id}", operating_agreement_id: "${oa_id}", service_date_start: "2026-09-02", service_date_end: "2026-09-02", trains_per_day: 1, departure_time_of_day: "08:00", headway_minutes: 120 }
              as: PassengerOperator
              captures: { tt1_id: $.data.id }
            - &d_tt1_prop
              call: "POST /rail/timetables/${tt1_id}/propose"
              payload: {}
              as: PassengerOperator
            - &d_tt1_rev
              call: "POST /rail/timetables/${tt1_id}/review"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - &d_tt1_rat
              call: "POST /rail/timetables/${tt1_id}/ratify"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - &d_tt1_pub
              call: "POST /rail/timetables/${tt1_id}/publish"
              payload: {}
              as: PassengerOperator
            - &d_runs1
              call: "GET /rail/train-runs"
              payload: { timetable_id: "${tt1_id}" }
              as: PassengerOperator
              captures: { run_id: "$.data[0].id" }
            - &d_pass1
              call: "GET /rail/segment-passages"
              payload: { train_run_id: "${run_id}" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { pass1_id: "$.data[0].id", pass2_id: "$.data[1].id" }
            - &d_dep1
              call: "POST /rail/train-runs/${run_id}/depart"
              payload: { actual_departure_at: "2026-09-02T08:00:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - call: "POST /rail/segment-passages/${pass1_id}/actualize"
              payload: { actual_entry_at: "2026-09-02T08:00:00Z", actual_exit_at: "2026-09-02T08:45:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - call: "POST /rail/segment-passages/${pass2_id}/actualize"
              payload: { actual_entry_at: "2026-09-02T08:45:00Z", actual_exit_at: "2026-09-02T09:32:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
          trigger:
            - call: "POST /rail/train-runs/${run_id}/complete"
              payload: { actual_arrival_at: "2026-09-02T09:32:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
          assert:
            - "TrainRun.${run_id}.destination_arrival_delay_minutes == 15"
            - "TrainRun.${run_id}.on_time_endpoint == true"
            - "TrainRun.${run_id}.on_time_all_stations == false"
            - "TrainRun.${run_id}.status == COMPLETED"

      - name: settlement_gross_vs_net_host_minutes
        grounds:
          - calculations.host_delay_attribution
          - entities.SettlementStatement.fields.host_delay_minutes
          - state_machines.SettlementStatement.DISPUTED_to_REISSUED
        distinguishing_aspect: "Same incident set yields host_delay_minutes=20 under the GROSS variant at issue and 13 under the NET variant at reissue (20 host minutes minus 7 confirmed non-host minutes) — a dual-variant calculation on the settlement/invoice domain, distinct from the TrainRun OTP domain of the sibling instance."
        test_recipe:
          setup:
            - "Published 1-run timetable; run completed 20 min late; host incident of 20 min CONFIRMED; STATION_DWELL incident of 7 min CONFIRMED."
          setup_api_calls:
            - *d_clock
            - *d_host
            - *d_corr
            - *d_seg1
            - *d_seg2
            - *d_oa
            - *d_oa_act
            - *d_tt1
            - *d_tt1_prop
            - *d_tt1_rev
            - *d_tt1_rat
            - *d_tt1_pub
            - *d_runs1
            - *d_pass1
            - *d_dep1
            - &d_act1_late
              call: "POST /rail/segment-passages/${pass1_id}/actualize"
              payload: { actual_entry_at: "2026-09-02T08:00:00Z", actual_exit_at: "2026-09-02T08:43:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - &d_act2_late
              call: "POST /rail/segment-passages/${pass2_id}/actualize"
              payload: { actual_entry_at: "2026-09-02T08:43:00Z", actual_exit_at: "2026-09-02T09:35:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - &d_comp1_late
              call: "POST /rail/train-runs/${run_id}/complete"
              payload: { actual_arrival_at: "2026-09-02T09:35:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - &d_inc_host20
              call: "POST /rail/delay-incidents"
              payload: { train_run_id: "${run_id}", segment_passage_id: "${pass1_id}", cause_code: "HOST_FREIGHT_HOLD", delay_minutes: 20 }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { inc_h20: $.data.id }
            - &d_inc_host20_conf
              call: "POST /rail/delay-incidents/${inc_h20}/confirm"
              payload: {}
              as: PassengerOperator
            - &d_inc_dwell7
              call: "POST /rail/delay-incidents"
              payload: { train_run_id: "${run_id}", cause_code: "STATION_DWELL", delay_minutes: 7 }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { inc_d7: $.data.id }
            - &d_inc_dwell7_conf
              call: "POST /rail/delay-incidents/${inc_d7}/confirm"
              payload: {}
              as: PassengerOperator
            - &d_stmt
              call: "POST /rail/settlement-statements"
              payload: { operating_agreement_id: "${oa_id}", period_start: "2026-09-01", period_end: "2026-09-30" }
              as: PassengerOperator
              captures: { stmt_id: $.data.id }
            - call: "POST /rail/settlement-statements/${stmt_id}/issue"
              payload: {}
              as: PassengerOperator
            - call: "POST /rail/settlement-statements/${stmt_id}/dispute"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
          trigger:
            - call: "POST /rail/settlement-statements/${stmt_id}/reissue"
              payload: {}
              as: PassengerOperator
          assert:
            - "the DRAFT/ISSUED statement (GROSS) had host_delay_minutes == 20 and penalty_cents == 3000 (50 x 20 x tier-3 multiplier 3, otp 0.0000)"
            - "SettlementStatement.${stmt_id}.computation_variant == NET after reissue"
            - "SettlementStatement.${stmt_id}.host_delay_minutes == 13"
            - "SettlementStatement.${stmt_id}.penalty_cents == 1950"
            - "SettlementStatement.${stmt_id}.net_cents == -1950"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: penalty_tier_multiplier_branching
        grounds:
          - calculations.incentive_penalty_settlement
          - entities.SettlementStatement.fields.penalty_cents
        distinguishing_aspect: "Mode (a): the formula selects a tier multiplier through nested conditional branches on otp (0.50 falls below target-0.15, so multiplier 3) combined non-linearly with host_delay_minutes and train_miles (80 = 2 runs x 40.0 miles) — penalty 50 x 10 x 3 = 1500 cents, pinned literally."
        test_recipe:
          setup:
            - "Published 2-run timetable on 2026-09-03; run1 on time (arrival 09:32), run2 late (arrival 11:33); one CONFIRMED host incident of 10 minutes on run2."
          setup_api_calls:
            - *d_clock
            - *d_host
            - *d_corr
            - *d_seg1
            - *d_seg2
            - *d_oa
            - *d_oa_act
            - &d_tt2
              call: "POST /rail/timetables"
              payload: { corridor_id: "${corr_id}", operating_agreement_id: "${oa_id}", service_date_start: "2026-09-03", service_date_end: "2026-09-03", trains_per_day: 2, departure_time_of_day: "08:00", headway_minutes: 120 }
              as: PassengerOperator
              captures: { tt2_id: $.data.id }
            - &d_tt2_prop
              call: "POST /rail/timetables/${tt2_id}/propose"
              payload: {}
              as: PassengerOperator
            - &d_tt2_rev
              call: "POST /rail/timetables/${tt2_id}/review"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - &d_tt2_rat
              call: "POST /rail/timetables/${tt2_id}/ratify"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - &d_tt2_pub
              call: "POST /rail/timetables/${tt2_id}/publish"
              payload: {}
              as: PassengerOperator
            - &d_runs2
              call: "GET /rail/train-runs"
              payload: { timetable_id: "${tt2_id}" }
              as: PassengerOperator
              captures: { r1_id: "$.data[0].id", r2_id: "$.data[1].id" }
            - &d_pass_r1
              call: "GET /rail/segment-passages"
              payload: { train_run_id: "${r1_id}" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { r1p1: "$.data[0].id", r1p2: "$.data[1].id" }
            - &d_pass_r2
              call: "GET /rail/segment-passages"
              payload: { train_run_id: "${r2_id}" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { r2p1: "$.data[0].id", r2p2: "$.data[1].id" }
            - &d_dep_r1
              call: "POST /rail/train-runs/${r1_id}/depart"
              payload: { actual_departure_at: "2026-09-03T08:00:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - &d_act_r1p1
              call: "POST /rail/segment-passages/${r1p1}/actualize"
              payload: { actual_entry_at: "2026-09-03T08:00:00Z", actual_exit_at: "2026-09-03T08:27:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - &d_act_r1p2_ontime
              call: "POST /rail/segment-passages/${r1p2}/actualize"
              payload: { actual_entry_at: "2026-09-03T08:27:00Z", actual_exit_at: "2026-09-03T09:32:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - &d_comp_r1_ontime
              call: "POST /rail/train-runs/${r1_id}/complete"
              payload: { actual_arrival_at: "2026-09-03T09:32:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - &d_dep_r2
              call: "POST /rail/train-runs/${r2_id}/depart"
              payload: { actual_departure_at: "2026-09-03T10:00:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - &d_act_r2p1
              call: "POST /rail/segment-passages/${r2p1}/actualize"
              payload: { actual_entry_at: "2026-09-03T10:00:00Z", actual_exit_at: "2026-09-03T10:27:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - &d_act_r2p2_late
              call: "POST /rail/segment-passages/${r2p2}/actualize"
              payload: { actual_entry_at: "2026-09-03T10:27:00Z", actual_exit_at: "2026-09-03T11:33:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - &d_comp_r2_late
              call: "POST /rail/train-runs/${r2_id}/complete"
              payload: { actual_arrival_at: "2026-09-03T11:33:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - call: "POST /rail/delay-incidents"
              payload: { train_run_id: "${r2_id}", segment_passage_id: "${r2p2}", cause_code: "HOST_SIGNAL", delay_minutes: 10 }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { inc_t3: $.data.id }
            - call: "POST /rail/delay-incidents/${inc_t3}/confirm"
              payload: {}
              as: PassengerOperator
          trigger:
            - call: "POST /rail/settlement-statements"
              payload: { operating_agreement_id: "${oa_id}", period_start: "2026-09-01", period_end: "2026-09-30" }
              as: PassengerOperator
              captures: { stmt_t3: $.data.id }
          assert:
            - "SettlementStatement.${stmt_t3}.completed_run_count == 2"
            - "SettlementStatement.${stmt_t3}.otp_pct == 50.0000"
            - "SettlementStatement.${stmt_t3}.train_miles == 80"
            - "SettlementStatement.${stmt_t3}.host_delay_minutes == 10"
            - "SettlementStatement.${stmt_t3}.penalty_cents == 1500"
            - "SettlementStatement.${stmt_t3}.incentive_cents == 0"
            - "SettlementStatement.${stmt_t3}.net_cents == -1500"

      - name: funding_allocation_per_line_rounding
        grounds:
          - calculations.funding_cost_allocation
          - entities.FundingAgreement.fields.allocated_cost_cents
        distinguishing_aspect: "Mode (b): nested rounding with pinned order — round the period cost (round(10000000 x 30/365) = 821918), then round each state line separately (IL 205479.5 -> 205480; MO 616438.5 -> 616439), then sum the rounded lines (821919), which provably differs from the period cost by one cent because the remainder is not redistributed."
        test_recipe:
          setup:
            - "Canonical corridor: annual_cost_cents 10,000,000; IL segments total 10.0 mi, MO segments total 30.0 mi. Two DRAFT funding agreements for period 2026-09-01..2026-09-30 (30 days)."
          setup_api_calls:
            - *d_clock
            - *d_host
            - *d_corr
            - *d_seg1
            - *d_seg2
            - call: "POST /rail/funding-agreements"
              payload: { corridor_id: "${corr_id}", state_code: "IL", period_start: "2026-09-01", period_end: "2026-09-30" }
              as: StateSponsor
              captures: { fa_il: $.data.id }
            - call: "POST /rail/funding-agreements"
              payload: { corridor_id: "${corr_id}", state_code: "MO", period_start: "2026-09-01", period_end: "2026-09-30" }
              as: StateSponsor
              captures: { fa_mo: $.data.id }
            - call: "POST /rail/funding-agreements/${fa_il}/commit"
              payload: {}
              as: StateSponsor
          trigger:
            - call: "POST /rail/funding-agreements/${fa_mo}/commit"
              payload: {}
              as: StateSponsor
          assert:
            - "FundingAgreement.${fa_il}.allocated_cost_cents == 205480"
            - "FundingAgreement.${fa_mo}.allocated_cost_cents == 616439"
            - "FundingAgreement.${fa_il}.allocated_cost_cents + FundingAgreement.${fa_mo}.allocated_cost_cents == 821919 (one cent above the rounded period cost 821918 — per-line-then-sum order pinned)"
            - "both agreements have status == COMMITTED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: timetable_review_revision_cycle
        grounds:
          - state_machines.Timetable.UNDER_REVIEW_to_PROPOSED
          - entities.Timetable.fields.revision_no
        distinguishing_aspect: "The Timetable machine is cyclic: UNDER_REVIEW -> PROPOSED -> UNDER_REVIEW loops are legal and each loop increments revision_no (0 -> 1) — not a linear pipeline."
        test_recipe:
          setup:
            - "ACTIVE agreement; draft timetable for 2026-09-02."
          setup_api_calls:
            - *d_clock
            - *d_host
            - *d_corr
            - *d_seg1
            - *d_seg2
            - *d_oa
            - *d_oa_act
            - *d_tt1
            - *d_tt1_prop
            - *d_tt1_rev
            - call: "POST /rail/timetables/${tt1_id}/revise"
              payload: {}
              as: PassengerOperator
            - call: "POST /rail/timetables/${tt1_id}/propose"
              payload: {}
              as: PassengerOperator
            - call: "POST /rail/timetables/${tt1_id}/review"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
          trigger:
            - call: "POST /rail/timetables/${tt1_id}/ratify"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
          assert:
            - "Timetable.${tt1_id}.revision_no == 1 after exactly one UNDER_REVIEW -> PROPOSED loop"
            - "Timetable.${tt1_id}.status == RATIFIED after the second review round"

      - name: dispute_escalation_fork_divergent_resolution
        grounds:
          - state_machines.DispatchPriorityDispute.UNDER_REVIEW_to_RESOLVED
          - state_machines.DispatchPriorityDispute.ESCALATED_to_RESOLVED
          - state_machines.DelayIncident.DISPUTED_to_REVERSED
        distinguishing_aspect: "The DispatchPriorityDispute machine is a fork-join: UNDER_REVIEW -> RESOLVED(UPHELD) confirms the incident, while UNDER_REVIEW -> ESCALATED -> RESOLVED(OVERTURNED) reverses it and recomputes attributed minutes — divergent side-effect sets per branch on a different entity than the Timetable cycle."
        test_recipe:
          setup:
            - "Completed run 20 min late; two OPEN host incidents (20 min and 5 min)."
          setup_api_calls:
            - *d_clock
            - *d_host
            - *d_corr
            - *d_seg1
            - *d_seg2
            - *d_oa
            - *d_oa_act
            - *d_tt1
            - *d_tt1_prop
            - *d_tt1_rev
            - *d_tt1_rat
            - *d_tt1_pub
            - *d_runs1
            - *d_pass1
            - *d_dep1
            - *d_act1_late
            - *d_act2_late
            - *d_comp1_late
            - *d_inc_host20
            - call: "POST /rail/delay-incidents"
              payload: { train_run_id: "${run_id}", cause_code: "HOST_TRACK", delay_minutes: 5 }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { inc_h5: $.data.id }
            - call: "POST /rail/delay-incidents/${inc_h20}/dispute"
              payload: { reason: "freight hold mis-coded" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { disp_a: $.data.id }
            - call: "POST /rail/delay-incidents/${inc_h5}/dispute"
              payload: { reason: "challenged" }
              as: PassengerOperator
              captures: { disp_b: $.data.id }
            - call: "POST /rail/disputes/${disp_a}/escalate"
              payload: {}
              as: PassengerOperator
          trigger:
            - call: "POST /rail/disputes/${disp_a}/resolve"
              payload: { resolution: "OVERTURNED" }
              as: SystemAdmin
            - call: "POST /rail/disputes/${disp_b}/resolve"
              payload: { resolution: "UPHELD" }
              as: SystemAdmin
          assert:
            - "DelayIncident.${inc_h20}.status == REVERSED (escalated-overturned branch)"
            - "DelayIncident.${inc_h5}.status == CONFIRMED (direct-upheld branch)"
            - "TrainRun.${run_id}.attributed_host_delay_minutes == 5"
            - "DispatchPriorityDispute.${disp_a}.status == RESOLVED and resolution == OVERTURNED"
            - "DispatchPriorityDispute.${disp_b}.status == RESOLVED and resolution == UPHELD"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: disruption_bridge_three_hop_cascade
        grounds:
          - state_machines.ServiceDisruption.OPEN_to_BRIDGED
          - state_machines.TrainRun.SCHEDULED_to_DISRUPTED
          - state_machines.SegmentPassage.PLANNED_to_SKIPPED
        distinguishing_aspect: "Depth-3 chain from POST bridge: disruption -> TrainRun DISRUPTED (link 1) -> its PLANNED SegmentPassages SKIPPED (link 2) -> final passage skip auto-creates a DelayIncident with cause DISRUPTION and 77 coded minutes (link 3); each link is caused by the previous mutation, not by the original call."
        test_recipe:
          setup:
            - "Published 1-run timetable on 2026-09-02; run SCHEDULED 08:00-09:17; a disruption opens at exactly 08:00."
          setup_api_calls:
            - *d_clock
            - *d_host
            - *d_corr
            - *d_seg1
            - *d_seg2
            - *d_oa
            - *d_oa_act
            - *d_tt1
            - *d_tt1_prop
            - *d_tt1_rev
            - *d_tt1_rat
            - *d_tt1_pub
            - *d_runs1
            - call: "POST /rail/service-disruptions"
              payload: { corridor_id: "${corr_id}", disruption_type: "TRACK_FAILURE", started_at: "2026-09-02T08:00:00Z", reaccommodation_policy: "BUS_BRIDGE" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { dis_id: $.data.id }
          trigger:
            - call: "POST /rail/service-disruptions/${dis_id}/bridge"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - call: "GET /rail/segment-passages"
              payload: { train_run_id: "${run_id}" }
              as: PassengerOperator
              captures: { bp1: "$.data[0].status", bp2: "$.data[1].status" }
            - call: "GET /rail/delay-incidents"
              payload: { train_run_id: "${run_id}" }
              as: PassengerOperator
              captures: { auto_inc_min: "$.data[0].delay_minutes", auto_inc_code: "$.data[0].cause_code", auto_inc_origin: "$.data[0].origin", auto_inc_host: "$.data[0].host_attributable" }
          assert:
            - "ServiceDisruption.${dis_id}.status == BRIDGED and bus_bridge_active == true"
            - "TrainRun.${run_id}.status == DISRUPTED and cancellation_reason == DISRUPTION (link 1)"
            - "both SegmentPassages of the run are SKIPPED (link 2): ${bp1} == SKIPPED and ${bp2} == SKIPPED"
            - "exactly one auto-created DelayIncident exists for the run (link 3)"
            - "${auto_inc_code} == DISRUPTION and ${auto_inc_origin} == SYSTEM_DISRUPTION"
            - "${auto_inc_min} == 77 (whole minutes from 08:00 to scheduled arrival 09:17)"
            - "${auto_inc_host} == false"

      - name: agreement_suspend_two_hop_cascade
        grounds:
          - state_machines.OperatingAgreement.ACTIVE_to_SUSPENDED
          - state_machines.Timetable.PUBLISHED_to_SUSPENDED
          - state_machines.TrainRun.transitions
        distinguishing_aspect: "Depth-2 chain from a different trigger than the disruption cascade: POST suspend on the agreement -> PUBLISHED Timetable SUSPENDED (link 1) -> its SCHEDULED TrainRuns CANCELLED with reason AGREEMENT_SUSPENDED (link 2)."
        test_recipe:
          setup:
            - "Published 1-run timetable; run still SCHEDULED; agreement ACTIVE."
          setup_api_calls:
            - *d_clock
            - *d_host
            - *d_corr
            - *d_seg1
            - *d_seg2
            - *d_oa
            - *d_oa_act
            - *d_tt1
            - *d_tt1_prop
            - *d_tt1_rev
            - *d_tt1_rat
            - *d_tt1_pub
            - *d_runs1
          trigger:
            - call: "POST /rail/operating-agreements/${oa_id}/suspend"
              payload: { reason: "host embargo" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
          assert:
            - "OperatingAgreement.${oa_id}.status == SUSPENDED"
            - "Timetable.${tt1_id}.status == SUSPENDED (link 1)"
            - "TrainRun.${run_id}.status == CANCELLED and cancellation_reason == AGREEMENT_SUSPENDED (link 2)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: agreement_state_beats_settlement_period_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=16]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
        distinguishing_aspect: "Category pair state vs business_fiscal: the request violates both ERR_AGREEMENT_NOT_ACTIVE (agreement SUSPENDED, priority 7) and ERR_SETTLEMENT_PERIOD_INVALID (period 2027-10 outside the effective range, priority 16) — the state error must win."
        test_recipe:
          setup:
            - "Agreement activated then suspended; no timetables."
          setup_api_calls:
            - *d_clock
            - *d_host
            - *d_corr
            - *d_seg1
            - *d_seg2
            - *d_oa
            - *d_oa_act
            - call: "POST /rail/operating-agreements/${oa_id}/suspend"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
          trigger:
            - call: "POST /rail/settlement-statements"
              payload: { operating_agreement_id: "${oa_id}", period_start: "2027-10-01", period_end: "2027-10-31" }
              as: PassengerOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409"
            - "${err} == ERR_AGREEMENT_NOT_ACTIVE (state priority 7 beats business_fiscal priority 16)"

      - name: maintenance_safety_beats_occupancy_temporal
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_MAINTENANCE_CONFLICT]
        distinguishing_aspect: "Category pair business_safety vs business_temporal: one actualize call on run1's segment-2 passage [08:43,09:35) both intersects a LOCKED window [09:20,09:40) with zero buffer (safety) and overlaps run2's ACTUALIZED passage [08:50,09:10) on the same SINGLE segment (temporal) — ERR_MAINTENANCE_CONFLICT must win."
        test_recipe:
          setup:
            - "Published 2-run timetable on 2026-09-03; maintenance window on seg2 [09:20,09:40) buffer 0 LOCKED (no planned passage conflicts, so nothing is skipped); both runs EN_ROUTE; run1 passage-1 ACTUALIZED; run2 passage-2 ACTUALIZED early at [08:50,09:10)."
          setup_api_calls:
            - *d_clock
            - *d_host
            - *d_corr
            - *d_seg1
            - *d_seg2
            - *d_oa
            - *d_oa_act
            - *d_tt2
            - *d_tt2_prop
            - *d_tt2_rev
            - *d_tt2_rat
            - *d_tt2_pub
            - *d_runs2
            - *d_pass_r1
            - *d_pass_r2
            - call: "POST /rail/maintenance-windows"
              payload: { track_segment_id: "${seg2_id}", window_start_at: "2026-09-03T09:20:00Z", window_end_at: "2026-09-03T09:40:00Z", equipment_unit_id: "EQ-X", clearance_buffer_minutes: 0 }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { mw_x: $.data.id }
            - call: "POST /rail/maintenance-windows/${mw_x}/lock"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - *d_dep_r1
            - *d_dep_r2
            - *d_act_r1p1
            - call: "POST /rail/segment-passages/${r2p2}/actualize"
              payload: { actual_entry_at: "2026-09-03T08:50:00Z", actual_exit_at: "2026-09-03T09:10:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
          trigger:
            - call: "POST /rail/segment-passages/${r1p2}/actualize"
              payload: { actual_entry_at: "2026-09-03T08:43:00Z", actual_exit_at: "2026-09-03T09:35:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409"
            - "${err} == ERR_MAINTENANCE_CONFLICT (business_safety priority 9 beats business_temporal priority 10)"
            - "SegmentPassage.${r1p2}.status == PLANNED (rejected actualize persists nothing)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: on_time_threshold_exact_equality
        grounds:
          - calculations.otp_measurement
          - entities.OperatingAgreement.fields.on_time_threshold_minutes
        distinguishing_aspect: "Numeric threshold boundary on the arrival-delay metric via the complete endpoint: delay exactly == threshold (15) is on time (<= semantics), delay threshold+1 (16) is late — exercised on two runs of the same timetable."
        test_recipe:
          setup:
            - "Published 2-run timetable on 2026-09-03; run1 completed with arrival delay exactly 15; run2 completed with arrival delay exactly 16."
          setup_api_calls:
            - *d_clock
            - *d_host
            - *d_corr
            - *d_seg1
            - *d_seg2
            - *d_oa
            - *d_oa_act
            - *d_tt2
            - *d_tt2_prop
            - *d_tt2_rev
            - *d_tt2_rat
            - *d_tt2_pub
            - *d_runs2
            - *d_pass_r1
            - *d_pass_r2
            - *d_dep_r1
            - *d_act_r1p1
            - *d_act_r1p2_ontime
          trigger:
            - *d_comp_r1_ontime
            - *d_dep_r2
            - *d_act_r2p1
            - *d_act_r2p2_late
            - *d_comp_r2_late
          assert:
            - "TrainRun.${r1_id}.destination_arrival_delay_minutes == 15 and on_time_endpoint == true (<= boundary inclusive)"
            - "TrainRun.${r1_id}.on_time_all_stations == true (segment exits 0 and 15 min, both <= 15)"
            - "TrainRun.${r2_id}.destination_arrival_delay_minutes == 16 and on_time_endpoint == false"

      - name: settlement_zero_completed_runs_null_otp
        grounds:
          - calculations.otp_measurement
          - calculations.incentive_penalty_settlement
          - entities.SettlementStatement.fields.otp_pct
        distinguishing_aspect: "Empty-set boundary on the completed-run count metric via the settlement-create endpoint: a period with zero COMPLETED runs yields otp_pct null (not 0, not an error) and forces penalty_cents == 0 and incentive_cents == 0 — a different metric and endpoint than the arrival-delay threshold."
        test_recipe:
          setup:
            - "ACTIVE agreement; no timetables published; statement period 2026-10 contains no runs at all."
          setup_api_calls:
            - *d_clock
            - *d_host
            - *d_corr
            - *d_seg1
            - *d_seg2
            - *d_oa
            - *d_oa_act
          trigger:
            - call: "POST /rail/settlement-statements"
              payload: { operating_agreement_id: "${oa_id}", period_start: "2026-10-01", period_end: "2026-10-31" }
              as: PassengerOperator
              captures: { stmt0: $.data.id }
          assert:
            - "the response status is 201"
            - "SettlementStatement.${stmt0}.completed_run_count == 0"
            - "SettlementStatement.${stmt0}.otp_pct is null"
            - "SettlementStatement.${stmt0}.penalty_cents == 0 and incentive_cents == 0 and net_cents == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: ratify_requires_active_agreement
        grounds:
          - state_machines.Timetable.UNDER_REVIEW_to_RATIFIED
          - validations[priority=7]
        distinguishing_aspect: "Entity pair Timetable -> OperatingAgreement: ratify is gated on the agreement being ACTIVE; while the agreement is DRAFT the same call fails with ERR_AGREEMENT_NOT_ACTIVE, and after activation it succeeds with no change to the timetable itself."
        test_recipe:
          setup:
            - "Agreement still DRAFT (never activated); timetable advanced to UNDER_REVIEW."
          setup_api_calls:
            - *d_clock
            - *d_host
            - *d_corr
            - *d_seg1
            - *d_seg2
            - *d_oa
            - *d_tt1
            - *d_tt1_prop
            - *d_tt1_rev
          trigger:
            - call: "POST /rail/timetables/${tt1_id}/ratify"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
            - *d_oa_act
            - call: "POST /rail/timetables/${tt1_id}/ratify"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
          assert:
            - "first ratify: status 409 and ${err} == ERR_AGREEMENT_NOT_ACTIVE"
            - "second ratify after activation: status 200 and Timetable.${tt1_id}.status == RATIFIED"

      - name: complete_requires_all_passages_final
        grounds:
          - state_machines.TrainRun.EN_ROUTE_to_COMPLETED
          - validations[priority=8]
        distinguishing_aspect: "Entity pair TrainRun -> SegmentPassage (different pair than Timetable -> OperatingAgreement): complete is rejected with ERR_RUN_PASSAGES_OPEN while any child passage is still PLANNED, and succeeds once the last passage is ACTUALIZED."
        test_recipe:
          setup:
            - "Published 1-run timetable; run EN_ROUTE; passage 1 ACTUALIZED; passage 2 still PLANNED."
          setup_api_calls:
            - *d_clock
            - *d_host
            - *d_corr
            - *d_seg1
            - *d_seg2
            - *d_oa
            - *d_oa_act
            - *d_tt1
            - *d_tt1_prop
            - *d_tt1_rev
            - *d_tt1_rat
            - *d_tt1_pub
            - *d_runs1
            - *d_pass1
            - *d_dep1
            - call: "POST /rail/segment-passages/${pass1_id}/actualize"
              payload: { actual_entry_at: "2026-09-02T08:00:00Z", actual_exit_at: "2026-09-02T08:27:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
          trigger:
            - call: "POST /rail/train-runs/${run_id}/complete"
              payload: { actual_arrival_at: "2026-09-02T09:17:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
            - call: "POST /rail/segment-passages/${pass2_id}/actualize"
              payload: { actual_entry_at: "2026-09-02T08:27:00Z", actual_exit_at: "2026-09-02T09:17:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - call: "POST /rail/train-runs/${run_id}/complete"
              payload: { actual_arrival_at: "2026-09-02T09:17:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
          assert:
            - "first complete: status 409 and ${err} == ERR_RUN_PASSAGES_OPEN"
            - "after passage 2 actualizes, second complete: status 200 and TrainRun.${run_id}.status == COMPLETED"
            - "TrainRun.${run_id}.on_time_endpoint == true (0 min late)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: single_track_half_open_adjacency
        grounds:
          - validations[priority=10]
          - calculations.schedule_feasibility
        distinguishing_aspect: "Half-open interval semantics on the SegmentPassage resource: run2's actual passage [08:25,08:50) overlapping run1's [08:00,08:27) on the same SINGLE segment is rejected, while exact adjacency [08:27,08:54) (entry == other's exit) is accepted."
        test_recipe:
          setup:
            - "Published 2-run timetable on 2026-09-03; both runs EN_ROUTE; run1 passage-1 ACTUALIZED at [08:00,08:27)."
          setup_api_calls:
            - *d_clock
            - *d_host
            - *d_corr
            - *d_seg1
            - *d_seg2
            - *d_oa
            - *d_oa_act
            - *d_tt2
            - *d_tt2_prop
            - *d_tt2_rev
            - *d_tt2_rat
            - *d_tt2_pub
            - *d_runs2
            - *d_pass_r1
            - *d_pass_r2
            - *d_dep_r1
            - *d_dep_r2
            - *d_act_r1p1
          trigger:
            - call: "POST /rail/segment-passages/${r2p1}/actualize"
              payload: { actual_entry_at: "2026-09-03T08:25:00Z", actual_exit_at: "2026-09-03T08:50:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
            - call: "POST /rail/segment-passages/${r2p1}/actualize"
              payload: { actual_entry_at: "2026-09-03T08:27:00Z", actual_exit_at: "2026-09-03T08:54:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
          assert:
            - "overlapping actualize: status 409 and ${err} == ERR_SEGMENT_OCCUPANCY_CONFLICT"
            - "adjacent actualize (entry 08:27 == run1 exit 08:27): status 200 and SegmentPassage.${r2p1}.status == ACTUALIZED"

      - name: maintenance_clearance_buffer_semantics
        grounds:
          - validations[priority=11]
          - entities.MaintenanceWindow.fields.clearance_buffer_minutes
        distinguishing_aspect: "Clearance-expanded interval semantics on the MaintenanceWindow resource (different resource and different geometry than the half-open passage rule): with a LOCKED window on seg2 ending 07:45 and a 15-minute buffer, a timetable whose seg2 entry is exactly 08:00 (== window_end + buffer) is feasible, while 07:59 (one minute inside the clearance zone) is rejected with ERR_SCHEDULE_INFEASIBLE."
        test_recipe:
          setup:
            - "ACTIVE agreement; LOCKED maintenance window on seg2 [2026-09-02 05:00, 07:45) with 15-minute buffer; no timetables yet."
          setup_api_calls:
            - *d_clock
            - *d_host
            - *d_corr
            - *d_seg1
            - *d_seg2
            - *d_oa
            - *d_oa_act
            - call: "POST /rail/maintenance-windows"
              payload: { track_segment_id: "${seg2_id}", window_start_at: "2026-09-02T05:00:00Z", window_end_at: "2026-09-02T07:45:00Z", equipment_unit_id: "EQ-1", clearance_buffer_minutes: 15 }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { mw1: $.data.id }
            - call: "POST /rail/maintenance-windows/${mw1}/lock"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - call: "POST /rail/timetables"
              payload: { corridor_id: "${corr_id}", operating_agreement_id: "${oa_id}", service_date_start: "2026-09-02", service_date_end: "2026-09-02", trains_per_day: 1, departure_time_of_day: "07:33", headway_minutes: 120 }
              as: PassengerOperator
              captures: { tt_a: $.data.id }
            - call: "POST /rail/timetables"
              payload: { corridor_id: "${corr_id}", operating_agreement_id: "${oa_id}", service_date_start: "2026-09-02", service_date_end: "2026-09-02", trains_per_day: 1, departure_time_of_day: "07:32", headway_minutes: 120 }
              as: PassengerOperator
              captures: { tt_b: $.data.id }
          trigger:
            - call: "POST /rail/timetables/${tt_a}/propose"
              payload: {}
              as: PassengerOperator
            - call: "POST /rail/timetables/${tt_b}/propose"
              payload: {}
              as: PassengerOperator
              captures: { err: $.data.error_id }
          assert:
            - "timetable A (seg2 entry exactly 08:00 == window_end 07:45 + buffer 15): propose succeeds, Timetable.${tt_a}.status == PROPOSED"
            - "timetable B (seg2 entry 07:59, one minute inside clearance): status 422 and ${err} == ERR_SCHEDULE_INFEASIBLE"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: confirmed_host_minutes_conserved_through_dispute_cycle
        grounds:
          - calculations.host_delay_attribution
          - state_machines.DelayIncident.DISPUTED_to_REVERSED
          - state_machines.SettlementStatement.DISPUTED_to_REISSUED
        distinguishing_aspect: "Conserved quantity = confirmed host-attributable delay minutes: forward action (confirm +20) and its compensating action (dispute -> escalate -> OVERTURNED reverse -20) leave the quantity at its pre-cycle value 0, and the reissued settlement's host_delay_minutes and penalty_cents provably return to 0 — no drift."
        test_recipe:
          setup:
            - "Completed run 20 min late; host incident 20 min CONFIRMED (attributed = 20); statement issued with host_delay_minutes 20, penalty 3000."
          setup_api_calls:
            - *d_clock
            - *d_host
            - *d_corr
            - *d_seg1
            - *d_seg2
            - *d_oa
            - *d_oa_act
            - *d_tt1
            - *d_tt1_prop
            - *d_tt1_rev
            - *d_tt1_rat
            - *d_tt1_pub
            - *d_runs1
            - *d_pass1
            - *d_dep1
            - *d_act1_late
            - *d_act2_late
            - *d_comp1_late
            - *d_inc_host20
            - *d_inc_host20_conf
            - *d_stmt
            - call: "POST /rail/settlement-statements/${stmt_id}/issue"
              payload: {}
              as: PassengerOperator
            - call: "POST /rail/delay-incidents/${inc_h20}/dispute"
              payload: { reason: "freight hold contested" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { disp_c: $.data.id }
            - call: "POST /rail/disputes/${disp_c}/escalate"
              payload: {}
              as: PassengerOperator
            - call: "POST /rail/disputes/${disp_c}/resolve"
              payload: { resolution: "OVERTURNED" }
              as: SystemAdmin
            - call: "POST /rail/settlement-statements/${stmt_id}/dispute"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
          trigger:
            - call: "POST /rail/settlement-statements/${stmt_id}/reissue"
              payload: {}
              as: PassengerOperator
          assert:
            - "DelayIncident.${inc_h20}.status == REVERSED"
            - "TrainRun.${run_id}.attributed_host_delay_minutes == 0 (back to pre-confirm baseline)"
            - "SettlementStatement.${stmt_id}.host_delay_minutes == 0"
            - "SettlementStatement.${stmt_id}.penalty_cents == 0 and net_cents == 0"
            - "invariant: host_delay_minutes of the reissued statement equals the sum of CONFIRMED host-attributable minutes (0) — the confirm/reverse pair left no drift"

      - name: equipment_week_hours_conserved_through_lock_release
        grounds:
          - calculations.equipment_hours_budget
          - state_machines.MaintenanceWindow.LOCKED_to_RELEASED
          - entities.MaintenanceWindow.fields.equipment_week_hours_available
        distinguishing_aspect: "Conserved quantity = weekly equipment-hours for a unit (different quantity type than delay minutes): a lock(-10.00) paired with its compensating release(+10.00) leaves equipment_week_hours_available exactly at its initial 40.00."
        test_recipe:
          setup:
            - "Segment exists; one PLANNED 10-hour window for unit EQ-9 on Monday 2026-09-07."
          setup_api_calls:
            - *d_clock
            - *d_host
            - *d_corr
            - *d_seg1
            - call: "POST /rail/maintenance-windows"
              payload: { track_segment_id: "${seg1_id}", window_start_at: "2026-09-07T06:00:00Z", window_end_at: "2026-09-07T16:00:00Z", equipment_unit_id: "EQ-9", clearance_buffer_minutes: 15 }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { mw9: $.data.id, avail0: $.data.equipment_week_hours_available }
          trigger:
            - call: "POST /rail/maintenance-windows/${mw9}/lock"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { avail1: $.data.equipment_week_hours_available }
            - call: "POST /rail/maintenance-windows/${mw9}/release"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { avail2: $.data.equipment_week_hours_available }
          assert:
            - "${avail0} == 40.00"
            - "${avail1} == 30.00 after the lock"
            - "${avail2} == 40.00 after the compensating release — conserved exactly"
            - "MaintenanceWindow.${mw9}.status == RELEASED"
