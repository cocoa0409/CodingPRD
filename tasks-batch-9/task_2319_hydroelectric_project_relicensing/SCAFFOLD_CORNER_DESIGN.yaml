            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9026", project_name: "Ledger Filter Dam", installed_capacity_mw: 24.0, base_annual_generation_mwh: 250000, license_expiration_date: "2035-06-30" }
