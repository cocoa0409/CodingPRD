scaffold_corner_design:

  # =====================================================================
  - section: entities
    instances:

      - name: corner_create_order_returns_declared_fields_with_declared_defaults
        claim_type: Creation
        grounds:
          - entities.Order.fields.workflow_status
          - entities.Order.fields.payment_status
          - entities.Order.fields.custody_holder
          - entities.Order.fields.feasibility_status
          - endpoints[POST /expediting/orders]
        distinguishing_aspect: "A freshly created order responds 201 with workflow_status DRAFT, payment_status UNPAID, custody_holder APPLICANT, feasibility_status UNKNOWN, furthest_stage_reached DRAFT, service_level STANDARD (the declared default) and version 1."
        test_recipe:
          setup:
            - "One catalog item exists."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
          assert:
            - "Order.${ord_id}.workflow_status == DRAFT"
            - "Order.${ord_id}.payment_status == UNPAID"
            - "Order.${ord_id}.custody_holder == APPLICANT"
            - "Order.${ord_id}.feasibility_status == UNKNOWN"
            - "Order.${ord_id}.furthest_stage_reached == DRAFT"
            - "Order.${ord_id}.service_level == STANDARD"
            - "Order.${ord_id}.version == 1"
            - "Order.${ord_id}.applicant_count == 0"
            - "Order.${ord_id}.total_quoted_cents == 0"
            - "GET /expediting/orders/${ord_id}/custody-events returns exactly 1 row with holder_type APPLICANT and released_at null"

      - name: corner_order_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Order.fields.workflow_status
          - endpoints[POST /expediting/orders]
        distinguishing_aspect: "Client-supplied id, version, workflow_status and collected_cents on POST /expediting/orders are ignored: the server mints its own id, sets version 1 and workflow_status DRAFT."
        test_recipe:
          setup:
            - "One catalog item exists."
          setup_api_calls:
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA", id: "11111111-1111-4111-8111-111111111111", version: 99, workflow_status: "AT_AGENCY", collected_cents: 500000 }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
          assert:
            - "${ord_id} != 11111111-1111-4111-8111-111111111111"
            - "Order.${ord_id}.version == 1"
            - "Order.${ord_id}.workflow_status == DRAFT"
            - "Order.${ord_id}.collected_cents == 0"

      - name: corner_applicant_age_years_computed_against_travel_date
        claim_type: Computed Fields
        grounds:
          - calculations.applicant_age_years
          - entities.Applicant.fields.age_years
          - endpoints[POST /expediting/orders/{id}/applicants]
        distinguishing_aspect: "age_years is floored whole years from date_of_birth to Order.travel_date: a 2010-09-02 birth date against travel_date 2026-09-01 yields 15, not 16, because the birthday has not occurred by the travel date."
        test_recipe:
          setup:
            - "One order with travel_date 2026-09-01."
          setup_api_calls:
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Minor Edge", date_of_birth: "2010-09-02", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Adult Edge", date_of_birth: "2010-09-01", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap2_id: $.data.id }
          assert:
            - "Applicant.${ap_id}.age_years == 15"
            - "Applicant.${ap2_id}.age_years == 16"
            - "Applicant.${ap_id}.readiness_status == PENDING"
            - "Order.${ord_id}.applicant_count == 2"

      - name: corner_document_requirement_validity_param_default_applied
        claim_type: Defaults
        grounds:
          - entities.DocumentRequirement.fields.validity_param
          - calculations.document_validity_check
          - endpoints[POST /expediting/catalog-items/{id}/document-requirements]
        distinguishing_aspect: "Omitting validity_param on a VALID_BEYOND_RETURN_MONTHS line stores PASSPORT_VALIDITY_MONTHS_BEYOND_RETURN (6), and omitting it on an EXPIRES_AFTER_ISSUE_DAYS line stores SUPPORTING_DOC_VALIDITY_DAYS (90)."
        test_recipe:
          setup:
            - "One catalog item exists."
          setup_api_calls:
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /expediting/catalog-items/${cat_id}/document-requirements"
              payload: { doc_type: "PASSPORT_BOOK", is_required: true, validity_rule: "VALID_BEYOND_RETURN_MONTHS" }
              as: PlatformAdmin
              captures: { req_pb_id: $.data.doc_type }
            - call: "POST /expediting/catalog-items/${cat_id}/document-requirements"
              payload: { doc_type: "BANK_STATEMENT", is_required: false, validity_rule: "EXPIRES_AFTER_ISSUE_DAYS" }
              as: PlatformAdmin
          assert:
            - "the PASSPORT_BOOK requirement has validity_param == 6"
            - "the BANK_STATEMENT requirement has validity_param == 90"
            - "GET /expediting/catalog-items/${cat_id}/document-requirements returns exactly 2 rows"

      - name: corner_list_orders_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints[GET /expediting/orders]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /expediting/orders with limit 2 and offset 0 over three orders returns 2 rows, total_count 3 and has_more true."
        test_recipe:
          setup:
            - "Three orders on one catalog item."
          setup_api_calls:
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-02", return_date: "2026-09-21", delivery_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-03", return_date: "2026-09-22", delivery_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
          trigger:
            - call: "GET /expediting/orders"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "the response data array has exactly 2 elements"
            - "meta or envelope total_count == 3"
            - "has_more == true"
            - "response_type == array"

      - name: corner_get_order_with_unknown_id_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_ORDER_NOT_FOUND]
          - validations[priority=3]
          - endpoints[GET /expediting/orders/{id}]
        distinguishing_aspect: "GET /expediting/orders/{id} for a well-formed UUID that names no stored Order responds 404 with error_id ERR_ORDER_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /expediting/orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { nf_err: $.data.error_id }
          assert:
            - "the trigger responds 404 with error_id ERR_ORDER_NOT_FOUND"
            - "response_type == error"

      - name: corner_custody_event_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.CustodyEvent.fields.acquired_at
          - entities.CustodyEvent.fields.released_at
          - endpoints[GET /expediting/orders/{id}/custody-events]
        distinguishing_aspect: "CustodyEvent is declared common_fields false, so its rows expose id and created_at but no version and no update endpoint; the append-only chain grows by one row per handover."
        test_recipe:
          setup:
            - "One order whose passport has been couriered APPLICANT -> SERVICE."
          setup_api_calls:
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/courier-legs"
              payload: { leg_index: 1, from_holder: "APPLICANT", to_holder: "SERVICE", scheduled_date: "2026-06-01" }
              as: CourierOps
              as_user_id: "co-1"
              captures: { leg1_id: $.data.id }
            - call: "POST /expediting/courier-legs/${leg1_id}/dispatch"
              payload: {}
              as: CourierOps
              as_user_id: "co-1"
            - call: "POST /expediting/courier-legs/${leg1_id}/complete"
              payload: { outcome: "DELIVERED" }
              as: CourierOps
              as_user_id: "co-1"
          trigger:
            - call: "GET /expediting/orders/${ord_id}/custody-events"
              payload: {}
              as: CourierOps
              as_user_id: "co-1"
          assert:
            - "the response returns exactly 3 rows ordered by acquired_at ascending"
            - "row 1 has holder_type APPLICANT with a non-null released_at"
            - "row 2 has holder_type COURIER with leg_index 1 and a non-null released_at"
            - "row 3 has holder_type SERVICE with released_at null"
            - "no row exposes a version field"

  # =====================================================================
  - section: state_machines
    instances:

      - name: corner_accept_quote_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Order.QUOTED_to_INTAKE
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "QUOTED is the only declared from-state for accept-quote, so calling it on a DRAFT order responds 409 ERR_INVALID_STATE and workflow_status stays DRAFT."
        test_recipe:
          setup:
            - "One order in DRAFT with one applicant and no quote."
          setup_api_calls:
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Draft Only", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
          trigger:
            - call: "POST /expediting/orders/${ord_id}/accept-quote"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { st_err: $.data.error_id }
          assert:
            - "the trigger responds 409 with error_id ERR_INVALID_STATE"
            - "Order.${ord_id}.workflow_status == DRAFT"
            - "Order.${ord_id}.payment_status == UNPAID"

      - name: corner_cancelled_order_rejects_further_mutation
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Order.DRAFT_to_CANCELLED
          - validations[priority=9]
          - errors[ERR_ORDER_TERMINAL]
        distinguishing_aspect: "Once workflow_status is CANCELLED every mutating order endpoint responds 409 ERR_ORDER_TERMINAL, taking precedence over the state rung that would otherwise fire."
        test_recipe:
          setup:
            - "One order in DRAFT with one applicant, then cancelled."
          setup_api_calls:
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Gone Soon", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/cancel"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
          trigger:
            - call: "POST /expediting/orders/${ord_id}/quote"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { term_err: $.data.error_id }
          assert:
            - "the trigger responds 409 with error_id ERR_ORDER_TERMINAL"
            - "Order.${ord_id}.workflow_status == CANCELLED"
            - "Applicant.${ap_id}.readiness_status == WITHDRAWN"
            - "Order.${ord_id}.total_quoted_cents == 0"

      - name: corner_photo_passes_on_inclusive_head_height_bounds
        claim_type: valid_transition
        grounds:
          - state_machines.PhotoAsset.PENDING_to_PASSED
          - calculations.photo_compliance
          - entities.PhotoAsset.fields.failure_reasons
        distinguishing_aspect: "Both head-height bounds are inclusive: 0.50 and 0.69 PASS while 0.49 and 0.70 FAIL with failure_reasons [HEAD_HEIGHT], and resolution 600 passes while 599 fails."
        test_recipe:
          setup:
            - "One order with one applicant and four photo submissions at the four boundary values."
          setup_api_calls:
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Photo Bounds", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap_id: $.data.id }
            - call: "POST /expediting/applicants/${ap_id}/photos"
              payload: { taken_on: "2026-05-20", head_height_ratio: 0.50, background_code: "WHITE", resolution_px: 600 }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ph_lo_id: $.data.id }
            - call: "POST /expediting/applicants/${ap_id}/photos"
              payload: { taken_on: "2026-05-20", head_height_ratio: 0.69, background_code: "OFF_WHITE", resolution_px: 601 }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ph_hi_id: $.data.id }
            - call: "POST /expediting/applicants/${ap_id}/photos"
              payload: { taken_on: "2026-05-20", head_height_ratio: 0.70, background_code: "WHITE", resolution_px: 800 }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ph_over_id: $.data.id }
            - call: "POST /expediting/applicants/${ap_id}/photos"
              payload: { taken_on: "2026-05-20", head_height_ratio: 0.60, background_code: "COLORED", resolution_px: 599 }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ph_multi_id: $.data.id }
          trigger:
            - call: "POST /expediting/photos/${ph_lo_id}/compliance-check"
              payload: {}
              as: CaseManager
              as_user_id: "cm-review"
            - call: "POST /expediting/photos/${ph_hi_id}/compliance-check"
              payload: {}
              as: CaseManager
              as_user_id: "cm-review"
            - call: "POST /expediting/photos/${ph_over_id}/compliance-check"
              payload: {}
              as: CaseManager
              as_user_id: "cm-review"
            - call: "POST /expediting/photos/${ph_multi_id}/compliance-check"
              payload: {}
              as: CaseManager
              as_user_id: "cm-review"
          assert:
            - "PhotoAsset.${ph_lo_id}.compliance_status == PASSED"
            - "PhotoAsset.${ph_hi_id}.compliance_status == PASSED"
            - "PhotoAsset.${ph_over_id}.compliance_status == FAILED"
            - "PhotoAsset.${ph_over_id}.failure_reasons == [HEAD_HEIGHT]"
            - "PhotoAsset.${ph_multi_id}.compliance_status == FAILED"
            - "PhotoAsset.${ph_multi_id}.failure_reasons == [BACKGROUND, RESOLUTION]"

      - name: corner_appointment_no_show_releases_slot_capacity
        claim_type: side_effect_execution
        grounds:
          - state_machines.Appointment.BOOKED_to_NO_SHOW
          - state_machines.AppointmentSlot.FULL_to_OPEN
          - entities.Appointment.fields.no_show_count
        distinguishing_aspect: "Recording NO_SHOW increments no_show_count to 1 and decrements the slot's booked_count from 1 to 0, flipping the slot from FULL back to OPEN while the appointment itself stays NO_SHOW."
        test_recipe:
          setup:
            - "A consulate covering CA with one capacity-1 slot at 2026-06-05T10:00:00Z, one applicant booked into it, and the clock advanced past the slot start."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: true }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/consulates"
              payload:
                name: "IN Consulate West"
                destination_country: "IN"
                jurisdiction_region_codes: ["CA", "NV"]
              as: PlatformAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /expediting/consulates/${cons_id}/slots"
              payload: { starts_at: "2026-06-05T10:00:00Z", capacity: 1 }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA", consulate_id: "${cons_id}" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "No Show", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap_id: $.data.id }
            - call: "POST /expediting/appointments"
              payload: { applicant_id: "${ap_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { appt_id: $.data.id }
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T11:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /expediting/appointments/${appt_id}/outcome"
              payload: { outcome: "NO_SHOW" }
              as: AgencyLiaison
              as_user_id: "al-1"
          assert:
            - "Appointment.${appt_id}.booking_status == NO_SHOW"
            - "Appointment.${appt_id}.no_show_count == 1"
            - "Appointment.${appt_id}.reschedule_count == 0"
            - "AppointmentSlot.${slot_id}.booked_count == 0"
            - "AppointmentSlot.${slot_id}.status == OPEN"
            - "Applicant.${ap_id}.readiness_status == PENDING"

      - name: corner_travel_date_change_reverts_accepted_document_to_received
        claim_type: compensation
        grounds:
          - state_machines.ApplicantDocument.ACCEPTED_to_RECEIVED
          - state_machines.Applicant.COMPLETE_to_PENDING
