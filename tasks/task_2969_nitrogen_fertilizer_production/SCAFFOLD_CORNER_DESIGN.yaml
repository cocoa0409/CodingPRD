            - "ProductionRun.${run_b_id}.status == RUNNING"
            - "ReformerTrain.${train_1_id}.status == IDLE"
            - "ReformerTrain.${train_2_id}.status == RUNNING"

      - name: issued_quote_withdrawn_when_psm_program_goes_overdue
        claim_type: cross_entity
        grounds:
          - state_machines.PriceQuote.ISSUED_to_WITHDRAWN
          - state_machines.Plant.NORMAL_to_RESTRICTED
          - calculations.plant_operating_posture
          - entities.PriceQuote.fields.withdraw_reason
        distinguishing_aspect: |
          A write to the plant's PSM standing reaches a different aggregate: the ISSUED quote is
          withdrawn with withdraw_reason POSTURE_RESTRICTED, and its quoted_price_usd_per_ton stays at
          the 199.74 stamped at issue — the RESTRICTED posture factor never reprices an existing quote.
        test_recipe:
          setup:
            - "One plant with spot_gas_index_usd_per_mmbtu 4.20 and no hedge lots, posture NORMAL."
            - "One non-regulated UREA product line (0.58 ammonia tons per ton, 38.00 conversion)."
            - "One quote for 6000 tons on the HEDGED_BLEND basis expiring 2027-04-15, already ISSUED."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/product-lines"
              payload: { plant_id: "${plant_id}", product_code: "UREA", ammonia_tons_per_product_ton: 0.58, conversion_cost_usd_per_ton: 38.00, regulated: false, priority_rank: 1 }
              as: CommercialManager
              captures: { line_id: $.data.id }
            - call: "POST /nitrogen-ops/price-quotes"
              payload: { plant_id: "${plant_id}", product_line_id: "${line_id}", quote_code: "QT-1", tons: 6000, pass_through_basis: "HEDGED_BLEND", expires_at: "2027-04-15T00:00:00Z" }
              as: CommercialManager
              captures: { quote_id: $.data.id }
            - call: "POST /nitrogen-ops/price-quotes/{id}/issue"
              payload: {}
              as: CommercialManager
          trigger:
            - call: "POST /nitrogen-ops/plants/{id}/psm-program-status"
              payload: { psm_program_status: "OVERDUE" }
              as: SafetyOfficer
          assert:
            - "the trigger call returns HTTP status 200"
            - "Plant.${plant_id}.psm_program_status == OVERDUE"
            - "Plant.${plant_id}.operating_posture == RESTRICTED"
            - "Plant.${plant_id}.exceeded_pollutants == []"
            - "PriceQuote.${quote_id}.status == WITHDRAWN"
            - "PriceQuote.${quote_id}.withdraw_reason == POSTURE_RESTRICTED"
            - "PriceQuote.${quote_id}.quoted_price_usd_per_ton == 199.74"
            - "PriceQuote.${quote_id}.gas_basis_usd_per_mmbtu == 4.2000"

      - name: outage_start_cascades_down_to_runs_and_tasks
        claim_type: cascade_down
        grounds:
          - state_machines.Turnaround.APPROVED_to_IN_PROGRESS
          - state_machines.ReformerTrain.IDLE_to_DOWN_FOR_TURNAROUND
          - state_machines.TurnaroundTask.PENDING_to_READY
        excluded_because:
          difficulty_instance: transitive_cascade / outage_start_cascades_five_levels_to_storage_position
          rationale: "That instance drives the same outage start and asserts every level of the downward cascade — train, run, order, shipment and storage position — plus the task graph becoming READY."

      - name: hedge_lot_closure_syncs_the_plant_blend_ledger
        claim_type: ledger_sync
        grounds:
          - state_machines.GasHedgeLot.OPEN_to_CLOSED
          - calculations.plant_hedged_blend
          - entities.Plant.fields.hedged_blend_usd_per_mmbtu
        excluded_because:
          difficulty_instance: dual_variant_calc / run_unit_cost_provisional_month_match_vs_final_chronological_waterfall
          rationale: "The FINAL waterfall in that instance closes two lots and the ancestor Plant.hedged_blend_usd_per_mmbtu is asserted to have re-derived to 3.1000 from the surviving lot."

      - name: run_reopen_compensates_every_completion_side_effect
        claim_type: compensation
        grounds:
          - state_machines.ProductionRun.COMPLETED_to_RUNNING
          - state_machines.GasHedgeLot.CLOSED_to_OPEN
          - state_machines.CatalystCharge.SPENT_to_ACTIVE
        excluded_because:
          difficulty_instance: compensating_invariant / hedged_gas_volume_conserved_across_complete_and_reopen
          rationale: "That instance reopens a settled run and asserts every completion side effect is reversed with no drift — lots reopened at their original volumes, catalyst hours returned, blend restored."

  # ===========================================================================
  - section: calculations
    instances:
      - name: quote_price_falls_back_to_spot_index_when_hedge_pool_is_empty
        claim_type: correct_result
        grounds:
          - calculations.quote_price_per_ton
          - calculations.plant_hedged_blend
          - entities.PriceQuote.fields.gas_basis_usd_per_mmbtu
          - endpoints[POST /nitrogen-ops/price-quotes/{id}/issue]
        distinguishing_aspect: |
          With no OPEN hedge lots the plant's hedged_blend_usd_per_mmbtu is null, so a HEDGED_BLEND
          quote silently prices off the 4.20 spot index: 4.20*33 + 42.50 = 181.100 per ammonia ton,
          *0.58 = 105.038, +38.00 = 143.038 cash cost, margin max(25.00, 31.46836) = 31.46836, list
          174.50636, and 174.50636 * 1.18 (April expiry) * 0.97 (6000 tons) * 1.00 (NORMAL) rounds to
          exactly 199.74.
        test_recipe:
          setup:
            - "One plant with spot_gas_index_usd_per_mmbtu 4.20, permit ACTIVE, PSM CURRENT and NO GasHedgeLot rows at all."
            - "One non-regulated UREA product line with ammonia_tons_per_product_ton 0.58 and conversion_cost_usd_per_ton 38.00."
            - "One DRAFT quote for 6000 tons on the HEDGED_BLEND basis expiring 2027-04-15."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/product-lines"
              payload: { plant_id: "${plant_id}", product_code: "UREA", ammonia_tons_per_product_ton: 0.58, conversion_cost_usd_per_ton: 38.00, regulated: false, priority_rank: 1 }
              as: CommercialManager
              captures: { line_id: $.data.id }
            - call: "POST /nitrogen-ops/price-quotes"
              payload: { plant_id: "${plant_id}", product_line_id: "${line_id}", quote_code: "QT-1", tons: 6000, pass_through_basis: "HEDGED_BLEND", expires_at: "2027-04-15T00:00:00Z" }
              as: CommercialManager
              captures: { quote_id: $.data.id }
          trigger:
            - call: "POST /nitrogen-ops/price-quotes/{id}/issue"
              payload: {}
              as: CommercialManager
          assert:
            - "the trigger call returns HTTP status 200"
            - "Plant.${plant_id}.hedged_blend_usd_per_mmbtu == null"
            - "PriceQuote.${quote_id}.status == ISSUED"
            - "PriceQuote.${quote_id}.gas_basis_usd_per_mmbtu == 4.2000"
            - "PriceQuote.${quote_id}.quoted_price_usd_per_ton == 199.74"
            - "PriceQuote.${quote_id}.issued_at is stamped and equals the logical clock 2026-08-01T00:00:00.000Z"

      - name: hedged_blend_ignores_lots_on_another_plant
        claim_type: input_set_filtering
        grounds:
          - calculations.plant_hedged_blend
          - entities.GasHedgeLot.fields.plant_id
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          The blend is scoped by plant_id: plant A's two lots (200000 MMBtu at 3.10 and 100000 at 2.00)
          blend to 2.7333 while plant B's single 50000 MMBtu lot at 5.00 blends to 5.0000 — neither
          plant's pool leaks into the other even though both lots are OPEN in the same database.
        test_recipe:
          setup:
            - "Two plants, each with its own hedge book: plant A holds HL-1 200000 MMBtu at 3.10 (2026-09) and HL-2 100000 MMBtu at 2.00 (2026-08); plant B holds HL-3 50000 MMBtu at 5.00 (2026-09)."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_a_id: $.data.id }
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Donaldsonville Complex", site_code: "DVL-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_b_id: $.data.id }
            - call: "POST /nitrogen-ops/gas-hedge-lots"
              payload: { plant_id: "${plant_a_id}", lot_code: "HL-1", mmbtu_volume: 200000, strike_price_usd_per_mmbtu: 3.10, delivery_month: "2026-09" }
              as: CommercialManager
              captures: { lot1_id: $.data.id }
            - call: "POST /nitrogen-ops/gas-hedge-lots"
              payload: { plant_id: "${plant_a_id}", lot_code: "HL-2", mmbtu_volume: 100000, strike_price_usd_per_mmbtu: 2.00, delivery_month: "2026-08" }
              as: CommercialManager
              captures: { lot2_id: $.data.id }
          trigger:
            - call: "POST /nitrogen-ops/gas-hedge-lots"
              payload: { plant_id: "${plant_b_id}", lot_code: "HL-3", mmbtu_volume: 50000, strike_price_usd_per_mmbtu: 5.00, delivery_month: "2026-09" }
              as: CommercialManager
              captures: { lot3_id: $.data.id }
            - call: "GET /nitrogen-ops/plants/{id}"
              payload: {}
              as: CommercialManager
          assert:
            - "the first trigger call returns HTTP status 201"
            - "Plant.${plant_a_id}.hedged_blend_usd_per_mmbtu == 2.7333"
            - "Plant.${plant_b_id}.hedged_blend_usd_per_mmbtu == 5.0000"
            - "GasHedgeLot.${lot1_id}.remaining_mmbtu == 200000 and GasHedgeLot.${lot1_id}.status == OPEN"
            - "GasHedgeLot.${lot2_id}.remaining_mmbtu == 100000 and GasHedgeLot.${lot2_id}.status == OPEN"
            - "GasHedgeLot.${lot3_id}.remaining_mmbtu == 50000 and GasHedgeLot.${lot3_id}.status == OPEN"
            - "GET /nitrogen-ops/gas-hedge-lots?plant_id=${plant_a_id} returns total_count == 2"

      - name: freight_min_charge_floors_a_short_truck_move
        claim_type: constants_applied
        grounds:
          - calculations.shipment_freight_total
          - entities.Shipment.fields.base_freight_usd
          - state_machines.Shipment.DRAFT_to_BOOKED
        distinguishing_aspect: |
          A 20-ton truck move over 50 miles earns a 107.50 linehaul, so MIN_CHARGE_USD[TRUCK] 450.00
          becomes the base; the surcharge tier is then selected from that floored base (450.00 < 25000)
          at 0.085, giving 38.25 and a total of 488.25 at 24.4125 per ton — the rate card never touches
          the ton-mile figure once the floor bites.
        test_recipe:
          setup:
            - "One plant with a non-regulated UREA product line."
            - "Origin terminal UT-ORIG capacity 20000 with an opening balance of 100 tons; destination tank UT-DEST capacity 20000."
            - "One DRAFT TRUCK shipment of 20 tons over 50 miles."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/product-lines"
              payload: { plant_id: "${plant_id}", product_code: "UREA", ammonia_tons_per_product_ton: 0.58, conversion_cost_usd_per_ton: 38.00, regulated: false, priority_rank: 1 }
              as: CommercialManager
              captures: { line_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "UT-ORIG", asset_kind: "TERMINAL", product_code: "UREA", capacity_tons: 20000, security_class: "BASIC", seasonal_reserve_pct: 0.00 }
              as: LogisticsCoordinator
              captures: { origin_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "UT-DEST", asset_kind: "TANK", product_code: "UREA", capacity_tons: 20000, security_class: "BASIC", seasonal_reserve_pct: 0.00 }
              as: LogisticsCoordinator
              captures: { dest_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets/{id}/opening-balance"
              payload: { opening_balance_tons: 100 }
              as: LogisticsCoordinator
            - call: "POST /nitrogen-ops/shipments"
              payload: { origin_asset_id: "${origin_id}", dest_asset_id: "${dest_id}", shipment_code: "SH-1", mode: "TRUCK", tons: 20, distance_miles: 50, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-06T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { ship_id: $.data.id }
            - call: "GET /nitrogen-ops/storage-assets/{id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { origin_ver: $.data.version }
          trigger:
            - call: "POST /nitrogen-ops/shipments/{id}/book"
              payload: { expected_origin_asset_version: "${origin_ver}" }
              as: LogisticsCoordinator
          assert:
            - "the trigger call returns HTTP status 200"
            - "Shipment.${ship_id}.status == BOOKED"
            - "Shipment.${ship_id}.base_freight_usd == 450.00"
            - "Shipment.${ship_id}.fuel_surcharge_usd == 38.25"
            - "Shipment.${ship_id}.freight_total_usd == 488.25"
            - "Shipment.${ship_id}.freight_per_ton_usd == 24.4125"
            - "StorageAsset.${origin_id}.reserved_tons == 20.000"
            - "StorageAsset.${origin_id}.on_hand_tons == 100.000"
            - "StorageAsset.${origin_id}.available_tons == 80.000"

      - name: emissions_per_reading_tonnage_rounds_half_up_at_three_decimals
        claim_type: precision
        grounds:
          - calculations.emissions_rolling_30d
          - entities.EmissionsReading.fields.tons
          - entities.EmissionsReading.fields.rolling_30d_tons
        distinguishing_aspect: |
          3.0 lb/hr over 1 hour is 0.0015 tons exactly — a true half at the third decimal — so
          round_half_up stores 0.002 and the rolling aggregate is 0.002. Truncation or banker's
          rounding would store 0.001, which is the only observable difference.
        test_recipe:
          setup:
            - "One plant with permit_limit_tons_30d 12.00 and no other readings."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z, so a reading stamped 2026-07-20 is inside the window."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
          trigger:
            - call: "POST /nitrogen-ops/emissions-readings"
              payload: { plant_id: "${plant_id}", pollutant: "N2O", rate_lb_per_hour: 3.0, interval_hours: 1, reading_at: "2026-07-20T00:00:00Z" }
              as: RegulatoryAdmin
              captures: { reading_id: $.data.id }
          assert:
            - "the trigger call returns HTTP status 201"
            - "EmissionsReading.${reading_id}.tons == 0.002"
            - "EmissionsReading.${reading_id}.rolling_30d_tons == 0.002"
            - "EmissionsReading.${reading_id}.exceedance == false"
            - "Plant.${plant_id}.exceeded_pollutants == []"
            - "Plant.${plant_id}.operating_posture == NORMAL"

      - name: emissions_window_excludes_a_reading_exactly_thirty_days_old
        claim_type: input_set_filtering
        grounds:
          - calculations.emissions_rolling_30d
          - calculations.plant_operating_posture
          - endpoints[POST /nitrogen-ops/emissions-readings]
        distinguishing_aspect: |
          The window is left-EXCLUSIVE: with the clock at 2026-08-01 a NOX reading stamped exactly
          2026-07-02T00:00:00Z (30 days back) contributes nothing, so a 12.000-ton reading that would
          sit right at the 12.00 limit is invisible and the rolling aggregate is the 0.060 tons of the
          in-window reading alone.
        test_recipe:
          setup:
            - "One plant with permit_limit_tons_30d 12.00; the logical clock stays at its startup default 2026-08-01T00:00:00Z."
            - "R1 is a NOX reading of 50.0 lb/hr over 480 hours (12.000 tons) stamped exactly 2026-07-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/emissions-readings"
              payload: { plant_id: "${plant_id}", pollutant: "NOX", rate_lb_per_hour: 50.0, interval_hours: 480, reading_at: "2026-07-02T00:00:00Z" }
              as: RegulatoryAdmin
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /nitrogen-ops/emissions-readings"
              payload: { plant_id: "${plant_id}", pollutant: "NOX", rate_lb_per_hour: 5.0, interval_hours: 24, reading_at: "2026-07-15T00:00:00Z" }
              as: RegulatoryAdmin
              captures: { r2_id: $.data.id }
          assert:
            - "the trigger call returns HTTP status 201"
            - "EmissionsReading.${r1_id}.tons == 12.000"
            - "EmissionsReading.${r2_id}.tons == 0.060"
            - "EmissionsReading.${r2_id}.rolling_30d_tons == 0.060"
            - "EmissionsReading.${r2_id}.exceedance == false"
            - "Plant.${plant_id}.exceeded_pollutants == []"
            - "Plant.${plant_id}.operating_posture == NORMAL"
            - "GET /nitrogen-ops/emissions-readings?plant_id=${plant_id}&pollutant=NOX returns total_count == 2"

      - name: disconnected_task_roots_each_start_at_day_zero
        claim_type: topological
        grounds:
          - calculations.turnaround_task_schedule
          - entities.TurnaroundTask.fields.earliest_start_day
          - entities.Turnaround.fields.critical_path_days
          - endpoints[POST /nitrogen-ops/turnaround-tasks]
        distinguishing_aspect: |
          Two predecessor-less tasks are parallel roots: TK-A (7 days) and TK-B (14 days) both start at
          day 0 and TK-C (5 days, after TK-A) starts at day 7, so critical_path_days is max(7, 14, 12)
          = 14 — the longest chain, never the 26-day sum of all three durations.
        test_recipe:
          setup:
            - "One plant, one train, one DRAFT outage TA-1 over 2026-10-01 -> 2026-10-27."
            - "TK-A of 7 days and TK-B of 14 days are created with no predecessor."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 1200 }
              as: ProcessEngineer
              captures: { train_id: $.data.id }
            - call: "POST /nitrogen-ops/turnarounds"
              payload: { plant_id: "${plant_id}", train_id: "${train_id}", turnaround_code: "TA-1", scope: "VESSEL_INSPECTION", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-27T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { ta_id: $.data.id }
            - call: "POST /nitrogen-ops/turnaround-tasks"
              payload: { turnaround_id: "${ta_id}", task_code: "TK-A", duration_days: 7 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { task_a_id: $.data.id }
            - call: "POST /nitrogen-ops/turnaround-tasks"
              payload: { turnaround_id: "${ta_id}", task_code: "TK-B", duration_days: 14 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { task_b_id: $.data.id }
          trigger:
            - call: "POST /nitrogen-ops/turnaround-tasks"
              payload: { turnaround_id: "${ta_id}", predecessor_task_id: "${task_a_id}", task_code: "TK-C", duration_days: 5 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { task_c_id: $.data.id }
          assert:
            - "the trigger call returns HTTP status 201"
            - "TurnaroundTask.${task_a_id}.earliest_start_day == 0"
            - "TurnaroundTask.${task_b_id}.earliest_start_day == 0"
            - "TurnaroundTask.${task_c_id}.earliest_start_day == 7"
            - "Turnaround.${ta_id}.critical_path_days == 14"
            - "Turnaround.${ta_id}.window_days == 26"
            - "Turnaround.${ta_id}.tasks_total_count == 3"
            - "Turnaround.${ta_id}.status == DRAFT"

      - name: landed_cost_omits_the_security_fee_for_a_non_regulated_line
        claim_type: constants_applied
        grounds:
          - calculations.production_order_landed_cost
          - calculations.run_ammonia_unit_cost
          - state_machines.ProductionOrder.A_RESERVED_to_A_CONSUMED
          - entities.ProductLine.fields.regulated
        distinguishing_aspect: |
          SECURITY_FEE_USD_PER_TON is charged only when the ProductLine is regulated, so a 1000-ton
          UREA produce settles at 105038.00 feedstock (580.000 ammonia tons at the 181.10 spot-only
          final unit cost) + 38000.00 conversion + 1333.00 handling + 0.00 security = 144371.00 —
          exactly 2755.00 less than the same order would cost on a regulated line.
        test_recipe:
          setup:
            - "One plant with spot_gas_index_usd_per_mmbtu 4.20 and no hedge lots, so the FINAL waterfall buys all 165000 MMBtu at spot and settles at 181.10."
            - "One train with an ACTIVE zero-hour 40000-hour charge; one non-regulated UREA product line; one UREA tank of capacity 20000."
            - "Run PR-1 (target 5000 tons) is APPROVED, order PO-1 for 1000 tons is RESERVED, then the run is started and completed with actual_ammonia_tons 5000 and actual_operating_hours 240."
          setup_api_calls:
