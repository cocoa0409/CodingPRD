scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: margin_wac_vs_replacement_diverge
        grounds:
          - calculations.fuel_margin
          - entities.MarginReport.fields.cost_basis
          - entities.MarginReport.fields.cogs_cents
          - entities.FuelGrade.fields.weighted_avg_cost_cents
        distinguishing_aspect: |
          On the MarginReport (margin-accounting domain), the WAC basis prices COGS at the
          chronological weighted-average cost 287.5 c/gal while the REPLACEMENT basis prices the
          same 22 gallons at the last lot cost 300 c/gal, so cogs_cents diverges (6325 vs 6600).
        test_recipe:
          setup:
            - "Station with a PREMIUM grade priced 419 c/gal; one tank with two POSTED deliveries (5000 gal @ 280, 3000 gal @ 300) giving WAC 287.5; two SETTLED GOLD fuel sales (12 gal, 10 gal) in window."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S1", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /_clock/set"
              payload: { station_id: "${st}", to_iso8601: "2026-06-01T00:00:00Z" }
              as: StationManager
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "PREMIUM", octane: 93 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /fuel-grades/${gr}/reprice"
              payload: { new_price_cents: 419 }
              as: StationManager
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { tk: $.data.id, tk_v0: $.data.version }
            - call: "POST /pumps"
              payload: { station_id: "${st}", tank_id: "${tk}", number: 1 }
              as: StationManager
              captures: { pm: $.data.id }
            - call: "POST /loyalty-accounts"
              payload: { station_id: "${st}", phone: "5550100", name: "Gold Member" }
              as: CashierAttendant
              captures: { la: $.data.id }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 5000, unit_cost_cents: 280 }
              as: StationManager
              captures: { d1: $.data.id }
            - call: "POST /deliveries/${d1}/post"
              payload: { expected_tank_version: "${tk_v0}" }
              as: StationManager
              captures: { tk_v1: $.data.version }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 3000, unit_cost_cents: 300 }
              as: StationManager
              captures: { d2: $.data.id }
            - call: "GET /tanks/${tk}"
              payload: {}
              as: StationManager
              captures: { tk_vcur: $.data.version }
            - call: "POST /deliveries/${d2}/post"
              payload: { expected_tank_version: "${tk_vcur}" }
              as: StationManager
            - call: "POST /shifts"
              payload: { station_id: "${st}", opening_float_cents: 20000 }
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh: $.data.id }
            # GOLD tier requires lifetime_points >= 5000; seed via a large prior store sale before these sales
            - call: "POST /store-transactions"
              payload: { station_id: "${st}", shift_id: "${sh}", loyalty_account_id: "${la}", tender: "CARD", line_items: [ { sku: "GC", name: "GiftCard", category: "MISC", unit_price_cents: 250000, qty: 1, taxable: false } ] }
              as: CashierAttendant
            - call: "POST /fuel-transactions"
              payload: { station_id: "${st}", pump_id: "${pm}", shift_id: "${sh}", gallons: 12, tender: "CARD", loyalty_account_id: "${la}" }
              as: CashierAttendant
              captures: { t1: $.data.id }
            - call: "POST /fuel-transactions/${t1}/capture"
              payload: {}
              as: CashierAttendant
            - call: "GET /shifts/${sh}"
              payload: {}
              as: CashierAttendant
              captures: { sh_v1: $.data.version }
            - call: "POST /fuel-transactions/${t1}/settle"
              payload: { expected_shift_version: "${sh_v1}" }
              as: CashierAttendant
            - call: "POST /fuel-transactions"
              payload: { station_id: "${st}", pump_id: "${pm}", shift_id: "${sh}", gallons: 10, tender: "CARD", loyalty_account_id: "${la}" }
              as: CashierAttendant
              captures: { t2: $.data.id }
            - call: "POST /fuel-transactions/${t2}/capture"
              payload: {}
              as: CashierAttendant
            - call: "GET /shifts/${sh}"
              payload: {}
              as: CashierAttendant
              captures: { sh_v2: $.data.version }
            - call: "POST /fuel-transactions/${t2}/settle"
              payload: { expected_shift_version: "${sh_v2}" }
              as: CashierAttendant
          trigger:
            - call: "POST /margin-reports"
              payload: { station_id: "${st}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-02T00:00:00Z", cost_basis: "WAC" }
              as: StationManager
              captures: { rep_wac_cogs: $.data.cogs_cents, rep_wac_margin: $.data.margin_cents }
            - call: "POST /margin-reports"
              payload: { station_id: "${st}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-02T00:00:00Z", cost_basis: "REPLACEMENT" }
              as: StationManager
              captures: { rep_rep_cogs: $.data.cogs_cents, rep_rep_margin: $.data.margin_cents }
          assert:
            - "MarginReport(WAC).revenue_cents == 9108"
            - "MarginReport(WAC).cogs_cents == 6325"
            - "MarginReport(WAC).margin_cents == 2783"
            - "MarginReport(REPLACEMENT).cogs_cents == 6600"
            - "MarginReport(REPLACEMENT).margin_cents == 2508"
            - "MarginReport(WAC).cogs_cents != MarginReport(REPLACEMENT).cogs_cents"

      - name: loyalty_fuel_vs_store_accrual_diverge
        grounds:
          - calculations.loyalty_points_accrual
          - entities.LoyaltyAccount.fields.lifetime_points
          - entities.LoyaltyAccount.fields.point_balance
        distinguishing_aspect: |
          On the LoyaltyAccount (loyalty domain, NOT the margin domain), the fuel_accrual variant
          awards floor(12*10)=120 base points from gallons while the store_accrual variant on the
          same account awards floor(1550/100)*2=30 base points from subtotal dollars; identical
          formula name, two divergent input bases on a different subject entity than Rule 1's margin.
        test_recipe:
          setup:
            - "Station with a BRONZE loyalty member; one OPEN shift; a pump/tank/grade so a fuel sale can settle; member starts at lifetime_points 0 tier BRONZE."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S2", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /_clock/set"
              payload: { station_id: "${st}", to_iso8601: "2026-06-01T00:00:00Z" }
              as: StationManager
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /fuel-grades/${gr}/reprice"
              payload: { new_price_cents: 419 }
              as: StationManager
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { tk: $.data.id, tk_v0: $.data.version }
            - call: "POST /pumps"
              payload: { station_id: "${st}", tank_id: "${tk}", number: 1 }
              as: StationManager
              captures: { pm: $.data.id }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 5000, unit_cost_cents: 280 }
              as: StationManager
              captures: { d1: $.data.id }
            - call: "POST /deliveries/${d1}/post"
              payload: { expected_tank_version: "${tk_v0}" }
              as: StationManager
            - call: "POST /loyalty-accounts"
              payload: { station_id: "${st}", phone: "5550200", name: "Bronze Member" }
              as: CashierAttendant
              captures: { la: $.data.id }
            - call: "POST /shifts"
              payload: { station_id: "${st}", opening_float_cents: 20000 }
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh: $.data.id }
            - call: "POST /fuel-transactions"
              payload: { station_id: "${st}", pump_id: "${pm}", shift_id: "${sh}", gallons: 12, tender: "CARD", loyalty_account_id: "${la}" }
              as: CashierAttendant
              captures: { t1: $.data.id }
            - call: "POST /fuel-transactions/${t1}/capture"
              payload: {}
              as: CashierAttendant
            - call: "GET /shifts/${sh}"
              payload: {}
              as: CashierAttendant
              captures: { sh_v1: $.data.version }
            - call: "POST /fuel-transactions/${t1}/settle"
              payload: { expected_shift_version: "${sh_v1}" }
              as: CashierAttendant
              captures: { la_after_fuel: $.data.id }
            - call: "GET /loyalty-accounts/${la}"
              payload: {}
              as: CashierAttendant
              captures: { lp_after_fuel: $.data.lifetime_points }
          trigger:
            - call: "POST /store-transactions"
              payload: { station_id: "${st}", shift_id: "${sh}", loyalty_account_id: "${la}", tender: "CARD", line_items: [ { sku: "SNK", name: "Snacks", category: "GROCERY", unit_price_cents: 1550, qty: 1, taxable: true } ] }
              as: CashierAttendant
          assert:
            - "After fuel settle: LoyaltyAccount.${la}.lifetime_points == 120"
            - "After store sale: LoyaltyAccount.${la}.lifetime_points == 150"
            - "Store accrual contributed exactly 30 points (150 - 120), not a gallon-based amount"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pump_price_tiered_min_cap_mode_a
        grounds:
          - calculations.fuel_pump_price
          - entities.FuelTransaction.fields.discount_cents_per_gal
          - entities.FuelTransaction.fields.total_cents
        distinguishing_aspect: |
          Mode (a): total_cents = round(gallons * (base_price - min(TIER_DISCOUNT[tier], MAX_DISCOUNT)))
          has 3+ inputs (gallons, base_price, tier discount) with a non-linear min() cap; GOLD 12 gal
          @419 base, discount min(5,10)=5 -> net 414 -> 4968, distinct from the BRONZE control 5028.
        test_recipe:
          setup:
            - "Station REGULAR grade 419 c/gal; GOLD loyalty member; pump/tank ready; OPEN shift."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S3", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /_clock/set"
              payload: { station_id: "${st}", to_iso8601: "2026-06-01T00:00:00Z" }
              as: StationManager
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /fuel-grades/${gr}/reprice"
              payload: { new_price_cents: 419 }
              as: StationManager
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { tk: $.data.id, tk_v0: $.data.version }
            - call: "POST /pumps"
              payload: { station_id: "${st}", tank_id: "${tk}", number: 1 }
              as: StationManager
              captures: { pm: $.data.id }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 5000, unit_cost_cents: 280 }
              as: StationManager
              captures: { d1: $.data.id }
            - call: "POST /deliveries/${d1}/post"
              payload: { expected_tank_version: "${tk_v0}" }
              as: StationManager
            - call: "POST /loyalty-accounts"
              payload: { station_id: "${st}", phone: "5550300", name: "Gold" }
              as: CashierAttendant
              captures: { la: $.data.id }
            - call: "POST /shifts"
              payload: { station_id: "${st}", opening_float_cents: 20000 }
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh: $.data.id }
            # push member to GOLD via a large CARD store sale (250000 c subtotal -> 5000 lifetime pts)
            - call: "POST /store-transactions"
              payload: { station_id: "${st}", shift_id: "${sh}", loyalty_account_id: "${la}", tender: "CARD", line_items: [ { sku: "GC", name: "GiftCard", category: "MISC", unit_price_cents: 250000, qty: 1, taxable: false } ] }
              as: CashierAttendant
          trigger:
            - call: "POST /fuel-transactions"
              payload: { station_id: "${st}", pump_id: "${pm}", shift_id: "${sh}", gallons: 12, tender: "CARD", loyalty_account_id: "${la}" }
              as: CashierAttendant
              captures: { tx: $.data.id, tx_total: $.data.total_cents, tx_disc: $.data.discount_cents_per_gal }
          assert:
            - "FuelTransaction.${tx}.discount_cents_per_gal == 5"
            - "FuelTransaction.${tx}.net_price_cents_per_gal == 414"
            - "FuelTransaction.${tx}.total_cents == 4968"

      - name: margin_round_per_grade_then_sum_mode_b
        grounds:
          - calculations.fuel_margin
          - entities.MarginReport.fields.cogs_cents
        distinguishing_aspect: |
          Mode (b): COGS pins round-per-grade-then-sum. With one grade and 22 gal at WAC 287.5,
          round(22*287.5)=6325 — the scaffold fixes this order so a 'sum-then-round across lines'
          mis-order is detectable; this is a rounding-order mode distinct from instance 1's min/cap mode (a).
        test_recipe:
          setup:
            - "Reuse the Rule-1 WAC scenario: one PREMIUM grade, WAC 287.5, two SETTLED GOLD sales (12 + 10 gal) totalling 22 gal."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S4", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /_clock/set"
              payload: { station_id: "${st}", to_iso8601: "2026-06-01T00:00:00Z" }
              as: StationManager
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "PREMIUM", octane: 93 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /fuel-grades/${gr}/reprice"
              payload: { new_price_cents: 419 }
              as: StationManager
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { tk: $.data.id, tk_v0: $.data.version }
            - call: "POST /pumps"
              payload: { station_id: "${st}", tank_id: "${tk}", number: 1 }
              as: StationManager
              captures: { pm: $.data.id }
            - call: "POST /loyalty-accounts"
              payload: { station_id: "${st}", phone: "5550400", name: "Gold" }
              as: CashierAttendant
              captures: { la: $.data.id }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 5000, unit_cost_cents: 280 }
              as: StationManager
              captures: { d1: $.data.id }
            - call: "POST /deliveries/${d1}/post"
              payload: { expected_tank_version: "${tk_v0}" }
              as: StationManager
              captures: { tk_v1: $.data.version }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 3000, unit_cost_cents: 300 }
              as: StationManager
              captures: { d2: $.data.id }
            - call: "POST /deliveries/${d2}/post"
              payload: { expected_tank_version: "${tk_v1}" }
              as: StationManager
            - call: "POST /shifts"
              payload: { station_id: "${st}", opening_float_cents: 20000 }
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh: $.data.id }
            - call: "POST /store-transactions"
              payload: { station_id: "${st}", shift_id: "${sh}", loyalty_account_id: "${la}", tender: "CARD", line_items: [ { sku: "GC", name: "GiftCard", category: "MISC", unit_price_cents: 250000, qty: 1, taxable: false } ] }
              as: CashierAttendant
            - call: "POST /fuel-transactions"
              payload: { station_id: "${st}", pump_id: "${pm}", shift_id: "${sh}", gallons: 12, tender: "CARD", loyalty_account_id: "${la}" }
              as: CashierAttendant
              captures: { t1: $.data.id }
            - call: "POST /fuel-transactions/${t1}/capture"
              payload: {}
              as: CashierAttendant
            - call: "GET /shifts/${sh}"
              payload: {}
              as: CashierAttendant
              captures: { sh_v1: $.data.version }
            - call: "POST /fuel-transactions/${t1}/settle"
              payload: { expected_shift_version: "${sh_v1}" }
              as: CashierAttendant
            - call: "POST /fuel-transactions"
              payload: { station_id: "${st}", pump_id: "${pm}", shift_id: "${sh}", gallons: 10, tender: "CARD", loyalty_account_id: "${la}" }
              as: CashierAttendant
              captures: { t2: $.data.id }
            - call: "POST /fuel-transactions/${t2}/capture"
              payload: {}
              as: CashierAttendant
            - call: "GET /shifts/${sh}"
              payload: {}
              as: CashierAttendant
              captures: { sh_v2: $.data.version }
            - call: "POST /fuel-transactions/${t2}/settle"
              payload: { expected_shift_version: "${sh_v2}" }
              as: CashierAttendant
          trigger:
            - call: "POST /margin-reports"
              payload: { station_id: "${st}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-02T00:00:00Z", cost_basis: "WAC" }
              as: StationManager
              captures: { cogs: $.data.cogs_cents }
          assert:
            - "MarginReport.cogs_cents == 6325"
            - "MarginReport.gallons_sold == 22"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: tank_cycle_active_down_active
        grounds:
          - state_machines.Tank.ACTIVE_to_DOWN
          - state_machines.Tank.DOWN_to_ACTIVE
          - entities.Tank.fields.status
        distinguishing_aspect: |
          Tank is CYCLIC: ACTIVE -> DOWN (take-down) -> ACTIVE (restore), so ACTIVE is reachable
          again after being left; pumps cascade OUT_OF_SERVICE then back to IDLE across the cycle.
        test_recipe:
          setup:
            - "Station with one ACTIVE tank and one IDLE pump bound to it."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S5", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { tk: $.data.id }
            - call: "POST /pumps"
              payload: { station_id: "${st}", tank_id: "${tk}", number: 1 }
              as: StationManager
              captures: { pm: $.data.id }
            - call: "POST /tanks/${tk}/take-down"
              payload: {}
              as: StationManager
          trigger:
            - call: "POST /tanks/${tk}/restore"
              payload: {}
              as: StationManager
              captures: { tk_status: $.data.status }
          assert:
            - "After take-down: Tank.${tk}.status == DOWN and Pump.${pm}.status == OUT_OF_SERVICE"
            - "After restore: Tank.${tk}.status == ACTIVE (reachable again) and Pump.${pm}.status == IDLE"

      - name: shift_parallel_lifecycle_reconcile_axes
        grounds:
          - state_machines.Shift.OPEN_to_COUNTING
          - state_machines.Shift.COUNTING_to_CLOSED
          - entities.Shift.fields.lifecycle_status
          - entities.Shift.fields.reconcile_status
        distinguishing_aspect: |
          Shift (different entity than Tank) carries two INDEPENDENT status axes: lifecycle_status
          (OPEN->COUNTING->CLOSED) and reconcile_status (PENDING->BALANCED|OVER|SHORT); the close
          transition resolves both axes and reconcile_status value is independent of lifecycle path.
        test_recipe:
          setup:
            - "OPEN shift opened by cashier cash1 with opening_float 20000; no transactions; drawer expected 20000."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S6", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /shifts"
              payload: { station_id: "${st}", opening_float_cents: 20000 }
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh: $.data.id }
            - call: "POST /shifts/${sh}/begin-count"
              payload: {}
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh_v: $.data.version }
          trigger:
            - call: "POST /shifts/${sh}/close"
              payload: { counted_drawer_cents: 20000, expected_shift_version: "${sh_v}" }
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { lc: $.data.lifecycle_status, rc: $.data.reconcile_status }
          assert:
            - "After begin-count: Shift.${sh}.lifecycle_status == COUNTING and reconcile_status == PENDING"
            - "After close: Shift.${sh}.lifecycle_status == CLOSED and reconcile_status == BALANCED"
            - "Shift.${sh}.variance_cents == 0"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: delivery_post_tank_wac_lowstock_cascade_depth3
        grounds:
          - state_machines.Delivery.DRAFT_to_POSTED
          - entities.Tank.fields.volume_gallons
          - entities.Tank.fields.low_stock
          - entities.FuelGrade.fields.weighted_avg_cost_cents
        distinguishing_aspect: |
          Depth-3 chain from POST /deliveries/{id}/post: (1) Delivery->POSTED mutates Tank.volume_gallons;
          (2) the new volume crossing reorder_point recomputes Tank.low_stock; (3) the lot received by
          the tank recomputes FuelGrade.weighted_avg_cost_cents over the grade's POSTED deliveries —
          each hop caused by the prior, not a fan-out of the original post.
        test_recipe:
          setup:
            - "Station with a grade, a tank capacity 10000 reorder 6000 starting empty (volume 0, low_stock true), one DRAFT delivery 5000 gal @ 280; posting lifts volume to 5000 (still <=6000 so low_stock stays true) and sets WAC 280."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S7", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 6000 }
              as: StationManager
              captures: { tk: $.data.id, tk_v0: $.data.version }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 5000, unit_cost_cents: 280 }
              as: StationManager
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /deliveries/${d1}/post"
              payload: { expected_tank_version: "${tk_v0}" }
              as: StationManager
          assert:
            - "Tank.${tk}.volume_gallons == 5000 (hop 1)"
            - "Tank.${tk}.low_stock == true (hop 2: 5000 <= 6000)"
            - "FuelGrade.${gr}.weighted_avg_cost_cents == 280 (hop 3)"

      - name: take_down_pump_out_of_service_cascade_depth2
        grounds:
          - state_machines.Tank.ACTIVE_to_DOWN
          - entities.Pump.fields.status
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (POST /tanks/{id}/take-down): (1) Tank->DOWN;
          (2) that DOWN status cascades each bound Pump to OUT_OF_SERVICE — distinct propagation
          pattern (status cascade across entity type) from the delivery-post derived-field chain.
        test_recipe:
          setup:
            - "Station with one ACTIVE tank and two IDLE pumps bound to it."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S8", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { tk: $.data.id }
            - call: "POST /pumps"
              payload: { station_id: "${st}", tank_id: "${tk}", number: 1 }
              as: StationManager
              captures: { pm1: $.data.id }
            - call: "POST /pumps"
              payload: { station_id: "${st}", tank_id: "${tk}", number: 2 }
              as: StationManager
              captures: { pm2: $.data.id }
          trigger:
            - call: "POST /tanks/${tk}/take-down"
              payload: {}
              as: StationManager
              captures: { tk_status: $.data.status }
          assert:
            - "Tank.${tk}.status == DOWN"
            - "Pump.${pm1}.status == OUT_OF_SERVICE"
            - "Pump.${pm2}.status == OUT_OF_SERVICE"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: shift_not_open_beats_payment_not_captured
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_SHIFT_NOT_OPEN]
          - errors[ERR_PAYMENT_NOT_CAPTURED]
        distinguishing_aspect: |
          Settling a still-AUTHORIZED (not CAPTURED) fuel transaction into a shift already moved to
          COUNTING violates BOTH priority-7 (category state: ERR_SHIFT_NOT_OPEN) and priority-8
          (category state: ERR_PAYMENT_NOT_CAPTURED); the lower-priority-number wins so the response
          is ERR_SHIFT_NOT_OPEN, pinning the state-vs-state ordering at the shift gate.
        test_recipe:
          setup:
            - "An AUTHORIZED (uncaptured) fuel transaction whose shift has been advanced to COUNTING."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S9", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /fuel-grades/${gr}/reprice"
              payload: { new_price_cents: 419 }
              as: StationManager
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { tk: $.data.id, tk_v0: $.data.version }
            - call: "POST /pumps"
              payload: { station_id: "${st}", tank_id: "${tk}", number: 1 }
              as: StationManager
              captures: { pm: $.data.id }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 5000, unit_cost_cents: 280 }
              as: StationManager
              captures: { d1: $.data.id }
            - call: "POST /deliveries/${d1}/post"
              payload: { expected_tank_version: "${tk_v0}" }
              as: StationManager
            - call: "POST /shifts"
              payload: { station_id: "${st}", opening_float_cents: 20000 }
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh: $.data.id }
            - call: "POST /fuel-transactions"
              payload: { station_id: "${st}", pump_id: "${pm}", shift_id: "${sh}", gallons: 12, tender: "CASH" }
              as: CashierAttendant
              captures: { tx: $.data.id }
            - call: "POST /shifts/${sh}/begin-count"
              payload: {}
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh_v: $.data.version }
          trigger:
            - call: "POST /fuel-transactions/${tx}/settle"
              payload: { expected_shift_version: "${sh_v}" }
              as: CashierAttendant
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_SHIFT_NOT_OPEN (priority 7 beats priority 8 ERR_PAYMENT_NOT_CAPTURED)"

      - name: age_failure_beats_pump_unavailable_category_pair
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_AGE_VERIFICATION_FAILED]
          - errors[ERR_PUMP_UNAVAILABLE]
        distinguishing_aspect: |
          Different error-category pair than instance 1: this pits a business_safety/existence pair.
          A store-transaction with an age-restricted item and missing verified_buyer_age has only one
          applicable safety gate (priority-9 ERR_AGE_VERIFICATION_FAILED); paired against a fuel-auth
          ERR_PUMP_UNAVAILABLE on a separate endpoint, the suite confirms the store safety gate fires
          its own category error rather than any fuel gate. Distinct category pair from the state/state pair above.
        test_recipe:
          setup:
            - "OPEN shift; a store transaction line item with min_age 21 and no verified_buyer_age; separately a pump whose tank is DOWN."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S10", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /shifts"
              payload: { station_id: "${st}", opening_float_cents: 20000 }
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh: $.data.id }
          trigger:
            - call: "POST /store-transactions"
              payload: { station_id: "${st}", shift_id: "${sh}", tender: "CASH", line_items: [ { sku: "CIG", name: "Cigarettes", category: "TOBACCO", unit_price_cents: 900, qty: 1, taxable: true, min_age: 21 } ] }
              as: CashierAttendant
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_AGE_VERIFICATION_FAILED (business_safety gate; distinct category pair from the state/state conflict above)"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: cash_variance_tolerance_exact_boundary_balanced
        grounds:
          - calculations.shift_cash_reconciliation
          - entities.Shift.fields.reconcile_status
          - entities.Station.fields.cash_variance_tolerance_cents
        distinguishing_aspect: |
          Numeric-threshold boundary on the close endpoint: variance exactly +200 with tolerance 200
          must be BALANCED (abs(variance) <= tolerance uses <=, not <); +201 would be OVER. Tests the
          <= boundary on the drawer-variance metric.
        test_recipe:
          setup:
            - "OPEN shift opening_float 20000, no sales; expected_drawer 20000; tolerance default 200."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S11", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /shifts"
              payload: { station_id: "${st}", opening_float_cents: 20000 }
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh: $.data.id }
            - call: "POST /shifts/${sh}/begin-count"
              payload: {}
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh_v: $.data.version }
          trigger:
            - call: "POST /shifts/${sh}/close"
              payload: { counted_drawer_cents: 20200, expected_shift_version: "${sh_v}" }
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { rc: $.data.reconcile_status }
          assert:
            - "Shift.${sh}.variance_cents == 200"
            - "Shift.${sh}.reconcile_status == BALANCED (200 <= 200 boundary inclusive)"

      - name: tank_reorder_point_lowstock_inclusive_boundary
        grounds:
          - calculations.tank_wet_stock_balance
          - entities.Tank.fields.low_stock
          - entities.Tank.fields.reorder_point_gallons
        distinguishing_aspect: |
          Different metric (tank volume) on a different endpoint (delivery post): with reorder_point
          5000 and a delivery bringing volume to exactly 5000, low_stock must be true (volume <=
          reorder uses <=); a volume of 5001 would be false. Inclusive-boundary on the wet-stock axis.
        test_recipe:
          setup:
            - "Station with a tank capacity 10000 reorder 5000 starting empty; one DRAFT delivery of exactly 5000 net gallons."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S12", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 5000 }
              as: StationManager
              captures: { tk: $.data.id, tk_v0: $.data.version }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 5000, unit_cost_cents: 280 }
              as: StationManager
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /deliveries/${d1}/post"
              payload: { expected_tank_version: "${tk_v0}" }
              as: StationManager
          assert:
            - "Tank.${tk}.volume_gallons == 5000"
            - "Tank.${tk}.low_stock == true (5000 <= 5000 inclusive boundary)"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: fuel_settle_requires_shift_open
        grounds:
          - state_machines.FuelTransaction.UNSETTLED_to_SETTLED
          - entities.Shift.fields.lifecycle_status
          - errors[ERR_SHIFT_NOT_OPEN]
        distinguishing_aspect: |
          FuelTransaction's UNSETTLED->SETTLED transition depends on the OTHER entity Shift being in
          lifecycle_status OPEN; a CAPTURED transaction whose shift is COUNTING is rejected
          ERR_SHIFT_NOT_OPEN. Entity pair: FuelTransaction -> Shift.
        test_recipe:
          setup:
            - "A CAPTURED fuel transaction whose shift has been moved to COUNTING."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S13", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /fuel-grades/${gr}/reprice"
              payload: { new_price_cents: 419 }
              as: StationManager
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { tk: $.data.id, tk_v0: $.data.version }
            - call: "POST /pumps"
              payload: { station_id: "${st}", tank_id: "${tk}", number: 1 }
              as: StationManager
              captures: { pm: $.data.id }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 5000, unit_cost_cents: 280 }
              as: StationManager
              captures: { d1: $.data.id }
            - call: "POST /deliveries/${d1}/post"
              payload: { expected_tank_version: "${tk_v0}" }
              as: StationManager
            - call: "POST /shifts"
              payload: { station_id: "${st}", opening_float_cents: 20000 }
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh: $.data.id }
            - call: "POST /fuel-transactions"
              payload: { station_id: "${st}", pump_id: "${pm}", shift_id: "${sh}", gallons: 12, tender: "CARD" }
              as: CashierAttendant
              captures: { tx: $.data.id }
            - call: "POST /fuel-transactions/${tx}/capture"
              payload: {}
              as: CashierAttendant
            - call: "POST /shifts/${sh}/begin-count"
              payload: {}
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh_v: $.data.version }
          trigger:
            - call: "POST /fuel-transactions/${tx}/settle"
              payload: { expected_shift_version: "${sh_v}" }
              as: CashierAttendant
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_SHIFT_NOT_OPEN"
            - "FuelTransaction.${tx}.settlement_status remains UNSETTLED"

      - name: delivery_post_requires_tank_active
        grounds:
          - state_machines.Delivery.DRAFT_to_POSTED
          - entities.Tank.fields.status
          - errors[ERR_TANK_DOWN]
        distinguishing_aspect: |
          Different entity pair (Delivery -> Tank): Delivery's DRAFT->POSTED depends on the Tank being
          ACTIVE; posting against a DOWN tank is rejected ERR_TANK_DOWN, distinct from the
          FuelTransaction->Shift pair above.
        test_recipe:
          setup:
            - "A DRAFT delivery whose tank has been taken DOWN."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S14", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { tk: $.data.id, tk_v0: $.data.version }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 5000, unit_cost_cents: 280 }
              as: StationManager
              captures: { d1: $.data.id }
            - call: "POST /tanks/${tk}/take-down"
              payload: {}
              as: StationManager
              captures: { tk_v1: $.data.version }
          trigger:
            - call: "POST /deliveries/${d1}/post"
              payload: { expected_tank_version: "${tk_v1}" }
              as: StationManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_TANK_DOWN"
            - "Delivery.${d1}.status remains DRAFT"

  # =========================================================================
  # Rule 8 — Resource temporal/aggregate-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: tank_capacity_aggregate_overflow_strict
        grounds:
          - calculations.tank_wet_stock_balance
          - state_machines.Delivery.DRAFT_to_POSTED
          - entities.Tank.fields.capacity_gallons
          - errors[ERR_TANK_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on the Tank resource: a second delivery whose net
          gallons, ADDED to current volume, exceeds capacity (8000 + 3000 > 10000) is rejected
          ERR_TANK_CAPACITY_EXCEEDED. Treats the tank as a single accumulating bucket (sum vs ceiling),
          a strict-greater-than overflow test.
        test_recipe:
          setup:
            - "Tank capacity 10000 with volume already 8000 (two POSTED deliveries 5000 + 3000); a third DRAFT delivery of 3000 gal would overflow."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S15", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { tk: $.data.id, tk_v0: $.data.version }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 5000, unit_cost_cents: 280 }
              as: StationManager
              captures: { d1: $.data.id }
            - call: "POST /deliveries/${d1}/post"
              payload: { expected_tank_version: "${tk_v0}" }
              as: StationManager
              captures: { tk_v1: $.data.version }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 3000, unit_cost_cents: 300 }
              as: StationManager
              captures: { d2: $.data.id }
            - call: "POST /deliveries/${d2}/post"
              payload: { expected_tank_version: "${tk_v1}" }
              as: StationManager
              captures: { tk_v2: $.data.version }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 3000, unit_cost_cents: 290 }
              as: StationManager
              captures: { d3: $.data.id }
          trigger:
            - call: "POST /deliveries/${d3}/post"
              payload: { expected_tank_version: "${tk_v2}" }
              as: StationManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_TANK_CAPACITY_EXCEEDED (8000 + 3000 > 10000)"
            - "Tank.${tk}.volume_gallons remains 8000"

      - name: shift_uniqueness_pump_number_per_station
        grounds:
          - entities.Pump.fields.number
          - errors[ERR_DUPLICATE_PUMP]
        distinguishing_aspect: |
          Different interval semantics (identity/uniqueness collision rather than capacity bucket) on
          a different resource (Pump): two pumps cannot occupy the same island number within one
          station — a point-collision (single-key uniqueness) rather than the additive-capacity overlap
          on the Tank above.
        test_recipe:
          setup:
            - "Station with a tank and an existing pump number 1."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S16", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { tk: $.data.id }
            - call: "POST /pumps"
              payload: { station_id: "${st}", tank_id: "${tk}", number: 1 }
              as: StationManager
              captures: { pm1: $.data.id }
          trigger:
            - call: "POST /pumps"
              payload: { station_id: "${st}", tank_id: "${tk}", number: 1 }
              as: StationManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_DUPLICATE_PUMP"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: delivery_void_restores_tank_volume_invariant
        grounds:
          - state_machines.Delivery.DRAFT_to_POSTED
          - state_machines.Delivery.POSTED_to_VOIDED
          - entities.Tank.fields.volume_gallons
        distinguishing_aspect: |
          Conserved quantity = Tank.volume_gallons (wet stock). Forward post adds net_gallons; the
          compensating void subtracts exactly the same net_gallons, so after post-then-void
          volume_gallons returns to its pre-post value (5000 -> 10000 -> 5000), pinned as
          volume_after_void == volume_before_post.
        test_recipe:
          setup:
            - "Tank with volume 5000 (one prior POSTED delivery), a second POSTED delivery of 5000 gal raising it to 10000."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S17", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { tk: $.data.id, tk_v0: $.data.version }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 5000, unit_cost_cents: 280 }
              as: StationManager
              captures: { d1: $.data.id }
            - call: "POST /deliveries/${d1}/post"
              payload: { expected_tank_version: "${tk_v0}" }
              as: StationManager
              captures: { tk_v1: $.data.version }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 5000, unit_cost_cents: 280 }
              as: StationManager
              captures: { d2: $.data.id }
            - call: "POST /deliveries/${d2}/post"
              payload: { expected_tank_version: "${tk_v1}" }
              as: StationManager
          trigger:
            - call: "POST /deliveries/${d2}/void"
              payload: {}
              as: StationManager
              captures: { dv_status: $.data.status }
          assert:
            - "Before void: Tank.${tk}.volume_gallons == 10000"
            - "After void: Tank.${tk}.volume_gallons == 5000 (volume_after_void == volume_before_post)"
            - "Delivery.${d2}.status == VOIDED"

      - name: fuel_reverse_restores_shift_cash_invariant
        grounds:
          - state_machines.FuelTransaction.UNSETTLED_to_SETTLED
          - state_machines.FuelTransaction.SETTLED_to_REVERSED
          - entities.Shift.fields.cash_sales_cents
          - entities.Shift.fields.expected_drawer_cents
        distinguishing_aspect: |
          Different conserved quantity = Shift drawer cash (cash_sales_cents / expected_drawer_cents),
          not wet-stock volume. Settling a CASH sale credits the drawer by total_cents; the
          compensating reverse debits exactly total_cents, so expected_drawer_cents returns to its
          pre-settle value (20000 -> 25028 -> 20000), pinned as expected_after_reverse == opening_float.
        test_recipe:
          setup:
            - "OPEN shift opening_float 20000; one CAPTURED CASH BRONZE fuel sale of 12 gal @419 (total 5028) settled into the shift, lifting expected_drawer to 25028."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S18", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /fuel-grades/${gr}/reprice"
              payload: { new_price_cents: 419 }
              as: StationManager
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { tk: $.data.id, tk_v0: $.data.version }
            - call: "POST /pumps"
              payload: { station_id: "${st}", tank_id: "${tk}", number: 1 }
              as: StationManager
              captures: { pm: $.data.id }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 5000, unit_cost_cents: 280 }
              as: StationManager
              captures: { d1: $.data.id }
            - call: "POST /deliveries/${d1}/post"
              payload: { expected_tank_version: "${tk_v0}" }
              as: StationManager
            - call: "POST /shifts"
              payload: { station_id: "${st}", opening_float_cents: 20000 }
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh: $.data.id }
            - call: "POST /fuel-transactions"
              payload: { station_id: "${st}", pump_id: "${pm}", shift_id: "${sh}", gallons: 12, tender: "CASH" }
              as: CashierAttendant
              captures: { tx: $.data.id }
            - call: "POST /fuel-transactions/${tx}/capture"
              payload: {}
              as: CashierAttendant
            - call: "GET /shifts/${sh}"
              payload: {}
              as: CashierAttendant
              captures: { sh_v1: $.data.version }
            - call: "POST /fuel-transactions/${tx}/settle"
              payload: { expected_shift_version: "${sh_v1}" }
              as: CashierAttendant
          trigger:
            - call: "POST /fuel-transactions/${tx}/reverse"
              payload: {}
              as: CashierAttendant
              captures: { rev_set: $.data.settlement_status, rev_pay: $.data.payment_status }
          assert:
            - "Before reverse: Shift.${sh}.cash_sales_cents == 5028 and expected_drawer_cents == 25028"
            - "After reverse: Shift.${sh}.cash_sales_cents == 0 and expected_drawer_cents == 20000 (== opening_float)"
            - "FuelTransaction.${tx}.settlement_status == REVERSED and payment_status == REFUNDED"
