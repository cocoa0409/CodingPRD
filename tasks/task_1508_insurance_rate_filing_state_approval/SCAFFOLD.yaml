    side_effects: ["status SCHEDULED -> CANCELLED; WAVE_WINDOW entry WAIVED"]

  - method: GET
    path: "/waves/{waveId}/disruption-analysis"
    description: "Computed disruption summary of a wave per disruption_summary"
