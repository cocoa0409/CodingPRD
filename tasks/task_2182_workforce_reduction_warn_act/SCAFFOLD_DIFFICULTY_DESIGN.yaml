  - rule_id: non_linear_state_machine
    instances:

      - name: reduction_plan_parallel_governance_and_warn_axes_advance_independently
        grounds:
          - state_machines.ReductionPlan.DRAFT_to_IN_LEGAL_REVIEW
          - state_machines.ReductionPlan.IN_LEGAL_REVIEW_to_APPROVED
          - state_machines.ReductionPlan.NOT_ASSESSED_to_THRESHOLD_PENDING
          - state_machines.ReductionPlan.THRESHOLD_PENDING_to_NOTICES_ISSUED
          - entities.ReductionPlan.fields.approval_status
          - entities.ReductionPlan.fields.warn_status
        distinguishing_aspect: |
          Non-linear shape on ReductionPlan: two parallel state dimensions on one row.
          warn_status reaches THRESHOLD_PENDING from a Selection cascade while
          approval_status is still DRAFT, then approval_status walks to APPROVED with
          warn_status frozen at THRESHOLD_PENDING, then issuing the notice moves
          warn_status to NOTICES_ISSUED without touching approval_status.
        test_recipe:
          setup:
            - "A NY site with three full-time employees, a FEDERAL rule (min_loss_count 3) and a NY STATE rule (min_loss_count 2, min_percent 25.0, notice_days 90, window_days 30)."
            - "Alice and Carla are SELECTED for 2026-12-01, which crosses the NY threshold (2 losses of a 3-person workforce, 66.67 percent) but not the federal one."
            - "The plan is still approval_status DRAFT at the end of setup."
          setup_api_calls:
            - call: "POST /warn-rules"
              payload: { jurisdiction: "FEDERAL", state_code: "US", rule_code: "FED-WARN-1988", min_loss_count: 3, min_percent: 33.0, absolute_count: 20, notice_days: 60, window_days: 90, counts_part_time: false, min_service_days: 180, required_content_codes: ["EMPLOYER_NAME", "SITE_ADDRESS", "SEPARATION_DATE"] }
