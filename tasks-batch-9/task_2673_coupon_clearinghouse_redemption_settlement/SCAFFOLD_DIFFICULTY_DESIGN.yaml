      - name: billing_period_buffer_adjacency_rejected_both_sides
        grounds:
          - validations[priority=18]
          - errors.ERR_BILLING_PERIOD_BUFFER_VIOLATION
          - entities.ManufacturerInvoice.fields.billing_period_start
          - entities.ManufacturerInvoice.fields.billing_period_end
        distinguishing_aspect: |
          The mirror image of the postmark rule, on purpose. The contended
          resource is the Manufacturer's billing calendar, the interval is CLOSED
          [start, end], and adjacency is REJECTED because
          BILLING_PERIOD_BUFFER_DAYS is 1: a period ending 2026-07-31 forbids a new
          period starting 2026-08-01 and also forbids one ending 2026-06-30. Only
          2026-08-02 (or 2026-06-29 on the other side) leaves the required clear
          day. Any implementation that shares one interval-overlap helper between
          the two rules gets exactly one of them wrong.
