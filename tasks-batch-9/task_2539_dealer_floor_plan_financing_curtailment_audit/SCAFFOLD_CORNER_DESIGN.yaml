      - name: higher_priority_state_error_wins_over_a_lower_priority_fiscal_error
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: suspended_line_state_error_beats_credit_limit_fiscal_error_on_the_same_fund_call
          rationale: "That instance constructs a single fund call that violates the priority-61 line-state rule and the priority-110 capacity rule at once and asserts the priority-61 error id, which is the priority-ordering claim in its exact form."

      - name: safety_priority_beats_referential_priority_on_the_same_decision_call
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: exception_approver_sod_safety_error_beats_open_out_of_trust_referential_error
          rationale: "The priority-conflict row asks for two simultaneously violated rules P and P+N; that instance violates priority 70 and priority 100 on one aging-exception decision and asserts the priority-70 error, then repairs the first violation and observes the second surface."

      - name: unit_registration_depends_on_the_credit_lines_state
        claim_type: cross_entity_validation
        excluded_because:
          difficulty_instance: unit_registration_blocked_until_the_governing_credit_line_is_activated
          rationale: "Cross-entity validation needs both the invalid and the valid side of a dependency on another entity's state; that instance registers the same unit against a PENDING line (rejected) and then against the same line once ACTIVE (accepted)."

      - name: a_new_audit_window_that_touches_an_existing_one_is_detected
        claim_type: temporal_validation
        excluded_because:
          difficulty_instance: audit_windows_are_closed_intervals_and_unannounced_needs_a_fourteen_day_gap
          rationale: "That instance asserts the closed-interval collision on a touching endpoint, the 14-day unannounced gap and the fact that an ABORTED audit frees its window, covering the temporal-conflict detection claim end to end."

      - name: two_individually_valid_used_advances_breach_the_class_sublimit_together
