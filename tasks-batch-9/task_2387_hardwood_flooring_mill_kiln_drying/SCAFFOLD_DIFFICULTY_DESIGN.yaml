  - rule_id: transitive_cascade
    rule_summary: "Two independent depth-3 cascades: a redry extension displaces a downstream charge and releases that charge's receipts, and a claim approval restricts a product line which holds its scheduled prefinish runs."
    instances:
      - name: redry_extension_displaces_downstream_charge_and_frees_its_receipts
        summary: "record_stress_test on charge A (level 1: A -> REDRY, window extended to 2026-08-18T07:00:00.000Z) displaces charge B on the same chamber (level 2: B -> DISPLACED) which returns B's allocated receipt to ACCEPTED and zeroes B.charged_green_bf (level 3)."
        mechanism: "Window extension -> overlap re-evaluation on the chamber -> child receipt de-allocation, all inside the one stress-test request."
        entities_touched: [KilnCharge, KilnChamber, GreenReceipt]
        rules_referenced: [charge_occupancy_window, chamber_window_conflict_detection, green_board_feet_conservation]
        test_recipe:
          setup: "Chamber K1 holds charge A (start 2026-08-05T00:00:00Z, 265.0 h, window ends 2026-08-16T07:00:00Z) in CONDITIONING, and charge B scheduled at 2026-08-16T08:00:00Z with receipt R3 (2000 bf at 45.0 pct) allocated."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id", species_v: "$.data.version" } }
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${species_id}", schedule_code: "RO-100", thickness_in: 1.00, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${species_v}" }, as: MillAdmin, captures: { sched_id: "$.data.id" } }
            - { call: "POST /mill/kiln-chambers", payload: { chamber_code: "K1", capacity_board_feet: 12000 }, as: MillAdmin, captures: { chamber_id: "$.data.id" } }
            - { call: "POST /mill/kiln-charges", payload: { drying_schedule_id: "${sched_id}", kiln_chamber_id: "${chamber_id}", planned_start_utc: "2026-08-05T00:00:00.000Z" }, as: KilnOperator, captures: { charge_a: "$.data.id" } }
            - { call: "POST /mill/kiln-charges", payload: { drying_schedule_id: "${sched_id}", kiln_chamber_id: "${chamber_id}", planned_start_utc: "2026-08-16T08:00:00.000Z" }, as: KilnOperator, captures: { charge_b: "$.data.id" } }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 6000, receipt_grade: "FAS", moisture_pct_at_receipt: 46.0 }, as: ProcurementClerk, captures: { r1: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r1}/accept", payload: { accepted_board_feet: 5800 }, as: ProcurementClerk }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 4000, receipt_grade: "SELECT", moisture_pct_at_receipt: 44.0 }, as: ProcurementClerk, captures: { r2: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r2}/accept", payload: { accepted_board_feet: 3900 }, as: ProcurementClerk }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Cedar Hollow Timber", received_board_feet: 2200, receipt_grade: "NO1_COMMON", moisture_pct_at_receipt: 45.0 }, as: ProcurementClerk, captures: { r3: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r3}/accept", payload: { accepted_board_feet: 2000 }, as: ProcurementClerk }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r1}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r2}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_b}/allocate_receipt", payload: { green_receipt_id: "${r3}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/load", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/start_drying", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/begin_conditioning", payload: {}, as: KilnOperator }
          trigger:
            - { call: "POST /mill/kiln-charges/${charge_a}/record_stress_test", payload: { shell_moisture_pct: 5.9, core_moisture_pct: 8.0 }, as: KilnOperator }
          assert:
            - "Level 1 - response status 200 with data.status == \"REDRY\", data.redry_count == 1, data.planned_end_utc == \"2026-08-18T01:00:00.000Z\", data.blocked_until_utc == \"2026-08-18T07:00:00.000Z\"."
            - "Level 2 - GET /mill/kiln-charges/{charge_b} shows status \"DISPLACED\" with a non-empty displaced_reason (its window 2026-08-16T08:00:00.000Z .. 2026-08-27T15:00:00.000Z now overlaps A's extended window)."
            - "Level 3 - GET /mill/green-receipts/{r3} shows status \"ACCEPTED\" with kiln_charge_id == null, and GET /mill/kiln-charges/{charge_b} shows charged_green_bf == 0 and weighted_initial_moisture_pct == null."
            - "Charge A's own receipts are untouched: GET /mill/green-receipts/{r1} and {r2} both show status \"CONSUMED\" with kiln_charge_id == charge_a."
            - "GET /mill/green-receipts?kiln_charge_id={charge_b} returns total_count 0."
            - "The cascade is transitive: nothing in the stress-test request mentions charge B or receipt R3."

