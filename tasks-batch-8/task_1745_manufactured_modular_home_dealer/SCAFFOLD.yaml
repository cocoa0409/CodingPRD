  - method: POST
    path: "/api/trade-in-appraisals/{id}/start-reconditioning"
    description: "Begin reconditioning the accepted trade-in (ACCEPTED -> RECONDITIONING)."
    roles: [Appraiser]
    code: 200
    input: []
    output: TradeInAppraisal
    side_effects: ["trade-in HomeUnit: AT_DEALER -> RECONDITIONING"]
  - method: POST
    path: "/api/trade-in-appraisals/{id}/complete-reconditioning"
    description: "Finish reconditioning (RECONDITIONING -> RETAIL_READY); unit becomes resalable."
    roles: [Appraiser]
    code: 200
    input: []
    output: TradeInAppraisal
    side_effects: ["trade-in HomeUnit: RECONDITIONING -> RETAIL_READY"]

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role not a declared role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted on the endpoint, or ownership check failed (customer/evaluator mismatch)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, enum out of range, numeric range violation, or DelayNotice with both/neither subject FKs" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_sales_order_version does not match the order's current version (OCC)" }
  - { id: ERR_HOME_MODEL_NOT_FOUND, http: 404, condition: "Referenced home model does not exist" }
  - { id: ERR_COMMUNITY_NOT_FOUND, http: 404, condition: "Referenced community does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "Referenced lot does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Referenced customer does not exist" }
  - { id: ERR_HOME_UNIT_NOT_FOUND, http: 404, condition: "Referenced home unit does not exist" }
  - { id: ERR_SALES_ORDER_NOT_FOUND, http: 404, condition: "Referenced sales order does not exist" }
  - { id: ERR_ORDER_OPTION_NOT_FOUND, http: 404, condition: "Referenced order option does not exist" }
  - { id: ERR_SITE_EVALUATION_NOT_FOUND, http: 404, condition: "Referenced site evaluation does not exist" }
  - { id: ERR_FINANCING_APPLICATION_NOT_FOUND, http: 404, condition: "Referenced financing application does not exist" }
  - { id: ERR_TRANSPORT_CREW_NOT_FOUND, http: 404, condition: "Referenced transport crew does not exist" }
  - { id: ERR_TRANSPORT_JOB_NOT_FOUND, http: 404, condition: "Referenced transport job does not exist" }
  - { id: ERR_TITLE_RECORD_NOT_FOUND, http: 404, condition: "Referenced title record does not exist" }
  - { id: ERR_WARRANTY_CLAIM_NOT_FOUND, http: 404, condition: "Referenced warranty claim does not exist" }
  - { id: ERR_TRADE_IN_APPRAISAL_NOT_FOUND, http: 404, condition: "Referenced trade-in appraisal does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition exists (includes terminal lockdown and re-fire)" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "Cancel attempted from TITLED/CLOSED/CANCELLED, or while payment_status == FINANCED" }
  - { id: ERR_HOME_UNIT_UNAVAILABLE, http: 409, condition: "Unit not in {AT_DEALER, RETAIL_READY} or already held by another non-terminal order" }
  - { id: ERR_LOT_NOT_AVAILABLE, http: 409, condition: "Order create requires a RESERVED lot; reserve requires an AVAILABLE lot" }
  - { id: ERR_LOT_DIMENSION_INSUFFICIENT, http: 422, condition: "Model sections or length exceed the lot's max_sections / max_length_ft" }
  - { id: ERR_PLACEMENT_MISMATCH, http: 422, condition: "COMMUNITY_LOT without lot_id, or PRIVATE_LAND with lot_id" }
  - { id: ERR_FINANCING_TYPE_INCOMPATIBLE, http: 422, condition: "REAL_PROPERTY on community placement, application type != order type, or title conversion on a chattel order" }
  - { id: ERR_ESCORT_REQUIRED, http: 422, condition: "escort_vehicle_count below the required count for the model's transport width" }
  - { id: ERR_PERMIT_MISSING, http: 422, condition: "Set completion attempted without an approved evaluation carrying a permit number" }
  - { id: ERR_CREW_CAPABILITY_INSUFFICIENT, http: 422, condition: "Crew without multiwide certification assigned to a multi-section job" }
  - { id: ERR_CREW_WINDOW_CONFLICT, http: 409, condition: "Crew section capacity exceeded on at least one date of the move window" }
  - { id: ERR_EVALUATOR_CAPACITY_EXCEEDED, http: 409, condition: "Evaluator already holds 3 evaluations on the requested calendar date" }
  - { id: ERR_TITLE_ALREADY_ACTIVE, http: 409, condition: "Unit already has an APPLIED or ISSUED title record" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Uniqueness violation: serial_number, email, model_code, or lot_number within community" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Warranty resolve attempted by the same user recorded as reviewed_by" }
  - { id: ERR_RATE_BELOW_FLOOR, http: 422, condition: "apr_bps below the financing type's rate floor (700 CHATTEL / 450 REAL_PROPERTY)" }
  - { id: ERR_TERM_EXCEEDS_CAP, http: 422, condition: "term_months above the financing type's cap (240 CHATTEL / 360 REAL_PROPERTY)" }
  - { id: ERR_SCHEDULE_IN_PAST, http: 422, condition: "Scheduled date precedes the current logical clock date" }
  - { id: ERR_PRODUCTION_INCOMPLETE, http: 409, condition: "Factory-order unit marked ready before its model's lead time elapsed" }
  - { id: ERR_RATE_LOCK_EXPIRED, http: 409, condition: "Fund attempted after rate_lock_expires_at; application transitions to EXPIRED" }
  - { id: ERR_WARRANTY_EXPIRED, http: 422, condition: "Claim reported after the inclusive coverage window end for its claim type" }
  - { id: ERR_DELAY_NOTIFICATION_REQUIRED, http: 422, condition: "Transport delay longer than 3 days declared without buyer notification" }
  - { id: ERR_DEPOSIT_INSUFFICIENT, http: 422, condition: "Deposit below round_half_up(5% of total_price_cents) at confirm" }
  - { id: ERR_FUNDING_AMOUNT_MISMATCH, http: 422, condition: "funded_amount_cents differs from the application's requested_amount_cents" }
  - { id: ERR_CLAIM_AMOUNT_EXCESS, http: 422, condition: "approved_cost_cents exceeds the claim's estimated_cost_cents" }

roles:
  - name: DealershipAdmin
    description: "Dealership operator: catalog, communities/lots, unit inventory, titles, order closure, clock."
    identity: opaque
    exclusive_operations: ["home-model create", "community create", "lot create", "home-unit create", "home-unit mark-ready", "title-record create/issue/convert/surrender", "order close", "clock set"]
    shared_operations: ["all GET endpoints"]
  - name: SalesConsultant
    description: "Sales desk: customers, lot holds, orders, options, evaluations scheduling, financing origination, delay communications, trade-in intake."
    identity: opaque
    exclusive_operations: ["customer create", "lot reserve/release", "order create/confirm/cancel", "option add/void", "site-evaluation create", "financing application create/submit", "order-level delay notice"]
    shared_operations: ["all GET endpoints"]
  - name: Customer
    description: "The buyer; acts only on resources anchored to their own orders."
    identity: "entity_backed:Customer"
    exclusive_operations: ["warranty claim create (own order)", "warranty claim resubmit (own claim)", "trade-in decide (own order)"]
    shared_operations: ["all GET endpoints"]
  - name: SiteEvaluator
    description: "Field evaluator; records findings only on evaluations assigned to their X-User-ID."
    identity: opaque
    exclusive_operations: ["site-evaluation record-findings"]
    shared_operations: ["all GET endpoints"]
  - name: InstallationManager
    description: "Installation authority: approves/rejects evaluations and certifies set completion."
    identity: opaque
    exclusive_operations: ["site-evaluation approve/reject", "transport complete-set"]
    shared_operations: ["all GET endpoints"]
  - name: TransportCoordinator
    description: "Logistics desk: books, dispatches, delays, reschedules, delivers and cancels transport jobs."
    identity: opaque
    exclusive_operations: ["transport-job create/dispatch/delay/reschedule/deliver/cancel"]
    shared_operations: ["all GET endpoints"]
  - name: LenderAgent
    description: "Lender-side decision maker; cannot originate applications (segregation from SalesConsultant)."
    identity: opaque
    exclusive_operations: ["financing decide", "financing fund"]
    shared_operations: ["all GET endpoints"]
  - name: ServiceManager
    description: "Warranty service desk; reviewer and resolver of a claim must be different users (segregation of duties)."
    identity: opaque
    exclusive_operations: ["warranty review", "warranty resolve", "warranty claim create (on behalf)"]
    shared_operations: ["all GET endpoints"]
  - name: Appraiser
    description: "Trade-in appraiser; inspects, offers, and manages reconditioning. Cannot create the appraisal intake (segregation from SalesConsultant)."
    identity: opaque
    exclusive_operations: ["trade-in inspect", "trade-in offer", "trade-in start/complete reconditioning"]
    shared_operations: ["all GET endpoints"]
