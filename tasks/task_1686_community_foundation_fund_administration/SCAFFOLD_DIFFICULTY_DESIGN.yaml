              as: GiftOfficer
              captures: { fe2_c: $.data.id }
            - call: "POST /contributions/${fe2_c}/accept"
              payload: {}
              as: GiftOfficer
            - call: "POST /funds/${fe2_id}/activate"
              payload: {}
              as: FoundationAdmin
            - call: "POST /grantees"
              payload: { legal_name: "Prio Grantee", tax_id: "333444555", irs_subsection: "C3_501" }
              as: ComplianceOfficer
              captures: { gp_id: $.data.id }
            - call: "POST /grantees/${gp_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /grantees/${gp_id}/clear"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /funds/${fe2_id}"
              as: FoundationAdmin
