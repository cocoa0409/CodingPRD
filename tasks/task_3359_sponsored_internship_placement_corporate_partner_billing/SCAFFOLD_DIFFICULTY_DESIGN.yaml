      - name: cohort_contract_points_circular_evaluation_order
        grounds:
          - calculations.cohort_contract_points
          - entities.Cohort.fields.awarded_points
          - state_machines.StipendStatement.PENDING_to_PAID
        distinguishing_aspect: "cohort_contract_points is a circular-looking formula whose evaluation order is pinned — the tier level is read from the raw paid-point total (13, level 2) and the award is round_half_up(13/3) + 2*100 = 204, whereas reading the level from the already-bonused award is self-referential."
        test_recipe:
          setup:
            - "cohort BOS-01 holds one enrolled student whose first two L&D statements are already PAID, leaving lifetime_contract_points at 8 and Cohort.awarded_points at 103"
            - "a third L&D statement worth 5 contract points is PENDING"
