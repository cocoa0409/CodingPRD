              payload: { client_name: "C", fiscal_year_end: "2026-06-30", base_fee_cents: 500000, materiality_cents: 50000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { ok_id: $.data.id }
          assert:
            - "Presence of role here is the positive case; absence verified by separate request without headers in test layer"
