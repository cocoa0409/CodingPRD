        distinguishing_aspect: "ADMIN_SUSPENDED is reachable only through a reporting sweep, so the board's own status-change endpoint refuses it as a target with ERR_INVALID_STATE_TRANSITION while accepting the other two administrative values and bumping the attorney version on each accepted move."
        test_recipe:
