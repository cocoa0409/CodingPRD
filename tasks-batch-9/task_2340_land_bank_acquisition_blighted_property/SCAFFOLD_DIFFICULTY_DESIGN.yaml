            - call: "POST /land-bank/title-actions/${ta1_id}/adjudicate"
              payload: { outcome: "CLEARED" }
              as: IntakeOfficer
              as_user_id: "intake-1"
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-100032", address: "32 Dell St", situs_ward: 5, lot_area_sqft: 10000, assessed_value_cents: 250000, structure_present: true, structure_condition_grade: "D", vacancy_months: 40 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p2_id: $.data.id }
            - call: "POST /land-bank/properties/${p2_id}/code-violation-report"
              payload: { open_code_violation_count: 0, nuisance_complaint_count: 4 }
              as: IntakeOfficer
              as_user_id: "intake-1"
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p2_id}", funding_source_id: "${fs_acq_id}", channel: "DONATION", offer_price_cents: 0, title_search_fee_cents: 10000, donor_name: "Dell Street Trust" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk2_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets/${pk2_id}/board-approval"
              payload: { resolution_no: "R-2026-052" }
              as: BoardClerk
              as_user_id: "clerk-1"
            - call: "POST /land-bank/acquisition-packets/${pk2_id}/close"
