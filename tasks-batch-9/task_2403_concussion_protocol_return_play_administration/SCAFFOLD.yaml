    status: 200
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_RESOURCE_NOT_FOUND]

  - method: GET
    path: /concussion-program/injury-report-entries
    roles: [LeagueAdmin, LeagueAuditor, ClubPhysician, ClubComplianceOfficer, IndependentConsultant, UnaffiliatedObserver]
    input: ["game_id?", "player_id?", "club_id?", "status?", "designation?", "limit?", "offset?"]
    output: InjuryReportEntry[]
    status: 200
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  # ---- League operations ----------------------------------------------------
  - method: POST
    path: /concussion-program/protocol-sweeps
    roles: [LeagueAdmin]
    input: []
    output: "{ swept_at: datetime, breached_evaluation_ids: string[], auto_opened_audit_ids: string[], expired_baseline_test_ids: string[], expired_inc_clearance_ids: string[], prolonged_watch_case_ids: string[], offseason_monitoring_case_ids: string[], frozen_case_ids: string[], restored_case_ids: string[] }"
    status: 200
    side_effects:
      - "PINNED PROCESSING ORDER: (1) breach every SidelineEvaluation whose protocol_deadline_at has passed and auto-issue its ProtocolAudit findings; (2) expire BaselineTests past validity_expires_at and re-derive Player.baseline_status; (3) expire APPROVED IncClearances past expires_at; (4) advance monitoring_status (off-season programme takes precedence over the 21-day prolonged rule); (5) run club_posture_propagation for every club touched in step 1, which freezes or restores cases last"
      - "each of the entity groups above is processed in created_at ASC order so the result is deterministic"
      - "increments the version of every row it mutates by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED]
    notes: "ops-run checkpoint: the only way to advance deadline-, expiry- and calendar-driven state. It is idempotent in the sense that a second sweep at the same logical clock value mutates nothing further."

  - method: POST
    path: /_clock/set_current_utc
    roles: [LeagueAdmin]
    input: [current_utc]
    output: "{ current_utc: datetime }"
    status: 200
    side_effects:
      - "sets the logical clock that every datetime comparison and every system-stamped datetime uses"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    notes: |
      Test-driving endpoint (§1.5 priority ladder, last resort): deadline breaches, dwell windows,
      rest buffers, clearance expiry, the 21-day prolonged-symptom line, the off-season boundary and
      the injury-report window are all clock-relative and otherwise unreachable inside a test.
      MANDATORY DEFAULT: when no POST /_clock/set_current_utc has been issued, the logical clock reads
      2026-08-01T00:00:00Z. The clock may be moved forwards or backwards and is never advanced
      implicitly by other requests.

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
errors:
  - { error_id: ERR_UNAUTHENTICATED, http_status: 401, trigger: "X-User-Role or X-User-ID missing, or X-User-Role is not one of the six roles" }
  - { error_id: ERR_UNAUTHORIZED, http_status: 403, trigger: "the acting role is not listed on the endpoint (e.g. ClubPhysician calling POST /concussion-program/protocol-audits/{id}/findings)" }
  - { error_id: ERR_INVALID_REQUEST, http_status: 400, trigger: "missing required field, wrong type, unknown enum member, out-of-range integer, empty violation_codes, Clinician.club_id supplied for a non-club affiliation, Game with home_club_id == away_club_id" }
  - { error_id: ERR_ROLE_IDENTITY_MISMATCH, http_status: 403, trigger: "X-User-ID is not a Clinician, or its affiliation does not match the acting clinician role (e.g. an INDEPENDENT_CONSULTANT id sent with X-User-Role ClubPhysician)" }
  - { error_id: ERR_CLUB_SCOPE_VIOLATION, http_status: 403, trigger: "a ClubComplianceOfficer acting on another club's resource, or a ClubPhysician acting on a player or case belonging to another club" }
  - { error_id: ERR_CLUB_NOT_FOUND, http_status: 404, trigger: "unknown Club id in a path or body" }
  - { error_id: ERR_PLAYER_NOT_FOUND, http_status: 404, trigger: "unknown Player id in a path or body" }
  - { error_id: ERR_CLINICIAN_NOT_FOUND, http_status: 404, trigger: "unknown Clinician id in a path or body (including inc_clinician_id)" }
  - { error_id: ERR_GAME_NOT_FOUND, http_status: 404, trigger: "unknown Game id in a path or body" }
  - { error_id: ERR_EVALUATION_NOT_FOUND, http_status: 404, trigger: "unknown SidelineEvaluation id in a path or body" }
  - { error_id: ERR_CASE_NOT_FOUND, http_status: 404, trigger: "unknown ConcussionCase id in a path or body" }
  - { error_id: ERR_RESOURCE_NOT_FOUND, http_status: 404, trigger: "unknown BaselineTest, ReturnStep, IncClearance, ProtocolAudit or InjuryReportEntry id" }
  - { error_id: ERR_RESOURCE_STATE_INVALID, http_status: 409, trigger: "Game status does not permit the requested advance, BaselineTest is not VALID, or InjuryReportEntry is already AMENDED" }
  - { error_id: ERR_EVALUATION_STATE_INVALID, http_status: 409, trigger: "the evaluation is not in a from-state the requested action permits (e.g. diagnosing an evaluation still in INITIATED)" }
  - { error_id: ERR_CASE_STATE_INVALID, http_status: 409, trigger: "the case's case_status does not permit the action (e.g. requesting clearance while MANDATORY_REMOVAL, or granting an exemption to a CLEARED_FOR_CONTACT case)" }
  - { error_id: ERR_STEP_STATE_INVALID, http_status: 409, trigger: "evaluating a ReturnStep that is not IN_PROGRESS (also the idempotency guard for a second evaluate call)" }
  - { error_id: ERR_CLEARANCE_STATE_INVALID, http_status: 409, trigger: "deciding an IncClearance that is not PENDING (also the idempotency guard for a second decide call)" }
  - { error_id: ERR_AUDIT_STATE_INVALID, http_status: 409, trigger: "issuing findings on an audit that is neither OPEN nor CLUB_RESPONDED, responding to an audit that is not FINDINGS_ISSUED, closing a closed audit, or upholding an audit with no findings" }
  - { error_id: ERR_CLINICIAN_SUSPENDED, http_status: 409, trigger: "the acting clinician, or the referenced consultant, has status SUSPENDED; also returned when suspending an already SUSPENDED clinician" }
  - { error_id: ERR_CASE_STAGE_FROZEN, http_status: 409, trigger: "any return-to-participation write while the case is STAGE_FROZEN or the owning club is SANCTIONED" }
  - { error_id: ERR_STALE_PLAYER_VERSION, http_status: 412, trigger: "expected_player_version does not match Player.version on POST /concussion-program/baseline-tests" }
  - { error_id: ERR_STALE_CASE_VERSION, http_status: 412, trigger: "expected_case_version does not match ConcussionCase.version on POST /concussion-program/concussion-cases/{id}/inc-clearances" }
  - { error_id: ERR_MANDATORY_REMOVAL_ENFORCED, http_status: 409, trigger: "clear-to-return on an evaluation with mandatory_removal true, non-empty no_go_signs, or screen_symptom_score > 0" }
  - { error_id: ERR_SAME_GAME_RETURN_PROHIBITED, http_status: 409, trigger: "clear-to-return for a player who already has a DIAGNOSED or HELD_OUT_INCONCLUSIVE evaluation in that game" }
  - { error_id: ERR_NO_GO_SIGNS_PRESENT, http_status: 409, trigger: "concluding NO_CONCUSSION when the screen recorded at least one no-go sign" }
  - { error_id: ERR_LOCKER_ROOM_EXAM_TOO_SHORT, http_status: 409, trigger: "diagnosing or concluding fewer than 8 whole minutes after exam_started_at" }
  - { error_id: ERR_HEIGHTENED_REVIEW_CLINICIAN_REQUIRED, http_status: 403, trigger: "the diagnosing clinician signing off a stage while the case carries heightened_review_required" }
  - { error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, trigger: "the auditor who opened an audit issuing its findings, or the auditor who issued findings closing the audit" }
  - { error_id: ERR_INC_NOT_INDEPENDENT, http_status: 422, trigger: "inc_clinician_id on a final clearance request is club-affiliated, is the diagnosing clinician, or attended the case's locker-room exam" }
  - { error_id: ERR_EXAM_INC_INELIGIBLE, http_status: 422, trigger: "the locker-room exam consultant is CLUB_AFFILIATED or is the evaluating clinician" }
  - { error_id: ERR_INC_ASSIGNMENT_MISMATCH, http_status: 403, trigger: "a consultant other than clearance.inc_clinician_id calling decide" }
  - { error_id: ERR_PLAYER_CLUB_MISMATCH, http_status: 422, trigger: "the player's club is neither the home nor the away club of the referenced game" }
  - { error_id: ERR_CLINICIAN_CREDENTIAL_EXPIRED, http_status: 422, trigger: "now >= the acting clinician's or the referenced consultant's credential_expires_at" }
  - { error_id: ERR_GAME_NOT_IN_PROGRESS, http_status: 409, trigger: "initiating, screening or on-field clearing an evaluation while the game is SCHEDULED or FINAL" }
  - { error_id: ERR_INC_EXAM_WINDOW_CONFLICT, http_status: 409, trigger: "the consultant's requested 30-minute exam block touches or overlaps an existing block (closed intervals)" }
  - { error_id: ERR_STAGE_REST_BUFFER_VIOLATION, http_status: 409, trigger: "starting a stage before the previous stage's rest buffer has fully elapsed" }
  - { error_id: ERR_STAGE_DWELL_NOT_MET, http_status: 409, trigger: "passing a stage before started_at + STAGE_MIN_HOURS" }
  - { error_id: ERR_RETURN_BEFORE_EARLIEST_DATE, http_status: 409, trigger: "return-to-contact before case.earliest_return_at" }
  - { error_id: ERR_INC_CLEARANCE_EXPIRED, http_status: 409, trigger: "return-to-contact when the case's most recent clearance is EXPIRED or its expires_at has passed" }
  - { error_id: ERR_REPORT_WINDOW_NOT_OPEN, http_status: 409, trigger: "filing an injury report earlier than kickoff_at - 96h" }
  - { error_id: ERR_REPORT_WINDOW_CLOSED, http_status: 409, trigger: "filing or amending an injury report at or after kickoff_at" }
  - { error_id: ERR_STAGE_SEQUENCE_VIOLATION, http_status: 422, trigger: "stage_index != case.rtp_stage + 1 (skipping ahead or repeating a passed stage)" }
  - { error_id: ERR_STEP_ALREADY_IN_PROGRESS, http_status: 409, trigger: "starting a stage while another ReturnStep on the case is still IN_PROGRESS" }
  - { error_id: ERR_NO_RETURN_STEPS_RECORDED, http_status: 422, trigger: "requesting final clearance for a case with zero ReturnStep rows" }
  - { error_id: ERR_RTP_STAGES_INCOMPLETE, http_status: 422, trigger: "requesting or approving final clearance when any stage 1..5 lacks a PASSED, non-REVOKED step" }
  - { error_id: ERR_INC_CLEARANCE_MISSING, http_status: 409, trigger: "return-to-contact with no APPROVED clearance on the case" }
  - { error_id: ERR_BASELINE_NOT_ESTABLISHED, http_status: 422, trigger: "return-to-contact while Player.baseline_status == NONE" }
  - { error_id: ERR_BASELINE_RETEST_REQUIRED, http_status: 422, trigger: "return-to-contact while Player.baseline_status == RETEST_REQUIRED (the post-diagnosis retest is still owed)" }
  - { error_id: ERR_OPEN_CASE_EXISTS, http_status: 409, trigger: "diagnosing a player who already has a case that is not CLEARED_FOR_CONTACT" }
  - { error_id: ERR_SYMPTOM_OUTCOME_MISMATCH, http_status: 422, trigger: "outcome PASS with symptom_score >= 4, or outcome SYMPTOM_RECURRENCE with symptom_score <= 3" }
  - { error_id: ERR_INJURY_DESIGNATION_MISMATCH, http_status: 422, trigger: "the filed or amended designation differs from the recomputed required_designation" }
  - { error_id: ERR_DUPLICATE_INJURY_REPORT, http_status: 409, trigger: "a second InjuryReportEntry for the same (game_id, player_id)" }
  - { error_id: ERR_AUDIT_RESPONSE_ROUNDS_EXHAUSTED, http_status: 409, trigger: "a third club response on one audit" }
  - { error_id: ERR_EXEMPTION_ALREADY_GRANTED, http_status: 409, trigger: "requesting a roster exemption for a case whose roster_exemption_status is GRANTED or RELEASED" }
  - { error_id: ERR_UNIQUENESS_VIOLATION, http_status: 409, trigger: "duplicate Club.market_code, duplicate Clinician.license_number, or duplicate jersey_number inside one club" }
  - { error_id: ERR_NO_EXEMPTION_SLOTS, http_status: 409, trigger: "granting a roster exemption when exemption_slots_available is 0" }
  - { error_id: ERR_CLUB_FINE_CAP_EXCEEDED, http_status: 409, trigger: "issuing findings whose fine would push outstanding_fine_cents above SEASON_FINE_CAP_CENTS" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - role: LeagueAdmin
    identity: opaque
    description: "League football-operations administrator. Owns the reference data (clubs, clinicians, games), the credentialing register and the ops-run sweep."
    exclusive_operations:
      - "POST /concussion-program/clubs"
      - "POST /concussion-program/clinicians"
      - "POST /concussion-program/games"
      - "POST /concussion-program/games/{id}/advance-status"
      - "POST /concussion-program/clinicians/{id}/suspend"
      - "POST /concussion-program/baseline-tests/{id}/invalidate"
      - "POST /concussion-program/protocol-sweeps"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /concussion-program/players (shared with ClubComplianceOfficer)"
      - "every GET endpoint"

  - role: ClubPhysician
    identity: "entity_backed:Clinician"
    description: "Club-affiliated physician. X-User-ID must be a Clinician with affiliation CLUB_AFFILIATED, and that clinician's club_id scopes every write to their own club's players and cases."
    exclusive_operations:
      - "POST /concussion-program/baseline-tests"
      - "POST /concussion-program/sideline-evaluations/{id}/screen"
      - "POST /concussion-program/sideline-evaluations/{id}/locker-room-exam"
      - "POST /concussion-program/sideline-evaluations/{id}/diagnose-concussion"
      - "POST /concussion-program/sideline-evaluations/{id}/conclude-no-concussion"
      - "POST /concussion-program/sideline-evaluations/{id}/clear-to-return"
      - "POST /concussion-program/concussion-cases/{id}/return-steps"
      - "POST /concussion-program/return-steps/{id}/evaluate"
      - "POST /concussion-program/concussion-cases/{id}/inc-clearances"
      - "POST /concussion-program/concussion-cases/{id}/return-to-contact"
      - "POST /concussion-program/concussion-cases/{id}/symptom-check"
    shared_operations:
      - "POST /concussion-program/sideline-evaluations (shared with UnaffiliatedObserver)"
      - "every GET endpoint except GET /concussion-program/clubs/{id}/compliance-summary"

  - role: UnaffiliatedObserver
    identity: "entity_backed:Clinician"
    description: "League-appointed unaffiliated neurotrauma observer. Holds removal authority: the observer may initiate an evaluation for any player in the game, and only the observer may pass trigger_source = UNAFFILIATED_OBSERVER, which sets mandatory_removal and makes on-field clearance impossible. The observer performs no screens, no diagnoses and no clearances."
    exclusive_operations:
      - "POST /concussion-program/sideline-evaluations with trigger_source = UNAFFILIATED_OBSERVER (mandatory-removal authority; no other role may pass that trigger_source)"
    shared_operations:
      - "POST /concussion-program/sideline-evaluations (shared with ClubPhysician, for the non-observer trigger sources)"
      - "may also be assigned as the locker-room examination consultant on POST /concussion-program/sideline-evaluations/{id}/locker-room-exam, but is never the caller of that endpoint"
      - "every GET endpoint except GET /concussion-program/clubs/{id}/compliance-summary"

  - role: IndependentConsultant
    identity: "entity_backed:Clinician"
    description: "Independent neurological consultant. X-User-ID must be a Clinician with affiliation INDEPENDENT_CONSULTANT and club_id null. The consultant is the sole gate on return to contact."
    exclusive_operations:
      - "POST /concussion-program/inc-clearances/{id}/decide (and only for clearances assigned to that consultant)"
    shared_operations:
      - "every GET endpoint except GET /concussion-program/clubs/{id}/compliance-summary"

  - role: ClubComplianceOfficer
    identity: "entity_backed:Club"
    description: "Club compliance officer. X-User-ID is the club's own id, so every write is implicitly scoped to that club."
    exclusive_operations:
      - "POST /concussion-program/concussion-cases/{id}/roster-exemption"
      - "POST /concussion-program/injury-report-entries"
      - "POST /concussion-program/injury-report-entries/{id}/amend"
      - "POST /concussion-program/protocol-audits/{id}/respond"
    shared_operations:
      - "POST /concussion-program/players (shared with LeagueAdmin, own club only)"
      - "every GET endpoint including GET /concussion-program/clubs/{id}/compliance-summary for its own club"

  - role: LeagueAuditor
    identity: opaque
    description: "League compliance auditor. Opens, prices and closes protocol audits. Segregation of duties splits the three steps across distinct auditor user ids."
    exclusive_operations:
      - "POST /concussion-program/protocol-audits"
      - "POST /concussion-program/protocol-audits/{id}/findings"
      - "POST /concussion-program/protocol-audits/{id}/close"
    shared_operations:
      - "every GET endpoint including GET /concussion-program/clubs/{id}/compliance-summary"
