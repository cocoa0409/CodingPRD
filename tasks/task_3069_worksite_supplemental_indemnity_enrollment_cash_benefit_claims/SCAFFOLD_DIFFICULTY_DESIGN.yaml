  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: campaign_open_wrong_state_vs_counselor_inactive
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.EnrollmentCampaign.DRAFT_to_OPEN
          - errors[ERR_INVALID_STATE]
          - errors[ERR_COUNSELOR_INACTIVE]
        distinguishing_aspect: |
          Error-category pair state (priority 5) vs business_safety (priority 6):
          opening a campaign that is already LOCKED (not DRAFT) AND whose counselor
          is not ACTIVE must surface ERR_INVALID_STATE, not ERR_COUNSELOR_INACTIVE,
          because state preconditions outrank compliance gates.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group G9 ACTIVE (0/0.0, DAILY); counselor C9 created ACTIVE but treated as suspended for this probe (the probe relies on the role-level fact that campaign open checks counselor status = ACTIVE; a counselor whose status is not ACTIVE is simulated by attempting open with a campaign whose counselor never satisfies the gate — see trigger)."
            - "Campaign CAM9 created and advanced: OPEN once (counselor ACTIVE at that time), then clock to 2026-09-10, then LOCKED (clock >= window_end 2026-09-10)."
            - "Now CAM9 is LOCKED; a second open attempt violates the DRAFT->OPEN state machine. The counselor gate would also fail if it were reached."
          setup_api_calls:
