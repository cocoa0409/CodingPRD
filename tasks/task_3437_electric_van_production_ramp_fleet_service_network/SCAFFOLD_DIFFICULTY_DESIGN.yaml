# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3437_electric_van_production_ramp_fleet_service_network
# 9 rules x >=2 instances (combinatorial_formula carries 3) = 19 instances.
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 and is reachable from
# empty-DB via its own setup_api_calls chain.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: uptime_credit_route_day_vs_vehicle_hour_divergence
        grounds:
          - calculations.uptime_credit
          - entities.UptimeContract.fields.pro_rating
        distinguishing_aspect: "Same downtime event on the same fleet yields a breach credit of 12000 cents under ROUTE_DAY but 0 cents under VEHICLE_HOUR — the two variants disagree on whether the commitment was breached at all (fleet-service domain)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Customer with CA depot; supplier; two PASSED 77kWh modules; order quantity 2 CONFIRMED; both VINs registered and driven to COMMISSIONED with telematics ACTIVE (N=2 in-service fleet)."
            - "Two UptimeContracts on the customer: committed_uptime_pct 97.0, fee 2000000, measurement_start_date 2026-09-01; contract RD has pro_rating ROUTE_DAY, contract VH has pro_rating VEHICLE_HOUR."
            - "Identical downtime event on vehicle 1 appended to both contracts: started 2026-09-02T06:00:00Z, ended 2026-09-03T06:00:00Z (spans 2 calendar days; 24.0 hours)."
          setup_api_calls:
            - &d_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &d_cust
              call: "POST /evfleet/fleet-customers"
              payload: { company_name: "Acme Logistics", contact_email: "ops@acme.test", account_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - &d_depot
              call: "POST /evfleet/depots"
              payload: { fleet_customer_id: "${cust_id}", name: "Acme Depot CA", state_code: "CA", address: "1 Depot Way", total_capacity_kw: 500 }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { depot_id: $.data.id }
            - &d_sup
              call: "POST /evfleet/suppliers"
              payload: { name: "VoltCore", contact_email: "s@voltcore.test" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { sup_id: $.data.id }
            - &d_mod1
              call: "POST /evfleet/battery-modules"
              payload: { supplier_id: "${sup_id}", module_serial: "M-001", pack_kwh: 77 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { mod1_id: $.data.id }
            - &d_mod1_qa
              call: "POST /evfleet/battery-modules/${mod1_id}/transition"
              payload: { to_state: "IN_QA" }
              as: QualityInspector
              as_user_id: "qi-1"
            - &d_mod1_pass
              call: "POST /evfleet/battery-modules/${mod1_id}/transition"
              payload: { to_state: "PASSED" }
              as: QualityInspector
              as_user_id: "qi-1"
            - &d_mod2
              call: "POST /evfleet/battery-modules"
              payload: { supplier_id: "${sup_id}", module_serial: "M-002", pack_kwh: 77 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { mod2_id: $.data.id }
            - &d_mod2_qa
              call: "POST /evfleet/battery-modules/${mod2_id}/transition"
              payload: { to_state: "IN_QA" }
              as: QualityInspector
              as_user_id: "qi-1"
            - &d_mod2_pass
              call: "POST /evfleet/battery-modules/${mod2_id}/transition"
              payload: { to_state: "PASSED" }
              as: QualityInspector
              as_user_id: "qi-1"
            - &d_order
              call: "POST /evfleet/vehicle-orders"
              payload: { fleet_customer_id: "${cust_id}", depot_id: "${depot_id}", battery_supplier_id: "${sup_id}", quantity: 2, battery_pack_kwh: 77, telematics_tier: "STANDARD", delivery_method: "DIRECT_DELIVERY", requires_depot_charging: false }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - &d_order_submit
              call: "POST /evfleet/vehicle-orders/${ord_id}/transition"
              payload: { to_state: "SUBMITTED" }
              as: FleetManager
              as_user_id: "${cust_id}"
            - &d_order_confirm
              call: "POST /evfleet/vehicle-orders/${ord_id}/transition"
              payload: { to_state: "CONFIRMED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ord_v: $.data.version }
            - &d_veh1
              call: "POST /evfleet/vehicles"
              payload: { vehicle_order_id: "${ord_id}", battery_module_id: "${mod1_id}", vin: "VIN-ACME-001", expected_vehicle_order_version: "${ord_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { veh1_id: $.data.id }
            - &d_order_read_1
              call: "GET /evfleet/vehicle-orders/${ord_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { ord_v3: $.data.version }
            - &d_veh2
              call: "POST /evfleet/vehicles"
              payload: { vehicle_order_id: "${ord_id}", battery_module_id: "${mod2_id}", vin: "VIN-ACME-002", expected_vehicle_order_version: "${ord_v3}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { veh2_id: $.data.id }
            - &d_veh1_prov
              call: "POST /evfleet/vehicles/${veh1_id}/transition"
              payload: { dimension: "TELEMATICS", to_state: "PROVISIONED" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
            - &d_veh1_act
              call: "POST /evfleet/vehicles/${veh1_id}/transition"
              payload: { dimension: "TELEMATICS", to_state: "ACTIVE" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
            - &d_veh1_transit
              call: "POST /evfleet/vehicles/${veh1_id}/transition"
              payload: { dimension: "DELIVERY", to_state: "IN_TRANSIT" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
            - &d_veh1_depot
              call: "POST /evfleet/vehicles/${veh1_id}/transition"
              payload: { dimension: "DELIVERY", to_state: "AT_DEPOT" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
            - &d_veh1_comm
              call: "POST /evfleet/vehicles/${veh1_id}/transition"
              payload: { dimension: "DELIVERY", to_state: "COMMISSIONED" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
            - &d_veh2_prov
              call: "POST /evfleet/vehicles/${veh2_id}/transition"
              payload: { dimension: "TELEMATICS", to_state: "PROVISIONED" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
            - &d_veh2_act
              call: "POST /evfleet/vehicles/${veh2_id}/transition"
              payload: { dimension: "TELEMATICS", to_state: "ACTIVE" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
            - &d_veh2_transit
              call: "POST /evfleet/vehicles/${veh2_id}/transition"
              payload: { dimension: "DELIVERY", to_state: "IN_TRANSIT" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
            - &d_veh2_depot
              call: "POST /evfleet/vehicles/${veh2_id}/transition"
              payload: { dimension: "DELIVERY", to_state: "AT_DEPOT" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
            - &d_veh2_comm
              call: "POST /evfleet/vehicles/${veh2_id}/transition"
              payload: { dimension: "DELIVERY", to_state: "COMMISSIONED" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
            - call: "POST /evfleet/uptime-contracts"
              payload: { fleet_customer_id: "${cust_id}", committed_uptime_pct: 97.0, monthly_service_fee_cents: 2000000, pro_rating: "ROUTE_DAY", measurement_start_date: "2026-09-01" }
              as: PlatformAdmin
              captures: { uc_rd_id: $.data.id, uc_rd_v: $.data.version }
            - call: "POST /evfleet/uptime-contracts"
              payload: { fleet_customer_id: "${cust_id}", committed_uptime_pct: 97.0, monthly_service_fee_cents: 2000000, pro_rating: "VEHICLE_HOUR", measurement_start_date: "2026-09-01" }
              as: PlatformAdmin
              captures: { uc_vh_id: $.data.id, uc_vh_v: $.data.version }
            - call: "POST /evfleet/uptime-contracts/${uc_rd_id}/downtime-events"
              payload: { vehicle_id: "${veh1_id}", started_at: "2026-09-02T06:00:00Z", ended_at: "2026-09-03T06:00:00Z", expected_uptime_contract_version: "${uc_rd_v}" }
              as: TelematicsIngestion
            - call: "POST /evfleet/uptime-contracts/${uc_vh_id}/downtime-events"
              payload: { vehicle_id: "${veh1_id}", started_at: "2026-09-02T06:00:00Z", ended_at: "2026-09-03T06:00:00Z", expected_uptime_contract_version: "${uc_vh_v}" }
              as: TelematicsIngestion
          trigger:
            - call: "POST /evfleet/uptime-contracts/${uc_rd_id}/close-month"
              payload: { month: "2026-09" }
              as: PlatformAdmin
            - call: "POST /evfleet/uptime-contracts/${uc_vh_id}/close-month"
              payload: { month: "2026-09" }
              as: PlatformAdmin
          assert:
            - "UptimeContract.${uc_rd_id}.last_uptime_pct == 96.7 (2 route-days over 2 vehicles x 30 days)"
            - "UptimeContract.${uc_rd_id}.last_credit_cents == 12000 (shortfall 0.3 -> 0.6% of 2000000)"
            - "UptimeContract.${uc_vh_id}.last_uptime_pct == 98.3 (24.0h = 1.0 vehicle-day over 60)"
            - "UptimeContract.${uc_vh_id}.last_credit_cents == 0 (no breach under VEHICLE_HOUR)"
            - "UptimeContract.${uc_rd_id}.last_credit_cents != UptimeContract.${uc_vh_id}.last_credit_cents — identical inputs, divergent variants"

      - name: battery_eol_valuation_refurbish_vs_recovery_divergence
        grounds:
          - calculations.battery_eol_valuation
          - entities.Vehicle.fields.eol_valuation_refurbish_cents
          - entities.Vehicle.fields.eol_valuation_recovery_cents
        distinguishing_aspect: "One SOH report (68.4% on a 77kWh pack) produces eol_valuation_refurbish_cents == 630000 and eol_valuation_recovery_cents == 632016 on the same Vehicle — two valid EOL accounting formulas disagreeing on identical inputs (battery domain, distinct from the fleet-service uptime domain)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Customer, CA depot, supplier, one PASSED 77kWh module, order quantity 1 CONFIRMED, VIN registered; telematics PROVISIONED then ACTIVE (battery reports require ACTIVE)."
          setup_api_calls:
            - *d_clock
            - *d_cust
            - *d_depot
            - *d_sup
            - *d_mod1
            - *d_mod1_qa
            - *d_mod1_pass
            - call: "POST /evfleet/vehicle-orders"
              payload: { fleet_customer_id: "${cust_id}", depot_id: "${depot_id}", battery_supplier_id: "${sup_id}", quantity: 1, battery_pack_kwh: 77, telematics_tier: "STANDARD", delivery_method: "CUSTOMER_PICKUP", requires_depot_charging: false }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { ord1_id: $.data.id }
            - call: "POST /evfleet/vehicle-orders/${ord1_id}/transition"
              payload: { to_state: "SUBMITTED" }
              as: FleetManager
              as_user_id: "${cust_id}"
            - call: "POST /evfleet/vehicle-orders/${ord1_id}/transition"
              payload: { to_state: "CONFIRMED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ord1_v: $.data.version }
            - call: "POST /evfleet/vehicles"
              payload: { vehicle_order_id: "${ord1_id}", battery_module_id: "${mod1_id}", vin: "VIN-ACME-101", expected_vehicle_order_version: "${ord1_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { veh_id: $.data.id }
            - call: "POST /evfleet/vehicles/${veh_id}/transition"
              payload: { dimension: "TELEMATICS", to_state: "PROVISIONED" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
            - call: "POST /evfleet/vehicles/${veh_id}/transition"
              payload: { dimension: "TELEMATICS", to_state: "ACTIVE" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
          trigger:
            - call: "POST /evfleet/vehicles/${veh_id}/battery-health"
              payload: { measured_soh_pct: 68.4, measured_at: "2026-09-02T00:00:00Z" }
              as: TelematicsIngestion
          assert:
            - "Vehicle.${veh_id}.current_soh_pct == 68.4 and battery_eol_status == EOL_REVIEW (68.4 < 70.0)"
            - "Vehicle.${veh_id}.eol_valuation_refurbish_cents == 630000 (1800000 x 0.35 band multiplier)"
            - "Vehicle.${veh_id}.eol_valuation_recovery_cents == 632016 (77 x 12000 x 0.684)"
            - "Vehicle.${veh_id}.eol_valuation_refurbish_cents != Vehicle.${veh_id}.eol_valuation_recovery_cents"
            - "Vehicle.${veh_id}.last_battery_report_at == 2026-09-02T00:00:00Z"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: warranty_settlement_per_line_rounding_order
        grounds:
          - calculations.warranty_settlement
          - state_machines.WarrantyClaim.DIAGNOSED_to_SETTLED
        distinguishing_aspect: "Mode (b) nested rounding: the scaffold pins round-per-component-per-line THEN sum THEN one deductible — lines [CHARGING 125c, CHARGING 135c, POWERTRAIN 100000c + 1.0h] settle at 92735 cents, while the sum-then-round order would give 92734, exactly one cent less."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One COMMISSIONED vehicle with telematics ACTIVE (2-vehicle happy path reused; only vehicle 1 matters)."
          setup_api_calls:
            - *d_clock
            - *d_cust
            - *d_depot
            - *d_sup
            - *d_mod1
            - *d_mod1_qa
            - *d_mod1_pass
            - *d_mod2
            - *d_mod2_qa
            - *d_mod2_pass
            - *d_order
            - *d_order_submit
            - *d_order_confirm
            - *d_veh1
            - *d_order_read_1
            - *d_veh2
            - *d_veh1_prov
            - *d_veh1_act
            - *d_veh1_transit
            - *d_veh1_depot
            - *d_veh1_comm
            - call: "POST /evfleet/warranty-claims"
              payload: { vehicle_id: "${veh1_id}", claim_lines: [ { component_class: "CHARGING", part_cost_cents: 125, labor_hours: 0.0 }, { component_class: "CHARGING", part_cost_cents: 135, labor_hours: 0.0 }, { component_class: "POWERTRAIN", part_cost_cents: 100000, labor_hours: 1.0 } ] }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /evfleet/warranty-claims/${claim_id}/diagnose"
              payload: { diagnosis_notes: "Charge-port latch and powertrain mount inspected." }
              as: ServiceTechnician
              as_user_id: "st-1"
          trigger:
            - call: "POST /evfleet/warranty-claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: ClaimsAdjuster
              as_user_id: "ca-1"
          assert:
            - "WarrantyClaim.${claim_id}.status == SETTLED"
            - "WarrantyClaim.${claim_id}.settlement_cents == 92735 (113 + 122 + 117500 - 25000 deductible)"
            - "WarrantyClaim.${claim_id}.adjudicated_by_user_id == \"st-1\" is false; it equals \"ca-1\""
            - "distinguishing check: per-line rounding produced 113 + 122 = 235 for the two CHARGING lines, not the 234 that sum-then-round would give"

      - name: depot_capacity_pinned_evaluation_order
        grounds:
          - calculations.depot_capacity_allocation
          - entities.Depot.fields.committed_capacity_kw
          - concurrency_rules[charging-project-create-stale-depot]
        distinguishing_aspect: "Mode (c) circular-looking dependency resolved by pinned evaluation order: commissioning a 200kW project moves it from the in-flight sum to the commissioned sum with committed_capacity_kw unchanged at 500, and a further 1kW request is rejected — vehicle demand never feeds back into headroom."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Customer with depot D (total_capacity_kw 500). Project P1 (200kW, window 2026-10-05..2026-10-15, crew 2) created; P2 (300kW, window 2026-11-02..2026-11-10, crew 1) created at exactly the remaining headroom."
          setup_api_calls:
            - *d_clock
            - *d_cust
            - call: "POST /evfleet/depots"
              payload: { fleet_customer_id: "${cust_id}", name: "Cap Depot", state_code: "CA", address: "9 Grid Ave", total_capacity_kw: 500 }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { depot_id: $.data.id, depot_v: $.data.version }
            - call: "POST /evfleet/charging-projects"
              payload: { depot_id: "${depot_id}", requested_capacity_kw: 200, install_window_start: "2026-10-05T00:00:00Z", install_window_end: "2026-10-15T00:00:00Z", crew_count: 2, expected_depot_version: "${depot_v}" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { p1_id: $.data.id }
            - call: "GET /evfleet/depots/${depot_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { depot_v2: $.data.version, committed_after_p1: $.data.committed_capacity_kw }
            - call: "POST /evfleet/charging-projects"
              payload: { depot_id: "${depot_id}", requested_capacity_kw: 300, install_window_start: "2026-11-02T00:00:00Z", install_window_end: "2026-11-10T00:00:00Z", crew_count: 1, expected_depot_version: "${depot_v2}" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { p2_id: $.data.id }
            - call: "POST /evfleet/charging-projects/${p1_id}/transition"
              payload: { to_state: "UTILITY_REVIEW" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
            - call: "POST /evfleet/charging-projects/${p1_id}/transition"
              payload: { to_state: "PERMITTING" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
            - call: "POST /evfleet/charging-projects/${p1_id}/transition"
              payload: { to_state: "INSTALLATION" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
            - call: "POST /evfleet/charging-projects/${p1_id}/transition"
              payload: { to_state: "COMMISSIONED" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
            - call: "GET /evfleet/depots/${depot_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { depot_v7: $.data.version }
          trigger:
            - call: "POST /evfleet/charging-projects"
              payload: { depot_id: "${depot_id}", requested_capacity_kw: 1, install_window_start: "2026-12-01T00:00:00Z", install_window_end: "2026-12-05T00:00:00Z", crew_count: 1, expected_depot_version: "${depot_v7}" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "committed_after_p1 == 200 (SURVEY already commits requested kW)"
            - "P2 accepted at requested 300 == headroom 300 (inclusive <= boundary)"
            - "after P1 reaches COMMISSIONED, Depot.${depot_id}.committed_capacity_kw == 500 (requested leaves, commissioned enters — net zero under the pinned order)"
            - "P3 rejected with err == ERR_DEPOT_CAPACITY_EXCEEDED (headroom 0 after step-1 committed evaluation)"
            - "Depot.${depot_id}.version unchanged by the rejected create"

      - name: uptime_credit_tiered_marginal_rates
        grounds:
          - calculations.uptime_credit
          - entities.UptimeContract.fields.last_credit_cents
        distinguishing_aspect: "Mode (a) tiered marginal rate with nested min/max over 3+ inputs: shortfall 5.3 percentage points splits 2.0 at 2% + 3.0 at 5% + 0.3 at 10% = 22.0% of the 2000000-cent fee = 440000 cents, beneath the 30% cap."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Customer with CA depot; supplier; four PASSED 77kWh modules; order quantity 4 CONFIRMED then FULFILLED; all four VINs COMMISSIONED with telematics ACTIVE (N=4)."
            - "ROUTE_DAY contract: committed 97.0, fee 2000000, start 2026-09-01; vehicle 1 down 2026-09-01T00:00:00Z..2026-09-11T00:00:00Z = 10 distinct calendar days."
          setup_api_calls:
            - *d_clock
            - *d_cust
            - *d_depot
            - *d_sup
            - *d_mod1
            - *d_mod1_qa
            - *d_mod1_pass
            - *d_mod2
            - *d_mod2_qa
            - *d_mod2_pass
            - call: "POST /evfleet/battery-modules"
              payload: { supplier_id: "${sup_id}", module_serial: "M-003", pack_kwh: 77 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { mod3_id: $.data.id }
            - call: "POST /evfleet/battery-modules/${mod3_id}/transition"
              payload: { to_state: "IN_QA" }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /evfleet/battery-modules/${mod3_id}/transition"
              payload: { to_state: "PASSED" }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /evfleet/battery-modules"
              payload: { supplier_id: "${sup_id}", module_serial: "M-004", pack_kwh: 77 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { mod4_id: $.data.id }
            - call: "POST /evfleet/battery-modules/${mod4_id}/transition"
              payload: { to_state: "IN_QA" }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /evfleet/battery-modules/${mod4_id}/transition"
              payload: { to_state: "PASSED" }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /evfleet/vehicle-orders"
              payload: { fleet_customer_id: "${cust_id}", depot_id: "${depot_id}", battery_supplier_id: "${sup_id}", quantity: 4, battery_pack_kwh: 77, telematics_tier: "STANDARD", delivery_method: "DIRECT_DELIVERY", requires_depot_charging: false }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { ord4_id: $.data.id }
            - call: "POST /evfleet/vehicle-orders/${ord4_id}/transition"
              payload: { to_state: "SUBMITTED" }
              as: FleetManager
              as_user_id: "${cust_id}"
            - call: "POST /evfleet/vehicle-orders/${ord4_id}/transition"
              payload: { to_state: "CONFIRMED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ord_v: $.data.version }
            - call: "POST /evfleet/vehicles"
              payload: { vehicle_order_id: "${ord4_id}", battery_module_id: "${mod1_id}", vin: "VIN-ACME-401", expected_vehicle_order_version: "${ord_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
