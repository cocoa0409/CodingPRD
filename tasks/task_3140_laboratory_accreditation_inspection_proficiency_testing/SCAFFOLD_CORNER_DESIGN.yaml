              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /pt-shipments"
              payload: { subscription_id: "${sub_id}", event_code: "C-2026-A" }
              as: PTCoordinator
              captures: { sh1: $.data.id }
          trigger:
            - call: "POST /pt-results"
              payload: { shipment_id: "${sh1}", collected_at: "2026-09-06T00:00:01Z", analyte_scores: [{ name: "glucose", score: 95 }] }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
