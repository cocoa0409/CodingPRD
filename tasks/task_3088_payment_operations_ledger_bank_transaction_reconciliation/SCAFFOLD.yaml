  side_effects:
  - Counterparty.status = CLOSED
  - 'AuditEvent appended: action=counterparty.closed'
- method: POST
  path: /counterparty-relationships
  description: Request an account-sharing or rail-agreement relationship between two institutions
  roles:
  - PaymentApprover
  - PaymentInitiator
  - PlatformAdmin
  code: 201
  input:
  - legal_entity_id
  - partner_legal_entity_id
  - purpose
  - account_data_sharing?
  output: CounterpartyRelationship
  side_effects:
  - status initialised to PENDING
  - 'AuditEvent appended: action=counterparty_relationship.created'
- method: GET
  path: /counterparty-relationships/{id}
  description: Read one counterparty relationship
  roles:
  - PlatformAdmin
  - LedgerController
  - PaymentOpsAnalyst
