      - name: an_adverse_opinion_cascades_through_every_dependent_row
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - endpoints.POST /epr/verification-engagements/{id}/issue-opinion.side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / adverse_opinion_six_hop_cascade
          rationale: "That instance walks all six hops end to end with exact before/after values on every touched row."

      - name: both_fee_variants_produce_their_own_result_and_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.report_fee_assessment.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / report_fee_variant_divergence_provisional_vs_final
          rationale: "That instance asserts both variants' tier bases and subtotals plus the reconciliation delta on the switch."

      - name: tier_thresholds_are_tested_at_their_exact_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.report_fee_assessment.formula
        excluded_because:
          difficulty_instance: boundary_precision_check / tier_basis_exactly_at_band_minimum_selects_upper_band
          rationale: "That instance sits one thousandth below, exactly on and above tier_min_kg with pre-computed cent literals."

      - name: the_tonnage_ledger_is_reconciled_after_every_source_change
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.reported_weight_ytd_rollup
        excluded_because:
          difficulty_instance: compensating_invariant / correction_cycle_restores_reported_weight_ytd
          rationale: "That instance drives the ledger through submit, correction and resubmit and asserts the conserved value at each step."

  - section: consistency_model
    instances:
      - name: every_derived_field_is_visible_on_the_first_read_after_the_write
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope.success
        distinguishing_aspect: "The mutating responses themselves already carry the recomputed derived values — the submit response shows verification_required and the invoice response shows total_cents — and the immediately following reads of the registration and producer show the same numbers with no lag or retry."
