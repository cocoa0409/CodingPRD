        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[nomination-create-stale-contract]", "validations[priority=70]", "errors[ERR_STALE_CONTRACT_VERSION]", "entities.OfftakeContract.fields.version"]
        distinguishing_aspect: "Two strictly sequential creates: the first carries the contract version the client read and succeeds (advancing OfftakeContract.version by 1), the second still carries the old value and is refused with 412 ERR_STALE_CONTRACT_VERSION; re-reading the contract and retrying with the fresh version then succeeds."
        test_recipe:
          setup: ["One LandfillSite, one ProcessingPlant with a 200.0 dth/hour receipt-point cap, and one ACTIVE OfftakeContract whose version the client has read."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /plants"
              payload: { site_id: "${site_id}", plant_code: "P1", receipt_point_code: "RP-7", receipt_point_mdq_dth_per_day: 4800.0, min_feed_scfm: 900.0 }
              as: ProjectAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /offtake-contracts"
              payload: { site_id: "${site_id}", counterparty_name: "Bluewater Energy", contract_mdq_dth_per_day: 3000.0, price_usd_per_dth: 5.25, term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: CommercialScheduler
              captures: { contract_id: $.data.id }
            - call: "POST /offtake-contracts/${contract_id}/status"
              payload: { to_status: "ACTIVE" }
              as: CommercialScheduler
            - call: "GET /offtake-contracts/${contract_id}"
              as: CommercialScheduler
              captures: { ctr_v_read: $.data.version }
          trigger:
            - call: "POST /pipeline-nominations"
              payload: { contract_id: "${contract_id}", plant_id: "${plant_id}", gas_day_start: "2026-08-11T00:00:00Z", gas_day_end: "2026-08-12T00:00:00Z", nominated_dth: 2400.0, expected_contract_version: "${ctr_v_read}" }
              as: CommercialScheduler
              captures: { n1_id: $.data.id }
            - call: "POST /pipeline-nominations"
              payload: { contract_id: "${contract_id}", plant_id: "${plant_id}", gas_day_start: "2026-08-13T00:00:00Z", gas_day_end: "2026-08-14T00:00:00Z", nominated_dth: 2400.0, expected_contract_version: "${ctr_v_read}" }
              as: CommercialScheduler
              captures: { err_id: $.data.error_id }
            - call: "GET /offtake-contracts/${contract_id}"
