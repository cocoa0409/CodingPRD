              payload: {}
              as: TitleClerk
              captures: { tr_status: $.data.status }
          assert:
            - "TitleRegistration.${tr_id}.status == SUBMITTED (Deal is FUNDED so the cross-entity gate passes)"

      - name: cross_entity_deal_contract_requires_vehicle_on_deal
        grounds:
          - state_machines.Deal.DRAFT_to_DESKING
          - validations[priority=9]
          - state_machines.Vehicle.ON_DEAL_to_SOLD
        distinguishing_aspect: |
          Different entity pair Deal -> Vehicle: a deal's first desk transition (DRAFT -> DESKING, which
          must reserve the vehicle) is rejected when the Vehicle is not AVAILABLE. Here Vehicle V is SOLD
          (it was funded on an earlier deal D_A), so a later deal D_B referencing V fails its desk with
          ERR_VEHICLE_NOT_AVAILABLE. (Distinct entity pair from TitleRegistration->Deal.)
        test_recipe:
          setup:
            - "Vehicle V reserved by deal D_A (APPROVED with contract+stips), and a second deal D_B also references V but is created later; D_A is funded first which sets V to SOLD; D_B then attempts contract."
