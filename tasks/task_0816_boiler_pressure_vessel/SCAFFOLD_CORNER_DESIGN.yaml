# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (breadth probe)
# Enumerative coverage of testable claims not already carried by §1.8, plus
# excluded_because stubs for corners §1.8 already exercises. Every non-stub
# instance carries an executable setup_api_calls chain and literal asserts.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_vessel_returns_201_with_fields
        claim_type: creation
        grounds: [entities.Vessel, endpoints]
        distinguishing_aspect: "POST /vessels with all required fields returns 201 with vessel_class echoed and system-set registration_status DRAFT, service_status NOT_IN_SERVICE, jurisdiction_number null."
        test_recipe:
          setup: ["A jurisdiction and an owner exist."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /owners"
              payload: { name: "Acme", contact_email: "o@x.com" }
              as: JurisdictionAdmin
              captures: { owner: "$.data.id" }
          trigger:
            - call: "POST /vessels"
              payload: { owner_id: "${owner}", jurisdiction_id: "${jur}", manufacturer: "M", national_board_number: "NBV-1", vessel_class: "POWER_BOILER", mawp_psig: 120, installed_at: "2020-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${owner}"
              captures: { vessel: "$.data.id" }
          assert:
            - "Vessel.${vessel}.vessel_class == POWER_BOILER"
            - "Vessel.${vessel}.registration_status == DRAFT"
            - "Vessel.${vessel}.service_status == NOT_IN_SERVICE"
            - "Vessel.${vessel}.jurisdiction_number == null"

      - name: get_vessel_nonexistent_returns_not_found
        claim_type: not_found
        grounds: [entities.Vessel, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /vessels/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty registry (a jurisdiction exists to make setup non-trivial)."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
          trigger:
            - call: "GET /vessels/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: JurisdictionAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: create_vessel_missing_vessel_class_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Vessel, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required vessel_class field on POST /vessels returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A jurisdiction and owner exist."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /owners"
              payload: { name: "Acme", contact_email: "o@x.com" }
              as: JurisdictionAdmin
              captures: { owner: "$.data.id" }
          trigger:
            - call: "POST /vessels"
              payload: { owner_id: "${owner}", jurisdiction_id: "${jur}", manufacturer: "M", national_board_number: "NBV-1", mawp_psig: 120, installed_at: "2020-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${owner}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_vessel_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Vessel, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A vessel_class value outside {POWER_BOILER, HEATING_BOILER, PRESSURE_VESSEL} on POST /vessels returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A jurisdiction and owner exist."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /owners"
              payload: { name: "Acme", contact_email: "o@x.com" }
              as: JurisdictionAdmin
              captures: { owner: "$.data.id" }
          trigger:
            - call: "POST /vessels"
              payload: { owner_id: "${owner}", jurisdiction_id: "${jur}", manufacturer: "M", national_board_number: "NBV-1", vessel_class: "STEAM_DRUM", mawp_psig: 120, installed_at: "2020-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${owner}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: jurisdiction_default_admin_fee_pct_applied
        claim_type: defaults
        grounds: [entities.Jurisdiction.fields.admin_fee_pct]
        distinguishing_aspect: "Creating a jurisdiction without admin_fee_pct applies the default 0.075."
        test_recipe:
          setup: ["None."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
              captures: { jur: "$.data.id" }
          trigger:
            - call: "GET /jurisdictions/${jur}"
              payload: {}
              as: JurisdictionAdmin
          assert:
            - "Jurisdiction.${jur}.admin_fee_pct == 0.075"

      - name: duplicate_national_board_number_returns_duplicate
        claim_type: type_constraints
        grounds: [entities.Vessel.fields.national_board_number, "errors[ERR_DUPLICATE_UNIQUE_FIELD]"]
        distinguishing_aspect: "A second vessel reusing an existing national_board_number returns ERR_DUPLICATE_UNIQUE_FIELD (409)."
        test_recipe:
          setup: ["A vessel with national_board_number NBV-1 already exists."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /owners"
              payload: { name: "Acme", contact_email: "o@x.com" }
              as: JurisdictionAdmin
              captures: { owner: "$.data.id" }
            - call: "POST /vessels"
              payload: { owner_id: "${owner}", jurisdiction_id: "${jur}", manufacturer: "M", national_board_number: "NBV-1", vessel_class: "POWER_BOILER", mawp_psig: 120, installed_at: "2020-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${owner}"
              captures: { vessel1: "$.data.id" }
          trigger:
            - call: "POST /vessels"
              payload: { owner_id: "${owner}", jurisdiction_id: "${jur}", manufacturer: "M2", national_board_number: "NBV-1", vessel_class: "HEATING_BOILER", mawp_psig: 30, installed_at: "2021-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${owner}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_DUPLICATE_UNIQUE_FIELD"

      - name: list_vessels_pagination_envelope
        claim_type: listing
        grounds: [entities.Vessel, endpoints]
        distinguishing_aspect: "GET /vessels returns a paginated array with total_count == 2 and has_more == false after two vessels are created."
        test_recipe:
          setup: ["Two vessels created for one owner."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /owners"
              payload: { name: "Acme", contact_email: "o@x.com" }
              as: JurisdictionAdmin
              captures: { owner: "$.data.id" }
            - call: "POST /vessels"
              payload: { owner_id: "${owner}", jurisdiction_id: "${jur}", manufacturer: "M", national_board_number: "NBV-1", vessel_class: "POWER_BOILER", mawp_psig: 120, installed_at: "2020-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${owner}"
            - call: "POST /vessels"
              payload: { owner_id: "${owner}", jurisdiction_id: "${jur}", manufacturer: "M", national_board_number: "NBV-2", vessel_class: "PRESSURE_VESSEL", mawp_psig: 300, installed_at: "2020-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${owner}"
          trigger:
            - call: "GET /vessels"
              payload: {}
              as: JurisdictionAdmin
          assert:
            - "response total_count == 2"
            - "response has_more == false"

      - name: fk_deficiency_by_vessel_reverse_lookup
        claim_type: foreign_key_validated
        grounds: [entities.Deficiency.fields.vessel_id, endpoints]
        distinguishing_aspect: "GET /deficiencies?vessel_id={vessel} returns the single deficiency raised on that vessel (reverse reachability for a cascade-created child)."
        test_recipe:
          setup: ["One NON_CRITICAL deficiency raised on a registered vessel."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /owners"
              payload: { name: "Acme", contact_email: "o@x.com" }
              as: JurisdictionAdmin
              captures: { owner: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Insp A", commission_number: "NBC-A", inspector_type: "JURISDICTION", commissioning_jurisdiction_id: "${jur}" }
              as: JurisdictionAdmin
              captures: { insp_a: "$.data.id" }
            - call: "POST /inspectors/${insp_a}/commission"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /vessels"
              payload: { owner_id: "${owner}", jurisdiction_id: "${jur}", manufacturer: "M", national_board_number: "NBV-1", vessel_class: "POWER_BOILER", mawp_psig: 120, installed_at: "2020-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${owner}"
              captures: { vessel: "$.data.id" }
            - call: "POST /vessels/${vessel}/register"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /inspections"
              payload: { vessel_id: "${vessel}", inspector_id: "${insp_a}", inspection_type: "INTERNAL", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: JurisdictionAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /inspections/${insp1}/deficiencies"
              payload: { severity: "NON_CRITICAL", description: "pitting" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { d1: "$.data.id" }
          trigger:
            - call: "GET /deficiencies?vessel_id=${vessel}"
              payload: {}
              as: JurisdictionAdmin
          assert:
            - "response total_count == 1"
            - "response data[0].id == ${d1}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: reinspect_open_deficiency_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Deficiency.REINSPECTION_to_CLEARED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Reinspecting a deficiency still in OPEN (not REINSPECTION) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A NON_CRITICAL deficiency in OPEN on a registered vessel, reinspected by a second inspector."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /owners"
              payload: { name: "Acme", contact_email: "o@x.com" }
              as: JurisdictionAdmin
              captures: { owner: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Insp A", commission_number: "NBC-A", inspector_type: "JURISDICTION", commissioning_jurisdiction_id: "${jur}" }
              as: JurisdictionAdmin
              captures: { insp_a: "$.data.id" }
            - call: "POST /inspectors/${insp_a}/commission"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /inspectors"
              payload: { name: "Insp B", commission_number: "NBC-B", inspector_type: "JURISDICTION", commissioning_jurisdiction_id: "${jur}" }
              as: JurisdictionAdmin
              captures: { insp_b: "$.data.id" }
            - call: "POST /vessels"
              payload: { owner_id: "${owner}", jurisdiction_id: "${jur}", manufacturer: "M", national_board_number: "NBV-1", vessel_class: "POWER_BOILER", mawp_psig: 120, installed_at: "2020-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${owner}"
              captures: { vessel: "$.data.id" }
            - call: "POST /vessels/${vessel}/register"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /inspections"
              payload: { vessel_id: "${vessel}", inspector_id: "${insp_a}", inspection_type: "INTERNAL", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: JurisdictionAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /inspections/${insp1}/deficiencies"
              payload: { severity: "NON_CRITICAL", description: "pitting" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { d1: "$.data.id" }
          trigger:
            - call: "POST /deficiencies/${d1}/reinspect"
              payload: { outcome: "PASS" }
              as: Inspector
              as_user_id: "${insp_b}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: revoke_already_revoked_certificate_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Certificate.ACTIVE_to_REVOKED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Revoking a certificate already in REVOKED returns ERR_INVALID_STATE (terminal lockdown)."
        test_recipe:
          setup: ["An ACTIVE certificate revoked once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: JurisdictionAdmin
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /owners"
              payload: { name: "Acme", contact_email: "o@x.com" }
              as: JurisdictionAdmin
              captures: { owner: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Insp A", commission_number: "NBC-A", inspector_type: "JURISDICTION", commissioning_jurisdiction_id: "${jur}" }
              as: JurisdictionAdmin
              captures: { insp_a: "$.data.id" }
            - call: "POST /inspectors/${insp_a}/commission"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /vessels"
              payload: { owner_id: "${owner}", jurisdiction_id: "${jur}", manufacturer: "M", national_board_number: "NBV-1", vessel_class: "POWER_BOILER", mawp_psig: 120, installed_at: "2020-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${owner}"
              captures: { vessel: "$.data.id" }
            - call: "POST /vessels/${vessel}/register"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /inspections"
              payload: { vessel_id: "${vessel}", inspector_id: "${insp_a}", inspection_type: "EXTERNAL", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: JurisdictionAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /inspections/${insp1}/result"
              payload: { result: "PASS" }
              as: Inspector
              as_user_id: "${insp_a}"
            - call: "POST /fee-invoices"
              payload: { vessel_id: "${vessel}", inspection_id: "${insp1}" }
              as: JurisdictionAdmin
              captures: { fee1: "$.data.id" }
            - call: "POST /fee-invoices/${fee1}/pay"
              payload: {}
              as: Owner
              as_user_id: "${owner}"
            - call: "GET /vessels/${vessel}"
              payload: {}
              as: JurisdictionAdmin
              captures: { v_ver: "$.data.version" }
            - call: "POST /certificates"
              payload: { vessel_id: "${vessel}", inspection_id: "${insp1}", fee_invoice_id: "${fee1}", expected_vessel_version: "${v_ver}" }
              as: JurisdictionAdmin
              captures: { cert1: "$.data.id" }
            - call: "POST /certificates/${cert1}/revoke"
              payload: {}
              as: JurisdictionAdmin
          trigger:
            - call: "POST /certificates/${cert1}/revoke"
              payload: {}
              as: JurisdictionAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: commission_already_commissioned_inspector_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Inspector.PENDING_to_COMMISSIONED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Commissioning an inspector already in COMMISSIONED returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An inspector already COMMISSIONED."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Insp A", commission_number: "NBC-A", inspector_type: "JURISDICTION", commissioning_jurisdiction_id: "${jur}" }
              as: JurisdictionAdmin
              captures: { insp_a: "$.data.id" }
            - call: "POST /inspectors/${insp_a}/commission"
              payload: {}
              as: JurisdictionAdmin
          trigger:
            - call: "POST /inspectors/${insp_a}/commission"
              payload: {}
              as: JurisdictionAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: sod_reinspect_by_originating_inspector_returns_segregation
        claim_type: precondition_enforcement
        grounds: [state_machines.Deficiency.REINSPECTION_to_CLEARED, "validations[priority=8]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Reinspecting a deficiency in REINSPECTION with the SAME inspector who raised it (originating inspection inspector) returns ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["A NON_CRITICAL deficiency taken to REINSPECTION; reinspection attempted by its originating inspector A."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /owners"
              payload: { name: "Acme", contact_email: "o@x.com" }
              as: JurisdictionAdmin
              captures: { owner: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Insp A", commission_number: "NBC-A", inspector_type: "JURISDICTION", commissioning_jurisdiction_id: "${jur}" }
              as: JurisdictionAdmin
              captures: { insp_a: "$.data.id" }
            - call: "POST /inspectors/${insp_a}/commission"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /vessels"
              payload: { owner_id: "${owner}", jurisdiction_id: "${jur}", manufacturer: "M", national_board_number: "NBV-1", vessel_class: "POWER_BOILER", mawp_psig: 120, installed_at: "2020-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${owner}"
              captures: { vessel: "$.data.id" }
            - call: "POST /vessels/${vessel}/register"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /inspections"
              payload: { vessel_id: "${vessel}", inspector_id: "${insp_a}", inspection_type: "INTERNAL", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: JurisdictionAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /inspections/${insp1}/deficiencies"
              payload: { severity: "NON_CRITICAL", description: "pitting" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { d1: "$.data.id" }
            - call: "POST /inspections/${insp1}/result"
              payload: { result: "PASS_WITH_DEFICIENCIES" }
              as: Inspector
              as_user_id: "${insp_a}"
            - call: "POST /repair-orders"
              payload: { vessel_id: "${vessel}", deficiency_ids: ["${d1}"], description: "fix" }
              as: Owner
              as_user_id: "${owner}"
              captures: { ro1: "$.data.id" }
            - call: "POST /repair-orders/${ro1}/complete"
              payload: {}
              as: Owner
              as_user_id: "${owner}"
          trigger:
            - call: "POST /deficiencies/${d1}/reinspect"
              payload: { outcome: "PASS" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES"

      - name: fail_inspection_sets_vessel_out_of_service
        claim_type: side_effect_execution
        grounds: [state_machines.Inspection.SCHEDULED_to_FAILED, state_machines.Vessel.IN_SERVICE_to_OUT_OF_SERVICE]
        distinguishing_aspect: "Recording FAIL (with a CRITICAL deficiency) on an in-service vessel's inspection drives vessel.service_status to OUT_OF_SERVICE."
        test_recipe:
          setup: ["IN_SERVICE vessel with cert1; a second inspection insp2 raises a CRITICAL deficiency and is recorded FAIL."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: JurisdictionAdmin
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /owners"
              payload: { name: "Acme", contact_email: "o@x.com" }
              as: JurisdictionAdmin
              captures: { owner: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Insp A", commission_number: "NBC-A", inspector_type: "JURISDICTION", commissioning_jurisdiction_id: "${jur}" }
              as: JurisdictionAdmin
              captures: { insp_a: "$.data.id" }
            - call: "POST /inspectors/${insp_a}/commission"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /vessels"
              payload: { owner_id: "${owner}", jurisdiction_id: "${jur}", manufacturer: "M", national_board_number: "NBV-1", vessel_class: "POWER_BOILER", mawp_psig: 120, installed_at: "2020-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${owner}"
              captures: { vessel: "$.data.id" }
            - call: "POST /vessels/${vessel}/register"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /inspections"
              payload: { vessel_id: "${vessel}", inspector_id: "${insp_a}", inspection_type: "EXTERNAL", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: JurisdictionAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /inspections/${insp1}/result"
              payload: { result: "PASS" }
              as: Inspector
              as_user_id: "${insp_a}"
            - call: "POST /fee-invoices"
              payload: { vessel_id: "${vessel}", inspection_id: "${insp1}" }
              as: JurisdictionAdmin
              captures: { fee1: "$.data.id" }
            - call: "POST /fee-invoices/${fee1}/pay"
              payload: {}
              as: Owner
              as_user_id: "${owner}"
            - call: "GET /vessels/${vessel}"
              payload: {}
              as: JurisdictionAdmin
              captures: { v_ver: "$.data.version" }
            - call: "POST /certificates"
              payload: { vessel_id: "${vessel}", inspection_id: "${insp1}", fee_invoice_id: "${fee1}", expected_vessel_version: "${v_ver}" }
              as: JurisdictionAdmin
