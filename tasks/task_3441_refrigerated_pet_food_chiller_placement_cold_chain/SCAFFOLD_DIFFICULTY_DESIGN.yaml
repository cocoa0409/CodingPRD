scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: site_score_demographic_vs_velocity_divergence
        grounds:
          - calculations.site_selection_score
          - entities.SiteEvaluation.fields.composite_score
        distinguishing_aspect: |
          Same store inputs scored under DEMOGRAPHIC_LED and VELOCITY_LED weight
          sets produce different composite scores (66.50 vs 71.00) — a
          dual-variant calculation on the SiteEvaluation entity domain,
          distinct from the Placement-economics domain of the sibling instance.
        test_recipe:
          setup:
            - "Store Alpha exists with demographic_index 80, weekly_category_velocity_index 90, competitor_density_index 20, distance_miles_from_plant 10, available_sqft 100."
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Alpha", region: "US-NE", demographic_index: 80, weekly_category_velocity_index: 90, competitor_density_index: 20, available_sqft: 100, distance_miles_from_plant: 10 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /cold-chain/stores/${st_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "STANDARD", forecast_weekly_units: 200, allocated_sqft: 16 }
              as: PlacementManager
              captures: { ev_demo_score: $.data.composite_score, ev_demo_quote: $.data.install_quote_cents, ev_demo_payback: $.data.payback_months }
            - call: "POST /cold-chain/stores/${st_id}/site-evaluations"
              payload: { model_variant: "VELOCITY_LED", chiller_model: "STANDARD", forecast_weekly_units: 200, allocated_sqft: 16 }
              as: PlacementManager
              captures: { ev_vel_score: $.data.composite_score }
          assert:
            - "first response composite_score == 66.50 (0.45*80 + 0.25*90 + 0.20*50 - 0.10*20)"
            - "second response composite_score == 71.00 (0.20*80 + 0.55*90 + 0.15*50 - 0.10*20)"
            - "66.50 != 71.00 for identical store inputs (variant divergence)"
            - "both responses install_quote_cents == 399000 and payback_months == 2.56 and verdict == ELIGIBLE"
      - name: payback_proforma_vs_actuals_divergence
        grounds:
          - calculations.payback_estimate
          - entities.Placement.fields.payback_actuals_months
        distinguishing_aspect: |
          PRO_FORMA payback (forecast velocity, SiteEvaluation domain) versus
          ACTUALS payback (reported trailing velocity, Placement domain) produce
          different months over the same placement economics: 2.56 vs 5.12 —
          a different entity domain than the sibling SiteEvaluation instance.
        test_recipe:
          setup:
            - "Store Alpha (as fixture) with an ELIGIBLE STANDARD evaluation at forecast 200/wk (payback 2.56)."
            - "A SIGNED agreement (allocated_sqft 16, max_capex_cents 500000, term_months 60) and an IN_STOCK STANDARD chiller."
            - "An ACTIVE placement installed against them (installed_quote_cents snapshot 399000)."
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Alpha", region: "US-NE", demographic_index: 80, weekly_category_velocity_index: 90, competitor_density_index: 20, available_sqft: 100, distance_miles_from_plant: 10 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /cold-chain/stores/${st_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "STANDARD", forecast_weekly_units: 200, allocated_sqft: 16 }
              as: PlacementManager
            - call: "POST /cold-chain/stores/${st_id}/placement-agreements"
              payload: { allocated_sqft: 16, max_capex_cents: 500000, term_months: 60 }
              as: PlacementManager
              captures: { ag_id: $.data.id }
            - call: "POST /cold-chain/placement-agreements/${ag_id}/sign"
              payload: {}
              as: PlacementManager
              captures: { ag_v_signed: $.data.version }
            - call: "POST /cold-chain/chillers"
              payload: { model: "STANDARD", serial_prefix: "FP", quantity: 1 }
              as: ProductionPlanner
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /cold-chain/placements"
              payload: { store_id: "${st_id}", agreement_id: "${ag_id}", chiller_id: "${ch_id}", expected_agreement_version: "${ag_v_signed}" }
              as: PlacementManager
              captures: { pl_id: $.data.id, pl_quote: $.data.installed_quote_cents }
          trigger:
            - call: "POST /cold-chain/placements/${pl_id}/evaluate-performance"
              payload: { trailing_weekly_units: 100 }
              as: PlacementManager
              captures: { pl_payback_actuals: $.data.payback_actuals_months }
          assert:
            - "Placement.${pl_id}.payback_actuals_months == 5.12 (round_half_up(100*13/3)=433 monthly units; margin 433*180=77940; 399000/77940 = 5.12)"
            - "Placement.${pl_id}.payback_actuals_months (5.12) != governing SiteEvaluation.payback_months (2.56) — identical quote, different velocity basis"
            - "Placement.${pl_id}.performance_status == PERFORMING and underperforming_streak == 0 (100 >= 40)"
  - rule_id: combinatorial_formula
    instances:
      - name: payback_rounding_order_pinned
        grounds:
          - calculations.payback_estimate
          - calculations.installation_quote
        distinguishing_aspect: |
          Mode (b) nested rounding: the pinned order rounds weekly->monthly
          units to an integer BEFORE the margin multiply. Cost 291600 with
          forecast 10.4/wk yields 36.00 under the pinned order but 35.95 when
          fractional monthly units are carried through — only 36.00 is
          conformant.
        test_recipe:
          setup:
            - "Store Beta exists with demographic_index 90, weekly_category_velocity_index 80, competitor_density_index 10, available_sqft 100, distance_miles_from_plant 12."
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Beta", region: "US-SW", demographic_index: 90, weekly_category_velocity_index: 80, competitor_density_index: 10, available_sqft: 100, distance_miles_from_plant: 12 }
              as: PlatformAdmin
              captures: { stb_id: $.data.id }
          trigger:
            - call: "POST /cold-chain/stores/${stb_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "COMPACT", forecast_weekly_units: 10.4, allocated_sqft: 14 }
              as: PlacementManager
              captures: { evb_quote: $.data.install_quote_cents, evb_payback: $.data.payback_months, evb_verdict: $.data.verdict }
          assert:
            - "install_quote_cents == 291600 (218000 + 45000 + 14*1250 + 12*925, per-component rounding then sum)"
            - "composite_score == 68.30 (footprint 44; 0.45*90 + 0.25*80 + 0.20*44 - 0.10*10)"
            - "payback_months == 36.00 — monthly units round_half_up(10.4*13/3) = 45 first; margin 45*180 = 8100; 291600/8100 = 36.00 (the unpinned order would give 35.95)"
            - "verdict == ELIGIBLE (36.00 <= 36.0 inclusive)"
      - name: delivery_frequency_tiered_capacity_floor
        grounds:
          - calculations.delivery_frequency_plan
          - entities.Placement.fields.standing_deliveries_per_week
        distinguishing_aspect: |
          Mode (a) combinatorial: tiered branch selection over velocity PLUS a
          nested min() against chiller capacity with a shelf-life-scaled stock
          ceiling (>= 3 inputs, non-linear interaction) — a different mode than
          the rounding-order sibling instance.
        test_recipe:
          setup:
            - "Store Alpha fixture with ELIGIBLE evaluation (forecast 200), SIGNED agreement, IN_STOCK STANDARD chiller (capacity 240), ACTIVE placement installed."
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Alpha", region: "US-NE", demographic_index: 80, weekly_category_velocity_index: 90, competitor_density_index: 20, available_sqft: 100, distance_miles_from_plant: 10 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /cold-chain/stores/${st_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "STANDARD", forecast_weekly_units: 200, allocated_sqft: 16 }
              as: PlacementManager
            - call: "POST /cold-chain/stores/${st_id}/placement-agreements"
              payload: { allocated_sqft: 16, max_capex_cents: 500000, term_months: 60 }
              as: PlacementManager
              captures: { ag_id: $.data.id }
            - call: "POST /cold-chain/placement-agreements/${ag_id}/sign"
              payload: {}
              as: PlacementManager
              captures: { ag_v_signed: $.data.version }
            - call: "POST /cold-chain/chillers"
              payload: { model: "STANDARD", serial_prefix: "FP", quantity: 1 }
              as: ProductionPlanner
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /cold-chain/placements"
              payload: { store_id: "${st_id}", agreement_id: "${ag_id}", chiller_id: "${ch_id}", expected_agreement_version: "${ag_v_signed}" }
              as: PlacementManager
              captures: { pl_id: $.data.id, pl_freq0: $.data.standing_deliveries_per_week, pl_ss0: $.data.safety_stock_units }
          trigger:
            - call: "POST /cold-chain/placements/${pl_id}/evaluate-performance"
              payload: { trailing_weekly_units: 300 }
              as: PlacementManager
              captures: { pl_freq_hi: $.data.standing_deliveries_per_week, pl_ss_hi: $.data.safety_stock_units }
            - call: "POST /cold-chain/placements/${pl_id}/evaluate-performance"
              payload: { trailing_weekly_units: 299 }
              as: PlacementManager
              captures: { pl_freq_lo: $.data.standing_deliveries_per_week }
          assert:
            - "at creation standing_deliveries_per_week == 3 (forecast 200 -> tier 150..299) and safety_stock_units == 240 (min(240, round_half_up(200*45/7*1.25)=1607))"
            - "at trailing 300: standing_deliveries_per_week == 5 (tier boundary 300 inclusive) and safety_stock_units == 240 (min(240, 2411) floors at capacity)"
            - "at trailing 299: standing_deliveries_per_week == 3 (just below the inclusive boundary)"
            - "performance_status == PERFORMING at both 300 and 299 (>= 40)"
  - rule_id: non_linear_state_machine
    instances:
      - name: chiller_cyclic_repair_loop
        grounds:
          - state_machines.Chiller.ACTIVE_to_NEEDS_REPAIR
          - state_machines.Chiller.NEEDS_REPAIR_to_ACTIVE
          - calculations.excursion_severity_accumulator
        distinguishing_aspect: |
          Chiller runs a true cycle (ACTIVE -> NEEDS_REPAIR -> ACTIVE ->
          NEEDS_REPAIR) driven by the excursion accumulator with a repair reset
          (last_repair_at cutoff) — a cyclic machine on Chiller, a different
          entity than the parallel-dimension Placement sibling instance.
        test_recipe:
          setup:
            - "Store Alpha fixture, ELIGIBLE evaluation (forecast 200), SIGNED agreement, STANDARD chiller, ACTIVE placement; chiller activated by an in-range reading."
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Alpha", region: "US-NE", demographic_index: 80, weekly_category_velocity_index: 90, competitor_density_index: 20, available_sqft: 100, distance_miles_from_plant: 10 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /cold-chain/stores/${st_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "STANDARD", forecast_weekly_units: 200, allocated_sqft: 16 }
              as: PlacementManager
            - call: "POST /cold-chain/stores/${st_id}/placement-agreements"
              payload: { allocated_sqft: 16, max_capex_cents: 500000, term_months: 60 }
              as: PlacementManager
              captures: { ag_id: $.data.id }
            - call: "POST /cold-chain/placement-agreements/${ag_id}/sign"
              payload: {}
              as: PlacementManager
              captures: { ag_v_signed: $.data.version }
            - call: "POST /cold-chain/chillers"
              payload: { model: "STANDARD", serial_prefix: "FP", quantity: 1 }
              as: ProductionPlanner
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /cold-chain/placements"
              payload: { store_id: "${st_id}", agreement_id: "${ag_id}", chiller_id: "${ch_id}", expected_agreement_version: "${ag_v_signed}" }
              as: PlacementManager
              captures: { pl_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cold-chain/chillers/${ch_id}/temperature-readings"
              payload: { recorded_at: "2026-09-02T08:30:00Z", temp_c: 2.5, duration_minutes: 15 }
              as: PlatformAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T11:05:00Z" }
              as: PlatformAdmin
            - call: "POST /cold-chain/chillers/${ch_id}/temperature-readings"
              payload: { recorded_at: "2026-09-02T10:00:00Z", temp_c: 5.0, duration_minutes: 70 }
              as: PlatformAdmin
              captures: { rd1_exc: $.data.is_excursion }
            - call: "POST /cold-chain/chillers/${ch_id}/temperature-readings"
              payload: { recorded_at: "2026-09-02T11:00:00Z", temp_c: 6.0, duration_minutes: 60 }
              as: PlatformAdmin
            - call: "GET /cold-chain/chillers/${ch_id}"
              as: PlatformAdmin
              captures: { ch_status_r1: $.data.status, ch_exc_r1: $.data.excursion_minutes_24h }
            - call: "GET /cold-chain/chillers/${ch_id}/service-tickets"
              as: ServiceDispatcher
              captures: { tk1_id: "$.data[0].id", tk1_origin: "$.data[0].origin" }
            - call: "POST /cold-chain/service-tickets/${tk1_id}/dispatch"
              payload: { window_start: "2026-09-02T12:00:00Z", window_end: "2026-09-02T13:00:00Z" }
              as: ServiceDispatcher
            - call: "POST /cold-chain/service-tickets/${tk1_id}/resolve"
              payload: { resolution_note: "replaced compressor relay" }
              as: FieldTechnician
            - call: "GET /cold-chain/chillers/${ch_id}"
              as: PlatformAdmin
              captures: { ch_status_post: $.data.status, ch_exc_post: $.data.excursion_minutes_24h }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cold-chain/chillers/${ch_id}/temperature-readings"
              payload: { recorded_at: "2026-09-03T08:00:00Z", temp_c: 5.5, duration_minutes: 130 }
              as: PlatformAdmin
            - call: "GET /cold-chain/chillers/${ch_id}"
              as: PlatformAdmin
              captures: { ch_status_r2: $.data.status }
            - call: "GET /cold-chain/chillers/${ch_id}/service-tickets"
              as: ServiceDispatcher
              captures: { tk2_origin: "$.data[1].origin" }
          assert:
            - "after the two excursion readings (70 + 60 = 130 >= 120): Chiller.${ch_id}.status == NEEDS_REPAIR and excursion_minutes_24h == 130"
            - "a ServiceTicket with origin == AUTO_EXCURSION and status OPEN was minted by the cascade"
            - "after resolve: status == ACTIVE and excursion_minutes_24h == 0 (last_repair_at cutoff resets the accumulator)"
            - "after the round-2 reading (130 min, recorded after last_repair_at): status == NEEDS_REPAIR again — cycle completed twice"
            - "second AUTO_EXCURSION ticket exists (ticket list length 2)"
      - name: placement_parallel_dimensions_independent
        grounds:
          - state_machines.Placement
          - entities.Placement.fields.performance_status
          - entities.Placement.fields.operational_status
        distinguishing_aspect: |
          Placement carries two independent state axes: performance_status
          (PENDING/PERFORMING/UNDERPERFORMING via evaluations) and
          operational_status (OK/SUSPENDED via chiller health). Excursion and
          repair change operational_status without touching performance_status
          and vice versa — a parallel-dimension machine on Placement, a
          different entity and a different non-linear shape than the Chiller
          cycle.
        test_recipe:
          setup:
            - "Store Alpha fixture with ELIGIBLE evaluation, SIGNED agreement, STANDARD chiller, ACTIVE placement; chiller activated by an in-range reading."
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Alpha", region: "US-NE", demographic_index: 80, weekly_category_velocity_index: 90, competitor_density_index: 20, available_sqft: 100, distance_miles_from_plant: 10 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /cold-chain/stores/${st_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "STANDARD", forecast_weekly_units: 200, allocated_sqft: 16 }
              as: PlacementManager
            - call: "POST /cold-chain/stores/${st_id}/placement-agreements"
              payload: { allocated_sqft: 16, max_capex_cents: 500000, term_months: 60 }
              as: PlacementManager
              captures: { ag_id: $.data.id }
            - call: "POST /cold-chain/placement-agreements/${ag_id}/sign"
              payload: {}
              as: PlacementManager
              captures: { ag_v_signed: $.data.version }
            - call: "POST /cold-chain/chillers"
              payload: { model: "STANDARD", serial_prefix: "FP", quantity: 1 }
              as: ProductionPlanner
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /cold-chain/placements"
              payload: { store_id: "${st_id}", agreement_id: "${ag_id}", chiller_id: "${ch_id}", expected_agreement_version: "${ag_v_signed}" }
              as: PlacementManager
              captures: { pl_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cold-chain/chillers/${ch_id}/temperature-readings"
              payload: { recorded_at: "2026-09-02T08:30:00Z", temp_c: 3.0, duration_minutes: 15 }
              as: PlatformAdmin
          trigger:
            - call: "POST /cold-chain/placements/${pl_id}/evaluate-performance"
              payload: { trailing_weekly_units: 30 }
              as: PlacementManager
              captures: { pl_perf_1: $.data.performance_status, pl_ops_1: $.data.operational_status, pl_streak_1: $.data.underperforming_streak }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cold-chain/chillers/${ch_id}/temperature-readings"
              payload: { recorded_at: "2026-09-02T09:30:00Z", temp_c: 6.0, duration_minutes: 120 }
              as: PlatformAdmin
            - call: "GET /cold-chain/placements/${pl_id}"
              as: PlacementManager
              captures: { pl_perf_2: $.data.performance_status, pl_ops_2: $.data.operational_status }
            - call: "GET /cold-chain/chillers/${ch_id}/service-tickets"
              as: FieldTechnician
              captures: { tk_id: "$.data[0].id" }
            - call: "POST /cold-chain/service-tickets/${tk_id}/resolve"
              payload: { resolution_note: "cleared condenser" }
              as: FieldTechnician
            - call: "POST /cold-chain/placements/${pl_id}/evaluate-performance"
              payload: { trailing_weekly_units: 50 }
              as: PlacementManager
              captures: { pl_perf_3: $.data.performance_status, pl_ops_3: $.data.operational_status, pl_streak_3: $.data.underperforming_streak }
          assert:
            - "after evaluate(30): performance_status == UNDERPERFORMING, underperforming_streak == 1, operational_status == OK"
            - "after severe excursion: operational_status == SUSPENDED while performance_status stays UNDERPERFORMING (axes independent)"
            - "after resolve: operational_status == OK, performance_status still UNDERPERFORMING"
            - "after evaluate(50): performance_status == PERFORMING, underperforming_streak == 0, operational_status == OK"
  - rule_id: transitive_cascade
    instances:
      - name: excursion_cascade_depth3
        grounds:
          - state_machines.Chiller.ACTIVE_to_NEEDS_REPAIR
          - state_machines.Placement
          - state_machines.InventoryPosition.SELLABLE_to_QUARANTINED
        distinguishing_aspect: |
          One temperature reading cascades three caused hops: reading ->
          Chiller NEEDS_REPAIR -> Placement operational SUSPENDED ->
          store InventoryPositions QUARANTINED (plus a sibling hop minting an
          AUTO_EXCURSION ticket). Trigger: POST temperature-readings — a
          different trigger than the retire-initiated sibling cascade.
        test_recipe:
          setup:
            - "Store Alpha fixture, ELIGIBLE evaluation, SIGNED agreement, STANDARD chiller, ACTIVE placement; chiller activated."
            - "A RELEASED lot of 500 units; shipment of 120 delivered and fully accepted; InventoryPosition SELLABLE 120 at the store."
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Alpha", region: "US-NE", demographic_index: 80, weekly_category_velocity_index: 90, competitor_density_index: 20, available_sqft: 100, distance_miles_from_plant: 10 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /cold-chain/stores/${st_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "STANDARD", forecast_weekly_units: 200, allocated_sqft: 16 }
              as: PlacementManager
            - call: "POST /cold-chain/stores/${st_id}/placement-agreements"
              payload: { allocated_sqft: 16, max_capex_cents: 500000, term_months: 60 }
              as: PlacementManager
              captures: { ag_id: $.data.id }
            - call: "POST /cold-chain/placement-agreements/${ag_id}/sign"
              payload: {}
              as: PlacementManager
              captures: { ag_v_signed: $.data.version }
            - call: "POST /cold-chain/chillers"
              payload: { model: "STANDARD", serial_prefix: "FP", quantity: 1 }
              as: ProductionPlanner
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /cold-chain/placements"
              payload: { store_id: "${st_id}", agreement_id: "${ag_id}", chiller_id: "${ch_id}", expected_agreement_version: "${ag_v_signed}" }
              as: PlacementManager
              captures: { pl_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cold-chain/chillers/${ch_id}/temperature-readings"
              payload: { recorded_at: "2026-09-02T07:30:00Z", temp_c: 2.0, duration_minutes: 15 }
              as: PlatformAdmin
            - call: "POST /cold-chain/product-lots"
              payload: { sku: "BEEF-5LB", produced_at: "2026-09-01T00:00:00Z", quantity_units: 500 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /cold-chain/product-lots/${lot_id}/release"
              payload: { qc_passed: true }
              as: ProductionPlanner
            - call: "POST /cold-chain/shipments"
              payload: { store_id: "${st_id}", lot_id: "${lot_id}", quantity_units: 120 }
              as: LogisticsCoordinator
              captures: { sh_id: $.data.id }
            - call: "POST /cold-chain/shipments/${sh_id}/deliver"
              payload: { accepted_units: 120, rejected_units: 0 }
              as: LogisticsCoordinator
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cold-chain/chillers/${ch_id}/temperature-readings"
              payload: { recorded_at: "2026-09-02T09:45:00Z", temp_c: 6.0, duration_minutes: 120 }
              as: PlatformAdmin
            - call: "GET /cold-chain/chillers/${ch_id}"
              as: PlatformAdmin
              captures: { ch_status: $.data.status }
            - call: "GET /cold-chain/placements/${pl_id}"
              as: PlacementManager
              captures: { pl_ops: $.data.operational_status }
            - call: "GET /cold-chain/inventory-positions"
              payload: { store_id: "${st_id}" }
              as: PlatformAdmin
              captures: { pos_status: "$.data[0].status" }
            - call: "GET /cold-chain/chillers/${ch_id}/service-tickets"
              as: ServiceDispatcher
              captures: { tk_origin: "$.data[0].origin", tk_status: "$.data[0].status" }
          assert:
            - "Chiller.${ch_id}.status == NEEDS_REPAIR (hop 1: exactly 120 excursion minutes, boundary inclusive)"
            - "Placement.${pl_id}.operational_status == SUSPENDED (hop 2, caused by hop 1)"
            - "the store's InventoryPosition status == QUARANTINED (hop 3, caused by hop 2)"
            - "a ServiceTicket with origin == AUTO_EXCURSION and status == OPEN exists (sibling hop of hop 1)"
            - "lot bucket in_store_qty still 120 (quarantine does not move buckets; only the sweep does)"
      - name: retire_cascade_returns_chiller_and_cancels_ticket
        grounds:
          - state_machines.Placement
          - state_machines.Chiller.INSTALLED_to_IN_STOCK
          - state_machines.ServiceTicket.OPEN_to_CANCELLED
        distinguishing_aspect: |
          POST /placements/{id}/retire cascades: Placement RETIRED -> Chiller
          IN_STOCK -> OPEN ServiceTicket CANCELLED. Triggered by retire — a
          different originating transition than the excursion cascade — and
          exercises the compensating direction (asset returned to stock).
        test_recipe:
          setup:
            - "Store Alpha fixture, ELIGIBLE evaluation, SIGNED agreement, STANDARD chiller, ACTIVE placement; a MANUAL OPEN service ticket on the chiller; two consecutive UNDERPERFORMING evaluations (streak 2)."
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Alpha", region: "US-NE", demographic_index: 80, weekly_category_velocity_index: 90, competitor_density_index: 20, available_sqft: 100, distance_miles_from_plant: 10 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /cold-chain/stores/${st_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "STANDARD", forecast_weekly_units: 200, allocated_sqft: 16 }
              as: PlacementManager
            - call: "POST /cold-chain/stores/${st_id}/placement-agreements"
              payload: { allocated_sqft: 16, max_capex_cents: 500000, term_months: 60 }
              as: PlacementManager
              captures: { ag_id: $.data.id }
            - call: "POST /cold-chain/placement-agreements/${ag_id}/sign"
              payload: {}
              as: PlacementManager
              captures: { ag_v_signed: $.data.version }
            - call: "POST /cold-chain/chillers"
              payload: { model: "STANDARD", serial_prefix: "FP", quantity: 1 }
              as: ProductionPlanner
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /cold-chain/placements"
              payload: { store_id: "${st_id}", agreement_id: "${ag_id}", chiller_id: "${ch_id}", expected_agreement_version: "${ag_v_signed}" }
              as: PlacementManager
              captures: { pl_id: $.data.id }
            - call: "POST /cold-chain/service-tickets"
              payload: { chiller_id: "${ch_id}", issue_summary: "door gasket whistling" }
              as: ServiceDispatcher
              captures: { tk_id: $.data.id }
            - call: "POST /cold-chain/placements/${pl_id}/evaluate-performance"
              payload: { trailing_weekly_units: 30 }
              as: PlacementManager
            - call: "POST /cold-chain/placements/${pl_id}/evaluate-performance"
              payload: { trailing_weekly_units: 35 }
              as: PlacementManager
              captures: { pl_streak: $.data.underperforming_streak }
          trigger:
            - call: "POST /cold-chain/placements/${pl_id}/retire"
              payload: { mode: "REMOVE", removal_reason: "UNDERPERFORMANCE_REMOVAL" }
              as: PlacementManager
              captures: { pl_status: $.data.status, pl_reason: $.data.retired_reason }
            - call: "GET /cold-chain/chillers/${ch_id}"
              as: PlatformAdmin
              captures: { ch_status: $.data.status }
            - call: "GET /cold-chain/chillers/${ch_id}/service-tickets"
              as: ServiceDispatcher
              captures: { tk_status: "$.data[0].status" }
          assert:
            - "precondition evidence: underperforming_streak == 2 before retire"
            - "Placement.${pl_id}.status == RETIRED and retired_reason == UNDERPERFORMANCE_REMOVAL (hop 1)"
            - "Chiller.${ch_id}.status == IN_STOCK (hop 2, caused by hop 1)"
            - "ServiceTicket.${tk_id}.status == CANCELLED (hop 3, caused by hop 2)"
            - "PlacementAgreement.${ag_id} remains ACTIVE (retire does not terminate the agreement)"
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: install_state_beats_fiscal
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_AGREEMENT_NOT_SIGNED]
          - errors[ERR_CAPEX_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair (state vs business_fiscal): one POST /placements
          that violates both the SIGNED-agreement state gate and the capex
          ceiling must fail with the state error ERR_AGREEMENT_NOT_SIGNED —
          the fiscal error is shadowed by priority.
        test_recipe:
          setup:
            - "Store Alpha fixture with an ELIGIBLE evaluation; agreement PROPOSED (never signed) with max_capex_cents 1 (quote 399000 would exceed it); chiller IN_STOCK."
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Alpha", region: "US-NE", demographic_index: 80, weekly_category_velocity_index: 90, competitor_density_index: 20, available_sqft: 100, distance_miles_from_plant: 10 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /cold-chain/stores/${st_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "STANDARD", forecast_weekly_units: 200, allocated_sqft: 16 }
              as: PlacementManager
            - call: "POST /cold-chain/stores/${st_id}/placement-agreements"
              payload: { allocated_sqft: 16, max_capex_cents: 1, term_months: 60 }
              as: PlacementManager
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /cold-chain/chillers"
              payload: { model: "STANDARD", serial_prefix: "FP", quantity: 1 }
              as: ProductionPlanner
              captures: { ch_id: "$.data[0].id" }
          trigger:
            - call: "POST /cold-chain/placements"
              payload: { store_id: "${st_id}", agreement_id: "${ag_id}", chiller_id: "${ch_id}", expected_agreement_version: "${ag_v}" }
              as: PlacementManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_AGREEMENT_NOT_SIGNED (state, priority 4) — NOT ERR_CAPEX_BUDGET_EXCEEDED (business_fiscal, priority 9), even though the capex check would also fail"
            - "http status == 409"
            - "Chiller.${ch_id}.status remains IN_STOCK and no Placement row exists for the store (GET /placements?store_id returns total_count 0)"
      - name: deliver_safety_beats_temporal
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_LOT_EXPIRED]
          - errors[ERR_TRANSIT_WINDOW_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair (business_safety vs business_temporal): a deliver
          attempted after the 48h transit window AND after the lot expired must
          fail with ERR_LOT_EXPIRED — the safety gate precedes the temporal
          gate and the shipment is NOT spoiled by the failed safety check.
        test_recipe:
          setup:
            - "Full ACTIVE placement on Store Alpha (forecast 200 fixture); RELEASED lot produced 2026-09-01T00:00:00Z (expires 2026-10-16T00:00:00Z) with 100 units."
            - "Shipment of 10 units departed 2026-10-14T23:00:00Z (lot still RELEASED at departure)."
            - "Logical clock advanced to 2026-10-16T23:00:01Z: lot EXPIRED and transit window (48h) exceeded."
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Alpha", region: "US-NE", demographic_index: 80, weekly_category_velocity_index: 90, competitor_density_index: 20, available_sqft: 100, distance_miles_from_plant: 10 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /cold-chain/stores/${st_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "STANDARD", forecast_weekly_units: 200, allocated_sqft: 16 }
              as: PlacementManager
            - call: "POST /cold-chain/stores/${st_id}/placement-agreements"
              payload: { allocated_sqft: 16, max_capex_cents: 500000, term_months: 60 }
              as: PlacementManager
              captures: { ag_id: $.data.id }
            - call: "POST /cold-chain/placement-agreements/${ag_id}/sign"
              payload: {}
              as: PlacementManager
              captures: { ag_v_signed: $.data.version }
            - call: "POST /cold-chain/chillers"
              payload: { model: "STANDARD", serial_prefix: "FP", quantity: 1 }
              as: ProductionPlanner
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /cold-chain/placements"
              payload: { store_id: "${st_id}", agreement_id: "${ag_id}", chiller_id: "${ch_id}", expected_agreement_version: "${ag_v_signed}" }
              as: PlacementManager
              captures: { pl_id: $.data.id }
            - call: "POST /cold-chain/product-lots"
              payload: { sku: "BEEF-5LB", produced_at: "2026-09-01T00:00:00Z", quantity_units: 100 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /cold-chain/product-lots/${lot_id}/release"
              payload: { qc_passed: true }
              as: ProductionPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-14T23:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cold-chain/shipments"
              payload: { store_id: "${st_id}", lot_id: "${lot_id}", quantity_units: 10 }
              as: LogisticsCoordinator
              captures: { sh_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T23:00:01Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cold-chain/shipments/${sh_id}/deliver"
              payload: { accepted_units: 10, rejected_units: 0 }
              as: LogisticsCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /cold-chain/product-lots/${lot_id}"
              as: ProductionPlanner
              captures: { lot_unshipped: $.data.unshipped_qty, lot_transit: $.data.in_transit_qty, lot_spoiled: $.data.spoiled_qty, lot_status: $.data.status }
          assert:
            - "error_id == ERR_LOT_EXPIRED (business_safety, priority 5) — NOT ERR_TRANSIT_WINDOW_EXCEEDED (business_temporal, priority 6), though both hold"
            - "http status == 422"
            - "lot buckets unchanged by the failed safety check: unshipped_qty == 90, in_transit_qty == 10, spoiled_qty == 0 (no premature spoil)"
            - "lot.status == EXPIRED on read (lazy materialization)"
  - rule_id: boundary_precision_check
    instances:
      - name: payback_exactly_36_eligible
        grounds:
          - calculations.payback_estimate
          - entities.SiteEvaluation.fields.verdict
        distinguishing_aspect: |
          Boundary metric: payback MONTHS on POST site-evaluations. Exactly
          36.00 months is ELIGIBLE (<= 36.0 inclusive); 36.82 is INELIGIBLE.
          Distinct metric and endpoint from the temperature-boundary sibling.
        test_recipe:
          setup:
            - "Store Beta fixture (demographic 90, velocity 80, competitor 10, distance 12, available_sqft 100); COMPACT quote is 291600 with allocated_sqft 14."
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Beta", region: "US-SW", demographic_index: 90, weekly_category_velocity_index: 80, competitor_density_index: 10, available_sqft: 100, distance_miles_from_plant: 12 }
              as: PlatformAdmin
              captures: { stb_id: $.data.id }
          trigger:
            - call: "POST /cold-chain/stores/${stb_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "COMPACT", forecast_weekly_units: 10.4, allocated_sqft: 14 }
              as: PlacementManager
              captures: { ev_at_payback: $.data.payback_months, ev_at_verdict: $.data.verdict }
            - call: "POST /cold-chain/stores/${stb_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "COMPACT", forecast_weekly_units: 10.2, allocated_sqft: 14 }
              as: PlacementManager
              captures: { ev_over_payback: $.data.payback_months, ev_over_verdict: $.data.verdict }
          assert:
            - "forecast 10.4: payback_months == 36.00 exactly and verdict == ELIGIBLE (boundary inclusive)"
            - "forecast 10.2: monthly units round_half_up(10.2*13/3)=44 -> margin 7920 -> payback 36.82 and verdict == INELIGIBLE"
            - "both evaluations share install_quote_cents == 291600 and composite_score == 68.30 — only payback flips the verdict"
      - name: temperature_upper_bound_inclusive
        grounds:
          - calculations.excursion_severity_accumulator
          - entities.TemperatureReading.fields.is_excursion
        distinguishing_aspect: |
          Boundary metric: temperature in Celsius on POST temperature-readings.
          Exactly 4.0 C is inside the inclusive safe band (no excursion, and the
          reading activates the chiller); 4.1 C is an excursion. Distinct
          metric and endpoint from the payback-months sibling.
        test_recipe:
          setup:
            - "Store Alpha fixture with ELIGIBLE evaluation, SIGNED agreement, STANDARD chiller, placement just installed (chiller INSTALLED, never activated)."
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Alpha", region: "US-NE", demographic_index: 80, weekly_category_velocity_index: 90, competitor_density_index: 20, available_sqft: 100, distance_miles_from_plant: 10 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /cold-chain/stores/${st_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "STANDARD", forecast_weekly_units: 200, allocated_sqft: 16 }
              as: PlacementManager
            - call: "POST /cold-chain/stores/${st_id}/placement-agreements"
              payload: { allocated_sqft: 16, max_capex_cents: 500000, term_months: 60 }
              as: PlacementManager
              captures: { ag_id: $.data.id }
            - call: "POST /cold-chain/placement-agreements/${ag_id}/sign"
              payload: {}
              as: PlacementManager
              captures: { ag_v_signed: $.data.version }
            - call: "POST /cold-chain/chillers"
              payload: { model: "STANDARD", serial_prefix: "FP", quantity: 1 }
              as: ProductionPlanner
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /cold-chain/placements"
              payload: { store_id: "${st_id}", agreement_id: "${ag_id}", chiller_id: "${ch_id}", expected_agreement_version: "${ag_v_signed}" }
              as: PlacementManager
              captures: { pl_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cold-chain/chillers/${ch_id}/temperature-readings"
              payload: { recorded_at: "2026-09-02T08:30:00Z", temp_c: 4.0, duration_minutes: 130 }
              as: PlatformAdmin
              captures: { rd_edge_exc: $.data.is_excursion }
            - call: "GET /cold-chain/chillers/${ch_id}"
              as: PlatformAdmin
              captures: { ch_status_edge: $.data.status, ch_exc_edge: $.data.excursion_minutes_24h }
            - call: "POST /cold-chain/chillers/${ch_id}/temperature-readings"
              payload: { recorded_at: "2026-09-02T08:45:00Z", temp_c: 4.1, duration_minutes: 130 }
              as: PlatformAdmin
              captures: { rd_over_exc: $.data.is_excursion }
            - call: "GET /cold-chain/chillers/${ch_id}"
              as: PlatformAdmin
              captures: { ch_status_over: $.data.status }
          assert:
            - "temp 4.0: is_excursion == false (upper bound inclusive); chiller INSTALLED -> ACTIVE on this first in-range reading; excursion_minutes_24h == 0; no service ticket minted"
            - "temp 4.1: is_excursion == true; 130 >= 120 minutes so chiller -> NEEDS_REPAIR and an AUTO_EXCURSION ticket appears"
