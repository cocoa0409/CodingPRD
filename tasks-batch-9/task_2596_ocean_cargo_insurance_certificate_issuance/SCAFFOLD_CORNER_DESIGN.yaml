      - name: port_creation_is_shared_between_underwriter_and_compliance_officer
        claim_type: role_permission_grant
        grounds:
          - roles.Underwriter.shared_operations
          - roles.ComplianceOfficer.shared_operations
          - endpoints.POST /ports
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          POST /ports is the only creation endpoint with two writers, and the
          shared grant must be symmetric: both roles create a port with identical
          semantics, while every other role — including PlatformAdmin, who can
          read every collection — is refused. Re-tiering the same port stays
          exclusive to the ComplianceOfficer, so a shared create does not imply a
          shared update.
        test_recipe:
          setup:
            - "no fixture"
          setup_api_calls: []
          trigger:
            - call: "POST /ports"
              payload: { unlocode: "SGSIN", name: "Singapore", country_code: "SG", port_accumulation_limit_amount: 8000000, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: Underwriter
              captures: { port_uw_id: $.data.id, port_uw_tier: $.data.war_risk_tier }
            - call: "POST /ports"
              payload: { unlocode: "NLRTM", name: "Rotterdam", country_code: "NL", port_accumulation_limit_amount: 8000000, storage_free_days: 30, war_risk_tier: "AMBER" }
              as: ComplianceOfficer
              captures: { port_co_id: $.data.id, port_co_mult: $.data.war_rate_multiplier }
            - call: "POST /ports"
              payload: { unlocode: "USNYC", name: "New York", country_code: "US", port_accumulation_limit_amount: 8000000, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: PlatformAdmin
              captures: { err_admin: $.data.error_id }
            - call: "POST /ports"
              payload: { unlocode: "AUSYD", name: "Sydney", country_code: "AU", port_accumulation_limit_amount: 8000000, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: Assured
              as_user_id: "not-a-policy"
              captures: { err_assured: $.data.error_id }
            - call: "POST /ports/${port_uw_id}/war-risk-tier"
              payload: { war_risk_tier: "AMBER" }
              as: Underwriter
              captures: { err_retier: $.data.error_id }
            - call: "POST /ports/${port_uw_id}/war-risk-tier"
              payload: { war_risk_tier: "AMBER" }
              as: ComplianceOfficer
              captures: { retier_tier: $.data.war_risk_tier, retier_mult: $.data.war_rate_multiplier }
            - call: "GET /ports"
              payload: {}
              as: PlatformAdmin
              captures: { port_count: $.meta.total_count }
          assert:
            - "both creations returned 201; ${port_uw_tier} == \"GREEN\" with war_rate_multiplier 1.0 and ${port_co_mult} == 1.5 for the AMBER port"
            - "${err_admin} == \"ERR_UNAUTHORIZED\" with HTTP 403 and ${err_assured} == \"ERR_UNAUTHORIZED\" with HTTP 403"
            - "${err_retier} == \"ERR_UNAUTHORIZED\" with HTTP 403 — the Underwriter may create a port but never re-tier one"
            - "${retier_tier} == \"AMBER\" and ${retier_mult} == 1.5 — the same call from the ComplianceOfficer succeeds"
            - "${port_count} == 2 — PlatformAdmin reads the collection it may not write to"

  - section: cross_cutting_complexity_layers
    instances:
      - name: certificate_issue_on_a_stale_policy_version_returns_a_precondition_failure
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.certificate-issue-stale-policy
          - errors.ERR_STALE_POLICY_VERSION
          - validations.priority_9_ERR_STALE_POLICY_VERSION
          - endpoints.POST /certificates/{id}/issue
        distinguishing_aspect: |
          The OCC field belongs to the PARENT policy, not to the certificate being
          issued: CERT-OCC-B is still DRAFT and would otherwise issue cleanly, so
          nothing in its own state can reject it — only the policy version moved
          when CERT-OCC-A was issued. The 412 must fire before any pricing or
          limit work, leaving CERT-OCC-B unpriced and the ledgers untouched, and
          re-reading the policy makes the identical request succeed. An
          implementation that stores the version on the certificate, or that
          compares against the certificate's own version, accepts the stale call.
        test_recipe:
          setup:
            - "one ACTIVE policy with two DRAFT certificates, CERT-OCC-A and CERT-OCC-B, each insured for 1155000.00"
            - "policy version captured once, before either issue"
