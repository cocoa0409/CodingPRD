# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 3278: wearable membership / hardware inclusion / data access
# 2 instances per Difficulty Rule (18 total); every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and drives empty-DB to the target state via §1.5.
# Logical-clock default before any set_current_utc call: 2026-09-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: metric_scores_baseline_vs_published_recompute
        grounds:
          - calculations.metric_scores
          - state_machines.DailyMetricSet.CURRENT_to_STALE
          - state_machines.DailyMetricSet.STALE_to_RECOMPUTED
        distinguishing_aspect: |
          Dual-variant calculation in the physiological-metric domain: identical
          sensor aggregates produce strain 14.0 / recovery 62 / sleep 75 under
          baseline_v1 (algorithm_version 1) and strain 15.6 / recovery 60 /
          sleep 80 under published_v2plus after a version-2 release publish
          recomputes the same DailyMetricSet row.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; member with ACTIVE term and an ACTIVE device whose continuity covers 2026-09-01"
            - "One DailyMetricSet for day 2026-09-01 ingested before any release exists: avg_hr=140, hrv_ms=80, resting_hr=50, sleep_minutes=360"
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One" }
              as: Anonymous
              captures: { m1: "$.data.id" }
            - call: "POST /members/${m1}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${m1}"
              captures: { t1: "$.data.id" }
            - call: "POST /devices"
              payload: { member_id: "${m1}", term_id: "${t1}", serial_number: "SN-1", hardware_tier: "BAND_STD" }
              as: PlatformAdmin
              captures: { d1: "$.data.id" }
            - call: "POST /devices/${d1}/activate"
              payload: {}
              as: Member
              as_user_id: "${m1}"
            - call: "POST /devices/${d1}/ingest"
              payload: { day_on: "2026-09-01", avg_hr: 140, hrv_ms: 80, resting_hr: 50, sleep_minutes: 360 }
              as: Member
              as_user_id: "${m1}"
              captures: { ms1: "$.data.id" }
            - call: "POST /algorithm-releases"
              payload: { version: 2, requires_member_ack: true, release_notes: "v2" }
              as: PlatformAdmin
              captures: { r2: "$.data.id" }
          trigger:
            - call: "POST /algorithm-releases/${r2}/publish"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Before publish, GET /members/${m1}/metric-sets row for day_on=2026-09-01 had algorithm_version=1, strain_score=14.0, recovery_score=62, sleep_performance_pct=75, interpretation_status=CURRENT"
            - "After publish, the same row has algorithm_version=2, strain_score=15.6, recovery_score=60, sleep_performance_pct=80, interpretation_status=RECOMPUTED"
            - "Member.${m1}.data_sharing_posture == SUPPRESSED (recovery changed and requires_member_ack=true)"

      - name: early_cancel_charge_remaining_vs_paid_floor
        grounds:
          - calculations.early_cancel_charge
          - state_machines.MembershipTerm.ACTIVE_to_CANCELLED_EARLY
        distinguishing_aspect: |
          Dual-variant calculation in the fiscal domain on MembershipTerm: two
          terms with identical monthly fee (3000), commitment (12) and months_paid
          (3) but different cancel_fee_policy produce different charges —
          REMAINING_MONTHS charges max(5000, 3000*9*0.5)=13500 while
          PAID_MONTHS_FLOOR charges max(5000, 3000*3*0.25)=5000 (floor binds).
        test_recipe:
          setup:
            - "Clock at 2026-09-01; two members, each with an ACTIVE term (monthly_fee 3000, commitment 12, floor 5000); member A policy REMAINING_MONTHS, member B policy PAID_MONTHS_FLOOR; each has months_paid=3 via three successful payments"
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "a@x.com", full_name: "A" }
              as: Anonymous
              captures: { ma: "$.data.id" }
            - call: "POST /members/${ma}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${ma}"
              captures: { ta: "$.data.id" }
            - call: "POST /terms/${ta}/record-payment"
              payload: { outcome: "SUCCEEDED" }
              as: Support
            - call: "POST /terms/${ta}/record-payment"
              payload: { outcome: "SUCCEEDED" }
              as: Support
            - call: "POST /terms/${ta}/record-payment"
              payload: { outcome: "SUCCEEDED" }
              as: Support
            - call: "POST /members"
              payload: { email: "b@x.com", full_name: "B" }
              as: Anonymous
              captures: { mb: "$.data.id" }
            - call: "POST /members/${mb}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "PAID_MONTHS_FLOOR", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mb}"
              captures: { tb: "$.data.id" }
            - call: "POST /terms/${tb}/record-payment"
              payload: { outcome: "SUCCEEDED" }
              as: Support
            - call: "POST /terms/${tb}/record-payment"
              payload: { outcome: "SUCCEEDED" }
              as: Support
            - call: "POST /terms/${tb}/record-payment"
              payload: { outcome: "SUCCEEDED" }
              as: Support
          trigger:
            - call: "POST /terms/${ta}/cancel"
              payload: {}
              as: Member
              as_user_id: "${ma}"
            - call: "POST /terms/${tb}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mb}"
          assert:
            - "Term.${ta}.cancel_fee_charged_cents == 13500"
            - "Term.${tb}.cancel_fee_charged_cents == 5000"
            - "Term.${ta}.term_status == CANCELLED_EARLY and Term.${tb}.term_status == CANCELLED_EARLY"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: merch_pricing_tier_bundle_cap_interaction
        grounds:
          - calculations.merch_order_pricing
          - entities.MerchOrder.fields.discount_cents
        distinguishing_aspect: |
          Mode (a) combinatorial formula: >=3 inputs with non-linear interaction —
          BAND_PRO tier discount (10% of subtotal, gated on term status in
          {ACTIVE, PAUSED}) plus apparel bundle discount (5% of apparel subtotal
          when apparel qty >= 3), combined then capped by min() at 30% of
          subtotal. Here member 4000 + bundle 1500 = 5500 < cap 12000 so no cap
          binds; a corner-design instance exercises the binding cap.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; member with ACTIVE BAND_PRO term (monthly_fee 30000, pause budget 90)"
            - "Wallet funded to 90000 via pause(2026-09-01, 90 days) then immediate resume (unused=90 -> credit round(30000*90/30)=90000)"
            - "Order lines: 3 x APPAREL @10000, 1 x BAND_ACCESSORY @10000 -> subtotal 40000, apparel_qty=3 (bundle triggers)"
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "p@x.com", full_name: "P" }
              as: Anonymous
              captures: { mp: "$.data.id" }
            - call: "POST /members/${mp}/terms"
              payload: { plan_name: "PRO", monthly_fee_cents: 30000, commitment_months: 12, hardware_tier: "BAND_PRO", upgrade_eligibility_months: 6, pause_days_per_term: 90, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mp}"
            - call: "POST /terms/${mp_term}/pause"
              payload: { start_on: "2026-09-01", days: 90 }
              as: Member
              as_user_id: "${mp}"
            - call: "POST /terms/${mp_term}/resume"
              payload: {}
              as: Member
              as_user_id: "${mp}"
          trigger:
            - call: "POST /members/${mp}/merch-orders"
              payload: { lines: [ { sku: "A1", category: "APPAREL", unit_price_cents: 10000, qty: 3 }, { sku: "B1", category: "BAND_ACCESSORY", unit_price_cents: 10000, qty: 1 } ] }
              as: Member
              as_user_id: "${mp}"
              captures: { o1: "$.data.id" }
          assert:
            - "Order.${o1}.subtotal_cents == 40000"
            - "Order.${o1}.member_discount_cents == 4000"
            - "Order.${o1}.bundle_discount_cents == 1500"
            - "Order.${o1}.discount_cents == 5500 (min(4000 + 1500, 12000))"
            - "Order.${o1}.total_cents == 34500"
            - "Member.${mp}.wallet_credit_cents == 90000 - 34500 == 55500"

      - name: pause_proration_per_window_rounding_order
        grounds:
          - calculations.pause_proration_credit
        distinguishing_aspect: |
          Mode (b) nested rounding: credit is rounded per resumed window then
          added. With monthly_fee 1000, two separate early-resumed windows of
          1 unused day each credit round_half_up(1000/30)=33 + 33 = 66; the
          alternative sum-then-round (round(2000/30)=67) yields a different
          wallet value — the scaffold pins per-window rounding.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; member with ACTIVE term monthly_fee_cents=1000, pause_days_per_term=10"
            - "Window W1: pause start 2026-09-01 for 2 days; advance clock to 2026-09-02; resume (unused = 1 day) -> wallet +33"
            - "Window W2: pause start 2026-09-02 for 2 days; advance clock to 2026-09-03; resume (unused = 1 day) -> wallet +33"
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "r@x.com", full_name: "R" }
              as: Anonymous
              captures: { mr: "$.data.id" }
            - call: "POST /members/${mr}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 1000, commitment_months: 6, hardware_tier: "BAND_STD", upgrade_eligibility_months: 3, pause_days_per_term: 10, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 1000 }
              as: Member
              as_user_id: "${mr}"
            - call: "POST /terms/${mr_term}/pause"
              payload: { start_on: "2026-09-01", days: 2 }
              as: Member
              as_user_id: "${mr}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /terms/${mr_term}/resume"
              payload: {}
              as: Member
              as_user_id: "${mr}"
            - call: "POST /terms/${mr_term}/pause"
              payload: { start_on: "2026-09-02", days: 2 }
              as: Member
              as_user_id: "${mr}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /terms/${mr_term}/resume"
              payload: {}
              as: Member
              as_user_id: "${mr}"
          assert:
            - "Member.${mr}.wallet_credit_cents == 66 (33 + 33 per-window rounding), not 67 (sum-then-round)"
            - "Term pause_days_used == 2 (1 elapsed day per window)"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: term_pause_pastdue_cyclic_loops
        grounds:
          - state_machines.MembershipTerm.ACTIVE_to_PAUSED
          - state_machines.MembershipTerm.PAUSED_to_ACTIVE
          - state_machines.MembershipTerm.ACTIVE_to_PAST_DUE
          - state_machines.MembershipTerm.PAST_DUE_to_ACTIVE
        distinguishing_aspect: |
          MembershipTerm is cyclic on TWO independent loops: ACTIVE<->PAUSED and
          ACTIVE<->PAST_DUE; a single term traverses ACTIVE->PAUSED->ACTIVE->
          PAST_DUE->ACTIVE in one lifecycle without terminating.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; member with ACTIVE term"
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { mc: "$.data.id" }
            - call: "POST /members/${mc}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mc}"
              captures: { tc: "$.data.id" }
            - call: "POST /terms/${tc}/pause"
              payload: { start_on: "2026-09-01", days: 5 }
              as: Member
              as_user_id: "${mc}"
            - call: "POST /terms/${tc}/resume"
              payload: {}
              as: Member
              as_user_id: "${mc}"
          trigger:
            - call: "POST /terms/${tc}/record-payment"
              payload: { outcome: "FAILED" }
              as: Support
            - call: "POST /terms/${tc}/record-payment"
              payload: { outcome: "SUCCEEDED" }
              as: Support
          assert:
            - "After pause: term_status == PAUSED; after resume: ACTIVE"
            - "After FAILED payment: term_status == PAST_DUE and Member.${mc}.member_status == SUSPENDED"
            - "After SUCCEEDED payment: term_status == ACTIVE, months_paid == 1, and Member.${mc}.member_status == ACTIVE (no other PAST_DUE term)"

      - name: metric_set_recompute_cycle_across_two_releases
        grounds:
          - state_machines.DailyMetricSet.CURRENT_to_STALE
          - state_machines.DailyMetricSet.STALE_to_RECOMPUTED
          - state_machines.AlgorithmRelease.PUBLISHED_to_SUPERSEDED
        distinguishing_aspect: |
          DailyMetricSet runs the cycle CURRENT->STALE->RECOMPUTED->STALE->
          RECOMPUTED across two successive publishes on a different entity than
          Rule-3's term loops; the second publish also flips the first release
          PUBLISHED->SUPERSEDED.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; member with ACTIVE term, ACTIVE device, one metric set for 2026-09-01 (avg_hr=100, hrv_ms=100, resting_hr=50, sleep_minutes=480)"
            - "Release v2 published (recompute #1: CURRENT->STALE->RECOMPUTED)"
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "d@x.com", full_name: "D" }
              as: Anonymous
              captures: { md: "$.data.id" }
            - call: "POST /members/${md}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${md}"
              captures: { td: "$.data.id" }
            - call: "POST /devices"
              payload: { member_id: "${md}", term_id: "${td}", serial_number: "SN-D", hardware_tier: "BAND_STD" }
              as: PlatformAdmin
              captures: { dd: "$.data.id" }
            - call: "POST /devices/${dd}/activate"
              payload: {}
              as: Member
              as_user_id: "${md}"
            - call: "POST /devices/${dd}/ingest"
              payload: { day_on: "2026-09-01", avg_hr: 100, hrv_ms: 100, resting_hr: 50, sleep_minutes: 480 }
              as: Member
              as_user_id: "${md}"
            - call: "POST /algorithm-releases"
              payload: { version: 2, requires_member_ack: true, release_notes: "v2" }
              as: PlatformAdmin
              captures: { rv2: "$.data.id" }
            - call: "POST /algorithm-releases/${rv2}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /algorithm-releases"
              payload: { version: 3, requires_member_ack: false, release_notes: "v3" }
              as: PlatformAdmin
              captures: { rv3: "$.data.id" }
          trigger:
            - call: "POST /algorithm-releases/${rv3}/publish"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Metric set row: interpretation_status == RECOMPUTED with algorithm_version == 3 after the second publish (second pass through STALE)"
            - "Release ${rv2}.release_status == SUPERSEDED; Release ${rv3}.release_status == PUBLISHED"
            - "Member.${md}.data_sharing_posture == SUPPRESSED from the v2 publish; v3 (requires_member_ack=false) does not change it"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: publish_cascade_metric_member_dashboard
        grounds:
          - state_machines.AlgorithmRelease.DRAFT_to_PUBLISHED
          - state_machines.DailyMetricSet.STALE_to_RECOMPUTED
          - state_machines.Member.transitions
          - calculations.consent_visibility_projection
        distinguishing_aspect: |
          Depth-3 transitive cascade: publish(release) -> metric sets recomputed
          (hop 1) -> owning member posture SUPPRESSED because recovery changed
          (hop 2) -> the member's row in the team dashboard is suppressed despite
          a GRANTED RECOVERY consent (hop 3); each hop is caused by the previous
          mutation, not by the publish directly.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; member with ACTIVE term, ACTIVE device, metric set day 2026-09-01 (avg_hr=140, hrv_ms=80, resting_hr=50, sleep_minutes=360) computed under baseline v1"
            - "Team with the member added; membership has GRANTED consent for RECOVERY (granted while posture NORMAL)"
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "e@x.com", full_name: "E" }
              as: Anonymous
              captures: { me: "$.data.id" }
            - call: "POST /members/${me}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${me}"
              captures: { te: "$.data.id" }
            - call: "POST /devices"
              payload: { member_id: "${me}", term_id: "${te}", serial_number: "SN-E", hardware_tier: "BAND_STD" }
              as: PlatformAdmin
              captures: { de: "$.data.id" }
            - call: "POST /devices/${de}/activate"
              payload: {}
              as: Member
              as_user_id: "${me}"
            - call: "POST /devices/${de}/ingest"
              payload: { day_on: "2026-09-01", avg_hr: 140, hrv_ms: 80, resting_hr: 50, sleep_minutes: 360 }
              as: Member
              as_user_id: "${me}"
            - call: "POST /teams"
              payload: { name: "T", team_type: "SPORTS", coach_user_id: "coach-1" }
              as: Coach
              as_user_id: "coach-1"
              captures: { team1: "$.data.id" }
            - call: "POST /teams/${team1}/memberships"
              payload: { member_id: "${me}" }
              as: Coach
              as_user_id: "coach-1"
              captures: { tms1: "$.data.id", tms1_v: "$.data.version" }
            - call: "POST /team-memberships/${tms1}/consents"
              payload: { scope: "RECOVERY", action: "GRANT", expected_team_membership_version: "${tms1_v}", expires_on: "2027-01-01" }
              as: Member
              as_user_id: "${me}"
            - call: "POST /algorithm-releases"
              payload: { version: 2, requires_member_ack: true, release_notes: "v2" }
              as: PlatformAdmin
              captures: { rel2: "$.data.id" }
          trigger:
            - call: "POST /algorithm-releases/${rel2}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "GET /teams/${team1}/dashboard"
              payload: {}
              as: Coach
              as_user_id: "coach-1"
              captures: { dash_row_suppressed: "$.data.rows[0].suppressed", dash_row_recovery: "$.data.rows[0].recovery_score" }
          assert:
            - "Dashboard row for membership ${tms1}: suppressed == true and recovery_score == null despite the GRANTED RECOVERY consent"
            - "Member.${me}.data_sharing_posture == SUPPRESSED (hop 2)"
            - "The member's metric set has interpretation_status == RECOMPUTED, algorithm_version == 2 (hop 1)"

      - name: payment_failure_cascade_term_member_merch_block
        grounds:
          - state_machines.MembershipTerm.ACTIVE_to_PAST_DUE
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - errors[ERR_MEMBER_SUSPENDED]
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (record-payment FAILED, not a
          release publish): FAILED -> term PAST_DUE (hop 1) -> member SUSPENDED
          (hop 2); the hop-2 member state then blocks a merch order placement
          with ERR_MEMBER_SUSPENDED, proving the cascade landed.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; member with ACTIVE term (monthly_fee 30000, pause budget 90); wallet funded 90000 via same-day pause(90d)+resume"
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "f@x.com", full_name: "F" }
              as: Anonymous
              captures: { mf: "$.data.id" }
            - call: "POST /members/${mf}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 30000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 90, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mf}"
              captures: { tf: "$.data.id" }
            - call: "POST /terms/${tf}/pause"
              payload: { start_on: "2026-09-01", days: 90 }
              as: Member
              as_user_id: "${mf}"
            - call: "POST /terms/${tf}/resume"
              payload: {}
              as: Member
              as_user_id: "${mf}"
          trigger:
            - call: "POST /terms/${tf}/record-payment"
              payload: { outcome: "FAILED" }
              as: Support
            - call: "POST /members/${mf}/merch-orders"
              payload: { lines: [ { sku: "B1", category: "BAND_ACCESSORY", unit_price_cents: 1000, qty: 1 } ] }
              as: Member
              as_user_id: "${mf}"
              captures: { merch_err: "$.data.error_id" }
          assert:
            - "Term.${tf}.term_status == PAST_DUE (hop 1)"
            - "Member.${mf}.member_status == SUSPENDED (hop 2)"
            - "Merch order placement rejected: error_id == ERR_MEMBER_SUSPENDED (state gate beats wallet check — member is funded)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cancel_paused_term_state_beats_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: cancelling a PAUSED term (state
          violation — cancel allowed only from ACTIVE/PAST_DUE) by a member who
          also has insufficient wallet context must surface the state error
          ERR_INVALID_STATE_TRANSITION / ERR_TERM_NOT_CANCELLABLE, never a
          fiscal error.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; member with PAUSED term (pause opened today for 10 days)"
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "g@x.com", full_name: "G" }
              as: Anonymous
              captures: { mg: "$.data.id" }
            - call: "POST /members/${mg}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mg}"
              captures: { tg: "$.data.id" }
            - call: "POST /terms/${tg}/pause"
              payload: { start_on: "2026-09-01", days: 10 }
              as: Member
              as_user_id: "${mg}"
          trigger:
            - call: "POST /terms/${tg}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mg}"
              captures: { cancel_err: "$.data.error_id" }
          assert:
            - "cancel_err == ERR_TERM_NOT_CANCELLABLE (state-category rejection; term stays PAUSED)"
            - "Term.${tg}.term_status == PAUSED and cancel_fee_charged_cents == null (no fiscal side effect ran)"

      - name: consent_grant_suppression_safety_beats_temporal
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_DATA_SHARING_SUPPRESSED]
        distinguishing_aspect: |
          Different category pair than the state-vs-fiscal instance:
          business_safety vs business_temporal — a consent GRANT carrying a past
          expires_on (temporal violation) while the member is SUPPRESSED (safety
          violation) must surface ERR_DATA_SHARING_SUPPRESSED.
        test_recipe:
          setup:
            - "Clock advanced to 2026-09-02; member SUPPRESSED (published v2 release changed recovery, requires_member_ack, not yet acknowledged)"
            - "Team membership ACTIVE for the member; current membership version captured"
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "h@x.com", full_name: "H" }
              as: Anonymous
              captures: { mh: "$.data.id" }
            - call: "POST /members/${mh}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mh}"
              captures: { th: "$.data.id" }
            - call: "POST /devices"
              payload: { member_id: "${mh}", term_id: "${th}", serial_number: "SN-H", hardware_tier: "BAND_STD" }
              as: PlatformAdmin
              captures: { dh: "$.data.id" }
            - call: "POST /devices/${dh}/activate"
              payload: {}
              as: Member
              as_user_id: "${mh}"
            - call: "POST /devices/${dh}/ingest"
              payload: { day_on: "2026-09-01", avg_hr: 140, hrv_ms: 80, resting_hr: 50, sleep_minutes: 360 }
              as: Member
              as_user_id: "${mh}"
            - call: "POST /algorithm-releases"
              payload: { version: 2, requires_member_ack: true, release_notes: "v2" }
              as: PlatformAdmin
              captures: { relh: "$.data.id" }
            - call: "POST /algorithm-releases/${relh}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /teams"
              payload: { name: "TH", team_type: "SPORTS", coach_user_id: "coach-1" }
              as: Coach
              as_user_id: "coach-1"
              captures: { teamh: "$.data.id" }
            - call: "POST /teams/${teamh}/memberships"
              payload: { member_id: "${mh}" }
              as: Coach
              as_user_id: "coach-1"
              captures: { tmh: "$.data.id", tmh_v: "$.data.version" }
          trigger:
            - call: "POST /team-memberships/${tmh}/consents"
              payload: { scope: "SLEEP", action: "GRANT", expected_team_membership_version: "${tmh_v}", expires_on: "2026-09-01" }
              as: Member
              as_user_id: "${mh}"
              captures: { grant_err: "$.data.error_id" }
          assert:
            - "grant_err == ERR_DATA_SHARING_SUPPRESSED (safety priority 8 beats temporal priority 9; expires_on 2026-09-01 is in the past at clock 2026-09-02, so both validations fail and the higher-priority safety error wins)"
            - "TeamMembership.${tmh}.version unchanged (no side effect ran)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: upgrade_eligibility_inclusive_month_boundary
        grounds:
          - calculations.upgrade_eligibility
          - errors[ERR_UPGRADE_NOT_ELIGIBLE]
        distinguishing_aspect: |
          Boundary on the months-elapsed metric via POST /terms/{id}/upgrade:
          months_elapsed == upgrade_eligibility_months (exactly 6 full calendar
          months) is ELIGIBLE (inclusive >=), while one day short (2026-02-28,
          day-of-month not yet reached) is rejected.
        test_recipe:
          setup:
            - "Term created 2026-09-01 with upgrade_eligibility_months=6; device activated"
            - "Clock advanced to 2027-02-28 (5 full months + 27 days: ineligible) then to 2027-03-01 (exactly 6 full months: eligible)"
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "u@x.com", full_name: "U" }
              as: Anonymous
              captures: { mu: "$.data.id" }
            - call: "POST /members/${mu}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 24, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mu}"
              captures: { tu: "$.data.id" }
            - call: "POST /devices"
              payload: { member_id: "${mu}", term_id: "${tu}", serial_number: "SN-U", hardware_tier: "BAND_STD" }
              as: PlatformAdmin
              captures: { du: "$.data.id" }
            - call: "POST /devices/${du}/activate"
              payload: {}
              as: Member
              as_user_id: "${mu}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /members/${mu}/terms"
              payload: {}
              as: Member
              as_user_id: "${mu}"
              captures: { tu_v_pre: "$.data[0].version" }
          trigger:
            - call: "POST /terms/${tu}/upgrade"
              payload: { expected_term_version: "${tu_v_pre}" }
              as: Member
              as_user_id: "${mu}"
              captures: { up_err: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /terms/${tu}/upgrade"
              payload: { expected_term_version: "${tu_v_pre}" }
              as: Member
              as_user_id: "${mu}"
              captures: { tu_v_post: "$.data.version" }
          assert:
            - "First upgrade call (2027-02-28): up_err == ERR_UPGRADE_NOT_ELIGIBLE (5 full months elapsed < 6)"
            - "Second upgrade call (2027-03-01): succeeds, last_upgrade_on == 2027-03-01, a new PROVISIONED BAND_PRO device exists for member (GET /devices?member_id shows 2 devices)"
            - "Term version incremented exactly once across the successful upgrade: tu_v_post == tu_v_pre + 1"

      - name: pause_budget_equality_boundary
        grounds:
          - calculations.pause_budget_accounting
          - errors[ERR_PAUSE_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Boundary on a different metric (whole-day budget) via a different
          endpoint (POST /terms/{id}/pause): committed + requested ==
          pause_days_per_term (30) is ALLOWED; committed + requested == 31 is
          rejected with ERR_PAUSE_BUDGET_EXCEEDED — strict-greater semantics.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; member with ACTIVE term, pause_days_per_term=30; a SCHEDULED window of 20 days already consumes 20 (starts 2026-09-10)"
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "b@x.com", full_name: "B" }
              as: Anonymous
              captures: { mb: "$.data.id" }
            - call: "POST /members/${mb}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mb}"
              captures: { tb: "$.data.id" }
            - call: "POST /terms/${tb}/pause"
              payload: { start_on: "2026-09-10", days: 20 }
              as: Member
              as_user_id: "${mb}"
          trigger:
            - call: "POST /terms/${tb}/pause"
              payload: { start_on: "2026-09-30", days: 10 }
              as: Member
              as_user_id: "${mb}"
            - call: "POST /terms/${tb}/pause"
              payload: { start_on: "2026-10-10", days: 1 }
              as: Member
              as_user_id: "${mb}"
              captures: { pause_err: "$.data.error_id" }
          assert:
            - "Second pause (20+10 == 30): accepted; term now has 2 windows"
            - "Third pause (30+1 == 31): pause_err == ERR_PAUSE_BUDGET_EXCEEDED"
            - "Note the second window [2026-09-30, 2026-10-10) does not overlap the first [2026-09-10, 2026-09-30): adjacency allowed"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: replacement_decide_requires_device_faulty_and_term_open
        grounds:
          - state_machines.ReplacementRequest.OPEN_to_APPROVED
          - errors[ERR_DEVICE_NOT_FAULTY]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          Entity pair Device -> ReplacementRequest: deciding APPROVE on a request
          whose device is not SUSPECT_FAULT is rejected even though the request
          itself is OPEN; the dependency is exercised by rejecting a first
          request NO_FAULT (device returns to ACTIVE), opening a second request —
          which re-faults the device — then deciding the FIRST (already REJECTED)
          versus a fresh OPEN one after the device was restored.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; member with ACTIVE term and ACTIVE device"
            - "Request R1 opened (device -> SUSPECT_FAULT), then R1 decided REJECT with NO_FAULT (device -> ACTIVE)"
            - "Request R2 opened (device -> SUSPECT_FAULT again)"
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "x@x.com", full_name: "X" }
              as: Anonymous
              captures: { mx: "$.data.id" }
            - call: "POST /members/${mx}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mx}"
              captures: { tx: "$.data.id" }
            - call: "POST /devices"
              payload: { member_id: "${mx}", term_id: "${tx}", serial_number: "SN-X", hardware_tier: "BAND_STD" }
              as: PlatformAdmin
              captures: { dx: "$.data.id" }
            - call: "POST /devices/${dx}/activate"
              payload: {}
              as: Member
              as_user_id: "${mx}"
            - call: "POST /devices/${dx}/replacement-requests"
              payload: { reason: "HARDWARE_FAILURE" }
              as: Member
              as_user_id: "${mx}"
              captures: { r1: "$.data.id" }
            - call: "POST /replacement-requests/${r1}/decide"
              payload: { decision: "REJECT", diagnosis: "NO_FAULT" }
              as: Support
            - call: "POST /devices/${dx}/replacement-requests"
              payload: { reason: "SENSOR_DRIFT" }
              as: Member
              as_user_id: "${mx}"
              captures: { r2: "$.data.id" }
          trigger:
            - call: "POST /replacement-requests/${r2}/decide"
              payload: { decision: "APPROVE" }
              as: Support
              captures: { r2_repl: "$.data.replacement_device_id" }
          assert:
            - "R2 approve succeeds: device ${dx} -> RMA_INBOUND; replacement_device_id set to a new PROVISIONED device for member ${mx}, term ${tx}"
            - "R1 remains REJECTED (terminal); a second decide on ${r1} would fail ERR_INVALID_STATE_TRANSITION"
            - "GET /devices/${dx}: device_status == RMA_INBOUND"

      - name: dashboard_row_gated_by_member_term_status
        grounds:
          - calculations.consent_visibility_projection
          - state_machines.MembershipTerm.ACTIVE_to_CANCELLED_EARLY
        distinguishing_aspect: |
          Different entity pair (TeamMembership x MembershipTerm): the coach
          dashboard row for an ACTIVE membership disappears entirely once the
          member's latest term flips to CANCELLED_EARLY, even though the
          membership and its GRANTED consent are untouched.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; member with ACTIVE term, device ACTIVE, one metric set ingested (so dashboard has values)"
            - "Team with ACTIVE membership; RECOVERY consent GRANTED"
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "y@x.com", full_name: "Y" }
              as: Anonymous
              captures: { my: "$.data.id" }
            - call: "POST /members/${my}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${my}"
              captures: { ty: "$.data.id" }
            - call: "POST /devices"
              payload: { member_id: "${my}", term_id: "${ty}", serial_number: "SN-Y", hardware_tier: "BAND_STD" }
              as: PlatformAdmin
              captures: { dy: "$.data.id" }
            - call: "POST /devices/${dy}/activate"
              payload: {}
              as: Member
              as_user_id: "${my}"
            - call: "POST /devices/${dy}/ingest"
              payload: { day_on: "2026-09-01", avg_hr: 100, hrv_ms: 100, resting_hr: 50, sleep_minutes: 480 }
              as: Member
              as_user_id: "${my}"
            - call: "POST /teams"
              payload: { name: "TY", team_type: "CORPORATE_WELLNESS", coach_user_id: "coach-2" }
              as: Coach
              as_user_id: "coach-2"
              captures: { teamy: "$.data.id" }
            - call: "POST /teams/${teamy}/memberships"
              payload: { member_id: "${my}" }
              as: Coach
              as_user_id: "coach-2"
              captures: { tmy: "$.data.id", tmy_v: "$.data.version" }
            - call: "POST /team-memberships/${tmy}/consents"
              payload: { scope: "RECOVERY", action: "GRANT", expected_team_membership_version: "${tmy_v}" }
              as: Member
              as_user_id: "${my}"
          trigger:
            - call: "POST /terms/${ty}/cancel"
              payload: {}
              as: Member
              as_user_id: "${my}"
            - call: "GET /teams/${teamy}/dashboard"
              payload: {}
              as: Coach
              as_user_id: "coach-2"
              captures: { dash_rows: "$.data.rows" }
          assert:
            - "Before cancel: dashboard rows length 1 with recovery_score == 67 (baseline v1: round(100*100/150) = 67)"
            - "After cancel: dashboard rows length 0 (membership ACTIVE, consent GRANTED, but latest term CANCELLED_EARLY omits the row)"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: pause_windows_half_open_adjacency_allowed
        grounds:
          - calculations.continuity_window_overlap
          - errors[ERR_PAUSE_WINDOW_OVERLAP]
          - validations[priority=9]
        distinguishing_aspect: |
          Half-open interval semantics on MembershipTerm pause windows: window
          [2026-09-10, 2026-09-20) and a new window starting exactly 2026-09-20
          (adjacent, gap 0) is ALLOWED; a new window starting 2026-09-19
          (one-day overlap) is rejected with ERR_PAUSE_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; member with ACTIVE term (pause budget 60); existing SCHEDULED window [2026-09-10, 2026-09-20)"
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "w@x.com", full_name: "W" }
              as: Anonymous
              captures: { mw: "$.data.id" }
            - call: "POST /members/${mw}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 60, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mw}"
              captures: { tw: "$.data.id" }
            - call: "POST /terms/${tw}/pause"
              payload: { start_on: "2026-09-10", days: 10 }
              as: Member
              as_user_id: "${mw}"
          trigger:
            - call: "POST /terms/${tw}/pause"
              payload: { start_on: "2026-09-20", days: 5 }
              as: Member
              as_user_id: "${mw}"
            - call: "POST /terms/${tw}/pause"
              payload: { start_on: "2026-09-19", days: 2 }
              as: Member
              as_user_id: "${mw}"
              captures: { ov_err: "$.data.error_id" }
          assert:
            - "Adjacent window [2026-09-20, 2026-09-25): accepted (term now has 2 windows)"
            - "Overlapping window [2026-09-19, 2026-09-21): ov_err == ERR_PAUSE_WINDOW_OVERLAP"

      - name: device_continuity_closed_interval_same_day_conflicts
        grounds:
          - calculations.continuity_window_overlap
          - errors[ERR_CONTINUITY_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Different interval semantics on a different resource: Device continuity
          uses CLOSED intervals, so a second non-replacement device activation on
          the same calendar day the first device activated is an OVERLAP (unlike
          half-open pause adjacency); the activation is rejected with
          ERR_CONTINUITY_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; member with ACTIVE term; device D1 ACTIVE (continuity [2026-09-01, +inf)); second PROVISIONED device D2 for the same member/term"
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "v@x.com", full_name: "V" }
              as: Anonymous
              captures: { mv: "$.data.id" }
            - call: "POST /members/${mv}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mv}"
              captures: { tv: "$.data.id" }
            - call: "POST /devices"
              payload: { member_id: "${mv}", term_id: "${tv}", serial_number: "SN-V1", hardware_tier: "BAND_STD" }
              as: PlatformAdmin
              captures: { dv1: "$.data.id" }
            - call: "POST /devices/${dv1}/activate"
              payload: {}
              as: Member
              as_user_id: "${mv}"
            - call: "POST /devices"
              payload: { member_id: "${mv}", term_id: "${tv}", serial_number: "SN-V2", hardware_tier: "BAND_STD" }
              as: PlatformAdmin
              captures: { dv2: "$.data.id" }
          trigger:
            - call: "POST /devices/${dv2}/activate"
              payload: {}
              as: Member
              as_user_id: "${mv}"
              captures: { act_err: "$.data.error_id" }
          assert:
            - "act_err == ERR_CONTINUITY_WINDOW_OVERLAP (D1's closed window covers 2026-09-01)"
            - "Device.${dv2}.device_status remains PROVISIONED"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: wallet_conserved_across_merch_order_and_cancel
        grounds:
          - state_machines.MerchOrder.PAID_to_CANCELLED
          - calculations.merch_order_pricing
          - entities.Member.fields.wallet_credit_cents
        distinguishing_aspect: |
          Conserved quantity: Member.wallet_credit_cents. Placement debits
          total_cents and cancel credits exactly total_cents, so
          wallet_after(place+cancel) == wallet_before — no drift in either
          direction across the compensating pair.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; member with ACTIVE BAND_STD term (monthly_fee 30000, pause budget 90); wallet funded to 90000 via pause(2026-09-01, 90d)+resume"
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "z@x.com", full_name: "Z" }
              as: Anonymous
              captures: { mz: "$.data.id" }
            - call: "POST /members/${mz}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 30000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 90, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mz}"
              captures: { tz: "$.data.id" }
            - call: "POST /terms/${tz}/pause"
              payload: { start_on: "2026-09-01", days: 90 }
              as: Member
              as_user_id: "${mz}"
            - call: "POST /terms/${tz}/resume"
              payload: {}
              as: Member
              as_user_id: "${mz}"
          trigger:
            - call: "POST /members/${mz}/merch-orders"
              payload: { lines: [ { sku: "S1", category: "BAND_ACCESSORY", unit_price_cents: 12345, qty: 2 } ] }
              as: Member
              as_user_id: "${mz}"
              captures: { oz: "$.data.id", oz_total: "$.data.total_cents" }
            - call: "POST /merch-orders/${oz}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mz}"
          assert:
            - "Order.${oz}: subtotal 24690, BAND_STD member discount 0, no bundle, total_cents == 24690"
            - "Wallet after placement: 90000 - 24690 == 65310"
            - "Wallet after cancel: 90000 (compensating credit equals the debit exactly)"
            - "Order.${oz}.order_status == CANCELLED"

      - name: continuity_days_conserved_across_replacement_swap
        grounds:
          - calculations.continuity_window_overlap
          - state_machines.Device.RMA_INBOUND_to_RETIRED
          - state_machines.Device.PROVISIONED_to_ACTIVE
        distinguishing_aspect: |
          Different conserved quantity: covered calendar days across a member's
          device continuity windows. The swap pins
          continuity_start_on(replacement) == continuity_end_on(faulty) + 1, so
          the union of windows has zero gap and zero overlap days after
          retire+activate — total covered span is contiguous.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; member with ACTIVE term; device D activated 2026-09-01 (continuity [2026-09-01, +inf))"
            - "Replacement request opened and APPROVED on 2026-09-01 (device -> RMA_INBOUND, replacement R PROVISIONED)"
            - "Clock advanced to 2026-09-03; receive-return retires D with continuity_end_on = 2026-09-03"
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "q@x.com", full_name: "Q" }
              as: Anonymous
              captures: { mq: "$.data.id" }
            - call: "POST /members/${mq}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mq}"
              captures: { tq: "$.data.id" }
            - call: "POST /devices"
              payload: { member_id: "${mq}", term_id: "${tq}", serial_number: "SN-Q1", hardware_tier: "BAND_STD" }
              as: PlatformAdmin
              captures: { dq: "$.data.id" }
            - call: "POST /devices/${dq}/activate"
              payload: {}
              as: Member
              as_user_id: "${mq}"
            - call: "POST /devices/${dq}/replacement-requests"
              payload: { reason: "BATTERY_DRAIN" }
              as: Member
              as_user_id: "${mq}"
              captures: { rq: "$.data.id" }
            - call: "POST /replacement-requests/${rq}/decide"
              payload: { decision: "APPROVE" }
              as: Support
              captures: { repl: "$.data.replacement_device_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /replacement-requests/${rq}/receive-return"
              payload: {}
              as: Support
          trigger:
            - call: "POST /devices/${repl}/activate"
              payload: {}
              as: Member
