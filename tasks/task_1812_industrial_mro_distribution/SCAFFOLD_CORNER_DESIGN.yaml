      - name: agreement_activate_after_period_expired
        claim_type: violation_to_error
        grounds: ["errors[ERR_AGREEMENT_PERIOD_EXPIRED]", "validations[priority=8]"]
        distinguishing_aspect: "Activating an agreement whose period_end is before the default clock (2026-08-01) fails with ERR_AGREEMENT_PERIOD_EXPIRED."
        test_recipe:
