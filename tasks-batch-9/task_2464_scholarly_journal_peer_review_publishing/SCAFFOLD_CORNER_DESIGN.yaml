      - name: embargo_request_rejected_for_cc_by_then_accepted_for_green
        claim_type: conditional
        grounds:
          - validations[priority=31]
          - errors[ERR_EMBARGO_NOT_APPLICABLE]
          - endpoints[POST /manuscripts/{id}/licensing]
        distinguishing_aspect: |
          The embargo rule is conditional on the licence, not universal: embargo_requested true is
          refused with 409 ERR_EMBARGO_NOT_APPLICABLE while the licence is CC_BY, and the identical
          request succeeds once the same call selects GREEN_SELF_ARCHIVE, proving the rule keys on the
          licence in the request rather than on the manuscript's stored licence.
        test_recipe:
          setup:
            - "One journal and one author with one SUBMITTED CC_BY manuscript; no screening or assignment is needed because licensing is author-driven."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /journals"
              payload: { name: "Journal of Licensing Options", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { j_id: $.data.id }
            - call: "POST /authors"
              payload: { email: "author1@x.org", full_name: "Author One", affiliation: "Univ Gamma" }
              as: SystemAdmin
              captures: { au_id: $.data.id }
            - call: "POST /manuscripts"
              payload: { journal_id: "${j_id}", corresponding_author_id: "${au_id}", title: "Licensing Paper", subject_area: "ONCOLOGY", oa_license: "CC_BY", page_count: 16, figure_count: 2, data_availability_statement: "Data at repository DOI 10.9999/lp" }
              as: Author
              as_user_id: "${au_id}"
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /manuscripts/${m_id}/licensing"
              payload: { oa_license: "CC_BY", embargo_requested: true }
              as: Author
              as_user_id: "${au_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /manuscripts/${m_id}/licensing"
              payload: { oa_license: "GREEN_SELF_ARCHIVE", embargo_requested: true }
              as: Author
              as_user_id: "${au_id}"
          assert:
            - "the first call returns HTTP 409 with data.error_id == ERR_EMBARGO_NOT_APPLICABLE"
            - "after the first call Manuscript.${m_id}.oa_license == CC_BY"
            - "the second call returns HTTP 200"
            - "after the second call Manuscript.${m_id}.oa_license == GREEN_SELF_ARCHIVE"
            - "Manuscript.${m_id}.embargo_end_date == null (the projection only runs at publication)"
            - "Manuscript.${m_id}.status == SUBMITTED"

