  # =====================================================================================
  # Errors already exercised by §1.8 — stubs
  # =====================================================================================
  - section: errors
    instances:
      - name: error_trial_not_completed_on_contract
        claim_type: violation_to_error
        grounds: ["errors[ERR_TRIAL_NOT_COMPLETED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / trial_referential_beats_artist_constraint
          rationale: "ERR_TRIAL_NOT_COMPLETED is asserted as the winning error of that §1.8 priority-conflict instance."
      - name: error_invalid_state_on_balance_before_deposit
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_balance_payment
          rationale: "ERR_INVALID_STATE is the asserted failure of that §1.8 state-vs-fiscal instance."
      - name: error_assignment_window_conflict
        claim_type: violation_to_error
        grounds: ["errors[ERR_ASSIGNMENT_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / assignment_overlap_with_travel_buffer
          rationale: "Buffer-overlap rejection is the asserted outcome of that §1.8 overlap instance."
      - name: error_trial_window_conflict
        claim_type: violation_to_error
        grounds: ["errors[ERR_TRIAL_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / trial_overlap_closed_open_no_buffer
          rationale: "Trial overlap rejection is the asserted outcome of that §1.8 overlap instance."
      - name: error_deposit_not_settled_balance_path
        claim_type: violation_to_error
        grounds: ["errors[ERR_DEPOSIT_NOT_SETTLED]"]
        distinguishing_aspect: "BALANCE payment while balance_status is DUE (assignment completed) but deposit somehow not PAID is unreachable; instead test the reachable path: deposit unpaid + balance NOT_DUE is covered by state in §1.8. This stub documents ERR_DEPOSIT_NOT_SETTLED is only reachable when deposit unpaid yet balance collectible — not constructible, so folded into the state check."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_balance_payment
          rationale: "The deposit-not-settled fiscal guard sits behind the P6 state check exercised in that §1.8 instance; with balance NOT_DUE the state error fires first, and balance can only become DUE after deposit is PAID, so the fiscal-only path is structurally shadowed."
