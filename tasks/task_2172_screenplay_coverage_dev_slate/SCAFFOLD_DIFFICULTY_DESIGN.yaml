  - rule_id: compensating_invariant
    instances:
      - name: writer_committed_fee_ledger_conserved_across_attach_then_terminate
        grounds:
          - calculations.writer_commitment_ledger
          - state_machines.WriterEngagement.ATTACHED_to_TERMINATED
          - state_machines.MilestonePayment.SCHEDULED_to_VOIDED
          - entities.Writer.fields.committed_fee_cents
          - entities.Writer.fields.paid_fee_cents
        distinguishing_aspect: |
          Conserved quantity of the MONEY kind: Writer.committed_fee_cents, pinned as
          sum(MilestonePayment.gross_amount_cents where status IN {SCHEDULED, DUE, APPROVED}) over
          the writer's engagements. attach(E) raises it 0 -> 10000003 and the compensating
          terminate(E) returns it to exactly 0 with zero drift, while paid_fee_cents stays 0
          throughout.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "A CLEAR DRAMA property carries an ACTIVE option and a DevelopmentProject with budget_cents 2000000000."
            - "Guild writer W1 started at committed_fee_cents 0 / paid_fee_cents 0 / active_engagement_count 0, and now holds an ATTACHED ORIGINAL_DRAFT engagement of 10000003 cents with milestones 3000000 (DUE) / 4000003 (SCHEDULED) / 3000000 (SCHEDULED), so committed_fee_cents is 10000003."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SlateAdmin
            - call: "POST /literary-properties"
              payload: { title: "Ledger Zero", material_type: "SPEC_SCRIPT", source_author_name: "B. Larsen", genre: "DRAMA", logline: "An accountant reverses her own entry." }
              as: StoryEditor
              captures: { p_id: "$.data.id" }
