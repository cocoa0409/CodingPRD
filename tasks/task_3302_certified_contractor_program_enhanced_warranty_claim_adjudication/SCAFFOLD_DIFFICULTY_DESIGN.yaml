  - rule_id: resource_temporal_overlap
    instances:
      - name: lead_territory_half_open_windows_touching_allowed_overlap_rejected
        grounds:
          - validations[priority=8]
          - entities.LeadAssignment.fields.start_date
        distinguishing_aspect: |
          Half-open interval semantics on LeadAssignment: window B starting exactly
          at window A's end_date is accepted (touching, no overlap), while window C
          strictly inside A is rejected with ERR_TERRITORY_OVERLAP — geometric
          adjacency semantics on the distributor+territory resource.
        test_recipe:
          setup:
            - "BRONZE contractor with ACTIVE cert in territory T1; distributor covering T1 with pool_total 3; existing ASSIGNED window [2026-10-01, 2026-11-01)"
          setup_api_calls:
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/contractors", payload: { legal_name: "Terr Co", license_number: "LIC-T", license_expiry: "2035-01-01", insurance_expiry: "2035-01-01", territory_codes: ["T1"] }, as: ProgramAdmin, captures: { ct_id: $.data.id } }
            - { call: "POST /program/training-courses", payload: { title: "Basics", credits: 4, validity_months: 36 }, as: ProgramAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /program/training-enrollments", payload: { contractor_id: "${ct_id}", course_id: "${course_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /program/training-enrollments/${enr_id}/complete", payload: { completed_at: "2026-09-01" }, as: ProgramAdmin }
            - { call: "POST /program/certifications", payload: { contractor_id: "${ct_id}", tier: "BRONZE" }, as: Contractor, as_user_id: "${ct_id}", captures: { cert_id: $.data.id } }
            - { call: "POST /program/certifications/${cert_id}/verify", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - { call: "POST /program/distributors", payload: { name: "Dist T", territory_codes: ["T1"], lead_pool_total: 3 }, as: ProgramAdmin, captures: { dist_id: $.data.id } }
            - { call: "POST /program/lead-assignments", payload: { distributor_id: "${dist_id}", contractor_id: "${ct_id}", territory_code: "T1", required_tier: "BRONZE", start_date: "2026-10-01", end_date: "2026-11-01" }, as: Distributor, as_user_id: "${dist_id}", captures: { lead_a: $.data.id } }
          trigger:
            - { call: "POST /program/lead-assignments", payload: { distributor_id: "${dist_id}", contractor_id: "${ct_id}", territory_code: "T1", required_tier: "BRONZE", start_date: "2026-11-01", end_date: "2026-12-01" }, as: Distributor, as_user_id: "${dist_id}", captures: { lead_b: $.data.id } }
            - call: "POST /program/lead-assignments"
              payload: { distributor_id: "${dist_id}", contractor_id: "${ct_id}", territory_code: "T1", required_tier: "BRONZE", start_date: "2026-10-15", end_date: "2026-10-20" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { err: $.data.error_id }
          assert:
            - "window [2026-11-01, 2026-12-01) succeeds with 201 (touching at end == start is not an overlap under half-open semantics)"
            - "window [2026-10-15, 2026-10-20) fails with 409 ERR_TERRITORY_OVERLAP (strict interior overlap)"

      - name: inspector_daily_capacity_third_ok_fourth_rejected
        grounds:
          - validations[priority=8]
          - state_machines.InspectionOrder.REQUESTED_to_SCHEDULED
        distinguishing_aspect: |
          Aggregate-capacity semantics (different from geometric interval overlap):
          an inspector-day resource admits exactly 3 SCHEDULED orders regardless of
