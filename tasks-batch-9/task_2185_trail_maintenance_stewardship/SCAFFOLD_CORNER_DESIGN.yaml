      - name: wet_threshold_is_inclusive_at_the_configured_index
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.TrailSegment.ANY_to_WET_RESTRICTED
          - entities.LandManager.fields.wet_threshold_index
          - entities.TrailSegment.fields.latest_soil_moisture_index
        distinguishing_aspect: |
          The wet-weather rule fires at soil_moisture_index >= wet_threshold_index, not >: an
          observation of 0.64 leaves the segment OPEN while 0.65 - exactly the configured 0.65 -
          flips it to WET_RESTRICTED.
        test_recipe:
          setup:
            - "A land manager with wet_threshold_index 0.65 and the Alder Creek segment at posture OPEN."
          setup_api_calls:
            - call: "POST /stewardship/land-managers"
              payload: { agency_name: "Cascade National Forest", jurisdiction_code: "USFS-R6-ALDER", permit_required: true, permit_lead_days: 14, max_party_size: 20, wet_threshold_index: 0.65, requires_engineering_review: true, requires_certified_sawyer: true }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lm_id: $.data.id }
            - call: "POST /stewardship/trail-segments"
              payload: { land_manager_id: "${lm_id}", name: "Alder Creek", length_miles: 4.2, surface_class: "NATIVE_SOIL", traffic_class: "MODERATE" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { seg_id: $.data.id }
          trigger:
            - call: "POST /stewardship/_weather/observations"
              payload: { trail_segment_id: "${seg_id}", soil_moisture_index: 0.64, observed_at: "2026-08-01T00:00:00.000Z" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { p_under: $.data.posture, idx_under: $.data.latest_soil_moisture_index }
            - call: "POST /stewardship/_weather/observations"
              payload: { trail_segment_id: "${seg_id}", soil_moisture_index: 0.65, observed_at: "2026-08-01T00:00:00.000Z" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { p_at: $.data.posture, idx_at: $.data.latest_soil_moisture_index, obs_at: $.data.latest_moisture_observed_at }
          assert:
            - "${idx_under} == 0.64 and ${p_under} == OPEN"
            - "${idx_at} == 0.65 and ${p_at} == WET_RESTRICTED"
            - "${obs_at} == 2026-08-01T00:00:00.000Z"

  - section: consistency_model
    instances:
      - name: cascade_results_are_visible_in_the_triggering_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.AdoptionAgreement.ACTIVE_to_TERMINATED
          - state_machines.WorkPlan.APPROVED_to_CLOSED
          - state_machines.WorkParty.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          The consistency model is immediate: the terminate call's own 200 response already shows
          status TERMINATED, and a read issued straight afterwards - with no intervening write and no
          delay - shows the plan CLOSED, the party CANCELLED and the shift WITHDRAWN.
