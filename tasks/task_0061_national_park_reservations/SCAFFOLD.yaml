# =============================================================================
# National Park Reservations Platform (Recreation.gov style) — seed tables (v1)
# Difficulty: Expert
# =============================================================================

scenario: |
  National Park Reservations (Recreation.gov style): timed entry, lottery
  permits (Half Dome/Wave), Backcountry permits, campground reservations and
  waitlist, America the Beautiful Pass, Group Site.

domain_name: national-park-reservations
api_prefix: /v1

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - idempotency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  entity_count: 13
  state_machine_count: 6
  calculation_count: 7
  validation_layers: 6
  endpoint_count: 33
  error_code_count: 26
  role_count: 4

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Clock
    parent: null
    common_fields: false
    description: "Singleton simulation clock. Defines server 'now' for all temporal checks."
    fields:
      - { name: id, type: string, source: system, description: "Always the literal 'clock'." }
      - { name: created_at, type: datetime, source: system, description: "When the clock row was first created." }
      - { name: now_utc, type: datetime, source: input, description: "Current simulated instant (ISO-8601 UTC). All booking-window, release, lead-time, lottery, and waitlist-expiry checks compare against this." }

  # ---------------------------------------------------------------------------
  - name: Account
    parent: null
    common_fields: true
    description: "A registered visitor or staff principal."
    fields:
      - { name: id, type: string, source: system, description: "Server-minted account id." }
      - { name: email, type: string, source: input, description: "Login email; unique across accounts.", constraints: "unique" }
      - { name: full_name, type: string, source: input, description: "Display name." }
      - { name: birth_date, type: string, source: input, description: "ISO date (YYYY-MM-DD); used for senior-pass age checks." }
      - { name: role, type: enum, source: input, description: "visitor | ranger | park_admin | finance", default: visitor, constraints: "one of visitor, ranger, park_admin, finance" }
      - { name: home_park_id, type: string, source: input, description: "FK -> Park.id; required when role is ranger or park_admin, else null." }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Refundable-to-credit balance in integer cents; never negative; increased by refunds destined to credit.", default: 0 }
      - { name: status, type: enum, source: system, description: "active | suspended", default: active }

  # ---------------------------------------------------------------------------
  - name: Park
    parent: null
    common_fields: true
    description: "A national park unit with its own timezone and policy knobs."
    fields:
      - { name: id, type: string, source: system, description: "Server-minted park id." }
      - { name: code, type: string, source: input, description: "Short park code e.g. YOSE; unique.", constraints: "unique" }
      - { name: name, type: string, source: input, description: "Full park name." }
      - { name: utc_offset_minutes, type: integer, source: input, description: "Fixed park-local offset from UTC in minutes (e.g. -480 for PST). Park-local civil times convert to UTC by subtracting this offset.", default: 0 }
      - { name: timed_entry_required, type: boolean, source: input, description: "Whether vehicles require a timed-entry reservation.", default: false }
      - { name: status, type: enum, source: input, description: "open | seasonal_closed", default: open }

  # ---------------------------------------------------------------------------
  - name: AtbPass
    parent: null
    common_fields: true
    description: "An America the Beautiful annual interagency pass tied to an account."
    fields:
      - { name: id, type: string, source: system, description: "Server-minted pass id." }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the pass holder." }
      - { name: pass_type, type: enum, source: input, description: "annual | senior_annual | senior_lifetime | military | access", constraints: "one of annual, senior_annual, senior_lifetime, military, access" }
      - { name: price_cents, type: integer, source: computed, description: "Snapshot of price at purchase (see CALC atb_price); 0 for free types." }
      - { name: valid_from, type: string, source: input, description: "ISO date the pass becomes valid." }
      - { name: valid_to, type: string, source: computed, description: "ISO date the pass expires (valid_from + 365 days for annual types); null for senior_lifetime (never expires)." }
      - { name: status, type: enum, source: system, description: "active | expired | voided", default: active }
      - { name: payment_id, type: string, source: system, description: "FK -> Payment.id; the captured purchase payment (null for free pass types)." }

  # ---------------------------------------------------------------------------
  - name: TimedEntrySlot
    parent: null
    common_fields: true
    description: "An inventory bucket of vehicle timed-entry reservations for a park/date/window."
    fields:
      - { name: id, type: string, source: system, description: "Server-minted slot id." }
      - { name: park_id, type: string, source: input, description: "FK -> Park.id; the park this slot belongs to." }
      - { name: entry_date, type: string, source: input, description: "ISO date (park-local) the slot admits vehicles." }
      - { name: window_start_local, type: string, source: input, description: "Park-local HH:MM the entry window opens (inclusive)." }
      - { name: window_end_local, type: string, source: input, description: "Park-local HH:MM the entry window closes (exclusive)." }
      - { name: capacity, type: integer, source: input, description: "Total vehicle slots." }
      - { name: held_count, type: integer, source: computed, description: "Reservations currently in held status; held_count + booked_count <= capacity.", default: 0 }
      - { name: booked_count, type: integer, source: computed, description: "Reservations currently confirmed/checked_in.", default: 0 }
      - { name: release_at, type: datetime, source: input, description: "UTC instant the slot opens for booking (rolling daily release)." }
      - { name: entry_fee_cents, type: integer, source: input, description: "Per-vehicle reservation fee; non-refundable; charged regardless of ATB pass.", default: 200 }

  # ---------------------------------------------------------------------------
  - name: TimedEntryReservation
    parent: null
    common_fields: true
    description: "A single vehicle's timed-entry booking against a slot."
    fields:
      - { name: id, type: string, source: system, description: "Server-minted reservation id." }
      - { name: slot_id, type: string, source: input, description: "FK -> TimedEntrySlot.id; the booked slot." }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the booking visitor." }
      - { name: vehicle_plate, type: string, source: input, description: "Vehicle license plate; non-empty." }
      - { name: status, type: enum, source: system, description: "held | confirmed | checked_in | cancelled | expired | no_show", default: held }
      - { name: hold_expires_at, type: datetime, source: system, description: "UTC instant the hold lapses; set on create to now+15m; null once confirmed/terminal." }
      - { name: fee_cents, type: integer, source: computed, description: "Reservation fee charged (see CALC timed_entry_fee); non-refundable." }
      - { name: payment_id, type: string, source: system, description: "FK -> Payment.id; the authorized/captured fee payment." }

  # ---------------------------------------------------------------------------
  - name: LotteryDraw
    parent: null
    common_fields: true
    description: "A named lottery for a high-demand objective (Half Dome cables, The Wave)."
    fields:
      - { name: id, type: string, source: system, description: "Server-minted draw id." }
      - { name: park_id, type: string, source: input, description: "FK -> Park.id; the park hosting the objective." }
      - { name: objective, type: string, source: input, description: "Objective label e.g. half_dome_cables, the_wave." }
      - { name: use_date, type: string, source: input, description: "ISO date the awarded permit is valid for." }
      - { name: daily_quota, type: integer, source: input, description: "Total permit persons awarded for use_date." }
      - { name: awarded_count, type: integer, source: computed, description: "Sum of party_size over applications in won/awarded status; never exceeds daily_quota.", default: 0 }
      - { name: application_open_at, type: datetime, source: input, description: "UTC instant applications open." }
      - { name: application_close_at, type: datetime, source: input, description: "UTC instant applications close (exclusive)." }
      - { name: draw_at, type: datetime, source: input, description: "UTC instant the draw may be run." }
      - { name: application_fee_cents, type: integer, source: input, description: "Non-refundable per-application fee.", default: 1000 }
      - { name: permit_fee_per_person_cents, type: integer, source: input, description: "Per-person permit fee charged to winners on award acceptance." }
      - { name: max_group_size, type: integer, source: input, description: "Maximum party_size per application.", default: 6 }
      - { name: status, type: enum, source: system, description: "accepting | drawn | settled", default: accepting }

  # ---------------------------------------------------------------------------
  - name: LotteryApplication
    parent: null
    common_fields: true
    description: "A single account's entry into a LotteryDraw, requesting N persons."
    fields:
      - { name: id, type: string, source: system, description: "Server-minted application id." }
      - { name: draw_id, type: string, source: input, description: "FK -> LotteryDraw.id; the draw applied to." }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the applicant." }
      - { name: party_size, type: integer, source: input, description: "Persons requested; 1..draw.max_group_size." }
      - { name: preference_rank, type: integer, source: input, description: "Applicant priority weight, lower wins first; defaults to 9999 when omitted.", default: 9999 }
      - { name: status, type: enum, source: system, description: "submitted | won | lost | awarded | declined | withdrawn", default: submitted }
      - { name: application_fee_cents, type: integer, source: computed, description: "Snapshot of draw.application_fee_cents; non-refundable." }
      - { name: application_payment_id, type: string, source: system, description: "FK -> Payment.id; the captured application fee." }
      - { name: permit_payment_id, type: string, source: system, description: "FK -> Payment.id; the captured permit fee (set on award acceptance), else null." }
      - { name: award_accept_deadline, type: datetime, source: system, description: "UTC instant by which a won application must accept; set to draw_at+72h on win, else null." }

  # ---------------------------------------------------------------------------
  - name: Trailhead
    parent: null
    common_fields: true
    description: "A wilderness entry point with a per-date party exit quota."
    fields:
      - { name: id, type: string, source: system, description: "Server-minted trailhead id." }
      - { name: park_id, type: string, source: input, description: "FK -> Park.id; the park the trailhead is in." }
      - { name: name, type: string, source: input, description: "Trailhead name." }
      - { name: daily_exit_quota, type: integer, source: input, description: "Max parties that may start (enter) per entry_date." }
      - { name: exit_used_by_date, type: object, source: computed, description: "Map of entry_date -> count of confirmed permits starting that date; each value <= daily_exit_quota.", default: "{}" }
      - { name: reservation_fee_cents, type: integer, source: input, description: "Flat per-permit reservation fee; non-refundable.", default: 500 }
      - { name: per_person_per_night_cents, type: integer, source: input, description: "Refundable per-person per-night component.", default: 800 }

  # ---------------------------------------------------------------------------
  - name: WildernessZone
    parent: null
    common_fields: true
    description: "A backcountry zone with a per-night party quota; tracks usage per date."
    fields:
      - { name: id, type: string, source: system, description: "Server-minted zone id." }
      - { name: park_id, type: string, source: input, description: "FK -> Park.id; the park the zone is in." }
      - { name: name, type: string, source: input, description: "Zone name." }
      - { name: nightly_party_quota, type: integer, source: input, description: "Max committed party-nights per date." }
      - { name: used_by_date, type: object, source: computed, description: "Map of ISO date -> committed party-night count; each value <= nightly_party_quota.", default: "{}" }

  # ---------------------------------------------------------------------------
  - name: BackcountryPermit
    parent: null
    common_fields: true
    description: "A wilderness itinerary permit consuming per-zone nightly quota and trailhead exit quota."
    fields:
      - { name: id, type: string, source: system, description: "Server-minted permit id." }
      - { name: park_id, type: string, source: input, description: "FK -> Park.id; the park." }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the permit holder." }
      - { name: trailhead_id, type: string, source: input, description: "FK -> Trailhead.id; the entry trailhead." }
      - { name: entry_date, type: string, source: input, description: "ISO date (park-local) the party enters; consumes trailhead exit quota for this date." }
      - { name: nights, type: integer, source: input, description: "Number of nights; 1..14; equals length of zone_nights." }
      - { name: party_size, type: integer, source: input, description: "Persons in the party; >= 1. Quota counts PARTIES not persons." }
      - { name: zone_nights, type: array, source: input, description: "Ordered list of {zone_id, date}, one element per night; each consumes one party-night of that zone on that date." }
      - { name: status, type: enum, source: system, description: "held | confirmed | cancelled | expired", default: held }
      - { name: hold_expires_at, type: datetime, source: system, description: "UTC instant the hold lapses; set to now+15m on create; null once confirmed/terminal." }
      - { name: fee_cents, type: integer, source: computed, description: "Total fee (see CALC backcountry_fee)." }
      - { name: refunded_cents, type: integer, source: computed, description: "Cents refunded on cancellation; <= fee_cents.", default: 0 }
      - { name: payment_id, type: string, source: system, description: "FK -> Payment.id; the authorized/captured fee payment." }

  # ---------------------------------------------------------------------------
  - name: Campsite
    parent: null
    common_fields: true
    description: "A single bookable site within a campground in a park; tent, rv, or group."
    fields:
      - { name: id, type: string, source: system, description: "Server-minted campsite id." }
      - { name: park_id, type: string, source: input, description: "FK -> Park.id; the park." }
      - { name: site_number, type: string, source: input, description: "Human label within the park; unique per park.", constraints: "unique per park_id" }
      - { name: site_type, type: enum, source: input, description: "tent | rv | group", constraints: "one of tent, rv, group" }
      - { name: max_occupancy, type: integer, source: input, description: "Maximum persons (party_size) allowed." }
      - { name: booking_window_days, type: integer, source: input, description: "Max days ahead (inclusive) a stay's check_in may begin from now.", default: 180 }
      - { name: base_nightly_cents, type: integer, source: input, description: "Per-night price for tent/rv sites." }
      - { name: group_base_cents, type: integer, source: input, description: "Per-night base for group sites covering group_included_persons; null for non-group." }
      - { name: group_included_persons, type: integer, source: input, description: "Persons covered by group_base_cents; null for non-group." }
      - { name: group_extra_person_cents, type: integer, source: input, description: "Per-night surcharge per person above group_included_persons; null for non-group." }
      - { name: status, type: enum, source: input, description: "active | maintenance", default: active }

  # ---------------------------------------------------------------------------
  - name: CampReservation
    parent: null
    common_fields: true
    description: "A stay (half-open date range) on one campsite by one account."
    fields:
      - { name: id, type: string, source: system, description: "Server-minted reservation id." }
      - { name: campsite_id, type: string, source: input, description: "FK -> Campsite.id; the booked site." }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the booking visitor." }
      - { name: check_in, type: string, source: input, description: "ISO date (park-local) arrival; inclusive." }
      - { name: check_out, type: string, source: input, description: "ISO date (park-local) departure; exclusive; nights = check_out - check_in >= 1." }
      - { name: party_size, type: integer, source: input, description: "Persons; <= campsite.max_occupancy." }
      - { name: status, type: enum, source: system, description: "held | confirmed | checked_in | completed | cancelled | expired", default: held }
      - { name: hold_expires_at, type: datetime, source: system, description: "UTC instant the hold lapses; set to now+15m on create; null once confirmed/terminal." }
      - { name: total_cents, type: integer, source: computed, description: "Stay total (see CALC camp_total)." }
      - { name: refunded_cents, type: integer, source: computed, description: "Cents refunded on cancellation; <= total_cents.", default: 0 }
      - { name: payment_id, type: string, source: system, description: "FK -> Payment.id; the authorized/captured stay payment." }
      - { name: origin_waitlist_id, type: string, source: system, description: "FK -> WaitlistEntry.id; set when this reservation was created by claiming a waitlist offer, else null." }

  # ---------------------------------------------------------------------------
  - name: WaitlistEntry
    parent: null
    common_fields: true
    description: "A position-ordered waitlist request for a campsite over a specific date range."
    fields:
      - { name: id, type: string, source: system, description: "Server-minted waitlist id." }
      - { name: campsite_id, type: string, source: input, description: "FK -> Campsite.id; the desired site." }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the requester." }
      - { name: check_in, type: string, source: input, description: "ISO date arrival; inclusive." }
      - { name: check_out, type: string, source: input, description: "ISO date departure; exclusive." }
      - { name: party_size, type: integer, source: input, description: "Persons; <= campsite.max_occupancy." }
      - { name: position, type: integer, source: computed, description: "1-based queue position assigned on create (see CALC waitlist_position); immutable for the entry's life." }
      - { name: status, type: enum, source: system, description: "waiting | offered | claimed | expired | cancelled", default: waiting }
      - { name: offer_expires_at, type: datetime, source: system, description: "UTC instant an active offer lapses; set to now+24h when offered; null otherwise." }

  # ---------------------------------------------------------------------------
  - name: Payment
    parent: null
    common_fields: true
    description: "A money movement record with authorize/capture/refund/void lifecycle."
    fields:
      - { name: id, type: string, source: system, description: "Server-minted payment id." }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the payer." }
      - { name: kind, type: enum, source: input, description: "timed_entry | lottery_application | lottery_permit | backcountry | campground | atb_pass", constraints: "one of timed_entry, lottery_application, lottery_permit, backcountry, campground, atb_pass" }
      - { name: ref_type, type: string, source: input, description: "Entity name the payment is for (e.g. CampReservation)." }
      - { name: ref_id, type: string, source: input, description: "Id of the entity the payment is for." }
      - { name: amount_cents, type: integer, source: input, description: "Authorized amount in cents; >= 0." }
      - { name: captured_cents, type: integer, source: computed, description: "Captured amount; <= amount_cents.", default: 0 }
      - { name: refunded_cents, type: integer, source: computed, description: "Refunded amount; <= captured_cents.", default: 0 }
      - { name: status, type: enum, source: system, description: "authorized | captured | partially_refunded | refunded | voided", default: authorized }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: TimedEntryReservation
    field: status
    initial_state: held
    terminal_states: [cancelled, expired, no_show]
    transitions:
      - from: held
        to: confirmed
        trigger: "POST /v1/timed-entry-reservations/{id}/confirm"
        actor: visitor
        preconditions:
          - "reservation.status == held"
          - "Clock.now_utc <= hold_expires_at (else ERR_HOLD_EXPIRED)"
        side_effects:
          - "Capture reservation's Payment: captured_cents = amount_cents; Payment.status -> captured"
          - "Slot held_count -= 1; slot booked_count += 1"
          - "hold_expires_at -> null"
      - from: held
        to: expired
        trigger: "POST /v1/_ops/run (sweep) when Clock.now_utc > hold_expires_at"
        actor: system
        preconditions:
          - "reservation.status == held"
          - "Clock.now_utc > hold_expires_at"
        side_effects:
          - "Slot held_count -= 1"
          - "Void reservation's Payment (Payment.status -> voided)"
      - from: held
        to: cancelled
        trigger: "POST /v1/timed-entry-reservations/{id}/cancel"
        actor: visitor
        preconditions:
          - "reservation.status == held"
        side_effects:
          - "Slot held_count -= 1"
          - "Void reservation's Payment (Payment.status -> voided)"
      - from: confirmed
        to: checked_in
        trigger: "POST /v1/timed-entry-reservations/{id}/check-in"
        actor: ranger
        preconditions:
          - "reservation.status == confirmed"
          - "Clock.now_utc within [window_start, window_end) of the slot in park-local time"
          - "acting ranger.home_park_id == slot.park_id (else ERR_FORBIDDEN)"
        side_effects: []
      - from: confirmed
        to: cancelled
        trigger: "POST /v1/timed-entry-reservations/{id}/cancel"
        actor: visitor
        preconditions:
          - "reservation.status == confirmed"
        side_effects:
          - "Slot booked_count -= 1"
          - "entry_fee is non-refundable: Payment stays captured; refunded_cents unchanged (0)"
      - from: confirmed
        to: no_show
        trigger: "POST /v1/_ops/run (sweep) when Clock.now_utc > slot window_end (park-local) and not checked_in"
        actor: system
        preconditions:
          - "reservation.status == confirmed"
          - "Clock.now_utc > slot window_end converted to UTC"
        side_effects:
          - "Slot booked_count -= 1"
          - "Payment stays captured (fee non-refundable)"

  # ---------------------------------------------------------------------------
  - entity: LotteryApplication
    field: status
    initial_state: submitted
    terminal_states: [lost, awarded, declined, withdrawn]
    transitions:
      - from: submitted
        to: withdrawn
        trigger: "POST /v1/lottery-applications/{id}/withdraw"
        actor: visitor
        preconditions:
          - "application.status == submitted"
          - "draw.status == accepting AND Clock.now_utc < draw.application_close_at"
        side_effects:
          - "application_fee Payment stays captured (non-refundable)"
      - from: submitted
        to: won
        trigger: "POST /v1/lottery-draws/{id}/draw (deterministic selection)"
        actor: park_admin
        preconditions:
          - "application.status == submitted"
          - "selected by CALC lottery_selection greedy fill"
        side_effects:
          - "award_accept_deadline = draw.draw_at + 72h"
          - "draw.awarded_count += application.party_size"
      - from: submitted
        to: lost
        trigger: "POST /v1/lottery-draws/{id}/draw (deterministic selection)"
        actor: park_admin
        preconditions:
          - "application.status == submitted"
          - "not selected by CALC lottery_selection"
        side_effects:
          - "application_fee Payment stays captured (non-refundable)"
      - from: won
        to: awarded
        trigger: "POST /v1/lottery-applications/{id}/accept"
        actor: visitor
        preconditions:
          - "application.status == won"
          - "Clock.now_utc <= award_accept_deadline (else ERR_AWARD_WINDOW_CLOSED)"
        side_effects:
          - "Create captured permit_fee Payment (kind=lottery_permit) for permit_fee_per_person_cents * party_size; set permit_payment_id"
      - from: won
        to: declined
        trigger: "POST /v1/lottery-applications/{id}/decline"
        actor: visitor
        preconditions:
          - "application.status == won"
        side_effects:
          - "draw.awarded_count -= application.party_size (release persons back to pool)"
      - from: won
        to: declined
        trigger: "POST /v1/_ops/run (sweep) when Clock.now_utc > award_accept_deadline"
        actor: system
        preconditions:
          - "application.status == won"
          - "Clock.now_utc > award_accept_deadline"
        side_effects:
          - "draw.awarded_count -= application.party_size (release persons back to pool)"

  # ---------------------------------------------------------------------------
  - entity: BackcountryPermit
    field: status
    initial_state: held
    terminal_states: [cancelled, expired]
    transitions:
      - from: held
        to: confirmed
        trigger: "POST /v1/backcountry-permits/{id}/confirm"
        actor: visitor
        preconditions:
          - "permit.status == held"
          - "Clock.now_utc <= hold_expires_at (else ERR_HOLD_EXPIRED)"
          - "for every {zone_id,date} in zone_nights: zone.used_by_date[date] < zone.nightly_party_quota (re-validated; else ERR_ZONE_FULL)"
          - "trailhead.exit_used_by_date[entry_date] < trailhead.daily_exit_quota (re-validated; else ERR_TRAILHEAD_FULL)"
        side_effects:
          - "Capture permit's Payment (captured_cents = amount_cents)"
          - "For each {zone_id,date}: zone.used_by_date[date] += 1 (commit one party-night)"
          - "trailhead.exit_used_by_date[entry_date] += 1 (commit one exit)"
          - "hold_expires_at -> null"
      - from: held
        to: expired
        trigger: "POST /v1/_ops/run (sweep) when Clock.now_utc > hold_expires_at"
        actor: system
        preconditions:
          - "permit.status == held"
          - "Clock.now_utc > hold_expires_at"
        side_effects:
          - "Void permit's Payment (no committed quota to release; holds did not commit quota)"
      - from: held
        to: cancelled
        trigger: "POST /v1/backcountry-permits/{id}/cancel"
        actor: visitor
        preconditions:
          - "permit.status == held"
        side_effects:
          - "Void permit's Payment (no committed quota to release)"
      - from: confirmed
        to: cancelled
        trigger: "POST /v1/backcountry-permits/{id}/cancel"
        actor: visitor
        preconditions:
          - "permit.status == confirmed"
        side_effects:
          - "For each {zone_id,date}: zone.used_by_date[date] -= 1 (release party-night)"
          - "trailhead.exit_used_by_date[entry_date] -= 1 (release exit)"
          - "Refund refundable portion per CALC cancel_refund; permit.refunded_cents set; Payment.refunded_cents increased; reservation-flat fee never refunded"
          - "Refund credited to Account.credit_balance_cents"

  # ---------------------------------------------------------------------------
  - entity: CampReservation
    field: status
    initial_state: held
    terminal_states: [completed, cancelled, expired]
    transitions:
      - from: held
        to: confirmed
        trigger: "POST /v1/camp-reservations/{id}/confirm"
        actor: visitor
        preconditions:
          - "reservation.status == held"
          - "Clock.now_utc <= hold_expires_at (else ERR_HOLD_EXPIRED)"
          - "no other reservation with status in {confirmed, checked_in} overlaps [check_in, check_out) on the same campsite (else ERR_DATE_CONFLICT)"
        side_effects:
          - "Capture reservation's Payment (captured_cents = amount_cents)"
          - "hold_expires_at -> null"
      - from: held
        to: expired
        trigger: "POST /v1/_ops/run (sweep) when Clock.now_utc > hold_expires_at"
        actor: system
        preconditions:
          - "reservation.status == held"
          - "Clock.now_utc > hold_expires_at"
        side_effects:
          - "Void reservation's Payment"
          - "Release dates; then make a waitlist offer per CALC waitlist_position to the lowest-position waiting WaitlistEntry whose [check_in,check_out) equals this reservation's range (WaitlistEntry waiting -> offered, offer_expires_at = now+24h)"
      - from: held
        to: cancelled
        trigger: "POST /v1/camp-reservations/{id}/cancel"
        actor: visitor
        preconditions:
          - "reservation.status == held"
        side_effects:
          - "Void reservation's Payment"
          - "Release dates; make waitlist offer to lowest-position matching waiting WaitlistEntry (waiting -> offered, offer_expires_at = now+24h)"
      - from: confirmed
        to: checked_in
        trigger: "POST /v1/camp-reservations/{id}/check-in"
        actor: ranger
        preconditions:
          - "reservation.status == confirmed"
          - "Clock.now_utc (park-local date) == check_in"
          - "acting ranger.home_park_id == campsite.park_id (else ERR_FORBIDDEN)"
        side_effects: []
      - from: confirmed
        to: cancelled
        trigger: "POST /v1/camp-reservations/{id}/cancel"
        actor: visitor
        preconditions:
          - "reservation.status == confirmed"
          - "Clock.now_utc (park-local date) < check_in"
        side_effects:
          - "Refund per CALC cancel_refund; reservation.refunded_cents set; Payment.refunded_cents increased; refund credited to Account.credit_balance_cents"
          - "Release dates; make waitlist offer to lowest-position matching waiting WaitlistEntry (waiting -> offered, offer_expires_at = now+24h)"
      - from: checked_in
        to: completed
        trigger: "POST /v1/camp-reservations/{id}/complete"
        actor: ranger
        preconditions:
          - "reservation.status == checked_in"
          - "Clock.now_utc (park-local date) >= check_out"
          - "acting ranger.home_park_id == campsite.park_id (else ERR_FORBIDDEN)"
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: WaitlistEntry
    field: status
    initial_state: waiting
    terminal_states: [claimed, expired, cancelled]
    transitions:
      - from: waiting
        to: offered
        trigger: "system: a CampReservation on the same campsite/range is cancelled or expires (cascade)"
        actor: system
        preconditions:
          - "entry.status == waiting"
          - "entry has the lowest position among waiting entries for the same (campsite_id, check_in, check_out)"
        side_effects:
          - "offer_expires_at = Clock.now_utc + 24h"
      - from: waiting
        to: cancelled
        trigger: "POST /v1/waitlist-entries/{id}/cancel"
        actor: visitor
        preconditions:
          - "entry.status == waiting"
        side_effects: []
      - from: offered
        to: claimed
        trigger: "POST /v1/waitlist-entries/{id}/claim"
        actor: visitor
        preconditions:
          - "entry.status == offered"
          - "Clock.now_utc <= offer_expires_at (else ERR_OFFER_EXPIRED)"
        side_effects:
          - "Create a confirmed CampReservation for (campsite_id, check_in, check_out, party_size) with origin_waitlist_id = this entry; total_cents per CALC camp_total; captured Payment created"
          - "offer_expires_at -> null"
      - from: offered
        to: expired
        trigger: "POST /v1/_ops/run (sweep) when Clock.now_utc > offer_expires_at"
        actor: system
        preconditions:
          - "entry.status == offered"
          - "Clock.now_utc > offer_expires_at"
        side_effects:
          - "Advance offer to the next lowest-position waiting entry for the same (campsite_id, check_in, check_out): that entry waiting -> offered, offer_expires_at = now+24h (positions are NOT renumbered)"
      - from: offered
        to: cancelled
        trigger: "POST /v1/waitlist-entries/{id}/cancel"
        actor: visitor
        preconditions:
          - "entry.status == offered"
        side_effects:
          - "Advance offer to the next lowest-position waiting entry for the same (campsite_id, check_in, check_out): waiting -> offered, offer_expires_at = now+24h"

  # ---------------------------------------------------------------------------
  - entity: AtbPass
    field: status
    initial_state: active
    terminal_states: [voided]
    transitions:
      - from: active
        to: expired
        trigger: "POST /v1/_ops/run (sweep) when valid_to is not null and Clock.now_utc date > valid_to"
        actor: system
        preconditions:
          - "pass.status == active"
          - "pass.valid_to is not null AND Clock.now_utc (date) > pass.valid_to"
        side_effects: []
        note: "senior_lifetime passes have valid_to == null and never expire."
      - from: active
        to: voided
        trigger: "POST /v1/atb-passes/{id}/void"
        actor: finance
        preconditions:
          - "pass.status == active"
          - "Clock.now_utc <= pass.created_at + 30 days (else ERR_VOID_NOT_ALLOWED)"
          - "pass.payment_id is not null (free passes cannot be voided for refund; ERR_VOID_NOT_ALLOWED)"
        side_effects:
          - "Refund the purchase Payment in full (refunded_cents = captured_cents; Payment.status -> refunded)"
          - "Refund credited to Account.credit_balance_cents"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: timed-entry-hold-stale-slot
    parent_entity: TimedEntrySlot
    write_endpoint: "POST /v1/timed-entry-reservations"
    occ_field: "expected_slot_version"
    description: |
      Creating a held TimedEntryReservation against a TimedEntrySlot whose
      version has advanced since the client last observed it is rejected. This
      captures the case where another writer has just placed a hold on the same
      slot (legitimately consuming capacity) so the current writer's view of the
      slot's remaining capacity is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: waitlist-join-stale-campsite
    parent_entity: Campsite
    write_endpoint: "POST /v1/waitlist-entries"
    occ_field: "expected_campsite_version"
    description: |
      Joining the waitlist for a Campsite whose version has advanced since the
      client last observed it is rejected. This captures the case where the
      target range just became bookable (a conflicting reservation released its
      dates, bumping the campsite version) so the client's "dates are taken"
      premise for joining the waitlist is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: timed_entry_fee
    trigger: "POST /v1/timed-entry-reservations (reservation create)"
    algorithm: threshold
    formula: |
      fee_cents = slot.entry_fee_cents
      The ATB pass does NOT waive the timed-entry RESERVATION fee; the fee is
      charged regardless of whether the account holds an active AtbPass.
      fee_cents is NON-REFUNDABLE: cancelling a confirmed reservation refunds 0.
    input_set: "the single referenced TimedEntrySlot.entry_fee_cents"
    precision: "integer cents; no rounding"
    output: "TimedEntryReservation.fee_cents and Payment.amount_cents"

  - name: backcountry_fee
    trigger: "POST /v1/backcountry-permits (permit create)"
    algorithm: tiered_pricing
    formula: |
      reservation_flat = trailhead.reservation_fee_cents            (non-refundable)
      variable = trailhead.per_person_per_night_cents * party_size * nights  (refundable)
      fee_cents = reservation_flat + variable
    input_set: "the referenced Trailhead fee rates, permit.party_size, permit.nights"
    constants:
      DEFAULT_RESERVATION_FEE_CENTS: 500
      DEFAULT_PER_PERSON_PER_NIGHT_CENTS: 800
    precision: "integer cents; no rounding (linear product)"
    output: "BackcountryPermit.fee_cents and Payment.amount_cents"

  - name: camp_total
    trigger: "POST /v1/camp-reservations (reservation create) and waitlist claim that creates a reservation"
    algorithm: tiered_pricing
    formula: |
      nights = (check_out - check_in) in whole days, >= 1
      if campsite.site_type in {tent, rv}:
        total_cents = campsite.base_nightly_cents * nights
      if campsite.site_type == group:
        extra_persons = max(0, party_size - campsite.group_included_persons)
        per_night = campsite.group_base_cents + campsite.group_extra_person_cents * extra_persons
        total_cents = per_night * nights
    input_set: "the single referenced Campsite pricing fields, reservation.party_size, nights"
    precision: "integer cents; no rounding (linear products)"
    output: "CampReservation.total_cents and Payment.amount_cents"

  - name: lottery_selection
    trigger: "POST /v1/lottery-draws/{id}/draw"
    algorithm: chronological
    formula: |
      candidates = applications with status == submitted for this draw.
      Sort ascending by sort key:
        (preference_rank ASC, created_at ASC, id ASC)   # id only as final total-order tiebreak among equal created_at; never the primary decider
      remaining = draw.daily_quota
      for app in sorted candidates:
        if app.party_size <= remaining:
          app -> won; remaining -= app.party_size       # greedy fill
        else:
          app -> lost                                    # SKIP oversized; do NOT partial-award; later smaller apps may still win
      draw.status -> drawn
    input_set: "submitted applications for the draw; quota = draw.daily_quota"
    precision: "integer persons"
    output: "each application's status (won|lost); draw.awarded_count = sum(party_size of won)"

  - name: cancel_refund
    trigger: "POST /v1/camp-reservations/{id}/cancel (confirmed) and POST /v1/backcountry-permits/{id}/cancel (confirmed)"
    algorithm: threshold
    formula: |
      D = whole days from Clock.now_utc (park-local date) to start date
          (check_in for camp; entry_date for backcountry); D = start - now_date.
      refundable_base = total_cents minus any flat non-refundable fee
        camp:        refundable_base = total_cents (no flat non-refundable fee)
        backcountry: refundable_base = fee_cents - trailhead.reservation_fee_cents
      pct by band (edges inclusive as written):
        D >= 14          -> 100
        7 <= D <= 13     -> 50
        2 <= D <= 6      -> 25
        D <= 1           -> 0
      refund_cents = round_half_up(refundable_base * pct / 100)
    input_set: "the single reservation/permit being cancelled; its start date vs Clock.now_utc"
    constants:
      BAND_FULL_DAYS: 14
      BAND_HALF_DAYS: 7
      BAND_QUARTER_DAYS: 2
    precision: "round_half_up to integer cents at the single percentage multiplication"
    output: "refund_cents -> refunded_cents and Account.credit_balance_cents"

  - name: atb_price
    trigger: "POST /v1/atb-passes (pass purchase)"
    algorithm: threshold
    formula: |
      price_cents by pass_type:
        annual         -> 8000
        senior_annual  -> 2000
        senior_lifetime-> 8000
        military       -> 0
        access         -> 0
      valid_to = (valid_from + 365 days) for annual, senior_annual, military, access;
      valid_to = null for senior_lifetime.
    input_set: "the requested pass_type and valid_from"
    constants:
      PRICE_ANNUAL: 8000
      PRICE_SENIOR_ANNUAL: 2000
      PRICE_SENIOR_LIFETIME: 8000
    precision: "integer cents"
    output: "AtbPass.price_cents, AtbPass.valid_to, and Payment.amount_cents (when price > 0)"

  - name: waitlist_position
    trigger: "POST /v1/waitlist-entries (waitlist join)"
    algorithm: aggregation
    formula: |
      position = 1 + count(WaitlistEntry rows with status in {waiting, offered}
                           for the same (campsite_id, check_in, check_out))
      Positions are assigned once and never renumbered. When an entry leaves
      (claimed|expired|cancelled), offers advance to the lowest-position entry
      still in {waiting} for the same key; gaps are tolerated.
    input_set: "existing waiting/offered entries matching (campsite_id, check_in, check_out)"
    precision: "integer"
    output: "WaitlistEntry.position"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "Authorization header / X-User-Role present and a known role for non-public endpoints"
    error_id: ERR_UNAUTHORIZED
    http_status: 401
    applies_to: "all non-public endpoints"

  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7 (e.g. only finance voids passes; only park_admin runs draws; only ranger checks in / completes; ranger/park_admin scoped to home_park_id; visitor acts only on own resources)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all role-gated endpoints"

  - priority: 3
    category: existence
    check: "All path and body-referenced resources exist (account, park, slot, draw, application, trailhead, zone, campsite, reservation, permit, waitlist, pass, payment)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing a resource"

  - priority: 4
    category: business_constraint
    check: "Idempotency-Key reuse with a different request body"
    error_id: ERR_IDEMPOTENCY_CONFLICT
    http_status: 409
    applies_to: "all POST creation endpoints accepting Idempotency-Key"

  - priority: 5
    category: business_constraint
    check: "Request body passes field-level schema validation (required fields, types, enum membership, positive integers, non-empty plate, valid ISO dates)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 6
    category: business_constraint
    check: "Account.email is unique on account create"
    error_id: ERR_EMAIL_TAKEN
    http_status: 409
    applies_to: "POST /v1/accounts"

  - priority: 7
    category: business_constraint
    check: "role in {ranger, park_admin} requires home_park_id"
    error_id: ERR_HOME_PARK_REQUIRED
    http_status: 400
    applies_to: "POST /v1/accounts"

  - priority: 8
    category: business_constraint
    check: "group campsite create requires group_base_cents, group_included_persons, group_extra_person_cents all present"
    error_id: ERR_GROUP_CONFIG_MISSING
    http_status: 400
    applies_to: "POST /v1/campsites"

  - priority: 9
    category: business_temporal
    check: "ATB senior_annual / senior_lifetime require account age >= 62 at valid_from (derived from birth_date)"
    error_id: ERR_AGE_REQUIREMENT
    http_status: 400
    applies_to: "POST /v1/atb-passes"

  - priority: 10
    category: business_constraint
    check: "account may not hold two AtbPasses with status==active whose [valid_from, valid_to] ranges overlap (senior_lifetime treated as open-ended)"
    error_id: ERR_PASS_OVERLAP
    http_status: 409
    applies_to: "POST /v1/atb-passes"

  - priority: 11
    category: state
    check: "target resource is in a valid state for the requested transition (per §1.2 from-state)"
    error_id: ERR_STATE_INVALID
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 12
    category: state
    check: "confirm requires hold not expired: Clock.now_utc <= hold_expires_at"
    error_id: ERR_HOLD_EXPIRED
    http_status: 409
    applies_to: "POST .../confirm for timed-entry, backcountry, camp reservations"

  - priority: 13
    category: business_temporal
    check: "timed-entry booking requires Clock.now_utc >= slot.release_at"
    error_id: ERR_NOT_YET_RELEASED
    http_status: 409
    applies_to: "POST /v1/timed-entry-reservations"

  - priority: 14
    category: business_temporal
    check: "timed-entry entry_date within rolling 7-day window: 0 <= (entry_date - now_date) <= 7, evaluated in park-local date"
    error_id: ERR_OUTSIDE_BOOKING_WINDOW
    http_status: 409
    applies_to: "POST /v1/timed-entry-reservations"

  - priority: 15
    category: business_temporal
    check: "campground check_in within booking window: 0 <= (check_in - now_date) <= campsite.booking_window_days, and check_out > check_in"
    error_id: ERR_OUTSIDE_BOOKING_WINDOW
    http_status: 409
    applies_to: "POST /v1/camp-reservations"

  - priority: 16
    category: business_temporal
    check: "lottery application only while draw.status==accepting and application_open_at <= Clock.now_utc < application_close_at"
    error_id: ERR_LOTTERY_CLOSED
    http_status: 409
    applies_to: "POST /v1/lottery-draws/{id}/applications"

  - priority: 17
    category: business_temporal
    check: "draw may run only when draw.status==accepting and Clock.now_utc >= draw.draw_at"
    error_id: ERR_DRAW_NOT_READY
    http_status: 409
    applies_to: "POST /v1/lottery-draws/{id}/draw"

  - priority: 18
    category: business_temporal
    check: "award acceptance only while application.status==won and Clock.now_utc <= award_accept_deadline"
    error_id: ERR_AWARD_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /v1/lottery-applications/{id}/accept"

  - priority: 19
    category: business_temporal
    check: "waitlist claim only while entry.status==offered and Clock.now_utc <= offer_expires_at"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /v1/waitlist-entries/{id}/claim"

  - priority: 20
    category: business_constraint
    check: "party_size within range: lottery 1..draw.max_group_size; backcountry/camp party_size >= 1"
    error_id: ERR_INVALID_PARTY_SIZE
    http_status: 400
    applies_to: "POST lottery applications, backcountry permits, camp reservations"

  - priority: 21
    category: business_constraint
    check: "backcountry itinerary valid: 1 <= nights <= 14 and len(zone_nights) == nights and each element has zone_id+date"
    error_id: ERR_INVALID_ITINERARY
    http_status: 400
    applies_to: "POST /v1/backcountry-permits"

  - priority: 22
    category: business_constraint
    check: "campground party_size <= campsite.max_occupancy"
    error_id: ERR_OVER_OCCUPANCY
    http_status: 409
    applies_to: "POST /v1/camp-reservations, POST /v1/waitlist-entries"

  - priority: 23
    category: business_constraint
    check: "campsite.status==active for booking (else unavailable)"
    error_id: ERR_SITE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /v1/camp-reservations"

  - priority: 24
    category: business_constraint
    check: "at most one non-terminal LotteryApplication per (account, draw)"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: "POST /v1/lottery-draws/{id}/applications"

  - priority: 25
    category: business_constraint
    check: "at most one held/confirmed TimedEntryReservation per (account, slot)"
    error_id: ERR_DUPLICATE_RESERVATION
    http_status: 409
    applies_to: "POST /v1/timed-entry-reservations"

  - priority: 26
    category: business_constraint
    check: "cannot join waitlist if the exact [check_in,check_out) range on the campsite has no overlapping confirmed/checked_in/held reservation (i.e. it is currently bookable)"
    error_id: ERR_DATES_AVAILABLE
    http_status: 409
    applies_to: "POST /v1/waitlist-entries"

  - priority: 27
    category: business_safety
    check: "OCC: expected_slot_version / expected_campsite_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /v1/timed-entry-reservations, POST /v1/waitlist-entries"

  - priority: 28
    category: business_fiscal
    check: "campsite date conflict: no reservation in {held, confirmed, checked_in} overlaps [check_in,check_out) on confirm"
    error_id: ERR_DATE_CONFLICT
    http_status: 409
    applies_to: "POST /v1/camp-reservations, POST /v1/camp-reservations/{id}/confirm"

  - priority: 29
    category: business_fiscal
    check: "timed-entry capacity: held_count + booked_count < capacity to place a new hold"
    error_id: ERR_SLOT_FULL
    http_status: 409
    applies_to: "POST /v1/timed-entry-reservations"

  - priority: 30
    category: business_fiscal
    check: "backcountry zone quota: each {zone_id,date} has zone.used_by_date[date] < zone.nightly_party_quota"
    error_id: ERR_ZONE_FULL
    http_status: 409
    applies_to: "POST /v1/backcountry-permits, POST /v1/backcountry-permits/{id}/confirm"

  - priority: 31
    category: business_fiscal
    check: "backcountry trailhead quota: trailhead.exit_used_by_date[entry_date] < trailhead.daily_exit_quota"
    error_id: ERR_TRAILHEAD_FULL
    http_status: 409
    applies_to: "POST /v1/backcountry-permits, POST /v1/backcountry-permits/{id}/confirm"

  - priority: 32
    category: business_fiscal
    check: "payment capture only from authorized; refund only from captured/partially_refunded; refunded_cents <= captured_cents"
    error_id: ERR_OVER_REFUND
    http_status: 409
    applies_to: "internal payment operations and cancel/void flows"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock & ops ---
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Set the simulation clock (test-driving)."
    roles: [park_admin, finance, system]
    code: 200
    input: [now_utc]
    output: Clock
    side_effects: ["Clock.now_utc = now_utc"]

  - method: GET
    path: "/v1/_clock"
    description: "Read the simulation clock."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 200
    input: []
    output: Clock
    side_effects: []

  - method: POST
    path: "/v1/_ops/run"
    description: "Run the housekeeping sweep: expire stale holds, expire ATB passes past valid_to, lapse won lottery applications past deadline, expire waitlist offers (advancing to next position), and mark confirmed timed-entry reservations past their window as no_show."
    roles: [park_admin, finance, system]
    code: 200
    input: []
    output: "{ expired_holds: integer, expired_passes: integer, lapsed_awards: integer, advanced_offers: integer, no_shows: integer }"
    side_effects:
      - "TimedEntryReservation held -> expired when now > hold_expires_at (slot held_count -=1; void payment)"
      - "BackcountryPermit held -> expired (void payment)"
      - "CampReservation held -> expired (void payment; release dates; cascade waitlist offer)"
      - "AtbPass active -> expired when valid_to not null and now date > valid_to"
      - "LotteryApplication won -> declined when now > award_accept_deadline (draw.awarded_count -= party_size)"
      - "WaitlistEntry offered -> expired when now > offer_expires_at (advance offer to next waiting position)"
      - "TimedEntryReservation confirmed -> no_show when now > window_end (slot booked_count -=1)"

  # --- accounts ---
  - method: POST
    path: "/v1/accounts"
    description: "Register an account (visitor or staff)."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 201
    input: [email, full_name, birth_date, "role?", "home_park_id?"]
    output: Account
    side_effects: ["status=active, credit_balance_cents=0, version=1"]

  - method: GET
    path: "/v1/accounts/{id}"
    description: "Read an account."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/v1/accounts"
    description: "List accounts; filterable by home_park_id (reverse-reachability for Account.home_park_id -> Park)."
    roles: [park_admin, finance, system]
    code: 200
    input: ["home_park_id?"]
    output: Account[]
    side_effects: []

  # --- parks ---
  - method: POST
    path: "/v1/parks"
    description: "Create a park."
    roles: [system]
    code: 201
    input: [code, name, "utc_offset_minutes?", "timed_entry_required?", "status?"]
    output: Park
    side_effects: ["status defaults open"]

  - method: GET
    path: "/v1/parks/{id}"
    description: "Read a park."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 200
    input: []
    output: Park
    side_effects: []

  # --- ATB passes ---
  - method: POST
    path: "/v1/atb-passes"
    description: "Purchase an America the Beautiful pass; price snapshotted; captured Payment created for paid types."
    roles: [visitor]
    code: 201
    input: [account_id, pass_type, valid_from]
    output: AtbPass
    side_effects: ["price_cents per CALC atb_price; valid_to computed; captured Payment when price>0; status=active"]

  - method: POST
    path: "/v1/atb-passes/{id}/void"
    description: "Void a pass within 30 days for a full refund (finance only)."
    roles: [finance]
    code: 200
    input: []
    output: AtbPass
    side_effects: ["status -> voided; full refund of purchase Payment; credit to Account.credit_balance_cents"]

  - method: GET
    path: "/v1/atb-passes/{id}"
    description: "Read a pass."
    roles: [visitor, finance, park_admin, system]
    code: 200
    input: []
    output: AtbPass
    side_effects: []

  - method: GET
    path: "/v1/atb-passes"
    description: "List passes; filter by account_id and/or payment_id (reverse-reachability for AtbPass.account_id -> Account and payment_id -> Payment)."
    roles: [visitor, finance, park_admin, system]
    code: 200
    input: ["account_id?", "payment_id?"]
    output: AtbPass[]
    side_effects: []

  # --- timed-entry slots & reservations ---
  - method: POST
    path: "/v1/timed-entry-slots"
    description: "Create a timed-entry slot for a park (park_admin scoped to home_park_id)."
    roles: [park_admin]
    code: 201
    input: [park_id, entry_date, window_start_local, window_end_local, capacity, release_at, "entry_fee_cents?"]
    output: TimedEntrySlot
    side_effects: ["held_count=0, booked_count=0"]

  - method: GET
    path: "/v1/timed-entry-slots/{id}"
    description: "Read a timed-entry slot."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 200
    input: []
    output: TimedEntrySlot
    side_effects: []

  - method: GET
    path: "/v1/timed-entry-slots"
    description: "List slots; filter by park_id and/or entry_date (reverse-reachability for TimedEntrySlot.park_id -> Park)."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 200
    input: ["park_id?", "entry_date?"]
    output: TimedEntrySlot[]
    side_effects: []

  - method: POST
    path: "/v1/timed-entry-reservations"
    description: "Place a held vehicle reservation against a slot; OCC on slot version; hold_expires_at = now+15m; authorized Payment."
    roles: [visitor]
    code: 201
    input: [slot_id, account_id, vehicle_plate, expected_slot_version]
    output: TimedEntryReservation
    side_effects:
      - "increments TimedEntrySlot.version by 1"
      - "slot.held_count += 1"
      - "status=held; fee_cents per CALC timed_entry_fee; authorized Payment created; hold_expires_at = now+15m"

  - method: POST
    path: "/v1/timed-entry-reservations/{id}/confirm"
    description: "Confirm a held reservation (capture fee)."
    roles: [visitor]
    code: 200
    input: []
    output: TimedEntryReservation
    side_effects: ["capture Payment; slot held_count -=1, booked_count +=1; status -> confirmed"]

  - method: POST
    path: "/v1/timed-entry-reservations/{id}/check-in"
    description: "Ranger checks in a confirmed reservation at its slot's park."
    roles: [ranger]
    code: 200
    input: []
    output: TimedEntryReservation
    side_effects: ["status -> checked_in"]

  - method: POST
    path: "/v1/timed-entry-reservations/{id}/cancel"
    description: "Cancel a held or confirmed reservation; entry fee non-refundable."
    roles: [visitor]
    code: 200
    input: []
    output: TimedEntryReservation
    side_effects: ["release held/booked count; void payment if held; status -> cancelled"]

  - method: GET
    path: "/v1/timed-entry-reservations/{id}"
    description: "Read a reservation."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 200
    input: []
    output: TimedEntryReservation
    side_effects: []

  - method: GET
    path: "/v1/timed-entry-reservations"
    description: "List reservations; filter by slot_id, account_id and/or payment_id (reverse-reachability for TimedEntryReservation.slot_id -> TimedEntrySlot, account_id -> Account, payment_id -> Payment)."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 200
    input: ["slot_id?", "account_id?", "payment_id?"]
    output: TimedEntryReservation[]
    side_effects: []

  # --- lottery ---
  - method: POST
    path: "/v1/lottery-draws"
    description: "Create a lottery draw (park_admin scoped to home_park_id)."
    roles: [park_admin]
    code: 201
    input: [park_id, objective, use_date, daily_quota, application_open_at, application_close_at, draw_at, permit_fee_per_person_cents, "max_group_size?", "application_fee_cents?"]
    output: LotteryDraw
    side_effects: ["status=accepting, awarded_count=0"]

  - method: GET
    path: "/v1/lottery-draws/{id}"
    description: "Read a draw."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 200
    input: []
    output: LotteryDraw
    side_effects: []

  - method: GET
    path: "/v1/lottery-draws"
    description: "List draws; filter by park_id (reverse-reachability for LotteryDraw.park_id -> Park)."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 200
    input: ["park_id?"]
    output: LotteryDraw[]
    side_effects: []

  - method: POST
    path: "/v1/lottery-draws/{id}/applications"
    description: "Submit a lottery application; non-refundable application fee captured immediately."
    roles: [visitor]
    code: 201
    input: [account_id, party_size, "preference_rank?"]
    output: LotteryApplication
    side_effects: ["status=submitted; application_fee_cents snapshot; captured application_fee Payment (kind=lottery_application)"]

  - method: POST
    path: "/v1/lottery-draws/{id}/draw"
    description: "Run the deterministic draw, selecting winners by CALC lottery_selection."
    roles: [park_admin]
    code: 200
    input: []
    output: LotteryDraw
    side_effects: ["each submitted application -> won|lost; won set award_accept_deadline=draw_at+72h; draw.awarded_count set; draw.status -> drawn"]

  - method: POST
    path: "/v1/lottery-applications/{id}/withdraw"
    description: "Withdraw a submitted application; application fee not refunded."
    roles: [visitor]
    code: 200
    input: []
    output: LotteryApplication
    side_effects: ["status -> withdrawn"]

  - method: POST
    path: "/v1/lottery-applications/{id}/accept"
    description: "Accept a won award within the deadline; capture per-person permit fee."
    roles: [visitor]
    code: 200
    input: []
    output: LotteryApplication
    side_effects: ["status -> awarded; captured permit_fee Payment (kind=lottery_permit) = permit_fee_per_person_cents * party_size; set permit_payment_id"]

  - method: POST
    path: "/v1/lottery-applications/{id}/decline"
    description: "Decline a won award; release persons to the pool."
    roles: [visitor]
    code: 200
    input: []
    output: LotteryApplication
    side_effects: ["status -> declined; draw.awarded_count -= party_size"]

  - method: GET
    path: "/v1/lottery-applications/{id}"
    description: "Read a lottery application."
    roles: [visitor, park_admin, finance, system]
    code: 200
    input: []
    output: LotteryApplication
    side_effects: []

  - method: GET
    path: "/v1/lottery-applications"
    description: "List applications; filter by draw_id, account_id, application_payment_id and/or permit_payment_id (reverse-reachability for LotteryApplication.draw_id -> LotteryDraw, account_id -> Account, application_payment_id -> Payment, permit_payment_id -> Payment)."
    roles: [visitor, park_admin, finance, system]
    code: 200
    input: ["draw_id?", "account_id?", "application_payment_id?", "permit_payment_id?"]
    output: LotteryApplication[]
    side_effects: []

  # --- backcountry ---
  - method: POST
    path: "/v1/trailheads"
    description: "Create a trailhead (park_admin scoped to home_park_id)."
    roles: [park_admin]
    code: 201
    input: [park_id, name, daily_exit_quota, "reservation_fee_cents?", "per_person_per_night_cents?"]
    output: Trailhead
    side_effects: ["exit_used_by_date = {}"]

  - method: GET
    path: "/v1/trailheads/{id}"
    description: "Read a trailhead."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 200
    input: []
    output: Trailhead
    side_effects: []

  - method: GET
    path: "/v1/trailheads"
    description: "List trailheads; filter by park_id (reverse-reachability for Trailhead.park_id -> Park)."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 200
    input: ["park_id?"]
    output: Trailhead[]
    side_effects: []

  - method: POST
    path: "/v1/wilderness-zones"
    description: "Create a wilderness zone (park_admin scoped to home_park_id)."
    roles: [park_admin]
    code: 201
    input: [park_id, name, nightly_party_quota]
    output: WildernessZone
    side_effects: ["used_by_date = {}"]

  - method: GET
    path: "/v1/wilderness-zones/{id}"
    description: "Read a wilderness zone."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 200
    input: []
    output: WildernessZone
    side_effects: []

  - method: GET
    path: "/v1/wilderness-zones"
    description: "List zones; filter by park_id (reverse-reachability for WildernessZone.park_id -> Park)."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 200
    input: ["park_id?"]
    output: WildernessZone[]
    side_effects: []

  - method: POST
    path: "/v1/backcountry-permits"
    description: "Place a held backcountry permit; provisional availability check on zones + trailhead; authorized Payment; hold_expires_at = now+15m."
    roles: [visitor]
    code: 201
    input: [park_id, account_id, trailhead_id, entry_date, nights, party_size, zone_nights]
    output: BackcountryPermit
    side_effects: ["status=held; fee_cents per CALC backcountry_fee; authorized Payment created; hold does NOT commit zone/trailhead counters"]

  - method: POST
    path: "/v1/backcountry-permits/{id}/confirm"
    description: "Confirm a held permit; re-validate and commit zone-nights + trailhead exit; capture Payment."
    roles: [visitor]
    code: 200
    input: []
    output: BackcountryPermit
    side_effects: ["capture Payment; commit each zone-night and trailhead exit; status -> confirmed"]

  - method: POST
    path: "/v1/backcountry-permits/{id}/cancel"
    description: "Cancel a held or confirmed permit; release committed quota; tiered refund of refundable portion."
    roles: [visitor]
    code: 200
    input: []
    output: BackcountryPermit
    side_effects: ["release committed zone/trailhead counters (if confirmed); refund per CALC cancel_refund; status -> cancelled"]

  - method: GET
    path: "/v1/backcountry-permits/{id}"
    description: "Read a backcountry permit."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 200
    input: []
    output: BackcountryPermit
    side_effects: []

  - method: GET
    path: "/v1/backcountry-permits"
    description: "List permits; filter by account_id, trailhead_id, park_id, or payment_id (reverse-reachability for BackcountryPermit.account_id -> Account, trailhead_id -> Trailhead, park_id -> Park, payment_id -> Payment)."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 200
    input: ["account_id?", "trailhead_id?", "park_id?", "payment_id?"]
    output: BackcountryPermit[]
    side_effects: []

  # --- campsites, reservations, waitlist ---
  - method: POST
    path: "/v1/campsites"
    description: "Create a campsite (park_admin scoped to home_park_id); group sites require group pricing fields."
    roles: [park_admin]
    code: 201
    input: [park_id, site_number, site_type, max_occupancy, base_nightly_cents, "booking_window_days?", "group_base_cents?", "group_included_persons?", "group_extra_person_cents?", "status?"]
    output: Campsite
    side_effects: ["status defaults active"]

  - method: GET
    path: "/v1/campsites/{id}"
    description: "Read a campsite."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 200
    input: []
    output: Campsite
    side_effects: []

  - method: GET
    path: "/v1/campsites"
    description: "List campsites; filter by park_id (reverse-reachability for Campsite.park_id -> Park)."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 200
    input: ["park_id?"]
    output: Campsite[]
    side_effects: []

  - method: POST
    path: "/v1/camp-reservations"
    description: "Place a held campground reservation; hold_expires_at = now+15m; authorized Payment."
    roles: [visitor]
    code: 201
    input: [campsite_id, account_id, check_in, check_out, party_size]
    output: CampReservation
    side_effects: ["status=held; total_cents per CALC camp_total; authorized Payment created"]

  - method: POST
    path: "/v1/camp-reservations/{id}/confirm"
    description: "Confirm a held reservation (capture); re-check date conflict."
    roles: [visitor]
    code: 200
    input: []
    output: CampReservation
    side_effects: ["capture Payment; status -> confirmed"]

  - method: POST
    path: "/v1/camp-reservations/{id}/check-in"
    description: "Ranger checks in a confirmed reservation at its campsite's park."
    roles: [ranger]
    code: 200
    input: []
    output: CampReservation
    side_effects: ["status -> checked_in"]

  - method: POST
    path: "/v1/camp-reservations/{id}/complete"
    description: "Ranger completes a checked-in stay on/after check_out."
    roles: [ranger]
    code: 200
    input: []
    output: CampReservation
    side_effects: ["status -> completed"]

  - method: POST
    path: "/v1/camp-reservations/{id}/cancel"
    description: "Cancel a held or confirmed reservation; tiered refund (confirmed); release dates and cascade a waitlist offer."
    roles: [visitor]
    code: 200
    input: []
    output: CampReservation
    side_effects: ["refund per CALC cancel_refund (confirmed); release dates; make waitlist offer to lowest-position matching waiting entry; status -> cancelled"]

  - method: GET
    path: "/v1/camp-reservations/{id}"
    description: "Read a camp reservation."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 200
    input: []
    output: CampReservation
    side_effects: []

  - method: GET
    path: "/v1/camp-reservations"
    description: "List camp reservations; filter by campsite_id, account_id, payment_id and/or origin_waitlist_id (reverse-reachability for CampReservation.campsite_id -> Campsite, account_id -> Account, payment_id -> Payment, origin_waitlist_id -> WaitlistEntry)."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 200
    input: ["campsite_id?", "account_id?", "payment_id?", "origin_waitlist_id?"]
    output: CampReservation[]
    side_effects: []

  - method: POST
    path: "/v1/waitlist-entries"
    description: "Join a campsite waitlist for a date range; OCC on campsite version; position assigned per CALC waitlist_position."
    roles: [visitor]
    code: 201
    input: [campsite_id, account_id, check_in, check_out, party_size, expected_campsite_version]
    output: WaitlistEntry
    side_effects: ["increments Campsite.version by 1; status=waiting; position assigned"]

  - method: POST
    path: "/v1/waitlist-entries/{id}/claim"
    description: "Claim an active waitlist offer; creates a confirmed CampReservation."
    roles: [visitor]
    code: 200
    input: []
    output: CampReservation
    side_effects: ["entry status -> claimed; create confirmed CampReservation (origin_waitlist_id set); captured Payment"]

  - method: POST
    path: "/v1/waitlist-entries/{id}/cancel"
    description: "Cancel a waiting or offered waitlist entry; if offered, advance offer to next position."
    roles: [visitor]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["status -> cancelled; if was offered, advance offer to next waiting position"]

  - method: GET
    path: "/v1/waitlist-entries/{id}"
    description: "Read a waitlist entry."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []

  - method: GET
    path: "/v1/waitlist-entries"
    description: "List waitlist entries; filter by campsite_id and/or account_id (reverse-reachability for WaitlistEntry.campsite_id -> Campsite and account_id -> Account)."
    roles: [visitor, ranger, park_admin, finance, system]
    code: 200
    input: ["campsite_id?", "account_id?"]
    output: WaitlistEntry[]
    side_effects: []

  # --- payments (read) ---
  - method: GET
    path: "/v1/payments/{id}"
    description: "Read a payment."
    roles: [visitor, finance, park_admin, system]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/v1/payments"
    description: "List payments; filter by account_id (reverse-reachability for Payment.account_id -> Account)."
    roles: [finance, park_admin, system]
    code: 200
    input: ["account_id?"]
    output: Payment[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_VALIDATION, http: 400, condition: "Request body failed schema or field validation." }
  - { id: ERR_INVALID_PARTY_SIZE, http: 400, condition: "party_size out of allowed range." }
  - { id: ERR_INVALID_ITINERARY, http: 400, condition: "nights out of 1..14 or zone_nights length mismatch." }
  - { id: ERR_GROUP_CONFIG_MISSING, http: 400, condition: "group campsite create missing group pricing fields." }
  - { id: ERR_AGE_REQUIREMENT, http: 400, condition: "senior pass type requires account age >= 62." }
  - { id: ERR_HOME_PARK_REQUIRED, http: 400, condition: "ranger/park_admin account requires home_park_id." }
  - { id: ERR_UNAUTHORIZED, http: 401, condition: "Missing or unknown role on a non-public endpoint." }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role lacks permission or ownership/home-park scope for this operation." }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist." }
  - { id: ERR_EMAIL_TAKEN, http: 409, condition: "email already registered." }
  - { id: ERR_DUPLICATE_RESERVATION, http: 409, condition: "an active reservation already exists for this (account, slot)." }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "a non-terminal application already exists for this (account, draw)." }
  - { id: ERR_SLOT_FULL, http: 409, condition: "timed-entry slot has no remaining capacity (held+booked == capacity)." }
  - { id: ERR_ZONE_FULL, http: 409, condition: "a wilderness zone-night quota is exhausted." }
  - { id: ERR_TRAILHEAD_FULL, http: 409, condition: "trailhead daily exit quota is exhausted for entry_date." }
  - { id: ERR_DATE_CONFLICT, http: 409, condition: "campsite already occupied for overlapping dates." }
  - { id: ERR_DATES_AVAILABLE, http: 409, condition: "cannot waitlist; the requested range is currently bookable." }
  - { id: ERR_PASS_OVERLAP, http: 409, condition: "account already holds an active pass whose validity overlaps." }
  - { id: ERR_IDEMPOTENCY_CONFLICT, http: 409, condition: "Idempotency-Key reused with a different request body." }
  - { id: ERR_STATE_INVALID, http: 409, condition: "operation not allowed from the resource's current state." }
  - { id: ERR_HOLD_EXPIRED, http: 409, condition: "hold has expired; cannot confirm." }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "waitlist offer window has elapsed." }
  - { id: ERR_AWARD_WINDOW_CLOSED, http: 409, condition: "lottery award acceptance window has closed." }
  - { id: ERR_LOTTERY_CLOSED, http: 409, condition: "lottery is not currently accepting applications." }
  - { id: ERR_DRAW_NOT_READY, http: 409, condition: "draw cannot run before draw_at or when not accepting." }
  - { id: ERR_NOT_YET_RELEASED, http: 409, condition: "timed-entry slot not yet released for booking." }
  - { id: ERR_OUTSIDE_BOOKING_WINDOW, http: 409, condition: "requested date is outside the allowed booking window." }
  - { id: ERR_OVER_OCCUPANCY, http: 409, condition: "party_size exceeds campsite max occupancy." }
  - { id: ERR_SITE_UNAVAILABLE, http: 409, condition: "campsite is not active for booking." }
  - { id: ERR_VOID_NOT_ALLOWED, http: 409, condition: "pass cannot be voided (over 30 days, or free pass)." }
  - { id: ERR_OVER_REFUND, http: 409, condition: "refund would exceed captured amount." }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version." }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: visitor
    description: "A member of the public; manages own account, passes, and bookings."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /v1/atb-passes — purchase own pass"
      - "POST /v1/timed-entry-reservations — book own timed-entry"
      - "POST /v1/timed-entry-reservations/{id}/confirm|cancel — own reservation"
      - "POST /v1/lottery-draws/{id}/applications — apply"
      - "POST /v1/lottery-applications/{id}/withdraw|accept|decline — own application"
      - "POST /v1/backcountry-permits and /confirm|cancel — own permit"
      - "POST /v1/camp-reservations and /confirm|cancel — own reservation"
      - "POST /v1/waitlist-entries and /claim|cancel — own waitlist entry"
    shared_operations:
      - "POST /v1/accounts — register"
      - "GET reads of own/public resources (parks, slots, draws, trailheads, zones, campsites)"

  - name: ranger
    description: "Field staff at their home park; checks visitors in and completes stays."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /v1/timed-entry-reservations/{id}/check-in — at home park"
      - "POST /v1/camp-reservations/{id}/check-in — at home park"
      - "POST /v1/camp-reservations/{id}/complete — at home park"
    shared_operations:
      - "GET reads of bookings/inventory at home park"

  - name: park_admin
    description: "Administrator scoped to their home park; manages inventory and runs draws."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /v1/timed-entry-slots — at home park"
      - "POST /v1/trailheads, /v1/wilderness-zones, /v1/campsites — at home park"
      - "POST /v1/lottery-draws — at home park"
      - "POST /v1/lottery-draws/{id}/draw — run draw at home park"
      - "POST /v1/_clock/set_current_utc, POST /v1/_ops/run"
    shared_operations:
      - "GET reads at home park; GET /v1/accounts, /v1/payments"

  - name: finance
    description: "Back-office money operations."
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/atb-passes/{id}/void — void with refund"
    shared_operations:
      - "GET /v1/payments, /v1/payments/{id} — read all payments"
      - "POST /v1/_clock/set_current_utc, POST /v1/_ops/run"

rbac_matrix_notes: >
  "system" is an internal operator role usable for seeding parks and running
  ops/clock in tests. For entity_backed roles (visitor, ranger, park_admin),
  X-User-ID equals an Account.id; ownership checks compare X-User-ID to the
  resource's account_id, and ranger/park_admin park-scope checks compare the
  acting Account.home_park_id to the resource's park. finance is opaque
  (operator id not tied to an entity). Unauthenticated access to non-public
  endpoints yields ERR_UNAUTHORIZED; wrong-role or cross-park access yields
  ERR_FORBIDDEN.
