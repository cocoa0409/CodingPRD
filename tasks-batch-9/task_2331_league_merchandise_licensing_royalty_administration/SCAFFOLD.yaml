    side_effects:
      - "OCC on LicenseAgreement.version per §1.2.1 rule report-create-stale-agreement"
      - "status starts at DRAFT; no calculation runs and no ledger is touched until FILE"
      - "increments LicenseAgreement.version by 1"

  - method: GET
    path: /licensing/royalty-reports
    description: List royalty reports.
    roles: [LeagueLicensingManager, MarkComplianceOfficer, FinanceController, RoyaltyAuditor, Licensee]
    code: 200
    input: ["agreement_id?", "audit_engagement_id?", "distribution_run_id?", "period_quarter?", "status?", "limit?", "offset?"]
    output: RoyaltyReport[]
    side_effects: []

  - method: GET
    path: /licensing/royalty-reports/{reportId}
    description: Retrieve one royalty report with every computed money field.
    roles: [LeagueLicensingManager, MarkComplianceOfficer, FinanceController, RoyaltyAuditor, Licensee]
    code: 200
    input: []
    output: RoyaltyReport
    side_effects: []

  - method: PATCH
    path: /licensing/royalty-reports/{reportId}
    description: Correct the sales lines of a DRAFT or RETURNED report.
    roles: [Licensee]
    code: 200
    input: ["channel_lines"]
    output: RoyaltyReport
    side_effects:
      - "permitted only while status IN {DRAFT, RETURNED}"
      - "clears every computed money field back to 0 until the next FILE recomputes them"
      - "increments RoyaltyReport.version by 1"

  - method: POST
    path: /licensing/royalty-reports/{reportId}/file
    description: File the report, running the PROVISIONAL_QUARTERLY royalty and payable computation.
    roles: [Licensee]
    code: 200
    input: []
    output: RoyaltyReport
    side_effects:
      - "runs calculations.royalty_due_computation (PROVISIONAL_QUARTERLY) and calculations.advance_recoupment_and_payable (PROJECTION_AT_FILE)"
      - "the advance ledger on the agreement is NOT touched at file time"

  - method: POST
    path: /licensing/royalty-reports/{reportId}/review-decisions
    description: Accept or return a filed report.
    roles: [FinanceController]
    code: 200
    input: ["decision", "reason?"]
    output: RoyaltyReport
    side_effects:
      - "ACCEPT applies calculations.advance_recoupment_and_payable (LEDGER_AT_ACCEPT) to the agreement and pools the royalty into an OPEN DistributionRun when central_licensing_flag == true"
      - "RETURN increments return_count and adds a REPORT_RETURN risk factor"

  # ------------------------------------------------------- AuditEngagement
  - method: POST
    path: /licensing/audit-engagements
    description: Open an audit engagement over a contiguous span of reported quarters.
    roles: [RoyaltyAuditor]
    code: 201
    input: ["agreement_id", "scope_quarters"]
    output: AuditEngagement
    side_effects:
      - "status starts at OPENED; opened_by_user_id = X-User-ID and opened_quarter = QUARTER_OF(clock)"
      - "enforces the segregation-of-duties check at §1.4 priority 14 and the lookback window at priority 41"

  - method: GET
    path: /licensing/audit-engagements
    description: List audit engagements.
    roles: [LeagueLicensingManager, MarkComplianceOfficer, FinanceController, RoyaltyAuditor, Licensee]
    code: 200
    input: ["agreement_id?", "status?", "cost_shift_applied?", "limit?", "offset?"]
    output: AuditEngagement[]
    side_effects: []

  - method: GET
    path: /licensing/audit-engagements/{engagementId}
    description: Retrieve one audit engagement including its findings block.
    roles: [LeagueLicensingManager, MarkComplianceOfficer, FinanceController, RoyaltyAuditor, Licensee]
    code: 200
    input: []
    output: AuditEngagement
    side_effects: []

  - method: POST
    path: /licensing/audit-engagements/{engagementId}/begin-fieldwork
    description: Pull every in-scope accepted report into UNDER_AUDIT.
    roles: [RoyaltyAuditor]
    code: 200
    input: []
    output: AuditEngagement
    side_effects:
      - "drives SM6 OPENED->FIELDWORK and SM5 ACCEPTED->UNDER_AUDIT for every in-scope report"

  - method: POST
    path: /licensing/audit-engagements/{engagementId}/issue-findings
    description: Issue (or re-issue) restated sales data and the recovery assessment.
    roles: [RoyaltyAuditor]
    code: 200
    input: ["audited_quarters"]
    output: AuditEngagement
    side_effects:
      - "runs calculations.underreporting_recovery_assessment; sets cost_shift_applied at the inclusive 500 bps boundary"
      - "records findings_issued_by_user_id for the segregation-of-duties check at settle"

  - method: POST
    path: /licensing/audit-engagements/{engagementId}/dispute
    description: Dispute issued findings.
    roles: [Licensee]
    code: 200
    input: ["dispute_note"]
    output: AuditEngagement
    side_effects:
      - "drives SM6 FINDINGS_ISSUED->DISPUTED; the findings block is retained until re-issued"

  - method: POST
    path: /licensing/audit-engagements/{engagementId}/settle
    description: Settle the assessment and trigger the five-hop restatement cascade.
    roles: [FinanceController]
    code: 200
    input: ["settlement_basis", "negotiated_cents?"]
    output: AuditEngagement
    side_effects:
      - "drives SM6 FINDINGS_ISSUED->SETTLED plus cascade hops 1-5 (reports ADJUSTED, agreement ledger reversed and re-applied, licensee risk index recomputed, agreement postures moved, submissions held)"
      - "requires X-User-ID != findings_issued_by_user_id (§1.4 priority 13)"

  - method: POST
    path: /licensing/audit-engagements/{engagementId}/close
    description: Close the engagement and release its reports.
    roles: [RoyaltyAuditor]
    code: 200
    input: []
    output: AuditEngagement
    side_effects:
      - "every in-scope report with status IN {UNDER_AUDIT, ADJUSTED} moves to CLOSED"

