          entity pair from ElectricalTestRecord -> HarnessUnit.
        test_recipe:
          setup:
            - "Drawing DWG-CE2 in DRAFT with one component; applicator exists"
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-CE2", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-20", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 100 }, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-CE2", compatible_terminal_mpn: "TERM-20" }, as: ProcessEngineer, captures: { ap: $.data.id } }
          trigger:
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-CE2", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 20, wire_type: "TXL", cut_length_mm: 500.0, strip_length_mm: 5.0, terminal_mpn: "TERM-20", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { err: $.data.error_id } }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-CE2", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 20, wire_type: "TXL", cut_length_mm: 500.0, strip_length_mm: 5.0, terminal_mpn: "TERM-20", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { pr: $.data.id } }
          assert:
            - "captured err == ERR_DRAWING_NOT_RELEASED   # while DRAFT"
            - "MachineProgram.${pr}.status == DRAFT and min_pull_force_n == 30.0   # succeeds after release"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: applicator_setup_half_open_adjacency
        grounds:
          - validations[priority=9]
          - errors[ERR_APPLICATOR_SETUP_OVERLAP]
          - entities.ApplicatorSetup.fields.planned_start_at
        distinguishing_aspect: |
          Half-open interval semantics on the Applicator resource: a setup whose
          start equals the previous window's end (10:00 == 10:00) is ACCEPTED
          (adjacent, not overlapping), while a window sharing interior time
          (09:30-10:30 vs 08:00-10:00) is rejected with ERR_APPLICATOR_SETUP_OVERLAP.
        test_recipe:
          setup:
            - "Drawing, program, applicator AP; setup S1 [08:00, 10:00) created and closed"
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-TO1", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-20", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 100 }, as: HarnessEngineer }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-TO1", compatible_terminal_mpn: "TERM-20" }, as: ProcessEngineer, captures: { ap: $.data.id } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-TO1", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 20, wire_type: "TXL", cut_length_mm: 500.0, strip_length_mm: 5.0, terminal_mpn: "TERM-20", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { pr: $.data.id } }
            - { call: "POST /plant/operators", payload: { operator_name: "SE TO1", badge_no: "B-SE-TO1" }, as: QualityManager, captures: { op: $.data.id } }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr}", setup_operator_id: "${op}", planned_start_at: "2026-08-01T08:00:00Z", planned_end_at: "2026-08-01T10:00:00Z" }, as: ProcessEngineer, captures: { su1: $.data.id } }
            - { call: "POST /plant/applicator-setups/${su1}/close", payload: { closed_at: "2026-08-01T10:00:00Z" }, as: ProcessEngineer }
          trigger:
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr}", setup_operator_id: "${op}", planned_start_at: "2026-08-01T09:30:00Z", planned_end_at: "2026-08-01T10:30:00Z" }, as: ProcessEngineer, captures: { err: $.data.error_id } }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr}", setup_operator_id: "${op}", planned_start_at: "2026-08-01T10:00:00Z", planned_end_at: "2026-08-01T12:00:00Z" }, as: ProcessEngineer, captures: { su2: $.data.id } }
          assert:
            - "captured err == ERR_APPLICATOR_SETUP_OVERLAP   # interior overlap with S1"
            - "ApplicatorSetup.${su2}.status == OPEN   # adjacency [10:00,12:00) after [08:00,10:00) allowed under half-open semantics"

      - name: certification_closed_interval_touch_rejected
        grounds:
          - validations[priority=9]
          - errors[ERR_CERT_WINDOW_OVERLAP]
          - entities.OperatorCertification.fields.issued_at
        distinguishing_aspect: |
          Closed-interval semantics on the OperatorCertification resource — the
          opposite geometry from applicator setups: a new cert whose issued_at
          exactly equals the existing cert's expires_at TOUCHES the old window and
          is REJECTED (ERR_CERT_WINDOW_OVERLAP); only a start strictly after
          expires_at (+1s) is accepted. Different resource, different interval
          semantics from the half-open setup rule.
        test_recipe:
          setup:
            - "Operator OP with class-2 cert C1 [2026-01-01, 2027-01-01]"
          setup_api_calls:
            - { call: "POST /plant/operators", payload: { operator_name: "OP TO2", badge_no: "B-OP-TO2" }, as: QualityManager, captures: { op: $.data.id } }
            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${op}", workmanship_class: "IPC_CLASS_2", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: QualityManager, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${op}", workmanship_class: "IPC_CLASS_2", issued_at: "2027-01-01T00:00:00Z", expires_at: "2028-01-01T00:00:00Z" }, as: QualityManager, captures: { err: $.data.error_id } }
            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${op}", workmanship_class: "IPC_CLASS_2", issued_at: "2027-01-01T00:00:01Z", expires_at: "2028-01-01T00:00:00Z" }, as: QualityManager, captures: { c2: $.data.id } }
          assert:
            - "captured err == ERR_CERT_WINDOW_OVERLAP   # touching endpoints count as overlap under closed-interval semantics"
            - "OperatorCertification.${c2}.status == ACTIVE   # start one second after expires_at is disjoint"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: consigned_piece_conservation_across_issue_scrap_return
        grounds:
          - calculations.consigned_lot_quantity_reconciliation
          - state_machines.ConsignedLot.ACTIVE_to_RETURNED
          - state_machines.Kit.STAGED_to_DELIVERED_LINESIDE
        distinguishing_aspect: |
          Conserved quantity = physical piece count of the consigned lot:
          qty_on_hand + qty_issued_open + qty_consumed + qty_scrapped +
          qty_returned == qty_received (10) across the forward/compensating pairs
          issue/deliver (4), scrap (1), and return-to-customer (6).
        test_recipe:
          setup:
            - "Class-2 drawing with consigned connector C1 (qty_per 1, 450c), RELEASED; qualified program; certified inspector; line operator"
            - "Lot received 10 (liability 500, replacement 640); order qty 4 kitted (C1 x4) and delivered; 4 units built (order TESTING)"
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-CI1", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "C1", component_type: "CONNECTOR", mpn: "CON-500", qty_per_harness: 1, supply_type: "CUSTOMER_CONSIGNED", unit_cost_cents: 450 }, as: HarnessEngineer, captures: { c1: $.data.id } }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-CI1", compatible_terminal_mpn: "TERM-20" }, as: ProcessEngineer, captures: { ap: $.data.id } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-CI1", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 20, wire_type: "TXL", cut_length_mm: 500.0, strip_length_mm: 5.0, terminal_mpn: "TERM-20", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { pr: $.data.id } }
            - { call: "POST /plant/operators", payload: { operator_name: "QI CI1", badge_no: "B-QI-CI1" }, as: QualityManager, captures: { qi: $.data.id } }
            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${qi}", workmanship_class: "IPC_CLASS_2", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: QualityManager }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr}", setup_operator_id: "${qi}", planned_start_at: "2026-08-01T08:00:00Z", planned_end_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer, captures: { su: $.data.id } }
            - { call: "POST /plant/applicator-setups/${su}/close", payload: { closed_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer }
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr}", sample_kind: "FIRST_ARTICLE", measured_force_n: 35.0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/consigned-lots", payload: { lot_code: "LOT-CI1", owner_customer_code: "ACME", mpn: "CON-500", unit_liability_cents: 500, replacement_cost_cents: 640, qty_received: 10 }, as: MaterialsClerk, captures: { lot: $.data.id } }
            - { call: "POST /plant/build-orders", payload: { order_code: "BO-CI1", drawing_id: "${dr}", qty_ordered: 4 }, as: ProductionPlanner, captures: { bo: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/release-to-kitting", payload: {}, as: ProductionPlanner }
            - { call: "GET /plant/kits", payload: { build_order_id: "${bo}" }, as: MaterialsClerk, captures: { kit: "$.data[0].id" } }
            - { call: "POST /plant/kits/${kit}/issues", payload: { component_id: "${c1}", qty_issued: 4, source: "CONSIGNED_LOT", consigned_lot_id: "${lot}" }, as: MaterialsClerk }
            - { call: "POST /plant/kits/${kit}/deliver", payload: {}, as: MaterialsClerk }
            - { call: "POST /plant/operators", payload: { operator_name: "LO CI1", badge_no: "B-LO-CI1" }, as: QualityManager, captures: { lo: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}", captures: { u1: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}" }
            - { call: "POST /plant/build-orders/${bo}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}" }
            - { call: "POST /plant/build-orders/${bo}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}" }
          trigger:
            - { call: "POST /plant/harness-units/${u1}/scrap", payload: { reason: "DAMAGE" }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/consigned-lots/${lot}/return", payload: {}, as: MaterialsClerk }
            - { call: "GET /plant/consigned-lots/${lot}", payload: {}, as: MaterialsClerk }
          assert:
            - "ConsignedLot.${lot}.qty_on_hand == 0"
            - "ConsignedLot.${lot}.qty_issued_open == 0"
            - "ConsignedLot.${lot}.qty_consumed == 3"
            - "ConsignedLot.${lot}.qty_scrapped == 1"
            - "ConsignedLot.${lot}.qty_returned == 6"
            - "0 + 0 + 3 + 1 + 6 == 10 == ConsignedLot.${lot}.qty_received   # conservation invariant"
            - "ConsignedLot.${lot}.status == RETURNED"

      - name: harness_unit_bucket_conservation_across_build_scrap_ship
        grounds:
          - calculations.build_order_quantity_reconciliation
          - state_machines.HarnessUnit.BUILT | REWORK | SUSPECT_to_SCRAPPED
          - state_machines.HarnessUnit.TEST_PASS_to_SHIPPED
        distinguishing_aspect: |
          Conserved quantity = serialized harness count of the build order
          (distinct from consigned pieces): building increments qty_built, the
          compensating scrap moves a unit between buckets leaving
          qty_built + qty_scrapped == 3 == qty_ordered unchanged, and shipping
          does not disturb the sum either.
        test_recipe:
          setup:
            - "Class-2 factory-only drawing; qualified program; certified inspector; order qty 3 kitted/delivered; units U1,U2,U3 built (order TESTING)"
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-CI2", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-20", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 100 }, as: HarnessEngineer, captures: { t1: $.data.id } }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-CI2", compatible_terminal_mpn: "TERM-20" }, as: ProcessEngineer, captures: { ap: $.data.id } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-CI2", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 20, wire_type: "TXL", cut_length_mm: 500.0, strip_length_mm: 5.0, terminal_mpn: "TERM-20", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { pr: $.data.id } }
            - { call: "POST /plant/operators", payload: { operator_name: "QI CI2", badge_no: "B-QI-CI2" }, as: QualityManager, captures: { qi: $.data.id } }
            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${qi}", workmanship_class: "IPC_CLASS_2", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: QualityManager }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr}", setup_operator_id: "${qi}", planned_start_at: "2026-08-01T08:00:00Z", planned_end_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer, captures: { su: $.data.id } }
            - { call: "POST /plant/applicator-setups/${su}/close", payload: { closed_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer }
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr}", sample_kind: "FIRST_ARTICLE", measured_force_n: 35.0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/build-orders", payload: { order_code: "BO-CI2", drawing_id: "${dr}", qty_ordered: 3 }, as: ProductionPlanner, captures: { bo: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/release-to-kitting", payload: {}, as: ProductionPlanner }
            - { call: "GET /plant/kits", payload: { build_order_id: "${bo}" }, as: MaterialsClerk, captures: { kit: "$.data[0].id" } }
            - { call: "POST /plant/kits/${kit}/issues", payload: { component_id: "${t1}", qty_issued: 3, source: "FACTORY_STOCK" }, as: MaterialsClerk }
            - { call: "POST /plant/kits/${kit}/deliver", payload: {}, as: MaterialsClerk }
            - { call: "POST /plant/operators", payload: { operator_name: "LO CI2", badge_no: "B-LO-CI2" }, as: QualityManager, captures: { lo: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}", captures: { u1: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}", captures: { u2: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}", captures: { u3: $.data.id } }
          trigger:
            - { call: "POST /plant/harness-units/${u1}/scrap", payload: { reason: "QC_SUSPECT" }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "GET /plant/build-orders/${bo}", payload: {}, as: ProductionPlanner, captures: { built_after_scrap: $.data.qty_built, scrapped_after_scrap: $.data.qty_scrapped } }
            - { call: "POST /plant/electrical-test-records", payload: { harness_unit_id: "${u2}", test_type: "CONTINUITY", opens_count: 0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/electrical-test-records", payload: { harness_unit_id: "${u2}", test_type: "HIPOT", hipot_voltage_v: 1000.0, dwell_seconds: 2.0, measured_leakage_ua: 5.0, leakage_limit_ua: 10.0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/harness-units/${u2}/ship", payload: {}, as: ShippingClerk }
            - { call: "GET /plant/build-orders/${bo}", payload: {}, as: ProductionPlanner }
          assert:
            - "captured built_after_scrap == 2 and scrapped_after_scrap == 1   # build-then-scrap moves buckets"
            - "2 + 1 == 3 == BuildOrder.${bo}.qty_ordered   # conserved across scrap"
            - "After ship: BuildOrder.${bo}.qty_built == 2 and qty_scrapped == 1   # SHIPPED still counts as built; sum conserved"
            - "HarnessUnit.${u2}.status == SHIPPED"
