        distinguishing_aspect: "OCC on PurchaseOrder.version: after a first link create bumps the PO version 1 -> 2, a second create still carrying expected_po_version 1 fails 412 ERR_STALE_VERSION; re-reading the PO and retrying with version 2 succeeds."
        test_recipe:
          setup: ["TESTING connection; shipper with PO and two shipments; first link created (PO version now 2)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "OccPoCo", scac_code: "OCPC" }
              as: NetworkOps
              captures: { x1_car: $.data.id }
            - call: "POST /carriers/${x1_car}/connections"
              payload: { channel: "TMS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { x1_conn: $.data.id }
            - call: "POST /connections/${x1_conn}/submit-credentials"
              payload: { credential_ref: "vault://ocpc" }
              as: CarrierRep
              as_user_id: "${x1_car}"
            - call: "POST /connections/${x1_conn}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-10T00:00:00Z" }
              as: NetworkOps
            - call: "POST /shippers"
