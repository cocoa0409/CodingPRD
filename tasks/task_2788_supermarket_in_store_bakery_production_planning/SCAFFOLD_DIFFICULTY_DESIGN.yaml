      - name: cake_quote_applies_rush_fee_before_volume_discount
        grounds:
          - calculations.custom_cake_quote
          - entities.CustomCakeOrder.fields.rush_fee_cents
          - entities.CustomCakeOrder.fields.volume_discount_cents
          - entities.CustomCakeOrder.fields.quote_total_cents
          - endpoints.POST_/bakery/custom-cake-orders
        distinguishing_aspect: |
          Mode (c): EVALUATION-ORDER dependence between two bracket lookups. The rush
          bracket is read off the undiscounted subtotal (19800 -> 8% -> 1584) and the
          discount bracket off the fee-inflated total (21384 -> 10% -> 2138), giving
          19246. Discounting first would pick different brackets on both lookups
