      - name: frozen_authorization_capacity_and_live_guide_capacity_diverge_and_only_a_new_link_resyncs_them
        claim_type: computed_read
        grounds:
          - entities.GuideAreaAuthorization.authorized_client_capacity
          - entities.Permit.authorized_client_capacity_total
          - entities.Guide.base_client_capacity
          - endpoints.POST /osup/guides/{id}/certifications
        distinguishing_aspect: |
          Two derived numbers that share one formula but differ in WHEN they are evaluated:
          Guide.base_client_capacity is recomputed on every certification write, while
          GuideAreaAuthorization.authorized_client_capacity is frozen at link time and never re-derived.
          A DOWNGRADE (not the upgrade the scaffold warns about) drives them apart, the permit total
          keeps following the frozen figure, the revoked row keeps its historical 8 for the audit
          record, and only re-authorizing picks up the new, lower live value.
