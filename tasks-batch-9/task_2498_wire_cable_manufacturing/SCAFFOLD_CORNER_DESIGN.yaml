              as: ShippingClerk
              captures: { ship_a: $.data.id }
            - call: "GET /customer-orders/${ord_id}"
              payload: {}
              as: ShippingClerk
              captures: { ord_v2: $.data.version, shipped_after_first: $.data.shipped_kft, fulfil_after_first: $.data.fulfillment_status }
            - call: "PATCH /customers/${cust_id}"
              payload: { credit_limit_usd: 400.00 }
              as: BillingAnalyst
              captures: { cust_status_held: $.data.status, exposure_held: $.data.credit_exposure_usd }
          trigger:
            - call: "POST /shipments"
              payload: { order_id: "${ord_id}", lot_id: "${lot_b}", reel_id: "${reel_b}", shipped_length_ft: 2000, ship_date: "2026-08-01", cuts_count: 0, expected_order_version: "${ord_v1}" }
              as: ShippingClerk
              captures: { e_occ: $.data.error_id }
            - call: "GET /reels/${reel_b}"
              payload: {}
              as: ShippingClerk
              captures: { reel_b_status_after_412: $.data.status }
            - call: "GET /customer-orders/${ord_id}"
              payload: {}
              as: ShippingClerk
              captures: { ord_v_after_412: $.data.version, shipped_after_412: $.data.shipped_kft }
            - call: "GET /shipments"
              payload: {}
              as: ShippingClerk
            - call: "POST /shipments"
              payload: { order_id: "${ord_id}", lot_id: "${lot_b}", reel_id: "${reel_b}", shipped_length_ft: 2000, ship_date: "2026-08-01", cuts_count: 0, expected_order_version: "${ord_v2}" }
              as: ShippingClerk
              captures: { e_quantity: $.data.error_id }
            - call: "POST /shipments"
              payload: { order_id: "${ord_id}", lot_id: "${lot_b}", reel_id: "${reel_b}", shipped_length_ft: 1000, ship_date: "2026-08-01", cuts_count: 0, expected_order_version: "${ord_v2}" }
              as: ShippingClerk
              captures: { e_credit: $.data.error_id }
            - call: "PATCH /customers/${cust_id}"
