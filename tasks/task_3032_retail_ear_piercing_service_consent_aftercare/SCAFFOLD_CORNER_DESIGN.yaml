        claim_type: Violation → Error
        grounds:
          - validations[priority=9]
          - errors[ERR_IDENTIFICATION_TYPE_MISMATCH]
        distinguishing_aspect: "A guardian-present consent verified with a photo id instead of the birth certificate the mapping demands is rejected with ERR_IDENTIFICATION_TYPE_MISMATCH."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Jurisdiction IL; customer C1 born 2015-01-01; guardian-present consent carrying identification_type GOVERNMENT_PHOTO_ID with the guardian already VERIFIED."
          setup_api_calls:
            - *k_clock
            - *k_jur_il
            - call: "POST /piercing-services/customers"
              payload: { full_name: "Young Client", date_of_birth: "2015-01-01T00:00:00Z", guardian_name: "Parent Client", guardian_contact: "p@x.com" }
              as: IntakeAssociate
              captures: { cust_id: "$.data.id" }
            - call: "POST /piercing-services/consents"
              payload: { customer_id: "${cust_id}", jurisdiction_id: "${jur_id}", consent_type: "GUARDIAN_PRESENT", identification_type: "GOVERNMENT_PHOTO_ID", identification_number_masked: "****1234", signed_at: "2026-08-30T00:00:00Z" }
              as: IntakeAssociate
              captures: { cons_id: "$.data.id" }
            - call: "POST /piercing-services/consents/${cons_id}/guardian-verification"
              payload: { outcome: "VERIFIED" }
              as: IntakeAssociate
          trigger:
            - call: "POST /piercing-services/consents/${cons_id}/verify"
              payload: { }
              as: IntakeAssociate
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 422 and response_type is error"
            - "the response error_id == ERR_IDENTIFICATION_TYPE_MISMATCH"
            - "ConsentRecord.${cons_id}.consent_status == PENDING"

      - name: consent_verify_succeeds_when_every_gate_passes
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=8]
          - validations[priority=9]
