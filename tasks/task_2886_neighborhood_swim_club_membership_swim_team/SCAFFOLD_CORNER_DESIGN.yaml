            - "${err_again} == ERR_ALREADY_TERMINAL with HTTP 409: CANCELLED_BY_HOST is terminal, so a second cancellation cannot refund twice"

  # ---------------------------------------------------------------------------
  # RBAC (guide section 7)
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: exclusive_operations_each_office_owns_its_own_endpoints
        claim_type: exclusive_operations
        grounds:
          - roles.BoardPresident.exclusive_operations
          - roles.Treasurer.exclusive_operations
          - roles.SystemOperator.exclusive_operations
          - validations[priority=3]
        distinguishing_aspect: |
          Every refusal here is paired with the identical request issued by the owning office, so a
          403 can never be explained by a malformed payload or a missing fixture. The roles chosen are
          the ones a plausible implementation is most likely to over-share: the PoolManager runs the
          facility but may not create a season, the MembershipChair sells memberships but may not
          invoice one, and no business office at all may drive the logical clock.
        test_recipe:
          setup:
            - "Nothing but the clock is needed up front; every entity the instance touches is created inside the trigger by its owning role."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "COUPLE", label: "Couple", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 30000, guest_pass_allotment: 2, max_household_size: 4, volunteer_credits_required: 2, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: PoolManager
              captures: { err_season_create: $.data.error_id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              as_user_id: bp-001
              captures: { s27_id: $.data.id, s_status_0: $.data.status }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: BoardPresident
              as_user_id: bp-001
              captures: { err_season_open: $.data.error_id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
              captures: { s_status_1: $.data.status }
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Rbac Household", address_line: "341 Cedar Court", residency: "IN_DISTRICT", member_count: 2, prior_member: false }
              as: PoolManager
              captures: { err_household_create: $.data.error_id }
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Rbac Household", address_line: "341 Cedar Court", residency: "IN_DISTRICT", member_count: 2, prior_member: false }
              as: MembershipChair
              captures: { h_id: $.data.id, h_standing_0: $.data.standing }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}", join_date: "2027-06-01", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m_id: $.data.id }
            - call: "POST /swim-club/memberships/${m_id}/invoice"
              payload: {}
              as: MembershipChair
              captures: { err_invoice: $.data.error_id }
            - call: "POST /swim-club/memberships/${m_id}/invoice"
              payload: {}
              as: Treasurer
              captures: { m_dues: $.data.dues_status, m_access: $.data.access_status }
            - call: "POST /swim-club/households/${h_id}/standing-transitions"
              payload: { to_standing: "PROBATION", reason: "Chair attempts a standing change" }
              as: MembershipChair
              captures: { err_standing: $.data.error_id }
            - call: "POST /swim-club/households/${h_id}/standing-transitions"
              payload: { to_standing: "PROBATION", reason: "Board places the household on probation" }
              as: BoardPresident
              as_user_id: bp-001
              captures: { h_standing_1: $.data.standing }
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-02T09:00:00Z" }
              as: BoardPresident
              as_user_id: bp-001
              captures: { err_clock: $.data.error_id }
            - call: "POST /swim-club/seasons/${s27_id}/reserve-contributions"
              payload: { amount_cents: 50000, note: "Board tries to book the assessment itself" }
              as: BoardPresident
              as_user_id: bp-001
              captures: { err_reserve: $.data.error_id }
            - call: "POST /swim-club/seasons/${s27_id}/reserve-contributions"
              payload: { amount_cents: 50000, note: "Treasurer books the assessment" }
              as: Treasurer
              as_user_id: tr-001
              captures: { s_res: $.data.reserve_contributions_cents }
          assert:
            - "${err_season_create} == ERR_UNAUTHORIZED with HTTP 403, and the identical body from BoardPresident is HTTP 201 with ${s_status_0} == PLANNED"
            - "${err_season_open} == ERR_UNAUTHORIZED: creating a season and opening it are different offices, so the creator cannot open it; PoolManager then opens it with ${s_status_1} == OPEN"
            - "${err_household_create} == ERR_UNAUTHORIZED, and the identical body from MembershipChair is HTTP 201 with ${h_standing_0} == GOOD_STANDING"
            - "${err_invoice} == ERR_UNAUTHORIZED for the chair who created the membership, while the Treasurer's identical call is HTTP 200 with ${m_dues} == INVOICED and ${m_access} == ACTIVE"
            - "${err_standing} == ERR_UNAUTHORIZED, and the board's identical transition yields ${h_standing_1} == PROBATION"
            - "${err_clock} == ERR_UNAUTHORIZED: the clock endpoint is SystemOperator-exclusive and carries no business authority in either direction"
            - "${err_reserve} == ERR_UNAUTHORIZED for the board, while the Treasurer books it with ${s_res} == 50000"
            - "every refused call left no row and no field change behind: the season, household, membership, standing and reserve figures are exactly what the authorised calls produced"

      - name: cross_role_denied_authentication_outranks_authorisation_and_validation
        claim_type: cross_role_denied
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
          - validations[priority=10]
        distinguishing_aspect: |
          The three auth failures are separated by construction. A blank X-User-Role and an
          unrecognised X-User-Role both return 401 even on an endpoint the caller would never have been
          allowed to use, which proves p1 and p2 outrank p3. A recognised but wrong role returns 403
          even when the body is missing a required field, which proves p3 outranks p10. And a blank
          X-User-ID with a perfectly good role is still 401, which is the header that is easiest to
          forget to check.
        test_recipe:
          setup:
            - "One OPEN 2027 season and one COUPLE category, so every endpoint under test has a live target."
            - "The clock sits at 2027-07-01T09:00Z."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "COUPLE", label: "Couple", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 30000, guest_pass_allotment: 2, max_household_size: 4, volunteer_credits_required: 2, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              as_user_id: bp-001
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Auth Order Household", address_line: "351 Cedar Court", residency: "IN_DISTRICT", member_count: 2, prior_member: false }
              as: MembershipChair
              captures: { h_id: $.data.id }
          trigger:
            - call: "GET /swim-club/seasons/${s27_id}"
              payload: {}
              as: ""
              captures: { err_blank_role: $.data.error_id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2029, open_date: "2029-05-19", close_date: "2029-09-03", dues_due_date: "2029-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: ""
              captures: { err_blank_role_on_forbidden: $.data.error_id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2029, open_date: "2029-05-19", close_date: "2029-09-03", dues_due_date: "2029-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: PoolAttendant
              captures: { err_unknown_role: $.data.error_id }
            - call: "GET /swim-club/seasons/${s27_id}"
              payload: {}
              as: Member
              as_user_id: ""
              captures: { err_blank_user_id: $.data.error_id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}" }
              as: PoolManager
              captures: { err_role_beats_validation: $.data.error_id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}" }
              as: MembershipChair
              captures: { err_validation_alone: $.data.error_id }
            - call: "GET /swim-club/lifeguards"
              payload: {}
              as: SwimTeamCoach
              captures: { err_read_denied: $.data.error_id }
            - call: "GET /swim-club/lifeguards"
              payload: {}
              as: HealthInspector
              as_user_id: hi-001
              captures: { lg_list: $.data }
            - call: "POST /swim-club/inspection-findings"
              payload: { season_id: "${s27_id}", inspected_on: "2027-06-28", inspector_name: "Pool manager tries to file", finding_code: "CHEM-04", severity: "MINOR", narrative: "Manager files his own finding." }
              as: PoolManager
              captures: { err_finding_create: $.data.error_id }
          assert:
            - "${err_blank_role} == ERR_UNAUTHENTICATED with HTTP 401 on a read that every business role may perform, so the missing header is caught before anything else"
            - "${err_blank_role_on_forbidden} == ERR_UNAUTHENTICATED, NOT ERR_UNAUTHORIZED: p1 outranks p3, even though no role in the request could ever have created a season"
            - "${err_unknown_role} == ERR_UNAUTHENTICATED with HTTP 401 for a syntactically fine but undeclared role name, again in preference to the 403"
            - "${err_blank_user_id} == ERR_UNAUTHENTICATED: both headers are required, not just the role"
            - "${err_role_beats_validation} == ERR_UNAUTHORIZED with HTTP 403 although join_date is missing from the body, so p3 outranks p10"
            - "${err_validation_alone} == ERR_VALIDATION with HTTP 422 for the identical body sent by the authorised role, which proves the body really was invalid and the 403 was about the role"
            - "${err_read_denied} == ERR_UNAUTHORIZED: the coach has no business with the guard registry, and GET endpoints are role-checked exactly like writes"
            - "${lg_list} is returned HTTP 200 to the HealthInspector, who is in that endpoint's role list, so the refusal above was role-specific and not a broken route"
            - "${err_finding_create} == ERR_UNAUTHORIZED: only the HealthInspector may file a finding, which is what keeps the closure protocol out of the club's own hands"
            - "no refused call created a season, a membership or a finding"

      - name: not_resource_owner_a_member_is_scoped_to_its_own_household
        claim_type: not_resource_owner
        grounds:
          - validations[priority=4]
          - validations[priority=3]
          - state_machines[WaitlistEntry].OFFERED_to_ACCEPTED
        distinguishing_aspect: |
          Ownership is reached three different ways in one instance - directly on a Household, through
          membership.household_id on a Membership, and directly on a WaitlistEntry - and each is
          checked with the other household's Member so the same endpoint answers 403 and 200 depending
          only on X-User-ID. A staff role is then shown succeeding on the very resource the foreign
          Member was refused, which proves priority 4 is scoped to Members and is not a blanket
          ownership filter.
        test_recipe:
          setup:
            - "One FAMILY category (waitlist_required true) and one COUPLE category (waitlist_required false)."
            - "One OPEN 2027 season."
            - "Households A and B, each with an invoiced COUPLE membership, and each holding a WAITING FAMILY waitlist entry; A's entry is then OFFERED."
            - "The clock sits at 2027-07-01T09:00Z, well inside A's 14-day offer window."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "COUPLE", label: "Couple", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 30000, guest_pass_allotment: 2, max_household_size: 4, volunteer_credits_required: 2, waitlist_required: false, proration_allowed: true, party_privileges: true }
