    instances:
      - name: money_conservation_across_trade_cycle
        grounds: ["calculations.doc_fee", "entities.SalesOrder.fields.amount_financed_cents", "state_machines.TradeInAppraisal.OFFERED_to_ACCEPTED"]
        distinguishing_aspect: |
          Conserved quantity: order consideration in cents. Invariant
