# =============================================================================
# task_0891 — §1.9 Scaffold Corner Design (breadth coverage index)
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: case_create_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Case.fields.status, entities.Case.fields.delinquency_status]
        distinguishing_aspect: "POST /collections/cases with case_number + defendant_name returns 201; status=OPEN, delinquency_status=CURRENT, all *_cents aggregates 0, version 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /collections/cases"
              payload: { case_number: "C-CREATE", defendant_name: "Ada Vale" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
          assert:
            - "Case.${case_id}.status == OPEN"
            - "Case.${case_id}.delinquency_status == CURRENT"
            - "Case.${case_id}.total_assessed_cents == 0"
            - "Case.${case_id}.balance_cents == 0"
            - "Case.${case_id}.version == 1"

      - name: obligation_priority_rank_defaults_from_type
        claim_type: Defaults
        grounds: [entities.Obligation.fields.priority_rank]
        distinguishing_aspect: "Omitting priority_rank on a COURT_FEE obligation applies DEFAULT_PRIORITY_RANK COURT_FEE=2."
        test_recipe:
          setup: ["A case exists"]
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-DEFRANK", defendant_name: "Ben Ives" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 5000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
          assert:
            - "Obligation.${obl_id}.priority_rank == 2"
            - "Obligation.${obl_id}.status == OUTSTANDING"

      - name: obligation_restitution_missing_victim_returns_victim_required
        claim_type: Type Constraints
        grounds: ["validations[priority=7]", entities.Obligation.fields.victim_id]
        distinguishing_aspect: "A RESTITUTION obligation without victim_id is rejected with ERR_VICTIM_REQUIRED (422)."
        test_recipe:
          setup: ["A case exists"]
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-NOVIC", defendant_name: "Cid Roe" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "RESTITUTION", assessed_amount_cents: 5000 }
              as: CollectionsClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VICTIM_REQUIRED"

      - name: case_get_unknown_id_returns_404
        claim_type: Not Found
        grounds: ["validations[priority=3]"]
        distinguishing_aspect: "GET on a non-existent case id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /collections/cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CollectionsClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: case_status_becomes_satisfied_when_balance_zero
        claim_type: Computed Fields
        grounds: [calculations.case_balance_reconciliation, entities.Case.fields.status]
        distinguishing_aspect: "After a payment clears the only obligation, Case.balance_cents is 0 and status flips to SATISFIED."
        test_recipe:
          setup: ["Case with a single 8000c COURT_FEE obligation"]
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-SAT", defendant_name: "Deb Kaye" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 8000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
          trigger:
            - call: "POST /collections/payments"
              payload: { case_id: "${case_id}", amount_cents: 8000, allocation_method: "STATUTORY_PRIORITY" }
              as: CollectionsClerk
              captures: { pay_id: $.data.id }
          assert:
            - "Case.${case_id}.balance_cents == 0"
            - "Case.${case_id}.status == SATISFIED"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: reverse_already_reversed_payment_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Payment.POSTED_to_REVERSED, "validations[priority=6]"]
        distinguishing_aspect: "Reversing a payment already in REVERSED status returns ERR_INVALID_STATE (409); no further ledger change."
        test_recipe:
          setup: ["Case with a 10000c COURT_FEE obligation and a 5000c payment already reversed"]
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-DBLREV", defendant_name: "Eli Ng" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 10000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
            - call: "POST /collections/payments"
              payload: { case_id: "${case_id}", amount_cents: 5000, allocation_method: "STATUTORY_PRIORITY" }
              as: CollectionsClerk
              captures: { pay_id: $.data.id }
            - call: "POST /collections/payments/${pay_id}/reverse"
              payload: {}
              as: CollectionsSupervisor
          trigger:
            - call: "POST /collections/payments/${pay_id}/reverse"
              payload: {}
              as: CollectionsSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: terminate_already_terminated_wage_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.WageAssignment.ACTIVE_to_TERMINATED]
        distinguishing_aspect: "A TERMINATED wage assignment cannot be terminated again; ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Case with a wage assignment already TERMINATED"]
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-WGTERM", defendant_name: "Fay Orr" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/wage-assignments"
              payload: { case_id: "${case_id}", employer_name: "Gamma Inc", monthly_withhold_cents: 10000, effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2026-12-31T00:00:00Z" }
              as: FinanceOfficer
              captures: { wa_id: $.data.id }
            - call: "POST /collections/wage-assignments/${wa_id}/terminate"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "POST /collections/wage-assignments/${wa_id}/terminate"
              payload: {}
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: approve_denied_waiver_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.WaiverRequest.REQUESTED_to_DENIED, "validations[priority=6]"]
        distinguishing_aspect: "A DENIED waiver cannot subsequently be approved; ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Case + COURT_FEE obligation; waiver requested by clerk-1 then DENIED by sup-2"]
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-DENIED", defendant_name: "Gia Poe" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 10000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
            - call: "POST /collections/waiver-requests"
              payload: { case_id: "${case_id}", obligation_id: "${obl_id}", requested_amount_cents: 4000 }
              as: CollectionsClerk
              as_user_id: "clerk-1"
              captures: { wr_id: $.data.id }
            - call: "POST /collections/waiver-requests/${wr_id}/deny"
              payload: {}
              as: CollectionsSupervisor
              as_user_id: "sup-2"
          trigger:
            - call: "POST /collections/waiver-requests/${wr_id}/approve"
              payload: {}
              as: CollectionsSupervisor
              as_user_id: "sup-2"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: writeoff_before_age_returns_writeoff_too_early
        claim_type: Precondition Enforcement
        grounds: [state_machines.Obligation.OUTSTANDING_to_WRITTEN_OFF, calculations.writeoff_aging_eligibility]
        distinguishing_aspect: "Writing off an obligation younger than WRITEOFF_AGE_DAYS returns ERR_WRITEOFF_TOO_EARLY (409)."
        test_recipe:
          setup: ["Fresh obligation (age 0 at default clock)"]
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-EARLYWOFF", defendant_name: "Hal Ives" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "FINE", assessed_amount_cents: 3000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
          trigger:
            - call: "POST /collections/obligations/${obl_id}/write-off"
              payload: {}
              as: CollectionsSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_WRITEOFF_TOO_EARLY"

      - name: writeoff_aged_zero_balance_returns_nothing_to_write_off
        claim_type: Precondition Enforcement
        grounds: [state_machines.Obligation.OUTSTANDING_to_WRITTEN_OFF]
        distinguishing_aspect: "An aged obligation whose balance is already 0 (fully paid) returns ERR_NOTHING_TO_WRITE_OFF (409)."
        test_recipe:
          setup: ["Obligation created at default clock, fully paid, clock advanced past WRITEOFF_AGE_DAYS"]
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-WOFFZERO", defendant_name: "Ida Nunn" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "FINE", assessed_amount_cents: 3000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
            - call: "POST /collections/payments"
              payload: { case_id: "${case_id}", amount_cents: 3000, allocation_method: "STATUTORY_PRIORITY" }
              as: CollectionsClerk
              captures: { pay_id: $.data.id }
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2031-06-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /collections/obligations/${obl_id}/write-off"
              payload: {}
              as: CollectionsSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOTHING_TO_WRITE_OFF"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: ability_to_pay_floor_hits_min_installment
        claim_type: Constants Applied
        grounds: [calculations.ability_to_pay_installment]
        distinguishing_aspect: "NET_DISPOSABLE with disposable 10000c gives raw 1000; max(MIN_INSTALLMENT_CENTS 2500, 1000)=2500 — the floor constant dominates."
        test_recipe:
          setup: ["Case with a 500000c COURT_FEE obligation (balance 500000)"]
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-ATPFLOOR", defendant_name: "Jo Kerr" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 500000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
            - call: "GET /collections/cases/${case_id}"
              payload: {}
              as: CollectionsClerk
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /collections/payment-plans"
              payload: { case_id: "${case_id}", monthly_income_cents: 300000, monthly_expenses_cents: 290000, ability_to_pay_method: "NET_DISPOSABLE", expected_case_version: "${cv}" }
              as: CollectionsClerk
              captures: { plan_id: $.data.id }
          assert:
            - "PaymentPlan.${plan_id}.monthly_amount_cents == 2500"

      - name: prorata_divergence_from_statutory
        claim_type: Variant Divergence
        grounds: [calculations.payment_allocation]
        excluded_because:
          difficulty_instance: "combinatorial_formula / prorata_floor_then_remainder_by_priority"
          rationale: "PRO_RATA per-obligation split and its divergence from STATUTORY_PRIORITY is asserted by the named §1.8 instance (10001c across 10000/6000/4000)."

      - name: victim_payable_computed_from_collections
        claim_type: Correct Result
        grounds: [calculations.victim_payable_balance]
        excluded_because:
          difficulty_instance: "transitive_cascade / payment_satisfies_restitution_bumps_victim"
          rationale: "Victim.payable_balance_cents == collected restitution is asserted by the named §1.8 cascade instance."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_role_header_returns_401
        claim_type: Violation to Error
        grounds: ["validations[priority=1]"]
        distinguishing_aspect: "A request with no X-User-Role header is rejected with ERR_UNAUTHENTICATED (401) before any business logic."
        test_recipe:
          setup: ["Empty DB; request sent without an X-User-Role header"]
          setup_api_calls: []
          trigger:
            - call: "POST /collections/cases"
              payload: { case_number: "C-NOAUTH", defendant_name: "Kip All" }
              as: CollectionsClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED (X-User-Role header omitted by the test)"

      - name: wrong_role_create_case_returns_403
        claim_type: Priority Ordering
        grounds: ["validations[priority=2]"]
        distinguishing_aspect: "A FinanceOfficer posting to /collections/cases (a CollectionsClerk-exclusive op) is rejected with ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /collections/cases"
              payload: { case_number: "C-WRONGROLE", defendant_name: "Lea Bond" }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: obligations_list_pagination_envelope
        claim_type: Listing
        grounds: [entities.Obligation.fields.case_id]
        distinguishing_aspect: "GET /collections/obligations?case_id returns an array with total_count=3, has_more=false, and default limit 10."
        test_recipe:
          setup: ["Case with three obligations"]
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-PAGE", defendant_name: "Mo Rye" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 1000 }
              as: CollectionsClerk
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "FINE", assessed_amount_cents: 2000 }
              as: CollectionsClerk
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "SURCHARGE", assessed_amount_cents: 3000 }
              as: CollectionsClerk
          trigger:
            - call: "GET /collections/obligations?case_id=${case_id}"
              payload: {}
              as: CollectionsClerk
          assert:
            - "response total_count == 3"
            - "response has_more == false"

      - name: payment_exceeds_case_balance_returns_amount_exceeds
        claim_type: Conditional action
        grounds: ["validations[priority=11]", calculations.case_balance_reconciliation]
        distinguishing_aspect: "A payment larger than the case balance (20000c vs 10000c owed) is rejected with ERR_AMOUNT_EXCEEDS_BALANCE (409)."
        test_recipe:
          setup: ["Case with a single 10000c COURT_FEE obligation"]
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-OVERPAY", defendant_name: "Ned Fox" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 10000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
          trigger:
            - call: "POST /collections/payments"
              payload: { case_id: "${case_id}", amount_cents: 20000, allocation_method: "STATUTORY_PRIORITY" }
              as: CollectionsClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_AMOUNT_EXCEEDS_BALANCE"

      - name: disbursement_exceeds_victim_payable_returns_amount_exceeds
        claim_type: Conditional action
        grounds: ["validations[priority=11]", calculations.victim_payable_balance]
        distinguishing_aspect: "Disbursing 5000c to a victim whose payable_balance_cents is 0 is rejected with ERR_AMOUNT_EXCEEDS_BALANCE (409)."
        test_recipe:
          setup: ["A victim with 0 collected restitution and a case"]
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-OVERDISB", defendant_name: "Ora Lee" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/victims"
              payload: { name: "Uma Ray" }
              as: CollectionsClerk
              captures: { victim_id: $.data.id }
          trigger:
            - call: "POST /collections/disbursements"
              payload: { victim_id: "${victim_id}", case_id: "${case_id}", amount_cents: 5000 }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_AMOUNT_EXCEEDS_BALANCE"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: duplicate_case_number_returns_case_number_taken
        claim_type: Violation to Error
        grounds: ["errors[ERR_CASE_NUMBER_TAKEN]", entities.Case.fields.case_number]
        distinguishing_aspect: "Creating a second case with an in-use case_number returns ERR_CASE_NUMBER_TAKEN (409)."
        test_recipe:
          setup: ["A case with case_number C-DUP already exists"]
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-DUP", defendant_name: "Pia Orr" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /collections/cases"
              payload: { case_number: "C-DUP", defendant_name: "Rex Tan" }
              as: CollectionsClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CASE_NUMBER_TAKEN"

      - name: amnesty_end_not_after_start_returns_invalid_date_range
        claim_type: Violation to Error
        grounds: ["errors[ERR_INVALID_DATE_RANGE]", calculations.amnesty_window_overlap]
        distinguishing_aspect: "An amnesty program with end_date <= start_date returns ERR_INVALID_DATE_RANGE (422)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /collections/amnesty-programs"
              payload: { name: "Bad Window", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-01T00:00:00Z", waiver_pct: 0.5 }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_DATE_RANGE"

      - name: wage_end_before_start_returns_invalid_date_range
        claim_type: Violation to Error
        grounds: ["errors[ERR_INVALID_DATE_RANGE]", entities.WageAssignment.fields.effective_end_date]
        distinguishing_aspect: "A wage assignment whose effective_end_date precedes effective_start_date returns ERR_INVALID_DATE_RANGE (422) on a different endpoint."
        test_recipe:
          setup: ["A case exists"]
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-WGDATE", defendant_name: "Sal Yun" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /collections/wage-assignments"
              payload: { case_id: "${case_id}", employer_name: "Delta Co", monthly_withhold_cents: 10000, effective_start_date: "2026-09-01T00:00:00Z", effective_end_date: "2026-06-01T00:00:00Z" }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_DATE_RANGE"

      - name: waiver_obligation_case_mismatch_returns_error
        claim_type: Violation to Error
        grounds: ["errors[ERR_OBLIGATION_CASE_MISMATCH]", "validations[priority=7]"]
        distinguishing_aspect: "A waiver-request whose obligation_id belongs to a different case than case_id returns ERR_OBLIGATION_CASE_MISMATCH (422)."
        test_recipe:
          setup: ["Case A with an obligation; separate case B"]
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-MISA", defendant_name: "Tom Ash" }
              as: CollectionsClerk
              captures: { case_a: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_a}", obligation_type: "COURT_FEE", assessed_amount_cents: 5000 }
              as: CollectionsClerk
              captures: { obl_a: $.data.id }
            - call: "POST /collections/cases"
              payload: { case_number: "C-MISB", defendant_name: "Uri Bly" }
              as: CollectionsClerk
              captures: { case_b: $.data.id }
          trigger:
            - call: "POST /collections/waiver-requests"
              payload: { case_id: "${case_b}", obligation_id: "${obl_a}", requested_amount_cents: 1000 }
              as: CollectionsClerk
              as_user_id: "clerk-9"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OBLIGATION_CASE_MISMATCH"

      - name: activate_second_plan_returns_active_plan_exists
        claim_type: Violation to Error
        grounds: ["errors[ERR_ACTIVE_PLAN_EXISTS]", state_machines.PaymentPlan.PROPOSED_to_ACTIVE]
        distinguishing_aspect: "Activating a second plan on a case that already has an ACTIVE plan returns ERR_ACTIVE_PLAN_EXISTS (409)."
        test_recipe:
          setup: ["Case with 100000c obligation; plan1 ACTIVE; plan2 PROPOSED"]
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-TWOPLAN", defendant_name: "Van Cole" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 100000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
            - call: "GET /collections/cases/${case_id}"
              payload: {}
              as: CollectionsClerk
              captures: { cv1: $.data.version }
            - call: "POST /collections/payment-plans"
              payload: { case_id: "${case_id}", monthly_income_cents: 400000, monthly_expenses_cents: 250000, ability_to_pay_method: "NET_DISPOSABLE", expected_case_version: "${cv1}" }
              as: CollectionsClerk
              captures: { plan1: $.data.id }
            - call: "POST /collections/payment-plans/${plan1}/activate"
              payload: {}
              as: CollectionsSupervisor
            - call: "GET /collections/cases/${case_id}"
              payload: {}
              as: CollectionsClerk
              captures: { cv2: $.data.version }
            - call: "POST /collections/payment-plans"
              payload: { case_id: "${case_id}", monthly_income_cents: 400000, monthly_expenses_cents: 250000, ability_to_pay_method: "NET_DISPOSABLE", expected_case_version: "${cv2}" }
              as: CollectionsClerk
              captures: { plan2: $.data.id }
          trigger:
            - call: "POST /collections/payment-plans/${plan2}/activate"
              payload: {}
              as: CollectionsSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ACTIVE_PLAN_EXISTS"

      - name: waiver_exceeds_amnesty_cap_returns_error
        claim_type: Violation to Error
        grounds: ["errors[ERR_WAIVER_EXCEEDS_AMNESTY_CAP]", state_machines.WaiverRequest.REQUESTED_to_APPROVED]
        distinguishing_aspect: "With waiver_pct 0.5 on a 10000c obligation (cap 5000), approving a 6000c waiver (<= balance but > cap) returns ERR_WAIVER_EXCEEDS_AMNESTY_CAP (409)."
        test_recipe:
          setup: ["Clock 2026-06-01; amnesty covering clock with waiver_pct 0.5; case + 10000c COURT_FEE obligation; waiver requested for 6000c by clerk-1"]
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /collections/amnesty-programs"
              payload: { name: "Half Amnesty", start_date: "2026-01-01T00:00:00Z", end_date: "2026-12-01T00:00:00Z", waiver_pct: 0.5 }
              as: SystemAdmin
              captures: { amn_id: $.data.id }
            - call: "POST /collections/cases"
              payload: { case_number: "C-CAP", defendant_name: "Wil Day" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 10000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
            - call: "POST /collections/waiver-requests"
              payload: { case_id: "${case_id}", obligation_id: "${obl_id}", requested_amount_cents: 6000 }
              as: CollectionsClerk
              as_user_id: "clerk-1"
              captures: { wr_id: $.data.id }
          trigger:
            - call: "POST /collections/waiver-requests/${wr_id}/approve"
              payload: {}
              as: CollectionsSupervisor
              as_user_id: "sup-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_WAIVER_EXCEEDS_AMNESTY_CAP"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: amnesty_adjacent_window_allowed
        claim_type: Conditional action
        grounds: [calculations.amnesty_window_overlap]
        distinguishing_aspect: "A window B starting exactly when window A ends (2026-06-01) is accepted (201) — half-open adjacency does not overlap."
        test_recipe:
          setup: ["One amnesty window A [2026-01-01, 2026-06-01)"]
          setup_api_calls:
            - call: "POST /collections/amnesty-programs"
              payload: { name: "Adj A", start_date: "2026-01-01T00:00:00Z", end_date: "2026-06-01T00:00:00Z", waiver_pct: 0.5 }
              as: SystemAdmin
              captures: { amn_a: $.data.id }
          trigger:
            - call: "POST /collections/amnesty-programs"
              payload: { name: "Adj B", start_date: "2026-06-01T00:00:00Z", end_date: "2026-09-01T00:00:00Z", waiver_pct: 0.5 }
              as: SystemAdmin
              captures: { amn_b: $.data.id }
          assert:
            - "AmnestyProgram.${amn_b}.start_date == 2026-06-01T00:00:00Z (created 201, no overlap error)"

