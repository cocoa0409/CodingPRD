              captures: { cd_stu: $.data.id }
            - call: "POST /institutions/plan-templates"
              payload: { institution_id: "${cd_inst}", name: "4PAY", installment_count: 4, down_payment_pct: 0.20, plan_fee_cents: 4500 }
              as: Registrar
              captures: { cd_tpl: $.data.id }
            - call: "POST /institutions/enrollments"
              payload: { student_id: "${cd_stu}", term_id: "${cd_term}", plan_template_id: "${cd_tpl}" }
              as: Registrar
              captures: { cd_enr: $.data.id }
            - call: "POST /institutions/charges"
              payload: { enrollment_id: "${cd_enr}", kind: "TUITION", amount_cents: 500000 }
              as: Registrar
            - call: "POST /institutions/aids"
              payload: { enrollment_id: "${cd_enr}", source: "GRANT", amount_cents: 100000 }
              as: Registrar
            - call: "GET /institutions/enrollments/${cd_enr}"
              as: Registrar
              captures: { cd_v0: $.data.version }
            - call: "POST /institutions/enrollments/${cd_enr}/activate"
              payload: { expected_enrollment_version: "${cd_v0}" }
              as: Registrar
            - call: "POST /institutions/payments"
              payload: { enrollment_id: "${cd_enr}", purpose: "DOWN_PAYMENT", amount_cents: 80000 }
              as: Bursar
              captures: { cd_payd: $.data.id }
            - call: "POST /institutions/payments/${cd_payd}/settle"
              as: Bursar
            - call: "GET /institutions/installments?enrollment_id=${cd_enr}"
              as: Registrar
              captures: { cd_i1: $.data.0.id }
            - call: "POST /institutions/payments"
              payload: { enrollment_id: "${cd_enr}", purpose: "INSTALLMENT", amount_cents: 80000, installment_id: "${cd_i1}" }
              as: Bursar
              captures: { cd_payi1: $.data.id }
            - call: "POST /institutions/payments/${cd_payi1}/settle"
              as: Bursar
          trigger:
            - call: "POST /institutions/charges"
