  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_case_version_on_plan_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[action-plan-create-stale-case]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential plan creations against the same captured case version: the first succeeds (bumping case version), the second carrying the SAME expected_case_version is rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Case in ACTION_PLAN (first plan already created) — capture the current case version, then run two creates against it"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "OCC Co", tax_id: "55-0000028", naics_code: "541720", internal_risk_rating: 7 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-O01", original_principal_cents: 2000000, contractual_rate_bps: 800, days_past_due: 62 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "DELINQUENCY_60", risk_rating_at_entry: 7, case_officer_id: "officer-o1" }
              as: WorkoutOfficer
              captures: { case_id: $.data.id, case_v0: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans"
              payload: { plan_text: "First plan", target_resolution_date: "2027-03-01T00:00:00Z", milestone_count: 1, expected_case_version: "${case_v0}" }
              as: WorkoutOfficer
              as_user_id: "officer-o1"
              captures: { p1: $.data.id }
            - call: "GET /loans/${loan_id}/workout-cases/${case_id}"
              payload: {}
              as: WorkoutOfficer
              captures: { case_v1: $.data.version }
          trigger:
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans"
              payload: { plan_text: "Second plan A", target_resolution_date: "2027-03-02T00:00:00Z", milestone_count: 1, expected_case_version: "${case_v1}" }
              as: WorkoutOfficer
              as_user_id: "officer-o1"
              captures: { p2: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans"
              payload: { plan_text: "Second plan B (stale)", target_resolution_date: "2027-03-03T00:00:00Z", milestone_count: 1, expected_case_version: "${case_v1}" }
              as: WorkoutOfficer
              as_user_id: "officer-o1"
              captures: { err: $.data.error_id }
          assert:
            - "Plan A creation succeeds (case version advanced by 1)"
            - "Plan B creation with the same captured version: HTTP 412, error_id == ERR_STALE_VERSION"

      - name: occ_stale_collateral_version_on_appraisal_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[appraisal-create-stale-collateral]"]
        distinguishing_aspect: "Same OCC pattern on a DIFFERENT parent (CollateralItem): an appraisal create carrying a superseded collateral version is rejected 412."
        test_recipe:
          setup: ["PLEDGED collateral item; capture version; first appraisal create succeeds; second create reuses the stale version"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "OCC Col Co", tax_id: "55-0000029", naics_code: "541721", internal_risk_rating: 7 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-O02", original_principal_cents: 2200000, contractual_rate_bps: 800, days_past_due: 62 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/collateral"
              payload: { collateral_type: "SECURITIES", description: "Bond portfolio", liquidation_discount_bps: 1000 }
              as: WorkoutOfficer
              captures: { col_id: $.data.id, col_v: $.data.version }
          trigger:
            - call: "POST /loans/${loan_id}/collateral/${col_id}/appraisals"
              payload: { appraised_value_cents: 2000000, effective_date: "2026-07-01T00:00:00Z", appraiser_id: "appr-o1", expected_collateral_version: "${col_v}" }
              as: AppraisalDesk
              as_user_id: "appr-o1"
              captures: { a1: $.data.id }
            - call: "POST /loans/${loan_id}/collateral/${col_id}/appraisals"
              payload: { appraised_value_cents: 2100000, effective_date: "2026-07-02T00:00:00Z", appraiser_id: "appr-o1", expected_collateral_version: "${col_v}" }
              as: AppraisalDesk
              as_user_id: "appr-o1"
              captures: { err: $.data.error_id }
          assert:
            - "First appraisal created (item flipped to UNDER_REVALUATION, version bumped)"
            - "Second create with the same captured version: HTTP 412, error_id == ERR_STALE_VERSION"

