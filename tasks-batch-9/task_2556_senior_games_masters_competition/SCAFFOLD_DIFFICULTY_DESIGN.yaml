  # ===================================================================
  # RULE 8 - Resource / temporal overlap under DIFFERENT interval
  #          semantics over DIFFERENT resource entities
  #   #1 Venue              : half-open, end-buffer only, aggregate count
  #   #2 Personnel          : closed, venue-conditional symmetric buffer, capacity 1
  #   #4 AccommodationBlock : half-open on DATE, per-night capacity
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_area_half_open_end_buffer_with_aggregate_area_capacity
        grounds:
          - calculations.venue_area_occupancy
          - validations[priority=76]
          - entities.Venue.fields.competition_area_count
          - entities.SessionSlot.fields.teardown_buffer_minutes
          - errors[ERR_VENUE_AREA_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          INTERVAL SEMANTICS #1 ON THE VENUE RESOURCE: intervals are HALF-OPEN so a slot starting
          exactly when the incumbent's buffered window ends is ACCEPTED, the teardown buffer is
          added to end_utc ONLY (never subtracted from start_utc), and the capacity term is an
          AGGREGATE count compared against Venue.competition_area_count rather than a
          one-resource-one-booking rule.
        test_recipe:
          setup:
            - "One GamesEdition in REGISTRATION_OPEN, one LOW-contact TRACK sport, one 60-64 event T100M with capacity 8 and min_entries_to_stage 1 and NO entries, so the athlete recovery-gap rule is vacuous for every slot write."
            - "Venue X (Single Track Oval) has competition_area_count 1, EP_ADVANCED and an on-site medical bay."
            - "Venue Y (Twin Field House) has competition_area_count 2, EP_ADVANCED and an on-site medical bay."
            - "Venue X already holds slot S1 on 2026-09-12 09:00-10:00 with teardown_buffer_minutes 15, so its occupied window is [09:00, 10:15)."
            - "Venue Y already holds slot Y1 on 2026-09-12 14:00-15:00 with teardown_buffer_minutes 0, so its occupied window is [14:00, 15:00)."
            - "The logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
            - call: "POST /senior-games/sports"
              payload: { sport_code: "TRACK", name: "Track and Field", contact_class: "LOW", mark_direction: "LOWER_IS_BETTER", required_certification_level: 2, min_age: 50 }
              as: GamesAdmin
              captures: { sp_track_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T100M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 6000, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /senior-games/games-editions/${ed_id}/open-registration"
              payload: {}
              as: GamesAdmin
            - call: "POST /senior-games/venues"
              payload: { games_edition_id: "${ed_id}", name: "Single Track Oval", competition_area_count: 1, spectator_capacity: 200, emergency_protocol_code: "EP_ADVANCED", has_onsite_medical_bay: true }
              as: GamesAdmin
              captures: { vn_x_id: $.data.id }
            - call: "POST /senior-games/venues"
              payload: { games_edition_id: "${ed_id}", name: "Twin Field House", competition_area_count: 2, spectator_capacity: 600, emergency_protocol_code: "EP_ADVANCED", has_onsite_medical_bay: true }
              as: GamesAdmin
              captures: { vn_y_id: $.data.id }
            - call: "POST /senior-games/session-slots"
              payload: { venue_id: "${vn_x_id}", sport_event_id: "${ev_id}", start_utc: "2026-09-12T09:00:00Z", end_utc: "2026-09-12T10:00:00Z", teardown_buffer_minutes: 15, required_official_count: 1 }
              as: GamesAdmin
              captures: { slot_s1_id: $.data.id }
            - call: "POST /senior-games/session-slots"
              payload: { venue_id: "${vn_y_id}", sport_event_id: "${ev_id}", start_utc: "2026-09-12T14:00:00Z", end_utc: "2026-09-12T15:00:00Z", teardown_buffer_minutes: 0, required_official_count: 1 }
              as: GamesAdmin
              captures: { slot_y1_id: $.data.id }
          trigger:
