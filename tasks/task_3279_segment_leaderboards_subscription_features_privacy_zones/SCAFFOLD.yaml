    output: Activity
    side_effects:
      - "Duplicate check per validations priority 9"
      - "On COMPLETED: obfuscation, segment match sweep, speed_and_vehicle_checks, challenge_progress, heatmap_contribution"

  - method: GET
    path: "/v1/athletes/{id}/activities"
    description: "List activities of an athlete (owner/admin see raw; others see obfuscated)"
    roles: [Athlete, PlatformAdmin, Moderator]
    code: 200
    input: ["status?", "sport_type?"]
    output: "Activity[]"
    side_effects: []

  - method: GET
    path: "/v1/activities"
    description: "Flat activity list with FK filters (reverse reachability, including duplicate chains)"
    roles: [Athlete, PlatformAdmin, Moderator]
    code: 200
    input: ["athlete_id?", "duplicate_of_id?", "status?", "sport_type?"]
    output: "Activity[]"
    side_effects: []

  - method: GET
    path: "/v1/activities/{id}"
    description: "Get an activity; non-owner callers receive obfuscated_start_*/end_* and obfuscated_track instead of raw fields; auto_hidden activities return ERR_NOT_FOUND to non-owners"
    roles: [Athlete, PlatformAdmin, Moderator]
    code: 200
    input: []
    output: Activity
    side_effects: []

  - method: POST
    path: "/v1/activities/{id}/correct_category"
    description: "Correct the sport category of an activity (owner or moderator); re-runs effort eligibility and exclusions"
    roles: [Athlete, PlatformAdmin, Moderator]
    code: 200
    input: [corrected_sport_type]
    output: Activity
    side_effects:
      - "corrected_sport_type set; ELIGIBLE efforts whose segment.sport_type != new category -> EXCLUDED (CATEGORY_MISMATCH)"
      - "Re-run speed_and_vehicle_checks for remaining ELIGIBLE efforts under the new category"
      - "rank_snapshot recomputed on affected segments; heatmap cell recompute"

