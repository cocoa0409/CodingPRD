scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_vendor_created_with_all_declared_defaults
        claim_type: Creation
        grounds:
          - entities.Vendor
          - endpoints[POST /procurement/vendors]
          - response_envelope.success
        distinguishing_aspect: "A POST with legal_name, tax_id and contact_email returns 201 and every system/computed Vendor field at its declared default: eligibility_status ELIGIBLE, protest_fee_balance_cents 0, debarment_strike_count 0, active_debarment_id null, reinstatement_earliest_petition_utc null, suspension_reason_code null."
        test_recipe:
          setup:
            - "empty database; the logical clock is pinned to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
          trigger:
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Aldergate Constructors", tax_id: "100000030", contact_email: "v30@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
              captures: { c_v30_id: $.data.id }
          assert:
            - "HTTP 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "$.data.legal_name == Aldergate Constructors, $.data.tax_id == 100000030, $.data.contact_email == v30@example.gov"
            - "$.data.eligibility_status == ELIGIBLE, $.data.protest_fee_balance_cents == 0, $.data.debarment_strike_count == 0"
            - "$.data.active_debarment_id == null, $.data.reinstatement_earliest_petition_utc == null, $.data.suspension_reason_code == null"
            - "$.data.id is a server-generated identifier and $.data.version == 1"

      - name: corner_vendor_retrieved_by_id_matches_stored_row
        claim_type: Retrieval
        grounds:
          - entities.Vendor
          - endpoints[GET /procurement/vendors/{id}]
        distinguishing_aspect: "GET /procurement/vendors/{id} returns exactly the row created moments earlier, including the credited protest_fee_balance_cents of 100000, with no field drift."
        test_recipe:
          setup:
            - "one Vendor created at 2026-08-01T00:00:00Z with a single 100000-cent fee deposit"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Brasswick Utility", tax_id: "100000031", contact_email: "v31@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
              captures: { c_v31_id: $.data.id }
            - call: "POST /procurement/vendors/${c_v31_id}/fee-deposits"
              payload: { amount_cents: 100000 }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
          trigger:
            - call: "GET /procurement/vendors/${c_v31_id}"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
          assert:
            - "HTTP 200 and $.data.id == ${c_v31_id}"
            - "$.data.tax_id == 100000031 and $.data.legal_name == Brasswick Utility"
            - "$.data.protest_fee_balance_cents == 100000"
            - "$.data.eligibility_status == ELIGIBLE"

      - name: corner_vendors_listed_with_pagination_fields
        claim_type: Listing
        grounds:
          - endpoints[GET /procurement/vendors]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three Vendors stored, GET /procurement/vendors?limit=2&offset=0 returns exactly 2 rows plus total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "three Vendors created at 2026-08-01T00:00:00Z with tax_ids 100000032, 100000033 and 100000034"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Calder Bros Excavating", tax_id: "100000032", contact_email: "v32@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Dunmoor Electric", tax_id: "100000033", contact_email: "v33@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Elmsford Coatings", tax_id: "100000034", contact_email: "v34@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
          trigger:
            - call: "GET /procurement/vendors"
              payload: { limit: 2, offset: 0 }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
          assert:
            - "HTTP 200, response_type == array and exactly 2 Vendor rows are returned"
            - "the response reports limit == 2, offset == 0, total_count == 3 and has_more == true"
            - "a follow-up GET /procurement/vendors with limit 2 and offset 2 returns exactly 1 row with has_more == false and total_count == 3"

      - name: corner_vendor_not_found_for_unknown_id
        claim_type: Not Found
        grounds:
          - errors[ERR_VENDOR_NOT_FOUND]
          - validations[priority=5]
          - endpoints[GET /procurement/vendors/{id}]
        distinguishing_aspect: "A GET against a syntactically valid but unknown vendor id returns HTTP 404 with error_id ERR_VENDOR_NOT_FOUND, not an empty 200."
        test_recipe:
          setup:
            - "one unrelated Vendor exists so the table is non-empty"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Fairholt Drainage", tax_id: "100000035", contact_email: "v35@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
          trigger:
            - call: "GET /procurement/vendors/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
          assert:
            - "HTTP 404 with $.data.error_id == ERR_VENDOR_NOT_FOUND"
            - "$.data.message is a non-empty string and response_type == error"

      - name: corner_vendor_creation_rejects_missing_required_tax_id
        claim_type: Required Fields
        grounds:
          - entities.Vendor.fields.tax_id
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting tax_id, an input field with no default, returns HTTP 400 ERR_INVALID_REQUEST and creates no Vendor row."
        test_recipe:
          setup:
            - "empty Vendor table; clock pinned to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
          trigger:
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Glenmara Sitework", contact_email: "v36@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
          assert:
            - "HTTP 400 with $.data.error_id == ERR_INVALID_REQUEST"
            - "GET /procurement/vendors reports total_count == 0"

      - name: corner_solicitation_defaults_predecessor_and_counters_on_creation
        claim_type: Defaults
        grounds:
          - entities.Solicitation.fields.predecessor_solicitation_id
          - entities.Solicitation.fields.cumulative_extension_days
          - entities.Solicitation.fields.addendum_count
          - entities.Solicitation.fields.protest_escrow_cents
          - endpoints[POST /procurement/solicitations]
        distinguishing_aspect: "Omitting the optional predecessor_solicitation_id yields null, and the defaulted counters come back as cumulative_extension_days 0, addendum_count 0, protest_escrow_cents 0, apparent_low_bid_id null, status DRAFT, issued_by_user_id null."
        test_recipe:
          setup:
            - "clock pinned to 2026-08-01T00:00:00Z; no solicitations exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
          trigger:
            - call: "POST /procurement/solicitations"
              payload:
                solicitation_number: "SOL-2238-C01"
                title: "Bridge Deck Sealing"
                issuing_agency_code: "DOT"
                estimated_value_cents: 10000000
                original_bid_due_utc: "2026-08-27T00:00:00Z"
                original_question_deadline_utc: "2026-08-20T00:00:00Z"
                mandatory_requirements:
                  - { requirement_code: "REQ-SEAL", description: "approved sealer product list", materiality: "MATERIAL", is_waivable: false }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { c_s01_id: $.data.id }
          assert:
            - "HTTP 201 with $.data.status == DRAFT and $.data.issued_by_user_id == null"
            - "$.data.predecessor_solicitation_id == null"
            - "$.data.cumulative_extension_days == 0, $.data.addendum_count == 0, $.data.protest_escrow_cents == 0"
            - "$.data.apparent_low_bid_id == null and $.data.bids_opened_at_utc == null"
            - "GET /procurement/solicitations/${c_s01_id}/requirements returns exactly one row with requirement_code REQ-SEAL and introduced_by_addendum_sequence == 0"

      - name: corner_solicitation_computed_due_dates_ignore_client_supplied_values
        claim_type: Computed Fields
        grounds:
          - entities.Solicitation.fields.effective_bid_due_utc
          - entities.Solicitation.fields.question_deadline_utc
          - calculations.solicitation_effective_bid_due_utc
          - endpoints[POST /procurement/solicitations/{id}/issue]
        distinguishing_aspect: "effective_bid_due_utc and question_deadline_utc are computed, never accepted from the client: with zero addenda they equal 2026-08-27T00:00:00Z and 2026-08-20T00:00:00Z (effective minus QUESTION_CUTOFF_DAYS 7) regardless of what the request body contained."
        test_recipe:
          setup:
            - "clock pinned to 2026-08-01T00:00:00Z; one DRAFT Solicitation with one MATERIAL requirement, original_bid_due_utc 2026-08-27T00:00:00Z and original_question_deadline_utc 2026-08-20T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/solicitations"
              payload:
                solicitation_number: "SOL-2238-C02"
                title: "Median Cable Barrier"
                issuing_agency_code: "DOT"
                estimated_value_cents: 10000000
                original_bid_due_utc: "2026-08-27T00:00:00Z"
                original_question_deadline_utc: "2026-08-20T00:00:00Z"
                mandatory_requirements:
                  - { requirement_code: "REQ-CABLE", description: "high-tension cable system", materiality: "MATERIAL", is_waivable: false }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { c_s02_id: $.data.id }
          trigger:
            - call: "POST /procurement/solicitations/${c_s02_id}/issue"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
          assert:
            - "HTTP 200 with $.data.status == ISSUED and $.data.issued_by_user_id == U-OFFICER-1"
            - "$.data.effective_bid_due_utc == 2026-08-27T00:00:00Z and $.data.original_bid_due_utc == 2026-08-27T00:00:00Z"
            - "$.data.question_deadline_utc == 2026-08-20T00:00:00Z, exactly effective_bid_due_utc minus QUESTION_CUTOFF_DAYS (7) days"
            - "$.data.cumulative_extension_days == 0"

      - name: corner_bid_system_fields_are_server_stamped
        claim_type: System Fields
        grounds:
          - entities.Bid.fields.submitted_at_utc
          - entities.Bid.fields.responsiveness_status
          - entities.Bid.fields.responsibility_status
          - endpoints[POST /procurement/bids]
        distinguishing_aspect: "A newly submitted Bid comes back with submitted_at_utc equal to the logical clock 2026-08-02T00:00:00Z, responsiveness_status UNREVIEWED, responsibility_status NOT_REVIEWED, evaluated_price_cents null and informality_loading_cents 0 — none of which the client may set."
        test_recipe:
          setup:
            - "clock pinned to 2026-08-01T00:00:00Z, one Vendor and one ISSUED Solicitation, then the clock advanced to 2026-08-02T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Harrowgate Bridge", tax_id: "100000037", contact_email: "v37@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
              captures: { c_v37_id: $.data.id }
            - call: "POST /procurement/solicitations"
              payload:
                solicitation_number: "SOL-2238-C03"
                title: "Deck Joint Replacement"
                issuing_agency_code: "DOT"
                estimated_value_cents: 10000000
                original_bid_due_utc: "2026-08-27T00:00:00Z"
                original_question_deadline_utc: "2026-08-20T00:00:00Z"
                mandatory_requirements:
                  - { requirement_code: "REQ-JOINT", description: "modular joint supplier approval", materiality: "MATERIAL", is_waivable: false }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { c_s03_id: $.data.id }
            - call: "POST /procurement/solicitations/${c_s03_id}/issue"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "GET /procurement/solicitations/${c_s03_id}"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { c_s03_v: $.data.version }
          trigger:
            - call: "POST /procurement/bids"
              payload: { solicitation_id: "${c_s03_id}", vendor_id: "${c_v37_id}", total_price_cents: 4000000, acknowledged_addendum_sequences: [], expected_solicitation_version: "${c_s03_v}" }
              as: Vendor
              as_user_id: "${c_v37_id}"
              captures: { c_b03_id: $.data.id }
          assert:
            - "HTTP 201 with $.data.submitted_at_utc == 2026-08-02T00:00:00Z"
            - "$.data.responsiveness_status == UNREVIEWED and $.data.responsibility_status == NOT_REVIEWED"
            - "$.data.evaluated_price_cents == null and $.data.informality_loading_cents == 0"
            - "$.data.nonresponsive_reason_codes == [] and $.data.superseded_by_bid_id == null"
            - "$.data.total_price_cents == 4000000 and $.data.corrected_total_price_cents == null"

      - name: corner_requirement_materiality_enum_rejected_when_invalid
        claim_type: Type Constraints
        grounds:
          - entities.MandatoryRequirement.fields.materiality
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A mandatory_requirements entry whose materiality is MAJOR — outside the closed enum {MATERIAL, INFORMALITY} — returns HTTP 400 ERR_INVALID_REQUEST and creates no Solicitation."
        test_recipe:
          setup:
            - "clock pinned to 2026-08-01T00:00:00Z; no solicitations exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
          trigger:
            - call: "POST /procurement/solicitations"
              payload:
                solicitation_number: "SOL-2238-C04"
                title: "Sign Panel Replacement"
                issuing_agency_code: "DOT"
                estimated_value_cents: 10000000
                original_bid_due_utc: "2026-08-27T00:00:00Z"
                original_question_deadline_utc: "2026-08-20T00:00:00Z"
                mandatory_requirements:
                  - { requirement_code: "REQ-SHEET", description: "retroreflective sheeting grade", materiality: "MAJOR", is_waivable: false }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
          assert:
            - "HTTP 400 with $.data.error_id == ERR_INVALID_REQUEST"
            - "GET /procurement/solicitations reports total_count == 0"

      - name: corner_agency_record_item_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.AgencyRecordItem
          - endpoints[GET /procurement/protests/{id}/record-items]
        distinguishing_aspect: "AgencyRecordItem is declared common_fields: false, so a filed item exposes sequence_number 1, submitted_by_role ProcurementOfficer and submitted_at_utc but NO version field, and §1.5 declares no update or delete route for it."
        test_recipe:
          setup:
            - "clock pinned to 2026-08-01T00:00:00Z; one Vendor with a 100000-cent balance; one ISSUED Solicitation with estimated_value_cents 10000000; the vendor asked one question, then filed a SOLICITATION_IMPROPRIETY protest whose filing_fee_cents is 35638"
            - "U-OFFICER-1 then filed one AGENCY_REPORT record item, moving the protest to UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Innismore Concrete", tax_id: "100000038", contact_email: "v38@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
              captures: { c_v38_id: $.data.id }
            - call: "POST /procurement/vendors/${c_v38_id}/fee-deposits"
              payload: { amount_cents: 100000 }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/solicitations"
              payload:
                solicitation_number: "SOL-2238-C05"
                title: "Sidewalk ADA Ramp Program"
                issuing_agency_code: "DOT"
                estimated_value_cents: 10000000
                original_bid_due_utc: "2026-08-27T00:00:00Z"
                original_question_deadline_utc: "2026-08-20T00:00:00Z"
                mandatory_requirements:
                  - { requirement_code: "REQ-ADA", description: "ADA detectable warning spec", materiality: "MATERIAL", is_waivable: false }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { c_s05_id: $.data.id }
            - call: "POST /procurement/solicitations/${c_s05_id}/issue"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
            - call: "POST /procurement/solicitations/${c_s05_id}/questions"
              payload: { vendor_id: "${c_v38_id}", question_text: "is a domed panel or cast-in-place warning required?" }
              as: Vendor
              as_user_id: "${c_v38_id}"
            - call: "POST /procurement/protests"
              payload: { solicitation_id: "${c_s05_id}", protester_vendor_id: "${c_v38_id}", grounds_code: "SOLICITATION_IMPROPRIETY", narrative: "the warning specification names one manufacturer" }
              as: Vendor
              as_user_id: "${c_v38_id}"
              captures: { c_p05_id: $.data.id }
            - call: "POST /procurement/protests/${c_p05_id}/record-items"
              payload: { item_type: "AGENCY_REPORT", document_ref: "AR-C05-001" }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
          trigger:
            - call: "GET /procurement/protests/${c_p05_id}/record-items"
              payload: { limit: 10, offset: 0 }
              as: HearingOfficer
              as_user_id: "U-HEARING-1"
          assert:
            - "HTTP 200 with exactly one AgencyRecordItem row"
            - "that row has sequence_number == 1, item_type == AGENCY_REPORT, document_ref == AR-C05-001, submitted_by_role == ProcurementOfficer, submitted_at_utc == 2026-08-01T00:00:00Z"
            - "the row exposes no version field and no updated_at field, matching entities.AgencyRecordItem common_fields: false"
            - "Protest.${c_p05_id}.record_item_count == 1 and Protest.${c_p05_id}.status == UNDER_REVIEW"

      - name: corner_bid_creation_rejected_for_unknown_parent_solicitation
        claim_type: Parent Relationships
        grounds:
          - entities.Bid.fields.solicitation_id
          - validations[priority=6]
          - errors[ERR_SOLICITATION_NOT_FOUND]
        distinguishing_aspect: "A body FK naming a non-existent solicitation is rejected at priority 6 with HTTP 404 ERR_SOLICITATION_NOT_FOUND, before any OCC or state check on the bid could run."
        test_recipe:
          setup:
            - "clock pinned to 2026-08-01T00:00:00Z; one Vendor exists; one unrelated ISSUED Solicitation SOL-2238-C54 supplies a genuine version token; no Solicitation carries the id used in the trigger"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Jessup Milling", tax_id: "100000039", contact_email: "v39@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
              captures: { c_v39_id: $.data.id }
            - call: "POST /procurement/solicitations"
              payload:
                solicitation_number: "SOL-2238-C54"
                title: "Unrelated Decoy Solicitation"
                issuing_agency_code: "DOT"
                estimated_value_cents: 10000000
                original_bid_due_utc: "2026-08-27T00:00:00Z"
                original_question_deadline_utc: "2026-08-20T00:00:00Z"
                mandatory_requirements:
                  - { requirement_code: "REQ-DECOY", description: "unrelated requirement", materiality: "MATERIAL", is_waivable: false }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { c_s54_id: $.data.id }
            - call: "POST /procurement/solicitations/${c_s54_id}/issue"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { c_s54_v: $.data.version }
          trigger:
            - call: "POST /procurement/bids"
              payload: { solicitation_id: "00000000-0000-0000-0000-0000000000aa", vendor_id: "${c_v39_id}", total_price_cents: 4000000, acknowledged_addendum_sequences: [], expected_solicitation_version: "${c_s54_v}" }
              as: Vendor
              as_user_id: "${c_v39_id}"
          assert:
            - "HTTP 404 with $.data.error_id == ERR_SOLICITATION_NOT_FOUND"
            - "the error is NOT ERR_STALE_SOLICITATION_VERSION: the body FK check at priority 6 precedes the OCC check at priority 9"
            - "GET /procurement/bids reports total_count == 0 and Solicitation.${c_s54_id}.version == ${c_s54_v}"

      - name: corner_subcontractor_screening_creates_a_vendor_to_vendor_graph_edge
        claim_type: graph
        grounds:
          - entities.SubcontractorScreening
