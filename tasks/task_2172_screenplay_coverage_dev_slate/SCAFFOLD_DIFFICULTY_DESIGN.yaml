          assert:
            - "WriterEngagement.${e1_id}.status == TERMINATED"
            - "all three MilestonePayment rows with engagement_id == ${e1_id} have status == VOIDED"
            - "Writer.${w1_id}.committed_fee_cents == 0"
            - "Writer.${w1_id}.paid_fee_cents == 0"
            - "Writer.${w1_id}.active_engagement_count == 0"
            - "DevelopmentProject.${proj_id}.committed_writer_fee_cents == 0"
            - "DevelopmentProject.${proj_id}.writer_budget_cap_cents == 240000000"

      - name: reader_assignment_counter_conserved_across_assign_then_recall
        grounds:
          - calculations.reader_assignment_ledger
          - state_machines.CoverageAssignment.ASSIGNED_to_RECALLED
          - state_machines.CoverageReport.DRAFT_to_REJECTED
          - entities.Reader.fields.active_assignment_count
          - entities.Reader.fields.completed_report_count
        distinguishing_aspect: |
          Conserved quantity of the CAPACITY-COUNT kind (a different type from the money ledger):
          Reader.active_assignment_count, pinned as count(CoverageAssignment where status IN
          {ASSIGNED, IN_PROGRESS, SUBMITTED}). assign-reader raises it 0 -> 1 and the compensating
          recall returns it to exactly 0, while completed_report_count stays 0 because a recall is
          not a completion.
        test_recipe:
