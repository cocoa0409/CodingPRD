scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: order_discount_flat_band_vs_blended_marginal
        grounds:
          - calculations.ea_tier_discount
          - calculations.order_total_pricing
          - entities.EnterpriseAgreement.fields.discount_pct
        distinguishing_aspect: |
          Order-pricing domain: the pinned band_rate_flat variant prices a 10000-cent line at
          GOLD (trailing 300000 >= 200000) as exactly 9000 cents, while the rejected
          blended_marginal_rate reading of the same bands would give 9717 cents — two valid
          readings of the tier prose produce different totals, and only band_rate_flat is correct.
        test_recipe:
          setup:
            - "Account with trailing delivered spend of exactly 300000 cents (GOLD band) and an ACTIVE enterprise agreement; a 10000-cent STANDARD item in the catalog."
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Tier Co", segment: "PHARMA", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/catalog-items"
              payload: { sku: "SEED-300K", name: "Seed pack", item_class: "STANDARD", allocation_group: "GROUP_B", base_price_cents: 300000, stock_on_hand: 10 }
              as: SupplyOps
            - call: "POST /lab/catalog-items"
              payload: { sku: "PROBE-100", name: "Assay probe", item_class: "STANDARD", allocation_group: "GROUP_B", base_price_cents: 10000, stock_on_hand: 100 }
              as: SupplyOps
            - call: "POST /lab/orders"
              payload: { account_id: "${a_id}", lines: [ { sku: "SEED-300K", quantity: 1 } ] }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { o_seed: $.data.id }
            - call: "POST /lab/orders/${o_seed}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a_id}"
            - call: "POST /lab/orders/${o_seed}/ship"
              payload: {}
              as: SupplyOps
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lab/enterprise-agreements"
              payload: { account_id: "${a_id}", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z", committed_annual_spend_cents: 300000 }
              as: AccountManager
              captures: { ea_id: $.data.id }
            - call: "GET /lab/enterprise-agreements/${ea_id}"
              as: AccountManager
              captures: { ea_tier: $.data.current_tier, ea_disc: $.data.discount_pct }
          trigger:
            - call: "POST /lab/orders"
              payload: { account_id: "${a_id}", lines: [ { sku: "PROBE-100", quantity: 1 } ] }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { o2: $.data.id }
            - call: "POST /lab/orders/${o2}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { o2_total: $.data.total_cents, o2_goods: $.data.goods_subtotal_cents, o2_status: $.data.status }
          assert:
            - "EnterpriseAgreement.${ea_id}.current_tier == GOLD and .discount_pct == 10"
            - "Order.${o2}.status == ALLOCATED"
            - "Order.${o2}.goods_subtotal_cents == 9000 (flat GOLD band rate; blended marginal would give 9717 and is WRONG)"
            - "Order.${o2}.total_cents == 9000 and handling_fee_cents == 0 and shipping_class == STANDARD"

      - name: pull_through_installed_vs_forward
        grounds:
          - calculations.pull_through_projection
        distinguishing_aspect: |
          Account-analytics domain (distinct from order pricing): the INSTALLED_BASE variant sums
          only INSTALLED instruments (140000) while the FORWARD_LOOKING variant adds half the
          ORDERED pipeline (170000) — identical inputs, two variant results, both returned.
        test_recipe:
          setup:
            - "Account with two INSTALLED instruments (baselines 100000 and 40000) and one ORDERED instrument (baseline 60000)."
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Pull Through Lab", segment: "CLINICAL", priority_class: "PRIORITY", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/engineers"
              payload: { name: "Igor Install", territory_code: "CA-NORTH", skills: ["INSTALL"] }
              as: ServiceDispatcher
            - call: "POST /lab/instruments"
              payload: { account_id: "${a_id}", model: "SEQ-5000", serial_number: "S-1", placement_type: "CAPITAL", monthly_baseline_consumable_cents: 100000 }
              as: AccountManager
              captures: { i1: $.data.id }
            - call: "POST /lab/instruments/${i1}/install"
              payload: {}
              as: ServiceDispatcher
            - call: "POST /lab/instruments"
              payload: { account_id: "${a_id}", model: "SEQ-5000", serial_number: "S-2", placement_type: "CAPITAL", monthly_baseline_consumable_cents: 40000 }
              as: AccountManager
              captures: { i2: $.data.id }
            - call: "POST /lab/instruments/${i2}/install"
              payload: {}
              as: ServiceDispatcher
            - call: "POST /lab/instruments"
              payload: { account_id: "${a_id}", model: "SEQ-5000", serial_number: "S-3", placement_type: "REAGENT_RENTAL", monthly_consumable_commitment_cents: 60000, monthly_baseline_consumable_cents: 60000 }
              as: AccountManager
              captures: { i3: $.data.id }
          trigger:
            - call: "GET /lab/accounts/${a_id}/pull-through-projection"
              as: AccountManager
              captures: { ib: $.data.installed_base_monthly_cents, fl: $.data.forward_looking_monthly_cents, ni: $.data.installed_instrument_count, no: $.data.ordered_instrument_count }
          assert:
            - "installed_base_monthly_cents == 140000 (100000 + 40000; ORDERED instrument excluded)"
            - "forward_looking_monthly_cents == 170000 (140000 + 0.5 * 60000)"
            - "installed_instrument_count == 2 and ordered_instrument_count == 1"

  - rule_id: combinatorial_formula
    instances:
      - name: order_line_rounding_per_line_then_sum
        grounds:
          - calculations.order_total_pricing
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-line-then-sum, so two 115-cent
          lines at SILVER 5% give 109 + 109 = 218; the sum-then-round reading gives
          round_half_up(218.50) = 219 and is WRONG.
        test_recipe:
          setup:
            - "SILVER account (trailing 50000) with ACTIVE agreement; catalog holds two distinct 115-cent STANDARD items."
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Rounding Lab", segment: "ACADEMIC", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/catalog-items"
              payload: { sku: "SEED-50K", name: "Seed pack small", item_class: "STANDARD", allocation_group: "GROUP_B", base_price_cents: 50000, stock_on_hand: 10 }
              as: SupplyOps
            - call: "POST /lab/catalog-items"
              payload: { sku: "RND-A", name: "Buffer A", item_class: "STANDARD", allocation_group: "GROUP_B", base_price_cents: 115, stock_on_hand: 100 }
              as: SupplyOps
            - call: "POST /lab/catalog-items"
              payload: { sku: "RND-B", name: "Buffer B", item_class: "STANDARD", allocation_group: "GROUP_B", base_price_cents: 115, stock_on_hand: 100 }
              as: SupplyOps
            - call: "POST /lab/orders"
              payload: { account_id: "${a_id}", lines: [ { sku: "SEED-50K", quantity: 1 } ] }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { o_seed: $.data.id }
            - call: "POST /lab/orders/${o_seed}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a_id}"
            - call: "POST /lab/orders/${o_seed}/ship"
              payload: {}
              as: SupplyOps
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lab/enterprise-agreements"
              payload: { account_id: "${a_id}", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z", committed_annual_spend_cents: 50000 }
              as: AccountManager
          trigger:
            - call: "POST /lab/orders"
              payload: { account_id: "${a_id}", lines: [ { sku: "RND-A", quantity: 1 }, { sku: "RND-B", quantity: 1 } ] }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { o2: $.data.id }
            - call: "POST /lab/orders/${o2}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { goods: $.data.goods_subtotal_cents, total: $.data.total_cents, disc: $.data.discount_pct }
          assert:
            - "Order.${o2}.discount_pct == 5 (SILVER)"
            - "Order.${o2}.goods_subtotal_cents == 218 (per-line round_half_up(115*0.95)=109 twice; sum-then-round 219 is WRONG)"
            - "Order.${o2}.total_cents == 218"

      - name: surge_score_weight_times_tier_gate
        grounds:
          - calculations.surge_allocation_scoring
          - state_machines.SurgeEvent.ACTIVE_to_RESOLVED
        distinguishing_aspect: |
          Mode (a) non-linear multi-input formula: score = priority weight x EA tier multiplier
          gated on account status, producing 150 / 60 / 10 for the three fixture accounts; the
          waterfall then skips the unsatisfiable 60-point order and still allocates the 10-point one.
        test_recipe:
          setup:
            - "CRITICAL account with GOLD agreement (score 150, qty 6), PRIORITY account with SILVER agreement (score 60, qty 5), STANDARD account with no agreement (score 10, qty 1); GROUP_A item with stock 10; ACTIVE surge on GROUP_A forcing all three orders to BACKORDERED."
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Crit Lab", segment: "PHARMA", priority_class: "CRITICAL", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a1: $.data.id }
            - call: "POST /lab/accounts"
              payload: { name: "Prio Lab", segment: "CLINICAL", priority_class: "PRIORITY", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a2: $.data.id }
            - call: "POST /lab/accounts"
              payload: { name: "Std Lab", segment: "ACADEMIC", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a3: $.data.id }
            - call: "POST /lab/catalog-items"
              payload: { sku: "SEED-G", name: "Gold seed", item_class: "STANDARD", allocation_group: "GROUP_B", base_price_cents: 200000, stock_on_hand: 10 }
              as: SupplyOps
            - call: "POST /lab/catalog-items"
              payload: { sku: "SEED-S", name: "Silver seed", item_class: "STANDARD", allocation_group: "GROUP_B", base_price_cents: 50000, stock_on_hand: 10 }
              as: SupplyOps
            - call: "POST /lab/catalog-items"
              payload: { sku: "PIPETTE-TIPS", name: "Pipette tips", item_class: "STANDARD", allocation_group: "GROUP_A", base_price_cents: 100, stock_on_hand: 10 }
              as: SupplyOps
            - call: "POST /lab/orders"
              payload: { account_id: "${a1}", lines: [ { sku: "SEED-G", quantity: 1 } ] }
              as: LabProcurement
              as_user_id: "${a1}"
              captures: { o1s: $.data.id }
            - call: "POST /lab/orders/${o1s}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a1}"
            - call: "POST /lab/orders/${o1s}/ship"
              payload: {}
              as: SupplyOps
            - call: "POST /lab/orders"
              payload: { account_id: "${a2}", lines: [ { sku: "SEED-S", quantity: 1 } ] }
              as: LabProcurement
              as_user_id: "${a2}"
              captures: { o2s: $.data.id }
            - call: "POST /lab/orders/${o2s}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a2}"
            - call: "POST /lab/orders/${o2s}/ship"
              payload: {}
              as: SupplyOps
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lab/enterprise-agreements"
              payload: { account_id: "${a1}", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z", committed_annual_spend_cents: 200000 }
              as: AccountManager
            - call: "POST /lab/enterprise-agreements"
              payload: { account_id: "${a2}", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z", committed_annual_spend_cents: 50000 }
              as: AccountManager
            - call: "POST /lab/surge-events"
              payload: { allocation_group: "GROUP_A", reason: "resin shortage" }
              as: SupplyOps
              captures: { sg: $.data.id }
            - call: "POST /lab/orders"
              payload: { account_id: "${a1}", lines: [ { sku: "PIPETTE-TIPS", quantity: 6 } ] }
              as: LabProcurement
              as_user_id: "${a1}"
              captures: { o1: $.data.id }
            - call: "POST /lab/orders/${o1}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a1}"
              captures: { o1_status: $.data.status, o1_score: $.data.allocation_score }
            - call: "POST /lab/orders"
              payload: { account_id: "${a2}", lines: [ { sku: "PIPETTE-TIPS", quantity: 5 } ] }
              as: LabProcurement
              as_user_id: "${a2}"
              captures: { o2: $.data.id }
            - call: "POST /lab/orders/${o2}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a2}"
              captures: { o2_status: $.data.status, o2_score: $.data.allocation_score }
            - call: "POST /lab/orders"
              payload: { account_id: "${a3}", lines: [ { sku: "PIPETTE-TIPS", quantity: 1 } ] }
              as: LabProcurement
              as_user_id: "${a3}"
              captures: { o3: $.data.id }
            - call: "POST /lab/orders/${o3}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a3}"
              captures: { o3_status: $.data.status, o3_score: $.data.allocation_score }
          trigger:
            - call: "POST /lab/surge-events/${sg}/resolve"
              payload: {}
              as: SupplyOps
            - call: "GET /lab/orders/${o1}"
              as: SupplyOps
              captures: { o1_final: $.data.status }
            - call: "GET /lab/orders/${o2}"
              as: SupplyOps
              captures: { o2_final: $.data.status }
            - call: "GET /lab/orders/${o3}"
              as: SupplyOps
              captures: { o3_final: $.data.status }
            - call: "GET /lab/catalog-items?sku=PIPETTE-TIPS"
              as: SupplyOps
              captures: { tips_reserved: "$.data[0].reserved_quantity", tips_avail: "$.data[0].available_stock" }
          assert:
            - "All three submits returned status BACKORDERED while the surge was ACTIVE"
            - "Order.${o1}.allocation_score == 150.0 (100 x 1.5), Order.${o2}.allocation_score == 60.0 (50 x 1.2), Order.${o3}.allocation_score == 10.0 (10 x 1.0), frozen at submit"
            - "After resolve: Order.${o1}.status == ALLOCATED (score 150 first), Order.${o3}.status == ALLOCATED (needs 1 <= 4 remaining), Order.${o2}.status == BACKORDERED (needs 5 > 4; skip-not-block)"
            - "CatalogItem PIPETTE-TIPS: reserved_quantity == 7, stock_on_hand == 10, available_stock == 3"

  - rule_id: non_linear_state_machine
    instances:
      - name: service_contract_renewal_cycle
        grounds:
          - state_machines.ServiceContract.ACTIVE_to_RENEWAL_DUE
          - state_machines.ServiceContract.RENEWAL_DUE_to_ACTIVE
          - concurrency_rules[contract-renew-stale-version]
        distinguishing_aspect: |
          Cyclic machine on ServiceContract: ACTIVE -> RENEWAL_DUE (clock-derived) -> ACTIVE
          (renew), looping rather than terminating; renewal bumps end_date by 12 months and
          renewal_count to 1 while version advances.
        test_recipe:
          setup:
            - "Installed instrument with a GOLD contract spanning 2026-09-01T00:00:00Z to 2027-09-01T00:00:00Z; logical clock advanced to 2027-08-15T00:00:00Z (>= end - 30 days = 2027-08-02T00:00:00Z)."
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Cycle Lab", segment: "PHARMA", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/engineers"
              payload: { name: "Igor Install", territory_code: "CA-NORTH", skills: ["INSTALL"] }
              as: ServiceDispatcher
            - call: "POST /lab/instruments"
              payload: { account_id: "${a_id}", model: "SEQ-5000", serial_number: "CYC-1", placement_type: "CAPITAL" }
              as: AccountManager
              captures: { i_id: $.data.id }
            - call: "POST /lab/instruments/${i_id}/install"
              payload: {}
              as: ServiceDispatcher
            - call: "POST /lab/service-contracts"
              payload: { instrument_id: "${i_id}", tier: "GOLD", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z" }
              as: AccountManager
              captures: { c_id: $.data.id, cv: $.data.version }
            - call: "GET /lab/service-contracts/${c_id}"
              as: AccountManager
              captures: { st_before: $.data.status }
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /lab/service-contracts/${c_id}"
              as: AccountManager
              captures: { st_due: $.data.status }
          trigger:
            - call: "POST /lab/service-contracts/${c_id}/renew"
              payload: { expected_contract_version: "${cv}" }
              as: AccountManager
              captures: { st_after: $.data.status, end_after: $.data.end_date, rc: $.data.renewal_count, v_after: $.data.version }
          assert:
            - "status at default clock 2026-09-01T00:00:00Z == ACTIVE"
            - "status at 2027-08-15T00:00:00Z == RENEWAL_DUE (derived; version still 1 before renew)"
            - "after renew: status == ACTIVE (cycle closed), end_date == 2028-09-01T00:00:00Z, renewal_count == 1, version == 2"

      - name: instrument_parallel_placement_and_operational
        grounds:
          - state_machines.Instrument
          - entities.Instrument.fields.operational_status
          - entities.Instrument.fields.placement_status
        distinguishing_aspect: |
          Two independent state dimensions on one entity (Instrument): placement_status stays
          INSTALLED throughout while operational_status flips UP -> DOWN -> UP driven purely by
          a CRITICAL BREAK_FIX request's lifecycle — neither dimension blocks the other.
        test_recipe:
          setup:
            - "Installed instrument on an ACTIVE account; an engineer holding both INSTALL and BREAK_FIX skills in the account territory."
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Dims Lab", segment: "INDUSTRIAL", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/engineers"
              payload: { name: "Multi Skilled", territory_code: "CA-NORTH", skills: ["INSTALL", "BREAK_FIX"] }
              as: ServiceDispatcher
              captures: { e_id: $.data.id }
            - call: "POST /lab/instruments"
              payload: { account_id: "${a_id}", model: "SEQ-5000", serial_number: "DIM-1", placement_type: "CAPITAL" }
              as: AccountManager
              captures: { i_id: $.data.id }
            - call: "POST /lab/instruments/${i_id}/install"
              payload: {}
              as: ServiceDispatcher
            - call: "GET /lab/instruments/${i_id}"
              as: AccountManager
              captures: { p0: $.data.placement_status, o0: $.data.operational_status }
            - call: "POST /lab/service-requests"
              payload: { instrument_id: "${i_id}", request_type: "BREAK_FIX", severity: "CRITICAL" }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { sr: $.data.id, dl: $.data.response_deadline }
            - call: "GET /lab/instruments/${i_id}"
              as: AccountManager
              captures: { p1: $.data.placement_status, o1: $.data.operational_status }
            - call: "POST /lab/service-requests/${sr}/dispatch"
              payload: {}
              as: ServiceDispatcher
          trigger:
            - call: "POST /lab/service-requests/${sr}/resolve"
              payload: { hours_on_site: 1, parts_cost_cents: 0 }
              as: ServiceDispatcher
            - call: "GET /lab/instruments/${i_id}"
              as: AccountManager
              captures: { p2: $.data.placement_status, o2: $.data.operational_status }
          assert:
            - "before request: placement_status == INSTALLED and operational_status == UP"
            - "while CRITICAL BREAK_FIX open: placement_status == INSTALLED and operational_status == DOWN (independent dimensions)"
            - "after resolve: placement_status == INSTALLED and operational_status == UP"
            - "ServiceRequest.${sr}.response_deadline == 2026-09-04T00:00:00Z (no contract: opened 2026-09-01T00:00:00Z + DEFAULT_RESPONSE_HOURS 72)"

  - rule_id: transitive_cascade
    instances:
      - name: contract_cancel_credit_hold_cancels_drafts
        grounds:
          - state_machines.ServiceContract.ACTIVE_to_CANCELLED
          - calculations.early_termination_fee
          - calculations.credit_hold_evaluation
          - entities.Order.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from POST /lab/service-contracts/{id}/cancel: the cancellation posts a
          2400000-cent termination fee (link 1), the balance crossing 2000000 flips credit_status
          to HOLD (link 2), and the HOLD transition cancels the account's DRAFT order (link 3) —
          each link caused by the previous one, not by the original request.
        test_recipe:
          setup:
            - "Account with an installed instrument under a PLATINUM contract (2026-09-01T00:00:00Z to 2027-09-01T00:00:00Z), one never-submitted DRAFT order, and the logical clock at 2027-03-01T00:00:00Z (6 full months before end_date)."
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Cascade Lab", segment: "PHARMA", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/engineers"
              payload: { name: "Igor Install", territory_code: "CA-NORTH", skills: ["INSTALL"] }
              as: ServiceDispatcher
            - call: "POST /lab/instruments"
              payload: { account_id: "${a_id}", model: "SEQ-5000", serial_number: "CAS-1", placement_type: "CAPITAL" }
              as: AccountManager
              captures: { i_id: $.data.id }
            - call: "POST /lab/instruments/${i_id}/install"
              payload: {}
              as: ServiceDispatcher
            - call: "POST /lab/service-contracts"
              payload: { instrument_id: "${i_id}", tier: "PLATINUM", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z" }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /lab/catalog-items"
              payload: { sku: "CHEAP-100", name: "Cheap tips", item_class: "STANDARD", allocation_group: "GROUP_B", base_price_cents: 100, stock_on_hand: 10 }
              as: SupplyOps
            - call: "POST /lab/orders"
              payload: { account_id: "${a_id}", lines: [ { sku: "CHEAP-100", quantity: 1 } ] }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { o_draft: $.data.id }
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /lab/service-contracts/${c_id}/cancel"
              payload: {}
              as: AccountManager
              captures: { c_status: $.data.status }
            - call: "GET /lab/accounts/${a_id}"
              as: AccountManager
              captures: { bal: $.data.outstanding_balance_cents, credit: $.data.credit_status }
            - call: "GET /lab/orders/${o_draft}"
              as: AccountManager
              captures: { o_status: $.data.status }
          assert:
            - "ServiceContract.${c_id}.status == CANCELLED"
            - "Account.${a_id}.outstanding_balance_cents == 2400000 (link 1: 800000 x 6 months x 0.5)"
            - "Account.${a_id}.credit_status == HOLD (link 2: 2400000 > CREDIT_LIMIT_CENTS 2000000)"
            - "Order.${o_draft}.status == CANCELLED (link 3: HOLD transition cancels every DRAFT order of the account)"

      - name: surge_resolve_promotes_and_reserves
        grounds:
          - state_machines.SurgeEvent.ACTIVE_to_RESOLVED
          - state_machines.Order.BACKORDERED_to_ALLOCATED
          - entities.CatalogItem.fields.reserved_quantity
        distinguishing_aspect: |
          Depth-2 cascade from POST /lab/surge-events/{id}/resolve (a different trigger than the
          contract-cancel cascade): resolving the surge promotes the top-scored BACKORDERED order
          to ALLOCATED (link 1), and that promotion reserves 6 units on the catalog item (link 2).
        test_recipe:
          setup:
            - "CRITICAL account with GOLD agreement (score 150); GROUP_A item stock 10; ACTIVE surge on GROUP_A; one BACKORDERED order of quantity 6."
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Surge Lab", segment: "PHARMA", priority_class: "CRITICAL", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/catalog-items"
              payload: { sku: "SEED-G2", name: "Gold seed 2", item_class: "STANDARD", allocation_group: "GROUP_B", base_price_cents: 200000, stock_on_hand: 10 }
              as: SupplyOps
            - call: "POST /lab/catalog-items"
              payload: { sku: "TIPS-2", name: "Tips 2", item_class: "STANDARD", allocation_group: "GROUP_A", base_price_cents: 100, stock_on_hand: 10 }
              as: SupplyOps
            - call: "POST /lab/orders"
              payload: { account_id: "${a_id}", lines: [ { sku: "SEED-G2", quantity: 1 } ] }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { o_seed: $.data.id }
            - call: "POST /lab/orders/${o_seed}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a_id}"
            - call: "POST /lab/orders/${o_seed}/ship"
              payload: {}
              as: SupplyOps
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lab/enterprise-agreements"
              payload: { account_id: "${a_id}", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z", committed_annual_spend_cents: 200000 }
              as: AccountManager
            - call: "POST /lab/surge-events"
              payload: { allocation_group: "GROUP_A", reason: "allocation crunch" }
              as: SupplyOps
              captures: { sg: $.data.id }
            - call: "POST /lab/orders"
              payload: { account_id: "${a_id}", lines: [ { sku: "TIPS-2", quantity: 6 } ] }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { o1: $.data.id }
            - call: "POST /lab/orders/${o1}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { st: $.data.status, sc: $.data.allocation_score }
          trigger:
            - call: "POST /lab/surge-events/${sg}/resolve"
              payload: {}
              as: SupplyOps
              captures: { sg_status: $.data.status }
            - call: "GET /lab/orders/${o1}"
              as: SupplyOps
              captures: { o1_final: $.data.status }
            - call: "GET /lab/catalog-items?sku=TIPS-2"
              as: SupplyOps
              captures: { rv: "$.data[0].reserved_quantity", av: "$.data[0].available_stock" }
          assert:
            - "submit under ACTIVE surge returned BACKORDERED with allocation_score == 150.0"
            - "SurgeEvent.${sg}.status == RESOLVED after resolve"
            - "Order.${o1}.status == ALLOCATED (link 1: promotion by waterfall)"
            - "CatalogItem TIPS-2 reserved_quantity == 6 and available_stock == 4 (link 2: promotion itself reserved stock)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_order_submit
        grounds:
          - validations[priority=4]
          - validations[priority=6]
        distinguishing_aspect: |
          Pair state(4) vs business_safety(6): a submit that violates BOTH the account-ACTIVE
          state gate and the controlled-substance license safety gate must return
          ERR_ACCOUNT_NOT_ACTIVE, because state (priority 4) precedes business_safety (priority 6).
        test_recipe:
          setup:
            - "SUSPENDED account holding a DRAFT order whose only line is CONTROLLED; the account has no controlled-substance license (both violations hold)."
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Prio Lab 1", segment: "CLINICAL", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/catalog-items"
              payload: { sku: "CTRL-X", name: "Controlled reagent X", item_class: "CONTROLLED", allocation_group: "GROUP_B", base_price_cents: 5000, stock_on_hand: 10 }
              as: SupplyOps
            - call: "POST /lab/orders"
              payload: { account_id: "${a_id}", lines: [ { sku: "CTRL-X", quantity: 1 } ] }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { o_id: $.data.id }
            - call: "PATCH /lab/accounts/${a_id}"
              payload: { status: "SUSPENDED" }
              as: AccountManager
          trigger:
            - call: "POST /lab/orders/${o_id}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "submit fails with error_id == ERR_ACCOUNT_NOT_ACTIVE (state, priority 4), NOT ERR_CONTROLLED_LICENSE_REQUIRED (business_safety, priority 6)"
            - "Order remains DRAFT afterwards"

      - name: safety_beats_fiscal_on_order_submit
        grounds:
          - validations[priority=6]
          - validations[priority=8]
        distinguishing_aspect: |
          Pair business_safety(6) vs business_fiscal(8) — a different category pair than
          state-vs-safety: an ACTIVE account on credit HOLD submitting a CONTROLLED line without
          a license must return ERR_CONTROLLED_LICENSE_REQUIRED, because business_safety
          (priority 6) precedes business_fiscal (priority 8).
        test_recipe:
          setup:
            - "ACTIVE account with credit_status HOLD (outstanding 2000001 > 2000000 from a prior shipped order) and no controlled-substance license; DRAFT order containing a CONTROLLED line."
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Prio Lab 2", segment: "CLINICAL", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/catalog-items"
              payload: { sku: "BIG-2M", name: "Big-ticket item", item_class: "STANDARD", allocation_group: "GROUP_B", base_price_cents: 2000001, stock_on_hand: 5 }
              as: SupplyOps
            - call: "POST /lab/catalog-items"
              payload: { sku: "CTRL-Y", name: "Controlled reagent Y", item_class: "CONTROLLED", allocation_group: "GROUP_B", base_price_cents: 5000, stock_on_hand: 10 }
              as: SupplyOps
            - call: "POST /lab/orders"
              payload: { account_id: "${a_id}", lines: [ { sku: "BIG-2M", quantity: 1 } ] }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { o_seed: $.data.id }
            - call: "POST /lab/orders/${o_seed}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a_id}"
            - call: "POST /lab/orders/${o_seed}/ship"
              payload: {}
              as: SupplyOps
            - call: "GET /lab/accounts/${a_id}"
              as: AccountManager
              captures: { credit: $.data.credit_status }
            - call: "POST /lab/orders"
              payload: { account_id: "${a_id}", lines: [ { sku: "CTRL-Y", quantity: 1 } ] }
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { o2: $.data.id }
          trigger:
            - call: "POST /lab/orders/${o2}/submit"
              payload: {}
              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "account credit_status == HOLD after shipping the 2000001-cent order"
            - "submit fails with error_id == ERR_CONTROLLED_LICENSE_REQUIRED (business_safety, priority 6), NOT ERR_CREDIT_HOLD (business_fiscal, priority 8)"

  - rule_id: boundary_precision_check
    instances:
      - name: ea_tier_boundary_inclusive_floor
        grounds:
          - calculations.ea_tier_discount
          - entities.EnterpriseAgreement.fields.current_tier
        distinguishing_aspect: |
          Boundary on the trailing-spend metric reached via GET /lab/enterprise-agreements/{id}
          plus order submit: trailing == 200000 is GOLD (floor is inclusive, >=) while
          trailing == 199999 is SILVER — one cent below the floor flips the tier.
        test_recipe:
          setup:
            - "Two accounts: AccGold with delivered spend exactly 200000, AccSilver with delivered spend exactly 199999; both hold an ACTIVE agreement."
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Boundary Gold", segment: "PHARMA", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
