        distinguishing_aspect: |
          FAILED is a retry state, not a terminal one: a FAIL leaves the SubscriptionTerm ACTIVE and
          the estate's open_cancellation_count at 1, the retry overwrites effective_date and clears
          failure_reason, and only the CONFIRM cascades the term to CANCELLED with
          cancelled_effective_date equal to the retried date 2026-04-01 — while an effective_date of
