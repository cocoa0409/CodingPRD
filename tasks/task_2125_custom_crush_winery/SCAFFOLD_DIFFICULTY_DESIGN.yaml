      - name: segregation_of_duties_outranks_period_not_closed_on_ttb_file
        grounds:
          - validations[priority=50]
          - validations[priority=65]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_PERIOD_NOT_CLOSED]
          - state_machines.TTBReport.PREPARED_to_FILED
        distinguishing_aspect: |
          A disjoint category pair from the first instance — `business_safety`
          (priority 50) against `business_temporal` (priority 65). Filing a
          PREPARED report as its own preparer while period_end is still in the
          future must answer ERR_SEGREGATION_OF_DUTIES (403); only once a
          different officer files does the lower-priority ERR_PERIOD_NOT_CLOSED
          (422) become observable.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One ACTIVE Client with no contracts, lots or release orders, so every reconciliation line is 0.00 and variance_gallons is 0.00."
            - "One TTBReport for the period 2026-09-01 .. 2026-10-01 PREPARED by ComplianceOfficer co-alice; period_end is one month ahead of the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-alice"
            - call: "POST /clients"
              payload: { name: "Howell Ridge Wines", ttb_permit_number: "BW-CA-15003", contact_email: "compliance@howellridge.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl1: $.data.id }
            - call: "POST /ttb-reports"
              payload: { client_id: "${cl1}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-alice"
              captures: { tr1: $.data.id }
            - call: "POST /ttb-reports/${tr1}/transitions"
              payload: { action: "PREPARE" }
              as: ComplianceOfficer
              as_user_id: "co-alice"
              captures: { var0: $.data.variance_gallons }
          trigger:
            - call: "POST /ttb-reports/${tr1}/transitions"
              payload: { action: "FILE" }
              as: ComplianceOfficer
              as_user_id: "co-alice"
              captures: { err_sod: $.data.error_id }
            - call: "POST /ttb-reports/${tr1}/transitions"
              payload: { action: "FILE" }
              as: ComplianceOfficer
              as_user_id: "co-dave"
              captures: { err_time: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-dave"
            - call: "POST /ttb-reports/${tr1}/transitions"
              payload: { action: "FILE" }
              as: ComplianceOfficer
              as_user_id: "co-dave"
              captures: { st_final: $.data.status }
          assert:
            - "${var0} == 0.00 (the fiscal gate at priority 85 is satisfied and cannot mask the pair under test)"
            - "${err_sod} == ERR_SEGREGATION_OF_DUTIES with HTTP 403"
            - "${err_time} == ERR_PERIOD_NOT_CLOSED with HTTP 422 — visible only once the higher-priority safety check passes"
            - "${st_final} == FILED"
            - "TTBReport.${tr1}.prepared_by_user_id == co-alice and filed_by_user_id == co-dave"
            - "TTBReport.${tr1}.filed_at == 2026-10-01T00:00:00.000Z"
            - "Client.${cl1}.last_filed_period_end == 2026-10-01T00:00:00.000Z"

