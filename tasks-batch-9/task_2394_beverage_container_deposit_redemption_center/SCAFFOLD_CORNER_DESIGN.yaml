# =============================================================================
# §1.9 Corner-case design — task 2394 Beverage Container Deposit Redemption Center
#
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; no categories are invented here.
#
# Every chain starts from an empty database, sets the logical clock explicitly
# (the harness default is 2026-08-01T00:00:00Z, every chain below moves it to
# 2026-08-05T09:00:00Z so that visit_date is 2026-08-05 and the 2026Q3 period
# contains it), and reaches its precondition purely by composing §1.5 calls.
#
# Two §1.5 / §1.4 gaps were found while deriving these chains and were fixed in
# SCAFFOLD.yaml rather than papered over here (priority-ladder rung 2):
#   * RedemptionCenter.status, RedeemerAccount.status and Retailer.obligation_status
#     had no declared error for an action that is not declared from the current
#     state, so validation priority 20 and the errors ERR_INVALID_CENTER_STATE,
#     ERR_INVALID_ACCOUNT_STATE and ERR_INVALID_OBLIGATION_STATE were added.
#   * ERR_PERIOD_NOT_RECONCILED was unreachable — RECONCILE always writes
#     funding_status SURPLUS or SHORTFALL and REOPEN returns the period to OPEN,
#     so no request could ever see a RECONCILING period with funding_status
#     UNSETTLED. The error and its precondition were removed.
# =============================================================================

scaffold_corner_design:

  - section: entities
    instances:

      - name: distributor_creation_returns_201_with_zeroed_counters
        claim_type: Creation
        grounds:
          - endpoints[POST /distributors]
          - entities.Distributor.fields.status
          - entities.Distributor.fields.deposits_initiated_cents
          - response_envelope.success
        distinguishing_aspect: "A fresh Distributor is ACTIVE by default with both roll-up counters at 0 and version 1; the success envelope reports response_type object."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-05T09:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /distributors"
              payload: { legal_name: "Cascade Bottling LLC", state_code: "OR", permit_number: "PERMIT-1001" }
              as: ProgramAdmin
              captures: { dist_id: $.data.id }
          assert:
            - "the trigger response status is 201 and response_type is object with meta.api_request_id present"
            - "Distributor.${dist_id}.status == ACTIVE"
            - "Distributor.${dist_id}.deposits_initiated_cents == 0"
            - "Distributor.${dist_id}.containers_initiated_count == 0"
            - "Distributor.${dist_id}.version == 1"
            - "Distributor.${dist_id}.created_at == 2026-08-05T09:00:00Z"
            - "GET /distributors/${dist_id} returns legal_name Cascade Bottling LLC, state_code OR and permit_number PERMIT-1001"

      - name: beverage_product_retrieval_returns_stored_label_before_submission
        claim_type: Retrieval
        grounds:
          - endpoints[GET /beverage-products/{id}]
          - entities.BeverageProduct.fields.coverage_status
          - entities.BeverageProduct.fields.registration_state
        distinguishing_aspect: "A DRAFT label reads back with coverage_status and coverage_reason null and deposit_cents 0 — coverage is decided by SUBMIT, not by creation."
        test_recipe:
          setup:
            - "One Distributor; one BeverageProduct created but never submitted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /distributors"
              payload: { legal_name: "Cascade Bottling LLC", state_code: "OR", permit_number: "PERMIT-1001" }
              as: ProgramAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /beverage-products"
              payload: { distributor_id: "${dist_id}", brand_name: "Cascade Spring", beverage_type: "WATER", container_material: "PET_PLASTIC", fill_volume_ml: 500, upc: "011110000001", label_state_code: "OR" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
              captures: { prod_id: $.data.id }
          trigger:
            - call: "GET /beverage-products/${prod_id}"
              payload: {}
              as: DistributorAgent
              as_user_id: "${dist_id}"
          assert:
            - "the trigger response status is 200"
            - "BeverageProduct.${prod_id}.brand_name == Cascade Spring"
            - "BeverageProduct.${prod_id}.registration_state == DRAFT"
            - "BeverageProduct.${prod_id}.coverage_status == null"
            - "BeverageProduct.${prod_id}.coverage_reason == null"
            - "BeverageProduct.${prod_id}.deposit_cents == 0"
            - "BeverageProduct.${prod_id}.registered_at == null"
            - "BeverageProduct.${prod_id}.version == 1"

      - name: beverage_products_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /beverage-products]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three stored labels, limit 2 offset 0 returns 2 rows with total_count 3 and has_more true, and offset 2 returns the remaining 1 row with has_more false."
        test_recipe:
          setup:
            - "One Distributor with three BeverageProduct rows, upc 011110000001, 011110000002 and 011110000003"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /distributors"
              payload: { legal_name: "Cascade Bottling LLC", state_code: "OR", permit_number: "PERMIT-1001" }
              as: ProgramAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /beverage-products"
              payload: { distributor_id: "${dist_id}", brand_name: "Cascade Spring", beverage_type: "WATER", container_material: "PET_PLASTIC", fill_volume_ml: 500, upc: "011110000001", label_state_code: "OR" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
            - call: "POST /beverage-products"
              payload: { distributor_id: "${dist_id}", brand_name: "Cascade Cola", beverage_type: "CARBONATED_SOFT_DRINK", container_material: "ALUMINUM", fill_volume_ml: 355, upc: "011110000002", label_state_code: "OR" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
            - call: "POST /beverage-products"
              payload: { distributor_id: "${dist_id}", brand_name: "Cascade Cider", beverage_type: "HARD_CIDER", container_material: "GLASS", fill_volume_ml: 500, upc: "011110000003", label_state_code: "OR" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
          trigger:
            - call: "GET /beverage-products"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
            - call: "GET /beverage-products"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdmin
          assert:
            - "the first trigger response status is 200 with response_type array"
            - "the first trigger reports limit 2, offset 0, total_count 3, has_more true and carries exactly 2 data rows"
            - "the second trigger reports limit 2, offset 2, total_count 3, has_more false and carries exactly 1 data row"
            - "the two pages together contain the upcs 011110000001, 011110000002 and 011110000003 with no row repeated"
            - "GET /beverage-products with no pagination input reports limit 10, offset 0, total_count 3 and has_more false"

      - name: retailer_lookup_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /retailers/{id}]
          - errors[ERR_RETAILER_NOT_FOUND]
          - validations[priority=5]
          - response_envelope.error
        distinguishing_aspect: "An unstored retailer id yields 404 ERR_RETAILER_NOT_FOUND in the error envelope, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database except the logical clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /retailers/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ProgramAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the trigger response status is 404 and $.data.error_id == ERR_RETAILER_NOT_FOUND"
            - "the trigger response has response_type error and a non-empty $.data.message"
            - "the trigger response carries meta.api_request_id and meta.api_request_timestamp"
            - "GET /retailers reports total_count 0"

      - name: center_creation_without_accepted_materials_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints[POST /redemption-centers]
          - validations[priority=7]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "accepted_materials carries no default, so omitting it is a 400 ERR_INVALID_REQUEST and no center row is stored."
        test_recipe:
          setup:
            - "Empty database except the logical clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /redemption-centers"
              payload: { site_name: "Bend Redemption Center", x_miles: 0.0, y_miles: 0.0 }
              as: ProgramAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the trigger response status is 400 and $.data.error_id == ERR_INVALID_REQUEST"
            - "GET /redemption-centers reports total_count 0"

      - name: center_and_machine_creation_apply_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.RedemptionCenter.fields.accepts_all_materials
          - entities.RedemptionCenter.fields.daily_account_cap_containers
          - entities.RedemptionCenter.fields.opening_cash_cents
          - entities.ReverseVendingMachine.fields.bin_capacity_containers
        distinguishing_aspect: "Omitting every optional input yields accepts_all_materials true, daily_account_cap_containers 350, opening_cash_cents 0 and bin_capacity_containers 2000 — the declared defaults, not nulls."
        test_recipe:
          setup:
            - "Empty database except the logical clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /redemption-centers"
              payload: { site_name: "Salem Redemption Center", x_miles: 0.0, y_miles: 0.0, accepted_materials: ["ALUMINUM", "GLASS", "PET_PLASTIC", "HDPE_PLASTIC"] }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /redemption-centers/${center_id}/machines"
              payload: { asset_tag: "RVM-2001", accepted_material: "ALUMINUM" }
              as: ProgramAdmin
              captures: { mach_id: $.data.id }
          assert:
            - "RedemptionCenter.${center_id}.accepts_all_materials == true"
            - "RedemptionCenter.${center_id}.daily_account_cap_containers == 350"
            - "RedemptionCenter.${center_id}.opening_cash_cents == 0"
            - "RedemptionCenter.${center_id}.cash_drawer_balance_cents == 0"
            - "RedemptionCenter.${center_id}.status == PROVISIONAL"
            - "RedemptionCenter.${center_id}.machine_count == 1"
            - "ReverseVendingMachine.${mach_id}.bin_capacity_containers == 2000"
            - "ReverseVendingMachine.${mach_id}.status == IDLE"
            - "ReverseVendingMachine.${mach_id}.bin_filled_count == 0"
            - "ReverseVendingMachine.${mach_id}.jam_count_today == 0"
            - "ReverseVendingMachine.${mach_id}.jam_day == null"
            - "ReverseVendingMachine.${mach_id}.open_session_count == 0"

      - name: center_cash_drawer_is_computed_and_extra_field_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.RedemptionCenter.fields.cash_drawer_balance_cents
          - state_machines.RedemptionCenter.PROVISIONAL_to_OPERATIONAL
          - endpoints[POST /redemption-centers]
        distinguishing_aspect: "A client-supplied cash_drawer_balance_cents is ignored: the field is 0 while the center is PROVISIONAL and becomes opening_cash_cents 50000 only as an ACTIVATE side effect."
        test_recipe:
          setup:
            - "Empty database except the logical clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /redemption-centers"
              payload: { site_name: "Bend Redemption Center", x_miles: 0.0, y_miles: 0.0, accepted_materials: ["ALUMINUM", "GLASS", "PET_PLASTIC", "HDPE_PLASTIC"], opening_cash_cents: 50000, cash_drawer_balance_cents: 12345 }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /redemption-centers/${center_id}/machines"
              payload: { asset_tag: "RVM-1001", accepted_material: "PET_PLASTIC" }
              as: ProgramAdmin
            - call: "POST /redemption-centers/${center_id}/status-changes"
              payload: { action: "ACTIVATE" }
              as: ProgramAdmin
          assert:
            - "immediately after the first trigger: RedemptionCenter.${center_id}.cash_drawer_balance_cents == 0 and RedemptionCenter.${center_id}.opening_cash_cents == 50000"
            - "after the ACTIVATE call: RedemptionCenter.${center_id}.cash_drawer_balance_cents == 50000"
            - "after the ACTIVATE call: RedemptionCenter.${center_id}.status == OPERATIONAL and suspension_reason == null"
            - "RedemptionCenter.${center_id}.version == 2"

      - name: visit_system_fields_generated_and_client_state_input_ignored
        claim_type: System Fields
        grounds:
          - entities.RedemptionVisit.fields.visit_date
          - entities.RedemptionVisit.fields.count_status
          - entities.RedemptionVisit.fields.payout_status
          - endpoints[POST /redemption-visits]
        distinguishing_aspect: "visit_date is stamped from the logical clock as 2026-08-05 and count_status starts OPEN even when the request supplies visit_date 2026-01-01 and count_status COUNTED."
        test_recipe:
          setup:
            - "OPERATIONAL center with one PET_PLASTIC machine; one ACTIVE RedeemerAccount"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /redemption-centers"
              payload: { site_name: "Bend Redemption Center", x_miles: 0.0, y_miles: 0.0, accepted_materials: ["ALUMINUM", "GLASS", "PET_PLASTIC", "HDPE_PLASTIC"], accepts_all_materials: true, daily_account_cap_containers: 300, opening_cash_cents: 50000 }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /redemption-centers/${center_id}/machines"
              payload: { asset_tag: "RVM-1001", accepted_material: "PET_PLASTIC" }
              as: ProgramAdmin
              captures: { mach_id: $.data.id }
            - call: "POST /redemption-centers/${center_id}/status-changes"
              payload: { action: "ACTIVATE" }
              as: ProgramAdmin
            - call: "POST /redeemer-accounts"
              payload: { holder_name: "Dana Reyes", account_code: "ACCT-1001", bag_drop_enrolled: true }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /redemption-visits"
              payload: { site_type: "CENTER", channel: "MACHINE_COUNT", center_id: "${center_id}", machine_id: "${mach_id}", account_id: "${acct_id}", visit_date: "2026-01-01", count_status: "COUNTED" }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { visit_id: $.data.id }
          assert:
            - "the trigger response status is 201"
            - "RedemptionVisit.${visit_id}.visit_date == 2026-08-05"
            - "RedemptionVisit.${visit_id}.count_status == OPEN"
            - "RedemptionVisit.${visit_id}.payout_status == PENDING"
            - "RedemptionVisit.${visit_id}.presented_total == 0"
            - "RedemptionVisit.${visit_id}.payout_cents == 0"
            - "RedemptionVisit.${visit_id}.counted_at == null"
            - "RedemptionVisit.${visit_id}.created_at == 2026-08-05T09:00:00Z"
            - "RedemptionVisit.${visit_id}.version == 1"

      - name: product_creation_with_bad_enum_and_volume_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.BeverageProduct.fields.beverage_type
          - entities.BeverageProduct.fields.fill_volume_ml
          - entities.BeverageProduct.fields.label_state_code
          - validations[priority=7]
        distinguishing_aspect: "An undeclared beverage_type member, fill_volume_ml 0 and a three-letter label_state_code are each 400 ERR_INVALID_REQUEST, and none of the three creates a row."
        test_recipe:
          setup:
            - "One Distributor and no BeverageProduct rows"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /distributors"
              payload: { legal_name: "Cascade Bottling LLC", state_code: "OR", permit_number: "PERMIT-1001" }
              as: ProgramAdmin
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /beverage-products"
              payload: { distributor_id: "${dist_id}", brand_name: "Cascade Sparkle", beverage_type: "SPARKLING_JUICE", container_material: "PET_PLASTIC", fill_volume_ml: 500, upc: "011110000001", label_state_code: "OR" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
              captures: { err_enum: $.data.error_id }
            - call: "POST /beverage-products"
              payload: { distributor_id: "${dist_id}", brand_name: "Cascade Spring", beverage_type: "WATER", container_material: "PET_PLASTIC", fill_volume_ml: 0, upc: "011110000002", label_state_code: "OR" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
              captures: { err_volume: $.data.error_id }
            - call: "POST /beverage-products"
              payload: { distributor_id: "${dist_id}", brand_name: "Cascade Spring", beverage_type: "WATER", container_material: "PET_PLASTIC", fill_volume_ml: 500, upc: "011110000003", label_state_code: "ORE" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
              captures: { err_state: $.data.error_id }
          assert:
            - "the first trigger response status is 400 and $.data.error_id == ERR_INVALID_REQUEST"
            - "the second trigger response status is 400 and $.data.error_id == ERR_INVALID_REQUEST"
            - "the third trigger response status is 400 and $.data.error_id == ERR_INVALID_REQUEST"
            - "GET /beverage-products reports total_count 0"

      - name: deposit_ledger_entry_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.DepositLedgerEntry.common_fields
          - endpoints[GET /program-periods/{id}/ledger-entries]
          - endpoints[POST /distributors/{id}/deposit-initiations]
        distinguishing_aspect: "DepositLedgerEntry is declared common_fields false, so its rows expose id and created_at but no version and no updated_at, and §1.5 offers no PUT, PATCH or DELETE for them."
        test_recipe:
          setup:
            - "OPEN ProgramPeriod 2026Q3; one REGISTERED label; one deposit initiation of 300 containers"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /program-periods"
              payload: { quarter_code: "2026Q3", start_date: "2026-07-01", end_date: "2026-09-30", operating_cost_cents: 1000 }
              as: ProgramAdmin
              captures: { period_id: $.data.id }
            - call: "POST /distributors"
              payload: { legal_name: "Cascade Bottling LLC", state_code: "OR", permit_number: "PERMIT-1001" }
              as: ProgramAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /beverage-products"
              payload: { distributor_id: "${dist_id}", brand_name: "Cascade Spring", beverage_type: "WATER", container_material: "PET_PLASTIC", fill_volume_ml: 500, upc: "011110000001", label_state_code: "OR" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /beverage-products/${prod_id}/registration-actions"
              payload: { action: "SUBMIT" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
            - call: "POST /beverage-products/${prod_id}/registration-actions"
              payload: { action: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /distributors/${dist_id}/deposit-initiations"
              payload: { product_id: "${prod_id}", container_count: 300, period_id: "${period_id}" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
          trigger:
            - call: "GET /program-periods/${period_id}/ledger-entries"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the trigger response status is 200 with response_type array, total_count 1 and has_more false"
            - "the single row has entry_type DEPOSIT_INITIATED, amount_cents 3000, container_count 300 and liability_after_cents 3000"
            - "the single row has source_kind DISTRIBUTOR and source_ref_id == ${dist_id}"
            - "the single row has period_id == ${period_id}, a non-null id and created_at 2026-08-05T09:00:00Z"
            - "the single row exposes no version key and no updated_at key"
            - "§1.5 declares no PUT, PATCH or DELETE endpoint whose output is DepositLedgerEntry"
            - "ProgramPeriod.${period_id}.outstanding_liability_cents == 3000"

      - name: account_credit_entry_is_immutable_and_reports_running_balance
        claim_type: Immutability
        grounds:
          - entities.AccountCreditEntry.common_fields
          - entities.AccountCreditEntry.fields.balance_after_cents
          - endpoints[GET /redeemer-accounts/{id}/credit-entries]
          - endpoints[POST /redeemer-accounts/{id}/credit-actions]
        distinguishing_aspect: "A MANUAL_GRANT line is append-only: it carries balance_after_cents 1000 with no version or updated_at, while the mutable balance lives on the account."
        test_recipe:
          setup:
            - "One ACTIVE RedeemerAccount that has received a MANUAL_GRANT of 1000 cents from operator admin-1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /redeemer-accounts"
              payload: { holder_name: "Dana Reyes", account_code: "ACCT-1001", bag_drop_enrolled: true }
              as: ProgramAdmin
              captures: { acct_id: $.data.id, acct_ver: $.data.version }
            - call: "POST /redeemer-accounts/${acct_id}/credit-actions"
              payload: { action: "MANUAL_GRANT", amount_cents: 1000, expected_account_version: "${acct_ver}", memo: "goodwill credit" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { entry_id: $.data.id }
          trigger:
            - call: "GET /redeemer-accounts/${acct_id}/credit-entries"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the trigger response status is 200 with total_count 1"
            - "AccountCreditEntry.${entry_id}.entry_type == MANUAL_GRANT"
            - "AccountCreditEntry.${entry_id}.amount_cents == 1000"
            - "AccountCreditEntry.${entry_id}.balance_after_cents == 1000"
            - "AccountCreditEntry.${entry_id}.source_kind == PROGRAM_ACTION"
            - "AccountCreditEntry.${entry_id}.source_ref_id == admin-1"
            - "AccountCreditEntry.${entry_id}.memo == goodwill credit"
            - "the returned row exposes no version key and no updated_at key"
            - "RedeemerAccount.${acct_id}.credit_balance_cents == 1000"
            - "RedeemerAccount.${acct_id}.version == 2"

      - name: lot_creation_with_unknown_product_id_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=6]
          - errors[ERR_PRODUCT_NOT_FOUND]
          - entities.ContainerLot.fields.product_id
        distinguishing_aspect: "A body foreign key is resolved before any business rule: an unstored product_id is 404 ERR_PRODUCT_NOT_FOUND and the visit stays OPEN at version 1 with no lot stored."
        test_recipe:
          setup:
            - "OPERATIONAL center with one PET_PLASTIC machine; one anonymous CENTER MACHINE_COUNT visit in count_status OPEN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /redemption-centers"
