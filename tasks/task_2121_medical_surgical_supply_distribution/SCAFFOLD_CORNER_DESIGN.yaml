  - section: endpoints
    instances:

      - name: logical_clock_default_is_2026_08_01_before_any_set_call
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - state_machines.GpoContract.PENDING_ACTIVATION_to_ACTIVE
        distinguishing_aspect: "With no clock call at all, a contract effective 2026-07-01..2026-07-31 cannot activate while a contract effective 2026-08-01..2026-08-02 can, pinning the startup clock at exactly 2026-08-01T00:00:00Z rather than wall-clock time."
        test_recipe:
          setup:
            - "Two items and two contracts, one whose effective window closed on 2026-07-31 and one whose window opens on 2026-08-01, both in PENDING_ACTIVATION. No clock call is issued anywhere in this instance."
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "SKU-CLK-A-CS", description: "Clock probe A", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 5000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
              captures: { item_a_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-CLK-B-CS", description: "Clock probe B", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 5000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
              captures: { item_b_id: $.data.id }
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-ACME", contract_code: "CTR-PAST", tier: "TIER_1", member_class_scope: "ACUTE", effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-07-31T23:59:59Z" }
              as: ContractAdmin
              captures: { ctr_past_id: $.data.id }
            - call: "POST /contracts/${ctr_past_id}/lines"
              payload: { item_id: "${item_a_id}", tier_price_cents: 1000, floor_price_cents: 900 }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_past_id}/transition"
              payload: { to_status: "PENDING_ACTIVATION" }
              as: ContractAdmin
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-ACME", contract_code: "CTR-NOW", tier: "TIER_1", member_class_scope: "ACUTE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-02T23:59:59Z" }
              as: ContractAdmin
              captures: { ctr_now_id: $.data.id }
            - call: "POST /contracts/${ctr_now_id}/lines"
              payload: { item_id: "${item_b_id}", tier_price_cents: 1000, floor_price_cents: 900 }
              as: ContractAdmin
              captures: { cl_now_id: $.data.id }
            - call: "POST /contracts/${ctr_now_id}/transition"
              payload: { to_status: "PENDING_ACTIVATION" }
              as: ContractAdmin
          trigger:
            - call: "POST /contracts/${ctr_past_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ContractAdmin
              captures: { err: $.data.error_id }
            - call: "POST /contracts/${ctr_now_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ContractAdmin
          assert:
            - "${err} == ERR_CONTRACT_TRANSITION_INVALID with HTTP 409 - the clock is past CTR-PAST's effective_to"
            - "GpoContract.${ctr_past_id}.status == PENDING_ACTIVATION"
            - "GpoContract.${ctr_now_id}.status == ACTIVE and activated_at == 2026-08-01T00:00:00.000Z"
            - "ContractLine.${cl_now_id}.activation_state == ACTIVE"

      - name: replenishment_suggestion_is_a_pure_computed_read
        claim_type: computed_read
        grounds:
          - endpoints[GET /formulary-items/{formulary_item_id}/replenishment-suggestion]
          - calculations.par_replenishment_suggestion
        distinguishing_aspect: "Calling the suggestion twice leaves FormularyItem.on_hand_qty at 5, version unchanged, and returns identical numbers both times - it persists nothing."
        test_recipe:
          setup:
            - "One APPROVED formulary mapping with par_qty 40, reorder_point 10 and on_hand_qty 5, on an item with units_per_parent 12."
          setup_api_calls:
            - call: "POST /supply-rooms"
