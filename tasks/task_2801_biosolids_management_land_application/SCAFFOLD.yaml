  - method: POST
    path: /annual-reports
    description: "Open the annual biosolids report for one facility and calendar year in DRAFT. All rollup figures are 0 until submission; public_summary is the narrative served to the public about odor management and emerging contaminants."
    roles: [ComplianceOfficer, PublicLiaison]
    input: ["facility_id", "report_year", "public_summary?"]
    output: AnnualReport
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_FACILITY_NOT_FOUND, ERR_DUPLICATE_RESOURCE]
    side_effects:
      - "Creates the report in DRAFT with amendment_index 0 and version 1."

  - method: GET
    path: /annual-reports/{reportId}
    description: "Read one annual report with its rollup figures."
    roles: [ComplianceOfficer, PublicLiaison, FacilityOperator, Agronomist]
    input: []
    output: AnnualReport
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_REPORT_NOT_FOUND]
    side_effects: []

  - method: GET
    path: /annual-reports
    description: "List annual reports ordered by report_year ASC then created_at ASC."
    roles: [ComplianceOfficer, PublicLiaison, FacilityOperator, Agronomist]
    input: ["facility_id?", "report_year?", "status?", "limit?", "offset?"]
    output: AnnualReport[]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    side_effects: []

  - method: POST
    path: /annual-reports/{reportId}/submit
    description: "Submit a DRAFT report, freezing the year's rollup per calculations.annual_report_rollup. Refused while any ApplicationEvent whose window_start falls in the report year is still SCHEDULED, WEATHER_HOLD, DEFERRED or IN_PROGRESS. Submission locks the year against event voids."
    roles: [ComplianceOfficer]
    input: ["public_summary?"]
    output: AnnualReport
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_REPORT_NOT_FOUND, ERR_REPORT_INVALID_STATE, ERR_OPEN_EVENTS_EXIST]
    side_effects:
      - "Computes and freezes total_dry_tons_land_applied, total_dry_tons_diverted, diverted_dry_tons_by_outlet_type, vsr_compliance_rate_pct, ceiling_exceedance_count and sites_reported_count, sets status SUBMITTED, submitted_at, submitted_by_user_id and increments the report version by 1."

  - method: POST
    path: /annual-reports/{reportId}/amend
    description: "Amend a SUBMITTED or AMENDED report, recomputing the rollup from current data and incrementing amendment_index. Amending unlocks nothing: voiding an event in a reported year stays refused."
    roles: [ComplianceOfficer]
    input: ["public_summary?"]
    output: AnnualReport
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_REPORT_NOT_FOUND, ERR_REPORT_INVALID_STATE]
    side_effects:
      - "Recomputes every rollup figure, sets status AMENDED, increments amendment_index by 1, refreshes submitted_at and increments the report version by 1."

