          - state_machines.InspectionOrder.REQUESTED_to_SCHEDULED
          - state_machines.InspectionOrder.SCHEDULED_to_REQUESTED
        distinguishing_aspect: |
          Conserved quantity = inspector booked minutes on a date. Invariant:
          booked_minutes(insp, D) == sum(duration of SCHEDULED+ orders on D). Schedule a
          BUYER+RADON order (210 min) -> booked_minutes 210; unschedule -> credited back
          -> booked_minutes returns to 0 (no drift).
