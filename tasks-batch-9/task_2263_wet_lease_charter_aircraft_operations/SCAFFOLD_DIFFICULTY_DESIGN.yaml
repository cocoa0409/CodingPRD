      - name: aircraft_occupancy_half_open_with_forty_five_minute_buffer_boundary
        grounds:
          - validations[priority 62 ERR_AIRCRAFT_SCHEDULE_CONFLICT]
          - errors.ERR_AIRCRAFT_SCHEDULE_CONFLICT
          - entities.FlightLeg.fields.scheduled_out
          - entities.FlightLeg.fields.scheduled_in
          - endpoints[POST /wetlease/flight-legs]
        distinguishing_aspect: |
          The occupancy window is the existing leg's block time widened by 45 minutes on each
          side and compared HALF-OPEN. An existing 06:00Z-10:00Z leg occupies [05:15Z, 10:45Z),
          so a candidate starting at 10:44Z conflicts (409) while a candidate starting at exactly
          10:45Z is admitted. A closed-interval comparison rejects both; a zero-buffer comparison
          admits both.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ACTIVE lease on G-ACMI, term 2026-09-01..2026-12-31."
            - "One existing SCHEDULED REVENUE leg on the airframe: 2026-09-25T06:00:00Z to 2026-09-25T10:00:00Z (240 minutes), giving occupancy [2026-09-25T05:15:00Z, 2026-09-25T10:45:00Z)."
