          - state_machines.LicenseApplication.SUSPENDED_REVIEW_to_SUBMITTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / suspended_review_reentry_branches_on_evaluation_existence
          rationale: "The cross-entity guard on the SUSPENDED_REVIEW exit edge is asserted there with both branches in one chain."

