            - call: "POST /permit-applications/${app_id}/insurance-certificates"
              payload: { kind: CERTIFICATE, expected_application_version: "${app_v}", insurer_name: "Acme Mutual", policy_number: "P-900", coverage_amount_cents: 100000000, expires_on: "2026-12-31" }
              as: Organizer
