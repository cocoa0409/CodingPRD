scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: seller_fee_full_credit_vs_partial_recompute_on_order
        grounds:
          - calculations.seller_fee
          - state_machines.Order.PAID_to_REFUNDED
          - state_machines.Order.PAID_to_PARTIALLY_REFUNDED
          - entities.SellerFeeInvoice.fields.amount_cents
          - entities.SellerFeeInvoice.fields.settlement_status
        distinguishing_aspect: |
          The seller_fee on the SellerFeeInvoice entity has two divergent resolutions for the SAME
          underlying order: a full refund credits the invoice to amount_cents-effective 0 (settlement_status
          CREDITED), whereas a partial refund recomputes amount_cents on the reduced gross — for item 30000
          a full refund yields effective fee 0, a partial refund of 10000 (reduced gross 20000) recomputes to 2540.
        test_recipe:
          setup:
            - "Seller S and Buyer B registered; S publishes a BUY_NOW listing at 30000; B buys it producing an Order(item_price_cents=30000) and a SellerFeeInvoice(amount_cents=3630)."
            - "B pays the order (paid_amount_cents=30000); B opens+escalates a dispute; admin will resolve."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s1@x.com", display_name: "S1", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "b1@x.com", display_name: "B1", roles: ["BUYER"] }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "Item A", format: "BUY_NOW", buy_now_price_cents: 30000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /listings/${lst_id}/buy-now"
              payload: { buyer_account_id: "${b_id}", shipping_cents: 0 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "POST /orders/${ord_id}/pay"
              payload: { expected_order_version: "${ord_v}" }
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /orders/${ord_id}/disputes"
              payload: { opener_account_id: "${b_id}", reason: "NOT_AS_DESCRIBED", requested_amount_cents: 10000 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { disp_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /disputes/${disp_id}/escalate"
              payload: {}
              as: Buyer
              as_user_id: "${b_id}"
          trigger:
            - call: "POST /disputes/${disp_id}/resolve"
              payload: { approved_amount_cents: 10000 }
              as: PlatformAdmin
          assert:
            - "Order.${ord_id}.payment_status == PARTIALLY_REFUNDED"
            - "Order.${ord_id}.paid_amount_cents == 20000"
            - "SellerFeeInvoice for ${ord_id} amount_cents == 2540"
            - "SellerFeeInvoice for ${ord_id} settlement_status == INVOICED"

      - name: account_feedback_score_net_vs_seller_fee_balance_outstanding
        grounds:
          - calculations.account_feedback_score
          - calculations.seller_fee_balance
          - entities.Account.fields.feedback_score
          - entities.Account.fields.fee_balance_cents
        distinguishing_aspect: |
          Two valid aggregations on DIFFERENT entity domains diverge in inclusion semantics: Account.feedback_score
          counts ALL Feedback rows (POSITIVE minus NEGATIVE, no status filter), while Account.fee_balance_cents
          sums only SellerFeeInvoice rows with settlement_status==INVOICED (PAID/CREDITED excluded) — so the same
          account's two scores derive from disjoint source sets with opposite filtering rules.
        test_recipe:
          setup:
            - "Seller S sold one BUY_NOW item (30000) to Buyer B; order delivered; B left POSITIVE feedback on S and S left NEGATIVE on B."
            - "S has one INVOICED SellerFeeInvoice (3630) so fee_balance_cents==3630; S.feedback_score==1 (one POSITIVE received)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s2@x.com", display_name: "S2", roles: ["SELLER","BUYER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "b2@x.com", display_name: "B2", roles: ["BUYER"] }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "Item B", format: "BUY_NOW", buy_now_price_cents: 30000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /listings/${lst_id}/buy-now"
              payload: { buyer_account_id: "${b_id}", shipping_cents: 0 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "POST /orders/${ord_id}/pay"
              payload: { expected_order_version: "${ord_v}" }
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /orders/${ord_id}/ship"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /orders/${ord_id}/deliver"
              payload: {}
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /orders/${ord_id}/feedback"
              payload: { rater_account_id: "${s_id}", rating: "NEGATIVE", comment: "slow pay" }
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /orders/${ord_id}/feedback"
              payload: { rater_account_id: "${b_id}", rating: "POSITIVE", comment: "great" }
              as: Buyer
              as_user_id: "${b_id}"
          assert:
            - "Account.${s_id}.feedback_score == 1"
            - "Account.${s_id}.fee_balance_cents == 3630"
            - "Account.${b_id}.feedback_score == -1"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: seller_fee_sum_then_round_order_pinned   # mode (b): nested rounding order
        grounds:
          - calculations.seller_fee
          - entities.SellerFeeInvoice.fields.amount_cents
          - state_machines.Listing.ACTIVE_to_SOLD
        distinguishing_aspect: |
          Mode (b): rounding order matters. For gross_item_cents 30000 the exact tier products are
          3137.5 (tier1) + 462.5 (tier2) = 3600.0; sum-then-round = round(3600.0)+30 = 3630, whereas
          round-per-tier = round(3137.5)+round(462.5)+30 = 3138+463+30 = 3631. The scaffold pins
          SUM-THEN-ROUND so the invoice amount_cents MUST be 3630, not 3631.
        test_recipe:
          setup:
            - "Seller S, Buyer B registered; S publishes a BUY_NOW listing at 30000; B buys it."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s3@x.com", display_name: "S3", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "b3@x.com", display_name: "B3", roles: ["BUYER"] }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "Item C", format: "BUY_NOW", buy_now_price_cents: 30000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /listings/${lst_id}/buy-now"
              payload: { buyer_account_id: "${b_id}", shipping_cents: 0 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "SellerFeeInvoice for ${ord_id} amount_cents == 3630"
            - "SellerFeeInvoice for ${ord_id} gross_item_cents == 30000"

      - name: proxy_bid_resolution_nested_min_branch   # mode (a): >=3 inputs, nested min + conditional branch
        grounds:
          - calculations.proxy_bid_resolution
          - calculations.bid_increment
          - entities.Bid.fields.current_price_cents
          - entities.Listing.fields.current_price_cents
        distinguishing_aspect: |
          Mode (a): proxy resolution takes >=3 inputs (incoming max_proxy, incumbent max_proxy, current price,
          increment-tier) with a conditional branch (M_new<=M_prev keeps incumbent) AND a nested min:
          incumbent current = min(M_prev, M_new + increment(M_new)). For start 10000, A max 30000 (first bid -> 10000),
          B max 20000 -> A retains lead at min(30000, 20000 + increment(20000)=500) = 20500.
        test_recipe:
          setup:
            - "Seller S publishes an AUCTION listing start_price 10000 ending 2026-06-10; Buyer A bids max 30000 (first), Buyer B bids max 20000."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s4@x.com", display_name: "S4", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "a4@x.com", display_name: "A4", roles: ["BUYER"] }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "b4@x.com", display_name: "B4", roles: ["BUYER"] }
              as: Anonymous
              captures: { bb_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "Auc D", format: "AUCTION", start_price_cents: 10000, scheduled_end_at: "2026-06-10T00:00:00Z" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /listings/${lst_id}/bids"
              payload: { bidder_account_id: "${a_id}", max_proxy_cents: 30000 }
              as: Buyer
              as_user_id: "${a_id}"
              captures: { bid_a: $.data.id }
          trigger:
            - call: "POST /listings/${lst_id}/bids"
              payload: { bidder_account_id: "${bb_id}", max_proxy_cents: 20000 }
              as: Buyer
              as_user_id: "${bb_id}"
              captures: { bid_b: $.data.id }
          assert:
            - "Listing.${lst_id}.current_price_cents == 20500"
            - "Listing.${lst_id}.highest_bid_id == ${bid_a}"
            - "Bid.${bid_a}.current_price_cents == 20500"
            - "Bid.${bid_a}.is_winning == true"
            - "Bid.${bid_b}.status == OUTBID"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: offer_cyclic_counter_loop   # cyclic: COUNTERED -> COUNTERED
        grounds:
          - state_machines.Offer.COUNTERED_to_COUNTERED
          - state_machines.Offer.PENDING_to_COUNTERED
          - entities.Offer.fields.round_no
          - entities.Offer.fields.last_actor
        distinguishing_aspect: |
          The Offer machine is cyclic: COUNTERED->COUNTERED loops as buyer and seller alternate counters,
          flipping last_actor each hop and incrementing round_no, bounded by OFFER_MAX_ROUNDS. After a buyer
          submit (round 1, BUYER), seller counter (round 2, SELLER), buyer re-counter (round 3, BUYER) the
          offer is still COUNTERED with round_no==3 and last_actor==BUYER.
        test_recipe:
          setup:
            - "Seller S publishes a BUY_NOW listing at 50000 with accepts_offers true; Buyer B submits an offer 20000; S counters 40000."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s5@x.com", display_name: "S5", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "b5@x.com", display_name: "B5", roles: ["BUYER"] }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "Off E", format: "BUY_NOW", buy_now_price_cents: 50000, accepts_offers: true }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_account_id: "${b_id}", amount_cents: 20000 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { off_id: $.data.id, off_v1: $.data.version }
            - call: "POST /offers/${off_id}/counter"
              payload: { amount_cents: 40000, expected_offer_version: "${off_v1}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { off_v2: $.data.version }
          trigger:
            - call: "POST /offers/${off_id}/counter"
              payload: { amount_cents: 30000, expected_offer_version: "${off_v2}" }
              as: Buyer
              as_user_id: "${b_id}"
          assert:
            - "Offer.${off_id}.status == COUNTERED"
            - "Offer.${off_id}.round_no == 3"
            - "Offer.${off_id}.last_actor == BUYER"
            - "Offer.${off_id}.amount_cents == 30000"

      - name: order_parallel_payment_fulfillment_dimensions   # parallel dimensions on Order
        grounds:
          - state_machines.Order.UNPAID_to_PAID
          - state_machines.Order.READY_TO_SHIP_to_SHIPPED
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          The Order carries two independent state axes on one row: paying advances payment_status UNPAID->PAID
          AND bubbles fulfillment_status AWAITING_PAYMENT->READY_TO_SHIP, then shipping advances ONLY the
          fulfillment axis to SHIPPED while payment_status stays PAID — the two dimensions are tracked separately.
        test_recipe:
          setup:
            - "Seller S, Buyer B; S publishes BUY_NOW at 20000; B buys; order created UNPAID/AWAITING_PAYMENT."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s6@x.com", display_name: "S6", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "b6@x.com", display_name: "B6", roles: ["BUYER"] }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "Ord F", format: "BUY_NOW", buy_now_price_cents: 20000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /listings/${lst_id}/buy-now"
              payload: { buyer_account_id: "${b_id}", shipping_cents: 500 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "POST /orders/${ord_id}/pay"
              payload: { expected_order_version: "${ord_v}" }
              as: Buyer
              as_user_id: "${b_id}"
          trigger:
            - call: "POST /orders/${ord_id}/ship"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
          assert:
            - "Order.${ord_id}.payment_status == PAID"
            - "Order.${ord_id}.fulfillment_status == SHIPPED"
            - "Order.${ord_id}.paid_amount_cents == 20500"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: auction_close_cascade_order_invoice_balance   # depth-4: clock -> Listing -> Order -> Invoice -> Account.fee_balance
        grounds:
          - state_machines.Listing.ACTIVE_to_ENDED_MET
          - state_machines.Listing.ENDED_MET_to_SOLD
          - calculations.seller_fee
          - calculations.seller_fee_balance
          - entities.Account.fields.fee_balance_cents
        distinguishing_aspect: |
          Depth-4 transitive chain from the clock trigger: /_clock/advance closes the auction
          (Listing ACTIVE->ENDED_MET) which ITSELF creates an Order (sold_price 20500) which ITSELF
          cascades a SellerFeeInvoice(amount_cents=2603) which ITSELF debits Account.fee_balance_cents to 2603 —
          each link caused by the prior link, not by the clock directly.
        test_recipe:
          setup:
            - "Seller S publishes AUCTION start 10000 reserve 18000 ending 2026-06-10; Buyer A bids max 30000 (first -> 10000); Buyer B bids max 20000 (A retains lead at 20500)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s7@x.com", display_name: "S7", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "a7@x.com", display_name: "A7", roles: ["BUYER"] }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "b7@x.com", display_name: "B7", roles: ["BUYER"] }
              as: Anonymous
              captures: { bb_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "Auc G", format: "AUCTION", start_price_cents: 10000, reserve_price_cents: 18000, scheduled_end_at: "2026-06-10T00:00:00Z" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /listings/${lst_id}/bids"
              payload: { bidder_account_id: "${a_id}", max_proxy_cents: 30000 }
              as: Buyer
              as_user_id: "${a_id}"
              captures: { bid_a: $.data.id }
            - call: "POST /listings/${lst_id}/bids"
              payload: { bidder_account_id: "${bb_id}", max_proxy_cents: 20000 }
              as: Buyer
              as_user_id: "${bb_id}"
          trigger:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-10T00:00:01Z" }
              as: PlatformAdmin
          assert:
            - "Listing.${lst_id}.status == SOLD"
            - "Listing.${lst_id}.sold_price_cents == 20500"
            - "Listing.${lst_id}.winner_account_id == ${a_id}"
            - "Order for listing ${lst_id} item_price_cents == 20500"
            - "SellerFeeInvoice for that order amount_cents == 2603"
            - "Account.${s_id}.fee_balance_cents == 2603"

      - name: order_cancel_cascade_invoice_credit_balance   # depth-3: cancel -> Order CANCELLED -> Invoice CREDITED -> Account.fee_balance
        grounds:
          - state_machines.Order.AWAITING_PAYMENT_to_CANCELLED
          - state_machines.Order.PAID_to_REFUNDED
          - calculations.seller_fee_balance
          - entities.SellerFeeInvoice.fields.settlement_status
          - entities.Account.fields.fee_balance_cents
        distinguishing_aspect: |
          Depth-3 transitive chain from the seller-cancel trigger (DIFFERENT from the clock trigger of the other
          instance): POST /orders/{id}/cancel sets Order fulfillment CANCELLED which ITSELF flips the
          SellerFeeInvoice to CREDITED which ITSELF removes its amount from Account.fee_balance_cents (back to 0).
        test_recipe:
          setup:
            - "Seller S publishes BUY_NOW at 30000; Buyer B buys (Order UNPAID, Invoice 3630 INVOICED, S.fee_balance 3630); order left unpaid."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s8@x.com", display_name: "S8", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "b8@x.com", display_name: "B8", roles: ["BUYER"] }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "Can H", format: "BUY_NOW", buy_now_price_cents: 30000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /listings/${lst_id}/buy-now"
              payload: { buyer_account_id: "${b_id}", shipping_cents: 0 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /orders/${ord_id}/cancel"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
          assert:
            - "Order.${ord_id}.fulfillment_status == CANCELLED"
            - "SellerFeeInvoice for ${ord_id} settlement_status == CREDITED"
            - "Account.${s_id}.fee_balance_cents == 0"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: self_trading_beats_bid_too_low   # business_safety (p9) vs business_constraint (p11)
        grounds:
          - "validations[priority=9]"
          - "validations[priority=11]"
          - "errors[ERR_SELF_TRADING]"
          - "errors[ERR_BID_TOO_LOW]"
        distinguishing_aspect: |
          A single request violates BOTH the business_safety self-trading rule (p9) and the business_constraint
          bid-eligibility rule (p11: max_proxy below start_price). The seller bids 5000 on their own listing
          whose start_price is 10000; priority ordering must surface ERR_SELF_TRADING (p9), not ERR_BID_TOO_LOW (p11).
        test_recipe:
          setup:
            - "Seller S (also holds BUYER) publishes AUCTION start_price 10000 ending 2026-06-10."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s9@x.com", display_name: "S9", roles: ["SELLER","BUYER"] }
