              captures: { standing_1: "$.data.compliance_standing", reason_1: "$.data.standing_reason", cook_v_susp: "$.data.version" }
            - call: POST /cooks/${cook_id}/standing-actions
              payload: { action: "REINSTATE", reason: "cook says it was a thermometer fault" }
              as: SafetyOfficer
