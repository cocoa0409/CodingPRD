            - { call: "POST /v1/label-reviews/${rev1}/reject", payload: { review_note: "claim unsubstantiated" }, as: LabelComplianceReviewer, as_user_id: "rev-1" }
            - { call: "GET /v1/formulas/${form_id}", payload: {}, as: Any, captures: { fv: $.data.version, lv1: $.data.label_version, st1: $.data.status } }
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${fv}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { rev2: $.data.id } }
            - { call: "POST /v1/label-reviews/${rev2}/approve", payload: {}, as: LabelComplianceReviewer, as_user_id: "rev-1" }
            - { call: "GET /v1/formulas/${form_id}", payload: {}, as: Any, captures: { fv: $.data.version, lv2: $.data.label_version, st2: $.data.status } }
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${fv}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { rev3: $.data.id } }
            - { call: "POST /v1/label-reviews/${rev3}/approve", payload: {}, as: LabelComplianceReviewer, as_user_id: "rev-2", captures: { rev3_status: $.data.status } }
            - { call: "GET /v1/formulas/${form_id}", payload: {}, as: Any, captures: { lv3: $.data.label_version, st3: $.data.status } }
          assert:
            - "After reject: st1 == REVISION_REQUIRED and lv1 == 0 (rejection does not bump label_version)"
            - "After first approve: st2 == APPROVED and lv2 == 1"
            - "After re-submit + second approve (APPROVED -> LABEL_REVIEW -> APPROVED cycle): st3 == APPROVED and lv3 == 2"

