# =============================================================================
# PRD Benchmark Scaffold — task_1033 Fishing, Tackle & Bait Shop
# Difficulty: Expert
# Files: SCAFFOLD.yaml (§1.0–§1.7) + SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8)
#        + SCAFFOLD_CORNER_DESIGN.yaml (§1.9)
# =============================================================================

scenario: |
  1033. Fishing, Tackle & Bait Shop: SKU & state fishing-license sales, live-bait
  inventory & tank, charter/guide booking linkage, tournament & weigh-in, rod/reel
  service & spooling, loyalty, seasonal, special order

domain_name: fishing-tackle-bait
api_prefix: /

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
    - rate_threshold_triggers
  difficulty_level: Expert
  entity_topology: flat
  # flat: peer entities linked by foreign keys, no nesting in URL paths.
  state_machine_shape: cyclic
  # CharterBooking + ServiceOrder carry revision cycles; Tournament branches; Sale is
  # near-linear; License/BaitTank posture derived.
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  # peer_roles with a hierarchical ShopManager override; Guide/Customer are
  # entity_backed and own their own resources.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Customer full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: state_code, type: string, source: input, description: "Two-letter residency state, e.g. CA; used for RESIDENT/SENIOR license eligibility" }
      - { name: birth_date, type: string, source: input, description: "ISO date YYYY-MM-DD; drives license age checks (age computed vs logical clock)" }
      - { name: loyalty_ledger, type: array, source: system, description: "Append-only points ledger; objects {entry_id, delta_points, reason, ref_type, ref_id, created_at}" }
      - { name: loyalty_points_balance, type: integer, source: computed, description: "== sum(loyalty_ledger[].delta_points); never below 0" }
      - { name: loyalty_tier, type: enum, source: computed, description: "BRONZE | SILVER | GOLD from loyalty_points_balance thresholds: BRONZE if balance < 500; SILVER if 500 <= balance < 2000; GOLD if balance >= 2000 (SILVER_MIN=500, GOLD_MIN=2000)" }
      - { name: lifetime_spend_cents, type: integer, source: computed, description: "Sum of Sale.total_cents for that customer with status IN {COMPLETED, SETTLED}" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: sku, type: string, source: input, description: "Unique stock-keeping unit code", constraints: "unique across products" }
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: category, type: enum, source: input, description: "ROD | REEL | TERMINAL_TACKLE | APPAREL | DRY_BAIT" }
      - { name: unit_price_cents, type: integer, source: input, description: "Shelf price per unit, >= 0" }
      - { name: stock_qty, type: integer, source: input, description: "On-hand merchandise units; decremented on Sale line, >= 0" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Inactive products cannot be added to sales or special-ordered" }
      - { name: is_special_order_eligible, type: boolean, source: input, default: false, description: "If true, product may back a SpecialOrder" }

  - name: FishingLicense
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the license holder" }
      - { name: license_type, type: enum, source: input, description: "RESIDENT_ANNUAL | NONRESIDENT_ANNUAL | ONE_DAY | SENIOR" }
      - { name: state_code, type: string, source: input, description: "Issuing state; RESIDENT_ANNUAL and SENIOR require state_code == holder Customer.state_code" }
      - { name: valid_from, type: datetime, source: input, description: "License validity start (ISO 8601 UTC)" }
      - { name: valid_to, type: datetime, source: computed, description: "valid_from + LICENSE_DURATION_DAYS[license_type] (365 for annual/senior, 1 for one-day)" }
      - { name: price_cents, type: integer, source: computed, description: "LICENSE_PRICE_CENTS[license_type] = { RESIDENT_ANNUAL: 5200, NONRESIDENT_ANNUAL: 12000, ONE_DAY: 1500, SENIOR: 2600 }; server-computed, ignores any client-supplied value" }
      - { name: status, type: enum, source: computed, description: "VOID if voided; else SCHEDULED if now<valid_from; ACTIVE if valid_from<=now<valid_to; EXPIRED if now>=valid_to (now = logical clock)" }
      - { name: is_voided, type: boolean, source: system, default: false, description: "Set true by void action" }
      - { name: issued_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the issuing clerk/manager" }

  - name: BaitTank
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Tank label, e.g. 'Front Minnow Tank'" }
      - { name: species, type: enum, source: input, description: "MINNOW | SHINER | NIGHTCRAWLER | SHRIMP" }
      - { name: capacity_units, type: integer, source: input, description: "Maximum live-bait units on-hand, > 0" }
      - { name: mortality_rate_bps_per_day, type: integer, source: input, description: "Daily mortality in basis points (200 = 2%/day); drives decay of each batch" }
      - { name: batches, type: array, source: system, description: "Append-only delivered batches; objects {batch_id, initial_count, delivered_at, created_at}" }
      - { name: sold_count, type: integer, source: system, description: "Cumulative units dispensed minus returned; >= 0" }
      - { name: available_count, type: integer, source: computed, description: "max(0, sum(survivors(batch)) - sold_count); see tank_available_count calc" }
      - { name: low_stock_threshold, type: integer, source: computed, description: "ceil(capacity_units * 0.10)" }
      - { name: status, type: enum, source: computed, description: "EMPTY if available_count==0; LOW if 0<available_count<low_stock_threshold; HEALTHY otherwise" }

  - name: Guide
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; equals X-User-ID when acting as Guide" }
      - { name: name, type: string, source: input, description: "Guide/captain name" }
      - { name: guide_license_no, type: string, source: input, description: "State charter-guide license number" }
      - { name: half_day_rate_cents, type: integer, source: input, description: "Base rate for a HALF_DAY charter" }
      - { name: full_day_rate_cents, type: integer, source: input, description: "Base rate for a FULL_DAY charter" }
      - { name: per_extra_angler_cents, type: integer, source: input, description: "Surcharge per angler above CHARTER_INCLUDED_ANGLERS" }
      - { name: max_party_size, type: integer, source: input, description: "Maximum anglers this guide accepts" }
      - { name: fuel_surcharge_cents, type: integer, source: input, default: 0, description: "Flat fuel surcharge added at charter settlement (final only, not provisional)" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | SUSPENDED; a booking may only be CONFIRMED while the guide is AVAILABLE" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Fishing venue name (lake/river/marina)" }
      - { name: water_type, type: enum, source: input, description: "LAKE | RIVER | SALTWATER | POND" }
      - { name: daily_permit_cents, type: integer, source: input, default: 0, description: "Informational venue day-permit price" }

  - name: CharterBooking
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; booking owner" }
      - { name: guide_id, type: string, source: input, description: "FK -> Guide.id; the booked guide" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; where the trip launches" }
      - { name: trip_type, type: enum, source: input, description: "HALF_DAY | FULL_DAY; selects the guide base rate" }
      - { name: party_size, type: integer, source: input, description: "Anglers on the trip, >= 1" }
      - { name: start_at, type: datetime, source: input, description: "Trip start (ISO 8601 UTC); its month drives the FINAL seasonal multiplier" }
      - { name: end_at, type: datetime, source: input, description: "Trip end (ISO 8601 UTC); guide occupancy uses [start_at, end_at) padded on both sides by CHARTER_BUFFER_MINUTES = 60" }
      - { name: add_equipment_rental, type: boolean, source: input, default: false, description: "If true, adds EQUIPMENT_RENTAL_PER_ANGLER_CENTS * party_size" }
      - { name: status, type: enum, source: system, description: "REQUESTED | QUOTED | CONFIRMED | COMPLETED | CANCELLED" }
      - { name: season_at_quote, type: enum, source: computed, description: "PEAK | OFF recorded from the LOGICAL CLOCK month at QUOTE time (drives provisional multiplier)" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Quote-time estimate; see charter_booking_cost variant=provisional; null before QUOTED" }
      - { name: deposit_cents, type: integer, source: computed, description: "round(provisional_total_cents * DEPOSIT_PCT); null before QUOTED" }
      - { name: final_total_cents, type: integer, source: computed, description: "Settlement charge; see charter_booking_cost variant=final; null before COMPLETED" }
      - { name: points_awarded, type: integer, source: computed, description: "Loyalty points minted at COMPLETED = round(final_total_cents/100 * tier_multiplier[holder tier at completion]); null before COMPLETED" }
      - { name: cancel_reason, type: string, source: input, default: null, description: "Optional free-text supplied with a CANCEL action" }

  - name: Tournament
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; occupies the venue for [start_at, end_at)" }
      - { name: name, type: string, source: input, description: "Tournament name" }
      - { name: entry_fee_cents, type: integer, source: input, description: "Fee charged per TournamentEntry" }
      - { name: bag_limit, type: integer, source: input, default: 5, description: "Top-N accepted weigh-ins counted per entry's bag" }
      - { name: registration_open_at, type: datetime, source: input, description: "Registration window start (inclusive)" }
      - { name: registration_close_at, type: datetime, source: input, description: "Registration window end (EXCLUSIVE): register requires now < registration_close_at" }
      - { name: start_at, type: datetime, source: input, description: "Tournament start (ISO 8601 UTC); venue occupancy start" }
      - { name: end_at, type: datetime, source: input, description: "Tournament end (ISO 8601 UTC); venue occupancy end" }
      - { name: max_entries, type: integer, source: input, description: "Registration cap, > 0" }
      - { name: prize_points, type: integer, source: input, description: "Loyalty points minted for the winner's customer at FINALIZE" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | REGISTRATION_OPEN | IN_PROGRESS | FINALIZED | CANCELLED" }
      - { name: entry_count, type: integer, source: computed, description: "count(TournamentEntry where tournament_id == this.id)" }
      - { name: winner_entry_id, type: string, source: computed, description: "Set at FINALIZE to the entry with placement==1; null otherwise" }

  - name: TournamentEntry
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: tournament_id, type: string, source: input, description: "FK -> Tournament.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the competitor" }
      - { name: status, type: enum, source: system, description: "REGISTERED | WEIGHED | PLACED" }
      - { name: entry_fee_paid_cents, type: integer, source: system, description: "Snapshot of Tournament.entry_fee_cents at registration" }
      - { name: weigh_ins, type: array, source: system, description: "Append-only weigh records; objects {weigh_in_id, species, weight_grams, accepted, created_at}" }
      - { name: bag_weight_grams, type: integer, source: computed, description: "Sum of the top bag_limit accepted weigh-ins' weight_grams; see tournament_scoring calc" }
      - { name: big_fish_grams, type: integer, source: computed, description: "max(weight_grams over accepted weigh-ins); 0 if none" }
      - { name: placement, type: integer, source: computed, description: "1-based rank assigned at Tournament FINALIZE; null before finalize or if bag_weight_grams==0" }

  - name: ServiceOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the item owner" }
      - { name: item_description, type: string, source: input, description: "Free-text description of the rod/reel dropped off" }
      - { name: service_type, type: enum, source: input, description: "SPOOLING | REEL_SERVICE | ROD_REPAIR | GUIDE_LINE" }
      - { name: quoted_cents, type: integer, source: input, description: "Estimated service price at intake" }
      - { name: line_length_yards, type: integer, source: input, default: null, description: "Line to spool (SPOOLING only), > 0 when supplied" }
      - { name: status, type: enum, source: system, description: "RECEIVED | IN_PROGRESS | AWAITING_PARTS | READY | PICKED_UP | CANCELLED" }
      - { name: final_cents, type: integer, source: computed, description: "Charge captured at PICKED_UP; equals quoted_cents; null before pickup" }

  - name: SpecialOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; requester" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; must be is_special_order_eligible and is_active" }
      - { name: quantity, type: integer, source: input, description: "Units to order, >= 1" }
      - { name: unit_price_cents, type: integer, source: system, description: "Snapshot of Product.unit_price_cents at request time" }
      - { name: deposit_cents, type: integer, source: computed, description: "round(unit_price_cents * quantity * SPECIAL_ORDER_DEPOSIT_PCT)" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ORDERED | ARRIVED | FULFILLED | CANCELLED" }
      - { name: refund_cents, type: integer, source: computed, description: "Deposit refund computed at CANCEL; see special_order_refund calc; null unless CANCELLED" }

  - name: Sale
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the buyer (earns loyalty)" }
      - { name: clerk_user_id, type: string, source: system, description: "Opaque X-User-ID of the clerk who opened the sale" }
      - { name: lines, type: array, source: system, description: "Line items; objects {line_id, product_id, qty, unit_price_cents, line_total_cents, refunded}" }
      - { name: status, type: enum, source: system, description: "OPEN | COMPLETED | SETTLED | REFUNDED | VOIDED" }
      - { name: subtotal_cents, type: integer, source: computed, description: "sum(line_total_cents for non-refunded lines)" }
      - { name: tax_cents, type: integer, source: computed, description: "round(subtotal_cents * TAX_BPS/10000)" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + tax_cents" }
      - { name: points_provisional, type: integer, source: computed, description: "Points minted at COMPLETE; see loyalty_points_accrual variant=provisional; null before COMPLETED" }
      - { name: points_final, type: integer, source: computed, description: "Points reconciled at SETTLE; see loyalty_points_accrual variant=final; null before SETTLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CharterBooking
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Cyclic: RESCHEDULE returns a QUOTED/CONFIRMED booking to REQUESTED so it must be re-quoted."
    transitions:
      - from: REQUESTED
        to: QUOTED
        trigger: "POST /charter-bookings/{id}/transition {action: QUOTE}"
        actor: ShopClerk
        preconditions:
          - "party_size <= Guide.max_party_size (else ERR_PARTY_TOO_LARGE)"
        side_effects:
          - "season_at_quote = PEAK if logical-clock month in PEAK_MONTHS else OFF"
          - "recompute provisional_total_cents via charter_booking_cost variant=provisional"
          - "deposit_cents = round(provisional_total_cents * DEPOSIT_PCT)"
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /charter-bookings/{id}/transition {action: CONFIRM}"
        actor: Customer
        preconditions:
          - "Guide.status == AVAILABLE (else ERR_GUIDE_SUSPENDED) [cross-entity: CharterBooking depends on Guide]"
          - "No other CONFIRMED/COMPLETED CharterBooking on this guide whose [start_at,end_at) padded on both sides by CHARTER_BUFFER_MINUTES = 60 overlaps this booking (else ERR_GUIDE_UNAVAILABLE)"
        side_effects: []
      - from: [QUOTED, CONFIRMED]
        to: REQUESTED
        trigger: "POST /charter-bookings/{id}/transition {action: RESCHEDULE, start_at, end_at, trip_type?, party_size?}"
        actor: Customer
        preconditions: []
        side_effects:
          - "Apply new start_at/end_at (and trip_type/party_size if supplied)"
          - "Clear provisional_total_cents, deposit_cents, season_at_quote (must be re-quoted)"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /charter-bookings/{id}/transition {action: COMPLETE}"
        actor: Guide
        preconditions: []
        side_effects:
          - "recompute final_total_cents via charter_booking_cost variant=final (uses start_at month season + Guide.fuel_surcharge_cents + holder tier discount)"
          - "points_awarded = round(final_total_cents/100 * tier_multiplier[holder tier])"
          - "CASCADE link1: append loyalty_ledger entry {delta_points: points_awarded, reason: CHARTER_COMPLETE, ref_type: CharterBooking, ref_id: this.id} to holder Customer"
          - "CASCADE link2: recompute Customer.loyalty_points_balance = sum(loyalty_ledger deltas)"
          - "CASCADE link3: recompute Customer.loyalty_tier from new balance (may upgrade BRONZE->SILVER->GOLD)"
          - "add final_total_cents into Customer.lifetime_spend_cents"
      - from: [REQUESTED, QUOTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /charter-bookings/{id}/transition {action: CANCEL, cancel_reason?}"
        actor: Customer
        preconditions: []
        side_effects:
          - "record cancel_reason; no loyalty minted; guide time slot released"

  - entity: ServiceOrder
    field: status
    initial_state: RECEIVED
    terminal_states: [PICKED_UP, CANCELLED]
    note: "Cyclic: AWAITING_PARTS <-> IN_PROGRESS revision loop while parts are sourced."
    transitions:
      - from: RECEIVED
        to: IN_PROGRESS
        trigger: "POST /service-orders/{id}/transition {action: START}"
        actor: ShopClerk
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: AWAITING_PARTS
        trigger: "POST /service-orders/{id}/transition {action: AWAIT_PARTS}"
        actor: ShopClerk
        preconditions: []
        side_effects: []
      - from: AWAITING_PARTS
        to: IN_PROGRESS
        trigger: "POST /service-orders/{id}/transition {action: RESUME}"
        actor: ShopClerk
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: READY
        trigger: "POST /service-orders/{id}/transition {action: READY}"
        actor: ShopClerk
        preconditions: []
        side_effects: []
      - from: READY
        to: PICKED_UP
        trigger: "POST /service-orders/{id}/transition {action: PICKUP}"
        actor: ShopClerk
        preconditions: []
        side_effects:
          - "final_cents = quoted_cents"
          - "append loyalty_ledger entry {delta_points: round(final_cents/100), reason: SERVICE_PICKUP, ref_type: ServiceOrder, ref_id: this.id} to Customer; recompute balance and tier"
      - from: [RECEIVED, IN_PROGRESS, AWAITING_PARTS]
        to: CANCELLED
        trigger: "POST /service-orders/{id}/transition {action: CANCEL}"
        actor: ShopClerk
        preconditions: []
        side_effects: []

  - entity: Tournament
    field: status
    initial_state: SCHEDULED
    terminal_states: [FINALIZED, CANCELLED]
    note: "Branching lifecycle; FINALIZE fans a scoring + prize cascade over its entries."
    transitions:
      - from: SCHEDULED
        to: REGISTRATION_OPEN
        trigger: "POST /tournaments/{id}/transition {action: OPEN}"
        actor: TournamentDirector
        preconditions: []
        side_effects: []
      - from: REGISTRATION_OPEN
        to: IN_PROGRESS
        trigger: "POST /tournaments/{id}/transition {action: START}"
        actor: TournamentDirector
        preconditions: []
        side_effects: ["registration closes; weigh-ins now accepted"]
      - from: IN_PROGRESS
        to: FINALIZED
        trigger: "POST /tournaments/{id}/transition {action: FINALIZE}"
        actor: TournamentDirector
        preconditions: []
        side_effects:
          - "run tournament_scoring: rank entries by bag_weight_grams desc, tie-break earliest last-qualifying weigh-in created_at asc"
          - "CASCADE link1: assign placement to each entry with bag_weight_grams>0; entry.status WEIGHED->PLACED; set winner_entry_id = entry with placement==1"
          - "CASCADE link2: append loyalty_ledger entry {delta_points: prize_points, reason: TOURNAMENT_PRIZE, ref_type: Tournament, ref_id: this.id} to the winner entry's Customer; recompute that Customer.loyalty_points_balance and loyalty_tier"
      - from: [SCHEDULED, REGISTRATION_OPEN, IN_PROGRESS]
        to: CANCELLED
        trigger: "POST /tournaments/{id}/transition {action: CANCEL}"
        actor: TournamentDirector
        preconditions: []
        side_effects: ["no prize minted; registrations frozen"]

  - entity: TournamentEntry
    field: status
    initial_state: REGISTERED
    terminal_states: [PLACED]
    transitions:
      - from: REGISTERED
        to: WEIGHED
        trigger: "POST /tournament-entries/{id}/weigh-ins (first accepted weigh-in)"
        actor: TournamentDirector
        preconditions:
          - "parent Tournament.status == IN_PROGRESS (else ERR_TOURNAMENT_NOT_IN_PROGRESS) [cross-entity: TournamentEntry depends on Tournament]"
          - "weight_grams > 0 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "append weigh_in {weigh_in_id, species, weight_grams, accepted:true, created_at}"
          - "recompute bag_weight_grams (top bag_limit) and big_fish_grams"
      - from: WEIGHED
        to: WEIGHED
        trigger: "POST /tournament-entries/{id}/weigh-ins (subsequent accepted weigh-in)"
        actor: TournamentDirector
        preconditions:
          - "parent Tournament.status == IN_PROGRESS (else ERR_TOURNAMENT_NOT_IN_PROGRESS)"
          - "weight_grams > 0 (else ERR_INVALID_REQUEST)"
        side_effects: ["append weigh_in; recompute bag_weight_grams and big_fish_grams"]
      - from: [REGISTERED, WEIGHED]
        to: PLACED
        trigger: "system (Tournament FINALIZE, bag_weight_grams > 0)"
        actor: system
        preconditions: []
        side_effects: ["placement assigned by tournament_scoring rank"]

  - entity: SpecialOrder
    field: status
    initial_state: REQUESTED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ORDERED
        trigger: "POST /special-orders/{id}/transition {action: ORDER}"
        actor: ShopClerk
        preconditions:
          - "backing Product.is_active == true (else ERR_PRODUCT_INACTIVE)"
        side_effects: []
      - from: ORDERED
        to: ARRIVED
        trigger: "POST /special-orders/{id}/transition {action: ARRIVE}"
        actor: ShopClerk
        preconditions: []
        side_effects: []
      - from: ARRIVED
        to: FULFILLED
        trigger: "POST /special-orders/{id}/transition {action: FULFILL}"
        actor: ShopClerk
        preconditions: []
        side_effects:
          - "append loyalty_ledger entry {delta_points: round(unit_price_cents*quantity/100), reason: SPECIAL_ORDER_FULFILL, ref_type: SpecialOrder, ref_id: this.id} to Customer; recompute balance and tier"
      - from: [REQUESTED, ORDERED]
        to: CANCELLED
        trigger: "POST /special-orders/{id}/transition {action: CANCEL}"
        actor: ShopClerk
        preconditions: []
        side_effects:
          - "refund_cents computed via special_order_refund (full deposit if from REQUESTED; deposit minus restock fee if from ORDERED)"

  - entity: Sale
    field: status
    initial_state: OPEN
    terminal_states: [SETTLED, REFUNDED, VOIDED]
    note: "COMPLETE mints provisional points; SETTLE reconciles to final; REFUND reverses points (compensating)."
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /sales/{id}/transition {action: COMPLETE}"
        actor: ShopClerk
        preconditions:
          - "at least one line (else ERR_EMPTY_SALE)"
          - "for each line: Product.stock_qty >= qty (else ERR_INSUFFICIENT_STOCK)"
        side_effects:
          - "decrement each line's Product.stock_qty by qty"
          - "recompute subtotal_cents, tax_cents, total_cents"
          - "points_provisional via loyalty_points_accrual variant=provisional"
          - "append loyalty_ledger entry {delta_points: points_provisional, reason: SALE_COMPLETE, ref_type: Sale, ref_id: this.id}; recompute Customer balance and tier"
          - "add total_cents to Customer.lifetime_spend_cents"
      - from: COMPLETED
        to: SETTLED
        trigger: "POST /sales/{id}/transition {action: SETTLE}"
        actor: ShopClerk
        preconditions: []
        side_effects:
          - "points_final via loyalty_points_accrual variant=final (adds seasonal bonus if logical-clock month in PEAK_MONTHS; subtracts points for refunded lines)"
          - "append loyalty_ledger entry {delta_points: (points_final - points_provisional), reason: SALE_SETTLE_ADJUST, ref_type: Sale, ref_id: this.id}; recompute balance and tier"
      - from: COMPLETED
        to: REFUNDED
        trigger: "POST /sales/{id}/transition {action: REFUND}"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "restock: increment each line's Product.stock_qty by qty; mark lines refunded"
          - "COMPENSATION: append loyalty_ledger entry {delta_points: -points_provisional, reason: SALE_REFUND, ref_type: Sale, ref_id: this.id}; recompute balance and tier (net delta for this sale returns to 0)"
          - "subtract total_cents from Customer.lifetime_spend_cents"
      - from: OPEN
        to: VOIDED
        trigger: "POST /sales/{id}/transition {action: VOID}"
        actor: ShopManager
        preconditions: []
        side_effects: ["discard sale; no ledger entries (nothing was minted)"]

  - entity: FishingLicense
    field: status
    initial_state: SCHEDULED
    terminal_states: [VOID]
    note: "SCHEDULED/ACTIVE/EXPIRED are derived from the logical clock vs valid_from/valid_to; VOID is the only explicit terminal transition."
    transitions:
      - from: [SCHEDULED, ACTIVE, EXPIRED]
        to: VOID
        trigger: "POST /licenses/{id}/void"
        actor: ShopManager
        preconditions: ["not already VOID (else ERR_INVALID_STATE)"]
        side_effects: ["is_voided = true; status becomes VOID; frees the (customer,type) duplicate slot"]

  - entity: Guide
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: SUSPENDED
        trigger: "PATCH /guides/{id} {status: SUSPENDED}"
        actor: ShopManager
        preconditions: []
        side_effects: ["existing CONFIRMED bookings remain; new CONFIRM blocked while SUSPENDED"]
      - from: SUSPENDED
        to: AVAILABLE
        trigger: "PATCH /guides/{id} {status: AVAILABLE}"
        actor: ShopManager
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: batch-delivery-stale-tank
    parent_entity: BaitTank
    write_endpoint: "POST /bait-tanks/{id}/batches"
    occ_field: "expected_bait_tank_version"
    description: |
      Delivering a new live-bait batch against a BaitTank whose version has advanced
      since the client last observed it is rejected. A batch delivery legitimately
      succeeds on identical fresh state (it is additive up to capacity), so this is a
      true create race: when another delivery has already been recorded and advanced
      the tank's version, the current writer's expected_bait_tank_version is stale and
      the delivery is rejected on the version check rather than silently double-stocking.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: charter_booking_cost
    trigger: "CharterBooking QUOTE (provisional) and COMPLETE (final)"
    algorithm: tiered_pricing
    input_set: "One CharterBooking + its Guide; season from logical clock (provisional) or start_at month (final)"
    formula: |
      components = base + extra + equipment
        base      = (trip_type == FULL_DAY) ? Guide.full_day_rate_cents : Guide.half_day_rate_cents
        extra     = max(0, party_size - CHARTER_INCLUDED_ANGLERS) * Guide.per_extra_angler_cents
        equipment = add_equipment_rental ? EQUIPMENT_RENTAL_PER_ANGLER_CENTS * party_size : 0
      # provisional (at QUOTE): season taken from LOGICAL CLOCK month
      season_mult_prov = (clock_month in PEAK_MONTHS) ? SEASONAL_SURCHARGE_MULT : 1.00
      provisional_total_cents = round(components * season_mult_prov)
      deposit_cents           = round(provisional_total_cents * DEPOSIT_PCT)
      # final (at COMPLETE): season taken from start_at month; adds fuel + tier discount
      season_mult_final = (month(start_at) in PEAK_MONTHS) ? SEASONAL_SURCHARGE_MULT : 1.00
      final_subtotal    = round(components * season_mult_final)
      tier_discount     = round(final_subtotal * TIER_DISCOUNT_PCT[holder loyalty_tier])
      final_total_cents = final_subtotal - tier_discount + Guide.fuel_surcharge_cents
    constants:
      CHARTER_INCLUDED_ANGLERS: 2
      EQUIPMENT_RENTAL_PER_ANGLER_CENTS: 2500
      SEASONAL_SURCHARGE_MULT: 1.20
      PEAK_MONTHS: [5, 6, 7, 8]
      DEPOSIT_PCT: 0.25
      TIER_DISCOUNT_PCT: { BRONZE: 0.00, SILVER: 0.05, GOLD: 0.10 }
    precision: "cents, round_half_up; multiply-then-round once per named quantity"
    variants:
      - name: provisional
        when: "at QUOTE"
        difference: "season from logical-clock month; excludes fuel surcharge and tier discount"
      - name: final
        when: "at COMPLETE"
        difference: "season from start_at month; includes Guide.fuel_surcharge_cents and holder tier discount"

  - name: loyalty_points_accrual
    trigger: "Sale COMPLETE (provisional) and Sale SETTLE (final)"
    algorithm: weighted_scoring
    input_set: "Non-refunded Sale lines + holder loyalty_tier + logical-clock month at settle"
    formula: |
      # PINNED rounding order (mode b): round EACH line's dollar-points, THEN sum,
      # THEN apply the tier multiplier and round once. (round-per-line-then-sum,
      # NOT sum-then-round.)
      per_line_points = for each non-refunded line: round(line_total_cents / 100)   # POINTS_PER_DOLLAR = 1
      base_points     = sum(per_line_points)
      # provisional (at COMPLETE)
      points_provisional = round(base_points * tier_multiplier[holder loyalty_tier])
      # final (at SETTLE): recompute base_points over still-non-refunded lines, then
      seasonal_bonus  = (clock_month in PEAK_MONTHS) ? round(base_points_at_settle * tier_multiplier[tier] * LOYALTY_SEASONAL_BONUS_PCT) : 0
      points_final    = round(base_points_at_settle * tier_multiplier[holder loyalty_tier]) + seasonal_bonus
    constants:
      POINTS_PER_DOLLAR: 1
      LOYALTY_SEASONAL_BONUS_PCT: 0.10
      PEAK_MONTHS: [5, 6, 7, 8]
      tier_multiplier: { BRONZE: 1.00, SILVER: 1.10, GOLD: 1.25 }
    precision: "integer points, round_half_up; per-line rounding precedes summation"
    variants:
      - name: provisional
        when: "at COMPLETE"
        difference: "no seasonal bonus; counts all lines present at completion"
      - name: final
        when: "at SETTLE"
        difference: "adds peak-season bonus; excludes lines refunded before settle"

  - name: tank_available_count
    trigger: "BaitTank read; recomputed on batch delivery, dispense, returns"
    algorithm: decay_function
    input_set: "All batches in BaitTank.batches + sold_count + logical clock"
    formula: |
      now = logical clock
      for each batch in batches:
        age_days   = floor((now - batch.delivered_at) / 86400 seconds)
        dead       = floor(batch.initial_count * (mortality_rate_bps_per_day / 10000) * age_days)
        survivors  = max(0, batch.initial_count - dead)
      total_survivors = sum(survivors)
      available_count = max(0, total_survivors - sold_count)
      low_stock_threshold = ceil(capacity_units * 0.10)
      status = (available_count == 0) ? EMPTY : (available_count < low_stock_threshold ? LOW : HEALTHY)
    constants:
      SECONDS_PER_DAY: 86400
      LOW_STOCK_PCT: 0.10
    precision: "integer units; floor decay per batch, sum after"

  - name: tournament_scoring
    trigger: "Tournament FINALIZE"
    algorithm: aggregation
    input_set: "All TournamentEntry where tournament_id == tournament.id (accepted weigh-ins only)"
    formula: |
      for each entry:
        accepted   = [w for w in weigh_ins if w.accepted]
        top        = accepted sorted by weight_grams desc, take first bag_limit
        bag_weight_grams = sum(w.weight_grams for w in top)
        big_fish_grams   = max(w.weight_grams for w in accepted) if accepted else 0
      ranked = entries with bag_weight_grams > 0,
               sorted by (bag_weight_grams desc,
                          created_at of the last weigh-in that entered the bag asc,   # earliest wins ties
                          entry.created_at asc)                                        # never id
      assign placement 1..N to ranked; winner_entry_id = placement==1 entry
    constants: {}
    precision: "integer grams; deterministic tie-break by created_at, never id"

  - name: special_order_refund
    trigger: "SpecialOrder CANCEL"
    algorithm: threshold
    input_set: "One SpecialOrder; branch on the state it is cancelled FROM"
    formula: |
      deposit_cents = round(unit_price_cents * quantity * SPECIAL_ORDER_DEPOSIT_PCT)
      if cancelled from REQUESTED:  refund_cents = deposit_cents           # full refund
      if cancelled from ORDERED:    restock_fee = round(deposit_cents * RESTOCK_FEE_PCT)
                                    refund_cents = deposit_cents - restock_fee
    constants:
      SPECIAL_ORDER_DEPOSIT_PCT: 0.50
      RESTOCK_FEE_PCT: 0.20
    precision: "cents, round_half_up"

  - name: sale_totals
    trigger: "Sale line add, COMPLETE, REFUND"
    algorithm: aggregation
    input_set: "Non-refunded Sale.lines"
    formula: |
      line_total_cents = unit_price_cents * qty          # snapshot unit price at add time
      subtotal_cents   = sum(line_total_cents for lines where refunded == false)
      tax_cents        = round(subtotal_cents * TAX_BPS / 10000)
      total_cents      = subtotal_cents + tax_cents
    constants:
      TAX_BPS: 800
    precision: "cents, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and valid; role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role authorized for this endpoint/action per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: validation
    check: "Request body well-formed: required fields present, enums/types/ranges valid, quantities > 0 where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all mutating endpoints

  - priority: 4
    category: existence
    check: "Path resource and all referenced FK ids exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints with path ids or FK inputs

  - priority: 5
    category: state
    check: "OCC: expected_bait_tank_version equals BaitTank.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /bait-tanks/{id}/batches"

  - priority: 6
    category: state
    check: "Target resource in a valid state for the requested transition/action"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition/action endpoints

  - priority: 7
    category: business_safety
    check: "License compliance: holder age >= MIN_AGE[license_type] where MIN_AGE = { RESIDENT_ANNUAL: 16, NONRESIDENT_ANNUAL: 16, ONE_DAY: 16, SENIOR: 65 } (age in whole years from holder Customer.birth_date vs logical clock); RESIDENT_ANNUAL/SENIOR state_code must equal holder Customer.state_code"
    error_id: ERR_LICENSE_AGE_RESTRICTION
    http_status: 422
    applies_to: "POST /licenses"
    note: "Age failure -> ERR_LICENSE_AGE_RESTRICTION; state failure -> ERR_LICENSE_STATE_MISMATCH; both are business_safety and both precede referential (priority 8)."

  - priority: 8
    category: business_referential
    check: "Uniqueness: no existing ACTIVE FishingLicense with same (customer_id, license_type); no duplicate TournamentEntry for (tournament_id, customer_id)"
    error_id: ERR_DUPLICATE_LICENSE
    http_status: 409
    applies_to: "POST /licenses, POST /tournaments/{id}/entries"

  - priority: 9
    category: business_temporal
    check: "Temporal windows: guide occupancy (buffered overlap), venue occupancy (adjacency-allowed overlap), tournament registration window (now < registration_close_at)"
    error_id: ERR_GUIDE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /charter-bookings/{id}/transition (CONFIRM), POST /tournaments, POST /tournaments/{id}/entries"

  - priority: 10
    category: business_constraint
    check: "Capacity/quota: tank delivery within capacity, dispense within available, sale line within stock, party within guide max, tournament within max_entries, product active/eligible"
    error_id: ERR_TANK_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /bait-tanks/{id}/batches, POST /bait-tanks/{id}/dispense, POST /sales/{id}/transition, POST /charter-bookings/{id}/transition, POST /tournaments/{id}/entries, special-orders"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time. All deadline/decay/license/season rules read this clock."
    roles: [ShopManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

  # --- Customers ---
  - method: POST
    path: "/customers"
    description: "Register a customer"
    roles: [ShopClerk, ShopManager]
    code: 201
    input: [name, email, state_code, birth_date]
    output: Customer
    side_effects: ["loyalty_ledger=[], loyalty_points_balance=0, loyalty_tier=BRONZE, lifetime_spend_cents=0"]
  - method: GET
    path: "/customers/{id}"
    description: "Get a customer (includes loyalty_ledger, balance, tier)"
    roles: [Customer, ShopClerk, Guide, TournamentDirector, ShopManager]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers"
    description: "List customers (paginated)"
    roles: [ShopClerk, ShopManager]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []
  - method: GET
    path: "/customers/{id}/licenses"
    description: "List a customer's fishing licenses (reverse-reachability for FishingLicense.customer_id)"
    roles: [Customer, ShopClerk, ShopManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FishingLicense[]
    side_effects: []
  - method: GET
    path: "/customers/{id}/service-orders"
    description: "List a customer's service orders (reverse-reachability for ServiceOrder.customer_id)"
    roles: [Customer, ShopClerk, ShopManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ServiceOrder[]
    side_effects: []
  - method: GET
    path: "/customers/{id}/sales"
    description: "List a customer's sales (reverse-reachability for Sale.customer_id)"
    roles: [Customer, ShopClerk, ShopManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Sale[]
    side_effects: []

  # --- Products ---
  - method: POST
    path: "/products"
    description: "Create a product SKU"
    roles: [ShopManager]
    code: 201
    input: [sku, name, category, unit_price_cents, stock_qty, "is_active?", "is_special_order_eligible?"]
    output: Product
    side_effects: []
  - method: GET
    path: "/products/{id}"
    description: "Get a product"
    roles: [Customer, ShopClerk, Guide, TournamentDirector, ShopManager]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: GET
    path: "/products"
    description: "List products (paginated, filterable by category/active)"
    roles: [Customer, ShopClerk, Guide, TournamentDirector, ShopManager]
    code: 200
    input: ["category?", "is_active?", "limit?", "offset?"]
    output: Product[]
    side_effects: []
  - method: PATCH
    path: "/products/{id}"
    description: "Update product price/stock/active flag"
    roles: [ShopManager]
    code: 200
    input: ["unit_price_cents?", "stock_qty?", "is_active?"]
    output: Product
    side_effects: ["updated_at refreshed; version incremented"]

  # --- Fishing licenses ---
  - method: POST
    path: "/licenses"
    description: "Issue a state fishing license (computes price, valid_to, status)"
    roles: [ShopClerk, ShopManager]
    code: 201
    input: [customer_id, license_type, state_code, valid_from]
    output: FishingLicense
    side_effects: ["price_cents and valid_to computed; status derived from clock; issued_by_user_id = acting user"]
  - method: GET
    path: "/licenses/{id}"
    description: "Get a license"
    roles: [Customer, ShopClerk, ShopManager]
    code: 200
    input: []
    output: FishingLicense
    side_effects: []
  - method: POST
    path: "/licenses/{id}/void"
    description: "Void a license"
    roles: [ShopManager]
    code: 200
    input: []
    output: FishingLicense
    side_effects: ["is_voided=true; status=VOID; frees duplicate (customer,type) slot"]

  # --- Bait tanks ---
  - method: POST
    path: "/bait-tanks"
    description: "Create a live-bait tank"
    roles: [ShopManager]
    code: 201
    input: [name, species, capacity_units, mortality_rate_bps_per_day]
    output: BaitTank
    side_effects: ["batches=[], sold_count=0, available_count=0, status=EMPTY"]
  - method: GET
    path: "/bait-tanks/{id}"
    description: "Get a tank (available_count/status recomputed vs clock)"
    roles: [Customer, ShopClerk, ShopManager]
    code: 200
    input: []
    output: BaitTank
    side_effects: []
  - method: GET
    path: "/bait-tanks"
    description: "List tanks (paginated, filterable by species)"
    roles: [Customer, ShopClerk, ShopManager]
    code: 200
    input: ["species?", "limit?", "offset?"]
    output: BaitTank[]
    side_effects: []
  - method: POST
    path: "/bait-tanks/{id}/batches"
    description: "Deliver a live-bait batch into the tank (OCC-guarded via expected_bait_tank_version)"
    roles: [ShopManager]
    code: 201
    input: [initial_count, expected_bait_tank_version, "delivered_at?"]
    output: BaitTank
    side_effects:
      - "append batch {batch_id, initial_count, delivered_at (defaults to clock), created_at}"
      - "recompute available_count/status"
      - "increments BaitTank.version by 1"
  - method: POST
    path: "/bait-tanks/{id}/dispense"
    description: "Dispense (sell) live bait from the tank"
    roles: [ShopClerk, ShopManager]
    code: 200
    input: [qty]
    output: BaitTank
    side_effects: ["sold_count += qty (requires qty <= available_count and qty > 0); recompute available_count/status"]
  - method: POST
    path: "/bait-tanks/{id}/returns"
    description: "Return previously dispensed bait (compensating action for a dispense)"
    roles: [ShopClerk, ShopManager]
    code: 200
    input: [qty]
    output: BaitTank
    side_effects: ["sold_count -= qty (clamped at 0); recompute available_count/status"]

  # --- Guides ---
  - method: POST
    path: "/guides"
    description: "Create a charter guide"
    roles: [ShopManager]
    code: 201
    input: [name, guide_license_no, half_day_rate_cents, full_day_rate_cents, per_extra_angler_cents, max_party_size, "fuel_surcharge_cents?"]
    output: Guide
    side_effects: ["status=AVAILABLE"]
  - method: GET
    path: "/guides/{id}"
    description: "Get a guide"
    roles: [Customer, ShopClerk, Guide, ShopManager]
    code: 200
    input: []
    output: Guide
    side_effects: []
  - method: GET
    path: "/guides"
    description: "List guides (paginated, filterable by status)"
    roles: [Customer, ShopClerk, Guide, ShopManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Guide[]
    side_effects: []
  - method: PATCH
    path: "/guides/{id}"
    description: "Update guide status (AVAILABLE/SUSPENDED) and/or rates"
    roles: [Guide, ShopManager]
    code: 200
    input: ["status?", "half_day_rate_cents?", "full_day_rate_cents?", "per_extra_angler_cents?", "max_party_size?", "fuel_surcharge_cents?"]
    output: Guide
    side_effects: ["version incremented"]

  # --- Venues ---
  - method: POST
    path: "/venues"
    description: "Create a fishing venue"
    roles: [ShopManager]
    code: 201
    input: [name, water_type, "daily_permit_cents?"]
    output: Venue
    side_effects: []
  - method: GET
    path: "/venues/{id}"
    description: "Get a venue"
    roles: [Customer, ShopClerk, TournamentDirector, ShopManager]
    code: 200
    input: []
    output: Venue
    side_effects: []
  - method: GET
    path: "/venues"
    description: "List venues (paginated)"
    roles: [Customer, ShopClerk, TournamentDirector, ShopManager]
    code: 200
    input: ["water_type?", "limit?", "offset?"]
    output: Venue[]
    side_effects: []

  # --- Charter bookings ---
  - method: POST
    path: "/charter-bookings"
    description: "Request a charter booking (REQUESTED)"
    roles: [Customer, ShopClerk, ShopManager]
    code: 201
    input: [customer_id, guide_id, venue_id, trip_type, party_size, start_at, end_at, "add_equipment_rental?"]
    output: CharterBooking
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/charter-bookings/{id}"
    description: "Get a charter booking"
    roles: [Customer, ShopClerk, Guide, ShopManager]
    code: 200
    input: []
    output: CharterBooking
    side_effects: []
  - method: GET
    path: "/charter-bookings"
    description: "List charter bookings (reverse-reachability for customer_id/guide_id/venue_id)"
    roles: [Customer, ShopClerk, Guide, ShopManager]
    code: 200
    input: ["customer_id?", "guide_id?", "venue_id?", "status?", "limit?", "offset?"]
    output: CharterBooking[]
    side_effects: []
  - method: POST
    path: "/charter-bookings/{id}/transition"
    description: "Drive the booking lifecycle: QUOTE | CONFIRM | RESCHEDULE | COMPLETE | CANCEL"
    roles: [Customer, ShopClerk, Guide, ShopManager]
    code: 200
    input: [action, "start_at?", "end_at?", "trip_type?", "party_size?", "cancel_reason?"]
    output: CharterBooking
    side_effects: ["per §1.2 CharterBooking transitions; COMPLETE fires the loyalty cascade"]

  # --- Tournaments ---
  - method: POST
    path: "/tournaments"
    description: "Create a tournament (SCHEDULED); rejects if venue window overlaps another non-CANCELLED tournament"
    roles: [TournamentDirector, ShopManager]
    code: 201
    input: [venue_id, name, entry_fee_cents, registration_open_at, registration_close_at, start_at, end_at, max_entries, prize_points, "bag_limit?"]
    output: Tournament
    side_effects: ["status=SCHEDULED; venue-overlap check on [start_at,end_at)"]
  - method: GET
    path: "/tournaments/{id}"
    description: "Get a tournament"
    roles: [Customer, ShopClerk, TournamentDirector, ShopManager]
    code: 200
    input: []
    output: Tournament
    side_effects: []
  - method: GET
    path: "/tournaments"
    description: "List tournaments (reverse-reachability for venue_id)"
    roles: [Customer, ShopClerk, TournamentDirector, ShopManager]
    code: 200
    input: ["venue_id?", "status?", "limit?", "offset?"]
    output: Tournament[]
    side_effects: []
  - method: POST
    path: "/tournaments/{id}/transition"
    description: "Drive the tournament lifecycle: OPEN | START | FINALIZE | CANCEL"
    roles: [TournamentDirector, ShopManager]
    code: 200
    input: [action]
    output: Tournament
    side_effects: ["per §1.2 Tournament transitions; FINALIZE fires scoring + prize cascade"]
  - method: POST
    path: "/tournaments/{id}/entries"
    description: "Register a customer into a tournament"
    roles: [Customer, ShopClerk, ShopManager]
    code: 201
    input: [customer_id]
    output: TournamentEntry
    side_effects: ["status=REGISTERED; entry_fee_paid_cents snapshot; entry_count++"]

  # --- Tournament entries ---
  - method: GET
    path: "/tournament-entries/{id}"
    description: "Get a tournament entry (includes weigh_ins, bag_weight_grams, placement)"
    roles: [Customer, ShopClerk, TournamentDirector, ShopManager]
    code: 200
    input: []
    output: TournamentEntry
    side_effects: []
  - method: GET
    path: "/tournament-entries"
    description: "List entries (reverse-reachability for tournament_id/customer_id)"
    roles: [Customer, ShopClerk, TournamentDirector, ShopManager]
    code: 200
    input: ["tournament_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: TournamentEntry[]
    side_effects: []
  - method: POST
    path: "/tournament-entries/{id}/weigh-ins"
    description: "Record a weigh-in against an entry (parent tournament must be IN_PROGRESS)"
    roles: [TournamentDirector, ShopManager]
    code: 201
    input: [species, weight_grams]
    output: TournamentEntry
    side_effects: ["append weigh_in; status REGISTERED->WEIGHED; recompute bag_weight_grams, big_fish_grams"]

  # --- Service orders ---
  - method: POST
    path: "/service-orders"
    description: "Intake a rod/reel service order (RECEIVED)"
    roles: [ShopClerk, ShopManager]
    code: 201
    input: [customer_id, item_description, service_type, quoted_cents, "line_length_yards?"]
    output: ServiceOrder
    side_effects: ["status=RECEIVED"]
  - method: GET
    path: "/service-orders/{id}"
    description: "Get a service order"
    roles: [Customer, ShopClerk, ShopManager]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: []
  - method: POST
    path: "/service-orders/{id}/transition"
    description: "Drive the service lifecycle: START | AWAIT_PARTS | RESUME | READY | PICKUP | CANCEL"
    roles: [ShopClerk, ShopManager]
    code: 200
    input: [action]
    output: ServiceOrder
    side_effects: ["per §1.2 ServiceOrder transitions; PICKUP mints service loyalty points"]

  # --- Special orders ---
  - method: POST
    path: "/special-orders"
    description: "Request a special order (REQUESTED); product must be active and special-order eligible"
    roles: [Customer, ShopClerk, ShopManager]
    code: 201
    input: [customer_id, product_id, quantity]
    output: SpecialOrder
    side_effects: ["unit_price_cents snapshot; deposit_cents computed; status=REQUESTED"]
  - method: GET
    path: "/special-orders/{id}"
    description: "Get a special order"
    roles: [Customer, ShopClerk, ShopManager]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: []
  - method: GET
    path: "/special-orders"
    description: "List special orders (reverse-reachability for customer_id/product_id)"
    roles: [Customer, ShopClerk, ShopManager]
    code: 200
    input: ["customer_id?", "product_id?", "status?", "limit?", "offset?"]
    output: SpecialOrder[]
    side_effects: []
  - method: POST
    path: "/special-orders/{id}/transition"
    description: "Drive the special-order lifecycle: ORDER | ARRIVE | FULFILL | CANCEL"
    roles: [ShopClerk, ShopManager]
    code: 200
    input: [action]
    output: SpecialOrder
    side_effects: ["per §1.2 SpecialOrder transitions; CANCEL computes refund_cents"]

  # --- Sales ---
  - method: POST
    path: "/sales"
    description: "Open a POS sale for a customer (OPEN)"
    roles: [ShopClerk, ShopManager]
    code: 201
    input: [customer_id]
    output: Sale
    side_effects: ["status=OPEN; lines=[]; clerk_user_id = acting user"]
  - method: GET
    path: "/sales/{id}"
    description: "Get a sale (includes lines and computed totals/points)"
    roles: [Customer, ShopClerk, ShopManager]
    code: 200
    input: []
    output: Sale
    side_effects: []
  - method: POST
    path: "/sales/{id}/lines"
    description: "Add a line item to an OPEN sale (snapshots product unit price)"
    roles: [ShopClerk, ShopManager]
    code: 200
    input: [product_id, qty]
    output: Sale
    side_effects: ["append line {line_id, product_id, qty, unit_price_cents snapshot, line_total_cents, refunded:false}; recompute subtotal/tax/total"]
  - method: POST
    path: "/sales/{id}/transition"
    description: "Drive the sale lifecycle: COMPLETE | SETTLE | REFUND | VOID"
    roles: [ShopClerk, ShopManager]
    code: 200
    input: [action]
    output: Sale
    side_effects: ["per §1.2 Sale transitions; COMPLETE mints provisional points, SETTLE reconciles, REFUND reverses"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID; unrecognized role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this endpoint/action" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum/type, or non-positive quantity/weight" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource or referenced FK id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_bait_tank_version does not match BaitTank.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition/action (includes re-void, re-transition)" }
  - { id: ERR_LICENSE_AGE_RESTRICTION, http: 422, condition: "Holder age (vs clock) below MIN_AGE for the license_type" }
  - { id: ERR_LICENSE_STATE_MISMATCH, http: 422, condition: "RESIDENT_ANNUAL/SENIOR license state_code != holder Customer.state_code" }
  - { id: ERR_DUPLICATE_LICENSE, http: 409, condition: "Customer already holds an ACTIVE license of the same license_type" }
  - { id: ERR_DUPLICATE_ENTRY, http: 409, condition: "Customer already registered in this tournament" }
  - { id: ERR_GUIDE_SUSPENDED, http: 409, condition: "CONFIRM attempted while Guide.status == SUSPENDED" }
  - { id: ERR_GUIDE_UNAVAILABLE, http: 409, condition: "Guide has an overlapping CONFIRMED/COMPLETED booking within CHARTER_BUFFER_MINUTES = 60" }
  - { id: ERR_VENUE_DOUBLE_BOOKED, http: 409, condition: "Tournament window [start_at,end_at) overlaps another non-CANCELLED tournament at the same venue (adjacency allowed)" }
  - { id: ERR_REGISTRATION_CLOSED, http: 409, condition: "Registration attempted with now >= registration_close_at, or tournament not REGISTRATION_OPEN" }
  - { id: ERR_TOURNAMENT_NOT_IN_PROGRESS, http: 409, condition: "Weigh-in attempted while parent Tournament.status != IN_PROGRESS" }
  - { id: ERR_TANK_CAPACITY_EXCEEDED, http: 409, condition: "Delivery would push available_count + initial_count above capacity_units" }
  - { id: ERR_INSUFFICIENT_BAIT, http: 409, condition: "Dispense qty exceeds tank available_count" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Sale line qty exceeds Product.stock_qty at COMPLETE" }
  - { id: ERR_PARTY_TOO_LARGE, http: 409, condition: "party_size exceeds Guide.max_party_size at QUOTE" }
  - { id: ERR_MAX_ENTRIES_REACHED, http: 409, condition: "Tournament already has max_entries registrations" }
  - { id: ERR_PRODUCT_INACTIVE, http: 409, condition: "Sale line or special order references an is_active==false product" }
  - { id: ERR_NOT_SPECIAL_ORDER_ELIGIBLE, http: 409, condition: "Special order references a product with is_special_order_eligible==false" }
  - { id: ERR_EMPTY_SALE, http: 409, condition: "COMPLETE attempted on a sale with no lines" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "A shop customer/angler acting on their own resources (bookings, tournament entries, special orders)."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /charter-bookings (own)"
      - "POST /charter-bookings/{id}/transition (CONFIRM/RESCHEDULE/CANCEL on own booking)"
      - "POST /tournaments/{id}/entries (register self)"
      - "POST /special-orders (own)"
      - "GET reads of own customer, bookings, entries, licenses, sales, service-orders, catalog"

  - name: ShopClerk
    description: "Front-counter staff: POS sales, license issuance, bait dispensing, service intake, charter quoting."
    identity: "opaque"
    exclusive_operations:
      - "POST /sales/{id}/lines"
      - "POST /sales/{id}/transition (COMPLETE/SETTLE)"
    shared_operations:
      - "POST /customers"
      - "POST /licenses"
      - "POST /bait-tanks/{id}/dispense"
      - "POST /bait-tanks/{id}/returns"
      - "POST /charter-bookings/{id}/transition (QUOTE)"
      - "POST /service-orders and its transitions"
      - "POST /special-orders and its transitions"

  - name: Guide
    description: "A charter guide acting on their own bookings; can complete a trip and toggle their own availability/rates."
    identity: "entity_backed:Guide"
    exclusive_operations:
      - "POST /charter-bookings/{id}/transition (COMPLETE on own booking)"
    shared_operations:
      - "PATCH /guides/{id} (own status/rates)"
      - "GET reads of own guide, own bookings"

  - name: TournamentDirector
    description: "Runs tournaments: lifecycle transitions, weigh-ins, finalization."
    identity: "opaque"
    exclusive_operations:
      - "POST /tournaments/{id}/transition (OPEN/START/FINALIZE/CANCEL)"
      - "POST /tournament-entries/{id}/weigh-ins"
    shared_operations:
      - "POST /tournaments"
      - "GET reads of tournaments, entries, venues"

  - name: ShopManager
    description: "Hierarchical override: catalog/tank/guide/venue management, batch delivery, license void, sale void/refund, and every ShopClerk/TournamentDirector operation."
    identity: "opaque"
    exclusive_operations:
      - "POST /products, PATCH /products/{id}"
      - "POST /bait-tanks, POST /bait-tanks/{id}/batches"
      - "POST /guides, POST /venues"
      - "POST /licenses/{id}/void"
      - "POST /sales/{id}/transition (REFUND/VOID)"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "superset of ShopClerk, Guide, and TournamentDirector operations"
