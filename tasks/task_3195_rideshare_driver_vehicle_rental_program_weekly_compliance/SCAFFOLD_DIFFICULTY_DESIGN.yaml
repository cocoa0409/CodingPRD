              as: ComplianceOfficer
            - call: "POST /program/vehicles"
              payload: { vin: "1HGCM82633A004352", model_name: "Civic", model_year: 2022, vehicle_class: "STANDARD", odometer_miles: 40000, region_code: "CA" }
              as: FleetOpsAgent
