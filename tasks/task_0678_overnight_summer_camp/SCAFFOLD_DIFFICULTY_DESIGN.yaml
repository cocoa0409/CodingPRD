# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Overnight / Sleepaway Summer Camp (Expert)
# 9 rule_ids x 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1–§1.7. setup_api_calls drive empty-DB -> precondition state.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimated_vs_settled_balance_with_pending_aid
        grounds:
          - calculations.estimated_balance
          - calculations.settled_balance
          - entities.Application.fields.estimated_balance_cents
          - entities.Application.fields.settled_balance_cents
        distinguishing_aspect: |
          On the Application entity the forward-looking estimated_balance counts a
          still-REQUESTED aid award (245000) while the chronological settled_balance
          counts only APPROVED aid (345000); the two diverge by exactly the pending
          award amount (100000).
        test_recipe:
          setup:
            - "Camp (deposit_cents=25000); Session starts 2026-07-01 with >=1 eligible cabin; clock at 2026-04-01 so submit lands in the early-bird tier -> list_tuition_cents=370000."
            - "Application SUBMITTED then OFFERED, deposit 25000 paid (DEPOSIT_SETTLED). A FinancialAidAward of 100000 is REQUESTED but NOT approved."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /camps"
              payload: { name: "Pinewood", deposit_cents: 25000, counselor_camper_ratio: 6 }
              as: CampDirector
              captures: { camp_id: $.data.id }
            - call: "POST /camps/${camp_id}/sessions"
              payload: { name: "Session A", starts_on: "2026-07-01T00:00:00Z", ends_on: "2026-07-14T00:00:00Z", visiting_day_on: "2026-07-07T00:00:00Z", capacity: 10 }
              as: CampDirector
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /sessions/${sess_id}/cabins"
              payload: { name: "Birch", gender_band: "BOYS", min_age: 8, max_age: 12, bunk_capacity: 6 }
              as: CampDirector
            - call: "POST /sessions/${sess_id}/open-enrollment"
              payload: { expected_session_version: "${sess_v0}" }
              as: CampDirector
              captures: { sess_v1: $.data.version }
            - call: "POST /guardians/register"
              payload: { email: "g1@x.com", full_name: "Guardian One", phone: "555-1000" }
              as: Anonymous
              captures: { g1_id: $.data.id }
            - call: "POST /campers"
              payload: { full_name: "Camper One", age: 10, gender: "BOY" }
              as: Guardian
              as_user_id: "${g1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /health-forms"
              payload: { camper_id: "${c1_id}" }
              as: Guardian
              as_user_id: "${g1_id}"
              captures: { hf1_id: $.data.id }
            - call: "POST /health-forms/${hf1_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g1_id}"
            - call: "POST /applications"
              payload: { camper_id: "${c1_id}", session_id: "${sess_id}" }
              as: Guardian
              as_user_id: "${g1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /applications/${app1_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g1_id}"
            - call: "POST /applications/${app1_id}/pay-deposit"
              payload: { amount_cents: 25000 }
              as: Guardian
              as_user_id: "${g1_id}"
            - call: "POST /financial-aid"
              payload: { application_id: "${app1_id}", kind: "NEED_GRANT", amount_cents: 100000 }
              as: Guardian
              as_user_id: "${g1_id}"
              captures: { aid1_id: $.data.id }
          trigger:
            - call: "GET /applications/${app1_id}"
              payload: {}
              as: Guardian
              as_user_id: "${g1_id}"
              captures: { est: $.data.estimated_balance_cents, sett: $.data.settled_balance_cents }
          assert:
            - "Application.${app1_id}.list_tuition_cents == 370000"
            - "Application.${app1_id}.estimated_balance_cents == 245000"
            - "Application.${app1_id}.settled_balance_cents == 345000"
            - "Application.${app1_id}.settled_balance_cents - Application.${app1_id}.estimated_balance_cents == 100000"

      - name: cit_weight_dual_interpretation_changes_staff_weight
        grounds:
          - calculations.cabin_staff_weight
          - entities.Camp.fields.cit_counts_as_half
          - entities.Cabin.fields.staff_weight_x10
        distinguishing_aspect: |
          On the Cabin entity, the same staffing (1 COUNSELOR + 1 CIT) yields
          staff_weight_x10=15 under cit_counts_as_half=true (CIT contributes 5) but
          staff_weight_x10=20 after the director toggles cit_counts_as_half=false via
          PATCH (CIT now contributes 10); the CIT-weighting interpretation alone moves
          the weight — a different entity domain (Cabin staffing) than the Application
          balance dual-variant.
        test_recipe:
          setup:
            - "Camp with cit_counts_as_half=true, counselor_camper_ratio=6. One cabin staffed by 1 background-cleared COUNSELOR + 1 background-cleared CIT (staff_weight_x10=15)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /camps"
              payload: { name: "Maple", cit_counts_as_half: true, counselor_camper_ratio: 6, deposit_cents: 25000 }
              as: CampDirector
              captures: { camp_id: $.data.id, camp_v0: $.data.version }
            - call: "POST /camps/${camp_id}/sessions"
              payload: { name: "Session A", starts_on: "2026-07-01T00:00:00Z", ends_on: "2026-07-14T00:00:00Z", visiting_day_on: "2026-07-07T00:00:00Z", capacity: 20 }
              as: CampDirector
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /sessions/${sess_id}/cabins"
              payload: { name: "Birch", gender_band: "BOYS", min_age: 8, max_age: 12, bunk_capacity: 8 }
              as: CampDirector
              captures: { cab_id: $.data.id }
            - call: "POST /camps/${camp_id}/staff"
              payload: { full_name: "Couns A", role_kind: "COUNSELOR", is_background_cleared: true }
              as: CampDirector
              captures: { staff_c: $.data.id }
            - call: "POST /camps/${camp_id}/staff"
              payload: { full_name: "CIT B", role_kind: "CIT", is_background_cleared: true }
              as: CampDirector
              captures: { staff_cit: $.data.id }
            - call: "POST /cabin-assignments"
              payload: { cabin_id: "${cab_id}", staff_member_id: "${staff_c}" }
              as: CampDirector
            - call: "POST /cabin-assignments"
              payload: { cabin_id: "${cab_id}", staff_member_id: "${staff_cit}" }
              as: CampDirector
            - call: "GET /cabins/${cab_id}"
              payload: {}
              as: CampDirector
              captures: { weight_before: $.data.staff_weight_x10 }
          trigger:
            - call: "PATCH /camps/${camp_id}"
              payload: { cit_counts_as_half: false, expected_camp_version: "${camp_v0}" }
              as: CampDirector
            - call: "GET /cabins/${cab_id}"
              payload: {}
              as: CampDirector
              captures: { weight_after: $.data.staff_weight_x10 }
          assert:
            - "weight_before == 15   # CIT contributes 5 when cit_counts_as_half=true"
            - "Cabin.${cab_id}.staff_weight_x10 == 20   # CIT now contributes 10 after toggle to false"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: list_tuition_three_input_conditional_tier_plus_med_surcharge
        grounds:
          - calculations.list_tuition
          - entities.Application.fields.list_tuition_cents
          - entities.HealthForm.fields.daily_medication_count
          - entities.HealthForm.fields.has_life_threatening_allergy
        distinguishing_aspect: |
          Mode (a): list_tuition combines THREE inputs with non-linear interaction —
          early/base/late tier selected by days_before_start conditional branch, plus
          daily_medication_count*1500, plus a conditional +5000 epipen surcharge.
          Early tier (91 days out) with 2 meds + allergy = 370000+3000+5000 = 378000.
        test_recipe:
          setup:
            - "Clock 2026-04-01; Session starts 2026-07-01 (91 days out -> early tier 370000). Camper's HealthForm SUBMITTED with daily_medication_count=2 and has_life_threatening_allergy=true (epipen_on_file=true)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /camps"
              payload: { name: "Cedar", deposit_cents: 25000, counselor_camper_ratio: 6 }
              as: CampDirector
              captures: { camp_id: $.data.id }
            - call: "POST /camps/${camp_id}/sessions"
              payload: { name: "Session A", starts_on: "2026-07-01T00:00:00Z", ends_on: "2026-07-14T00:00:00Z", visiting_day_on: "2026-07-07T00:00:00Z", capacity: 10 }
              as: CampDirector
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /sessions/${sess_id}/cabins"
              payload: { name: "Birch", gender_band: "GIRLS", min_age: 8, max_age: 12, bunk_capacity: 6 }
              as: CampDirector
            - call: "POST /sessions/${sess_id}/open-enrollment"
              payload: { expected_session_version: "${sess_v0}" }
              as: CampDirector
            - call: "POST /guardians/register"
              payload: { email: "g2@x.com", full_name: "Guardian Two", phone: "555-2000" }
              as: Anonymous
              captures: { g2_id: $.data.id }
            - call: "POST /campers"
              payload: { full_name: "Camper Two", age: 10, gender: "GIRL" }
              as: Guardian
              as_user_id: "${g2_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /health-forms"
              payload: { camper_id: "${c2_id}", has_life_threatening_allergy: true, epipen_on_file: true, daily_medication_count: 2 }
              as: Guardian
              as_user_id: "${g2_id}"
              captures: { hf2_id: $.data.id }
            - call: "POST /health-forms/${hf2_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g2_id}"
            - call: "POST /applications"
              payload: { camper_id: "${c2_id}", session_id: "${sess_id}" }
              as: Guardian
              as_user_id: "${g2_id}"
              captures: { app2_id: $.data.id }
          trigger:
            - call: "POST /applications/${app2_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g2_id}"
              captures: { lt: $.data.list_tuition_cents }
          assert:
            - "Application.${app2_id}.list_tuition_cents == 378000"

      - name: paid_in_full_keyed_on_recomputed_settled_balance_eval_order
        grounds:
          - calculations.settled_balance
          - state_machines.Application.DEPOSIT_PAID_to_ENROLLED
          - entities.Application.fields.payment_status
          - entities.Application.fields.settled_balance_cents
        distinguishing_aspect: |
          Mode (c): the BALANCE payment writes payment_status, but PAID_IN_FULL is
          keyed on settled_balance_cents which is itself recomputed FROM that same
          payment — a circular-looking dependency. Evaluation order is pinned (apply
          payment -> recompute settled_balance -> then choose PAID_IN_FULL when it
          reaches 0), distinct from list_tuition's mode-(a) tiered formula.
        test_recipe:
          setup:
            - "Application ENROLLED with payment_status=BALANCE_DUE: list_tuition 370000, deposit 25000 paid, no aid -> settled_balance 345000 owed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /camps"
              payload: { name: "Aspen", deposit_cents: 25000, counselor_camper_ratio: 6 }
              as: CampDirector
              captures: { camp_id: $.data.id }
            - call: "POST /camps/${camp_id}/sessions"
              payload: { name: "Session A", starts_on: "2026-07-01T00:00:00Z", ends_on: "2026-07-14T00:00:00Z", visiting_day_on: "2026-07-07T00:00:00Z", capacity: 10 }
              as: CampDirector
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /sessions/${sess_id}/cabins"
              payload: { name: "Birch", gender_band: "BOYS", min_age: 8, max_age: 12, bunk_capacity: 6 }
              as: CampDirector
              captures: { cab_id: $.data.id }
            - call: "POST /camps/${camp_id}/staff"
              payload: { full_name: "Couns A", role_kind: "COUNSELOR", is_background_cleared: true }
              as: CampDirector
              captures: { staff_c: $.data.id }
            - call: "POST /cabin-assignments"
              payload: { cabin_id: "${cab_id}", staff_member_id: "${staff_c}" }
              as: CampDirector
            - call: "POST /sessions/${sess_id}/open-enrollment"
              payload: { expected_session_version: "${sess_v0}" }
              as: CampDirector
            - call: "POST /guardians/register"
              payload: { email: "g3@x.com", full_name: "Guardian Three", phone: "555-3000" }
              as: Anonymous
              captures: { g3_id: $.data.id }
            - call: "POST /campers"
              payload: { full_name: "Camper Three", age: 10, gender: "BOY" }
              as: Guardian
              as_user_id: "${g3_id}"
              captures: { c3_id: $.data.id }
            - call: "POST /health-forms"
              payload: { camper_id: "${c3_id}" }
              as: Guardian
              as_user_id: "${g3_id}"
              captures: { hf3_id: $.data.id }
            - call: "POST /health-forms/${hf3_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g3_id}"
            - call: "POST /health-forms/${hf3_id}/clear"
              payload: { review_note: "ok" }
              as: InfirmaryNurse
            - call: "POST /applications"
              payload: { camper_id: "${c3_id}", session_id: "${sess_id}" }
              as: Guardian
              as_user_id: "${g3_id}"
              captures: { app3_id: $.data.id }
            - call: "POST /applications/${app3_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g3_id}"
            - call: "POST /applications/${app3_id}/pay-deposit"
              payload: { amount_cents: 25000 }
              as: Guardian
              as_user_id: "${g3_id}"
            - call: "GET /cabins/${cab_id}"
              payload: {}
              as: CampDirector
              captures: { cab_v: $.data.version }
            - call: "POST /cabins/${cab_id}/assign-bunk"
              payload: { application_id: "${app3_id}", expected_cabin_version: "${cab_v}" }
              as: CampDirector
            - call: "POST /applications/${app3_id}/enroll"
              payload: {}
              as: CampDirector
          trigger:
            - call: "POST /applications/${app3_id}/pay-balance"
              payload: { amount_cents: 345000 }
              as: Guardian
              as_user_id: "${g3_id}"
              captures: { ps: $.data.payment_status, sb: $.data.settled_balance_cents }
          assert:
            - "Application.${app3_id}.settled_balance_cents == 0"
            - "Application.${app3_id}.payment_status == PAID_IN_FULL"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_parallel_enroll_and_payment_axes
        grounds:
          - state_machines.Application.OFFERED_to_DEPOSIT_PAID
          - entities.Application.fields.enroll_status
          - entities.Application.fields.payment_status
        distinguishing_aspect: |
          Application carries two independent state axes: paying the deposit advances
          enroll_status OFFERED->DEPOSIT_PAID AND payment_status DEPOSIT_DUE->
          DEPOSIT_SETTLED on the same row; the axes evolve on different triggers and
          are observable independently.
        test_recipe:
          setup:
            - "Application OFFERED with payment_status=DEPOSIT_DUE (submitted into a session with free capacity)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /camps"
              payload: { name: "Oak", deposit_cents: 25000 }
              as: CampDirector
              captures: { camp_id: $.data.id }
            - call: "POST /camps/${camp_id}/sessions"
              payload: { name: "Session A", starts_on: "2026-07-01T00:00:00Z", ends_on: "2026-07-14T00:00:00Z", visiting_day_on: "2026-07-07T00:00:00Z", capacity: 10 }
              as: CampDirector
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /sessions/${sess_id}/cabins"
              payload: { name: "Birch", gender_band: "BOYS", min_age: 8, max_age: 12, bunk_capacity: 6 }
              as: CampDirector
            - call: "POST /sessions/${sess_id}/open-enrollment"
              payload: { expected_session_version: "${sess_v0}" }
              as: CampDirector
            - call: "POST /guardians/register"
              payload: { email: "g4@x.com", full_name: "Guardian Four", phone: "555-4000" }
              as: Anonymous
              captures: { g4_id: $.data.id }
            - call: "POST /campers"
              payload: { full_name: "Camper Four", age: 10, gender: "BOY" }
              as: Guardian
              as_user_id: "${g4_id}"
              captures: { c4_id: $.data.id }
            - call: "POST /health-forms"
              payload: { camper_id: "${c4_id}" }
              as: Guardian
              as_user_id: "${g4_id}"
              captures: { hf4_id: $.data.id }
            - call: "POST /health-forms/${hf4_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g4_id}"
            - call: "POST /applications"
              payload: { camper_id: "${c4_id}", session_id: "${sess_id}" }
              as: Guardian
              as_user_id: "${g4_id}"
              captures: { app4_id: $.data.id }
            - call: "POST /applications/${app4_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g4_id}"
          trigger:
            - call: "POST /applications/${app4_id}/pay-deposit"
              payload: { amount_cents: 25000 }
              as: Guardian
              as_user_id: "${g4_id}"
              captures: { es: $.data.enroll_status, ps: $.data.payment_status }
          assert:
            - "Application.${app4_id}.enroll_status == DEPOSIT_PAID"
            - "Application.${app4_id}.payment_status == DEPOSIT_SETTLED"

      - name: healthform_flagged_resubmit_revision_cycle
        grounds:
          - state_machines.HealthForm.SUBMITTED_to_FLAGGED
          - state_machines.HealthForm.FLAGGED_to_SUBMITTED
          - entities.HealthForm.fields.status
          - entities.Camper.fields.health_status
        distinguishing_aspect: |
          HealthForm runs a revision cycle SUBMITTED->FLAGGED->SUBMITTED on a
          DIFFERENT entity than Application; resubmitting a flagged form returns its
          status to SUBMITTED and the camper's health_status to PENDING.
        test_recipe:
          setup:
            - "HealthForm SUBMITTED then FLAGGED by the nurse (camper health_status=FLAGGED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /camps"
              payload: { name: "Willow" }
              as: CampDirector
              captures: { camp_id: $.data.id }
            - call: "POST /guardians/register"
              payload: { email: "g5@x.com", full_name: "Guardian Five", phone: "555-5000" }
              as: Anonymous
              captures: { g5_id: $.data.id }
            - call: "POST /campers"
              payload: { full_name: "Camper Five", age: 9, gender: "GIRL" }
              as: Guardian
              as_user_id: "${g5_id}"
              captures: { c5_id: $.data.id }
            - call: "POST /health-forms"
              payload: { camper_id: "${c5_id}" }
              as: Guardian
              as_user_id: "${g5_id}"
              captures: { hf5_id: $.data.id }
            - call: "POST /health-forms/${hf5_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g5_id}"
            - call: "POST /health-forms/${hf5_id}/flag"
              payload: { review_note: "missing immunization record" }
              as: InfirmaryNurse
          trigger:
            - call: "POST /health-forms/${hf5_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g5_id}"
              captures: { st: $.data.status }
          assert:
            - "HealthForm.${hf5_id}.status == SUBMITTED"
            - "Camper.${c5_id}.health_status == PENDING"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: withdraw_enrolled_cascades_occupancy_staffable_posture_depth3
        grounds:
          - state_machines.Application.ENROLLED_to_WITHDRAWN
          - calculations.cabin_is_staffable
          - calculations.session_ratio_posture
          - entities.Cabin.fields.occupied_bunks
          - entities.Session.fields.ratio_posture
        distinguishing_aspect: |
          Depth-3 cascade from withdraw(ENROLLED): (1) withdraw decrements
          Cabin.occupied_bunks, which (2) forces is_staffable recompute on that cabin,
          which (3) forces Session.ratio_posture recompute. Each hop is caused by the
          prior hop, not directly by the withdraw call.
        test_recipe:
          setup:
            - "One ENROLLED camper in a cabin staffed by exactly 1 COUNSELOR (occupied_bunks=1, staff_weight_x10=10, is_staffable=true, Session.ratio_posture=STAFFED). Session still ENROLLING (not RUNNING) so an ENROLLED withdraw is permitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /camps"
              payload: { name: "Fir", deposit_cents: 25000, counselor_camper_ratio: 6 }
              as: CampDirector
              captures: { camp_id: $.data.id }
            - call: "POST /camps/${camp_id}/sessions"
              payload: { name: "Session A", starts_on: "2026-07-01T00:00:00Z", ends_on: "2026-07-14T00:00:00Z", visiting_day_on: "2026-07-07T00:00:00Z", capacity: 10 }
              as: CampDirector
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /sessions/${sess_id}/cabins"
              payload: { name: "Birch", gender_band: "BOYS", min_age: 8, max_age: 12, bunk_capacity: 6 }
              as: CampDirector
              captures: { cab_id: $.data.id }
            - call: "POST /camps/${camp_id}/staff"
              payload: { full_name: "Couns A", role_kind: "COUNSELOR", is_background_cleared: true }
              as: CampDirector
              captures: { staff_c: $.data.id }
            - call: "POST /cabin-assignments"
              payload: { cabin_id: "${cab_id}", staff_member_id: "${staff_c}" }
              as: CampDirector
            - call: "POST /sessions/${sess_id}/open-enrollment"
              payload: { expected_session_version: "${sess_v0}" }
              as: CampDirector
            - call: "POST /guardians/register"
              payload: { email: "g6@x.com", full_name: "Guardian Six", phone: "555-6000" }
              as: Anonymous
              captures: { g6_id: $.data.id }
            - call: "POST /campers"
              payload: { full_name: "Camper Six", age: 10, gender: "BOY" }
              as: Guardian
              as_user_id: "${g6_id}"
