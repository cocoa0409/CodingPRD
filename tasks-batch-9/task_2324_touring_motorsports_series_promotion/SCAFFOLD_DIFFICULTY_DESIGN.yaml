      - name: adding_a_ticket_tier_decertifies_the_safety_plan_and_halts_sales
        grounds:
          - state_machines.SafetyPlan.CERTIFIED_to_RETURNED
          - state_machines.TourStop.SAFETY_CERTIFIED_to_SAFETY_DRAFT
          - state_machines.TourStop.ON_SALE_to_SALES_HALTED
          - calculations.required_safety_provisioning
          - entities.TourStop.fields.expected_attendance
        distinguishing_aspect: |
          CASCADE B, a different trigger with a different propagation path than CASCADE A: a pure
          inventory write (creating a pricing tier) raises expected_attendance, which raises a medical
          staffing REQUIREMENT above what the already-CERTIFIED plan provisioned, which auto-returns
          the plan, which downgrades the stop's safety dimension, which downgrades readiness_posture,
          which halts the sales dimension, which voids reserved inventory. The chain crosses a
          money/inventory aggregate into a life-safety aggregate and back, and no error is returned
          at all: the tier creation succeeds with 201.
