  - rule_id: cross_entity_state_dependency
    instances:
      - name: batch_claim_requires_active_shopper
        grounds:
          - state_machines.Batch.OFFERED_to_CLAIMED
          - state_machines.Shopper.ACTIVE_to_SUSPENDED_REVIEW
          - validations[priority=12]
          - errors.ERR_SHOPPER_SUSPENDED
        distinguishing_aspect: |
          Entity pair Batch x Shopper: whether Batch OFFERED -> CLAIMED is legal depends on a
          field of a *different* entity (Shopper.status), and a standing offer that was legal a
          moment earlier becomes unclaimable the instant the offeree is suspended by an
          abandonment on an unrelated batch, without the offer itself changing at all.
        test_recipe:
          setup:
            - "Retailer R1 (markup 0.15) with item I1 EACH in_store 400 (catalog 460)."
            - "Customer C1; a single Shopper S6 in SF-06 with vehicle_capacity_units 10 whose abandonment_count is pre-seeded to 1 (one short of ABANDONMENT_SUSPENSION_THRESHOLD 2)."
            - "Orders OS1 (deadline 11:00) and OS2 (deadline 15:00), each one line of I1 x1."
            - "Batch BS1 (window 08:00-11:00) holds OS1 and Batch BS2 (window 13:00-15:00) holds OS2; BOTH are dispatched to S6 while S6 is still ACTIVE, then S6 claims only BS1. BS2 therefore sits OFFERED to S6."
            - "S6 then abandons BS1, which pushes abandonment_count to 2 and cascades S6 into SUSPENDED_REVIEW; the cascade releases only CLAIMED/SHOPPING/CHECKED_OUT batches, so the OFFERED BS2 is untouched."
