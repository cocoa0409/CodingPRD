        distinguishing_aspect: "The same onward-leg filing must be refused with ERR_PREDECESSOR_NOT_ARRIVED (409) while M1 is only IN_TRANSIT and must succeed once M1 has reported ARRIVAL — the validity of the write depends purely on the other movement's state."
