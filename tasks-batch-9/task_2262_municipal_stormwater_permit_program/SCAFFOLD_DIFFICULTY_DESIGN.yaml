  - rule_id: resource_temporal_overlap
    instances:

      - name: screening_interval_is_a_symmetric_fourteen_day_buffer_around_each_observation
        grounds:
          - validations[priority=80]
          - entities.Outfall.fields.last_screened_at
          - entities.OutfallObservation.fields.observed_at
          - errors.ERR_SCREENING_INTERVAL_VIOLATION
        distinguishing_aspect: |
          Resource: the Outfall as a screening slot. Interval semantics: a point event carrying a
          symmetric +/-14 day exclusion buffer, so the check is a distance test in BOTH directions
          rather than an interval overlap. Exactly 14 days is allowed, 13 days 23 hours is not, and
          a back-dated observation inside an existing buffer is rejected even though it is earlier
          than everything already stored.
        test_recipe:
          setup:
            - "logical clock advanced to 2026-09-01T00:00:00Z so every observed_at below is in the past"
            - "ACTIVE permit term with all six control measures and outfall OF-01"
            - "one CLEAR dry-weather screening at 2026-08-01T08:00:00Z with dry_weather_flow_present false, so no case is opened"
