            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_ce14_id}", case_number: "CASE-10101", procedure_name: "Anterior Cervical Discectomy and Fusion", scheduled_start_utc: "2026-09-28T10:00:00Z", scheduled_end_utc: "2026-09-28T14:00:00Z", implant_required: true }
