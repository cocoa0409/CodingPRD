              payload: { classification_code: "ELEC-INSIDE-JW", trade_code: "ELEC", zone_code: "BASE", base_hourly_rate_cents: 5000, fringe_hourly_rate_cents: 2000, zone_adjustment_cents: 0, apprentice_scale_pct: [50, 60, 70, 80] }
              as: PortalAdmin
            - call: "POST /wage-determinations/${wd_a_id}/activate"
              payload: {}
              as: PortalAdmin
            - call: "POST /wage-determinations"
              payload: { decision_number: "CA20260015", modification_number: 0, locality_code: "CA-ALAMEDA", effective_date: "2026-06-01T00:00:00.000Z" }
              as: PortalAdmin
              captures: { wd_b_id: $.data.id }
            - call: "POST /wage-determinations/${wd_b_id}/wage-rates"
              payload: { classification_code: "ELEC-INSIDE-JW", trade_code: "ELEC", zone_code: "BASE", base_hourly_rate_cents: 5200, fringe_hourly_rate_cents: 2100, zone_adjustment_cents: 0, apprentice_scale_pct: [50, 60, 70, 80] }
              as: PortalAdmin
            - call: "POST /wage-determinations/${wd_b_id}/activate"
              payload: {}
              as: PortalAdmin
            - call: "POST /wage-determinations"
              payload: { decision_number: "CA20260016", modification_number: 0, locality_code: "CA-ALAMEDA", effective_date: "2026-05-15T00:00:00.000Z", expiry_date: "2026-05-20T00:00:00.000Z" }
              as: PortalAdmin
              captures: { wd_c_id: $.data.id }
            - call: "POST /wage-determinations/${wd_c_id}/wage-rates"
              payload: { classification_code: "ELEC-INSIDE-JW", trade_code: "ELEC", zone_code: "BASE", base_hourly_rate_cents: 5100, fringe_hourly_rate_cents: 2050, zone_adjustment_cents: 0, apprentice_scale_pct: [50, 60, 70, 80] }
              as: PortalAdmin
          trigger:
            - call: "POST /wage-determinations/${wd_c_id}/activate"
              payload: {}
              as: PortalAdmin
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DETERMINATION_PERIOD_OVERLAP"
