              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REPRESENTMENT_ALREADY_OPEN (OCC passed with the fresh version; the open-packet constraint fires)"

      - name: invalid_enum_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - "errors[ERR_INVALID_ENUM]"
        distinguishing_aspect: "An evidence_type outside the declared nine-member enum fails ERR_INVALID_ENUM (400) at payload validation."
        test_recipe:
          setup: ["notified chargeback"]
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
