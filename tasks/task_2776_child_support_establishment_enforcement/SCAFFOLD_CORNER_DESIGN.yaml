            - "${iwo_total} == 2 and ${off_total} == 1"
            - "${c_score} == 46 and ${c_tier} == MEDIUM  # not HIGH, so the compromise gate at the business band never fires and the only refusal in this chain is the 412"

      - name: arrears_bump_flips_the_federal_cap_at_exactly_three_months_of_support
        claim_type: rate_threshold_triggers
        grounds:
          - "complexity_profile.complexity_layers[rate_threshold_triggers]"
          - "calculations.withholding_amount"
          - "calculations.withholding_amount.constants.ARREARS_BUMP_MONTHS"
          - "calculations.withholding_amount.constants.ARREARS_12_WEEK_BUMP_PCT"
          - "entities.IncomeWithholdingOrder.fields.federal_cap_pct"
          - "entities.IncomeWithholdingOrder.fields.ccpa_cap_pct"
          - "endpoints[POST /child-support/withholding-orders/{iwo_id}/amendment]"
        distinguishing_aspect: >
          Two obligors are identical in every input to the withholding formula -
          same monthly obligation 75000, same reported disposable income 140000,
          same MN employer, same zero fee - and differ only by one cent of arrears
          across the ARREARS_BUMP_MONTHS boundary: 225000 == 3 * 75000 takes the
          bump and 224999 does not, which moves the withheld figure by 6000 cents.
          The employer state is MN (a null statutory cap) precisely so the min()
          against a state percentage cannot mask the federal rate, and the
          disposable income is chosen so the cap binds under 0.60 but not under
          0.65. The threshold is then shown to be re-evaluated on amendment rather
          than frozen at issuance: one more cent of arrears plus a one-cent change
          of disposable income lifts the under-threshold IWO to the bumped figure,
          and floor(140001 * 0.60) is still 84000, so the cent of income cannot be
          what moved it.
