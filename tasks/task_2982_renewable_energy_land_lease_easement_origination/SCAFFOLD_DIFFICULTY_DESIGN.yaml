            - call: "POST /land-origination/parcels/${p_at_id}/rescreen"
              payload: { screen_mode: "FIELD_VERIFIED" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { score_clean: "$.data.screening_score" }
            - call: "POST /land-origination/title-curative-items"
              payload: { parcel_id: "${p_at_id}", item_type: "MINERAL_SEVERANCE", severity: "BLOCKING", curative_cost_cents: 450000 }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { ti_a_id: "$.data.id", ti_a_status0: "$.data.status" }
            - call: "POST /land-origination/title-curative-items"
