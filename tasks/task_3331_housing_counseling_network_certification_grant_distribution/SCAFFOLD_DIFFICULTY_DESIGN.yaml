              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: NetworkDirector
            - call: "POST /housing-network/grant-cycles"
              payload: { fiscal_year: 2027, formula_pool_cents: 1000000, competitive_pool_cents: 0 }
              as: GrantOfficer
