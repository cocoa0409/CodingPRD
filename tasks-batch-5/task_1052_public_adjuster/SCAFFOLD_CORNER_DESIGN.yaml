# =============================================================================
# 1.9 Scaffold Corner Design (breadth probe over §1.1–§1.7 claims not covered
# by §1.8). Sections and claim_types come from references/claim-extraction-guide.md.
# All setup_api_calls drive from empty-DB; logical clock defaults to 2026-07-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------------ Entities
  - section: entities
    instances:
      - name: adjuster_create_returns_201_with_active_status
        claim_type: Creation
        grounds: [entities.Adjuster, endpoints]
        distinguishing_aspect: "POST /v1/adjusters with all required fields returns 201, a server-minted id, and status ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
          assert:
            - "Adjuster.${adj}.status == ACTIVE"
            - "Adjuster.${adj}.full_name == Ada PA"

      - name: claim_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Claim, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /v1/claims/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/claims/00000000-0000-0000-0000-000000000000", payload: {}, as: FirmPrincipal, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: policy_create_initializes_remaining_limit_to_coverage
        claim_type: Computed Fields
        grounds: [entities.Policy.fields.remaining_limit_cents, entities.Policy.fields.committed_cents]
        distinguishing_aspect: "On create, Policy.remaining_limit_cents equals coverage_limit_cents and committed_cents is 0."
        test_recipe:
          setup: ["A client exists."]
          setup_api_calls:
            - { call: "POST /v1/clients", payload: { full_name: "Cy Client", email: "cy@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cli: $.data.id } }
          trigger:
            - { call: "POST /v1/policies", payload: { client_id: "${cli}", carrier_name: "Acme", policy_number: "P1", policy_type: "HO3", coverage_limit_cents: 100000000, deductible_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal, captures: { pol: $.data.id } }
          assert:
            - "Policy.${pol}.committed_cents == 0"
            - "Policy.${pol}.remaining_limit_cents == 100000000"

      - name: contract_create_defaults_prior_advance_to_zero
        claim_type: Defaults
        grounds: [entities.Contract.fields.prior_advance_cents]
        distinguishing_aspect: "Omitting prior_advance_cents on contract create yields the default 0."
        test_recipe:
          setup: ["A client and adjuster exist."]
          setup_api_calls:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
            - { call: "POST /v1/clients", payload: { full_name: "Cy Client", email: "cy@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cli: $.data.id } }
          trigger:
            - { call: "POST /v1/contracts", payload: { client_id: "${cli}", adjuster_id: "${adj}", loss_state_code: "TX", fee_pct: 0.10, statutory_cap_pct: 0.10 }, as: FirmPrincipal, captures: { con: $.data.id } }
          assert:
            - "Contract.${con}.prior_advance_cents == 0"

      - name: claim_create_missing_peril_type_rejected
        claim_type: Required Fields
        grounds: [entities.Claim.fields.peril_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /v1/claims missing the required peril_type field is rejected with ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A policy and active contract exist."]
          setup_api_calls:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
            - { call: "POST /v1/clients", payload: { full_name: "Cy Client", email: "cy@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cli: $.data.id } }
            - { call: "POST /v1/policies", payload: { client_id: "${cli}", carrier_name: "Acme", policy_number: "P1", policy_type: "HO3", coverage_limit_cents: 100000000, deductible_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal, captures: { pol: $.data.id } }
            - { call: "POST /v1/contracts", payload: { client_id: "${cli}", adjuster_id: "${adj}", loss_state_code: "TX", fee_pct: 0.10, statutory_cap_pct: 0.10 }, as: FirmPrincipal, captures: { con: $.data.id } }
          trigger:
            - { call: "POST /v1/claims", payload: { policy_id: "${pol}", contract_id: "${con}", date_of_loss: "2026-06-15T00:00:00Z", loss_state_code: "TX", pa_rcv_estimate_cents: 10000000, depreciation_pct: 0.20 }, as: PublicAdjuster, as_user_id: "${adj}", captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "HTTP status == 422"

  # ------------------------------------------------------------- State machines
  - section: state_machines
    instances:
      - name: claim_file_from_settled_is_invalid_transition
        claim_type: Invalid Transitions
        grounds: [state_machines.Claim.DRAFT_to_FILED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling file on a SETTLED claim (no DRAFT->FILED available) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A claim settled at 8000000."]
          setup_api_calls:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
            - { call: "POST /v1/licenses", payload: { adjuster_id: "${adj}", state_code: "TX", license_number: "TX-1", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal }
            - { call: "POST /v1/clients", payload: { full_name: "Cy Client", email: "cy@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cli: $.data.id } }
            - { call: "POST /v1/policies", payload: { client_id: "${cli}", carrier_name: "Acme", policy_number: "P1", policy_type: "HO3", coverage_limit_cents: 100000000, deductible_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal, captures: { pol: $.data.id } }
            - { call: "POST /v1/contracts", payload: { client_id: "${cli}", adjuster_id: "${adj}", loss_state_code: "TX", fee_pct: 0.10, statutory_cap_pct: 0.10 }, as: FirmPrincipal, captures: { con: $.data.id } }
            - { call: "POST /v1/contracts/${con}/sign", payload: {}, as: Client, as_user_id: "${cli}" }
            - { call: "POST /v1/contracts/${con}/activate", payload: {}, as: FirmPrincipal }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol}", contract_id: "${con}", date_of_loss: "2026-06-15T00:00:00Z", loss_state_code: "TX", peril_type: "WIND", pa_rcv_estimate_cents: 10000000, depreciation_pct: 0.20 }, as: PublicAdjuster, as_user_id: "${adj}", captures: { clm: $.data.id } }
            - { call: "POST /v1/claims/${clm}/file", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
            - { call: "POST /v1/claims/${clm}/record-offer", payload: { offer_cents: 8000000 }, as: Carrier }
            - { call: "POST /v1/claims/${clm}/accept-settlement", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
          trigger:
            - { call: "POST /v1/claims/${clm}/file", payload: {}, as: PublicAdjuster, as_user_id: "${adj}", captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: contract_activate_twice_is_invalid_transition
        claim_type: Idempotency
        grounds: [state_machines.Contract.SIGNED_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating an already-ACTIVE contract returns ERR_INVALID_STATE (transitions are not idempotent)."
        test_recipe:
          setup: ["An ACTIVE contract."]
          setup_api_calls:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
            - { call: "POST /v1/licenses", payload: { adjuster_id: "${adj}", state_code: "TX", license_number: "TX-1", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal }
            - { call: "POST /v1/clients", payload: { full_name: "Cy Client", email: "cy@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cli: $.data.id } }
            - { call: "POST /v1/contracts", payload: { client_id: "${cli}", adjuster_id: "${adj}", loss_state_code: "TX", fee_pct: 0.10, statutory_cap_pct: 0.10 }, as: FirmPrincipal, captures: { con: $.data.id } }
            - { call: "POST /v1/contracts/${con}/sign", payload: {}, as: Client, as_user_id: "${cli}" }
            - { call: "POST /v1/contracts/${con}/activate", payload: {}, as: FirmPrincipal }
          trigger:
            - { call: "POST /v1/contracts/${con}/activate", payload: {}, as: FirmPrincipal, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: appraisal_agree_branch_awards_without_umpire
        claim_type: Valid Transition
        grounds: [state_machines.Appraisal.APPRAISERS_NAMED_to_AWARDED, state_machines.Claim.IN_APPRAISAL_to_SETTLED]
        distinguishing_aspect: "When appraiser amounts are equal (7000000 == 7000000), render-award moves APPRAISERS_NAMED->AWARDED directly (agree branch, no umpire) and cascades the claim to SETTLED at 7000000."
        test_recipe:
          setup: ["A claim IN_APPRAISAL with both appraisers naming 7000000."]
          setup_api_calls:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
            - { call: "POST /v1/licenses", payload: { adjuster_id: "${adj}", state_code: "TX", license_number: "TX-1", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal }
            - { call: "POST /v1/clients", payload: { full_name: "Cy Client", email: "cy@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cli: $.data.id } }
            - { call: "POST /v1/policies", payload: { client_id: "${cli}", carrier_name: "Acme", policy_number: "P1", policy_type: "HO3", coverage_limit_cents: 100000000, deductible_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal, captures: { pol: $.data.id } }
            - { call: "POST /v1/contracts", payload: { client_id: "${cli}", adjuster_id: "${adj}", loss_state_code: "TX", fee_pct: 0.10, statutory_cap_pct: 0.10 }, as: FirmPrincipal, captures: { con: $.data.id } }
            - { call: "POST /v1/contracts/${con}/sign", payload: {}, as: Client, as_user_id: "${cli}" }
            - { call: "POST /v1/contracts/${con}/activate", payload: {}, as: FirmPrincipal }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol}", contract_id: "${con}", date_of_loss: "2026-06-15T00:00:00Z", loss_state_code: "TX", peril_type: "FIRE", pa_rcv_estimate_cents: 10000000, depreciation_pct: 0.20 }, as: PublicAdjuster, as_user_id: "${adj}", captures: { clm: $.data.id } }
            - { call: "POST /v1/claims/${clm}/file", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
            - { call: "POST /v1/claims/${clm}/record-offer", payload: { offer_cents: 6000000 }, as: Carrier }
            - { call: "POST /v1/appraisals", payload: { claim_id: "${clm}" }, as: PublicAdjuster, as_user_id: "${adj}", captures: { app: $.data.id } }
            - { call: "POST /v1/appraisals/${app}/name-appraisers", payload: { pa_appraiser_name: "Pat", pa_appraiser_amount_cents: 7000000, carrier_appraiser_name: "Casey", carrier_appraiser_amount_cents: 7000000 }, as: PublicAdjuster, as_user_id: "${adj}" }
          trigger:
            - { call: "POST /v1/appraisals/${app}/render-award", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
          assert:
            - "Appraisal.${app}.status == AWARDED"
            - "Appraisal.${app}.award_cents == 7000000"
            - "Claim.${clm}.status == SETTLED"
            - "Claim.${clm}.settlement_amount_cents == 7000000"

      - name: payment_clear_on_unsettled_claim_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Payment.RECEIVED_to_CLEARED, "errors[ERR_CLAIM_NOT_SETTLED]"]
        distinguishing_aspect: "Clearing a payment whose claim is FILED (not SETTLED/PAID) returns ERR_CLAIM_NOT_SETTLED."
        test_recipe:
          setup: ["A filed (unsettled) claim with a RECEIVED payment."]
          setup_api_calls:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
            - { call: "POST /v1/licenses", payload: { adjuster_id: "${adj}", state_code: "TX", license_number: "TX-1", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal }
            - { call: "POST /v1/clients", payload: { full_name: "Cy Client", email: "cy@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cli: $.data.id } }
            - { call: "POST /v1/policies", payload: { client_id: "${cli}", carrier_name: "Acme", policy_number: "P1", policy_type: "HO3", coverage_limit_cents: 100000000, deductible_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal, captures: { pol: $.data.id } }
            - { call: "POST /v1/contracts", payload: { client_id: "${cli}", adjuster_id: "${adj}", loss_state_code: "TX", fee_pct: 0.10, statutory_cap_pct: 0.10 }, as: FirmPrincipal, captures: { con: $.data.id } }
            - { call: "POST /v1/contracts/${con}/sign", payload: {}, as: Client, as_user_id: "${cli}" }
            - { call: "POST /v1/contracts/${con}/activate", payload: {}, as: FirmPrincipal }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol}", contract_id: "${con}", date_of_loss: "2026-06-15T00:00:00Z", loss_state_code: "TX", peril_type: "WIND", pa_rcv_estimate_cents: 10000000, depreciation_pct: 0.20 }, as: PublicAdjuster, as_user_id: "${adj}", captures: { clm: $.data.id } }
            - { call: "POST /v1/claims/${clm}/file", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
            - { call: "POST /v1/payments", payload: { claim_id: "${clm}", amount_cents: 8000000, payment_type: "INITIAL" }, as: Carrier, captures: { pay: $.data.id } }
          trigger:
            - { call: "POST /v1/payments/${pay}/clear", payload: {}, as: Carrier, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_CLAIM_NOT_SETTLED"

      - name: license_suspend_then_reinstate_cycle
        claim_type: Valid Transition
        grounds: [state_machines.License.ACTIVE_to_SUSPENDED, state_machines.License.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "A License cycles ACTIVE->SUSPENDED->ACTIVE via suspend then reinstate."
        test_recipe:
          setup: ["An ACTIVE license."]
          setup_api_calls:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
            - { call: "POST /v1/licenses", payload: { adjuster_id: "${adj}", state_code: "TX", license_number: "TX-1", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal, captures: { lic: $.data.id } }
            - { call: "POST /v1/licenses/${lic}/suspend", payload: {}, as: FirmPrincipal }
          trigger:
            - { call: "POST /v1/licenses/${lic}/reinstate", payload: {}, as: FirmPrincipal }
          assert:
            - "License.${lic}.status == ACTIVE"

      - name: disbursement_hold_then_resume_cycle
        claim_type: Valid Transition
        grounds: [state_machines.Disbursement.PENDING_to_HELD, state_machines.Disbursement.HELD_to_PENDING]
        distinguishing_aspect: "A PENDING disbursement cycles PENDING->HELD->PENDING via hold then resume."
        test_recipe:
          setup: ["A claim PAID with a PENDING disbursement."]
          setup_api_calls:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
            - { call: "POST /v1/licenses", payload: { adjuster_id: "${adj}", state_code: "TX", license_number: "TX-1", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal }
            - { call: "POST /v1/clients", payload: { full_name: "Cy Client", email: "cy@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cli: $.data.id } }
            - { call: "POST /v1/policies", payload: { client_id: "${cli}", carrier_name: "Acme", policy_number: "P1", policy_type: "HO3", coverage_limit_cents: 100000000, deductible_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal, captures: { pol: $.data.id } }
            - { call: "POST /v1/contracts", payload: { client_id: "${cli}", adjuster_id: "${adj}", loss_state_code: "TX", fee_pct: 0.10, statutory_cap_pct: 0.10 }, as: FirmPrincipal, captures: { con: $.data.id } }
            - { call: "POST /v1/contracts/${con}/sign", payload: {}, as: Client, as_user_id: "${cli}" }
            - { call: "POST /v1/contracts/${con}/activate", payload: {}, as: FirmPrincipal }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol}", contract_id: "${con}", date_of_loss: "2026-06-15T00:00:00Z", loss_state_code: "TX", peril_type: "WIND", pa_rcv_estimate_cents: 10000000, depreciation_pct: 0.20 }, as: PublicAdjuster, as_user_id: "${adj}", captures: { clm: $.data.id } }
            - { call: "POST /v1/claims/${clm}/file", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
            - { call: "POST /v1/claims/${clm}/record-offer", payload: { offer_cents: 8000000 }, as: Carrier }
            - { call: "POST /v1/claims/${clm}/accept-settlement", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
            - { call: "POST /v1/payments", payload: { claim_id: "${clm}", amount_cents: 8000000, payment_type: "INITIAL" }, as: Carrier, captures: { pay: $.data.id } }
            - { call: "POST /v1/payments/${pay}/clear", payload: {}, as: Carrier }
            - { call: "GET /v1/disbursements", payload: { claim_id: "${clm}" }, as: FirmPrincipal, captures: { dis: "$.data[0].id" } }
            - { call: "POST /v1/disbursements/${dis}/hold", payload: {}, as: FirmPrincipal }
          trigger:
            - { call: "POST /v1/disbursements/${dis}/resume", payload: {}, as: FirmPrincipal }
          assert:
            - "Disbursement.${dis}.status == PENDING"

  # -------------------------------------------------------------- Calculations
  - section: calculations
    instances:
      - name: pa_acv_estimate_computed_on_file
        claim_type: Correct Result
        grounds: [calculations.pa_acv_estimate, entities.Claim.fields.pa_acv_estimate_cents]
        distinguishing_aspect: "Filing a claim with RCV 10000000 and depreciation 0.20 computes pa_acv_estimate_cents = round_half_up(10000000*0.8) = 8000000."
        test_recipe:
          setup: ["A DRAFT claim with pa_rcv_estimate 10000000, depreciation 0.20."]
          setup_api_calls:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
            - { call: "POST /v1/licenses", payload: { adjuster_id: "${adj}", state_code: "TX", license_number: "TX-1", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal }
            - { call: "POST /v1/clients", payload: { full_name: "Cy Client", email: "cy@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cli: $.data.id } }
            - { call: "POST /v1/policies", payload: { client_id: "${cli}", carrier_name: "Acme", policy_number: "P1", policy_type: "HO3", coverage_limit_cents: 100000000, deductible_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal, captures: { pol: $.data.id } }
            - { call: "POST /v1/contracts", payload: { client_id: "${cli}", adjuster_id: "${adj}", loss_state_code: "TX", fee_pct: 0.10, statutory_cap_pct: 0.10 }, as: FirmPrincipal, captures: { con: $.data.id } }
            - { call: "POST /v1/contracts/${con}/sign", payload: {}, as: Client, as_user_id: "${cli}" }
            - { call: "POST /v1/contracts/${con}/activate", payload: {}, as: FirmPrincipal }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol}", contract_id: "${con}", date_of_loss: "2026-06-15T00:00:00Z", loss_state_code: "TX", peril_type: "WIND", pa_rcv_estimate_cents: 10000000, depreciation_pct: 0.20 }, as: PublicAdjuster, as_user_id: "${adj}", captures: { clm: $.data.id } }
          trigger:
            - { call: "POST /v1/claims/${clm}/file", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
          assert:
            - "Claim.${clm}.pa_acv_estimate_cents == 8000000"

  # ---------------------------------------------------------------- Validations
  - section: validations
    instances:
      - name: appraiser_conflict_same_name_rejected
        claim_type: Violation → Error
        grounds: [state_machines.Appraisal.INVOKED_to_APPRAISERS_NAMED, "errors[ERR_APPRAISER_CONFLICT]"]
        distinguishing_aspect: "name-appraisers with pa_appraiser_name == carrier_appraiser_name returns ERR_APPRAISER_CONFLICT."
        test_recipe:
          setup: ["A claim IN_APPRAISAL with an INVOKED appraisal."]
          setup_api_calls:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
            - { call: "POST /v1/licenses", payload: { adjuster_id: "${adj}", state_code: "TX", license_number: "TX-1", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal }
