      - name: rto_asset_relist_cooldown_closed_interval_adjacency_forbidden
        grounds:
          - validations[priority=76]
          - errors.ERR_ASSET_WINDOW_CONFLICT
          - calculations.lot_window_conflict.constants.RELIST_COOLDOWN_HOURS
          - state_machines.AuctionLot.transitions[OPEN->CLOSED_NO_SALE]
        distinguishing_aspect: |
          The shared resource here is one asset with capacity one, and the forbidden zone extends 24 hours
          *past* the prior window's end, so adjacency that the venue rule would allow is refused: a relist
          opening exactly at the old closes_at, or one second before the cooldown expires, both fail, while
          the instant the cooldown expires passes because the comparison is >=. The prior lot is CLOSED and
          therefore invisible to the venue's DRAFT/OPEN capacity rule, proving the two interval rules
          measure different things.
