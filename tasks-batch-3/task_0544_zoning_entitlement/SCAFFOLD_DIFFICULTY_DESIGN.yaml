              as: Admin
              captures: { fs_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Dan Dev", email: "dan@x.com" }
              as: Admin
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { application_type: "SUBDIVISION", parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", requested_use: "resubdivide" }
