  # ===========================================================================
  # SECTION 4 — Validations (violation -> error for every rule; satisfaction)
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_headers_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          A request lacking X-User-Role / X-User-ID headers (or with an unknown role) returns
          ERR_UNAUTHENTICATED (401) before any other check.
        test_recipe:
          setup:
            - "Empty DB; request carries no auth headers."
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { model_number: "PRD-NOAUTH", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: duplicate_serial_per_product_returns_duplicate_serial
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors[ERR_DUPLICATE_SERIAL]
          - entities.Registration.fields.serial_number
        distinguishing_aspect: |
          Registering a second unit with the same serial_number for the same product_id returns
          ERR_DUPLICATE_SERIAL (409).
        test_recipe:
          setup:
            - "Product with BASE tier; owner O1 already registered serial SN-DUP on it."
          setup_api_calls:
            - call: "POST /products"
              payload: { model_number: "PRD-V1", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "BASE", extension_months: 0, price_cents: 0, coverage_cap_cents: 20000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
            - call: "POST /owners"
              payload: { full_name: "V Owner1", email: "v1@x.com" }
              as: WarrantyAdmin
              captures: { o_id: $.data.id }
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-DUP", owner_user_id: "${o_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o_id}"
          trigger:
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-DUP", owner_user_id: "${o_id}", purchase_date: "2024-02-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_SERIAL"

      - name: extended_warranty_amount_mismatch_returns_tier_mismatch
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors[ERR_TIER_MISMATCH]
          - entities.ExtendedWarranty.fields.amount_paid_cents
