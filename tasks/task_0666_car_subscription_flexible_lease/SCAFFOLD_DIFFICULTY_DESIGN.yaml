          setup:
            - "Fleet of 2 vehicles; one ASSIGNED to a returning subscription now in RETURN_PENDING with an ASSESSED inspection (vehicle IN_INSPECTION); the other AVAILABLE. utilization 0.5 before settle (1 of 2 in_use)."
