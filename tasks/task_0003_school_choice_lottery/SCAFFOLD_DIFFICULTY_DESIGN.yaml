          trigger:
            - call: "POST /lottery/offers/${off_ov}/accept"
              payload: { expected_offer_version: "${off_ov_v}" }
              as: Guardian
              as_user_id: "${fam_ov}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE (clock == respond_by, strict < required for accept) or ERR_WINDOW_TIMING — scaffold pins ERR_INVALID_STATE because Offer.respond_by precondition lives in §1.2 transition preconditions"
            - "Response http status == 409"

  # =============================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =============================================================================
  - rule_id: compensating_invariant
    instances:
      - name: seat_conservation_total_accepted_plus_waitlisted_equals_submitted
        grounds:
          - state_machines.EnrollmentWindow.CLOSED_to_LOTTERY_RUN
          - state_machines.Application.SUBMITTED_to_ACCEPTED
          - state_machines.Application.SUBMITTED_to_WAITLISTED
          - calculations.lottery_seat_assignment
        distinguishing_aspect: |
          Conserved quantity = (count of SUBMITTED at moment of lottery_runs_at). After lottery_seat_assignment cascade, COUNT(Application.status IN {ACCEPTED, WAITLISTED} for school S in window W) MUST equal COUNT(Application.status was SUBMITTED for school S in window W at lottery time). Every submitted app must end in one of the two buckets — no drift, no loss. Conserved quantity: per-school application count.
        test_recipe:
          setup:
            - "School total_seats=2; 4 SUBMITTED applications. After lottery: 2 ACCEPTED + 2 WAITLISTED = 4 (no drift)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "D19", name: "Inv1", poverty_index_pct: 50.00 }
              as: DistrictAdmin
              captures: { d19_id: $.data.id }
            - call: "POST /lottery/schools"
              payload: { district_id: "${d19_id}", code: "S19", name: "Inv1s", school_type: "MAGNET", grade_min: 0, grade_max: 12, total_seats: 2 }
              as: DistrictAdmin
              captures: { s19_id: $.data.id }
            - call: "POST /lottery/windows"
              payload: { district_id: "${d19_id}", cycle_label: "2026-27", opens_at: "2026-01-02T00:00:00Z", closes_at: "2026-02-01T00:00:00Z", lottery_runs_at: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
              captures: { w19_id: $.data.id }
            - call: "POST /lottery/families/register"
              payload: { guardian_email: "iv1@x.com", residence_zone_code: "ZI1", residence_district_id: "${d19_id}", poverty_flag: false }
              as: Anonymous
              captures: { fam_iv1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${w19_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /lottery/students"
              payload: { family_id: "${fam_iv1}", full_name: "I1", grade_for_cycle: 1 }
              as: Guardian
              as_user_id: "${fam_iv1}"
              captures: { stu_i1: $.data.id }
            - call: "POST /lottery/students"
              payload: { family_id: "${fam_iv1}", full_name: "I2", grade_for_cycle: 2 }
              as: Guardian
              as_user_id: "${fam_iv1}"
              captures: { stu_i2: $.data.id }
            - call: "POST /lottery/students"
              payload: { family_id: "${fam_iv1}", full_name: "I3", grade_for_cycle: 3 }
              as: Guardian
              as_user_id: "${fam_iv1}"
              captures: { stu_i3: $.data.id }
            - call: "POST /lottery/students"
              payload: { family_id: "${fam_iv1}", full_name: "I4", grade_for_cycle: 4 }
              as: Guardian
              as_user_id: "${fam_iv1}"
