              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { del_early: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842PWS000002", model_code: "TRK9", trim_code: "XLT", build_date: "2026-06-21T00:00:00.000Z", msrp_cents: 5600000, sale_date: "2026-08-20T00:00:00.000Z", customer_region_code: "WEST", deal_type: "FINANCE", term_months: 60, contract_apr_bps: 199 }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { del_late: $.data.id }
            - call: "GET /incentives/programs/${prog_1}"
              payload: {}
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { v1a: $.data.version }
            - call: "POST /incentives/claims"
              payload: { delivery_id: "${del_early}", program_id: "${prog_1}", claimed_amount_cents: 120000, expected_program_version: "${v1a}" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { claim_early_1: $.data.id }
            - call: "GET /incentives/programs/${prog_1}"
              payload: {}
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { v1b: $.data.version }
            - call: "POST /incentives/claims"
              payload: { delivery_id: "${del_late}", program_id: "${prog_1}", claimed_amount_cents: 120000, expected_program_version: "${v1b}" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { claim_late_1: $.data.id }
          trigger:
            - call: "GET /incentives/programs/${prog_2}"
              payload: {}
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { v2a: $.data.version }
            - call: "POST /incentives/claims"
              payload: { delivery_id: "${del_late}", program_id: "${prog_2}", claimed_amount_cents: 168000, expected_program_version: "${v2a}" }
              as: Dealer
              as_user_id: "${dealer_id}"
            - call: "POST /incentives/claims"
              payload: { delivery_id: "${del_early}", program_id: "${prog_2}", claimed_amount_cents: 168000, expected_program_version: "${v2a}" }
              as: Dealer
              as_user_id: "${dealer_id}"
            - call: "GET /incentives/deliveries/${del_late}/eligible-programs"
              payload: {}
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { late_eligible: $.data.eligible_program_ids }
          assert:
            - "${edge_mode} == FORBIDDEN and both claims on PWS-1 (${claim_early_1}, ${claim_late_1}) were accepted, so the edge is live on both deliveries"
            - "the LATE claim on PWS-2 returns HTTP 422 with error.code == ERR_SALE_DATE_OUTSIDE_PROGRAM_WINDOW — priority 15 wins over priority 22, and also over priority 21, even though all three conditions hold"
            - "specifically it is NOT ERR_STACK_COMBINATION_FORBIDDEN and NOT ERR_NO_ELIGIBLE_PROGRAM, and the two candidate errors share HTTP 422 so the status code alone cannot distinguish them"
            - "the EARLY control claim on PWS-2 returns HTTP 422 with error.code == ERR_STACK_COMBINATION_FORBIDDEN, from the same edge row, proving priority 22 was violated and merely outranked on the LATE delivery"
            - "${late_eligible} does not contain ${prog_2}: on 2026-08-20 the half-open [2026-08-01, 2026-08-16) window excludes the sale, which is exactly why priority 15 has anything to fire on"
            - "no Claim row exists for either (delivery, PWS-2) pair after the two rejections"

  - rule_id: boundary_precision_check
    instances:
      - name: reporting_lag_boundary_is_strictly_greater_than_ten_days
        grounds:
          - calculations.back_dated_sale_detection
          - entities.RetailDelivery.fields.reporting_lag_days
          - entities.RetailDelivery.fields.back_dated_flag
          - validations.priority_16_ERR_BACK_DATED_SALE_DETECTED
          - state_machines.RetailDelivery.REPORTED_to_VALIDATED
        distinguishing_aspect: |
          Metric: reporting_lag_days against MAX_REPORT_LAG_DAYS = 10, on the endpoint pair
          POST /incentives/deliveries (which stamps the metric) and
          POST /incentives/deliveries/{id}/validate (which gates on it). Three deliveries
          reported at the SAME logical instant land on lag 10 (clean), lag 11 (back-dated) and
          lag -1 (future-dated, caught by the second arm of the OR rather than by the threshold).
        test_recipe:
          setup:
            - "Dealer D-830, ACTIVE, region EAST."
            - "The logical clock is pinned to 2026-08-21T00:00:00.000Z for all three reports, so reported_at is identical across them and sale_date is the only variable."
            - "No program or claim is needed: back_dated_sale_detection reads one delivery only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/dealers"
              payload: { dealer_code: "D-830", name: "Eastvale Motorworks", region_code: "EAST", historical_volume_units: 7, market_opportunity_bps: 0 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { dealer_id: $.data.id }
          trigger:
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842LAG000010", model_code: "MX5", trim_code: "BASE", build_date: "2026-06-01T00:00:00.000Z", msrp_cents: 3100000, sale_date: "2026-08-11T00:00:00.000Z", customer_region_code: "EAST", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { d10_id: $.data.id, d10_lag: $.data.reporting_lag_days, d10_flag: $.data.back_dated_flag, d10_reported: $.data.reported_at }
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842LAG000011", model_code: "MX5", trim_code: "BASE", build_date: "2026-06-01T00:00:00.000Z", msrp_cents: 3100000, sale_date: "2026-08-10T00:00:00.000Z", customer_region_code: "EAST", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { d11_id: $.data.id, d11_lag: $.data.reporting_lag_days, d11_flag: $.data.back_dated_flag }
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842LAG000012", model_code: "MX5", trim_code: "BASE", build_date: "2026-06-01T00:00:00.000Z", msrp_cents: 3100000, sale_date: "2026-08-22T00:00:00.000Z", customer_region_code: "EAST", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { dfut_id: $.data.id, dfut_lag: $.data.reporting_lag_days, dfut_flag: $.data.back_dated_flag }
            - call: "POST /incentives/deliveries/${d10_id}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
              captures: { d10_status: $.data.status }
            - call: "POST /incentives/deliveries/${d11_id}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
            - call: "POST /incentives/deliveries/${dfut_id}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
            - call: "GET /incentives/deliveries/${d11_id}"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
              captures: { d11_status: $.data.status, d11_validator: $.data.validated_by_user_id, d11_version: $.data.version }
          assert:
            - "${d10_reported} == 2026-08-21T00:00:00.000Z for all three rows: reported_at is the logical clock, never wall-clock time"
            - "${d10_lag} == 10 and ${d10_flag} == false — a lag of EXACTLY MAX_REPORT_LAG_DAYS is clean (the comparison is strict >)"
            - "${d11_lag} == 11 and ${d11_flag} == true — one day past the boundary flips the flag"
            - "${dfut_lag} == -1 and ${dfut_flag} == true — a future-dated sale is caught by the (sale_date > reported_at) arm, NOT by the threshold, and the lag is stored negative rather than clamped to 0"
            - "validating the lag-10 delivery returns HTTP 200 with ${d10_status} == VALIDATED"
            - "validating the lag-11 delivery returns HTTP 422 with error.code == ERR_BACK_DATED_SALE_DETECTED"
