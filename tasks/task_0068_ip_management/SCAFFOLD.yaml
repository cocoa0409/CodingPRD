scenario: |
  Intellectual property management system: patent/trademark/copyright registration with
  application material preparation, agency-handling and self-handling modes, application-status
  tracking, office-action response workflow, registration-certificate archiving, and
  multi-jurisdiction filing; annual fee monitoring with annual-fee schedule by IP type and
  jurisdiction, payment-deadline reminder rules, automatic-payment authorization, late-payment
  grace period and surcharge handling, and abandonment-confirmation workflow; transfer and
  licensing contracts with contract-template library, transfer/exclusive-license/non-exclusive-license
  type configuration, multi-party signing workflow, royalty payment schedule, contract-filing
  with authority, and contract-amendment handling; rights-protection cases with infringement-evidence
  collection, demand-letter and litigation routing, agent-lawyer assignment, case-status tracking,
  mediation/litigation/arbitration outcome recording, and damages-recovery handling; agent
  management with internal and external agent profile, qualification verification, case-assignment
  workload balancing, agent-performance rating, and fee-settlement with agents; cost statistics
  with cost categorization (application/annual-fee/litigation/agent-fee), cost allocation by IP
  and business unit, budget-vs-actual analysis, multi-currency consolidation, and periodic cost
  reporting; event-driven synchronization with payment, IP authority, and electronic-signature
  systems; audit logging for status changes and contract records.

domain_name: ip-management
api_prefix: /ip-rights

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: BusinessUnit
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Short stable identifier used in cost allocation reports"
        constraints: "unique; ^[A-Z0-9_]{2,16}$"
      - name: name
        type: string
        source: input
        description: "Human-readable business unit name"
      - name: annual_budget_cents
        type: integer
        source: input
        description: "Annual budget cap in cents, base currency USD"
        constraints: ">= 0"
      - name: actual_spend_cents
        type: integer
        source: computed
        description: "Running total of Cost.allocated_cents whose business_unit_id == this.id, base currency USD"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Lifecycle status"
        constraints: "ACTIVE | ARCHIVED"
        default: ACTIVE

  - name: Agent
    parent: null
    common_fields: true
    fields:
      - name: kind
        type: enum
        source: input
        description: "Internal employee or external firm representative"
        constraints: "INTERNAL | EXTERNAL"
      - name: full_name
        type: string
        source: input
        description: "Display name"
      - name: qualification_number
        type: string
        source: input
        description: "Bar number for lawyers / IP agent license number"
      - name: qualification_verified
        type: boolean
        source: system
        description: "True once an admin verifies qualification_number; false initially"
        default: false
      - name: jurisdictions
        type: array
        source: input
        description: "ISO-like jurisdiction codes this agent is licensed in, e.g. ['US','EP','CN']"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Quoted hourly fee in cents, base currency USD"
        constraints: ">= 0"
      - name: active_case_count
        type: integer
        source: computed
        description: "Count of ProtectionCases with assigned_agent_id == this.id AND status IN {OPEN, IN_PROGRESS}"
        default: 0
      - name: pending_action_count
        type: integer
        source: computed
        description: "Count of ApplicationOfficeActions with assigned_agent_id == this.id AND status == PENDING"
        default: 0
      - name: upcoming_deadline_count
        type: integer
        source: computed
        description: "Count of AnnualFeeSchedules where assigned_agent_id == this.id AND due_date within next 30 days AND status == PENDING"
        default: 0
      - name: workload_score
        type: number
        source: computed
        description: "Weighted-scoring composite, see calculations.agent_workload_score"
        default: 0
      - name: performance_rating
        type: number
        source: computed
        description: "0.00–5.00 rolling rating from settled cases, see calculations.agent_performance_rating"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Active/suspended state"
        constraints: "ACTIVE | SUSPENDED"
        default: ACTIVE

  - name: IPRight
    parent: null
    common_fields: true
    fields:
      - name: ip_type
        type: enum
        source: input
        description: "Class of intellectual property"
        constraints: "PATENT | TRADEMARK | COPYRIGHT"
      - name: title
        type: string
        source: input
        description: "Human-readable title"
      - name: handling_mode
        type: enum
        source: input
        description: "Who prosecutes the application"
        constraints: "AGENCY | SELF"
      - name: assigned_agent_id
        type: string
        source: input
        description: "Agent.id; required when handling_mode == AGENCY, must be null when SELF"
      - name: business_unit_id
        type: string
        source: input
        description: "BusinessUnit.id owning this right"
      - name: status
        type: enum
        source: system
        description: "Aggregate lifecycle status (see state machine)"
        constraints: "DRAFT | MATERIALS_READY | FILED | OFFICE_ACTION | REGISTERED | ABANDONED | TRANSFERRED"
        default: DRAFT
      - name: primary_jurisdiction
        type: string
        source: input
        description: "Lead jurisdiction code, e.g. 'US'"
      - name: certificate_archive_url
        type: string
        source: system
        description: "Archive URL set when status transitions to REGISTERED"
        default: null
      - name: registered_at
        type: datetime
        source: system
        description: "Timestamp when status first reached REGISTERED"
        default: null

  - name: JurisdictionFiling
    parent: IPRight
    common_fields: true
    fields:
      - name: ip_right_id
        type: string
        source: system
        description: "Parent IPRight.id (path-bound)"
      - name: jurisdiction
        type: string
        source: input
        description: "ISO-like jurisdiction code, e.g. 'US','EP','CN','JP'"
      - name: filing_number
        type: string
        source: input
        description: "Filing number issued by the IP authority"
      - name: filed_at
        type: datetime
        source: input
        description: "Local filing date"
      - name: status
        type: enum
        source: system
        description: "Per-jurisdiction status"
        constraints: "FILED | OFFICE_ACTION | REGISTERED | ABANDONED"
        default: FILED

  - name: ApplicationOfficeAction
    parent: IPRight
    common_fields: true
    fields:
      - name: ip_right_id
        type: string
        source: system
        description: "Parent IPRight.id"
      - name: jurisdiction_filing_id
        type: string
        source: input
        description: "JurisdictionFiling.id this action targets"
      - name: assigned_agent_id
        type: string
        source: input
        description: "Agent.id responsible for the response"
      - name: response_due_at
        type: datetime
        source: input
        description: "Hard deadline for response"
      - name: responded_at
        type: datetime
        source: system
        description: "Timestamp response was filed"
        default: null
      - name: status
        type: enum
        source: system
        description: "Action lifecycle"
        constraints: "PENDING | RESPONDED | CLOSED_GRANTED | CLOSED_ABANDONED"
        default: PENDING

  - name: AnnualFeeSchedule
    parent: IPRight
    common_fields: true
    fields:
      - name: ip_right_id
        type: string
        source: system
        description: "Parent IPRight.id"
      - name: jurisdiction
        type: string
        source: input
        description: "Jurisdiction code matching one of the IPRight's JurisdictionFilings"
      - name: fee_year
        type: integer
        source: input
        description: "1-based year of the fee (year 1 = first annuity)"
        constraints: ">= 1"
      - name: base_fee_cents
        type: integer
        source: input
        description: "Authority schedule fee in cents, base currency USD"
        constraints: ">= 0"
      - name: due_date
        type: datetime
        source: input
        description: "Hard payment deadline"
      - name: grace_end_date
        type: datetime
        source: computed
        description: "due_date + 180 days; later transitions to ABANDONED if still unpaid"
      - name: paid_at
        type: datetime
        source: system
        description: "Timestamp the AnnualFeePayment was confirmed; null until paid"
        default: null
      - name: total_paid_cents
        type: integer
        source: system
        description: "base_fee_cents + computed surcharge_cents at the moment of payment"
        default: 0
      - name: surcharge_cents
        type: integer
        source: computed
        description: "Late surcharge in cents, see calculations.annual_fee_surcharge"
        default: 0
      - name: auto_pay_authorized
        type: boolean
        source: input
        description: "If true, payment is auto-attempted at due_date via Payment system event"
        default: false
      - name: assigned_agent_id
        type: string
        source: input
        description: "Agent.id responsible for filing the payment"
      - name: status
        type: enum
        source: system
        description: "Fee lifecycle"
        constraints: "PENDING | PAID | LATE | ABANDONED"
        default: PENDING

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: ip_right_id
        type: string
        source: input
        description: "IPRight.id being transferred or licensed"
      - name: template_id
        type: string
        source: input
        description: "ContractTemplate.id used to draft this contract"
      - name: contract_type
        type: enum
        source: input
        description: "Transfer or license variant"
        constraints: "TRANSFER | EXCLUSIVE_LICENSE | NON_EXCLUSIVE_LICENSE"
      - name: parties
        type: array
        source: input
        description: "Ordered array of {party_id, role, signature_required:bool, signed_at:datetime|null} entries"
      - name: royalty_rate
        type: number
        source: input
        description: "Decimal rate, e.g. 0.10 for 10%; required for LICENSE types, must be null for TRANSFER"
        constraints: "0 <= royalty_rate <= 1"
      - name: min_guarantee_cents
        type: integer
        source: input
        description: "Annual minimum royalty floor for EXCLUSIVE_LICENSE; must be null for other types"
        default: null
      - name: filed_with_authority
        type: boolean
        source: system
        description: "True once authority filing is confirmed"
        default: false
      - name: status
        type: enum
        source: system
        description: "Contract lifecycle"
        constraints: "DRAFT | SIGNING | SIGNED | FILED | AMENDED | TERMINATED"
        default: DRAFT
      - name: business_unit_id
        type: string
        source: input
        description: "BusinessUnit.id paying agent and authority fees"

  - name: ContractTemplate
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: "Unique template code"
        constraints: "unique; ^[A-Z0-9_]{2,32}$"
      - name: contract_type
        type: enum
        source: input
        description: "Template specialization"
        constraints: "TRANSFER | EXCLUSIVE_LICENSE | NON_EXCLUSIVE_LICENSE"
      - name: body
        type: string
        source: input
        description: "Template prose with placeholders"

  - name: RoyaltySchedule
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: system
        description: "Parent Contract.id"
      - name: period_index
        type: integer
        source: input
        description: "1-based period index within the contract"
        constraints: ">= 1"
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive period start"
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive period end; must satisfy period_end > period_start; periods on same contract MUST NOT overlap, MUST NOT leave gaps (period_end of period N equals period_start of period N+1)"
      - name: forecast_revenue_cents
        type: integer
        source: input
        description: "Licensee forecast for the period in cents"
        constraints: ">= 0"
      - name: actual_revenue_cents
        type: integer
        source: input
        description: "Reported actual revenue for the period; settable on settlement"
        default: 0
      - name: provisional_royalty_cents
        type: integer
        source: computed
        description: "forecast_revenue_cents * Contract.royalty_rate, rounded half-up"
        default: 0
      - name: final_royalty_cents
        type: integer
        source: computed
        description: "max(actual_revenue_cents * Contract.royalty_rate, Contract.min_guarantee_cents) on settlement"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Settlement state"
        constraints: "FORECAST | SETTLED"
        default: FORECAST

  - name: ProtectionCase
    parent: null
    common_fields: true
    fields:
      - name: ip_right_id
        type: string
        source: input
        description: "IPRight.id alleged to be infringed"
      - name: assigned_agent_id
        type: string
        source: input
        description: "Agent.id (lawyer) handling the case"
      - name: business_unit_id
        type: string
        source: input
        description: "BusinessUnit.id sponsoring the case"
      - name: route
        type: enum
        source: system
        description: "Resolution route chosen"
        constraints: "DEMAND_LETTER | LITIGATION | MEDIATION | ARBITRATION | NONE"
        default: NONE
      - name: status
        type: enum
        source: system
        description: "Case lifecycle"
        constraints: "OPEN | IN_PROGRESS | RESOLVED | CLOSED"
        default: OPEN
      - name: outcome
        type: enum
        source: system
        description: "Final outcome when status == RESOLVED"
        constraints: "WON | LOST | SETTLED | DISMISSED | null"
        default: null
      - name: recovered_amount_cents
        type: integer
        source: input
        description: "Total damages awarded/agreed, in cents"
        default: 0
      - name: legal_fees_cents
        type: integer
        source: input
        description: "External legal fees deducted in waterfall"
        default: 0
      - name: agent_fees_cents
        type: integer
        source: input
        description: "Agent settlement fees deducted in waterfall"
        default: 0
      - name: punitive_cap_cents
        type: integer
        source: input
        description: "Cap on the punitive-damages bucket in the waterfall"
        default: 0
      - name: distributed
        type: object
        source: computed
        description: "Output of damages_recovery_waterfall: {legal_paid, agent_paid, punitive_paid, rights_holder_paid}"
        default: null
      - name: rights_holder_currency
        type: string
        source: input
        description: "ISO 4217 code (USD,EUR,JPY,...); recovered_amount_cents is denominated in this currency"
        default: USD

  - name: Evidence
    parent: ProtectionCase
    common_fields: false
    fields:
      - name: protection_case_id
        type: string
        source: system
        description: "Parent ProtectionCase.id"
      - name: kind
        type: enum
        source: input
        description: "Evidence class"
        constraints: "WITNESS | DOCUMENT | SAMPLE | DIGITAL"
      - name: collected_at
        type: datetime
        source: input
        description: "Field-collection timestamp"
      - name: storage_uri
        type: string
        source: input
        description: "Storage URL for the artifact"
      - name: chain_of_custody_hash
        type: string
        source: input
        description: "SHA-256 of artifact content + timestamp; required for LITIGATION route"

  - name: Cost
    parent: null
    common_fields: false
    fields:
      - name: category
        type: enum
        source: input
        description: "Cost classification"
        constraints: "APPLICATION | ANNUAL_FEE | LITIGATION | AGENT_FEE"
      - name: ip_right_id
        type: string
        source: input
        description: "IPRight.id this cost relates to; null if pure agent settlement"
        default: null
      - name: protection_case_id
        type: string
        source: input
        description: "ProtectionCase.id when category == LITIGATION"
        default: null
      - name: agent_id
        type: string
        source: input
        description: "Agent.id when category == AGENT_FEE"
        default: null
      - name: currency
        type: string
        source: input
        description: "ISO 4217 currency of amount_native_cents"
      - name: amount_native_cents
        type: integer
        source: input
        description: "Cost amount in its native currency, in cents"
        constraints: ">= 0"
      - name: fx_rate_to_usd
        type: number
        source: input
        description: "Multiplier converting native to USD at the time the cost was booked"
        constraints: "> 0"
      - name: amount_usd_cents
        type: integer
        source: computed
        description: "round_half_up(amount_native_cents * fx_rate_to_usd); base-currency representation used in budgets"
      - name: allocations
        type: array
        source: computed
        description: "Output of cost_allocation: ordered array of {business_unit_id, percent_bps, allocated_cents} where allocated_cents sums to amount_usd_cents per round-per-allocation rule"
        default: []
      - name: allocation_rules
        type: array
        source: input
        description: "Ordered array of {business_unit_id, percent_bps} where percent_bps are basis points (1/100 of 1%) and sum to 10000"
      - name: booked_at
        type: datetime
        source: input
        description: "Date the cost is booked (used for periodic reporting)"

  - name: AuditEntry
    parent: null
    common_fields: false
    fields:
      - name: subject_entity
        type: string
        source: system
        description: "Entity type name (e.g. 'IPRight','Contract','AnnualFeeSchedule','ProtectionCase')"
      - name: subject_id
        type: string
        source: system
        description: "Subject entity's id"
      - name: actor_role
        type: string
        source: system
        description: "X-User-Role from the triggering request"
      - name: actor_id
        type: string
        source: system
        description: "X-User-ID from the triggering request"
      - name: event_type
        type: enum
        source: system
        description: "Audited event class"
        constraints: "STATUS_CHANGE | CONTRACT_RECORD | PAYMENT_SETTLED | EVIDENCE_ADDED | EXTERNAL_SYNC"
      - name: from_state
        type: string
        source: system
        description: "Prior state value when event_type == STATUS_CHANGE; null otherwise"
        default: null
      - name: to_state
        type: string
        source: system
        description: "New state value when event_type == STATUS_CHANGE; null otherwise"
        default: null
      - name: payload
        type: object
        source: system
        description: "Free-form structured payload (e.g. {transferee_party_id, royalty_rate})"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: IPRight
    initial_state: DRAFT
    terminal_states: [ABANDONED, TRANSFERRED]
    transitions:
      - from: DRAFT
        to: MATERIALS_READY
        trigger: "POST /ip-rights/{id}/materials-ready"
        actor: IPManager
        preconditions:
          - "All required material fields present (title, primary_jurisdiction non-empty)"
          - "If handling_mode == AGENCY then assigned_agent_id resolves to an Agent with qualification_verified == true"
          - "If handling_mode == SELF then assigned_agent_id == null"
        side_effects:
          - "AuditEntry emitted (event_type=STATUS_CHANGE, from=DRAFT, to=MATERIALS_READY)"
      - from: MATERIALS_READY
        to: FILED
        trigger: "POST /ip-rights/{id}/jurisdiction-filings (first filing) -> auto-transitions parent"
        actor: IPManager
        preconditions:
          - "At least one JurisdictionFiling exists with status FILED"
        side_effects:
          - "IPRight.status := FILED"
          - "Cost rows of category APPLICATION may be booked"
          - "AuditEntry emitted"
      - from: FILED
        to: OFFICE_ACTION
        trigger: "POST /ip-rights/{id}/office-actions"
        actor: IPManager
        preconditions:
          - "Referenced jurisdiction_filing_id belongs to this IPRight and is in FILED status"
        side_effects:
          - "JurisdictionFiling.status := OFFICE_ACTION"
          - "ApplicationOfficeAction created in PENDING"
          - "AuditEntry emitted"
      - from: OFFICE_ACTION
        to: FILED
        trigger: "POST /office-actions/{id}/respond"
        actor: AssignedAgent
        preconditions:
          - "ApplicationOfficeAction.status == PENDING"
          - "Caller is the Agent referenced by ApplicationOfficeAction.assigned_agent_id"
        side_effects:
          - "ApplicationOfficeAction.status := RESPONDED"
          - "JurisdictionFiling.status := FILED"
          - "If IPRight has no other office_action in PENDING, IPRight.status := FILED"
          - "AuditEntry emitted"
      - from: FILED
        to: REGISTERED
        trigger: "POST /jurisdiction-filings/{id}/register (last open filing registered) -> auto-transitions parent"
        actor: IPManager
        preconditions:
          - "JurisdictionFiling.status == FILED"
          - "All sibling JurisdictionFilings of the parent IPRight are in REGISTERED or ABANDONED after this transition"
        side_effects:
          - "JurisdictionFiling.status := REGISTERED"
          - "IPRight.status := REGISTERED, registered_at := now, certificate_archive_url := input archive_url"
          - "AnnualFeeSchedule rows for fee_year 1 auto-created per (jurisdiction, ip_type)"
          - "AuditEntry emitted"
      - from: REGISTERED
        to: TRANSFERRED
        trigger: "POST /contracts/{id}/file-with-authority where contract_type == TRANSFER"
        actor: IPManager
        preconditions:
          - "Contract.ip_right_id == this.id"
          - "Contract.contract_type == TRANSFER"
          - "Contract.status == SIGNED"
        side_effects:
          - "IPRight.status := TRANSFERRED"
          - "Contract.status := FILED, filed_with_authority := true"
          - "AuditEntry emitted"
      - from: OFFICE_ACTION
        to: ABANDONED
        trigger: "POST /office-actions/{id}/abandon (response_due_at < now())"
        actor: system
        preconditions:
          - "ApplicationOfficeAction.status == PENDING"
          - "response_due_at strictly < server clock now()"
        side_effects:
          - "ApplicationOfficeAction.status := CLOSED_ABANDONED"
          - "JurisdictionFiling.status := ABANDONED"
          - "If IPRight has no remaining FILED or OFFICE_ACTION JurisdictionFilings, IPRight.status := ABANDONED"
          - "AuditEntry emitted"
      - from: REGISTERED
        to: ABANDONED
        trigger: "System sweep POST /_sweep/annual-fees when all sibling AnnualFeeSchedules of the IPRight have status ABANDONED"
        actor: system
        preconditions:
          - "Every AnnualFeeSchedule row of the IPRight has status == ABANDONED"
        side_effects:
          - "IPRight.status := ABANDONED"
          - "AuditEntry emitted"

  - entity: AnnualFeeSchedule
    initial_state: PENDING
    terminal_states: [PAID, ABANDONED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /annual-fees/{id}/pay or external Payment event POST /_events/payment-settled"
        actor: FinanceManager | system
        preconditions:
          - "If auto_pay_authorized == false, caller must be FinanceManager"
          - "Payment amount_cents == base_fee_cents + computed surcharge_cents at now()"
        side_effects:
          - "paid_at := now()"
          - "surcharge_cents := computed per calculations.annual_fee_surcharge"
          - "total_paid_cents := base_fee_cents + surcharge_cents"
          - "Cost row of category ANNUAL_FEE booked for amount = total_paid_cents"
          - "AuditEntry emitted (event_type=PAYMENT_SETTLED)"
      - from: PENDING
        to: LATE
        trigger: "System sweep POST /_sweep/annual-fees when now() > due_date AND now() <= grace_end_date AND paid_at is null"
        actor: system
        preconditions:
          - "Current AnnualFeeSchedule.status == PENDING"
          - "Server clock now() strictly greater than due_date"
          - "Server clock now() less than or equal to grace_end_date"
        side_effects:
          - "status := LATE"
          - "AuditEntry emitted"
      - from: LATE
        to: PAID
        trigger: "POST /annual-fees/{id}/pay during grace window"
        actor: FinanceManager | system
        preconditions:
          - "Server clock now() <= grace_end_date"
        side_effects:
          - "paid_at := now()"
          - "surcharge_cents := computed per calculations.annual_fee_surcharge with status LATE"
          - "total_paid_cents := base_fee_cents + surcharge_cents"
          - "Cost row booked"
          - "AuditEntry emitted"
      - from: LATE
        to: ABANDONED
        trigger: "System sweep POST /_sweep/annual-fees when now() > grace_end_date AND paid_at is null"
        actor: system
        preconditions:
          - "Server clock now() strictly greater than grace_end_date"
          - "paid_at is null"
        side_effects:
          - "status := ABANDONED"
          - "JurisdictionFiling.status of the matching jurisdiction := ABANDONED"
          - "If all sibling JurisdictionFilings of the IPRight are ABANDONED, IPRight.status := ABANDONED"
          - "AuditEntry emitted"

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: SIGNING
        trigger: "POST /contracts/{id}/start-signing"
        actor: IPManager
        preconditions:
          - "All parties[].signed_at == null"
          - "Template exists and template.contract_type == this.contract_type"
        side_effects:
          - "AuditEntry emitted (event_type=CONTRACT_RECORD)"
      - from: SIGNING
        to: SIGNED
        trigger: "POST /contracts/{id}/sign by every party with signature_required == true OR external POST /_events/esign-completed"
        actor: ContractParty | system
        preconditions:
          - "Every parties[] entry with signature_required == true has signed_at != null after this call"
        side_effects:
          - "status := SIGNED once last required signature recorded"
          - "AuditEntry emitted (event_type=CONTRACT_RECORD)"
      - from: SIGNED
        to: FILED
        trigger: "POST /contracts/{id}/file-with-authority"
        actor: IPManager
        preconditions:
          - "Contract.status == SIGNED"
          - "If contract_type == TRANSFER: IPRight.status IN {REGISTERED}"
          - "If contract_type in {EXCLUSIVE_LICENSE, NON_EXCLUSIVE_LICENSE}: IPRight.status IN {REGISTERED}"
        side_effects:
          - "filed_with_authority := true"
          - "If contract_type == TRANSFER then IPRight.status := TRANSFERRED"
          - "AuditEntry emitted"
      - from: FILED
        to: AMENDED
        trigger: "POST /contracts/{id}/amend"
        actor: IPManager
        preconditions:
          - "Contract.status == FILED"
        side_effects:
          - "A snapshot of the prior fields is written to AuditEntry.payload"
          - "status := AMENDED"
          - "AuditEntry emitted (event_type=CONTRACT_RECORD)"
      - from: AMENDED
        to: FILED
        trigger: "POST /contracts/{id}/file-with-authority (re-file)"
        actor: IPManager
        preconditions:
          - "Contract.status == AMENDED"
        side_effects:
          - "AuditEntry emitted"
      - from: FILED
        to: TERMINATED
        trigger: "POST /contracts/{id}/terminate"
        actor: IPManager
        preconditions:
          - "Contract.status IN {FILED, AMENDED}"
          - "No RoyaltySchedule row of this contract is in FORECAST status with period_end > now()"
        side_effects:
          - "status := TERMINATED"
          - "AuditEntry emitted"
      - from: AMENDED
        to: TERMINATED
        trigger: "POST /contracts/{id}/terminate"
        actor: IPManager
        preconditions:
          - "No future-period FORECAST RoyaltySchedule exists"
        side_effects:
          - "status := TERMINATED"
          - "AuditEntry emitted"

  - entity: ProtectionCase
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /protection-cases/{id}/route (route=DEMAND_LETTER|LITIGATION|MEDIATION|ARBITRATION)"
        actor: Counsel
        preconditions:
          - "ProtectionCase.assigned_agent_id is set and the Agent's jurisdictions[] contains the IPRight.primary_jurisdiction"
          - "If route == LITIGATION, at least one Evidence row with chain_of_custody_hash != null exists"
          - "ProtectionCase.route == NONE"
        side_effects:
          - "route := requested route"
          - "status := IN_PROGRESS"
          - "AuditEntry emitted"
      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /protection-cases/{id}/resolve (outcome=WON|LOST|SETTLED|DISMISSED)"
        actor: Counsel
        preconditions:
          - "ProtectionCase.status == IN_PROGRESS"
          - "If outcome == WON: recovered_amount_cents > 0"
          - "If outcome == LOST or DISMISSED: recovered_amount_cents == 0"
        side_effects:
          - "outcome := input outcome"
          - "distributed := computed per calculations.damages_recovery_waterfall (only when outcome IN {WON, SETTLED})"
          - "Cost row of category LITIGATION booked for legal_fees_cents + agent_fees_cents in IPRight.business_unit_id"
          - "Agent.performance_rating recomputed per calculations.agent_performance_rating"
          - "AuditEntry emitted"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /protection-cases/{id}/close"
        actor: Counsel
        preconditions:
          - "ProtectionCase.status == RESOLVED"
          - "All distributed amounts have been paid (Cost rows booked)"
        side_effects:
          - "status := CLOSED"
          - "AuditEntry emitted"

  - entity: ApplicationOfficeAction
    initial_state: PENDING
    terminal_states: [CLOSED_GRANTED, CLOSED_ABANDONED]
    transitions:
      - from: PENDING
        to: RESPONDED
        trigger: "POST /office-actions/{id}/respond"
        actor: AssignedAgent
        preconditions:
          - "Status == PENDING and now() < response_due_at"
        side_effects:
          - "responded_at := now()"
          - "Triggers IPRight OFFICE_ACTION → FILED transition (see IPRight machine)"
      - from: RESPONDED
        to: CLOSED_GRANTED
        trigger: "POST /jurisdiction-filings/{id}/register"
        actor: IPManager
        preconditions:
          - "Linked JurisdictionFiling registers successfully"
        side_effects:
          - "AuditEntry emitted"
      - from: PENDING
        to: CLOSED_ABANDONED
        trigger: "POST /office-actions/{id}/abandon"
        actor: system | IPManager
        preconditions:
          - "now() >= response_due_at"
        side_effects:
          - "Triggers IPRight OFFICE_ACTION → ABANDONED transition (see IPRight machine)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two clients race to assign agents to the same OFFICE_ACTION"
    guarantee: "At most one assignment succeeds; second is rejected"
    error_id: ERR_OFFICE_ACTION_ALREADY_ASSIGNED
    http_status: 409
    serialization: "First-writer-wins on ApplicationOfficeAction.assigned_agent_id"
  - scenario: "Two clients call /pay for the same AnnualFeeSchedule concurrently"
    guarantee: "Exactly one transitions to PAID; the other is rejected as already-settled"
    error_id: ERR_FEE_ALREADY_PAID
    http_status: 409
    serialization: "First-writer-wins on AnnualFeeSchedule.paid_at"
  - scenario: "Sign and terminate race on the same Contract"
    guarantee: "Exactly one operation wins; loser sees state mismatch"
    error_id: ERR_INVALID_CONTRACT_STATE
    http_status: 409
    serialization: "First-writer-wins on Contract.status"
  - scenario: "Two resolve calls race on the same ProtectionCase"
    guarantee: "Exactly one resolution wins; second rejected"
    error_id: ERR_CASE_ALREADY_RESOLVED
    http_status: 409
    serialization: "First-writer-wins on ProtectionCase.status"
  - scenario: "Concurrent PATCH on IPRight with stale version field"
    guarantee: "Only the request whose version matches the row's current version wins"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "OCC version field"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: annual_fee_surcharge
    trigger: "AnnualFeeSchedule transitions PENDING→PAID, LATE→PAID, or sweep PENDING→LATE"
    algorithm: tiered_pricing
    formula: |
      days_late = floor((now() - due_date) / 1 day)
      if days_late <= 0:                  surcharge_rate = 0.00
      elif 1  <= days_late <= 30:         surcharge_rate = 0.10
      elif 31 <= days_late <= 90:         surcharge_rate = 0.25
      elif 91 <= days_late <= 180:        surcharge_rate = 0.50
      else (days_late > 180):             AnnualFeeSchedule.status := ABANDONED (no surcharge booked)
      surcharge_cents = round_half_up(base_fee_cents * surcharge_rate)
    input_set: "Single AnnualFeeSchedule row; only PENDING and LATE rows enter; PAID and ABANDONED skipped"
    constants:
      TIER_1_MAX_DAYS: 30
      TIER_2_MAX_DAYS: 90
      GRACE_MAX_DAYS: 180
      TIER_1_RATE: 0.10
      TIER_2_RATE: 0.25
      TIER_3_RATE: 0.50
    precision: "integer cents, round_half_up"
    variants:
      - name: on_payment
        when: "Triggered by /annual-fees/{id}/pay"
        difference: "Uses clock now() at request time"
      - name: on_sweep
        when: "Triggered by /_sweep/annual-fees"
        difference: "Uses clock now() at sweep time; no Cost row booked, only status transitions"

  - name: royalty_period_amount
    trigger: "RoyaltySchedule creation, and on POST /royalty-schedules/{id}/settle"
    algorithm: forward_looking
    formula: |
      provisional_royalty_cents = round_half_up(forecast_revenue_cents * Contract.royalty_rate)
      on settle:
        raw_actual = round_half_up(actual_revenue_cents * Contract.royalty_rate)
        if Contract.contract_type == EXCLUSIVE_LICENSE:
          final_royalty_cents = max(raw_actual, Contract.min_guarantee_cents)
        else:
          final_royalty_cents = raw_actual
    input_set: "Single RoyaltySchedule + parent Contract; provisional uses forecast_revenue_cents; final uses actual_revenue_cents"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "RoyaltySchedule.status == FORECAST"
        difference: "Uses forecast_revenue_cents; no min_guarantee floor applied"
      - name: final_settlement
        when: "RoyaltySchedule.status == SETTLED"
        difference: "Uses actual_revenue_cents; min_guarantee floor applied ONLY when contract_type == EXCLUSIVE_LICENSE"

  - name: damages_recovery_waterfall
    trigger: "ProtectionCase transitions IN_PROGRESS→RESOLVED with outcome IN {WON, SETTLED}"
    algorithm: waterfall_allocation
    formula: |
      remaining = recovered_amount_cents
      legal_paid = min(remaining, legal_fees_cents); remaining -= legal_paid
      agent_paid = min(remaining, agent_fees_cents); remaining -= agent_paid
      punitive_paid = min(remaining, punitive_cap_cents); remaining -= punitive_paid
      rights_holder_paid = remaining
      distributed = {legal_paid, agent_paid, punitive_paid, rights_holder_paid}
      INVARIANT: legal_paid + agent_paid + punitive_paid + rights_holder_paid == recovered_amount_cents
    input_set: "Single ProtectionCase row; ordered buckets are fixed: legal → agent → punitive → rights_holder"
    constants: {}
    precision: "integer cents; no rounding (all inputs already integer cents)"

  - name: cost_allocation
    trigger: "POST /costs (creation) and PATCH /costs/{id}/allocation"
    algorithm: aggregation
    formula: |
      total = amount_usd_cents
      n = len(allocation_rules)
      allocated = []
      running_sum = 0
      for i in range(n - 1):
        portion = round_half_up(total * allocation_rules[i].percent_bps / 10000)
        allocated.append({business_unit_id: allocation_rules[i].business_unit_id, percent_bps, allocated_cents: portion})
        running_sum += portion
      # remainder goes to the LAST rule, NOT recomputed independently
      last_portion = total - running_sum
      allocated.append({business_unit_id: allocation_rules[n-1].business_unit_id,
                        percent_bps: allocation_rules[n-1].percent_bps,
                        allocated_cents: last_portion})
      INVARIANT: sum(allocated_cents) == amount_usd_cents (exact)
      # The pinned order — "round per-allocation, push remainder to last" — produces different cents
      # than "sum percentages first then split", which is intentional dual-mode.
    input_set: "Single Cost row + its allocation_rules array (length >= 1, percent_bps sum to 10000)"
    constants:
      BPS_TOTAL: 10000
    precision: "integer cents, round_half_up per portion, remainder bucket-truncated"

  - name: cost_usd_conversion
    trigger: "POST /costs and any PATCH that changes amount_native_cents or fx_rate_to_usd"
    algorithm: aggregation
    formula: |
      amount_usd_cents = round_half_up(amount_native_cents * fx_rate_to_usd)
    input_set: "Single Cost row"
    constants: {}
    precision: "integer cents, round_half_up"

  - name: agent_workload_score
    trigger: "On any change to active_case_count, pending_action_count, or upcoming_deadline_count of an Agent; also returned by GET /agents/{id}"
    algorithm: weighted_scoring
    formula: |
      workload_score = round_half_up(
        (0.40 * active_case_count) +
        (0.30 * pending_action_count) +
        (0.30 * upcoming_deadline_count),
        2 decimal places)
    input_set: "Single Agent row; counts derived from current state of its assigned cases, office actions, fees"
    constants:
      W_CASES: 0.40
      W_ACTIONS: 0.30
      W_DEADLINES: 0.30
    precision: "2 decimal places, round_half_up"

  - name: agent_performance_rating
    trigger: "ProtectionCase IN_PROGRESS→RESOLVED for cases whose assigned_agent_id == this agent"
    algorithm: weighted_scoring
    formula: |
      let resolved = ProtectionCases of this agent with status IN {RESOLVED, CLOSED}, ordered by updated_at ASC (tie-break by id ASC)
      let recent  = last 10 of resolved (most recent first via updated_at DESC, id DESC); fewer than 10 uses all
      score_for(case) =
        5.0 if outcome == WON
        3.5 if outcome == SETTLED
        2.0 if outcome == DISMISSED
        1.0 if outcome == LOST
      performance_rating = round_half_up(mean(score_for(c) for c in recent), 2 decimal places)
      if recent is empty: performance_rating = 0.00
    input_set: "Last 10 RESOLVED/CLOSED ProtectionCases of the agent, ordered by updated_at DESC then id DESC"
    constants:
      WINDOW_SIZE: 10
    precision: "2 decimal places, round_half_up"

  - name: business_unit_actual_spend
    trigger: "Cost creation, Cost allocation change, refund cascades"
    algorithm: aggregation
    formula: |
      BusinessUnit.actual_spend_cents =
        sum over Cost rows of:
          sum over allocations[] of:
            allocated_cents WHERE allocations[].business_unit_id == this.id
    input_set: "All Cost rows with at least one allocation pointing at this BusinessUnit; no status filter (all booked costs counted)"
    constants: {}
    precision: "integer cents (exact aggregation)"

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except GET /_health"

  - priority: 2
    category: auth
    check: "Role permitted to invoke this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-bound entity ids resolve, left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-bound endpoints"

  - priority: 4
    category: existence
    check: "All foreign-key body fields resolve (assigned_agent_id, ip_right_id, business_unit_id, template_id, etc.)"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 422
    applies_to: "POST/PATCH mutations referencing other entities"

  - priority: 5
    category: state
    check: "Target entity is in a state where the requested transition is defined (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (e.g. /respond, /pay, /file-with-authority, /resolve)"

  - priority: 6
    category: business_safety
    check: "Agent qualification_verified == true when assigning to AGENCY-handled work (filings, office-actions, protection cases, annual fees)"
    error_id: ERR_AGENT_QUALIFICATION_UNVERIFIED
    http_status: 422
    applies_to: "POST /ip-rights, POST /ip-rights/{id}/office-actions, POST /protection-cases, PATCH /annual-fees/{id}"

  - priority: 7
    category: business_safety
    check: "Litigation route requires ≥1 Evidence row whose chain_of_custody_hash is not null"
    error_id: ERR_EVIDENCE_MISSING_FOR_LITIGATION
    http_status: 422
    applies_to: "POST /protection-cases/{id}/route when route==LITIGATION"

  - priority: 8
    category: business_referential
    check: "Agent.jurisdictions[] must contain IPRight.primary_jurisdiction for case routing"
    error_id: ERR_AGENT_JURISDICTION_MISMATCH
    http_status: 422
    applies_to: "POST /protection-cases/{id}/route, POST /ip-rights with handling_mode=AGENCY"

  - priority: 9
    category: business_constraint
    check: "Contract.contract_type must equal ContractTemplate.contract_type"
    error_id: ERR_TEMPLATE_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /contracts, PATCH /contracts/{id}"

  - priority: 10
    category: business_constraint
    check: "LICENSE contracts require royalty_rate; TRANSFER contracts require royalty_rate==null and min_guarantee_cents==null"
    error_id: ERR_CONTRACT_FIELDS_FOR_TYPE
    http_status: 422
    applies_to: "POST /contracts, PATCH /contracts/{id}"

  - priority: 11
    category: business_constraint
    check: "min_guarantee_cents may be set ONLY when contract_type == EXCLUSIVE_LICENSE"
    error_id: ERR_MIN_GUARANTEE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /contracts, PATCH /contracts/{id}"

  - priority: 12
    category: business_temporal
    check: "RoyaltySchedule periods on the same contract must not overlap and must cover a contiguous timeline (period_end of period N equals period_start of period N+1)"
    error_id: ERR_ROYALTY_PERIOD_GAP_OR_OVERLAP
    http_status: 422
    applies_to: "POST /contracts/{id}/royalty-schedules"

  - priority: 13
    category: business_temporal
    check: "AnnualFeeSchedule.due_date strictly less than grace_end_date; grace_end_date == due_date + 180 days"
    error_id: ERR_FEE_DATES_INVALID
    http_status: 422
    applies_to: "POST /ip-rights/{id}/annual-fees"

  - priority: 14
    category: business_constraint
    check: "Cost.allocation_rules percent_bps must be non-empty and sum to exactly 10000"
    error_id: ERR_ALLOCATION_BPS_INVALID
    http_status: 422
    applies_to: "POST /costs, PATCH /costs/{id}/allocation"

  - priority: 15
    category: business_constraint
    check: "All allocation_rules.business_unit_id must point at BusinessUnit.status == ACTIVE"
    error_id: ERR_ALLOCATION_BU_INACTIVE
    http_status: 422
    applies_to: "POST /costs, PATCH /costs/{id}/allocation"

  - priority: 16
    category: business_fiscal
    check: "Allocating a Cost MUST NOT push any BusinessUnit.actual_spend_cents above BusinessUnit.annual_budget_cents"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /costs, PATCH /costs/{id}/allocation"

  - priority: 17
    category: business_constraint
    check: "On Contract creation, parties[] must contain at least one entry with signature_required==true and there must be at least 2 unique party_id values"
    error_id: ERR_INSUFFICIENT_PARTIES
    http_status: 422
    applies_to: "POST /contracts"

  - priority: 18
    category: business_referential
    check: "IPRight referenced by a Contract must be in status REGISTERED when filing the contract with authority"
    error_id: ERR_IP_NOT_REGISTERED
    http_status: 422
    applies_to: "POST /contracts/{id}/file-with-authority"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Business Units ----
  - method: POST
    path: "/business-units"
    description: "Create a business unit"
    roles: [Admin]
    code: 201
    input: [code, name, annual_budget_cents]
    output: BusinessUnit
    side_effects: [actual_spend_cents initialized to 0]

  - method: GET
    path: "/business-units"
    description: "List business units"
    roles: [Admin, FinanceManager, IPManager, Counsel]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: BusinessUnit[]
    side_effects: []

  - method: GET
    path: "/business-units/{id}"
    description: "Get a business unit, including computed actual_spend_cents"
    roles: [Admin, FinanceManager, IPManager, Counsel]
    code: 200
    input: []
    output: BusinessUnit
    side_effects: [actual_spend_cents recomputed per calculations.business_unit_actual_spend]

  - method: POST
    path: "/business-units/{id}/archive"
    description: "Flip a BusinessUnit to ARCHIVED status"
    roles: [Admin]
    code: 200
    input: ["version?"]
    output: BusinessUnit
    side_effects: 
      - "status := ARCHIVED"

  # ---- Agents ----
  - method: POST
    path: "/agents"
    description: "Create an agent profile (qualification unverified)"
    roles: [Admin]
    code: 201
    input: [kind, full_name, qualification_number, jurisdictions, hourly_rate_cents]
    output: Agent
    side_effects: 
      - "qualification_verified := false"

  - method: POST
    path: "/agents/{id}/verify"
    description: "Admin verifies the agent's qualification"
    roles: [Admin]
    code: 200
    input: []
    output: Agent
    side_effects: 
      - "qualification_verified := true"

  - method: GET
    path: "/agents"
    description: "List agents with filters and computed workload"
    roles: [Admin, IPManager, FinanceManager, Counsel]
    code: 200
    input: ["kind?", "status?", "jurisdiction?", "limit?", "offset?"]
    output: Agent[]
    side_effects: [workload_score recomputed per calculations.agent_workload_score]

  - method: GET
    path: "/agents/{id}"
    description: "Get a single agent with current workload and performance"
    roles: [Admin, IPManager, FinanceManager, Counsel]
    code: 200
    input: []
    output: Agent
    side_effects: [workload_score and performance_rating recomputed]

  # ---- IP Rights ----
  - method: POST
    path: "/ip-rights"
    description: "Create an IPRight in DRAFT"
    roles: [IPManager]
    code: 201
    input: [ip_type, title, handling_mode, "assigned_agent_id?", business_unit_id, primary_jurisdiction]
    output: IPRight
    side_effects: 
      - "status := DRAFT; AuditEntry"

  - method: GET
    path: "/ip-rights"
    description: "List IP rights"
    roles: [IPManager, FinanceManager, Counsel, Admin]
    code: 200
    input: ["status?", "ip_type?", "business_unit_id?", "limit?", "offset?"]
    output: IPRight[]
    side_effects: []

  - method: GET
    path: "/ip-rights/{id}"
    description: "Get an IP right with computed fields"
    roles: [IPManager, FinanceManager, Counsel, Admin]
    code: 200
    input: []
    output: IPRight
    side_effects: []

  - method: POST
    path: "/ip-rights/{id}/materials-ready"
    description: "Mark application materials ready; transitions DRAFT→MATERIALS_READY"
    roles: [IPManager]
    code: 200
    input: ["version?"]
    output: IPRight
    side_effects: 
      - "status := MATERIALS_READY"

  - method: POST
    path: "/ip-rights/{id}/jurisdiction-filings"
    description: "Create a jurisdiction filing; first filing auto-transitions IPRight MATERIALS_READY→FILED"
    roles: [IPManager]
    code: 201
    input: [jurisdiction, filing_number, filed_at]
    output: JurisdictionFiling
    side_effects: 
      - "If first filing then IPRight.status := FILED"

  - method: POST
    path: "/jurisdiction-filings/{id}/register"
    description: "Mark a JurisdictionFiling REGISTERED; if all siblings REGISTERED/ABANDONED, IPRight.status := REGISTERED"
    roles: [IPManager]
    code: 200
    input: [archive_url]
    output: IPRight
    side_effects:
      - "JurisdictionFiling.status := REGISTERED"
      - "If all sibling filings of the IPRight are in REGISTERED or ABANDONED: IPRight.status := REGISTERED, registered_at := now, certificate_archive_url := archive_url; AnnualFeeSchedule.fee_year=1 rows auto-created for this jurisdiction"

  - method: POST
    path: "/ip-rights/{id}/office-actions"
    description: "Open an office-action against one of the IPRight's filings"
    roles: [IPManager]
    code: 201
    input: [jurisdiction_filing_id, assigned_agent_id, response_due_at]
    output: ApplicationOfficeAction
    side_effects: 
      - "status := PENDING; JurisdictionFiling.status := OFFICE_ACTION; IPRight.status := OFFICE_ACTION"

  - method: POST
    path: "/office-actions/{id}/respond"
    description: "Assigned agent files the response; transitions OFFICE_ACTION → FILED (filing-level) and may bubble up the IPRight"
    roles: [InternalAgent, ExternalAgent]
    code: 200
    input: ["version?"]
    output: ApplicationOfficeAction
    side_effects: 
      - "status := RESPONDED; JurisdictionFiling.status := FILED"

  - method: POST
    path: "/office-actions/{id}/abandon"
    description: "Abandon an overdue office-action (server clock past response_due_at). System or IPManager."
    roles: [IPManager]
    code: 200
    input: []
    output: ApplicationOfficeAction
    side_effects: 
      - "status := CLOSED_ABANDONED; JurisdictionFiling.status := ABANDONED; potential IPRight bubble-up to ABANDONED"

  # ---- Annual Fees ----
  - method: POST
    path: "/ip-rights/{id}/annual-fees"
    description: "Schedule a future annuity"
    roles: [FinanceManager, IPManager]
    code: 201
    input: [jurisdiction, fee_year, base_fee_cents, due_date, "auto_pay_authorized?", assigned_agent_id]
    output: AnnualFeeSchedule
    side_effects: 
      - "grace_end_date := due_date + 180 days; status := PENDING"

  - method: GET
    path: "/annual-fees"
    description: "List annual fees with filters"
    roles: [FinanceManager, IPManager, Admin]
    code: 200
    input: ["ip_right_id?", "status?", "due_before?", "limit?", "offset?"]
    output: AnnualFeeSchedule[]
    side_effects: []

  - method: POST
    path: "/annual-fees/{id}/pay"
    description: "Pay (or auto-pay) an annual fee"
    roles: [FinanceManager]
    code: 200
    input: ["version?"]
    output: AnnualFeeSchedule
    side_effects: 
      - "surcharge_cents computed; status := PAID; Cost row of category ANNUAL_FEE booked"

  # ---- Contract Templates ----
  - method: POST
    path: "/contract-templates"
    description: "Create a contract template"
    roles: [Admin]
    code: 201
    input: [code, contract_type, body]
    output: ContractTemplate
    side_effects: []

  - method: GET
    path: "/contract-templates"
    description: "List templates"
    roles: [Admin, IPManager]
    code: 200
    input: ["contract_type?", "limit?", "offset?"]
    output: ContractTemplate[]
    side_effects: []

  # ---- Contracts ----
  - method: POST
    path: "/contracts"
    description: "Draft a contract"
    roles: [IPManager]
    code: 201
    input: [ip_right_id, template_id, contract_type, parties, "royalty_rate?", "min_guarantee_cents?", business_unit_id]
    output: Contract
    side_effects: 
      - "status := DRAFT"

  - method: POST
    path: "/contracts/{id}/start-signing"
    description: "Open the contract for signatures"
    roles: [IPManager]
    code: 200
    input: ["version?"]
    output: Contract
    side_effects: 
      - "status := SIGNING"

  - method: POST
    path: "/contracts/{id}/sign"
    description: "Record a party signature (or external e-signature event applies)"
    roles: [IPManager, Admin]
    code: 200
    input: [party_id]
    output: Contract
    side_effects: 
      - "parties[matching].signed_at := now; if last required party then status := SIGNED"

  - method: POST
    path: "/contracts/{id}/file-with-authority"
    description: "File a SIGNED (or AMENDED) contract; for TRANSFER also flips IPRight to TRANSFERRED"
    roles: [IPManager]
    code: 200
    input: ["version?"]
    output: Contract
    side_effects: 
      - "filed_with_authority := true; status := FILED; if TRANSFER then IPRight.status := TRANSFERRED"

  - method: POST
    path: "/contracts/{id}/amend"
    description: "Open an amendment cycle"
    roles: [IPManager]
    code: 200
    input: ["version?"]
    output: Contract
    side_effects: 
      - "status := AMENDED; AuditEntry payload contains prior-field snapshot"

  - method: POST
    path: "/contracts/{id}/terminate"
    description: "Terminate a FILED or AMENDED contract"
    roles: [IPManager]
    code: 200
    input: ["version?"]
    output: Contract
    side_effects: 
      - "status := TERMINATED"

  - method: POST
    path: "/contracts/{id}/royalty-schedules"
    description: "Create one royalty period; provisional_royalty_cents computed"
    roles: [IPManager]
    code: 201
    input: [period_index, period_start, period_end, forecast_revenue_cents]
    output: RoyaltySchedule
    side_effects: [provisional_royalty_cents computed]

  - method: POST
    path: "/royalty-schedules/{id}/settle"
    description: "Settle a royalty period with actual revenue"
    roles: [FinanceManager]
    code: 200
    input: [actual_revenue_cents, "version?"]
    output: RoyaltySchedule
    side_effects: 
      - "final_royalty_cents computed; status := SETTLED"

  # ---- Protection Cases ----
  - method: POST
    path: "/protection-cases"
    description: "Open a rights-protection case"
    roles: [Counsel]
    code: 201
    input: [ip_right_id, assigned_agent_id, business_unit_id, "rights_holder_currency?"]
    output: ProtectionCase
    side_effects: 
      - "status := OPEN; route := NONE"

  - method: POST
    path: "/protection-cases/{id}/evidence"
    description: "Add an evidence row"
    roles: [Counsel, InternalAgent, ExternalAgent]
    code: 201
    input: [kind, collected_at, storage_uri, "chain_of_custody_hash?"]
    output: Evidence
    side_effects: [AuditEntry emitted]

  - method: POST
    path: "/protection-cases/{id}/route"
    description: "Route an OPEN case to DEMAND_LETTER | LITIGATION | MEDIATION | ARBITRATION"
    roles: [Counsel]
    code: 200
    input: [route, "version?"]
    output: ProtectionCase
    side_effects: 
      - "route := input; status := IN_PROGRESS"

  - method: POST
    path: "/protection-cases/{id}/resolve"
    description: "Resolve a case with outcome; runs damages waterfall when WON/SETTLED"
    roles: [Counsel]
    code: 200
    input: [outcome, recovered_amount_cents, legal_fees_cents, agent_fees_cents, punitive_cap_cents, "version?"]
    output: ProtectionCase
    side_effects: [distributed computed; Cost row of category LITIGATION booked; agent.performance_rating recomputed]

  - method: POST
    path: "/protection-cases/{id}/close"
    description: "Close a RESOLVED case"
    roles: [Counsel]
    code: 200
    input: ["version?"]
    output: ProtectionCase
    side_effects: 
      - "status := CLOSED"

  # ---- Costs ----
  - method: POST
    path: "/costs"
    description: "Book a cost row with FX and allocation"
    roles: [FinanceManager]
    code: 201
    input: [category, "ip_right_id?", "protection_case_id?", "agent_id?", currency, amount_native_cents, fx_rate_to_usd, allocation_rules, booked_at]
    output: Cost
    side_effects: [amount_usd_cents computed; allocations computed; BusinessUnit.actual_spend_cents updated]

  - method: PATCH
    path: "/costs/{id}/allocation"
    description: "Reallocate an existing cost"
    roles: [FinanceManager]
    code: 200
    input: [allocation_rules]
    output: Cost
    side_effects: [allocations recomputed; BusinessUnit.actual_spend_cents recomputed for old and new BUs]

  - method: GET
    path: "/costs"
    description: "List costs with filters"
    roles: [FinanceManager, Admin]
    code: 200
    input: ["category?", "ip_right_id?", "business_unit_id?", "booked_from?", "booked_to?", "limit?", "offset?"]
    output: Cost[]
    side_effects: []

  - method: GET
    path: "/reports/cost-summary"
    description: "Periodic cost-summary report (budget vs actual per BU, by category)"
    roles: [FinanceManager, Admin]
    code: 200
    input: [from, to, "business_unit_id?"]
    output: object
    side_effects: []

  # ---- Audit ----
  - method: GET
    path: "/audit-entries"
    description: "Query audit log (status changes + contract records)"
    roles: [Admin, FinanceManager, IPManager, Counsel]
    code: 200
    input: ["subject_entity?", "subject_id?", "event_type?", "from_time?", "to_time?", "limit?", "offset?"]
    output: AuditEntry[]
    side_effects: []

  # ---- Test-driving system endpoints ----
  - method: POST
    path: "/_clock/advance"
    description: "Test-only: advance the server clock by N seconds"
    roles: [Admin]
    code: 200
    input: [seconds]
    output: object
    side_effects: [server clock moves forward; subsequent date comparisons use new now()]

  - method: POST
    path: "/_sweep/annual-fees"
    description: "Trigger the annual-fee sweep: PENDING→LATE if past due_date but within grace; LATE→ABANDONED if past grace_end_date"
    roles: [Admin]
    code: 200
    input: []
    output: object
    side_effects: [Bulk status transitions, IPRight bubble-up to ABANDONED when all fees abandoned]

  - method: POST
    path: "/_events/payment-settled"
    description: "External Payment-system event: marks an AnnualFeeSchedule paid via the gateway"
    roles: [Admin]
    code: 200
    input: [annual_fee_id, idempotency_key]
    output: AnnualFeeSchedule
    side_effects: 
      - "Same as POST /annual-fees/{id}/pay; idempotent on idempotency_key"

  - method: POST
    path: "/_events/esign-completed"
    description: "External e-signature platform event: records a party signature on a Contract"
    roles: [Admin]
    code: 200
    input: [contract_id, party_id, idempotency_key]
    output: Contract
    side_effects: 
      - "Same as /contracts/{id}/sign; idempotent on idempotency_key"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/blank X-User-Role or X-User-ID"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated role not permitted for this endpoint per RBAC"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-bound entity id does not exist"
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 422
    condition: "Body-referenced foreign key does not resolve to an existing entity"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in a state where this transition is defined"
  - id: ERR_INVALID_CONTRACT_STATE
    http: 409
    condition: "Specifically: Contract state precludes the action (alias used by concurrency rule)"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC version mismatch on PATCH/PUT/action endpoint"
  - id: ERR_OFFICE_ACTION_ALREADY_ASSIGNED
    http: 409
    condition: "Concurrent attempt to set assigned_agent_id on an ApplicationOfficeAction"
  - id: ERR_FEE_ALREADY_PAID
    http: 409
    condition: "AnnualFeeSchedule.paid_at is already set (race or replay)"
  - id: ERR_CASE_ALREADY_RESOLVED
    http: 409
    condition: "ProtectionCase already in RESOLVED or CLOSED"
  - id: ERR_AGENT_QUALIFICATION_UNVERIFIED
    http: 422
    condition: "AGENCY-mode assignment to an Agent whose qualification_verified == false"
  - id: ERR_AGENT_JURISDICTION_MISMATCH
    http: 422
    condition: "Agent.jurisdictions does not contain IPRight.primary_jurisdiction"
  - id: ERR_EVIDENCE_MISSING_FOR_LITIGATION
    http: 422
    condition: "Route=LITIGATION on a case with no chain_of_custody_hash evidence"
  - id: ERR_TEMPLATE_TYPE_MISMATCH
    http: 422
    condition: "Contract.contract_type differs from ContractTemplate.contract_type"
  - id: ERR_CONTRACT_FIELDS_FOR_TYPE
    http: 422
    condition: "royalty_rate / min_guarantee_cents combination invalid for the contract_type"
  - id: ERR_MIN_GUARANTEE_NOT_ALLOWED
    http: 422
    condition: "min_guarantee_cents set on a non-EXCLUSIVE_LICENSE contract"
  - id: ERR_INSUFFICIENT_PARTIES
    http: 422
    condition: "Contract.parties[] missing required signers or fewer than 2 unique party_ids"
  - id: ERR_ROYALTY_PERIOD_GAP_OR_OVERLAP
    http: 422
    condition: "Royalty periods overlap or leave a gap on the same contract"
  - id: ERR_FEE_DATES_INVALID
    http: 422
    condition: "AnnualFeeSchedule date relationship invalid (e.g., grace_end_date != due_date+180d)"
  - id: ERR_IP_NOT_REGISTERED
    http: 422
    condition: "Filing a contract with authority before IPRight reaches REGISTERED"
  - id: ERR_ALLOCATION_BPS_INVALID
    http: 422
    condition: "allocation_rules empty or percent_bps do not sum to 10000"
  - id: ERR_ALLOCATION_BU_INACTIVE
    http: 422
    condition: "One of the allocation_rules targets a BusinessUnit not in ACTIVE status"
  - id: ERR_BUDGET_EXCEEDED
    http: 422
    condition: "After allocation, a BusinessUnit.actual_spend_cents would exceed annual_budget_cents"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Admin
    description: "Platform administrator; manages business units, agents, templates, and operates test/system endpoints"
    identity: opaque
    exclusive_operations:
      - "POST /business-units"
      - "POST /agents"
      - "POST /agents/{id}/verify"
      - "POST /contract-templates"
      - "POST /_clock/advance"
      - "POST /_sweep/annual-fees"
      - "POST /_events/payment-settled"
      - "POST /_events/esign-completed"
    shared_operations:
      - "GET /business-units, /agents, /ip-rights, /annual-fees, /contracts, /costs, /audit-entries, /reports/cost-summary"

  - name: IPManager
    description: "Prosecutes IP applications, manages contracts, and drives jurisdiction filings"
    identity: opaque
    exclusive_operations:
      - "POST /ip-rights"
      - "POST /ip-rights/{id}/materials-ready"
      - "POST /ip-rights/{id}/jurisdiction-filings"
      - "POST /jurisdiction-filings/{id}/register"
      - "POST /ip-rights/{id}/office-actions"
      - "POST /office-actions/{id}/abandon"
      - "POST /contracts"
      - "POST /contracts/{id}/start-signing"
      - "POST /contracts/{id}/file-with-authority"
      - "POST /contracts/{id}/amend"
      - "POST /contracts/{id}/terminate"
      - "POST /contracts/{id}/royalty-schedules"
    shared_operations:
      - "POST /ip-rights/{id}/annual-fees (with FinanceManager)"
      - "POST /contracts/{id}/sign (with Admin)"
      - "GET /agents, /ip-rights, /annual-fees, /contracts, /contract-templates, /business-units, /audit-entries"

  - name: FinanceManager
    description: "Handles annual-fee payments, royalty settlements, costs, and budget reports"
    identity: opaque
    exclusive_operations:
      - "POST /annual-fees/{id}/pay"
      - "POST /royalty-schedules/{id}/settle"
      - "POST /costs"
      - "PATCH /costs/{id}/allocation"
      - "GET /reports/cost-summary"
    shared_operations:
      - "POST /ip-rights/{id}/annual-fees (with IPManager)"
      - "GET /agents, /ip-rights, /annual-fees, /contracts, /costs, /business-units, /audit-entries"

  - name: Counsel
    description: "Manages rights-protection cases (evidence, routing, resolution)"
    identity: opaque
    exclusive_operations:
      - "POST /protection-cases"
      - "POST /protection-cases/{id}/route"
      - "POST /protection-cases/{id}/resolve"
      - "POST /protection-cases/{id}/close"
    shared_operations:
      - "POST /protection-cases/{id}/evidence (with InternalAgent, ExternalAgent)"
      - "GET /agents, /ip-rights, /protection-cases, /business-units, /audit-entries"

  - name: InternalAgent
    description: "Internal IP agent (employee) who handles office-action responses and evidence"
    identity: entity_backed:Agent
    exclusive_operations: []
    shared_operations:
      - "POST /office-actions/{id}/respond (with ExternalAgent)"
      - "POST /protection-cases/{id}/evidence (with Counsel, ExternalAgent)"
      - "GET /agents/{self}, /ip-rights (assigned), /protection-cases (assigned), /annual-fees (assigned)"

  - name: ExternalAgent
    description: "External firm IP agent (third-party) who handles office-action responses and evidence"
    identity: entity_backed:Agent
    exclusive_operations: []
    shared_operations:
      - "POST /office-actions/{id}/respond (with InternalAgent)"
      - "POST /protection-cases/{id}/evidence (with Counsel, InternalAgent)"
      - "GET /agents/{self}, /ip-rights (assigned), /protection-cases (assigned)"
