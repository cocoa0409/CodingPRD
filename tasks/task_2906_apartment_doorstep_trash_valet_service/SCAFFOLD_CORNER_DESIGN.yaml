            - "gross is NOT 6990 (both residents counted) and NOT 13980 (the PROVISIONAL contracted-door basis)"
            - "MonthlyStatement.${st_id}.scheduled_night_count == 1, missed_equivalent_nights == 1.0, missed_service_bps == 10000, sla_credit_rate_bps == 1200"
            - "missed_service_credit_cents == 419, property_revenue_share_cents == 461, net_due_from_property_cents == 2615"
            - "ServiceNight.${n1_id}.billing_status == 'CREDITED' and ServiceContract.${contract_id}.last_invoiced_period == '2026-09'"

