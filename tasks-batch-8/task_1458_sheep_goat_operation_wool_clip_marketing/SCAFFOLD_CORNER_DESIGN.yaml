            - { call: "POST /api/shearing-events/${ev}/complete", payload: { shorn_head_count: 400, greasy_weight_lbs: 200.0, skirtings_weight_lbs: 20.0 }, as: RangeHand }
            - { call: "GET /api/wool-clips", payload: { shearing_event_id: "${ev}" }, as: RanchManager, captures: { clip: "$.data[0].id" } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "OC1", weight_lbs: 100.0 }, as: RanchManager, captures: { lot: $.data.id, lot_v1: $.data.version } }
            - { call: "POST /api/wool-lots/${lot}/grade", payload: { estimated_micron: 20.0 }, as: RanchManager, captures: { lot_v2: $.data.version } }
            - { call: "POST /api/wool-lots/${lot}/transitions", payload: { to: "REGRADING" }, as: RanchManager, captures: { lot_v3: $.data.version } }
          trigger:
            - { call: "POST /api/wool-lots/${lot}/regrade", payload: { estimated_micron: 18.0, expected_wool_lot_version: "${lot_v2}" }, as: RanchManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/wool-lots/${lot}/regrade", payload: { estimated_micron: 18.0, expected_wool_lot_version: "${lot_v3}" }, as: RanchManager }
          assert:
            - "Stale regrade (expected == ${lot_v2} while version == ${lot_v3}): error_id == ERR_STALE_LOT_VERSION (412)"
            - "Fresh regrade: lot_status == GRADED, grade_code == SUPERFINE, version == ${lot_v3} + 1"
            - "Versions incremented by exactly 1 at each mutation (1 at create, 2 at grade, 3 at REGRADING, 4 at regrade)"

      - name: contract_counter_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contract-counter-stale-version]", "errors[ERR_STALE_CONTRACT_VERSION]"]
        distinguishing_aspect: "OCC on GrazingContract.version: after a counter and a re-proposal the contract is again PROPOSED (state check passes), but a counter carrying the stale version 2 is rejected 412 — pure OCC catch, not a state error."
        test_recipe:
          setup: ["Flock (SHEEP, 800); contract PROPOSED (v2), countered (v3), re-PROPOSED (v4)"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Occ2 Ranch", species: "SHEEP", baseline_headcount: 800 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/grazing-contracts", payload: { flock_id: "${fl}", client_org_name: "OCC Client", parcel_name: "Parcel O", service_window_start: "2026-09-01T00:00:00Z", service_window_end: "2026-09-30T00:00:00Z", rate_per_head_day_cents: 90, min_head: 50, max_head: 600, target_cover_reduction_pct: 60.0 }, as: RanchManager, captures: { gc: $.data.id } }
            - { call: "POST /api/grazing-contracts/${gc}/transitions", payload: { to: "PROPOSED" }, as: RanchManager, captures: { gc_v2: $.data.version } }
            - { call: "POST /api/grazing-contracts/${gc}/counter", payload: { expected_grazing_contract_version: "${gc_v2}", rate_per_head_day_cents: 85 }, as: GrazingClient }
            - { call: "POST /api/grazing-contracts/${gc}/transitions", payload: { to: "PROPOSED" }, as: RanchManager, captures: { gc_v4: $.data.version } }
          trigger:
            - { call: "POST /api/grazing-contracts/${gc}/counter", payload: { expected_grazing_contract_version: "${gc_v2}", rate_per_head_day_cents: 80 }, as: GrazingClient, captures: { err: $.data.error_id } }
            - { call: "POST /api/grazing-contracts/${gc}/counter", payload: { expected_grazing_contract_version: "${gc_v4}", rate_per_head_day_cents: 80 }, as: GrazingClient }
          assert:
            - "Stale counter (expected == ${gc_v2} while version == ${gc_v4}): error_id == ERR_STALE_CONTRACT_VERSION (412); terms_version stays 2"
            - "Fresh counter: contract_status == COUNTERED, terms_version == 3, rate_per_head_day_cents == 80"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: mutation_immediately_visible_in_response
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.GrazingMove.PLANNED_to_ACTIVE]
        distinguishing_aspect: "Immediate consistency: the transition response body itself carries the new state and incremented version, and a follow-up GET agrees — no re-read lag."
        test_recipe:
          setup: ["Flock (SHEEP, 400); pasture; PLANNED move; clock inside the move window"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Imm Ranch", species: "SHEEP", baseline_headcount: 400 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/pastures", payload: { pasture_name: "Home Field", acres: 100.0, carrying_capacity_head: 400 }, as: RanchManager, captures: { pas: $.data.id } }
            - { call: "POST /api/grazing-moves", payload: { flock_id: "${fl}", pasture_id: "${pas}", move_start: "2026-09-01T00:00:00Z", move_end: "2026-09-10T00:00:00Z", head_count: 100 }, as: RangeHand, captures: { mv: $.data.id, mv_v1: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/grazing-moves/${mv}/transitions", payload: { to: "ACTIVE" }, as: RangeHand, captures: { st: $.data.move_status, vv: $.data.version } }
            - { call: "GET /api/grazing-moves/${mv}", payload: {}, as: RangeHand }
            - { call: "GET /api/pastures/${pas}", payload: {}, as: RanchManager }
          assert:
            - "Transition response: move_status == ACTIVE and version == ${mv_v1} + 1 in the same response body"
            - "GET /api/grazing-moves/${mv} agrees: move_status == ACTIVE"
            - "GET /api/pastures/${pas}: occupied_head_count == 100 and pasture_status == OCCUPIED immediately"
