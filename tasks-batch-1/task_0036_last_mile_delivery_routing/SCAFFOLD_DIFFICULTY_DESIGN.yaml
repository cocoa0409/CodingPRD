# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Last-Mile Delivery Route Optimization
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: planned_vs_committed_weight_diverge_after_one_delivery
        grounds:
          - calculations.route_load_metrics
          - entities.DeliveryRoute.fields.planned_weight_kg
          - entities.DeliveryRoute.fields.committed_weight_kg
        distinguishing_aspect: |
          On DeliveryRoute, planned_weight_kg keeps a DELIVERED stop's weight while
          committed_weight_kg drops it — same parcel set, two filters, divergent totals.
        test_recipe:
          setup:
            - "OPEN hazmat-certified center; ACTIVE driver capacity 50kg; route with two SORTED parcels routed (3.0kg, 5.0kg), dispatched; first stop DELIVERED."
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "Hub1", hazmat_certified: true, sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Dee", hazmat_certified: true, vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-A1", weight_kg: 3.0 }
              as: SortAssociate
              captures: { pa: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-A2", weight_kg: 5.0 }
              as: SortAssociate
              captures: { pb: $.data.id }
            - call: "POST /delivery/parcels/${pa}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/parcels/${pb}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-06-10", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${pa}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
              captures: { s1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${pb}", sequence: 2, window_start_min: 660, window_end_min: 720 }
              as: DispatchManager
              captures: { s2: $.data.id }
            - call: "GET /delivery/routes/${r1}"
              payload: {}
              as: DispatchManager
              captures: { rv: $.data.version }
            - call: "POST /delivery/routes/${r1}/dispatch"
              payload: { expected_route_version: "${rv}" }
              as: DispatchManager
            - call: "POST /delivery/stops/${s1}/attempts"
              payload: { outcome: "DELIVERED" }
              as: Driver
              as_user_id: "${d1}"
          trigger:
            - call: "GET /delivery/routes/${r1}"
              payload: {}
              as: DispatchManager
              captures: { planned: $.data.planned_weight_kg, committed: $.data.committed_weight_kg }
          assert:
            - "DeliveryRoute.${r1}.planned_weight_kg == 8.0"
            - "DeliveryRoute.${r1}.committed_weight_kg == 5.0"

      - name: redelivery_fee_cumulative_not_latest_only
        grounds:
          - calculations.redelivery_surcharge
          - entities.DeliveryStop.fields.redelivery_fee_cents
        distinguishing_aspect: |
          On DeliveryStop, redelivery_fee_cents accrues cumulatively across reschedules
          (630 then +855 = 1485), not the smaller latest-only value (855).
        test_recipe:
          setup:
            - "GROUND signature-required CLASS_8 hazmat parcel on a dispatched route; stop attempted then rescheduled twice (two reschedules) with hazmat-certified driver."
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "Hub2", hazmat_certified: true, sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Haz", hazmat_certified: true, vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-RD1", weight_kg: 2.0, service_level: "GROUND", signature_required: true, hazmat_class: "CLASS_8" }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-06-11", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${p1}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
              captures: { s1: $.data.id }
            - call: "GET /delivery/routes/${r1}"
              payload: {}
              as: DispatchManager
              captures: { rv: $.data.version }
            - call: "POST /delivery/routes/${r1}/dispatch"
              payload: { expected_route_version: "${rv}" }
              as: DispatchManager
            - call: "POST /delivery/stops/${s1}/attempts"
              payload: { outcome: "NO_ONE_HOME" }
              as: Driver
              as_user_id: "${d1}"
            - call: "POST /delivery/stops/${s1}/reschedule"
              payload: {}
              as: DispatchManager
            - call: "POST /delivery/stops/${s1}/attempts"
              payload: { outcome: "NO_ONE_HOME" }
              as: Driver
              as_user_id: "${d1}"
          trigger:
            - call: "POST /delivery/stops/${s1}/reschedule"
              payload: {}
              as: DispatchManager
              captures: { fee: $.data.redelivery_fee_cents }
          assert:
            - "DeliveryStop.${s1}.redelivery_fee_cents == 1485"
            - "DeliveryStop.${s1}.status == REDELIVERY_SCHEDULED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: redelivery_surcharge_multiinput_nonlinear_mode_a
        grounds:
          - calculations.redelivery_surcharge
          - entities.Parcel.fields.service_level
          - entities.Parcel.fields.signature_required
          - entities.Parcel.fields.hazmat_class
        distinguishing_aspect: |
          Mode (a): redelivery_surcharge combines tiered base by service_level,
          per-reschedule escalation, signature add, and a hazmat multiplier —
          (500+120)*1.5 = 930 for EXPRESS+signature+CLASS_8 at first reschedule.
        test_recipe:
          setup:
            - "EXPRESS signature-required CLASS_3 hazmat parcel; dispatched route; attempted once; first reschedule."
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "Hub3", hazmat_certified: true, sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Hx", hazmat_certified: true, vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-CF1", weight_kg: 1.0, service_level: "EXPRESS", signature_required: true, hazmat_class: "CLASS_3" }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-06-12", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${p1}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
              captures: { s1: $.data.id }
            - call: "GET /delivery/routes/${r1}"
              payload: {}
              as: DispatchManager
              captures: { rv: $.data.version }
            - call: "POST /delivery/routes/${r1}/dispatch"
              payload: { expected_route_version: "${rv}" }
              as: DispatchManager
            - call: "POST /delivery/stops/${s1}/attempts"
              payload: { outcome: "REFUSED" }
              as: Driver
              as_user_id: "${d1}"
          trigger:
            - call: "POST /delivery/stops/${s1}/reschedule"
              payload: {}
              as: DispatchManager
              captures: { fee: $.data.redelivery_fee_cents }
          assert:
            - "DeliveryStop.${s1}.redelivery_fee_cents == 930"

      - name: sort_handling_fee_round_per_line_then_sum_mode_b
        grounds:
          - calculations.sort_handling_fee
          - endpoints
        distinguishing_aspect: |
          Mode (b): manifest pins round-per-line-item then sum. Two 0.02kg parcels
          each raw 50.25c round to 50c -> total 100c; sum-then-round would give 101c.
        test_recipe:
          setup:
            - "Planning route with two non-cancelled stops, each parcel weight 0.02kg, to expose the round-order divergence."
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "Hub4", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Dn", vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-SF1", weight_kg: 0.02 }
              as: SortAssociate
              captures: { pa: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-SF2", weight_kg: 0.02 }
              as: SortAssociate
              captures: { pb: $.data.id }
            - call: "POST /delivery/parcels/${pa}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/parcels/${pb}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-06-13", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${pa}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${pb}", sequence: 2, window_start_min: 660, window_end_min: 720 }
              as: DispatchManager
          trigger:
            - call: "GET /delivery/routes/${r1}/manifest"
              payload: {}
              as: DispatchManager
              captures: { total: $.data.total_handling_fee_cents }
          assert:
            - "manifest.total_handling_fee_cents == 100"
            - "manifest.stop_count == 2"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: stop_redelivery_loop_cycle
        grounds:
          - state_machines.DeliveryStop.transitions.REDELIVERY_SCHEDULED_to_ATTEMPTED
          - state_machines.DeliveryStop.transitions.ATTEMPTED_to_REDELIVERY_SCHEDULED
        distinguishing_aspect: |
          DeliveryStop cycles ATTEMPTED -> REDELIVERY_SCHEDULED -> ATTEMPTED — a true
          loop (not a linear pipeline) on the DeliveryStop entity.
        test_recipe:
          setup:
            - "Dispatched route, one stop; attempt fails, reschedule (REDELIVERY_SCHEDULED), attempt fails again (back to ATTEMPTED)."
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "Hub5", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Dl", vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-CY1", weight_kg: 1.0 }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-06-14", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${p1}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
              captures: { s1: $.data.id }
            - call: "GET /delivery/routes/${r1}"
              payload: {}
              as: DispatchManager
              captures: { rv: $.data.version }
            - call: "POST /delivery/routes/${r1}/dispatch"
              payload: { expected_route_version: "${rv}" }
              as: DispatchManager
            - call: "POST /delivery/stops/${s1}/attempts"
              payload: { outcome: "NO_ONE_HOME" }
              as: Driver
              as_user_id: "${d1}"
            - call: "POST /delivery/stops/${s1}/reschedule"
              payload: {}
              as: DispatchManager
          trigger:
            - call: "POST /delivery/stops/${s1}/attempts"
              payload: { outcome: "NO_ONE_HOME" }
              as: Driver
              as_user_id: "${d1}"
              captures: { idx: $.data.attempt_index }
          assert:
            - "DeliveryStop.${s1}.status == ATTEMPTED"
            - "DeliveryStop.${s1}.attempt_count == 2"
            - "DeliveryAttempt.attempt_index == 2"

      - name: parcel_branch_delivered_vs_returned
        grounds:
          - state_machines.Parcel.transitions.ROUTED_to_DELIVERED
          - state_machines.Parcel.transitions.ROUTED_to_RETURNED
        distinguishing_aspect: |
          Parcel forks from ROUTED to either DELIVERED (successful attempt) or
          RETURNED (stop driven to FAILED) — a branch with divergent terminal states
          on the Parcel entity, distinct from DeliveryStop's cycle.
        test_recipe:
          setup:
            - "Dispatched route, one stop, attempt_count already at MAX_ATTEMPTS=3 via three failed attempts with reschedules; final reschedule drives FAILED -> parcel RETURNED."
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "Hub6", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Db", vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-BR1", weight_kg: 1.0 }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-06-15", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${p1}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
              captures: { s1: $.data.id }
            - call: "GET /delivery/routes/${r1}"
              payload: {}
              as: DispatchManager
              captures: { rv: $.data.version }
            - call: "POST /delivery/routes/${r1}/dispatch"
              payload: { expected_route_version: "${rv}" }
              as: DispatchManager
            - call: "POST /delivery/stops/${s1}/attempts"
              payload: { outcome: "NO_ONE_HOME" }
              as: Driver
              as_user_id: "${d1}"
            - call: "POST /delivery/stops/${s1}/reschedule"
              payload: {}
              as: DispatchManager
            - call: "POST /delivery/stops/${s1}/attempts"
              payload: { outcome: "NO_ONE_HOME" }
              as: Driver
              as_user_id: "${d1}"
            - call: "POST /delivery/stops/${s1}/reschedule"
              payload: {}
              as: DispatchManager
            - call: "POST /delivery/stops/${s1}/attempts"
              payload: { outcome: "NO_ONE_HOME" }
              as: Driver
              as_user_id: "${d1}"
          trigger:
            - call: "POST /delivery/stops/${s1}/reschedule"
              payload: {}
              as: DispatchManager
              captures: { st: $.data.status }
          assert:
            - "DeliveryStop.${s1}.status == FAILED"
            - "DeliveryStop.${s1}.attempt_count == 3"
            - "Parcel.${p1}.status == RETURNED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: route_cancel_cascade_depth3_to_center_count
        grounds:
          - state_machines.DeliveryRoute.transitions.PLANNING_to_CANCELLED
          - state_machines.DeliveryStop.transitions.PENDING_to_CANCELLED
          - calculations.center_sorted_count
        distinguishing_aspect: |
          Depth-3 chain: route cancel -> stop CANCELLED -> that stop's parcel reverts
          ROUTED->SORTED -> origin center.sorted_count incremented; each hop caused by
          the previous, not by the original cancel directly.
        test_recipe:
          setup:
            - "OPEN center sort_capacity 10; one SORTED parcel routed onto a PLANNING route (center.sorted_count now 0)."
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "Hub7", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Dc", vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-CA1", weight_kg: 4.0 }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-06-16", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${p1}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /delivery/routes/${r1}/cancel"
              payload: {}
              as: DispatchManager
            - call: "GET /delivery/transit-centers/${c1}"
              payload: {}
              as: DispatchManager
              captures: { sc: $.data.sorted_count }
          assert:
            - "DeliveryRoute.${r1}.status == CANCELLED"
            - "DeliveryStop.${s1}.status == CANCELLED"
            - "Parcel.${p1}.status == SORTED"
            - "Parcel.${p1}.sorted_at_center_id == ${c1}"
            - "TransitCenter.${c1}.sorted_count == 1"

      - name: attempt_delivered_cascade_depth2_to_parcel
        grounds:
          - state_machines.DeliveryStop.transitions.OUT_FOR_DELIVERY_to_DELIVERED
          - state_machines.Parcel.transitions.ROUTED_to_DELIVERED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (attempt log): stop OUT_FOR_DELIVERY
          -> DELIVERED -> parcel ROUTED -> DELIVERED, the parcel hop caused by the stop hop.
        test_recipe:
          setup:
            - "Dispatched route, one OUT_FOR_DELIVERY stop with a non-signature parcel."
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "Hub8", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Dd", vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-DL1", weight_kg: 1.0 }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-06-17", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${p1}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
              captures: { s1: $.data.id }
            - call: "GET /delivery/routes/${r1}"
              payload: {}
              as: DispatchManager
              captures: { rv: $.data.version }
            - call: "POST /delivery/routes/${r1}/dispatch"
              payload: { expected_route_version: "${rv}" }
              as: DispatchManager
          trigger:
            - call: "POST /delivery/stops/${s1}/attempts"
              payload: { outcome: "DELIVERED" }
              as: Driver
              as_user_id: "${d1}"
          assert:
            - "DeliveryStop.${s1}.status == DELIVERED"
            - "Parcel.${p1}.status == DELIVERED"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: hazmat_safety_beats_sort_capacity_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=13]
        distinguishing_aspect: |
          business_safety (ERR_HAZMAT_HUB_NOT_CERTIFIED, pri 7) outranks
          business_constraint (ERR_SORT_CAPACITY_EXCEEDED, pri 13): sorting a hazmat
          parcel into a full non-certified center returns the hazmat error.
        test_recipe:
          setup:
            - "Non-hazmat-certified center at full capacity (sort_capacity 1, already holding one SORTED non-hazmat parcel); a RECEIVED CLASS_3 hazmat parcel awaiting sort."
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "Hub9", hazmat_certified: false, sort_capacity: 1 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-FILL", weight_kg: 1.0 }
              as: SortAssociate
              captures: { pf: $.data.id }
            - call: "POST /delivery/parcels/${pf}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-HZ", weight_kg: 1.0, hazmat_class: "CLASS_3" }
              as: SortAssociate
              captures: { ph: $.data.id }
          trigger:
            - call: "POST /delivery/parcels/${ph}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_HAZMAT_HUB_NOT_CERTIFIED"
            - "response.http_status == 409"

      - name: capacity_fiscal_beats_occ_constraint
        grounds:
          - validations[priority=15]
          - validations[priority=16]
        distinguishing_aspect: |
          business_fiscal (ERR_VEHICLE_CAPACITY_EXCEEDED, pri 15) outranks the
          business_constraint OCC check (ERR_STALE_ROUTE_VERSION, pri 16): a dispatch
          that is both over-capacity AND carries a stale version returns the capacity error.
        test_recipe:
          setup:
            - "Driver capacity 5kg; route with one 9kg routed parcel; client holds a stale route version (one less than current)."
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "Hub10", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Dlow", vehicle_capacity_kg: 5 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-HV", weight_kg: 9.0 }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-06-18", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${p1}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
              captures: { s1: $.data.id }
            - call: "GET /delivery/routes/${r1}"
              payload: {}
              as: DispatchManager
              captures: { rv: $.data.version }
          trigger:
            - call: "POST /delivery/routes/${r1}/dispatch"
              payload: { expected_route_version: "${rv} - 1" }
              as: DispatchManager
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_VEHICLE_CAPACITY_EXCEEDED"
            - "response.http_status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: sort_capacity_boundary_at_capacity_rejected
        grounds:
          - validations[priority=13]
          - entities.TransitCenter.fields.sorted_count
          - entities.TransitCenter.fields.sort_capacity
        distinguishing_aspect: |
          Sorting is allowed while sorted_count < sort_capacity and rejected when
          sorted_count == sort_capacity (>= boundary): the 2nd sort into a capacity-1
          center fails. Metric: integer count via POST sort endpoint.
        test_recipe:
          setup:
            - "Center with sort_capacity 1, already holding one SORTED parcel (sorted_count == 1)."
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "Hub11", sort_capacity: 1 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-CAP1", weight_kg: 1.0 }
              as: SortAssociate
              captures: { pa: $.data.id }
            - call: "POST /delivery/parcels/${pa}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-CAP2", weight_kg: 1.0 }
              as: SortAssociate
              captures: { pb: $.data.id }
          trigger:
            - call: "POST /delivery/parcels/${pb}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_SORT_CAPACITY_EXCEEDED"
            - "TransitCenter.${c1}.sorted_count == 1"

      - name: vehicle_capacity_boundary_equal_allowed
        grounds:
          - validations[priority=15]
          - entities.DeliveryRoute.fields.committed_weight_kg
          - entities.Driver.fields.vehicle_capacity_kg
        distinguishing_aspect: |
          Dispatch is allowed when committed_weight_kg == vehicle_capacity_kg exactly
          (<= boundary, not <). Metric: numeric weight via POST dispatch endpoint —
          a different metric and endpoint from the integer sort-capacity boundary.
        test_recipe:
          setup:
            - "Driver capacity exactly 10kg; route with one routed 10.0kg parcel; correct version held."
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "Hub12", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Deq", vehicle_capacity_kg: 10 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-EQ", weight_kg: 10.0 }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-06-19", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${p1}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
              captures: { s1: $.data.id }
            - call: "GET /delivery/routes/${r1}"
              payload: {}
              as: DispatchManager
              captures: { rv: $.data.version }
          trigger:
            - call: "POST /delivery/routes/${r1}/dispatch"
              payload: { expected_route_version: "${rv}" }
              as: DispatchManager
              captures: { st: $.data.status }
          assert:
            - "DeliveryRoute.${r1}.status == DISPATCHED"
            - "DeliveryStop.${s1}.status == OUT_FOR_DELIVERY"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispatch_blocked_by_suspended_driver
        grounds:
          - state_machines.DeliveryRoute.transitions.PLANNING_to_DISPATCHED
          - entities.Driver.fields.status
        distinguishing_aspect: |
          DeliveryRoute's PLANNING->DISPATCHED depends on Driver.status: a SUSPENDED
          driver blocks dispatch (Route<-Driver pair).
        test_recipe:
          setup:
            - "Route in PLANNING with one routed parcel; its driver SUSPENDED before dispatch."
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "Hub13", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Dsus", vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-SU", weight_kg: 1.0 }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-06-20", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${p1}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
              captures: { s1: $.data.id }
            - call: "POST /delivery/drivers/${d1}/suspend"
              payload: {}
              as: DispatchManager
            - call: "GET /delivery/routes/${r1}"
              payload: {}
              as: DispatchManager
              captures: { rv: $.data.version }
          trigger:
            - call: "POST /delivery/routes/${r1}/dispatch"
              payload: { expected_route_version: "${rv}" }
              as: DispatchManager
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_DRIVER_SUSPENDED"
            - "DeliveryRoute.${r1}.status == PLANNING"

      - name: sort_blocked_by_closed_center
        grounds:
          - state_machines.Parcel.transitions.RECEIVED_to_SORTED
          - entities.TransitCenter.fields.status
        distinguishing_aspect: |
          Parcel's RECEIVED->SORTED depends on TransitCenter.status: a CLOSED center
          blocks sorting (Parcel<-TransitCenter pair, a different entity pair from Route<-Driver).
        test_recipe:
          setup:
            - "A CLOSED transit center; a RECEIVED parcel awaiting sort."
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "Hub14", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/transit-centers/${c1}/close"
              payload: {}
              as: DispatchManager
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-CL", weight_kg: 1.0 }
              as: SortAssociate
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_CENTER_CLOSED"
            - "Parcel.${p1}.status == RECEIVED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: appointment_buffered_window_conflict_on_route
        grounds:
          - validations[priority=11]
          - state_machines.Appointment.transitions.REQUESTED_to_APPLIED
        distinguishing_aspect: |
          Buffered-minute overlap on DeliveryRoute's stops: a requested window
          [610,670] is within APPOINTMENT_BUFFER_MIN=30 of an existing stop window
          ending at 600 (gap 10 < 30) -> conflict. Interval semantics: minute buffer.
        test_recipe:
          setup:
            - "Planning route with stop A window [540,600]; stop B window [800,860]; an appointment requesting B->[610,670] (10 min after A, within 30-min buffer)."
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "Hub15", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Dt", vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-W1", weight_kg: 1.0 }
              as: SortAssociate
              captures: { pa: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-W2", weight_kg: 1.0 }
              as: SortAssociate
              captures: { pb: $.data.id }
            - call: "POST /delivery/parcels/${pa}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/parcels/${pb}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-06-21", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${pa}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
              captures: { sa: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${pb}", sequence: 2, window_start_min: 800, window_end_min: 860 }
              as: DispatchManager
              captures: { sb: $.data.id }
            - call: "POST /delivery/appointments"
              payload: { stop_id: "${sb}", requested_start_min: 610, requested_end_min: 670 }
              as: CustomerServiceAgent
              captures: { ap: $.data.id }
          trigger:
            - call: "POST /delivery/appointments/${ap}/apply"
              payload: {}
              as: CustomerServiceAgent
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_APPOINTMENT_WINDOW_CONFLICT"
            - "Appointment.${ap}.status == REQUESTED"
            - "DeliveryStop.${sb}.window_start_min == 800"

      - name: driver_double_booked_same_service_date
        grounds:
          - validations[priority=14]
          - state_machines.DeliveryRoute.transitions.PLANNING_to_DISPATCHED
          - entities.DeliveryRoute.fields.service_date
        distinguishing_aspect: |
          Whole-day exclusive occupation on Driver keyed on exact service_date equality:
          a driver with an already-DISPATCHED route on 2026-06-22 cannot dispatch a
          second route on the same date. Interval semantics: full-day, exact-equality
          (distinct from the appointment minute-buffer overlap).
        test_recipe:
          setup:
            - "One driver; route R1 dispatched on 2026-06-22; second route R2 same driver same date, in PLANNING with a routed parcel and correct version."
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "Hub16", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Ddb", vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-DB1", weight_kg: 1.0 }
              as: SortAssociate
              captures: { pa: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-DB2", weight_kg: 1.0 }
              as: SortAssociate
              captures: { pb: $.data.id }
            - call: "POST /delivery/parcels/${pa}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/parcels/${pb}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-06-22", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${pa}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
            - call: "GET /delivery/routes/${r1}"
              payload: {}
              as: DispatchManager
              captures: { rv1: $.data.version }
            - call: "POST /delivery/routes/${r1}/dispatch"
              payload: { expected_route_version: "${rv1}" }
              as: DispatchManager
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-06-22", max_stops: 5 }
              as: DispatchManager
              captures: { r2: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r2}", parcel_id: "${pb}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
            - call: "GET /delivery/routes/${r2}"
              payload: {}
              as: DispatchManager
              captures: { rv2: $.data.version }
          trigger:
            - call: "POST /delivery/routes/${r2}/dispatch"
              payload: { expected_route_version: "${rv2}" }
              as: DispatchManager
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_DRIVER_DOUBLE_BOOKED"
            - "DeliveryRoute.${r2}.status == PLANNING"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: center_sorted_count_conserved_across_route_and_cancel
        grounds:
          - state_machines.DeliveryStop.transitions.PENDING_to_CANCELLED
          - state_machines.DeliveryRoute.transitions.PLANNING_to_CANCELLED
          - calculations.center_sorted_count
        distinguishing_aspect: |
          Conserved quantity = TransitCenter.sorted_count. Forward (add stop: parcel
          ROUTED, count 1->0) paired with compensating (cancel route: parcel SORTED,
          count 0->1) leaves sorted_count back at its pre-route value 1.
          Invariant: sorted_count_after == sorted_count_before_stop_add.
        test_recipe:
          setup:
            - "Center holding one SORTED parcel (sorted_count==1)."
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "Hub17", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Dci", vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-CI1", weight_kg: 2.0 }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-06-23", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${p1}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /delivery/routes/${r1}/cancel"
              payload: {}
              as: DispatchManager
            - call: "GET /delivery/transit-centers/${c1}"
              payload: {}
              as: DispatchManager
              captures: { sc: $.data.sorted_count }
          assert:
            - "TransitCenter.${c1}.sorted_count == 1"
            - "Parcel.${p1}.status == SORTED"

      - name: committed_weight_conserved_across_stop_add_and_cancel
        grounds:
          - state_machines.DeliveryStop.transitions.PENDING_to_CANCELLED
          - calculations.route_load_metrics
          - entities.DeliveryRoute.fields.committed_weight_kg
        distinguishing_aspect: |
          Conserved quantity = DeliveryRoute.committed_weight_kg (a weight, not a count).
          Forward (add stop: +2.5kg) paired with compensating (cancel stop: -2.5kg)
          returns committed_weight_kg to its pre-add value 0.0.
          Invariant: committed_weight_kg_after == committed_weight_kg_before == 0.0.
        test_recipe:
          setup:
            - "Planning route, no stops (committed_weight_kg == 0); one SORTED 2.5kg parcel."
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "Hub18", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Dcw", vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-CW1", weight_kg: 2.5 }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-06-24", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${p1}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /delivery/stops/${s1}/cancel"
              payload: {}
              as: DispatchManager
            - call: "GET /delivery/routes/${r1}"
              payload: {}
              as: DispatchManager
              captures: { cw: $.data.committed_weight_kg }
          assert:
            - "DeliveryRoute.${r1}.committed_weight_kg == 0.0"
            - "DeliveryStop.${s1}.status == CANCELLED"
            - "Parcel.${p1}.status == SORTED"
