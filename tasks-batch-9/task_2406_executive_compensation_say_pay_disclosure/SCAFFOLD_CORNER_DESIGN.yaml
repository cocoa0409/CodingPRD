      - name: non_monotonic_goal_curves_are_rejected_in_both_directions
        claim_type: triggerability
        grounds:
          - errors[ERR_GOAL_CURVE_NOT_MONOTONIC]
          - validations.priority_40_ERR_GOAL_CURVE_NOT_MONOTONIC
          - entities.IncentiveMetric.fields.direction
          - calculations.metric_payout_factor
        distinguishing_aspect: |
          Monotonicity is evaluated in the metric's own direction, so the same numeric ordering is legal for one
          direction and illegal for the other: 4.00/6.00/5.00 breaks a HIGHER_IS_BETTER curve because maximum falls
          below target, and the strictly ascending 0.60/0.65/0.70 breaks a LOWER_IS_BETTER curve where thresholds must
          descend — while 0.70/0.65/0.60 is accepted for exactly the same direction.
        test_recipe:
          setup:
            - "MINI fixture with DRAFT PayProgram P1 and no metrics yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
