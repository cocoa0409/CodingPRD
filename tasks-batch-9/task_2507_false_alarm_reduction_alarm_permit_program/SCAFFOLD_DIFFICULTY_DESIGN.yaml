            - "AlarmSite.${site_id}.outstanding_balance_cents == 16500 (only the three permit-issue invoices remain open)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pair_a_open_dispatch_request_outranks_police_response_suspended_on_the_same_post
        grounds:
          - "validations[priority=18]"
          - "validations[priority=26]"
          - entities.AlarmSite.fields.response_status
        distinguishing_aspect: >-
          A dispatch request naming a system that already has a VALIDATED (open) request AND sitting at
          a site whose response_status is RESPONSE_SUSPENDED violates priority 18 and priority 26 at
          once; the response must be 409 ERR_OPEN_DISPATCH_REQUEST_EXISTS, while the very same request
          aimed at a never-used sibling system of the same suspended site returns 409
          ERR_POLICE_RESPONSE_SUSPENDED.
        test_recipe:
          setup:
            - "One ACTIVE FeeSchedule with free_alarm_allowance 0, a single tier [1..null: 10000], probation_threshold_count 1, suspension_threshold_count 1, invoice_due_days 3650."
            - "One RESIDENTIAL AlarmSite with three ACTIVE ECV-callable contacts and three PERMITTED systems: sysA (carries an open VALIDATED request), sysB (carries the counted incident), sysC (never used)."
            - "sysA's request is submitted and validated on 2026-01-05, while the site is still RESPONSE_ACTIVE, so it stays open forever in VALIDATED."
            - "sysB's request is dispatched on 2026-01-06 and determined COUNTED, which pushes chargeable_count_window to 1 == suspension_threshold_count and auto-creates a PROPOSED SuspensionOrder for 2026-01-16 .. 2026-02-15."
            - "The order is served on 2026-01-10 (clock <= effective_from) and the clock is then moved to 2026-01-20, inside the effective interval, so response_status is RESPONSE_SUSPENDED."
          setup_api_calls:
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-01-01T00:00:00Z"}, as: ProgramAdministrator}
            - call: "POST /false-alarm-program/fee-schedules"
