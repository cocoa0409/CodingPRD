  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: stand_not_inventoried_at_55_beats_insufficient_tons_at_80
        grounds:
          - "validations[priority=55]"
          - "validations[priority=80]"
          - state_machines.Stand.CRUISE_OPEN_to_INVENTORIED
          - entities.Stand.fields.available_tons
        distinguishing_aspect: |
          A CRUISE_OPEN stand with five plots already measured violates BOTH rules on the
          same POST /timberland/harvest-blocks: the stand is not INVENTORIED (priority 55)
          and its available_tons is 0.00 so the 5000.00-ton request also exceeds supply
          (priority 80). The response must be ERR_STAND_NOT_INVENTORIED / 409, never
          ERR_INSUFFICIENT_AVAILABLE_TONS / 422 — and the control call proves the second
          rule is genuinely live once the cruise closes.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Canonical fund and 'Piney Creek Tract' property created (acquisition is not required to create a harvest block)."
            - "Stand PC-01 of 120.00 acres with all five canonical cruise plots posted but the cruise deliberately left OPEN, so status is CRUISE_OPEN, net_merch_tons 0.00 and available_tons 0.00."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FundAdmin
            - call: "POST /timberland/funds"
              payload: { name: "Longleaf Timber Fund I", vintage_year: 2025, committed_capital_usd: 500000.00, target_cash_yield_bps: 0, opening_cash_usd: 400000.00 }
              as: FundAdmin
              captures: { fund_id: "$.data.id" }
            - call: "POST /timberland/properties"
              payload: { fund_id: "${fund_id}", name: "Piney Creek Tract", region_code: "SOUTH", total_acres: 1200.00, haul_distance_miles: 62, insured_value_usd: 4200000.00, hbu_acres: 0.00, hbu_price_per_acre_usd: 0.00, annual_rec_income_usd: 0.00, certification_scheme: "SFI" }
              as: AcquisitionAnalyst
              captures: { prop_id: "$.data.id" }
            - call: "POST /timberland/stands"
              payload: { property_id: "${prop_id}", stand_code: "PC-01", acres: 120.00, species_code: "LOBLOLLY_PINE", age_years: 22, site_index: 78 }
              as: ForestManager
              captures: { stand_id: "$.data.id", stand_v: "$.data.version" }
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 1, tons_per_acre: 41.37, defect_pct: 6.5, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 2, tons_per_acre: 38.94, defect_pct: 4.25, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 3, tons_per_acre: 44.06, defect_pct: 9.75, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 4, tons_per_acre: 39.51, defect_pct: 3.5, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 5, tons_per_acre: 42.88, defect_pct: 7.25, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
          trigger:
            - call: "POST /timberland/harvest-blocks"
              payload: { stand_id: "${stand_id}", planned_start_date: "2027-06-01", planned_end_date: "2027-09-30", planned_tons: 5000.00, product_mix: "MIXED", expected_stumpage_price_usd_per_ton: 58.00, price_index_factor: 1.05, expected_haul_distance_miles: 140, growth_variant: "YIELD_TABLE", expected_stand_version: "${stand_v}" }
              as: ForestManager
              captures: { err1: "$.data.error_id" }
            - call: "POST /timberland/stands/${stand_id}/cruise-close"
              payload: {}
              as: ForestManager
              captures: { stand_v2: "$.data.version" }
            - call: "POST /timberland/harvest-blocks"
              payload: { stand_id: "${stand_id}", planned_start_date: "2027-06-01", planned_end_date: "2027-09-30", planned_tons: 5000.00, product_mix: "MIXED", expected_stumpage_price_usd_per_ton: 58.00, price_index_factor: 1.05, expected_haul_distance_miles: 140, growth_variant: "YIELD_TABLE", expected_stand_version: "${stand_v2}" }
              as: ForestManager
              captures: { err2: "$.data.error_id" }
          assert:
            - "first response: HTTP 409 and ${err1} == ERR_STAND_NOT_INVENTORIED"
