              as: RespiratoryTherapist
              captures: { ar7: $.data.id }
            - call: "POST /sleep-therapy/adherence-reports/${ar7}/begin-review"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/adherence-reports/${ar7}/finalize"
              payload: {}
