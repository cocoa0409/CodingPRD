scenario: |
  Generate task harder than expert level!

  2488. Golf Course Agronomy & Maintenance Operations (golf course superintendent): annual agronomic plan across fertility, aeration, topdressing and pest management by turf area, irrigation scheduling with soil moisture monitoring, water source constraints and pump station management, pesticide and fertilizer application records with licensing, buffer zones and posting requirements, course setup with hole locations, mowing heights and tournament preparation schedules, weather event response including frost delays, cart restrictions and storm damage cleanup, equipment fleet maintenance, replacement planning and technician staffing, labor scheduling around play with simultaneous-start events and maintenance windows, playing condition measurement with green speed and firmness monitoring
domain_name: golf-course-agronomy-maintenance-operations
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a top-level collection joined by explicit foreign keys.
  # No entity id appears as a path prefix segment of another entity's collection;
  # parent scoping is always expressed by an FK field in the request body and by
  # a filtered-list GET on the child collection.

  state_machine_shape: parallel
  # Application carries two independent dimensions (record_status x posting_status);
  # PlayEvent carries two independent dimensions (status x readiness_status) and its
  # readiness dimension is cyclic (FAILED -> CERTIFIED). MaintenanceWindow is cyclic
  # (SCHEDULED -> DEFERRED -> SCHEDULED), AgronomicPlan is cyclic (SUBMITTED -> DRAFT)
  # and compound (ACTIVE -> CLOSED derived from child PlanTask states), EquipmentUnit
  # is cyclic (IN_SERVICE -> DOWN_FOR_SERVICE -> IN_SERVICE) with a threshold-driven
  # auto-transition, and Course is posture_driven (water_posture / play_posture are
  # derived aggregates that gate child operations).

  relationship_patterns:
    - one_to_many          # Course -> TurfArea / PumpStation / PlayEvent / EquipmentUnit / WeatherEvent
    - self_referential     # EquipmentUnit.replaced_by_unit_id -> EquipmentUnit.id
    - cross_aggregate      # Application -> PlanTask (agronomic plan aggregate) and -> TurfArea (course aggregate)
    - polymorphic: false   # no polymorphic references in this scaffold

  role_model: segregation_of_duties
  # The Applicator who recorded an Application may never verify it; verification
  # requires a different Applicator identity. Superintendent / Agronomist /
  # TournamentOfficial / EquipmentTechnician own disjoint write surfaces.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities, 61 endpoints, 51 error codes, 51 validation rules in one total
  # priority order, 10 calculations (2 dual-variant, 6 distinct algorithm types),
  # 9 state machines (2 parallel, 4 cyclic, 1 compound, 1 posture-driven),
  # 3 OCC parents / 4 OCC rules, 3 distinct interval-overlap geometries,
  # 3 cascade chains of depth 3-4.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Course
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Course name.
        constraints: non-empty, max 120 chars
      - name: region_code
        type: string
        source: input
        description: Regulatory region code governing pesticide posting rules.
        constraints: exactly 2 uppercase letters
      - name: annual_water_allocation_gal
        type: number
        source: input
        description: Permitted annual withdrawal volume in gallons for non-exempt sources.
        constraints: "> 0"
      - name: water_restricted_threshold_pct
        type: number
        source: input
        default: 80
        description: Percent of annual allocation at or above which water_posture becomes RESTRICTED.
        constraints: "0 < value < water_suspended_threshold_pct"
      - name: water_suspended_threshold_pct
        type: number
        source: input
        default: 100
        description: Percent of annual allocation at or above which water_posture becomes SUSPENDED.
        constraints: "> water_restricted_threshold_pct"
      - name: water_used_gal
        type: number
        source: computed
        default: 0
        description: Ledger field; equals the sum of volume_gal over IrrigationRun rows whose status == COMPLETED and whose pump_station_id belongs to this Course. Recomputed on every irrigation completion and reversal.
        constraints: ">= 0, 1 decimal place"
      - name: water_posture
        type: enum
        source: computed
        default: OPEN
        description: Derived water gate; see calculations.course_water_posture.
        constraints: "OPEN | RESTRICTED | SUSPENDED"
      - name: play_posture
        type: enum
        source: computed
        default: OPEN
        description: Derived play gate; see calculations.course_play_posture.
        constraints: "OPEN | FROST_DELAY | CART_PATH_ONLY | CLOSED"
      - name: frost_delay_minutes
        type: integer
        source: computed
        default: 0
        description: delay_minutes of the governing ACTIVE FROST WeatherEvent (selector pinned in calculations.course_play_posture); 0 when play_posture != FROST_DELAY.
        constraints: ">= 0"
    note: >
      Posture-driven aggregate root. Every mutation to water_used_gal, allocation,
      or governing WeatherEvent set bumps Course.version, which is the OCC parent
      for concurrency_rules.weather-declare-stale-course.

  - name: TurfArea
    parent: null
    common_fields: true
    fields:
      - name: course_id
        type: string
        source: input
        description: FK -> Course.id; the course this turf area belongs to.
      - name: area_type
        type: enum
        source: input
        description: Turf classification driving mowing height and nutrient limits.
        constraints: "GREEN | TEE | FAIRWAY | ROUGH | APPROACH | PRACTICE_GREEN"
      - name: hole_number
        type: integer
        source: input
        description: Hole this area serves; null only when area_type == PRACTICE_GREEN.
        constraints: "1..18 inclusive, or null iff area_type == PRACTICE_GREEN"
      - name: area_sq_ft
        type: number
        source: input
        description: Maintained square footage; the denominator for lb-per-1000-sq-ft nutrient math and the multiplier for irrigation demand.
        constraints: "> 0"
      - name: mowing_height_mm
        type: number
        source: input
        description: Current bench setting height of cut in millimetres.
        constraints: "> 0, <= 120"
      - name: distance_to_water_ft
        type: number
        source: input
        description: Shortest distance from this area to the nearest surface water feature; compared against PesticideProduct.min_buffer_ft.
        constraints: ">= 0"
      - name: soil_type
        type: enum
        source: input
        description: Rootzone classification.
        constraints: "SAND_USGA | NATIVE_LOAM | PUSH_UP_CLAY"
      - name: target_moisture_pct
        type: number
        source: input
        default: 18
        description: Volumetric water content target used as the reference point for playability moisture scoring.
        constraints: "> 0, < 60"
      - name: current_moisture_pct
        type: number
        source: computed
        description: moisture_pct of the latest PlayabilityReading for this area, selected by measured_at DESC then created_at DESC; null when this area has no readings.
      - name: agronomic_status
        type: enum
        source: system
        default: ACTIVE
        description: Play/renovation gate. Set to UNDER_RENOVATION while an AERATION MaintenanceWindow on this area is IN_PROGRESS, to OUT_OF_PLAY by a STORM_DAMAGE WeatherEvent naming this area, and back to ACTIVE when that window completes or that weather event clears.
        constraints: "ACTIVE | UNDER_RENOVATION | OUT_OF_PLAY"
      - name: nitrogen_applied_lb_per_1000_ytd
        type: number
        source: computed
        default: 0
        description: Applied-actual nitrogen load; see calculations.turf_nitrogen_load variant applied_actual.
        constraints: ">= 0, 3 decimal places"
      - name: nitrogen_projected_lb_per_1000
        type: number
        source: computed
        default: 0
        description: Planned-commitment nitrogen load; see calculations.turf_nitrogen_load variant planned_commitment.
        constraints: ">= 0, 3 decimal places"
      - name: rei_expires_at
        type: datetime
        source: computed
        description: Latest rei_expires_at over Application rows on this area whose posting_status == POSTED; null when no such row exists. Gates maintenance entry.

  - name: AgronomicPlan
    parent: null
    common_fields: true
    fields:
      - name: course_id
        type: string
        source: input
        description: FK -> Course.id; the course this annual plan governs.
      - name: plan_year
        type: integer
        source: input
        description: Calendar year the plan covers.
        constraints: "2020..2100; unique per (course_id, plan_year)"
      - name: nitrogen_budget_lb
        type: number
        source: input
        description: Total pounds of nitrogen the plan may commit across all of its tasks.
        constraints: "> 0"
      - name: committed_nitrogen_lb
        type: number
        source: computed
        default: 0
        description: Ledger field; see calculations.plan_nitrogen_commitment_lb.
        constraints: ">= 0, 2 decimal places"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Plan lifecycle state; see state_machines.AgronomicPlan.
        constraints: "DRAFT | SUBMITTED | ACTIVE | CLOSED"
      - name: return_count
        type: integer
        source: computed
        default: 0
        description: Number of times this plan has been returned SUBMITTED -> DRAFT; caps the revision cycle at MAX_PLAN_RETURNS.
        constraints: "0..2"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID captured on DRAFT -> SUBMITTED and cleared to null on SUBMITTED -> DRAFT. Not a foreign key; it is an opaque caller identity, and the approver's X-User-ID must differ from it (segregation of duties). Null while the plan has never been submitted.

  - name: PlanTask
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: FK -> AgronomicPlan.id; the plan that owns this task.
      - name: turf_area_id
        type: string
        source: input
        description: FK -> TurfArea.id; the area the task is performed on.
      - name: task_type
        type: enum
        source: input
        description: Agronomic operation class.
        constraints: "FERTILITY | AERATION | TOPDRESSING | PEST_CONTROL"
      - name: nitrogen_lb_per_1000
        type: number
        source: input
        description: Planned nitrogen rate in pounds per 1000 square feet; required and > 0 when task_type == FERTILITY, must be omitted or null otherwise.
        constraints: "null, or 0 < value <= 6"
      - name: commitment_lb
        type: number
        source: computed
        default: 0
        description: Per-task nitrogen commitment; see calculations.plan_nitrogen_commitment_lb step 1.
        constraints: ">= 0, 2 decimal places"
      - name: planned_window_start
        type: datetime
        source: input
        description: Inclusive earliest instant the task may be executed.
      - name: planned_window_end
        type: datetime
        source: input
        description: Exclusive latest instant the task may be executed.
        constraints: "> planned_window_start"
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: Task lifecycle state; see state_machines.PlanTask.
        constraints: "PLANNED | SCHEDULED | COMPLETED | CANCELLED"

  - name: Applicator
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Licensed applicator name.
        constraints: non-empty, max 120 chars
      - name: license_number
        type: string
        source: input
        description: State pesticide applicator license number.
        constraints: non-empty, globally unique
      - name: license_category
        type: enum
        source: input
        description: Categories this license authorises.
        constraints: "CAT_3_TURF | CAT_7_AQUATIC | CAT_3_AND_7"
      - name: license_expires_on
        type: string
        source: input
        description: License expiry calendar date, ISO 8601 date (YYYY-MM-DD). The license remains usable through the whole of this date.
      - name: license_status
        type: enum
        source: computed
        default: ACTIVE
        description: >
          ACTIVE while date(logical clock) <= license_expires_on and no suspension is
          recorded; EXPIRED when date(logical clock) > license_expires_on; SUSPENDED
          once any Application recorded by this applicator has been voided with
          void_reason == SAFETY_VIOLATION. SUSPENDED outranks EXPIRED.
        constraints: "ACTIVE | EXPIRED | SUSPENDED"
      - name: suspended_at
        type: datetime
        source: system
        description: Logical-clock instant at which the safety suspension was recorded; null while never suspended.

  - name: PesticideProduct
    parent: null
    common_fields: false
    fields:
      - name: trade_name
        type: string
        source: input
        description: Product trade name.
        constraints: non-empty, max 120 chars
      - name: epa_reg_no
        type: string
        source: input
        description: EPA registration number.
        constraints: non-empty
      - name: requires_license_category
        type: enum
        source: input
        description: License category an applicator must hold to apply this product.
        constraints: "CAT_3_TURF | CAT_7_AQUATIC"
      - name: rei_hours
        type: integer
        source: input
        description: Restricted-entry interval in hours after application during which the treated area is closed to maintenance entry.
        constraints: ">= 0, <= 336"
      - name: min_buffer_ft
        type: number
        source: input
        description: Minimum permitted distance from surface water for this product.
        constraints: ">= 0"
      - name: max_wind_speed_mph
        type: number
        source: input
        description: Maximum permitted wind speed at time of application.
        constraints: "> 0"
      - name: posting_required
        type: boolean
        source: input
        description: Whether a re-entry notice must be posted at the treated area.
      - name: nitrogen_pct
        type: number
        source: input
        default: 0
        description: Nitrogen content of the product by weight, in percent.
        constraints: "0 <= value <= 100"
    note: >
      Immutable configuration record (common_fields false): carries only id and
      created_at, has no version field, and no update endpoint.

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: turf_area_id
        type: string
        source: input
        description: FK -> TurfArea.id; the treated area.
      - name: product_id
        type: string
        source: input
        description: FK -> PesticideProduct.id; the product applied.
      - name: applicator_id
        type: string
        source: input
        description: FK -> Applicator.id; the licensed applicator who performed the application.
      - name: plan_task_id
        type: string
        source: input
        description: FK -> PlanTask.id; the plan task this application satisfies, or null for unplanned applications.
      - name: applied_at
        type: datetime
        source: input
        description: Instant the application was made; must not be after the logical clock.
      - name: rate_lb_per_acre
        type: number
        source: input
        description: Product rate applied, pounds per acre.
        constraints: "> 0"
      - name: wind_speed_mph
        type: number
        source: input
        description: Observed wind speed at time of application.
        constraints: ">= 0"
      - name: distance_to_water_ft
        type: number
        source: input
        description: Observed distance from the treated swath to surface water at time of application.
        constraints: ">= 0"
      - name: total_lb
        type: number
        source: computed
        description: Total product mass applied; see calculations.application_mass_and_nitrogen.
        constraints: ">= 0, 2 decimal places"
      - name: nitrogen_lb
        type: number
        source: computed
        description: Nitrogen mass applied; see calculations.application_mass_and_nitrogen.
        constraints: ">= 0, 2 decimal places"
      - name: rei_expires_at
        type: datetime
        source: computed
        description: applied_at plus PesticideProduct.rei_hours hours.
      - name: record_status
        type: enum
        source: system
        default: RECORDED
        description: Record-integrity dimension; see state_machines.Application (record dimension).
        constraints: "RECORDED | VERIFIED | VOIDED"
      - name: posting_status
        type: enum
        source: system
        description: Posting dimension, independent of record_status; NOT_REQUIRED at creation when the product's posting_required is false, otherwise POSTED. See state_machines.Application (posting dimension).
        constraints: "NOT_REQUIRED | POSTED | RELEASED"
      - name: verified_by_applicator_id
        type: string
        source: system
        description: FK -> Applicator.id; the applicator who verified this record, null until verified.
      - name: void_reason
        type: enum
        source: input
        description: Reason supplied when the record is voided; null while record_status != VOIDED.
        constraints: "DATA_ENTRY_ERROR | SAFETY_VIOLATION"

  - name: PumpStation
    parent: null
    common_fields: true
    fields:
      - name: course_id
        type: string
        source: input
        description: FK -> Course.id; the course this station serves.
      - name: source_type
        type: enum
        source: input
        description: Water source. RECLAIMED sources are exempt from the annual allocation check.
        constraints: "WELL | POND | RECLAIMED"
      - name: max_flow_gpm
        type: number
        source: input
        description: Maximum instantaneous station output in gallons per minute.
        constraints: "> 0"
      - name: max_concurrent_zones
        type: integer
        source: input
        description: Maximum number of irrigation runs that may occupy overlapping windows on this station.
        constraints: ">= 1"
      - name: daily_withdrawal_cap_gal
        type: number
        source: input
        description: Maximum gallons this station may withdraw on a single calendar day.
        constraints: "> 0"
      - name: withdrawn_today_gal
        type: number
        source: computed
        default: 0
        description: Sum of volume_gal over IrrigationRun rows on this station whose status == COMPLETED and whose window_start calendar date equals the logical clock's calendar date.
        constraints: ">= 0, 1 decimal place"
      - name: status
        type: enum
        source: system
        default: ONLINE
        description: >
          ONLINE normally; mirrored to RESTRICTED automatically whenever the owning
          Course.water_posture is RESTRICTED or SUSPENDED and back to ONLINE when it
          returns to OPEN; OFFLINE only via the explicit status endpoint, which also
          survives posture changes until set back to ONLINE.
        constraints: "ONLINE | RESTRICTED | OFFLINE"

  - name: IrrigationRun
    parent: null
    common_fields: true
    fields:
      - name: pump_station_id
        type: string
        source: input
        description: FK -> PumpStation.id; the station supplying this run.
      - name: turf_area_id
        type: string
        source: input
        description: FK -> TurfArea.id; the irrigated area.
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the irrigation window.
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the irrigation window.
        constraints: "> window_start; duration must be a whole number of minutes, 1..720"
      - name: target_moisture_deficit_pct
        type: number
        source: input
        description: Volumetric moisture deficit to replace, in percentage points.
        constraints: ">= 0, <= 60"
      - name: allotted_gal
        type: number
        source: computed
        description: Gallons authorised for this run; see calculations.irrigation_run_allotment.
        constraints: ">= 0, 1 decimal place"
      - name: flow_gpm
        type: number
        source: computed
        description: allotted_gal divided by the window duration in minutes, rounded half-up to 2 decimals.
        constraints: ">= 0, 2 decimal places"
      - name: volume_gal
        type: number
        source: computed
        default: 0
        description: Gallons actually withdrawn; 0 while SCHEDULED, set on completion, returned to 0 on reversal.
        constraints: ">= 0, 1 decimal place"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: Run lifecycle state; see state_machines.IrrigationRun.
        constraints: "SCHEDULED | COMPLETED | REVERSED | CANCELLED"

  - name: MaintenanceWindow
    parent: null
    common_fields: true
    fields:
      - name: course_id
        type: string
        source: input
        description: FK -> Course.id; the course the crew works on.
      - name: turf_area_id
        type: string
        source: input
        description: FK -> TurfArea.id; the area the crew occupies.
      - name: plan_task_id
        type: string
        source: system
        description: FK -> PlanTask.id; set when a PlanTask is scheduled onto this window, cleared to null when the window is cancelled.
      - name: task_type
        type: enum
        source: input
        description: Crew operation class. STORM_CLEANUP is the only class permitted on an OUT_OF_PLAY area or a CLOSED course.
        constraints: "FERTILITY | AERATION | TOPDRESSING | PEST_CONTROL | MOWING | STORM_CLEANUP"
      - name: window_start
        type: datetime
        source: input
        description: Start of the crew occupation interval.
      - name: window_end
        type: datetime
        source: input
        description: End of the crew occupation interval.
        constraints: "> window_start; duration must be a whole number of minutes, 1..600"
      - name: crew_size
        type: integer
        source: input
        description: Number of technicians assigned to the window.
        constraints: "1..40"
      - name: required_unit_type
        type: enum
        source: input
        description: EquipmentUnit type the window depends on, or null when no specific machine is needed.
        constraints: "null | TRIPLEX_GREENS_MOWER | FAIRWAY_MOWER | SPRAYER | AERATOR | TOPDRESSER"
      - name: crew_hours
        type: number
        source: computed
        description: crew_size multiplied by the window duration in hours, rounded half-up to 2 decimals.
        constraints: "> 0, 2 decimal places"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: Window lifecycle state; see state_machines.MaintenanceWindow.
        constraints: "SCHEDULED | DEFERRED | IN_PROGRESS | COMPLETED | CANCELLED"
      - name: deferral_count
        type: integer
        source: computed
        default: 0
        description: Number of times this window has been deferred; caps the defer/reschedule cycle at MAX_WINDOW_DEFERRALS.
        constraints: "0..2"

  - name: PlayEvent
    parent: null
    common_fields: true
    fields:
      - name: course_id
        type: string
        source: input
        description: FK -> Course.id; the course being played.
      - name: event_type
        type: enum
        source: input
        description: >
          STANDARD_TEE_TIMES and TOURNAMENT_ROUND send groups off hole 1 in
          sequence; SHOTGUN_START starts every group on its own hole at the same
          posted instant, so it occupies all holes in play for the whole interval.
        constraints: "STANDARD_TEE_TIMES | SHOTGUN_START | TOURNAMENT_ROUND"
      - name: start_at
        type: datetime
        source: input
        description: Posted first-tee instant.
      - name: end_at
        type: datetime
        source: input
        description: Exclusive end of the play interval.
        constraints: "> start_at"
      - name: holes_in_play
        type: integer
        source: input
        description: Number of consecutive holes starting at hole 1 that the event occupies.
        constraints: "9 or 18"
      - name: field_size
        type: integer
        source: input
        description: Number of players in the field.
        constraints: "1..288"
      - name: delayed_minutes
        type: integer
        source: computed
        default: 0
        description: effective_start_at minus start_at in whole minutes; see calculations.frost_release_schedule.
        constraints: ">= 0"
      - name: effective_start_at
        type: datetime
        source: computed
        description: Actual first-tee instant after frost pushback; equals start_at while delayed_minutes == 0.
      - name: readiness_index
        type: number
        source: computed
        description: Composite playing-condition score at certification; null until certified or failed. See calculations.tournament_readiness_index.
        constraints: "0..100, 2 decimal places"
      - name: readiness_status
        type: enum
        source: system
        default: PENDING
        description: Certification dimension, independent of status; see state_machines.PlayEvent (readiness dimension).
        constraints: "PENDING | CERTIFIED | FAILED"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: Schedule dimension; see state_machines.PlayEvent (schedule dimension).
        constraints: "SCHEDULED | DELAYED | CANCELLED"

  - name: EquipmentUnit
    parent: null
    common_fields: true
    fields:
      - name: course_id
        type: string
        source: input
        description: FK -> Course.id; the course this unit is assigned to.
      - name: replaced_by_unit_id
        type: string
        source: system
        description: FK -> EquipmentUnit.id; self-referential successor pointer set when this unit is retired with a named replacement, null otherwise.
      - name: unit_type
        type: enum
        source: input
        description: Machine class.
        constraints: "TRIPLEX_GREENS_MOWER | FAIRWAY_MOWER | SPRAYER | AERATOR | TOPDRESSER"
      - name: model_year
        type: integer
        source: input
        description: Model year, used for the age term of the replacement score.
        constraints: "1990..2100"
      - name: purchase_cost
        type: number
        source: input
        description: Acquisition cost in dollars.
        constraints: "> 0"
      - name: expected_life_hours
        type: number
        source: input
        description: Design service life in engine hours; denominator of the usage term.
        constraints: "> 0"
      - name: service_interval_hours
        type: number
        source: input
        description: Engine hours between scheduled services; denominator of the overdue term and the auto-down threshold.
        constraints: "> 0"
      - name: avg_daily_hours
        type: number
        source: input
        description: Average engine hours accrued per calendar day, used only by the fy_projection variant of the replacement score.
        constraints: ">= 0"
      - name: initial_engine_hours
        type: number
        source: input
        default: 0
        description: Engine hours on the meter when the unit was entered into the fleet.
        constraints: ">= 0"
      - name: engine_hours
        type: number
        source: computed
        description: initial_engine_hours plus the sum of hours_added over every accepted log-hours call on this unit.
        constraints: ">= 0, 1 decimal place"
      - name: hours_since_service
        type: number
        source: computed
        default: 0
        description: engine_hours minus engine_hours_at_last_service.
        constraints: ">= 0, 1 decimal place"
      - name: engine_hours_at_last_service
        type: number
        source: computed
        description: engine_hours as of the most recent completed service; equals initial_engine_hours until the first service.
        constraints: ">= 0, 1 decimal place"
      - name: replacement_score
        type: number
        source: computed
        default: 0
        description: Point-in-time capital-replacement score; see calculations.equipment_replacement_score variant as_of_now.
        constraints: "0..100, 1 decimal place"
      - name: replacement_score_projected
        type: number
        source: computed
        default: 0
        description: Fiscal-year-end projected capital-replacement score; see calculations.equipment_replacement_score variant fy_projection.
        constraints: "0..100, 1 decimal place"
      - name: replacement_flag
        type: boolean
        source: computed
        default: false
        description: True when replacement_score_projected >= REPLACEMENT_FLAG_THRESHOLD.
      - name: status
        type: enum
        source: system
        default: IN_SERVICE
        description: Fleet state; see state_machines.EquipmentUnit.
        constraints: "IN_SERVICE | DOWN_FOR_SERVICE | RETIRED"

  - name: PlayabilityReading
    parent: null
    common_fields: false
    fields:
      - name: turf_area_id
        type: string
        source: input
        description: FK -> TurfArea.id; the measured area.
      - name: measured_at
        type: datetime
        source: input
        description: Instant of measurement; must not be after the logical clock.
      - name: green_speed_ft
        type: number
        source: input
        description: Stimpmeter reading in feet.
        constraints: "> 0, <= 16"
      - name: firmness_gravities
        type: number
        source: input
        description: Surface firmness in gravities.
        constraints: "> 0, <= 4"
      - name: moisture_pct
        type: number
        source: input
        description: Volumetric water content in percent.
        constraints: ">= 0, <= 60"
      - name: within_tournament_spec
        type: boolean
        source: computed
        description: True when abs(green_speed_ft - TARGET_SPEED_FT) <= TOLERANCE_SPEED_FT and abs(firmness_gravities - TARGET_FIRMNESS) <= TOLERANCE_FIRMNESS, both inclusive.
    note: >
      Append-only measurement event (common_fields false): carries only id and
      created_at, has no version field, and no update or delete endpoint.

  - name: WeatherEvent
    parent: null
    common_fields: true
    fields:
      - name: course_id
        type: string
        source: input
        description: FK -> Course.id; the affected course.
      - name: event_type
        type: enum
        source: input
        description: Weather class driving the play posture and the cleanup surface.
        constraints: "FROST | LIGHTNING | HEAVY_RAIN | STORM_DAMAGE"
      - name: delay_minutes
        type: integer
        source: input
        default: 0
        description: Frost pushback in minutes; must be > 0 when event_type == FROST and exactly 0 otherwise.
        constraints: "0..600"
      - name: expected_clear_at
        type: datetime
        source: input
        description: Instant at which the event is expected to end; the exclusive upper bound of the affected interval.
        constraints: "> declared_at"
      - name: affected_turf_area_ids
        type: array
        source: input
        description: Array of TurfArea.id values (each must satisfy TurfArea.course_id == this WeatherEvent.course_id) put OUT_OF_PLAY by this event; must be non-empty when event_type == STORM_DAMAGE and empty otherwise. Reverse lookup via GET /turf-areas?course_id=.
      - name: declared_at
        type: datetime
        source: system
        description: Logical-clock instant at which the event was declared; the inclusive lower bound of the affected interval.
      - name: cleared_at
        type: datetime
        source: system
        description: Logical-clock instant at which the event was cleared; null while ACTIVE.
      - name: deferred_window_count
        type: integer
        source: computed
        default: 0
        description: Number of MaintenanceWindow rows this event deferred at declaration time.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: Event state; see state_machines.WeatherEvent.
        constraints: "ACTIVE | CLEARED"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Course
    initial_state: OPEN
    terminal_states: []
    note: >
      Course carries two derived posture dimensions that evolve independently:
      water_posture (OPEN / RESTRICTED / SUSPENDED, recomputed by
      calculations.course_water_posture) and play_posture (OPEN / FROST_DELAY /
      CART_PATH_ONLY / CLOSED, recomputed by calculations.course_play_posture).
      Neither posture is ever written directly by a client. The `from`/`to`
      values below name water_posture values; the play_posture dimension is
      driven entirely by the WeatherEvent machine's side effects.
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system: recompute after POST /irrigation-runs/{id}/complete, POST /irrigation-runs/{id}/reverse, or PATCH /courses/{id}/water-allocation"
        actor: system
        preconditions:
          - "water_used_gal / annual_water_allocation_gal * 100 >= water_restricted_threshold_pct"
          - "water_used_gal / annual_water_allocation_gal * 100 < water_suspended_threshold_pct"
        side_effects:
          - "Course.water_posture := RESTRICTED; Course.version incremented by 1"
          - "every PumpStation with this course_id and status == ONLINE is set to RESTRICTED, bumping that PumpStation.version by 1"
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "system: recompute after POST /irrigation-runs/{id}/complete or PATCH /courses/{id}/water-allocation"
        actor: system
        preconditions:
          - "water_used_gal / annual_water_allocation_gal * 100 >= water_suspended_threshold_pct"
        side_effects:
          - "Course.water_posture := SUSPENDED; Course.version incremented by 1"
          - "every IrrigationRun with status == SCHEDULED whose pump_station_id belongs to this course transitions SCHEDULED -> CANCELLED (see state_machines.IrrigationRun)"
      - from: SUSPENDED
        to: OPEN
        trigger: "system: recompute after POST /irrigation-runs/{id}/reverse or PATCH /courses/{id}/water-allocation"
        actor: system
        preconditions:
          - "water_used_gal / annual_water_allocation_gal * 100 < water_restricted_threshold_pct"
        side_effects:
          - "Course.water_posture := OPEN; Course.version incremented by 1"
          - "every PumpStation with this course_id and status == RESTRICTED is set to ONLINE, bumping that PumpStation.version by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "system: recompute after POST /irrigation-runs/{id}/reverse or PATCH /courses/{id}/water-allocation"
        actor: system
        preconditions:
          - "water_used_gal / annual_water_allocation_gal * 100 < water_restricted_threshold_pct"
        side_effects:
          - "Course.water_posture := OPEN; Course.version incremented by 1"
          - "every PumpStation with this course_id and status == RESTRICTED is set to ONLINE, bumping that PumpStation.version by 1"
      - from: SUSPENDED
        to: RESTRICTED
        trigger: "system: recompute after POST /irrigation-runs/{id}/reverse or PATCH /courses/{id}/water-allocation"
        actor: system
        preconditions:
          - "water_used_gal / annual_water_allocation_gal * 100 >= water_restricted_threshold_pct"
          - "water_used_gal / annual_water_allocation_gal * 100 < water_suspended_threshold_pct"
        side_effects:
          - "Course.water_posture := RESTRICTED; Course.version incremented by 1"

  - entity: AgronomicPlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    note: "Cyclic (SUBMITTED -> DRAFT revision loop, capped at MAX_PLAN_RETURNS) and compound (ACTIVE -> CLOSED derived from child PlanTask states)."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /agronomic-plans/{id}/submit"
        actor: Agronomist
        preconditions:
          - "status == DRAFT"
          - "at least one PlanTask exists with plan_id == this plan's id and status == PLANNED"
        side_effects:
          - "AgronomicPlan.status := SUBMITTED; submitted_by_user_id := X-User-ID; version incremented by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /agronomic-plans/{id}/return"
        actor: Superintendent
        preconditions:
          - "status == SUBMITTED"
          - "return_count < MAX_PLAN_RETURNS (2), else ERR_REVISION_LIMIT_REACHED"
        side_effects:
          - "AgronomicPlan.status := DRAFT; return_count incremented by 1; submitted_by_user_id := null; version incremented by 1"
        note: "Revision cycle. The third return attempt is rejected with ERR_REVISION_LIMIT_REACHED and leaves status == SUBMITTED."
      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /agronomic-plans/{id}/approve"
        actor: Superintendent
        preconditions:
          - "status == SUBMITTED"
          - "expected_plan_version equals AgronomicPlan.version, else ERR_STALE_PLAN_VERSION"
          - "X-User-ID != submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "AgronomicPlan.status := ACTIVE; version incremented by 1"
      - from: CLOSED
        to: ACTIVE
        trigger: "system: cascade from PlanTask COMPLETED -> SCHEDULED (itself caused by POST /applications/{id}/void)"
        actor: system
        preconditions:
          - "status == CLOSED"
          - "at least one PlanTask with plan_id == this plan's id has left the terminal set and now has status IN {PLANNED, SCHEDULED}"
        side_effects:
          - "AgronomicPlan.status := ACTIVE; committed_nitrogen_lb recomputed by calculations.plan_nitrogen_commitment_lb; version incremented by 1"
        note: "Reopen. Second hop of the application-void cascade."
      - from: ACTIVE
        to: CLOSED
        trigger: "system: bubble-up recompute after any PlanTask of this plan reaches COMPLETED or CANCELLED"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "at least one PlanTask exists with plan_id == this plan's id"
          - "every PlanTask with plan_id == this plan's id has status IN {COMPLETED, CANCELLED}"
        side_effects:
          - "AgronomicPlan.status := CLOSED; committed_nitrogen_lb recomputed by calculations.plan_nitrogen_commitment_lb; version incremented by 1"

  - entity: PlanTask
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Cyclic: SCHEDULED -> PLANNED whenever the MaintenanceWindow carrying the task is deferred, then PLANNED -> SCHEDULED again on reschedule."
    transitions:
      - from: PLANNED
        to: SCHEDULED
        trigger: "POST /plan-tasks/{id}/schedule"
        actor: Agronomist
        preconditions:
          - "PlanTask.status == PLANNED"
          - "AgronomicPlan(plan_id).status == ACTIVE, else ERR_PLAN_STATE_INVALID"
          - "expected_plan_version equals AgronomicPlan(plan_id).version, else ERR_STALE_PLAN_VERSION"
          - "MaintenanceWindow(maintenance_window_id).status == SCHEDULED and its plan_task_id is null, else ERR_WINDOW_STATE_INVALID"
          - "MaintenanceWindow(maintenance_window_id).turf_area_id == PlanTask.turf_area_id, else ERR_TASK_TURF_AREA_MISMATCH"
          - "MaintenanceWindow(maintenance_window_id).window_start >= PlanTask.planned_window_start and window_end <= PlanTask.planned_window_end, else ERR_APPLICATION_OUTSIDE_PLAN_WINDOW"
          - "resulting AgronomicPlan.committed_nitrogen_lb <= AgronomicPlan.nitrogen_budget_lb, else ERR_NITROGEN_BUDGET_EXCEEDED"
        side_effects:
          - "PlanTask.status := SCHEDULED; PlanTask.version incremented by 1"
          - "MaintenanceWindow.plan_task_id := this task's id; that window's version incremented by 1"
          - "AgronomicPlan.committed_nitrogen_lb recomputed by calculations.plan_nitrogen_commitment_lb; AgronomicPlan.version incremented by 1"
          - "TurfArea.nitrogen_projected_lb_per_1000 recomputed by calculations.turf_nitrogen_load variant planned_commitment; that TurfArea.version incremented by 1"
      - from: SCHEDULED
        to: PLANNED
        trigger: "system: cascade from MaintenanceWindow SCHEDULED -> DEFERRED"
        actor: system
        preconditions:
          - "PlanTask.status == SCHEDULED"
          - "the deferring MaintenanceWindow's plan_task_id equals this task's id"
        side_effects:
          - "PlanTask.status := PLANNED; version incremented by 1"
          - "AgronomicPlan.committed_nitrogen_lb recomputed (the task's commitment_lb leaves the ledger); AgronomicPlan.version incremented by 1"
          - "TurfArea.nitrogen_projected_lb_per_1000 recomputed; that TurfArea.version incremented by 1"
        note: "Second hop of the frost cascade; the plan-level recompute is the third hop."
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system: cascade from MaintenanceWindow IN_PROGRESS -> COMPLETED"
        actor: system
        preconditions:
          - "PlanTask.status == SCHEDULED"
          - "the completing MaintenanceWindow's plan_task_id equals this task's id"
        side_effects:
          - "PlanTask.status := COMPLETED; version incremented by 1"
          - "AgronomicPlan.committed_nitrogen_lb recomputed (COMPLETED tasks remain in the ledger); AgronomicPlan.version incremented by 1"
          - "AgronomicPlan bubble-up ACTIVE -> CLOSED re-evaluated"
      - from: COMPLETED
        to: SCHEDULED
        trigger: "system: cascade from POST /applications/{id}/void"
        actor: system
        preconditions:
          - "PlanTask.status == COMPLETED"
          - "the voided Application's plan_task_id equals this task's id"
        side_effects:
          - "PlanTask.status := SCHEDULED; version incremented by 1"
          - "AgronomicPlan.committed_nitrogen_lb recomputed; AgronomicPlan.version incremented by 1"
          - "when AgronomicPlan.status == CLOSED: that plan transitions CLOSED -> ACTIVE (see state_machines.AgronomicPlan)"
        note: "Compensation. First hop of the application-void cascade; the plan reopen is the second hop."
      - from: PLANNED
        to: CANCELLED
        trigger: "system: cascade from MaintenanceWindow SCHEDULED|DEFERRED -> CANCELLED"
        actor: system
        preconditions:
          - "PlanTask.status == PLANNED"
          - "the cancelling MaintenanceWindow's plan_task_id equals this task's id"
        side_effects:
          - "PlanTask.status := CANCELLED; version incremented by 1"
          - "TurfArea.nitrogen_projected_lb_per_1000 recomputed; that TurfArea.version incremented by 1"
          - "AgronomicPlan bubble-up ACTIVE -> CLOSED re-evaluated"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: cascade from MaintenanceWindow SCHEDULED|DEFERRED -> CANCELLED"
        actor: system
        preconditions:
          - "PlanTask.status == SCHEDULED"
          - "the cancelling MaintenanceWindow's plan_task_id equals this task's id"
        side_effects:
          - "PlanTask.status := CANCELLED; version incremented by 1"
          - "AgronomicPlan.committed_nitrogen_lb recomputed (the commitment leaves the ledger); AgronomicPlan.version incremented by 1"
          - "TurfArea.nitrogen_projected_lb_per_1000 recomputed; that TurfArea.version incremented by 1"
          - "AgronomicPlan bubble-up ACTIVE -> CLOSED re-evaluated"

  - entity: MaintenanceWindow
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Cyclic: SCHEDULED -> DEFERRED -> SCHEDULED, capped at MAX_WINDOW_DEFERRALS."
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /maintenance-windows/{id}/start"
        actor: Agronomist
        preconditions:
          - "status == SCHEDULED"
          - "Course(course_id).play_posture != CLOSED unless task_type == STORM_CLEANUP, else ERR_COURSE_CLOSED"
          - "TurfArea(turf_area_id).agronomic_status != OUT_OF_PLAY unless task_type == STORM_CLEANUP, else ERR_TURF_AREA_OUT_OF_PLAY"
          - "TurfArea(turf_area_id).rei_expires_at is null OR logical clock >= TurfArea.rei_expires_at, else ERR_REI_ACTIVE"
        side_effects:
          - "MaintenanceWindow.status := IN_PROGRESS; version incremented by 1"
          - "when task_type == AERATION: TurfArea.agronomic_status := UNDER_RENOVATION; that TurfArea.version incremented by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /maintenance-windows/{id}/complete"
        actor: Agronomist
        preconditions:
          - "status == IN_PROGRESS"
        side_effects:
          - "MaintenanceWindow.status := COMPLETED; version incremented by 1"
          - "when task_type == AERATION and TurfArea.agronomic_status == UNDER_RENOVATION: TurfArea.agronomic_status := ACTIVE; that TurfArea.version incremented by 1"
          - "when plan_task_id is not null: that PlanTask transitions SCHEDULED -> COMPLETED (see state_machines.PlanTask), which itself recomputes AgronomicPlan.committed_nitrogen_lb and re-evaluates the plan's ACTIVE -> CLOSED bubble-up"
      - from: SCHEDULED
        to: DEFERRED
        trigger: "system: cascade from POST /weather-events (FROST or LIGHTNING or HEAVY_RAIN) or from POST /equipment-units/{id}/retire"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "for a WeatherEvent trigger: the half-open interval [window_start, window_end) intersects [WeatherEvent.declared_at, WeatherEvent.expected_clear_at) and MaintenanceWindow.course_id == WeatherEvent.course_id"
          - "for an equipment-retire trigger: required_unit_type equals the retired unit's unit_type and no other EquipmentUnit with that course_id, that unit_type and status == IN_SERVICE remains"
          - "deferral_count < MAX_WINDOW_DEFERRALS (2); when deferral_count already equals MAX_WINDOW_DEFERRALS the window is CANCELLED instead of DEFERRED"
        side_effects:
          - "MaintenanceWindow.status := DEFERRED; deferral_count incremented by 1; version incremented by 1"
          - "when plan_task_id is not null: that PlanTask transitions SCHEDULED -> PLANNED, which itself recomputes AgronomicPlan.committed_nitrogen_lb and TurfArea.nitrogen_projected_lb_per_1000"
          - "for a WeatherEvent trigger: WeatherEvent.deferred_window_count incremented by 1"
      - from: DEFERRED
        to: SCHEDULED
        trigger: "POST /maintenance-windows/{id}/reschedule"
        actor: Agronomist
        preconditions:
          - "status == DEFERRED"
          - "the new interval passes every validation that applies to POST /maintenance-windows (overlap, play conflict, REI, out-of-play, closed course)"
          - "when plan_task_id is not null: AgronomicPlan(PlanTask.plan_id).status == ACTIVE and the re-committed ledger still satisfies committed_nitrogen_lb <= nitrogen_budget_lb, else ERR_NITROGEN_BUDGET_EXCEEDED"
        side_effects:
          - "MaintenanceWindow.window_start / window_end replaced; crew_hours recomputed; status := SCHEDULED; version incremented by 1"
          - "when plan_task_id is not null and that PlanTask.status == PLANNED: PlanTask transitions PLANNED -> SCHEDULED, restoring its commitment_lb to AgronomicPlan.committed_nitrogen_lb and to TurfArea.nitrogen_projected_lb_per_1000"
        note: "Compensating half of the nitrogen-commitment invariant."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: cascade from POST /weather-events with event_type == STORM_DAMAGE"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "turf_area_id is in WeatherEvent.affected_turf_area_ids"
          - "task_type != STORM_CLEANUP"
        side_effects:
          - "MaintenanceWindow.status := CANCELLED; plan_task_id := null; version incremented by 1"
          - "when the window carried a PlanTask: that PlanTask transitions to CANCELLED (see state_machines.PlanTask)"
      - from: DEFERRED
        to: CANCELLED
        trigger: "system: cascade from POST /weather-events with event_type == STORM_DAMAGE"
        actor: system
        preconditions:
          - "status == DEFERRED"
          - "turf_area_id is in WeatherEvent.affected_turf_area_ids"
          - "task_type != STORM_CLEANUP"
        side_effects:
          - "MaintenanceWindow.status := CANCELLED; plan_task_id := null; version incremented by 1"
          - "when the window carried a PlanTask: that PlanTask transitions to CANCELLED (see state_machines.PlanTask)"

  - entity: Application
    initial_state: RECORDED
    terminal_states: [VOIDED]
    note: >
      Parallel dimensions. record_status (RECORDED -> VERIFIED -> VOIDED) tracks
      record integrity; posting_status (NOT_REQUIRED terminal at birth, or
      POSTED -> RELEASED) tracks the field posting and restricted-entry interval.
      The two dimensions never gate each other: a RECORDED application may be
      released, and a VERIFIED application may still be POSTED.
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: "POST /applications/{id}/verify"
        actor: Applicator
        preconditions:
          - "record_status == RECORDED, else ERR_APPLICATION_STATE_INVALID"
          - "X-User-ID != Application.applicator_id, else ERR_SEGREGATION_OF_DUTIES"
          - "Applicator(X-User-ID).license_status == ACTIVE, else ERR_LICENSE_EXPIRED"
          - "Applicator(X-User-ID).license_category authorises PesticideProduct(product_id).requires_license_category, else ERR_LICENSE_CATEGORY_MISMATCH"
        side_effects:
          - "Application.record_status := VERIFIED; verified_by_applicator_id := X-User-ID; version incremented by 1"
      - from: RECORDED
        to: VOIDED
        trigger: "POST /applications/{id}/void"
        actor: Superintendent
        preconditions:
          - "record_status IN {RECORDED, VERIFIED}, else ERR_APPLICATION_STATE_INVALID"
        side_effects:
          - "Application.record_status := VOIDED; void_reason := supplied value; posting_status := RELEASED when it was POSTED; version incremented by 1"
          - "TurfArea.nitrogen_applied_lb_per_1000_ytd and nitrogen_projected_lb_per_1000 recomputed (this record leaves the applied set) and TurfArea.rei_expires_at recomputed; that TurfArea.version incremented by 1"
          - "when void_reason == SAFETY_VIOLATION: Applicator(applicator_id).license_status := SUSPENDED and suspended_at := logical clock; that Applicator.version incremented by 1"
          - "when plan_task_id is not null and that PlanTask.status == COMPLETED: PlanTask reverts COMPLETED -> SCHEDULED, which recomputes AgronomicPlan.committed_nitrogen_lb and, when the plan was CLOSED, reopens it CLOSED -> ACTIVE"
        note: "Third hop of the void cascade; see calculations.turf_nitrogen_load."
      - from: VERIFIED
        to: VOIDED
        trigger: "POST /applications/{id}/void"
        actor: Superintendent
        preconditions:
          - "record_status == VERIFIED"
        side_effects:
          - "identical to the RECORDED -> VOIDED side-effect set"
      - from: POSTED
        to: RELEASED
        trigger: "POST /applications/{id}/release-posting"
        actor: Applicator
        preconditions:
          - "posting_status == POSTED, else ERR_APPLICATION_STATE_INVALID"
          - "logical clock >= Application.rei_expires_at, else ERR_REI_ACTIVE"
        side_effects:
          - "Application.posting_status := RELEASED; version incremented by 1"
          - "TurfArea.rei_expires_at recomputed over the remaining POSTED applications on that area; that TurfArea.version incremented by 1"
        note: "Posting dimension only; record_status is untouched."

  - entity: IrrigationRun
    initial_state: SCHEDULED
    terminal_states: [REVERSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /irrigation-runs/{id}/complete"
        actor: Agronomist
        preconditions:
          - "status == SCHEDULED, else ERR_RUN_STATE_INVALID"
          - "PumpStation(pump_station_id).status != OFFLINE, else ERR_PUMP_OFFLINE"
          - "TurfArea(turf_area_id).agronomic_status != OUT_OF_PLAY, else ERR_TURF_AREA_OUT_OF_PLAY"
        side_effects:
          - "IrrigationRun.volume_gal := round(allotted_gal * actual_minutes / planned_minutes, 1) where actual_minutes defaults to planned_minutes when omitted; status := COMPLETED; version incremented by 1"
          - "PumpStation.withdrawn_today_gal recomputed; that PumpStation.version incremented by 1"
          - "Course.water_used_gal recomputed, then Course.water_posture re-derived (which may itself cascade to PumpStation.status and to SCHEDULED IrrigationRun cancellation); Course.version incremented by 1"
      - from: COMPLETED
        to: REVERSED
        trigger: "POST /irrigation-runs/{id}/reverse"
        actor: Superintendent
        preconditions:
          - "status == COMPLETED, else ERR_RUN_STATE_INVALID"
        side_effects:
          - "IrrigationRun.volume_gal := 0; status := REVERSED; version incremented by 1"
          - "PumpStation.withdrawn_today_gal recomputed; that PumpStation.version incremented by 1"
          - "Course.water_used_gal recomputed and water_posture re-derived; Course.version incremented by 1"
        note: "Compensating half of the water-volume invariant."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: cascade from Course water_posture becoming SUSPENDED, or from PATCH /pump-stations/{id}/status setting OFFLINE"
        actor: system
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "IrrigationRun.volume_gal := 0; status := CANCELLED; version incremented by 1"

  - entity: PlayEvent
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    note: >
      Parallel dimensions. The schedule dimension (SCHEDULED -> DELAYED, and
      SCHEDULED|DELAYED -> CANCELLED) is driven by weather; the readiness
      dimension (PENDING -> CERTIFIED | FAILED, with FAILED -> CERTIFIED and
      FAILED -> FAILED re-attempts) is driven by certification and never gates
      the schedule dimension.
    transitions:
      - from: SCHEDULED
        to: DELAYED
        trigger: "system: cascade from POST /weather-events with event_type == FROST"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "course_id == WeatherEvent.course_id"
          - "start_at < WeatherEvent.expected_clear_at (strict)"
        side_effects:
          - "PlayEvent.effective_start_at and delayed_minutes set by calculations.frost_release_schedule; status := DELAYED; version incremented by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: cascade from POST /weather-events with event_type IN {LIGHTNING, STORM_DAMAGE}"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "course_id == WeatherEvent.course_id"
          - "start_at < WeatherEvent.expected_clear_at (strict)"
        side_effects:
          - "PlayEvent.status := CANCELLED; version incremented by 1"
      - from: DELAYED
        to: CANCELLED
        trigger: "system: cascade from POST /weather-events with event_type IN {LIGHTNING, STORM_DAMAGE}"
        actor: system
        preconditions:
          - "status == DELAYED"
          - "effective_start_at < WeatherEvent.expected_clear_at (strict)"
        side_effects:
          - "PlayEvent.status := CANCELLED; version incremented by 1"
      - from: PENDING
        to: CERTIFIED
        trigger: "POST /play-events/{id}/certify-conditions"
        actor: TournamentOfficial
        preconditions:
          - "status != CANCELLED, else ERR_PLAY_EVENT_STATE_INVALID"
          - "readiness_status IN {PENDING, FAILED}"
          - "at least MIN_GREENS_MEASURED distinct GREEN TurfArea rows of this course have a PlayabilityReading inside the readiness window, else ERR_INSUFFICIENT_READINGS"
          - "calculations.tournament_readiness_index >= CERT_THRESHOLD"
        side_effects:
          - "PlayEvent.readiness_index set; readiness_status := CERTIFIED; version incremented by 1"
      - from: PENDING
        to: FAILED
        trigger: "POST /play-events/{id}/certify-conditions"
        actor: TournamentOfficial
        preconditions:
          - "same preconditions as PENDING -> CERTIFIED except calculations.tournament_readiness_index < CERT_THRESHOLD"
        side_effects:
          - "PlayEvent.readiness_index set; readiness_status := FAILED; version incremented by 1"
      - from: FAILED
        to: CERTIFIED
        trigger: "POST /play-events/{id}/certify-conditions"
        actor: TournamentOfficial
        preconditions:
          - "readiness_status == FAILED"
          - "recomputed calculations.tournament_readiness_index >= CERT_THRESHOLD"
        side_effects:
          - "PlayEvent.readiness_index replaced; readiness_status := CERTIFIED; version incremented by 1"
        note: "Readiness cycle: crews re-prepare the greens, new readings are recorded, certification is re-attempted."
      - from: FAILED
        to: FAILED
        trigger: "POST /play-events/{id}/certify-conditions"
        actor: TournamentOfficial
        preconditions:
          - "readiness_status == FAILED"
          - "recomputed calculations.tournament_readiness_index < CERT_THRESHOLD"
        side_effects:
          - "PlayEvent.readiness_index replaced with the new value; readiness_status stays FAILED; version incremented by 1"

  - entity: EquipmentUnit
    initial_state: IN_SERVICE
    terminal_states: [RETIRED]
    note: "Cyclic IN_SERVICE -> DOWN_FOR_SERVICE -> IN_SERVICE with a threshold-driven auto-transition."
    transitions:
      - from: IN_SERVICE
        to: DOWN_FOR_SERVICE
        trigger: "system: auto-transition evaluated at the end of POST /equipment-units/{id}/log-hours"
        actor: system
        preconditions:
          - "status == IN_SERVICE"
          - "hours_since_service >= service_interval_hours (inclusive threshold)"
        side_effects:
          - "EquipmentUnit.status := DOWN_FOR_SERVICE; version incremented by 1"
      - from: DOWN_FOR_SERVICE
        to: IN_SERVICE
        trigger: "POST /equipment-units/{id}/service"
        actor: EquipmentTechnician
        preconditions:
          - "status == DOWN_FOR_SERVICE, else ERR_EQUIPMENT_STATE_INVALID"
        side_effects:
          - "engine_hours_at_last_service := engine_hours; hours_since_service := 0; replacement_score and replacement_score_projected and replacement_flag recomputed; status := IN_SERVICE; version incremented by 1"
      - from: IN_SERVICE
        to: RETIRED
        trigger: "POST /equipment-units/{id}/retire"
        actor: Superintendent
        preconditions:
          - "status IN {IN_SERVICE, DOWN_FOR_SERVICE}, else ERR_EQUIPMENT_STATE_INVALID"
          - "when replacement_unit_id is supplied: that unit exists, has status == IN_SERVICE, belongs to the same course_id, and has the same unit_type, else ERR_REPLACEMENT_UNIT_TYPE_MISMATCH"
        side_effects:
          - "EquipmentUnit.status := RETIRED; replaced_by_unit_id := replacement_unit_id or null; version incremented by 1"
          - "every MaintenanceWindow with status == SCHEDULED, this course_id, and required_unit_type equal to this unit's unit_type, for which no other IN_SERVICE unit of that type remains on the course, transitions SCHEDULED -> DEFERRED, which itself reverts any carried PlanTask SCHEDULED -> PLANNED, which itself recomputes AgronomicPlan.committed_nitrogen_lb"
      - from: DOWN_FOR_SERVICE
        to: RETIRED
        trigger: "POST /equipment-units/{id}/retire"
        actor: Superintendent
        preconditions:
          - "status == DOWN_FOR_SERVICE"
        side_effects:
          - "identical to the IN_SERVICE -> RETIRED side-effect set"

  - entity: WeatherEvent
    initial_state: ACTIVE
    terminal_states: [CLEARED]
    transitions:
      - from: null
        to: ACTIVE
        trigger: "POST /weather-events"
        actor: Superintendent
        preconditions:
          - "Course(course_id) exists"
          - "expected_clear_at > logical clock"
          - "expected_course_version equals Course.version, else ERR_STALE_COURSE_VERSION"
        side_effects:
          - "WeatherEvent created with status ACTIVE and declared_at := logical clock"
          - "Course.play_posture re-derived by calculations.course_play_posture; Course.frost_delay_minutes set; Course.version incremented by 1"
          - "for FROST: PlayEvent rows are pushed back by calculations.frost_release_schedule (SCHEDULED -> DELAYED)"
          - "for LIGHTNING and STORM_DAMAGE: qualifying PlayEvent rows transition to CANCELLED"
          - "for FROST, LIGHTNING and HEAVY_RAIN: qualifying MaintenanceWindow rows transition SCHEDULED -> DEFERRED, which itself reverts any carried PlanTask SCHEDULED -> PLANNED, which itself recomputes AgronomicPlan.committed_nitrogen_lb and TurfArea.nitrogen_projected_lb_per_1000"
          - "for STORM_DAMAGE: every TurfArea named in affected_turf_area_ids gets agronomic_status := OUT_OF_PLAY (version incremented by 1) and every non-STORM_CLEANUP MaintenanceWindow on those areas in status SCHEDULED or DEFERRED transitions to CANCELLED"
      - from: ACTIVE
        to: CLEARED
        trigger: "POST /weather-events/{id}/clear"
        actor: Superintendent
        preconditions:
          - "status == ACTIVE, else ERR_WEATHER_STATE_INVALID"
        side_effects:
          - "WeatherEvent.status := CLEARED; cleared_at := logical clock; version incremented by 1"
          - "Course.play_posture re-derived over the remaining ACTIVE events; frost_delay_minutes re-derived; Course.version incremented by 1"
          - "for STORM_DAMAGE: every TurfArea named in affected_turf_area_ids whose agronomic_status == OUT_OF_PLAY and which is named by no other ACTIVE STORM_DAMAGE event gets agronomic_status := ACTIVE; that TurfArea.version incremented by 1"
        note: "Delayed PlayEvent rows keep their pushback; clearing a frost does not restore the original tee times."

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: plan-task-schedule-stale-plan
    parent_entity: AgronomicPlan
    write_endpoint: "POST /plan-tasks/{id}/schedule"
    occ_field: "expected_plan_version"
    description: |
      Scheduling a PlanTask against an AgronomicPlan whose version has advanced
      since the client last read it is rejected. Each schedule debits
      committed_nitrogen_lb against nitrogen_budget_lb, so a stale plan version
      means the budget headroom the client reasoned about no longer exists; the
      write is refused on the stale version rather than silently overcommitting
      the plan.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

  - rule_id: plan-approve-stale-plan
    parent_entity: AgronomicPlan
    write_endpoint: "POST /agronomic-plans/{id}/approve"
    occ_field: "expected_plan_version"
    description: |
      Approving an AgronomicPlan whose version has advanced since the client last
      read it is rejected. A return that legitimately supersedes the submission,
      or a task addition that changed the committed ledger, both bump the plan's
      version, so the approver's view of what is being approved is stale.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

  - rule_id: weather-declare-stale-course
    parent_entity: Course
    write_endpoint: "POST /weather-events"
    occ_field: "expected_course_version"
    description: |
      Declaring a WeatherEvent against a Course whose version has advanced since
      the client last read it is rejected. A newly declared event legitimately
      supersedes the play posture derived from earlier events, so a stale course
      version means the declarer has not observed the posture, frost pushback, or
      out-of-play set the new declaration would overwrite.
    error_id: ERR_STALE_COURSE_VERSION
    http_status: 412

  - rule_id: irrigation-run-create-stale-pump
    parent_entity: PumpStation
    write_endpoint: "POST /irrigation-runs"
    occ_field: "expected_pump_station_version"
    description: |
      Creating an IrrigationRun against a PumpStation whose version has advanced
      since the client last read it is rejected. The allotment is computed from
      daily_withdrawal_cap_gal minus withdrawn_today_gal and is checked against
      max_flow_gpm and max_concurrent_zones, so a stale pump version means the
      headroom and capacity the client sized the run against are no longer the
      station's actual state.
    error_id: ERR_STALE_PUMP_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
# GLOBAL PRECISION CONTRACT: every `round(x, n)` in this section means
# round-half-up applied to the EXACT decimal value of x, not to its binary
# floating-point approximation. round(4.675, 2) == 4.68 and round(11.615, 2)
# == 11.62 are normative; an implementation that yields 4.67 / 11.61 because it
# rounded a float is non-conforming.
calculations:
  - name: plan_nitrogen_commitment_lb
    trigger: "PlanTask creation (commitment_lb only), and every AgronomicPlan.committed_nitrogen_lb recompute: PlanTask PLANNED->SCHEDULED, SCHEDULED->PLANNED, SCHEDULED->COMPLETED, COMPLETED->SCHEDULED, PLANNED->CANCELLED, SCHEDULED->CANCELLED, AgronomicPlan ACTIVE->CLOSED, AgronomicPlan CLOSED->ACTIVE"
    algorithm: aggregation
    formula: |
      # STEP 1 — per-task commitment, computed once at PlanTask creation:
      if task.task_type == "FERTILITY":
          task.commitment_lb = round(task.nitrogen_lb_per_1000 * (turf_area.area_sq_ft / 1000), 2)
      else:
          task.commitment_lb = 0

      # STEP 2 — plan ledger. ROUNDING ORDER IS PINNED: round per task first
      # (step 1), then sum the already-rounded per-task values. The alternative
      # order (sum the exact products, then round once) is NON-CONFORMING and
      # produces a different value whenever two or more tasks each carry a
      # half-cent remainder.
      plan.committed_nitrogen_lb = round(
          sum(t.commitment_lb for t in PlanTask
              where t.plan_id == plan.id and t.status in {"SCHEDULED", "COMPLETED"}),
          2)
    input_set: >
      Step 2 includes exactly the PlanTask rows of this plan whose status is
      SCHEDULED or COMPLETED. PLANNED and CANCELLED tasks are excluded. Order of
      summation is irrelevant because every addend is already rounded to 2
      decimals, so the sum is exact; no tie-break is required.
    constants:
      PLAN_LEDGER_PRECISION: 2
      TASK_COMMITMENT_PRECISION: 2
    precision: "2 decimal places, round_half_up, per-task first then sum"
    note: >
      Worked example that discriminates the pinned order: task A (0.85 lb/1000 on
      5500 sq ft) -> round(4.675, 2) = 4.68; task B (0.75 lb/1000 on 4300 sq ft)
      -> round(3.225, 2) = 3.23; committed = 7.91. Sum-then-round would give
      round(7.900, 2) = 7.90.

  - name: turf_nitrogen_load
    trigger: "Application creation, Application RECORDED|VERIFIED -> VOIDED, PlanTask PLANNED->SCHEDULED, PlanTask SCHEDULED->PLANNED, PlanTask ->CANCELLED, PlanTask COMPLETED->SCHEDULED"
    algorithm: aggregation
    formula: |
      # applied_actual (persisted as TurfArea.nitrogen_applied_lb_per_1000_ytd)
      applied = round(
          sum( round(a.nitrogen_lb / (turf_area.area_sq_ft / 1000), 3)
               for a in Application
               where a.turf_area_id == turf_area.id
                 and a.record_status in {"RECORDED", "VERIFIED"}
                 and year(a.applied_at) == year(logical_clock) ),
          3)

      # planned_commitment (persisted as TurfArea.nitrogen_projected_lb_per_1000)
      projected = round(
          applied
          + sum( t.nitrogen_lb_per_1000
                 for t in PlanTask
                 where t.turf_area_id == turf_area.id
                   and t.task_type == "FERTILITY"
                   and t.status in {"PLANNED", "SCHEDULED"} ),
          3)
    input_set: >
      applied_actual includes Application rows on this area whose record_status is
      RECORDED or VERIFIED and whose applied_at falls in the logical clock's
      calendar year; VOIDED rows are excluded. planned_commitment adds the
      per-1000 rates of this area's FERTILITY PlanTask rows in status PLANNED or
      SCHEDULED; COMPLETED tasks are deliberately NOT added again because their
      Application rows are already in applied_actual.
    constants:
      LOAD_PRECISION: 3
      MAX_N_LB_PER_1000_BY_AREA_TYPE:
        GREEN: 4.00
        PRACTICE_GREEN: 4.00
        TEE: 5.00
        APPROACH: 5.00
        FAIRWAY: 6.00
        ROUGH: 3.00
    precision: "3 decimal places, round_half_up, per-application first then sum"
    variants:
      - name: applied_actual
        when: "Persisted continuously on TurfArea.nitrogen_applied_lb_per_1000_ytd and reported by GET /turf-areas/{id}."
        difference: "Counts only nitrogen already in the ground (RECORDED or VERIFIED Application rows). Ignores every unexecuted PlanTask."
      - name: planned_commitment
        when: "Persisted continuously on TurfArea.nitrogen_projected_lb_per_1000 and used as the left-hand side of validation priority 31 (ERR_NITROGEN_LOAD_LIMIT)."
        difference: >
          Adds the per-1000 rates of PLANNED and SCHEDULED FERTILITY tasks on top
          of applied_actual, so the same database yields a strictly larger number
          whenever any unexecuted fertility task exists. Regulatory headroom is
          therefore consumed at planning time, not at application time.

  - name: application_mass_and_nitrogen
    trigger: "POST /applications"
    algorithm: aggregation
    formula: |
      acres    = turf_area.area_sq_ft / SQ_FT_PER_ACRE
      total_lb = round(application.rate_lb_per_acre * acres, 2)
      # NESTED ROUNDING: nitrogen is computed from the ALREADY-ROUNDED total_lb,
      # not from the exact product. This order is pinned.
      nitrogen_lb    = round(total_lb * (product.nitrogen_pct / 100), 2)
      rei_expires_at = application.applied_at + product.rei_hours hours
    input_set: "Single Application row plus its PesticideProduct and TurfArea."
    constants:
      SQ_FT_PER_ACRE: 43560
      MASS_PRECISION: 2
    precision: "2 decimal places, round_half_up; total_lb rounded before the nitrogen multiplication"
    note: >
      Worked example: area_sq_ft 5500, rate 200 lb/acre -> acres 0.126262626...,
      total_lb = round(25.252525..., 2) = 25.25; nitrogen_pct 46 ->
      nitrogen_lb = round(11.615, 2) = 11.62. Rounding only at the end would give
      round(25.252525... * 0.46, 2) = round(11.616161..., 2) = 11.62 here, but the
      per-1000 figure that reaches TurfArea is derived from the pinned 11.62.

  - name: irrigation_run_allotment
    trigger: "POST /irrigation-runs (allotted_gal, flow_gpm) and POST /irrigation-runs/{id}/complete (volume_gal)"
    algorithm: constraint_propagation
    formula: |
      duration_minutes = (window_end - window_start) in whole minutes
      gross_gal        = run.target_moisture_deficit_pct
                         * (turf_area.area_sq_ft / 1000)
                         * GAL_PER_PCT_PER_1000SQFT

      posture_factor   = { "OPEN": 1.00, "RESTRICTED": 0.60, "SUSPENDED": 0.00 }[course.water_posture]

      pump_headroom    = max(pump.daily_withdrawal_cap_gal - pump.withdrawn_today_gal, 0)

      allotted_gal     = round(min(gross_gal * posture_factor, pump_headroom), 1)
      flow_gpm         = round(allotted_gal / duration_minutes, 2)

      # On completion:
      actual_minutes   = supplied actual_minutes, defaulting to duration_minutes
      volume_gal       = round(allotted_gal * actual_minutes / duration_minutes, 1)
    input_set: >
      Three competing inputs bound the run: the agronomic demand
      (gross_gal * posture_factor), the station's remaining daily headroom
      (daily_withdrawal_cap_gal minus withdrawn_today_gal, where
      withdrawn_today_gal counts only COMPLETED runs whose window_start calendar
      date equals the logical clock's date), and the water posture factor. The
      annual allocation is NOT part of the min; it is enforced separately by
      validation priority 50 (ERR_WATER_ALLOCATION_EXCEEDED), which is skipped
      entirely when pump.source_type == RECLAIMED.
    constants:
      GAL_PER_PCT_PER_1000SQFT: 6.2
      ALLOTMENT_PRECISION: 1
      FLOW_PRECISION: 2
      POSTURE_FACTOR_OPEN: 1.00
      POSTURE_FACTOR_RESTRICTED: 0.60
      POSTURE_FACTOR_SUSPENDED: 0.00
    precision: "allotted_gal and volume_gal 1 decimal place, flow_gpm 2 decimal places, round_half_up"
    note: >
      Non-linear because the binding constraint changes with state: at OPEN with a
      fresh station the demand term binds, after a large completed run the pump
      headroom term binds, and at SUSPENDED the posture factor zeroes the result
      (which then trips ERR_ZERO_ALLOTMENT). Worked example: deficit 10 pct on
      130000 sq ft -> gross 8060.0; OPEN factor 1.00; station cap 7600 with 0
      withdrawn -> allotted = round(min(8060.0, 7600), 1) = 7600.0 and
      flow_gpm = round(126.666..., 2) = 126.67.

  - name: course_water_posture
    trigger: "POST /irrigation-runs/{id}/complete, POST /irrigation-runs/{id}/reverse, PATCH /courses/{id}/water-allocation"
    algorithm: threshold
    formula: |
      used_pct = course.water_used_gal / course.annual_water_allocation_gal * 100
      if used_pct >= course.water_suspended_threshold_pct:  water_posture = "SUSPENDED"
      elif used_pct >= course.water_restricted_threshold_pct: water_posture = "RESTRICTED"
      else:                                                  water_posture = "OPEN"
    input_set: >
      water_used_gal is the sum of volume_gal over IrrigationRun rows whose status
      is exactly COMPLETED and whose pump_station_id belongs to this course;
      SCHEDULED, CANCELLED and REVERSED runs contribute nothing. used_pct is
      compared without rounding.
    constants:
      SUSPENDED_COMPARISON: ">= (inclusive)"
      RESTRICTED_COMPARISON: ">= (inclusive)"
    precision: "used_pct compared as an exact decimal ratio; no intermediate rounding"
    note: >
      Boundary is inclusive on both edges: 6448 gal against a 8060 gal allocation
      is exactly 80.0 pct and is RESTRICTED, not OPEN.

  - name: water_overage_assessment
    trigger: "GET /courses/{id}/water-assessment"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED, STEP BY STEP. The tier looks like it should be
      # keyed on the final total_charge (the invoice total), but it is keyed on
      # base_charge from step 2. Keying it on total_charge would be circular:
      # total_charge depends on surcharge, surcharge depends on the tier, and the
      # tier would depend on total_charge.
      # STEP 1
      billable_gal = max(course.water_used_gal - course.annual_water_allocation_gal, 0)
      # STEP 2
      base_charge  = round(course.water_used_gal / 1000 * BASE_RATE_PER_KGAL, 2)
      # STEP 3 — tier keyed on base_charge (step 2), never on total_charge
      if   base_charge <  TIER_T2_FLOOR: tier = "T1"
      elif base_charge <  TIER_T3_FLOOR: tier = "T2"
      else:                              tier = "T3"
      # STEP 4
      surcharge_rate = { "T1": 0.90, "T2": 1.40, "T3": 2.10 }[tier]
      # STEP 5
      surcharge = round(billable_gal / 1000 * surcharge_rate, 2)
      # STEP 6
      total_charge = round(base_charge + surcharge, 2)
    input_set: "Single Course row; water_used_gal as maintained by the COMPLETED-run ledger."
    constants:
      BASE_RATE_PER_KGAL: 3.25
      TIER_T2_FLOOR: 25.00
      TIER_T3_FLOOR: 100.00
      SURCHARGE_RATE_T1: 0.90
      SURCHARGE_RATE_T2: 1.40
      SURCHARGE_RATE_T3: 2.10
      CHARGE_PRECISION: 2
    precision: "2 decimal places, round_half_up, at every one of steps 2, 5 and 6"
    note: >
      Worked example that discriminates the pinned order: water_used_gal 7600.0
      against a 7000 gal allocation gives billable 600.0 and base_charge
      round(24.70, 2) = 24.70, which is below TIER_T2_FLOOR, so tier T1 and
      surcharge round(0.54, 2) = 0.54 and total_charge 25.24. Keying the tier on
      total_charge instead would put 25.24 at or above TIER_T2_FLOOR, select rate
      1.40, and yield surcharge 0.84 and total 25.54.

  - name: equipment_replacement_score
    trigger: "POST /equipment-units, POST /equipment-units/{id}/log-hours, POST /equipment-units/{id}/service"
    algorithm: weighted_scoring
    formula: |
      age_years            = year(logical_clock) - unit.model_year
      usage_ratio_now      = unit.engine_hours / unit.expected_life_hours
      days_to_fy_end       = (date(year(logical_clock), 12, 31) - date(logical_clock)) in whole days
      usage_ratio_proj     = (unit.engine_hours + unit.avg_daily_hours * days_to_fy_end)
                             / unit.expected_life_hours
      overdue_ratio        = unit.hours_since_service / unit.service_interval_hours

      score(usage_ratio) = round(100 * ( W_USAGE   * min(usage_ratio, 1.0)
                                       + W_AGE     * min(age_years / EXPECTED_AGE_LIFE_YEARS, 1.0)
                                       + W_OVERDUE * min(overdue_ratio, 1.0) ), 1)

      unit.replacement_score           = score(usage_ratio_now)
      unit.replacement_score_projected = score(usage_ratio_proj)
      unit.replacement_flag            = unit.replacement_score_projected >= REPLACEMENT_FLAG_THRESHOLD
    input_set: >
      Single EquipmentUnit row plus the logical clock. Every ratio is capped at
      1.0 by min() before weighting, so a unit past its design life contributes
      exactly the full usage weight and never more. RETIRED units keep the score
      they carried at retirement and are not recomputed.
    constants:
      W_USAGE: 0.45
      W_AGE: 0.35
      W_OVERDUE: 0.20
      EXPECTED_AGE_LIFE_YEARS: 10
      REPLACEMENT_FLAG_THRESHOLD: 70
      FISCAL_YEAR_END_MONTH_DAY: "12-31"
      SCORE_PRECISION: 1
    precision: "1 decimal place, round_half_up, applied once to the weighted sum"
    variants:
      - name: as_of_now
        when: "Persisted on EquipmentUnit.replacement_score; the meter reading standing right now."
        difference: "Uses usage_ratio_now, i.e. engine_hours exactly as logged. Ignores avg_daily_hours entirely."
      - name: fy_projection
        when: "Persisted on EquipmentUnit.replacement_score_projected and the sole input to replacement_flag."
        difference: >
          Uses usage_ratio_proj, adding avg_daily_hours multiplied by the whole
          days remaining to 31 December of the logical clock's year. The same row
          therefore carries two different scores at the same instant, and a unit
          can be below the flag threshold on as_of_now while above it on
          fy_projection.
    note: >
      Worked example at logical clock 2026-08-01T00:00:00Z: model_year 2018,
      expected_life_hours 6000, service_interval_hours 250, engine_hours 4500,
      hours_since_service 300, avg_daily_hours 3.5. as_of_now =
      round(100 * (0.45*0.75 + 0.35*0.8 + 0.20*1.0), 1) = 81.8. days_to_fy_end =
      152, projected hours 5032, fy_projection =
      round(100 * (0.45*0.838666... + 0.28 + 0.20), 1) = 85.7.

  - name: tournament_readiness_index
    trigger: "POST /play-events/{id}/certify-conditions"
    algorithm: weighted_scoring
    formula: |
      window_lo = play_event.start_at - READINESS_WINDOW_HOURS hours   # inclusive
      window_hi = play_event.start_at                                  # inclusive

      candidate_areas = TurfArea rows where course_id == play_event.course_id
                        and area_type == "GREEN"
                        and agronomic_status == "ACTIVE"
                        and at least one PlayabilityReading exists on that area
                            with window_lo <= measured_at <= window_hi

      if count(candidate_areas) < MIN_GREENS_MEASURED: reject ERR_INSUFFICIENT_READINGS

      for each area in candidate_areas:
          r = the PlayabilityReading on that area inside the window with the
              greatest measured_at; tie-break greatest created_at
          speed_score = 100 - min(abs(r.green_speed_ft      - TARGET_SPEED_FT)    / TOLERANCE_SPEED_FT,    1.0) * 100
          firm_score  = 100 - min(abs(r.firmness_gravities  - TARGET_FIRMNESS)    / TOLERANCE_FIRMNESS,    1.0) * 100
          moist_score = 100 - min(abs(r.moisture_pct        - TARGET_MOISTURE_PCT)/ TOLERANCE_MOISTURE,    1.0) * 100
          # PER-AREA ROUNDING FIRST, then the mean of the rounded values.
          area_index  = round(W_SPEED*speed_score + W_FIRM*firm_score + W_MOIST*moist_score, 2)

      readiness_index  = round(sum(area_index) / count(candidate_areas), 2)
      readiness_status = "CERTIFIED" if readiness_index >= CERT_THRESHOLD else "FAILED"
    input_set: >
      Only GREEN TurfArea rows of this course with agronomic_status == ACTIVE and
      with at least one reading in the closed window
      [start_at - 24h, start_at] participate. UNDER_RENOVATION and OUT_OF_PLAY
      greens are excluded from both the count and the mean. Exactly one reading
      per area enters the mean, selected by measured_at DESC then created_at DESC.
    constants:
      TARGET_SPEED_FT: 11.0
      TOLERANCE_SPEED_FT: 1.5
      TARGET_FIRMNESS: 1.35
      TOLERANCE_FIRMNESS: 0.30
      TARGET_MOISTURE_PCT: 18.0
      TOLERANCE_MOISTURE: 6.0
      W_SPEED: 0.50
      W_FIRM: 0.30
      W_MOIST: 0.20
      MIN_GREENS_MEASURED: 3
      READINESS_WINDOW_HOURS: 24
      CERT_THRESHOLD: 82.00
      INDEX_PRECISION: 2
    precision: "2 decimal places, round_half_up, per area first then the mean of the rounded per-area values"
    note: >
      Worked example with three greens: (11.5 ft, 1.40 g, 19.0 pct) -> 75.00,
      (11.0, 1.35, 18.0) -> 100.00, (10.4, 1.20, 24.0) -> 45.00; index =
      round(220.00 / 3, 2) = 73.33, which is below CERT_THRESHOLD, so FAILED.

  - name: frost_release_schedule
    trigger: "POST /weather-events with event_type == FROST"
    algorithm: chronological
    formula: |
      candidates = PlayEvent rows where course_id == event.course_id
                   and status == "SCHEDULED"
                   and start_at < event.expected_clear_at        # STRICT
      # PROCESSING ORDER IS PINNED: start_at ASC, tie-break created_at ASC.
      # No random field (id) ever participates in the order.
      prev_effective = null
      for pe in sort(candidates, key=(start_at ASC, created_at ASC)):
          naive = pe.start_at + event.delay_minutes minutes
          if pe.event_type == "SHOTGUN_START":
              # A simultaneous start puts every group on the course at one
              # instant, so it needs no separation from the group ahead of it and
              # it does not push the group behind it.
              pe.effective_start_at = naive
          else:
              pe.effective_start_at = max(naive,
                                          prev_effective + MIN_SEPARATION_MINUTES minutes)
                                      if prev_effective is not null else naive
              prev_effective = pe.effective_start_at
          pe.delayed_minutes = (pe.effective_start_at - pe.start_at) in whole minutes
          pe.status = "DELAYED"
    input_set: >
      Only SCHEDULED PlayEvent rows on the declaring course whose start_at is
      strictly before expected_clear_at. An event whose start_at equals
      expected_clear_at is untouched: it keeps status SCHEDULED and
      delayed_minutes 0. Already DELAYED and CANCELLED events are not
      reprocessed.
    constants:
      MIN_SEPARATION_MINUTES: 10
    precision: "whole minutes; datetimes carry three fractional digits but pushback is always an integral number of minutes"
    note: >
      Order-sensitive: with delay_minutes 45 and events at 13:00
      (STANDARD_TEE_TIMES), 13:05 (STANDARD_TEE_TIMES) and 13:20
      (SHOTGUN_START), the first releases at 13:45
      (delayed 45), the second at max(13:50, 13:55) = 13:55 (delayed 50 — the
      separation rule, not the frost, sets it), and the shotgun at 14:05
      (delayed 45, exempt from separation and leaving prev_effective at 13:55).

  - name: course_play_posture
    trigger: "POST /weather-events, POST /weather-events/{id}/clear"
    algorithm: projection
    formula: |
      active = WeatherEvent rows where course_id == course.id and status == "ACTIVE"
      # PRECEDENCE IS PINNED, most restrictive first.
      if any e in active with e.event_type in {"LIGHTNING", "STORM_DAMAGE"}:
          play_posture = "CLOSED";        frost_delay_minutes = 0
      elif any e in active with e.event_type == "FROST":
          governing = the row in active with event_type == "FROST" having the
                      greatest declared_at; tie-break greatest created_at
          play_posture = "FROST_DELAY";   frost_delay_minutes = governing.delay_minutes
      elif any e in active with e.event_type == "HEAVY_RAIN":
          play_posture = "CART_PATH_ONLY"; frost_delay_minutes = 0
      else:
          play_posture = "OPEN";           frost_delay_minutes = 0
    input_set: "WeatherEvent rows on this course with status == ACTIVE; CLEARED rows are ignored."
    constants:
      PRECEDENCE_ORDER: "CLOSED > FROST_DELAY > CART_PATH_ONLY > OPEN"
    precision: "not applicable; enum derivation"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table
# ---------------------------------------------------------------------------
# Priority is a total order over ALL rules. When a single request violates two or
# more rules, the rule with the numerically smallest priority determines the
# response, and no later rule's error is reported. Evaluation is strictly
# sequential: authentication, then authorization, then request shape, then
# existence of every referenced entity, then state legality, then optimistic
# concurrency, then business rules in the declared band order.
validations:
  # --- Band A: transport (1-3) -----------------------------------------------
  - priority: 1
    rule: "X-User-Role header is present and is one of the five declared roles"
    category: auth
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "every endpoint"
    note: "X-User-ID is additionally required on every endpoint listed in §1.7 as segregation-of-duties relevant; a missing X-User-ID on those endpoints is also ERR_UNAUTHENTICATED."

  - priority: 2
    rule: "The role in X-User-Role appears in the endpoint's roles list"
    category: authz
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "every endpoint"

  - priority: 3
    rule: "Request body parses, every required field is present and non-null, every field has the declared type, every enum value is a declared member, every UUID is a well-formed UUID, every number is within its declared range, and every interval satisfies start < end"
    category: request_shape
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every endpoint with a request body or query parameters"
    note: >
      Specifically covers: area_sq_ft > 0, hole_number in 1..18 (null only when
      area_type == PRACTICE_GREEN), mowing_height_mm in (0, 120],
      distance_to_water_ft >= 0, annual_water_allocation_gal > 0,
      water_restricted_threshold_pct < water_suspended_threshold_pct,
      nitrogen_lb_per_1000 in (0, 6] and required when task_type == FERTILITY
      and null otherwise, planned_window_end > planned_window_start,
      rate_lb_per_acre > 0, wind_speed_mph >= 0, nitrogen_pct in 0..100,
      rei_hours in 0..336, min_buffer_ft >= 0, max_wind_speed_mph > 0,
      window_end > window_start with a whole-minute duration (1..720 for an
      IrrigationRun, 1..600 for a MaintenanceWindow), max_flow_gpm > 0,
      max_concurrent_zones >= 1, daily_withdrawal_cap_gal > 0,
      target_moisture_deficit_pct in 0..60, crew_size in 1..40,
      end_at > start_at, holes_in_play in {9, 18}, field_size in 1..288,
      model_year in 1990..2100, purchase_cost > 0, expected_life_hours > 0,
      service_interval_hours > 0, avg_daily_hours >= 0, hours_added > 0,
      green_speed_ft in (0, 16], firmness_gravities in (0, 4],
      moisture_pct in 0..60, delay_minutes in 0..600 and > 0 exactly when
      event_type == FROST, affected_turf_area_ids non-empty exactly when
      event_type == STORM_DAMAGE, and limit in 1..100 / offset >= 0 on every
      list endpoint.

  # --- Band B: existence (4-16) ---------------------------------------------
  - priority: 4
    rule: "Every referenced Course exists (path id or course_id in the body)"
    category: existence
    error_id: ERR_COURSE_NOT_FOUND
    http_status: 404
    applies_to: "GET /courses/{id}, GET /courses/{id}/water-assessment, GET /courses/{id}/weather-events, PATCH /courses/{id}/water-allocation, POST /turf-areas, POST /agronomic-plans, POST /pump-stations, POST /maintenance-windows, POST /play-events, POST /equipment-units, POST /weather-events"

  - priority: 5
    rule: "Every referenced TurfArea exists (path id, turf_area_id in the body, or a member of affected_turf_area_ids)"
    category: existence
    error_id: ERR_TURF_AREA_NOT_FOUND
    http_status: 404
    applies_to: "GET /turf-areas/{id}, GET /turf-areas/{id}/playability-readings, POST /plan-tasks, POST /applications, POST /irrigation-runs, POST /maintenance-windows, POST /playability-readings, POST /weather-events"

  - priority: 6
    rule: "Every referenced AgronomicPlan exists"
    category: existence
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "GET /agronomic-plans/{id}, POST /agronomic-plans/{id}/submit, POST /agronomic-plans/{id}/return, POST /agronomic-plans/{id}/approve, POST /plan-tasks"

  - priority: 7
    rule: "Every referenced PlanTask exists"
    category: existence
    error_id: ERR_PLAN_TASK_NOT_FOUND
    http_status: 404
    applies_to: "GET /plan-tasks/{id}, POST /plan-tasks/{id}/schedule, POST /applications, POST /maintenance-windows"

  - priority: 8
    rule: "Every referenced Applicator exists"
    category: existence
    error_id: ERR_APPLICATOR_NOT_FOUND
    http_status: 404
    applies_to: "GET /applicators/{id}, POST /applications, POST /applications/{id}/verify"

  - priority: 9
    rule: "Every referenced PesticideProduct exists"
    category: existence
    error_id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    applies_to: "POST /applications"

  - priority: 10
    rule: "Every referenced Application exists"
    category: existence
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /applications/{id}, POST /applications/{id}/verify, POST /applications/{id}/void, POST /applications/{id}/release-posting"

  - priority: 11
    rule: "Every referenced PumpStation exists"
    category: existence
    error_id: ERR_PUMP_STATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /pump-stations/{id}, PATCH /pump-stations/{id}/status, POST /irrigation-runs"

  - priority: 12
    rule: "Every referenced IrrigationRun exists"
    category: existence
    error_id: ERR_IRRIGATION_RUN_NOT_FOUND
    http_status: 404
    applies_to: "GET /irrigation-runs/{id}, POST /irrigation-runs/{id}/complete, POST /irrigation-runs/{id}/reverse"

  - priority: 13
    rule: "Every referenced MaintenanceWindow exists"
    category: existence
    error_id: ERR_WINDOW_NOT_FOUND
    http_status: 404
    applies_to: "GET /maintenance-windows/{id}, POST /maintenance-windows/{id}/start, POST /maintenance-windows/{id}/complete, POST /maintenance-windows/{id}/reschedule, POST /plan-tasks/{id}/schedule"

  - priority: 14
    rule: "Every referenced PlayEvent exists"
    category: existence
    error_id: ERR_PLAY_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /play-events/{id}, POST /play-events/{id}/certify-conditions"

  - priority: 15
    rule: "Every referenced EquipmentUnit exists (path id or replacement_unit_id)"
    category: existence
    error_id: ERR_EQUIPMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /equipment-units/{id}, POST /equipment-units/{id}/log-hours, POST /equipment-units/{id}/service, POST /equipment-units/{id}/retire"

  - priority: 16
    rule: "Every referenced WeatherEvent exists"
    category: existence
    error_id: ERR_WEATHER_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /weather-events/{id}/clear"

  # --- Band C: state legality (17-24) ---------------------------------------
  - priority: 17
    rule: "The AgronomicPlan is in a state from which the requested transition or child mutation is declared: DRAFT for submit and for POST /plan-tasks, SUBMITTED for return and approve, ACTIVE for scheduling and completing its tasks"
    category: state
    error_id: ERR_PLAN_STATE_INVALID
    http_status: 409
    applies_to: "POST /agronomic-plans/{id}/submit, POST /agronomic-plans/{id}/return, POST /agronomic-plans/{id}/approve, POST /plan-tasks, POST /plan-tasks/{id}/schedule"

  - priority: 18
    rule: "The PlanTask is in a state from which the requested transition is declared: PLANNED for schedule, SCHEDULED for the application link"
    category: state
    error_id: ERR_TASK_STATE_INVALID
    http_status: 409
    applies_to: "POST /plan-tasks/{id}/schedule, POST /applications"

  - priority: 19
    rule: "The MaintenanceWindow is in a state from which the requested transition is declared: SCHEDULED for start and for the plan-task link, IN_PROGRESS for complete, SCHEDULED or DEFERRED for reschedule"
    category: state
    error_id: ERR_WINDOW_STATE_INVALID
    http_status: 409
    applies_to: "POST /maintenance-windows/{id}/start, POST /maintenance-windows/{id}/complete, POST /maintenance-windows/{id}/reschedule, POST /plan-tasks/{id}/schedule"

  - priority: 20
    rule: "The IrrigationRun is SCHEDULED for complete and COMPLETED for reverse"
    category: state
    error_id: ERR_RUN_STATE_INVALID
    http_status: 409
    applies_to: "POST /irrigation-runs/{id}/complete, POST /irrigation-runs/{id}/reverse"

  - priority: 21
    rule: "The Application record_status is RECORDED for verify, RECORDED or VERIFIED for void, and its posting_status is POSTED for release-posting"
    category: state
    error_id: ERR_APPLICATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /applications/{id}/verify, POST /applications/{id}/void, POST /applications/{id}/release-posting"

  - priority: 22
    rule: "The EquipmentUnit is IN_SERVICE or DOWN_FOR_SERVICE for log-hours, DOWN_FOR_SERVICE for service, and not already RETIRED for retire; a replacement_unit_id must point at a unit that is IN_SERVICE"
    category: state
    error_id: ERR_EQUIPMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /equipment-units/{id}/log-hours, POST /equipment-units/{id}/service, POST /equipment-units/{id}/retire"

  - priority: 23
    rule: "The WeatherEvent is ACTIVE for clear"
    category: state
    error_id: ERR_WEATHER_STATE_INVALID
    http_status: 409
    applies_to: "POST /weather-events/{id}/clear"

  - priority: 24
    rule: "The PlayEvent status is SCHEDULED or DELAYED for certify-conditions; a CANCELLED event cannot be certified"
    category: state
    error_id: ERR_PLAY_EVENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /play-events/{id}/certify-conditions"

  # --- Band D: optimistic concurrency (25-27) -------------------------------
  - priority: 25
    rule: "expected_course_version equals the current Course.version"
    category: concurrency
    error_id: ERR_STALE_COURSE_VERSION
    http_status: 412
    applies_to: "POST /weather-events"

  - priority: 26
    rule: "expected_plan_version equals the current AgronomicPlan.version"
    category: concurrency
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
    applies_to: "POST /agronomic-plans/{id}/approve, POST /plan-tasks/{id}/schedule"

  - priority: 27
    rule: "expected_pump_station_version equals the current PumpStation.version"
    category: concurrency
    error_id: ERR_STALE_PUMP_VERSION
    http_status: 412
    applies_to: "POST /irrigation-runs"

  # --- Band E: business_safety (28-34) --------------------------------------
  - priority: 28
    rule: "The recording Applicator's license must cover the application: date(Application.applied_at) <= Applicator.license_expires_on and license_status != SUSPENDED. On POST /applications/{id}/verify the same test is applied to the verifying Applicator resolved from X-User-ID."
    category: business_safety
    error_id: ERR_LICENSE_EXPIRED
    http_status: 422
    applies_to: "POST /applications, POST /applications/{id}/verify"
    note: "The license remains usable through the whole of license_expires_on, so an applied_at on the expiry date passes and one on the following day fails."

  - priority: 29
    rule: "The recorded wind_speed_mph must not exceed the PesticideProduct's max_wind_speed_mph; the comparison is inclusive, so wind exactly at the limit is permitted"
    category: business_safety
    error_id: ERR_WIND_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /applications"

  - priority: 30
    rule: "The smaller of the Application's observed distance_to_water_ft and the target TurfArea's distance_to_water_ft must be greater than or equal to the PesticideProduct's min_buffer_ft; the comparison is inclusive, so a distance exactly equal to the buffer is permitted"
    category: business_safety
    error_id: ERR_BUFFER_ZONE_VIOLATION
    http_status: 422
    applies_to: "POST /applications"

  - priority: 31
    rule: "After adding this task's or application's nitrogen, the TurfArea's planned_commitment variant of turf_nitrogen_load must not exceed MAX_N_LB_PER_1000_BY_AREA_TYPE for the area's area_type"
    category: business_safety
    error_id: ERR_NITROGEN_LOAD_LIMIT
    http_status: 422
    applies_to: "POST /plan-tasks, POST /applications"

  - priority: 32
    rule: >
      A crew may not enter a treated area while its restricted-entry interval is
      running, where the interval is TurfArea.rei_expires_at (the latest
      rei_expires_at over Application rows on that area whose posting_status is
      still POSTED). On POST /maintenance-windows and reschedule the test is
      window_start >= TurfArea.rei_expires_at; on start the test is
      logical clock >= TurfArea.rei_expires_at. Both comparisons are inclusive.
      task_type == STORM_CLEANUP is exempt. The rule is vacuous when
      TurfArea.rei_expires_at is null. On POST /applications/{id}/release-posting
      the test is instead logical clock >= that Application's own rei_expires_at.
    category: business_safety
    error_id: ERR_REI_ACTIVE
    http_status: 409
    applies_to: "POST /maintenance-windows, POST /maintenance-windows/{id}/reschedule, POST /maintenance-windows/{id}/start, POST /applications/{id}/release-posting"

  - priority: 33
    rule: "No Application, IrrigationRun, MaintenanceWindow start or PlayEvent certification may be recorded while the Course play_posture is CLOSED. A MaintenanceWindow whose task_type == STORM_CLEANUP is exempt, since storm cleanup is exactly the work a closed course needs."
    category: business_safety
    error_id: ERR_COURSE_CLOSED
    http_status: 409
    applies_to: "POST /applications, POST /irrigation-runs, POST /maintenance-windows/{id}/start, POST /play-events/{id}/certify-conditions"

  - priority: 34
    rule: "The target TurfArea's agronomic_status must not be OUT_OF_PLAY for an Application, an IrrigationRun, a PlayabilityReading or a new PlanTask"
    category: business_safety
    error_id: ERR_TURF_AREA_OUT_OF_PLAY
    http_status: 409
    applies_to: "POST /applications, POST /irrigation-runs, POST /playability-readings, POST /plan-tasks"

  # --- Band F: business_referential (35-38) ---------------------------------
  - priority: 35
    rule: >
      The Applicator's license_category must authorise the PesticideProduct's
      requires_license_category: CAT_3_AND_7 authorises both CAT_3_TURF and
      CAT_7_AQUATIC, CAT_3_TURF authorises only CAT_3_TURF, and CAT_7_AQUATIC
      authorises only CAT_7_AQUATIC. On POST /applications/{id}/verify the same
      test is applied to the verifying Applicator resolved from X-User-ID.
    category: business_referential
    error_id: ERR_LICENSE_CATEGORY_MISMATCH
    http_status: 422
    applies_to: "POST /applications, POST /applications/{id}/verify"

  - priority: 36
    rule: >
      Cross-aggregate coordinates must agree. When an Application cites a
      plan_task_id, that PlanTask's turf_area_id must equal the Application's
      turf_area_id. On POST /plan-tasks/{id}/schedule the named
      MaintenanceWindow's turf_area_id must equal the PlanTask's turf_area_id.
      When a MaintenanceWindow is created, its turf_area_id must belong to its
      course_id (TurfArea.course_id == MaintenanceWindow.course_id), and the same
      containment is required of PlanTask (its plan's course must own its turf
      area), IrrigationRun (its station's course must own its turf area) and
      WeatherEvent (every affected_turf_area_ids member must belong to the
      declaring course).
    category: business_referential
    error_id: ERR_TASK_TURF_AREA_MISMATCH
    http_status: 422
    applies_to: "POST /applications, POST /plan-tasks, POST /plan-tasks/{id}/schedule, POST /maintenance-windows, POST /irrigation-runs, POST /weather-events"

  - priority: 37
    rule: "A replacement_unit_id supplied on retire must reference an EquipmentUnit on the same course whose unit_type equals the retiring unit's unit_type"
    category: business_referential
    error_id: ERR_REPLACEMENT_UNIT_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /equipment-units/{id}/retire"

  - priority: 38
    rule: "A caller acting as Applicator may not verify an Application whose applicator_id equals the caller's X-User-ID, and the caller of approve on an AgronomicPlan must not be the X-User-ID recorded in that plan's submitted_by_user_id"
    category: business_referential
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /applications/{id}/verify, POST /agronomic-plans/{id}/approve"
    note: "Deliberately ordered after existence and state so that a self-verify attempt on a non-existent or already-VOIDED application reports the earlier error."

  # --- Band G: business_temporal (39-41) ------------------------------------
  - priority: 39
    rule: "Two MaintenanceWindow rows on the same TurfArea may not overlap on CLOSED intervals: a conflict exists when new.window_start <= other.window_end AND other.window_start <= new.window_end, evaluated against rows in status SCHEDULED, DEFERRED or IN_PROGRESS. Touching endpoints therefore conflict."
    category: business_temporal
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /maintenance-windows, POST /maintenance-windows/{id}/reschedule"

  - priority: 40
    rule: "A MaintenanceWindow may not collide with play on any of its holes: with the window interval extended to [window_start, window_end + CLEARANCE_BUFFER_MINUTES), a conflict exists when that HALF-OPEN interval intersects a PlayEvent's hole-occupancy interval for a shared hole. SHOTGUN_START events occupy every hole 1..holes_in_play for their entire [effective_start_at, end_at) interval; STANDARD_TEE_TIMES and TOURNAMENT_ROUND events occupy hole h only during [effective_start_at + (h-1) * HOLE_PACE_MINUTES, effective_start_at + h * HOLE_PACE_MINUTES)."
    category: business_temporal
    error_id: ERR_WINDOW_CONFLICTS_PLAY
    http_status: 409
    applies_to: "POST /maintenance-windows, POST /maintenance-windows/{id}/reschedule"
    note: >
      CLEARANCE_BUFFER_MINUTES = 30, HOLE_PACE_MINUTES = 12. Only PlayEvent rows
      in status SCHEDULED or DELAYED are considered, and only holes 1..holes_in_play
      of the play event intersected with the hole of the window's TurfArea
      (TurfArea.hole_number; a PRACTICE_GREEN with a null hole_number shares no
      hole with any play event and therefore never conflicts).

  - priority: 41
    rule: "Plan-window containment. On POST /applications with a plan_task_id, applied_at must fall inside [PlanTask.planned_window_start, PlanTask.planned_window_end) and inside the plan's calendar year. On POST /plan-tasks/{id}/schedule the named MaintenanceWindow's interval must be contained in the task's planned window: window_start >= planned_window_start and window_end <= planned_window_end."
    category: business_temporal
    error_id: ERR_APPLICATION_OUTSIDE_PLAN_WINDOW
    http_status: 422
    applies_to: "POST /applications, POST /plan-tasks/{id}/schedule"

  # --- Band H: business_constraint (42-49) ----------------------------------
  - priority: 42
    rule: "license_number is unique across all Applicator rows"
    category: business_constraint
    error_id: ERR_DUPLICATE_LICENSE_NUMBER
    http_status: 409
    applies_to: "POST /applicators"

  - priority: 43
    rule: "The PumpStation status must not be OFFLINE. ONLINE and RESTRICTED both admit runs (a RESTRICTED station simply irrigates at the reduced posture factor); only an explicitly OFFLINE station refuses them."
    category: business_constraint
    error_id: ERR_PUMP_OFFLINE
    http_status: 409
    applies_to: "POST /irrigation-runs, POST /irrigation-runs/{id}/complete"

  - priority: 44
    rule: "The number of SCHEDULED IrrigationRun rows on the station whose HALF-OPEN [window_start, window_end) interval intersects the new run's interval, plus one, must not exceed max_concurrent_zones. Adjacent runs that merely touch endpoints are not counted."
    category: business_constraint
    error_id: ERR_PUMP_ZONE_CAPACITY
    http_status: 409
    applies_to: "POST /irrigation-runs"

  - priority: 45
    rule: "The sum of flow_gpm over the intersecting SCHEDULED runs identified by priority 44, plus the new run's flow_gpm, must not exceed the station's max_flow_gpm"
    category: business_constraint
    error_id: ERR_PUMP_FLOW_CAPACITY
    http_status: 409
    applies_to: "POST /irrigation-runs"

  - priority: 46
    rule: "MaintenanceWindow.deferral_count must be strictly less than MAX_WINDOW_DEFERRALS (2) for a reschedule out of DEFERRED, and a weather cascade that would push a window past the cap CANCELS it instead of deferring it"
    category: business_constraint
    error_id: ERR_DEFERRAL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /maintenance-windows/{id}/reschedule"

  - priority: 47
    rule: "AgronomicPlan.return_count must be strictly less than MAX_PLAN_RETURNS (2) for a return out of SUBMITTED"
    category: business_constraint
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /agronomic-plans/{id}/return"

  - priority: 48
    rule: "At least MIN_GREENS_MEASURED (3) distinct ACTIVE GREEN turf areas of the course must carry a PlayabilityReading inside the readiness window"
    category: business_constraint
    error_id: ERR_INSUFFICIENT_READINGS
    http_status: 422
    applies_to: "POST /play-events/{id}/certify-conditions"

  - priority: 49
    rule: "The computed allotted_gal of a new IrrigationRun must be strictly greater than zero"
    category: business_constraint
    error_id: ERR_ZERO_ALLOTMENT
    http_status: 422
    applies_to: "POST /irrigation-runs"

  # --- Band I: business_fiscal (50-51) --------------------------------------
  - priority: 50
    rule: "For a PumpStation whose source_type is not RECLAIMED, course.water_used_gal plus the new run's allotted_gal must not exceed course.annual_water_allocation_gal. RECLAIMED stations are exempt."
    category: business_fiscal
    error_id: ERR_WATER_ALLOCATION_EXCEEDED
    http_status: 422
    applies_to: "POST /irrigation-runs"

  - priority: 51
    rule: "AgronomicPlan.committed_nitrogen_lb after this scheduling must not exceed AgronomicPlan.nitrogen_budget_lb; the comparison is inclusive, so a value exactly equal to the budget is allowed"
    category: business_fiscal
    error_id: ERR_NITROGEN_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /plan-tasks/{id}/schedule"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
# Flat topology: every collection is a top-level path. Parent scoping travels in
# the request body as an FK field and is discovered through a filtered list GET
# or, for the two leaf children, through a sub-resource GET.
endpoints:
  # --- Course ----------------------------------------------------------------
  - method: POST
    path: "/courses"
    description: "Register a golf course with its annual water allocation and posture thresholds."
    roles: [Superintendent]
    code: 201
    input: ["name", "region_code", "annual_water_allocation_gal", "water_restricted_threshold_pct?", "water_suspended_threshold_pct?"]
    output: Course
    side_effects:
      - "Course created with water_used_gal 0, water_posture OPEN, play_posture OPEN, frost_delay_minutes 0, version 1"

  - method: GET
    path: "/courses"
    description: "List courses."
    roles: [Superintendent, Agronomist, Applicator, TournamentOfficial, EquipmentTechnician]
    code: 200
    input: ["region_code?", "water_posture?", "play_posture?", "limit?", "offset?"]
    output: Course[]
    side_effects: []

  - method: GET
    path: "/courses/{id}"
    description: "Read one course, including both derived postures."
    roles: [Superintendent, Agronomist, Applicator, TournamentOfficial, EquipmentTechnician]
    code: 200
    input: []
    output: Course
    side_effects: []

  - method: PATCH
    path: "/courses/{id}/water-allocation"
    description: "Revise the annual allocation and/or the posture thresholds; the water posture is re-derived immediately."
    roles: [Superintendent]
    code: 200
    input: ["annual_water_allocation_gal?", "water_restricted_threshold_pct?", "water_suspended_threshold_pct?"]
    output: Course
    side_effects:
      - "calculations.course_water_posture re-evaluated; water_posture may move in either direction"
      - "PumpStation.status mirrored to RESTRICTED or back to ONLINE per the Course machine"
      - "when the new posture is SUSPENDED: every SCHEDULED IrrigationRun on this course's stations transitions SCHEDULED -> CANCELLED"
      - "Course.version incremented by 1"

  - method: GET
    path: "/courses/{id}/water-assessment"
    description: "Computed read: the tiered overage assessment for this course. Returns no entity; the body is the assessment breakdown."
    roles: [Superintendent]
    code: 200
    input: []
    output: { billable_gal: number, base_charge: number, tier: string, surcharge_rate: number, surcharge: number, total_charge: number }
    side_effects: []

  - method: GET
    path: "/courses/{id}/weather-events"
    description: "Reverse lookup for WeatherEvent.course_id: every weather event declared on this course, newest declared_at first."
    roles: [Superintendent, Agronomist, TournamentOfficial]
    code: 200
    input: ["status?", "event_type?", "limit?", "offset?"]
    output: WeatherEvent[]
    side_effects: []

  # --- TurfArea --------------------------------------------------------------
  - method: POST
    path: "/turf-areas"
    description: "Register a maintained turf area on a course."
    roles: [Superintendent, Agronomist]
    code: 201
    input: ["course_id", "area_type", "hole_number?", "area_sq_ft", "mowing_height_mm", "distance_to_water_ft", "soil_type", "target_moisture_pct?"]
    output: TurfArea
    side_effects:
      - "TurfArea created with agronomic_status ACTIVE, both nitrogen ledgers 0, current_moisture_pct null, rei_expires_at null, version 1"

  - method: GET
    path: "/turf-areas"
    description: "Reverse lookup for TurfArea.course_id; also the filtered browse surface for the agronomist."
    roles: [Superintendent, Agronomist, Applicator, TournamentOfficial]
    code: 200
    input: ["course_id?", "area_type?", "agronomic_status?", "hole_number?", "limit?", "offset?"]
    output: TurfArea[]
    side_effects: []

  - method: GET
    path: "/turf-areas/{id}"
    description: "Read one turf area, including both nitrogen-load variants and the restricted-entry expiry."
    roles: [Superintendent, Agronomist, Applicator, TournamentOfficial]
    code: 200
    input: []
    output: TurfArea
    side_effects: []

  - method: GET
    path: "/turf-areas/{id}/playability-readings"
    description: "Reverse lookup for PlayabilityReading.turf_area_id: every reading on this area, newest measured_at first."
    roles: [Superintendent, Agronomist, TournamentOfficial]
    code: 200
    input: ["limit?", "offset?"]
    output: PlayabilityReading[]
    side_effects: []

  # --- AgronomicPlan ---------------------------------------------------------
  - method: POST
    path: "/agronomic-plans"
    description: "Open an annual agronomic plan for a course and plan year."
    roles: [Agronomist]
    code: 201
    input: [course_id, plan_year, nitrogen_budget_lb]
    output: AgronomicPlan
    side_effects:
      - "AgronomicPlan created in DRAFT with committed_nitrogen_lb 0, return_count 0, submitted_by_user_id null, version 1"

  - method: GET
    path: "/agronomic-plans"
    description: "Reverse lookup for AgronomicPlan.course_id."
    roles: [Superintendent, Agronomist]
    code: 200
    input: ["course_id?", "plan_year?", "status?", "limit?", "offset?"]
    output: AgronomicPlan[]
    side_effects: []

  - method: GET
    path: "/agronomic-plans/{id}"
    description: "Read one plan, including the committed-nitrogen ledger."
    roles: [Superintendent, Agronomist]
    code: 200
    input: []
    output: AgronomicPlan
    side_effects: []

  - method: POST
    path: "/agronomic-plans/{id}/submit"
    description: "Submit a DRAFT plan for superintendent approval."
    roles: [Agronomist]
    code: 200
    input: []
    output: AgronomicPlan
    side_effects:
      - "AgronomicPlan DRAFT -> SUBMITTED; submitted_by_user_id := X-User-ID; version incremented by 1"

  - method: POST
    path: "/agronomic-plans/{id}/return"
    description: "Return a SUBMITTED plan to the agronomist for revision. Capped at MAX_PLAN_RETURNS."
    roles: [Superintendent]
    code: 200
    input: ["return_note?"]
    output: AgronomicPlan
    side_effects:
      - "AgronomicPlan SUBMITTED -> DRAFT; return_count incremented by 1; submitted_by_user_id := null; version incremented by 1"

  - method: POST
    path: "/agronomic-plans/{id}/approve"
    description: "Approve a SUBMITTED plan, activating it. Requires the plan version the approver read and a different caller than the submitter."
    roles: [Superintendent]
    code: 200
    input: [expected_plan_version]
    output: AgronomicPlan
    side_effects:
      - "AgronomicPlan SUBMITTED -> ACTIVE; version incremented by 1"

  # --- PlanTask --------------------------------------------------------------
  - method: POST
    path: "/plan-tasks"
    description: "Add a task to a DRAFT plan. FERTILITY tasks carry a nitrogen rate and a per-task commitment."
    roles: [Agronomist]
    code: 201
    input: ["plan_id", "turf_area_id", "task_type", "nitrogen_lb_per_1000?", "planned_window_start", "planned_window_end"]
    output: PlanTask
    side_effects:
      - "PlanTask created in PLANNED; commitment_lb set by calculations.plan_nitrogen_commitment_lb step 1; version 1"
      - "TurfArea.nitrogen_projected_lb_per_1000 recomputed by calculations.turf_nitrogen_load variant planned_commitment; that TurfArea.version incremented by 1"

  - method: GET
    path: "/plan-tasks"
    description: "Reverse lookup for PlanTask.plan_id and PlanTask.turf_area_id."
    roles: [Superintendent, Agronomist]
    code: 200
    input: ["plan_id?", "turf_area_id?", "task_type?", "status?", "limit?", "offset?"]
    output: PlanTask[]
    side_effects: []

  - method: GET
    path: "/plan-tasks/{id}"
    description: "Read one plan task."
    roles: [Superintendent, Agronomist]
    code: 200
    input: []
    output: PlanTask
    side_effects: []

  - method: POST
    path: "/plan-tasks/{id}/schedule"
    description: "Bind a PLANNED task to a SCHEDULED maintenance window, committing its nitrogen against the plan budget. Requires the plan version the scheduler read."
    roles: [Agronomist]
    code: 200
    input: [maintenance_window_id, expected_plan_version]
    output: PlanTask
    side_effects:
      - "PlanTask PLANNED -> SCHEDULED; version incremented by 1"
      - "MaintenanceWindow.plan_task_id := this task's id; that window's version incremented by 1"
      - "AgronomicPlan.committed_nitrogen_lb recomputed; AgronomicPlan.version incremented by 1"
      - "TurfArea.nitrogen_projected_lb_per_1000 recomputed; that TurfArea.version incremented by 1"

  # --- Applicator ------------------------------------------------------------
  - method: POST
    path: "/applicators"
    description: "Register a licensed applicator. The returned id is the identity a caller presents in X-User-ID when acting as Applicator."
    roles: [Superintendent]
    code: 201
    input: [full_name, license_number, license_category, license_expires_on]
    output: Applicator
    side_effects:
      - "Applicator created with license_status derived from the logical clock, suspended_at null, version 1"

  - method: GET
    path: "/applicators"
    description: "List applicators."
    roles: [Superintendent, Agronomist, Applicator]
    code: 200
    input: ["license_category?", "license_status?", "limit?", "offset?"]
    output: Applicator[]
    side_effects: []

  - method: GET
    path: "/applicators/{id}"
    description: "Read one applicator, including the derived license status."
    roles: [Superintendent, Agronomist, Applicator]
    code: 200
    input: []
    output: Applicator
    side_effects: []

  # --- PesticideProduct ------------------------------------------------------
  - method: POST
    path: "/pesticide-products"
    description: "Register an immutable product label: restricted-entry interval, buffer, wind ceiling, posting requirement and nitrogen content."
    roles: [Superintendent]
    code: 201
    input: ["trade_name", "epa_reg_no", "requires_license_category", "rei_hours", "min_buffer_ft", "max_wind_speed_mph", "posting_required", "nitrogen_pct?"]
    output: PesticideProduct
    side_effects:
      - "PesticideProduct created with id and created_at only; no version field and no update endpoint"

  - method: GET
    path: "/pesticide-products"
    description: "List product labels."
    roles: [Superintendent, Agronomist, Applicator]
    code: 200
    input: ["requires_license_category?", "posting_required?", "limit?", "offset?"]
    output: PesticideProduct[]
    side_effects: []

  - method: GET
    path: "/pesticide-products/{id}"
    description: "Read one product label."
    roles: [Superintendent, Agronomist, Applicator]
    code: 200
    input: []
    output: PesticideProduct
    side_effects: []

  # --- Application -----------------------------------------------------------
  - method: POST
    path: "/applications"
    description: "Record a pesticide or fertiliser application. Runs the full licensing, wind, buffer and nitrogen-load gauntlet and opens the restricted-entry interval."
    roles: [Applicator]
    code: 201
    input: ["turf_area_id", "product_id", "applicator_id", "plan_task_id?", "applied_at", "rate_lb_per_acre", "wind_speed_mph", "distance_to_water_ft"]
    output: Application
    side_effects:
      - "total_lb, nitrogen_lb and rei_expires_at set by calculations.application_mass_and_nitrogen"
      - "record_status := RECORDED; posting_status := POSTED when the product's posting_required is true, else NOT_REQUIRED; version 1"
      - "TurfArea.nitrogen_applied_lb_per_1000_ytd and nitrogen_projected_lb_per_1000 recomputed by calculations.turf_nitrogen_load; TurfArea.rei_expires_at recomputed when posting_status == POSTED; that TurfArea.version incremented by 1"

  - method: GET
    path: "/applications"
    description: "Reverse lookup for all five Application foreign keys."
    roles: [Superintendent, Agronomist, Applicator]
    code: 200
    input: ["turf_area_id?", "product_id?", "applicator_id?", "plan_task_id?", "verified_by_applicator_id?", "record_status?", "posting_status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: GET
    path: "/applications/{id}"
    description: "Read one application record, including both status dimensions."
    roles: [Superintendent, Agronomist, Applicator]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: "/applications/{id}/verify"
    description: "Second-applicator verification of a RECORDED application. The caller's X-User-ID must not be the applicator who made the application."
    roles: [Applicator]
    code: 200
    input: []
    output: Application
    side_effects:
      - "record_status RECORDED -> VERIFIED; verified_by_applicator_id := X-User-ID; version incremented by 1"

  - method: POST
    path: "/applications/{id}/void"
    description: "Void an application record. A SAFETY_VIOLATION void also suspends the recording applicator's license and can reopen a closed plan."
    roles: [Superintendent]
    code: 200
    input: [void_reason]
    output: Application
    side_effects:
      - "record_status -> VOIDED; void_reason stored; posting_status := RELEASED when it was POSTED; version incremented by 1"
      - "TurfArea nitrogen ledgers and rei_expires_at recomputed; that TurfArea.version incremented by 1"
      - "when void_reason == SAFETY_VIOLATION: Applicator.license_status := SUSPENDED, suspended_at := logical clock, that Applicator.version incremented by 1"
      - "when plan_task_id is not null and that PlanTask is COMPLETED: PlanTask COMPLETED -> SCHEDULED, AgronomicPlan.committed_nitrogen_lb recomputed, and a CLOSED plan reopens CLOSED -> ACTIVE"

  - method: POST
    path: "/applications/{id}/release-posting"
    description: "Take down the re-entry notice once the restricted-entry interval has elapsed. Independent of the record dimension."
    roles: [Applicator]
    code: 200
    input: []
    output: Application
    side_effects:
      - "posting_status POSTED -> RELEASED; version incremented by 1"
      - "TurfArea.rei_expires_at recomputed over the remaining POSTED applications; that TurfArea.version incremented by 1"

  # --- PumpStation -----------------------------------------------------------
  - method: POST
    path: "/pump-stations"
    description: "Register an irrigation pump station with its flow, zone and daily-withdrawal limits."
    roles: [Superintendent]
    code: 201
    input: [course_id, source_type, max_flow_gpm, max_concurrent_zones, daily_withdrawal_cap_gal]
    output: PumpStation
    side_effects:
      - "PumpStation created ONLINE with withdrawn_today_gal 0 and version 1; created RESTRICTED instead when the owning Course.water_posture is already RESTRICTED or SUSPENDED"

  - method: GET
    path: "/pump-stations"
    description: "Reverse lookup for PumpStation.course_id."
    roles: [Superintendent, Agronomist]
    code: 200
    input: ["course_id?", "source_type?", "status?", "limit?", "offset?"]
    output: PumpStation[]
    side_effects: []

  - method: GET
    path: "/pump-stations/{id}"
    description: "Read one station, including today's withdrawal ledger."
    roles: [Superintendent, Agronomist]
    code: 200
    input: []
    output: PumpStation
    side_effects: []

  - method: PATCH
    path: "/pump-stations/{id}/status"
    description: "Take a station OFFLINE for repair or bring it back ONLINE. Taking it OFFLINE cancels its scheduled runs."
    roles: [Superintendent, EquipmentTechnician]
    code: 200
    input: [status]
    output: PumpStation
    side_effects:
      - "PumpStation.status := supplied value; version incremented by 1"
      - "when the new status is OFFLINE: every SCHEDULED IrrigationRun on this station transitions SCHEDULED -> CANCELLED"

  # --- IrrigationRun ---------------------------------------------------------
  - method: POST
    path: "/irrigation-runs"
    description: "Schedule an irrigation run. The allotment is the minimum of agronomic demand scaled by the water posture and the station's remaining daily headroom, and is then checked against zone and flow capacity. Requires the station version the scheduler read."
    roles: [Agronomist]
    code: 201
    input: [pump_station_id, turf_area_id, window_start, window_end, target_moisture_deficit_pct, expected_pump_station_version]
    output: IrrigationRun
    side_effects:
      - "allotted_gal and flow_gpm set by calculations.irrigation_run_allotment; volume_gal 0; status SCHEDULED; version 1"

  - method: GET
    path: "/irrigation-runs"
    description: "Reverse lookup for IrrigationRun.pump_station_id and IrrigationRun.turf_area_id."
    roles: [Superintendent, Agronomist]
    code: 200
    input: ["pump_station_id?", "turf_area_id?", "status?", "limit?", "offset?"]
    output: IrrigationRun[]
    side_effects: []

  - method: GET
    path: "/irrigation-runs/{id}"
    description: "Read one irrigation run."
    roles: [Superintendent, Agronomist]
    code: 200
    input: []
    output: IrrigationRun
    side_effects: []

  - method: POST
    path: "/irrigation-runs/{id}/complete"
    description: "Close out a run, booking its withdrawn volume into the station's daily ledger and the course's annual ledger."
    roles: [Agronomist]
    code: 200
    input: ["actual_minutes?"]
    output: IrrigationRun
    side_effects:
      - "volume_gal set from allotted_gal prorated by actual_minutes; status SCHEDULED -> COMPLETED; version incremented by 1"
      - "PumpStation.withdrawn_today_gal recomputed; that PumpStation.version incremented by 1"
      - "Course.water_used_gal recomputed and water_posture re-derived, which may mirror station statuses to RESTRICTED and cancel SCHEDULED runs; Course.version incremented by 1"

  - method: POST
    path: "/irrigation-runs/{id}/reverse"
    description: "Reverse a completed run booked in error, returning its volume to both ledgers."
    roles: [Superintendent]
    code: 200
    input: ["reversal_note?"]
    output: IrrigationRun
    side_effects:
      - "volume_gal := 0; status COMPLETED -> REVERSED; version incremented by 1"
      - "PumpStation.withdrawn_today_gal recomputed; that PumpStation.version incremented by 1"
      - "Course.water_used_gal recomputed and water_posture re-derived, which may relax station statuses back to ONLINE; Course.version incremented by 1"

  # --- MaintenanceWindow ----------------------------------------------------
  - method: POST
    path: "/maintenance-windows"
    description: "Book a crew occupation window on a turf area. Checked against other windows on that area (closed intervals), against play on the shared hole (half-open with a clearance buffer) and against the restricted-entry interval."
    roles: [Agronomist]
    code: 201
    input: ["course_id", "turf_area_id", "task_type", "window_start", "window_end", "crew_size", "required_unit_type?"]
    output: MaintenanceWindow
    side_effects:
      - "MaintenanceWindow created SCHEDULED with plan_task_id null, deferral_count 0, crew_hours computed, version 1"

  - method: GET
    path: "/maintenance-windows"
    description: "Reverse lookup for MaintenanceWindow.course_id, turf_area_id and plan_task_id."
    roles: [Superintendent, Agronomist, EquipmentTechnician]
    code: 200
    input: ["course_id?", "turf_area_id?", "plan_task_id?", "task_type?", "status?", "limit?", "offset?"]
    output: MaintenanceWindow[]
    side_effects: []

  - method: GET
    path: "/maintenance-windows/{id}"
    description: "Read one maintenance window."
    roles: [Superintendent, Agronomist, EquipmentTechnician]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: []

  - method: POST
    path: "/maintenance-windows/{id}/start"
    description: "Put the crew on the ground. Re-checks the course posture, the area's play status and the restricted-entry interval at the actual start instant."
    roles: [Agronomist]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects:
      - "status SCHEDULED -> IN_PROGRESS; version incremented by 1"
      - "when task_type == AERATION: TurfArea.agronomic_status := UNDER_RENOVATION; that TurfArea.version incremented by 1"

  - method: POST
    path: "/maintenance-windows/{id}/complete"
    description: "Close out the window, completing any plan task it carried."
    roles: [Agronomist]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects:
      - "status IN_PROGRESS -> COMPLETED; version incremented by 1"
      - "when task_type == AERATION: TurfArea.agronomic_status returns to ACTIVE; that TurfArea.version incremented by 1"
      - "when plan_task_id is not null: PlanTask SCHEDULED -> COMPLETED, the plan ledger is recomputed and the plan's ACTIVE -> CLOSED bubble-up is re-evaluated"

  - method: POST
    path: "/maintenance-windows/{id}/reschedule"
    description: "Move a SCHEDULED or DEFERRED window to a new interval, re-running every booking check and restoring any deferred plan task's commitment."
    roles: [Agronomist]
    code: 200
    input: ["window_start", "window_end", "crew_size?"]
    output: MaintenanceWindow
    side_effects:
      - "window_start / window_end replaced; crew_hours recomputed; status := SCHEDULED; version incremented by 1"
      - "when plan_task_id is not null and that PlanTask is PLANNED: PlanTask PLANNED -> SCHEDULED, restoring commitment_lb to AgronomicPlan.committed_nitrogen_lb and to TurfArea.nitrogen_projected_lb_per_1000"

  # --- PlayEvent -------------------------------------------------------------
  - method: POST
    path: "/play-events"
    description: "Post a round: sequential tee times, a tournament round, or a simultaneous-start shotgun that occupies every hole at once."
    roles: [TournamentOfficial, Superintendent]
    code: 201
    input: [course_id, event_type, start_at, end_at, holes_in_play, field_size]
    output: PlayEvent
    side_effects:
      - "PlayEvent created SCHEDULED / PENDING with delayed_minutes 0, effective_start_at := start_at, readiness_index null, version 1"

  - method: GET
    path: "/play-events"
    description: "Reverse lookup for PlayEvent.course_id."
    roles: [Superintendent, Agronomist, TournamentOfficial]
    code: 200
    input: ["course_id?", "event_type?", "status?", "readiness_status?", "limit?", "offset?"]
    output: PlayEvent[]
    side_effects: []

  - method: GET
    path: "/play-events/{id}"
    description: "Read one play event, including the frost pushback and the readiness dimension."
    roles: [Superintendent, Agronomist, TournamentOfficial]
    code: 200
    input: []
    output: PlayEvent
    side_effects: []

  - method: POST
    path: "/play-events/{id}/certify-conditions"
    description: "Certify playing conditions from the greens measured in the 24 hours before the posted start. Re-attemptable after a failure."
    roles: [TournamentOfficial]
    code: 200
    input: []
    output: PlayEvent
    side_effects:
      - "readiness_index set by calculations.tournament_readiness_index; readiness_status := CERTIFIED or FAILED; version incremented by 1"

  # --- EquipmentUnit ---------------------------------------------------------
  - method: POST
    path: "/equipment-units"
    description: "Add a machine to the fleet with its design life, service interval and average daily usage."
    roles: [Superintendent, EquipmentTechnician]
    code: 201
    input: ["course_id", "unit_type", "model_year", "purchase_cost", "expected_life_hours", "service_interval_hours", "avg_daily_hours", "initial_engine_hours?"]
    output: EquipmentUnit
    side_effects:
      - "EquipmentUnit created IN_SERVICE with engine_hours := initial_engine_hours, engine_hours_at_last_service := initial_engine_hours, hours_since_service 0, replaced_by_unit_id null, version 1"
      - "both replacement-score variants and replacement_flag set by calculations.equipment_replacement_score"

  - method: GET
    path: "/equipment-units"
    description: "Reverse lookup for EquipmentUnit.course_id and for the self-referential replaced_by_unit_id."
    roles: [Superintendent, Agronomist, EquipmentTechnician]
    code: 200
    input: ["course_id?", "unit_type?", "status?", "replaced_by_unit_id?", "replacement_flag?", "limit?", "offset?"]
    output: EquipmentUnit[]
    side_effects: []

  - method: GET
    path: "/equipment-units/{id}"
    description: "Read one unit, including both replacement-score variants."
    roles: [Superintendent, Agronomist, EquipmentTechnician]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: []

  - method: POST
    path: "/equipment-units/{id}/log-hours"
    description: "Log engine hours off the meter. Crossing the service interval takes the unit down automatically."
    roles: [EquipmentTechnician]
    code: 200
    input: [hours_added]
    output: EquipmentUnit
    side_effects:
      - "engine_hours and hours_since_service increased; both replacement-score variants and replacement_flag recomputed; version incremented by 1"
      - "when hours_since_service >= service_interval_hours and status == IN_SERVICE: status := DOWN_FOR_SERVICE in the same request"

  - method: POST
    path: "/equipment-units/{id}/service"
    description: "Complete a scheduled service, zeroing the overdue term and returning the unit to service."
    roles: [EquipmentTechnician]
    code: 200
    input: ["service_note?"]
    output: EquipmentUnit
    side_effects:
      - "engine_hours_at_last_service := engine_hours; hours_since_service := 0; both replacement-score variants and replacement_flag recomputed; status DOWN_FOR_SERVICE -> IN_SERVICE; version incremented by 1"

  - method: POST
    path: "/equipment-units/{id}/retire"
    description: "Retire a unit, optionally naming its replacement. Retiring the last machine of a type defers the windows that depend on it."
    roles: [Superintendent]
    code: 200
    input: ["replacement_unit_id?"]
    output: EquipmentUnit
    side_effects:
      - "status := RETIRED; replaced_by_unit_id := replacement_unit_id or null; version incremented by 1"
      - "every SCHEDULED MaintenanceWindow on this course whose required_unit_type matches and for which no IN_SERVICE unit of that type remains transitions SCHEDULED -> DEFERRED, which reverts any carried PlanTask SCHEDULED -> PLANNED, which recomputes AgronomicPlan.committed_nitrogen_lb"

  # --- PlayabilityReading ---------------------------------------------------
  - method: POST
    path: "/playability-readings"
    description: "Record a green-speed, firmness and moisture measurement on a turf area. Append-only."
    roles: [Agronomist, TournamentOfficial]
    code: 201
    input: [turf_area_id, measured_at, green_speed_ft, firmness_gravities, moisture_pct]
    output: PlayabilityReading
    side_effects:
      - "PlayabilityReading created with within_tournament_spec computed; no version field"
      - "TurfArea.current_moisture_pct re-derived from the latest reading; that TurfArea.version incremented by 1"

  # --- WeatherEvent ---------------------------------------------------------
  - method: POST
    path: "/weather-events"
    description: "Declare a weather event on a course. Drives the play posture, the frost release schedule, cart restrictions, window deferrals and storm-damage out-of-play flags. Requires the course version the declarer read."
    roles: [Superintendent]
    code: 201
    input: ["course_id", "event_type", "delay_minutes?", "expected_clear_at", "affected_turf_area_ids?", "expected_course_version"]
    output: WeatherEvent
    side_effects:
      - "WeatherEvent created ACTIVE with declared_at := logical clock and deferred_window_count set to the number of windows it deferred"
      - "Course.play_posture and frost_delay_minutes re-derived by calculations.course_play_posture; Course.version incremented by 1"
      - "FROST: qualifying PlayEvent rows pushed back by calculations.frost_release_schedule (SCHEDULED -> DELAYED)"
      - "LIGHTNING and STORM_DAMAGE: qualifying PlayEvent rows transition to CANCELLED"
      - "FROST, LIGHTNING and HEAVY_RAIN: qualifying MaintenanceWindow rows transition SCHEDULED -> DEFERRED, reverting carried PlanTask rows and the plan ledger"
      - "STORM_DAMAGE: named TurfArea rows become OUT_OF_PLAY and their non-STORM_CLEANUP windows are CANCELLED"

  - method: POST
    path: "/weather-events/{id}/clear"
    description: "Clear an active weather event. Restores postures and out-of-play flags, but never restores tee times that were already pushed back."
    roles: [Superintendent]
    code: 200
    input: []
    output: WeatherEvent
    side_effects:
      - "status ACTIVE -> CLEARED; cleared_at := logical clock; version incremented by 1"
      - "Course.play_posture and frost_delay_minutes re-derived over the remaining ACTIVE events; Course.version incremented by 1"
      - "STORM_DAMAGE: named TurfArea rows no longer covered by any ACTIVE storm event return to ACTIVE; that TurfArea.version incremented by 1"

  # --- Test-driving endpoint -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every expiry, restricted-entry interval, readiness window, license check and projection reads. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time."
    roles: [Superintendent]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects:
      - "the logical clock is set; no entity is mutated and no version is bumped by this call alone"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "Authentication headers are missing or invalid."
    triggered_by: "Any endpoint called without X-User-Role, with an unknown role value, or without X-User-ID where an actor identity is required."
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message: "This role may not perform this operation."
    triggered_by: "A role not listed in the endpoint's roles calls it."
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "The request payload is malformed or violates a field constraint."
    triggered_by: "Missing required field, wrong type, unknown enum member, out-of-range number, or an interval whose end is not after its start."
  - error_id: ERR_COURSE_NOT_FOUND
    http_status: 404
    message: "No course with that id exists."
    triggered_by: "A course path id or course_id that resolves to nothing."
  - error_id: ERR_TURF_AREA_NOT_FOUND
    http_status: 404
    message: "No turf area with that id exists."
    triggered_by: "A turf area path id, turf_area_id, or affected_turf_area_ids member that resolves to nothing."
  - error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    message: "No agronomic plan with that id exists."
    triggered_by: "A plan path id or plan_id that resolves to nothing."
  - error_id: ERR_PLAN_TASK_NOT_FOUND
    http_status: 404
    message: "No plan task with that id exists."
    triggered_by: "A plan task path id or plan_task_id that resolves to nothing."
  - error_id: ERR_APPLICATOR_NOT_FOUND
    http_status: 404
    message: "No applicator with that id exists."
    triggered_by: "An applicator path id, applicator_id, or X-User-ID acting as Applicator that resolves to nothing."
  - error_id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    message: "No pesticide product with that id exists."
    triggered_by: "A product path id or product_id that resolves to nothing."
  - error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    message: "No application record with that id exists."
    triggered_by: "An application path id that resolves to nothing."
  - error_id: ERR_PUMP_STATION_NOT_FOUND
    http_status: 404
    message: "No pump station with that id exists."
    triggered_by: "A pump station path id or pump_station_id that resolves to nothing."
  - error_id: ERR_IRRIGATION_RUN_NOT_FOUND
    http_status: 404
    message: "No irrigation run with that id exists."
    triggered_by: "An irrigation run path id that resolves to nothing."
  - error_id: ERR_WINDOW_NOT_FOUND
    http_status: 404
    message: "No maintenance window with that id exists."
    triggered_by: "A window path id or maintenance_window_id that resolves to nothing."
  - error_id: ERR_PLAY_EVENT_NOT_FOUND
    http_status: 404
    message: "No play event with that id exists."
    triggered_by: "A play event path id that resolves to nothing."
  - error_id: ERR_EQUIPMENT_NOT_FOUND
    http_status: 404
    message: "No equipment unit with that id exists."
    triggered_by: "An equipment path id or replacement_unit_id that resolves to nothing."
  - error_id: ERR_WEATHER_EVENT_NOT_FOUND
    http_status: 404
    message: "No weather event with that id exists."
    triggered_by: "A weather event path id that resolves to nothing."
  - error_id: ERR_PLAN_STATE_INVALID
    http_status: 409
    message: "The agronomic plan is not in a state that permits this operation."
    triggered_by: "submit on a non-DRAFT plan, return or approve on a non-SUBMITTED plan, POST /plan-tasks on a non-DRAFT plan, or scheduling a task whose plan is not ACTIVE."
  - error_id: ERR_TASK_STATE_INVALID
    http_status: 409
    message: "The plan task is not in a state that permits this operation."
    triggered_by: "schedule on a task that is not PLANNED, or citing a plan_task_id whose task is not SCHEDULED from POST /applications."
  - error_id: ERR_WINDOW_STATE_INVALID
    http_status: 409
    message: "The maintenance window is not in a state that permits this operation."
    triggered_by: "start on a non-SCHEDULED window, complete on a non-IN_PROGRESS window, reschedule on a COMPLETED or CANCELLED window, or scheduling a task onto a window that is not SCHEDULED or already carries a task."
  - error_id: ERR_RUN_STATE_INVALID
    http_status: 409
    message: "The irrigation run is not in a state that permits this operation."
    triggered_by: "complete on a non-SCHEDULED run or reverse on a non-COMPLETED run."
  - error_id: ERR_APPLICATION_STATE_INVALID
    http_status: 409
    message: "The application record is not in a state that permits this operation."
    triggered_by: "verify on a non-RECORDED record, void on an already VOIDED record, or release-posting when posting_status is not POSTED."
  - error_id: ERR_EQUIPMENT_STATE_INVALID
    http_status: 409
    message: "The equipment unit is not in a state that permits this operation."
    triggered_by: "log-hours or retire on a RETIRED unit, service on a unit that is not DOWN_FOR_SERVICE, or naming a replacement unit that is not IN_SERVICE."
  - error_id: ERR_WEATHER_STATE_INVALID
    http_status: 409
    message: "The weather event is not active."
    triggered_by: "clear on an already CLEARED event."
  - error_id: ERR_PLAY_EVENT_STATE_INVALID
    http_status: 409
    message: "The play event is not in a state that permits certification."
    triggered_by: "certify-conditions on a CANCELLED event."
  - error_id: ERR_STALE_COURSE_VERSION
    http_status: 412
    message: "The course has changed since it was read."
    triggered_by: "expected_course_version on POST /weather-events does not equal Course.version."
  - error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
    message: "The agronomic plan has changed since it was read."
    triggered_by: "expected_plan_version on approve or on plan-task schedule does not equal AgronomicPlan.version."
  - error_id: ERR_STALE_PUMP_VERSION
    http_status: 412
    message: "The pump station has changed since it was read."
    triggered_by: "expected_pump_station_version on POST /irrigation-runs does not equal PumpStation.version."
  - error_id: ERR_LICENSE_EXPIRED
    http_status: 422
    message: "The applicator's license does not cover this application."
    triggered_by: "applied_at falls after license_expires_on, or the applicator is SUSPENDED, on POST /applications or on verify."
  - error_id: ERR_WIND_LIMIT_EXCEEDED
    http_status: 422
    message: "Wind speed exceeds the product's label limit."
    triggered_by: "wind_speed_mph greater than the product's max_wind_speed_mph."
  - error_id: ERR_BUFFER_ZONE_VIOLATION
    http_status: 422
    message: "The treated area is inside the product's surface-water buffer."
    triggered_by: "the smaller of the application's and the area's distance_to_water_ft is below the product's min_buffer_ft."
  - error_id: ERR_NITROGEN_LOAD_LIMIT
    http_status: 422
    message: "The area's regulatory nitrogen load would be exceeded."
    triggered_by: "the planned_commitment variant of turf_nitrogen_load would exceed MAX_N_LB_PER_1000_BY_AREA_TYPE for the area's type."
  - error_id: ERR_REI_ACTIVE
    http_status: 409
    message: "A restricted-entry interval is still running on this area."
    triggered_by: "booking, rescheduling or starting a non-STORM_CLEANUP window before TurfArea.rei_expires_at, or releasing a posting before the application's own rei_expires_at."
  - error_id: ERR_COURSE_CLOSED
    http_status: 409
    message: "The course is closed to this activity."
    triggered_by: "recording an application, scheduling irrigation, starting a non-STORM_CLEANUP window, or certifying conditions while play_posture is CLOSED."
  - error_id: ERR_TURF_AREA_OUT_OF_PLAY
    http_status: 409
    message: "The turf area is out of play."
    triggered_by: "an application, irrigation run, playability reading, plan task or run completion on an OUT_OF_PLAY area."
  - error_id: ERR_LICENSE_CATEGORY_MISMATCH
    http_status: 422
    message: "The applicator's license category does not authorise this product."
    triggered_by: "the applicator's license_category does not cover the product's requires_license_category, on POST /applications or on verify."
  - error_id: ERR_TASK_TURF_AREA_MISMATCH
    http_status: 422
    message: "The referenced records do not agree on turf area or course."
    triggered_by: "an application whose plan task is on another area, a schedule whose window is on another area, or any child whose turf area belongs to a different course."
  - error_id: ERR_REPLACEMENT_UNIT_TYPE_MISMATCH
    http_status: 422
    message: "The named replacement unit is not an equivalent machine."
    triggered_by: "replacement_unit_id names a unit of a different unit_type or on a different course."
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "The same person may not perform both steps."
    triggered_by: "an applicator verifying their own application, or the submitter of a plan approving it."
  - error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    message: "Another crew window already occupies this area at that time."
    triggered_by: "a window whose closed interval intersects another live window on the same turf area, including a merely touching endpoint."
  - error_id: ERR_WINDOW_CONFLICTS_PLAY
    http_status: 409
    message: "The crew window collides with play on that hole."
    triggered_by: "a window whose interval plus clearance buffer intersects a play event's occupancy of the same hole."
  - error_id: ERR_APPLICATION_OUTSIDE_PLAN_WINDOW
    http_status: 422
    message: "The record falls outside the plan task's planned window."
    triggered_by: "an application whose applied_at is outside its plan task's planned window or plan year, or a schedule whose maintenance window is not contained in the planned window."
  - error_id: ERR_DUPLICATE_LICENSE_NUMBER
    http_status: 409
    message: "That applicator license number is already registered."
    triggered_by: "POST /applicators with an existing license_number."
  - error_id: ERR_PUMP_OFFLINE
    http_status: 409
    message: "The pump station is offline."
    triggered_by: "scheduling or completing an irrigation run on an OFFLINE station."
  - error_id: ERR_PUMP_ZONE_CAPACITY
    http_status: 409
    message: "The station has no free zone in that window."
    triggered_by: "a new run whose half-open interval intersects max_concurrent_zones scheduled runs already."
  - error_id: ERR_PUMP_FLOW_CAPACITY
    http_status: 409
    message: "The station's flow capacity would be exceeded."
    triggered_by: "the summed flow_gpm of intersecting scheduled runs plus the new run exceeding max_flow_gpm."
  - error_id: ERR_DEFERRAL_LIMIT_REACHED
    http_status: 409
    message: "This window has been deferred as many times as the policy allows."
    triggered_by: "rescheduling a window whose deferral_count already equals MAX_WINDOW_DEFERRALS."
  - error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    message: "This plan has been returned as many times as the policy allows."
    triggered_by: "returning a plan whose return_count already equals MAX_PLAN_RETURNS."
  - error_id: ERR_INSUFFICIENT_READINGS
    http_status: 422
    message: "Not enough greens have been measured to certify conditions."
    triggered_by: "fewer than MIN_GREENS_MEASURED ACTIVE greens carry a reading inside the readiness window."
  - error_id: ERR_ZERO_ALLOTMENT
    http_status: 422
    message: "The computed irrigation allotment is zero."
    triggered_by: "a run whose allotment collapses to zero because the water posture is SUSPENDED, the deficit is zero, or the station has no daily headroom left."
  - error_id: ERR_WATER_ALLOCATION_EXCEEDED
    http_status: 422
    message: "The annual water allocation would be exceeded."
    triggered_by: "a run on a non-RECLAIMED station whose allotment would push water_used_gal past annual_water_allocation_gal."
  - error_id: ERR_NITROGEN_BUDGET_EXCEEDED
    http_status: 422
    message: "The plan's nitrogen budget would be exceeded."
    triggered_by: "a schedule whose recomputed committed_nitrogen_lb would exceed nitrogen_budget_lb."

# ---------------------------------------------------------------------------
# 1.7 RBAC / Role Table
# ---------------------------------------------------------------------------
roles:
  - name: Superintendent
    identity: opaque
    description: >
      Owns the course record, the water allocation, the fleet's capital decisions,
      the weather log and the integrity of the application record. The only role
      that can void an application, reverse an irrigation run, approve a plan or
      retire a machine.
    exclusive_operations:
      - "POST /courses"
      - "PATCH /courses/{id}/water-allocation"
      - "GET /courses/{id}/water-assessment"
      - "POST /agronomic-plans/{id}/return"
      - "POST /agronomic-plans/{id}/approve"
      - "POST /applicators"
      - "POST /pesticide-products"
      - "POST /applications/{id}/void"
      - "POST /pump-stations"
      - "POST /irrigation-runs/{id}/reverse"
      - "POST /equipment-units/{id}/retire"
      - "POST /weather-events"
      - "POST /weather-events/{id}/clear"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /turf-areas (with Agronomist)"
      - "POST /play-events (with TournamentOfficial)"
      - "POST /equipment-units (with EquipmentTechnician)"
      - "PATCH /pump-stations/{id}/status (with EquipmentTechnician)"
      - "every GET listed for Superintendent in §1.5"

  - name: Agronomist
    identity: opaque
    description: >
      Writes the agronomic plan, schedules its tasks onto crew windows, books and
      runs the maintenance windows, schedules and completes irrigation, and takes
      playability measurements. Cannot approve their own plan and cannot void an
      application record.
    exclusive_operations:
      - "POST /agronomic-plans"
      - "POST /agronomic-plans/{id}/submit"
      - "POST /plan-tasks"
      - "POST /plan-tasks/{id}/schedule"
      - "POST /irrigation-runs"
      - "POST /irrigation-runs/{id}/complete"
      - "POST /maintenance-windows"
      - "POST /maintenance-windows/{id}/start"
      - "POST /maintenance-windows/{id}/complete"
      - "POST /maintenance-windows/{id}/reschedule"
    shared_operations:
      - "POST /turf-areas (with Superintendent)"
      - "POST /playability-readings (with TournamentOfficial)"
      - "every GET listed for Agronomist in §1.5"

  - name: Applicator
    identity: "entity_backed:Applicator"
    description: >
      A licensed spray technician. X-User-ID is the Applicator.id returned by
      POST /applicators, which is what makes segregation of duties checkable: the
      applicator named on a record may never be the one who verifies it. Owns the
      application record and the field posting.
    exclusive_operations:
      - "POST /applications"
      - "POST /applications/{id}/verify"
      - "POST /applications/{id}/release-posting"
    shared_operations:
      - "every GET listed for Applicator in §1.5"

  - name: TournamentOfficial
    identity: opaque
    description: >
      Posts rounds, including simultaneous-start shotgun events, and certifies
      playing conditions from the measured greens. Cannot book crew windows or
      touch the agronomic plan.
    exclusive_operations:
      - "POST /play-events/{id}/certify-conditions"
    shared_operations:
      - "POST /play-events (with Superintendent)"
      - "POST /playability-readings (with Agronomist)"
      - "every GET listed for TournamentOfficial in §1.5"

  - name: EquipmentTechnician
    identity: opaque
    description: >
      Runs the shop: logs meter hours, completes services and takes pump stations
      offline for repair. Cannot retire a unit (a capital decision reserved to the
      Superintendent) and cannot touch the agronomic plan.
    exclusive_operations:
      - "POST /equipment-units/{id}/log-hours"
      - "POST /equipment-units/{id}/service"
    shared_operations:
      - "POST /equipment-units (with Superintendent)"
      - "PATCH /pump-stations/{id}/status (with Superintendent)"
      - "every GET listed for EquipmentTechnician in §1.5"

