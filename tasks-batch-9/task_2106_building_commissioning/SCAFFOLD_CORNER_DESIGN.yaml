              payload: { project_id: "${p}", metric_key: "SUPPLY_AIRFLOW_CFM", target_value: 10000, tolerance_pct: 5, criticality: "CRITICAL" }
              as: OwnerRepresentative
              as_user_id: "u-owner-1"
