        grounds: ["concurrency_rules[roster-publish-stale-season]", "errors[ERR_STALE_SEASON_VERSION]"]
        distinguishing_aspect: "Publishing with an expected_season_version captured before another successful publish returns 412 ERR_STALE_SEASON_VERSION; the season version advanced between read and write."
        test_recipe:
          setup:
            - "Agreement ACTIVE; season PRELAUNCH; athlete GRANTED; two VALIDATED batches B1, B2; reviewer holds stale version sv captured before B1 was published"
          setup_api_calls:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "LEAGUE", licensor_name: "L", exclusivity_scope: "NONE", sport_category: "AMFOOT_PRO", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1000, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 90 }
