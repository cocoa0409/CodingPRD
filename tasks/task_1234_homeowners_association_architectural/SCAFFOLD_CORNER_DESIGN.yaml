  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without valid role/user headers is rejected 401 ERR_UNAUTHENTICATED before any other check, even for a well-formed body."
        test_recipe:
          setup: ["Nothing needed beyond an existing association"]
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Auth HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
          trigger:
            - { call: "GET /arc/associations/${assoc}", as: Manager, captures: { err: $.data.error_id } }
          assert:
            - "with auth headers stripped by the test harness: error_id == ERR_UNAUTHENTICATED (HTTP 401)"

      - name: homeowner_cannot_decide_returns_unauthorized
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED]", "roles[Manager].exclusive_operations"]
        distinguishing_aspect: "decide is Manager-exclusive; a Homeowner caller is rejected 403 ERR_UNAUTHORIZED even on an application they own in UNDER_REVIEW."
        test_recipe:
          setup: ["Application owned by caller is UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Role HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
