              as: CorporateOps
              captures: { plant_id: "$.data.id" }
            - call: "POST /binder-formulations"
              payload: { code: "BF-FREE-1", formaldehyde_free: true, formaldehyde_ppm: 0, voc_g_per_kg: 3.2, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { binder_free: "$.data.id" }
            - call: "POST /binder-formulations/${binder_free}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_free}/emissions-test"
              payload: { formaldehyde_ppm: 0, voc_g_per_kg: 3.2, lab_reference: "LAB-9001" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /binder-formulations/${binder_free}/certification-decision"
              payload: { decision: "CERTIFY", emissions_cert_id: "EC-4411" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /product-lines"
              payload: { sku: "R13-15-UF", plant_id: "${plant_id}", binder_formulation_id: "${binder_free}", certification_program_id: "${prog_ps}", form: "BATT", density_pcf: 0.80, facing_type: "UNFACED", width_in: 15, thickness_in: 3.5, declared_r_value: 13.0, bag_sqft: 88.0, bale_volume_ft3: 21.0, bale_mass_kg: 12.5, mass_rate_kg_per_min: 34.5, compression_ratio: 6.0 }
              as: CorporateOps
              captures: { pl_a: "$.data.id" }
            - call: "POST /production-runs"
              payload: { plant_id: "${plant_id}", product_line_id: "${pl_a}", line_index: 1, scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T14:00:00Z", target_pull_kg: 9200, zone_setpoints_f: [470, 470, 470, 470] }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { run_1: "$.data.id" }
          trigger:
            - call: "POST /production-runs"
              payload: { plant_id: "${plant_id}", product_line_id: "${pl_a}", line_index: 1, scheduled_start: "2026-08-03T13:59:59Z", scheduled_end: "2026-08-03T21:00:00Z", target_pull_kg: 9200, zone_setpoints_f: [470, 470, 470, 470] }
              as: PlantOperator
              as_user_id: "${plant_id}"
          assert:
            - "trigger -> 409 with error_id == ERR_LINE_OCCUPANCY_CONFLICT: [13:59:59, 21:00:00) overlaps [06:00:00, 14:00:00) by exactly one second"
            - "GET /production-runs?plant_id=${plant_id}&line_index=1 still returns total_count == 1"
            - "contrast A — the same body with scheduled_start \"2026-08-03T14:00:00Z\" and scheduled_end \"2026-08-03T22:00:00Z\" -> 201 with run_status == SCHEDULED, because the intervals are HALF-OPEN and 14:00:00 is not inside [06:00:00, 14:00:00)"
            - "contrast B — the trigger body with line_index 2 -> 201, because occupancy is scoped to (plant_id, line_index) and line 2 is free"
            - "contrast C — the trigger body with scheduled_start \"2026-08-03T05:00:00Z\" and scheduled_end \"2026-08-03T06:00:00Z\" -> 201: touching the existing interval from below is also legal"
            - "contrast D — after POST /production-runs/{id}/abort on the run created by contrast A, a further POST /production-runs on line 1 with [\"2026-08-03T16:00:00Z\", \"2026-08-03T20:00:00Z\") -> 201, because ABORTED is outside the blocking set {SCHEDULED, HELD, MELTING, CURING} even though the intervals overlap"
            - "every accepted run has qc_status == UNSAMPLED, hold_reason == null and version == 1"

      - name: lab_capacity_is_aggregate_over_closed_windows_within_one_program
        grounds:
          - validations.priority_64_ERR_LAB_CAPACITY_EXCEEDED
          - state_machines.ThermalTest.REQUESTED_to_IN_LAB
          - entities.CertificationProgram.max_concurrent_lab_tests
          - errors.ERR_LAB_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          An AGGREGATE capacity count, not a pairwise conflict: two IN_LAB tests are
          individually legal and only the third is refused, and the count is taken
          over CLOSED windows so a window that merely TOUCHES another at an endpoint
          still consumes a slot. The window [11:00, 12:00] is the discriminator: it
          truly overlaps TEST-1 and only touches TEST-2 at 12:00, so a half-open
          implementation counts 1 and admits it while the closed rule counts 2 and
          refuses. Completing TEST-1 frees the slot and the identical call then
