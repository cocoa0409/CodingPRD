scenario: |
  2908. Wholesale Auction Arbitration & Condition Disputes (vehicle auction arbitration department):
  announcement standards for frame damage, title status, mileage discrepancy and mechanical conditions
  at the block, arbitration window by defect type with mileage and time limits, buyer claim intake with
  inspection reports, diagnostic evidence and third-party verification, seller response, repair allowance
  negotiation and unwind decision with transportation cost allocation, title-related arbitration with
  unlimited windows for branded or missing titles, arbitration outcome tracking by seller with policy
  consequences and blocked-seller status, fee assessment for frivolous claims, post-sale inspection
  programs and their effect on arbitration rights

domain_name: "wholesale-auction-arbitration"
api_prefix: "/arbitration"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by explicit foreign keys. Only action/sub-resource
  # segments are nested in URL paths (`/cases/{id}/evidence`); no entity is
  # created through a nested identity path — every child carries its parent
  # FK in the body or in a single-level action path.

  state_machine_shape: cyclic
  # ArbitrationCase cycles NEGOTIATION -> COUNTERED -> NEGOTIATION across
  # repair-allowance rounds, then branches from ARBITRATOR_REVIEW into three
  # terminal outcomes with divergent side-effect sets. AuctionSale carries two
  # independent state dimensions (settlement_status x arbitration_status).

  relationship_patterns:
    - one_to_many          # AuctionSale -> ArbitrationCase, ArbitrationCase -> ClaimEvidence
    - self_referential     # ArbitrationCase.superseded_case_id -> ArbitrationCase.id (refile chain)
    - cross_aggregate      # SettlementLedgerEntry references both AuctionSale and ArbitrationCase

  role_model: segregation_of_duties
  # The Arbitrator who opens intake review on a case (intake_arbitrator_user_id)
  # is barred from rendering that case's decision. SellerRep/BuyerRep are
  # entity-backed peers that own disjoint resource sets.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 42 endpoints / 43 error codes / 6 calculation rules with 8
  # variants / 6 state machines (1 cyclic + branching, 1 parallel-dimension,
  # 2 threshold-driven with a sticky terminal tier).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }
  pagination_placement: |
    Every list endpoint whose `output:` is an array returns `response_type: "array"`, the rows
    in `data`, and the four pagination fields inside `meta` alongside api_request_id and
    api_request_timestamp: meta.limit, meta.offset, meta.total_count, meta.has_more.
    total_count counts the rows matching the filters BEFORE limit/offset are applied;
    has_more is (offset + len(data)) < total_count. Sub-resource list routes that declare no
    limit/offset in their `input:` are unpaginated: they return every matching row and still
    carry meta.total_count == len(data) with meta.has_more == false, meta.limit == null and
    meta.offset == 0.

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Seller
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Consignor (selling dealer) legal name.
        constraints: "1..120 chars, non-blank"
      - name: dealer_license_no
        type: string
        source: input
        description: State dealer license number; globally unique across Seller rows.
        constraints: "unique; 4..24 chars; ERR_DUPLICATE_DEALER_LICENSE on collision"
      - name: policy_tier
        type: enum
        source: computed
        description: >-
          Arbitration-outcome standing recomputed by calculations.seller_arbitration_rate
          after every upheld decision. BLOCKED is sticky: only
          POST /arbitration/sellers/{id}/reinstate leaves it.
        default: GOOD_STANDING
        constraints: "one of {GOOD_STANDING, WATCH, PROBATION, BLOCKED}"
      - name: rolling_arbitration_rate_bps
        type: integer
        source: computed
        description: >-
          ROLLING_90_DAY variant of calculations.seller_arbitration_rate, in basis points.
          This is the variant the policy_tier thresholds read.
        default: 0
        constraints: ">= 0"
      - name: lifetime_arbitration_rate_bps
        type: integer
        source: computed
        description: LIFETIME variant of calculations.seller_arbitration_rate, in basis points.
        default: 0
        constraints: ">= 0"
      - name: rolling_window_sales_count
        type: integer
        source: computed
        description: >-
          Count of this seller's AuctionSale rows with
          hammer_time_utc > now - 90d AND hammer_time_utc <= now.
        default: 0
      - name: rolling_window_upheld_count
        type: integer
        source: computed
        description: >-
          Count of ArbitrationDecision rows with outcome IN {UNWIND, REPAIR_ALLOWANCE}
          on this seller's sales with decided_at_utc > now - 90d AND decided_at_utc <= now.
        default: 0
      - name: lifetime_sales_count
        type: integer
        source: computed
        description: Count of all AuctionSale rows with seller_id == this Seller.id.
        default: 0
      - name: lifetime_upheld_count
        type: integer
        source: computed
        description: >-
          Count of all ArbitrationDecision rows with outcome IN {UNWIND, REPAIR_ALLOWANCE}
          on this seller's sales, with no time window.
        default: 0
      - name: open_claim_count
        type: integer
        source: computed
        description: >-
          Count of ArbitrationCase rows on this seller's sales whose status NOT IN
          {RESOLVED_ALLOWANCE, UNWOUND, DENIED, WITHDRAWN, EXPIRED}. Conserved by
          calculations.open_claim_counter_invariant.
        default: 0
      - name: blocked_at_utc
        type: datetime
        source: computed
        description: Logical-clock instant policy_tier became BLOCKED; null when policy_tier != BLOCKED.
        default: null
        constraints: "ISO 8601 UTC, three fractional digits, or null"
      - name: reinstated_count
        type: integer
        source: computed
        description: Number of times POST /arbitration/sellers/{id}/reinstate has cleared BLOCKED.
        default: 0

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Buying dealer legal name.
        constraints: "1..120 chars, non-blank"
      - name: dealer_license_no
        type: string
        source: input
        description: State dealer license number; globally unique across Buyer rows.
        constraints: "unique; 4..24 chars; ERR_DUPLICATE_DEALER_LICENSE on collision"
      - name: claim_privilege_status
        type: enum
        source: computed
        description: >-
          Claim-filing privilege. FEE_HOLD when frivolous_fee_balance_cents > 0 and
          frivolous_claim_count < 3; SUSPENDED once frivolous_claim_count >= 3.
        default: ACTIVE
        constraints: "one of {ACTIVE, FEE_HOLD, SUSPENDED}"
      - name: frivolous_claim_count
        type: integer
        source: computed
        description: Count of FrivolousFeeAssessment rows with buyer_id == this Buyer.id.
        default: 0
      - name: frivolous_fee_balance_cents
        type: integer
        source: computed
        description: >-
          Unpaid frivolous-claim fees in cents. Increased by FrivolousFeeAssessment.fee_cents,
          decreased by POST /arbitration/buyers/{id}/fee-payments and by unwind fee offsets.
        default: 0
        constraints: ">= 0"
      - name: open_claim_count
        type: integer
        source: computed
        description: >-
          Count of ArbitrationCase rows with claimant_buyer_id == this Buyer.id whose status
          NOT IN {RESOLVED_ALLOWANCE, UNWOUND, DENIED, WITHDRAWN, EXPIRED}. Conserved by
          calculations.open_claim_counter_invariant.
        default: 0
      - name: lifetime_claim_count
        type: integer
        source: computed
        description: Count of all ArbitrationCase rows with claimant_buyer_id == this Buyer.id.
        default: 0

  - name: ArbitrationPolicy
    parent: null
    common_fields: true
    fields:
      - name: defect_class
        type: enum
        source: input
        description: Defect family this policy governs; globally unique across ArbitrationPolicy rows.
        constraints: >-
          one of {FRAME_DAMAGE, MECHANICAL, MILEAGE_DISCREPANCY, TITLE_BRANDED, TITLE_MISSING};
          unique; ERR_DUPLICATE_POLICY_DEFECT_CLASS on collision
      - name: window_hours
        type: integer
        source: input
        description: >-
          Arbitration window length in hours measured from AuctionSale.hammer_time_utc.
          null means the window is UNLIMITED and the elapsed-hours check is skipped entirely
          (title-related arbitration).
        default: null
        constraints: "null or >= 1"
      - name: mileage_limit
        type: integer
        source: input
        description: >-
          Maximum miles the buyer may drive after the sale and still arbitrate.
          null means UNLIMITED and the mileage check is skipped entirely.
        default: null
        constraints: "null or >= 0"
      - name: min_claim_amount_cents
        type: integer
        source: input
        description: Minimum ArbitrationCase.claim_amount_cents that is arbitrable under this policy.
        constraints: ">= 0"
      - name: requires_third_party_verification
        type: boolean
        source: input
        description: >-
          When true, POST /arbitration/cases/{id}/open-review requires at least one ClaimEvidence
          on the case with evidence_type == THIRD_PARTY_VERIFICATION and verified == true.
      - name: max_allowance_bps
        type: integer
        source: input
        description: >-
          Repair-allowance ceiling as basis points of AuctionSale.sale_price_cents.
          0 means a repair allowance is forbidden and only an unwind may resolve the claim.
        constraints: "0..10000"
      - name: psi_extension_hours
        type: integer
        source: input
        description: >-
          Hours added to window_hours when the sale's governing PostSaleInspection is COMPLETED
          and its findings array contains the claimed defect_class.
        constraints: ">= 0"
      - name: psi_clean_waives_rights
        type: boolean
        source: input
        description: >-
          When true, a COMPLETED governing PostSaleInspection whose findings array does NOT contain
          the claimed defect_class waives arbitration rights for that defect_class
          (ERR_PSI_WAIVED_RIGHTS).
      - name: seller_response_hours
        type: integer
        source: input
        description: >-
          Hours the seller has to answer after ArbitrationCase.review_opened_at_utc before
          POST /_ops/run-arbitration-sweep times the seller out.
        default: 24
        constraints: ">= 1"

  - name: AuctionSale
    parent: null
    common_fields: true
    fields:
      - name: vin
        type: string
        source: input
        description: Vehicle identification number of the unit sold at the block.
        constraints: "exactly 17 chars, uppercase alphanumeric"
      - name: seller_id
        type: string
        source: input
        description: FK -> Seller.id; the consignor who ran the unit through the block.
      - name: buyer_id
        type: string
        source: input
        description: FK -> Buyer.id; the buying dealer who bought at the hammer.
      - name: sale_price_cents
        type: integer
        source: input
        description: Hammer price in cents; the basis for allowance caps and unwind refunds.
        constraints: ">= 1"
      - name: hammer_time_utc
        type: datetime
        source: input
        description: >-
          Instant the block hammer fell; t0 for every arbitration window.
          Must be <= the current logical clock.
        constraints: "ISO 8601 UTC, three fractional digits"
      - name: announced_odometer_miles
        type: integer
        source: input
        description: Odometer reading announced at the block; baseline for mileage checks.
        constraints: ">= 0"
      - name: light_channel
        type: enum
        source: input
        description: >-
          Block light under which the unit sold; selects the severity multiplier in
          calculations.repair_allowance_amount.
        constraints: "one of {GREEN, YELLOW, RED}"
      - name: title_status
        type: enum
        source: input
        description: Title condition declared at the block.
        constraints: "one of {CLEAN, BRANDED_SALVAGE, MISSING}"
      - name: settlement_status
        type: enum
        source: computed
        description: >-
          Money dimension of this sale, independent of arbitration_status.
          UNSETTLED -> SETTLED on POST /arbitration/sales/{id}/settle;
          UNSETTLED|SETTLED -> REVERSED on an UNWIND decision.
        default: UNSETTLED
        constraints: "one of {UNSETTLED, SETTLED, REVERSED}"
      - name: settled_at_utc
        type: datetime
        source: computed
        description: >-
          Logical clock value at which POST /arbitration/sales/{id}/settle moved
          settlement_status to SETTLED; null while UNSETTLED, and retained unchanged when a
          later UNWIND decision moves the status to REVERSED.
        default: null
        constraints: "ISO 8601 UTC, three fractional digits, or null"
      - name: arbitration_status
        type: enum
        source: computed
        description: >-
          Dispute dimension of this sale, independent of settlement_status.
          NONE -> ACTIVE when a case is filed; ACTIVE -> RESOLVED when a decision is rendered;
          ACTIVE -> NONE when open_case_count returns to 0 with no ArbitrationDecision on the sale.
        default: NONE
        constraints: "one of {NONE, ACTIVE, RESOLVED}"
      - name: open_case_count
        type: integer
        source: computed
        description: >-
          Count of ArbitrationCase rows on this sale whose status NOT IN
          {RESOLVED_ALLOWANCE, UNWOUND, DENIED, WITHDRAWN, EXPIRED}.
        default: 0
      - name: settlement_hold
        type: boolean
        source: computed
        description: >-
          Set true when this sale's Seller reaches policy_tier BLOCKED while the sale has
          settlement_status == UNSETTLED and arbitration_status == NONE. Blocks settle with
          ERR_SELLER_BLOCKED. Cleared by POST /arbitration/sellers/{id}/reinstate.
        default: false

  - name: SaleAnnouncement
    parent: null
    common_fields: false
    fields:
      - name: sale_id
        type: string
        source: system
        description: FK -> AuctionSale.id; the sale this block announcement was made on (taken from the path).
      - name: defect_class
        type: enum
        source: input
        description: >-
          Defect family disclosed at the block. An announcement bars a later claim of the same
          defect_class (ERR_DEFECT_ANNOUNCED) for every class except TITLE_MISSING.
        constraints: "one of {FRAME_DAMAGE, MECHANICAL, MILEAGE_DISCREPANCY, TITLE_BRANDED, TITLE_MISSING}"
      - name: disclosure_text
        type: string
        source: input
        description: Verbatim announcement read at the block.
        constraints: "1..500 chars, non-blank"
      - name: announced_at_utc
        type: datetime
        source: system
        description: Logical-clock instant the announcement row was recorded.
        constraints: "ISO 8601 UTC, three fractional digits"

  - name: PostSaleInspection
    parent: null
    common_fields: true
    fields:
      - name: sale_id
        type: string
        source: input
        description: FK -> AuctionSale.id; the sale whose unit is being inspected post-sale.
      - name: program_tier
        type: enum
        source: input
        description: PSI program purchased by the buyer; selects fee_cents.
        constraints: "one of {STANDARD, PREMIUM}"
      - name: requested_at_utc
        type: datetime
        source: system
        description: Logical-clock instant the PSI was requested; start of the half-open PSI interval.
        constraints: "ISO 8601 UTC, three fractional digits"
      - name: window_end_utc
        type: datetime
        source: computed
        description: >-
          requested_at_utc + PSI_REQUEST_TTL_HOURS. End of the HALF-OPEN interval
          [requested_at_utc, window_end_utc) this PSI occupies on the sale.
        constraints: "ISO 8601 UTC, three fractional digits"
      - name: completed_at_utc
        type: datetime
        source: computed
        description: Logical-clock instant the inspector completed the PSI; null until COMPLETED.
        default: null
      - name: findings
        type: array
        source: input
        description: >-
          Defect classes the inspector confirmed. Set by
          POST /arbitration/post-sale-inspections/{id}/complete; may be the empty array.
        default: []
        constraints: >-
          array of {FRAME_DAMAGE, MECHANICAL, MILEAGE_DISCREPANCY, TITLE_BRANDED, TITLE_MISSING},
          no duplicates
      - name: status
        type: enum
        source: computed
        description: PSI lifecycle state.
        default: REQUESTED
        constraints: "one of {REQUESTED, COMPLETED, EXPIRED}"
      - name: fee_cents
        type: integer
        source: computed
        description: >-
          PSI program fee: PSI_FEE_STANDARD_CENTS for STANDARD, PSI_FEE_PREMIUM_CENTS for PREMIUM.
        constraints: ">= 0"

  - name: ArbitrationCase
    parent: null
    common_fields: true
    fields:
      - name: sale_id
        type: string
        source: input
        description: FK -> AuctionSale.id; the disputed sale.
      - name: claimant_buyer_id
        type: string
        source: computed
        description: >-
          FK -> Buyer.id; copied from AuctionSale.buyer_id at intake, never taken from the request body.
      - name: policy_id
        type: string
        source: computed
        description: >-
          FK -> ArbitrationPolicy.id; resolved at intake as the single ArbitrationPolicy whose
          defect_class equals the request's defect_class; empty candidate set -> ERR_POLICY_NOT_FOUND.
      - name: policy_version_at_intake
        type: integer
        source: computed
        description: >-
          ArbitrationPolicy.version pinned at intake, so later policy edits cannot retroactively
          change this case's window or cap.
        constraints: ">= 1"
      - name: superseded_case_id
        type: string
        source: input
        description: >-
          FK -> ArbitrationCase.id; optional pointer to the prior case this refile replaces.
          When supplied the prior case must have the same sale_id and defect_class and
          status IN {WITHDRAWN, EXPIRED}.
        default: null
      - name: defect_class
        type: enum
        source: input
        description: Defect family claimed by the buyer.
        constraints: "one of {FRAME_DAMAGE, MECHANICAL, MILEAGE_DISCREPANCY, TITLE_BRANDED, TITLE_MISSING}"
      - name: claim_amount_cents
        type: integer
        source: input
        description: Buyer's asserted repair/diminution figure at intake.
        constraints: ">= 0"
      - name: odometer_at_claim
        type: integer
        source: input
        description: Odometer reading at the moment the claim is filed.
        constraints: ">= 0"
      - name: complaint_text
        type: string
        source: input
        description: Buyer's narrative of the defect.
        constraints: "1..1000 chars, non-blank"
      - name: claimed_at_utc
        type: datetime
        source: system
        description: Logical-clock instant the claim was filed.
        constraints: "ISO 8601 UTC, three fractional digits"
      - name: hours_elapsed_at_claim
        type: number
        source: computed
        description: >-
          (claimed_at_utc - AuctionSale.hammer_time_utc) expressed in hours, rounded
          half-up to 3 decimal places.
        constraints: ">= 0"
      - name: miles_driven_at_claim
        type: integer
        source: computed
        description: odometer_at_claim - AuctionSale.announced_odometer_miles.
        constraints: ">= 0"
      - name: psi_extension_applied_hours
        type: integer
        source: computed
        description: >-
          ArbitrationPolicy.psi_extension_hours when the governing PostSaleInspection is COMPLETED
          and its findings contain defect_class; otherwise 0.
        default: 0
      - name: effective_window_hours
        type: integer
        source: computed
        description: >-
          window_hours + psi_extension_applied_hours, or null when ArbitrationPolicy.window_hours
          is null (UNLIMITED window).
        default: null
      - name: window_eligible
        type: boolean
        source: computed
        description: >-
          True when calculations.arbitration_window_evaluation admits the claim on both the
          elapsed-hours and the mileage axis.
      - name: status
        type: enum
        source: computed
        description: Arbitration case lifecycle state.
        default: SUBMITTED
        constraints: >-
          one of {SUBMITTED, UNDER_REVIEW, NEGOTIATION, COUNTERED, ARBITRATOR_REVIEW,
          RESOLVED_ALLOWANCE, UNWOUND, DENIED, WITHDRAWN, EXPIRED}
      - name: review_opened_at_utc
        type: datetime
        source: computed
        description: Logical-clock instant an Arbitrator opened intake review; null while SUBMITTED.
        default: null
      - name: intake_arbitrator_user_id
        type: string
        source: computed
        description: >-
          X-User-ID of the Arbitrator who ran POST /arbitration/cases/{id}/open-review.
          Barred from rendering this case's decision (ERR_SEGREGATION_OF_DUTIES).
        default: null
      - name: seller_conceded
        type: boolean
        source: computed
        description: True once the seller answered ACCEPT_UNWIND; forces the decision outcome to UNWIND.
        default: false
      - name: seller_response_timed_out
        type: boolean
        source: computed
        description: True once POST /_ops/run-arbitration-sweep timed the seller response out.
        default: false
      - name: fault_party
        type: enum
        source: computed
        description: >-
          Party the arbitration department holds responsible; drives transport allocation.
          Set to SELLER on seller-response timeout, BUYER on negotiation-round expiry, and
          overwritten by the decision's fault_party input.
        default: NONE
        constraints: "one of {SELLER, BUYER, NONE}"
      - name: current_round_index
        type: integer
        source: computed
        description: Highest NegotiationRound.round_index created on this case; 0 before any response.
        default: 0
      - name: latest_verified_estimate_cents
        type: integer
        source: computed
        description: >-
          repair_estimate_cents of this case's ClaimEvidence rows with verified == true and
          repair_estimate_cents NOT NULL, ranked recorded_at_utc DESC then created_at DESC;
          0 when the candidate set is empty.
        default: 0
      - name: verified_true_mileage
        type: integer
        source: computed
        description: >-
          odometer_reading of this case's ClaimEvidence rows with evidence_type ==
          THIRD_PARTY_VERIFICATION, verified == true and odometer_reading NOT NULL, ranked
          recorded_at_utc DESC then created_at DESC; null when the candidate set is empty.
        default: null

  - name: ClaimEvidence
    parent: null
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: system
        description: FK -> ArbitrationCase.id; the case this evidence supports (taken from the path).
      - name: evidence_type
        type: enum
        source: input
        description: Kind of evidence filed.
        constraints: >-
          one of {INSPECTION_REPORT, DIAGNOSTIC_SCAN, THIRD_PARTY_VERIFICATION,
          PHOTO_SET, TITLE_DOCUMENT}
      - name: provider_name
        type: string
        source: input
        description: Shop, scan tool vendor, or third-party verifier that produced the artifact.
        constraints: "1..120 chars, non-blank"
      - name: document_reference
        type: string
        source: input
        description: Opaque document locator for the filed artifact.
        constraints: "1..120 chars, non-blank"
      - name: repair_estimate_cents
        type: integer
        source: input
        description: Repair cost this artifact substantiates; null when the artifact carries no figure.
        default: null
        constraints: "null or >= 0"
      - name: odometer_reading
        type: integer
        source: input
        description: >-
          True odometer reading this artifact substantiates; feeds
          ArbitrationCase.verified_true_mileage when verified.
        default: null
        constraints: "null or >= 0"
      - name: submitted_by_role
        type: enum
        source: system
        description: X-User-Role of the submitter.
        constraints: "one of {BuyerRep, Inspector}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the submitter.
      - name: verified
        type: boolean
        source: computed
        description: >-
          True if and only if evidence_type IN {INSPECTION_REPORT,
          THIRD_PARTY_VERIFICATION}; false for DIAGNOSTIC_SCAN, PHOTO_SET and
          TITLE_DOCUMENT. The submitting role does not affect this field and any
          client-supplied value is ignored.
        default: false
      - name: recorded_at_utc
        type: datetime
        source: system
        description: Logical-clock instant the evidence row was recorded.
        constraints: "ISO 8601 UTC, three fractional digits"
      - name: case_version_after
        type: integer
        source: computed
        description: ArbitrationCase.version after this evidence row was appended.
        constraints: ">= 2"

  - name: NegotiationRound
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: system
        description: FK -> ArbitrationCase.id; the case being negotiated (taken from the path).
      - name: round_index
        type: integer
        source: computed
        description: ArbitrationCase.current_round_index + 1 at creation time.
        constraints: ">= 1"
      - name: response_type
        type: enum
        source: input
        description: >-
          How the seller answered. TIMEOUT rows are minted by
          POST /_ops/run-arbitration-sweep, never by a client.
        constraints: "one of {OFFER_REPAIR_ALLOWANCE, DISPUTE, ACCEPT_UNWIND, TIMEOUT}"
      - name: seller_offer_cents
        type: integer
        source: input
        description: >-
          Repair allowance the seller offered this round; 0 for DISPUTE, ACCEPT_UNWIND and TIMEOUT rows.
        default: 0
        constraints: ">= 0"
      - name: buyer_demand_cents
        type: integer
        source: input
        description: Buyer's counter figure; null until the buyer counters this round.
        default: null
        constraints: "null or >= 0"
      - name: response_note
        type: string
        source: input
        description: Seller's note attached to this round.
        constraints: "1..500 chars, non-blank"
      - name: counter_note
        type: string
        source: input
        description: Buyer's note attached to the counter; null until the buyer counters.
        default: null
      - name: opened_at_utc
        type: datetime
        source: system
        description: >-
          Logical-clock instant this round opened; start of the CLOSED response interval
          [opened_at_utc, response_deadline_utc] this round occupies on the case.
        constraints: "ISO 8601 UTC, three fractional digits"
      - name: response_deadline_utc
        type: datetime
        source: computed
        description: >-
          opened_at_utc + ROUND_RESPONSE_HOURS. Inclusive end of the round's closed response
          interval; a buyer action strictly after it is rejected with ERR_ROUND_EXPIRED.
        constraints: "ISO 8601 UTC, three fractional digits"
      - name: countered_at_utc
        type: datetime
        source: computed
        description: Logical-clock instant the buyer countered; null until status == COUNTERED.
        default: null
      - name: cooldown_until_utc
        type: datetime
        source: computed
        description: >-
          countered_at_utc + ROUND_COOLDOWN_HOURS; inclusive end of the trailing cool-off buffer.
          A new round may only open strictly after it (ERR_ROUND_COOLDOWN_ACTIVE).
          Null until status == COUNTERED.
        default: null
      - name: status
        type: enum
        source: computed
        description: >-
          Round lifecycle state. CLOSED marks a DISPUTE / ACCEPT_UNWIND / TIMEOUT round that
          never entered haggling.
        default: OPEN
        constraints: "one of {OPEN, COUNTERED, ACCEPTED, SUPERSEDED, EXPIRED, CLOSED}"

  - name: TransportLeg
    parent: null
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: system
        description: FK -> ArbitrationCase.id; the case whose transportation this leg belongs to (taken from the path).
      - name: leg_type
        type: enum
        source: input
        description: Direction of the move being billed.
        constraints: "one of {INBOUND_TO_AUCTION, RETURN_TO_SELLER, TO_BUYER_REDELIVERY}"
      - name: miles
        type: integer
        source: input
        description: Billed miles for this leg; feeds the tiered per-mile rate ladder.
        constraints: ">= 0"
      - name: carrier_name
        type: string
        source: input
        description: Carrier that ran the leg.
        constraints: "1..120 chars, non-blank"
      - name: cost_cents
        type: integer
        source: computed
        description: >-
          TRANSPORT_DISPATCH_FEE_CENTS plus the tiered per-mile ladder from
          calculations.transport_cost_allocation.
        constraints: ">= 0"
      - name: recorded_at_utc
        type: datetime
        source: system
        description: Logical-clock instant the leg was recorded.
        constraints: "ISO 8601 UTC, three fractional digits"
      - name: case_version_after
        type: integer
        source: computed
        description: >-
          ArbitrationCase.version after this leg was appended; the value a subsequent
          expected_case_version must carry.
        constraints: ">= 2"

  - name: ArbitrationDecision
    parent: null
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: system
        description: FK -> ArbitrationCase.id; the case this decision terminates (taken from the path).
      - name: outcome
        type: enum
        source: input
        description: Arbitration outcome rendered.
        constraints: "one of {UNWIND, REPAIR_ALLOWANCE, CLAIM_DENIED, FRIVOLOUS_DENIED}"
      - name: allowance_variant
        type: enum
        source: computed
        description: >-
          Which variant of calculations.repair_allowance_amount produced allowance_cents.
          NEGOTIATED_ACCEPT for buyer-accepted offers, ARBITRATOR_AWARD for rendered awards,
          NONE for UNWIND / CLAIM_DENIED / FRIVOLOUS_DENIED.
        constraints: "one of {NEGOTIATED_ACCEPT, ARBITRATOR_AWARD, NONE}"
      - name: computed_award_cents
        type: integer
        source: computed
        description: >-
          Raw output of the ARBITRATOR_AWARD variant formula, recorded even when
          allowance_variant == NEGOTIATED_ACCEPT so the two variants can be compared.
        constraints: ">= 0"
      - name: requested_allowance_cents
        type: integer
        source: input
        description: >-
          Allowance figure the arbitrator proposes; required when outcome == REPAIR_ALLOWANCE,
          null otherwise. Validated against the policy cap.
        default: null
        constraints: "null or >= 0"
      - name: allowance_cents
        type: integer
        source: computed
        description: Allowance actually posted to the ledger; 0 for non-allowance outcomes.
        constraints: ">= 0"
      - name: fault_party
        type: enum
        source: input
        description: Party held responsible; selects the transport allocation profile.
        constraints: "one of {SELLER, BUYER, NONE}"
      - name: transport_total_cents
        type: integer
        source: computed
        description: Sum of TransportLeg.cost_cents over the case's legs; 0 when the case has no legs.
        default: 0
      - name: transport_buyer_share_cents
        type: integer
        source: computed
        description: Buyer's share, summed from per-leg rounded shares.
        default: 0
      - name: transport_seller_share_cents
        type: integer
        source: computed
        description: Seller's share, summed from per-leg rounded shares.
        default: 0
      - name: transport_auction_share_cents
        type: integer
        source: computed
        description: >-
          Auction's residual share, summed from per-leg residuals; MAY be negative when both
          the buyer and seller per-leg shares round up.
        default: 0
      - name: sale_price_refund_cents
        type: integer
        source: computed
        description: >-
          Gross refund leg of an unwind, copied from AuctionSale.sale_price_cents at decision
          time per calculations.unwind_payout_totals step 1; 0 for non-UNWIND outcomes.
        default: 0
      - name: fee_offset_applied_cents
        type: integer
        source: computed
        description: >-
          Outstanding frivolous-fee balance netted out of an unwind refund;
          0 for non-UNWIND outcomes.
        default: 0
      - name: frivolous_fee_cents
        type: integer
        source: computed
        description: >-
          Fee newly assessed by THIS decision, mirroring the FrivolousFeeAssessment.fee_cents
          row created when outcome == FRIVOLOUS_DENIED; 0 for every other outcome.
        default: 0
      - name: total_buyer_payout_cents
        type: integer
        source: computed
        description: >-
          Net cash the buyer receives on an unwind, per the pinned evaluation order in
          calculations.unwind_payout_totals; 0 for non-UNWIND outcomes.
        default: 0
      - name: rationale
        type: string
        source: input
        description: Arbitrator's written rationale.
        constraints: "1..1000 chars, non-blank"
      - name: decided_by_arbitrator_user_id
        type: string
        source: system
        description: X-User-ID of the deciding Arbitrator; must differ from intake_arbitrator_user_id.
      - name: decided_at_utc
        type: datetime
        source: system
        description: Logical-clock instant the decision was rendered; the scorecard window key.
        constraints: "ISO 8601 UTC, three fractional digits"

  - name: SettlementLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: sale_id
        type: string
        source: system
        description: FK -> AuctionSale.id; the sale whose money this entry moves.
      - name: case_id
        type: string
        source: system
        description: >-
          FK -> ArbitrationCase.id; the case that caused this entry, or null for
          SALE_PROCEEDS entries posted at settlement.
        default: null
      - name: party
        type: enum
        source: computed
        description: Ledger side this entry lands on.
        constraints: "one of {BUYER, SELLER, AUCTION}"
      - name: entry_type
        type: enum
        source: computed
        description: Economic reason for the entry.
        constraints: >-
          one of {SALE_PROCEEDS, SALE_PROCEEDS_REVERSAL, TRANSPORT_ALLOCATION,
          REPAIR_ALLOWANCE, FRIVOLOUS_FEE_ASSESSED, FRIVOLOUS_FEE_OFFSET}
      - name: amount_signed_cents
        type: integer
        source: computed
        description: >-
          Signed cents; positive credits the party, negative debits it. Every posting batch sums
          to exactly 0 per calculations.sale_ledger_conservation.
      - name: posted_at_utc
        type: datetime
        source: system
        description: Logical-clock instant the entry was posted.
        constraints: "ISO 8601 UTC, three fractional digits"

  - name: FrivolousFeeAssessment
    parent: null
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: system
        description: FK -> ArbitrationCase.id; the case ruled frivolous.
      - name: buyer_id
        type: string
        source: system
        description: FK -> Buyer.id; the claimant charged the fee.
      - name: prior_frivolous_count
        type: integer
        source: system
        description: Buyer.frivolous_claim_count immediately before this assessment.
        constraints: ">= 0"
      - name: fee_cents
        type: integer
        source: computed
        description: Escalating fee from calculations.frivolous_fee_assessment.
        constraints: ">= 0"
      - name: reason
        type: string
        source: system
        description: >-
          Verbatim copy of ArbitrationDecision.rationale from the FRIVOLOUS_DENIED decision that
          created this assessment; never supplied by the client.
        constraints: "1..1000 chars, non-blank"
      - name: assessed_at_utc
        type: datetime
        source: system
        description: Logical-clock instant the fee was assessed.
        constraints: "ISO 8601 UTC, three fractional digits"

  - name: SellerPolicyAction
    parent: null
    common_fields: false
    fields:
      - name: seller_id
        type: string
        source: system
        description: FK -> Seller.id; the consignor whose standing changed.
      - name: triggered_by_case_id
        type: string
        source: system
        description: >-
          FK -> ArbitrationCase.id; the case whose decision moved the tier,
          or null for a REINSTATE action.
        default: null
      - name: action_type
        type: enum
        source: computed
        description: Policy consequence applied.
        constraints: "one of {WATCH_LIST, PROBATION, BLOCK, REINSTATE}"
      - name: from_tier
        type: enum
        source: computed
        description: Seller.policy_tier before the action.
        constraints: "one of {GOOD_STANDING, WATCH, PROBATION, BLOCKED}"
      - name: to_tier
        type: enum
        source: computed
        description: Seller.policy_tier after the action.
        constraints: "one of {GOOD_STANDING, WATCH, PROBATION, BLOCKED}"
      - name: rolling_rate_bps_at_action
        type: integer
        source: computed
        description: Seller.rolling_arbitration_rate_bps at the moment the action fired.
        constraints: ">= 0"
      - name: note
        type: string
        source: system
        description: >-
          For action_type == REINSTATE, the verbatim reinstate_note from the request; for the
          automatic WATCH_LIST / PROBATION / BLOCK actions, the server-generated string
          "auto tier change at <rolling_rate_bps_at_action> bps". Never supplied by the client
          on the automatic actions.
        default: null
      - name: effective_at_utc
        type: datetime
        source: system
        description: Logical-clock instant the action took effect.
        constraints: "ISO 8601 UTC, three fractional digits"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # Cyclic + branching: NEGOTIATION <-> COUNTERED loop, then a three-way branch
  # out of ARBITRATOR_REVIEW with divergent side-effect sets per branch.
  # ---------------------------------------------------------------------------
  - entity: ArbitrationCase
    initial_state: SUBMITTED
    terminal_states: [RESOLVED_ALLOWANCE, UNWOUND, DENIED, WITHDRAWN, EXPIRED]
    transitions:

      - from: null
        to: SUBMITTED
        trigger: "POST /arbitration/cases"
        actor: BuyerRep
        preconditions:
          - "AuctionSale with request.sale_id exists"
          - "X-User-ID == AuctionSale.buyer_id (else ERR_NOT_SALE_BUYER)"
          - "Buyer.claim_privilege_status != SUSPENDED (else ERR_BUYER_PRIVILEGE_SUSPENDED)"
          - "exactly one ArbitrationPolicy has defect_class == request.defect_class (else ERR_POLICY_NOT_FOUND)"
          - "no SaleAnnouncement on the sale has defect_class == request.defect_class, unless request.defect_class == TITLE_MISSING (else ERR_DEFECT_ANNOUNCED)"
          - "not (governing PostSaleInspection exists AND its status == COMPLETED AND policy.psi_clean_waives_rights == true AND request.defect_class NOT IN that PSI.findings) (else ERR_PSI_WAIVED_RIGHTS)"
          - "policy.window_hours IS NULL OR hours_elapsed_at_claim <= effective_window_hours (else ERR_ARBITRATION_WINDOW_EXPIRED)"
          - "policy.mileage_limit IS NULL OR miles_driven_at_claim <= policy.mileage_limit (else ERR_MILEAGE_LIMIT_EXCEEDED)"
          - "no ArbitrationCase on the same sale_id with the same defect_class has status NOT IN {RESOLVED_ALLOWANCE, UNWOUND, DENIED, WITHDRAWN, EXPIRED} (else ERR_DUPLICATE_OPEN_CLAIM)"
          - "request.claim_amount_cents >= policy.min_claim_amount_cents (else ERR_CLAIM_BELOW_MINIMUM)"
          - "when request.superseded_case_id is supplied: that case exists, has the same sale_id and defect_class, and status IN {WITHDRAWN, EXPIRED} (else ERR_INVALID_REQUEST)"
        side_effects:
          - "sets claimant_buyer_id = AuctionSale.buyer_id, policy_id = the resolved policy, policy_version_at_intake = policy.version"
          - "runs calculations.arbitration_window_evaluation and stores hours_elapsed_at_claim, miles_driven_at_claim, psi_extension_applied_hours, effective_window_hours, window_eligible"
          - "AuctionSale.arbitration_status NONE -> ACTIVE; AuctionSale.open_case_count += 1; increments AuctionSale.version by 1"
          - "Buyer.open_claim_count += 1; Buyer.lifetime_claim_count += 1; increments Buyer.version by 1"
          - "Seller.open_claim_count += 1; increments Seller.version by 1"
        note: "Forward half of calculations.open_claim_counter_invariant."

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /arbitration/cases/{id}/open-review"
        actor: Arbitrator
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_CASE_STATE)"
          - "when defect_class NOT IN {TITLE_BRANDED, TITLE_MISSING}: at least one ClaimEvidence on the case has evidence_type == INSPECTION_REPORT (else ERR_MISSING_INSPECTION_REPORT)"
          - "when defect_class IN {TITLE_BRANDED, TITLE_MISSING}: at least one ClaimEvidence on the case has evidence_type == TITLE_DOCUMENT (else ERR_TITLE_CLAIM_REQUIRES_TITLE_EVIDENCE)"
          - "when policy.requires_third_party_verification == true: at least one ClaimEvidence on the case has evidence_type == THIRD_PARTY_VERIFICATION AND verified == true (else ERR_THIRD_PARTY_VERIFICATION_REQUIRED)"
        side_effects:
          - "sets review_opened_at_utc = current logical clock"
          - "sets intake_arbitrator_user_id = X-User-ID; this operator is barred from the decision"
          - "increments ArbitrationCase.version by 1"

      - from: SUBMITTED
        to: EXPIRED
        trigger: "POST /_ops/run-arbitration-sweep (sweep phase 4)"
        actor: system
        preconditions:
          - "status == SUBMITTED"
          - "current logical clock > claimed_at_utc + INTAKE_GRACE_HOURS"
        side_effects:
          - "AuctionSale.open_case_count -= 1; when open_case_count reaches 0 AND no ArbitrationDecision exists on the sale, AuctionSale.arbitration_status ACTIVE -> NONE; increments AuctionSale.version by 1"
          - "Buyer.open_claim_count -= 1; increments Buyer.version by 1"
          - "Seller.open_claim_count -= 1; increments Seller.version by 1"
          - "increments ArbitrationCase.version by 1"
        note: "Processed in created_at ASC order within the sweep phase."

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /arbitration/cases/{id}/withdraw"
        actor: BuyerRep
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW, NEGOTIATION, COUNTERED} (else ERR_INVALID_CASE_STATE)"
          - "X-User-ID == claimant_buyer_id (else ERR_NOT_CASE_OWNER)"
        side_effects:
          - "AuctionSale.open_case_count -= 1; when open_case_count reaches 0 AND no ArbitrationDecision exists on the sale, AuctionSale.arbitration_status ACTIVE -> NONE; increments AuctionSale.version by 1"
          - "Buyer.open_claim_count -= 1; increments Buyer.version by 1"
          - "Seller.open_claim_count -= 1; increments Seller.version by 1"
          - "increments ArbitrationCase.version by 1"
        note: "Compensating half of calculations.open_claim_counter_invariant."

      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /arbitration/cases/{id}/withdraw"
        actor: BuyerRep
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW, NEGOTIATION, COUNTERED} (else ERR_INVALID_CASE_STATE)"
          - "X-User-ID == claimant_buyer_id (else ERR_NOT_CASE_OWNER)"
        side_effects:
          - "same counter reversal as the SUBMITTED -> WITHDRAWN transition"
          - "any NegotiationRound on the case with status IN {OPEN, COUNTERED} -> SUPERSEDED, in created_at ASC order"
          - "increments ArbitrationCase.version by 1"

      - from: NEGOTIATION
        to: WITHDRAWN
        trigger: "POST /arbitration/cases/{id}/withdraw"
        actor: BuyerRep
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW, NEGOTIATION, COUNTERED} (else ERR_INVALID_CASE_STATE)"
          - "X-User-ID == claimant_buyer_id (else ERR_NOT_CASE_OWNER)"
        side_effects:
          - "same counter reversal as the SUBMITTED -> WITHDRAWN transition"
          - "any NegotiationRound on the case with status IN {OPEN, COUNTERED} -> SUPERSEDED, in created_at ASC order"
          - "increments ArbitrationCase.version by 1"

      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /arbitration/cases/{id}/withdraw"
        actor: BuyerRep
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW, NEGOTIATION, COUNTERED} (else ERR_INVALID_CASE_STATE)"
          - "X-User-ID == claimant_buyer_id (else ERR_NOT_CASE_OWNER)"
        side_effects:
          - "same counter reversal as the SUBMITTED -> WITHDRAWN transition"
          - "any NegotiationRound on the case with status IN {OPEN, COUNTERED} -> SUPERSEDED, in created_at ASC order"
          - "increments ArbitrationCase.version by 1"

      - from: UNDER_REVIEW
        to: NEGOTIATION
        trigger: "POST /arbitration/cases/{id}/seller-response with response_type == OFFER_REPAIR_ALLOWANCE"
        actor: SellerRep
        preconditions:
          - "status IN {UNDER_REVIEW, COUNTERED} (else ERR_INVALID_CASE_STATE)"
          - "X-User-ID == AuctionSale.seller_id of the case's sale (else ERR_NOT_SALE_SELLER)"
          - "request.seller_offer_cents is supplied and > 0 (else ERR_INVALID_REQUEST)"
          - "request.seller_offer_cents <= round_half_up(AuctionSale.sale_price_cents * policy.max_allowance_bps / 10000) (else ERR_ALLOWANCE_EXCEEDS_CAP)"
          - "no NegotiationRound on the case has status == COUNTERED with cooldown_until_utc >= current logical clock (else ERR_ROUND_COOLDOWN_ACTIVE)"
        side_effects:
          - "creates NegotiationRound with round_index = current_round_index + 1, status OPEN, opened_at_utc = now, response_deadline_utc = now + ROUND_RESPONSE_HOURS"
          - "any NegotiationRound on the case with status == COUNTERED -> SUPERSEDED, in created_at ASC order"
          - "ArbitrationCase.current_round_index = the new round_index; increments ArbitrationCase.version by 1"

      - from: COUNTERED
        to: NEGOTIATION
        trigger: "POST /arbitration/cases/{id}/seller-response with response_type == OFFER_REPAIR_ALLOWANCE"
        actor: SellerRep
        preconditions:
          - "status IN {UNDER_REVIEW, COUNTERED} (else ERR_INVALID_CASE_STATE)"
          - "X-User-ID == AuctionSale.seller_id of the case's sale (else ERR_NOT_SALE_SELLER)"
          - "request.seller_offer_cents <= round_half_up(AuctionSale.sale_price_cents * policy.max_allowance_bps / 10000) (else ERR_ALLOWANCE_EXCEEDS_CAP)"
          - "current logical clock > the COUNTERED round's cooldown_until_utc (else ERR_ROUND_COOLDOWN_ACTIVE)"
        side_effects:
          - "creates the next NegotiationRound with status OPEN"
          - "the prior COUNTERED round -> SUPERSEDED"
          - "ArbitrationCase.current_round_index += 1; increments ArbitrationCase.version by 1"
        note: "Closes the cycle: NEGOTIATION -> COUNTERED -> NEGOTIATION over successive allowance rounds."

      - from: NEGOTIATION
        to: COUNTERED
        trigger: "POST /arbitration/cases/{id}/negotiation-rounds/{round_id}/counter"
        actor: BuyerRep
        preconditions:
          - "status == NEGOTIATION (else ERR_INVALID_CASE_STATE)"
          - "X-User-ID == claimant_buyer_id (else ERR_NOT_CASE_OWNER)"
          - "NegotiationRound.case_id == path case id (else ERR_ROUND_NOT_FOUND)"
          - "NegotiationRound.status == OPEN (else ERR_INVALID_ROUND_STATE)"
          - "current logical clock <= NegotiationRound.response_deadline_utc (else ERR_ROUND_EXPIRED)"
        side_effects:
          - "NegotiationRound.status OPEN -> COUNTERED; countered_at_utc = now; cooldown_until_utc = now + ROUND_COOLDOWN_HOURS; buyer_demand_cents = request.buyer_demand_cents; increments NegotiationRound.version by 1"
          - "increments ArbitrationCase.version by 1"

      - from: NEGOTIATION
        to: RESOLVED_ALLOWANCE
        trigger: "POST /arbitration/cases/{id}/negotiation-rounds/{round_id}/accept"
        actor: BuyerRep
        preconditions:
          - "status == NEGOTIATION (else ERR_INVALID_CASE_STATE)"
          - "X-User-ID == claimant_buyer_id (else ERR_NOT_CASE_OWNER)"
          - "NegotiationRound.status == OPEN (else ERR_INVALID_ROUND_STATE)"
          - "current logical clock <= NegotiationRound.response_deadline_utc (else ERR_ROUND_EXPIRED)"
        side_effects:
          - "hop 1: NegotiationRound.status OPEN -> ACCEPTED; ArbitrationCase.status NEGOTIATION -> RESOLVED_ALLOWANCE; ArbitrationCase.fault_party = SELLER"
          - "hop 2: because the case reached an upheld terminal state, an ArbitrationDecision row is created with outcome REPAIR_ALLOWANCE, allowance_variant NEGOTIATED_ACCEPT, allowance_cents = NegotiationRound.seller_offer_cents, computed_award_cents = the ARBITRATOR_AWARD variant output for comparison; calculations.transport_cost_allocation runs over the case's TransportLeg rows; SettlementLedgerEntry rows are posted (REPAIR_ALLOWANCE: BUYER +allowance_cents, SELLER -allowance_cents; TRANSPORT_ALLOCATION rows per leg)"
          - "hop 3: because an upheld ArbitrationDecision now exists, Seller.lifetime_upheld_count += 1 and calculations.seller_arbitration_rate recomputes Seller.rolling_arbitration_rate_bps and Seller.lifetime_arbitration_rate_bps"
          - "hop 4: because the recomputed rolling rate crossed a tier threshold, Seller.policy_tier advances and a SellerPolicyAction row is appended with the matching action_type"
          - "hop 5: because Seller.policy_tier became BLOCKED, every AuctionSale of that seller with settlement_status == UNSETTLED AND arbitration_status == NONE gets settlement_hold = true, in created_at ASC order, each bumping its own version"
          - "AuctionSale.arbitration_status ACTIVE -> RESOLVED; AuctionSale.open_case_count -= 1"
          - "Buyer.open_claim_count -= 1; Seller.open_claim_count -= 1"
          - "increments ArbitrationCase.version by 1"
        note: "Depth-5 transitive cascade; each hop is caused by the previous hop, not by the original request."

      - from: NEGOTIATION
        to: ARBITRATOR_REVIEW
        trigger: "POST /arbitration/cases/{id}/escalate"
        actor: Arbitrator
        preconditions:
          - "status IN {NEGOTIATION, COUNTERED} (else ERR_INVALID_CASE_STATE)"
          - "current_round_index >= MAX_NEGOTIATION_ROUNDS OR seller_response_timed_out == true (else ERR_NEGOTIATION_NOT_EXHAUSTED)"
        side_effects:
          - "any NegotiationRound on the case with status IN {OPEN, COUNTERED} -> SUPERSEDED, in created_at ASC order"
          - "increments ArbitrationCase.version by 1"

      - from: COUNTERED
        to: ARBITRATOR_REVIEW
        trigger: "POST /arbitration/cases/{id}/escalate"
        actor: Arbitrator
        preconditions:
          - "status IN {NEGOTIATION, COUNTERED} (else ERR_INVALID_CASE_STATE)"
          - "current_round_index >= MAX_NEGOTIATION_ROUNDS OR seller_response_timed_out == true (else ERR_NEGOTIATION_NOT_EXHAUSTED)"
        side_effects:
          - "the COUNTERED round -> SUPERSEDED"
          - "increments ArbitrationCase.version by 1"

      - from: UNDER_REVIEW
        to: ARBITRATOR_REVIEW
        trigger: "POST /arbitration/cases/{id}/seller-response with response_type == DISPUTE"
        actor: SellerRep
        preconditions:
          - "status IN {UNDER_REVIEW, COUNTERED} (else ERR_INVALID_CASE_STATE)"
          - "X-User-ID == AuctionSale.seller_id of the case's sale (else ERR_NOT_SALE_SELLER)"
        side_effects:
          - "creates NegotiationRound with response_type DISPUTE, seller_offer_cents 0, status CLOSED"
          - "ArbitrationCase.current_round_index += 1; increments ArbitrationCase.version by 1"

      - from: UNDER_REVIEW
        to: ARBITRATOR_REVIEW
        trigger: "POST /arbitration/cases/{id}/seller-response with response_type == ACCEPT_UNWIND"
        actor: SellerRep
        preconditions:
          - "status IN {UNDER_REVIEW, COUNTERED} (else ERR_INVALID_CASE_STATE)"
          - "X-User-ID == AuctionSale.seller_id of the case's sale (else ERR_NOT_SALE_SELLER)"
        side_effects:
          - "creates NegotiationRound with response_type ACCEPT_UNWIND, seller_offer_cents 0, status CLOSED"
          - "sets ArbitrationCase.seller_conceded = true, which forces the decision outcome to UNWIND"
          - "ArbitrationCase.current_round_index += 1; increments ArbitrationCase.version by 1"

      - from: UNDER_REVIEW
        to: ARBITRATOR_REVIEW
        trigger: "POST /_ops/run-arbitration-sweep (sweep phase 3)"
        actor: system
        preconditions:
          - "status == UNDER_REVIEW"
          - "current logical clock > review_opened_at_utc + ArbitrationPolicy.seller_response_hours"
        side_effects:
          - "creates NegotiationRound with response_type TIMEOUT, seller_offer_cents 0, status CLOSED"
          - "sets seller_response_timed_out = true and fault_party = SELLER"
          - "ArbitrationCase.current_round_index += 1; increments ArbitrationCase.version by 1"

      - from: NEGOTIATION
        to: ARBITRATOR_REVIEW
        trigger: "POST /_ops/run-arbitration-sweep (sweep phase 2)"
        actor: system
        preconditions:
          - "status == NEGOTIATION"
          - "the case's OPEN NegotiationRound has current logical clock > response_deadline_utc"
        side_effects:
          - "the OPEN NegotiationRound -> EXPIRED"
          - "sets fault_party = BUYER because the buyer let the offer lapse"
          - "increments ArbitrationCase.version by 1"

      - from: ARBITRATOR_REVIEW
        to: UNWOUND
        trigger: "POST /arbitration/cases/{id}/decision with outcome == UNWIND"
        actor: Arbitrator
        preconditions:
          - "status == ARBITRATOR_REVIEW (else ERR_INVALID_CASE_STATE)"
          - "X-User-ID != intake_arbitrator_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "creates ArbitrationDecision with allowance_variant NONE, allowance_cents 0, fault_party = request.fault_party"
          - "calculations.transport_cost_allocation runs with the (UNWIND, fault_party) profile; TRANSPORT_ALLOCATION SettlementLedgerEntry rows are posted per leg in created_at ASC order"
          - "when AuctionSale.settlement_status == SETTLED: SALE_PROCEEDS_REVERSAL rows are posted (BUYER +sale_price_cents, SELLER -sale_price_cents); when it is UNSETTLED no reversal rows are posted"
          - "AuctionSale.settlement_status -> REVERSED regardless of its prior value"
          - "calculations.unwind_payout_totals sets fee_offset_applied_cents and total_buyer_payout_cents; when fee_offset_applied_cents > 0 a FRIVOLOUS_FEE_OFFSET pair is posted (BUYER -offset, AUCTION +offset) and Buyer.frivolous_fee_balance_cents decreases by the offset"
          - "because the balance may reach 0, Buyer.claim_privilege_status FEE_HOLD -> ACTIVE when frivolous_claim_count < 3"
          - "AuctionSale.arbitration_status ACTIVE -> RESOLVED; AuctionSale.open_case_count -= 1; Buyer.open_claim_count -= 1; Seller.open_claim_count -= 1"
          - "Seller.lifetime_upheld_count += 1; calculations.seller_arbitration_rate recomputes; policy_tier may advance and append a SellerPolicyAction; a BLOCKED tier then sets settlement_hold on that seller's UNSETTLED, arbitration_status == NONE sales"
          - "increments ArbitrationCase.version, AuctionSale.version, Buyer.version and Seller.version by 1 each"

      - from: ARBITRATOR_REVIEW
        to: RESOLVED_ALLOWANCE
        trigger: "POST /arbitration/cases/{id}/decision with outcome == REPAIR_ALLOWANCE"
        actor: Arbitrator
        preconditions:
          - "status == ARBITRATOR_REVIEW (else ERR_INVALID_CASE_STATE)"
          - "X-User-ID != intake_arbitrator_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "seller_conceded == false AND policy.max_allowance_bps > 0 (else ERR_UNWIND_MANDATORY)"
          - "when defect_class != MILEAGE_DISCREPANCY: latest_verified_estimate_cents > 0 (else ERR_THIRD_PARTY_VERIFICATION_REQUIRED)"
          - "request.requested_allowance_cents <= round_half_up(AuctionSale.sale_price_cents * policy.max_allowance_bps / 10000) (else ERR_ALLOWANCE_EXCEEDS_CAP)"
        side_effects:
          - "creates ArbitrationDecision with allowance_variant ARBITRATOR_AWARD, computed_award_cents from calculations.repair_allowance_amount, allowance_cents = min(request.requested_allowance_cents, computed_award_cents)"
          - "SettlementLedgerEntry REPAIR_ALLOWANCE pair posted (BUYER +allowance_cents, SELLER -allowance_cents)"
          - "TRANSPORT_ALLOCATION rows posted with the REPAIR_ALLOWANCE profile"
          - "AuctionSale.settlement_status is left untouched — the allowance branch never reverses proceeds"
          - "AuctionSale.arbitration_status ACTIVE -> RESOLVED; counters decrement as in the UNWIND branch; Seller.lifetime_upheld_count += 1 and the scorecard/tier/settlement-hold cascade runs"
          - "increments ArbitrationCase.version by 1"
        note: "Divergent branch: same from-state as UNWOUND but no proceeds reversal and no fee offset."

      - from: ARBITRATOR_REVIEW
        to: DENIED
        trigger: "POST /arbitration/cases/{id}/decision with outcome == CLAIM_DENIED"
        actor: Arbitrator
        preconditions:
          - "status == ARBITRATOR_REVIEW (else ERR_INVALID_CASE_STATE)"
          - "X-User-ID != intake_arbitrator_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "seller_conceded == false (else ERR_UNWIND_MANDATORY)"
        side_effects:
          - "creates ArbitrationDecision with allowance_variant NONE, allowance_cents 0"
          - "TRANSPORT_ALLOCATION rows posted with the buyer-bears-all profile"
          - "AuctionSale.arbitration_status ACTIVE -> RESOLVED; AuctionSale.open_case_count -= 1; Buyer.open_claim_count -= 1; Seller.open_claim_count -= 1"
          - "Seller.lifetime_upheld_count is NOT incremented and the scorecard is NOT recomputed — a denial is not an upheld claim"
          - "increments ArbitrationCase.version by 1"
        note: "Divergent branch: no seller consequence at all."

      - from: ARBITRATOR_REVIEW
        to: DENIED
        trigger: "POST /arbitration/cases/{id}/decision with outcome == FRIVOLOUS_DENIED"
        actor: Arbitrator
        preconditions:
          - "status == ARBITRATOR_REVIEW (else ERR_INVALID_CASE_STATE)"
          - "X-User-ID != intake_arbitrator_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "seller_conceded == false (else ERR_UNWIND_MANDATORY)"
        side_effects:
          - "hop 1: creates ArbitrationDecision (allowance_variant NONE) and a FrivolousFeeAssessment row whose fee_cents comes from calculations.frivolous_fee_assessment; a FRIVOLOUS_FEE_ASSESSED SettlementLedgerEntry pair is posted (BUYER -fee_cents, AUCTION +fee_cents)"
          - "hop 2: because the assessment row exists, Buyer.frivolous_claim_count += 1 and Buyer.frivolous_fee_balance_cents += fee_cents"
          - "hop 3: because the balance became > 0, Buyer.claim_privilege_status ACTIVE -> FEE_HOLD; when frivolous_claim_count >= FRIVOLOUS_SUSPENSION_COUNT it goes to SUSPENDED instead"
          - "hop 4: because the buyer reached SUSPENDED, every PostSaleInspection with status == REQUESTED on sales whose buyer_id is this buyer -> EXPIRED, in created_at ASC order"
          - "AuctionSale.arbitration_status ACTIVE -> RESOLVED; counters decrement as in the CLAIM_DENIED branch"
          - "increments ArbitrationCase.version and Buyer.version by 1 each"
        note: "Depth-4 transitive cascade originating from a different trigger than the accept cascade."

  # ---------------------------------------------------------------------------
  # Parallel state dimensions on one row: settlement_status x arbitration_status
  # evolve independently and are never derived from each other.
  # ---------------------------------------------------------------------------
  - entity: AuctionSale
    initial_state: "settlement_status=UNSETTLED x arbitration_status=NONE"
    terminal_states: ["settlement_status=REVERSED", "arbitration_status=RESOLVED"]
    transitions:

      - from: "settlement_status=UNSETTLED"
        to: "settlement_status=SETTLED"
        trigger: "POST /arbitration/sales/{id}/settle"
        actor: AuctionAdmin
        preconditions:
          - "settlement_status == UNSETTLED (else ERR_SALE_ALREADY_SETTLED)"
          - "Seller.policy_tier != BLOCKED AND settlement_hold == false (else ERR_SELLER_BLOCKED)"
        side_effects:
          - "posts a SALE_PROCEEDS SettlementLedgerEntry pair: (SELLER, +sale_price_cents) and (BUYER, -sale_price_cents), case_id null"
          - "increments AuctionSale.version by 1"
        note: "Permitted while arbitration_status == ACTIVE — the two dimensions do not gate each other."

      - from: "settlement_status=SETTLED"
        to: "settlement_status=REVERSED"
        trigger: "POST /arbitration/cases/{id}/decision with outcome == UNWIND"
        actor: Arbitrator
        preconditions:
          - "the case's ArbitrationCase.status == ARBITRATOR_REVIEW"
        side_effects:
          - "posts a SALE_PROCEEDS_REVERSAL pair: (BUYER, +sale_price_cents) and (SELLER, -sale_price_cents)"
          - "increments AuctionSale.version by 1"
        note: "Compensating half of calculations.sale_ledger_conservation."

      - from: "settlement_status=UNSETTLED"
        to: "settlement_status=REVERSED"
        trigger: "POST /arbitration/cases/{id}/decision with outcome == UNWIND"
        actor: Arbitrator
        preconditions:
          - "the case's ArbitrationCase.status == ARBITRATOR_REVIEW"
        side_effects:
          - "NO SALE_PROCEEDS_REVERSAL rows are posted because no proceeds were ever released"
          - "increments AuctionSale.version by 1"
        note: "Conditional cascade: the reversal posting depends on the prior settlement_status."

      - from: "arbitration_status=NONE"
        to: "arbitration_status=ACTIVE"
        trigger: "POST /arbitration/cases"
        actor: BuyerRep
        preconditions:
          - "the intake preconditions of ArbitrationCase null -> SUBMITTED all pass"
        side_effects:
          - "open_case_count += 1; increments AuctionSale.version by 1"

      - from: "arbitration_status=ACTIVE"
        to: "arbitration_status=NONE"
        trigger: "POST /arbitration/cases/{id}/withdraw or POST /_ops/run-arbitration-sweep (sweep phase 4)"
        actor: BuyerRep | system
        preconditions:
          - "open_case_count reaches 0 after the decrement"
          - "no ArbitrationDecision row exists on any case of this sale"
        side_effects:
          - "increments AuctionSale.version by 1"
        note: "Compound: derived from the aggregate state of the sale's child cases."

      - from: "arbitration_status=ACTIVE"
        to: "arbitration_status=RESOLVED"
        trigger: "POST /arbitration/cases/{id}/decision or POST /arbitration/cases/{id}/negotiation-rounds/{round_id}/accept"
        actor: Arbitrator | BuyerRep
        preconditions:
          - "an ArbitrationDecision row is created on a case of this sale"
        side_effects:
          - "open_case_count -= 1; increments AuctionSale.version by 1"

      - from: "settlement_status=UNSETTLED"
        to: "settlement_status=UNSETTLED (settlement_hold=true)"
        trigger: "cascade hop 5 of an upheld decision that pushes Seller.policy_tier to BLOCKED"
        actor: system
        preconditions:
          - "settlement_status == UNSETTLED AND arbitration_status == NONE"
          - "the sale's Seller.policy_tier just became BLOCKED"
        side_effects:
          - "settlement_hold = true; increments AuctionSale.version by 1"

      - from: "settlement_status=UNSETTLED (settlement_hold=true)"
        to: "settlement_status=UNSETTLED (settlement_hold=false)"
        trigger: "POST /arbitration/sellers/{id}/reinstate"
        actor: AuctionAdmin
        preconditions:
          - "Seller.policy_tier == BLOCKED"
        side_effects:
          - "settlement_hold = false; increments AuctionSale.version by 1"

  # ---------------------------------------------------------------------------
  - entity: NegotiationRound
    initial_state: OPEN
    terminal_states: [ACCEPTED, SUPERSEDED, EXPIRED, CLOSED]
    transitions:

      - from: null
        to: OPEN
        trigger: "POST /arbitration/cases/{id}/seller-response with response_type == OFFER_REPAIR_ALLOWANCE"
        actor: SellerRep
        preconditions:
          - "the case's UNDER_REVIEW|COUNTERED -> NEGOTIATION preconditions pass"
        side_effects:
          - "response_deadline_utc = opened_at_utc + ROUND_RESPONSE_HOURS"

      - from: null
        to: CLOSED
        trigger: "POST /arbitration/cases/{id}/seller-response with response_type IN {DISPUTE, ACCEPT_UNWIND}, or sweep phase 3 with response_type TIMEOUT"
        actor: SellerRep | system
        preconditions:
          - "the case is in UNDER_REVIEW or COUNTERED"
        side_effects:
          - "seller_offer_cents = 0; the round never enters haggling"

      - from: OPEN
        to: COUNTERED
        trigger: "POST /arbitration/cases/{id}/negotiation-rounds/{round_id}/counter"
        actor: BuyerRep
        preconditions:
          - "status == OPEN (else ERR_INVALID_ROUND_STATE)"
          - "current logical clock <= response_deadline_utc (else ERR_ROUND_EXPIRED)"
        side_effects:
          - "countered_at_utc = now; cooldown_until_utc = now + ROUND_COOLDOWN_HOURS; buyer_demand_cents set; increments version by 1"

      - from: OPEN
        to: ACCEPTED
        trigger: "POST /arbitration/cases/{id}/negotiation-rounds/{round_id}/accept"
        actor: BuyerRep
        preconditions:
          - "status == OPEN (else ERR_INVALID_ROUND_STATE)"
          - "current logical clock <= response_deadline_utc (else ERR_ROUND_EXPIRED)"
        side_effects:
          - "triggers the depth-5 accept cascade on the parent case; increments version by 1"

      - from: OPEN
        to: EXPIRED
        trigger: "POST /_ops/run-arbitration-sweep (sweep phase 2)"
        actor: system
        preconditions:
          - "status == OPEN AND current logical clock > response_deadline_utc"
        side_effects:
          - "parent ArbitrationCase NEGOTIATION -> ARBITRATOR_REVIEW with fault_party = BUYER; increments version by 1"

      - from: COUNTERED
        to: SUPERSEDED
        trigger: "POST /arbitration/cases/{id}/seller-response (next round), POST /arbitration/cases/{id}/escalate, or POST /arbitration/cases/{id}/withdraw"
        actor: SellerRep | Arbitrator | BuyerRep
        preconditions:
          - "status == COUNTERED"
        side_effects:
          - "increments version by 1"

      - from: OPEN
        to: SUPERSEDED
        trigger: "POST /arbitration/cases/{id}/escalate or POST /arbitration/cases/{id}/withdraw"
        actor: Arbitrator | BuyerRep
        preconditions:
          - "status == OPEN"
        side_effects:
          - "increments version by 1"

  # ---------------------------------------------------------------------------
  - entity: PostSaleInspection
    initial_state: REQUESTED
    terminal_states: [COMPLETED, EXPIRED]
    transitions:

      - from: null
        to: REQUESTED
        trigger: "POST /arbitration/post-sale-inspections"
        actor: BuyerRep
        preconditions:
          - "AuctionSale with request.sale_id exists (else ERR_SALE_NOT_FOUND)"
          - "X-User-ID == AuctionSale.buyer_id (else ERR_NOT_SALE_BUYER)"
          - "Buyer.claim_privilege_status == ACTIVE (else ERR_BUYER_FEE_HOLD)"
          - "AuctionSale.settlement_status == UNSETTLED (else ERR_SALE_ALREADY_SETTLED)"
          - "the half-open interval [now, now + PSI_REQUEST_TTL_HOURS) does not overlap the interval of any PostSaleInspection on this sale with status == REQUESTED (else ERR_PSI_WINDOW_OVERLAP)"
        side_effects:
          - "window_end_utc = requested_at_utc + PSI_REQUEST_TTL_HOURS; fee_cents from program_tier"

      - from: REQUESTED
        to: COMPLETED
        trigger: "POST /arbitration/post-sale-inspections/{id}/complete"
        actor: Inspector
        preconditions:
          - "status == REQUESTED (else ERR_INVALID_INSPECTION_STATE)"
        side_effects:
          - "findings = request.findings (possibly the empty array); completed_at_utc = now; increments version by 1"
          - "changes the arbitration rights of every later claim on this sale: findings containing the claimed defect_class extends the window by ArbitrationPolicy.psi_extension_hours; findings omitting it waives rights when psi_clean_waives_rights is true"

      - from: REQUESTED
        to: EXPIRED
        trigger: "POST /_ops/run-arbitration-sweep (sweep phase 1)"
        actor: system
        preconditions:
          - "status == REQUESTED AND current logical clock >= window_end_utc"
        side_effects:
          - "increments version by 1"
        note: "Processed in created_at ASC order; frees the sale's PSI interval for a new request."

      - from: REQUESTED
        to: EXPIRED
        trigger: "cascade hop 4 of a FRIVOLOUS_DENIED decision that suspends the buyer"
        actor: system
        preconditions:
          - "status == REQUESTED AND the sale's Buyer.claim_privilege_status just became SUSPENDED"
        side_effects:
          - "increments version by 1"

  # ---------------------------------------------------------------------------
  - entity: Seller
    initial_state: GOOD_STANDING
    terminal_states: []
    transitions:

      - from: GOOD_STANDING
        to: WATCH
        trigger: "recompute of calculations.seller_arbitration_rate after an upheld decision"
        actor: system
        preconditions:
          - "rolling_window_sales_count >= MIN_SCORECARD_SALES"
          - "TIER_WATCH_BPS <= rolling_arbitration_rate_bps < TIER_PROBATION_BPS"
        side_effects:
          - "appends SellerPolicyAction with action_type WATCH_LIST, from_tier GOOD_STANDING, to_tier WATCH"

      - from: WATCH
        to: PROBATION
        trigger: "recompute of calculations.seller_arbitration_rate after an upheld decision"
        actor: system
        preconditions:
          - "rolling_window_sales_count >= MIN_SCORECARD_SALES"
          - "TIER_PROBATION_BPS <= rolling_arbitration_rate_bps < TIER_BLOCK_BPS"
        side_effects:
          - "appends SellerPolicyAction with action_type PROBATION"

      - from: GOOD_STANDING
        to: BLOCKED
        trigger: "recompute of calculations.seller_arbitration_rate after an upheld decision"
        actor: system
        preconditions:
          - "rolling_window_sales_count >= MIN_SCORECARD_SALES"
          - "rolling_arbitration_rate_bps >= TIER_BLOCK_BPS"
        side_effects:
          - "blocked_at_utc = now; appends SellerPolicyAction with action_type BLOCK"
          - "sets settlement_hold = true on this seller's AuctionSale rows with settlement_status == UNSETTLED AND arbitration_status == NONE, in created_at ASC order"
        note: "Tier jumps are allowed — the tier is a pure function of the rolling rate, not a one-step ladder."

      - from: PROBATION
        to: BLOCKED
        trigger: "recompute of calculations.seller_arbitration_rate after an upheld decision"
        actor: system
        preconditions:
          - "rolling_window_sales_count >= MIN_SCORECARD_SALES"
          - "rolling_arbitration_rate_bps >= TIER_BLOCK_BPS"
        side_effects:
          - "blocked_at_utc = now; appends SellerPolicyAction with action_type BLOCK; settlement_hold cascade runs"

      - from: BLOCKED
        to: PROBATION
        trigger: "POST /arbitration/sellers/{id}/reinstate"
        actor: AuctionAdmin
        preconditions:
          - "policy_tier == BLOCKED (else ERR_SELLER_NOT_BLOCKED)"
        side_effects:
          - "blocked_at_utc = null; reinstated_count += 1; appends SellerPolicyAction with action_type REINSTATE, triggered_by_case_id null"
          - "clears settlement_hold on this seller's AuctionSale rows, in created_at ASC order"
          - "increments Seller.version by 1"
        note: "Closes the cycle PROBATION -> BLOCKED -> PROBATION; BLOCKED is otherwise sticky and no recompute can leave it."

      - from: WATCH
        to: GOOD_STANDING
        trigger: "recompute of calculations.seller_arbitration_rate after an upheld decision"
        actor: system
        preconditions:
          - "rolling_arbitration_rate_bps < TIER_WATCH_BPS OR rolling_window_sales_count < MIN_SCORECARD_SALES"
        side_effects:
          - "appends no SellerPolicyAction — de-escalation is silent"
        note: "Only reachable while policy_tier != BLOCKED; a BLOCKED tier ignores every recompute."

  # ---------------------------------------------------------------------------
  - entity: Buyer
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:

      - from: ACTIVE
        to: FEE_HOLD
        trigger: "cascade hop 3 of a FRIVOLOUS_DENIED decision"
        actor: system
        preconditions:
          - "frivolous_fee_balance_cents > 0 AND frivolous_claim_count < FRIVOLOUS_SUSPENSION_COUNT"
        side_effects:
          - "increments Buyer.version by 1"

      - from: FEE_HOLD
        to: ACTIVE
        trigger: "POST /arbitration/buyers/{id}/fee-payments, or an unwind fee offset that clears the balance"
        actor: BuyerRep | system
        preconditions:
          - "frivolous_fee_balance_cents reaches 0 AND frivolous_claim_count < FRIVOLOUS_SUSPENSION_COUNT"
        side_effects:
          - "increments Buyer.version by 1"
        note: "Closes the cycle ACTIVE -> FEE_HOLD -> ACTIVE."

      - from: FEE_HOLD
        to: SUSPENDED
        trigger: "cascade hop 3 of a FRIVOLOUS_DENIED decision"
        actor: system
        preconditions:
          - "frivolous_claim_count >= FRIVOLOUS_SUSPENSION_COUNT"
        side_effects:
          - "cascade hop 4 expires this buyer's REQUESTED PostSaleInspection rows"
          - "increments Buyer.version by 1"
        note: "SUSPENDED is terminal: paying the balance down does not restore claim privileges."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:

  - rule_id: transport-leg-stale-case
    parent_entity: ArbitrationCase
    write_endpoint: "POST /arbitration/cases/{id}/transport-legs"
    occ_field: "expected_case_version"
    description: |
      Recording a transportation leg against an ArbitrationCase whose version has
      advanced since the client last observed it is rejected. Appending a second
      leg is legitimate on its own terms — the case allows any number of legs — so
      the write cannot be screened out by a state precondition; the guard is the
      stale-version check. A client that read the case, then had another writer
      append a leg or advance the case's negotiation state, would otherwise base
      its allocation basis on a superseded view of the case.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: fee-payment-stale-buyer
    parent_entity: Buyer
    write_endpoint: "POST /arbitration/buyers/{id}/fee-payments"
    occ_field: "expected_buyer_version"
    description: |
      Paying down a frivolous-fee balance against a Buyer whose version has advanced
      since the client last observed it is rejected. Partial payments are legitimate,
      so a second payment observing the same balance would itself succeed under the
      natural product semantics; the stale-version check is what makes the outcome
      deterministic when an unwind fee offset or a new assessment has already moved
      the balance.
    error_id: ERR_STALE_BUYER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Table
# =============================================================================
calculations:

  - rule_id: arbitration_window_evaluation
    name: "Arbitration window eligibility by defect class"
    algorithm_type: threshold
    trigger: "POST /arbitration/cases (evaluated before the case row is persisted)"
    input_set: |
      The AuctionSale identified by request.sale_id; the single ArbitrationPolicy whose
      defect_class equals request.defect_class; and the governing PostSaleInspection for
      the sale, selected as: all PostSaleInspection rows with sale_id == the sale and
      status == COMPLETED, ranked by completed_at_utc DESC then created_at DESC, take the
      first. When that selection is empty there is no PSI effect and
      psi_extension_applied_hours is 0.
    formula: |
      hours_elapsed = round_half_up(
          (claimed_at_utc - AuctionSale.hammer_time_utc) in seconds / 3600, 3)
      miles_driven  = request.odometer_at_claim - AuctionSale.announced_odometer_miles

      psi_extension_applied_hours =
          0                                  when there is no governing PSI
          0                                  when the governing PSI's findings do NOT
                                             contain request.defect_class
          policy.psi_extension_hours         when the governing PSI's findings DO
                                             contain request.defect_class

      effective_window_hours =
          null                                          when policy.window_hours is null
          policy.window_hours + psi_extension_applied_hours   otherwise

      time_ok    = (policy.window_hours is null) OR (hours_elapsed <= effective_window_hours)
      mileage_ok = (policy.mileage_limit is null) OR (miles_driven <= policy.mileage_limit)

      window_eligible = time_ok AND mileage_ok
    constants:
      note: "policy.window_hours == null means an UNLIMITED window (TITLE_BRANDED, TITLE_MISSING); policy.mileage_limit == null means no mileage cap."
    output: "hours_elapsed_at_claim (decimal, 3dp), miles_driven_at_claim (integer), psi_extension_applied_hours (integer), effective_window_hours (integer|null), window_eligible (boolean)"
    error_when_violated: "not time_ok -> ERR_ARBITRATION_WINDOW_EXPIRED; time_ok but not mileage_ok -> ERR_MILEAGE_LIMIT_EXCEEDED"
    note: |
      Combinatorial: the eligibility verdict is the conjunction of an independently
      nullable time dimension and an independently nullable mileage dimension, each of
      which is itself shifted by the PSI dimension. All eight combinations of
      (window_hours null?, mileage_limit null?, PSI extends?) are reachable, and the
      error reported when both dimensions fail is fixed by the time-first order above.
      Boundary: hours_elapsed exactly equal to effective_window_hours is ELIGIBLE, and
      miles_driven exactly equal to mileage_limit is ELIGIBLE (inclusive on both).

  - rule_id: repair_allowance_amount
    name: "Repair allowance amount (negotiated accept vs arbitrator award)"
    algorithm_type: tiered_pricing
    trigger: "POST /arbitration/cases/{id}/negotiation-rounds/{round_id}/accept (variant NEGOTIATED_ACCEPT) and POST /arbitration/cases/{id}/decision with outcome REPAIR_ALLOWANCE (variant ARBITRATOR_AWARD)"
    input_set: |
      The ArbitrationCase, its AuctionSale, its ArbitrationPolicy, the accepted
      NegotiationRound (NEGOTIATED_ACCEPT only), and latest_verified_estimate_cents,
      defined as: the ClaimEvidence rows on the case with verified == true and
      repair_estimate_cents not null, ranked by created_at DESC, take the first
      repair_estimate_cents; 0 when that selection is empty.
    formula: |
      # shared basis
      severity_multiplier_bps = SEVERITY_MULTIPLIER_BPS[AuctionSale.light_channel]

      base_cents =
          max(0, verified_true_mileage - AuctionSale.announced_odometer_miles)
              * MILEAGE_DIMINUTION_CENTS_PER_MILE
                              when ArbitrationCase.defect_class == MILEAGE_DISCREPANCY
          latest_verified_estimate_cents      otherwise

      # verified_true_mileage = the odometer_reading of the ClaimEvidence rows on the
      # case with evidence_type == THIRD_PARTY_VERIFICATION and verified == true and
      # odometer_reading not null, ranked created_at DESC, take the first; when that
      # selection is empty verified_true_mileage = ArbitrationCase.odometer_at_claim.

      cap_cents = round_half_up(AuctionSale.sale_price_cents * policy.max_allowance_bps / 10000)

      computed_award_cents = min(
          round_half_up(base_cents * severity_multiplier_bps / 10000),
          cap_cents)
    variants:
      - variant: NEGOTIATED_ACCEPT
        applies_when: "the buyer accepts an OPEN NegotiationRound"
        formula: |
          allowance_cents = NegotiationRound.seller_offer_cents
          computed_award_cents is still evaluated and stored on the decision for the
          record, but it does NOT bound allowance_cents. A seller may voluntarily offer
          more than the arbitrator formula would award (still bounded at offer time by
          cap_cents via ERR_ALLOWANCE_EXCEEDS_CAP).
      - variant: ARBITRATOR_AWARD
        applies_when: "an Arbitrator issues outcome REPAIR_ALLOWANCE"
        formula: |
          allowance_cents = min(request.requested_allowance_cents, computed_award_cents)
          The arbitrator can never award more than the formula, and never more than
          what was requested.
    constants:
      SEVERITY_MULTIPLIER_BPS: { GREEN: 10000, YELLOW: 8500, RED: 6000 }
      MILEAGE_DIMINUTION_CENTS_PER_MILE: 45
    output: "allowance_cents (integer), computed_award_cents (integer), allowance_variant (enum)"
    error_when_violated: "request.requested_allowance_cents > cap_cents -> ERR_ALLOWANCE_EXCEEDS_CAP; base_cents == 0 for a non-mileage defect -> ERR_THIRD_PARTY_VERIFICATION_REQUIRED"
    note: |
      Dual variant #1 (money domain). On identical case data the two variants diverge
      whenever the seller's offer differs from min(requested, computed_award) — see
      §1.8 rule dual_variant_calc. round_half_up is applied twice on the award path
      (severity product, then the cap) and the min() is taken AFTER both roundings.

  - rule_id: transport_cost_allocation
    name: "Transportation cost allocation across arbitration outcomes"
    algorithm_type: waterfall_allocation
    trigger: "POST /arbitration/cases/{id}/decision (all outcomes) and POST /arbitration/cases/{id}/negotiation-rounds/{round_id}/accept"
    input_set: |
      Every TransportLeg row with case_id == the case, ordered by created_at ASC.
      Legs are never filtered by leg_type — inbound, return and re-delivery legs all
      participate.
    formula: |
      # step 1 — per-leg cost, banded by distance (marginal bands, not average rate)
      leg_band_cost(miles) =
          TRANSPORT_DISPATCH_FEE_CENTS
        + TRANSPORT_TIER1_CENTS_PER_MILE * min(miles, TRANSPORT_TIER1_MILES)
        + TRANSPORT_TIER2_CENTS_PER_MILE * min(max(miles - TRANSPORT_TIER1_MILES, 0),
                                               TRANSPORT_TIER2_MILES)
        + TRANSPORT_TIER3_CENTS_PER_MILE * max(miles - (TRANSPORT_TIER1_MILES
                                               + TRANSPORT_TIER2_MILES), 0)

      # step 2 — allocation profile, keyed by (outcome, fault_party)
      (buyer_bps, seller_bps) = ALLOCATION_BPS[outcome][fault_party]

      # step 3 — PINNED ORDER: round each party's share PER LEG, then sum across legs.
      #          The auction house absorbs the per-leg residual, which MAY be negative.
      for each leg in legs ordered by created_at ASC:
          c            = leg_band_cost(leg.miles)
          buyer_leg    = round_half_up(c * buyer_bps  / 10000)
          seller_leg   = round_half_up(c * seller_bps / 10000)
          auction_leg  = c - buyer_leg - seller_leg          # may be negative

      transport_buyer_share_cents   = sum(buyer_leg   over legs)
      transport_seller_share_cents  = sum(seller_leg  over legs)
      transport_auction_share_cents = sum(auction_leg over legs)
      transport_total_cents         = sum(c over legs)

      # This is NOT the same as rounding the summed total once. Rounding per leg and
      # then summing is normative; sum-then-round is a defect.
    constants:
      TRANSPORT_DISPATCH_FEE_CENTS: 8500
      TRANSPORT_TIER1_MILES: 100
      TRANSPORT_TIER1_CENTS_PER_MILE: 185
      TRANSPORT_TIER2_MILES: 400
      TRANSPORT_TIER2_CENTS_PER_MILE: 155
      TRANSPORT_TIER3_CENTS_PER_MILE: 130
      ALLOCATION_BPS:
        UNWIND:
          SELLER: { buyer: 0, seller: 10000 }
          NONE: { buyer: 5000, seller: 5000 }
          BUYER: { buyer: 10000, seller: 0 }
        REPAIR_ALLOWANCE:
          SELLER: { buyer: 2000, seller: 7000 }
          NONE: { buyer: 2000, seller: 7000 }
          BUYER: { buyer: 2000, seller: 7000 }
        CLAIM_DENIED:
          SELLER: { buyer: 10000, seller: 0 }
          NONE: { buyer: 10000, seller: 0 }
          BUYER: { buyer: 10000, seller: 0 }
        FRIVOLOUS_DENIED:
          SELLER: { buyer: 10000, seller: 0 }
          NONE: { buyer: 10000, seller: 0 }
          BUYER: { buyer: 10000, seller: 0 }
    output: "transport_total_cents, transport_buyer_share_cents, transport_seller_share_cents, transport_auction_share_cents (all integers, stored on ArbitrationDecision)"
    error_when_violated: "n/a — allocation always succeeds; a case with zero legs yields all-zero shares"
    note: |
      For each leg a TRANSPORT_ALLOCATION SettlementLedgerEntry batch is posted in leg
      created_at ASC order: (BUYER, -buyer_leg), (SELLER, -seller_leg),
      (AUCTION, +(buyer_leg + seller_leg)). Each batch sums to exactly 0, which is what
      keeps calculations.sale_ledger_conservation true. Note the deliberate asymmetry:
      the ledger records only transfers BETWEEN parties, so the AUCTION entries total
      buyer_share + seller_share, whereas transport_auction_share_cents is the residual
      the auction house ABSORBS and settles with the carrier outside the sale ledger.
      The two numbers are different by construction and both are asserted. The
      REPAIR_ALLOWANCE profile
      leaves 1000 bps with the auction house in every fault case, so its per-leg
      residual is the interesting one for the rounding-order divergence.

  - rule_id: unwind_payout_totals
    name: "Unwind buyer payout with frivolous-fee offset"
    algorithm_type: waterfall_allocation
    trigger: "POST /arbitration/cases/{id}/decision with outcome == UNWIND"
    input_set: "The ArbitrationCase, its AuctionSale, the claimant Buyer, and the case's TransportLeg rows"
    formula: |
      # ORDER IS PINNED. Steps 3 and 4 both read step 1's output, NOT each other's.
      step 1: sale_price_refund_cents = AuctionSale.sale_price_cents
      step 2: run calculations.transport_cost_allocation -> transport_buyer_share_cents
      step 3: fee_offset_applied_cents = min(Buyer.frivolous_fee_balance_cents,
                                             sale_price_refund_cents)
              # deliberately measured against the GROSS refund of step 1, not against
              # the net after the buyer's transport share. A fee balance larger than the
              # post-transport net therefore offsets more than the net, and
              # total_buyer_payout_cents may be driven negative.
      step 4: total_buyer_payout_cents = sale_price_refund_cents
                                       - transport_buyer_share_cents
                                       - fee_offset_applied_cents
      step 5: Buyer.frivolous_fee_balance_cents -= fee_offset_applied_cents
      step 6: when the balance reached 0 and Buyer.frivolous_claim_count <
              FRIVOLOUS_SUSPENSION_COUNT: Buyer.claim_privilege_status FEE_HOLD -> ACTIVE
    constants:
      note: "no numeric constants of its own; consumes transport_cost_allocation and frivolous_fee_assessment outputs"
    output: "sale_price_refund_cents, fee_offset_applied_cents, total_buyer_payout_cents (all integers, stored on ArbitrationDecision)"
    error_when_violated: "n/a"
    note: |
      Circular-looking but strictly ordered: the fee offset appears to depend on the net
      payout and the net payout appears to depend on the fee offset. The pinned reading
      (offset from the gross of step 1) resolves it. Implementing the intuitive
      alternative (offset = min(balance, refund - transport_buyer_share)) yields a
      different fee_offset_applied_cents and a different residual balance whenever
      balance > refund - transport_buyer_share.

  - rule_id: seller_arbitration_rate
    name: "Seller arbitration rate and policy tier"
    algorithm_type: aggregation
    trigger: "recomputed whenever an upheld ArbitrationDecision is created (outcome IN {UNWIND, REPAIR_ALLOWANCE}); read by GET /arbitration/sellers/{id}/scorecard"
    input_set: |
      All AuctionSale rows with seller_id == the seller, and all ArbitrationDecision
      rows whose case's sale belongs to the seller and whose outcome IN
      {UNWIND, REPAIR_ALLOWANCE}. Decisions with outcome CLAIM_DENIED or
      FRIVOLOUS_DENIED are excluded from both variants.
    formula: |
      now = current logical clock
      window_start = now - SCORECARD_WINDOW_DAYS days

      rate_bps(upheld, sales) = 0 if sales == 0
                                else round_half_up(10000 * upheld / sales)

      # tiering reads the ROLLING variant only
      policy_tier =
          policy_tier unchanged (BLOCKED is sticky) when current tier == BLOCKED
          GOOD_STANDING            when rolling_window_sales_count < MIN_SCORECARD_SALES
          BLOCKED                  when rolling_arbitration_rate_bps >= TIER_BLOCK_BPS
          PROBATION                when rolling_arbitration_rate_bps >= TIER_PROBATION_BPS
          WATCH                    when rolling_arbitration_rate_bps >= TIER_WATCH_BPS
          GOOD_STANDING            otherwise
    variants:
      - variant: ROLLING_90_DAY
        applies_when: "always computed; drives policy_tier and the settlement-hold cascade"
        formula: |
          rolling_window_sales_count  = count(sales where hammer_time_utc > window_start
                                                    AND hammer_time_utc <= now)
          rolling_window_upheld_count = count(upheld decisions where decided_at_utc > window_start
                                                    AND decided_at_utc <= now)
          rolling_arbitration_rate_bps = rate_bps(rolling_window_upheld_count,
                                                  rolling_window_sales_count)
          # window is half-open on the left (strictly after window_start) and inclusive
          # on the right. A sale whose hammer_time_utc equals window_start exactly is
          # OUT of the window.
      - variant: LIFETIME
        applies_when: "always computed; reported on the scorecard, never used for tiering"
        formula: |
          lifetime_sales_count  = count(all sales of the seller)
          lifetime_upheld_count = count(all upheld decisions of the seller)
          lifetime_arbitration_rate_bps = rate_bps(lifetime_upheld_count,
                                                   lifetime_sales_count)
    constants:
      SCORECARD_WINDOW_DAYS: 90
      MIN_SCORECARD_SALES: 4
      TIER_WATCH_BPS: 800
      TIER_PROBATION_BPS: 1500
      TIER_BLOCK_BPS: 2500
    output: "rolling_window_sales_count, rolling_window_upheld_count, rolling_arbitration_rate_bps, lifetime_sales_count, lifetime_upheld_count, lifetime_arbitration_rate_bps, policy_tier"
    error_when_violated: "n/a — a BLOCKED seller's sales are refused at settle time via ERR_SELLER_BLOCKED"
    note: |
      Dual variant #2 (risk domain, structurally unrelated to repair_allowance_amount).
      The two variants diverge whenever the seller has any sale or upheld decision
      outside the 90-day window. Only ROLLING_90_DAY may move the tier, so a seller
      with a terrible lifetime rate and a clean recent quarter stays GOOD_STANDING.
      The MIN_SCORECARD_SALES gate is itself a threshold: with 3 in-window sales and
      1 upheld the rate is 3333 bps yet the tier remains GOOD_STANDING.

  - rule_id: frivolous_fee_assessment
    name: "Escalating frivolous-claim fee and buyer privilege consequence"
    algorithm_type: threshold
    trigger: "POST /arbitration/cases/{id}/decision with outcome == FRIVOLOUS_DENIED"
    input_set: "The claimant Buyer; prior_frivolous_count = Buyer.frivolous_claim_count as read BEFORE this assessment"
    formula: |
      fee_cents = min(FRIVOLOUS_FEE_BASE_CENTS * (1 + prior_frivolous_count),
                      FRIVOLOUS_FEE_CAP_CENTS)

      # then, with the incremented count
      new_count = prior_frivolous_count + 1
      new_balance = Buyer.frivolous_fee_balance_cents + fee_cents

      claim_privilege_status =
          SUSPENDED   when new_count >= FRIVOLOUS_SUSPENSION_COUNT
          FEE_HOLD    when new_balance > 0
          ACTIVE      otherwise
    constants:
      FRIVOLOUS_FEE_BASE_CENTS: 25000
      FRIVOLOUS_FEE_CAP_CENTS: 60000
      FRIVOLOUS_SUSPENSION_COUNT: 3
    output: "fee_cents (integer), assessed_sequence (integer = new_count), Buyer.frivolous_claim_count, Buyer.frivolous_fee_balance_cents, Buyer.claim_privilege_status"
    error_when_violated: "n/a at assessment time; a SUSPENDED buyer's later POST /arbitration/cases is refused with ERR_BUYER_PRIVILEGE_SUSPENDED"
    note: |
      Ladder is 25000, then 50000, then 60000 — the third assessment is the first one
      clipped by the cap (25000 * 3 = 75000 is cut to 60000). The cap is deliberately
      set below the third rung so that it is observable before the suspension threshold
      makes further assessments unreachable: the same third assessment both exercises
      the cap and pushes the buyer to SUSPENDED, and a SUSPENDED buyer can file no
      further claims, so no fourth assessment can ever exist. The buyer stays SUSPENDED
      even after the balance is paid down to 0.

  - rule_id: sale_ledger_conservation
    name: "Sale ledger conservation invariant"
    algorithm_type: aggregation
    trigger: "must hold after every request that writes SettlementLedgerEntry rows"
    input_set: "All SettlementLedgerEntry rows with sale_id == a given AuctionSale"
    formula: |
      INVARIANT L1: sum(amount_signed_cents) over all entries of a sale == 0
                    at every observable point in time.

      Every posting is a balanced batch:
        SALE_PROCEEDS            (SELLER +P, BUYER -P)
        SALE_PROCEEDS_REVERSAL   (BUYER  +P, SELLER -P)
        REPAIR_ALLOWANCE         (BUYER  +A, SELLER -A)
        TRANSPORT_ALLOCATION     (BUYER -b, SELLER -s, AUCTION +(b+s)) per leg
        FRIVOLOUS_FEE_ASSESSED   (BUYER  -F, AUCTION +F)
        FRIVOLOUS_FEE_OFFSET     (BUYER  -O, AUCTION +O)

      INVARIANT L2 (compensation, no drift): settle a sale, then unwind it, and the
      per-party net over the SALE_PROCEEDS and SALE_PROCEEDS_REVERSAL entry_types is
      exactly 0 for BOTH the buyer and the seller — not merely 0 in aggregate.
    constants:
      note: "no constants"
    output: "boolean invariant; observable via GET /arbitration/sales/{id}/ledger-entries"
    error_when_violated: "n/a — a violation is an implementation defect, not a client-visible error"
    note: |
      Rule 9 compensating invariant #1. The forward operation (settle) and the
      compensating operation (unwind) are on different endpoints with different actors,
      and the reversal is CONDITIONAL on the prior settlement_status, which is exactly
      where a naive implementation drifts: unwinding an UNSETTLED sale must post no
      reversal rows at all, or L1 breaks by 2P.

  - rule_id: open_claim_counter_invariant
    name: "Open-claim counter invariant"
    algorithm_type: aggregation
    trigger: "must hold after every request that changes an ArbitrationCase.status"
    input_set: "All ArbitrationCase rows, grouped by claimant_buyer_id / by the seller of their sale / by sale_id"
    formula: |
      OPEN = status NOT IN {RESOLVED_ALLOWANCE, UNWOUND, DENIED, WITHDRAWN, EXPIRED}

      INVARIANT C1: Buyer.open_claim_count  == count(cases where claimant_buyer_id == buyer.id AND OPEN)
      INVARIANT C2: Seller.open_claim_count == count(cases whose sale.seller_id == seller.id AND OPEN)
      INVARIANT C3: AuctionSale.open_case_count == count(cases where sale_id == sale.id AND OPEN)
      INVARIANT C4: when AuctionSale.open_case_count == 0 AND no ArbitrationDecision
                    exists on any of the sale's cases, AuctionSale.arbitration_status == NONE
    constants:
      note: "no constants"
    output: "boolean invariant; observable via GET /arbitration/buyers/{id}, GET /arbitration/sellers/{id}, GET /arbitration/sales/{id}"
    error_when_violated: "n/a — a violation is an implementation defect"
    note: |
      Rule 9 compensating invariant #2, structurally different from
      sale_ledger_conservation (integer counters on three different parents rather
      than a signed-sum ledger). File a claim then withdraw it and all four invariants
      return to their pre-claim values, INCLUDING the sale's arbitration_status
      reverting from ACTIVE to NONE. Sweep-driven EXPIRED must decrement identically
      to the operator-driven WITHDRAWN path.

  - rule_id: sweep_processing
    name: "Deterministic sweep phase ordering"
    algorithm_type: chronological
    trigger: "POST /_ops/run-arbitration-sweep"
    input_set: "All PostSaleInspection, NegotiationRound and ArbitrationCase rows whose deadline has passed relative to the current logical clock"
    formula: |
      The sweep runs four phases, in this fixed order, and within each phase processes
      rows in created_at ASC order:

        phase 1: PostSaleInspection REQUESTED, now >= window_end_utc      -> EXPIRED
        phase 2: NegotiationRound OPEN, now > response_deadline_utc       -> EXPIRED
                 (parent case NEGOTIATION -> ARBITRATOR_REVIEW, fault_party = BUYER)
        phase 3: ArbitrationCase UNDER_REVIEW, now > review_opened_at_utc
                 + policy.seller_response_hours                          -> ARBITRATOR_REVIEW
                 (TIMEOUT round created, seller_response_timed_out = true,
                  fault_party = SELLER)
        phase 4: ArbitrationCase SUBMITTED, now > claimed_at_utc
                 + INTAKE_GRACE_HOURS                                    -> EXPIRED

      Phase boundaries are inclusive for PSI (now >= window_end_utc expires) and
      exclusive for every deadline expressed with `>` (now == deadline does NOT expire).
      The sweep is idempotent: a second call with the clock unchanged returns all-zero
      counters.
    constants:
      PSI_REQUEST_TTL_HOURS: 72
      ROUND_RESPONSE_HOURS: 48
      ROUND_COOLDOWN_HOURS: 2
      MAX_NEGOTIATION_ROUNDS: 3
      INTAKE_GRACE_HOURS: 48
      DEFAULT_SELLER_RESPONSE_HOURS: 24
      PSI_FEE_STANDARD_CENTS: 12500
      PSI_FEE_PREMIUM_CENTS: 27500
    output: "{ inspections_expired, rounds_expired, seller_response_timeouts, cases_expired } (all integers)"
    error_when_violated: "n/a"
    note: |
      Phase 2 runs before phase 3 so that a case whose OPEN round has lapsed is
      attributed to the BUYER, not to a seller response timeout — the ordering is
      observable in ArbitrationCase.fault_party.

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:

  # --- 1. Authentication -----------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role header is present and non-blank"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-ID header is present and non-blank"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  # --- 3. Authorization ------------------------------------------------------
  - priority: 3
    category: auth
    check: "X-User-Role is one of the roles listed for the endpoint in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  # --- 4. Schema -------------------------------------------------------------
  - priority: 4
    category: existence
    check: "request body parses, all required input fields are present and non-null, enum values are members of their declared enum, integer fields are integers, cents fields are >= 0, ISO-8601 datetime fields parse as instants"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  # --- 5..10 Path existence, validated left-to-right -------------------------
  - priority: 5
    category: existence
    check: "the {id} path segment of a /arbitration/sales/... route resolves to an AuctionSale"
    error_id: ERR_SALE_NOT_FOUND
    http_status: 404
    applies_to: "POST /arbitration/sales/{id}/announcements, POST /arbitration/sales/{id}/settle, GET /arbitration/sales/{id}, GET /arbitration/sales/{id}/announcements, GET /arbitration/sales/{id}/post-sale-inspections, GET /arbitration/sales/{id}/ledger-entries"

  - priority: 6
    category: existence
    check: "the {id} path segment of a /arbitration/cases/... route resolves to an ArbitrationCase"
    error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    applies_to: "all POST and GET routes under /arbitration/cases/{id}"

  - priority: 7
    category: existence
    check: "the {round_id} path segment resolves to a NegotiationRound whose case_id equals the {id} path segment"
    error_id: ERR_ROUND_NOT_FOUND
    http_status: 404
    applies_to: "POST /arbitration/cases/{id}/negotiation-rounds/{round_id}/counter, POST /arbitration/cases/{id}/negotiation-rounds/{round_id}/accept"

  - priority: 8
    category: existence
    check: "the {id} path segment of a /arbitration/sellers/... route resolves to a Seller"
    error_id: ERR_SELLER_NOT_FOUND
    http_status: 404
    applies_to: "POST /arbitration/sellers/{id}/reinstate, GET /arbitration/sellers/{id}, GET /arbitration/sellers/{id}/policy-actions, GET /arbitration/sellers/{id}/scorecard"

  - priority: 9
    category: existence
    check: "the {id} path segment of a /arbitration/buyers/... route resolves to a Buyer"
    error_id: ERR_BUYER_NOT_FOUND
    http_status: 404
    applies_to: "POST /arbitration/buyers/{id}/fee-payments, GET /arbitration/buyers/{id}, GET /arbitration/buyers/{id}/frivolous-fees"

  - priority: 10
    category: existence
    check: "the {id} path segment of a /arbitration/post-sale-inspections/... route resolves to a PostSaleInspection"
    error_id: ERR_INSPECTION_NOT_FOUND
    http_status: 404
    applies_to: "POST /arbitration/post-sale-inspections/{id}/complete"

  # --- 11..15 Body FK existence ---------------------------------------------
  - priority: 11
    category: existence
    check: "request.seller_id resolves to a Seller"
    error_id: ERR_SELLER_NOT_FOUND
    http_status: 404
    applies_to: "POST /arbitration/sales"

  - priority: 12
    category: existence
    check: "request.buyer_id resolves to a Buyer"
    error_id: ERR_BUYER_NOT_FOUND
    http_status: 404
    applies_to: "POST /arbitration/sales"

  - priority: 13
    category: existence
    check: "request.sale_id resolves to an AuctionSale"
    error_id: ERR_SALE_NOT_FOUND
    http_status: 404
    applies_to: "POST /arbitration/cases, POST /arbitration/post-sale-inspections"

  - priority: 14
    category: existence
    check: "exactly one ArbitrationPolicy has defect_class == request.defect_class"
    error_id: ERR_POLICY_NOT_FOUND
    http_status: 404
    applies_to: "POST /arbitration/cases"

  - priority: 15
    category: existence
    check: "when request.superseded_case_id is supplied it resolves to an ArbitrationCase"
    error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    applies_to: "POST /arbitration/cases"

  # --- 16..19 Ownership and segregation of duties ---------------------------
  - priority: 16
    category: state
    check: "for a BuyerRep acting on a sale, X-User-ID equals AuctionSale.buyer_id"
    error_id: ERR_NOT_SALE_BUYER
    http_status: 403
    applies_to: "POST /arbitration/cases, POST /arbitration/post-sale-inspections"

  - priority: 17
    category: state
    check: "for a BuyerRep acting on a case, X-User-ID equals ArbitrationCase.claimant_buyer_id"
    error_id: ERR_NOT_CASE_OWNER
    http_status: 403
    applies_to: "POST /arbitration/cases/{id}/evidence, POST /arbitration/cases/{id}/withdraw, POST /arbitration/cases/{id}/negotiation-rounds/{round_id}/counter, POST /arbitration/cases/{id}/negotiation-rounds/{round_id}/accept"

  - priority: 18
    category: state
    check: "for a SellerRep acting on a case, X-User-ID equals the seller_id of the case's AuctionSale"
    error_id: ERR_NOT_SALE_SELLER
    http_status: 403
    applies_to: "POST /arbitration/cases/{id}/seller-response"

  - priority: 19
    category: state
    check: "the Arbitrator issuing a decision is not the Arbitrator who opened the review: X-User-ID != ArbitrationCase.intake_arbitrator_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /arbitration/cases/{id}/decision"

  # --- 20..21 Optimistic concurrency ---------------------------------------
  - priority: 20
    category: state
    check: "request.expected_case_version equals the current ArbitrationCase.version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /arbitration/cases/{id}/transport-legs"

  - priority: 21
    category: state
    check: "request.expected_buyer_version equals the current Buyer.version"
    error_id: ERR_STALE_BUYER_VERSION
    http_status: 412
    applies_to: "POST /arbitration/buyers/{id}/fee-payments"

  # --- 22..28 State preconditions ------------------------------------------
  - priority: 22
    category: state
    check: "the ArbitrationCase is in a status from which the requested transition is declared in §1.2; for the two append-only routes POST /arbitration/cases/{id}/evidence and POST /arbitration/cases/{id}/transport-legs the permitted statuses are the five non-terminal ones {SUBMITTED, UNDER_REVIEW, NEGOTIATION, COUNTERED, ARBITRATOR_REVIEW}"
    error_id: ERR_INVALID_CASE_STATE
    http_status: 409
    applies_to: "POST /arbitration/cases/{id}/open-review, POST /arbitration/cases/{id}/seller-response, POST /arbitration/cases/{id}/escalate, POST /arbitration/cases/{id}/decision, POST /arbitration/cases/{id}/withdraw, POST /arbitration/cases/{id}/evidence, POST /arbitration/cases/{id}/transport-legs, POST /arbitration/cases/{id}/negotiation-rounds/{round_id}/counter, POST /arbitration/cases/{id}/negotiation-rounds/{round_id}/accept"

  - priority: 23
    category: state
    check: "the NegotiationRound status is OPEN"
    error_id: ERR_INVALID_ROUND_STATE
    http_status: 409
    applies_to: "POST /arbitration/cases/{id}/negotiation-rounds/{round_id}/counter, POST /arbitration/cases/{id}/negotiation-rounds/{round_id}/accept"

  - priority: 24
    category: state
    check: "the PostSaleInspection status is REQUESTED"
    error_id: ERR_INVALID_INSPECTION_STATE
    http_status: 409
    applies_to: "POST /arbitration/post-sale-inspections/{id}/complete"

  - priority: 25
    category: state
    check: "the AuctionSale settlement_status is UNSETTLED"
    error_id: ERR_SALE_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /arbitration/sales/{id}/settle, POST /arbitration/post-sale-inspections"

  - priority: 26
    category: state
    check: "the Seller policy_tier is BLOCKED"
    error_id: ERR_SELLER_NOT_BLOCKED
    http_status: 409
    applies_to: "POST /arbitration/sellers/{id}/reinstate"

  - priority: 27
    category: state
    check: "the acting Buyer's claim_privilege_status is not SUSPENDED"
    error_id: ERR_BUYER_PRIVILEGE_SUSPENDED
    http_status: 409
    applies_to: "POST /arbitration/cases"
    note: "Rule 5 conflict pair A, higher-priority member: a SUSPENDED buyer filing a time-barred claim receives THIS error, not ERR_ARBITRATION_WINDOW_EXPIRED (priority 33). Rule 5 conflict pair C interacts here too: this rule also outranks ERR_CLAIM_BELOW_MINIMUM (priority 46)."

  - priority: 28
    category: state
    check: "the acting Buyer's claim_privilege_status is ACTIVE (no outstanding frivolous-fee balance)"
    error_id: ERR_BUYER_FEE_HOLD
    http_status: 409
    applies_to: "POST /arbitration/post-sale-inspections"
    note: "Stricter than priority 27: a post-sale inspection is a paid privilege, so FEE_HOLD alone blocks it while a claim is still permitted."

  # --- 29..31 Business rules: safety / compliance --------------------------
  - priority: 29
    category: business_safety
    check: "the Seller of the sale is not BLOCKED and the sale has settlement_hold == false"
    error_id: ERR_SELLER_BLOCKED
    http_status: 409
    applies_to: "POST /arbitration/sales/{id}/settle"

  - priority: 30
    category: business_safety
    check: "no SaleAnnouncement on the sale has defect_class == request.defect_class; the sole exemption is defect_class == TITLE_MISSING, which is claimable even when announced"
    error_id: ERR_DEFECT_ANNOUNCED
    http_status: 409
    applies_to: "POST /arbitration/cases"
    note: "Conditional validation: the rule's applicability depends on the claimed defect_class itself."

  - priority: 31
    category: business_safety
    check: "the governing COMPLETED PostSaleInspection has not waived arbitration rights for this defect_class: not (policy.psi_clean_waives_rights == true AND request.defect_class NOT IN the governing PSI's findings)"
    error_id: ERR_PSI_WAIVED_RIGHTS
    http_status: 409
    applies_to: "POST /arbitration/cases"
    note: "Cross-entity + conditional: needs the governing-PSI selector from calculations.arbitration_window_evaluation AND the policy flag."

  # --- 32..37 Business rules: temporal ------------------------------------
  - priority: 32
    category: business_temporal
    check: "the requested PSI interval [now, now + PSI_REQUEST_TTL_HOURS) does not overlap the interval of any REQUESTED PostSaleInspection on the same sale; touching at exactly window_end_utc is permitted"
    error_id: ERR_PSI_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /arbitration/post-sale-inspections"

  - priority: 33
    category: business_temporal
    check: "policy.window_hours is null OR hours_elapsed <= effective_window_hours per calculations.arbitration_window_evaluation"
    error_id: ERR_ARBITRATION_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /arbitration/cases"
    note: "Rule 5 conflict pair A, lower-priority member (loses to priority 27). Rule 5 conflict pair C, higher-priority member (beats ERR_CLAIM_BELOW_MINIMUM at priority 46)."

  - priority: 34
    category: business_temporal
    check: "policy.mileage_limit is null OR miles_driven <= policy.mileage_limit"
    error_id: ERR_MILEAGE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /arbitration/cases"
    note: "Deliberately below priority 33: a claim that busts BOTH the clock and the odometer reports the time error."

  - priority: 35
    category: business_temporal
    check: "no NegotiationRound on the case is COUNTERED with cooldown_until_utc >= the current logical clock; a new round at exactly cooldown_until_utc is REJECTED (closed interval), only strictly after is permitted"
    error_id: ERR_ROUND_COOLDOWN_ACTIVE
    http_status: 409
    applies_to: "POST /arbitration/cases/{id}/seller-response"

  - priority: 36
    category: business_temporal
    check: "the current logical clock is <= NegotiationRound.response_deadline_utc; exactly equal is still in time"
    error_id: ERR_ROUND_EXPIRED
    http_status: 409
    applies_to: "POST /arbitration/cases/{id}/negotiation-rounds/{round_id}/counter, POST /arbitration/cases/{id}/negotiation-rounds/{round_id}/accept"

  - priority: 37
    category: business_temporal
    check: "request.to_iso8601 is >= the current logical clock — the logical clock may only advance or stay put"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 409
    applies_to: "POST /_clock/set_current_utc"

  # --- 38..41 Business rules: constraint satisfaction / uniqueness ---------
  - priority: 38
    category: business_constraint
    check: "no existing Seller or Buyer has the same dealer_license_no"
    error_id: ERR_DUPLICATE_DEALER_LICENSE
    http_status: 409
    applies_to: "POST /arbitration/sellers, POST /arbitration/buyers"

  - priority: 39
    category: business_constraint
    check: "no existing ArbitrationPolicy has the same defect_class"
    error_id: ERR_DUPLICATE_POLICY_DEFECT_CLASS
    http_status: 409
    applies_to: "POST /arbitration/policies"

  - priority: 40
    category: business_constraint
    check: "no ArbitrationCase on the same sale_id with the same defect_class is in a non-terminal status"
    error_id: ERR_DUPLICATE_OPEN_CLAIM
    http_status: 409
    applies_to: "POST /arbitration/cases"
    note: "Aggregate validation: the sale may legitimately carry several open cases, just not two for the same defect_class."

  - priority: 41
    category: business_constraint
    check: "ArbitrationCase.current_round_index >= MAX_NEGOTIATION_ROUNDS OR seller_response_timed_out == true"
    error_id: ERR_NEGOTIATION_NOT_EXHAUSTED
    http_status: 409
    applies_to: "POST /arbitration/cases/{id}/escalate"

  # --- 42 Business rule: mandatory-unwind safety --------------------------
  - priority: 42
    category: business_safety
    check: "an allowance or denial outcome is only permitted when the seller has not conceded an unwind and the policy allows an allowance: seller_conceded == false AND (outcome != REPAIR_ALLOWANCE OR policy.max_allowance_bps > 0)"
    error_id: ERR_UNWIND_MANDATORY
    http_status: 409
    applies_to: "POST /arbitration/cases/{id}/decision"
    note: "Rule 5 conflict pair B, higher-priority member: a decision that both violates the mandatory unwind AND over-caps the allowance reports THIS error, not ERR_ALLOWANCE_EXCEEDS_CAP (priority 47). Placed above the referential and fiscal groups because releasing a vehicle whose title is branded or missing is a compliance failure, whereas an over-cap award is merely an arithmetic one."

  # --- 43..45 Business rules: referential / evidence sufficiency -----------
  - priority: 43
    category: business_referential
    check: "for a non-title defect_class, at least one ClaimEvidence on the case has evidence_type == INSPECTION_REPORT"
    error_id: ERR_MISSING_INSPECTION_REPORT
    http_status: 422
    applies_to: "POST /arbitration/cases/{id}/open-review"

  - priority: 44
    category: business_referential
    check: "for defect_class IN {TITLE_BRANDED, TITLE_MISSING}, at least one ClaimEvidence on the case has evidence_type == TITLE_DOCUMENT"
    error_id: ERR_TITLE_CLAIM_REQUIRES_TITLE_EVIDENCE
    http_status: 422
    applies_to: "POST /arbitration/cases/{id}/open-review"

  - priority: 45
    category: business_referential
    check: "when policy.requires_third_party_verification == true, at least one ClaimEvidence on the case has evidence_type == THIRD_PARTY_VERIFICATION AND verified == true; and at decision time an ARBITRATOR_AWARD for a non-mileage defect requires a verified repair estimate (base_cents > 0)"
    error_id: ERR_THIRD_PARTY_VERIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /arbitration/cases/{id}/open-review, POST /arbitration/cases/{id}/decision"

  # --- 46..48 Business rules: fiscal (last) -------------------------------
  - priority: 46
    category: business_fiscal
    check: "request.claim_amount_cents >= policy.min_claim_amount_cents"
    error_id: ERR_CLAIM_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /arbitration/cases"
    note: "Rule 5 conflict pair C, lower-priority member: loses to ERR_ARBITRATION_WINDOW_EXPIRED (priority 33)."

  - priority: 47
    category: business_fiscal
    check: "the offered or requested allowance does not exceed round_half_up(AuctionSale.sale_price_cents * policy.max_allowance_bps / 10000)"
    error_id: ERR_ALLOWANCE_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /arbitration/cases/{id}/seller-response, POST /arbitration/cases/{id}/decision"
    note: "Rule 5 conflict pair B, lower-priority member: loses to ERR_UNWIND_MANDATORY (priority 42)."

  - priority: 48
    category: business_fiscal
    check: "request.amount_cents <= Buyer.frivolous_fee_balance_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /arbitration/buyers/{id}/fee-payments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Registry: sellers, buyers, policies -----------------------------------
  - method: POST
    path: "/arbitration/sellers"
    description: "Register a consigning seller (dealer or fleet consignor) in the arbitration registry."
    roles: [AuctionAdmin]
    code: 201
    input: [name, dealer_license_no]
    output: Seller
    side_effects:
      - "creates Seller with policy_tier GOOD_STANDING, all counters 0, all rate_bps 0"
      - "rejects a duplicate dealer_license_no across Seller and Buyer with ERR_DUPLICATE_DEALER_LICENSE"

  - method: GET
    path: "/arbitration/sellers/{id}"
    description: "Read a seller, including its live policy tier and arbitration counters."
    roles: [AuctionAdmin, BlockClerk, Arbitrator, Inspector, BuyerRep, SellerRep]
    code: 200
    input: []
    output: Seller
    side_effects: []

  - method: POST
    path: "/arbitration/buyers"
    description: "Register a buying dealer in the arbitration registry."
    roles: [AuctionAdmin]
    code: 201
    input: [name, dealer_license_no]
    output: Buyer
    side_effects:
      - "creates Buyer with claim_privilege_status ACTIVE, frivolous_fee_balance_cents 0, all counters 0"
      - "rejects a duplicate dealer_license_no across Seller and Buyer with ERR_DUPLICATE_DEALER_LICENSE"

  - method: GET
    path: "/arbitration/buyers/{id}"
    description: "Read a buyer, including claim privilege status and outstanding frivolous-fee balance."
    roles: [AuctionAdmin, BlockClerk, Arbitrator, Inspector, BuyerRep, SellerRep]
    code: 200
    input: []
    output: Buyer
    side_effects: []

  - method: POST
    path: "/arbitration/policies"
    description: "Publish the arbitration policy for one defect class: its window, mileage limit, evidence requirements, allowance cap and post-sale-inspection interaction."
    roles: [AuctionAdmin]
    code: 201
    input: [defect_class, min_claim_amount_cents, requires_third_party_verification, max_allowance_bps, psi_extension_hours, psi_clean_waives_rights, "window_hours?", "mileage_limit?", "seller_response_hours?"]
    output: ArbitrationPolicy
    side_effects:
      - "creates ArbitrationPolicy at version 1"
      - "omitting window_hours stores null, meaning an UNLIMITED arbitration window (used for TITLE_BRANDED and TITLE_MISSING)"
      - "omitting mileage_limit stores null, meaning no mileage cap"
      - "omitting seller_response_hours stores DEFAULT_SELLER_RESPONSE_HOURS = 24"
      - "rejects a second policy for the same defect_class with ERR_DUPLICATE_POLICY_DEFECT_CLASS"

  - method: GET
    path: "/arbitration/policies/{id}"
    description: "Read one arbitration policy."
    roles: [AuctionAdmin, BlockClerk, Arbitrator, Inspector, BuyerRep, SellerRep]
    code: 200
    input: []
    output: ArbitrationPolicy
    side_effects: []

  # --- Sales and block announcements ---------------------------------------
  - method: POST
    path: "/arbitration/sales"
    description: "Record a vehicle sold across the block: hammer time, price, announced odometer, light channel and title status."
    roles: [BlockClerk]
    code: 201
    input: [vin, seller_id, buyer_id, sale_price_cents, hammer_time_utc, announced_odometer_miles, light_channel, title_status]
    output: AuctionSale
    side_effects:
      - "creates AuctionSale with settlement_status UNSETTLED, arbitration_status NONE, settlement_hold false, open_case_count 0"
      - "the sale immediately counts toward calculations.seller_arbitration_rate for the seller"

  - method: GET
    path: "/arbitration/sales/{id}"
    description: "Read one sale, including its settlement and arbitration dimensions."
    roles: [AuctionAdmin, BlockClerk, Arbitrator, Inspector, BuyerRep, SellerRep]
    code: 200
    input: []
    output: AuctionSale
    side_effects: []

  - method: GET
    path: "/arbitration/sales"
    description: "List sales, filterable by seller, by buyer and by settlement status."
    roles: [AuctionAdmin, BlockClerk, Arbitrator, Inspector, BuyerRep, SellerRep]
    code: 200
    input: ["seller_id?", "buyer_id?", "settlement_status?", "limit?", "offset?"]
    output: AuctionSale[]
    side_effects: []

  - method: POST
    path: "/arbitration/sales/{id}/announcements"
    description: "Record a condition announcement made at the block. An announced defect class removes that class from arbitration, except for a missing title."
    roles: [BlockClerk]
    code: 201
    input: [defect_class, disclosure_text]
    output: SaleAnnouncement
    side_effects:
      - "creates an immutable SaleAnnouncement bound to the sale"
      - "bars a later ArbitrationCase for the same defect_class with ERR_DEFECT_ANNOUNCED, unless that class is TITLE_MISSING"

  - method: GET
    path: "/arbitration/sales/{id}/announcements"
    description: "List every condition announcement made on a sale."
    roles: [AuctionAdmin, BlockClerk, Arbitrator, Inspector, BuyerRep, SellerRep]
    code: 200
    input: []
    output: SaleAnnouncement[]
    side_effects: []

  - method: POST
    path: "/arbitration/sales/{id}/settle"
    description: "Release sale proceeds to the seller. Refused while the seller is blocked or the sale carries a settlement hold; permitted even while arbitration is active."
    roles: [AuctionAdmin]
    code: 200
    input: []
    output: AuctionSale
    side_effects:
      - "AuctionSale.settlement_status UNSETTLED -> SETTLED; settled_at_utc = the current logical clock"
      - "posts a balanced SALE_PROCEEDS SettlementLedgerEntry pair: (SELLER, +sale_price_cents) and (BUYER, -sale_price_cents), both with case_id null"
      - "increments AuctionSale.version by 1"
      - "forward half of calculations.sale_ledger_conservation"

  - method: GET
    path: "/arbitration/sales/{id}/ledger-entries"
    description: "List every settlement ledger entry posted against a sale, in created_at ASC order. Their signed amounts always sum to zero."
    roles: [AuctionAdmin, BlockClerk, Arbitrator, Inspector, BuyerRep, SellerRep]
    code: 200
    input: []
    output: SettlementLedgerEntry[]
    side_effects: []

  # --- Post-sale inspection programme --------------------------------------
  - method: POST
    path: "/arbitration/post-sale-inspections"
    description: "Buy a post-sale inspection on an unsettled purchase. The inspection window is exclusive per sale and its findings later extend or waive arbitration rights."
    roles: [BuyerRep]
    code: 201
    input: [sale_id, program_tier]
    output: PostSaleInspection
    side_effects:
      - "creates PostSaleInspection with status REQUESTED, requested_at_utc = the current logical clock, window_end_utc = requested_at_utc + PSI_REQUEST_TTL_HOURS (72h)"
      - "fee_cents = PSI_FEE_STANDARD_CENTS (12500) for program_tier STANDARD, PSI_FEE_PREMIUM_CENTS (27500) for PREMIUM"
      - "rejects an overlap with another REQUESTED inspection on the same sale with ERR_PSI_WINDOW_OVERLAP; a request starting exactly at the incumbent's window_end_utc is accepted"

  - method: POST
    path: "/arbitration/post-sale-inspections/{id}/complete"
    description: "File the inspection findings. An empty findings list is a clean inspection and may waive arbitration rights for classes whose policy says so."
    roles: [Inspector]
    code: 200
    input: [findings]
    output: PostSaleInspection
    side_effects:
      - "PostSaleInspection.status REQUESTED -> COMPLETED; completed_at_utc = the current logical clock; findings stored (possibly empty)"
      - "increments PostSaleInspection.version by 1"
      - "changes the arbitration rights of every later ArbitrationCase on the sale via calculations.arbitration_window_evaluation: a finding matching the claimed defect_class adds policy.psi_extension_hours to the window; a clean inspection under a psi_clean_waives_rights policy triggers ERR_PSI_WAIVED_RIGHTS"

  - method: GET
    path: "/arbitration/sales/{id}/post-sale-inspections"
    description: "List every post-sale inspection requested on a sale, in created_at ASC order."
    roles: [AuctionAdmin, BlockClerk, Arbitrator, Inspector, BuyerRep, SellerRep]
    code: 200
    input: []
    output: PostSaleInspection[]
    side_effects: []

  # --- Claim intake and evidence -------------------------------------------
  - method: POST
    path: "/arbitration/cases"
    description: "File an arbitration claim against a purchase. Runs the full window, mileage, announcement and post-sale-inspection gauntlet before the case exists."
    roles: [BuyerRep]
    code: 201
    input: [sale_id, defect_class, claim_amount_cents, odometer_at_claim, complaint_text, "superseded_case_id?"]
    output: ArbitrationCase
    side_effects:
      - "creates ArbitrationCase with status SUBMITTED, claimed_at_utc = the current logical clock, current_round_index 0, seller_conceded false, seller_response_timed_out false, fault_party NONE"
      - "resolves and stores claimant_buyer_id, policy_id and policy_version_at_intake"
      - "stores the outputs of calculations.arbitration_window_evaluation: hours_elapsed_at_claim, miles_driven_at_claim, psi_extension_applied_hours, effective_window_hours, window_eligible"
      - "AuctionSale.arbitration_status NONE -> ACTIVE; AuctionSale.open_case_count += 1; increments AuctionSale.version by 1"
      - "Buyer.open_claim_count += 1; Buyer.lifetime_claim_count += 1; increments Buyer.version by 1"
      - "Seller.open_claim_count += 1; increments Seller.version by 1"

  - method: GET
    path: "/arbitration/cases/{id}"
    description: "Read one arbitration case with its stored window evaluation and negotiation cursor."
    roles: [AuctionAdmin, BlockClerk, Arbitrator, Inspector, BuyerRep, SellerRep]
    code: 200
    input: []
    output: ArbitrationCase
    side_effects: []

  - method: GET
    path: "/arbitration/cases"
    description: "List arbitration cases, filterable by sale, by claimant buyer, by policy, by the case they supersede, and by status."
    roles: [AuctionAdmin, BlockClerk, Arbitrator, Inspector, BuyerRep, SellerRep]
    code: 200
    input: ["sale_id?", "claimant_buyer_id?", "policy_id?", "superseded_case_id?", "status?", "limit?", "offset?"]
    output: ArbitrationCase[]
    side_effects: []

  - method: POST
    path: "/arbitration/cases/{id}/evidence"
    description: "Attach an inspection report, diagnostic record, title document or third-party verification to a case."
    roles: [BuyerRep, Inspector]
    code: 201
    input: [evidence_type, provider_name, document_reference, "repair_estimate_cents?", "odometer_reading?"]
    output: ClaimEvidence
    side_effects:
      - "creates an immutable ClaimEvidence bound to the case; submitted_by_role and submitted_by_user_id are taken from the request headers"
      - "verified is computed from evidence_type alone: true for INSPECTION_REPORT and THIRD_PARTY_VERIFICATION, false for DIAGNOSTIC_SCAN, PHOTO_SET and TITLE_DOCUMENT; any client-supplied value is ignored"
      - "a verified row carrying repair_estimate_cents becomes the latest_verified_estimate_cents basis of calculations.repair_allowance_amount; a verified row carrying odometer_reading becomes its verified_true_mileage basis"
      - "increments ArbitrationCase.version by 1 and stores that new value on the evidence row as case_version_after"

  - method: GET
    path: "/arbitration/cases/{id}/evidence"
    description: "List every evidence item attached to a case, in created_at ASC order."
    roles: [AuctionAdmin, BlockClerk, Arbitrator, Inspector, BuyerRep, SellerRep]
    code: 200
    input: []
    output: ClaimEvidence[]
    side_effects: []

  - method: POST
    path: "/arbitration/cases/{id}/open-review"
    description: "Open arbitration review on a submitted case. Enforces the evidence sufficiency rules for the claimed defect class and records the intake arbitrator for segregation of duties."
    roles: [Arbitrator]
    code: 200
    input: []
    output: ArbitrationCase
    side_effects:
      - "ArbitrationCase.status SUBMITTED -> UNDER_REVIEW; review_opened_at_utc = the current logical clock"
      - "intake_arbitrator_user_id = X-User-ID; that operator can no longer issue the decision (ERR_SEGREGATION_OF_DUTIES)"
      - "increments ArbitrationCase.version by 1"

  # --- Seller response and allowance negotiation ---------------------------
  - method: POST
    path: "/arbitration/cases/{id}/seller-response"
    description: "Seller answers the claim: offer a repair allowance, dispute it, or concede an unwind."
    roles: [SellerRep]
    code: 201
    input: [response_type, response_note, "seller_offer_cents?"]
    output: NegotiationRound
    side_effects:
      - "creates a NegotiationRound with round_index = ArbitrationCase.current_round_index + 1"
      - "OFFER_REPAIR_ALLOWANCE: round status OPEN, response_deadline_utc = now + ROUND_RESPONSE_HOURS (48h); case UNDER_REVIEW|COUNTERED -> NEGOTIATION; any COUNTERED round -> SUPERSEDED"
      - "DISPUTE: round status CLOSED with seller_offer_cents 0; case -> ARBITRATOR_REVIEW"
      - "ACCEPT_UNWIND: round status CLOSED with seller_offer_cents 0; case -> ARBITRATOR_REVIEW and seller_conceded = true, which forces the decision outcome to UNWIND (ERR_UNWIND_MANDATORY otherwise)"
      - "ArbitrationCase.current_round_index += 1; increments ArbitrationCase.version by 1"
      - "an offer above round_half_up(sale_price_cents * policy.max_allowance_bps / 10000) is rejected with ERR_ALLOWANCE_EXCEEDS_CAP"

  - method: GET
    path: "/arbitration/cases/{id}/negotiation-rounds"
    description: "List the negotiation rounds of a case, in created_at ASC order."
    roles: [AuctionAdmin, BlockClerk, Arbitrator, Inspector, BuyerRep, SellerRep]
    code: 200
    input: []
    output: NegotiationRound[]
    side_effects: []

  - method: POST
    path: "/arbitration/cases/{id}/negotiation-rounds/{round_id}/counter"
    description: "Buyer counters the seller's allowance offer, starting a cooldown before the seller may re-offer."
    roles: [BuyerRep]
    code: 200
    input: [buyer_demand_cents, counter_note]
    output: NegotiationRound
    side_effects:
      - "NegotiationRound.status OPEN -> COUNTERED; countered_at_utc = now; cooldown_until_utc = now + ROUND_COOLDOWN_HOURS (2h); buyer_demand_cents stored"
      - "ArbitrationCase.status NEGOTIATION -> COUNTERED"
      - "increments NegotiationRound.version and ArbitrationCase.version by 1 each"
      - "a further seller offer at exactly cooldown_until_utc is rejected with ERR_ROUND_COOLDOWN_ACTIVE"

  - method: POST
    path: "/arbitration/cases/{id}/negotiation-rounds/{round_id}/accept"
    description: "Buyer accepts the seller's allowance offer, resolving the case and firing the seller-consequence cascade."
    roles: [BuyerRep]
    code: 201
    input: []
    output: ArbitrationDecision
    side_effects:
      - "NegotiationRound.status OPEN -> ACCEPTED; ArbitrationCase.status NEGOTIATION -> RESOLVED_ALLOWANCE with fault_party SELLER"
      - "creates ArbitrationDecision with outcome REPAIR_ALLOWANCE, allowance_variant NEGOTIATED_ACCEPT, allowance_cents = NegotiationRound.seller_offer_cents, computed_award_cents from the ARBITRATOR_AWARD variant of calculations.repair_allowance_amount"
      - "runs calculations.transport_cost_allocation with the REPAIR_ALLOWANCE profile and posts a REPAIR_ALLOWANCE pair plus one balanced TRANSPORT_ALLOCATION batch per leg"
      - "AuctionSale.arbitration_status ACTIVE -> RESOLVED; open_case_count -= 1; Buyer.open_claim_count -= 1; Seller.open_claim_count -= 1"
      - "Seller.lifetime_upheld_count += 1; recomputes calculations.seller_arbitration_rate; a crossed tier threshold appends a SellerPolicyAction; a BLOCKED tier sets settlement_hold = true on that seller's UNSETTLED, arbitration_status NONE sales"
      - "increments ArbitrationCase.version, AuctionSale.version, Buyer.version and Seller.version by 1 each"

  # --- Transport, escalation and decision ----------------------------------
  - method: POST
    path: "/arbitration/cases/{id}/transport-legs"
    description: "Record a transportation leg incurred by the dispute. Requires the case version the client last observed."
    roles: [AuctionAdmin]
    code: 201
    input: [leg_type, miles, carrier_name, expected_case_version]
    output: TransportLeg
    side_effects:
      - "rejects a stale expected_case_version with ERR_STALE_CASE_VERSION (412) per §1.2.1 rule transport-leg-stale-case"
      - "creates an immutable TransportLeg whose cost_cents comes from the banded formula in calculations.transport_cost_allocation"
      - "increments ArbitrationCase.version by 1 and stores that new value on the leg as case_version_after"

  - method: GET
    path: "/arbitration/cases/{id}/transport-legs"
    description: "List the transportation legs recorded against a case, in created_at ASC order — the allocation order used by calculations.transport_cost_allocation."
    roles: [AuctionAdmin, BlockClerk, Arbitrator, Inspector, BuyerRep, SellerRep]
    code: 200
    input: []
    output: TransportLeg[]
    side_effects: []

  - method: POST
    path: "/arbitration/cases/{id}/escalate"
    description: "Escalate an exhausted or timed-out negotiation to arbitrator review."
    roles: [Arbitrator]
    code: 200
    input: [escalation_note]
    output: ArbitrationCase
    side_effects:
      - "ArbitrationCase.status NEGOTIATION|COUNTERED -> ARBITRATOR_REVIEW"
      - "every OPEN or COUNTERED NegotiationRound on the case -> SUPERSEDED, in created_at ASC order"
      - "refused with ERR_NEGOTIATION_NOT_EXHAUSTED while current_round_index < MAX_NEGOTIATION_ROUNDS (3) and seller_response_timed_out is false"
      - "increments ArbitrationCase.version by 1"

  - method: POST
    path: "/arbitration/cases/{id}/decision"
    description: "Issue the arbitration decision: unwind the sale, award a repair allowance, deny the claim, or deny it as frivolous and assess a fee."
    roles: [Arbitrator]
    code: 201
    input: [outcome, fault_party, rationale, "requested_allowance_cents?"]
    output: ArbitrationDecision
    side_effects:
      - "rejects the intake arbitrator with ERR_SEGREGATION_OF_DUTIES"
      - "creates ArbitrationDecision with decided_at_utc = the current logical clock and the outputs of calculations.transport_cost_allocation"
      - "UNWIND: case -> UNWOUND; AuctionSale.settlement_status -> REVERSED; a SALE_PROCEEDS_REVERSAL pair is posted ONLY when the prior settlement_status was SETTLED; calculations.unwind_payout_totals sets fee_offset_applied_cents and total_buyer_payout_cents and decrements Buyer.frivolous_fee_balance_cents"
      - "REPAIR_ALLOWANCE: case -> RESOLVED_ALLOWANCE; allowance_variant ARBITRATOR_AWARD; allowance_cents = min(requested_allowance_cents, computed_award_cents); a REPAIR_ALLOWANCE pair is posted; settlement_status is untouched"
      - "CLAIM_DENIED: case -> DENIED; no allowance, no seller consequence, buyer bears all transport"
      - "FRIVOLOUS_DENIED: case -> DENIED; creates a FrivolousFeeAssessment from calculations.frivolous_fee_assessment; Buyer.frivolous_claim_count += 1 and frivolous_fee_balance_cents += fee_cents; claim_privilege_status -> FEE_HOLD or SUSPENDED; a SUSPENDED buyer's REQUESTED PostSaleInspection rows -> EXPIRED"
      - "UNWIND and REPAIR_ALLOWANCE additionally increment Seller.lifetime_upheld_count, recompute calculations.seller_arbitration_rate, may append a SellerPolicyAction and may set settlement_hold across the seller's sales"
      - "AuctionSale.arbitration_status ACTIVE -> RESOLVED; open_case_count -= 1; Buyer.open_claim_count -= 1; Seller.open_claim_count -= 1"
      - "increments ArbitrationCase.version, AuctionSale.version, Buyer.version and Seller.version by 1 each"

  - method: GET
    path: "/arbitration/cases/{id}/decision"
    description: "List the arbitration decision of a case — an array of 0 or 1 rows, since a case is decided at most once."
    roles: [AuctionAdmin, BlockClerk, Arbitrator, Inspector, BuyerRep, SellerRep]
    code: 200
    input: []
    output: ArbitrationDecision[]
    side_effects: []

  - method: GET
    path: "/arbitration/cases/{id}/ledger-entries"
    description: "List the settlement ledger entries attributable to a case, in created_at ASC order."
    roles: [AuctionAdmin, BlockClerk, Arbitrator, Inspector, BuyerRep, SellerRep]
    code: 200
    input: []
    output: SettlementLedgerEntry[]
    side_effects: []

  - method: POST
    path: "/arbitration/cases/{id}/withdraw"
    description: "Buyer withdraws a claim before it is decided, releasing every counter it incremented."
    roles: [BuyerRep]
    code: 200
    input: [withdraw_reason]
    output: ArbitrationCase
    side_effects:
      - "ArbitrationCase.status SUBMITTED|UNDER_REVIEW|NEGOTIATION|COUNTERED -> WITHDRAWN"
      - "every OPEN or COUNTERED NegotiationRound on the case -> SUPERSEDED, in created_at ASC order"
      - "AuctionSale.open_case_count -= 1; when it reaches 0 and no ArbitrationDecision exists on the sale, arbitration_status ACTIVE -> NONE"
      - "Buyer.open_claim_count -= 1; Seller.open_claim_count -= 1"
      - "increments ArbitrationCase.version, AuctionSale.version, Buyer.version and Seller.version by 1 each"
      - "compensating half of calculations.open_claim_counter_invariant"

  # --- Case-scoped consequence reads ---------------------------------------
  - method: GET
    path: "/arbitration/cases/{id}/frivolous-fees"
    description: "List the frivolous-claim fee assessed on a case — an array of 0 or 1 rows."
    roles: [AuctionAdmin, BlockClerk, Arbitrator, Inspector, BuyerRep, SellerRep]
    code: 200
    input: []
    output: FrivolousFeeAssessment[]
    side_effects: []

  - method: GET
    path: "/arbitration/cases/{id}/policy-actions"
    description: "List the seller policy actions this case triggered — the discovery channel for cascade-created rows."
    roles: [AuctionAdmin, BlockClerk, Arbitrator, Inspector, BuyerRep, SellerRep]
    code: 200
    input: []
    output: SellerPolicyAction[]
    side_effects: []

  # --- Buyer consequences ---------------------------------------------------
  - method: POST
    path: "/arbitration/buyers/{id}/fee-payments"
    description: "Pay down a buyer's outstanding frivolous-claim fee balance. Requires the buyer version the client last observed."
    roles: [BuyerRep]
    code: 200
    input: [amount_cents, expected_buyer_version]
    output: Buyer
    side_effects:
      - "rejects a stale expected_buyer_version with ERR_STALE_BUYER_VERSION (412) per §1.2.1 rule fee-payment-stale-buyer"
      - "rejects amount_cents above the outstanding balance with ERR_PAYMENT_EXCEEDS_BALANCE"
      - "Buyer.frivolous_fee_balance_cents -= amount_cents; no SettlementLedgerEntry is posted, because a fee payment is settled outside the sale ledger"
      - "when the balance reaches 0 and frivolous_claim_count < FRIVOLOUS_SUSPENSION_COUNT (3), claim_privilege_status FEE_HOLD -> ACTIVE; a SUSPENDED buyer stays SUSPENDED"
      - "increments Buyer.version by 1"

  - method: GET
    path: "/arbitration/buyers/{id}/frivolous-fees"
    description: "List every frivolous-claim fee assessed against a buyer, in created_at ASC order."
    roles: [AuctionAdmin, BlockClerk, Arbitrator, Inspector, BuyerRep, SellerRep]
    code: 200
    input: []
    output: FrivolousFeeAssessment[]
    side_effects: []

  # --- Seller consequences -------------------------------------------------
  - method: POST
    path: "/arbitration/sellers/{id}/reinstate"
    description: "Reinstate a blocked seller to probation and release the settlement holds the block placed on its sales."
    roles: [AuctionAdmin]
    code: 200
    input: [reinstate_note]
    output: Seller
    side_effects:
      - "Seller.policy_tier BLOCKED -> PROBATION; blocked_at_utc = null; reinstated_count += 1"
      - "appends a SellerPolicyAction with action_type REINSTATE and triggered_by_case_id null"
      - "clears settlement_hold on every AuctionSale of the seller, in created_at ASC order, bumping each sale's version"
      - "refused with ERR_SELLER_NOT_BLOCKED when the tier is not BLOCKED"
      - "increments Seller.version by 1"

  - method: GET
    path: "/arbitration/sellers/{id}/policy-actions"
    description: "List every policy action recorded against a seller, in created_at ASC order."
    roles: [AuctionAdmin, BlockClerk, Arbitrator, Inspector, BuyerRep, SellerRep]
    code: 200
    input: []
    output: SellerPolicyAction[]
    side_effects: []

  - method: GET
    path: "/arbitration/sellers/{id}/scorecard"
    description: "Computed read of both variants of calculations.seller_arbitration_rate side by side with the tier they produced."
    roles: [AuctionAdmin, BlockClerk, Arbitrator, Inspector, BuyerRep, SellerRep]
    code: 200
    input: []
    output: "{ seller_id: string, rolling_window_sales_count: integer, rolling_window_upheld_count: integer, rolling_arbitration_rate_bps: integer, lifetime_sales_count: integer, lifetime_upheld_count: integer, lifetime_arbitration_rate_bps: integer, policy_tier: enum, computed_at_utc: datetime }"
    side_effects:
      - "recomputes both variants against the current logical clock; never mutates the Seller row"

  # --- Test-driving endpoints ---------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the logical clock reads exactly its startup default 2026-08-01T00:00:00Z and never falls back to real wall-clock time. The clock may only move forward or stay put; a request for an earlier instant is refused with ERR_CLOCK_NOT_MONOTONIC."
    roles: [AuctionAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects:
      - "every subsequent window, deadline, cooldown and rolling-window evaluation reads the new value"

  - method: POST
    path: "/_ops/run-arbitration-sweep"
    description: "Run the four deadline phases of calculations.sweep_processing against the current logical clock and report how many rows each phase moved."
    roles: [AuctionAdmin]
    code: 200
    input: []
    output: "{ inspections_expired: integer, rounds_expired: integer, seller_response_timeouts: integer, cases_expired: integer }"
    side_effects:
      - "phase 1 expires REQUESTED PostSaleInspection rows at or past window_end_utc"
      - "phase 2 expires OPEN NegotiationRound rows past response_deadline_utc and moves their case to ARBITRATOR_REVIEW with fault_party BUYER"
      - "phase 3 moves UNDER_REVIEW cases past the seller response deadline to ARBITRATOR_REVIEW with a TIMEOUT round, seller_response_timed_out true and fault_party SELLER"
      - "phase 4 expires SUBMITTED cases past the intake grace period and releases their open-claim counters"
      - "idempotent: a second call with the clock unchanged returns all-zero counters"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or blank"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed for the endpoint in §1.5"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, unknown enum member, non-integer where an integer is required, negative cents, unparseable ISO-8601 instant, or a superseded_case_id whose sale or defect_class does not match"
  - id: ERR_SALE_NOT_FOUND
    http: 404
    condition: "no AuctionSale for the given path or body sale id"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "no ArbitrationCase for the given path or body case id"
  - id: ERR_ROUND_NOT_FOUND
    http: 404
    condition: "no NegotiationRound with the given id belonging to the path case"
  - id: ERR_SELLER_NOT_FOUND
    http: 404
    condition: "no Seller for the given path or body seller id"
  - id: ERR_BUYER_NOT_FOUND
    http: 404
    condition: "no Buyer for the given path or body buyer id"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "no PostSaleInspection for the given path id"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "no ArbitrationPolicy published for the claimed defect_class, or no policy for the given path id"
  - id: ERR_NOT_SALE_BUYER
    http: 403
    condition: "the acting BuyerRep is not the buyer of the sale"
  - id: ERR_NOT_CASE_OWNER
    http: 403
    condition: "the acting BuyerRep is not the claimant of the case"
  - id: ERR_NOT_SALE_SELLER
    http: 403
    condition: "the acting SellerRep is not the seller of the case's sale"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the Arbitrator issuing the decision is the one who opened the review"
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version does not equal the current ArbitrationCase.version"
  - id: ERR_STALE_BUYER_VERSION
    http: 412
    condition: "expected_buyer_version does not equal the current Buyer.version"
  - id: ERR_INVALID_CASE_STATE
    http: 409
    condition: "the ArbitrationCase status does not permit the requested transition"
  - id: ERR_INVALID_ROUND_STATE
    http: 409
    condition: "the NegotiationRound is not OPEN"
  - id: ERR_INVALID_INSPECTION_STATE
    http: 409
    condition: "the PostSaleInspection is not REQUESTED"
  - id: ERR_SALE_ALREADY_SETTLED
    http: 409
    condition: "the AuctionSale settlement_status is not UNSETTLED"
  - id: ERR_SELLER_NOT_BLOCKED
    http: 409
    condition: "reinstate attempted on a seller whose policy_tier is not BLOCKED"
  - id: ERR_BUYER_PRIVILEGE_SUSPENDED
    http: 409
    condition: "the acting Buyer's claim_privilege_status is SUSPENDED"
  - id: ERR_BUYER_FEE_HOLD
    http: 409
    condition: "the acting Buyer's claim_privilege_status is not ACTIVE when a paid privilege is requested"
  - id: ERR_SELLER_BLOCKED
    http: 409
    condition: "settlement attempted while the seller is BLOCKED or the sale carries a settlement hold"
  - id: ERR_DEFECT_ANNOUNCED
    http: 409
    condition: "the claimed defect_class was announced at the block and is not TITLE_MISSING"
  - id: ERR_PSI_WAIVED_RIGHTS
    http: 409
    condition: "a clean governing post-sale inspection waived arbitration rights for the claimed defect_class"
  - id: ERR_PSI_WINDOW_OVERLAP
    http: 409
    condition: "the requested inspection window overlaps a still-REQUESTED inspection on the same sale"
  - id: ERR_ARBITRATION_WINDOW_EXPIRED
    http: 409
    condition: "hours elapsed since hammer time exceeds the effective arbitration window for the defect class"
  - id: ERR_MILEAGE_LIMIT_EXCEEDED
    http: 409
    condition: "miles driven since the announced odometer reading exceeds the defect class's mileage limit"
  - id: ERR_ROUND_COOLDOWN_ACTIVE
    http: 409
    condition: "a seller re-offer arrived at or before the countered round's cooldown_until_utc"
  - id: ERR_ROUND_EXPIRED
    http: 409
    condition: "the negotiation round's response deadline has passed"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 409
    condition: "the requested logical clock instant is earlier than the current one"
  - id: ERR_DUPLICATE_DEALER_LICENSE
    http: 409
    condition: "another Seller or Buyer already holds that dealer license number"
  - id: ERR_DUPLICATE_POLICY_DEFECT_CLASS
    http: 409
    condition: "a policy already exists for that defect class"
  - id: ERR_DUPLICATE_OPEN_CLAIM
    http: 409
    condition: "a non-terminal case for the same sale and defect class already exists"
  - id: ERR_NEGOTIATION_NOT_EXHAUSTED
    http: 409
    condition: "escalation attempted before the round limit was reached and without a seller response timeout"
  - id: ERR_UNWIND_MANDATORY
    http: 409
    condition: "a non-unwind outcome was issued after the seller conceded an unwind, or an allowance was issued under a policy whose max_allowance_bps is 0"
  - id: ERR_MISSING_INSPECTION_REPORT
    http: 422
    condition: "review opened on a non-title claim with no INSPECTION_REPORT evidence"
  - id: ERR_TITLE_CLAIM_REQUIRES_TITLE_EVIDENCE
    http: 422
    condition: "review opened on a title claim with no TITLE_DOCUMENT evidence"
  - id: ERR_THIRD_PARTY_VERIFICATION_REQUIRED
    http: 422
    condition: "the policy demands verified third-party evidence and none is attached, or an arbitrator award was requested for a non-mileage defect with no verified repair estimate"
  - id: ERR_CLAIM_BELOW_MINIMUM
    http: 422
    condition: "claim_amount_cents is below the defect class's minimum claim amount"
  - id: ERR_ALLOWANCE_EXCEEDS_CAP
    http: 422
    condition: "the offered or requested allowance exceeds the policy cap applied to the sale price"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "a fee payment exceeds the buyer's outstanding frivolous-fee balance"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: AuctionAdmin
    description: "Auction house operations: registry, settlement, transportation records, seller reinstatement, clock and sweep."
    identity: opaque
    exclusive_operations:
      - "POST /arbitration/sellers"
      - "POST /arbitration/buyers"
      - "POST /arbitration/policies"
      - "POST /arbitration/sales/{id}/settle"
      - "POST /arbitration/cases/{id}/transport-legs"
      - "POST /arbitration/sellers/{id}/reinstate"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/run-arbitration-sweep"
    shared_operations:
      - "every GET under /arbitration"

  - name: BlockClerk
    description: "Sale-block staff: records sales as they cross the block and the condition announcements made on them."
    identity: opaque
    exclusive_operations:
      - "POST /arbitration/sales"
      - "POST /arbitration/sales/{id}/announcements"
    shared_operations:
      - "every GET under /arbitration"

  - name: Arbitrator
    description: "Arbitration department officer: opens review, escalates exhausted negotiations and issues decisions. Segregation of duties bars the arbitrator who opened a review from deciding it."
    identity: opaque
    exclusive_operations:
      - "POST /arbitration/cases/{id}/open-review"
      - "POST /arbitration/cases/{id}/escalate"
      - "POST /arbitration/cases/{id}/decision"
    shared_operations:
      - "every GET under /arbitration"

  - name: Inspector
    description: "Third-party post-sale inspection technician: files inspection findings."
    identity: opaque
    exclusive_operations:
      - "POST /arbitration/post-sale-inspections/{id}/complete"
    shared_operations:
      - "every GET under /arbitration"
      - "POST /arbitration/cases/{id}/evidence"

  - name: BuyerRep
    description: "Buying dealer's representative: buys post-sale inspections, files and evidences claims, negotiates and withdraws, pays frivolous-claim fees."
    identity: "entity_backed:Buyer"
    exclusive_operations:
      - "POST /arbitration/post-sale-inspections"
      - "POST /arbitration/cases"
      - "POST /arbitration/cases/{id}/negotiation-rounds/{round_id}/counter"
      - "POST /arbitration/cases/{id}/negotiation-rounds/{round_id}/accept"
      - "POST /arbitration/cases/{id}/withdraw"
      - "POST /arbitration/buyers/{id}/fee-payments"
    shared_operations:
      - "every GET under /arbitration"
      - "POST /arbitration/cases/{id}/evidence"

  - name: SellerRep
    description: "Consigning seller's representative: answers claims with an allowance offer, a dispute, or a conceded unwind."
    identity: "entity_backed:Seller"
    exclusive_operations:
      - "POST /arbitration/cases/{id}/seller-response"
    shared_operations:
      - "every GET under /arbitration"
