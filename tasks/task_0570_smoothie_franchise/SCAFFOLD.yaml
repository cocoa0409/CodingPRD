# =============================================================================
# PRD Benchmark Scaffold — Smoothie & Juice Bar Franchise (Expert)
# =============================================================================

scenario: |
  570. Smoothie & Juice Bar Franchise (Jamba/Smoothie King style): menu/custom blend
  & boost add-in, mobile order-ahead & loyalty, ingredient par & FIFO/spoilage,
  franchise/multi-unit & royalty, nutrition/allergen labeling, catering & wellness
  pack, recurring subscription, daily reconciliation

domain_name: smoothie-franchise
api_prefix: ""   # multi-root API (franchisees, stores, orders, subscriptions, …); no single shared prefix

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: quota_allocation      # ingredient par & FIFO/spoilage lots consumed against demand
  complexity_layers:
    - dual_variant_calculation                # COGS provisional/final; royalty gross/net
    - cascading_side_effects                  # pay→earn→balance→tier ; sweep→spoil→store cost
    - optimistic_concurrency                  # store-config + subscription change-plan OCC
    - derived_field_reconciliation            # loyalty_tier, points_balance, mtd_spoilage_cents

  entity_topology: hybrid
  # Franchisee→Store→(DeliveryVehicle, InventoryLot, CateringBooking, Reconciliation) tree,
  # plus flat cross-cutting refs Order↔Customer, Order↔Store, PointsTransaction↔Order.

  state_machine_shape: parallel
  # Order carries two independent dimensions (payment_status × fulfillment_status);
  # Subscription is cyclic (ACTIVE↔PAST_DUE renewal loop).

  relationship_patterns:
    - one_to_many        # Store→InventoryLot, Customer→Order, Customer→PointsTransaction
    - cross_aggregate    # Order references Store and Customer across aggregate boundaries

  role_model: hierarchical_override
  # PlatformAdmin (franchisor) superset; Franchisee owns stores; StoreStaff operates one store;
  # Customer owns own orders/subscriptions; Anonymous may self-register.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Franchisee
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Franchisee legal/business name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: base_royalty_rate, type: number, source: input, description: "Default royalty rate applied to store sales, e.g. 0.06", constraints: "0 <= rate <= 0.5" }
      - { name: marketing_fee_rate, type: number, source: input, description: "Marketing fund rate on sales, e.g. 0.02", constraints: "0 <= rate <= 0.2" }
      - { name: lifetime_royalty_cents, type: integer, source: computed, description: "Running sum of total_franchise_due_cents across all POSTED reconciliations of this franchisee's stores", default: 0 }

  - name: Store
    parent: Franchisee
    common_fields: true
    fields:
      - { name: franchisee_id, type: string, source: input, description: "FK -> Franchisee.id" }
      - { name: name, type: string, source: input, description: "Store display name" }
      - { name: status, type: enum, source: system, description: "SETUP | OPEN | SUSPENDED | CLOSED — operating posture; gates ordering", default: SETUP, constraints: "enum {SETUP, OPEN, SUSPENDED, CLOSED}" }
      - { name: catering_capacity, type: integer, source: input, description: "Max concurrent catering headcount the store prep line can serve in one overlapping prep window", constraints: ">= 1" }
      - { name: royalty_rate_override, type: number, source: input, description: "Optional per-store royalty rate; when null, franchisee.base_royalty_rate is used", default: null, constraints: "null or 0<=x<=0.5" }
      - { name: mtd_spoilage_cents, type: integer, source: computed, description: "Month-to-date accumulated spoilage write-off (sum of spoiled remaining_qty*unit_cost_cents)", default: 0 }

  - name: DeliveryVehicle
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: label, type: string, source: input, description: "Vehicle label/plate" }
      - { name: headcount_capacity, type: integer, source: input, description: "Max catering headcount per delivery run", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | MAINTENANCE — MAINTENANCE blocks new bookings", default: AVAILABLE, constraints: "enum {AVAILABLE, MAINTENANCE}" }

  - name: Ingredient
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Ingredient name (e.g. Strawberry)" }
      - { name: unit, type: enum, source: input, description: "Unit of measure GRAM | ML | UNIT", constraints: "enum {GRAM, ML, UNIT}" }
      - { name: standard_cost_cents_per_unit, type: integer, source: input, description: "Standard/planned cost per unit used for provisional COGS", constraints: ">= 0" }
      - { name: allergen_tags, type: array, source: input, description: "List of allergen tags this ingredient carries (e.g. [\"milk\"]); empty allowed", default: [] }

  - name: InventoryLot
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: ingredient_id, type: string, source: input, description: "FK -> Ingredient.id" }
      - { name: qty_received, type: integer, source: input, description: "Units received in this lot (immutable)", constraints: ">= 1" }
      - { name: remaining_qty, type: integer, source: computed, description: "Units still available; decremented FIFO on consumption, restored on order cancel, zeroed on spoilage", default: 0 }
      - { name: consumed_qty, type: integer, source: computed, description: "Units permanently consumed by PICKED_UP orders", default: 0 }
      - { name: spoiled_qty, type: integer, source: computed, description: "Units written off by spoilage sweep", default: 0 }
      - { name: unit_cost_cents, type: integer, source: input, description: "Actual purchase cost per unit for this lot; used for final COGS", constraints: ">= 0" }
      - { name: received_at, type: datetime, source: input, description: "Receipt timestamp; FIFO consumption order key (ASC)" }
      - { name: expiry_date, type: datetime, source: input, description: "Expiry instant; lot is spoilable once current clock >= expiry_date" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | DEPLETED | SPOILED", default: AVAILABLE, constraints: "enum {AVAILABLE, DEPLETED, SPOILED}" }

  - name: MenuItem
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Menu item name" }
      - { name: category, type: enum, source: input, description: "SMOOTHIE | JUICE | BOWL | WELLNESS_PACK", constraints: "enum {SMOOTHIE, JUICE, BOWL, WELLNESS_PACK}" }
      - { name: base_price_cents, type: integer, source: input, description: "Price for SMALL size before size upcharge, boosts, discounts", constraints: ">= 0" }
      - { name: recipe, type: array, source: input, description: "SMALL-size recipe: list of {ingredient_id, base_qty}; scaled by SIZE_QTY_FACTOR for larger sizes" }
      - { name: base_calories, type: integer, source: input, description: "Calories for SMALL size; scaled by SIZE_QTY_FACTOR", constraints: ">= 0" }
      - { name: allergen_tags, type: array, source: input, description: "Declared allergen tags for this item (union with boost tags forms the line allergen set)", default: [] }

  - name: BoostAddIn
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Boost/add-in name (e.g. Whey Protein)" }
      - { name: price_cents, type: integer, source: input, description: "Flat per-line surcharge, size-independent", constraints: ">= 0" }
      - { name: calories, type: integer, source: input, description: "Calories added per line", constraints: ">= 0" }
      - { name: allergen_tags, type: array, source: input, description: "Allergen tags this boost carries", default: [] }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login/contact email (unique)" }
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: allergen_avoid, type: array, source: input, description: "Allergen tags the customer must not be served; triggers safety block unless overridden", default: [] }
      - { name: points_balance, type: integer, source: computed, description: "Spendable loyalty points = SUM of all PointsTransaction.delta for this customer", default: 0 }
      - { name: lifetime_points_earned, type: integer, source: computed, description: "SUM of PointsTransaction.delta for reasons in {EARN, CLAWBACK, SUBSCRIPTION_BONUS} (excludes REDEEM); drives loyalty_tier", default: 0 }
      - { name: loyalty_tier, type: enum, source: computed, description: "BRONZE | SILVER | GOLD derived from lifetime_points_earned thresholds", default: BRONZE, constraints: "enum {BRONZE, SILVER, GOLD}" }

  - name: Subscription
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: tier, type: enum, source: input, description: "BASIC | PREMIUM plan tier", constraints: "enum {BASIC, PREMIUM}" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Recurring fee charged each renewal", constraints: ">= 0" }
      - { name: included_smoothie_credits, type: integer, source: input, description: "SMOOTHIE base-price credits granted at each renewal", constraints: ">= 0" }
      - { name: credits_remaining, type: integer, source: computed, description: "Unused credits this period; reset to included_smoothie_credits on successful renewal, decremented when applied to an order line", default: 0 }
      - { name: renewal_bonus_points, type: integer, source: input, description: "Loyalty points granted as a SUBSCRIPTION_BONUS on each successful renewal", default: 0, constraints: ">= 0" }
      - { name: cycle_index, type: integer, source: system, description: "Monotone billing cycle counter, starts at 1 on create", default: 1 }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAST_DUE | CANCELLED", default: ACTIVE, constraints: "enum {ACTIVE, PAST_DUE, CANCELLED}" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id (the acting Customer)" }
      - { name: lines, type: array, source: input, description: "Order lines; each {menu_item_id, size(SMALL|MEDIUM|LARGE), boost_ids:[]}. Server augments each with computed line_gross_cents, tier_discount_cents, credit_applied, line_net_cents, line_calories, line_allergens" }
      - { name: redeem_points, type: integer, source: input, description: "Points to redeem (1 point = 1 cent), capped at subtotal", default: 0, constraints: ">= 0" }
      - { name: use_subscription_credit, type: boolean, source: input, description: "When true, apply the customer's ACTIVE subscription credits to SMOOTHIE line base prices", default: false }
      - { name: fulfillment_status, type: enum, source: system, description: "PLACED | PREPARING | READY | PICKED_UP | CANCELLED", default: PLACED, constraints: "enum {PLACED, PREPARING, READY, PICKED_UP, CANCELLED}" }
      - { name: payment_status, type: enum, source: system, description: "PENDING | PAID | REFUNDED — independent dimension", default: PENDING, constraints: "enum {PENDING, PAID, REFUNDED}" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of per-line line_net_cents", default: 0 }
      - { name: redeem_discount_cents, type: integer, source: computed, description: "min(redeem_points, subtotal_cents)", default: 0 }
      - { name: discounted_subtotal_cents, type: integer, source: computed, description: "subtotal_cents - redeem_discount_cents; royalty NET basis and points-earn basis", default: 0 }
      - { name: tax_cents, type: integer, source: computed, description: "round_half_up(discounted_subtotal_cents * TAX_RATE)", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "discounted_subtotal_cents + tax_cents", default: 0 }
      - { name: gross_merch_cents, type: integer, source: computed, description: "Sum of per-line line_gross_cents (sticker value before tier discount, redemption, credit); royalty GROSS basis", default: 0 }
      - { name: cogs_provisional_cents, type: integer, source: computed, description: "Standard-cost COGS computed at pay", default: 0 }
      - { name: cogs_final_cents, type: integer, source: computed, description: "Actual FIFO lot-cost COGS locked at complete", default: 0 }
      - { name: credits_used, type: integer, source: computed, description: "Number of subscription credits applied on this order", default: 0 }
      - { name: points_earned, type: integer, source: computed, description: "floor(discounted_subtotal_cents / 100), granted as EARN at pay", default: 0 }
      - { name: total_calories, type: integer, source: computed, description: "Sum of per-line line_calories", default: 0 }
      - { name: allergen_summary, type: array, source: computed, description: "Union of all line_allergens", default: [] }
      - { name: paid_at, type: datetime, source: system, description: "Clock instant of pay transition", default: null }
      - { name: completed_at, type: datetime, source: system, description: "Clock instant of complete (PICKED_UP) transition; date used for reconciliation membership", default: null }
      - { name: cancelled_at, type: datetime, source: system, description: "Clock instant of cancel transition", default: null }

  - name: PointsTransaction
    parent: Customer
    common_fields: false   # append-only ledger event: id + created_at only
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id (null for SUBSCRIPTION_BONUS)", default: null }
      - { name: reason, type: enum, source: system, description: "EARN | REDEEM | CLAWBACK | SUBSCRIPTION_BONUS", constraints: "enum {EARN, REDEEM, CLAWBACK, SUBSCRIPTION_BONUS}" }
      - { name: delta, type: integer, source: system, description: "Signed point change (EARN/BONUS positive, REDEEM/CLAWBACK negative)" }
      - { name: balance_after, type: integer, source: system, description: "points_balance immediately after this ledger entry" }

  - name: CateringBooking
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: delivery_vehicle_id, type: string, source: input, description: "FK -> DeliveryVehicle.id (null for PICKUP fulfillment)", default: null }
      - { name: fulfillment_type, type: enum, source: input, description: "PICKUP | DELIVERY", constraints: "enum {PICKUP, DELIVERY}" }
      - { name: headcount, type: integer, source: input, description: "Number of guests to serve", constraints: ">= 1" }
      - { name: items, type: array, source: input, description: "List of {menu_item_id, qty}" }
      - { name: prep_window_start, type: datetime, source: input, description: "Store prep window start (inclusive)" }
      - { name: prep_window_end, type: datetime, source: input, description: "Store prep window end (exclusive)" }
      - { name: delivery_window_start, type: datetime, source: input, description: "Vehicle delivery window start (inclusive); null for PICKUP", default: null }
      - { name: delivery_window_end, type: datetime, source: input, description: "Vehicle delivery window end (exclusive); null for PICKUP", default: null }
      - { name: quoted_price_cents, type: integer, source: computed, description: "Catering quote (items + per-head service fee + tax)", default: 0 }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | COMPLETED | CANCELLED", default: REQUESTED, constraints: "enum {REQUESTED, CONFIRMED, COMPLETED, CANCELLED}" }

  - name: DailyReconciliation
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: business_date, type: string, source: input, description: "Business date being closed, ISO date YYYY-MM-DD" }
      - { name: status, type: enum, source: system, description: "OPEN | COUNTED | POSTED", default: OPEN, constraints: "enum {OPEN, COUNTED, POSTED}" }
      - { name: expected_sales_cents, type: integer, source: computed, description: "Sum of total_cents over PICKED_UP orders whose completed_at date == business_date at this store; computed at open", default: 0 }
      - { name: gross_sales_cents, type: integer, source: computed, description: "Sum of gross_merch_cents over the same order set", default: 0 }
      - { name: net_sales_cents, type: integer, source: computed, description: "Sum of discounted_subtotal_cents over the same order set (royalty NET basis)", default: 0 }
      - { name: counted_cash_cents, type: integer, source: input, description: "Operator-entered counted amount at count step", default: 0 }
      - { name: variance_cents, type: integer, source: computed, description: "counted_cash_cents - expected_sales_cents; set at count", default: 0 }
      - { name: royalty_basis, type: enum, source: input, description: "NET | GROSS basis chosen at post", default: NET, constraints: "enum {NET, GROSS}" }
      - { name: royalty_rate_applied, type: number, source: computed, description: "Effective royalty rate after rebate check", default: 0 }
      - { name: royalty_due_cents, type: integer, source: computed, description: "round_half_up(basis_sales * royalty_rate_applied)", default: 0 }
      - { name: marketing_fee_cents, type: integer, source: computed, description: "round_half_up(basis_sales * marketing_fee_rate)", default: 0 }
      - { name: total_franchise_due_cents, type: integer, source: computed, description: "royalty_due_cents + marketing_fee_cents", default: 0 }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Store
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: OPEN
        trigger: "PATCH /stores/{store_id} with status=OPEN"
        actor: Franchisee
        preconditions: ["expected_store_version matches current Store.version"]
        side_effects: ["increments Store.version by 1"]
      - from: OPEN
        to: SUSPENDED
        trigger: "PATCH /stores/{store_id} with status=SUSPENDED"
        actor: Franchisee
        preconditions: ["expected_store_version matches current Store.version"]
        side_effects: ["increments Store.version by 1", "new orders blocked while SUSPENDED"]
      - from: SUSPENDED
        to: OPEN
        trigger: "PATCH /stores/{store_id} with status=OPEN"
        actor: Franchisee
        preconditions: ["expected_store_version matches current Store.version"]
        side_effects: ["increments Store.version by 1"]
      - from: OPEN
        to: CLOSED
        trigger: "PATCH /stores/{store_id} with status=CLOSED"
        actor: Franchisee
        preconditions: ["expected_store_version matches current Store.version"]
        side_effects: ["increments Store.version by 1"]
      - from: SUSPENDED
        to: CLOSED
        trigger: "PATCH /stores/{store_id} with status=CLOSED"
        actor: Franchisee
        preconditions: ["expected_store_version matches current Store.version"]
        side_effects: ["increments Store.version by 1"]
    note: "Any PATCH that changes only catering_capacity/royalty_rate_override (no status change) also requires expected_store_version and increments version."

  - entity: Order
    initial_state: "PLACED / PENDING"
    terminal_states: [PICKED_UP, CANCELLED, REFUNDED]
    note: >
      PARALLEL dimensions: fulfillment_status {PLACED,PREPARING,READY,PICKED_UP,CANCELLED}
      and payment_status {PENDING,PAID,REFUNDED} evolve independently. `pay` advances BOTH
      (PENDING->PAID and PLACED->PREPARING). `ready`/`complete` touch only fulfillment.
      `cancel` moves fulfillment to CANCELLED and, if payment was PAID, payment to REFUNDED.
    transitions:
      - from: "fulfillment=PLACED, payment=PENDING"
        to: "fulfillment=PREPARING, payment=PAID"
        trigger: "POST /orders/{order_id}/pay"
        actor: Customer
        preconditions:
          - "Order fulfillment_status == PLACED and payment_status == PENDING"
          - "Store.status == OPEN"
          - "For every recipe ingredient across all lines, AVAILABLE lot remaining_qty at the store covers required qty (see inventory_fifo_consumption)"
        side_effects:
          - "Consume ingredient units FIFO from AVAILABLE lots; decrement InventoryLot.remaining_qty and increment consumed_qty; lot -> DEPLETED when remaining_qty reaches 0"
          - "Compute cogs_provisional_cents (standard cost)"
          - "Compute points_earned = floor(discounted_subtotal_cents/100); create PointsTransaction(reason=EARN, delta=+points_earned)"
          - "PointsTransaction creation updates Customer.points_balance and Customer.lifetime_points_earned; that update recomputes Customer.loyalty_tier"
          - "If use_subscription_credit, decrement Subscription.credits_remaining by credits_used"
          - "stamp paid_at = current clock"
      - from: "fulfillment=PREPARING"
        to: "fulfillment=READY"
        trigger: "POST /orders/{order_id}/ready"
        actor: StoreStaff
        preconditions: ["Order fulfillment_status == PREPARING"]
        side_effects: []
      - from: "fulfillment=READY"
        to: "fulfillment=PICKED_UP"
        trigger: "POST /orders/{order_id}/complete"
        actor: StoreStaff
        preconditions: ["Order fulfillment_status == READY"]
        side_effects:
          - "Lock cogs_final_cents from the actual lot unit_cost_cents of the units consumed at pay (FIFO)"
          - "stamp completed_at = current clock (its date determines reconciliation membership)"
      - from: "fulfillment in {PLACED,PREPARING,READY}"
        to: "fulfillment=CANCELLED (payment REFUNDED if was PAID)"
        trigger: "POST /orders/{order_id}/cancel"
        actor: Customer | StoreStaff
        preconditions: ["Order fulfillment_status in {PLACED, PREPARING, READY}"]
        side_effects:
          - "If payment_status == PAID: set payment_status=REFUNDED"
          - "Compensation — restore consumed inventory: for each unit consumed at pay, increment the originating InventoryLot.remaining_qty and decrement consumed_qty; a DEPLETED lot returns to AVAILABLE"
          - "Compensation — if points were earned: create PointsTransaction(reason=CLAWBACK, delta=-points_earned); that update lowers Customer.points_balance and lifetime_points_earned and recomputes loyalty_tier"
          - "Compensation — if credits were used: restore Subscription.credits_remaining by credits_used"
          - "stamp cancelled_at = current clock"

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    note: "CYCLIC: ACTIVE -> PAST_DUE -> ACTIVE renewal recovery loop."
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /subscriptions/{subscription_id}/renew with payment_outcome=SUCCESS"
        actor: PlatformAdmin
        preconditions: ["Subscription.status == ACTIVE"]
        side_effects:
          - "cycle_index += 1"
          - "credits_remaining reset to included_smoothie_credits"
          - "create PointsTransaction(reason=SUBSCRIPTION_BONUS, delta=+renewal_bonus_points) for the customer; recompute Customer.points_balance/lifetime_points_earned/loyalty_tier"
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /subscriptions/{subscription_id}/renew with payment_outcome=FAIL"
        actor: PlatformAdmin
        preconditions: ["Subscription.status == ACTIVE"]
        side_effects: ["no credit reset; no bonus granted"]
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /subscriptions/{subscription_id}/renew with payment_outcome=SUCCESS"
        actor: PlatformAdmin
        preconditions: ["Subscription.status == PAST_DUE"]
        side_effects:
          - "cycle_index += 1"
          - "credits_remaining reset to included_smoothie_credits"
          - "create PointsTransaction(reason=SUBSCRIPTION_BONUS, delta=+renewal_bonus_points); recompute Customer loyalty fields"
      - from: PAST_DUE
        to: CANCELLED
        trigger: "POST /subscriptions/{subscription_id}/renew with payment_outcome=FAIL"
        actor: PlatformAdmin
        preconditions: ["Subscription.status == PAST_DUE"]
        side_effects: ["credits_remaining set to 0"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /subscriptions/{subscription_id}/change-plan"
        actor: Customer
        preconditions:
          - "Subscription.status == ACTIVE"
          - "expected_subscription_version matches current Subscription.version"
        side_effects:
          - "tier/monthly_fee_cents/included_smoothie_credits/renewal_bonus_points replaced by new plan (new plan supersedes prior)"
          - "credits_remaining reset to new included_smoothie_credits"
          - "increments Subscription.version by 1"
      - from: "ACTIVE | PAST_DUE"
        to: CANCELLED
        trigger: "POST /subscriptions/{subscription_id}/cancel"
        actor: Customer
        preconditions: ["Subscription.status in {ACTIVE, PAST_DUE}"]
        side_effects: ["credits_remaining set to 0"]

  - entity: InventoryLot
    initial_state: AVAILABLE
    terminal_states: [SPOILED]
    transitions:
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system (order pay consumes remaining_qty to 0)"
        actor: system
        preconditions: ["remaining_qty reaches 0 after FIFO consumption"]
        side_effects: []
      - from: DEPLETED
        to: AVAILABLE
        trigger: "system (order cancel restores consumed units)"
        actor: system
        preconditions: ["remaining_qty becomes > 0 after compensation"]
        side_effects: []
      - from: AVAILABLE
        to: SPOILED
        trigger: "POST /stores/{store_id}/spoilage-sweep"
        actor: StoreStaff | system
        preconditions: ["current clock >= expiry_date", "lot status == AVAILABLE"]
        side_effects:
          - "spoiled_qty = remaining_qty; remaining_qty set to 0"
          - "write-off = spoiled_qty * unit_cost_cents increments Store.mtd_spoilage_cents"

  - entity: CateringBooking
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Branching on fulfillment_type at create (PICKUP vs DELIVERY); DELIVERY additionally reserves a DeliveryVehicle window."
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /catering-bookings/{booking_id}/confirm"
        actor: StoreStaff
        preconditions: ["Booking.status == REQUESTED", "Store.status == OPEN"]
        side_effects: []
      - from: "REQUESTED | CONFIRMED"
        to: COMPLETED
        trigger: "POST /catering-bookings/{booking_id}/complete"
        actor: StoreStaff
        preconditions: ["Booking.status in {REQUESTED, CONFIRMED}", "current clock >= prep_window_start"]
        side_effects: []
      - from: "REQUESTED | CONFIRMED"
        to: CANCELLED
        trigger: "POST /catering-bookings/{booking_id}/cancel"
        actor: Customer | StoreStaff
        preconditions: ["Booking.status in {REQUESTED, CONFIRMED}"]
        side_effects: ["frees the store prep-window capacity and any vehicle window it occupied (CANCELLED bookings excluded from overlap sets)"]

  - entity: DailyReconciliation
    initial_state: OPEN
    terminal_states: [POSTED]
    transitions:
      - from: OPEN
        to: COUNTED
        trigger: "POST /reconciliations/{reconciliation_id}/count"
        actor: StoreStaff
        preconditions: ["Reconciliation.status == OPEN"]
        side_effects:
          - "set counted_cash_cents from input"
          - "compute variance_cents = counted_cash_cents - expected_sales_cents"
      - from: COUNTED
        to: POSTED
        trigger: "POST /reconciliations/{reconciliation_id}/post"
        actor: Franchisee | PlatformAdmin
        preconditions: ["Reconciliation.status == COUNTED"]
        side_effects:
          - "select basis_sales = net_sales_cents if royalty_basis==NET else gross_sales_cents"
          - "royalty_rate_applied via rebate check (see royalty_computation)"
          - "compute royalty_due_cents, marketing_fee_cents, total_franchise_due_cents"
          - "increment Franchisee.lifetime_royalty_cents by total_franchise_due_cents"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: store-config-stale-version
    parent_entity: Store
    write_endpoint: "PATCH /stores/{id}"
    occ_field: "expected_store_version"
    description: |
      Updating a Store's configuration (status, catering_capacity, or
      royalty_rate_override) against a Store whose version has advanced since
      the client last observed it is rejected. The client's view of the store
      is stale — another config write has already superseded it.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: subscription-plan-change-stale-version
    parent_entity: Subscription
    write_endpoint: "POST /subscriptions/{id}/change-plan"
    occ_field: "expected_subscription_version"
    description: |
      Changing a Subscription's plan against a Subscription whose version has
      advanced since the client last observed it is rejected. A prior plan
      change (which legitimately supersedes the earlier plan) has already
      advanced the version, so the current writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_line_pricing
    trigger: "on POST /orders (placement) and re-locked at POST /orders/{id}/pay"
    algorithm: tiered_pricing
    formula: |
      # Per line, in this pinned order:
      size_base   = menu_item.base_price_cents + SIZE_UPCHARGE_CENTS[size]
      boosts_total= sum(boost.price_cents for boost in line.boost_ids)
      line_gross_cents = size_base + boosts_total
      # subscription credit covers ONLY the SMOOTHIE base (not boosts), if available:
      credit_applied = use_subscription_credit
                       AND menu_item.category == SMOOTHIE
                       AND active_subscription.credits_remaining_after_prior_lines > 0
      covered_base = size_base if credit_applied else 0
      subsidized   = line_gross_cents - covered_base
      tier_discount_cents = round_half_up(subsidized * LOYALTY_TIER_DISCOUNT_PCT[customer.loyalty_tier])
      line_net_cents = subsidized - tier_discount_cents
    input_set: "All lines of the order; subscription credits applied greedily in line order (index ASC), never by id"
    constants:
      SIZE_UPCHARGE_CENTS: { SMALL: 0, MEDIUM: 100, LARGE: 200 }
      LOYALTY_TIER_DISCOUNT_PCT: { BRONZE: 0.00, SILVER: 0.05, GOLD: 0.10 }
    precision: "integer cents, round_half_up"
    variants:
      - name: with_active_credit
        when: "use_subscription_credit true, subscription ACTIVE with credits, SMOOTHIE line"
        difference: "size_base waived from the subsidized base; boosts still charged; tier discount applies to boosts only"
      - name: without_credit
        when: "no credit or non-SMOOTHIE line"
        difference: "full line_gross is subsidized base"

  - name: order_total_assembly
    trigger: "on POST /orders (placement) and re-locked at POST /orders/{id}/pay"
    algorithm: aggregation
    formula: |
      # Pinned rounding order — round PER LINE first, then aggregate:
      subtotal_cents            = sum(line_net_cents over lines)     # each line already rounded
      redeem_discount_cents     = min(redeem_points, subtotal_cents) # 1 point = 1 cent
      discounted_subtotal_cents = subtotal_cents - redeem_discount_cents
      tax_cents                 = round_half_up(discounted_subtotal_cents * TAX_RATE)  # single order-level rounding
      total_cents               = discounted_subtotal_cents + tax_cents
      gross_merch_cents         = sum(line_gross_cents over lines)
    input_set: "All lines of the order"
    constants:
      TAX_RATE: 0.08
    precision: "integer cents, round_half_up"
    variants:
      - name: pinned_round_per_line_then_sum
        when: "always (this scaffold's canonical order)"
        difference: "tier discounts are rounded per line before summing; contrast with a sum-then-round reading that rounds tier discount on the aggregate — different cents; this scaffold pins per-line."

  - name: points_earned
    trigger: "at POST /orders/{id}/pay (EARN) and reversed at cancel (CLAWBACK)"
    algorithm: threshold
    formula: |
      points_earned = floor(discounted_subtotal_cents / 100)   # 1 point per whole dollar of pre-tax discounted subtotal
    input_set: "The order's own discounted_subtotal_cents"
    constants: { POINTS_PER_DOLLAR: 1 }
    precision: "integer points, floor"

  - name: loyalty_tier_derivation
    trigger: "recomputed after any PointsTransaction write for the customer"
    algorithm: threshold
    formula: |
      if   lifetime_points_earned >= GOLD_THRESHOLD:   loyalty_tier = GOLD
      elif lifetime_points_earned >= SILVER_THRESHOLD: loyalty_tier = SILVER
      else:                                            loyalty_tier = BRONZE
      # lifetime_points_earned = SUM(delta) over PointsTransaction with reason in {EARN, CLAWBACK, SUBSCRIPTION_BONUS}
    input_set: "All PointsTransaction rows of the customer (REDEEM excluded from lifetime)"
    constants: { SILVER_THRESHOLD: 500, GOLD_THRESHOLD: 1500 }
    precision: "exact integer comparison; boundary is >= (500 lifetime => SILVER)"

  - name: inventory_fifo_consumption
    trigger: "at POST /orders/{id}/pay (consume) and reversed at cancel (restore)"
    algorithm: waterfall_allocation
    formula: |
      for each recipe ingredient of each line:
        required = ceil(base_qty * SIZE_QTY_FACTOR[size])   # integer units
      aggregate required per (store, ingredient) across all lines
      candidate_lots = InventoryLot where store_id, ingredient_id, status==AVAILABLE
      sort candidate_lots by (received_at ASC, created_at ASC)   # FIFO; created_at is the ONLY tie-break, never id
      draw `required` units from the front lots; if the running total of remaining_qty
        across AVAILABLE lots < required  ->  ERR_INSUFFICIENT_INVENTORY
      cogs_final basis: each drawn unit costed at its source lot.unit_cost_cents
    input_set: "AVAILABLE lots only; DEPLETED/SPOILED excluded"
    constants:
      SIZE_QTY_FACTOR: { SMALL: 1.0, MEDIUM: 1.5, LARGE: 2.0 }
    precision: "integer units; boundary required == sum(remaining_qty) succeeds (>=), required == sum+1 fails"

  - name: order_cogs
    trigger: "provisional at pay; final at complete"
    algorithm: chronological
    formula: |
      required_units[ingredient] = sum over lines of ceil(base_qty * SIZE_QTY_FACTOR[size])
      # PROVISIONAL (at pay): planned/standard cost
      cogs_provisional_cents = sum over ingredients ( required_units * ingredient.standard_cost_cents_per_unit )
      # FINAL (at complete): actual cost of the specific FIFO lots consumed at pay
      cogs_final_cents = sum over consumed (unit) of ( source_lot.unit_cost_cents )
    input_set: "provisional over Ingredient.standard_cost; final over the actual InventoryLots drawn"
    constants: {}
    precision: "integer cents"
    variants:
      - name: provisional
        when: "computed at pay before lots are cost-locked"
        difference: "uses Ingredient.standard_cost_cents_per_unit (planning cost)"
      - name: final
        when: "locked at complete"
        difference: "uses actual InventoryLot.unit_cost_cents of drawn units; diverges from provisional whenever lot cost != standard cost"

  - name: royalty_computation
    trigger: "at POST /reconciliations/{id}/post"
    algorithm: tiered_pricing
    formula: |
      basis_sales = net_sales_cents  if royalty_basis == NET  else gross_sales_cents
      effective_rate_source = Store.royalty_rate_override if not null else Franchisee.base_royalty_rate
      # volume rebate: if net_sales_cents >= REBATE_THRESHOLD_CENTS, drop the royalty rate to REBATE_RATE
      royalty_rate_applied = REBATE_RATE if net_sales_cents >= REBATE_THRESHOLD_CENTS else effective_rate_source
      royalty_due_cents    = round_half_up(basis_sales * royalty_rate_applied)
      marketing_fee_cents  = round_half_up(basis_sales * Franchisee.marketing_fee_rate)
      total_franchise_due_cents = royalty_due_cents + marketing_fee_cents
    input_set: "PICKED_UP orders whose completed_at date == business_date at this store (same set as expected_sales)"
    constants:
      REBATE_THRESHOLD_CENTS: 50000
      REBATE_RATE: 0.05
    precision: "integer cents, round_half_up; rebate boundary net_sales_cents >= 50000 (50000 triggers rebate, 49999 does not)"
    variants:
      - name: net_basis
        when: "royalty_basis == NET"
        difference: "royalty computed on discounted_subtotal sum (net collected)"
      - name: gross_basis
        when: "royalty_basis == GROSS"
        difference: "royalty computed on gross_merch sum (sticker value); differs from net whenever any tier discount or redemption applied"

  - name: reconciliation_expected_and_variance
    trigger: "expected/gross/net at open; variance at count"
    algorithm: aggregation
    formula: |
      order_set = PICKED_UP orders at store with date(completed_at) == business_date
      expected_sales_cents = sum(total_cents)          over order_set
      gross_sales_cents    = sum(gross_merch_cents)     over order_set
      net_sales_cents      = sum(discounted_subtotal_cents) over order_set
      variance_cents       = counted_cash_cents - expected_sales_cents
    input_set: "PICKED_UP orders only; PLACED/PREPARING/READY/CANCELLED excluded"
    constants: {}
    precision: "integer cents; variance may be negative"

  - name: catering_quote
    trigger: "at POST /stores/{id}/catering-bookings"
    algorithm: aggregation
    formula: |
      items_total = sum(menu_item.base_price_cents * qty for item in items)
      service_fee = headcount * CATERING_SERVICE_FEE_PER_HEAD_CENTS
      quoted_price_cents = items_total + service_fee + round_half_up((items_total + service_fee) * TAX_RATE)
    input_set: "The booking's items and headcount"
    constants:
      CATERING_SERVICE_FEE_PER_HEAD_CENTS: 200
      TAX_RATE: 0.08
    precision: "integer cents, round_half_up"

  - name: order_nutrition
    trigger: "at POST /orders (placement)"
    algorithm: aggregation
    formula: |
      line_calories = round_half_up(menu_item.base_calories * SIZE_QTY_FACTOR[size]) + sum(boost.calories)
      total_calories = sum(line_calories over lines)
      line_allergens = union(menu_item.allergen_tags, boost.allergen_tags for boosts)
      allergen_summary = union(line_allergens over lines)
    input_set: "All lines"
    constants:
      SIZE_QTY_FACTOR: { SMALL: 1.0, MEDIUM: 1.5, LARGE: 2.0 }
    precision: "integer calories, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                 check: "X-User-Role and X-User-ID headers present and well-formed", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all except POST /customers (Anonymous allowed)" }
  - { priority: 2,  category: auth,                 check: "Role permitted for this operation per RBAC matrix", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: all }
  - { priority: 3,  category: business_constraint,  check: "Request body/query well-formed: required fields present, enum members valid, numbers >= 0, pagination in range", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: all }
  - { priority: 4,  category: existence,            check: "Path resources exist, validated left-to-right; also referenced ids in body (store_id, menu_item_id, boost_ids, ingredient_id, delivery_vehicle_id) exist", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: all }
  - { priority: 5,  category: auth,                 check: "entity_backed role owns the target resource (Customer.id==X-User-ID for own order/subscription; Store.id==X-User-ID for StoreStaff ops; Store.franchisee_id==X-User-ID for Franchisee ops)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "ownership-scoped endpoints" }
  - { priority: 6,  category: state,                check: "Target resource in a valid state for the transition (fulfillment/payment/subscription/booking/reconciliation state preconditions)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 7,  category: state,                check: "Store.status == OPEN required to place/pay an order or confirm a catering booking", error_id: ERR_STORE_NOT_OPEN, http_status: 409, applies_to: "POST /orders, POST /orders/{id}/pay, POST /catering-bookings/{id}/confirm" }
  - { priority: 8,  category: state,                check: "OCC: expected_<parent>_version equals current parent.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /stores/{id}, POST /subscriptions/{id}/change-plan" }
  - { priority: 9,  category: business_safety,      check: "No line allergen intersects customer.allergen_avoid (allergen/nutrition safety)", error_id: ERR_ALLERGEN_CONFLICT, http_status: 422, applies_to: "POST /orders" }
  - { priority: 10, category: business_referential, check: "use_subscription_credit requires the customer to have a subscription with status==ACTIVE", error_id: ERR_NO_ACTIVE_SUBSCRIPTION, http_status: 409, applies_to: "POST /orders, POST /orders/{id}/pay" }
  - { priority: 11, category: business_temporal,    check: "Catering windows valid: prep_window_start < prep_window_end (and for DELIVERY delivery_window_start < delivery_window_end), both not in the past relative to clock", error_id: ERR_INVALID_WINDOW, http_status: 422, applies_to: "POST /stores/{id}/catering-bookings" }
  - { priority: 12, category: business_constraint,  check: "DeliveryVehicle.status == AVAILABLE for a DELIVERY booking's vehicle", error_id: ERR_VEHICLE_UNAVAILABLE, http_status: 409, applies_to: "POST /stores/{id}/catering-bookings" }
  - { priority: 13, category: business_temporal,    check: "Delivery window does not overlap another active booking on the same vehicle (half-open; adjacency allowed)", error_id: ERR_VEHICLE_DOUBLE_BOOKED, http_status: 409, applies_to: "POST /stores/{id}/catering-bookings" }
  - { priority: 14, category: business_constraint,  check: "Sum of headcount over active bookings whose prep window overlaps (half-open) plus this booking's headcount <= Store.catering_capacity", error_id: ERR_CATERING_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /stores/{id}/catering-bookings" }
  - { priority: 15, category: business_constraint,  check: "Aggregate required ingredient units <= sum of AVAILABLE lot remaining_qty at the store", error_id: ERR_INSUFFICIENT_INVENTORY, http_status: 409, applies_to: "POST /orders, POST /orders/{id}/pay" }
  - { priority: 16, category: business_constraint,  check: "Subscription.credits_remaining must be > 0 to apply a credit to a SMOOTHIE line when use_subscription_credit is set (else line simply charged full — not an error) ; a customer may hold at most one non-CANCELLED subscription", error_id: ERR_SUBSCRIPTION_EXISTS, http_status: 409, applies_to: "POST /customers/{id}/subscriptions" }
  - { priority: 17, category: business_fiscal,      check: "redeem_points <= customer.points_balance", error_id: ERR_INSUFFICIENT_POINTS, http_status: 422, applies_to: "POST /orders" }
  - { priority: 18, category: business_constraint,  check: "At most one non-POSTED reconciliation may exist per (store, business_date)", error_id: ERR_RECONCILIATION_EXISTS, http_status: 409, applies_to: "POST /stores/{id}/reconciliations" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Franchisee / Store / Vehicle ---
  - { method: POST,  path: "/franchisees", description: "Create a franchisee", roles: [PlatformAdmin], code: 201, input: [legal_name, contact_email, base_royalty_rate, marketing_fee_rate], output: Franchisee, side_effects: [] }
  - { method: GET,   path: "/franchisees/{id}", description: "Get a franchisee", roles: [PlatformAdmin, Franchisee], code: 200, input: [], output: Franchisee, side_effects: [] }
  - { method: GET,   path: "/franchisees/{id}/stores", description: "List a franchisee's stores (reverse of Store.franchisee_id)", roles: [PlatformAdmin, Franchisee], code: 200, input: ["status?", "limit?", "offset?"], output: "Store[]", side_effects: [] }
  - { method: POST,  path: "/franchisees/{id}/stores", description: "Create a store under a franchisee", roles: [PlatformAdmin, Franchisee], code: 201, input: [name, catering_capacity, "royalty_rate_override?"], output: Store, side_effects: ["Store created in SETUP"] }
  - { method: GET,   path: "/stores/{id}", description: "Get a store", roles: [PlatformAdmin, Franchisee, StoreStaff], code: 200, input: [], output: Store, side_effects: [] }
  - { method: PATCH, path: "/stores/{id}", description: "Update store config/status (OCC). Body carries expected_store_version and any of status/catering_capacity/royalty_rate_override", roles: [PlatformAdmin, Franchisee], code: 200, input: [expected_store_version, "status?", "catering_capacity?", "royalty_rate_override?"], output: Store, side_effects: ["state transition per Store machine", "increments Store.version by 1"] }
  - { method: POST,  path: "/stores/{id}/delivery-vehicles", description: "Add a delivery vehicle", roles: [Franchisee], code: 201, input: [label, headcount_capacity], output: DeliveryVehicle, side_effects: [] }
  - { method: GET,   path: "/stores/{id}/delivery-vehicles", description: "List store vehicles (reverse of DeliveryVehicle.store_id)", roles: [Franchisee, StoreStaff], code: 200, input: ["status?", "limit?", "offset?"], output: "DeliveryVehicle[]", side_effects: [] }
  - { method: PATCH, path: "/delivery-vehicles/{id}", description: "Set a vehicle's operational status (AVAILABLE/MAINTENANCE)", roles: [Franchisee], code: 200, input: [status], output: DeliveryVehicle, side_effects: ["DeliveryVehicle.status set; MAINTENANCE blocks new DELIVERY bookings"] }

  # --- Ingredients / Inventory ---
  - { method: POST,  path: "/ingredients", description: "Create an ingredient (franchisor catalog)", roles: [PlatformAdmin], code: 201, input: [name, unit, standard_cost_cents_per_unit, "allergen_tags?"], output: Ingredient, side_effects: [] }
  - { method: GET,   path: "/ingredients", description: "List ingredients", roles: [PlatformAdmin, Franchisee, StoreStaff, Customer], code: 200, input: ["limit?", "offset?"], output: "Ingredient[]", side_effects: [] }
  - { method: POST,  path: "/stores/{id}/inventory-lots", description: "Receive an inventory lot", roles: [StoreStaff], code: 201, input: [ingredient_id, qty_received, unit_cost_cents, received_at, expiry_date], output: InventoryLot, side_effects: ["lot AVAILABLE, remaining_qty=qty_received"] }
  - { method: GET,   path: "/inventory-lots/{id}", description: "Get an inventory lot", roles: [StoreStaff, Franchisee], code: 200, input: [], output: InventoryLot, side_effects: [] }
  - { method: GET,   path: "/inventory-lots", description: "List lots (reverse of InventoryLot.store_id and .ingredient_id)", roles: [StoreStaff, Franchisee], code: 200, input: ["store_id?", "ingredient_id?", "status?", "limit?", "offset?"], output: "InventoryLot[]", side_effects: [] }
  - { method: POST,  path: "/stores/{id}/spoilage-sweep", description: "Spoil all AVAILABLE lots at/after expiry (current clock); returns spoiled lots", roles: [StoreStaff, PlatformAdmin], code: 200, input: [], output: "InventoryLot[]", side_effects: ["expired AVAILABLE lots -> SPOILED", "Store.mtd_spoilage_cents incremented by write-offs"] }

  # --- Menu / Boosts ---
  - { method: POST,  path: "/menu-items", description: "Create a menu item", roles: [PlatformAdmin], code: 201, input: [name, category, base_price_cents, recipe, base_calories, "allergen_tags?"], output: MenuItem, side_effects: [] }
  - { method: GET,   path: "/menu-items", description: "List menu items", roles: [PlatformAdmin, Franchisee, StoreStaff, Customer], code: 200, input: ["category?", "limit?", "offset?"], output: "MenuItem[]", side_effects: [] }
  - { method: GET,   path: "/menu-items/{id}", description: "Get a menu item", roles: [PlatformAdmin, Franchisee, StoreStaff, Customer], code: 200, input: [], output: MenuItem, side_effects: [] }
  - { method: POST,  path: "/boosts", description: "Create a boost add-in", roles: [PlatformAdmin], code: 201, input: [name, price_cents, calories, "allergen_tags?"], output: BoostAddIn, side_effects: [] }
  - { method: GET,   path: "/boosts", description: "List boosts", roles: [PlatformAdmin, Franchisee, StoreStaff, Customer], code: 200, input: ["limit?", "offset?"], output: "BoostAddIn[]", side_effects: [] }

  # --- Customers / Subscriptions / Loyalty ---
  - { method: POST,  path: "/customers", description: "Register a customer", roles: [Anonymous, PlatformAdmin], code: 201, input: [email, full_name, "allergen_avoid?"], output: Customer, side_effects: ["BRONZE, points_balance 0"] }
  - { method: GET,   path: "/customers/{id}", description: "Get a customer", roles: [Customer, PlatformAdmin], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: POST,  path: "/customers/{id}/subscriptions", description: "Start a subscription", roles: [Customer], code: 201, input: [tier, monthly_fee_cents, included_smoothie_credits, "renewal_bonus_points?"], output: Subscription, side_effects: ["ACTIVE, cycle_index 1, credits_remaining=included_smoothie_credits"] }
  - { method: GET,   path: "/customers/{id}/subscriptions", description: "List customer subscriptions (reverse of Subscription.customer_id)", roles: [Customer, PlatformAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "Subscription[]", side_effects: [] }
  - { method: GET,   path: "/subscriptions/{id}", description: "Get a subscription", roles: [Customer, PlatformAdmin], code: 200, input: [], output: Subscription, side_effects: [] }
  - { method: POST,  path: "/subscriptions/{id}/renew", description: "Run a renewal cycle (billing); payment_outcome drives cyclic transition", roles: [PlatformAdmin], code: 200, input: [payment_outcome], output: Subscription, side_effects: ["cyclic per Subscription machine", "SUBSCRIPTION_BONUS PointsTransaction on success"] }
  - { method: POST,  path: "/subscriptions/{id}/change-plan", description: "Change plan (OCC supersede)", roles: [Customer], code: 200, input: [expected_subscription_version, tier, monthly_fee_cents, included_smoothie_credits, "renewal_bonus_points?"], output: Subscription, side_effects: ["plan superseded", "credits reset", "increments Subscription.version by 1"] }
  - { method: POST,  path: "/subscriptions/{id}/cancel", description: "Cancel a subscription", roles: [Customer], code: 200, input: [], output: Subscription, side_effects: ["-> CANCELLED, credits 0"] }
  - { method: GET,   path: "/customers/{id}/points-transactions", description: "Loyalty ledger by customer (reverse of PointsTransaction.customer_id)", roles: [Customer, PlatformAdmin], code: 200, input: ["reason?", "limit?", "offset?"], output: "PointsTransaction[]", side_effects: [] }
  - { method: GET,   path: "/orders/{id}/points-transactions", description: "Loyalty entries for an order (reverse of PointsTransaction.order_id)", roles: [Customer, StoreStaff, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "PointsTransaction[]", side_effects: [] }

  # --- Orders ---
  - { method: POST,  path: "/orders", description: "Place an order-ahead (computes pricing, nutrition, allergen summary; validates availability, safety, points)", roles: [Customer], code: 201, input: [store_id, lines, "redeem_points?", "use_subscription_credit?"], output: Order, side_effects: ["compute order_line_pricing, order_total_assembly, order_nutrition"] }
  - { method: GET,   path: "/orders/{id}", description: "Get an order", roles: [Customer, StoreStaff, PlatformAdmin], code: 200, input: [], output: Order, side_effects: [] }
  - { method: GET,   path: "/orders", description: "List orders (reverse of Order.store_id and .customer_id)", roles: [Customer, StoreStaff, PlatformAdmin], code: 200, input: ["store_id?", "customer_id?", "status?", "limit?", "offset?"], output: "Order[]", side_effects: [] }
  - { method: POST,  path: "/orders/{id}/pay", description: "Pay: PENDING->PAID, PLACED->PREPARING; consume FIFO inventory; earn points", roles: [Customer], code: 200, input: [], output: Order, side_effects: ["inventory_fifo_consumption", "cogs_provisional", "EARN PointsTransaction cascade -> balance -> tier", "decrement subscription credits"] }
  - { method: POST,  path: "/orders/{id}/ready", description: "Mark PREPARING->READY", roles: [StoreStaff], code: 200, input: [], output: Order, side_effects: [] }
  - { method: POST,  path: "/orders/{id}/complete", description: "Mark READY->PICKED_UP; lock final COGS", roles: [StoreStaff], code: 200, input: [], output: Order, side_effects: ["cogs_final locked", "stamp completed_at"] }
  - { method: POST,  path: "/orders/{id}/cancel", description: "Cancel; compensate inventory, points, credits; refund payment", roles: [Customer, StoreStaff], code: 200, input: [], output: Order, side_effects: ["restore inventory", "CLAWBACK PointsTransaction cascade", "restore credits", "REFUNDED if was PAID"] }

  # --- Catering ---
  - { method: POST,  path: "/stores/{id}/catering-bookings", description: "Create a catering booking (store capacity + vehicle exclusivity temporal checks)", roles: [Customer], code: 201, input: [customer_id, fulfillment_type, headcount, items, prep_window_start, prep_window_end, "delivery_vehicle_id?", "delivery_window_start?", "delivery_window_end?"], output: CateringBooking, side_effects: ["catering_quote", "temporal overlap checks"] }
  - { method: GET,   path: "/catering-bookings/{id}", description: "Get a catering booking", roles: [Customer, StoreStaff, PlatformAdmin], code: 200, input: [], output: CateringBooking, side_effects: [] }
  - { method: GET,   path: "/catering-bookings", description: "List bookings (reverse of store_id, customer_id, delivery_vehicle_id)", roles: [Customer, StoreStaff, PlatformAdmin], code: 200, input: ["store_id?", "customer_id?", "delivery_vehicle_id?", "status?", "limit?", "offset?"], output: "CateringBooking[]", side_effects: [] }
  - { method: POST,  path: "/catering-bookings/{id}/confirm", description: "Confirm a booking", roles: [StoreStaff], code: 200, input: [], output: CateringBooking, side_effects: [] }
  - { method: POST,  path: "/catering-bookings/{id}/cancel", description: "Cancel a booking (frees capacity/vehicle window)", roles: [Customer, StoreStaff], code: 200, input: [], output: CateringBooking, side_effects: [] }
  - { method: POST,  path: "/catering-bookings/{id}/complete", description: "Complete a booking", roles: [StoreStaff], code: 200, input: [], output: CateringBooking, side_effects: [] }

  # --- Reconciliation ---
  - { method: POST,  path: "/stores/{id}/reconciliations", description: "Open a daily reconciliation (computes expected/gross/net sales)", roles: [StoreStaff], code: 201, input: [business_date], output: DailyReconciliation, side_effects: ["reconciliation_expected_and_variance (expected/gross/net)"] }
  - { method: GET,   path: "/stores/{id}/reconciliations", description: "List reconciliations (reverse of DailyReconciliation.store_id)", roles: [StoreStaff, Franchisee], code: 200, input: ["business_date?", "status?", "limit?", "offset?"], output: "DailyReconciliation[]", side_effects: [] }
  - { method: GET,   path: "/reconciliations/{id}", description: "Get a reconciliation", roles: [StoreStaff, Franchisee, PlatformAdmin], code: 200, input: [], output: DailyReconciliation, side_effects: [] }
  - { method: POST,  path: "/reconciliations/{id}/count", description: "Enter counted cash; compute variance", roles: [StoreStaff], code: 200, input: [counted_cash_cents], output: DailyReconciliation, side_effects: ["variance_cents set"] }
  - { method: POST,  path: "/reconciliations/{id}/post", description: "Post: compute royalty (basis + rebate), marketing; accrue to franchisee", roles: [Franchisee, PlatformAdmin], code: 200, input: ["royalty_basis?"], output: DailyReconciliation, side_effects: ["royalty_computation", "increment Franchisee.lifetime_royalty_cents"] }

  # --- Test-driving clock ---
  - { method: POST,  path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z (used before any set call; never real wall-clock).", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock set for expiry/window/stamp comparisons"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,          http: 401, condition: "Missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_UNAUTHORIZED,             http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_INVALID_REQUEST,          http: 400, condition: "Malformed body/query: missing required field, bad enum, negative number, pagination out of range" }
  - { id: ERR_NOT_FOUND,                http: 404, condition: "Path resource or referenced id (store/menu-item/boost/ingredient/vehicle/customer) does not exist" }
  - { id: ERR_NOT_RESOURCE_OWNER,       http: 403, condition: "entity_backed caller is not the owner of the target resource" }
  - { id: ERR_INVALID_STATE,            http: 409, condition: "Transition not allowed from the resource's current state" }
  - { id: ERR_STORE_NOT_OPEN,           http: 409, condition: "Store.status != OPEN when placing/paying an order or confirming a booking" }
  - { id: ERR_STALE_VERSION,            http: 412, condition: "OCC: expected_<parent>_version != current parent.version" }
  - { id: ERR_ALLERGEN_CONFLICT,        http: 422, condition: "A line's allergen set intersects the customer's allergen_avoid" }
  - { id: ERR_NO_ACTIVE_SUBSCRIPTION,   http: 409, condition: "use_subscription_credit set but customer has no ACTIVE subscription" }
  - { id: ERR_INVALID_WINDOW,           http: 422, condition: "Catering window start>=end or window in the past" }
  - { id: ERR_VEHICLE_UNAVAILABLE,      http: 409, condition: "DELIVERY booking references a vehicle whose status != AVAILABLE" }
  - { id: ERR_VEHICLE_DOUBLE_BOOKED,    http: 409, condition: "Delivery window overlaps another active booking on the same vehicle" }
  - { id: ERR_CATERING_CAPACITY_EXCEEDED, http: 409, condition: "Overlapping prep-window headcount would exceed Store.catering_capacity" }
  - { id: ERR_INSUFFICIENT_INVENTORY,   http: 409, condition: "Required ingredient units exceed AVAILABLE lot remaining_qty" }
  - { id: ERR_SUBSCRIPTION_EXISTS,      http: 409, condition: "Customer already has a non-CANCELLED subscription" }
  - { id: ERR_INSUFFICIENT_POINTS,      http: 422, condition: "redeem_points exceeds customer.points_balance" }
  - { id: ERR_RECONCILIATION_EXISTS,    http: 409, condition: "A non-POSTED reconciliation already exists for (store, business_date)" }
  - { id: ERR_VALIDATION,               http: 422, condition: "Semantically invalid but well-formed request not covered by a more specific business error" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Franchisor operator; manages global catalog (ingredients/menu/boosts), runs subscription renewals and spoilage sweeps, sets the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /franchisees"
      - "POST /ingredients"
      - "POST /menu-items"
      - "POST /boosts"
      - "POST /subscriptions/{id}/renew"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across all resources"
      - "POST /franchisees/{id}/stores"
      - "POST /stores/{id}/spoilage-sweep"
      - "POST /reconciliations/{id}/post"

  - name: Franchisee
    description: "Multi-unit owner; creates/configures own stores and vehicles, posts reconciliations, views royalty."
    identity: "entity_backed:Franchisee"
    exclusive_operations:
      - "PATCH /stores/{id}"
      - "POST /stores/{id}/delivery-vehicles"
    shared_operations:
      - "POST /franchisees/{id}/stores"
      - "POST /reconciliations/{id}/post"
      - "GET reads of own franchisee/stores/vehicles/reconciliations"

  - name: StoreStaff
    description: "Operates a single store; receives inventory, advances order fulfillment, opens/counts reconciliations, manages catering."
    identity: "entity_backed:Store"
    exclusive_operations:
      - "POST /stores/{id}/inventory-lots"
      - "POST /orders/{id}/ready"
      - "POST /orders/{id}/complete"
      - "POST /catering-bookings/{id}/confirm"
      - "POST /catering-bookings/{id}/complete"
      - "POST /stores/{id}/reconciliations"
      - "POST /reconciliations/{id}/count"
    shared_operations:
      - "POST /stores/{id}/spoilage-sweep"
      - "POST /orders/{id}/cancel"
      - "POST /catering-bookings/{id}/cancel"
      - "GET reads scoped to own store"

  - name: Customer
    description: "Loyalty member; registers, places/pays/cancels own orders, manages subscription, books catering."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /customers/{id}/subscriptions"
      - "POST /subscriptions/{id}/change-plan"
      - "POST /subscriptions/{id}/cancel"
      - "POST /orders"
      - "POST /orders/{id}/pay"
      - "POST /stores/{id}/catering-bookings"
    shared_operations:
      - "POST /orders/{id}/cancel"
      - "POST /catering-bookings/{id}/cancel"
      - "GET reads of own customer/orders/subscriptions/points"

  - name: Anonymous
    description: "Unauthenticated visitor; may self-register a customer account."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /customers"
