# =============================================================================
# task_2587 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7. Sections and claim_type values come from
# references/claim-extraction-guide.md; nothing here duplicates §1.8, and every
# corner §1.8 already asserts is emitted as an `excluded_because:` stub.
# Every numeric literal was executed against the §1.3 formulas in Python.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: asset_creation_returns_the_declared_field_set_with_system_defaults
        claim_type: creation
        grounds:
          - entities.Asset
          - endpoints.POST_/pentest/assets
        distinguishing_aspect: "A freshly registered Asset comes back 201 with exposure_state MONITORED, all three finding counters at 0 and last_cleared_at null — no finding has touched it yet."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pentest/assets"
              payload: { name: "Payments API", asset_class: "APPLICATION", criticality_tier: 1, compliance_regimes: ["SOC2"], exposure_score: 88, last_tested_at: "2025-10-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { asset_a_id: $.data.id, a_state: $.data.exposure_state }
          assert:
            - "HTTP 201 and ${a_state} == MONITORED"
            - "name == Payments API, asset_class == APPLICATION, criticality_tier == 1, compliance_regimes == [SOC2], exposure_score == 88, last_tested_at == 2025-10-02T00:00:00Z"
            - "open_finding_count == 0, open_critical_finding_count == 0, remediated_finding_count == 0, last_cleared_at == null"
            - "id is present and version == 1"

      - name: asset_retrieval_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - entities.Asset
          - endpoints.GET_/pentest/assets/{id}
        distinguishing_aspect: "GET /pentest/assets/{id} echoes exactly what POST stored — a read path that neither recomputes nor defaults anything."
        test_recipe:
          setup:
            - "One Asset registered at clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pentest/assets"
              payload: { name: "Payments API", asset_class: "APPLICATION", criticality_tier: 1, compliance_regimes: ["SOC2"], exposure_score: 88, last_tested_at: "2025-10-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { asset_a_id: $.data.id }
          trigger:
            - call: "GET /pentest/assets/${asset_a_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { got_id: $.data.id, got_score: $.data.exposure_score, got_state: $.data.exposure_state }
          assert:
            - "HTTP 200, ${got_id} == ${asset_a_id}, ${got_score} == 88, ${got_state} == MONITORED"
            - "criticality_tier == 1 and compliance_regimes == [SOC2]"

      - name: asset_listing_paginates_and_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Asset
          - endpoints.GET_/pentest/assets
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three registered assets read with limit 2: the first page carries 2 rows with total_count 3 and has_more true, the second page carries 1 row with has_more false."
        test_recipe:
          setup:
            - "Three Assets registered in order: Payments API (tier 1), Billing Cluster (tier 2), Wiki (tier 3)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pentest/assets"
              payload: { name: "Payments API", asset_class: "APPLICATION", criticality_tier: 1, compliance_regimes: ["SOC2"], exposure_score: 88, last_tested_at: "2025-10-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { asset_a_id: $.data.id }
            - call: "POST /pentest/assets"
              payload: { name: "Billing Cluster", asset_class: "NETWORK", criticality_tier: 2, compliance_regimes: ["SOC2"], exposure_score: 55, last_tested_at: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
              captures: { asset_b_id: $.data.id }
            - call: "POST /pentest/assets"
              payload: { name: "Wiki", asset_class: "APPLICATION", criticality_tier: 3, compliance_regimes: [], exposure_score: 20 }
              as: PlatformAdmin
              captures: { asset_c_id: $.data.id }
          trigger:
            - call: "GET /pentest/assets"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
              captures: { first_page_head: "$.data[0].id" }
            - call: "GET /pentest/assets"
              payload: { limit: 2, offset: 2 }
              as: PlatformAdmin
              captures: { second_page_head: "$.data[0].id" }
          assert:
            - "first call: HTTP 200, response_type == array, exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second call: exactly 1 row, total_count == 3, has_more == false, offset == 2"
            - "${first_page_head} != ${second_page_head} — the pages are disjoint"

      - name: asset_get_with_unknown_id_returns_asset_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_ASSET_NOT_FOUND]
          - validations.priority_4
        distinguishing_aspect: "A syntactically valid but unregistered asset id resolves to nothing, so the left-to-right path-id resolution rule answers 404 ERR_ASSET_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty asset inventory."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /pentest/assets/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and ${err} == ERR_ASSET_NOT_FOUND"
            - "response_type == error"

      - name: asset_creation_without_exposure_score_is_rejected
        claim_type: required_fields
        grounds:
          - entities.Asset.fields.exposure_score
          - validations.priority_5
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "exposure_score has source input and no default, so omitting it is a 400 ERR_INVALID_REQUEST rather than a silent 0."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pentest/assets"
              payload: { name: "Payments API", asset_class: "APPLICATION", criticality_tier: 1, compliance_regimes: ["SOC2"] }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and ${err} == ERR_INVALID_REQUEST"
            - "no Asset row was created: a following GET /pentest/assets returns total_count == 0"

      - name: tester_max_concurrent_engagements_defaults_to_two
        claim_type: defaults
        grounds:
          - entities.Tester.fields.max_concurrent_engagements
          - endpoints.POST_/pentest/testers
        distinguishing_aspect: "Omitting the optional max_concurrent_engagements yields exactly 2, and the tester starts PENDING_CLEARANCE with background_check_status PENDING."
        test_recipe:
          setup:
            - "Empty tester roster; clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pentest/testers"
              payload: { full_name: "Tester One", certifications: ["OSCP", "GPEN"], clearance_expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { t1_id: $.data.id, t1_max: $.data.max_concurrent_engagements, t1_state: $.data.availability_state, t1_bg: $.data.background_check_status, t1_q: $.data.qualification_score }
          assert:
            - "HTTP 201, ${t1_max} == 2, ${t1_state} == PENDING_CLEARANCE, ${t1_bg} == PENDING"
            - "${t1_q} == 80 — OSCP 45 + GPEN 35, computed at creation"
            - "background_check_at == null and active_assignment_count == 0"

      - name: test_plan_prioritization_mode_defaults_to_risk_driven
        claim_type: defaults
        grounds:
          - entities.TestPlan.fields.prioritization_mode
          - entities.TestPlan.fields.admission_threshold
        distinguishing_aspect: "A plan created without prioritization_mode scores RISK_DRIVEN, and admission_threshold is derived as 100 - risk_appetite_score (60 for appetite 40)."
        test_recipe:
          setup:
            - "Empty database; clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pentest/test-plans"
              payload: { fiscal_year: 2026, risk_appetite_score: 40, planned_engagement_count: 5 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { plan_id: $.data.id, mode: $.data.prioritization_mode, thr: $.data.admission_threshold, st: $.data.status }
          assert:
            - "HTTP 201, ${mode} == RISK_DRIVEN, ${thr} == 60, ${st} == DRAFT"
            - "coverage_score == 0, total_risk_points == 0, open_risk_points == 0, closed_risk_points == 0, accepted_risk_points == 0, duplicate_risk_points == 0"
            - "version == 1"

      - name: asset_criticality_tier_outside_one_to_four_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Asset.fields.criticality_tier
          - validations.priority_5
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "criticality_tier is constrained to {1,2,3,4}; tier 5 is out of range and is refused before any scoring runs."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pentest/assets"
              payload: { name: "Payments API", asset_class: "APPLICATION", criticality_tier: 5, compliance_regimes: ["SOC2"], exposure_score: 88 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /pentest/assets"
              payload: { name: "Payments API", asset_class: "MAINFRAME", criticality_tier: 1, compliance_regimes: ["SOC2"], exposure_score: 88 }
              as: PlatformAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400 — tier 5 is outside {1,2,3,4}"
            - "${err2} == ERR_INVALID_REQUEST with HTTP 400 — MAINFRAME is not a member of the asset_class enum"

      - name: engagement_window_end_not_after_window_start_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Engagement.fields.window_end
          - validations.priority_5
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "window_end must be strictly greater than window_start; an equal pair is refused by the body-shape rule, before the plan-status or scope-item rules are consulted."
        test_recipe:
          setup:
            - "An ACTIVE plan with one APPROVED scope item on Asset A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pentest/assets"
              payload: { name: "Payments API", asset_class: "APPLICATION", criticality_tier: 1, compliance_regimes: ["SOC2"], exposure_score: 88, last_tested_at: "2025-10-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { asset_a_id: $.data.id }
            - call: "POST /pentest/test-plans"
              payload: { fiscal_year: 2026, risk_appetite_score: 40, planned_engagement_count: 5, prioritization_mode: "RISK_DRIVEN" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { plan_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /pentest/scope-items"
              payload: { test_plan_id: "${plan_id}", asset_id: "${asset_a_id}", justification: "Annual coverage of the payments surface", requested_engagement_hours: 120, expected_test_plan_version: "${plan_v1}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { si_a_id: $.data.id }
            - call: "POST /pentest/scope-items/${si_a_id}/decision"
              payload: { decision: "APPROVE", note: "In scope for FY2026" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /pentest/test-plans/${plan_id}/activate"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
          trigger:
            - call: "POST /pentest/engagements"
              payload: { test_plan_id: "${plan_id}", scope_item_id: "${si_a_id}", engagement_type: "APPLICATION_TEST", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-05T00:00:00Z", hours_allocated: 80 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and ${err} == ERR_INVALID_REQUEST"
            - "the ScopeItem stays APPROVED — a refused engagement never consumes it"

      - name: asset_system_fields_are_server_generated_and_start_at_version_one
        claim_type: system_fields
        grounds:
          - entities.Asset
          - response_envelope.success
        distinguishing_aspect: "id, created_at, updated_at and version are stamped by the server: created_at equals the logical clock at creation and version starts at 1."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pentest/assets"
              payload: { name: "Payments API", asset_class: "APPLICATION", criticality_tier: 1, compliance_regimes: ["SOC2"], exposure_score: 88, last_tested_at: "2025-10-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { asset_a_id: $.data.id, made_at: $.data.created_at, ver: $.data.version }
          assert:
            - "${made_at} == 2026-09-01T00:00:00Z and updated_at == 2026-09-01T00:00:00Z"
            - "${ver} == 1 and ${asset_a_id} is a server-generated id"
            - "meta.api_request_id and meta.api_request_timestamp are present and response_type == object"

      - name: scope_item_computed_score_and_rank_are_stamped_at_creation
        claim_type: computed_fields
        grounds:
          - entities.ScopeItem.fields.priority_score
          - entities.ScopeItem.fields.priority_rank
          - entities.ScopeItem.fields.scored_mode
          - calculations.scope_priority_score
        distinguishing_aspect: "The create response already carries priority_score 89.80, priority_rank 1, scored_mode RISK_DRIVEN and below_threshold_flag false — none of them is an input field, and none needs a second request to appear."
        test_recipe:
          setup:
            - "Asset A: APPLICATION, tier 1, [SOC2], exposure 88, last_tested_at 2025-10-02T00:00:00Z; clock 2026-09-01T00:00:00Z gives staleness 91."
            - "A DRAFT plan with risk_appetite_score 40, so admission_threshold is 60."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pentest/assets"
              payload: { name: "Payments API", asset_class: "APPLICATION", criticality_tier: 1, compliance_regimes: ["SOC2"], exposure_score: 88, last_tested_at: "2025-10-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { asset_a_id: $.data.id }
            - call: "POST /pentest/test-plans"
              payload: { fiscal_year: 2026, risk_appetite_score: 40, planned_engagement_count: 5, prioritization_mode: "RISK_DRIVEN" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { plan_id: $.data.id, plan_v1: $.data.version }
          trigger:
            - call: "POST /pentest/scope-items"
              payload: { test_plan_id: "${plan_id}", asset_id: "${asset_a_id}", justification: "Annual coverage of the payments surface", requested_engagement_hours: 120, expected_test_plan_version: "${plan_v1}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { si_a_id: $.data.id, sc: $.data.priority_score, rk: $.data.priority_rank, flag: $.data.below_threshold_flag, mode: $.data.scored_mode, st: $.data.status }
          assert:
            - "HTTP 201, ${sc} == 89.80 (0.45*88 + 0.30*100 + 0.20*91 + 0.05*40), ${rk} == 1, ${mode} == RISK_DRIVEN"
            - "${flag} == false — 89.80 is not below the admission_threshold of 60"
            - "${st} == PROPOSED and decision_note == null"

      - name: scope_item_creation_with_unknown_test_plan_is_rejected
        claim_type: parent_relationships
        grounds:
          - entities.ScopeItem.fields.test_plan_id
          - validations.priority_7
          - errors[ERR_TEST_PLAN_NOT_FOUND]
        distinguishing_aspect: "test_plan_id is a body foreign key, so an unregistered plan id is refused with 404 ERR_TEST_PLAN_NOT_FOUND before the OCC version comparison it would otherwise fail."
        test_recipe:
          setup:
            - "Asset A registered; no TestPlan exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pentest/assets"
              payload: { name: "Payments API", asset_class: "APPLICATION", criticality_tier: 1, compliance_regimes: ["SOC2"], exposure_score: 88, last_tested_at: "2025-10-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { asset_a_id: $.data.id }
            - call: "POST /pentest/test-plans"
              payload: { fiscal_year: 2026, risk_appetite_score: 40, planned_engagement_count: 5, prioritization_mode: "RISK_DRIVEN" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { plan_id: $.data.id, plan_v1: $.data.version }
          trigger:
            - call: "POST /pentest/scope-items"
              payload: { test_plan_id: "00000000-0000-4000-8000-000000000000", asset_id: "${asset_a_id}", justification: "Annual coverage of the payments surface", requested_engagement_hours: 120, expected_test_plan_version: "${plan_v1}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { err: $.data.error_id }
            - call: "POST /pentest/scope-items"
              payload: { test_plan_id: "${plan_id}", asset_id: "00000000-0000-4000-8000-000000000001", justification: "Annual coverage of the payments surface", requested_engagement_hours: 120, expected_test_plan_version: "${plan_v1}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { err2: $.data.error_id }
          assert:
            - "${err} == ERR_TEST_PLAN_NOT_FOUND with HTTP 404"
            - "${err2} == ERR_ASSET_NOT_FOUND with HTTP 404 — the same body-FK rule covers asset_id"
            - "the real plan's version is still 1 — neither refusal bumped it"

      - name: assignment_granted_asset_id_that_does_not_resolve_is_rejected
        claim_type: entity_topology_flat
        grounds:
          - entities.TesterAssignment.fields.granted_asset_ids
          - validations.priority_7
          - errors[ERR_ASSET_NOT_FOUND]
        distinguishing_aspect: "The topology is flat, so every member of the granted_asset_ids array is itself a foreign key: one unresolvable member sinks the whole request with 404 ERR_ASSET_NOT_FOUND, before the least-privilege subset rule at provisioning time."
        test_recipe:
          setup:
            - "An AUTHORIZED engagement on Asset A with a CLEARED tester; clock 2026-09-07T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pentest/assets"
              payload: { name: "Payments API", asset_class: "APPLICATION", criticality_tier: 1, compliance_regimes: ["SOC2"], exposure_score: 88, last_tested_at: "2025-10-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { asset_a_id: $.data.id }
            - call: "POST /pentest/test-plans"
              payload: { fiscal_year: 2026, risk_appetite_score: 40, planned_engagement_count: 5, prioritization_mode: "RISK_DRIVEN" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { plan_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /pentest/scope-items"
              payload: { test_plan_id: "${plan_id}", asset_id: "${asset_a_id}", justification: "Annual coverage of the payments surface", requested_engagement_hours: 120, expected_test_plan_version: "${plan_v1}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { si_a_id: $.data.id }
            - call: "POST /pentest/scope-items/${si_a_id}/decision"
              payload: { decision: "APPROVE", note: "In scope for FY2026" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /pentest/test-plans/${plan_id}/activate"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /pentest/engagements"
              payload: { test_plan_id: "${plan_id}", scope_item_id: "${si_a_id}", engagement_type: "APPLICATION_TEST", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-30T23:59:59Z", hours_allocated: 80 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { eng_id: $.data.id }
            - call: "POST /pentest/rules-of-engagement"
              payload: { engagement_id: "${eng_id}", exclusions: [], allowed_techniques: ["SQLI"], emergency_stop_procedure: "Halt traffic and call the escalation contact", escalation_contact: "soc@example.com" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { roe_id: $.data.id }
            - call: "POST /pentest/authorized-targets"
              payload: { roe_id: "${roe_id}", asset_id: "${asset_a_id}", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-30T23:59:59Z", technique_allowlist: ["SQLI"] }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { tgt_a_id: $.data.id }
            - call: "POST /pentest/rules-of-engagement/${roe_id}/sign"
              payload: { signature_note: "Authorized for FY2026 window" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /pentest/testers"
              payload: { full_name: "Tester One", certifications: ["OSCP", "GPEN"], clearance_expires_at: "2027-01-01T00:00:00Z", max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /pentest/testers/${t1_id}/background-check"
              payload: { result: "CLEARED" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T08:00:00Z" }
              as: PlatformAdmin
            - call: "GET /pentest/engagements/${eng_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { eng_v_a: $.data.version }
          trigger:
            - call: "POST /pentest/tester-assignments"
