            - call: "POST /cbb/collections"
              payload: { kit_id: "${kit_b2_id}", collected_at: "2026-08-10T05:00:00Z", collection_volume_ml: 130.0, anticoagulant_volume_ml: 25.0, delivery_mode: "VAGINAL" }
              as: CollectionSite
              captures: { col_b2_id: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T05:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/collections/${col_b1_id}/receive"
              payload: { transport_temp_c: 20.0 }
              as: ProcessingTechnologist
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T05:30:00Z" }
