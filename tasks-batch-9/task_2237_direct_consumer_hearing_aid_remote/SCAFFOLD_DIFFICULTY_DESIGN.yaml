        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "StatePolicy CA with trial_period_days 60, restocking_fee_mode PROHIBITED and shipping_refundable true, so the settlement is a full refund and never masks the state gate."
