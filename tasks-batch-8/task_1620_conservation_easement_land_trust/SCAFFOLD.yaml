# =============================================================================
# PRD Benchmark Seed Tables — task_1620_conservation_easement_land_trust
# Conservation Easement & Land Trust Stewardship
# =============================================================================

scenario: |
  Conservation Easement & Land Trust Stewardship (land trust stewardship program): easement terms & permitted-use matrix, baseline documentation report, annual monitoring visit & violation detection, amendment/discretionary approval process, landowner succession & notice, enforcement & remediation agreement, stewardship endowment accounting, appraisal & tax-deduction substantiation

domain_name: conservation-easement-stewardship
api_prefix: /stewardship

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat            # peer entities linked by FKs; no nested URL paths
  state_machine_shape: cyclic      # amendment/baseline/enforcement revision loops + posture-driven gating on Easement
  relationship_patterns:
    - one_to_many
    - self_referential             # Landowner.predecessor_landowner_id
    - cross_aggregate              # UseAuthorization freeze vs AmendmentRequest; Violation vs matrix cell
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Easement
    parent: null
    common_fields: true
    fields:
      - { name: easement_name, type: string, source: input, description: "Legal name of the conservation easement" }
      - { name: grantor_name, type: string, source: input, description: "Name of the granting landowner at recordation" }
      - { name: parcel_acreage, type: integer, source: input, description: "Encumbered acreage; must be > 0" }
      - { name: permitted_use_matrix, type: object, source: input, description: "Map of use_type -> PERMITTED | DISCRETIONARY | PROHIBITED; at least one key required; mutated only by approved AmendmentRequest" }
      - { name: monitoring_interval_months, type: integer, source: input, default: 12, description: "Months between required monitoring visits; 6..36" }
      - { name: status, type: enum, source: system, description: "DRAFT | RECORDED" }
      - { name: posture, type: enum, source: computed, description: "Derived gate: ENFORCEMENT_ACTIVE if any EnforcementAction in {PROPOSED,EXECUTED,BREACHED}; else VIOLATION_OPEN if any Violation in {OPEN,NOTICE_SENT,CURE_IN_PROGRESS,ESCALATED}; else MONITORING_DUE if clock date > next_monitoring_due_on; else GOOD_STANDING" }
      - { name: current_landowner_id, type: string, source: system, description: "FK -> Landowner.id; the single ACTIVE landowner; set at first landowner creation, flipped by succession record" }
      - { name: recorded_on, type: string, source: system, description: "ISO date (YYYY-MM-DD) the easement transitioned to RECORDED; null while DRAFT" }
      - { name: last_monitoring_completed_on, type: string, source: system, description: "ISO date of most recent COMPLETED MonitoringVisit.actual_visit_on; null until first completion" }
      - { name: next_monitoring_due_on, type: string, source: computed, description: "= (last_monitoring_completed_on else recorded_on) + monitoring_interval_months months, day clamped to month end; null while DRAFT" }
      - { name: open_violation_count, type: integer, source: computed, description: "Count of Violations in {OPEN, NOTICE_SENT, CURE_IN_PROGRESS, ESCALATED} for this easement" }
      - { name: amendment_count, type: integer, source: computed, description: "Count of AmendmentRequests reaching APPROVED for this easement" }

  - name: Landowner
    parent: null
    common_fields: true
    fields:
      - { name: easement_id, type: string, source: input, description: "FK -> Easement.id; encumbered parcel" }
      - { name: predecessor_landowner_id, type: string, source: system, description: "FK -> Landowner.id; null for the initial owner; set to the superseded owner on succession" }
      - { name: owner_name, type: string, source: input, description: "Legal name of the owner" }
      - { name: contact_email, type: string, source: input, description: "Notice address" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PENDING_SUCCESSION | SUPERSEDED" }
      - { name: acquired_on, type: string, source: system, description: "ISO date ownership became effective (creation date for initial owner, succession record date otherwise)" }

  - name: BaselineReport
    parent: null
    common_fields: true
    fields:
      - { name: easement_id, type: string, source: input, description: "FK -> Easement.id; exactly one BaselineReport per easement ever" }
      - { name: prepared_by_user_id, type: string, source: input, description: "Opaque id of the preparer; segregation-of-duties anchor for accept and appraisal conflict checks" }
      - { name: condition_narrative, type: string, source: input, description: "Documented condition of conservation values" }
      - { name: photo_point_count, type: integer, source: input, description: "Number of georeferenced photo points documented; >= 0" }
      - { name: required_photo_points, type: integer, source: computed, description: "= max(4, ceil(Easement.parcel_acreage / 100)) evaluated at submit time" }
      - { name: review_round, type: integer, source: system, description: "Starts 0; +1 on each submit transition (including resubmit after REVISION_REQUESTED)" }
      - { name: submitted_on, type: string, source: system, description: "ISO date of last DRAFT|REVISION_REQUESTED -> SUBMITTED transition" }
      - { name: accepted_on, type: string, source: system, description: "ISO date of SUBMITTED -> ACCEPTED; null until accepted" }
      - { name: revision_notes, type: string, source: input, description: "Reviewer notes captured on request-revision" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | REVISION_REQUESTED | ACCEPTED" }

  - name: MonitoringVisit
    parent: null
    common_fields: true
    fields:
      - { name: easement_id, type: string, source: input, description: "FK -> Easement.id; easement must be RECORDED" }
      - { name: monitor_user_id, type: string, source: input, description: "Opaque FieldMonitor id assigned to the visit; overlap resource key" }
      - { name: window_start_on, type: string, source: input, description: "ISO date; planned field window start (inclusive)" }
      - { name: window_end_on, type: string, source: input, description: "ISO date; planned field window end (exclusive); must be > window_start_on" }
      - { name: actual_visit_on, type: string, source: input, description: "ISO date supplied at complete; must lie within [window_start_on, window_end_on)" }
      - { name: findings_summary, type: string, source: input, description: "Field narrative supplied at complete" }
      - { name: stewardship_cost_cents, type: integer, source: input, description: "Cost of the visit in cents, supplied at complete; >= 0" }
      - { name: on_time, type: boolean, source: computed, description: "= actual_visit_on <= Easement.next_monitoring_due_on as captured at complete time" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - { name: easement_id, type: string, source: input, description: "FK -> Easement.id" }
      - { name: monitoring_visit_id, type: string, source: input, description: "FK -> MonitoringVisit.id; optional; when present the visit must be COMPLETED" }
      - { name: detected_by_user_id, type: string, source: input, description: "Opaque id of the detecting staffer; segregation-of-duties anchor for resolve" }
      - { name: violation_type, type: string, source: input, description: "Must be a key of the easement's current permitted_use_matrix" }
      - { name: severity, type: enum, source: input, description: "MINOR | MATERIAL | IRREPARABLE" }
      - { name: detected_on, type: string, source: input, description: "ISO date of detection" }
      - { name: notice_served_on, type: string, source: system, description: "ISO clock date at send-notice" }
      - { name: cure_deadline_on, type: string, source: computed, description: "= notice_served_on + CURE_DAYS[severity] (MINOR 90, MATERIAL 30, IRREPARABLE 7)" }
      - { name: resolved_on, type: string, source: system, description: "ISO date of resolution; null until RESOLVED" }
      - { name: resolution_verified_by_user_id, type: string, source: system, description: "X-User-ID of the resolving coordinator or completing enforcement actor" }
      - { name: escalated_by, type: enum, source: system, description: "MANUAL | CLOCK_SWEEP; null until ESCALATED" }
      - { name: status, type: enum, source: system, description: "OPEN | NOTICE_SENT | CURE_IN_PROGRESS | ESCALATED | RESOLVED" }

  - name: AmendmentRequest
    parent: null
    common_fields: true
    fields:
      - { name: easement_id, type: string, source: input, description: "FK -> Easement.id; easement must be RECORDED" }
      - { name: submitted_by_user_id, type: string, source: input, description: "Opaque id of submitter; segregation-of-duties anchor for approve" }
      - { name: requested_changes, type: array, source: input, description: "Array of {use_type, new_level}; new_level in {PERMITTED, DISCRETIONARY, PROHIBITED} and must differ from the current matrix cell; every use_type must exist in the matrix" }
      - { name: affected_acreage, type: integer, source: input, description: "Acres affected; 1..Easement.parcel_acreage" }
      - { name: materiality_score, type: integer, source: computed, description: "0..100 per calculations.amendment_materiality_score; recomputed on create and resubmit" }
      - { name: review_path, type: enum, source: computed, description: "BOARD if materiality_score >= 70 else STAFF" }
      - { name: revision_notes, type: string, source: input, description: "Captured on request-revision" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of approver/rejecter" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | STAFF_REVIEW | REVISION_REQUESTED | BOARD_REVIEW | APPROVED | REJECTED | WITHDRAWN" }

  - name: UseAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: easement_id, type: string, source: input, description: "FK -> Easement.id" }
      - { name: use_type, type: string, source: input, description: "Key into permitted_use_matrix; cell must be DISCRETIONARY at request time" }
      - { name: requested_by_landowner_id, type: string, source: system, description: "FK -> Landowner.id; set from X-User-ID; must be the easement's current ACTIVE landowner" }
      - { name: justification, type: string, source: input, description: "Landowner's case for the discretionary use" }
      - { name: decision, type: enum, source: system, description: "APPROVED | APPROVED_WITH_CONDITIONS | DENIED; null until decided" }
      - { name: conditions, type: array, source: input, description: "Condition strings; required non-empty iff decision == APPROVED_WITH_CONDITIONS" }
      - { name: decision_reason, type: string, source: system, description: "Free text on decide; system writes AMENDMENT_SUPERSEDES when auto-denied by an approved amendment" }
      - { name: conditions_breached, type: boolean, source: system, default: false, description: "Set true when a Violation is created against this use_type while this authorization is active" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | APPROVED_WITH_CONDITIONS | DENIED" }

  - name: EnforcementAction
    parent: null
    common_fields: true
    fields:
      - { name: violation_id, type: string, source: system, description: "FK -> Violation.id; set at creation (violation escalation)" }
      - { name: easement_id, type: string, source: system, description: "FK -> Easement.id; denormalized from the violation at creation" }
      - { name: agreement_terms, type: string, source: input, description: "Remediation agreement text; supplied at execute and renegotiate" }
      - { name: remediation_cost_cents, type: integer, source: input, description: "Agreed remediation budget; >= 0; refreshed at renegotiate" }
      - { name: executed_by_user_id, type: string, source: system, description: "X-User-ID at execute; segregation-of-duties anchor for complete" }
      - { name: completed_by_user_id, type: string, source: system, description: "X-User-ID at complete" }
      - { name: breach_notes, type: string, source: input, description: "Captured on breach" }
      - { name: status, type: enum, source: system, description: "PROPOSED | EXECUTED | BREACHED | COMPLETED" }

  - name: SuccessionNotice
    parent: null
    common_fields: true
    fields:
      - { name: easement_id, type: string, source: input, description: "FK -> Easement.id" }
      - { name: successor_landowner_id, type: string, source: system, description: "FK -> Landowner.id; successor row created (PENDING_SUCCESSION) at notice creation" }
      - { name: predecessor_landowner_id, type: string, source: system, description: "FK -> Landowner.id; the ACTIVE landowner at notice creation" }
      - { name: transfer_on, type: string, source: input, description: "ISO date of planned transfer; must be >= notice_given_on + 30 days" }
      - { name: notice_given_on, type: string, source: system, description: "ISO clock date at creation" }
      - { name: ack_deadline_on, type: string, source: computed, description: "= notice_given_on + 45 days" }
      - { name: recorded_on, type: string, source: system, description: "ISO clock date at record; null until RECORDED" }
      - { name: status, type: enum, source: system, description: "NOTICE_GIVEN | ACKNOWLEDGED | RECORDED | EXPIRED" }

  - name: Appraisal
    parent: null
    common_fields: true
    fields:
      - { name: easement_id, type: string, source: input, description: "FK -> Easement.id" }
      - { name: appraiser_user_id, type: string, source: input, description: "Opaque Appraiser id; overlap resource key; conflict-of-interest anchor" }
      - { name: effective_on, type: string, source: input, description: "ISO effective date of valuation; must be >= gift_on - 60 days to substantiate" }
      - { name: gift_on, type: string, source: input, description: "ISO date of the easement gift (contribution date)" }
      - { name: contiguous_enhancement_applies, type: boolean, source: input, description: "Whether the gift enhances value of contiguous retained land; selects the deduction variant" }
      - { name: before_value_cents, type: integer, source: input, description: "FMV before the easement; supplied at deliver; > 0" }
      - { name: after_value_cents, type: integer, source: input, description: "FMV after the easement; supplied at deliver; >= 0" }
      - { name: enhancement_value_cents, type: integer, source: input, default: 0, description: "Value added to contiguous retained land; only subtracted when contiguous_enhancement_applies is true" }
      - { name: deductible_value_cents, type: integer, source: computed, description: "Computed at certify per calculations.deductible_value; null until CERTIFIED" }
      - { name: status, type: enum, source: system, description: "ENGAGED | DELIVERED | CERTIFIED | WITHDRAWN" }

  - name: EndowmentFund
    parent: null
    common_fields: true
    fields:
      - { name: easement_id, type: string, source: input, description: "FK -> Easement.id; exactly one fund per easement ever" }
      - { name: spending_rate_bps, type: integer, source: input, description: "Annual spending policy rate in basis points; 100..800" }
      - { name: principal_floor_cents, type: integer, source: input, description: "Restricted principal floor; draws below this require board authority; >= 0" }
      - { name: status, type: enum, source: system, description: "INITIALIZING | ACTIVE (ACTIVE on first CONTRIBUTION)" }
      - { name: market_value_cents, type: integer, source: computed, description: "= sum of amount_cents over all EndowmentTransactions of this fund" }
      - { name: units_outstanding, type: number, source: computed, description: "= sum of units over CONTRIBUTION/DRAW transactions, 4 decimal places" }
      - { name: unit_value_cents, type: number, source: computed, description: "= round(market_value_cents / units_outstanding, 4) half-up; starts 100.0000; null while units_outstanding == 0" }
      - { name: fiscal_year, type: integer, source: system, description: "Starts 1; +1 on each close-year" }
      - { name: prior_year_close_mv_cents, type: integer, source: system, description: "Market value captured at last close-year; 0 before the first close" }
      - { name: provisional_draws_ytd_cents, type: integer, source: computed, description: "Sum of abs(amount_cents) of DRAW transactions posted in the current fiscal_year" }
      - { name: policy_draw_allowance_cents, type: integer, source: computed, description: "= current-year policy amount + carryover_allowance_cents per calculations.carryover_allowance" }
      - { name: carryover_allowance_cents, type: integer, source: computed, description: "Unspent prior-year allowance carried forward per calculations.carryover_allowance; 0 in fiscal_year 1" }
      - { name: unitized_draw_capacity_cents, type: integer, source: computed, description: "= max(0, market_value_cents - principal_floor_cents)" }

  - name: EndowmentTransaction
    parent: null
    common_fields: false   # immutable append-only ledger event: id + created_at only
    fields:
      - { name: fund_id, type: string, source: system, description: "FK -> EndowmentFund.id" }
      - { name: txn_type, type: enum, source: system, description: "CONTRIBUTION | INVESTMENT_RETURN | DRAW" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents; DRAW is negative" }
      - { name: units, type: number, source: computed, description: "4dp; CONTRIBUTION units issued, DRAW units redeemed (negative), INVESTMENT_RETURN 0" }
      - { name: purpose, type: enum, source: input, description: "DRAW only: MONITORING | ENFORCEMENT | GENERAL_STEWARDSHIP" }
      - { name: from_policy_allowance_cents, type: integer, source: computed, description: "DRAW allocation bucket 1 per calculations.waterfall_draw_allocation" }
      - { name: from_excess_cents, type: integer, source: computed, description: "DRAW allocation bucket 2" }
      - { name: from_principal_invasion_cents, type: integer, source: computed, description: "DRAW allocation bucket 3; > 0 only when actor is TrustBoardReviewer" }
      - { name: fiscal_year, type: integer, source: system, description: "Fund fiscal_year at posting time" }
      - { name: posted_on, type: string, source: system, description: "ISO clock date at posting" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Easement
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: RECORDED
        trigger: "POST /stewardship/easements/{easementId}/record"
        actor: TrustAdmin
        preconditions:
          - "Easement.status == DRAFT (else ERR_INVALID_REQUEST since record is a no-op on RECORDED)"
          - "The easement's BaselineReport status == ACCEPTED (ERR_BASELINE_NOT_ACCEPTED)"
          - "Easement.current_landowner_id references a Landowner with status == ACTIVE (ERR_OPEN_OBLIGATIONS_EXIST)"
        side_effects:
          - "recorded_on = clock date; next_monitoring_due_on = recorded_on + monitoring_interval_months; posture computed (GOOD_STANDING)"
          - "increments Easement.version by 1"

  - entity: Landowner
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    note: "The initial landowner is created ACTIVE (POST /stewardship/landowners, easement DRAFT only). Successor rows are created PENDING_SUCCESSION as a side effect of succession notice creation."
    transitions:
      - from: PENDING_SUCCESSION
        to: ACTIVE
        trigger: "system (side effect of POST /stewardship/succession-notices/{successionNoticeId}/record)"
        actor: system
        preconditions: []
        side_effects:
          - "acquired_on = clock date"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (side effect of POST /stewardship/succession-notices/{successionNoticeId}/record on the predecessor)"
        actor: system
        preconditions: []
        side_effects:
          - "Easement.current_landowner_id flips to the successor in the same mutation"

  - entity: BaselineReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /stewardship/baseline-reports/{baselineReportId}/submit"
        actor: StewardshipCoordinator
        preconditions:
          - "status == DRAFT (ERR_INVALID_BASELINE_STATE)"
          - "photo_point_count >= required_photo_points where required_photo_points = max(4, ceil(Easement.parcel_acreage/100)) (ERR_INCOMPLETE_BASELINE)"
        side_effects:
          - "review_round += 1; submitted_on = clock date"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /stewardship/baseline-reports/{baselineReportId}/submit"
        actor: StewardshipCoordinator
        preconditions:
          - "status == REVISION_REQUESTED (ERR_INVALID_BASELINE_STATE)"
          - "photo_point_count >= required_photo_points (ERR_INCOMPLETE_BASELINE)"
        side_effects:
          - "review_round += 1; submitted_on = clock date"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /stewardship/baseline-reports/{baselineReportId}/accept"
        actor: TrustBoardReviewer
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_BASELINE_STATE)"
          - "X-User-ID != prepared_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "accepted_on = clock date"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /stewardship/baseline-reports/{baselineReportId}/request-revision"
        actor: TrustBoardReviewer
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_BASELINE_STATE)"
        side_effects:
          - "revision_notes captured"

  - entity: MonitoringVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /stewardship/monitoring-visits/{monitoringVisitId}/complete"
        actor: FieldMonitor
        preconditions:
          - "status == SCHEDULED (ERR_INVALID_VISIT_STATE)"
          - "X-User-ID == monitor_user_id (ERR_NOT_ASSIGNED_MONITOR)"
          - "window_start_on <= actual_visit_on < window_end_on (ERR_VISIT_OUTSIDE_WINDOW)"
        side_effects:
          - "on_time = (actual_visit_on <= Easement.next_monitoring_due_on evaluated before update)"
          - "Easement.last_monitoring_completed_on = actual_visit_on; next_monitoring_due_on recomputed (= actual_visit_on + interval months, day clamped); posture recomputed; increments Easement.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /stewardship/monitoring-visits/{monitoringVisitId}/cancel"
        actor: StewardshipCoordinator
        preconditions:
          - "status == SCHEDULED (ERR_INVALID_VISIT_STATE)"
        side_effects: []

  - entity: Violation
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: NOTICE_SENT
        trigger: "POST /stewardship/violations/{violationId}/send-notice"
        actor: StewardshipCoordinator
        preconditions:
          - "status == OPEN (ERR_INVALID_VIOLATION_STATE)"
          - "Easement.current_landowner_id references an ACTIVE Landowner (ERR_NOT_CURRENT_LANDOWNER)"
        side_effects:
          - "notice_served_on = clock date; cure_deadline_on = notice_served_on + CURE_DAYS[severity]"
      - from: NOTICE_SENT
        to: CURE_IN_PROGRESS
        trigger: "POST /stewardship/violations/{violationId}/start-cure"
        actor: Landowner
        preconditions:
          - "status == NOTICE_SENT (ERR_INVALID_VIOLATION_STATE)"
          - "X-User-ID == Easement.current_landowner_id (ERR_NOT_CURRENT_LANDOWNER)"
        side_effects: []
      - from: CURE_IN_PROGRESS
        to: RESOLVED
        trigger: "POST /stewardship/violations/{violationId}/resolve"
        actor: StewardshipCoordinator
        preconditions:
          - "status == CURE_IN_PROGRESS (ERR_INVALID_VIOLATION_STATE)"
          - "X-User-ID != detected_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "resolved_on = clock date; resolution_verified_by_user_id = X-User-ID"
          - "Easement.open_violation_count recomputed; Easement.posture recomputed; increments Easement.version by 1"
      - from: NOTICE_SENT
        to: ESCALATED
        trigger: "POST /stewardship/violations/{violationId}/escalate (MANUAL) or clock sweep when clock date > cure_deadline_on (CLOCK_SWEEP)"
        actor: StewardshipCoordinator | system
        preconditions:
          - "status == NOTICE_SENT for manual (ERR_INVALID_VIOLATION_STATE); sweep also escalates from CURE_IN_PROGRESS when clock date > cure_deadline_on"
        side_effects:
          - "escalated_by = MANUAL | CLOCK_SWEEP"
          - "Creates EnforcementAction(status=PROPOSED, violation_id=this, easement_id=this.easement_id) — link 2 of the escalation cascade"
          - "That EnforcementAction creation flips Easement.posture to ENFORCEMENT_ACTIVE and increments Easement.version by 1 — link 3 of the escalation cascade"
      - from: CURE_IN_PROGRESS
        to: ESCALATED
        trigger: "clock sweep when clock date > cure_deadline_on (CLOCK_SWEEP)"
        actor: system
        preconditions: []
        side_effects:
          - "escalated_by = CLOCK_SWEEP"
          - "Creates EnforcementAction(status=PROPOSED) — link 2"
          - "EnforcementAction creation flips Easement.posture to ENFORCEMENT_ACTIVE and increments Easement.version by 1 — link 3"
      - from: ESCALATED
        to: RESOLVED
        trigger: "system (side effect of POST /stewardship/enforcement-actions/{enforcementActionId}/complete)"
        actor: system
        preconditions: []
        side_effects:
          - "resolved_on = clock date; resolution_verified_by_user_id = enforcement completer's X-User-ID"
          - "Easement.open_violation_count recomputed; Easement.posture recomputed; increments Easement.version by 1"

  - entity: AmendmentRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: STAFF_REVIEW
        trigger: "POST /stewardship/amendment-requests/{amendmentRequestId}/start-review"
        actor: StewardshipCoordinator
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_AMENDMENT_STATE)"
        side_effects: []
      - from: STAFF_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /stewardship/amendment-requests/{amendmentRequestId}/request-revision"
        actor: StewardshipCoordinator
        preconditions:
          - "status == STAFF_REVIEW (ERR_INVALID_AMENDMENT_STATE)"
        side_effects:
          - "revision_notes captured"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /stewardship/amendment-requests/{amendmentRequestId}/resubmit"
        actor: StewardshipCoordinator
        preconditions:
          - "status == REVISION_REQUESTED (ERR_INVALID_AMENDMENT_STATE)"
        side_effects:
          - "requested_changes and affected_acreage replaced; materiality_score and review_path recomputed"
      - from: STAFF_REVIEW
        to: BOARD_REVIEW
        trigger: "POST /stewardship/amendment-requests/{amendmentRequestId}/escalate-board"
        actor: StewardshipCoordinator
        preconditions:
          - "status == STAFF_REVIEW (ERR_INVALID_AMENDMENT_STATE)"
        side_effects: []
      - from: STAFF_REVIEW
        to: APPROVED
        trigger: "POST /stewardship/amendment-requests/{amendmentRequestId}/approve"
        actor: StewardshipCoordinator
        preconditions:
          - "status == STAFF_REVIEW (ERR_INVALID_AMENDMENT_STATE)"
          - "review_path == STAFF i.e. materiality_score < 70 (ERR_MATERIALITY_REQUIRES_BOARD)"
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Approval cascade link 1: Easement.permitted_use_matrix mutated per requested_changes; amendment_count += 1; increments Easement.version by 1"
          - "Approval cascade link 2: every UseAuthorization of this easement with status == REQUESTED whose use_type appears in requested_changes is set to DENIED with decision_reason AMENDMENT_SUPERSEDES"
      - from: BOARD_REVIEW
        to: APPROVED
        trigger: "POST /stewardship/amendment-requests/{amendmentRequestId}/approve"
        actor: TrustBoardReviewer
        preconditions:
          - "status == BOARD_REVIEW (ERR_INVALID_AMENDMENT_STATE)"
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Same approval cascade links 1 and 2 as STAFF_REVIEW -> APPROVED"
      - from: STAFF_REVIEW
        to: REJECTED
        trigger: "POST /stewardship/amendment-requests/{amendmentRequestId}/reject"
        actor: StewardshipCoordinator
        preconditions:
          - "status == STAFF_REVIEW or BOARD_REVIEW (ERR_INVALID_AMENDMENT_STATE)"
        side_effects: []
      - from: BOARD_REVIEW
        to: REJECTED
        trigger: "POST /stewardship/amendment-requests/{amendmentRequestId}/reject"
        actor: TrustBoardReviewer
        preconditions:
          - "status == STAFF_REVIEW or BOARD_REVIEW (ERR_INVALID_AMENDMENT_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /stewardship/amendment-requests/{amendmentRequestId}/withdraw"
        actor: StewardshipCoordinator
        preconditions:
          - "status in {SUBMITTED, STAFF_REVIEW, REVISION_REQUESTED, BOARD_REVIEW} (ERR_INVALID_AMENDMENT_STATE)"
        side_effects: []
      - from: STAFF_REVIEW
        to: WITHDRAWN
        trigger: "POST /stewardship/amendment-requests/{amendmentRequestId}/withdraw"
        actor: StewardshipCoordinator
        preconditions:
          - "status in {SUBMITTED, STAFF_REVIEW, REVISION_REQUESTED, BOARD_REVIEW} (ERR_INVALID_AMENDMENT_STATE)"
        side_effects: []
      - from: REVISION_REQUESTED
        to: WITHDRAWN
        trigger: "POST /stewardship/amendment-requests/{amendmentRequestId}/withdraw"
        actor: StewardshipCoordinator
        preconditions:
          - "status in {SUBMITTED, STAFF_REVIEW, REVISION_REQUESTED, BOARD_REVIEW} (ERR_INVALID_AMENDMENT_STATE)"
        side_effects: []
      - from: BOARD_REVIEW
        to: WITHDRAWN
        trigger: "POST /stewardship/amendment-requests/{amendmentRequestId}/withdraw"
        actor: StewardshipCoordinator
        preconditions:
          - "status in {SUBMITTED, STAFF_REVIEW, REVISION_REQUESTED, BOARD_REVIEW} (ERR_INVALID_AMENDMENT_STATE)"
        side_effects: []

  - entity: UseAuthorization
    initial_state: REQUESTED
    terminal_states: [APPROVED, APPROVED_WITH_CONDITIONS, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /stewardship/use-authorizations/{useAuthorizationId}/decide"
        actor: StewardshipCoordinator
        preconditions:
          - "status == REQUESTED (ERR_INVALID_USE_AUTHORIZATION_STATE)"
          - "No AmendmentRequest of the same easement in {SUBMITTED, STAFF_REVIEW, REVISION_REQUESTED, BOARD_REVIEW} whose requested_changes include this use_type (ERR_AMENDMENT_FREEZE_CONFLICT)"
          - "decision == APPROVED"
        side_effects: []
      - from: REQUESTED
        to: APPROVED_WITH_CONDITIONS
        trigger: "POST /stewardship/use-authorizations/{useAuthorizationId}/decide"
        actor: StewardshipCoordinator
        preconditions:
          - "status == REQUESTED (ERR_INVALID_USE_AUTHORIZATION_STATE)"
          - "No in-flight amendment freeze (ERR_AMENDMENT_FREEZE_CONFLICT)"
          - "decision == APPROVED_WITH_CONDITIONS and conditions is a non-empty array (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: REQUESTED
        to: DENIED
        trigger: "POST /stewardship/use-authorizations/{useAuthorizationId}/decide, or system (amendment approval cascade link 2)"
        actor: StewardshipCoordinator | system
        preconditions:
          - "status == REQUESTED for manual decide (ERR_INVALID_USE_AUTHORIZATION_STATE); freeze check applies to manual decide only"
        side_effects: []

  - entity: EnforcementAction
    initial_state: PROPOSED
    terminal_states: [COMPLETED]
    transitions:
      - from: PROPOSED
        to: EXECUTED
        trigger: "POST /stewardship/enforcement-actions/{enforcementActionId}/execute"
        actor: TrustBoardReviewer
        preconditions:
          - "status == PROPOSED (ERR_INVALID_ENFORCEMENT_STATE)"
        side_effects:
          - "executed_by_user_id = X-User-ID; agreement_terms and remediation_cost_cents recorded"
      - from: EXECUTED
        to: COMPLETED
        trigger: "POST /stewardship/enforcement-actions/{enforcementActionId}/complete"
        actor: StewardshipCoordinator
        preconditions:
          - "status == EXECUTED (ERR_INVALID_ENFORCEMENT_STATE)"
          - "X-User-ID != executed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "completed_by_user_id = X-User-ID"
          - "Linked Violation ESCALATED -> RESOLVED (resolved_on set, resolution_verified_by_user_id = X-User-ID)"
          - "Easement.open_violation_count recomputed; Easement.posture recomputed; increments Easement.version by 1"
      - from: EXECUTED
        to: BREACHED
        trigger: "POST /stewardship/enforcement-actions/{enforcementActionId}/breach"
        actor: TrustBoardReviewer
        preconditions:
          - "status == EXECUTED (ERR_INVALID_ENFORCEMENT_STATE)"
        side_effects:
          - "breach_notes captured"
      - from: BREACHED
        to: PROPOSED
        trigger: "POST /stewardship/enforcement-actions/{enforcementActionId}/renegotiate"
        actor: StewardshipCoordinator
        preconditions:
          - "status == BREACHED (ERR_INVALID_ENFORCEMENT_STATE)"
        side_effects:
          - "agreement_terms and remediation_cost_cents replaced; executed_by_user_id cleared to null"

  - entity: SuccessionNotice
    initial_state: NOTICE_GIVEN
    terminal_states: [RECORDED, EXPIRED]
    transitions:
      - from: NOTICE_GIVEN
        to: ACKNOWLEDGED
        trigger: "POST /stewardship/succession-notices/{successionNoticeId}/acknowledge"
        actor: TrustAdmin
        preconditions:
          - "status == NOTICE_GIVEN (ERR_INVALID_NOTICE_STATE)"
        side_effects: []
      - from: NOTICE_GIVEN
        to: EXPIRED
        trigger: "clock sweep when clock date > ack_deadline_on"
        actor: system
        preconditions: []
        side_effects:
          - "Successor Landowner row remains PENDING_SUCCESSION (never activates)"
      - from: ACKNOWLEDGED
        to: RECORDED
        trigger: "POST /stewardship/succession-notices/{successionNoticeId}/record"
        actor: TrustAdmin
        preconditions:
          - "status == ACKNOWLEDGED (ERR_INVALID_NOTICE_STATE)"
          - "expected_easement_version == Easement.version (ERR_STALE_EASEMENT_VERSION)"
        side_effects:
          - "recorded_on = clock date; successor Landowner PENDING_SUCCESSION -> ACTIVE (acquired_on set); predecessor Landowner ACTIVE -> SUPERSEDED; Easement.current_landowner_id = successor_landowner_id; increments Easement.version by 1"

  - entity: Appraisal
    initial_state: ENGAGED
    terminal_states: [CERTIFIED, WITHDRAWN]
    transitions:
      - from: ENGAGED
        to: DELIVERED
        trigger: "POST /stewardship/appraisals/{appraisalId}/deliver"
        actor: Appraiser
        preconditions:
          - "status == ENGAGED (ERR_INVALID_APPRAISAL_STATE)"
          - "X-User-ID == appraiser_user_id (ERR_NOT_ENGAGED_APPRAISER)"
        side_effects:
          - "before_value_cents, after_value_cents, enhancement_value_cents recorded"
      - from: DELIVERED
        to: CERTIFIED
        trigger: "POST /stewardship/appraisals/{appraisalId}/certify"
        actor: StewardshipCoordinator
        preconditions:
          - "status == DELIVERED (ERR_INVALID_APPRAISAL_STATE)"
          - "Substantiation window: effective_on >= gift_on - 60 days AND clock date <= gift_on + 240 days (ERR_SUBSTANTIATION_WINDOW_EXPIRED)"
          - "appraiser_user_id != the easement BaselineReport.prepared_by_user_id (ERR_APPRAISER_CONFLICT)"
          - "computed deductible > 0 (ERR_NON_POSITIVE_DEDUCTION)"
        side_effects:
          - "deductible_value_cents computed per calculations.deductible_value and frozen"
      - from: ENGAGED
        to: WITHDRAWN
        trigger: "POST /stewardship/appraisals/{appraisalId}/withdraw"
        actor: StewardshipCoordinator
        preconditions:
          - "status in {ENGAGED, DELIVERED} (ERR_INVALID_APPRAISAL_STATE)"
        side_effects: []
      - from: DELIVERED
        to: WITHDRAWN
        trigger: "POST /stewardship/appraisals/{appraisalId}/withdraw"
        actor: StewardshipCoordinator
        preconditions:
          - "status in {ENGAGED, DELIVERED} (ERR_INVALID_APPRAISAL_STATE)"
        side_effects: []

  - entity: EndowmentFund
    initial_state: INITIALIZING
    terminal_states: []
    transitions:
      - from: INITIALIZING
        to: ACTIVE
        trigger: "system (side effect of first POST /stewardship/endowment-funds/{endowmentFundId}/contributions)"
        actor: system
        preconditions: []
        side_effects:
          - "unit_value_cents anchored at 100.0000 for the first contribution"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: amendment-create-stale-easement
    parent_entity: Easement
    write_endpoint: "POST /stewardship/amendment-requests"
    occ_field: expected_easement_version
    description: |
      Creating an AmendmentRequest against an Easement whose version has advanced
      since the client last observed it is rejected, because the client priced its
      requested changes against a permitted_use_matrix the server has since
      replaced (a prior amendment approval legitimately rewrites the matrix while
      leaving no amendment in flight). Stated as a stale-version check on
      Easement.version, never as overlapping requests.
    error_id: ERR_STALE_EASEMENT_VERSION
    http_status: 412
  - rule_id: succession-record-stale-easement
    parent_entity: Easement
    write_endpoint: "POST /stewardship/succession-notices/{successionNoticeId}/record"
    occ_field: expected_easement_version
    description: |
      Recording an ACKNOWLEDGED SuccessionNotice against an Easement whose version
      has advanced since the caller observed it is rejected; a previously recorded
      succession legitimately transfers ownership again (the second notice remains
      ACKNOWLEDGED and would otherwise record cleanly), so the only sound rejection
      basis is a stale Easement.version at record time.
    error_id: ERR_STALE_EASEMENT_VERSION
    http_status: 412
  - rule_id: fund-draw-stale-version
    parent_entity: EndowmentFund
    write_endpoint: "POST /stewardship/endowment-funds/{endowmentFundId}/draws"
    occ_field: expected_fund_version
    description: |
      Posting a DRAW against an EndowmentFund whose version has advanced since the
      caller observed the fund is rejected; the caller computed its allocation
      against a market_value_cents / unit_value_cents / allowance snapshot that a
      prior write has already moved, and the new draw would otherwise still pass
      every balance check on the fresh state.
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: unit_value_unitization
    trigger: "every EndowmentFund contribution, return, and draw posting"
    algorithm: chronological
    formula: |
      Ledger is processed strictly in posting order (posted_on, then created_at).
      Initial anchor: before any transaction, unit_value_cents = 100.0000.
      PINNED ROUNDING ORDER (mode b — deviation changes cents):
        Step 1: units_delta = round(abs(amount_cents) / unit_value_cents, 4) half-up.
        Step 2: apply aggregates — CONTRIBUTION: units_outstanding += units_delta,
                market_value_cents += amount_cents. DRAW: units_outstanding -=
                units_delta, market_value_cents -= abs(amount_cents).
                INVESTMENT_RETURN: units unchanged, market_value_cents += amount_cents.
        Step 3: unit_value_cents = round(market_value_cents / units_outstanding, 4)
                half-up (skip while units_outstanding == 0).
      Computing units from an unrounded intermediate unit value (instead of the
      Step-3-rounded value from the previous posting) yields different 4th-decimal
      units; this scaffold pins the rounded-at-each-step order above.
    input_set: "All EndowmentTransactions of one fund, in (posted_on, created_at) order"
    constants:
      INITIAL_UNIT_VALUE_CENTS: 100.0000
    precision: "units 4 decimal places round_half_up; unit_value_cents 4 decimal places round_half_up; market_value_cents integer"

  - name: draw_capacity
    trigger: "evaluated (a) provisionally at every draw request and (b) finally at close-year"
    algorithm: forward_looking
    formula: |
      Variant PROVISIONAL (unitized): unitized_draw_capacity_cents =
      max(0, market_value_cents - principal_floor_cents) — instantaneous, based on
      the current ledger position only.
      Variant FINAL (policy): policy_draw_allowance_cents = current-year policy
      amount + carryover_allowance_cents, where the current-year policy amount was
      frozen at the last close-year per calculations.carryover_allowance.
      The two variants legitimately differ for identical ledger data (e.g. MV
      500000 with floor 100000 gives 400000 provisional vs a policy allowance of
      20000 right after the first close-year). A draw must satisfy BOTH ceilings:
      amount_cents <= unitized_draw_capacity_cents (else invasion branch of
      waterfall) and the allowance bucket is capped by policy_draw_allowance_cents.
    input_set: "The fund's own computed fields at request time"
    constants: {}
    precision: "integer cents"
    variants:
      - name: provisional_unitized
        when: "live draw authorization"
        difference: "ceiling = market_value_cents - principal_floor_cents; ignores spending-rate policy"
      - name: final_policy
        when: "frozen at close-year for the new fiscal year"
        difference: "ceiling = round(prior_year_close_mv_cents * spending_rate_bps / 10000, 0) + carryover; ignores intrayear market moves"

  - name: carryover_allowance
    trigger: "POST /stewardship/endowment-funds/{endowmentFundId}/close-year"
    algorithm: constraint_propagation
    formula: |
      PINNED EVALUATION ORDER (mode c — the four steps look circular because the
      draw total feeds underuse while next year's policy feeds the cap; evaluate
      strictly in this order):
        Step 1: policy_amount_Y = policy amount that governed the year just closed
                (for fiscal_year 1 this is round(0 * rate, 0) = 0, because
                prior_year_close_mv_cents starts 0).
        Step 2: underused_Y = max(0, policy_amount_Y + carryover_allowance_cents
                - provisional_draws_ytd_cents).
        Step 3: new carryover_allowance_cents = min(underused_Y, policy_amount_Y)
                — capped by the CLOSED year's policy amount, never by next year's.
        Step 4: prior_year_close_mv_cents = market_value_cents (now);
                next-year policy amount = round(prior_year_close_mv_cents *
                spending_rate_bps / 10000, 0) half-up to integer cents;
                provisional_draws_ytd_cents resets to 0; fiscal_year += 1.
      Using the NEXT year's policy amount in Step 3's min() is the forbidden
      evaluation order and yields a different carryover whenever market value
      shrank during the closed year.
    input_set: "The fund's own fields; no other entities"
    constants: {}
    precision: "integer cents, round_half_up for the policy product"

  - name: waterfall_draw_allocation
    trigger: "POST /stewardship/endowment-funds/{endowmentFundId}/draws (after OCC and state gates pass)"
    algorithm: waterfall_allocation
    formula: |
      Inputs: D = amount_cents; MV = market_value_cents; FLOOR = principal_floor_cents;
      ALLOW = policy_draw_allowance_cents; YTD = provisional_draws_ytd_cents;
      actor role R. Evaluate in bucket order (mode a — nested min/max with a
      conditional branch on fund status and actor role):
        B1_remaining = max(0, ALLOW - YTD)
        B2_remaining = max(0, MV - FLOOR)
        from_policy_allowance_cents = min(D, B1_remaining)
        rem1 = D - from_policy_allowance_cents
        from_excess_cents = min(rem1, B2_remaining - from_policy_allowance_cents)
        rem2 = rem1 - from_excess_cents
        if rem2 > 0 and R != TrustBoardReviewer: reject ERR_PRINCIPAL_INVASION_REQUIRES_BOARD (402)
        if rem2 > 0 and R == TrustBoardReviewer:
            if D > MV: reject ERR_DRAW_EXCEEDS_AUTHORITY (402)
            from_principal_invasion_cents = rem2
        else: from_principal_invasion_cents = 0
      Transaction records all three bucket fields; DRAW amount = -D.
    input_set: "Single fund's computed fields at request time"
    constants: {}
    precision: "integer cents"

  - name: deductible_value
    trigger: "POST /stewardship/appraisals/{appraisalId}/certify"
    algorithm: weighted_scoring
    formula: |
      Variant STANDARD (contiguous_enhancement_applies == false):
        deductible_value_cents = before_value_cents - after_value_cents
        (enhancement_value_cents is ignored entirely).
      Variant ENHANCEMENT_ADJUSTED (contiguous_enhancement_applies == true):
        deductible_value_cents = max(0, before_value_cents - after_value_cents
        - enhancement_value_cents).
      Both variants reject certification with ERR_NON_POSITIVE_DEDUCTION when the
      computed value <= 0 (STANDARD) or when before - after - enhancement <= 0
      (ADJUSTED). Same delivered numbers legitimately produce different deductible
      values under the two variants.
    input_set: "Single appraisal's deliver-time inputs"
    constants: {}
    precision: "integer cents"
    variants:
      - name: standard_before_after
        when: "contiguous_enhancement_applies == false"
        difference: "no enhancement subtraction"
      - name: enhancement_adjusted
        when: "contiguous_enhancement_applies == true"
        difference: "subtracts enhancement_value_cents with a floor at 0"

  - name: amendment_materiality_score
    trigger: "AmendmentRequest create and resubmit"
    algorithm: weighted_scoring
    formula: |
      acreage_pts = round(affected_acreage / Easement.parcel_acreage * 50, 0) half-up
      change_pts  = 10 * len(requested_changes)
      downgrade_pts = 30 if any change is PROHIBITED -> PERMITTED,
                      else 15 if any change is DISCRETIONARY -> PERMITTED,
                      else 0   (take the max single downgrade, never a sum)
      materiality_score = min(100, acreage_pts + change_pts + downgrade_pts)
      review_path = BOARD if materiality_score >= 70 else STAFF
      Boundary: score exactly 70 routes BOARD (>=); 69 routes STAFF.
    input_set: "The amendment's affected_acreage + requested_changes and the easement's parcel_acreage and current matrix"
    constants:
      BOARD_THRESHOLD: 70
      ACREAGE_WEIGHT: 50
      PER_CHANGE_PTS: 10
      DOWNGRADE_PROHIBITED_TO_PERMITTED: 30
      DOWNGRADE_DISCRETIONARY_TO_PERMITTED: 15
    precision: "integer score 0..100"

  - name: monitoring_schedule
    trigger: "Easement record; MonitoringVisit complete; clock sweep"
    algorithm: threshold
    formula: |
      next_monitoring_due_on = (last_monitoring_completed_on else recorded_on)
        + monitoring_interval_months months (same day-of-month; if the target
        month lacks that day, clamp to the month's last day).
      A completion is on_time iff actual_visit_on <= next_monitoring_due_on
      evaluated against the due date in force BEFORE this completion updates it.
      Boundary: actual == due date -> on_time true; due date + 1 day -> false.
      Clock sweep: if clock date > next_monitoring_due_on and no higher-precedence
      posture applies, posture = MONITORING_DUE (strictly greater; on the due date
      itself the easement remains GOOD_STANDING).
    input_set: "Easement record/completion dates and interval"
    constants: {}
    precision: "ISO dates, inclusive upper boundary"

  - name: cure_deadline
    trigger: "Violation send-notice; clock sweep"
    algorithm: threshold
    formula: |
      cure_deadline_on = notice_served_on + CURE_DAYS[severity] days.
      Clock sweep escalates a NOTICE_SENT or CURE_IN_PROGRESS violation to
      ESCALATED iff clock date > cure_deadline_on (strictly greater; the deadline
      day itself is still curable).
    input_set: "Violations in {NOTICE_SENT, CURE_IN_PROGRESS}"
    constants:
      CURE_DAYS_MINOR: 90
      CURE_DAYS_MATERIAL: 30
      CURE_DAYS_IRREPARABLE: 7
    precision: "ISO dates, exclusive escalation boundary"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path ids and body FK references exist (path validated left-to-right; missing resource -> its typed 404)"
    error_id: "ERR_EASEMENT_NOT_FOUND | ERR_LANDOWNER_NOT_FOUND | ERR_BASELINE_REPORT_NOT_FOUND | ERR_MONITORING_VISIT_NOT_FOUND | ERR_VIOLATION_NOT_FOUND | ERR_AMENDMENT_REQUEST_NOT_FOUND | ERR_USE_AUTHORIZATION_NOT_FOUND | ERR_ENFORCEMENT_ACTION_NOT_FOUND | ERR_SUCCESSION_NOTICE_NOT_FOUND | ERR_APPRAISAL_NOT_FOUND | ERR_ENDOWMENT_FUND_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition exists"
    error_id: "ERR_INVALID_BASELINE_STATE | ERR_INVALID_VISIT_STATE | ERR_INVALID_VIOLATION_STATE | ERR_INVALID_AMENDMENT_STATE | ERR_INVALID_USE_AUTHORIZATION_STATE | ERR_INVALID_ENFORCEMENT_STATE | ERR_INVALID_NOTICE_STATE | ERR_INVALID_APPRAISAL_STATE"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: state
    check: "Cross-entity gate states: easement RECORDED for child operational creates (ERR_EASEMENT_NOT_RECORDED); baseline ACCEPTED + ACTIVE landowner for record (ERR_BASELINE_NOT_ACCEPTED / ERR_OPEN_OBLIGATIONS_EXIST); fund ACTIVE for returns/draws/close-year (ERR_FUND_NOT_ACTIVE)"
    error_id: "ERR_EASEMENT_NOT_RECORDED | ERR_BASELINE_NOT_ACCEPTED | ERR_OPEN_OBLIGATIONS_EXIST | ERR_FUND_NOT_ACTIVE"
    http_status: 409
    applies_to: "child creation endpoints, record, fund mutations"
  - priority: 6
    category: state
    check: "OCC: expected_easement_version == Easement.version on amendment create and succession record; expected_fund_version == EndowmentFund.version on draws"
    error_id: "ERR_STALE_EASEMENT_VERSION | ERR_STALE_FUND_VERSION"
    http_status: 412
    applies_to: "amendment create, succession record, fund draws"
  - priority: 7
    category: business_safety
    check: "Segregation of duties and assignment identity: baseline acceptor != prepared_by_user_id; violation resolver != detected_by_user_id; enforcement completer != executed_by_user_id; amendment approver != submitted_by_user_id (all ERR_SEGREGATION_OF_DUTIES); visit completer must be monitor_user_id (ERR_NOT_ASSIGNED_MONITOR); appraisal deliverer must be appraiser_user_id (ERR_NOT_ENGAGED_APPRAISER)"
    error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_NOT_ASSIGNED_MONITOR | ERR_NOT_ENGAGED_APPRAISER"
    http_status: 403
    applies_to: "accept, resolve, complete (enforcement), approve, complete (visit), deliver"
  - priority: 8
    category: business_constraint
    check: "Uniqueness: one BaselineReport per easement ever (ERR_BASELINE_ALREADY_EXISTS); one in-flight AmendmentRequest per easement (ERR_AMENDMENT_ALREADY_IN_FLIGHT); one EndowmentFund per easement (ERR_FUND_ALREADY_EXISTS); one active (REQUESTED/APPROVED/APPROVED_WITH_CONDITIONS) UseAuthorization per (easement, use_type) (ERR_USE_CURRENTLY_AUTHORIZED); one ACTIVE or PENDING_SUCCESSION landowner slot rules (initial landowner only while easement DRAFT and none exists -> ERR_OPEN_OBLIGATIONS_EXIST)"
    error_id: "ERR_BASELINE_ALREADY_EXISTS | ERR_AMENDMENT_ALREADY_IN_FLIGHT | ERR_FUND_ALREADY_EXISTS | ERR_USE_CURRENTLY_AUTHORIZED | ERR_OPEN_OBLIGATIONS_EXIST"
    http_status: 409
    applies_to: "creation endpoints"
  - priority: 9
    category: business_constraint
    check: "Domain rules: malformed payloads (ERR_INVALID_REQUEST); baseline submit completeness photo_point_count >= required_photo_points (ERR_INCOMPLETE_BASELINE); use-auth create requires matrix cell DISCRETIONARY (ERR_USE_NOT_DISCRETIONARY); violation create requires cell PROHIBITED or DISCRETIONARY (ERR_USE_PERMITTED_NOT_VIOLABLE) and flips conditions_breached on an active authorization; visit actual_visit_on within [window_start_on, window_end_on) (ERR_VISIT_OUTSIDE_WINDOW); staff approve requires materiality_score < 70 (ERR_MATERIALITY_REQUIRES_BOARD); use-auth decide frozen by in-flight amendment touching same use_type (ERR_AMENDMENT_FREEZE_CONFLICT); certify requires deductible > 0 (ERR_NON_POSITIVE_DEDUCTION)"
    error_id: "ERR_INVALID_REQUEST | ERR_INCOMPLETE_BASELINE | ERR_USE_NOT_DISCRETIONARY | ERR_USE_PERMITTED_NOT_VIOLABLE | ERR_VISIT_OUTSIDE_WINDOW | ERR_MATERIALITY_REQUIRES_BOARD | ERR_AMENDMENT_FREEZE_CONFLICT | ERR_NON_POSITIVE_DEDUCTION"
    http_status: "per error catalog (400 | 403 | 409 | 422)"
    applies_to: "domain rule endpoints"
  - priority: 10
    category: business_temporal
    check: "Monitor window overlap per monitor_user_id with half-open [start, end) semantics (ERR_MONITOR_WINDOW_OVERLAP); appraisal engagement 365-day buffer per (appraiser_user_id, easement_id) (ERR_APPRAISAL_ENGAGEMENT_OVERLAP); succession notice requires transfer_on >= clock date + 30 days (ERR_NOTICE_WINDOW_VIOLATION); appraisal certify window effective_on >= gift_on - 60d and clock date <= gift_on + 240d (ERR_SUBSTANTIATION_WINDOW_EXPIRED)"
    error_id: "ERR_MONITOR_WINDOW_OVERLAP | ERR_APPRAISAL_ENGAGEMENT_OVERLAP | ERR_NOTICE_WINDOW_VIOLATION | ERR_SUBSTANTIATION_WINDOW_EXPIRED"
    http_status: "per error catalog (409 for overlaps, 422 for window violations)"
    applies_to: "monitoring-visits create, appraisals create, succession-notices create, appraisals certify"
  - priority: 11
    category: business_referential
    check: "Appraiser independence: appraiser_user_id != the easement BaselineReport.prepared_by_user_id at certify (ERR_APPRAISER_CONFLICT); landowner-actor ops require X-User-ID == Easement.current_landowner_id (ERR_NOT_CURRENT_LANDOWNER)"
    error_id: "ERR_APPRAISER_CONFLICT | ERR_NOT_CURRENT_LANDOWNER"
    http_status: "per error catalog (422 | 403)"
    applies_to: "appraisals certify, violations start-cure, use-authorizations create, succession-notices create, violations send-notice"
  - priority: 12
    category: business_fiscal
    check: "Draw authority: invasion bucket > 0 requires TrustBoardReviewer (ERR_PRINCIPAL_INVASION_REQUIRES_BOARD); draw amount > market_value_cents is always rejected (ERR_DRAW_EXCEEDS_AUTHORITY)"
    error_id: "ERR_PRINCIPAL_INVASION_REQUIRES_BOARD | ERR_DRAW_EXCEEDS_AUTHORITY"
    http_status: 402
    applies_to: "POST /stewardship/endowment-funds/{id}/draws"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Easements ---
  - { method: POST, path: "/stewardship/easements", description: "Create an easement in DRAFT", roles: [TrustAdmin], code: 201, input: [easement_name, grantor_name, parcel_acreage, permitted_use_matrix, "monitoring_interval_months?"], output: Easement, side_effects: ["status=DRAFT", "posture=GOOD_STANDING", "version=1"] }
  - { method: GET, path: "/stewardship/easements", description: "List easements with filters", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: ["current_landowner_id?", "status?", "posture?", "limit?", "offset?"], output: "Easement[]", side_effects: [] }
  - { method: GET, path: "/stewardship/easements/{easementId}", description: "Get one easement including computed posture and due date", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: [], output: Easement, side_effects: [] }
  - { method: POST, path: "/stewardship/easements/{easementId}/record", description: "Record a DRAFT easement (requires ACCEPTED baseline + ACTIVE landowner)", roles: [TrustAdmin], code: 200, input: [], output: Easement, side_effects: ["status DRAFT -> RECORDED", "recorded_on = clock date", "next_monitoring_due_on computed", "increments Easement.version by 1"] }

  # --- Landowners ---
  - { method: POST, path: "/stewardship/landowners", description: "Create the initial ACTIVE landowner (easement must be DRAFT and have no landowner yet)", roles: [TrustAdmin], code: 201, input: [easement_id, owner_name, contact_email], output: Landowner, side_effects: ["status=ACTIVE", "acquired_on = clock date", "Easement.current_landowner_id = new id", "increments Easement.version by 1"] }
  - { method: GET, path: "/stewardship/landowners", description: "List landowners", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: ["easement_id?", "predecessor_landowner_id?", "status?", "limit?", "offset?"], output: "Landowner[]", side_effects: [] }
  - { method: GET, path: "/stewardship/landowners/{landownerId}", description: "Get one landowner", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: [], output: Landowner, side_effects: [] }

  # --- Baseline Reports ---
  - { method: POST, path: "/stewardship/baseline-reports", description: "Create the easement's single baseline report in DRAFT", roles: [StewardshipCoordinator], code: 201, input: [easement_id, prepared_by_user_id, condition_narrative, photo_point_count], output: BaselineReport, side_effects: ["status=DRAFT", "review_round=0"] }
  - { method: GET, path: "/stewardship/baseline-reports", description: "List baseline reports", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: ["easement_id?", "status?", "limit?", "offset?"], output: "BaselineReport[]", side_effects: [] }
  - { method: GET, path: "/stewardship/baseline-reports/{baselineReportId}", description: "Get one baseline report", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: [], output: BaselineReport, side_effects: [] }
  - { method: POST, path: "/stewardship/baseline-reports/{baselineReportId}/submit", description: "Submit from DRAFT or resubmit from REVISION_REQUESTED; enforces photo-point completeness", roles: [StewardshipCoordinator], code: 200, input: [], output: BaselineReport, side_effects: ["status -> SUBMITTED", "review_round += 1", "submitted_on = clock date", "required_photo_points recomputed from Easement.parcel_acreage"] }
  - { method: POST, path: "/stewardship/baseline-reports/{baselineReportId}/accept", description: "Accept a SUBMITTED baseline (acceptor must differ from preparer)", roles: [TrustBoardReviewer], code: 200, input: [], output: BaselineReport, side_effects: ["status -> ACCEPTED", "accepted_on = clock date"] }
  - { method: POST, path: "/stewardship/baseline-reports/{baselineReportId}/request-revision", description: "Send a SUBMITTED baseline back for revision (cycle)", roles: [TrustBoardReviewer], code: 200, input: [revision_notes], output: BaselineReport, side_effects: ["status -> REVISION_REQUESTED", "revision_notes captured"] }

  # --- Monitoring Visits ---
  - { method: POST, path: "/stewardship/monitoring-visits", description: "Schedule a monitoring visit; per-monitor half-open window overlap check", roles: [StewardshipCoordinator], code: 201, input: [easement_id, monitor_user_id, window_start_on, window_end_on], output: MonitoringVisit, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/stewardship/monitoring-visits", description: "List monitoring visits", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: ["easement_id?", "monitor_user_id?", "status?", "limit?", "offset?"], output: "MonitoringVisit[]", side_effects: [] }
  - { method: GET, path: "/stewardship/monitoring-visits/{monitoringVisitId}", description: "Get one monitoring visit", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: [], output: MonitoringVisit, side_effects: [] }
  - { method: POST, path: "/stewardship/monitoring-visits/{monitoringVisitId}/complete", description: "Complete a visit (only by its assigned monitor); updates easement due date and posture", roles: [FieldMonitor], code: 200, input: [actual_visit_on, findings_summary, stewardship_cost_cents], output: MonitoringVisit, side_effects: ["status -> COMPLETED", "on_time computed", "Easement.last_monitoring_completed_on and next_monitoring_due_on updated", "Easement.posture recomputed", "increments Easement.version by 1"] }
  - { method: POST, path: "/stewardship/monitoring-visits/{monitoringVisitId}/cancel", description: "Cancel a SCHEDULED visit", roles: [StewardshipCoordinator], code: 200, input: [], output: MonitoringVisit, side_effects: ["status -> CANCELLED"] }

  # --- Violations ---
  - { method: POST, path: "/stewardship/violations", description: "Open a violation against a PROHIBITED or DISCRETIONARY matrix cell; an active authorization on the cell is marked conditions_breached", roles: [StewardshipCoordinator], code: 201, input: [easement_id, "monitoring_visit_id?", detected_by_user_id, violation_type, severity, detected_on], output: Violation, side_effects: ["status=OPEN", "active UseAuthorization on same (easement, use_type) -> conditions_breached = true", "Easement.open_violation_count recomputed", "Easement.posture recomputed", "increments Easement.version by 1"] }
  - { method: GET, path: "/stewardship/violations", description: "List violations", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: ["easement_id?", "monitoring_visit_id?", "status?", "severity?", "limit?", "offset?"], output: "Violation[]", side_effects: [] }
  - { method: GET, path: "/stewardship/violations/{violationId}", description: "Get one violation", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: [], output: Violation, side_effects: [] }
  - { method: POST, path: "/stewardship/violations/{violationId}/send-notice", description: "Serve notice to the current landowner; starts the cure clock", roles: [StewardshipCoordinator], code: 200, input: [], output: Violation, side_effects: ["status OPEN -> NOTICE_SENT", "notice_served_on = clock date", "cure_deadline_on computed"] }
  - { method: POST, path: "/stewardship/violations/{violationId}/start-cure", description: "Current landowner begins curing", roles: [Landowner], code: 200, input: [], output: Violation, side_effects: ["status NOTICE_SENT -> CURE_IN_PROGRESS"] }
  - { method: POST, path: "/stewardship/violations/{violationId}/resolve", description: "Verify cure and resolve (verifier must differ from detector)", roles: [StewardshipCoordinator], code: 200, input: [], output: Violation, side_effects: ["status CURE_IN_PROGRESS -> RESOLVED", "resolved_on = clock date", "Easement.open_violation_count and posture recomputed", "increments Easement.version by 1"] }
  - { method: POST, path: "/stewardship/violations/{violationId}/escalate", description: "Manually escalate a NOTICE_SENT violation; spawns a PROPOSED EnforcementAction and flips easement posture", roles: [StewardshipCoordinator], code: 200, input: [], output: Violation, side_effects: ["status NOTICE_SENT -> ESCALATED", "escalated_by=MANUAL", "creates EnforcementAction PROPOSED", "Easement.posture -> ENFORCEMENT_ACTIVE", "increments Easement.version by 1"] }

  # --- Enforcement Actions ---
  - { method: GET, path: "/stewardship/enforcement-actions", description: "List enforcement actions", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: ["violation_id?", "easement_id?", "status?", "limit?", "offset?"], output: "EnforcementAction[]", side_effects: [] }
  - { method: GET, path: "/stewardship/enforcement-actions/{enforcementActionId}", description: "Get one enforcement action", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: [], output: EnforcementAction, side_effects: [] }
  - { method: POST, path: "/stewardship/enforcement-actions/{enforcementActionId}/execute", description: "Board executes the remediation agreement", roles: [TrustBoardReviewer], code: 200, input: [agreement_terms, remediation_cost_cents], output: EnforcementAction, side_effects: ["status PROPOSED -> EXECUTED", "executed_by_user_id = X-User-ID"] }
  - { method: POST, path: "/stewardship/enforcement-actions/{enforcementActionId}/complete", description: "Verify remediation complete (completer must differ from executor); resolves the linked violation", roles: [StewardshipCoordinator], code: 200, input: [], output: EnforcementAction, side_effects: ["status EXECUTED -> COMPLETED", "completed_by_user_id = X-User-ID", "linked Violation ESCALATED -> RESOLVED", "Easement.open_violation_count and posture recomputed", "increments Easement.version by 1"] }
  - { method: POST, path: "/stewardship/enforcement-actions/{enforcementActionId}/breach", description: "Declare the agreement breached", roles: [TrustBoardReviewer], code: 200, input: ["breach_notes?"], output: EnforcementAction, side_effects: ["status EXECUTED -> BREACHED"] }
  - { method: POST, path: "/stewardship/enforcement-actions/{enforcementActionId}/renegotiate", description: "Renegotiate a breached agreement back to PROPOSED (cycle)", roles: [StewardshipCoordinator], code: 200, input: [agreement_terms, remediation_cost_cents], output: EnforcementAction, side_effects: ["status BREACHED -> PROPOSED", "executed_by_user_id cleared"] }

  # --- Amendment Requests ---
  - { method: POST, path: "/stewardship/amendment-requests", description: "Submit an amendment (OCC on easement version; one in-flight per easement); computes materiality and routes STAFF vs BOARD", roles: [StewardshipCoordinator], code: 201, input: [easement_id, expected_easement_version, submitted_by_user_id, requested_changes, affected_acreage], output: AmendmentRequest, side_effects: ["status=SUBMITTED", "materiality_score and review_path computed", "increments Easement.version by 1"] }
  - { method: GET, path: "/stewardship/amendment-requests", description: "List amendment requests", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: ["easement_id?", "status?", "limit?", "offset?"], output: "AmendmentRequest[]", side_effects: [] }
  - { method: GET, path: "/stewardship/amendment-requests/{amendmentRequestId}", description: "Get one amendment request", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: [], output: AmendmentRequest, side_effects: [] }
  - { method: POST, path: "/stewardship/amendment-requests/{amendmentRequestId}/start-review", description: "SUBMITTED -> STAFF_REVIEW", roles: [StewardshipCoordinator], code: 200, input: [], output: AmendmentRequest, side_effects: ["status -> STAFF_REVIEW"] }
  - { method: POST, path: "/stewardship/amendment-requests/{amendmentRequestId}/request-revision", description: "STAFF_REVIEW -> REVISION_REQUESTED (revision loop)", roles: [StewardshipCoordinator], code: 200, input: [revision_notes], output: AmendmentRequest, side_effects: ["status -> REVISION_REQUESTED"] }
  - { method: POST, path: "/stewardship/amendment-requests/{amendmentRequestId}/resubmit", description: "REVISION_REQUESTED -> SUBMITTED with replacement changes; materiality recomputed", roles: [StewardshipCoordinator], code: 200, input: [requested_changes, affected_acreage], output: AmendmentRequest, side_effects: ["status -> SUBMITTED", "materiality_score and review_path recomputed"] }
  - { method: POST, path: "/stewardship/amendment-requests/{amendmentRequestId}/escalate-board", description: "STAFF_REVIEW -> BOARD_REVIEW", roles: [StewardshipCoordinator], code: 200, input: [], output: AmendmentRequest, side_effects: ["status -> BOARD_REVIEW"] }
  - { method: POST, path: "/stewardship/amendment-requests/{amendmentRequestId}/approve", description: "Approve: staff path from STAFF_REVIEW (score < 70 only), board path from BOARD_REVIEW; applies matrix changes and auto-denies frozen use authorizations", roles: [StewardshipCoordinator, TrustBoardReviewer], code: 200, input: [], output: AmendmentRequest, side_effects: ["status -> APPROVED", "decided_by_user_id = X-User-ID", "Easement.permitted_use_matrix mutated per requested_changes", "Easement.amendment_count += 1", "increments Easement.version by 1", "in-flight UseAuthorizations on changed cells -> DENIED (AMENDMENT_SUPERSEDES)"] }
  - { method: POST, path: "/stewardship/amendment-requests/{amendmentRequestId}/reject", description: "Reject from STAFF_REVIEW or BOARD_REVIEW", roles: [StewardshipCoordinator, TrustBoardReviewer], code: 200, input: [], output: AmendmentRequest, side_effects: ["status -> REJECTED", "decided_by_user_id = X-User-ID"] }
  - { method: POST, path: "/stewardship/amendment-requests/{amendmentRequestId}/withdraw", description: "Withdraw from any non-terminal state", roles: [StewardshipCoordinator], code: 200, input: [], output: AmendmentRequest, side_effects: ["status -> WITHDRAWN"] }

  # --- Use Authorizations (discretionary uses) ---
  - { method: POST, path: "/stewardship/use-authorizations", description: "Current landowner requests a discretionary use; matrix cell must be DISCRETIONARY and not already actively authorized", roles: [Landowner], code: 201, input: [easement_id, use_type, justification], output: UseAuthorization, side_effects: ["status=REQUESTED", "requested_by_landowner_id = X-User-ID"] }
  - { method: GET, path: "/stewardship/use-authorizations", description: "List use authorizations", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: ["easement_id?", "requested_by_landowner_id?", "use_type?", "status?", "limit?", "offset?"], output: "UseAuthorization[]", side_effects: [] }
  - { method: GET, path: "/stewardship/use-authorizations/{useAuthorizationId}", description: "Get one use authorization", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: [], output: UseAuthorization, side_effects: [] }
  - { method: POST, path: "/stewardship/use-authorizations/{useAuthorizationId}/decide", description: "Approve / approve with conditions / deny a REQUESTED authorization; blocked while an in-flight amendment touches the same cell", roles: [StewardshipCoordinator], code: 200, input: [decision, "conditions?", "decision_reason?"], output: UseAuthorization, side_effects: ["status -> decision value", "conditions stored when APPROVED_WITH_CONDITIONS"] }

  # --- Succession Notices ---
  - { method: POST, path: "/stewardship/succession-notices", description: "Current landowner gives notice of transfer; creates the PENDING_SUCCESSION successor landowner; 30-day minimum notice window", roles: [Landowner], code: 201, input: [easement_id, successor_owner_name, successor_contact_email, transfer_on], output: SuccessionNotice, side_effects: ["status=NOTICE_GIVEN", "notice_given_on = clock date", "ack_deadline_on = +45 days", "creates successor Landowner PENDING_SUCCESSION with predecessor = current landowner"] }
  - { method: GET, path: "/stewardship/succession-notices", description: "List succession notices", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: ["easement_id?", "successor_landowner_id?", "predecessor_landowner_id?", "status?", "limit?", "offset?"], output: "SuccessionNotice[]", side_effects: [] }
  - { method: GET, path: "/stewardship/succession-notices/{successionNoticeId}", description: "Get one succession notice", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: [], output: SuccessionNotice, side_effects: [] }
  - { method: POST, path: "/stewardship/succession-notices/{successionNoticeId}/acknowledge", description: "Trust acknowledges receipt within the 45-day window", roles: [TrustAdmin], code: 200, input: [], output: SuccessionNotice, side_effects: ["status NOTICE_GIVEN -> ACKNOWLEDGED"] }
  - { method: POST, path: "/stewardship/succession-notices/{successionNoticeId}/record", description: "Record the transfer (OCC on easement version); flips current landowner", roles: [TrustAdmin], code: 200, input: [expected_easement_version], output: SuccessionNotice, side_effects: ["status ACKNOWLEDGED -> RECORDED", "recorded_on = clock date", "successor PENDING_SUCCESSION -> ACTIVE", "predecessor ACTIVE -> SUPERSEDED", "Easement.current_landowner_id = successor", "increments Easement.version by 1"] }

  # --- Appraisals ---
  - { method: POST, path: "/stewardship/appraisals", description: "Engage an appraisal; 365-day engagement buffer per (appraiser, easement)", roles: [StewardshipCoordinator], code: 201, input: [easement_id, appraiser_user_id, effective_on, gift_on, contiguous_enhancement_applies], output: Appraisal, side_effects: ["status=ENGAGED"] }
  - { method: GET, path: "/stewardship/appraisals", description: "List appraisals", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: ["easement_id?", "appraiser_user_id?", "status?", "limit?", "offset?"], output: "Appraisal[]", side_effects: [] }
  - { method: GET, path: "/stewardship/appraisals/{appraisalId}", description: "Get one appraisal", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: [], output: Appraisal, side_effects: [] }
  - { method: POST, path: "/stewardship/appraisals/{appraisalId}/deliver", description: "Engaged appraiser delivers valuations", roles: [Appraiser], code: 200, input: [before_value_cents, after_value_cents, "enhancement_value_cents?"], output: Appraisal, side_effects: ["status ENGAGED -> DELIVERED"] }
  - { method: POST, path: "/stewardship/appraisals/{appraisalId}/certify", description: "Certify for tax substantiation; window + appraiser-independence checks; computes and freezes deductible_value_cents", roles: [StewardshipCoordinator], code: 200, input: [], output: Appraisal, side_effects: ["status DELIVERED -> CERTIFIED", "deductible_value_cents computed per calculations.deductible_value"] }
  - { method: POST, path: "/stewardship/appraisals/{appraisalId}/withdraw", description: "Withdraw an ENGAGED or DELIVERED appraisal", roles: [StewardshipCoordinator], code: 200, input: [], output: Appraisal, side_effects: ["status -> WITHDRAWN"] }

  # --- Endowment Funds & Ledger ---
  - { method: POST, path: "/stewardship/endowment-funds", description: "Create the easement's single stewardship endowment (INITIALIZING)", roles: [TrustAdmin], code: 201, input: [easement_id, spending_rate_bps, principal_floor_cents], output: EndowmentFund, side_effects: ["status=INITIALIZING", "market_value_cents=0", "units_outstanding=0", "fiscal_year=1", "prior_year_close_mv_cents=0", "carryover_allowance_cents=0"] }
  - { method: GET, path: "/stewardship/endowment-funds", description: "List endowment funds", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: ["easement_id?", "status?", "limit?", "offset?"], output: "EndowmentFund[]", side_effects: [] }
  - { method: GET, path: "/stewardship/endowment-funds/{endowmentFundId}", description: "Get one fund with all computed fields", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: [], output: EndowmentFund, side_effects: [] }
  - { method: POST, path: "/stewardship/endowment-funds/{endowmentFundId}/contributions", description: "Post a contribution; issues units at the current rounded unit value; first contribution activates the fund", roles: [TrustAdmin], code: 201, input: [amount_cents], output: EndowmentTransaction, side_effects: ["appends CONTRIBUTION transaction", "units issued per calculations.unit_value_unitization", "fund INITIALIZING -> ACTIVE on first contribution", "increments EndowmentFund.version by 1"] }
  - { method: POST, path: "/stewardship/endowment-funds/{endowmentFundId}/returns", description: "Post a signed investment return (may be negative); revalues units", roles: [TrustAdmin], code: 201, input: [amount_cents], output: EndowmentTransaction, side_effects: ["appends INVESTMENT_RETURN transaction", "unit_value_cents recomputed", "increments EndowmentFund.version by 1"] }
  - { method: POST, path: "/stewardship/endowment-funds/{endowmentFundId}/draws", description: "Post a stewardship draw (OCC on fund version); waterfall allocation across policy/excess/principal buckets", roles: [StewardshipCoordinator, TrustBoardReviewer], code: 201, input: [amount_cents, purpose, expected_fund_version], output: EndowmentTransaction, side_effects: ["appends DRAW transaction with three allocation bucket fields", "units redeemed per calculations.unit_value_unitization", "provisional_draws_ytd_cents recomputed", "increments EndowmentFund.version by 1"] }
  - { method: POST, path: "/stewardship/endowment-funds/{endowmentFundId}/close-year", description: "Close the fiscal year: freezes next-year policy amount, computes carryover in pinned order, resets YTD draws", roles: [TrustBoardReviewer], code: 200, input: [], output: EndowmentFund, side_effects: ["calculations.carryover_allowance steps 1-4 applied", "fiscal_year += 1", "provisional_draws_ytd_cents = 0", "prior_year_close_mv_cents = market_value_cents", "increments EndowmentFund.version by 1"] }
  - { method: GET, path: "/stewardship/endowment-funds/{id}/transactions", description: "List the fund's append-only ledger in (posted_on, created_at) order", roles: [TrustAdmin, StewardshipCoordinator, FieldMonitor, Landowner, TrustBoardReviewer, Appraiser], code: 200, input: ["txn_type?", "limit?", "offset?"], output: "EndowmentTransaction[]", side_effects: [] }

  # --- Test-driving clock (outside the business surface) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any call the clock reads that default and never the wall clock. Setting the clock runs the sweep: violations in NOTICE_SENT/CURE_IN_PROGRESS past cure_deadline_on escalate (spawning PROPOSED EnforcementActions and flipping easement posture to ENFORCEMENT_ACTIVE), succession notices in NOTICE_GIVEN past ack_deadline_on expire, and easement posture is recomputed for monitoring due dates.", roles: [TrustAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["clock set", "violation escalation sweep + enforcement spawn + posture flip cascade", "succession expiry sweep", "monitoring-due posture recompute"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload: missing required field, wrong type, invalid enum, unknown matrix key, empty matrix, non-positive acreage/amount, empty changes array, new_level equal to current cell, window_end_on <= window_start_on, missing conditions on APPROVED_WITH_CONDITIONS" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not in endpoint's roles list" }
  - { id: ERR_EASEMENT_NOT_FOUND, http: 404, condition: "Easement id does not exist" }
  - { id: ERR_LANDOWNER_NOT_FOUND, http: 404, condition: "Landowner id does not exist" }
  - { id: ERR_BASELINE_REPORT_NOT_FOUND, http: 404, condition: "BaselineReport id does not exist" }
  - { id: ERR_MONITORING_VISIT_NOT_FOUND, http: 404, condition: "MonitoringVisit id does not exist" }
  - { id: ERR_VIOLATION_NOT_FOUND, http: 404, condition: "Violation id does not exist" }
  - { id: ERR_AMENDMENT_REQUEST_NOT_FOUND, http: 404, condition: "AmendmentRequest id does not exist" }
  - { id: ERR_USE_AUTHORIZATION_NOT_FOUND, http: 404, condition: "UseAuthorization id does not exist" }
  - { id: ERR_ENFORCEMENT_ACTION_NOT_FOUND, http: 404, condition: "EnforcementAction id does not exist" }
  - { id: ERR_SUCCESSION_NOTICE_NOT_FOUND, http: 404, condition: "SuccessionNotice id does not exist" }
  - { id: ERR_APPRAISAL_NOT_FOUND, http: 404, condition: "Appraisal id does not exist" }
  - { id: ERR_ENDOWMENT_FUND_NOT_FOUND, http: 404, condition: "EndowmentFund id does not exist" }
  - { id: ERR_INVALID_BASELINE_STATE, http: 409, condition: "Baseline transition attempted from a state where it is not defined" }
  - { id: ERR_INVALID_VISIT_STATE, http: 409, condition: "Visit transition attempted from a state where it is not defined" }
  - { id: ERR_INVALID_VIOLATION_STATE, http: 409, condition: "Violation transition attempted from a state where it is not defined" }
  - { id: ERR_INVALID_AMENDMENT_STATE, http: 409, condition: "Amendment transition attempted from a state where it is not defined" }
  - { id: ERR_INVALID_USE_AUTHORIZATION_STATE, http: 409, condition: "Use authorization decide attempted from a non-REQUESTED state" }
  - { id: ERR_INVALID_ENFORCEMENT_STATE, http: 409, condition: "Enforcement transition attempted from a state where it is not defined" }
  - { id: ERR_INVALID_NOTICE_STATE, http: 409, condition: "Succession transition attempted from a state where it is not defined (including acknowledge after clock-sweep expiry)" }
  - { id: ERR_INVALID_APPRAISAL_STATE, http: 409, condition: "Appraisal transition attempted from a state where it is not defined" }
  - { id: ERR_EASEMENT_NOT_RECORDED, http: 409, condition: "Child operational create requires the easement RECORDED (visits, violations, amendments, use authorizations, succession notices, appraisals)" }
  - { id: ERR_BASELINE_NOT_ACCEPTED, http: 409, condition: "Easement record attempted before its baseline report is ACCEPTED" }
  - { id: ERR_OPEN_OBLIGATIONS_EXIST, http: 409, condition: "Easement record without an ACTIVE landowner, or initial-landowner creation when one already exists or easement not DRAFT" }
  - { id: ERR_FUND_NOT_ACTIVE, http: 409, condition: "Draw/return/close-year attempted on an INITIALIZING fund (no contribution yet)" }
  - { id: ERR_BASELINE_ALREADY_EXISTS, http: 409, condition: "Second BaselineReport for the same easement" }
  - { id: ERR_AMENDMENT_ALREADY_IN_FLIGHT, http: 409, condition: "Amendment create while another amendment of the same easement is in {SUBMITTED, STAFF_REVIEW, REVISION_REQUESTED, BOARD_REVIEW}" }
  - { id: ERR_FUND_ALREADY_EXISTS, http: 409, condition: "Second EndowmentFund for the same easement" }
  - { id: ERR_USE_CURRENTLY_AUTHORIZED, http: 409, condition: "Use authorization create while one is active (REQUESTED/APPROVED/APPROVED_WITH_CONDITIONS) for the same (easement, use_type)" }
  - { id: ERR_MONITOR_WINDOW_OVERLAP, http: 409, condition: "New visit window [start, end) intersects another SCHEDULED/COMPLETED visit of the same monitor_user_id; touching endpoints (end == start) is allowed" }
  - { id: ERR_APPRAISAL_ENGAGEMENT_OVERLAP, http: 409, condition: "New appraisal for the same (appraiser_user_id, easement_id) while one is ENGAGED/DELIVERED and |new.effective_on - existing.effective_on| < 365 days; exactly 365 days is allowed" }
  - { id: ERR_AMENDMENT_FREEZE_CONFLICT, http: 409, condition: "Use authorization decide blocked by an in-flight amendment touching the same (easement, use_type)" }
  - { id: ERR_INCOMPLETE_BASELINE, http: 422, condition: "Submit with photo_point_count < required_photo_points = max(4, ceil(parcel_acreage/100))" }
  - { id: ERR_USE_NOT_DISCRETIONARY, http: 422, condition: "Use authorization requested for a matrix cell that is PERMITTED (no approval needed) or PROHIBITED (not authorizable)" }
  - { id: ERR_USE_PERMITTED_NOT_VIOLABLE, http: 422, condition: "Violation opened against a PERMITTED matrix cell" }
  - { id: ERR_VISIT_OUTSIDE_WINDOW, http: 422, condition: "actual_visit_on not within [window_start_on, window_end_on)" }
  - { id: ERR_NOTICE_WINDOW_VIOLATION, http: 422, condition: "Succession notice transfer_on < clock date + 30 days" }
  - { id: ERR_SUBSTANTIATION_WINDOW_EXPIRED, http: 422, condition: "Appraisal certify when effective_on < gift_on - 60 days or clock date > gift_on + 240 days" }
  - { id: ERR_NON_POSITIVE_DEDUCTION, http: 422, condition: "Certify computes deductible_value_cents <= 0" }
  - { id: ERR_APPRAISER_CONFLICT, http: 422, condition: "Appraisal appraiser_user_id equals the easement baseline's prepared_by_user_id" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user attempts both sides of a segregated pair (prepare/accept, detect/resolve, execute/complete, submit/approve)" }
  - { id: ERR_NOT_CURRENT_LANDOWNER, http: 403, condition: "Landowner-actor call where X-User-ID != easement's current ACTIVE landowner id" }
  - { id: ERR_NOT_ASSIGNED_MONITOR, http: 403, condition: "Visit complete by a FieldMonitor whose X-User-ID != visit.monitor_user_id" }
  - { id: ERR_NOT_ENGAGED_APPRAISER, http: 403, condition: "Appraisal deliver by an Appraiser whose X-User-ID != appraisal.appraiser_user_id" }
  - { id: ERR_MATERIALITY_REQUIRES_BOARD, http: 403, condition: "Staff approve attempted when materiality_score >= 70 (review_path BOARD)" }
  - { id: ERR_DRAW_EXCEEDS_AUTHORITY, http: 402, condition: "Draw amount_cents > market_value_cents (cannot overdraw the ledger even with board authority)" }
  - { id: ERR_PRINCIPAL_INVASION_REQUIRES_BOARD, http: 402, condition: "Draw would dip below principal_floor_cents and the caller is not a TrustBoardReviewer" }
  - { id: ERR_STALE_EASEMENT_VERSION, http: 412, condition: "expected_easement_version != Easement.version on amendment create or succession record" }
  - { id: ERR_STALE_FUND_VERSION, http: 412, condition: "expected_fund_version != EndowmentFund.version on draw" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TrustAdmin
    description: "Land trust administrator: owns easement/landowner/fund setup, recordation, succession acknowledgment and recording, ledger contributions and returns, and the test clock"
    identity: opaque
    exclusive_operations: [POST /stewardship/easements, "POST /stewardship/easements/{id}/record", POST /stewardship/landowners, POST /stewardship/endowment-funds, "POST /stewardship/endowment-funds/{id}/contributions", "POST /stewardship/endowment-funds/{id}/returns", "POST /stewardship/succession-notices/{id}/acknowledge", "POST /stewardship/succession-notices/{id}/record", POST /_clock/set_current_utc]
    shared_operations: [GET endpoints]
  - name: StewardshipCoordinator
    description: "Stewardship staff: runs baselines, monitoring, violations, amendments, use authorizations, enforcement negotiation/completion, appraisal certification, and routine draws"
    identity: opaque
    exclusive_operations: [POST /stewardship/baseline-reports, baseline submit, POST /stewardship/monitoring-visits, visit cancel, violation create/send-notice/start-cure-n/a/resolve/escalate, amendment lifecycle (start-review, request-revision, resubmit, escalate-board, withdraw, staff approve/reject), "POST /stewardship/use-authorizations/{id}/decide", enforcement renegotiate/complete, appraisal create/certify/withdraw, "POST /stewardship/endowment-funds/{id}/draws (non-invasion)"]
    shared_operations: [GET endpoints]
  - name: FieldMonitor
    description: "Field staff assigned to monitoring visits; may complete only own visits"
    identity: opaque
    exclusive_operations: ["POST /stewardship/monitoring-visits/{id}/complete (X-User-ID == monitor_user_id)"]
    shared_operations: [GET endpoints]
  - name: Landowner
    description: "The easement's current ACTIVE landowner; requests discretionary uses, starts cure, gives succession notice"
    identity: entity_backed:Landowner
    exclusive_operations: [POST /stewardship/use-authorizations, "POST /stewardship/violations/{id}/start-cure", POST /stewardship/succession-notices]
    shared_operations: [GET endpoints]
  - name: TrustBoardReviewer
    description: "Board reviewer: accepts baselines, approves board-path amendments, executes/breaches enforcement agreements, closes the fund fiscal year, authorizes principal-invasion draws"
    identity: opaque
    exclusive_operations: ["POST /stewardship/baseline-reports/{id}/accept", "POST /stewardship/baseline-reports/{id}/request-revision", amendment approve from BOARD_REVIEW, "POST /stewardship/enforcement-actions/{id}/execute", "POST /stewardship/enforcement-actions/{id}/breach", "POST /stewardship/endowment-funds/{id}/close-year", principal-invasion draws]
    shared_operations: [GET endpoints, amendment reject]
  - name: Appraiser
    description: "Engaged appraiser; delivers valuations only on own engagements"
    identity: opaque
    exclusive_operations: ["POST /stewardship/appraisals/{id}/deliver (X-User-ID == appraiser_user_id)"]
    shared_operations: [GET endpoints]
