              as: Shipper
              as_user_id: "shp-gal"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /stb/reciprocal-switching-petitions/${p1}/decide"
              payload: { outcome: "GRANTED" }
              as: BoardAdjudicator
              captures: { err: $.data.error_id }
            - call: "POST /stb/service-complaints/${sc1}/escalate"
              payload: { directive: "Directing CSXT to restore service within 72 hours" }
              as: BoardAdjudicator
            - call: "POST /stb/reciprocal-switching-petitions/${p1}/decide"
              payload: { outcome: "GRANTED" }
