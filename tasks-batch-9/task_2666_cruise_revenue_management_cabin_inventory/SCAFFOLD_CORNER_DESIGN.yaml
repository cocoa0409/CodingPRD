              as: RevenueManager
            - call: "POST /sailings/${sail_q}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_a: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Wil One", email: "w1@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_w1: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Wil Two", email: "w2@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_w2: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Wil Three", email: "w3@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_w3: $.data.id }
            - call: "POST /bookings"
