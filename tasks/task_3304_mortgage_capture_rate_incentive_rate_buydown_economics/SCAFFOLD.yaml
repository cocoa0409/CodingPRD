scenario: |
  Mortgage Capture Rate & Incentive Rate Buydown Economics (Lennar): affiliated mortgage company capture of buyers with incentive structures that require using the affiliated lender, forward commitment purchases of mortgage rates to fund advertised below-market rates on specific inventory, buydown cost accounting as a sales incentive against home price with disclosure requirements, loan lock timing tied to construction completion with extension and relock costs, buyer qualification and backlog risk where rate changes cause cancellations, affiliated business arrangement disclosures and steering prohibitions, incentive allocation across price reduction, closing costs and rate buydown by community, cancellation and deposit forfeiture handling

domain_name: homebuilder-mortgage-capture-buydown
api_prefix: /housing

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency

  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

entities:
  - name: Community
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Marketing name of the master-planned community
        constraints: "non-empty, max 120 chars"
      - name: state_code
        type: string
        source: input
        description: Two-letter US state the community is licensed in
        constraints: "exactly 2 uppercase letters"
      - name: incentive_policy_code
        type: enum
        source: input
        description: Named incentive policy that fixes the three per-unit bucket caps
        constraints: "STANDARD | PREMIUM | CLEARANCE"
      - name: capture_rate_target_bps
        type: integer
        source: input
        description: Affiliated-lender capture rate target in basis points of funded units
        default: 8500
        constraints: "0 <= capture_rate_target_bps <= 10000"
      - name: price_reduction_cap_cents
        type: integer
        source: input
        description: Maximum per-unit incentive spend allocatable to base price reduction
        constraints: ">= 0"
      - name: closing_cost_cap_cents
        type: integer
        source: input
        description: Maximum per-unit incentive spend allocatable to closing-cost credit
        constraints: ">= 0"
      - name: rate_buydown_cap_cents
        type: integer
        source: input
        description: Maximum per-unit incentive spend allocatable to permanent rate buydown
        constraints: ">= 0"
      - name: affiliated_units
        type: integer
        source: computed
        description: Count of CLOSED contracts in this community whose LoanApplication.lender_entity_code == AFFILIATED_LENDER
        default: 0
      - name: funded_units
        type: integer
        source: computed
        description: Count of CLOSED contracts in this community regardless of lender entity
        default: 0
      - name: capture_rate_bps
        type: integer
        source: computed
        description: Realized capture rate in basis points; derived field reconciled by capture_rate_realization
        default: 0
      - name: incentive_spend_cents
        type: integer
        source: computed
        description: Sum of allowed_buydown_cost_cents over BuydownCostRecord rows in BOOKED status for this community
        default: 0
      - name: forward_units_committed
        type: integer
        source: computed
        description: Sum of committed_units over ForwardCommitment rows in OPEN or EXHAUSTED status for this community
        default: 0
      - name: program_status
        type: enum
        source: system
        description: Derived program posture that gates all incentive operations in this community
        default: ACTIVE
        constraints: "ACTIVE | RESTRICTED | SUSPENDED"

  - name: ForwardCommitment
    parent: null
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: "FK -> Community.id; the community whose inventory this rate commitment funds"
        constraints: "must reference an existing Community"
      - name: commitment_code
        type: string
        source: input
        description: Investor-facing identifier of the bulk forward commitment
        constraints: "non-empty, unique among commitments with commitment_status IN {OPEN, EXHAUSTED} for the same community_id"
      - name: investor_name
        type: string
        source: input
        description: Name of the investor that sold the forward rate commitment
        constraints: "non-empty"
      - name: committed_rate_bps
        type: integer
        source: input
        description: Mortgage rate in basis points purchased under the forward commitment
        constraints: "0 <= committed_rate_bps <= 2000"
      - name: committed_units
        type: integer
        source: input
        description: Number of whole mortgage units purchased under this commitment
        constraints: "1 <= committed_units <= 500"
      - name: units_drawn
        type: integer
        source: system
        description: Cumulative whole units consumed by confirmed RateLock rows against this commitment
        default: 0
      - name: units_released
        type: system
        source: system
        description: Cumulative whole units returned by voided RateLock rows against this commitment
        default: 0
      - name: units_available
        type: integer
        source: computed
        description: committed_units - units_drawn + units_released; never negative
        default: 0
      - name: commitment_start_iso
        type: datetime
        source: input
        description: Inclusive first calendar day the commitment window is usable
        constraints: "ISO 8601 date at 00:00:00Z"
      - name: commitment_end_iso
        type: datetime
        source: input
        description: Inclusive last calendar day the commitment window is usable
        constraints: "ISO 8601 date at 00:00:00Z; must be >= commitment_start_iso"
      - name: pair_off_fee_cents
        type: integer
        source: computed
        description: Fee owed at window close for every unit never drawn; 0 once closed with units_available == 0
        default: 0
      - name: commitment_status
        type: enum
        source: system
        description: Lifecycle posture of the purchased rate commitment
        default: OPEN
        constraints: "OPEN | EXHAUSTED | EXPIRED | CLOSED"

  - name: HomeSite
    parent: Community
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: "FK -> Community.id; owning community of this inventory home"
        constraints: "must reference an existing Community and equal the community_id in the request path"
      - name: lot_number
        type: string
        source: input
        description: Lot identifier within the community plat
        constraints: "non-empty, unique within community_id"
      - name: address
        type: string
        source: input
        description: Street address of the inventory home
        constraints: "non-empty"
      - name: base_price_cents
        type: integer
        source: input
        description: Undiscounted list price of the inventory home
        constraints: "> 0"
      - name: construction_stage
        type: enum
        source: input
        description: Current physical construction stage of the inventory home
        constraints: "NOT_STARTED | FOUNDATION | FRAMING | DRYWALL | FINISH | COMPLETE"
      - name: estimated_completion_iso
        type: datetime
        source: input
        description: Projected construction completion used to size required lock length
        constraints: "ISO 8601 UTC"
      - name: advertised_rate_bps
        type: integer
        source: input
        description: Below-market rate advertised for this specific inventory home
        constraints: "0 <= advertised_rate_bps <= 2000"
      - name: advertised_rate_expires_iso
        type: datetime
        source: input
        description: Last instant the advertised below-market rate may be quoted
        constraints: "ISO 8601 UTC"
      - name: home_site_status
        type: enum
        source: system
        description: Availability posture of the inventory home
        default: AVAILABLE
        constraints: "AVAILABLE | UNDER_CONTRACT | SOLD"

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal name of the homebuyer
        constraints: "non-empty"
      - name: email
        type: string
        source: input
        description: Contact email used as the buyer's natural identifier
        constraints: "non-empty, unique across all buyers"
      - name: state_code
        type: string
        source: input
        description: Two-letter state of residence used to select forfeiture statute
        constraints: "exactly 2 uppercase letters"
      - name: buyer_status
        type: enum
        source: system
        description: Lifecycle posture of the buyer record
        default: PROSPECT
        constraints: "PROSPECT | QUALIFIED | CONTRACTED | WITHDRAWN"
      - name: affiliated_lender_selected
        type: boolean
        source: system
        description: True once a LoanApplication with lender_entity_code == AFFILIATED_LENDER exists for this buyer
        default: false
      - name: total_incentive_received_cents
        type: integer
        source: computed
        description: Sum of allocation_total_cents over APPLIED IncentiveAllocation rows plus allowed_buydown_cost_cents over BOOKED BuydownCostRecord rows for this buyer
        default: 0
      - name: steering_protection_flag
        type: boolean
        source: computed
        description: True when every rate-buydown-bearing contract for this buyer has an ACKNOWLEDGED ABADisclosure
        default: true

  - name: HomeSaleContract
    parent: HomeSite
    common_fields: true
    fields:
      - name: home_site_id
        type: string
        source: input
        description: "FK -> HomeSite.id; the inventory home being sold"
        constraints: "must reference a HomeSite in home_site_status AVAILABLE"
      - name: buyer_id
        type: string
        source: input
        description: "FK -> Buyer.id; the purchasing buyer"
        constraints: "must reference an existing Buyer"
      - name: purchase_price_cents
        type: integer
        source: input
        description: Contracted gross purchase price before any incentive allocation
        constraints: "> 0"
      - name: earnest_money_cents
        type: integer
        source: input
        description: Deposit held in escrow, subject to forfeiture on cancellation
        constraints: "> 0"
      - name: deposit_held_cents
        type: integer
        source: system
        description: Deposit still retained by the seller after any forfeiture computation or partial refund
        default: 0
      - name: incentive_budget_cents
        type: integer
        source: computed
        description: Sum of price_reduction_cap_cents + closing_cost_cap_cents + rate_buydown_cap_cents of the home site's community policy
        default: 0
      - name: incentive_allocated_cents
        type: integer
        source: computed
        description: Sum of allocation_total_cents over APPLIED IncentiveAllocation rows for this contract
        default: 0
      - name: contract_status
        type: enum
        source: system
        description: Lifecycle posture of the purchase contract
        default: PENDING
        constraints: "PENDING | LOCKED | APPROVED | CLOSED | CANCELLED"
      - name: cancellation_reason
        type: enum
        source: system
        description: Reason recorded when the contract is cancelled
        constraints: "BUYER_DEFAULT | CONSTRUCTION_DELAY | FINANCING_DENIED | RATE_SHOCK | null"

  - name: LoanApplication
    parent: HomeSaleContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> HomeSaleContract.id; the purchase contract this application funds"
        constraints: "must reference a HomeSaleContract in contract_status PENDING or LOCKED"
      - name: lender_entity_code
        type: enum
        source: input
        description: Lender the buyer applied with; drives capture-rate accounting
        constraints: "AFFILIATED_LENDER | THIRD_PARTY_LENDER"
      - name: application_number
        type: string
        source: input
        description: Internal loan application file number
        constraints: "non-empty, unique across all applications"
      - name: qualification_score
        type: integer
        source: computed
        description: Integer qualification strength, 300..850, derived by mortgage_qualification_score
        default: 300
      - name: qualifying_income_cents
        type: integer
        source: input
        description: Monthly qualifying income used for debt-to-income gating
        constraints: "> 0"
      - name: monthly_debt_cents
        type: integer
        source: input
        description: Total monthly debt obligations excluding the proposed housing payment
        constraints: ">= 0"
      - name: dti_bps
        type: integer
        source: computed
        description: Debt-to-income ratio in basis points; provisional at SUBMITTED and final at QUALIFIED
        default: 0
      - name: lock_required_days
        type: integer
        source: computed
        description: Days from the current logical clock to HomeSite.estimated_completion_iso plus LOCK_BUFFER_DAYS
        default: 0
      - name: drift_flag
        type: boolean
        source: computed
        description: True when three consecutive EXPIRED application rows exist for the same contract_id and lender_entity_code
        default: false
      - name: application_status
        type: enum
        source: system
        description: Underwriting pipeline status — one of the two independently evolving state dimensions on this entity
        default: SUBMITTED
        constraints: "SUBMITTED | QUALIFIED | DENIED | EXPIRED"
      - name: lock_waiver_status
        type: enum
        source: system
        description: Banker-issued rate-lock waiver track — the second independently evolving state dimension on this entity
        default: NOT_REQUESTED
        constraints: "NOT_REQUESTED | REQUESTED | GRANTED | REFUSED"
      - name: uw_precedence
        type: string
        source: computed
        description: Canonical "{application_status}_{lock_waiver_status}" string consumed by SELECTOR-01 eligibility
        default: "SUBMITTED_NOT_REQUESTED"

  - name: RateLock
    parent: LoanApplication
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> LoanApplication.id; the application whose rate is being locked"
        constraints: "must reference a LoanApplication in application_status QUALIFIED or EXPIRED"
      - name: commitment_id
        type: string
        source: input
        description: "FK -> ForwardCommitment.id; the forward commitment whose purchased rate funds this lock"
        constraints: "must reference a ForwardCommitment in commitment_status OPEN"
      - name: lock_rate_bps
        type: integer
        source: input
        description: Mortgage rate in basis points fixed for the buyer at lock time
        constraints: "0 <= lock_rate_bps <= 2000"
      - name: lock_days
        type: integer
        source: input
        description: Requested lock length in calendar days; drives lock_extension_cost
        constraints: "15 <= lock_days <= 360"
      - name: lock_start_iso
        type: datetime
        source: system
        description: Instant the lock becomes effective; equals the logical clock at creation
        constraints: "ISO 8601 UTC"
      - name: lock_expires_iso
        type: datetime
        source: computed
        description: lock_start_iso + lock_days at 00:00:00Z of the resulting date
        constraints: "ISO 8601 UTC"
      - name: relock_fee_cents
        type: integer
        source: computed
        description: Fee charged when this lock was created by relocking an EXPIRED prior lock
        default: 0
      - name: relock_count
        type: integer
        source: system
        description: Number of times this lock has been relocked; relock is refused once relock_count == MAX_RELOCKS
        default: 0
      - name: lock_cost_cents
        type: integer
        source: computed
        description: Total borrower-borne lock cost; forward-commitment variant vs spot variant
        default: 0
      - name: lock_status
        type: enum
        source: system
        description: Lifecycle posture of the rate lock
        default: ACTIVE
        constraints: "ACTIVE | CONSUMED | EXPIRED | VOIDED"

  - name: BuydownCostRecord
    parent: HomeSaleContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> HomeSaleContract.id; the contract whose incentive this record accounts against"
        constraints: "must reference a HomeSaleContract in contract_status PENDING or LOCKED"
      - name: allocation_id
        type: string
        source: input
        description: "FK -> IncentiveAllocation.id; the allocation bucket this buydown draws from"
        constraints: "must reference an IncentiveAllocation in allocation_status RESERVED or APPLIED"
      - name: gross_buydown_cents
        type: integer
        source: input
        description: Buydown points and fees at list before any recapture credit
        constraints: "> 0"
      - name: recapture_credit_cents
        type: integer
        source: computed
        description: Credit applied when the contract closes early enough that unearned recapture is waived
        default: 0
      - name: allowed_buydown_cost_cents
        type: integer
        source: computed
        description: Buydown cost recognized as a sales incentive against home price after recapture
        default: 0
      - name: aba_cure_deadline_iso
        type: datetime
        source: computed
        description: Instant computed by aba_disclosure_cure_deadline_offset; earliest deadline still open on the contract
        constraints: "ISO 8601 UTC"
      - name: record_status
        type: enum
        source: system
        description: Accounting posture of the buydown cost record
        default: DRAFT
        constraints: "DRAFT | BOOKED | REVERSED"

  - name: IncentiveAllocation
    parent: HomeSaleContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> HomeSaleContract.id; the contract whose incentive budget is being allocated"
        constraints: "must reference a HomeSaleContract in contract_status PENDING or LOCKED"
      - name: bucket
        type: enum
        source: input
        description: Incentive bucket this allocation draws from
        constraints: "PRICE_REDUCTION | CLOSING_COSTS | RATE_BUYDOWN"
      - name: requested_cents
        type: integer
        source: input
        description: Incentive amount the sales office asked to allocate to this bucket
        constraints: "> 0"
      - name: allocation_total_cents
        type: integer
        source: computed
        description: Amount actually granted to this bucket after waterfall and tier rounding
        default: 0
      - name: spill_to_bucket
        type: enum
        source: computed
        description: Bucket that absorbed the overflow of this allocation, or null when nothing spilled
        constraints: "PRICE_REDUCTION | CLOSING_COSTS | RATE_BUYDOWN | null"
      - name: allocation_status
        type: enum
        source: system
        description: Lifecycle posture of the allocation
        default: PENDING
        constraints: "PENDING | RESERVED | APPLIED | REVERSED"

  - name: ABADisclosure
    parent: HomeSaleContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> HomeSaleContract.id; the contract this affiliated-business disclosure covers"
        constraints: "must reference an existing HomeSaleContract"
      - name: disclosure_type
        type: enum
        source: input
        description: Regulated disclosure form being delivered
        constraints: "AFFILIATED_BUSINESS_ARRANGEMENT | STEERING_PROHIBITION | RATE_BUYDOWN_TERMS"
      - name: delivery_iso
        type: datetime
        source: system
        description: Instant the disclosure was delivered; equals the logical clock at issue
        constraints: "ISO 8601 UTC"
      - name: cure_deadline_iso
        type: datetime
        source: computed
        description: delivery_iso + 3 calendar days at 00:00:00Z
        constraints: "ISO 8601 UTC"
      - name: disclosure_status
        type: enum
        source: system
        description: Lifecycle posture of the disclosure
        default: ISSUED
        constraints: "ISSUED | ACKNOWLEDGED | CURING | WAIVED"

  - name: DepositForfeiture
    parent: HomeSaleContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> HomeSaleContract.id; the cancelled contract whose deposit is being settled"
        constraints: "must reference a HomeSaleContract in contract_status CANCELLED"
      - name: statute_class
        type: enum
        source: input
        description: State statutory class governing how much of the deposit the seller may keep
        constraints: "FULL_FORFEITURE | PARTIAL_FORFEITURE | RESTITUTION_REQUIRED"
      - name: forfeited_cents
        type: integer
        source: computed
        description: Portion of the deposit retained by the seller under deposit_forfeiture_split
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: Portion of the deposit returned to the buyer under deposit_forfeiture_split
        default: 0
      - name: retained_incentive_cents
        type: integer
        source: computed
        description: Applied incentive spend the seller recaptures from the deposit on buyer-default cancellation
        default: 0
      - name: forfeiture_status
        type: enum
        source: system
        description: Lifecycle posture of the deposit settlement
        default: PROPOSED
        constraints: "PROPOSED | FINALIZED | VOIDED"

state_machines:
  - entity: Community
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: RESTRICTED
        trigger: "POST /housing/communities/{id}/posture"
        actor: ComplianceOfficer
        preconditions:
          - "capture_rate_bps < capture_rate_target_bps"
          - "program_status is currently ACTIVE"
        side_effects:
          - "program_status <- RESTRICTED"
          - "no child HomeSite or HomeSaleContract state changes; new incentive allocations are blocked by validations[priority=11]"
        note: "Restriction is a soft gate: existing LOCKED contracts may still close."
      - from: RESTRICTED
        to: ACTIVE
        trigger: "POST /housing/communities/{id}/posture"
        actor: ComplianceOfficer
        preconditions:
          - "capture_rate_bps >= capture_rate_target_bps"
          - "program_status is currently RESTRICTED"
        side_effects:
          - "program_status <- ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /housing/communities/{id}/posture"
        actor: ComplianceOfficer
        preconditions:
          - "at least one ABADisclosure in CURING status exists for a HomeSaleContract in this community"
          - "program_status is currently ACTIVE"
        side_effects:
          - "program_status <- SUSPENDED"
          - "cascade depth 1: every HomeSaleContract in this community with contract_status PENDING is force-CANCELLED with cancellation_reason=null (system suspension), driving DepositForfeiture creation under the generic-buyer-default path used by POST /housing/contracts/{id}/cancel"
          - "recomputes capture_rate_bps and incentive_spend_cents for the community"
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "POST /housing/communities/{id}/posture"
        actor: ComplianceOfficer
        preconditions:
          - "at least one ABADisclosure in CURING status exists for a HomeSaleContract in this community"
          - "program_status is currently RESTRICTED"
        side_effects:
          - "program_status <- SUSPENDED"
          - "cascade depth 1: every HomeSaleContract in this community with contract_status PENDING is force-CANCELLED with cancellation_reason=null, creating DepositForfeiture rows"

  - entity: HomeSite
    initial_state: AVAILABLE
    terminal_states: [SOLD]
    transitions:
      - from: AVAILABLE
        to: UNDER_CONTRACT
        trigger: "POST /housing/communities/{communityId}/home-sites/{id}/reserve"
        actor: SalesCounselor
        preconditions:
          - "community.program_status IN {ACTIVE, RESTRICTED}"
          - "home_site_status is currently AVAILABLE"
        side_effects:
          - "home_site_status <- UNDER_CONTRACT"
          - "recomputes community.forward_units_committed"
      - from: UNDER_CONTRACT
        to: AVAILABLE
        trigger: "POST /housing/contracts/{id}/cancel"
        actor: SalesCounselor
        preconditions:
          - "the HomeSaleContract whose home_site_id == this HomeSite.id reaches contract_status CANCELLED"
        side_effects:
          - "home_site_status <- AVAILABLE"
          - "recomputes community.forward_units_committed"
      - from: UNDER_CONTRACT
        to: SOLD
        trigger: "POST /housing/contracts/{id}/close"
        actor: ClosingOfficer
        preconditions:
          - "contract_status is currently APPROVED"
          - "at least one LoanApplication for the contract has application_status QUALIFIED"
        side_effects:
          - "home_site_status <- SOLD"
          - "cascade depth 1: every RateLock for the contract's LoanApplications moves lock_status ACTIVE -> CONSUMED"
          - "cascade depth 2: each consumed RateLock increments its ForwardCommitment.units_drawn by exactly 1"
          - "cascade depth 3: the ForwardCommitment recomputes units_available; if units_available == 0 the commitment moves OPEN -> EXHAUSTED"
          - "cascade depth 4: recomputes community.funded_units, community.affiliated_units and community.capture_rate_bps via capture_rate_realization"

  - entity: ForwardCommitment
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: EXHAUSTED
        trigger: "system event: cascade from POST /housing/contracts/{id}/close when the last whole unit is drawn"
        actor: system
        preconditions:
          - "units_available == 0 after applying the triggering RateLock consumption"
        side_effects:
          - "commitment_status <- EXHAUSTED"
          - "blocks new RateLock creation against this commitment via validations[priority=14]; contracts whose LoanApplication is already QUALIFIED are unaffected"
      - from: EXHAUSTED
        to: OPEN
        trigger: "POST /housing/rate-locks/{id}/void"
        actor: MortgageBanker
        preconditions:
          - "the voided RateLock's commitment_id == this ForwardCommitment.id"
          - "commitment_status is currently EXHAUSTED"
          - "lock_status is currently ACTIVE"
        side_effects:
          - "commitment_status <- OPEN"
          - "cascade depth 1: units_released += 1"
          - "cascade depth 2: recomputes units_available"
      - from: OPEN
        to: EXPIRED
        trigger: "system event: POST /housing/_clock/set_current_utc advancing the logical clock past commitment_end_iso"
        actor: system
        preconditions:
          - "current logical clock > commitment_end_iso"
          - "commitment_status is currently OPEN"
        side_effects:
          - "commitment_status <- EXPIRED"
          - "pair_off_fee_cents <- units_available * PAIR_OFF_FEE_PER_UNIT_CENTS"
          - "cascade depth 1: every RateLock whose commitment_id == this ForwardCommitment.id and lock_status == ACTIVE moves ACTIVE -> VOIDED"
          - "cascade depth 2: each voided RateLock voids its LoanApplication rate-lock waiver track via POST /housing/loan-applications/{id}/lock-waiver (REFUSED)"
      - from: OPEN
        to: CLOSED
        trigger: "POST /housing/forward-commitments/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "units_available == 0"
          - "commitment_status is currently OPEN"
        side_effects:
          - "commitment_status <- CLOSED"
          - "pair_off_fee_cents <- 0"
      - from: EXHAUSTED
        to: CLOSED
        trigger: "POST /housing/forward-commitments/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "units_available == 0"
          - "commitment_status is currently EXHAUSTED"
        side_effects:
          - "commitment_status <- CLOSED"
          - "pair_off_fee_cents <- 0"
      - from: EXPIRED
        to: CLOSED
        trigger: "POST /housing/forward-commitments/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "commitment_status is currently EXPIRED"
        side_effects:
          - "commitment_status <- CLOSED"
          - "pair_off_fee_cents is frozen at the value set by the OPEN -> EXPIRED transition"
        note: "Closing is purely an accounting seal; no further unit draws are possible."

  - entity: HomeSaleContract
    initial_state: PENDING
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PENDING
        to: LOCKED
        trigger: "POST /housing/contracts/{id}/lock"
        actor: MortgageBanker
        preconditions:
          - "contract_status is currently PENDING"
          - "the contract has at least one LoanApplication in application_status QUALIFIED"
          - "the selected RateLock was created against a ForwardCommitment in commitment_status OPEN"
        side_effects:
          - "contract_status <- LOCKED"
          - "cascade depth 1: Buyer.buyer_status CONTRACTED -> QUALIFIED"
          - "cascade depth 2: recomputes Buyer.steering_protection_flag"
      - from: LOCKED
        to: APPROVED
        trigger: "POST /housing/contracts/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "contract_status is currently LOCKED"
          - "every IncentiveAllocation for this contract has allocation_status IN {RESERVED, APPLIED}"
          - "every rate-buydown-bearing contract for this buyer has an ABADisclosure in disclosure_status ACKNOWLEDGED"
        side_effects:
          - "contract_status <- APPROVED"
          - "every IncentiveAllocation with allocation_status RESERVED moves RESERVED -> APPLIED"
          - "cascade depth 1: each applied RATE_BUYDOWN allocation recomputes its BuydownCostRecord.allowed_buydown_cost_cents via buydown_cost_recognition"
          - "cascade depth 2: recomputes Buyer.total_incentive_received_cents"
          - "recomputes community.incentive_spend_cents via capture_rate_realization"
      - from: LOCKED
        to: PENDING
        trigger: "POST /housing/rate-locks/{id}/void"
        actor: MortgageBanker
        preconditions:
          - "contract_status is currently LOCKED"
          - "the voided RateLock's application_id belongs to a LoanApplication whose contract_id == this contract"
          - "lock_status is currently ACTIVE"
        side_effects:
          - "contract_status <- PENDING"
          - "cascade depth 1: the contract's ABADisclosure rows move ACKNOWLEDGED -> ISSUED"
          - "cascade depth 2: Buyer.buyer_status QUALIFIED -> CONTRACTED"
          - "cascade depth 3: each reverted RATE_BUYDOWN allocation recomputes its BuydownCostRecord.allowed_buydown_cost_cents via buydown_cost_recognition, moving record_status BOOKED -> DRAFT"
          - "cascade depth 4: recomputes Buyer.total_incentive_received_cents and Buyer.steering_protection_flag"
      - from: APPROVED
        to: CLOSED
        trigger: "POST /housing/contracts/{id}/close"
        actor: ClosingOfficer
        preconditions:
          - "contract_status is currently APPROVED"
          - "HomeSite.home_site_status is currently UNDER_CONTRACT"
        side_effects:
          - "contract_status <- CLOSED"
          - "no DepositForfeiture row is created; deposit_held_cents stays equal to earnest_money_cents"
          - "cascade depth 1: HomeSite.home_site_status UNDER_CONTRACT -> SOLD"
          - "cascade depth 2: every RateLock for the contract's LoanApplications moves lock_status ACTIVE -> CONSUMED"
          - "cascade depth 3: each consumed RateLock increments its ForwardCommitment.units_drawn by exactly 1"
          - "cascade depth 4: recomputes community.funded_units, community.affiliated_units and community.capture_rate_bps via capture_rate_realization"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /housing/contracts/{id}/cancel"
        actor: SalesCounselor
        preconditions:
          - "contract_status is currently PENDING"
          - "cancellation_reason IN {BUYER_DEFAULT, CONSTRUCTION_DELAY, FINANCING_DENIED, RATE_SHOCK}"
        side_effects:
          - "contract_status <- CANCELLED"
          - "cancellation_reason set from the request"
          - "cascade depth 1: HomeSite.home_site_status UNDER_CONTRACT -> AVAILABLE"
          - "cascade depth 2: every IncentiveAllocation for this contract in allocation_status APPLIED moves APPLIED -> REVERSED"
          - "cascade depth 3: each reversed allocation recomputes its BuydownCostRecord.allowed_buydown_cost_cents via buydown_cost_recognition and moves record_status BOOKED -> REVERSED"
          - "cascade depth 4: recomputes Buyer.total_incentive_received_cents"
          - "creates a DepositForfeiture row in PROPOSED status whose statute_class is selected by deposit_statute_class_selector"
          - "every RateLock for the contract's LoanApplications moves lock_status ACTIVE -> VOIDED"
      - from: LOCKED
        to: CANCELLED
        trigger: "POST /housing/contracts/{id}/cancel"
        actor: SalesCounselor
        preconditions:
          - "contract_status is currently LOCKED"
          - "cancellation_reason IN {BUYER_DEFAULT, CONSTRUCTION_DELAY, FINANCING_DENIED, RATE_SHOCK}"
        side_effects:
          - "contract_status <- CANCELLED"
          - "cancellation_reason set from the request"
          - "cascade depth 1: HomeSite.home_site_status UNDER_CONTRACT -> AVAILABLE"
          - "cascade depth 2: every RateLock for the contract's LoanApplications moves lock_status ACTIVE -> VOIDED"
          - "cascade depth 3: each voided RateLock increments its ForwardCommitment.units_released by 1 and recomputes units_available"
          - "cascade depth 4: recomputes community.forward_units_committed"
          - "cascade depth 5: every IncentiveAllocation for this contract moves RESERVED -> REVERSED and recomputes its BuydownCostRecord.allowed_buydown_cost_cents via buydown_cost_recognition"
          - "creates a DepositForfeiture row in PROPOSED status whose statute_class is selected by deposit_statute_class_selector"
      - from: CANCELLED
        to: PENDING
        trigger: "POST /housing/contracts/{id}/reinstate"
        actor: SalesCounselor
        preconditions:
          - "contract_status is currently CANCELLED"
          - "the contract's HomeSite.home_site_status is currently AVAILABLE"
          - "the contract has zero DepositForfeiture rows in forfeiture_status FINALIZED"
          - "every DepositForfeiture row for this contract is in forfeiture_status PROPOSED"
        side_effects:
          - "contract_status <- PENDING"
          - "every DepositForfeiture row for this contract moves PROPOSED -> VOIDED"
          - "cascade depth 1: HomeSite.home_site_status AVAILABLE -> UNDER_CONTRACT"
          - "cascade depth 2: Buyer.buyer_status WITHDRAWN -> CONTRACTED"
          - "cascade depth 3: each REVERSED IncentiveAllocation for this contract moves REVERSED -> PENDING"
          - "cascade depth 4: recomputes Buyer.total_incentive_received_cents"

  - entity: LoanApplication
    initial_state: "SUBMITTED_NOT_REQUESTED"
    terminal_states: [DENIED, EXPIRED]
    transitions:
      # --- dimension 1: application_status ---
      - from: SUBMITTED
        to: QUALIFIED
        trigger: "POST /housing/loan-applications/{id}/qualify"
        actor: MortgageBanker
        preconditions:
          - "application_status is currently SUBMITTED"
          - "qualification_score >= QUALIFY_SCORE_FLOOR"
          - "dti_bps <= DTI_QUALIFY_CEILING_BPS"
        side_effects:
          - "application_status <- QUALIFIED"
          - "locks in final dti_bps (the provisional-to-final variant switch)"
          - "cascade depth 1: its HomeSaleContract.incentive_budget_cents is recomputed from the community policy"
          - "cascade depth 2: Buyer.buyer_status PROSPECT -> CONTRACTED"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /housing/loan-applications/{id}/deny"
        actor: MortgageBanker
        preconditions:
          - "application_status is currently SUBMITTED"
          - "lock_waiver_status IN {NOT_REQUESTED, REQUESTED, REFUSED}"
        side_effects:
          - "application_status <- DENIED"
          - "cascade depth 1: Buyer.buyer_status CONTRACTED -> QUALIFIED"
          - "cascade depth 2: if the buyer has no other LoanApplication in status SUBMITTED or QUALIFIED, Buyer.buyer_status -> PROSPECT"
      - from: QUALIFIED
        to: EXPIRED
        trigger: "system event: POST /housing/_clock/set_current_utc advancing the logical clock past the application's stale-qualification horizon"
        actor: system
        preconditions:
          - "current logical clock > (the application's most recent qualifying event instant + QUALIFICATION_VALID_DAYS)"
          - "application_status is currently QUALIFIED"
        side_effects:
          - "application_status <- EXPIRED"
          - "cascade depth 1: every RateLock with application_id == this application and lock_status == ACTIVE moves ACTIVE -> EXPIRED"
          - "cascade depth 2: each newly EXPIRED RateLock pushes its HomeSaleContract from LOCKED back to PENDING"
          - "cascade depth 3: recomputes Buyer.steering_protection_flag"
      - from: EXPIRED
        to: QUALIFIED
        trigger: "POST /housing/loan-applications/{id}/relock"
        actor: MortgageBanker
        preconditions:
          - "application_status is currently EXPIRED"
          - "drift_flag == false"
          - "qualification_score >= QUALIFY_SCORE_FLOOR"
        side_effects:
          - "application_status <- QUALIFIED (back edge; makes this dimension cyclic)"
          - "cascade depth 1: drift_flag is recomputed by the three-consecutive-EXPIRED scan"
          - "cascade depth 2: if drift_flag becomes true this application is excluded from SELECTOR-01 candidates"
      # --- dimension 2: lock_waiver_status (evolves independently of dimension 1) ---
      - from: NOT_REQUESTED
        to: REQUESTED
        trigger: "POST /housing/loan-applications/{id}/lock-waiver"
        actor: SalesCounselor
        preconditions:
          - "lock_waiver_status is currently NOT_REQUESTED"
          - "application_status IN {SUBMITTED, QUALIFIED, EXPIRED}"
        side_effects:
          - "lock_waiver_status <- REQUESTED"
          - "application_status is NOT modified; the two dimensions evolve independently"
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /housing/loan-applications/{id}/lock-waiver"
        actor: MortgageBanker
        preconditions:
          - "lock_waiver_status is currently REQUESTED"
          - "application_status == QUALIFIED"
        side_effects:
          - "lock_waiver_status <- GRANTED"
          - "application_status remains QUALIFIED"
      - from: REQUESTED
        to: REFUSED
        trigger: "POST /housing/loan-applications/{id}/lock-waiver"
        actor: MortgageBanker
        preconditions:
          - "lock_waiver_status is currently REQUESTED"
          - "application_status IN {SUBMITTED, DENIED}"
        side_effects:
          - "lock_waiver_status <- REFUSED"
      - from: GRANTED
        to: REQUESTED
        trigger: "POST /housing/loan-applications/{id}/lock-waiver"
        actor: MortgageBanker
        preconditions:
          - "lock_waiver_status is currently GRANTED"
          - "application_status == EXPIRED"
        side_effects:
          - "lock_waiver_status <- REQUESTED"
          - "the previously granted waiver is discarded; a fresh request is required"

  - entity: RateLock
    initial_state: ACTIVE
    terminal_states: [CONSUMED, EXPIRED, VOIDED]
    transitions:
      - from: ACTIVE
        to: CONSUMED
        trigger: "system event: cascade from POST /housing/contracts/{id}/close"
        actor: system
        preconditions:
          - "the owning HomeSaleContract reaches contract_status CLOSED"
          - "lock_status is currently ACTIVE"
        side_effects:
          - "lock_status <- CONSUMED"
          - "cascade depth 1: commitment.units_drawn += 1"
          - "cascade depth 2: commitment.units_available <- committed_units - units_drawn + units_released"
          - "cascade depth 3: if commitment.units_available == 0 the commitment moves OPEN -> EXHAUSTED"
          - "cascade depth 4: recomputes community.capture_rate_bps via capture_rate_realization"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system event: POST /housing/_clock/set_current_utc advancing the logical clock past lock_expires_iso"
        actor: system
        preconditions:
          - "current logical clock > lock_expires_iso"
          - "lock_status is currently ACTIVE"
        side_effects:
          - "lock_status <- EXPIRED"
          - "cascade depth 1: the lock's HomeSaleContract moves LOCKED -> PENDING"
          - "cascade depth 2: the contract's ABADisclosure rows move ACKNOWLEDGED -> ISSUED"
          - "cascade depth 3: Buyer.buyer_status QUALIFIED -> CONTRACTED"
          - "cascade depth 4: recomputes Buyer.total_incentive_received_cents and Buyer.steering_protection_flag"
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /housing/rate-locks/{id}/void"
        actor: MortgageBanker
        preconditions:
          - "lock_status is currently ACTIVE"
        side_effects:
          - "lock_status <- VOIDED"
          - "cascade depth 1: commitment.units_released += 1 and units_available recomputed"
          - "cascade depth 2: if commitment.commitment_status == EXHAUSTED it moves EXHAUSTED -> OPEN"
          - "cascade depth 3: recomputes community.forward_units_committed"
          - "cascade depth 4: if the owning contract_status == LOCKED it moves LOCKED -> PENDING with its full documented cascade"
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /housing/rate-locks/{id}/relock"
        actor: MortgageBanker
        preconditions:
          - "lock_status is currently EXPIRED"
          - "relock_count < MAX_RELOCKS"
          - "the lock's application has application_status QUALIFIED"
          - "the lock's commitment has commitment_status OPEN"
          - "the lock's commitment has units_available >= 1"
        side_effects:
          - "lock_status <- ACTIVE"
          - "relock_count += 1"
          - "lock_expires_iso <- recomputed from the current logical clock + lock_days"
          - "relock_fee_cents <- lock_extension_cost (relock variant)"
          - "cascade depth 1: the lock's HomeSaleContract moves PENDING -> LOCKED"
          - "cascade depth 2: the contract's ABADisclosure rows move ISSUED -> ACKNOWLEDGED"
          - "cascade depth 3: Buyer.buyer_status CONTRACTED -> QUALIFIED"
          - "cascade depth 4: recomputes Buyer.total_incentive_received_cents"

  - entity: IncentiveAllocation
    initial_state: PENDING
    terminal_states: [APPLIED, REVERSED]
    transitions:
      - from: PENDING
        to: RESERVED
        trigger: "POST /housing/contracts/{contractId}/incentive-allocations"
        actor: SalesCounselor
        preconditions:
          - "the contract's community.program_status IN {ACTIVE, RESTRICTED}"
          - "allocation_total_cents <= remaining cap of the target bucket plus eligible spill from lower-priority buckets"
        side_effects:
          - "allocation_status <- RESERVED"
          - "allocation_total_cents set by incentive_allocation_waterfall"
          - "spill_to_bucket set when the target bucket cap is exhausted"
          - "cascade depth 1: recomputes HomeSaleContract.incentive_allocated_cents"
          - "cascade depth 2: if the allocation is in RATE_BUYDOWN and a BuydownCostRecord exists for it, that record's allowed_buydown_cost_cents is recomputed via buydown_cost_recognition"
      - from: RESERVED
        to: APPLIED
        trigger: "system event: cascade from POST /housing/contracts/{id}/approve"
        actor: system
        preconditions:
          - "the owning HomeSaleContract reaches contract_status APPROVED"
          - "allocation_status is currently RESERVED"
        side_effects:
          - "allocation_status <- APPLIED"
          - "cascade depth 1: recomputes HomeSaleContract.incentive_allocated_cents"
          - "cascade depth 2: recomputes Buyer.total_incentive_received_cents"
          - "cascade depth 3: recomputes community.incentive_spend_cents"
      - from: RESERVED
        to: REVERSED
        trigger: "system event: cascade from POST /housing/contracts/{id}/cancel"
        actor: system
        preconditions:
          - "the owning HomeSaleContract reaches contract_status CANCELLED"
          - "allocation_status is currently RESERVED"
        side_effects:
          - "allocation_status <- REVERSED"
          - "cascade depth 1: the linked BuydownCostRecord, if any, recomputes allowed_buydown_cost_cents via buydown_cost_recognition"
          - "cascade depth 2: recomputes Buyer.total_incentive_received_cents"
      - from: APPLIED
        to: REVERSED
        trigger: "system event: cascade from POST /housing/contracts/{id}/cancel"
        actor: system
        preconditions:
          - "the owning HomeSaleContract reaches contract_status CANCELLED"
          - "allocation_status is currently APPLIED"
        side_effects:
          - "allocation_status <- REVERSED"
          - "cascade depth 1: the linked BuydownCostRecord recomputes allowed_buydown_cost_cents via buydown_cost_recognition and moves record_status BOOKED -> REVERSED"
          - "cascade depth 2: recomputes Buyer.total_incentive_received_cents"
      - from: REVERSED
        to: PENDING
        trigger: "system event: cascade from POST /housing/contracts/{id}/reinstate"
        actor: system
        preconditions:
          - "the owning HomeSaleContract reaches contract_status PENDING"
          - "allocation_status is currently REVERSED"
        side_effects:
          - "allocation_status <- PENDING"
          - "allocation_total_cents is retained so the waterfall need not be re-run"

  - entity: BuydownCostRecord
    initial_state: DRAFT
    terminal_states: [REVERSED]
    transitions:
      - from: DRAFT
        to: BOOKED
        trigger: "system event: cascade from POST /housing/contracts/{id}/approve"
        actor: system
        preconditions:
          - "the record's allocation is in allocation_status APPLIED"
          - "record_status is currently DRAFT"
        side_effects:
          - "record_status <- BOOKED"
          - "allowed_buydown_cost_cents <- gross_buydown_cents - recapture_credit_cents via buydown_cost_recognition"
          - "cascade depth 1: recomputes community.incentive_spend_cents"
      - from: BOOKED
        to: DRAFT
        trigger: "system event: cascade from POST /housing/rate-locks/{id}/void"
        actor: system
        preconditions:
          - "record_status is currently BOOKED"
          - "the owning contract moves LOCKED -> PENDING"
        side_effects:
          - "record_status <- DRAFT"
          - "allowed_buydown_cost_cents <- 0"
          - "cascade depth 1: recomputes community.incentive_spend_cents"
      - from: BOOKED
        to: REVERSED
        trigger: "system event: cascade from POST /housing/contracts/{id}/cancel"
        actor: system
        preconditions:
          - "the owning HomeSaleContract reaches contract_status CANCELLED"
          - "record_status is currently BOOKED"
        side_effects:
          - "record_status <- REVERSED"
          - "allowed_buydown_cost_cents <- 0"
          - "cascade depth 1: recomputes community.incentive_spend_cents"
      - from: DRAFT
        to: REVERSED
        trigger: "system event: cascade from POST /housing/contracts/{id}/cancel"
        actor: system
        preconditions:
          - "the owning HomeSaleContract reaches contract_status CANCELLED"
          - "record_status is currently DRAFT"
        side_effects:
          - "record_status <- REVERSED"
          - "allowed_buydown_cost_cents <- 0"

  - entity: ABADisclosure
    initial_state: ISSUED
    terminal_states: [WAIVED]
    transitions:
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /housing/disclosures/{id}/acknowledge"
        actor: Buyer
        preconditions:
          - "disclosure_status is currently ISSUED or CURING"
          - "the current logical clock <= cure_deadline_iso"
        side_effects:
          - "disclosure_status <- ACKNOWLEDGED"
          - "cascade depth 1: recomputes Buyer.steering_protection_flag"
      - from: ISSUED
        to: CURING
        trigger: "system event: POST /housing/_clock/set_current_utc advancing the logical clock past cure_deadline_iso"
        actor: system
        preconditions:
          - "current logical clock > cure_deadline_iso"
          - "disclosure_status is currently ISSUED"
        side_effects:
          - "disclosure_status <- CURING"
          - "cascade depth 1: recomputes Buyer.steering_protection_flag to false"
          - "cascade depth 2: the owning community's program_status moves to SUSPENDED via the RESTRICTED -> SUSPENDED transition"
      - from: ACKNOWLEDGED
        to: ISSUED
        trigger: "system event: cascade from POST /housing/rate-locks/{id}/void"
        actor: system
        preconditions:
          - "the owning contract moves LOCKED -> PENDING"
          - "disclosure_status is currently ACKNOWLEDGED"
        side_effects:
          - "disclosure_status <- ISSUED"
          - "cure_deadline_iso <- delivery_iso + 3 days recomputed from the current logical clock"
          - "cascade depth 1: recomputes Buyer.steering_protection_flag"
      - from: ISSUED
        to: WAIVED
        trigger: "POST /housing/disclosures/{id}/waive"
        actor: ComplianceOfficer
        preconditions:
          - "disclosure_status is currently ISSUED"
          - "the owning contract's community.program_status == SUSPENDED"
        side_effects:
          - "disclosure_status <- WAIVED"
          - "the record is annotated as officer-waived; the cure clock is not restarted"
          - "cascade depth 1: recomputes Buyer.steering_protection_flag"

  - entity: DepositForfeiture
    initial_state: PROPOSED
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: PROPOSED
        to: FINALIZED
        trigger: "POST /housing/deposit-forfeitures/{id}/finalize"
        actor: ClosingOfficer
        preconditions:
          - "forfeiture_status is currently PROPOSED"
          - "the owning HomeSaleContract has contract_status CANCELLED"
          - "forfeited_cents + refunded_cents == the contract's earnest_money_cents"
        side_effects:
          - "forfeiture_status <- FINALIZED"
          - "cascade depth 1: contract.deposit_held_cents <- forfeited_cents"
          - "cascade depth 2: Buyer.buyer_status -> WITHDRAWN"
          - "cascade depth 3: recomputes Buyer.total_incentive_received_cents"
      - from: PROPOSED
        to: VOIDED
        trigger: "system event: cascade from POST /housing/contracts/{id}/reinstate"
        actor: system
        preconditions:
          - "the owning HomeSaleContract returns to contract_status PENDING"
          - "forfeiture_status is currently PROPOSED"
        side_effects:
          - "forfeiture_status <- VOIDED"
          - "refunded_cents <- earnest_money_cents so no value is retained"

  - entity: Buyer
    initial_state: PROSPECT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PROSPECT
        to: CONTRACTED
        trigger: "system event: bubble-up from a LoanApplication SUBMITTED -> QUALIFIED cascade"
        actor: system
        preconditions:
          - "the buyer's LoanApplication reached application_status QUALIFIED"
        side_effects:
          - "buyer_status <- CONTRACTED"
          - "recomputes steering_protection_flag"
      - from: CONTRACTED
        to: QUALIFIED
        trigger: "system event: cross-entity cascade from HomeSaleContract LOCKED -> PENDING"
        actor: system
        preconditions:
          - "the buyer's contract moved LOCKED -> PENDING or the buyer's application was DENIED"
        side_effects:
          - "buyer_status <- QUALIFIED"
      - from: QUALIFIED
        to: CONTRACTED
        trigger: "system event: cross-entity cascade from HomeSaleContract PENDING -> LOCKED"
        actor: system
        preconditions:
          - "the buyer's contract moved PENDING -> LOCKED"
        side_effects:
          - "buyer_status <- CONTRACTED"
      - from: CONTRACTED
        to: WITHDRAWN
        trigger: "POST /housing/buyers/{id}/withdraw"
        actor: SalesCounselor
        preconditions:
          - "buyer_status IN {PROSPECT, QUALIFIED, CONTRACTED}"
          - "the buyer has no HomeSaleContract in contract_status LOCKED or APPROVED"
        side_effects:
          - "buyer_status <- WITHDRAWN"
          - "all of the buyer's LoanApplication rows with application_status SUBMITTED move SUBMITTED -> DENIED"
      - from: WITHDRAWN
        to: CONTRACTED
        trigger: "system event: cross-entity cascade from POST /housing/contracts/{id}/reinstate"
        actor: system
        preconditions:
          - "a HomeSaleContract for this buyer moved CANCELLED -> PENDING"
        side_effects:
          - "buyer_status <- CONTRACTED"
        note: "Compound behavior: Buyer.buyer_status is a bubble-up aggregate over the buyer's contracts and applications; every transition above is either a cascade from a child state change or a documented operator action."

concurrency_rules:
  - rule_id: allocation-recompute-stale-contract
    parent_entity: HomeSaleContract
    write_endpoint: "POST /housing/contracts/{id}/incentive-allocations"
    occ_field: "expected_contract_version"
    description: |
      Creating an IncentiveAllocation against a HomeSaleContract whose version
      has advanced since the client last read it is rejected. The product
      allows a newly created allocation to legitimately supersede the prior
      bucket split, so a writer holding a stale view of the contract would
      otherwise silently re-split a budget that has already moved.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
  - rule_id: buydown-create-stale-contract
    parent_entity: HomeSaleContract
    write_endpoint: "POST /housing/contracts/{id}/buydown-records"
    occ_field: "expected_contract_version"
    description: |
      Creating a BuydownCostRecord against a HomeSaleContract whose version
      has advanced since the client last read it is rejected. Buydown rows are
      additive and a later row may legitimately supersede an earlier draft, so
      the stale-view rejection is the only deterministic guard.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
  - rule_id: lock-create-stale-application
    parent_entity: LoanApplication
    write_endpoint: "POST /housing/loan-applications/{id}/rate-locks"
    occ_field: "expected_application_version"
    description: |
      Creating a RateLock against a LoanApplication whose version has advanced
      since the client last read it is rejected. A newly created lock may
      legitimately supersede the prior lock under the product's relock rules,
      so the writer's stale view of the application version is what makes the
      write unsafe.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
  - rule_id: forfeiture-create-stale-contract
    parent_entity: HomeSaleContract
    write_endpoint: "POST /housing/contracts/{id}/deposit-forfeitures"
    occ_field: "expected_contract_version"
    description: |
      Creating a DepositForfeiture against a HomeSaleContract whose version has
      advanced since the client last read it is rejected. The product permits a
      later settlement row to supersede an earlier proposed one, so a stale
      contract version is the only deterministic rejection signal.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

decision_policies:
  # Every rule below resolves "which entity" by description; §1.1–§1.7 must
  # never leave a candidate set, ordering key, tie-break, or empty-case
  # behaviour implicit. UUID/random id MUST NOT participate in any of them.
  - policy_id: SELECTOR-01
    name: rate_lock_application_selector
    question: "Given a HomeSaleContract, which LoanApplication may a new RateLock be created against?"
    eligibility_filter: "LoanApplication.application_status IN {QUALIFIED, EXPIRED} AND LoanApplication.contract_id == requesting contract's id"
    ranking_expression: "prefer application_status == QUALIFIED over EXPIRED; within the same application_status, prefer the earlier created_at"
    tie_break: "created_at ASC (earliest qualifying application wins); if created_at is exactly equal, the lower application_number by ASCII order wins"
    empty_set_fallback: "ERR_NO_QUALIFIED_APPLICATION (409)"
    forbidden_inputs: ["id", "any UUID ordering"]

  - policy_id: SELECTOR-02
    name: forward_commitment_selector
    question: "Which ForwardCommitment funds a new RateLock for a community?"
    eligibility_filter: "ForwardCommitment.community_id == the contract's community id AND commitment_status == OPEN AND units_available >= 1 AND current logical clock BETWEEN commitment_start_iso AND commitment_end_iso (both inclusive)"
    ranking_expression: "lowest committed_rate_bps first (cheapest purchased rate funds the advertised below-market rate); within equal committed_rate_bps, earliest commitment_start_iso first"
    tie_break: "created_at ASC (earliest created commitment wins); if created_at is exactly equal, the lexicographically smaller commitment_code wins"
    empty_set_fallback: "ERR_FORWARD_COMMITMENT_EXHAUSTED (409)"
    forbidden_inputs: ["id"]

  - policy_id: SELECTOR-03
    name: deposit_statute_class_selector
    question: "Which statute_class governs a cancellation's deposit settlement?"
    eligibility_filter: "the cancelled contract's cancellation_reason together with Buyer.state_code"
    ranking_expression: "if cancellation_reason == BUYER_DEFAULT then statute_class = FULL_FORFEITURE when Buyer.state_code IN {FL, TX}, PARTIAL_FORFEITURE when Buyer.state_code IN {CA, NY, IL}, and otherwise no statute applies in that jurisdiction; if cancellation_reason IN {CONSTRUCTION_DELAY, RATE_SHOCK, FINANCING_DENIED} then statute_class = RESTITUTION_REQUIRED; when cancellation_reason is null (community suspension) statute_class = RESTITUTION_REQUIRED"
    tie_break: "not applicable — exactly one statute_class is selected per contract"
    empty_set_fallback: "ERR_FORFEITURE_STATUTE_UNDETERMINED (409) when cancellation_reason == BUYER_DEFAULT and Buyer.state_code is not in the mapped set {FL, TX, CA, NY, IL}"
    forbidden_inputs: ["id"]

  - policy_id: SELECTOR-04
    name: incentive_bucket_priority_selector
    question: "In what order does the incentive waterfall fill buckets?"
    eligibility_filter: "the three buckets declared by the contract's Community incentive policy: PRICE_REDUCTION, CLOSING_COSTS, RATE_BUYDOWN"
    ranking_expression: "fixed priority order PRICE_REDUCTION > CLOSING_COSTS > RATE_BUYDOWN (a lower-priority bucket fills only from the overflow that a higher-priority bucket's cap cannot absorb)"
    tie_break: "the priority order is total, so no tie-break is required; within a bucket, allocations are ordered by created_at ASC"
    empty_set_fallback: "ERR_INCENTIVE_BUDGET_EXHAUSTED (422) when requested_cents exceeds the sum of all three remaining caps"
    forbidden_inputs: ["id"]

calculations:
  - name: capture_rate_realization
    trigger: "on every HomeSaleContract CLOSED transition, on ForwardCommitment EXPIRED, and on GET /housing/communities/{id}"
    algorithm: aggregation
    formula: |
      # Two variants deliberately diverge: the community's published capture rate
      # is measured over funded units, but the compliance capture rate is
      # measured over closed contracts whose application was affiliated.
      funded_units = count(HomeSaleContract where home_site.community_id == C.id
                           and contract_status == CLOSED)
      affiliated_units = count(HomeSaleContract where home_site.community_id == C.id
                               and contract_status == CLOSED
                               and exists(LoanApplication where contract_id == contract.id
                                          and lender_entity_code == AFFILIATED_LENDER))
      capture_rate_bps = (affiliated_units * 10000) // funded_units
      incentive_spend_cents = sum(BuydownCostRecord.allowed_buydown_cost_cents
                                  where record_status == BOOKED
                                  and contract.home_site.community_id == C.id)
      forward_units_committed = sum(ForwardCommitment.committed_units
                                    where community_id == C.id
                                    and commitment_status IN {OPEN, EXHAUSTED})
    input_set: "CLOSED contracts only enter funded_units and affiliated_units; LOCKED, APPROVED, PENDING and CANCELLED contracts are excluded. Only BOOKED buydown records enter incentive_spend_cents; DRAFT and REVERSED are excluded. Only OPEN and EXHAUSTED commitments enter forward_units_committed; EXPIRED and CLOSED are excluded."
    constants:
      CAPTURE_RATE_TARGET_DEFAULT_BPS: 8500
      SUSPEND_CAPTURE_SHORTFALL_BPS: 2000
    precision: "integer basis points, floor division; no rounding"
    variants:
      - name: published_capture_rate
        when: "the community's marketing and investor reporting read the rate"
        difference: "counts every CLOSED contract in funded_units regardless of whether a LoanApplication row exists; a contract closed without any application row still counts in the denominator, which lowers the rate"
      - name: compliance_capture_rate
        when: "the affiliated-business-arrangement audit reads the rate"
        difference: "funded_units is restricted to CLOSED contracts that have at least one LoanApplication row of any lender_entity_code; contracts with no application row are dropped from numerator and denominator alike, which raises the rate whenever such contracts exist"

  - name: mortgage_qualification_score
    trigger: "on LoanApplication creation and on POST /housing/loan-applications/{id}/qualify"
    algorithm: weighted_scoring
    formula: |
      # Component scores are clamped first, then weighted, then floored once at the end.
      base_score = 300 + (min(qualifying_income_cents, INCOME_CAP_CENTS) * 40) // INCOME_CAP_CENTS
      dti_component = 0 if qualifying_income_cents == 0 else
                      max(0, 250 - (monthly_debt_cents * 250) // qualifying_income_cents)
      tier_bonus = 60 if qualifying_income_cents >= 1200000 else
                   30 if qualifying_income_cents >= 900000 else
                   0
      raw = base_score + dti_component + tier_bonus
      qualification_score = min(850, max(300, raw))
      dti_bps = (monthly_debt_cents * 10000) // qualifying_income_cents
    input_set: "Uses the application's own qualifying_income_cents and monthly_debt_cents only; no other application or contract fields enter."
    constants:
      INCOME_CAP_CENTS: 2000000
      QUALIFY_SCORE_FLOOR: 620
      DTI_QUALIFY_CEILING_BPS: 4500
      PREMIUM_INCOME_TIER_CENTS: 1200000
      STANDARD_INCOME_TIER_CENTS: 900000
      QUALIFICATION_VALID_DAYS: 120
    precision: "qualification_score is an integer in [300, 850]; dti_bps is an integer, floor division"
    variants:
      - name: provisional_score
        when: "application_status == SUBMITTED; the score is recomputed on every read"
        difference: "recomputes both qualification_score and dti_bps from the current income and debt inputs; dti_bps may change between reads"
      - name: final_score
        when: "application_status == QUALIFIED; the score was frozen at the qualifying instant"
        difference: "dti_bps is frozen at the value it held when SUBMITTED -> QUALIFIED fired and MUST NOT move when qualifying_income_cents or monthly_debt_cents are later edited"

  - name: incentive_allocation_waterfall
    trigger: "on POST /housing/contracts/{contractId}/incentive-allocations"
    algorithm: waterfall_allocation
    formula: |
      # Buckets are filled in the fixed SELECTOR-04 priority order.
      caps = {PRICE_REDUCTION: community.price_reduction_cap_cents,
              CLOSING_COSTS:   community.closing_cost_cap_cents,
              RATE_BUYDOWN:    community.rate_buydown_cap_cents}
      remaining = {b: caps[b] - sum(allocation_total_cents of already-RESERVED or APPLIED
                                    allocations for this contract in bucket b) for b in caps}
      target = the requested bucket
      granted = min(requested_cents, remaining[target])
      overflow = requested_cents - granted
      for b in priority_order_after(target):
          take = min(overflow, remaining[b])
          granted += take
          if take > 0 and spill_to_bucket is unset:
              spill_to_bucket = b
          overflow -= take
          if overflow == 0: break
      allocation_total_cents = granted
    input_set: "Already-RESERVED and already-APPLIED allocations of the same contract consume their bucket's cap; PENDING and REVERSED allocations consume nothing. Overflow only ever moves DOWN the priority order PRICE_REDUCTION > CLOSING_COSTS > RATE_BUYDOWN — it never moves up."
    constants:
      PRIORITY_ORDER: "PRICE_REDUCTION, CLOSING_COSTS, RATE_BUYDOWN"
    precision: "integer cents, no rounding. ROUNDING ORDER IS PINNED: the base formula floors once per bucket, then sums; a percentage applied to the whole budget instead of per bucket is the aggregate_rounding variant and is a different number."
    variants:
      - name: per_bucket_rounding
        when: "a percentage-based incentive is applied inside each bucket"
        difference: "each bucket's percentage amount is computed and floored to whole cents independently, and the bucket totals are then summed"
      - name: aggregate_rounding
        when: "the same percentage is applied to the whole incentive budget"
        difference: "the percentage is applied once to the summed budget and floored once; the two variants differ by up to 2 cents whenever the per-bucket remainders sum to >= 1 cent"

  - name: buydown_cost_recognition
    trigger: "on BuydownCostRecord transitions DRAFT -> BOOKED and BOOKED -> REVERSED, and on GET /housing/buydown-records/{id}"
    algorithm: threshold
    formula: |
      # Recapture is waived only once the contract survives the recapture window.
      if contract.contract_status == CLOSED and
         (contract.closed_at - record.created_at) >= RECAPTURE_WINDOW_DAYS days:
          recapture_credit_cents = gross_buydown_cents
      elif contract.contract_status == CLOSED and
           (contract.closed_at - record.created_at) < RECAPTURE_WINDOW_DAYS days:
          recapture_credit_cents = (gross_buydown_cents * days_held) // RECAPTURE_WINDOW_DAYS
      else:
          recapture_credit_cents = 0
      allowed_buydown_cost_cents = max(0, gross_buydown_cents - recapture_credit_cents)
    input_set: "Only the owning contract's contract_status and closed_at, and the record's own gross_buydown_cents, enter. BuydownCostRecord rows in REVERSED status are excluded from community.incentive_spend_cents even though allowed_buydown_cost_cents is 0 for them."
    constants:
      RECAPTURE_WINDOW_DAYS: 365
    precision: "integer cents, floor division"
    variants:
      - name: books_full_points_as_incentive
        when: "the accounting view that treats the whole buydown as a sales incentive against home price"
        difference: "allowed_buydown_cost_cents = gross_buydown_cents; recapture_credit_cents is ignored, producing a larger incentive_spend_cents than the recognition view"
      - name: books_net_of_recapture
        when: "the disclosure view that recognizes only the unearned portion as incentive spend"
        difference: "allowed_buydown_cost_cents = gross_buydown_cents - recapture_credit_cents, which is strictly smaller whenever the contract closes inside the recapture window"

  - name: lock_extension_cost
    trigger: "on POST /housing/rate-locks/{id}/extend and on POST /housing/rate-locks/{id}/relock"
    algorithm: tiered_pricing
    formula: |
      # Marginal tiers: the first 15 extra days are free, the next 15 are billed
      # at the mid rate, everything beyond 30 days is billed at the high rate.
      extra_days = new_lock_days - original_lock_days
      if extra_days <= FREE_EXTENSION_DAYS:
          cost = 0
      else:
          tier1 = min(extra_days, FREE_EXTENSION_DAYS + MID_TIER_DAYS) - FREE_EXTENSION_DAYS
          tier2 = max(0, extra_days - (FREE_EXTENSION_DAYS + MID_TIER_DAYS))
          cost = (tier1 * MID_TIER_RATE_CENTS_PER_DAY) + (tier2 * HIGH_TIER_RATE_CENTS_PER_DAY)
      lock_cost_cents = cost  # extension variant
      lock_cost_cents = cost + RELOCK_FLAT_FEE_CENTS * (relock_count + 1)  # relock variant
    input_set: "extra_days is measured against the lock's original lock_days, not against the number of days already elapsed. A relock uses the relock variant; a plain extension uses the extension variant."
    constants:
      FREE_EXTENSION_DAYS: 15
      MID_TIER_DAYS: 15
      MID_TIER_RATE_CENTS_PER_DAY: 45
      HIGH_TIER_RATE_CENTS_PER_DAY: 110
      RELOCK_FLAT_FEE_CENTS: 120000
      MAX_RELOCKS: 2
    precision: "integer cents, no rounding"
    variants:
      - name: extension_variant
        when: "POST /housing/rate-locks/{id}/extend moves an ACTIVE lock's expiry later"
        difference: "cost is the marginal tier charge only; the flat relock fee is not applied and relock_count is unchanged"
      - name: relock_variant
        when: "POST /housing/rate-locks/{id}/relock revives an EXPIRED lock"
        difference: "cost adds RELOCK_FLAT_FEE_CENTS multiplied by (relock_count + 1), so the second relock costs twice the flat fee of the first; relock_count increments by one"

  - name: aba_disclosure_cure_deadline_offset
    trigger: "on ABADisclosure creation and on GET /housing/contracts/{id}/disclosures"
    algorithm: chronological
    formula: |
      # Returns the EARLIEST deadline that is still open on the contract.
      candidates = [d.cure_deadline_iso for d in ABADisclosure
                    where d.contract_id == contract.id
                    and d.disclosure_status IN {ISSUED, CURING}]
      aba_cure_deadline_iso = min(candidates) if candidates else null
      # Each disclosure's own deadline:
      cure_deadline_iso = (delivery_iso truncated to 00:00:00Z) + CURE_GRACE_DAYS
    input_set: "ACKNOWLEDGED and WAIVED disclosures are excluded from the candidate set entirely — an acknowledged disclosure cannot resurrect an expired cure window. When no candidate remains, aba_cure_deadline_iso is null and the record is fully cured."
    constants:
      CURE_GRACE_DAYS: 3
    precision: "date arithmetic on whole days; the deadline is always at 00:00:00Z"
    variants:
      - name: strict_cure_window
        when: "the compliance audit reads the deadline"
        difference: "an ABADisclosure issued at any instant on day D has its deadline at 00:00:00Z of day D+3, so a disclosure issued late in the day has a proportionally shorter usable window"
      - name: delivery_inclusive_cure_window
        when: "the sales desk's customer-facing tracker reads the deadline"
        difference: "the deadline is computed as 00:00:00Z of day D+3 plus the delivery time-of-day, giving every disclosure a full 72 hours; it is strictly later than the strict variant whenever delivery_iso is not exactly midnight"

  - name: deposit_forfeiture_split
    trigger: "on POST /housing/contracts/{id}/cancel and on POST /housing/contracts/{id}/deposit-forfeitures"
    algorithm: threshold
    formula: |
      # Selection happens first (SELECTOR-03), then the split arithmetic.
      if statute_class == FULL_FORFEITURE:
          forfeited_cents = contract.earnest_money_cents
      elif statute_class == PARTIAL_FORFEITURE:
          forfeited_cents = min(contract.earnest_money_cents,
                                contract.purchase_price_cents * PARTIAL_FORFEITURE_BPS // 10000)
      else:  # RESTITUTION_REQUIRED
          forfeited_cents = 0
      refunded_cents = contract.earnest_money_cents - forfeited_cents
      # Retained incentive is added only on the buyer-default path.
      if contract.cancellation_reason == BUYER_DEFAULT and statute_class != RESTITUTION_REQUIRED:
          retained_incentive_cents = min(contract.incentive_allocated_cents,
                                         max(0, forfeited_cents - TIER_SHIFT_GUARD_CENTS))
      else:
          retained_incentive_cents = 0
    input_set: "only the cancelled contract's earnest_money_cents and purchase_price_cents enter the split. Contracts cancelled with cancellation_reason CONSTRUCTION_DELAY, RATE_SHOCK, FINANCING_DENIED or null are driven to RESTITUTION_REQUIRED by SELECTOR-03, so forfeited_cents is 0 for them."
    constants:
      PARTIAL_FORFEITURE_BPS: 500
      TIER_SHIFT_GUARD_CENTS: 500000
    precision: "integer cents, floor division on the basis-point term"
    variants:
      - name: seller_maximum_view
        when: "the seller's revenue-recognition view"
        difference: "forfeited_cents is capped at min(earnest_money_cents, purchase_price_cents * 500 // 10000) for PARTIAL_FORFEITURE and retained_incentive_cents is recognised in full up to that cap"
      - name: statutory_minimum_restoration_view
        when: "the state's restitution view for non-default cancellations"
        difference: "forfeited_cents is forced to 0 and refunded_cents is forced to earnest_money_cents regardless of the arithmetic above; the two variants diverge by the full earnest_money_cents on any non-BUYER_DEFAULT cancellation"

  - name: forward_commitment_draw_down
    trigger: "on HOME_SALE_CONTRACT closed → RateLock consumed → commitment draw sequence"
    algorithm: aggregation
    formula: |
      units_available = committed_units - units_drawn + units_released
      # Drawn never decreases; released never decreases. Both monotone.
      if lock_status == CONSUMED: units_drawn += 1
      if lock_status == VOIDED:   units_released += 1
      pair_off_fee_cents = units_available * PAIR_OFF_FEE_PER_UNIT_CENTS
    input_set: "Only RateLock rows whose lock_status is CONSUMED or VOIDED contribute. ACTIVE, EXPIRED and REVOKED locks contribute zero."
    constants:
      PAIR_OFF_FEE_PER_UNIT_CENTS: 95000
    precision: "integer units, integer cents"
    variants:
      - name: draw_first_then_release
        when: "the commitment's lifecycle consumes then voids"
        difference: "units_available = committed_units - units_drawn + units_released; a voided lock returns a unit to the available pool and can reopen an EXHAUSTED commitment"
      - name: consume_only_immutable_ledger
        when: "the commitment's lifecycle forbids any unit return"
        difference: "units_available = committed_units - units_drawn, permanently; a voided lock loses the unit forever and an EXHAUSTED commitment can never reopen"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present; X-User-Role names a role declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /housing/_clock/set_current_utc, GET /housing/communities, GET /housing/communities/{id}"

  - priority: 2
    category: auth
    check: "the authenticated role is listed in the endpoint's roles set"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every path and body reference resolves to an existing row, validated left-to-right along the path (community, then home site, then contract, then application, then rate lock, then allocation)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying a path id or a body foreign key"

  - priority: 4
    category: state
    check: "the target row is in a state that permits the requested transition, evaluated against the source state in the entity's state machine"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-changing endpoint"

  - priority: 5
    category: business_referential
    check: "creating a HomeSaleContract requires its HomeSite.home_site_status == AVAILABLE, and creating a LoanApplication requires its HomeSaleContract.contract_status IN {PENDING, LOCKED}"
    error_id: ERR_HOME_SITE_NOT_AVAILABLE
    http_status: 409
    applies_to: ["POST /housing/home-sites/{id}/contracts", "POST /housing/contracts/{id}/loan-applications"]

  - priority: 6
    category: business_safety
    check: "any contract carrying a RATE_BUYDOWN allocation in RESERVED or APPLIED status must have at least one ABADisclosure of type AFFILIATED_BUSINESS_ARRANGEMENT for that contract whose disclosure_status == ACKNOWLEDGED"
    error_id: ERR_ABA_DISCLOSURE_MISSING
    http_status: 403
    applies_to: ["POST /housing/contracts/{id}/approve", "POST /housing/contracts/{contractId}/incentive-allocations"]

  - priority: 7
    category: business_safety
    check: "an incentive may not be conditioned on lender choice: creating a LoanApplication with lender_entity_code AFFILIATED_LENDER is refused when the contract already carries an incentive allocation whose bucket == RATE_BUYDOWN and the contract has no ACKNOWLEDGED STEERING_PROHIBITION disclosure"
    error_id: ERR_STEERING_PROHIBITED
    http_status: 403
    applies_to: ["POST /housing/contracts/{id}/loan-applications"]

  - priority: 8
    category: business_safety
    check: "the application's dti_bps <= DTI_QUALIFY_CEILING_BPS (4500)"
    error_id: ERR_DTI_CEILING_EXCEEDED
    http_status: 422
    applies_to: ["POST /housing/loan-applications/{id}/qualify"]

  - priority: 9
    category: business_safety
    check: "the application's qualification_score >= QUALIFY_SCORE_FLOOR (620)"
    error_id: ERR_QUALIFICATION_SCORE_BELOW_FLOOR
    http_status: 422
    applies_to: ["POST /housing/loan-applications/{id}/qualify", "POST /housing/loan-applications/{id}/relock"]

  - priority: 10
    category: business_safety
    check: "the contract's Community.program_status is not SUSPENDED"
    error_id: ERR_COMMUNITY_SUSPENDED
    http_status: 403
    applies_to: ["POST /housing/contracts/{contractId}/incentive-allocations", "POST /housing/contracts/{id}/buydown-records", "POST /housing/home-sites/{id}/contracts"]

  - priority: 11
    category: business_safety
    check: "the application is not excluded from the candidate pool by drift: drift_flag == false"
    error_id: ERR_APPLICATION_DRIFT_EXCLUDED
    http_status: 409
    applies_to: ["POST /housing/loan-applications/{id}/relock"]

  - priority: 12
    category: business_temporal
    check: "the current logical clock lies within the selected ForwardCommitment's window, commitment_start_iso <= clock <= commitment_end_iso (both endpoints inclusive)"
    error_id: ERR_COMMITMENT_WINDOW_CLOSED
    http_status: 409
    applies_to: ["POST /housing/loan-applications/{id}/rate-locks", "POST /housing/rate-locks/{id}/relock"]

  - priority: 13
    category: business_temporal
    check: "the current logical clock <= HomeSite.advertised_rate_expires_iso whenever the lock rate equals the advertised below-market rate"
    error_id: ERR_ADVERTISED_RATE_EXPIRED
    http_status: 409
    applies_to: ["POST /housing/loan-applications/{id}/rate-locks"]

  - priority: 14
    category: business_temporal
    check: "the target RateLock's lock_status is ACTIVE and the current logical clock <= lock_expires_iso"
    error_id: ERR_RATE_LOCK_EXPIRED
    http_status: 409
    applies_to: ["POST /housing/rate-locks/{id}/extend", "POST /housing/rate-locks/{id}/void"]

  - priority: 15
    category: business_temporal
    check: "the target RateLock's relock_count < MAX_RELOCKS (2)"
    error_id: ERR_RELOCK_LIMIT_REACHED
    http_status: 409
    applies_to: ["POST /housing/rate-locks/{id}/relock"]

  - priority: 16
    category: business_temporal
    check: "a new ForwardCommitment's [commitment_start_iso, commitment_end_iso) closed-open window must not overlap an existing OPEN or EXHAUSTED commitment of the same community, and its (committed_rate_bps, committed_units) draw pool must not overlap an existing commitment for the same community whose window is adjacent"
    error_id: ERR_COMMITMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /housing/communities/{communityId}/forward-commitments"]

  - priority: 17
    category: business_temporal
    check: "a new RateLock's [lock_start_iso, lock_expires_iso] closed interval must not overlap another ACTIVE lock interval on the same ForwardCommitment unit pool beyond that commitment's units_available at the proposed start instant"
    error_id: ERR_LOCK_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /housing/loan-applications/{id}/rate-locks"]

  - priority: 18
    category: business_fiscal
    check: "the selected ForwardCommitment has units_available >= 1"
    error_id: ERR_FORWARD_COMMITMENT_EXHAUSTED
    http_status: 409
    applies_to: ["POST /housing/loan-applications/{id}/rate-locks"]

  - priority: 19
    category: business_fiscal
    check: "the allocation's requested_cents does not exceed the sum of the three remaining bucket caps of the contract's community policy"
    error_id: ERR_INCENTIVE_BUDGET_EXHAUSTED
    http_status: 422
    applies_to: ["POST /housing/contracts/{contractId}/incentive-allocations"]

  - priority: 20
    category: business_fiscal
    check: "a BuydownCostRecord's gross_buydown_cents does not exceed the allocation_total_cents of its linked RATE_BUYDOWN allocation"
    error_id: ERR_BUYDOWN_EXCEEDS_ALLOCATION
    http_status: 422
    applies_to: ["POST /housing/contracts/{id}/buydown-records"]

  - priority: 21
    category: business_fiscal
    check: "a DepositForfeiture settlement conserves the deposit: forfeited_cents + refunded_cents == the contract's earnest_money_cents"
    error_id: ERR_DEPOSIT_SUM_MISMATCH
    http_status: 422
    applies_to: ["POST /housing/contracts/{id}/deposit-forfeitures", "POST /housing/deposit-forfeitures/{id}/finalize"]

  - priority: 22
    category: business_constraint
    check: "an application may hold at most one RateLock in lock_status ACTIVE"
    error_id: ERR_DUPLICATE_ACTIVE_LOCK
    http_status: 409
    applies_to: ["POST /housing/loan-applications/{id}/rate-locks", "POST /housing/rate-locks/{id}/relock"]

  - priority: 23
    category: business_constraint
    check: "the request carries expected_<parent>_version equal to the parent row's current version"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: ["POST /housing/contracts/{id}/incentive-allocations", "POST /housing/contracts/{id}/buydown-records", "POST /housing/contracts/{id}/deposit-forfeitures"]

  - priority: 23
    category: business_constraint
    check: "the request carries expected_application_version equal to the LoanApplication row's current version"
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
    applies_to: ["POST /housing/loan-applications/{id}/rate-locks"]

  - priority: 24
    category: business_constraint
    check: "every field listed as required in the endpoint's input schema is present and non-null"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 25
    category: business_constraint
    check: "every enum-typed field carries a member of its declared constraint set, and every numeric field lies inside its declared bounds"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 400
    applies_to: "all mutating endpoints"

endpoints:
  # --- Community ---
  - method: GET
    path: "/housing/communities"
    description: "List the public community catalogue with pagination"
    roles: [Anonymous, PlatformAdmin, SalesCounselor, MortgageBanker, ClosingOfficer, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Community[]
    side_effects: []

  - method: POST
    path: "/housing/communities"
    description: "Create a master-planned community and fix its three incentive bucket caps"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 201
    input: [name, state_code, incentive_policy_code, price_reduction_cap_cents, closing_cost_cap_cents, rate_buydown_cap_cents, "capture_rate_target_bps?"]
    output: Community
    side_effects:
      - "program_status=ACTIVE, affiliated_units=0, funded_units=0, capture_rate_bps=0, incentive_spend_cents=0, forward_units_committed=0"

  - method: GET
    path: "/housing/communities/{id}"
    description: "Get a community including its derived capture-rate and incentive-spend fields"
    roles: [PlatformAdmin, SalesCounselor, MortgageBanker, ClosingOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: Community
    side_effects: []

  - method: POST
    path: "/housing/communities/{id}/posture"
    description: "Move a community between ACTIVE, RESTRICTED and SUSPENDED; SUSPENDED force-cancels every PENDING contract in the community"
    roles: [ComplianceOfficer]
    code: 200
    input: [target_status]
    output: Community
    side_effects:
      - "program_status <- target_status"
      - "on target_status=SUSPENDED: every HomeSaleContract in this community with contract_status PENDING moves PENDING -> CANCELLED and a DepositForfeiture row is created in PROPOSED"
      - "recomputes capture_rate_bps and incentive_spend_cents via capture_rate_realization"

  - method: GET
    path: "/housing/communities/{id}/forward-commitments"
    description: "List the forward commitments belonging to a community"
    roles: [PlatformAdmin, MortgageBanker, ComplianceOfficer]
    code: 200
    input: []
    output: ForwardCommitment[]
    side_effects: []

  - method: GET
    path: "/housing/communities/{id}/home-sites"
    description: "List the inventory home sites belonging to a community"
    roles: [PlatformAdmin, SalesCounselor, MortgageBanker, ComplianceOfficer]
    code: 200
    input: []
    output: HomeSite[]
    side_effects: []

  # --- ForwardCommitment ---
  - method: POST
    path: "/housing/communities/{communityId}/forward-commitments"
    description: "Purchase a bulk forward rate commitment for a community; the window may not overlap an existing open commitment"
    roles: [MortgageBanker, PlatformAdmin]
    code: 201
    input: [commitment_code, investor_name, committed_rate_bps, committed_units, commitment_start_iso, commitment_end_iso]
    output: ForwardCommitment
    side_effects:
      - "commitment_status=OPEN, units_drawn=0, units_released=0, units_available=committed_units, pair_off_fee_cents=0"
      - "recomputes community.forward_units_committed via capture_rate_realization"

  - method: GET
    path: "/housing/forward-commitments/{id}"
    description: "Get a forward commitment including its derived units_available"
    roles: [PlatformAdmin, MortgageBanker, ComplianceOfficer]
    code: 200
    input: []
    output: ForwardCommitment
    side_effects: []

  - method: POST
    path: "/housing/forward-commitments/{id}/close"
    description: "Seal a commitment for accounting once no units remain drawable"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ForwardCommitment
    side_effects:
      - "commitment_status <- CLOSED"
      - "pair_off_fee_cents <- 0"
      - "recomputes community.forward_units_committed"

  - method: GET
    path: "/housing/forward-commitments/{id}/rate-locks"
    description: "List the rate locks funded by a forward commitment"
    roles: [PlatformAdmin, MortgageBanker, ClosingOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: RateLock[]
    side_effects: []

  # --- HomeSite ---
  - method: POST
    path: "/housing/communities/{communityId}/home-sites"
    description: "Create an inventory home site with its advertised below-market rate"
    roles: [SalesCounselor, PlatformAdmin]
    code: 201
    input: [lot_number, address, base_price_cents, construction_stage, estimated_completion_iso, advertised_rate_bps, advertised_rate_expires_iso]
    output: HomeSite
    side_effects: ["home_site_status=AVAILABLE"]

  - method: GET
    path: "/housing/home-sites/{id}"
    description: "Get an inventory home site"
    roles: [PlatformAdmin, SalesCounselor, MortgageBanker, ClosingOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: HomeSite
    side_effects: []

  - method: POST
    path: "/housing/communities/{communityId}/home-sites/{id}/reserve"
    description: "Reserve an available inventory home, moving it under contract"
    roles: [SalesCounselor]
    code: 200
    input: []
    output: HomeSite
    side_effects:
      - "home_site_status <- UNDER_CONTRACT"
      - "recomputes community.forward_units_committed"

  - method: GET
    path: "/housing/home-sites/{id}/contracts"
    description: "List the sale contracts written against a home site"
    roles: [PlatformAdmin, SalesCounselor, MortgageBanker, ClosingOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: HomeSaleContract[]
    side_effects: []

  # --- Buyer ---
  - method: POST
    path: "/housing/buyers"
    description: "Register a homebuyer prospect"
    roles: [SalesCounselor, PlatformAdmin]
    code: 201
    input: [full_name, email, state_code]
    output: Buyer
    side_effects:
      - "buyer_status=PROSPECT, affiliated_lender_selected=false, total_incentive_received_cents=0, steering_protection_flag=true"

  - method: GET
    path: "/housing/buyers/{id}"
    description: "Get a buyer including derived incentive totals and the steering-protection flag"
    roles: [PlatformAdmin, SalesCounselor, MortgageBanker, ClosingOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: Buyer
    side_effects: []

  - method: GET
    path: "/housing/buyers/{id}/contracts"
    description: "List the sale contracts written for a buyer"
    roles: [PlatformAdmin, SalesCounselor, MortgageBanker, ClosingOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: HomeSaleContract[]
    side_effects: []

  - method: POST
    path: "/housing/buyers/{id}/qualify"
    description: "Mark a prospect buyer as qualified once one of their applications is qualified"
    roles: [MortgageBanker]
    code: 200
    input: []
    output: Buyer
    side_effects: ["buyer_status <- QUALIFIED"]

  - method: POST
    path: "/housing/buyers/{id}/withdraw"
    description: "Withdraw a buyer who holds no locked or approved contract"
    roles: [SalesCounselor]
    code: 200
    input: []
    output: Buyer
    side_effects:
      - "buyer_status <- WITHDRAWN"
      - "every LoanApplication for this buyer with application_status SUBMITTED moves SUBMITTED -> DENIED"

  # --- HomeSaleContract ---
  - method: POST
    path: "/housing/home-sites/{id}/contracts"
    description: "Write a purchase contract against an available inventory home"
    roles: [SalesCounselor]
    code: 201
    input: [buyer_id, purchase_price_cents, earnest_money_cents]
    output: HomeSaleContract
    side_effects:
      - "contract_status=PENDING, deposit_held_cents=0"
      - "recomputes incentive_budget_cents from the community policy"
      - "its HomeSite.home_site_status moves AVAILABLE -> UNDER_CONTRACT"

  - method: GET
    path: "/housing/contracts/{id}"
    description: "Get a sale contract including its derived incentive budget and allocation totals"
    roles: [PlatformAdmin, SalesCounselor, MortgageBanker, ClosingOfficer, ComplianceOfficer, Buyer]
    code: 200
    input: []
    output: HomeSaleContract
    side_effects: []

  - method: POST
    path: "/housing/contracts/{id}/lock"
    description: "Lock the contract off the back of a qualified application and an active rate lock"
    roles: [MortgageBanker]
    code: 200
    input: []
    output: HomeSaleContract
    side_effects:
      - "contract_status <- LOCKED"
      - "Buyer.buyer_status -> QUALIFIED"

  - method: POST
    path: "/housing/contracts/{id}/approve"
    description: "Approve the contract once its incentive allocations are all reserved and every rate-buydown-bearing contract has an acknowledged affiliated-business disclosure"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: HomeSaleContract
    side_effects:
      - "contract_status <- APPROVED"
      - "every IncentiveAllocation with allocation_status RESERVED moves RESERVED -> APPLIED"
      - "each applied RATE_BUYDOWN allocation recomputes its BuydownCostRecord.allowed_buydown_cost_cents via buydown_cost_recognition"
      - "recomputes Buyer.total_incentive_received_cents and community.incentive_spend_cents"

  - method: POST
    path: "/housing/contracts/{id}/close"
    description: "Close the sale, consuming the linked rate locks and drawing units from the forward commitment"
    roles: [ClosingOfficer]
    code: 200
    input: []
    output: HomeSaleContract
    side_effects:
      - "contract_status <- CLOSED"
      - "HomeSite.home_site_status UNDER_CONTRACT -> SOLD"
      - "every RateLock for the contract's LoanApplications moves lock_status ACTIVE -> CONSUMED"
      - "each consumed RateLock increments its ForwardCommitment.units_drawn by 1, and an EXHAUSTED commitment may reopen or a full one may become EXHAUSTED"
      - "recomputes community.funded_units, community.affiliated_units and community.capture_rate_bps via capture_rate_realization"

  - method: POST
    path: "/housing/contracts/{id}/cancel"
    description: "Cancel a pending or locked contract, reverse its incentives and propose a deposit settlement"
    roles: [SalesCounselor]
    code: 200
    input: [cancellation_reason]
    output: HomeSaleContract
    side_effects:
      - "contract_status <- CANCELLED, cancellation_reason set from the request"
      - "HomeSite.home_site_status UNDER_CONTRACT -> AVAILABLE"
      - "every RateLock for the contract's LoanApplications moves lock_status ACTIVE -> VOIDED"
      - "each voided RateLock increments its ForwardCommitment.units_released by 1"
      - "every IncentiveAllocation for this contract moves RESERVED or APPLIED -> REVERSED"
      - "each reversed allocation recomputes its BuydownCostRecord.allowed_buydown_cost_cents via buydown_cost_recognition"
      - "creates a DepositForfeiture row in PROPOSED status with statute_class selected by SELECTOR-03"
      - "recomputes Buyer.total_incentive_received_cents and community.forward_units_committed"

  - method: POST
    path: "/housing/contracts/{id}/reinstate"
    description: "Reinstate a cancelled contract whose forfeiture has not yet been finalised"
    roles: [SalesCounselor]
    code: 200
    input: []
    output: HomeSaleContract
    side_effects:
      - "contract_status <- PENDING"
      - "every DepositForfeiture row for this contract moves PROPOSED -> VOIDED"
      - "HomeSite.home_site_status AVAILABLE -> UNDER_CONTRACT"
      - "Buyer.buyer_status -> CONTRACTED"
      - "every REVERSED IncentiveAllocation for this contract moves REVERSED -> PENDING"
      - "recomputes Buyer.total_incentive_received_cents"

  - method: GET
    path: "/housing/contracts/{id}/loan-applications"
    description: "List the loan applications filed against a sale contract"
    roles: [PlatformAdmin, SalesCounselor, MortgageBanker, ClosingOfficer, ComplianceOfficer, Buyer]
    code: 200
    input: []
    output: LoanApplication[]
    side_effects: []

  - method: GET
    path: "/housing/contracts/{id}/incentive-allocations"
    description: "List the incentive allocations against a sale contract"
    roles: [PlatformAdmin, SalesCounselor, MortgageBanker, ClosingOfficer, ComplianceOfficer, Buyer]
    code: 200
    input: []
    output: IncentiveAllocation[]
    side_effects: []

  - method: GET
    path: "/housing/contracts/{id}/buydown-records"
    description: "List the buydown cost records against a sale contract"
    roles: [PlatformAdmin, SalesCounselor, ClosingOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: BuydownCostRecord[]
    side_effects: []

  - method: GET
    path: "/housing/contracts/{id}/disclosures"
    description: "List the affiliated-business disclosures delivered for a sale contract, including the earliest open cure deadline"
    roles: [PlatformAdmin, SalesCounselor, MortgageBanker, ClosingOfficer, ComplianceOfficer, Buyer]
    code: 200
    input: []
    output: ABADisclosure[]
    side_effects: []

  - method: GET
    path: "/housing/contracts/{id}/deposit-forfeitures"
    description: "List the deposit settlements proposed for a sale contract"
    roles: [PlatformAdmin, ClosingOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: DepositForfeiture[]
    side_effects: []

  # --- LoanApplication ---
  - method: POST
    path: "/housing/contracts/{id}/loan-applications"
    description: "File a mortgage application against a sale contract, choosing the lender entity"
    roles: [MortgageBanker, SalesCounselor]
    code: 201
    input: [lender_entity_code, application_number, qualifying_income_cents, monthly_debt_cents]
    output: LoanApplication
    side_effects:
      - "application_status=SUBMITTED, lock_waiver_status=NOT_REQUESTED, uw_precedence=\"SUBMITTED_NOT_REQUESTED\""
      - "computes qualification_score and provisional dti_bps via mortgage_qualification_score"
      - "computes lock_required_days from the home site's estimated_completion_iso"
      - "when lender_entity_code=AFFILIATED_LENDER: Buyer.affiliated_lender_selected <- true"

  - method: GET
    path: "/housing/loan-applications/{id}"
    description: "Get a loan application including both of its independent state dimensions"
    roles: [PlatformAdmin, MortgageBanker, ClosingOfficer, ComplianceOfficer, Buyer]
    code: 200
    input: []
    output: LoanApplication
    side_effects: []

  - method: POST
    path: "/housing/loan-applications/{id}/qualify"
    description: "Qualify an application, freezing its debt-to-income ratio at the qualifying instant"
    roles: [MortgageBanker]
    code: 200
    input: []
    output: LoanApplication
    side_effects:
      - "application_status <- QUALIFIED"
      - "dti_bps frozen at its current value (final variant)"
      - "Buyer.buyer_status -> CONTRACTED"

  - method: POST
    path: "/housing/loan-applications/{id}/deny"
    description: "Deny an application that is still under submission"
    roles: [MortgageBanker]
    code: 200
    input: []
    output: LoanApplication
    side_effects:
      - "application_status <- DENIED"
      - "Buyer.buyer_status -> QUALIFIED"

  - method: POST
    path: "/housing/loan-applications/{id}/relock"
    description: "Revive an expired application for a fresh lock, refused once drift is detected"
    roles: [MortgageBanker]
    code: 200
    input: []
    output: LoanApplication
    side_effects:
      - "application_status <- QUALIFIED"
      - "recomputes drift_flag from the three-consecutive-EXPIRED scan"

  - method: POST
    path: "/housing/loan-applications/{id}/lock-waiver"
    description: "Advance the independent rate-lock waiver track without touching the underwriting status"
    roles: [SalesCounselor, MortgageBanker]
    code: 200
    input: [target_waiver_status]
    output: LoanApplication
    side_effects:
      - "lock_waiver_status <- target_waiver_status"
      - "application_status is not modified by this call"

  - method: GET
    path: "/housing/loan-applications/{id}/rate-locks"
    description: "List the rate locks created against a loan application"
    roles: [PlatformAdmin, MortgageBanker, ClosingOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: RateLock[]
    side_effects: []

  # --- RateLock ---
  - method: POST
    path: "/housing/loan-applications/{id}/rate-locks"
    description: "Create a rate lock funded by a selected forward commitment; guarded by application-version OCC"
    roles: [MortgageBanker]
    code: 201
    input: [commitment_id, lock_rate_bps, lock_days, expected_application_version]
    output: RateLock
    side_effects:
      - "lock_status=ACTIVE, relock_count=0, relock_fee_cents=0"
      - "lock_start_iso <- current logical clock; lock_expires_iso <- lock_start_iso + lock_days"
      - "computes lock_cost_cents via lock_extension_cost (extension variant)"
      - "increments LoanApplication.version by 1"

  - method: GET
    path: "/housing/rate-locks/{id}"
    description: "Get a rate lock including its derived cost and expiry"
    roles: [PlatformAdmin, MortgageBanker, ClosingOfficer, ComplianceOfficer, Buyer]
    code: 200
    input: []
    output: RateLock
    side_effects: []

  - method: POST
    path: "/housing/rate-locks/{id}/void"
    description: "Void an active lock, returning its unit to the commitment and reverting the contract to PENDING"
    roles: [MortgageBanker]
    code: 200
    input: []
    output: RateLock
    side_effects:
      - "lock_status <- VOIDED"
      - "commitment.units_released += 1 and units_available recomputed"
      - "an EXHAUSTED commitment reopens to OPEN"
      - "if the owning contract was LOCKED it moves LOCKED -> PENDING and its acknowledged disclosures revert to ISSUED"
      - "recomputes community.forward_units_committed"

  - method: POST
    path: "/housing/rate-locks/{id}/extend"
    description: "Push an active lock's expiry later, billing the marginal extension tiers"
    roles: [MortgageBanker]
    code: 200
    input: [new_lock_days]
    output: RateLock
    side_effects:
      - "lock_days <- new_lock_days and lock_expires_iso recomputed"
      - "lock_cost_cents <- lock_extension_cost (extension variant)"

  - method: POST
    path: "/housing/rate-locks/{id}/relock"
    description: "Revive an expired lock, charging the escalating flat relock fee"
    roles: [MortgageBanker]
    code: 200
    input: []
    output: RateLock
    side_effects:
      - "lock_status <- ACTIVE and relock_count += 1"
      - "lock_expires_iso recomputed from the current logical clock"
      - "relock_fee_cents and lock_cost_cents <- lock_extension_cost (relock variant)"
      - "the owning HomeSaleContract moves PENDING -> LOCKED"

  # --- IncentiveAllocation ---
  - method: POST
    path: "/housing/contracts/{contractId}/incentive-allocations"
    description: "Allocate incentive budget to a bucket, spilling overflow down the fixed priority order; guarded by contract-version OCC"
    roles: [SalesCounselor]
    code: 201
    input: [bucket, requested_cents, expected_contract_version]
    output: IncentiveAllocation
    side_effects:
      - "allocation_status=RESERVED"
      - "allocation_total_cents and spill_to_bucket computed by incentive_allocation_waterfall"
      - "recomputes HomeSaleContract.incentive_allocated_cents and incentive_allocated_cents"
      - "increments HomeSaleContract.version by 1"

  - method: GET
    path: "/housing/incentive-allocations/{id}"
    description: "Get an incentive allocation including its granted total and spill target"
    roles: [PlatformAdmin, SalesCounselor, MortgageBanker, ClosingOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: IncentiveAllocation
    side_effects: []

  - method: GET
    path: "/housing/incentive-allocations/{id}/buydown-records"
    description: "List the buydown cost records drawing on an incentive allocation"
    roles: [PlatformAdmin, SalesCounselor, ClosingOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: BuydownCostRecord[]
    side_effects: []

  # --- BuydownCostRecord ---
  - method: POST
    path: "/housing/contracts/{id}/buydown-records"
    description: "Account a permanent rate buydown as a sales incentive against home price; guarded by contract-version OCC"
    roles: [ClosingOfficer, SalesCounselor]
    code: 201
    input: [allocation_id, gross_buydown_cents, expected_contract_version]
    output: BuydownCostRecord
    side_effects:
      - "record_status=DRAFT"
      - "computes allowed_buydown_cost_cents and recapture_credit_cents via buydown_cost_recognition"
      - "aba_cure_deadline_iso computed by aba_disclosure_cure_deadline_offset"
      - "increments HomeSaleContract.version by 1"

  - method: GET
    path: "/housing/buydown-records/{id}"
    description: "Get a buydown cost record including its recognition and recapture split"
    roles: [PlatformAdmin, ClosingOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: BuydownCostRecord
    side_effects: []

  # --- ABADisclosure ---
  - method: POST
    path: "/housing/contracts/{id}/disclosures"
    description: "Deliver a regulated affiliated-business, steering or buydown-terms disclosure"
    roles: [ComplianceOfficer, SalesCounselor]
    code: 201
    input: [disclosure_type]
    output: ABADisclosure
    side_effects:
      - "disclosure_status=ISSUED"
      - "delivery_iso <- current logical clock; cure_deadline_iso <- delivery day + 3 days"

  - method: GET
    path: "/housing/disclosures/{id}"
    description: "Get a disclosure including its cure deadline"
    roles: [PlatformAdmin, SalesCounselor, MortgageBanker, ClosingOfficer, ComplianceOfficer, Buyer]
    code: 200
    input: []
    output: ABADisclosure
    side_effects: []

  - method: POST
    path: "/housing/disclosures/{id}/acknowledge"
    description: "Record buyer acknowledgement of a disclosure before its cure deadline"
    roles: [Buyer]
    code: 200
    input: []
    output: ABADisclosure
    side_effects:
      - "disclosure_status <- ACKNOWLEDGED"
      - "recomputes Buyer.steering_protection_flag"

  - method: POST
    path: "/housing/disclosures/{id}/waive"
    description: "Officer-waive a disclosure that has lapsed into CURING while its community is suspended"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ABADisclosure
    side_effects:
      - "disclosure_status <- WAIVED"
      - "recomputes Buyer.steering_protection_flag"

  # --- DepositForfeiture ---
  - method: POST
    path: "/housing/contracts/{id}/deposit-forfeitures"
    description: "Propose a deposit settlement for a cancelled contract under the selected statute class; guarded by contract-version OCC"
    roles: [ClosingOfficer]
    code: 201
    input: [statute_class, expected_contract_version]
    output: DepositForfeiture
    side_effects:
      - "forfeiture_status=PROPOSED"
      - "forfeited_cents, refunded_cents and retained_incentive_cents computed by deposit_forfeiture_split"
      - "increments HomeSaleContract.version by 1"

  - method: GET
    path: "/housing/deposit-forfeitures/{id}"
    description: "Get a deposit settlement including its forfeiture/refund split"
    roles: [PlatformAdmin, ClosingOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: DepositForfeiture
    side_effects: []

  - method: POST
    path: "/housing/deposit-forfeitures/{id}/finalize"
    description: "Finalise a proposed settlement, retaining the forfeited portion and withdrawing the buyer"
    roles: [ClosingOfficer]
    code: 200
    input: []
    output: DepositForfeiture
    side_effects:
      - "forfeiture_status <- FINALIZED"
      - "contract.deposit_held_cents <- forfeited_cents"
      - "Buyer.buyer_status -> WITHDRAWN"
      - "recomputes Buyer.total_incentive_received_cents"

  # --- logical clock (test-driving endpoint) ---
  - method: POST
    path: "/housing/_clock/set_current_utc"
    description: "Advance or rewind the server's logical clock. Before any call the logical clock reads exactly the fixed startup default 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time; the default sits at or before every fixture date so an unset clock is a well-defined earliest instant. Setting the clock past a RateLock.lock_expires_iso expires the lock; past a ForwardCommitment.commitment_end_iso expires the commitment and pair-off fees it; past an ABADisclosure.cure_deadline_iso moves the disclosure to CURING and suspends its community; past an application's qualification horizon expires the application."
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "logical clock <- to_iso8601"
      - "applies every clock-driven transition: RateLock ACTIVE -> EXPIRED, ForwardCommitment OPEN -> EXPIRED, ABADisclosure ISSUED -> CURING, LoanApplication QUALIFIED -> EXPIRED"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent, or X-User-Role names no role in the RBAC matrix"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "the authenticated role is not listed in the endpoint's roles set"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "a path id or a body foreign key resolves to no row; validated left-to-right along the path"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target row's current state has no declared transition for the requested trigger"
  - id: ERR_HOME_SITE_NOT_AVAILABLE
    http: 409
    condition: "HomeSaleContract creation against a HomeSite whose home_site_status is not AVAILABLE, or LoanApplication creation against a contract whose contract_status is neither PENDING nor LOCKED"
  - id: ERR_ABA_DISCLOSURE_MISSING
    http: 403
    condition: "approving a contract or allocating to RATE_BUYDOWN when the contract has no ACKNOWLEDGED AFFILIATED_BUSINESS_ARRANGEMENT disclosure"
  - id: ERR_ABA_DISCLOSURE_CURE_EXPIRED
    http: 409
    condition: "acknowledging a disclosure after its cure_deadline_iso has passed, i.e. while it sits in CURING status"
  - id: ERR_STEERING_PROHIBITED
    http: 403
    condition: "filing an affiliated-lender application on a contract that carries a RATE_BUYDOWN allocation without an ACKNOWLEDGED STEERING_PROHIBITION disclosure"
  - id: ERR_QUALIFICATION_SCORE_BELOW_FLOOR
    http: 422
    condition: "qualification_score < QUALIFY_SCORE_FLOOR (620) at qualify or relock time"
  - id: ERR_DTI_CEILING_EXCEEDED
    http: 422
    condition: "dti_bps > DTI_QUALIFY_CEILING_BPS (4500) at qualify time"
  - id: ERR_COMMUNITY_SUSPENDED
    http: 403
    condition: "an incentive or contract-creating write against a community whose program_status is SUSPENDED"
  - id: ERR_APPLICATION_DRIFT_EXCLUDED
    http: 409
    condition: "relocking an application whose drift_flag is true because three consecutive EXPIRED rows exist for the same contract and lender entity"
  - id: ERR_COMMITMENT_WINDOW_CLOSED
    http: 409
    condition: "the logical clock falls outside [commitment_start_iso, commitment_end_iso] of the selected ForwardCommitment"
  - id: ERR_ADVERTISED_RATE_EXPIRED
    http: 409
    condition: "locking at the home site's advertised below-market rate after advertised_rate_expires_iso"
  - id: ERR_RATE_LOCK_EXPIRED
    http: 409
    condition: "extending or voiding a lock whose lock_status is not ACTIVE, or whose lock_expires_iso has passed"
  - id: ERR_RELOCK_LIMIT_REACHED
    http: 409
    condition: "relocking when relock_count >= MAX_RELOCKS (2)"
  - id: ERR_COMMITMENT_WINDOW_OVERLAP
    http: 409
    condition: "a new ForwardCommitment's closed-open window overlaps an existing OPEN or EXHAUSTED commitment window on the same community"
  - id: ERR_LOCK_WINDOW_OVERLAP
    http: 409
    condition: "a new RateLock's closed validity interval overlaps more ACTIVE lock intervals on the same commitment than that commitment has units_available"
  - id: ERR_FORWARD_COMMITMENT_EXHAUSTED
    http: 409
    condition: "no FORWARD_COMMITMENT_ELIGIBLE commitment with units_available >= 1 exists for the contract's community (SELECTOR-02 empty pool, or a named commitment that is not OPEN)"
  - id: ERR_NO_QUALIFIED_APPLICATION
    http: 409
    condition: "no LoanApplication in {QUALIFIED, EXPIRED} exists for the contract (SELECTOR-01 empty pool)"
  - id: ERR_INCENTIVE_BUDGET_EXHAUSTED
    http: 422
    condition: "requested_cents exceeds the sum of the three remaining bucket caps of the contract's community policy"
  - id: ERR_BUYDOWN_EXCEEDS_ALLOCATION
    http: 422
    condition: "gross_buydown_cents > allocation_total_cents of the linked RATE_BUYDOWN allocation"
  - id: ERR_DEPOSIT_SUM_MISMATCH
    http: 422
    condition: "forfeited_cents + refunded_cents != the contract's earnest_money_cents at finalisation"
  - id: ERR_FORFEITURE_STATUTE_UNDETERMINED
    http: 409
    condition: "SELECTOR-03 cannot pick a statute_class because cancellation_reason is BUYER_DEFAULT while the buyer's state_code lies outside the mapped set {FL, TX, CA, NY, IL}"
  - id: ERR_FORFEITURE_NOT_PROPOSED
    http: 409
    condition: "finalising a DepositForfeiture whose forfeiture_status is not PROPOSED, whose owning contract is not CANCELLED, or whose blocking OPEN-rate-buydown cure window is still unexpired so the settlement may not yet be sealed"
  - id: ERR_DUPLICATE_ACTIVE_LOCK
    http: 409
    condition: "the application already holds a RateLock in lock_status ACTIVE"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version differs from the HomeSaleContract's current version"
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "expected_application_version differs from the LoanApplication's current version"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing or null, or a field has the wrong JSON type"
  - id: ERR_INVALID_ENUM_VALUE
    http: 400
    condition: "an enum field carries a value outside its declared constraint set, or a numeric field lies outside its declared bounds"

roles:
  - name: Buyer
    description: "Persisted homebuyer; may read their own contract, allocations, disclosures and locks, and is the only role that may acknowledge a disclosure"
    identity: "entity_backed:Buyer"
    exclusive_operations:
      - "POST /housing/disclosures/{id}/acknowledge"
    shared_operations:
      - "GET /housing/contracts/{id}"
      - "GET /housing/contracts/{id}/incentive-allocations"
      - "GET /housing/contracts/{id}/loan-applications"
      - "GET /housing/contracts/{id}/disclosures"
      - "GET /housing/buyers/{id}"
      - "GET /housing/buyers/{id}/contracts"
      - "GET /housing/loan-applications/{id}"
      - "GET /housing/rate-locks/{id}"
      - "GET /housing/disclosures/{id}"

  - name: SalesCounselor
    description: "Opaque sales-office operator who writes contracts, reserves home sites, allocates incentives and cancels or reinstates deals"
    identity: "opaque"
    exclusive_operations:
      - "POST /housing/home-sites/{id}/contracts"
      - "POST /housing/communities/{communityId}/home-sites/{id}/reserve"
      - "POST /housing/contracts/{contractId}/incentive-allocations"
      - "POST /housing/contracts/{id}/cancel"
      - "POST /housing/contracts/{id}/reinstate"
      - "POST /housing/buyers/{id}/withdraw"
    shared_operations:
      - "POST /housing/buyers"
      - "POST /housing/communities/{communityId}/home-sites"
      - "POST /housing/contracts/{id}/loan-applications"
      - "POST /housing/contracts/{id}/disclosures"
      - "POST /housing/contracts/{id}/buydown-records"
      - "POST /housing/loan-applications/{id}/lock-waiver"

  - name: MortgageBanker
    description: "Opaque affiliated-lender loan officer who creates rate locks, qualifies or denies applications and drives the lock waiver track"
    identity: "opaque"
    exclusive_operations:
      - "POST /housing/communities/{communityId}/forward-commitments"
      - "POST /housing/loan-applications/{id}/qualify"
      - "POST /housing/loan-applications/{id}/deny"
      - "POST /housing/loan-applications/{id}/relock"
      - "POST /housing/loan-applications/{id}/rate-locks"
      - "POST /housing/rate-locks/{id}/void"
      - "POST /housing/rate-locks/{id}/extend"
      - "POST /housing/rate-locks/{id}/relock"
      - "POST /housing/contracts/{id}/lock"
      - "POST /housing/buyers/{id}/qualify"
    shared_operations:
      - "POST /housing/contracts/{id}/loan-applications"
      - "POST /housing/loan-applications/{id}/lock-waiver"

  - name: ClosingOfficer
    description: "Opaque escrow officer who closes sales and finalises deposit settlements"
    identity: "opaque"
    exclusive_operations:
      - "POST /housing/contracts/{id}/close"
      - "POST /housing/contracts/{id}/deposit-forfeitures"
      - "POST /housing/deposit-forfeitures/{id}/finalize"
    shared_operations:
      - "POST /housing/contracts/{id}/buydown-records"

  - name: ComplianceOfficer
    description: "Opaque regulatory gatekeeper who controls community posture, approves contracts, issues and waives disclosures and seals commitments"
    identity: "opaque"
    exclusive_operations:
      - "POST /housing/communities/{id}/posture"
      - "POST /housing/contracts/{id}/approve"
      - "POST /housing/disclosures/{id}/waive"
      - "POST /housing/forward-commitments/{id}/close"
    shared_operations:
      - "POST /housing/communities"
      - "POST /housing/communities/{communityId}/forward-commitments"
      - "POST /housing/contracts/{id}/disclosures"

  - name: PlatformAdmin
    description: "Opaque platform operator who provisions communities, home sites and buyers and can drive the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /housing/_clock/set_current_utc"
    shared_operations:
      - "POST /housing/communities"
      - "POST /housing/communities/{communityId}/home-sites"
      - "POST /housing/communities/{communityId}/forward-commitments"
      - "POST /housing/buyers"

  - name: Anonymous
    description: "Unauthenticated caller; may read the public community catalogue only"
    identity: "opaque"
    exclusive_operations:
      - "GET /housing/communities"
    shared_operations:
      - "GET /housing/communities/{id}"