  # ---------- writes: District ------------------------------------------
  - method: POST
    path: "/districts"
    description: "Propose a tourism improvement district. The district is created in PROPOSED with no petition yet circulating; the threshold percentages supplied here are the values later snapshotted onto each petition drive."
    roles: [DistrictAdministrator]
    code: 201
    input: [name, "assessment_method?", "included_zones?", "formation_threshold_pct?", "renewal_threshold_pct?", "renewal_headcount_threshold_pct?", "term_years?", "current_fiscal_year?"]
    output: District
    side_effects: ["District created in status PROPOSED", "assessable_basis_cents and assessable_business_count initialised to 0", "increments District.version to 1"]

  - method: POST
    path: "/districts/{id}/boundary-revisions"
    description: "Redefine which zones lie inside the district boundary. Every lodging business on the roll is re-evaluated against the new included_zones."
    roles: [DistrictAdministrator]
    code: 200
    input: [included_zones, effective_on]
    output: District
    side_effects: ["businesses whose boundary_zone left included_zones move ASSESSABLE -> OUTSIDE_BOUNDARY", "businesses whose zone re-entered move OUTSIDE_BOUNDARY -> ASSESSABLE", "petition_support recomputed for every OPEN PetitionDrive of the district", "signatures of newly out-of-boundary businesses move VALID -> DISQUALIFIED with disqualification_reason OUTSIDE_BOUNDARY", "District.assessable_basis_cents and assessable_business_count recomputed", "increments District.version by 1"]

  - method: POST
    path: "/districts/{id}/dmo-coordination"
    description: "Record the destination marketing organization agreement and the public lodging tax match pool the city has committed. Executing the agreement is the cross-entity gate that lets marketing programs launch."
    roles: [DistrictAdministrator]
    code: 200
    input: [dmo_name, dmo_agreement_status, dmo_contract_cents, "lodging_tax_match_pool_cents?", "public_lodging_tax_offset_cents?"]
    output: District
    side_effects: ["District.dmo_name, dmo_agreement_status and dmo_contract_cents updated", "lodging_tax_match_pool_cents updated", "ERR_LODGING_TAX_MATCH_EXHAUSTED when the new pool is below lodging_tax_match_committed_cents", "increments District.version by 1"]

  - method: POST
    path: "/districts/{id}/lifecycle-advances"
    description: "Drive the district lifecycle: to_status ACTIVE activates a FORMED district, RENEWAL_PENDING opens the renewal window, EXPIRED lets the term lapse, DISESTABLISHED dissolves the district early."
    roles: [DistrictAdministrator]
    code: 200
    input: [to_status, "effective_on?", "reason?"]
    output: District
    side_effects: ["District.status advanced per §1.2", "on ACTIVE requires the FORMATION drive to be CERTIFIED and the assessable roll to still hold at least MIN_PETITION_POOL businesses; formed_on and expiration_date are left exactly as the certification stamped them", "on RENEWAL_PENDING enforces the 180-day renewal window and the transparency gate", "on EXPIRED or DISESTABLISHED moves OPEN petition drives to WITHDRAWN, PLANNED marketing programs to CANCELLED and OPEN assessment periods stay readable but reject further writes", "increments District.version by 1"]

  # ---------- writes: LodgingBusiness -----------------------------------
  - method: POST
    path: "/lodging-businesses"
    description: "Add a lodging business to the district roll. A property whose exempt_status is not NONE, whose room_count is below MIN_ASSESSABLE_ROOMS, or whose boundary_zone lies outside the district is created directly in EXEMPT or OUTSIDE_BOUNDARY rather than ASSESSABLE."
    roles: [DistrictAdministrator]
    code: 201
    input: [district_id, legal_name, boundary_zone, classification, room_count, prior_year_gross_room_revenue_cents, operator_contact_email, "exempt_status?", "remittance_frequency?"]
    output: LodgingBusiness
    side_effects: ["status resolved to ASSESSABLE, EXEMPT or OUTSIDE_BOUNDARY at creation", "District.assessable_basis_cents and assessable_business_count recomputed", "petition_support recomputed for every OPEN PetitionDrive of the district", "increments LodgingBusiness.version to 1"]

  - method: POST
    path: "/lodging-businesses/{id}/revisions"
    description: "Revise a property record. Changing zone, classification, room count, prior-year revenue or exempt status re-evaluates assessability and re-scores every open petition. Passing close_out true retires the property permanently."
    roles: [DistrictAdministrator]
    code: 200
    input: ["boundary_zone?", "classification?", "room_count?", "prior_year_gross_room_revenue_cents?", "exempt_status?", "remittance_frequency?", "operator_contact_email?", "close_out?"]
    output: LodgingBusiness
    side_effects: ["status re-resolved across ASSESSABLE, EXEMPT, OUTSIDE_BOUNDARY", "close_out true moves the property to terminal CLOSED_OUT", "VALID signatures of a property that leaves the assessable set move to DISQUALIFIED", "petition_support recomputed for every OPEN PetitionDrive of the district", "District.assessable_basis_cents and assessable_business_count recomputed", "later FINAL assessments still use the statement's period-start snapshot, so a revision never rewrites a past period's audited amount", "increments LodgingBusiness.version by 1"]

  # ---------- writes: petitions -----------------------------------------
  - method: POST
    path: "/petition-drives"
    description: "Open a formation or renewal petition drive. required_weighted_pct and required_headcount_pct are snapshotted from the district at open time: a FORMATION drive takes required_weighted_pct from District.formation_threshold_pct and snapshots required_headcount_pct as 0.0000 so only the revenue-weighted test binds, while a RENEWAL drive takes required_weighted_pct from District.renewal_threshold_pct and required_headcount_pct from District.renewal_headcount_threshold_pct."
    roles: [DistrictAdministrator]
    code: 201
    input: [district_id, drive_type, closes_at]
    output: PetitionDrive
    side_effects: ["opened_on set from the logical clock", "thresholds snapshotted from District.formation_threshold_pct or renewal_threshold_pct and renewal_headcount_threshold_pct", "assessable_basis_snapshot_cents and assessable_count_snapshot computed from the current assessable set", "a FORMATION drive moves the district PROPOSED -> PETITION_CIRCULATING", "a RENEWAL drive requires the district within 180 days of expiration_date", "increments PetitionDrive.version to 1"]

  - method: POST
    path: "/petition-drives/{id}/signatures"
    description: "Record a lodging business's petition signature. The signature carries the signer's prior-year room revenue as its weight basis, captured at signing time."
    roles: [DistrictAdministrator, LodgingOperator]
    code: 201
    input: [lodging_business_id]
    output: PetitionSignature
    side_effects: ["weight_basis_revenue_cents captured from LodgingBusiness.prior_year_gross_room_revenue_cents", "PetitionDrive.signed_basis_cents and valid_signature_count incremented", "petition_support recomputed, updating weighted_support_pct and headcount_support_pct", "increments PetitionSignature.version to 1 and PetitionDrive.version by 1"]

  - method: POST
    path: "/petition-signatures/{id}/withdrawal"
    description: "Withdraw a signature during the signature window. The drive's weighted and headcount support are restored to exactly the values they held before the signature was recorded."
    roles: [DistrictAdministrator, LodgingOperator]
    code: 200
    input: ["reason?"]
    output: PetitionSignature
    side_effects: ["signature moves VALID -> WITHDRAWN", "PetitionDrive.signed_basis_cents reduced by exactly weight_basis_revenue_cents and valid_signature_count decremented", "petition_support recomputed", "increments PetitionSignature.version by 1 and PetitionDrive.version by 1"]

  - method: POST
    path: "/petition-drives/{id}/tally"
    description: "Recompute support and compare it against the snapshotted thresholds. Both comparisons use >=, so support landing exactly on a threshold qualifies. The drive forks to QUALIFIED or SHORT_OF_THRESHOLD."
    roles: [DistrictAdministrator]
    code: 200
    input: []
    output: PetitionDrive
    side_effects: ["petition_support recomputed immediately before the comparison", "tallied_at set from the logical clock", "on qualification the drive moves OPEN -> QUALIFIED", "on failure the drive moves OPEN -> SHORT_OF_THRESHOLD, short_reason is set to WEIGHTED_BELOW_THRESHOLD when the revenue-weighted test failed and HEADCOUNT_BELOW_MINIMUM when only the headcount test failed, and a FORMATION drive additionally drives the district PETITION_CIRCULATING -> FORMATION_FAILED", "increments PetitionDrive.version by 1"]

  - method: POST
    path: "/petition-drives/{id}/certification"
    description: "Certify a QUALIFIED drive. Certifying a FORMATION drive forms the district; certifying a RENEWAL drive returns a RENEWAL_PENDING district to ACTIVE with a fresh term, and requires the published annual report and financial audit to be on file."
    roles: [DistrictAdministrator]
    code: 200
    input: ["certified_on?"]
    output: PetitionDrive
    side_effects: ["drive moves QUALIFIED -> CERTIFIED", "FORMATION drive drives the district PETITION_CIRCULATING -> FORMED", "RENEWAL drive drives the district RENEWAL_PENDING -> ACTIVE, extends expiration_date by term_years and advances current_fiscal_year", "increments PetitionDrive.version by 1 and District.version by 1"]

  # ---------- writes: assessment periods and statements ------------------
  - method: POST
    path: "/assessment-periods"
    description: "Open an assessment period for the district. Periods are half-open [period_start, period_end); a new period may start exactly where an existing one ends but may not overlap it."
    roles: [DistrictAdministrator]
    code: 201
    input: [district_id, period_label, period_start, period_end, due_date, "grace_days?"]
    output: AssessmentPeriod
    side_effects: ["AssessmentPeriod created in OPEN with statement_count 0", "half-open overlap check against the district's existing periods", "increments AssessmentPeriod.version to 1"]

  - method: POST
    path: "/assessment-periods/{id}/statement-generation"
    description: "Issue one assessment statement per assessable lodging business on the roll, in created_at ascending order of the businesses. Each statement snapshots the property's zone, classification and the district's assessment method as of period start, which is what later makes the PROVISIONAL and FINAL variants diverge."
    roles: [DistrictAdministrator]
    code: 201
    input: []
    output: "{ assessment_period_id: string, generated_count: integer, skipped_count: integer, statement_ids: string[] }"
    side_effects: ["one AssessmentStatement per LodgingBusiness with status ASSESSABLE and exempt_status NONE and boundary_zone in District.included_zones", "zone_at_period_start, classification_at_period_start and assessment_method_at_period_start snapshotted", "skipped_count counts every roll member of the district that received no new statement on this run: those that already hold one for the period and those excluded by the eligibility filter above", "a re-run on which no eligible business is missing a statement, so generated_count would be 0, is refused with ERR_STATEMENT_ALREADY_EXISTS_FOR_PERIOD", "AssessmentPeriod.statement_count updated", "statements are only discoverable through GET /assessment-periods/{id}/statements or GET /lodging-businesses/{id}/assessment-statements"]

  - method: POST
    path: "/assessment-periods/{id}/closure"
    description: "Close the filing window for a period. Closure is the cross-entity gate that lets statements be audited."
    roles: [DistrictAdministrator]
    code: 200
    input: []
    output: AssessmentPeriod
    side_effects: ["period moves OPEN -> CLOSED", "billed_total_cents recomputed as the sum of effective_assessment_cents over the period's statements", "further filings and amendments are refused with ERR_FILING_WINDOW_CLOSED", "increments AssessmentPeriod.version by 1"]

  - method: POST
    path: "/assessment-periods/{id}/delinquency-sweep"
    description: "Assess penalties and interest on every unpaid statement of a CLOSED period whose grace deadline the logical clock has passed. This call is the head of the four-hop delinquency cascade."
    roles: [DistrictAdministrator]
    code: 200
    input: []
    output: AssessmentPeriod
    side_effects: ["period moves CLOSED -> DELINQUENCY_SWEPT", "delinquency_charges computed per statement in created_at ascending order, rounding each statement's penalty and interest before accumulation", "each swept statement moves to payment_status DELINQUENT with delinquency_stage NOTICE or LIEN_REFERRED", "District.delinquent_charges_cents increased by the per-statement rounded charges", "each swept business's delinquency_strike_count incremented and compliance_standing recomputed to WATCH at 1 strike and SUSPENDED at 2", "VALID signatures of a business that reaches SUSPENDED move to DISQUALIFIED with disqualification_reason COMPLIANCE_SUSPENDED and every OPEN drive is re-scored", "increments AssessmentPeriod.version by 1"]

  - method: POST
    path: "/assessment-statements/{id}/filings"
    description: "File reported room nights and gross room revenue for the period. Filing computes the PROVISIONAL assessment variant from the property's live zone and classification."
    roles: [LodgingOperator, DistrictAdministrator]
    code: 200
    input: [reported_room_nights, reported_gross_room_revenue_cents]
    output: AssessmentStatement
    side_effects: ["statement moves NOT_FILED -> FILED and filed_at is set from the logical clock", "assessment_amount PROVISIONAL variant computed into provisional_assessment_cents", "payment_status_derivation recomputed, refreshing effective_assessment_cents and total_due_cents", "work_plan_compliance re-evaluated for the fiscal year's AnnualWorkPlan, which may drive an APPROVED plan to AMENDMENT_PENDING", "increments AssessmentStatement.version by 1"]

  - method: POST
    path: "/assessment-statements/{id}/amendments"
    description: "Amend a filed statement's reported figures. The caller must carry the statement version it last observed, because an amendment legitimately supersedes the prior figures and a writer holding a stale view would silently overwrite an intervening amendment (§1.2.1 statement-amendment-stale-statement)."
    roles: [LodgingOperator, DistrictAdministrator]
    code: 200
    input: [expected_statement_version, reported_room_nights, reported_gross_room_revenue_cents, "amendment_reason?"]
    output: AssessmentStatement
    side_effects: ["ERR_STALE_STATEMENT_VERSION (412) when expected_statement_version does not equal the stored version", "statement moves FILED -> AMENDED or AMENDED -> AMENDED and amendment_count is incremented", "assessment_amount PROVISIONAL variant recomputed", "payment_status_derivation recomputed", "work_plan_compliance re-evaluated for the fiscal year's AnnualWorkPlan", "increments AssessmentStatement.version by 1"]

  - method: POST
    path: "/assessment-statements/{id}/remittances"
    description: "Apply an operator remittance to a statement. The payment is split across interest, penalty and principal in that fixed order, with any surplus banked as credit."
    roles: [LodgingOperator, DistrictAdministrator]
    code: 201
    input: [amount_cents, received_on, method]
    output: Remittance
    side_effects: ["remittance_waterfall allocates amount_cents across interest, penalty, principal then credit and records each split on the Remittance row", "AssessmentStatement bucket fields increased and payment_status_derivation recomputed", "District.collected_to_date_cents and AssessmentPeriod.collected_total_cents increased by amount_cents", "increments Remittance.version to 1 and AssessmentStatement.version by 1"]

  - method: POST
    path: "/assessment-statements/{id}/remittance-reversals"
    description: "Reverse a previously applied remittance, for example a returned bank transfer. The reversal subtracts exactly the four per-bucket amounts recorded on the Remittance row rather than re-running the waterfall, so every derived total returns to its pre-payment value with no drift."
    roles: [DistrictAdministrator]
    code: 200
    input: [remittance_id, reversal_reason]
    output: Remittance
    side_effects: ["remittance moves APPLIED -> REVERSED and reversed_on is set from the logical clock", "the four statement buckets reduced by exactly applied_to_interest_cents, applied_to_penalty_cents, applied_to_principal_cents and applied_to_credit_cents", "District.collected_to_date_cents and AssessmentPeriod.collected_total_cents reduced by amount_cents", "payment_status_derivation recomputed, which may return the statement from PAID_IN_FULL to UNPAID or PARTIALLY_PAID, or from REFUND_DUE to PAID_IN_FULL or PARTIALLY_PAID", "increments Remittance.version by 1 and AssessmentStatement.version by 1"]

  - method: POST
    path: "/assessment-statements/{id}/audit-certification"
    description: "Independent audit of a statement. action AUDIT records audited figures and computes the FINAL assessment variant from the period-start snapshots; action CERTIFY closes the statement permanently and may not be performed by the same operator who audited it."
    roles: [IndependentAuditor]
    code: 200
    input: [action, "audited_room_nights?", "audited_gross_room_revenue_cents?", "audit_note?"]
    output: AssessmentStatement
    side_effects: ["AUDIT requires the owning AssessmentPeriod to be CLOSED or DELINQUENCY_SWEPT and moves the statement FILED or AMENDED -> AUDITED", "AUDIT records audited_by_user_id from X-User-ID and computes assessment_amount FINAL variant into final_assessment_cents", "CERTIFY moves AUDITED -> CERTIFIED and is refused with ERR_SEGREGATION_OF_DUTIES when X-User-ID equals audited_by_user_id", "payment_status_derivation recomputed, including the overpayment reallocation into credit_balance_cents", "work_plan_compliance re-evaluated for the fiscal year's AnnualWorkPlan", "increments AssessmentStatement.version by 1"]

  # ---------- writes: disputes ------------------------------------------
  - method: POST
    path: "/assessment-disputes"
    description: "File a dispute over the assessment calculation (CALCULATION_ERROR), an exempt-property determination (EXEMPT_PROPERTY) or a boundary determination (BOUNDARY_MISCLASSIFICATION)."
    roles: [LodgingOperator, DistrictAdministrator]
    code: 201
    input: [assessment_statement_id, dispute_type, claimed_adjustment_cents, "dispute_note?"]
    output: AssessmentDispute
    side_effects: ["dispute created in SUBMITTED with filed_on from the logical clock and lodging_business_id copied from the statement", "at most one non-terminal dispute per (assessment_statement_id, dispute_type)", "increments AssessmentDispute.version to 1"]

  - method: POST
    path: "/assessment-disputes/{id}/proceedings"
    description: "Move a dispute through review. action OPEN_REVIEW starts the hearing, REQUEST_INFO and SUBMIT_RESPONSE form a repeatable information cycle, APPEAL reopens an upheld dispute once, WITHDRAW abandons a submitted dispute."
    roles: [HearingOfficer, LodgingOperator]
    code: 200
    input: [action, "note?"]
    output: AssessmentDispute
    side_effects: ["dispute status advanced per §1.2, including the INFO_REQUESTED cycle which may repeat without limit", "APPEAL increments appeal_count and is refused beyond MAX_APPEALS (1)", "APPEAL and SUBMIT_RESPONSE are reserved to the owning LodgingOperator; OPEN_REVIEW and REQUEST_INFO to the HearingOfficer", "increments AssessmentDispute.version by 1"]

  - method: POST
    path: "/assessment-disputes/{id}/resolution"
    description: "Resolve a dispute under review. outcome ADJUSTED grants an adjustment and is the head of the three-hop dispute cascade; outcome UPHELD leaves the assessment untouched but remains appealable once."
    roles: [HearingOfficer]
    code: 200
    input: [outcome, "granted_adjustment_cents?", "exempt_status_granted?", "resolution_note?"]
    output: AssessmentDispute
    side_effects: ["dispute moves UNDER_REVIEW -> RESOLVED_ADJUSTED or RESOLVED_UPHELD and records resolved_by_user_id", "ADJUSTED writes granted_adjustment_cents onto the statement and recomputes assessment_amount FINAL, refused with ERR_ADJUSTMENT_EXCEEDS_ASSESSMENT when it exceeds effective_assessment_cents", "payment_status_derivation recomputed, migrating any now-excess principal into credit_balance_cents and possibly setting payment_status REFUND_DUE", "an ADJUSTED dispute of dispute_type EXEMPT_PROPERTY additionally moves the property ASSESSABLE -> EXEMPT", "work_plan_compliance re-evaluated, which may drive an APPROVED AnnualWorkPlan to AMENDMENT_PENDING and suspend its PLANNED marketing programs", "increments AssessmentDispute.version by 1 and AssessmentStatement.version by 1"]

  # ---------- writes: work plan and marketing programs -------------------
  - method: POST
    path: "/annual-work-plans"
    description: "Draft the annual budget and work plan for a fiscal year. A DRAFT plan may hold any category mix at all; the permitted-expenditure caps are only enforced when the board acts on it."
    roles: [DistrictAdministrator]
    code: 201
    input: [district_id, fiscal_year, expenditure_lines]
    output: AnnualWorkPlan
    side_effects: ["plan created in DRAFT", "total_budget_cents and the five per-category rollups computed from expenditure_lines", "assessment_revenue_forecast_cents and funding_ratio computed from the fiscal year's statements", "no category cap is applied at DRAFT", "increments AnnualWorkPlan.version to 1"]

  - method: POST
    path: "/annual-work-plans/{id}/board-actions"
    description: "Board action on a work plan. action SPONSOR records the sponsoring board member and moves the plan into review, APPROVE adopts it, RETURN sends it back to draft, CLOSE retires an approved plan at fiscal year end. Approval enforces the permitted-expenditure caps, the funding ratio floor and the separation between sponsor and approver."
    roles: [BoardMember]
    code: 200
    input: [action, "note?"]
    output: AnnualWorkPlan
    side_effects: ["SPONSOR moves DRAFT -> BOARD_REVIEW and records sponsor_user_id from X-User-ID", "APPROVE is refused with ERR_SEGREGATION_OF_DUTIES when X-User-ID equals sponsor_user_id, checked before any category cap", "APPROVE enforces work_plan_compliance: permitted categories, the 15 percent administration cap, the 10 percent contingency cap, the 60 percent marketing floor, the lodging tax match ceiling and the 0.9000 funding ratio floor", "APPROVE moves BOARD_REVIEW -> APPROVED, records approver_user_id and approved_at", "RETURN moves BOARD_REVIEW -> DRAFT and increments revision_count", "CLOSE moves APPROVED -> CLOSED and closes its RUNNING marketing programs", "increments AnnualWorkPlan.version by 1"]

  - method: POST
    path: "/annual-work-plans/{id}/amendments"
    description: "Amend an approved or amendment-pending work plan. The caller must carry the plan version it last observed, because an amendment legitimately supersedes the prior line items and a writer holding a stale view would silently discard an intervening amendment (§1.2.1 work-plan-amendment-stale-plan)."
    roles: [DistrictAdministrator, BoardMember]
    code: 200
    input: [expected_work_plan_version, expenditure_lines, "amendment_reason?"]
    output: AnnualWorkPlan
    side_effects: ["ERR_STALE_WORK_PLAN_VERSION (412) when expected_work_plan_version does not equal the stored version", "total_budget_cents and the per-category rollups recomputed, then every work_plan_compliance cap re-enforced", "the amended total must stay within 25 percent of the plan's stored total_budget_cents and revision_count must remain below MAX_AMENDMENTS (3)", "an AMENDMENT_PENDING plan returns to APPROVED once funding_ratio again reaches 0.9000, and its SUSPENDED_PENDING_AMENDMENT programs return to PLANNED with spend_frozen false", "increments AnnualWorkPlan.version by 1"]

  - method: POST
    path: "/marketing-programs"
    description: "Create a sales and marketing program funded by an approved work plan. The committed spend of all live programs may not exceed the plan's sales and marketing line, and any lodging tax match drawn here is charged against the district's match pool."
    roles: [DistrictAdministrator, DmoLiaison]
    code: 201
    input: [annual_work_plan_id, name, channel, committed_cents, booking_window_start, booking_window_end, "lodging_tax_matched_cents?"]
    output: MarketingProgram
    side_effects: ["program created in PLANNED with spend_frozen false and performance_flag NOT_MEASURED", "requires the owning AnnualWorkPlan to be APPROVED", "AnnualWorkPlan.committed_program_cents increased and checked against sales_and_marketing_cents", "District.lodging_tax_match_committed_cents increased and checked against both the pool and the 50 percent ceiling", "increments MarketingProgram.version to 1"]

  - method: POST
    path: "/marketing-programs/{id}/launch"
    description: "Put a planned program into market. Launch is gated on the district having an EXECUTED destination marketing organization agreement, so a program whose own state is perfectly valid still cannot start while the DMO agreement is merely PROPOSED."
    roles: [DistrictAdministrator, DmoLiaison]
    code: 200
    input: ["launch_note?"]
    output: MarketingProgram
    side_effects: ["program moves PLANNED -> RUNNING and launched_at is set from the logical clock", "refused while District.dmo_agreement_status is not EXECUTED", "program budget re-checked against the plan's sales and marketing line", "increments MarketingProgram.version by 1"]

  - method: POST
    path: "/marketing-programs/{id}/room-night-claims"
    description: "An operator claims room nights generated by a running program. Stay intervals are half-open [stay_start, stay_end) and may not overlap another live claim of the same property on the same program, though a stay starting exactly where another ends is accepted."
    roles: [LodgingOperator, DmoLiaison]
    code: 201
    input: [lodging_business_id, stay_start, stay_end, room_nights, "attribution_method?"]
    output: RoomNightClaim
    side_effects: ["claim created in SUBMITTED with verified_room_nights null", "requires the program RUNNING and the stay entirely inside [booking_window_start, booking_window_end)", "half-open overlap check against the property's SUBMITTED and VERIFIED claims on this program", "room_nights checked against room_count multiplied by the whole nights of the stay", "increments RoomNightClaim.version to 1"]

  - method: POST
    path: "/room-night-claims/{id}/verification"
    description: "Verification of a claim by the destination marketing organization. decision ALLOW fixes verified_room_nights, which is the only figure that feeds program performance; decision REJECT excludes the claim and frees its stay interval."
    roles: [DmoLiaison, DistrictAdministrator]
    code: 200
    input: [decision, "verified_room_nights?", "rejection_reason?"]
    output: RoomNightClaim
    side_effects: ["claim moves SUBMITTED -> VERIFIED or SUBMITTED -> REJECTED and records verified_by_user_id", "ALLOW writes verified_room_nights, defaulting to room_nights when omitted and never exceeding it", "MarketingProgram.verified_room_nights recomputed as the sum over VERIFIED claims only", "REJECT restores MarketingProgram.verified_room_nights to exactly its pre-claim value and frees the stay interval for a new claim", "increments RoomNightClaim.version by 1 and MarketingProgram.version by 1"]

  - method: POST
    path: "/marketing-programs/{id}/closure"
    description: "Close a running program and publish its performance measurement. The efficiency tier is fixed from gross cost per room night before any DMO cost share is netted out, and the published index is then computed on the net figure."
    roles: [DistrictAdministrator, DmoLiaison]
    code: 200
    input: ["closure_note?"]
    output: MarketingProgram
    side_effects: ["program moves RUNNING -> CLOSED and closed_at is set from the logical clock", "refused while any claim of the program is still SUBMITTED", "refused while spend_frozen is true because the funding work plan sits in AMENDMENT_PENDING", "program_performance computed in two passes, writing gross_cost_per_room_night_cents, efficiency_tier, dmo_cost_share_cents, net_district_cost_cents, net_cost_per_room_night_cents, performance_index and performance_flag", "a program with zero VERIFIED room nights closes with null cost per room night, TIER_UNPRODUCTIVE, index 0.0000 and performance_flag UNDERPERFORMING", "increments MarketingProgram.version by 1"]

  # ---------- writes: transparency --------------------------------------
  - method: POST
    path: "/transparency-records"
    description: "Schedule a public meeting, annual report or financial audit. Two public meetings of the same district must be at least 10 whole days apart."
    roles: [DistrictAdministrator]
    code: 201
    input: [district_id, record_type, fiscal_year, scheduled_for, required_by]
    output: TransparencyRecord
    side_effects: ["record created in SCHEDULED with engaged_by_user_id from X-User-ID", "10-day separation enforced against the district's other PUBLIC_MEETING records", "increments TransparencyRecord.version to 1"]

  - method: POST
    path: "/transparency-records/{id}/advance"
    description: "Advance a transparency record: to_status NOTICED posts the public notice at least 14 whole days ahead of the meeting, COMPLETED records that it happened, PUBLISHED puts the document on the public record."
    roles: [DistrictAdministrator]
    code: 200
    input: [to_status, "document_reference?"]
    output: TransparencyRecord
    side_effects: ["record advanced SCHEDULED -> NOTICED -> COMPLETED -> PUBLISHED per §1.2", "on a FINANCIAL_AUDIT record, COMPLETED and PUBLISHED are refused with ERR_SEGREGATION_OF_DUTIES when X-User-ID equals engaged_by_user_id", "NOTICE refused with ERR_MEETING_NOTICE_TOO_LATE when the clock is nearer than 14 whole days to scheduled_for; exactly 14 days is accepted", "PUBLISHED requires document_reference and sets published_on from the logical clock", "District.transparency_standing recomputed: COMPLIANT while no ANNUAL_REPORT or FINANCIAL_AUDIT record of the district is OVERDUE, DEFICIENT otherwise", "increments TransparencyRecord.version by 1 and District.version by 1"]

  # ---------- writes: logical clock (test-driving endpoint) --------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an explicit instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time. Every deadline, grace period, notice window, renewal window and stay-interval comparison in this API is evaluated against the logical clock, so all temporal behavior is deterministic and run-time independent."
    roles: [DistrictAdministrator]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["logical clock set to current_utc", "every SCHEDULED or NOTICED TransparencyRecord whose required_by is now in the past moves to terminal OVERDUE", "District.transparency_standing recomputed to DEFICIENT for any district holding an OVERDUE record, which blocks renewal certification", "no assessment, penalty or interest is charged by this call; delinquency is only assessed by an explicit sweep"]

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:

  # --- authentication and authorization ---------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or carrying a role not declared in §1.7, on an endpoint that is not public"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_OPERATOR_IDENTITY_UNKNOWN
    http: 403
    condition: "X-User-Role is LodgingOperator but X-User-ID does not match any LodgingBusiness id"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a LodgingOperator acts on a statement, signature, claim, remittance or dispute that does not chain back to its own LodgingBusiness"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same X-User-ID both sponsors and approves a work plan, both audits and certifies an assessment statement, or both engages a FINANCIAL_AUDIT transparency record and advances it to COMPLETED or PUBLISHED"

  # --- request shape -----------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, an enum value is not a declared member, a cent amount is negative or non-integer, a date does not parse as ISO-8601, an interval has start >= end, or PUBLISHED is requested without document_reference"

  # --- existence ---------------------------------------------------------
  - id: ERR_DISTRICT_NOT_FOUND
    http: 404
    condition: "the district id in the path or in district_id does not exist"
  - id: ERR_LODGING_BUSINESS_NOT_FOUND
    http: 404
    condition: "the lodging business id in the path or in lodging_business_id does not exist"
  - id: ERR_PETITION_DRIVE_NOT_FOUND
    http: 404
    condition: "the petition drive id in the path does not exist"
  - id: ERR_PETITION_SIGNATURE_NOT_FOUND
    http: 404
    condition: "the petition signature id in the path does not exist"
  - id: ERR_ASSESSMENT_PERIOD_NOT_FOUND
    http: 404
    condition: "the assessment period id in the path or in district scoping does not exist"
  - id: ERR_ASSESSMENT_STATEMENT_NOT_FOUND
    http: 404
    condition: "the assessment statement id in the path or in assessment_statement_id does not exist"
  - id: ERR_REMITTANCE_NOT_FOUND
    http: 404
    condition: "the remittance id in the path, or the remittance_id supplied to a reversal, does not exist or does not belong to the statement in the path"
  - id: ERR_WORK_PLAN_NOT_FOUND
    http: 404
    condition: "the annual work plan id in the path or in annual_work_plan_id does not exist"
  - id: ERR_MARKETING_PROGRAM_NOT_FOUND
    http: 404
    condition: "the marketing program id in the path does not exist"
  - id: ERR_ROOM_NIGHT_CLAIM_NOT_FOUND
    http: 404
    condition: "the room night claim id in the path does not exist"
  - id: ERR_TRANSPARENCY_RECORD_NOT_FOUND
    http: 404
    condition: "the transparency record id in the path does not exist"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "the assessment dispute id in the path does not exist"

  # --- state preconditions ----------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested transition is not declared from the resource's current state in §1.2, including any attempt to act on a terminal state"
  - id: ERR_STATEMENT_ALREADY_CERTIFIED
    http: 409
    condition: "a filing, amendment or further audit action is attempted on a statement whose filing_status is CERTIFIED"
  - id: ERR_DISTRICT_NOT_ACTIVE
    http: 409
    condition: "assessment, work plan, program, transparency or petition activity is attempted on a district that is FORMATION_FAILED, EXPIRED or DISESTABLISHED"
  - id: ERR_PERIOD_NOT_CLOSED
    http: 409
    condition: "an audit is attempted while the owning assessment period is still OPEN"
  - id: ERR_WORK_PLAN_NOT_APPROVED
    http: 409
    condition: "a marketing program is created against a work plan that is not APPROVED"
  - id: ERR_DMO_AGREEMENT_NOT_EXECUTED
    http: 409
    condition: "a program launch is attempted while the district's DMO agreement status is not EXECUTED"
  - id: ERR_PROGRAM_SPEND_FROZEN
    http: 409
    condition: "closure of a RUNNING program is attempted while spend_frozen is true because its funding work plan is in AMENDMENT_PENDING"
  - id: ERR_CLAIMS_PENDING_VERIFICATION
    http: 409
    condition: "a program closure is attempted while at least one of its room night claims is still SUBMITTED"

  # --- optimistic concurrency -------------------------------------------
  - id: ERR_STALE_STATEMENT_VERSION
    http: 412
    condition: "expected_statement_version does not equal the AssessmentStatement version currently stored, because the statement has been amended since the caller last read it"
  - id: ERR_STALE_WORK_PLAN_VERSION
    http: 412
    condition: "expected_work_plan_version does not equal the AnnualWorkPlan version currently stored, because the plan has been amended since the caller last read it"

  # --- compliance and transparency --------------------------------------
  - id: ERR_TRANSPARENCY_REQUIREMENTS_UNMET
    http: 409
    condition: "renewal is opened or certified while the district lacks a PUBLISHED annual report or financial audit for District.current_fiscal_year, or while transparency_standing is DEFICIENT"

  # --- temporal ----------------------------------------------------------
  - id: ERR_PETITION_WINDOW_CLOSED
    http: 409
    condition: "a signature or withdrawal is attempted when the logical clock lies outside the drive's half-open [opened_on, closes_at) window"
  - id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http: 409
    condition: "a renewal drive is opened, or renewal is requested, when the logical clock is more than 180 whole days before the district's expiration_date or already past it"
  - id: ERR_MEETING_NOTICE_TOO_LATE
    http: 409
    condition: "a public notice is posted fewer than 14 whole days before scheduled_for; exactly 14 days is accepted"
  - id: ERR_CLAIM_OUTSIDE_BOOKING_WINDOW
    http: 409
    condition: "a claimed stay is not entirely inside the program's half-open [booking_window_start, booking_window_end)"
  - id: ERR_FILING_WINDOW_CLOSED
    http: 409
    condition: "a filing or amendment is attempted on a period that is not OPEN, or after the period's due_date on the logical clock"

  # --- referential -------------------------------------------------------
  - id: ERR_BUSINESS_OUTSIDE_BOUNDARY
    http: 409
    condition: "the acting lodging business belongs to a different district than the resource being acted on, its boundary_zone is not in District.included_zones, or its status is OUTSIDE_BOUNDARY"
  - id: ERR_BUSINESS_EXEMPT
    http: 409
    condition: "the acting lodging business has exempt_status other than NONE, or status EXEMPT, and therefore holds no petition standing"
  - id: ERR_DUPLICATE_SIGNATURE
    http: 409
    condition: "the business already holds a VALID signature on this drive"
  - id: ERR_STATEMENT_ALREADY_EXISTS_FOR_PERIOD
    http: 409
    condition: "a statement already exists for every eligible (assessment_period_id, lodging_business_id) pair of the period, so a re-run of statement generation would create nothing"
  - id: ERR_DISPUTE_ALREADY_OPEN
    http: 409
    condition: "a non-terminal dispute of the same dispute_type already exists on this statement"
  - id: ERR_REMITTANCE_ALREADY_REVERSED
    http: 409
    condition: "the remittance being reversed is already REVERSED"

  # --- constraint --------------------------------------------------------
  - id: ERR_PERIOD_OVERLAP
    http: 409
    condition: "the proposed half-open [period_start, period_end) overlaps an existing period of the district; touching endpoints do not overlap"
  - id: ERR_MEETING_SEPARATION_VIOLATION
    http: 409
    condition: "two public meetings of the district are scheduled fewer than 10 whole days apart; exactly 10 days is accepted"
  - id: ERR_CLAIM_STAY_OVERLAP
    http: 409
    condition: "the proposed half-open [stay_start, stay_end) overlaps a SUBMITTED or VERIFIED claim of the same property on the same program; touching endpoints do not overlap"
  - id: ERR_CLAIM_EXCEEDS_CAPACITY
    http: 409
    condition: "room_nights exceeds room_count multiplied by the whole nights of the stay, or verified_room_nights exceeds the claim's room_nights"
  - id: ERR_EXPENDITURE_CATEGORY_NOT_PERMITTED
    http: 409
    condition: "an expenditure line names a category outside the permitted set, or a CAPITAL_IMPROVEMENT line appears in a district whose assessment_method is not PCT_OF_ROOM_REVENUE"
  - id: ERR_ADMIN_SHARE_EXCEEDED
    http: 409
    condition: "administration lines exceed 15 percent of the plan total at approval or amendment"
  - id: ERR_CONTINGENCY_SHARE_EXCEEDED
    http: 409
    condition: "contingency reserve lines exceed 10 percent of the plan total at approval or amendment"
  - id: ERR_MARKETING_SHARE_BELOW_MINIMUM
    http: 409
    condition: "sales and marketing lines fall below 60 percent of the plan total at approval or amendment"
  - id: ERR_APPEAL_LIMIT_EXCEEDED
    http: 409
    condition: "a second appeal is attempted on a dispute that has already been appealed once"
  - id: ERR_PETITION_POOL_TOO_SMALL
    http: 409
    condition: "the district's eligible assessable pool holds fewer than 3 businesses at tally or certification time"

  # --- fiscal ------------------------------------------------------------
  - id: ERR_AMENDMENT_VARIANCE_EXCEEDED
    http: 409
    condition: "the amended plan total moves more than 25 percent away from the plan's stored total, or the plan has already taken 3 revisions"
  - id: ERR_FUNDING_RATIO_BELOW_MINIMUM
    http: 409
    condition: "the plan's funding_ratio is below 0.9000 at the moment of board approval"
  - id: ERR_PROGRAM_BUDGET_EXCEEDED
    http: 409
    condition: "committed spend across the plan's live programs would exceed its sales and marketing line total"
  - id: ERR_LODGING_TAX_MATCH_CAP_EXCEEDED
    http: 409
    condition: "committed lodging tax match would exceed 50 percent of the approved plan total"
  - id: ERR_LODGING_TAX_MATCH_EXHAUSTED
    http: 409
    condition: "committed lodging tax match would exceed the district's lodging_tax_match_pool_cents, including a coordination call that lowers the pool below what is already committed"
  - id: ERR_REMITTANCE_EXCEEDS_TOTAL_DUE
    http: 409
    condition: "a remittance exceeds total_due_cents by more than the 500000 cent overpayment tolerance"
  - id: ERR_ADJUSTMENT_EXCEEDS_ASSESSMENT
    http: 409
    condition: "a granted dispute adjustment exceeds the statement's current effective_assessment_cents"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix
# -----------------------------------------------------------------------------
roles:

  - name: DistrictAdministrator
    description: "District staff who run formation, the assessment roll, collections, transparency filings and the district lifecycle. Broadest write surface, but cannot approve a work plan, resolve a dispute or audit an assessment statement."
    identity: "opaque"
    exclusive_operations:
      - "POST /districts"
      - "POST /districts/{id}/boundary-revisions"
      - "POST /districts/{id}/dmo-coordination"
      - "POST /districts/{id}/lifecycle-advances"
      - "POST /lodging-businesses"
      - "POST /lodging-businesses/{id}/revisions"
      - "POST /petition-drives"
      - "POST /petition-drives/{id}/tally"
      - "POST /petition-drives/{id}/certification"
      - "POST /assessment-periods"
      - "POST /assessment-periods/{id}/statement-generation"
      - "POST /assessment-periods/{id}/closure"
      - "POST /assessment-periods/{id}/delinquency-sweep"
      - "POST /assessment-statements/{id}/remittance-reversals"
      - "POST /annual-work-plans"
      - "POST /transparency-records"
      - "POST /transparency-records/{id}/advance"
      - "POST /_clock/set_current_utc"
      - "GET /assessment-periods/{id}/statements"
    shared_operations:
      - "POST /petition-drives/{id}/signatures (with LodgingOperator)"
      - "POST /petition-signatures/{id}/withdrawal (with LodgingOperator)"
      - "POST /assessment-statements/{id}/filings (with LodgingOperator)"
      - "POST /assessment-statements/{id}/amendments (with LodgingOperator)"
      - "POST /assessment-statements/{id}/remittances (with LodgingOperator)"
      - "POST /assessment-disputes (with LodgingOperator)"
      - "POST /annual-work-plans/{id}/amendments (with BoardMember)"
      - "POST /marketing-programs (with DmoLiaison)"
      - "POST /marketing-programs/{id}/launch (with DmoLiaison)"
      - "POST /marketing-programs/{id}/closure (with DmoLiaison)"
      - "POST /room-night-claims/{id}/verification (with DmoLiaison)"
      - "all GET endpoints"

  - name: BoardMember
    description: "Member of the district board. Sole authority to sponsor, approve, return and close an annual budget and work plan; the same board member may not both sponsor and approve the same plan."
    identity: "opaque"
    exclusive_operations:
      - "POST /annual-work-plans/{id}/board-actions"
    shared_operations:
      - "POST /annual-work-plans/{id}/amendments (with DistrictAdministrator)"
      - "GET /districts, GET /districts/{id}, GET /districts/{id}/financial-summary"
      - "GET /districts/{id}/lodging-businesses, GET /districts/{id}/petition-drives, GET /districts/{id}/assessment-periods, GET /districts/{id}/annual-work-plans, GET /districts/{id}/transparency-records"
      - "GET /petition-drives/{id}, GET /petition-drives/{id}/signatures, GET /petition-signatures/{id}"
      - "GET /assessment-periods/{id}, GET /annual-work-plans/{id}, GET /annual-work-plans/{id}/marketing-programs"
      - "GET /marketing-programs/{id}, GET /transparency-records/{id}, GET /lodging-businesses/{id}, GET /lodging-businesses/{id}/petition-signatures"

  - name: LodgingOperator
    description: "The lodging business itself, acting through its operator. Files and amends its own assessment statements, remits payment, signs and withdraws petition signatures, submits room-night claims and disputes its own assessments. X-User-ID is the LodgingBusiness id, and every write is ownership-checked against it."
    identity: "entity_backed:LodgingBusiness"
    exclusive_operations: []
    shared_operations:
      - "POST /petition-drives/{id}/signatures (with DistrictAdministrator)"
      - "POST /petition-signatures/{id}/withdrawal (with DistrictAdministrator)"
      - "POST /assessment-statements/{id}/filings (with DistrictAdministrator)"
      - "POST /assessment-statements/{id}/amendments (with DistrictAdministrator)"
      - "POST /assessment-statements/{id}/remittances (with DistrictAdministrator)"
      - "POST /assessment-disputes (with DistrictAdministrator)"
      - "POST /assessment-disputes/{id}/proceedings, actions SUBMIT_RESPONSE, APPEAL and WITHDRAW only (with HearingOfficer, who holds OPEN_REVIEW and REQUEST_INFO)"
      - "POST /marketing-programs/{id}/room-night-claims (with DmoLiaison)"
      - "GET on its own LodgingBusiness, statements, remittances, signatures, claims and disputes"
      - "GET /districts, GET /districts/{id}, GET /districts/{id}/financial-summary, GET /districts/{id}/transparency-records, GET /transparency-records/{id}"

  - name: DmoLiaison
    description: "Staff of the destination marketing organization coordinating with the district. Runs marketing programs and verifies the room-night claims that feed performance measurement, but has no authority over assessments, collections or the budget."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /marketing-programs (with DistrictAdministrator)"
      - "POST /marketing-programs/{id}/launch (with DistrictAdministrator)"
      - "POST /marketing-programs/{id}/closure (with DistrictAdministrator)"
      - "POST /marketing-programs/{id}/room-night-claims (with LodgingOperator)"
      - "POST /room-night-claims/{id}/verification (with DistrictAdministrator)"
      - "GET /districts, GET /districts/{id}, GET /districts/{id}/annual-work-plans, GET /annual-work-plans/{id}, GET /annual-work-plans/{id}/marketing-programs, GET /marketing-programs/{id}, GET /marketing-programs/{id}/room-night-claims, GET /room-night-claims/{id}, GET /lodging-businesses/{id}/room-night-claims"

  - name: HearingOfficer
    description: "Independent officer who hears disputes over the assessment calculation, exempt-property determinations and boundary determinations. Sole authority to resolve a dispute, and therefore the only role that can grant an adjustment against a statement."
    identity: "opaque"
    exclusive_operations:
      - "POST /assessment-disputes/{id}/resolution"
      - "POST /assessment-disputes/{id}/proceedings, actions OPEN_REVIEW and REQUEST_INFO"
    shared_operations:
      - "GET /assessment-disputes/{id}, GET /assessment-statements/{id}, GET /assessment-statements/{id}/disputes, GET /assessment-periods/{id}/statements, GET /lodging-businesses/{id}, GET /lodging-businesses/{id}/assessment-statements, GET /lodging-businesses/{id}/disputes"
      - "GET /districts, GET /districts/{id}, GET /districts/{id}/lodging-businesses"

  - name: IndependentAuditor
    description: "External auditor engaged for the statutory financial audit. Sole authority to audit and certify assessment statements; the same auditor id may not both audit and certify one statement."
    identity: "opaque"
    exclusive_operations:
      - "POST /assessment-statements/{id}/audit-certification"
    shared_operations:
      - "GET /districts, GET /districts/{id}, GET /districts/{id}/financial-summary and every district sub-resource list"
      - "GET /assessment-periods/{id}, GET /assessment-periods/{id}/statements, GET /assessment-statements/{id}, GET /assessment-statements/{id}/remittances, GET /remittances/{id}"
      - "GET /annual-work-plans/{id}, GET /marketing-programs/{id}, GET /room-night-claims/{id}, GET /transparency-records/{id}"

  - name: PublicViewer
    description: "Any member of the public. Reads only what the transparency requirements oblige the district to publish: the district record, its published financial summary, its work plans, its petition drives, its transparency records and its marketing program performance. These endpoints accept requests with no headers at all."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /districts"
      - "GET /districts/{id}"
      - "GET /districts/{id}/financial-summary"
      - "GET /districts/{id}/petition-drives"
      - "GET /districts/{id}/annual-work-plans"
      - "GET /districts/{id}/transparency-records"
      - "GET /transparency-records/{id}"
      - "GET /petition-drives/{id}"
      - "GET /annual-work-plans/{id}"
      - "GET /marketing-programs/{id}"
