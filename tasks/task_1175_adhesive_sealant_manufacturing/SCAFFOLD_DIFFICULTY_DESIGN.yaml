# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Adhesive & Sealant Manufacturing (task 1175)
# 9 Difficulty Rules x 2 instances = 18 instances.
# All arithmetic in assert: lines was pre-computed from the pinned formulas.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1: dual_variant_calc — two dual-variant calculations on DIFFERENT
  # entity domains (QA bond assessment vs consignment settlement).
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: lot_release_quick_pass_full_fail_divergence
        grounds:
          - calculations.bond_strength_assessment
          - state_machines.CureTest.RECORDED_to_ACCEPTED
          - state_machines.ProductionLot.qa_UNDER_REVIEW_to_RELEASED
        distinguishing_aspect: |
          Entity domain = ProductionLot QA. For the SAME lot and overlapping
          specimen data, the QUICK variant (single raw specimen >= spec) passes
          while the FULL variant (min/max-trimmed mean of 5 plus per-specimen
          tolerance) fails, so release is blocked: QUICK 12.4 >= 12.0 passes,
          FULL trimmed mean of [11.8, 12.0, 12.1] = 11.97 < 12.0 fails.
        test_recipe:
          setup:
            - "RELEASED-blocked lot: batch mixed at 08:00, 10 cartridges sealed, one QUICK test accepted (pass), then a FULL test accepted (fail) after a retest cycle; lot is UNDER_REVIEW with the FULL test as the latest ACCEPTED"
          setup_api_calls:
            - call: "POST /api/formulations"
              payload: { code: "EPX-QF-1", name: "Epoxy QF1", chemistry_family: "EPOXY", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 240, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - call: "POST /api/formulations/${form_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-QF-1", capacity_liters: 500 }
              as: PlantManager
              captures: { ves_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T09:00:00Z", batch_volume_ml: 5000 }
              as: BatchOperator
              captures: { bat_id: $.data.id, lot_id: $.data.production_lot_id }
            - call: "POST /api/batches/${bat_id}/complete-mix"
              payload: {}
              as: BatchOperator
            - call: "POST /api/packaging-runs"
              payload: { batch_id: "${bat_id}", pack_format: "CARTRIDGE", unit_volume_ml: 310, planned_units: 10, planned_start_at: "2026-05-01T08:10:00Z", planned_end_at: "2026-05-01T09:30:00Z" }
              as: BatchOperator
              captures: { run_id: $.data.id }
            - call: "POST /api/packaging-runs/${run_id}/complete"
              payload: {}
              as: BatchOperator
            - call: "POST /api/production-lots/${lot_id}/cure-tests"
              payload: { method: "QUICK", specimens: [12.4] }
              as: QATechnician
              as_user_id: "tech-1"
              captures: { t_quick: $.data.id }
            - call: "POST /api/cure-tests/${t_quick}/accept"
              payload: {}
              as: QAManager
              as_user_id: "qm-1"
            - call: "POST /api/production-lots/${lot_id}/request-retest"
              payload: {}
              as: QAManager
              as_user_id: "qm-1"
            - call: "POST /api/production-lots/${lot_id}/cure-tests"
              payload: { method: "FULL", specimens: [12.1, 12.0, 11.8, 11.6, 13.0] }
              as: QATechnician
              as_user_id: "tech-1"
              captures: { t_full: $.data.id }
            - call: "POST /api/cure-tests/${t_full}/accept"
              payload: {}
              as: QAManager
              as_user_id: "qm-1"
          trigger:
            - call: "POST /api/production-lots/${lot_id}/release"
              payload: {}
              as: QAManager
              as_user_id: "qm-1"
          assert:
            - "CureTest.${t_quick}: evaluated_value_mpa == 12.4 AND assessment_pass == true AND status == SUPERSEDED"
            - "CureTest.${t_full}: evaluated_value_mpa == 11.97 AND assessment_pass == false AND status == ACCEPTED"
            - "trigger returns http 422 with error_id == ERR_BOND_STRENGTH_BELOW_SPEC"
            - "ProductionLot.${lot_id}.qa_status == UNDER_REVIEW (unchanged)"

      - name: consignment_provisional_vs_final_settlement
        grounds:
          - calculations.consignment_settlement
          - calculations.consignment_consumption_waterfall
          - state_machines.ConsumptionReport.DRAFT_to_SUBMITTED
          - state_machines.ConsumptionReport.SUBMITTED_to_SETTLED
        distinguishing_aspect: |
          Entity domain = ConsignmentAgreement settlement. For the SAME report
          (260 consumed units @ 2000 cents), the PROVISIONAL variant at submit
          is flat gross 520000 cents, while the FINAL variant at settle applies
          the TIER1 rebate keyed on gross (520000 >= 500000 inclusive) yielding
          rebate 26000 and net 494000 — different money for identical input.
        test_recipe:
          setup:
            - "Released lot with 400 filled units; ACTIVE consignment agreement (unit_price 2000, reorder_threshold 0 so no auto-replenishment fires); 300 units dispatched into consignment; report for 260 units created and submitted"
          setup_api_calls:
            - call: "POST /api/formulations"
              payload: { code: "PU-SET-1", name: "PU Set1", chemistry_family: "POLYURETHANE", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 240, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - call: "POST /api/formulations/${form_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-SET-1", capacity_liters: 500 }
              as: PlantManager
              captures: { ves_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T09:00:00Z", batch_volume_ml: 200000 }
              as: BatchOperator
              captures: { bat_id: $.data.id, lot_id: $.data.production_lot_id }
            - call: "POST /api/batches/${bat_id}/complete-mix"
              payload: {}
              as: BatchOperator
            - call: "POST /api/packaging-runs"
              payload: { batch_id: "${bat_id}", pack_format: "CARTRIDGE", unit_volume_ml: 310, planned_units: 400, planned_start_at: "2026-05-01T08:10:00Z", planned_end_at: "2026-05-01T09:30:00Z" }
              as: BatchOperator
              captures: { run_id: $.data.id }
            - call: "POST /api/packaging-runs/${run_id}/complete"
              payload: {}
              as: BatchOperator
            - call: "POST /api/production-lots/${lot_id}/cure-tests"
              payload: { method: "FULL", specimens: [13.0, 12.5, 12.4, 12.3, 12.6] }
              as: QATechnician
              as_user_id: "tech-1"
              captures: { t1: $.data.id }
            - call: "POST /api/cure-tests/${t1}/accept"
              payload: {}
              as: QAManager
              as_user_id: "qm-1"
            - call: "POST /api/production-lots/${lot_id}/release"
              payload: {}
              as: QAManager
              as_user_id: "qm-1"
            - call: "POST /api/distributors"
              payload: { name: "Dist Set", credit_limit_cents: 10000000, contact_email: "d@x.com" }
              as: CommercialManager
              captures: { dist_id: $.data.id }
            - call: "POST /api/consignment-agreements"
              payload: { distributor_id: "${dist_id}", formulation_id: "${form_id}", unit_price_cents: 2000, max_consigned_value_cents: 900000, reorder_threshold_units: 0, reorder_qty_units: 200 }
              as: CommercialManager
              captures: { ag_id: $.data.id }
            - call: "POST /api/consignment-agreements/${ag_id}/activate"
              payload: {}
              as: CommercialManager
              captures: { ag_v: $.data.version }
            - call: "POST /api/shipments"
              payload: { shipment_kind: "CONSIGNMENT", distributor_id: "${dist_id}", transport_mode: "ROAD", ship_date: "2026-06-01", agreement_id: "${ag_id}" }
              as: LogisticsCoordinator
              captures: { ship_id: $.data.id }
            - call: "POST /api/shipments/${ship_id}/lines"
              payload: { lot_id: "${lot_id}", units: 300 }
              as: LogisticsCoordinator
            - call: "POST /api/shipments/${ship_id}/plan"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /api/shipments/${ship_id}/confirm"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /api/shipments/${ship_id}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /api/consignment-agreements/${ag_id}/consumption-reports"
              payload: { period: "2026-06", consumed_units: 260, expected_agreement_version: "${ag_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /api/consumption-reports/${rep_id}/submit"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /api/consumption-reports/${rep_id}/settle"
              payload: {}
              as: CommercialManager
          assert:
            - "after submit: ConsumptionReport.${rep_id}.provisional_settlement_cents == 520000 (260 x 2000, no rebate)"
            - "after settle: rebate_tier == TIER1 AND rebate_cents == 26000 AND final_net_settlement_cents == 494000"
            - "provisional_settlement_cents (520000) != final_net_settlement_cents (494000) for identical consumed_units"
            - "ConsignmentStock row for (${ag_id}, ${lot_id}): qty_consumed == 260 AND qty_on_hand == 40"

  # ---------------------------------------------------------------------------
  # Rule 2: combinatorial_formula — mode (a) multi-input non-linear classifier
  # vs mode (b) nested rounding order. Different modes, per the rule.
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: hazmat_classification_multi_input_mode_a
        grounds:
          - calculations.hazmat_transport_classification
          - state_machines.Shipment.DRAFT_to_PLANNED
          - state_machines.Shipment.PLANNED_to_CONFIRMED
          - errors[ERR_HAZMAT_MODE_FORBIDDEN]
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear conditional branches —
          (solvent_content_pct, flash_point_c) decide UN1133/PG_II, then
          (pack_format, unit_volume_ml, transport_mode) gate AIR carriage.
          Identical lot ships fine by ROAD but is rejected by AIR.
        test_recipe:
          setup:
            - "Released DRUM lot (unit_volume 200000 ml) of a solvent-borne formulation (solvent 30.0%, flash 20.0C -> UN1133 PG_II); two DRAFT/PLANNED shipments reference it, one AIR and one ROAD"
          setup_api_calls:
            - call: "POST /api/formulations"
              payload: { code: "SLV-HZ-1", name: "Solvent HZ1", chemistry_family: "ACRYLIC", moisture_sensitive: false, solvent_content_pct: 30.0, flash_point_c: 20.0, pot_life_minutes: 240, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - call: "POST /api/formulations/${form_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-HZ-1", capacity_liters: 1000 }
              as: PlantManager
              captures: { ves_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T09:00:00Z", batch_volume_ml: 500000 }
              as: BatchOperator
              captures: { bat_id: $.data.id, lot_id: $.data.production_lot_id }
            - call: "POST /api/batches/${bat_id}/complete-mix"
              payload: {}
              as: BatchOperator
            - call: "POST /api/packaging-runs"
              payload: { batch_id: "${bat_id}", pack_format: "DRUM", unit_volume_ml: 200000, planned_units: 2, planned_start_at: "2026-05-01T08:10:00Z", planned_end_at: "2026-05-01T09:30:00Z" }
              as: BatchOperator
              captures: { run_id: $.data.id }
            - call: "POST /api/packaging-runs/${run_id}/complete"
              payload: {}
              as: BatchOperator
            - call: "POST /api/production-lots/${lot_id}/cure-tests"
              payload: { method: "FULL", specimens: [13.0, 12.5, 12.4, 12.3, 12.6] }
              as: QATechnician
              as_user_id: "tech-1"
              captures: { t1: $.data.id }
            - call: "POST /api/cure-tests/${t1}/accept"
              payload: {}
              as: QAManager
              as_user_id: "qm-1"
            - call: "POST /api/production-lots/${lot_id}/release"
              payload: {}
              as: QAManager
              as_user_id: "qm-1"
            - call: "POST /api/distributors"
              payload: { name: "Dist HZ", credit_limit_cents: 1000000, contact_email: "h@x.com" }
              as: CommercialManager
              captures: { dist_id: $.data.id }
            - call: "POST /api/shipments"
              payload: { shipment_kind: "SALE", distributor_id: "${dist_id}", transport_mode: "AIR", ship_date: "2026-06-01" }
              as: LogisticsCoordinator
              captures: { ship_air: $.data.id }
            - call: "POST /api/shipments/${ship_air}/lines"
              payload: { lot_id: "${lot_id}", units: 1 }
              as: LogisticsCoordinator
            - call: "POST /api/shipments/${ship_air}/plan"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /api/shipments"
              payload: { shipment_kind: "SALE", distributor_id: "${dist_id}", transport_mode: "ROAD", ship_date: "2026-06-01" }
              as: LogisticsCoordinator
              captures: { ship_road: $.data.id }
            - call: "POST /api/shipments/${ship_road}/lines"
              payload: { lot_id: "${lot_id}", units: 1 }
              as: LogisticsCoordinator
            - call: "POST /api/shipments/${ship_road}/plan"
              payload: {}
              as: LogisticsCoordinator
          trigger:
            - call: "POST /api/shipments/${ship_air}/confirm"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /api/shipments/${ship_road}/confirm"
              payload: {}
              as: LogisticsCoordinator
          assert:
            - "Shipment.${ship_air}.hazmat_class == UN1133_CLASS3_PG_II (solvent 30.0 >= 24.0 AND flash 20.0 < 23.0)"
            - "confirm(${ship_air}) returns 422 ERR_HAZMAT_MODE_FORBIDDEN (AIR + PG_II + unit_volume 200000 > 5000); status stays PLANNED"
            - "confirm(${ship_road}) succeeds: Shipment.${ship_road}.status == CONFIRMED (ROAD has no mode gate)"

      - name: pack_fill_per_unit_rounding_order_mode_b
        grounds:
          - calculations.pack_fill_allocation
          - entities.PackagingRun.fields.per_unit_fill_ml
          - entities.ProductionBatch.fields.remaining_bulk_volume_ml
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — round per-unit first
          (310 ml x 1.02 = 316.2 -> 316), then multiply by units (3 x 316 = 948).
          The alternative order (3 x 316.2 = 948.6 -> 949) yields a different
          integer; the test pins 948 and remaining 52.
        test_recipe:
          setup:
            - "Batch of 1000 ml mixed at 08:00 (pot life 240 min); one CARTRIDGE run of nominal 310 ml units opened"
          setup_api_calls:
            - call: "POST /api/formulations"
              payload: { code: "EPX-RND-1", name: "Epx Rnd", chemistry_family: "EPOXY", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 240, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - call: "POST /api/formulations/${form_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-RND-1", capacity_liters: 100 }
              as: PlantManager
              captures: { ves_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T09:00:00Z", batch_volume_ml: 1000 }
              as: BatchOperator
              captures: { bat_id: $.data.id, lot_id: $.data.production_lot_id }
            - call: "POST /api/batches/${bat_id}/complete-mix"
              payload: {}
              as: BatchOperator
            - call: "POST /api/packaging-runs"
              payload: { batch_id: "${bat_id}", pack_format: "CARTRIDGE", unit_volume_ml: 310, planned_units: 10, planned_start_at: "2026-05-01T08:10:00Z", planned_end_at: "2026-05-01T09:30:00Z" }
              as: BatchOperator
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /api/packaging-runs/${run_id}/complete"
              payload: {}
              as: BatchOperator
          assert:
            - "PackagingRun.${run_id}.per_unit_fill_ml == 316 (round_half_up(310 x 1.02) = round_half_up(316.2))"
            - "PackagingRun.${run_id}.units_produced == 3 (min(10, floor(1000 / 316)))"
            - "PackagingRun.${run_id}.total_filled_ml == 948 (3 x 316, NOT round(3 x 316.2) = 949)"
            - "ProductionBatch.${bat_id}.remaining_bulk_volume_ml == 52 (1000 - 948)"

  # ---------------------------------------------------------------------------
  # Rule 3: non_linear_state_machine — parallel dimensions on ProductionLot vs
  # cycle+branch on FormulationRequest. Different entities AND different shapes.
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: production_lot_parallel_qa_hold_dimensions
        grounds:
          - state_machines.ProductionLot
          - entities.ProductionLot.fields.qa_status
          - entities.ProductionLot.fields.hold_status
        distinguishing_aspect: |
          Parallel shape: qa_status and hold_status are independent dimensions
          on the SAME ProductionLot. A SEALED-run exposure flips hold_status
          CLEAR -> QUARANTINE_HOLD while qa_status stays RELEASED; hold-release
          flips hold back without touching qa. Two state reads per step prove
          the dimensions evolve independently.
        test_recipe:
          setup:
            - "RELEASED lot (3 cartridge units, moisture-sensitive formulation packed in dry room) with a SEALED run; a 45-minute exposure event drives the run into HOLD"
          setup_api_calls:
            - call: "POST /api/formulations"
              payload: { code: "SIL-PAR-1", name: "Sil Par", chemistry_family: "SILICONE", moisture_sensitive: true, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 240, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - call: "POST /api/formulations/${form_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-PAR-1", capacity_liters: 100 }
              as: PlantManager
              captures: { ves_id: $.data.id }
            - call: "POST /api/dry-rooms"
              payload: { room_code: "DR-PAR-1", max_concurrent_runs: 2, humidity_limit_pct: 10.0 }
              as: PlantManager
              captures: { dr_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T09:00:00Z", batch_volume_ml: 5000 }
              as: BatchOperator
              captures: { bat_id: $.data.id, lot_id: $.data.production_lot_id }
            - call: "POST /api/batches/${bat_id}/complete-mix"
              payload: {}
              as: BatchOperator
            - call: "POST /api/packaging-runs"
              payload: { batch_id: "${bat_id}", pack_format: "CARTRIDGE", unit_volume_ml: 310, planned_units: 3, planned_start_at: "2026-05-01T08:10:00Z", planned_end_at: "2026-05-01T09:30:00Z", dry_room_id: "${dr_id}" }
              as: BatchOperator
              captures: { run_id: $.data.id }
            - call: "POST /api/packaging-runs/${run_id}/complete"
              payload: {}
              as: BatchOperator
            - call: "POST /api/production-lots/${lot_id}/cure-tests"
              payload: { method: "FULL", specimens: [13.0, 12.5, 12.4, 12.3, 12.6] }
              as: QATechnician
              as_user_id: "tech-1"
              captures: { t1: $.data.id }
            - call: "POST /api/cure-tests/${t1}/accept"
              payload: {}
              as: QAManager
              as_user_id: "qm-1"
            - call: "POST /api/production-lots/${lot_id}/release"
              payload: {}
              as: QAManager
              as_user_id: "qm-1"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/packaging-runs/${run_id}/exposure-events"
              payload: { exposure_minutes: 45, occurred_at: "2026-05-01T08:45:00Z", note: "humidity log breach" }
              as: BatchOperator
          trigger:
            - call: "POST /api/packaging-runs/${run_id}/hold-release"
              payload: { outcome: "RELEASE" }
              as: QAManager
              as_user_id: "qm-1"
          assert:
            - "after the exposure event: ProductionLot.${lot_id}.qa_status == RELEASED AND hold_status == QUARANTINE_HOLD AND units_quarantined == 3 (qa dimension untouched by the hold cascade)"
            - "after hold-release RELEASE: PackagingRun.${run_id}.status == SEALED (held_from restored)"
            - "after hold-release: ProductionLot.${lot_id}.hold_status == CLEAR AND units_quarantined == 0 AND qa_status == RELEASED"

      - name: formulation_request_cycle_then_approve_branch
        grounds:
          - state_machines.FormulationRequest.TECH_REVIEW_to_NEEDS_INFO
          - state_machines.FormulationRequest.NEEDS_INFO_to_TECH_REVIEW
          - state_machines.FormulationRequest.TECH_REVIEW_to_APPROVED
          - state_machines.FormulationRequest.IN_DEVELOPMENT_to_CONVERTED
        distinguishing_aspect: |
          Cycle + branch shape on FormulationRequest (different entity than
          ProductionLot): the TECH_REVIEW -> NEEDS_INFO -> TECH_REVIEW loop is
          traversed twice before the APPROVED branch is taken, then the pipeline
          runs APPROVED -> IN_DEVELOPMENT -> CONVERTED, minting a new DRAFT
          Formulation — divergent side-effect sets per branch (DECLINED mints
          nothing).
        test_recipe:
          setup:
