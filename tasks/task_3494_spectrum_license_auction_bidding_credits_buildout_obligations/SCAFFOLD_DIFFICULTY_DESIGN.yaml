            - call: "POST /spectrum-auctions/applicants/${t2_id}/review"
              payload: { action: "START_REVIEW" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/applicants/${t2_id}/review"
              payload: { action: "QUALIFY" }
              as: AuctionAdmin
            - *c_clock_quiet
            - *c_begin_quiet
            - *c_start_clock
            - *c_get_rounds
            - *c_bid_rural_a_y
            - *c_close_r1
            - call: "POST /spectrum-auctions/auctions/${auction_id}/assignment-bids"
              payload: { area_code: "PEA002", category: "CATEGORY_A", amount_cents: 0 }
              as: Bidder
              as_user_id: "${r_id}"
            - *c_complete
            - call: "GET /spectrum-auctions/licenses"
              payload: { holder_applicant_id: "${r_id}" }
              as: AuctionAdmin
              captures: { lic_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/licenses/${lic_id}/settlement-payments"
              payload: { amount_cents: 212500000 }
              as: Bidder
              as_user_id: "${r_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2031-09-29T00:00:00Z" }
              as: AuctionAdmin
          trigger:
            - call: "POST /spectrum-auctions/licenses/${lic_id}/transfer-applications"
              payload: { transfer_type: "FULL_ASSIGNMENT", transferee_applicant_id: "${t2_id}" }
              as: Bidder
              as_user_id: "${r_id}"
              captures: { ta1_id: "$.data.id", ta1_uje: "$.data.unjust_enrichment_cents" }
            - call: "POST /spectrum-auctions/transfer-applications/${ta1_id}/withdraw"
              payload: {}
