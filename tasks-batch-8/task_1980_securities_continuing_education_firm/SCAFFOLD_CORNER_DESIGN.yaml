            - { call: "POST /representatives", payload: { crd_number: "CRD-C29B", full_name: "Corner TwentyNine B", email: "c29b@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rb: "$.data.id" } }
            - { call: "POST /contents", payload: { code: "OWN-1", title: "Ownership One", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /enrollments", payload: { rep_id: "${ra}", content_id: "${c_id}" }, as: TrainingAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /enrollments/${e_id}/start", payload: {}, as: RegisteredRep, as_user_id: "${ra}" }
          trigger:
            - { call: "POST /enrollments/${e_id}/complete", payload: { score: 90 }, as: RegisteredRep, as_user_id: "${rb}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_OWNERSHIP_REQUIRED (${err}); http 403; enrollment remains IN_PROGRESS"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: c_list_pagination_envelope
        claim_type: listing
        grounds:
          - "response_envelope"
          - 'endpoints.GET /contents'
        distinguishing_aspect: "Pagination fields limit/offset/total_count/has_more with defaults limit=10: three contents paginate 2 + 1 with correct has_more flags."
        test_recipe:
          setup: ["three contents created"]
          setup_api_calls:
            - { call: "POST /contents", payload: { code: "PG-1", title: "Page One", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents", payload: { code: "PG-2", title: "Page Two", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents", payload: { code: "PG-3", title: "Page Three", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1" }
          trigger:
            - { call: "GET /contents?limit=2&offset=0", payload: {}, as: Auditor }
            - { call: "GET /contents?limit=2&offset=2", payload: {}, as: Auditor }
          assert:
            - "page 1: response_type == array, data length == 2, total_count == 3, has_more == true"
            - "page 2: data length == 1, total_count == 3, has_more == false"

      - name: c_filtered_list_reverse_reachability
        claim_type: standard_crud
        grounds:
          - 'endpoints.GET /enrollments'
          - "entities.Enrollment.fields.rep_id"
        distinguishing_aspect: "Filtered-list reverse reachability: GET /enrollments?rep_id= returns exactly that rep's enrollments (FK reverse lookup from Representative)."
        test_recipe:
          setup: ["reps A and B; two approved contents; A enrolled in both, B enrolled in one"]
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-C31A", full_name: "Corner ThirtyOne A", email: "c31a@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { ra: "$.data.id" } }
            - { call: "POST /representatives", payload: { crd_number: "CRD-C31B", full_name: "Corner ThirtyOne B", email: "c31b@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rb: "$.data.id" } }
            - { call: "POST /contents", payload: { code: "FLT-1", title: "Filter One", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c1: "$.data.id" } }
            - { call: "POST /contents/${c1}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c1}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /contents", payload: { code: "FLT-2", title: "Filter Two", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c2: "$.data.id" } }
            - { call: "POST /contents/${c2}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c2}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /enrollments", payload: { rep_id: "${ra}", content_id: "${c1}" }, as: TrainingAdmin }
            - { call: "POST /enrollments", payload: { rep_id: "${ra}", content_id: "${c2}" }, as: TrainingAdmin }
            - { call: "POST /enrollments", payload: { rep_id: "${rb}", content_id: "${c1}" }, as: TrainingAdmin }
          trigger:
            - { call: "GET /enrollments?rep_id=${ra}", payload: {}, as: TrainingAdmin, captures: { first_rep: "$.data[0].rep_id" } }
          assert:
            - "GET /enrollments?rep_id=${ra} returns exactly 2 rows, every row's rep_id == ${ra} (${first_rep} on first row)"

      - name: c_error_envelope_shape
        claim_type: error_triggerable
        grounds:
          - "response_envelope"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Error responses carry the fixed envelope: response_type == error with data.error_id and data.message both present."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /contents/00000000-0000-0000-0000-000000000000", payload: {}, as: Auditor, captures: { err: "$.data.error_id", msg: "$.data.message" } }
          assert:
            - "response_type == error; data.error_id == ERR_NOT_FOUND (${err}); data.message present and non-empty (${msg})"

  # ===========================================================================
  - section: errors
    instances:
      - name: c_launch_with_unapproved_content_returns_409
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_PRODUCT_TRAINING_CONTENT_NOT_APPROVED]"
          - "state_machines.ProductOffering.PROPOSED_to_LAUNCHED"
        distinguishing_aspect: "ERR_PRODUCT_TRAINING_CONTENT_NOT_APPROVED fires when launching a product whose required training content is not APPROVED (here only PENDING_APPROVAL)."
        test_recipe:
          setup: ["PRODUCT content submitted but not approved; product registered against it"]
          setup_api_calls:
            - { call: "POST /contents", payload: { code: "PR-UNAPPR", title: "Unapproved Product Course", ce_category: PRODUCT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /products", payload: { product_code: "PUNAPPR", name: "Unapproved Product", required_training_content_id: "${c_id}" }, as: ComplianceOfficer, captures: { prod_id: "$.data.id" } }
          trigger:
