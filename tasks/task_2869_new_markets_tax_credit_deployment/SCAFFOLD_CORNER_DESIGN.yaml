            - "achieved_fte == 18, compliance_pct == 72.00 (18/25), local_hire_pct == 60.00 (12/20), classification == \"SHORTFALL\" — the local-hire target is met but the FTE shortfall alone decides it"
            - "resulting_status == \"BREACHED\" and CommunityBenefitsAgreement.${cba_id}.status == \"BREACHED\" with breached_at == \"2027-09-01T00:00:00.000Z\""
            - "AllocationAward.${award_id}.cba_breach_count == 1 and compliance_posture == \"RESTRICTED\""
            - "The follow-up deployment returns HTTP 422 with error_id == \"ERR_CBA_BREACHED\", not ERR_AWARD_POSTURE_RESTRICTED — RESTRICTED blocks new QEI issuance, not QLICI deployment"
            - "QALICB.${qalicb_id}.eligibility_status is still \"CERTIFIED\" — the agreement breached, the business did not"
            - "QEI.${qei_id}.uninvested_cash_cents == 65000000, unchanged by the refused deployment"

      - name: issuing_a_qei_before_the_agreement_is_signed_returns_award_not_active
        claim_type: satisfaction_pass
        grounds:
          - validations[priority=13]
          - errors[ERR_AWARD_NOT_ACTIVE]
          - state_machines.AllocationAward.lifecycle_status
        distinguishing_aspect: "An ANNOUNCED award has full authority and a funded fund behind it, yet issuance is refused with 409 ERR_AWARD_NOT_ACTIVE. The OCC check at priority 10 runs BEFORE this rung at 13, so the request must carry the award's current version to reach the lifecycle error at all — and because the refusal does not bump the version, the same value still works after signing."
        test_recipe:
          setup:
            - "One ANNOUNCED (unsigned) award of 5,000,000,000 cents and one FUNDED fund with 100,000,000 cents available."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
              payload: { legal_name: "Gulf Coast CDE", certification_number: "CDE-2869-120", service_area_scope: "MULTI_STATE" }
              as: CertifyingAgency
              captures: { cde_id: $.data.id }
            - call: "POST /nmtc/allocation-awards"
              payload: { cde_id: "${cde_id}", award_year: 2026, allocation_amount_cents: 5000000000, service_area_state_codes: ["MS"], min_severe_distress_share_pct: 60.00, substantially_all_method: "DIRECT_TRACING" }
              as: CertifyingAgency
              captures: { award_id: $.data.id, award_v_announced: $.data.version }
            - call: "POST /nmtc/investment-funds"
              payload: { legal_name: "NMTC Fund I LLC", equity_contribution_cents: 65000000, leverage_lender_name: "Delta Bank", leverage_loan_principal_cents: 35000000, leverage_loan_rate_bps: 450 }
              as: TaxCreditInvestor
              as_user_id: "investor-delta"
              captures: { fund_id: $.data.id }
            - call: "POST /nmtc/investment-funds/${fund_id}/closing"
              payload: { equity_received_cents: 65000000, leverage_received_cents: 35000000 }
              as: TaxCreditInvestor
              as_user_id: "investor-delta"
          trigger:
            - call: "POST /nmtc/qeis"
              payload: { allocation_award_id: "${award_id}", investment_fund_id: "${fund_id}", qei_amount_cents: 100000000, expected_allocation_award_version: "${award_v_announced}" }
              as: CDESponsor
              as_user_id: "${cde_id}"
            - call: "POST /nmtc/allocation-awards/${award_id}/allocation-agreement"
              payload: { signatory_name: "A. Rivers" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { award_v_signed: $.data.version }
            - call: "POST /nmtc/qeis"
              payload: { allocation_award_id: "${award_id}", investment_fund_id: "${fund_id}", qei_amount_cents: 100000000, expected_allocation_award_version: "${award_v_signed}" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { qei_id: $.data.id }
          assert:
            - "VIOLATION — the first issuance returns HTTP 409 with error_id == \"ERR_AWARD_NOT_ACTIVE\"; ${award_v_announced} was the award's current version, so the OCC rung at priority 10 passed and the lifecycle rung at 13 is what fired"
            - "AllocationAward.${award_id}.issued_qei_count == 0 and remaining_authority_cents == 5000000000 after the refusal, and version is still ${award_v_announced} — a refused write never bumps the version"
            - "SATISFACTION — after signing (version now ${award_v_signed}) the same issuance body carrying the new version returns 201 with QEI.${qei_id}.deployment_status == \"ISSUED\""
            - "AllocationAward.${award_id}.lifecycle_status == \"ACTIVE\", issued_qei_count == 1, remaining_authority_cents == 4900000000"

      - name: skipping_a_compliance_year_and_re_testing_a_tested_year_return_different_errors
        claim_type: cascading_validation
        grounds:
          - validations[priority=17]
          - validations[priority=18]
          - errors[ERR_TEST_SEQUENCE_INVALID]
          - errors[ERR_TEST_WINDOW_OVERLAP]
        distinguishing_aspect: "The two annual-test guards split the space deliberately: priority 17 rejects only a year LATER than the next one (and any year outside 1..7), while an ALREADY-TESTED year is let through 17 on purpose so the window-overlap check at 18 owns it. So year 2 first returns ERR_TEST_SEQUENCE_INVALID, and year 1 twice returns ERR_TEST_WINDOW_OVERLAP."
