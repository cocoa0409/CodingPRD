scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: accreditation_class_avg_vs_unit_specific_same_nameplate
        grounds:
          - calculations.accreditation_ucap
          - entities.Accreditation.fields.method
          - entities.Accreditation.fields.accreditation_factor
          - entities.CapacityResource.fields.accredited_ucap_mw
        distinguishing_aspect: |
          Same resource (nameplate 100 MW, factor input 0.85) accredited twice
          under different methods yields different UCAP: CLASS_AVG pins the
          factor flat at 0.8500 (ucap 85.000) while UNIT_SPECIFIC derates by
          relative outage performance and sample confidence to 0.4026
          (ucap 40.260) — a dual-variant split on the Accreditation entity
          domain.
        test_recipe:
          setup:
            - "Delivery year DY in DRAFT with RTO zone Z (import_limit null)"
            - "LoadForecast revision 1 in DRAFT with pool_wide_avg_eford=0.05 (read by the UNIT_SPECIFIC variant)"
            - "Owner O (credit 900) with two GEN resources R1 and R2, both nameplate 100.0 MW in zone Z"
          setup_api_calls:
            - call: "POST /capacity-market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years"
              payload: { delivery_year_label: "2029/2030", planning_period_start: "2029-06-01T00:00:00Z", planning_period_end: "2030-05-31T23:59:59Z" }
              as: MarketAdmin
              captures: { dy_id: "$.data.id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/zones"
              payload: { zone_code: "RTO" }
              as: MarketAdmin
              captures: { zone_id: "$.data.id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/forecasts"
              payload: { rto_peak_load_mw: 150000.0, reserve_margin_pct: 0.161, pool_wide_avg_eford: 0.05, zonal_peak_shares: { RTO: 1.0 } }
              as: MarketAdmin
            - call: "POST /capacity-market/owners"
              payload: { legal_name: "Alpha GenCo", contact_email: "alpha@x.com", credit_score: 900 }
              as: MarketAdmin
              captures: { owner_id: "$.data.id" }
            - call: "POST /capacity-market/resources"
              payload: { owner_id: "${owner_id}", zone_id: "${zone_id}", resource_type: "GEN", nameplate_mw: 100.0 }
              as: ResourceOwner
              as_user_id: "${owner_id}"
              captures: { r1_id: "$.data.id" }
            - call: "POST /capacity-market/resources"
              payload: { owner_id: "${owner_id}", zone_id: "${zone_id}", resource_type: "GEN", nameplate_mw: 100.0 }
              as: ResourceOwner
              as_user_id: "${owner_id}"
              captures: { r2_id: "$.data.id" }
            - call: "POST /capacity-market/accreditations"
              payload: { resource_id: "${r1_id}", delivery_year_id: "${dy_id}", method: "CLASS_AVG", class_avg_factor: 0.85, forced_outage_rate: 0.10, scarcity_hours_sampled: 50 }
              as: ResourceOwner
              as_user_id: "${owner_id}"
              captures: { acc1_id: "$.data.id" }
            - call: "POST /capacity-market/accreditations"
              payload: { resource_id: "${r2_id}", delivery_year_id: "${dy_id}", method: "UNIT_SPECIFIC", unit_elcc_factor: 0.85, forced_outage_rate: 0.10, scarcity_hours_sampled: 50 }
              as: ResourceOwner
              as_user_id: "${owner_id}"
              captures: { acc2_id: "$.data.id" }
          trigger:
            - call: "POST /capacity-market/accreditations/${acc1_id}/approve"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/accreditations/${acc2_id}/approve"
              payload: {}
              as: MarketAdmin
          assert:
            - "Accreditation.${acc1_id}.accreditation_factor == 0.85"
            - "Accreditation.${acc1_id}.ucap_mw == 85.0"
            - "Accreditation.${acc2_id}.accreditation_factor == 0.4026"
            - "Accreditation.${acc2_id}.ucap_mw == 40.26"
            - "CapacityResource.${r1_id}.accredited_ucap_mw == 85.0"
            - "CapacityResource.${r2_id}.accredited_ucap_mw == 40.26"
            - "Accreditation.${acc1_id}.ucap_mw != Accreditation.${acc2_id}.ucap_mw"
      - name: performance_ratio_no_obligation_vs_bonused_overperformance
        grounds:
          - calculations.performance_ratio_calc
          - calculations.nonperformance_charge
          - entities.PerformanceAssessment.fields.performance_ratio
          - entities.PerformanceAssessment.fields.charge_or_credit_dollars
        distinguishing_aspect: |
          Two PerformanceAssessment variants on the same event: expected_mw==0
          short-circuits to ratio 1.0000 with zero charge, while expected_mw>0
          with over-delivery caps the bonus at 0.5*expected_mw — a dual-variant
          split on the PerformanceAssessment domain (distinct from the
          Accreditation domain of the sibling instance).
        test_recipe:
          setup:
            - "Delivery year settled through clearing: DY CLEARED with RTO zone price 70.00 via two cleared resources E (commitment CE, 10 MW) and F (commitment CF, 10 MW)"
            - "EmergencyEvent EV (EMERGENCY_ACTION, 2029-06-10T13:00:00Z to 2029-06-10T15:00:00Z, H=2) in ASSESSING with DRAFT assessments AE (commitment CE) and AF (commitment CF)"
          setup_api_calls:
            - call: "POST /capacity-market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years"
              payload: { delivery_year_label: "2029/2030", planning_period_start: "2029-06-01T00:00:00Z", planning_period_end: "2030-05-31T23:59:59Z" }
              as: MarketAdmin
              captures: { dy_id: "$.data.id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/zones"
              payload: { zone_code: "RTO" }
              as: MarketAdmin
              captures: { zone_id: "$.data.id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/forecasts"
              payload: { rto_peak_load_mw: 10.0, reserve_margin_pct: 0.25, pool_wide_avg_eford: 0.04, zonal_peak_shares: { RTO: 1.0 } }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years/${dy_id}/lock-forecast"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/owners"
              payload: { legal_name: "Alpha GenCo", contact_email: "alpha@x.com", credit_score: 900 }
              as: MarketAdmin
              captures: { owner_id: "$.data.id" }
            - call: "POST /capacity-market/resources"
              payload: { owner_id: "${owner_id}", zone_id: "${zone_id}", resource_type: "GEN", nameplate_mw: 100.0 }
              as: ResourceOwner
              as_user_id: "${owner_id}"
              captures: { r1_id: "$.data.id" }
            - call: "POST /capacity-market/accreditations"
              payload: { resource_id: "${r1_id}", delivery_year_id: "${dy_id}", method: "CLASS_AVG", class_avg_factor: 0.85, forced_outage_rate: 0.10, scarcity_hours_sampled: 100 }
              as: ResourceOwner
              as_user_id: "${owner_id}"
              captures: { acc1_id: "$.data.id" }
            - call: "POST /capacity-market/accreditations/${acc1_id}/approve"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/resources"
              payload: { owner_id: "${owner_id}", zone_id: "${zone_id}", resource_type: "GEN", nameplate_mw: 100.0 }
              as: ResourceOwner
              as_user_id: "${owner_id}"
              captures: { r2_id: "$.data.id" }
            - call: "POST /capacity-market/accreditations"
              payload: { resource_id: "${r2_id}", delivery_year_id: "${dy_id}", method: "CLASS_AVG", class_avg_factor: 0.85, forced_outage_rate: 0.10, scarcity_hours_sampled: 100 }
              as: ResourceOwner
              as_user_id: "${owner_id}"
              captures: { acc2_id: "$.data.id" }
            - call: "POST /capacity-market/accreditations/${acc2_id}/approve"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/auction-runs"
              payload: { delivery_year_id: "${dy_id}", run_label: "BRA" }
              as: MarketAdmin
              captures: { run_id: "$.data.id" }
            - call: "POST /capacity-market/auction-runs/${run_id}/open"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/offers"
              payload: { resource_id: "${r1_id}", auction_run_id: "${run_id}", offer_mw: 10.0, offer_price_per_mw_day: 250.0 }
              as: ResourceOwner
              as_user_id: "${owner_id}"
              captures: { off1_id: "$.data.id" }
            - call: "POST /capacity-market/offers"
              payload: { resource_id: "${r2_id}", auction_run_id: "${run_id}", offer_mw: 10.0, offer_price_per_mw_day: 75.0 }
              as: ResourceOwner
              as_user_id: "${owner_id}"
              captures: { off2_id: "$.data.id" }
            - call: "POST /capacity-market/auction-runs/${run_id}/seal"
              payload: {}
              as: MarketAdmin
            - call: "GET /capacity-market/offers/${off1_id}/mitigation-review"
              payload: {}
              as: MarketAdmin
              captures: { rev1_id: "$.data[0].id" }
            - call: "POST /capacity-market/mitigation-reviews/${rev1_id}/resolve"
              payload: { outcome: "PASS", reviewer_note: "competitive offer" }
              as: MarketAdmin
            - call: "GET /capacity-market/offers/${off2_id}/mitigation-review"
              payload: {}
              as: MarketAdmin
              captures: { rev2_id: "$.data[0].id" }
            - call: "POST /capacity-market/mitigation-reviews/${rev2_id}/resolve"
              payload: { outcome: "PASS", reviewer_note: "competitive offer" }
              as: MarketAdmin
            - call: "POST /capacity-market/auction-runs/${run_id}/clear"
              payload: {}
              as: MarketAdmin
            - call: "GET /capacity-market/commitments?resource_id=${r1_id}"
              payload: {}
              as: MarketAdmin
              captures: { ce_id: "$.data[0].id" }
            - call: "GET /capacity-market/commitments?resource_id=${r2_id}"
              payload: {}
              as: MarketAdmin
              captures: { cf_id: "$.data[0].id" }
            - call: "POST /capacity-market/emergency-events"
              payload: { delivery_year_id: "${dy_id}", event_start: "2029-06-10T13:00:00Z", event_end: "2029-06-10T15:00:00Z", event_type: "EMERGENCY_ACTION" }
              as: MarketAdmin
              captures: { ev_id: "$.data.id" }
            - call: "POST /capacity-market/emergency-events/${ev_id}/begin-assessment"
              payload: {}
              as: MarketAdmin
            - call: "GET /capacity-market/emergency-events/${ev_id}/assessments"
              payload: {}
              as: MarketAdmin
              captures: { ae_id: "$.data[0].id", af_id: "$.data[1].id" }
            - call: "POST /capacity-market/assessments/${ae_id}/record-actual"
              payload: { expected_mw: 0.0, actual_mw: 0.0 }
              as: MarketAdmin
            - call: "POST /capacity-market/assessments/${af_id}/record-actual"
              payload: { expected_mw: 10.0, actual_mw: 12.0 }
              as: MarketAdmin
          trigger:
            - call: "POST /capacity-market/emergency-events/${ev_id}/finalize-assessments"
              payload: {}
              as: MarketAdmin
          assert:
            - "PerformanceAssessment.${ae_id}.performance_ratio == 1.0"
            - "PerformanceAssessment.${ae_id}.charge_or_credit_dollars == 0.0"
            - "PerformanceAssessment.${af_id}.performance_ratio == 1.2"
            - "PerformanceAssessment.${af_id}.charge_or_credit_dollars == 11.67"
            - "SettlementEntry for commitment ${ce_id} on event ${ev_id} has amount_dollars == 0.0"
            - "SettlementEntry BONUS for commitment ${cf_id} on event ${ev_id} has amount_dollars == 11.67"
  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: offer_cap_nonlinear_max_min_band
        grounds:
          - calculations.seller_offer_cap
          - entities.AuctionOffer.fields.mitigated_cap_per_mw_day
          - entities.ResourceOwnerEntity.fields.credit_score
        distinguishing_aspect: |
          Mode (a): nested non-linear composition — the cap is
          min(max(MITIGATION_FLOOR_FRACTION*NET_CONE, ACR_BASE + slope*(1000-credit)), NET_CONE),
          so credit_score 900 lands mid-band (cap 70.00) while credit_score 0
          still clamps inside the band (cap 160.00) and the floor only binds
          when ACR falls below 39.00.
        test_recipe:
          setup:
            - "DY FORECAST_LOCKED (peak 10, IRM 0.25, eford 0.04, requirement 12.000 MW), run OPEN"
            - "Owner O1 credit 900 with accredited resource R1 (85.000 UCAP); owner O2 credit 0 with accredited resource R2 (85.000 UCAP)"
          setup_api_calls:
            - call: "POST /capacity-market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years"
              payload: { delivery_year_label: "2029/2030", planning_period_start: "2029-06-01T00:00:00Z", planning_period_end: "2030-05-31T23:59:59Z" }
              as: MarketAdmin
              captures: { dy_id: "$.data.id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/zones"
              payload: { zone_code: "RTO" }
              as: MarketAdmin
              captures: { zone_id: "$.data.id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/forecasts"
              payload: { rto_peak_load_mw: 10.0, reserve_margin_pct: 0.25, pool_wide_avg_eford: 0.04, zonal_peak_shares: { RTO: 1.0 } }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years/${dy_id}/lock-forecast"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/owners"
              payload: { legal_name: "Alpha GenCo", contact_email: "alpha@x.com", credit_score: 900 }
              as: MarketAdmin
              captures: { o1_id: "$.data.id" }
            - call: "POST /capacity-market/owners"
              payload: { legal_name: "Beta GenCo", contact_email: "beta@x.com", credit_score: 0 }
              as: MarketAdmin
              captures: { o2_id: "$.data.id" }
            - call: "POST /capacity-market/resources"
              payload: { owner_id: "${o1_id}", zone_id: "${zone_id}", resource_type: "GEN", nameplate_mw: 100.0 }
              as: ResourceOwner
              as_user_id: "${o1_id}"
              captures: { r1_id: "$.data.id" }
            - call: "POST /capacity-market/accreditations"
              payload: { resource_id: "${r1_id}", delivery_year_id: "${dy_id}", method: "CLASS_AVG", class_avg_factor: 0.85, forced_outage_rate: 0.10, scarcity_hours_sampled: 100 }
              as: ResourceOwner
              as_user_id: "${o1_id}"
              captures: { acc1_id: "$.data.id" }
            - call: "POST /capacity-market/accreditations/${acc1_id}/approve"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/resources"
              payload: { owner_id: "${o2_id}", zone_id: "${zone_id}", resource_type: "GEN", nameplate_mw: 100.0 }
              as: ResourceOwner
              as_user_id: "${o2_id}"
              captures: { r2_id: "$.data.id" }
            - call: "POST /capacity-market/accreditations"
              payload: { resource_id: "${r2_id}", delivery_year_id: "${dy_id}", method: "CLASS_AVG", class_avg_factor: 0.85, forced_outage_rate: 0.10, scarcity_hours_sampled: 100 }
              as: ResourceOwner
              as_user_id: "${o2_id}"
              captures: { acc2_id: "$.data.id" }
            - call: "POST /capacity-market/accreditations/${acc2_id}/approve"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/auction-runs"
              payload: { delivery_year_id: "${dy_id}", run_label: "BRA" }
              as: MarketAdmin
              captures: { run_id: "$.data.id" }
            - call: "POST /capacity-market/auction-runs/${run_id}/open"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/offers"
              payload: { resource_id: "${r1_id}", auction_run_id: "${run_id}", offer_mw: 10.0, offer_price_per_mw_day: 200.0 }
              as: ResourceOwner
              as_user_id: "${o1_id}"
              captures: { off1_id: "$.data.id" }
            - call: "POST /capacity-market/offers"
              payload: { resource_id: "${r2_id}", auction_run_id: "${run_id}", offer_mw: 10.0, offer_price_per_mw_day: 200.0 }
              as: ResourceOwner
              as_user_id: "${o2_id}"
              captures: { off2_id: "$.data.id" }
          trigger:
            - call: "POST /capacity-market/auction-runs/${run_id}/seal"
              payload: {}
              as: MarketAdmin
          assert:
            - "AuctionOffer.${off1_id}.mitigated_cap_per_mw_day == 70.0"
            - "AuctionOffer.${off2_id}.mitigated_cap_per_mw_day == 160.0"
            - "AuctionOffer.${off1_id}.status == SEALED"
            - "AuctionOffer.${off2_id}.status == SEALED"
      - name: nonperformance_charge_nested_rounding_order
        grounds:
          - calculations.nonperformance_charge
          - entities.PerformanceAssessment.fields.charge_or_credit_dollars
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the tier multiplier is
          applied to the UNROUNDED base rate product (shortfall_mw * (P/24) * H * mult)
          and only the final dollar amount is rounded to 2 decimals; rounding the
          MW-hour base to cents before the multiplier (13.33 * 2.0 = 26.66) would
          diverge from the pinned order's 26.67, which the scaffold forbids.
        test_recipe:
          setup:
            - "DY CLEARED; commitment C10 for resource R1 at clearing price 100.00, committed 10 MW"
            - "EmergencyEvent EV 2029-06-10T13:00:00Z..2029-06-10T17:00:00Z (H=4) in ASSESSING with DRAFT assessment A10 (expected 10, actual 8 recorded)"
          setup_api_calls:
            - call: "POST /capacity-market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years"
              payload: { delivery_year_label: "2029/2030", planning_period_start: "2029-06-01T00:00:00Z", planning_period_end: "2030-05-31T23:59:59Z" }
              as: MarketAdmin
              captures: { dy_id: "$.data.id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/zones"
              payload: { zone_code: "RTO" }
              as: MarketAdmin
              captures: { zone_id: "$.data.id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/forecasts"
              payload: { rto_peak_load_mw: 10.0, reserve_margin_pct: 0.25, pool_wide_avg_eford: 0.04, zonal_peak_shares: { RTO: 1.0 } }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years/${dy_id}/lock-forecast"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/owners"
              payload: { legal_name: "Alpha GenCo", contact_email: "alpha@x.com", credit_score: 900 }
              as: MarketAdmin
              captures: { o1_id: "$.data.id" }
            - call: "POST /capacity-market/resources"
              payload: { owner_id: "${o1_id}", zone_id: "${zone_id}", resource_type: "GEN", nameplate_mw: 100.0 }
              as: ResourceOwner
              as_user_id: "${o1_id}"
              captures: { r1_id: "$.data.id" }
            - call: "POST /capacity-market/accreditations"
              payload: { resource_id: "${r1_id}", delivery_year_id: "${dy_id}", method: "CLASS_AVG", class_avg_factor: 0.85, forced_outage_rate: 0.10, scarcity_hours_sampled: 100 }
              as: ResourceOwner
              as_user_id: "${o1_id}"
              captures: { acc1_id: "$.data.id" }
            - call: "POST /capacity-market/accreditations/${acc1_id}/approve"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/auction-runs"
              payload: { delivery_year_id: "${dy_id}", run_label: "BRA" }
              as: MarketAdmin
              captures: { run_id: "$.data.id" }
            - call: "POST /capacity-market/auction-runs/${run_id}/open"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/offers"
              payload: { resource_id: "${r1_id}", auction_run_id: "${run_id}", offer_mw: 10.0, offer_price_per_mw_day: 100.0 }
              as: ResourceOwner
              as_user_id: "${o1_id}"
              captures: { off1_id: "$.data.id" }
            - call: "POST /capacity-market/auction-runs/${run_id}/seal"
              payload: {}
              as: MarketAdmin
            - call: "GET /capacity-market/offers/${off1_id}/mitigation-review"
              payload: {}
              as: MarketAdmin
              captures: { rev1_id: "$.data[0].id" }
            - call: "POST /capacity-market/mitigation-reviews/${rev1_id}/resolve"
              payload: { outcome: "PASS" }
              as: MarketAdmin
            - call: "POST /capacity-market/auction-runs/${run_id}/clear"
              payload: {}
              as: MarketAdmin
            - call: "GET /capacity-market/commitments?resource_id=${r1_id}"
              payload: {}
              as: MarketAdmin
              captures: { c_id: "$.data[0].id" }
            - call: "POST /capacity-market/emergency-events"
              payload: { delivery_year_id: "${dy_id}", event_start: "2029-06-10T13:00:00Z", event_end: "2029-06-10T17:00:00Z", event_type: "EMERGENCY_ACTION" }
              as: MarketAdmin
              captures: { ev_id: "$.data.id" }
            - call: "POST /capacity-market/emergency-events/${ev_id}/begin-assessment"
              payload: {}
              as: MarketAdmin
            - call: "GET /capacity-market/emergency-events/${ev_id}/assessments"
              payload: {}
              as: MarketAdmin
              captures: { a_id: "$.data[0].id" }
            - call: "POST /capacity-market/assessments/${a_id}/record-actual"
              payload: { expected_mw: 10.0, actual_mw: 8.0 }
              as: MarketAdmin
          trigger:
            - call: "POST /capacity-market/emergency-events/${ev_id}/finalize-assessments"
              payload: {}
              as: MarketAdmin
          assert:
            - "PerformanceAssessment.${a_id}.performance_ratio == 0.8"
            - "PerformanceAssessment.${a_id}.charge_or_credit_dollars == -33.33"
            - "SettlementEntry CHARGE for commitment ${c_id} on event ${ev_id} has amount_dollars == -33.33"
      - name: auction_clearing_evaluation_order_requirement_before_price
        grounds:
          - calculations.auction_clearing
          - entities.Zone.fields.clearing_price_per_mw_day
          - entities.AuctionOffer.fields.cleared_mw
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order —
          zonal MW cleared determines the marginal offer, the marginal offer's
          effective price sets the zone price, and a nested LDA's price then
          depends on its parent's price (max-uplift); MW quantities are rounded
          to 3 decimals BEFORE the marginal is chosen, so the price never feeds
          back into quantity.
        test_recipe:
          setup:
            - "DY FORECAST_LOCKED with RTO zone (requirement 100.000) and nested LDA zone L (requirement 40.000, import_limit 25)"
            - "Four accredited resources: RA in L offering 30 @ 50.00, RB in L offering 20 @ 80.00, RC in RTO offering 50 @ 60.00, RD in RTO offering 60 @ 90.00 — all mitigation PASS"
            - "Run SEALED with the four offers"
          setup_api_calls:
            - call: "POST /capacity-market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketAdmin
