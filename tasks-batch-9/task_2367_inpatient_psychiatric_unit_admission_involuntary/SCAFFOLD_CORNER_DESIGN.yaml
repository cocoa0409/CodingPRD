        claim_type: valid_transition
        excluded_because:
          difficulty_instance: admission_parallel_axes_evolve_independently
          rationale: "The parallel state_machine_shape claim - independent legal_status and placement_status axes advancing without disturbing each other, and the combined state being correct after each move - is exactly what that difficulty instance drives through certify, place, convert-to-voluntary and discharge-plan."

      - name: cyclic_state_machine_loop_bound
        claim_type: valid_transition
        excluded_because:
          difficulty_instance: petition_continuance_cycle_returns_to_hearing_scheduled
          rationale: "The cyclic shape claim - the entity loops back into a state it already occupied and the loop is bounded by a termination condition - is covered there: HoldPetition occupies HEARING_SCHEDULED three times and the third continuance is refused ERR_CONTINUANCE_LIMIT_REACHED."

      - name: discharge_cascade_side_effect_chain
        claim_type: side_effect
        excluded_because:
          difficulty_instance: discharge_frees_bed_reopens_posture_and_promotes_queued_admission
          rationale: "The four-link cascade on POST /admissions/{id}/discharge (admission DISCHARGED -> bed AVAILABLE -> unit counters and posture re-derived -> queued admission promoted) is verified link by link there, including the version increments at each level."

