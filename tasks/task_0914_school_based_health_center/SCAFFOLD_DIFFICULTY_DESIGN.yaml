# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rule_ids x 2 instances = 18 instances. Every `grounds:` entry
# resolves into SCAFFOLD.yaml §1.1-§1.7; every `setup_api_calls` chain drives
# an empty database into the described precondition using only §1.5 endpoints.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: charge_responsibility_provisional_gross_first_vs_final_net_of_payer
        grounds:
          - calculations.charge_patient_responsibility
          - entities.BillableCharge.fields.provisional_patient_responsibility_cents
          - entities.BillableCharge.fields.final_patient_responsibility_cents
          - state_machines.BillableCharge.CLAIM_SUBMITTED_to_PAID
          - entities.Visit.fields.patient_responsibility_total_cents
        distinguishing_aspect: |
          This dual-variant lives in the MONEY domain on BillableCharge: the same
          stored charge (gross 12000, PRIVATE_INSURANCE, TIER_C) yields
          provisional_patient_responsibility_cents 1000 under PROVISIONAL_GROSS_FIRST
          and final_patient_responsibility_cents 1600 under FINAL_NET_OF_PAYER, a
          divergence of exactly 600 cents caused by the base switching from the flat
          2500 copay to the 4000 residual left after the payer allowed 8000.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-04T09:00:00Z."
            - "One ACTIVE school, one MEDICAL clinician, one student with an ACTIVE 2025-2026 enrollment and an ACTIVE GENERAL_TREATMENT consent."
            - "Student financial profile: income 3200000 cents, household size 2, payer route PRIVATE_INSURANCE, which computes fpl_percent 151.66 and discount_tier TIER_C."
            - "One ACUTE visit completed, producing exactly one BillableCharge with gross_amount_cents 12000 in status PENDING, then submitted as a claim."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
            - call: "POST /sbhc/schools"
              payload: { name: "Lincoln High", site_code: "LHS", sponsor_hospital_name: "Mercy Sponsor Hospital", telehealth_concurrent_capacity: 1 }
              as: SbhcAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /sbhc/clinicians"
              payload: { full_name: "Dana Reyes NP", discipline: "MEDICAL", license_number: "NP-1001" }
              as: SbhcAdmin
              captures: { clin_med_id: "$.data.id" }
            - call: "POST /sbhc/students"
              payload: { first_name: "Ben", last_name: "Ortiz", date_of_birth: "2010-04-15" }
              as: Registrar
              captures: { stu_id: "$.data.id" }
            - call: "PATCH /sbhc/students/${stu_id}/financial-profile"
              payload: { household_income_annual_cents: 3200000, household_size: 2, payer_route: "PRIVATE_INSURANCE", insurance_member_id: "PI-778" }
              as: Registrar
              captures: { stu_v_fin: "$.data.version" }
            - call: "POST /sbhc/students/${stu_id}/guardians"
              payload: { full_name: "Rosa Ortiz", relationship: "MOTHER", contact_email: "rosa@example.org", is_primary: true }
              as: Registrar
              captures: { g1_id: "$.data.id" }
            - call: "POST /sbhc/students/${stu_id}/enrollments"
              payload: { school_id: "${school_id}", school_year: "2025-2026", expected_student_version: "${stu_v_fin}" }
              as: Registrar
              captures: { enr_id: "$.data.id" }
            - call: "POST /sbhc/enrollments/${enr_id}/activate"
              payload: {}
              as: Registrar
            - call: "GET /sbhc/students/${stu_id}"
              payload: {}
              as: Registrar
              captures: { stu_v_act: "$.data.version" }
            - call: "POST /sbhc/students/${stu_id}/consents"
              payload: { category: "GENERAL_TREATMENT", school_year: "2025-2026", granted_by: "GUARDIAN", granted_by_user_id: "${g1_id}", expected_student_version: "${stu_v_act}" }
              as: Registrar
              captures: { consent_gen_id: "$.data.id" }
            - call: "POST /sbhc/visits"
              payload: { student_id: "${stu_id}", school_id: "${school_id}", clinician_id: "${clin_med_id}", visit_type: "ACUTE", scheduled_start_at: "2026-05-04T10:00:00Z" }
              as: Clinician
              as_user_id: "${clin_med_id}"
              captures: { visit_id: "$.data.id" }
            - call: "POST /sbhc/visits/${visit_id}/start"
              payload: {}
              as: Clinician
              as_user_id: "${clin_med_id}"
            - call: "POST /sbhc/visits/${visit_id}/complete"
              payload: { disposition: "TREATED_RETURNED_TO_CLASS" }
              as: Clinician
              as_user_id: "${clin_med_id}"
            - call: "GET /sbhc/charges?visit_id=${visit_id}"
              payload: {}
              as: BillingSpecialist
              captures: { charge_id: "$.data[0].id", prov_amount: "$.data[0].provisional_patient_responsibility_cents" }
            - call: "POST /sbhc/charges/${charge_id}/submit-claim"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /sbhc/charges/${charge_id}/adjudicate"
              payload: { outcome: "PAID", payer_paid_amount_cents: 8000 }
              as: BillingSpecialist
              captures: { final_amount: "$.data.final_patient_responsibility_cents" }
          assert:
            - "Student.${stu_id}.fpl_percent == 151.66"
            - "Student.${stu_id}.discount_tier == TIER_C"
            - "BillableCharge.${charge_id}.gross_amount_cents == 12000"
            - "BillableCharge.${charge_id}.provisional_patient_responsibility_cents == 1000"
            - "BillableCharge.${charge_id}.final_patient_responsibility_cents == 1600"
            - "BillableCharge.${charge_id}.patient_responsibility_cents == 1600"
            - "BillableCharge.${charge_id}.floor_adjustment_cents == 0"
            - "BillableCharge.${charge_id}.status == PAID"
            - "Visit.${visit_id}.patient_responsibility_total_cents == 1600"
            - "Visit.${visit_id}.payer_billed_total_cents == 10400"
            - "Visit.${visit_id}.gross_charge_total_cents == 12000"
            - "Visit.${visit_id}.billing_status == CHARGES_POSTED"

      - name: clearance_validity_calendar_days_vs_school_year_capped
        grounds:
          - calculations.clearance_validity_window
          - entities.SportsPhysicalClearance.fields.unrestricted_valid_until
          - entities.SportsPhysicalClearance.fields.valid_until
          - state_machines.SportsPhysicalClearance.null_to_ACTIVE
        distinguishing_aspect: |
          This dual-variant lives in the TEMPORAL domain on SportsPhysicalClearance,
          a different entity domain from the money variant above: a CLEARED
          determination made on 2026-05-10 stores unrestricted_valid_until
          2027-05-10 under CALENDAR_DAYS but valid_until 2026-07-31 under
          SCHOOL_YEAR_CAPPED, because the 2025-2026 school year ends first.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-10T09:00:00Z."
            - "One ACTIVE school, one MEDICAL clinician, one student with an ACTIVE 2025-2026 enrollment and an ACTIVE GENERAL_TREATMENT consent."
            - "Student carries a MEDICAL immunization exemption, so immunization_compliance_status is COMPLIANT and the clearance gate passes."
            - "One SPORTS_PHYSICAL visit in clinical_status IN_PROGRESS."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: SbhcAdmin
            - call: "POST /sbhc/schools"
              payload: { name: "Lincoln High", site_code: "LHS", sponsor_hospital_name: "Mercy Sponsor Hospital", telehealth_concurrent_capacity: 1 }
              as: SbhcAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /sbhc/clinicians"
              payload: { full_name: "Dana Reyes NP", discipline: "MEDICAL", license_number: "NP-1001" }
              as: SbhcAdmin
              captures: { clin_med_id: "$.data.id" }
            - call: "POST /sbhc/students"
              payload: { first_name: "Ava", last_name: "Nguyen", date_of_birth: "2010-04-15" }
              as: Registrar
              captures: { stu_id: "$.data.id" }
            - call: "PATCH /sbhc/students/${stu_id}/financial-profile"
              payload: { household_income_annual_cents: 3000000, household_size: 4, payer_route: "SELF_PAY" }
              as: Registrar
              captures: { stu_v_fin: "$.data.version" }
            - call: "POST /sbhc/students/${stu_id}/guardians"
              payload: { full_name: "Mai Nguyen", relationship: "MOTHER", contact_email: "mai@example.org", is_primary: true }
              as: Registrar
              captures: { g1_id: "$.data.id" }
            - call: "POST /sbhc/students/${stu_id}/enrollments"
              payload: { school_id: "${school_id}", school_year: "2025-2026", expected_student_version: "${stu_v_fin}" }
              as: Registrar
              captures: { enr_id: "$.data.id" }
            - call: "POST /sbhc/enrollments/${enr_id}/activate"
              payload: {}
              as: Registrar
            - call: "GET /sbhc/students/${stu_id}"
              payload: {}
              as: Registrar
              captures: { stu_v_act: "$.data.version" }
            - call: "POST /sbhc/students/${stu_id}/consents"
              payload: { category: "GENERAL_TREATMENT", school_year: "2025-2026", granted_by: "GUARDIAN", granted_by_user_id: "${g1_id}", expected_student_version: "${stu_v_act}" }
              as: Registrar
              captures: { consent_gen_id: "$.data.id" }
            - call: "PUT /sbhc/students/${stu_id}/immunization-exemption"
              payload: { exemption_type: "MEDICAL" }
              as: Registrar
            - call: "POST /sbhc/visits"
              payload: { student_id: "${stu_id}", school_id: "${school_id}", clinician_id: "${clin_med_id}", visit_type: "SPORTS_PHYSICAL", scheduled_start_at: "2026-05-10T10:00:00Z" }
              as: Clinician
              as_user_id: "${clin_med_id}"
              captures: { sp_visit_id: "$.data.id" }
            - call: "POST /sbhc/visits/${sp_visit_id}/start"
              payload: {}
              as: Clinician
              as_user_id: "${clin_med_id}"
            - call: "GET /sbhc/students/${stu_id}"
              payload: {}
              as: Clinician
              captures: { stu_v_pre: "$.data.version" }
          trigger:
            - call: "POST /sbhc/visits/${sp_visit_id}/sports-clearances"
              payload: { outcome: "CLEARED", expected_student_version: "${stu_v_pre}" }
              as: Clinician
              as_user_id: "${clin_med_id}"
              captures: { clr_id: "$.data.id" }
          assert:
            - "Student.${stu_id}.immunization_compliance_status == COMPLIANT"
            - "SportsPhysicalClearance.${clr_id}.determination_date == 2026-05-10"
            - "SportsPhysicalClearance.${clr_id}.unrestricted_valid_until == 2027-05-10"
            - "SportsPhysicalClearance.${clr_id}.valid_until == 2026-07-31"
            - "SportsPhysicalClearance.${clr_id}.status == ACTIVE"
            - "SportsPhysicalClearance.${clr_id}.reevaluation_count == 0"
            - "SportsPhysicalClearance.${clr_id}.school_year == 2025-2026"

  - rule_id: combinatorial_formula
    instances:

      - name: fpl_round_to_two_dp_before_tier_banding_keeps_tier_a_at_100_0000641
        grounds:
          - calculations.fpl_percent_and_discount_tier
          - entities.Student.fields.fpl_percent
          - entities.Student.fields.discount_tier
        distinguishing_aspect: |
          Mode (b) — nested rounding where the ORDER matters. Household income
          1560001 cents at size 1 gives a raw ratio of 100.0000641%, which is
          strictly greater than the TIER_A edge; the scaffold pins round-to-2dp
          FIRST, so the banded value is 100.00 and the tier is TIER_A. Banding the
          unrounded ratio would give TIER_B and a 0.80 discount instead of 1.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-04T09:00:00Z."
            - "One student on the roster with no financial profile yet (income 0, size 1, fpl_percent 0.00, TIER_A)."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
            - call: "POST /sbhc/students"
              payload: { first_name: "Cleo", last_name: "Park", date_of_birth: "2010-04-15" }
              as: Registrar
              captures: { stu_id: "$.data.id" }
          trigger:
            - call: "PATCH /sbhc/students/${stu_id}/financial-profile"
              payload: { household_income_annual_cents: 1560001, household_size: 1, payer_route: "SELF_PAY" }
              as: Registrar
              captures: { pct_edge: "$.data.fpl_percent", tier_edge: "$.data.discount_tier" }
            - call: "PATCH /sbhc/students/${stu_id}/financial-profile"
              payload: { household_income_annual_cents: 1570000, household_size: 1, payer_route: "SELF_PAY" }
              as: Registrar
              captures: { pct_next: "$.data.fpl_percent", tier_next: "$.data.discount_tier" }
          assert:
            - "the first PATCH response has Student.fpl_percent == 100.00"
            - "the first PATCH response has Student.discount_tier == TIER_A"
            - "the second PATCH response has Student.fpl_percent == 100.64"
            - "the second PATCH response has Student.discount_tier == TIER_B"
            - "Student.${stu_id}.discount_tier == TIER_B after both calls"

      - name: encounter_nominal_fee_floor_four_step_evaluation_order
        grounds:
          - calculations.encounter_nominal_fee_floor
          - calculations.charge_patient_responsibility
          - entities.BillableCharge.fields.floor_adjustment_cents
          - entities.Visit.fields.patient_responsibility_total_cents
          - state_machines.BillableCharge.null_to_NO_CHARGE
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency resolved by a pinned evaluation
          order, and a DIFFERENT mode from the rounding-order instance above. The
          encounter total depends on the per-charge amounts, but the nominal-fee
          floor modifies a per-charge amount based on that total. With a TIER_A
          self-pay student the ACUTE charge discounts to 0 and the IMMUNIZATION_ADMIN
          charge is NO_CHARGE and excluded from the sum, so STEP 3 tops the single
          eligible charge up by exactly 500 and the encounter total lands on 500,
          never 1000 and never 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-04T09:00:00Z."
            - "One ACTIVE school, one MEDICAL clinician, one student with an ACTIVE 2025-2026 enrollment and an ACTIVE GENERAL_TREATMENT consent."
            - "Student financial profile: income 3000000 cents, size 4, SELF_PAY, giving fpl_percent 93.46 and discount_tier TIER_A (100% discount)."
            - "One ACUTE visit in clinical_status IN_PROGRESS with one VALID HEPB dose 1 recorded against it."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
            - call: "POST /sbhc/schools"
              payload: { name: "Lincoln High", site_code: "LHS", sponsor_hospital_name: "Mercy Sponsor Hospital", telehealth_concurrent_capacity: 1 }
              as: SbhcAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /sbhc/clinicians"
              payload: { full_name: "Dana Reyes NP", discipline: "MEDICAL", license_number: "NP-1001" }
              as: SbhcAdmin
              captures: { clin_med_id: "$.data.id" }
            - call: "POST /sbhc/students"
              payload: { first_name: "Ava", last_name: "Nguyen", date_of_birth: "2010-04-15" }
              as: Registrar
              captures: { stu_id: "$.data.id" }
            - call: "PATCH /sbhc/students/${stu_id}/financial-profile"
              payload: { household_income_annual_cents: 3000000, household_size: 4, payer_route: "SELF_PAY" }
              as: Registrar
              captures: { stu_v_fin: "$.data.version" }
            - call: "POST /sbhc/students/${stu_id}/guardians"
              payload: { full_name: "Mai Nguyen", relationship: "MOTHER", contact_email: "mai@example.org", is_primary: true }
              as: Registrar
              captures: { g1_id: "$.data.id" }
            - call: "POST /sbhc/students/${stu_id}/enrollments"
              payload: { school_id: "${school_id}", school_year: "2025-2026", expected_student_version: "${stu_v_fin}" }
              as: Registrar
              captures: { enr_id: "$.data.id" }
            - call: "POST /sbhc/enrollments/${enr_id}/activate"
              payload: {}
              as: Registrar
            - call: "GET /sbhc/students/${stu_id}"
              payload: {}
              as: Registrar
              captures: { stu_v_act: "$.data.version" }
            - call: "POST /sbhc/students/${stu_id}/consents"
              payload: { category: "GENERAL_TREATMENT", school_year: "2025-2026", granted_by: "GUARDIAN", granted_by_user_id: "${g1_id}", expected_student_version: "${stu_v_act}" }
              as: Registrar
              captures: { consent_gen_id: "$.data.id" }
            - call: "POST /sbhc/visits"
              payload: { student_id: "${stu_id}", school_id: "${school_id}", clinician_id: "${clin_med_id}", visit_type: "ACUTE", scheduled_start_at: "2026-05-04T10:00:00Z" }
              as: Clinician
              as_user_id: "${clin_med_id}"
              captures: { visit_id: "$.data.id" }
            - call: "POST /sbhc/visits/${visit_id}/start"
              payload: {}
              as: Clinician
              as_user_id: "${clin_med_id}"
            - call: "POST /sbhc/students/${stu_id}/immunization-doses"
              payload: { series_code: "HEPB", dose_number: 1, administered_date: "2026-05-04", visit_id: "${visit_id}" }
              as: Clinician
              as_user_id: "${clin_med_id}"
              captures: { hepb1_id: "$.data.id" }
          trigger:
            - call: "POST /sbhc/visits/${visit_id}/complete"
              payload: { disposition: "TREATED_RETURNED_TO_CLASS" }
              as: Clinician
              as_user_id: "${clin_med_id}"
          assert:
            - "Student.${stu_id}.fpl_percent == 93.46"
            - "Student.${stu_id}.discount_tier == TIER_A"
            - "exactly 2 BillableCharge rows exist with visit_id == ${visit_id}"
            - "the BillableCharge with service_category == ACUTE_OFFICE_VISIT has gross_amount_cents == 12000, provisional_patient_responsibility_cents == 0, floor_adjustment_cents == 500, patient_responsibility_cents == 500 and status == PENDING"
            - "the BillableCharge with service_category == IMMUNIZATION_ADMIN has gross_amount_cents == 3000, floor_adjustment_cents == 0, patient_responsibility_cents == 0 and status == NO_CHARGE"
            - "Visit.${visit_id}.gross_charge_total_cents == 15000"
            - "Visit.${visit_id}.no_charge_total_cents == 3000"
            - "Visit.${visit_id}.patient_responsibility_total_cents == 500"
            - "Visit.${visit_id}.write_off_total_cents == 0"
            - "Visit.${visit_id}.payer_billed_total_cents == 11500"
            - "Visit.${visit_id}.clinical_status == COMPLETED"
            - "Visit.${visit_id}.billing_status == PENDING_CHARGES"

  - rule_id: non_linear_state_machine
    instances:

      - name: referral_outreach_capped_self_loop_ends_in_lost_to_follow_up
        grounds:
          - state_machines.Referral.OPEN_to_OUTREACH_IN_PROGRESS
          - state_machines.Referral.OUTREACH_IN_PROGRESS_to_OUTREACH_IN_PROGRESS
          - state_machines.Referral.OUTREACH_IN_PROGRESS_to_LOST_TO_FOLLOW_UP
          - entities.Referral.fields.outreach_attempt_count
          - validations[priority=16]
          - errors[ERR_OUTREACH_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Non-linear shape on Referral: a capped self-loop
          OUTREACH_IN_PROGRESS -> OUTREACH_IN_PROGRESS that the third NO_ANSWER
          exits into the terminal LOST_TO_FOLLOW_UP, and a fourth attempt returns
          ERR_OUTREACH_LIMIT_EXCEEDED rather than looping again.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-04T09:00:00Z."
            - "One ACTIVE school, one MEDICAL clinician, one student with an ACTIVE 2025-2026 enrollment and an ACTIVE GENERAL_TREATMENT consent."
            - "One clinician-raised Referral in status OUTREACH_IN_PROGRESS with outreach_attempt_count == 2."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
            - call: "POST /sbhc/schools"
              payload: { name: "Lincoln High", site_code: "LHS", sponsor_hospital_name: "Mercy Sponsor Hospital", telehealth_concurrent_capacity: 1 }
              as: SbhcAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /sbhc/clinicians"
              payload: { full_name: "Dana Reyes NP", discipline: "MEDICAL", license_number: "NP-1001" }
              as: SbhcAdmin
              captures: { clin_med_id: "$.data.id" }
            - call: "POST /sbhc/students"
              payload: { first_name: "Ava", last_name: "Nguyen", date_of_birth: "2010-04-15" }
              as: Registrar
              captures: { stu_id: "$.data.id" }
            - call: "PATCH /sbhc/students/${stu_id}/financial-profile"
              payload: { household_income_annual_cents: 3000000, household_size: 4, payer_route: "SELF_PAY" }
              as: Registrar
              captures: { stu_v_fin: "$.data.version" }
            - call: "POST /sbhc/students/${stu_id}/guardians"
              payload: { full_name: "Mai Nguyen", relationship: "MOTHER", contact_email: "mai@example.org", is_primary: true }
              as: Registrar
              captures: { g1_id: "$.data.id" }
            - call: "POST /sbhc/students/${stu_id}/enrollments"
              payload: { school_id: "${school_id}", school_year: "2025-2026", expected_student_version: "${stu_v_fin}" }
              as: Registrar
              captures: { enr_id: "$.data.id" }
            - call: "POST /sbhc/enrollments/${enr_id}/activate"
              payload: {}
              as: Registrar
            - call: "GET /sbhc/students/${stu_id}"
              payload: {}
              as: Registrar
              captures: { stu_v_act: "$.data.version" }
            - call: "POST /sbhc/students/${stu_id}/consents"
              payload: { category: "GENERAL_TREATMENT", school_year: "2025-2026", granted_by: "GUARDIAN", granted_by_user_id: "${g1_id}", expected_student_version: "${stu_v_act}" }
              as: Registrar
              captures: { consent_gen_id: "$.data.id" }
            - call: "POST /sbhc/students/${stu_id}/referrals"
              payload: { specialty: "PRIMARY_CARE", reason: "Persistent cough for six weeks" }
              as: Clinician
              as_user_id: "${clin_med_id}"
              captures: { ref_id: "$.data.id" }
            - call: "POST /sbhc/referrals/${ref_id}/outreach-attempts"
              payload: { outcome: "NO_ANSWER" }
              as: CareCoordinator
            - call: "POST /sbhc/referrals/${ref_id}/outreach-attempts"
              payload: { outcome: "NO_ANSWER" }
              as: CareCoordinator
          trigger:
            - call: "POST /sbhc/referrals/${ref_id}/outreach-attempts"
              payload: { outcome: "NO_ANSWER" }
              as: CareCoordinator
              captures: { st_after_third: "$.data.status" }
            - call: "POST /sbhc/referrals/${ref_id}/outreach-attempts"
              payload: { outcome: "NO_ANSWER" }
              as: CareCoordinator
              captures: { err_fourth: "$.data.error_id" }
          assert:
            - "after the second setup attempt Referral.${ref_id}.status == OUTREACH_IN_PROGRESS and outreach_attempt_count == 2"
            - "Referral.${ref_id}.status == LOST_TO_FOLLOW_UP"
            - "Referral.${ref_id}.outreach_attempt_count == 3"
