            - { call: "POST /auxiliary/placements", payload: { request_id: "${req_id}", volunteer_id: "${v2}" }, as: VolunteerCoordinator, captures: { p2: $.data.id } }
          trigger:
            - { call: "POST /auxiliary/placements/${p1}/accept", as: Volunteer, as_user_id: "${v1}" }
            - { call: "POST /auxiliary/placements/${p2}/accept", as: Volunteer, as_user_id: "${v2}" }
