    output: PrintMarket
    side_effects:
      - "print_site_transfer_credit_cents set to the negated transfer cost; net_print_site_transfer_cost_cents recomputed to exactly 0.00"
      - "member delivery routes and stops terminated; member subscriber contracts move to churned_pending_retention"
      - "RegionHub.legal_notice_block recomputed; RegionHub.version increments by 1"

