            - "second trigger: HTTP 200; ConsensusRound.${rnd}.status == COMPARED, variance_bps == 0, reconciled_total_cents == 1296456684"
            - "third trigger: HTTP 409 and ${err_closed} == ERR_ROUND_NOT_OPEN (priority 13 now masks priority 14)"

      - name: one_time_item_void_twice_and_creation_after_certification_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority 18 ERR_ONE_TIME_ITEM_NOT_ACTIVE]
          - validations[priority 43 ERR_CYCLE_ALREADY_CERTIFIED]
          - entities.OneTimeItem.fields.status
        distinguishing_aspect: |
          The one-time carve-out is frozen at certification and each item is voided once: the second
          void of the same item returns ERR_ONE_TIME_ITEM_NOT_ACTIVE 409, and after the cycle is
          CERTIFIED both a fresh POST /one-time-items and a void of a surviving item return
          ERR_CYCLE_ALREADY_CERTIFIED 409 — so certified_one_time_cents can never move after the
          fact.
        test_recipe:
          setup:
            - "SHORT chain with TWO one-time items of 6000000 each on the PIT source (items A and B), taken through to CONSENSUS_REACHED. Item A is voided before certification, so certified_one_time_cents is 6000000 and certified_recurring_total_cents is 1296456684."
          setup_api_calls:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "BASELINE", weight_bps: 6000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "OPTIMISTIC", weight_bps: 2500, employment_growth_bps: 300, wage_income_bps: 700, retail_sales_bps: 600, asset_market_return_bps: 1500 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "PESSIMISTIC", weight_bps: 1500, employment_growth_bps: -100, wage_income_bps: 100, retail_sales_bps: -200, asset_market_return_bps: -1000 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /one-time-items", payload: { cycle_id: "${cyc}", source_id: "${src_pit}", item_type: "SETTLEMENT", amount_cents: 6000000, description: "Item A, to be voided before certification" }, as: ForecastDirector, as_user_id: "dir-1", captures: { ot_a: $.data.id } }
            - { call: "POST /one-time-items", payload: { cycle_id: "${cyc}", source_id: "${src_pit}", item_type: "ASSET_SALE", amount_cents: 6000000, description: "Item B, survives into the certified forecast" }, as: ForecastDirector, as_user_id: "dir-1", captures: { ot_b: $.data.id } }
            - { call: "POST /one-time-items/${ot_a}/void", payload: {}, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/lock-inputs", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_v: $.data.version } }
            - { call: "POST /consensus-rounds", payload: { cycle_id: "${cyc}", variance_tolerance_bps: 150, per_source_tolerance_bps: 150, expected_cycle_version: "${cyc_v}" }, as: ForecastDirector, as_user_id: "dir-1", captures: { rnd: $.data.id } }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}" }, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}" }, as: LegislativeEconomist, as_user_id: "leg-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/submit", payload: {}, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/submit", payload: {}, as: LegislativeEconomist, as_user_id: "leg-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/ratify", payload: {}, as: ForecastDirector, as_user_id: "dir-1" }
          trigger:
            - { call: "POST /one-time-items/${ot_a}/void", payload: {}, as: ExecutiveEconomist, as_user_id: "exec-eco-1", captures: { err_void: $.data.error_id } }
            - { call: "POST /forecast-cycles/${cyc}/certify", payload: {}, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /one-time-items", payload: { cycle_id: "${cyc}", source_id: "${src_pit}", item_type: "SETTLEMENT", amount_cents: 1000000, description: "Late settlement, after certification" }, as: ForecastDirector, as_user_id: "dir-1", captures: { err_create: $.data.error_id } }
            - { call: "POST /one-time-items/${ot_b}/void", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { err_late_void: $.data.error_id } }
          assert:
            - "first trigger: HTTP 409 and ${err_void} == ERR_ONE_TIME_ITEM_NOT_ACTIVE; OneTimeItem.${ot_a}.status == VOIDED"
            - "second trigger: HTTP 200; ForecastCycle.${cyc}.certified_one_time_cents == 6000000, certified_total_cents == 1302456684, certified_recurring_total_cents == 1296456684"
            - "third trigger: HTTP 409 and ${err_create} == ERR_CYCLE_ALREADY_CERTIFIED"
            - "fourth trigger: HTTP 409 and ${err_late_void} == ERR_CYCLE_ALREADY_CERTIFIED; OneTimeItem.${ot_b}.status == ACTIVE"
            - "GET /one-time-items with cycle_id ${cyc} returns total_count == 2"

      - name: reversal_of_an_already_reversed_transaction_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority 26 ERR_TRANSACTION_ALREADY_REVERSED]
          - validations[priority 53 ERR_RATIONALE_TOO_SHORT]
          - endpoints[POST /reserve-transactions/{id}/reverse]
        distinguishing_aspect: |
          A reversal is single-use and a REVERSAL row is itself unreversible: the second reverse of
          the deposit returns ERR_TRANSACTION_ALREADY_REVERSED 409, and so does a reverse aimed at
          the REVERSAL row (its origin is not in {CERTIFICATION_DEPOSIT, MANUAL_DEPOSIT,
          WITHDRAWAL}) — with the balance parked at 50000000 and exactly two ledger rows on file.
        test_recipe:
          setup:
            - "One fund with opening_balance_cents 50000000 and no certified cycle, so cap_cents is null and the manual deposit faces no ceiling; one MANUAL_DEPOSIT of 10000000 has been minted, taking the balance to 60000000."
          setup_api_calls:
            - { call: "POST /reserve-funds", payload: { name: "Budget Stabilization Fund", cap_pct_bps: 1000, trend_growth_rate_bps: 300, capture_rate_bps: 5000, deposit_rule_variant: "GROWTH_ABOVE_TREND", eligible_seats: 11, annual_withdrawal_cap_pct_bps: 3000, cooling_off_days: 3, opening_balance_cents: 50000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { fnd: $.data.id } }
            - { call: "POST /reserve-funds/${fnd}/deposits", payload: { amount_cents: 10000000, memo: "Supplemental appropriation transfer" }, as: ReserveTreasurer, as_user_id: "tr-1", captures: { tx_dep: $.data.id } }
          trigger:
            - { call: "POST /reserve-transactions/${tx_dep}/reverse", payload: { rationale: "Transfer was posted to the wrong fiscal year." }, as: ReserveTreasurer, as_user_id: "tr-1", captures: { tx_rev: $.data.id } }
            - { call: "POST /reserve-transactions/${tx_dep}/reverse", payload: { rationale: "Attempting the same correction a second time." }, as: ReserveTreasurer, as_user_id: "tr-1", captures: { err_dup: $.data.error_id } }
            - { call: "POST /reserve-transactions/${tx_rev}/reverse", payload: { rationale: "Attempting to reverse the reversal itself." }, as: ReserveTreasurer, as_user_id: "tr-1", captures: { err_rev: $.data.error_id } }
            - { call: "POST /reserve-transactions/${tx_dep}/reverse", payload: { rationale: "too short" }, as: ReserveTreasurer, as_user_id: "tr-1", captures: { err_short: $.data.error_id } }
          assert:
            - "first trigger: HTTP 201; ReserveTransaction.${tx_rev}.origin == REVERSAL, signed_amount_cents == -10000000, reverses_transaction_id == ${tx_dep}"
            - "first trigger: ReserveFund.${fnd}.balance_cents == 50000000 and fy_withdrawn_cents == 0 (a reversed deposit is not a withdrawal)"
            - "second trigger: HTTP 409 and ${err_dup} == ERR_TRANSACTION_ALREADY_REVERSED"
            - "third trigger: HTTP 409 and ${err_rev} == ERR_TRANSACTION_ALREADY_REVERSED"
            - "fourth trigger: HTTP 409 and ${err_short} == ERR_TRANSACTION_ALREADY_REVERSED — the state rule at priority 26 masks the 20-character rationale rule at priority 53"
            - "GET /reserve-transactions with fund_id ${fnd} returns total_count == 2"

      - name: duplicate_actual_collection_for_the_same_source_and_year_rejected
