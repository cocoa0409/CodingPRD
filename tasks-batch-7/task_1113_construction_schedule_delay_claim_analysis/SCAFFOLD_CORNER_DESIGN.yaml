      - name: response_envelope_shape_on_success
        claim_type: response_envelope
        grounds:
          - response_envelope
        distinguishing_aspect: "Success response has meta.api_request_id, meta.api_request_timestamp, response_type=='object' (single) or 'array' (list), and data payload."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
