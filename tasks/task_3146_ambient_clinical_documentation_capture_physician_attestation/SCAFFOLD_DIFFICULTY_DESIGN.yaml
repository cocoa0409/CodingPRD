              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/audio-captures"
              payload: { planned_retention_days: 30 }
              as: Physician
              as_user_id: "${phy}"
              captures: { cap1: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:02:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/audio-captures/${cap1}/stop"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
          trigger:
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:02:59Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/audio-captures"
              payload: { planned_retention_days: 30 }
              as: Physician
              as_user_id: "${phy}"
              captures: { err: "$.data.error_id" }
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:03:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/audio-captures"
              payload: { planned_retention_days: 30 }
              as: Physician
              as_user_id: "${phy}"
              captures: { cap2: "$.data.id" }
          assert:
            - "err == ERR_CAPTURE_GAP_VIOLATION at a 59-second gap (disjoint intervals are still rejected — the buffer, not overlap, decides)"
            - "At exactly 60 seconds the new capture is created (>= is inclusive) with status RECORDING"

  # ===========================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: attest_amend_reattest_conserve_notes_attested
        grounds:
          - state_machines.NoteDraft.IN_REVIEW_to_ATTESTED
          - state_machines.NoteDraft.ATTESTED_to_AMENDED
          - entities.DocumentationMetric.fields.notes_attested
        distinguishing_aspect: |
          Conserved quantity: DocumentationMetric.notes_attested (an integer
          counter). The forward action attest (+1) paired with its compensating
          action amend (-1) leaves the counter equal to the number of currently
          ATTESTED drafts for the physician in the period — 1, 0, then 1 across
          the cycle, never drifting.
        test_recipe:
          setup:
            - "One attestable note (single CRITICAL field filled -> completeness 100)"
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-CI1-1", full_name: "Pat Ci1" }
              as: PlatformAdmin
              captures: { pat: "$.data.id" }
