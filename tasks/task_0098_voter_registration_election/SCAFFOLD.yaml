# =============================================================================
# Voter Registration & Election Management — SCAFFOLD (§1.0–§1.7)
# =============================================================================
scenario: |
  98. Voter Registration & Election Management: eligibility (citizenship/age/residency),
  party registration, absentee ballot request, Precinct assignment, early voting,
  voting machine failure backup, Ballot Curing, recount

domain_name: voter-registration-election
api_prefix: ""

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - "Optimistic concurrency"
    - "Cascading side effects"
    - "Rate / threshold triggers"
    - "Selector policy"

  entity_topology: graph
  # Registrations, ballots, precincts, machines, and recounts link by FK across
  # aggregate boundaries (a ballot references registration + precinct + election;
  # a recount references an election and a precinct; a machine references another
  # machine). No strict nesting tree.

  state_machine_shape: branching
  # VoterRegistration: branching with revert (NEEDS_REVIEW loop). AbsenteeBallot:
  # parallel dimensions (request_status × cure_status). VotingMachine: cyclic
  # (FAILED -> OPERATIONAL). RecountCase: fork-join over two tally passes.

  relationship_patterns:
    - one_to_many       # Election -> VoterRegistration; Precinct -> VotingMachine
    - cross_aggregate   # AbsenteeBallot spans registration + precinct + election
    - self_referential  # VotingMachine.backup_for_machine_id references VotingMachine

  role_model: segregation_of_duties
  # An ElectionOfficial who reviewed a registration cannot adjudicate that voter's
  # ballot cure; a Canvasser who recorded a precinct tally cannot submit that
  # precinct's recount passes.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Election
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable election name."
      - name: election_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant polls close; age eligibility and the early-voting/close windows derive from it."
      - name: registration_deadline
        type: datetime
        source: input
        description: "ISO 8601 UTC instant after which no VoterRegistration may be approved for this election."
      - name: absentee_request_deadline
        type: datetime
        source: input
        description: "ISO 8601 UTC instant after which AbsenteeBallot requests are rejected."
      - name: cure_deadline
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at/after which a flagged AbsenteeBallot can no longer be cured."
      - name: early_voting_start
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the early-voting window opens (inclusive)."
      - name: early_voting_end
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the early-voting window closes (exclusive)."
      - name: status
        type: enum
        source: system
        description: "Lifecycle state."
        default: SCHEDULED
        constraints: "One of {SCHEDULED, REGISTRATION_OPEN, VOTING_OPEN, POLLS_CLOSED, CERTIFIED}."
      - name: total_registered
        type: integer
        source: computed
        description: "Count of VoterRegistration rows for this election whose status == ACTIVE (turnout denominator)."
      - name: total_ballots_accepted
        type: integer
        source: computed
        description: "Count of AbsenteeBallot rows for this election whose request_status == ACCEPTED."
      - name: turnout_pct
        type: number
        source: computed
        description: "Per turnout_rate FINAL variant; (accepted absentee + distinct early-vote check-ins) / total_registered * 100, 2dp; 0.00 when total_registered == 0."
      - name: projected_turnout_pct
        type: number
        source: computed
        description: "Per turnout_rate PROJECTED variant; counts in-hand absentee ballots (request_status IN {RETURNED, ACCEPTED}) instead of only ACCEPTED, plus early-vote check-ins, over total_registered; 2dp; 0.00 when total_registered == 0."

  - name: Precinct
    parent: null
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: input
        description: "FK -> Election.id; the election this precinct serves."
      - name: code
        type: string
        source: input
        description: "Precinct code, unique within an election."
        constraints: "Unique per (election_id, code)."
      - name: county_fips
        type: string
        source: input
        description: "5-digit county FIPS code used for residency matching."
      - name: street_low
        type: integer
        source: input
        description: "Lowest residential street number this precinct covers (inclusive)."
      - name: street_high
        type: integer
        source: input
        description: "Highest residential street number this precinct covers (inclusive)."
        constraints: ">= street_low."
      - name: max_registrations
        type: integer
        source: input
        description: "Hard cap of ACTIVE VoterRegistration assignments this precinct accepts."
        constraints: ">= 1."
      - name: assigned_count
        type: integer
        source: computed
        description: "Count of VoterRegistration rows with precinct_id == this.id and status == ACTIVE."
      - name: capacity_posture
        type: enum
        source: computed
        description: "OPEN while assigned_count < max_registrations; FULL when assigned_count >= max_registrations."
        constraints: "One of {OPEN, FULL}."
      - name: tally_status
        type: enum
        source: system
        description: "Whether the precinct's in-person tally has been recorded."
        default: PENDING
        constraints: "One of {PENDING, TALLIED}."
      - name: reported_vote_count
        type: integer
        source: input
        description: "In-person votes recorded for this precinct on tally; null until TALLIED; overwritten by a certified recount."
        default: null
      - name: tally_recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Canvasser who recorded the tally; segregation key for recount passes; null until TALLIED."
        default: null

  - name: VoterRegistration
    parent: null
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: input
        description: "FK -> Election.id; the election this registration is for."
      - name: precinct_id
        type: string
        source: computed
        description: "FK -> Precinct.id; assigned by the precinct selector on approval; null until ACTIVE."
        default: null
      - name: first_name
        type: string
        source: input
        description: "Registrant given name."
      - name: last_name
        type: string
        source: input
        description: "Registrant surname."
      - name: national_id
        type: string
        source: input
        description: "Government identifier, unique per election."
        constraints: "Unique per (election_id, national_id) over non-rejected registrations."
      - name: is_citizen
        type: boolean
        source: input
        description: "Self-attested citizenship flag (eligibility gate on approval)."
      - name: date_of_birth
        type: datetime
        source: input
        description: "ISO 8601 UTC date of birth; age computed against Election.election_date."
      - name: county_fips
        type: string
        source: input
        description: "5-digit county FIPS of the registrant's residence."
      - name: street_number
        type: integer
        source: input
        description: "Residential street number, matched against a Precinct's [street_low, street_high]."
      - name: party
        type: enum
        source: input
        description: "Party registration."
        default: UNAFFILIATED
        constraints: "One of {DEMOCRAT, REPUBLICAN, INDEPENDENT, GREEN, LIBERTARIAN, UNAFFILIATED}."
      - name: early_voted_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant of this voter's in-person early-vote check-in; null until they check in."
        default: null
      - name: status
        type: enum
        source: system
        description: "Lifecycle state."
        default: PENDING
        constraints: "One of {PENDING, NEEDS_REVIEW, ACTIVE, REJECTED, WITHDRAWN}."
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ElectionOfficial who last approved/rejected; segregation key for ballot curing; null until reviewed."
        default: null

  - name: AbsenteeBallot
    parent: null
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: input
        description: "FK -> VoterRegistration.id; the voter requesting the ballot."
      - name: election_id
        type: string
        source: computed
        description: "FK -> Election.id; copied from the registration on creation."
      - name: precinct_id
        type: string
        source: computed
        description: "FK -> Precinct.id; copied from the registration on creation."
      - name: mailing_address
        type: string
        source: input
        description: "Address the ballot is mailed to."
      - name: request_status
        type: enum
        source: system
        description: "Request lifecycle dimension (independent of cure_status)."
        default: REQUESTED
        constraints: "One of {REQUESTED, ISSUED, RETURNED, ACCEPTED, REJECTED}."
      - name: cure_status
        type: enum
        source: system
        description: "Signature-cure lifecycle dimension (independent of request_status)."
        default: NONE
        constraints: "One of {NONE, FLAGGED, CURE_PENDING, CURED, CURE_FAILED}."
      - name: returned_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant the ballot was marked RETURNED; null until then."
        default: null

  - name: CureCase
    parent: null
    common_fields: true
    fields:
      - name: ballot_id
        type: string
        source: input
        description: "FK -> AbsenteeBallot.id; the flagged ballot under cure."
      - name: election_id
        type: string
        source: computed
        description: "FK -> Election.id; copied from the ballot on creation (drives the cure_deadline window)."
      - name: reason
        type: enum
        source: input
        description: "Why the ballot was flagged."
        constraints: "One of {SIGNATURE_MISMATCH, MISSING_SIGNATURE, MISSING_WITNESS}."
      - name: voter_response_text
        type: string
        source: input
        description: "Affidavit text the voter submits to cure; null until submitted."
        default: null
      - name: status
        type: enum
        source: system
        description: "Cure-case lifecycle."
        default: OPEN
        constraints: "One of {OPEN, RESPONSE_SUBMITTED, APPROVED, DENIED, EXPIRED}."
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ElectionOfficial who approved/denied; null until adjudicated."
        default: null

  - name: VotingMachine
    parent: null
    common_fields: true
    fields:
      - name: precinct_id
        type: string
        source: input
        description: "FK -> Precinct.id; the precinct this machine is staged at."
      - name: serial
        type: string
        source: input
        description: "Machine serial, unique per precinct."
        constraints: "Unique per (precinct_id, serial)."
      - name: role
        type: enum
        source: input
        description: "PRIMARY machines serve voters; BACKUP machines sit idle until activated."
        default: PRIMARY
        constraints: "One of {PRIMARY, BACKUP}."
      - name: status
        type: enum
        source: system
        description: "Operational lifecycle."
        default: OPERATIONAL
        constraints: "One of {OPERATIONAL, FAILED, REPLACED, RETIRED}."
      - name: backup_for_machine_id
        type: string
        source: system
        description: "FK -> VotingMachine.id; set when this BACKUP is activated to cover a FAILED machine; null otherwise."
        default: null
      - name: capacity
        type: integer
        source: input
        description: "Voters per hour this machine processes; drives backup-selection ranking."
        constraints: ">= 1."

  - name: MachineFailure
    parent: null
    common_fields: false
    fields:
      - name: machine_id
        type: string
        source: input
        description: "FK -> VotingMachine.id; the machine that failed."
      - name: reported_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant of the failure report (server clock)."
      - name: backup_machine_id
        type: string
        source: computed
        description: "FK -> VotingMachine.id; the BACKUP machine the selector activated, or null if none available."
        default: null
      - name: resolution
        type: enum
        source: computed
        description: "BACKUP_ACTIVATED when a backup was found, else NO_BACKUP_AVAILABLE."
        constraints: "One of {BACKUP_ACTIVATED, NO_BACKUP_AVAILABLE}."

  - name: EarlyVoteCheckIn
    parent: null
    common_fields: false
    fields:
      - name: registration_id
        type: string
        source: input
        description: "FK -> VoterRegistration.id; the voter checking in."
      - name: precinct_id
        type: string
        source: computed
        description: "FK -> Precinct.id; copied from the registration."
      - name: checked_in_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant the voter checked in (server clock)."

  - name: RecountCase
    parent: null
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: input
        description: "FK -> Election.id; the election under recount."
      - name: precinct_id
        type: string
        source: input
        description: "FK -> Precinct.id; the single precinct this recount re-tallies."
      - name: original_count
        type: integer
        source: computed
        description: "Snapshot of Precinct.reported_vote_count at recount creation."
      - name: machine_recount
        type: integer
        source: input
        description: "Vote count from the machine re-tally pass; null until submitted."
        default: null
      - name: hand_recount
        type: integer
        source: input
        description: "Vote count from the hand re-tally pass; null until submitted."
        default: null
      - name: certified_count
        type: integer
        source: computed
        description: "Final count the recount certified (per recount_certification calc); null until CERTIFIED."
        default: null
      - name: status
        type: enum
        source: system
        description: "Recount lifecycle (fork-join over two tally passes)."
        default: REQUESTED
        constraints: "One of {REQUESTED, MACHINE_DONE, HAND_DONE, BOTH_DONE, CERTIFIED, DISMISSED}."

  - name: ClockState
    parent: null
    common_fields: false
    fields:
      - name: current_utc
        type: datetime
        source: system
        description: "The server's simulated current time used for all deadline comparisons."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Election
    field: status
    initial_state: SCHEDULED
    terminal_states: [CERTIFIED]
    transitions:
      - from: SCHEDULED
        to: REGISTRATION_OPEN
        trigger: "POST /elections/{id}/transition with target_status=REGISTRATION_OPEN"
        actor: ElectionAdmin
        preconditions:
          - "Election.status == SCHEDULED"
        side_effects:
          - "increments Election.version by 1"
      - from: REGISTRATION_OPEN
        to: VOTING_OPEN
        trigger: "POST /elections/{id}/transition with target_status=VOTING_OPEN"
        actor: ElectionAdmin
        preconditions:
          - "Election.status == REGISTRATION_OPEN"
          - "ClockState.current_utc >= Election.early_voting_start"
        side_effects:
          - "increments Election.version by 1"
      - from: VOTING_OPEN
        to: POLLS_CLOSED
        trigger: "POST /elections/{id}/transition with target_status=POLLS_CLOSED"
        actor: ElectionAdmin
        preconditions:
          - "Election.status == VOTING_OPEN"
          - "ClockState.current_utc >= Election.election_date"
        side_effects:
          - "Cure sweep: for every CureCase of this election with status IN {OPEN, RESPONSE_SUBMITTED} where ClockState.current_utc >= Election.cure_deadline -> CureCase.status=EXPIRED; that EXPIRED itself sets its AbsenteeBallot.cure_status=CURE_FAILED; that CURE_FAILED itself sets that ballot.request_status=REJECTED (depth-3 cascade per CureCase)"
          - "increments Election.version by 1"
      - from: POLLS_CLOSED
        to: CERTIFIED
        trigger: "POST /elections/{id}/transition with target_status=CERTIFIED"
        actor: ElectionAdmin
        preconditions:
          - "Election.status == POLLS_CLOSED"
          - "every Precinct of this election has tally_status == TALLIED"
          - "no RecountCase of this election has status IN {REQUESTED, MACHINE_DONE, HAND_DONE, BOTH_DONE}"
        side_effects:
          - "increments Election.version by 1"

  - entity: VoterRegistration
    field: status
    initial_state: PENDING
    terminal_states: [ACTIVE, REJECTED, WITHDRAWN]
    note: "Branching with revert — NEEDS_REVIEW loops back to PENDING via resubmit; ACTIVE is reachable from PENDING only after eligibility + capacity pass."
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /registrations/{id}/approve"
        actor: ElectionOfficial
        preconditions:
          - "VoterRegistration.status == PENDING"
          - "Election.status == REGISTRATION_OPEN"
          - "ClockState.current_utc < Election.registration_deadline"
          - "is_citizen == true"
          - "age_years (voter_age_eligibility) >= 18"
          - "precinct_selector finds >= 1 residency-matching Precinct"
          - "the selected Precinct.capacity_posture == OPEN"
        side_effects:
          - "Runs precinct_selector; sets precinct_id to the selected Precinct"
          - "Selected Precinct.assigned_count += 1; recompute its capacity_posture (cross-entity ledger write)"
          - "Sets reviewed_by_user_id = acting X-User-ID"
          - "Election.total_registered recomputed"
          - "increments VoterRegistration.version by 1"
      - from: PENDING
        to: NEEDS_REVIEW
        trigger: "POST /registrations/{id}/transition with target_status=NEEDS_REVIEW"
        actor: ElectionOfficial
        preconditions:
          - "VoterRegistration.status == PENDING"
        side_effects:
          - "increments VoterRegistration.version by 1"
      - from: NEEDS_REVIEW
        to: PENDING
        trigger: "POST /registrations/{id}/transition with target_status=PENDING"
        actor: ElectionOfficial
        preconditions:
          - "VoterRegistration.status == NEEDS_REVIEW"
        side_effects:
          - "Applies corrected fields from payload (county_fips, street_number, is_citizen) when present"
          - "increments VoterRegistration.version by 1"
      - from: [PENDING, NEEDS_REVIEW]
        to: REJECTED
        trigger: "POST /registrations/{id}/transition with target_status=REJECTED"
        actor: ElectionOfficial
        preconditions:
          - "VoterRegistration.status IN {PENDING, NEEDS_REVIEW}"
        side_effects:
          - "Sets reviewed_by_user_id = acting X-User-ID"
          - "increments VoterRegistration.version by 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /registrations/{id}/transition with target_status=WITHDRAWN"
        actor: ElectionOfficial
        preconditions:
          - "VoterRegistration.status == ACTIVE"
          - "no AbsenteeBallot for this registration has request_status IN {ISSUED, RETURNED, ACCEPTED}"
        side_effects:
          - "Assigned Precinct.assigned_count -= 1; recompute its capacity_posture (compensating action restoring precinct headroom)"
          - "Election.total_registered recomputed"
          - "increments VoterRegistration.version by 1"

  - entity: AbsenteeBallot
    field: "request_status × cure_status (parallel dimensions)"
    initial_state: "request_status=REQUESTED, cure_status=NONE"
    terminal_states: ["request_status=ACCEPTED", "request_status=REJECTED"]
    note: "Two independent dimensions evolve on the same row: request_status (logistics) and cure_status (signature adjudication, driven by the CureCase machine)."
    transitions:
      - from: "request_status=REQUESTED"
        to: "request_status=ISSUED"
        trigger: "POST /absentee-ballots/{id}/transition with target_request_status=ISSUED"
        actor: ElectionOfficial
        preconditions:
          - "AbsenteeBallot.request_status == REQUESTED"
          - "linked VoterRegistration.status == ACTIVE"
        side_effects:
          - "increments AbsenteeBallot.version by 1"
      - from: "request_status=ISSUED"
        to: "request_status=RETURNED"
        trigger: "POST /absentee-ballots/{id}/transition with target_request_status=RETURNED"
        actor: ElectionOfficial
        preconditions:
          - "AbsenteeBallot.request_status == ISSUED"
          - "ClockState.current_utc < Election.election_date"
        side_effects:
          - "Sets returned_at = ClockState.current_utc"
          - "increments AbsenteeBallot.version by 1"
      - from: "request_status=RETURNED"
        to: "request_status=ACCEPTED"
        trigger: "POST /absentee-ballots/{id}/transition with target_request_status=ACCEPTED"
        actor: ElectionOfficial
        preconditions:
          - "AbsenteeBallot.request_status == RETURNED"
          - "AbsenteeBallot.cure_status IN {NONE, CURED}"
        side_effects:
          - "Election.total_ballots_accepted recomputed"
          - "increments AbsenteeBallot.version by 1"
      - from: "cure_status=NONE (request_status=RETURNED)"
        to: "cure_status=FLAGGED"
        trigger: "POST /absentee-ballots/{id}/flag-cure"
        actor: ElectionOfficial
        preconditions:
          - "AbsenteeBallot.request_status == RETURNED"
          - "AbsenteeBallot.cure_status == NONE"
        side_effects:
          - "Opens a CureCase(status=OPEN) for this ballot (cross-aggregate cascade)"
          - "increments AbsenteeBallot.version by 1"
      - from: "cure_status=FLAGGED"
        to: "cure_status=CURE_PENDING"
        trigger: "system (CureCase OPEN -> RESPONSE_SUBMITTED)"
        actor: system
        preconditions:
          - "AbsenteeBallot.cure_status == FLAGGED"
        side_effects:
          - "increments AbsenteeBallot.version by 1"
      - from: "cure_status=CURE_PENDING"
        to: "cure_status=CURED"
        trigger: "system (CureCase RESPONSE_SUBMITTED -> APPROVED)"
        actor: system
        preconditions:
          - "AbsenteeBallot.cure_status == CURE_PENDING"
        side_effects:
          - "increments AbsenteeBallot.version by 1"
      - from: "cure_status=CURE_PENDING"
        to: "cure_status=CURE_FAILED"
        trigger: "system (CureCase DENIED or EXPIRED)"
        actor: system
        preconditions:
          - "AbsenteeBallot.cure_status == CURE_PENDING"
        side_effects:
          - "Sets request_status=REJECTED (cross-dimension cascade: a failed cure rejects the request)"
          - "increments AbsenteeBallot.version by 1"

  - entity: CureCase
    field: status
    initial_state: OPEN
    terminal_states: [APPROVED, DENIED, EXPIRED]
    note: "Drives the AbsenteeBallot.cure_status dimension via cross-aggregate side effects."
    transitions:
      - from: OPEN
        to: RESPONSE_SUBMITTED
        trigger: "POST /cure-cases/{id}/transition with decision=SUBMIT_RESPONSE"
        actor: "Voter or ElectionOfficial"
        preconditions:
          - "CureCase.status == OPEN"
          - "ClockState.current_utc < Election.cure_deadline"
        side_effects:
          - "Linked AbsenteeBallot.cure_status FLAGGED -> CURE_PENDING (cross-aggregate)"
          - "Sets voter_response_text from payload"
          - "increments CureCase.version by 1"
      - from: RESPONSE_SUBMITTED
        to: APPROVED
        trigger: "POST /cure-cases/{id}/transition with decision=APPROVE"
        actor: ElectionOfficial
        preconditions:
          - "CureCase.status == RESPONSE_SUBMITTED"
          - "ClockState.current_utc < Election.cure_deadline"
          - "acting X-User-ID != linked VoterRegistration.reviewed_by_user_id (segregation of duties)"
        side_effects:
          - "Sets adjudicated_by_user_id = acting X-User-ID"
          - "Linked AbsenteeBallot.cure_status CURE_PENDING -> CURED (cross-aggregate)"
          - "increments CureCase.version by 1"
      - from: RESPONSE_SUBMITTED
        to: DENIED
        trigger: "POST /cure-cases/{id}/transition with decision=DENY"
        actor: ElectionOfficial
        preconditions:
          - "CureCase.status == RESPONSE_SUBMITTED"
          - "acting X-User-ID != linked VoterRegistration.reviewed_by_user_id (segregation of duties)"
        side_effects:
          - "Sets adjudicated_by_user_id = acting X-User-ID"
          - "Linked AbsenteeBallot.cure_status CURE_PENDING -> CURE_FAILED, which itself sets that ballot.request_status -> REJECTED (depth-3 cascade)"
          - "increments CureCase.version by 1"
      - from: [OPEN, RESPONSE_SUBMITTED]
        to: EXPIRED
        trigger: "system (close-polls sweep when ClockState.current_utc >= Election.cure_deadline)"
        actor: system
        preconditions:
          - "CureCase.status IN {OPEN, RESPONSE_SUBMITTED}"
          - "ClockState.current_utc >= Election.cure_deadline"
        side_effects:
          - "Linked AbsenteeBallot.cure_status -> CURE_FAILED, which itself sets that ballot.request_status -> REJECTED (depth-3 cascade)"
          - "increments CureCase.version by 1"

  - entity: VotingMachine
    field: status
    initial_state: OPERATIONAL
    terminal_states: [RETIRED]
    note: "Cyclic — a FAILED machine can be repaired back to OPERATIONAL (FAILED -> OPERATIONAL loop)."
    transitions:
      - from: OPERATIONAL
        to: FAILED
        trigger: "POST /machine-failures"
        actor: PollWorker
        preconditions:
          - "VotingMachine.status == OPERATIONAL"
          - "VotingMachine.role == PRIMARY"
        side_effects:
          - "Creates a MachineFailure row"
          - "Runs backup_selector over idle OPERATIONAL BACKUP machines in the same precinct"
          - "On hit: the selected BACKUP's backup_for_machine_id := this machine.id; MachineFailure.backup_machine_id set; resolution=BACKUP_ACTIVATED"
          - "On miss: resolution=NO_BACKUP_AVAILABLE (the failure is still recorded)"
          - "increments VotingMachine.version by 1"
      - from: FAILED
        to: OPERATIONAL
        trigger: "POST /voting-machines/{id}/transition with target_status=OPERATIONAL"
        actor: PollWorker
        preconditions:
          - "VotingMachine.status == FAILED"
        side_effects:
          - "If a BACKUP machine has backup_for_machine_id == this.id, that backup's backup_for_machine_id is cleared (compensating action releasing the backup)"
          - "increments VotingMachine.version by 1"
      - from: FAILED
        to: REPLACED
        trigger: "POST /voting-machines/{id}/transition with target_status=REPLACED"
        actor: PollWorker
        preconditions:
          - "VotingMachine.status == FAILED"
        side_effects:
          - "increments VotingMachine.version by 1"
      - from: [OPERATIONAL, FAILED, REPLACED]
        to: RETIRED
        trigger: "POST /voting-machines/{id}/transition with target_status=RETIRED"
        actor: ElectionAdmin
        preconditions:
          - "VotingMachine.status IN {OPERATIONAL, FAILED, REPLACED}"
          - "this machine is not currently the active backup of any FAILED machine (no VotingMachine with backup_for_machine_id == this.id whose covered machine is still FAILED)"
        side_effects:
          - "increments VotingMachine.version by 1"

  - entity: RecountCase
    field: status
    initial_state: REQUESTED
    terminal_states: [CERTIFIED, DISMISSED]
    note: "Fork-join — two independent tally passes (machine, hand) must both complete before BOTH_DONE; certify and dismiss are the divergent join branches."
    transitions:
      - from: REQUESTED
        to: MACHINE_DONE
        trigger: "POST /recount-cases/{id}/submit-pass with pass=MACHINE"
        actor: Canvasser
        preconditions:
          - "RecountCase.status == REQUESTED"
          - "acting X-User-ID != Precinct.tally_recorded_by_user_id (segregation of duties)"
        side_effects:
          - "Sets machine_recount = payload count"
          - "increments RecountCase.version by 1"
      - from: REQUESTED
        to: HAND_DONE
        trigger: "POST /recount-cases/{id}/submit-pass with pass=HAND"
        actor: Canvasser
        preconditions:
          - "RecountCase.status == REQUESTED"
          - "acting X-User-ID != Precinct.tally_recorded_by_user_id (segregation of duties)"
        side_effects:
          - "Sets hand_recount = payload count"
          - "increments RecountCase.version by 1"
      - from: MACHINE_DONE
        to: BOTH_DONE
        trigger: "POST /recount-cases/{id}/submit-pass with pass=HAND"
        actor: Canvasser
        preconditions:
          - "RecountCase.status == MACHINE_DONE"
          - "acting X-User-ID != Precinct.tally_recorded_by_user_id (segregation of duties)"
        side_effects:
          - "Sets hand_recount = payload count (join point — both passes present)"
          - "increments RecountCase.version by 1"
      - from: HAND_DONE
        to: BOTH_DONE
        trigger: "POST /recount-cases/{id}/submit-pass with pass=MACHINE"
        actor: Canvasser
        preconditions:
          - "RecountCase.status == HAND_DONE"
          - "acting X-User-ID != Precinct.tally_recorded_by_user_id (segregation of duties)"
        side_effects:
          - "Sets machine_recount = payload count (join point — both passes present)"
          - "increments RecountCase.version by 1"
      - from: BOTH_DONE
        to: CERTIFIED
        trigger: "POST /recount-cases/{id}/transition with target_status=CERTIFIED"
        actor: ElectionAdmin
        preconditions:
          - "RecountCase.status == BOTH_DONE"
        side_effects:
          - "Runs recount_certification calc; sets certified_count"
          - "Precinct.reported_vote_count := certified_count (cross-aggregate ledger write)"
          - "increments RecountCase.version by 1"
      - from: [REQUESTED, MACHINE_DONE, HAND_DONE, BOTH_DONE]
        to: DISMISSED
        trigger: "POST /recount-cases/{id}/transition with target_status=DISMISSED"
        actor: ElectionAdmin
        preconditions:
          - "RecountCase.status IN {REQUESTED, MACHINE_DONE, HAND_DONE, BOTH_DONE}"
        side_effects:
          - "Precinct.reported_vote_count is left at its original_count (no change)"
          - "increments RecountCase.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: ballot-request-stale-registration
    parent_entity: VoterRegistration
    write_endpoint: "POST /absentee-ballots"
    occ_field: "expected_registration_version"
    description: |
      Creating an AbsenteeBallot against a VoterRegistration whose version has
      advanced since the client last observed it is rejected with a stale-version
      error. A prior writer may have withdrawn the registration (which legitimately
      releases precinct headroom and forbids further ballot requests under the
      product spec), so the current writer's view of the registration is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: machine-failure-stale-machine
    parent_entity: VotingMachine
    write_endpoint: "POST /machine-failures"
    occ_field: "expected_machine_version"
    description: |
      Reporting a failure against a VotingMachine whose version has advanced since
      the client last observed it is rejected. A prior writer may have already
      reported the failure and triggered backup activation (a legitimate supersede
      of the machine's operational state under the product spec); the current
      report carries a stale machine version and is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: voter_age_eligibility
    trigger: "On POST /registrations/{id}/approve (eligibility gate)"
    algorithm: threshold
    formula: |
      # Completed-years age as of election_date using calendar arithmetic (NOT day-count division),
      # i.e. the count of full birthdays on or before election_date.
      age_years = election_date.year - dob.year
                  - (1 if (election_date.month, election_date.day) < (dob.month, dob.day) else 0)
      eligible_age = age_years >= VOTING_AGE
    input_set: "Single VoterRegistration vs its Election.election_date (the as-of date, NOT the simulated clock)."
    constants:
      VOTING_AGE: 18
    precision: "Integer completed years; comparison is >= . A voter whose 18th birthday falls exactly on election_date IS eligible (their (month,day) equals election_date's, so no decrement). One day later is NOT (age_years == 17)."
    variants: []

  - name: precinct_selector
    trigger: "On POST /registrations/{id}/approve (precinct assignment)"
    algorithm: selector_policy
    formula: |
      candidates = Precinct WHERE election_id == reg.election_id
                            AND county_fips == reg.county_fips
                            AND street_low <= reg.street_number <= street_high   # inclusive both ends
                            AND capacity_posture == OPEN
      rank by (assigned_count ASC)            # fill the emptiest precinct first
      tie-break by (max_registrations DESC)   # then the precinct with the most headroom
      tie-break by (created_at ASC)           # then the oldest precinct
      selected = first candidate
      fallback: if no candidate satisfies the street/county filter -> ERR_NO_PRECINCT_MATCH;
                if candidates match the filter but ALL are FULL -> ERR_PRECINCT_FULL
    input_set: "Precincts of the registration's election whose street range covers the voter."
    constants: {}
    precision: "Integer counts; deterministic ordering with created_at ASC final tie-break (never id)."
    variants: []

  - name: backup_selector
    trigger: "On POST /machine-failures (selecting a BACKUP to activate)"
    algorithm: selector_policy
    formula: |
      candidates = VotingMachine WHERE precinct_id == failed.precinct_id
                                 AND role == BACKUP
                                 AND status == OPERATIONAL
                                 AND backup_for_machine_id == null
      rank by (capacity DESC)        # activate the highest-throughput backup first
      tie-break by (created_at ASC)  # then the oldest backup
      selected = first candidate
      fallback: if candidates empty -> resolution = NO_BACKUP_AVAILABLE (NOT an error; the failure row is still created)
    input_set: "Idle OPERATIONAL BACKUP machines in the failed machine's precinct."
    constants: {}
    precision: "Integer capacity; deterministic ordering with created_at ASC final tie-break (never id)."
    variants: []

  - name: recount_certification
    trigger: "On POST /recount-cases/{id}/transition with target_status=CERTIFIED"
    algorithm: threshold
    formula: |
      delta = abs(machine_recount - hand_recount)
      if delta <= DISCREPANCY_TOLERANCE:
          certified_count = hand_recount                       # hand count governs within tolerance
      else:
          certified_count = min(machine_recount, hand_recount) # conservative: lower of the two when divergent
    input_set: "The two recount passes (machine_recount, hand_recount) on a single RecountCase."
    constants:
      DISCREPANCY_TOLERANCE: 5
    precision: "Integer votes; comparison is <= (a delta of exactly 5 is within tolerance)."
    variants:
      - name: within_tolerance
        when: "abs(machine_recount - hand_recount) <= 5"
        difference: "certified_count = hand_recount"
      - name: outside_tolerance
        when: "abs(machine_recount - hand_recount) > 5"
        difference: "certified_count = min(machine_recount, hand_recount)"

  - name: turnout_rate
    trigger: "On GET /elections/{id} (computed fields turnout_pct + projected_turnout_pct); recomputed on every ballot transition / early-vote check-in"
    algorithm: aggregation
    formula: |
      in_person = count(distinct VoterRegistration.id WHERE election_id == e.id AND early_voted_at != null)
      # FINAL variant (turnout_pct): only ballots whose request has been ACCEPTED count.
      final_absentee = count(AbsenteeBallot WHERE election_id == e.id AND request_status == ACCEPTED)
      final_cast = final_absentee + in_person
      # PROJECTED variant (projected_turnout_pct): ballots in hand (RETURNED or ACCEPTED) count,
      #   because a RETURNED ballot is physically received though not yet adjudicated.
      projected_absentee = count(AbsenteeBallot WHERE election_id == e.id AND request_status IN {RETURNED, ACCEPTED})
      projected_cast = projected_absentee + in_person
      if e.total_registered == 0:
          turnout_pct = 0.00 ; projected_turnout_pct = 0.00
      else:
          turnout_pct           = round( final_cast     / e.total_registered * 100, ROUND_DP, round_half_up )
          projected_turnout_pct = round( projected_cast / e.total_registered * 100, ROUND_DP, round_half_up )
    input_set: "Absentee ballots of the election (filtered by request_status per variant) + voters with a non-null early_voted_at; denominator is ACTIVE registrations (total_registered)."
    constants:
      ROUND_DP: 2
    precision: "2 decimal places, round_half_up; total_registered==0 yields 0.00 (no division by zero)."
    variants:
      - name: final_turnout
        when: "Reported as turnout_pct"
        difference: "Numerator counts only request_status == ACCEPTED absentee ballots (adjudicated, final)."
      - name: projected_turnout
        when: "Reported as projected_turnout_pct"
        difference: "Numerator counts request_status IN {RETURNED, ACCEPTED} absentee ballots (in-hand, includes not-yet-adjudicated returns); for identical data projected_turnout_pct >= turnout_pct whenever any ballot is RETURNED but not ACCEPTED."

  - name: cure_window_status
    trigger: "On POST /cure-cases/{id}/transition (decision SUBMIT_RESPONSE/APPROVE) and on the close-polls cure sweep"
    algorithm: threshold
    formula: |
      window_open = ClockState.current_utc < Election.cure_deadline   # strict <: at the exact deadline the window is CLOSED
      status = "OPEN" if window_open else "CLOSED"
    input_set: "One CureCase's Election.cure_deadline vs the simulated clock."
    constants: {}
    precision: "Comparison is strict < ; at current_utc == cure_deadline the window is CLOSED (boundary edge)."
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per §1.7."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists, validated left-to-right."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id or FK body field"

  - priority: 4
    category: state
    check: "Target resource is in a valid state for the requested transition."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition/action endpoints"

  - priority: 5
    category: business_safety
    check: "Segregation of duties: acting X-User-ID must differ from the user bound to the conflicting prior step (registration reviewer for cure adjudication; precinct tally recorder for recount passes)."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /cure-cases/{id}/transition (APPROVE/DENY), POST /recount-cases/{id}/submit-pass"

  - priority: 6
    category: business_temporal
    check: "The operation is inside its time window (approval before registration_deadline; absentee request before absentee_request_deadline; cure submit/approve before cure_deadline; early-vote check-in within [early_voting_start, early_voting_end))."
    error_id: ERR_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /registrations/{id}/approve, POST /absentee-ballots, POST /early-vote-checkins"

  - priority: 7
    category: business_temporal
    check: "Cure-specific window: cure submit/approve before Election.cure_deadline (boundary: == deadline is closed)."
    error_id: ERR_CURE_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /cure-cases/{id}/transition (SUBMIT_RESPONSE/APPROVE)"

  - priority: 8
    category: business_constraint
    check: "Eligibility: is_citizen == true."
    error_id: ERR_NOT_CITIZEN
    http_status: 422
    applies_to: "POST /registrations/{id}/approve"

  - priority: 9
    category: business_constraint
    check: "Eligibility: age_years (voter_age_eligibility) >= VOTING_AGE."
    error_id: ERR_UNDERAGE
    http_status: 422
    applies_to: "POST /registrations/{id}/approve"

  - priority: 10
    category: business_constraint
    check: "Residency: at least one Precinct of the election covers the voter's county_fips and street_number (checked before capacity)."
    error_id: ERR_NO_PRECINCT_MATCH
    http_status: 422
    applies_to: "POST /registrations/{id}/approve"

  - priority: 11
    category: business_constraint
    check: "Registration referenced is ACTIVE (absentee request) / ACTIVE (early-vote check-in)."
    error_id: ERR_REGISTRATION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /absentee-ballots, POST /early-vote-checkins"

  - priority: 12
    category: business_constraint
    check: "Accept guard: AbsenteeBallot.cure_status IN {NONE, CURED} (a flagged/pending/failed cure blocks acceptance)."
    error_id: ERR_BALLOT_NOT_CURED
    http_status: 409
    applies_to: "POST /absentee-ballots/{id}/transition (ACCEPTED)"

  - priority: 13
    category: business_constraint
    check: "Uniqueness: no other VoterRegistration with the same (election_id, national_id) in status IN {PENDING, NEEDS_REVIEW, ACTIVE}."
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: "POST /registrations"

  - priority: 14
    category: business_constraint
    check: "Double-vote guard: the registration has no prior early_voted_at and no AbsenteeBallot with request_status IN {ISSUED, RETURNED, ACCEPTED}."
    error_id: ERR_ALREADY_VOTED
    http_status: 409
    applies_to: "POST /early-vote-checkins"

  - priority: 15
    category: business_constraint
    check: "Withdraw guard: no AbsenteeBallot for the registration is ISSUED/RETURNED/ACCEPTED."
    error_id: ERR_BALLOT_BLOCKS_WITHDRAW
    http_status: 409
    applies_to: "POST /registrations/{id}/transition (WITHDRAWN)"

  - priority: 16
    category: business_constraint
    check: "Recount precondition: the precinct's tally_status == TALLIED."
    error_id: ERR_PRECINCT_NOT_TALLIED
    http_status: 409
    applies_to: "POST /recount-cases"

  - priority: 17
    category: business_constraint
    check: "Retire guard: machine is not the active backup of a still-FAILED machine."
    error_id: ERR_BACKUP_IN_USE
    http_status: 409
    applies_to: "POST /voting-machines/{id}/transition (RETIRED)"

  - priority: 18
    category: business_fiscal
    check: "Capacity: the selected Precinct.capacity_posture == OPEN (assigned_count < max_registrations) at approval (checked after residency match)."
    error_id: ERR_PRECINCT_FULL
    http_status: 409
    applies_to: "POST /registrations/{id}/approve"

  - priority: 19
    category: business_referential
    check: "OCC: expected_<parent>_version matches the live parent version (§1.2.1)."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /absentee-ballots, POST /machine-failures"

  - priority: 20
    category: business_constraint
    check: "Body shape: required fields present, enums in range, numbers satisfy declared constraints (e.g. max_registrations >= 1, street_high >= street_low)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Election ----
  - method: POST
    path: "/elections"
    description: "Create an election."
    roles: [ElectionAdmin]
    code: 201
    input: [name, election_date, registration_deadline, absentee_request_deadline, cure_deadline, early_voting_start, early_voting_end]
    output: Election
    side_effects: []
  - method: GET
    path: "/elections/{id}"
    description: "Fetch one election (includes computed total_registered, total_ballots_accepted, turnout_pct)."
    roles: [ElectionAdmin, ElectionOfficial, Canvasser, PollWorker]
    code: 200
    input: []
    output: Election
    side_effects: []
  - method: GET
    path: "/elections"
    description: "List elections (paginated)."
    roles: [ElectionAdmin, ElectionOfficial, Canvasser, PollWorker]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Election[]
    side_effects: []
  - method: POST
    path: "/elections/{id}/transition"
    description: "Drive Election lifecycle (REGISTRATION_OPEN / VOTING_OPEN / POLLS_CLOSED / CERTIFIED). POLLS_CLOSED runs the cure sweep."
    roles: [ElectionAdmin]
    code: 200
    input: [target_status]
    output: Election
    side_effects:
      - "On POLLS_CLOSED: expires past-deadline CureCases; cascades cure_status=CURE_FAILED and request_status=REJECTED on their ballots"
      - "increments Election.version by 1"

  # ---- Precinct ----
  - method: POST
    path: "/precincts"
    description: "Create a precinct under an election."
    roles: [ElectionAdmin]
    code: 201
    input: [election_id, code, county_fips, street_low, street_high, max_registrations]
    output: Precinct
    side_effects: []
  - method: GET
    path: "/precincts/{id}"
    description: "Fetch one precinct (includes assigned_count, capacity_posture)."
    roles: [ElectionAdmin, ElectionOfficial, Canvasser, PollWorker]
    code: 200
    input: []
    output: Precinct
    side_effects: []
  - method: GET
    path: "/precincts"
    description: "List precincts, optionally filtered by election_id."
    roles: [ElectionAdmin, ElectionOfficial, Canvasser, PollWorker]
    code: 200
    input: ["election_id?", "limit?", "offset?"]
    output: Precinct[]
    side_effects: []
  - method: POST
    path: "/precincts/{id}/tally"
    description: "Record the precinct's in-person tally; PENDING -> TALLIED."
    roles: [Canvasser]
    code: 200
    input: [reported_vote_count]
    output: Precinct
    side_effects:
      - "Precinct.tally_status -> TALLIED"
      - "Sets tally_recorded_by_user_id = acting X-User-ID (recount segregation key)"
      - "increments Precinct.version by 1"

  # ---- VoterRegistration ----
  - method: POST
    path: "/registrations"
    description: "Submit a voter registration (status=PENDING)."
    roles: [ElectionOfficial, Voter]
    code: 201
    input: [election_id, first_name, last_name, national_id, is_citizen, date_of_birth, county_fips, street_number, "party?"]
    output: VoterRegistration
    side_effects: []
  - method: GET
    path: "/registrations/{id}"
    description: "Fetch one registration."
    roles: [ElectionAdmin, ElectionOfficial, Voter]
    code: 200
    input: []
    output: VoterRegistration
    side_effects: []
  - method: GET
    path: "/registrations"
    description: "List registrations, optionally filtered by election_id, precinct_id, or status."
    roles: [ElectionAdmin, ElectionOfficial]
    code: 200
    input: ["election_id?", "precinct_id?", "status?", "limit?", "offset?"]
    output: VoterRegistration[]
    side_effects: []
  - method: POST
    path: "/registrations/{id}/approve"
    description: "Eligibility + capacity gate; assigns precinct; PENDING -> ACTIVE."
    roles: [ElectionOfficial]
    code: 200
    input: []
    output: VoterRegistration
    side_effects:
      - "Runs voter_age_eligibility + precinct_selector"
      - "Sets precinct_id, reviewed_by_user_id"
      - "Selected Precinct.assigned_count += 1; recompute capacity_posture"
      - "Election.total_registered recomputed"
      - "increments VoterRegistration.version by 1"
  - method: POST
    path: "/registrations/{id}/transition"
    description: "Non-approval registration transitions (NEEDS_REVIEW / PENDING / REJECTED / WITHDRAWN); PENDING resubmit may carry corrected fields."
    roles: [ElectionOfficial]
    code: 200
    input: [target_status, "county_fips?", "street_number?", "is_citizen?"]
    output: VoterRegistration
    side_effects:
      - "WITHDRAWN: Precinct.assigned_count -= 1; recompute capacity_posture; Election.total_registered recomputed"
      - "PENDING (resubmit): applies corrected fields"
      - "increments VoterRegistration.version by 1"

  # ---- AbsenteeBallot ----
  - method: POST
    path: "/absentee-ballots"
    description: "Request an absentee ballot for an ACTIVE registration (OCC on the registration)."
    roles: [ElectionOfficial, Voter]
    code: 201
    input: [registration_id, mailing_address, expected_registration_version]
    output: AbsenteeBallot
    side_effects:
      - "Copies election_id, precinct_id from the registration"
      - "increments VoterRegistration.version by 1 (OCC parent advances so the next stale request fails)"
  - method: GET
    path: "/absentee-ballots/{id}"
    description: "Fetch one absentee ballot (both status dimensions)."
    roles: [ElectionAdmin, ElectionOfficial, Voter]
    code: 200
    input: []
    output: AbsenteeBallot
    side_effects: []
  - method: GET
    path: "/absentee-ballots"
    description: "List absentee ballots, optionally filtered by registration_id, election_id, precinct_id, request_status, or cure_status."
    roles: [ElectionAdmin, ElectionOfficial]
    code: 200
    input: ["registration_id?", "election_id?", "precinct_id?", "request_status?", "cure_status?", "limit?", "offset?"]
    output: AbsenteeBallot[]
    side_effects: []
  - method: POST
    path: "/absentee-ballots/{id}/transition"
    description: "Request-dimension transitions (ISSUED / RETURNED / ACCEPTED). ACCEPTED requires cure_status IN {NONE, CURED}."
    roles: [ElectionOfficial]
    code: 200
    input: [target_request_status]
    output: AbsenteeBallot
    side_effects:
      - "RETURNED: sets returned_at"
      - "ACCEPTED: Election.total_ballots_accepted recomputed"
      - "increments AbsenteeBallot.version by 1"
  - method: POST
    path: "/absentee-ballots/{id}/flag-cure"
    description: "cure_status NONE -> FLAGGED; opens a CureCase (only for a RETURNED ballot)."
    roles: [ElectionOfficial]
    code: 200
    input: [reason]
    output: AbsenteeBallot
    side_effects: ["Creates CureCase(status=OPEN)", "increments AbsenteeBallot.version by 1"]

  # ---- CureCase ----
  - method: GET
    path: "/cure-cases/{id}"
    description: "Fetch one cure case."
    roles: [ElectionAdmin, ElectionOfficial, Voter]
    code: 200
    input: []
    output: CureCase
    side_effects: []
  - method: GET
    path: "/cure-cases"
    description: "List cure cases, optionally filtered by ballot_id, election_id, or status."
    roles: [ElectionAdmin, ElectionOfficial]
    code: 200
    input: ["ballot_id?", "election_id?", "status?", "limit?", "offset?"]
    output: CureCase[]
    side_effects: []
  - method: POST
    path: "/cure-cases/{id}/transition"
    description: "Cure decisions: SUBMIT_RESPONSE (OPEN->RESPONSE_SUBMITTED), APPROVE (->APPROVED), DENY (->DENIED). Segregation enforced on APPROVE/DENY."
    roles: [Voter, ElectionOfficial]
    code: 200
    input: [decision, "voter_response_text?"]
    output: CureCase
    side_effects:
      - "SUBMIT_RESPONSE: ballot cure_status FLAGGED -> CURE_PENDING; sets voter_response_text"
      - "APPROVE: sets adjudicated_by_user_id; ballot cure_status -> CURED"
      - "DENY: sets adjudicated_by_user_id; ballot cure_status -> CURE_FAILED then request_status -> REJECTED"
      - "increments CureCase.version by 1"

  # ---- VotingMachine + MachineFailure ----
  - method: POST
    path: "/voting-machines"
    description: "Register a voting machine (PRIMARY or BACKUP) at a precinct."
    roles: [ElectionAdmin]
    code: 201
    input: [precinct_id, serial, "role?", capacity]
    output: VotingMachine
    side_effects: []
  - method: GET
    path: "/voting-machines/{id}"
    description: "Fetch one voting machine."
    roles: [ElectionAdmin, PollWorker]
    code: 200
    input: []
    output: VotingMachine
    side_effects: []
  - method: GET
    path: "/voting-machines"
    description: "List voting machines, optionally filtered by precinct_id, backup_for_machine_id, status, or role."
    roles: [ElectionAdmin, PollWorker]
    code: 200
    input: ["precinct_id?", "backup_for_machine_id?", "status?", "role?", "limit?", "offset?"]
    output: VotingMachine[]
    side_effects: []
  - method: POST
    path: "/voting-machines/{id}/transition"
    description: "Machine lifecycle: OPERATIONAL (repair, FAILED->OPERATIONAL), REPLACED, RETIRED. Repair releases the covering backup."
    roles: [PollWorker, ElectionAdmin]
    code: 200
    input: [target_status]
    output: VotingMachine
    side_effects:
      - "OPERATIONAL (repair): clears the covering backup's backup_for_machine_id"
      - "increments VotingMachine.version by 1"
  - method: POST
    path: "/machine-failures"
    description: "Report a PRIMARY machine failure; runs backup_selector (OCC on the machine)."
    roles: [PollWorker]
    code: 201
    input: [machine_id, expected_machine_version]
    output: MachineFailure
    side_effects:
      - "Machine.status OPERATIONAL -> FAILED"
      - "Runs backup_selector; on hit activates a backup (sets its backup_for_machine_id) and sets resolution=BACKUP_ACTIVATED; on miss sets resolution=NO_BACKUP_AVAILABLE"
      - "increments VotingMachine.version by 1"
  - method: GET
    path: "/machine-failures/{id}"
    description: "Fetch one machine failure (includes backup_machine_id, resolution)."
    roles: [ElectionAdmin, PollWorker]
    code: 200
    input: []
    output: MachineFailure
    side_effects: []
  - method: GET
    path: "/machine-failures"
    description: "List machine failures, optionally filtered by machine_id or backup_machine_id."
    roles: [ElectionAdmin, PollWorker]
    code: 200
    input: ["machine_id?", "backup_machine_id?", "limit?", "offset?"]
    output: MachineFailure[]
    side_effects: []

  # ---- EarlyVoteCheckIn ----
  - method: POST
    path: "/early-vote-checkins"
    description: "Record an in-person early vote for an ACTIVE registration within the early-voting window."
    roles: [PollWorker]
    code: 201
    input: [registration_id]
    output: EarlyVoteCheckIn
    side_effects:
      - "Copies precinct_id from the registration"
      - "Sets the registration's early_voted_at = ClockState.current_utc"
  - method: GET
    path: "/early-vote-checkins/{id}"
    description: "Fetch one early-vote check-in."
    roles: [ElectionAdmin, Canvasser, PollWorker]
    code: 200
    input: []
    output: EarlyVoteCheckIn
    side_effects: []
  - method: GET
    path: "/early-vote-checkins"
    description: "List early-vote check-ins, optionally filtered by registration_id or precinct_id."
    roles: [ElectionAdmin, Canvasser, PollWorker]
    code: 200
    input: ["registration_id?", "precinct_id?", "limit?", "offset?"]
    output: EarlyVoteCheckIn[]
    side_effects: []

  # ---- RecountCase ----
  - method: POST
    path: "/recount-cases"
    description: "Open a recount on a TALLIED precinct (snapshots original_count)."
    roles: [ElectionAdmin]
    code: 201
    input: [election_id, precinct_id]
    output: RecountCase
    side_effects: ["original_count := Precinct.reported_vote_count"]
  - method: GET
    path: "/recount-cases/{id}"
    description: "Fetch one recount case."
    roles: [ElectionAdmin, Canvasser]
    code: 200
    input: []
    output: RecountCase
    side_effects: []
  - method: GET
    path: "/recount-cases"
    description: "List recount cases, optionally filtered by election_id, precinct_id, or status."
    roles: [ElectionAdmin, Canvasser]
    code: 200
    input: ["election_id?", "precinct_id?", "status?", "limit?", "offset?"]
    output: RecountCase[]
    side_effects: []
  - method: POST
    path: "/recount-cases/{id}/submit-pass"
    description: "Record a recount pass (pass=MACHINE or HAND); advances the fork-join status. Segregation enforced."
    roles: [Canvasser]
    code: 200
    input: [pass, count]
    output: RecountCase
    side_effects: ["Sets machine_recount or hand_recount; advances status toward BOTH_DONE", "increments RecountCase.version by 1"]
  - method: POST
    path: "/recount-cases/{id}/transition"
    description: "Recount join branch: CERTIFIED (writes certified_count back to the precinct) or DISMISSED (precinct count unchanged)."
    roles: [ElectionAdmin]
    code: 200
    input: [target_status]
    output: RecountCase
    side_effects:
      - "CERTIFIED: runs recount_certification; sets certified_count; Precinct.reported_vote_count := certified_count"
      - "increments RecountCase.version by 1"

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set"
    description: "Test-driving: set the simulated server clock used for all deadline comparisons."
    roles: [ElectionAdmin]
    code: 200
    input: [current_utc]
    output: ClockState
    side_effects: ["Sets ClockState.current_utc"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted for this endpoint."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced election/precinct/registration/ballot/cure-case/machine/recount does not exist."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, malformed value, enum out of range, or numeric constraint violated (e.g. max_registrations < 1, street_high < street_low, unknown target_status)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a valid state for the requested transition (wrong from-state for the target)."
  - id: ERR_WINDOW_CLOSED
    http: 422
    condition: "Operation outside its time window (registration_deadline / absentee_request_deadline passed, or early-vote outside [early_voting_start, early_voting_end))."
  - id: ERR_CURE_DEADLINE_PASSED
    http: 422
    condition: "Cure submit/approve at or after Election.cure_deadline (boundary: == deadline is closed)."
  - id: ERR_NOT_CITIZEN
    http: 422
    condition: "Approval attempted on a registration with is_citizen == false."
  - id: ERR_UNDERAGE
    http: 422
    condition: "Approval attempted on a registration whose age_years < VOTING_AGE (18) as of election_date."
  - id: ERR_NO_PRECINCT_MATCH
    http: 422
    condition: "No precinct of the election covers the voter's county_fips and street_number."
  - id: ERR_DUPLICATE_REGISTRATION
    http: 409
    condition: "Another registration with the same (election_id, national_id) exists in status IN {PENDING, NEEDS_REVIEW, ACTIVE}."
  - id: ERR_PRECINCT_FULL
    http: 409
    condition: "All residency-matching precincts have capacity_posture == FULL at approval time."
  - id: ERR_ALREADY_VOTED
    http: 409
    condition: "Early-vote check-in attempted when the voter already has early_voted_at set or an ISSUED/RETURNED/ACCEPTED absentee ballot."
  - id: ERR_REGISTRATION_NOT_ACTIVE
    http: 409
    condition: "Absentee request or early-vote check-in references a registration whose status != ACTIVE."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Acting X-User-ID equals the user bound to the conflicting prior step (registration reviewer for cure adjudication; tally recorder for recount passes)."
  - id: ERR_BALLOT_NOT_CURED
    http: 409
    condition: "Accept attempted while cure_status NOT IN {NONE, CURED} (FLAGGED/CURE_PENDING/CURE_FAILED)."
  - id: ERR_BALLOT_BLOCKS_WITHDRAW
    http: 409
    condition: "Withdraw attempted while an absentee ballot for the registration is ISSUED/RETURNED/ACCEPTED."
  - id: ERR_PRECINCT_NOT_TALLIED
    http: 409
    condition: "Recount opened on a precinct whose tally_status != TALLIED."
  - id: ERR_PRECINCTS_NOT_TALLIED
    http: 409
    condition: "Certify-election attempted while some precinct of the election is still PENDING."
  - id: ERR_RECOUNT_IN_PROGRESS
    http: 409
    condition: "Certify-election attempted while a non-terminal RecountCase exists for the election."
  - id: ERR_VOTING_NOT_OPEN
    http: 422
    condition: "open-voting attempted before early_voting_start, or close-polls before election_date."
  - id: ERR_BACKUP_IN_USE
    http: 409
    condition: "Retire attempted on a machine still serving as the active backup of a FAILED machine."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the live parent version (OCC)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ElectionAdmin
    description: "Configures elections, precincts, and machines; drives election lifecycle, recount certification, and machine retire."
    identity: opaque
    exclusive_operations:
      - "POST /elections and POST /elections/{id}/transition"
      - "POST /precincts"
      - "POST /voting-machines"
      - "POST /recount-cases and POST /recount-cases/{id}/transition"
      - "POST /_clock/set"
    shared_operations:
      - "POST /voting-machines/{id}/transition (RETIRED; shared with PollWorker)"
      - "GET reads on elections, precincts, registrations, ballots, cure-cases, machines, failures, recounts, check-ins"

  - name: ElectionOfficial
    description: "Adjudicates registrations and absentee ballots; opens and approves/denies cures. Segregation: cannot adjudicate a cure for a registration they reviewed."
    identity: opaque
    exclusive_operations:
      - "POST /registrations/{id}/approve"
      - "POST /registrations/{id}/transition"
      - "POST /absentee-ballots/{id}/transition"
      - "POST /absentee-ballots/{id}/flag-cure"
    shared_operations:
      - "POST /registrations (with Voter)"
      - "POST /absentee-ballots (with Voter)"
      - "POST /cure-cases/{id}/transition (with Voter for SUBMIT_RESPONSE)"
      - "GET reads on registrations, ballots, cure-cases, precincts, elections"

  - name: Voter
    description: "A registrant acting on their own registration and ballots. entity_backed by VoterRegistration: X-User-ID equals a VoterRegistration.id the voter owns."
    identity: "entity_backed:VoterRegistration"
    exclusive_operations: []
    shared_operations:
      - "POST /registrations (self-submit)"
      - "POST /absentee-ballots (own registration)"
      - "POST /cure-cases/{id}/transition (SUBMIT_RESPONSE on own ballot)"
      - "GET reads on own registration, ballots, cure-cases"

  - name: PollWorker
    description: "Operates polling places: reports machine failures, repairs/replaces machines, records early-vote check-ins."
    identity: opaque
    exclusive_operations:
      - "POST /machine-failures"
      - "POST /early-vote-checkins"
    shared_operations:
      - "POST /voting-machines/{id}/transition (OPERATIONAL/REPLACED; RETIRED shared with ElectionAdmin)"
      - "GET reads on precincts, voting-machines, machine-failures, early-vote-checkins, elections"

  - name: Canvasser
    description: "Records precinct tallies and performs recount passes. Segregation: cannot submit a recount pass for a precinct whose tally they recorded."
    identity: opaque
    exclusive_operations:
      - "POST /precincts/{id}/tally"
      - "POST /recount-cases/{id}/submit-pass"
    shared_operations:
      - "GET reads on precincts, recounts, early-vote-checkins, elections"
