            - { call: "GET /spirit-store/exchanges/00000000-0000-0000-0000-000000000000", payload: {}, as: Treasurer, captures: { e9: $.data.error_id } }
            - { call: "GET /spirit-store/activity-accounts/00000000-0000-0000-0000-000000000000", payload: {}, as: Treasurer, captures: { e10: $.data.error_id } }
            - { call: "GET /spirit-store/allocation-runs/00000000-0000-0000-0000-000000000000", payload: {}, as: Treasurer, captures: { e11: $.data.error_id } }
