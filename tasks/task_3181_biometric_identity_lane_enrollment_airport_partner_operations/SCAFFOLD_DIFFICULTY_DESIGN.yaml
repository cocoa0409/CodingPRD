  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_event_buffer_arithmetic_adjacent_vs_overlap
        grounds:
          - calculations.venue_event_conflict_check
          - errors[ERR_EVENT_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Interval semantics: buffer-padded half-open windows on VenueEvent.
          Event A 10:00-12:00 buffer 2 → padded [08:00, 14:00). Candidate B
          starting at 13:00 overlaps (13:00 < 14:00) → conflict; a candidate
          starting at exactly 14:00 touches the padded edge (14:00 == E.end)
          and is allowed even though the raw windows are only 2h apart.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Venue V (AGE_18_PLUS) with event A SCHEDULED 2026-10-10T10:00:00Z → 12:00:00Z, buffer_hours 2."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Arena V", venue_type: "ARENA", city: "Denver", state_code: "CO", access_rule_mode: "AGE_18_PLUS" }
              as: VenueOps
              captures: { ven_id: $.data.id }
            - call: "POST /venue-events"
              payload: { venue_id: "${ven_id}", name: "Event A", start_time: "2026-10-10T10:00:00Z", end_time: "2026-10-10T12:00:00Z", buffer_hours: 2 }
              as: VenueOps
              captures: { eva_id: $.data.id }
          trigger:
            - call: "POST /venue-events"
              payload: { venue_id: "${ven_id}", name: "Event B overlap", start_time: "2026-10-10T13:00:00Z", end_time: "2026-10-10T15:00:00Z", buffer_hours: 0 }
              as: VenueOps
              captures: { err: $.data.error_id }
            - call: "POST /venue-events"
              payload: { venue_id: "${ven_id}", name: "Event C adjacent", start_time: "2026-10-10T14:00:00Z", end_time: "2026-10-10T16:00:00Z", buffer_hours: 0 }
              as: VenueOps
              captures: { evc_id: $.data.id }
          assert:
            - "${err} == ERR_EVENT_WINDOW_CONFLICT (409) — B's padded start 13:00 falls inside A's padded window [08:00,14:00)"
            - "Event C created 201 (${evc_id} non-null) — padded start 14:00 == A's padded end touches the half-open edge without conflicting"
            - "VenueEvent.${evc_id}.status == SCHEDULED"

      - name: lane_daily_window_half_open_membership
