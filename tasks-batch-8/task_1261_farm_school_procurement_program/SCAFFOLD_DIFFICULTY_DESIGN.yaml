            - { call: "POST /f2s/planting-agreements/${agr}/sign", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/deliveries", payload: { agreement_id: "${agr}", kitchen_id: "${kit}", window_id: "${win}", delivery_date: "2026-08-10", quantity: 40 }, as: FarmManager, as_user_id: "${farm}", captures: { del: $.data.id } }
            - { call: "POST /f2s/deliveries/${del}/check-in", payload: {}, as: KitchenManager, as_user_id: "${kit}" }
          trigger:
            - { call: "POST /f2s/invoices", payload: { delivery_id: "${del}", invoice_number: "INV-X" }, as: FarmManager, as_user_id: "${farm}", captures: { err: $.data.error_id } }
          assert:
            - "Delivery.${del}.status == CHECKED_IN"
            - "error_id == ERR_DELIVERY_NOT_ACCEPTED"

  # ===========================================================================
  # Rule 8 - resource_temporal_overlap (half-open geometric exclusion on
  # ReceivingWindow vs aggregate-count capacity on Delivery - different
  # interval semantics on different resources)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: receiving_window_half_open_overlap
        grounds:
          - entities.ReceivingWindow.fields.start_minute
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open [start,end) interval semantics on ReceivingWindow: a new MON
          window 720-900 adjacent to existing 480-720 is ACCEPTED (end==start
          touches without overlapping), while 600-800 is rejected with
          ERR_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Kitchen with one MON receiving window 480-720 capacity 3"
          setup_api_calls:
            - { call: "POST /f2s/kitchens", payload: { name: "Lincoln ES" }, as: DistrictProgramAdmin, captures: { kit: $.data.id } }
            - { call: "POST /f2s/receiving-windows", payload: { kitchen_id: "${kit}", weekday: "MON", start_minute: 480, end_minute: 720, capacity_deliveries: 3 }, as: KitchenManager, as_user_id: "${kit}", captures: { win1: $.data.id } }
          trigger:
            - { call: "POST /f2s/receiving-windows", payload: { kitchen_id: "${kit}", weekday: "MON", start_minute: 720, end_minute: 900, capacity_deliveries: 2 }, as: KitchenManager, as_user_id: "${kit}", captures: { win2: $.data.id } }
            - { call: "POST /f2s/receiving-windows", payload: { kitchen_id: "${kit}", weekday: "MON", start_minute: 600, end_minute: 800, capacity_deliveries: 1 }, as: KitchenManager, as_user_id: "${kit}", captures: { err: $.data.error_id } }
          assert:
            - "Adjacent window created: ReceivingWindow.${win2} exists (720 == existing end 720 is allowed under half-open semantics)"
            - "Overlapping window rejected: error_id == ERR_WINDOW_OVERLAP (600 < 720 and 480 < 800)"

      - name: delivery_window_aggregate_capacity_semantics
        grounds:
          - entities.ReceivingWindow.fields.capacity_deliveries
          - errors[ERR_WINDOW_CAPACITY_FULL]
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on Delivery: two deliveries may
          occupy the SAME window on the SAME date (count-based sharing up to
          capacity_deliveries), in contrast to the geometric exclusion rule for
          windows themselves which rejects any overlap outright.
        test_recipe:
          setup:
            - "Standard chain through SIGNED agreement committed 200; MON window capacity 2"
          setup_api_calls:
            - { call: "POST /f2s/program-years", payload: { school_year_label: "Y1", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, preference_model: "TIERED", grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr: $.data.id } }
            - { call: "POST /f2s/program-years/${yr}/open", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/products", payload: { name: "Tomato", category: "PRODUCE", unit: "LB", season_start_week: 1, season_end_week: 20 }, as: DistrictProgramAdmin, captures: { prod: $.data.id } }
            - { call: "POST /f2s/farms", payload: { legal_name: "Green Acres", contact_email: "g@x.com", distance_miles_to_hub: 30, acres: 100 }, as: DistrictProgramAdmin, captures: { farm: $.data.id } }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "SAFETY_CERT", issuer: "StateAg", effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "LIABILITY_INSURANCE", issuer: "InsCo", coverage_cents: 600000, effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/farms/${farm}/approve", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/offerings", payload: { farm_id: "${farm}", program_year_id: "${yr}", product_id: "${prod}", price_cents_per_unit: 250, max_weekly_quantity: 500, harvest_start_week: 4, harvest_end_week: 12 }, as: FarmManager, as_user_id: "${farm}", captures: { off: $.data.id } }
            - { call: "POST /f2s/offerings/${off}/submit", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/offerings/${off}/verify", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/forecast-lines", payload: { program_year_id: "${yr}", product_id: "${prod}", week_number: 6, planned_quantity: 400 }, as: DistrictProgramAdmin }
            - { call: "POST /f2s/kitchens", payload: { name: "Lincoln ES" }, as: DistrictProgramAdmin, captures: { kit: $.data.id } }
            - { call: "POST /f2s/receiving-windows", payload: { kitchen_id: "${kit}", weekday: "MON", start_minute: 480, end_minute: 720, capacity_deliveries: 2 }, as: KitchenManager, as_user_id: "${kit}", captures: { win: $.data.id } }
            - { call: "POST /f2s/planting-agreements", payload: { program_year_id: "${yr}", offering_id: "${off}", committed_quantity: 200, harvest_start_week: 5, harvest_end_week: 10 }, as: DistrictProgramAdmin, captures: { agr: $.data.id } }
            - { call: "POST /f2s/planting-agreements/${agr}/sign", payload: {}, as: FarmManager, as_user_id: "${farm}" }
          trigger:
            - { call: "POST /f2s/deliveries", payload: { agreement_id: "${agr}", kitchen_id: "${kit}", window_id: "${win}", delivery_date: "2026-08-10", quantity: 40 }, as: FarmManager, as_user_id: "${farm}", captures: { d1: $.data.id } }
            - { call: "POST /f2s/deliveries", payload: { agreement_id: "${agr}", kitchen_id: "${kit}", window_id: "${win}", delivery_date: "2026-08-10", quantity: 40 }, as: FarmManager, as_user_id: "${farm}", captures: { d2: $.data.id } }
          assert:
            - "Both deliveries SCHEDULED in the same window+date (aggregate capacity admits sharing up to 2)"
            - "Delivery.${d1}.status == SCHEDULED AND Delivery.${d2}.status == SCHEDULED"

  # ===========================================================================
  # Rule 9 - compensating_invariant (grant cents conserved across
  # reconcile/reverse; agreement units conserved across accept/breach -
  # different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: grant_drawn_remaining_conservation
        grounds:
          - entities.ProgramYear.fields.grant_drawn_cents
          - entities.ProgramYear.fields.grant_remaining_cents
          - state_machines.ReimbursementClaim.AWARDED_to_RECONCILED
          - state_machines.ReimbursementClaim.RECONCILED_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity: grant cents. Forward action reconcile draws 10400
          (drawn 0 -> 10400, remaining 1000000 -> 989600); compensating action
          reverse restores (drawn 10400 -> 0, remaining -> 1000000). Invariant
          drawn + remaining == grant_award_cents holds after BOTH steps.
        test_recipe:
          setup:
            - "Claim RECONCILED-ready: two lines (claimed 10200 allowed; claimed 255 disallowed by 55 -> awarded 200); claim PARTIALLY_AWARDED, total_awarded 10400"
          setup_api_calls:
            - { call: "POST /f2s/program-years", payload: { school_year_label: "Y1", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, preference_model: "TIERED", grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr: $.data.id } }
            - { call: "POST /f2s/program-years/${yr}/open", payload: {}, as: DistrictProgramAdmin }
