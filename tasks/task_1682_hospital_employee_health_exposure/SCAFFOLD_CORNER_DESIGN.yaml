            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "VARICELLA", assay_type: "QUANTITATIVE", numeric_value: 2.5, resulted_at: "2026-07-22T09:30:00Z" }
              as: EmployeeHealthNurse
          trigger:
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/decide"
              payload: { outcome: "CLEARED" }
              as: EmployeeHealthPhysician
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_COMPONENT_INCOMPLETE (422); screening stays IN_PROGRESS"

      - name: screening_clear_succeeds_without_med_eval_when_not_required
        claim_type: satisfaction_pass
        grounds: ["validations[priority=5]", "state_machines.PrePlacementScreening.IN_PROGRESS_to_CLEARED"]
        distinguishing_aspect: "Conditional validation: requires_respirator=false makes MED_EVAL optional — CLEARED succeeds with only PHYSICAL + TB_BASELINE."
        test_recipe:
          setup: ["Employee requires_respirator=false; PHYSICAL + TB_BASELINE complete; both titers IMMUNE"]
          setup_api_calls:
