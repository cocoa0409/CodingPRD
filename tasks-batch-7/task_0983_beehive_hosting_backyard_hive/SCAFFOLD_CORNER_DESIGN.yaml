            - "captured ${pend} == 2900 (second proposal superseded the first) and ${st} == AMENDMENT_PENDING"

      - name: harvest_void_after_finalization_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Harvest.APPROVED_to_VOIDED, state_machines.HoneyAllocation.PROJECTED_to_FINALIZED, "errors[ERR_ALLOCATION_NOT_DISTRIBUTABLE]"]
        distinguishing_aspect: "Once the season rollover finalizes the (season, hive) allocation, its harvests are locked: voiding an APPROVED harvest then fails with ERR_ALLOCATION_NOT_DISTRIBUTABLE."
        test_recipe:
          setup: ["full honey chain: one APPROVED harvest (net 4.000); season rolled over so the allocation is FINALIZED"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
            - { call: "POST /api/hosts", payload: { full_name: "Lock Host", email: "lock@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "10 Lock Ln", base_capacity_hives: 2, water_source: true, setback_feet: 5 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv: $.data.id } }
            - { call: "POST /api/inspections", payload: { hive_id: "${hv}", inspected_at: "2026-06-01T00:00:00Z", mites_counted: 0, bees_sampled: 300, disease_flag: false, brood_score: 9, queen_seen: true, stores_kg: 12.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { i1: $.data.id } }
            - { call: "POST /api/inspections/${i1}/submit", payload: {}, as: Beekeeper, as_user_id: "bk-1" }
            - { call: "POST /api/inspections/${i1}/verify", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/harvests", payload: { hive_id: "${hv}", collected_on: "2026-06-15T00:00:00Z", gross_kg: 4.000, moisture_pct: 18.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { har: $.data.id } }
            - { call: "POST /api/harvests/${har}/approve", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-20T00:00:00Z" }, as: PlatformOps }
            - { call: "POST /api/seasons/${s1}/rollover", payload: { name: "S2026-close", frost_date: "2027-10-15T00:00:00Z" }, as: PlatformOps }
          trigger:
            - { call: "POST /api/harvests/${har}/void", payload: {}, as: ApiaryManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_ALLOCATION_NOT_DISTRIBUTABLE"
            - "Harvest.${har}.status remains APPROVED and the allocation remains FINALIZED (no drift after rejection)"

  # ===========================================================================
  - section: calculations
    instances:
      - name: inspection_mite_load_rounding_precision
        claim_type: precision
        grounds: [calculations.mite_load_per_100]
        distinguishing_aspect: "8 mites / 300 bees = 2.6666... must store as 2.67 (round_half_up at 2 decimals, decimal arithmetic); a binary-float implementation risks 2.66/2.67 drift."
        test_recipe:
          setup: ["host/site/agreement/hive in place"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Mite Host", email: "mite@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "11 Mite Way", base_capacity_hives: 2, water_source: true, setback_feet: 5 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv: $.data.id } }
          trigger:
            - { call: "POST /api/inspections", payload: { hive_id: "${hv}", inspected_at: "2026-05-10T00:00:00Z", mites_counted: 8, bees_sampled: 300, disease_flag: false, brood_score: 8, queen_seen: true, stores_kg: 10.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { load: $.data.mite_load_per_100 } }
          assert:
            - "captured ${load} == 2.67 (round_half_up(800/300, 2))"

      - name: host_reputation_decrement_on_at_fault
        claim_type: correct_result
        grounds: [calculations.host_reputation, state_machines.Incident.REPORTED_to_RESOLVED_AT_FAULT]
        distinguishing_aspect: "Reputation arithmetic: SEVERE at-fault costs 15, MINOR at-fault costs 5 — 100 -> 85 -> 80 — and only AT_FAULT outcomes decrement."
        test_recipe:
          setup: ["host ACTIVE with waiver; site CLEAR"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Rep Host", email: "rep@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "12 Rep Rd", base_capacity_hives: 2, water_source: true, setback_feet: 5 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
          trigger:
            - { call: "POST /api/incidents", payload: { site_id: "${site}", severity: "SEVERE", occurred_at: "2026-05-02T00:00:00Z", description: "dog stung multiple times" }, as: Host, as_user_id: "${h}", captures: { inc1: $.data.id } }
            - { call: "POST /api/incidents/${inc1}/resolve", payload: { outcome: "AT_FAULT", liability_cents: 5000 }, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/sites/${site}/unblock", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/incidents", payload: { site_id: "${site}", severity: "MINOR", occurred_at: "2026-05-03T00:00:00Z", description: "single sting at property line" }, as: Host, as_user_id: "${h}", captures: { inc2: $.data.id } }
            - { call: "POST /api/incidents/${inc2}/resolve", payload: { outcome: "AT_FAULT", liability_cents: 0 }, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "GET /api/hosts/${h}", payload: {}, as: PlatformOps, captures: { rep: $.data.reputation_score } }
          assert:
            - "captured ${rep} == 80 (100 - 15 SEVERE - 5 MINOR)"
            - "the SEVERE report auto-blocked the site, and unblock succeeded only after resolution (no REPORTED incidents remain)"

      - name: reputation_gate_blocks_new_agreement
        claim_type: constants_applied
        grounds: [calculations.host_reputation, "validations[priority=11]", "errors[ERR_HOST_REPUTATION_TOO_LOW]"]
        distinguishing_aspect: "The REPUTATION_AGREEMENT_GATE constant 50 is enforced on agreement creation: four SEVERE at-fault resolutions drop the host to 40, and the next agreement create fails."
        test_recipe:
          setup: ["host ACTIVE with waiver; site exists; four SEVERE incidents each resolved AT_FAULT (reputation 40)"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Gate Host", email: "gate@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "13 Gate Ave", base_capacity_hives: 2, water_source: true, setback_feet: 5 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/incidents", payload: { site_id: "${site}", severity: "SEVERE", occurred_at: "2026-05-02T00:00:00Z", description: "incident one" }, as: Host, as_user_id: "${h}", captures: { i1: $.data.id } }
            - { call: "POST /api/incidents/${i1}/resolve", payload: { outcome: "AT_FAULT", liability_cents: 0 }, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/sites/${site}/unblock", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/incidents", payload: { site_id: "${site}", severity: "SEVERE", occurred_at: "2026-05-03T00:00:00Z", description: "incident two" }, as: Host, as_user_id: "${h}", captures: { i2: $.data.id } }
            - { call: "POST /api/incidents/${i2}/resolve", payload: { outcome: "AT_FAULT", liability_cents: 0 }, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/sites/${site}/unblock", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/incidents", payload: { site_id: "${site}", severity: "SEVERE", occurred_at: "2026-05-04T00:00:00Z", description: "incident three" }, as: Host, as_user_id: "${h}", captures: { i3: $.data.id } }
            - { call: "POST /api/incidents/${i3}/resolve", payload: { outcome: "AT_FAULT", liability_cents: 0 }, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/sites/${site}/unblock", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/incidents", payload: { site_id: "${site}", severity: "SEVERE", occurred_at: "2026-05-05T00:00:00Z", description: "incident four" }, as: Host, as_user_id: "${h}", captures: { i4: $.data.id } }
            - { call: "POST /api/incidents/${i4}/resolve", payload: { outcome: "AT_FAULT", liability_cents: 0 }, as: ApiaryManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-06-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_HOST_REPUTATION_TOO_LOW (40 < 50)"
            - "Host.${h}.reputation_score == 40 after four SEVERE at-fault resolutions"

      - name: allocation_variants_corner
        claim_type: variant_divergence
        grounds: [calculations.honey_share_allocation]
        excluded_because:
          difficulty_instance: honey_share_projected_vs_final_variant
          rationale: "Projected-vs-final divergence, variant selection, and finalization reconciliation are asserted there."

      - name: overwinter_variant_corner
        claim_type: variant_divergence
        grounds: [calculations.overwinter_credit]
        excluded_because:
          difficulty_instance: overwinter_credit_projected_vs_realized
          rationale: "Provisional-vs-realized credit divergence is asserted there."

      - name: capacity_and_fee_boundaries_corner
        claim_type: correct_result
        grounds: [calculations.site_effective_capacity, calculations.cancellation_fee]
        excluded_because:
          difficulty_instance: site_capacity_equal_boundary_blocks
          rationale: "Effective-capacity composition and its inclusive boundary are asserted there; cancellation-fee tiers are asserted in removal_cooling_off_exact_24h_free."

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_CONTEXT_HEADER]"]
        distinguishing_aspect: "Requests without X-User-ID / X-User-Role are rejected before role or existence checks."
        test_recipe:
          setup: ["one host exists"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Auth Host", email: "auth@x.com" }, as: Anonymous, captures: { h: $.data.id } }
          trigger:
            - { call: "GET /api/hosts/${h}", payload: {}, as: Host, omit_headers: true, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_MISSING_OR_INVALID_CONTEXT_HEADER (p1 fires even though the resource exists)"

      - name: role_check_beats_existence
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "A Host calling the ApiaryManager-only hive install with nonexistent site/agreement ids gets ERR_FORBIDDEN_ROLE (p2), not 404 — authorization precedes existence."
        test_recipe:
          setup: ["one ACTIVE host"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Ord Host", email: "ord@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
          trigger:
            - { call: "POST /api/hives", payload: { site_id: "00000000-0000-4000-8000-000000000000", agreement_id: "00000000-0000-4000-8000-000000000001" }, as: Host, as_user_id: "${h}", captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_FORBIDDEN_ROLE (p2 outranks p4; the bogus ids are never resolved)"

      - name: host_cannot_sign_others_agreement_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "Host ownership is enforced by comparing X-User-ID to agreement.host_id: host A cannot sign host B's agreement."
        test_recipe:
          setup: ["hosts A and B ACTIVE; agreement created for host B"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Owner A", email: "a@x.com" }, as: Anonymous, captures: { ha: $.data.id } }
            - { call: "POST /api/hosts/${ha}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${ha}" }
            - { call: "POST /api/hosts", payload: { full_name: "Owner B", email: "b@x.com" }, as: Anonymous, captures: { hb: $.data.id } }
            - { call: "POST /api/hosts/${hb}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${hb}" }
            - { call: "POST /api/sites", payload: { host_id: "${hb}", address: "14 B St", base_capacity_hives: 2, water_source: true, setback_feet: 5 }, as: Host, as_user_id: "${hb}", captures: { siteb: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${hb}", site_id: "${siteb}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { agb: $.data.id } }
          trigger:
            - { call: "POST /api/agreements/${agb}/sign", payload: {}, as: Host, as_user_id: "${ha}", captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_NOT_RESOURCE_OWNER (403)"
            - "Agreement.${agb}.status remains PENDING_SIGNATURE"

      - name: subscription_invalid_enum_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", entities.Subscription.fields.plan, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "plan is a closed enum; GOLD is rejected at shape validation."
        test_recipe:
          setup: ["one ACTIVE host"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Enum Host", email: "enum@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
          trigger:
            - { call: "POST /api/subscriptions", payload: { host_id: "${h}", plan: "GOLD" }, as: PlatformOps, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_INVALID_REQUEST"

      - name: hive_create_missing_site_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A body-referenced FK that does not exist yields 404 (existence), before state or business rules run."
        test_recipe:
          setup: ["one ACTIVE host with waiver and one signed agreement on a site"]
