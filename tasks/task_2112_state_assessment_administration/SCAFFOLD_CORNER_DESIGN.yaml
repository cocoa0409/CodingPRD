  - section: validations
    instances:

      - name: request_missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: >-
          A POST /districts sent with no X-User-ID and no X-User-Role headers answers
          ERR_UNAUTHENTICATED (401) and is rejected before any body validation runs, so a
          malformed body carried in the same request never surfaces ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Empty database with the clock pinned to 2026-09-01T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
          trigger:
            - call: "POST /districts"
              payload: { name: "Northgate District" }
              as: StateAssessmentOfficer
              captures: { err: $.data.error_id }
          assert:
            - "the trigger call is sent with neither X-User-ID nor X-User-Role and returns HTTP 401"
            - "data.error_id == ERR_UNAUTHENTICATED"
            - "data.error_id != ERR_INVALID_REQUEST"
            - "GET /schools returns total_count == 0"

      - name: role_check_returns_forbidden_before_path_existence_is_evaluated
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_TEST_WINDOW_NOT_FOUND]
        distinguishing_aspect: >-
          A Proctor calling the officer-only window transition endpoint on a window id that
          does not exist receives ERR_ROLE_NOT_PERMITTED (403, priority 2), not
          ERR_TEST_WINDOW_NOT_FOUND (404, priority 3).
        test_recipe:
          setup:
            - "One district, school and proctor exist; no test window has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /districts"
              payload: { name: "Northgate District", district_code: "NG-1022", state_code: "NG" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "Ironwood High", school_code: "IW-01", max_concurrent_seats: 40 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { s_id: $.data.id }
            - call: "POST /proctors"
              payload: { school_id: "${s_id}", full_name: "Ada Proctor", email: "ada@ng.gov" }
