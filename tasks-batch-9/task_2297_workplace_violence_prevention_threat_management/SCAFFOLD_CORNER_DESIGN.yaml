      - name: worksite_system_fields_generated_with_client_id_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Worksite
          - endpoints[POST /worksites]
          - validations[priority=4]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          id, created_at, updated_at and version are system fields: a create that supplies all four is
          accepted and every one of them is overwritten by the server, with created_at taken from the
          logical clock (2026-09-15T12:00:00Z here, not the 2026-08-01 default) and version forced to 1.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-09-15T12:00:00Z before the trigger, so the server clock is provably not the 2026-08-01 default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T12:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /worksites"
              payload: { name: "South Depot", state_code: "OR", employee_count: 12, id: "11111111-1111-1111-1111-111111111111", created_at: "2020-01-01T00:00:00Z", updated_at: "2020-01-01T00:00:00Z", version: 99 }
              as: ProgramAdmin
              captures: { ws2_id: $.data.id }
          assert:
            - "The trigger returns HTTP 201"
            - "${ws2_id} != \"11111111-1111-1111-1111-111111111111\" - the client-supplied id was ignored"
            - "Worksite.${ws2_id}.created_at == 2026-09-15T12:00:00Z and updated_at == 2026-09-15T12:00:00Z, not 2020-01-01T00:00:00Z"
            - "Worksite.${ws2_id}.version == 1, not 99"
            - "Worksite.${ws2_id}.name == \"South Depot\" and employee_count == 12"
