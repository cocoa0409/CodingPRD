              payload: { patient_id: "${pat_id}", prescription_id: "${rx_id}", lens_design_id: "${design_prog_id}", frame_sku: "FRM-W60", frame_retail_cents: 15000, requested_coatings: ["AR_PREMIUM"], monocular_pd_od_mm: 30.0, monocular_pd_os_mm: 30.0, fitting_height_mm: 22.0 }
