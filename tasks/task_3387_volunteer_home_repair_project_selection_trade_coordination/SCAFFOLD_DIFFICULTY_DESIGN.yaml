            - call: "GET /rebuild/funding-cycles/${cyc}"
              payload: {}
              as: Any
              captures: { avail4: $.data.available_cents, resv4: $.data.reserved_cents, spent4: $.data.spent_cents }
          assert:
            - "avail0 == 1000000 and resv0 == 0 and spent0 == 0"
            - "avail1 == 885000 and resv1 == 115000 and spent1 == 0 (selection reserves the envelope)"
            - "avail2 == 883213 and spent2 == 1787 (delivery moves money to spent; reserved untouched because materials bill outside the envelope)"
            - "avail3 == 885000 and spent3 == 0 (return refunds the delivery exactly)"
            - "avail4 == 1000000 and resv4 == 0 and spent4 == 0 (cancellation releases the reserve; the cycle closes the round trip with zero drift)"

