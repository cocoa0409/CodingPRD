        distinguishing_aspect: |
          Entity pair EquipmentManifest -> SiteAgreement: the PACKED ->
          IN_TRANSIT transition is valid only when the parent event's posture
          reflects a CONFIRMED agreement (>= SITE_LOCKED); shipping while
          PLANNING fails with ERR_EVENT_POSTURE_FORBIDS.
        test_recipe:
          setup:
            - "Event ev13 in PLANNING (no confirmed agreement) with a PACKED manifest"
          setup_api_calls:
            - call: "POST /clinic-events"
              payload: { event_code: "RAM-TN-07", name: "Murfreesboro", host_state_code: "TN", service_date: "2027-01-09", doors_open_utc: "2027-01-09T10:00:00Z", total_patient_capacity: 150 }
