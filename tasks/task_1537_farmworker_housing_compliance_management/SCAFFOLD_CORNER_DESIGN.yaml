      - name: damage_charge_requires_verified_work_order
        claim_type: conditional_validation
        grounds: ["validations[priority=16]", "errors[ERR_WORK_ORDER_NOT_VERIFIED]", entities.ChargeLedgerEntry.fields.source_work_order_id]
        distinguishing_aspect: "DAMAGE entries must cite a VERIFIED/CLOSED work order: a REPORTED one is rejected with ERR_WORK_ORDER_NOT_VERIFIED, omitting the source is a 400, and the same post succeeds once the work order is VERIFIED."
        test_recipe:
          setup: ["site OPEN; tenancy ACTIVE; work order initially REPORTED, later walked to VERIFIED"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /households", payload: { head_of_household_name: "Fam DM", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { hh_id: $.data.id } }
            - { call: "PUT /households/${hh_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "DM One", date_of_birth: "1990-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "GET /housing-units/${u_id}", as: IntakeCoordinator, captures: { u_v: $.data.version } }
            - { call: "POST /tenancies", payload: { household_id: "${hh_id}", unit_id: "${u_id}", move_in_date: "2026-08-11", expected_unit_version: "${u_v}" }, as: IntakeCoordinator, captures: { t_id: $.data.id } }
            - { call: "PUT /tenancies/${t_id}", payload: { status: "ACTIVE" }, as: IntakeCoordinator }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "STRUCTURAL", severity: "MAJOR", description: "door frame damaged by resident" }, as: MaintenanceLead, captures: { wo_id: $.data.id } }
          trigger:
            - { call: "POST /charge-ledger-entries", payload: { tenancy_id: "${t_id}", entry_type: "DAMAGE", amount_cents: 5000, source_work_order_id: "${wo_id}" }, as: OperatorAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /charge-ledger-entries", payload: { tenancy_id: "${t_id}", entry_type: "DAMAGE", amount_cents: 5000 }, as: OperatorAdmin, captures: { err2: $.data.error_id } }
            - { call: "PUT /work-orders/${wo_id}", payload: { status: "TRIAGED" }, as: MaintenanceLead }
            - { call: "PUT /work-orders/${wo_id}", payload: { status: "ASSIGNED", assignee_name: "tech-1" }, as: MaintenanceLead }
            - { call: "PUT /work-orders/${wo_id}", payload: { status: "IN_PROGRESS" }, as: MaintenanceLead }
            - { call: "PUT /work-orders/${wo_id}", payload: { status: "COMPLETED" }, as: MaintenanceLead, as_user_id: "ml-1" }
            - { call: "PUT /work-orders/${wo_id}", payload: { status: "VERIFIED" }, as: SiteManager, as_user_id: "sm-1" }
            - { call: "POST /charge-ledger-entries", payload: { tenancy_id: "${t_id}", entry_type: "DAMAGE", amount_cents: 5000, source_work_order_id: "${wo_id}" }, as: OperatorAdmin, captures: { e_id: $.data.id } }
            - { call: "GET /tenancies/${t_id}/statement", as: OperatorAdmin, captures: { dmg: $.data.damage_bucket_balance_cents } }
          assert:
            - "err1 == ERR_WORK_ORDER_NOT_VERIFIED (source was REPORTED)"
            - "err2 == ERR_INVALID_REQUEST (DAMAGE requires source_work_order_id)"
            - "after the work order is VERIFIED the DAMAGE post succeeds and dmg == 5000"

      - name: education_referral_requires_minor
        claim_type: conditional_validation
        grounds: ["validations[priority=16]", "errors[ERR_EDUCATION_REFERRAL_REQUIRES_MINOR]"]
        distinguishing_aspect: "EDUCATION referrals require minor_count >= 1 on the household; HEALTH referrals have no such condition."
        test_recipe:
          setup: ["ELIGIBLE household with a single adult member (minor_count 0)"]
          setup_api_calls:
            - { call: "POST /households", payload: { head_of_household_name: "Fam ED", annual_family_income_cents: 3000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { hh_id: $.data.id } }
            - { call: "PUT /households/${hh_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "ED Adult", date_of_birth: "1990-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /service-referrals", payload: { household_id: "${hh_id}", referral_type: "EDUCATION", agency_name: "Migrant Ed" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /service-referrals", payload: { household_id: "${hh_id}", referral_type: "HEALTH", agency_name: "Clinic" }, as: IntakeCoordinator, captures: { ok: $.data.status } }
          assert:
            - "err == ERR_EDUCATION_REFERRAL_REQUIRES_MINOR with HTTP 422"
            - "ok == INITIATED — HEALTH is unconditional given ELIGIBLE"

      - name: pending_household_blocks_tenancy_create
