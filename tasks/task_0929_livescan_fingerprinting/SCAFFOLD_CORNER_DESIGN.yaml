# §1.9 Scaffold Corner Design — breadth probe over every testable claim in §1.1-§1.7
# that §1.8 does not already cover. Sections and claim_type values come from
# references/claim-extraction-guide.md.
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_agency_applies_defaults_and_starts_at_version_one
        claim_type: Creation
        grounds:
          - entities.Agency.fields.billing_status
          - entities.Agency.fields.payer_regime_default
          - entities.Agency.fields.invoice_terms_days
        distinguishing_aspect: "A new Agency starts CURRENT with mtd_billed_cents 0, outstanding_balance_cents 0, version 1, and payer_regime_default defaults to APPLICANT_PAID when omitted."
        test_recipe:
          setup:
            - "Empty database with the logical clock left at its 2026-05-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /livescan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: VendorAdmin
          trigger:
            - call: "POST /livescan/agencies"
              payload: { name: "Default Agency", account_code: "ACC-D1" }
              as: VendorAdmin
              captures: { agency_id: $.data.id, v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Agency.${agency_id}.billing_status == CURRENT"
            - "Agency.${agency_id}.payer_regime_default == APPLICANT_PAID"
            - "Agency.${agency_id}.invoice_terms_days == 30"
            - "Agency.${agency_id}.outstanding_balance_cents == 0 and mtd_billed_cents == 0 and max_aging_days == 0"
            - "${v} == 1"
            - "Agency.${agency_id}.suspended_at == null"

      - name: get_ori_with_unknown_id_returns_reference_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_REFERENCE_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A GET on an ORI id that was never minted returns 404 ERR_REFERENCE_NOT_FOUND, not an empty object."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /livescan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: VendorAdmin
          trigger:
            - call: "GET /livescan/oris/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: VendorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and data.error_id == ERR_REFERENCE_NOT_FOUND"
            - "response_type == error"

      - name: list_appointments_returns_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints[GET /livescan/appointments]
          - entities.Appointment.fields.site_id
        distinguishing_aspect: "GET /livescan/appointments honours limit and offset and reports total_count 3 with has_more true when limit is 2."
        test_recipe:
          setup:
            - "One site with three BOOKED appointments at 10:00, 11:00 and 12:00"
          setup_api_calls:
            - call: "POST /livescan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: VendorAdmin
            - call: "POST /livescan/agencies"
              payload: { name: "Metro PD", account_code: "ACC-P1", payer_regime_default: "APPLICANT_PAID", invoice_terms_days: 30 }
              as: VendorAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /livescan/oris"
              payload: { agency_id: "${agency_id}", ori_code: "CA2020202", statutory_authority: "CRIMINAL_JUSTICE", fee_waiver_eligible: false }
              as: VendorAdmin
              captures: { ori_id: $.data.id }
            - call: "POST /livescan/service-types"
              payload: { ori_id: "${ori_id}", code: "TCH", applicant_type: "TEACHER", slot_duration_minutes: 30, required_document_codes: ["PHOTO_ID"], accepted_id_document_types: ["DRIVER_LICENSE"], state_fee_cents: 3289, federal_fee_cents: 1350, retention_offered: true }
              as: VendorAdmin
              captures: { st_id: $.data.id }
            - call: "POST /livescan/sites"
              payload: { site_kind: "FIXED", name: "Downtown", concurrent_capacity: 5 }
              as: VendorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /livescan/applicants"
              payload: { full_name: "Sam Toll", date_of_birth: "1990-01-01", sex: "M", place_of_birth: "CA", id_document_type: "DRIVER_LICENSE", id_document_expires_on: "2030-01-01" }
              as: LivescanTechnician
              as_user_id: "tech-01"
              captures: { appl_id: $.data.id }
            - call: "POST /livescan/appointments"
              payload: { applicant_id: "${appl_id}", site_id: "${site_id}", service_type_id: "${st_id}", scheduled_start: "2026-06-01T10:00:00Z", booking_channel: "BOOKED" }
              as: LivescanTechnician
              as_user_id: "tech-01"
            - call: "POST /livescan/appointments"
              payload: { applicant_id: "${appl_id}", site_id: "${site_id}", service_type_id: "${st_id}", scheduled_start: "2026-06-01T11:00:00Z", booking_channel: "BOOKED" }
              as: LivescanTechnician
              as_user_id: "tech-01"
            - call: "POST /livescan/appointments"
              payload: { applicant_id: "${appl_id}", site_id: "${site_id}", service_type_id: "${st_id}", scheduled_start: "2026-06-01T12:00:00Z", booking_channel: "BOOKED" }
              as: LivescanTechnician
              as_user_id: "tech-01"
          trigger:
            - call: "GET /livescan/appointments"
              payload: { site_id: "${site_id}", limit: 2, offset: 0 }
              as: LivescanTechnician
              as_user_id: "tech-01"
          assert:
            - "HTTP status == 200 and response_type == array"
            - "meta pagination reports total_count == 3, limit == 2, offset == 0, has_more == true"
            - "data contains exactly 2 Appointment rows, both with site_id == ${site_id}"

      - name: create_service_type_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting state_fee_cents on POST /livescan/service-types returns 400 ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup:
            - "One agency and one ORI exist"
          setup_api_calls:
            - call: "POST /livescan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: VendorAdmin
            - call: "POST /livescan/agencies"
              payload: { name: "Metro PD", account_code: "ACC-R1", payer_regime_default: "APPLICANT_PAID", invoice_terms_days: 30 }
              as: VendorAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /livescan/oris"
              payload: { agency_id: "${agency_id}", ori_code: "CA2121212", statutory_authority: "CRIMINAL_JUSTICE", fee_waiver_eligible: false }
              as: VendorAdmin
              captures: { ori_id: $.data.id }
          trigger:
            - call: "POST /livescan/service-types"
              payload: { ori_id: "${ori_id}", code: "TCH", applicant_type: "TEACHER", slot_duration_minutes: 30, required_document_codes: ["PHOTO_ID"], accepted_id_document_types: ["DRIVER_LICENSE"], federal_fee_cents: 1350 }
              as: VendorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /livescan/service-types?ori_id=${ori_id} returns total_count 0"

      - name: ori_derived_fields_computed_and_extra_field_ignored
        claim_type: Computed Fields
        grounds:
          - calculations.ori_authority_profile
          - entities.Ori.fields.dissemination_tier
          - entities.Ori.fields.rapback_authority
        distinguishing_aspect: "NONCRIMINAL_STATUTORY derives STATE_AND_FBI, FITNESS_CODE_ONLY, retention_permitted true and rapback_authority true; a client-supplied dissemination_tier is not part of the input contract and is ignored."
        test_recipe:
          setup:
            - "One agency exists"
          setup_api_calls:
            - call: "POST /livescan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: VendorAdmin
            - call: "POST /livescan/agencies"
              payload: { name: "School District", account_code: "ACC-C1", payer_regime_default: "AGENCY_BILLED", invoice_terms_days: 30 }
              as: VendorAdmin
              captures: { agency_id: $.data.id }
          trigger:
            - call: "POST /livescan/oris"
              payload: { agency_id: "${agency_id}", ori_code: "CA2222222", statutory_authority: "NONCRIMINAL_STATUTORY", fee_waiver_eligible: true, dissemination_tier: "FULL_CHR" }
              as: VendorAdmin
              captures: { ori_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Ori.${ori_id}.dissemination_tier == FITNESS_CODE_ONLY (the supplied FULL_CHR is ignored)"
            - "Ori.${ori_id}.destination_requirement == STATE_AND_FBI"
            - "Ori.${ori_id}.retention_permitted == true and Ori.${ori_id}.rapback_authority == true"
            - "Ori.${ori_id}.authority_status == ACTIVE and tcn_consumed_count == 0"

      - name: applicant_without_place_of_birth_is_demographically_incomplete
        claim_type: Defaults
        grounds:
          - entities.Applicant.fields.demographics_complete
          - entities.Applicant.fields.place_of_birth
        distinguishing_aspect: "demographics_complete is false when place_of_birth is omitted and flips to true after a PATCH supplies it."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /livescan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: VendorAdmin
            - call: "POST /livescan/applicants"
              payload: { full_name: "Tess Vega", date_of_birth: "1992-02-02", sex: "F", id_document_type: "DRIVER_LICENSE", id_document_expires_on: "2030-02-02" }
              as: LivescanTechnician
              as_user_id: "tech-01"
              captures: { appl_id: $.data.id, complete_before: $.data.demographics_complete }
          trigger:
            - call: "PATCH /livescan/applicants/${appl_id}"
              payload: { place_of_birth: "CA" }
              as: LivescanTechnician
              as_user_id: "tech-01"
              captures: { complete_after: $.data.demographics_complete, v: $.data.version }
          assert:
            - "${complete_before} == false"
            - "${complete_after} == true"
            - "${v} == 2"
            - "Applicant.${appl_id}.place_of_birth == CA"

      - name: create_mobile_event_site_without_window_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=5]
          - entities.CaptureSite.fields.event_window_start
          - entities.CaptureSite.fields.min_billable_prints
        distinguishing_aspect: "site_kind MOBILE_EVENT without event_window_start, event_window_end and min_billable_prints is refused with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One agency exists to host the event"
          setup_api_calls:
            - call: "POST /livescan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: VendorAdmin
            - call: "POST /livescan/agencies"
              payload: { name: "Metro PD", account_code: "ACC-M1", payer_regime_default: "APPLICANT_PAID", invoice_terms_days: 30 }
              as: VendorAdmin
              captures: { agency_id: $.data.id }
          trigger:
            - call: "POST /livescan/sites"
              payload: { site_kind: "MOBILE_EVENT", name: "Half-declared event", concurrent_capacity: 3, host_agency_id: "${agency_id}" }
              as: VendorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /livescan/sites?host_agency_id=${agency_id} returns total_count 0"

      - name: card_creation_materializes_ten_pending_positions
        claim_type: System Fields
        grounds:
          - endpoints[POST /livescan/cards]
          - entities.PositionCapture.fields.position_code
          - state_machines.Appointment.CHECKED_IN_to_IN_CAPTURE
        distinguishing_aspect: "Opening a card creates exactly ten PositionCapture rows in PENDING with attempt_count 0, stamps captured_by_user_id from X-User-ID and moves the appointment to IN_CAPTURE."
        test_recipe:
          setup:
            - "A checked-in appointment at a FIXED site with a calibrated device"
          setup_api_calls:
            - call: "POST /livescan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: VendorAdmin
            - call: "POST /livescan/agencies"
              payload: { name: "Metro PD", account_code: "ACC-S1", payer_regime_default: "APPLICANT_PAID", invoice_terms_days: 30 }
              as: VendorAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /livescan/oris"
              payload: { agency_id: "${agency_id}", ori_code: "CA2323232", statutory_authority: "CRIMINAL_JUSTICE", fee_waiver_eligible: false }
              as: VendorAdmin
              captures: { ori_id: $.data.id }
            - call: "POST /livescan/service-types"
              payload: { ori_id: "${ori_id}", code: "TCH", applicant_type: "TEACHER", slot_duration_minutes: 30, required_document_codes: ["PHOTO_ID"], accepted_id_document_types: ["DRIVER_LICENSE"], state_fee_cents: 3289, federal_fee_cents: 1350, retention_offered: true }
              as: VendorAdmin
              captures: { st_id: $.data.id }
            - call: "POST /livescan/sites"
              payload: { site_kind: "FIXED", name: "Downtown", concurrent_capacity: 5 }
              as: VendorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /livescan/devices"
              payload: { serial_number: "DEV-S1", home_site_id: "${site_id}", calibrated_at: "2026-05-15T00:00:00Z" }
              as: VendorAdmin
              captures: { device_id: $.data.id }
            - call: "POST /livescan/applicants"
              payload: { full_name: "Uma Roy", date_of_birth: "1989-09-19", sex: "F", place_of_birth: "CA", id_document_type: "DRIVER_LICENSE", id_document_expires_on: "2030-09-09" }
              as: LivescanTechnician
              as_user_id: "tech-01"
              captures: { appl_id: $.data.id }
            - call: "POST /livescan/appointments"
              payload: { applicant_id: "${appl_id}", site_id: "${site_id}", service_type_id: "${st_id}", scheduled_start: "2026-06-01T10:00:00Z", booking_channel: "BOOKED" }
              as: LivescanTechnician
              as_user_id: "tech-01"
              captures: { appt_id: $.data.id }
            - call: "POST /livescan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:55:00Z" }
              as: VendorAdmin
            - call: "POST /livescan/appointments/${appt_id}/check-in"
              payload: { presented_document_type: "DRIVER_LICENSE", presented_documents: ["PHOTO_ID"] }
              as: LivescanTechnician
              as_user_id: "tech-01"
          trigger:
            - call: "POST /livescan/cards"
              payload: { appointment_id: "${appt_id}", device_id: "${device_id}" }
              as: LivescanTechnician
              as_user_id: "tech-01"
              captures: { card_id: $.data.id }
          assert:
            - "HTTP status == 201 and FingerprintCard.${card_id}.status == OPEN"
            - "GET /livescan/cards/${card_id}/positions returns total_count 10, every row status PENDING with attempt_count 0 and best_score null"
            - "the ten position_code values are exactly R_THUMB, R_INDEX, R_MIDDLE, R_RING, R_LITTLE, L_THUMB, L_INDEX, L_MIDDLE, L_RING, L_LITTLE"
            - "FingerprintCard.${card_id}.captured_by_user_id == tech-01"
            - "FingerprintCard.${card_id}.site_id == ${site_id}"
            - "Appointment.${appt_id}.status == IN_CAPTURE"

      - name: create_ori_with_invalid_enum_authority_is_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_ENUM]
        distinguishing_aspect: "statutory_authority is one of the exhaustively listed enum fields, so an unknown member returns 422 ERR_INVALID_ENUM rather than 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One agency exists"
          setup_api_calls:
            - call: "POST /livescan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: VendorAdmin
            - call: "POST /livescan/agencies"
              payload: { name: "Metro PD", account_code: "ACC-E1", payer_regime_default: "APPLICANT_PAID", invoice_terms_days: 30 }
              as: VendorAdmin
              captures: { agency_id: $.data.id }
          trigger:
            - call: "POST /livescan/oris"
              payload: { agency_id: "${agency_id}", ori_code: "CA2424242", statutory_authority: "MILITARY_JUSTICE", fee_waiver_eligible: false }
              as: VendorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422 and data.error_id == ERR_INVALID_ENUM"
            - "data.error_id != ERR_INVALID_REQUEST"
            - "GET /livescan/oris?agency_id=${agency_id} returns total_count 0"

      - name: attempt_on_unknown_card_returns_card_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_CARD_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A missing FingerprintCard in the path raises the card-specific 404, not the generic ERR_REFERENCE_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /livescan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: VendorAdmin
          trigger:
            - call: "POST /livescan/cards/6f1b2a44-9c3d-4b17-8e55-0a1c2d3e4f56/positions/R_THUMB/attempts"
              payload: { score: 70 }
              as: LivescanTechnician
              as_user_id: "tech-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and data.error_id == ERR_CARD_NOT_FOUND"
            - "data.error_id != ERR_REFERENCE_NOT_FOUND"

      - name: destination_result_on_unknown_submission_returns_submission_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_SUBMISSION_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A missing Submission in the path raises the submission-specific 404, distinct from both the card and the generic reference codes."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /livescan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: VendorAdmin
          trigger:
            - call: "POST /livescan/submissions/1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed/destination-results"
              payload: { destination: "STATE", result_code: "ACCEPTED", record_count: 0, disqualifying_offense_count: 0 }
              as: StateRepository
              as_user_id: "dest-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and data.error_id == ERR_SUBMISSION_NOT_FOUND"

  - section: state_machines
    instances:
      - name: second_cancel_on_cancelled_appointment_is_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Appointment.BOOKED_to_CANCELLED
          - errors[ERR_APPOINTMENT_STATE_INVALID]
          - validations[priority=10]
        distinguishing_aspect: "CANCELLED is terminal, so a second cancel returns 409 ERR_APPOINTMENT_STATE_INVALID and no side effect re-runs."
        test_recipe:
          setup:
            - "One BOOKED appointment that has already been cancelled"
          setup_api_calls:
            - call: "POST /livescan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: VendorAdmin
            - call: "POST /livescan/agencies"
              payload: { name: "Metro PD", account_code: "ACC-SM1", payer_regime_default: "APPLICANT_PAID", invoice_terms_days: 30 }
              as: VendorAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /livescan/oris"
              payload: { agency_id: "${agency_id}", ori_code: "CA2525252", statutory_authority: "CRIMINAL_JUSTICE", fee_waiver_eligible: false }
              as: VendorAdmin
              captures: { ori_id: $.data.id }
            - call: "POST /livescan/service-types"
              payload: { ori_id: "${ori_id}", code: "TCH", applicant_type: "TEACHER", slot_duration_minutes: 30, required_document_codes: ["PHOTO_ID"], accepted_id_document_types: ["DRIVER_LICENSE"], state_fee_cents: 3289, federal_fee_cents: 1350, retention_offered: true }
              as: VendorAdmin
              captures: { st_id: $.data.id }
            - call: "POST /livescan/sites"
              payload: { site_kind: "FIXED", name: "Downtown", concurrent_capacity: 5 }
              as: VendorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /livescan/applicants"
              payload: { full_name: "Vic Hale", date_of_birth: "1984-04-04", sex: "M", place_of_birth: "CA", id_document_type: "DRIVER_LICENSE", id_document_expires_on: "2030-04-04" }
              as: LivescanTechnician
              as_user_id: "tech-01"
              captures: { appl_id: $.data.id }
            - call: "POST /livescan/appointments"
              payload: { applicant_id: "${appl_id}", site_id: "${site_id}", service_type_id: "${st_id}", scheduled_start: "2026-06-01T10:00:00Z", booking_channel: "BOOKED" }
              as: LivescanTechnician
              as_user_id: "tech-01"
              captures: { appt_id: $.data.id }
            - call: "POST /livescan/appointments/${appt_id}/cancel"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
          trigger:
            - call: "POST /livescan/appointments/${appt_id}/cancel"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_APPOINTMENT_STATE_INVALID"
            - "Appointment.${appt_id}.status == CANCELLED"
            - "GET /livescan/fee-assessments?appointment_id=${appt_id} returns total_count 0"

      - name: attempt_on_passed_position_is_rejected_as_already_closed
        claim_type: Idempotency
        grounds:
          - state_machines.PositionCapture.PENDING_to_PASSED
          - validations[priority=22]
          - errors[ERR_POSITION_ALREADY_CLOSED]
        distinguishing_aspect: "PASSED is terminal for a position, so a second attempt returns 409 ERR_POSITION_ALREADY_CLOSED and leaves attempt_count at 1."
        test_recipe:
          setup:
            - "An open card whose R_THUMB position passed on its first attempt with score 91"
          setup_api_calls:
            - call: "POST /livescan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: VendorAdmin
            - call: "POST /livescan/agencies"
              payload: { name: "Metro PD", account_code: "ACC-SM2", payer_regime_default: "APPLICANT_PAID", invoice_terms_days: 30 }
              as: VendorAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /livescan/oris"
              payload: { agency_id: "${agency_id}", ori_code: "CA2626262", statutory_authority: "CRIMINAL_JUSTICE", fee_waiver_eligible: false }
              as: VendorAdmin
