# =============================================================================
# task_0150_bnpl_installment_lending — SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8)
# Test Targeting Index: 9 Difficulty Rules × ≥2 instances = 18 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# All formula-derived asserts are literals precomputed against §1.3 + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: schedule_pay_in_4_vs_monthly_diverge_on_same_principal
        grounds:
          - calculations.installment_schedule
          - calculations.finance_charge
          - entities.Loan.fields.finance_charge_cents
          - state_machines.Application.APPROVED_to_ACTIVATED
        distinguishing_aspect: |
          Same financed_principal_cents drives ZERO finance charge on a PAY_IN_4 loan
          (Loan A) but 7060c on a MONTHLY/N6 loan (Loan B) — the two variants of
          installment_schedule live on the Loan/Installment domain.
        test_recipe:
          setup:
            - "Merchant M (mdr_bps=600) ACTIVE; clock at 2026-01-01T00:00:00Z."
            - "Borrower BA: score 760, income 8_000_000c -> eligible_credit_limit_cents=500000."
            - "App A: PAY_IN_4, cart 100000c, down 0 -> APPROVED, financed 100000, fc 0."
            - "App B: MONTHLY term 6, cart 120000c, down 0 -> APPROVED, financed 120000, fc 7060."
            - "Both disclosures accepted; both activated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Servicer
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /applications/${app_a_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
            - call: "POST /disclosure-acceptances"
              payload: { application_id: "${app_a_id}", accepted: true }
              as: Borrower
              as_user_id: "${ba_id}"
            - call: "POST /loans"
              payload: { application_id: "${app_a_id}" }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { loan_a_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 120000, plan_type: "MONTHLY", term_months: 6, requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_b_id: $.data.id }
            - call: "POST /applications/${app_b_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
            - call: "POST /disclosure-acceptances"
              payload: { application_id: "${app_b_id}", accepted: true }
              as: Borrower
              as_user_id: "${ba_id}"
            - call: "POST /loans"
              payload: { application_id: "${app_b_id}" }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { loan_b_id: $.data.id }
          trigger:
            - call: "GET /loans/${loan_a_id}"
              as: Servicer
              captures: { fc_a: $.data.finance_charge_cents }
            - call: "GET /loans/${loan_b_id}"
              as: Servicer
              captures: { fc_b: $.data.finance_charge_cents }
          assert:
            - "Loan.${loan_a_id}.finance_charge_cents == 0"
            - "Loan.${loan_b_id}.finance_charge_cents == 7060"
            - "Loan.${loan_a_id}.financed_principal_cents == 100000 AND Loan.${loan_b_id}.financed_principal_cents == 120000"

      - name: eligibility_provisional_vs_final_diverge_on_borrower
        grounds:
          - calculations.eligibility_limit
          - entities.Borrower.fields.eligible_credit_limit_cents
          - entities.Borrower.fields.available_credit_cents
          - entities.Application.fields.approved_down_payment_cents
          - state_machines.Application.SUBMITTED_to_COUNTERED
        distinguishing_aspect: |
          The provisional variant fixes Borrower.eligible_credit_limit_cents=50000 at
          registration; the final variant, evaluated at decision against live
          available_credit, forces a COUNTER raising approved_down_payment_cents to 1
          — divergent results on the Borrower domain (distinct from the Loan-domain
          dual-variant above).
        test_recipe:
          setup:
            - "Merchant M ACTIVE."
            - "Borrower BC: score 620, income 2_000_000c -> eligible_credit_limit_cents=50000, available 50000."
            - "App C: PAY_IN_4, cart 50001c, down 0 -> final variant COUNTERs (need 50001 > avail 50000, cart-1=50000<=avail)."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BC", email: "bc@x.com", annual_income_cents: 2000000, soft_credit_score: 620 }
              as: Servicer
              captures: { bc_id: $.data.id, bc_limit: $.data.eligible_credit_limit_cents }
            - call: "POST /applications"
              payload: { borrower_id: "${bc_id}", merchant_id: "${m_id}", cart_amount_cents: 50001, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${bc_id}"
              captures: { app_c_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_c_id}/decision"
              payload: { decision: "COUNTER" }
              as: Servicer
              captures: { app_status: $.data.status, app_down: $.data.approved_down_payment_cents }
          assert:
            - "Borrower.${bc_id}.eligible_credit_limit_cents == 50000"
            - "Application.${app_c_id}.status == COUNTERED"
            - "Application.${app_c_id}.approved_down_payment_cents == 1"
            - "Application.${app_c_id}.financed_principal_cents == 50000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: monthly_amortization_nonlinear_three_inputs
        grounds:
          - calculations.installment_schedule
          - calculations.finance_charge
          - entities.Installment.fields.amount_due_cents
          - entities.Installment.fields.principal_portion_cents
        distinguishing_aspect: |
          Mode (a): amortization payment is a non-linear function of three inputs
          (P=120000, apr_bps=1990, N=6); per-installment interest is computed on the
          declining balance, last installment absorbs the residual — schedule
          [21177,21177,21177,21177,21177,21175], principals summing to 120000.
        test_recipe:
          setup:
            - "Merchant M ACTIVE; Borrower BA limit 500000."
            - "App B: MONTHLY term 6, cart 120000, down 0 -> APPROVED; activated -> Loan B with 6 installments."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 120000, plan_type: "MONTHLY", term_months: 6, requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_b_id: $.data.id }
            - call: "POST /applications/${app_b_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
            - call: "POST /disclosure-acceptances"
              payload: { application_id: "${app_b_id}", accepted: true }
              as: Borrower
              as_user_id: "${ba_id}"
            - call: "POST /loans"
              payload: { application_id: "${app_b_id}" }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { loan_b_id: $.data.id }
          trigger:
            - call: "GET /installments?loan_id=${loan_b_id}"
              as: Servicer
          assert:
            - "installments ordered by sequence_no have amount_due_cents == [21177, 21177, 21177, 21177, 21177, 21175]"
            - "sum of principal_portion_cents over the 6 installments == 120000"
            - "sum of amount_due_cents == 127060"

      - name: return_reallocation_rounding_order_pinned
        grounds:
          - calculations.return_reallocation
          - entities.Return.fields.principal_reduction_cents
          - entities.Return.fields.settlement_clawback_cents
          - state_machines.Installment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Mode (b): principal reduction is applied newest-first as a single exact
          integer subtraction (NOT pro-rata-then-round), so a 30000c return on a
          [25000,25000,25000,25000] PAY_IN_4 loan CANCELs installment #4 exactly and
          reduces #3 to 20000 with zero rounding residual; the settlement clawback is
          30000 - round_half_up(30000*600/10000=1800) = 28200, rounding the MDR exactly
          once. Distinct mode from the (a) amortization instance.
        test_recipe:
          setup:
            - "Merchant M (mdr_bps=600) ACTIVE; Borrower BA limit 500000."
            - "Loan A PAY_IN_4 financed 100000, 4 installments of 25000, none paid; activation 2026-01-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Servicer
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /applications/${app_a_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
            - call: "POST /disclosure-acceptances"
              payload: { application_id: "${app_a_id}", accepted: true }
              as: Borrower
              as_user_id: "${ba_id}"
            - call: "POST /loans"
              payload: { application_id: "${app_a_id}" }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { loan_a_id: $.data.id }
          trigger:
            - call: "POST /returns"
              payload: { loan_id: "${loan_a_id}", return_amount_cents: 30000 }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { ret_id: $.data.id, prin_red: $.data.principal_reduction_cents, claw: $.data.settlement_clawback_cents }
          assert:
            - "Return.${ret_id}.principal_reduction_cents == 30000"
            - "Return.${ret_id}.settlement_clawback_cents == 28200"
            - "Loan.${loan_a_id}.remaining_principal_cents == 70000"
            - "installment sequence_no==4 status == CANCELLED AND sequence_no==3 amount_due_cents == 20000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_revision_loop_countered_to_submitted
        grounds:
          - state_machines.Application.SUBMITTED_to_COUNTERED
          - state_machines.Application.COUNTERED_to_SUBMITTED
          - state_machines.Application.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Application is cyclic: SUBMITTED -> COUNTERED -> SUBMITTED (revise) -> APPROVED.
          The same row re-enters SUBMITTED after a counter, a loop a linear pipeline
          cannot express. Entity: Application.
        test_recipe:
          setup:
            - "Merchant M ACTIVE; Borrower BC limit 50000; App C cart 50001 PAY_IN_4 -> COUNTERED (approved_down 1)."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BC", email: "bc@x.com", annual_income_cents: 2000000, soft_credit_score: 620 }
              as: Servicer
              captures: { bc_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${bc_id}", merchant_id: "${m_id}", cart_amount_cents: 50001, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${bc_id}"
              captures: { app_c_id: $.data.id }
            - call: "POST /applications/${app_c_id}/decision"
              payload: { decision: "COUNTER" }
              as: Servicer
          trigger:
            - call: "POST /applications/${app_c_id}/revise"
              payload: { requested_down_payment_cents: 1 }
              as: Borrower
              as_user_id: "${bc_id}"
              captures: { revised_status: $.data.status }
            - call: "POST /applications/${app_c_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
              captures: { final_status: $.data.status }
          assert:
            - "after revise Application.${app_c_id}.status == SUBMITTED"
            - "after decision Application.${app_c_id}.status == APPROVED"
            - "Application.${app_c_id}.financed_principal_cents == 50000"

      - name: loan_parallel_status_and_delinquency_dimensions
        grounds:
          - state_machines.Loan
          - entities.Loan.fields.status
          - entities.Loan.fields.delinquency_status
          - calculations.delinquency_posture
        distinguishing_aspect: |
          Loan carries two independent dimensions: lifecycle status stays ACTIVE while
          the parallel delinquency_status evolves CURRENT -> DELINQUENT under the clock.
          A loan is simultaneously ACTIVE and DELINQUENT — parallel axes on one row,
          a different entity than Application above.
        test_recipe:
          setup:
            - "Merchant M ACTIVE; Borrower BA limit 500000; Loan A PAY_IN_4 financed 100000 activated 2026-01-01; no payments."
            - "inst1 due 2026-01-01; clock advanced to 2026-02-01 (dpd 31 >= 30)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Servicer
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /applications/${app_a_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
            - call: "POST /disclosure-acceptances"
              payload: { application_id: "${app_a_id}", accepted: true }
              as: Borrower
              as_user_id: "${ba_id}"
            - call: "POST /loans"
              payload: { application_id: "${app_a_id}" }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { loan_a_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Servicer
            - call: "GET /loans/${loan_a_id}"
              as: Servicer
              captures: { st: $.data.status, dq: $.data.delinquency_status }
          assert:
            - "Loan.${loan_a_id}.status == ACTIVE"
            - "Loan.${loan_a_id}.delinquency_status == DELINQUENT"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: return_cascades_installment_payoff_autopay_disable_depth3
        grounds:
          - calculations.return_reallocation
          - state_machines.Installment.SCHEDULED_to_CANCELLED
          - state_machines.Loan.ACTIVE_to_PAID_OFF
          - entities.AutopayMandate.fields.status
        distinguishing_aspect: |
          Depth-3 chain from POST /returns: (1) Return reduces installments -> all
          SCHEDULED installments CANCELLED; (2) that drives remaining_principal_cents
          to 0 -> Loan ACTIVE->PAID_OFF; (3) the payoff disables the ENABLED
          AutopayMandate. Each link is caused by the prior link, originating from the
          return trigger.
        test_recipe:
          setup:
            - "Merchant M ACTIVE; Borrower BA limit 500000; Loan A PAY_IN_4 financed 100000, none paid."
            - "AutopayMandate AM ENABLED on Loan A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Servicer
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /applications/${app_a_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
            - call: "POST /disclosure-acceptances"
              payload: { application_id: "${app_a_id}", accepted: true }
              as: Borrower
              as_user_id: "${ba_id}"
            - call: "POST /loans"
              payload: { application_id: "${app_a_id}" }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { loan_a_id: $.data.id }
            - call: "POST /autopay-mandates"
              payload: { loan_id: "${loan_a_id}" }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { am_id: $.data.id }
          trigger:
            - call: "POST /returns"
              payload: { loan_id: "${loan_a_id}", return_amount_cents: 100000 }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { ret_id: $.data.id }
            - call: "GET /autopay-mandates/${am_id}"
              as: Servicer
              captures: { am_status: $.data.status }
          assert:
            - "Loan.${loan_a_id}.remaining_principal_cents == 0"
            - "Loan.${loan_a_id}.status == PAID_OFF"
            - "AutopayMandate.${am_id}.status == DISABLED"

      - name: payment_cascades_installment_paid_then_payoff_depth2
        grounds:
          - calculations.payment_allocation
          - state_machines.Installment.SCHEDULED_to_PAID
          - state_machines.Loan.ACTIVE_to_PAID_OFF
        distinguishing_aspect: |
          Depth-2 chain from POST /payments: (1) a 100000c payment fully allocates
          oldest-first so all 4 installments -> PAID; (2) remaining_principal hits 0
          and no open installment remains -> Loan ACTIVE->PAID_OFF. Originates from a
          DIFFERENT trigger (payment) than the return cascade above.
        test_recipe:
          setup:
            - "Merchant M ACTIVE; Borrower BA limit 500000; Loan A PAY_IN_4 financed 100000, none paid."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Servicer
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /applications/${app_a_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
            - call: "POST /disclosure-acceptances"
              payload: { application_id: "${app_a_id}", accepted: true }
              as: Borrower
              as_user_id: "${ba_id}"
            - call: "POST /loans"
              payload: { application_id: "${app_a_id}" }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { loan_a_id: $.data.id }
          trigger:
            - call: "POST /payments"
              payload: { loan_id: "${loan_a_id}", amount_cents: 100000, source: "MANUAL" }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { pay_id: $.data.id, unapplied: $.data.unapplied_cents }
          assert:
            - "Payment.${pay_id}.unapplied_cents == 0"
            - "Loan.${loan_a_id}.remaining_principal_cents == 0"
            - "Loan.${loan_a_id}.status == PAID_OFF"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: activate_invalid_state_beats_disclosure_gate
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.Application.APPROVED_to_ACTIVATED
        distinguishing_aspect: |
          Category pair state(p5) vs business_safety(p7): activating an application
          already ACTIVATED (no second disclosure accepted) fails with ERR_INVALID_STATE
          (p5), NOT ERR_DISCLOSURE_NOT_ACCEPTED (p7) — state outranks the Reg Z gate.
        test_recipe:
          setup:
            - "Merchant M ACTIVE; Borrower BA limit 500000; App A APPROVED, disclosure accepted, then activated -> Application ACTIVATED."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /applications/${app_a_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
            - call: "POST /disclosure-acceptances"
              payload: { application_id: "${app_a_id}", accepted: true }
              as: Borrower
              as_user_id: "${ba_id}"
            - call: "POST /loans"
              payload: { application_id: "${app_a_id}" }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { loan_a_id: $.data.id }
          trigger:
