            - call: "POST /mpi/fraud-investigations/${inv_fc_id}/substantiate"
              payload: { finding_note: "Identity theft confirmed by the special investigations unit." }
              as: PrivacyOfficer
              as_user_id: "officer-1"
          assert:
            - "FraudInvestigation.${inv_fc_id}.opened_by == OFFICER and opened_by_user_id == \"officer-1\" and pair_id == null"
            - "FraudInvestigation.${inv_fc_id}.risk_score == 2.00"
            - "Component decomposition of 2.00: conflict_component 0.00 (pair_id null) + score_component 0.00 + site_component 2.00 (min(20.00, 2.00 * 1)) + insurance_component 0.00"
            - "After the open: PatientRecord.${rec_f1_id}.integrity_state == FRAUD_SUSPECTED and identity_state == ACTIVE"
            - "After the open: DuplicateCandidatePair.${pair_p1_id}.queue_state == ESCALATED_FRAUD (cascaded from NEW)"
            - "After the open: DuplicateCandidatePair.${pair_p2_id}.queue_state == ESCALATED_FRAUD (cascaded from UNDER_REVIEW)"
            - "After the open: DuplicateCandidatePair.${pair_p3_id}.queue_state == NEW (does not name ${rec_f1_id})"
            - "After the open: RegistrationSite.${site_fc_id}.flagged_record_count == 1"
            - "After the substantiate: FraudInvestigation.${inv_fc_id}.state == SUBSTANTIATED and risk_score == 2.00"
            - "After the substantiate: PatientRecord.${rec_f1_id}.integrity_state == FRAUD_CONFIRMED"
            - "After the substantiate: RegistrationSite.${site_fc_id}.flagged_record_count == 1 and active_record_count == 4"
            - "After the substantiate: DuplicateCandidatePair.${pair_p3_id}.queue_state == NEW"
            - "PatientRecord.${rec_f2_id}.integrity_state == CLEAR and PatientRecord.${rec_f3_id}.integrity_state == CLEAR"
            - "DuplicateCandidatePair.${pair_p3_id}.conflict_flags == [SSN4_CONFLICT] and match_score == 0.00"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: occ_stale_record_version_outranks_fraud_hold
        grounds:
          - validations[priority=20]
          - validations[priority=21]
          - concurrency_rules[overlay-create-stale-record-version]
          - state_machines.PatientRecord.CLEAR_to_FRAUD_SUSPECTED
        distinguishing_aspect: |
          Category pair business_constraint (priority 20, ERR_STALE_RECORD_VERSION, HTTP 412)
          versus business_safety (priority 21, ERR_RECORD_UNDER_FRAUD_HOLD, HTTP 409): one
          POST /mpi/overlay-corrections violates BOTH and must return 412
          ERR_STALE_RECORD_VERSION, and re-issuing the identical request with the CURRENT
          version returns 409 ERR_RECORD_UNDER_FRAUD_HOLD, proving both rules were live and
          that the OCC check runs first.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-OC."
            - "One ACTIVE PatientRecord OC-9001 observed by the client at version 1."
            - "A PrivacyOfficer then opens a MANUAL FraudInvestigation on OC-9001; the CLEAR -> FRAUD_SUSPECTED integrity transition increments PatientRecord.version to 2, so the client's observed version 1 is now stale AND the record is under a fraud hold."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-OC", name: "Occ Conflict Clinic", region_code: "US-WA", registrar_headcount: 2 }
              as: MpiAdmin
              captures: { site_oc_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_oc_id}", mrn: "OC-9001", last_name: "Sorensen", first_name: "Karin", dob: "1983-08-25", sex: "F", ssn_last4: "6070", postal_code: "98104", phone: "2065550101", clinical_element_count: 9 }
              as: IdentityAnalyst
              captures: { rec_oc_id: $.data.id, rec_oc_v0: $.data.version }
            - call: "POST /mpi/fraud-investigations"
              payload: { record_id: "${rec_oc_id}", trigger_kind: "MANUAL", note: "Conflicting insurance member ids submitted at two encounters." }
              as: PrivacyOfficer
              as_user_id: "officer-1"
              captures: { inv_oc_id: $.data.id }
            - call: "GET /mpi/patient-records/${rec_oc_id}"
              payload: {}
              as: IdentityAnalyst
              captures: { rec_oc_v1: $.data.version, rec_oc_integrity: $.data.integrity_state }
          trigger:
            - call: "POST /mpi/overlay-corrections"
              payload: { record_id: "${rec_oc_id}", overlay_type: "DEMOGRAPHIC_OVERWRITE", corrected_field_snapshot: { last_name: "Sorensen-Lie", dob: "1983-08-26" }, affected_clinical_element_count: 3, encounter_from_date: "2026-07-05", encounter_to_date: "2026-07-19", expected_record_version: "${rec_oc_v0}" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /mpi/overlay-corrections"
              payload: { record_id: "${rec_oc_id}", overlay_type: "DEMOGRAPHIC_OVERWRITE", corrected_field_snapshot: { last_name: "Sorensen-Lie", dob: "1983-08-26" }, affected_clinical_element_count: 3, encounter_from_date: "2026-07-05", encounter_to_date: "2026-07-19", expected_record_version: "${rec_oc_v1}" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
          assert:
            - "PatientRecord.${rec_oc_id}.version == 2 after the fraud open (so ${rec_oc_v0} == 1 is stale and ${rec_oc_v1} == 2 is current)"
            - "PatientRecord.${rec_oc_id}.integrity_state == FRAUD_SUSPECTED"
            - "First trigger call: HTTP 412 with $.data.error_id == \"ERR_STALE_RECORD_VERSION\""
            - "First trigger call: $.data.error_id != \"ERR_RECORD_UNDER_FRAUD_HOLD\" (priority 20 beats priority 21)"
            - "Second trigger call: HTTP 409 with $.data.error_id == \"ERR_RECORD_UNDER_FRAUD_HOLD\""
            - "GET /mpi/overlay-corrections?record_id=${rec_oc_id} returns exactly 0 rows (neither rejected call created an OverlayCorrection)"
            - "PatientRecord.${rec_oc_id}.last_name == \"Sorensen\" and dob == \"1983-08-25\" (no field was written)"
            - "PatientRecord.${rec_oc_id}.version == 2 (rejected writes do not bump the version)"

      - name: fraud_hold_outranks_pair_queue_state
        grounds:
          - validations[priority=21]
          - validations[priority=26]
          - state_machines.DuplicateCandidatePair.UNDER_REVIEW_to_ESCALATED_FRAUD
          - state_machines.DuplicateCandidatePair.ESCALATED_FRAUD_to_UNDER_REVIEW
        distinguishing_aspect: |
          A DIFFERENT category pair from the instance above - business_safety (priority 21,
          ERR_RECORD_UNDER_FRAUD_HOLD) versus state (priority 26, ERR_PAIR_INVALID_STATE),
          both HTTP 409: re-triaging a pair that is simultaneously in a non-triageable
          queue_state AND holds a FRAUD_SUSPECTED member must return
          ERR_RECORD_UNDER_FRAUD_HOLD, and after the investigation is unsubstantiated the
          identical call returns ERR_PAIR_INVALID_STATE.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-PC and one DRAFT MatchRuleSet RS-BASE."
            - "Two ACTIVE PatientRecord rows scoring 77.50 STRICT -> POTENTIAL_DUPLICATE, so the pair starts in NEW."
            - "The pair is triaged and taken into review, reaching queue_state UNDER_REVIEW - a state from which POST /mpi/candidate-pairs/{id}/triage declares no transition."
            - "A PrivacyOfficer then opens a MANUAL FraudInvestigation on member PC-7001, which sets that record's integrity_state to FRAUD_SUSPECTED and cascades the pair from UNDER_REVIEW to ESCALATED_FRAUD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-PC", name: "Priority Conflict Clinic", region_code: "US-OH", registrar_headcount: 4 }
              as: MpiAdmin
              captures: { site_pc_id: $.data.id }
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Baseline Match Rules", version_label: "V-BASE-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
              captures: { rs_base_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_pc_id}", mrn: "PC-7001", last_name: "Delacroix", first_name: "Mathilde", dob: "1977-02-11", sex: "F", ssn_last4: "5544", clinical_element_count: 15 }
              as: IdentityAnalyst
              captures: { rec_pc1_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_pc_id}", mrn: "PC-7002", last_name: "delacroix", first_name: "Mat", dob: "1977-02-11", sex: "F", ssn_last4: "5544", clinical_element_count: 5 }
              as: IdentityAnalyst
              captures: { rec_pc2_id: $.data.id }
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_pc1_id}", record_b_id: "${rec_pc2_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_pc_id: $.data.id }
            - call: "POST /mpi/candidate-pairs/${pair_pc_id}/triage"
              payload: { triage_note: "Queueing for manual adjudication." }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /mpi/candidate-pairs/${pair_pc_id}/start-review"
              payload: {}
              as: IdentityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /mpi/fraud-investigations"
              payload: { record_id: "${rec_pc1_id}", trigger_kind: "BIOMETRIC_CONFLICT", note: "Fingerprint template does not match the enrolled template." }
              as: PrivacyOfficer
              as_user_id: "officer-1"
              captures: { inv_pc_id: $.data.id }
          trigger:
            - call: "POST /mpi/candidate-pairs/${pair_pc_id}/triage"
              payload: { triage_note: "Attempting to re-triage the escalated pair." }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /mpi/fraud-investigations/${inv_pc_id}/unsubstantiate"
              payload: { finding_note: "Template mismatch traced to a faulty capture device; no fraud." }
              as: PrivacyOfficer
              as_user_id: "officer-1"
            - call: "POST /mpi/candidate-pairs/${pair_pc_id}/triage"
              payload: { triage_note: "Attempting to re-triage the escalated pair." }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
          assert:
            - "Before the first trigger call: DuplicateCandidatePair.${pair_pc_id}.queue_state == ESCALATED_FRAUD and PatientRecord.${rec_pc1_id}.integrity_state == FRAUD_SUSPECTED"
            - "First trigger call: HTTP 409 with $.data.error_id == \"ERR_RECORD_UNDER_FRAUD_HOLD\""
            - "First trigger call: $.data.error_id != \"ERR_PAIR_INVALID_STATE\" (priority 21 beats priority 26)"
            - "After the unsubstantiate: FraudInvestigation.${inv_pc_id}.state == UNSUBSTANTIATED"
            - "After the unsubstantiate: PatientRecord.${rec_pc1_id}.integrity_state == CLEAR"
            - "After the unsubstantiate: DuplicateCandidatePair.${pair_pc_id}.queue_state == UNDER_REVIEW"
            - "After the unsubstantiate: RegistrationSite.${site_pc_id}.flagged_record_count == 0"
            - "Third trigger call: HTTP 409 with $.data.error_id == \"ERR_PAIR_INVALID_STATE\""
            - "DuplicateCandidatePair.${pair_pc_id}.queue_state == UNDER_REVIEW after the third call (the rejected triage changed nothing)"
            - "DuplicateCandidatePair.${pair_pc_id}.triage_note == \"Queueing for manual adjudication.\""

      - name: propagation_deadline_outranks_dispatch_capacity
