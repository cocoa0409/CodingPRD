              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "GET /listings/${lst_id}/offers"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { total: $.meta }
            - call: "GET /listings/${lst_id}"
              payload: {}
              as: Member
              as_user_id: "${s_id}"
              captures: { ooc: $.data.open_offer_count }
          assert:
            - "GET /listings/${lst_id}/offers returns response_type array, data == [] (total_count 0, has_more false)"
            - "Listing.${lst_id}.open_offer_count == 0"

