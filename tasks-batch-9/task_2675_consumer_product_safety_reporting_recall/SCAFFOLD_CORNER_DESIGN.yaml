      - name: replaying_an_advanced_verb_returns_that_entity_own_state_error
        claim_type: Error Triggerable
        grounds:
          - validations[9]
          - errors.ERR_RECALL_PLAN_STATE_INVALID
          - errors.ERR_VISIT_STATE_INVALID
          - errors.ERR_NOTICE_STATE_INVALID
          - errors.ERR_CLAIM_STATE_INVALID
          - errors.ERR_PROGRESS_REPORT_STATE_INVALID
          - errors.ERR_PENALTY_CASE_STATE_INVALID
        distinguishing_aspect: |
          Six per-entity state codes exist precisely so that a replayed verb names the
          row that refused it. Replaying six different verbs on one fully advanced
          docket must produce six DISTINCT error_ids; a shared ERR_STATE_INVALID, or
          a 200 from a silently idempotent handler, collapses the catalog. Every
          replay is on a row that already left the required `from:` state, so none of
          them can be rescued by a later precondition.
        test_recipe:
          setup:
            - "fixture chain F1 driven all the way to a MONITORING recall with a VERIFIED notification, a COMPLETED audit visit, a RELEASED consumer notice, a FULFILLED 10-unit remedy claim, an ACCEPTED progress report and an AGREED civil penalty case"
