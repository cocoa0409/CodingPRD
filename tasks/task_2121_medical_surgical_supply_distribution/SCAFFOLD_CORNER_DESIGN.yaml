  - section: errors
    instances:

      - name: unknown_path_ids_map_to_their_own_not_found_error_ids
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SUPPLY_ROOM_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_FOUND]
          - errors[ERR_CONTRACT_LINE_NOT_FOUND]
          - errors[ERR_ORDER_NOT_FOUND]
          - errors[ERR_LOT_NOT_FOUND]
          - errors[ERR_FORMULARY_ITEM_NOT_FOUND]
          - errors[ERR_ORDER_LINE_NOT_FOUND]
          - errors[ERR_SUBSTITUTION_REQUEST_NOT_FOUND]
          - errors[ERR_RECALL_NOTICE_NOT_FOUND]
          - errors[ERR_ROUTE_NOT_FOUND]
          - errors[ERR_CHARGEBACK_CLAIM_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "Each collection reports its own 404 error id rather than a shared generic one: supply-rooms, contracts, contract-lines, formulary-items, orders, order-lines, substitution-requests, lots, recall-notices, delivery-routes and chargeback-claims each return a distinct ERR_*_NOT_FOUND."
        test_recipe:
          setup:
