  - rule_id: transitive_cascade
    instances:
      - name: offer_cancel_depth3_cascade
        grounds:
          - state_machines.SurplusOffer.SCHEDULED_to_CANCELLED
          - state_machines.GleanEvent.OPEN_to_CANCELLED
          - state_machines.CrewAssignment.CONFIRMED_to_DECLINED
        distinguishing_aspect: |
          Depth-3 transitive chain from trigger POST /glean/offers/{id}/cancel:
          offer SCHEDULED->CANCELLED mutates its OPEN GleanEvent to CANCELLED;
          the event's own cancellation transition mutates the CONFIRMED
          CrewAssignment to DECLINED; the assignment decline transition decrements
          crew_confirmed_count and releases the assigned Vehicle ASSIGNED->
          AVAILABLE. Each link is caused by the previous link's transition, not
          by the original cancel call. Distinct trigger from the incident chain.
        test_recipe:
          setup:
            - "Offer with one event OPEN; vehicle ASSIGNED; one volunteer with waiver CONFIRMED (crew_confirmed_count 1 of 3)"
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "FT", contact_email: "ft@x.com", county_code: "TTT", donor_tin: "91-3456789" }
              as: ProgramCoordinator
              captures: { farm_id: $.data.id }
