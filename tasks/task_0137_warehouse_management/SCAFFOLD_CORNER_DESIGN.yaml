  # =========================================================================
  # Validations
  # =========================================================================
  - section: validations
    instances:
      - name: duplicate_sku_code_returns_conflict
        claim_type: Violation → Error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_DUPLICATE_CODE]"
        distinguishing_aspect: "Creating a second SKU with an existing sku_code returns ERR_DUPLICATE_CODE (409)."
        test_recipe:
          setup: ["A SKU with sku_code SKU-DUP exists."]
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-DUP", description: "first", abc_class: "A", each_volume_cm3: 1, min_qty: 1, max_qty: 10 }
              as: PlatformAdmin
          trigger:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-DUP", description: "second", abc_class: "B", each_volume_cm3: 2, min_qty: 1, max_qty: 10 }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_CODE"

      - name: asn_close_with_open_line_returns_lines_open
        claim_type: Violation → Error
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_ASN_LINES_OPEN]"
        distinguishing_aspect: "Closing a RECEIVING ASN whose line is still OPEN (received 3 of expected 5) returns ERR_ASN_LINES_OPEN (409). Differs from the §1.8 priority-conflict instance because here the ASN is in a valid close-from state (RECEIVING), isolating the business_constraint check."
        test_recipe:
          setup: ["A RECEIVING ASN with one OPEN line (received 3 of 5)."]
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-LO1", description: "lo", abc_class: "C", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-LO1", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { aid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/lines"
              payload: { sku_id: "${sid}", expected_qty: 5 }
              as: ReceivingClerk
              captures: { lnid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/receipts"
              payload: { asn_line_id: "${lnid}", received_qty: 3 }
              as: ReceivingClerk
          trigger:
            - call: "POST /warehouse/inbound-asns/${aid}/close"
              payload: {}
              as: ReceivingClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ASN_LINES_OPEN"
            - "InboundAsn.${aid}.status == RECEIVING"

