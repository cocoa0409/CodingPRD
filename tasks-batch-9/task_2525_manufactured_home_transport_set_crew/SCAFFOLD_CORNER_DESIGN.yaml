          - calculations.permit_fee_assessment
        distinguishing_aspect: |
          The REQUESTED -> FEE_PAID edge is threshold-guarded, not
          call-count-guarded: a first partial remittance of 8000 leaves the permit
          REQUESTED with paid_amount_cents 8000, and only the second remittance
          that lifts the running total to the 16500 provisional fee flips the
          state. Issuing then sets valid_until_date to the logical date plus
          PERMIT_VALID_DAYS (2026-08-06) and pulls the section to DISPATCH_READY.
