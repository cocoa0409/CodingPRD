# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
#   task_2543 — Wine Grape Contract & Weigh Tag Settlement
#   Nine §0.5 rule_ids, 21 instances. Every literal in every `assert:` line was
#   computed by executing the §1.3 formulas with Decimal/ROUND_HALF_UP.
#   Fixture conventions shared by every instance:
#     - the logical clock starts at 2026-08-01T00:00:00Z and is always moved
#       explicitly with POST /_clock/set_current_utc before anything time-gated;
#     - the reference QualitySpec is min_brix_accept 20.0, brix_penalty_start 22.0,
#       brix_bonus_start 24.0, brix_step 0.5, bonus 1.5 pp/step, penalty 2.0 pp/step,
#       ta 5.5-9.0 with a flat 3.0 pp penalty, rot_free 2.0 with 1.5 pp per whole
#       point, rot_rejection 8.0, mog_max 1.0 with a flat 2.5 pp penalty, clamped to
#       [-20.0, +8.0], min_brix_pick_call 21.0;
#     - ScaleOperator acts as "scale-op-1" and QualityLabTech as "lab-1" so the
#       segregation-of-duties rule (validation priority 4) is satisfied by default.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_basis_load_by_load_versus_weighted_blend_divergence
        grounds:
          - calculations.final_settlement_total
          - calculations.quality_adjustment_pct
          - calculations.settlement_line_amount
          - entities.GrapeContract.fields.settlement_basis
          - entities.QualityGrade.fields.raw_adjustment_pct
          - state_machines.SettlementLine.PROVISIONAL_to_FINAL
        distinguishing_aspect: |
          This dual variant lives in the MONEY domain on GrapeContract: two contracts fed
          byte-identical loads (22.000 t at Brix 28.0 and 18.000 t at Brix 21.5) settle to
          18630000 cents under LOAD_BY_LOAD and 19026000 cents under WEIGHTED_BLEND, a
          divergence of exactly 396000 cents caused by blending the PRE-clamp
          raw_adjustment_pct (+12.0) instead of the per-load clamped adjustment_pct (+8.0).
        test_recipe:
          setup:
            - "One producer, one 20-acre Cabernet block, one reference QualitySpec, one crush-pad lane and one sampling crew."
            - "Two ACTIVE TONNAGE-basis contracts on the same block, both committed_tons 40.000 and base_price_per_ton_cents 450000, differing ONLY in settlement_basis (contract A LOAD_BY_LOAD, contract B WEIGHTED_BLEND)."
            - "Each contract receives two loads: 22.000 net tons graded at Brix 28.0 (raw +12.0 pp, clamped +8.0 pp) and 18.000 net tons graded at Brix 21.5 (-2.0 pp)."
            - "Both contracts are settlement-closed at logical clock 2026-08-28T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T08:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/growers"
              payload: { name: "Ridgeline Vineyards", license_number: "PL-44821", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
              captures: { grower_id: $.data.id }
            - call: "POST /grower-relations/vineyard-blocks"
              payload: { grower_id: "${grower_id}", block_code: "B-12", varietal: "CABERNET_SAUVIGNON", acres: 20.000, expected_yield_tons_per_acre: 2.000, ava_code: "NAPA-VALLEY" }
              as: GrowerRelationsManager
              captures: { block_id: $.data.id }
            - call: "POST /grower-relations/quality-specs"
              payload: { spec_code: "CAB-STD-2026", min_brix_accept: 20.0, brix_bonus_start: 24.0, brix_penalty_start: 22.0, rot_rejection_pct: 8.0, min_brix_pick_call: 21.0 }
              as: GrowerRelationsManager
              captures: { spec_id: $.data.id }
            - call: "POST /grower-relations/crush-pad-lanes"
              payload: { lane_code: "L1", daily_capacity_tons: 80.000 }
              as: HarvestCoordinator
              captures: { lane_id: $.data.id }
            - call: "POST /grower-relations/sampling-crews"
              payload: { crew_code: "SC-1", region_code: "NAPA-NORTH" }
              as: HarvestCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_id}", quality_spec_id: "${spec_id}", contract_code: "GC-A-LBL", contract_basis: "TONNAGE", base_price_per_ton_cents: 450000, over_delivery_policy: "ACCEPT_AT_SPOT", term_start_vintage: 2026, term_end_vintage: 2028, committed_tons: 40.000, settlement_basis: "LOAD_BY_LOAD", installment_plan: [{ installment_no: 1, pct_of_settlement: 100.0, due_offset_days: 30, lien_protected: true }] }
              as: GrowerRelationsManager
              captures: { contract_a_id: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_id}", quality_spec_id: "${spec_id}", contract_code: "GC-B-WB", contract_basis: "TONNAGE", base_price_per_ton_cents: 450000, over_delivery_policy: "ACCEPT_AT_SPOT", term_start_vintage: 2026, term_end_vintage: 2028, committed_tons: 40.000, settlement_basis: "WEIGHTED_BLEND", installment_plan: [{ installment_no: 1, pct_of_settlement: 100.0, due_offset_days: 30, lien_protected: true }] }
              as: GrowerRelationsManager
              captures: { contract_b_id: $.data.id }
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_a_id}", block_id: "${block_id}" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_b_id}", block_id: "${block_id}" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_a_id}/offer"
              payload: {}
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_a_id}/accept"
              payload: {}
              as: Grower
              as_user_id: "${grower_id}"
            - call: "POST /grower-relations/grape-contracts/${contract_b_id}/offer"
              payload: {}
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_b_id}/accept"
              payload: {}
              as: Grower
              as_user_id: "${grower_id}"
            - call: "POST /grower-relations/sampling-visits"
              payload: { contract_id: "${contract_a_id}", block_id: "${block_id}", crew_id: "${crew_id}", window_start: "2026-08-20T14:00:00Z", window_end: "2026-08-20T16:00:00Z" }
              as: HarvestCoordinator
              captures: { visit_a_id: $.data.id }
            - call: "POST /grower-relations/sampling-visits/${visit_a_id}/record"
              payload: { measured_brix: 24.5, measured_ta_gl: 6.5, measured_ph: 3.45, measured_rot_pct: 1.0 }
              as: HarvestCoordinator
            - call: "POST /grower-relations/sampling-visits"
              payload: { contract_id: "${contract_b_id}", block_id: "${block_id}", crew_id: "${crew_id}", window_start: "2026-08-20T17:00:00Z", window_end: "2026-08-20T19:00:00Z" }
              as: HarvestCoordinator
              captures: { visit_b_id: $.data.id }
            - call: "POST /grower-relations/sampling-visits/${visit_b_id}/record"
              payload: { measured_brix: 24.5, measured_ta_gl: 6.5, measured_ph: 3.45, measured_rot_pct: 1.0 }
              as: HarvestCoordinator
            - call: "POST /grower-relations/pick-calls"
              payload: { contract_id: "${contract_a_id}", block_id: "${block_id}", target_pick_at: "2026-08-25T14:00:00Z", estimated_tons: 45.000 }
              as: HarvestCoordinator
              captures: { pick_a_id: $.data.id }
            - call: "POST /grower-relations/pick-calls/${pick_a_id}/acknowledge"
              payload: {}
              as: Grower
              as_user_id: "${grower_id}"
            - call: "POST /grower-relations/pick-calls"
              payload: { contract_id: "${contract_b_id}", block_id: "${block_id}", target_pick_at: "2026-08-27T14:00:00Z", estimated_tons: 45.000 }
              as: HarvestCoordinator
              captures: { pick_b_id: $.data.id }
            - call: "POST /grower-relations/pick-calls/${pick_b_id}/acknowledge"
              payload: {}
              as: Grower
              as_user_id: "${grower_id}"
            - call: "POST /grower-relations/delivery-appointments"
              payload: { pick_call_id: "${pick_a_id}", lane_id: "${lane_id}", window_start: "2026-08-25T14:00:00Z", window_end: "2026-08-25T16:00:00Z", planned_tons: 22.000 }
              as: HarvestCoordinator
              captures: { appt_a1_id: $.data.id, appt_a1_version: $.data.version }
            - call: "POST /grower-relations/delivery-appointments"
              payload: { pick_call_id: "${pick_a_id}", lane_id: "${lane_id}", window_start: "2026-08-25T17:00:00Z", window_end: "2026-08-25T19:00:00Z", planned_tons: 18.000 }
              as: HarvestCoordinator
              captures: { appt_a2_id: $.data.id, appt_a2_version: $.data.version }
            - call: "POST /grower-relations/delivery-appointments"
              payload: { pick_call_id: "${pick_b_id}", lane_id: "${lane_id}", window_start: "2026-08-27T14:00:00Z", window_end: "2026-08-27T16:00:00Z", planned_tons: 22.000 }
              as: HarvestCoordinator
              captures: { appt_b1_id: $.data.id, appt_b1_version: $.data.version }
            - call: "POST /grower-relations/delivery-appointments"
              payload: { pick_call_id: "${pick_b_id}", lane_id: "${lane_id}", window_start: "2026-08-27T17:00:00Z", window_end: "2026-08-27T19:00:00Z", planned_tons: 18.000 }
              as: HarvestCoordinator
              captures: { appt_b2_id: $.data.id, appt_b2_version: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T14:30:00Z" }
              as: ScaleOperator
              as_user_id: "scale-op-1"
            - call: "POST /grower-relations/weigh-tags"
              payload: { appointment_id: "${appt_a1_id}", block_id: "${block_id}", gross_weight_lbs: 61240, expected_appointment_version: "${appt_a1_version}" }
              as: ScaleOperator
              as_user_id: "scale-op-1"
              captures: { tag_a1_id: $.data.id }
            - call: "POST /grower-relations/weigh-tags/${tag_a1_id}/tare"
              payload: { tare_weight_lbs: 17240 }
              as: ScaleOperator
              as_user_id: "scale-op-1"
              captures: { tag_a1_v: $.data.version }
            - call: "POST /grower-relations/weigh-tags/${tag_a1_id}/grades"
              payload: { brix: 28.0, ta_gl: 6.5, ph: 3.60, rot_pct: 1.0, mog_pct: 0.5, expected_weigh_tag_version: "${tag_a1_v}" }
              as: QualityLabTech
              as_user_id: "lab-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T17:30:00Z" }
              as: ScaleOperator
              as_user_id: "scale-op-1"
            - call: "POST /grower-relations/weigh-tags"
              payload: { appointment_id: "${appt_a2_id}", block_id: "${block_id}", gross_weight_lbs: 53000, expected_appointment_version: "${appt_a2_version}" }
              as: ScaleOperator
              as_user_id: "scale-op-1"
              captures: { tag_a2_id: $.data.id }
            - call: "POST /grower-relations/weigh-tags/${tag_a2_id}/tare"
              payload: { tare_weight_lbs: 17000 }
              as: ScaleOperator
              as_user_id: "scale-op-1"
              captures: { tag_a2_v: $.data.version }
            - call: "POST /grower-relations/weigh-tags/${tag_a2_id}/grades"
              payload: { brix: 21.5, ta_gl: 6.5, ph: 3.30, rot_pct: 1.0, mog_pct: 0.5, expected_weigh_tag_version: "${tag_a2_v}" }
              as: QualityLabTech
              as_user_id: "lab-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-27T14:30:00Z" }
              as: ScaleOperator
              as_user_id: "scale-op-1"
            - call: "POST /grower-relations/weigh-tags"
              payload: { appointment_id: "${appt_b1_id}", block_id: "${block_id}", gross_weight_lbs: 61240, expected_appointment_version: "${appt_b1_version}" }
              as: ScaleOperator
              as_user_id: "scale-op-1"
              captures: { tag_b1_id: $.data.id }
            - call: "POST /grower-relations/weigh-tags/${tag_b1_id}/tare"
              payload: { tare_weight_lbs: 17240 }
              as: ScaleOperator
              as_user_id: "scale-op-1"
              captures: { tag_b1_v: $.data.version }
            - call: "POST /grower-relations/weigh-tags/${tag_b1_id}/grades"
              payload: { brix: 28.0, ta_gl: 6.5, ph: 3.60, rot_pct: 1.0, mog_pct: 0.5, expected_weigh_tag_version: "${tag_b1_v}" }
              as: QualityLabTech
              as_user_id: "lab-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-27T17:30:00Z" }
              as: ScaleOperator
              as_user_id: "scale-op-1"
            - call: "POST /grower-relations/weigh-tags"
              payload: { appointment_id: "${appt_b2_id}", block_id: "${block_id}", gross_weight_lbs: 53000, expected_appointment_version: "${appt_b2_version}" }
              as: ScaleOperator
              as_user_id: "scale-op-1"
              captures: { tag_b2_id: $.data.id }
            - call: "POST /grower-relations/weigh-tags/${tag_b2_id}/tare"
              payload: { tare_weight_lbs: 17000 }
              as: ScaleOperator
              as_user_id: "scale-op-1"
              captures: { tag_b2_v: $.data.version }
            - call: "POST /grower-relations/weigh-tags/${tag_b2_id}/grades"
              payload: { brix: 21.5, ta_gl: 6.5, ph: 3.30, rot_pct: 1.0, mog_pct: 0.5, expected_weigh_tag_version: "${tag_b2_v}" }
              as: QualityLabTech
              as_user_id: "lab-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-28T09:00:00Z" }
              as: GrowerRelationsManager
          trigger:
            - call: "POST /grower-relations/grape-contracts/${contract_a_id}/settlement-close"
              payload: {}
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_b_id}/settlement-close"
              payload: {}
              as: GrowerRelationsManager
          assert:
            - "GrapeContract.${contract_a_id}.final_settlement_cents == 18630000"
            - "GrapeContract.${contract_b_id}.final_settlement_cents == 19026000"
            - "GrapeContract.${contract_b_id}.final_settlement_cents - GrapeContract.${contract_a_id}.final_settlement_cents == 396000"
            - "The CONTRACT-bucket SettlementLine of WeighTag ${tag_a1_id} has final_amount_cents == 10692000 and price_per_ton_cents == 486000"
            - "The CONTRACT-bucket SettlementLine of WeighTag ${tag_a2_id} has final_amount_cents == 7938000 and price_per_ton_cents == 441000"
            - "The CONTRACT-bucket SettlementLine of WeighTag ${tag_b1_id} has final_amount_cents == 10464300"
            - "The CONTRACT-bucket SettlementLine of WeighTag ${tag_b2_id} has final_amount_cents == 8561700"
            - "GrapeContract.${contract_a_id}.net_payable_cents == 17977950 (credit 279450, holdback 931500)"
            - "GrapeContract.${contract_b_id}.net_payable_cents == 18360090 (credit 285390, holdback 951300)"
            - "Every SettlementLine of both contracts has status == FINAL and voided_at == null"

      - name: grower_reliability_vintage_scope_versus_lifetime_scope_divergence
        grounds:
          - calculations.grower_reliability_score
          - entities.Grower.fields.reliability_score_vintage
          - entities.Grower.fields.reliability_score_lifetime
          - entities.Grower.fields.prior_vintage_penalty_units
          - state_machines.PickCall.ISSUED_to_EXPIRED
          - state_machines.WeighTag.PENDING_to_REJECTED_QUALITY
        distinguishing_aspect: |
          This dual variant lives in the RISK-SCORING domain on Grower, not in the money domain
          of the first instance: from one stored row-set (one 2026 quality rejection worth 8
          units and one 2025 expired pick call worth 5 prior-vintage units) VINTAGE_SCOPED
          returns 92.0 while LIFETIME_SCOPED returns 89.0, because only the lifetime variant
          adds round_half_up(5 / 2) = 3 decayed prior-vintage units.
        test_recipe:
          setup:
            - "One producer with a 2025-2028 TONNAGE contract, one block, the reference QualitySpec, one lane and one crew."
            - "Vintage 2025: a pick call is issued at 2025-08-20T08:00:00Z with a 24-hour acknowledgement window and left unacknowledged, so the clock expires it (5 prior-vintage penalty units)."
            - "Vintage 2026: one 22.000-ton load is graded at rot_pct 9.0, at or above rot_rejection_pct 8.0, so it is rejected on quality (8 current-vintage penalty units)."
            - "No other rejection, expiry or no-show exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2025-08-20T08:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/growers"
              payload: { name: "Ridgeline Vineyards", license_number: "PL-44821", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
              captures: { grower_id: $.data.id }
            - call: "POST /grower-relations/vineyard-blocks"
              payload: { grower_id: "${grower_id}", block_code: "B-12", varietal: "CABERNET_SAUVIGNON", acres: 20.000, expected_yield_tons_per_acre: 2.000, ava_code: "NAPA-VALLEY" }
              as: GrowerRelationsManager
              captures: { block_id: $.data.id }
            - call: "POST /grower-relations/quality-specs"
              payload: { spec_code: "CAB-STD-2026", min_brix_accept: 20.0, brix_bonus_start: 24.0, brix_penalty_start: 22.0, rot_rejection_pct: 8.0, min_brix_pick_call: 21.0 }
              as: GrowerRelationsManager
              captures: { spec_id: $.data.id }
            - call: "POST /grower-relations/crush-pad-lanes"
              payload: { lane_code: "L1", daily_capacity_tons: 80.000 }
              as: HarvestCoordinator
              captures: { lane_id: $.data.id }
            - call: "POST /grower-relations/sampling-crews"
              payload: { crew_code: "SC-1", region_code: "NAPA-NORTH" }
              as: HarvestCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_id}", quality_spec_id: "${spec_id}", contract_code: "GC-2025-001", contract_basis: "TONNAGE", base_price_per_ton_cents: 450000, over_delivery_policy: "ACCEPT_AT_SPOT", term_start_vintage: 2025, term_end_vintage: 2028, committed_tons: 40.000, installment_plan: [{ installment_no: 1, pct_of_settlement: 100.0, due_offset_days: 30, lien_protected: true }] }
              as: GrowerRelationsManager
              captures: { contract_id: $.data.id }
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/offer"
              payload: {}
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/accept"
              payload: {}
              as: Grower
              as_user_id: "${grower_id}"
            - call: "POST /grower-relations/sampling-visits"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", crew_id: "${crew_id}", window_start: "2025-08-20T09:00:00Z", window_end: "2025-08-20T11:00:00Z" }
              as: HarvestCoordinator
              captures: { visit_2025_id: $.data.id }
            - call: "POST /grower-relations/sampling-visits/${visit_2025_id}/record"
              payload: { measured_brix: 24.5, measured_ta_gl: 6.5, measured_ph: 3.45, measured_rot_pct: 1.0 }
              as: HarvestCoordinator
            - call: "POST /grower-relations/pick-calls"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", target_pick_at: "2025-08-25T14:00:00Z", estimated_tons: 20.000 }
              as: HarvestCoordinator
              captures: { pick_2025_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2025-08-21T09:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T08:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/sampling-visits"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", crew_id: "${crew_id}", window_start: "2026-08-20T09:00:00Z", window_end: "2026-08-20T11:00:00Z" }
              as: HarvestCoordinator
              captures: { visit_2026_id: $.data.id }
            - call: "POST /grower-relations/sampling-visits/${visit_2026_id}/record"
              payload: { measured_brix: 24.5, measured_ta_gl: 6.5, measured_ph: 3.45, measured_rot_pct: 1.0 }
              as: HarvestCoordinator
            - call: "POST /grower-relations/pick-calls"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", target_pick_at: "2026-08-25T14:00:00Z", estimated_tons: 45.000 }
              as: HarvestCoordinator
              captures: { pick_2026_id: $.data.id }
            - call: "POST /grower-relations/pick-calls/${pick_2026_id}/acknowledge"
              payload: {}
              as: Grower
              as_user_id: "${grower_id}"
            - call: "POST /grower-relations/delivery-appointments"
              payload: { pick_call_id: "${pick_2026_id}", lane_id: "${lane_id}", window_start: "2026-08-25T14:00:00Z", window_end: "2026-08-25T16:00:00Z", planned_tons: 22.000 }
              as: HarvestCoordinator
              captures: { appt_id: $.data.id, appt_version: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T14:30:00Z" }
              as: ScaleOperator
              as_user_id: "scale-op-1"
            - call: "POST /grower-relations/weigh-tags"
              payload: { appointment_id: "${appt_id}", block_id: "${block_id}", gross_weight_lbs: 61240, expected_appointment_version: "${appt_version}" }
              as: ScaleOperator
              as_user_id: "scale-op-1"
              captures: { tag_id: $.data.id }
            - call: "POST /grower-relations/weigh-tags/${tag_id}/tare"
              payload: { tare_weight_lbs: 17240 }
              as: ScaleOperator
              as_user_id: "scale-op-1"
              captures: { tag_v: $.data.version }
          trigger:
            - call: "POST /grower-relations/weigh-tags/${tag_id}/grades"
              payload: { brix: 24.5, ta_gl: 6.5, ph: 3.55, rot_pct: 9.0, mog_pct: 0.5, expected_weigh_tag_version: "${tag_v}" }
              as: QualityLabTech
              as_user_id: "lab-1"
          assert:
            - "WeighTag.${tag_id}.disposition == REJECTED_QUALITY"
