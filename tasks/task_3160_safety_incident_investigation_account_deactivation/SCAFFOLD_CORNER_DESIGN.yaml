          assert:
            - "Account.${acct_warn}.risk_score == 0.0, because the DECIDED/WARNING incident is excluded from the incident term and the WARNING action contributes no enforcement weight"
            - "Account.${acct_restrict}.risk_score == 240.0 = the 60.0 S2 incident base (age 0, decay 1.00) plus the 180.0 enforcement weight for its one ACTIVE action"
            - "Account.${acct_warn}.standing_enforcement_count == 0 and Account.${acct_warn}.safety_posture == \"OPEN\""
            - "Account.${acct_restrict}.standing_enforcement_count == 1 and Account.${acct_restrict}.safety_posture == \"RESTRICTED\""

      - name: evidence_cap_binds_before_the_type_cap_and_rounds_half_up
        claim_type: Precision
        grounds:
          - calculations.evidence_admissibility_score
          - calculations.evidence_admissibility_score.constants.RELIABILITY_EXTERNAL_RECORD
          - calculations.evidence_admissibility_score.constants.CAP_LAW_ENFORCEMENT_CONTACT
        distinguishing_aspect: "A single LAW_ENFORCEMENT_CONTACT item rounds half-up to exactly 0.70 and then binds against its own 0.70 type cap, so neither the raw reading nor the cap can raise it — a precise rounding-and-cap interaction on one item."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy with sd_floor_severity S4. One ACTIVE driver account with one held S4 SEXUAL_MISCONDUCT incident and exactly one DISPOSITIVE LAW_ENFORCEMENT_CONTACT evidence item, accepted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4" }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Rosa Aguirre", contact_email: "rosa.aguirre@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "SEXUAL_MISCONDUCT" }
              as: SafetyInvestigator
              captures: { inc_id: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/hold"
              payload: {}
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "LAW_ENFORCEMENT_CONTACT", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { ev_id: $.data.id, ev_status: $.data.evidence_status }
          trigger:
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${ev_id}", accepted: true }
              as: SafetyInvestigator
              captures: { inc_status: $.data.incident_status, inc_score: $.data.decision_evidence_score, inc_cap_count: $.data.decision_distinct_evidence_sources }
          assert:
            - "the item's unclamped per-item value is 1.425 = 0.95 * 1.50, which the 0.70 LAW_ENFORCEMENT_CONTACT type cap reduces to exactly 0.70"
            - "SafetyIncident.${inc_id}.decision_evidence_score == 0.70, demonstrating round_half_up to two decimals on 0.70 exactly"
            - "SafetyIncident.${inc_id}.decision_distinct_evidence_sources == 1"
            - "the incident reached incident_status == \"PENDING_DECISION\" even though the score is far below every decision threshold, because the transition is gated on outstanding evidence only"

      - name: rescreen_cadence_floor_reads_the_review_generation_index
        claim_type: Constants Applied
        grounds:
          - calculations.rescreen_cadence_projection
          - calculations.rescreen_cadence_projection.constants.DRIFT_INDEX_DIVISOR
          - entities.BackgroundCheck.fields.scheduled_due_at
        distinguishing_aspect: "The rescreen cadence reads the periodicity generation index through a floor division by three, so the due date sits at 548 days after the anchor for generations 1 through 3 and doubles to 1096 days from generation 4 onward."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy with rescreen_refresh_days 548 and review_generation_index 3. One ACTIVE driver account created at 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4", rescreen_refresh_days: 548, review_generation_index: 3 }
              as: PlatformAdmin
              captures: { pol_id: $.data.id, pol_v: $.data.version }
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Soren Vogt", contact_email: "soren.vogt@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /safety/background-checks/rescreen-sweep"
              payload: {}
              as: SafetyOperationsLead
              captures: { sweep_count_gen3: "$.data" }
            - call: "POST /safety/config/advance"
              payload: { region_code: "R1", advance_counter: "review_generation_index" }
              as: PlatformAdmin
              captures: { advanced_gen: $.data.review_generation_index }
            - call: "POST /safety/background-checks/rescreen-sweep"
              payload: {}
              as: SafetyOperationsLead
              captures: { sweep_count_gen4: "$.data" }
          assert:
            - "the first sweep raises exactly one RESCREEN BackgroundCheck with scheduled_due_at == \"2028-04-01T00:00:00Z\", i.e. the account created_at plus 548 days, because floor((3-1)/3) == 0"
            - "the advance moves PlatformPolicy.${pol_id}.review_generation_index to 4"
            - "the second sweep produces no additional RESCREEN row for the account, because its three_year_drift_last_run_index already equals 4 after the advance re-anchored it"
            - "the drift-step boundary is pinned at the divisor: generations 1, 2 and 3 all give zero drift steps and generation 4 is the first that gives one"

  # ===========================================================================
  - section: validations
    instances:

      - name: incident_list_without_role_headers_is_unauthenticated
        claim_type: Violation -> Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - endpoints.GET_/safety/incidents
        distinguishing_aspect: "A request with no X-User-Role at all is refused with 401 before any resource work, while the same request with a role that is simply unknown is refused with 403 — the boundary between unauthenticated and unauthorised."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy published. One incident exists so the read would otherwise succeed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S3" }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "RIDER", home_region_code: "R1", legal_name: "Tara Lund", contact_email: "tara.lund@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "PROPERTY_DAMAGE" }
              as: SafetyInvestigator
          trigger:
            - call: "GET /safety/incidents"
              payload: {}
              as: ""
              captures: { no_role_err: $.data.error_id }
            - call: "GET /safety/incidents"
              payload: {}
              as: NotARole
              captures: { bad_role_err: $.data.error_id }
          assert:
            - "the header-less request is refused with error_id == \"ERR_UNAUTHENTICATED\" with HTTP 401"
            - "the request with the unrecognised role string is refused with error_id == \"ERR_UNAUTHORIZED\" with HTTP 403"
            - "both refusals leave the incident list unchanged, i.e. a follow-up read as SafetyInvestigator still returns 1 row"
            - "the 401 is decided before the 403 path, so a request carrying neither a valid role nor a valid user id cannot reach any resource work"

      - name: cross_region_trip_cannot_become_incident_evidence
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=17]
          - errors[ERR_TRIP_ACCOUNT_MISMATCH]
          - entities.IncidentEvidence.fields.source_entity_id
        distinguishing_aspect: "Validity of an evidence attachment depends entirely on the state of a different entity: the same TRIP_DATA attachment is accepted when the trip involves the incident's subject account and rejected when it involves a different pair."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy with sd_floor_severity S4. Three ACTIVE accounts: acct-a and acct-b in R1, plus acct-c as an unrelated third account. Two trips exist, trip-good involving acct-a and trip-bad involving acct-c."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4" }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "RIDER", home_region_code: "R1", legal_name: "Ula Bakker", contact_email: "ula.bakker@example.com" }
              as: PlatformAdmin
              captures: { acct_a: $.data.id }
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Vito Greco", contact_email: "vito.greco@example.com" }
              as: PlatformAdmin
              captures: { acct_b: $.data.id }
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Wren Ashby", contact_email: "wren.ashby@example.com" }
              as: PlatformAdmin
              captures: { acct_c: $.data.id }
            - call: "POST /safety/trips"
              payload: { rider_account_id: "${acct_a}", driver_account_id: "${acct_b}", region_code: "R1", requested_at: "2026-09-29T00:00:00Z", in_app_message_count: 3 }
              as: PlatformAdmin
              captures: { trip_good: $.data.id }
            - call: "POST /safety/trips"
              payload: { rider_account_id: "${acct_c}", driver_account_id: "${acct_b}", region_code: "R1", requested_at: "2026-09-29T00:00:00Z", in_app_message_count: 3 }
              as: PlatformAdmin
              captures: { trip_bad: $.data.id }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_a}", referenced_trip_id: "${trip_good}", reporter_type: "RIDER", reporter_account_id: "${acct_a}", incident_category: "HARASSMENT" }
              as: SafetyInvestigator
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "TRIP_DATA", source_entity_id: "${trip_good}", evidence_weight: "STANDARD" }
              as: SafetyInvestigator
              captures: { good_ev: $.data.id, good_status: $.data.evidence_status }
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "TRIP_DATA", source_entity_id: "${trip_bad}", evidence_weight: "STANDARD" }
              as: SafetyInvestigator
              captures: { bad_err: $.data.error_id }
          assert:
            - "the TRIP_DATA attachment from trip-good is accepted with 201 and IncidentEvidence.${good_ev}.evidence_status == \"PENDING\""
            - "the TRIP_DATA attachment from trip-bad is refused with error_id == \"ERR_TRIP_ACCOUNT_MISMATCH\" with HTTP 422"
            - "the refusal is a business-referential failure (priority 17), so it outranks no state check but is itself outranked by any state failure on the same request"
            - "GET /safety/incidents/${inc_id}/evidence returns exactly 1 row, the accepted trip-good row whose source_entity_id == ${trip_good}, confirming the refused attachment stored nothing"

      - name: record_link_against_a_different_region_is_refused
        claim_type: Conditional validation
        grounds:
          - validations[priority=18]
          - errors[ERR_CROSS_REGION_REFERENCE]
          - entities.AccountDeviceLink.fields.device_cluster_id
        distinguishing_aspect: "The rule fires only when the two entities disagree on region: the same link operation succeeds inside one region and is refused across two, so the validation is conditional on entity configuration rather than on the request shape."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Policies published for R1 and R3. One ACTIVE driver account in R1, one OPEN cluster in R1 and one OPEN cluster in R3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R3", sd_floor_severity: "S4" }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Xenia Petrova", contact_email: "xenia.petrova@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /safety/device-clusters"
              payload: { cluster_key: "dc-r1", region_code: "R1" }
              as: PlatformAdmin
              captures: { clust_r1: $.data.id }
            - call: "POST /safety/device-clusters"
              payload: { cluster_key: "dc-r3", region_code: "R3" }
              as: PlatformAdmin
              captures: { clust_r3: $.data.id }
          trigger:
            - call: "POST /safety/account-device-links"
              payload: { account_id: "${acct_id}", device_cluster_id: "${clust_r1}", fingerprint_hash: "fp-in-region" }
              as: SafetyInvestigator
              captures: { ok_link: $.data.id, ok_status: $.data.link_status }
            - call: "POST /safety/account-device-links"
              payload: { account_id: "${acct_id}", device_cluster_id: "${clust_r3}", fingerprint_hash: "fp-cross-region" }
              as: SafetyInvestigator
              captures: { cross_err: $.data.error_id }
          assert:
            - "the in-region link is accepted with 201 and AccountDeviceLink.${ok_link}.link_status == \"LINKED\""
            - "the cross-region link is refused with error_id == \"ERR_CROSS_REGION_REFERENCE\" with HTTP 422"
            - "the refusal is conditional on the account's home_region_code differing from the cluster's region_code, not on any missing field in the request"
            - "GET /safety/account-device-links?account_id=${acct_id} returns exactly 1 row"

      - name: background_check_acknowledge_before_the_ack_deadline_is_refused
        claim_type: Temporal validation
        grounds:
          - state_machines.BackgroundCheck.transitions.SCHEDULED_to_IN_REVIEW
          - entities.PlatformPolicy.fields.continuous_monitor_ack_deadline_days
          - validations[priority=6]
        distinguishing_aspect: "The acknowledge transition is legal in state terms but creates a timing violation because the ack deadline has not yet opened — a request valid right now only in the temporal sense."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy with continuous_monitor_ack_deadline_days 7 and rescreen_refresh_days 548. One ACTIVE driver account created at the same clock, holding a synthesized CONTINUOUS_MONITOR check with a due date in the future."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4", continuous_monitor_ack_deadline_days: 7, rescreen_refresh_days: 548 }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Yara Sen", contact_email: "yara.sen@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "GET /safety/accounts/${acct_id}/background-checks"
              payload: {}
              as: BackgroundReviewer
              captures: { chk_id: "$.data[0].id", chk_due: "$.data[0].scheduled_due_at" }
          trigger:
            - call: "POST /safety/background-checks/${chk_id}/acknowledge"
              payload: {}
              as: BackgroundReviewer
              captures: { early_err: $.data.error_id }
          assert:
            - "the acknowledge is refused with error_id == \"ERR_INVALID_STATE\" with HTTP 409 because the clock is before scheduled_due_at minus 7 days"
            - "BackgroundCheck.${chk_id}.check_status is still \"SCHEDULED\" after the refusal"
            - "the refusal is temporal rather than structural, since the SCHEDULED-to-IN_REVIEW edge exists and merely has an unmet date precondition"
            - "the same acknowledge succeeds once the clock is advanced to within the ack window, demonstrating the precondition is a date rather than a state"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: rollup_sweep_creates_no_report_below_the_threshold
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/safety/regulator-reports/rollup-sweep
          - validations[priority=2]
        distinguishing_aspect: "The sweep is a permitted action for the liaison role but produces nothing below the rollup threshold, and the same call is refused outright for a role the endpoint does not list."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy with rollup_window_days 30 and rollup_threshold 3. One ACTIVE driver account carrying only two S3 incidents in the window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4", rollup_window_days: 30, rollup_threshold: 3 }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Zane Mercer", contact_email: "zane.mercer@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "SAFETY_VIOLATION", aggravator_codes: ["S3_INJURY"] }
              as: SafetyInvestigator
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "SAFETY_VIOLATION", aggravator_codes: ["S3_INJURY"] }
              as: SafetyInvestigator
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "SAFETY_VIOLATION", aggravator_codes: ["S3_INJURY"] }
              as: SafetyInvestigator
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /safety/regulator-reports/rollup-sweep"
              payload: { incident_id: "${inc_id}" }
              as: RegulatorLiaison
              captures: { empty_result: "$.data" }
            - call: "POST /safety/regulator-reports/rollup-sweep"
              payload: { incident_id: "${inc_id}" }
              as: BackgroundReviewer
              captures: { role_err: $.data.error_id }
          assert:
            - "the sweep as RegulatorLiaison returns 200 with an empty array, because each of the three incidents was created strictly before the triggering incident and the window is closed-open, leaving the qualifying count strictly below the threshold of 3"
            - "the sweep as BackgroundReviewer is refused with error_id == \"ERR_UNAUTHORIZED\" with HTTP 403"
            - "no RegulatorReport row exists after either call, so the conditional action produces the empty-success result rather than an error when the threshold is not met"
            - "the action is therefore conditional on both the role and the region's threshold, not on the incident's own state"

  # ===========================================================================
  - section: errors
    instances:

      - name: error_appeal_window_closed_on_a_late_appeal
        claim_type: violation_to_error
        grounds:
          - errors[ERR_APPEAL_WINDOW_CLOSED]
          - validations[priority=10]
          - state_machines.SafetyIncident.transitions.DECIDED_to_APPEAL_PENDING
        distinguishing_aspect: "An appeal filed at or after the enforcement action's appeal_deadline_at is refused with the window error rather than the state error, because the DEACTIVATED-to-APPEAL_PENDING edge is cancel-on-deadline rather than cancel-on-state."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy with appeal_window_days 30, so the appeal deadline is 2026-10-31T00:00:00Z. One ACTIVE driver account with one decided S4 PHYSICAL_ASSAULT incident."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4", appeal_window_days: 30 }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Amir Farouk", contact_email: "amir.farouk@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "PHYSICAL_ASSAULT" }
              as: SafetyInvestigator
              captures: { inc_id: $.data.id, inc_v: $.data.version }
            - call: "POST /safety/incidents/${inc_id}/hold"
              payload: {}
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "TRIP_DATA", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { ev1: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "LAW_ENFORCEMENT_CONTACT", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { ev2: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "EXTERNAL_RECORD", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { ev3: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${ev1}", accepted: true }
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${ev2}", accepted: true }
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${ev3}", accepted: true }
              as: SafetyInvestigator
              captures: { inc_v_ready: $.data.version }
            - call: "POST /safety/incidents/${inc_id}/decision"
              payload: { decision_category: "DEACTIVATED", decision_basis: "S4 physical assault with three distinct evidence types including law-enforcement contact.", expected_incident_version: "${inc_v_ready}" }
              as: SafetyInvestigator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /safety/incidents/${inc_id}/appeals"
              payload: {}
              as: SafetyAppealReviewer
              captures: { late_err: $.data.error_id }
          assert:
            - "the appeal is refused with error_id == \"ERR_APPEAL_WINDOW_CLOSED\" with HTTP 422"
            - "the refusal is a business-temporal failure and NOT ERR_INVALID_STATE, because the incident is still at DECIDED and the edge exists"
            - "the deadline instant is inclusive: an appeal arriving at exactly 2026-10-31T00:00:00Z is also refused, so the comparison is >= and not >"
            - "SafetyIncident.${inc_id}.incident_status is still \"DECIDED\" and Account.${acct_id}.status is still \"DEACTIVATED\""

      - name: error_adverse_reason_required_on_a_bare_adverse_verdict
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ADVERSE_REASON_REQUIRED]
          - validations[priority=20]
          - state_machines.BackgroundCheck.transitions.IN_REVIEW_to_COMPLETED
        distinguishing_aspect: "The adverse_reason_code field is optional in the input schema but conditionally required for an ADVERSE verdict, so the identical omission is legal for CLEAR and illegal for ADVERSE."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy published. One ACTIVE driver account with a RESCREEN background check already moved into review."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4" }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Bea Iheanacho", contact_email: "bea.iheanacho@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "GET /safety/accounts/${acct_id}/background-checks"
              payload: {}
              as: BackgroundReviewer
              captures: { chk_id: "$.data[0].id" }
            - call: "POST /safety/background-checks/${chk_id}/acknowledge"
              payload: {}
              as: BackgroundReviewer
              captures: { ack_status: $.data.check_status }
          trigger:
            - call: "POST /safety/background-checks/${chk_id}/adjudicate"
              payload: { adjudication: "ADVERSE" }
              as: BackgroundReviewer
              captures: { adverse_err: $.data.error_id }
          assert:
            - "the bare ADVERSE adjudication is refused with error_id == \"ERR_ADVERSE_REASON_REQUIRED\" with HTTP 422"
            - "BackgroundCheck.${chk_id}.check_status is still \"IN_REVIEW\" and adjudication is still \"PENDING\", so the refused call wrote nothing"
            - "the same omission with adjudication CLEAR is accepted, proving the requirement is conditional on the verdict rather than a missing-required-field failure"
            - "the acknowledge at the same clock succeeded with ack_status == \"IN_REVIEW\", so the temporal precondition of that edge was satisfied"

