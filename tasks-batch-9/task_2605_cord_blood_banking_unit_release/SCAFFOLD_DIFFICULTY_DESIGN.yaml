          - state_machines.Reservation.status.CONFIRMED_to_RELEASED
          - endpoints[POST /cbb/ops/nightly-run]
        distinguishing_aspect: |
          A different entity pair — Reservation <- StorageTank — and a different dependency direction: the
          blocking row is the tank the unit happens to sit in, which no field of the Reservation names.
          MAINTENANCE (entered by the nightly run at the window boundary) is used deliberately instead of
          ALARM, because ALARM would quarantine the unit and the failure would be masked by
          ERR_INVALID_UNIT_STATE at priority 9.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T06:00:00Z after the nightly run has moved the tank into MAINTENANCE."
