            - "detail read: points_assessed == 0 AND civil_penalty_cents == null AND restitution_ordered_cents == null AND restitution_paid_cents == 0 AND restitution_due_on == null AND investigator_user_id == null"
            - "list read HTTP 200: total_count == 1 AND has_more == false AND data[0].id == ${cmp_c39_id}"
            - "the same list with status=CLOSED_UNSUBSTANTIATED reports total_count == 0"

