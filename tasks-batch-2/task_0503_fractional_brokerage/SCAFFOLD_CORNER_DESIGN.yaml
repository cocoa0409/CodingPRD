              as: AccountHolder
              as_user_id: "${acc_occ}"
              captures: { v_occ: $.data.version }
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acc_occ}", security_id: "${sec_occ}", side: "BUY", order_type: "MARKET", notional_cents: 50000, expected_account_version: "${v_occ}" }
              as: AccountHolder
              as_user_id: "${acc_occ}"
              captures: { ord_occ: $.data.id }
            - call: "GET /accounts/${acc_occ}"
              as: AccountHolder
              as_user_id: "${acc_occ}"
              captures: { v_occ_after: $.data.version }
          assert:
            - "Order created with status 201; Account.${acc_occ}.version increased by exactly 1 versus the value read before the order"

      - name: occ_stale_order_place_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-place-stale-account]", "errors[ERR_STALE_ACCOUNT_VERSION]"]
        distinguishing_aspect: "A second POST /orders carrying a now-stale expected_account_version (one behind, after a first order bumped it) returns ERR_STALE_ACCOUNT_VERSION (412)."
        test_recipe:
          setup: ["CASH account funded $2000.00; one order already placed so version has advanced; the client still holds the pre-order version."]
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "STLCO", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: true }
              as: ClearingSystem
              captures: { sec_stl: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "stl@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_stl: $.data.id }
            - call: "POST /accounts/${acc_stl}/deposits"
              payload: { amount_cents: 200000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_stl}"
            - call: "GET /accounts/${acc_stl}"
              as: AccountHolder
              as_user_id: "${acc_stl}"
              captures: { v_stl: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_stl}", security_id: "${sec_stl}", side: "BUY", order_type: "MARKET", notional_cents: 50000, expected_account_version: "${v_stl}" }
              as: AccountHolder
              as_user_id: "${acc_stl}"
              captures: { ord_stl_1: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acc_stl}", security_id: "${sec_stl}", side: "BUY", order_type: "MARKET", notional_cents: 50000, expected_account_version: "${v_stl}" }
              as: AccountHolder
              as_user_id: "${acc_stl}"
              captures: { err_stl: $.data.error_id }
          assert:
            - "Second order returns status 412 and data.error_id == ERR_STALE_ACCOUNT_VERSION (v_stl is now one behind)"

      - name: occ_stale_options_decide_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[options-decide-stale-account]", "errors[ERR_STALE_ACCOUNT_VERSION]"]
        distinguishing_aspect: "Deciding an options approval with a stale expected_account_version (after a deposit bumped the account version) returns ERR_STALE_ACCOUNT_VERSION (412)."
        test_recipe:
          setup: ["CASH account with a SUBMITTED options approval; the officer captures version, then a deposit bumps the account version, making the captured version stale."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_email: "ods@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_ods: $.data.id }
            - call: "POST /options-approvals"
              payload: { account_id: "${acc_ods}", requested_level: 2, stated_experience_years: 3, liquid_net_worth_cents: 5000000 }
              as: AccountHolder
              as_user_id: "${acc_ods}"
              captures: { appr_ods: $.data.id }
            - call: "GET /accounts/${acc_ods}"
              as: ComplianceOfficer
              captures: { v_ods_stale: $.data.version }
            - call: "POST /accounts/${acc_ods}/deposits"
              payload: { amount_cents: 100000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_ods}"
          trigger:
            - call: "POST /options-approvals/${appr_ods}/decide"
              payload: { decision: "APPROVE", expected_account_version: "${v_ods_stale}" }
              as: ComplianceOfficer
              captures: { err_ods: $.data.error_id }
          assert:
            - "Decide returns status 412 and data.error_id == ERR_STALE_ACCOUNT_VERSION (deposit advanced the version after the officer's read)"

      - name: deposit_settles_on_clock_advance
        claim_type: scheduled_actions
        grounds: [state_machines.Deposit.PENDING_to_SETTLED, entities.Account.fields.settled_cash_cents]
        distinguishing_aspect: "Advancing the clock past a PENDING deposit's settles_on (T+1) settles it: status SETTLED and settled_cash_cents credited by amount_cents."
        test_recipe:
          setup: ["CASH account with a $1000.00 PENDING deposit (settles_on 2026-01-02)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_email: "sett@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_st2: $.data.id }
            - call: "POST /accounts/${acc_st2}/deposits"
              payload: { amount_cents: 100000, instant_eligible: false }
              as: AccountHolder
              as_user_id: "${acc_st2}"
              captures: { dep_st2: $.data.id }
          trigger:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: ClearingSystem
            - call: "GET /accounts/${acc_st2}"
              as: AccountHolder
              as_user_id: "${acc_st2}"
              captures: { sc_st2: $.data.settled_cash_cents }
          assert:
            - "After advance: Deposit.${dep_st2}.status == SETTLED and Account.${acc_st2}.settled_cash_cents == 100000"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_buying_power_visible_in_same_request
        claim_type: immediate
        grounds: [calculations.buying_power, entities.Deposit.fields.instant_credit_granted_cents]
        distinguishing_aspect: "An instant deposit's response (POST /accounts/{id}/deposits) immediately reflects instant_credit_granted_cents; the very next GET /accounts shows buying_power_cents already raised — no lag."
        test_recipe:
          setup: ["Fresh CASH account."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_email: "imm@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_imm: $.data.id }
          trigger:
            - call: "POST /accounts/${acc_imm}/deposits"
              payload: { amount_cents: 75000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_imm}"
              captures: { granted_imm: $.data.instant_credit_granted_cents }
            - call: "GET /accounts/${acc_imm}"
              as: AccountHolder
              as_user_id: "${acc_imm}"
              captures: { bp_imm: $.data.buying_power_cents }
          assert:
            - "Deposit response instant_credit_granted_cents == 75000 and the subsequent GET shows Account.${acc_imm}.buying_power_cents == 75000 (immediate consistency)"

      - name: settlement_fail_compensates_provisional_cash
        claim_type: saga
        grounds: [state_machines.Settlement.UNSETTLED_to_FAILED, entities.Account.fields.settled_cash_cents]
        distinguishing_aspect: "Failing an UNSETTLED settlement leg compensates the originating fill's provisional cash/position effect (the leg moves to FAILED and the account's position/cash adjustments are reversed)."
        test_recipe:
          setup: ["CASH account with one UNSETTLED CREDIT settlement leg from a SELL fill of 1 sh of FAILCO @10000c."]
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "FAILCO", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: true }
              as: ClearingSystem
              captures: { sec_fl: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "fl@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_fl: $.data.id }
            - call: "POST /accounts/${acc_fl}/deposits"
              payload: { amount_cents: 100000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_fl}"
            - call: "GET /accounts/${acc_fl}"
              as: AccountHolder
              as_user_id: "${acc_fl}"
              captures: { v_fl_1: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_fl}", security_id: "${sec_fl}", side: "BUY", order_type: "MARKET", quantity: 1, expected_account_version: "${v_fl_1}" }
              as: AccountHolder
              as_user_id: "${acc_fl}"
              captures: { ord_fl_b: $.data.id }
            - call: "POST /orders/${ord_fl_b}/fills"
              payload: { fill_quantity: 1, fill_price_cents: 10000 }
              as: ClearingSystem
              captures: { fill_fl: $.data.id }
            - call: "GET /accounts/${acc_fl}/settlements"
              as: AccountHolder
              as_user_id: "${acc_fl}"
              captures: { set_fl: "$.data[0].id" }
          trigger:
            - call: "POST /settlements/${set_fl}/fail"
              as: ClearingSystem
              captures: { set_fl_status: $.data.status }
          assert:
            - "Settlement.${set_fl}.status == FAILED and the originating fill's provisional cash/position effect is reversed on Account.${acc_fl}"
