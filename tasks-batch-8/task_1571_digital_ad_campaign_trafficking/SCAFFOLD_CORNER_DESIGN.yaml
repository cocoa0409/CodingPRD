            - "mg_ok created (PROPOSED) at exactly the ceiling"
            - "err == ERR_CREDIT_EXCEEDS_BASIS (1551 > 1550)"
            - "bonus_kind == BONUS_IMPRESSIONS and MakeGood.${mg_bonus}.credit_cents == null"

