          The ASSEMBLED -> STAGED rework edge closes a loop, and the loop is bounded by a
          strict counter: two rework passes are accepted, the third is refused with
          ERR_REWORK_LIMIT_EXCEEDED because rework_count (2) is no longer < MAX_REWORK_CYCLES
