      - name: repeat_transitions_idempotent_or_rejected
        claim_type: idempotency
        grounds:
          - state_machines[Listing].transitions[SYNDICATED->SYNDICATED]
          - state_machines[Vehicle:inventory_state].transitions[IN_INVENTORY->RETAIL_SOLD]
          - errors[ERR_VEHICLE_HISTORY_EVENT_INVALID]
        distinguishing_aspect: |
          Repeating a transition is not uniformly safe: re-syndicating a SYNDICATED listing is a
          declared self-loop that succeeds and refreshes the published snapshot, while repeating a
          history event is refused, and so is a RETURNED_TO_INVENTORY on a vehicle that never left.
          The self-loop is not a no-op either: it bumps Certification.version again, which is
          exactly what makes the syndication OCC guard meaningful.
        test_recipe:
          setup:
            - "Canonical pipeline to ACTIVE certification C1 with an OEM_SITE listing L1 already SYNDICATED once."
            - "A second, uncertified vehicle V2 sits IN_INVENTORY."
