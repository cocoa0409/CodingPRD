              as: ComplianceOfficer
            - call: "POST /ale-reporting/controlled-groups/${group_id}/ale-determination"
              payload: { basis: "AGGREGATED", expected_controlled_group_version: "${group_v1}" }
              as: ComplianceOfficer
            - call: "POST /ale-reporting/employees"
              payload: { group_member_id: "${member_id}", full_name: "Lena Ortiz", ssn_last4: "4321", hire_date: "2025-01-01", employment_type: "FULL_TIME", is_hourly: false, monthly_salary_cents: 400000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ale-reporting/forms-1095c"
              payload: { employee_id: "${emp_id}", plan_start_month: 1 }
              as: Preparer
              as_user_id: "preparer-1"
              captures: { form_id: $.data.id }
            - call: "GET /ale-reporting/group-members/${member_id}"
              payload: {}
              as: Preparer
              captures: { member_v: $.data.version }
            - call: "POST /ale-reporting/transmittals"
              payload: { group_member_id: "${member_id}", transmission_type: "ORIGINAL", expected_group_member_version: "${member_v}" }
              as: Preparer
              as_user_id: "preparer-1"
              captures: { t_id: $.data.id }
            - call: "POST /ale-reporting/transmittals/${t_id}/attach-forms"
              payload: { form_ids: ["${form_id}"] }
              as: Preparer
              as_user_id: "preparer-1"
            - call: "POST /ale-reporting/transmittals/${t_id}/build"
              payload: {}
              as: Preparer
              as_user_id: "preparer-1"
            - call: "POST /ale-reporting/transmittals/${t_id}/transmit"
              payload: { channel: "ELECTRONIC" }
              as: FilingAgent
              as_user_id: "agent-1"
            - call: "POST /ale-reporting/transmittals/${t_id}/agency-response"
              payload: { response_status: "ACCEPTED_WITH_ERRORS", receipt_id: "AIR-2026-2020", errors: [{ form_1095c_id: "${form_id}", error_code: "AIRTN200", error_field: "ssn_last4", severity: "WARNING" }] }
              as: FilingAgent
              as_user_id: "agent-1"
