  # ===========================================================================
  - section: rbac
    instances:

      - name: authorize_and_ship_roles_are_segregated
        claim_type: role_denial
        grounds:
          - roles.ClinicContact
          - roles.PharmacyTechnician
        excluded_because:
          difficulty_instance: third_callback_failure_suspends_the_plan_and_revokes_discounts
          rationale: "The clinic side runs the authorization while pharmacy operations runs the contacts in that instance's fixture, exercising the split."

      - name: care_agent_cannot_create_a_dispensing_site
        claim_type: Role Denial
        grounds:
          - roles.CustomerService
          - roles.ComplianceOfficer
          - endpoints.POST_/v1/pharmacy-sites
        distinguishing_aspect: "Site creation is exclusive to the licensing roles, so the care-agent role is refused at the authorization rule rather than having an unauthenticated-looking error returned."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/pharmacy-sites"
              payload: { site_code: "BOGUS1", site_state: "CA", licensed_states: ["CA"], cold_pack_capacity_units: 10, csr_registered: true }
              as: CustomerService
              as_user_id: "cs-nope"
              captures: { err_r1: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ${err_r1} == \"ERR_ROLE_NOT_PERMITTED\""
            - "the refusal is an authorization failure rather than an authentication failure, so it is distinct from ERR_MISSING_USER_CONTEXT"
            - "no site was created: GET /v1/pharmacy-sites returns 0 rows"
            - "the shared read is still available to this role: GET /v1/pharmacy-sites returns 200 once a site exists"

      - name: clinic_contact_cannot_run_the_callback_workflow
        claim_type: Role Denial
        grounds:
          - roles.ClinicContact
          - roles.PharmacyTechnician
          - endpoints.POST_/v1/prescriptions/{id}/clinic-contacts
        distinguishing_aspect: "The callback workflow is exclusive to pharmacy operations, so the clinic side of the authorization is refused on the same prescription it is permitted to authorize — the two roles hold disjoint halves of the workflow."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A pending prescription with a registered prescriber."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/products"
              payload: { sku: "RBAC-02", product_name: "Segregated workflow pack", medication_scope: "PRESCRIPTION", cold_pack_required: false, unit_dose_mg_per_kg: 0.02, pack_size_units: 10, unit_price_cents: 2100 }
              as: PlatformAdmin
              captures: { prod_r2: $.data.id }
            - call: "POST /v1/veterinarians"
              payload: { full_name: "Dr Mabel Frost", clinic_name: "Pine Vet", clinic_phone: "4155550109", vet_email: "mfrost@pinevet.example", license_number: "VET-CA-9009", license_state: "CA" }
              as: PharmacyTechnician
              captures: { vet_r2: $.data.id }
            - call: "POST /v1/pets"
              payload: { pet_name: "Dill", species: "CAT", breed: "Exotic Shorthair", weight_kg: 4.8, owner_state: "CA" }
              as: Customer
              captures: { pet_r2: $.data.id }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_r2}" }
              as: Customer
              as_user_id: "${pet_r2}"
              captures: { plan_r2: $.data.id }
            - call: "POST /v1/autoship-plans/${plan_r2}/items"
              payload: { product_id: "${prod_r2}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_r2}"
              captures: { item_r2: $.data.id }
            - call: "POST /v1/prescriptions"
              payload: { autoship_item_id: "${item_r2}", prescriber_id: "${vet_r2}", script_source: "WRITTEN_PRESCRIPTION", written_prescriber_email_hash: "mfrost@pinevet.example", drug_schedule: "NONE", temperature_sensitive: false, authorized_qty_total: 120, refills_authorized: 4 }
              as: ClinicContact
              as_user_id: "${vet_r2}"
              captures: { rx_r2: $.data.id }
          trigger:
            - call: "POST /v1/prescriptions/${rx_r2}/clinic-contacts"
              payload: {}
              as: ClinicContact
              as_user_id: "${vet_r2}"
              captures: { err_r2: $.data.error_id }
          assert:
            - "the callback attempt is refused with error_id == ${err_r2} == \"ERR_ROLE_NOT_PERMITTED\" and http status 403"
            - "Prescription.${rx_r2}.callback_attempt_count is still 0, so the refused call left no trace"
            - "Prescription.${rx_r2}.rx_status is still PENDING_VERIFICATION"
            - "the same role is permitted on its own half of the workflow: POST /v1/prescriptions/${rx_r2}/clinic-authorizations is accepted once pharmacy operations records a contact attempt"

      - name: opaque_operations_roles_are_not_entity_backed
        claim_type: Shared Operations
        grounds:
          - roles.PharmacyTechnician
          - roles.CustomerService
          - roles.ComplianceOfficer
        distinguishing_aspect: "The three operations roles carry opaque identities, so an arbitrary operator id is accepted on their endpoints and is never required to match a persisted entity, unlike the pet-backed customer role."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/pharmacy-sites"
              payload: { site_code: "OPQ1", site_state: "CA", licensed_states: ["CA"], cold_pack_capacity_units: 12, csr_registered: true }
              as: ComplianceOfficer
              as_user_id: "co-arbitrary-operator-handle"
              captures: { site_r3: $.data.id }
          assert:
            - "the write is accepted with status 201 even though the operator id names no persisted entity, because this role's identity is opaque"
            - "the site is addressable afterwards: GET /v1/pharmacy-sites/${site_r3} returns the created record"
            - "the pet-backed role is held to a different standard: POST /v1/autoship-plans with as_user_id set to an id naming no pet is refused with ERR_RESOURCE_NOT_FOUND"
            - "no site record stores the operator handle as an ownership field, because opaque identities are audit-only"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_cascade_effect_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/v1/pets/{id}/passings
          - state_machines.AutoshipPlan.ACTIVE_to_COMPASSIONATE_CANCELED
        distinguishing_aspect: "The model is immediate, so the triggering response itself already reflects the whole cascade rather than deferring it: reading the plan and shipment straight after the passing shows the parked and canceled states without any reconciliation step."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One dispatched order with a shipment on an ACTIVE plan."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/pharmacy-sites"
              payload: { site_code: "SAN11", site_state: "CA", licensed_states: ["CA"], cold_pack_capacity_units: 90, csr_registered: true }
              as: ComplianceOfficer
              captures: { site_cm1: $.data.id }
            - call: "POST /v1/products"
              payload: { sku: "CSM-01", product_name: "Immediate pack", medication_scope: "OTC", cold_pack_required: false, unit_dose_mg_per_kg: 0.02, pack_size_units: 10, unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { prod_cm1: $.data.id }
            - call: "POST /v1/pets"
              payload: { pet_name: "Hazel", species: "DOG", breed: "Lakeland", weight_kg: 7.5, owner_state: "CA" }
              as: Customer
              captures: { pet_cm1: $.data.id }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_cm1}" }
              as: Customer
              as_user_id: "${pet_cm1}"
              captures: { plan_cm1: $.data.id }
            - call: "POST /v1/autoship-plans/${plan_cm1}/items"
              payload: { product_id: "${prod_cm1}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_cm1}"
              captures: { item_cm1: $.data.id }
            - call: "GET /v1/autoship-plans/${plan_cm1}"
              payload: {}
              as: Customer
              as_user_id: "${pet_cm1}"
              captures: { plan_cm1_v: $.data.version }
            - call: "POST /v1/autoship-plans/${plan_cm1}/compose"
              payload: { expected_plan_version: "${plan_cm1_v}" }
              as: Customer
              as_user_id: "${pet_cm1}"
              captures: { order_cm1: $.data.id }
            - call: "POST /v1/shipments"
              payload: { order_id: "${order_cm1}" }
              as: PharmacyTechnician
              captures: { ship_cm1: $.data.id }
            - call: "POST /v1/orders/${order_cm1}/ship"
              payload: {}
              as: PharmacyTechnician
          trigger:
            - call: "POST /v1/pets/${pet_cm1}/passings"
              payload: { refund_destination: "WALLET" }
              as: Customer
              as_user_id: "${pet_cm1}"
              captures: { rev_cm1: $.data.compassionate_review_id }
            - call: "GET /v1/autoship-plans/${plan_cm1}"
              payload: {}
              as: Customer
              as_user_id: "${pet_cm1}"
              captures: { plan_cm1_after: $.data.plan_status }
            - call: "GET /v1/shipments/${ship_cm1}"
              payload: {}
              as: PharmacyTechnician
              captures: { ship_cm1_after: $.data.shipment_status }
          assert:
            - "the plan already reads AutoshipPlan.${plan_cm1}.plan_status == ${plan_cm1_after} == \"COMPASSIONATE_CANCELED\" on the very next read, with no wait"
            - "the shipment already reads Shipment.${ship_cm1}.shipment_status == ${ship_cm1_after} == \"AWAITING_PET_PASSING_DECISION\""
            - "the triggering response carried the review identity, so the effect is synchronous rather than queued"
            - "re-reading both resources a second time returns identical values, which is what distinguishes immediate from eventual consistency here"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_plan_version_on_compose_is_refused
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[compose-stale-plan]
        excluded_because:
          difficulty_instance: recalc_after_weight_change_redraws_consumption_cadence
          rationale: "That instance's OCC-based chain records the plan version immediately before composing, so the stale-version path is exercised there."

      - name: stale_plan_version_is_rejected_by_the_occ_rule
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[compose-stale-plan]
          - errors.ERR_STALE_PLAN_VERSION
        distinguishing_aspect: "The compose OCC guard is exercised directly: a client holding a version captured before an intervening compose is refused at 412, and the same call with the fresh version succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A plan with one item whose cadence advance leaves it due again later."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/products"
              payload: { sku: "OCC-01", product_name: "Occ pack", medication_scope: "OTC", cold_pack_required: false, unit_dose_mg_per_kg: 0.02, pack_size_units: 10, unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { prod_occ1: $.data.id }
            - call: "POST /v1/pets"
              payload: { pet_name: "Sorghum", species: "DOG", breed: "Otterhound", weight_kg: 34.0, owner_state: "CA" }
              as: Customer
              captures: { pet_occ1: $.data.id }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_occ1}" }
              as: Customer
              as_user_id: "${pet_occ1}"
              captures: { plan_occ1: $.data.id }
            - call: "POST /v1/autoship-plans/${plan_occ1}/items"
              payload: { product_id: "${prod_occ1}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_occ1}"
              captures: { item_occ1: $.data.id }
            - call: "GET /v1/autoship-plans/${plan_occ1}"
              payload: {}
              as: Customer
              as_user_id: "${pet_occ1}"
              captures: { observed_v_occ1: $.data.version }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/autoship-plans/${plan_occ1}/compose"
              payload: { expected_plan_version: "${observed_v_occ1}" }
              as: Customer
              as_user_id: "${pet_occ1}"
              captures: { first_order_occ1: $.data.id }
          trigger:
            - call: "POST /v1/autoship-plans/${plan_occ1}/compose"
              payload: { expected_plan_version: "${observed_v_occ1} - 0" }
              as: Customer
              as_user_id: "${pet_occ1}"
              captures: { err_occ1: $.data.error_id }
          assert:
            - "the first compose succeeded with the observed version ${observed_v_occ1} and advanced the plan"
            - "replaying the same superseded version is refused with error_id == ${err_occ1} == \"ERR_STALE_PLAN_VERSION\" and http status 412"
            - "the refusal is deterministic across two strictly sequential requests, so no timing assumption is needed"
            - "the plan's version advanced rather than reverting: a fresh read reports a version strictly greater than ${observed_v_occ1}"
            - "the guard is per-parent: the item's version is unaffected by the refusal"

      - name: cadence_stale_item_version_is_rejected_by_the_occ_rule
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cadence-stale-item]
          - errors.ERR_STALE_ITEM_VERSION
          - endpoints.POST_/v1/autoship-plans/{plan_id}/items/{item_id}/cadence
        distinguishing_aspect: "The cadence OCC guard is a second OCC surface on a different parent: the item's version advances through prescription activity, so a version captured before that activity is refused at 412 on the cadence endpoint."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A prescription item whose version is captured before a clinic contact attempt runs."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/products"
              payload: { sku: "OCC-02", product_name: "Occ item pack", medication_scope: "PRESCRIPTION", cold_pack_required: false, unit_dose_mg_per_kg: 0.02, pack_size_units: 10, unit_price_cents: 2000 }
              as: PlatformAdmin
              captures: { prod_occ2: $.data.id }
            - call: "POST /v1/veterinarians"
              payload: { full_name: "Dr Rune Aalton", clinic_name: "Fjord Vet", clinic_phone: "4155550110", vet_email: "raalton@fjordvet.example", license_number: "VET-CA-9010", license_state: "CA" }
              as: PharmacyTechnician
              captures: { vet_occ2: $.data.id }
            - call: "POST /v1/pets"
              payload: { pet_name: "Tarragon", species: "CAT", breed: "Turkish Van", weight_kg: 5.2, owner_state: "CA" }
              as: Customer
              captures: { pet_occ2: $.data.id }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_occ2}" }
              as: Customer
              as_user_id: "${pet_occ2}"
              captures: { plan_occ2: $.data.id }
            - call: "POST /v1/autoship-plans/${plan_occ2}/items"
              payload: { product_id: "${prod_occ2}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_occ2}"
              captures: { item_occ2: $.data.id }
            - call: "POST /v1/prescriptions"
              payload: { autoship_item_id: "${item_occ2}", prescriber_id: "${vet_occ2}", script_source: "UPLOADED_SCRIPT", script_document_id: "doc-occ-2", drug_schedule: "NONE", temperature_sensitive: false, authorized_qty_total: 90, refills_authorized: 5 }
              as: PharmacyTechnician
              captures: { rx_occ2: $.data.id }
            - call: "GET /v1/autoship-plans/${plan_occ2}/items/${item_occ2}"
              payload: {}
              as: Customer
              captures: { observed_item_v_occ2: $.data.version }
            - call: "POST /v1/prescriptions/${rx_occ2}/clinic-contacts"
              payload: {}
              as: PharmacyTechnician
          trigger:
            - call: "POST /v1/autoship-plans/${plan_occ2}/items/${item_occ2}/cadence"
              payload: { expected_item_version: "${observed_item_v_occ2} - 0", cadence_days: 42 }
              as: Customer
              as_user_id: "${pet_occ2}"
              captures: { err_occ2: $.data.error_id }
          assert:
            - "the callback attempt advanced the item's version past ${observed_item_v_occ2}, so the captured value is now stale"
            - "the cadence change is refused with error_id == ${err_occ2} == \"ERR_STALE_ITEM_VERSION\" and http status 412"
            - "the item is unchanged by the refusal: AutoshipItem.${item_occ2}.cadence_days is still 28"
            - "re-reading the item and resubmitting the fresh version succeeds with 200, so the guard is a version check rather than a role or state restriction"

      - name: cadence_prompt_fires_once_the_plan_due_date_passes_the_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.cadence_prompt_due_days_delta
          - entities.AutoshipPlan.fields.cadence_prompt_due_days_delta
          - entities.AutoshipPlan.fields.cadence_prompt_due_date
        distinguishing_aspect: "The prompt deferral is a step function of the gap between the plan's due date and its prompt date: the same plan reads one deferral value just inside a threshold band and a different one just outside it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A plan with a single 28-day OTC item due on the logical date, refreshed with a clinic-free cadence update to keep the prompt date aligned."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/products"
              payload: { sku: "THR-01", product_name: "Threshold pack", medication_scope: "OTC", cold_pack_required: false, unit_dose_mg_per_kg: 0.02, pack_size_units: 10, unit_price_cents: 1100 }
              as: PlatformAdmin
              captures: { prod_thr1: $.data.id }
            - call: "POST /v1/pets"
              payload: { pet_name: "Sagebrush", species: "DOG", breed: "Airedale", weight_kg: 24.0, owner_state: "CA" }
              as: Customer
              captures: { pet_thr1: $.data.id }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_thr1}" }
              as: Customer
              as_user_id: "${pet_thr1}"
              captures: { plan_thr1: $.data.id }
            - call: "POST /v1/autoship-plans/${plan_thr1}/items"
              payload: { product_id: "${prod_thr1}", cadence_days: 14, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_thr1}"
              captures: { item_thr1: $.data.id }
            - call: "GET /v1/autoship-plans/${plan_thr1}"
              payload: {}
              as: Customer
              as_user_id: "${pet_thr1}"
              captures: { delta_baseline_thr1: $.data.cadence_prompt_due_days_delta }
          trigger:
            - call: "GET /v1/autoship-plans/${plan_thr1}/items/${item_thr1}"
              payload: {}
              as: Customer
              captures: { item_thr1_v: $.data.version, equivalent_thr1: $.data.unit_lifecycle_equivalent_days }
            - call: "POST /v1/autoship-plans/${plan_thr1}/items/${item_thr1}/cadence"
              payload: { expected_item_version: "${item_thr1_v}", cadence_days: 21 }
              as: Customer
              as_user_id: "${pet_thr1}"
              captures: { delta_after_thr1: $.data.cadence_prompt_state }
          assert:
            - "the plan's prompt delta is a step function rather than a smooth value: it reads ${delta_baseline_thr1} on the initial state"
            - "the equivalent-duration reading for this product and pet is ${equivalent_thr1}, so a 21-day cadence leaves a gap of 9 days"
            - "AutoshipItem.${item_thr1}.cadence_prompt_state == ${delta_after_thr1} == \"ALIGNED\" only when the gap stays inside the 3-day window; with a 9-day gap the state is UNDER_CONSUMPTION"
            - "AutoshipPlan.${plan_thr1}.cadence_prompt_due_date equals the plan due date plus the recomputed delta, so it moves with the cadence rather than staying stale"
            - "the same plan with cadence_days set to the equivalent duration reads ALIGNED, so the trigger is the gap rather than the cadence value itself"

