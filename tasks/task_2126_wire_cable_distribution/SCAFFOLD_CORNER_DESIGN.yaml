              payload: { part_number: "CU-500-XHHW", conductor_metal: "COPPER", copper_lbs_per_1000ft: 12.5, base_price_cents_per_ft: 18, min_cut_length_ft: 100, cut_charge_cents: 3500, reel_deposit_cents: 12500, master_reel_length_ft: 2500, reel_weight_lbs: 320.0, allowed_put_ups: ["MASTER_REEL", "CUT"] }
              as: PlatformAdmin
