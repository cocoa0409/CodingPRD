              as: Operator
              captures: { l2_id: $.data.id }
            - call: "POST /photos"
              payload: { lot_id: "${l2_id}", image_url: "http://img/l2.jpg" }
              as: Operator
            - call: "POST /estates/${e_id}/open"
              payload: {}
              as: Operator
          trigger:
            - call: "PATCH /lots/${l2_id}"
              payload: { status: "CATALOGED" }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "trigger PATCH /lots/${l2_id} returns 409 with error_id == ERR_ESTATE_NOT_CATALOGING"
            - "Lot.${l2_id}.status == DRAFT"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: pickup_window_halfopen_overlap_on_estate
        grounds:
          - calculations.pickup_window_nonoverlap
          - validations[priority=10]
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          PickupWindow uses HALF-OPEN [starts_at, ends_at) semantics on the estate
          resource: an abutting window (new.starts_at == existing.ends_at) is
          ACCEPTED (created in setup), but a genuinely overlapping window is
          REJECTED with ERR_WINDOW_OVERLAP. Adjacency-allowed distinguishes this
          from the buyer closed-interval rule.
        test_recipe:
          setup:
            - "Estate E. Window W1 [09:00,12:00) created. Window W2 [12:00,15:00) created (abutting, allowed under half-open)."
          setup_api_calls:
            - call: "POST /estates"
              payload: { seller_name: "Eo", seller_email: "eo@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { e_id: $.data.id }
            - call: "POST /pickup-windows"
              payload: { estate_id: "${e_id}", starts_at: "2026-03-25T09:00:00Z", ends_at: "2026-03-25T12:00:00Z", capacity: 3 }
              as: Operator
              captures: { w1_id: $.data.id }
            - call: "POST /pickup-windows"
              payload: { estate_id: "${e_id}", starts_at: "2026-03-25T12:00:00Z", ends_at: "2026-03-25T15:00:00Z", capacity: 3 }
              as: Operator
              captures: { w2_id: $.data.id }
          trigger:
            - call: "POST /pickup-windows"
              payload: { estate_id: "${e_id}", starts_at: "2026-03-25T11:00:00Z", ends_at: "2026-03-25T13:00:00Z", capacity: 3 }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "trigger POST /pickup-windows returns 409 with error_id == ERR_WINDOW_OVERLAP"

      - name: buyer_closed_interval_pickup_overlap
        grounds:
          - calculations.buyer_pickup_nonoverlap
          - validations[priority=10]
          - errors[ERR_PICKUP_OVERLAP]
        distinguishing_aspect: |
          The buyer schedule resource uses CLOSED [starts_at, ends_at] semantics:
          a buyer holding window Wa [09:00,12:00] (estate Ea) is REJECTED with
          ERR_PICKUP_OVERLAP when booking abutting window Wb [12:00,15:00] (estate
          Eb) for another order — abutting collides under closed semantics, the
          opposite of the half-open window-create rule.
        test_recipe:
          setup:
            - "Two estates Ea, Eb; verified B1 wins one lot in each -> orders Oa, Ob both PAID (total 12690)."
            - "Wa [09:00,12:00] in Ea; Wb [12:00,15:00] in Eb. B1 books Oa into Wa (SCHEDULED)."
          setup_api_calls:
            - call: "POST /estates"
              payload: { seller_name: "Ea2", seller_email: "ea2@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { ea_id: $.data.id }
            - call: "POST /estates"
              payload: { seller_name: "Eb2", seller_email: "eb2@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { eb_id: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "B1", email: "b1@x.com" }
              as: Anonymous
              captures: { b1_id: $.data.id }
            - call: "POST /buyers/${b1_id}/verify"
              payload: {}
              as: Operator
            - call: "POST /lots"
              payload: { estate_id: "${ea_id}", title: "La", description: "d", category: "misc", condition_grade: "B", starting_bid_cents: 10000 }
              as: Operator
              captures: { la_id: $.data.id }
            - call: "POST /photos"
              payload: { lot_id: "${la_id}", image_url: "http://img/la.jpg" }
              as: Operator
            - call: "PATCH /lots/${la_id}"
              payload: { status: "CATALOGED" }
              as: Operator
            - call: "PATCH /lots/${la_id}"
              payload: { status: "LISTED" }
              as: Operator
            - call: "POST /estates/${ea_id}/open"
              payload: {}
              as: Operator
            - call: "GET /lots/${la_id}"
              payload: {}
              as: Operator
              captures: { lav: $.data.version }
            - call: "POST /bids"
              payload: { lot_id: "${la_id}", buyer_id: "${b1_id}", amount_cents: 10000, expected_lot_version: "${lav}" }
              as: Buyer
              as_user_id: "${b1_id}"
            - call: "POST /estates/${ea_id}/close"
              payload: {}
              as: Operator
            - call: "GET /orders"
              payload: { estate_id: "${ea_id}" }
              as: Operator
              captures: { oa_id: "$.data[0].id" }
            - call: "POST /orders/${oa_id}/pay"
              payload: { amount_cents: 12690 }
              as: Buyer
              as_user_id: "${b1_id}"
            - call: "POST /lots"
              payload: { estate_id: "${eb_id}", title: "Lb", description: "d", category: "misc", condition_grade: "B", starting_bid_cents: 10000 }
              as: Operator
              captures: { lb_id: $.data.id }
            - call: "POST /photos"
              payload: { lot_id: "${lb_id}", image_url: "http://img/lb.jpg" }
              as: Operator
            - call: "PATCH /lots/${lb_id}"
              payload: { status: "CATALOGED" }
