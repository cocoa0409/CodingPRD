scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: visit_instrument_variant_divergence_cdai_vs_das28
        grounds:
          - calculations.visit_disease_activity_score
          - calculations.patient_target_status
          - entities.Visit.fields.activity_score
          - entities.Visit.fields.activity_category
          - state_machines.Visit.CHECKED_IN_to_SCORED
        distinguishing_aspect: |
          Clinical-scoring domain (Visit / Patient): identical joint counts and patient global
          assessment scored with CDAI yield 9.00 / LOW while DAS28_CRP yields 3.62 / MODERATE,
          so the two valid instruments disagree on both the number and the category and drive
          opposite Patient.target_status values.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z (server default)."
            - "One rheumatologist and one nurse registered."
            - "Two patients, each with exactly one FOLLOW_UP visit with the same rheumatologist, both CHECKED_IN, neither scored."
            - "Neither patient has any TherapyEpisode, so the MODERATE branch of the escalation rule cannot find a long-running ACTIVE episode."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "1234567893", full_name: "Ada Rheum", role_type: "RHEUMATOLOGIST", can_attest_formulary_exception: true }
              as: RegistryAdmin
              captures: { rheum1_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "1234567895", full_name: "Nia Nurse", role_type: "NURSE" }
              as: RegistryAdmin
              captures: { nurse1_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Pat One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat1_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "RH0002", full_name: "Pat Two", date_of_birth: "1980-09-30", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat2_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat1_id}", clinician_id: "${rheum1_id}", visit_datetime: "2026-08-03T14:00:00Z", visit_type: "FOLLOW_UP" }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat2_id}", clinician_id: "${rheum1_id}", visit_datetime: "2026-08-04T14:00:00Z", visit_type: "FOLLOW_UP" }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { v2_id: $.data.id }
            - call: "POST /visits/${v1_id}/check-in"
              payload: {}
              as: InfusionNurse
              as_user_id: "${nurse1_id}"
            - call: "POST /visits/${v2_id}/check-in"
              payload: {}
              as: InfusionNurse
              as_user_id: "${nurse1_id}"
          trigger:
            - call: "POST /visits/${v1_id}/score"
              payload: { scoring_instrument: "CDAI", tender_joint_count: 2, swollen_joint_count: 1, patient_global_assessment: 3.0, physician_global_assessment: 3.0 }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
            - call: "POST /visits/${v2_id}/score"
              payload: { scoring_instrument: "DAS28_CRP", tender_joint_count: 2, swollen_joint_count: 1, patient_global_assessment: 3.0, crp_mg_dl: 2.5 }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
          assert:
            - "Visit.${v1_id}.activity_score == 9.00"
            - "Visit.${v1_id}.activity_category == \"LOW\""
            - "Visit.${v1_id}.escalation_recommendation == \"CONTINUE\""
            - "Visit.${v2_id}.activity_score == 3.62"
            - "Visit.${v2_id}.activity_category == \"MODERATE\""
            - "Visit.${v2_id}.escalation_recommendation == \"OPTIMIZE_CURRENT\""
            - "Visit.${v1_id}.activity_score != Visit.${v2_id}.activity_score"
            - "Patient.${pat1_id}.target_status == \"AT_TARGET\""
            - "Patient.${pat2_id}.target_status == \"NOT_AT_TARGET\""

      - name: cost_share_channel_variant_divergence_pharmacy_vs_medical
        grounds:
          - calculations.episode_cost_share_estimate
          - calculations.episode_benefit_routing
          - entities.TherapyEpisode.fields.benefit_channel
          - entities.TherapyEpisode.fields.site_of_care
        distinguishing_aspect: |
          Financial domain (TherapyEpisode / PayerPlan): two drugs with the identical
          acquisition_cost_cents of 250050 on the identical payer plan produce
          total_member_share_cents 345054 on the PHARMACY variant and 420054 on the MEDICAL
          variant over six doses — a 75000-cent delta that is exactly the six per-dose
          facility fees the MEDICAL variant charges outside the deductible waterfall.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One payer plan Meridian PPO with both benefits enabled, PREFER_AMBULATORY, coinsurance_pct 0.175, deductible_remaining_cents 100000, medical_facility_fee_cents 12500."
            - "Two IL6 drugs with identical acquisition_cost_cents 250050 — one SC (routes to PHARMACY / SELF_ADMIN), one IV with admin_time_minutes 150 (routes to MEDICAL / AMBULATORY_INFUSION_CENTER)."
            - "Two distinct patients, one PLANNED episode each, so neither episode supersedes the other."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "1234567893", full_name: "Ada Rheum", role_type: "RHEUMATOLOGIST", can_attest_formulary_exception: true }
              as: RegistryAdmin
              captures: { rheum1_id: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Sarilumab", molecule_class: "IL6", route: "SC", formulary_tier: 4, acquisition_cost_cents: 250050, admin_time_minutes: 0, monitoring_panel_type: "CBC", monitoring_panel_interval_days: 180 }
              as: RegistryAdmin
              captures: { sc_drug_id: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Tocilizumab", molecule_class: "IL6", route: "IV", formulary_tier: 4, acquisition_cost_cents: 250050, admin_time_minutes: 150, monitoring_panel_type: "CMP", monitoring_panel_interval_days: 90 }
              as: RegistryAdmin
              captures: { iv_drug_id: $.data.id }
            - call: "POST /payer-plans"
              payload: { name: "Meridian PPO", pharmacy_benefit_enabled: true, medical_benefit_enabled: true, site_of_care_policy: "PREFER_AMBULATORY", coinsurance_pct: 0.175, deductible_remaining_cents: 100000, medical_facility_fee_cents: 12500, hospital_outpatient_multiplier: 1.40, appeal_rounds_allowed: 2, auth_validity_days: 180, step_therapy_classes_required: ["TNFI"] }
              as: RegistryAdmin
              captures: { mer_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Pat One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat1_id: $.data.id, pat1_v: $.data.version }
            - call: "POST /patients"
              payload: { mrn: "RH0002", full_name: "Pat Two", date_of_birth: "1980-09-30", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat2_id: $.data.id, pat2_v: $.data.version }
            - call: "POST /therapy-episodes"
              payload: { patient_id: "${pat1_id}", drug_id: "${sc_drug_id}", payer_plan_id: "${mer_id}", therapy_start_at: "2026-08-01T00:00:00Z", expected_patient_version: "${pat1_v}" }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { sc_ep_id: $.data.id }
            - call: "POST /therapy-episodes"
              payload: { patient_id: "${pat2_id}", drug_id: "${iv_drug_id}", payer_plan_id: "${mer_id}", therapy_start_at: "2026-08-01T00:00:00Z", expected_patient_version: "${pat2_v}" }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { iv_ep_id: $.data.id }
          trigger:
            - call: "GET /therapy-episodes/${sc_ep_id}/cost-share-estimate"
              payload: { dose_count: 6 }
              as: BenefitsCounselor
              captures: { sc_total: $.data.total_member_share_cents }
            - call: "GET /therapy-episodes/${iv_ep_id}/cost-share-estimate"
              payload: { dose_count: 6 }
              as: BenefitsCounselor
              captures: { iv_total: $.data.total_member_share_cents }
          assert:
            - "TherapyEpisode.${sc_ep_id}.benefit_channel == \"PHARMACY\""
            - "TherapyEpisode.${sc_ep_id}.site_of_care == \"SELF_ADMIN\""
            - "TherapyEpisode.${iv_ep_id}.benefit_channel == \"MEDICAL\""
            - "TherapyEpisode.${iv_ep_id}.site_of_care == \"AMBULATORY_INFUSION_CENTER\""
            - "cost-share-estimate for ${sc_ep_id}: allowed_per_dose_cents == 250050, facility_per_dose_cents == 0, per_dose_share_cents == [126259, 43759, 43759, 43759, 43759, 43759], total_member_share_cents == 345054"
            - "cost-share-estimate for ${iv_ep_id}: allowed_per_dose_cents == 250050, facility_per_dose_cents == 12500, per_dose_share_cents == [138759, 56259, 56259, 56259, 56259, 56259], total_member_share_cents == 420054"
            - "${iv_total} - ${sc_total} == 75000"

  - rule_id: combinatorial_formula
    instances:
      - name: per_dose_rounding_then_sum_pins_medical_cost_share_total
        grounds:
          - calculations.episode_cost_share_estimate
          - entities.PayerPlan.fields.coinsurance_pct
          - entities.PayerPlan.fields.deductible_remaining_cents
          - entities.PayerPlan.fields.medical_facility_fee_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters: rounding the 0.175 coinsurance to
          whole cents once per dose and then summing gives coinsurance_cents 245054 and
          total_member_share_cents 420054, whereas summing the unrounded coinsurance across the
          six doses and rounding at the end gives 245053 and 420053; the scaffold pins the
          per-dose order and the test asserts the 420054 literal.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Meridian PPO with coinsurance_pct 0.175, deductible_remaining_cents 100000, medical_facility_fee_cents 12500, PREFER_AMBULATORY."
            - "One IV drug Infliximab with acquisition_cost_cents 250050 and admin_time_minutes 150, so allowed_per_dose_cents is 250050 and the hospital multiplier does not apply."
            - "One patient with one PLANNED episode on that drug and plan."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "1234567893", full_name: "Ada Rheum", role_type: "RHEUMATOLOGIST", can_attest_formulary_exception: true }
              as: RegistryAdmin
              captures: { rheum1_id: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab", molecule_class: "TNFI", route: "IV", formulary_tier: 3, acquisition_cost_cents: 250050, admin_time_minutes: 150, monitoring_panel_type: "CMP", monitoring_panel_interval_days: 90 }
              as: RegistryAdmin
              captures: { ifx_id: $.data.id }
            - call: "POST /payer-plans"
              payload: { name: "Meridian PPO", pharmacy_benefit_enabled: true, medical_benefit_enabled: true, site_of_care_policy: "PREFER_AMBULATORY", coinsurance_pct: 0.175, deductible_remaining_cents: 100000, medical_facility_fee_cents: 12500, hospital_outpatient_multiplier: 1.40, appeal_rounds_allowed: 2, auth_validity_days: 180, step_therapy_classes_required: ["TNFI"] }
              as: RegistryAdmin
              captures: { mer_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Pat One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat1_id: $.data.id, pat1_v: $.data.version }
            - call: "POST /therapy-episodes"
              payload: { patient_id: "${pat1_id}", drug_id: "${ifx_id}", payer_plan_id: "${mer_id}", therapy_start_at: "2026-08-01T00:00:00Z", expected_patient_version: "${pat1_v}" }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { ep_id: $.data.id }
          trigger:
            - call: "GET /therapy-episodes/${ep_id}/cost-share-estimate"
              payload: { dose_count: 6 }
              as: BenefitsCounselor
              captures: { total: $.data.total_member_share_cents, coins: $.data.coinsurance_cents }
          assert:
            - "cost-share-estimate.deductible_applied_cents == 100000"
            - "cost-share-estimate.coinsurance_cents == 245054"
            - "cost-share-estimate.facility_cents == 75000"
            - "cost-share-estimate.per_dose_share_cents == [138759, 56259, 56259, 56259, 56259, 56259]"
            - "cost-share-estimate.total_member_share_cents == 420054"
            - "cost-share-estimate.coinsurance_cents != 245053 (the sum-then-round answer)"
            - "cost-share-estimate.total_member_share_cents != 420053 (the sum-then-round answer)"

      - name: assistance_tier_evaluation_order_pins_applied_and_out_of_pocket
        grounds:
          - calculations.assistance_benefit_application
          - calculations.episode_cost_share_estimate
          - entities.InfusionAppointment.fields.assistance_applied_cents
          - entities.InfusionAppointment.fields.patient_out_of_pocket_cents
          - entities.AssistanceEnrollment.fields.benefit_remaining_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order: the coverage
          tier is keyed on the GROSS dose_cost_share_cents, never on the residual
          patient_out_of_pocket_cents that the tier itself produces. Dose 1 at 138759 therefore
          takes the 0.80 tier (applied 111007, out-of-pocket 27752); keying the tier on the
          27752 residual instead would yield the 0.90 tier and 124883 / 13876. Dose 2 at 56259
          independently takes the 0.90 tier (50633 / 5626), proving the tier is re-derived per
          dose from the gross share.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Meridian PPO (coinsurance 0.175, deductible 100000, facility fee 12500, PREFER_AMBULATORY, auth_validity_days 180) and IV drug Infliximab (250050 cents, 150 minutes, CMP / 90 days, TNFI)."
            - "Patient screened clear for TB and hepatitis B; episode ACTIVE with a CURRENT CMP panel; authorization APPROVED for 6 units valid 2026-08-01 through 2027-01-28."
            - "One AMBULATORY_INFUSION_CENTER chair with a 30-minute turnover buffer."
            - "One MANUFACTURER_COPAY_CARD enrollment, ACTIVE, annual_benefit_cents 500000, coverage 2026-08-01 onward, so no dose is capped by the remaining benefit."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "1234567893", full_name: "Ada Rheum", role_type: "RHEUMATOLOGIST", can_attest_formulary_exception: true }
              as: RegistryAdmin
              captures: { rheum1_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "1234567895", full_name: "Nia Nurse", role_type: "NURSE" }
              as: RegistryAdmin
              captures: { nurse1_id: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab", molecule_class: "TNFI", route: "IV", formulary_tier: 3, acquisition_cost_cents: 250050, admin_time_minutes: 150, monitoring_panel_type: "CMP", monitoring_panel_interval_days: 90 }
              as: RegistryAdmin
              captures: { ifx_id: $.data.id }
            - call: "POST /payer-plans"
              payload: { name: "Meridian PPO", pharmacy_benefit_enabled: true, medical_benefit_enabled: true, site_of_care_policy: "PREFER_AMBULATORY", coinsurance_pct: 0.175, deductible_remaining_cents: 100000, medical_facility_fee_cents: 12500, hospital_outpatient_multiplier: 1.40, appeal_rounds_allowed: 2, auth_validity_days: 180, step_therapy_classes_required: ["TNFI"] }
              as: RegistryAdmin
              captures: { mer_id: $.data.id }
            - call: "POST /infusion-chairs"
              payload: { label: "AIC-1", site_type: "AMBULATORY_INFUSION_CENTER", turnover_buffer_minutes: 30 }
              as: RegistryAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Pat One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat1_id: $.data.id }
            - call: "POST /screening-records"
              payload: { patient_id: "${pat1_id}", screen_type: "TB_IGRA", result: "NEGATIVE", collected_at: "2026-07-20T00:00:00Z", resulted_at: "2026-07-21T00:00:00Z" }
              as: InfusionNurse
              as_user_id: "${nurse1_id}"
            - call: "POST /screening-records"
              payload: { patient_id: "${pat1_id}", screen_type: "HBV_SURFACE_AG", result: "NEGATIVE", collected_at: "2026-07-20T00:00:00Z", resulted_at: "2026-07-21T00:00:00Z" }
              as: InfusionNurse
              as_user_id: "${nurse1_id}"
            - call: "POST /screening-records"
              payload: { patient_id: "${pat1_id}", screen_type: "HBV_CORE_AB", result: "NEGATIVE", collected_at: "2026-07-20T00:00:00Z", resulted_at: "2026-07-21T00:00:00Z" }
              as: InfusionNurse
              as_user_id: "${nurse1_id}"
            - call: "GET /patients/${pat1_id}"
              payload: {}
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { pat1_v: $.data.version }
            - call: "POST /therapy-episodes"
              payload: { patient_id: "${pat1_id}", drug_id: "${ifx_id}", payer_plan_id: "${mer_id}", therapy_start_at: "2026-08-01T00:00:00Z", expected_patient_version: "${pat1_v}" }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { ep_id: $.data.id }
            - call: "POST /monitoring-labs"
              payload: { episode_id: "${ep_id}", panel_type: "CMP", collected_at: "2026-07-25T00:00:00Z", alt_u_l: 30.0, neutrophil_k_ul: 3.20 }
              as: InfusionNurse
              as_user_id: "${nurse1_id}"
            - call: "GET /therapy-episodes/${ep_id}"
              payload: {}
              as: PriorAuthCoordinator
              captures: { ep_v: $.data.version }
            - call: "POST /authorizations"
              payload: { episode_id: "${ep_id}", requested_units: 6, expected_episode_version: "${ep_v}" }
              as: PriorAuthCoordinator
              captures: { auth_id: $.data.id }
            - call: "POST /authorizations/${auth_id}/submit"
              payload: {}
              as: PriorAuthCoordinator
            - call: "POST /authorizations/${auth_id}/determination"
              payload: { decision: "APPROVED", approved_units: 6, valid_from: "2026-08-01T00:00:00Z", valid_through: "2027-01-28T00:00:00Z" }
              as: PayerReviewer
            - call: "POST /therapy-episodes/${ep_id}/activate"
              payload: {}
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
            - call: "POST /assistance-enrollments"
              payload: { episode_id: "${ep_id}", program_type: "MANUFACTURER_COPAY_CARD", annual_benefit_cents: 500000, coverage_start: "2026-08-01T00:00:00Z" }
              as: BenefitsCounselor
              as_user_id: "counselor-alpha"
              captures: { enr_id: $.data.id }
            - call: "POST /assistance-enrollments/${enr_id}/attest"
              payload: {}
              as: BenefitsCounselor
              as_user_id: "counselor-beta"
          trigger:
            - call: "POST /infusion-appointments"
              payload: { episode_id: "${ep_id}", chair_id: "${chair_id}", scheduled_start: "2026-08-12T09:00:00Z" }
              as: InfusionNurse
              as_user_id: "${nurse1_id}"
              captures: { appt1_id: $.data.id }
            - call: "POST /infusion-appointments"
              payload: { episode_id: "${ep_id}", chair_id: "${chair_id}", scheduled_start: "2026-08-12T12:00:00Z" }
              as: InfusionNurse
              as_user_id: "${nurse1_id}"
              captures: { appt2_id: $.data.id }
          assert:
            - "InfusionAppointment.${appt1_id}.dose_sequence == 1"
            - "InfusionAppointment.${appt1_id}.dose_cost_share_cents == 138759"
            - "InfusionAppointment.${appt1_id}.assistance_applied_cents == 111007"
            - "InfusionAppointment.${appt1_id}.patient_out_of_pocket_cents == 27752"
            - "InfusionAppointment.${appt2_id}.dose_sequence == 2"
            - "InfusionAppointment.${appt2_id}.dose_cost_share_cents == 56259"
            - "InfusionAppointment.${appt2_id}.assistance_applied_cents == 50633"
            - "InfusionAppointment.${appt2_id}.patient_out_of_pocket_cents == 5626"
            - "AssistanceEnrollment.${enr_id}.benefit_reserved_cents == 161640"
            - "AssistanceEnrollment.${enr_id}.benefit_remaining_cents == 338360"
            - "InfusionAppointment.${appt1_id}.assistance_applied_cents != 124883 (the answer produced by keying the tier on the residual out-of-pocket)"

  - rule_id: non_linear_state_machine
    instances:
      - name: therapy_episode_hold_resume_cycle_with_reason_specific_gates
        grounds:
          - state_machines.TherapyEpisode.therapy_state.ACTIVE_to_HELD
          - state_machines.TherapyEpisode.therapy_state.HELD_to_ACTIVE
          - calculations.resumption_earliest_instant
          - validations.priority_43_ERR_WASHOUT_PERIOD_NOT_ELAPSED
          - validations.priority_35_ERR_RESUMPTION_PROTOCOL_INCOMPLETE
        distinguishing_aspect: |
          TherapyEpisode.therapy_state is the cycling entity: ACTIVE -> HELD -> ACTIVE -> HELD ->
          ACTIVE traverses the same pair of states twice, and the HELD -> ACTIVE edge is guarded
          by a DIFFERENT obligation on each pass (wound_healed_attested after a SURGERY hold with
          a 14-day TNFI washout, infection_resolved_attested after an INFECTION hold with a 7-day
          washout). hold_count reaches 2 while funding_state never leaves AUTHORIZED, showing the
          cycle is confined to one of the two parallel dimensions.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Infliximab (TNFI, IV, 250050 cents, 150 minutes, CMP / 90 days) on Meridian PPO."
            - "Patient cleared for TB and hepatitis B; CMP panel collected 2026-07-25 with normal ALT and ANC, so monitoring_status is CURRENT through 2026-10-23."
            - "Authorization APPROVED for 6 units valid 2026-08-01 through 2027-01-28; episode ACTIVE with funding_state AUTHORIZED."
            - "No InfusionAppointment exists, so the hold cascade has nothing to cancel and the authorization counters stay still."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "1234567893", full_name: "Ada Rheum", role_type: "RHEUMATOLOGIST", can_attest_formulary_exception: true }
              as: RegistryAdmin
              captures: { rheum1_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "1234567895", full_name: "Nia Nurse", role_type: "NURSE" }
              as: RegistryAdmin
              captures: { nurse1_id: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab", molecule_class: "TNFI", route: "IV", formulary_tier: 3, acquisition_cost_cents: 250050, admin_time_minutes: 150, monitoring_panel_type: "CMP", monitoring_panel_interval_days: 90 }
              as: RegistryAdmin
              captures: { ifx_id: $.data.id }
            - call: "POST /payer-plans"
