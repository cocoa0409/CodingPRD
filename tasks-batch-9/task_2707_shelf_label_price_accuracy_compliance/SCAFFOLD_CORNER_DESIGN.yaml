              as: StoreManager
              as_user_id: "${sm1}"
              captures: { err_scope: $.data.error_id }
          assert:
            - "All three FK targets exist, so no 404 is returned by any trigger"
            - "Aisle B01 under store S001: HTTP 422 with ${err_aisle} == ERR_AISLE_STORE_MISMATCH"
            - "Associate la2 (store S002) under store S001: HTTP 422 with ${err_assoc} == ERR_ASSOCIATE_STORE_MISMATCH"
            - "Store S002 for a file scoped to [S001]: HTTP 422 with ${err_scope} == ERR_STORE_OUT_OF_FILE_SCOPE"
            - "GET /price-integrity/label-tasks?price_change_line_id=${line_1} returns total_count 0 and PriceChangeFile.${file_a}.version is still ${file_a_v}"

      - name: corner_invalid_pagination_arguments_returns_4XX_before_any_query
        claim_type: listing
        grounds:
          - validations.priority_26_ERR_INVALID_PAGINATION
          - endpoints.GET_/price-integrity/scanner-audits
          - endpoints.GET_/price-integrity/label-tasks
        distinguishing_aspect: "A negative offset or a limit above the declared maximum is rejected at priority 26 with ERR_INVALID_PAGINATION (400) — after authentication/authorization but before any filter is evaluated, so an otherwise-unknown filter value never masks it."
        test_recipe:
          setup:
            - "One jurisdiction and one store; no audits and no label tasks are needed because the rejection precedes the query."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California" }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
          trigger:
            - call: "GET /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", limit: 0, offset: 0 }
              as: ComplianceOfficer
              captures: { err_limit_low: $.data.error_id }
            - call: "GET /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", limit: 500, offset: 0 }
              as: ComplianceOfficer
              captures: { err_limit_high: $.data.error_id }
            - call: "GET /price-integrity/label-tasks"
              payload: { store_id: "${store_a}", limit: 20, offset: -1 }
              as: ComplianceOfficer
              captures: { err_offset: $.data.error_id }
          assert:
            - "limit 0: HTTP 400 with ${err_limit_low} == ERR_INVALID_PAGINATION"
            - "limit 500 (above the declared max of 100): HTTP 400 with ${err_limit_high} == ERR_INVALID_PAGINATION"
            - "offset -1: HTTP 400 with ${err_offset} == ERR_INVALID_PAGINATION"
            - "The same three requests with limit 20 and offset 0 return HTTP 200 with data == [] and meta.total_count == 0"

  # ===========================================================================
  - section: State Machines
    instances:
      - name: corner_initial_state_of_every_created_entity_matches_declaration
        claim_type: initial_state
        grounds:
          - state_machines.PriceChangeFile.initial_state
          - state_machines.PriceChangeLine.initial_state
          - state_machines.LabelTask.initial_state
          - state_machines.Associate.initial_state
          - state_machines.ScannerAudit.initial_state
          - state_machines.PromoSignage.initial_state
        distinguishing_aspect: "Every freshly created entity sits in its declared initial_state — file DRAFT, line PENDING, associate UNTRAINED, audit OPEN, signage DRAFT — and a LabelTask starts at the product state print_status=NOT_PRINTED x placement_status=UNPLACED rather than at a single scalar status."
        test_recipe:
          setup:
            - "One jurisdiction, one store, one aisle; a certified STORE_MANAGER sm1 and certified LABEL_ASSOCIATE la1 for the label task; an untrained associate x1 whose status is the probe."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California" }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { aisle_a1: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-SM1", full_name: "Sam Manager", role_code: "STORE_MANAGER" }
              as: PricingAdmin
              captures: { sm1: $.data.id }
            - call: "POST /price-integrity/associates/${sm1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-LA1", full_name: "Lee Label", role_code: "LABEL_ASSOCIATE" }
              as: PricingAdmin
              captures: { la1: $.data.id }
            - call: "POST /price-integrity/associates/${la1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-PA1", full_name: "Pat Auditor", role_code: "PRICE_AUDITOR" }
              as: PricingAdmin
              captures: { pa1: $.data.id }
            - call: "POST /price-integrity/associates/${pa1}/training-completions"
              payload: { module_code: "AUDIT_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/price-change-files"
              payload: { file_number: "PCF-1001", jurisdiction_id: "${jur_a}", effective_date: "2026-08-03T00:00:00Z", scope_store_ids: ["${store_a}"], priority: "ROUTINE" }
              as: PricingAdmin
              captures: { file_a: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_a}/lines"
              payload: { item_upc: "00000000002001", item_description: "Cheese 12oz", category_code: "DAIRY", old_retail_cents: 1199, new_retail_cents: 1000, net_content_qty: 12, net_content_uom: "OZ" }
              as: PricingAdmin
              captures: { line_1: $.data.id }
          trigger:
            - call: "POST /price-integrity/stores/${store_a}/associates"
