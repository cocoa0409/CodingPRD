scaffold_corner_design:
  # =========================================================================
  # Section: entities (Table 1 claims)
  # =========================================================================
  - section: entities
    instances:
      - name: create_aircraft_applies_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Aircraft]
        distinguishing_aspect: "A newly registered aircraft starts AVAILABLE with zeroed computed totals and version 1; id/created_at/updated_at are server-minted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-ENT-1", model: "A320-200", manufacture_date: "2012-05-17" }, as: LessorAdmin, captures: { ac: "$.data.id", st: "$.data.status", hrs: "$.data.total_flight_hours", ver: "$.data.version"} }
          trigger:
            - { call: "GET /leasing/aircraft/${ac}", payload: {}, as: LessorAdmin, captures: { st2: "$.data.status"} }
          assert:
            - "create response: status == AVAILABLE, total_flight_hours == 0, total_flight_cycles == 0, version == 1"
            - "GET returns the same aircraft with status AVAILABLE; id is a server-minted UUID"
            - "response envelope: meta.api_request_id present, response_type == object"

      - name: create_aircraft_computed_input_ignored
        claim_type: computed_fields
        grounds: [entities.Aircraft.fields.status, entities.Aircraft.fields.total_flight_hours]
        distinguishing_aspect: "Client-supplied values for system/computed fields (status, total_flight_hours) are ignored, not honored."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-ENT-2", model: "B737-800", manufacture_date: "2015-01-01", status: "REPOSSESSED", total_flight_hours: 99999 }, as: LessorAdmin, captures: { st: "$.data.status", hrs: "$.data.total_flight_hours"} }
          trigger: []
          assert:
            - "response status == AVAILABLE and total_flight_hours == 0 despite the client submitting REPOSSESSED / 99999"

      - name: create_lease_missing_required_aircraft_id_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Lease.fields.aircraft_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field aircraft_id from lease creation yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["one lessee exists"]
          setup_api_calls:
            - { call: "POST /leasing/lessees", payload: { legal_name: "Req Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
          trigger:
            - { call: "POST /leasing/leases", payload: { lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { err: "$.data.error_id"} }
          assert:
            - "rejected with error_id == ERR_INVALID_REQUEST and http 400"

      - name: create_lease_end_before_start_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "end_date <= start_date is a schema-level rejection."
        test_recipe:
          setup: ["aircraft and lessee exist"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-ENT-3", model: "A321neo", manufacture_date: "2019-09-09" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Date Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
          trigger:
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2027-08-01", end_date: "2026-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { err: "$.data.error_id"} }
          assert:
            - "rejected with error_id == ERR_INVALID_REQUEST (end_date 2026-08-01 precedes start_date 2027-08-01)"

      - name: create_novation_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.NovationRequest.fields.request_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "request_type outside {NOVATION, SUBLEASE} is rejected at schema validation."
        test_recipe:
          setup: ["ACTIVE lease held by lessee A; lessee B exists"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-ENT-4", model: "E190", manufacture_date: "2014-04-04" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-ENT-4" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Enum Air" }, as: LessorAdmin, captures: { lesA: "$.data.id"} }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Enum2 Air" }, as: LessorAdmin, captures: { lesB: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${lesA}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
          trigger:
            - { call: "POST /leasing/leases/${lease}/novation-requests", payload: { request_type: "LEASEBACK", proposed_lessee_id: "${lesB}" }, as: LesseeRep, as_user_id: "${lesA}", captures: { err: "$.data.error_id"} }
          assert:
            - "rejected with error_id == ERR_INVALID_REQUEST (LEASEBACK is not a declared enum member)"

      - name: get_lease_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Reading a lease with a well-formed but nonexistent UUID yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /leasing/leases/00000000-0000-4000-8000-000000000000", payload: {}, as: LessorAdmin, captures: { err: "$.data.error_id"} }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404; envelope response_type == error"

      - name: lessee_list_pagination_and_defaults
        claim_type: listing
        grounds: [response_envelope, entities.Lessee.fields.credit_tier]
        distinguishing_aspect: "limit/offset/has_more/total_count follow the fixed envelope defaults; omitted credit_tier defaults to B."
        test_recipe:
          setup: ["three lessees registered, one with explicit credit_tier A and two relying on the default"]
          setup_api_calls:
            - { call: "POST /leasing/lessees", payload: { legal_name: "Pg Air 1", credit_tier: "A" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Pg Air 2" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Pg Air 3" }, as: LessorAdmin }
          trigger:
            - { call: "GET /leasing/lessees", payload: { limit: 2, offset: 0 }, as: LessorAdmin }
            - { call: "GET /leasing/lessees", payload: { limit: 2, offset: 2 }, as: LessorAdmin }
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2: 1 item, total_count == 3, has_more == false"
            - "Pg Air 2 and Pg Air 3 carry credit_tier == B (default applied)"

      - name: inspection_booking_immutable_no_version
        claim_type: immutability
        grounds: [entities.InspectionBooking]
        distinguishing_aspect: "InspectionBooking has common_fields: false — response carries id and created_at but no version, and no update endpoint exists."
        test_recipe:
          setup: ["ReturnCase in INSPECTION (4 doc types verified); inspector registered"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-ENT-5", model: "B777F", manufacture_date: "2010-10-10" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-E5a" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "AIRWORTHINESS_CERT", doc_reference: "AC-E5a" }, as: LessorAdmin, captures: { d2: "$.data.id"} }
            - { call: "POST /leasing/documents/${d2}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "ENGINE_LOG", doc_reference: "EL-E5a" }, as: LessorAdmin, captures: { d3: "$.data.id"} }
            - { call: "POST /leasing/documents/${d3}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "LLP_STATUS", doc_reference: "LLP-E5a" }, as: LessorAdmin, captures: { d4: "$.data.id"} }
            - { call: "POST /leasing/documents/${d4}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Imm Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/initiate-return", payload: {}, as: LessorAdmin }
            - { call: "GET /leasing/leases/${lease}/return-cases", payload: {}, as: LessorAdmin, captures: { rc: "$.data[0].id"} }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "RECORDS_VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "INSPECTION" }, as: LessorAdmin }
            - { call: "POST /leasing/inspectors", payload: { full_name: "Iris Nspect", license_number: "LIC-ENT-5" }, as: LessorAdmin, captures: { insp: "$.data.id"} }
          trigger:
            - { call: "POST /leasing/return-cases/${rc}/inspection-bookings", payload: { inspector_id: "${insp}", booking_date: "2026-08-01" }, as: LessorAdmin, captures: { bk: "$.data.id"} }
          assert:
            - "201 response contains id and created_at and no version/updated_at fields"
            - "GET /leasing/return-cases/${rc}/inspection-bookings lists exactly this booking (FK reverse reachability)"
  # =========================================================================
  # Section: state_machines (Table 2 claims)
  # =========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_lease_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Lease.DRAFT_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activate is legal only from DRAFT; a second activation of an ACTIVE lease fails with ERR_INVALID_STATE (also the idempotency claim for this trigger)."
        test_recipe:
          setup: ["aircraft with VERIFIED BIRTH_RECORD; lease activated once"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-SM-1", model: "A320-200", manufacture_date: "2012-01-01" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-SM-1" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "SM1 Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
          trigger:
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin, captures: { err: "$.data.error_id"} }
          assert:
            - "second activation rejected with ERR_INVALID_STATE; no transition exists from ACTIVE via activate"

      - name: voided_report_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.UtilizationReport.ACCEPTED_to_VOIDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "VOIDED is terminal: reviewing a voided report fails and no further transitions or ledger effects occur."
        test_recipe:
          setup: ["ACTIVE lease; report accepted then voided"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-SM-2", model: "A321neo", manufacture_date: "2018-02-02" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-SM-2" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "SM2 Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/utilization-reports", payload: { period_month: "2026-08", flight_hours: 100.0, flight_cycles: 20 }, as: LesseeRep, as_user_id: "${les}", captures: { rep: "$.data.id"} }
            - { call: "POST /leasing/utilization-reports/${rep}/review", payload: { decision: "ACCEPT" }, as: LessorAdmin }
            - { call: "POST /leasing/utilization-reports/${rep}/void", payload: {}, as: LessorAdmin }
          trigger:
            - { call: "POST /leasing/utilization-reports/${rep}/review", payload: { decision: "ACCEPT" }, as: LessorAdmin, captures: { err: "$.data.error_id"} }
          assert:
            - "review of a VOIDED report rejected with ERR_INVALID_STATE (terminal lockdown)"
            - "Lease.reserve_accrued_cents remains 0 (no ledger side effect from the rejected call)"

      - name: slot_advance_skipping_confirmed_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.TransitionSlot.CONFIRMED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "TransitionSlot cannot skip TENTATIVE -> COMPLETED; the only path is TENTATIVE -> CONFIRMED -> COMPLETED."
        test_recipe:
          setup: ["aircraft with ACTIVE lease and one TENTATIVE slot"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-SM-3", model: "A330-300", manufacture_date: "2008-08-08" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-SM-3" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "SM3 Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/transition-slots", payload: { window_start: "2026-09-10", window_end: "2026-09-20" }, as: LessorAdmin, captures: { slot: "$.data.id"} }
          trigger:
            - { call: "POST /leasing/transition-slots/${slot}/advance", payload: { to: "COMPLETED" }, as: LessorAdmin, captures: { err: "$.data.error_id"} }
          assert:
            - "advance to COMPLETED from TENTATIVE rejected with ERR_INVALID_STATE (state skip forbidden)"

      - name: abort_return_reverts_lease_and_cancels_case
        claim_type: side_effect_execution
        grounds: [state_machines.Lease.RETURN_INITIATED_to_ACTIVE]
        distinguishing_aspect: "The abort revert fires its cascade: lease back to ACTIVE and the OPEN ReturnCase to CANCELLED."
        test_recipe:
          setup: ["ACTIVE lease with return initiated (ReturnCase OPEN)"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-SM-4", model: "B787-9", manufacture_date: "2017-07-07" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-SM-4" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "SM4 Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/initiate-return", payload: {}, as: LessorAdmin }
            - { call: "GET /leasing/leases/${lease}/return-cases", payload: {}, as: LessorAdmin, captures: { rc: "$.data[0].id"} }
          trigger:
            - { call: "POST /leasing/leases/${lease}/abort-return", payload: {}, as: LessorAdmin, captures: { st: "$.data.status"} }
            - { call: "GET /leasing/leases/${lease}/return-cases", payload: {}, as: LessorAdmin, captures: { rc_st: "$.data[0].status"} }
          assert:
            - "Lease.status == ACTIVE after abort (revert)"
            - "ReturnCase.status == CANCELLED (cascade down)"
            - "a second abort on the ACTIVE lease is rejected with ERR_INVALID_STATE (no transition)"

      - name: checklist_item_rectify_reinspect_loop_and_waive
        claim_type: valid_transition
        grounds: [state_machines.ChecklistItem.NON_COMPLIANT_to_RECTIFIED, state_machines.ChecklistItem.RECTIFIED_to_NON_COMPLIANT, state_machines.ChecklistItem.NON_COMPLIANT_to_WAIVED]
        distinguishing_aspect: "ChecklistItem supports the rectify -> re-inspect -> NON_COMPLIANT loop (cyclic) and the WAIVED escape; the loop overwrites the estimate."
        test_recipe:
          setup: ["ReturnCase in INSPECTION, inspector booked 2026-08-01; ENGINE NON_COMPLIANT est 80000, INTERIOR NON_COMPLIANT est 5000"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-SM-5", model: "A320neo", manufacture_date: "2019-05-05" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-SM-5" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "AIRWORTHINESS_CERT", doc_reference: "AC-SM-5" }, as: LessorAdmin, captures: { d2: "$.data.id"} }
            - { call: "POST /leasing/documents/${d2}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "ENGINE_LOG", doc_reference: "EL-SM-5" }, as: LessorAdmin, captures: { d3: "$.data.id"} }
            - { call: "POST /leasing/documents/${d3}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "LLP_STATUS", doc_reference: "LLP-SM-5" }, as: LessorAdmin, captures: { d4: "$.data.id"} }
            - { call: "POST /leasing/documents/${d4}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "SM5 Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/initiate-return", payload: {}, as: LessorAdmin }
            - { call: "GET /leasing/leases/${lease}/return-cases", payload: {}, as: LessorAdmin, captures: { rc: "$.data[0].id"} }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "RECORDS_VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "INSPECTION" }, as: LessorAdmin }
            - { call: "POST /leasing/inspectors", payload: { full_name: "Iris Nspect", license_number: "LIC-SM-5" }, as: LessorAdmin, captures: { insp: "$.data.id"} }
            - { call: "POST /leasing/return-cases/${rc}/inspection-bookings", payload: { inspector_id: "${insp}", booking_date: "2026-08-01" }, as: LessorAdmin }
            - { call: "GET /leasing/return-cases/${rc}/checklist-items", payload: {}, as: LessorAdmin, captures: { it_air: "$.data[0].id", it_eng: "$.data[1].id", it_int: "$.data[2].id", it_pnt: "$.data[3].id"} }
            - { call: "POST /leasing/checklist-items/${it_eng}/inspect", payload: { outcome: "NON_COMPLIANT", rectification_cost_estimate_cents: 80000 }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/checklist-items/${it_int}/inspect", payload: { outcome: "NON_COMPLIANT", rectification_cost_estimate_cents: 5000 }, as: TechInspector, as_user_id: "${insp}" }
          trigger:
            - { call: "POST /leasing/checklist-items/${it_eng}/rectify", payload: {}, as: LesseeRep, as_user_id: "${les}", captures: { eng1: "$.data.status"} }
            - { call: "POST /leasing/checklist-items/${it_eng}/inspect", payload: { outcome: "NON_COMPLIANT", rectification_cost_estimate_cents: 90000 }, as: TechInspector, as_user_id: "${insp}", captures: { eng2: "$.data.status", eng2est: "$.data.rectification_cost_estimate_cents"} }
            - { call: "POST /leasing/checklist-items/${it_int}/waive", payload: { reason: "cosmetic only" }, as: LessorAdmin, captures: { intst: "$.data.status"} }
          assert:
            - "rectify moves ENGINE NON_COMPLIANT -> RECTIFIED"
            - "re-inspection of RECTIFIED with NON_COMPLIANT loops back to NON_COMPLIANT and overwrites the estimate to 90000"
            - "waive moves INTERIOR NON_COMPLIANT -> WAIVED (terminal)"

      - name: new_return_case_initial_state_and_template
        claim_type: initial_state
        grounds: [state_machines.ReturnCase, state_machines.ChecklistItem, entities.ChecklistItem.fields.severity]
        distinguishing_aspect: "initiate-return mints a ReturnCase in OPEN with zeroed negotiation counters and exactly the 4 template checklist items, all PENDING, sorted AIRFRAME, ENGINE, INTERIOR, PAINT."
        test_recipe:
          setup: ["ACTIVE lease"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-SM-6", model: "A321neo", manufacture_date: "2021-01-01" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-SM-6" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "SM6 Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
          trigger:
            - { call: "POST /leasing/leases/${lease}/initiate-return", payload: {}, as: LessorAdmin }
            - { call: "GET /leasing/leases/${lease}/return-cases", payload: {}, as: LessorAdmin, captures: { rc_st: "$.data[0].status", rounds: "$.data[0].round_count"} }
            - { call: "GET /leasing/leases/${lease}/return-cases", payload: {}, as: LessorAdmin, captures: { rc: "$.data[0].id"} }
            - { call: "GET /leasing/return-cases/${rc}/checklist-items", payload: {}, as: LessorAdmin }
          assert:
            - "ReturnCase initial state: status OPEN, round_count == 0, reinspection_count == 0, current_proposal_cents null"
            - "exactly 4 ChecklistItem rows exist, sorted item_code ASC: AIRFRAME(CRITICAL), ENGINE(MAJOR), INTERIOR(MINOR), PAINT(MINOR), all status PENDING"

      - name: cure_reverts_default_cycle
        claim_type: side_effect_execution
        grounds: [state_machines.DefaultCase.DECLARED_to_CURED, state_machines.Lease.DEFAULTED_to_ACTIVE]
        distinguishing_aspect: "Curing a default is the compensation revert of declaration: DefaultCase DECLARED -> CURED and Lease DEFAULTED -> ACTIVE; aircraft never leaves ON_LEASE."
        test_recipe:
          setup: ["ACTIVE lease with a declared DefaultCase (cure 30 days)"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-SM-7", model: "E195-E2", manufacture_date: "2022-02-02" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-SM-7" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "SM7 Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/default-cases", payload: { reason: "rent arrears", cure_period_days: 30 }, as: CreditOfficer, as_user_id: "cred_1", captures: { dc: "$.data.id", deadline: "$.data.cure_deadline"} }
          trigger:
            - { call: "POST /leasing/default-cases/${dc}/cure", payload: {}, as: CreditOfficer, as_user_id: "cred_1", captures: { dc_st: "$.data.status"} }
            - { call: "GET /leasing/leases/${lease}", payload: {}, as: LessorAdmin, captures: { lease_st: "$.data.status"} }
            - { call: "GET /leasing/aircraft/${ac}", payload: {}, as: LessorAdmin, captures: { ac_st: "$.data.status"} }
          assert:
            - "DefaultCase.cure_deadline == 2026-08-31T00:00:00Z (declared_at default clock 2026-08-01T00:00:00Z + 30 days)"
            - "after cure: DefaultCase.status == CURED and Lease.status == ACTIVE (revert)"
            - "Aircraft.status remained ON_LEASE throughout (declaration alone never touches the aircraft)"

      - name: authorize_repossession_before_cure_deadline_returns_error
        claim_type: precondition_enforcement
        grounds: [state_machines.DefaultCase.DECLARED_to_REPOSSESSION_AUTHORIZED, "errors[ERR_CURE_DEADLINE_NOT_PASSED]"]
        distinguishing_aspect: "The repossession gate is clock-strict: at or before cure_deadline authorization fails; strictly after it succeeds. Uses the logical clock, not wall time."
        test_recipe:
          setup: ["ACTIVE lease with DefaultCase declared at the default clock 2026-08-01T00:00:00Z with cure_period_days 30 (deadline 2026-08-31T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-SM-8", model: "B737-800", manufacture_date: "2011-11-11" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-SM-8" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "SM8 Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/default-cases", payload: { reason: "reserve shortfall", cure_period_days: 30 }, as: CreditOfficer, as_user_id: "cred_1", captures: { dc: "$.data.id"} }
          trigger:
            - { call: "POST /leasing/default-cases/${dc}/authorize-repossession", payload: {}, as: LegalApprover, as_user_id: "legal_1", captures: { err: "$.data.error_id"} }
            - { call: "POST /leasing/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: LessorAdmin }
            - { call: "POST /leasing/default-cases/${dc}/authorize-repossession", payload: {}, as: LegalApprover, as_user_id: "legal_1", captures: { st: "$.data.status"} }
          assert:
            - "authorization at clock 2026-08-01 (before deadline) rejected with ERR_CURE_DEADLINE_NOT_PASSED"
            - "after advancing the clock past the deadline, authorization succeeds: status == REPOSSESSION_AUTHORIZED"
  # =========================================================================
  # Section: calculations (Table 3 claims)
  # =========================================================================
  - section: calculations
    instances:
      - name: records_gate_three_of_four_blocked
        claim_type: violation_to_error
        grounds: [calculations.records_completeness_score, "errors[ERR_RECORDS_INCOMPLETE]"]
        distinguishing_aspect: "The records threshold is exact: 3 of 4 required doc types VERIFIED blocks advance to RECORDS_VERIFIED; verifying the 4th unblocks it."
        test_recipe:
          setup: ["aircraft with BIRTH_RECORD, AIRWORTHINESS_CERT, ENGINE_LOG verified (LLP_STATUS missing); ACTIVE lease; return initiated"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-CAL-1", model: "A320-200", manufacture_date: "2013-03-03" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-CAL-1" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "AIRWORTHINESS_CERT", doc_reference: "AC-CAL-1" }, as: LessorAdmin, captures: { d2: "$.data.id"} }
            - { call: "POST /leasing/documents/${d2}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "ENGINE_LOG", doc_reference: "EL-CAL-1" }, as: LessorAdmin, captures: { d3: "$.data.id"} }
            - { call: "POST /leasing/documents/${d3}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "CAL1 Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/initiate-return", payload: {}, as: LessorAdmin }
            - { call: "GET /leasing/leases/${lease}/return-cases", payload: {}, as: LessorAdmin, captures: { rc: "$.data[0].id"} }
          trigger:
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "RECORDS_VERIFIED" }, as: LessorAdmin, captures: { err: "$.data.error_id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "LLP_STATUS", doc_reference: "LLP-CAL-1" }, as: LessorAdmin, captures: { d4: "$.data.id"} }
            - { call: "POST /leasing/documents/${d4}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "RECORDS_VERIFIED" }, as: LessorAdmin, captures: { st: "$.data.status"} }
          assert:
            - "with 3 of 4 required types VERIFIED the advance is rejected with ERR_RECORDS_INCOMPLETE (score 0.75 < 1.0)"
            - "with all 4 VERIFIED the same advance succeeds: status == RECORDS_VERIFIED"

      - name: provisional_estimate_per_item_rounding_order
        claim_type: precision
        grounds: [calculations.return_compensation]
        distinguishing_aspect: "Rounding order is pinned per-item-then-sum: two MINOR items at 1005 cents each yield 1106 + 1106 = 2212, not round(2211.0) = 2211 as sum-then-round would give."
        test_recipe:
          setup: ["ReturnCase in INSPECTION; INTERIOR and PAINT NON_COMPLIANT with rectification_cost_estimate_cents 1005 each; AIRFRAME and ENGINE COMPLIANT"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-CAL-2", model: "B737-800", manufacture_date: "2010-12-12" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-CAL-2" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "AIRWORTHINESS_CERT", doc_reference: "AC-CAL-2" }, as: LessorAdmin, captures: { d2: "$.data.id"} }
            - { call: "POST /leasing/documents/${d2}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "ENGINE_LOG", doc_reference: "EL-CAL-2" }, as: LessorAdmin, captures: { d3: "$.data.id"} }
            - { call: "POST /leasing/documents/${d3}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "LLP_STATUS", doc_reference: "LLP-CAL-2" }, as: LessorAdmin, captures: { d4: "$.data.id"} }
            - { call: "POST /leasing/documents/${d4}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "CAL2 Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/initiate-return", payload: {}, as: LessorAdmin }
            - { call: "GET /leasing/leases/${lease}/return-cases", payload: {}, as: LessorAdmin, captures: { rc: "$.data[0].id"} }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "RECORDS_VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "INSPECTION" }, as: LessorAdmin }
            - { call: "POST /leasing/inspectors", payload: { full_name: "Iris Nspect", license_number: "LIC-CAL-2" }, as: LessorAdmin, captures: { insp: "$.data.id"} }
            - { call: "POST /leasing/return-cases/${rc}/inspection-bookings", payload: { inspector_id: "${insp}", booking_date: "2026-08-01" }, as: LessorAdmin }
            - { call: "GET /leasing/return-cases/${rc}/checklist-items", payload: {}, as: LessorAdmin, captures: { it_air: "$.data[0].id", it_eng: "$.data[1].id", it_int: "$.data[2].id", it_pnt: "$.data[3].id"} }
            - { call: "POST /leasing/checklist-items/${it_air}/inspect", payload: { outcome: "COMPLIANT" }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/checklist-items/${it_eng}/inspect", payload: { outcome: "COMPLIANT" }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/checklist-items/${it_int}/inspect", payload: { outcome: "NON_COMPLIANT", rectification_cost_estimate_cents: 1005 }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/checklist-items/${it_pnt}/inspect", payload: { outcome: "NON_COMPLIANT", rectification_cost_estimate_cents: 1005 }, as: TechInspector, as_user_id: "${insp}" }
          trigger:
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "NEGOTIATION" }, as: LessorAdmin, captures: { prov: "$.data.provisional_estimate_cents"} }
          assert:
            - "provisional_estimate_cents == 2212 (round_half_up(1005 x 1.10) = 1106 per item, then 1106 + 1106)"
            - "sum-then-round would give 2211 — the pinned per-item-first order is the only accepted result"

      - name: monthly_charge_excludes_non_accepted_reports
        claim_type: input_set_filtering
        grounds: [calculations.monthly_lease_charge]
        distinguishing_aspect: "The charge input set includes only ACCEPTED reports: a merely SUBMITTED report for the month contributes zero hours and zero cycles."
        test_recipe:
          setup: ["ACTIVE lease rent 1000000 cap 300; report 2026-08 of 400.0 h / 500 cycles left in SUBMITTED (never accepted)"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-CAL-3", model: "A321neo", manufacture_date: "2020-08-08" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-CAL-3" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "CAL3 Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/utilization-reports", payload: { period_month: "2026-08", flight_hours: 400.0, flight_cycles: 500 }, as: LesseeRep, as_user_id: "${les}" }
          trigger:
            - { call: "GET /leasing/leases/${lease}/monthly-charge", payload: { month: "2026-08" }, as: LessorAdmin, captures: { tot: "$.data.total_cents", ovg: "$.data.overage_cents", sur: "$.data.cycle_surcharge_cents", hrs: "$.data.hours"} }
          assert:
            - "hours == 0 and overage_cents == 0 and cycle_surcharge_cents == 0 because the SUBMITTED report is excluded from the input set"
            - "total_cents == 1000000 (base rent only)"

      - name: accrual_minimum_guarantee_above_minimum_uses_actual
        claim_type: variant_selection
        grounds: [calculations.maintenance_reserve_accrual]
        distinguishing_aspect: "MINIMUM_GUARANTEE selects max(reported, minimum): a 200.0 h report against a 150 h minimum accrues on the reported 200.0 h, so both variants coincide at 1000000 cents — variant context, not always-divergence."
        test_recipe:
          setup: ["ACTIVE lease with accrual_basis MINIMUM_GUARANTEE, minimum_monthly_hours 150; report 200.0 h / 25 cycles accepted"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-CAL-4", model: "A330-900", manufacture_date: "2021-09-09" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-CAL-4" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "CAL4 Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300, accrual_basis: "MINIMUM_GUARANTEE", minimum_monthly_hours: 150 }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/utilization-reports", payload: { period_month: "2026-08", flight_hours: 200.0, flight_cycles: 25 }, as: LesseeRep, as_user_id: "${les}", captures: { rep: "$.data.id"} }
          trigger:
            - { call: "POST /leasing/utilization-reports/${rep}/review", payload: { decision: "ACCEPT" }, as: LessorAdmin, captures: { posted: "$.data.posted_accrual_cents"} }
          assert:
            - "posted_accrual_cents == 1000000 (max(200.0, 150) x 4000 + 25 x 8000 = 800000 + 200000) — reported hours above the minimum are used as-is"

      - name: reserve_accrual_dual_variants
        claim_type: violation_to_error
        grounds: [calculations.maintenance_reserve_accrual]
        excluded_because:
          difficulty_instance: reserve_accrual_actual_vs_minimum_guarantee
          rationale: "Both variants asserted with literal divergence in the named difficulty instance."

      - name: return_compensation_dual_variants
        claim_type: violation_to_error
        grounds: [calculations.return_compensation]
        excluded_because:
          difficulty_instance: return_compensation_provisional_vs_final
          rationale: "Provisional vs final variant divergence asserted in the named difficulty instance."
  # =========================================================================
  # Section: validations (Table 4 claims)
  # =========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call without X-User-Role/X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-VAL-1", model: "A320-200", manufacture_date: "2012-01-01" }, as: Anonymous, captures: { err: "$.data.error_id"} }
          assert:
            - "error_id == ERR_UNAUTHENTICATED with http 401"

      - name: duplicate_report_period_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_REPORT_PERIOD]"]
        distinguishing_aspect: "(lease_id, period_month) uniqueness holds among non-VOIDED reports: a second submission for the same month is rejected."
        test_recipe:
          setup: ["ACTIVE lease; one SUBMITTED report for 2026-08"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-VAL-2", model: "A320-200", manufacture_date: "2012-02-02" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-VAL-2" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "VAL2 Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/utilization-reports", payload: { period_month: "2026-08", flight_hours: 100.0, flight_cycles: 20 }, as: LesseeRep, as_user_id: "${les}" }
          trigger:
            - { call: "POST /leasing/leases/${lease}/utilization-reports", payload: { period_month: "2026-08", flight_hours: 50.0, flight_cycles: 10 }, as: LesseeRep, as_user_id: "${les}", captures: { err: "$.data.error_id"} }
          assert:
            - "second report for 2026-08 rejected with ERR_DUPLICATE_REPORT_PERIOD"

      - name: proposer_alternation_double_lessor_proposal
