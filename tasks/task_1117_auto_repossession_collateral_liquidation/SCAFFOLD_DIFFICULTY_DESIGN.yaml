  - rule_id: boundary_precision_check
    instances:
      - name: cure_payment_exactly_at_deadline
        grounds:
          - validations[priority=5]
          - state_machines.RecoveryCase.CURE_PENDING_to_CURED
          - state_machines.RecoveryCase.CURE_PENDING_to_CURE_EXPIRED
        distinguishing_aspect: |
          Timestamp metric on POST /recovery-cases/{id}/cure-payments: the deadline rule
          is now <= cure_deadline, so a full payment at exactly 2026-05-15T00:00:00Z CURES
          the case; one second later (2026-05-15T00:00:01Z) the same clock advance eagerly
          auto-transitions the second case to CURE_EXPIRED, and the identical payment is
          rejected ERR_INVALID_CASE_STATE — one second flips both the deadline comparison
          and the case state.
        test_recipe:
          setup:
            - "Two identical cases (loans of 2,000,000c principal; costs 39,500c; cure amount 186,500c), both CURE_PENDING with cure_deadline 2026-05-15T00:00:00Z"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "T1", state_code: "CA", email: "t1@x.com" }, as: RecoveryManager, captures: { b1: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b1}", vin: "VIN00000000000021", governing_state_code: "CA", principal_balance_cents: 2000000, apr_bps: 1200, monthly_payment_cents: 45000, missed_installments: 3, accrued_interest_cents: 60000, late_fees_cents: 12000 }, as: RecoveryManager, captures: { l1: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l1}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c1: $.data.id, c1_v: $.data.version } }
            - { call: "POST /recovery-cases/${c1}/ledger-entries", payload: { kind: "COST_REPO_FEE", amount_cents: 35000 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c1}/ledger-entries", payload: { kind: "COST_STORAGE", amount_cents: 4500 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c1}/cure-notices", payload: { expected_recovery_case_version: "${c1_v}" }, as: RecoveryManager }
            - { call: "POST /borrowers", payload: { full_name: "T2", state_code: "CA", email: "t2@x.com" }, as: RecoveryManager, captures: { b2: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b2}", vin: "VIN00000000000022", governing_state_code: "CA", principal_balance_cents: 2000000, apr_bps: 1200, monthly_payment_cents: 45000, missed_installments: 3, accrued_interest_cents: 60000, late_fees_cents: 12000 }, as: RecoveryManager, captures: { l2: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l2}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c2: $.data.id, c2_v: $.data.version } }
            - { call: "POST /recovery-cases/${c2}/ledger-entries", payload: { kind: "COST_REPO_FEE", amount_cents: 35000 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c2}/ledger-entries", payload: { kind: "COST_STORAGE", amount_cents: 4500 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c2}/cure-notices", payload: { expected_recovery_case_version: "${c2_v}" }, as: RecoveryManager }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c1}/cure-payments", payload: { amount_cents: 186500 }, as: Borrower, as_user_id: "${b1}" }
            - { call: "GET /recovery-cases/${c1}", payload: {}, as: RecoveryManager, captures: { c1_st: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:01Z" }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c2}/cure-payments", payload: { amount_cents: 186500 }, as: Borrower, as_user_id: "${b2}", captures: { err: $.data.error_id } }
          assert:
            - "c1_st == CURED                 (payment at exactly the deadline is in-window: now <= cure_deadline holds)"
            - "err == ERR_INVALID_CASE_STATE  (at +1s the clock-set has already moved case 2 to CURE_EXPIRED, so the payment fails the state gate)"
            - "RecoveryCase.${c2}.status == CURE_EXPIRED and its CureNotice is EXPIRED"
      - name: bid_exactly_at_reserve
        grounds:
          - validations[priority=9]
          - state_machines.Consignment.LISTED_to_SOLD
        distinguishing_aspect: |
          Money metric on POST /consignments/{id}/report-sale (a different metric and
