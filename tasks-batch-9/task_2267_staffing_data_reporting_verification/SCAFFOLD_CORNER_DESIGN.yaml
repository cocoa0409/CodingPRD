      - name: hprd_variant_divergence_delta
        claim_type: variant_divergence
        grounds:
          - calculations.hprd_reconciliation.variants
        excluded_because:
          difficulty_instance: hprd_as_submitted_vs_audit_adjusted_divergence
          rationale: "That §1.8 instance already builds one submission whose as_submitted and audit_adjusted reads diverge on both the numerator filter and the denominator source, and asserts both sides plus the delta with author-computed literals (4.0000 versus 1.8750 and 3.0000 versus 0.0000); a second divergence corner would duplicate it."

      - name: hprd_input_set_excludes_void_entries
        claim_type: input_set_filtering
        grounds:
          - calculations.hprd_reconciliation.input_set
          - calculations.submission_hour_census_rollup.input_set
        excluded_because:
          difficulty_instance: hour_entry_orthogonal_void_and_verification_dimensions
          rationale: "That §1.8 instance drives the entry_status and verification_status dimensions independently and asserts which rollup and variant input sets each VOID or SUPPORTED entry lands in, which is exactly the input-set filtering claim for both calculations."

      - name: measure_reconciliation_on_variant_switch
        claim_type: reconciliation
        grounds:
          - calculations.hprd_reconciliation.variants
          - calculations.staffing_rating_assignment
        excluded_because:
          difficulty_instance: substantiation_cascade_sanctions_facility_and_reverts_other_submission
          rationale: "The only variant switch in the domain is the AUDIT_REVISED recompute driven by case substantiation, and that §1.8 instance already asserts the recomputed hprd, the re-derived points, the new staffing_rating, and the refreshed Facility.latest_staffing_rating after the switch."

      - name: staffing_rating_tier_boundary_lookup
        claim_type: constants_applied
        grounds:
          - calculations.staffing_rating_assignment.constants
        excluded_because:
          difficulty_instance: total_nurse_hprd_exactly_at_five_star_tier_floor
          rationale: "That §1.8 instance sits total_nurse_hprd exactly on TOTAL_TIER_5 and one ten-thousandth below it, which is the tiered_pricing boundary claim for the rating constants; repeating a mid-tier constants check would add no discrimination."

      - name: census_variance_tolerance_constant
        claim_type: constants_applied
        grounds:
          - calculations.census_variance_reconciliation.constants
        excluded_because:
          difficulty_instance: census_variance_exactly_at_tolerance_reconciles
          rationale: "That §1.8 instance pins CENSUS_VARIANCE_TOLERANCE by reconciling at exactly 0.0500 and disputing at 0.0600, covering both the constant and its inclusive comparison."

      - name: implausible_hprd_constant_applied
        claim_type: constants_applied
        grounds:
          - calculations.hprd_reconciliation.constants
        excluded_because:
          difficulty_instance: vendor_batch_accept_cascade_flips_submission_back_to_draft
          rationale: "That §1.8 instance drives hprd to 18.0000 through a vendor batch acceptance and asserts the resulting HPRD_IMPLAUSIBLE FATAL finding against MAX_PLAUSIBLE_HPRD 12.0000."

      - name: allocation_waterfall_rounding_order
        claim_type: correct_result
        grounds:
          - calculations.hour_entry_classification.formula
        excluded_because:
          difficulty_instance: allocation_rounding_per_line_before_sum
          rationale: "That §1.8 instance pins the waterfall order and the per-line-before-sum rounding with the 45.00/27.50/27.50 split, asserting 4.62 against the incorrect sum-then-round 4.61."

      - name: audit_support_score_weight_composition
        claim_type: correct_result
        grounds:
          - calculations.audit_support_score.formula
        excluded_because:
          difficulty_instance: audit_support_score_sampled_vs_full_population
          rationale: "That §1.8 instance computes the full weighted sum twice over the same submission (64.17 sampled against 70.00 full population), which covers the weight composition and the AUDIT_RISK_FLOOR comparison."

  - section: validations
    instances:
      - name: hour_entry_temporal_boundary_violations_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 36 ERR_WORK_DATE_OUTSIDE_PERIOD]
          - validations[priority 37 ERR_WORK_DATE_BEFORE_HIRE]
          - validations[priority 38 ERR_SHIFT_WINDOW_INVALID]
        distinguishing_aspect: "Three independent temporal guards on POST /hour-entries each map to their own error: the period window, the worker's hire date, and the ordering of the shift endpoints."
        test_recipe:
          setup:
            - "A DRAFT 2026Q2 submission for the April 2026 period, an RN worker hired 2026-01-01, and a second RN worker hired 2026-04-15"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - call: "POST /workers"
              payload: { facility_id: "${fac}", full_name: "Skye Latehire", worker_type: "EMPLOYEE", primary_job_category_id: "${jc_rn}", hire_date: "2026-04-15", authorized_roles: [] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { w_late: $.data.id }
          trigger:
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-05-01", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_late}", job_category_id: "${jc_rn}", work_date: "2026-04-10", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-02", shift_start: "15:00", shift_end: "07:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "the 2026-05-01 call returns 422 with data.error_id == ERR_WORK_DATE_OUTSIDE_PERIOD, since the period is 2026-04-01 through 2026-04-30 inclusive"
            - "the 2026-04-10 call returns 422 with data.error_id == ERR_WORK_DATE_BEFORE_HIRE, since Skye Latehire was hired 2026-04-15"
            - "the 15:00 to 07:00 call returns 422 with data.error_id == ERR_SHIFT_WINDOW_INVALID, since shift_end must be strictly later than shift_start on the same work_date"
            - "GET /hour-entries with submission_id ${sub} returns total_count == 0 and QuarterlySubmission.${sub}.version is still 1"

      - name: hour_entry_allocation_sum_and_daily_cap_violations_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 49 ERR_ALLOCATION_SUM_INVALID]
          - validations[priority 51 ERR_DAILY_HOURS_EXCEEDED]
        distinguishing_aspect: "Aggregate validation: each shift is individually inside MAX_SHIFT_HOURS 16.00 and neither overlaps the other, yet together they push one worker past MAX_REPORTED_HOURS_PER_WORKER_DAY 20.00 on a single date."
        test_recipe:
          setup:
            - "A DRAFT 2026Q2 submission with one accepted 16.00-hour RN shift from 00:00 to 16:00 on 2026-04-02"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-02", shift_start: "00:00", shift_end: "16:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { long1: $.data.id, lv1: $.data.submission_version }
          trigger:
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-03", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 60.00 }, { job_category_id: "${jc_split}", percent: 30.00 }], expected_submission_version: "${lv1}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-02", shift_start: "16:00", shift_end: "21:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${lv1}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "HourEntry.${long1}.raw_hours == 16.00, which does not exceed MAX_SHIFT_HOURS 16.00, so the setup call succeeded"
            - "the 60.00 plus 30.00 call returns 422 with data.error_id == ERR_ALLOCATION_SUM_INVALID, since the percents sum to 90.00 rather than exactly 100.00"
            - "the 16:00 to 21:00 call returns 422 with data.error_id == ERR_DAILY_HOURS_EXCEEDED, since 16.00 + 5.00 == 21.00 exceeds MAX_REPORTED_HOURS_PER_WORKER_DAY 20.00"
            - "the 16:00 to 21:00 call is not rejected with ERR_SHIFT_OVERLAP, because [00:00, 16:00) and [16:00, 21:00) only touch at an endpoint"
            - "QuarterlySubmission.${sub}.total_raw_hours == 16.00 and version == ${lv1}, so neither refused call applied a change"

      - name: allocation_percents_summing_to_exactly_one_hundred_pass
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority 49 ERR_ALLOCATION_SUM_INVALID]
          - calculations.hour_entry_classification
        distinguishing_aspect: "A three-way split of 33.34 / 33.33 / 33.33 sums to exactly 100.00 and must be accepted, with the per-line rounding producing 4.27 direct care hours against 3.73 excluded."
        test_recipe:
          setup:
            - "A DRAFT 2026Q2 submission and the RN, RN_ADMIN, and ADMIN job categories with credits 1.00, 0.60 and 0.00"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
          trigger:
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-07", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 33.34 }, { job_category_id: "${jc_split}", percent: 33.33 }, { job_category_id: "${jc_admin}", percent: 33.33 }], expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e3way: $.data.id }
          assert:
            - "response code is 201 and no ERR_ALLOCATION_SUM_INVALID is raised, since 33.34 + 33.33 + 33.33 == 100.00 exactly"
            - "HourEntry.${e3way}.raw_hours == 8.00 and direct_care_hours == 4.27, from 2.67 + 1.60 + 0.00 with each line rounded before the sum"
            - "HourEntry.${e3way}.excluded_hours == 3.73 and rn_hours == 4.27, since both credited categories are nurse_group RN"
            - "HourEntry.${e3way}.allocation_revision == 0"

      - name: payroll_capacity_document_ref_and_support_violations_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 41 ERR_PAYROLL_CAPACITY_EXCEEDED]
          - validations[priority 59 ERR_DUPLICATE_DOCUMENT_REF]
          - validations[priority 46 ERR_PAYROLL_SUPPORT_MISMATCH]
        distinguishing_aspect: "One existing two-day payroll record of 47.00 hours drives three different rejections: an aggregate capacity breach over the intersecting interval union, a duplicate document_ref within the facility, and an hour entry whose work_date falls outside the referenced record's pay period."
        test_recipe:
          setup:
            - "A DRAFT 2026Q2 submission and one PayrollRecord for the RN worker covering 2026-04-01 through 2026-04-02 with 47.00 paid hours, just inside the 2 days times MAX_HOURS_PER_DAY 24.00 ceiling of 48.00"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - call: "POST /payroll-records"
              payload: { facility_id: "${fac}", worker_id: "${w_rn}", pay_period_start: "2026-04-01", pay_period_end: "2026-04-02", paid_hours: 47.00, support_type: "PAYROLL_JOURNAL", document_ref: "PJ-APR-01" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { prx: $.data.id }
          trigger:
            - call: "POST /payroll-records"
              payload: { facility_id: "${fac}", worker_id: "${w_rn}", pay_period_start: "2026-04-02", pay_period_end: "2026-04-02", paid_hours: 20.00, support_type: "TIMECARD", document_ref: "TC-APR-02" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /payroll-records"
              payload: { facility_id: "${fac}", worker_id: "${w_rn}", pay_period_start: "2026-04-10", pay_period_end: "2026-04-10", paid_hours: 8.00, support_type: "TIMECARD", document_ref: "PJ-APR-01" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-05", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], payroll_record_id: "${prx}", expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "the 2026-04-02 single-day record returns 422 with data.error_id == ERR_PAYROLL_CAPACITY_EXCEEDED, since 47.00 + 20.00 == 67.00 exceeds 24.00 times the 2 distinct days in the union 2026-04-01 through 2026-04-02"
            - "the 2026-04-10 record returns 422 with data.error_id == ERR_DUPLICATE_DOCUMENT_REF, not a capacity error, because its interval does not intersect the existing record"
            - "the hour entry returns 422 with data.error_id == ERR_PAYROLL_SUPPORT_MISMATCH, since 2026-04-05 is outside the record's 2026-04-01 through 2026-04-02 pay period"
            - "GET /payroll-records with worker_id ${w_rn} returns total_count == 1"

      - name: census_and_submission_duplicate_and_scope_violations_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 53 ERR_DUPLICATE_CENSUS_DAY]
          - validations[priority 54 ERR_CENSUS_DATE_OUTSIDE_PERIOD]
          - validations[priority 52 ERR_DUPLICATE_SUBMISSION]
        distinguishing_aspect: "Uniqueness is scoped: census_date is unique inside one submission, and a facility may hold at most one non-VOID submission per reporting period."
        test_recipe:
          setup:
            - "A DRAFT 2026Q2 submission with one census day on 2026-04-01"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - *k_census_0401
          trigger:
            - call: "POST /census-days"
              payload: { submission_id: "${sub}", census_date: "2026-04-01", resident_count: 7, mds_resident_count: 7 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /census-days"
              payload: { submission_id: "${sub}", census_date: "2026-05-05", resident_count: 7, mds_resident_count: 7 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
