              as: BedManager
              captures: { adm: $.data.id }
          trigger:
            - call: "POST /cc/admissions/${adm}/confirm-discharge"
              payload: {}
              as: BedManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_ADMISSION_INVALID_STATE"
            - "Admission.${adm}.status remains ADMITTED"

      - name: diversion_lift_twice_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DIVERSION_INVALID_STATE]"]
        distinguishing_aspect: "lift requires ACTIVE; a second lift after a successful one fails ERR_DIVERSION_INVALID_STATE."
        test_recipe:
          setup: ["Clock at 00:00; facility; diversion declared by hs_1 at 00:00 over [00:00, 04:00); clock at 01:00 (past min duration)"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "DIS Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
