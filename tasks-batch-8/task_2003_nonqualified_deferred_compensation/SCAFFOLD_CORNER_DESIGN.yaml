# =============================================================================
# Task 2003 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe: every testable claim of §1.1–§1.7 not already covered by §1.8.
# Sections follow references/claim-extraction-guide.md.
# All chains replay from empty-DB; logical clock default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: plan_create_applies_defaults
        claim_type: defaults
        grounds: ["entities.Plan"]
        distinguishing_aspect: "Omitting every optional field yields defaults: six_month_delay_enabled=true, rabbi_trust_required=false, accelerate_on_cic=false, separation_fraction_test=DEFAULT_50, vesting_cliff_years=3, processing_lag_days=30; system fields status=DRAFT, document_posture=COMPLIANT, open_findings_count=0, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan DEF", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION", "FIXED_TIME"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
          trigger:
            - call: "GET /api/plans/${plan_id}"
              as: PlanSponsor
              captures: { p: $.data }
          assert:
            - "${p}.six_month_delay_enabled == true and ${p}.rabbi_trust_required == false and ${p}.accelerate_on_cic == false"
            - "${p}.separation_fraction_test == DEFAULT_50 and ${p}.vesting_cliff_years == 3 and ${p}.processing_lag_days == 30"
            - "${p}.status == DRAFT and ${p}.document_posture == COMPLIANT and ${p}.open_findings_count == 0 and ${p}.version == 1"
      - name: plan_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Plan", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required officer_comp_threshold_cents fails with ERR_INVALID_REQUEST (400); no Plan row is created."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/plans"
              payload: { name: "Plan BAD", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"] }
              as: PlanSponsor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /api/plans returns total_count == 0"
      - name: plan_get_not_found_returns_404
        claim_type: not_found
        grounds: ["entities.Plan", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns ERR_NOT_FOUND (404) in the standard error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/plans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlanSponsor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND"
      - name: participant_create_initializes_computed_fields
        claim_type: creation
        grounds: ["entities.Participant"]
        distinguishing_aspect: "Creation succeeds (201) with computed fields initialized: status=ACTIVE, is_specified_employee=false, inclusion_liability_cents=0, separation_date=null."
        test_recipe:
          setup: ["ACTIVE plan"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan P", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
          trigger:
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-1", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { participant_id: $.data.id, status: $.data.status, spec: $.data.is_specified_employee, liab: $.data.inclusion_liability_cents }
          assert:
            - "${status} == ACTIVE and ${spec} == false and ${liab} == 0"
      - name: ledger_entry_has_no_version_field_immutable
        claim_type: immutability
        grounds: ["entities.AccountLedgerEntry"]
        distinguishing_aspect: "AccountLedgerEntry declares common_fields: false — entries carry id and created_at only; no version/updated_at keys exist and no update endpoint is declared for the ledger."
        test_recipe:
          setup: ["funded account: plan ACTIVE, fund, window 2027, participant, account, election submitted+locked, one post-deferral of 100000 (PENDING)"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan LE", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
            - call: "POST /api/notional-funds"
              payload: { plan_id: "${plan_id}", ticker: "FIX5", crediting_mode: "FIXED_RATE", annual_rate_bp: 500 }
              as: PlanSponsor
              captures: { fund_id: $.data.id }
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2027, general_open_date: "2026-10-01", general_close_date: "2026-12-31", expected_plan_version: "${plan_v}" }
              as: PlanSponsor
              captures: { window_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-LE", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { participant_id: $.data.id }
            - call: "POST /api/accounts"
              payload: { participant_id: "${participant_id}", plan_id: "${plan_id}" }
              as: BenefitsAdministrator
              captures: { account_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections"
              payload: { participant_id: "${participant_id}", election_window_id: "${window_id}", election_type: "GENERAL", deferral_percent_bp: 5000, notional_fund_id: "${fund_id}" }
              as: Participant
              as_user_id: "${participant_id}"
              captures: { election_id: $.data.id }
            - call: "POST /api/deferral-elections/${election_id}/submit"
              as: Participant
              as_user_id: "${participant_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections/${election_id}/post-deferral"
              payload: { amount_cents: 100000, service_period_start: "2027-01-01", service_period_end: "2027-01-31" }
              as: BenefitsAdministrator
          trigger:
            - call: "GET /api/ledger-entries?election_id=${election_id}"
              as: BenefitsAdministrator
          assert:
            - "exactly 1 entry returned; entry.entry_type == DEFERRAL_CREDIT and entry.entry_status == PENDING and entry.amount_cents == 100000"
            - "entry carries id and created_at; entry has NO version and NO updated_at key (common_fields: false)"
      - name: plan_create_id_version_input_ignored
        claim_type: system_fields
        grounds: ["entities.Plan"]
        distinguishing_aspect: "Client-supplied id and version in the create body are ignored: server mints its own UUID id and sets version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/plans"
              payload: { name: "Plan SYS", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000, id: "00000000-0000-4000-8000-000000000000", version: 99 }
              as: PlanSponsor
              captures: { plan_id: $.data.id, plan_v: $.data.version }
          assert:
            - "${plan_v} == 1 and ${plan_id} is a server-minted UUID (client-injected id/version fields are never echoed)"
      - name: participants_list_pagination_defaults
        claim_type: listing
        grounds: ["entities.Participant", "response_envelope"]
        distinguishing_aspect: "With 12 participants, the default page (no params) returns limit=10 semantics: 10 items, total_count=12, has_more=true; offset=10 returns the remaining 2 with has_more=false."
        test_recipe:
          setup: ["ACTIVE plan with 12 participants EMP-P01..EMP-P12"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan PG", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-P01", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-P02", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-P03", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-P04", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-P05", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-P06", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-P07", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-P08", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-P09", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-P10", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-P11", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-P12", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
          trigger:
            - call: "GET /api/participants?plan_id=${plan_id}"
              as: BenefitsAdministrator
            - call: "GET /api/participants?plan_id=${plan_id}&offset=10"
              as: BenefitsAdministrator
          assert:
            - "first page: 10 items, total_count == 12, has_more == true"
            - "second page (offset=10): 2 items, total_count == 12, has_more == false"
      - name: account_create_duplicate_rejected
        claim_type: parent_relationships
        grounds: ["entities.Account", "errors[ERR_ACCOUNT_EXISTS]"]
        distinguishing_aspect: "A second Account for the same (participant_id, plan_id) pair is rejected with ERR_ACCOUNT_EXISTS (409); the first account is untouched."
        test_recipe:
          setup: ["ACTIVE plan, participant, one account already created"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan AD", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-AD", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { participant_id: $.data.id }
            - call: "POST /api/accounts"
              payload: { participant_id: "${participant_id}", plan_id: "${plan_id}" }
              as: BenefitsAdministrator
              captures: { account_id: $.data.id }
          trigger:
            - call: "POST /api/accounts"
              payload: { participant_id: "${participant_id}", plan_id: "${plan_id}" }
              as: BenefitsAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ACCOUNT_EXISTS"
            - "GET /api/accounts?participant_id=${participant_id} returns exactly 1 row (${account_id})"
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: election_void_after_lock_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.DeferralElection", "errors[ERR_ELECTION_NOT_MODIFIABLE]"]
        distinguishing_aspect: "void requires DRAFT|SUBMITTED; a LOCKED election (window closed) is irrevocable — void returns ERR_ELECTION_NOT_MODIFIABLE and the election stays LOCKED."
        test_recipe:
          setup: ["ACTIVE plan; window 2027 closed by clock at 2027-01-01; participant election SUBMITTED inside window, now LOCKED"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan VL", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
            - call: "POST /api/notional-funds"
              payload: { plan_id: "${plan_id}", ticker: "FIX5", crediting_mode: "FIXED_RATE", annual_rate_bp: 500 }
              as: PlanSponsor
              captures: { fund_id: $.data.id }
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2027, general_open_date: "2026-10-01", general_close_date: "2026-12-31", expected_plan_version: "${plan_v}" }
              as: PlanSponsor
              captures: { window_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-VL", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { participant_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections"
              payload: { participant_id: "${participant_id}", election_window_id: "${window_id}", election_type: "GENERAL", deferral_percent_bp: 5000, notional_fund_id: "${fund_id}" }
              as: Participant
              as_user_id: "${participant_id}"
              captures: { election_id: $.data.id }
            - call: "POST /api/deferral-elections/${election_id}/submit"
              as: Participant
              as_user_id: "${participant_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/deferral-elections/${election_id}/void"
              as: Participant
              as_user_id: "${participant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ELECTION_NOT_MODIFIABLE"
            - "DeferralElection.${election_id}.status == LOCKED and locked_at == 2027-01-01T00:00:00Z"
      - name: distribution_pay_twice_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.DistributionRequest", "errors[ERR_DISTRIBUTION_NOT_PAYABLE]"]
        distinguishing_aspect: "PAID is terminal: a second pay on the same request fails with ERR_DISTRIBUTION_NOT_PAYABLE and no second DISTRIBUTION_DEBIT entry is posted."
        test_recipe:
          setup: ["vested participant, account with 100000 settled, FIXED_TIME request verified+scheduled, clock at fixed date, request paid once"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan PT", effective_date: "2026-01-01", distribution_events_allowed: ["FIXED_TIME"], officer_comp_threshold_cents: 20000000, vesting_cliff_years: 3 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
            - call: "POST /api/notional-funds"
              payload: { plan_id: "${plan_id}", ticker: "FIX5", crediting_mode: "FIXED_RATE", annual_rate_bp: 500 }
              as: PlanSponsor
              captures: { fund_id: $.data.id }
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2027, general_open_date: "2026-10-01", general_close_date: "2026-12-31", expected_plan_version: "${plan_v}" }
              as: PlanSponsor
              captures: { window_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-PT", hire_date: "2023-08-03", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { participant_id: $.data.id }
            - call: "POST /api/accounts"
              payload: { participant_id: "${participant_id}", plan_id: "${plan_id}" }
              as: BenefitsAdministrator
              captures: { account_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections"
              payload: { participant_id: "${participant_id}", election_window_id: "${window_id}", election_type: "GENERAL", deferral_percent_bp: 5000, notional_fund_id: "${fund_id}" }
              as: Participant
              as_user_id: "${participant_id}"
              captures: { election_id: $.data.id }
            - call: "POST /api/deferral-elections/${election_id}/submit"
              as: Participant
              as_user_id: "${participant_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections/${election_id}/post-deferral"
              payload: { amount_cents: 100000, service_period_start: "2027-01-01", service_period_end: "2027-01-31" }
              as: BenefitsAdministrator
            - call: "POST /api/accounts/${account_id}/settle-entries"
              as: BenefitsAdministrator
            - call: "POST /api/distribution-requests"
              payload: { account_id: "${account_id}", event_type: "FIXED_TIME", fixed_date: "2027-06-01", requested_amount_cents: 40000 }
              as: Participant
              as_user_id: "${participant_id}"
              captures: { req_id: $.data.id }
            - call: "POST /api/distribution-requests/${req_id}/verify-event"
              as: ComplianceOfficer
            - call: "POST /api/distribution-requests/${req_id}/schedule"
              as: BenefitsAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/distribution-requests/${req_id}/pay"
              as: BenefitsAdministrator
              captures: { paid_status: $.data.status }
          trigger:
            - call: "POST /api/distribution-requests/${req_id}/pay"
              as: BenefitsAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "${paid_status} == PAID"
            - "${err} == ERR_DISTRIBUTION_NOT_PAYABLE (PAID is terminal)"
            - "exactly 1 DISTRIBUTION_DEBIT entry exists for distribution_request_id == ${req_id}"
      - name: window_close_locks_submitted_and_expires_draft
        claim_type: side_effect_execution
        grounds: ["state_machines.ElectionWindow.OPEN_to_CLOSED", "state_machines.DeferralElection"]
        distinguishing_aspect: "The CLOSE sweep applies both side effects of the window transition: the SUBMITTED election locks (locked_at set) and the still-DRAFT election expires — two different election outcomes from one window transition."
        test_recipe:
          setup: ["ACTIVE plan, window 2027 open at 2026-10-15; participants P1 (election submitted) and P2 (election left in DRAFT)"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan WC", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
            - call: "POST /api/notional-funds"
              payload: { plan_id: "${plan_id}", ticker: "FIX5", crediting_mode: "FIXED_RATE", annual_rate_bp: 500 }
              as: PlanSponsor
              captures: { fund_id: $.data.id }
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2027, general_open_date: "2026-10-01", general_close_date: "2026-12-31", expected_plan_version: "${plan_v}" }
              as: PlanSponsor
              captures: { window_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-W1", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-W2", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { p2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections"
              payload: { participant_id: "${p1_id}", election_window_id: "${window_id}", election_type: "GENERAL", deferral_percent_bp: 5000, notional_fund_id: "${fund_id}" }
              as: Participant
              as_user_id: "${p1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /api/deferral-elections/${e1_id}/submit"
              as: Participant
              as_user_id: "${p1_id}"
            - call: "POST /api/deferral-elections"
              payload: { participant_id: "${p2_id}", election_window_id: "${window_id}", election_type: "GENERAL", deferral_percent_bp: 2500, notional_fund_id: "${fund_id}" }
              as: Participant
              as_user_id: "${p2_id}"
              captures: { e2_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
