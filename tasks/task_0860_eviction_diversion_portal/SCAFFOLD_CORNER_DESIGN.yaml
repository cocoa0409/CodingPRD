# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# Logical-clock startup default: 2026-05-01T00:00:00Z
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: case_create_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Case, endpoints]
        distinguishing_aspect: "POST /cases with all required fields returns 201, status FILED, outcome PENDING, net_arrears_cents == claimed_arrears_cents."
        test_recipe:
          setup: ["A court, landlord, tenant exist"]
          setup_api_calls:
            - call: "POST /courts"
              payload: { name: "HC", jurisdiction_code: "J1", hearing_daily_capacity: 2 }
              as: Clerk
              captures: { court_id: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { court_id: "${court_id}", landlord_id: "${ll_id}", tenant_id: "${tn_id}", filing_type: "NONPAYMENT", claimed_arrears_cents: 400000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { case_id: $.data.id }
          assert:
            - "Case.${case_id}.status == FILED"
            - "Case.${case_id}.outcome == PENDING"
            - "Case.${case_id}.net_arrears_cents == 400000"
            - "Case.${case_id}.sealed == false"

      - name: case_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Case, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /cases with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cases/00000000-0000-0000-0000-000000000000"
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: case_create_missing_filing_type_returns_validation
        claim_type: Required Fields
        grounds: [entities.Case.fields.filing_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /cases omitting the required filing_type returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A court, landlord, tenant exist"]
          setup_api_calls:
            - call: "POST /courts"
              payload: { name: "HC", jurisdiction_code: "J1", hearing_daily_capacity: 2 }
              as: Clerk
              captures: { court_id: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { court_id: "${court_id}", landlord_id: "${ll_id}", tenant_id: "${tn_id}", claimed_arrears_cents: 400000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "http status == 422"

      - name: case_holdover_defaults_arrears_zero
        claim_type: Defaults
        grounds: [entities.Case.fields.claimed_arrears_cents]
        distinguishing_aspect: "POST /cases filing_type HOLDOVER omitting claimed_arrears_cents defaults it to 0; net_arrears_cents == 0."
        test_recipe:
          setup: ["A court, landlord, tenant exist"]
          setup_api_calls:
            - call: "POST /courts"
              payload: { name: "HC", jurisdiction_code: "J1", hearing_daily_capacity: 2 }
              as: Clerk
              captures: { court_id: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { court_id: "${court_id}", landlord_id: "${ll_id}", tenant_id: "${tn_id}", filing_type: "HOLDOVER" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { case_id: $.data.id }
          assert:
            - "Case.${case_id}.claimed_arrears_cents == 0"
            - "Case.${case_id}.net_arrears_cents == 0"

      - name: case_answer_due_at_computed_14_days
        claim_type: Computed Fields
        grounds: [entities.Case.fields.answer_due_at]
        distinguishing_aspect: "With the clock at its 2026-05-01T00:00:00Z default, a created case has answer_due_at == 2026-05-15T00:00:00.000Z (created_at + 14 days)."
        test_recipe:
          setup: ["Clock unset (default 2026-05-01T00:00:00Z); a court/landlord/tenant"]
          setup_api_calls:
            - call: "POST /courts"
              payload: { name: "HC", jurisdiction_code: "J1", hearing_daily_capacity: 2 }
              as: Clerk
              captures: { court_id: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { court_id: "${court_id}", landlord_id: "${ll_id}", tenant_id: "${tn_id}", filing_type: "NONPAYMENT", claimed_arrears_cents: 400000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { case_id: $.data.id }
          assert:
            - "Case.${case_id}.answer_due_at == 2026-05-15T00:00:00.000Z"

      - name: case_create_invalid_filing_type_enum_returns_validation
        claim_type: Type Constraints
        grounds: [entities.Case.fields.filing_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /cases with filing_type not in the enum returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A court, landlord, tenant exist"]
          setup_api_calls:
            - call: "POST /courts"
              payload: { name: "HC", jurisdiction_code: "J1", hearing_daily_capacity: 2 }
              as: Clerk
              captures: { court_id: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { court_id: "${court_id}", landlord_id: "${ll_id}", tenant_id: "${tn_id}", filing_type: "FORECLOSURE", claimed_arrears_cents: 400000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "http status == 422"

      - name: case_create_bad_court_fk_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Case.fields.court_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /cases whose court_id FK does not resolve returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["A landlord and tenant exist; no such court"]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { court_id: "00000000-0000-0000-0000-000000000000", landlord_id: "${ll_id}", tenant_id: "${tn_id}", filing_type: "NONPAYMENT", claimed_arrears_cents: 400000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

  - section: state_machines
    instances:
      - name: mediation_reschedule_after_impasse_is_cyclic
        claim_type: Valid Transition
        grounds:
          - state_machines.MediationSession.IMPASSE_to_SCHEDULED
          - state_machines.MediationSession.HELD_to_IMPASSE
        distinguishing_aspect: "After HELD->IMPASSE, a session re-SCHEDULES back to SCHEDULED with an updated scheduled_at, proving the A<->B cycle."
        test_recipe:
          setup: ["Case ANSWERED with a mediation session SCHEDULED at 2026-05-05T10:00; clock advanced to that instant"]
          setup_api_calls:
            - call: "POST /courts"
              payload: { name: "HC", jurisdiction_code: "J1", hearing_daily_capacity: 2 }
              as: Clerk
              captures: { court_id: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", landlord_id: "${ll_id}", tenant_id: "${tn_id}", filing_type: "NONPAYMENT", claimed_arrears_cents: 600000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "SERVED" }
              as: Clerk
            - call: "POST /answers"
              payload: { case_id: "${case_id}", defenses: ["RENT_PAID"] }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "POST /mediation-sessions"
              payload: { case_id: "${case_id}", mediator_user_id: "med-1", scheduled_at: "2026-05-05T10:00:00Z" }
              as: Clerk
              captures: { sess_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T10:00:00Z" }
              as: Clerk
            - call: "POST /mediation-sessions/${sess_id}/transition"
              payload: { to_status: "HELD" }
              as: Mediator
            - call: "POST /mediation-sessions/${sess_id}/transition"
              payload: { to_status: "IMPASSE" }
              as: Mediator
          trigger:
            - call: "POST /mediation-sessions/${sess_id}/transition"
              payload: { to_status: "SCHEDULED", scheduled_at: "2026-05-10T10:00:00Z" }
              as: Mediator
          assert:
            - "MediationSession.${sess_id}.status == SCHEDULED"
            - "MediationSession.${sess_id}.scheduled_at == 2026-05-10T10:00:00.000Z"

      - name: hearing_continuance_creates_successor_and_conserves_slot
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Hearing.SCHEDULED_to_CONTINUED
          - entities.Hearing.fields.continued_from_id
        distinguishing_aspect: "Continuing a SCHEDULED hearing marks it CONTINUED and creates one successor SCHEDULED hearing; the court slot count stays 1 (freed old + added new)."
        test_recipe:
          setup: ["Court capacity 2; a case; one SCHEDULED hearing [2026-06-01T10:00,11:00)"]
          setup_api_calls:
            - call: "POST /courts"
              payload: { name: "HC", jurisdiction_code: "J1", hearing_daily_capacity: 2 }
              as: Clerk
              captures: { court_id: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", landlord_id: "${ll_id}", tenant_id: "${tn_id}", filing_type: "NONPAYMENT", claimed_arrears_cents: 600000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { case_id: $.data.id }
            - call: "POST /hearings"
              payload: { case_id: "${case_id}", court_id: "${court_id}", hearing_type: "INITIAL", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Clerk
              captures: { hearing_id: $.data.id }
          trigger:
            - call: "POST /hearings/${hearing_id}/transition"
              payload: { to_status: "CONTINUED", new_start: "2026-06-05T10:00:00Z", new_end: "2026-06-05T11:00:00Z" }
              as: Clerk
          assert:
            - "Hearing.${hearing_id}.status == CONTINUED"
            - "Court.${court_id}.hearings_scheduled_count == 1"

      - name: judgment_vacate_cancels_lockout_and_dismisses_case
        claim_type: Compensation
        grounds:
          - state_machines.Judgment.ENTERED_to_VACATED
          - state_machines.Case.JUDGMENT_ENTERED_to_DISMISSED
        distinguishing_aspect: "Vacating a possession judgment cancels its SCHEDULED lockout and dismisses the case (outcome DISMISSED)."
        test_recipe:
          setup: ["Case IN_LITIGATION; POSSESSION judgment ENTERED; lockout SCHEDULED at 2026-06-01T10:00; one officer"]
          setup_api_calls:
            - call: "POST /courts"
              payload: { name: "HC", jurisdiction_code: "J1", hearing_daily_capacity: 2 }
              as: Clerk
              captures: { court_id: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
            - call: "POST /officers"
              payload: { name: "OFF", badge_number: "B1", agency: "Sheriff" }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", landlord_id: "${ll_id}", tenant_id: "${tn_id}", filing_type: "NONPAYMENT", claimed_arrears_cents: 600000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "SERVED" }
              as: Clerk
            - call: "POST /answers"
              payload: { case_id: "${case_id}", defenses: ["RENT_PAID"] }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "IN_LITIGATION" }
              as: Clerk
            - call: "POST /judgments"
              payload: { case_id: "${case_id}", judgment_type: "POSSESSION" }
              as: Judge
              as_user_id: "judge-1"
              captures: { judg_id: $.data.id }
            - call: "POST /lockout-orders"
              payload: { case_id: "${case_id}", judgment_id: "${judg_id}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { lock_id: $.data.id }
            - call: "POST /lockout-orders/${lock_id}/transition"
              payload: { to_status: "SCHEDULED", officer_id: "${off_id}", scheduled_at: "2026-06-01T10:00:00Z" }
              as: Sheriff
          trigger:
            - call: "POST /judgments/${judg_id}/transition"
              payload: { to_status: "VACATED" }
              as: Judge
              as_user_id: "judge-1"
          assert:
            - "Judgment.${judg_id}.status == VACATED"
            - "LockoutOrder.${lock_id}.status == CANCELLED"
            - "Case.${case_id}.status == DISMISSED"
            - "Case.${case_id}.outcome == DISMISSED"

      - name: installment_pay_completes_plan_bubbles_case_diversion
        claim_type: Bubble up
        grounds:
          - state_machines.PaymentPlan.ACCEPTED_to_COMPLETED
          - state_machines.Case.IN_DIVERSION_to_DIVERSION_SATISFIED
        distinguishing_aspect: "Paying the final DUE installment completes the plan and bubbles the case to DIVERSION_SATISFIED with net_arrears 0."
        test_recipe:
          setup: ["Case claimed 100000, ANSWERED; ACCEPTED plan total 100000 over 1 installment"]
          setup_api_calls:
            - call: "POST /courts"
              payload: { name: "HC", jurisdiction_code: "J1", hearing_daily_capacity: 2 }
              as: Clerk
              captures: { court_id: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", landlord_id: "${ll_id}", tenant_id: "${tn_id}", filing_type: "NONPAYMENT", claimed_arrears_cents: 100000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "SERVED" }
              as: Clerk
            - call: "POST /answers"
              payload: { case_id: "${case_id}", defenses: ["RENT_PAID"] }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "GET /cases/${case_id}"
              as: Clerk
              captures: { case_v: $.data.version }
            - call: "POST /payment-plans"
              payload: { case_id: "${case_id}", proposed_by: "LANDLORD", total_cents: 100000, installment_count: 1, first_due_date: "2026-05-20T00:00:00Z", expected_case_version: "${case_v}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /payment-plans/${plan_id}/respond"
              payload: { decision: "ACCEPT" }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "GET /installments?payment_plan_id=${plan_id}"
              as: Clerk
              captures: { inst1_id: "$.data[0].id" }
          trigger:
            - call: "POST /installments/${inst1_id}/transition"
              payload: { to_status: "PAID" }
              as: Tenant
              as_user_id: "${tn_id}"
          assert:
            - "PaymentPlan.${plan_id}.status == COMPLETED"
            - "Case.${case_id}.status == DIVERSION_SATISFIED"
            - "Case.${case_id}.net_arrears_cents == 0"

      - name: sealing_grant_sets_case_sealed
        claim_type: Cross-entity
        grounds:
          - state_machines.SealingRequest.REQUESTED_to_GRANTED
          - entities.Case.fields.sealed
        distinguishing_aspect: "Granting a sealing request sets the parent case's sealed flag to true."
        test_recipe:
          setup: ["Case DISMISSED (via DISMISSAL judgment) with closed_at 2026-05-01; clock advanced past closed_at + 90d; a REQUESTED sealing"]
          setup_api_calls:
            - call: "POST /courts"
              payload: { name: "HC", jurisdiction_code: "J1", hearing_daily_capacity: 2 }
              as: Clerk
              captures: { court_id: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", landlord_id: "${ll_id}", tenant_id: "${tn_id}", filing_type: "NONPAYMENT", claimed_arrears_cents: 600000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "SERVED" }
              as: Clerk
            - call: "POST /answers"
              payload: { case_id: "${case_id}", defenses: ["RENT_PAID"] }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "IN_LITIGATION" }
              as: Clerk
            - call: "POST /judgments"
              payload: { case_id: "${case_id}", judgment_type: "DISMISSAL" }
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Clerk
            - call: "POST /sealing-requests"
              payload: { case_id: "${case_id}", basis: "DISMISSAL" }
              as: Tenant
              as_user_id: "${tn_id}"
              captures: { seal_id: $.data.id }
          trigger:
            - call: "POST /sealing-requests/${seal_id}/transition"
              payload: { to_status: "GRANTED" }
              as: Judge
              as_user_id: "judge-1"
          assert:
            - "SealingRequest.${seal_id}.status == GRANTED"
            - "Case.${case_id}.sealed == true"

      - name: case_transition_from_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Case.terminal_states
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A DISMISSED (terminal) case rejects any further /transition with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Case DISMISSED via a DISMISSAL judgment"]
          setup_api_calls:
            - call: "POST /courts"
              payload: { name: "HC", jurisdiction_code: "J1", hearing_daily_capacity: 2 }
              as: Clerk
              captures: { court_id: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", landlord_id: "${ll_id}", tenant_id: "${tn_id}", filing_type: "NONPAYMENT", claimed_arrears_cents: 600000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "SERVED" }
              as: Clerk
            - call: "POST /answers"
              payload: { case_id: "${case_id}", defenses: ["RENT_PAID"] }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "IN_LITIGATION" }
              as: Clerk
            - call: "POST /judgments"
              payload: { case_id: "${case_id}", judgment_type: "DISMISSAL" }
              as: Judge
              as_user_id: "judge-1"
          trigger:
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "SERVED" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

