  - section: cross_cutting_layers
    instances:
      - name: occ_stale_capacity_week_version_rejected_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[capacity-allocate-stale-week]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Client reads week version 1, allocates successfully (version advances to 2), then a second allocate carrying expected_capacity_week_version 1 is rejected 412 ERR_STALE_VERSION; retrying with the fresh version 2 succeeds."
        test_recipe:
          setup:
            - "Logical clock default. Week MILL-ALX 2026-09-07 total 1000 mbf OPEN, version 1."
          setup_api_calls:
            - call: "POST /capacity-weeks"
              payload: { mill_code: "MILL-ALX", week_start_date: "2026-09-07", total_capacity_mbf: 1000 }
              as: MillPlanner
              captures: { cw: $.data.id, cw_v: $.data.version }
          trigger:
            - call: "POST /capacity-weeks/${cw}/allocate"
              payload: { internal_alloc_mbf: 500, market_alloc_mbf: 300, expected_capacity_week_version: "${cw_v}" }
              as: MillPlanner
              captures: { cw_v2: $.data.version }
            - call: "POST /capacity-weeks/${cw}/allocate"
              payload: { internal_alloc_mbf: 600, market_alloc_mbf: 400, expected_capacity_week_version: "${cw_v}" }
              as: MillPlanner
              captures: { err: $.data.error_id }
            - call: "POST /capacity-weeks/${cw}/allocate"
              payload: { internal_alloc_mbf: 600, market_alloc_mbf: 400, expected_capacity_week_version: "${cw_v2}" }
              as: MillPlanner
              captures: { ia: $.data.internal_alloc_mbf }
          assert:
            - "first allocate succeeds and version advances to 2"
            - "stale allocate with version 1: the response status is 412 and error_id == ERR_STALE_VERSION"
            - "week internal_alloc_mbf stays 500 after the stale rejection (no partial write)"
            - "retry with fresh version succeeds: internal_alloc_mbf == 600 and market_alloc_mbf == 400"

      - name: occ_stale_builder_version_on_order_create_rejected_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[order-create-stale-builder]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Client observes builder version 2 (post-APPROVE), creates order A (version advances to 3), then creates order B still carrying expected_builder_version 2 — rejected 412 ERR_STALE_VERSION; refetching version 3 and retrying succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Branch and product exist; builder ACTIVE; job J."
          setup_api_calls:
