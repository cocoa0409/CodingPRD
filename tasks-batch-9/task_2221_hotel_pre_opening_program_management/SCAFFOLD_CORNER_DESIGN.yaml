      - name: certify_with_open_blocker_returns_open_blockers_present
        claim_type: precondition_enforcement
        grounds:
          - "§1.2 TESTING -> CERTIFIED requires open_blocker_count == 0 (else ERR_OPEN_BLOCKERS_PRESENT); §1.3 system_test_aggregation sets open_blocker_count from the most recent run's blocker_count, so a 40/40 run carrying one blocker satisfies the pass-rate floor but not the blocker gate."
        distinguishing_aspect: "The latest run passed every case yet carries blocker_count 1, so the certification gate that reads open_blocker_count fires ERR_OPEN_BLOCKERS_PRESENT even though pass_rate is 1.0 and above the 0.95 floor."
        test_recipe:
          setup:
