        captures:
          o_exact: $.data.id
      trigger:
      - call: POST /vet/orders/${o_low}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          err: $.data.error_id
      - call: POST /vet/orders/${o_exact}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          ok_status: $.data.status
          ok_net: $.data.merchandise_net_cents
      assert:
      - order(P_LOW) submit -> error_id == ERR_ORDER_BELOW_MINIMUM, http 400 (49999 < 50000); order stays DRAFT and holds no window
      - order(P_EXACT) submit -> 200, status == SUBMITTED, merchandise_net_cents == 50000 (equality passes; the failed DRAFT holds no window so no overlap)
      - order(P_EXACT).freight_fee_cents == 2500 (net 50000 < free_freight_threshold 100000)
  - name: short_date_window_180_day_boundary
    grounds:
