  - rule_id: transitive_cascade
    instances:
      - name: reconcile_cascade_depth_five_debt_and_award_reversal
        grounds:
          - state_machines.EnrollmentChangeReport.REPORTED_to_RECONCILED
          - state_machines.EnrollmentCertification.AMENDMENT_PENDING_to_TERMINATED
          - state_machines.YellowRibbonAward.PROVISIONAL_to_REVERSED
          - calculations.overpayment_debt_allocation
          - entities.VeteranStudent.fields.open_debt_principal_cents
          - entities.YellowRibbonAgreement.fields.pool_remaining_cents
        distinguishing_aspect: |
          CASCADE-A is five levels deep from a single reconcile call and each level is
          a DIFFERENT entity: L1 EnrollmentChangeReport -> L2 EnrollmentCertification
          -> L3 VeteranStudent entitlement and a new BenefitDebt -> L4 the student's
          open_debt_principal_cents ledger plus a CertificationAuditEntry -> L5 the
