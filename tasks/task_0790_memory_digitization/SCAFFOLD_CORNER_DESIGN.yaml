            - call: "POST /batches/${batch_id}/load"
              payload: { media_item_id: "${mi_id}" }
              as: LabTech
            - call: "POST /batches/${batch_id}/run"
              payload: {}
              as: LabTech
            - call: "POST /media-items/${mi_id}/complete-scan"
              payload: { digitized_minutes: 30 }
