  - section: consistency model
    instances:
      - name: cs_a_refused_close_leaves_every_side_effect_unwritten
        claim_type: atomicity
        grounds:
          - errors[ERR_BUSINESS_CASE_HURDLE_NOT_MET]
          - state_machines[GateReview]
          - state_machines[BusinessCase]
          - calculations[business_case_financials]
        distinguishing_aspect: |
          A close that fails the fiscal hurdle at the last priority writes nothing at all: the review
          stays IN_SESSION with no decision, no closed_at and no chair, the authoritative business
          case stays COMPUTED rather than LOCKED, the project keeps its dev_status and next gate
          number, the votes already cast survive, and the project version does not move.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "A SNACK gate 2 with an empty checklist, an NPV hurdle of 500000.00 and payback_months_max 24."
            - "A screened project whose only business case computes to an NPV of -76589.03 and a payback of 999."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: [], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 500000.00, payback_months_max: 24, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { at_g2_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Thin Margin Thins", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 300000.00 }
              as: InnovationLead
              as_user_id: "lead-at"
              captures: { at_p_id: $.data.id }
            - call: "POST /innovation-projects/${at_p_id}/screen"
              payload: { screening_notes: "Into stage 2." }
              as: GateChair
              as_user_id: "chair-at"
              captures: { at_p_v2: $.data.version }
            - call: "POST /innovation-projects/${at_p_id}/business-cases"
              payload: { expected_project_version: "${at_p_v2}", variant_mode: "TOP_DOWN", category_size_units_year: 1000000, target_share_pct: 5.00, cogs_per_unit_usd: 2.0000, slotting_fees_usd: 0.00, capex_usd: 300000.00, discount_rate_pct: 10.00 }
              as: InnovationLead
              captures: { at_bc_id: $.data.id }
            - call: "POST /business-cases/${at_bc_id}/forecast-lines"
              payload: { channel: "GROCERY", store_count: 1000, base_velocity_units_per_store_week: 1.00, promo_weeks: 0, promo_lift_pct: 0.00, list_price_usd: 4.0000 }
              as: InnovationLead
            - call: "POST /innovation-projects/${at_p_id}/gate-reviews"
              payload: { gate_id: "${at_g2_id}", scheduled_at: "2026-08-10T09:00:00Z" }
              as: GateChair
              as_user_id: "chair-at"
              captures: { at_gr_id: $.data.id }
            - call: "POST /gate-reviews/${at_gr_id}/open"
              as: GateChair
              as_user_id: "chair-at"
            - call: "POST /gate-reviews/${at_gr_id}/votes"
              payload: { function: "FINANCE", vote: "APPROVE", rationale: "Strategically worth it." }
              as: FunctionalReviewer
              as_user_id: "rev-fin-at"
          trigger:
            - call: "POST /gate-reviews/${at_gr_id}/close"
              as: GateChair
              as_user_id: "chair-at"
            - call: "GET /gate-reviews/${at_gr_id}"
              as: PortfolioAdmin
            - call: "GET /business-cases/${at_bc_id}"
              as: PortfolioAdmin
            - call: "GET /innovation-projects/${at_p_id}"
              as: PortfolioAdmin
            - call: "GET /gate-reviews/${at_gr_id}/votes"
              as: PortfolioAdmin
          assert:
            - "the close answers 422 ERR_BUSINESS_CASE_HURDLE_NOT_MET"
            - "BusinessCase.${at_bc_id} reports annual_units 50000, gross_revenue_usd 200000.00, trade_spend_rate_pct 10.00, trade_spend_usd 20000.00, net_revenue_usd 180000.00, cogs_total_usd 100000.00, gross_margin_usd 80000.00, gross_margin_pct 44.44, npv_usd -76589.03 and payback_months 999"
            - "the refusal names one error even though both the NPV and the payback hurdles are missed"
            - "GateReview.${at_gr_id}.status is still IN_SESSION with decision null, closed_at null and chair_user_id unset"
            - "BusinessCase.${at_bc_id}.status is still COMPUTED, so nothing was locked"
            - "InnovationProject.${at_p_id}.dev_status is still SCREENED, next_gate_number is still 2, recycle_count is still 0 and version is still ${at_p_v2}"
            - "GET /gate-reviews/${at_gr_id}/votes still returns total_count 1, so the refusal did not roll back the earlier accepted vote either"

      - name: cs_frozen_gate_snapshot_and_live_aggregate_disagree_by_design
        claim_type: read_consistency
        grounds:
          - calculations[deliverable_completeness_pct]
          - calculations[launch_readiness_pct]
          - endpoints[GET /gate-reviews/{gate_review_id}]
          - endpoints[GET /innovation-projects/{id}/launch-readiness]
        distinguishing_aspect: |
          Two derived numbers are read from the same rows with deliberately different freshness: the
          review's deliverable_completeness_pct is a snapshot taken at open and re-taken at close, so
          it reads 50.00 while a second approval has already landed, whereas launch_readiness_pct is
          computed on every read and still reads 0.00 because no gate advances into LAUNCH_READY at
          all, no matter how many readiness types the second gate happens to list.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "A SNACK gate 2 requiring MANUFACTURING_READINESS then SALES_SELL_IN_PLAN, with no gate 3 configured anywhere."
            - "A screened project with a computed business case that clears the zeroed hurdles, whose two checklist rows were auto-created at screen, the first approved before the review opened."
