# =============================================================================
# Public Adjuster & Claim Advocacy — benchmark seed tables (Expert)
# =============================================================================

scenario: |
  Public Adjuster & Claim Advocacy: client & policy review, damage documentation
  & estimate, claim negotiation & supplement, fee (% of recovery) & contract,
  appraisal/umpire invocation, payment & disbursement, state licensing, dispute

domain_name: public-adjuster-claim-advocacy
api_prefix: /v1

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency        # OCC on Claim.version at supplement CREATE-with-supersede
    - cascading_side_effects        # payment clear + contract rescind cascade 3+ entities
    - dual_variant_calculation      # provisional-vs-final fee; forward-vs-booked policy exposure
    - rate_threshold_triggers       # statutory fee cap, supplement window, inspection buffer
  entity_topology: flat             # peer entities linked by FK; no nesting in URL paths
  state_machine_shape: cyclic       # Claim negotiation loops OFFER_RECEIVED<->NEGOTIATING
  relationship_patterns:
    - one_to_many                   # Client->Policy, Claim->Supplement, Claim->Payment
    - cross_aggregate               # Claim references Policy and Contract across aggregates
  role_model: segregation_of_duties # the adjuster who accepts settlement may not release its funds
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Adjuster
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Public adjuster's legal name" }
      - { name: firm_name, type: string, source: input, description: "Adjusting firm name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE (adjusters are always ACTIVE in this benchmark)", constraints: "enum: ACTIVE" }

  - name: License
    parent: Adjuster
    common_fields: true
    fields:
      - { name: adjuster_id, type: string, source: input, description: "FK -> Adjuster.id; the license holder" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state the license authorizes (e.g., TX)" }
      - { name: license_number, type: string, source: input, description: "State-issued license number" }
      - { name: effective_date, type: datetime, source: input, description: "Inclusive start of validity interval (date, ISO 8601)" }
      - { name: expiry_date, type: datetime, source: input, description: "Inclusive end of validity interval (date, ISO 8601)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED | REVOKED (current validity is determined by status AND the [effective_date, expiry_date] interval versus the clock)", constraints: "enum: ACTIVE, SUSPENDED, REVOKED" }

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Policyholder's legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: mailing_state, type: string, source: input, description: "Two-letter mailing state" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE (clients are always ACTIVE in this benchmark)", constraints: "enum: ACTIVE" }

  - name: Policy
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the insured policyholder" }
      - { name: carrier_name, type: string, source: input, description: "Insurance carrier name" }
      - { name: policy_number, type: string, source: input, description: "Carrier policy number" }
      - { name: policy_type, type: enum, source: input, description: "HO3 | HO5 | COMMERCIAL | FLOOD", constraints: "enum: HO3, HO5, COMMERCIAL, FLOOD" }
      - { name: coverage_limit_cents, type: integer, source: input, description: "Total coverage limit in cents (the finite allocation pool)" }
      - { name: deductible_cents, type: integer, source: input, description: "Per-claim deductible in cents" }
      - { name: effective_date, type: datetime, source: input, description: "Inclusive start of the coverage period (ISO 8601)" }
      - { name: expiry_date, type: datetime, source: input, description: "Inclusive end of the coverage period (ISO 8601)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | LAPSED | CANCELLED", constraints: "enum: ACTIVE, LAPSED, CANCELLED" }
      - { name: committed_cents, type: integer, source: computed, default: 0, description: "Booked exposure = sum of settlement_amount_cents over SETTLED/PAID claims + sum of APPROVED supplement amounts on this policy" }
      - { name: remaining_limit_cents, type: integer, source: computed, description: "coverage_limit_cents - committed_cents (invariant: coverage_limit_cents == remaining_limit_cents + committed_cents)" }
      - { name: forward_exposure_cents, type: integer, source: computed, default: 0, description: "Forward-looking exposure = sum of pa_acv_estimate_cents over OPEN (non-terminal, non-WITHDRAWN) claims on this policy" }

  - name: Contract
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the represented policyholder" }
      - { name: adjuster_id, type: string, source: input, description: "FK -> Adjuster.id; the retained public adjuster" }
      - { name: loss_state_code, type: string, source: input, description: "Two-letter state where the loss occurred; determines licensing + statutory cap" }
      - { name: fee_pct, type: number, source: input, description: "Contingency fee as a fraction of recovery (e.g., 0.10 = 10%)" }
      - { name: statutory_cap_pct, type: number, source: input, description: "State statutory maximum fee fraction; fee_pct must be <= this at creation" }
      - { name: prior_advance_cents, type: integer, source: input, default: 0, description: "Advances already paid to the client, recouped from disbursements before client payout" }
      - { name: advance_recouped_cents, type: integer, source: computed, default: 0, description: "Cumulative advance recouped across cleared disbursements; outstanding = prior_advance_cents - advance_recouped_cents" }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock timestamp when the client signed (null until SIGNED)" }
      - { name: rescission_deadline_at, type: datetime, source: system, description: "signed_at + RESCISSION_WINDOW_DAYS (RESCISSION_WINDOW_DAYS = 3); latest instant a rescission is allowed" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SIGNED | ACTIVE | RESCINDED | COMPLETED | CANCELLED", constraints: "enum: DRAFT, SIGNED, ACTIVE, RESCINDED, COMPLETED, CANCELLED" }

  - name: Claim
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy the loss is claimed against" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the representation agreement in force" }
      - { name: date_of_loss, type: datetime, source: input, description: "Date the loss occurred (ISO 8601); must fall inside the policy coverage period" }
      - { name: loss_state_code, type: string, source: input, description: "Two-letter state where the loss occurred" }
      - { name: peril_type, type: enum, source: input, description: "WIND | WATER | FIRE | HAIL | THEFT", constraints: "enum: WIND, WATER, FIRE, HAIL, THEFT" }
      - { name: pa_rcv_estimate_cents, type: integer, source: input, description: "Public adjuster's documented Replacement Cost Value estimate in cents" }
      - { name: depreciation_pct, type: number, source: input, description: "Depreciation fraction applied to RCV to derive ACV (e.g., 0.20 = 20%)" }
      - { name: pa_acv_estimate_cents, type: integer, source: computed, description: "Actual Cash Value = round_half_up(pa_rcv_estimate_cents * (1 - depreciation_pct))" }
      - { name: carrier_offer_cents, type: integer, source: system, default: 0, description: "Most recent carrier settlement offer in cents" }
      - { name: pa_counter_cents, type: integer, source: system, default: 0, description: "Most recent public-adjuster counter demand in cents" }
      - { name: negotiation_round, type: integer, source: system, default: 0, description: "Count of offer/counter exchanges" }
      - { name: inspection_start, type: datetime, source: system, description: "Scheduled damage-inspection window start (null until scheduled)" }
      - { name: inspection_end, type: datetime, source: system, description: "Scheduled damage-inspection window end (exclusive)" }
      - { name: settlement_amount_cents, type: integer, source: system, default: 0, description: "Agreed/awarded settlement in cents (set on accept-settlement or appraisal award)" }
      - { name: settled_at, type: datetime, source: system, description: "Logical-clock timestamp when the claim settled (set on accept-settlement / appraisal award; anchors the supplement window)" }
      - { name: amount_recovered_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over CLEARED Payments on this claim" }
      - { name: provisional_fee_cents, type: integer, source: computed, default: 0, description: "Estimate-based fee = round_half_up(effective_pct * pa_acv_estimate_cents); set at accept-settlement / appraisal award" }
      - { name: final_fee_cents, type: integer, source: computed, default: 0, description: "Recovery-based fee = sum over CLEARED payments of round_half_up(effective_pct * payment.amount_cents) (per-payment rounding pinned)" }
      - { name: accepted_by_user_id, type: string, source: system, description: "X-User-ID of the adjuster who accepted the settlement (drives segregation-of-duties on disbursement release)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | FILED | NEGOTIATING | OFFER_RECEIVED | IN_APPRAISAL | SETTLED | PAID | WITHDRAWN", constraints: "enum: DRAFT, FILED, NEGOTIATING, OFFER_RECEIVED, IN_APPRAISAL, SETTLED, PAID, WITHDRAWN" }

  - name: Supplement
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the settled claim being supplemented" }
      - { name: amount_cents, type: integer, source: input, description: "Additional claimed amount in cents" }
      - { name: reason, type: string, source: input, description: "Justification for the supplement (e.g., HIDDEN_DAMAGE)" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp when submitted to carrier (null until SUBMITTED)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | APPROVED | DENIED | VOIDED", constraints: "enum: DRAFT, SUBMITTED, APPROVED, DENIED, VOIDED" }

  - name: Appraisal
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim whose valuation is in appraisal" }
      - { name: pa_appraiser_name, type: string, source: system, description: "Name of the public-adjuster-side appraiser (null until named)" }
      - { name: carrier_appraiser_name, type: string, source: system, description: "Name of the carrier-side appraiser (null until named)" }
      - { name: umpire_name, type: string, source: system, description: "Name of the neutral umpire (null until selected; required only when appraisers disagree)" }
      - { name: pa_appraiser_amount_cents, type: integer, source: system, default: 0, description: "Loss valuation from the PA-side appraiser" }
      - { name: carrier_appraiser_amount_cents, type: integer, source: system, default: 0, description: "Loss valuation from the carrier-side appraiser" }
      - { name: award_cents, type: integer, source: system, default: 0, description: "Binding appraisal award in cents (set on render-award)" }
      - { name: status, type: enum, source: system, default: "INVOKED", description: "INVOKED | APPRAISERS_NAMED | UMPIRE_SELECTED | AWARDED | CANCELLED", constraints: "enum: INVOKED, APPRAISERS_NAMED, UMPIRE_SELECTED, AWARDED, CANCELLED" }

  - name: Payment
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim the carrier is paying" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents" }
      - { name: payment_type, type: enum, source: input, description: "INITIAL | SUPPLEMENT | APPRAISAL_AWARD", constraints: "enum: INITIAL, SUPPLEMENT, APPRAISAL_AWARD" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp when recorded" }
      - { name: status, type: enum, source: system, default: "RECEIVED", description: "RECEIVED | CLEARED | REVERSED", constraints: "enum: RECEIVED, CLEARED, REVERSED" }

  - name: Disbursement
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; the claim whose recovery is being split" }
      - { name: payment_id, type: string, source: system, description: "FK -> Payment.id; the cleared payment this disbursement splits" }
      - { name: gross_cents, type: integer, source: system, description: "Gross amount split = the cleared payment's amount_cents" }
      - { name: fee_cents, type: integer, source: computed, description: "round_half_up(effective_pct * gross_cents)" }
      - { name: advance_recoup_cents, type: integer, source: computed, description: "min(gross_cents - fee_cents, contract advance outstanding)" }
      - { name: client_cents, type: integer, source: computed, description: "gross_cents - fee_cents - advance_recoup_cents" }
      - { name: released_at, type: datetime, source: system, description: "Logical-clock timestamp of release (null until RELEASED)" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | RELEASED | HELD | VOIDED", constraints: "enum: PENDING, RELEASED, HELD, VOIDED" }

  - name: Dispute
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim the dispute concerns" }
      - { name: dispute_type, type: enum, source: input, description: "FEE | SERVICE | LICENSING", constraints: "enum: FEE, SERVICE, LICENSING" }
      - { name: raised_by, type: enum, source: input, description: "CLIENT | CARRIER", constraints: "enum: CLIENT, CARRIER" }
      - { name: description, type: string, source: input, description: "Free-text dispute description" }
      - { name: resolution, type: string, source: system, description: "Resolution note (null until RESOLVED)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | UNDER_REVIEW | RESOLVED | WITHDRAWN", constraints: "enum: OPEN, UNDER_REVIEW, RESOLVED, WITHDRAWN" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: License
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - { from: ACTIVE, to: SUSPENDED, trigger: "POST /v1/licenses/{id}/suspend", actor: FirmPrincipal, preconditions: [], side_effects: [] }
      - { from: SUSPENDED, to: ACTIVE, trigger: "POST /v1/licenses/{id}/reinstate", actor: FirmPrincipal, preconditions: [], side_effects: [] }
      - { from: ACTIVE, to: REVOKED, trigger: "POST /v1/licenses/{id}/revoke", actor: FirmPrincipal, preconditions: [], side_effects: [] }
      - { from: SUSPENDED, to: REVOKED, trigger: "POST /v1/licenses/{id}/revoke", actor: FirmPrincipal, preconditions: [], side_effects: [] }

  - entity: Policy
    initial_state: ACTIVE
    terminal_states: [LAPSED, CANCELLED]
    transitions:
      - { from: ACTIVE, to: LAPSED, trigger: "POST /v1/policies/{id}/lapse", actor: "FirmPrincipal | Carrier", preconditions: [], side_effects: [] }
      - { from: ACTIVE, to: CANCELLED, trigger: "POST /v1/policies/{id}/cancel", actor: "FirmPrincipal | Carrier", preconditions: [], side_effects: [] }

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [RESCINDED, COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /v1/contracts/{id}/sign"
        actor: Client
        preconditions: ["Acting Client.id == contract.client_id (ERR_FORBIDDEN)"]
        side_effects:
          - "signed_at = clock.now"
          - "rescission_deadline_at = signed_at + RESCISSION_WINDOW_DAYS (RESCISSION_WINDOW_DAYS = 3)"
      - from: SIGNED
        to: ACTIVE
        trigger: "POST /v1/contracts/{id}/activate"
        actor: FirmPrincipal
        preconditions:
          - "Adjuster holds an ACTIVE License whose state_code == contract.loss_state_code and whose [effective_date, expiry_date] contains clock.now (ERR_LICENSE_NOT_VALID)"
        side_effects: []
      - from: SIGNED
        to: RESCINDED
        trigger: "POST /v1/contracts/{id}/rescind"
        actor: "Client | FirmPrincipal"
        preconditions:
          - "clock.now <= rescission_deadline_at (ERR_RESCISSION_WINDOW_CLOSED)"
        side_effects:
          - "CASCADE link1: every non-terminal Claim on this contract -> WITHDRAWN"
          - "CASCADE link2 (caused by each Claim->WITHDRAWN): its DRAFT/SUBMITTED Supplements -> VOIDED, and Policy.committed_cents / remaining_limit_cents recomputed (released)"
      - from: ACTIVE
        to: RESCINDED
        trigger: "POST /v1/contracts/{id}/rescind"
        actor: "Client | FirmPrincipal"
        preconditions:
          - "clock.now <= rescission_deadline_at (ERR_RESCISSION_WINDOW_CLOSED)"
        side_effects:
          - "CASCADE link1: every non-terminal Claim on this contract (FILED/NEGOTIATING/OFFER_RECEIVED/IN_APPRAISAL/SETTLED) -> WITHDRAWN, releasing any committed settlement from Policy.committed_cents"
          - "CASCADE link2 (caused by each Claim->WITHDRAWN): its DRAFT/SUBMITTED Supplements -> VOIDED"
        note: "Cooling-off rescission is allowed after activation too, as long as clock.now <= rescission_deadline_at"
      - { from: ACTIVE, to: COMPLETED, trigger: "system (a Claim on this contract reaches PAID)", actor: system, preconditions: [], side_effects: [] }
      - { from: DRAFT, to: CANCELLED, trigger: "POST /v1/contracts/{id}/cancel", actor: FirmPrincipal, preconditions: [], side_effects: [] }
      - { from: SIGNED, to: CANCELLED, trigger: "POST /v1/contracts/{id}/cancel", actor: FirmPrincipal, preconditions: ["No non-terminal Claim exists on this contract (ERR_INVALID_STATE)"], side_effects: [] }

  - entity: Claim
    initial_state: DRAFT
    terminal_states: [PAID, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /v1/claims/{id}/file"
        actor: PublicAdjuster
        preconditions:
          - "Contract is ACTIVE (ERR_CONTRACT_NOT_ACTIVE) [cross-entity: Claim depends on Contract]"
          - "Policy is ACTIVE (ERR_POLICY_NOT_ACTIVE) [cross-entity: Claim depends on Policy]"
          - "Adjuster holds an ACTIVE License in claim.loss_state_code valid at clock.now (ERR_LICENSE_NOT_VALID) [cross-entity: Claim depends on License]"
          - "policy.effective_date <= date_of_loss <= policy.expiry_date (ERR_LOSS_OUTSIDE_POLICY_PERIOD)"
        side_effects:
          - "pa_acv_estimate_cents = round_half_up(pa_rcv_estimate_cents * (1 - depreciation_pct))"
          - "Policy.forward_exposure_cents recomputed (this claim now OPEN)"
      - from: FILED
        to: OFFER_RECEIVED
        trigger: "POST /v1/claims/{id}/record-offer"
        actor: Carrier
        preconditions: []
        side_effects: ["carrier_offer_cents = offer_cents", "negotiation_round += 1"]
      - from: OFFER_RECEIVED
        to: NEGOTIATING
        trigger: "POST /v1/claims/{id}/counter"
        actor: PublicAdjuster
        preconditions: []
        side_effects: ["pa_counter_cents = counter_cents", "negotiation_round += 1"]
      - from: NEGOTIATING
        to: OFFER_RECEIVED
        trigger: "POST /v1/claims/{id}/record-offer"
        actor: Carrier
        preconditions: []
        side_effects: ["carrier_offer_cents = offer_cents", "negotiation_round += 1"]
        note: "Cycle: OFFER_RECEIVED -> NEGOTIATING -> OFFER_RECEIVED across negotiation rounds"
      - from: OFFER_RECEIVED
        to: SETTLED
        trigger: "POST /v1/claims/{id}/accept-settlement"
        actor: PublicAdjuster
        preconditions: []
        side_effects:
          - "settlement_amount_cents = carrier_offer_cents"
          - "settled_at = clock.now"
          - "accepted_by_user_id = acting X-User-ID"
          - "provisional_fee_cents = round_half_up(min(fee_pct, statutory_cap_pct) * pa_acv_estimate_cents)"
          - "Policy.committed_cents += settlement_amount_cents; remaining_limit_cents recomputed"
      - from: OFFER_RECEIVED
        to: IN_APPRAISAL
        trigger: "POST /v1/appraisals (create)"
        actor: "PublicAdjuster | FirmPrincipal"
        preconditions: ["Claim is OFFER_RECEIVED or NEGOTIATING (a carrier offer is on record) (ERR_INVALID_STATE otherwise)"]
        side_effects: ["An Appraisal is created in INVOKED"]
      - from: NEGOTIATING
        to: IN_APPRAISAL
        trigger: "POST /v1/appraisals (create)"
        actor: "PublicAdjuster | FirmPrincipal"
        preconditions: ["Claim is OFFER_RECEIVED or NEGOTIATING (ERR_INVALID_STATE otherwise)"]
        side_effects: ["An Appraisal is created in INVOKED"]
      - from: IN_APPRAISAL
        to: SETTLED
        trigger: "system (Appraisal reaches AWARDED)"
        actor: system
        preconditions: []
        side_effects:
          - "settlement_amount_cents = appraisal.award_cents"
          - "settled_at = clock.now"
          - "accepted_by_user_id = X-User-ID that rendered the award"
          - "provisional_fee_cents = round_half_up(min(fee_pct, statutory_cap_pct) * pa_acv_estimate_cents)"
          - "Policy.committed_cents += settlement_amount_cents; remaining_limit_cents recomputed"
      - from: SETTLED
        to: PAID
        trigger: "system (on Payment clear, when amount_recovered_cents >= settlement_amount_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "final_fee_cents recomputed (sum of per-payment rounded fees)"
          - "Contract -> COMPLETED"
          - "Policy booked exposure (committed_cents) reconciled to amount_recovered_cents"
      - { from: FILED, to: WITHDRAWN, trigger: "POST /v1/claims/{id}/withdraw OR system (contract rescind cascade)", actor: "PublicAdjuster | FirmPrincipal | system", preconditions: [], side_effects: ["Policy.forward_exposure_cents recomputed"] }
      - { from: NEGOTIATING, to: WITHDRAWN, trigger: "POST /v1/claims/{id}/withdraw OR system (contract rescind cascade)", actor: "PublicAdjuster | FirmPrincipal | system", preconditions: [], side_effects: ["Policy.forward_exposure_cents recomputed"] }
      - { from: OFFER_RECEIVED, to: WITHDRAWN, trigger: "POST /v1/claims/{id}/withdraw OR system (contract rescind cascade)", actor: "PublicAdjuster | FirmPrincipal | system", preconditions: [], side_effects: ["Policy.forward_exposure_cents recomputed"] }
      - { from: IN_APPRAISAL, to: WITHDRAWN, trigger: "system (contract rescind cascade)", actor: system, preconditions: [], side_effects: ["Policy.forward_exposure_cents recomputed", "any INVOKED Appraisal on the claim is CANCELLED"] }
      - { from: SETTLED, to: WITHDRAWN, trigger: "system (contract rescind cascade)", actor: system, preconditions: [], side_effects: ["Policy.committed_cents -= settlement_amount_cents (settlement commit released); remaining_limit_cents recomputed", "Policy.forward_exposure_cents recomputed", "DRAFT/SUBMITTED Supplements on the claim -> VOIDED"] }

  - entity: Appraisal
    initial_state: INVOKED
    terminal_states: [AWARDED, CANCELLED]
    transitions:
      - from: INVOKED
        to: APPRAISERS_NAMED
        trigger: "POST /v1/appraisals/{id}/name-appraisers"
        actor: "PublicAdjuster | FirmPrincipal"
        preconditions: ["pa_appraiser_name != carrier_appraiser_name (ERR_APPRAISER_CONFLICT)"]
        side_effects:
          - "pa_appraiser_name, carrier_appraiser_name, pa_appraiser_amount_cents, carrier_appraiser_amount_cents set"
      - from: APPRAISERS_NAMED
        to: AWARDED
        trigger: "POST /v1/appraisals/{id}/render-award"
        actor: "PublicAdjuster | FirmPrincipal"
        preconditions:
          - "AGREE branch: pa_appraiser_amount_cents == carrier_appraiser_amount_cents (ERR_UMPIRE_REQUIRED otherwise)"
        side_effects:
          - "award_cents = pa_appraiser_amount_cents"
          - "CASCADE: parent Claim IN_APPRAISAL -> SETTLED (no umpire selected on this branch)"
      - from: APPRAISERS_NAMED
        to: UMPIRE_SELECTED
        trigger: "POST /v1/appraisals/{id}/select-umpire"
        actor: "PublicAdjuster | FirmPrincipal"
        preconditions:
          - "pa_appraiser_amount_cents != carrier_appraiser_amount_cents (ERR_UMPIRE_NOT_NEEDED)"
          - "umpire_name != pa_appraiser_name and umpire_name != carrier_appraiser_name (ERR_APPRAISER_CONFLICT)"
        side_effects: ["umpire_name set"]
      - from: UMPIRE_SELECTED
        to: AWARDED
        trigger: "POST /v1/appraisals/{id}/render-award"
        actor: "PublicAdjuster | FirmPrincipal"
        preconditions:
          - "UMPIRE branch: min(pa_appraiser_amount_cents, carrier_appraiser_amount_cents) <= award_cents <= max(pa_appraiser_amount_cents, carrier_appraiser_amount_cents) (ERR_AWARD_OUT_OF_RANGE)"
        side_effects:
          - "award_cents = provided award_cents"
          - "CASCADE: parent Claim IN_APPRAISAL -> SETTLED (umpire selected on this branch)"
      - from: INVOKED
        to: CANCELLED
        trigger: "POST /v1/appraisals/{id}/cancel"
        actor: "PublicAdjuster | FirmPrincipal"
        preconditions: []
        side_effects: ["Parent Claim IN_APPRAISAL -> NEGOTIATING"]

  - entity: Supplement
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /v1/supplements/{id}/submit"
        actor: PublicAdjuster
        preconditions:
          - "days_between(claim settlement instant, clock.now) <= SUPPLEMENT_WINDOW_DAYS (SUPPLEMENT_WINDOW_DAYS = 365) (ERR_SUPPLEMENT_WINDOW_CLOSED)"
        side_effects: ["submitted_at = clock.now"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /v1/supplements/{id}/decide (decision=APPROVE)"
        actor: FirmPrincipal
        preconditions:
          - "amount_cents <= Policy.remaining_limit_cents (ERR_POLICY_LIMIT_EXCEEDED)"
        side_effects:
          - "Policy.committed_cents += amount_cents; remaining_limit_cents recomputed"
          - "Claim.settlement_amount_cents += amount_cents"
      - { from: SUBMITTED, to: DENIED, trigger: "POST /v1/supplements/{id}/decide (decision=DENY)", actor: FirmPrincipal, preconditions: [], side_effects: [] }
      - { from: DRAFT, to: VOIDED, trigger: "system (contract rescind / claim withdraw cascade)", actor: system, preconditions: [], side_effects: [] }
      - { from: SUBMITTED, to: VOIDED, trigger: "system (contract rescind / claim withdraw cascade)", actor: system, preconditions: [], side_effects: [] }

  - entity: Payment
    initial_state: RECEIVED
    terminal_states: [REVERSED]
    transitions:
      - from: RECEIVED
        to: CLEARED
        trigger: "POST /v1/payments/{id}/clear"
        actor: Carrier
        preconditions: ["Claim is SETTLED or PAID (ERR_CLAIM_NOT_SETTLED)"]
        side_effects:
          - "Claim.amount_recovered_cents += amount_cents"
          - "CASCADE link1->2: a Disbursement is created (PENDING) splitting this payment (fee/advance/client)"
          - "CASCADE link3: if amount_recovered_cents >= settlement_amount_cents, Claim SETTLED -> PAID (final_fee, Contract COMPLETED, Policy reconcile)"
      - from: CLEARED
        to: REVERSED
        trigger: "POST /v1/payments/{id}/reverse"
        actor: "Carrier | FirmPrincipal"
        preconditions: ["The Disbursement splitting this payment is not RELEASED (ERR_DISBURSEMENT_RELEASED)"]
        side_effects:
          - "Claim.amount_recovered_cents -= amount_cents (compensating)"
          - "The splitting Disbursement -> VOIDED"
          - "Contract advance_recouped_cents restored by that disbursement's advance_recoup_cents"

  - entity: Disbursement
    initial_state: PENDING
    terminal_states: [RELEASED, VOIDED]
    transitions:
      - from: PENDING
        to: RELEASED
        trigger: "POST /v1/disbursements/{id}/release"
        actor: "PublicAdjuster | FirmPrincipal"
        preconditions:
          - "Acting X-User-ID != Claim.accepted_by_user_id (ERR_SEGREGATION_OF_DUTIES) [segregation of duties]"
          - "No OPEN or UNDER_REVIEW Dispute exists on the claim (ERR_OPEN_DISPUTE_BLOCKS_RELEASE) [cross-entity: Disbursement depends on Dispute]"
        side_effects: ["released_at = clock.now", "Contract.advance_recouped_cents += advance_recoup_cents"]
      - { from: PENDING, to: HELD, trigger: "POST /v1/disbursements/{id}/hold", actor: "PublicAdjuster | FirmPrincipal", preconditions: [], side_effects: [] }
      - { from: HELD, to: PENDING, trigger: "POST /v1/disbursements/{id}/resume", actor: "PublicAdjuster | FirmPrincipal", preconditions: [], side_effects: [], note: "Cycle: PENDING -> HELD -> PENDING" }
      - { from: PENDING, to: VOIDED, trigger: "system (payment reverse)", actor: system, preconditions: [], side_effects: [] }
      - { from: HELD, to: VOIDED, trigger: "system (payment reverse)", actor: system, preconditions: [], side_effects: [] }

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED, WITHDRAWN]
    transitions:
      - { from: OPEN, to: UNDER_REVIEW, trigger: "POST /v1/disputes/{id}/review", actor: FirmPrincipal, preconditions: [], side_effects: [] }
      - { from: UNDER_REVIEW, to: RESOLVED, trigger: "POST /v1/disputes/{id}/resolve", actor: FirmPrincipal, preconditions: [], side_effects: ["resolution set"] }
      - { from: OPEN, to: WITHDRAWN, trigger: "POST /v1/disputes/{id}/withdraw", actor: "Client | Carrier", preconditions: [], side_effects: [] }
      - { from: UNDER_REVIEW, to: WITHDRAWN, trigger: "POST /v1/disputes/{id}/withdraw", actor: "Client | Carrier", preconditions: [], side_effects: [] }

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: supplement-create-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /v1/supplements"
    occ_field: "expected_claim_version"
    description: |
      Creating a Supplement against a Claim whose version has advanced since the
      client last observed it is rejected. A supplement legitimately supersedes the
      prior view of the claim's settlement and draws down the policy's remaining
      limit; a writer holding a stale Claim version is unaware that another
      supplement (or settlement adjustment) has already changed the available
      headroom, so its create is rejected on the stale version rather than silently
      stacking on an outdated basis.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: pa_acv_estimate
    trigger: "Claim file (DRAFT -> FILED)"
    algorithm: net_calculation
    formula: |
      pa_acv_estimate_cents = round_half_up(pa_rcv_estimate_cents * (1 - depreciation_pct))
    input_set: "Single Claim's own RCV estimate and depreciation fraction"
    constants: {}
    precision: "integer cents, round_half_up"

  - name: fee_assessment
    trigger: "provisional at accept-settlement / appraisal award; final on Claim SETTLED -> PAID"
    algorithm: dual_variant
    formula: |
      effective_pct = min(contract.fee_pct, contract.statutory_cap_pct)
      # provisional (estimate-based): computed once when the claim settles
      provisional_fee_cents = round_half_up(effective_pct * claim.pa_acv_estimate_cents)
      # final (recovery-based): per-payment rounding, then summed (see total_fee_rounding)
      final_fee_cents = sum over CLEARED payments p of round_half_up(effective_pct * p.amount_cents)
    input_set: "provisional over the claim's ACV estimate; final over CLEARED Payments only"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - { name: provisional, when: "at settlement acceptance / appraisal award, before cash arrives", difference: "base = pa_acv_estimate_cents (the PA's documented valuation)" }
      - { name: final, when: "when the claim reaches PAID", difference: "base = amount actually recovered, summed per-payment (rounding pinned per payment)" }

  - name: policy_exposure
    trigger: "recomputed on Claim file, withdraw, settle, and Payment clear"
    algorithm: dual_variant
    formula: |
      # forward-looking (projected): reserve against every still-open claim
      forward_exposure_cents = sum(claim.pa_acv_estimate_cents
                                   for claim in policy.claims
                                   if claim.status NOT IN {PAID, WITHDRAWN})
      # booked (chronological/actual): only realized commitments count against the limit
      committed_cents = sum(claim.settlement_amount_cents
                            for claim in policy.claims
                            if claim.status IN {SETTLED, PAID})
                        + sum(s.amount_cents
                              for s in policy.supplements if s.status == APPROVED)
      remaining_limit_cents = coverage_limit_cents - committed_cents
    input_set: "forward over OPEN claims (ACV estimates); booked over SETTLED/PAID claims + APPROVED supplements"
    constants: {}
    precision: "integer cents"
    variants:
      - { name: forward_looking, when: "capacity planning / reserve view", difference: "includes every non-terminal claim at its ACV estimate" }
      - { name: booked, when: "limit enforcement view", difference: "counts only settled/paid claims + approved supplements at their committed amounts" }

  - name: disbursement_waterfall
    trigger: "Payment clear (creates the Disbursement)"
    algorithm: waterfall_allocation
    formula: |
      effective_pct = min(contract.fee_pct, contract.statutory_cap_pct)
      gross_cents = payment.amount_cents
      fee_cents = round_half_up(effective_pct * gross_cents)
      advance_outstanding = contract.prior_advance_cents - contract.advance_recouped_cents
      advance_recoup_cents = min(gross_cents - fee_cents, advance_outstanding)
      client_cents = gross_cents - fee_cents - advance_recoup_cents
    input_set: "One cleared Payment + its Claim's Contract fee terms and outstanding advance"
    constants: {}
    precision: "integer cents, round_half_up on fee; exact subtraction thereafter"
    variants: []

  - name: total_fee_rounding
    trigger: "final_fee_cents recompute on each Payment clear / Claim PAID"
    algorithm: aggregation
    formula: |
      # ORDER IS PINNED: round each payment's fee to the cent, THEN sum.
      # (Rounding the aggregate would differ by up to a cent.)
      final_fee_cents = sum(round_half_up(effective_pct * p.amount_cents)
                            for p in claim.payments if p.status == CLEARED)
      # NOT round_half_up(effective_pct * sum(p.amount_cents))
    input_set: "All CLEARED Payments on the claim"
    constants: {}
    precision: "integer cents, round_half_up per payment"
    variants: []

  - name: statutory_fee_cap
    trigger: "Contract create (validation of fee_pct)"
    algorithm: threshold
    formula: |
      accept iff fee_pct <= statutory_cap_pct   # inclusive boundary
      else ERR_FEE_EXCEEDS_STATUTORY_CAP
    input_set: "Contract fee_pct vs statutory_cap_pct at creation"
    constants: {}
    precision: "exact fraction comparison"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and valid", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint; entity_backed role's X-User-ID must own the acted-on resource where ownership applies", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: all }
  - { priority: 3, category: existence, check: "All path/body-referenced resources exist (validated left-to-right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: all }
  - { priority: 4, category: state, check: "Target resource is in a state where this transition is allowed (includes claim-not-settled for supplement create)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 5, category: business_compliance, check: "Adjuster holds an ACTIVE License in the loss state valid at clock.now", error_id: ERR_LICENSE_NOT_VALID, http_status: 409, applies_to: "POST /v1/claims/{id}/file, POST /v1/contracts/{id}/activate" }
  - { priority: 6, category: business_referential, check: "Referenced Contract is ACTIVE and Policy is ACTIVE", error_id: "ERR_CONTRACT_NOT_ACTIVE | ERR_POLICY_NOT_ACTIVE", http_status: 409, applies_to: "POST /v1/claims/{id}/file" }
  - { priority: 7, category: business_temporal, check: "Temporal windows: loss within policy period; supplement within window; rescission within window; inspection non-overlap", error_id: "ERR_LOSS_OUTSIDE_POLICY_PERIOD | ERR_SUPPLEMENT_WINDOW_CLOSED | ERR_RESCISSION_WINDOW_CLOSED | ERR_INSPECTION_OVERLAP", http_status: 409, applies_to: "claim file, supplement submit, contract rescind, claim schedule-inspection" }
  - { priority: 8, category: business_constraint, check: "Distinctness/range constraints: license validity-interval non-overlap; appraiser/umpire distinctness; award within appraiser range; statutory fee cap at contract create", error_id: "ERR_LICENSE_PERIOD_OVERLAP | ERR_APPRAISER_CONFLICT | ERR_AWARD_OUT_OF_RANGE | ERR_FEE_EXCEEDS_STATUTORY_CAP", http_status: 409, applies_to: "license create, appraisal name-appraisers/select-umpire/render-award, contract create" }
  - { priority: 9, category: business_safety, check: "Segregation of duties: releaser of a disbursement is not the adjuster who accepted the settlement", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 409, applies_to: "POST /v1/disbursements/{id}/release" }
  - { priority: 10, category: business_fiscal, check: "Fiscal capacity: supplement/settlement amount within policy remaining limit", error_id: ERR_POLICY_LIMIT_EXCEEDED, http_status: 409, applies_to: "POST /v1/supplements/{id}/decide" }
  - { priority: 11, category: concurrency, check: "OCC: expected_claim_version matches current Claim.version at supplement create", error_id: ERR_STALE_CLAIM_VERSION, http_status: 412, applies_to: "POST /v1/supplements" }
  - { priority: 12, category: business_constraint, check: "Request body well-formed: required fields present, non-negative amounts, valid enums", error_id: ERR_VALIDATION, http_status: 422, applies_to: all }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-07-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock time."
    roles: [FirmPrincipal, System, PublicAdjuster, Carrier]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock now = to_iso8601"]

  # --- Adjuster ---
  - { method: POST, path: "/v1/adjusters", description: "Create an Adjuster", roles: [FirmPrincipal], code: 201, input: [full_name, firm_name, email], output: Adjuster, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/v1/adjusters/{id}", description: "Get an Adjuster", roles: [FirmPrincipal, PublicAdjuster, Client, Carrier], code: 200, input: [], output: Adjuster, side_effects: [] }

  # --- License ---
  - method: POST
    path: "/v1/licenses"
    description: "Issue a License to an Adjuster"
    roles: [FirmPrincipal]
    code: 201
    input: [adjuster_id, state_code, license_number, effective_date, expiry_date]
    output: License
    side_effects: ["status=ACTIVE", "reject if it overlaps an existing non-REVOKED license for the same (adjuster_id, state_code): ERR_LICENSE_PERIOD_OVERLAP"]
  - { method: GET, path: "/v1/licenses/{id}", description: "Get a License", roles: [FirmPrincipal, PublicAdjuster, Client, Carrier], code: 200, input: [], output: License, side_effects: [] }
  - { method: GET, path: "/v1/licenses", description: "List Licenses (reverse-reachability for License.adjuster_id)", roles: [FirmPrincipal, PublicAdjuster, Client, Carrier], code: 200, input: ["adjuster_id?", "state_code?", "status?"], output: "License[]", side_effects: [] }
  - { method: POST, path: "/v1/licenses/{id}/suspend", description: "Suspend a License", roles: [FirmPrincipal], code: 200, input: [], output: License, side_effects: ["status -> SUSPENDED"] }
  - { method: POST, path: "/v1/licenses/{id}/reinstate", description: "Reinstate a suspended License", roles: [FirmPrincipal], code: 200, input: [], output: License, side_effects: ["status -> ACTIVE"] }
  - { method: POST, path: "/v1/licenses/{id}/revoke", description: "Revoke a License", roles: [FirmPrincipal], code: 200, input: [], output: License, side_effects: ["status -> REVOKED"] }

  # --- Client ---
  - { method: POST, path: "/v1/clients", description: "Create a Client", roles: [FirmPrincipal, PublicAdjuster], code: 201, input: [full_name, email, mailing_state], output: Client, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/v1/clients/{id}", description: "Get a Client", roles: [FirmPrincipal, PublicAdjuster, Client, Carrier], code: 200, input: [], output: Client, side_effects: [] }

  # --- Policy ---
  - { method: POST, path: "/v1/policies", description: "Create a Policy", roles: [FirmPrincipal, PublicAdjuster], code: 201, input: [client_id, carrier_name, policy_number, policy_type, coverage_limit_cents, deductible_cents, effective_date, expiry_date], output: Policy, side_effects: ["status=ACTIVE", "committed_cents=0", "remaining_limit_cents=coverage_limit_cents"] }
  - { method: GET, path: "/v1/policies/{id}", description: "Get a Policy (includes computed exposure fields)", roles: [FirmPrincipal, PublicAdjuster, Client, Carrier], code: 200, input: [], output: Policy, side_effects: [] }
  - { method: GET, path: "/v1/policies", description: "List Policies (reverse-reachability for Policy.client_id)", roles: [FirmPrincipal, PublicAdjuster, Client, Carrier], code: 200, input: ["client_id?", "status?"], output: "Policy[]", side_effects: [] }
  - { method: POST, path: "/v1/policies/{id}/lapse", description: "Mark a Policy LAPSED", roles: [FirmPrincipal, Carrier], code: 200, input: [], output: Policy, side_effects: ["status -> LAPSED"] }
  - { method: POST, path: "/v1/policies/{id}/cancel", description: "Cancel a Policy", roles: [FirmPrincipal, Carrier], code: 200, input: [], output: Policy, side_effects: ["status -> CANCELLED"] }

  # --- Contract ---
  - method: POST
    path: "/v1/contracts"
    description: "Create a representation Contract (DRAFT)"
    roles: [FirmPrincipal]
    code: 201
    input: [client_id, adjuster_id, loss_state_code, fee_pct, statutory_cap_pct, "prior_advance_cents?"]
    output: Contract
    side_effects: ["status=DRAFT", "reject if fee_pct > statutory_cap_pct: ERR_FEE_EXCEEDS_STATUTORY_CAP"]
  - { method: GET, path: "/v1/contracts/{id}", description: "Get a Contract", roles: [FirmPrincipal, PublicAdjuster, Client, Carrier], code: 200, input: [], output: Contract, side_effects: [] }
  - { method: GET, path: "/v1/contracts", description: "List Contracts (reverse-reachability for Contract.client_id and Contract.adjuster_id)", roles: [FirmPrincipal, PublicAdjuster, Client, Carrier], code: 200, input: ["client_id?", "adjuster_id?", "status?"], output: "Contract[]", side_effects: [] }
  - { method: POST, path: "/v1/contracts/{id}/sign", description: "Client signs the Contract", roles: [Client], code: 200, input: [], output: Contract, side_effects: ["status -> SIGNED", "signed_at=clock.now", "rescission_deadline_at=signed_at + RESCISSION_WINDOW_DAYS (RESCISSION_WINDOW_DAYS = 3)"] }
  - { method: POST, path: "/v1/contracts/{id}/activate", description: "Activate a signed Contract", roles: [FirmPrincipal], code: 200, input: [], output: Contract, side_effects: ["status -> ACTIVE (requires valid license in loss state)"] }
  - { method: POST, path: "/v1/contracts/{id}/rescind", description: "Rescind within the cooling-off window (cascades claim withdrawal + supplement void)", roles: [Client, FirmPrincipal], code: 200, input: [], output: Contract, side_effects: ["status -> RESCINDED", "CASCADE: claims -> WITHDRAWN -> supplements VOIDED + policy limit released"] }
  - { method: POST, path: "/v1/contracts/{id}/cancel", description: "Cancel a Contract", roles: [FirmPrincipal], code: 200, input: [], output: Contract, side_effects: ["status -> CANCELLED"] }

  # --- Claim ---
  - method: POST
    path: "/v1/claims"
    description: "Create a Claim (DRAFT)"
    roles: [PublicAdjuster]
    code: 201
    input: [policy_id, contract_id, date_of_loss, loss_state_code, peril_type, pa_rcv_estimate_cents, depreciation_pct]
    output: Claim
    side_effects: ["status=DRAFT", "version=1"]
  - { method: GET, path: "/v1/claims/{id}", description: "Get a Claim (includes version for OCC and computed fees)", roles: [FirmPrincipal, PublicAdjuster, Client, Carrier], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: GET, path: "/v1/claims", description: "List Claims (reverse-reachability for Claim.policy_id and Claim.contract_id)", roles: [FirmPrincipal, PublicAdjuster, Client, Carrier], code: 200, input: ["policy_id?", "contract_id?", "status?"], output: "Claim[]", side_effects: [] }
  - method: POST
    path: "/v1/claims/{id}/file"
    description: "File the claim with the carrier (DRAFT -> FILED)"
    roles: [PublicAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> FILED", "pa_acv_estimate_cents computed", "Policy.forward_exposure_cents recomputed", "version += 1"]
  - method: POST
    path: "/v1/claims/{id}/schedule-inspection"
    description: "Schedule the damage inspection window for the acting adjuster"
    roles: [PublicAdjuster]
    code: 200
    input: [inspection_start, inspection_end]
    output: Claim
    side_effects: ["inspection_start/end set", "reject if within TRAVEL_BUFFER_MINUTES (TRAVEL_BUFFER_MINUTES = 60) of another inspection for the same adjuster: ERR_INSPECTION_OVERLAP", "version += 1"]
  - { method: POST, path: "/v1/claims/{id}/record-offer", description: "Carrier records a settlement offer (FILED/NEGOTIATING -> OFFER_RECEIVED)", roles: [Carrier], code: 200, input: [offer_cents], output: Claim, side_effects: ["carrier_offer_cents set", "negotiation_round += 1", "version += 1"] }
  - { method: POST, path: "/v1/claims/{id}/counter", description: "Public adjuster counters (OFFER_RECEIVED -> NEGOTIATING)", roles: [PublicAdjuster], code: 200, input: [counter_cents], output: Claim, side_effects: ["pa_counter_cents set", "negotiation_round += 1", "version += 1"] }
  - method: POST
    path: "/v1/claims/{id}/accept-settlement"
    description: "Accept the current carrier offer (OFFER_RECEIVED -> SETTLED)"
    roles: [PublicAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["settlement_amount_cents = carrier_offer_cents", "accepted_by_user_id = X-User-ID", "provisional_fee_cents computed", "Policy.committed_cents += settlement", "version += 1"]
  - { method: POST, path: "/v1/claims/{id}/withdraw", description: "Withdraw the claim", roles: [PublicAdjuster, FirmPrincipal], code: 200, input: [], output: Claim, side_effects: ["status -> WITHDRAWN", "Policy.forward_exposure_cents recomputed", "version += 1"] }

  # --- Supplement (OCC on Claim.version) ---
  - method: POST
    path: "/v1/supplements"
    description: "Create a Supplement against a SETTLED/PAID claim (OCC on Claim.version)"
    roles: [PublicAdjuster]
    code: 201
    input: [claim_id, expected_claim_version, amount_cents, reason]
    output: Supplement
    side_effects: ["status=DRAFT", "increments Claim.version by 1"]
  - { method: GET, path: "/v1/supplements/{id}", description: "Get a Supplement", roles: [FirmPrincipal, PublicAdjuster, Client, Carrier], code: 200, input: [], output: Supplement, side_effects: [] }
  - { method: GET, path: "/v1/supplements", description: "List Supplements (reverse-reachability for Supplement.claim_id)", roles: [FirmPrincipal, PublicAdjuster, Client, Carrier], code: 200, input: ["claim_id?", "status?"], output: "Supplement[]", side_effects: [] }
  - { method: POST, path: "/v1/supplements/{id}/submit", description: "Submit a supplement to the carrier (DRAFT -> SUBMITTED)", roles: [PublicAdjuster], code: 200, input: [], output: Supplement, side_effects: ["status -> SUBMITTED", "submitted_at=clock.now", "reject if past SUPPLEMENT_WINDOW_DAYS (SUPPLEMENT_WINDOW_DAYS = 365): ERR_SUPPLEMENT_WINDOW_CLOSED"] }
  - { method: POST, path: "/v1/supplements/{id}/decide", description: "Firm records the carrier decision (SUBMITTED -> APPROVED/DENIED)", roles: [FirmPrincipal], code: 200, input: [decision], output: Supplement, side_effects: ["APPROVE: Policy.committed_cents += amount, Claim.settlement_amount += amount", "DENY: no ledger change"] }

  # --- Appraisal (branching) ---
  - { method: POST, path: "/v1/appraisals", description: "Invoke appraisal on a claim (claim -> IN_APPRAISAL)", roles: [PublicAdjuster, FirmPrincipal], code: 201, input: [claim_id], output: Appraisal, side_effects: ["status=INVOKED", "parent Claim -> IN_APPRAISAL"] }
  - { method: GET, path: "/v1/appraisals/{id}", description: "Get an Appraisal", roles: [FirmPrincipal, PublicAdjuster, Client, Carrier], code: 200, input: [], output: Appraisal, side_effects: [] }
  - { method: GET, path: "/v1/appraisals", description: "List Appraisals (reverse-reachability for Appraisal.claim_id)", roles: [FirmPrincipal, PublicAdjuster, Client, Carrier], code: 200, input: ["claim_id?", "status?"], output: "Appraisal[]", side_effects: [] }
  - method: POST
    path: "/v1/appraisals/{id}/name-appraisers"
    description: "Name both appraisers and their valuations (INVOKED -> APPRAISERS_NAMED)"
    roles: [PublicAdjuster, FirmPrincipal]
    code: 200
    input: [pa_appraiser_name, pa_appraiser_amount_cents, carrier_appraiser_name, carrier_appraiser_amount_cents]
    output: Appraisal
    side_effects: ["names + amounts set", "reject if pa_appraiser_name == carrier_appraiser_name: ERR_APPRAISER_CONFLICT"]
  - { method: POST, path: "/v1/appraisals/{id}/select-umpire", description: "Select a neutral umpire when appraisers disagree (APPRAISERS_NAMED -> UMPIRE_SELECTED)", roles: [PublicAdjuster, FirmPrincipal], code: 200, input: [umpire_name], output: Appraisal, side_effects: ["umpire_name set", "reject if amounts equal (ERR_UMPIRE_NOT_NEEDED) or umpire duplicates an appraiser (ERR_APPRAISER_CONFLICT)"] }
  - method: POST
    path: "/v1/appraisals/{id}/render-award"
    description: "Render the binding award (AGREE: from APPRAISERS_NAMED when amounts equal; UMPIRE: from UMPIRE_SELECTED with award_cents in range) -> AWARDED; cascades claim to SETTLED"
    roles: [PublicAdjuster, FirmPrincipal, System]
    code: 200
    input: ["award_cents?"]
    output: Appraisal
    side_effects: ["status -> AWARDED", "award_cents set", "CASCADE: Claim IN_APPRAISAL -> SETTLED"]
  - { method: POST, path: "/v1/appraisals/{id}/cancel", description: "Cancel an invoked appraisal (INVOKED -> CANCELLED; claim -> NEGOTIATING)", roles: [PublicAdjuster, FirmPrincipal], code: 200, input: [], output: Appraisal, side_effects: ["status -> CANCELLED", "parent Claim IN_APPRAISAL -> NEGOTIATING"] }

  # --- Payment ---
  - { method: POST, path: "/v1/payments", description: "Carrier records a payment on the claim (RECEIVED)", roles: [Carrier], code: 201, input: [claim_id, amount_cents, payment_type], output: Payment, side_effects: ["status=RECEIVED", "received_at=clock.now"] }
  - { method: GET, path: "/v1/payments/{id}", description: "Get a Payment", roles: [FirmPrincipal, PublicAdjuster, Client, Carrier], code: 200, input: [], output: Payment, side_effects: [] }
  - { method: GET, path: "/v1/payments", description: "List Payments (reverse-reachability for Payment.claim_id)", roles: [FirmPrincipal, PublicAdjuster, Client, Carrier], code: 200, input: ["claim_id?", "status?"], output: "Payment[]", side_effects: [] }
  - method: POST
    path: "/v1/payments/{id}/clear"
    description: "Clear a payment (RECEIVED -> CLEARED); creates a Disbursement and may drive the claim to PAID"
    roles: [Carrier]
    code: 200
    input: []
    output: Payment
    side_effects: ["status -> CLEARED", "Claim.amount_recovered_cents += amount", "CASCADE: Disbursement created; if recovered >= settlement, Claim -> PAID (final_fee, Contract COMPLETED)"]
  - { method: POST, path: "/v1/payments/{id}/reverse", description: "Reverse a cleared payment (CLEARED -> REVERSED); compensating, voids its Disbursement", roles: [Carrier, FirmPrincipal], code: 200, input: [], output: Payment, side_effects: ["status -> REVERSED", "amount_recovered_cents -= amount", "splitting Disbursement -> VOIDED", "advance recoup restored"] }

  # --- Disbursement (cascade-created; discovered via reverse GET) ---
  - { method: GET, path: "/v1/disbursements/{id}", description: "Get a Disbursement", roles: [FirmPrincipal, PublicAdjuster, Client, Carrier], code: 200, input: [], output: Disbursement, side_effects: [] }
  - { method: GET, path: "/v1/disbursements", description: "List Disbursements (reverse-reachability for Disbursement.claim_id and Disbursement.payment_id)", roles: [FirmPrincipal, PublicAdjuster, Client, Carrier], code: 200, input: ["claim_id?", "payment_id?", "status?"], output: "Disbursement[]", side_effects: [] }
  - method: POST
    path: "/v1/disbursements/{id}/release"
    description: "Release funds to the client (PENDING -> RELEASED); enforces segregation of duties + no open dispute"
    roles: [PublicAdjuster, FirmPrincipal]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["status -> RELEASED", "released_at=clock.now", "Contract.advance_recouped_cents += advance_recoup_cents"]
  - { method: POST, path: "/v1/disbursements/{id}/hold", description: "Hold a pending disbursement (PENDING -> HELD)", roles: [PublicAdjuster, FirmPrincipal], code: 200, input: [], output: Disbursement, side_effects: ["status -> HELD"] }
  - { method: POST, path: "/v1/disbursements/{id}/resume", description: "Resume a held disbursement (HELD -> PENDING)", roles: [PublicAdjuster, FirmPrincipal], code: 200, input: [], output: Disbursement, side_effects: ["status -> PENDING"] }

  # --- Dispute ---
  - { method: POST, path: "/v1/disputes", description: "Raise a Dispute on a claim (OPEN)", roles: [Client, Carrier, FirmPrincipal], code: 201, input: [claim_id, dispute_type, raised_by, description], output: Dispute, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/v1/disputes/{id}", description: "Get a Dispute", roles: [FirmPrincipal, PublicAdjuster, Client, Carrier], code: 200, input: [], output: Dispute, side_effects: [] }
  - { method: GET, path: "/v1/disputes", description: "List Disputes (reverse-reachability for Dispute.claim_id)", roles: [FirmPrincipal, PublicAdjuster, Client, Carrier], code: 200, input: ["claim_id?", "status?"], output: "Dispute[]", side_effects: [] }
  - { method: POST, path: "/v1/disputes/{id}/review", description: "Begin review of a dispute (OPEN -> UNDER_REVIEW)", roles: [FirmPrincipal], code: 200, input: [], output: Dispute, side_effects: ["status -> UNDER_REVIEW"] }
  - { method: POST, path: "/v1/disputes/{id}/resolve", description: "Resolve a dispute (UNDER_REVIEW -> RESOLVED)", roles: [FirmPrincipal], code: 200, input: [resolution], output: Dispute, side_effects: ["status -> RESOLVED", "resolution set"] }
  - { method: POST, path: "/v1/disputes/{id}/withdraw", description: "Withdraw a dispute (OPEN/UNDER_REVIEW -> WITHDRAWN)", roles: [Client, Carrier], code: 200, input: [], output: Dispute, side_effects: ["status -> WITHDRAWN"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint, or entity_backed user does not own the resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, negative/zero amount, invalid enum" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state where this transition is allowed (includes claim-not-settled at supplement create)" }
  - { id: ERR_LICENSE_NOT_VALID, http: 409, condition: "Adjuster lacks an ACTIVE License in the loss state valid at the current clock time" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "The claim's Contract is not ACTIVE" }
  - { id: ERR_POLICY_NOT_ACTIVE, http: 409, condition: "The claim's Policy is not ACTIVE" }
  - { id: ERR_LOSS_OUTSIDE_POLICY_PERIOD, http: 409, condition: "date_of_loss is outside [policy.effective_date, policy.expiry_date]" }
  - { id: ERR_SUPPLEMENT_WINDOW_CLOSED, http: 409, condition: "Supplement submitted more than SUPPLEMENT_WINDOW_DAYS (SUPPLEMENT_WINDOW_DAYS = 365) after settlement" }
  - { id: ERR_RESCISSION_WINDOW_CLOSED, http: 409, condition: "Rescission attempted after rescission_deadline_at" }
  - { id: ERR_INSPECTION_OVERLAP, http: 409, condition: "Inspection window is within TRAVEL_BUFFER_MINUTES (TRAVEL_BUFFER_MINUTES = 60) of another inspection for the same adjuster" }
  - { id: ERR_LICENSE_PERIOD_OVERLAP, http: 409, condition: "New license validity interval overlaps an existing non-REVOKED license for the same (adjuster, state)" }
  - { id: ERR_APPRAISER_CONFLICT, http: 409, condition: "Two of {pa appraiser, carrier appraiser, umpire} share a name" }
  - { id: ERR_UMPIRE_NOT_NEEDED, http: 409, condition: "Umpire selection attempted while appraiser valuations are equal" }
  - { id: ERR_UMPIRE_REQUIRED, http: 409, condition: "Agree-branch award attempted while appraiser valuations differ (umpire required)" }
  - { id: ERR_AWARD_OUT_OF_RANGE, http: 409, condition: "Umpire award is outside the inclusive [min, max] of the two appraiser valuations" }
  - { id: ERR_FEE_EXCEEDS_STATUTORY_CAP, http: 409, condition: "Contract fee_pct exceeds statutory_cap_pct" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Disbursement releaser is the same user who accepted the settlement" }
  - { id: ERR_OPEN_DISPUTE_BLOCKS_RELEASE, http: 409, condition: "An OPEN/UNDER_REVIEW dispute on the claim blocks disbursement release" }
  - { id: ERR_DISBURSEMENT_RELEASED, http: 409, condition: "Payment reverse attempted after its disbursement was RELEASED" }
  - { id: ERR_CLAIM_NOT_SETTLED, http: 409, condition: "Payment clear attempted on a claim that is not SETTLED/PAID" }
  - { id: ERR_POLICY_LIMIT_EXCEEDED, http: 409, condition: "Supplement/settlement amount exceeds the policy remaining limit" }
  - { id: ERR_STALE_CLAIM_VERSION, http: 412, condition: "expected_claim_version does not match current Claim.version at supplement create" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PublicAdjuster
    description: "Licensed public adjuster; files/documents/negotiates claims, invokes and manages appraisal, creates supplements, may release disbursements (subject to SoD)"
    identity: "entity_backed:Adjuster"
    exclusive_operations:
      - "POST /v1/claims — Create claim"
      - "POST /v1/claims/{id}/file — File claim"
      - "POST /v1/claims/{id}/schedule-inspection — Schedule inspection"
      - "POST /v1/claims/{id}/counter — Counter offer"
      - "POST /v1/claims/{id}/accept-settlement — Accept settlement"
      - "POST /v1/supplements — Create supplement"
      - "POST /v1/supplements/{id}/submit — Submit supplement"
    shared_operations:
      - "POST /v1/clients, POST /v1/policies — shared with FirmPrincipal"
      - "POST /v1/appraisals + name-appraisers/select-umpire/render-award/cancel — shared with FirmPrincipal"
      - "POST /v1/claims/{id}/withdraw — shared with FirmPrincipal"
      - "POST /v1/disbursements/{id}/release|hold|resume — shared with FirmPrincipal"

  - name: FirmPrincipal
    description: "Adjusting-firm principal/back office; onboards adjusters, manages licensing, signs off contracts, decides supplements, resolves disputes, may release disbursements"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/adjusters — Create adjuster"
      - "POST /v1/licenses + suspend/reinstate/revoke — Manage licenses"
      - "POST /v1/contracts — Create contract"
      - "POST /v1/contracts/{id}/activate — Activate contract"
      - "POST /v1/contracts/{id}/cancel — Cancel contract"
      - "POST /v1/supplements/{id}/decide — Decide supplement"
      - "POST /v1/disputes/{id}/review — Review dispute"
      - "POST /v1/disputes/{id}/resolve — Resolve dispute"
    shared_operations:
      - "POST /v1/clients, POST /v1/policies — shared with PublicAdjuster"
      - "POST /v1/appraisals + management — shared with PublicAdjuster"
      - "POST /v1/contracts/{id}/rescind — shared with Client"
      - "POST /v1/claims/{id}/withdraw — shared with PublicAdjuster"
      - "POST /v1/disbursements/{id}/release|hold|resume — shared with PublicAdjuster"
      - "POST /v1/payments/{id}/reverse — shared with Carrier"

  - name: Client
    description: "Policyholder being represented; signs/rescinds their own contract, raises and withdraws disputes, reads"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /v1/contracts/{id}/sign — Sign own contract"
    shared_operations:
      - "POST /v1/contracts/{id}/rescind — shared with FirmPrincipal"
      - "POST /v1/disputes, POST /v1/disputes/{id}/withdraw — shared with Carrier"

  - name: Carrier
    description: "Insurance carrier; records offers and payments, clears/reverses payments, lapses/cancels policies, raises/withdraws disputes"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/claims/{id}/record-offer — Record offer"
      - "POST /v1/payments — Record payment"
      - "POST /v1/payments/{id}/clear — Clear payment"
    shared_operations:
      - "POST /v1/policies/{id}/lapse|cancel — shared with FirmPrincipal"
      - "POST /v1/payments/{id}/reverse — shared with FirmPrincipal"
      - "POST /v1/disputes, POST /v1/disputes/{id}/withdraw — shared with Client"

  - name: System
    description: "Automatic actor for cascaded transitions (claim->PAID, contract->COMPLETED, supplement/disbursement voids) and the logical clock"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /v1/_clock/set_current_utc — set logical clock"
      - "POST /v1/appraisals/{id}/render-award — may be invoked by System"
