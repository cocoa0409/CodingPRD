          trigger:
            - { call: "POST /api/renewal-offers", payload: { agreement_id: "${ag}", season_id: "${s2}", proposed_fee_cents: 12400000, proposed_escalator_bp: 300, proposed_term_seasons: 1, response_due_on: "2027-01-10T00:00:00Z", expected_agreement_version: "${agv}" }, as: PremiumSalesRep, captures: { ro1: $.data.id } }
            - { call: "POST /api/renewal-offers", payload: { agreement_id: "${ag}", season_id: "${s2}", proposed_fee_cents: 12300000, proposed_escalator_bp: 300, proposed_term_seasons: 1, response_due_on: "2027-01-10T00:00:00Z", expected_agreement_version: "${agv}" }, as: PremiumSalesRep, captures: { err: $.data.error_id } }
            - { call: "GET /api/agreements/${ag}", payload: {}, as: PremiumSalesRep, captures: { agv2: $.data.version } }
            - { call: "POST /api/renewal-offers", payload: { agreement_id: "${ag}", season_id: "${s2}", proposed_fee_cents: 12300000, proposed_escalator_bp: 300, proposed_term_seasons: 1, response_due_on: "2027-01-10T00:00:00Z", expected_agreement_version: "${agv2}" }, as: PremiumSalesRep, captures: { ro2: $.data.id } }
