              captures: { job_status_filled: $.data.job_status }
          trigger:
            - call: "POST /api/jobs"
              payload: { job_symbol: "M-CHIGAL-17", craft: "CONDUCTOR", origin_terminal: "CHI", report_time: "2026-08-04T08:00:00Z", crew_required: 1 }
              as: CrewManager
