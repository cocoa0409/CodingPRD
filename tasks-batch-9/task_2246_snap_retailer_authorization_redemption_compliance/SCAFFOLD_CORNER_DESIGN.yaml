            - "eligible_subtotal_cents == 997 (798 staple + 199 seed)"
            - "ineligible_subtotal_cents == 2745 (1099 + 747 + 899)"
            - "tax_cents == 226 (2745 * 825 / 10000 = 226.4625 rounded half up)"
            - "ebt_tender_cents == 997 and other_tender_cents == 2971, NOT the 5000 offered"
            - "split_tender_applied == true"
            - "flagged_line_skus == [BEER-6PK, SOAP-BAR, ROTISSERIE] in request order"
            - "no partial row exists: GET /pos-transactions?store_id=${store_id} returns total_count == 1"

