  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: brand_mismatch_finding_cascades_to_conflict_hold
        grounds:
          - state_machines.AnimalLot.UNCHECKED_to_MISMATCHED
          - state_machines.BrandRegistration.ACTIVE_to_ENCUMBERED
          - state_machines.BrandApplication.SUBMITTED_to_CONFLICT_HOLD
          - entities.InspectionOrder.fields.hold_flag
          - entities.BrandRegistration.fields.encumbrance_count
        distinguishing_aspect: |
          Depth-4 chain originating at POST /animal-lots/{id}/finding with BRAND_MISMATCH: the lot
          disposition change causes the TheftInvestigation, the investigation causes the registration
          to become ENCUMBERED, and the encumbrance causes the pending renewal filing to enter
          CONFLICT_HOLD. Each hop is caused by the previous hop, not by the original request.
        test_recipe:
          setup:
            - "Owner A holds recorded brand 'K-BAR' RIGHT_RIB CATTLE MT, status ACTIVE, encumbrance_count 0."
            - "A RENEWAL filing on that record is SUBMITTED."
            - "An InspectionOrder for owner A is IN_FIELD with a 25-head lot read as carrying that brand and no finding yet."
