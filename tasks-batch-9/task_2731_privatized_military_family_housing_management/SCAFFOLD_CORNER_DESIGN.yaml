              payload: { installation_id: "${inst_id}", unit_code: "A-101", bedroom_count: 2, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /service-members"
              payload: { dodid: "1000000001", last_name: "Reyes", first_name: "Ana", branch: "ARMY", pay_grade: "E5" }
              as: PlatformAdmin
              captures: { sm1_id: "$.data.id" }
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "SPOUSE", date_of_birth: "1992-03-04", gender: "FEMALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2018-04-10", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2022-03-15", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /waitlist-applications"
              payload: { installation_id: "${inst_id}", service_member_id: "${sm1_id}", pcs_orders_date: "2026-08-25", expected_arrival_date: "2026-09-15", accessibility_required: false }
              as: ServiceMember
              as_user_id: "${sm1_id}"
              captures: { app1_id: "$.data.id" }
            - call: "POST /service-members"
              payload: { dodid: "1000000002", last_name: "Okafor", first_name: "Dele", branch: "ARMY", pay_grade: "E5" }
              as: PlatformAdmin
              captures: { sm2_id: "$.data.id" }
            - call: "POST /dependents"
              payload: { service_member_id: "${sm2_id}", relationship: "SPOUSE", date_of_birth: "1992-03-04", gender: "FEMALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm2_id}", relationship: "CHILD", date_of_birth: "2018-04-10", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm2_id}", relationship: "CHILD", date_of_birth: "2022-03-15", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /waitlist-applications"
