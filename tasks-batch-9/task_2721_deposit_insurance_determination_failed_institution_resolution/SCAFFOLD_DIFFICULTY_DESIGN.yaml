              payload: { tin_hash: "TIN-LENA-11", legal_name: "Lena Okafor", depositor_type: "NATURAL_PERSON", contact_email: "lena@example.com" }
              as: ClaimsAgent
              captures: { lena_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${instE_id}", primary_depositor_id: "${lena_id}", account_number: "L-0001", ownership_category: "SINGLE", balance_cents: 30000000, accrued_interest_cents: 0, opened_at: "2024-05-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { l1_id: $.data.id }
            - call: "POST /institutions/${instE_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 200, malformed_record_count: 4, reported_deposit_total_cents: 30000000 }
              as: ClosingManager
              captures: { subE_id: $.data.id }
            - call: "POST /readiness-submissions/${subE_id}/standardize"
              payload: {}
              as: ClosingManager
            - call: "GET /depositor-records/${lena_id}"
              as: ClaimsAgent
              captures: { lena_v: $.data.version }
            - call: "POST /insurance-determinations"
              payload: { depositor_record_id: "${lena_id}", expected_depositor_record_version: "${lena_v}" }
              as: ClaimsAgent
              captures: { lena_det_id: $.data.id }
          trigger:
            - call: "POST /insurance-determinations/${lena_det_id}/prepare"
              payload: { method_variant: "AGGREGATE_BY_CATEGORY" }
              as: ClaimsAgent
              as_user_id: "agent-001"
              captures: { gate_error_id: "$.data.error_id", gate_message: "$.data.message" }
            - call: "POST /institutions/${instE_id}/close"
              payload: {}
              as: ClosingManager
            - call: "POST /insurance-determinations/${lena_det_id}/prepare"
              payload: { method_variant: "AGGREGATE_BY_CATEGORY" }
              as: ClaimsAgent
              as_user_id: "agent-001"
          assert:
            - "trigger[0] returns HTTP 409 with data.error_id == 'ERR_INSTITUTION_NOT_CLOSED' while Institution.${instE_id}.status == RESOLUTION_READY"
            - "trigger[0] leaves InsuranceDetermination.${lena_det_id}.status == DRAFT, method_variant == null, insured_amount_cents == 0, uninsured_amount_cents == 0, prepared_by_user_id == null, prepared_at == null"
            - "trigger[0] leaves DepositAccount.${l1_id}.attributed_amount_cents == 0"
            - "trigger[1] response data.status == CLOSED_IN_RECEIVERSHIP and DepositAccount.${l1_id}.insurance_status == FROZEN_FOR_DETERMINATION"
            - "trigger[2] response data.status == PREPARED, data.method_variant == AGGREGATE_BY_CATEGORY, data.insured_amount_cents == 25000000, data.uninsured_amount_cents == 5000000, data.attributed_total_cents == 30000000"
            - "the determination's own state was DRAFT for both prepare attempts — only Institution.status differed"

      - name: release_hold_blocked_until_depositor_acknowledges_notice
        grounds:
          - validations[priority=50]
          - state_machines.DepositAccount.hold_status_HELD_to_RELEASED
          - state_machines.DepositorRecord.SENT_to_ACKNOWLEDGED
          - errors[ERR_NOTICE_NOT_ACKNOWLEDGED]
        distinguishing_aspect: |
          A DIFFERENT entity pair, DepositAccount -> DepositorRecord (not determination -> institution),
          and the gate is on a different dimension: the account's own hold_status is already HELD and
          eligible, and the certifier's role is correct. Only the parent depositor's notice_status
          (SENT vs ACKNOWLEDGED) decides. Note the asymmetry: the acknowledge call is made by the
          Depositor role, so the blocking state can only be cleared by a different actor than the one
          performing the release.
        test_recipe:
          setup:
            - "Institution 34579 is CLOSED_IN_RECEIVERSHIP; depositor Mira owns SINGLE accounts M-0001 = 20000000 (created first) and M-0002 = 9000001."
            - "Mira's determination is CERTIFIED under AGGREGATE_BY_CATEGORY, so both accounts are DETERMINED with hold_status HELD (2758622 and 1241379) and a ReceivershipCertificate of face 4000001 exists."
