            - call: "POST /construction/sites/${s_id}/print-jobs/${job_id}/transition"
              payload: { to_state: "COMPLETED" }
              as: PrintOperator
          trigger:
            - call: "POST /construction/sites/${s_id}/print-jobs/${job_id}/transition"
              payload: { to_state: "PRINTING" }
              as: PrintOperator
              captures: { err: $.data.error_id }
          assert:
            - "PrintJob.${job_id}.status == COMPLETED"
            - "err == ERR_INVALID_STATE"

      - name: permit_application_terminal_approved_lockdown
        claim_type: terminal_lockdown
        grounds:
          - state_machines.PermitApplication
        distinguishing_aspect: "An APPROVED PermitApplication is terminal; withdraw on it returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "PermitApplication APPROVED."
          setup_api_calls:
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/jurisdictions"
              payload: { code: "JK", name: "J-K", permits_prescriptive_printed_path: true, alternative_means_review_days: 30, weather_station_id: "WX" }
              as: PlatformAdmin
              captures: { j_id: $.data.id }
            - call: "POST /construction/structural-plans"
              payload: { title: "P3", structural_system: "PRINTED_WALL", wall_thickness_mm: 200, wall_height_mm: 3000, plan_area_m2: 80 }
