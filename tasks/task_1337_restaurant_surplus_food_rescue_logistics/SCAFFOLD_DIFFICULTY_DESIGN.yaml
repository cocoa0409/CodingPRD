# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Restaurant Surplus Food Rescue Logistics
# 9 rules x 2 instances = 18 instances. All calls reference SCAFFOLD.yaml §1.5.
# Common fixture literals (re-derived per instance; every test starts empty-DB):
#   Rate card RC: effective [2026-01-01T00:00:00Z, 2027-01-01T00:00:00Z)
#     COLD_HELD fmv 300 / basis 100, HOT_HELD 250 / 90, PRODUCE 180 / 60,
#     SHELF_STABLE 120 / 50 (cents per lb)
#   Default logical clock at startup: 2026-08-01T00:00:00Z
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- rule 1 ---
  - rule_id: dual_variant_calc
    instances:
      - name: tax_standard_vs_enhanced_diverge_for_identical_rescue
        grounds:
          - calculations.tax_substantiation_value
          - entities.DonorSite.fields.enhanced_deduction_eligible
          - entities.TaxReceipt.fields.deductible_value_cents
        distinguishing_aspect: |
          Dual-variant valuation on the DonorSite/TaxReceipt domain: two donors
          with byte-identical VERIFIED 50-lb COLD_HELD rescues differ ONLY in
          enhanced_deduction_eligible; the standard donor deducts 15000 cents
          (50 lb x 300) while the enhanced donor deducts 10000 cents
          (50 lb x min(200, 100+round_half_up(200/2))=200).
        test_recipe:
          setup:
            - "Rate card RC (COLD 300/100) effective [2026-01-01, 2027-01-01)"
            - "Donor DS (enhanced_deduction_eligible=false) and donor DE (enhanced_deduction_eligible=true), both ACTIVE"
            - "Agency AG accepts all categories, cold capacity 100; drivers V1, V2 ACTIVE, certified, capacity 500, slots 2, each with window 2026-08-02T09:00-15:00Z"
            - "Coolers C1, C2 (30 L each)"
            - "Each donor has one 50-lb COLD_HELD offer, window 2026-08-02T10:00-12:00Z, rescued: run VERIFIED with pickup 10:15Z @35.0F, arrival 13:15Z @39.0F, actual 50 lbs (0 danger minutes: both readings <= 41.0)"
          setup_api_calls:
            - call: "POST /api/rate-cards"
              payload: { effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", cold_held_fmv_cents_per_lb: 300, cold_held_basis_cents_per_lb: 100, hot_held_fmv_cents_per_lb: 250, hot_held_basis_cents_per_lb: 90, produce_fmv_cents_per_lb: 180, produce_basis_cents_per_lb: 60, shelf_stable_fmv_cents_per_lb: 120, shelf_stable_basis_cents_per_lb: 50 }
              as: DispatchAdmin
            - call: "POST /api/donor-sites"
              payload: { legal_name: "Std Bistro", ein: "111111111", contact_email: "s@bistro.example", enhanced_deduction_eligible: false }
              as: DispatchAdmin
              captures: { d_std: "$.data.id" }
            - call: "PATCH /api/donor-sites/${d_std}/status"
              payload: { target_status: "ACTIVE" }
              as: DispatchAdmin
            - call: "POST /api/donor-sites"
              payload: { legal_name: "Enh Bistro", ein: "222222222", contact_email: "e@bistro.example", enhanced_deduction_eligible: true }
              as: DispatchAdmin
              captures: { d_enh: "$.data.id" }
            - call: "PATCH /api/donor-sites/${d_enh}/status"
              payload: { target_status: "ACTIVE" }
              as: DispatchAdmin
            - call: "POST /api/recipient-agencies"
              payload: { name: "AG", accepts_categories: ["COLD_HELD", "HOT_HELD", "PRODUCE", "SHELF_STABLE"], capacity_cold_held_lbs: 100, capacity_hot_held_lbs: 50, capacity_produce_lbs: 200, capacity_shelf_stable_lbs: 100 }
              as: DispatchAdmin
              captures: { ag: "$.data.id" }
            - call: "POST /api/volunteer-drivers"
              payload: { full_name: "V One", email: "v1@example.com", vehicle_capacity_lbs: 500, cooler_slot_count: 2, cold_chain_certified: true }
              as: DispatchAdmin
              captures: { v1: "$.data.id" }
            - call: "PATCH /api/volunteer-drivers/${v1}/status"
              payload: { target_status: "ACTIVE" }
              as: DispatchAdmin
            - call: "POST /api/volunteer-drivers/${v1}/availability-windows"
              payload: { window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T15:00:00Z" }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/volunteer-drivers"
              payload: { full_name: "V Two", email: "v2@example.com", vehicle_capacity_lbs: 500, cooler_slot_count: 2, cold_chain_certified: true }
              as: DispatchAdmin
              captures: { v2: "$.data.id" }
            - call: "PATCH /api/volunteer-drivers/${v2}/status"
              payload: { target_status: "ACTIVE" }
              as: DispatchAdmin
            - call: "POST /api/volunteer-drivers/${v2}/availability-windows"
              payload: { window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T15:00:00Z" }
              as: VolunteerDriver
              as_user_id: "${v2}"
            - call: "POST /api/coolers"
              payload: { label: "C1", capacity_liters: 30 }
              as: DispatchAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /api/coolers"
              payload: { label: "C2", capacity_liters: 30 }
              as: DispatchAdmin
              captures: { c2: "$.data.id" }
            - call: "POST /api/donation-offers"
              payload: { donor_site_id: "${d_std}", food_category: "COLD_HELD", estimated_weight_lbs: 50, pickup_window_start: "2026-08-02T10:00:00Z", pickup_window_end: "2026-08-02T12:00:00Z" }
              as: DonorCoordinator
              as_user_id: "${d_std}"
              captures: { o_std: "$.data.id" }
            - call: "PATCH /api/donation-offers/${o_std}/status"
              payload: { target_status: "OPEN" }
              as: DonorCoordinator
              as_user_id: "${d_std}"
            - call: "POST /api/donation-offers"
              payload: { donor_site_id: "${d_enh}", food_category: "COLD_HELD", estimated_weight_lbs: 50, pickup_window_start: "2026-08-02T10:00:00Z", pickup_window_end: "2026-08-02T12:00:00Z" }
              as: DonorCoordinator
              as_user_id: "${d_enh}"
              captures: { o_enh: "$.data.id" }
            - call: "PATCH /api/donation-offers/${o_enh}/status"
              payload: { target_status: "OPEN" }
              as: DonorCoordinator
              as_user_id: "${d_enh}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:30:00Z" }
              as: DispatchAdmin
            - call: "GET /api/donation-offers/${o_std}"
              as: DispatchAdmin
              captures: { ov_std: "$.data.version" }
            - call: "POST /api/rescue-runs"
              payload: { offer_id: "${o_std}", expected_offer_version: "${ov_std}", driver_id: "${v1}", agency_id: "${ag}", cooler_ids: ["${c1}"] }
              as: DispatchAdmin
              captures: { r_std: "$.data.id" }
            - call: "POST /api/rescue-runs/${r_std}/respond"
              payload: { decision: "ACCEPT" }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:15:00Z" }
              as: DispatchAdmin
            - call: "POST /api/rescue-runs/${r_std}/record-pickup"
              payload: { pickup_time: "2026-08-02T10:15:00Z", pickup_temp_f: 35.0, attestation_confirmed: true }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T13:15:00Z" }
              as: DispatchAdmin
            - call: "POST /api/rescue-runs/${r_std}/record-delivery"
              payload: { arrival_time: "2026-08-02T13:15:00Z", arrival_temp_f: 39.0, actual_weight_lbs: 50 }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/rescue-runs/${r_std}/verify-delivery"
              as: AgencyCoordinator
              as_user_id: "${ag}"
            - call: "GET /api/donation-offers/${o_enh}"
              as: DispatchAdmin
              captures: { ov_enh: "$.data.version" }
            - call: "POST /api/rescue-runs"
              payload: { offer_id: "${o_enh}", expected_offer_version: "${ov_enh}", driver_id: "${v2}", agency_id: "${ag}", cooler_ids: ["${c2}"] }
              as: DispatchAdmin
              captures: { r_enh: "$.data.id" }
            - call: "POST /api/rescue-runs/${r_enh}/respond"
              payload: { decision: "ACCEPT" }
              as: VolunteerDriver
              as_user_id: "${v2}"
            - call: "POST /api/rescue-runs/${r_enh}/record-pickup"
              payload: { pickup_time: "2026-08-02T10:15:00Z", pickup_temp_f: 35.0, attestation_confirmed: true }
              as: VolunteerDriver
              as_user_id: "${v2}"
            - call: "POST /api/rescue-runs/${r_enh}/record-delivery"
              payload: { arrival_time: "2026-08-02T13:15:00Z", arrival_temp_f: 39.0, actual_weight_lbs: 50 }
              as: VolunteerDriver
              as_user_id: "${v2}"
            - call: "POST /api/rescue-runs/${r_enh}/verify-delivery"
              as: AgencyCoordinator
              as_user_id: "${ag}"
          trigger:
            - call: "GET /api/donor-sites/${d_std}"
              as: DispatchAdmin
              captures: { dv_std: "$.data.version" }
            - call: "POST /api/donor-sites/${d_std}/tax-receipts"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", expected_donor_version: "${dv_std}" }
              as: DispatchAdmin
              captures: { rc_std_total_std: "$.data.total_standard_value_cents", rc_std_total_enh: "$.data.total_enhanced_value_cents", rc_std_ded: "$.data.deductible_value_cents" }
            - call: "GET /api/donor-sites/${d_enh}"
              as: DispatchAdmin
              captures: { dv_enh: "$.data.version" }
            - call: "POST /api/donor-sites/${d_enh}/tax-receipts"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", expected_donor_version: "${dv_enh}" }
              as: DispatchAdmin
              captures: { rc_enh_ded: "$.data.deductible_value_cents" }
          assert:
            - "rc_std_total_std == 15000 (50 lbs x 300 cents)"
            - "rc_std_total_enh == 10000 (50 lbs x min(200, 100+round_half_up(100))=200)"
            - "rc_std_ded == 15000 (standard variant selected: enhanced_deduction_eligible=false)"
            - "rc_enh_ded == 10000 (enhanced variant selected: same rescue data, different deductible)"
            - "Deducible values differ by exactly 5000 cents for identical inputs"

      - name: estimated_vs_verified_weight_diverge_for_same_rescue
        grounds:
          - calculations.estimated_vs_verified_weight
          - entities.DonorSite.fields.pending_estimated_lbs
          - entities.DonorSite.fields.lifetime_weight_lbs
        distinguishing_aspect: |
          Dual-variant weight accounting on the DonationOffer/RescueRun domain
          (distinct from instance 1's DonorSite/TaxReceipt domain): while the
          run is in flight the donor carries the ESTIMATED 80 lbs; after
          verify-delivery the same rescue contributes the VERIFIED 60 lbs —
          pending_estimated_lbs drops 80 -> 0 while lifetime_weight_lbs rises
          0 -> 60, so the two variants report different numbers for one rescue.
        test_recipe:
          setup:
            - "Donor D ACTIVE (enhanced flag irrelevant); agency AG accepts COLD_HELD capacity 100; driver V1 ACTIVE certified capacity 500 slots 2 with window 2026-08-02T09:00-15:00Z; cooler C1 30L"
            - "Offer O: COLD_HELD, estimated 80 lbs, window 2026-08-02T10:00-12:00Z, published"
            - "Run R dispatched, accepted; pickup 2026-08-02T10:15Z @35.0F; delivery 13:15Z @39.0F with actual_weight_lbs 60 (<= ceil(80*1.25)=100, so no overage)"
          setup_api_calls:
            - call: "POST /api/donor-sites"
              payload: { legal_name: "Var Bistro", ein: "333333333", contact_email: "v@bistro.example" }
              as: DispatchAdmin
              captures: { d: "$.data.id" }
            - call: "PATCH /api/donor-sites/${d}/status"
              payload: { target_status: "ACTIVE" }
              as: DispatchAdmin
            - call: "POST /api/recipient-agencies"
              payload: { name: "AG", accepts_categories: ["COLD_HELD"], capacity_cold_held_lbs: 100, capacity_hot_held_lbs: 0, capacity_produce_lbs: 0, capacity_shelf_stable_lbs: 0 }
              as: DispatchAdmin
              captures: { ag: "$.data.id" }
            - call: "POST /api/volunteer-drivers"
              payload: { full_name: "V One", email: "v1@example.com", vehicle_capacity_lbs: 500, cooler_slot_count: 2, cold_chain_certified: true }
              as: DispatchAdmin
              captures: { v1: "$.data.id" }
            - call: "PATCH /api/volunteer-drivers/${v1}/status"
              payload: { target_status: "ACTIVE" }
              as: DispatchAdmin
            - call: "POST /api/volunteer-drivers/${v1}/availability-windows"
              payload: { window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T15:00:00Z" }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/coolers"
              payload: { label: "C1", capacity_liters: 30 }
              as: DispatchAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /api/donation-offers"
              payload: { donor_site_id: "${d}", food_category: "COLD_HELD", estimated_weight_lbs: 80, pickup_window_start: "2026-08-02T10:00:00Z", pickup_window_end: "2026-08-02T12:00:00Z" }
              as: DonorCoordinator
              as_user_id: "${d}"
              captures: { o: "$.data.id" }
            - call: "PATCH /api/donation-offers/${o}/status"
              payload: { target_status: "OPEN" }
              as: DonorCoordinator
              as_user_id: "${d}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:30:00Z" }
              as: DispatchAdmin
            - call: "GET /api/donation-offers/${o}"
              as: DispatchAdmin
              captures: { ov: "$.data.version" }
            - call: "POST /api/rescue-runs"
              payload: { offer_id: "${o}", expected_offer_version: "${ov}", driver_id: "${v1}", agency_id: "${ag}", cooler_ids: ["${c1}"] }
              as: DispatchAdmin
              captures: { r: "$.data.id" }
            - call: "POST /api/rescue-runs/${r}/respond"
              payload: { decision: "ACCEPT" }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:15:00Z" }
              as: DispatchAdmin
            - call: "POST /api/rescue-runs/${r}/record-pickup"
              payload: { pickup_time: "2026-08-02T10:15:00Z", pickup_temp_f: 35.0, attestation_confirmed: true }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T13:15:00Z" }
              as: DispatchAdmin
            - call: "POST /api/rescue-runs/${r}/record-delivery"
              payload: { arrival_time: "2026-08-02T13:15:00Z", arrival_temp_f: 39.0, actual_weight_lbs: 60 }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "GET /api/donor-sites/${d}"
              as: DispatchAdmin
              captures: { pend_before: "$.data.pending_estimated_lbs", life_before: "$.data.lifetime_weight_lbs" }
          trigger:
            - call: "POST /api/rescue-runs/${r}/verify-delivery"
              as: AgencyCoordinator
              as_user_id: "${ag}"
            - call: "GET /api/donor-sites/${d}"
              as: DispatchAdmin
              captures: { pend_after: "$.data.pending_estimated_lbs", life_after: "$.data.lifetime_weight_lbs" }
          assert:
            - "pend_before == 80 (estimated variant while run in flight)"
            - "life_before == 0"
            - "pend_after == 0"
            - "life_after == 60 (verified variant after verify-delivery)"
            - "The two variants disagree on the same rescue: 80 estimated vs 60 verified"
  # ---------------------------------------------------------------- rule 2 ---
  - rule_id: combinatorial_formula
    instances:
      - name: enhanced_rate_rounded_per_lb_before_multiply
        grounds:
          - calculations.tax_substantiation_value
        distinguishing_aspect: |
          Mode (b) nested-rounding: the scaffold pins per-lb-then-multiply.
          With fmv=151, basis=100, weight=10 the pinned order yields
          10 x (100 + round_half_up(51/2)) = 10 x 126 = 1260 cents; the
          alternative round-after-multiply order yields round(10 x 125.5) =
          1255 cents. The assertion fails on any implementation that rounds
          the line total instead of the per-lb rate.
        test_recipe:
          setup:
            - "Rate card with COLD_HELD fmv 151 / basis 100 effective [2026-01-01, 2027-01-01)"
            - "Donor D ACTIVE with enhanced_deduction_eligible=true; agency AG cold capacity 100; driver V1 ACTIVE certified with window 2026-08-02T09:00-15:00Z; cooler C1 30L"
            - "One 10-lb COLD_HELD offer rescued to VERIFIED (pickup 10:15Z @35.0F, arrival 13:15Z @39.0F, actual 10 lbs)"
          setup_api_calls:
            - call: "POST /api/rate-cards"
              payload: { effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", cold_held_fmv_cents_per_lb: 151, cold_held_basis_cents_per_lb: 100, hot_held_fmv_cents_per_lb: 250, hot_held_basis_cents_per_lb: 90, produce_fmv_cents_per_lb: 180, produce_basis_cents_per_lb: 60, shelf_stable_fmv_cents_per_lb: 120, shelf_stable_basis_cents_per_lb: 50 }
              as: DispatchAdmin
            - call: "POST /api/donor-sites"
              payload: { legal_name: "Round Bistro", ein: "444444444", contact_email: "r@bistro.example", enhanced_deduction_eligible: true }
              as: DispatchAdmin
              captures: { d: "$.data.id" }
            - call: "PATCH /api/donor-sites/${d}/status"
              payload: { target_status: "ACTIVE" }
              as: DispatchAdmin
            - call: "POST /api/recipient-agencies"
              payload: { name: "AG", accepts_categories: ["COLD_HELD"], capacity_cold_held_lbs: 100, capacity_hot_held_lbs: 0, capacity_produce_lbs: 0, capacity_shelf_stable_lbs: 0 }
              as: DispatchAdmin
              captures: { ag: "$.data.id" }
            - call: "POST /api/volunteer-drivers"
              payload: { full_name: "V One", email: "v1@example.com", vehicle_capacity_lbs: 500, cooler_slot_count: 2, cold_chain_certified: true }
              as: DispatchAdmin
              captures: { v1: "$.data.id" }
            - call: "PATCH /api/volunteer-drivers/${v1}/status"
              payload: { target_status: "ACTIVE" }
              as: DispatchAdmin
            - call: "POST /api/volunteer-drivers/${v1}/availability-windows"
              payload: { window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T15:00:00Z" }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/coolers"
              payload: { label: "C1", capacity_liters: 30 }
              as: DispatchAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /api/donation-offers"
              payload: { donor_site_id: "${d}", food_category: "COLD_HELD", estimated_weight_lbs: 10, pickup_window_start: "2026-08-02T10:00:00Z", pickup_window_end: "2026-08-02T12:00:00Z" }
              as: DonorCoordinator
              as_user_id: "${d}"
              captures: { o: "$.data.id" }
            - call: "PATCH /api/donation-offers/${o}/status"
              payload: { target_status: "OPEN" }
              as: DonorCoordinator
              as_user_id: "${d}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:30:00Z" }
              as: DispatchAdmin
            - call: "GET /api/donation-offers/${o}"
              as: DispatchAdmin
              captures: { ov: "$.data.version" }
            - call: "POST /api/rescue-runs"
              payload: { offer_id: "${o}", expected_offer_version: "${ov}", driver_id: "${v1}", agency_id: "${ag}", cooler_ids: ["${c1}"] }
              as: DispatchAdmin
              captures: { r: "$.data.id" }
            - call: "POST /api/rescue-runs/${r}/respond"
              payload: { decision: "ACCEPT" }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:15:00Z" }
              as: DispatchAdmin
            - call: "POST /api/rescue-runs/${r}/record-pickup"
              payload: { pickup_time: "2026-08-02T10:15:00Z", pickup_temp_f: 35.0, attestation_confirmed: true }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T13:15:00Z" }
              as: DispatchAdmin
            - call: "POST /api/rescue-runs/${r}/record-delivery"
              payload: { arrival_time: "2026-08-02T13:15:00Z", arrival_temp_f: 39.0, actual_weight_lbs: 10 }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/rescue-runs/${r}/verify-delivery"
              as: AgencyCoordinator
              as_user_id: "${ag}"
          trigger:
            - call: "GET /api/donor-sites/${d}"
              as: DispatchAdmin
              captures: { dv: "$.data.version" }
            - call: "POST /api/donor-sites/${d}/tax-receipts"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", expected_donor_version: "${dv}" }
              as: DispatchAdmin
              captures: { tot_std: "$.data.total_standard_value_cents", tot_enh: "$.data.total_enhanced_value_cents", ded: "$.data.deductible_value_cents" }
          assert:
            - "tot_std == 1510 (10 x 151)"
            - "tot_enh == 1260 (10 x 126 with per-lb round_half_up of 25.5 -> 26 BEFORE multiply)"
            - "tot_enh != 1255 (the round-after-multiply value)"
            - "ded == 1260"

      - name: danger_zone_interpolation_multibranch
        grounds:
          - calculations.danger_zone_compliance_verdict
        distinguishing_aspect: |
          Mode (a) multi-input non-linear formula (distinct from the
          nested-rounding mode of instance 1): verdict depends on category
          branch (HOT_HELD mirror-image danger band), both endpoint
          temperatures, and the span, via linear crossing interpolation.
          Same pickup 140.0F: a 160-minute span to 130.0F yields 80 danger
          minutes (COMPLIANT) while a 400-minute span to 120.0F yields 300
          (VIOLATION).
        test_recipe:
          setup:
            - "Donor D ACTIVE; agency AG accepts HOT_HELD capacity 50; drivers V1, V2 ACTIVE certified, each window 2026-08-02T09:00-18:00Z; coolers C1, C2 30L"
            - "Two HOT_HELD offers est 20 lbs, window 2026-08-02T10:00-12:00Z, both OPEN; run RA on C1/V1 and run RB on C2/V2, both CONFIRMED"
          setup_api_calls:
            - call: "POST /api/donor-sites"
              payload: { legal_name: "Hot Bistro", ein: "555555555", contact_email: "h@bistro.example" }
