        distinguishing_aspect: "A FROZEN account rejects BOTH a new submission (ERR_ACCOUNT_FROZEN) and adjudication-APPROVE of its existing UNDER_REVIEW submission (same error), while adjudication-REJECT still works — the freeze gates value-creation, not disposition."
        test_recipe:
          setup: ["Store S; program P ACTIVE item AAA 0.11; account AC; receipts R1 (AAA @ 10000) and R2 (AAA @ 5000) both purchased 2026-09-08; R1 submitted (UNDER_REVIEW); AC frozen."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores"
              payload: { store_code: "S-ERR3", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
