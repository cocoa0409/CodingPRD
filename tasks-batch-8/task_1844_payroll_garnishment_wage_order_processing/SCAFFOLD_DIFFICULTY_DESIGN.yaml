              payload: { legal_name: "E", fein: "18-1818181", remittance_timing: "SAME_DAY", payroll_calendar: { period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15" }, administrative_fee_policy: "NONE" }
              as: employer_payroll_admin
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "W", work_state_code: "CA", pay_frequency: "SEMIMONTHLY", hourly_rate_cents: 0, expected_employer_version: "${emp_v}" }
              as: payroll_specialist
              captures: { ee_id: $.data.id, ee_v: $.data.version }
            - call: "POST /employees/${ee_id}/orders"
              payload: { issuing_authority_id: "${auth_cs}", case_number: "CS-M", order_type: "CHILD_SUPPORT", amount_model: "LUMP_SUM_BALANCE", amount_value: 0, total_balance_cents: 50000, effective_date: "2026-08-01", expected_employee_version: "${ee_v}" }
              as: payroll_specialist
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/validate"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_id}/notify"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_id}/activate"
              payload: {}
              as: payroll_specialist
            - call: "GET /employers/${emp_id}"
              as: payroll_specialist
              captures: { emp_v2: $.data.version }
            - call: "POST /payroll-runs"
              payload: { employer_id: "${emp_id}", period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15", expected_employer_version: "${emp_v2}" }
              as: payroll_specialist
              captures: { run_id: $.data.id }
            - call: "POST /payroll-runs/${run_id}/statements"
              payload: { employee_id: "${ee_id}", gross_earnings_cents: 150000, mandatory_deductions_cents: 30000 }
