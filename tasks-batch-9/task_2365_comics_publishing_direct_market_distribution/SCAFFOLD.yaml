scenario: "2365. Comics Publishing & Direct Market Distribution (comic book publisher): title greenlight with creative team assignment, page rate and royalty terms, production schedule across script, pencils, inks, colors and letters with slip management, solicitation catalog submission with cover images and copy months before release, retailer order collection with variant cover incentive tiers driving order quantities, print run determination from orders with reprint and second printing decisions, direct market distribution with retailer discount tiers and non-returnable terms, digital and collected edition scheduling with sales cannibalization considerations, creator royalty accounting across print, digital, collected and subsidiary rights"
domain_name: "comics-direct-market-publishing"
api_prefix: "/comics"

complexity_profile:
  difficulty_level: expert_plus          # above the §0.4 Expert band: 14 entities, 65 endpoints, 30 errors, 7 calculations, 9 state machines
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: hybrid
  # Title -> Issue -> {ProductionStage, VariantCover, PrintRun, ReleaseWindow, RevenueEvent} is a strict
  # ownership tree, but CreativeAssignment (Title x Creator), Solicitation (Catalog x Issue),
  # RetailerOrder (Retailer x Issue) and RoyaltyStatement (Title x Creator) are cross-cutting
  # association entities that span the tree.

  state_machine_shape: parallel
  # Issue carries two independent dimensions (production_status x commercial_status) plus a derived
  # schedule_health posture; CreativeAssignment is cyclic (PROPOSED<->COUNTERED negotiation rounds);
  # ProductionStage is cyclic (DELIVERED->KICKED_BACK->IN_PROGRESS revision loop); Title and Issue
  # production_status are compound (derived from children).

  relationship_patterns:
    - one_to_many          # Title->Issue, Issue->ProductionStage/VariantCover/PrintRun/RevenueEvent
    - many_to_many         # CreativeAssignment (Title x Creator), RetailerOrder (Retailer x Issue)
    - cross_aggregate      # Solicitation links a Catalog aggregate to an Issue aggregate;
                           # RoyaltyStatement reads RevenueEvent rows across the Title's Issues

  role_model: segregation_of_duties
  # A RoyaltyStatement may not be paid by the same X-User-ID that issued it. Editorial roles
  # (EditorInChief / ManagingEditor) own creative and production surface, SalesDirector owns
  # commercial surface, RoyaltyAccountant owns money-out surface; none can do another's exclusive work.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Creator
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Creator legal name as it appears on the credits page."
        constraints: "1..120 chars"
      - name: crafts
        type: array
        source: input
        description: "Crafts this creator may be assigned to."
        constraints: "non-empty array of distinct enum values from {SCRIPT, PENCILS, INKS, COLORS, LETTERS, COVER}"
      - name: default_page_rate_cents
        type: integer
        source: input
        description: "Fallback page rate quoted to this creator when a title does not override it."
        constraints: ">= 0"
      - name: active_assignment_count
        type: integer
        source: computed
        description: "Count of this creator's CreativeAssignment rows with status IN {PROPOSED, COUNTERED, ACCEPTED, ACTIVE}."
        default: 0

  - name: Title
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Series title as solicited."
        constraints: "1..160 chars, unique across Title"
      - name: planned_issue_count
        type: integer
        source: input
        description: "Number of issues in the greenlit run."
        constraints: ">= 1 and <= 24"
      - name: royalty_pool_bps
        type: integer
        source: input
        description: "Basis points of channel net receipts that form the creator royalty pool."
        constraints: "1..3000"
      - name: cover_participation_bps
        type: integer
        source: input
        description: "Basis points of the channel pool paid out to COVER-craft assignments before the pro-rata split."
        constraints: "0..3000"
      - name: status
        type: enum
        source: system
        description: "Title lifecycle state."
        default: PITCHED
        constraints: "PITCHED | GREENLIT | IN_PRODUCTION | PUBLISHING | COMPLETED | CANCELLED"
      - name: greenlit_at
        type: datetime
        source: system
        description: "Logical-clock instant of the greenlight transition; null while PITCHED."
      - name: committed_share_bps
        type: integer
        source: computed
        description: "Sum of royalty_share_bps over this title's non-COVER CreativeAssignment rows with status IN {ACCEPTED, ACTIVE, COMPLETED}."
        default: 0
      - name: production_cost_cents
        type: integer
        source: computed
        description: "Running page-fee ledger: sum of ProductionStage.page_fee_cents over stages with status == APPROVED on this title's issues."
        default: 0
      - name: royalty_accrued_cents
        type: integer
        source: computed
        description: "Running royalty ledger: sum of RoyaltyStatement.payable_cents over this title's statements with status IN {ISSUED, PAID}."
        default: 0
      - name: cancel_reason
        type: string
        source: system
        description: "Reason captured on the CANCELLED transition; null otherwise."

  - name: CreativeAssignment
    parent: Title
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; the series this assignment staffs."
      - name: creator_id
        type: string
        source: input
        description: "FK -> Creator.id; the assigned creator."
      - name: craft
        type: enum
        source: input
        description: "Craft slot this assignment fills; MUST be a member of Creator.crafts."
        constraints: "SCRIPT | PENCILS | INKS | COLORS | LETTERS | COVER"
      - name: page_rate_cents
        type: integer
        source: input
        description: "Currently proposed (or agreed) page rate per delivered page."
        constraints: ">= 0"
      - name: royalty_share_bps
        type: integer
        source: input
        description: "Currently proposed (or agreed) share of the post-cover pool remainder, in basis points."
        constraints: "0..10000"
      - name: booking_start_date
        type: datetime
        source: input
        description: "Inclusive start of the creator's studio booking for this assignment (date at 00:00:00Z)."
      - name: booking_end_date
        type: datetime
        source: input
        description: "EXCLUSIVE end of the creator's studio booking (date at 00:00:00Z); MUST be strictly after booking_start_date."
      - name: advance_cents
        type: integer
        source: input
        description: "Recoupable advance paid against future royalties."
        default: 0
        constraints: ">= 0"
      - name: unrecouped_advance_cents
        type: integer
        source: computed
        description: "Advance balance still to be recouped; initialised to advance_cents at creation, decreased by RoyaltyStatement.recoupment_applied_cents on statement issue, restored on statement reversal."
      - name: status
        type: enum
        source: system
        description: "Negotiation and engagement state."
        default: PROPOSED
        constraints: "PROPOSED | COUNTERED | ACCEPTED | ACTIVE | COMPLETED | TERMINATED"
      - name: negotiation_round
        type: integer
        source: system
        description: "1 on creation; incremented by each repropose. A 4th round is refused."
        default: 1
      - name: counter_page_rate_cents
        type: integer
        source: system
        description: "Page rate the creator asked for on the latest counter; null until a counter happens."
      - name: counter_royalty_share_bps
        type: integer
        source: system
        description: "Royalty share the creator asked for on the latest counter; null until a counter happens."
      - name: terminated_reason
        type: string
        source: system
        description: "Reason captured on the TERMINATED transition; null otherwise."

  - name: Issue
    parent: Title
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; owning series."
      - name: issue_number
        type: integer
        source: input
        description: "Issue number within the title; unique per title."
        constraints: ">= 1"
      - name: page_count
        type: integer
        source: input
        description: "Interior page count used for page-fee and delivery validation."
        constraints: "1..64"
      - name: cover_price_cents
        type: integer
        source: input
        description: "Standard cover price."
        constraints: ">= 1"
      - name: target_on_sale_date
        type: datetime
        source: input
        description: "Planned direct-market on-sale date (date at 00:00:00Z)."
      - name: foc_date
        type: datetime
        source: computed
        description: "Final Order Cutoff = target_on_sale_date minus FOC_LEAD_DAYS (21) calendar days."
      - name: production_status
        type: enum
        source: computed
        description: "Production dimension, re-derived from this issue's ProductionStage rows after every stage transition."
        default: PLANNED
        constraints: "PLANNED | SCRIPTING | ART | PREPRESS | CAMERA_READY | CANCELLED"
      - name: commercial_status
        type: enum
        source: system
        description: "Commercial dimension, advanced by solicitation/FOC/print/release actions independently of production_status."
        default: UNSOLICITED
        constraints: "UNSOLICITED | SOLICITED | FOC_LOCKED | PRINTED | ON_SALE | CANCELLED"
      - name: schedule_health
        type: enum
        source: computed
        description: "Slip posture derived from total_slip_days by the schedule_health_posture calculation."
        default: ON_TRACK
        constraints: "ON_TRACK | AT_RISK | SLIPPED"
      - name: total_slip_days
        type: integer
        source: computed
        description: "Sum of ProductionStage.slip_days over this issue's stages with status IN {DELIVERED, KICKED_BACK, APPROVED}."
        default: 0
      - name: total_ordered_units
        type: integer
        source: computed
        description: "Sum of RetailerOrder.total_units over this issue's orders with status IN {FOC_LOCKED, INVOICED, SHIPPED}."
        default: 0
      - name: printed_units
        type: integer
        source: computed
        description: "Sum of PrintRun.quantity over this issue's runs with status == PRINTED."
        default: 0
      - name: shipped_units
        type: integer
        source: computed
        description: "Sum of RetailerOrder.total_units over this issue's orders with status == SHIPPED."
        default: 0
      - name: on_sale_date
        type: datetime
        source: system
        description: "Logical-clock instant stamped when commercial_status becomes ON_SALE; null before release."

  - name: ProductionStage
    parent: Issue
    common_fields: true
    fields:
      - name: issue_id
        type: string
        source: input
        description: "FK -> Issue.id; the issue being produced."
      - name: assignment_id
        type: string
        source: input
        description: "FK -> CreativeAssignment.id; the engagement that performs this stage. Its title_id MUST equal the issue's title_id."
      - name: craft
        type: enum
        source: input
        description: "Production craft; MUST equal the referenced assignment's craft."
        constraints: "SCRIPT | PENCILS | INKS | COLORS | LETTERS | COVER"
      - name: planned_start_date
        type: datetime
        source: input
        description: "Scheduled start (date at 00:00:00Z)."
      - name: planned_due_date
        type: datetime
        source: input
        description: "Scheduled delivery date (date at 00:00:00Z); MUST be >= planned_start_date."
      - name: actual_delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent deliver call; null until first delivery."
      - name: delivered_pages
        type: integer
        source: system
        description: "Pages accepted on the most recent deliver call; null until first delivery."
      - name: slip_days
        type: integer
        source: computed
        description: "Whole calendar days late on the most recent delivery, floored at 0; recomputed (not accumulated) on every deliver."
        default: 0
      - name: page_fee_cents
        type: integer
        source: computed
        description: "assignment.page_rate_cents * delivered_pages, frozen at the APPROVED transition; 0 before approval."
        default: 0
      - name: kickback_count
        type: integer
        source: system
        description: "Number of times this stage has been kicked back."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Stage state; DELIVERED->KICKED_BACK->IN_PROGRESS forms the revision loop."
        default: NOT_STARTED
        constraints: "NOT_STARTED | IN_PROGRESS | DELIVERED | KICKED_BACK | APPROVED | CANCELLED"

  - name: Catalog
    parent: null
    common_fields: true
    fields:
      - name: solicitation_month
        type: string
        source: input
        description: "Catalog month in which the solicitation copy is printed, YYYY-MM."
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$, unique across Catalog"
      - name: submission_deadline
        type: datetime
        source: input
        description: "Last logical-clock instant at which a Solicitation may be submitted into this catalog (inclusive)."
      - name: on_sale_month
        type: string
        source: input
        description: "Month whose issues this catalog solicits, YYYY-MM; MUST be strictly after solicitation_month."
      - name: max_slots
        type: integer
        source: input
        description: "Hard cap on ACCEPTED solicitations in this catalog."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Catalog lifecycle."
        default: OPEN
        constraints: "OPEN | LOCKED | PUBLISHED"
      - name: accepted_slot_count
        type: integer
        source: computed
        description: "Count of this catalog's Solicitation rows with status == ACCEPTED."
        default: 0
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant of publication; null before PUBLISHED."

  - name: Solicitation
    parent: Catalog
    common_fields: true
    fields:
      - name: catalog_id
        type: string
        source: input
        description: "FK -> Catalog.id; the catalog this listing is submitted into."
      - name: issue_id
        type: string
        source: input
        description: "FK -> Issue.id; the issue being solicited."
      - name: cover_image_url
        type: string
        source: input
        description: "URL of the solicitation cover image."
        constraints: "must start with https://"
      - name: copy_text
        type: string
        source: input
        description: "Solicitation copy printed in the catalog."
        constraints: "40..1200 chars"
      - name: variant_cover_ids
        type: array
        source: input
        description: "VariantCover ids listed in the catalog copy; each MUST belong to issue_id. Plain id array, not a single-target foreign key."
        default: []
      - name: status
        type: enum
        source: system
        description: "Listing state."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | ACCEPTED | WITHDRAWN"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of submission; null while DRAFT."
      - name: withdrawn_reason
        type: string
        source: system
        description: "Reason captured on the WITHDRAWN transition (operator-supplied, or 'AUTO_SLIP' when withdrawn by the slip cascade)."

  - name: VariantCover
    parent: Issue
    common_fields: false
    fields:
      - name: issue_id
        type: string
        source: input
        description: "FK -> Issue.id; the issue this cover belongs to."
      - name: code
        type: string
        source: input
        description: "Cover letter/code as printed in the catalog."
        constraints: "1..8 chars, unique per issue_id"
      - name: kind
        type: enum
        source: input
        description: "Cover kind driving order allocation."
        constraints: "STANDARD | RATIO_INCENTIVE | RETAILER_EXCLUSIVE"
      - name: incentive_ratio
        type: integer
        source: input
        description: "Standard copies a retailer must order to earn one of these covers; REQUIRED when kind == RATIO_INCENTIVE, MUST be omitted otherwise."
        constraints: "one of {10, 25, 50, 100}"
      - name: cover_price_cents
        type: integer
        source: input
        description: "Billed cover price for copies of this cover."
        constraints: ">= 1"
      - name: allocation_cap
        type: integer
        source: input
        description: "Maximum copies of this cover any single order may earn; null means uncapped."
        constraints: ">= 1 when present"

  - name: Retailer
    parent: null
    common_fields: true
    fields:
      - name: account_no
        type: string
        source: input
        description: "Direct-market account number."
        constraints: "unique across Retailer"
      - name: name
        type: string
        source: input
        description: "Retail store name."
      - name: credit_limit_cents
        type: integer
        source: input
        description: "Maximum open balance the account may carry."
        constraints: ">= 0"
      - name: non_returnable_ack
        type: boolean
        source: input
        description: "True once the retailer has acknowledged non-returnable direct-market terms."
      - name: opening_units_ytd
        type: integer
        source: input
        description: "Units already billed this year before this system took over the account."
        default: 0
        constraints: ">= 0"
      - name: cumulative_units_ytd
        type: integer
        source: computed
        description: "opening_units_ytd plus the sum of this retailer's RetailerOrder.total_units for orders with status IN {FOC_LOCKED, INVOICED, SHIPPED}."
      - name: open_balance_cents
        type: integer
        source: computed
        description: "Sum of RetailerOrder.invoice_total_cents over this retailer's orders with status IN {INVOICED, SHIPPED}."
        default: 0
      - name: discount_tier
        type: enum
        source: computed
        description: "Tier selected from cumulative_units_ytd by the retailer_discount_tier calculation."
        default: ENTRY
        constraints: "ENTRY | BASIC | CORE | PREMIER"
      - name: status
        type: enum
        source: system
        description: "Account state; SUSPENDED accounts may not submit or be invoiced."
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"
      - name: suspension_reason
        type: string
        source: system
        description: "Reason captured when the account was suspended; null while ACTIVE."

  - name: RetailerOrder
    parent: null
    common_fields: true
    fields:
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; ordering account."
      - name: issue_id
        type: string
        source: input
        description: "FK -> Issue.id; ordered issue."
      - name: standard_qty
        type: integer
        source: input
        description: "Copies of the STANDARD cover ordered; the only quantity that earns incentive covers."
        constraints: ">= 1"
      - name: exclusive_variant_qty
        type: integer
        source: input
        description: "Retailer-exclusive copies requested; capped by the variant_incentive_allocation calculation."
        default: 0
        constraints: ">= 0"
      - name: earned_variant_allocations
        type: array
        source: computed
        description: "Frozen at FOC lock: array of { variant_cover_id, qty } objects, one per earned cover."
        default: []
      - name: total_units
        type: integer
        source: computed
        description: "standard_qty plus the sum of earned_variant_allocations[].qty; 0 until FOC lock."
        default: 0
      - name: is_reorder
        type: boolean
        source: computed
        description: "True when the order was created while its issue's commercial_status == ON_SALE; reorders never earn incentive covers."
        default: false
      - name: discount_tier_applied
        type: enum
        source: system
        description: "Tier frozen onto the invoice; null before invoicing."
        constraints: "ENTRY | BASIC | CORE | PREMIER"
      - name: merchandise_net_cents
        type: integer
        source: computed
        description: "Sum of per-line discounted amounts from the retailer_invoice_total calculation; 0 before invoicing."
        default: 0
      - name: handling_fee_cents
        type: integer
        source: computed
        description: "Flat handling fee, waived above FREE_HANDLING_THRESHOLD_CENTS; 0 before invoicing."
        default: 0
      - name: invoice_total_cents
        type: integer
        source: computed
        description: "merchandise_net_cents + handling_fee_cents; 0 before invoicing."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Order state."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | FOC_LOCKED | INVOICED | SHIPPED | CANCELLED"
      - name: cancel_reason
        type: string
        source: system
        description: "Reason captured on the CANCELLED transition ('AUTO_SLIP' / 'AUTO_TITLE_CANCEL' when cancelled by a cascade)."

  - name: PrintRun
    parent: Issue
    common_fields: true
    fields:
      - name: issue_id
        type: string
        source: input
        description: "FK -> Issue.id; the issue being printed."
      - name: printing_number
        type: integer
        source: computed
        description: "1 for the first printing; otherwise max(printing_number of this issue's runs with status IN {PLANNED, PRINTED}) + 1."
      - name: basis
        type: enum
        source: input
        description: "Which print_run_quantity variant computes quantity."
        constraints: "ORDER_DRIVEN | DEMAND_FORECAST"
      - name: quantity
        type: integer
        source: computed
        description: "Copies to print, from the print_run_quantity calculation under the chosen basis."
      - name: order_base_units
        type: integer
        source: computed
        description: "The base unit count the quantity was derived from (locked order units for ORDER_DRIVEN, forecast input for DEMAND_FORECAST)."
      - name: overprint_units
        type: integer
        source: computed
        description: "Overprint component included in quantity; 0 for DEMAND_FORECAST."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Run state."
        default: PLANNED
        constraints: "PLANNED | PRINTED | CANCELLED"
      - name: printed_at
        type: datetime
        source: system
        description: "Logical-clock instant of completion; null before PRINTED."
      - name: cancel_reason
        type: string
        source: system
        description: "Reason captured on the CANCELLED transition."

  - name: ReleaseWindow
    parent: Issue
    common_fields: false
    fields:
      - name: issue_id
        type: string
        source: input
        description: "FK -> Issue.id; the issue whose downstream edition is being scheduled."
      - name: channel
        type: enum
        source: input
        description: "Downstream edition channel; the print window is Issue.on_sale_date itself and is not stored here."
        constraints: "DIGITAL | COLLECTED"
      - name: release_date
        type: datetime
        source: input
        description: "Scheduled release date for this channel (date at 00:00:00Z)."
      - name: expected_net_receipts_cents
        type: integer
        source: input
        description: "Planning figure recorded with the window; not used by royalty accounting."
        default: 0
        constraints: ">= 0"

  - name: RevenueEvent
    parent: Issue
    common_fields: false
    fields:
      - name: issue_id
        type: string
        source: input
        description: "FK -> Issue.id; the issue that generated the receipts."
      - name: channel
        type: enum
        source: input
        description: "Revenue channel."
        constraints: "PRINT_DM | DIGITAL | COLLECTED | SUBSIDIARY"
      - name: basis_status
        type: enum
        source: input
        description: "ESTIMATED rows are provisional; ACTUAL rows are settled receipts."
        constraints: "ESTIMATED | ACTUAL"
      - name: gross_receipts_cents
        type: integer
        source: input
        description: "Gross receipts booked by this event."
        constraints: ">= 0"
      - name: net_receipts_cents
        type: integer
        source: input
        description: "Net receipts after channel deductions; royalty pools are computed from this field. MUST be <= gross_receipts_cents."
        constraints: ">= 0"
      - name: units
        type: integer
        source: input
        description: "Units represented by this event."
        default: 0
        constraints: ">= 0"
      - name: period
        type: string
        source: input
        description: "Accounting period, YYYY-MM."
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: source
        type: enum
        source: system
        description: "MANUAL for accountant-booked rows; SHIPMENT for rows emitted by the order ship transition."
        default: MANUAL
        constraints: "MANUAL | SHIPMENT"

  - name: RoyaltyStatement
    parent: Title
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; the series being accounted."
      - name: creator_id
        type: string
        source: input
        description: "FK -> Creator.id; the participant being paid."
      - name: period
        type: string
        source: input
        description: "Accounting period, YYYY-MM; matched against RevenueEvent.period."
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: basis
        type: enum
        source: input
        description: "Which royalty_accrual variant computes this statement."
        constraints: "ESTIMATED | SETTLED"
      - name: lines
        type: array
        source: computed
        description: "One object per contributing channel: { channel, included_net_cents, channel_pool_cents, creator_share_cents }."
        default: []
      - name: gross_royalty_cents
        type: integer
        source: computed
        description: "Sum of lines[].creator_share_cents."
      - name: recoupment_applied_cents
        type: integer
        source: computed
        description: "min(assignment.unrecouped_advance_cents, gross_royalty_cents) at statement creation."
      - name: payable_cents
        type: integer
        source: computed
        description: "gross_royalty_cents - recoupment_applied_cents."
      - name: status
        type: enum
        source: system
        description: "Statement state."
        default: DRAFT
        constraints: "DRAFT | ISSUED | PAID | REVERSED"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID that performed the issue transition; the pay transition refuses this same id (segregation of duties). Opaque operator id, not a foreign key."
      - name: paid_by_user_id
        type: string
        source: system
        description: "X-User-ID that performed the pay transition; opaque operator id, not a foreign key."
      - name: payment_reference
        type: string
        source: system
        description: "Payment reference captured at pay time."
      - name: reversal_reason
        type: string
        source: system
        description: "Reason captured on the REVERSED transition."

state_machines:
  - entity: Title
    initial_state: PITCHED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PITCHED
        to: GREENLIT
        trigger: "POST /comics/titles/{id}/greenlight"
        actor: EditorInChief
        preconditions:
          - "title.status == PITCHED"
        side_effects:
          - "sets title.greenlit_at = logical clock"
          - "increments Title.version by 1"
        note: "CreativeAssignment creation is refused while status == PITCHED (ERR_TITLE_NOT_GREENLIT)."
      - from: GREENLIT
        to: IN_PRODUCTION
        trigger: "system: first Issue created under this title (POST /comics/titles/{id}/issues)"
        actor: system
        preconditions:
          - "title.status == GREENLIT"
          - "the created Issue is the title's first issue row"
        side_effects:
          - "increments Title.version by 1"
      - from: IN_PRODUCTION
        to: PUBLISHING
        trigger: "system: first Issue of the title reaches commercial_status == ON_SALE (POST /comics/issues/{id}/release)"
        actor: system
        preconditions:
          - "title.status == IN_PRODUCTION"
        side_effects:
          - "increments Title.version by 1"
      - from: PUBLISHING
        to: COMPLETED
        trigger: "system: count of the title's issues with commercial_status == ON_SALE reaches title.planned_issue_count (POST /comics/issues/{id}/release)"
        actor: system
        preconditions:
          - "title.status == PUBLISHING"
          - "count(Issue where title_id == title.id AND commercial_status == ON_SALE) == title.planned_issue_count"
        side_effects:
          - "increments Title.version by 1"
        note: "Compound/bubble-up: the parent's terminal transition is a function of child issue states."
      - from: GREENLIT
        to: CANCELLED
        trigger: "POST /comics/titles/{id}/cancel"
        actor: EditorInChief
        preconditions:
          - "title.status IN {PITCHED, GREENLIT, IN_PRODUCTION, PUBLISHING}"
        side_effects:
          - "sets title.cancel_reason = request reason"
          - "CASCADE hop 1' (fan-out): every CreativeAssignment of this title with status IN {PROPOSED, COUNTERED, ACCEPTED, ACTIVE} -> TERMINATED with terminated_reason 'AUTO_TITLE_CANCEL'"
          - "CASCADE hop 2' (caused by hop 1'): Creator.active_assignment_count recomputed for each affected creator"
          - "CASCADE hop 1: every Issue of this title with commercial_status != CANCELLED -> commercial_status = CANCELLED and production_status = CANCELLED"
          - "CASCADE hop 2 (caused by hop 1): for each issue just cancelled, its PrintRun rows with status == PLANNED -> CANCELLED (cancel_reason 'AUTO_TITLE_CANCEL'); its ProductionStage rows with status IN {NOT_STARTED, IN_PROGRESS, DELIVERED, KICKED_BACK} -> CANCELLED; its RetailerOrder rows with status IN {DRAFT, SUBMITTED, FOC_LOCKED, INVOICED} -> CANCELLED (cancel_reason 'AUTO_TITLE_CANCEL'); orders already SHIPPED are left untouched under non-returnable terms"
          - "CASCADE hop 3 (caused by hop 2's order cancellations): each affected Retailer.cumulative_units_ytd, Retailer.discount_tier and Retailer.open_balance_cents recomputed; each affected Issue.total_ordered_units recomputed"
          - "increments Title.version by 1"
        note: "Same transition is available from PITCHED, IN_PRODUCTION and PUBLISHING; the cascade body is identical."

  - entity: Issue
    state_field: production_status
    initial_state: PLANNED
    terminal_states: [CANCELLED]
    transitions:
      - from: PLANNED
        to: SCRIPTING
        trigger: "system: production_status re-derived after any ProductionStage transition on this issue"
        actor: system
        preconditions:
          - "at least one ProductionStage exists for this issue"
          - "no SCRIPT stage of this issue has status == APPROVED"
        side_effects:
          - "increments Issue.version by 1"
      - from: SCRIPTING
        to: ART
        trigger: "system: production_status re-derived after any ProductionStage transition on this issue"
        actor: system
        preconditions:
          - "every SCRIPT stage of this issue has status == APPROVED"
          - "not every stage with craft IN {PENCILS, INKS, COLORS} is APPROVED"
        side_effects:
          - "increments Issue.version by 1"
      - from: ART
        to: PREPRESS
        trigger: "system: production_status re-derived after any ProductionStage transition on this issue"
        actor: system
        preconditions:
          - "every stage with craft IN {SCRIPT, PENCILS, INKS, COLORS} is APPROVED"
          - "not every LETTERS stage of this issue is APPROVED"
        side_effects:
          - "increments Issue.version by 1"
      - from: PREPRESS
        to: CAMERA_READY
        trigger: "system: production_status re-derived after any ProductionStage transition on this issue"
        actor: system
        preconditions:
          - "this issue has at least one stage for each craft in REQUIRED_CRAFTS = {SCRIPT, PENCILS, INKS, COLORS, LETTERS}"
          - "every ProductionStage of this issue has status == APPROVED"
        side_effects:
          - "increments Issue.version by 1"
      - from: ART
        to: SCRIPTING
        trigger: "system: production_status re-derived after POST /comics/issues/{id}/production-stages adds a further SCRIPT stage to an issue already in ART"
        actor: system
        preconditions:
          - "the newly added stage has craft == SCRIPT and status == NOT_STARTED, so 'every SCRIPT stage is APPROVED' no longer holds"
          - "at least one stage with craft IN {PENCILS, INKS, COLORS} is not APPROVED (otherwise the derivation cannot have reached ART)"
        side_effects:
          - "increments Issue.version by 1"
        note: "Compound derivation is a pure function of child stage statuses, so it moves backwards when the child set grows. An APPROVED stage is terminal and can never be kicked back, so adding a late co-writer/rewrite SCRIPT stage is the only way to regress across a craft boundary."
      - from: PLANNED
        to: CANCELLED
        trigger: "system: POST /comics/titles/{id}/cancel cascade hop 1"
        actor: system
        preconditions:
          - "owning title.status == CANCELLED"
        side_effects:
          - "increments Issue.version by 1"
        note: "Available from every non-terminal production_status value."

  - entity: Issue
    state_field: commercial_status
    initial_state: UNSOLICITED
    terminal_states: [CANCELLED]
    transitions:
      - from: UNSOLICITED
        to: SOLICITED
        trigger: "system: POST /comics/catalogs/{id}/publish fan-out over that catalog's ACCEPTED solicitations"
        actor: system
        preconditions:
          - "issue.commercial_status == UNSOLICITED"
          - "a Solicitation exists with issue_id == issue.id AND status == ACCEPTED AND catalog.status transitions to PUBLISHED in this request"
        side_effects:
          - "increments Issue.version by 1"
      - from: SOLICITED
        to: FOC_LOCKED
        trigger: "POST /comics/issues/{id}/foc-lock"
        actor: SalesDirector
        preconditions:
          - "issue.commercial_status == SOLICITED"
          - "logical clock >= issue.foc_date"
          - "at least one RetailerOrder for this issue has status == SUBMITTED"
        side_effects:
          - "for every SUBMITTED order of this issue: earned_variant_allocations and total_units computed by variant_incentive_allocation, order.status -> FOC_LOCKED"
          - "each affected Retailer.cumulative_units_ytd += order.total_units and Retailer.discount_tier recomputed by retailer_discount_tier"
          - "issue.total_ordered_units recomputed"
          - "increments Issue.version by 1"
      - from: FOC_LOCKED
        to: PRINTED
        trigger: "system: POST /comics/print-runs/{id}/complete on a run with printing_number == 1"
        actor: system
        preconditions:
          - "issue.commercial_status == FOC_LOCKED"
          - "the completed PrintRun.printing_number == 1"
        side_effects:
          - "issue.printed_units recomputed"
          - "increments Issue.version by 1"
      - from: PRINTED
        to: ON_SALE
        trigger: "POST /comics/issues/{id}/release"
        actor: SalesDirector
        preconditions:
          - "issue.commercial_status == PRINTED"
          - "issue.production_status == CAMERA_READY"
          - "logical clock >= issue.target_on_sale_date"
        side_effects:
          - "sets issue.on_sale_date = logical clock"
          - "bubble-up: owning title.status IN_PRODUCTION -> PUBLISHING, or PUBLISHING -> COMPLETED when the ON_SALE issue count reaches title.planned_issue_count"
          - "increments Issue.version by 1"
        note: "Parallel-dimension join: this is the only transition that reads BOTH dimensions of the same row."
      - from: SOLICITED
        to: UNSOLICITED
        trigger: "system: schedule-slip cascade hop 2 from POST /comics/production-stages/{id}/deliver"
        actor: system
        preconditions:
          - "issue.schedule_health became SLIPPED in this request"
          - "issue.commercial_status IN {SOLICITED, FOC_LOCKED}"
        side_effects:
          - "increments Issue.version by 1"
        note: "Cycle: an issue can be re-solicited into a later catalog after slipping out of its original one."
      - from: FOC_LOCKED
        to: UNSOLICITED
        trigger: "system: schedule-slip cascade hop 2 from POST /comics/production-stages/{id}/deliver"
        actor: system
        preconditions:
          - "issue.schedule_health became SLIPPED in this request"
          - "issue.commercial_status == FOC_LOCKED"
          - "no PrintRun of this issue has status == PRINTED"
        side_effects:
          - "increments Issue.version by 1"
        note: "Backwards edge out of a locked order cut-off: a slip after FOC unwinds the lock, which is what makes hop 3 (order cancellation) and hop 4 (retailer tier demotion) observable."
      - from: UNSOLICITED
        to: CANCELLED
        trigger: "system: POST /comics/titles/{id}/cancel cascade hop 1"
        actor: system
        preconditions:
          - "owning title.status == CANCELLED"
        side_effects:
          - "increments Issue.version by 1"
        note: "Available from every non-terminal commercial_status value."

  - entity: CreativeAssignment
    initial_state: PROPOSED
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /comics/creative-assignments/{id}/accept"
        actor: Creator
        preconditions:
          - "assignment.status == PROPOSED"
          - "X-User-ID == assignment.creator_id"
          - "title.status IN {GREENLIT, IN_PRODUCTION, PUBLISHING}"
          - "for non-COVER crafts: title.committed_share_bps + assignment.royalty_share_bps <= 10000 - title.cover_participation_bps"
        side_effects:
          - "title.committed_share_bps recomputed"
          - "increments CreativeAssignment.version by 1"
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /comics/creative-assignments/{id}/counter"
        actor: Creator
        preconditions:
          - "assignment.status == PROPOSED"
          - "X-User-ID == assignment.creator_id"
        side_effects:
          - "sets counter_page_rate_cents and counter_royalty_share_bps from the request"
          - "increments CreativeAssignment.version by 1"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /comics/creative-assignments/{id}/repropose"
        actor: EditorInChief
        preconditions:
          - "assignment.status == COUNTERED"
          - "assignment.negotiation_round < MAX_NEGOTIATION_ROUNDS (3)"
        side_effects:
          - "overwrites page_rate_cents and royalty_share_bps with the reproposed terms"
          - "increments assignment.negotiation_round by 1"
          - "clears counter_page_rate_cents and counter_royalty_share_bps to null"
          - "increments CreativeAssignment.version by 1"
        note: "Cycle PROPOSED -> COUNTERED -> PROPOSED; the 3rd counter cannot be reproposed (ERR_NEGOTIATION_ROUNDS_EXHAUSTED)."
      - from: ACCEPTED
        to: ACTIVE
        trigger: "system: POST /comics/production-stages/{id}/start on a stage referencing this assignment"
        actor: system
        preconditions:
          - "assignment.status == ACCEPTED"
        side_effects:
          - "increments CreativeAssignment.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: POST /comics/production-stages/{id}/approve when every stage of this assignment is APPROVED"
        actor: system
        preconditions:
          - "assignment.status == ACTIVE"
          - "every ProductionStage with assignment_id == assignment.id has status == APPROVED"
        side_effects:
          - "Creator.active_assignment_count recomputed"
          - "increments CreativeAssignment.version by 1"
      - from: COUNTERED
        to: TERMINATED
        trigger: "POST /comics/creative-assignments/{id}/terminate"
        actor: EditorInChief
        preconditions:
          - "assignment.status IN {PROPOSED, COUNTERED, ACCEPTED, ACTIVE}"
          - "no ProductionStage of this assignment has status IN {IN_PROGRESS, DELIVERED}"
        side_effects:
          - "sets terminated_reason = request reason"
          - "title.committed_share_bps recomputed"
          - "Creator.active_assignment_count recomputed"
          - "increments CreativeAssignment.version by 1"
        note: "Same transition is available from PROPOSED, ACCEPTED and ACTIVE, and is also driven by the title-cancel cascade; the in-flight-stage precondition constrains the operator-driven trigger only, because the cascade cancels those stages in the same request (hop 2)."

  - entity: ProductionStage
    initial_state: NOT_STARTED
    terminal_states: [APPROVED, CANCELLED]
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /comics/production-stages/{id}/start"
        actor: Creator
        preconditions:
          - "stage.status IN {NOT_STARTED, KICKED_BACK}"
          - "X-User-ID == assignment.creator_id"
          - "assignment.status IN {ACCEPTED, ACTIVE}"
          - "issue.production_status != CANCELLED"
        side_effects:
          - "assignment.status ACCEPTED -> ACTIVE"
          - "issue.production_status re-derived"
          - "increments ProductionStage.version by 1"
      - from: KICKED_BACK
        to: IN_PROGRESS
        trigger: "POST /comics/production-stages/{id}/start"
        actor: Creator
        preconditions:
          - "stage.status == KICKED_BACK"
          - "X-User-ID == assignment.creator_id"
          - "assignment.status == ACTIVE"
        side_effects:
          - "issue.production_status re-derived"
          - "increments ProductionStage.version by 1"
        note: "Revision loop entry point; slip_days from the rejected delivery stays on the row until the next deliver recomputes it."
      - from: IN_PROGRESS
        to: DELIVERED
        trigger: "POST /comics/production-stages/{id}/deliver"
        actor: Creator
        preconditions:
          - "stage.status == IN_PROGRESS"
          - "X-User-ID == assignment.creator_id"
          - "1 <= delivered_pages <= issue.page_count"
        side_effects:
          - "sets actual_delivered_at = logical clock and delivered_pages from the request"
          - "recomputes stage.slip_days by stage_slip_days (recompute, not accumulate)"
          - "CASCADE hop 1 (caused by stage.slip_days changing): issue.total_slip_days recomputed, then issue.schedule_health recomputed by schedule_health_posture"
          - "CASCADE hop 2 (caused by issue.schedule_health becoming SLIPPED): every Solicitation of this issue with status IN {SUBMITTED, ACCEPTED} -> WITHDRAWN with withdrawn_reason 'AUTO_SLIP'; issue.commercial_status IN {SOLICITED, FOC_LOCKED} -> UNSOLICITED"
          - "CASCADE hop 3 (caused by hop 2's solicitation withdrawals): catalog.accepted_slot_count recomputed for each affected catalog; every RetailerOrder of this issue with status IN {SUBMITTED, FOC_LOCKED} -> CANCELLED with cancel_reason 'AUTO_SLIP'"
          - "CASCADE hop 4 (caused by hop 3's order cancellations): each affected Retailer.cumulative_units_ytd, Retailer.discount_tier and Retailer.open_balance_cents recomputed; issue.total_ordered_units recomputed"
          - "issue.production_status re-derived"
          - "increments ProductionStage.version by 1"
      - from: DELIVERED
        to: KICKED_BACK
        trigger: "POST /comics/production-stages/{id}/kick-back"
        actor: ManagingEditor
        preconditions:
          - "stage.status == DELIVERED"
        side_effects:
          - "increments stage.kickback_count by 1"
          - "issue.production_status re-derived from the child statuses (a kick-back holds the issue inside its current phase; regression across a craft boundary requires a newly booked stage, because an APPROVED stage is terminal and can never be kicked back)"
          - "increments ProductionStage.version by 1"
      - from: DELIVERED
        to: APPROVED
        trigger: "POST /comics/production-stages/{id}/approve"
        actor: ManagingEditor
        preconditions:
          - "stage.status == DELIVERED"
        side_effects:
          - "freezes stage.page_fee_cents = assignment.page_rate_cents * stage.delivered_pages"
          - "ledger sync: title.production_cost_cents += stage.page_fee_cents"
          - "assignment.status ACTIVE -> COMPLETED when every stage of that assignment is APPROVED"
          - "issue.production_status re-derived"
          - "increments ProductionStage.version by 1"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system: POST /comics/titles/{id}/cancel cascade hop 2"
        actor: system
        preconditions:
          - "owning issue.production_status == CANCELLED"
        side_effects:
          - "increments ProductionStage.version by 1"
        note: "Available from NOT_STARTED, IN_PROGRESS, DELIVERED and KICKED_BACK; APPROVED stages are never cancelled so title.production_cost_cents does not move."

  - entity: Catalog
    initial_state: OPEN
    terminal_states: [PUBLISHED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /comics/catalogs/{id}/lock"
        actor: SalesDirector
        preconditions:
          - "catalog.status == OPEN"
          - "logical clock > catalog.submission_deadline"
        side_effects:
          - "increments Catalog.version by 1"
        note: "Locking is manual, so the submission deadline can lapse while the catalog is still OPEN."
      - from: LOCKED
        to: PUBLISHED
        trigger: "POST /comics/catalogs/{id}/publish"
        actor: SalesDirector
        preconditions:
          - "catalog.status == LOCKED"
          - "catalog.accepted_slot_count >= 1"
        side_effects:
          - "sets published_at = logical clock"
          - "fan-out: every Issue referenced by this catalog's ACCEPTED solicitations moves commercial_status UNSOLICITED -> SOLICITED"
          - "increments Catalog.version by 1"

  - entity: Solicitation
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /comics/solicitations/{id}/submit"
        actor: ManagingEditor
        preconditions:
          - "solicitation.status == DRAFT"
          - "catalog.status == OPEN"
          - "logical clock <= catalog.submission_deadline"
          - "issue.production_status IN {SCRIPTING, ART, PREPRESS, CAMERA_READY}"
          - "the issue has at least one VariantCover with kind == STANDARD"
        side_effects:
          - "sets submitted_at = logical clock"
          - "increments Solicitation.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /comics/solicitations/{id}/accept"
        actor: SalesDirector
        preconditions:
          - "solicitation.status == SUBMITTED"
          - "catalog.status == LOCKED"
          - "catalog.accepted_slot_count < catalog.max_slots"
        side_effects:
          - "catalog.accepted_slot_count recomputed (+1)"
          - "increments Solicitation.version by 1"
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /comics/solicitations/{id}/withdraw"
        actor: SalesDirector
        preconditions:
          - "solicitation.status IN {SUBMITTED, ACCEPTED}"
          - "catalog.status != PUBLISHED"
        side_effects:
          - "sets withdrawn_reason = request reason"
          - "catalog.accepted_slot_count recomputed (-1 when the row was ACCEPTED)"
          - "increments Solicitation.version by 1"
        note: "Also reachable from SUBMITTED, and driven from any state IN {SUBMITTED, ACCEPTED} by the schedule-slip cascade (which ignores the catalog.status guard because it is a system actor)."

  - entity: RetailerOrder
    initial_state: DRAFT
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /comics/retailer-orders/{id}/submit"
        actor: Retailer
        preconditions:
          - "order.status == DRAFT"
          - "X-User-ID == order.retailer_id"
          - "retailer.status == ACTIVE"
          - "retailer.non_returnable_ack == true"
          - "issue.commercial_status == SOLICITED (initial orders) OR issue.commercial_status == ON_SALE (reorders, order.is_reorder == true)"
          - "retailer.open_balance_cents < retailer.credit_limit_cents (strict headroom; see validation priority 27)"
        side_effects:
          - "increments RetailerOrder.version by 1"
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /comics/retailer-orders/{id}/adjust"
        actor: Retailer
        preconditions:
          - "order.status == SUBMITTED"
          - "X-User-ID == order.retailer_id"
          - "logical clock < issue.foc_date"
        side_effects:
          - "overwrites standard_qty with the requested quantity"
          - "increments RetailerOrder.version by 1"
        note: "Self-loop: retailers may re-adjust repeatedly until FOC; after FOC the order is locked and non-returnable."
      - from: SUBMITTED
        to: FOC_LOCKED
        trigger: "system: POST /comics/issues/{id}/foc-lock"
        actor: system
        preconditions:
          - "order.status == SUBMITTED"
          - "order.issue_id == the locked issue"
        side_effects:
          - "freezes earned_variant_allocations and total_units"
          - "retailer.cumulative_units_ytd += total_units; retailer.discount_tier recomputed"
          - "issue.total_ordered_units recomputed"
          - "increments RetailerOrder.version by 1"
      - from: FOC_LOCKED
        to: INVOICED
        trigger: "POST /comics/retailer-orders/{id}/invoice"
        actor: SalesDirector
        preconditions:
          - "order.status == FOC_LOCKED"
          - "retailer.status == ACTIVE"
          - "retailer.non_returnable_ack == true"
          - "retailer.open_balance_cents + computed invoice_total_cents <= retailer.credit_limit_cents"
        side_effects:
          - "computes discount_tier_applied, merchandise_net_cents, handling_fee_cents and invoice_total_cents by retailer_invoice_total"
          - "retailer.open_balance_cents recomputed (+ invoice_total_cents)"
          - "increments RetailerOrder.version by 1"
      - from: INVOICED
        to: SHIPPED
        trigger: "POST /comics/retailer-orders/{id}/ship"
        actor: SalesDirector
        preconditions:
          - "order.status == INVOICED"
          - "issue.printed_units >= issue.total_ordered_units"
        side_effects:
          - "appends a RevenueEvent row { issue_id, channel PRINT_DM, basis_status ACTUAL, gross_receipts_cents = sum of ordered line gross, net_receipts_cents = order.merchandise_net_cents, units = order.total_units, period = YYYY-MM of the logical clock, source SHIPMENT }"
          - "issue.shipped_units recomputed"
          - "increments RetailerOrder.version by 1"
      - from: FOC_LOCKED
        to: CANCELLED
        trigger: "POST /comics/retailer-orders/{id}/cancel"
        actor: SalesDirector
        preconditions:
          - "order.status IN {DRAFT, SUBMITTED, FOC_LOCKED, INVOICED}"
          - "actor is SalesDirector when order.status IN {FOC_LOCKED, INVOICED} (a Retailer may only cancel DRAFT or SUBMITTED orders under non-returnable terms)"
        side_effects:
          - "sets cancel_reason = request reason"
          - "retailer.cumulative_units_ytd recomputed (order units removed) and retailer.discount_tier recomputed"
          - "retailer.open_balance_cents recomputed (invoice removed when the row was INVOICED)"
          - "issue.total_ordered_units recomputed"
          - "increments RetailerOrder.version by 1"
        note: "SHIPPED orders can never be cancelled (ERR_RETURNS_NOT_PERMITTED); this is the compensating action for the FOC lock."
      - from: INVOICED
        to: CANCELLED
        trigger: "POST /comics/retailer-orders/{id}/cancel"
        actor: SalesDirector
        preconditions:
          - "order.status == INVOICED"
          - "actor is SalesDirector (a Retailer may not cancel an invoiced order)"
        side_effects:
          - "sets cancel_reason = request reason"
          - "retailer.cumulative_units_ytd recomputed (order units removed) and retailer.discount_tier recomputed"
          - "retailer.open_balance_cents recomputed (the invoice leaves the balance)"
          - "issue.total_ordered_units recomputed"
          - "increments RetailerOrder.version by 1"
        note: "This is the compensating action for FOC lock plus invoicing; the invoice figures stay on the row for the audit trail but leave every ledger."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /comics/retailer-orders/{id}/cancel"
        actor: Retailer
        preconditions:
          - "order.status == DRAFT"
        side_effects:
          - "sets cancel_reason = request reason"
          - "increments RetailerOrder.version by 1"
        note: "No ledger touches a DRAFT order, so cancellation has nothing to reverse."
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /comics/retailer-orders/{id}/cancel"
        actor: Retailer
        preconditions:
          - "order.status == SUBMITTED"
        side_effects:
          - "sets cancel_reason = request reason"
          - "increments RetailerOrder.version by 1"
        note: "A SUBMITTED order is not yet in any unit or balance ledger, so cancellation before FOC is free."

  - entity: PrintRun
    initial_state: PLANNED
    terminal_states: [PRINTED, CANCELLED]
    transitions:
      - from: PLANNED
        to: PRINTED
        trigger: "POST /comics/print-runs/{id}/complete"
        actor: ManagingEditor
        preconditions:
          - "run.status == PLANNED"
          - "issue.production_status == CAMERA_READY"
        side_effects:
          - "sets printed_at = logical clock"
          - "issue.printed_units recomputed"
          - "issue.commercial_status FOC_LOCKED -> PRINTED when run.printing_number == 1"
          - "increments PrintRun.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /comics/print-runs/{id}/cancel"
        actor: ManagingEditor
        preconditions:
          - "run.status == PLANNED"
        side_effects:
          - "sets cancel_reason = request reason"
          - "issue.printed_units recomputed"
          - "increments PrintRun.version by 1"
        note: "Also driven by the title-cancel cascade (hop 2) with cancel_reason 'AUTO_TITLE_CANCEL'."

  - entity: RoyaltyStatement
    initial_state: DRAFT
    terminal_states: [PAID, REVERSED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /comics/royalty-statements/{id}/issue"
        actor: RoyaltyAccountant
        preconditions:
          - "statement.status == DRAFT"
        side_effects:
          - "sets issued_by_user_id = X-User-ID"
          - "ledger sync: title.royalty_accrued_cents += statement.payable_cents"
          - "assignment.unrecouped_advance_cents -= statement.recoupment_applied_cents"
          - "increments RoyaltyStatement.version by 1"
      - from: ISSUED
        to: PAID
        trigger: "POST /comics/royalty-statements/{id}/pay"
        actor: RoyaltyAccountant
        preconditions:
          - "statement.status == ISSUED"
          - "X-User-ID != statement.issued_by_user_id (segregation of duties)"
          - "statement.payable_cents > 0"
        side_effects:
          - "sets paid_by_user_id = X-User-ID and payment_reference from the request"
          - "increments RoyaltyStatement.version by 1"
      - from: ISSUED
        to: REVERSED
        trigger: "POST /comics/royalty-statements/{id}/reverse"
        actor: RoyaltyAccountant
        preconditions:
          - "statement.status == ISSUED"
        side_effects:
          - "sets reversal_reason = request reason"
          - "ledger sync: title.royalty_accrued_cents -= statement.payable_cents"
          - "assignment.unrecouped_advance_cents += statement.recoupment_applied_cents"
          - "increments RoyaltyStatement.version by 1"
        note: "Compensating action for issue; a PAID statement is refused (ERR_STATEMENT_ALREADY_PAID)."

  - entity: Retailer
    state_field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /comics/retailers/{id}/suspend"
        actor: SalesDirector
        preconditions:
          - "retailer.status == ACTIVE"
        side_effects:
          - "sets suspension_reason = request reason"
          - "increments Retailer.version by 1"
        note: "A SUSPENDED account keeps its ledgers; it may not submit orders or be invoiced (ERR_RETAILER_NOT_ACTIVE), but its already FOC_LOCKED orders stay locked."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /comics/retailers/{id}/reinstate"
        actor: SalesDirector
        preconditions:
          - "retailer.status == SUSPENDED"
        side_effects:
          - "clears suspension_reason to null"
          - "increments Retailer.version by 1"

concurrency_rules:
  - rule_id: assignment-create-stale-title
    parent_entity: Title
    write_endpoint: "POST /comics/titles/{id}/creative-assignments"
    occ_field: "expected_title_version"
    description: |
      Creating a CreativeAssignment against a Title whose version has advanced since the
      client last read it is rejected. A title legitimately accepts several assignments for
      the same craft (co-writers, fill-in artists) and each acceptance moves
      title.committed_share_bps, so a second create cannot be rejected by any state
      precondition — the stale-version check on the parent is what protects the royalty
      pool budget the client based its royalty_share_bps on.
    error_id: ERR_STALE_TITLE_VERSION
    http_status: 412

  - rule_id: print-run-create-stale-issue
    parent_entity: Issue
    write_endpoint: "POST /comics/issues/{id}/print-runs"
    occ_field: "expected_issue_version"
    description: |
      Creating a PrintRun against an Issue whose version has advanced since the client last
      read it is rejected. Second printings and reprints legitimately stack on top of earlier
      runs (printing_number increments), so a repeat create is not blocked by state; the
      stale-version check ensures the ordering figures the run quantity was derived from are
      the ones the client actually observed.
    error_id: ERR_STALE_ISSUE_VERSION
    http_status: 412

calculations:
  - name: stage_slip_days
    trigger: "POST /comics/production-stages/{id}/deliver (side effect: recomputes stage.slip_days, then issue.total_slip_days)"
    algorithm: chronological
    formula: |
      # per stage — RECOMPUTED on every delivery, never accumulated across revision rounds
      slip_days = max(0, calendar_days(date_utc(actual_delivered_at) - date_utc(planned_due_date)))

      # per issue — full recompute over the stage set, no incremental delta
      issue.total_slip_days = sum(
          s.slip_days for s in ProductionStage where s.issue_id == issue.id
                            and s.status IN {DELIVERED, KICKED_BACK, APPROVED}
      )
    input_set: "Stages of the issue whose status IN {DELIVERED, KICKED_BACK, APPROVED}. NOT_STARTED, IN_PROGRESS and CANCELLED stages contribute 0. A KICKED_BACK stage keeps the slip_days of the delivery that was rejected until its next deliver overwrites the value."
    constants:
      DAY_BOUNDARY: "UTC calendar date; both operands truncated to date before subtraction"
    precision: "whole days, floor at 0"
    variants:
      - name: recompute_on_redelivery
        when: "a stage is delivered again after a kick-back"
        difference: "slip_days is overwritten with the latest delivery's lateness; the earlier round's lateness is discarded, so issue.total_slip_days can DECREASE if the second delivery is closer to the planned due date."

  - name: schedule_health_posture
    trigger: "POST /comics/production-stages/{id}/deliver (side effect: recomputes issue.schedule_health after issue.total_slip_days)"
    algorithm: threshold
    formula: |
      if   issue.total_slip_days <= SLIP_AT_RISK_DAYS: schedule_health = ON_TRACK
      elif issue.total_slip_days <= SLIP_BREACH_DAYS:  schedule_health = AT_RISK
      else:                                           schedule_health = SLIPPED
    input_set: "Only issue.total_slip_days; no other field participates."
    constants:
      SLIP_AT_RISK_DAYS: 7
      SLIP_BREACH_DAYS: 21
    precision: "integer comparison; both thresholds are inclusive upper bounds (<=), so 21 days is AT_RISK and 22 days is SLIPPED"

  - name: variant_incentive_allocation
    trigger: "POST /comics/issues/{id}/foc-lock (side effect: freezes order.earned_variant_allocations and order.total_units for every SUBMITTED order of the issue)"
    algorithm: tiered_pricing
    formula: |
      # combinatorial mode (a): >= 3 inputs with nested min() and a conditional branch on Retailer state
      if order.is_reorder:
          order.earned_variant_allocations = []
          order.total_units = order.standard_qty
          return

      allocations = []
      # deterministic iteration order over the issue's covers:
      #   kind ASC (RATIO_INCENTIVE < RETAILER_EXCLUSIVE < STANDARD by the fixed list
      #   [RATIO_INCENTIVE, RETAILER_EXCLUSIVE, STANDARD]), then incentive_ratio ASC
      #   (null last), then code ASC. Never by id.
      for v in covers_of(order.issue_id) ordered as above:
          if v.kind == RATIO_INCENTIVE:
              earned = floor(order.standard_qty / v.incentive_ratio)
              if v.allocation_cap != null: earned = min(earned, v.allocation_cap)
          elif v.kind == RETAILER_EXCLUSIVE:
              eligible = (retailer.cumulative_units_ytd_before_this_lock >= EXCLUSIVE_ELIGIBILITY_UNITS)
              if not eligible:
                  earned = 0
              else:
                  earned = min(order.exclusive_variant_qty,
                               floor(order.standard_qty / EXCLUSIVE_MIN_RATIO))
                  if v.allocation_cap != null: earned = min(earned, v.allocation_cap)
          else:                       # STANDARD covers are billed from standard_qty, never earned
              earned = 0
          if earned > 0: allocations.append({ variant_cover_id: v.id, qty: earned })

      order.earned_variant_allocations = allocations
      order.total_units = order.standard_qty + sum(a.qty for a in allocations)
    input_set: "The issue's VariantCover rows (all of them; VariantCover is immutable so there is no status filter), the order's standard_qty / exclusive_variant_qty / is_reorder, and the ordering retailer's cumulative_units_ytd as observed BEFORE this FOC lock adds the order's units."
    constants:
      EXCLUSIVE_ELIGIBILITY_UNITS: 10000
      EXCLUSIVE_MIN_RATIO: 50
    precision: "integer copies; floor division, so a ratio is earned only when standard_qty reaches an exact multiple (60 standard copies earn 6 of a 1:10 cover, 9 copies earn 0)"

  - name: retailer_discount_tier
    trigger: "system: recomputed whenever Retailer.cumulative_units_ytd changes (POST /comics/issues/{id}/foc-lock, POST /comics/retailer-orders/{id}/cancel, title-cancel cascade hop 3)"
    algorithm: threshold
    formula: |
      cum = retailer.cumulative_units_ytd
      if   cum >= TIER_PREMIER_UNITS: discount_tier = PREMIER
      elif cum >= TIER_CORE_UNITS:    discount_tier = CORE
      elif cum >= TIER_BASIC_UNITS:   discount_tier = BASIC
      else:                           discount_tier = ENTRY
    input_set: "Retailer.cumulative_units_ytd only, which is itself opening_units_ytd + units of that retailer's orders with status IN {FOC_LOCKED, INVOICED, SHIPPED} — i.e. INCLUSIVE of the order currently being processed once FOC lock has run."
    constants:
      TIER_BASIC_UNITS: 2500
      TIER_CORE_UNITS: 10000
      TIER_PREMIER_UNITS: 25000
      DISCOUNT_PCT: { ENTRY: 0.40, BASIC: 0.45, CORE: 0.50, PREMIER: 0.55 }
    precision: "thresholds are inclusive (>=): 2500 cumulative units is BASIC, 2499 is ENTRY"

  - name: retailer_invoice_total
    trigger: "POST /comics/retailer-orders/{id}/invoice (side effect: sets discount_tier_applied, merchandise_net_cents, handling_fee_cents, invoice_total_cents)"
    algorithm: tiered_pricing
    formula: |
      # combinatorial mode (b): nested rounding whose ORDER changes the cent total.
      tier   = retailer.discount_tier            # observed at invoice time; already includes this
                                                 # order's units because FOC lock added them (pinned:
                                                 # the tier is INCLUSIVE of the order being invoiced)
      factor = 1 - DISCOUNT_PCT[tier]

      lines = [ { qty: order.standard_qty, unit: standard_cover_of(issue).cover_price_cents } ]
      for a in order.earned_variant_allocations (in stored order):
          lines.append({ qty: a.qty, unit: cover(a.variant_cover_id).cover_price_cents })

      # PINNED ORDER: round each line to the cent FIRST, then sum the rounded lines.
      for L in lines:
          L.gross = L.qty * L.unit
          L.net   = round_half_up(L.gross * factor)
      merchandise_net_cents = sum(L.net for L in lines)

      handling_fee_cents = 0 if merchandise_net_cents >= FREE_HANDLING_THRESHOLD_CENTS
                             else HANDLING_FEE_CENTS
      invoice_total_cents = merchandise_net_cents + handling_fee_cents
    input_set: "The order's standard_qty plus its frozen earned_variant_allocations; unit prices come from the referenced VariantCover rows (the STANDARD cover for the standard line). Cancelled or DRAFT orders are never invoiced."
    constants:
      FREE_HANDLING_THRESHOLD_CENTS: 50000
      HANDLING_FEE_CENTS: 995
      DISCOUNT_PCT: { ENTRY: 0.40, BASIC: 0.45, CORE: 0.50, PREMIER: 0.55 }
    precision: "cents, round_half_up per line. The forbidden alternative (sum all line_gross, then apply factor once and round) diverges: 100 x 399 + 10 x 399 + 4 x 599 at BASIC yields 25458 per-line but 25457 sum-first."
    variants:
      - name: per_line_rounding
        when: "always — this is the pinned order"
        difference: "each line is rounded to the cent before summation"
      - name: sum_then_round
        when: "never — documented only to name the trap"
        difference: "rounding the discounted grand total once produces a total that is 1 cent lower on the worked example above"

  - name: print_run_quantity
    trigger: "POST /comics/issues/{id}/print-runs (side effect: sets run.order_base_units, run.overprint_units, run.quantity)"
    algorithm: waterfall_allocation
    formula: |
      if run.basis == ORDER_DRIVEN:
          order_base_units = sum(o.total_units for o in RetailerOrder
                                 where o.issue_id == issue.id
                                   and o.status IN {FOC_LOCKED, INVOICED, SHIPPED})
          if order_base_units == 0: reject ERR_NO_QUALIFYING_ORDERS
          overprint_units = ceil(order_base_units * OVERPRINT_PCT)
          raw             = order_base_units + overprint_units + RESERVE_COPIES
          quantity        = max(ceil(raw / CARTON_MULTIPLE) * CARTON_MULTIPLE,
                                MIN_FIRST_PRINTING)
      else:   # DEMAND_FORECAST — second printings and reprints
          prior_printed  = sum(r.quantity for r in PrintRun
                               where r.issue_id == issue.id and r.status == PRINTED)
          reorder_units  = sum(o.standard_qty for o in RetailerOrder
                               where o.issue_id == issue.id
                                 and o.status == SUBMITTED and o.is_reorder == true)
          order_base_units = round_half_up(prior_printed * REORDER_DEMAND_FACTOR) + reorder_units
          overprint_units  = 0
          quantity         = max(ceil(order_base_units / CARTON_MULTIPLE) * CARTON_MULTIPLE,
                                 MIN_REPRINT)
    input_set: "ORDER_DRIVEN reads orders with status IN {FOC_LOCKED, INVOICED, SHIPPED} (CANCELLED, DRAFT and SUBMITTED orders are excluded). DEMAND_FORECAST reads PRINTED runs plus SUBMITTED reorders created after the issue went ON_SALE; it deliberately ignores the FOC order book. Both bases are selectable from commercial_status IN {PRINTED, ON_SALE} once a printing exists, so the two variants are observable against one identical database state."
    constants:
      OVERPRINT_PCT: 0.08
      RESERVE_COPIES: 150
      CARTON_MULTIPLE: 250
      MIN_FIRST_PRINTING: 500
      REORDER_DEMAND_FACTOR: 0.35
      MIN_REPRINT: 250
    precision: "whole copies; overprint uses ceil, forecast uses round_half_up, and the final carton rounding is always ceil to the next multiple of 250"
    variants:
      - name: ORDER_DRIVEN
        when: "run.basis == ORDER_DRIVEN; legal while issue.commercial_status IN {FOC_LOCKED, PRINTED, ON_SALE}"
        difference: "quantity is derived from the locked order book plus overprint plus reserve copies"
      - name: DEMAND_FORECAST
        when: "run.basis == DEMAND_FORECAST; legal while issue.commercial_status IN {PRINTED, ON_SALE} AND the issue already has at least one PRINTED run (second printing / reprint)"
        difference: "quantity is derived from trailing print velocity and open reorders and ignores the FOC order book entirely, so the SAME database state yields 750 under DEMAND_FORECAST where ORDER_DRIVEN yields 1500"

  - name: royalty_pool_split
    trigger: "system: invoked once per channel by royalty_accrual during POST /comics/royalty-statements (side effect: sets statement.lines[].creator_share_cents)"
    algorithm: waterfall_allocation
    formula: |
      # combinatorial mode (c): the cover participation is keyed on the pool, and the pro-rata
      # remainder is keyed on the pool MINUS that participation, so the evaluation order is
      # pinned to make every share well defined.
      participants = CreativeAssignment where title_id == title.id
                                          and status IN {ACCEPTED, ACTIVE, COMPLETED}

      # step 1 — cover participation, computed from the PRE-deduction pool P
      cover_pool = floor(P * title.cover_participation_bps / 10000)
      # step 2 — split cover_pool pro-rata across craft == COVER participants by
      #          royalty_share_bps (floor, then 1-cent leftovers by created_at ASC)
      # step 3 — remainder is what is left of P AFTER step 1
      remainder = P - cover_pool
      # step 4 — non-cover participants normalise over their OWN bps sum (not over 10000)
      sum_nc = sum(p.royalty_share_bps for p in participants if p.craft != COVER)
      if sum_nc == 0: every non-cover share = 0
      # step 5 — floored pro-rata shares
      share[p] = floor(remainder * p.royalty_share_bps / sum_nc)
      # step 6 — distribute the 1-cent leftovers deterministically
      leftover = remainder - sum(share[p])
      for p in non-cover participants ordered by created_at ASC (never by id):
          if leftover == 0: break
          share[p] += 1; leftover -= 1
    input_set: "CreativeAssignment rows of the title with status IN {ACCEPTED, ACTIVE, COMPLETED}. PROPOSED, COUNTERED and TERMINATED assignments are excluded and their bps never enter sum_nc."
    constants:
      LEFTOVER_ORDER: "created_at ASC over non-COVER participants; id is never consulted"
    precision: "integer cents; floor per share then 1-cent leftover distribution, so the shares always sum EXACTLY to P"
    variants:
      - name: pinned_remainder_normalisation
        when: "always"
        difference: "non-cover shares are normalised over sum_nc, so they consume 100% of the remainder"
      - name: naive_direct_bps
        when: "never — documented only to name the trap"
        difference: "applying each participant's bps directly to P leaves P * (10000 - cover_bps - sum_nc) / 10000 undistributed; with cover_bps 1500 and sum_nc 8000 the SCRIPT share on a 39420-cent pool would be 19710 instead of the pinned 20942"

  - name: royalty_accrual
    trigger: "POST /comics/royalty-statements (side effect: sets statement.lines, gross_royalty_cents, recoupment_applied_cents, payable_cents)"
    algorithm: aggregation
    formula: |
      statement_assignment = CreativeAssignment where title_id == statement.title_id
                                                  and creator_id == statement.creator_id
                                                  and status IN {ACCEPTED, ACTIVE, COMPLETED}
                             ordered by created_at ASC, take first     # tie-break pinned; never id
      if none: reject ERR_NO_ASSIGNMENT_FOR_CREATOR

      events = RevenueEvent where issue_id IN (Issue where title_id == statement.title_id)
                              and period == statement.period
                              and (statement.basis == ESTIMATED
                                   ? basis_status IN {ESTIMATED, ACTUAL}
                                   : basis_status == ACTUAL)

      lines = []
      for c in [PRINT_DM, DIGITAL, COLLECTED, SUBSIDIARY]:          # fixed channel order
          raw_net = sum(e.net_receipts_cents for e in events if e.channel == c)
          if raw_net == 0: continue                                  # no line emitted
          if statement.basis == ESTIMATED and c == PRINT_DM:
              included_net = floor(raw_net * (100 - RETURNS_RESERVE_PCT) / 100)
          else:
              included_net = raw_net
          channel_pool = floor(included_net * title.royalty_pool_bps
                                            * CHANNEL_MULTIPLIER_BPS[c] / 100000000)
          share = royalty_pool_split(channel_pool)[statement_assignment]
          lines.append({ channel: c, included_net_cents: included_net,
                         channel_pool_cents: channel_pool, creator_share_cents: share })

      gross_royalty_cents      = sum(L.creator_share_cents for L in lines)
      recoupment_applied_cents = min(statement_assignment.unrecouped_advance_cents,
                                     gross_royalty_cents)
      payable_cents            = gross_royalty_cents - recoupment_applied_cents
    input_set: "RevenueEvent rows for every Issue of the title whose period equals the statement period. The basis field selects the basis_status filter: ESTIMATED includes provisional and settled rows, SETTLED includes settled rows only. Channels with zero included net emit no line."
    constants:
      RETURNS_RESERVE_PCT: 20
      CHANNEL_MULTIPLIER_BPS: { PRINT_DM: 10000, DIGITAL: 20000, COLLECTED: 12500, SUBSIDIARY: 40000 }
      POOL_DENOMINATOR: 100000000
    precision: "integer cents; a SINGLE floor per channel pool (net * pool_bps * multiplier_bps / 1e8), never two chained roundings"
    variants:
      - name: ESTIMATED
        when: "statement.basis == ESTIMATED (interim statement)"
        difference: "includes ESTIMATED and ACTUAL revenue rows, and holds back RETURNS_RESERVE_PCT (20%) of the PRINT_DM net before the pool is struck"
      - name: SETTLED
        when: "statement.basis == SETTLED (final statement for the period)"
        difference: "includes ACTUAL rows only and applies no returns holdback, so the same database state yields a different gross: 85432 cents under ESTIMATED vs 79082 cents under SETTLED for the SCRIPT participant of the worked fixture"

  - name: stage_page_fee_ledger
    trigger: "POST /comics/production-stages/{id}/approve (side effect: freezes stage.page_fee_cents and increments title.production_cost_cents)"
    algorithm: aggregation
    formula: |
      stage.page_fee_cents = assignment.page_rate_cents * stage.delivered_pages
      title.production_cost_cents = sum(s.page_fee_cents for s in ProductionStage
                                        where s.status == APPROVED
                                          and s.issue_id IN (Issue where title_id == title.id))
    input_set: "APPROVED stages only. The page rate used is the assignment's page_rate_cents at approval time (later reproposals cannot move an already-frozen fee)."
    constants: {}
    precision: "integer cents, exact multiplication"

  - name: order_units_rollup
    trigger: "system: recomputed on POST /comics/issues/{id}/foc-lock, POST /comics/retailer-orders/{id}/invoice, POST /comics/retailer-orders/{id}/ship, POST /comics/retailer-orders/{id}/cancel and the title-cancel cascade (side effect: refreshes Retailer.cumulative_units_ytd, Retailer.open_balance_cents, Issue.total_ordered_units, Issue.shipped_units)"
    algorithm: aggregation
    formula: |
      # conserved-quantity definitions — these are full recomputes, not deltas
      Retailer.cumulative_units_ytd = retailer.opening_units_ytd
          + sum(o.total_units for o in RetailerOrder where o.retailer_id == retailer.id
                                     and o.status IN {FOC_LOCKED, INVOICED, SHIPPED})
      Retailer.open_balance_cents   = sum(o.invoice_total_cents for o in RetailerOrder
                                          where o.retailer_id == retailer.id
                                            and o.status IN {INVOICED, SHIPPED})
      Issue.total_ordered_units     = sum(o.total_units for o in RetailerOrder
                                          where o.issue_id == issue.id
                                            and o.status IN {FOC_LOCKED, INVOICED, SHIPPED})
      Issue.shipped_units           = sum(o.total_units for o in RetailerOrder
                                          where o.issue_id == issue.id and o.status == SHIPPED)
      Issue.printed_units           = sum(r.quantity for r in PrintRun
                                          where r.issue_id == issue.id and r.status == PRINTED)
    input_set: "Orders in {FOC_LOCKED, INVOICED, SHIPPED} for unit counters, {INVOICED, SHIPPED} for the balance counter; DRAFT, SUBMITTED and CANCELLED orders contribute nothing, which is what makes cancel an exact compensating action."
    constants: {}
    precision: "integer units / integer cents"

  - name: catalog_slot_rollup
    trigger: "system: recomputed on POST /comics/solicitations/{id}/accept, POST /comics/solicitations/{id}/withdraw and the schedule-slip cascade hop 3 (side effect: refreshes Catalog.accepted_slot_count)"
    algorithm: aggregation
    formula: |
      Catalog.accepted_slot_count = count(s for s in Solicitation
                                          where s.catalog_id == catalog.id
                                            and s.status == ACCEPTED)
    input_set: "ACCEPTED solicitations only; DRAFT, SUBMITTED and WITHDRAWN rows never occupy a slot."
    constants: {}
    precision: "integer count"

  - name: title_royalty_ledger
    trigger: "system: recomputed on POST /comics/royalty-statements/{id}/issue and POST /comics/royalty-statements/{id}/reverse (side effect: refreshes Title.royalty_accrued_cents and CreativeAssignment.unrecouped_advance_cents)"
    algorithm: aggregation
    formula: |
      Title.royalty_accrued_cents = sum(st.payable_cents for st in RoyaltyStatement
                                        where st.title_id == title.id
                                          and st.status IN {ISSUED, PAID})
      CreativeAssignment.unrecouped_advance_cents = assignment.advance_cents
          - sum(st.recoupment_applied_cents for st in RoyaltyStatement
                where st.creator_id == assignment.creator_id
                  and st.title_id == assignment.title_id
                  and st.status IN {ISSUED, PAID})
    input_set: "Statements with status IN {ISSUED, PAID}. DRAFT statements have not hit the ledger yet and REVERSED statements have left it, which is what makes reverse an exact compensating action."
    constants: {}
    precision: "integer cents"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body / query shape: required fields present, types correct, enum members legal, integers within their declared ranges, YYYY-MM strings well formed, booking_end_date > booking_start_date, planned_due_date >= planned_start_date, on_sale_month > solicitation_month, net_receipts_cents <= gross_receipts_cents, pagination limit in 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "path-segment resources exist, validated left to right (title before issue before nested child)"
    error_id: "ERR_TITLE_NOT_FOUND | ERR_ISSUE_NOT_FOUND | ERR_CREATOR_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_STAGE_NOT_FOUND | ERR_CATALOG_NOT_FOUND | ERR_SOLICITATION_NOT_FOUND | ERR_RETAILER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_PRINT_RUN_NOT_FOUND | ERR_STATEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 5
    category: existence
    check: "body-referenced resources exist (creator_id, assignment_id, issue_id, retailer_id, title_id, variant_cover_ids[])"
    error_id: "ERR_CREATOR_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_ISSUE_NOT_FOUND | ERR_RETAILER_NOT_FOUND | ERR_TITLE_NOT_FOUND | ERR_VARIANT_COVER_NOT_FOUND"
    http_status: 404
    applies_to: "POST /comics/titles/{id}/creative-assignments, POST /comics/issues/{id}/production-stages, POST /comics/catalogs/{id}/solicitations, POST /comics/retailer-orders, POST /comics/revenue-events, POST /comics/royalty-statements"
  - priority: 6
    category: auth
    check: "entity-backed ownership: a Creator may only act on assignments/stages whose assignment.creator_id equals X-User-ID; a Retailer may only act on orders whose retailer_id equals X-User-ID, and POST /comics/retailer-orders requires body retailer_id == X-User-ID"
    error_id: ERR_FORBIDDEN_RESOURCE
    http_status: 403
    applies_to: "POST /comics/creative-assignments/{id}/accept, POST /comics/creative-assignments/{id}/counter, POST /comics/production-stages/{id}/start, POST /comics/production-stages/{id}/deliver, POST /comics/retailer-orders, POST /comics/retailer-orders/{id}/submit, POST /comics/retailer-orders/{id}/adjust, POST /comics/retailer-orders/{id}/cancel"
  - priority: 7
    category: state
    check: "optimistic concurrency: expected_title_version == title.version / expected_issue_version == issue.version"
    error_id: "ERR_STALE_TITLE_VERSION | ERR_STALE_ISSUE_VERSION"
    http_status: 412
    applies_to: "POST /comics/titles/{id}/creative-assignments, POST /comics/issues/{id}/print-runs"
  - priority: 8
    category: state
    check: "the target resource is in a state from which the requested transition exists (per §1.2), including terminal-state lockdown and repeat-trigger rejection. Two cases are deliberately carved out of this generic check and deferred to the more specific business-safety rule at priority 9, which returns a domain error instead of ERR_INVALID_STATE: cancel on a SHIPPED order and reverse on a PAID statement"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 9
    category: state
    check: "SHIPPED orders are never cancellable and a PAID statement is never reversible"
    error_id: "ERR_RETURNS_NOT_PERMITTED | ERR_STATEMENT_ALREADY_PAID"
    http_status: 409
    applies_to: "POST /comics/retailer-orders/{id}/cancel, POST /comics/royalty-statements/{id}/reverse"
  - priority: 10
    category: state
    check: "cross-entity state gate: title.status IN {GREENLIT, IN_PRODUCTION, PUBLISHING} for assignment creation and for issue creation; assignment.status IN {ACCEPTED, ACTIVE} for stage start; catalog.status == LOCKED for solicitation accept; issue.commercial_status == SOLICITED (or ON_SALE for reorders) for order submit; retailer.status == ACTIVE for order submit and invoice; issue.production_status == CAMERA_READY for print completion and release; issue.printed_units >= issue.total_ordered_units for shipping"
    error_id: "ERR_TITLE_NOT_GREENLIT | ERR_ASSIGNMENT_NOT_ACCEPTED | ERR_CATALOG_NOT_LOCKED | ERR_ISSUE_NOT_SOLICITED | ERR_RETAILER_NOT_ACTIVE | ERR_NOT_CAMERA_READY | ERR_PRINT_NOT_COMPLETE"
    http_status: 409
    applies_to: "POST /comics/titles/{id}/creative-assignments, POST /comics/titles/{id}/issues, POST /comics/production-stages/{id}/start, POST /comics/solicitations/{id}/accept, POST /comics/retailer-orders/{id}/submit, POST /comics/retailer-orders/{id}/invoice, POST /comics/print-runs/{id}/complete, POST /comics/issues/{id}/release, POST /comics/retailer-orders/{id}/ship"
  - priority: 11
    category: business_safety
    check: "segregation of duties: the X-User-ID paying a royalty statement must differ from statement.issued_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /comics/royalty-statements/{id}/pay"
  - priority: 12
    category: business_safety
    check: "non-returnable direct-market terms: retailer.non_returnable_ack == true before an order may be submitted or invoiced"
    error_id: ERR_NON_RETURNABLE_ACK_REQUIRED
    http_status: 409
    applies_to: "POST /comics/retailer-orders/{id}/submit, POST /comics/retailer-orders/{id}/invoice"
  - priority: 13
    category: business_safety
    check: "negotiation discipline: an assignment may not be reproposed once negotiation_round has reached MAX_NEGOTIATION_ROUNDS (3)"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /comics/creative-assignments/{id}/repropose"
  - priority: 14
    category: business_temporal
    check: "solicitation submission window: logical clock <= catalog.submission_deadline"
    error_id: ERR_SOLICITATION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /comics/solicitations/{id}/submit"
  - priority: 15
    category: business_temporal
    check: "catalog lock requires the submission deadline to have lapsed (logical clock > catalog.submission_deadline)"
    error_id: ERR_CATALOG_DEADLINE_NOT_PASSED
    http_status: 409
    applies_to: "POST /comics/catalogs/{id}/lock"
  - priority: 16
    category: business_temporal
    check: "FOC timing: foc-lock requires logical clock >= issue.foc_date; order adjustment requires logical clock < issue.foc_date; release requires logical clock >= issue.target_on_sale_date"
    error_id: "ERR_FOC_NOT_REACHED | ERR_FOC_ALREADY_PASSED | ERR_ON_SALE_DATE_NOT_REACHED"
    http_status: 409
    applies_to: "POST /comics/issues/{id}/foc-lock, POST /comics/retailer-orders/{id}/adjust, POST /comics/issues/{id}/release"
  - priority: 17
    category: business_temporal
    check: "digital embargo: a DIGITAL ReleaseWindow.release_date must be >= issue.target_on_sale_date + DIGITAL_EMBARGO_DAYS (30) calendar days"
    error_id: ERR_DIGITAL_EMBARGO_VIOLATION
    http_status: 422
    applies_to: "POST /comics/issues/{id}/release-windows"
  - priority: 18
    category: business_temporal
    check: "collected-edition cannibalization blackout: a COLLECTED ReleaseWindow.release_date must fall strictly after (max target_on_sale_date over the title's issues with commercial_status != CANCELLED) + COLLECTED_BLACKOUT_DAYS (90); the blackout end date itself is still inside the window"
    error_id: ERR_CANNIBALIZATION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /comics/issues/{id}/release-windows"
  - priority: 19
    category: business_constraint
    check: "creator studio booking overlap: the new assignment's half-open interval [booking_start_date, booking_end_date) must not intersect any existing interval of the same creator whose assignment status IN {PROPOSED, COUNTERED, ACCEPTED, ACTIVE}; touching intervals (previous end == new start) are allowed"
    error_id: ERR_CREATOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /comics/titles/{id}/creative-assignments"
  - priority: 20
    category: business_constraint
    check: "on-sale cadence buffer: abs(new issue.target_on_sale_date - target_on_sale_date of any sibling issue with commercial_status != CANCELLED) must be >= ON_SALE_CADENCE_DAYS (21) calendar days"
    error_id: ERR_ON_SALE_CADENCE_CONFLICT
    http_status: 409
    applies_to: "POST /comics/titles/{id}/issues"
  - priority: 21
    category: business_constraint
    check: "reprint blackout: creating a DEMAND_FORECAST print run is refused when the issue has a COLLECTED ReleaseWindow whose release_date is within REPRINT_COLLECTED_GUARD_DAYS (60) calendar days after the logical clock"
    error_id: ERR_COLLECTED_EDITION_CONFLICT
    http_status: 409
    applies_to: "POST /comics/issues/{id}/print-runs"
  - priority: 22
    category: business_constraint
    check: "uniqueness: issue_number per title; VariantCover.code per issue; Catalog.solicitation_month; Retailer.account_no; Title.name; at most one Solicitation per (catalog_id, issue_id) with status IN {DRAFT, SUBMITTED, ACCEPTED}; at most one RoyaltyStatement per (title_id, creator_id, period, basis) with status IN {DRAFT, ISSUED, PAID}"
    error_id: "ERR_DUPLICATE_ISSUE_NUMBER | ERR_DUPLICATE_VARIANT_CODE | ERR_DUPLICATE_SOLICITATION | ERR_DUPLICATE_STATEMENT_PERIOD | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "POST /comics/titles/{id}/issues, POST /comics/issues/{id}/variant-covers, POST /comics/catalogs, POST /comics/retailers, POST /comics/titles, POST /comics/catalogs/{id}/solicitations, POST /comics/royalty-statements"
  - priority: 23
    category: business_constraint
    check: "capacity: catalog.accepted_slot_count < catalog.max_slots before a solicitation is accepted"
    error_id: ERR_CATALOG_SLOTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /comics/solicitations/{id}/accept"
  - priority: 24
    category: business_constraint
    check: "craft and scope coherence: assignment.craft must be a member of creator.crafts; stage.craft must equal assignment.craft; the referenced assignment's title_id must equal the issue's title_id; RATIO_INCENTIVE covers require incentive_ratio IN {10,25,50,100} and other kinds must omit it; exclusive_variant_qty > 0 requires the issue to have a RETAILER_EXCLUSIVE cover"
    error_id: "ERR_CRAFT_NOT_SUPPORTED | ERR_CRAFT_MISMATCH | ERR_TITLE_SCOPE_MISMATCH | ERR_VARIANT_RATIO_INVALID | ERR_VARIANT_NOT_AVAILABLE"
    http_status: 422
    applies_to: "POST /comics/titles/{id}/creative-assignments, POST /comics/issues/{id}/production-stages, POST /comics/issues/{id}/variant-covers, POST /comics/retailer-orders"
  - priority: 25
    category: business_referential
    check: "required related rows exist: at least one SUBMITTED order at FOC lock; at least one ACCEPTED solicitation at catalog publish; a STANDARD cover on the issue before its solicitation is submitted; a ProductionStage row for every craft in REQUIRED_CRAFTS = {SCRIPT, PENCILS, INKS, COLORS, LETTERS} on the issue before a PrintRun may be created for it, and again before that run may be completed (the create-time check is the reachable one: completion is already gated on production_status == CAMERA_READY at priority 10, which implies a complete stage set); an ACCEPTED/ACTIVE/COMPLETED assignment for the statement's creator"
    error_id: "ERR_NO_QUALIFYING_ORDERS | ERR_NO_ACCEPTED_SOLICITATIONS | ERR_STANDARD_COVER_REQUIRED | ERR_REQUIRED_CRAFT_STAGES_MISSING | ERR_NO_ASSIGNMENT_FOR_CREATOR"
    http_status: 409
    applies_to: "POST /comics/issues/{id}/foc-lock, POST /comics/catalogs/{id}/publish, POST /comics/solicitations/{id}/submit, POST /comics/issues/{id}/print-runs, POST /comics/print-runs/{id}/complete, POST /comics/royalty-statements"
  - priority: 26
    category: business_fiscal
    check: "royalty pool budget: title.committed_share_bps + assignment.royalty_share_bps <= 10000 - title.cover_participation_bps when a non-COVER assignment is accepted"
    error_id: ERR_ROYALTY_SHARE_POOL_EXCEEDED
    http_status: 422
    applies_to: "POST /comics/creative-assignments/{id}/accept"
  - priority: 27
    category: business_fiscal
    check: "credit control, two different comparisons on the same pair of fields: at order submission the retailer must still have headroom, retailer.open_balance_cents < retailer.credit_limit_cents (strict — a retailer already sitting exactly on its limit may not open new orders), while at invoicing the landing balance may touch the limit, retailer.open_balance_cents + computed invoice_total_cents <= retailer.credit_limit_cents (inclusive — an invoice that lands exactly on the limit is accepted, one cent more is refused)"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /comics/retailer-orders/{id}/submit, POST /comics/retailer-orders/{id}/invoice"
  - priority: 28
    category: business_fiscal
    check: "a royalty statement with payable_cents == 0 may be issued for the record but never paid"
    error_id: ERR_ZERO_PAYABLE_STATEMENT
    http_status: 422
    applies_to: "POST /comics/royalty-statements/{id}/pay"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    purpose: "Set the logical UTC clock that every temporal rule reads. MUST be called before any date-sensitive scenario; default when never called is 2026-08-01T00:00:00Z."
    roles: [EditorInChief, ManagingEditor, SalesDirector, RoyaltyAccountant, Creator, Retailer]
    input: ["to_iso8601"]
    output: { to_iso8601: string }
    side_effects: ["sets the logical clock used by every temporal validation and by every system timestamp"]
    errors: [ERR_UNAUTHENTICATED, ERR_INVALID_REQUEST]

  - method: POST
    path: "/comics/creators"
    purpose: "Register a creator with the crafts they can be assigned to."
    roles: [EditorInChief, ManagingEditor]
    input: ["full_name", "crafts", "default_page_rate_cents"]
    output: Creator
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
  - method: GET
    path: "/comics/creators"
    purpose: "List creators."
    roles: [EditorInChief, ManagingEditor, RoyaltyAccountant]
    input: ["craft?", "limit?", "offset?"]
    output: Creator[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
  - method: GET
    path: "/comics/creators/{id}"
    purpose: "Read one creator."
    roles: [EditorInChief, ManagingEditor, RoyaltyAccountant, Creator]
    input: []
    output: Creator
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CREATOR_NOT_FOUND]
  - method: GET
    path: "/comics/creators/{id}/creative-assignments"
    purpose: "List every assignment held by this creator (reverse lookup for CreativeAssignment.creator_id)."
    roles: [EditorInChief, ManagingEditor, RoyaltyAccountant, Creator]
    input: ["status?", "limit?", "offset?"]
    output: CreativeAssignment[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CREATOR_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: POST
    path: "/comics/titles"
    purpose: "Pitch a new title."
    roles: [EditorInChief]
    input: ["name", "planned_issue_count", "royalty_pool_bps", "cover_participation_bps"]
    output: Title
    side_effects: ["creates the title in status PITCHED with committed_share_bps 0"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
  - method: GET
    path: "/comics/titles"
    purpose: "List titles."
    roles: [EditorInChief, ManagingEditor, SalesDirector, RoyaltyAccountant]
    input: ["status?", "limit?", "offset?"]
    output: Title[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
  - method: GET
    path: "/comics/titles/{id}"
    purpose: "Read one title including its derived ledgers."
    roles: [EditorInChief, ManagingEditor, SalesDirector, RoyaltyAccountant, Creator]
    input: []
    output: Title
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_TITLE_NOT_FOUND]
  - method: POST
    path: "/comics/titles/{id}/greenlight"
    purpose: "Greenlight a pitched title so creative assignments and issues can be created."
    roles: [EditorInChief]
    input: []
    output: Title
    side_effects: ["title.status PITCHED -> GREENLIT", "sets greenlit_at = logical clock", "increments Title.version"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_TITLE_NOT_FOUND, ERR_INVALID_STATE]
  - method: POST
    path: "/comics/titles/{id}/cancel"
    purpose: "Cancel a title and unwind its creative, editorial and order commitments."
    roles: [EditorInChief]
    input: ["reason"]
    output: Title
    side_effects:
      - "title.status -> CANCELLED and cancel_reason set"
      - "CASCADE hop 1': open CreativeAssignment rows of the title -> TERMINATED"
      - "CASCADE hop 2' (caused by hop 1'): Creator.active_assignment_count recomputed"
      - "CASCADE hop 1: non-cancelled Issue rows -> production_status CANCELLED and commercial_status CANCELLED"
      - "CASCADE hop 2 (caused by hop 1): PLANNED PrintRun rows, open ProductionStage rows and non-shipped RetailerOrder rows of those issues -> CANCELLED"
      - "CASCADE hop 3 (caused by hop 2): Retailer.cumulative_units_ytd, Retailer.discount_tier, Retailer.open_balance_cents and Issue.total_ordered_units recomputed by order_units_rollup and retailer_discount_tier"
      - "increments Title.version"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_TITLE_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE]
  - method: POST
    path: "/comics/titles/{id}/creative-assignments"
    purpose: "Assign a creator to a craft on this title with page rate, royalty share, advance and a studio booking window."
    roles: [EditorInChief]
    input: ["creator_id", "craft", "page_rate_cents", "royalty_share_bps", "booking_start_date", "booking_end_date", "advance_cents?", "expected_title_version"]
    output: CreativeAssignment
    side_effects:
      - "creates the assignment in status PROPOSED with negotiation_round 1 and unrecouped_advance_cents = advance_cents"
      - "increments Creator.active_assignment_count"
      - "increments Title.version (OCC parent bump)"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_TITLE_NOT_FOUND, ERR_CREATOR_NOT_FOUND, ERR_INVALID_REQUEST, ERR_STALE_TITLE_VERSION, ERR_TITLE_NOT_GREENLIT, ERR_CREATOR_DOUBLE_BOOKED, ERR_CRAFT_NOT_SUPPORTED]
  - method: GET
    path: "/comics/titles/{id}/creative-assignments"
    purpose: "List the title's creative team (reverse lookup for CreativeAssignment.title_id)."
    roles: [EditorInChief, ManagingEditor, RoyaltyAccountant]
    input: ["craft?", "status?", "limit?", "offset?"]
    output: CreativeAssignment[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_TITLE_NOT_FOUND, ERR_INVALID_REQUEST]
  - method: POST
    path: "/comics/titles/{id}/issues"
    purpose: "Schedule an issue of the title; the FOC date is derived from the on-sale date."
    roles: [ManagingEditor]
    input: ["issue_number", "page_count", "cover_price_cents", "target_on_sale_date"]
    output: Issue
    side_effects:
      - "creates the issue with production_status PLANNED, commercial_status UNSOLICITED, schedule_health ON_TRACK"
      - "sets foc_date = target_on_sale_date - FOC_LEAD_DAYS (21) calendar days"
      - "title.status GREENLIT -> IN_PRODUCTION on the first issue of the title"
      - "increments Title.version"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_TITLE_NOT_FOUND, ERR_INVALID_REQUEST, ERR_TITLE_NOT_GREENLIT, ERR_DUPLICATE_ISSUE_NUMBER, ERR_ON_SALE_CADENCE_CONFLICT]
  - method: GET
    path: "/comics/titles/{id}/issues"
    purpose: "List the title's issues (reverse lookup for Issue.title_id)."
    roles: [EditorInChief, ManagingEditor, SalesDirector]
    input: ["commercial_status?", "production_status?", "limit?", "offset?"]
    output: Issue[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_TITLE_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: GET
    path: "/comics/creative-assignments/{id}"
    purpose: "Read one creative assignment including negotiation and advance state."
    roles: [EditorInChief, ManagingEditor, RoyaltyAccountant, Creator]
    input: []
    output: CreativeAssignment
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ASSIGNMENT_NOT_FOUND]
  - method: POST
    path: "/comics/creative-assignments/{id}/counter"
    purpose: "Creator counters the offered page rate and royalty share."
    roles: [Creator]
    input: ["counter_page_rate_cents", "counter_royalty_share_bps"]
    output: CreativeAssignment
    side_effects: ["assignment.status PROPOSED -> COUNTERED", "stores the counter terms", "increments CreativeAssignment.version"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ASSIGNMENT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_FORBIDDEN_RESOURCE, ERR_INVALID_STATE]
  - method: POST
    path: "/comics/creative-assignments/{id}/repropose"
    purpose: "Editor reproposes revised terms, closing one negotiation round."
    roles: [EditorInChief]
    input: ["page_rate_cents", "royalty_share_bps"]
    output: CreativeAssignment
    side_effects:
      - "assignment.status COUNTERED -> PROPOSED"
      - "overwrites page_rate_cents / royalty_share_bps and clears the counter fields"
      - "increments negotiation_round by 1"
      - "increments CreativeAssignment.version"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ASSIGNMENT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_NEGOTIATION_ROUNDS_EXHAUSTED]
  - method: POST
    path: "/comics/creative-assignments/{id}/accept"
    purpose: "Creator accepts the current terms, committing the title's royalty pool."
    roles: [Creator]
    input: []
    output: CreativeAssignment
    side_effects:
      - "assignment.status PROPOSED -> ACCEPTED"
      - "title.committed_share_bps += assignment.royalty_share_bps for non-COVER crafts"
      - "increments Title.version and CreativeAssignment.version"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ASSIGNMENT_NOT_FOUND, ERR_FORBIDDEN_RESOURCE, ERR_INVALID_STATE, ERR_ROYALTY_SHARE_POOL_EXCEEDED]
  - method: POST
    path: "/comics/creative-assignments/{id}/terminate"
    purpose: "Terminate a countered assignment that will not be agreed."
    roles: [EditorInChief]
    input: ["reason"]
    output: CreativeAssignment
    side_effects: ["assignment.status COUNTERED -> TERMINATED", "decrements Creator.active_assignment_count", "increments CreativeAssignment.version"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ASSIGNMENT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE]
  - method: GET
    path: "/comics/creative-assignments/{id}/production-stages"
    purpose: "List the stages booked against this assignment (reverse lookup for ProductionStage.assignment_id)."
    roles: [EditorInChief, ManagingEditor, Creator]
    input: ["status?", "limit?", "offset?"]
    output: ProductionStage[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ASSIGNMENT_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: GET
    path: "/comics/issues/{id}"
    purpose: "Read one issue with both status dimensions and its derived counters."
    roles: [EditorInChief, ManagingEditor, SalesDirector, RoyaltyAccountant, Creator, Retailer]
    input: []
    output: Issue
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ISSUE_NOT_FOUND]
  - method: POST
    path: "/comics/issues/{id}/production-stages"
    purpose: "Book a production stage (script, pencils, inks, colors, letters) against an accepted assignment."
    roles: [ManagingEditor]
    input: ["assignment_id", "craft", "planned_start_date", "planned_due_date"]
    output: ProductionStage
    side_effects:
      - "creates the stage in status NOT_STARTED with slip_days 0 and kickback_count 0"
      - "issue.production_status re-derived over the enlarged child set (may regress, e.g. ART -> SCRIPTING when a further SCRIPT stage is booked)"
      - "increments Issue.version by 1 whenever the re-derived production_status changes"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ISSUE_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_CRAFT_MISMATCH, ERR_TITLE_SCOPE_MISMATCH]
  - method: GET
    path: "/comics/issues/{id}/production-stages"
    purpose: "List the issue's stages (reverse lookup for ProductionStage.issue_id)."
