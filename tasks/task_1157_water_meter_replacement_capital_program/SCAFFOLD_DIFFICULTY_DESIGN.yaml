  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_no_access_cycle
        grounds:
          - state_machines.WorkOrder.SCHEDULED_to_ACCESS_FAILED
          - state_machines.WorkOrder.ACCESS_FAILED_to_SCHEDULED
        distinguishing_aspect: |
          WorkOrder machine is cyclic: SCHEDULED -> ACCESS_FAILED (no-access) ->
          SCHEDULED (re-book). After the loop the work order is schedulable again,
          strikes accumulate (1), and the new appointment has attempt_number 2.
        test_recipe:
          setup:
            - "Standard baseline: work order NOTIFIED with USPS delivery 2026-05-02; appointment BOOKED 2026-05-06 AM"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AMI-2027", fiscal_year: "FY2027", budget_total_cents: 5000000, target_meter_count: 2400, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000, notice_days: 3 }, as: ProgramManager, captures: { prog: $.data.id } }
