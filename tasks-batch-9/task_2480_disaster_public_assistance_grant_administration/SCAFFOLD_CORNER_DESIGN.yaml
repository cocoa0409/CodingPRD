              captures: { appeal_id: $.data.id }
            - call: "POST /public-assistance/appeals/${appeal_id}/decide"
              payload: { decision: "DENY", decision_rationale: "Invoices do not tie to the approved scope of work" }
              as: AppealsAdjudicator
              as_user_id: "adjudicator-1"
          trigger:
            - call: "POST /public-assistance/appeals/${appeal_id}/decide"
