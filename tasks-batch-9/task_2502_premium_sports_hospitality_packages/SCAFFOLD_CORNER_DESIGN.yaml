      - name: waterfall_fills_blocks_by_priority_rank_then_parks_the_remainder
        claim_type: waterfall_allocation
        grounds: >-
          calculations.channel_allocation_waterfall (distributable = released
          units; candidate blocks ordered by priority_rank ASC then created_at
          ASC; give = min(target_units, remaining); block_state = EXHAUSTED iff
          give == target_units; RightsDeal.unallocated_units = remaining);
          endpoints "POST /release-tranches/{id}/confirm" side_effects (runs the
          waterfall and may flip a block OPEN -> EXHAUSTED; it never reduces an
          existing allocation); state_machines.AllocationBlock OPEN -> EXHAUSTED.
        distinguishing_aspect: >-
          Three channel blocks (30 / 40 / 20 by priority 1 / 2 / 3) fed by two
          50-unit releases, so the first release lands mid-way through the second
          block: rank 1 fills exactly (EXHAUSTED), rank 2 takes the 20-unit
          remainder and must stay OPEN because 20 != its 40-unit target, and
          rank 3 gets nothing yet stays OPEN with allocated_units 0. The second
          release then fills ranks 2 and 3 and leaves 10 units with nowhere to
          go, which must surface as RightsDeal.unallocated_units 10 rather than
          being force-fed to a full block — total allocated 90 against 100
          released.
        test_recipe:
          setup: "Canonical event; 100-unit TICKET deal (guaranteed_minimum 0) committed; three OPEN channel blocks; two 50-unit tranches promised."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 100, guaranteed_minimum_units: 0, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id" } }
