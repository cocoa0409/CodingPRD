            - "GET /flights/${fl_id} reports ticketed_booking_count 0"

      - name: re_adding_an_active_product_is_refused_but_a_withdrawn_one_may_come_back
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ATTRIBUTE_DUPLICATE_PRODUCT]
          - validations[priority 34]
          - entities.FamilyAttribute.fields.attribute_state
        distinguishing_aspect: "The uniqueness is scoped to attribute_state == ACTIVE, so the same product is refused while the first row is ACTIVE and accepted the moment that row is WITHDRAWN - leaving two rows for one product, only one of them ACTIVE."
        test_recipe:
          setup:
            - "DRAFT family ECO_DUP carries one ACTIVE INCLUDED BAG_CHECKED_1 attribute at list 3500, so the family reads unbundled 3500"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_DUP", name: "Economy Duplicate Probe", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_dup_id: $.data.id }
            - call: "POST /fare-families/${f_dup_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { a_first_id: $.data.id }
          trigger:
            - call: "POST /fare-families/${f_dup_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "CHARGEABLE", included_quantity: 0 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { err: $.data.error_id }
            - call: "PATCH /family-attributes/${a_first_id}"
              payload: { attribute_state: "WITHDRAWN" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_dup_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "CHARGEABLE", included_quantity: 0 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { a_second_id: $.data.id }
          assert:
            - "the first trigger is HTTP 409 with error_id \"ERR_ATTRIBUTE_DUPLICATE_PRODUCT\""
            - "the third trigger is HTTP 201: the same product may be re-attached once the earlier row is WITHDRAWN"
            - "GET /fare-families/${f_dup_id}/attributes returns total_count == 2, with ${a_first_id} WITHDRAWN and ${a_second_id} ACTIVE"
            - "GET /fare-families/${f_dup_id} reports unbundled_value_cents 0 and a_la_carte_total_cents 12000: the surviving ACTIVE row is CHARGEABLE with included_quantity 0, so it contributes attr_value_cents 0"
            - "the family's fee_fingerprint is \"ECO_DUP|1|BAG_CHECKED_1:CHARGEABLE:0:3500\""

      - name: republishing_the_same_family_channel_pair_returns_duplicate_publication
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_PUBLICATION]
          - validations[priority 35]
          - validations[priority 22]
        distinguishing_aspect: "The pair uniqueness is only reached with a fresh expected_fare_family_version (priority 22 fires first otherwise), so the second publication of an IN_PARITY pair is refused at priority 35 with publication_count still 1."
        test_recipe:
          setup:
            - "family ECO_PUB is PUBLISHED and already published on DIRECT_WEB, so that pair has an IN_PARITY publication"
            - "the family's current version has been re-read after that first publication, so the OCC check at priority 22 will pass"
