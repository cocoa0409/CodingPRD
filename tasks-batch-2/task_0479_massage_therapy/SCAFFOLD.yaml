    roles: [PracticeAdmin, FrontDesk]
    code: 201
    input: ["client_id", "plan_id", "cycle_anchor_day?"]
    output: Package
    side_effects: ["credit_balance_sessions = plan.included_sessions via CreditLedgerEntry(GRANT)", "set current_cycle_end = clock.now + one cycle", "set package_status = ACTIVE"]
  - method: GET
    path: "/practice/packages"
    description: "List packages; filter by client_id (reverse-reachability for Package.client_id and plan_id FKs) or plan_id."
    roles: [PracticeAdmin, FrontDesk, Client]
    code: 200
    input: ["client_id?", "plan_id?", "limit?", "offset?"]
    output: Package[]
    side_effects: []
  - method: GET
    path: "/practice/packages/{id}"
    description: "Fetch a package (includes credit_balance_sessions, current_cycle_end, package_status, version)."
    roles: [PracticeAdmin, FrontDesk, Client]
    code: 200
    input: []
    output: Package
    side_effects: []
  - method: GET
    path: "/practice/packages/{id}/ledger"
    description: "List the package's credit ledger entries (reverse-reachability for CreditLedgerEntry.package_id FK)."
    roles: [PracticeAdmin, FrontDesk, Client]
