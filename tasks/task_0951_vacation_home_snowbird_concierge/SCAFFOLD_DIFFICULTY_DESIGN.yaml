            - "HOP 4: Invoice.${inv_id}.gross_service_cents == 19986, tax_cents == 1399, total_cents == 21385"
            - "HOP 5: Visit.${v_in_id}.status == DEFERRED and Visit.${v_in_id}.defer_reason == SUBSCRIPTION_PAUSED"
