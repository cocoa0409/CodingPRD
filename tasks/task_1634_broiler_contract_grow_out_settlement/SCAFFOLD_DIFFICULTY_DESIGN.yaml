            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-40", week_ending_date: "2026-11-07" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-P2" }, as: IntegratorAdmin, captures: { f: $.data.id } }
            - { call: "POST /api/flocks/${f}/placements", payload: { scheduled_date: "2026-08-20", head_count: 5000 }, as: IntegratorAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/placements/${p}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/feed-deliveries", payload: { delivered_date: "2026-08-21", feed_lbs: 1000, feed_type: STARTER, ticket_no: "FT-P2" }, as: IntegratorAdmin }
            - { call: "POST /api/catch-crews", payload: { crew_code: "CREW-P2", max_catches_per_day: 2 }, as: LivehaulScheduler, captures: { crew: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: IntegratorAdmin }
          trigger:
            - { call: "POST /api/flocks/${f}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-01" }, as: LivehaulScheduler, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_FLOCK_TOO_YOUNG (flock age 12 days < 35; business_temporal check fires before any business_constraint check would be consulted)"

  # ------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: condemnation_loss_threshold_strictly_greater
        grounds:
          - "validations[priority=8]"
          - state_machines.Flock.GROWING_to_CONDEMNED_LOSS
          - "errors[ERR_CONDEMNATION_BELOW_THRESHOLD]"
        distinguishing_aspect: |
          Boundary on the condemnation_pct metric via the
          declare-condemned-loss endpoint: rule is strictly > 0.30, so
          condemnation_pct exactly 0.30 is rejected and 0.30+epsilon
          succeeds.
        test_recipe:
          setup:
            - "Flock placed 1000, mortality 0, condemned 300 -> condemnation_pct exactly 0.30; second flock condemned 301 -> 0.301"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/growers", payload: { grower_code: "G-B1", full_name: "Boundary Grower" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 5000 }, as: IntegratorAdmin, captures: { h1: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H2", capacity_birds: 5000 }, as: IntegratorAdmin, captures: { h2: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-B1", base_pay_cents_per_lb: 6, committed_house_count: 2, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-41", week_ending_date: "2026-11-14" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h1}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-B30" }, as: IntegratorAdmin, captures: { f1: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h2}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-B301" }, as: IntegratorAdmin, captures: { f2: $.data.id } }
            - { call: "POST /api/flocks/${f1}/placements", payload: { scheduled_date: "2026-08-01", head_count: 1000 }, as: IntegratorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/flocks/${f2}/placements", payload: { scheduled_date: "2026-08-01", head_count: 1000 }, as: IntegratorAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/placements/${p1}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/placements/${p2}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f1}/feed-deliveries", payload: { delivered_date: "2026-08-05", feed_lbs: 1000, feed_type: STARTER, ticket_no: "FT-B30" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f2}/feed-deliveries", payload: { delivered_date: "2026-08-05", feed_lbs: 1000, feed_type: STARTER, ticket_no: "FT-B301" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f1}/mortality-reports", payload: { report_date: "2026-08-20", dead_head: 0, condemned_head: 300 }, as: Grower, as_user_id: "${g}" }
            - { call: "POST /api/flocks/${f2}/mortality-reports", payload: { report_date: "2026-08-20", dead_head: 0, condemned_head: 301 }, as: Grower, as_user_id: "${g}" }
          trigger:
            - { call: "POST /api/flocks/${f1}/declare-condemned-loss", payload: {}, as: IntegratorAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /api/flocks/${f2}/declare-condemned-loss", payload: {}, as: IntegratorAdmin }
            - { call: "GET /api/flocks/${f2}", payload: {}, as: IntegratorAdmin, captures: { st: $.data.status } }
          assert:
            - "declare on flock ${f1} (condemnation_pct == 0.30 exactly) rejected with ERR_CONDEMNATION_BELOW_THRESHOLD — the rule is strictly greater-than"
            - "declare on flock ${f2} (condemnation_pct == 0.301) succeeds; Flock.${f2}.status == CONDEMNED_LOSS"
            - "House of flock ${f2} has downtime_until == 2026-08-22 (logical clock 2026-08-01 + 21 days)"

      - name: crew_daily_capacity_at_exactly_max
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_CREW_OVERBOOKED]"
        distinguishing_aspect: |
          Boundary on the crew-count metric via the catch-schedules endpoint
          (different metric and endpoint than condemnation): scheduling the
          max_catches_per_day-th catch succeeds, and the (max+1)-th on the
          same catch_date fails with ERR_CREW_OVERBOOKED — an empty-pool /
          exact-capacity edge.
        test_recipe:
          setup:
            - "Crew with max_catches_per_day 1; two GROWING flocks old enough; both schedule catch on 2026-09-10"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/growers", payload: { grower_code: "G-B2", full_name: "Boundary Grower 2" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 5000 }, as: IntegratorAdmin, captures: { h1: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H2", capacity_birds: 5000 }, as: IntegratorAdmin, captures: { h2: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-B2", base_pay_cents_per_lb: 6, committed_house_count: 2, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-42", week_ending_date: "2026-11-21" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h1}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-B21" }, as: IntegratorAdmin, captures: { f1: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h2}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-B22" }, as: IntegratorAdmin, captures: { f2: $.data.id } }
            - { call: "POST /api/flocks/${f1}/placements", payload: { scheduled_date: "2026-08-01", head_count: 1000 }, as: IntegratorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/flocks/${f2}/placements", payload: { scheduled_date: "2026-08-01", head_count: 1000 }, as: IntegratorAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/placements/${p1}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/placements/${p2}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f1}/feed-deliveries", payload: { delivered_date: "2026-08-05", feed_lbs: 1000, feed_type: STARTER, ticket_no: "FT-B21" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f2}/feed-deliveries", payload: { delivered_date: "2026-08-05", feed_lbs: 1000, feed_type: STARTER, ticket_no: "FT-B22" }, as: IntegratorAdmin }
            - { call: "POST /api/catch-crews", payload: { crew_code: "CREW-B2", max_catches_per_day: 1 }, as: LivehaulScheduler, captures: { crew: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: IntegratorAdmin }
          trigger:
            - { call: "POST /api/flocks/${f1}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler }
            - { call: "POST /api/flocks/${f2}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler, captures: { err: $.data.error_id } }
          assert:
            - "first schedule succeeds (crew at exactly 1 of 1 booked)"
            - "second schedule on same catch_date rejected with ERR_CREW_OVERBOOKED"
            - "Flock.${f2}.status remains GROWING (no partial transition)"

  # ------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: settlement_approve_depends_on_group_locked
        grounds:
          - state_machines.Settlement.PENDING_to_APPROVED
          - "validations[priority=15]"
          - "errors[ERR_GROUP_NOT_LOCKED]"
        distinguishing_aspect: |
          Settlement -> SettlementGroup pair: approve is rejected while the
          parent group is OPEN and allowed only after LOCKED; the settlement
          entity's valid transition set is gated by a different entity's
          state.
        test_recipe:
          setup:
            - "Single-flock group OPEN; settlement recomputed (PROVISIONAL PENDING)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/growers", payload: { grower_code: "G-X1", full_name: "Cross Grower 1" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 10000 }, as: IntegratorAdmin, captures: { h: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-X1", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-43", week_ending_date: "2026-11-28" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-X1" }, as: IntegratorAdmin, captures: { f: $.data.id } }
            - { call: "POST /api/flocks/${f}/placements", payload: { scheduled_date: "2026-08-01", head_count: 5000 }, as: IntegratorAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/placements/${p}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/feed-deliveries", payload: { delivered_date: "2026-08-05", feed_lbs: 10000, feed_type: STARTER, ticket_no: "FT-X1" }, as: IntegratorAdmin }
            - { call: "POST /api/catch-crews", payload: { crew_code: "CREW-X1", max_catches_per_day: 2 }, as: LivehaulScheduler, captures: { crew: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler, captures: { cs: $.data.id } }
            - { call: "POST /api/flocks/${f}/weight-tickets", payload: { ticket_no: "WT-X1", weighed_at: "2026-09-10T08:00:00Z", live_weight_lbs: 5000 }, as: LivehaulScheduler }
            - { call: "POST /api/catch-schedules/${cs}/complete", payload: {}, as: LivehaulScheduler }
            - { call: "GET /api/flocks/${f}", payload: {}, as: SettlementAnalyst, captures: { fv: $.data.version } }
            - { call: "POST /api/flocks/${f}/recompute-settlement", payload: { expected_flock_version: "${fv}" }, as: SettlementAnalyst, captures: { s: $.data.id } }
          trigger:
            - { call: "POST /api/settlements/${s}/approve", payload: {}, as: SettlementAnalyst, captures: { err: $.data.error_id } }
            - { call: "POST /api/settlement-groups/${grp}/lock", payload: {}, as: SettlementAnalyst }
            - { call: "POST /api/settlements/${s}/approve", payload: {}, as: SettlementAnalyst }
          assert:
            - "approve while group OPEN -> ERR_GROUP_NOT_LOCKED"
            - "after lock, same approve succeeds and Settlement.${s}.status == APPROVED, Flock.${f}.status == SETTLED"

      - name: contract_renewal_depends_on_loan_presence
        grounds:
          - state_machines.GrowerContract.RENEWAL_PENDING_to_RENEWED
          - "validations[priority=13]"
          - "errors[ERR_RENEWAL_BLOCKED]"
        distinguishing_aspect: |
          GrowerContract -> GrowerLoan pair (different entity pair than
          Settlement->SettlementGroup): renewal is blocked while
          upgrade_required is true and no CAPITAL_UPGRADE loan exists, and
          unblocked once the loan is issued.
        test_recipe:
          setup:
            - "Grower with 2 houses, ACTIVE contract (committed 1) with upgrade_required true; renewal requested"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/growers", payload: { grower_code: "G-X2", full_name: "Cross Grower 2" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 5000 }, as: IntegratorAdmin }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H2", capacity_birds: 5000 }, as: IntegratorAdmin }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-X2", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/contracts/${c}/impose-upgrade", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/contracts/${c}/request-renewal", payload: {}, as: Grower, as_user_id: "${g}" }
          trigger:
            - { call: "POST /api/contracts/${c}/renew", payload: { new_term_end_date: "2029-01-01", new_committed_house_count: 2 }, as: IntegratorAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /api/growers/${g}", payload: {}, as: IntegratorAdmin, captures: { gv: $.data.version } }
            - { call: "POST /api/growers/${g}/loans", payload: { principal_cents: 5000000, recovery_pct: 20, purpose: CAPITAL_UPGRADE, expected_grower_version: "${gv}" }, as: IntegratorAdmin }
            - { call: "POST /api/contracts/${c}/renew", payload: { new_term_end_date: "2029-01-01", new_committed_house_count: 2 }, as: IntegratorAdmin }
          assert:
            - "first renew rejected with ERR_RENEWAL_BLOCKED (upgrade_required true, no CAPITAL_UPGRADE loan)"
            - "after CAPITAL_UPGRADE loan issued, renew succeeds: contract.status == RENEWED, committed_house_count == 2, term_end_date == 2029-01-01"

  # ------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: house_downtime_half_open_placement_boundary
        grounds:
          - "validations[priority=7]"
          - state_machines.House.PLACED_to_DOWNTIME
          - "errors[ERR_HOUSE_IN_DOWNTIME]"
        distinguishing_aspect: |
          House resource with half-open interval semantics: placement on
          exactly downtime_until + 1 day is allowed while downtime_until
          itself is blocked (scheduled_date must be > downtime_until);
          interval treatment is date-exclusion on the House resource.
        test_recipe:
          setup:
            - "House in DOWNTIME with downtime_until 2026-09-24 after catch on 2026-09-10; new flock planned on same house"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/growers", payload: { grower_code: "G-T1", full_name: "Temporal Grower" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 10000 }, as: IntegratorAdmin, captures: { h: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-T1", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-44", week_ending_date: "2026-12-05" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-T1A" }, as: IntegratorAdmin, captures: { f1: $.data.id } }
            - { call: "POST /api/flocks/${f1}/placements", payload: { scheduled_date: "2026-08-01", head_count: 5000 }, as: IntegratorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/placements/${p1}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f1}/feed-deliveries", payload: { delivered_date: "2026-08-05", feed_lbs: 10000, feed_type: STARTER, ticket_no: "FT-T1" }, as: IntegratorAdmin }
            - { call: "POST /api/catch-crews", payload: { crew_code: "CREW-T1", max_catches_per_day: 2 }, as: LivehaulScheduler, captures: { crew: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f1}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler, captures: { cs1: $.data.id } }
            - { call: "POST /api/flocks/${f1}/weight-tickets", payload: { ticket_no: "WT-T1", weighed_at: "2026-09-10T08:00:00Z", live_weight_lbs: 5000 }, as: LivehaulScheduler }
            - { call: "POST /api/catch-schedules/${cs1}/complete", payload: {}, as: LivehaulScheduler }
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-T1B" }, as: IntegratorAdmin, captures: { f2: $.data.id } }
          trigger:
            - { call: "POST /api/flocks/${f2}/placements", payload: { scheduled_date: "2026-09-24", head_count: 5000 }, as: IntegratorAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /api/flocks/${f2}/placements", payload: { scheduled_date: "2026-09-25", head_count: 5000 }, as: IntegratorAdmin }
          assert:
            - "placement with scheduled_date == downtime_until (2026-09-24) rejected with ERR_HOUSE_IN_DOWNTIME"
            - "placement with scheduled_date 2026-09-25 (downtime_until + 1) succeeds — half-open semantics"

      - name: crew_same_day_aggregate_capacity_overlap
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_CREW_OVERBOOKED]"
        distinguishing_aspect: |
          Crew resource with aggregate-capacity interval semantics (count of
          same-day bookings vs max_catches_per_day) rather than exclusion of
          a date interval — a different interval semantics than the House
          downtime rule, on a different resource entity (CatchCrew).
        test_recipe:
          setup:
            - "Crew max_catches_per_day 2; three GROWING flocks; two bookings on 2026-09-10 succeed, third on same date fails, same third flock on 2026-09-11 succeeds"
          setup_api_calls:
