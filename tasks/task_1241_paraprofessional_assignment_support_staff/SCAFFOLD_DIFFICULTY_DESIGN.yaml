# =============================================================================
# Task 1241: Paraprofessional Assignment & Support Staff Allocation
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances. All recipes replay from empty-DB using
# only endpoints declared in SCAFFOLD.yaml §1.5.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (two calculations, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: benefit_eligibility_provisional_vs_confirmed
        grounds:
          - calculations.weekly_benefit_eligibility
          - entities.Paraprofessional.fields.benefit_eligible
          - entities.Paraprofessional.fields.confirmed_benefit_eligible
          - state_machines.StaffingPlan.RECONCILING_to_CLOSED
        distinguishing_aspect: |
          Labor-hours domain (Paraprofessional): the provisional variant counts
          SCHEDULED minutes (1900 >= 1800 -> eligible during operation) while the
          confirmed variant counts only APPROVED timesheet minutes (1700 < 1800 ->
          ineligible at close), so the SAME week yields divergent flags and a
          12665-cent clawback. Entity domain differs from building_allocation
          (funding domain) per rule 1.
        test_recipe:
          setup:
            - "Plan (threshold 1800, surcharge 0.20) ACTIVE with building B1"
            - "Para P1 (wage 2000, cap 2400, no qualifications) with assignment A1: student SHARED_SUPPORT / NONE, 380 min/day Mon-Fri, 2026-05-04..2026-05-08, ACTIVE"
            - "Provisional projection at costing: 1900 >= 1800 -> surcharged rate 2400; locked daily 15200, locked weekly 76000"
            - "Five APPROVED timesheets of 340 min each (480->820) on 2026-05-04..08 = 1700 approved minutes"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "FY27 SPED", school_year: "2026-27", total_budget_cents: 100000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Lincoln Elementary", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
              captures: { b1: $.data.id }
            - call: "POST /sped-staffing/plans/${plan_id}/activate"
              as: DistrictStaffingAdmin
              captures: { plan_v: $.data.version }
            - call: "POST /sped-staffing/paraprofessionals"
              payload: { plan_id: "${plan_id}", home_building_id: "${b1}", full_name: "Pat Para", email: "p1@district.test", base_hourly_wage_cents: 2000, contracted_max_weekly_minutes: 2400, hire_date: "2025-08-15" }
              as: DistrictStaffingAdmin
              captures: { p1: $.data.id }
            - call: "POST /sped-staffing/students"
              payload: { plan_id: "${plan_id}", building_id: "${b1}", student_ref: "STU-001", iep_service_level: "SHARED_SUPPORT", iep_minutes_per_week: 1900, required_qualification: "NONE" }
              as: SpecialEdCoordinator
              captures: { s1: $.data.id }
            - call: "POST /sped-staffing/students/${s1}/activate-iep"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/assignments"
              payload: { plan_id: "${plan_id}", student_id: "${s1}", para_id: "${p1}", building_id: "${b1}", start_date: "2026-05-04", end_date: "2026-05-08", days_of_week: ["MON","TUE","WED","THU","FRI"], daily_start_minute: 480, daily_end_minute: 860, expected_plan_version: "${plan_v}" }
              as: SpecialEdCoordinator
              captures: { a1: $.data.id }
            - call: "POST /sped-staffing/assignments/${a1}/verify-qualifications"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/assignments/${a1}/activate"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/timesheets"
              payload: { assignment_id: "${a1}", work_date: "2026-05-04", start_minute: 480, end_minute: 820 }
              as: Paraprofessional
              as_user_id: "${p1}"
              captures: { t1: $.data.id }
            - call: "POST /sped-staffing/timesheets"
              payload: { assignment_id: "${a1}", work_date: "2026-05-05", start_minute: 480, end_minute: 820 }
              as: Paraprofessional
              as_user_id: "${p1}"
              captures: { t2: $.data.id }
            - call: "POST /sped-staffing/timesheets"
              payload: { assignment_id: "${a1}", work_date: "2026-05-06", start_minute: 480, end_minute: 820 }
              as: Paraprofessional
              as_user_id: "${p1}"
              captures: { t3: $.data.id }
            - call: "POST /sped-staffing/timesheets"
              payload: { assignment_id: "${a1}", work_date: "2026-05-07", start_minute: 480, end_minute: 820 }
              as: Paraprofessional
              as_user_id: "${p1}"
              captures: { t4: $.data.id }
            - call: "POST /sped-staffing/timesheets"
              payload: { assignment_id: "${a1}", work_date: "2026-05-08", start_minute: 480, end_minute: 820 }
              as: Paraprofessional
              as_user_id: "${p1}"
              captures: { t5: $.data.id }
            - call: "POST /sped-staffing/timesheets/${t1}/submit"
              as: Paraprofessional
              as_user_id: "${p1}"
            - call: "POST /sped-staffing/timesheets/${t2}/submit"
              as: Paraprofessional
              as_user_id: "${p1}"
            - call: "POST /sped-staffing/timesheets/${t3}/submit"
              as: Paraprofessional
              as_user_id: "${p1}"
            - call: "POST /sped-staffing/timesheets/${t4}/submit"
              as: Paraprofessional
              as_user_id: "${p1}"
            - call: "POST /sped-staffing/timesheets/${t5}/submit"
              as: Paraprofessional
              as_user_id: "${p1}"
            - call: "POST /sped-staffing/timesheets/${t1}/approve"
              as: BuildingAdministrator
            - call: "POST /sped-staffing/timesheets/${t2}/approve"
              as: BuildingAdministrator
            - call: "POST /sped-staffing/timesheets/${t3}/approve"
              as: BuildingAdministrator
            - call: "POST /sped-staffing/timesheets/${t4}/approve"
              as: BuildingAdministrator
            - call: "POST /sped-staffing/timesheets/${t5}/approve"
              as: BuildingAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: DistrictStaffingAdmin
          trigger:
            - call: "GET /sped-staffing/paraprofessionals/${p1}"
              as: Any
              captures: { elig_before: $.data.benefit_eligible, mins_before: $.data.weekly_scheduled_minutes }
            - call: "POST /sped-staffing/plans/${plan_id}/begin-reconciliation"
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/plans/${plan_id}/close"
              as: DistrictStaffingAdmin
            - call: "GET /sped-staffing/paraprofessionals/${p1}"
              as: Any
              captures: { elig_conf: $.data.confirmed_benefit_eligible, variance: $.data.benefit_variance_cents }
          assert:
            - "pre-close: Paraprofessional.${p1}.benefit_eligible == true (provisional: 1900 >= 1800)"
            - "pre-close: Paraprofessional.${p1}.weekly_scheduled_minutes == 1900"
            - "Assignment.${a1}.projected_weekly_cost_cents == 76000 (locked with surcharge: 5 x 15200)"
            - "post-close: Paraprofessional.${p1}.confirmed_benefit_eligible == false (confirmed: 1700 < 1800)"
            - "post-close: Paraprofessional.${p1}.benefit_variance_cents == 12665 (76000 - 63335 surcharge clawback)"
            - "post-close: StaffingPlan.${plan_id}.status == CLOSED"

      - name: building_allocation_provisional_vs_final
        grounds:
          - calculations.building_allocation
          - entities.FundingAllocation.fields.provisional_amount_cents
          - entities.FundingAllocation.fields.final_amount_cents
          - state_machines.FundingAllocation.PROVISIONAL_to_FINALIZED
        distinguishing_aspect: |
          Funding domain (FundingAllocation per Building): the provisional variant
          projects from IEP entitlements (110200 cents) while the final variant
          replays APPROVED timesheet minutes without period_weeks (107620 cents) —
          same building, same students, variance -2580. Entity domain differs from
          weekly_benefit_eligibility (labor domain) per rule 1.
        test_recipe:
          setup:
            - "Plan ACTIVE with building B1 (hardship_factor 1.0)"
            - "Student A: ONE_TO_ONE 1500 min/wk ACTIVE_IEP; Student B: SHARED_SUPPORT 900 min/wk ACTIVE_IEP"
            - "Formula PUBLISHED: base 100000, rate 5, weights 1.0/0.6/0.4, period_weeks 1"
            - "Assignments: A->para1 300/day Mon-Fri (2026-05-04..08); B->para2 180/day Mon-Fri (same week)"
            - "Approved timesheets: A 4 days x 300 = 1200; B 3 days x 180 = 540"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "FY27 SPED", school_year: "2026-27", total_budget_cents: 100000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Lincoln Elementary", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
              captures: { b1: $.data.id }
            - call: "POST /sped-staffing/plans/${plan_id}/activate"
              as: DistrictStaffingAdmin
              captures: { plan_v: $.data.version }
            - call: "POST /sped-staffing/paraprofessionals"
              payload: { plan_id: "${plan_id}", home_building_id: "${b1}", full_name: "Pat Para", email: "p1@district.test", base_hourly_wage_cents: 2000, contracted_max_weekly_minutes: 2400, hire_date: "2025-08-15" }
              as: DistrictStaffingAdmin
              captures: { p1: $.data.id }
            - call: "POST /sped-staffing/paraprofessionals"
              payload: { plan_id: "${plan_id}", home_building_id: "${b1}", full_name: "Sam Sub", email: "p2@district.test", base_hourly_wage_cents: 2000, contracted_max_weekly_minutes: 2400, hire_date: "2025-09-01" }
              as: DistrictStaffingAdmin
              captures: { p2: $.data.id }
            - call: "POST /sped-staffing/students"
              payload: { plan_id: "${plan_id}", building_id: "${b1}", student_ref: "STU-A", iep_service_level: "ONE_TO_ONE", iep_minutes_per_week: 1500, required_qualification: "NONE" }
              as: SpecialEdCoordinator
              captures: { sa: $.data.id }
            - call: "POST /sped-staffing/students/${sa}/activate-iep"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/students"
              payload: { plan_id: "${plan_id}", building_id: "${b1}", student_ref: "STU-B", iep_service_level: "SHARED_SUPPORT", iep_minutes_per_week: 900, required_qualification: "NONE" }
              as: SpecialEdCoordinator
              captures: { sb: $.data.id }
            - call: "POST /sped-staffing/students/${sb}/activate-iep"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/allocation-formulas"
              payload: { plan_id: "${plan_id}", base_grant_cents: 100000, per_minute_rate_cents: 5, weight_one_to_one: 1.0, weight_shared_support: 0.6, weight_transitional: 0.4, period_weeks: 1 }
              as: DistrictStaffingAdmin
              captures: { f1: $.data.id }
            - call: "POST /sped-staffing/allocation-formulas/${f1}/publish"
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/funding-allocations/compute"
              payload: { formula_id: "${f1}", period_label: "2026-W19" }
              as: DistrictStaffingAdmin
              captures: { alloc_id: "$.data[0].id", prov_amt: "$.data[0].provisional_amount_cents" }
            - call: "POST /sped-staffing/assignments"
              payload: { plan_id: "${plan_id}", student_id: "${sa}", para_id: "${p1}", building_id: "${b1}", start_date: "2026-05-04", end_date: "2026-05-08", days_of_week: ["MON","TUE","WED","THU","FRI"], daily_start_minute: 480, daily_end_minute: 780, expected_plan_version: "${plan_v}" }
              as: SpecialEdCoordinator
              captures: { a_a: $.data.id }
            - call: "POST /sped-staffing/assignments/${a_a}/verify-qualifications"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/assignments/${a_a}/activate"
              as: SpecialEdCoordinator
            - call: "GET /sped-staffing/plans/${plan_id}"
              as: Any
              captures: { plan_v2: $.data.version }
            - call: "POST /sped-staffing/assignments"
              payload: { plan_id: "${plan_id}", student_id: "${sb}", para_id: "${p2}", building_id: "${b1}", start_date: "2026-05-04", end_date: "2026-05-08", days_of_week: ["MON","TUE","WED","THU","FRI"], daily_start_minute: 480, daily_end_minute: 660, expected_plan_version: "${plan_v2}" }
              as: SpecialEdCoordinator
              captures: { a_b: $.data.id }
            - call: "POST /sped-staffing/assignments/${a_b}/verify-qualifications"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/assignments/${a_b}/activate"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/timesheets"
              payload: { assignment_id: "${a_a}", work_date: "2026-05-04", start_minute: 480, end_minute: 780 }
              as: Paraprofessional
              as_user_id: "${p1}"
              captures: { ta1: $.data.id }
            - call: "POST /sped-staffing/timesheets"
              payload: { assignment_id: "${a_a}", work_date: "2026-05-05", start_minute: 480, end_minute: 780 }
              as: Paraprofessional
              as_user_id: "${p1}"
              captures: { ta2: $.data.id }
            - call: "POST /sped-staffing/timesheets"
              payload: { assignment_id: "${a_a}", work_date: "2026-05-06", start_minute: 480, end_minute: 780 }
              as: Paraprofessional
              as_user_id: "${p1}"
              captures: { ta3: $.data.id }
            - call: "POST /sped-staffing/timesheets"
              payload: { assignment_id: "${a_a}", work_date: "2026-05-07", start_minute: 480, end_minute: 780 }
              as: Paraprofessional
              as_user_id: "${p1}"
              captures: { ta4: $.data.id }
            - call: "POST /sped-staffing/timesheets"
              payload: { assignment_id: "${a_b}", work_date: "2026-05-04", start_minute: 480, end_minute: 660 }
              as: Paraprofessional
              as_user_id: "${p2}"
              captures: { tb1: $.data.id }
            - call: "POST /sped-staffing/timesheets"
              payload: { assignment_id: "${a_b}", work_date: "2026-05-05", start_minute: 480, end_minute: 660 }
              as: Paraprofessional
              as_user_id: "${p2}"
              captures: { tb2: $.data.id }
            - call: "POST /sped-staffing/timesheets"
              payload: { assignment_id: "${a_b}", work_date: "2026-05-06", start_minute: 480, end_minute: 660 }
              as: Paraprofessional
              as_user_id: "${p2}"
              captures: { tb3: $.data.id }
            - call: "POST /sped-staffing/timesheets/${ta1}/submit"
              as: Paraprofessional
              as_user_id: "${p1}"
            - call: "POST /sped-staffing/timesheets/${ta2}/submit"
              as: Paraprofessional
              as_user_id: "${p1}"
            - call: "POST /sped-staffing/timesheets/${ta3}/submit"
              as: Paraprofessional
              as_user_id: "${p1}"
            - call: "POST /sped-staffing/timesheets/${ta4}/submit"
              as: Paraprofessional
              as_user_id: "${p1}"
            - call: "POST /sped-staffing/timesheets/${tb1}/submit"
              as: Paraprofessional
              as_user_id: "${p2}"
            - call: "POST /sped-staffing/timesheets/${tb2}/submit"
              as: Paraprofessional
              as_user_id: "${p2}"
            - call: "POST /sped-staffing/timesheets/${tb3}/submit"
              as: Paraprofessional
              as_user_id: "${p2}"
            - call: "POST /sped-staffing/timesheets/${ta1}/approve"
              as: BuildingAdministrator
            - call: "POST /sped-staffing/timesheets/${ta2}/approve"
              as: BuildingAdministrator
            - call: "POST /sped-staffing/timesheets/${ta3}/approve"
              as: BuildingAdministrator
            - call: "POST /sped-staffing/timesheets/${ta4}/approve"
              as: BuildingAdministrator
            - call: "POST /sped-staffing/timesheets/${tb1}/approve"
              as: BuildingAdministrator
            - call: "POST /sped-staffing/timesheets/${tb2}/approve"
              as: BuildingAdministrator
            - call: "POST /sped-staffing/timesheets/${tb3}/approve"
              as: BuildingAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: DistrictStaffingAdmin
          trigger:
            - call: "POST /sped-staffing/plans/${plan_id}/begin-reconciliation"
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/plans/${plan_id}/close"
              as: DistrictStaffingAdmin
            - call: "GET /sped-staffing/funding-allocations/${alloc_id}"
              as: Any
          assert:
            - "at compute: FundingAllocation.${alloc_id}.provisional_amount_cents == 110200 (= 100000 + (1500*1.0 + 900*0.6) * 5 * 1)"
            - "post-close: FundingAllocation.${alloc_id}.final_amount_cents == 107620 (= 100000 + (1200*1.0 + 540*0.6) * 5)"
            - "post-close: FundingAllocation.${alloc_id}.variance_cents == -2580"
            - "post-close: FundingAllocation.${alloc_id}.status == FINALIZED"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (two instances, different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: assignment_cost_benefit_circular_order
        grounds:
          - calculations.assignment_daily_cost
          - entities.Paraprofessional.fields.benefit_eligible
          - entities.Assignment.fields.daily_cost_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: the
          new assignment's OWN minutes count toward the benefit threshold that
          decides whether its rate is surcharged. Projected 1520+280 = 1800 >= 1800
          -> priced at the surcharged rate (2240/day); evaluated without self the
          same inputs would yield 1867/day. The scaffold pins the order so the
          value is well-defined.
        test_recipe:
          setup:
            - "Plan ACTIVE (threshold 1800, surcharge 0.20), building B1"
            - "Para P1 (wage 2000, cap 2400) with ACTIVE assignment A1: 304 min/day Mon-Fri = 1520 min/wk (TRANSITIONAL / NONE)"
            - "New candidate assignment A2: 56 min/day Mon-Fri = 280 min/wk, same building, window 800-856 (no overlap with A1's 480-784)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "FY27 SPED", school_year: "2026-27", total_budget_cents: 100000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Lincoln Elementary", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
              captures: { b1: $.data.id }
            - call: "POST /sped-staffing/plans/${plan_id}/activate"
              as: DistrictStaffingAdmin
              captures: { plan_v: $.data.version }
            - call: "POST /sped-staffing/paraprofessionals"
              payload: { plan_id: "${plan_id}", home_building_id: "${b1}", full_name: "Pat Para", email: "p1@district.test", base_hourly_wage_cents: 2000, contracted_max_weekly_minutes: 2400, hire_date: "2025-08-15" }
              as: DistrictStaffingAdmin
              captures: { p1: $.data.id }
            - call: "POST /sped-staffing/students"
              payload: { plan_id: "${plan_id}", building_id: "${b1}", student_ref: "STU-001", iep_service_level: "TRANSITIONAL", iep_minutes_per_week: 1520, required_qualification: "NONE" }
              as: SpecialEdCoordinator
              captures: { s1: $.data.id }
            - call: "POST /sped-staffing/students/${s1}/activate-iep"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/assignments"
              payload: { plan_id: "${plan_id}", student_id: "${s1}", para_id: "${p1}", building_id: "${b1}", start_date: "2026-05-04", end_date: "2026-06-30", days_of_week: ["MON","TUE","WED","THU","FRI"], daily_start_minute: 480, daily_end_minute: 784, expected_plan_version: "${plan_v}" }
              as: SpecialEdCoordinator
              captures: { a1: $.data.id }
            - call: "POST /sped-staffing/assignments/${a1}/verify-qualifications"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/assignments/${a1}/activate"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/students"
              payload: { plan_id: "${plan_id}", building_id: "${b1}", student_ref: "STU-002", iep_service_level: "TRANSITIONAL", iep_minutes_per_week: 280, required_qualification: "NONE" }
              as: SpecialEdCoordinator
              captures: { s2: $.data.id }
            - call: "POST /sped-staffing/students/${s2}/activate-iep"
              as: SpecialEdCoordinator
            - call: "GET /sped-staffing/plans/${plan_id}"
              as: Any
              captures: { plan_v2: $.data.version }
          trigger:
            - call: "POST /sped-staffing/assignments"
              payload: { plan_id: "${plan_id}", student_id: "${s2}", para_id: "${p1}", building_id: "${b1}", start_date: "2026-05-04", end_date: "2026-06-30", days_of_week: ["MON","TUE","WED","THU","FRI"], daily_start_minute: 800, daily_end_minute: 856, expected_plan_version: "${plan_v2}" }
              as: SpecialEdCoordinator
              captures: { a2: $.data.id, a2_daily: $.data.daily_cost_cents, a2_weekly: $.data.projected_weekly_cost_cents }
            - call: "POST /sped-staffing/assignments/${a2}/verify-qualifications"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/assignments/${a2}/activate"
              as: SpecialEdCoordinator
            - call: "GET /sped-staffing/paraprofessionals/${p1}"
              as: Any
          assert:
            - "Assignment.${a2}.daily_cost_cents == 2240 (56/60 * 2400 surcharged — eligibility projected WITH self: 1520+280 = 1800 >= 1800)"
            - "Assignment.${a2}.projected_weekly_cost_cents == 11200"
            - "Assignment.${a2}.daily_cost_cents != 1867 (the value the same inputs would produce if eligibility excluded self)"
            - "post-activate: Paraprofessional.${p1}.weekly_scheduled_minutes == 1800"
            - "post-activate: Paraprofessional.${p1}.benefit_eligible == true"

      - name: rounding_order_per_day_then_sum_vs_sum_then_round
        grounds:
          - calculations.assignment_daily_cost
          - calculations.building_allocation
        distinguishing_aspect: |
          Mode (b) nested rounding order: assignment_daily_cost pins
          round-per-day-then-sum (2233 x 5 = 11165 for a 67-min day at 2000
          cents/hr; sum-then-round would give 11167), while building_allocation
          pins sum-exact-then-round-ONCE (100670 raw x hardship 1.25 -> single
          terminal round 125838) — different rounding orders over the same
          335-minute week produce different cents.
        test_recipe:
          setup:
            - "Plan ACTIVE, building B2 hardship_factor 1.25"
            - "Student TRANSITIONAL / NONE with 335 min/wk IEP; para wage 2000"
            - "Assignment: 67 min/day Mon-Fri (480->547), 2026-05-04..2026-06-30"
            - "Formula PUBLISHED: base 100000, rate 5, weights 1.0/0.6/0.4, period_weeks 1; compute for period 2026-W19"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
