  # Rule 6 - boundary-precision checks on different metrics and endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: economic_nexus_receipts_threshold_exact_equality
        grounds:
          - calculations.nexus_determination
          - entities.StateRegistration.fields.economic_nexus_sales_threshold
          - state_machines.StateRegistration.NONE_to_ECONOMIC
          - entities.TaxpayerGroup.fields.open_registration_obligations
        distinguishing_aspect: |
          Metric 1 - a monetary receipts threshold on POST /salt/registrations/{id}/evaluate-nexus:
          499999.99 of in-state receipts leaves nexus_status NONE, and receipts of exactly 500000.00
          attach ECONOMIC nexus, proving the comparison is >= and not >.
        test_recipe:
          setup:
            - "A group with one member entity and a TX registration whose economic_nexus_sales_threshold is 500000 and employee-days threshold is 15."
            - "One 2026 activity record of 499999.99 destination sales with zero payroll, zero property and zero employee days, so the physical rung of the ladder cannot fire."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "Threshold Traders", base_state_code: "DE", everywhere_sales: 5000000, everywhere_property: 1000000, everywhere_payroll: 800000}
              as: TaxManager
              captures: {grp_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: {name: "TT Sales", incorporation_state_code: "DE", entity_type: "CORP", is_unitary_member: true}
              as: TaxManager
              captures: {le_a_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "TX", factor_formula: "SINGLE_SALES_FACTOR", tax_rate: 0.0075, throwback_rule: "NONE", service_sourcing_rule: "MARKET_BASED", economic_nexus_sales_threshold: 500000, economic_nexus_employee_days_threshold: 15}
              as: TaxManager
              captures: {reg_tx_id: $.data.id}
            - call: "POST /salt/registrations/${reg_tx_id}/activity-records"
              payload: {legal_entity_id: "${le_a_id}", tax_year: 2026, destination_sales: 499999.99, payroll_compensation: 0, property_average_value: 0, employee_days_in_state: 0, protected_solicitation_only: false}
              as: StateAnalyst
          trigger:
            - call: "POST /salt/registrations/${reg_tx_id}/evaluate-nexus"
              payload: {as_of_tax_year: 2026}
              as: TaxManager
              captures: {nx1: $.data.nexus_status}
            - call: "POST /salt/registrations/${reg_tx_id}/activity-records"
              payload: {legal_entity_id: "${le_a_id}", tax_year: 2026, destination_sales: 0.01, payroll_compensation: 0, property_average_value: 0, employee_days_in_state: 0, protected_solicitation_only: false}
              as: StateAnalyst
            - call: "POST /salt/registrations/${reg_tx_id}/evaluate-nexus"
              payload: {as_of_tax_year: 2026}
              as: TaxManager
              captures: {nx2: $.data.nexus_status}
          assert:
            - "after the first evaluate-nexus StateRegistration.${reg_tx_id}.nexus_status == NONE and registration_status == NOT_REQUIRED"
            - "after the first evaluate-nexus TaxpayerGroup.${grp_id}.open_registration_obligations == 0 and compliance_posture == COMPLIANT"
            - "after the second evaluate-nexus StateRegistration.${reg_tx_id}.nexus_status == ECONOMIC and registration_status == REGISTRATION_REQUIRED"
            - "after the second evaluate-nexus TaxpayerGroup.${grp_id}.open_registration_obligations == 1 and compliance_posture == EXPOSED"
            - "the ladder never reports PHYSICAL because no unprotected record carries payroll or property"

      - name: extension_prepayment_boundary_exact_equality
        grounds:
          - calculations.extension_required_prepayment
          - validations[priority=39]
          - errors[ERR_EXTENSION_PREPAYMENT_INSUFFICIENT]
          - entities.ExtensionRequest.fields.required_prepayment
          - state_machines.ExtensionRequest.REQUESTED_to_GRANTED
        distinguishing_aspect: |
          Metric 2 - a derived percentage-of-liability floor reached through a different endpoint,
          POST /salt/filings/{id}/extensions: 79570.75 is rejected and exactly 79570.76 (90 percent
          of tax_before_credits 88411.96) is accepted, proving the comparison is >= and not >.
        test_recipe:
          setup:
            - "CA 2026 return in FACTORS_LOCKED with tax_before_credits 88411.96, so required_prepayment is 79570.76."
            - "Logical clock at 2026-08-01T00:00:00Z, inside the 2027-04-15 extension window."
            - "No ExtensionRequest exists yet for the return."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "Meridian Industries", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 4000000, everywhere_payroll: 2000000}
              as: TaxManager
              captures: {grp_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: {name: "Meridian Manufacturing", incorporation_state_code: "DE", entity_type: "CORP", is_unitary_member: true}
              as: TaxManager
              captures: {le_a_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: {name: "Meridian Services", incorporation_state_code: "NV", entity_type: "CORP", is_unitary_member: true}
              as: TaxManager
              captures: {le_b_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "CA", factor_formula: "DOUBLE_WEIGHTED_SALES", tax_rate: 0.0884, throwback_rule: "THROWBACK", service_sourcing_rule: "MARKET_BASED", due_month: 4, due_day: 15, extension_months: 6}
              as: TaxManager
              captures: {reg_ca_id: $.data.id}
            - call: "POST /salt/registrations/${reg_ca_id}/activity-records"
              payload: {legal_entity_id: "${le_a_id}", tax_year: 2026, destination_sales: 1200000, origin_sales: 300000, purchaser_taxable_in_state: false, property_average_value: 800000, rented_property_annual_rent: 25000, payroll_compensation: 500000, employee_days_in_state: 40, protected_solicitation_only: false}
              as: StateAnalyst
            - call: "POST /salt/registrations/${reg_ca_id}/activity-records"
              payload: {legal_entity_id: "${le_b_id}", tax_year: 2026, destination_sales: 400000, service_receipts: 250000, cost_of_performance_state_code: "NV", payroll_compensation: 100000, employee_days_in_state: 5, protected_solicitation_only: true}
              as: StateAnalyst
            - call: "POST /salt/registrations/${reg_ca_id}/evaluate-nexus"
              payload: {as_of_tax_year: 2026}
              as: TaxManager
            - call: "POST /salt/registrations/${reg_ca_id}/complete-registration"
              payload: {state_account_number: "CA-99887766"}
              as: TaxManager
            - call: "POST /salt/registrations/${reg_ca_id}/filings"
              payload: {tax_year: 2026, filing_basis: "COMBINED_UNITARY", federal_taxable_income: 5000000}
              as: StateAnalyst
              captures: {f_id: $.data.id}
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: {modification_code: "STATE_TAX_ADDBACK", direction: "ADDITION", raw_amount: 125042.00, allocation_ratio: 0.008}
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: {modification_code: "MUNI_INTEREST_SUB", direction: "SUBTRACTION", raw_amount: 92379.00, allocation_ratio: 0.008}
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: {modification_code: "DEPREC_ADJ", direction: "ADDITION", raw_amount: 51907.00, allocation_ratio: 0.008}
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/compute-factors"
              payload: {apportionment_variant: "JOYCE"}
              as: StateAnalyst
              captures: {f_v1: $.data.version}
            - call: "POST /salt/filings/${f_id}/credit-claims"
              payload: {credit_code: "RD_CREDIT", granted_amount: 30000.00, priority_order: 1, refundable: false, expires_after_years: 5, expected_filing_version: "${f_v1}"}
              as: StateAnalyst
              captures: {cc1_id: $.data.id}
            - call: "GET /salt/filings/${f_id}"
              payload: {}
              as: StateAnalyst
              captures: {f_v2: $.data.version}
            - call: "POST /salt/filings/${f_id}/credit-claims"
              payload: {credit_code: "JOBS_CREDIT", granted_amount: 40000.00, priority_order: 2, refundable: false, expires_after_years: 3, expected_filing_version: "${f_v2}"}
              as: StateAnalyst
              captures: {cc2_id: $.data.id}
            - call: "POST /salt/filings/${f_id}/lock-factors"
              payload: {}
              as: StateAnalyst
          trigger:
            - call: "POST /salt/filings/${f_id}/extensions"
              payload: {estimated_tax_paid: 79570.75}
              as: StateAnalyst
              captures: {err_id: $.data.error_id}
            - call: "POST /salt/filings/${f_id}/extensions"
              payload: {estimated_tax_paid: 79570.76}
              as: StateAnalyst
              captures: {ext_id: $.data.id, req_prepay: $.data.required_prepayment}
            - call: "POST /salt/extensions/${ext_id}/acknowledge"
              payload: {decision: "GRANTED", state_confirmation: "CA-EXT-2026-11"}
              as: TaxManager
          assert:
            - "the first trigger returns HTTP 422 with data.error_id == ERR_EXTENSION_PREPAYMENT_INSUFFICIENT"
            - "the second trigger returns HTTP 201 and ExtensionRequest.${ext_id}.required_prepayment == 79570.76"
            - "ExtensionRequest.${ext_id}.status == GRANTED and new_due_date == 2027-10-15T00:00:00Z after acknowledge"
            - "StateFiling.${f_id}.extended_due_date == 2027-10-15T00:00:00Z after acknowledge"
            - "GET /salt/filings/${f_id}/extensions returns exactly one row"

  # =====================================================================
  # Rule 7 - cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: lock_factors_gated_by_registration_status
        grounds:
          - state_machines.StateFiling.DRAFT_to_FACTORS_LOCKED
          - validations[priority=17]
          - errors[ERR_REGISTRATION_NOT_COMPLETE]
          - entities.StateRegistration.fields.registration_status
          - state_machines.StateRegistration.REGISTRATION_REQUIRED_to_REGISTERED
        distinguishing_aspect: |
          Entity pair StateFiling -> StateRegistration: the DRAFT -> FACTORS_LOCKED transition on the
          filing is legal only while the OTHER entity, its StateRegistration, sits in registration_status
          REGISTERED; at REGISTRATION_REQUIRED the identical request fails with ERR_REGISTRATION_NOT_COMPLETE
          and succeeds unchanged once complete-registration has run.
        test_recipe:
          setup:
            - "CA registration with nexus_status PHYSICAL but registration_status REGISTRATION_REQUIRED (complete-registration has not been called)."
            - "CA 2026 return in DRAFT with factors already computed under JOYCE and apportionment_percentage 0.200000."
            - "Group compliance_posture EXPOSED with open_registration_obligations 1."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "Meridian Industries", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 4000000, everywhere_payroll: 2000000}
              as: TaxManager
              captures: {grp_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: {name: "Meridian Manufacturing", incorporation_state_code: "DE", entity_type: "CORP", is_unitary_member: true}
              as: TaxManager
              captures: {le_a_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: {name: "Meridian Services", incorporation_state_code: "NV", entity_type: "CORP", is_unitary_member: true}
              as: TaxManager
              captures: {le_b_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "CA", factor_formula: "DOUBLE_WEIGHTED_SALES", tax_rate: 0.0884, throwback_rule: "THROWBACK", service_sourcing_rule: "MARKET_BASED", due_month: 4, due_day: 15, extension_months: 6}
              as: TaxManager
              captures: {reg_ca_id: $.data.id}
            - call: "POST /salt/registrations/${reg_ca_id}/activity-records"
              payload: {legal_entity_id: "${le_a_id}", tax_year: 2026, destination_sales: 1200000, origin_sales: 300000, purchaser_taxable_in_state: false, property_average_value: 800000, rented_property_annual_rent: 25000, payroll_compensation: 500000, employee_days_in_state: 40, protected_solicitation_only: false}
              as: StateAnalyst
            - call: "POST /salt/registrations/${reg_ca_id}/activity-records"
              payload: {legal_entity_id: "${le_b_id}", tax_year: 2026, destination_sales: 400000, service_receipts: 250000, cost_of_performance_state_code: "NV", payroll_compensation: 100000, employee_days_in_state: 5, protected_solicitation_only: true}
              as: StateAnalyst
            - call: "POST /salt/registrations/${reg_ca_id}/evaluate-nexus"
              payload: {as_of_tax_year: 2026}
              as: TaxManager
            - call: "POST /salt/registrations/${reg_ca_id}/filings"
              payload: {tax_year: 2026, filing_basis: "COMBINED_UNITARY", federal_taxable_income: 5000000}
              as: StateAnalyst
              captures: {f_id: $.data.id}
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: {modification_code: "STATE_TAX_ADDBACK", direction: "ADDITION", raw_amount: 125042.00, allocation_ratio: 0.008}
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: {modification_code: "MUNI_INTEREST_SUB", direction: "SUBTRACTION", raw_amount: 92379.00, allocation_ratio: 0.008}
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: {modification_code: "DEPREC_ADJ", direction: "ADDITION", raw_amount: 51907.00, allocation_ratio: 0.008}
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/compute-factors"
              payload: {apportionment_variant: "JOYCE"}
              as: StateAnalyst
              captures: {f_v1: $.data.version}
          trigger:
            - call: "POST /salt/filings/${f_id}/lock-factors"
              payload: {}
              as: StateAnalyst
              captures: {err_id: $.data.error_id}
            - call: "POST /salt/registrations/${reg_ca_id}/complete-registration"
              payload: {state_account_number: "CA-55443322"}
              as: TaxManager
            - call: "POST /salt/filings/${f_id}/lock-factors"
              payload: {}
              as: StateAnalyst
              captures: {prep2: $.data.preparation_status}
          assert:
            - "the first trigger returns HTTP 422 with data.error_id == ERR_REGISTRATION_NOT_COMPLETE"
            - "after the first trigger StateFiling.${f_id}.preparation_status is still DRAFT"
            - "after complete-registration StateRegistration.${reg_ca_id}.registration_status == REGISTERED and TaxpayerGroup.${grp_id}.open_registration_obligations == 0"
            - "the third trigger returns HTTP 200 and StateFiling.${f_id}.preparation_status == FACTORS_LOCKED"
            - "StateFiling.${f_id}.apportionment_percentage == 0.200000 is unchanged by either attempt"

      - name: file_gated_by_governing_election_status
        grounds:
          - state_machines.StateFiling.APPROVED_to_FILED
          - validations[priority=23]
          - errors[ERR_ELECTION_BASIS_MISMATCH]
          - state_machines.FilingElection.ELECTED_to_REVOKED
          - state_machines.FilingElection.REVOKED_to_ELECTED
          - entities.StateFiling.fields.election_id
        distinguishing_aspect: |
          A different entity pair, StateFiling -> FilingElection: the APPROVED -> FILED transition
          depends on the linked election still being ELECTED, so revoking the election blocks filing
          with ERR_ELECTION_BASIS_MISMATCH and reinstating it unblocks the identical request.
        test_recipe:
          setup:
            - "CA registration created with state_permits_early_revocation true."
            - "A COMBINED_UNITARY election covering 2024 through 2028 is linked to the CA 2026 return, whose filing_basis is also COMBINED_UNITARY."
            - "The return is APPROVED; logical clock at 2026-08-01T00:00:00Z, well before the 2027-04-15 due date."
            - "The election has been revoked effective tax year 2026, contracting its occupied interval to 2024 through 2025."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "Meridian Industries", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 4000000, everywhere_payroll: 2000000}
              as: TaxManager
              captures: {grp_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: {name: "Meridian Manufacturing", incorporation_state_code: "DE", entity_type: "CORP", is_unitary_member: true}
              as: TaxManager
              captures: {le_a_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: {name: "Meridian Services", incorporation_state_code: "NV", entity_type: "CORP", is_unitary_member: true}
              as: TaxManager
              captures: {le_b_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "CA", factor_formula: "DOUBLE_WEIGHTED_SALES", tax_rate: 0.0884, throwback_rule: "THROWBACK", service_sourcing_rule: "MARKET_BASED", due_month: 4, due_day: 15, extension_months: 6, state_permits_early_revocation: true}
              as: TaxManager
              captures: {reg_ca_id: $.data.id}
            - call: "POST /salt/registrations/${reg_ca_id}/activity-records"
              payload: {legal_entity_id: "${le_a_id}", tax_year: 2026, destination_sales: 1200000, origin_sales: 300000, purchaser_taxable_in_state: false, property_average_value: 800000, rented_property_annual_rent: 25000, payroll_compensation: 500000, employee_days_in_state: 40, protected_solicitation_only: false}
              as: StateAnalyst
            - call: "POST /salt/registrations/${reg_ca_id}/activity-records"
              payload: {legal_entity_id: "${le_b_id}", tax_year: 2026, destination_sales: 400000, service_receipts: 250000, cost_of_performance_state_code: "NV", payroll_compensation: 100000, employee_days_in_state: 5, protected_solicitation_only: true}
              as: StateAnalyst
            - call: "POST /salt/registrations/${reg_ca_id}/evaluate-nexus"
              payload: {as_of_tax_year: 2026}
              as: TaxManager
            - call: "POST /salt/registrations/${reg_ca_id}/complete-registration"
              payload: {state_account_number: "CA-99887766"}
              as: TaxManager
            - call: "POST /salt/registrations/${reg_ca_id}/elections"
              payload: {election_basis: "COMBINED_UNITARY", effective_tax_year: 2024, binding_years: 5}
              as: TaxManager
              captures: {el_id: $.data.id}
            - call: "POST /salt/registrations/${reg_ca_id}/filings"
              payload: {tax_year: 2026, filing_basis: "COMBINED_UNITARY", federal_taxable_income: 5000000, election_id: "${el_id}"}
              as: StateAnalyst
              captures: {f_id: $.data.id}
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: {modification_code: "STATE_TAX_ADDBACK", direction: "ADDITION", raw_amount: 125042.00, allocation_ratio: 0.008}
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: {modification_code: "MUNI_INTEREST_SUB", direction: "SUBTRACTION", raw_amount: 92379.00, allocation_ratio: 0.008}
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: {modification_code: "DEPREC_ADJ", direction: "ADDITION", raw_amount: 51907.00, allocation_ratio: 0.008}
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/compute-factors"
              payload: {apportionment_variant: "JOYCE"}
              as: StateAnalyst
              captures: {f_v1: $.data.version}
            - call: "POST /salt/filings/${f_id}/credit-claims"
              payload: {credit_code: "RD_CREDIT", granted_amount: 30000.00, priority_order: 1, refundable: false, expires_after_years: 5, expected_filing_version: "${f_v1}"}
              as: StateAnalyst
              captures: {cc1_id: $.data.id}
            - call: "GET /salt/filings/${f_id}"
              payload: {}
              as: StateAnalyst
              captures: {f_v2: $.data.version}
            - call: "POST /salt/filings/${f_id}/credit-claims"
              payload: {credit_code: "JOBS_CREDIT", granted_amount: 40000.00, priority_order: 2, refundable: false, expires_after_years: 3, expected_filing_version: "${f_v2}"}
              as: StateAnalyst
              captures: {cc2_id: $.data.id}
            - call: "POST /salt/filings/${f_id}/lock-factors"
              payload: {}
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/submit-review"
              payload: {preparer_note: "prepared"}
              as: StateAnalyst
              as_user_id: "analyst-01"
            - call: "POST /salt/filings/${f_id}/approve"
              payload: {approval_note: "reviewed"}
              as: Controller
              as_user_id: "controller-01"
            - call: "POST /salt/elections/${el_id}/revoke"
              payload: {revocation_tax_year: 2026, reason: "State combined regime replaced"}
              as: TaxManager
          trigger:
            - call: "POST /salt/filings/${f_id}/file"
              payload: {confirmation_number: "CA-EFILE-2026-0021"}
              as: Controller
              as_user_id: "controller-01"
              captures: {err_id: $.data.error_id}
            - call: "POST /salt/elections/${el_id}/reinstate"
              payload: {effective_tax_year: 2026, binding_years: 3}
              as: TaxManager
              captures: {el_status: $.data.status}
            - call: "POST /salt/filings/${f_id}/file"
              payload: {confirmation_number: "CA-EFILE-2026-0021"}
              as: Controller
              as_user_id: "controller-01"
              captures: {prep_final: $.data.preparation_status}
          assert:
            - "after revoke FilingElection.${el_id}.status == REVOKED and revocation_tax_year == 2026"
            - "the first trigger returns HTTP 422 with data.error_id == ERR_ELECTION_BASIS_MISMATCH"
            - "after the first trigger StateFiling.${f_id}.preparation_status is still APPROVED and filed_on_date == null"
            - "after reinstate FilingElection.${el_id}.status == ELECTED, effective_tax_year == 2026, expires_after_tax_year == 2028, reinstatement_count == 1, revocation_tax_year == null"
            - "the third trigger returns HTTP 200 and StateFiling.${f_id}.preparation_status == FILED with confirmation_number CA-EFILE-2026-0021"

  # =====================================================================
  # Rule 8 - temporal-overlap conflicts with different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: election_binding_years_closed_interval_overlap
        grounds:
          - validations[priority=31]
          - errors[ERR_ELECTION_PERIOD_OVERLAP]
          - entities.FilingElection.fields.expires_after_tax_year
          - entities.StateRegistration.fields.state_code
        distinguishing_aspect: |
          Interval semantics 1, on the StateRegistration resource: CLOSED integer-year intervals with
          NO buffer, where sharing a single year collides but touching does not - [2024,2026] rejects
          [2026,2028] and accepts [2027,2029].
        test_recipe:
          setup:
            - "A group with one CA registration and no elections yet, then one election [2024, 2026] on file."
            - "state_permits_early_revocation is false, so no revocation can contract the occupied interval."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "Interval Industries", base_state_code: "DE", everywhere_sales: 6000000, everywhere_property: 1000000, everywhere_payroll: 900000}
              as: TaxManager
              captures: {grp_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "CA", factor_formula: "DOUBLE_WEIGHTED_SALES", tax_rate: 0.0884, throwback_rule: "THROWBACK", service_sourcing_rule: "MARKET_BASED"}
              as: TaxManager
              captures: {reg_ca_id: $.data.id}
            - call: "POST /salt/registrations/${reg_ca_id}/elections"
              payload: {election_basis: "COMBINED_UNITARY", effective_tax_year: 2024, binding_years: 3}
              as: TaxManager
              captures: {el1_id: $.data.id, el1_end: $.data.expires_after_tax_year}
          trigger:
            - call: "POST /salt/registrations/${reg_ca_id}/elections"
              payload: {election_basis: "SEPARATE_ENTITY", effective_tax_year: 2026, binding_years: 3}
              as: TaxManager
              captures: {err_id: $.data.error_id}
            - call: "POST /salt/registrations/${reg_ca_id}/elections"
              payload: {election_basis: "SEPARATE_ENTITY", effective_tax_year: 2027, binding_years: 3}
              as: TaxManager
              captures: {el3_id: $.data.id}
          assert:
            - "FilingElection.${el1_id}.expires_after_tax_year == 2026"
            - "the first trigger returns HTTP 409 with data.error_id == ERR_ELECTION_PERIOD_OVERLAP because both intervals contain 2026"
            - "the second trigger returns HTTP 201 - [2027, 2029] is adjacent to [2024, 2026] and adjacency is not overlap"
            - "FilingElection.${el3_id}.effective_tax_year == 2027 and expires_after_tax_year == 2029 and status == ELECTED"
            - "GET /salt/registrations/${reg_ca_id}/elections returns exactly two rows"

      - name: vda_lookback_window_half_open_with_cooling_buffer
        grounds:
          - validations[priority=32]
          - errors[ERR_VDA_WINDOW_OVERLAP]
          - entities.VDAAgreement.fields.lookback_start_year
          - entities.VDAAgreement.fields.lookback_end_year
          - calculations.vda_exposure
          - entities.LegalEntity.fields.vda_shield_until
        distinguishing_aspect: |
          Interval semantics 2, on a different resource entity - the LegalEntity, not the registration:
          HALF-OPEN datetime windows widened by a symmetric 24-month cooling buffer, so windows that
          do not touch at all ([2019-01-01,2022-01-01) versus [2023-01-01,2026-01-01)) still collide,
          while a window 24+ months clear of the neighbour is accepted.
        test_recipe:
          setup:
            - "A group with one member entity, Meridian Services, and two registrations, CA and NY."
            - "One DRAFT LOOKBACK_LIMITED disclosure for that member on the CA registration anchored at tax year 2021 with a 3-year lookback, covering 2019 through 2021."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "Disclosure Group", base_state_code: "DE", everywhere_sales: 9000000, everywhere_property: 2000000, everywhere_payroll: 1200000}
              as: TaxManager
              captures: {grp_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: {name: "Meridian Services", incorporation_state_code: "NV", entity_type: "CORP", is_unitary_member: true}
              as: TaxManager
              captures: {le_b_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "CA", factor_formula: "SINGLE_SALES_FACTOR", tax_rate: 0.0884, throwback_rule: "NONE", service_sourcing_rule: "MARKET_BASED"}
              as: TaxManager
              captures: {reg_ca_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "NY", factor_formula: "SINGLE_SALES_FACTOR", tax_rate: 0.065, throwback_rule: "NONE", service_sourcing_rule: "MARKET_BASED"}
              as: TaxManager
              captures: {reg_ny_id: $.data.id}
            - call: "POST /salt/registrations/${reg_ca_id}/vda-agreements"
              payload: {legal_entity_id: "${le_b_id}", anchor_tax_year: 2021, lookback_years: 3, exposure_variant: "LOOKBACK_LIMITED", estimated_exposure_tax: 210000.00}
              as: TaxManager
              captures: {v1_id: $.data.id}
          trigger:
            - call: "POST /salt/registrations/${reg_ny_id}/vda-agreements"
              payload: {legal_entity_id: "${le_b_id}", anchor_tax_year: 2025, lookback_years: 3, exposure_variant: "LOOKBACK_LIMITED", estimated_exposure_tax: 210000.00}
              as: TaxManager
              captures: {err_id: $.data.error_id}
            - call: "POST /salt/registrations/${reg_ny_id}/vda-agreements"
              payload: {legal_entity_id: "${le_b_id}", anchor_tax_year: 2027, lookback_years: 1, exposure_variant: "LOOKBACK_LIMITED", estimated_exposure_tax: 210000.00}
              as: TaxManager
              captures: {v3_id: $.data.id}
          assert:
            - "VDAAgreement.${v1_id}.lookback_start_year == 2019 and lookback_end_year == 2021"
            - "VDAAgreement.${v1_id}.computed_exposure_tax == 90000.00 and waived_penalty_amount == 22500.00"
            - "the first trigger returns HTTP 409 with data.error_id == ERR_VDA_WINDOW_OVERLAP - the raw windows [2019-01-01,2022-01-01) and [2023-01-01,2026-01-01) do not touch, but the 24-month buffer pulls the proposed window back to 2021-01-01"
            - "the second trigger returns HTTP 201 - buffered [2025-01-01,2030-01-01) is clear of [2019-01-01,2022-01-01)"
            - "VDAAgreement.${v3_id}.lookback_start_year == 2027 and lookback_end_year == 2027 and status == DRAFT"
            - "GET /salt/vda-agreements with legal_entity_id filter returns exactly two rows"

  # =====================================================================
  # Rule 9 - compensating-action invariants over different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:

      - name: credit_pool_dollars_conserved_across_amend
        grounds:
          - calculations.credit_application_waterfall
          - state_machines.StateFiling.FILED_to_AMENDED
          - state_machines.CreditClaim.PARTIALLY_APPLIED_to_PENDING
          - entities.CreditClaim.fields.carryforward_amount
          - entities.CreditClaim.fields.expired_amount
        distinguishing_aspect: |
          Conserved quantity 1 - CREDIT-POOL DOLLARS, pinned as
          sum over claims of (applied_amount + carryforward_amount + expired_amount) == sum of granted_amount
          == 100000.00. The forward action is the waterfall run at credit-claim time; amend is its
          compensating action, and the pool reads 100000.00 both before and after with zero drift.
        test_recipe:
          setup:
            - "CA 2026 return FILED with tax_before_credits 88411.96."
            - "Two non-refundable claims: RD_CREDIT 30000.00 at priority 1 (fully applied) and JOBS_CREDIT 70000.00 at priority 2 (58411.96 applied, 11588.04 carried forward)."
            - "credits_applied_total 88411.96, balance_due 0.00, payment_status PAID."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "Meridian Industries", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 4000000, everywhere_payroll: 2000000}
              as: TaxManager
              captures: {grp_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: {name: "Meridian Manufacturing", incorporation_state_code: "DE", entity_type: "CORP", is_unitary_member: true}
              as: TaxManager
              captures: {le_a_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: {name: "Meridian Services", incorporation_state_code: "NV", entity_type: "CORP", is_unitary_member: true}
              as: TaxManager
              captures: {le_b_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "CA", factor_formula: "DOUBLE_WEIGHTED_SALES", tax_rate: 0.0884, throwback_rule: "THROWBACK", service_sourcing_rule: "MARKET_BASED", due_month: 4, due_day: 15, extension_months: 6}
              as: TaxManager
              captures: {reg_ca_id: $.data.id}
            - call: "POST /salt/registrations/${reg_ca_id}/activity-records"
              payload: {legal_entity_id: "${le_a_id}", tax_year: 2026, destination_sales: 1200000, origin_sales: 300000, purchaser_taxable_in_state: false, property_average_value: 800000, rented_property_annual_rent: 25000, payroll_compensation: 500000, employee_days_in_state: 40, protected_solicitation_only: false}
              as: StateAnalyst
            - call: "POST /salt/registrations/${reg_ca_id}/activity-records"
              payload: {legal_entity_id: "${le_b_id}", tax_year: 2026, destination_sales: 400000, service_receipts: 250000, cost_of_performance_state_code: "NV", payroll_compensation: 100000, employee_days_in_state: 5, protected_solicitation_only: true}
              as: StateAnalyst
            - call: "POST /salt/registrations/${reg_ca_id}/evaluate-nexus"
              payload: {as_of_tax_year: 2026}
              as: TaxManager
            - call: "POST /salt/registrations/${reg_ca_id}/complete-registration"
              payload: {state_account_number: "CA-99887766"}
              as: TaxManager
            - call: "POST /salt/registrations/${reg_ca_id}/filings"
              payload: {tax_year: 2026, filing_basis: "COMBINED_UNITARY", federal_taxable_income: 5000000}
              as: StateAnalyst
              captures: {f_id: $.data.id}
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: {modification_code: "STATE_TAX_ADDBACK", direction: "ADDITION", raw_amount: 125042.00, allocation_ratio: 0.008}
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: {modification_code: "MUNI_INTEREST_SUB", direction: "SUBTRACTION", raw_amount: 92379.00, allocation_ratio: 0.008}
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: {modification_code: "DEPREC_ADJ", direction: "ADDITION", raw_amount: 51907.00, allocation_ratio: 0.008}
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/compute-factors"
              payload: {apportionment_variant: "JOYCE"}
              as: StateAnalyst
              captures: {f_v1: $.data.version}
            - call: "POST /salt/filings/${f_id}/credit-claims"
              payload: {credit_code: "RD_CREDIT", granted_amount: 30000.00, priority_order: 1, refundable: false, expires_after_years: 5, expected_filing_version: "${f_v1}"}
              as: StateAnalyst
              captures: {cc1_id: $.data.id}
            - call: "GET /salt/filings/${f_id}"
              payload: {}
              as: StateAnalyst
              captures: {f_v2: $.data.version}
            - call: "POST /salt/filings/${f_id}/credit-claims"
              payload: {credit_code: "JOBS_CREDIT", granted_amount: 70000.00, priority_order: 2, refundable: false, expires_after_years: 3, expected_filing_version: "${f_v2}"}
              as: StateAnalyst
              captures: {cc2_id: $.data.id}
            - call: "POST /salt/filings/${f_id}/lock-factors"
              payload: {}
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/submit-review"
              payload: {preparer_note: "prepared"}
              as: StateAnalyst
              as_user_id: "analyst-01"
            - call: "POST /salt/filings/${f_id}/approve"
              payload: {approval_note: "reviewed"}
              as: Controller
              as_user_id: "controller-01"
            - call: "POST /salt/filings/${f_id}/file"
              payload: {confirmation_number: "CA-EFILE-2026-0001"}
              as: Controller
              as_user_id: "controller-01"
          trigger:
            - call: "POST /salt/filings/${f_id}/amend"
              payload: {reason: "Sourcing correction on service receipts"}
              as: Controller
              as_user_id: "controller-01"
              captures: {prep: $.data.preparation_status}
          assert:
            - "before the trigger CreditClaim.${cc1_id}.applied_amount == 30000.00, carryforward_amount == 0.00, expired_amount == 0.00, status == FULLY_APPLIED"
            - "before the trigger CreditClaim.${cc2_id}.applied_amount == 58411.96, carryforward_amount == 11588.04, expired_amount == 0.00, status == PARTIALLY_APPLIED"
            - "before the trigger the conserved pool 30000.00 + 0.00 + 0.00 + 58411.96 + 11588.04 + 0.00 == 100000.00"
            - "after the trigger CreditClaim.${cc1_id}.applied_amount == 0.00 and carryforward_amount == 30000.00 and status == PENDING"
            - "after the trigger CreditClaim.${cc2_id}.applied_amount == 0.00 and carryforward_amount == 70000.00 and status == PENDING"
            - "after the trigger the conserved pool 0.00 + 30000.00 + 0.00 + 0.00 + 70000.00 + 0.00 == 100000.00 - identical to the pre-trigger reading"
            - "after the trigger StateFiling.${f_id}.credits_applied_total == 0.00, balance_due == 88411.96, payment_status == UNPAID, preparation_status == AMENDED, amendment_count == 1"

      - name: registration_obligation_count_conserved_across_completion
        grounds:
          - calculations.group_compliance_posture
          - entities.TaxpayerGroup.fields.open_registration_obligations
          - state_machines.StateRegistration.NOT_REQUIRED_to_REGISTRATION_REQUIRED
          - state_machines.StateRegistration.REGISTRATION_REQUIRED_to_REGISTERED
        distinguishing_aspect: |
          Conserved quantity 2 of a different TYPE - an INTEGER OBLIGATION COUNT, not money, pinned as
          TaxpayerGroup.open_registration_obligations == COUNT(StateRegistration rows of the group whose
          registration_status == REGISTRATION_REQUIRED). evaluate-nexus is the forward action and
          complete-registration its compensating action; the equality holds at all five observations and
          the counter returns to its starting value of 0.
        test_recipe:
          setup:
            - "A group with one member entity and two registrations, CA and NY, both starting at nexus NONE and registration_status NOT_REQUIRED."
            - "Each registration has one 2026 activity record with in-state destination sales above the 500000 economic threshold and no payroll, property or employee days."
            - "TaxpayerGroup.open_registration_obligations starts at 0 and compliance_posture starts at COMPLIANT."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "Obligation Count Co", base_state_code: "DE", everywhere_sales: 7000000, everywhere_property: 1500000, everywhere_payroll: 1000000}
              as: TaxManager
              captures: {grp_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: {name: "OCC Sales", incorporation_state_code: "DE", entity_type: "CORP", is_unitary_member: true}
              as: TaxManager
              captures: {le_a_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "CA", factor_formula: "SINGLE_SALES_FACTOR", tax_rate: 0.0884, throwback_rule: "NONE", service_sourcing_rule: "MARKET_BASED"}
              as: TaxManager
              captures: {reg_ca_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "NY", factor_formula: "SINGLE_SALES_FACTOR", tax_rate: 0.065, throwback_rule: "NONE", service_sourcing_rule: "MARKET_BASED"}
              as: TaxManager
              captures: {reg_ny_id: $.data.id}
            - call: "POST /salt/registrations/${reg_ca_id}/activity-records"
              payload: {legal_entity_id: "${le_a_id}", tax_year: 2026, destination_sales: 900000, payroll_compensation: 0, property_average_value: 0, employee_days_in_state: 0, protected_solicitation_only: false}
              as: StateAnalyst
            - call: "POST /salt/registrations/${reg_ny_id}/activity-records"
              payload: {legal_entity_id: "${le_a_id}", tax_year: 2026, destination_sales: 700000, payroll_compensation: 0, property_average_value: 0, employee_days_in_state: 0, protected_solicitation_only: false}
              as: StateAnalyst
          trigger:
            - call: "POST /salt/registrations/${reg_ca_id}/evaluate-nexus"
              payload: {as_of_tax_year: 2026}
              as: TaxManager
            - call: "POST /salt/registrations/${reg_ny_id}/evaluate-nexus"
              payload: {as_of_tax_year: 2026}
              as: TaxManager
            - call: "POST /salt/registrations/${reg_ca_id}/complete-registration"
              payload: {state_account_number: "CA-11112222"}
              as: TaxManager
            - call: "POST /salt/registrations/${reg_ny_id}/complete-registration"
              payload: {state_account_number: "NY-33334444"}
              as: TaxManager
          assert:
            - "before the trigger TaxpayerGroup.${grp_id}.open_registration_obligations == 0 and compliance_posture == COMPLIANT"
            - "after trigger call 1 TaxpayerGroup.${grp_id}.open_registration_obligations == 1 and compliance_posture == EXPOSED"
            - "after trigger call 2 TaxpayerGroup.${grp_id}.open_registration_obligations == 2 and compliance_posture == EXPOSED"
            - "after trigger call 3 TaxpayerGroup.${grp_id}.open_registration_obligations == 1 and compliance_posture == EXPOSED"
            - "after trigger call 4 TaxpayerGroup.${grp_id}.open_registration_obligations == 0 and compliance_posture == COMPLIANT"
            - "at every one of those five observations the counter equals the number of rows returned by GET /salt/groups/${grp_id}/registrations whose registration_status == REGISTRATION_REQUIRED"
            - "StateRegistration.${reg_ca_id}.registration_status == REGISTERED and StateRegistration.${reg_ny_id}.registration_status == REGISTERED at the end"
