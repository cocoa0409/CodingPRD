    applies_to: "/witness-parties/{id}, POST /factory-acceptance-tests/{id}/witness-assignments"
  - priority: 18
    category: existence
    check: "the WitnessAssignment named by {id} exists"
    error_id: ERR_WITNESS_ASSIGNMENT_NOT_FOUND
    http_status: 404
    applies_to: "all /witness-assignments/{id}/** paths"
  - priority: 19
    category: existence
    check: "the TestReport named by {id} or by test_report_id exists"
    error_id: ERR_TEST_REPORT_NOT_FOUND
    http_status: 404
    applies_to: "all /test-reports/{id}/** paths, POST /engineered-orders/{id}/compliance-labels"
  - priority: 20
    category: existence
    check: "the ComplianceLabel named by {id} exists"
    error_id: ERR_LABEL_NOT_FOUND
    http_status: 404
    applies_to: "all /compliance-labels/{id}/** paths"
  - priority: 21
