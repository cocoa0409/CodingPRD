            - "the ${a3_id} confirm returned 409 with ${err_id} == ERR_ALLOCATION_CAPACITY_EXCEEDED"
            - "Assignment.${a3_id}.status == PROPOSED and confirmed_on is null"
            - "Consultant.${c1_id}.allocated_pct == 100.00 after the rejection — the failed confirm changed nothing"
            - "DemandOpportunity.${d1_id}.covered_internal_fte == 1.00, open_fte == 2.00, staffing_status == PARTIALLY_COVERED"
            - "Consultant.${c1_id}.availability_status == ASSIGNED"

      - name: utilization_period_adjacent_start_day_is_an_overlap
        grounds:
          - validations[priority=27]
          - errors[ERR_PERIOD_OVERLAP]
          - calculations.utilization_period_metrics
          - entities.UtilizationPeriod.fields.period_start_on
          - entities.UtilizationPeriod.fields.period_end_on
          - endpoints[POST /consultants/{id}/utilization-periods]
        distinguishing_aspect: |
          Boundary on the PERIOD-RANGE ADJACENCY metric at POST
          /consultants/{id}/utilization-periods: a new period starting exactly on the previous
          period's end date is an overlap because the range is INCLUSIVE on both ends, while
          starting one day later is accepted — the opposite convention to Assignment intervals.
        test_recipe:
          setup:
            - "Clock at 2026-08-31 so both candidate periods are historical. One NA group, one consultant with no assignments at all."
            - "One OPEN UtilizationPeriod P1 covering the INCLUSIVE range 2026-08-03..2026-08-14 (10 workdays, capacity 80.00)."
