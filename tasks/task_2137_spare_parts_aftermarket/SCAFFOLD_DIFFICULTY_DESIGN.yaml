  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: criticality_score_exactly_seventy_is_vital
        grounds:
          - calculations.part_criticality_and_stocking_policy
          - entities.Part.fields.criticality_score
          - entities.Part.fields.criticality_class
          - endpoints["POST /aftermarket/parts/{id}/classify"]
        distinguishing_aspect: |
          Numeric threshold boundary on the criticality metric reached through
          POST /aftermarket/parts/{id}/classify: 20 + 20.00 + 20 + 10 lands on exactly 70.00
          and the >= comparison must yield VITAL, not ESSENTIAL — a strict > implementation
          fails this and only this assertion.
        test_recipe:
          setup:
            - "a GOLD dealer, four ACTIVE installed units at build_revision 100 and an ACTIVE applicability row from build revision 0 with qty_per_unit 5"
