            - "After the accepted identify call ${v2} == 2 - the two rejected calls did not consume a version"
            - "package from IDENTIFIED returns HTTP 409 ERR_INVALID_CUSTODY_STATE (soc_pct is still null, but the state check at priority 8 fires before the SOC gate at priority 9)"
            - "release from IDENTIFIED returns HTTP 409 ERR_INVALID_CUSTODY_STATE, not ERR_INVALID_COMPLIANCE_STATE"
            - "Intake.${i_id}.custody_state == IDENTIFIED and version == ${v2} at the end"

