  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_half_open_adjacency
        grounds:
          - state_machines.ErgEvent.transitions
          - errors[ERR_VENUE_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Half-open interval semantics on resource Venue: an event starting exactly when
          another ends (12:00 == 12:00) is ACCEPTED, while one overlapping by an hour is
          rejected — adjacency is not a conflict under [starts_at, ends_at) semantics.
