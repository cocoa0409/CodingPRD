    roles: [WarehouseManager]
    code: 201
    input: ["source", "category", "room_label", "quantity", "rental_order_id?"]
    output: PullLine
    gates: [G1_AUTHENTICATION, G2_AUTHORIZATION, G3_EXISTENCE_AND_SHAPE, G5_GLOBAL_FREEZE, G6_STATE_PRECONDITION, G8_SAFETY_AND_AUTHORITY]
    side_effects: ["PullLine created in state REQUESTED", "InventoryPull.requested_unit_count and fill_rate recomputed", "InventoryPull.version += 1"]
