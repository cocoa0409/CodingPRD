# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not declared" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted to call this endpoint" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "PlanCoordinator X-User-ID does not equal the owning HealthPlan id, or Surveyor X-User-ID does not equal the session's surveyor_id" }

  # --- existence ---
  - { id: ERR_HEALTH_PLAN_NOT_FOUND, http: 404, condition: "HealthPlan id not found" }
  - { id: ERR_PRODUCT_LINE_SCOPE_NOT_FOUND, http: 404, condition: "ProductLineScope id not found" }
  - { id: ERR_STANDARDS_EDITION_NOT_FOUND, http: 404, condition: "StandardsEdition id not found" }
  - { id: ERR_STANDARD_ELEMENT_NOT_FOUND, http: 404, condition: "StandardElement id not found" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "AccreditationApplication id not found" }
  - { id: ERR_EVIDENCE_ITEM_NOT_FOUND, http: 404, condition: "EvidenceItem id not found" }
  - { id: ERR_FILE_REVIEW_SAMPLE_NOT_FOUND, http: 404, condition: "FileReviewSample id not found" }
  - { id: ERR_FILE_REVIEW_CASE_NOT_FOUND, http: 404, condition: "FileReviewCase id not found" }
  - { id: ERR_SURVEY_NOT_FOUND, http: 404, condition: "Survey id not found" }
  - { id: ERR_SURVEY_SESSION_NOT_FOUND, http: 404, condition: "SurveySession id not found" }
  - { id: ERR_SURVEYOR_NOT_FOUND, http: 404, condition: "Surveyor id not found" }
  - { id: ERR_SURVEYOR_QUESTION_NOT_FOUND, http: 404, condition: "SurveyorQuestion id not found" }
  - { id: ERR_ELEMENT_SCORE_NOT_FOUND, http: 404, condition: "ElementScore id not found" }
  - { id: ERR_CORRECTIVE_ACTION_PLAN_NOT_FOUND, http: 404, condition: "CorrectiveActionPlan id not found" }
  - { id: ERR_ACCREDITATION_OUTCOME_NOT_FOUND, http: 404, condition: "AccreditationOutcome id not found" }
  - { id: ERR_ANNUAL_REPORT_NOT_FOUND, http: 404, condition: "AnnualReport id not found" }
  - { id: ERR_QUALITY_MEASURE_RESULT_NOT_FOUND, http: 404, condition: "QualityMeasureResult id not found" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, unknown enum value, or range/format violation" }

  # --- state ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_application_version does not match the application's current version" }
  - { id: ERR_APPLICATION_INVALID_STATE, http: 409, condition: "Application is not in the state required by the operation" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "HealthPlan is not ACTIVE (retire called on RETIRED plan, or child creation on a RETIRED plan)" }
  - { id: ERR_EDITION_NOT_PUBLISHED, http: 409, condition: "StandardsEdition is not PUBLISHED (submit against DRAFT/SUPERSEDED edition; supersede target not PUBLISHED)" }
  - { id: ERR_EDITION_NOT_SUPERSEDABLE, http: 409, condition: "Supersede invoked on an edition not in PUBLISHED status" }
  - { id: ERR_EDITION_HAS_NO_ELEMENTS, http: 409, condition: "Publish invoked on an edition with zero StandardElements" }
  - { id: ERR_EVIDENCE_NOT_REVIEWABLE, http: 409, condition: "Accept/reject invoked on an EvidenceItem not in SUBMITTED status" }
  - { id: ERR_EVIDENCE_NOT_RESUBMITTABLE, http: 409, condition: "Resubmit invoked on an EvidenceItem not in REJECTED status" }
  - { id: ERR_SAMPLE_NOT_OPEN, http: 409, condition: "Sample mutation requires OPEN status" }
  - { id: ERR_SAMPLE_NOT_SUBMITTED, http: 409, condition: "Sample scoring requires SUBMITTED status" }
  - { id: ERR_SURVEY_INVALID_STATE, http: 409, condition: "Survey is not in the state required by the operation" }
  - { id: ERR_SESSION_INVALID_STATE, http: 409, condition: "SurveySession is not in the state required by the operation" }
  - { id: ERR_SCORE_NOT_PROVISIONAL, http: 409, condition: "Finalize/manual-void invoked on a score not in PROVISIONAL status" }
  - { id: ERR_CAP_INVALID_STATE, http: 409, condition: "CAP is not in the state required by the operation" }
  - { id: ERR_REPORT_INVALID_STATE, http: 409, condition: "AnnualReport is not in the state required by the operation" }
  - { id: ERR_QUESTION_ALREADY_ADJUDICATED, http: 409, condition: "Question already ADJUDICATED" }

  # --- business_safety ---
  - { id: ERR_CAP_REVIEW_PENDING, http: 422, condition: "RESURVEY confirm blocked: a CAP of the application is in EVIDENCE_SUBMITTED status awaiting officer review" }
  - { id: ERR_CAP_OVERDUE, http: 422, condition: "RESURVEY confirm blocked: a non-VERIFIED CAP has due_date before the logical clock date" }

  # --- business_referential ---
  - { id: ERR_SCOPE_PLAN_MISMATCH, http: 422, condition: "product_line_scope_id does not belong to the path's HealthPlan" }
  - { id: ERR_ELEMENT_EDITION_MISMATCH, http: 422, condition: "Referenced StandardElement does not belong to the application's StandardsEdition" }

  # --- business_temporal ---
  - { id: ERR_REVIEW_PERIOD_INVALID, http: 422, condition: "review_period_end <= review_period_start" }
  - { id: ERR_SURVEY_WINDOW_INVALID, http: 422, condition: "Survey end_date < start_date" }
  - { id: ERR_SESSION_OUTSIDE_SURVEY_WINDOW, http: 422, condition: "Session date outside the survey [start_date, end_date] window" }
  - { id: ERR_CASE_OUTSIDE_REVIEW_PERIOD, http: 422, condition: "Case service_date outside the application's [review_period_start, review_period_end] inclusive window" }
  - { id: ERR_SURVEYOR_SESSION_OVERLAP, http: 409, condition: "Half-open [start_minute, end_minute) interval overlaps another SCHEDULED or COMPLETED session of the same surveyor on the same date; adjacency (end == start) is allowed" }
  - { id: ERR_SURVEY_DATE_OVERLAP, http: 409, condition: "Closed [start_date, end_date] range intersects another PLANNED/CONFIRMED survey of the same application; touching boundary dates count as overlap" }
  - { id: ERR_ONSITE_SAME_DATE_CONFLICT, http: 409, condition: "Another non-CANCELLED on-site session of the same survey already exists on that date" }

  # --- business_constraint ---
  - { id: ERR_PLAN_CODE_DUPLICATE, http: 409, condition: "plan_code already in use" }
  - { id: ERR_EDITION_YEAR_DUPLICATE, http: 409, condition: "edition_year already in use" }
  - { id: ERR_PRODUCT_LINE_DUPLICATE, http: 409, condition: "A scope for this (plan, product_line) already exists" }
  - { id: ERR_ELEMENT_CODE_DUPLICATE, http: 409, condition: "element_code already exists within the edition" }
  - { id: ERR_DUPLICATE_ACTIVE_APPLICATION, http: 409, condition: "A non-terminal application already exists for the same (product_line_scope_id, standards_edition_id)" }
  - { id: ERR_ELEMENT_SCORE_EXISTS, http: 409, condition: "A non-VOIDED ElementScore already exists for this (application, element)" }
  - { id: ERR_CAP_EXISTS, http: 409, condition: "A non-VOIDED CAP already exists for this (application, element)" }
  - { id: ERR_OUTCOME_ALREADY_EXISTS, http: 409, condition: "Application already has an AccreditationOutcome; use revise" }
  - { id: ERR_MEASURE_RESULT_DUPLICATE, http: 409, condition: "A result already exists for this (scope, measure_code, measurement_year)" }
  - { id: ERR_ANNUAL_REPORT_DUPLICATE, http: 409, condition: "A report already exists for this (application, reporting_year)" }
  - { id: ERR_INVALID_TURNAROUND_DAYS, http: 422, condition: "required_turnaround_days < 1" }
  - { id: ERR_NO_SCHEDULED_SESSIONS, http: 409, condition: "Survey confirm requires at least one SCHEDULED session" }
  - { id: ERR_EVIDENCE_COMPLETENESS_UNMET, http: 422, condition: "An element with evidence_required_count > 0 lacks the required ACCEPTED evidence count" }
  - { id: ERR_ELEMENT_SCORES_INCOMPLETE, http: 422, condition: "Decide/revise blocked: some edition element lacks a FINAL non-VOIDED ElementScore" }
  - { id: ERR_OPEN_GAP_QUESTIONS_REMAIN, http: 422, condition: "Finalize blocked: an ADJUDICATE-pending (raises_gap=true, LOGGED) question references this element" }
  - { id: ERR_SESSIONS_NOT_FINISHED, http: 409, condition: "Survey complete blocked: a session is still SCHEDULED" }
  - { id: ERR_SAMPLE_INCOMPLETE, http: 422, condition: "Sample submit blocked: case count < required_size" }
  - { id: ERR_ACTIVE_APPLICATIONS_EXIST, http: 409, condition: "Plan retire blocked: an application is in a non-terminal status" }

  # --- business_fiscal ---
  - { id: ERR_SAMPLE_SIZE_BELOW_MINIMUM, http: 422, condition: "FileReviewSample.required_size < edition.min_file_sample_per_category" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Accrediting-body platform administrator; owns reference data (editions, elements, plans, surveyors) and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /accreditation/_clock/set_current_utc"
      - "POST /accreditation/standards-editions and publish/supersede/standard-elements under it"
      - "POST /accreditation/health-plans and retire"
      - "POST /accreditation/surveyors"
    shared_operations:
      - "All GET endpoints"
  - name: PlanCoordinator
    description: "Health plan accreditation coordinator; acts on behalf of exactly one HealthPlan (X-User-ID == HealthPlan.id)"
    identity: "entity_backed:HealthPlan"
    exclusive_operations:
      - "POST /accreditation/health-plans/{planId}/product-line-scopes"
      - "POST /accreditation/health-plans/{planId}/applications"
      - "POST /accreditation/applications/{id}/submit and withdraw"
      - "POST /accreditation/applications/{id}/evidence-items and evidence-items/{id}/resubmit"
      - "POST /accreditation/file-review-samples/{id}/cases and submit"
      - "POST /accreditation/corrective-action-plans/{id}/submit-evidence"
      - "POST /accreditation/applications/{id}/annual-reports, annual-reports/{id}/submit and reopen"
      - "POST /accreditation/product-line-scopes/{scopeId}/quality-measure-results and consumer-survey-scores"
    shared_operations:
      - "All GET endpoints"
  - name: AccreditationOfficer
    description: "Accrediting-body review officer; drives review, survey, scoring, decision, CAP verification and annual report review"
    identity: opaque
    exclusive_operations:
      - "POST /accreditation/applications/{id}/begin-evidence-review and advance-to-survey-scheduling"
      - "POST /accreditation/evidence-items/{id}/accept and reject"
      - "POST /accreditation/applications/{id}/file-review-samples and file-review-samples/{id}/score"
      - "POST /accreditation/applications/{id}/surveys and survey confirm/complete/cancel"
      - "POST /accreditation/surveys/{id}/sessions and survey-sessions/{id}/cancel and reschedule"
      - "POST /accreditation/surveyor-questions/{id}/adjudicate"
      - "POST /accreditation/applications/{id}/element-scores and element-scores/{id}/finalize and void"
      - "POST /accreditation/applications/{id}/corrective-action-plans and corrective-action-plans/{id}/verify"
      - "POST /accreditation/applications/{id}/outcome and outcomes/{id}/revise and publish"
      - "POST /accreditation/annual-reports/{id}/review"
    shared_operations:
      - "All GET endpoints"
  - name: Surveyor
    description: "Field surveyor; completes own sessions and logs questions (X-User-ID == Surveyor.id)"
    identity: "entity_backed:Surveyor"
    exclusive_operations:
      - "POST /accreditation/survey-sessions/{id}/complete"
      - "POST /accreditation/survey-sessions/{id}/questions"
    shared_operations:
      - "All GET endpoints"
  - name: PublicViewer
    description: "Unauthenticated-equivalent public role for the public accreditation status display"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /accreditation/public/plans/{planId}/accreditation-status"
      - "All GET endpoints"
