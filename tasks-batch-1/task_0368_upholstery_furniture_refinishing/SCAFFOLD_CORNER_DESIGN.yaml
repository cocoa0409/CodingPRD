scaffold_corner_design:

  # =========================================================================
  # Entities — creation, required fields, defaults, computed/system fields, not-found
  # =========================================================================
  - section: entities
    instances:
      - name: create_work_order_returns_201_with_intake_defaults
        claim_type: Creation
        grounds: ["endpoints.\"POST /work-orders\"", "entities.WorkOrder.fields.status"]
        distinguishing_aspect: "POST /work-orders with customer_id + service_type returns 201, status INTAKE, estimate_total_cents 0, balance_due_cents 0, amount_paid_cents 0, version 1."
        test_recipe:
          setup: ["A registered Customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cara C", email: "cara@x.com", phone: "555-0300" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REUPHOLSTERY", rush_requested: false }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
          assert:
            - "response.status == 201"
            - "WorkOrder.${wo_id}.status == INTAKE"
            - "WorkOrder.${wo_id}.estimate_total_cents == 0"
            - "WorkOrder.${wo_id}.amount_paid_cents == 0"
            - "WorkOrder.${wo_id}.version == 1"

      - name: create_work_order_missing_service_type_returns_invalid_request
        claim_type: Required Fields
        grounds: ["endpoints.\"POST /work-orders\"", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required service_type yields ERR_INVALID_REQUEST (400); no WorkOrder is created."
        test_recipe:
          setup: ["A registered Customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Dee D", email: "dee@x.com", phone: "555-0301" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}" }
              as: IntakeClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_work_order_invalid_enum_service_type_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.WorkOrder.fields.service_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "service_type 'STAINING' (not in REUPHOLSTERY/REFINISH/REPAIR) yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A registered Customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Eve E", email: "eve@x.com", phone: "555-0302" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "STAINING" }
              as: IntakeClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_work_order_unknown_customer_returns_fk_not_found
        claim_type: Parent Relationships
        grounds: ["validations[priority=12]", "errors[ERR_FK_NOT_FOUND]"]
        distinguishing_aspect: "A non-existent customer_id FK on POST /work-orders yields ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /work-orders"
              payload: { customer_id: "00000000-0000-4000-8000-000000000000", service_type: "REPAIR" }
              as: IntakeClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "data.error_id == ERR_FK_NOT_FOUND"

      - name: get_work_order_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["validations[priority=10]", "errors[ERR_WORK_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "GET /work-orders/{id} with an unknown UUID yields ERR_WORK_ORDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /work-orders/00000000-0000-4000-8000-000000000000"
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "data.error_id == ERR_WORK_ORDER_NOT_FOUND"

      - name: condition_photo_sequence_no_assigned_by_created_at
        claim_type: System Fields
        grounds: ["entities.ConditionPhoto.fields.sequence_no", "endpoints.\"POST /condition-photos\""]
        distinguishing_aspect: "Two condition photos on one work order get sequence_no 1 then 2 (created_at ASC), assigned server-side; client cannot set it."
        test_recipe:
          setup: ["A work order at INTAKE."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Fia F", email: "fia@x.com", phone: "555-0303" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REPAIR" }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
            - call: "POST /condition-photos"
              payload: { work_order_id: "${wo_id}", image_uri: "s3://c/1.jpg" }
              as: IntakeClerk
              captures: { p1: $.data.id, s1: $.data.sequence_no }
          trigger:
            - call: "POST /condition-photos"
              payload: { work_order_id: "${wo_id}", image_uri: "s3://c/2.jpg" }
              as: IntakeClerk
              captures: { p2: $.data.id, s2: $.data.sequence_no }
          assert:
            - "ConditionPhoto.${p1}.sequence_no == 1"
            - "ConditionPhoto.${p2}.sequence_no == 2"

      - name: condition_photo_immutable_entity_no_version_field
        claim_type: Immutability
        grounds: ["entities.ConditionPhoto", "endpoints.\"GET /condition-photos/{id}\""]
        distinguishing_aspect: "ConditionPhoto has common_fields:false — its read carries id and created_at but no version field, and there is no update endpoint."
        test_recipe:
          setup: ["A condition photo exists on a work order."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Gia G", email: "gia@x.com", phone: "555-0304" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REPAIR" }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
            - call: "POST /condition-photos"
              payload: { work_order_id: "${wo_id}", image_uri: "s3://c/3.jpg" }
              as: IntakeClerk
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /condition-photos/${p_id}"
              as: IntakeClerk
              captures: { got: $.data.id }
          assert:
            - "ConditionPhoto.${p_id}.id == ${got}"

      - name: list_work_orders_pagination_envelope
        claim_type: Listing
        grounds: ["endpoints.\"GET /work-orders\"", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /work-orders returns an array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["At least one work order exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Hal H", email: "hal@x.com", phone: "555-0305" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REPAIR" }
              as: IntakeClerk
          trigger:
            - call: "GET /work-orders"
              as: ShopManager
          assert:
            - "response.response_type == array"
            - "response.meta.api_request_id present"

  # =========================================================================
  # State machines — invalid transitions, terminal lockdown, idempotency
  # =========================================================================
  - section: state_machines
    instances:
      - name: approve_from_intake_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.WorkOrder.AWAITING_APPROVAL_to_APPROVED", "errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / approve_state_vs_fiscal_state_wins
          rationale: "Approving an INTAKE order is exactly the state arm asserted (ERR_INVALID_STATE) in that §1.8 dual-failure instance."

      - name: decline_after_decline_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.WorkOrder.AWAITING_APPROVAL_to_DECLINED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DECLINED is terminal — a second decline on an already-DECLINED order yields ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["A DECLINED work order (estimate authored then declined)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ida I", email: "ida@x.com", phone: "555-0306" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REPAIR" }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
            - call: "POST /condition-photos"
              payload: { work_order_id: "${wo_id}", image_uri: "s3://c/4.jpg" }
              as: IntakeClerk
            - call: "POST /work-orders/${wo_id}/line-items"
              payload: { piece_label: "P", yardage_required: 0, labor_hours: 1 }
              as: IntakeClerk
            - call: "GET /work-orders/${wo_id}"
              as: Estimator
              captures: { v_est: $.data.version }
            - call: "POST /work-orders/${wo_id}/estimates"
              payload: { expected_work_order_version: "${v_est}" }
              as: Estimator
            - call: "POST /work-orders/${wo_id}/decline"
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/decline"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "WorkOrder.${wo_id}.status == DECLINED"

      - name: line_item_initial_state_advances_intake_to_estimating
        claim_type: Initial State
        grounds: ["state_machines.WorkOrder.INTAKE_to_ESTIMATING", "endpoints.\"POST /work-orders/{id}/line-items\""]
        distinguishing_aspect: "Adding the first LineItem to an INTAKE order (with a condition photo present) moves WorkOrder.status to ESTIMATING."
        test_recipe:
          setup: ["INTAKE work order with one condition photo."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Jay J", email: "jay@x.com", phone: "555-0307" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REPAIR" }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
            - call: "POST /condition-photos"
              payload: { work_order_id: "${wo_id}", image_uri: "s3://c/5.jpg" }
              as: IntakeClerk
          trigger:
            - call: "POST /work-orders/${wo_id}/line-items"
              payload: { piece_label: "Q", yardage_required: 0, labor_hours: 2 }
              as: IntakeClerk
              captures: { li_id: $.data.id }
          assert:
            - "WorkOrder.${wo_id}.status == ESTIMATING"

      - name: line_item_without_condition_photo_rejected_invalid_state
        claim_type: Precondition Enforcement
        grounds: ["state_machines.WorkOrder.INTAKE_to_ESTIMATING", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Adding a LineItem before any ConditionPhoto exists violates the INTAKE->ESTIMATING precondition and yields ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["INTAKE work order with NO condition photos."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Kit K", email: "kit@x.com", phone: "555-0308" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REPAIR" }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/line-items"
              payload: { piece_label: "R", yardage_required: 0, labor_hours: 2 }
              as: IntakeClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: receive_already_received_material_order_returns_invalid_state
        claim_type: Idempotency
        grounds: ["state_machines.MaterialOrder.ORDERED_to_RECEIVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Receiving an already-RECEIVED MaterialOrder a second time yields ERR_INVALID_STATE (409); finalized_cost not recomputed."
        test_recipe:
          setup: ["An APPROVED order with a fabric MaterialOrder already RECEIVED at 2000 c/yd (finalized 12000)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Lia L", email: "lia@x.com", phone: "555-0309" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /fabric-skus"
              payload: { sku_code: "F-AAA", name: "Fab A", price_cents_per_yard: 1800, roll_width_inches: 54, in_stock_yards: 100 }
              as: ShopManager
              captures: { fab_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REUPHOLSTERY" }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
            - call: "POST /condition-photos"
              payload: { work_order_id: "${wo_id}", image_uri: "s3://c/6.jpg" }
              as: IntakeClerk
            - call: "POST /work-orders/${wo_id}/line-items"
              payload: { piece_label: "S", fabric_sku_id: "${fab_id}", yardage_required: 6, labor_hours: 4 }
              as: IntakeClerk
            - call: "GET /work-orders/${wo_id}"
              as: Estimator
              captures: { v_est: $.data.version }
            - call: "POST /work-orders/${wo_id}/estimates"
              payload: { expected_work_order_version: "${v_est}" }
              as: Estimator
            - call: "GET /work-orders/${wo_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { v_appr: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${v_appr}", deposit_amount_cents: 12090 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /material-orders"
              payload: { work_order_id: "${wo_id}", fabric_sku_id: "${fab_id}", yards_ordered: 6 }
              as: ShopManager
              captures: { mo_id: $.data.id }
            - call: "POST /material-orders/${mo_id}/receive"
              payload: { received_fabric_price_cents_per_yard: 2000 }
              as: ShopManager
          trigger:
            - call: "POST /material-orders/${mo_id}/receive"
              payload: { received_fabric_price_cents_per_yard: 3000 }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "MaterialOrder.${mo_id}.finalized_cost_cents == 12000"

      - name: warranty_approve_requires_covered_true
        claim_type: Precondition Enforcement
        grounds: ["state_machines.WarrantyClaim.OPEN_to_APPROVED", "entities.WarrantyClaim.fields.covered", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving an OPEN but covered==false claim is rejected with ERR_INVALID_STATE (409); only covered==true claims may be APPROVED."
        test_recipe:
          setup: ["A COMPLETED order (completed_at 2026-03-01) with an out-of-window OPEN claim filed 2026-05-31 (covered==false)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Moe M", email: "moe@x.com", phone: "555-0310" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REPAIR" }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
            - call: "POST /condition-photos"
              payload: { work_order_id: "${wo_id}", image_uri: "s3://c/7.jpg" }
              as: IntakeClerk
            - call: "POST /work-orders/${wo_id}/line-items"
              payload: { piece_label: "T", yardage_required: 0, labor_hours: 1 }
              as: IntakeClerk
            - call: "GET /work-orders/${wo_id}"
              as: Estimator
              captures: { v_est: $.data.version }
            - call: "POST /work-orders/${wo_id}/estimates"
              payload: { expected_work_order_version: "${v_est}" }
              as: Estimator
            - call: "GET /work-orders/${wo_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { v_appr: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${v_appr}", deposit_amount_cents: 2000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /shop-days"
              payload: { work_date: "2026-02-21", labor_capacity_hours: 8 }
              as: ShopManager
              captures: { day_id: $.data.id }
            - call: "POST /fulfillment-legs"
              payload: { work_order_id: "${wo_id}", kind: "PRODUCTION", shop_day_id: "${day_id}" }
              as: ShopManager
              captures: { prod_leg_id: $.data.id }
            - call: "POST /fulfillment-legs/${prod_leg_id}/dispatch"
              as: ShopManager
            - call: "POST /fulfillment-legs/${prod_leg_id}/complete"
              as: ShopManager
            - call: "POST /work-orders/${wo_id}/finish-production"
              as: ShopManager
            - call: "POST /fulfillment-legs"
              payload: { work_order_id: "${wo_id}", kind: "PICKUP", scheduled_window_start: "2026-02-28T09:00:00Z", scheduled_window_end: "2026-02-28T10:00:00Z" }
              as: ShopManager
              captures: { pick_leg_id: $.data.id }
            - call: "POST /fulfillment-legs/${pick_leg_id}/dispatch"
              as: ShopManager
            - call: "POST /fulfillment-legs/${pick_leg_id}/complete"
              as: ShopManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ShopManager
            - call: "GET /work-orders/${wo_id}"
              as: ShopManager
              captures: { bal: $.data.balance_due_cents }
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { settlement_amount_cents: "${bal}" }
              as: ShopManager
            - call: "POST /work-orders/${wo_id}/warranty-claims"
              payload: { defect_note: "late defect", filed_at: "2026-05-31T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${claim_id}/approve"
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "WarrantyClaim.${claim_id}.status == OPEN"

      - name: production_leg_onto_closed_shop_day_returns_capacity_exceeded
        claim_type: Invalid Transitions
        grounds: ["state_machines.ShopDay.OPEN_to_CLOSED", "endpoints.\"POST /shop-days/{id}/close\"", "errors[ERR_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "Booking a PRODUCTION leg onto a CLOSED ShopDay yields ERR_CAPACITY_EXCEEDED (409); the day is unavailable for production regardless of remaining capacity."
        test_recipe:
          setup: ["A ShopDay closed via POST /shop-days/{id}/close; an APPROVED order with no outstanding materials."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cleo C", email: "cleo@x.com", phone: "555-0331" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /shop-days"
              payload: { work_date: "2026-07-04", labor_capacity_hours: 20 }
              as: ShopManager
              captures: { day_id: $.data.id }
            - call: "POST /shop-days/${day_id}/close"
              as: ShopManager
              captures: { st: $.data.status }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REPAIR" }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
            - call: "POST /condition-photos"
              payload: { work_order_id: "${wo_id}", image_uri: "s3://c/27.jpg" }
              as: IntakeClerk
            - call: "POST /work-orders/${wo_id}/line-items"
              payload: { piece_label: "P", yardage_required: 0, labor_hours: 2 }
              as: IntakeClerk
            - call: "GET /work-orders/${wo_id}"
              as: Estimator
              captures: { v_est: $.data.version }
            - call: "POST /work-orders/${wo_id}/estimates"
              payload: { expected_work_order_version: "${v_est}" }
              as: Estimator
            - call: "GET /work-orders/${wo_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { v_appr: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${v_appr}", deposit_amount_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /fulfillment-legs"
              payload: { work_order_id: "${wo_id}", kind: "PRODUCTION", shop_day_id: "${day_id}" }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "ShopDay.${day_id}.status == CLOSED"
            - "response.status == 409"
            - "data.error_id == ERR_CAPACITY_EXCEEDED"

  # =========================================================================
  # Calculations — turnaround, provisional cost, balance reconciliation
  # =========================================================================
  - section: calculations
    instances:
      - name: turnaround_standard_band_no_rush
        claim_type: Correct Result
        grounds: ["calculations.turnaround", "entities.WorkOrder.fields.promised_turnaround_days"]
        distinguishing_aspect: "Non-rush order with 5 total labor-hours sets promised_turnaround_days = 3 + ceil(5/8) = 4 at approval."
        test_recipe:
          setup: ["ESTIMATING order, one LineItem 5 labor-hours, no rush; v1 estimate authored."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Nia N", email: "nia@x.com", phone: "555-0311" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REFINISH", rush_requested: false }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
            - call: "POST /condition-photos"
              payload: { work_order_id: "${wo_id}", image_uri: "s3://c/8.jpg" }
              as: IntakeClerk
            - call: "POST /work-orders/${wo_id}/line-items"
              payload: { piece_label: "Table refinish", yardage_required: 0, labor_hours: 5 }
              as: IntakeClerk
            - call: "GET /work-orders/${wo_id}"
              as: Estimator
              captures: { v_est: $.data.version }
            - call: "POST /work-orders/${wo_id}/estimates"
              payload: { expected_work_order_version: "${v_est}" }
              as: Estimator
            - call: "GET /work-orders/${wo_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { v_appr: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/approve"
