            - call: "POST /evfleet/charging-projects"
              payload: { depot_id: "${depot_b_id}", requested_capacity_kw: 150, install_window_start: "2026-10-01T00:00:00Z", install_window_end: "2026-10-10T00:00:00Z", crew_count: 1, expected_depot_version: "${depot_b_v}" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { p1_id: $.data.id }
            - call: "GET /evfleet/depots/${depot_b_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { depot_b_v2: $.data.version }
          trigger:
            - call: "POST /evfleet/charging-projects"
              payload: { depot_id: "${depot_b_id}", requested_capacity_kw: 100, install_window_start: "2026-10-12T00:00:00Z", install_window_end: "2026-10-20T00:00:00Z", crew_count: 1, expected_depot_version: "${depot_b_v2}" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { p2_id: $.data.id }
            - call: "GET /evfleet/depots/${depot_b_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { depot_b_v3: $.data.version, committed_b: $.data.committed_capacity_kw }
            - call: "POST /evfleet/charging-projects"
              payload: { depot_id: "${depot_b_id}", requested_capacity_kw: 1, install_window_start: "2026-11-01T00:00:00Z", install_window_end: "2026-11-05T00:00:00Z", crew_count: 1, expected_depot_version: "${depot_b_v3}" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { err_over: $.data.error_id }
          assert:
            - "P2 (100 kW == headroom 100) is created with status SURVEY (inclusive boundary passes)"
            - "committed_b == 250 after P2"
            - "err_over == ERR_DEPOT_CAPACITY_EXCEEDED (one kW beyond the boundary fails)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: vin_registration_requires_passed_module
        grounds:
          - validations[priority=13]
          - state_machines.BatteryModule
          - endpoints.POST_/evfleet/vehicles
        distinguishing_aspect: "Vehicle x BatteryModule pair: VIN registration reads the module's quality gate — a module still IN_QA rejects the registration with ERR_MODULE_NOT_PASSED; the same registration succeeds once the module reaches PASSED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Customer, CA depot, supplier; module M-201 advanced only to IN_QA; order (quantity 2) CONFIRMED."
          setup_api_calls:
            - *d_clock
            - *d_cust
            - *d_depot
            - *d_sup
            - *d_mod1
            - *d_mod1_qa
            - *d_order
            - *d_order_submit
            - *d_order_confirm
          trigger:
            - call: "POST /evfleet/vehicles"
              payload: { vehicle_order_id: "${ord_id}", battery_module_id: "${mod1_id}", vin: "VIN-ACME-801", expected_vehicle_order_version: "${ord_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { err_blocked: $.data.error_id }
            - call: "POST /evfleet/battery-modules/${mod1_id}/transition"
              payload: { to_state: "PASSED" }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /evfleet/vehicles"
              payload: { vehicle_order_id: "${ord_id}", battery_module_id: "${mod1_id}", vin: "VIN-ACME-801", expected_vehicle_order_version: "${ord_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { veh_ok: $.data.id }
          assert:
            - "err_blocked == ERR_MODULE_NOT_PASSED (module IN_QA, not PASSED)"
            - "after the rejection, VehicleOrder.${ord_id}.registered_count == 0 and the module remains IN_QA"
            - "once PASSED, the identical registration returns 201 with Vehicle.${veh_ok}.battery_module_id == ${mod1_id}"
            - "the module's quality_status is now ALLOCATED (cascade on registration)"

      - name: commission_requires_depot_charging_capacity
        grounds:
          - calculations.charging_demand_gate
          - state_machines.Vehicle.delivery_status_AT_DEPOT_to_delivery_status_COMMISSIONED
        distinguishing_aspect: "Vehicle x ChargingProject pair (different pair than Vehicle x BatteryModule): a vehicle on a depot-charging-requiring order cannot commission while the depot has zero commissioned kW; commissioning a 25 kW project first (20 kW usable >= 19.2 required) unlocks the same transition."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Customer, CA depot (500 kW), supplier, PASSED module; order quantity 1 with requires_depot_charging true, CONFIRMED; vehicle registered, telematics ACTIVE, delivery AT_DEPOT."
          setup_api_calls:
            - *d_clock
            - *d_cust
            - *d_depot
            - *d_sup
            - *d_mod1
            - *d_mod1_qa
            - *d_mod1_pass
            - call: "POST /evfleet/vehicle-orders"
              payload: { fleet_customer_id: "${cust_id}", depot_id: "${depot_id}", battery_supplier_id: "${sup_id}", quantity: 1, battery_pack_kwh: 77, telematics_tier: "STANDARD", delivery_method: "DIRECT_DELIVERY", requires_depot_charging: true }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { ord_cg_id: $.data.id }
            - call: "POST /evfleet/vehicle-orders/${ord_cg_id}/transition"
              payload: { to_state: "SUBMITTED" }
              as: FleetManager
              as_user_id: "${cust_id}"
            - call: "POST /evfleet/vehicle-orders/${ord_cg_id}/transition"
              payload: { to_state: "CONFIRMED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ord_cg_v: $.data.version }
            - call: "POST /evfleet/vehicles"
              payload: { vehicle_order_id: "${ord_cg_id}", battery_module_id: "${mod1_id}", vin: "VIN-ACME-802", expected_vehicle_order_version: "${ord_cg_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { veh_cg: $.data.id }
            - call: "POST /evfleet/vehicles/${veh_cg}/transition"
              payload: { dimension: "TELEMATICS", to_state: "PROVISIONED" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
            - call: "POST /evfleet/vehicles/${veh_cg}/transition"
              payload: { dimension: "TELEMATICS", to_state: "ACTIVE" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
            - call: "POST /evfleet/vehicles/${veh_cg}/transition"
              payload: { dimension: "DELIVERY", to_state: "IN_TRANSIT" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
            - call: "POST /evfleet/vehicles/${veh_cg}/transition"
              payload: { dimension: "DELIVERY", to_state: "AT_DEPOT" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
            - call: "GET /evfleet/depots/${depot_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { depot_cg_v: $.data.version }
          trigger:
            - call: "POST /evfleet/vehicles/${veh_cg}/transition"
              payload: { dimension: "DELIVERY", to_state: "COMMISSIONED" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
              captures: { err_gate: $.data.error_id }
            - call: "POST /evfleet/charging-projects"
              payload: { depot_id: "${depot_id}", requested_capacity_kw: 25, install_window_start: "2026-09-05T00:00:00Z", install_window_end: "2026-09-08T00:00:00Z", crew_count: 1, expected_depot_version: "${depot_cg_v}" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { proj_cg: $.data.id }
            - call: "POST /evfleet/charging-projects/${proj_cg}/transition"
              payload: { to_state: "UTILITY_REVIEW" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
            - call: "POST /evfleet/charging-projects/${proj_cg}/transition"
              payload: { to_state: "PERMITTING" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
            - call: "POST /evfleet/charging-projects/${proj_cg}/transition"
              payload: { to_state: "INSTALLATION" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
            - call: "POST /evfleet/charging-projects/${proj_cg}/transition"
              payload: { to_state: "COMMISSIONED" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
            - call: "POST /evfleet/vehicles/${veh_cg}/transition"
              payload: { dimension: "DELIVERY", to_state: "COMMISSIONED" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
              captures: { veh_done: $.data.delivery_status }
          assert:
            - "err_gate == ERR_CHARGING_CAPACITY_INSUFFICIENT (0 commissioned kW x 0.8 < 19.2 required)"
            - "after a 25 kW project is COMMISSIONED, the same transition succeeds: veh_done == COMMISSIONED (25 x 0.8 = 20 >= 19.2)"
            - "Vehicle.${veh_cg}.telematics_status remained ACTIVE throughout (independent parallel dimension)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: van_visit_travel_buffer_conflict
        grounds:
          - validations[priority=11]
          - platform_constants.VAN_TRAVEL_BUFFER_MINUTES
        distinguishing_aspect: "Half-open visit windows plus a 45-minute travel buffer on the MobileVan resource: a visit starting 30 minutes after the previous one's end conflicts, while starting exactly at end+45min is accepted — buffer semantics on MobileVan."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Two COMMISSIONED vehicles (vehicles 1 and 2 of the base order); service center SC; mobile van VAN-1 homed at SC; visit A on vehicle 1 via VAN-1 booked 2026-09-10T09:00-10:00Z."
          setup_api_calls:
            - *d_clock
            - *d_cust
            - *d_depot
            - *d_sup
            - *d_mod1
            - *d_mod1_qa
            - *d_mod1_pass
            - *d_mod2
            - *d_mod2_qa
            - *d_mod2_pass
            - *d_order
            - *d_order_submit
            - *d_order_confirm
            - *d_veh1
            - *d_order_read_1
            - *d_veh2
            - *d_veh1_prov
            - *d_veh1_act
            - *d_veh1_transit
            - *d_veh1_depot
            - *d_veh1_comm
            - *d_veh2_prov
            - *d_veh2_act
            - *d_veh2_transit
            - *d_veh2_depot
            - *d_veh2_comm
            - call: "POST /evfleet/service-centers"
              payload: { name: "SC North", region_code: "CA-N", state_code: "CA", bay_count: 4 }
              as: PlatformAdmin
              captures: { sc_id: $.data.id }
            - call: "POST /evfleet/mobile-vans"
              payload: { service_center_id: "${sc_id}", van_code: "VAN-1" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
              captures: { van_id: $.data.id }
            - call: "POST /evfleet/service-visits"
              payload: { vehicle_id: "${veh1_id}", mobile_van_id: "${van_id}", window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-10T10:00:00Z", purpose: "REPAIR", parts_lines: [] }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { visit_a: $.data.id }
          trigger:
            - call: "POST /evfleet/service-visits"
              payload: { vehicle_id: "${veh2_id}", mobile_van_id: "${van_id}", window_start: "2026-09-10T10:30:00Z", window_end: "2026-09-10T11:30:00Z", purpose: "MAINTENANCE", parts_lines: [] }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { err_buffer: $.data.error_id }
            - call: "POST /evfleet/service-visits"
              payload: { vehicle_id: "${veh2_id}", mobile_van_id: "${van_id}", window_start: "2026-09-10T10:45:00Z", window_end: "2026-09-10T11:30:00Z", purpose: "MAINTENANCE", parts_lines: [] }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { visit_c: $.data.id }
          assert:
            - "err_buffer == ERR_VAN_SCHEDULE_CONFLICT (10:30 < 10:00 + 45min = 10:45)"
            - "visit_c created at exactly end+45min (boundary equality passes the buffer rule)"
            - "visit A remains SCHEDULED, untouched by the rejected booking"

      - name: depot_install_crew_aggregate_conflict
        grounds:
          - validations[priority=12]
          - platform_constants.MAX_DEPOT_CREW
        distinguishing_aspect: "Closed-interval windows with aggregate crew capacity on the Depot resource (different semantics than the van's half-open+buffer rule): touching endpoints count as overlapping, and overlap is allowed until the summed crew_count would exceed 4."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Customer with depot D (500 kW). Project P1 (50 kW, closed window 2026-09-10T00:00Z..2026-09-20T00:00Z, crew 3) created and advanced to PERMITTING."
