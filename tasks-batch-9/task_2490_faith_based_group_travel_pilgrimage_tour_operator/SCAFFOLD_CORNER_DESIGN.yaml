              payload: {}
              as: ProgramManager
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_PILGRIM_NOT_FOUND"

      - name: unknown_agreement_path_id_returns_agreement_not_found
        claim_type: triggerable
        grounds:
          - errors.ERR_AGREEMENT_NOT_FOUND
          - validations[priority=20]
        distinguishing_aspect: "Reading an agreement that does not exist returns 404 ERR_AGREEMENT_NOT_FOUND rather than an empty payload."
        test_recipe:
          setup:
            - "Empty store; no agreement has been created."
