            - "No employees exist with location_code 'SEA' (scope resolution requires at least one Employee with the location — to keep the scope resolvable while the headcount is zero, one employee exists in SEA but with employment_status TERMINATED, so the ROLLING_90D ACTIVE headcount is 0)."
