# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3062_credit_monitoring_score_simulation_pre_qualified_offer
#
# 20 instances across the nine §0.5 Difficulty Rules (every rule carries at
# least the §0.5 minimum of two). Skipped numbers inside instances are never
# used; every `- name:` below is one counted instance.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: odds_provisional_versus_settled_after_realized_outcome
        grounds:
          - calculations.compute_modeled_approval_odds
          - entities.PreQualificationDecision.fields.modeled_odds_settled
          - state_machines.PreQualificationDecision.CONSENTED_to_CONSUMED
        distinguishing_aspect: "Identical bureau data reports modeled_odds_pct 0.91 while the decision is PREQUALIFIED and 100 once a funded referral has realized the outcome — the two variants are provisional and settled on the PreQualificationDecision entity."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Consumer P (CA, dti 35.0) with one ACTIVE snapshot scored 660 at 40.00% utilization; a LOAN program with a hard UTILIZATION_PCT LTE 50 criterion and a failing soft DTI_PCT LTE 30 criterion."
            - "Decision on P's program present, rendered, consented and funded so the outcome is realized."
          setup_api_calls:
            - &k_clock
              call: "POST /credit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &k_consumer_p
              call: "POST /credit/consumers"
              payload: { full_name: "Maya Chen", email: "maya@x.com", state_code: "CA", bureau_pin: "4821", dti_pct: 35.0 }
              as: Consumer
              captures: { c_id: $.data.id, c_v1: $.data.version }
            - &k_consent_p
              call: "POST /credit/consumers/${c_id}/monitoring-consent"
              payload: {}
              as: Consumer
              as_user_id: "${c_id}"
            - &k_resync_a
              call: "GET /credit/consumers/${c_id}"
              payload: {}
              as: Consumer
              as_user_id: "${c_id}"
              captures: { ca_v: $.data.version }
            - &k_snapshot_p
              call: "POST /credit/consumers/${c_id}/bureau-snapshots"
              payload: { score: 660, added_account_count: 2, total_revolving_balance_cents: 480000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization","length_of_credit_history"], expected_consumer_version: "${ca_v}" }
              as: BureauConnector
              captures: { s_id: $.data.id, s_ord: $.data.snapshot_ordinal }
            - &k_tier_good
              call: "POST /credit/score-tiers"
              payload: { tier_code: "GOOD", min_score: 670, max_score: 739, factor_catalog: ["high_utilization","length_of_credit_history"] }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - &k_tier_act
              call: "POST /credit/score-tiers/${tier_id}/activate"
              payload: {}
              as: PlatformAdmin
            - &k_item_loan
              call: "POST /credit/catalog/items"
              payload: { product_kind: "LOAN", product_name: "Personal Loan", min_score: 560, max_score: 720, max_dti_pct: 60.0 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - &k_item_act
              call: "POST /credit/catalog/items/${item_id}/activate"
              payload: {}
              as: PlatformAdmin
            - &k_lender
              call: "POST /credit/lenders"
              payload: { lender_name: "Northstar Bank", states_served: ["CA","NY","TX"] }
              as: PlatformAdmin
              captures: { lender_id: $.data.id }
            - &k_lender_act
              call: "POST /credit/lenders/${lender_id}/activate"
              payload: {}
              as: PlatformAdmin
            - &k_program_loan
              call: "POST /credit/lender-programs"
              payload: { lender_id: "${lender_id}", product_catalog_item_id: "${item_id}", program_name: "Northstar Personal Loan", program_code: "NS-LOAN-01", min_modeled_score: 560, max_dti_pct: 45.0, max_eligible_utilization_pct: 55.0, annual_fee_cents: 0, intro_apr_bps: 1299, go_live_at: "2026-08-01T00:00:00Z", expiry_at: "2027-08-01T00:00:00Z", revenue_share_bps: 1000, clawback_rate_bps: 500, clawback_days: 90 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - &k_program_act
              call: "POST /credit/lender-programs/${prog_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "UTILIZATION_PCT", operator: "LTE", criterion_value: "50", is_hard_requirement: true }
              as: LenderOps
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "DTI_PCT", operator: "LTE", criterion_value: "30", is_hard_requirement: false }
              as: LenderOps
            - &k_prequal_p
              call: "POST /credit/consumers/${c_id}/pre-qualifications"
              payload: { lender_program_id: "${prog_id}" }
              as: Consumer
              as_user_id: "${c_id}"
              captures: { d_id: $.data.id, d_odds: $.data.modeled_odds_pct }
            - &k_qualify
              call: "POST /credit/pre-qualification-decisions/${d_id}/qualify"
              payload: {}
              as: Referee
            - &k_content_facet
              call: "POST /credit/consumers/${c_id}/content-quality-facets"
              payload: { topic: "factor_explanations", score_bps: 9000 }
              as: Referee
            - &k_facet_accuracy
              call: "POST /credit/consumers/${c_id}/content-quality-facets"
              payload: { topic: "accuracy_education", score_bps: 9000 }
              as: Referee
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "seed-facet-rollup" }
              as: PlatformAdmin
            - &k_present
              call: "POST /credit/pre-qualification-decisions/${d_id}/present"
              payload: { channel: "WEB" }
              as: Consumer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /credit/offers/${o_id}/render"
              payload: {}
              as: Consumer
              as_user_id: "${c_id}"
            - &k_resync_b
              call: "GET /credit/consumers/${c_id}"
              payload: {}
              as: Consumer
              as_user_id: "${c_id}"
              captures: { cb_v: $.data.version }
            - &k_consent_record
              call: "POST /credit/consumers/${c_id}/consents/${d_id}/complete"
              payload: { consent_method: "ELECTRONIC", consent_scope: "SHARE_PII_WITH_LENDER", expected_consumer_version: "${cb_v}" }
              as: Consumer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /credit/referrals"
              payload: { external_referral_ref: "NS-L-9001", channel: "WEB", offer_id: "${o_id}" }
              as: LenderOps
              captures: { r_id: $.data.id }
            - call: "POST /credit/referrals/${r_id}/fund"
              payload: { funded_amount_cents: 900000 }
              as: LenderOps
          assert:
            - "the decision captured ${d_odds} equals 0.91 — identical bureau data, provisional variant"
            - "PreQualificationDecision.${d_id}.modeled_odds_settled == false before the funding"
            - "after POST /credit/referrals/${r_id}/fund, PreQualificationDecision.${d_id}.modeled_odds_settled == true"
            - "after POST /credit/referrals/${r_id}/fund, PreQualificationDecision.${d_id}.modeled_odds_pct == 100"
            - "PreQualificationDecision.${d_id}.decision_status == CONSUMED"

      - name: revenue_gross_then_net_versus_gross_only
        grounds:
          - calculations.compute_revenue_recognition_amount
          - entities.Referral.fields.clawback_rate_bps
          - entities.RevenueRecognitionEntry.fields.realized_amount_cents
        distinguishing_aspect: "One referral funded for 900000 cents recognizes 90000 cents while it stays FUNDED and 45000 cents once it is REVERSED inside the clawback window, because clawback_rate_bps 500 removes a second, differently-sized conserved quantity from the same money metric."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Consumer P consented on a program carrying revenue_share_bps 1000 and clawback_rate_bps 500 with a 90-day clawback window."
            - "One referral on that consent, funded the same day, not yet reversed."
          setup_api_calls:
            - *k_clock
            - *k_consumer_p
            - *k_consent_p
            - *k_resync_a
            - *k_snapshot_p
            - *k_tier_good
            - *k_tier_act
            - *k_item_loan
            - *k_item_act
            - *k_lender
            - *k_lender_act
            - *k_program_loan
            - *k_program_act
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "UTILIZATION_PCT", operator: "LTE", criterion_value: "50", is_hard_requirement: true }
              as: LenderOps
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "DTI_PCT", operator: "LTE", criterion_value: "30", is_hard_requirement: false }
              as: LenderOps
            - *k_prequal_p
            - *k_qualify
            - *k_content_facet
            - *k_facet_accuracy
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "seed-facet-rollup-2" }
              as: PlatformAdmin
            - *k_present
            - call: "POST /credit/offers/${o_id}/render"
              payload: {}
              as: Consumer
              as_user_id: "${c_id}"
            - *k_resync_b
            - *k_consent_record
            - call: "POST /credit/referrals"
              payload: { external_referral_ref: "NS-L-9002", channel: "WEB", offer_id: "${o_id}" }
              as: LenderOps
              captures: { ra_id: $.data.id }
            - call: "POST /credit/referrals/${ra_id}/fund"
              payload: { funded_amount_cents: 900000 }
              as: LenderOps
            - call: "POST /credit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /credit/referrals/${ra_id}/reverse"
              payload: { reason_code: "LENDER_RETURNED_FUNDS" }
              as: ComplianceOfficer
          assert:
            - "before the reversal the referral's single REVENUE entry has realized_amount_cents == 90000, the gross_only variant"
            - "Referral.${ra_id}.status == REVERSED and reversed_at == 2026-09-10T00:00:00Z"
            - "the CLAWBACK entry created by the reversal has realized_amount_cents == -45000"
            - "after the reversal the sum of realized_amount_cents for ${ra_id} == 45000, the gross_then_net variant"
            - "90000 - 45000 == 45000, so the compensable amount consumed exactly clawback_rate_bps of the funded principal"
            - "the reversal lands 9 days after funded_at, inside the program's 90-day clawback window"

      - name: calibration_index_including_provisional_versus_settled_only
        grounds:
          - calculations.compute_calibration_index
          - entities.ProductCatalogItem.fields.approval_odds_calibration_index
          - endpoints.GET_/credit/catalog/items/{item_id}/settled-index
        distinguishing_aspect: "The same two realized decisions yield approval_odds_calibration_index 1.82 through the provisional-inclusive read and 0.91 through the settled-only read, so the two variants sit on opposite sides of 1.0 for identical decision rows."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two decisions on the same loan catalog item, both modeled at 0.91, one funded and one declined."
          setup_api_calls:
            - *k_clock
            - *k_consumer_p
            - *k_consent_p
            - *k_resync_a
            - *k_snapshot_p
            - *k_tier_good
            - *k_tier_act
            - *k_item_loan
            - *k_item_act
            - *k_lender
            - *k_lender_act
            - *k_program_loan
            - *k_program_act
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "UTILIZATION_PCT", operator: "LTE", criterion_value: "50", is_hard_requirement: true }
              as: LenderOps
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "DTI_PCT", operator: "LTE", criterion_value: "30", is_hard_requirement: false }
              as: LenderOps
            - *k_prequal_p
            - *k_qualify
            - *k_content_facet
            - *k_facet_accuracy
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "seed-facet-rollup-3" }
              as: PlatformAdmin
            - *k_present
            - call: "POST /credit/offers/${o_id}/render"
              payload: {}
              as: Consumer
              as_user_id: "${c_id}"
            - *k_resync_b
            - *k_consent_record
            - call: "POST /credit/referrals"
              payload: { external_referral_ref: "NS-L-9004", channel: "WEB", offer_id: "${o_id}" }
              as: LenderOps
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /credit/referrals/${r1_id}/fund"
              payload: { funded_amount_cents: 900000 }
              as: LenderOps
          assert:
            - "Referral.${r1_id}.status == FUNDED"
            - "after the funding the catalog item's approval_odds_calibration_index read with variant including_provisional == 1.82"
            - "mean_odds == 0.9100 and realized_rate == 0.5000 for the provisional-inclusive read"
            - "the settled-only read at GET /credit/catalog/items/${item_id}/settled-index reports approval_odds_calibration_index == 1.82 only when both decisions are settled"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: odds_weighted_penalty_branch_and_clamp
        grounds:
          - calculations.compute_modeled_approval_odds
          - entities.TargetingCriterion.fields.is_hard_requirement
          - validations[priority=6]
        distinguishing_aspect: "Mode (a): three consumers against one program land on 0.80, 0.85 and 0.99 because the utilization penalty is a strict-inequality continuous branch and the ODDS_MAX clamp is reached before the cap — the modeled odds are not a monotone step function of utilization."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Three consumers P (util 40.00), R (util 30.00) and S (util 200.00), all scoring 660, against a program whose criteria are a hard SCORE GTE 640 and a soft DTI_PCT LTE 40."
          setup_api_calls:
            - *k_clock
            - *k_consumer_p
            - *k_consent_p
            - *k_resync_a
            - *k_snapshot_p
            - call: "POST /credit/consumers"
              payload: { full_name: "Rae Okafor", email: "rae@x.com", state_code: "CA", bureau_pin: "7712", dti_pct: 35.0 }
              as: Consumer
              captures: { r_id: $.data.id }
            - call: "POST /credit/consumers/${r_id}/monitoring-consent"
              payload: {}
              as: Consumer
              as_user_id: "${r_id}"
            - call: "GET /credit/consumers/${r_id}"
              payload: {}
              as: Consumer
              as_user_id: "${r_id}"
              captures: { ra_v: $.data.version }
            - call: "POST /credit/consumers/${r_id}/bureau-snapshots"
              payload: { score: 660, added_account_count: 1, total_revolving_balance_cents: 360000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${ra_v}" }
              as: BureauConnector
            - call: "POST /credit/consumers"
              payload: { full_name: "Sam Iyer", email: "sam@x.com", state_code: "CA", bureau_pin: "3390", dti_pct: 35.0 }
              as: Consumer
              captures: { s2_id: $.data.id }
            - call: "POST /credit/consumers/${s2_id}/monitoring-consent"
              payload: {}
              as: Consumer
              as_user_id: "${s2_id}"
            - call: "GET /credit/consumers/${s2_id}"
              payload: {}
              as: Consumer
              as_user_id: "${s2_id}"
              captures: { sa_v: $.data.version }
            - call: "POST /credit/consumers/${s2_id}/bureau-snapshots"
              payload: { score: 660, added_account_count: 1, total_revolving_balance_cents: 2400000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${sa_v}" }
              as: BureauConnector
            - *k_tier_good
            - *k_tier_act
            - *k_item_loan
            - *k_item_act
            - *k_lender
            - *k_lender_act
            - *k_program_loan
            - *k_program_act
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "SCORE", operator: "GTE", criterion_value: "640", is_hard_requirement: true }
              as: LenderOps
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "DTI_PCT", operator: "LTE", criterion_value: "30", is_hard_requirement: false }
              as: LenderOps
          trigger:
            - call: "POST /credit/consumers/${c_id}/pre-qualifications"
              payload: { lender_program_id: "${prog_id}" }
              as: Consumer
              as_user_id: "${c_id}"
              captures: { d_p: $.data.modeled_odds_pct }
            - call: "POST /credit/consumers/${r_id}/pre-qualifications"
              payload: { lender_program_id: "${prog_id}" }
              as: Consumer
              as_user_id: "${r_id}"
              captures: { d_r: $.data.modeled_odds_pct }
            - call: "POST /credit/consumers/${s2_id}/pre-qualifications"
              payload: { lender_program_id: "${prog_id}" }
              as: Consumer
              as_user_id: "${s2_id}"
              captures: { d_s: $.data.modeled_odds_pct }
          assert:
            - "Decision on ${c_id}: modeled_odds_pct == 0.85 (util 40.00 > 30.00, one free decile of penalty)"
            - "Decision on ${r_id}: modeled_odds_pct == 0.80 (util exactly 30.00, strict inequality gives no penalty)"
            - "Decision on ${s2_id}: modeled_odds_pct == 0.99 (raw 1.75 clamped by ODDS_MAX)"

      - name: simulation_recursive_floor_term
        grounds:
          - calculations.simulate_score_delta
          - calculations.score_tier_lookup
          - calculations.governance_thresholds
        distinguishing_aspect: "Mode (b): the terminal utilization term floors U/10 before subtracting, so a util-25.00 consumer paying down 72000 cents projects 682 and not the 683 that summing the raw deciles would give; the same endpoint also saturates at SCORE_MIN 300."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Consumer V scoring 680 at util 25.00 (balance 300000 of limit 1200000) and consumer W scoring 303 at util 40.00, each with an ACTIVE snapshot."
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/consumers"
              payload: { full_name: "Vera Lund", email: "vera@x.com", state_code: "CA", bureau_pin: "5510", dti_pct: 20.0 }
              as: Consumer
              captures: { v_id: $.data.id }
            - call: "POST /credit/consumers/${v_id}/monitoring-consent"
              payload: {}
              as: Consumer
              as_user_id: "${v_id}"
            - call: "GET /credit/consumers/${v_id}"
              payload: {}
              as: Consumer
              as_user_id: "${v_id}"
              captures: { va_v: $.data.version }
            - call: "POST /credit/consumers/${v_id}/bureau-snapshots"
              payload: { score: 680, added_account_count: 1, total_revolving_balance_cents: 300000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${va_v}" }
              as: BureauConnector
            - call: "POST /credit/consumers"
              payload: { full_name: "Wes Ndiaye", email: "wes@x.com", state_code: "CA", bureau_pin: "8802", dti_pct: 20.0 }
              as: Consumer
              captures: { w_id: $.data.id }
            - call: "POST /credit/consumers/${w_id}/monitoring-consent"
              payload: {}
              as: Consumer
              as_user_id: "${w_id}"
            - call: "GET /credit/consumers/${w_id}"
              payload: {}
              as: Consumer
              as_user_id: "${w_id}"
              captures: { wa_v: $.data.version }
            - call: "POST /credit/consumers/${w_id}/bureau-snapshots"
              payload: { score: 303, added_account_count: 1, total_revolving_balance_cents: 480000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${wa_v}" }
              as: BureauConnector
            - *k_tier_good
            - *k_tier_act
          trigger:
            - call: "POST /credit/consumers/${v_id}/simulations"
              payload: { actions: [{ action_code: "PAY_DOWN_REVOLVING", amount_cents: 72000 }], expected_consumer_version: "${va_v}" }
              as: Consumer
              as_user_id: "${v_id}"
            - call: "POST /credit/consumers/${w_id}/simulations"
              payload: { actions: [{ action_code: "PAY_DOWN_REVOLVING", amount_cents: 300000 }], expected_consumer_version: "${wa_v}" }
              as: Consumer
              as_user_id: "${w_id}"
          assert:
            - "the simulation for ${v_id} reports projected_score == 682 — floor(19/10) - floor(25/10) == -1 decile, not the -0 deciles a raw-decile reading gives"
            - "the simulation for ${v_id} reports delta_points == 2 and base_utilization_pct == 25.00"
            - "the raw-decile misreading would report 683, so the two readings differ by exactly one point"
            - "the simulation for ${w_id} reports projected_score == 300, saturated at SCORE_MIN"
            - "the simulation for ${w_id} reports delta_points == -3 before saturation would have been -2"

      - name: calibration_index_zero_success_guard_and_null_branch
        grounds:
          - calculations.compute_calibration_index
          - endpoints.GET_/credit/catalog/items/{item_id}
          - entities.ProductCatalogItem.fields.status
        distinguishing_aspect: "Mode (c): with one declined decision and zero successes the quotient is guarded and reports null rather than 0.0 or 1.0, so approval_odds_calibration_index is well-defined only after the inclusion set is filtered and the zero-success branch is applied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two decisions on the loan item: one declined, one left ELIGIBLE."
            - "A third decision on the same item advanced to EXPIRED by moving the clock 31 days past its fresh_until and running the daily operations job."
          setup_api_calls:
            - *k_clock
            - *k_consumer_p
            - *k_consent_p
            - *k_resync_a
            - *k_snapshot_p
            - *k_tier_good
            - *k_tier_act
            - *k_item_loan
            - *k_item_act
            - *k_lender
            - *k_lender_act
            - *k_program_loan
            - *k_program_act
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "UTILIZATION_PCT", operator: "LTE", criterion_value: "50", is_hard_requirement: true }
              as: LenderOps
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "DTI_PCT", operator: "LTE", criterion_value: "30", is_hard_requirement: false }
              as: LenderOps
            - *k_prequal_p
            - *k_qualify
            - *k_content_facet
            - *k_facet_accuracy
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "seed-facet-rollup-4" }
              as: PlatformAdmin
            - *k_present
            - call: "POST /credit/offers/${o_id}/render"
              payload: {}
              as: Consumer
              as_user_id: "${c_id}"
            - *k_resync_b
            - *k_consent_record
            - call: "POST /credit/referrals"
              payload: { external_referral_ref: "NS-L-9005", channel: "WEB", offer_id: "${o_id}" }
              as: LenderOps
              captures: { r2_id: $.data.id }
            - call: "POST /credit/referrals/${r2_id}/decline"
              payload: {}
              as: LenderOps
          trigger:
            - call: "GET /credit/catalog/items/${item_id}"
              payload: {}
              as: ComplianceOfficer
