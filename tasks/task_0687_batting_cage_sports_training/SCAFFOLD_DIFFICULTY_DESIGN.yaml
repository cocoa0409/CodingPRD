  - rule_id: priority_pair_validation_conflict
    instances:
      - name: waiver_required_beats_insufficient_funds
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - errors[ERR_WAIVER_REQUIRED]
          - errors[ERR_INSUFFICIENT_FUNDS]
        distinguishing_aspect: |
          A single confirm request that violates both business_safety (no waiver, priority 6)
          and business_fiscal (zero tokens, priority 13) returns ERR_WAIVER_REQUIRED, not
          ERR_INSUFFICIENT_FUNDS — safety category outranks fiscal. (Pair: business_safety vs business_fiscal.)
        test_recipe:
          setup:
            - "Facility default; lane; member tier NONE with NO waiver and 0 tokens."
            - "REQUESTED OPEN_SLOT TOKEN booking that would cost 8 tokens."
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "F9", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: "CAGE", buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id, lane_ver: $.data.version }
            - call: "POST /v1/members"
              payload: { full_name: "Tom", tier: "NONE", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", kind: "OPEN_SLOT", pay_mode: "TOKEN", start_utc: "2026-04-02T09:00:00Z", end_utc: "2026-04-02T10:00:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /v1/bookings/${bk_id}/confirm"
              payload: { expected_lane_version: "${lane_ver}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_WAIVER_REQUIRED"

      - name: invalid_state_beats_lane_time_conflict
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_LANE_TIME_CONFLICT]
        distinguishing_aspect: |
          Re-confirming an already-CONFIRMED booking that ALSO now overlaps a freshly
          CONFIRMED neighbour returns ERR_INVALID_STATE (state, priority 5), not
          ERR_LANE_TIME_CONFLICT (business_temporal, priority 10) — state precondition
          outranks temporal. (Pair: state vs business_temporal.)
        test_recipe:
          setup:
            - "Facility default; lane buffer 0; member waiver SIGNED wallet 100 tokens."
            - "Booking A CONFIRMED on 09:00–10:00. Booking B CONFIRMED on 11:00–12:00 (non-overlapping)."
            - "Re-confirm of A is attempted while A is already CONFIRMED."
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "F10", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: "CAGE", buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id, lane_ver0: $.data.version }
            - call: "POST /v1/members"
              payload: { full_name: "Uma", tier: "NONE", facility_id: "${fac_id}" }
