      - name: polymer_buckets_walk_available_reserved_consumed_and_scrapped
        claim_type: aggregation
        grounds:
          - calculations.polymer_mass_conservation
          - state_machines.PolymerLot.AVAILABLE_to_DEPLETED
          - state_machines.PolymerLot.DEPLETED_to_AVAILABLE
        distinguishing_aspect: |
          One 5000.000 kg lot walked through four movements: two draws take available_kg to exactly
          0.000 and flip the lot DEPLETED; scrapping the QUEUED batch returns 3000.000 kg and flips
          it back to AVAILABLE; extruding then scrapping the other batch moves 2000.000 kg from
          reserved to consumed to scrapped. The conservation identity holds after every step and no
          bucket ever goes negative.
        test_recipe:
          setup:
            - "PolymerLot PL-N66-01 with received_kg 5000.000 and melt_flow_index 18.0."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
          trigger:
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-A", polymer_lot_id: "${pl}", input_kg: 2000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fba: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-B", polymer_lot_id: "${pl}", input_kg: 3000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fbb: $.data.id }
            - call: "GET /mill/polymer-lots/${pl}"
              payload: {}
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fbb}/disposition"
              payload: { disposition: "SCRAP" }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fba}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fba}/disposition"
              payload: { disposition: "SCRAP" }
              as: ExtrusionOperator
            - call: "GET /mill/polymer-lots/${pl}"
              payload: {}
              as: ExtrusionOperator
          assert:
            - "after both creations, PolymerLot.${pl}.available_kg == 0.000 and reserved_kg == 5000.000 and status == DEPLETED"
            - "after the FB-B scrap, PolymerLot.${pl}.available_kg == 3000.000 and reserved_kg == 2000.000 and scrapped_kg == 0.000 and status == AVAILABLE"
            - "after the FB-A extrude, PolymerLot.${pl}.reserved_kg == 0.000 and consumed_kg == 2000.000 and available_kg == 3000.000"
            - "after the FB-A scrap, PolymerLot.${pl}.consumed_kg == 0.000 and scrapped_kg == 2000.000 and available_kg == 3000.000"
            - "on the final GET, available_kg + reserved_kg + consumed_kg + scrapped_kg == 5000.000"
            - "FiberBatch.${fba}.status == SCRAPPED and FiberBatch.${fbb}.status == SCRAPPED"
            - "PolymerLot.${pl}.status == AVAILABLE"

