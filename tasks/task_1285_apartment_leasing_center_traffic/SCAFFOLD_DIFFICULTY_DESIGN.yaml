            - call: "POST /leasing/applications/${app_id}/decide"
              payload: { decision: "APPROVED" }
              as: PropertyManager
              captures: { app_v: $.data.version }
            - call: "POST /leasing/leases"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v}" }
              as: PropertyManager
              captures: { l_id: $.data.id }
            - call: "POST /leasing/leases/${l_id}/sign"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
            - call: "POST /leasing/leases/${l_id}/countersign"
              payload: {}
              as: PropertyManager
            - call: "POST /leasing/waitlist-entries"
