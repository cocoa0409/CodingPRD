  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: lot_release_requires_run_release_eligible
        grounds:
          - validations[priority=46]
          - errors.ERR_RUN_NOT_RELEASE_ELIGIBLE
          - state_machines.MilkLot.HOLD_to_RELEASED
          - state_machines.PasteurizationRun.COMPLETED_to_COMPLETED
          - entities.PasteurizationRun.fields.release_eligibility
          - entities.MilkLot.fields.release_status
        distinguishing_aspect: |
          Entity pair MilkLot -> PasteurizationRun: whether a lot may leave HOLD depends on a
          field of a DIFFERENT entity (its run's release_eligibility, itself derived from
          thermal_status AND culture_status). The lot's own row is byte-identical before and
          after the culture is recorded, yet the same release request goes from
          ERR_RUN_NOT_RELEASE_ELIGIBLE (409) to 200 — proof the gate reads the parent run and
          not the lot.
        test_recipe:
          setup:
            - "Logical clock is 2026-08-10T10:05:00Z."
            - "Run PAST-01 is BOTTLED with thermal_status PASSED, culture_status NOT_COLLECTED and release_eligibility BLOCKED."
            - "Lot 20260810-001-01 is on HOLD with 2100 ml available."
