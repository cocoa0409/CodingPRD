              as: Underwriter
              as_user_id: "uw-15"
              captures: { sm_to_2_id: "$.data.id" }
            - call: "POST /income-worksheets/${ws_to_id}/statement-months"
              payload: { period_start_date: "2026-05-15T00:00:00Z", period_end_date: "2026-06-15T00:00:00Z", deposits_total_cents: 9000000 }
              as: Underwriter
              as_user_id: "uw-15"
            - call: "POST /income-worksheets/${ws_to_id}/statement-months"
