scenario: |
  Generate task harder than expert level!

  2569. Earnings Disclosure Committee Process (public company disclosure committee): reporting calendar with close, review and filing milestones tied to filing deadlines, disclosure committee charter with membership across finance, legal, operations and investor relations, sub-certification collection from business and functional leaders supporting officer certifications, draft earnings release and filing review with data tie-out to underlying records, non-financial measure reconciliation and prominence requirements, material event assessment for current report triggers between periods, script and question preparation for the earnings call with forward-looking statement safe harbor language, post-filing corrections, restatement evaluation and control deficiency assessment
domain_name: earnings-disclosure-committee-process
api_prefix: "/disclosure"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 200, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # graph: two self-referential edges (DisclosureCommitteeCharter.superseded_by_charter_id,
  # Filing.amends_filing_id) plus cross-aggregate edges from MaterialEvent and Filing into
  # DraftDocument, so the entity graph is not a tree and reverse traversal is required.

  state_machine_shape: parallel
  # ReportingCycle carries two independent state axes on the same row (`status` workflow axis and
  # `restatement_stage` remediation axis); DraftDocument is cyclic
  # (IN_REVIEW -> CHANGES_REQUESTED -> IN_REVIEW with revision_round increments);
  # SubCertificationRequest and MaterialEvent are branching with divergent side-effect sets.

  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic_free

  role_model: segregation_of_duties
  # Three named segregation rules: tie-out preparer may not review own item; document author may
  # not approve own document; a certifying officer may not hold a sub-certification on the cycle
  # whose officer certification they sign.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 52 endpoints (25 GET, 27 mutation) / 57 error codes /
  # 16 calculations (2 dual-variant, 3 combinatorial) / 45 ordered validations /
  # 13 state machines declared as 15 axes (ReportingCycle carries two parallel axes) /
  # 2 OCC rules / 7 roles.

# =====================================================================
# 1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: DisclosureCommitteeCharter
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: charter title
        constraints: non-empty, max 160 chars
      - name: version_label
        type: string
        source: input
        description: human-readable charter version, e.g. "v3.1"
        constraints: non-empty, max 40 chars
      - name: min_quorum_count
        type: integer
        source: input
        description: minimum number of ACTIVE voting members required before the charter can gate a cycle
        constraints: ">= 1 and <= 12"
      - name: required_functions
        type: array
        source: input
        description: list of functions that must each be covered by at least one ACTIVE member
        constraints: "non-empty; distinct members of {FINANCE, LEGAL, OPERATIONS, INVESTOR_RELATIONS}"
      - name: status
        type: enum
        source: system
        description: charter lifecycle state
        default: DRAFT
        constraints: "DRAFT | ADOPTED | SUPERSEDED"
      - name: superseded_by_charter_id
        type: string
        source: system
        description: "FK -> DisclosureCommitteeCharter.id; self-referential successor edge, null until this charter is superseded"
        default: null
      - name: adopted_at_utc
        type: datetime
        source: system
        description: logical-clock instant at which the charter moved DRAFT -> ADOPTED
        default: null
      - name: active_voting_member_count
        type: integer
        source: computed
        description: count of CommitteeMember rows with charter_id == this.id AND status == ACTIVE AND voting == true
      - name: covered_functions
        type: array
        source: computed
        description: distinct `function` values of CommitteeMember rows with charter_id == this.id AND status == ACTIVE, sorted ascending alphabetically

  - name: CommitteeMember
    parent: DisclosureCommitteeCharter
    common_fields: true
    fields:
      - name: charter_id
        type: string
        source: input
        description: "FK -> DisclosureCommitteeCharter.id; membership is charter-scoped"
      - name: full_name
        type: string
        source: input
        description: member display name
        constraints: non-empty, max 120 chars
      - name: function
        type: enum
        source: input
        description: functional area the member represents on the committee
        constraints: "FINANCE | LEGAL | OPERATIONS | INVESTOR_RELATIONS"
      - name: is_officer
        type: boolean
        source: input
        description: true when the member is a corporate officer eligible to sign officer certifications
        default: false
      - name: voting
        type: boolean
        source: input
        description: true when the member counts toward charter quorum
        default: true
      - name: status
        type: enum
        source: system
        description: seat state; only ACTIVE members may act through an entity_backed role
        default: ACTIVE
        constraints: "ACTIVE | RECUSED | VACATED"

  - name: ReportingCycle
    parent: null
    common_fields: true
    fields:
      - name: fiscal_period_label
        type: string
        source: input
        description: reporting period label, e.g. "FY2026-Q2"
        constraints: non-empty, max 40 chars
      - name: form_type
        type: enum
        source: input
        description: periodic report form the cycle produces
        constraints: "FORM_10Q | FORM_10K"
      - name: period_end_date
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) on which the reporting period ends
        constraints: valid ISO date
      - name: filer_status
        type: enum
        source: input
        description: registrant filer category driving the statutory deadline day count
        constraints: "LARGE_ACCELERATED | ACCELERATED | NON_ACCELERATED"
      - name: materiality_base_amount
        type: number
        source: input
        description: pretax income base used as the denominator for material-event severity scoring
        constraints: "> 0"
      - name: internal_buffer_days
        type: integer
        source: input
        description: calendar days subtracted from statutory_deadline_utc to derive internal_target_utc
        default: 5
        constraints: ">= 0 and <= 30"
      - name: charter_id
        type: string
        source: input
        description: "FK -> DisclosureCommitteeCharter.id; the charter version pinned to this cycle at creation and never re-pointed"
      - name: statutory_deadline_utc
        type: datetime
        source: computed
        description: filing deadline per calculations.statutory_deadline_resolution
      - name: internal_target_utc
        type: datetime
        source: computed
        description: internal target instant per calculations.statutory_deadline_resolution
      - name: status
        type: enum
        source: system
        description: workflow axis of the cycle (independent of restatement_stage)
        default: PLANNING
        constraints: "PLANNING | CLOSE_OPEN | REVIEW_OPEN | CERTIFICATION_OPEN | FILING_READY | FILED | AMENDED | ABANDONED"
      - name: restatement_stage
        type: enum
        source: system
        description: remediation axis of the cycle, evolving independently of status
        default: NONE
        constraints: "NONE | UNDER_EVALUATION | RESTATEMENT_DECLARED | REMEDIATED"
      - name: min_slack_days_calendar
        type: integer
        source: computed
        description: CALENDAR_DAY variant of calculations.cycle_milestone_slack
      - name: min_slack_days_business
        type: integer
        source: computed
        description: BUSINESS_DAY variant of calculations.cycle_milestone_slack; the field of record for the filing-ready gate
      - name: total_assigned_scope_weight
        type: number
        source: computed
        description: conserved quantity per calculations.cycle_total_assigned_scope_weight
      - name: certification_coverage_pct
        type: number
        source: computed
        description: sub-certification coverage per calculations.certification_coverage_pct
      - name: open_material_event_count
        type: integer
        source: computed
        description: "count of MaterialEvent rows with cycle_id == this.id AND assessment_status IN {UNASSESSED, REPORTABLE} — an event that legal has not yet assessed is an open disclosure risk and blocks certification exactly as a REPORTABLE one does"
      - name: unresolved_deficiency_weight
        type: number
        source: computed
        description: conserved quantity per calculations.cycle_unresolved_deficiency_weight

  - name: Milestone
    parent: ReportingCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ReportingCycle.id"
      - name: kind
        type: enum
        source: input
        description: milestone class in the reporting calendar
        constraints: "CLOSE | REVIEW | CERTIFICATION | FILING"
      - name: planned_start_utc
        type: datetime
        source: input
        description: inclusive start of the half-open planned window
      - name: planned_end_utc
        type: datetime
        source: input
        description: exclusive end of the half-open planned window
        constraints: "> planned_start_utc"
      - name: actual_start_utc
        type: datetime
        source: system
        description: logical-clock instant at which the milestone moved PLANNED -> IN_PROGRESS
        default: null
      - name: actual_end_utc
        type: datetime
        source: system
        description: logical-clock instant at which the milestone moved IN_PROGRESS -> COMPLETE
        default: null
      - name: status
        type: enum
        source: system
        description: milestone state
        default: PLANNED
        constraints: "PLANNED | IN_PROGRESS | COMPLETE | BREACHED"
      - name: slack_calendar_days
        type: integer
        source: computed
        description: CALENDAR_DAY slack of this milestone per calculations.cycle_milestone_slack
      - name: slack_business_days
        type: integer
        source: computed
        description: BUSINESS_DAY slack of this milestone per calculations.cycle_milestone_slack

  - name: SubCertificationRequest
    parent: ReportingCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ReportingCycle.id"
      - name: member_id
        type: string
        source: input
        description: "FK -> CommitteeMember.id; the business or functional leader owing the sub-certification"
      - name: scope_area
        type: enum
        source: input
        description: disclosure scope the leader sub-certifies
        constraints: "REVENUE | LEGAL_CONTINGENCY | OPERATIONS | IR_COMMUNICATIONS | IT_CONTROLS"
      - name: due_utc
        type: datetime
        source: input
        description: inclusive deadline instant for submission
      - name: status
        type: enum
        source: system
        description: branching lifecycle; SUBMITTED and EXCEPTION_NOTED are the two divergent outcomes
        default: PENDING
        constraints: "PENDING | SUBMITTED | EXCEPTION_NOTED | WITHDRAWN | VOID"
      - name: exception_severity
        type: enum
        source: system
        description: severity supplied on submission; feeds calculations.subcert_scope_weight
        default: NONE
        constraints: "NONE | LOW | MEDIUM | HIGH"
      - name: exception_note
        type: string
        source: system
        description: free text recorded when exception_severity != NONE
        default: null
      - name: submitted_utc
        type: datetime
        source: system
        description: logical-clock instant of submission
        default: null
      - name: scope_weight
        type: number
        source: computed
        description: weight per calculations.subcert_scope_weight; recomputed on every submission
      - name: prep_window_start_utc
        type: datetime
        source: computed
        description: due_utc minus SUBCERT_PREP_WINDOW_HOURS; the inclusive start of the closed occupancy interval used by calculations.member_concurrent_subcert_load

  - name: OfficerCertification
    parent: ReportingCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ReportingCycle.id"
      - name: officer_member_id
        type: string
        source: input
        description: "FK -> CommitteeMember.id; must be a member with is_officer == true"
      - name: cert_type
        type: enum
        source: input
        description: certification instrument
        constraints: "CEO_302 | CFO_302 | CEO_906 | CFO_906"
      - name: status
        type: enum
        source: system
        description: certification state; BLOCKED <-> ELIGIBLE is a two-way system-driven edge
        default: BLOCKED
        constraints: "BLOCKED | ELIGIBLE | SIGNED | REVOKED | VOID"
      - name: attestation_text
        type: string
        source: system
        description: attestation wording captured at signing
        default: null
      - name: signed_utc
        type: datetime
        source: system
        description: logical-clock instant of signing
        default: null
      - name: coverage_pct_at_signing
        type: number
        source: system
        description: snapshot of ReportingCycle.certification_coverage_pct taken at the moment of signing
        default: null

  - name: DraftDocument
    parent: ReportingCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ReportingCycle.id"
      - name: author_member_id
        type: string
        source: input
        description: "FK -> CommitteeMember.id; the drafting member, excluded from approving this document"
      - name: doc_type
        type: enum
        source: input
        description: document class
        constraints: "EARNINGS_RELEASE | PERIODIC_FILING | CALL_SCRIPT | CURRENT_REPORT"
      - name: title
        type: string
        source: input
        description: document title
        constraints: non-empty, max 200 chars
      - name: safe_harbor_present
        type: boolean
        source: input
        description: true when forward-looking-statement safe harbor language is included
        default: false
      - name: status
        type: enum
        source: system
        description: cyclic review lifecycle
        default: DRAFT
        constraints: "DRAFT | IN_REVIEW | CHANGES_REQUESTED | APPROVED | SUPERSEDED | FILED"
      - name: revision_round
        type: integer
        source: system
        description: increments by 1 on every entry into CHANGES_REQUESTED
        default: 0
      - name: change_note
        type: string
        source: system
        description: reviewer note recorded on the most recent CHANGES_REQUESTED entry
        default: null
      - name: tie_out_status
        type: enum
        source: computed
        description: tie-out gate per calculations.tie_out_variance_and_tolerance_escalation STEP 5
        constraints: "NOT_STARTED | PASSED | FAILED"
      - name: tie_out_total_variance_bp
        type: integer
        source: computed
        description: STEP 2 snapshot sum of raw_variance_bp across non-WAIVED TieOutItem rows on this document
      - name: tie_out_tier_multiplier
        type: number
        source: computed
        description: STEP 3 tier multiplier selected from tie_out_total_variance_bp
      - name: measure_gate_status
        type: enum
        source: computed
        description: adjusted-measure gate per calculations.measure_gate_evaluation
        constraints: "NO_MEASURES | CLEARED | BLOCKED_RECONCILIATION | BLOCKED_PROMINENCE"
      - name: qa_gate_status
        type: enum
        source: computed
        description: BLOCKED when any QandAItem with script_document_id == this.id has risk_tier == HIGH AND status != CLEARED; CLEARED otherwise (including zero items)
        constraints: "CLEARED | BLOCKED"

  - name: TieOutItem
    parent: DraftDocument
    common_fields: true
    fields:
      - name: document_id
        type: string
        source: input
        description: "FK -> DraftDocument.id"
      - name: preparer_member_id
        type: string
        source: input
        description: "FK -> CommitteeMember.id; the member who tied the reported figure to the underlying record"
      - name: reviewer_member_id
        type: string
        source: system
        description: "FK -> CommitteeMember.id; set by the review action, must differ from preparer_member_id"
        default: null
      - name: line_label
        type: string
        source: input
        description: caption of the tied-out line item
        constraints: non-empty, max 120 chars; unique per document across non-WAIVED rows
      - name: reported_value
        type: number
        source: input
        description: value as printed in the draft
      - name: source_record_value
        type: number
        source: input
        description: value read from the underlying accounting record
      - name: tolerance_bp
        type: integer
        source: input
        description: base tolerance in basis points before tier escalation
        constraints: ">= 0 and <= 10000"
      - name: raw_variance_bp
        type: integer
        source: computed
        description: STEP 1 of calculations.tie_out_variance_and_tolerance_escalation
      - name: effective_tolerance_bp
        type: integer
        source: computed
        description: STEP 4 of calculations.tie_out_variance_and_tolerance_escalation
      - name: status
        type: enum
        source: system
        description: tie-out outcome; MATCHED and VARIANCE flip freely as the document tier changes
        default: MATCHED
        constraints: "MATCHED | VARIANCE | WAIVED"
      - name: review_decision
        type: enum
        source: system
        description: decision recorded by the reviewing member
        default: null
        constraints: "ACCEPT | WAIVE"

  - name: AdjustedMeasure
    parent: DraftDocument
    common_fields: true
    fields:
      - name: document_id
        type: string
        source: input
        description: "FK -> DraftDocument.id"
      - name: measure_label
        type: string
        source: input
        description: non-financial / adjusted measure caption, e.g. "Adjusted EBITDA"
        constraints: non-empty, max 120 chars
      - name: adjusted_value
        type: number
        source: input
        description: value of the adjusted measure as presented
      - name: comparable_gaap_value
        type: number
        source: input
        description: value of the most directly comparable reported measure
      - name: reconciliation_items
        type: array
        source: input
        description: "bridging items, each an object with keys `label` (string) and `amount` (number)"
        constraints: may be empty
      - name: adjusted_prominence_index
        type: integer
        source: input
        description: 1-based presentation order index of the adjusted measure (1 == most prominent)
        constraints: ">= 1 and <= 50"
      - name: gaap_prominence_index
        type: integer
        source: input
        description: 1-based presentation order index of the comparable reported measure
        constraints: ">= 1 and <= 50"
      - name: reconciliation_sum
        type: number
        source: computed
        description: sum of reconciliation_items[].amount
      - name: reconciliation_gap
        type: number
        source: computed
        description: per calculations.adjusted_measure_reconciliation
      - name: prominence_ok
        type: boolean
        source: computed
        description: true when gaap_prominence_index <= adjusted_prominence_index
      - name: status
        type: enum
        source: system
        description: reconciliation state, assigned by the reconcile action
        default: DRAFT
        constraints: "DRAFT | RECONCILED | PROMINENCE_FAILED | REJECTED"

  - name: QandAItem
    parent: DraftDocument
    common_fields: true
    fields:
      - name: script_document_id
        type: string
        source: input
        description: "FK -> DraftDocument.id; must reference a document with doc_type == CALL_SCRIPT"
      - name: question_text
        type: string
        source: input
        description: anticipated analyst question
        constraints: non-empty, max 400 chars
      - name: topic
        type: enum
        source: input
        description: question topic
        constraints: "GUIDANCE | MARGIN | LIQUIDITY | LITIGATION | SEGMENT_PERFORMANCE"
      - name: risk_tier
        type: enum
        source: input
        description: disclosure risk tier; HIGH items gate script approval
        constraints: "LOW | MEDIUM | HIGH"
      - name: requires_safe_harbor
        type: boolean
        source: input
        description: true when the prepared answer contains forward-looking statements
        default: false
      - name: status
        type: enum
        source: system
        description: clearance state, seeded at creation from the script's safe_harbor_present
        default: DRAFT
        constraints: "DRAFT | BLOCKED | CLEARED"
      - name: clearance_note
        type: string
        source: system
        description: legal clearance note
        default: null

  - name: MaterialEvent
    parent: ReportingCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ReportingCycle.id"
      - name: linked_document_id
        type: string
        source: system
        description: "FK -> DraftDocument.id; the CURRENT_REPORT document the event was disclosed through, null until disclosure"
        default: null
      - name: category
        type: enum
        source: input
        description: event category
        constraints: "ACQUISITION | DIVESTITURE | DEBT_COVENANT_BREACH | LITIGATION_JUDGMENT | AUDITOR_CHANGE | IMPAIRMENT"
      - name: occurred_utc
        type: datetime
        source: input
        description: instant the event occurred
      - name: discovered_utc
        type: datetime
        source: input
        description: instant the company became aware; drives the current-report business-day count
        constraints: ">= occurred_utc"
      - name: magnitude_amount
        type: number
        source: input
        description: absolute financial magnitude of the event
        constraints: ">= 0"
      - name: description
        type: string
        source: input
        description: event narrative
        constraints: non-empty, max 400 chars
      - name: severity_score
        type: number
        source: computed
        description: per calculations.material_event_severity_and_deadline
      - name: assessment_status
        type: enum
        source: system
        description: branching assessment lifecycle with divergent side-effect sets per branch
        default: UNASSESSED
        constraints: "UNASSESSED | NOT_REPORTABLE | REPORTABLE | DISCLOSED | SUPERSEDED"
      - name: determination_note
        type: string
        source: system
        description: assessor rationale
        default: null
      - name: current_report_deadline_utc
        type: datetime
        source: computed
        description: per calculations.material_event_severity_and_deadline; null while assessment_status IN {UNASSESSED, NOT_REPORTABLE}

  - name: Filing
    parent: ReportingCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ReportingCycle.id"
      - name: document_id
        type: string
        source: input
        description: "FK -> DraftDocument.id; must be an APPROVED PERIODIC_FILING document of the same cycle"
      - name: amends_filing_id
        type: string
        source: input
        description: "FK -> Filing.id; self-referential amendment edge, null for an original filing"
        default: null
      - name: form_type
        type: enum
        source: computed
        description: copied from the cycle's form_type at creation
        constraints: "FORM_10Q | FORM_10K"
      - name: accession_label
        type: string
        source: computed
        description: per calculations.filing_accession_and_lateness
      - name: filed_utc
        type: datetime
        source: system
        description: logical-clock instant at which the filing row was created
      - name: late_flag
        type: boolean
        source: computed
        description: per calculations.filing_accession_and_lateness
      - name: status
        type: enum
        source: system
        description: filing state
        default: SUBMITTED
        constraints: "SUBMITTED | AMENDED_SUPERSEDED"

  - name: PostFilingCorrection
    parent: Filing
    common_fields: true
    fields:
      - name: filing_id
        type: string
        source: input
        description: "FK -> Filing.id"
      - name: description
        type: string
        source: input
        description: nature of the post-filing error
        constraints: non-empty, max 400 chars
      - name: error_amount
        type: number
        source: input
        description: signed misstatement amount in the filed period
      - name: current_period_pretax_income
        type: number
        source: input
        description: ROLLOVER denominator
        constraints: "absolute value > 0"
      - name: prior_period_pretax_income
        type: number
        source: input
        description: IRON_CURTAIN denominator
        constraints: "absolute value > 0"
      - name: cumulative_prior_uncorrected_amount
        type: number
        source: input
        description: accumulated uncorrected misstatements carried into the filed period
        default: 0
      - name: method
        type: enum
        source: system
        description: materiality method selected on assessment
        default: null
        constraints: "ROLLOVER | IRON_CURTAIN"
      - name: materiality_pct
        type: number
        source: computed
        description: per calculations.correction_materiality_classification under the selected method
        default: null
      - name: classification
        type: enum
        source: computed
        description: per calculations.correction_materiality_classification
        default: null
        constraints: "IMMATERIAL | REVISION | RESTATEMENT"
      - name: status
        type: enum
        source: system
        description: correction lifecycle
        default: DRAFT
        constraints: "DRAFT | ASSESSED | RESCINDED | CLOSED"

  - name: ControlDeficiency
    parent: PostFilingCorrection
    common_fields: true
    fields:
      - name: correction_id
        type: string
        source: input
        description: "FK -> PostFilingCorrection.id"
      - name: likelihood_pct
        type: number
        source: system
        description: likelihood input copied from the assessment request that cascaded this row
        constraints: ">= 0 and <= 100"
      - name: magnitude_amount
        type: number
        source: system
        description: magnitude input copied from the assessment request that cascaded this row
        constraints: ">= 0"
      - name: compensating_control_present
        type: boolean
        source: system
        description: compensating-control flag copied from the assessment request
      - name: severity_score
        type: number
        source: computed
        description: per calculations.control_deficiency_severity
      - name: severity
        type: enum
        source: computed
        description: per calculations.control_deficiency_severity
        constraints: "DEFICIENCY | SIGNIFICANT_DEFICIENCY | MATERIAL_WEAKNESS"
      - name: deficiency_weight
        type: number
        source: computed
        description: per calculations.control_deficiency_severity; the conserved risk-point quantity
      - name: status
        type: enum
        source: system
        description: remediation state; REVERSED is reachable only through the compensating rescind cascade
        default: OPEN
        constraints: "OPEN | MITIGATED | REVERSED"
      - name: remediation_note
        type: string
        source: system
        description: remediation narrative recorded on mitigation
        default: null

# =====================================================================
# 1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: DisclosureCommitteeCharter
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /disclosure/charters/{id}/transitions with action=ADOPT"
        actor: DisclosureCommitteeChair
        preconditions:
          - "charter.status == DRAFT"
          - "charter.active_voting_member_count >= charter.min_quorum_count (else ERR_QUORUM_NOT_MET)"
          - "every function in charter.required_functions appears in charter.covered_functions (else ERR_FUNCTION_COVERAGE_GAP)"
        side_effects:
          - "sets charter.adopted_at_utc to the current logical clock"
          - "increments DisclosureCommitteeCharter.version by 1"
      - from: ADOPTED
        to: SUPERSEDED
        trigger: "POST /disclosure/charters/{id}/transitions with action=SUPERSEDE and successor_charter_id"
        actor: DisclosureCommitteeChair
        preconditions:
          - "charter.status == ADOPTED"
          - "successor charter exists, has status == ADOPTED, and successor.id != charter.id (else ERR_SUCCESSOR_CHARTER_INVALID)"
        side_effects:
          - "sets charter.superseded_by_charter_id = successor_charter_id"
          - "does NOT re-point ReportingCycle.charter_id on any cycle: cycles stay pinned to the charter version they were created against"
          - "increments DisclosureCommitteeCharter.version by 1"

  - entity: CommitteeMember
    initial_state: ACTIVE
    terminal_states: [VACATED]
    transitions:
      - from: ACTIVE
        to: RECUSED
        trigger: "POST /disclosure/committee-members/{id}/transitions with action=RECUSE"
        actor: DisclosureCommitteeChair
        preconditions: ["member.status == ACTIVE"]
        side_effects:
          - "recomputes charter.active_voting_member_count and charter.covered_functions on the member's charter"
          - "increments CommitteeMember.version by 1"
      - from: RECUSED
        to: ACTIVE
        trigger: "POST /disclosure/committee-members/{id}/transitions with action=REINSTATE"
        actor: DisclosureCommitteeChair
        preconditions: ["member.status == RECUSED"]
        side_effects:
          - "recomputes charter.active_voting_member_count and charter.covered_functions on the member's charter"
          - "increments CommitteeMember.version by 1"
      - from: ACTIVE
        to: VACATED
        trigger: "POST /disclosure/committee-members/{id}/transitions with action=VACATE"
        actor: DisclosureCommitteeChair
        preconditions: ["member.status == ACTIVE"]
        side_effects:
          - "HOP 2: recomputes charter.active_voting_member_count and charter.covered_functions on the member's charter"
          - "HOP 3 (caused by the seat emptying): every SubCertificationRequest with member_id == member.id and status == PENDING moves PENDING -> VOID; SUBMITTED and EXCEPTION_NOTED rows are left untouched, because work already delivered is not undone by a later vacancy"
          - "HOP 4 (caused by those VOIDs): for every ReportingCycle that lost a row, recomputes cycle.total_assigned_scope_weight and cycle.certification_coverage_pct and increments ReportingCycle.version by 1 — dropping a PENDING row leaves the numerator alone and shrinks the denominator, so coverage RISES"
          - "increments CommitteeMember.version by 1"
      - from: RECUSED
        to: VACATED
        trigger: "POST /disclosure/committee-members/{id}/transitions with action=VACATE"
        actor: DisclosureCommitteeChair
        preconditions: ["member.status == RECUSED"]
        side_effects:
          - "recomputes charter.active_voting_member_count and charter.covered_functions on the member's charter"
          - "the same PENDING -> VOID sub-certification cascade and cycle recomputation as the ACTIVE -> VACATED edge"
          - "increments CommitteeMember.version by 1"

  - entity: ReportingCycle
    initial_state: PLANNING
    terminal_states: [ABANDONED]
    note: |
      AXIS 1 of two independent state dimensions on the same ReportingCycle row. `status` (this axis)
      and `restatement_stage` (see the next machine) evolve independently: a cycle can sit in
      (status=FILED, restatement_stage=RESTATEMENT_DECLARED) or in (status=AMENDED,
      restatement_stage=REMEDIATED). No transition on one axis constrains the other axis's current
      value except where a precondition explicitly names it.
    transitions:
      - from: PLANNING
        to: CLOSE_OPEN
        trigger: "POST /disclosure/reporting-cycles/{id}/transitions with action=OPEN_CLOSE"
        actor: Controller
        preconditions:
          - "cycle.status == PLANNING"
          - "the charter pinned by cycle.charter_id has status == ADOPTED (else ERR_CHARTER_NOT_ADOPTED)"
          - "at least one Milestone with cycle_id == cycle.id and kind == CLOSE exists (else ERR_MILESTONE_MISSING)"
        side_effects:
          - "marks every Milestone on the cycle with status IN {PLANNED, IN_PROGRESS} whose planned_end_utc < current logical clock as BREACHED"
          - "recomputes cycle.min_slack_days_calendar and cycle.min_slack_days_business"
          - "increments ReportingCycle.version by 1"
      - from: CLOSE_OPEN
        to: REVIEW_OPEN
        trigger: "POST /disclosure/reporting-cycles/{id}/transitions with action=OPEN_REVIEW"
        actor: Controller
        preconditions:
          - "cycle.status == CLOSE_OPEN"
          - "every Milestone with cycle_id == cycle.id and kind == CLOSE has status == COMPLETE (else ERR_MILESTONE_INCOMPLETE)"
        side_effects:
          - "marks every Milestone on the cycle with status IN {PLANNED, IN_PROGRESS} whose planned_end_utc < current logical clock as BREACHED"
          - "recomputes cycle.min_slack_days_calendar and cycle.min_slack_days_business"
          - "increments ReportingCycle.version by 1"
      - from: REVIEW_OPEN
        to: CERTIFICATION_OPEN
        trigger: "POST /disclosure/reporting-cycles/{id}/transitions with action=OPEN_CERTIFICATION"
        actor: DisclosureCommitteeChair
        preconditions:
          - "cycle.status == REVIEW_OPEN"
          - "at least one Milestone with cycle_id == cycle.id and kind == REVIEW exists (else ERR_MILESTONE_MISSING)"
          - "every Milestone with cycle_id == cycle.id and kind == REVIEW has status == COMPLETE (else ERR_MILESTONE_INCOMPLETE)"
          - "at least one DraftDocument with cycle_id == cycle.id and doc_type == PERIODIC_FILING has status == APPROVED (else ERR_FILING_DOCUMENT_INVALID)"
        side_effects:
          - "marks every Milestone on the cycle with status IN {PLANNED, IN_PROGRESS} whose planned_end_utc < current logical clock as BREACHED"
          - "recomputes cycle.min_slack_days_calendar and cycle.min_slack_days_business"
          - "every OfficerCertification on the cycle with status == BLOCKED and cycle.open_material_event_count == 0 moves BLOCKED -> ELIGIBLE"
          - "every OfficerCertification on the cycle with status == REVOKED moves REVOKED -> BLOCKED"
          - "recomputes cycle.certification_coverage_pct"
          - "increments ReportingCycle.version by 1"
      - from: CERTIFICATION_OPEN
        to: FILING_READY
        trigger: "POST /disclosure/reporting-cycles/{id}/transitions with action=DECLARE_FILING_READY"
        actor: DisclosureCommitteeChair
        preconditions:
          - "cycle.status == CERTIFICATION_OPEN"
          - "an OfficerCertification with cert_type == CEO_302 and status == SIGNED exists on the cycle AND one with cert_type == CFO_302 and status == SIGNED exists (else ERR_CERTIFICATIONS_INCOMPLETE)"
          - "cycle.open_material_event_count == 0 (else ERR_OPEN_MATERIAL_EVENT)"
          - "cycle.min_slack_days_business >= REQUIRED_FILING_SLACK_BUSINESS_DAYS (else ERR_MILESTONE_SLACK_EXHAUSTED)"
          - "cycle.unresolved_deficiency_weight == 0.00 (else ERR_DEFICIENCY_OPEN)"
        side_effects:
          - "marks every Milestone on the cycle with status IN {PLANNED, IN_PROGRESS} whose planned_end_utc < current logical clock as BREACHED"
          - "increments ReportingCycle.version by 1"
      - from: FILING_READY
        to: REVIEW_OPEN
        trigger: "system: a PERIODIC_FILING DraftDocument of this cycle leaves APPROVED (HOP 4 of the tie-out cascade)"
        actor: system
        preconditions:
          - "cycle.status == FILING_READY"
          - "the document leaving APPROVED has doc_type == PERIODIC_FILING and cycle_id == cycle.id"
        side_effects:
          - "HOP 5 (caused by this cycle leaving FILING_READY): every OfficerCertification on the cycle with status IN {ELIGIBLE, SIGNED} moves to REVOKED, clearing signed_utc and attestation_text"
          - "recomputes cycle.certification_coverage_pct"
          - "increments ReportingCycle.version by 1"
      - from: FILING_READY
        to: FILED
        trigger: "POST /disclosure/filings (an original Filing with amends_filing_id == null)"
        actor: ComplianceAdmin
        preconditions: ["cycle.status == FILING_READY"]
        side_effects:
          - "the referenced DraftDocument moves APPROVED -> FILED"
          - "increments ReportingCycle.version by 1"
      - from: FILED
        to: AMENDED
        trigger: "POST /disclosure/filings (an amending Filing with amends_filing_id set)"
        actor: ComplianceAdmin
        preconditions:
          - "cycle.status == FILED"
          - "the amended Filing has status == SUBMITTED and cycle_id == cycle.id (else ERR_AMENDMENT_TARGET_INVALID)"
          - "cycle.unresolved_deficiency_weight == 0.00 (else ERR_DEFICIENCY_OPEN)"
        side_effects:
          - "the amended Filing moves SUBMITTED -> AMENDED_SUPERSEDED"
          - "increments ReportingCycle.version by 1"
      - from: AMENDED
        to: AMENDED
        trigger: "POST /disclosure/filings (a further amending Filing with amends_filing_id set — Amendment No. 2 and beyond)"
        actor: ComplianceAdmin
        preconditions:
          - "cycle.status == AMENDED"
          - "the amended Filing has status == SUBMITTED and cycle_id == cycle.id (else ERR_AMENDMENT_TARGET_INVALID) — note that the ORIGINAL filing is already AMENDED_SUPERSEDED by now, so a second amendment must point at the most recent SUBMITTED filing and not back at the original"
          - "cycle.unresolved_deficiency_weight == 0.00 (else ERR_DEFICIENCY_OPEN)"
        side_effects:
          - "the amended Filing moves SUBMITTED -> AMENDED_SUPERSEDED"
          - "the cycle's status is unchanged at AMENDED, but its version still increments"
          - "increments ReportingCycle.version by 1"
        note: "a self-edge, so successive amendments are legal; the accession suffix keeps climbing through calculations.filing_accession_and_lateness because prior_count counts every Filing row of the cycle regardless of status"
      - from: PLANNING
        to: ABANDONED
        trigger: "POST /disclosure/reporting-cycles/{id}/transitions with action=ABANDON"
        actor: DisclosureCommitteeChair
        preconditions: ["cycle.status IN {PLANNING, CLOSE_OPEN, REVIEW_OPEN, CERTIFICATION_OPEN, FILING_READY}"]
        side_effects:
          - "every SubCertificationRequest on the cycle with status IN {PENDING, SUBMITTED, EXCEPTION_NOTED} moves to VOID"
          - "every OfficerCertification on the cycle with status IN {BLOCKED, ELIGIBLE, SIGNED, REVOKED} moves to VOID"
          - "every DraftDocument on the cycle with status IN {DRAFT, IN_REVIEW, CHANGES_REQUESTED, APPROVED} moves to SUPERSEDED"
          - "every MaterialEvent on the cycle with assessment_status IN {UNASSESSED, NOT_REPORTABLE, REPORTABLE} moves to SUPERSEDED, and cycle.open_material_event_count recomputes to 0"
          - "recomputes cycle.total_assigned_scope_weight (falls to 0.00) and cycle.certification_coverage_pct (falls to 0.00)"
          - "increments ReportingCycle.version by 1"
        note: "the same ABANDON action is legal from CLOSE_OPEN, REVIEW_OPEN, CERTIFICATION_OPEN and FILING_READY with identical side effects; ABANDON from FILED or AMENDED is rejected with ERR_INVALID_STATE"

  - entity: ReportingCycle
    initial_state: NONE
    terminal_states: []
    note: |
      AXIS 2 of the same ReportingCycle row: `restatement_stage`. Driven exclusively by
      PostFilingCorrection and ControlDeficiency activity, never by the `status` axis. Field
      name under test is restatement_stage; the `status` axis above is untouched by these edges.
    transitions:
      - from: NONE
        to: UNDER_EVALUATION
        trigger: "POST /disclosure/filings/{id}/corrections"
        actor: ComplianceAdmin
        preconditions: ["cycle.restatement_stage == NONE"]
        side_effects: ["increments ReportingCycle.version by 1"]
      - from: UNDER_EVALUATION
        to: RESTATEMENT_DECLARED
        trigger: "system: HOP 4 of the correction-assessment cascade, caused by cycle.unresolved_deficiency_weight rising above 0.00 while a correction on the cycle carries classification == RESTATEMENT"
        actor: system
        preconditions:
          - "cycle.restatement_stage == UNDER_EVALUATION"
          - "cycle.unresolved_deficiency_weight > 0.00"
        side_effects: ["increments ReportingCycle.version by 1"]
      - from: RESTATEMENT_DECLARED
        to: NONE
        trigger: "system: HOP 4 of the rescind compensation, caused by cycle.unresolved_deficiency_weight returning to 0.00 with no ASSESSED correction remaining on the cycle"
        actor: system
        preconditions:
          - "cycle.restatement_stage == RESTATEMENT_DECLARED"
          - "cycle.unresolved_deficiency_weight == 0.00"
          - "no PostFilingCorrection on the cycle has status == ASSESSED"
        side_effects: ["increments ReportingCycle.version by 1"]
      - from: UNDER_EVALUATION
        to: NONE
        trigger: "system: the last ASSESSED correction on the cycle is rescinded while restatement_stage is still UNDER_EVALUATION"
        actor: system
        preconditions:
          - "cycle.restatement_stage == UNDER_EVALUATION"
          - "no PostFilingCorrection on the cycle has status IN {DRAFT, ASSESSED}"
        side_effects: ["increments ReportingCycle.version by 1"]
      - from: RESTATEMENT_DECLARED
        to: REMEDIATED
        trigger: "system: the last OPEN ControlDeficiency on the cycle moves to MITIGATED (POST /disclosure/control-deficiencies/{id}/mitigate)"
        actor: system
        preconditions:
          - "cycle.restatement_stage == RESTATEMENT_DECLARED"
          - "cycle.unresolved_deficiency_weight == 0.00"
          - "at least one PostFilingCorrection on the cycle has status == CLOSED"
        side_effects: ["increments ReportingCycle.version by 1"]

  - entity: Milestone
    initial_state: PLANNED
    terminal_states: [COMPLETE, BREACHED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /disclosure/milestones/{id}/transitions with action=START"
        actor: Controller
        preconditions:
          - "milestone.status == PLANNED"
          - "the owning cycle.status IN {CLOSE_OPEN, REVIEW_OPEN, CERTIFICATION_OPEN} (else ERR_INVALID_STATE)"
        side_effects:
          - "sets milestone.actual_start_utc to the current logical clock"
          - "increments Milestone.version by 1"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /disclosure/milestones/{id}/transitions with action=COMPLETE"
        actor: Controller
        preconditions: ["milestone.status == IN_PROGRESS"]
        side_effects:
          - "sets milestone.actual_end_utc to the current logical clock"
          - "recomputes cycle.min_slack_days_calendar and cycle.min_slack_days_business (COMPLETE milestones drop out of the slack input set)"
          - "increments Milestone.version by 1"
      - from: PLANNED
        to: BREACHED
        trigger: "system: any ReportingCycle transition sweep observing planned_end_utc < current logical clock"
        actor: system
        preconditions: ["milestone.status == PLANNED", "milestone.planned_end_utc < current logical clock"]
        side_effects:
          - "recomputes cycle.min_slack_days_calendar and cycle.min_slack_days_business (BREACHED milestones drop out of the slack input set)"
          - "increments Milestone.version by 1"
      - from: IN_PROGRESS
        to: BREACHED
        trigger: "system: any ReportingCycle transition sweep observing planned_end_utc < current logical clock"
        actor: system
        preconditions: ["milestone.status == IN_PROGRESS", "milestone.planned_end_utc < current logical clock"]
        side_effects:
          - "recomputes cycle.min_slack_days_calendar and cycle.min_slack_days_business"
          - "increments Milestone.version by 1"

  - entity: SubCertificationRequest
    initial_state: PENDING
    terminal_states: [WITHDRAWN, VOID]
    note: |
      BRANCHING machine: PENDING forks into SUBMITTED and EXCEPTION_NOTED with DIVERGENT side-effect
      sets (EXCEPTION_NOTED re-weights the row upward through EXCEPTION_ESCALATION and therefore moves
      both the numerator and the denominator of certification_coverage_pct, while SUBMITTED with
      exception_severity == NONE leaves scope_weight unchanged).
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /disclosure/sub-certifications/{id}/transitions with action=SUBMIT and exception_severity omitted or NONE"
        actor: BusinessLeader
        preconditions:
          - "request.status == PENDING"
          - "the acting CommitteeMember id equals request.member_id (else ERR_MEMBER_SEAT_INVALID)"
          - "the acting member's status == ACTIVE (else ERR_MEMBER_SEAT_INVALID)"
          - "the owning cycle.status IN {CLOSE_OPEN, REVIEW_OPEN, CERTIFICATION_OPEN} (else ERR_INVALID_STATE)"
        side_effects:
          - "sets request.submitted_utc to the current logical clock; exception_severity stays NONE; scope_weight is unchanged"
          - "recomputes cycle.certification_coverage_pct (numerator grows, denominator unchanged)"
          - "increments SubCertificationRequest.version by 1"
      - from: PENDING
        to: EXCEPTION_NOTED
        trigger: "POST /disclosure/sub-certifications/{id}/transitions with action=SUBMIT and exception_severity IN {LOW, MEDIUM, HIGH}"
        actor: BusinessLeader
        preconditions:
          - "request.status == PENDING"
          - "the acting CommitteeMember id equals request.member_id (else ERR_MEMBER_SEAT_INVALID)"
          - "the acting member's status == ACTIVE (else ERR_MEMBER_SEAT_INVALID)"
          - "the owning cycle.status IN {CLOSE_OPEN, REVIEW_OPEN, CERTIFICATION_OPEN} (else ERR_INVALID_STATE)"
          - "exception_note is present and non-empty (else ERR_INVALID_REQUEST)"
        side_effects:
          - "sets request.submitted_utc, request.exception_severity and request.exception_note"
          - "DIVERGENT vs the SUBMITTED branch: re-runs calculations.subcert_scope_weight, so request.scope_weight changes"
          - "recomputes cycle.total_assigned_scope_weight and cycle.certification_coverage_pct (BOTH numerator and denominator move)"
          - "increments SubCertificationRequest.version by 1"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /disclosure/sub-certifications/{id}/transitions with action=WITHDRAW"
        actor: DisclosureCommitteeChair
        preconditions:
          - "request.status == PENDING"
          - "the owning cycle.status != FILED and != AMENDED (else ERR_INVALID_STATE)"
        side_effects:
          - "COMPENSATING ACTION for sub-certification assignment: recomputes cycle.total_assigned_scope_weight, which returns exactly to its pre-assignment value"
          - "recomputes cycle.certification_coverage_pct"
          - "increments SubCertificationRequest.version by 1"
      - from: PENDING
        to: VOID
        trigger: "system: the owning cycle is ABANDONED, or the holding CommitteeMember is VACATED"
        actor: system
        preconditions:
          - "for the ABANDONED path: request.status IN {PENDING, SUBMITTED, EXCEPTION_NOTED}"
          - "for the VACATED path: request.status == PENDING (a SUBMITTED or EXCEPTION_NOTED row survives its holder's departure)"
        side_effects:
          - "recomputes the owning cycle's total_assigned_scope_weight and certification_coverage_pct"
          - "increments SubCertificationRequest.version by 1"
        note: "the ABANDONED path also applies from SUBMITTED and from EXCEPTION_NOTED; the VACATED path applies only from PENDING"

  - entity: OfficerCertification
    initial_state: BLOCKED
    terminal_states: [VOID]
    transitions:
      - from: BLOCKED
        to: ELIGIBLE
        trigger: "system: cycle enters CERTIFICATION_OPEN while cycle.open_material_event_count == 0"
        actor: system
        preconditions: ["certification.status == BLOCKED", "cycle.open_material_event_count == 0"]
        side_effects: ["increments OfficerCertification.version by 1"]
      - from: ELIGIBLE
        to: BLOCKED
        trigger: "system: HOP 3 of the material-event cascade, caused by cycle.open_material_event_count rising above 0"
        actor: system
        preconditions: ["certification.status == ELIGIBLE", "cycle.open_material_event_count > 0"]
        side_effects: ["increments OfficerCertification.version by 1"]
      - from: ELIGIBLE
        to: SIGNED
        trigger: "POST /disclosure/officer-certifications/{id}/sign"
        actor: CertifyingOfficer
        preconditions:
          - "certification.status == ELIGIBLE"
          - "the acting CommitteeMember id equals certification.officer_member_id and that member's is_officer == true (else ERR_MEMBER_FUNCTION_MISMATCH)"
          - "cycle.status == CERTIFICATION_OPEN (else ERR_INVALID_STATE)"
          - "at least one SubCertificationRequest with cycle_id == cycle.id and status IN {PENDING, SUBMITTED, EXCEPTION_NOTED} exists (else ERR_CERT_SCOPE_EMPTY)"
          - "cycle.certification_coverage_pct == 100.00 (else ERR_CERT_COVERAGE_INSUFFICIENT)"
          - "cycle.open_material_event_count == 0 (else ERR_OPEN_MATERIAL_EVENT)"
          - "no SubCertificationRequest with cycle_id == cycle.id, member_id == certification.officer_member_id and status IN {PENDING, SUBMITTED, EXCEPTION_NOTED} exists (else ERR_SOD_OFFICER_SUBCERT)"
        side_effects:
          - "sets certification.signed_utc, certification.attestation_text and certification.coverage_pct_at_signing = cycle.certification_coverage_pct"
          - "increments OfficerCertification.version by 1"
      - from: SIGNED
        to: REVOKED
        trigger: "system: HOP 5 of the tie-out cascade, caused by the cycle leaving FILING_READY"
        actor: system
        preconditions: ["certification.status == SIGNED"]
        side_effects:
          - "clears certification.signed_utc and certification.attestation_text; coverage_pct_at_signing is retained as an audit trace"
          - "increments OfficerCertification.version by 1"
      - from: ELIGIBLE
        to: REVOKED
        trigger: "system: HOP 5 of the tie-out cascade, caused by the cycle leaving FILING_READY"
        actor: system
        preconditions: ["certification.status == ELIGIBLE"]
        side_effects: ["increments OfficerCertification.version by 1"]
      - from: REVOKED
        to: BLOCKED
        trigger: "system: cycle re-enters CERTIFICATION_OPEN from REVIEW_OPEN"
        actor: system
        preconditions: ["certification.status == REVOKED"]
        side_effects: ["increments OfficerCertification.version by 1"]
      - from: BLOCKED
        to: VOID
        trigger: "system: the owning cycle is ABANDONED"
        actor: system
        preconditions: ["certification.status IN {BLOCKED, ELIGIBLE, SIGNED, REVOKED}"]
        side_effects: ["increments OfficerCertification.version by 1"]
        note: "the same system edge applies from ELIGIBLE, SIGNED and REVOKED"

  - entity: DraftDocument
    initial_state: DRAFT
    terminal_states: [FILED, SUPERSEDED]
    note: |
      CYCLIC machine: IN_REVIEW -> CHANGES_REQUESTED -> IN_REVIEW is a genuine loop, and each entry
      into CHANGES_REQUESTED increments revision_round, so the loop counter is observable.
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /disclosure/documents/{id}/transitions with action=SUBMIT_REVIEW"
        actor: Controller
        preconditions:
          - "document.status == DRAFT"
          - "the owning cycle.status IN {CLOSE_OPEN, REVIEW_OPEN, FILED} (else ERR_INVALID_STATE) — FILED is admitted because an amended report is drafted and reviewed after the original filing"
        side_effects: ["increments DraftDocument.version by 1"]
      - from: CHANGES_REQUESTED
        to: IN_REVIEW
        trigger: "POST /disclosure/documents/{id}/transitions with action=SUBMIT_REVIEW"
        actor: Controller
        preconditions:
          - "document.status == CHANGES_REQUESTED"
          - "the owning cycle.status IN {CLOSE_OPEN, REVIEW_OPEN, FILED} (else ERR_INVALID_STATE)"
        side_effects:
          - "LOOP EDGE: revision_round is NOT incremented here; it was incremented on entry into CHANGES_REQUESTED"
          - "increments DraftDocument.version by 1"
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /disclosure/documents/{id}/transitions with action=REQUEST_CHANGES and change_note"
        actor: LegalCounsel
        preconditions:
          - "document.status == IN_REVIEW"
          - "change_note is present and non-empty (else ERR_INVALID_REQUEST)"
        side_effects:
          - "increments document.revision_round by 1 and stores change_note"
          - "increments DraftDocument.version by 1"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /disclosure/documents/{id}/transitions with action=APPROVE"
        actor: LegalCounsel
        preconditions:
          - "document.status == IN_REVIEW"
          - "the acting CommitteeMember id != document.author_member_id (else ERR_SOD_SELF_APPROVAL)"
          - "document.tie_out_status == PASSED (else ERR_TIE_OUT_NOT_PASSED)"
          - "document.measure_gate_status IN {NO_MEASURES, CLEARED} (else ERR_MEASURE_NOT_RECONCILED for BLOCKED_RECONCILIATION, ERR_MEASURE_PROMINENCE for BLOCKED_PROMINENCE)"
          - "document.qa_gate_status == CLEARED (else ERR_QA_ITEM_UNCLEARED)"
          - "if document.doc_type IN {EARNINGS_RELEASE, CALL_SCRIPT} then document.safe_harbor_present == true (else ERR_SAFE_HARBOR_MISSING)"
        side_effects: ["increments DraftDocument.version by 1"]
      - from: APPROVED
        to: CHANGES_REQUESTED
        trigger: "system: HOP 3 of the tie-out cascade, caused by document.tie_out_status flipping to FAILED"
        actor: system
        preconditions: ["document.status == APPROVED", "document.tie_out_status == FAILED"]
        side_effects:
          - "increments document.revision_round by 1 and sets change_note to 'auto: tie-out variance detected'"
          - "HOP 4 (caused by this document leaving APPROVED): if doc_type == PERIODIC_FILING and the owning cycle.status == FILING_READY, the cycle moves FILING_READY -> REVIEW_OPEN"
          - "increments DraftDocument.version by 1"
      - from: APPROVED
        to: FILED
        trigger: "POST /disclosure/filings referencing this document"
        actor: ComplianceAdmin
        preconditions: ["document.status == APPROVED", "document.doc_type == PERIODIC_FILING"]
        side_effects: ["increments DraftDocument.version by 1"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /disclosure/documents creating a newer DraftDocument with the same cycle_id and doc_type; OR system: the owning cycle is ABANDONED"
        actor: Controller
        preconditions: ["document.status IN {DRAFT, IN_REVIEW, CHANGES_REQUESTED, APPROVED}", "for the create path: a newer document with the same (cycle_id, doc_type) is being created", "for the system path: the owning ReportingCycle is moving to ABANDONED, which supersedes every document in {DRAFT, IN_REVIEW, CHANGES_REQUESTED, APPROVED}"]
        side_effects: ["increments DraftDocument.version by 1"]
        note: "the same supersede edge applies from DRAFT, IN_REVIEW and CHANGES_REQUESTED; the create path is the CREATE-with-supersede pattern guarded by OCC rule document-create-stale-cycle, while the system path is the ABANDON cascade declared on ReportingCycle -> ABANDONED"

  - entity: TieOutItem
    initial_state: MATCHED
    terminal_states: [WAIVED]
    note: |
      The status is assigned inside the same request that creates or reviews the row, by
      calculations.tie_out_variance_and_tolerance_escalation STEP 4. MATCHED is the nominal initial
      state; a create whose raw_variance_bp exceeds effective_tolerance_bp lands directly in VARIANCE
      through the system edge below. MATCHED <-> VARIANCE is a two-way system edge because a later
      create on the same document can move the document's tier multiplier and re-classify siblings.
    transitions:
      - from: MATCHED
        to: VARIANCE
        trigger: "system: STEP 4 of calculations.tie_out_variance_and_tolerance_escalation, re-run on every POST /disclosure/documents/{id}/tie-out-items and POST /disclosure/tie-out-items/{id}/review against the whole non-WAIVED item set of the document"
        actor: system
        preconditions: ["item.status == MATCHED", "item.raw_variance_bp > item.effective_tolerance_bp"]
        side_effects:
          - "HOP 2 (caused by this item becoming VARIANCE): document.tie_out_status recomputes to FAILED"
          - "increments TieOutItem.version by 1"
      - from: VARIANCE
        to: MATCHED
        trigger: "system: STEP 4 re-run lowers this item's raw_variance_bp below or onto its effective_tolerance_bp (e.g. a sibling is WAIVED, dropping tie_out_total_variance_bp into a looser tier)"
        actor: system
        preconditions: ["item.status == VARIANCE", "item.raw_variance_bp <= item.effective_tolerance_bp"]
        side_effects:
          - "document.tie_out_status recomputes (PASSED once every non-WAIVED item is MATCHED)"
          - "increments TieOutItem.version by 1"
      - from: VARIANCE
        to: WAIVED
        trigger: "POST /disclosure/tie-out-items/{id}/review with decision=WAIVE"
        actor: Controller
        preconditions:
          - "item.status IN {MATCHED, VARIANCE}"
          - "reviewer_member_id != item.preparer_member_id (else ERR_SOD_SELF_REVIEW)"
          - "the CommitteeMember named by reviewer_member_id has status == ACTIVE (else ERR_MEMBER_SEAT_INVALID)"
          - "the owning document.status IN {DRAFT, IN_REVIEW, CHANGES_REQUESTED, APPROVED} (else ERR_INVALID_STATE)"
        side_effects:
          - "sets item.reviewer_member_id and item.review_decision = WAIVE"
          - "the item leaves the STEP 1-4 input set, so document.tie_out_total_variance_bp, tie_out_tier_multiplier, every sibling's effective_tolerance_bp and status, and document.tie_out_status are all recomputed"
          - "increments TieOutItem.version by 1"
        note: "the same WAIVE edge applies from MATCHED"
      - from: MATCHED
        to: MATCHED
        trigger: "POST /disclosure/tie-out-items/{id}/review with decision=ACCEPT"
        actor: Controller
        preconditions:
          - "item.status == MATCHED"
          - "reviewer_member_id != item.preparer_member_id (else ERR_SOD_SELF_REVIEW)"
          - "the CommitteeMember named by reviewer_member_id has status == ACTIVE (else ERR_MEMBER_SEAT_INVALID)"
          - "the owning document.status IN {DRAFT, IN_REVIEW, CHANGES_REQUESTED, APPROVED} (else ERR_INVALID_STATE)"
        side_effects:
          - "sets item.reviewer_member_id and item.review_decision = ACCEPT; status is re-derived by STEP 4 and stays MATCHED"
          - "increments TieOutItem.version by 1"

  - entity: AdjustedMeasure
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: RECONCILED
        trigger: "POST /disclosure/adjusted-measures/{id}/reconcile"
        actor: Controller
        preconditions:
          - "the owning document.status IN {DRAFT, IN_REVIEW, CHANGES_REQUESTED} (else ERR_INVALID_STATE)"
          - "abs(reconciliation_gap) <= RECONCILIATION_TOLERANCE AND prominence_ok == true"
        side_effects:
          - "recomputes document.measure_gate_status"
          - "increments AdjustedMeasure.version by 1"
        note: "the same edge is legal from PROMINENCE_FAILED and from REJECTED — the reconcile action is idempotent in shape and re-derives status from the current field values"
      - from: DRAFT
        to: PROMINENCE_FAILED
        trigger: "POST /disclosure/adjusted-measures/{id}/reconcile"
        actor: Controller
        preconditions:
          - "the owning document.status IN {DRAFT, IN_REVIEW, CHANGES_REQUESTED} (else ERR_INVALID_STATE)"
          - "abs(reconciliation_gap) <= RECONCILIATION_TOLERANCE AND prominence_ok == false"
        side_effects:
          - "recomputes document.measure_gate_status to BLOCKED_PROMINENCE (unless some measure is already DRAFT or REJECTED, which outranks it)"
          - "increments AdjustedMeasure.version by 1"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /disclosure/adjusted-measures/{id}/reconcile"
        actor: Controller
        preconditions:
          - "the owning document.status IN {DRAFT, IN_REVIEW, CHANGES_REQUESTED} (else ERR_INVALID_STATE)"
          - "abs(reconciliation_gap) > RECONCILIATION_TOLERANCE"
        side_effects:
          - "recomputes document.measure_gate_status to BLOCKED_RECONCILIATION"
          - "increments AdjustedMeasure.version by 1"
      - from: REJECTED
        to: RECONCILED
        trigger: "POST /disclosure/adjusted-measures/{id}/reconcile with corrected reconciliation_items"
        actor: Controller
        preconditions:
          - "the owning document.status IN {DRAFT, IN_REVIEW, CHANGES_REQUESTED} (else ERR_INVALID_STATE)"
          - "abs(reconciliation_gap) <= RECONCILIATION_TOLERANCE AND prominence_ok == true"
        side_effects:
          - "overwrites reconciliation_items, adjusted_prominence_index and gaap_prominence_index with any values supplied on the request before re-deriving"
          - "recomputes document.measure_gate_status"
          - "increments AdjustedMeasure.version by 1"
      - from: PROMINENCE_FAILED
        to: RECONCILED
        trigger: "POST /disclosure/adjusted-measures/{id}/reconcile with corrected prominence indices"
        actor: Controller
        preconditions:
          - "the owning document.status IN {DRAFT, IN_REVIEW, CHANGES_REQUESTED} (else ERR_INVALID_STATE)"
          - "abs(reconciliation_gap) <= RECONCILIATION_TOLERANCE AND prominence_ok == true"
        side_effects:
          - "recomputes document.measure_gate_status"
          - "increments AdjustedMeasure.version by 1"

  - entity: QandAItem
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: BLOCKED
        trigger: "POST /disclosure/documents/{id}/qa-items with risk_tier == HIGH or requires_safe_harbor == true"
        actor: InvestorRelations
        preconditions: ["risk_tier == HIGH OR requires_safe_harbor == true"]
        side_effects:
          - "recomputes document.qa_gate_status (BLOCKED when this item's risk_tier == HIGH)"
          - "increments QandAItem.version by 1"
        note: "system edge evaluated inside the create request; a created item is persisted directly in BLOCKED when risk_tier == HIGH or requires_safe_harbor == true, otherwise in DRAFT. A BLOCKED item on a script whose safe_harbor_present == false cannot be cleared (ERR_SAFE_HARBOR_MISSING); a BLOCKED item on a script whose safe_harbor_present == true can."
      - from: DRAFT
        to: CLEARED
        trigger: "POST /disclosure/qa-items/{id}/clear"
        actor: LegalCounsel
        preconditions:
          - "item.status == DRAFT"
          - "the owning script document.status IN {DRAFT, IN_REVIEW, CHANGES_REQUESTED} (else ERR_INVALID_STATE)"
        side_effects:
          - "sets item.clearance_note; recomputes document.qa_gate_status"
          - "increments QandAItem.version by 1"
      - from: BLOCKED
        to: CLEARED
        trigger: "POST /disclosure/qa-items/{id}/clear"
        actor: LegalCounsel
        preconditions:
          - "item.status == BLOCKED"
          - "the owning script document.safe_harbor_present == true (else ERR_SAFE_HARBOR_MISSING)"
          - "the owning script document.status IN {DRAFT, IN_REVIEW, CHANGES_REQUESTED} (else ERR_INVALID_STATE)"
        side_effects:
          - "sets item.clearance_note; recomputes document.qa_gate_status"
          - "increments QandAItem.version by 1"

  - entity: MaterialEvent
    initial_state: UNASSESSED
    terminal_states: [DISCLOSED, SUPERSEDED]
    note: |
      BRANCHING machine with DIVERGENT side-effect sets. Creation already puts the row in the open
      set, so the two assessment branches move the cycle in OPPOSITE directions: the REPORTABLE branch
      computes current_report_deadline_utc, keeps the row in cycle.open_material_event_count and keeps
      eligible officer certifications blocked, while the NOT_REPORTABLE branch leaves the deadline null,
      drops the row out of the open count and therefore releases those certifications.
    transitions:
      - from: UNASSESSED
        to: NOT_REPORTABLE
        trigger: "POST /disclosure/material-events/{id}/transitions with action=ASSESS and determination=NOT_REPORTABLE"
        actor: LegalCounsel
        preconditions:
          - "event.assessment_status == UNASSESSED"
          - "event.severity_score < MATERIALITY_REPORTABLE_PCT (else ERR_EVENT_DETERMINATION_CONFLICT)"
        side_effects:
          - "current_report_deadline_utc stays null — DIVERGENT vs the REPORTABLE branch, which computes it"
          - "cycle.open_material_event_count recomputes downward, because the row leaves the {UNASSESSED, REPORTABLE} open set"
          - "every OfficerCertification on the cycle with status == BLOCKED moves BLOCKED -> ELIGIBLE when the count reaches 0 and cycle.status == CERTIFICATION_OPEN"
          - "increments MaterialEvent.version by 1"
      - from: UNASSESSED
        to: REPORTABLE
        trigger: "POST /disclosure/material-events/{id}/transitions with action=ASSESS and determination=REPORTABLE"
        actor: LegalCounsel
        preconditions: ["event.assessment_status == UNASSESSED"]
        side_effects:
          - "sets event.current_report_deadline_utc per calculations.material_event_severity_and_deadline"
          - "cycle.open_material_event_count recomputes and holds its current value: an UNASSESSED row was already inside the open set, so this edge sustains an existing block instead of creating one"
          - "every OfficerCertification on the cycle with status == ELIGIBLE moves ELIGIBLE -> BLOCKED (a no-op when the event's creation already blocked them)"
          - "increments MaterialEvent.version by 1"
      - from: NOT_REPORTABLE
        to: REPORTABLE
        trigger: "POST /disclosure/material-events/{id}/transitions with action=ASSESS and determination=REPORTABLE (re-assessment on new information)"
        actor: LegalCounsel
        preconditions: ["event.assessment_status == NOT_REPORTABLE"]
        side_effects:
          - "HOP 1: sets event.current_report_deadline_utc per calculations.material_event_severity_and_deadline"
          - "HOP 2 (caused by this event re-entering the open set): cycle.open_material_event_count recomputes upward, from 0 to 1 when this is the cycle's only open event"
          - "HOP 3 (caused by open_material_event_count rising above 0): every OfficerCertification on the cycle with status == ELIGIBLE moves ELIGIBLE -> BLOCKED"
          - "increments MaterialEvent.version by 1"
      - from: REPORTABLE
        to: DISCLOSED
        trigger: "POST /disclosure/material-events/{id}/transitions with action=DISCLOSE and linked_document_id"
        actor: LegalCounsel
        preconditions:
          - "event.assessment_status == REPORTABLE"
          - "the referenced DraftDocument has doc_type == CURRENT_REPORT, cycle_id == event.cycle_id and status == APPROVED (else ERR_FILING_DOCUMENT_INVALID)"
        side_effects:
          - "sets event.linked_document_id"
          - "cycle.open_material_event_count recomputes downward; every OfficerCertification on the cycle with status == BLOCKED moves BLOCKED -> ELIGIBLE when the count reaches 0 and cycle.status == CERTIFICATION_OPEN"
          - "increments MaterialEvent.version by 1"
      - from: UNASSESSED
        to: SUPERSEDED
        trigger: "system: the owning cycle is ABANDONED"
        actor: system
        preconditions: ["event.assessment_status IN {UNASSESSED, NOT_REPORTABLE, REPORTABLE}"]
        side_effects: ["increments MaterialEvent.version by 1"]
        note: "the same system edge applies from NOT_REPORTABLE and REPORTABLE"

  - entity: Filing
    initial_state: SUBMITTED
    terminal_states: [AMENDED_SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: AMENDED_SUPERSEDED
        trigger: "POST /disclosure/filings with amends_filing_id pointing at this Filing"
        actor: ComplianceAdmin
        preconditions:
          - "filing.status == SUBMITTED"
          - "the new filing's cycle_id == this filing's cycle_id (else ERR_AMENDMENT_TARGET_INVALID)"
          - "the owning cycle.unresolved_deficiency_weight == 0.00 (else ERR_DEFICIENCY_OPEN) — the amended report cannot be submitted while a control deficiency raised by a correction on this cycle is still OPEN"
        side_effects:
          - "the owning cycle moves FILED -> AMENDED"
          - "increments Filing.version by 1"

  - entity: PostFilingCorrection
    initial_state: DRAFT
    terminal_states: [RESCINDED, CLOSED]
    transitions:
      - from: DRAFT
        to: ASSESSED
        trigger: "POST /disclosure/corrections/{id}/transitions with action=ASSESS"
        actor: ComplianceAdmin
        preconditions:
          - "correction.status == DRAFT"
          - "method IN {ROLLOVER, IRON_CURTAIN} (defaults to ROLLOVER when omitted)"
          - "likelihood_pct, magnitude_amount and compensating_control_present are all present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "HOP 1: sets correction.method, correction.materiality_pct and correction.classification per calculations.correction_materiality_classification"
          - "HOP 2 (caused by classification landing on REVISION or RESTATEMENT): creates exactly one ControlDeficiency row with status OPEN, copying likelihood_pct / magnitude_amount / compensating_control_present from the request and computing severity, severity_score and deficiency_weight per calculations.control_deficiency_severity; classification == IMMATERIAL creates no deficiency"
          - "HOP 3 (caused by that OPEN ControlDeficiency existing): cycle.unresolved_deficiency_weight recomputes upward per calculations.cycle_unresolved_deficiency_weight"
          - "HOP 4 (caused by unresolved_deficiency_weight rising above 0.00 with classification == RESTATEMENT): cycle.restatement_stage moves UNDER_EVALUATION -> RESTATEMENT_DECLARED"
          - "increments PostFilingCorrection.version by 1"
      - from: ASSESSED
        to: RESCINDED
        trigger: "POST /disclosure/corrections/{id}/transitions with action=RESCIND"
        actor: ComplianceAdmin
        preconditions:
          - "correction.status == ASSESSED"
          - "every ControlDeficiency with correction_id == correction.id has status == OPEN (else ERR_DEFICIENCY_ALREADY_MITIGATED)"
        side_effects:
          - "COMPENSATING ACTION for ASSESS. HOP 1: correction.status becomes RESCINDED and materiality_pct / classification / method are cleared to null"
          - "HOP 2 (caused by the rescission): every ControlDeficiency with correction_id == correction.id and status == OPEN moves OPEN -> REVERSED"
          - "HOP 3 (caused by no OPEN deficiency remaining): cycle.unresolved_deficiency_weight recomputes back to 0.00"
          - "HOP 4 (caused by unresolved_deficiency_weight returning to 0.00): cycle.restatement_stage moves RESTATEMENT_DECLARED -> NONE, or UNDER_EVALUATION -> NONE when no correction on the cycle remains in DRAFT or ASSESSED"
          - "increments PostFilingCorrection.version by 1"
      - from: ASSESSED
        to: CLOSED
        trigger: "system: the last ControlDeficiency with correction_id == correction.id moves OPEN -> MITIGATED"
        actor: system
        preconditions: ["correction.status == ASSESSED", "no ControlDeficiency with correction_id == correction.id has status == OPEN"]
        side_effects: ["increments PostFilingCorrection.version by 1"]

  - entity: ControlDeficiency
    initial_state: OPEN
    terminal_states: [MITIGATED, REVERSED]
    transitions:
      - from: OPEN
        to: MITIGATED
        trigger: "POST /disclosure/control-deficiencies/{id}/mitigate"
        actor: ComplianceAdmin
        preconditions:
          - "deficiency.status == OPEN"
          - "deficiency.status == OPEN (else ERR_DEFICIENCY_ALREADY_MITIGATED) — the owning correction carries NO separate parent-state gate here, because an OPEN ControlDeficiency can only exist under an ASSESSED correction: RESCIND reverses every OPEN row, and mitigating the last OPEN row is itself what closes the correction, so a mitigate call against a MITIGATED or REVERSED row is reported by ERR_DEFICIENCY_ALREADY_MITIGATED at priority 38 and never by ERR_INVALID_STATE at priority 13"
        side_effects:
          - "sets deficiency.remediation_note"
          - "cycle.unresolved_deficiency_weight recomputes downward"
          - "when no OPEN deficiency remains on the correction, the correction moves ASSESSED -> CLOSED, and the cycle then moves restatement_stage RESTATEMENT_DECLARED -> REMEDIATED"
          - "increments ControlDeficiency.version by 1"
      - from: OPEN
        to: REVERSED
        trigger: "system: HOP 2 of the rescind compensation on the owning correction"
        actor: system
        preconditions: ["deficiency.status == OPEN"]
        side_effects:
          - "cycle.unresolved_deficiency_weight recomputes downward"
          - "increments ControlDeficiency.version by 1"

# =====================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =====================================================================
concurrency_rules:
  - rule_id: document-create-stale-cycle
    parent_entity: ReportingCycle
    write_endpoint: "POST /disclosure/documents"
    occ_field: "expected_cycle_version"
    description: |
      Creating a DraftDocument against a ReportingCycle whose `version` has advanced since the client
      last observed it is rejected. This captures the CREATE-with-supersede case: a newer document with
      the same (cycle_id, doc_type) legitimately supersedes the prior one, so a writer holding a stale
      view of the cycle would silently retire a document it never saw.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
  - rule_id: tieout-create-stale-document
    parent_entity: DraftDocument
    write_endpoint: "POST /disclosure/documents/{id}/tie-out-items"
    occ_field: "expected_document_version"
    description: |
      Creating a TieOutItem against a DraftDocument whose `version` has advanced since the client last
      observed it is rejected. A tie-out create re-derives every sibling item's effective_tolerance_bp
      from the document-wide tier multiplier, so a writer holding a stale view of the document would
      re-classify siblings it never read.
    error_id: ERR_STALE_DOCUMENT_VERSION
    http_status: 412

# =====================================================================
# 1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: business_day_calendar
    trigger: "shared helper invoked by statutory_deadline_resolution, cycle_milestone_slack and material_event_severity_and_deadline"
    algorithm: chronological
    formula: |
      is_business_day(d) := d.weekday() NOT IN {SATURDAY, SUNDAY} AND d NOT IN HOLIDAYS_UTC
      roll_forward(d)    := while NOT is_business_day(d): d := d + 1 calendar day; return d
      add_business_days(d, n) := repeat n times { d := d + 1 calendar day;
                                                 while NOT is_business_day(d): d := d + 1 calendar day }
                                 return d
      count_business_days_after_through(a, b) := number of dates d with a < d <= b and is_business_day(d)
                                                (a exclusive, b inclusive; 0 when b <= a)
    input_set: "pure function of calendar dates; no entity state"
    constants:
      HOLIDAYS_UTC: ["2026-01-01", "2026-01-19", "2026-02-16", "2026-05-25", "2026-07-03", "2026-09-07", "2026-11-26", "2026-12-25", "2027-01-01"]
    precision: "whole calendar dates in UTC; no time-of-day component"

  - name: statutory_deadline_resolution
    trigger: "POST /disclosure/reporting-cycles (evaluated once at creation and never re-derived)"
    algorithm: threshold
    formula: |
      days := FILING_DEADLINE_DAYS[cycle.form_type][cycle.filer_status]
      raw_date := date(cycle.period_end_date) + days calendar days
      deadline_date := roll_forward(raw_date)                       # weekend/holiday roll FORWARD only
      cycle.statutory_deadline_utc := deadline_date + "T" + DEADLINE_CUTOFF_TIME_UTC + "Z"
      # ASYMMETRY (pinned): the internal target is NOT business-day rolled.
      cycle.internal_target_utc   := cycle.statutory_deadline_utc - cycle.internal_buffer_days calendar days
    input_set: "form_type, filer_status, period_end_date and internal_buffer_days of the single cycle being created"
    constants:
      FILING_DEADLINE_DAYS:
        FORM_10Q: { LARGE_ACCELERATED: 40, ACCELERATED: 40, NON_ACCELERATED: 45 }
        FORM_10K: { LARGE_ACCELERATED: 60, ACCELERATED: 75, NON_ACCELERATED: 90 }
      DEADLINE_CUTOFF_TIME_UTC: "17:30:00"
    precision: "second-resolution ISO 8601 UTC instant with three fractional digits normalised to .000"

  - name: cycle_milestone_slack
    trigger: "POST /disclosure/reporting-cycles/{id}/milestones, POST /disclosure/milestones/{id}/transitions, and every POST /disclosure/reporting-cycles/{id}/transitions (which also runs the BREACHED sweep first)"
    algorithm: forward_looking
    formula: |
      # Per-milestone, for every Milestone m of the cycle:
      m.slack_calendar_days  := floor_whole_days(cycle.statutory_deadline_utc - m.planned_end_utc)
                               # integer whole days, truncated toward zero; negative when past deadline
      m.slack_business_days  := count_business_days_after_through(date(m.planned_end_utc),
                                                                  date(cycle.statutory_deadline_utc))
      # Cycle-level aggregate over the OPEN input set only:
      open_set := { m : m.cycle_id == cycle.id AND m.status IN {PLANNED, IN_PROGRESS} }
      if open_set is empty:
          cycle.min_slack_days_calendar := 9999
          cycle.min_slack_days_business := 9999
      else:
          cycle.min_slack_days_calendar := min(m.slack_calendar_days for m in open_set)
          cycle.min_slack_days_business := min(m.slack_business_days for m in open_set)
      # ORDER-SENSITIVITY / TIE-BREAK: min over integers needs no tie-break; when two milestones tie on
      # the minimum, the value is identical, so no ordering rule can change the result.
    input_set: "Milestone rows of the cycle whose status IN {PLANNED, IN_PROGRESS}; COMPLETE and BREACHED milestones are excluded from the aggregate but keep their own per-row slack fields frozen at last computation"
    constants:
      REQUIRED_FILING_SLACK_BUSINESS_DAYS: 1
    precision: "integers; no rounding"
    variants:
      - name: CALENDAR_DAY
        when: "surfaced as cycle.min_slack_days_calendar and Milestone.slack_calendar_days; used for operator reporting only"
        difference: "counts every calendar day between planned_end_utc and the statutory deadline, weekends and HOLIDAYS_UTC included, truncating a partial day toward zero"
      - name: BUSINESS_DAY
        when: "surfaced as cycle.min_slack_days_business and Milestone.slack_business_days; THIS variant is the field of record for the DECLARE_FILING_READY gate"
        difference: "counts only business days strictly after date(planned_end_utc) through date(statutory_deadline_utc) inclusive, ignoring time-of-day entirely; for identical inputs it returns a strictly smaller number whenever the interval spans a weekend or holiday"

  - name: subcert_scope_weight
    trigger: "POST /disclosure/sub-certifications (initial weight) and POST /disclosure/sub-certifications/{id}/transitions with action=SUBMIT (re-weight)"
    algorithm: weighted_scoring
    formula: |
      base            := SCOPE_BASE_WEIGHT[request.scope_area]
      officer_support := OFFICER_SUPPORT_MULTIPLIER if member.is_officer == true else 1.0
      escalation      := EXCEPTION_ESCALATION[request.exception_severity]
      raw             := base * officer_support * escalation
      # PINNED ORDER: floor at `base` first, round ONCE to 2dp, then apply the cap.
      request.scope_weight := min(SCOPE_WEIGHT_CAP, round_half_up(max(base, raw), 2))
    input_set: "the single request being created or submitted, plus the is_officer flag of the CommitteeMember named by request.member_id read at evaluation time"
    constants:
      SCOPE_BASE_WEIGHT: { REVENUE: 30, LEGAL_CONTINGENCY: 25, OPERATIONS: 20, IR_COMMUNICATIONS: 15, IT_CONTROLS: 10 }
      OFFICER_SUPPORT_MULTIPLIER: 1.5
      EXCEPTION_ESCALATION: { NONE: 1.0, LOW: 1.1, MEDIUM: 1.4, HIGH: 2.0 }
      SCOPE_WEIGHT_CAP: 45
    precision: "2 decimal places, round_half_up; the cap is applied AFTER rounding so a capped row reads exactly 45.00"

  - name: cycle_total_assigned_scope_weight
    trigger: "POST /disclosure/sub-certifications, POST /disclosure/sub-certifications/{id}/transitions (both SUBMIT and WITHDRAW), and the ABANDON cascade"
    algorithm: aggregation
    formula: |
      cycle.total_assigned_scope_weight := round_half_up(
          sum( r.scope_weight for r in SubCertificationRequest
               where r.cycle_id == cycle.id
                 AND r.status IN {PENDING, SUBMITTED, EXCEPTION_NOTED} ), 2)
      # CONSERVED QUANTITY #1. Full recompute from source rows on every touch — never an
      # incremental += / -= — so a create followed by its WITHDRAW leaves no drift.
    input_set: "SubCertificationRequest rows of the cycle with status IN {PENDING, SUBMITTED, EXCEPTION_NOTED}; WITHDRAWN and VOID rows are excluded; no time window; sum is order-insensitive so no tie-break is required"
    constants: {}
    precision: "2 decimal places, round_half_up applied once to the sum"

  - name: certification_coverage_pct
    trigger: "POST /disclosure/sub-certifications, POST /disclosure/sub-certifications/{id}/transitions, the cycle OPEN_CERTIFICATION transition, and the ABANDON cascade"
    algorithm: aggregation
    formula: |
      denominator_rows := { r : r.cycle_id == cycle.id AND r.status IN {PENDING, SUBMITTED, EXCEPTION_NOTED} }
      numerator_rows   := { r in denominator_rows : r.status IN {SUBMITTED, EXCEPTION_NOTED} }
      if denominator_rows is empty:
          cycle.certification_coverage_pct := 0.00          # EMPTY-SET CONVENTION, not 100.00
      else:
          # PINNED EVALUATION ORDER — sum the raw weights FIRST, divide, then round exactly ONCE:
          num := sum(r.scope_weight for r in numerator_rows)
          den := sum(r.scope_weight for r in denominator_rows)
          cycle.certification_coverage_pct := round_half_up(num / den * 100, 2)
      # EXPLICITLY FORBIDDEN alternative order: computing a per-scope_area completion percentage,
      # rounding each to 2dp, and averaging those percentages unweighted. For 4 requests weighted
      # 30.00 / 25.00 / 20.00 / 15.00 with the first two submitted, the pinned order yields 61.11
      # while the forbidden order yields 50.00.
    input_set: "SubCertificationRequest rows of the cycle with status IN {PENDING, SUBMITTED, EXCEPTION_NOTED}; WITHDRAWN and VOID rows leave both numerator and denominator; no time window; sums are order-insensitive"
    constants:
      COVERAGE_REQUIRED_PCT: 100.00
    precision: "2 decimal places, round_half_up, applied exactly once to the final percentage"

  - name: tie_out_variance_and_tolerance_escalation
    trigger: "POST /disclosure/documents/{id}/tie-out-items and POST /disclosure/tie-out-items/{id}/review — re-run over the WHOLE non-WAIVED item set of the document, not just the touched row"
    algorithm: constraint_propagation
    formula: |
      # This calculation LOOKS circular: each item's status depends on a tier multiplier derived from a
      # document-wide variance total, and that total is drawn from the same items. The evaluation order
      # below breaks the loop and is normative — no other order is permitted.
      S := { i : i.document_id == document.id AND i.status != WAIVED }
      # STEP 1 — raw variance per item, independent of any status:
      for i in S:
          if i.source_record_value == 0:
              i.raw_variance_bp := 10000
          else:
              i.raw_variance_bp := round_half_up(
                  abs(i.reported_value - i.source_record_value) / abs(i.source_record_value) * 10000, 0)
      # STEP 2 — document total from the STEP-1 SNAPSHOT ONLY. Statuses assigned in STEP 4 MUST NOT
      # feed back into this sum:
      document.tie_out_total_variance_bp := sum(i.raw_variance_bp for i in S)
      # STEP 3 — tier selection on that snapshot total:
      document.tie_out_tier_multiplier :=
          1.00 if document.tie_out_total_variance_bp <= 50
          else 0.75 if document.tie_out_total_variance_bp <= 200
          else 0.50
      # STEP 4 — per-item effective tolerance and status:
      for i in S:
          i.effective_tolerance_bp := floor(i.tolerance_bp * document.tie_out_tier_multiplier)
          i.status := MATCHED if i.raw_variance_bp <= i.effective_tolerance_bp else VARIANCE
      # STEP 5 — document gate:
      document.tie_out_status :=
          NOT_STARTED if S is empty
          else PASSED if every i in S has i.status == MATCHED
          else FAILED
    input_set: "TieOutItem rows of the document with status != WAIVED; WAIVED rows contribute nothing to STEP 2 and keep their frozen raw_variance_bp / effective_tolerance_bp values"
    constants:
      TIE_OUT_TIER_BOUNDS: { TIGHT_MAX_BP: 50, MEDIUM_MAX_BP: 200 }
      TIE_OUT_TIER_MULTIPLIER: { TIGHT: 1.00, MEDIUM: 0.75, WIDE: 0.50 }
      SOURCE_ZERO_VARIANCE_BP: 10000
    precision: "raw_variance_bp and effective_tolerance_bp are integers: raw_variance_bp is round_half_up to 0 decimals, effective_tolerance_bp is floor (truncation), and the MATCHED test is `<=` so a variance landing exactly on the effective tolerance PASSES"

  - name: adjusted_measure_reconciliation
    trigger: "POST /disclosure/adjusted-measures/{id}/reconcile"
    algorithm: aggregation
    formula: |
      measure.reconciliation_sum := round_half_up(sum(item.amount for item in measure.reconciliation_items), 2)
      measure.reconciliation_gap := round_half_up(
          measure.adjusted_value - (measure.comparable_gaap_value + measure.reconciliation_sum), 2)
      measure.prominence_ok      := (measure.gaap_prominence_index <= measure.adjusted_prominence_index)
      reconciled_ok              := abs(measure.reconciliation_gap) <= RECONCILIATION_TOLERANCE
      measure.status :=
          REJECTED           if NOT reconciled_ok
          else PROMINENCE_FAILED if NOT measure.prominence_ok
          else RECONCILED
    input_set: "the single AdjustedMeasure row being reconciled, using the reconciliation_items / prominence indices supplied on the request when present, otherwise the stored values"
    constants:
      RECONCILIATION_TOLERANCE: 0.01
    precision: "2 decimal places, round_half_up; the reconciled test is `<=` so a gap of exactly 0.01 reconciles and 0.02 does not"

  - name: measure_gate_evaluation
    trigger: "POST /disclosure/documents/{id}/adjusted-measures and POST /disclosure/adjusted-measures/{id}/reconcile"
    algorithm: aggregation
    formula: |
      M := { m : m.document_id == document.id }
      # PINNED PRECEDENCE: reconciliation failures outrank prominence failures.
      document.measure_gate_status :=
          NO_MEASURES              if M is empty
          else BLOCKED_RECONCILIATION if any m in M has m.status IN {DRAFT, REJECTED}
          else BLOCKED_PROMINENCE     if any m in M has m.status == PROMINENCE_FAILED
          else CLEARED
    input_set: "all AdjustedMeasure rows of the document regardless of status"
    constants: {}
    precision: "enum, no numeric precision"

  - name: material_event_severity_and_deadline
    trigger: "POST /disclosure/reporting-cycles/{id}/material-events (severity_score) and POST /disclosure/material-events/{id}/transitions with action=ASSESS and determination=REPORTABLE (current_report_deadline_utc)"
    algorithm: threshold
    formula: |
      event.severity_score := round_half_up(
          min(100.00, abs(event.magnitude_amount) / cycle.materiality_base_amount * 100), 2)
      # REPORTABLE floor: a rounded severity_score >= MATERIALITY_REPORTABLE_PCT forbids a
      # NOT_REPORTABLE determination (ERR_EVENT_DETERMINATION_CONFLICT). The comparison uses the
      # ROUNDED score, so 4.99999% rounds to 5.00 and is already reportable.
      # On the REPORTABLE branch only:
      event.current_report_deadline_utc :=
          add_business_days(date(event.discovered_utc), CURRENT_REPORT_BUSINESS_DAYS)
          + "T" + DEADLINE_CUTOFF_TIME_UTC + "Z"
    input_set: "the single MaterialEvent plus materiality_base_amount of the cycle named by event.cycle_id"
    constants:
      MATERIALITY_REPORTABLE_PCT: 5.00
      CURRENT_REPORT_BUSINESS_DAYS: 4
      DEADLINE_CUTOFF_TIME_UTC: "17:30:00"
    precision: "severity_score is 2 decimal places round_half_up; the reportable test is `>=`"

  - name: correction_materiality_classification
    trigger: "POST /disclosure/corrections/{id}/transitions with action=ASSESS"
    algorithm: threshold
    formula: |
      rollover_pct     := round_half_up(abs(correction.error_amount)
                                        / abs(correction.current_period_pretax_income) * 100, 2)
      iron_curtain_pct := round_half_up(abs(correction.error_amount
                                            + correction.cumulative_prior_uncorrected_amount)
                                        / abs(correction.prior_period_pretax_income) * 100, 2)
      correction.materiality_pct := rollover_pct if method == ROLLOVER else iron_curtain_pct
      correction.classification :=
          RESTATEMENT if correction.materiality_pct >= MATERIALITY_RESTATEMENT_PCT
          else REVISION if correction.materiality_pct >= MATERIALITY_REVISION_PCT
          else IMMATERIAL
    input_set: "the single PostFilingCorrection row plus the `method` supplied on the assess request (default ROLLOVER)"
    constants:
      MATERIALITY_RESTATEMENT_PCT: 5.00
      MATERIALITY_REVISION_PCT: 1.00
      DEFAULT_MATERIALITY_METHOD: ROLLOVER
    precision: "2 decimal places, round_half_up; both classification tests are `>=`"
    variants:
      - name: ROLLOVER
        when: "method == ROLLOVER on the assess request, or method omitted"
        difference: "divides the current-period error alone by current_period_pretax_income; ignores cumulative_prior_uncorrected_amount entirely"
      - name: IRON_CURTAIN
        when: "method == IRON_CURTAIN on the assess request"
        difference: "divides the error PLUS cumulative_prior_uncorrected_amount by prior_period_pretax_income; for error_amount 400000, current 10000000, cumulative 300000 and prior 12000000 the two variants return 4.00 (REVISION) and 5.83 (RESTATEMENT) from identical stored data"

  - name: control_deficiency_severity
    trigger: "the HOP 2 cascade of POST /disclosure/corrections/{id}/transitions with action=ASSESS when classification IN {REVISION, RESTATEMENT}"
    algorithm: weighted_scoring
    formula: |
      magnitude_ratio := abs(deficiency.magnitude_amount) / abs(correction.current_period_pretax_income)
      exposure_pct    := deficiency.likelihood_pct * magnitude_ratio        # both unrounded
      credit          := COMPENSATING_CONTROL_CREDIT if deficiency.compensating_control_present else 1.00
      # PINNED: `correction.materiality_pct` here is the ALREADY-ROUNDED 2dp value from
      # correction_materiality_classification, not the unrounded ratio.
      deficiency.severity_score := round_half_up(
          min(100.00, max(correction.materiality_pct, exposure_pct)) * credit, 2)
      deficiency.severity :=
          MATERIAL_WEAKNESS      if deficiency.severity_score >= MATERIAL_WEAKNESS_PCT
          else SIGNIFICANT_DEFICIENCY if deficiency.severity_score >= SIGNIFICANT_DEFICIENCY_PCT
          else DEFICIENCY
      deficiency.deficiency_weight := round_half_up(
          deficiency.severity_score * DEFICIENCY_WEIGHT_FACTOR[deficiency.severity], 2)
    input_set: "the single cascaded ControlDeficiency row plus materiality_pct and current_period_pretax_income of its owning PostFilingCorrection"
    constants:
      COMPENSATING_CONTROL_CREDIT: 0.60
      MATERIAL_WEAKNESS_PCT: 5.00
      SIGNIFICANT_DEFICIENCY_PCT: 1.50
      DEFICIENCY_WEIGHT_FACTOR: { DEFICIENCY: 1.0, SIGNIFICANT_DEFICIENCY: 2.0, MATERIAL_WEAKNESS: 4.0 }
    precision: "2 decimal places, round_half_up applied to severity_score BEFORE tier selection and again to deficiency_weight; both tier tests are `>=`"

  - name: cycle_unresolved_deficiency_weight
    trigger: "the ASSESS cascade, the RESCIND compensation, and POST /disclosure/control-deficiencies/{id}/mitigate"
    algorithm: aggregation
    formula: |
      relevant_filings     := { f : f.cycle_id == cycle.id AND f.status IN {SUBMITTED, AMENDED_SUPERSEDED} }
      relevant_corrections := { c : c.filing_id IN relevant_filings AND c.status IN {DRAFT, ASSESSED, CLOSED} }
      cycle.unresolved_deficiency_weight := round_half_up(
          sum( d.deficiency_weight for d in ControlDeficiency
               where d.correction_id IN relevant_corrections AND d.status == OPEN ), 2)
      # CONSERVED QUANTITY #2. Full recompute from source rows on every touch, so ASSESS followed by
      # RESCIND returns the field to its exact pre-ASSESS value.
    input_set: "ControlDeficiency rows with status == OPEN reachable from the cycle through Filing -> PostFilingCorrection; MITIGATED and REVERSED rows are excluded; RESCINDED corrections are excluded; no time window; sum is order-insensitive"
    constants: {}
    precision: "2 decimal places, round_half_up applied once to the sum; the empty sum is exactly 0.00"

  - name: member_concurrent_subcert_load
    trigger: "POST /disclosure/sub-certifications (evaluated before the row is persisted)"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals with AGGREGATE CAPACITY on a CommitteeMember.
      window(r)    := [ r.due_utc - SUBCERT_PREP_WINDOW_HOURS , r.due_utc ]     # both ends INCLUSIVE
      candidate    := [ due_utc - SUBCERT_PREP_WINDOW_HOURS , due_utc ]
      occupants    := { r : r.member_id == member_id
                            AND r.status IN {PENDING, SUBMITTED}
                            AND window(r).start <= candidate.end
                            AND candidate.start <= window(r).end }     # touching endpoints DO overlap
      if count(occupants) >= MEMBER_CONCURRENT_SUBCERT_CAP: reject ERR_MEMBER_PREP_WINDOW_CAPACITY
      # EXCEPTION_NOTED, WITHDRAWN and VOID rows are NOT occupants: the leader has already delivered
      # or the assignment is gone.
    input_set: "SubCertificationRequest rows with the same member_id and status IN {PENDING, SUBMITTED}, across ALL cycles (the member's load is charter-wide, not cycle-scoped)"
    constants:
      SUBCERT_PREP_WINDOW_HOURS: 72
      MEMBER_CONCURRENT_SUBCERT_CAP: 2
    precision: "instant comparison at second resolution; both interval ends are inclusive, so two windows that meet at a single instant DO conflict"

  - name: milestone_window_conflict
    trigger: "POST /disclosure/reporting-cycles/{id}/milestones (evaluated before the row is persisted)"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN intervals with an ORDERING BUFFER on a ReportingCycle calendar — deliberately
      # different interval geometry from member_concurrent_subcert_load.
      window(m) := [ m.planned_start_utc , m.planned_end_utc )                  # end EXCLUSIVE
      # RULE A — same-kind exclusivity:
      siblings_same_kind := { m : m.cycle_id == cycle.id AND m.kind == kind
                                  AND m.status IN {PLANNED, IN_PROGRESS, COMPLETE, BREACHED} }
      if any s in siblings_same_kind with (candidate.start < window(s).end
                                           AND window(s).start < candidate.end):
          reject ERR_MILESTONE_WINDOW_OVERLAP
      # touching endpoints (candidate.start == window(s).end) do NOT overlap under half-open geometry.
      # RULE B — ordering buffer against the immediately preceding kind in MILESTONE_ORDER:
      predecessor_kind := the kind immediately before `kind` in MILESTONE_ORDER, or none for CLOSE
      if predecessor_kind is not none AND at least one milestone of predecessor_kind exists on the cycle:
          latest_pred_end := max(m.planned_end_utc for m of predecessor_kind on the cycle)
                             # tie-break when two predecessors share the same planned_end_utc:
                             # the value is identical, so the result is order-independent
          if candidate.start - latest_pred_end < MILESTONE_BUFFER_HOURS[predecessor_kind -> kind]:
              reject ERR_MILESTONE_BUFFER_VIOLATION
      # RULE C — deadline containment:
      if candidate.end > cycle.statutory_deadline_utc: reject ERR_MILESTONE_PAST_DEADLINE
    input_set: "Milestone rows of the same cycle; RULE A includes COMPLETE and BREACHED siblings (the calendar slot is historically occupied), RULE B reads planned_end_utc regardless of status"
    constants:
      MILESTONE_ORDER: [CLOSE, REVIEW, CERTIFICATION, FILING]
      MILESTONE_BUFFER_HOURS: { CLOSE_TO_REVIEW: 48, REVIEW_TO_CERTIFICATION: 48, CERTIFICATION_TO_FILING: 12 }
    precision: "instant comparison at second resolution; the buffer test is `>=` so a gap of exactly the required hours is accepted"

  - name: filing_accession_and_lateness
    trigger: "POST /disclosure/filings"
    algorithm: chronological
    formula: |
      prior_count := count of Filing rows with cycle_id == cycle.id created before this one
                     (ordered by created_at ASC; never by id)
      filing.form_type       := cycle.form_type
      filing.accession_label := cycle.form_type + "-" + cycle.fiscal_period_label + "-" + (prior_count + 1)
      filing.filed_utc       := current logical clock
      filing.late_flag       := (filing.filed_utc > cycle.statutory_deadline_utc)
    input_set: "all Filing rows of the cycle regardless of status, counted for the sequence suffix"
    constants: {}
    precision: "late_flag uses a strict `>` comparison, so a filing stamped exactly at statutory_deadline_utc is NOT late"

# =====================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty on every request except GET endpoints, which still require both"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the value of X-User-Role is one of the seven declared roles AND appears in the called endpoint's `roles:` list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "for every entity_backed role, X-User-ID resolves to an existing CommitteeMember row; the opaque role ComplianceAdmin is exempt"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all endpoints whose roles: list contains at least one entity_backed role"

  - priority: 4
    category: auth
    check: "the acting CommitteeMember satisfies the role's function gate: Controller requires function == FINANCE, LegalCounsel requires function == LEGAL, InvestorRelations requires function == INVESTOR_RELATIONS, CertifyingOfficer requires is_officer == true, DisclosureCommitteeChair requires voting == true, BusinessLeader accepts any function"
    error_id: ERR_MEMBER_FUNCTION_MISMATCH
    http_status: 403
    applies_to: "all endpoints whose roles: list contains at least one entity_backed role"

  - priority: 5
    category: auth
    check: "the `action` supplied on a multi-action transitions endpoint is permitted for the acting role: REQUEST_CHANGES and APPROVE on documents require Controller or LegalCounsel, SUBMIT_REVIEW additionally accepts InvestorRelations; DECLARE_FILING_READY on a cycle requires DisclosureCommitteeChair while OPEN_CLOSE / OPEN_REVIEW / OPEN_CERTIFICATION accept Controller or DisclosureCommitteeChair; WITHDRAW on a sub-certification requires DisclosureCommitteeChair while SUBMIT requires BusinessLeader"
    error_id: ERR_ROLE_ACTION_MISMATCH
    http_status: 403
    applies_to: "POST /disclosure/charters/{id}/transitions, POST /disclosure/committee-members/{id}/transitions, POST /disclosure/reporting-cycles/{id}/transitions, POST /disclosure/milestones/{id}/transitions, POST /disclosure/sub-certifications/{id}/transitions, POST /disclosure/documents/{id}/transitions, POST /disclosure/material-events/{id}/transitions, POST /disclosure/corrections/{id}/transitions"

  - priority: 6
    category: existence
    check: "every path parameter resolves to an existing row, validated left-to-right in path order"
    error_id: ERR_CHARTER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter; the emitted code is the *_NOT_FOUND variant of the segment that failed (ERR_CHARTER_NOT_FOUND, ERR_MEMBER_NOT_FOUND, ERR_CYCLE_NOT_FOUND, ERR_MILESTONE_NOT_FOUND, ERR_SUBCERT_NOT_FOUND, ERR_OFFICER_CERT_NOT_FOUND, ERR_DOCUMENT_NOT_FOUND, ERR_TIE_OUT_ITEM_NOT_FOUND, ERR_MEASURE_NOT_FOUND, ERR_QA_ITEM_NOT_FOUND, ERR_EVENT_NOT_FOUND, ERR_FILING_NOT_FOUND, ERR_CORRECTION_NOT_FOUND, ERR_DEFICIENCY_NOT_FOUND)"

  - priority: 7
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, validated in the order the fields are declared in the endpoint's input: list"
    error_id: ERR_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "POST /disclosure/reporting-cycles (charter_id), POST /disclosure/sub-certifications (cycle_id, member_id), POST /disclosure/officer-certifications (cycle_id, officer_member_id), POST /disclosure/documents (cycle_id, author_member_id), POST /disclosure/documents/{id}/tie-out-items (preparer_member_id), POST /disclosure/tie-out-items/{id}/review (reviewer_member_id), POST /disclosure/filings (cycle_id, document_id, amends_filing_id), POST /disclosure/material-events/{id}/transitions (linked_document_id), POST /disclosure/charters/{id}/transitions (successor_charter_id)"

  - priority: 8
    category: existence
    check: "request body parses, all required input fields are present, enum values are members of their declared domain, numeric fields are numbers, monetary and percentage fields are non-negative where the field description says so, ISO 8601 instants parse, and reconciliation_items is a list of objects each carrying `label` and `amount`"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 9
    category: existence
    check: "limit is an integer in [1, 200] and offset is an integer >= 0 on every list endpoint"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all GET list endpoints"

  - priority: 10
    category: state
    check: "expected_cycle_version equals the current ReportingCycle.version"
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
    applies_to: "POST /disclosure/documents"

  - priority: 11
    category: state
    check: "expected_document_version equals the current DraftDocument.version"
    error_id: ERR_STALE_DOCUMENT_VERSION
    http_status: 412
    applies_to: "POST /disclosure/documents/{id}/tie-out-items"

  - priority: 12
    category: state
    check: "the target entity is not already in one of the terminal_states its §1.2 machine declares: DisclosureCommitteeCharter SUPERSEDED; CommitteeMember VACATED; ReportingCycle ABANDONED on the status axis (the restatement_stage axis declares no terminal state); Milestone COMPLETE or BREACHED; SubCertificationRequest WITHDRAWN or VOID; OfficerCertification VOID; DraftDocument FILED or SUPERSEDED; TieOutItem WAIVED; MaterialEvent DISCLOSED or SUPERSEDED; Filing AMENDED_SUPERSEDED; PostFilingCorrection RESCINDED or CLOSED. ControlDeficiency is deliberately EXCLUDED from this generic test: its terminal states MITIGATED and REVERSED are reported by the domain-specific ERR_DEFICIENCY_ALREADY_MITIGATED at priority 38, so a second mitigation attempt never surfaces ERR_ENTITY_TERMINAL. AdjustedMeasure and QandAItem declare no terminal state, so an already-CLEARED question or an already-RECONCILED measure is rejected by priority 13 (ERR_INVALID_STATE) instead. SCOPE OF `the target entity`: it is the row the request path names, plus the row a creation endpoint writes into (the parent named in the body). It is NOT a row merely REFERENCED by a body field: on POST /disclosure/filings the targets are the ReportingCycle named by cycle_id and the DraftDocument named by document_id, while a Filing named by amends_filing_id that has already reached AMENDED_SUPERSEDED is reported by the domain-specific ERR_AMENDMENT_TARGET_INVALID at priority 37, never by ERR_ENTITY_TERMINAL."
    error_id: ERR_ENTITY_TERMINAL
    http_status: 409
    applies_to: "all mutation endpoints that act on an existing row"

  - priority: 13
    category: state
    check: "the requested transition is declared from the row's current state in §1.2, and the parent row is in a state that admits the write. Parent-state gates, exactly as §1.2 declares them: a ReportingCycle accepts Milestone creation in PLANNING or CLOSE_OPEN, DraftDocument creation and document SUBMIT_REVIEW in CLOSE_OPEN, REVIEW_OPEN or FILED (the amended report is prepared after the original filing), SubCertificationRequest creation in CLOSE_OPEN, REVIEW_OPEN or CERTIFICATION_OPEN, SubCertificationRequest SUBMIT in CLOSE_OPEN, REVIEW_OPEN or CERTIFICATION_OPEN, SubCertificationRequest WITHDRAW in any status other than FILED and AMENDED, Milestone START in CLOSE_OPEN, REVIEW_OPEN or CERTIFICATION_OPEN, OfficerCertification creation in any status other than ABANDONED, MaterialEvent creation in any status other than ABANDONED, and officer signing only in CERTIFICATION_OPEN; a DraftDocument accepts TieOutItem creation and tie-out review in DRAFT, IN_REVIEW, CHANGES_REQUESTED or APPROVED (a late-discovered tie-out break on an approved document is exactly what drives the HOP 3 cascade), but accepts AdjustedMeasure creation, QandAItem creation, measure reconciliation and question clearance only in DRAFT, IN_REVIEW or CHANGES_REQUESTED. ControlDeficiency mitigation is deliberately given NO parent-state gate in this rule: an OPEN deficiency exists only under an ASSESSED correction (RESCIND reverses every OPEN row, and mitigating the last OPEN row is what moves the correction to CLOSED), so the redundant gate is dropped and a mitigate call against a MITIGATED or REVERSED row surfaces the domain-specific ERR_DEFICIENCY_ALREADY_MITIGATED at priority 38 instead of being masked here"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all mutation endpoints"

  - priority: 14
    category: state
    check: "uniqueness — at most one non-VOID OfficerCertification per (cycle_id, cert_type), and at most one non-terminal SubCertificationRequest per (cycle_id, member_id, scope_area)"
    error_id: ERR_DUPLICATE_CERTIFICATION
    http_status: 409
    applies_to: "POST /disclosure/officer-certifications (ERR_DUPLICATE_CERTIFICATION), POST /disclosure/sub-certifications (ERR_DUPLICATE_SUBCERT)"

  - priority: 15
    category: state
    check: "the ReportingCycle's charter is in status ADOPTED at cycle creation and at every cycle status transition"
    error_id: ERR_CHARTER_NOT_ADOPTED
    http_status: 409
    applies_to: "POST /disclosure/reporting-cycles, POST /disclosure/reporting-cycles/{id}/transitions"

  - priority: 16
    category: business_referential
    check: "every CommitteeMember named in the request (member_id, officer_member_id, author_member_id, preparer_member_id, reviewer_member_id) belongs to the same charter as the ReportingCycle the write targets"
    error_id: ERR_MEMBER_CHARTER_MISMATCH
    http_status: 409
    applies_to: "POST /disclosure/sub-certifications, POST /disclosure/officer-certifications, POST /disclosure/documents, POST /disclosure/documents/{id}/tie-out-items, POST /disclosure/tie-out-items/{id}/review"

  - priority: 17
    category: business_referential
    check: "every CommitteeMember named in the request holds a usable seat: status == ACTIVE (RECUSED and VACATED are rejected), plus is_officer == true when the field is officer_member_id"
    error_id: ERR_MEMBER_SEAT_INVALID
    http_status: 409
    applies_to: "POST /disclosure/sub-certifications, POST /disclosure/officer-certifications, POST /disclosure/officer-certifications/{id}/sign, POST /disclosure/documents, POST /disclosure/documents/{id}/tie-out-items, POST /disclosure/tie-out-items/{id}/review, POST /disclosure/sub-certifications/{id}/transitions"

  - priority: 18
    category: business_safety
    check: "segregation of duties — the reviewer_member_id on a tie-out review differs from that item's preparer_member_id"
    error_id: ERR_SOD_SELF_REVIEW
    http_status: 409
    applies_to: "POST /disclosure/tie-out-items/{id}/review"

  - priority: 19
    category: business_safety
    check: "segregation of duties — the acting X-User-ID on a document APPROVE or REQUEST_CHANGES action differs from that document's author_member_id"
    error_id: ERR_SOD_SELF_APPROVAL
    http_status: 409
    applies_to: "POST /disclosure/documents/{id}/transitions"

  - priority: 20
    category: business_safety
    check: "segregation of duties — a CommitteeMember who already holds a non-VOID OfficerCertification on the cycle cannot also be assigned a SubCertificationRequest on that same cycle; an officer cannot sub-certify to itself"
    error_id: ERR_SOD_OFFICER_SUBCERT
    http_status: 409
    applies_to: "POST /disclosure/sub-certifications"

  - priority: 21
    category: business_safety
    check: "the charter has at least min_quorum_count ACTIVE voting CommitteeMember rows at the moment of the gate"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /disclosure/charters/{id}/transitions (action=ADOPT), POST /disclosure/reporting-cycles/{id}/transitions (action=DECLARE_FILING_READY), POST /disclosure/officer-certifications/{id}/sign"

  - priority: 22
    category: business_safety
    check: "every function named in the charter's required_functions is covered by at least one ACTIVE CommitteeMember of that function"
    error_id: ERR_FUNCTION_COVERAGE_GAP
    http_status: 409
    applies_to: "POST /disclosure/charters/{id}/transitions (action=ADOPT), POST /disclosure/reporting-cycles/{id}/transitions (action=DECLARE_FILING_READY)"

  - priority: 23
    category: business_safety
    check: "a document whose doc_type is EARNINGS_RELEASE or CALL_SCRIPT cannot be APPROVED with safe_harbor_present == false, and a CALL_SCRIPT cannot be APPROVED while it carries any QandAItem with requires_safe_harbor == true unless safe_harbor_present == true"
    error_id: ERR_SAFE_HARBOR_MISSING
    http_status: 409
    applies_to: "POST /disclosure/documents/{id}/transitions (action=APPROVE)"

  - priority: 24
    category: business_safety
    check: "a CALL_SCRIPT document cannot be APPROVED while its qa_gate_status is BLOCKED — per entities.DraftDocument.qa_gate_status the gate is BLOCKED exactly while some QandAItem on the script has risk_tier == HIGH AND status != CLEARED. An uncleared LOW or MEDIUM question does NOT block approval, and a question that merely carries requires_safe_harbor == true is BLOCKED as a row yet leaves the gate CLEARED — that case is handled by priority 23 (ERR_SAFE_HARBOR_MISSING) instead, and a script with zero questions reads CLEARED"
    error_id: ERR_QA_ITEM_UNCLEARED
    http_status: 409
    applies_to: "POST /disclosure/documents/{id}/transitions (action=APPROVE)"

  - priority: 25
    category: business_safety
    check: "a document cannot be APPROVED while measure_gate_status == BLOCKED_RECONCILIATION"
    error_id: ERR_MEASURE_NOT_RECONCILED
    http_status: 409
    applies_to: "POST /disclosure/documents/{id}/transitions (action=APPROVE)"

  - priority: 26
    category: business_safety
    check: "a document cannot be APPROVED while measure_gate_status == BLOCKED_PROMINENCE, i.e. while any AdjustedMeasure reconciles but presents the non-GAAP figure more prominently than the comparable GAAP figure"
    error_id: ERR_MEASURE_PROMINENCE
    http_status: 409
    applies_to: "POST /disclosure/documents/{id}/transitions (action=APPROVE)"

  - priority: 27
    category: business_safety
    check: "a document cannot be APPROVED while tie_out_status != PASSED — NOT_STARTED and FAILED both block, so a document with zero tie-out items can never be approved"
    error_id: ERR_TIE_OUT_NOT_PASSED
    http_status: 409
    applies_to: "POST /disclosure/documents/{id}/transitions (action=APPROVE)"

  - priority: 28
    category: business_safety
    check: "a cycle cannot be declared FILING_READY, and no OfficerCertification on it can be signed, while cycle.open_material_event_count > 0 (MaterialEvent rows in assessment_status UNASSESSED or REPORTABLE)"
    error_id: ERR_OPEN_MATERIAL_EVENT
    http_status: 409
    applies_to: "POST /disclosure/reporting-cycles/{id}/transitions (action=DECLARE_FILING_READY), POST /disclosure/officer-certifications/{id}/sign"

  - priority: 29
    category: business_safety
    check: "a MaterialEvent whose severity_score >= MATERIALITY_REPORTABLE_PCT (5.00) cannot be assessed NOT_REPORTABLE, and an event whose severity_score < 5.00 cannot be assessed REPORTABLE without a determination_note of at least 20 characters"
    error_id: ERR_EVENT_DETERMINATION_CONFLICT
    http_status: 409
    applies_to: "POST /disclosure/material-events/{id}/transitions (action=ASSESS)"

  - priority: 30
    category: business_safety
    check: "a cycle cannot be declared FILING_READY while cycle.unresolved_deficiency_weight > 0.00, and a cycle whose restatement_stage is UNDER_EVALUATION or RESTATEMENT_DECLARED cannot be declared FILING_READY; an amending Filing (amends_filing_id supplied) is likewise rejected while cycle.unresolved_deficiency_weight > 0.00"
    error_id: ERR_DEFICIENCY_OPEN
    http_status: 409
    applies_to: "POST /disclosure/reporting-cycles/{id}/transitions (action=DECLARE_FILING_READY), POST /disclosure/filings (only when amends_filing_id is supplied)"

  - priority: 31
    category: business_constraint
    check: "milestone_window_conflict RULE A — the candidate [planned_start_utc, planned_end_utc) does not overlap any existing milestone of the same kind on the cycle under half-open geometry"
    error_id: ERR_MILESTONE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /disclosure/reporting-cycles/{id}/milestones"

  - priority: 32
    category: business_constraint
    check: "milestone_window_conflict RULE B — the gap between the candidate's planned_start_utc and the latest planned_end_utc of the immediately preceding kind in MILESTONE_ORDER is at least MILESTONE_BUFFER_HOURS for that pair"
    error_id: ERR_MILESTONE_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /disclosure/reporting-cycles/{id}/milestones"

  - priority: 33
    category: business_constraint
    check: "the cycle carries a Milestone of the kind the transition requires, exactly as §1.2 declares it — OPEN_CLOSE requires a CLOSE milestone, OPEN_REVIEW requires a CLOSE milestone, OPEN_CERTIFICATION requires a REVIEW milestone, DECLARE_FILING_READY requires a FILING milestone (the CLOSE existence test at OPEN_REVIEW can only fail if OPEN_CLOSE was never taken, so it is a defensive restatement)"
    error_id: ERR_MILESTONE_MISSING
    http_status: 409
    applies_to: "POST /disclosure/reporting-cycles/{id}/transitions"

  - priority: 34
    category: business_constraint
    check: "the prerequisite Milestone is in status COMPLETE — OPEN_REVIEW requires the CLOSE milestone COMPLETE, OPEN_CERTIFICATION requires the REVIEW milestone COMPLETE"
    error_id: ERR_MILESTONE_INCOMPLETE
    http_status: 409
    applies_to: "POST /disclosure/reporting-cycles/{id}/transitions"

  - priority: 35
    category: business_constraint
    check: "successor_charter_id on a SUPERSEDE action names a different charter in status ADOPTED"
    error_id: ERR_SUCCESSOR_CHARTER_INVALID
    http_status: 409
    applies_to: "POST /disclosure/charters/{id}/transitions (action=SUPERSEDE)"

  - priority: 36
    category: business_constraint
    check: "the document named on a filing belongs to the same cycle, has doc_type PERIODIC_FILING and is in status APPROVED; on a material-event DISCLOSE the linked_document_id names a document on the same cycle with doc_type CURRENT_REPORT in status APPROVED"
    error_id: ERR_FILING_DOCUMENT_INVALID
    http_status: 409
    applies_to: "POST /disclosure/filings, POST /disclosure/material-events/{id}/transitions (action=DISCLOSE)"

  - priority: 37
    category: business_constraint
    check: "amends_filing_id, when supplied, names a Filing on the same cycle in status SUBMITTED; when omitted, the cycle must have no prior Filing. The supplied branch is the live one and is reachable two ways: a filing belonging to a different cycle, and — after Amendment No. 1 — the ORIGINAL filing, which is AMENDED_SUPERSEDED by then, so a second amendment must point at the most recent SUBMITTED filing. The omitted branch is DEFENSIVE ONLY: a cycle that already has a filing is in FILED or AMENDED, and a filing request with no amends_filing_id is not a declared edge from either state, so §1.4 priority 13 reports ERR_INVALID_STATE first and this clause can never surface"
    error_id: ERR_AMENDMENT_TARGET_INVALID
    http_status: 409
    applies_to: "POST /disclosure/filings"

  - priority: 38
    category: business_constraint
    check: "the ControlDeficiency is in status OPEN — a MITIGATED or REVERSED row cannot be mitigated again"
    error_id: ERR_DEFICIENCY_ALREADY_MITIGATED
    http_status: 409
    applies_to: "POST /disclosure/control-deficiencies/{id}/mitigate"

  - priority: 39
    category: business_temporal
    check: "milestone_window_conflict RULE C — the candidate planned_end_utc is at or before cycle.statutory_deadline_utc, and planned_start_utc is strictly before planned_end_utc"
    error_id: ERR_MILESTONE_PAST_DEADLINE
    http_status: 422
    applies_to: "POST /disclosure/reporting-cycles/{id}/milestones"

  - priority: 40
    category: business_temporal
    check: "the sub-certification due_utc is strictly after the current logical clock and at or before cycle.internal_target_utc"
    error_id: ERR_SUBCERT_DUE_OUT_OF_WINDOW
    http_status: 409
    applies_to: "POST /disclosure/sub-certifications"

  - priority: 41
    category: business_temporal
    check: "member_concurrent_subcert_load — the member has fewer than MEMBER_CONCURRENT_SUBCERT_CAP (2) sub-certifications in status PENDING or SUBMITTED whose closed 72-hour preparation windows intersect the candidate's window"
    error_id: ERR_MEMBER_PREP_WINDOW_CAPACITY
    http_status: 409
    applies_to: "POST /disclosure/sub-certifications"

  - priority: 42
    category: business_fiscal
    check: "the cycle has at least one SubCertificationRequest in status PENDING, SUBMITTED or EXCEPTION_NOTED before an OfficerCertification may be signed — an officer may not certify over an empty sub-certification scope even though the coverage percentage of an empty set reads 0.00"
    error_id: ERR_CERT_SCOPE_EMPTY
    http_status: 409
    applies_to: "POST /disclosure/officer-certifications/{id}/sign"

  - priority: 43
    category: business_fiscal
    check: "cycle.certification_coverage_pct is exactly COVERAGE_REQUIRED_PCT (100.00) before an OfficerCertification may be signed"
    error_id: ERR_CERT_COVERAGE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /disclosure/officer-certifications/{id}/sign"

  - priority: 44
    category: business_fiscal
    check: "every OfficerCertification on the cycle required by its form_type is in status SIGNED before the cycle may be declared FILING_READY and before a Filing may be created (FORM_10Q requires CEO_302 and CFO_302; FORM_10K additionally requires CEO_906 and CFO_906)"
    error_id: ERR_CERTIFICATIONS_INCOMPLETE
    http_status: 409
    applies_to: "POST /disclosure/reporting-cycles/{id}/transitions (action=DECLARE_FILING_READY), POST /disclosure/filings"

  - priority: 45
    category: business_fiscal
    check: "cycle.min_slack_days_business — the BUSINESS_DAY variant, not the calendar one — is at least REQUIRED_FILING_SLACK_BUSINESS_DAYS (1) when the cycle is declared FILING_READY"
    error_id: ERR_MILESTONE_SLACK_EXHAUSTED
    http_status: 409
    applies_to: "POST /disclosure/reporting-cycles/{id}/transitions (action=DECLARE_FILING_READY)"

# =====================================================================
# 1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---------- reads: charters and members ----------
  - method: GET
    path: "/disclosure/charters"
    description: "list disclosure committee charters, newest first by created_at DESC then id ASC"
    roles: [ComplianceAdmin, DisclosureCommitteeChair, Controller, LegalCounsel, InvestorRelations, CertifyingOfficer, BusinessLeader]
    code: 200
    input: ["status?", "superseded_by_charter_id?", "limit?", "offset?"]
    output: DisclosureCommitteeCharter[]
    side_effects: []

  - method: GET
    path: "/disclosure/charters/{id}"
    description: "fetch one charter including its computed active_voting_member_count and covered_functions"
    roles: [ComplianceAdmin, DisclosureCommitteeChair, Controller, LegalCounsel, InvestorRelations, CertifyingOfficer, BusinessLeader]
    code: 200
    input: []
    output: DisclosureCommitteeCharter
    side_effects: []

  - method: GET
    path: "/disclosure/committee-members"
    description: "list committee members, filterable by charter, function, seat status and officer flag"
    roles: [ComplianceAdmin, DisclosureCommitteeChair, Controller, LegalCounsel, InvestorRelations, CertifyingOfficer, BusinessLeader]
    code: 200
    input: ["charter_id?", "function?", "status?", "is_officer?", "limit?", "offset?"]
    output: CommitteeMember[]
    side_effects: []

  - method: GET
    path: "/disclosure/committee-members/{id}"
    description: "fetch one committee member"
    roles: [ComplianceAdmin, DisclosureCommitteeChair, Controller, LegalCounsel, InvestorRelations, CertifyingOfficer, BusinessLeader]
    code: 200
    input: []
    output: CommitteeMember
    side_effects: []

  # ---------- reads: cycles and milestones ----------
  - method: GET
    path: "/disclosure/reporting-cycles"
    description: "list reporting cycles, filterable by charter, workflow status and form type"
    roles: [ComplianceAdmin, DisclosureCommitteeChair, Controller, LegalCounsel, InvestorRelations, CertifyingOfficer, BusinessLeader]
    code: 200
    input: ["charter_id?", "status?", "form_type?", "limit?", "offset?"]
    output: ReportingCycle[]
    side_effects: []

  - method: GET
    path: "/disclosure/reporting-cycles/{id}"
    description: "fetch one reporting cycle with all computed calendar, coverage and deficiency roll-ups"
    roles: [ComplianceAdmin, DisclosureCommitteeChair, Controller, LegalCounsel, InvestorRelations, CertifyingOfficer, BusinessLeader]
    code: 200
    input: []
    output: ReportingCycle
    side_effects: []

  - method: GET
    path: "/disclosure/reporting-cycles/{id}/readiness"
    description: "computed read: the filing-readiness dashboard for one cycle, listing every gate that would block DECLARE_FILING_READY right now"
    roles: [ComplianceAdmin, DisclosureCommitteeChair, Controller, LegalCounsel, InvestorRelations, CertifyingOfficer]
    code: 200
    input: []
    output:
      cycle_id: string
      cycle_status: string
      restatement_stage: string
      statutory_deadline_utc: string
      internal_target_utc: string
      min_slack_days_calendar: integer
      min_slack_days_business: integer
      total_assigned_scope_weight: number
      certification_coverage_pct: number
      open_material_event_count: integer
      unresolved_deficiency_weight: number
      missing_milestone_kinds: string[]
      unsigned_cert_types: string[]
      blocking_error_ids: string[]
      filing_ready_eligible: boolean
    side_effects: ["runs the BREACHED milestone sweep and recomputes cycle_milestone_slack before answering, so min_slack_days_* reflect the current logical clock"]
    note: |
      DETERMINISTIC ORDERING of the three list fields, so the response is byte-comparable:
      missing_milestone_kinds lists only the kinds that some remaining status transition of this cycle
      requires and the cycle does not have, in MILESTONE_ORDER ([CLOSE, REVIEW, CERTIFICATION, FILING]);
      because §1.4 priority 33 never requires a CERTIFICATION milestone, that kind is never listed.
      unsigned_cert_types lists the cert_types required by the cycle's form_type that are not SIGNED, in
      the order [CEO_302, CFO_302, CEO_906, CFO_906]. blocking_error_ids lists the distinct error ids that
      DECLARE_FILING_READY would raise right now, in ASCENDING §1.4 priority order and de-duplicated, so
      the first element is exactly the code the transition would return. filing_ready_eligible is true if
      and only if blocking_error_ids is empty.

  - method: GET
    path: "/disclosure/reporting-cycles/{id}/milestones"
    description: "list the milestones of one cycle ordered by planned_start_utc ASC then created_at ASC"
    roles: [ComplianceAdmin, DisclosureCommitteeChair, Controller, LegalCounsel, InvestorRelations, CertifyingOfficer, BusinessLeader]
    code: 200
    input: ["kind?", "status?", "limit?", "offset?"]
    output: Milestone[]
    side_effects: []

  # ---------- reads: certifications ----------
  - method: GET
    path: "/disclosure/sub-certifications"
    description: "list sub-certification requests, filterable by cycle, member, status and scope area"
    roles: [ComplianceAdmin, DisclosureCommitteeChair, Controller, LegalCounsel, InvestorRelations, CertifyingOfficer, BusinessLeader]
    code: 200
    input: ["cycle_id?", "member_id?", "status?", "scope_area?", "limit?", "offset?"]
    output: SubCertificationRequest[]
    side_effects: []

  - method: GET
