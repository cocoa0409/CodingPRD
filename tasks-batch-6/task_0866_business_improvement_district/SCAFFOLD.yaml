# =============================================================================
# Business Improvement District (BID) Assessment — Seed Tables (SCAFFOLD.yaml)
# §1.0 – §1.7
# =============================================================================

scenario: |
  866. Business Improvement District (BID) Assessment: member-parcel & assessment
  formula, annual budget & work-plan, assessment on tax bill & collection, service
  (clean/safe/marketing) delivery, board & petition renewal, ambassador & 311
  linkage, financial reporting, dispute

domain_name: business-improvement-district
api_prefix: ""   # multiple top-level collections (/business-improvement-districts, /parcels, /fiscal-years, ...)

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: hybrid          # BID-rooted trees + cross-aggregate FKs (Assessment->Parcel, ServiceRequest->Ambassador)
  state_machine_shape: cyclic      # Dispute revision loop; RenewalPetition branching fork-join
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - many_to_many                 # PetitionSignature junction (Petition x Parcel)
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: BusinessImprovementDistrict
    parent: null
    common_fields: true            # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "District legal name" }
      - { name: boundary_description, type: string, source: input, description: "Prose description of district boundary" }
      - { name: authorization_expires_at, type: datetime, source: input, description: "ISO8601 UTC instant the district's assessment authorization lapses unless renewed" }
      - { name: assessment_weight_value, type: number, source: input, description: "Weight W_VALUE applied to (assessed_value_cents/100) in the parcel weighting formula" }
      - { name: assessment_weight_frontage, type: number, source: input, description: "Weight W_FRONTAGE applied to linear_frontage_ft" }
      - { name: assessment_weight_sqft, type: number, source: input, description: "Weight W_SQFT applied to building_sqft" }
      - { name: min_assessment_cents, type: integer, source: input, default: 50000, description: "Per-parcel assessment floor after weighting (non-exempt parcels)" }
      - { name: max_assessment_cents, type: integer, source: input, default: 10000000, description: "Per-parcel assessment cap after weighting" }
      - { name: status, type: enum, source: system, description: "FORMING | ACTIVE | RENEWAL_PENDING | EXPIRED", default: FORMING, constraints: "enum {FORMING, ACTIVE, RENEWAL_PENDING, EXPIRED}" }

  - name: Parcel
    parent: BusinessImprovementDistrict
    common_fields: true
    fields:
      - { name: bid_id, type: string, source: system, description: "FK -> BusinessImprovementDistrict.id; owning district" }
      - { name: apn, type: string, source: input, description: "Assessor Parcel Number; unique within its BID" }
      - { name: owner_name, type: string, source: input, description: "Property owner display name" }
      - { name: use_class, type: enum, source: input, description: "RETAIL | OFFICE | COMMERCIAL | MIXED | INDUSTRIAL | RESIDENTIAL_EXEMPT | NONPROFIT_EXEMPT", constraints: "enum" }
      - { name: assessed_value_cents, type: integer, source: input, description: "County-assessed market value in cents" }
      - { name: linear_frontage_ft, type: number, source: input, description: "Street frontage in feet" }
      - { name: building_sqft, type: number, source: input, description: "Gross building area in square feet" }
      - { name: exempt, type: boolean, source: computed, description: "true iff use_class in {RESIDENTIAL_EXEMPT, NONPROFIT_EXEMPT}; exempt parcels have weighted_base 0 and are excluded from the rate denominator" }
      - { name: weighted_base, type: number, source: computed, description: "Assessment weighting base; see calculation parcel_weighted_base" }
      - { name: status, type: enum, source: system, description: "ACTIVE | WITHDRAWN", default: ACTIVE, constraints: "enum {ACTIVE, WITHDRAWN}" }

  - name: FiscalYear
    parent: BusinessImprovementDistrict
    common_fields: true
    fields:
      - { name: bid_id, type: string, source: system, description: "FK -> BusinessImprovementDistrict.id" }
      - { name: year_label, type: string, source: input, description: "Human label e.g. FY2027" }
      - { name: start_date, type: datetime, source: input, description: "Fiscal year start (inclusive), ISO8601 UTC" }
      - { name: end_date, type: datetime, source: input, description: "Fiscal year end (exclusive), ISO8601 UTC; half-open interval [start_date, end_date)" }
      - { name: assessment_due_date, type: datetime, source: input, description: "Date the certified assessment is due on the tax bill" }
      - { name: budget_status, type: enum, source: computed, description: "NONE | DRAFT | PROPOSED | ADOPTED — mirrors the child Budget's status", default: NONE, constraints: "enum {NONE, DRAFT, PROPOSED, ADOPTED}" }
      - { name: total_certified_levy_cents, type: integer, source: computed, default: 0, description: "Sum of certified_amount_cents over CERTIFIED/ADJUSTED assessments in this fiscal year (round-per-parcel-then-sum)" }
      - { name: collected_to_date_cents, type: integer, source: computed, default: 0, description: "Cumulative cash collected net of refunds across this fiscal year's collection accounts" }
      - { name: collection_status, type: enum, source: computed, description: "OPEN | FULLY_COLLECTED", default: OPEN, constraints: "enum {OPEN, FULLY_COLLECTED}" }
      - { name: status, type: enum, source: system, description: "UPCOMING (before budget adopt) | ACTIVE (after budget adopt)", default: UPCOMING, constraints: "enum {UPCOMING, ACTIVE}" }

  - name: Budget
    parent: FiscalYear
    common_fields: true
    fields:
      - { name: fiscal_year_id, type: string, source: system, description: "FK -> FiscalYear.id; 1:1 — at most one Budget per FiscalYear" }
      - { name: total_expenditure_cents, type: integer, source: input, description: "Adopted spending ceiling; work-plan lines must sum EXACTLY to this at propose time" }
      - { name: other_revenue_cents, type: integer, source: input, description: "Non-assessment revenue (grants, sponsorships) offsetting the levy" }
      - { name: allocated_total_cents, type: integer, source: computed, default: 0, description: "Sum of child WorkPlanLine.allocated_amount_cents" }
      - { name: required_levy_cents, type: integer, source: computed, description: "= total_expenditure_cents - other_revenue_cents; must be >= 0" }
      - { name: estimate_rate, type: number, source: computed, description: "required_levy_cents / sum(weighted_base of ACTIVE non-exempt parcels) at PROPOSE time" }
      - { name: certified_rate, type: number, source: computed, description: "required_levy_cents / sum(weighted_base of ACTIVE non-exempt parcels) at ADOPT time" }
      - { name: proposed_at, type: datetime, source: system, description: "Timestamp of DRAFT->PROPOSED transition; null before", default: null }
      - { name: adopted_at, type: datetime, source: system, description: "Timestamp of PROPOSED->ADOPTED transition; null before", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | PROPOSED | ADOPTED", default: DRAFT, constraints: "enum {DRAFT, PROPOSED, ADOPTED}" }

  - name: WorkPlanLine
    parent: Budget
    common_fields: true
    fields:
      - { name: budget_id, type: string, source: system, description: "FK -> Budget.id" }
      - { name: category, type: enum, source: input, description: "CLEAN | SAFE | MARKETING | ADMIN | CONTINGENCY; unique per budget", constraints: "enum; unique(budget_id, category)" }
      - { name: allocated_amount_cents, type: integer, source: input, description: "Budgeted allocation for this service category" }
      - { name: spent_amount_cents, type: integer, source: computed, default: 0, description: "Cumulative service-delivery cost logged against this category" }

  - name: Assessment
    parent: FiscalYear
    common_fields: true
    fields:
      - { name: fiscal_year_id, type: string, source: system, description: "FK -> FiscalYear.id" }
      - { name: parcel_id, type: string, source: system, description: "FK -> Parcel.id" }
      - { name: weighted_base, type: number, source: computed, description: "Snapshot of the parcel's weighted_base captured when this assessment was generated" }
      - { name: estimated_amount_cents, type: integer, source: computed, description: "Provisional assessment computed at PROPOSE using estimate_rate (variant ESTIMATED)" }
      - { name: certified_amount_cents, type: integer, source: computed, default: null, description: "Final levied assessment; set at ADOPT (variant CERTIFIED); mutated by a RESOLVED_ADJUSTED dispute" }
      - { name: certified_at, type: datetime, source: system, default: null, description: "Timestamp of certification; anchors the dispute filing window" }
      - { name: status, type: enum, source: system, description: "ESTIMATED | CERTIFIED | ADJUSTED | CANCELLED", default: ESTIMATED, constraints: "enum {ESTIMATED, CERTIFIED, ADJUSTED, CANCELLED}" }

  - name: CollectionAccount
    parent: Assessment
    common_fields: true
    fields:
      - { name: assessment_id, type: string, source: system, description: "FK -> Assessment.id; 1:1 — created when the assessment is certified" }
      - { name: billed_amount_cents, type: integer, source: computed, description: "Principal billed; equals the assessment's certified_amount_cents, re-synced on dispute adjustment" }
      - { name: penalty_accrued_cents, type: integer, source: computed, default: 0, description: "One-time delinquency penalty (see delinquency_penalty_interest)" }
      - { name: interest_accrued_cents, type: integer, source: computed, default: 0, description: "Daily interest accrued through the current logical clock" }
      - { name: principal_paid_cents, type: integer, source: computed, default: 0, description: "Portion of payments applied to principal" }
      - { name: total_paid_cents, type: integer, source: computed, default: 0, description: "Sum of all payment amounts on this account" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Overpayment credit created by payments or by a downward dispute adjustment" }
      - { name: balance_due_cents, type: integer, source: computed, description: "principal_outstanding + penalty_accrued + interest_accrued - credit applied" }
      - { name: due_date, type: datetime, source: system, description: "Copied from the fiscal year's assessment_due_date at certification" }
      - { name: delinquent_since, type: datetime, source: system, default: null, description: "due_date when the account went DELINQUENT; null otherwise" }
      - { name: status, type: enum, source: system, description: "BILLED | DELINQUENT | PAID | CREDIT | WRITTEN_OFF", default: BILLED, constraints: "enum {BILLED, DELINQUENT, PAID, CREDIT, WRITTEN_OFF}" }

  - name: Payment
    parent: CollectionAccount
    common_fields: false           # id, created_at only — append-only ledger event
    fields:
      - { name: collection_account_id, type: string, source: system, description: "FK -> CollectionAccount.id" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents; must be > 0" }
      - { name: method, type: enum, source: input, default: TAX_ROLL, description: "TAX_ROLL | ACH | CHECK | CARD", constraints: "enum" }
      - { name: applied_to_interest_cents, type: integer, source: computed, description: "Waterfall allocation to accrued interest" }
      - { name: applied_to_penalty_cents, type: integer, source: computed, description: "Waterfall allocation to penalty" }
      - { name: applied_to_principal_cents, type: integer, source: computed, description: "Waterfall allocation to principal" }
      - { name: posted_at, type: datetime, source: system, description: "Logical-clock instant the payment posted; anchors final_payoff interest" }

  - name: Dispute
    parent: Assessment
    common_fields: true
    fields:
      - { name: assessment_id, type: string, source: system, description: "FK -> Assessment.id" }
      - { name: claimed_value_cents, type: integer, source: input, description: "Owner's asserted correct assessed market value" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Owner's requested corrected assessment amount" }
      - { name: resolved_amount_cents, type: integer, source: system, default: null, description: "Adjudicated assessment amount; set on RESOLVED_ADJUSTED" }
      - { name: reason, type: string, source: input, default: null, description: "Free-text basis of dispute" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock instant of filing" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "Instant of terminal resolution" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | RESOLVED_ADJUSTED | RESOLVED_DENIED | WITHDRAWN", default: SUBMITTED, constraints: "enum" }

  - name: RenewalPetition
    parent: BusinessImprovementDistrict
    common_fields: true
    fields:
      - { name: bid_id, type: string, source: system, description: "FK -> BusinessImprovementDistrict.id" }
      - { name: required_threshold_pct, type: number, source: input, default: 0.50, description: "Minimum weighted support fraction to pass verification (compared with >=)" }
      - { name: circulation_deadline, type: datetime, source: input, description: "Signatures accepted only strictly before this instant" }
      - { name: renewal_term_months, type: integer, source: input, default: 60, description: "Months added to authorization on approval" }
      - { name: weighted_support_pct, type: number, source: computed, default: null, description: "Assessment-weighted SUPPORT fraction computed at verification" }
      - { name: verified_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the BoardMember who verified; the approving vote MUST come from a different user (four-eyes SoD)" }
      - { name: status, type: enum, source: system, description: "CIRCULATING | SUBMITTED | VERIFIED | FAILED | APPROVED | REJECTED", default: CIRCULATING, constraints: "enum" }

  - name: PetitionSignature
    parent: RenewalPetition
    common_fields: false           # id, created_at only
    fields:
      - { name: petition_id, type: string, source: system, description: "FK -> RenewalPetition.id" }
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id; the signing parcel (one signature per parcel per petition)" }
      - { name: support, type: boolean, source: input, description: "true = SUPPORT renewal, false = OPPOSE" }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock instant of signature" }

  - name: Ambassador
    parent: BusinessImprovementDistrict
    common_fields: true
    fields:
      - { name: bid_id, type: string, source: system, description: "FK -> BusinessImprovementDistrict.id" }
      - { name: name, type: string, source: input, description: "Ambassador display name" }
      - { name: service_role, type: enum, source: input, description: "CLEAN | SAFE | OUTREACH", constraints: "enum" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: ACTIVE, constraints: "enum {ACTIVE, INACTIVE}" }

  - name: AmbassadorShift
    parent: Ambassador
    common_fields: true
    fields:
      - { name: ambassador_id, type: string, source: system, description: "FK -> Ambassador.id" }
      - { name: zone, type: string, source: input, description: "Coverage zone label" }
      - { name: start_at, type: datetime, source: input, description: "Shift start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Shift end (inclusive); shifts on one ambassador may not overlap and must be separated by SHIFT_BUFFER_MINUTES=30 minutes" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED", default: SCHEDULED, constraints: "enum {SCHEDULED, CANCELLED}" }

  - name: ServiceRequest
    parent: BusinessImprovementDistrict
    common_fields: true
    fields:
      - { name: bid_id, type: string, source: system, description: "FK -> BusinessImprovementDistrict.id" }
      - { name: assigned_ambassador_id, type: string, source: system, default: null, description: "FK -> Ambassador.id; null until ASSIGN" }
      - { name: category, type: enum, source: input, description: "CLEAN | SAFE | OTHER", constraints: "enum" }
      - { name: source, type: enum, source: input, description: "WALK_IN | PHONE | THREE_ONE_ONE | EMAIL", constraints: "enum" }
      - { name: external_ref, type: string, source: input, default: null, description: "External 311 ticket identifier for linkage" }
      - { name: description, type: string, source: input, default: null, description: "Issue description" }
      - { name: logged_cost_cents, type: integer, source: system, default: 0, description: "Service-delivery cost recorded at RESOLVE and posted to a WorkPlanLine" }
      - { name: work_plan_category, type: enum, source: system, default: null, description: "CLEAN | SAFE | MARKETING | ADMIN | CONTINGENCY the resolve cost was charged to" }
      - { name: status, type: enum, source: system, description: "OPEN | ASSIGNED | IN_PROGRESS | RESOLVED | CLOSED | CANCELLED", default: OPEN, constraints: "enum" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BusinessImprovementDistrict
    initial_state: FORMING
    terminal_states: [EXPIRED]
    transitions:
      - from: FORMING
        to: ACTIVE
        trigger: "POST /business-improvement-districts/{id}/activate"
        actor: BoardMember
        preconditions: ["At least one ACTIVE Parcel exists in the district", "authorization_expires_at is in the future relative to the logical clock"]
        side_effects: ["District may now accept fiscal years, budgets and petitions"]
      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: "POST /business-improvement-districts/{id}/renewal-petitions (create)"
        actor: DistrictAdministrator
        preconditions: ["No other RenewalPetition in CIRCULATING/SUBMITTED/VERIFIED for this district"]
        side_effects: ["A CIRCULATING RenewalPetition is created"]
      - from: RENEWAL_PENDING
        to: ACTIVE
        trigger: "POST /renewal-petitions/{id}/vote (decision=APPROVE)"
        actor: BoardMember
        preconditions: ["Petition status VERIFIED", "voting BoardMember X-User-ID != petition.verified_by_user_id"]
        side_effects: ["authorization_expires_at extended by renewal_term_months", "petition -> APPROVED"]
      - from: RENEWAL_PENDING
        to: EXPIRED
        trigger: "POST /renewal-petitions/{id}/vote (decision=REJECT) or POST /renewal-petitions/{id}/verify yielding FAILED"
        actor: BoardMember
        preconditions: ["Petition resolved to REJECTED or FAILED"]
        side_effects: ["District can no longer adopt new budgets or open petitions (terminal)"]

  - entity: Budget
    initial_state: DRAFT
    terminal_states: [ADOPTED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /budgets/{id}/propose"
        actor: DistrictAdministrator
        preconditions:
          - "allocated_total_cents == total_expenditure_cents (else ERR_BUDGET_UNBALANCED)"
          - "required_levy_cents >= 0 (else ERR_NEGATIVE_LEVY)"
          - "At least one ACTIVE non-exempt Parcel exists"
        side_effects:
          - "Compute estimate_rate = required_levy_cents / sum(weighted_base of ACTIVE non-exempt parcels)"
          - "For each ACTIVE non-exempt Parcel: create Assessment(status=ESTIMATED) with estimated_amount_cents (variant ESTIMATED)"
          - "FiscalYear.budget_status = PROPOSED; set proposed_at; increments Budget.version by 1"
      - from: PROPOSED
        to: DRAFT
        trigger: "POST /budgets/{id}/revert"
        actor: DistrictAdministrator
        preconditions: ["Budget PROPOSED"]
        side_effects: ["Delete all ESTIMATED Assessments for the fiscal year", "FiscalYear.budget_status = DRAFT; increments Budget.version by 1"]
      - from: PROPOSED
        to: ADOPTED
        trigger: "POST /budgets/{id}/adopt"
        actor: BoardMember
        preconditions:
          - "Owning BusinessImprovementDistrict.status == ACTIVE (else ERR_BID_NOT_ACTIVE) [cross-entity]"
          - "Budget PROPOSED"
        side_effects:
          - "CASCADE hop1: Compute certified_rate over ACTIVE non-exempt parcels at adopt time; each ESTIMATED Assessment whose parcel is still ACTIVE -> CERTIFIED with certified_amount_cents, certified_at=clock (variant CERTIFIED); an ESTIMATED assessment whose parcel was WITHDRAWN since PROPOSE -> CANCELLED (not certified, no CollectionAccount)"
          - "CASCADE hop2: each Assessment certification creates its CollectionAccount(status=BILLED, billed_amount_cents=certified_amount_cents, due_date=fiscal_year.assessment_due_date)"
          - "FiscalYear.total_certified_levy_cents = round-per-parcel-then-sum of certified_amount_cents; budget_status=ADOPTED; FiscalYear.status=ACTIVE; set adopted_at; increments Budget.version by 1"

  - entity: Assessment
    initial_state: ESTIMATED
    terminal_states: [CANCELLED]
    transitions:
      - from: ESTIMATED
        to: CERTIFIED
        trigger: "system: Budget PROPOSED->ADOPTED cascade"
        actor: system
        preconditions: ["Owning Budget transitioning to ADOPTED", "parcel.status == ACTIVE"]
        side_effects: ["Set certified_amount_cents, certified_at", "Create child CollectionAccount (BILLED)"]
      - from: ESTIMATED
        to: CANCELLED
        trigger: "system: Budget adopt when the assessment's parcel was withdrawn after PROPOSE"
        actor: system
        preconditions: ["Owning Budget transitioning to ADOPTED", "parcel.status == WITHDRAWN"]
        side_effects: ["No CollectionAccount created; excluded from total_certified_levy"]
      - from: CERTIFIED
        to: ADJUSTED
        trigger: "system: Dispute RESOLVED_ADJUSTED cascade"
        actor: system
        preconditions: ["A Dispute on this assessment resolved with decision ADJUSTED"]
        side_effects:
          - "certified_amount_cents = dispute.resolved_amount_cents"
          - "CASCADE: re-sync child CollectionAccount.billed_amount_cents and recompute balance_due_cents"
          - "CASCADE: adjust FiscalYear.total_certified_levy_cents by the delta"
      - from: CERTIFIED
        to: CANCELLED
        trigger: "system: Parcel withdrawn after certification"
        actor: system
        preconditions: ["Owning Parcel transitioned ACTIVE->WITHDRAWN while assessment CERTIFIED and its CollectionAccount has zero payments"]
        side_effects: ["Child CollectionAccount -> WRITTEN_OFF", "reduce FiscalYear.total_certified_levy_cents by certified_amount_cents"]

  - entity: CollectionAccount
    initial_state: BILLED
    terminal_states: [WRITTEN_OFF]
    transitions:
      - from: BILLED
        to: DELINQUENT
        trigger: "POST /collection-accounts/{id}/assess-delinquency"
        actor: TaxCollector
        preconditions: ["logical clock day-count past due_date > GRACE_DAYS (strict)", "balance_due_cents > 0"]
        side_effects: ["Apply one-time penalty_accrued_cents = round_half_up(billed_amount_cents * PENALTY_PCT)", "set delinquent_since = due_date"]
      - from: BILLED
        to: PAID
        trigger: "POST /collection-accounts/{id}/payments"
        actor: TaxCollector
        preconditions: ["Payment clears full balance_due_cents (waterfall)"]
        side_effects:
          - "CASCADE hop1: allocate payment (interest->penalty->principal); principal_outstanding -> 0; status PAID"
          - "CASCADE hop2: FiscalYear.collected_to_date_cents += amount; if collected_to_date_cents >= total_certified_levy_cents then FiscalYear.collection_status = FULLY_COLLECTED"
      - from: DELINQUENT
        to: PAID
        trigger: "POST /collection-accounts/{id}/payments"
        actor: TaxCollector
        preconditions: ["Payment clears interest + penalty + principal"]
        side_effects: ["Same waterfall + FiscalYear ledger cascade as BILLED->PAID"]
      - from: BILLED
        to: CREDIT
        trigger: "POST /collection-accounts/{id}/payments (overpayment) or Dispute downward adjustment after full payment"
        actor: TaxCollector
        preconditions: ["total_paid_cents > billed_amount_cents + penalty + interest"]
        side_effects: ["credit_balance_cents = overpayment; FiscalYear.collected_to_date_cents reflects net (payments - refunds)"]
      - from: DELINQUENT
        to: WRITTEN_OFF
        trigger: "POST /collection-accounts/{id}/write-off"
        actor: TaxCollector
        preconditions: ["Account DELINQUENT"]
        side_effects: ["balance_due_cents frozen; excluded from FiscalYear collection_status re-evaluation"]

  - entity: Dispute
    initial_state: SUBMITTED
    terminal_states: [RESOLVED_ADJUSTED, RESOLVED_DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /disputes/{id}/transition (action=REVIEW)"
        actor: DistrictAdministrator
        preconditions: ["Dispute SUBMITTED"]
        side_effects: []
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /disputes/{id}/transition (action=REQUEST_INFO)"
        actor: DistrictAdministrator
        preconditions: ["Dispute UNDER_REVIEW"]
        side_effects: []
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /disputes/{id}/transition (action=RESPOND)"
        actor: PropertyOwner
        preconditions: ["Dispute INFO_REQUESTED", "acting owner owns the assessment's parcel"]
        side_effects: ["Revision loop: review may cycle INFO_REQUESTED<->UNDER_REVIEW any number of times"]
      - from: UNDER_REVIEW
        to: RESOLVED_ADJUSTED
        trigger: "POST /disputes/{id}/transition (action=RESOLVE, decision=ADJUSTED)"
        actor: DistrictAdministrator
        preconditions: ["Dispute UNDER_REVIEW", "0 <= resolved_amount_cents <= assessment.certified_amount_cents (else ERR_ADJUSTMENT_EXCEEDS_ASSESSMENT)"]
        side_effects:
          - "resolved_amount_cents set; resolved_at=clock"
          - "CASCADE hop1: linked Assessment CERTIFIED->ADJUSTED, certified_amount_cents := resolved_amount_cents"
          - "CASCADE hop2: linked CollectionAccount.billed_amount_cents re-synced; if now overpaid -> status CREDIT + credit_balance_cents, refund recorded"
          - "CASCADE hop3: FiscalYear.total_certified_levy_cents and collected_to_date_cents adjusted by the deltas"
      - from: UNDER_REVIEW
        to: RESOLVED_DENIED
        trigger: "POST /disputes/{id}/transition (action=RESOLVE, decision=DENIED)"
        actor: DistrictAdministrator
        preconditions: ["Dispute UNDER_REVIEW"]
        side_effects: ["resolved_at=clock; assessment unchanged"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/transition (action=WITHDRAW)"
        actor: PropertyOwner
        preconditions: ["Dispute SUBMITTED or UNDER_REVIEW or INFO_REQUESTED", "acting owner owns the assessment's parcel"]
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/transition (action=WITHDRAW)"
        actor: PropertyOwner
        preconditions: ["acting owner owns the assessment's parcel"]
        side_effects: []
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/transition (action=WITHDRAW)"
        actor: PropertyOwner
        preconditions: ["acting owner owns the assessment's parcel"]
        side_effects: []

  - entity: RenewalPetition
    initial_state: CIRCULATING
    terminal_states: [FAILED, APPROVED, REJECTED]
    transitions:
      - from: CIRCULATING
        to: SUBMITTED
        trigger: "POST /renewal-petitions/{id}/submit"
        actor: DistrictAdministrator
        preconditions: ["Petition CIRCULATING", "logical clock strictly before circulation_deadline (else ERR_PETITION_DEADLINE_PASSED)"]
        side_effects: ["Signature collection closes"]
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /renewal-petitions/{id}/verify"
        actor: BoardMember
        preconditions: ["Petition SUBMITTED", "weighted_support_pct >= required_threshold_pct (>=)"]
        side_effects: ["Compute weighted_support_pct (petition_weighted_support); set verified_by_user_id = acting X-User-ID"]
      - from: SUBMITTED
        to: FAILED
        trigger: "POST /renewal-petitions/{id}/verify"
        actor: BoardMember
        preconditions: ["Petition SUBMITTED", "weighted_support_pct < required_threshold_pct"]
        side_effects: ["Compute weighted_support_pct; BID RENEWAL_PENDING -> EXPIRED"]
      - from: VERIFIED
        to: APPROVED
        trigger: "POST /renewal-petitions/{id}/vote (decision=APPROVE)"
        actor: BoardMember
        preconditions: ["Petition VERIFIED", "acting X-User-ID != verified_by_user_id (else ERR_SEGREGATION_OF_DUTIES) [four-eyes SoD]"]
        side_effects: ["BID authorization_expires_at extended by renewal_term_months; BID -> ACTIVE"]
      - from: VERIFIED
        to: REJECTED
        trigger: "POST /renewal-petitions/{id}/vote (decision=REJECT)"
        actor: BoardMember
        preconditions: ["Petition VERIFIED", "acting X-User-ID != verified_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["BID RENEWAL_PENDING -> EXPIRED"]

  - entity: ServiceRequest
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /service-requests/{id}/transition (action=ASSIGN)"
        actor: DistrictAdministrator
        preconditions: ["ServiceRequest OPEN", "target Ambassador exists in same BID and status ACTIVE (else ERR_AMBASSADOR_NOT_ACTIVE) [cross-entity]"]
        side_effects: ["assigned_ambassador_id set"]
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /service-requests/{id}/transition (action=START)"
        actor: Ambassador
        preconditions: ["ServiceRequest ASSIGNED", "acting Ambassador X-User-ID == assigned_ambassador_id"]
        side_effects: []
      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /service-requests/{id}/transition (action=RESOLVE)"
        actor: Ambassador
        preconditions: ["ServiceRequest IN_PROGRESS", "acting Ambassador X-User-ID == assigned_ambassador_id", "BID has an ADOPTED budget with a WorkPlanLine matching work_plan_category"]
        side_effects: ["logged_cost_cents, work_plan_category set", "CASCADE: matching WorkPlanLine.spent_amount_cents += logged_cost_cents (workplan_spend_reconciliation)"]
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /service-requests/{id}/transition (action=CLOSE)"
        actor: DistrictAdministrator
        preconditions: ["ServiceRequest RESOLVED"]
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /service-requests/{id}/transition (action=CANCEL)"
        actor: DistrictAdministrator
        preconditions: ["ServiceRequest OPEN or ASSIGNED"]
        side_effects: []
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /service-requests/{id}/transition (action=CANCEL)"
        actor: DistrictAdministrator
        preconditions: ["ServiceRequest OPEN or ASSIGNED"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: workplan-reallocate-stale-budget
    parent_entity: Budget
    write_endpoint: "POST /budgets/{id}/reallocations"
    occ_field: "expected_budget_version"
    description: |
      A reallocation moves cents from one WorkPlanLine to another and must preserve
      the balanced allocation total. Because each reallocation is computed against the
      caller's last-observed budget total, a reallocation carrying a stale
      expected_budget_version (a sibling reallocation already advanced the budget) is
      rejected to prevent a lost update to the allocation invariant.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: parcel_weighted_base
    trigger: "on Parcel create/update, and snapshotted at assessment generation"
    algorithm: weighted_scoring
    formula: |
      if parcel.exempt: weighted_base = 0
      else:
        base_points = W_VALUE   * (assessed_value_cents / 100)
                    + W_FRONTAGE * linear_frontage_ft
                    + W_SQFT     * building_sqft
        weighted_base = base_points * USE_CLASS_MULTIPLIER[use_class]
      # W_VALUE, W_FRONTAGE, W_SQFT are the BID's assessment_weight_* inputs.
    constants:
      USE_CLASS_MULTIPLIER: { RETAIL: 1.25, MIXED: 1.15, OFFICE: 1.10, COMMERCIAL: 1.00, INDUSTRIAL: 0.90, RESIDENTIAL_EXEMPT: 0, NONPROFIT_EXEMPT: 0 }
    precision: "weighted_base carries full precision; assessments round downstream"
    input_set: "single parcel"

  - name: certify_assessment
    trigger: "Budget PROPOSED->ADOPTED (CERTIFIED) and PROPOSE (ESTIMATED)"
    algorithm: tiered_pricing
    formula: |
      denom = sum(weighted_base for Parcel in BID where status=ACTIVE and exempt=false)  # evaluated at the trigger instant
      rate  = required_levy_cents / denom          # estimate_rate at PROPOSE, certified_rate at ADOPT
      raw   = rate * parcel.weighted_base
      amount_cents = min(max(round_half_up(raw), MIN_ASSESSMENT_CENTS), MAX_ASSESSMENT_CENTS)
      if parcel.exempt: amount_cents = 0
      # >=3 inputs (assessed_value, frontage, sqft) fold into weighted_base; non-linear via
      # USE_CLASS_MULTIPLIER branch AND nested min/max clamp.
    constants:
      MIN_ASSESSMENT_CENTS: "BID.min_assessment_cents (default 50000)"
      MAX_ASSESSMENT_CENTS: "BID.max_assessment_cents (default 10000000)"
    precision: "2 decimals (whole cents), round_half_up on raw before clamp"
    input_set: "all ACTIVE non-exempt parcels contribute to denom; per-parcel output"
    variants:
      - name: ESTIMATED
        when: "at Budget PROPOSE"
        difference: "denom + rate use the parcel set and required_levy AS OF propose time; stored in estimated_amount_cents"
      - name: CERTIFIED
        when: "at Budget ADOPT"
        difference: "denom + rate re-evaluated AS OF adopt time (parcels may have withdrawn), giving a different rate and a different per-parcel amount; stored in certified_amount_cents"

  - name: levy_rounding_order
    trigger: "Budget ADOPT (certification) and any dispute adjustment"
    algorithm: aggregation
    formula: |
      # Pinned order: round EACH parcel's assessment to whole cents FIRST, THEN sum.
      total_certified_levy_cents = SUM over assessments in {CERTIFIED, ADJUSTED} of certified_amount_cents
      # NOT sum(raw rate*weighted_base) then round — the two orders differ in cents.
    constants: {}
    precision: "per-parcel round_half_up, then integer sum"
    input_set: "assessments in fiscal year with status in {CERTIFIED, ADJUSTED} (excludes CANCELLED)"

  - name: delinquency_penalty_interest
    trigger: "assess-delinquency, payoff-quote read, and payment posting"
    algorithm: decay_function
    formula: |
      day_count(as_of) = max(0, floor((as_of - due_date) / 1 day))    # whole calendar days
      is_delinquent    = day_count(clock_now) > GRACE_DAYS            # STRICT >
      penalty_cents    = round_half_up(billed_amount_cents * PENALTY_PCT)   # applied once at delinquency
      principal_outstanding = billed_amount_cents - principal_paid_cents
      interest_cents(as_of) = round_half_up(principal_outstanding * DAILY_INTEREST_RATE * day_count(as_of))
      balance_due(as_of)    = principal_outstanding + penalty_accrued_cents + interest_cents(as_of) - credit_balance_cents
    constants:
      GRACE_DAYS: 30
      PENALTY_PCT: 0.10
      DAILY_INTEREST_RATE: 0.0005
    precision: "round_half_up to whole cents on penalty and interest independently"
    input_set: "single collection account"
    variants:
      - name: payoff_quote
        when: "GET /collection-accounts/{id}/payoff-quote?as_of_date=..."
        difference: "as_of = client-supplied as_of_date (a future projection); interest computed to that date without mutating the account"
      - name: final_payoff
        when: "POST /collection-accounts/{id}/payments"
        difference: "as_of = posted_at (logical clock now); interest is realized and the payment is applied"

  - name: payment_waterfall_allocation
    trigger: "POST /collection-accounts/{id}/payments"
    algorithm: waterfall_allocation
    formula: |
      remaining = amount_cents
      applied_to_interest_cents  = min(remaining, interest_accrued_cents);  remaining -= applied_to_interest_cents
      applied_to_penalty_cents   = min(remaining, penalty_accrued_cents);   remaining -= applied_to_penalty_cents
      applied_to_principal_cents = min(remaining, principal_outstanding);   remaining -= applied_to_principal_cents
      principal_paid_cents += applied_to_principal_cents
      total_paid_cents     += amount_cents
      if remaining > 0: credit_balance_cents += remaining      # overpayment
      if principal_outstanding == 0 and penalty and interest cleared: status = PAID
    constants: {}
    precision: "integer cents; fixed order interest -> penalty -> principal"
    input_set: "single account; buckets consumed in the pinned order"

  - name: petition_weighted_support
    trigger: "POST /renewal-petitions/{id}/verify"
    algorithm: weighted_scoring
    formula: |
      # Basis fiscal year selector: candidate set = FiscalYears under the BID whose Budget.status == ADOPTED;
      #   rank by end_date DESC; tie-break created_at DESC; fallback = none -> weighted_support_pct 0 -> FAILED.
      total_weight   = sum(certified_amount_cents for Assessment in basis FY with status in {CERTIFIED, ADJUSTED})
      support_weight = sum(certified_amount_cents for those assessments whose parcel has a PetitionSignature
                           on this petition with support=true)
      weighted_support_pct = (total_weight == 0) ? 0 : support_weight / total_weight
      pass = weighted_support_pct >= required_threshold_pct          # STRICT >= boundary
    constants: {}
    precision: "ratio kept to 4 decimals for comparison"
    input_set: "signatures with support=true; deduplicated one-per-parcel"

  - name: workplan_spend_reconciliation
    trigger: "ServiceRequest IN_PROGRESS->RESOLVED"
    algorithm: aggregation
    formula: |
      # target line selector: the ADOPTED Budget of the BID's basis fiscal year (same selector as petition_weighted_support),
      #   WorkPlanLine where category == work_plan_category; fallback = none -> ERR_WORK_PLAN_LINE_NOT_FOUND.
      line.spent_amount_cents += logged_cost_cents
      # financial report: for each category, variance = allocated_amount_cents - spent_amount_cents
    constants: {}
    precision: "integer cents"
    input_set: "single work-plan line per resolve"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 2, category: auth, check: "Role is permitted to invoke this endpoint per §1.7", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: all }
  - { priority: 3, category: auth, check: "For entity_backed roles acting on an owned resource, X-User-ID matches the resource's owning FK (PropertyOwner==parcel, Ambassador==assigned_ambassador_id)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "payments, dispute transition (RESPOND/WITHDRAW), petition signatures, service-request START/RESOLVE" }
  - { priority: 4, category: existence, check: "All path/body-referenced resources exist (validated left-to-right)", error_id: "ERR_*_NOT_FOUND", http_status: 404, applies_to: all }
  - { priority: 5, category: state, check: "Target resource is in a state from which the requested transition is defined", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 5, category: state, check: "Dispute must be non-terminal (SUBMITTED/UNDER_REVIEW/INFO_REQUESTED) to accept a transition", error_id: ERR_DISPUTE_NOT_OPEN, http_status: 409, applies_to: "POST /disputes/{id}/transition" }
  - { priority: 5, category: state, check: "assess-delinquency requires BILLED; write-off requires DELINQUENT", error_id: ERR_ACCOUNT_NOT_DELINQUENT, http_status: 409, applies_to: "collection-accounts write-off / assess-delinquency" }
  - { priority: 6, category: business_safety, check: "Approving/rejecting vote must be cast by a BoardMember whose X-User-ID differs from petition.verified_by_user_id (four-eyes SoD)", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /renewal-petitions/{id}/vote" }
  - { priority: 7, category: business_referential, check: "At most one Budget per FiscalYear", error_id: ERR_BUDGET_EXISTS, http_status: 409, applies_to: "POST /fiscal-years/{id}/budget" }
  - { priority: 7, category: business_referential, check: "At most one non-terminal Dispute per Assessment", error_id: ERR_DISPUTE_ALREADY_OPEN, http_status: 409, applies_to: "POST /assessments/{id}/disputes" }
  - { priority: 7, category: business_referential, check: "At most one PetitionSignature per (petition, parcel)", error_id: ERR_ALREADY_SIGNED, http_status: 409, applies_to: "POST /renewal-petitions/{id}/signatures" }
  - { priority: 7, category: business_referential, check: "WorkPlanLine.category unique within a Budget", error_id: ERR_DUPLICATE_CATEGORY, http_status: 409, applies_to: "POST /budgets/{id}/work-plan-lines" }
  - { priority: 7, category: business_referential, check: "Signing parcel must belong to the petition's BID and be ACTIVE", error_id: ERR_PARCEL_NOT_IN_DISTRICT, http_status: 409, applies_to: "POST /renewal-petitions/{id}/signatures" }
  - { priority: 8, category: business_temporal, check: "Dispute filed within DISPUTE_WINDOW_DAYS=45 days after assessment.certified_at (strictly after that instant it is closed)", error_id: ERR_DISPUTE_WINDOW_CLOSED, http_status: 422, applies_to: "POST /assessments/{id}/disputes" }
  - { priority: 8, category: business_temporal, check: "Petition signatures/submit only strictly before circulation_deadline", error_id: ERR_PETITION_DEADLINE_PASSED, http_status: 422, applies_to: "petition signatures / submit" }
  - { priority: 9, category: business_constraint, check: "New FiscalYear [start_date,end_date) must not overlap an existing fiscal year of the same BID (half-open; adjacency end==next start allowed)", error_id: ERR_FISCAL_YEAR_OVERLAP, http_status: 409, applies_to: "POST /business-improvement-districts/{id}/fiscal-years" }
  - { priority: 9, category: business_constraint, check: "New AmbassadorShift [start_at,end_at] must not overlap and the gap to any SCHEDULED shift of the same ambassador must be >= SHIFT_BUFFER_MINUTES=30 minutes (closed intervals + buffer gap)", error_id: ERR_SHIFT_OVERLAP, http_status: 409, applies_to: "POST /ambassadors/{id}/shifts" }
  - { priority: 9, category: business_constraint, check: "At propose, sum(WorkPlanLine.allocated_amount_cents) must equal total_expenditure_cents exactly", error_id: ERR_BUDGET_UNBALANCED, http_status: 422, applies_to: "POST /budgets/{id}/propose" }
  - { priority: 9, category: business_constraint, check: "Reallocation amount must not exceed the source line's allocated_amount_cents", error_id: ERR_INVALID_REALLOCATION, http_status: 422, applies_to: "POST /budgets/{id}/reallocations" }
  - { priority: 10, category: business_fiscal, check: "required_levy_cents (= total_expenditure - other_revenue) must be >= 0 at propose", error_id: ERR_NEGATIVE_LEVY, http_status: 422, applies_to: "POST /budgets/{id}/propose" }
  - { priority: 10, category: business_fiscal, check: "Dispute resolved_amount_cents must satisfy 0 <= amount <= assessment.certified_amount_cents", error_id: ERR_ADJUSTMENT_EXCEEDS_ASSESSMENT, http_status: 422, applies_to: "POST /disputes/{id}/transition (RESOLVE ADJUSTED)" }
  - { priority: 11, category: state, check: "Cross-entity: Budget adopt requires owning BID.status == ACTIVE", error_id: ERR_BID_NOT_ACTIVE, http_status: 409, applies_to: "POST /budgets/{id}/adopt, POST /business-improvement-districts/{id}/renewal-petitions" }
  - { priority: 11, category: state, check: "Cross-entity: filing a Dispute requires assessment.status == CERTIFIED", error_id: ERR_ASSESSMENT_NOT_CERTIFIED, http_status: 409, applies_to: "POST /assessments/{id}/disputes" }
  - { priority: 11, category: state, check: "Cross-entity: assigning a ServiceRequest requires target Ambassador.status == ACTIVE", error_id: ERR_AMBASSADOR_NOT_ACTIVE, http_status: 409, applies_to: "POST /service-requests/{id}/transition (ASSIGN)" }
  - { priority: 12, category: business_constraint, check: "OCC: expected_budget_version must match current Budget.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /budgets/{id}/reallocations" }
  - { priority: 13, category: business_constraint, check: "Body field types/enums/required fields well-formed; amounts > 0 where required", error_id: ERR_VALIDATION, http_status: 422, applies_to: all }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an absolute ISO8601 UTC instant. Server startup default is 2026-05-01T00:00:00Z; before any call here the clock reads exactly this default and never falls back to wall-clock time."
    roles: [DistrictAdministrator, BoardMember, TaxCollector]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["All deadline/window/accrual computations read this clock"]

  # ---- BusinessImprovementDistrict ----
  - method: POST
    path: "/business-improvement-districts"
    description: "Create a district (FORMING)"
    roles: [DistrictAdministrator]
    code: 201
    input: [name, boundary_description, authorization_expires_at, assessment_weight_value, assessment_weight_frontage, assessment_weight_sqft, "min_assessment_cents?", "max_assessment_cents?"]
    output: BusinessImprovementDistrict
    side_effects: ["status=FORMING; version=1"]
  - method: GET
    path: "/business-improvement-districts/{id}"
    description: "Get a district"
    roles: [DistrictAdministrator, BoardMember, TaxCollector, PropertyOwner, Ambassador]
    code: 200
    input: []
    output: BusinessImprovementDistrict
    side_effects: []
  - method: POST
    path: "/business-improvement-districts/{id}/activate"
    description: "Activate a FORMING district"
    roles: [BoardMember]
    code: 200
    input: []
    output: BusinessImprovementDistrict
    side_effects: ["FORMING->ACTIVE"]

  # ---- Parcel ----
  - method: POST
    path: "/business-improvement-districts/{id}/parcels"
    description: "Register a member parcel"
    roles: [DistrictAdministrator]
    code: 201
    input: [apn, owner_name, use_class, assessed_value_cents, linear_frontage_ft, building_sqft]
    output: Parcel
    side_effects: ["compute exempt + weighted_base; status=ACTIVE"]
  - method: GET
    path: "/business-improvement-districts/{id}/parcels"
    description: "List parcels of a district (reverse-reach Parcel.bid_id)"
    roles: [DistrictAdministrator, BoardMember]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Parcel[]
    side_effects: []
  - method: GET
    path: "/parcels/{id}"
    description: "Get a parcel"
    roles: [DistrictAdministrator, BoardMember, PropertyOwner]
    code: 200
    input: []
    output: Parcel
    side_effects: []
  - method: POST
    path: "/parcels/{id}/withdraw"
    description: "Withdraw a parcel from the district"
    roles: [DistrictAdministrator]
    code: 200
    input: []
    output: Parcel
    side_effects: ["status ACTIVE->WITHDRAWN; if a CERTIFIED assessment exists with no payments -> Assessment CANCELLED + CollectionAccount WRITTEN_OFF cascade"]

  # ---- FiscalYear ----
  - method: POST
    path: "/business-improvement-districts/{id}/fiscal-years"
    description: "Create a fiscal year (overlap-checked)"
    roles: [DistrictAdministrator]
    code: 201
    input: [year_label, start_date, end_date, assessment_due_date]
    output: FiscalYear
    side_effects: ["status=UPCOMING; budget_status=NONE"]
  - method: GET
    path: "/business-improvement-districts/{id}/fiscal-years"
    description: "List fiscal years (reverse-reach FiscalYear.bid_id)"
    roles: [DistrictAdministrator, BoardMember]
    code: 200
    input: ["limit?", "offset?"]
    output: FiscalYear[]
    side_effects: []
  - method: GET
    path: "/fiscal-years/{id}"
    description: "Get a fiscal year"
    roles: [DistrictAdministrator, BoardMember]
    code: 200
    input: []
    output: FiscalYear
    side_effects: []
  - method: GET
    path: "/fiscal-years/{id}/financial-report"
    description: "Computed budget-vs-actual financial report for the fiscal year"
    roles: [DistrictAdministrator, BoardMember]
    code: 200
    input: []
    output: "{ fiscal_year_id: string, total_certified_levy_cents: integer, collected_to_date_cents: integer, collection_status: string, by_category: array }"
    side_effects: []

  # ---- Budget / WorkPlanLine ----
  - method: POST
    path: "/fiscal-years/{id}/budget"
    description: "Create the DRAFT budget for a fiscal year (1:1)"
    roles: [DistrictAdministrator]
    code: 201
    input: [total_expenditure_cents, other_revenue_cents]
    output: Budget
    side_effects: ["status=DRAFT; required_levy_cents computed; FiscalYear.budget_status=DRAFT"]
  - method: GET
    path: "/fiscal-years/{id}/budget"
    description: "Get the budget of a fiscal year (reverse-reach Budget.fiscal_year_id; array of 0..1)"
    roles: [DistrictAdministrator, BoardMember]
    code: 200
    input: []
    output: Budget[]
    side_effects: []
  - method: GET
    path: "/budgets/{id}"
    description: "Get a budget"
    roles: [DistrictAdministrator, BoardMember]
    code: 200
    input: []
    output: Budget
    side_effects: []
  - method: POST
    path: "/budgets/{id}/work-plan-lines"
    description: "Add a work-plan allocation line (DRAFT only)"
    roles: [DistrictAdministrator]
    code: 201
    input: [category, allocated_amount_cents]
    output: WorkPlanLine
    side_effects: ["Budget.allocated_total_cents recomputed; Budget.version +1"]
  - method: GET
    path: "/budgets/{id}/work-plan-lines"
    description: "List work-plan lines (reverse-reach WorkPlanLine.budget_id)"
    roles: [DistrictAdministrator, BoardMember]
    code: 200
    input: ["limit?", "offset?"]
    output: WorkPlanLine[]
    side_effects: []
  - method: POST
    path: "/budgets/{id}/reallocations"
    description: "Move cents between two work-plan lines (OCC on Budget.version)"
    roles: [DistrictAdministrator]
    code: 200
    input: [from_category, to_category, amount_cents, expected_budget_version]
    output: Budget
    side_effects: ["from line -= amount; to line += amount; allocated_total_cents invariant; increments Budget.version by 1"]
  - method: POST
    path: "/budgets/{id}/propose"
    description: "Propose the budget: balance-check then generate ESTIMATED assessments"
    roles: [DistrictAdministrator]
    code: 200
    input: []
    output: Budget
    side_effects: ["DRAFT->PROPOSED; create ESTIMATED Assessment per ACTIVE non-exempt parcel; Budget.version +1"]
  - method: POST
    path: "/budgets/{id}/adopt"
    description: "Adopt the budget (BoardMember): certify assessments + open collection accounts"
    roles: [BoardMember]
    code: 200
    input: []
    output: Budget
    side_effects: ["PROPOSED->ADOPTED (requires BID ACTIVE); cascade certify assessments -> create CollectionAccounts; set total_certified_levy; Budget.version +1"]
  - method: POST
    path: "/budgets/{id}/revert"
    description: "Revert a PROPOSED budget to DRAFT, discarding estimates"
    roles: [DistrictAdministrator]
    code: 200
    input: []
    output: Budget
    side_effects: ["PROPOSED->DRAFT; delete ESTIMATED assessments; Budget.version +1"]

  # ---- Assessment ----
  - method: GET
    path: "/assessments/{id}"
    description: "Get an assessment"
    roles: [DistrictAdministrator, BoardMember, PropertyOwner]
    code: 200
    input: []
    output: Assessment
    side_effects: []
  - method: GET
    path: "/assessments"
    description: "List assessments by parcel and/or fiscal year (reverse-reach Assessment.parcel_id + Assessment.fiscal_year_id)"
    roles: [DistrictAdministrator, BoardMember, PropertyOwner]
    code: 200
    input: ["parcel_id?", "fiscal_year_id?", "status?", "limit?", "offset?"]
    output: Assessment[]
    side_effects: []

  # ---- CollectionAccount / Payment ----
  - method: GET
    path: "/assessments/{id}/collection-account"
    description: "Get the collection account for an assessment (reverse-reach CollectionAccount.assessment_id; array of 0..1)"
    roles: [DistrictAdministrator, BoardMember, TaxCollector, PropertyOwner]
    code: 200
    input: []
    output: CollectionAccount[]
    side_effects: []
  - method: GET
    path: "/collection-accounts/{id}"
    description: "Get a collection account"
    roles: [DistrictAdministrator, BoardMember, TaxCollector, PropertyOwner]
    code: 200
    input: []
    output: CollectionAccount
    side_effects: []
  - method: GET
    path: "/collection-accounts/{id}/payoff-quote"
    description: "Projected payoff as of a client-supplied date (variant payoff_quote; read-only, no mutation)"
    roles: [DistrictAdministrator, TaxCollector, PropertyOwner]
    code: 200
    input: [as_of_date]
    output: "{ collection_account_id: string, as_of_date: string, principal_outstanding_cents: integer, penalty_cents: integer, interest_cents: integer, quoted_balance_cents: integer }"
    side_effects: []
  - method: POST
    path: "/collection-accounts/{id}/payments"
    description: "Post a payment (waterfall allocation; variant final_payoff)"
    roles: [TaxCollector, PropertyOwner]
    code: 201
    input: [amount_cents, "method?"]
    output: Payment
    side_effects: ["waterfall interest->penalty->principal; account status recompute; FiscalYear.collected_to_date cascade"]
  - method: GET
    path: "/collection-accounts/{id}/payments"
    description: "List payments on an account (reverse-reach Payment.collection_account_id)"
    roles: [DistrictAdministrator, BoardMember, TaxCollector, PropertyOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: POST
    path: "/collection-accounts/{id}/assess-delinquency"
    description: "Mark a past-grace unpaid account DELINQUENT and apply penalty"
    roles: [TaxCollector]
    code: 200
    input: []
    output: CollectionAccount
    side_effects: ["BILLED->DELINQUENT; penalty_accrued_cents applied once; delinquent_since set"]
  - method: POST
    path: "/collection-accounts/{id}/write-off"
    description: "Write off a delinquent account"
    roles: [TaxCollector]
    code: 200
    input: []
    output: CollectionAccount
    side_effects: ["DELINQUENT->WRITTEN_OFF"]

  # ---- Dispute ----
  - method: POST
    path: "/assessments/{id}/disputes"
    description: "File a dispute on a certified assessment"
    roles: [PropertyOwner]
    code: 201
    input: [claimed_value_cents, requested_amount_cents, "reason?"]
    output: Dispute
    side_effects: ["status=SUBMITTED; filed_at=clock"]
  - method: GET
    path: "/assessments/{id}/disputes"
    description: "List disputes for an assessment (reverse-reach Dispute.assessment_id)"
    roles: [DistrictAdministrator, BoardMember, PropertyOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: Dispute[]
    side_effects: []
  - method: GET
    path: "/disputes/{id}"
    description: "Get a dispute"
    roles: [DistrictAdministrator, BoardMember, PropertyOwner]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: POST
    path: "/disputes/{id}/transition"
    description: "Advance a dispute (REVIEW/REQUEST_INFO/RESPOND/RESOLVE/WITHDRAW)"
    roles: [DistrictAdministrator, PropertyOwner]
    code: 200
    input: [action, "decision?", "resolved_amount_cents?"]
    output: Dispute
    side_effects: ["cyclic UNDER_REVIEW<->INFO_REQUESTED; RESOLVE ADJUSTED triggers assessment/account/fiscal-year cascade"]

  # ---- RenewalPetition / signatures ----
  - method: POST
    path: "/business-improvement-districts/{id}/renewal-petitions"
    description: "Open a renewal petition (requires BID ACTIVE; at most one in-flight petition)"
    roles: [DistrictAdministrator]
    code: 201
    input: [circulation_deadline, "required_threshold_pct?", "renewal_term_months?"]
    output: RenewalPetition
    side_effects: ["status=CIRCULATING; BID ACTIVE->RENEWAL_PENDING"]
  - method: GET
    path: "/business-improvement-districts/{id}/renewal-petitions"
    description: "List renewal petitions (reverse-reach RenewalPetition.bid_id)"
    roles: [DistrictAdministrator, BoardMember]
    code: 200
    input: ["limit?", "offset?"]
    output: RenewalPetition[]
    side_effects: []
  - method: GET
    path: "/renewal-petitions/{id}"
    description: "Get a renewal petition"
    roles: [DistrictAdministrator, BoardMember, PropertyOwner]
    code: 200
    input: []
    output: RenewalPetition
    side_effects: []
  - method: POST
    path: "/renewal-petitions/{id}/signatures"
    description: "Record a parcel's signature (PropertyOwner acting as own parcel)"
    roles: [PropertyOwner]
    code: 201
    input: [parcel_id, support]
    output: PetitionSignature
    side_effects: ["one signature per (petition, parcel); signed_at=clock"]
  - method: GET
    path: "/petition-signatures"
    description: "List petition signatures by petition and/or parcel (reverse-reach PetitionSignature.petition_id + PetitionSignature.parcel_id)"
    roles: [DistrictAdministrator, BoardMember]
    code: 200
    input: ["petition_id?", "parcel_id?", "limit?", "offset?"]
    output: PetitionSignature[]
    side_effects: []
  - method: GET
    path: "/petition-signatures/{id}"
    description: "Get a single petition signature"
    roles: [DistrictAdministrator, BoardMember]
    code: 200
    input: []
    output: PetitionSignature
    side_effects: []
  - method: POST
    path: "/renewal-petitions/{id}/submit"
    description: "Close circulation and submit for verification"
    roles: [DistrictAdministrator]
    code: 200
    input: []
    output: RenewalPetition
    side_effects: ["CIRCULATING->SUBMITTED"]
  - method: POST
    path: "/renewal-petitions/{id}/verify"
    description: "Verify weighted support against threshold; records verifier"
    roles: [BoardMember]
    code: 200
    input: []
    output: RenewalPetition
    side_effects: ["compute weighted_support_pct; SUBMITTED->VERIFIED (>=) or FAILED (<); set verified_by_user_id"]
  - method: POST
    path: "/renewal-petitions/{id}/vote"
    description: "Board vote on a verified petition (four-eyes SoD)"
    roles: [BoardMember]
    code: 200
    input: [decision]
    output: RenewalPetition
    side_effects: ["VERIFIED->APPROVED/REJECTED; APPROVE extends BID authorization + reactivates"]

  # ---- Ambassador / shifts ----
  - method: POST
    path: "/business-improvement-districts/{id}/ambassadors"
    description: "Add an ambassador"
    roles: [DistrictAdministrator]
    code: 201
    input: [name, service_role]
    output: Ambassador
    side_effects: ["status=ACTIVE"]
  - method: POST
    path: "/ambassadors/{id}/deactivate"
    description: "Deactivate an ambassador (ACTIVE->INACTIVE); deactivated ambassadors cannot be assigned"
    roles: [DistrictAdministrator]
    code: 200
    input: []
    output: Ambassador
    side_effects: ["status ACTIVE->INACTIVE"]
  - method: GET
    path: "/business-improvement-districts/{id}/ambassadors"
    description: "List ambassadors (reverse-reach Ambassador.bid_id)"
    roles: [DistrictAdministrator, BoardMember]
    code: 200
    input: ["limit?", "offset?"]
    output: Ambassador[]
    side_effects: []
  - method: GET
    path: "/ambassadors/{id}"
    description: "Get an ambassador"
    roles: [DistrictAdministrator, BoardMember, Ambassador]
    code: 200
    input: []
    output: Ambassador
    side_effects: []
  - method: POST
    path: "/ambassadors/{id}/shifts"
    description: "Schedule an ambassador shift (overlap + buffer checked)"
    roles: [DistrictAdministrator]
    code: 201
    input: [zone, start_at, end_at]
    output: AmbassadorShift
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/ambassadors/{id}/shifts"
    description: "List an ambassador's shifts (reverse-reach AmbassadorShift.ambassador_id)"
    roles: [DistrictAdministrator, BoardMember, Ambassador]
    code: 200
    input: ["limit?", "offset?"]
    output: AmbassadorShift[]
    side_effects: []

  # ---- ServiceRequest (311 linkage) ----
  - method: POST
    path: "/business-improvement-districts/{id}/service-requests"
    description: "Log a service request / 311 ticket"
    roles: [DistrictAdministrator, PropertyOwner]
    code: 201
    input: [category, source, "external_ref?", "description?"]
    output: ServiceRequest
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/service-requests"
    description: "List service requests by BID and/or assigned ambassador (reverse-reach ServiceRequest.bid_id + ServiceRequest.assigned_ambassador_id)"
    roles: [DistrictAdministrator, BoardMember, Ambassador]
    code: 200
    input: ["bid_id?", "assigned_ambassador_id?", "status?", "limit?", "offset?"]
    output: ServiceRequest[]
    side_effects: []
  - method: GET
    path: "/service-requests/{id}"
    description: "Get a service request"
    roles: [DistrictAdministrator, BoardMember, Ambassador, PropertyOwner]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: []
  - method: POST
    path: "/service-requests/{id}/transition"
    description: "Advance a service request (ASSIGN/START/RESOLVE/CLOSE/CANCEL)"
    roles: [DistrictAdministrator, Ambassador]
    code: 200
    input: [action, "ambassador_id?", "logged_cost_cents?", "work_plan_category?"]
    output: ServiceRequest
    side_effects: ["ASSIGN requires Ambassador ACTIVE; RESOLVE posts logged_cost to matching WorkPlanLine.spent_amount_cents"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers or unknown role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed actor is not the owning party of the resource" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Petition vote cast by the same user who verified it" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, bad enum/type, non-positive amount" }
  - { id: ERR_BID_NOT_FOUND, http: 404, condition: "District id does not exist" }
  - { id: ERR_PARCEL_NOT_FOUND, http: 404, condition: "Parcel id does not exist" }
  - { id: ERR_FISCAL_YEAR_NOT_FOUND, http: 404, condition: "Fiscal year id does not exist" }
  - { id: ERR_BUDGET_NOT_FOUND, http: 404, condition: "Budget id does not exist" }
  - { id: ERR_WORK_PLAN_LINE_NOT_FOUND, http: 404, condition: "Work-plan line / category not found in target budget" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "Assessment id does not exist" }
  - { id: ERR_COLLECTION_ACCOUNT_NOT_FOUND, http: 404, condition: "Collection account id does not exist" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "Dispute id does not exist" }
  - { id: ERR_PETITION_NOT_FOUND, http: 404, condition: "Renewal petition id does not exist" }
  - { id: ERR_SIGNATURE_NOT_FOUND, http: 404, condition: "Petition signature id does not exist" }
  - { id: ERR_AMBASSADOR_NOT_FOUND, http: 404, condition: "Ambassador id does not exist" }
  - { id: ERR_SERVICE_REQUEST_NOT_FOUND, http: 404, condition: "Service request id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_DISPUTE_NOT_OPEN, http: 409, condition: "Transition attempted on a terminal/closed dispute" }
  - { id: ERR_ACCOUNT_NOT_DELINQUENT, http: 409, condition: "assess-delinquency before grace or before due, or write-off on non-delinquent account" }
  - { id: ERR_ALREADY_DELINQUENT, http: 409, condition: "assess-delinquency on an already-delinquent account" }
  - { id: ERR_BID_NOT_ACTIVE, http: 409, condition: "Cross-entity: operation requires the district to be ACTIVE" }
  - { id: ERR_ASSESSMENT_NOT_CERTIFIED, http: 409, condition: "Cross-entity: dispute requires a CERTIFIED assessment" }
  - { id: ERR_AMBASSADOR_NOT_ACTIVE, http: 409, condition: "Cross-entity: assignment requires an ACTIVE ambassador" }
  - { id: ERR_BUDGET_EXISTS, http: 409, condition: "A budget already exists for the fiscal year" }
  - { id: ERR_DISPUTE_ALREADY_OPEN, http: 409, condition: "A non-terminal dispute already exists for the assessment" }
  - { id: ERR_ALREADY_SIGNED, http: 409, condition: "Parcel already signed this petition" }
  - { id: ERR_DUPLICATE_CATEGORY, http: 409, condition: "Work-plan category duplicated within a budget" }
  - { id: ERR_PARCEL_NOT_IN_DISTRICT, http: 409, condition: "Signing parcel not an ACTIVE parcel of the petition's district" }
  - { id: ERR_DISPUTE_WINDOW_CLOSED, http: 422, condition: "Dispute filed after DISPUTE_WINDOW_DAYS from certification" }
  - { id: ERR_PETITION_DEADLINE_PASSED, http: 422, condition: "Signature/submit at or after circulation_deadline" }
  - { id: ERR_FISCAL_YEAR_OVERLAP, http: 409, condition: "New fiscal year interval overlaps an existing one in the BID" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "New shift overlaps or is within SHIFT_BUFFER_MINUTES of an existing shift" }
  - { id: ERR_BUDGET_UNBALANCED, http: 422, condition: "sum(work-plan allocations) != total_expenditure_cents at propose" }
  - { id: ERR_INVALID_REALLOCATION, http: 422, condition: "Reallocation amount exceeds source line allocation, or unknown category" }
  - { id: ERR_NEGATIVE_LEVY, http: 422, condition: "required_levy_cents < 0 at propose" }
  - { id: ERR_ADJUSTMENT_EXCEEDS_ASSESSMENT, http: 422, condition: "Dispute resolved_amount outside [0, certified_amount]" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent.version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DistrictAdministrator
    description: "BID management staff: districts, parcels, fiscal years, budgets/work-plan, propose, dispute adjudication, ambassadors/shifts, petitions, service requests. Cannot ADOPT a budget or VERIFY/VOTE a petition (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /business-improvement-districts (create)"
      - "POST /business-improvement-districts/{id}/parcels"
      - "POST /parcels/{id}/withdraw"
      - "POST /business-improvement-districts/{id}/fiscal-years"
      - "POST /fiscal-years/{id}/budget"
      - "POST /budgets/{id}/work-plan-lines"
      - "POST /budgets/{id}/reallocations"
      - "POST /budgets/{id}/propose"
      - "POST /budgets/{id}/revert"
      - "POST /disputes/{id}/transition (REVIEW/REQUEST_INFO/RESOLVE)"
      - "POST /business-improvement-districts/{id}/renewal-petitions"
      - "POST /renewal-petitions/{id}/submit"
      - "POST /business-improvement-districts/{id}/ambassadors"
      - "POST /ambassadors/{id}/shifts"
      - "POST /service-requests/{id}/transition (ASSIGN/CLOSE/CANCEL)"
    shared_operations:
      - "POST /business-improvement-districts/{id}/service-requests (with PropertyOwner)"
      - "GET reads across the district"
  - name: BoardMember
    description: "Governing board: activates districts, adopts budgets, verifies and votes on renewal petitions, reviews financial reports. Cannot prepare/propose budgets or resolve disputes."
    identity: "opaque"
    exclusive_operations:
      - "POST /business-improvement-districts/{id}/activate"
      - "POST /budgets/{id}/adopt"
      - "POST /renewal-petitions/{id}/verify"
      - "POST /renewal-petitions/{id}/vote"
    shared_operations:
      - "GET reads (fiscal reports, budgets, petitions, parcels)"
  - name: TaxCollector
    description: "County tax office: posts assessment payments, marks delinquency, writes off. Operational identity not tied to a district entity."
    identity: "opaque"
    exclusive_operations:
      - "POST /collection-accounts/{id}/assess-delinquency"
      - "POST /collection-accounts/{id}/write-off"
    shared_operations:
      - "POST /collection-accounts/{id}/payments (with PropertyOwner)"
      - "GET /collection-accounts/{id}, payoff-quote, payments"
  - name: PropertyOwner
    description: "Parcel owner acting as their own parcel. Files/withdraws/answers disputes, signs petitions, pays own assessment, logs service requests. X-User-ID equals the acting Parcel.id."
    identity: "entity_backed:Parcel"
    exclusive_operations:
      - "POST /assessments/{id}/disputes"
      - "POST /disputes/{id}/transition (RESPOND/WITHDRAW)"
      - "POST /renewal-petitions/{id}/signatures"
    shared_operations:
      - "POST /collection-accounts/{id}/payments (own account; with TaxCollector)"
      - "POST /business-improvement-districts/{id}/service-requests (with DistrictAdministrator)"
      - "GET own parcel/assessment/account reads"
  - name: Ambassador
    description: "Field ambassador acting as their own record. Starts and resolves assigned service requests. X-User-ID equals the acting Ambassador.id."
    identity: "entity_backed:Ambassador"
    exclusive_operations:
      - "POST /service-requests/{id}/transition (START/RESOLVE, own assignments)"
    shared_operations:
      - "GET /service-requests, /ambassadors/{id}, /ambassadors/{id}/shifts"
