            - { call: "POST /grants/applications", payload: { foa_id: "${foa_id}", institution_id: "${inst_id}", title: "Cert app", research_strategy_page_count: 13, direct_cents_per_year: [20000000], requested_years: 1, human_subjects_involved: true }, as: Applicant, as_user_id: "${pi_a}", captures: { app_a: $.data.id } }
          trigger:
            - { call: "POST /grants/applications/${app_a}/submit", payload: {}, as: Applicant, as_user_id: "${pi_a}", captures: { err: $.data.error_id } }
            - { call: "GET /grants/applications/${app_a}", payload: {}, as: ProgramOfficer, captures: { app_st: $.data.status } }
          assert:
            - "submit fails with error_id == ERR_CERTIFICATION_EXPIRED (http 422), not ERR_PAGE_LIMIT_EXCEEDED"
            - "Application.${app_a}.status == DRAFT (no partial transition)"

