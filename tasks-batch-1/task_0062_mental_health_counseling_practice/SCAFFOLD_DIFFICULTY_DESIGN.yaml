  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: claim_adjudicate_cascade_depth3
        grounds:
          - state_machines.Claim.SUBMITTED_to_ADJUDICATED
          - entities.InsurancePolicy.fields.deductible_met_cents
          - entities.Appointment.fields.patient_charge_cents
        distinguishing_aspect: >-
          Depth-3 chain: adjudicating the Claim (A) stamps its ledger fields (B), which causes the
          InsurancePolicy.deductible_met_cents to rise by deductible_applied (C), and the same
          adjudication syncs the Appointment.patient_charge_cents (a further dependent write) — each
          hop caused by the prior, originating from the adjudicate transition.
        test_recipe:
          setup:
            - "A SUBMITTED in-network claim: 90834 contracted 13000c, deductible_total 20000c met 18000c, coinsurance 0.20."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T12:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists"
              payload: { full_name: "Dr Casc" }
              as: ClinicalDirector
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /_inject/therapist_hours"
              payload: { therapist_id: "${t_id}", verified_direct_hours: 3000, verified_supervision_hours: 200 }
              as: ClinicalDirector
            - call: "POST /state-licenses"
              payload: { therapist_id: "${t_id}", state_code: "CA", license_number: "LC", expires_on: "2030-01-01T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v}" }
              as: ClinicalDirector
              captures: { t_v2: $.data.version }
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v2}" }
              as: ClinicalDirector
            - call: "POST /payer-contracts"
              payload: { payer_name: "Casc", in_network: true, contracted_rate_90791_cents: 18000, contracted_rate_90834_cents: 13000 }
              as: Biller
              captures: { c_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pt Casc", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${p_id}", contract_id: "${c_id}", cost_share_model: "COINSURANCE", coinsurance_rate: 0.20, deductible_total_cents: 20000 }
              as: FrontDesk
              captures: { pol_id: $.data.id }
            - call: "POST /appointments"
              payload: { therapist_id: "${t_id}", patient_id: "${p_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-06-06T03:00:00Z", duration_minutes: 45, payment_path: "INSURANCE", insurance_policy_id: "${pol_id}" }
              as: FrontDesk
              captures: { a0_id: $.data.id }
            - call: "POST /appointments/${a0_id}/render"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /clinical-notes"
              payload: { appointment_id: "${a0_id}", narrative: "n" }
              as: Therapist
              as_user_id: "${t_id}"
              captures: { n0_id: $.data.id }
            - call: "POST /clinical-notes/${n0_id}/sign"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /appointments/${a0_id}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
              captures: { a0_v: $.data.version }
            - call: "POST /claims"
              payload: { appointment_id: "${a0_id}", expected_appointment_version: "${a0_v}" }
              as: Biller
              captures: { c0_id: $.data.id, c0_v: $.data.version }
            - call: "POST /appointments"
              payload: { therapist_id: "${t_id}", patient_id: "${p_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-06-06T08:00:00Z", duration_minutes: 45, payment_path: "INSURANCE", insurance_policy_id: "${pol_id}" }
              as: FrontDesk
              captures: { a_id: $.data.id }
            - call: "POST /appointments/${a_id}/render"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /clinical-notes"
              payload: { appointment_id: "${a_id}", narrative: "n" }
              as: Therapist
              as_user_id: "${t_id}"
              captures: { n_id: $.data.id }
            - call: "POST /clinical-notes/${n_id}/sign"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /appointments/${a_id}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
              captures: { a_v: $.data.version }
            - call: "POST /claims"
              payload: { appointment_id: "${a_id}", expected_appointment_version: "${a_v}" }
              as: Biller
              captures: { cl_id: $.data.id, cl_v: $.data.version }
            - call: "POST /claims/${c0_id}/adjudicate"
              payload: { expected_claim_version: "${c0_v}" }
              as: Biller
          trigger:
            - call: "POST /claims/${cl_id}/adjudicate"
              payload: { expected_claim_version: "${cl_v}" }
