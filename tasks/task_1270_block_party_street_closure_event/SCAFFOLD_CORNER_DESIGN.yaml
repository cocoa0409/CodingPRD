# =============================================================================
# Task 1270 — Scaffold Corner Design (Coverage Index), SKILL §1.9
# Breadth coverage of §1.1-§1.7 claims not already probed by §1.8.
# Sections follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: organizer_create_extra_system_fields_input_ignored
        claim_type: system_fields
        grounds: ["entities.Organizer.fields.standing"]
        distinguishing_aspect: "Client-supplied system field on create is ignored: standing stays GOOD, forfeiture_count 0, version 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /organizers"
              payload: { full_name: "Sara Il", email: "sara@x.com", phone: "555-20", address: "1 Elm St", standing: "SUSPENDED", forfeiture_count: 9 }
              as: Anonymous
              captures: { org_id: $.data.id, org_standing: $.data.standing, org_version: $.data.version }
          assert:
            - "Response 201; Organizer.standing == GOOD and forfeiture_count == 0 despite client input"
            - "version == 1; id is a server-minted UUID; created_at/updated_at present with three fractional digits"
      - name: street_segment_missing_required_household_count_returns_400
        claim_type: required_fields
        grounds: ["entities.StreetSegment.fields.household_count", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required household_count on segment create yields ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /street-segments"
              payload: { name: "Bad Seg", jurisdiction: CITY, segment_kind: RESIDENTIAL, length_m: 48 }
              as: CityAdmin
              captures: { err: $.data.error_id }
          assert: ["Response 400 with error_id ERR_INVALID_REQUEST"]
      - name: get_nonexistent_petition_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID yields ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /petitions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PermitOfficer
              captures: { err: $.data.error_id }
          assert: ["Response 404 with error_id ERR_NOT_FOUND"]
      - name: petition_computed_threshold_fields
        claim_type: computed_fields
        grounds: ["calculations.petition_required_signatures", "entities.Petition.fields.required_signatures"]
        distinguishing_aspect: "MIXED_USE formula: ceil(0.6*2 + 0.5*2) = 3 and support_mode SIGNATURE_COUNT, computed at creation."
        test_recipe:
          setup: ["Organizer exists; MIXED_USE segment household_count=2 business_count=2"]
          setup_api_calls:
            - call: "POST /organizers"
              payload: { full_name: "Tom Vi", email: "tom@x.com", phone: "555-21", address: "2 Elm St" }
              as: Anonymous
              captures: { org_id: $.data.id }
            - call: "POST /street-segments"
              payload: { name: "Elm Mix", jurisdiction: COUNTY, segment_kind: MIXED_USE, household_count: 2, business_count: 2, intersects_arterial: false, length_m: 30 }
              as: CityAdmin
              captures: { seg_id: $.data.id }
          trigger:
            - call: "POST /petitions"
              payload: { segment_id: "${seg_id}" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { pet_required: $.data.required_signatures, pet_mode: $.data.support_mode }
          assert:
            - "Petition.required_signatures == 3 and support_mode == SIGNATURE_COUNT (MIXED_USE branch)"
            - "Petition.status == COLLECTING, valid_signature_count == 0, cure_round == 0"
      - name: segment_defaults_applied
        claim_type: defaults
        grounds: ["entities.StreetSegment.fields.business_count", "entities.StreetSegment.fields.intersects_arterial"]
        distinguishing_aspect: "Omitting optional fields applies defaults business_count=0, intersects_arterial=false."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /street-segments"
              payload: { name: "Elm Def", jurisdiction: CITY, segment_kind: RESIDENTIAL, household_count: 5, length_m: 48 }
              as: CityAdmin
              captures: { seg_bc: $.data.business_count, seg_art: $.data.intersects_arterial }
          assert: ["business_count == 0 and intersects_arterial == false by default"]
      - name: charge_entry_immutable_shape
        claim_type: immutability
        grounds: ["entities.ChargeEntry"]
        distinguishing_aspect: "ChargeEntry has common_fields: false — rows expose id and created_at only (no updated_at, no version) and are produced only by system charge postings."
        test_recipe:
          setup:
            - "Issued application with 1 BARRICADE dispatched; return 1 day late posts a LATE_EQUIPMENT charge (attendance 40 -> deposit 10000)"
          setup_api_calls:
            - call: "POST /organizers"
              payload: { full_name: "Uma Lo", email: "uma@x.com", phone: "555-22", address: "3 Elm St" }
              as: Anonymous
              captures: { org_id: $.data.id }
            - call: "POST /street-segments"
              payload: { name: "Elm 300", jurisdiction: CITY, segment_kind: RESIDENTIAL, household_count: 5, business_count: 0, intersects_arterial: false, length_m: 12 }
              as: CityAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CityAdmin
            - call: "POST /petitions"
              payload: { segment_id: "${seg_id}" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /petitions/${pet_id}/signatures"
              payload: { household_address: "1 Elm St", signer_name: "K One", signer_email: "k1@x.com" }
              as: Neighbor
            - call: "POST /petitions/${pet_id}/signatures"
              payload: { household_address: "2 Elm St", signer_name: "K Two", signer_email: "k2@x.com" }
              as: Neighbor
            - call: "POST /petitions/${pet_id}/signatures"
              payload: { household_address: "3 Elm St", signer_name: "K Three", signer_email: "k3@x.com" }
              as: Neighbor
            - call: "POST /petitions/${pet_id}/submit"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /petitions/${pet_id}/verify"
              payload: { decision: APPROVE }
              as: PermitOfficer
            - call: "POST /permit-applications"
              payload: { petition_id: "${pet_id}", event_start_at: "2026-06-20T14:00:00Z", event_end_at: "2026-06-20T22:00:00Z", expected_attendance: 40, amplified_sound: false, alcohol_served: false, food_vendors: false }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/traffic-control-plans"
              payload: { barricade_count: 1, cone_count: 0, sign_count: 0, emergency_lane_width_m: 6.0, emergency_lane_continuous: true, placement_notes: "ends" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { tcp_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/submit"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { app_v: $.data.version }
            - call: "POST /traffic-control-plans/${tcp_id}/submit"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /traffic-control-plans/${tcp_id}/review"
              payload: { decision: APPROVE }
              as: TrafficReviewer
            - call: "POST /permit-applications/${app_id}/insurance-certificates"
              payload: { kind: CERTIFICATE, expected_application_version: "${app_v}", insurer_name: "Acme Mutual", policy_number: "P-800", coverage_amount_cents: 100000000, expires_on: "2026-12-31" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ic_id: $.data.id }
            - call: "POST /insurance-certificates/${ic_id}/review"
              payload: { decision: APPROVE }
              as: SafetyReviewer
            - call: "POST /equipment-stocks"
              payload: { depot_name: "Depot J", equipment_kind: BARRICADE, total_units: 5 }
              as: CityAdmin
            - call: "POST /permit-applications/${app_id}/equipment-reservations"
              payload: { equipment_kind: BARRICADE, units: 1 }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { res_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/deposits"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { dep_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/approve"
              payload: {}
              as: PermitOfficer
            - call: "POST /permit-applications/${app_id}/issue"
              payload: {}
              as: PermitOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T15:00:00Z" }
              as: CityAdmin
            - call: "POST /equipment-reservations/${res_id}/dispatch"
              payload: {}
              as: DepotOfficer
              as_user_id: "depot-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-23T10:00:00Z" }
              as: CityAdmin
            - call: "POST /equipment-reservations/${res_id}/return"
              payload: { returned_units: 1 }
              as: DepotOfficer
              as_user_id: "depot-1"
          trigger:
            - call: "GET /deposits/${dep_id}/charges"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ch_kind: "$.data[0].kind", ch_amount: "$.data[0].amount_cents" }
          assert:
            - "Exactly one ChargeEntry: kind == LATE_EQUIPMENT, amount_cents == 500 (1 unit * 250 * 2 * 1 late day)"
            - "ChargeEntry row carries id, created_at, deposit_id, kind, amount_cents, note, source_reservation_id — and NO updated_at or version keys (immutable append-only)"
  - section: state_machines
    instances:
      - name: petition_submit_twice_returns_409
        claim_type: invalid_transition
        grounds: ["state_machines.Petition.COLLECTING_to_SUBMITTED", "errors[ERR_INVALID_STATE]"]
