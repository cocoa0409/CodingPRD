  # -------------------------------------------------------- BudgetLedgerEntry
  - method: POST
    path: "/budget-ledger-entries"
    description: "Posts a client-written CHANGE_ORDER entry to the program cost ledger"
    roles: [OwnerRep]
    code: 201
    input: [project_id, entry_kind, amount_cents, memo, expected_project_version]
    output: BudgetLedgerEntry
    side_effects:
      - "sequence_no := AttractionProject.ledger_sequence_high_water + 1 and the high-water mark advances"
      - "recomputes AttractionProject.committed_cost_cents / forecast_cost_cents and readiness_posture, which may cascade ShowScene freezes"
      - "increments AttractionProject.version by 1"
  - method: GET
    path: "/budget-ledger-entries/{id}"
    description: "Reads one ledger entry"
    roles: [OwnerRep, ContractorPM, ProgramAdmin]
    code: 200
    input: []
    output: BudgetLedgerEntry
    side_effects: []
  - method: POST
    path: "/budget-ledger-entries/{id}/reverse"
    description: "Mints the compensating REVERSAL entry for a ledger entry and returns the new entry"
    roles: [OwnerRep]
    code: 201
    input: [reason, expected_project_version]
    output: BudgetLedgerEntry
    side_effects:
      - "original entry reversed := true"
      - "mints a BudgetLedgerEntry with entry_kind REVERSAL, amount_cents := 0 - original.amount_cents, reversal_of_sequence_no := original.sequence_no"
      - "recomputes AttractionProject.committed_cost_cents / forecast_cost_cents and readiness_posture, restoring the pre-entry value exactly"
      - "increments AttractionProject.version by 1"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Caller's role is not listed for the endpoint in §1.5"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown field, bad enum member, out-of-range number, malformed datetime, or window_end_utc not strictly after window_start_utc"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "Path {id} or body project_id does not resolve to an AttractionProject"
  - id: ERR_RIDE_SYSTEM_NOT_FOUND
    http: 404
    condition: "Path {id} or body ride_system_id does not resolve to a RideSystem"
  - id: ERR_QUEUE_SEGMENT_NOT_FOUND
    http: 404
    condition: "Path {id} does not resolve to a QueueSegment"
  - id: ERR_SCENE_NOT_FOUND
    http: 404
    condition: "Path {id}, body scene_id or body follows_scene_id does not resolve to a ShowScene of the relevant project"
  - id: ERR_CUE_NOT_FOUND
    http: 404
    condition: "Path {id} does not resolve to an EffectCue"
  - id: ERR_PACKAGE_NOT_FOUND
    http: 404
    condition: "Path {id} or body design_package_id does not resolve to a DesignPackage"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "Path {id} or body safety_review_id does not resolve to a SafetyReview"
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "Path {id} does not resolve to a SafetyFinding"
  - id: ERR_VE_ITEM_NOT_FOUND
    http: 404
    condition: "Path {id} or body value_engineering_item_id does not resolve to a ValueEngineeringItem"
  - id: ERR_REHEARSAL_RUN_NOT_FOUND
    http: 404
    condition: "Path {id} or body rehearsal_run_id does not resolve to a RehearsalRun"
  - id: ERR_MAINTENANCE_ITEM_NOT_FOUND
    http: 404
    condition: "Path {id} does not resolve to a MaintenanceItem"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "Path {id} does not resolve to a BudgetLedgerEntry"
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not equal the current AttractionProject.version"
  - id: ERR_STALE_PACKAGE_VERSION
    http: 412
    condition: "expected_package_version does not equal the current DesignPackage.version"
  - id: ERR_STALE_RIDE_SYSTEM_VERSION
    http: 412
    condition: "expected_ride_system_version does not equal the current RideSystem.version"
  - id: ERR_RIDE_SYSTEM_STATE_INVALID
    http: 409
    condition: "Ride system is not in the from-state the action requires (select needs CANDIDATE, mark-engineered needs SELECTED, commission needs ENGINEERED)"
  - id: ERR_QUEUE_SEGMENT_STATE_INVALID
    http: 409
    condition: "Queue segment is not PROPOSED for accept or not ACCEPTED for retire"
  - id: ERR_SCENE_STATE_INVALID
    http: 409
    condition: "Scene is not in the from-state the action requires, including any client action attempted on a HELD scene"
  - id: ERR_CUE_STATE_INVALID
    http: 409
    condition: "Cue is not PLANNED for verify, or the owning scene has already left {DRAFT, SEQUENCED}"
  - id: ERR_PACKAGE_STATE_INVALID
    http: 409
    condition: "Design package is not in the from-state the action requires, including opening a review against a DRAFT package"
  - id: ERR_REVIEW_STATE_INVALID
    http: 409
    condition: "Review is CLEARED and no longer accepts findings, or clear was called on a review that is already CLEARED"
  - id: ERR_FINDING_STATE_INVALID
    http: 409
    condition: "Finding is not OPEN for resolve/waive or not RESOLVED for close"
  - id: ERR_VE_ITEM_STATE_INVALID
    http: 409
    condition: "Value-engineering item is not PROPOSED for open-review or not UNDER_REVIEW for a ballot"
  - id: ERR_REHEARSAL_STATE_INVALID
    http: 409
    condition: "Rehearsal run is not SCHEDULED for complete"
  - id: ERR_MAINTENANCE_STATE_INVALID
    http: 409
    condition: "Maintenance item is not DRAFT for approve or not APPROVED for hand-over"
  - id: ERR_PROJECT_FROZEN
    http: 409
    condition: "AttractionProject.readiness_posture == FROZEN and the requested write is not one of the freeze-lifting operations"
  - id: ERR_POSTURE_RESTRICTED
    http: 409
    condition: "AttractionProject.readiness_posture == RESTRICTED and the request would increase scope (new design package, positive change order)"
  - id: ERR_PHASE_SEQUENCE_INVALID
    http: 409
    condition: "to_phase is not the immediate successor of the current design_phase"
  - id: ERR_PROJECT_PHASE_INVALID
    http: 409
    condition: "The project's design_phase is outside the window the operation requires"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The approving X-User-ID equals DesignPackage.submitted_by_user_id"
  - id: ERR_CRITICAL_FINDING_NOT_WAIVABLE
    http: 422
    condition: "Waive attempted on a SafetyFinding with severity CRITICAL"
  - id: ERR_OPEN_FINDINGS_PRESENT
    http: 409
    condition: "Clear attempted while SafetyReview.open_finding_count > 0"
  - id: ERR_SAFETY_REVIEW_NOT_CLEARED
    http: 409
    condition: "No CLEARED SafetyReview exists for an APPROVED package (matching the ride system, on commission), or open_critical_finding_count > 0"
  - id: ERR_PINNED_REFERENCE_STALE
    http: 409
    condition: "DesignPackage.pinned_ride_system_version no longer equals the referenced RideSystem.version"
  - id: ERR_RIDE_SYSTEM_PROJECT_MISMATCH
    http: 422
    condition: "ride_system_id belongs to a different project than project_id"
  - id: ERR_BALLOT_PARTY_ROLE_MISMATCH
    http: 422
    condition: "VEBallot.party_role differs from the caller's X-User-Role"
  - id: ERR_REHEARSAL_RUN_PROJECT_MISMATCH
    http: 422
    condition: "rehearsal_run_id belongs to a different project than the scene being validated"
  - id: ERR_REHEARSAL_NOT_PASSED
    http: 409
    condition: "The cited rehearsal run is not COMPLETED with result PASS"
  - id: ERR_REHEARSAL_WINDOW_CONFLICT
    http: 409
    condition: "The requested window overlaps an existing run of the project or leaves less than 120 minutes of changeover gap"
  - id: ERR_SOFT_OPEN_ALREADY_SCHEDULED
    http: 409
    condition: "A SOFT_OPEN run already exists for the project on the same UTC calendar date"
  - id: ERR_REHEARSAL_WINDOW_NOT_ELAPSED
    http: 409
    condition: "Complete called while the logical clock is before window_end_utc"
  - id: ERR_CUE_CHANNEL_CONFLICT
    http: 409
    condition: "The cue's occupation collides with another cue on the same scene and discipline channel, including the 250 ms interlock buffer on ANIMATION and SPECIAL_EFFECT"
  - id: ERR_PROJECT_CODE_DUPLICATE
    http: 409
    condition: "project_code already exists"
  - id: ERR_SCENE_SEQUENCE_DUPLICATE
    http: 409
    condition: "sequence_index already used by another scene of the project"
  - id: ERR_SCENE_ORDER_CYCLE
    http: 422
    condition: "The requested follows_scene_id would close a cycle in the running-order chain"
  - id: ERR_CUES_NOT_VERIFIED
    http: 409
    condition: "Program called while the scene owns no cue, or owns a cue that is still PLANNED"
  - id: ERR_SCENE_NOT_READY
    http: 409
    condition: "Advance to SOFT_OPEN attempted while some scene is DRAFT, SEQUENCED, PROGRAMMED or HELD"
  - id: ERR_SHOW_QUALITY_BELOW_MINIMUM
    http: 409
    condition: "Advance to SOFT_OPEN attempted while show_quality_score < 75.00"
  - id: ERR_QUEUE_POSITION_DUPLICATE
    http: 409
    condition: "position_index already used by a PROPOSED or ACCEPTED segment of the project"
  - id: ERR_QUEUE_WIDTH_BELOW_MINIMUM
    http: 422
    condition: "width_meters below the routing class minimum (1.10 STANDARD, 1.80 ACCESSIBLE and VIRTUAL_RETURN)"
  - id: ERR_ACCESSIBLE_ROUTE_MISSING
    http: 409
    condition: "Advance to TECHNICAL_REHEARSAL attempted with no ACCEPTED ACCESSIBLE segment"
  - id: ERR_ACCESSIBLE_SHARE_INSUFFICIENT
    http: 409
    condition: "Advance to TECHNICAL_REHEARSAL attempted while accessible_share_pct < 15"
  - id: ERR_VIRTUAL_QUEUE_SHARE_EXCEEDED
    http: 422
    condition: "virtual_queue_share_pct above 40"
  - id: ERR_RIDE_SYSTEM_ALREADY_ENGINEERED
    http: 409
    condition: "Select attempted while another ride system of the project is ENGINEERED or COMMISSIONED"
  - id: ERR_CAPACITY_TARGET_NOT_MET
    http: 409
    condition: "operational_hourly_capacity_guests < required_hourly_capacity_guests on select or on advance to PRODUCTION"
  - id: ERR_VE_ADOPTION_BREAKS_CAPACITY
    http: 409
    condition: "The resolving ballot would adopt an item whose capacity_impact_guests_per_hour drops the selected system below the required hourly capacity"
  - id: ERR_SCOPE_IMPACT_DELTA_MISMATCH
    http: 422
    condition: "scope_impact_delta_cents != implementation_cost_cents - gross_saving_cents"
  - id: ERR_BALLOT_ALREADY_CAST
    http: 409
    condition: "A ballot with the same party_role already exists for the item"
  - id: ERR_VETO_NOT_PERMITTED
    http: 422
    condition: "decision VETO cast with party_role CreativeDirector"
  - id: ERR_MAINTENANCE_PART_DUPLICATE
    http: 409
    condition: "part_number already exists for the project"
  - id: ERR_SPARE_STOCK_INSUFFICIENT
    http: 422
    condition: "stocked_qty < recommended_stock_qty"
  - id: ERR_MAINTENANCE_NOT_HANDED_OVER
    http: 409
    condition: "Advance to OPERATIONS_HANDOVER attempted with no maintenance item, or with one not HANDED_OVER"
  - id: ERR_SOFT_OPEN_NOT_VALIDATED
    http: 409
    condition: "Advance to OPERATIONS_HANDOVER or maintenance hand-over attempted while soft_open_validated == false"
  - id: ERR_LEDGER_KIND_NOT_WRITABLE
    http: 422
    condition: "entry_kind other than CHANGE_ORDER posted directly by a client"
  - id: ERR_LEDGER_ENTRY_ALREADY_REVERSED
    http: 409
    condition: "Reverse attempted on an entry already reversed, or on a REVERSAL entry"
  - id: ERR_BUDGET_CEILING_EXCEEDED
    http: 409
    condition: "committed_cost_cents plus the amount this request would post exceeds budget_ceiling_cents"
  - id: ERR_PHASE_PRECONDITION_UNMET
    http: 409
    condition: "The requested design_phase is the correct successor but its content preconditions are unmet (no scene for CONCEPT, no selected ride system or fewer than two sequenced scenes for SCHEMATIC, no submitted or approved package for DESIGN_DEVELOPMENT, no approved package for PRODUCTION)"

roles:
  - name: OwnerRep
    description: "Owner's representative: opens the program, selects the ride system, accepts the queue, approves design packages, waives non-critical findings, posts change orders and accepts operations handoff"
    identity: opaque
    exclusive_operations:
      - "POST /attraction-projects"
      - "PATCH /attraction-projects/{id}"
      - "POST /attraction-projects/{id}/advance-phase"
      - "POST /ride-systems/{id}/select"
      - "POST /queue-segments/{id}/accept"
      - "POST /queue-segments/{id}/retire"
      - "POST /design-packages/{id}/request-revision"
      - "POST /design-packages/{id}/approve"
      - "POST /safety-findings/{id}/waive"
      - "POST /value-engineering-items/{id}/open-review"
      - "POST /maintenance-items/{id}/hand-over"
      - "POST /budget-ledger-entries"
      - "POST /budget-ledger-entries/{id}/reverse"
    shared_operations:
      - "POST /design-packages/{id}/submit (shared with CreativeDirector; a package this user submitted may not be approved by the same user)"
      - "POST /ve-ballots (shared with ContractorPM and CreativeDirector, one ballot per party_role)"
      - "every GET read endpoint"
  - name: CreativeDirector
    description: "Designer of record: authors the storyline scenes, the queue routing and the design packages, and re-prices them during revision rounds"
    identity: opaque
    exclusive_operations:
      - "POST /queue-segments"
      - "POST /show-scenes"
      - "POST /show-scenes/{id}/sequence"
      - "POST /design-packages"
      - "POST /design-packages/{id}/revise"
    shared_operations:
      - "POST /design-packages/{id}/submit (shared with OwnerRep)"
      - "POST /ve-ballots (party_role CreativeDirector may APPROVE or ABSTAIN but never VETO)"
      - "every GET read endpoint except GET /attraction-projects/{id}/budget-ledger-entries"
  - name: RideEngineer
    description: "Ride and control-system engineer: registers candidate systems, revises engineering parameters, commissions the ride and authors the maintenance manual"
    identity: opaque
    exclusive_operations:
      - "POST /ride-systems"
      - "PATCH /ride-systems/{id}"
      - "POST /ride-systems/{id}/mark-engineered"
      - "POST /ride-systems/{id}/commission"
      - "POST /maintenance-items"
      - "POST /maintenance-items/{id}/approve"
    shared_operations:
      - "GET reads on projects, ride systems, design packages, safety reviews, findings and maintenance items"
  - name: ShowProgrammer
    description: "Show programmer: places and verifies lighting, audio, media, animation and special-effect cues, programs scene quality and validates scenes against rehearsals"
    identity: opaque
    exclusive_operations:
      - "POST /effect-cues"
      - "POST /effect-cues/{id}/verify"
      - "POST /show-scenes/{id}/program"
      - "POST /show-scenes/{id}/validate"
    shared_operations:
      - "GET reads on projects, scenes, cues and rehearsal runs"
  - name: ThirdPartyReviewer
    description: "Independent safety reviewer: opens standard-based reviews, raises findings, closes remediated findings and clears reviews"
    identity: opaque
    exclusive_operations:
      - "POST /safety-reviews"
      - "POST /safety-reviews/{id}/clear"
      - "POST /safety-findings"
      - "POST /safety-findings/{id}/close"
    shared_operations:
      - "GET reads on design packages, safety reviews and findings"
  - name: ContractorPM
    description: "Installation contractor's project manager: remediates findings, proposes value engineering, books rehearsal windows and records rehearsal results"
    identity: opaque
    exclusive_operations:
      - "POST /safety-findings/{id}/resolve"
      - "POST /value-engineering-items"
      - "POST /rehearsal-runs"
      - "POST /rehearsal-runs/{id}/complete"
    shared_operations:
      - "POST /ve-ballots (party_role ContractorPM)"
      - "GET reads on projects, ride systems, queue segments, packages, findings, value-engineering items, rehearsal runs, maintenance items and the cost ledger"
  - name: ProgramAdmin
    description: "Platform operator: repositions the logical clock and holds read-only oversight of every program record"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET read endpoint"

