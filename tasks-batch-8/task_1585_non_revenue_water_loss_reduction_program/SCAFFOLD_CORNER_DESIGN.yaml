              as_user_id: "fs-1"
          trigger:
            - call: "POST /nrw/leaks/${leak_rb3}/verify-repair"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
              captures: { err_rb3: $.data.error_id }
            - call: "POST /nrw/leaks/${leak_rb3}/verify-repair"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-2"
