      - name: metered_window_inclusive_boundary
        claim_type: input_set_filtering
        grounds: [calculations.fuel_burn_projection]
        distinguishing_aspect: "Events recorded exactly at now-7d are included and events one hour earlier excluded: with 160 L / 4 h inside the window and 600 L / 10 h outside, metered rate is 40.0 L/h (wrong inclusion would give 54.29)."
        test_recipe:
          setup:
            - "Contract K1 ON_RENT with U1 (200 kW) DEPLOYED; clock at 2026-09-08T00:00:00Z (window [2026-09-01, 2026-09-08] inclusive)"
            - "Telemetry: RUNTIME 4 h + FUEL_BURN 160 L at 2026-09-01T00:00:00Z (boundary); RUNTIME 10 h + FUEL_BURN 600 L at 2026-08-31T23:00:00Z (outside)"
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Acme Construction", billing_email: "ap@acme.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
