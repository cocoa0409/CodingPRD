              as: IntakeCoordinator
              captures: { ref3_id: $.data.id }
            - call: "POST /tcm/referrals/${ref3_id}/accept"
              payload: { navigator_id: "${nav0_id}" }
              as: IntakeCoordinator
              captures: { ep3_id: $.data.created_episode_id }
            - call: "POST /tcm/referrals"
              payload: { patient_id: "${pat4_id}", facility_id: "${fac_id}", payer_id: "${payer_id}", discharge_date: "2026-05-01", discharge_datetime: "2026-05-01T14:00:00Z", discharge_disposition: "HOME", stay_type: "INPATIENT", length_of_stay_days: 4, admission_acuity: "URGENT", comorbidity_count: 5, prior_ed_visits_6mo: 2, prior_admissions_6mo: 1, social_risk_flags_count: 3 }
