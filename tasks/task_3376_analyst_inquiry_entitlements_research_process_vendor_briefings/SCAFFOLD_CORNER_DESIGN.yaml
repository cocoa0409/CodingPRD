            - call: "POST /research/vendor-inclusions/${inc_id}/finalize"
              payload: { outcome: "INCLUDE" }
              as: ResearchDirector
            - call: "GET /research/documents/${doc_id}"
              payload: {}
              as: ResearchDirector
              captures: { doc_v2: $.data.version }
            - call: "POST /research/documents/${doc_id}/vendor-inclusions"
              payload: { vendor_id: "${ven2_id}", dimension_scores: [{ dimension: "PRODUCT_CAPABILITY", raw_score: 2.10, weight_pct: 0.30 }, { dimension: "MARKET_EXECUTION", raw_score: 2.40, weight_pct: 0.25 }, { dimension: "CUSTOMER_VOICE", raw_score: 1.90, weight_pct: 0.20 }, { dimension: "INNOVATION_ROADMAP", raw_score: 2.20, weight_pct: 0.15 }, { dimension: "PRICING_TRANSPARENCY", raw_score: 2.00, weight_pct: 0.10 }], inclusion_criteria_met_count: 3, expected_document_version: "${doc_v2}", reprint_tier: "NONE", permitted_marketing_use: "NO_USE", reprint_copies_authorized: 0 }
              as: Analyst
