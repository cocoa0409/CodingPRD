  - section: calculations
    instances:
      - name: svi_tier_floors_are_inclusive_at_every_boundary
        claim_type: Constants Applied
        grounds:
          - calculations.svi_tier_assignment
          - entities.Jurisdiction.fields.svi_tier
        distinguishing_aspect: "Six jurisdictions at 0.24 / 0.25 / 0.49 / 0.50 / 0.74 / 0.75 land in LOW / MODERATE / MODERATE / HIGH / HIGH / SEVERE, proving each tier floor is inclusive on the low side and exclusive on the high side, and disadvantaged_flag turns on exactly at the HIGH floor 0.50."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Boundary 024", jurisdiction_code: "B-024", population: 1000, svi_score: 0.24, endorsement_weight: 1 }
              as: RegionalAdministrator
              captures: { j_024_id: $.data.id }
