            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
          trigger:
            - call: "GET /facilities/${fac}"
              payload: {}
              as: "(no X-Role header sent)"
            - call: "GET /facilities/${fac}"
              payload: {}
              as: "RegionalDirector"
              as_user_id: "admin-01"
            - call: "POST /submissions/${sub}/validate"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "33333333-3333-4333-8333-333333333333"
          assert:
            - "the header-less call returns 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "the RegionalDirector call returns 400 with data.error_id == ERR_UNKNOWN_ROLE, since RegionalDirector is not one of the seven declared roles"
            - "the unknown X-User-ID call returns 404 with data.error_id == ERR_IDENTITY_NOT_FOUND, not ERR_WORKER_NOT_FOUND, because the failure is on the acting identity rather than on a path resource"
            - "QuarterlySubmission.${sub}.status is still DRAFT"

      - name: pagination_and_date_shape_probes_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_PAGINATION]
          - errors[ERR_INVALID_DATE_FORMAT]
          - validations[priority 15 ERR_INVALID_PAGINATION]
          - validations[priority 16 ERR_INVALID_DATE_FORMAT]
        distinguishing_aspect: "limit is bounded at 100 rather than merely positive, and the date-shape rule covers YYYY-MM-DD fields, HH:MM time-of-day fields, and impossible calendar dates alike."
        test_recipe:
          setup:
            - "A DRAFT 2026Q2 submission"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
          trigger:
            - call: "GET /submissions"
              payload: { facility_id: "${fac}", limit: 101, offset: 0 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "GET /submissions"
              payload: { facility_id: "${fac}", limit: 10, offset: -1 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /census-days"
              payload: { submission_id: "${sub}", census_date: "04/15/2026", resident_count: 6 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-31", shift_start: "7:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "limit 101 returns 422 with data.error_id == ERR_INVALID_PAGINATION, since the declared maximum is 100"
            - "offset -1 returns 422 with data.error_id == ERR_INVALID_PAGINATION"
            - "census_date 04/15/2026 returns 422 with data.error_id == ERR_INVALID_DATE_FORMAT"
            - "work_date 2026-04-31 with shift_start 7:00 returns 422 with data.error_id == ERR_INVALID_DATE_FORMAT, since April has 30 days and HH:MM requires two digits, and it is not reported as ERR_WORK_DATE_OUTSIDE_PERIOD"
            - "no CensusDay or HourEntry is created and QuarterlySubmission.${sub}.version is still 1"

  - section: rbac
    instances:
      - name: each_role_performs_its_own_exclusive_operations
        claim_type: role_allowed_operations
        grounds:
          - rbac.PlatformAdmin
          - rbac.StaffingCoordinator
          - rbac.FacilityAdministrator
          - rbac.VendorRepresentative
          - rbac.StateAuditor
          - rbac.CmsPublisher
          - rbac.AppealsReviewer
        distinguishing_aspect: "One end-to-end quarter exercises an exclusive operation of all seven roles, proving the approval chain is walkable when each step is taken by the right role."
        test_recipe:
          setup:
            - "A DRAFT 2026Q2 submission with a payroll-supported, SUPPORTED 8.00-hour RN shift, one RECONCILED census day, and a DRAFT vendor batch"
          setup_api_calls:
            - *k_fac
