# =============================================================================
# task_2507 — False Alarm Reduction & Alarm Permit Program (city false alarm
# reduction unit) — benchmark seed tables §1.0–§1.7
# Difficulty target: above Expert tier (§0.4/§0.5)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2507. False Alarm Reduction & Alarm Permit Program (city false alarm reduction unit): alarm system registration with site, contact and monitoring company data, permit issuance, annual renewal and unpermitted-system penalties, false alarm counting by address with escalating fee schedules and exempt causes, verified response and enhanced call verification requirements before dispatch, suspension of police response after repeated false alarms with reinstatement conditions, alarm company reporting obligations and dispatch request validation, appeal hearings for contested false alarm determinations, billing, collections and referral of unpaid penalties

domain_name: false-alarm-reduction-permit-program
api_prefix: /false-alarm-program

# =============================================================================
# §1.0 Complexity Profile + Response Envelope
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities under a single constant program namespace; every child is
  # discovered through a filtered list endpoint keyed on its FK field. No
  # entity is nested inside another entity's URL path.

  state_machine_shape: cyclic
  # FalseAlarmIncident cycles COUNTED -> APPEALED -> COUNTED (appeal denied) and
  # COUNTED -> APPEALED -> UNDER_REVIEW -> COUNTED (remand); AlarmPermit cycles
  # ACTIVE -> RENEWAL_DUE -> GRACE -> ACTIVE; ComplianceReport cycles
  # SUBMITTED -> VARIANCE_FLAGGED -> CORRECTED -> SUBMITTED. PenaltyInvoice
  # additionally carries two independent state fields (payment_status and
  # collections_stage) that advance on separate axes.

  relationship_patterns:
    - one_to_many          # AlarmSite -> AlarmSystem / SiteContact / PenaltyInvoice
    - self_referential     # Appeal.prior_appeal_id -> Appeal.id (rehearing chain)
    - cross_aggregate      # DispatchRequest -> AlarmCompany, PenaltyInvoice -> SuspensionOrder
    - polymorphic          # PenaltyInvoice attaches to incident OR permit OR suspension order

  role_model: segregation_of_duties
  # The FalseAlarmReviewOfficer who determined an incident may not decide its
  # appeal; the BillingClerk who records money may not adjust or waive it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # --- configuration -------------------------------------------------------
  - name: FeeSchedule
    parent: null
    common_fields: true
    fields:
      - { name: schedule_code, type: string, source: input, description: "Ordinance schedule code, unique across all FeeSchedule rows regardless of status", constraints: "unique" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | SUPERSEDED — at most one ACTIVE row program-wide", constraints: "DRAFT|ACTIVE|SUPERSEDED" }
      - { name: effective_from, type: datetime, source: input, description: "ISO 8601 UTC instant the schedule governs from" }
      - { name: counting_window_mode, type: enum, source: input, default: "ROLLING_365", description: "Selects which false-alarm counting variant is authoritative for fee assessment: ROLLING_365 | PERMIT_YEAR", constraints: "ROLLING_365|PERMIT_YEAR" }
      - { name: free_alarm_allowance, type: integer, source: input, default: 2, description: "Number of leading chargeable occurrences per window whose tier base fee is 0 (they still count toward thresholds)" }
      - { name: fee_tiers, type: array, source: input, description: "Ordered marginal tiers [{ from_index, to_index (null = open ended), base_fee_cents }] keyed on FalseAlarmIncident.occurrence_index" }
      - { name: occupancy_multipliers, type: object, source: input, description: "Multiplier per AlarmSite.occupancy_class, e.g. { RESIDENTIAL: 1.00, COMMERCIAL: 1.50, SCHOOL: 1.25, FINANCIAL: 2.00, GOVERNMENT: 1.00 }" }
      - { name: non_ecv_surcharge_pct, type: number, source: input, default: 0.20, description: "Surcharge factor applied when the originating DispatchRequest.verification_method is NONE or SINGLE_CALL" }
      - { name: unpermitted_multiplier, type: number, source: input, default: 2.00, description: "Multiplier applied when DispatchRequest.system_permitted_at_occurrence is false" }
      - { name: suspension_period_aggravation_cents, type: integer, source: input, default: 50000, description: "Flat amount added after the per-incident cap when the incident occurred inside an EFFECTIVE SuspensionOrder interval" }
      - { name: per_incident_fee_cap_cents, type: integer, source: input, default: 100000, description: "Cap applied to the multiplied-and-rounded amount, before aggravation is added" }
      - { name: probation_threshold_count, type: integer, source: input, default: 4, description: "Window count at or above which AlarmSite.response_status becomes RESPONSE_PROBATION" }
      - { name: suspension_threshold_count, type: integer, source: input, default: 6, description: "Window count at or above which a SuspensionOrder is auto-proposed" }
      - { name: appeal_filing_days, type: integer, source: input, default: 20, description: "Maximum whole days between FalseAlarmIncident.determined_at and Appeal.filed_at, inclusive" }
      - { name: permit_term_days, type: integer, source: input, default: 365, description: "Length of an AlarmPermit term in whole days" }
      - { name: renewal_grace_days, type: integer, source: input, default: 30, description: "Whole days after term_end_at during which a permit sits in GRACE and may still be renewed" }
      - { name: new_installation_grace_days, type: integer, source: input, default: 30, description: "Whole days after FIRST permit issuance during which incidents are exempt under NEW_INSTALLATION_GRACE" }
      - { name: permit_issue_fee_cents, type: integer, source: input, default: 5000, description: "Fee billed when a permit is first issued" }
      - { name: permit_renewal_fee_cents, type: integer, source: input, default: 3000, description: "Base fee billed on each renewal" }
      - { name: late_renewal_tiers, type: array, source: input, description: "Ordered tiers [{ max_days_late (null = open ended), fee_cents }] added to a renewal invoice, e.g. [{15,1500},{30,3000},{null,6000}]" }
      - { name: unpermitted_operation_penalty_cents, type: integer, source: input, default: 20000, description: "Penalty billed when an AlarmSystem transitions to UNPERMITTED" }
      - { name: reinstatement_base_fee_cents, type: integer, source: input, default: 60000, description: "Base reinstatement fee billed when a SuspensionOrder is served" }
      - { name: reinstatement_escalation_pct, type: number, source: input, default: 0.50, description: "Per-prior-suspension escalation factor on the reinstatement fee" }
      - { name: admin_fee_pct, type: number, source: input, default: 0.05, description: "Administrative fee percentage applied to a PenaltyInvoice rounded subtotal" }
      - { name: admin_fee_min_cents, type: integer, source: input, default: 500, description: "Lower clamp on the administrative fee" }
      - { name: admin_fee_max_cents, type: integer, source: input, default: 5000, description: "Upper clamp on the administrative fee" }
      - { name: invoice_due_days, type: integer, source: input, default: 30, description: "Whole days from PenaltyInvoice.issued_on to due_on" }
      - { name: late_penalty_pct, type: number, source: input, default: 0.10, description: "Late penalty percentage on outstanding principal once an invoice passes due_on" }
      - { name: delinquency_days, type: integer, source: input, default: 90, description: "Whole days past due_on at which an invoice is eligible for collections referral" }
      - { name: collections_referral_threshold_cents, type: integer, source: input, default: 25000, description: "Minimum outstanding amount for collections referral eligibility" }
      - { name: delinquent_balance_block_cents, type: integer, source: input, default: 50000, description: "AlarmSite.outstanding_balance_cents at or above which permit renewal is fiscally blocked" }
      - { name: exempt_cause_codes, type: array, source: input, description: "Cause codes that force an EXEMPT determination, e.g. [SEVERE_WEATHER, UTILITY_POWER_FAILURE, TELEPHONE_LINE_FAILURE, AUTHORIZED_TEST_WITH_NOTICE, CRIMINAL_OFFENSE_CONFIRMED, NEW_INSTALLATION_GRACE]" }
      - { name: company_probation_score_threshold, type: number, source: input, default: 0.70, description: "AlarmCompany.reporting_compliance_score strictly below this puts the company on PROBATION" }
      - { name: company_suspension_score_threshold, type: number, source: input, default: 0.50, description: "AlarmCompany.reporting_compliance_score strictly below this suspends the company" }
      - { name: superseded_at, type: datetime, source: system, description: "Set when a newer schedule is activated; null while DRAFT or ACTIVE" }

  # --- alarm industry party -------------------------------------------------
  - name: AlarmCompany
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered business name of the alarm/monitoring company" }
      - { name: license_number, type: string, source: input, description: "State alarm business license number", constraints: "unique across AlarmCompany rows with status != REVOKED" }
      - { name: contact_email, type: string, source: input, description: "Operations contact email" }
      - { name: contact_phone, type: string, source: input, description: "Operations contact phone in E.164 form" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | PROBATION | SUSPENDED | REVOKED", constraints: "ACTIVE|PROBATION|SUSPENDED|REVOKED" }
      - { name: score_mode, type: enum, source: input, default: "VOLUME_WEIGHTED", description: "Which reporting-compliance variant governs this company: VOLUME_WEIGHTED | PERIOD_EQUAL", constraints: "VOLUME_WEIGHTED|PERIOD_EQUAL" }
      - { name: reporting_compliance_score, type: number, source: computed, default: 1.00, description: "Score in [0.00, 1.00] with 2 decimal places, recomputed by calculation company_reporting_compliance_score" }
      - { name: monitored_system_count, type: integer, source: computed, description: "Count of AlarmSystem rows with monitoring_company_id = this company and status IN {SUBMITTED, PERMITTED, UNPERMITTED}" }
      - { name: dispatch_request_count_lifetime, type: integer, source: computed, description: "Count of DispatchRequest rows created by this company across all statuses" }
      - { name: consecutive_flagged_report_count, type: integer, source: computed, description: "Number of most-recent consecutive ComplianceReport rows ending in VARIANCE_FLAGGED, ordered by period_start ASC" }
      - { name: probation_started_at, type: datetime, source: system, description: "Instant the company last entered PROBATION; null when never on probation" }
      - { name: status_reason, type: string, source: system, description: "Free-text reason recorded by the last status action; null on creation" }
      - { name: last_status_action_at, type: datetime, source: system, description: "Instant of the last status change on this company" }

  # --- premises ------------------------------------------------------------
  - name: AlarmSite
    parent: null
    common_fields: true
    fields:
      - { name: address_key, type: string, source: input, description: "Normalized premises address used as the false-alarm counting key", constraints: "unique among AlarmSite rows with status = ACTIVE" }
      - { name: street_address, type: string, source: input, description: "Display street address" }
      - { name: city, type: string, source: input, description: "City name" }
      - { name: zip_code, type: string, source: input, description: "Five-digit postal code" }
      - { name: occupancy_class, type: enum, source: input, description: "RESIDENTIAL | COMMERCIAL | SCHOOL | FINANCIAL | GOVERNMENT — selects the occupancy multiplier", constraints: "RESIDENTIAL|COMMERCIAL|SCHOOL|FINANCIAL|GOVERNMENT" }
      - { name: police_beat, type: string, source: input, description: "Patrol beat identifier for the premises" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | ARCHIVED", constraints: "ACTIVE|ARCHIVED" }
      - { name: governing_fee_schedule_id, type: string, source: system, description: "FK -> FeeSchedule.id; pinned to the ACTIVE schedule at the moment this site's FIRST AlarmPermit is issued and immutable thereafter; null until then" }
      - { name: response_status, type: enum, source: computed, default: "RESPONSE_ACTIVE", description: "RESPONSE_ACTIVE | RESPONSE_PROBATION | RESPONSE_SUSPENDED — derived by calculation site_response_posture", constraints: "RESPONSE_ACTIVE|RESPONSE_PROBATION|RESPONSE_SUSPENDED" }
      - { name: chargeable_count_window, type: integer, source: computed, default: 0, description: "Authoritative window count under the governing schedule's counting_window_mode" }
      - { name: chargeable_count_rolling_365, type: integer, source: computed, default: 0, description: "Window count under the ROLLING_365 variant, always maintained for comparison" }
      - { name: chargeable_count_permit_year, type: integer, source: computed, default: 0, description: "Window count under the PERMIT_YEAR variant, always maintained for comparison" }
      - { name: lifetime_assessed_cents, type: integer, source: computed, default: 0, description: "Sum of PenaltyInvoice.assessed_cents for this site over invoices with payment_status != VOIDED" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Sum of PenaltyInvoice.outstanding_cents over invoices with payment_status IN {UNPAID, PARTIALLY_PAID} and collections_stage != WRITTEN_OFF" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Unallocated payment remainder held on the premises account, never negative" }
      - { name: unpermitted_system_count, type: integer, source: computed, default: 0, description: "Count of AlarmSystem rows at this site with status = UNPERMITTED" }
      - { name: lifted_suspension_count, type: integer, source: computed, default: 0, description: "Count of SuspensionOrder rows for this site with status = LIFTED" }
      - { name: ecv_callable_contact_count, type: integer, source: computed, default: 0, description: "Count of SiteContact rows with status = ACTIVE and is_ecv_callable = true" }
      - { name: renewal_block_active, type: boolean, source: computed, default: false, description: "True when outstanding_balance_cents >= FeeSchedule.delinquent_balance_block_cents" }

  - name: SiteContact
    parent: AlarmSite
    common_fields: true
    fields:
      - { name: alarm_site_id, type: string, source: input, description: "FK -> AlarmSite.id; premises this responsible party is listed for" }
      - { name: full_name, type: string, source: input, description: "Responsible party name" }
      - { name: phone_number, type: string, source: input, description: "Callback number in E.164 form" }
      - { name: relationship, type: string, source: input, description: "Relationship to the premises (OWNER, MANAGER, KEYHOLDER, ...)" }
      - { name: contact_priority, type: integer, source: input, description: "Call order 1..5", constraints: "1..5, unique per alarm_site_id among rows with status = ACTIVE" }
      - { name: is_ecv_callable, type: boolean, source: input, default: true, description: "Whether this contact counts toward enhanced call verification" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | REMOVED", constraints: "ACTIVE|REMOVED" }
      - { name: removed_at, type: datetime, source: system, description: "Instant the contact was removed; null while ACTIVE" }

  # --- registration & permit ----------------------------------------------
  - name: AlarmSystem
    parent: AlarmSite
    common_fields: true
    fields:
      - { name: alarm_site_id, type: string, source: input, description: "FK -> AlarmSite.id; premises where the equipment is installed" }
      - { name: monitoring_company_id, type: string, source: input, description: "FK -> AlarmCompany.id; company that monitors this system and may request dispatch for it" }
      - { name: system_type, type: enum, source: input, description: "BURGLARY | HOLDUP_PANIC | COMBINATION", constraints: "BURGLARY|HOLDUP_PANIC|COMBINATION" }
      - { name: zone_count, type: integer, source: input, description: "Number of protected zones", constraints: ">= 1" }
      - { name: ecv_enabled, type: boolean, source: input, description: "Whether the panel is configured for enhanced call verification" }
      - { name: verified_response_mode, type: enum, source: input, default: "NONE", description: "NONE | AUDIO_VIDEO_REQUIRED | GUARD_REQUIRED — extra proof this system must carry before police dispatch", constraints: "NONE|AUDIO_VIDEO_REQUIRED|GUARD_REQUIRED" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | PERMITTED | UNPERMITTED | REJECTED | DECOMMISSIONED", constraints: "SUBMITTED|PERMITTED|UNPERMITTED|REJECTED|DECOMMISSIONED" }
      - { name: installed_at, type: datetime, source: input, description: "Installation instant reported on the registration" }
      - { name: permitted_at, type: datetime, source: system, description: "Instant the system last entered PERMITTED; null until first issuance" }
      - { name: unpermitted_since, type: datetime, source: system, description: "Instant the system last entered UNPERMITTED; null otherwise" }
      - { name: rejection_reason, type: string, source: system, description: "Clerk's reason when status = REJECTED; null otherwise" }
      - { name: decommissioned_at, type: datetime, source: system, description: "Instant the system was decommissioned; null otherwise" }

  - name: AlarmPermit
    parent: AlarmSystem
    common_fields: true
    fields:
      - { name: alarm_system_id, type: string, source: system, description: "FK -> AlarmSystem.id; permitted equipment" }
      - { name: alarm_site_id, type: string, source: system, description: "FK -> AlarmSite.id; denormalized premises copied from the system at issuance" }
      - { name: permit_number, type: string, source: system, description: "Zero-padded sequential number assigned in issuance order, formatted AP-000001", constraints: "unique" }
      - { name: status, type: enum, source: system, default: "PENDING_ISSUANCE", description: "PENDING_ISSUANCE | ACTIVE | RENEWAL_DUE | RENEWAL_BLOCKED | GRACE | EXPIRED | REVOKED", constraints: "PENDING_ISSUANCE|ACTIVE|RENEWAL_DUE|RENEWAL_BLOCKED|GRACE|EXPIRED|REVOKED" }
      - { name: term_start_at, type: datetime, source: system, description: "Start instant of the current term" }
      - { name: term_end_at, type: datetime, source: computed, description: "term_start_at + FeeSchedule.permit_term_days whole days" }
      - { name: grace_through_at, type: datetime, source: computed, description: "term_end_at + FeeSchedule.renewal_grace_days whole days; the last instant a GRACE renewal is accepted" }
      - { name: new_installation_grace_through, type: datetime, source: computed, description: "First-issuance term_start_at + FeeSchedule.new_installation_grace_days; null on renewed terms — incidents occurring at or before this instant are exempt" }
      - { name: renewal_count, type: integer, source: system, default: 0, description: "Number of completed renewals on this permit" }
      - { name: issued_by_user_id, type: string, source: system, description: "Opaque PermitClerk identifier taken from X-User-ID at issuance" }
      - { name: last_renewed_at, type: datetime, source: system, description: "Instant of the most recent renewal; null before the first" }
      - { name: revocation_reason, type: string, source: system, description: "Reason recorded when status = REVOKED; null otherwise" }

  # --- dispatch pipeline ---------------------------------------------------
  - name: DispatchRequest
    parent: AlarmSystem
    common_fields: true
    fields:
      - { name: alarm_system_id, type: string, source: input, description: "FK -> AlarmSystem.id; system that produced the signal" }
      - { name: alarm_site_id, type: string, source: system, description: "FK -> AlarmSite.id; denormalized premises copied from the system" }
      - { name: monitoring_company_id, type: string, source: system, description: "FK -> AlarmCompany.id; requesting company, copied from the system" }
      - { name: alarm_type, type: enum, source: input, description: "BURGLARY | HOLDUP | PANIC | DURESS", constraints: "BURGLARY|HOLDUP|PANIC|DURESS" }
      - { name: verification_method, type: enum, source: input, description: "NONE | SINGLE_CALL | TWO_CALL_ECV | AUDIO_VIDEO | GUARD_RESPONSE", constraints: "NONE|SINGLE_CALL|TWO_CALL_ECV|AUDIO_VIDEO|GUARD_RESPONSE" }
      - { name: call_attempts, type: array, source: input, description: "Verification call log [{ site_contact_id, attempted_at, outcome }] where outcome IN {NO_ANSWER, VOICEMAIL, ANSWERED_UNVERIFIED, ANSWERED_CANCELLED}" }
      - { name: distinct_ecv_contact_count, type: integer, source: computed, default: 0, description: "Number of distinct site_contact_id values in call_attempts that resolve to an ACTIVE, ECV-callable SiteContact of this system's site" }
      - { name: audio_video_evidence, type: boolean, source: input, default: false, description: "Company asserts recorded audio/video of the event" }
      - { name: guard_on_scene, type: boolean, source: input, default: false, description: "Company asserts a private guard verified the scene" }
      - { name: occurred_at, type: datetime, source: input, description: "Signal instant reported by the company" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | VALIDATED | DISPATCHED | REFUSED | CLOSED_VALID | CANCELLED", constraints: "SUBMITTED|VALIDATED|DISPATCHED|REFUSED|CLOSED_VALID|CANCELLED" }
      - { name: ecv_sufficient, type: boolean, source: computed, description: "Outcome of calculation ecv_verification_sufficiency at submission" }
      - { name: system_permitted_at_occurrence, type: boolean, source: computed, description: "True when the system's status was PERMITTED at submission; frozen on the row and reused for fee assessment" }
      - { name: refusal_reason, type: enum, source: system, description: "ECV_DEFICIENT | RESPONSE_SUSPENDED | VERIFIED_RESPONSE_MISSING | DUPLICATE_SIGNAL — null unless status = REFUSED", constraints: "ECV_DEFICIENT|RESPONSE_SUSPENDED|VERIFIED_RESPONSE_MISSING|DUPLICATE_SIGNAL" }
      - { name: validated_at, type: datetime, source: system, description: "Instant a supervisor validated the request; null otherwise" }
      - { name: validated_by_user_id, type: string, source: system, description: "Opaque PoliceDispatchSupervisor id that validated the request; null until VALIDATED" }
      - { name: dispatched_at, type: datetime, source: system, description: "Instant units were dispatched; null otherwise" }
      - { name: idempotency_key, type: string, source: input, description: "Optional company-supplied key", constraints: "when present, unique per monitoring_company_id" }

  - name: FalseAlarmIncident
    parent: DispatchRequest
    common_fields: true
    fields:
      - { name: dispatch_request_id, type: string, source: input, description: "FK -> DispatchRequest.id; dispatch that produced no valid alarm" }
      - { name: alarm_site_id, type: string, source: system, description: "FK -> AlarmSite.id; denormalized counting key owner" }
      - { name: alarm_system_id, type: string, source: system, description: "FK -> AlarmSystem.id; denormalized equipment reference" }
      - { name: occurred_at, type: datetime, source: system, description: "Copied from DispatchRequest.occurred_at; the ordering key for occurrence numbering" }
      - { name: cause_code, type: enum, source: input, description: "OPERATOR_ERROR | EQUIPMENT_MALFUNCTION | UNKNOWN | ANIMAL_MOVEMENT | OPEN_DOOR_WINDOW | SEVERE_WEATHER | UTILITY_POWER_FAILURE | TELEPHONE_LINE_FAILURE | AUTHORIZED_TEST_WITH_NOTICE | CRIMINAL_OFFENSE_CONFIRMED | NEW_INSTALLATION_GRACE", constraints: "see enum list" }
      - { name: status, type: enum, source: system, default: "REPORTED", description: "REPORTED | UNDER_REVIEW | COUNTED | EXEMPT | APPEALED | EXEMPT_BY_APPEAL | VOIDED", constraints: "REPORTED|UNDER_REVIEW|COUNTED|EXEMPT|APPEALED|EXEMPT_BY_APPEAL|VOIDED" }
      - { name: determination, type: enum, source: system, description: "COUNTED | EXEMPT — null until a review officer rules", constraints: "COUNTED|EXEMPT" }
      - { name: exempt_cause_code, type: enum, source: system, description: "Cause code the exemption rests on; null unless status IN {EXEMPT, EXEMPT_BY_APPEAL}" }
      - { name: determined_at, type: datetime, source: system, description: "Instant of the current determination; reset on remand" }
      - { name: determined_by_user_id, type: string, source: system, description: "Opaque FalseAlarmReviewOfficer identifier who made the current determination" }
      - { name: occurrence_index, type: integer, source: computed, description: "1-based position of this incident among the site chargeable incidents (status IN {COUNTED, APPEALED}) inside the counting window; null while not chargeable" }
      - { name: assessed_fee_cents, type: integer, source: computed, default: 0, description: "Fee produced by calculation escalating_false_alarm_fee; 0 while not COUNTED" }
      - { name: fee_basis, type: object, source: computed, description: "Audit of the fee inputs { tier_base_cents, occupancy_multiplier, non_ecv_surcharge_applied, unpermitted_multiplier_applied, cap_applied, aggravation_cents }" }
      - { name: counted_window_mode, type: enum, source: computed, description: "Counting variant that produced occurrence_index: ROLLING_365 | PERMIT_YEAR", constraints: "ROLLING_365|PERMIT_YEAR" }
      - { name: appeal_count, type: integer, source: computed, default: 0, description: "Count of Appeal rows referencing this incident across all statuses" }
      - { name: narrative, type: string, source: input, description: "Officer narrative recorded with the report" }

  # --- appeals -------------------------------------------------------------
  - name: HearingDocket
    parent: null
    common_fields: true
    fields:
      - { name: hearing_officer_user_id, type: string, source: input, description: "Opaque HearingOfficer identifier this session belongs to" }
      - { name: session_start, type: datetime, source: input, description: "Half-open interval start of the session" }
      - { name: session_end, type: datetime, source: input, description: "Half-open interval end of the session, exclusive", constraints: "> session_start" }
      - { name: location, type: string, source: input, description: "Hearing room identifier" }
      - { name: capacity, type: integer, source: input, default: 4, description: "Maximum number of SCHEDULED appeals the session accepts", constraints: "1..8" }
      - { name: scheduled_appeal_count, type: integer, source: computed, default: 0, description: "Count of Appeal rows with this hearing_docket_id and status = SCHEDULED" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED_FOR_SCHEDULING | HELD | CANCELLED", constraints: "OPEN|CLOSED_FOR_SCHEDULING|HELD|CANCELLED" }
      - { name: held_at, type: datetime, source: system, description: "Instant the session was held; null otherwise" }

  - name: Appeal
    parent: FalseAlarmIncident
    common_fields: true
    fields:
      - { name: false_alarm_incident_id, type: string, source: input, description: "FK -> FalseAlarmIncident.id; contested determination" }
      - { name: alarm_site_id, type: string, source: system, description: "FK -> AlarmSite.id; denormalized premises copied from the incident" }
      - { name: hearing_docket_id, type: string, source: system, description: "FK -> HearingDocket.id; session the appeal is scheduled onto; null while FILED" }
      - { name: prior_appeal_id, type: string, source: input, description: "FK -> Appeal.id; the DENIED appeal this rehearing supersedes; null for an original appeal" }
      - { name: filed_by_user_id, type: string, source: system, description: "AlarmSite id of the filing permit holder, taken from X-User-ID" }
      - { name: grounds, type: enum, source: input, description: "WRONG_CAUSE_CODE | EXEMPT_CAUSE | NOT_MY_SYSTEM | VERIFIED_RESPONSE_DEFECT | COUNTING_ERROR | FEE_CALCULATION_ERROR", constraints: "see enum list" }
      - { name: narrative, type: string, source: input, description: "Appellant statement" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock instant the appeal was accepted" }
      - { name: status, type: enum, source: system, default: "FILED", description: "FILED | SCHEDULED | HEARD | GRANTED | DENIED | REMANDED | WITHDRAWN | DISMISSED_UNTIMELY", constraints: "FILED|SCHEDULED|HEARD|GRANTED|DENIED|REMANDED|WITHDRAWN|DISMISSED_UNTIMELY" }
      - { name: decision, type: enum, source: system, description: "GRANTED | DENIED | REMANDED — null until decided", constraints: "GRANTED|DENIED|REMANDED" }
      - { name: decided_at, type: datetime, source: system, description: "Instant the hearing officer ruled; null otherwise" }
      - { name: decided_by_user_id, type: string, source: system, description: "Opaque HearingOfficer identifier who ruled" }
      - { name: findings, type: string, source: system, description: "Written findings recorded with the decision" }
      - { name: rehearing_depth, type: integer, source: computed, default: 0, description: "0 for an original appeal; prior appeal's rehearing_depth + 1 otherwise", constraints: "<= 2" }

  # --- enforcement ---------------------------------------------------------
  - name: SuspensionOrder
    parent: AlarmSite
    common_fields: true
    fields:
      - { name: alarm_site_id, type: string, source: input, description: "FK -> AlarmSite.id; premises losing police response" }
      - { name: triggering_incident_id, type: string, source: input, description: "FK -> FalseAlarmIncident.id; the chargeable incident that crossed the threshold" }
      - { name: basis, type: enum, source: input, description: "EXCESSIVE_FALSE_ALARMS | UNPERMITTED_OPERATION | NONPAYMENT", constraints: "EXCESSIVE_FALSE_ALARMS|UNPERMITTED_OPERATION|NONPAYMENT" }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "PROPOSED | EFFECTIVE | REINSTATEMENT_PENDING | LIFTED | VACATED | EXPIRED", constraints: "PROPOSED|EFFECTIVE|REINSTATEMENT_PENDING|LIFTED|VACATED|EXPIRED" }
      - { name: effective_from, type: datetime, source: input, description: "Closed-interval start instant of the suspension" }
      - { name: effective_through, type: datetime, source: input, description: "Closed-interval end instant of the suspension", constraints: ">= effective_from" }
      - { name: suspension_sequence, type: integer, source: computed, description: "AlarmSite.lifted_suspension_count + 1 at creation time" }
      - { name: reinstatement_fee_cents, type: integer, source: computed, description: "Produced by calculation reinstatement_requirement_set when the order is served" }
      - { name: probation_days, type: integer, source: computed, description: "Post-reinstatement probation length in whole days" }
      - { name: required_conditions, type: object, source: computed, description: "{ inspection_required, ecv_attestation_required, min_ecv_contacts, invoices_paid_required } fixed when the order is served" }
      - { name: served_at, type: datetime, source: system, description: "Instant the order was served on the permit holder; null while PROPOSED" }
      - { name: reinstatement_requested_at, type: datetime, source: system, description: "Instant the permit holder submitted reinstatement evidence; null otherwise" }
      - { name: technician_inspection_date, type: datetime, source: input, description: "Inspection date asserted with the reinstatement request; null otherwise" }
      - { name: ecv_attestation, type: boolean, source: input, description: "Permit holder attestation that ECV is configured; null otherwise" }
      - { name: lifted_at, type: datetime, source: system, description: "Instant response was reinstated; null otherwise" }
      - { name: vacated_reason, type: string, source: system, description: "Reason recorded when status = VACATED; null otherwise" }

  # --- money ---------------------------------------------------------------
  - name: PenaltyInvoice
    parent: AlarmSite
    common_fields: true
    fields:
      - { name: alarm_site_id, type: string, source: system, description: "FK -> AlarmSite.id; billed premises" }
      - { name: false_alarm_incident_id, type: string, source: system, description: "FK -> FalseAlarmIncident.id; set only when kind = FALSE_ALARM_FEE" }
      - { name: alarm_permit_id, type: string, source: system, description: "FK -> AlarmPermit.id; set only when kind IN {PERMIT_ISSUE_FEE, PERMIT_RENEWAL_FEE, UNPERMITTED_OPERATION_PENALTY}" }
      - { name: suspension_order_id, type: string, source: system, description: "FK -> SuspensionOrder.id; set only when kind = REINSTATEMENT_FEE" }
      - { name: invoice_number, type: string, source: system, description: "Zero-padded sequential number assigned in issuance order, formatted INV-000001", constraints: "unique" }
      - { name: kind, type: enum, source: system, description: "FALSE_ALARM_FEE | PERMIT_ISSUE_FEE | PERMIT_RENEWAL_FEE | UNPERMITTED_OPERATION_PENALTY | REINSTATEMENT_FEE", constraints: "FALSE_ALARM_FEE|PERMIT_ISSUE_FEE|PERMIT_RENEWAL_FEE|UNPERMITTED_OPERATION_PENALTY|REINSTATEMENT_FEE" }
      - { name: line_items, type: array, source: computed, description: "[{ code, description, unit_amount_cents, quantity, multiplier, extended_cents }] — extended_cents is rounded per line before summation" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line_items[].extended_cents" }
      - { name: admin_fee_cents, type: integer, source: computed, description: "Clamped administrative fee on subtotal_cents" }
      - { name: assessed_cents, type: integer, source: computed, description: "subtotal_cents + admin_fee_cents + late_penalty_cents" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Sum of PaymentAllocation.amount_cents with status = APPLIED against this invoice" }
      - { name: adjusted_cents, type: integer, source: computed, default: 0, description: "Cumulative waived/reduced/written-off amount" }
      - { name: outstanding_cents, type: integer, source: computed, description: "assessed_cents - paid_cents - adjusted_cents, never negative" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "Money dimension: UNPAID | PARTIALLY_PAID | PAID | VOIDED", constraints: "UNPAID|PARTIALLY_PAID|PAID|VOIDED" }
      - { name: collections_stage, type: enum, source: system, default: "CURRENT", description: "Dunning dimension advancing independently of payment_status: CURRENT | NOTICE | FINAL_NOTICE | REFERRED | WRITTEN_OFF", constraints: "CURRENT|NOTICE|FINAL_NOTICE|REFERRED|WRITTEN_OFF" }
      - { name: issued_on, type: datetime, source: system, description: "Logical-clock instant the invoice was issued" }
      - { name: due_on, type: datetime, source: computed, description: "issued_on + FeeSchedule.invoice_due_days whole days" }
      - { name: late_penalty_cents, type: integer, source: computed, default: 0, description: "Late penalty added once by the nightly run after due_on" }
      - { name: days_delinquent, type: integer, source: computed, default: 0, description: "Whole days between due_on and the logical clock, floor at 0" }
      - { name: referral_total_cents, type: integer, source: computed, description: "Amount handed to the collections agency; null until REFERRED" }
      - { name: referral_agency, type: string, source: system, description: "Agency name recorded at referral; null otherwise" }
      - { name: referred_on, type: datetime, source: system, description: "Instant of referral; null otherwise" }

  - name: PaymentRecord
    parent: AlarmSite
    common_fields: true
    fields:
      - { name: alarm_site_id, type: string, source: input, description: "FK -> AlarmSite.id; paying premises account" }
      - { name: amount_cents, type: integer, source: input, description: "Tendered amount", constraints: ">= 1" }
      - { name: tendered_on, type: datetime, source: input, description: "Instant the money was tendered" }
      - { name: method, type: enum, source: input, description: "CARD | CHECK | CASH | ACH", constraints: "CARD|CHECK|CASH|ACH" }
      - { name: allocation_mode, type: enum, source: input, description: "AUTO_WATERFALL | EXPLICIT", constraints: "AUTO_WATERFALL|EXPLICIT" }
      - { name: receipt_number, type: string, source: system, description: "Zero-padded sequential receipt number, formatted RCT-000001", constraints: "unique" }
      - { name: recorded_by_user_id, type: string, source: system, description: "Opaque BillingClerk or ProgramAdministrator id that posted this payment; feeds the segregation-of-duties check on invoice adjustments" }
      - { name: status, type: enum, source: system, default: "APPLIED", description: "APPLIED | VOIDED", constraints: "APPLIED|VOIDED" }
      - { name: allocated_cents, type: integer, source: computed, description: "Portion consumed by invoice allocations" }
      - { name: credited_cents, type: integer, source: computed, description: "Remainder parked on AlarmSite.credit_balance_cents" }
      - { name: voided_at, type: datetime, source: system, description: "Instant the payment was voided; null otherwise" }
      - { name: void_reason, type: string, source: system, description: "Reason recorded at void; null otherwise" }

  - name: PaymentAllocation
    parent: PaymentRecord
    common_fields: false
    fields:
      - { name: payment_record_id, type: string, source: system, description: "FK -> PaymentRecord.id; tender this allocation draws from" }
      - { name: penalty_invoice_id, type: string, source: system, description: "FK -> PenaltyInvoice.id; invoice credited" }
      - { name: amount_cents, type: integer, source: computed, description: "Amount applied to the invoice" }
      - { name: sequence_index, type: integer, source: computed, description: "1-based position in the waterfall order that produced this allocation" }
      - { name: status, type: enum, source: system, default: "APPLIED", description: "APPLIED | REVERSED", constraints: "APPLIED|REVERSED" }

  # --- alarm company reporting --------------------------------------------
  - name: ComplianceReport
    parent: AlarmCompany
    common_fields: true
    fields:
      - { name: monitoring_company_id, type: string, source: input, description: "FK -> AlarmCompany.id; reporting company" }
      - { name: period_start, type: datetime, source: input, description: "Closed-interval start of the reporting period" }
      - { name: period_end, type: datetime, source: input, description: "Closed-interval end of the reporting period", constraints: "> period_start" }
      - { name: reported_dispatch_count, type: integer, source: input, description: "Dispatch requests the company claims it made in the period", constraints: ">= 0" }
      - { name: reported_cancellation_count, type: integer, source: input, description: "Signals the company claims it cancelled before dispatch", constraints: ">= 0" }
      - { name: ecv_attempt_count, type: integer, source: input, description: "Verification call attempts the company claims it made", constraints: ">= 0" }
      - { name: system_dispatch_count, type: integer, source: computed, description: "Count of DispatchRequest rows for this company with occurred_at inside [period_start, period_end] and status != CANCELLED" }
      - { name: variance_count, type: integer, source: computed, description: "abs(reported_dispatch_count - system_dispatch_count)" }
      - { name: variance_pct, type: number, source: computed, description: "variance_count / max(1, system_dispatch_count), 4 decimal places" }
      - { name: period_accuracy, type: number, source: computed, description: "1 - min(1, variance_pct), 4 decimal places" }
      - { name: period_ecv_rate, type: number, source: computed, description: "min(1, ecv_attempt_count / max(1, reported_dispatch_count)), 4 decimal places" }
      - { name: period_score, type: number, source: computed, description: "round_half_up(0.6 * period_accuracy + 0.4 * period_ecv_rate, 2)" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | ACCEPTED | VARIANCE_FLAGGED | CORRECTED", constraints: "SUBMITTED|ACCEPTED|VARIANCE_FLAGGED|CORRECTED" }
      - { name: correction_count, type: integer, source: computed, default: 0, description: "Number of times the company corrected this report", constraints: "<= 2" }
      - { name: reviewed_at, type: datetime, source: system, description: "Instant of the last review decision; null while SUBMITTED" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "Opaque ProgramAdministrator identifier who reviewed" }
      - { name: variance_notes, type: string, source: system, description: "Reviewer notes recorded when flagged; null otherwise" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: AlarmSystem
    initial_state: SUBMITTED
    terminal_states: [REJECTED, DECOMMISSIONED]
    transitions:
      - from: SUBMITTED
        to: PERMITTED
        trigger: "POST /false-alarm-program/alarm-systems/{systemId}/approve-registration"
        actor: PermitClerk
        preconditions:
          - "AlarmSite.status = ACTIVE"
          - "AlarmSite.ecv_callable_contact_count >= 2 (else ERR_INSUFFICIENT_ECV_CONTACTS)"
          - "AlarmSite.outstanding_balance_cents < FeeSchedule.delinquent_balance_block_cents (else ERR_SITE_BALANCE_DELINQUENT)"
          - "No SuspensionOrder for the site with status IN {EFFECTIVE, REINSTATEMENT_PENDING} (else ERR_POLICE_RESPONSE_SUSPENDED)"
          - "No AlarmPermit for this system with status IN {ACTIVE, RENEWAL_DUE, RENEWAL_BLOCKED, GRACE} (else ERR_ACTIVE_PERMIT_EXISTS)"
          - "Exactly one FeeSchedule with status = ACTIVE exists (else ERR_NO_ACTIVE_FEE_SCHEDULE)"
        side_effects:
          - "Creates AlarmPermit with status = ACTIVE, permit_number = next sequential AP-###### in issuance order, term_start_at = logical clock, term_end_at = term_start_at + permit_term_days, grace_through_at = term_end_at + renewal_grace_days"
          - "On the site's FIRST issuance only: sets AlarmSite.governing_fee_schedule_id = the ACTIVE FeeSchedule.id and AlarmPermit.new_installation_grace_through = term_start_at + new_installation_grace_days"
          - "Sets AlarmSystem.permitted_at = logical clock, clears unpermitted_since"
          - "Issues PenaltyInvoice kind = PERMIT_ISSUE_FEE via calculation invoice_assembly (lines: PERMIT_ISSUE_FEE)"
          - "Recomputes AlarmSite.outstanding_balance_cents, lifetime_assessed_cents, renewal_block_active (calculation site_balance_rollup)"
          - "Increments AlarmSite.version by 1 and AlarmCompany.monitored_system_count for the monitoring company"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /false-alarm-program/alarm-systems/{systemId}/reject-registration"
        actor: PermitClerk
        preconditions: ["AlarmSystem.status = SUBMITTED"]
        side_effects:
          - "Stores rejection_reason; decrements AlarmCompany.monitored_system_count for the monitoring company"

      - from: PERMITTED
        to: UNPERMITTED
        trigger: "system — cascade hop 1 of unpermitted_cascade, fired when this system's AlarmPermit leaves GRACE for EXPIRED during POST /false-alarm-program/_program-runs/nightly, or when the permit is REVOKED"
        actor: system
        preconditions: ["The system's AlarmPermit reached status IN {EXPIRED, REVOKED}"]
        side_effects:
          - "Sets unpermitted_since = logical clock"
          - "Increments AlarmSite.unpermitted_system_count (cascade hop 2)"
          - "Because the site now has an unpermitted system, issues PenaltyInvoice kind = UNPERMITTED_OPERATION_PENALTY against the site and permit (cascade hop 2)"

      - from: UNPERMITTED
        to: PERMITTED
        trigger: "system — fired when the system's AlarmPermit is renewed out of GRACE via POST /false-alarm-program/alarm-permits/{permitId}/renewals"
        actor: system
        preconditions: ["The system's AlarmPermit transitioned to ACTIVE"]
        side_effects:
          - "Sets permitted_at = logical clock, clears unpermitted_since"
          - "Decrements AlarmSite.unpermitted_system_count and recomputes AlarmSite.response_status"

      - from: PERMITTED
        to: DECOMMISSIONED
        trigger: "POST /false-alarm-program/alarm-systems/{systemId}/decommission"
        actor: ProgramAdministrator | PermitClerk | AlarmUser
        preconditions:
          - "No DispatchRequest for this system with status IN {SUBMITTED, VALIDATED, DISPATCHED} (else ERR_OPEN_DISPATCH_REQUEST_EXISTS)"
        side_effects:
          - "Sets decommissioned_at; transitions the system's AlarmPermit ACTIVE|RENEWAL_DUE|RENEWAL_BLOCKED|GRACE -> REVOKED with revocation_reason = SYSTEM_DECOMMISSIONED"
          - "Decrements AlarmCompany.monitored_system_count"

      - from: UNPERMITTED
        to: DECOMMISSIONED
        trigger: "POST /false-alarm-program/alarm-systems/{systemId}/decommission"
        actor: ProgramAdministrator | PermitClerk | AlarmUser
        preconditions:
          - "No DispatchRequest for this system with status IN {SUBMITTED, VALIDATED, DISPATCHED} (else ERR_OPEN_DISPATCH_REQUEST_EXISTS)"
        side_effects:
          - "Sets decommissioned_at; decrements AlarmSite.unpermitted_system_count and AlarmCompany.monitored_system_count"

  - entity: AlarmPermit
    initial_state: PENDING_ISSUANCE
    terminal_states: [EXPIRED, REVOKED]
    note: "Cyclic: ACTIVE -> RENEWAL_DUE -> GRACE -> ACTIVE repeats once per term; RENEWAL_DUE -> RENEWAL_BLOCKED -> RENEWAL_DUE is a fiscal side loop."
    transitions:
      - from: PENDING_ISSUANCE
        to: ACTIVE
        trigger: "POST /false-alarm-program/alarm-systems/{systemId}/approve-registration (permit is created directly in ACTIVE; PENDING_ISSUANCE is the pre-persist state)"
        actor: PermitClerk
        preconditions: ["See AlarmSystem SUBMITTED -> PERMITTED preconditions"]
        side_effects: ["Assigns permit_number in issuance order"]

      - from: ACTIVE
        to: RENEWAL_DUE
        trigger: "system — POST /false-alarm-program/_program-runs/nightly when logical clock >= term_end_at - 30 days"
        actor: system
        preconditions: ["AlarmPermit.status = ACTIVE"]
        side_effects: ["No money moves; the permit becomes renewable"]

      - from: RENEWAL_DUE
        to: RENEWAL_BLOCKED
        trigger: "system — cascade hop 3 of unpermitted_cascade during POST /false-alarm-program/_program-runs/nightly, fired because AlarmSite.renewal_block_active became true"
        actor: system
        preconditions: ["AlarmSite.outstanding_balance_cents >= FeeSchedule.delinquent_balance_block_cents"]
        side_effects: ["Renewal attempts are rejected with ERR_PERMIT_RENEWAL_BLOCKED until the balance clears"]

      - from: RENEWAL_BLOCKED
        to: RENEWAL_DUE
        trigger: "system — POST /false-alarm-program/_program-runs/nightly, or the recompute cascade of POST /false-alarm-program/payment-records"
        actor: system
        preconditions: ["AlarmSite.outstanding_balance_cents < FeeSchedule.delinquent_balance_block_cents"]
        side_effects: ["Clears the fiscal block"]

      - from: RENEWAL_DUE
        to: ACTIVE
        trigger: "POST /false-alarm-program/alarm-permits/{permitId}/renewals"
        actor: ProgramAdministrator | PermitClerk | AlarmUser
        preconditions:
          - "AlarmSite.ecv_callable_contact_count >= 2 (else ERR_INSUFFICIENT_ECV_CONTACTS)"
          - "AlarmSite.renewal_block_active = false (else ERR_SITE_BALANCE_DELINQUENT)"
          - "expected_alarm_permit_version matches AlarmPermit.version (else ERR_STALE_ALARM_PERMIT_VERSION)"
        side_effects:
          - "term_start_at = logical clock; term_end_at = term_start_at + permit_term_days; grace_through_at recomputed; renewal_count += 1; last_renewed_at set; new_installation_grace_through stays null on renewed terms"
          - "Issues PenaltyInvoice kind = PERMIT_RENEWAL_FEE using calculation permit_renewal_fee (days_late = 0 on an on-time renewal)"
          - "Resets AlarmSite.chargeable_count_permit_year to 0 for the permit-year counting variant"
          - "Increments AlarmPermit.version by 1"

      - from: GRACE
        to: ACTIVE
        trigger: "POST /false-alarm-program/alarm-permits/{permitId}/renewals"
        actor: ProgramAdministrator | PermitClerk | AlarmUser
        preconditions:
          - "Logical clock <= grace_through_at (else the nightly run has already moved the permit to EXPIRED)"
          - "AlarmSite.ecv_callable_contact_count >= 2 (else ERR_INSUFFICIENT_ECV_CONTACTS)"
          - "AlarmSite.renewal_block_active = false (else ERR_SITE_BALANCE_DELINQUENT)"
          - "expected_alarm_permit_version matches AlarmPermit.version (else ERR_STALE_ALARM_PERMIT_VERSION)"
        side_effects:
          - "Same term rollover as RENEWAL_DUE -> ACTIVE"
          - "Issues PenaltyInvoice kind = PERMIT_RENEWAL_FEE whose lines include the late tier selected by calculation permit_renewal_fee"
          - "Resets AlarmSite.chargeable_count_permit_year to 0"

      - from: RENEWAL_DUE
        to: GRACE
        trigger: "system — POST /false-alarm-program/_program-runs/nightly when logical clock > term_end_at"
        actor: system
        preconditions: ["AlarmPermit.status = RENEWAL_DUE"]
        side_effects: ["Permit is expired-but-curable; the system stays PERMITTED during GRACE"]

      - from: RENEWAL_BLOCKED
        to: GRACE
        trigger: "system — POST /false-alarm-program/_program-runs/nightly when logical clock > term_end_at"
        actor: system
        preconditions: ["AlarmPermit.status = RENEWAL_BLOCKED"]
        side_effects: ["Fiscal block persists inside GRACE; renewal still rejected with ERR_SITE_BALANCE_DELINQUENT"]

      - from: GRACE
        to: EXPIRED
        trigger: "system — POST /false-alarm-program/_program-runs/nightly when logical clock > grace_through_at (cascade hop 1 of unpermitted_cascade)"
        actor: system
        preconditions: ["AlarmPermit.status = GRACE"]
        side_effects:
          - "Because the permit expired, the AlarmSystem transitions PERMITTED -> UNPERMITTED (cascade hop 2)"
          - "Because the system became UNPERMITTED, AlarmSite.unpermitted_system_count increments and a PenaltyInvoice kind = UNPERMITTED_OPERATION_PENALTY is issued (cascade hop 2)"
          - "Because that invoice pushed AlarmSite.outstanding_balance_cents to or above delinquent_balance_block_cents, AlarmSite.renewal_block_active flips to true and every other AlarmPermit at the same site with status = RENEWAL_DUE transitions to RENEWAL_BLOCKED (cascade hop 3)"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /false-alarm-program/alarm-permits/{permitId}/revoke"
        actor: ProgramAdministrator
        preconditions: ["AlarmPermit.status IN {ACTIVE, RENEWAL_DUE, RENEWAL_BLOCKED, GRACE}"]
        side_effects:
          - "Stores revocation_reason; the AlarmSystem transitions PERMITTED -> UNPERMITTED with the same downstream chain as expiry"

      - from: GRACE
        to: REVOKED
        trigger: "POST /false-alarm-program/alarm-permits/{permitId}/revoke"
        actor: ProgramAdministrator
        preconditions: ["AlarmPermit.status = GRACE"]
        side_effects: ["Same as ACTIVE -> REVOKED"]

  - entity: DispatchRequest
    initial_state: SUBMITTED
    terminal_states: [REFUSED, CLOSED_VALID, CANCELLED]
    note: "Branching: SUBMITTED forks to VALIDATED or REFUSED; VALIDATED forks to DISPATCHED or CANCELLED; DISPATCHED forks to CLOSED_VALID or spawns a FalseAlarmIncident."
    transitions:
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /false-alarm-program/dispatch-requests/{requestId}/validate"
        actor: PoliceDispatchSupervisor
        preconditions:
          - "DispatchRequest.status = SUBMITTED"
          - "DispatchRequest.ecv_sufficient = true"
          - "AlarmSite.response_status != RESPONSE_SUSPENDED (else ERR_POLICE_RESPONSE_SUSPENDED)"
          - "AlarmCompany.status IN {ACTIVE, PROBATION} (else ERR_COMPANY_DISPATCH_PRIVILEGE_SUSPENDED)"
          - "Verified-response proof present: audio_video_evidence = true when AlarmSystem.verified_response_mode = AUDIO_VIDEO_REQUIRED, guard_on_scene = true when GUARD_REQUIRED (else ERR_VERIFIED_RESPONSE_NOT_CONFIRMED)"
        side_effects: ["Sets validated_at = logical clock"]

      - from: SUBMITTED
        to: REFUSED
        trigger: "POST /false-alarm-program/dispatch-requests/{requestId}/refuse"
        actor: PoliceDispatchSupervisor
        preconditions: ["DispatchRequest.status = SUBMITTED"]
        side_effects: ["Stores refusal_reason; no FalseAlarmIncident may ever reference this request"]

      - from: VALIDATED
        to: DISPATCHED
        trigger: "POST /false-alarm-program/dispatch-requests/{requestId}/record-dispatch"
        actor: PoliceDispatchSupervisor
        preconditions:
          - "DispatchRequest.status = VALIDATED"
          - "AlarmSite.response_status != RESPONSE_SUSPENDED at the moment of dispatch (else ERR_POLICE_RESPONSE_SUSPENDED)"
        side_effects: ["Sets dispatched_at = logical clock"]

      - from: VALIDATED
        to: CANCELLED
        trigger: "POST /false-alarm-program/dispatch-requests/{requestId}/cancel"
        actor: AlarmCompanyOperator
        preconditions:
          - "DispatchRequest.status = VALIDATED"
          - "Acting AlarmCompanyOperator's X-User-ID equals DispatchRequest.monitoring_company_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["Cancellation excludes the request from ComplianceReport.system_dispatch_count"]

      - from: DISPATCHED
        to: CLOSED_VALID
        trigger: "POST /false-alarm-program/dispatch-requests/{requestId}/close-valid"
        actor: PoliceDispatchSupervisor
        preconditions: ["DispatchRequest.status = DISPATCHED", "No FalseAlarmIncident references this request (else ERR_INCIDENT_ALREADY_REPORTED)"]
        side_effects: ["Records a verified alarm; no fee, no counting"]

      - from: DISPATCHED
        to: DISPATCHED
        trigger: "POST /false-alarm-program/false-alarm-incidents (self-loop: the request stays DISPATCHED while its incident is created)"
        actor: PoliceDispatchSupervisor
        preconditions:
          - "DispatchRequest.status = DISPATCHED"
          - "No FalseAlarmIncident already references this request (else ERR_INCIDENT_ALREADY_REPORTED)"
          - "expected_dispatch_request_version matches DispatchRequest.version"
        side_effects:
          - "Creates FalseAlarmIncident with status = REPORTED, occurred_at copied from the request, alarm_site_id and alarm_system_id denormalized"
          - "Increments DispatchRequest.version by 1"

  - entity: FalseAlarmIncident
    initial_state: REPORTED
    terminal_states: [EXEMPT, EXEMPT_BY_APPEAL, VOIDED]
    note: "Cyclic: COUNTED -> APPEALED -> COUNTED when an appeal is denied, and COUNTED -> APPEALED -> UNDER_REVIEW -> COUNTED when an appeal is remanded, so the same row can be re-determined an unbounded number of times."
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /false-alarm-program/false-alarm-incidents/{incidentId}/determination (the row passes through UNDER_REVIEW inside the same request before the ruling is applied)"
        actor: FalseAlarmReviewOfficer
        preconditions: ["FalseAlarmIncident.status = REPORTED"]
        side_effects: ["Clears any prior determination fields"]

      - from: UNDER_REVIEW
        to: COUNTED
        trigger: "POST /false-alarm-program/false-alarm-incidents/{incidentId}/determination with determination = COUNTED"
        actor: FalseAlarmReviewOfficer
        preconditions:
          - "cause_code is NOT in FeeSchedule.exempt_cause_codes (else ERR_EXEMPT_CAUSE_MUST_BE_EXEMPT)"
          - "occurred_at > the site's AlarmPermit.new_installation_grace_through when that field is set (else ERR_EXEMPT_CAUSE_MUST_BE_EXEMPT)"
          - "AlarmSite.governing_fee_schedule_id is not null (else ERR_NO_ACTIVE_FEE_SCHEDULE)"
        side_effects:
          - "Sets determination = COUNTED, determined_at = logical clock, determined_by_user_id = X-User-ID"
          - "Assigns occurrence_index and counted_window_mode via calculation false_alarm_occurrence_index"
          - "Computes assessed_fee_cents and fee_basis via calculation escalating_false_alarm_fee"
          - "Issues PenaltyInvoice kind = FALSE_ALARM_FEE via calculation invoice_assembly when assessed_fee_cents > 0; no invoice is issued when the tier base is 0 under free_alarm_allowance"
          - "Recomputes AlarmSite.chargeable_count_rolling_365, chargeable_count_permit_year, chargeable_count_window, lifetime_assessed_cents, outstanding_balance_cents, renewal_block_active, response_status"
          - "When AlarmSite.chargeable_count_window >= FeeSchedule.suspension_threshold_count, auto-creates a SuspensionOrder with status = PROPOSED, basis = EXCESSIVE_FALSE_ALARMS, triggering_incident_id = this incident, effective_from = logical clock + 10 days, effective_through = effective_from + 30 days, and increments AlarmSite.version by 1"

      - from: UNDER_REVIEW
        to: EXEMPT
        trigger: "POST /false-alarm-program/false-alarm-incidents/{incidentId}/determination with determination = EXEMPT"
        actor: FalseAlarmReviewOfficer
        preconditions:
          - "exempt_cause_code is present and IN FeeSchedule.exempt_cause_codes, or equals NEW_INSTALLATION_GRACE with occurred_at <= AlarmPermit.new_installation_grace_through (else ERR_EXEMPT_CAUSE_NOT_RECOGNIZED)"
        side_effects:
          - "Sets determination = EXEMPT, exempt_cause_code, determined_at, determined_by_user_id; occurrence_index stays null; assessed_fee_cents stays 0; no invoice is issued; site counters are unchanged"

      - from: COUNTED
        to: APPEALED
        trigger: "POST /false-alarm-program/appeals"
        actor: AlarmUser
        preconditions:
          - "filed_at - determined_at <= FeeSchedule.appeal_filing_days whole days (else ERR_APPEAL_WINDOW_CLOSED)"
          - "No Appeal for this incident with status IN {FILED, SCHEDULED, HEARD} (else ERR_APPEAL_ALREADY_PENDING)"
          - "expected_false_alarm_incident_version matches FalseAlarmIncident.version (else ERR_STALE_FALSE_ALARM_INCIDENT_VERSION)"
        side_effects:
          - "Increments appeal_count and FalseAlarmIncident.version by 1"
          - "Freezes the fee: any PenaltyInvoice with this false_alarm_incident_id keeps collections_stage where it is and is excluded from dunning escalation while the incident is APPEALED"

      - from: APPEALED
        to: COUNTED
        trigger: "POST /false-alarm-program/appeals/{appealId}/decide with decision = DENIED (cycle back)"
        actor: HearingOfficer
        preconditions: ["Appeal.status = HEARD"]
        side_effects:
          - "determination, occurrence_index and assessed_fee_cents are left exactly as they were before the appeal"
          - "Dunning resumes: the incident's PenaltyInvoice re-enters the nightly escalation set"

      - from: APPEALED
        to: UNDER_REVIEW
        trigger: "POST /false-alarm-program/appeals/{appealId}/decide with decision = REMANDED (cycle back for re-determination)"
        actor: HearingOfficer
        preconditions: ["Appeal.status = HEARD"]
        side_effects:
          - "Clears determination, determined_at, determined_by_user_id, occurrence_index, assessed_fee_cents and counted_window_mode"
          - "Voids any PenaltyInvoice with this false_alarm_incident_id (payment_status -> VOIDED) and reverses its PaymentAllocation rows, returning reversed amounts to AlarmSite.credit_balance_cents"
          - "Recomputes the site counters and renumbers the remaining chargeable incidents (status IN {COUNTED, APPEALED}) contiguously"

      - from: APPEALED
        to: EXEMPT_BY_APPEAL
        trigger: "POST /false-alarm-program/appeals/{appealId}/decide with decision = GRANTED (cascade hop 1 of appeal_grant_cascade)"
        actor: HearingOfficer
        preconditions: ["Appeal.status = HEARD", "Appeal.decided_by_user_id != FalseAlarmIncident.determined_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects:
          - "Sets determination = EXEMPT, exempt_cause_code from the ruling, occurrence_index = null, assessed_fee_cents = 0"
          - "Because the incident left the chargeable set, AlarmSite.chargeable_count_* decrement and every later chargeable incident at the site (status IN {COUNTED, APPEALED}) is renumbered contiguously by (occurred_at ASC, created_at ASC) and its fee re-derived (cascade hop 2)"
          - "Because a renumbered incident's assessed fee changed, its PenaltyInvoice is re-assessed: assessed_cents recomputed, and any paid_cents above the new assessed_cents moves to AlarmSite.credit_balance_cents (cascade hop 3)"
          - "Because AlarmSite.chargeable_count_window fell below FeeSchedule.suspension_threshold_count, every SuspensionOrder for the site with status IN {PROPOSED, EFFECTIVE, REINSTATEMENT_PENDING} transitions to VACATED and AlarmSite.response_status is recomputed (cascade hop 4)"

      - from: UNDER_REVIEW
        to: VOIDED
        trigger: "POST /false-alarm-program/false-alarm-incidents/{incidentId}/void"
        actor: ProgramAdministrator
        preconditions: ["FalseAlarmIncident.status IN {REPORTED, UNDER_REVIEW}"]
        side_effects: ["Voids any invoice attached to the incident; site counters recomputed"]

  - entity: HearingDocket
    initial_state: OPEN
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: OPEN
        to: CLOSED_FOR_SCHEDULING
        trigger: "system — fired when scheduled_appeal_count reaches capacity during POST /false-alarm-program/appeals/{appealId}/schedule"
        actor: system
        preconditions: ["HearingDocket.scheduled_appeal_count = HearingDocket.capacity"]
        side_effects: ["Further scheduling attempts are rejected with ERR_DOCKET_NOT_OPEN"]

      - from: CLOSED_FOR_SCHEDULING
        to: OPEN
        trigger: "system — fired when a scheduled appeal is withdrawn via POST /false-alarm-program/appeals/{appealId}/withdraw, freeing a seat"
        actor: system
        preconditions: ["HearingDocket.scheduled_appeal_count < HearingDocket.capacity"]
        side_effects: ["Seat is released; scheduling reopens"]

      - from: OPEN
        to: HELD
        trigger: "POST /false-alarm-program/hearing-dockets/{docketId}/hold-session"
        actor: HearingOfficer
        preconditions:
          - "Logical clock >= HearingDocket.session_start (else ERR_HEARING_SESSION_NOT_STARTED)"
          - "HearingDocket.scheduled_appeal_count >= 1 (else ERR_DOCKET_EMPTY)"
          - "Acting HearingOfficer's X-User-ID equals HearingDocket.hearing_officer_user_id (else ERR_NOT_DOCKET_OFFICER)"
        side_effects:
          - "Sets held_at = logical clock"
          - "Every Appeal with this hearing_docket_id and status = SCHEDULED transitions to HEARD"

      - from: CLOSED_FOR_SCHEDULING
        to: HELD
        trigger: "POST /false-alarm-program/hearing-dockets/{docketId}/hold-session"
        actor: HearingOfficer
        preconditions: ["Same as OPEN -> HELD"]
        side_effects: ["Same as OPEN -> HELD"]

      - from: OPEN
        to: CANCELLED
        trigger: "POST /false-alarm-program/hearing-dockets/{docketId}/cancel"
        actor: HearingOfficer
        preconditions: ["HearingDocket.status IN {OPEN, CLOSED_FOR_SCHEDULING}"]
        side_effects:
          - "Every Appeal with this hearing_docket_id and status = SCHEDULED reverts to FILED with hearing_docket_id cleared (cascade down)"
          - "scheduled_appeal_count is recomputed to 0; the session interval is released for overlap purposes"

      - from: CLOSED_FOR_SCHEDULING
        to: CANCELLED
        trigger: "POST /false-alarm-program/hearing-dockets/{docketId}/cancel"
        actor: HearingOfficer
        preconditions: ["HearingDocket.status = CLOSED_FOR_SCHEDULING"]
        side_effects: ["Same as OPEN -> CANCELLED"]

  - entity: Appeal
    initial_state: FILED
    terminal_states: [GRANTED, DENIED, REMANDED, WITHDRAWN, DISMISSED_UNTIMELY]
    note: "REMANDED is non-terminal for the incident but terminal for the appeal row; a rehearing is a NEW Appeal row linked through prior_appeal_id, giving a self-referential chain bounded at rehearing_depth <= 2."
    transitions:
      - from: FILED
        to: SCHEDULED
        trigger: "POST /false-alarm-program/appeals/{appealId}/schedule"
        actor: HearingOfficer
        preconditions:
          - "Appeal.status = FILED"
          - "HearingDocket.status = OPEN (else ERR_DOCKET_NOT_OPEN)"
          - "HearingDocket.scheduled_appeal_count < HearingDocket.capacity (else ERR_DOCKET_CAPACITY_EXCEEDED)"
          - "Logical clock < HearingDocket.session_start (else ERR_HEARING_SESSION_IN_PAST)"
          - "expected_hearing_docket_version matches HearingDocket.version (else ERR_STALE_HEARING_DOCKET_VERSION)"
        side_effects:
          - "Sets hearing_docket_id; increments HearingDocket.scheduled_appeal_count and HearingDocket.version by 1"
          - "When scheduled_appeal_count reaches capacity, the docket transitions OPEN -> CLOSED_FOR_SCHEDULING"

      - from: SCHEDULED
        to: FILED
        trigger: "system — POST /false-alarm-program/hearing-dockets/{docketId}/cancel (cycle back to the unscheduled pool)"
        actor: system
        preconditions: ["Appeal.status = SCHEDULED"]
        side_effects: ["Clears hearing_docket_id; the appeal awaits a new session"]

      - from: SCHEDULED
        to: HEARD
        trigger: "system — POST /false-alarm-program/hearing-dockets/{docketId}/hold-session"
        actor: system
        preconditions: ["Appeal.status = SCHEDULED", "HearingDocket transitioned to HELD"]
        side_effects: ["The appeal becomes decidable"]

      - from: HEARD
        to: GRANTED
        trigger: "POST /false-alarm-program/appeals/{appealId}/decide with decision = GRANTED"
        actor: HearingOfficer
        preconditions:
          - "Appeal.status = HEARD"
          - "X-User-ID != FalseAlarmIncident.determined_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "exempt_cause_code is present and IN FeeSchedule.exempt_cause_codes (else ERR_EXEMPT_CAUSE_NOT_RECOGNIZED)"
        side_effects:
          - "Sets decision = GRANTED, decided_at, decided_by_user_id, findings"
          - "Drives appeal_grant_cascade: the incident goes APPEALED -> EXEMPT_BY_APPEAL (hop 1); that exemption renumbers and re-prices the site's remaining chargeable incidents (hop 2); those re-priced incidents' PenaltyInvoice rows are re-assessed with any overpayment moved to AlarmSite.credit_balance_cents (hop 3); the resulting drop below suspension_threshold_count vacates the site's SuspensionOrder rows and recomputes AlarmSite.response_status (hop 4)"

      - from: HEARD
        to: DENIED
        trigger: "POST /false-alarm-program/appeals/{appealId}/decide with decision = DENIED"
        actor: HearingOfficer
        preconditions: ["Appeal.status = HEARD", "X-User-ID != FalseAlarmIncident.determined_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects:
          - "Sets decision = DENIED; the incident returns APPEALED -> COUNTED with its original occurrence_index and assessed_fee_cents intact"
          - "Makes the incident eligible for exactly one rehearing: a later Appeal may set prior_appeal_id = this appeal"

      - from: HEARD
        to: REMANDED
        trigger: "POST /false-alarm-program/appeals/{appealId}/decide with decision = REMANDED"
        actor: HearingOfficer
        preconditions: ["Appeal.status = HEARD", "X-User-ID != FalseAlarmIncident.determined_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects:
          - "Sets decision = REMANDED; the incident returns APPEALED -> UNDER_REVIEW with determination fields cleared and its invoice voided"
          - "A different FalseAlarmReviewOfficer may now re-determine the incident, re-entering the counting cycle"

      - from: FILED
        to: WITHDRAWN
        trigger: "POST /false-alarm-program/appeals/{appealId}/withdraw"
        actor: AlarmUser
        preconditions: ["Appeal.status IN {FILED, SCHEDULED}", "X-User-ID equals Appeal.alarm_site_id (else ERR_NOT_RESOURCE_OWNER)"]
        side_effects: ["The incident returns APPEALED -> COUNTED; dunning resumes on its invoice"]

      - from: SCHEDULED
        to: WITHDRAWN
        trigger: "POST /false-alarm-program/appeals/{appealId}/withdraw"
        actor: AlarmUser
        preconditions: ["Appeal.status = SCHEDULED", "X-User-ID equals Appeal.alarm_site_id (else ERR_NOT_RESOURCE_OWNER)"]
        side_effects:
          - "The incident returns APPEALED -> COUNTED"
          - "Decrements HearingDocket.scheduled_appeal_count; a CLOSED_FOR_SCHEDULING docket reopens to OPEN"

      - from: FILED
        to: DISMISSED_UNTIMELY
        trigger: "system — POST /false-alarm-program/_program-runs/nightly when logical clock > filed_at + 60 days and the appeal was never scheduled"
        actor: system
        preconditions: ["Appeal.status = FILED"]
        side_effects: ["The incident returns APPEALED -> COUNTED; dunning resumes on its invoice"]

  - entity: SuspensionOrder
    initial_state: PROPOSED
    terminal_states: [LIFTED, VACATED, EXPIRED]
    note: "Branching with divergent side-effect sets: EFFECTIVE forks to REINSTATEMENT_PENDING -> LIFTED (money + probation), to VACATED (appeal-driven, no money), or to EXPIRED (clock-driven)."
    transitions:
      - from: PROPOSED
        to: EFFECTIVE
        trigger: "POST /false-alarm-program/suspension-orders/{orderId}/serve"
        actor: ProgramAdministrator | PermitClerk
        preconditions:
          - "SuspensionOrder.status = PROPOSED"
          - "AlarmSite.chargeable_count_window >= FeeSchedule.suspension_threshold_count at serve time (else ERR_SUSPENSION_BASIS_NO_LONGER_MET)"
          - "Logical clock <= effective_from (else ERR_SUSPENSION_EFFECTIVE_DATE_INVALID)"
        side_effects:
          - "Sets served_at; computes reinstatement_fee_cents, probation_days and required_conditions via calculation reinstatement_requirement_set"
          - "Issues PenaltyInvoice kind = REINSTATEMENT_FEE against the site with suspension_order_id set"
          - "Recomputes AlarmSite.response_status to RESPONSE_SUSPENDED and AlarmSite.outstanding_balance_cents / renewal_block_active"
          - "Increments AlarmSite.version by 1"

      - from: EFFECTIVE
        to: REINSTATEMENT_PENDING
        trigger: "POST /false-alarm-program/suspension-orders/{orderId}/reinstatement-requests"
        actor: AlarmUser
        preconditions:
          - "SuspensionOrder.status = EFFECTIVE"
          - "technician_inspection_date within 30 whole days before the logical clock (else ERR_INSPECTION_EVIDENCE_STALE)"
          - "ecv_attestation = true (else ERR_ECV_ATTESTATION_REQUIRED)"
          - "AlarmSite.ecv_callable_contact_count >= required_conditions.min_ecv_contacts (else ERR_INSUFFICIENT_ECV_CONTACTS)"
        side_effects: ["Stores reinstatement_requested_at, technician_inspection_date, ecv_attestation; police response remains suspended"]

      - from: REINSTATEMENT_PENDING
        to: LIFTED
        trigger: "POST /false-alarm-program/suspension-orders/{orderId}/lift"
        actor: ProgramAdministrator
        preconditions:
          - "SuspensionOrder.status = REINSTATEMENT_PENDING"
          - "Every PenaltyInvoice for the site with collections_stage != WRITTEN_OFF has payment_status = PAID (else ERR_OUTSTANDING_BALANCE_BLOCKS_REINSTATEMENT)"
        side_effects:
          - "Sets lifted_at; increments AlarmSite.lifted_suspension_count"
          - "Recomputes AlarmSite.response_status — RESPONSE_PROBATION for probation_days whole days from lifted_at, then RESPONSE_ACTIVE"
          - "Increments AlarmSite.version by 1"

      - from: EFFECTIVE
        to: VACATED
        trigger: "POST /false-alarm-program/suspension-orders/{orderId}/vacate, or system as cascade hop 4 of appeal_grant_cascade"
        actor: ProgramAdministrator | system
        preconditions: ["SuspensionOrder.status IN {PROPOSED, EFFECTIVE, REINSTATEMENT_PENDING}"]
        side_effects:
          - "Stores vacated_reason; voids any PenaltyInvoice with kind = REINSTATEMENT_FEE and this suspension_order_id, reversing its PaymentAllocation rows into AlarmSite.credit_balance_cents"
          - "Recomputes AlarmSite.response_status; lifted_suspension_count is NOT incremented (a vacated order never counted as a suspension)"

      - from: PROPOSED
        to: VACATED
        trigger: "POST /false-alarm-program/suspension-orders/{orderId}/vacate, or system as cascade hop 4 of appeal_grant_cascade"
        actor: ProgramAdministrator | system
        preconditions: ["SuspensionOrder.status = PROPOSED"]
        side_effects: ["Stores vacated_reason; no invoice exists yet, so no money moves; AlarmSite.response_status recomputed"]

      - from: EFFECTIVE
        to: EXPIRED
        trigger: "system — POST /false-alarm-program/_program-runs/nightly when logical clock > effective_through"
        actor: system
        preconditions: ["SuspensionOrder.status = EFFECTIVE"]
        side_effects:
          - "Police response resumes without a reinstatement: AlarmSite.response_status recomputed from the counting variant alone"
          - "lifted_suspension_count is NOT incremented; the REINSTATEMENT_FEE invoice stays payable"

  - entity: PenaltyInvoice
    state_field: payment_status
    initial_state: UNPAID
    terminal_states: [PAID, VOIDED]
    note: "Money dimension. Advances independently of collections_stage: an invoice can be REFERRED and still reach PAID, and can be PAID while sitting at FINAL_NOTICE until the nightly run resettles the stage."
    transitions:
      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "POST /false-alarm-program/payment-records (allocation smaller than outstanding_cents)"
        actor: BillingClerk | ProgramAdministrator
        preconditions: ["PenaltyInvoice.payment_status = UNPAID", "PaymentAllocation.amount_cents < outstanding_cents"]
        side_effects: ["paid_cents increases; outstanding_cents decreases; AlarmSite.outstanding_balance_cents and renewal_block_active recomputed"]

      - from: UNPAID
        to: PAID
        trigger: "POST /false-alarm-program/payment-records (allocation equal to outstanding_cents), or POST /false-alarm-program/penalty-invoices/{invoiceId}/adjustments with adjustment_kind = WAIVE"
        actor: BillingClerk | ProgramAdministrator
        preconditions: ["paid_cents + adjusted_cents = assessed_cents after the write"]
        side_effects:
          - "outstanding_cents becomes 0; collections_stage resettles to CURRENT on the next nightly run"
          - "When every invoice for the site is PAID, a REINSTATEMENT_PENDING SuspensionOrder becomes liftable"

      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /false-alarm-program/payment-records covering the remaining outstanding_cents"
        actor: BillingClerk | ProgramAdministrator
        preconditions: ["paid_cents + adjusted_cents = assessed_cents after the write"]
        side_effects: ["Same as UNPAID -> PAID"]

      - from: PARTIALLY_PAID
        to: UNPAID
        trigger: "POST /false-alarm-program/payment-records/{paymentId}/void (compensating action)"
        actor: ProgramAdministrator
        preconditions: ["The voided PaymentRecord's allocations are the only payments against this invoice"]
        side_effects:
          - "Reverses every PaymentAllocation of the payment (status -> REVERSED), restores paid_cents and outstanding_cents to their pre-payment values"
          - "Returns PaymentRecord.credited_cents from AlarmSite.credit_balance_cents so money_conservation_invariant holds"

      - from: PAID
        to: PARTIALLY_PAID
        trigger: "POST /false-alarm-program/payment-records/{paymentId}/void (compensating action reversing part of the settlement)"
        actor: ProgramAdministrator
        preconditions: ["PenaltyInvoice.collections_stage != WRITTEN_OFF (else ERR_INVOICE_WRITTEN_OFF)", "Other APPLIED allocations remain on the invoice"]
        side_effects: ["Same reversal as PARTIALLY_PAID -> UNPAID; collections_stage is left where it stands until the nightly run"]

      - from: UNPAID
        to: VOIDED
        trigger: "system — invoice-voiding cascades: FalseAlarmIncident APPEALED -> UNDER_REVIEW (remand), FalseAlarmIncident -> VOIDED, or SuspensionOrder -> VACATED"
        actor: system
        preconditions: ["PenaltyInvoice.payment_status IN {UNPAID, PARTIALLY_PAID}"]
        side_effects: ["assessed_cents is preserved for audit; outstanding_cents becomes 0; the invoice leaves every site rollup and dunning set"]

      - from: PARTIALLY_PAID
        to: VOIDED
        trigger: "system — same invoice-voiding cascades"
        actor: system
        preconditions: ["PenaltyInvoice.payment_status = PARTIALLY_PAID"]
        side_effects: ["Reverses every APPLIED PaymentAllocation into AlarmSite.credit_balance_cents, preserving money_conservation_invariant"]

  - entity: PenaltyInvoice
    state_field: collections_stage
    initial_state: CURRENT
    terminal_states: [WRITTEN_OFF]
    note: "Dunning dimension on the same row, advanced only by the nightly run and by the referral/adjustment endpoints. Independent of payment_status."
    transitions:
      - from: CURRENT
        to: NOTICE
        trigger: "system — POST /false-alarm-program/_program-runs/nightly when days_delinquent >= 1"
        actor: system
        preconditions: ["outstanding_cents > 0", "The linked FalseAlarmIncident (when any) is NOT in status APPEALED"]
        side_effects: ["Adds late_penalty_cents once via calculation delinquency_escalation and recomputes assessed_cents and AlarmSite.outstanding_balance_cents"]

      - from: NOTICE
        to: FINAL_NOTICE
        trigger: "system — POST /false-alarm-program/_program-runs/nightly when days_delinquent >= 30"
        actor: system
        preconditions: ["outstanding_cents > 0", "The linked FalseAlarmIncident (when any) is NOT in status APPEALED"]
        side_effects: ["No additional late penalty; the invoice becomes referral-eligible once days_delinquent >= FeeSchedule.delinquency_days"]

      - from: FINAL_NOTICE
        to: REFERRED
        trigger: "POST /false-alarm-program/penalty-invoices/{invoiceId}/collections-referral"
        actor: BillingClerk
        preconditions:
          - "PenaltyInvoice.collections_stage = FINAL_NOTICE"
          - "days_delinquent >= FeeSchedule.delinquency_days AND outstanding_cents >= FeeSchedule.collections_referral_threshold_cents (else ERR_REFERRAL_CRITERIA_NOT_MET)"
          - "The linked FalseAlarmIncident (when any) is NOT in status APPEALED (else ERR_INVOICE_UNDER_APPEAL)"
        side_effects:
          - "Computes referral_total_cents via calculation delinquency_escalation, stores referral_agency and referred_on"
          - "The invoice moves to the head of the AUTO_WATERFALL allocation order"

      - from: REFERRED
        to: WRITTEN_OFF
        trigger: "POST /false-alarm-program/penalty-invoices/{invoiceId}/adjustments with adjustment_kind = WRITE_OFF"
        actor: ProgramAdministrator
        preconditions: ["PenaltyInvoice.collections_stage = REFERRED", "expected_penalty_invoice_version matches PenaltyInvoice.version"]
        side_effects:
          - "adjusted_cents += outstanding_cents; outstanding_cents becomes 0; payment_status becomes PAID only when paid_cents + adjusted_cents = assessed_cents"
          - "Removes the invoice from AlarmSite.outstanding_balance_cents and from every waterfall candidate set; increments PenaltyInvoice.version by 1"

      - from: NOTICE
        to: CURRENT
        trigger: "system — POST /false-alarm-program/_program-runs/nightly resettlement when outstanding_cents becomes 0"
        actor: system
        preconditions: ["outstanding_cents = 0", "collections_stage IN {NOTICE, FINAL_NOTICE}"]
        side_effects: ["Dunning stops; late_penalty_cents already assessed is NOT refunded"]

      - from: FINAL_NOTICE
        to: CURRENT
        trigger: "system — POST /false-alarm-program/_program-runs/nightly resettlement when outstanding_cents becomes 0"
        actor: system
        preconditions: ["outstanding_cents = 0"]
        side_effects: ["Same as NOTICE -> CURRENT"]

  - entity: AlarmCompany
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    note: "Cyclic: ACTIVE -> PROBATION -> ACTIVE as the reporting score crosses thresholds in either direction."
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "system — POST /false-alarm-program/compliance-reports/{reportId}/review, when reporting_compliance_score < FeeSchedule.company_probation_score_threshold and >= company_suspension_score_threshold"
        actor: system
        preconditions: ["AlarmCompany.status = ACTIVE"]
        side_effects: ["Sets probation_started_at, status_reason, last_status_action_at; dispatch requests are still accepted"]

      - from: PROBATION
        to: ACTIVE
        trigger: "system — POST /false-alarm-program/compliance-reports/{reportId}/review, when the recomputed score >= company_probation_score_threshold"
        actor: system
        preconditions: ["AlarmCompany.status = PROBATION"]
        side_effects: ["Clears probation_started_at; consecutive_flagged_report_count resets to 0"]

      - from: PROBATION
        to: SUSPENDED
        trigger: "system — POST /false-alarm-program/compliance-reports/{reportId}/review, when the recomputed score < FeeSchedule.company_suspension_score_threshold or consecutive_flagged_report_count >= 3"
        actor: system
        preconditions: ["AlarmCompany.status = PROBATION"]
        side_effects:
          - "Every subsequent POST /false-alarm-program/dispatch-requests for this company's systems is rejected with ERR_COMPANY_DISPATCH_PRIVILEGE_SUSPENDED"
          - "Already-VALIDATED requests may still be dispatched; SUBMITTED ones may only be refused"

      - from: SUSPENDED
        to: PROBATION
        trigger: "POST /false-alarm-program/alarm-companies/{companyId}/status-actions with action = REINSTATE"
        actor: ProgramAdministrator
        preconditions: ["AlarmCompany.status = SUSPENDED", "At least one ComplianceReport with status = ACCEPTED whose period_end > probation_started_at (else ERR_COMPANY_REINSTATEMENT_NOT_EARNED)"]
        side_effects: ["Sets last_status_action_at and status_reason; dispatch privilege returns under probation"]

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /false-alarm-program/alarm-companies/{companyId}/status-actions with action = SUSPEND, or system during POST /false-alarm-program/compliance-reports/{reportId}/review when the recomputed score < FeeSchedule.company_suspension_score_threshold (a score that low skips PROBATION entirely)"
        actor: ProgramAdministrator | system
        preconditions: ["AlarmCompany.status IN {ACTIVE, PROBATION}"]
        side_effects:
          - "Sets status_reason and last_status_action_at; probation_started_at is set to the logical clock when the company skipped PROBATION, so reinstatement eligibility has an anchor"
          - "Same dispatch-privilege consequences as the automatic suspension from PROBATION"

      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /false-alarm-program/alarm-companies/{companyId}/status-actions with action = REVOKE"
        actor: ProgramAdministrator
        preconditions: ["AlarmCompany.status = SUSPENDED"]
        side_effects:
          - "Every AlarmSystem monitored by this company with status = PERMITTED keeps its permit but its DispatchRequest submissions are permanently rejected"
          - "license_number is released for reuse by another company"

  - entity: ComplianceReport
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED]
    note: "Cyclic: SUBMITTED -> VARIANCE_FLAGGED -> CORRECTED -> SUBMITTED, bounded by correction_count <= 2."
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /false-alarm-program/compliance-reports/{reportId}/review with decision = ACCEPT"
        actor: ProgramAdministrator
        preconditions: ["ComplianceReport.status = SUBMITTED"]
        side_effects:
          - "Sets reviewed_at, reviewed_by_user_id; period_score is admitted into the company score set"
          - "Recomputes AlarmCompany.reporting_compliance_score via calculation company_reporting_compliance_score under the company's score_mode, then applies the AlarmCompany threshold transitions"

      - from: SUBMITTED
        to: VARIANCE_FLAGGED
        trigger: "POST /false-alarm-program/compliance-reports/{reportId}/review with decision = FLAG_VARIANCE"
        actor: ProgramAdministrator
        preconditions: ["ComplianceReport.status = SUBMITTED", "variance_pct > 0.1000 (else ERR_NO_REPORTABLE_VARIANCE)"]
        side_effects:
          - "Stores variance_notes; increments AlarmCompany.consecutive_flagged_report_count"
          - "Recomputes AlarmCompany.reporting_compliance_score (a flagged period still enters the score set) and applies the AlarmCompany threshold transitions"

      - from: VARIANCE_FLAGGED
        to: CORRECTED
        trigger: "POST /false-alarm-program/compliance-reports/{reportId}/correct"
        actor: AlarmCompanyOperator
        preconditions:
          - "ComplianceReport.status = VARIANCE_FLAGGED"
          - "correction_count < 2 (else ERR_CORRECTION_LIMIT_REACHED)"
          - "Acting company's X-User-ID equals monitoring_company_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["Overwrites the reported counts, increments correction_count, recomputes variance_count, variance_pct, period_accuracy, period_ecv_rate, period_score"]

      - from: CORRECTED
        to: SUBMITTED
        trigger: "system — a corrected report re-enters review inside the same POST /false-alarm-program/compliance-reports/{reportId}/correct request (cycle)"
        actor: system
        preconditions: ["ComplianceReport.status = CORRECTED"]
        side_effects: ["Clears reviewed_at, reviewed_by_user_id and variance_notes so the reviewer must rule again"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent entity's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: suspension-order-create-stale-site
    parent_entity: AlarmSite
    write_endpoint: "POST /false-alarm-program/suspension-orders"
    occ_field: "expected_alarm_site_version"
    description: |
      Opening a SuspensionOrder against an AlarmSite whose version has advanced
      since the client last read it is rejected. The ordinance lets a review
      officer open an additional enforcement order for a premises whose interval
      does not collide with an existing one, so the request is legitimate on its
      face; it is refused only because the officer's view of the premises —
      chargeable_count_window, response_status, existing orders — is stale, and
      an order written from a stale count would encode the wrong basis.
    error_id: ERR_STALE_ALARM_SITE_VERSION
    http_status: 412

  - rule_id: payment-record-create-stale-site
    parent_entity: AlarmSite
    write_endpoint: "POST /false-alarm-program/payment-records"
    occ_field: "expected_alarm_site_version"
    description: |
      Recording a PaymentRecord against an AlarmSite whose version has advanced
      since the client last read it is rejected. Additional tenders against the
      same premises account are legitimate under the product (partial payments
      accumulate), so the loser cannot be caught by any state precondition; it is
      refused because an AUTO_WATERFALL allocation derived from a stale invoice
      set would credit invoices that another writer has already settled, voided
      or written off.
    error_id: ERR_STALE_ALARM_SITE_VERSION
    http_status: 412

  - rule_id: invoice-adjustment-stale-invoice
    parent_entity: PenaltyInvoice
    write_endpoint: "POST /false-alarm-program/penalty-invoices/{invoiceId}/adjustments"
    occ_field: "expected_penalty_invoice_version"
    description: |
      Posting an adjustment against a PenaltyInvoice whose version has advanced
      since the client last read it is rejected. Adjustments legitimately
      accumulate (a REDUCE may follow a REDUCE, and a WRITE_OFF may follow
      either), so a second adjustment observes an invoice that is still
      adjustable and would succeed under normal product semantics; it is refused
      because the amount was sized against an outstanding balance that another
      writer has already reduced.
    error_id: ERR_STALE_PENALTY_INVOICE_VERSION
    http_status: 412

  - rule_id: alarm-system-reconfiguration-stale-system
    parent_entity: AlarmSystem
    write_endpoint: "PATCH /false-alarm-program/alarm-systems/{systemId}"
    occ_field: "expected_alarm_system_version"
    description: |
      Reconfiguring an AlarmSystem (monitoring company, ECV flag, zone count,
      verified-response mode) when the system's version has advanced since the
      client last read it is rejected. A second reconfiguration is legitimate on
      its face — the row is still PERMITTED and every field remains editable — so
      no state precondition can catch it; it is refused because the submitted
      field set would silently overwrite a change another writer already applied,
      for example re-enabling ECV that was just switched off.
    error_id: ERR_STALE_ALARM_SYSTEM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: false_alarm_occurrence_index
    trigger: "FalseAlarmIncident UNDER_REVIEW -> COUNTED, and every renumbering hop of appeal_grant_cascade / remand / void"
    algorithm: chronological
    formula: |
      sched = FeeSchedule row referenced by AlarmSite.governing_fee_schedule_id
      mode  = sched.counting_window_mode                     # ROLLING_365 | PERMIT_YEAR

      # --- variant ROLLING_365: window is anchored on the incident itself ---
      included_rolling(i) = { j : j.alarm_site_id == i.alarm_site_id
                                AND j.status IN {COUNTED, APPEALED}
                                AND j.occurred_at >= i.occurred_at - 365 days     # INCLUSIVE lower bound
                                AND j.occurred_at <= i.occurred_at }             # INCLUSIVE upper bound

      # --- variant PERMIT_YEAR: window is anchored on the governing permit term ---
      term_start(i) = term_start_at of the AlarmPermit whose alarm_site_id == i.alarm_site_id and whose
                      [term_start_at, grace_through_at] closed interval contains i.occurred_at; when more than
                      one permit at the site matches, take the greatest term_start_at, tie-break created_at ASC
      included_permit_year(i) = { j : j.alarm_site_id == i.alarm_site_id
                                AND j.status IN {COUNTED, APPEALED}
                                AND j.occurred_at >= term_start(i)               # INCLUSIVE
                                AND j.occurred_at <= i.occurred_at }             # INCLUSIVE

      occurrence_index(i)  = | included_<mode>(i) |     # i is already COUNTED here, so i belongs to the set
      counted_window_mode  = mode

      # renumbering after an exemption/remand/void removes an incident from the set
      renumber(site) = for each remaining chargeable incident at the site (status IN {COUNTED, APPEALED}), ordered by
                       (occurred_at ASC, created_at ASC), assign occurrence_index = 1, 2, 3, ... contiguously

      # site counters, evaluated with t = logical clock instead of i.occurred_at
      chargeable_count_rolling_365 = count(chargeable incidents with occurred_at >= t - 365 days AND <= t)
      chargeable_count_permit_year = count(chargeable incidents with occurred_at >= term_start(t) AND <= t)
      chargeable_count_window      = chargeable_count_rolling_365 when mode == ROLLING_365
                                     else chargeable_count_permit_year
    input_set: "FalseAlarmIncident rows for one alarm_site_id whose status is COUNTED or APPEALED — the chargeable set. Rows in REPORTED, UNDER_REVIEW, EXEMPT, EXEMPT_BY_APPEAL or VOIDED never enter either set. An APPEALED row stays in the chargeable set and keeps its index while its appeal is live (only dunning on its invoice is frozen); it leaves the set only when the appeal is GRANTED or the determination is remanded."
    constants:
      ROLLING_WINDOW_DAYS: 365
      ORDERING_KEY: "(occurred_at ASC, created_at ASC)"
    precision: "Integer counts; day arithmetic on whole UTC days, both window bounds inclusive"
    variants:
      - name: ROLLING_365
        when: "FeeSchedule.counting_window_mode = ROLLING_365"
        difference: "The window slides with each incident, so occurrences from the previous permit term still count; a permit renewal has no effect on the index."
      - name: PERMIT_YEAR
        when: "FeeSchedule.counting_window_mode = PERMIT_YEAR"
        difference: "The window restarts at every renewal, so the same four incidents that yield occurrence_index 4 (tier 25000) under ROLLING_365 yield occurrence_index 1 (tier 0 under free_alarm_allowance) when a renewal falls between them — identical data, different fee."

  - name: escalating_false_alarm_fee
    trigger: "FalseAlarmIncident UNDER_REVIEW -> COUNTED, and every re-pricing hop of appeal_grant_cascade"
    algorithm: tiered_pricing
    formula: |
      sched = FeeSchedule referenced by AlarmSite.governing_fee_schedule_id
      idx   = incident.occurrence_index
      disp  = DispatchRequest referenced by incident.dispatch_request_id

      # 1. marginal tier lookup (NOT cumulative)
      tier_base = base_fee_cents of the sched.fee_tiers entry where
                  from_index <= idx AND (to_index is null OR idx <= to_index)
      if idx <= sched.free_alarm_allowance: tier_base = 0

      # 2. multiplicative factors
      occ_mult          = sched.occupancy_multipliers[ site.occupancy_class ]
      surcharge_factor  = 1 + sched.non_ecv_surcharge_pct
                          when disp.verification_method IN {NONE, SINGLE_CALL} else 1
      unpermitted_factor= sched.unpermitted_multiplier
                          when disp.system_permitted_at_occurrence == false else 1

      # 3. ONE rounding, applied to the full product (never per factor)
      raw = round_half_up(tier_base * occ_mult * surcharge_factor * unpermitted_factor)

      # 4. cap, then aggravation OUTSIDE the cap
      cap_applied = raw > sched.per_incident_fee_cap_cents          # strict >; raw == cap is NOT capped
      capped      = min(raw, sched.per_incident_fee_cap_cents)
      aggravation = sched.suspension_period_aggravation_cents when a SuspensionOrder for the site with
                    status IN {EFFECTIVE, REINSTATEMENT_PENDING} satisfies
                    effective_from <= incident.occurred_at <= effective_through, else 0
      assessed_fee_cents = capped + aggravation

      fee_basis = { tier_base_cents: tier_base, occupancy_multiplier: occ_mult,
                    non_ecv_surcharge_applied: surcharge_factor != 1,
                    unpermitted_multiplier_applied: unpermitted_factor != 1,
                    cap_applied: cap_applied, aggravation_cents: aggravation }
    input_set: "One incident, its DispatchRequest (verification_method and system_permitted_at_occurrence are frozen on that row at submission time and are NOT re-read from the live AlarmSystem), the site's occupancy_class, and the site's SuspensionOrder rows in EFFECTIVE or REINSTATEMENT_PENDING."
    constants:
      DEFAULT_FEE_TIERS: "[{from_index:1,to_index:2,base_fee_cents:0},{from_index:3,to_index:3,base_fee_cents:10000},{from_index:4,to_index:4,base_fee_cents:25000},{from_index:5,to_index:5,base_fee_cents:40000},{from_index:6,to_index:null,base_fee_cents:75000}]"
      DEFAULT_OCCUPANCY_MULTIPLIERS: "{RESIDENTIAL:1.00, COMMERCIAL:1.50, SCHOOL:1.25, FINANCIAL:2.00, GOVERNMENT:1.00}"
      NON_ECV_SURCHARGE_PCT: 0.20
      UNPERMITTED_MULTIPLIER: 2.00
      PER_INCIDENT_FEE_CAP_CENTS: 100000
      SUSPENSION_PERIOD_AGGRAVATION_CENTS: 50000
    precision: "Whole cents, round_half_up, exactly one rounding step (step 3)"
    variants:
      - name: capped_assessment
        when: "raw > per_incident_fee_cap_cents"
        difference: "The multiplied amount is clipped to 100000 and fee_basis.cap_applied = true, but the suspension-period aggravation is added AFTER the clip, so assessed_fee_cents can legitimately exceed the cap."
      - name: uncapped_assessment
        when: "raw <= per_incident_fee_cap_cents"
        difference: "raw exactly equal to the cap passes through unchanged with cap_applied = false."

  - name: invoice_assembly
    trigger: "PenaltyInvoice issuance from any of: AlarmSystem SUBMITTED -> PERMITTED, AlarmPermit renewal, AlarmSystem PERMITTED -> UNPERMITTED, FalseAlarmIncident UNDER_REVIEW -> COUNTED, SuspensionOrder PROPOSED -> EFFECTIVE"
    algorithm: aggregation
    formula: |
      # ---- line construction per kind (order is the declared order below) ----
      FALSE_ALARM_FEE:
        L1 { code: FALSE_ALARM_BASE, unit_amount_cents: tier_base, quantity: 1,
             multiplier: occ_mult * surcharge_factor * unpermitted_factor }
             -- when fee_basis.cap_applied, L1.extended_cents is overridden to per_incident_fee_cap_cents
        L2 { code: SUSPENSION_PERIOD_AGGRAVATION, unit_amount_cents: aggravation, quantity: 1,
             multiplier: 1.00 }  -- present only when aggravation > 0
      PERMIT_ISSUE_FEE:   L1 { PERMIT_ISSUE,        permit_issue_fee_cents,   1, 1.00 }
      PERMIT_RENEWAL_FEE: L1 { PERMIT_RENEWAL,      permit_renewal_fee_cents, 1, 1.00 }
                          L2 { LATE_RENEWAL,        late_fee_cents,           1, 1.00 } -- only when late_fee_cents > 0
      UNPERMITTED_OPERATION_PENALTY:
                          L1 { UNPERMITTED_OPERATION, unpermitted_operation_penalty_cents, 1, 1.00 }
      REINSTATEMENT_FEE:  L1 { REINSTATEMENT, reinstatement_base_fee_cents, 1,
                               1 + reinstatement_escalation_pct * prior_lifted_suspension_count }

      # ---- PINNED ROUNDING ORDER: round each line, THEN sum. Never sum then round. ----
      for each line L in declared order:
          L.extended_cents = round_half_up(L.unit_amount_cents * L.quantity * L.multiplier)
      subtotal_cents  = sum(L.extended_cents)
      admin_fee_cents = min(max(round_half_up(subtotal_cents * admin_fee_pct),
                                admin_fee_min_cents), admin_fee_max_cents)
      late_penalty_cents = 0 at issuance
      assessed_cents  = subtotal_cents + admin_fee_cents + late_penalty_cents
      outstanding_cents = assessed_cents - paid_cents - adjusted_cents, floored at 0
      issued_on = logical clock ; due_on = issued_on + invoice_due_days whole days
      invoice_number = next sequential INV-###### in issuance order

      # A FALSE_ALARM_FEE invoice is NOT issued when subtotal_cents would be 0
      # (free_alarm_allowance tier with no aggravation): no invoice row, no admin fee.
    input_set: "Exactly one triggering entity per invoice; line multipliers come from the FeeSchedule pinned in AlarmSite.governing_fee_schedule_id, never from a newer ACTIVE schedule."
    constants:
      ADMIN_FEE_PCT: 0.05
      ADMIN_FEE_MIN_CENTS: 500
      ADMIN_FEE_MAX_CENTS: 5000
      INVOICE_DUE_DAYS: 30
    precision: "Whole cents, round_half_up, per-line rounding before summation; the administrative fee is rounded once on the already-rounded subtotal"
    variants:
      - name: round_per_line_then_sum
        when: "always — this is the pinned order"
        difference: "A two-line invoice of 12345.6 and 12345.6 cents yields 12346 + 12346 = 24692, whereas sum-then-round would yield 24691; the scaffold mandates 24692."
      - name: admin_fee_clamped
        when: "round_half_up(subtotal_cents * 0.05) falls outside [500, 5000]"
        difference: "The clamp binds before the fee joins assessed_cents, so a 200-cent subtotal still carries the 500-cent floor and a 200000-cent subtotal carries the 5000-cent ceiling."

  - name: delinquency_escalation
    trigger: "PenaltyInvoice collections_stage CURRENT -> NOTICE during POST /false-alarm-program/_program-runs/nightly (late penalty), and FINAL_NOTICE -> REFERRED via POST /false-alarm-program/penalty-invoices/{invoiceId}/collections-referral (referral total)"
    algorithm: threshold
    formula: |
      # EVALUATION ORDER IS PINNED 1..5. The collections admin fee tier is keyed on a
      # total that already contains the late penalty, and the late penalty is keyed on
      # the pre-penalty principal, so the order below is the only well-defined reading.
      1. outstanding_principal = assessed_cents - paid_cents - adjusted_cents      # must be > 0
      2. late_penalty_cents    = round_half_up(outstanding_principal * late_penalty_pct)
         assessed_cents       := assessed_cents + late_penalty_cents               # applied exactly once per invoice
      3. interim_total         = assessed_cents - paid_cents - adjusted_cents      # recomputed AFTER step 2
      4. collections_admin_fee = COLLECTIONS_ADMIN_FLAT_LOW_CENTS
                                     when interim_total <= COLLECTIONS_ADMIN_LOW_BOUND_CENTS
                                 round_half_up(interim_total * COLLECTIONS_ADMIN_MID_PCT)
                                     when COLLECTIONS_ADMIN_LOW_BOUND_CENTS < interim_total <= COLLECTIONS_ADMIN_HIGH_BOUND_CENTS
                                 COLLECTIONS_ADMIN_FLAT_HIGH_CENTS
                                     when interim_total > COLLECTIONS_ADMIN_HIGH_BOUND_CENTS
      5. referral_total_cents  = interim_total + collections_admin_fee

      days_delinquent = max(0, floor((logical clock - due_on) / 86400 seconds))
      # referral_total_cents is what the agency is handed; it does NOT feed
      # outstanding_cents, so AlarmSite.outstanding_balance_cents is unaffected by step 4.
    input_set: "One PenaltyInvoice with outstanding_cents > 0, collections_stage != WRITTEN_OFF, and whose linked FalseAlarmIncident (when any) is not in status APPEALED. Invoices in payment_status VOIDED never escalate."
    constants:
      LATE_PENALTY_PCT: 0.10
      COLLECTIONS_ADMIN_LOW_BOUND_CENTS: 25000
      COLLECTIONS_ADMIN_HIGH_BOUND_CENTS: 100000
      COLLECTIONS_ADMIN_FLAT_LOW_CENTS: 2000
      COLLECTIONS_ADMIN_MID_PCT: 0.08
      COLLECTIONS_ADMIN_FLAT_HIGH_CENTS: 10000
      DELINQUENCY_DAYS: 90
    precision: "Whole cents, round_half_up at steps 2 and 4 only"
    variants:
      - name: penalty_before_tier
        when: "always — pinned order"
        difference: "A 24000-cent principal becomes 24000 + 2400 = 26400 at step 3, which lands in the MID tier (0.08) for a 2112-cent admin fee and a 28512-cent referral total; evaluating the tier on the pre-penalty 24000 would have produced the 2000-cent LOW flat fee and 26400 total."
      - name: tier_boundary_exact
        when: "interim_total is exactly 25000 or exactly 100000"
        difference: "Both bounds are inclusive on the lower side of their comparison: 25000 takes the LOW flat 2000; 25001 takes 0.08; 100000 takes 0.08 (8000); 100001 takes the HIGH flat 10000."

  - name: company_reporting_compliance_score
    trigger: "ComplianceReport SUBMITTED -> ACCEPTED and SUBMITTED -> VARIANCE_FLAGGED during POST /false-alarm-program/compliance-reports/{reportId}/review"
    algorithm: weighted_scoring
    formula: |
      score_set(company) = ComplianceReport rows with monitoring_company_id = company.id and
                           status IN {ACCEPTED, VARIANCE_FLAGGED}, ordered by (period_start ASC, created_at ASC),
                           keeping the last 6 entries of that ordering
      per-report period_score is the value already stored on the row by
      calculation compliance_report_period_metrics

      VOLUME_WEIGHTED:
          W = sum(r.system_dispatch_count) over score_set
          score = mean(r.period_score) when W == 0
                  else sum(r.period_score * r.system_dispatch_count) / W
      PERIOD_EQUAL:
          score = sum(r.period_score) / count(score_set)

      reporting_compliance_score = round_half_up(score, 2)
      empty score_set -> 1.00
    input_set: "Only ACCEPTED and VARIANCE_FLAGGED reports enter the set; SUBMITTED and CORRECTED rows are excluded, so a report under correction temporarily leaves the score set and re-enters when re-reviewed."
    constants:
      SCORE_WINDOW_REPORTS: 6
      ACCURACY_WEIGHT: 0.6
      ECV_WEIGHT: 0.4
      COMPANY_PROBATION_SCORE_THRESHOLD: 0.70
      COMPANY_SUSPENSION_SCORE_THRESHOLD: 0.50
    precision: "2 decimal places, round_half_up; intermediate period metrics carry 4 decimal places"
    variants:
      - name: VOLUME_WEIGHTED
        when: "AlarmCompany.score_mode = VOLUME_WEIGHTED"
        difference: "One high-volume bad period dominates: period_scores 0.40 (system_dispatch_count 90) and 1.00 (count 10) give 0.46, which is below company_suspension_score_threshold."
      - name: PERIOD_EQUAL
        when: "AlarmCompany.score_mode = PERIOD_EQUAL"
        difference: "The same two periods give 0.70, which is exactly at company_probation_score_threshold and therefore leaves the company ACTIVE — identical reports, opposite regulatory outcome."

  - name: compliance_report_period_metrics
    trigger: "POST /false-alarm-program/compliance-reports (creation) and ComplianceReport VARIANCE_FLAGGED -> CORRECTED"
    algorithm: aggregation
    formula: |
      system_dispatch_count = count(DispatchRequest rows with monitoring_company_id = report.monitoring_company_id
                              AND occurred_at >= period_start AND occurred_at <= period_end     # closed interval
                              AND status != CANCELLED)
      variance_count   = abs(reported_dispatch_count - system_dispatch_count)
      variance_pct     = round_half_up(variance_count / max(1, system_dispatch_count), 4)
      period_accuracy  = round_half_up(1 - min(1, variance_pct), 4)
      period_ecv_rate  = round_half_up(min(1, ecv_attempt_count / max(1, reported_dispatch_count)), 4)
      period_score     = round_half_up(ACCURACY_WEIGHT * period_accuracy + ECV_WEIGHT * period_ecv_rate, 2)
    input_set: "DispatchRequest rows of one company inside one closed [period_start, period_end] interval, excluding status = CANCELLED; REFUSED requests DO count because the company still asked for dispatch."
    constants:
      ACCURACY_WEIGHT: 0.6
      ECV_WEIGHT: 0.4
      VARIANCE_FLAG_THRESHOLD_PCT: 0.1000
    precision: "variance_pct / period_accuracy / period_ecv_rate at 4 decimal places; period_score at 2, all round_half_up"

  - name: site_response_posture
    trigger: "End of every request that changes a SuspensionOrder status, a COUNTED/EXEMPT determination, an AlarmPermit renewal, or the logical clock"
    algorithm: threshold
    formula: |
      now   = logical clock
      sched = FeeSchedule referenced by AlarmSite.governing_fee_schedule_id (when null, posture is RESPONSE_ACTIVE)

      if exists SuspensionOrder(site) with status IN {EFFECTIVE, REINSTATEMENT_PENDING}
             AND effective_from <= now <= effective_through:
          response_status = RESPONSE_SUSPENDED
      elif exists SuspensionOrder(site) with status = LIFTED
             AND now <= lifted_at + probation_days whole days:
          response_status = RESPONSE_PROBATION
      elif chargeable_count_window >= sched.probation_threshold_count:      # INCLUSIVE >=
          response_status = RESPONSE_PROBATION
      else:
          response_status = RESPONSE_ACTIVE

      suspension_auto_proposal = true when chargeable_count_window >= sched.suspension_threshold_count   # INCLUSIVE >=
    input_set: "SuspensionOrder rows of one site in EFFECTIVE, REINSTATEMENT_PENDING or LIFTED; VACATED and EXPIRED orders are ignored. chargeable_count_window comes from calculation false_alarm_occurrence_index under the governing counting variant."
    constants:
      PROBATION_THRESHOLD_COUNT: 4
      SUSPENSION_THRESHOLD_COUNT: 6
    precision: "Integer comparisons; both thresholds are inclusive (count 4 is on probation, count 3 is not; count 6 proposes suspension, count 5 does not)"

  - name: ecv_verification_sufficiency
    trigger: "POST /false-alarm-program/dispatch-requests (evaluated once at submission and frozen on the row)"
    algorithm: constraint_propagation
    formula: |
      eligible = [ a in call_attempts where
                     a.site_contact_id resolves to a SiteContact with status = ACTIVE
                       AND is_ecv_callable = true
                       AND alarm_site_id == AlarmSystem.alarm_site_id
                     AND a.outcome IN {NO_ANSWER, VOICEMAIL, ANSWERED_UNVERIFIED, ANSWERED_CANCELLED} ]
      distinct_ecv_contact_count = count of DISTINCT a.site_contact_id values in eligible

      ecv_sufficient =
          true   when alarm_type == DURESS                                     # duress bypasses ECV entirely
          else true when verification_method == TWO_CALL_ECV
                        AND distinct_ecv_contact_count >= MIN_DISTINCT_ECV_CONTACTS   # INCLUSIVE >=
          else true when verification_method == AUDIO_VIDEO AND audio_video_evidence == true
          else true when verification_method == GUARD_RESPONSE AND guard_on_scene == true
          else false

      system_permitted_at_occurrence = (AlarmSystem.status == PERMITTED at submission time)
    input_set: "The submitted call_attempts array joined against ACTIVE, ECV-callable SiteContact rows of the system's own site. Attempts naming a REMOVED contact, a contact of a different site, or a non-callable contact are dropped before the distinct count."
    constants:
      MIN_DISTINCT_ECV_CONTACTS: 2
    precision: "Integer distinct count; the empty call_attempts array yields 0 and therefore insufficiency"
    variants:
      - name: two_attempts_one_contact
        when: "call_attempts contains two entries with the same site_contact_id"
        difference: "distinct_ecv_contact_count = 1, so a TWO_CALL_ECV request is insufficient even though two calls were placed."
      - name: exactly_two_distinct
        when: "call_attempts contains exactly two entries with different site_contact_id values"
        difference: "distinct_ecv_contact_count = 2 satisfies the inclusive threshold and the request is sufficient."

  - name: payment_waterfall_allocation
    trigger: "POST /false-alarm-program/payment-records"
    algorithm: waterfall_allocation
    formula: |
      # ---------------- AUTO_WATERFALL ----------------
      candidates = PenaltyInvoice rows with alarm_site_id = payment.alarm_site_id
                   AND payment_status IN {UNPAID, PARTIALLY_PAID}
                   AND collections_stage != WRITTEN_OFF
      stage_rank(REFERRED) = 4, stage_rank(FINAL_NOTICE) = 3, stage_rank(NOTICE) = 2, stage_rank(CURRENT) = 1
      order = stage_rank DESC, then due_on ASC, then created_at ASC          # id is NEVER an ordering input

      remaining = payment.amount_cents
      seq = 0
      for inv in candidates by order:
          applied = min(remaining, inv.outstanding_cents)
          if applied > 0:
              seq += 1
              create PaymentAllocation { payment_record_id, penalty_invoice_id: inv.id,
                                         amount_cents: applied, sequence_index: seq, status: APPLIED }
              inv.paid_cents += applied
              inv.payment_status = PAID when inv.paid_cents + inv.adjusted_cents == inv.assessed_cents
                                   else PARTIALLY_PAID
              remaining -= applied
      credited_cents  = remaining
      allocated_cents = payment.amount_cents - credited_cents
      AlarmSite.credit_balance_cents += credited_cents

      # ---------------- EXPLICIT ----------------
      # allocations[] = [{ penalty_invoice_id, amount_cents }] in request order
      reject with ERR_ALLOCATION_MISMATCH unless ALL hold:
        (a) sum(allocations[].amount_cents) == payment.amount_cents           # exact, no remainder allowed
        (b) every amount_cents >= 1 AND <= that invoice's outstanding_cents
        (c) every invoice belongs to payment.alarm_site_id, has collections_stage != WRITTEN_OFF
            and payment_status IN {UNPAID, PARTIALLY_PAID}
        (d) no penalty_invoice_id appears twice
      sequence_index follows the request array order; credited_cents = 0 by construction
    input_set: "Open, non-written-off invoices of exactly one AlarmSite. The site's existing credit_balance_cents is NOT auto-consumed by a later invoice — it is released only by a subsequent payment's allocation or by a void reversal."
    constants:
      STAGE_RANK: "{REFERRED:4, FINAL_NOTICE:3, NOTICE:2, CURRENT:1}"
      TIE_BREAK: "due_on ASC, then created_at ASC"
    precision: "Whole cents; no rounding occurs — every amount is already integral"

  - name: permit_renewal_fee
    trigger: "AlarmPermit RENEWAL_DUE -> ACTIVE and GRACE -> ACTIVE"
    algorithm: threshold
    formula: |
      now       = logical clock
      days_late = max(0, floor((now - permit.term_end_at) / 86400 seconds))
      tier      = first entry of sched.late_renewal_tiers (declared order) where
                  max_days_late is null OR days_late <= max_days_late
      late_fee_cents = 0 when days_late == 0 else tier.fee_cents

      # GRACE geometry: renewal is accepted while now <= grace_through_at, i.e. days_late <= 30.
      # days_late == 30 is still renewable and selects the {max_days_late: 30 -> 3000} tier;
      # once now > grace_through_at the nightly run has already moved the permit to EXPIRED,
      # so the {max_days_late: null -> 6000} tier is only reachable when the grace window is
      # configured longer than the tier bounds.
      lines = [ PERMIT_RENEWAL @ permit_renewal_fee_cents ] +
              ( [ LATE_RENEWAL @ late_fee_cents ] when late_fee_cents > 0 )
      new_term_start_at = now ; new_term_end_at = now + permit_term_days whole days
    input_set: "One AlarmPermit in RENEWAL_DUE or GRACE and the FeeSchedule pinned on its site."
    constants:
      DEFAULT_LATE_RENEWAL_TIERS: "[{max_days_late:15,fee_cents:1500},{max_days_late:30,fee_cents:3000},{max_days_late:null,fee_cents:6000}]"
      RENEWAL_GRACE_DAYS: 30
      PERMIT_TERM_DAYS: 365
    precision: "Whole days by floor division on UTC seconds; whole cents"

  - name: reinstatement_requirement_set
    trigger: "SuspensionOrder PROPOSED -> EFFECTIVE"
    algorithm: threshold
    formula: |
      prior = AlarmSite.lifted_suspension_count at serve time
      reinstatement_fee_cents = round_half_up(reinstatement_base_fee_cents * (1 + reinstatement_escalation_pct * prior))
      probation_days          = PROBATION_DAYS_PER_SUSPENSION * (prior + 1)
      suspension_sequence     = prior + 1
      required_conditions = { inspection_required: true,
                              ecv_attestation_required: true,
                              min_ecv_contacts: BASE_MIN_ECV_CONTACTS + prior,
                              invoices_paid_required: true }
      # Inspection freshness gate applied at the reinstatement request:
      #   technician_inspection_date >= logical clock - INSPECTION_VALID_DAYS whole days
      #   AND technician_inspection_date <= logical clock
    input_set: "One SuspensionOrder plus its site's LIFTED suspension history. VACATED and EXPIRED orders never contribute to prior, so a vacated order leaves the escalation ladder untouched."
    constants:
      REINSTATEMENT_BASE_FEE_CENTS: 60000
      REINSTATEMENT_ESCALATION_PCT: 0.50
      PROBATION_DAYS_PER_SUSPENSION: 90
      BASE_MIN_ECV_CONTACTS: 2
      INSPECTION_VALID_DAYS: 30
    precision: "Whole cents, round_half_up; whole days"

  - name: docket_session_overlap
    trigger: "POST /false-alarm-program/hearing-dockets"
    algorithm: interval_merge
    formula: |
      candidates = HearingDocket rows with the same hearing_officer_user_id
                   AND status IN {OPEN, CLOSED_FOR_SCHEDULING, HELD}          # CANCELLED sessions free their interval
      # HALF-OPEN intervals [session_start, session_end) inflated by a 15-minute
      # turnaround buffer on BOTH sides of the existing session:
      conflict(new, existing) =
              new.session_start < existing.session_end   + BUFFER_MINUTES
          AND existing.session_start < new.session_end   + BUFFER_MINUTES
      # Touching sessions collide: new.session_start == existing.session_end leaves a 0-minute
      # gap, which is < 15 minutes. The first accepted back-to-back start is
      # existing.session_end + 15 minutes exactly (strict < makes that value legal).
      # Different officers never collide, no matter how the intervals sit.
      aggregate capacity is a SEPARATE gate evaluated at scheduling time:
          HearingDocket.scheduled_appeal_count < HearingDocket.capacity
    input_set: "HearingDocket rows of one hearing_officer_user_id in OPEN, CLOSED_FOR_SCHEDULING or HELD."
    constants:
      BUFFER_MINUTES: 15
      DEFAULT_CAPACITY: 4
    precision: "Minute-granular UTC comparison; half-open intervals with a symmetric 15-minute buffer"

  - name: suspension_period_overlap
    trigger: "POST /false-alarm-program/suspension-orders"
    algorithm: interval_merge
    formula: |
      candidates = SuspensionOrder rows with the same alarm_site_id
                   AND status IN {PROPOSED, EFFECTIVE, REINSTATEMENT_PENDING}   # LIFTED, VACATED, EXPIRED free the interval
      # CLOSED intervals [effective_from, effective_through] with NO buffer:
      conflict(new, existing) =
              new.effective_from      <= existing.effective_through
          AND existing.effective_from <= new.effective_through
      # Touching endpoints collide: new.effective_from == existing.effective_through is a
      # conflict. The first accepted consecutive start is existing.effective_through + 1 day.
      # There is no capacity notion here — a premises may hold at most one live order at a time.
    input_set: "SuspensionOrder rows of one alarm_site_id in PROPOSED, EFFECTIVE or REINSTATEMENT_PENDING."
    constants:
      BUFFER_DAYS: 0
      MAX_LIVE_ORDERS_PER_SITE: 1
    precision: "Whole-day UTC comparison; closed intervals, zero buffer — geometrically different from docket_session_overlap, which is half-open with a 15-minute buffer and an aggregate capacity gate"

  - name: site_balance_rollup
    trigger: "End of every request that creates, adjusts, voids or pays a PenaltyInvoice, changes a SiteContact, an AlarmSystem status, or a SuspensionOrder status"
    algorithm: aggregation
    formula: |
      # recomputation ORDER is pinned; each step reads the result of the previous one
      1. per-invoice: outstanding_cents = max(0, assessed_cents - paid_cents - adjusted_cents)
      2. outstanding_balance_cents = sum(outstanding_cents) over PenaltyInvoice of the site with
                                     payment_status IN {UNPAID, PARTIALLY_PAID}
                                     AND collections_stage != WRITTEN_OFF
      3. lifetime_assessed_cents  = sum(assessed_cents) over PenaltyInvoice of the site with
                                     payment_status != VOIDED
      4. ecv_callable_contact_count = count(SiteContact with status = ACTIVE AND is_ecv_callable = true)
         unpermitted_system_count   = count(AlarmSystem with status = UNPERMITTED)
         lifted_suspension_count    = count(SuspensionOrder with status = LIFTED)
      5. renewal_block_active = outstanding_balance_cents >= delinquent_balance_block_cents   # INCLUSIVE >=
      6. permit flips: every AlarmPermit of the site in RENEWAL_DUE moves to RENEWAL_BLOCKED when
         renewal_block_active became true; every RENEWAL_BLOCKED permit moves back to RENEWAL_DUE when it became false
      7. response_status recomputed via calculation site_response_posture
    input_set: "All PenaltyInvoice, SiteContact, AlarmSystem and SuspensionOrder rows of one AlarmSite, filtered exactly as written above."
    constants:
      DELINQUENT_BALANCE_BLOCK_CENTS: 50000
    precision: "Whole cents; integer counts; step order 1..7 is mandatory because step 6 reads step 5 and step 7 reads step 4"

  - name: money_conservation_invariant
    trigger: "Asserted after POST /false-alarm-program/payment-records and after its compensating action POST /false-alarm-program/payment-records/{paymentId}/void"
    algorithm: aggregation
    formula: |
      # Conserved quantity: CASH received per premises.
      cash_in(site)  = sum(PaymentRecord.amount_cents where alarm_site_id = site AND status = APPLIED)
      cash_out(site) = sum(PaymentAllocation.amount_cents where status = APPLIED
                            AND its PaymentRecord.status = APPLIED
                            AND its PenaltyInvoice.alarm_site_id = site)
      INVARIANT: cash_in(site) == cash_out(site) + AlarmSite.credit_balance_cents

      Forward action:      POST /payment-records  (allocations created, credit remainder parked)
      Compensating action: POST /payment-records/{paymentId}/void
          - every PaymentAllocation of that payment flips APPLIED -> REVERSED
          - each touched invoice's paid_cents drops by the reversed amount and its payment_status
            recomputes (PAID -> PARTIALLY_PAID or UNPAID)
          - AlarmSite.credit_balance_cents -= that payment's credited_cents
          - the PaymentRecord flips APPLIED -> VOIDED, leaving BOTH sides of the identity
            exactly at their pre-payment values, with zero drift in credit_balance_cents
    input_set: "PaymentRecord rows with status = APPLIED and their APPLIED PaymentAllocation children for one AlarmSite. A void removes the payment from one side and its allocations from the other side within the same request, so the equality is restored before the response is returned."
    constants:
      CREDIT_FLOOR_CENTS: 0
    precision: "Whole cents; the identity is exact, never approximate"

  - name: chargeable_count_conservation_invariant
    trigger: "Asserted after FalseAlarmIncident UNDER_REVIEW -> COUNTED and after its compensating actions APPEALED -> EXEMPT_BY_APPEAL and APPEALED -> UNDER_REVIEW (remand)"
    algorithm: aggregation
    formula: |
      # Conserved quantity: the COUNTED-OCCURRENCE SEQUENCE per premises (a count and an index set,
      # not money) — deliberately a different conserved kind from money_conservation_invariant.
      counted(site) = FalseAlarmIncident rows with alarm_site_id = site AND status IN {COUNTED, APPEALED}
                      AND occurred_at inside the governing counting window
      INVARIANT A: AlarmSite.chargeable_count_window == | counted(site) |
      INVARIANT B: { i.occurrence_index : i in counted(site) } == { 1, 2, ..., | counted(site) | }
                   exactly — contiguous, no gaps, no duplicates, assigned by (occurred_at ASC, created_at ASC)
      INVARIANT C: AlarmSite.lifetime_assessed_cents == sum over every non-VOIDED PenaltyInvoice of the
                   re-derived assessed_cents for the indices currently in force

      Forward action:      determination COUNTED (index N assigned, fee assessed, invoice issued)
      Compensating action: appeal GRANTED (EXEMPT_BY_APPEAL) or REMAND
          - the exempted incident's occurrence_index becomes null and its fee becomes 0
          - every later chargeable incident is renumbered down by one and RE-PRICED at its new tier
          - each re-priced incident's invoice is re-assessed; overpayment moves to credit_balance_cents
          - all three invariants hold with the exempted incident absent, i.e. the site's state is
            byte-for-byte what it would have been had the incident never been counted
    input_set: "Chargeable incidents (status IN {COUNTED, APPEALED}) of one AlarmSite inside the governing window; a live appeal does not remove its incident from the set, so the sequence stays contiguous throughout the appeal."
    constants:
      ORDERING_KEY: "(occurred_at ASC, created_at ASC)"
    precision: "Integer counts and indices; fee re-derivation follows calculation escalating_false_alarm_fee exactly"

# ============================================================================
# §1.4 VALIDATION RULES TABLE (ordered by priority; lowest number evaluated first)
# ----------------------------------------------------------------------------
# Evaluation contract: for any single request the server evaluates these rows in
# ascending `priority` order and returns the FIRST row whose check fails. Three
# documented category-pair conflicts are marked PRIORITY PAIR A/B/C below: each
# names a request that fails two rows in different categories, and states which
# error_id wins.
# ============================================================================
validations:
  - priority: 1
    category: headers
    check: "Both X-User-Role and X-User-ID request headers are present and non-empty. Evaluated before any body parsing, path resolution, or role lookup."
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: headers
    check: "X-User-Role names one of the eight roles declared in §1.7 (exact case-sensitive match). An unrecognized role string is rejected here, before per-endpoint permission is consulted."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "The recognized role appears in the target endpoint's `roles:` list in §1.5."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: format
    check: "Every field marked required (no trailing ?) in the endpoint's §1.5 `input:` is present and non-null. Reported for the first missing field in §1.5 input declaration order."
    error_id: ERR_MISSING_REQUIRED_FIELD
    http_status: 422
    applies_to: "all POST / PATCH / PUT endpoints"

  - priority: 5
    category: format
    check: "Every supplied field is well formed: enum fields hold a declared member; *_cents and count fields are non-negative integers (integer-cents only, no floats accepted anywhere); timestamps parse as RFC 3339 UTC with a trailing Z; *_pct fields lie in [0, 1]; ids are UUID strings; fee_tiers-style arrays are non-empty. Reported for the first offending field in §1.5 input declaration order."
    error_id: ERR_INVALID_FIELD_VALUE
    http_status: 422
    applies_to: "all POST / PATCH / PUT endpoints"

  - priority: 6
    category: existence
    check: "Every id embedded in the request path exists, validated strictly left-to-right so the leftmost unknown segment wins. Emits the entity-specific code (ERR_ALARM_SITE_NOT_FOUND, ERR_ALARM_SYSTEM_NOT_FOUND, ERR_ALARM_PERMIT_NOT_FOUND, ERR_ALARM_COMPANY_NOT_FOUND, ERR_SITE_CONTACT_NOT_FOUND, ERR_DISPATCH_REQUEST_NOT_FOUND, ERR_FALSE_ALARM_INCIDENT_NOT_FOUND, ERR_APPEAL_NOT_FOUND, ERR_HEARING_DOCKET_NOT_FOUND, ERR_SUSPENSION_ORDER_NOT_FOUND, ERR_PENALTY_INVOICE_NOT_FOUND, ERR_PAYMENT_RECORD_NOT_FOUND, ERR_PAYMENT_ALLOCATION_NOT_FOUND, ERR_COMPLIANCE_REPORT_NOT_FOUND, ERR_FEE_SCHEDULE_NOT_FOUND)."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 7
    category: existence
    check: "Every FK id supplied in the request body resolves to a live row, validated in §1.5 input declaration order (body existence is always checked after path existence). Emits the same entity-specific 404 codes as priority 6."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all POST / PATCH endpoints carrying FK fields"

  - priority: 8
    category: auth
    check: "Entity-backed callers act only on their own aggregate: an AlarmUser's X-User-ID must equal the AlarmSite.id reachable from the target resource (site itself, or the site of the target system / permit / incident / appeal / invoice / payment), and an AlarmCompanyOperator's X-User-ID must equal the AlarmCompany.id reachable from the target resource (company itself, or the monitoring_company_id of the target system / dispatch request / compliance report). Opaque roles skip this row."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints acted on by AlarmUser or AlarmCompanyOperator"

  - priority: 9
    category: auth
    check: "Segregation of duties. On POST /false-alarm-program/appeals/{appealId}/decide the deciding X-User-ID must differ from FalseAlarmIncident.determined_by_user_id of the appealed incident and from Appeal.filed_by_user_id; on POST /false-alarm-program/false-alarm-incidents/{incidentId}/determination the determining X-User-ID must differ from DispatchRequest.validated_by_user_id of the incident source request; on POST /false-alarm-program/penalty-invoices/{invoiceId}/adjustments the adjusting X-User-ID must differ from every PaymentRecord.recorded_by_user_id already posted to that invoice."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /false-alarm-program/appeals/{appealId}/decide, POST /false-alarm-program/false-alarm-incidents/{incidentId}/determination, POST /false-alarm-program/penalty-invoices/{invoiceId}/adjustments"

  - priority: 10
    category: auth
    check: "Only the hearing officer of the docket that heard the appeal may decide it: X-User-ID equals HearingDocket.hearing_officer_user_id of Appeal.hearing_docket_id."
    error_id: ERR_NOT_DOCKET_OFFICER
    http_status: 403
    applies_to: "POST /false-alarm-program/appeals/{appealId}/decide, POST /false-alarm-program/hearing-dockets/{docketId}/hold-session"

  - priority: 11
    category: concurrency
    check: "expected_alarm_site_version equals AlarmSite.version at the moment of the write (§1.2.1 suspension-order-create-stale-site and payment-record-create-stale-site)."
    error_id: ERR_STALE_ALARM_SITE_VERSION
    http_status: 412
    applies_to: "POST /false-alarm-program/suspension-orders, POST /false-alarm-program/payment-records"

  - priority: 12
    category: concurrency
    check: "expected_penalty_invoice_version equals PenaltyInvoice.version at the moment of the write (§1.2.1 invoice-adjustment-stale-invoice)."
    error_id: ERR_STALE_PENALTY_INVOICE_VERSION
    http_status: 412
    applies_to: "POST /false-alarm-program/penalty-invoices/{invoiceId}/adjustments"

  - priority: 13
    category: concurrency
    check: "expected_alarm_system_version equals AlarmSystem.version at the moment of the write (§1.2.1 alarm-system-reconfiguration-stale-system)."
    error_id: ERR_STALE_ALARM_SYSTEM_VERSION
    http_status: 412
    applies_to: "PATCH /false-alarm-program/alarm-systems/{systemId}"

  - priority: 14
    category: state
    check: "Version guard on non-race writes (state precondition, not a §1.2.1 race): expected_alarm_permit_version equals AlarmPermit.version on renewal."
    error_id: ERR_STALE_ALARM_PERMIT_VERSION
    http_status: 412
    applies_to: "POST /false-alarm-program/alarm-permits/{permitId}/renewals"

  - priority: 15
    category: state
    check: "Version guard on non-race writes: expected_false_alarm_incident_version equals FalseAlarmIncident.version when an appeal is filed against it."
    error_id: ERR_STALE_FALSE_ALARM_INCIDENT_VERSION
    http_status: 412
    applies_to: "POST /false-alarm-program/appeals"

  - priority: 16
    category: state
    check: "Version guard on non-race writes: expected_hearing_docket_version equals HearingDocket.version when an appeal is placed on that docket."
    error_id: ERR_STALE_HEARING_DOCKET_VERSION
    http_status: 412
    applies_to: "POST /false-alarm-program/appeals/{appealId}/schedule"

  - priority: 17
    category: state
    check: "The target resource sits in a state from which the requested §1.2 transition is declared. Covers every state machine (AlarmSystem, AlarmPermit, DispatchRequest, FalseAlarmIncident, HearingDocket, Appeal, SuspensionOrder, PenaltyInvoice.payment_status, PenaltyInvoice.collections_stage, AlarmCompany, ComplianceReport); terminal-state targets always fail here."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 18
    category: state
    check: "PRIORITY PAIR A (higher-priority member; partner is priority 26 business_safety ERR_POLICE_RESPONSE_SUSPENDED). The alarm system named by a new dispatch request has no DispatchRequest in SUBMITTED, VALIDATED or DISPATCHED. A request naming a system that already has an open dispatch request AND belongs to a site whose response_status is RESPONSE_SUSPENDED fails both rows; this row wins and ERR_OPEN_DISPATCH_REQUEST_EXISTS is returned."
    error_id: ERR_OPEN_DISPATCH_REQUEST_EXISTS
    http_status: 409
    applies_to: "POST /false-alarm-program/dispatch-requests"

  - priority: 19
    category: state
    check: "The dispatch request named by a new false alarm incident has no FalseAlarmIncident other than a VOIDED one (one live incident per dispatch request)."
    error_id: ERR_INCIDENT_ALREADY_REPORTED
    http_status: 409
    applies_to: "POST /false-alarm-program/false-alarm-incidents"

  - priority: 20
    category: state
    check: "The target HearingDocket.status is OPEN when an appeal is scheduled onto it."
    error_id: ERR_DOCKET_NOT_OPEN
    http_status: 409
    applies_to: "POST /false-alarm-program/appeals/{appealId}/schedule"

  - priority: 21
    category: state
    check: "An invoice that has been written off cannot be adjusted, paid, or referred to collections."
    error_id: ERR_INVOICE_WRITTEN_OFF
    http_status: 409
    applies_to: "POST /false-alarm-program/penalty-invoices/{invoiceId}/adjustments, POST /false-alarm-program/payment-records, POST /false-alarm-program/penalty-invoices/{invoiceId}/collections-referral"

  - priority: 22
    category: business_referential
    check: "The AlarmCompany named as reporter of a dispatch request or of a compliance report equals AlarmSystem.monitoring_company_id of the referenced system, and the referenced AlarmSystem belongs to the referenced AlarmSite."
    error_id: ERR_COMPANY_NOT_SYSTEM_MONITOR
    http_status: 409
    applies_to: "POST /false-alarm-program/dispatch-requests, POST /false-alarm-program/false-alarm-incidents, POST /false-alarm-program/compliance-reports"

  - priority: 23
    category: business_referential
    check: "A supplied exempt_cause_code is a member of the governing FeeSchedule.exempt_cause_codes list."
    error_id: ERR_EXEMPT_CAUSE_NOT_RECOGNIZED
    http_status: 422
    applies_to: "POST /false-alarm-program/false-alarm-incidents/{incidentId}/determination, POST /false-alarm-program/appeals/{appealId}/decide"

  - priority: 24
    category: business_referential
    check: "Determination coherence: an EXEMPT determination supplies a recognized exempt_cause_code, and a CHARGEABLE determination supplies none."
    error_id: ERR_EXEMPT_CAUSE_MUST_BE_EXEMPT
    http_status: 422
    applies_to: "POST /false-alarm-program/false-alarm-incidents/{incidentId}/determination"

  - priority: 25
    category: business_safety
    check: "The reporting AlarmCompany.status is ACTIVE or PROBATION; a SUSPENDED or REVOKED company may not lodge dispatch requests or incident reports."
    error_id: ERR_COMPANY_DISPATCH_PRIVILEGE_SUSPENDED
    http_status: 403
    applies_to: "POST /false-alarm-program/dispatch-requests, POST /false-alarm-program/false-alarm-incidents"

  - priority: 26
    category: business_safety
    check: "PRIORITY PAIR A (lower-priority member; loses to priority 18). AlarmSite.response_status of the target system's site is not RESPONSE_SUSPENDED — police response has not been withdrawn from the premises."
    error_id: ERR_POLICE_RESPONSE_SUSPENDED
    http_status: 409
    applies_to: "POST /false-alarm-program/dispatch-requests"

  - priority: 27
    category: business_safety
    check: "The site's live SiteContact roster satisfies the system's required distinct-contact minimum from §1.3 ecv_verification_sufficiency (base 2, raised per posture): a site that cannot be called back may not have a dispatch requested for it."
    error_id: ERR_INSUFFICIENT_ECV_CONTACTS
    http_status: 409
    applies_to: "POST /false-alarm-program/dispatch-requests"

  - priority: 28
    category: business_safety
    check: "DispatchRequest.ecv_sufficient — frozen at submission by §1.3 ecv_verification_sufficiency from the distinct eligible contact count and the declared verification_method — is true before the request may be validated for dispatch."
    error_id: ERR_ECV_REQUIREMENT_NOT_MET
    http_status: 422
    applies_to: "POST /false-alarm-program/dispatch-requests/{requestId}/validate"

  - priority: 29
    category: business_safety
    check: "Verified-response proof matches the system requirement: when AlarmSystem.verified_response_mode = AUDIO_VIDEO_REQUIRED the request carries audio_video_evidence = true, and when it is GUARD_REQUIRED the request carries guard_on_scene = true."
    error_id: ERR_VERIFIED_RESPONSE_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /false-alarm-program/dispatch-requests/{requestId}/validate"

  - priority: 30
    category: business_temporal
    check: "PRIORITY PAIR C (higher-priority member; partner is priority 36 business_constraint ERR_APPEAL_ALREADY_PENDING). The appeal is filed no later than determined_at + appeal_filing_days (20 days, inclusive boundary) on the governing FeeSchedule. An appeal filed on day 21 against an incident that also already has a live appeal fails both rows; this row wins and ERR_APPEAL_WINDOW_CLOSED is returned."
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /false-alarm-program/appeals"

  - priority: 31
    category: business_temporal
    check: "HearingDocket.session_start is strictly after the current logical clock at creation time, and session_end is strictly after session_start."
    error_id: ERR_HEARING_SESSION_IN_PAST
    http_status: 422
    applies_to: "POST /false-alarm-program/hearing-dockets"

  - priority: 32
    category: business_temporal
    check: "A docket may only be held once the logical clock has reached session_start (inclusive)."
    error_id: ERR_HEARING_SESSION_NOT_STARTED
    http_status: 409
    applies_to: "POST /false-alarm-program/hearing-dockets/{docketId}/hold-session"

  - priority: 33
    category: business_temporal
    check: "SuspensionOrder.technician_inspection_date supplied with a reinstatement request is no older than INSPECTION_VALID_DAYS (30 days, inclusive boundary) relative to the logical clock."
    error_id: ERR_INSPECTION_EVIDENCE_STALE
    http_status: 409
    applies_to: "POST /false-alarm-program/suspension-orders/{orderId}/reinstatement-requests"

  - priority: 34
    category: business_temporal
    check: "SuspensionOrder.effective_from is on or after the logical clock at creation and on or after the triggering incident's occurred_at, and effective_through is strictly after effective_from."
    error_id: ERR_SUSPENSION_EFFECTIVE_DATE_INVALID
    http_status: 422
    applies_to: "POST /false-alarm-program/suspension-orders"

  - priority: 35
    category: business_temporal
    check: "A payment may be voided only inside the void window (logical clock <= tendered_on + 2 whole days, inclusive) and only while none of its allocations target an invoice whose collections_stage has since become WRITTEN_OFF."
    error_id: ERR_PAYMENT_VOID_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /false-alarm-program/payment-records/{paymentId}/void"

  - priority: 36
    category: business_constraint
    check: "PRIORITY PAIR C (lower-priority member; loses to priority 30). The appealed incident has no Appeal in FILED, SCHEDULED or HEARD."
    error_id: ERR_APPEAL_ALREADY_PENDING
    http_status: 409
    applies_to: "POST /false-alarm-program/appeals"

  - priority: 37
    category: business_constraint
    check: "A rehearing (prior_appeal_id supplied) is accepted only when the prior appeal reached DENIED (not WITHDRAWN, not GRANTED) and the prior appeal has no rehearing already filed against it."
    error_id: ERR_REHEARING_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /false-alarm-program/appeals"

  - priority: 38
    category: business_constraint
    check: "Scheduling an appeal onto a docket does not push the docket's scheduled appeal count above HearingDocket.capacity (DEFAULT_CAPACITY 4); the count is evaluated including the appeal being added."
    error_id: ERR_DOCKET_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /false-alarm-program/appeals/{appealId}/schedule"

  - priority: 39
    category: business_constraint
    check: "A new docket for the same hearing_officer_user_id does not overlap an existing OPEN or CLOSED_FOR_SCHEDULING docket under the half-open plus 15-minute-buffer semantics of §1.3 docket_session_overlap."
    error_id: ERR_DOCKET_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /false-alarm-program/hearing-dockets"

  - priority: 40
    category: business_constraint
    check: "A new suspension order's [effective_from, effective_through] interval does not overlap an existing PROPOSED, EFFECTIVE or REINSTATEMENT_PENDING order for the same alarm_site_id under the closed-interval zero-buffer semantics of §1.3 suspension_period_overlap."
    error_id: ERR_SUSPENSION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /false-alarm-program/suspension-orders"

  - priority: 41
    category: business_constraint
    check: "AlarmSite.address_key is unique across all non-archived sites after normalization (upper-cased, whitespace-collapsed street plus unit)."
    error_id: ERR_DUPLICATE_ADDRESS_KEY
    http_status: 409
    applies_to: "POST /false-alarm-program/alarm-sites"

  - priority: 42
    category: business_constraint
    check: "An alarm system has at most one AlarmPermit in ACTIVE, RENEWAL_DUE or GRACE; a second issuance is refused."
    error_id: ERR_ACTIVE_PERMIT_EXISTS
    http_status: 409
    applies_to: "POST /false-alarm-program/alarm-systems/{systemId}/approve-registration"

  - priority: 43
    category: business_constraint
    check: "PRIORITY PAIR B (higher-priority member; partner is priority 55 business_fiscal ERR_PERMIT_RENEWAL_BLOCKED). Exactly one FeeSchedule is ACTIVE at the logical clock, and it governs the fee about to be assessed. A renewal attempted with no ACTIVE fee schedule for a site whose delinquent balance is at or above delinquent_balance_block_cents fails both rows; this row wins and ERR_NO_ACTIVE_FEE_SCHEDULE is returned."
    error_id: ERR_NO_ACTIVE_FEE_SCHEDULE
    http_status: 409
    applies_to: "POST /false-alarm-program/alarm-systems/{systemId}/approve-registration, POST /false-alarm-program/alarm-permits/{permitId}/renewals, POST /false-alarm-program/false-alarm-incidents/{incidentId}/determination"

  - priority: 44
    category: business_constraint
    check: "SiteContact.contact_priority is unique among ACTIVE contacts of the same alarm_site_id."
    error_id: ERR_DUPLICATE_CONTACT_PRIORITY
    http_status: 409
    applies_to: "POST /false-alarm-program/site-contacts"

  - priority: 45
    category: business_constraint
    check: "Removing a contact must not drop the site's live roster below MIN_DISTINCT_ECV_CONTACTS (2) while the site has any AlarmSystem in REGISTERED or PERMITTED."
    error_id: ERR_CONTACT_ROSTER_MINIMUM
    http_status: 409
    applies_to: "DELETE /false-alarm-program/site-contacts/{contactId}"

  - priority: 46
    category: business_constraint
    check: "A compliance report's [period_start, period_end] closed interval does not overlap an existing ComplianceReport for the same monitoring_company_id in SUBMITTED, ACCEPTED, VARIANCE_FLAGGED or CORRECTED."
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /false-alarm-program/compliance-reports"

  - priority: 47
    category: business_constraint
    check: "A compliance report correction is accepted only when at least one reported metric differs from the accepted report's stored value."
    error_id: ERR_NO_REPORTABLE_VARIANCE
    http_status: 409
    applies_to: "POST /false-alarm-program/compliance-reports/{reportId}/correct"

  - priority: 48
    category: business_constraint
    check: "A compliance report may be corrected at most MAX_CORRECTIONS (2) times; correction_count is evaluated before the increment."
    error_id: ERR_CORRECTION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /false-alarm-program/compliance-reports/{reportId}/correct"

  - priority: 49
    category: business_constraint
    check: "The suspension threshold still holds at issuance time: the site's chargeable count under its governing counting window is at or above suspension_threshold_count (6). A count that has since fallen (appeal grant, void) invalidates the basis."
    error_id: ERR_SUSPENSION_BASIS_NO_LONGER_MET
    http_status: 409
    applies_to: "POST /false-alarm-program/suspension-orders"

  - priority: 50
    category: business_constraint
    check: "A reinstatement request carries ecv_attestation = true plus a non-empty corrective_action_summary, per the §1.3 reinstatement_requirement_set."
    error_id: ERR_ECV_ATTESTATION_REQUIRED
    http_status: 422
    applies_to: "POST /false-alarm-program/suspension-orders/{orderId}/reinstatement-requests"

  - priority: 51
    category: business_constraint
    check: "A company reinstatement action requires the earned condition: two consecutive accepted ComplianceReport periods with compliance_score at or above the good-standing threshold (0.70) after the suspension began."
    error_id: ERR_COMPANY_REINSTATEMENT_NOT_EARNED
    http_status: 409
    applies_to: "POST /false-alarm-program/alarm-companies/{companyId}/status-actions"

  - priority: 52
    category: business_constraint
    check: "An invoice whose linked incident is APPEALED may not be referred to collections or escalated in dunning while the appeal is live."
    error_id: ERR_INVOICE_UNDER_APPEAL
    http_status: 409
    applies_to: "POST /false-alarm-program/penalty-invoices/{invoiceId}/collections-referral"

  - priority: 53
    category: business_constraint
    check: "Collections referral requires all §1.3 delinquency_escalation referral criteria: collections_stage is FINAL_NOTICE, days past due is at or above delinquency_days (90), and outstanding_cents is at or above collections_referral_threshold_cents (25000)."
    error_id: ERR_REFERRAL_CRITERIA_NOT_MET
    http_status: 409
    applies_to: "POST /false-alarm-program/penalty-invoices/{invoiceId}/collections-referral"

  - priority: 54
    category: business_fiscal
    check: "New permit issuance is refused while the site's delinquent balance is at or above delinquent_balance_block_cents (50000, inclusive)."
    error_id: ERR_SITE_BALANCE_DELINQUENT
    http_status: 402
    applies_to: "POST /false-alarm-program/alarm-systems/{systemId}/approve-registration"

  - priority: 55
    category: business_fiscal
    check: "PRIORITY PAIR B (lower-priority member; loses to priority 43). Permit renewal is refused while the site's delinquent balance is at or above delinquent_balance_block_cents (50000, inclusive)."
    error_id: ERR_PERMIT_RENEWAL_BLOCKED
    http_status: 409
    applies_to: "POST /false-alarm-program/alarm-permits/{permitId}/renewals"

  - priority: 56
    category: business_fiscal
    check: "Reinstatement of police response requires the site's outstanding penalty balance (net of credit_balance_cents) to be zero, per the §1.3 reinstatement_requirement_set."
    error_id: ERR_OUTSTANDING_BALANCE_BLOCKS_REINSTATEMENT
    http_status: 402
    applies_to: "POST /false-alarm-program/suspension-orders/{orderId}/lift"

  - priority: 57
    category: business_fiscal
    check: "A WAIVE or REDUCE adjustment amount does not exceed the invoice's current outstanding_cents, and a WRITE_OFF is taken at exactly outstanding_cents."
    error_id: ERR_ADJUSTMENT_EXCEEDS_OUTSTANDING
    http_status: 422
    applies_to: "POST /false-alarm-program/penalty-invoices/{invoiceId}/adjustments"

  - priority: 58
    category: business_fiscal
    check: "Money conservation on a posted payment: the sum of the PaymentAllocation rows equals PaymentRecord.amount_cents minus the residual moved to AlarmSite.credit_balance_cents, per the §1.3 money_conservation_invariant."
    error_id: ERR_ALLOCATION_MISMATCH
    http_status: 422
    applies_to: "POST /false-alarm-program/payment-records"

  - priority: 59
    category: pagination
    check: "page is an integer at or above 1 and per_page is an integer in [1, 100]; sort keys name a declared field of the listed entity."
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all list GET endpoints"

# ============================================================================
# §1.5 API ENDPOINT TABLE
# ----------------------------------------------------------------------------
# All paths are absolute and start with the api_prefix /false-alarm-program.
# Every entity has a single-resource GET at /false-alarm-program/<collection>/{id}
# and a filtered list at /false-alarm-program/<collection> carrying every FK
# field as an optional query input, so every §1.1 FK is reverse-reachable.
# Field names ending in ? are optional inputs; all others are required.
# ============================================================================
endpoints:
  # ---------------------------------------------------------------- FeeSchedule
  - method: POST
    path: "/false-alarm-program/fee-schedules"
    description: "Create a DRAFT fee schedule carrying every program constant (tiers, thresholds, deadlines, fees, exempt cause codes)."
    roles: [ProgramAdministrator]
    code: 201
    input: [schedule_code, effective_from, counting_window_mode, free_alarm_allowance, fee_tiers, occupancy_multipliers, non_ecv_surcharge_pct, unpermitted_multiplier, suspension_period_aggravation_cents, per_incident_fee_cap_cents, probation_threshold_count, suspension_threshold_count, appeal_filing_days, permit_term_days, renewal_grace_days, new_installation_grace_days, permit_issue_fee_cents, permit_renewal_fee_cents, late_renewal_tiers, unpermitted_operation_penalty_cents, reinstatement_base_fee_cents, reinstatement_escalation_pct, admin_fee_pct, admin_fee_min_cents, admin_fee_max_cents, invoice_due_days, late_penalty_pct, delinquency_days, collections_referral_threshold_cents, delinquent_balance_block_cents, exempt_cause_codes, company_probation_score_threshold, company_suspension_score_threshold]
    output: FeeSchedule
    side_effects: ["Creates the row with status = DRAFT; no pricing consults a DRAFT schedule"]

  - method: POST
    path: "/false-alarm-program/fee-schedules/{scheduleId}/activate"
    description: "Activate a DRAFT schedule; the previously ACTIVE schedule becomes SUPERSEDED and keeps governing sites already pinned to it."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: FeeSchedule
    side_effects: ["Sets status = ACTIVE", "Sets the prior ACTIVE row to SUPERSEDED with superseded_at = logical clock", "Newly permitted sites pin governing_fee_schedule_id to this row"]

  - method: GET
    path: "/false-alarm-program/fee-schedules/{scheduleId}"
    description: "Read one fee schedule with all program constants."
    roles: [ProgramAdministrator, PermitClerk, BillingClerk, FalseAlarmReviewOfficer, HearingOfficer, PoliceDispatchSupervisor, AlarmCompanyOperator, AlarmUser]
    code: 200
    input: []
    output: FeeSchedule
    side_effects: []

  - method: GET
    path: "/false-alarm-program/fee-schedules"
    description: "List fee schedules, newest effective_from first."
    roles: [ProgramAdministrator, PermitClerk, BillingClerk, FalseAlarmReviewOfficer, HearingOfficer]
    code: 200
    input: ["status?", "schedule_code?", "page?", "per_page?"]
    output: FeeSchedule[]
    side_effects: []

  # --------------------------------------------------------------- AlarmCompany
  - method: POST
    path: "/false-alarm-program/alarm-companies"
    description: "Register a monitoring company with its licence and its scoring mode."
    roles: [ProgramAdministrator]
    code: 201
    input: [legal_name, license_number, contact_email, contact_phone, score_mode]
    output: AlarmCompany
    side_effects: ["Creates the company in status = ACTIVE with reporting_compliance_score = null until its first reviewed report"]

  - method: POST
    path: "/false-alarm-program/alarm-companies/{companyId}/status-actions"
    description: "Administrative status action on a monitoring company: SUSPEND, REINSTATE or REVOKE its dispatch-request privilege."
    roles: [ProgramAdministrator]
    code: 200
    input: [action, status_reason]
    output: AlarmCompany
    side_effects: ["Applies the §1.2 AlarmCompany transition", "SUSPEND stamps probation_started_at when the company was still ACTIVE", "Sets last_status_action_at = logical clock", "REINSTATE requires the two-consecutive-good-period condition"]

  - method: GET
    path: "/false-alarm-program/alarm-companies/{companyId}"
    description: "Read one monitoring company with its recomputed compliance score and counters."
    roles: [ProgramAdministrator, PermitClerk, BillingClerk, FalseAlarmReviewOfficer, PoliceDispatchSupervisor, AlarmCompanyOperator]
    code: 200
    input: []
    output: AlarmCompany
    side_effects: []

  - method: GET
    path: "/false-alarm-program/alarm-companies"
    description: "List monitoring companies."
    roles: [ProgramAdministrator, PermitClerk, BillingClerk, FalseAlarmReviewOfficer, PoliceDispatchSupervisor]
    code: 200
    input: ["status?", "license_number?", "page?", "per_page?"]
    output: AlarmCompany[]
    side_effects: []

  # ------------------------------------------------------------------ AlarmSite
  - method: POST
    path: "/false-alarm-program/alarm-sites"
    description: "Create a premises record; address_key must be unique after normalization."
    roles: [ProgramAdministrator, PermitClerk]
    code: 201
    input: [address_key, street_address, city, zip_code, occupancy_class, police_beat]
    output: AlarmSite
    side_effects: ["Creates the site with response_status = RESPONSE_ACTIVE, all counters 0 and governing_fee_schedule_id = null until its first permit issuance"]

  - method: GET
    path: "/false-alarm-program/alarm-sites/{siteId}"
    description: "Read one premises record with response posture, chargeable counts, balances and version (the value clients supply as expected_alarm_site_version)."
    roles: [ProgramAdministrator, PermitClerk, BillingClerk, FalseAlarmReviewOfficer, HearingOfficer, PoliceDispatchSupervisor, AlarmUser]
    code: 200
    input: []
    output: AlarmSite
    side_effects: []

  - method: GET
    path: "/false-alarm-program/alarm-sites"
    description: "List premises, filterable by governing schedule, posture or normalized address key."
    roles: [ProgramAdministrator, PermitClerk, BillingClerk, FalseAlarmReviewOfficer, PoliceDispatchSupervisor]
    code: 200
    input: ["governing_fee_schedule_id?", "response_status?", "address_key?", "occupancy_class?", "status?", "page?", "per_page?"]
    output: AlarmSite[]
    side_effects: []

  - method: GET
    path: "/false-alarm-program/alarm-sites/{siteId}/false-alarm-summary"
    description: "Computed read: the site with both counting-window variants (chargeable_count_rolling_365 and chargeable_count_permit_year), the authoritative chargeable_count_window, response_status, outstanding_balance_cents, credit_balance_cents and renewal_block_active recomputed at the logical clock."
    roles: [ProgramAdministrator, PermitClerk, BillingClerk, FalseAlarmReviewOfficer, HearingOfficer, AlarmUser]
    code: 200
    input: []
    output: AlarmSite
    side_effects: ["Read-only recomputation of the §1.3 site_response_posture and site_balance_rollup outputs; does not bump version"]

  # ---------------------------------------------------------------- SiteContact
  - method: POST
    path: "/false-alarm-program/site-contacts"
    description: "Add a responsible party to a premises roster; contact_priority is unique among ACTIVE contacts of the site."
    roles: [ProgramAdministrator, PermitClerk, AlarmUser]
    code: 201
    input: [alarm_site_id, full_name, phone_number, relationship, contact_priority, is_ecv_callable]
    output: SiteContact
    side_effects: ["Recomputes AlarmSite.ecv_callable_contact_count", "Increments AlarmSite.version by 1"]

  - method: DELETE
    path: "/false-alarm-program/site-contacts/{contactId}"
    description: "Remove a responsible party (soft delete to REMOVED); refused when it would drop the roster below the ECV minimum for a site with live systems."
    roles: [ProgramAdministrator, PermitClerk, AlarmUser]
    code: 200
    input: []
    output: SiteContact
    side_effects: ["Sets status = REMOVED and removed_at = logical clock", "Recomputes AlarmSite.ecv_callable_contact_count", "Increments AlarmSite.version by 1"]

  - method: GET
    path: "/false-alarm-program/site-contacts/{contactId}"
    description: "Read one roster entry."
    roles: [ProgramAdministrator, PermitClerk, PoliceDispatchSupervisor, FalseAlarmReviewOfficer, AlarmUser]
    code: 200
    input: []
    output: SiteContact
    side_effects: []

  - method: GET
    path: "/false-alarm-program/site-contacts"
    description: "List roster entries, filterable by premises."
    roles: [ProgramAdministrator, PermitClerk, PoliceDispatchSupervisor, FalseAlarmReviewOfficer, AlarmUser, AlarmCompanyOperator]
    code: 200
    input: ["alarm_site_id?", "status?", "is_ecv_callable?", "page?", "per_page?"]
    output: SiteContact[]
    side_effects: []

  # ---------------------------------------------------------------- AlarmSystem
  - method: POST
    path: "/false-alarm-program/alarm-systems"
    description: "Submit an alarm system registration for a premises, naming its monitoring company."
    roles: [ProgramAdministrator, PermitClerk, AlarmUser]
    code: 201
    input: [alarm_site_id, monitoring_company_id, system_type, zone_count, ecv_enabled, verified_response_mode, installed_at]
    output: AlarmSystem
    side_effects: ["Creates the system in status = SUBMITTED", "Stamps the new-installation grace anchor from installed_at"]

  - method: PATCH
    path: "/false-alarm-program/alarm-systems/{systemId}"
    description: "Reconfigure a registered system (monitoring company, ECV flag, verified-response mode, zone count) under optimistic concurrency on the system version."
    roles: [ProgramAdministrator, PermitClerk, AlarmUser]
    code: 200
    input: [expected_alarm_system_version, "monitoring_company_id?", "ecv_enabled?", "verified_response_mode?", "zone_count?"]
    output: AlarmSystem
    side_effects: ["Applies the supplied changes", "Increments AlarmSystem.version by 1", "Recomputes the site ECV requirement used by §1.3 ecv_verification_sufficiency"]

  - method: POST
    path: "/false-alarm-program/alarm-systems/{systemId}/approve-registration"
    description: "Approve a submitted registration: issues an AlarmPermit in ACTIVE and assesses the permit issue fee."
    roles: [ProgramAdministrator, PermitClerk]
    code: 201
    input: []
    output: AlarmPermit
    side_effects: ["AlarmSystem SUBMITTED -> PERMITTED with permitted_at = logical clock", "Creates the AlarmPermit with term_start_at, term_end_at and grace_through_at", "Pins AlarmSite.governing_fee_schedule_id to the ACTIVE FeeSchedule on first issuance", "Issues a PERMIT_ISSUE_FEE PenaltyInvoice", "Increments AlarmSite.version by 1"]

  - method: POST
    path: "/false-alarm-program/alarm-systems/{systemId}/reject-registration"
    description: "Reject a submitted registration with a reason."
    roles: [ProgramAdministrator, PermitClerk]
    code: 200
    input: [rejection_reason]
    output: AlarmSystem
    side_effects: ["AlarmSystem SUBMITTED -> REJECTED (terminal)", "Increments AlarmSystem.version by 1"]

  - method: POST
    path: "/false-alarm-program/alarm-systems/{systemId}/decommission"
    description: "Retire a system; its permit stops renewing and no further dispatch requests are accepted for it."
    roles: [ProgramAdministrator, PermitClerk, AlarmUser]
    code: 200
    input: []
    output: AlarmSystem
    side_effects: ["Sets status = DECOMMISSIONED and decommissioned_at = logical clock", "Any ACTIVE / GRACE AlarmPermit is EXPIRED", "Recomputes AlarmSite.unpermitted_system_count", "Increments AlarmSite.version by 1"]

  - method: GET
    path: "/false-alarm-program/alarm-systems/{systemId}"
    description: "Read one alarm system including its version (the value clients supply as expected_alarm_system_version)."
    roles: [ProgramAdministrator, PermitClerk, PoliceDispatchSupervisor, FalseAlarmReviewOfficer, BillingClerk, AlarmCompanyOperator, AlarmUser]
    code: 200
    input: []
    output: AlarmSystem
    side_effects: []

  - method: GET
    path: "/false-alarm-program/alarm-systems"
    description: "List alarm systems, filterable by premises, monitoring company or status."
    roles: [ProgramAdministrator, PermitClerk, PoliceDispatchSupervisor, FalseAlarmReviewOfficer, BillingClerk, AlarmCompanyOperator, AlarmUser]
    code: 200
