# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_HEADERS, http: 400, condition: "X-User-Role or X-User-ID header missing or empty" }
  - { id: ERR_ROLE_FORBIDDEN, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_PARTY_NOT_FOUND, http: 404, condition: "Entity-backed role's X-User-ID references no existing Party" }
  - { id: ERR_ROLE_PARTY_KIND_MISMATCH, http: 403, condition: "Entity-backed role's Party kind does not match the role (e.g., PublisherRep id is a SCHOOL party)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource or body FK reference does not exist" }
  - { id: ERR_PARTY_SCOPE_MISMATCH, http: 403, condition: "Acting Party is not the resource's scoped party (wrong school/publisher/author)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, bad type, bad enum, range violation (qty <= 0, pct outside [0,1], end <= start), unknown field" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state from which the requested transition exists; also terminal-state lockdown" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_FAIR_NOT_OPEN, http: 409, condition: "Operation requires the fair to be OPEN (sales tender/void, preorder fulfill, session open-signing)" }
  - { id: ERR_AGREEMENT_NOT_ACCEPTED, http: 409, condition: "Operation requires an ACCEPTED consignment agreement (stock-line commit, return create)" }
  - { id: ERR_RECONCILIATION_NOT_APPROVED, http: 409, condition: "Operation requires the fair's latest Reconciliation in APPROVED, SUBMITTED, or ACCEPTED (return create) or ACCEPTED (payout calculate)" }
  - { id: ERR_BOOKING_NOT_TRAVEL_READY, http: 409, condition: "Session open-signing requires the booking to be TRAVEL_BOOKED" }
  - { id: ERR_SESSION_NOT_SIGNING, http: 409, condition: "Ticket admit/redeem requires session OPEN_FOR_SIGNING (admit) or OPEN_FOR_SIGNING/CLOSED_FOR_SIGNING (redeem)" }
  - { id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED, http: 409, condition: "Counter would exceed MAX_NEGOTIATION_ROUNDS (agreements 6, bookings 4)" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "Logical clock at or beyond offer_expires_at on counter/accept" }
  - { id: ERR_VENUE_CONFLICT, http: 409, condition: "Venue slot effective buffered half-open interval intersects a non-RELEASED slot on the same venue_key" }
  - { id: ERR_SIGNING_FLOOR_CAPACITY_EXCEEDED, http: 409, condition: "Closed-interval overlapping sessions' summed line_space_units plus candidate exceed fair.signing_floor_capacity_units" }
  - { id: ERR_OUTSIDE_SIGNING_WINDOW, http: 409, condition: "Logical clock outside [start_at, end_at] at open-signing" }
  - { id: ERR_EMBARGO_ACTIVE, http: 409, condition: "Publish attempted before embargo_until" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Active duplicate: non-terminal agreement per (fair, publisher), reconciliation per fair, or non-terminal payout per fair" }
  - { id: ERR_SIGNING_CAPACITY_EXCEEDED, http: 409, condition: "Ticket issue would exceed session capacity_seats (live entitlements ISSUED+ADMITTED+REDEEMED)" }
  - { id: ERR_LINE_CAPACITY_EXCEEDED, http: 409, condition: "Admit would exceed session admit_concurrent_cap (fire-marshal concurrent line cap)" }
  - { id: ERR_TICKET_SESSION_MISMATCH, http: 409, condition: "Admit payload session_id differs from the ticket's session_id" }
  - { id: ERR_LINE_FAIR_MISMATCH, http: 409, condition: "Referenced stock line / booking / agreement belongs to a different fair than the request's fair_id" }
  - { id: ERR_FIRM_SALE_NOT_RETURNABLE, http: 409, condition: "Return authorization references a BACKLIST (firm-purchase) line" }
  - { id: ERR_RETURN_QUANTITY_EXCEEDS_ON_HAND, http: 409, condition: "Cumulative approved return quantity for a line would exceed qty_delivered - qty_sold - qty_damaged" }
  - { id: ERR_OVER_DELIVERY, http: 409, condition: "qty_delivered exceeds qty_committed" }
  - { id: ERR_DAMAGE_EXCEEDS_ON_HAND, http: 409, condition: "Damage qty exceeds unsold, unheld on-hand copies" }
  - { id: ERR_STOCK_NOT_AVAILABLE, http: 409, condition: "Tender line qty exceeds StockLine.qty_available_for_sale" }
  - { id: ERR_PRICE_BEYOND_MARKDOWN, http: 409, condition: "Supplied unit_price_cents outside [floor(list*(1-markdown_allowance_pct)), list]" }
  - { id: ERR_TENDER_SHORT, http: 402, condition: "tendered_amount_cents < total_cents" }
  - { id: ERR_PROMO_BUDGET_EXCEEDED, http: 409, condition: "Approving blast would push cumulative APPROVED+PUBLISHED spend above fair.promo_budget_cents" }
  - { id: ERR_TRAVEL_CAP_EXCEEDED, http: 409, condition: "travel_actual_cents exceeds the booking's travel_cap_cents" }
  - { id: ERR_COUNTS_INCOMPLETE, http: 409, condition: "submit-review with counted_lines not covering every DELIVERED StockLine of the fair" }
  - { id: ERR_VARIANCE_BEYOND_TOLERANCE, http: 409, condition: "Approve with total_abs_variance > SHRINK_TOLERANCE_UNITS (2)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Reconciliation approver is the same X-User-ID that created it (close-sales actor)" }
  - { id: ERR_PREORDER_WINDOW_CLOSED, http: 409, condition: "Preorder creation while fair is not SCHEDULED or STOCKING" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Organizer
    description: "Book-fair company operator; runs fairs, negotiations, inventory, reconciliation, returns, payouts, promotion"
    identity: opaque
    exclusive_operations:
      - "POST /parties, POST /fairs, fair lifecycle actions (schedule, open-stocking, open, close-sales, settle, cancel)"
      - "POST /venue-slots, POST /venue-slots/{id}/release"
      - "POST /consignment-agreements, agreement counter (organizer side)"
      - "POST /stock-lines and commit/deliver/damage"
      - "POST /author-bookings, booking counter (organizer side), book-travel, settle"
      - "POST /signing-sessions, session reconcile/cancel"
      - "Reconciliation counts, submit-review, approve, submit"
      - "POST /return-authorizations, ship, confirm-credit"
      - "POST /profit-share-payouts, calculate, recalculate, pay"
      - "POST /media-blasts, submit, publish"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET list/read endpoints"
      - "agreement accept/decline (organizer side when publisher holds the offer)"
      - "booking accept/decline/cancel (organizer side)"
  - name: SchoolCoordinator
    description: "School liaison; confirms venue blocks, approves promotion, chooses payout mode"
    identity: "entity_backed:Party"
    exclusive_operations:
      - "POST /venue-slots/{id}/confirm (scoped: party == fair.school_party_id)"
      - "POST /media-blasts/{id}/approve and /reject (scoped)"
      - "POST /profit-share-payouts/{id}/approve (scoped; selects CASH or SCRIP)"
    shared_operations: ["All GET list/read endpoints"]
  - name: PublisherRep
    description: "Publisher representative; negotiates consignment terms, rules on returns, accepts/disputes reconciliation"
    identity: "entity_backed:Party"
    exclusive_operations:
      - "agreement counter (publisher side), accept/decline (scoped: party == agreement.publisher_party_id)"
      - "POST /return-authorizations/{id}/approve and /reject (scoped)"
      - "POST /reconciliations/{id}/accept and /dispute (scoped)"
    shared_operations: ["All GET list/read endpoints"]
  - name: AuthorRep
    description: "Author's representative; negotiates booking terms, may cancel the engagement"
    identity: "entity_backed:Party"
    exclusive_operations:
      - "booking counter (author side), accept/decline (scoped: party == booking.author_party_id)"
      - "POST /author-bookings/{id}/cancel (scoped)"
    shared_operations: ["All GET list/read endpoints"]
  - name: Cashier
    description: "Fair register operator; preorders and sales"
    identity: opaque
    exclusive_operations:
      - "POST /preorders, fulfill, cancel"
      - "POST /sales, tender, void"
    shared_operations: ["All GET list/read endpoints"]
  - name: LineStaff
    description: "Signing-line staff; issues/admits/redeems/voids tickets and runs session open/close"
    identity: opaque
    exclusive_operations:
      - "POST /signing-tickets, admit, redeem, void"
      - "POST /signing-sessions/{id}/open-signing and /close-signing"
    shared_operations: ["All GET list/read endpoints"]
