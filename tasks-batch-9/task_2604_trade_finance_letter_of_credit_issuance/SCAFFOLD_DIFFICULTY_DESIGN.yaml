  # =======================================================================
  # RULE 6 - boundary_precision_check
  # =======================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: facility_headroom_exact_equality_admits_issuance
        grounds:
          - validations[priority=26][category=business_fiscal]
          - calculations.issuance_charges
          - calculations.facility_exposure_ledger
          - entities.CreditFacility.fields.available_cents
          - errors.ERR_FACILITY_LIMIT_EXCEEDED
          - state_machines.DocumentaryCredit.APPROVED_to_ISSUED
        distinguishing_aspect: |
          The boundary metric here is an INTEGER-CENT MONETARY QUANTITY
          (chargeable_utilisation_cents versus CreditFacility.available_cents) probed on
          POST /credits/{id}/issue: 5025000 == 5025000 is admitted and 5025000 versus
          5024999 is refused, so the comparison must be `>` and never `>=`, and a single
          cent of headroom decides the outcome.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One applicant with TWO USD facilities: FA of limit_cents 5025000 and FB of limit_cents 5024999, both collateral_required_pct 0."
            - "Two identical APPROVED SIGHT_PAYMENT credits of amount_cents 5000000, tolerance_pct 0, expiry_date 2026-10-05, latest_shipment_date 2026-09-15: CA on FA and CB on FB."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
