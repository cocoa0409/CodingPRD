  # =========================================================================
  # Rule 5: Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_program_activate
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_PROGRAM_NOT_BOUND]
          - errors[ERR_SOLVENCY_BREACH]
        distinguishing_aspect: |
          Error-category pair: state (priority 5) vs business_safety (priority 7).
          When a program is in QUOTED (not BOUND) AND the captive has a solvency breach,
          the state error (ERR_PROGRAM_NOT_BOUND) wins because it has higher priority (5 < 7).
        test_recipe:
          setup:
            - "CaptiveEntity ACTIVE with solvency_status == BREACH"
            - "Program in QUOTED status (not BOUND)"
          setup_api_calls:
            - call: "POST /api/captives"
              payload: { captive_name: "Test Captive I", domicile_jurisdiction: "VERMONT", formation_date: "2026-01-15T00:00:00Z", capitalization_amount: 500000 }
