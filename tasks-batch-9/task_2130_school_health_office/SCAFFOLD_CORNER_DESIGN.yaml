      - name: manual_void_at_exactly_1440_minutes_is_refused
        claim_type: temporal_validation
        grounds:
          - validations[priority=37]
          - errors[ERR_VOID_WINDOW_CLOSED]
          - entities.AdministrationRecord.fields.prepared_at
        distinguishing_aspect: "The manual-void window is half-open: the rule is clock < prepared_at + 1440 minutes, so a void attempted at exactly prepared_at + 1440 (2026-08-04T09:00:00Z for a record prepared at 2026-08-03T09:00:00Z) is refused with ERR_VOID_WINDOW_CLOSED and the record stays PREPARED."
        test_recipe:
          setup:
            - "School YUCCA53 with an RN on an ACTIVE Monday block, one ENROLLED student and one AVAILABLE student-specific ALBUTEROL lot of 6 units."
            - "One SCHEDULED ALBUTEROL order at (CONSENT_GRANTED, VERIFIED) with valid_until 2027-06-30 so no expiry fires."
            - "Clock at 2026-08-03T09:00:00Z: encounter IN_ASSESSMENT with one PREPARED record for 1 unit. Clock then advanced to exactly 2026-08-04T09:00:00Z."
