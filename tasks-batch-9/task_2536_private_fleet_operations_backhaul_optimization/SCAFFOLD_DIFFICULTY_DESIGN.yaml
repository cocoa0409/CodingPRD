          setup:
            - "Canonical fixture F1: store S-1001 (600 cases/hour, docks open 04:00-22:00, 2 doors), domicile DOM-CHI, plan MILE-A, driver D-77, tractor TR-501 (odometer 124800, PM interval 25000, last service 100000) and trailer VAN-900 (1800 cases)."
