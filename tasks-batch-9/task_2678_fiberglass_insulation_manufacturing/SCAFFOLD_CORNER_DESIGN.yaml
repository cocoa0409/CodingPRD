              captures: { b4: "$.data.id" }
          assert:
            - "the melt charged both batches: total_charge_kg == 10000.00 (9200 / 0.92), allowed_cullet_kg == 3000.00 (floor2 of 10000.00 * 0.30), cullet_charged_kg == 2800.00, virgin_batch_kg == 7200.00, cullet_fraction == 0.2800"
            - "Plant.${plant_id}.cullet_fraction_ytd == 0.2800 and melt_posture == RESTRICTED with posture_reason == CULLET_FRACTION_AT_RESTRICT_LEVEL — the trip is at EQUALITY, 0.2800 >= 0.28"
