              as: ComplianceOfficer
              as_user_id: "compliance-B"
          assert:
            - "the note-less ATTEST returns 422 and ${err_id} == \"ERR_REMEDIATION_NOTE_REQUIRED\""
            - "SurveyPacket.${pkt_id}.deficiency_flags == [\"F248_INSUFFICIENT_FREQUENCY\"] and provision_score == 0.0"
            - "after the refusal SurveyPacket.${pkt_id}.status == COMPILED with attested_by_user_id null"
            - "the second ATTEST returns 200, status == ATTESTED and attested_by_user_id == \"compliance-B\""
      - name: participation_record_unknown_id_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PARTICIPATION_RECORD_NOT_FOUND
          - validations.priority_5_path_id_not_found_map
        distinguishing_aspect: "The last remaining not-found code has no create endpoint of its own — a ParticipationRecord only exists as the product of an enrollment — so it is reached through the flat read and documentation routes keyed on record_id, and the same unknown id returns the same code on both verbs."
        test_recipe:
