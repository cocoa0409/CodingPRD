  - rule_id: resource_temporal_overlap
    instances:

      - name: cook_shift_half_open_interval_adjacency
        grounds:
          - validations[priority=9]
          - errors.ERR_SHIFT_OVERLAP
          - entities.ShiftAssignment.fields.shift_start
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) adjacency — an assignment
          starting exactly when another ends (12:00 == 12:00) is ALLOWED, while
          a true intersection (11:00-13:00 vs 08:00-12:00) is rejected with
          ERR_SHIFT_OVERLAP. Resource: Cook.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Restaurant; cook certified for [GRILL]; GRILL station."
            - "No assignments yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Kara Manager", certified_station_types: ["GRILL"] }
              as: KitchenManager
              as_user_id: "bootstrap-kitchen-manager"
              captures: { mgr_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Chris Cook", certified_station_types: ["GRILL"] }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { cook_id: $.data.id }
            - call: "POST /api/stations"
              payload: { restaurant_id: "${rest_id}", name: "Grill 1", station_type: "GRILL", rack_slot_capacity: 100 }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /api/shift-assignments"
              payload: { cook_id: "${cook_id}", station_id: "${st_id}", shift_start: "2026-09-02T08:00:00Z", shift_end: "2026-09-02T12:00:00Z" }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /api/shift-assignments"
              payload: { cook_id: "${cook_id}", station_id: "${st_id}", shift_start: "2026-09-02T12:00:00Z", shift_end: "2026-09-02T16:00:00Z" }
              as: KitchenManager
