          setup:
            - "Clock 2026-08-05T23:00:00Z; index 2026-07-01 at 480; brewer RDG is the ONLY brewer, so no brand ZZZ exists."
            - "Pool HB-50L with three kegs; agreement float_size_kegs 2 at 2200 activated 2026-08-01; one order for two kegs allocated and dispatched 2026-08-01, so K-0001 and K-0002 are both ISSUED_TO_BREWER."
            - "K-0001 is FILLed as RDG on 2026-08-03 and becomes the DISTRIBUTION probe; K-0002 stays ISSUED_TO_BREWER and becomes the FILL probe."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
