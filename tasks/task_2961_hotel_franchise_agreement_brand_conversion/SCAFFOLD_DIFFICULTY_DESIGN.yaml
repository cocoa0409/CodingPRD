  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_revision_cycle_resets_both_review_axes_twice
        grounds:
          - state_machines.Application.status.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.Application.status.REVISION_REQUESTED_to_UNDER_REVIEW
          - entities.Application.fields.revision_round
          - entities.Application.fields.financial_review_status
          - entities.Application.fields.impact_study_status
        distinguishing_aspect: |
          Entity: Application. The non-linearity is an unbounded CYCLE — UNDER_REVIEW →
          REVISION_REQUESTED → UNDER_REVIEW — whose only observable loop counter is revision_round,
          and whose re-entry is destructive: it drives two *other* dimensions backwards to
          NOT_STARTED and nulls seven snapshot fields. A forward-only implementation leaves
          financial_review_status == PASSED and the study FINAL after the second resubmit.
        test_recipe:
          setup:
            - "Brand SOLARIS with no existing units, so the impact study always scores 0.00 and never blocks the loop."
            - "A STRONG four-unit owner whose review passes on either basis."
            - "One application taken all the way to a PASSED financial review and a FINAL impact study, then sent back for revision."
