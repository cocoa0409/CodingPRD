  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: rto_studio_halfopen_overlap
        grounds:
          - validations[priority=12]
          - entities.StudioEvent.fields.start_utc
          - entities.StudioEvent.fields.end_utc
          - errors[ERR_STUDIO_TIME_CONFLICT]
        distinguishing_aspect: "Studio-room overlap uses HALF-OPEN [start,end) arithmetic with no buffer: an event 11:00-13:00 in the same studio collides with an existing 10:00-12:00 (ERR_STUDIO_TIME_CONFLICT), but an adjacent 12:00-14:00 (end==start) is allowed. Resource entity: Studio."
        test_recipe:
          setup:
            - "Studio with an existing non-CANCELLED event 2026-04-05T10:00-12:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/studios"
              payload: { name: "T1", room_capacity_seats: 10 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "First", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 10, price_cents_per_seat: 4500 }
              as: StudioManager
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "Overlap", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T11:00:00Z", end_utc: "2026-04-05T13:00:00Z", seats_capacity: 10, price_cents_per_seat: 4500 }
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "Overlapping event create returns 409 ERR_STUDIO_TIME_CONFLICT."
            - "An adjacent event 2026-04-05T12:00-14:00Z in the same studio (end==start) is accepted (201)."

      - name: rto_artist_buffered_gap
        grounds:
          - validations[priority=11]
          - entities.ArtistAssignment.fields.event_id
          - errors[ERR_ARTIST_DOUBLE_BOOKED]
        distinguishing_aspect: "Artist overlap uses a 30-MINUTE TRAVEL BUFFER (different interval semantics from the studio's zero-buffer half-open rule, and a different resource entity: Artist): the same artist assigned to two same-studio-free events 10:00-12:00 and 12:15-14:00 (15-min gap < 30) is rejected ERR_ARTIST_DOUBLE_BOOKED, whereas a 12:30 start (gap == 30) is allowed."
        test_recipe:
          setup:
            - "Artist already ASSIGNED to event A 2026-04-06T10:00-12:00Z in studio SA. Event B is 2026-04-06T12:15-14:00Z in a DIFFERENT studio SB (so no studio conflict, isolating the artist buffer)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/studios"
              payload: { name: "SA", room_capacity_seats: 10 }
              as: StudioManager
              captures: { sa: $.data.id }
            - call: "POST /studio-ops/studios"
              payload: { name: "SB", room_capacity_seats: 10 }
              as: StudioManager
              captures: { sb: $.data.id }
            - call: "POST /studio-ops/artists"
              payload: { full_name: "Ne", hourly_rate_cents: 0 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sa}", title: "A", event_type: "PUBLIC_CLASS", start_utc: "2026-04-06T10:00:00Z", end_utc: "2026-04-06T12:00:00Z", seats_capacity: 10, price_cents_per_seat: 4500 }
              as: StudioManager
              captures: { ea: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sb}", title: "B", event_type: "PUBLIC_CLASS", start_utc: "2026-04-06T12:15:00Z", end_utc: "2026-04-06T14:00:00Z", seats_capacity: 10, price_cents_per_seat: 4500 }
              as: StudioManager
              captures: { eb: $.data.id }
            - call: "POST /studio-ops/assignments"
              payload: { event_id: "${ea}", artist_id: "${aid}" }
              as: StudioManager
          trigger:
            - call: "POST /studio-ops/assignments"
              payload: { event_id: "${eb}", artist_id: "${aid}" }
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "Assigning the artist to event B (15-min gap) returns 409 ERR_ARTIST_DOUBLE_BOOKED."
            - "If event B instead started 2026-04-06T12:30:00Z (gap == 30 min) the assignment would be accepted (201)."

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: ci_seat_conservation_on_cancel
        grounds:
          - calculations.event_seat_ledger
          - state_machines.Reservation.HELD_to_CANCELLED
          - entities.StudioEvent.fields.seats_capacity
          - entities.StudioEvent.fields.seats_available
        distinguishing_aspect: "Conserved quantity = SEATS. Invariant seats_capacity == seats_available + seats_reserved + walk_in_seats holds before booking, after booking, and after the compensating cancel (back to the original seats_available). No seat drift."
        test_recipe:
          setup:
            - "OPEN event capacity 10; a 3-seat reservation then cancelled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/studios"
              payload: { name: "C1", room_capacity_seats: 10 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/artists"
              payload: { full_name: "Op", hourly_rate_cents: 0 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "C1 Class", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 10, price_cents_per_seat: 4500 }
              as: StudioManager
              captures: { eid: $.data.id }
            - call: "POST /studio-ops/assignments"
              payload: { event_id: "${eid}", artist_id: "${aid}" }
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/schedule"
              payload: {}
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/open"
              payload: {}
              as: StudioManager
              captures: { ev_v: $.data.version }
            - call: "POST /studio-ops/customers"
              payload: { email: "c1c@x.com", full_name: "C1C", birthdate: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cid: $.data.id }
            - call: "POST /studio-ops/reservations"
              payload: { event_id: "${eid}", customer_id: "${cid}", booking_mode: "PUBLIC", seats: 3, expected_event_version: "${ev_v}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /studio-ops/reservations/${rid}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cid}"
          assert:
            - "After booking: seats_reserved == 3, seats_available == 7, and capacity(10) == 7 + 3 + 0."
            - "After cancel: seats_reserved == 0, seats_available == 10, and capacity(10) == 10 + 0 + 0 (no seat drift)."

      - name: ci_gift_card_value_conservation
        grounds:
          - calculations.gift_card_payment_waterfall
          - state_machines.Reservation.payment_status.UNPAID_to_PAID
          - entities.GiftCard.fields.balance_cents
          - entities.GiftCard.fields.redeemed_cents
        distinguishing_aspect: "Conserved quantity = MONEY (gift-card value), a different conserved type from seats. Invariant GiftCard.balance_cents + GiftCard.redeemed_cents == issued_value_cents (10000) holds after a 6000 redemption (balance 4000, redeemed 6000). No value created or destroyed by the waterfall."
        test_recipe:
          setup:
            - "Gift card issued 10000. Reservation total 13500 (3 seats @4500) paid with gift card + card remainder (gift card draws 10000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/studios"
              payload: { name: "C2", room_capacity_seats: 10 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/artists"
              payload: { full_name: "Pa", hourly_rate_cents: 0 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "C2 Class", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 10, price_cents_per_seat: 4500 }
              as: StudioManager
              captures: { eid: $.data.id }
            - call: "POST /studio-ops/assignments"
              payload: { event_id: "${eid}", artist_id: "${aid}" }
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/schedule"
              payload: {}
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/open"
              payload: {}
              as: StudioManager
              captures: { ev_v: $.data.version }
            - call: "POST /studio-ops/gift-cards"
              payload: { code: "GC-CONS", issued_value_cents: 10000 }
              as: StudioManager
              captures: { gc: $.data.id }
            - call: "POST /studio-ops/customers"
              payload: { email: "c2c@x.com", full_name: "C2C", birthdate: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cid: $.data.id }
            - call: "POST /studio-ops/reservations"
              payload: { event_id: "${eid}", customer_id: "${cid}", booking_mode: "PUBLIC", seats: 3, expected_event_version: "${ev_v}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /studio-ops/reservations/${rid}/pay"
              payload: { gift_card_ids: ["${gc}"], use_studio_credit: false }
              as: Customer
              as_user_id: "${cid}"
          assert:
            - "Gift card draw == min(issued 10000, total 13500) == 10000, so GiftCard.${gc}.balance_cents == 0 and redeemed_cents == 10000 and status == DEPLETED."
            - "Conservation: GiftCard.${gc}.balance_cents + redeemed_cents == 10000 == issued_value_cents (no value drift)."
            - "A CARD Payment covers the remaining 3500; Reservation.${rid}.amount_paid_cents == 13500."
