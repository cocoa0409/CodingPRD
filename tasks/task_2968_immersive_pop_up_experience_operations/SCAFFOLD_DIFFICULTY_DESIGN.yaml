            - "ExperienceRun.${run_id}.clearance_status == UNCLEARED after the approval (the staffing half of the gate is unmet)"

      - name: run_parallel_dimensions_and_two_way_suspension_lift_branch
        grounds:
          - state_machines.ExperienceRun.clearance_status.CLEARED_to_SUSPENDED
          - state_machines.ExperienceRun.clearance_status.SUSPENDED_to_UNCLEARED
          - state_machines.ExperienceRun.clearance_status.UNCLEARED_to_CLEARED
          - state_machines.StaffMember.CLEARED_to_SUSPENDED
          - state_machines.StaffMember.SUSPENDED_to_CLEARED
          - entities.ExperienceRun.fields.run_status
          - entities.ExperienceRun.fields.clearance_status
          - entities.ExperienceRun.fields.suspending_inspection_id
          - errors[ERR_SOD_SUSPENSION_LIFT_SAME_USER]
        distinguishing_aspect: |
          ExperienceRun carries two independent state dimensions on one row: run_status stays OPEN
          for the whole scenario while clearance_status walks CLEARED -> SUSPENDED -> UNCLEARED ->
          CLEARED, and the lift transition itself forks two ways on the same call - the identical
          POST /experience-runs/{runId}/lift-suspension lands on UNCLEARED when the approval plus
          staffing gate is unmet and on CLEARED when it holds. Suspending a staff member while the
          run is already SUSPENDED leaves clearance_status untouched, which a single-dimension
          reading of the machine cannot express.
