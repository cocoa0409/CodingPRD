      - name: issuer_eligibility_is_a_haircut_table_membership_test_decided_before_tenor
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INELIGIBLE_ISSUER]
          - validations.priority_20_ERR_INELIGIBLE_ISSUER
          - calculations.eligible_credit_support
          - endpoints.POST_/ppa/credit-support/{id}/post
          - entities.CreditSupportInstrument.fields.issuer_rating
        distinguishing_aspect: |
          issuer_rating accepts eight enum values but the LC haircut table has only five
          rows, so CCC, B and NR are STORABLE yet unpostable - the refusal is a missing
          table key at priority 20, not a schema violation at priority 3. Because
          eligibility outranks tenor, a CCC letter that is ALSO 14 days from expiry
          reports ERR_INELIGIBLE_ISSUER rather than ERR_INSTRUMENT_TENOR_TOO_SHORT, while
          the same 14-day expiry on cash posts happily because neither limb consults it.
          The parent-guarantee limb fails on identity rather than quality: the guarantor
          named is a perfectly solvent offtaker, but it is not the anchor's declared
          parent_guarantor_offtaker_id (which is null), so no guarantor could ever
          satisfy this deal.
