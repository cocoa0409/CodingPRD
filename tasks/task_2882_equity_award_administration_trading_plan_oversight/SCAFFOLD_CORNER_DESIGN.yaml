              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { g_id: $.data.id }
            - call: "POST /grants/${g_id}/vesting-tranches"
              payload: { tranche_index: 1, vest_type: "TIME", scheduled_vest_date: "2027-01-05", target_shares: 1000 }
