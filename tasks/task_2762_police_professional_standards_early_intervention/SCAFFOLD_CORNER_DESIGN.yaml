              as: DeputyChief
              captures: { e_unknown_role: "$.data.error_id" }
            - call: "POST /officers/${vance_id}/activity-events"
              payload: { event_type: "PURSUIT", severity_code: "NA", occurred_at: "2026-07-25T00:00:00Z", source_reference: "PUR-10" }
              as: Supervisor
              as_user_id: "${sup_id}"
          assert:
            - "call 1: HTTP 403 with ${e_sup} == ERR_UNAUTHORIZED; opening an investigation is exclusive to IACommander and no second Investigation row was created"
            - "call 2: HTTP 403 with ${e_cmdr} == ERR_UNAUTHORIZED, not ERR_NOT_ASSIGNED_INVESTIGATOR and not ERR_INVESTIGATION_STATE_INVALID; the role rule at priority 2 answers before both"
            - "call 3: HTTP 403 with ${e_admin} == ERR_UNAUTHORIZED, not ERR_COMPLAINT_NOT_PURGEABLE; SystemAdmin manages reference data and the clock but never records"
            - "call 4: HTTP 403 with ${e_rep} == ERR_UNAUTHORIZED, not ERR_APPEAL_NOT_FOUND - the role check at priority 2 precedes path existence at priority 3, so an unknown id does not leak through a role failure"
            - "call 5: HTTP 403 with ${e_read} == ERR_UNAUTHORIZED; hearing-room reads are the one read family RecordsCustodian is not granted"
            - "call 6: HTTP 401 with ${e_no_role} == ERR_UNAUTHENTICATED when no X-User-Role header is sent at all"
            - "call 7: HTTP 401 with ${e_no_user} == ERR_UNAUTHENTICATED when an entity-backed role sends no X-User-ID header, even though IACommander is the correct role for a disposition"
            - "call 8: HTTP 403 with ${e_unknown_role} == ERR_UNAUTHORIZED for a syntactically present but undeclared role, and Investigation.${i1_id}.version is unchanged, so the version was not consumed"
            - "call 9: HTTP 201 - the same Supervisor identity that was refused four other operations performs its own exclusive operation, proving the refusals are about the role and not a blanket denial"

