          assert:
            - "Baseline: TalkpathRequest.${tp_npt1}.outcome == GRANTED with available_talkpaths_at_decision == 1 and Site.${site_npt_id}.busy_talkpaths == 1"
            - "trigger[0] returns HTTP 409 with data.error_id == ERR_NO_PREEMPTABLE_TALKPATH"
            - "TalkpathRequest.${tp_npt1}.outcome stays GRANTED with released_at == null and preempted_request_id == null"
            - "Site.${site_npt_id}.busy_talkpaths == 1, granted_request_count == 1, busied_request_count == 0 and grade_of_service_pct == 100.0"
