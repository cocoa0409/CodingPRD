      - name: pour_cost_run_returns_recomputed_posture_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model[immediate]
        distinguishing_aspect: >-
          The pour-cost run is the one endpoint whose response is a different entity (Venue) from the
          rows it derives, so same-response visibility of the recomputed variance, posture and the newly
          opened investigation is already asserted where the two variance variants are compared.
        excluded_because:
          difficulty_instance: actual_vs_theoretical_pour_cost_variance
          rationale: >-
            That instance asserts that the POST /venues/{venue_id}/pour-cost-runs response body itself
            carries actual_pour_cost_pct, theoretical_pour_cost_pct, last_variance_pct and the updated
            program_posture, and that the VarianceInvestigation opened by the same call is already
            listable — which is the whole content of the `immediate` claim for this endpoint.
