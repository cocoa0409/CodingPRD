  - rule_id: boundary_precision_check
    instances:
      - name: warrant_score_exactly_at_threshold_is_warranted
        grounds:
          - calculations.warrant_score
          - calculations.warrant_determination
          - entities.WarrantStudy.fields.warrant_score
          - entities.WarrantStudy.fields.determination
          - state_machines.WarrantStudy.COUNTING_to_ANALYZED
        distinguishing_aspect: |
          Metric: warrant_score against WARRANT_THRESHOLD on the analyze endpoint.
          With 100 children, 40 adequate gaps, 3300 vehicles and a 25 mph limit
          (speed multiplier 1.00, zero crash points) the GAP_ADEQUACY variant lands on
          exactly 60.00, which the >= comparison must resolve to WARRANTED. The
          control intersection differs only in vehicle count (3200) and scores 59.00,
          one full point below, so a > comparison flips the primary case to
          NOT_WARRANTED and is immediately visible.
        test_recipe:
          setup:
            - "School 2026-08-24 -> 2027-06-11 with two UNCONTROLLED 25 mph intersections and no crash records anywhere, so crash_severity_points is 0 on both."
