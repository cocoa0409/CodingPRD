  - section: calculations
    instances:
      - name: fine_accrual_deadline_boundary
        claim_type: correct_result
        grounds:
          - "calculations.fine_accrual"
          - "entities.CodeViolation.fields.accrued_fine_cents"
        distinguishing_aspect: "Accrual is 0 on the deadline date itself, equals one daily fine the day after, and clamps at the cap (min(days*1000, 5000))."
        test_recipe:
          setup: ["Violation with cure_deadline 2026-08-10, daily_fine 1000, cap 5000; clock moves 08-10 -> 08-11 -> 08-16"]
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer AE", code: "SVAE" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "14 Test Pass", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 5000, heating_system: "NONE", fixture_count: 4 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/code-violations", payload: { property_id: "${p}", citation_number: "CV-400", violation_class: "MINOR", daily_fine_cents: 1000, fine_cap_cents: 5000, cure_deadline: "2026-08-10" }, as: VendorAdmin, captures: { cv: $.data.id } }
          trigger:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: VendorAdmin }
            - { call: "GET /preservation/code-violations/${cv}", as: VendorAdmin, captures: { fine_d0: $.data.accrued_fine_cents } }
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: VendorAdmin }
            - { call: "GET /preservation/code-violations/${cv}", as: VendorAdmin, captures: { fine_d1: $.data.accrued_fine_cents } }
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: VendorAdmin }
            - { call: "GET /preservation/code-violations/${cv}", as: VendorAdmin, captures: { fine_d6: $.data.accrued_fine_cents } }
          assert:
            - "fine_d0 == 0 — deadline date itself accrues nothing"
            - "fine_d1 == 1000 — one day over"
            - "fine_d6 == 5000 — six days would be 6000 but the cap binds"

      - name: hold_release_eligible_boundary
        claim_type: constants_applied
        grounds:
          - "calculations.hold_period"
          - "state_machines.PersonalPropertyDisposition.IN_HOLD_to_RELEASE_ELIGIBLE"
        distinguishing_aspect: "The sweep releases a disposition exactly when clock_date >= hold_until_date (inclusive): 2026-08-30 keeps IN_HOLD, 2026-08-31 releases."
        test_recipe:
          setup: ["OH disposition documented 2026-08-01 (hold_until 2026-08-31)"]
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer AF", code: "SVAF" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/crews", payload: { name: "Crew 25", crew_code: "CR25" }, as: VendorAdmin, captures: { cr: $.data.id } }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "16 Test Row", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 5000, heating_system: "NONE", fixture_count: 4 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/personal-property-dispositions", payload: { property_id: "${p}", description: "tools", valuation_cents: 8000 }, as: FieldCrew, as_user_id: "${cr}", captures: { d: $.data.id } }
          trigger:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-30T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/ops/run-daily-sweep", payload: {}, as: VendorAdmin }
            - { call: "GET /preservation/personal-property-dispositions/${d}", as: VendorAdmin, captures: { st_early: $.data.status } }
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/ops/run-daily-sweep", payload: {}, as: VendorAdmin, captures: { rel: "$.data.released_disposition_ids[0]" } }
            - { call: "GET /preservation/personal-property-dispositions/${d}", as: VendorAdmin, captures: { st_on: $.data.status } }
          assert:
            - "st_early == IN_HOLD — one day before hold_until"
            - "st_on == RELEASE_ELIGIBLE and rel == ${d} — inclusive >= boundary"

      - name: recurring_interval_exact_boundary
        claim_type: constants_applied
        grounds:
          - "calculations.recurring_generation"
        distinguishing_aspect: "Generation fires when elapsed days == interval_days exactly (>=): no order at day 13, one at day 14."
        test_recipe:
          setup: ["ACTIVE plan interval 14, season 07-01..09-30, max 5; first sweep 2026-08-01 generates g1"]
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer AG", code: "SVAG" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/investor-allowables", payload: { investor_type: "FHA", item_code: "GRASS_CUT", max_per_occurrence_cents: 3000, max_occurrences_per_calendar_year: 20, aggregate_cap_cents_per_property_year: 60000, requires_bid_over_cents: 999999, effective_from: "2026-01-01" }, as: VendorAdmin }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "18 Test Glen", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 5000, heating_system: "NONE", fixture_count: 4 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/recurring-plans", payload: { property_id: "${p}", service_type: "GRASS_CUT", season_start_md: "07-01", season_end_md: "09-30", interval_days: 14, max_per_season: 5 }, as: VendorAdmin, captures: { plan: $.data.id } }
            - { call: "POST /preservation/ops/run-daily-sweep", payload: {}, as: VendorAdmin, captures: { g1: "$.data.generated_work_order_ids[0]" } }
          trigger:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/ops/run-daily-sweep", payload: {}, as: VendorAdmin, captures: { gen_13: "$.data.generated_work_order_ids" } }
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/ops/run-daily-sweep", payload: {}, as: VendorAdmin, captures: { g2: "$.data.generated_work_order_ids[0]" } }
            - { call: "GET /preservation/recurring-plans/${plan}", as: VendorAdmin, captures: { gen_n: $.data.generated_this_season } }
          assert:
            - "g1 is non-null — first generation has no interval gate"
            - "gen_13 == [] — 13 elapsed days < interval 14"
            - "g2 is non-null and gen_n == 2 — 14 >= 14 fires"

      - name: dewinterization_half_base_quote
        claim_type: correct_result
        grounds:
          - "calculations.winterization_quote"
        distinguishing_aspect: "DEWINTERIZATION uses base//2 and never the seasonal multiplier: fixtures 8, no pool, FORCED_AIR -> (15000 + 9600) / 2 = 12300 even in January."
        test_recipe:
          setup: ["Property fixture_count 8, has_pool false, FORCED_AIR; clock in heating season 2026-01-15"]
          setup_api_calls:
