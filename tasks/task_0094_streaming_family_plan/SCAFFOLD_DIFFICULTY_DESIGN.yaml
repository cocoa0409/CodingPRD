      - name: curfew_window_wraps_midnight
        grounds:
          - validations[priority=9]
          - entities.ParentalControl.fields.curfew_start_min
          - entities.ParentalControl.fields.curfew_end_min
          - errors[ERR_CURFEW_BLOCKED]
        distinguishing_aspect: "PROFILE-resource overlap with WRAP-AROUND-MIDNIGHT point-in-window semantics (different interval geometry than the device span): curfew_start=1320 (22:00), curfew_end=360 (06:00) means the window is [1320,1440)U[0,360); a 02:00 start (minute 120) is inside the wrapped window and is ERR_CURFEW_BLOCKED."
        test_recipe:
