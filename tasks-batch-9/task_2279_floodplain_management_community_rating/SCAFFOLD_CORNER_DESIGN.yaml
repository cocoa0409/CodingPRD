            - "no PostDisasterInspection exists for ${struct_x_id}"
            - "every created PostDisasterInspection has status SCHEDULED, declaration_code 'DR-4801' and deadline_at '2026-08-14T00:00:00Z'"

      - name: compliance_summary_reports_the_probation_tier_it_computes
        claim_type: computed_read
        grounds:
          - endpoints."GET /floodplain/communities/{communityId}/compliance-summary"
          - calculations.sanction_risk_and_posture
        distinguishing_aspect: |
          A MINOR (2) plus a CRITICAL (12) violation sum to 14, which clears
          PROBATION_THRESHOLD_POINTS 10 without reaching SUSPENSION 25, and with no VERIFIED
          A510 package a510_credit_applied stays 0 — the computed read must echo the stored
          posture rather than recomputing a different tier.
        test_recipe:
          setup:
            - "Canonical base fixture; one MINOR and one CRITICAL violation OPEN against the parcel."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/violations"
              payload: { property_id: "${prop_id}", violation_type: "MISSING_CERTIFICATE", severity: "MINOR" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { viol_minor_id: $.data.id }
            - call: "POST /floodplain/violations"
              payload: { property_id: "${prop_id}", violation_type: "NO_PERMIT", severity: "CRITICAL" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { viol_critical_id: $.data.id }
          trigger:
            - call: "GET /floodplain/communities/${comm_id}/compliance-summary"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 200"
            - "data.sanction_risk_points == 14"
            - "data.compliance_posture == 'ON_PROBATION'"
            - "data.counted_violation_count == 2"
            - "data.defaulted_order_count == 0"
            - "data.a510_credit_applied == 0"
            - "data.crs_class == 10"
            - "data.freeboard_ft == 1.5"
            - "data.cumulative_period_years == 10"
            - "Community.${comm_id}.compliance_posture == ON_PROBATION"

      - name: improvement_summary_reports_the_window_bounds_and_both_ratios
        claim_type: computed_read
        grounds:
          - endpoints."GET /floodplain/structures/{structureId}/improvement-summary"
          - calculations.structure_improvement_aggregates
          - calculations.substantial_ratio
        distinguishing_aspect: |
          The summary exposes the anchored closed window itself: with records on 2019-06-01
          (60000) and 2026-06-01 (45000) and a 10-year look-back the bounds are
          2016-06-01..2026-06-01, counted_record_count is 2, and the two methods disagree
          (cumulative 52.50 versus single_event 22.50) inside one response body.
        test_recipe:
          setup:
            - "Canonical base fixture (market_value_usd 200000, cumulative_period_years 10)."
            - "IMPROVEMENT records of 60000 on 2019-06-01 and 45000 on 2026-06-01."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
