              as_user_id: "${p4}"
            - call: "POST /fundraising/outcome-reports/${rep2}/site-visit"
              payload: { site_visit_window_start: "2026-08-17", site_visit_window_end: "2026-08-20" }
              as: VolunteerPanelist
