            - "data.error_id == \"ERR_MILESTONE_NOT_FOUND\""
            - "GET /milestones/ms-nope/time-logs is likewise HTTP 404 with ERR_MILESTONE_NOT_FOUND"
      - name: endpoint_engagement_agreements_empty_before_first_issue
        claim_type: standard_crud
