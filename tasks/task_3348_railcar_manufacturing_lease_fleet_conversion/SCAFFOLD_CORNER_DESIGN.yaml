    distinguishing_aspect: Completing shop work cascades three levels in one request — RetrofitWorkOrder
      to COMPLETED, the car back to HELD with its built_date restated to 2026-09-20 and life end pushed
      to 2051-09-20, and RetrofitProgram.program_cost_cents to the 1865000-cent literal — and a second
      completion re-applies none of it.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Car type CT-RW-1 (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-RW)
        with WHEELSET WS-RW-1 and CASTING CS-RW-1 at qty_per_car 1, both stocked to 10; coating CO-RW-1
        at unit_cost_cents 5000 is the mandate's kit.
      - RETAINED order of 1 car under contract LC-RW-1 is reserved, released, changed over on LINE-RW-L1
        for [2026-09-02, 2026-09-03) and completed on 2026-09-04, so the car starts at built_date 2026-09-04
        and regulatory_life_end_date 2051-09-04.
      - Mandate MAND-RW-1 (10 shop days per car, kit CO-RW-1) covers CT-RW-1; one work order occupies
        SL-RW-1 for [2026-09-10, 2026-09-20) consuming 3 kit units, which puts the car UNDER_REPAIR before
        the program is started.
