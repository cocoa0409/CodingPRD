# =============================================================================
# Recreational Adult Sports League — Scaffold (§1.0–§1.7)
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  275. Recreational Adult Sports League: team/free-agent registration,
  division/skill tier, schedule & venue assignment, referee/scorekeeping,
  standings & playoffs, forfeit/reschedule, fee & refund, sportsmanship/conduct

domain_name: recreational-adult-sports-league
api_prefix: ""
# Flat/hybrid topology: multiple top-level resource collections (/seasons,
# /divisions, /teams, /games, /players, /venues, /referees, /conduct-reports,
# /referee-assignments) live at the root, joined by FKs and a RosterEntry
# junction. There is no single owning resource path, so api_prefix is empty.

# =============================================================================
# Complexity Profile (§0.1–§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  # Season -> Division -> Team tree, with flat cross-cutting Game / Venue /
  # Referee / RefereeAssignment / Payment / ConductReport peers joined by FKs,
  # and a RosterEntry junction realizing Team <-> Player many-to-many.

  state_machine_shape: parallel
  # Game carries two independent dimensions: schedule_status (SCHEDULED /
  # RESCHEDULE_REQUESTED / FORFEITED / PLAYED / CANCELLED) and score_status
  # (PENDING / SUBMITTED / CONFIRMED / DISPUTED). Season registration_status
  # is a posture-like gate; Team / ConductReport carry cyclic + branching
  # machines.

  relationship_patterns:
    - one_to_many       # Season->Division, Division->Team, Game->RefereeAssignment
    - many_to_many      # Team<->Player via RosterEntry
    - cross_aggregate   # Game references two Teams + a Venue across the tree

  role_model: peer_roles
  # LeagueAdmin owns scheduling/divisions/refunds; TeamCaptain owns own team's
  # registration/roster/reschedule/score-submit; Referee owns own assignments
  # and score confirmation; ConductOfficer owns conduct adjudication.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID identity, no prefix" }
      - { name: name, type: string, source: input, description: "Season label, e.g. 'Fall 2026 Coed Soccer'" }
      - { name: sport, type: enum, source: input, description: "SOCCER | BASKETBALL | SOFTBALL | VOLLEYBALL" }
      - { name: registration_opens_at, type: datetime, source: input, description: "ISO8601 UTC; registration window start" }
      - { name: registration_closes_at, type: datetime, source: input, description: "ISO8601 UTC; registration window end; must be > registration_opens_at" }
      - { name: registration_status, type: enum, source: computed, description: "DRAFT | OPEN | CLOSED | SCHEDULED | IN_PLAY | PLAYOFFS | COMPLETE; posture gate over child ops" }
      - { name: refund_full_cutoff_at, type: datetime, source: input, description: "ISO8601 UTC; on/before this instant a team withdrawal earns a full refund" }
      - { name: refund_partial_pct, type: integer, source: input, description: "Integer percent (0-100) refunded for withdrawals after the full cutoff but before first game", default: 50 }
      - { name: clock_now, type: datetime, source: system, description: "Server clock used for window/refund decisions; advanced only via /_clock/set_current_utc" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO8601 UTC; refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 every mutation" }

  - name: Division
    parent: Season
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID identity" }
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; owning season" }
      - { name: name, type: string, source: input, description: "Division label, e.g. 'Coed B'" }
      - { name: skill_tier, type: enum, source: input, description: "REC | INTERMEDIATE | COMPETITIVE" }
      - { name: min_roster_size, type: integer, source: input, description: "Minimum confirmed roster players for a team to be CONFIRMED", constraints: ">= 1" }
      - { name: max_roster_size, type: integer, source: input, description: "Maximum confirmed roster players per team", constraints: ">= min_roster_size" }
      - { name: team_capacity, type: integer, source: input, description: "Maximum number of CONFIRMED teams the division accepts", constraints: ">= 2" }
      - { name: registration_fee_cents, type: integer, source: input, description: "Per-team registration fee in cents", constraints: ">= 0" }
      - { name: confirmed_team_count, type: integer, source: computed, description: "Count of Teams in this division with status IN {CONFIRMED, WITHDRAWN_LOCKED}" }
      - { name: standings_tiebreaker, type: enum, source: input, description: "HEAD_TO_HEAD | POINT_DIFFERENTIAL; pins which standings tiebreak chain applies", default: HEAD_TO_HEAD }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 every mutation" }

  - name: Team
    parent: Division
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID identity" }
      - { name: division_id, type: string, source: input, description: "FK -> Division.id; division the team registers into" }
      - { name: captain_player_id, type: string, source: input, description: "FK -> Player.id; the Player acting as TeamCaptain for this team" }
      - { name: name, type: string, source: input, description: "Team name; unique within division among non-CANCELLED teams" }
      - { name: status, type: enum, source: system, description: "PENDING | CONFIRMED | WAITLISTED | WITHDRAWN_LOCKED | WITHDRAWN | CANCELLED" }
      - { name: roster_size, type: integer, source: computed, description: "Count of RosterEntry rows for this team with state=ACTIVE" }
      - { name: fee_charged_cents, type: integer, source: computed, description: "Sum of Payment.amount_cents where kind=FEE and status=CAPTURED for this team" }
      - { name: refund_issued_cents, type: integer, source: computed, description: "Sum of Payment.amount_cents where kind=REFUND and status=CAPTURED for this team" }
      - { name: wins, type: integer, source: computed, description: "Count of CONFIRMED games this team won (see standings_points calc)" }
      - { name: losses, type: integer, source: computed, description: "Count of CONFIRMED games this team lost" }
      - { name: draws, type: integer, source: computed, description: "Count of CONFIRMED games that ended level" }
      - { name: points, type: integer, source: computed, description: "League points = wins*WIN_POINTS + draws*DRAW_POINTS (see standings_points calc)" }
      - { name: points_for, type: integer, source: computed, description: "Sum of own score across CONFIRMED games" }
      - { name: points_against, type: integer, source: computed, description: "Sum of opponent score across CONFIRMED games" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 every mutation" }

  - name: Player
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID identity" }
      - { name: full_name, type: string, source: input, description: "Player full name" }
      - { name: email, type: string, source: input, description: "Player email; globally unique among non-CANCELLED players" }
      - { name: is_free_agent, type: boolean, source: computed, description: "true when the player has zero ACTIVE RosterEntry rows", default: true }
      - { name: conduct_points, type: integer, source: computed, description: "Sum of points across ConductReports against this player with status IN {UPHELD, APPEALED}", default: 0 }
      - { name: suspension_status, type: enum, source: computed, description: "CLEAR | WARNED | SUSPENDED | BANNED; threshold-driven from conduct_points" }
      - { name: suspended_until_game_index, type: integer, source: computed, description: "Player ineligible for games whose round_index <= this value; 0 means not suspended", default: 0 }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 every mutation" }

  - name: RosterEntry
    parent: Team
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID identity" }
      - { name: team_id, type: string, source: input, description: "FK -> Team.id; team the player joins" }
      - { name: player_id, type: string, source: input, description: "FK -> Player.id; player joining the roster" }
      - { name: state, type: enum, source: system, description: "ACTIVE | RELEASED" }
      - { name: is_captain, type: boolean, source: computed, description: "true when player_id == Team.captain_player_id" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 every mutation" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID identity" }
      - { name: name, type: string, source: input, description: "Venue name" }
      - { name: field_count, type: integer, source: input, description: "Number of independently bookable fields/courts at this venue", constraints: ">= 1" }
      - { name: turnover_buffer_minutes, type: integer, source: input, description: "Minutes that must separate two games on the SAME field at this venue (adjacency buffer)", default: 30 }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 every mutation" }

  - name: Referee
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID identity" }
      - { name: full_name, type: string, source: input, description: "Referee full name" }
      - { name: certified_sports, type: array, source: input, description: "Array of sport enums this referee may officiate (subset of Season.sport values)" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 every mutation" }

  - name: Game
    parent: Division
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID identity" }
      - { name: division_id, type: string, source: input, description: "FK -> Division.id; division this game belongs to" }
      - { name: home_team_id, type: string, source: input, description: "FK -> Team.id; home team (must be CONFIRMED in division)" }
      - { name: away_team_id, type: string, source: input, description: "FK -> Team.id; away team (must be CONFIRMED in division, != home_team_id)" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; venue hosting the game" }
      - { name: field_index, type: integer, source: input, description: "Which field at the venue (1..Venue.field_count)" }
      - { name: round_index, type: integer, source: input, description: "Season round number (1-based); also the suspension comparison index", constraints: ">= 1" }
      - { name: stage, type: enum, source: input, description: "REGULAR | PLAYOFF", default: REGULAR }
      - { name: starts_at, type: datetime, source: input, description: "ISO8601 UTC; kickoff" }
      - { name: ends_at, type: datetime, source: input, description: "ISO8601 UTC; scheduled end; must be > starts_at" }
      - { name: schedule_status, type: enum, source: system, description: "SCHEDULED | RESCHEDULE_REQUESTED | FORFEITED | PLAYED | CANCELLED" }
      - { name: score_status, type: enum, source: system, description: "PENDING | SUBMITTED | CONFIRMED | DISPUTED" }
      - { name: home_score, type: integer, source: input, description: "Home team goals/points; null until submitted", default: null }
      - { name: away_score, type: integer, source: input, description: "Away team goals/points; null until submitted", default: null }
      - { name: forfeiting_team_id, type: string, source: system, description: "References the Team charged the forfeit (home_team_id or away_team_id); null unless FORFEITED. Discoverable via GET /games?forfeiting_team_id=." }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 every mutation" }

  - name: RefereeAssignment
    parent: Game
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID identity" }
      - { name: game_id, type: string, source: input, description: "FK -> Game.id; the game being officiated" }
      - { name: referee_id, type: string, source: input, description: "FK -> Referee.id; assigned referee" }
      - { name: role, type: enum, source: input, description: "HEAD | ASSISTANT | SCOREKEEPER", default: HEAD }
      - { name: state, type: enum, source: system, description: "ASSIGNED | RELEASED" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 every mutation" }

  - name: Payment
    parent: Team
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID identity; append-only ledger row" }
      - { name: team_id, type: string, source: input, description: "FK -> Team.id; team this ledger row belongs to" }
      - { name: kind, type: enum, source: system, description: "FEE | REFUND" }
      - { name: amount_cents, type: integer, source: system, description: "Positive cents; for REFUND this is the amount returned, never exceeding the captured fee" }
      - { name: status, type: enum, source: system, description: "CAPTURED (always, on creation); append-only, never mutated" }
      - { name: reason, type: enum, source: system, description: "REGISTRATION | FULL_WITHDRAWAL | PARTIAL_WITHDRAWAL | NO_REFUND_WITHDRAWAL | ADMIN_ADJUSTMENT" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC; chronological ledger order key" }

  - name: ConductReport
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID identity" }
      - { name: game_id, type: string, source: input, description: "FK -> Game.id; game during which the incident occurred" }
      - { name: player_id, type: string, source: input, description: "FK -> Player.id; cited player" }
      - { name: severity, type: enum, source: input, description: "WARNING | YELLOW | RED | ABUSE; maps to base point values" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | UPHELD | DISMISSED | APPEALED" }
      - { name: points, type: integer, source: computed, description: "Conduct points contributed while status IN {UPHELD, APPEALED}: base[severity]; 0 while FILED/UNDER_REVIEW/DISMISSED" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 every mutation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- Season: posture-like registration lifecycle (gates child ops) ---
  - entity: Season
    field: registration_status
    initial_state: DRAFT
    terminal_states: [COMPLETE]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /seasons/{season_id}/transition with target=OPEN"
        actor: LeagueAdmin
        preconditions:
          - "Season.clock_now >= Season.registration_opens_at"
          - "At least one Division exists under the season"
        side_effects:
          - "Teams may now register (Team create allowed only while OPEN)"

      - from: OPEN
        to: CLOSED
        trigger: "POST /seasons/{season_id}/transition with target=CLOSED"
        actor: LeagueAdmin
        preconditions:
          - "Season.clock_now >= Season.registration_closes_at OR LeagueAdmin force flag"
        side_effects:
          - "PENDING teams that meet min_roster_size are auto-promoted to CONFIRMED in created_at ASC order until division team_capacity is reached; the remainder become WAITLISTED"
          - "PENDING teams below min_roster_size become CANCELLED and a full REFUND Payment is written (cascade: team_withdraw_refund on each)"

      - from: CLOSED
        to: SCHEDULED
        trigger: "POST /seasons/{season_id}/transition with target=SCHEDULED"
        actor: LeagueAdmin
        preconditions:
          - "Every Division under the season has >= 2 CONFIRMED teams"
          - "Every REGULAR Game in the season has schedule_status=SCHEDULED with a venue, field_index, and a HEAD RefereeAssignment"
        side_effects:
          - "Games become immutable in venue/time except via reschedule flow"

      - from: SCHEDULED
        to: IN_PLAY
        trigger: "POST /seasons/{season_id}/transition with target=IN_PLAY"
        actor: LeagueAdmin
        preconditions:
          - "Season.clock_now >= earliest Game.starts_at in the season"
        side_effects: []

      - from: IN_PLAY
        to: PLAYOFFS
        trigger: "POST /seasons/{season_id}/transition with target=PLAYOFFS"
        actor: LeagueAdmin
        preconditions:
          - "Every REGULAR Game in every division has score_status=CONFIRMED or schedule_status=FORFEITED or schedule_status=CANCELLED"
        side_effects:
          - "For each Division, PLAYOFF Games are generated by seeding CONFIRMED teams via standings_seed calc (cascade: standings recompute, then bracket seeding)"

      - from: PLAYOFFS
        to: COMPLETE
        trigger: "POST /seasons/{season_id}/transition with target=COMPLETE"
        actor: LeagueAdmin
        preconditions:
          - "Every PLAYOFF Game has score_status=CONFIRMED or schedule_status=FORFEITED"
        side_effects: []

  # --- Team: registration lifecycle, branching with withdraw + cyclic waitlist promotion ---
  - entity: Team
    field: status
    initial_state: PENDING
    terminal_states: [WITHDRAWN, CANCELLED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /teams/{team_id}/confirm or system (season transition target=CLOSED auto-promote)"
        actor: "LeagueAdmin or system"
        preconditions:
          - "Team.roster_size >= Division.min_roster_size"
          - "Division.confirmed_team_count < Division.team_capacity"
          - "A FEE Payment of Division.registration_fee_cents with status=CAPTURED exists for the team (skip when fee is 0)"
        side_effects:
          - "Division.confirmed_team_count recomputed (+1)"

      - from: PENDING
        to: WAITLISTED
        trigger: "system (season transition target=CLOSED: capacity full but roster meets minimum)"
        actor: system
        preconditions:
          - "Division.confirmed_team_count == Division.team_capacity"
          - "Team.roster_size >= Division.min_roster_size"
        side_effects: []

      - from: WAITLISTED
        to: CONFIRMED
        trigger: "POST /teams/{team_id}/confirm (cyclic: a CONFIRMED team withdrawing frees a slot), or system (auto-promote on a CONFIRMED withdrawal)"
        actor: "LeagueAdmin or system"
        preconditions:
          - "Division.confirmed_team_count < Division.team_capacity"
          - "Season.registration_status IN {CLOSED, SCHEDULED}"
        side_effects:
          - "Division.confirmed_team_count recomputed (+1)"

      - from: [PENDING, WAITLISTED]
        to: CANCELLED
        trigger: "POST /teams/{team_id}/withdraw before any fee captured, or system (season transition target=CLOSED: below minimum)"
        actor: "TeamCaptain or LeagueAdmin or system"
        preconditions:
          - "No FEE Payment with status=CAPTURED exists for the team"
        side_effects:
          - "RosterEntry rows for the team -> RELEASED (cascade: each released player's is_free_agent recomputed)"

      - from: CONFIRMED
        to: WITHDRAWN_LOCKED
        trigger: "POST /teams/{team_id}/withdraw while Season.registration_status IN {CLOSED, SCHEDULED}"
        actor: "TeamCaptain or LeagueAdmin"
        preconditions:
          - "Season.registration_status IN {CLOSED, SCHEDULED}"
          - "No CONFIRMED-score Game involving this team exists yet"
        side_effects:
          - "team_withdraw_refund calc fires -> a REFUND Payment is written for the prorated amount"
          - "Division.confirmed_team_count recomputed (-1)"
          - "All SCHEDULED Games involving this team -> CANCELLED (cascade); each CANCELLED game releases its RefereeAssignments to RELEASED"
          - "Highest-seeded WAITLISTED team in the division (created_at ASC tie-break) is auto-promoted to CONFIRMED (cyclic promotion)"

      - from: WITHDRAWN_LOCKED
        to: WITHDRAWN
        trigger: "system (season reaches IN_PLAY)"
        actor: system
        preconditions: []
        side_effects:
          - "Team becomes terminal; standings exclude it"

  # --- Game: PARALLEL dimensions — schedule_status x score_status ---
  - entity: Game
    field: schedule_status
    initial_state: SCHEDULED
    terminal_states: [PLAYED, CANCELLED]
    note: "schedule_status evolves independently of score_status (parallel dimensions on one row)"
    transitions:
      - from: SCHEDULED
        to: RESCHEDULE_REQUESTED
        trigger: "POST /games/{game_id}/request-reschedule"
        actor: TeamCaptain
        preconditions:
          - "Season.registration_status IN {SCHEDULED, IN_PLAY}"
          - "score_status == PENDING"
          - "Requesting captain owns home_team_id or away_team_id"
        side_effects: []

      - from: RESCHEDULE_REQUESTED
        to: SCHEDULED
        trigger: "POST /games/{game_id}/reschedule with new venue/field/time (approves the make-up)"
        actor: LeagueAdmin
        preconditions:
          - "No venue-field temporal overlap at the new slot (resource_overlap_venue calc)"
          - "No referee temporal overlap for any retained assignment (resource_overlap_referee calc)"
          - "New starts_at is in the future relative to Season.clock_now"
        side_effects:
          - "venue_id, field_index, starts_at, ends_at updated to the new slot (the same Game row moves; no make-up row is created)"

      - from: SCHEDULED
        to: FORFEITED
        trigger: "POST /games/{game_id}/forfeit with forfeiting_team_id"
        actor: "LeagueAdmin or TeamCaptain"
        preconditions:
          - "forfeiting_team_id IN {home_team_id, away_team_id}"
          - "score_status IN {PENDING, SUBMITTED}"
        side_effects:
          - "schedule_status -> FORFEITED; score_status -> CONFIRMED"
          - "standings_points sets the non-forfeiting team as winner FORFEIT_WIN_SCORE-0 and recomputes points for both teams (cascade)"
          - "RefereeAssignments on the game -> RELEASED (cascade)"

      - from: SCHEDULED
        to: PLAYED
        trigger: "system (score_status reaches CONFIRMED for a non-forfeited game)"
        actor: system
        preconditions:
          - "score_status == CONFIRMED"
        side_effects:
          - "RefereeAssignments on the game -> RELEASED (cascade)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (a participating team withdraws, or season schedule rebuild)"
        actor: system
        preconditions: []
        side_effects:
          - "RefereeAssignments on the game -> RELEASED (cascade)"

  - entity: Game
    field: score_status
    initial_state: PENDING
    terminal_states: [CONFIRMED]
    note: "Independent of schedule_status; the scorekeeping dimension"
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /games/{game_id}/submit-score with home_score, away_score"
        actor: "TeamCaptain or Referee"
        preconditions:
          - "schedule_status == SCHEDULED"
          - "Season.clock_now >= Game.starts_at"
          - "home_score >= 0 AND away_score >= 0"
        side_effects:
          - "home_score, away_score recorded"

      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /games/{game_id}/confirm-score"
        actor: Referee
        preconditions:
          - "A HEAD RefereeAssignment in state ASSIGNED exists and is acted by its referee"
        side_effects:
          - "schedule_status -> PLAYED (cross-dimension cascade)"
          - "standings_points recompute for both teams (cascade)"

      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /games/{game_id}/dispute-score"
        actor: TeamCaptain
        preconditions:
          - "Requesting captain owns the losing team per submitted scoreline"
        side_effects: []

      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /games/{game_id}/submit-score (resubmission by Referee, cyclic)"
        actor: Referee
        preconditions:
          - "A HEAD RefereeAssignment in state ASSIGNED exists and is acted by its referee"
        side_effects:
          - "home_score, away_score overwritten with corrected values"

  # --- ConductReport: branching adjudication with cyclic appeal ---
  - entity: ConductReport
    field: status
    initial_state: FILED
    terminal_states: [DISMISSED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /conduct-reports/{report_id}/transition with target=UNDER_REVIEW"
        actor: ConductOfficer
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /conduct-reports/{report_id}/transition with target=UPHELD"
        actor: ConductOfficer
        preconditions: []
        side_effects:
          - "ConductReport.points set to base[severity] (conduct_points calc)"
          - "Player.conduct_points recomputed; player_suspension calc re-evaluates suspension_status and suspended_until_game_index (cascade)"

      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /conduct-reports/{report_id}/transition with target=DISMISSED"
        actor: ConductOfficer
        preconditions: []
        side_effects:
          - "ConductReport.points stays 0; Player.conduct_points unaffected"

      - from: UPHELD
        to: APPEALED
        trigger: "POST /conduct-reports/{report_id}/transition with target=APPEALED"
        actor: TeamCaptain
        preconditions:
          - "Requesting captain has the cited player on an ACTIVE RosterEntry of a team they captain"
        side_effects:
          - "ConductReport.points and Player.conduct_points unchanged (APPEALED reports still count toward conduct_points until dismissed); suspension unchanged"

      - from: APPEALED
        to: UPHELD
        trigger: "POST /conduct-reports/{report_id}/transition with target=UPHELD (appeal denied, cyclic)"
        actor: ConductOfficer
        preconditions: []
        side_effects:
          - "Player.conduct_points unchanged (already counted); suspension unchanged"

      - from: APPEALED
        to: DISMISSED
        trigger: "POST /conduct-reports/{report_id}/transition with target=DISMISSED (appeal granted)"
        actor: ConductOfficer
        preconditions: []
        side_effects:
          - "ConductReport.points reset to 0; Player.conduct_points recomputed downward; player_suspension calc re-evaluates (cascade: suspension may lift)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: team-register-stale-division
    parent_entity: Division
    write_endpoint: "POST /divisions/{id}/teams"
    occ_field: "expected_division_version"
    description: |
      Registering a Team into a Division whose version has advanced since the
      client last observed it is rejected. A prior team registration (or an
      admin edit to roster bounds / team_capacity) legitimately changes the
      division's confirmed_team_count and version; a registration carrying a
      stale expected_division_version is rejected so the client re-reads the
      division before competing for a capacity slot.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: score-submit-stale-game
    parent_entity: Game
    write_endpoint: "POST /games/{id}/submit-score"
    occ_field: "expected_game_version"
    description: |
      Submitting a score against a Game whose version has advanced since the
      client last observed it is rejected. Another actor may have already moved
      the game (reschedule, forfeit, or a competing score submission that
      flipped score_status), so a submit carrying a stale expected_game_version
      is rejected to force a re-read before overwriting the scoreline.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: team_withdraw_refund
    trigger: "Team CONFIRMED->WITHDRAWN_LOCKED, and CLOSED auto-cancel of sub-minimum PENDING teams"
    algorithm: threshold
    formula: |
      captured_fee = sum(Payment.amount_cents WHERE kind=FEE AND status=CAPTURED AND team_id=team)
      prior_refunds = sum(Payment.amount_cents WHERE kind=REFUND AND status=CAPTURED AND team_id=team)
      refundable_base = captured_fee - prior_refunds
      # Two valid interpretations of "before first game" diverge — pin the EARLIER:
      if Season.clock_now <= Season.refund_full_cutoff_at:
          refund = refundable_base                         # FULL
          reason = FULL_WITHDRAWAL
      elif no Game involving team has schedule_status=PLAYED or score_status=CONFIRMED:
          refund = floor(refundable_base * Season.refund_partial_pct / 100)   # PARTIAL, truncate cents
          reason = PARTIAL_WITHDRAWAL
      else:
          refund = 0
          reason = NO_REFUND_WITHDRAWAL
      A REFUND Payment(amount_cents=refund, reason=reason) is written only if refund > 0;
      a NO_REFUND_WITHDRAWAL row is still written with amount_cents=0 for audit.
    input_set: "FEE and REFUND Payment rows with status=CAPTURED for the withdrawing team; Season.clock_now vs cutoffs"
    constants: {}
    precision: "integer cents; multiply before divide; floor (truncate) the partial product"
    variants:
      - name: full_refund
        when: "Season.clock_now <= refund_full_cutoff_at"
        difference: "Entire refundable_base returned; reason=FULL_WITHDRAWAL"
      - name: partial_refund
        when: "After full cutoff, before the team's first PLAYED/CONFIRMED game"
        difference: "floor(refundable_base * refund_partial_pct / 100); reason=PARTIAL_WITHDRAWAL"
      - name: no_refund
        when: "Team already has a PLAYED or CONFIRMED-score game"
        difference: "refund=0; audit row reason=NO_REFUND_WITHDRAWAL"

  - name: standings_points
    trigger: "Game score_status->CONFIRMED, Game schedule_status->FORFEITED, Team WITHDRAWN_LOCKED"
    algorithm: aggregation
    formula: |
      For each Team, over CONFIRMED-result games (score_status=CONFIRMED OR schedule_status=FORFEITED)
      in the team's division with stage=REGULAR:
        wins   = count(games where this team's score > opponent's score)
        draws  = count(games where scores equal)   # forfeits never produce draws
        losses = count(games where this team's score < opponent's score)
        points = wins*WIN_POINTS + draws*DRAW_POINTS + losses*LOSS_POINTS
        points_for     = sum(this team's score)
        points_against = sum(opponent's score)
      A forfeited game contributes a win (FORFEIT_WIN_SCORE-0) to the non-forfeiting team and a loss to the forfeiting team.
    input_set: "Games with stage=REGULAR and (score_status=CONFIRMED OR schedule_status=FORFEITED); excludes PENDING/SUBMITTED/DISPUTED and CANCELLED games"
    constants:
      WIN_POINTS: 3
      DRAW_POINTS: 1
      LOSS_POINTS: 0
      FORFEIT_WIN_SCORE: 3
    precision: "integer points; no rounding"

  - name: standings_seed
    trigger: "Season IN_PLAY->PLAYOFFS (bracket generation)"
    algorithm: weighted_scoring
    formula: |
      Rank CONFIRMED teams within a division. Two pinned tiebreaker chains
      selected by Division.standings_tiebreaker:
        Primary key (both chains): points DESC
        If Division.standings_tiebreaker == HEAD_TO_HEAD:
            tiebreak chain: points DESC,
                            head_to_head_points DESC (points earned only in REGULAR games
                              between exactly the tied teams),
                            goal_difference DESC (points_for - points_against),
                            points_for DESC,
                            created_at ASC
        If Division.standings_tiebreaker == POINT_DIFFERENTIAL:
            tiebreak chain: points DESC,
                            goal_difference DESC (points_for - points_against),
                            points_for DESC,
                            head_to_head_points DESC,
                            created_at ASC
      Seed = 1-based position in the sorted order. PLAYOFF games pair seed N vs
      seed (count+1-N) for the first round.
    input_set: "Teams with status=CONFIRMED in the division; their standings_points outputs"
    constants: {}
    precision: "integer ordering; created_at ASC is the final deterministic tie-break (never id)"
    variants:
      - name: head_to_head_chain
        when: "Division.standings_tiebreaker == HEAD_TO_HEAD"
        difference: "head_to_head_points applied before goal_difference"
      - name: point_differential_chain
        when: "Division.standings_tiebreaker == POINT_DIFFERENTIAL"
        difference: "goal_difference applied before head_to_head_points"

  - name: player_suspension
    trigger: "ConductReport UNDER_REVIEW->UPHELD, ConductReport ->DISMISSED (from UNDER_REVIEW or APPEALED)"
    algorithm: threshold
    formula: |
      base = { WARNING: 1, YELLOW: 2, RED: 4, ABUSE: 8 }
      Player.conduct_points = sum(base[r.severity] for r in ConductReports against player
                                  whose status IN {UPHELD, APPEALED})
      # APPEALED reports keep counting (points are only zeroed on DISMISSED), so an
      # appeal does NOT lift a suspension until/unless it is granted (->DISMISSED).
      Suspension thresholds (instantaneous, >= semantics):
        conduct_points >= BAN_THRESHOLD(12)        -> suspension_status=BANNED,    suspended_until_game_index = 9999
        conduct_points >= SUSPEND_THRESHOLD(6)     -> suspension_status=SUSPENDED, suspended_until_game_index = max(triggering_game.round_index + SUSPENSION_GAMES, current)
        conduct_points >= WARN_THRESHOLD(3)        -> suspension_status=WARNED,    suspended_until_game_index unchanged
        else                                       -> suspension_status=CLEAR,     suspended_until_game_index = 0
      triggering_game = the Game referenced by the ConductReport that crossed the threshold.
    input_set: "ConductReports for the player with status IN {UPHELD, APPEALED}; the round_index of the triggering report's game"
    constants:
      WARN_THRESHOLD: 3
      SUSPEND_THRESHOLD: 6
      BAN_THRESHOLD: 12
      SUSPENSION_GAMES: 2
    precision: "integer points; >= comparison at every threshold"

  - name: resource_overlap_referee
    trigger: "POST /games/{game_id}/referee-assignments, POST /games/{game_id}/reschedule"
    algorithm: interval_merge
    formula: |
      A referee R cannot hold two ASSIGNED assignments whose games' [starts_at, ends_at)
      half-open intervals intersect. Two intervals [a1,e1) and [a2,e2) conflict iff
      a1 < e2 AND a2 < e1. Back-to-back games sharing an instant (e1 == a2) do NOT
      conflict for a referee (no buffer between venues for a referee).
    input_set: "All Games with an ASSIGNED RefereeAssignment for referee R, excluding the game under edit"
    constants: {}
    precision: "half-open interval; equality at the boundary is non-overlapping"

  - name: resource_overlap_venue
    trigger: "POST /games (schedule), POST /games/{game_id}/reschedule"
    algorithm: interval_merge
    formula: |
      Two games on the SAME (venue_id, field_index) conflict if their intervals,
      each EXPANDED by Venue.turnover_buffer_minutes, intersect. With buffer B:
      game A occupies [starts_at, ends_at + B); a new game N at [aN, eN) conflicts iff
      aN < (ends_at_A + B) AND starts_at_A < (eN + B). Unlike the referee rule,
      adjacency (eN == starts_at_A) DOES conflict when B > 0 because the buffer must
      separate them. Different field_index values at the same venue never conflict.
    input_set: "Games on the same venue_id and field_index with schedule_status IN {SCHEDULED, RESCHEDULE_REQUESTED}, excluding the game under edit"
    constants: {}
    precision: "buffered closed-ish interval; buffer applied symmetrically in minutes"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7; entity_backed roles must own the target resource where ownership is required"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body-referenced resource exists, validated left-to-right (season, then division, then team/game, then sub-resource)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, scores >= 0, field_index in 1..Venue.field_count, ends_at > starts_at"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 5
    category: state
    check: "OCC expected_<parent>_version matches the parent's current version (concurrency_rules write endpoints)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /divisions/{id}/teams, POST /games/{id}/submit-score"

  - priority: 6
    category: state
    check: "Season.registration_status gate: child operation permitted for the season's current posture (e.g. Team create only while OPEN; reschedule only while SCHEDULED/IN_PLAY)"
    error_id: ERR_SEASON_PHASE
    http_status: 409
    applies_to: "Team create, Game schedule/reschedule, score submit/confirm, season transition target=PLAYOFFS"

  - priority: 7
    category: state
    check: "Target resource is in a valid state for the requested transition (schedule_status, score_status, Team.status, ConductReport.status)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 8
    category: business_safety
    check: "A player under SUSPENDED/BANNED suspension_status cannot be added to a roster, and cannot be cited as participating; suspended_until_game_index gates eligibility"
    error_id: ERR_PLAYER_SUSPENDED
    http_status: 409
    applies_to: "POST /teams/{team_id}/roster, score submit referencing lineups"

  - priority: 9
    category: business_referential
    check: "home_team_id != away_team_id; both teams CONFIRMED and in the same division as the game; forfeiting_team_id is one of the two"
    error_id: ERR_INVALID_MATCHUP
    http_status: 409
    applies_to: "Game create, Game forfeit"

  - priority: 10
    category: business_temporal
    check: "Referee temporal-overlap: assignment/reschedule must not put a referee in two intersecting [starts_at, ends_at) games (resource_overlap_referee)"
    error_id: ERR_REFEREE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "referee-assignments create, reschedule"

  - priority: 11
    category: business_temporal
    check: "Venue temporal-overlap: a game on the same (venue_id, field_index) must respect the turnover buffer (resource_overlap_venue)"
    error_id: ERR_VENUE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "Game create, reschedule"

  - priority: 12
    category: business_constraint
    check: "Division capacity: a team cannot be CONFIRMED when confirmed_team_count == team_capacity; roster cannot exceed max_roster_size"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "Team confirm (PENDING/WAITLISTED->CONFIRMED), roster add"

  - priority: 13
    category: business_constraint
    check: "Roster minimum: a team cannot be CONFIRMED with roster_size < Division.min_roster_size; a roster duplicate (same player ACTIVE twice) is rejected"
    error_id: ERR_ROSTER_RULE
    http_status: 409
    applies_to: "Team confirm, roster add"

  - priority: 14
    category: business_fiscal
    check: "Refund integrity: total REFUND for a team can never exceed captured FEE minus prior refunds (refund floor at 0)"
    error_id: ERR_REFUND_EXCEEDS_FEE
    http_status: 409
    applies_to: "Team withdraw, admin refund adjustment"

  - priority: 15
    category: business_constraint
    check: "Uniqueness: Team.name unique within a division among non-CANCELLED teams; Player.email globally unique among non-CANCELLED players"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "Team create, Player create"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Seasons ----
  - method: POST
    path: "/seasons"
    description: "Create a season (DRAFT)"
    roles: [LeagueAdmin]
    code: 201
    input: [name, sport, registration_opens_at, registration_closes_at, refund_full_cutoff_at, "refund_partial_pct?"]
    output: Season
    side_effects: ["registration_status=DRAFT, clock_now defaults to created_at, version=1"]

  - method: GET
    path: "/seasons/{id}"
    description: "Get a season"
    roles: [LeagueAdmin, TeamCaptain, Referee, ConductOfficer]
    code: 200
    input: []
    output: Season
    side_effects: []

  - method: POST
    path: "/seasons/{id}/transition"
    description: "Advance the season lifecycle (DRAFT->OPEN->CLOSED->SCHEDULED->IN_PLAY->PLAYOFFS->COMPLETE); the target enum selects the transition. OCC on season.version."
    roles: [LeagueAdmin]
    code: 200
    input: [target, expected_season_version, "force?"]
    output: Season
    side_effects:
      - "target=OPEN: registration_status->OPEN"
      - "target=CLOSED: PENDING teams meeting min_roster_size auto-promoted to CONFIRMED (created_at ASC) until team_capacity, remainder WAITLISTED; PENDING below minimum -> CANCELLED with full REFUND (cascade team_withdraw_refund)"
      - "target=SCHEDULED: registration_status->SCHEDULED"
      - "target=IN_PLAY: WITHDRAWN_LOCKED teams -> WITHDRAWN (cascade)"
      - "target=PLAYOFFS: standings recompute + bracket seeding via standings_seed, PLAYOFF games generated (cascade)"
      - "target=COMPLETE: registration_status->COMPLETE"
      - "increments Season.version by 1"

  # ---- Divisions ----
  - method: POST
    path: "/seasons/{id}/divisions"
    description: "Create a division under a season"
    roles: [LeagueAdmin]
    code: 201
    input: [name, skill_tier, min_roster_size, max_roster_size, team_capacity, registration_fee_cents, "standings_tiebreaker?"]
    output: Division
    side_effects: ["confirmed_team_count=0, version=1"]

  - method: GET
    path: "/seasons/{id}/divisions"
    description: "List divisions under a season (reverse-reachability for Division.season_id)"
    roles: [LeagueAdmin, TeamCaptain, Referee, ConductOfficer]
    code: 200
    input: ["skill_tier?", "limit?", "offset?"]
    output: Division[]
    side_effects: []

  - method: GET
    path: "/divisions/{id}"
    description: "Get a division"
    roles: [LeagueAdmin, TeamCaptain, Referee, ConductOfficer]
    code: 200
    input: []
    output: Division
    side_effects: []

  - method: GET
    path: "/divisions/{id}/standings"
    description: "Computed standings (ordered seed list) for the division"
    roles: [LeagueAdmin, TeamCaptain, Referee, ConductOfficer]
    code: 200
    input: []
    output: Team[]
    side_effects: ["recomputes standings_points and standings_seed on read"]

  - method: POST
    path: "/divisions/{id}/games"
    description: "Schedule a game in a division (venue temporal-overlap checked)"
    roles: [LeagueAdmin]
    code: 201
    input: [home_team_id, away_team_id, venue_id, field_index, round_index, starts_at, ends_at, "stage?"]
    output: Game
    side_effects: ["schedule_status=SCHEDULED, score_status=PENDING", "resource_overlap_venue enforced"]

  - method: GET
    path: "/divisions/{id}/games"
    description: "List games in a division (reverse-reachability for Game.division_id)"
    roles: [LeagueAdmin, TeamCaptain, Referee, ConductOfficer]
    code: 200
    input: ["schedule_status?", "score_status?", "round_index?", "stage?", "limit?", "offset?"]
    output: Game[]
    side_effects: []

  # ---- Teams ----
  - method: POST
    path: "/divisions/{id}/teams"
    description: "Register a team into a division (OCC on division.version)"
    roles: [TeamCaptain]
    code: 201
    input: [name, captain_player_id, expected_division_version]
    output: Team
    side_effects: ["status=PENDING", "increments Division.version by 1", "captain auto-added as ACTIVE RosterEntry (cascade)"]

  - method: GET
    path: "/divisions/{id}/teams"
    description: "List teams in a division (reverse-reachability for Team.division_id)"
    roles: [LeagueAdmin, TeamCaptain, Referee, ConductOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Team[]
    side_effects: []

  - method: GET
    path: "/teams/{id}"
    description: "Get a team (computed standings + fee fields included)"
    roles: [LeagueAdmin, TeamCaptain, Referee, ConductOfficer]
    code: 200
    input: []
    output: Team
    side_effects: []

  - method: GET
    path: "/teams"
    description: "List teams filtered by captain (reverse-reachability for Team.captain_player_id)"
    roles: [LeagueAdmin, TeamCaptain, Referee, ConductOfficer]
    code: 200
    input: ["captain_player_id?", "status?", "limit?", "offset?"]
    output: Team[]
    side_effects: []

  - method: POST
    path: "/teams/{id}/pay-fee"
    description: "Capture the registration fee for a team (writes a FEE Payment)"
    roles: [TeamCaptain, LeagueAdmin]
    code: 201
    input: [amount_cents]
    output: Payment
    side_effects: ["writes FEE Payment status=CAPTURED reason=REGISTRATION", "Team.fee_charged_cents recomputed"]

  - method: POST
    path: "/teams/{id}/confirm"
    description: "PENDING->CONFIRMED or WAITLISTED->CONFIRMED (admin)"
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: Team
    side_effects: ["status->CONFIRMED", "Division.confirmed_team_count recomputed"]

  - method: POST
    path: "/teams/{id}/withdraw"
    description: "Withdraw a team; refund + cascades depend on status/phase"
    roles: [TeamCaptain, LeagueAdmin]
    code: 200
    input: []
    output: Team
    side_effects:
      - "CONFIRMED->WITHDRAWN_LOCKED with team_withdraw_refund REFUND Payment (cascade)"
      - "PENDING/WAITLISTED with no captured fee -> CANCELLED; RosterEntry rows -> RELEASED"
      - "SCHEDULED games involving team -> CANCELLED; referee assignments RELEASED (cascade)"
      - "highest-seeded WAITLISTED team auto-promoted to CONFIRMED (cyclic, created_at ASC tie-break)"
      - "Division.confirmed_team_count recomputed"

  - method: POST
    path: "/teams/{id}/refund-adjustment"
    description: "Admin manual refund row (bounded by captured fee minus prior refunds)"
    roles: [LeagueAdmin]
    code: 201
    input: [amount_cents]
    output: Payment
    side_effects: ["writes REFUND Payment reason=ADMIN_ADJUSTMENT if within fee bound", "Team.refund_issued_cents recomputed"]

  - method: GET
    path: "/teams/{id}/payments"
    description: "Ledger rows for a team (reverse-reachability for Payment.team_id)"
    roles: [LeagueAdmin, TeamCaptain]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # ---- Roster (Team <-> Player) ----
  - method: POST
    path: "/teams/{id}/roster"
    description: "Add a player to a team roster (creates RosterEntry)"
    roles: [TeamCaptain, LeagueAdmin]
    code: 201
    input: [player_id]
    output: RosterEntry
    side_effects: ["state=ACTIVE", "Player.is_free_agent recomputed", "Team.roster_size recomputed"]

  - method: GET
    path: "/teams/{id}/roster"
    description: "List roster entries for a team (reverse-reachability for RosterEntry.team_id)"
    roles: [LeagueAdmin, TeamCaptain, Referee]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: RosterEntry[]
    side_effects: []

  - method: DELETE
    path: "/teams/{id}/roster/{roster_entry_id}"
    description: "Release a player from a roster (RosterEntry ACTIVE->RELEASED)"
    roles: [TeamCaptain, LeagueAdmin]
    code: 200
    input: []
    output: RosterEntry
    side_effects: ["state->RELEASED", "Player.is_free_agent recomputed", "Team.roster_size recomputed"]

  # ---- Players ----
  - method: POST
    path: "/players"
    description: "Register a player (free agent by default)"
    roles: [LeagueAdmin, TeamCaptain]
    code: 201
    input: [full_name, email]
    output: Player
    side_effects: ["is_free_agent=true, conduct_points=0, suspension_status=CLEAR"]

  - method: GET
    path: "/players/{id}"
    description: "Get a player (computed conduct + suspension fields)"
    roles: [LeagueAdmin, TeamCaptain, Referee, ConductOfficer]
    code: 200
    input: []
    output: Player
    side_effects: []

  - method: GET
    path: "/players/{id}/roster-entries"
    description: "List roster entries for a player (reverse-reachability for RosterEntry.player_id)"
    roles: [LeagueAdmin, TeamCaptain, Referee]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: RosterEntry[]
    side_effects: []

  # ---- Venues ----
  - method: POST
    path: "/venues"
    description: "Create a venue"
    roles: [LeagueAdmin]
    code: 201
    input: [name, field_count, "turnover_buffer_minutes?"]
    output: Venue
    side_effects: ["version=1"]

  - method: GET
    path: "/venues/{id}"
    description: "Get a venue"
    roles: [LeagueAdmin, TeamCaptain, Referee]
    code: 200
    input: []
    output: Venue
    side_effects: []

  # ---- Referees ----
  - method: POST
    path: "/referees"
    description: "Create a referee"
    roles: [LeagueAdmin]
    code: 201
    input: [full_name, certified_sports]
    output: Referee
    side_effects: ["version=1"]

  - method: GET
    path: "/referees/{id}"
    description: "Get a referee"
    roles: [LeagueAdmin, Referee]
    code: 200
    input: []
    output: Referee
    side_effects: []

  - method: GET
    path: "/referees/{id}/assignments"
    description: "List a referee's assignments (reverse-reachability for RefereeAssignment.referee_id)"
    roles: [LeagueAdmin, Referee]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: RefereeAssignment[]
    side_effects: []

  # ---- Games ----
  - method: GET
    path: "/games/{id}"
    description: "Get a game"
    roles: [LeagueAdmin, TeamCaptain, Referee, ConductOfficer]
    code: 200
    input: []
    output: Game
    side_effects: []

  - method: GET
    path: "/games"
    description: "List games filtered by team/venue/forfeiting team (reverse-reachability for Game.home_team_id, Game.away_team_id, Game.venue_id, Game.forfeiting_team_id)"
    roles: [LeagueAdmin, TeamCaptain, Referee, ConductOfficer]
    code: 200
    input: ["home_team_id?", "away_team_id?", "venue_id?", "forfeiting_team_id?", "schedule_status?", "limit?", "offset?"]
    output: Game[]
    side_effects: []

  - method: POST
    path: "/games/{id}/request-reschedule"
    description: "SCHEDULED->RESCHEDULE_REQUESTED"
    roles: [TeamCaptain]
    code: 200
    input: []
    output: Game
    side_effects: ["schedule_status->RESCHEDULE_REQUESTED"]

  - method: POST
    path: "/games/{id}/reschedule"
    description: "RESCHEDULE_REQUESTED->SCHEDULED at a new slot (overlap re-checked)"
    roles: [LeagueAdmin]
    code: 200
    input: [venue_id, field_index, starts_at, ends_at]
    output: Game
    side_effects: ["new slot applied", "resource_overlap_venue + resource_overlap_referee enforced", "schedule_status->SCHEDULED"]

  - method: POST
    path: "/games/{id}/forfeit"
    description: "SCHEDULED->FORFEITED; awards forfeit win, recomputes standings"
    roles: [LeagueAdmin, TeamCaptain]
    code: 200
    input: [forfeiting_team_id]
    output: Game
    side_effects: ["schedule_status->FORFEITED, score_status->CONFIRMED", "standings_points recompute incl. FORFEIT_WIN_SCORE (cascade)", "RefereeAssignments RELEASED (cascade)"]

  - method: POST
    path: "/games/{id}/submit-score"
    description: "Record a score (PENDING/DISPUTED->SUBMITTED); OCC on game.version"
    roles: [TeamCaptain, Referee]
    code: 200
    input: [home_score, away_score, expected_game_version]
    output: Game
    side_effects: ["score_status->SUBMITTED", "increments Game.version by 1"]

  - method: POST
    path: "/games/{id}/confirm-score"
    description: "SUBMITTED->CONFIRMED; flips schedule_status->PLAYED, recomputes standings"
    roles: [Referee]
    code: 200
    input: []
    output: Game
    side_effects: ["score_status->CONFIRMED", "schedule_status->PLAYED (cross-dimension)", "standings recompute (cascade)", "RefereeAssignments RELEASED (cascade)"]

  - method: POST
    path: "/games/{id}/dispute-score"
    description: "SUBMITTED->DISPUTED (losing captain)"
    roles: [TeamCaptain]
    code: 200
    input: []
    output: Game
    side_effects: ["score_status->DISPUTED"]

  # ---- Referee Assignments ----
  - method: POST
    path: "/games/{id}/referee-assignments"
    description: "Assign a referee to a game (referee temporal-overlap checked)"
    roles: [LeagueAdmin]
    code: 201
    input: [referee_id, "role?"]
    output: RefereeAssignment
    side_effects: ["state=ASSIGNED", "resource_overlap_referee enforced"]

  - method: GET
    path: "/games/{id}/referee-assignments"
    description: "List a game's assignments (reverse-reachability for RefereeAssignment.game_id)"
    roles: [LeagueAdmin, Referee]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: RefereeAssignment[]
    side_effects: []

  - method: DELETE
    path: "/games/{id}/referee-assignments/{assignment_id}"
    description: "Release a referee assignment (ASSIGNED->RELEASED)"
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: RefereeAssignment
    side_effects: ["state->RELEASED"]

  # ---- Conduct ----
  - method: POST
    path: "/conduct-reports"
    description: "File a sportsmanship/conduct report against a player in a game"
    roles: [Referee, LeagueAdmin, ConductOfficer]
    code: 201
    input: [game_id, player_id, severity]
    output: ConductReport
    side_effects: ["status=FILED, points=0"]

  - method: GET
    path: "/conduct-reports/{id}"
    description: "Get a conduct report"
    roles: [LeagueAdmin, ConductOfficer, TeamCaptain, Referee]
    code: 200
    input: []
    output: ConductReport
    side_effects: []

  - method: GET
    path: "/conduct-reports"
    description: "List conduct reports filtered by player or game (reverse-reachability for ConductReport.player_id, ConductReport.game_id)"
    roles: [LeagueAdmin, ConductOfficer, Referee]
    code: 200
    input: ["player_id?", "game_id?", "status?", "limit?", "offset?"]
    output: ConductReport[]
    side_effects: []

  - method: POST
    path: "/conduct-reports/{id}/transition"
    description: "Adjudicate a report; the target enum selects the transition (UNDER_REVIEW review; UPHELD uphold/appeal-deny; DISMISSED dismiss/appeal-grant; APPEALED appeal). Role gating per target."
    roles: [ConductOfficer, TeamCaptain]
    code: 200
    input: [target]
    output: ConductReport
    side_effects:
      - "target=UNDER_REVIEW (ConductOfficer): FILED->UNDER_REVIEW"
      - "target=UPHELD (ConductOfficer): UNDER_REVIEW->UPHELD or APPEALED->UPHELD; points=base[severity]; Player.conduct_points + player_suspension recompute (cascade)"
      - "target=DISMISSED (ConductOfficer): UNDER_REVIEW->DISMISSED or APPEALED->DISMISSED; points reset to 0 if previously UPHELD; Player.conduct_points + player_suspension recompute (cascade)"
      - "target=APPEALED (TeamCaptain of cited player): UPHELD->APPEALED"

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server clock (Season.clock_now source) for window/refund/eligibility decisions"
    roles: [LeagueAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Season.clock_now for all seasons set to to_iso8601 (no version bump)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation, or entity_backed role does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced season/division/team/game/player/venue/referee/report does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, enum out of range, negative score, field_index out of 1..field_count, ends_at <= starts_at" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_SEASON_PHASE, http: 409, condition: "Operation not allowed in the season's current registration_status posture" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition" }
  - { id: ERR_PLAYER_SUSPENDED, http: 409, condition: "Player is SUSPENDED or BANNED and cannot be rostered or fielded" }
  - { id: ERR_INVALID_MATCHUP, http: 409, condition: "home==away, a team is not CONFIRMED, teams differ in division, or forfeiting_team_id not in the matchup" }
  - { id: ERR_REFEREE_DOUBLE_BOOKED, http: 409, condition: "Referee assignment/reschedule collides with an existing ASSIGNED game interval (resource_overlap_referee)" }
  - { id: ERR_VENUE_DOUBLE_BOOKED, http: 409, condition: "Game collides on (venue,field) within the turnover buffer (resource_overlap_venue)" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Division team_capacity reached, or roster would exceed max_roster_size" }
  - { id: ERR_ROSTER_RULE, http: 409, condition: "Roster below min_roster_size for confirm, or duplicate ACTIVE player on the roster" }
  - { id: ERR_REFUND_EXCEEDS_FEE, http: 409, condition: "Refund (auto or admin) would exceed captured FEE minus prior refunds" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Team.name not unique within division (non-CANCELLED), or Player.email not globally unique (non-CANCELLED)" }
  - { id: ERR_FEE_REQUIRED, http: 409, condition: "Confirm requested but no CAPTURED FEE of registration_fee_cents exists for a fee-bearing division" }
  - { id: ERR_SCHEDULE_INCOMPLETE, http: 409, condition: "publish-schedule/start-playoffs blocked because a division lacks teams/games or games lack confirmed scores" }
  - { id: ERR_PAGINATION_RANGE, http: 422, condition: "limit/offset outside allowed bounds (limit 1..100, offset >= 0)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LeagueAdmin
    description: "Operates the league: seasons, divisions, scheduling, venues, referees, confirmations, refunds."
    identity: opaque
    exclusive_operations:
      - "POST /seasons and POST /seasons/{id}/transition — season + lifecycle"
      - "POST /seasons/{id}/divisions — create division"
      - "POST /divisions/{division_id}/games — schedule game"
      - "POST /games/{id}/reschedule — approve reschedule"
      - "POST /games/{id}/referee-assignments and DELETE — manage officials"
      - "POST /teams/{id}/confirm — registration control (PENDING/WAITLISTED->CONFIRMED)"
      - "POST /teams/{id}/refund-adjustment — manual refund"
      - "POST /venues, POST /referees — create infrastructure"
      - "POST /_clock/set_current_utc — set server clock"
    shared_operations:
      - "GET reads across all resources"
      - "POST /teams/{id}/withdraw (shared with TeamCaptain)"
      - "POST /teams/{id}/pay-fee (shared with TeamCaptain)"
      - "POST /teams/{id}/roster, DELETE roster (shared with TeamCaptain)"
      - "POST /games/{id}/forfeit (shared with TeamCaptain)"
      - "POST /players (shared with TeamCaptain)"
      - "POST /conduct-reports (shared with Referee, ConductOfficer)"

  - name: TeamCaptain
    description: "A Player acting as captain of their own team(s); owns registration, roster, reschedule requests, score submission/dispute, appeals."
    identity: "entity_backed:Player"
    exclusive_operations:
      - "POST /divisions/{division_id}/teams — register own team (captain_player_id == X-User-ID)"
      - "POST /games/{id}/request-reschedule — for a game involving own team"
      - "POST /games/{id}/dispute-score — losing captain only"
      - "POST /conduct-reports/{id}/transition with target=APPEALED — for own rostered player"
    shared_operations:
      - "GET reads on own resources"
      - "POST /teams/{id}/pay-fee, /withdraw, /roster, DELETE roster (own team; shared with LeagueAdmin)"
      - "POST /games/{id}/forfeit (own team; shared with LeagueAdmin)"
      - "POST /games/{id}/submit-score (own team; shared with Referee)"
      - "POST /players (shared with LeagueAdmin)"

  - name: Referee
    description: "An official; owns their own assignments and the authoritative score confirmation."
    identity: "entity_backed:Referee"
    exclusive_operations:
      - "POST /games/{id}/confirm-score — only the assigned HEAD referee"
    shared_operations:
      - "GET reads on games, assignments, rosters"
      - "POST /games/{id}/submit-score (shared with TeamCaptain)"
      - "POST /conduct-reports (shared with LeagueAdmin, ConductOfficer)"

  - name: ConductOfficer
    description: "Adjudicates sportsmanship/conduct: review, uphold, dismiss reports."
    identity: opaque
    exclusive_operations:
      - "POST /conduct-reports/{id}/transition with target IN {UNDER_REVIEW, UPHELD, DISMISSED} — adjudication"
    shared_operations:
      - "GET reads on conduct reports, players, games"
      - "POST /conduct-reports (shared with Referee, LeagueAdmin)"
