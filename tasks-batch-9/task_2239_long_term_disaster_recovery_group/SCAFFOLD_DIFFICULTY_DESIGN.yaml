        grounds:
          - "validations[priority 23]"
          - "errors[ERR_DEPLOYMENT_WINDOW_CONFLICT]"
          - "calculations.volunteer_skill_fit_score.constants.DEPLOYMENT_TURNAROUND_DAYS"
          - "calculations.volunteer_skill_fit_score.constants.DEPLOYMENT_INTERVAL_SEMANTICS"
          - "endpoints[POST /volunteer-deployments]"
        distinguishing_aspect: "An existing REQUESTED deployment runs 2026-09-07..2026-09-11. A second window starting 2026-09-12 does not overlap it at all under naive interval logic, yet must be rejected because 09-12 <= 09-11 + 1 day of turnaround. Shifting the start one day later to 09-13 must be accepted. Both candidate windows are exactly 5 days long, so both score the identical 6000 bps and the buffer is the only variable. An implementation with half-open or bufferless overlap accepts the 09-12 window; one that double-counts the buffer on both endpoints also rejects the 09-13 window."
