scenario: |
  National Food Bank Network Donated Load Allocation & Shares Bidding (Feeding America):
  national donor agreements where manufacturers and retailers donate truckload quantities to
  the network rather than individual food banks, allocation system distributing available loads
  across member food banks using a share currency based on food insecure population and prior
  activity, member bidding on posted loads with preferences by product type, storage capacity
  and transport ability, transportation cost coverage and freight subsidy decisions affecting
  whether remote members can accept loads, product safety and recall handling across the network
  with rapid trace and hold, member food bank standards including storage, distribution and
  reporting requirements with audits, retail store donation programs run locally with pickup
  logistics, poundage reporting and meal equivalency measurement for donors.

domain_name: "food-bank-load-allocation"
api_prefix: "/network"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Multi-party negotiation"
  complexity_layers:
    - "optimistic concurrency"
    - "cascading side effects"
    - "selector policy"
    - "derived field reconciliation"
    - "rate / threshold triggers"
  entity_topology: flat
  state_machine_shape: "parallel + cyclic"
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: "peer_roles + segregation_of_duties"
  consistency_model: immediate

entities:
  - name: MemberFoodBank
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal name of the member food bank."
        constraints: "non-empty; unique per state_code among members whose certification_status IN {PENDING_CERTIFICATION, CERTIFIED, PROBATION}"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state the member serves."
        constraints: "exactly 2 uppercase letters"
      - name: food_insecure_population
        type: integer
        source: input
        description: "Count of food-insecure individuals in the member's service area; drives the share grant base."
        constraints: ">= 0"
      - name: storage_capacity_lbs
        type: integer
        source: input
        description: "Total dry + refrigerated + frozen storage capacity in pounds."
        constraints: "> 0"
      - name: refrigerated_capacity_lbs
        type: integer
        source: input
        description: "Refrigerated and frozen storage capacity in pounds."
        constraints: ">= 0 and <= storage_capacity_lbs"
      - name: transport_ability
        type: enum
        source: input
        description: "Highest transport reach the member can self-perform."
        constraints: "one of NONE | LOCAL | REGIONAL | NATIONAL"
      - name: certification_status
        type: enum
        source: computed
        description: "Member standards posture; gates all bidding and program operations."
        constraints: "one of PENDING_CERTIFICATION | CERTIFIED | PROBATION | SUSPENDED"
        default: "PENDING_CERTIFICATION"
      - name: share_balance
        type: integer
        source: computed
        description: "Unreserved share currency balance; always equals sum of ShareLedgerEntry.amount for this member."
        constraints: ">= 0"
      - name: share_reserved
        type: integer
        source: computed
        description: "Share currency held against SUBMITTED bids; unavailable for new bids."
        constraints: ">= 0"
      - name: audit_score
        type: integer
        source: computed
        description: "Integer posture score: floor of the latest completed MemberAudit.weighted_score, clamped at 0; 0 when no audit has completed."
        constraints: ">= 0"
      - name: last_grant_epoch
        type: string
        source: computed
        description: "Most recent share grant epoch applied to this member; null before the first grant."
      - name: active_bid_count
        type: integer
        source: computed
        description: "Count of this member's LoadBid rows in bid_status SUBMITTED."
        constraints: ">= 0"

  - name: DonorAgreement
    parent: null
    common_fields: true
    fields:
      - name: donor_name
        type: string
        source: input
        description: "Manufacturer or retailer that donates truckload quantities to the network."
      - name: donor_type
        type: enum
        source: input
        description: "Donor channel."
        constraints: "one of MANUFACTURER | RETAILER | DISTRIBUTOR"
      - name: product_category
        type: enum
        source: input
        description: "Category of product committed under this agreement."
        constraints: "one of DRY_GOODS | PRODUCE | DAIRY | FROZEN_PROTEIN | BAKERY"
      - name: committed_lbs
        type: integer
        source: input
        description: "Pledged annual poundage under this agreement."
        constraints: "> 0"
      - name: meal_equivalency_factor
        type: number
        source: input
        description: "Pounds per meal used for this agreement's donor reporting."
        constraints: "> 0; default 1.2"
        default: 1.2
      - name: status
        type: enum
        source: computed
        description: "Agreement lifecycle posture; only ACTIVE agreements accept new loads."
        constraints: "one of DRAFT | ACTIVE | SUSPENDED | CLOSED"
        default: "DRAFT"
      - name: freight_subsidy_pool_cents
        type: integer
        source: input
        description: "Freight subsidy budget available to this agreement for the current program year."
        constraints: ">= 0"
      - name: freight_subsidy_used_cents
        type: integer
        source: computed
        description: "Sum of freight_subsidy_cents across this agreement's loads with freight_decision COVERED."
        constraints: ">= 0 and <= freight_subsidy_pool_cents"

  - name: DonatedLoad
    parent: null
    common_fields: true
    fields:
      - name: donor_agreement_id
        type: string
        source: input
        description: "FK -> DonorAgreement.id; the national agreement this truckload is drawn from."
      - name: product_category
        type: enum
        source: input
        description: "Product category of this truckload; must equal the parent agreement's product_category."
        constraints: "one of DRY_GOODS | PRODUCE | DAIRY | FROZEN_PROTEIN | BAKERY"
      - name: storage_type
        type: enum
        source: input
        description: "Storage class required to accept this load."
        constraints: "one of DRY | REFRIGERATED | FROZEN"
      - name: weight_lbs
        type: integer
        source: input
        description: "Truckload weight in pounds."
        constraints: "> 0"
      - name: lot_code
        type: string
        source: input
        description: "Manufacturer lot code printed on the shipment; the trace key for recalls."
      - name: origin_zip
        type: string
        source: input
        description: "Five-digit origin ZIP of the donor distribution center."
        constraints: "exactly 5 digits"
      - name: destination_region
        type: enum
        source: input
        description: "Network region the load is posted into."
        constraints: "one of NORTHEAST | SOUTHEAST | MIDWEST | SOUTHWEST | WEST"
      - name: distance_miles
        type: integer
        source: input
        description: "One-way haul distance from origin to the awarded member."
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: "Allocation lifecycle state."
        constraints: "one of POSTED | BIDDING | AWARDED | IN_TRANSIT | DELIVERED | CANCELLED"
        default: "POSTED"
      - name: safety_status
        type: enum
        source: computed
        description: "Product safety dimension, independent of status; HELD or RECALLED loads cannot be bid on, awarded, dispatched or delivered."
        constraints: "one of CLEAR | HELD | RECALLED"
        default: "CLEAR"
      - name: awarded_bid_id
        type: string
        source: computed
        description: "Id of the LoadBid selected by the award selector; null before AWARDED."
      - name: awarded_member_id
        type: string
        source: computed
        description: "Id of the MemberFoodBank that won this load; null before AWARDED."
      - name: freight_estimate_cents
        type: integer
        source: computed
        description: "Full freight cost estimate in cents, recomputed whenever distance_miles, awarded_member_id or transport ability changes."
      - name: freight_subsidy_cents
        type: integer
        source: computed
        description: "Network subsidy awarded toward freight; 0 until freight_decision is COVERED."
      - name: member_freight_due_cents
        type: integer
        source: computed
        description: "Freight the awarded member pays after subsidy."
      - name: freight_decision
        type: enum
        source: computed
        description: "Freight coverage decision for the awarded member."
        constraints: "one of PENDING | COVERED | DECLINED"
        default: "PENDING"
      - name: delivery_window_start
        type: datetime
        source: input
        description: "Start of the delivery appointment window; null until dispatch."
      - name: delivery_window_end
        type: datetime
        source: input
        description: "End of the delivery appointment window; half-open with delivery_window_start."
      - name: delivered_lbs
        type: integer
        source: computed
        description: "Pounds confirmed delivered; equals weight_lbs on DELIVERED, 0 otherwise."
        constraints: ">= 0"
      - name: meal_equivalent
        type: integer
        source: computed
        description: "Meals represented by delivered_lbs under the agreement's meal_equivalency_factor."

  - name: LoadBid
    parent: null
    common_fields: true
    fields:
      - name: load_id
        type: string
        source: input
        description: "FK -> DonatedLoad.id; the posted load being bid on."
      - name: member_id
        type: string
        source: input
        description: "FK -> MemberFoodBank.id; the bidding member."
      - name: shares_offered
        type: integer
        source: input
        description: "Share currency the member commits to this load; held from share_balance while SUBMITTED."
        constraints: "> 0"
      - name: preference_rank
        type: integer
        source: input
        description: "Member's own priority for this load (1 = most preferred); used only as a member-side ordering hint."
        constraints: ">= 1"
      - name: can_self_transport
        type: boolean
        source: input
        description: "Whether the member can perform the haul without a network-subsidized carrier."
      - name: bid_status
        type: enum
        source: computed
        description: "Bid lifecycle state."
        constraints: "one of SUBMITTED | WITHDRAWN | AWARDED | REJECTED"
        default: "SUBMITTED"
      - name: rejection_reason
        type: string
        source: computed
        description: "Populated when bid_status is REJECTED; null otherwise."
      - name: submitted_round
        type: integer
        source: computed
        description: "1-based count of the bidding rounds this member has entered for this load."

  - name: ShareLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> MemberFoodBank.id; the member whose share currency moved."
      - name: entry_type
        type: enum
        source: input
        description: "Reason for the share movement."
        constraints: "one of GRANT | BID_HOLD | BID_RELEASE | AWARD_DEBIT | AWARD_REFUND | ACTIVITY_BONUS | RECALL_REFUND"
      - name: amount
        type: integer
        source: computed
        description: "Signed share delta; GRANT/ACTIVITY_BONUS/RECALL_REFUND positive, BID_HOLD negative, BID_RELEASE positive, AWARD_DEBIT negative."
      - name: balance_after
        type: integer
        source: computed
        description: "MemberFoodBank.share_balance immediately after this entry is appended."
      - name: epoch
        type: string
        source: input
        description: "Allocation epoch label (YYYY-MM) this entry belongs to."
      - name: reference_id
        type: string
        source: input
        description: "Plain reference (not a foreign key) to the DonatedLoad or bid that caused this entry; null for GRANT entries."

  - name: ProductRecall
    parent: null
    common_fields: true
    fields:
      - name: donor_agreement_id
        type: string
        source: input
        description: "FK -> DonorAgreement.id; the agreement the recalled product was donated under."
      - name: lot_code
        type: string
        source: input
        description: "Recalled manufacturer lot code; matched against DonatedLoad.lot_code."
      - name: product_category
        type: enum
        source: input
        description: "Category of the recalled product."
        constraints: "one of DRY_GOODS | PRODUCE | DAIRY | FROZEN_PROTEIN | BAKERY"
      - name: affected_lbs
        type: integer
        source: input
        description: "Pounds the donor reports as affected by the recall."
        constraints: ">= 0"
      - name: recall_status
        type: enum
        source: computed
        description: "Recall handling state."
        constraints: "one of OPEN | TRACING | RESOLVED | REOPENED"
        default: "OPEN"
      - name: traced_load_count
        type: integer
        source: computed
        description: "Number of DonatedLoad rows matched by lot_code during tracing."
        constraints: ">= 0"
      - name: held_lbs
        type: integer
        source: computed
        description: "Sum of weight_lbs across this recall's RecallHold rows with hold_status ACTIVE."
      - name: opened_at
        type: datetime
        source: system
        description: "Timestamp the recall was opened."

  - name: RecallHold
    parent: null
    common_fields: false
    fields:
      - name: recall_id
        type: string
        source: input
        description: "FK -> ProductRecall.id; the recall that placed this hold."
      - name: load_id
        type: string
        source: input
        description: "FK -> DonatedLoad.id; the load placed on safety hold."
      - name: hold_status
        type: enum
        source: computed
        description: "Hold lifecycle state."
        constraints: "one of ACTIVE | RELEASED | DESTROYED"
        default: "ACTIVE"
      - name: hold_reason
        type: string
        source: computed
        description: "Why the hold was placed (lot match, category match, or donor-wide trace)."

  - name: MemberAudit
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> MemberFoodBank.id; the member under audit."
      - name: audit_type
        type: enum
        source: input
        description: "Which standards the audit covers."
        constraints: "one of STORAGE | DISTRIBUTION | REPORTING | COMPREHENSIVE"
      - name: storage_score
        type: integer
        source: input
        description: "Storage standards score (0-100)."
        constraints: "0 <= value <= 100"
      - name: distribution_score
        type: integer
        source: input
        description: "Distribution standards score (0-100)."
        constraints: "0 <= value <= 100"
      - name: reporting_score
        type: integer
        source: input
        description: "Reporting standards score (0-100)."
        constraints: "0 <= value <= 100"
      - name: weighted_score
        type: number
        source: computed
        description: "Audit-type-weighted score in [0,100], computed at completion."
      - name: opened_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who created this audit; the segregation-of-duties check compares it to the completing operator's X-User-ID."
      - name: audit_status
        type: enum
        source: computed
        description: "Audit lifecycle state."
        constraints: "one of IN_PROGRESS | PASSED | FAILED"
        default: "SCHEDULED"

  - name: StoreDonationProgram
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> MemberFoodBank.id; the local member food bank running the retail program."
      - name: store_name
        type: string
        source: input
        description: "Retail store location name."
      - name: store_chain
        type: string
        source: input
        description: "Retail chain the store belongs to."
      - name: pickup_frequency
        type: enum
        source: input
        description: "Agreed pickup cadence."
        constraints: "one of DAILY | WEEKLY | BIWEEKLY"
      - name: expected_weekly_lbs
        type: integer
        source: input
        description: "Contracted weekly poundage from this store."
        constraints: ">= 0"
      - name: program_status
        type: enum
        source: computed
        description: "Program posture; ACTIVE requires the owning member to be CERTIFIED."
        constraints: "one of PENDING | ACTIVE | SUSPENDED"
        default: "PENDING"

  - name: StorePickup
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> StoreDonationProgram.id; the retail program this pickup serves."
      - name: scheduled_date
        type: datetime
        source: input
        description: "Date the pickup route is scheduled for (UTC midnight)."
      - name: window_start
        type: datetime
        source: input
        description: "Start of the pickup window on scheduled_date."
      - name: window_end
        type: datetime
        source: input
        description: "End of the pickup window; half-open with window_start."
      - name: pickup_status
        type: enum
        source: computed
        description: "Pickup lifecycle state."
        constraints: "one of SCHEDULED | COMPLETED | MISSED"
        default: "SCHEDULED"
      - name: collected_lbs
        type: integer
        source: input
        description: "Pounds collected on completion; 0 while SCHEDULED."
        constraints: ">= 0"
        default: 0
      - name: meal_equivalent
        type: integer
        source: computed
        description: "Meals represented by collected_lbs at the network standard factor."

state_machines:
  - entity: DonatedLoad
    initial_state: POSTED
    terminal_states: [DELIVERED, CANCELLED]
    shape_note: |
      Two independent dimensions on one row: `status` (POSTED -> BIDDING -> AWARDED -> IN_TRANSIT
      -> DELIVERED, with a cyclic revert AWARDED -> BIDDING on a declined freight decision and a
      CANCELLED exit) and `safety_status` (CLEAR <-> HELD, with RECALLED reachable from CLEAR when
      the load was already delivered when a recall traces it). Every transition below is guarded by
      BOTH dimensions.
    transitions:
      - from: POSTED
        to: BIDDING
        trigger: "POST /network/loads/{id}/post"
        actor: NetworkAdmin
        preconditions:
          - "load.status == POSTED"
          - "load.safety_status == CLEAR"
          - "the DonorAgreement referenced by load.donor_agreement_id has status ACTIVE"
          - "load.weight_lbs > 0"
        side_effects:
          - "load.status = BIDDING; load.updated_at refreshed; load.version += 1"
          - "the load becomes discoverable in GET /network/loads with status=BIDDING"
      - from: BIDDING
        to: AWARDED
        trigger: "POST /network/loads/{id}/award"
        actor: NetworkAdmin
        preconditions:
          - "load.status == BIDDING"
          - "load.safety_status == CLEAR"
          - "at least one LoadBid with load_id == load.id and bid_status == SUBMITTED exists (empty pool -> ERR_NO_ELIGIBLE_BIDS)"
          - "the selected bid's member has certification_status IN {CERTIFIED, PROBATION} and share_balance >= shares_offered"
        side_effects:
          - "HOP 1: the selected LoadBid.bid_status -> AWARDED; load.awarded_bid_id / awarded_member_id set"
          - "HOP 1b: every other SUBMITTED bid on this load -> REJECTED with rejection_reason LOSING_BID"
          - "HOP 2 (caused by HOP 1b): each rejected bid appends ShareLedgerEntry entry_type BID_RELEASE amount +shares_offered, and that member's share_balance / share_reserved / active_bid_count are recomputed"
          - "HOP 2b (caused by HOP 1): the winner's BID_HOLD is released by ShareLedgerEntry BID_RELEASE +shares_offered, then ShareLedgerEntry AWARD_DEBIT -shares_offered is appended, and the winner's share_balance / share_reserved / active_bid_count are recomputed"
          - "HOP 3 (caused by HOP 2b): if the winner's recomputed share_balance < 50 and certification_status == CERTIFIED, certification_status -> PROBATION"
          - "HOP 4 (caused by HOP 3): when the winner enters PROBATION, every OTHER LoadBid of that member still in bid_status SUBMITTED is auto-withdrawn (bid_status -> WITHDRAWN, rejection_reason MEMBER_PROBATION) and each withdrawal appends ShareLedgerEntry BID_RELEASE +shares_offered and recomputes that member's share_balance / share_reserved / active_bid_count"
          - "load.freight_estimate_cents recomputed from distance_miles and the winner's transport_ability; load.freight_decision = PENDING; load.freight_subsidy_cents = 0; load.member_freight_due_cents = freight_estimate_cents"
          - "load.status = AWARDED; load.version += 1"
      - from: AWARDED
        to: BIDDING
        trigger: "POST /network/loads/{id}/freight-decision with decision DECLINED for a member that cannot self-transport"
        actor: NetworkAdmin
        preconditions:
          - "load.status == AWARDED"
          - "load.freight_decision == PENDING"
          - "the awarded member has can_self_transport == false on its AWARDED bid"
        side_effects:
          - "HOP 1: the AWARDED LoadBid.bid_status -> REJECTED with rejection_reason FREIGHT_DECLINED"
          - "HOP 2 (caused by HOP 1): ShareLedgerEntry AWARD_REFUND +shares_offered is appended for the member, and share_balance / share_reserved / active_bid_count are recomputed"
          - "load.awarded_bid_id = null; load.awarded_member_id = null; load.freight_decision = PENDING; load.freight_subsidy_cents = 0; load.member_freight_due_cents = 0"
          - "load.status = BIDDING; load.version += 1"
      - from: AWARDED
        to: IN_TRANSIT
        trigger: "POST /network/loads/{id}/dispatch"
        actor: NetworkAdmin
        preconditions:
          - "load.status == AWARDED"
          - "load.safety_status == CLEAR"
          - "load.freight_decision IN {COVERED, DECLINED}"
          - "the awarded member's certification_status IN {CERTIFIED, PROBATION}"
          - "delivery_window_start < delivery_window_end and both are >= the current logical clock time"
          - "no other load of the same awarded member with status IN_TRANSIT has a delivery window that overlaps [delivery_window_start, delivery_window_end)"
        side_effects:
          - "load.status = IN_TRANSIT; load.version += 1"
          - "if load.freight_decision == COVERED: the DonorAgreement.freight_subsidy_used_cents is increased by load.freight_subsidy_cents"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /network/loads/{id}/deliver"
        actor: NetworkAdmin
        preconditions:
          - "load.status == IN_TRANSIT"
          - "load.safety_status IN {CLEAR, HELD} (a HELD load may still be physically delivered into quarantine)"
        side_effects:
          - "load.delivered_lbs = load.weight_lbs; load.meal_equivalent = floor(delivered_lbs / donor agreement meal_equivalency_factor)"
          - "HOP 1: ShareLedgerEntry entry_type ACTIVITY_BONUS amount +floor(delivered_lbs / 10000) * 15 appended for the awarded member"
          - "HOP 2 (caused by HOP 1): the member's share_balance recomputed; if certification_status == PROBATION and the new share_balance >= 100 and audit_score >= 85 the member is NOT auto-reinstated (reinstatement requires POST /network/members/{id}/reinstate)"
          - "load.status = DELIVERED; load.version += 1"
      - from: POSTED
        to: CANCELLED
        trigger: "POST /network/loads/{id}/cancel"
        actor: NetworkAdmin
        preconditions:
          - "load.status IN {POSTED, BIDDING}"
        side_effects:
          - "HOP 1: every SUBMITTED LoadBid on this load -> REJECTED with rejection_reason LOAD_CANCELLED"
          - "HOP 2 (caused by HOP 1): each rejection appends ShareLedgerEntry BID_RELEASE +shares_offered and recomputes that member's share_balance / share_reserved / active_bid_count"
          - "load.status = CANCELLED; load.version += 1"
      - from: BIDDING
        to: CANCELLED
        trigger: "POST /network/loads/{id}/cancel"
        actor: NetworkAdmin
        preconditions:
          - "load.status IN {POSTED, BIDDING}"
        side_effects:
          - "HOP 1: every SUBMITTED LoadBid on this load -> REJECTED with rejection_reason LOAD_CANCELLED"
          - "HOP 2 (caused by HOP 1): each rejection appends ShareLedgerEntry BID_RELEASE +shares_offered and recomputes that member's share_balance / share_reserved / active_bid_count"
          - "load.status = CANCELLED; load.version += 1"
      - from: CLEAR
        to: HELD
        trigger: "POST /network/recalls/{id}/trace (safety dimension)"
        actor: system
        preconditions:
          - "load.safety_status == CLEAR"
          - "load.lot_code == recall.lot_code and load.donor_agreement_id == recall.donor_agreement_id"
          - "load.status != DELIVERED"
          - "load.weight_lbs >= 500 (MIN_HOLD_LBS)"
        side_effects:
          - "load.safety_status = HELD; load.version += 1"
      - from: CLEAR
        to: RECALLED
        trigger: "POST /network/recalls/{id}/trace (safety dimension, delivered loads)"
        actor: system
        preconditions:
          - "load.safety_status == CLEAR"
          - "load.lot_code == recall.lot_code and load.donor_agreement_id == recall.donor_agreement_id"
          - "load.status == DELIVERED"
        side_effects:
          - "load.safety_status = RECALLED (terminal); load.version += 1"
      - from: HELD
        to: CLEAR
        trigger: "POST /network/recalls/{id}/resolve"
        actor: NetworkAdmin
        preconditions:
          - "load.safety_status == HELD"
          - "this recall's RecallHold for this load has hold_status RELEASED"
          - "no other ProductRecall has an ACTIVE RecallHold on this load"
        side_effects:
          - "load.safety_status = CLEAR; load.version += 1"

  - entity: MemberFoodBank
    initial_state: PENDING_CERTIFICATION
    terminal_states: []
    shape_note: |
      Cyclic posture machine: CERTIFIED -> PROBATION -> CERTIFIED is a legal loop, and
      PROBATION -> SUSPENDED -> PROBATION is a second loop. Every bidding and program operation is
      gated on the current posture.
    transitions:
      - from: PENDING_CERTIFICATION
        to: CERTIFIED
        trigger: "POST /network/members/{id}/certify"
        actor: NetworkAdmin
        preconditions:
          - "member.certification_status == PENDING_CERTIFICATION"
          - "member has at least one MemberAudit with audit_type COMPREHENSIVE and audit_status PASSED"
          - "member.storage_capacity_lbs > 0"
        side_effects:
          - "member.certification_status = CERTIFIED; member.audit_score = the latest COMPREHENSIVE PASSED audit's weighted_score"
          - "HOP 1: every StoreDonationProgram of this member with program_status PENDING -> ACTIVE"
          - "HOP 2 (caused by HOP 1): each newly ACTIVE program's SCHEDULED StorePickup rows keep their windows; the program becomes eligible for new pickups"
      - from: CERTIFIED
        to: PROBATION
        trigger: "POST /network/audits/{id}/complete with weighted_score < 85, or the award cascade in DonatedLoad.BIDDING_to_AWARDED when share_balance drops below 50"
        actor: system
        preconditions:
          - "member.certification_status == CERTIFIED"
        side_effects:
          - "member.certification_status = PROBATION; member.audit_score recomputed"
          - "HOP 1: every StoreDonationProgram of this member with program_status ACTIVE -> SUSPENDED"
          - "HOP 2 (caused by HOP 1): each SUSPENDED program's StorePickup rows still SCHEDULED with scheduled_date >= the current logical clock date -> MISSED"
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /network/audits/{id}/complete with weighted_score < 85 while already PROBATION"
        actor: system
        preconditions:
          - "member.certification_status == PROBATION"
          - "the completing MemberAudit.audit_status == FAILED"
        side_effects:
          - "member.certification_status = SUSPENDED; member.audit_score recomputed"
          - "HOP 1: every SUBMITTED LoadBid of this member -> WITHDRAWN with rejection_reason MEMBER_SUSPENDED"
          - "HOP 2 (caused by HOP 1): each withdrawal appends ShareLedgerEntry BID_RELEASE +shares_offered and recomputes share_balance / share_reserved / active_bid_count"
      - from: PROBATION
        to: CERTIFIED
        trigger: "POST /network/members/{id}/reinstate"
        actor: NetworkAdmin
        preconditions:
          - "member.certification_status == PROBATION"
          - "member.audit_score >= 85"
          - "member.share_balance >= 100"
        side_effects:
          - "member.certification_status = CERTIFIED"
          - "HOP 1: every StoreDonationProgram of this member with program_status SUSPENDED -> ACTIVE"
      - from: SUSPENDED
        to: PROBATION
        trigger: "POST /network/members/{id}/reinstate"
        actor: NetworkAdmin
        preconditions:
          - "member.certification_status == SUSPENDED"
          - "member.audit_score >= 85"
        side_effects:
          - "member.certification_status = PROBATION (a reinstated member re-enters at PROBATION, never directly at CERTIFIED)"

  - entity: LoadBid
    initial_state: SUBMITTED
    terminal_states: [AWARDED, REJECTED]
    shape_note: "Branching with compensation: SUBMITTED forks to AWARDED or REJECTED, and AWARDED can be compensated back to REJECTED when freight is declined."
    transitions:
      - from: NONE
        to: SUBMITTED
        trigger: "POST /network/loads/{id}/bids (creation)"
        actor: MemberFoodBank
        preconditions:
          - "load.status == BIDDING and load.safety_status == CLEAR"
          - "member.certification_status IN {CERTIFIED, PROBATION}"
          - "member.share_balance >= shares_offered"
          - "the member has no other LoadBid with bid_status SUBMITTED for the same load"
          - "storage fit: if load.storage_type IN {REFRIGERATED, FROZEN} then member.refrigerated_capacity_lbs >= load.weight_lbs, else member.storage_capacity_lbs >= load.weight_lbs"
        side_effects:
          - "LoadBid row created with bid_status SUBMITTED and submitted_round = 1 + count of this member's prior bids on this load"
          - "HOP 1: ShareLedgerEntry entry_type BID_HOLD amount -shares_offered appended for the member"
          - "HOP 2 (caused by HOP 1): member.share_balance recomputed (decreases by shares_offered), member.share_reserved increased by shares_offered, member.active_bid_count += 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /network/bids/{id}/withdraw, or the PROBATION/SUSPENDED cascades"
        actor: MemberFoodBank
        preconditions:
          - "bid.bid_status == SUBMITTED"
        side_effects:
          - "bid.bid_status = WITHDRAWN; bid.rejection_reason = WITHDRAWN_BY_MEMBER when member-initiated"
          - "HOP 1: ShareLedgerEntry BID_RELEASE amount +shares_offered appended"
          - "HOP 2 (caused by HOP 1): member.share_balance recomputed (+shares_offered), share_reserved decreased, active_bid_count -= 1"
      - from: SUBMITTED
        to: AWARDED
        trigger: "POST /network/loads/{id}/award (bid selected by the ranking selector)"
        actor: NetworkAdmin
        preconditions:
          - "the bid is the selector's winner per calculations.bid_ranking_score"
        side_effects:
          - "bid.bid_status = AWARDED"
          - "the winner's share movements and member recomputes are executed by the load-award cascade (see DonatedLoad.BIDDING_to_AWARDED)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /network/loads/{id}/award (another bid wins), POST /network/loads/{id}/cancel, or a recall safety hold on the load"
        actor: system
        preconditions:
          - "bid.bid_status == SUBMITTED"
        side_effects:
          - "bid.bid_status = REJECTED; rejection_reason set to LOSING_BID, LOAD_CANCELLED or LOAD_SAFETY_HOLD"
          - "HOP 1: ShareLedgerEntry BID_RELEASE +shares_offered appended"
          - "HOP 2 (caused by HOP 1): member.share_balance / share_reserved / active_bid_count recomputed"
      - from: AWARDED
        to: REJECTED
        trigger: "POST /network/loads/{id}/freight-decision with decision DECLINED for a member that cannot self-transport (compensation)"
        actor: system
        preconditions:
          - "bid.bid_status == AWARDED"
          - "the bid's can_self_transport == false"
        side_effects:
          - "bid.bid_status = REJECTED; bid.rejection_reason = FREIGHT_DECLINED"
          - "HOP 1: ShareLedgerEntry AWARD_REFUND +shares_offered appended"
          - "HOP 2 (caused by HOP 1): member.share_balance recomputed back to its pre-award value, active_bid_count -= 1"

  - entity: ProductRecall
    initial_state: OPEN
    terminal_states: []
    shape_note: "Cyclic: OPEN -> TRACING -> RESOLVED, and a later recall for an already-RESOLVED lot opens directly in REOPENED, which re-enters TRACING."
    transitions:
      - from: NONE
        to: OPEN
        trigger: "POST /network/recalls (no prior recall for this donor_agreement_id + lot_code)"
        actor: NetworkAdmin
        preconditions:
          - "no ProductRecall with the same donor_agreement_id and lot_code exists"
        side_effects:
          - "ProductRecall created with recall_status OPEN, traced_load_count 0, held_lbs 0, opened_at = current logical clock"
      - from: NONE
        to: REOPENED
        trigger: "POST /network/recalls (a ProductRecall with the same donor_agreement_id + lot_code already exists)"
        actor: NetworkAdmin
        preconditions:
          - "a ProductRecall with the same donor_agreement_id and lot_code exists in any state"
        side_effects:
          - "ProductRecall created with recall_status REOPENED (system-derived, not client-supplied); the prior recall row is left untouched"
      - from: OPEN
        to: TRACING
        trigger: "POST /network/recalls/{id}/trace"
        actor: NetworkAdmin
        preconditions:
          - "recall.recall_status IN {OPEN, REOPENED}"
        side_effects:
          - "HOP 1: every DonatedLoad with donor_agreement_id == recall.donor_agreement_id and lot_code == recall.lot_code is matched; recall.traced_load_count = count of matches"
          - "HOP 2 (caused by HOP 1): each matched load with weight_lbs >= 500 and status != DELIVERED gets a RecallHold row with hold_status ACTIVE; each matched load with status == DELIVERED has safety_status -> RECALLED instead"
          - "HOP 3 (caused by HOP 2): each newly HELD load whose status == BIDDING has its SUBMITTED LoadBid rows -> REJECTED with rejection_reason LOAD_SAFETY_HOLD, each appending ShareLedgerEntry BID_RELEASE and recomputing that member's share_balance / share_reserved / active_bid_count"
          - "recall.held_lbs = sum of weight_lbs over this recall's ACTIVE RecallHold rows; recall.recall_status = TRACING"
      - from: REOPENED
        to: TRACING
        trigger: "POST /network/recalls/{id}/trace"
        actor: NetworkAdmin
        preconditions:
          - "recall.recall_status IN {OPEN, REOPENED}"
        side_effects:
          - "identical trace cascade as OPEN_to_TRACING (HOP 1 -> HOP 2 -> HOP 3)"
      - from: TRACING
        to: RESOLVED
        trigger: "POST /network/recalls/{id}/resolve"
        actor: NetworkAdmin
        preconditions:
          - "recall.recall_status == TRACING"
          - "recall.held_lbs > 0 or recall.traced_load_count == 0"
        side_effects:
          - "HOP 1: every ACTIVE RecallHold of this recall -> RELEASED"
          - "HOP 2 (caused by HOP 1): each affected load whose safety_status == HELD and which has no other ACTIVE hold -> safety_status CLEAR"
          - "recall.held_lbs = 0; recall.recall_status = RESOLVED"

  - entity: MemberAudit
    initial_state: IN_PROGRESS
    terminal_states: [PASSED, FAILED]
    shape_note: "Linear per row with a cross-row re-audit loop: a FAILED audit is superseded by creating a new audit row, and the member posture loops between CERTIFIED and PROBATION."
    transitions:
      - from: NONE
        to: IN_PROGRESS
        trigger: "POST /network/audits (creation)"
        actor: NetworkAdmin
        preconditions:
          - "member exists and member.certification_status != SUSPENDED"
          - "storage_score, distribution_score, reporting_score each in [0, 100]"
        side_effects:
          - "MemberAudit created with audit_status IN_PROGRESS and weighted_score computed by calculations.audit_weighted_score"
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /network/audits/{id}/complete with weighted_score >= 85"
        actor: NetworkAdmin
        preconditions:
          - "audit.audit_status == IN_PROGRESS"
        side_effects:
          - "audit.audit_status = PASSED"
          - "HOP 1: member.audit_score = this audit's weighted_score"
          - "HOP 2 (caused by HOP 1): if member.certification_status == PENDING_CERTIFICATION the member stays PENDING until POST /network/members/{id}/certify; if PROBATION and audit_score >= 85 and share_balance >= 100 the member stays PROBATION until POST /network/members/{id}/reinstate"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /network/audits/{id}/complete with weighted_score < 85"
        actor: NetworkAdmin
        preconditions:
          - "audit.audit_status == IN_PROGRESS"
        side_effects:
          - "audit.audit_status = FAILED"
          - "HOP 1: member.audit_score = this audit's weighted_score"
          - "HOP 2 (caused by HOP 1): member.certification_status CERTIFIED -> PROBATION, or PROBATION -> SUSPENDED"
          - "HOP 3 (caused by HOP 2): when the member becomes PROBATION or SUSPENDED, each of its ACTIVE StoreDonationProgram rows -> SUSPENDED; when the member becomes SUSPENDED, each SUBMITTED LoadBid of the member -> WITHDRAWN with ShareLedgerEntry BID_RELEASE and member recompute"

  - entity: StoreDonationProgram
    initial_state: PENDING
    terminal_states: []
    shape_note: "Posture follows the owning member: PENDING -> ACTIVE on certification, ACTIVE <-> SUSPENDED as the member's posture changes."
    transitions:
      - from: NONE
        to: PENDING
        trigger: "POST /network/store-programs (owning member not CERTIFIED)"
        actor: MemberFoodBank
        preconditions:
          - "member.certification_status IN {PENDING_CERTIFICATION, PROBATION, SUSPENDED}"
        side_effects:
          - "program_status = PENDING; no pickups may be scheduled while PENDING"
      - from: NONE
        to: ACTIVE
        trigger: "POST /network/store-programs (owning member CERTIFIED)"
        actor: MemberFoodBank
        preconditions:
          - "member.certification_status == CERTIFIED"
        side_effects:
          - "program_status = ACTIVE"
      - from: PENDING
        to: ACTIVE
        trigger: "POST /network/members/{id}/certify cascade"
        actor: system
        preconditions:
          - "the owning member just transitioned to CERTIFIED"
        side_effects:
          - "program_status = ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "audit-failure cascade (member -> PROBATION or SUSPENDED), or the third consecutive MISSED pickup"
        actor: system
        preconditions:
          - "the owning member's certification_status IN {PROBATION, SUSPENDED}, or the program has 3 consecutive StorePickup rows with pickup_status MISSED"
        side_effects:
          - "program_status = SUSPENDED"
          - "HOP 1: the program's StorePickup rows still SCHEDULED with scheduled_date >= current logical clock date -> MISSED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /network/members/{id}/reinstate cascade"
        actor: system
        preconditions:
          - "the owning member transitioned to CERTIFIED"
        side_effects:
          - "program_status = ACTIVE"

  - entity: StorePickup
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED]
    shape_note: "Per-row linear; the missed-pickup loop is expressed across rows (a MISSED pickup is superseded by scheduling a new pickup on a later date)."
    transitions:
      - from: NONE
        to: SCHEDULED
        trigger: "POST /network/store-programs/{id}/pickups (creation)"
        actor: MemberFoodBank
        preconditions:
          - "program.program_status == ACTIVE"
          - "window_start < window_end and scheduled_date >= current logical clock date"
          - "no other SCHEDULED StorePickup of the same program has a window that overlaps [window_start, window_end)"
          - "the same program has no other SCHEDULED pickup whose window_start is less than 24 hours after this pickup's window_end (buffer rule)"
        side_effects:
          - "StorePickup created with pickup_status SCHEDULED and collected_lbs 0"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /network/store-pickups/{id}/complete"
        actor: MemberFoodBank
        preconditions:
          - "pickup.pickup_status == SCHEDULED"
          - "collected_lbs >= 0"
          - "the current logical clock time is within [window_start, window_end] or at most 48 hours after window_end"
        side_effects:
          - "pickup.pickup_status = COMPLETED; pickup.collected_lbs = supplied value; pickup.meal_equivalent = floor(collected_lbs / 1.2)"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /network/store-pickups/{id}/miss, or the program-suspension cascade"
        actor: MemberFoodBank
        preconditions:
          - "pickup.pickup_status == SCHEDULED"
        side_effects:
          - "pickup.pickup_status = MISSED"
          - "HOP 1: the program's consecutive-MISSED counter is recomputed over its pickups ordered by scheduled_date ASC, created_at ASC"
          - "HOP 2 (caused by HOP 1): if the counter reaches 3, program.program_status -> SUSPENDED and the program's remaining SCHEDULED pickups -> MISSED"

concurrency_rules:
  - rule_id: bid-create-stale-load
    parent_entity: DonatedLoad
    write_endpoint: "POST /network/loads/{id}/bids"
    occ_field: "expected_load_version"
    description: |
      Creating a LoadBid against a DonatedLoad whose version has advanced since the client last
      observed it is rejected. A member's new bid legitimately supersedes its own prior bid on the
      same load, and every accepted bid (or award, or safety hold) bumps the load's version, so a
      client that read the load before those writes holds a stale view and its create must be
      rejected rather than silently applied against the older load state.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: grant-create-stale-member
    parent_entity: MemberFoodBank
    write_endpoint: "POST /network/share-ledger/grants"
    occ_field: "expected_member_version"
    description: |
      Applying an epoch share grant to a MemberFoodBank whose version has advanced since the client
      last observed it is rejected. A new grant for the same epoch legitimately supersedes the
      member's prior provisional grant for that epoch, and any ledger movement (hold, release,
      award debit, activity bonus) bumps the member's version, so the client's stale view of the
      member must be rejected instead of being applied on top of those movements.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: share_grant_allocation
    trigger: "POST /network/share-ledger/grants for one epoch"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned: (1) eligible set, (2) per-member demand, (3) exact
      # proportional grant, (4) residual distribution. The residual step is the waterfall.
      eligible = members with certification_status IN {CERTIFIED, PROBATION}
      weight_i     = 100 if certification_status == CERTIFIED else PROBATION_WEIGHT_PCT
      base_i       = floor(food_insecure_population_i / 1000) * BASE_SHARES_PER_1000
      activity_i   = floor(prior_epoch_delivered_lbs_i / 10000) * ACTIVITY_SHARES_PER_10K_LBS
      demand_i     = floor((base_i + activity_i) * weight_i / 100)
      total_demand = sum(demand_i)
      grant_i      = floor(EPOCH_POOL_SHARES * demand_i / total_demand)
      residual     = EPOCH_POOL_SHARES - sum(grant_i)
      # residual shares handed out one at a time, ordered by
      # fractional_part DESC, tie-break member.created_at ASC (never by id)
      # Evaluation-order pin: every demand_i is computed from PRE-GRANT state in one pass;
      # applying one member's grant never feeds back into another member's demand within the
      # same epoch. The residual is then assigned in a single pass over the frozen fractional
      # parts, ordered by fractional_part DESC with member.created_at ASC as the tie-break.
      # Each grant appends ShareLedgerEntry(entry_type GRANT, amount = grant_i, epoch = epoch)
      # and sets member.last_grant_epoch = epoch.
    input_set: "Members with certification_status IN {CERTIFIED, PROBATION}; prior_epoch_delivered_lbs counts DonatedLoad rows with status DELIVERED and delivered_lbs > 0 whose delivery happened in the prior epoch"
    constants:
      EPOCH_POOL_SHARES: 100000
      BASE_SHARES_PER_1000: 120
      ACTIVITY_SHARES_PER_10K_LBS: 15
      PROBATION_WEIGHT_PCT: 50
    precision: "integer shares; floor on every division; residual assigned one share at a time"
    variants:
      - name: forward_looking_activity
        when: "the grant request carries activity_basis: FORWARD_LOOKING"
        difference: "activity_i counts prior-epoch loads with status IN {AWARDED, IN_TRANSIT, DELIVERED} instead of DELIVERED only, so a member with committed-but-undelivered pounds receives a strictly larger activity term and therefore a larger grant for identical delivered data."
  - name: bid_ranking_score
    trigger: "POST /network/loads/{id}/award"
    algorithm: weighted_scoring
    formula: |
      eligibility (candidate set):
        bid.bid_status == SUBMITTED
        AND member.certification_status IN {CERTIFIED, PROBATION}
        AND member.share_balance >= bid.shares_offered
        AND (load.storage_type IN {REFRIGERATED, FROZEN}
               ? member.refrigerated_capacity_lbs >= load.weight_lbs
               : member.storage_capacity_lbs >= load.weight_lbs)
      score(bid) = bid.shares_offered * 100
                 + (bid.can_self_transport ? 40 : 0)
                 + transport_bonus(member.transport_ability)   # NATIONAL 30, REGIONAL 20, LOCAL 10, NONE 0
                 - floor(load.distance_miles / 100) * 2
                 - (member.certification_status == PROBATION ? 25 : 0)
      winner = candidate with max score
      tie-break 1: bid.created_at ASC
      tie-break 2: member.created_at ASC
      empty candidate set -> ERR_NO_ELIGIBLE_BIDS
    input_set: "LoadBid rows of the target load with bid_status SUBMITTED, filtered by the eligibility predicate above"
    constants:
      SHARES_SCORE_MULTIPLIER: 100
      SELF_TRANSPORT_BONUS: 40
      PROBATION_PENALTY: 25
      DISTANCE_PENALTY_PER_100_MILES: 2
    precision: "integer score; no rounding required"
    variants:
      - name: preference_first
        when: "the award request carries ranking_basis: PREFERENCE_FIRST"
        difference: "sorts by bid.preference_rank ASC first and uses score only to break ties among equal preference_rank, so a member's own stated priority outranks the network's transport-efficiency score."
  - name: freight_subsidy_cents
    trigger: "POST /network/loads/{id}/award (provisional) and POST /network/loads/{id}/freight-decision (final)"
    algorithm: tiered_pricing
    formula: |
      base = (distance_miles + detour_miles) * FREIGHT_CENTS_PER_MILE
      share_pct = 0                       if member.can_self_transport
                  NATIONAL_TRANSPORT_PCT  if member.transport_ability == NATIONAL
                  REGIONAL_TRANSPORT_PCT  if member.transport_ability == REGIONAL
                  LOCAL_TRANSPORT_PCT     if member.transport_ability == LOCAL
                  NONE_TRANSPORT_PCT      if member.transport_ability == NONE
      raw = ceil(base * share_pct / 100)
      uplift = (NOT member.can_self_transport
                AND distance_miles >= REMOTE_DISTANCE_THRESHOLD_MILES
                AND member.transport_ability IN {NONE, LOCAL})
               ? ceil(base * REMOTE_UPLIFT_PCT / 100) : 0
      # evaluation order pinned: per-component ceil, then sum, then the nested min cap
      subsidy = min(raw + uplift, pool_remaining_cents, MAX_SUBSIDY_PER_LOAD_CENTS)
      if subsidy < MIN_SUBSIDY_CENTS: subsidy = 0
      decision = COVERED if subsidy > 0 else (DECLINED if NOT member.can_self_transport else COVERED)
      member_freight_due_cents = base - subsidy
    input_set: "The awarded load and its awarded member; pool_remaining_cents = agreement.freight_subsidy_pool_cents - agreement.freight_subsidy_used_cents"
    constants:
      FREIGHT_CENTS_PER_MILE: 185
      NATIONAL_TRANSPORT_PCT: 30
      REGIONAL_TRANSPORT_PCT: 55
      LOCAL_TRANSPORT_PCT: 75
      NONE_TRANSPORT_PCT: 100
      REMOTE_DISTANCE_THRESHOLD_MILES: 400
      REMOTE_UPLIFT_PCT: 15
      MAX_SUBSIDY_PER_LOAD_CENTS: 250000
      MIN_SUBSIDY_CENTS: 5000
    precision: "integer cents; ceil per component before summing"
    variants:
      - name: provisional_estimate
        when: "computed during POST /network/loads/{id}/award"
        difference: "detour_miles is fixed at 0, so the provisional subsidy uses distance_miles only and is always <= the final subsidy when a detour is later recorded."
  - name: meal_equivalency_total
    trigger: "GET /network/donor-agreements/{id}/poundage-summary"
    algorithm: aggregation
    formula: |
      # Rounding order pinned: PER-LOAD floor first, then sum (canonical reporting variant).
      per_load_meals = floor(load.delivered_lbs / agreement.meal_equivalency_factor)
      total_meals    = sum(per_load_meals) over loads with status DELIVERED and delivered_lbs > 0
      total_lbs      = sum(delivered_lbs) over the same set
    input_set: "DonatedLoad rows of the agreement with status DELIVERED and delivered_lbs > 0; loads with status CANCELLED or safety_status RECALLED are excluded"
    constants:
      NETWORK_MEAL_FACTOR: 1.2
    precision: "integer meals; floor per load before summing"
    variants:
      - name: sum_then_divide
        when: "the summary request carries rounding_basis: SUM_THEN_DIVIDE"
        difference: "computes floor(total_lbs / factor) instead of summing per-load floors, so identical loads yield a different (usually larger) meal total whenever per-load remainders accumulate."
  - name: share_balance_recompute
    trigger: "every ShareLedgerEntry append (grant, hold, release, award debit, award refund, activity bonus, recall refund)"
    algorithm: chronological
    formula: |
      entries = ShareLedgerEntry rows of the member ordered by created_at ASC, tie-break append sequence ASC
      balance = sum(amount) over entries
      reserved = sum(shares_offered) over the member's LoadBid rows with bid_status == SUBMITTED
      member.share_balance = balance
      member.share_reserved = reserved
      member.active_bid_count = count of the member's LoadBid rows with bid_status == SUBMITTED
    input_set: "All ShareLedgerEntry rows of the member (append-only; no rows are ever deleted or edited)"
    constants:
      PROBATION_FLOOR_SHARES: 50
      REINSTATEMENT_MIN_SHARES: 100
    precision: "integer shares; exact"
    variants:
      - name: reserved_aware_available
        when: "the caller asks for available_for_bidding"
        difference: "returns share_balance - share_reserved while the base recompute returns the gross balance; the stored share_balance field always holds the gross value."
  - name: audit_weighted_score
    trigger: "POST /network/audits (creation) and POST /network/audits/{id}/complete"
    algorithm: weighted_scoring
    formula: |
      weights = { STORAGE: (60,20,20), DISTRIBUTION: (20,60,20), REPORTING: (20,20,60), COMPREHENSIVE: (40,30,30) }
      (w_s, w_d, w_r) = weights[audit_type]
      weighted_score = round_half_up(storage_score * w_s / 100 + distribution_score * w_d / 100 + reporting_score * w_r / 100, 1)
      audit_status  = PASSED if weighted_score >= AUDIT_PASS_THRESHOLD else FAILED
    input_set: "The three component scores supplied on the audit row"
    constants:
      AUDIT_PASS_THRESHOLD: 85
    precision: "1 decimal place, round_half_up"
    variants:
      - name: strict_storage
        when: "the member has any FAILED STORAGE audit in the last 12 months"
        difference: "storage weight is raised to 70 and distribution/reporting drop to 15 each, so an identical score triple can cross the pass threshold in the opposite direction."
  - name: recall_hold_selection
    trigger: "POST /network/recalls/{id}/trace"
    algorithm: threshold
    formula: |
      matched = DonatedLoad rows with donor_agreement_id == recall.donor_agreement_id AND lot_code == recall.lot_code
      traced_load_count = count(matched)
      held  = matched rows where weight_lbs >= MIN_HOLD_LBS AND status != DELIVERED
      delivered_matched = matched rows where status == DELIVERED  -> safety_status = RECALLED
      held_lbs = sum(weight_lbs) over held
    input_set: "All DonatedLoad rows of the agreement whose lot_code equals the recall's lot_code, in any status except CANCELLED"
    constants:
      MIN_HOLD_LBS: 500
    precision: "integer pounds; exact"
    variants:
      - name: donor_wide_hold
        when: "the recall request carries scope: DONOR_WIDE"
        difference: "matches every load of the donor agreement regardless of lot_code, so traced_load_count and held_lbs are strictly larger for the same recall row."

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role names a role declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: business_constraint
    check: "the request body parses and every required input field for the endpoint is present with the declared type; malformed JSON, unknown enum members and missing required fields are rejected before any existence, state or business check runs"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints that take a request body"
  - priority: 3
    category: auth
    check: "segregation of duties: the operator completing a MemberAudit (X-User-ID) must differ from the operator who created that audit (MemberAudit.opened_by_user_id); the same operator may not create and complete the same audit even when both calls carry an authorized role"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /network/audits/{id}/complete"
  - priority: 4
    category: auth
    check: "the acting role is listed in the endpoint's roles, and for MemberFoodBank callers the acting X-User-ID owns the resource being acted on (a member may only withdraw its own bid; acting on another member's bid is ERR_FORBIDDEN)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 5
    category: existence
    check: "MemberFoodBank referenced by the path id or by member_id in the body exists"
    error_id: ERR_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "GET /network/members/{id}, POST /network/members/{id}/certify, POST /network/members/{id}/reinstate, POST /network/loads/{id}/bids, POST /network/audits, POST /network/store-programs, POST /network/share-ledger/grants"
  - priority: 6
    category: existence
    check: "DonorAgreement referenced by the path id or by donor_agreement_id in the body exists"
    error_id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /network/donor-agreements/{id}, POST /network/donor-agreements/{id}/activate, GET /network/donor-agreements/{id}/poundage-summary, POST /network/loads, POST /network/recalls"
  - priority: 7
    category: existence
    check: "DonatedLoad referenced by the path id or by load_id in the body exists"
    error_id: ERR_LOAD_NOT_FOUND
    http_status: 404
    applies_to: "GET /network/loads/{id}, POST /network/loads/{id}/post, POST /network/loads/{id}/award, POST /network/loads/{id}/freight-decision, POST /network/loads/{id}/dispatch, POST /network/loads/{id}/deliver, POST /network/loads/{id}/cancel, POST /network/loads/{id}/bids"
  - priority: 8
    category: existence
    check: "LoadBid referenced by the path id exists"
    error_id: ERR_BID_NOT_FOUND
    http_status: 404
    applies_to: "POST /network/bids/{id}/withdraw"
  - priority: 9
    category: existence
    check: "ProductRecall referenced by the path id exists"
    error_id: ERR_RECALL_NOT_FOUND
    http_status: 404
    applies_to: "POST /network/recalls/{id}/trace, POST /network/recalls/{id}/resolve"
  - priority: 10
    category: existence
    check: "MemberAudit referenced by the path id exists"
    error_id: ERR_AUDIT_NOT_FOUND
    http_status: 404
    applies_to: "POST /network/audits/{id}/complete"
  - priority: 11
    category: existence
    check: "StoreDonationProgram referenced by the path id or by program_id in the body exists"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "GET /network/store-programs/{id}, POST /network/store-programs/{id}/pickups"
  - priority: 12
    category: existence
    check: "StorePickup referenced by the path id exists"
    error_id: ERR_PICKUP_NOT_FOUND
    http_status: 404
    applies_to: "POST /network/store-pickups/{id}/complete, POST /network/store-pickups/{id}/miss"
  - priority: 13
    category: business_constraint
    check: "expected_load_version on bid creation equals the current DonatedLoad.version, and expected_member_version on share grants equals the current MemberFoodBank.version; a mismatch is rejected before any state or business rule is evaluated"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /network/loads/{id}/bids, POST /network/share-ledger/grants"
  - priority: 14
    category: state
    check: "DonatedLoad.status is POSTED for post, BIDDING for award, AWARDED for freight-decision and dispatch, IN_TRANSIT for deliver, and IN {POSTED, BIDDING} for cancel (error ids: ERR_LOAD_NOT_POSTED, ERR_LOAD_NOT_BIDDING, ERR_LOAD_NOT_AWARDED, ERR_LOAD_NOT_IN_TRANSIT)"
    error_id: ERR_LOAD_NOT_POSTED
    http_status: 409
    applies_to: "POST /network/loads/{id}/post, POST /network/loads/{id}/award, POST /network/loads/{id}/freight-decision, POST /network/loads/{id}/dispatch, POST /network/loads/{id}/deliver, POST /network/loads/{id}/cancel"
  - priority: 15
    category: state
    check: "DonatedLoad.freight_decision is still PENDING when POST /network/loads/{id}/freight-decision is called"
    error_id: ERR_FREIGHT_DECISION_ALREADY_MADE
    http_status: 409
    applies_to: "POST /network/loads/{id}/freight-decision"
  - priority: 16
    category: state
    check: "LoadBid.bid_status is SUBMITTED for withdraw, and the bidding member owns the bid"
    error_id: ERR_BID_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /network/bids/{id}/withdraw"
  - priority: 17
    category: state
    check: "ProductRecall.recall_status is IN {OPEN, REOPENED} for trace and TRACING for resolve"
    error_id: ERR_RECALL_NOT_TRACING
    http_status: 409
    applies_to: "POST /network/recalls/{id}/trace, POST /network/recalls/{id}/resolve"
  - priority: 18
    category: state
    check: "MemberAudit.audit_status is IN_PROGRESS for complete (ERR_AUDIT_NOT_IN_PROGRESS); StorePickup.pickup_status is SCHEDULED for complete and miss (ERR_PICKUP_NOT_SCHEDULED)"
    error_id: ERR_AUDIT_NOT_IN_PROGRESS
    http_status: 409
    applies_to: "POST /network/audits/{id}/complete, POST /network/store-pickups/{id}/complete, POST /network/store-pickups/{id}/miss"
  - priority: 19
    category: state
    check: "MemberFoodBank.certification_status is PENDING_CERTIFICATION for certify and IN {PROBATION, SUSPENDED} for reinstate"
    error_id: ERR_MEMBER_NOT_PENDING
    http_status: 409
    applies_to: "POST /network/members/{id}/certify, POST /network/members/{id}/reinstate"
  - priority: 20
    category: business_safety
    check: "DonatedLoad.safety_status is CLEAR for post, bid creation, award and dispatch; a HELD or RECALLED load is rejected even when every other rule would pass"
    error_id: ERR_LOAD_SAFETY_HOLD
    http_status: 409
    applies_to: "POST /network/loads/{id}/post, POST /network/loads/{id}/bids, POST /network/loads/{id}/award, POST /network/loads/{id}/dispatch"
  - priority: 21
    category: business_safety
    check: "a DonatedLoad whose safety_status is RECALLED cannot be dispatched or delivered; HELD loads may be delivered only into quarantine"
    error_id: ERR_LOAD_RECALLED
    http_status: 409
    applies_to: "POST /network/loads/{id}/dispatch, POST /network/loads/{id}/deliver"
  - priority: 22
    category: business_constraint
    check: "the member has no other LoadBid with bid_status SUBMITTED on the same load"
    error_id: ERR_DUPLICATE_BID
    http_status: 409
    applies_to: "POST /network/loads/{id}/bids"
  - priority: 23
    category: business_constraint
    check: "storage fit: REFRIGERATED or FROZEN loads require member.refrigerated_capacity_lbs >= load.weight_lbs; DRY loads require member.storage_capacity_lbs >= load.weight_lbs"
    error_id: ERR_STORAGE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /network/loads/{id}/bids, POST /network/loads/{id}/award"
  - priority: 24
    category: business_constraint
    check: "the acting member's certification_status IN {CERTIFIED, PROBATION} to bid, and == CERTIFIED to schedule pickups; SUSPENDED members are rejected with ERR_MEMBER_SUSPENDED"
    error_id: ERR_MEMBER_NOT_CERTIFIED
    http_status: 403
    applies_to: "POST /network/loads/{id}/bids, POST /network/store-programs, POST /network/store-programs/{id}/pickups"
  - priority: 25
    category: business_constraint
    check: "the DonorAgreement is ACTIVE before a new load is created against it"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /network/loads"
  - priority: 26
    category: business_constraint
    check: "the award selector's candidate set is non-empty; zero SUBMITTED bids, or bids that all fail the eligibility predicate, is rejected"
    error_id: ERR_NO_ELIGIBLE_BIDS
    http_status: 409
    applies_to: "POST /network/loads/{id}/award"
  - priority: 27
    category: business_constraint
    check: "storage_score, distribution_score and reporting_score are each integers in [0, 100]"
    error_id: ERR_AUDIT_SCORE_OUT_OF_RANGE
    http_status: 400
    applies_to: "POST /network/audits"
  - priority: 28
    category: business_referential
    check: "DonatedLoad.product_category equals its DonorAgreement.product_category, and ProductRecall.product_category equals its DonorAgreement.product_category"
    error_id: ERR_CATEGORY_MISMATCH
    http_status: 409
    applies_to: "POST /network/loads, POST /network/recalls"
  - priority: 29
    category: business_temporal
    check: "delivery_window_start < delivery_window_end, both at or after the current logical clock time, and the window does not overlap any other IN_TRANSIT load of the same awarded member (half-open intervals: touching endpoints are allowed; malformed windows raise ERR_DELIVERY_WINDOW_INVALID, collisions raise ERR_DELIVERY_WINDOW_OVERLAP)"
    error_id: ERR_DELIVERY_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /network/loads/{id}/dispatch"
  - priority: 30
    category: business_temporal
    check: "pickup windows are ordered, fall on scheduled_date, do not overlap another SCHEDULED pickup of the same program, and keep at least 24 hours between one pickup's window_end and the next pickup's window_start; malformed windows raise ERR_PICKUP_WINDOW_INVALID, collisions raise ERR_PICKUP_WINDOW_OVERLAP"
    error_id: ERR_PICKUP_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /network/store-programs/{id}/pickups"
  - priority: 31
    category: business_fiscal
    check: "member.share_balance >= shares_offered at bid creation and at award time (equality is allowed: a member may commit its exact balance)"
    error_id: ERR_INSUFFICIENT_SHARES
    http_status: 409
    applies_to: "POST /network/loads/{id}/bids, POST /network/loads/{id}/award"
  - priority: 32
    category: business_fiscal
    check: "the agreement's remaining subsidy pool (freight_subsidy_pool_cents - freight_subsidy_used_cents) is at least MIN_SUBSIDY_CENTS when a subsidy is requested for a member that cannot self-transport"
    error_id: ERR_SUBSIDY_POOL_EXHAUSTED
    http_status: 409
    applies_to: "POST /network/loads/{id}/freight-decision"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  - method: POST
    path: "/network/members"
    description: "Register a member food bank in PENDING_CERTIFICATION with zero share balance."
    roles: [NetworkAdmin]
    code: 201
    input: [name, state_code, food_insecure_population, storage_capacity_lbs, refrigerated_capacity_lbs, transport_ability]
    output: MemberFoodBank
    side_effects: ["initializes certification_status PENDING_CERTIFICATION, share_balance 0, share_reserved 0, audit_score 0, active_bid_count 0"]
  - method: GET
    path: "/network/members/{id}"
    description: "Read one member food bank."
    roles: [NetworkAdmin, MemberFoodBank]
    code: 200
    input: []
    output: MemberFoodBank
    side_effects: []
  - method: POST
    path: "/network/members/{id}/certify"
    description: "Certify a PENDING member after a passed COMPREHENSIVE audit; activates its PENDING store programs."
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: MemberFoodBank
    side_effects: ["member.certification_status -> CERTIFIED", "cascade: PENDING StoreDonationProgram rows -> ACTIVE", "increments MemberFoodBank.version by 1"]
  - method: POST
    path: "/network/members/{id}/reinstate"
    description: "Reinstate a PROBATION member to CERTIFIED or a SUSPENDED member to PROBATION."
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: MemberFoodBank
    side_effects: ["member.certification_status -> CERTIFIED (from PROBATION) or PROBATION (from SUSPENDED)", "cascade: SUSPENDED StoreDonationProgram rows -> ACTIVE when the member becomes CERTIFIED", "increments MemberFoodBank.version by 1"]
  - method: POST
    path: "/network/donor-agreements"
    description: "Create a national donor agreement in DRAFT."
    roles: [NetworkAdmin]
    code: 201
    input: [donor_name, donor_type, product_category, committed_lbs, freight_subsidy_pool_cents, "meal_equivalency_factor?"]
    output: DonorAgreement
    side_effects: ["initializes status DRAFT and freight_subsidy_used_cents 0"]
  - method: GET
    path: "/network/donor-agreements/{id}"
    description: "Read one donor agreement."
    roles: [NetworkAdmin, MemberFoodBank]
    code: 200
    input: []
    output: DonorAgreement
    side_effects: []
  - method: POST
    path: "/network/donor-agreements/{id}/activate"
    description: "Move a DRAFT or SUSPENDED donor agreement to ACTIVE so loads can be created against it."
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: DonorAgreement
    side_effects: ["agreement.status -> ACTIVE", "increments DonorAgreement.version by 1"]
  - method: GET
    path: "/network/donor-agreements/{id}/poundage-summary"
    description: "Donor-facing poundage and meal-equivalency rollup for one agreement."
    roles: [NetworkAdmin, MemberFoodBank]
    code: 200
    input: ["rounding_basis?"]
    output: { donor_agreement_id: string, total_lbs: integer, total_meals: integer, delivered_load_count: integer }
    side_effects: ["recomputes calculations.meal_equivalency_total"]
  - method: POST
    path: "/network/loads"
    description: "Create a donated truckload in POSTED against an ACTIVE agreement."
    roles: [NetworkAdmin]
    code: 201
    input: [donor_agreement_id, product_category, storage_type, weight_lbs, lot_code, origin_zip, destination_region, distance_miles]
    output: DonatedLoad
    side_effects: ["initializes status POSTED, safety_status CLEAR, freight_decision PENDING, delivered_lbs 0, meal_equivalent 0"]
  - method: GET
    path: "/network/loads/{id}"
    description: "Read one donated load."
    roles: [NetworkAdmin, MemberFoodBank]
    code: 200
    input: []
    output: DonatedLoad
    side_effects: []
  - method: POST
    path: "/network/loads/{id}/post"
    description: "Open a POSTED load for bidding."
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: DonatedLoad
    side_effects: ["load.status -> BIDDING", "increments DonatedLoad.version by 1"]
  - method: POST
    path: "/network/loads/{id}/award"
    description: "Run the bid ranking selector and award the load to the winning member."
    roles: [NetworkAdmin]
    code: 200
    input: ["ranking_basis?"]
    output: DonatedLoad
    side_effects: ["winner LoadBid -> AWARDED, losing bids -> REJECTED", "ShareLedgerEntry BID_RELEASE for every losing and winning hold, then AWARD_DEBIT for the winner", "member share_balance / share_reserved / active_bid_count recomputed for every affected member", "member may cascade to PROBATION and auto-withdraw its other SUBMITTED bids", "load.freight_estimate_cents recomputed; load.status -> AWARDED", "increments DonatedLoad.version by 1"]
  - method: POST
    path: "/network/loads/{id}/freight-decision"
    description: "Record the network's freight coverage decision for the awarded member."
    roles: [NetworkAdmin]
    code: 200
    input: [decision, "detour_miles?"]
    output: DonatedLoad
    side_effects: ["calculations.freight_subsidy_cents recomputed (final variant)", "agreement.freight_subsidy_used_cents increased when COVERED", "DECLINED for a member that cannot self-transport reverts the load to BIDDING and compensates the awarded bid", "increments DonatedLoad.version by 1"]
  - method: POST
    path: "/network/loads/{id}/dispatch"
    description: "Dispatch an awarded load with a delivery appointment window."
    roles: [NetworkAdmin]
    code: 200
    input: [delivery_window_start, delivery_window_end]
    output: DonatedLoad
    side_effects: ["load.status -> IN_TRANSIT", "increments DonatedLoad.version by 1"]
  - method: POST
    path: "/network/loads/{id}/deliver"
    description: "Confirm delivery of an in-transit load and accrue the member's activity bonus."
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: DonatedLoad
    side_effects: ["load.delivered_lbs = weight_lbs; load.meal_equivalent recomputed", "ShareLedgerEntry ACTIVITY_BONUS appended", "member share_balance recomputed", "load.status -> DELIVERED", "increments DonatedLoad.version by 1"]
  - method: POST
    path: "/network/loads/{id}/cancel"
    description: "Cancel a load that has not been awarded; releases every bid hold."
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: DonatedLoad
    side_effects: ["every SUBMITTED bid -> REJECTED with LOAD_CANCELLED and ShareLedgerEntry BID_RELEASE", "member share_balance / share_reserved / active_bid_count recomputed", "load.status -> CANCELLED", "increments DonatedLoad.version by 1"]
  - method: POST
    path: "/network/loads/{id}/bids"
    description: "Member food bank submits a bid in share currency for a posted load."
    roles: [MemberFoodBank]
    code: 201
    input: [member_id, shares_offered, preference_rank, can_self_transport, expected_load_version]
    output: LoadBid
    side_effects: ["ShareLedgerEntry BID_HOLD appended", "member share_balance / share_reserved / active_bid_count recomputed", "increments DonatedLoad.version by 1"]
  - method: GET
    path: "/network/bids"
    description: "List bids with optional filters."
    roles: [NetworkAdmin, MemberFoodBank]
    code: 200
    input: ["load_id?", "member_id?", "bid_status?", "limit?", "offset?"]
    output: LoadBid[]
    side_effects: []
  - method: POST
    path: "/network/bids/{id}/withdraw"
    description: "Withdraw a submitted bid and release its share hold."
    roles: [MemberFoodBank, NetworkAdmin]
    code: 200
    input: []
    output: LoadBid
    side_effects: ["bid.bid_status -> WITHDRAWN", "ShareLedgerEntry BID_RELEASE appended", "member share_balance / share_reserved / active_bid_count recomputed"]
  - method: POST
    path: "/network/share-ledger/grants"
    description: "Apply one epoch's share grant to a member using the allocation calculation."
    roles: [NetworkAdmin]
    code: 201
    input: [member_id, epoch, "activity_basis?", expected_member_version]
    output: ShareLedgerEntry
    side_effects: ["calculations.share_grant_allocation executed for the epoch", "ShareLedgerEntry GRANT appended", "member.share_balance recomputed and last_grant_epoch set", "increments MemberFoodBank.version by 1"]
  - method: POST
    path: "/network/recalls"
    description: "Open a product recall for a donor lot; a second recall on an already-recalled lot opens in REOPENED."
    roles: [NetworkAdmin]
    code: 201
    input: [donor_agreement_id, lot_code, product_category, affected_lbs, "scope?"]
    output: ProductRecall
    side_effects: ["recall_status OPEN when the lot has no prior recall, REOPENED otherwise", "opened_at stamped from the logical clock"]
  - method: POST
    path: "/network/recalls/{id}/trace"
    description: "Trace the recall across the network: match loads by lot, place holds, reject affected bids."
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: ProductRecall
    side_effects: ["traced_load_count and held_lbs recomputed", "RecallHold rows created for matched non-delivered loads with weight_lbs >= 500", "matched delivered loads -> safety_status RECALLED", "HELD loads in BIDDING have their SUBMITTED bids rejected with LOAD_SAFETY_HOLD and holds released", "recall_status -> TRACING"]
  - method: POST
    path: "/network/recalls/{id}/resolve"
    description: "Resolve a traced recall and release every hold it placed."
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: ProductRecall
    side_effects: ["every ACTIVE RecallHold -> RELEASED", "held loads with no other ACTIVE hold -> safety_status CLEAR", "recall.held_lbs = 0; recall_status -> RESOLVED"]
  - method: GET
    path: "/network/recall-holds"
    description: "List recall holds with optional filters."
    roles: [NetworkAdmin, MemberFoodBank]
    code: 200
    input: ["recall_id?", "load_id?", "hold_status?", "limit?", "offset?"]
    output: RecallHold[]
    side_effects: []
  - method: POST
    path: "/network/audits"
    description: "Open a member standards audit in IN_PROGRESS and compute its weighted score."
    roles: [NetworkAdmin]
    code: 201
    input: [member_id, audit_type, storage_score, distribution_score, reporting_score]
    output: MemberAudit
    side_effects: ["calculations.audit_weighted_score executed", "audit_status IN_PROGRESS", "opened_by_user_id stamped from X-User-ID"]
  - method: POST
    path: "/network/audits/{id}/complete"
    description: "Complete an audit, pass or fail the member, and cascade the member's posture."
    roles: [NetworkAuditor]
    code: 200
    input: []
    output: MemberAudit
    side_effects: ["audit_status -> PASSED when weighted_score >= 85 else FAILED", "member.audit_score updated", "member posture cascade (CERTIFIED -> PROBATION, PROBATION -> SUSPENDED)", "member's ACTIVE store programs -> SUSPENDED", "SUSPENDED member's SUBMITTED bids -> WITHDRAWN with BID_RELEASE"]
  - method: POST
    path: "/network/store-programs"
    description: "Register a retail store donation program for a member."
    roles: [MemberFoodBank, NetworkAdmin]
    code: 201
    input: [member_id, store_name, store_chain, pickup_frequency, expected_weekly_lbs]
    output: StoreDonationProgram
    side_effects: ["program_status ACTIVE when the member is CERTIFIED, otherwise PENDING"]
  - method: GET
    path: "/network/store-programs/{id}"
    description: "Read one store donation program."
    roles: [NetworkAdmin, MemberFoodBank]
    code: 200
    input: []
    output: StoreDonationProgram
    side_effects: []
  - method: POST
    path: "/network/store-programs/{id}/pickups"
    description: "Schedule a retail pickup window for an ACTIVE program."
    roles: [MemberFoodBank]
    code: 201
    input: [scheduled_date, window_start, window_end]
    output: StorePickup
    side_effects: ["pickup_status SCHEDULED, collected_lbs 0"]
  - method: POST
    path: "/network/store-pickups/{id}/complete"
    description: "Complete a scheduled pickup and record collected poundage."
    roles: [MemberFoodBank]
    code: 200
    input: [collected_lbs]
    output: StorePickup
    side_effects: ["pickup_status -> COMPLETED", "meal_equivalent recomputed from collected_lbs"]
  - method: POST
    path: "/network/store-pickups/{id}/miss"
    description: "Mark a scheduled pickup missed; the third consecutive miss suspends the program."
    roles: [MemberFoodBank]
    code: 200
    input: []
    output: StorePickup
    side_effects: ["pickup_status -> MISSED", "consecutive-miss counter recomputed", "program -> SUSPENDED and remaining SCHEDULED pickups -> MISSED when the counter reaches 3"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. The server's startup default is 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time before the first call."
    roles: [NetworkAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["all window, expiry and scheduled_date comparisons use the new logical clock value"]
  - method: GET
    path: "/network/members/{id}/audits"
    description: "List the member's standards audits (reverse reachability for MemberAudit.member_id)."
    roles: [NetworkAdmin, MemberFoodBank, NetworkAuditor]
    code: 200
    input: ["audit_status?", "limit?", "offset?"]
    output: MemberAudit[]
    side_effects: []
  - method: GET
    path: "/network/members/{id}/share-ledger"
    description: "List the member's share ledger entries in append order (reverse reachability for ShareLedgerEntry.member_id)."
    roles: [NetworkAdmin, MemberFoodBank]
    code: 200
    input: ["epoch?", "limit?", "offset?"]
    output: ShareLedgerEntry[]
    side_effects: []
  - method: GET
    path: "/network/members/{id}/store-programs"
    description: "List the member's retail store donation programs (reverse reachability for StoreDonationProgram.member_id)."
    roles: [NetworkAdmin, MemberFoodBank]
    code: 200
    input: ["program_status?", "limit?", "offset?"]
    output: StoreDonationProgram[]
    side_effects: []
  - method: GET
    path: "/network/donor-agreements/{id}/loads"
    description: "List the agreement's donated loads (reverse reachability for DonatedLoad.donor_agreement_id)."
    roles: [NetworkAdmin, MemberFoodBank]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DonatedLoad[]
    side_effects: []
  - method: GET
    path: "/network/donor-agreements/{id}/recalls"
    description: "List the agreement's recalls (reverse reachability for ProductRecall.donor_agreement_id)."
    roles: [NetworkAdmin, MemberFoodBank]
    code: 200
    input: ["recall_status?", "limit?", "offset?"]
    output: ProductRecall[]
    side_effects: []
  - method: GET
    path: "/network/bids/{id}"
    description: "Read one bid (child segment backing the filtered bid list)."
    roles: [NetworkAdmin, MemberFoodBank]
    code: 200
    input: []
    output: LoadBid
    side_effects: []
  - method: GET
    path: "/network/recall-holds/{id}"
    description: "Read one recall hold (child segment backing the filtered hold list)."
    roles: [NetworkAdmin, MemberFoodBank]
    code: 200
    input: []
    output: RecallHold
    side_effects: []
  - method: GET
    path: "/network/store-programs/{id}/pickups"
    description: "List the program's pickups (reverse reachability for StorePickup.program_id)."
    roles: [NetworkAdmin, MemberFoodBank]
    code: 200
    input: ["pickup_status?", "limit?", "offset?"]
    output: StorePickup[]
    side_effects: []

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the operator completing a MemberAudit is the same operator recorded in that audit's opened_by_user_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "required input field missing, unknown enum member, wrong type, or malformed body on any endpoint that takes a request body"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "no MemberFoodBank matches the path id or the member_id in the body"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "no DonorAgreement matches the path id or the donor_agreement_id in the body"
  - id: ERR_LOAD_NOT_FOUND
    http: 404
    condition: "no DonatedLoad matches the path id"
  - id: ERR_BID_NOT_FOUND
    http: 404
    condition: "no LoadBid matches the path id"
  - id: ERR_RECALL_NOT_FOUND
    http: 404
    condition: "no ProductRecall matches the path id"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "no MemberAudit matches the path id"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "no StoreDonationProgram matches the path id or the program_id in the body"
  - id: ERR_PICKUP_NOT_FOUND
    http: 404
    condition: "no StorePickup matches the path id"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_load_version != DonatedLoad.version on POST /network/loads/{id}/bids, or expected_member_version != MemberFoodBank.version on POST /network/share-ledger/grants"
  - id: ERR_LOAD_NOT_POSTED
    http: 409
    condition: "POST /network/loads/{id}/post on a load whose status is not POSTED"
  - id: ERR_LOAD_NOT_BIDDING
    http: 409
    condition: "POST /network/loads/{id}/award or POST /network/loads/{id}/bids on a load whose status is not BIDDING"
  - id: ERR_LOAD_NOT_AWARDED
    http: 409
    condition: "POST /network/loads/{id}/freight-decision or POST /network/loads/{id}/dispatch on a load whose status is not AWARDED"
  - id: ERR_LOAD_NOT_IN_TRANSIT
    http: 409
    condition: "POST /network/loads/{id}/deliver on a load whose status is not IN_TRANSIT"
  - id: ERR_FREIGHT_DECISION_ALREADY_MADE
    http: 409
    condition: "POST /network/loads/{id}/freight-decision on a load whose freight_decision is not PENDING"
  - id: ERR_BID_NOT_SUBMITTED
    http: 409
    condition: "POST /network/bids/{id}/withdraw on a bid whose bid_status is not SUBMITTED"
  - id: ERR_RECALL_NOT_TRACING
    http: 409
    condition: "POST /network/recalls/{id}/resolve on a recall whose recall_status is not TRACING, or POST /network/recalls/{id}/trace on a recall whose recall_status is RESOLVED"
  - id: ERR_AUDIT_NOT_IN_PROGRESS
    http: 409
    condition: "POST /network/audits/{id}/complete on an audit whose audit_status is not IN_PROGRESS"
  - id: ERR_PICKUP_NOT_SCHEDULED
    http: 409
    condition: "POST /network/store-pickups/{id}/complete or /miss on a pickup whose pickup_status is not SCHEDULED"
  - id: ERR_MEMBER_NOT_PENDING
    http: 409
    condition: "POST /network/members/{id}/certify on a member not in PENDING_CERTIFICATION, or /reinstate on a member in PENDING_CERTIFICATION or CERTIFIED"
  - id: ERR_MEMBER_NOT_CERTIFIED
    http: 403
    condition: "a member in PENDING_CERTIFICATION or PROBATION attempts to schedule a pickup, or a member in PENDING_CERTIFICATION attempts to bid"
  - id: ERR_MEMBER_SUSPENDED
    http: 403
    condition: "a SUSPENDED member attempts to bid, register a store program, or schedule a pickup"
  - id: ERR_LOAD_SAFETY_HOLD
    http: 409
    condition: "post, bid, award or dispatch attempted on a DonatedLoad whose safety_status is HELD or RECALLED"
  - id: ERR_LOAD_RECALLED
    http: 409
    condition: "dispatch or deliver attempted on a load whose safety_status is RECALLED"
  - id: ERR_DUPLICATE_BID
    http: 409
    condition: "the member already has a LoadBid with bid_status SUBMITTED on the same load"
  - id: ERR_STORAGE_CAPACITY_EXCEEDED
    http: 409
    condition: "the load's weight_lbs exceeds the member's storage_capacity_lbs (DRY) or refrigerated_capacity_lbs (REFRIGERATED / FROZEN)"
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "POST /network/loads against a DonorAgreement whose status is not ACTIVE"
  - id: ERR_NO_ELIGIBLE_BIDS
    http: 409
    condition: "POST /network/loads/{id}/award with zero SUBMITTED bids, or with every bid failing the selector's eligibility predicate"
  - id: ERR_AUDIT_SCORE_OUT_OF_RANGE
    http: 400
    condition: "a component score outside [0, 100] on POST /network/audits"
  - id: ERR_CATEGORY_MISMATCH
    http: 409
    condition: "the load or recall product_category differs from its DonorAgreement.product_category"
  - id: ERR_DELIVERY_WINDOW_INVALID
    http: 400
    condition: "delivery_window_start is not strictly before delivery_window_end, or a window endpoint is before the current logical clock time"
  - id: ERR_DELIVERY_WINDOW_OVERLAP
    http: 409
    condition: "the dispatched load's delivery window overlaps another IN_TRANSIT load of the same awarded member (touching endpoints are allowed)"
  - id: ERR_PICKUP_WINDOW_INVALID
    http: 400
    condition: "pickup window_start is not strictly before window_end, or the window does not fall on scheduled_date"
  - id: ERR_PICKUP_WINDOW_OVERLAP
    http: 409
    condition: "the pickup window overlaps another SCHEDULED pickup of the same program, or leaves less than 24 hours after the previous pickup's window_end"
  - id: ERR_INSUFFICIENT_SHARES
    http: 409
    condition: "member.share_balance < shares_offered at bid creation or at award time"
  - id: ERR_SUBSIDY_POOL_EXHAUSTED
    http: 409
    condition: "the agreement's remaining subsidy pool is below MIN_SUBSIDY_CENTS for a member that cannot self-transport"

roles:
  - name: NetworkAdmin
    description: "National network operator: manages donor agreements, loads, freight decisions, share grants and recalls, and certifies members."
    identity: "opaque"
    exclusive_operations:
      - "POST /network/members/{id}/certify"
      - "POST /network/members/{id}/reinstate"
      - "POST /network/donor-agreements"
      - "POST /network/donor-agreements/{id}/activate"
      - "POST /network/loads"
      - "POST /network/loads/{id}/post"
      - "POST /network/loads/{id}/award"
      - "POST /network/loads/{id}/freight-decision"
      - "POST /network/loads/{id}/dispatch"
      - "POST /network/loads/{id}/deliver"
      - "POST /network/loads/{id}/cancel"
      - "POST /network/share-ledger/grants"
      - "POST /network/recalls"
      - "POST /network/recalls/{id}/trace"
      - "POST /network/recalls/{id}/resolve"
      - "POST /network/audits"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /network/members/{id}"
      - "GET /network/donor-agreements/{id}, GET /network/donor-agreements/{id}/poundage-summary"
      - "GET /network/loads/{id}, GET /network/donor-agreements/{id}/loads"
      - "GET /network/bids"
      - "GET /network/members/{id}/share-ledger"
      - "GET /network/donor-agreements/{id}/recalls"
      - "GET /network/recall-holds"
      - "GET /network/members/{id}/audits"
      - "GET /network/store-programs/{id}, GET /network/members/{id}/store-programs"
      - "GET /network/store-programs/{id}/pickups"
      - "POST /network/store-programs"
      - "POST /network/bids/{id}/withdraw"
  - name: MemberFoodBank
    description: "Member food bank acting as itself; bids for loads, runs retail store donation programs and records pickups."
    identity: "entity_backed:MemberFoodBank"
    exclusive_operations:
      - "POST /network/loads/{id}/bids"
      - "POST /network/store-programs/{id}/pickups"
      - "POST /network/store-pickups/{id}/complete"
      - "POST /network/store-pickups/{id}/miss"
    shared_operations:
      - "GET /network/members/{id}"
      - "GET /network/loads/{id}, GET /network/donor-agreements/{id}/loads"
      - "GET /network/bids"
      - "GET /network/members/{id}/share-ledger"
      - "GET /network/donor-agreements/{id}/recalls"
      - "GET /network/recall-holds"
      - "GET /network/store-programs/{id}, GET /network/members/{id}/store-programs"
      - "GET /network/store-programs/{id}/pickups"
      - "POST /network/bids/{id}/withdraw"
      - "POST /network/store-programs"
      - "GET /network/members/{id}/audits"
  - name: NetworkAuditor
    description: "Independent standards auditor; completes member audits and is forbidden from completing an audit it opened itself."
    identity: "opaque"
    exclusive_operations:
      - "POST /network/audits/{id}/complete"
    shared_operations:
      - "GET /network/members/{id}"
      - "GET /network/members/{id}/audits"
