      - name: training_record_cascades_to_station_decon_service_availability
        grounds:
          - calculations.inspector_certification_level
          - entities.Inspector.fields.certification_level
          - entities.InspectionStation.fields.certified_inspector_count
          - entities.InspectionStation.fields.decon_service_available
          - endpoints.POST_/inspectors/{id}/training-records
        distinguishing_aspect: |
          A cascade whose root is an IMMUTABLE child row: hop 1 the TrainingRecord
          is persisted, hop 2 inspector_certification_level re-sums the passed
          rows to 40.00 and lifts certification_level LEVEL_1 -> LEVEL_2, hop 3
          InspectionStation.certified_inspector_count 1 -> 2 because the new level
          is in {LEVEL_2, DECON_CERTIFIED}, hop 4 decon_service_available
          false -> true because the count reached
          CERTIFIED_INSPECTOR_DECON_THRESHOLD. The 20-hour FAILED row in the setup
          must credit nothing, so an implementation that sums all rows reaches 44
          and 60 hours at the wrong moments; and the cascade must not restamp
          certification_expires_at, which was frozen at the first promotion out of
          TRAINEE on 2026-08-01.
        test_recipe:
