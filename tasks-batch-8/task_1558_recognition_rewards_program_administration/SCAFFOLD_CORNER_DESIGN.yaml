        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_SELF_NOMINATION]"]
        distinguishing_aspect: "nominee_id == X-User-ID is rejected ERR_SELF_NOMINATION (422) before any budget check."
        test_recipe:
          setup: ["program ACTIVE, budget, one employee"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 1000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
