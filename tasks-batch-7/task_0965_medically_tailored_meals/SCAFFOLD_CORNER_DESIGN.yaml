  # ---------------------------------------------------- complexity layers ---
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_prescription_activate_stale_member_version
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[prescription-activate-stale-member]"
          - "errors[ERR_STALE_MEMBER_VERSION]"
        distinguishing_aspect: "After the member's version advanced from 1 (observed) to 2 (activation), a prescription activate carrying the stale expected_member_version 1 is rejected with 412 ERR_STALE_MEMBER_VERSION; the prescription stays DRAFT."
        test_recipe:
          setup: ["member created (version observed at 1), then activated (version now 2); referral ACCEPTED; prescription DRAFT"]
          setup_api_calls:
            - { call: "POST /mtm/members", payload: { full_name: "L One", payer_type: "MEDICAID_WAIVER", payer_member_id: "W-L1", allergies: [], income_fpl_percent: 130, household_size: 2 }, as: CareCoordinator, captures: { m_id: $.data.id, m_v_stale: $.data.version } }
            - { call: "POST /mtm/members/${m_id}/status", payload: { target_status: "ACTIVE" }, as: CareCoordinator, captures: { m_v_now: $.data.version } }
            - { call: "POST /mtm/referrals", payload: { member_id: "${m_id}", diagnosis_codes: ["N18.3"], referred_diet_type: "RENAL", expires_at: "2026-06-30" }, as: ReferringProvider, captures: { r_id: $.data.id } }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "TRIAGE" }, as: CareCoordinator }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "ACCEPT" }, as: CareCoordinator }
            - { call: "POST /mtm/diet-prescriptions", payload: { member_id: "${m_id}", referral_id: "${r_id}", diet_type: "RENAL", daily_sodium_mg_max: 2000, daily_potassium_mg_max: 2000, daily_phosphorus_mg_max: 1000, daily_carbs_g_max: 250, daily_protein_g_min: 60, excluded_allergens: [], meals_per_week: 10, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: Dietitian, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /mtm/diet-prescriptions/${p_id}/activate", payload: { expected_member_version: "${m_v_stale}" }, as: Dietitian, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 412 and error_id == ERR_STALE_MEMBER_VERSION"
            - "DietPrescription.${p_id}.status == DRAFT (no activation, no supersede cascade)"
            - "Member.${m_id}.version == ${m_v_now} (unchanged by the rejected call)"

