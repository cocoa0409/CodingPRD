      - name: signature_cascade_bubbles_stabilization_and_the_facility_state_up_the_community
        claim_type: bubble_up
        excluded_because:
          difficulty_instance: signature_cascade_propagates_four_hops_to_facility_conversion_pending
          rationale: |
            The §1.8 transitive_cascade instance already replays all four hops of the signature cascade
            (lease -> homesite -> occupancy counters -> lifecycle STABILIZED -> facility
            CONVERSION_PENDING) hop by hop with the intermediate values asserted at every level, which
            is a strict superset of a bubble-up claim.

      - name: cancelling_an_executed_lease_reverses_every_signature_side_effect
        claim_type: compensation
        excluded_because:
          difficulty_instance: lease_cancellation_reverses_the_whole_signature_cascade_and_the_concession_ledger
          rationale: |
            The §1.8 compensating_invariant instance already asserts the full reversal set — homesite
            back to AVAILABLE, occupancy counters restored, lifecycle STABILIZED -> LEASE_UP, facility
            CONVERSION_PENDING -> ADVANCE_ELIGIBLE and both concession ledgers decremented — with the
            no-drift identity checked against the pre-signature snapshot.

      - name: facility_conversion_is_guarded_by_the_management_dimension
        claim_type: guarded_transitions
        excluded_because:
          difficulty_instance: facility_conversion_blocked_until_management_mode_becomes_pm_managed
          rationale: |
            The §1.8 cross_entity_state_dependency instance already tests the guarded transition in both
            polarities: rejected while management_mode is PM_TRANSITION_PENDING, accepted once the clock
            advance flips the same community to PM_MANAGED with nothing else changed.

  - section: calculations
    instances:
      - name: turn_cost_waterfall_overflows_into_the_capital_reserve_after_the_opex_cap
        claim_type: waterfall_allocation
        grounds:
          - calculations.turn_cost_allocation
          - calculations.turn_cost_allocation.constants.TURN_OPEX_CAP_CENTS
        distinguishing_aspect: |
          A major rehab on detached product blows through both earlier buckets, so all three fill in
          order: the tenant bucket is capped by the ended lease's gross monthly charge, the operating
          bucket is capped at TURN_OPEX_CAP_CENTS = 80000, and the capital reserve absorbs everything
          left over. 2 techs x 120 hours x 11000 = 2640000 labour plus 250000 material = 2890000 total,
          split 298050 / 80000 / 2511950. A server that lets the opex bucket absorb the remainder, or
          that allocates proportionally instead of sequentially, produces different numbers here.
        test_recipe:
          setup:
            - "Community 'Vellmont' with maintenance_tech_headcount 2, one ENDING lease on hs at gross 298050 and the homesite in NOTICE_GIVEN."
