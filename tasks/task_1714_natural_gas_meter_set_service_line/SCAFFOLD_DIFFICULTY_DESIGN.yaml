              as_user_id: "clerk-b"
              captures: { ci_id: "$.data[0].id" }
            - { call: "POST /main-extensions/${me_id}/accept-quote", payload: {}, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /ciac-invoices/${ci_id}/payments", payload: { amount_cents: 322785, method: "ACH" }, as: BillingClerk, as_user_id: "clerk-b" }
            - call: "POST /field-crews"
              payload: { crew_name: "Crew A", specialty: MAIN_EXTENSION, daily_capacity_minutes: 480 }
              as: SystemAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /crew-bookings"
              payload: { service_application_id: "${app_id}", field_crew_id: "${crew_id}", work_date: "2026-08-10", start_minute: 540, end_minute: 1020, scope: MAIN_CONSTRUCTION }
              as: FieldSupervisor
              as_user_id: "sup-1"
              captures: { bk_id: $.data.id }
            - { call: "POST /crew-bookings/${bk_id}/confirm", payload: {}, as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /service-applications/${app_id}/schedule-construction", payload: {}, as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /crew-bookings/${bk_id}/complete", payload: {}, as: FieldSupervisor, as_user_id: "sup-1" }
            - call: "POST /main-extensions/${me_id}/record-as-built"
              payload: { actual_footage_ft: 150, actual_unit_cost_cents: 4500, actual_rock_excavation: false, actual_crossings: [{ surface_type: ASPHALT, length_ft: 12.0, width_ft: 3.0 }] }
              as: FieldSupervisor
              as_user_id: "sup-1"
            - { call: "POST /main-extensions/${me_id}/finalize", payload: {}, as: BillingClerk, as_user_id: "clerk-b" }
          trigger:
            - { call: "POST /ciac-invoices/${ci_id}/refunds", payload: { amount_cents: 303798, method: "ACH" }, as: BillingClerk, as_user_id: "clerk-c" }
            - call: "GET /ciac-invoices/${ci_id}"
              payload: {}
              as: BillingClerk
              as_user_id: "clerk-c"
              captures: { inv_after: $.data }
          assert:
            - "after finalize: CIACInvoice.${ci_id} was REFUND_PENDING with refund_required_cents == 303798 (322785 − 18987)"
            - "after refund: CIACInvoice.${ci_id}.status == REFUNDED"
            - "CIACInvoice.${ci_id}.payments_applied_cents == 322785 and refunds_issued_cents == 303798"
            - "INVARIANT: payments_applied_cents − refunds_issued_cents == 18987 == amount_due_cents == MainExtension.${me_id}.final_total_due_cents (net cash conserved, zero drift)"
            - "MainExtension.${me_id}.final_net_ciac_cents == 15000 and final_gross_up_cents == 3987"

      - name: crew_confirm_cancel_conserves_day_capacity
        grounds:
          - state_machines.CrewBooking.CONFIRMED_to_CANCELLED
          - errors[ERR_CREW_CAPACITY_EXCEEDED]
          - entities.CrewBooking.fields.status
        distinguishing_aspect: |
          Conserved quantity: CONFIRMED-MINUTES PER CREW-DAY (capacity, a different quantity than
          cash). A(240) + B(120) = 360 confirmed; a 130-minute booking overflows (490 > 480);
          cancelling B restores exactly A's 240, and the same 130-minute window then confirms —
          the confirm/cancel pair leaves the aggregate unchanged.
        test_recipe:
          setup:
            - "clock 2026-08-01; DRAFT application; crew capacity 480; A 540–780 (240 min) CONFIRMED; B 810–930 (120 min) CONFIRMED; C 990–1120 (130 min) REQUESTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "9 Oak Ave", city: "Springfield", state_code: "IL", postal_code: "62701", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /field-crews"
              payload: { crew_name: "Crew A", specialty: GENERAL, daily_capacity_minutes: 480 }
              as: SystemAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /crew-bookings"
              payload: { service_application_id: "${app_id}", field_crew_id: "${crew_id}", work_date: "2026-08-10", start_minute: 540, end_minute: 780, scope: MAIN_CONSTRUCTION }
              as: FieldSupervisor
              as_user_id: "sup-1"
              captures: { bk_a: $.data.id }
            - { call: "POST /crew-bookings/${bk_a}/confirm", payload: {}, as: FieldSupervisor, as_user_id: "sup-1" }
            - call: "POST /crew-bookings"
              payload: { service_application_id: "${app_id}", field_crew_id: "${crew_id}", work_date: "2026-08-10", start_minute: 810, end_minute: 930, scope: SERVICE_INSTALL }
              as: FieldSupervisor
              as_user_id: "sup-1"
              captures: { bk_b: $.data.id }
            - { call: "POST /crew-bookings/${bk_b}/confirm", payload: {}, as: FieldSupervisor, as_user_id: "sup-1" }
            - call: "POST /crew-bookings"
              payload: { service_application_id: "${app_id}", field_crew_id: "${crew_id}", work_date: "2026-08-10", start_minute: 990, end_minute: 1120, scope: RESTORATION }
              as: FieldSupervisor
              as_user_id: "sup-1"
              captures: { bk_c: $.data.id }
          trigger:
            - call: "POST /crew-bookings/${bk_c}/confirm"
              payload: {}
              as: FieldSupervisor
              as_user_id: "sup-1"
              captures: { err: $.data.error_id }
            - { call: "POST /crew-bookings/${bk_b}/cancel", payload: {}, as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /crew-bookings/${bk_c}/confirm", payload: {}, as: FieldSupervisor, as_user_id: "sup-1" }
          assert:
            - "first confirm of C fails HTTP 422 ERR_CREW_CAPACITY_EXCEEDED (240+120+130 = 490 > 480)"
            - "after cancelling B, the SAME window C confirms: 240+130 = 370 <= 480"
            - "INVARIANT: confirmed-minutes for the crew-day after the confirm/cancel pair == 240, exactly the pre-B value — capacity fully restored"
            - "CrewBooking.${bk_b}.status == CANCELLED; CrewBooking.${bk_c}.status == CONFIRMED"
