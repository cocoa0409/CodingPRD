# =============================================================================
# SCAFFOLD.yaml — Closed Captioning & Audio Description Services
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Closed Captioning & Audio Description Services (captioning service provider): source media intake & turnaround tiering, caption authoring, timing & speaker identification, accuracy QC & compliance standards (FCC/508), audio description writing & recording within program gaps, format conversion & embedding, live captioning scheduling with stenographers, error complaint remediation, archive of caption assets

domain_name: closed-captioning-audio-description
api_prefix: /caption-ad

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration      # multi-stage caption/AD production pipelines with rework loops
  secondary_archetype: temporal_windowing        # live stenographer scheduling, SLA windows, retention windows
  complexity_layers:
    - optimistic_concurrency                     # OCC on WorkOrder.version / LiveEvent.version
    - cascading_side_effects                     # complaint → track → archive → conversion cascades; preemption cascades
    - rate_threshold_triggers                    # accuracy thresholds, SLA breach, capacity caps, escalation ages
    - derived_field_reconciliation               # WorkOrder posture bubble-up from child track states
  entity_topology: flat                          # peer collections under /caption-ad with FK references in bodies
  state_machine_shape: cyclic                    # QC rework loops and complaint reopen loops dominate
  relationship_patterns: [one_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties              # author != QC reviewer; remediation resolver != disputed author
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Client organization display name" }
      - { name: compliance_standard, type: enum, source: input, description: "FCC_BROADCAST | SECTION_508 | INTERNAL — drives accuracy threshold and default retention class" }
      - { name: default_turnaround_tier, type: enum, source: input, default: STANDARD, description: "STANDARD | EXPRESS | RUSH | SAME_DAY — informational default for new work orders" }
      - { name: client_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED; initial ACTIVE" }
      - { name: ytd_completed_minutes, type: integer, source: computed, default: 0, description: "Sum of ceil(duration_seconds/60) over this client's work orders at the moment each is DELIVERED; basis of the volume-discount bracket in work_order_quote" }

  - name: MediaAsset
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; owning client" }
      - { name: title, type: string, source: input, description: "Program title" }
      - { name: media_kind, type: enum, source: input, description: "FILE_BASED | LIVE_RECORDING" }
      - { name: duration_seconds, type: integer, source: input, description: "Program runtime in seconds; must be > 0" }
      - { name: frame_rate, type: enum, source: input, description: "FPS_23_976 | FPS_24 | FPS_25 | FPS_29_97_DF | FPS_29_97_NDF | FPS_30; DF = drop-frame" }
      - { name: intake_status, type: enum, source: system, description: "RECEIVED | INSPECTING | CLEARED | REJECTED_INTAKE; initial RECEIVED" }
      - { name: rejection_reason, type: string, source: input, description: "Required on reject; null otherwise", default: null }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: media_asset_id, type: string, source: input, description: "FK -> MediaAsset.id" }
      - { name: service_type, type: enum, source: input, description: "CAPTIONS | AUDIO_DESCRIPTION | BUNDLE" }
      - { name: turnaround_tier, type: enum, source: input, description: "STANDARD | EXPRESS | RUSH | SAME_DAY" }
      - { name: language, type: string, source: input, description: "BCP-47 tag, e.g. en-US" }
      - { name: order_status, type: enum, source: system, description: "DRAFT | QUOTED | QUOTE_EXPIRED | CONFIRMED | IN_PRODUCTION | READY_FOR_DELIVERY | DELIVERED | REMEDIATION | CLIENT_ACCEPTED | CANCELLED; initial DRAFT" }
      - { name: quoted_price_cents, type: integer, source: computed, default: null, description: "Set by work_order_quote on /quote; null until QUOTED" }
      - { name: quote_expires_at, type: datetime, source: computed, default: null, description: "quoted_at + 72h; null until QUOTED" }
      - { name: due_at, type: datetime, source: computed, default: null, description: "Set by sla_turnaround_window at confirm; null until CONFIRMED" }
      - { name: sla_breached, type: boolean, source: system, default: false, description: "Set true by deliver when delivered_at > due_at, or by sweep when due_at < now while order is CONFIRMED/IN_PRODUCTION/READY_FOR_DELIVERY" }
      - { name: delivered_at, type: datetime, source: system, default: null, description: "Timestamp of the most recent DELIVERED transition" }
      - { name: active_complaint_count, type: integer, source: computed, default: 0, description: "Count of complaints on any track of this order with complaint_status IN {OPEN, TRIAGED, REMEDIATING, REOPENED}" }

  - name: CaptionTrack
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: supersedes_track_id, type: string, source: input, default: null, description: "FK -> CaptionTrack.id; self-reference to the prior version this track replaces; null for version 1" }
      - { name: version_no, type: integer, source: system, description: "1 for the first track of a work order; prior current version_no + 1 otherwise" }
      - { name: language, type: string, source: input, description: "BCP-47 tag" }
      - { name: caption_format, type: enum, source: input, description: "SCC | WEBVTT | TTML | SRT" }
      - { name: speaker_id_style, type: enum, source: input, description: "CHEVRON | DASH | NAME_TAG — speaker identification convention" }
      - { name: track_status, type: enum, source: system, description: "AUTHORING | INTERNAL_REVIEW | QC_QUEUED | QC_PASSED | QC_FAILED | QC_FAILED_PERMANENT | CONFORMED | DELIVERED | DISPUTED | SUPERSEDED | ARCHIVED; initial AUTHORING" }
      - { name: author_user_id, type: string, source: system, description: "X-User-ID of the CaptionEditor who created the track; basis of segregation-of-duties checks" }
      - { name: qc_attempts, type: integer, source: system, default: 0, description: "Number of finalized QC reviews on this version; increments on each FAIL" }
      - { name: last_accuracy_pct, type: number, source: computed, default: null, description: "accuracy_pct of the most recent QC review on this version; null until first review" }

  - name: QCReview
    parent: null
    common_fields: false
    fields:
      - { name: caption_track_id, type: string, source: input, description: "FK -> CaptionTrack.id" }
      - { name: reviewer_user_id, type: string, source: system, description: "X-User-ID of the QCSpecialist; must differ from track author_user_id" }
      - { name: review_mode, type: enum, source: input, description: "FULL_REVIEW | SAMPLED_REVIEW" }
      - { name: total_words, type: integer, source: input, description: "Total word count of the track; > 0" }
      - { name: sampled_words, type: integer, source: input, default: null, description: "Required when review_mode = SAMPLED_REVIEW; must be >= ceil(total_words * 0.20); denominator for sampled accuracy" }
      - { name: minor_errors, type: integer, source: input, description: ">= 0; weight 1" }
      - { name: major_errors, type: integer, source: input, description: ">= 0; weight 3" }
      - { name: critical_errors, type: integer, source: input, description: ">= 0; weight 10" }
      - { name: weighted_errors, type: integer, source: computed, description: "minor_errors + 3*major_errors + 10*critical_errors" }
      - { name: accuracy_pct, type: number, source: computed, description: "caption_accuracy result; exact decimal, ROUND_HALF_UP to 2 dp" }
      - { name: threshold_pct, type: number, source: computed, description: "Pass threshold from client compliance_standard: FCC_BROADCAST 99.00 | SECTION_508 98.50 | INTERNAL 95.00" }
      - { name: outcome, type: enum, source: computed, description: "PASS when accuracy_pct >= threshold_pct (inclusive), else FAIL" }

  - name: AudioDescriptionTrack
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: language, type: string, source: input, description: "BCP-47 tag" }
      - { name: narrator_name, type: string, source: input, description: "Voice talent name" }
      - { name: author_user_id, type: string, source: system, description: "X-User-ID of the creating ADProducer; segregation-of-duties basis" }
      - { name: ad_status, type: enum, source: system, description: "SCRIPTING | SCRIPT_REVIEW | RECORDING | MIX_QC | CONFORMED | DELIVERED | DISPUTED | ARCHIVED; initial SCRIPTING" }
      - { name: gaps, type: array, source: input, description: "Program silence windows usable for description: [{start_ms, end_ms}], end_ms > start_ms, non-overlapping, ascending" }
      - { name: segments, type: array, source: input, description: "Placed descriptions: [{gap_index, duration_ms, text}]; duration_ms > 0 and <= length of gaps[gap_index]" }
      - { name: gap_coverage_pct, type: number, source: computed, default: null, description: "ad_gap_coverage result; null until submit-script" }
      - { name: studio_id, type: string, source: input, default: null, description: "Booked studio identifier; set by book-studio, cleared by reject-mix" }
      - { name: record_start_at, type: datetime, source: input, default: null, description: "Studio booking start (closed interval semantics)" }
      - { name: record_end_at, type: datetime, source: input, default: null, description: "Studio booking end (closed interval semantics)" }

  - name: LiveEvent
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: title, type: string, source: input, description: "Program title" }
      - { name: channel_id, type: string, source: input, description: "Logical channel label (not an FK)" }
      - { name: start_at, type: datetime, source: input, description: "Scheduled air start; must be < end_at" }
      - { name: end_at, type: datetime, source: input, description: "Scheduled air end" }
      - { name: required_certification, type: enum, source: input, description: "CERT_CBC | CERT_CART — stenographer certification must match exactly" }
      - { name: prep_minutes, type: integer, source: input, default: 15, description: ">= 0; pre-show buffer used in occupancy windows" }
      - { name: wrap_minutes, type: integer, source: input, default: 5, description: ">= 0; post-show buffer used in occupancy windows" }
      - { name: event_status, type: enum, source: system, description: "SCHEDULED | BRIEFED | ON_AIR | WRAP | SETTLED | CANCELLED; initial SCHEDULED" }

  - name: Stenographer
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Stenographer name" }
      - { name: certification, type: enum, source: input, description: "CERT_CBC | CERT_CART" }
      - { name: certified_since, type: datetime, source: input, description: "Certification grant date; seniority tie-break in auto_offer_selector" }
      - { name: cert_valid_until, type: datetime, source: input, description: "Certification expiry; must be > certified_since" }
      - { name: max_daily_live_minutes, type: integer, source: input, default: 300, description: "> 0; per-UTC-day committed-minutes cap" }
      - { name: steno_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CERTIFICATION_LAPSED; initial ACTIVE" }
      - { name: make_up_minutes_credited, type: integer, source: system, default: 0, description: "Cumulative booked_minutes of PREEMPTED assignments (involuntary loss compensation)" }
      - { name: no_show_count, type: integer, source: system, default: 0, description: "Cumulative NO_SHOW marks" }

  - name: LiveAssignment
    parent: null
    common_fields: true
    fields:
      - { name: live_event_id, type: string, source: input, description: "FK -> LiveEvent.id" }
      - { name: stenographer_id, type: string, source: computed, description: "FK -> Stenographer.id; request-supplied or chosen by auto_offer_selector when omitted" }
      - { name: assignment_status, type: enum, source: system, description: "OFFERED | ACCEPTED | DECLINED | OFFER_EXPIRED | CONFIRMED | LIVE | COMPLETED | NO_SHOW | PREEMPTED | CANCELLED; initial OFFERED" }
      - { name: origin, type: enum, source: system, default: MANUAL, description: "MANUAL when stenographer_id supplied; AUTO_OFFER when chosen by auto_offer_selector (direct create with omitted id or cascade re-offer)" }
      - { name: offered_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: offer_expires_at, type: datetime, source: computed, description: "min(offered_at + 4h, event.start_at)" }
      - { name: booked_minutes, type: integer, source: computed, description: "ceil((end_at - start_at)/60s) + prep_minutes + wrap_minutes of the event" }
      - { name: preemption_reason, type: enum, source: input, default: null, description: "SCHEDULER_OVERRIDE | EMERGENCY_REBOOK | CLIENT_REQUEST; required on preempt" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; must equal the subject's owning client" }
      - { name: caption_track_id, type: string, source: input, default: null, description: "FK -> CaptionTrack.id; exactly one of the three subject FKs must be non-null" }
      - { name: audio_description_track_id, type: string, source: input, default: null, description: "FK -> AudioDescriptionTrack.id; exactly one subject" }
      - { name: live_event_id, type: string, source: input, default: null, description: "FK -> LiveEvent.id; exactly one subject" }
      - { name: severity, type: enum, source: input, description: "FCC_CRITICAL | MAJOR | MINOR" }
      - { name: description, type: string, source: input, description: "Free-text error description" }
      - { name: complaint_status, type: enum, source: system, description: "OPEN | TRIAGED | REMEDIATING | RESOLVED | DISMISSED | REOPENED; initial OPEN" }
      - { name: escalation_level, type: integer, source: system, default: 0, description: "Incremented by complaint_escalation sweep and by reopen" }
      - { name: remediation_track_id, type: string, source: system, default: null, description: "FK -> CaptionTrack.id; remediation version created by begin-remediation (caption subjects only)" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "Timestamp of RESOLVED transition" }
      - { name: resolver_user_id, type: string, source: system, default: null, description: "X-User-ID of resolving OperationsManager; must differ from disputed track author_user_id" }

  - name: ConversionJob
    parent: null
    common_fields: true
    fields:
      - { name: source_track_id, type: string, source: input, description: "FK -> CaptionTrack.id; source must be CONFORMED | DELIVERED | SUPERSEDED | ARCHIVED" }
      - { name: target_format, type: enum, source: input, description: "SCC | WEBVTT | TTML | SRT; must differ from source caption_format" }
      - { name: embed, type: boolean, source: input, default: false, description: "Embed into media container; only supported when target_format = SCC" }
      - { name: job_status, type: enum, source: system, description: "QUEUED | CONVERTING | VALIDATING | COMPLETED | FAILED_VALIDATION | CANCELLED; initial QUEUED" }
      - { name: attempt_count, type: integer, source: system, default: 0, description: "Increments on each /run that ends FAILED_VALIDATION; retry requires attempt_count < 3" }
      - { name: output_duration_ms, type: integer, source: system, default: null, description: "Measured output duration reported by the worker via /run input" }
      - { name: last_delta_ms, type: integer, source: computed, default: null, description: "output_duration_ms - (source media duration_seconds * 1000), signed" }

  - name: ArchiveItem
    parent: null
    common_fields: true
    fields:
      - { name: caption_track_id, type: string, source: system, default: null, description: "FK -> CaptionTrack.id; exactly one of the three subject FKs is non-null" }
      - { name: audio_description_track_id, type: string, source: system, default: null, description: "FK -> AudioDescriptionTrack.id; exactly one subject" }
      - { name: live_event_id, type: string, source: system, default: null, description: "FK -> LiveEvent.id; exactly one subject" }
      - { name: retention_class, type: enum, source: computed, description: "REGULATED_BROADCAST (2555d) when client FCC_BROADCAST; LIVE_ONLY (90d) for live-event subjects; STANDARD (1095d) otherwise" }
      - { name: archive_status, type: enum, source: system, description: "ACTIVE_HOLD | COLD_STORE | RESTORE_PENDING | RESTORED_HOT | PURGED; initial ACTIVE_HOLD" }
      - { name: archived_at, type: datetime, source: system, default: null, description: "Set on first ACTIVE_HOLD -> COLD_STORE; NOT recomputed on rearchive" }
      - { name: purge_after, type: datetime, source: computed, default: null, description: "archived_at + retention_class days; pinned at first cold-store and never recomputed" }
      - { name: legal_hold, type: boolean, source: input, default: false, description: "Set via set-legal-hold; blocks purge" }
      - { name: dispute_freeze, type: boolean, source: system, default: false, description: "Set true by complaint-create cascade on the subject track; cleared on resolve/dismiss; blocks cold-store and purge" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MediaAsset
    field: intake_status
    initial_state: RECEIVED
    terminal_states: [REJECTED_INTAKE]
    transitions:
      - from: RECEIVED
        to: INSPECTING
        trigger: "POST /caption-ad/media-assets/{mediaAssetId}/begin-inspection"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: []
      - from: INSPECTING
        to: CLEARED
        trigger: "POST /caption-ad/media-assets/{mediaAssetId}/clear"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: []
      - from: INSPECTING
        to: REJECTED_INTAKE
        trigger: "POST /caption-ad/media-assets/{mediaAssetId}/reject"
        actor: IntakeCoordinator
        preconditions:
          - "rejection_reason present and non-empty"
        side_effects: []

  - entity: WorkOrder
    field: order_status
    initial_state: DRAFT
    terminal_states: [CLIENT_ACCEPTED, CANCELLED]
    transitions:
      - from: [DRAFT, QUOTE_EXPIRED]
        to: QUOTED
        trigger: "POST /caption-ad/work-orders/{workOrderId}/quote"
        actor: IntakeCoordinator
        preconditions:
          - "Referenced media asset intake_status != REJECTED_INTAKE"
        side_effects:
          - "Run work_order_quote -> quoted_price_cents"
          - "quote_expires_at = now + 72h"
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /caption-ad/work-orders/{workOrderId}/confirm"
        actor: ClientContact
        preconditions:
          - "Acting client owns the order (client_id == X-User-ID)"
          - "Client.client_status == ACTIVE"
          - "now < quote_expires_at (else ERR_QUOTE_EXPIRED)"
          - "MediaAsset.intake_status == CLEARED (else ERR_MEDIA_NOT_CLEARED)"
        side_effects:
          - "Run sla_turnaround_window -> due_at"
      - from: QUOTED
        to: QUOTE_EXPIRED
        trigger: "system sweep: now >= quote_expires_at"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: IN_PRODUCTION
        trigger: "POST /caption-ad/work-orders/{workOrderId}/start-production"
        actor: CaptionEditor
        preconditions: []
        side_effects: []
      - from: IN_PRODUCTION
        to: READY_FOR_DELIVERY
        trigger: "system bubble-up: required track coverage complete"
        actor: system
        preconditions:
          - "service_type CAPTIONS: current CaptionTrack (status NOT IN {SUPERSEDED, ARCHIVED, QC_FAILED_PERMANENT}) exists and is CONFORMED"
          - "service_type AUDIO_DESCRIPTION: an AudioDescriptionTrack is CONFORMED"
          - "service_type BUNDLE: both of the above"
        side_effects: []
      - from: READY_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /caption-ad/work-orders/{workOrderId}/deliver"
        actor: OperationsManager
        preconditions: []
        side_effects:
          - "delivered_at = now; sla_breached = (delivered_at > due_at)"
          - "Each CONFORMED CaptionTrack of this order -> DELIVERED; each CONFORMED AudioDescriptionTrack -> DELIVERED"
          - "Create one ArchiveItem (ACTIVE_HOLD) per delivered track, retention_class from client compliance_standard"
          - "Client.ytd_completed_minutes += ceil(media duration_seconds / 60)"
      - from: DELIVERED
        to: CLIENT_ACCEPTED
        trigger: "POST /caption-ad/work-orders/{workOrderId}/accept-delivery"
        actor: ClientContact
        preconditions:
          - "Acting client owns the order"
          - "active_complaint_count == 0 (else ERR_COMPLAINTS_STILL_OPEN)"
        side_effects: []
      - from: [DRAFT, QUOTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /caption-ad/work-orders/{workOrderId}/cancel"
        actor: "IntakeCoordinator or OperationsManager"
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: REMEDIATION
        trigger: "system: complaint created or reopened against a track of this order"
        actor: system
        preconditions: []
        side_effects:
          - "active_complaint_count += 1"
          - "QUEUED ConversionJobs referencing any track of this order -> CANCELLED (entering remediation freezes in-flight conversion work)"
      - from: REMEDIATION
        to: IN_PRODUCTION
        trigger: "system: begin-remediation creates the remediation artifact"
        actor: system
        preconditions: []
        side_effects: []
      - from: REMEDIATION
        to: DELIVERED
        trigger: "system: complaint dismissed (no remediation begun) and active_complaint_count returns to 0"
        actor: system
        preconditions:
          - "active_complaint_count == 0"
        side_effects: []

  - entity: CaptionTrack
    field: track_status
    initial_state: AUTHORING
    terminal_states: [SUPERSEDED, ARCHIVED, QC_FAILED_PERMANENT]
    transitions:
      - from: AUTHORING
        to: INTERNAL_REVIEW
        trigger: "POST /caption-ad/caption-tracks/{trackId}/submit-review"
        actor: CaptionEditor
        preconditions: []
        side_effects: []
      - from: INTERNAL_REVIEW
        to: AUTHORING
        trigger: "POST /caption-ad/caption-tracks/{trackId}/return-to-authoring"
        actor: CaptionEditor
        preconditions: []
        side_effects: []
      - from: INTERNAL_REVIEW
        to: QC_QUEUED
        trigger: "POST /caption-ad/caption-tracks/{trackId}/enqueue-qc"
        actor: CaptionEditor
        preconditions: []
        side_effects: []
      - from: QC_QUEUED
        to: QC_PASSED
        trigger: "system: QCReview finalized with outcome PASS"
        actor: system
        preconditions: []
        side_effects:
          - "last_accuracy_pct = review.accuracy_pct"
      - from: QC_QUEUED
        to: QC_FAILED
        trigger: "system: QCReview finalized with outcome FAIL"
        actor: system
        preconditions: []
        side_effects:
          - "qc_attempts += 1"
          - "last_accuracy_pct = review.accuracy_pct"
          - "If qc_attempts reaches 3, immediately transition QC_FAILED -> QC_FAILED_PERMANENT"
      - from: QC_FAILED
        to: AUTHORING
        trigger: "POST /caption-ad/caption-tracks/{trackId}/begin-rework"
        actor: CaptionEditor
        preconditions:
          - "qc_attempts < 3 (once the third FAIL lands the track is already QC_FAILED_PERMANENT and terminal, so a rework attempt there is rejected as an invalid transition)"
        side_effects: []
      - from: QC_FAILED
        to: QC_FAILED_PERMANENT
        trigger: "system: third consecutive FAIL (qc_attempts == 3)"
        actor: system
        preconditions: []
        side_effects:
          - "WorkOrder remains IN_PRODUCTION but cannot reach READY_FOR_DELIVERY until a new version is created and conformed"
      - from: QC_PASSED
        to: CONFORMED
        trigger: "POST /caption-ad/caption-tracks/{trackId}/mark-conformed"
        actor: CaptionEditor
        preconditions:
          - "WorkOrder.order_status == IN_PRODUCTION (ERR_INVALID_TRANSITION otherwise)"
        side_effects:
          - "WorkOrder bubble-up recompute: if required coverage complete -> READY_FOR_DELIVERY"
      - from: CONFORMED
        to: DELIVERED
        trigger: "system: work order delivered"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: DISPUTED
        trigger: "system: complaint created or reopened against this track"
        actor: system
        preconditions: []
        side_effects:
          - "ArchiveItem for this track (if any): dispute_freeze = true"
          - "WorkOrder DELIVERED -> REMEDIATION"
      - from: DISPUTED
        to: DELIVERED
        trigger: "system: complaint dismissed"
        actor: system
        preconditions: []
        side_effects:
          - "ArchiveItem dispute_freeze = false"
      - from: DISPUTED
        to: SUPERSEDED
        trigger: "system: begin-remediation creates remediation version"
        actor: system
        preconditions: []
        side_effects: []
      - from: [AUTHORING, INTERNAL_REVIEW, QC_QUEUED, QC_PASSED, QC_FAILED]
        to: SUPERSEDED
        trigger: "system: a new CaptionTrack version is created for the same work order (direct POST or remediation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: ARCHIVED
        trigger: "system sweep: work order CLIENT_ACCEPTED and delivered_at <= now - 30 days"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AudioDescriptionTrack
    field: ad_status
    initial_state: SCRIPTING
    terminal_states: [ARCHIVED]
    transitions:
      - from: SCRIPTING
        to: SCRIPT_REVIEW
        trigger: "POST /caption-ad/audio-description-tracks/{adTrackId}/submit-script"
        actor: ADProducer
        preconditions:
          - "segments non-empty"
          - "ad_gap_coverage within [35.0, 85.0] inclusive (else ERR_GAP_COVERAGE_OUT_OF_BAND)"
        side_effects:
          - "gap_coverage_pct computed and stored"
      - from: SCRIPT_REVIEW
        to: RECORDING
        trigger: "POST /caption-ad/audio-description-tracks/{adTrackId}/approve-script"
        actor: QCSpecialist
        preconditions:
          - "X-User-ID != author_user_id (segregation of duties)"
        side_effects: []
      - from: SCRIPT_REVIEW
        to: SCRIPTING
        trigger: "POST /caption-ad/audio-description-tracks/{adTrackId}/reject-script"
        actor: QCSpecialist
        preconditions: []
        side_effects: []
      - from: RECORDING
        to: MIX_QC
        trigger: "POST /caption-ad/audio-description-tracks/{adTrackId}/submit-mix"
        actor: ADProducer
        preconditions:
          - "studio booking present (studio_id, record_start_at, record_end_at non-null)"
          - "now >= record_end_at"
        side_effects: []
      - from: MIX_QC
        to: CONFORMED
        trigger: "POST /caption-ad/audio-description-tracks/{adTrackId}/approve-mix"
        actor: QCSpecialist
        preconditions:
          - "X-User-ID != author_user_id"
        side_effects:
          - "WorkOrder bubble-up recompute (same coverage rule as CaptionTrack.mark-conformed)"
      - from: MIX_QC
        to: RECORDING
        trigger: "POST /caption-ad/audio-description-tracks/{adTrackId}/reject-mix"
        actor: QCSpecialist
        preconditions: []
        side_effects:
          - "studio_id, record_start_at, record_end_at cleared (must re-book)"
      - from: CONFORMED
        to: DELIVERED
        trigger: "system: work order delivered"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: DISPUTED
        trigger: "system: complaint created or reopened against this track"
        actor: system
        preconditions: []
        side_effects:
          - "ArchiveItem dispute_freeze = true; WorkOrder DELIVERED -> REMEDIATION"
      - from: DISPUTED
        to: DELIVERED
        trigger: "system: complaint dismissed"
        actor: system
        preconditions:
          - "no remediation begun"
        side_effects:
          - "ArchiveItem dispute_freeze = false"
      - from: DISPUTED
        to: SCRIPTING
        trigger: "system: begin-remediation (AD remediation reopens the same track; no new version)"
        actor: system
        preconditions: []
        side_effects:
          - "studio booking cleared; gaps/segments editable again via PATCH"
      - from: DELIVERED
        to: ARCHIVED
        trigger: "system sweep: work order CLIENT_ACCEPTED and delivered_at <= now - 30 days"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LiveEvent
    field: event_status
    initial_state: SCHEDULED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: BRIEFED
        trigger: "system: first assignment reaches CONFIRMED"
        actor: system
        preconditions: []
        side_effects: []
      - from: BRIEFED
        to: SCHEDULED
        trigger: "system: last CONFIRMED assignment lost (preempted or no-show) and none remain CONFIRMED"
        actor: system
        preconditions: []
        side_effects:
          - "auto_offer_selector runs: creates one AUTO_OFFER assignment to the next-ranked eligible stenographer, or no-op when the pool is empty"
      - from: [SCHEDULED, BRIEFED]
        to: ON_AIR
        trigger: "POST /caption-ad/live-events/{liveEventId}/go-on-air"
        actor: Scheduler
        preconditions:
          - "at least one assignment CONFIRMED (else ERR_GO_ON_AIR_BLOCKED)"
          - "start_at - 30min <= now < end_at (violation -> ERR_INVALID_TRANSITION)"
        side_effects:
          - "All CONFIRMED assignments -> LIVE"
      - from: ON_AIR
        to: WRAP
        trigger: "POST /caption-ad/live-events/{liveEventId}/wrap"
        actor: Scheduler
        preconditions:
          - "now >= end_at (violation -> ERR_INVALID_TRANSITION)"
        side_effects:
          - "All LIVE assignments -> COMPLETED"
      - from: WRAP
        to: SETTLED
        trigger: "POST /caption-ad/live-events/{liveEventId}/settle"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "Create ArchiveItem (ACTIVE_HOLD, retention_class LIVE_ONLY) for this event"
      - from: [SCHEDULED, BRIEFED]
        to: CANCELLED
        trigger: "POST /caption-ad/live-events/{liveEventId}/cancel"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "All assignments in OFFERED | ACCEPTED | CONFIRMED -> CANCELLED (no make-up credit)"

  - entity: Stenographer
    field: steno_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /caption-ad/stenographers/{stenographerId}/suspend"
        actor: Scheduler
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /caption-ad/stenographers/{stenographerId}/reinstate"
        actor: Scheduler
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CERTIFICATION_LAPSED
        trigger: "system sweep: now > cert_valid_until"
        actor: system
        preconditions: []
        side_effects: []
      - from: CERTIFICATION_LAPSED
        to: ACTIVE
        trigger: "POST /caption-ad/stenographers/{stenographerId}/renew-certification"
        actor: Scheduler
        preconditions:
          - "new cert_valid_until > now"
        side_effects:
          - "cert_valid_until updated"

  - entity: LiveAssignment
    field: assignment_status
    initial_state: OFFERED
    terminal_states: [DECLINED, OFFER_EXPIRED, COMPLETED, NO_SHOW, PREEMPTED, CANCELLED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /caption-ad/live-assignments/{assignmentId}/accept"
        actor: Stenographer
        preconditions:
          - "assignment.stenographer_id == X-User-ID (ownership)"
          - "now < offer_expires_at (else ERR_OFFER_EXPIRED)"
          - "stenographer_overlap_window: no conflicting ACCEPTED/CONFIRMED/LIVE assignment (else ERR_STENOGRAPHER_DOUBLE_BOOKED)"
          - "stenographer_committed_minutes: committed(event day) + booked_minutes <= max_daily_live_minutes (else ERR_CAPACITY_EXCEEDED)"
        side_effects: []
      - from: OFFERED
        to: DECLINED
        trigger: "POST /caption-ad/live-assignments/{assignmentId}/decline"
        actor: Stenographer
        preconditions:
          - "assignment.stenographer_id == X-User-ID"
        side_effects:
          - "auto_offer_selector runs with this stenographer excluded (decliner exclusion): creates one AUTO_OFFER assignment or no-op on empty pool"
      - from: OFFERED
        to: OFFER_EXPIRED
        trigger: "system sweep: now >= offer_expires_at"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: CONFIRMED
        trigger: "POST /caption-ad/live-assignments/{assignmentId}/check-in"
        actor: Stenographer
        preconditions:
          - "assignment.stenographer_id == X-User-ID"
          - "event.start_at - 30min <= now <= event.start_at - 10min, both bounds inclusive (else ERR_CHECKIN_WINDOW_CLOSED)"
        side_effects:
          - "LiveEvent SCHEDULED -> BRIEFED when this is the first CONFIRMED"
      - from: [ACCEPTED, CONFIRMED]
        to: PREEMPTED
        trigger: "POST /caption-ad/live-assignments/{assignmentId}/preempt"
        actor: Scheduler
        preconditions:
          - "preemption_reason present"
        side_effects:
          - "Stenographer.make_up_minutes_credited += booked_minutes; committed minutes released"
          - "If no CONFIRMED assignments remain and event was BRIEFED: event -> SCHEDULED"
          - "auto_offer_selector runs excluding this stenographer and all prior DECLINED/PREEMPTED/NO_SHOW stenographers for this event"
      - from: [ACCEPTED, CONFIRMED]
        to: NO_SHOW
        trigger: "POST /caption-ad/live-assignments/{assignmentId}/mark-no-show"
        actor: Scheduler
        preconditions:
          - "now >= event.start_at"
        side_effects:
          - "Stenographer.no_show_count += 1; committed minutes released; no make-up credit"
          - "Event BRIEFED -> SCHEDULED when no CONFIRMED remain (no auto-offer on no-show)"
      - from: CONFIRMED
        to: LIVE
        trigger: "system: event go-on-air"
        actor: system
        preconditions: []
        side_effects: []
      - from: LIVE
        to: COMPLETED
        trigger: "system: event wrap"
        actor: system
        preconditions: []
        side_effects: []
      - from: [OFFERED, ACCEPTED, CONFIRMED]
        to: CANCELLED
        trigger: "system: event cancelled"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Complaint
    field: complaint_status
    initial_state: OPEN
    terminal_states: [DISMISSED]
    transitions:
      - from: OPEN
        to: TRIAGED
        trigger: "POST /caption-ad/complaints/{complaintId}/triage"
        actor: OperationsManager
        preconditions: []
        side_effects:
          - "severity replaced when supplied"
      - from: [OPEN, TRIAGED]
        to: DISMISSED
        trigger: "POST /caption-ad/complaints/{complaintId}/dismiss"
        actor: OperationsManager
        preconditions:
          - "rationale present"
        side_effects:
          - "Subject track DISPUTED -> DELIVERED; ArchiveItem dispute_freeze = false"
          - "WorkOrder.active_complaint_count -= 1; when it reaches 0 the order REMEDIATION -> DELIVERED"
      - from: TRIAGED
        to: REMEDIATING
        trigger: "POST /caption-ad/complaints/{complaintId}/begin-remediation"
        actor: OperationsManager
        preconditions:
          - "Subject is a caption track or AD track (live-event subjects have no remediation artifact: ERR_INVALID_TRANSITION)"
        side_effects:
          - "Caption subject: create remediation CaptionTrack (version_no = disputed + 1, AUTHORING, supersedes_track_id = disputed track, author_user_id = acting user); disputed track DISPUTED -> SUPERSEDED; remediation_track_id set"
          - "AD subject: AD track DISPUTED -> SCRIPTING (same track reopened)"
          - "WorkOrder REMEDIATION -> IN_PRODUCTION"
      - from: REMEDIATING
        to: RESOLVED
        trigger: "POST /caption-ad/complaints/{complaintId}/resolve"
        actor: OperationsManager
        preconditions:
          - "Caption subject: remediation_track_id track is DELIVERED (remediation flowed through conform + re-delivery) else ERR_RESOLUTION_ARTIFACT_INCOMPLETE"
          - "AD subject: the reopened AD track is DELIVERED else ERR_RESOLUTION_ARTIFACT_INCOMPLETE"
          - "X-User-ID != author_user_id of the disputed track (segregation of duties)"
        side_effects:
          - "resolved_at = now; resolver_user_id = X-User-ID"
          - "ArchiveItem dispute_freeze = false; active_complaint_count -= 1"
      - from: TRIAGED
        to: RESOLVED
        trigger: "POST /caption-ad/complaints/{complaintId}/resolve"
        actor: OperationsManager
        preconditions:
          - "Subject is a live event (no remediation artifact exists)"
          - "resolution_note present"
        side_effects:
          - "resolved_at = now; resolver_user_id = X-User-ID"
          - "ArchiveItem dispute_freeze = false; active_complaint_count unchanged (live events have no work order)"
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /caption-ad/complaints/{complaintId}/reopen"
        actor: ClientContact
        preconditions:
          - "Acting client owns the complaint (client_id == X-User-ID)"
          - "now <= resolved_at + 14 days, inclusive (else ERR_REOPEN_WINDOW_CLOSED)"
        side_effects:
          - "escalation_level += 1"
          - "The complaint's current artifact (the remediation track when remediation_track_id is set, else the original subject track) DELIVERED -> DISPUTED; ArchiveItem dispute_freeze = true"
          - "WorkOrder DELIVERED -> REMEDIATION; active_complaint_count += 1"
      - from: REOPENED
        to: TRIAGED
        trigger: "POST /caption-ad/complaints/{complaintId}/triage"
        actor: OperationsManager
        preconditions: []
        side_effects: []

  - entity: ConversionJob
    field: job_status
    initial_state: QUEUED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: QUEUED
        to: CONVERTING
        trigger: "POST /caption-ad/conversion-jobs/{conversionJobId}/run (internal leg 1)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Internal pass-through within one /run call; not an externally observable rest state"
      - from: CONVERTING
        to: VALIDATING
        trigger: "system (internal leg 2 of /run)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Internal pass-through within one /run call; not an externally observable rest state"
      - from: VALIDATING
        to: COMPLETED
        trigger: "system (internal leg 3 of /run)"
        actor: system
        preconditions:
          - "abs(output_duration_ms - source media duration_seconds * 1000) <= 250"
        side_effects:
          - "output_duration_ms and last_delta_ms stored"
        note: "Externally the whole pass is one POST /run call: QUEUED in, COMPLETED out"
      - from: VALIDATING
        to: FAILED_VALIDATION
        trigger: "system (internal leg 3 of /run)"
        actor: system
        preconditions:
          - "abs(output_duration_ms - source media duration_seconds * 1000) > 250"
        side_effects:
          - "attempt_count += 1; output_duration_ms and last_delta_ms stored"
        note: "Externally: QUEUED in, FAILED_VALIDATION out, within one POST /run call"
      - from: FAILED_VALIDATION
        to: QUEUED
        trigger: "POST /caption-ad/conversion-jobs/{conversionJobId}/retry"
        actor: OperationsManager
        preconditions:
          - "attempt_count < 3 (else ERR_RETRY_LIMIT_REACHED)"
        side_effects: []
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /caption-ad/conversion-jobs/{conversionJobId}/cancel, or system when source track becomes DISPUTED"
        actor: "OperationsManager or system"
        preconditions: []
        side_effects: []

  - entity: ArchiveItem
    field: archive_status
    initial_state: ACTIVE_HOLD
    terminal_states: [PURGED]
    transitions:
      - from: ACTIVE_HOLD
        to: COLD_STORE
        trigger: "POST /caption-ad/archive-items/{archiveItemId}/cold-store"
        actor: OperationsManager
        preconditions:
          - "dispute_freeze == false (violation -> ERR_INVALID_TRANSITION)"
        side_effects:
          - "archived_at = now; purge_after = now + retention_class days (pinned once, never recomputed)"
      - from: COLD_STORE
        to: RESTORE_PENDING
        trigger: "POST /caption-ad/archive-items/{archiveItemId}/request-restore"
        actor: OperationsManager
        preconditions: []
        side_effects: []
      - from: RESTORE_PENDING
        to: RESTORED_HOT
        trigger: "POST /caption-ad/archive-items/{archiveItemId}/complete-restore"
        actor: OperationsManager
        preconditions: []
        side_effects: []
      - from: RESTORED_HOT
        to: COLD_STORE
        trigger: "POST /caption-ad/archive-items/{archiveItemId}/rearchive"
        actor: OperationsManager
        preconditions: []
        side_effects:
          - "archived_at and purge_after are NOT recomputed (retention clock keeps the original archived_at)"
      - from: COLD_STORE
        to: PURGED
        trigger: "POST /caption-ad/archive-items/{archiveItemId}/purge"
        actor: OperationsManager
        preconditions:
          - "archive_purge_eligibility gate: now >= purge_after, inclusive (else ERR_RETENTION_NOT_ELAPSED)"
          - "legal_hold == false (else ERR_ARCHIVE_LEGAL_HOLD)"
          - "dispute_freeze == false AND no complaint on the subject with status IN {OPEN, TRIAGED, REMEDIATING, REOPENED} (either violation -> ERR_COMPLAINTS_STILL_OPEN; dispute_freeze is only ever set while such a complaint exists)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: caption-track-create-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /caption-ad/work-orders/{workOrderId}/caption-tracks"
    occ_field: expected_work_order_version
    description: |
      Creating a CaptionTrack version against a WorkOrder whose version has
      advanced since the client last observed it is rejected. Track creation
      legitimately supersedes the current version, so a writer holding a stale
      view of the work order must not silently supersede a version it never saw.
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412
  - rule_id: work-order-amend-stale-version
    parent_entity: WorkOrder
    write_endpoint: "PATCH /caption-ad/work-orders/{workOrderId}"
    occ_field: expected_work_order_version
    description: |
      Amending turnaround_tier or language of a WorkOrder whose version has
      advanced since the client last observed it is rejected. Amendments
      re-quote and move the expiry window, so applying one on top of a stale
      view would silently discard the intervening amendment.
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412
  - rule_id: assignment-offer-stale-live-event
    parent_entity: LiveEvent
    write_endpoint: "POST /caption-ad/live-events/{liveEventId}/assignments"
    occ_field: expected_live_event_version
    description: |
      Creating a LiveAssignment offer against a LiveEvent whose version has
      advanced since the client last observed it is rejected. Each offer
      creation advances the event version, so a scheduler acting on a stale
      view must refresh before stacking another offer onto changed coverage.
    error_id: ERR_STALE_LIVE_EVENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sla_turnaround_window
    trigger: "WorkOrder confirm (QUOTED -> CONFIRMED)"
    algorithm: threshold
    formula: |
      minutes m = ceil(duration_seconds / 60)
      SLA hours H by tier (duration-bracketed):
        STANDARD:  H = 120 + 24 * max(0, ceil(m/60) - 1)        # 120h covers first 60 min; +24h per additional started hour
        EXPRESS:   H = 48  + 12 * max(0, ceil(m/60) - 1)        # 48h covers first 60 min; +12h per additional started hour
        RUSH:      H = 24  + 6  * ceil(max(0, m - 30) / 30)     # 24h covers first 30 min; +6h per additional started 30-min block
        SAME_DAY:  H = 8 flat; tier rejected at create/amend when m > 60 (ERR_TIER_DURATION_INCOMPATIBLE)
      Clock basis by tier (PINNED — resolves the business-vs-wall ambiguity):
        STANDARD, EXPRESS -> business hours: Mon-Fri windows [09:00, 17:00) UTC, 8h/day, weekends skipped;
          if confirmed_at falls outside a window, the clock starts at the next window open.
        RUSH, SAME_DAY -> wall-clock hours, weekends included.
      due_at = confirmed_at + H hours under the tier's clock basis.
    input_set: "The confirming WorkOrder: turnaround_tier, media duration_seconds, confirm timestamp"
    constants:
      STANDARD_BASE_H: 120
      EXPRESS_BASE_H: 48
      RUSH_BASE_H: 24
      SAME_DAY_H: 8
      BUSINESS_DAY_START_H: 9
      BUSINESS_DAY_END_H: 17
    precision: "timestamps to the second; no rounding"
    variants:
      - name: business_hours_basis
        when: "tier IN {STANDARD, EXPRESS}"
        difference: "Hours consumed only inside Mon-Fri 09:00-17:00 UTC windows; identical confirm instant and duration yield a later due_at than the wall-clock reading whenever a weekend or overnight intervenes"
      - name: wall_clock_basis
        when: "tier IN {RUSH, SAME_DAY}"
        difference: "Hours consumed continuously regardless of day-of-week"

  - name: work_order_quote
    trigger: "POST /quote (from DRAFT or QUOTE_EXPIRED) and successful PATCH amend while QUOTED"
    algorithm: tiered_pricing
    formula: |
      PINNED EVALUATION ORDER (steps are order-sensitive; do not reorder):
      (1) m = ceil(duration_seconds / 60)
      (2) duration_charge = 350*min(m,30) + 300*min(max(m-30,0),60) + 250*max(m-90,0)   # marginal brackets, NOT average-rate
      (3) tiered = ROUND_HALF_UP(duration_charge * TIER_MULTIPLIER, 0)                  # multiplier applied BEFORE discount
      (4) discount_pct from Client.ytd_completed_minutes AS IT STANDS AT QUOTE TIME:
            >= 10000 -> 0.10 ; >= 5000 -> 0.05 ; else 0
          discounted = ROUND_HALF_UP(tiered * (1 - discount_pct), 0)
      (5) quoted_price_cents = SETUP_FEE + discounted + LANGUAGE_FEE
      TIER_MULTIPLIER: STANDARD 1.00 | EXPRESS 1.50 | RUSH 2.00 | SAME_DAY 2.50
      LANGUAGE_FEE: 0 when language == "en-US", else 5000
      SETUP_FEE: 15000
      Note the circular-looking dependency: the volume discount depends on client
      volume, which grows on delivery — but the quote reads ytd BEFORE this order can
      ever deliver, and the multiplier must be applied before the discount. Reversing
      (3) and (4) changes the cents whenever tiered * discount_pct is non-integral.
    input_set: "The WorkOrder being quoted: tier, media duration_seconds, language; the owning Client's ytd_completed_minutes"
    constants:
      SETUP_FEE_CENTS: 15000
      BRACKET1_LIMIT_MIN: 30
      BRACKET1_RATE_CENTS: 350
      BRACKET2_LIMIT_MIN: 90
      BRACKET2_RATE_CENTS: 300
      BRACKET3_RATE_CENTS: 250
      DISCOUNT_TIER1_MINUTES: 5000
      DISCOUNT_TIER1_PCT: 0.05
      DISCOUNT_TIER2_MINUTES: 10000
      DISCOUNT_TIER2_PCT: 0.10
      NON_EN_LANGUAGE_FEE_CENTS: 5000
    precision: "integer cents; ROUND_HALF_UP at steps (3) and (4) only, intermediate values keep full precision"

  - name: caption_accuracy
    trigger: "POST /caption-tracks/{trackId}/qc-reviews (review finalizes immediately)"
    algorithm: weighted_scoring
    formula: |
      weighted_errors = minor_errors*1 + major_errors*3 + critical_errors*10
      denominator D:
        FULL_REVIEW    -> D = total_words
        SAMPLED_REVIEW -> D = sampled_words
      accuracy_pct = ROUND_HALF_UP( (1 - weighted_errors / D) * 100, 2 )
      Computed in EXACT DECIMAL arithmetic (no binary floating point); a single
      rounding step at the end. E.g. raw 98.995 rounds to 99.00 and PASSES an
      FCC_BROADCAST threshold of 99.00, because the threshold comparison is >=.
      threshold_pct by owning client compliance_standard:
        FCC_BROADCAST -> 99.00 ; SECTION_508 -> 98.50 ; INTERNAL -> 95.00
      outcome = PASS when accuracy_pct >= threshold_pct else FAIL
    input_set: "The new QCReview's error counts and mode; the track's work order's client compliance_standard"
    constants:
      WEIGHT_MINOR: 1
      WEIGHT_MAJOR: 3
      WEIGHT_CRITICAL: 10
      THRESHOLD_FCC: 99.00
      THRESHOLD_508: 98.50
      THRESHOLD_INTERNAL: 95.00
      MIN_SAMPLE_RATIO: 0.20
    precision: "exact decimal; ROUND_HALF_UP to 2 decimal places, single final rounding"
    variants:
      - name: full_review
        when: "review_mode = FULL_REVIEW (mandatory when client compliance_standard == FCC_BROADCAST; SAMPLED_REVIEW on FCC_BROADCAST -> ERR_REVIEW_MODE_NOT_PERMITTED)"
        difference: "Denominator is the whole track word count"
      - name: sampled_review
        when: "review_mode = SAMPLED_REVIEW (SECTION_508 or INTERNAL clients only)"
        difference: "Denominator is sampled_words; identical error counts and total_words yield a different accuracy_pct than full_review whenever sampled_words != total_words"

  - name: ad_gap_coverage
    trigger: "POST /audio-description-tracks/{adTrackId}/submit-script"
    algorithm: aggregation
    formula: |
      NESTED ROUNDING — ORDER PINNED (per-gap first, then mean):
      for each segment i placed in gap g_i:
        u_i = ROUND_HALF_UP( segments[i].duration_ms / (gaps[g_i].end_ms - gaps[g_i].start_ms) * 100, 1 )
      gap_coverage_pct = ROUND_HALF_UP( mean(u_i), 1 )
      Submission is rejected with ERR_GAP_COVERAGE_OUT_OF_BAND unless
      35.0 <= gap_coverage_pct <= 85.0 (both bounds inclusive).
      The alternative reading — sum all durations, divide by summed gap lengths,
      round once — yields a different value whenever per-gap roundings do not
      cancel out (e.g. utilizations 34.85/34.95/34.95 -> per-gap mean 35.0 PASS,
      sum-ratio 34.9 FAIL); the per-gap-first order above is the pinned one.
    input_set: "The AD track's gaps and segments arrays at submit time"
    constants:
      COVERAGE_MIN_PCT: 35.0
      COVERAGE_MAX_PCT: 85.0
    precision: "exact decimal; ROUND_HALF_UP to 1 dp per gap, then ROUND_HALF_UP to 1 dp on the mean"

  - name: stenographer_committed_minutes
    trigger: "Assignment create / accept / preempt / no-show / event cancel"
    algorithm: aggregation
    formula: |
      For stenographer S and UTC calendar day D:
        committed(S, D) = SUM(a.booked_minutes) over LiveAssignment a where
          a.stenographer_id == S AND a.event.start_at falls on day D (UTC)
          AND a.assignment_status IN {ACCEPTED, CONFIRMED, LIVE}
      booked_minutes = ceil((event.end_at - event.start_at)/60s) + event.prep_minutes + event.wrap_minutes
      Accept requires committed(S, D) + new.booked_minutes <= max_daily_live_minutes
      (boundary INCLUSIVE: equality is allowed; one minute over -> ERR_CAPACITY_EXCEEDED).
      CONSERVATION INVARIANT (capacity-minutes): for each (S, D),
        committed(S,D) + released(S,D) == SUM(booked_minutes over assignments that ever reached ACCEPTED)
      where released counts assignments that left {ACCEPTED, CONFIRMED, LIVE} for
      PREEMPTED / NO_SHOW / CANCELLED. PREEMPTED additionally credits
      make_up_minutes_credited by booked_minutes; NO_SHOW and CANCELLED do not.
    input_set: "Assignments of one stenographer with status in the committed set, grouped by UTC day of event start"
    constants:
      DEFAULT_DAILY_CAP_MINUTES: 300
    precision: "integer minutes"

  - name: stenographer_overlap_window
    trigger: "Assignment create (explicit stenographer) and accept (re-check)"
    algorithm: interval_merge
    formula: |
      Occupancy window of assignment a = [event.start_at - prep_minutes, event.end_at + wrap_minutes)
      HALF-OPEN with ASYMMETRIC buffers (prep on the left, wrap on the right).
      Conflict iff candidate window W and any existing window X over the same
      stenographer with status IN {ACCEPTED, CONFIRMED, LIVE} satisfy:
        W.start < X.end AND W.end > X.start
      Touching edges are NOT a conflict (W.start == X.end or W.end == X.start allowed).
      Two events whose raw air times do not overlap still conflict when the
      prep/wrap buffers intersect.
    input_set: "Candidate event window; the stenographer's committed-set assignments"
    constants: {}
    precision: "timestamp-second comparison"

  - name: studio_booking_window
    trigger: "POST /audio-description-tracks/{adTrackId}/book-studio"
    algorithm: interval_merge
    formula: |
      Studio bookings use CLOSED intervals with a mandatory MINIMUM GAP — a
      different geometry from stenographer occupancy (half-open, buffered).
      For the same studio_id, over OTHER AD tracks (a track re-booking itself never
      conflicts with its own prior booking) with ad_status IN {RECORDING, MIX_QC}
      and a non-null booking, candidate [ns, ne] conflicts with existing [es, ee] iff:
        NOT ( ne + 30min <= es OR ns >= ee + 30min )
      i.e. back-to-back is allowed only when exactly 30 minutes or more separate
      the bookings; 29 minutes is a conflict (ERR_STUDIO_TURNOVER_VIOLATION).
    input_set: "All booked AD tracks sharing the studio_id in RECORDING or MIX_QC"
    constants:
      STUDIO_TURNOVER_MIN: 30
    precision: "timestamp-second comparison; 30-minute gap evaluated exactly"

  - name: archive_purge_eligibility
    trigger: "POST /archive-items/{archiveItemId}/purge"
    algorithm: threshold
    formula: |
      retention_days: REGULATED_BROADCAST 2555 | STANDARD 1095 | LIVE_ONLY 90
      purge_after = archived_at + retention_days (computed once at first cold-store)
      eligible iff now >= purge_after (INCLUSIVE: purging exactly at purge_after succeeds)
        AND legal_hold == false AND dispute_freeze == false
        AND no complaint on the subject in {OPEN, TRIAGED, REMEDIATING, REOPENED}
      rearchive returns RESTORED_HOT -> COLD_STORE WITHOUT recomputing archived_at
      or purge_after — the retention clock never resets.
    input_set: "The ArchiveItem; complaints referencing its subject"
    constants:
      RETENTION_REGULATED_BROADCAST_DAYS: 2555
      RETENTION_STANDARD_DAYS: 1095
      RETENTION_LIVE_ONLY_DAYS: 90
    precision: "timestamp-second comparison, inclusive lower bound"

  - name: complaint_escalation
    trigger: "POST /_ops/run-sweep"
    algorithm: threshold
    formula: |
      For each complaint with complaint_status IN {OPEN, TRIAGED, REMEDIATING, REOPENED}:
        age_hours = (now - updated_at) / 1h
        threshold_hours: FCC_CRITICAL 24 | MAJOR 48 | MINOR 72
        if age_hours >= threshold_hours (INCLUSIVE): escalation_level += 1
      Escalation is itself a mutation, so updated_at refreshes and the next
      escalation requires another full threshold period. reopen also adds +1
      immediately (outside the sweep).
    input_set: "All non-terminal complaints except DISMISSED; RESOLVED complaints are not escalated"
    constants:
      ESCALATION_FCC_CRITICAL_H: 24
      ESCALATION_MAJOR_H: 48
      ESCALATION_MINOR_H: 72
    precision: "whole hours compared at second precision"

  - name: auto_offer_selector
    trigger: "Assignment create with stenographer_id omitted; decline cascade; preemption cascade"
    algorithm: weighted_scoring
    formula: |
      Candidate pool = Stenographers where ALL of:
        (a) steno_status == ACTIVE
        (b) certification == event.required_certification
        (c) cert_valid_until >= event.end_at
        (d) stenographer_overlap_window against the candidate event finds no conflict
        (e) committed(S, event day) + booked_minutes <= max_daily_live_minutes
        (f) S has no assignment for THIS event in {OFFERED, ACCEPTED, CONFIRMED, LIVE}
        (g) S has no assignment for THIS event in {DECLINED, PREEMPTED, NO_SHOW, OFFER_EXPIRED}
            (exclusion memory: a stenographer who declined or was preempted off this
            event is never re-offered it)
      RANKING (all keys over entity fields, never id):
        1. committed(S, event day) ASC
        2. certified_since ASC
        3. created_at ASC
      Winner = first by ranking. Empty pool:
        - direct create with omitted stenographer_id -> ERR_NO_ELIGIBLE_STENOGRAPHER (422)
        - decline/preemption cascade -> no assignment created (silent no-op), event left under-covered
    input_set: "All Stenographer rows; the target LiveEvent; existing assignments for both"
    constants: {}
    precision: "ranking keys compared at stored precision"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role name"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path template ids and body FK fields (client_id, media_asset_id, work_order_id, source_track_id, subject ids, stenographer_id when supplied) resolve to existing rows, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK inputs"
  - priority: 4
    category: auth
    check: "Ownership: ClientContact acting on confirm/accept-delivery/complaint create/complaint reopen must have X-User-ID == resource client_id; Stenographer on accept/decline/check-in must have X-User-ID == assignment.stenographer_id (evaluated on the loaded resource)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "POST confirm, POST accept-delivery, POST complaints, POST reopen, POST accept, POST decline, POST check-in"
  - priority: 5
    category: business_constraint
    check: "Request shape: required fields present; enum values in declared sets; duration_seconds > 0; end_at > start_at; record_end_at > record_start_at; cert_valid_until > certified_since; word counts >= 0 and total_words > 0; sampled_words present and >= ceil(total_words*0.20) when review_mode = SAMPLED_REVIEW; complaint body has exactly one subject FK non-null; segments non-empty at submit-script, every duration_ms > 0 and <= its gap length; gaps non-overlapping ascending"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_work_order_version / expected_live_event_version equals the parent row's current version"
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412
    applies_to: "POST /work-orders/{id}/caption-tracks, PATCH /work-orders/{id} (ERR_STALE_WORK_ORDER_VERSION); POST /live-events/{id}/assignments (ERR_STALE_LIVE_EVENT_VERSION, 412)"
  - priority: 7
    category: state
    check: "Target resource is in a from-state of the requested transition (per §1.2); terminal states reject all transitions"
    error_id: ERR_INVALID_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: QC reviewer X-User-ID != CaptionTrack.author_user_id; script/mix approver != AudioDescriptionTrack.author_user_id; complaint resolver != disputed track author_user_id. Compliance: SAMPLED_REVIEW forbidden for FCC_BROADCAST clients. Legal hold blocks purge."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST qc-reviews, POST approve-script, POST approve-mix, POST resolve (ERR_SEGREGATION_OF_DUTIES 403); POST qc-reviews SAMPLED on FCC (ERR_REVIEW_MODE_NOT_PERMITTED 422); POST purge with legal_hold (ERR_ARCHIVE_LEGAL_HOLD 409)"
  - priority: 9
    category: business_temporal
    check: "Time windows: confirm before quote_expires_at; accept before offer_expires_at; check-in inside [start-30min, start-10min] inclusive; complaint create within 30 days inclusive of subject completion (tracks: the work order's most recent delivered_at; live events: event end_at); reopen within 14 days (inclusive) of resolved_at"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "confirm (ERR_QUOTE_EXPIRED); accept (ERR_OFFER_EXPIRED); check-in (ERR_CHECKIN_WINDOW_CLOSED); complaints create (ERR_COMPLAINT_WINDOW_CLOSED); reopen (ERR_REOPEN_WINDOW_CLOSED) — all 409"
  - priority: 10
    category: business_constraint
    check: "Capacity/geometry/cardinality: SAME_DAY tier with m > 60 (ERR_TIER_DURATION_INCOMPATIBLE 422, at work-order create and amend); stenographer overlap (ERR_STENOGRAPHER_DOUBLE_BOOKED 409); committed-minutes cap (ERR_CAPACITY_EXCEEDED 422); studio turnover gap (ERR_STUDIO_TURNOVER_VIOLATION 409); gap coverage band (ERR_GAP_COVERAGE_OUT_OF_BAND 422); one non-terminal complaint per subject (ERR_COMPLAINT_ALREADY_OPEN 409); conversion target != source format (ERR_CONVERSION_SAME_FORMAT 422); embed only with SCC (ERR_EMBED_NOT_SUPPORTED 422); selector empty pool on auto-assign, or a directly-offered stenographer who is not ACTIVE / has a mismatched certification / whose cert_valid_until < event end_at (ERR_NO_ELIGIBLE_STENOGRAPHER 422); conversion retry attempt_count < 3 (ERR_RETRY_LIMIT_REACHED 409)"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "create/amend work order, create/accept assignment, book-studio, submit-script, complaints create, conversion create, assignment auto-create, conversion retry, begin-rework"
  - priority: 11
    category: business_referential
    check: "Linked-entity state: client ACTIVE for confirm and live-event create (ERR_CLIENT_NOT_ACTIVE); media CLEARED for confirm (ERR_MEDIA_NOT_CLEARED); conversion source track in {CONFORMED, DELIVERED, SUPERSEDED, ARCHIVED} (ERR_SOURCE_TRACK_NOT_FINAL); complaint subject in an eligible state — caption/AD track DELIVERED, live event WRAP or SETTLED (ERR_INVALID_TRANSITION); go-on-air requires a CONFIRMED assignment (ERR_GO_ON_AIR_BLOCKED); accept-delivery requires active_complaint_count == 0 (ERR_COMPLAINTS_STILL_OPEN); purge retention elapsed (ERR_RETENTION_NOT_ELAPSED); resolve requires remediation artifact DELIVERED (ERR_RESOLUTION_ARTIFACT_INCOMPLETE)"
    error_id: ERR_MEDIA_NOT_CLEARED
    http_status: 409
    applies_to: "confirm, live-event create, conversion create, complaints create, go-on-air, accept-delivery, purge, resolve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Client ---
  - method: POST
    path: "/caption-ad/clients"
    description: "Create a client organization"
    roles: [OperationsManager]
    code: 201
    input: [name, compliance_standard, "default_turnaround_tier?"]
    output: Client
    side_effects: ["client_status = ACTIVE", "ytd_completed_minutes = 0"]
  - method: GET
    path: "/caption-ad/clients"
    description: "List clients"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: ["limit?", "offset?", "client_status?"]
    output: "Client[]"
    side_effects: []
  - method: GET
    path: "/caption-ad/clients/{clientId}"
    description: "Get one client"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: POST
    path: "/caption-ad/clients/{clientId}/suspend"
    description: "Suspend a client (ACTIVE -> SUSPENDED); blocks confirm and live-event create"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Client
    side_effects: ["client_status = SUSPENDED"]
  - method: POST
    path: "/caption-ad/clients/{clientId}/reactivate"
    description: "Reactivate a suspended client"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Client
    side_effects: ["client_status = ACTIVE"]

  # --- MediaAsset ---
  - method: POST
    path: "/caption-ad/media-assets"
    description: "Register a source media asset (intake)"
    roles: [IntakeCoordinator]
    code: 201
    input: [client_id, title, media_kind, duration_seconds, frame_rate]
    output: MediaAsset
    side_effects: ["intake_status = RECEIVED"]
  - method: GET
    path: "/caption-ad/media-assets"
    description: "List media assets"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: ["limit?", "offset?", "client_id?", "intake_status?"]
    output: "MediaAsset[]"
    side_effects: []
  - method: GET
    path: "/caption-ad/media-assets/{mediaAssetId}"
    description: "Get one media asset"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: []
    output: MediaAsset
    side_effects: []
  - method: POST
    path: "/caption-ad/media-assets/{mediaAssetId}/begin-inspection"
    description: "RECEIVED -> INSPECTING"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: MediaAsset
    side_effects: ["intake_status = INSPECTING"]
  - method: POST
    path: "/caption-ad/media-assets/{mediaAssetId}/clear"
    description: "INSPECTING -> CLEARED"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: MediaAsset
    side_effects: ["intake_status = CLEARED"]
  - method: POST
    path: "/caption-ad/media-assets/{mediaAssetId}/reject"
    description: "INSPECTING -> REJECTED_INTAKE"
    roles: [IntakeCoordinator]
    code: 200
    input: [rejection_reason]
    output: MediaAsset
    side_effects: ["intake_status = REJECTED_INTAKE"]

  # --- WorkOrder ---
  - method: POST
    path: "/caption-ad/work-orders"
    description: "Create a work order (DRAFT). SAME_DAY tier with media > 60 min rejected (ERR_TIER_DURATION_INCOMPATIBLE)"
    roles: [IntakeCoordinator]
    code: 201
    input: [client_id, media_asset_id, service_type, turnaround_tier, language]
    output: WorkOrder
    side_effects: ["order_status = DRAFT"]
  - method: GET
    path: "/caption-ad/work-orders"
    description: "List work orders"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: ["limit?", "offset?", "client_id?", "media_asset_id?", "order_status?"]
    output: "WorkOrder[]"
    side_effects: []
  - method: GET
    path: "/caption-ad/work-orders/{workOrderId}"
    description: "Get one work order"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: POST
    path: "/caption-ad/work-orders/{workOrderId}/quote"
    description: "DRAFT or QUOTE_EXPIRED -> QUOTED; runs work_order_quote; sets quote_expires_at = now + 72h"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["work_order_quote computed", "quote_expires_at = now + 72h", "order_status = QUOTED"]
  - method: POST
    path: "/caption-ad/work-orders/{workOrderId}/confirm"
    description: "QUOTED -> CONFIRMED; computes due_at via sla_turnaround_window"
    roles: [ClientContact]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["sla_turnaround_window computed -> due_at", "order_status = CONFIRMED"]
  - method: PATCH
    path: "/caption-ad/work-orders/{workOrderId}"
    description: "Amend tier/language while DRAFT or QUOTED; OCC on expected_work_order_version; re-quotes when QUOTED"
    roles: [IntakeCoordinator]
    code: 200
    input: [expected_work_order_version, "turnaround_tier?", "language?"]
    output: WorkOrder
    side_effects: ["increments WorkOrder.version by 1", "when QUOTED: work_order_quote recomputed and quote_expires_at reset to now + 72h"]
  - method: POST
    path: "/caption-ad/work-orders/{workOrderId}/start-production"
    description: "CONFIRMED -> IN_PRODUCTION"
    roles: [CaptionEditor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["order_status = IN_PRODUCTION"]
  - method: POST
    path: "/caption-ad/work-orders/{workOrderId}/deliver"
    description: "READY_FOR_DELIVERY -> DELIVERED; delivers tracks, creates archive items, updates client ytd"
    roles: [OperationsManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["delivered_at = now; sla_breached = delivered_at > due_at", "CONFORMED tracks -> DELIVERED", "ArchiveItem created per delivered track", "Client.ytd_completed_minutes += ceil(duration_seconds/60)"]
  - method: POST
    path: "/caption-ad/work-orders/{workOrderId}/accept-delivery"
    description: "DELIVERED -> CLIENT_ACCEPTED; requires zero non-terminal complaints"
    roles: [ClientContact]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["order_status = CLIENT_ACCEPTED"]
  - method: POST
    path: "/caption-ad/work-orders/{workOrderId}/cancel"
    description: "DRAFT | QUOTED | CONFIRMED -> CANCELLED"
    roles: [IntakeCoordinator, OperationsManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["order_status = CANCELLED"]

  # --- CaptionTrack ---
  - method: POST
    path: "/caption-ad/work-orders/{workOrderId}/caption-tracks"
    description: "Create a caption track version (AUTHORING); supersedes the current version if any; OCC on expected_work_order_version; requires work order IN_PRODUCTION"
    roles: [CaptionEditor]
    code: 201
    input: [language, caption_format, speaker_id_style, expected_work_order_version, "supersedes_track_id?"]
    output: CaptionTrack
    side_effects: ["increments WorkOrder.version by 1", "prior current track -> SUPERSEDED", "version_no = prior + 1 (or 1)", "author_user_id = X-User-ID"]
  - method: GET
    path: "/caption-ad/caption-tracks"
    description: "List caption tracks"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: ["limit?", "offset?", "work_order_id?", "supersedes_track_id?", "track_status?"]
    output: "CaptionTrack[]"
    side_effects: []
  - method: GET
    path: "/caption-ad/caption-tracks/{trackId}"
    description: "Get one caption track"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: []
    output: CaptionTrack
    side_effects: []
  - method: POST
    path: "/caption-ad/caption-tracks/{trackId}/submit-review"
    description: "AUTHORING -> INTERNAL_REVIEW"
    roles: [CaptionEditor]
    code: 200
    input: []
    output: CaptionTrack
    side_effects: ["track_status = INTERNAL_REVIEW"]
  - method: POST
    path: "/caption-ad/caption-tracks/{trackId}/return-to-authoring"
    description: "INTERNAL_REVIEW -> AUTHORING"
    roles: [CaptionEditor]
    code: 200
    input: []
    output: CaptionTrack
    side_effects: ["track_status = AUTHORING"]
  - method: POST
    path: "/caption-ad/caption-tracks/{trackId}/enqueue-qc"
    description: "INTERNAL_REVIEW -> QC_QUEUED"
    roles: [CaptionEditor]
    code: 200
    input: []
    output: CaptionTrack
    side_effects: ["track_status = QC_QUEUED"]
  - method: POST
    path: "/caption-ad/caption-tracks/{trackId}/begin-rework"
    description: "QC_FAILED -> AUTHORING; a track at its third FAIL is QC_FAILED_PERMANENT (terminal) and rejects this with ERR_INVALID_TRANSITION"
    roles: [CaptionEditor]
    code: 200
    input: []
    output: CaptionTrack
    side_effects: ["track_status = AUTHORING"]
  - method: POST
    path: "/caption-ad/caption-tracks/{trackId}/mark-conformed"
    description: "QC_PASSED -> CONFORMED; requires work order IN_PRODUCTION; may bubble work order to READY_FOR_DELIVERY"
    roles: [CaptionEditor]
    code: 200
    input: []
    output: CaptionTrack
    side_effects: ["track_status = CONFORMED", "WorkOrder coverage recompute -> READY_FOR_DELIVERY when complete"]

  # --- QCReview ---
  - method: POST
    path: "/caption-ad/caption-tracks/{trackId}/qc-reviews"
    description: "Finalize an accuracy review on a QC_QUEUED track; computes caption_accuracy; drives track to QC_PASSED or QC_FAILED"
    roles: [QCSpecialist]
    code: 201
    input: [review_mode, total_words, minor_errors, major_errors, critical_errors, "sampled_words?"]
    output: QCReview
    side_effects: ["caption_accuracy computed", "track -> QC_PASSED (PASS) or QC_FAILED (FAIL, qc_attempts += 1; third FAIL -> QC_FAILED_PERMANENT)"]
  - method: GET
    path: "/caption-ad/qc-reviews"
    description: "List QC reviews"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: ["limit?", "offset?", "caption_track_id?", "outcome?"]
    output: "QCReview[]"
    side_effects: []
  - method: GET
    path: "/caption-ad/qc-reviews/{qcReviewId}"
    description: "Get one QC review"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: []
    output: QCReview
    side_effects: []

  # --- AudioDescriptionTrack ---
  - method: POST
    path: "/caption-ad/work-orders/{workOrderId}/audio-description-tracks"
    description: "Create an AD track (SCRIPTING) with program gaps and placed segments; requires work order IN_PRODUCTION"
    roles: [ADProducer]
    code: 201
    input: [language, narrator_name, gaps, segments]
    output: AudioDescriptionTrack
    side_effects: ["ad_status = SCRIPTING", "author_user_id = X-User-ID"]
  - method: GET
    path: "/caption-ad/audio-description-tracks"
    description: "List AD tracks"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: ["limit?", "offset?", "work_order_id?", "ad_status?"]
    output: "AudioDescriptionTrack[]"
    side_effects: []
  - method: GET
    path: "/caption-ad/audio-description-tracks/{adTrackId}"
    description: "Get one AD track"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: []
    output: AudioDescriptionTrack
    side_effects: []
  - method: PATCH
    path: "/caption-ad/audio-description-tracks/{adTrackId}"
    description: "Edit gaps/segments/narrator while SCRIPTING"
    roles: [ADProducer]
    code: 200
    input: ["gaps?", "segments?", "narrator_name?"]
    output: AudioDescriptionTrack
    side_effects: []
  - method: POST
    path: "/caption-ad/audio-description-tracks/{adTrackId}/submit-script"
    description: "SCRIPTING -> SCRIPT_REVIEW; computes ad_gap_coverage and enforces the [35.0, 85.0] band"
    roles: [ADProducer]
    code: 200
    input: []
    output: AudioDescriptionTrack
    side_effects: ["ad_gap_coverage computed -> gap_coverage_pct", "ad_status = SCRIPT_REVIEW"]
  - method: POST
    path: "/caption-ad/audio-description-tracks/{adTrackId}/approve-script"
    description: "SCRIPT_REVIEW -> RECORDING; approver != author (SoD)"
    roles: [QCSpecialist]
    code: 200
    input: []
    output: AudioDescriptionTrack
    side_effects: ["ad_status = RECORDING"]
  - method: POST
    path: "/caption-ad/audio-description-tracks/{adTrackId}/reject-script"
    description: "SCRIPT_REVIEW -> SCRIPTING"
    roles: [QCSpecialist]
    code: 200
    input: [rejection_note]
    output: AudioDescriptionTrack
    side_effects: ["ad_status = SCRIPTING"]
  - method: POST
    path: "/caption-ad/audio-description-tracks/{adTrackId}/book-studio"
    description: "Book studio time while RECORDING; enforces studio_booking_window (closed intervals, 30-min turnover)"
    roles: [ADProducer]
    code: 200
    input: [studio_id, record_start_at, record_end_at]
    output: AudioDescriptionTrack
    side_effects: ["studio booking stored"]
  - method: POST
    path: "/caption-ad/audio-description-tracks/{adTrackId}/submit-mix"
    description: "RECORDING -> MIX_QC; requires booking present and now >= record_end_at"
    roles: [ADProducer]
    code: 200
    input: []
    output: AudioDescriptionTrack
    side_effects: ["ad_status = MIX_QC"]
  - method: POST
    path: "/caption-ad/audio-description-tracks/{adTrackId}/approve-mix"
    description: "MIX_QC -> CONFORMED; approver != author (SoD); bubbles work order"
    roles: [QCSpecialist]
    code: 200
    input: []
    output: AudioDescriptionTrack
    side_effects: ["ad_status = CONFORMED", "WorkOrder coverage recompute"]
  - method: POST
    path: "/caption-ad/audio-description-tracks/{adTrackId}/reject-mix"
    description: "MIX_QC -> RECORDING; clears studio booking"
    roles: [QCSpecialist]
    code: 200
    input: [rejection_note]
    output: AudioDescriptionTrack
    side_effects: ["ad_status = RECORDING", "studio booking cleared"]

  # --- LiveEvent ---
  - method: POST
    path: "/caption-ad/live-events"
    description: "Schedule a live captioned event; requires client ACTIVE"
    roles: [Scheduler]
    code: 201
    input: [client_id, title, channel_id, start_at, end_at, required_certification, "prep_minutes?", "wrap_minutes?"]
    output: LiveEvent
    side_effects: ["event_status = SCHEDULED"]
  - method: GET
    path: "/caption-ad/live-events"
    description: "List live events"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: ["limit?", "offset?", "client_id?", "channel_id?", "event_status?"]
    output: "LiveEvent[]"
    side_effects: []
  - method: GET
    path: "/caption-ad/live-events/{liveEventId}"
    description: "Get one live event"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: []
    output: LiveEvent
    side_effects: []
  - method: POST
    path: "/caption-ad/live-events/{liveEventId}/go-on-air"
    description: "BRIEFED -> ON_AIR; CONFIRMED assignments -> LIVE"
    roles: [Scheduler]
    code: 200
    input: []
    output: LiveEvent
    side_effects: ["event_status = ON_AIR", "CONFIRMED assignments -> LIVE"]
  - method: POST
    path: "/caption-ad/live-events/{liveEventId}/wrap"
    description: "ON_AIR -> WRAP; requires now >= end_at; LIVE assignments -> COMPLETED"
    roles: [Scheduler]
    code: 200
    input: []
    output: LiveEvent
    side_effects: ["event_status = WRAP", "LIVE assignments -> COMPLETED"]
  - method: POST
    path: "/caption-ad/live-events/{liveEventId}/settle"
    description: "WRAP -> SETTLED; creates the LIVE_ONLY archive item"
    roles: [Scheduler]
    code: 200
    input: []
    output: LiveEvent
    side_effects: ["event_status = SETTLED", "ArchiveItem created (retention_class LIVE_ONLY)"]
  - method: POST
    path: "/caption-ad/live-events/{liveEventId}/cancel"
    description: "SCHEDULED | BRIEFED -> CANCELLED; cancels non-terminal assignments"
    roles: [Scheduler]
    code: 200
    input: []
    output: LiveEvent
    side_effects: ["event_status = CANCELLED", "assignments OFFERED|ACCEPTED|CONFIRMED -> CANCELLED"]

  # --- Stenographer ---
  - method: POST
    path: "/caption-ad/stenographers"
    description: "Roster a stenographer"
    roles: [Scheduler]
    code: 201
    input: [display_name, certification, certified_since, cert_valid_until, "max_daily_live_minutes?"]
    output: Stenographer
    side_effects: ["steno_status = ACTIVE"]
  - method: GET
    path: "/caption-ad/stenographers"
    description: "List stenographers"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: ["limit?", "offset?", "steno_status?", "certification?"]
    output: "Stenographer[]"
    side_effects: []
  - method: GET
    path: "/caption-ad/stenographers/{stenographerId}"
    description: "Get one stenographer"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: []
    output: Stenographer
    side_effects: []
  - method: POST
    path: "/caption-ad/stenographers/{stenographerId}/suspend"
    description: "ACTIVE -> SUSPENDED"
    roles: [Scheduler]
    code: 200
    input: []
    output: Stenographer
    side_effects: ["steno_status = SUSPENDED"]
  - method: POST
    path: "/caption-ad/stenographers/{stenographerId}/reinstate"
    description: "SUSPENDED -> ACTIVE"
    roles: [Scheduler]
    code: 200
    input: []
    output: Stenographer
    side_effects: ["steno_status = ACTIVE"]
  - method: POST
    path: "/caption-ad/stenographers/{stenographerId}/renew-certification"
    description: "CERTIFICATION_LAPSED -> ACTIVE with new cert_valid_until (> now)"
    roles: [Scheduler]
    code: 200
    input: [cert_valid_until]
    output: Stenographer
    side_effects: ["steno_status = ACTIVE", "cert_valid_until updated"]

  # --- LiveAssignment ---
  - method: POST
    path: "/caption-ad/live-events/{liveEventId}/assignments"
    description: "Offer an assignment (OFFERED). stenographer_id omitted -> auto_offer_selector picks. OCC on expected_live_event_version. Overlap/capacity checked at create when id supplied"
    roles: [Scheduler]
    code: 201
    input: [expected_live_event_version, "stenographer_id?"]
    output: LiveAssignment
    side_effects: ["increments LiveEvent.version by 1", "offer_expires_at = min(now + 4h, event.start_at)", "booked_minutes computed"]
  - method: GET
    path: "/caption-ad/live-assignments"
    description: "List live assignments"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: ["limit?", "offset?", "live_event_id?", "stenographer_id?", "assignment_status?"]
    output: "LiveAssignment[]"
    side_effects: []
  - method: GET
    path: "/caption-ad/live-assignments/{assignmentId}"
    description: "Get one live assignment"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: []
    output: LiveAssignment
    side_effects: []
  - method: POST
    path: "/caption-ad/live-assignments/{assignmentId}/accept"
    description: "OFFERED -> ACCEPTED; re-checks expiry, overlap, and capacity at accept time"
    roles: [Stenographer]
    code: 200
    input: []
    output: LiveAssignment
    side_effects: ["assignment_status = ACCEPTED"]
  - method: POST
    path: "/caption-ad/live-assignments/{assignmentId}/decline"
    description: "OFFERED -> DECLINED; cascades an auto-offer to the next-ranked eligible stenographer"
    roles: [Stenographer]
    code: 200
    input: []
    output: LiveAssignment
    side_effects: ["assignment_status = DECLINED", "auto_offer_selector cascade (decliner excluded)"]
  - method: POST
    path: "/caption-ad/live-assignments/{assignmentId}/check-in"
    description: "ACCEPTED -> CONFIRMED inside [start-30min, start-10min] inclusive; first CONFIRMED briefs the event"
    roles: [Stenographer]
    code: 200
    input: []
    output: LiveAssignment
    side_effects: ["assignment_status = CONFIRMED", "event SCHEDULED -> BRIEFED when first CONFIRMED"]
  - method: POST
    path: "/caption-ad/live-assignments/{assignmentId}/preempt"
    description: "ACCEPTED | CONFIRMED -> PREEMPTED; credits make-up minutes, drops event posture, cascades auto-offer"
    roles: [Scheduler]
    code: 200
    input: [preemption_reason]
    output: LiveAssignment
    side_effects: ["assignment_status = PREEMPTED", "Stenographer.make_up_minutes_credited += booked_minutes", "event BRIEFED -> SCHEDULED when no CONFIRMED remain", "auto_offer_selector cascade (preempted + decliner excluded)"]
  - method: POST
    path: "/caption-ad/live-assignments/{assignmentId}/mark-no-show"
    description: "ACCEPTED | CONFIRMED -> NO_SHOW at or after event start; no make-up credit; no auto-offer"
    roles: [Scheduler]
    code: 200
    input: []
    output: LiveAssignment
    side_effects: ["assignment_status = NO_SHOW", "Stenographer.no_show_count += 1", "event BRIEFED -> SCHEDULED when no CONFIRMED remain"]

  # --- Complaint ---
  - method: POST
    path: "/caption-ad/complaints"
    description: "Open an error complaint against one delivered caption track, AD track, or wrapped/settled live event"
    roles: [ClientContact]
    code: 201
    input: [severity, description, "caption_track_id?", "audio_description_track_id?", "live_event_id?"]
    output: Complaint
    side_effects: ["subject track DELIVERED -> DISPUTED", "ArchiveItem.dispute_freeze = true", "WorkOrder DELIVERED -> REMEDIATION, active_complaint_count += 1", "QUEUED ConversionJobs on the subject -> CANCELLED"]
  - method: GET
    path: "/caption-ad/complaints"
    description: "List complaints"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: ["limit?", "offset?", "client_id?", "caption_track_id?", "audio_description_track_id?", "live_event_id?", "remediation_track_id?", "complaint_status?"]
    output: "Complaint[]"
    side_effects: []
  - method: GET
    path: "/caption-ad/complaints/{complaintId}"
    description: "Get one complaint"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: []
    output: Complaint
    side_effects: []
  - method: POST
    path: "/caption-ad/complaints/{complaintId}/triage"
    description: "OPEN | REOPENED -> TRIAGED; may re-grade severity"
    roles: [OperationsManager]
    code: 200
    input: ["severity?"]
    output: Complaint
    side_effects: ["complaint_status = TRIAGED"]
  - method: POST
    path: "/caption-ad/complaints/{complaintId}/dismiss"
    description: "OPEN | TRIAGED -> DISMISSED; reverts the dispute cascade"
    roles: [OperationsManager]
    code: 200
    input: [rationale]
    output: Complaint
    side_effects: ["subject track DISPUTED -> DELIVERED", "dispute_freeze = false", "active_complaint_count -= 1; WorkOrder REMEDIATION -> DELIVERED at zero"]
  - method: POST
    path: "/caption-ad/complaints/{complaintId}/begin-remediation"
    description: "TRIAGED -> REMEDIATING; creates the remediation caption version or reopens the AD track"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Complaint
    side_effects: ["caption subject: new CaptionTrack version AUTHORING superseding the disputed one; remediation_track_id set", "AD subject: track DISPUTED -> SCRIPTING", "WorkOrder REMEDIATION -> IN_PRODUCTION"]
  - method: POST
    path: "/caption-ad/complaints/{complaintId}/resolve"
    description: "REMEDIATING -> RESOLVED (tracks; artifact must be DELIVERED) or TRIAGED -> RESOLVED (live events; note required); resolver != disputed author (SoD)"
    roles: [OperationsManager]
    code: 200
    input: ["resolution_note?"]
    output: Complaint
    side_effects: ["resolved_at, resolver_user_id set", "dispute_freeze = false", "active_complaint_count -= 1"]
  - method: POST
    path: "/caption-ad/complaints/{complaintId}/reopen"
    description: "RESOLVED -> REOPENED within 14 days inclusive; re-disputes the subject and escalates"
    roles: [ClientContact]
    code: 200
    input: []
    output: Complaint
    side_effects: ["escalation_level += 1", "subject track DELIVERED -> DISPUTED", "dispute_freeze = true", "WorkOrder DELIVERED -> REMEDIATION"]

  # --- ConversionJob ---
  - method: POST
    path: "/caption-ad/conversion-jobs"
    description: "Queue a format conversion / embedding job for a final caption track"
    roles: [OperationsManager, CaptionEditor]
    code: 201
    input: [source_track_id, target_format, "embed?"]
    output: ConversionJob
    side_effects: ["job_status = QUEUED"]
  - method: GET
    path: "/caption-ad/conversion-jobs"
    description: "List conversion jobs"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: ["limit?", "offset?", "source_track_id?", "job_status?"]
    output: "ConversionJob[]"
    side_effects: []
  - method: GET
    path: "/caption-ad/conversion-jobs/{conversionJobId}"
    description: "Get one conversion job"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: []
    output: ConversionJob
    side_effects: []
  - method: POST
    path: "/caption-ad/conversion-jobs/{conversionJobId}/run"
    description: "Run one conversion pass; worker reports output_duration_ms; |delta| <= 250ms -> COMPLETED else FAILED_VALIDATION"
    roles: [OperationsManager]
    code: 200
    input: [output_duration_ms]
    output: ConversionJob
    side_effects: ["COMPLETED or FAILED_VALIDATION (attempt_count += 1); output_duration_ms and last_delta_ms stored"]
  - method: POST
    path: "/caption-ad/conversion-jobs/{conversionJobId}/retry"
    description: "FAILED_VALIDATION -> QUEUED; attempt_count < 3 required"
    roles: [OperationsManager]
    code: 200
    input: []
    output: ConversionJob
    side_effects: ["job_status = QUEUED"]
  - method: POST
    path: "/caption-ad/conversion-jobs/{conversionJobId}/cancel"
    description: "QUEUED -> CANCELLED"
    roles: [OperationsManager]
    code: 200
    input: []
    output: ConversionJob
    side_effects: ["job_status = CANCELLED"]

  # --- ArchiveItem ---
  - method: GET
    path: "/caption-ad/archive-items"
    description: "List archive items"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: ["limit?", "offset?", "caption_track_id?", "audio_description_track_id?", "live_event_id?", "archive_status?"]
    output: "ArchiveItem[]"
    side_effects: []
  - method: GET
    path: "/caption-ad/archive-items/{archiveItemId}"
    description: "Get one archive item"
    roles: [ClientContact, IntakeCoordinator, CaptionEditor, ADProducer, QCSpecialist, Scheduler, Stenographer, OperationsManager]
    code: 200
    input: []
    output: ArchiveItem
    side_effects: []
  - method: POST
    path: "/caption-ad/archive-items/{archiveItemId}/cold-store"
    description: "ACTIVE_HOLD -> COLD_STORE; pins archived_at and purge_after; blocked while dispute_freeze"
    roles: [OperationsManager]
    code: 200
    input: []
    output: ArchiveItem
    side_effects: ["archived_at = now", "purge_after = now + retention days (pinned once)"]
  - method: POST
    path: "/caption-ad/archive-items/{archiveItemId}/request-restore"
    description: "COLD_STORE -> RESTORE_PENDING"
    roles: [OperationsManager]
    code: 200
    input: []
    output: ArchiveItem
    side_effects: ["archive_status = RESTORE_PENDING"]
  - method: POST
    path: "/caption-ad/archive-items/{archiveItemId}/complete-restore"
    description: "RESTORE_PENDING -> RESTORED_HOT"
    roles: [OperationsManager]
    code: 200
    input: []
    output: ArchiveItem
    side_effects: ["archive_status = RESTORED_HOT"]
  - method: POST
    path: "/caption-ad/archive-items/{archiveItemId}/rearchive"
    description: "RESTORED_HOT -> COLD_STORE; archived_at and purge_after NOT recomputed"
    roles: [OperationsManager]
    code: 200
    input: []
    output: ArchiveItem
    side_effects: ["archive_status = COLD_STORE; retention clock unchanged"]
  - method: POST
    path: "/caption-ad/archive-items/{archiveItemId}/purge"
    description: "COLD_STORE -> PURGED; retention elapsed (inclusive), no legal hold, no dispute freeze, no open complaints"
    roles: [OperationsManager]
    code: 200
    input: []
    output: ArchiveItem
    side_effects: ["archive_status = PURGED"]
  - method: POST
    path: "/caption-ad/archive-items/{archiveItemId}/set-legal-hold"
    description: "Set or clear legal_hold"
    roles: [OperationsManager]
    code: 200
    input: [legal_hold]
    output: ArchiveItem
    side_effects: ["legal_hold updated"]

  # --- Test-driving / ops ---
  - method: POST
    path: "/caption-ad/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any set call) is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time"
    roles: [OperationsManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced"]
  - method: POST
    path: "/caption-ad/_ops/run-sweep"
    description: "Ops-run checkpoint: expires offers and quotes, marks SLA breaches, escalates aged complaints, lapses certifications, archives delivered tracks of CLIENT_ACCEPTED orders older than 30 days"
    roles: [OperationsManager]
    code: 200
    input: []
    output: { expired_offer_count: integer, expired_quote_count: integer, sla_breach_count: integer, escalated_complaint_count: integer, lapsed_certification_count: integer, archived_track_count: integer }
    side_effects: ["OFFERED past offer_expires_at -> OFFER_EXPIRED", "QUOTED past quote_expires_at -> QUOTE_EXPIRED", "sla_breached = true where due_at < now on CONFIRMED/IN_PRODUCTION/READY_FOR_DELIVERY", "complaint_escalation applied", "ACTIVE stenographers past cert_valid_until -> CERTIFICATION_LAPSED", "DELIVERED tracks of CLIENT_ACCEPTED orders with delivered_at <= now - 30d -> ARCHIVED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed caller does not own the target resource (client_id or stenographer_id mismatch)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not resolve" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, bad enum, non-positive duration, inverted time range, bad sample size, malformed gaps/segments, or not exactly one complaint subject" }
  - { id: ERR_STALE_WORK_ORDER_VERSION, http: 412, condition: "expected_work_order_version does not match the work order's current version" }
  - { id: ERR_STALE_LIVE_EVENT_VERSION, http: 412, condition: "expected_live_event_version does not match the live event's current version" }
  - { id: ERR_INVALID_TRANSITION, http: 409, condition: "Target resource not in a from-state of the requested transition; terminal-state lockdown" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Reviewer/approver/resolver is the same user as the artifact's author" }
  - { id: ERR_REVIEW_MODE_NOT_PERMITTED, http: 422, condition: "SAMPLED_REVIEW submitted for an FCC_BROADCAST client" }
  - { id: ERR_ARCHIVE_LEGAL_HOLD, http: 409, condition: "Purge attempted while legal_hold is true" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Confirm attempted at or after quote_expires_at" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "Accept attempted at or after offer_expires_at" }
  - { id: ERR_CHECKIN_WINDOW_CLOSED, http: 409, condition: "Check-in outside [start-30min, start-10min] inclusive" }
  - { id: ERR_COMPLAINT_WINDOW_CLOSED, http: 409, condition: "Complaint opened more than 30 days after subject delivery/wrap" }
  - { id: ERR_REOPEN_WINDOW_CLOSED, http: 409, condition: "Reopen attempted more than 14 days after resolved_at" }
  - { id: ERR_TIER_DURATION_INCOMPATIBLE, http: 422, condition: "SAME_DAY tier requested for media longer than 60 minutes" }
  - { id: ERR_STENOGRAPHER_DOUBLE_BOOKED, http: 409, condition: "Buffered half-open occupancy windows intersect on the same stenographer" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "committed + booked minutes would exceed max_daily_live_minutes for the event day" }
  - { id: ERR_STUDIO_TURNOVER_VIOLATION, http: 409, condition: "Studio bookings on the same studio_id separated by less than 30 minutes" }
  - { id: ERR_GAP_COVERAGE_OUT_OF_BAND, http: 422, condition: "ad_gap_coverage outside [35.0, 85.0] inclusive" }
  - { id: ERR_COMPLAINT_ALREADY_OPEN, http: 409, condition: "Subject already has a complaint in OPEN | TRIAGED | REMEDIATING | REOPENED" }
  - { id: ERR_CONVERSION_SAME_FORMAT, http: 422, condition: "target_format equals the source track's caption_format" }
  - { id: ERR_EMBED_NOT_SUPPORTED, http: 422, condition: "embed = true with target_format other than SCC" }
  - { id: ERR_NO_ELIGIBLE_STENOGRAPHER, http: 422, condition: "auto_offer_selector candidate pool empty on direct create" }
  - { id: ERR_RETRY_LIMIT_REACHED, http: 409, condition: "Conversion retry with attempt_count == 3" }
  - { id: ERR_CLIENT_NOT_ACTIVE, http: 409, condition: "Confirm or live-event create for a SUSPENDED/TERMINATED client" }
  - { id: ERR_MEDIA_NOT_CLEARED, http: 409, condition: "Confirm while the media asset is not CLEARED" }
  - { id: ERR_SOURCE_TRACK_NOT_FINAL, http: 409, condition: "Conversion source track not in CONFORMED | DELIVERED | SUPERSEDED | ARCHIVED" }
  - { id: ERR_GO_ON_AIR_BLOCKED, http: 409, condition: "go-on-air with no CONFIRMED assignment" }
  - { id: ERR_COMPLAINTS_STILL_OPEN, http: 409, condition: "accept-delivery or purge while non-terminal complaints reference the order/subject" }
  - { id: ERR_RETENTION_NOT_ELAPSED, http: 409, condition: "Purge before purge_after" }
  # ERR_DELIVERY_INCOMPLETE deliberately absent: deliver from a non-READY state is
  # covered by ERR_INVALID_TRANSITION (READY_FOR_DELIVERY already implies coverage).
  - { id: ERR_RESOLUTION_ARTIFACT_INCOMPLETE, http: 409, condition: "Resolve while the remediation artifact is not DELIVERED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClientContact
    description: "Contact at a client organization; confirms quotes, accepts deliveries, files and reopens complaints"
    identity: "entity_backed:Client"
    exclusive_operations: [confirm work order, accept delivery, create complaint, reopen complaint]
    shared_operations: [read any resource]
  - name: IntakeCoordinator
    description: "Intake operator; registers media, runs technical QC of sources, drafts and quotes work orders"
    identity: "opaque"
    exclusive_operations: [create/inspect/clear/reject media assets, create/quote/amend/cancel work orders]
    shared_operations: [read any resource]
  - name: CaptionEditor
    description: "Caption author; drives the caption track lifecycle from authoring through conform"
    identity: "opaque"
    exclusive_operations: [create caption tracks, submit-review, return-to-authoring, enqueue-qc, begin-rework, mark-conformed, start-production]
