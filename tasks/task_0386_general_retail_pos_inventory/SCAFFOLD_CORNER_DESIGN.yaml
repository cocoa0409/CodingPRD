              as: StoreManager
              captures: { la: $.data.id }
            - call: "POST /layaways"
              payload: { store_id: "${sid}", product_id: "${p}", customer_id: "${la}", quantity: 2, due_date: "2030-12-31T00:00:00Z", initial_deposit_cents: 1000 }
              as: Cashier
              captures: { lay: $.data.id }
          trigger:
            - call: "POST /layaways/${lay}/cancel"
              payload: {}
              as: StoreManager
          assert:
            - "Layaway.${lay}.status == CANCELLED."
            - "InventoryItem.${inv}.reserved_qty == 0 and available_qty == 5 (reservation released)."

      - name: discontinue_product_then_get_shows_status
        claim_type: Side Effect Execution
        grounds: [state_machines.Product, endpoints]
        distinguishing_aspect: "POST /products/{id}/discontinue flips status ACTIVE->DISCONTINUED, observable on GET."
