      - name: refund_exceeds_redemption_rejected
        claim_type: Cross-entity validation
        grounds:
          - "validations[priority=13]"
          - "state_machines.RefundRequest.PENDING_to_APPLIED"
          - "errors[ERR_REFUND_EXCEEDS_REDEMPTION]"
        distinguishing_aspect: "Approving a refund of 6000 referencing a redemption whose allocated_amount_cents is 4500 → ERR_REFUND_EXCEEDS_REDEMPTION (409)."
        test_recipe:
          setup: ["a SETTLED redemption allocated 4500 over A,B owned by a customer; a PENDING RefundRequest of 6000 referencing it on card A"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "c@x.com", full_name: "C", residence_state_code: "FL" }
              as: ProgramAdmin
              captures: { cust: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL", owner_customer_id: "${cust}" }
              as: StoreAssociate
              captures: { a: $.data.id }
            - call: "POST /v1/cards/${a}/activate"
              payload: { initial_load_cents: 3000 }
              as: StoreAssociate
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL", owner_customer_id: "${cust}" }
              as: StoreAssociate
              captures: { b: $.data.id }
            - call: "POST /v1/cards/${b}/activate"
              payload: { initial_load_cents: 1500 }
              as: StoreAssociate
            - call: "POST /v1/redemptions"
              payload: { program_id: "${prog}", requested_amount_cents: 4500, card_id_order: ["${a}", "${b}"], customer_id: "${cust}" }
              as: StoreAssociate
              captures: { red: $.data.id, rv: $.data.version }
            - call: "POST /v1/redemptions/${red}/settle"
              payload: { expected_redemption_version: "${rv}" }
              as: StoreAssociate
            - call: "POST /v1/cards/${a}/reload"
              payload: { amount_cents: 7000 }
              as: StoreAssociate
            - call: "POST /v1/refunds"
              payload: { card_id: "${a}", requested_refund_cents: 6000, redemption_id: "${red}" }
              as: ProgramAdmin
              captures: { ref: $.data.id }
          trigger:
            - call: "POST /v1/refunds/${ref}/approve"
              payload: {}
              as: ProgramAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "${eid} == ERR_REFUND_EXCEEDS_REDEMPTION"

      - name: bulk_quote_non_corporate_buyer_rejected_on_confirm
        claim_type: Conditional validation
        grounds:
          - "state_machines.BulkOrder.QUOTED_to_CONFIRMED"
          - "errors[ERR_NOT_CORPORATE_BUYER]"
        distinguishing_aspect: "Confirming a bulk order whose buyer is not corporate (is_corporate false) → ERR_NOT_CORPORATE_BUYER (409)."
        test_recipe:
