  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: deliverable_miss_deal_breach_clawback_cascade
        grounds: [state_machines.Deliverable.SCHEDULED_to_MISSED, state_machines.SponsorshipDeal.ACTIVE_to_BREACHED, calculations.payout_balance_ledger]
        distinguishing_aspect: |
          Depth-3 chain from the deliverable-miss trigger: Deliverable SCHEDULED->MISSED mutates
          Deal.miss_count [1]; miss_count reaching 3 transitions Deal ACTIVE->BREACHED [2];
          BREACHED creates a CHARGEBACK RevenueEvent [3]; that event recomputes
          Channel.balance_payable_cents to -5400000 [4].
        test_recipe:
          setup:
            - "Channel STANDARD (W9 verified); deal ACTIVE (flight 2026-08-05..2026-09-30, value 6000000, required 3) with SPONSORSHIP event PENDING; three deliverables due 2026-08-06; clock advanced to 2026-08-07 before ops run"
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "tc_breach", display_name: "TC Breach", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /api/channels/${ch_id}/tax-forms"
              payload: { form_type: "W9", legal_name: "TC Breach LLC", tax_id_last4: "4444", expected_channel_version: "${ch_v}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /api/tax-forms/${tf_id}/transition"
              payload: { action: "VERIFY" }
              as: TrustAgent
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/deals"
              payload: { sponsor_ref: "sponsor_acme", title: "Acme breach", category: "VPN", total_value_cents: 6000000, flight_start: "2026-08-05T00:00:00Z", flight_end: "2026-09-30T00:00:00Z", required_deliverable_count: 3 }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { d_id: $.data.id }
            - call: "POST /api/deals/${d_id}/transition"
              payload: { action: "PROPOSE" }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "POST /api/deals/${d_id}/transition"
              payload: { action: "ACCEPT" }
              as: Sponsor
              as_user_id: "sponsor_acme"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deals/${d_id}/transition"
              payload: { action: "ACTIVATE" }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "POST /api/deals/${d_id}/deliverables"
              payload: { kind: "AD_READ", due_at: "2026-08-06T00:00:00Z" }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "POST /api/deals/${d_id}/deliverables"
              payload: { kind: "SPONSORED_SEGMENT", due_at: "2026-08-06T00:00:00Z" }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "POST /api/deals/${d_id}/deliverables"
              payload: { kind: "LOGO_PLACEMENT", due_at: "2026-08-06T00:00:00Z" }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/ops/run"
              as: PlatformAdmin
            - call: "GET /api/deals/${d_id}"
              as: Creator
              as_user_id: "${ch_id}"
              captures: { d_status: $.data.deal_status, d_miss: $.data.miss_count }
