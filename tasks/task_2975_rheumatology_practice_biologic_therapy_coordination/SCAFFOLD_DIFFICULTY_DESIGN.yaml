  - rule_id: transitive_cascade
    instances:
      - name: lab_grade_hold_cascade_releases_units_and_reactivates_enrollment
        grounds:
          - calculations.lab_abnormal_grade
          - state_machines.TherapyEpisode.therapy_state.ACTIVE_to_HELD_system_lab
          - state_machines.InfusionAppointment.SCHEDULED_to_CANCELLED_system
          - state_machines.AssistanceEnrollment.EXHAUSTED_to_ACTIVE
          - entities.Authorization.fields.units_reserved
          - entities.AssistanceEnrollment.fields.benefit_remaining_cents
        distinguishing_aspect: |
          Depth 4, triggered by POST /monitoring-labs. Link 1: the stored panel grades ALT 450.0
          as abnormal_grade 4, which sets triggers_hold. Link 2 is caused by link 1, not by the
          POST: the triggers_hold flag drives TherapyEpisode ACTIVE -> HELD. Link 3 is caused by
          link 2: entering HELD cancels the episode's SCHEDULED appointment. Link 4 is caused by
          link 3: the cancellation releases the appointment's reserved unit and its
          assistance_applied_cents, and because that release lifts benefit_remaining_cents above
          zero, the EXHAUSTED enrollment returns to ACTIVE. Nothing in the request body mentions
          appointments, authorizations or enrollments.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Infliximab (TNFI, IV, 250050 cents, 150 minutes, CMP / 90 days) on Meridian PPO; AMBULATORY_INFUSION_CENTER chair AIC-1 with a 30-minute turnover buffer."
