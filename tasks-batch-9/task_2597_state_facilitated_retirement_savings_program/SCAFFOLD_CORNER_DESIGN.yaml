            - "Employer.${emp_id}.registration_status == REGISTERED"
            - "Employer.${emp_id}.compliance_status == COMPLIANT"
            - "the second trigger call returns status == 200 with data.current_utc == 2026-08-01T00:00:00Z"

      - name: auto_enrollment_run_activates_only_the_ripe_notified_enrollments
        claim_type: bulk_action
        grounds:
          - endpoints[POST /_ops/auto-enrollment-run]
          - state_machines.Enrollment.NOTIFIED_to_ACTIVE
          - calculations.default_investment_option_selection
        distinguishing_aspect: "The batch is skip-not-fail: of three enrollments it activates only Ben (deadline 2026-01-31 reached), skips Rosa because she already OPTED_OUT and skips Cleo because her 2026-03-02 deadline has not arrived, and it reports 1 activated / 1 account opened / 2 examined-but-skipped in one response. skipped_count counts every enrollment the run examined and did not activate, so a run that aborts on the first non-activatable row, or that activates on the day BEFORE the deadline, is caught."
        test_recipe:
          setup:
            - "ProgramYear 2026 with opt_out_window_days 30; TDF2045 on the menu; Delta Fabrication registered"
            - "At clock 2026-01-01 Rosa Lim and Ben Ortiz are enrolled, both with opt_out_deadline 2026-01-31; Rosa opts out on 2026-01-05"
            - "The clock is moved to 2026-01-31 and Cleo Navarro is then enrolled, giving her opt_out_deadline 2026-03-02"
            - "No ParticipantAccount rows exist yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "TDF2045", name: "Target Retirement 2045", category: "TARGET_DATE", target_year: 2045, expense_ratio_bp: 30, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /employers"
              payload: { ein: "12-3456789", legal_name: "Delta Fabrication LLC", worksite_state: "CA", employee_count: 60 }
              as: ProgramAdministrator
              captures: { emp_id: "$.data.id" }
            - call: "POST /employers/${emp_id}/registration"
