              payload: { plan_id: "${v14_plan}", email: "v14@kidswear.test", display_name: "Val Fourteen", child_size_code: "5", auto_apply_credit: false }
              as: PlatformAdmin
              captures: { v14_m: $.data.id }
            - call: "POST /kidswear/members/${v14_m}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/members/${v14_m}/credit-adjustments"
