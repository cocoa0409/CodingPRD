  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_timesheet_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_TIMESHEET_OVERLAP]"]
        excluded_because:
          difficulty_instance: timesheet_half_open_adjacency
          rationale: "ERR_TIMESHEET_OVERLAP is asserted there."
      - name: error_leave_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_LEAVE_OVERLAP]"]
        excluded_because:
          difficulty_instance: leave_closed_interval_adjacency
          rationale: "ERR_LEAVE_OVERLAP is asserted there (and again as the winning error in leave_overlap_beats_balance)."
      - name: error_filings_incomplete
        claim_type: violation_to_error
        grounds: ["errors[ERR_FILINGS_INCOMPLETE]"]
        excluded_because:
          difficulty_instance: year_end_finalize_requires_accepted_filings
          rationale: "ERR_FILINGS_INCOMPLETE is asserted there."
      - name: error_invalid_state_generic
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: timesheet_reject_resubmit_cycle
          rationale: "ERR_INVALID_STATE is asserted across the state_machines section instances and this difficulty instance."

