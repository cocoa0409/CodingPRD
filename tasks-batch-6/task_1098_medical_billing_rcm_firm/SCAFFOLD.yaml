scenario: "Outsourced Medical Billing & RCM Firm: client/practice onboarding & fee-schedule, charge entry & coding-scrub, claim submission & clearinghouse, denial-management & appeal, patient-statement & collections, payment-posting & reconciliation, credentialing linkage, KPI/% billing"
domain_name: "medical-billing-rcm-firm"
api_prefix: "/rcm"

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: hybrid
  # Practice → FeeSchedule/Provider/Claim tree, with cross-cutting PayerEnrollment
  # (Provider×Payer junction) and RemittanceAdvice→PaymentPosting→Claim reconciliation.
  state_machine_shape: cyclic
  # Claim loops DENIED→APPEALED→DENIED across appeal rounds; Appeal forks SUBMITTED→{OVERTURNED,UPHELD}.
  relationship_patterns:
    - one_to_many          # Practice→Claim, Claim→ClaimLine, FeeSchedule→FeeScheduleLine
    - many_to_many         # PayerEnrollment junction (Provider×Payer)
    - cross_aggregate      # PaymentPosting references both RemittanceAdvice and Claim
  role_model: segregation_of_duties
  # Same X-User-ID that scrubbed a claim may not submit it; firm staff roles are opaque operators.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Practice
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Client practice legal name"
      - name: npi
        type: string
        source: input
        description: "Group National Provider Identifier (10 digits)"
      - name: tax_id
        type: string
        source: input
        description: "Employer tax identification number"
      - name: billing_fee_pct
        type: number
        source: input
        description: "RCM firm commission rate applied to this practice (e.g. 0.06 = 6%)"
        constraints: "0 < billing_fee_pct < 1"
      - name: status
        type: enum
        source: system
        description: "Onboarding lifecycle status"
        default: PROSPECT
        constraints: "one of {PROSPECT, ONBOARDING, ACTIVE, SUSPENDED, TERMINATED}"
      - name: ar_balance_cents
        type: integer
        source: computed
        description: "Outstanding accounts-receivable across all non-terminal claims (sum of Claim.outstanding_balance_cents)"
        default: 0
      - name: collected_ytd_cents
        type: integer
        source: computed
        description: "Total insurance payments posted to this practice's claims year-to-date"
        default: 0
  - name: Payer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Insurance payer name"
      - name: payer_type
        type: enum
        source: input
        description: "Payer category"
        constraints: "one of {COMMERCIAL, MEDICARE, MEDICAID}"
      - name: timely_filing_days
        type: integer
        source: input
        description: "Maximum days from service_date within which a claim must be submitted"
        constraints: "timely_filing_days >= 1"
      - name: appeal_window_days
        type: integer
        source: input
        description: "Maximum days from denial_date within which an appeal must be submitted"
        constraints: "appeal_window_days >= 1"
  - name: Provider
    parent: Practice
    common_fields: true
    fields:
      - name: practice_id
        type: string
        source: input
        description: "FK -> Practice.id; the practice this rendering provider belongs to"
      - name: npi
        type: string
        source: input
        description: "Individual provider NPI (10 digits)"
      - name: first_name
        type: string
        source: input
        description: "Provider given name"
      - name: last_name
        type: string
        source: input
        description: "Provider family name"
      - name: specialty
        type: string
        source: input
        description: "Clinical specialty label"
      - name: credentialing_status
        type: enum
        source: system
        description: "Credentialing lifecycle status"
        default: PENDING
        constraints: "one of {PENDING, SUBMITTED, APPROVED, REJECTED, EXPIRED}"
      - name: credentialing_expiration_date
        type: datetime
        source: system
        description: "Date on which an APPROVED credential expires; null until approved"
  - name: PayerEnrollment
    parent: null
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the enrolled provider"
      - name: payer_id
        type: string
        source: input
        description: "FK -> Payer.id; the payer the provider is enrolled with"
      - name: effective_date
        type: datetime
        source: input
        description: "Start of the enrollment participation period (inclusive)"
      - name: termination_date
        type: datetime
        source: input
        description: "End of the enrollment participation period (exclusive); null = open-ended"
      - name: status
        type: enum
        source: system
        description: "Enrollment lifecycle status"
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, TERMINATED}"
  - name: FeeSchedule
    parent: Practice
    common_fields: true
    fields:
      - name: practice_id
        type: string
        source: input
        description: "FK -> Practice.id; the practice this fee schedule prices"
      - name: effective_date
        type: datetime
        source: input
        description: "Start of the fee schedule's effective interval (inclusive)"
      - name: end_date
        type: datetime
        source: input
        description: "End of the fee schedule's effective interval (inclusive); null = open-ended"
      - name: status
        type: enum
        source: system
        description: "Fee schedule lifecycle status"
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, SUPERSEDED, RETIRED}"
  - name: FeeScheduleLine
    parent: FeeSchedule
    common_fields: false
    fields:
      - name: fee_schedule_id
        type: string
        source: input
        description: "FK -> FeeSchedule.id; owning fee schedule"
      - name: cpt_code
        type: string
        source: input
        description: "CPT/HCPCS procedure code priced by this line"
      - name: allowed_amount_cents
        type: integer
        source: input
        description: "Contractual allowed amount for this CPT under this schedule, in cents"
        constraints: "allowed_amount_cents >= 0"
  - name: Claim
    parent: Practice
    common_fields: true
    fields:
      - name: practice_id
        type: string
        source: input
        description: "FK -> Practice.id; billing client that owns this claim"
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; rendering provider"
      - name: payer_id
        type: string
        source: input
        description: "FK -> Payer.id; responsible insurance payer"
      - name: service_date
        type: datetime
        source: input
        description: "Date of service; timely-filing clock starts here"
      - name: deductible_remaining_cents
        type: integer
        source: input
        description: "Patient deductible not yet met at time of service, in cents"
        constraints: "deductible_remaining_cents >= 0"
      - name: coinsurance_pct
        type: number
        source: input
        description: "Patient coinsurance rate applied after deductible (e.g. 0.20)"
        constraints: "0 <= coinsurance_pct <= 1"
      - name: copay_cents
        type: integer
        source: input
        description: "Flat patient copay for the visit, in cents"
        constraints: "copay_cents >= 0"
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle status"
        default: DRAFT
        constraints: "one of {DRAFT, SCRUBBED, SUBMITTED, ACCEPTED, DENIED, APPEALED, PAID, CLOSED, VOID}"
      - name: billed_amount_cents
        type: integer
        source: computed
        description: "Sum of ClaimLine.charge_amount_cents; frozen at scrub"
        default: 0
      - name: allowed_amount_cents
        type: integer
        source: computed
        description: "Sum of ClaimLine.allowed_amount_cents from active fee schedule; frozen at scrub"
        default: 0
      - name: contractual_adjustment_cents
        type: integer
        source: computed
        description: "billed_amount_cents - allowed_amount_cents; write-down the payer contract mandates"
        default: 0
      - name: patient_responsibility_cents
        type: integer
        source: computed
        description: "Provisional patient responsibility from deductible+coinsurance+copay, computed at scrub"
        default: 0
      - name: expected_reimbursement_cents
        type: integer
        source: computed
        description: "Provisional expected insurance payment = allowed_amount_cents - patient_responsibility_cents, at scrub"
        default: 0
      - name: insurance_paid_cents
        type: integer
        source: computed
        description: "Sum of insurance_paid_cents across non-reversed PaymentPostings on this claim"
        default: 0
      - name: write_off_cents
        type: integer
        source: computed
        description: "Amount written off via denial closure or statement write-off"
        default: 0
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "billed - contractual_adjustment - insurance_paid - patient_responsibility - write_off"
        default: 0
      - name: scrubbed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Coder who scrubbed the claim; used for segregation-of-duties on submit"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Biller who submitted the claim"
      - name: submission_date
        type: datetime
        source: system
        description: "Logical-clock timestamp at which the claim was submitted; null until SUBMITTED"
      - name: appeal_round
        type: integer
        source: system
        description: "Count of appeal cycles this claim has entered"
        default: 0
  - name: ClaimLine
    parent: Claim
    common_fields: false
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; owning claim"
      - name: cpt_code
        type: string
        source: input
        description: "CPT/HCPCS procedure code"
      - name: units
        type: integer
        source: input
        description: "Number of units billed"
        constraints: "units >= 1"
      - name: charge_amount_cents
        type: integer
        source: input
        description: "Gross charge for this line (provider's list price), in cents"
        constraints: "charge_amount_cents >= 0"
      - name: allowed_amount_cents
        type: integer
        source: computed
        description: "units * fee schedule allowed for cpt_code; resolved at scrub"
        default: 0
  - name: Denial
    parent: Claim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the denied claim"
      - name: denial_code
        type: string
        source: input
        description: "CARC/RARC denial reason code"
      - name: denied_amount_cents
        type: integer
        source: input
        description: "Dollar amount denied, in cents"
        constraints: "denied_amount_cents >= 0"
      - name: denial_date
        type: datetime
        source: input
        description: "Date the payer issued the denial; appeal-window clock starts here"
      - name: status
        type: enum
        source: system
        description: "Denial disposition"
        default: OPEN
        constraints: "one of {OPEN, APPEALED, OVERTURNED, UPHELD, WRITTEN_OFF}"
  - name: Appeal
    parent: Denial
    common_fields: true
    fields:
      - name: denial_id
        type: string
        source: input
        description: "FK -> Denial.id; the denial being appealed"
      - name: level
        type: integer
        source: input
        description: "Appeal level (1 = first-level, 2 = second-level)"
        default: 1
        constraints: "1 <= level <= 2"
      - name: narrative
        type: string
        source: input
        description: "Appeal justification narrative"
      - name: status
        type: enum
        source: system
        description: "Appeal lifecycle status"
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, OVERTURNED, UPHELD, WITHDRAWN}"
      - name: recovered_amount_cents
        type: integer
        source: system
        description: "Amount recovered when the appeal is OVERTURNED; 0 otherwise"
        default: 0
      - name: submitted_date
        type: datetime
        source: system
        description: "Logical-clock timestamp at which the appeal was submitted; null until SUBMITTED"
  - name: RemittanceAdvice
    parent: null
    common_fields: true
    fields:
      - name: payer_id
        type: string
        source: input
        description: "FK -> Payer.id; payer that issued this remittance (ERA/EOB)"
      - name: remittance_ref
        type: string
        source: input
        description: "Payer's remittance reference / check number"
      - name: total_amount_cents
        type: integer
        source: input
        description: "Total dollars on the remittance, in cents"
        constraints: "total_amount_cents >= 0"
      - name: allocated_amount_cents
        type: integer
        source: computed
        description: "Sum of insurance_paid_cents across non-reversed PaymentPostings under this remittance"
        default: 0
      - name: unallocated_amount_cents
        type: integer
        source: computed
        description: "total_amount_cents - allocated_amount_cents"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Remittance posting lifecycle"
        default: RECEIVED
        constraints: "one of {RECEIVED, POSTING, POSTED, REVERSED}"
  - name: PaymentPosting
    parent: RemittanceAdvice
    common_fields: true
    fields:
      - name: remittance_id
        type: string
        source: input
        description: "FK -> RemittanceAdvice.id; parent remittance"
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; claim this posting pays"
      - name: insurance_paid_cents
        type: integer
        source: input
        description: "Insurance payment allocated to the claim, in cents"
        constraints: "insurance_paid_cents >= 0"
      - name: patient_responsibility_cents
        type: integer
        source: input
        description: "Patient responsibility reported on the ERA line, in cents"
        constraints: "patient_responsibility_cents >= 0"
      - name: adjustment_cents
        type: integer
        source: input
        description: "Contractual adjustment reported on the ERA line, in cents"
        constraints: "adjustment_cents >= 0"
      - name: status
        type: enum
        source: system
        description: "Posting status"
        default: POSTED
        constraints: "one of {POSTED, REVERSED}"
  - name: PatientStatement
    parent: Claim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; claim whose patient balance this statement bills"
      - name: practice_id
        type: string
        source: computed
        description: "FK -> Practice.id; copied from the claim for practice-scoped queries"
      - name: statement_amount_cents
        type: integer
        source: computed
        description: "Patient balance at statement creation = Claim.patient_responsibility_cents"
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Cumulative patient payments recorded against this statement"
        default: 0
      - name: first_sent_date
        type: datetime
        source: system
        description: "Logical-clock timestamp of first send; aging clock starts here; null until SENT"
      - name: aging_bucket
        type: enum
        source: computed
        description: "Aging bucket derived from days since first_sent_date"
        default: CURRENT
        constraints: "one of {CURRENT, DAYS_31_60, DAYS_61_90, OVER_90}"
      - name: status
        type: enum
        source: system
        description: "Statement lifecycle status"
        default: DRAFT
        constraints: "one of {DRAFT, SENT, PARTIAL, PAID, COLLECTIONS, WRITTEN_OFF}"

state_machines:
  - entity: Practice
    initial_state: PROSPECT
    terminal_states: [TERMINATED]
    transitions:
      - from: PROSPECT
        to: ONBOARDING
        trigger: "POST /rcm/practices/{id}/activate with onboarding=false path not taken; system moves PROSPECT->ONBOARDING when first fee schedule activated"
        actor: AccountManager
        preconditions: ["practice.status == PROSPECT"]
        side_effects: ["set status=ONBOARDING"]
        note: "Reached automatically the first time a FeeSchedule is activated for the practice."
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /rcm/practices/{id}/activate"
        actor: AccountManager
        preconditions: ["practice.status == ONBOARDING", "practice has >=1 FeeSchedule in status ACTIVE"]
        side_effects: ["set status=ACTIVE", "increments Practice.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /rcm/practices/{id}/activate is not used; suspension via same activate endpoint with target inferred — see note"
        actor: AccountManager
        preconditions: ["practice.status == ACTIVE"]
        side_effects: ["set status=SUSPENDED"]
        note: "Suspension freezes new claim submission but existing claims continue."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /rcm/practices/{id}/activate"
        actor: AccountManager
        preconditions: ["practice.status == SUSPENDED"]
        side_effects: ["set status=ACTIVE"]
  - entity: Provider
    initial_state: PENDING
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /rcm/providers/{id}/credentialing/submit"
        actor: CredentialingSpecialist
        preconditions: ["provider.credentialing_status == PENDING"]
        side_effects: ["set credentialing_status=SUBMITTED"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /rcm/providers/{id}/credentialing/decision {decision: APPROVE}"
        actor: CredentialingSpecialist
        preconditions: ["provider.credentialing_status == SUBMITTED", "expiration_date > current clock"]
        side_effects: ["set credentialing_status=APPROVED", "set credentialing_expiration_date"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /rcm/providers/{id}/credentialing/decision {decision: REJECT}"
        actor: CredentialingSpecialist
        preconditions: ["provider.credentialing_status == SUBMITTED"]
        side_effects: ["set credentialing_status=REJECTED"]
      - from: APPROVED
        to: EXPIRED
        trigger: "system: current clock >= credentialing_expiration_date (evaluated on claim submit)"
        actor: system
        preconditions: ["provider.credentialing_status == APPROVED", "current clock >= credentialing_expiration_date"]
        side_effects: ["set credentialing_status=EXPIRED"]
      - from: EXPIRED
        to: SUBMITTED
        trigger: "POST /rcm/providers/{id}/credentialing/submit (re-credentialing)"
        actor: CredentialingSpecialist
        preconditions: ["provider.credentialing_status == EXPIRED"]
        side_effects: ["set credentialing_status=SUBMITTED"]
        note: "Cyclic re-credentialing loop."
  - entity: PayerEnrollment
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /rcm/payer-enrollments/{id}/activate"
        actor: CredentialingSpecialist
        preconditions: ["enrollment.status == PENDING", "linked Provider.credentialing_status == APPROVED"]
        side_effects: ["set status=ACTIVE"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /rcm/payer-enrollments/{id}/terminate"
        actor: CredentialingSpecialist
        preconditions: ["enrollment.status == ACTIVE"]
        side_effects: ["set status=TERMINATED", "set termination_date"]
  - entity: FeeSchedule
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /rcm/fee-schedules/{id}/activate"
        actor: AccountManager
        preconditions: ["fee_schedule.status == DRAFT", "fee_schedule has >=1 FeeScheduleLine", "no other ACTIVE FeeSchedule for the practice with an overlapping [effective_date, end_date] interval", "expected_practice_version matches Practice.version"]
        side_effects: ["set status=ACTIVE", "any prior ACTIVE FeeSchedule for the practice whose interval is strictly before this one and adjacent transitions ACTIVE->SUPERSEDED", "increments Practice.version by 1", "if Practice.status==PROSPECT set Practice.status=ONBOARDING"]
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: superseded when a newer FeeSchedule for the practice is activated covering the same forward interval"
        actor: system
        preconditions: ["fee_schedule.status == ACTIVE"]
        side_effects: ["set status=SUPERSEDED"]
      - from: DRAFT
        to: RETIRED
        trigger: "POST /rcm/fee-schedules/{id}/activate not used; retire via same endpoint family"
        actor: AccountManager
        preconditions: ["fee_schedule.status == DRAFT"]
        side_effects: ["set status=RETIRED"]
  - entity: Claim
    initial_state: DRAFT
    terminal_states: [CLOSED, VOID]
    transitions:
      - from: DRAFT
        to: SCRUBBED
        trigger: "POST /rcm/claims/{id}/scrub"
        actor: Coder
        preconditions: ["claim.status == DRAFT", "claim has >=1 ClaimLine", "the practice has an ACTIVE FeeSchedule covering service_date", "every ClaimLine.cpt_code is priced by that fee schedule"]
        side_effects: ["resolve each ClaimLine.allowed_amount_cents", "compute billed_amount_cents, allowed_amount_cents, contractual_adjustment_cents", "compute patient_responsibility_cents (provisional variant)", "compute expected_reimbursement_cents", "compute outstanding_balance_cents", "set scrubbed_by_user_id = X-User-ID", "set status=SCRUBBED", "recompute Practice.ar_balance_cents"]
      - from: SCRUBBED
        to: SUBMITTED
        trigger: "POST /rcm/claims/{id}/submit"
        actor: Biller
        preconditions: ["claim.status == SCRUBBED", "Provider.credentialing_status == APPROVED (else auto-EXPIRE if past expiration)", "an ACTIVE PayerEnrollment exists for (provider, payer) covering service_date", "X-User-ID != claim.scrubbed_by_user_id (segregation of duties)", "days_between(service_date, current clock) <= Payer.timely_filing_days"]
        side_effects: ["set submission_date = current clock", "set submitted_by_user_id = X-User-ID", "set status=SUBMITTED", "increments Claim.version by 1"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /rcm/claims/{id}/accept"
        actor: Biller
        preconditions: ["claim.status == SUBMITTED"]
        side_effects: ["set status=ACCEPTED", "increments Claim.version by 1"]
      - from: ACCEPTED
        to: PAID
        trigger: "system: a PaymentPosting drives outstanding_balance_cents to 0 or below"
        actor: system
        preconditions: ["claim.status == ACCEPTED", "outstanding_balance_cents <= 0 after posting"]
        side_effects: ["set status=PAID", "recompute Practice.collected_ytd_cents and ar_balance_cents", "accrue Practice billing fee (see calculations)"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /rcm/claims/{id}/denials"
        actor: DenialSpecialist
        preconditions: ["claim.status IN {SUBMITTED, ACCEPTED}"]
        side_effects: ["create Denial in status OPEN", "set status=DENIED", "increments Claim.version by 1"]
      - from: ACCEPTED
        to: DENIED
        trigger: "POST /rcm/claims/{id}/denials"
        actor: DenialSpecialist
        preconditions: ["claim.status IN {SUBMITTED, ACCEPTED}"]
        side_effects: ["create Denial in status OPEN", "set status=DENIED", "increments Claim.version by 1"]
      - from: DENIED
        to: APPEALED
        trigger: "POST /rcm/appeals/{id}/submit (first appeal on the claim's OPEN denial)"
        actor: DenialSpecialist
        preconditions: ["claim.status == DENIED", "the appealed Denial.status == APPEALED", "days_between(Denial.denial_date, current clock) <= Payer.appeal_window_days"]
        side_effects: ["set status=APPEALED", "increment appeal_round by 1"]
      - from: APPEALED
        to: ACCEPTED
        trigger: "POST /rcm/appeals/{id}/decision {outcome: OVERTURN}"
        actor: DenialSpecialist
        preconditions: ["claim.status == APPEALED", "appeal.status == SUBMITTED"]
        side_effects: ["set Denial.status=OVERTURNED", "set Appeal.recovered_amount_cents", "reduce write_off/outstanding per recovery", "set claim.status=ACCEPTED", "increments Claim.version by 1"]
      - from: APPEALED
        to: DENIED
        trigger: "POST /rcm/appeals/{id}/decision {outcome: UPHOLD}"
        actor: DenialSpecialist
        preconditions: ["claim.status == APPEALED", "appeal.status == SUBMITTED"]
        side_effects: ["set Denial.status=UPHELD", "set claim.status=DENIED", "increments Claim.version by 1"]
        note: "Cyclic: a DENIED claim may enter a further APPEALED round (level 2) up to the appeal limit."
      - from: PAID
        to: CLOSED
        trigger: "POST /rcm/claims/{id}/close"
        actor: Biller
        preconditions: ["claim.status == PAID"]
        side_effects: ["set status=CLOSED"]
      - from: DENIED
        to: CLOSED
        trigger: "POST /rcm/claims/{id}/close (write off a fully-denied claim)"
        actor: Biller
        preconditions: ["claim.status == DENIED"]
        side_effects: ["set write_off_cents = outstanding_balance_cents", "set outstanding_balance_cents=0", "set linked OPEN/UPHELD Denial.status=WRITTEN_OFF", "recompute Practice.ar_balance_cents", "set status=CLOSED"]
      - from: DRAFT
        to: VOID
        trigger: "POST /rcm/claims/{id}/close (void an unsubmitted draft)"
        actor: Coder
        preconditions: ["claim.status == DRAFT"]
        side_effects: ["set status=VOID"]
  - entity: Appeal
    initial_state: DRAFT
    terminal_states: [OVERTURNED, UPHELD, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rcm/appeals/{id}/submit"
        actor: DenialSpecialist
        preconditions: ["appeal.status == DRAFT", "Denial.status == OPEN", "days_between(Denial.denial_date, current clock) <= Payer.appeal_window_days"]
        side_effects: ["set status=SUBMITTED", "set submitted_date = current clock", "set Denial.status=APPEALED", "cascade Claim DENIED->APPEALED"]
      - from: SUBMITTED
        to: OVERTURNED
        trigger: "POST /rcm/appeals/{id}/decision {outcome: OVERTURN}"
        actor: DenialSpecialist
        preconditions: ["appeal.status == SUBMITTED"]
        side_effects: ["set status=OVERTURNED", "set recovered_amount_cents", "set Denial.status=OVERTURNED", "cascade Claim APPEALED->ACCEPTED"]
        note: "OVERTURN branch reopens the claim and restores AR."
      - from: SUBMITTED
        to: UPHELD
        trigger: "POST /rcm/appeals/{id}/decision {outcome: UPHOLD}"
        actor: DenialSpecialist
        preconditions: ["appeal.status == SUBMITTED"]
        side_effects: ["set status=UPHELD", "set Denial.status=UPHELD", "cascade Claim APPEALED->DENIED"]
        note: "UPHOLD branch leaves the denial standing; divergent side-effect set from OVERTURN."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /rcm/appeals/{id}/decision {outcome: WITHDRAW} not used; withdraw via decision endpoint"
        actor: DenialSpecialist
        preconditions: ["appeal.status == DRAFT"]
        side_effects: ["set status=WITHDRAWN"]
  - entity: RemittanceAdvice
    initial_state: RECEIVED
    terminal_states: [POSTED, REVERSED]
    transitions:
      - from: RECEIVED
        to: POSTING
        trigger: "POST /rcm/remittances/{id}/postings (first posting)"
        actor: PaymentPoster
        preconditions: ["remittance.status == RECEIVED"]
        side_effects: ["set status=POSTING", "recompute allocated/unallocated"]
      - from: POSTING
        to: POSTED
        trigger: "POST /rcm/remittances/{id}/finalize"
        actor: PaymentPoster
        preconditions: ["remittance.status == POSTING", "allocated_amount_cents == total_amount_cents (fully reconciled)"]
        side_effects: ["set status=POSTED"]
      - from: POSTING
        to: REVERSED
        trigger: "POST /rcm/payment-postings/{id}/reverse of the last remaining posting"
        actor: PaymentPoster
        preconditions: ["remittance.status == POSTING", "all postings under remittance are REVERSED"]
        side_effects: ["set status=REVERSED"]
  - entity: PatientStatement
    initial_state: DRAFT
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /rcm/patient-statements/{id}/send"
        actor: PaymentPoster
        preconditions: ["statement.status == DRAFT", "statement_amount_cents > 0"]
        side_effects: ["set first_sent_date = current clock", "set aging_bucket=CURRENT", "set status=SENT"]
      - from: SENT
        to: PARTIAL
        trigger: "POST /rcm/patient-statements/{id}/record-payment (amount < remaining)"
        actor: PaymentPoster
        preconditions: ["statement.status IN {SENT, PARTIAL, COLLECTIONS}", "amount_paid_cents + amount < statement_amount_cents"]
        side_effects: ["increment amount_paid_cents", "recompute Claim ledger", "set status=PARTIAL"]
      - from: SENT
        to: PAID
        trigger: "POST /rcm/patient-statements/{id}/record-payment (amount pays balance)"
        actor: PaymentPoster
        preconditions: ["statement.status IN {SENT, PARTIAL, COLLECTIONS}", "amount_paid_cents + amount >= statement_amount_cents"]
        side_effects: ["increment amount_paid_cents", "recompute Claim ledger and Practice.collected totals", "set status=PAID"]
      - from: SENT
        to: COLLECTIONS
        trigger: "POST /rcm/patient-statements/{id}/collections"
        actor: PaymentPoster
        preconditions: ["statement.status IN {SENT, PARTIAL}", "aging_bucket == OVER_90"]
        side_effects: ["set status=COLLECTIONS"]
      - from: COLLECTIONS
        to: WRITTEN_OFF
        trigger: "POST /rcm/patient-statements/{id}/write-off"
        actor: AccountManager
        preconditions: ["statement.status == COLLECTIONS"]
        side_effects: ["set Claim.write_off_cents += remaining statement balance", "recompute Claim ledger and Practice.ar_balance_cents", "set status=WRITTEN_OFF"]

concurrency_rules:
  - rule_id: posting-create-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /rcm/remittances/{id}/postings"
    occ_field: "expected_claim_version"
    description: |
      Creating a PaymentPosting against a Claim whose version has advanced since
      the client last observed it is rejected. This captures the case where another
      posting has already been applied to the claim (legitimately advancing it toward
      PAID and bumping its version), so the current poster's view of the claim balance
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: fee-schedule-activate-stale-practice
    parent_entity: Practice
    write_endpoint: "POST /rcm/fee-schedules/{id}/activate"
    occ_field: "expected_practice_version"
    description: |
      Activating a FeeSchedule supersedes the practice's prior ACTIVE schedule and
      advances Practice.version. Activating against a Practice whose version has
      advanced since the client last observed it is rejected as stale — another
      activation has already reshaped the practice's active-schedule set.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: claim_patient_responsibility
    trigger: "Claim DRAFT->SCRUBBED (POST /rcm/claims/{id}/scrub)"
    algorithm: threshold
    formula: |
      allowed = sum(line.allowed_amount_cents for line in claim lines)
      deductible_applied = min(allowed, claim.deductible_remaining_cents)
      after_deductible = allowed - deductible_applied
      coinsurance = round_half_up(after_deductible * claim.coinsurance_pct)
      patient_responsibility_cents = min(deductible_applied + coinsurance + claim.copay_cents, allowed)
    input_set: "The claim's own ClaimLines after allowed_amount resolution; deductible/coinsurance/copay from the claim."
    constants: {}
    precision: "integer cents, round_half_up on the coinsurance product only"
    variants:
      - name: provisional
        when: "at scrub, before any ERA is posted"
        difference: "deductible/coinsurance/copay estimate the split from claim inputs and fee-schedule allowed amounts"
      - name: final
        when: "reconciled during payment posting"
        difference: "patient_responsibility_cents on the ERA line (PaymentPosting.patient_responsibility_cents) replaces the estimate; delta re-applied to Claim ledger and to any PatientStatement"
  - name: claim_ledger_reconciliation
    trigger: "Claim scrub, each PaymentPosting create/reverse, each PatientStatement payment/write-off"
    algorithm: aggregation
    formula: |
      # evaluation order is fixed and must be followed exactly:
      # 1) billed_amount_cents = sum(line.charge_amount_cents)
      # 2) allowed_amount_cents = sum(line.allowed_amount_cents)
      # 3) contractual_adjustment_cents = billed_amount_cents - allowed_amount_cents
      # 4) insurance_paid_cents = sum(p.insurance_paid_cents for p in postings where p.status==POSTED)
      # 5) patient_responsibility_cents = provisional at scrub, then final ERA value once any posting exists
      # 6) write_off_cents = accumulated write-offs from denial-close / statement write-off
      # 7) outstanding_balance_cents = billed_amount_cents - contractual_adjustment_cents
      #        - insurance_paid_cents - patient_responsibility_cents - write_off_cents
      # Invariant: billed = contractual_adjustment + insurance_paid + patient_responsibility + write_off + outstanding_balance
    input_set: "POSTED (non-reversed) PaymentPostings for this claim; the claim's own line charges."
    constants: {}
    precision: "integer cents; steps evaluated in the numbered order (circular-looking because outstanding closes the identity)"
  - name: practice_billing_fee
    trigger: "GET /rcm/practices/{id}/billing-fee; accrual snapshot when a Claim reaches PAID"
    algorithm: aggregation
    formula: |
      # CHARGE-BASED variant (round per claim, then sum — pinned order):
      charge_based_fee_cents = sum( round_half_up(c.billed_amount_cents * practice.billing_fee_pct)
                                    for c in claims where c.status in {SUBMITTED,ACCEPTED,DENIED,APPEALED,PAID,CLOSED} )
      # COLLECTION-BASED variant (round per claim, then sum):
      collection_based_fee_cents = sum( round_half_up(c.insurance_paid_cents * practice.billing_fee_pct)
                                        for c in claims where c.status in {PAID,CLOSED} )
    input_set: "Charge-based includes every claim that reached the wire (SUBMITTED and beyond); collection-based includes only claims with realized insurance payment (PAID/CLOSED)."
    constants: {}
    precision: "integer cents; round_half_up applied per claim BEFORE summation (never sum-then-round)"
    variants:
      - name: charge_based
        when: "commission billed as a percentage of gross charges submitted"
        difference: "base is billed_amount_cents across all wire claims"
      - name: collection_based
        when: "commission billed as a percentage of realized collections"
        difference: "base is insurance_paid_cents across PAID/CLOSED claims only"
  - name: remittance_allocation
    trigger: "PaymentPosting create and reverse under a RemittanceAdvice"
    algorithm: aggregation
    formula: |
      allocated_amount_cents = sum(p.insurance_paid_cents for p in postings where p.status==POSTED)
      unallocated_amount_cents = remittance.total_amount_cents - allocated_amount_cents
      # Guard: a create is rejected (ERR_OVERALLOCATION) if it would make allocated_amount_cents > total_amount_cents.
      # Invariant: total_amount_cents == allocated_amount_cents + unallocated_amount_cents at all times.
    input_set: "POSTED PaymentPostings under the remittance."
    constants: {}
    precision: "integer cents; conservation invariant restored exactly on reverse"
  - name: statement_aging_bucket
    trigger: "GET /rcm/patient-statements/{id}; POST /rcm/patient-statements/{id}/collections"
    algorithm: threshold
    formula: |
      days = floor((current_clock - statement.first_sent_date) / 86400 seconds)
      if statement.first_sent_date is null: aging_bucket = CURRENT
      elif days <= 30:  aging_bucket = CURRENT
      elif days <= 60:  aging_bucket = DAYS_31_60
      elif days <= 90:  aging_bucket = DAYS_61_90
      else:             aging_bucket = OVER_90     # days > 90 strictly
    input_set: "The statement's own first_sent_date vs the logical clock."
    constants:
      CURRENT_MAX_DAYS: 30
      MID_MAX_DAYS: 60
      LATE_MAX_DAYS: 90
    precision: "whole days, floor; boundaries inclusive on the lower bucket (day 30 is CURRENT, day 90 is DAYS_61_90, day 91 is OVER_90)"
  - name: practice_kpi
    trigger: "GET /rcm/practices/{id}/kpi"
    algorithm: aggregation
    formula: |
      total_claims = count(claims with status != DRAFT and status != VOID)
      clean_claims = count(claims that reached ACCEPTED or PAID without ever entering DENIED)
      denied_claims = count(claims that ever entered DENIED)
      clean_claim_rate = round_half_up(clean_claims / total_claims, 4) if total_claims>0 else 0
      denial_rate = round_half_up(denied_claims / total_claims, 4) if total_claims>0 else 0
      billed_total = sum(c.billed_amount_cents for wire claims)
      collected_total = sum(c.insurance_paid_cents for all claims)
      net_collection_rate = round_half_up(collected_total / (billed_total - sum(contractual_adjustment_cents)), 4) if denominator>0 else 0
    input_set: "All non-DRAFT, non-VOID claims of the practice; a claim counts as 'ever DENIED' if it currently is DENIED/APPEALED or has any Denial."
    constants: {}
    precision: "rates to 4 decimals, round_half_up; cent totals as integers"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /rcm/practices bootstrap? no — all"
  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path/body-referenced resource exists (validated left-to-right in path, then body FKs)"
    error_id: ERR_PRACTICE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing practice_id or /practices/{id}"
  - priority: 3
    category: existence
    check: "Referenced payer exists"
    error_id: ERR_PAYER_NOT_FOUND
    http_status: 404
    applies_to: "endpoints referencing payer_id or /payers/{id}"
  - priority: 3
    category: existence
    check: "Referenced provider exists"
    error_id: ERR_PROVIDER_NOT_FOUND
    http_status: 404
    applies_to: "endpoints referencing provider_id or /providers/{id}"
  - priority: 3
    category: existence
    check: "Referenced fee schedule exists"
    error_id: ERR_FEE_SCHEDULE_NOT_FOUND
    http_status: 404
    applies_to: "/fee-schedules/{id} endpoints"
  - priority: 3
    category: existence
    check: "Referenced enrollment exists"
    error_id: ERR_ENROLLMENT_NOT_FOUND
    http_status: 404
    applies_to: "/payer-enrollments/{id} endpoints"
  - priority: 3
    category: existence
    check: "Referenced claim exists"
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "endpoints referencing claim_id or /claims/{id}"
  - priority: 3
    category: existence
    check: "Referenced denial exists"
    error_id: ERR_DENIAL_NOT_FOUND
    http_status: 404
    applies_to: "/denials/{id} and /denials/{id}/appeals"
  - priority: 3
    category: existence
    check: "Referenced appeal exists"
    error_id: ERR_APPEAL_NOT_FOUND
    http_status: 404
    applies_to: "/appeals/{id} endpoints"
  - priority: 3
    category: existence
    check: "Referenced remittance exists"
    error_id: ERR_REMITTANCE_NOT_FOUND
    http_status: 404
    applies_to: "/remittances/{id} endpoints"
  - priority: 3
    category: existence
    check: "Referenced payment posting exists"
    error_id: ERR_POSTING_NOT_FOUND
    http_status: 404
    applies_to: "/payment-postings/{id} endpoints"
  - priority: 3
    category: existence
    check: "Referenced statement exists"
    error_id: ERR_STATEMENT_NOT_FOUND
    http_status: 404
    applies_to: "/patient-statements/{id} endpoints"
  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_constraint
    check: "Claim must have >=1 ClaimLine before scrub"
    error_id: ERR_NO_CLAIM_LINES
    http_status: 422
    applies_to: "POST /rcm/claims/{id}/scrub"
  - priority: 5
    category: business_constraint
    check: "Practice has an ACTIVE FeeSchedule whose [effective_date,end_date] covers the claim service_date"
    error_id: ERR_NO_ACTIVE_FEE_SCHEDULE
    http_status: 422
    applies_to: "POST /rcm/claims/{id}/scrub"
  - priority: 5
    category: business_constraint
    check: "Every ClaimLine.cpt_code is priced by the covering ACTIVE fee schedule"
    error_id: ERR_CPT_NOT_IN_FEE_SCHEDULE
    http_status: 422
    applies_to: "POST /rcm/claims/{id}/scrub"
  - priority: 6
    category: business_safety
    check: "Rendering provider credentialing_status == APPROVED and not past expiration at submit time"
    error_id: ERR_PROVIDER_NOT_CREDENTIALED
    http_status: 422
    applies_to: "POST /rcm/claims/{id}/submit"
  - priority: 6
    category: business_safety
    check: "Submitting user (X-User-ID) is not the same user that scrubbed the claim (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /rcm/claims/{id}/submit"
  - priority: 7
    category: business_referential
    check: "An ACTIVE PayerEnrollment exists for (provider, payer) covering service_date"
    error_id: ERR_ENROLLMENT_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /rcm/claims/{id}/submit"
  - priority: 8
    category: business_temporal
    check: "days_between(service_date, current clock) <= Payer.timely_filing_days"
    error_id: ERR_TIMELY_FILING_EXCEEDED
    http_status: 422
    applies_to: "POST /rcm/claims/{id}/submit"
  - priority: 8
    category: business_temporal
    check: "days_between(Denial.denial_date, current clock) <= Payer.appeal_window_days"
    error_id: ERR_APPEAL_WINDOW_EXCEEDED
    http_status: 422
    applies_to: "POST /rcm/appeals/{id}/submit"
  - priority: 9
    category: business_constraint
    check: "No other ACTIVE FeeSchedule for the practice has an overlapping [effective_date,end_date] interval (closed-closed overlap)"
    error_id: ERR_FEE_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "POST /rcm/fee-schedules/{id}/activate"
  - priority: 9
    category: business_constraint
    check: "No existing non-TERMINATED PayerEnrollment for the same (provider,payer) has an overlapping [effective_date,termination_date) half-open interval"
    error_id: ERR_ENROLLMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /rcm/payer-enrollments"
  - priority: 9
    category: business_constraint
    check: "Appeal level does not exceed the maximum of 2 rounds for the claim"
    error_id: ERR_APPEAL_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /rcm/denials/{id}/appeals"
  - priority: 10
    category: business_fiscal
    check: "A PaymentPosting must not drive remittance allocated_amount_cents above total_amount_cents"
    error_id: ERR_OVERALLOCATION
    http_status: 422
    applies_to: "POST /rcm/remittances/{id}/postings"
  - priority: 10
    category: business_fiscal
    check: "Remittance can be finalized only when allocated_amount_cents == total_amount_cents"
    error_id: ERR_REMITTANCE_NOT_BALANCED
    http_status: 422
    applies_to: "POST /rcm/remittances/{id}/finalize"
  - priority: 11
    category: business_fiscal
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rcm/remittances/{id}/postings, POST /rcm/fee-schedules/{id}/activate"

endpoints:
  # ---- Practice ----
  - method: POST
    path: "/rcm/practices"
    description: "Onboard a new client practice"
    roles: [AccountManager]
    code: 201
    input: [name, npi, tax_id, billing_fee_pct]
    output: Practice
    side_effects: ["create Practice in status PROSPECT"]
  - method: GET
    path: "/rcm/practices/{id}"
    description: "Fetch a practice"
    roles: [AccountManager, PracticeUser]
    code: 200
    input: []
    output: Practice
    side_effects: []
  - method: GET
    path: "/rcm/practices"
    description: "List practices"
    roles: [AccountManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Practice[]
    side_effects: []
  - method: POST
    path: "/rcm/practices/{id}/activate"
    description: "Advance practice onboarding status (ONBOARDING->ACTIVE, ACTIVE<->SUSPENDED)"
    roles: [AccountManager]
    code: 200
    input: ["target_status?"]
    output: Practice
    side_effects: ["transition Practice status", "increments Practice.version by 1 on ONBOARDING->ACTIVE"]
  - method: GET
    path: "/rcm/practices/{id}/kpi"
    description: "Compute practice KPI metrics (clean claim rate, denial rate, net collection rate)"
    roles: [AccountManager, PracticeUser]
    code: 200
    input: []
    output: "{ clean_claim_rate: number, denial_rate: number, net_collection_rate: number, total_claims: integer }"
    side_effects: []
  - method: GET
    path: "/rcm/practices/{id}/billing-fee"
    description: "Compute the RCM firm commission both ways (charge-based and collection-based)"
    roles: [AccountManager, PracticeUser]
    code: 200
    input: []
    output: "{ charge_based_fee_cents: integer, collection_based_fee_cents: integer }"
    side_effects: []
  - method: GET
    path: "/rcm/practices/{id}/providers"
    description: "List providers for a practice (FK reverse-reachability for Provider.practice_id)"
    roles: [AccountManager, CredentialingSpecialist, PracticeUser]
    code: 200
    input: ["limit?", "offset?"]
    output: Provider[]
    side_effects: []
  - method: GET
    path: "/rcm/practices/{id}/fee-schedules"
    description: "List fee schedules for a practice (FK reverse-reachability for FeeSchedule.practice_id)"
    roles: [AccountManager, PracticeUser]
    code: 200
    input: ["limit?", "offset?"]
    output: FeeSchedule[]
    side_effects: []
  - method: GET
    path: "/rcm/practices/{id}/claims"
    description: "List claims for a practice (FK reverse-reachability for Claim.practice_id)"
    roles: [AccountManager, Coder, Biller, PracticeUser]
    code: 200
    input: ["limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: GET
    path: "/rcm/practices/{id}/statements"
    description: "List patient statements for a practice (FK reverse-reachability for PatientStatement.practice_id)"
    roles: [AccountManager, PaymentPoster, PracticeUser]
    code: 200
    input: ["limit?", "offset?"]
    output: PatientStatement[]
    side_effects: []
  # ---- Payer ----
  - method: POST
    path: "/rcm/payers"
    description: "Create an insurance payer"
    roles: [AccountManager]
    code: 201
    input: [name, payer_type, timely_filing_days, appeal_window_days]
    output: Payer
    side_effects: ["create Payer"]
  - method: GET
    path: "/rcm/payers/{id}"
    description: "Fetch a payer"
    roles: [AccountManager, Biller, CredentialingSpecialist]
    code: 200
    input: []
    output: Payer
    side_effects: []
  - method: GET
    path: "/rcm/payers/{id}/enrollments"
    description: "List enrollments for a payer (FK reverse-reachability for PayerEnrollment.payer_id)"
    roles: [AccountManager, CredentialingSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: PayerEnrollment[]
    side_effects: []
  - method: GET
    path: "/rcm/payers/{id}/remittances"
    description: "List remittances for a payer (FK reverse-reachability for RemittanceAdvice.payer_id)"
    roles: [AccountManager, PaymentPoster]
    code: 200
    input: ["limit?", "offset?"]
    output: RemittanceAdvice[]
    side_effects: []
  - method: GET
    path: "/rcm/payers/{id}/claims"
    description: "List claims for a payer (FK reverse-reachability for Claim.payer_id)"
    roles: [AccountManager, Biller, DenialSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: Claim[]
    side_effects: []
  # ---- Provider / credentialing ----
  - method: POST
    path: "/rcm/providers"
    description: "Register a rendering provider under a practice"
    roles: [CredentialingSpecialist]
    code: 201
    input: [practice_id, npi, first_name, last_name, specialty]
    output: Provider
    side_effects: ["create Provider in credentialing_status PENDING"]
  - method: GET
    path: "/rcm/providers/{id}"
    description: "Fetch a provider"
    roles: [AccountManager, CredentialingSpecialist, Biller]
    code: 200
    input: []
    output: Provider
    side_effects: []
  - method: GET
    path: "/rcm/providers/{id}/enrollments"
    description: "List enrollments for a provider (FK reverse-reachability for PayerEnrollment.provider_id)"
    roles: [AccountManager, CredentialingSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: PayerEnrollment[]
    side_effects: []
  - method: GET
    path: "/rcm/providers/{id}/claims"
    description: "List claims for a provider (FK reverse-reachability for Claim.provider_id)"
    roles: [AccountManager, Biller, Coder]
    code: 200
    input: ["limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: POST
    path: "/rcm/providers/{id}/credentialing/submit"
    description: "Submit provider for credentialing (PENDING/EXPIRED -> SUBMITTED)"
    roles: [CredentialingSpecialist]
    code: 200
    input: []
    output: Provider
    side_effects: ["set credentialing_status=SUBMITTED"]
  - method: POST
    path: "/rcm/providers/{id}/credentialing/decision"
    description: "Approve or reject a submitted credentialing (SUBMITTED -> APPROVED/REJECTED)"
    roles: [CredentialingSpecialist]
    code: 200
    input: ["decision", "expiration_date?"]
    output: Provider
    side_effects: ["set credentialing_status per decision", "set credentialing_expiration_date on APPROVE"]
  # ---- PayerEnrollment ----
  - method: POST
    path: "/rcm/payer-enrollments"
    description: "Create a provider-payer enrollment (credentialing linkage)"
    roles: [CredentialingSpecialist]
    code: 201
    input: ["provider_id", "payer_id", "effective_date", "termination_date?"]
    output: PayerEnrollment
    side_effects: ["create PayerEnrollment in status PENDING"]
  - method: GET
    path: "/rcm/payer-enrollments/{id}"
    description: "Fetch an enrollment"
    roles: [AccountManager, CredentialingSpecialist]
    code: 200
    input: []
    output: PayerEnrollment
    side_effects: []
  - method: GET
    path: "/rcm/payer-enrollments"
    description: "List/filter enrollments by provider and/or payer"
    roles: [AccountManager, CredentialingSpecialist]
    code: 200
    input: ["provider_id?", "payer_id?", "limit?", "offset?"]
    output: PayerEnrollment[]
    side_effects: []
  - method: POST
    path: "/rcm/payer-enrollments/{id}/activate"
    description: "Activate an enrollment (PENDING -> ACTIVE)"
    roles: [CredentialingSpecialist]
    code: 200
    input: []
    output: PayerEnrollment
    side_effects: ["set status=ACTIVE"]
  - method: POST
    path: "/rcm/payer-enrollments/{id}/terminate"
    description: "Terminate an enrollment (ACTIVE -> TERMINATED)"
    roles: [CredentialingSpecialist]
    code: 200
    input: [termination_date]
    output: PayerEnrollment
    side_effects: ["set status=TERMINATED", "set termination_date"]
  # ---- FeeSchedule ----
  - method: POST
    path: "/rcm/fee-schedules"
    description: "Create a draft fee schedule for a practice"
    roles: [AccountManager]
    code: 201
    input: ["practice_id", "effective_date", "end_date?"]
    output: FeeSchedule
    side_effects: ["create FeeSchedule in status DRAFT"]
  - method: GET
    path: "/rcm/fee-schedules/{id}"
    description: "Fetch a fee schedule"
    roles: [AccountManager, Coder, PracticeUser]
    code: 200
    input: []
    output: FeeSchedule
    side_effects: []
  - method: POST
    path: "/rcm/fee-schedules/{id}/lines"
    description: "Add a priced CPT line to a draft fee schedule"
    roles: [AccountManager]
    code: 201
    input: [cpt_code, allowed_amount_cents]
    output: FeeScheduleLine
    side_effects: ["create FeeScheduleLine"]
  - method: GET
    path: "/rcm/fee-schedules/{id}/lines"
    description: "List lines of a fee schedule (FK reverse-reachability for FeeScheduleLine.fee_schedule_id)"
    roles: [AccountManager, Coder, PracticeUser]
    code: 200
    input: ["limit?", "offset?"]
    output: FeeScheduleLine[]
    side_effects: []
  - method: POST
    path: "/rcm/fee-schedules/{id}/activate"
    description: "Activate a draft fee schedule (DRAFT -> ACTIVE); OCC on the practice"
    roles: [AccountManager]
    code: 200
    input: [expected_practice_version]
    output: FeeSchedule
    side_effects: ["set status=ACTIVE", "supersede an adjacent prior ACTIVE schedule", "increments Practice.version by 1", "PROSPECT->ONBOARDING if applicable"]
  # ---- Claim / charge entry / scrub / submission ----
  - method: POST
    path: "/rcm/claims"
    description: "Create a draft claim (charge entry header)"
    roles: [Coder]
    code: 201
    input: [practice_id, provider_id, payer_id, service_date, deductible_remaining_cents, coinsurance_pct, copay_cents]
    output: Claim
    side_effects: ["create Claim in status DRAFT"]
  - method: GET
    path: "/rcm/claims/{id}"
    description: "Fetch a claim with its computed ledger fields"
    roles: [AccountManager, Coder, Biller, DenialSpecialist, PaymentPoster, PracticeUser]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: POST
    path: "/rcm/claims/{id}/lines"
    description: "Add a charge line to a draft claim"
    roles: [Coder]
    code: 201
    input: [cpt_code, units, charge_amount_cents]
    output: ClaimLine
    side_effects: ["create ClaimLine (allowed_amount_cents resolved later at scrub)"]
  - method: GET
    path: "/rcm/claims/{id}/lines"
    description: "List a claim's lines (FK reverse-reachability for ClaimLine.claim_id)"
    roles: [AccountManager, Coder, Biller, PracticeUser]
    code: 200
    input: ["limit?", "offset?"]
    output: ClaimLine[]
    side_effects: []
  - method: GET
    path: "/rcm/claims/{id}/denials"
    description: "List a claim's denials (FK reverse-reachability for Denial.claim_id)"
    roles: [AccountManager, DenialSpecialist, Biller, PracticeUser]
    code: 200
    input: ["limit?", "offset?"]
    output: Denial[]
    side_effects: []
  - method: GET
    path: "/rcm/claims/{id}/postings"
    description: "List postings applied to a claim (FK reverse-reachability for PaymentPosting.claim_id)"
    roles: [AccountManager, PaymentPoster, Biller, PracticeUser]
    code: 200
    input: ["limit?", "offset?"]
    output: PaymentPosting[]
    side_effects: []
  - method: GET
    path: "/rcm/claims/{id}/statements"
    description: "List patient statements for a claim (FK reverse-reachability for PatientStatement.claim_id)"
    roles: [AccountManager, PaymentPoster, PracticeUser]
    code: 200
    input: ["limit?", "offset?"]
    output: PatientStatement[]
    side_effects: []
  - method: POST
    path: "/rcm/claims/{id}/scrub"
    description: "Coding scrub: resolve allowed amounts, freeze billed/allowed, compute provisional patient responsibility (DRAFT -> SCRUBBED)"
    roles: [Coder]
    code: 200
    input: []
    output: Claim
    side_effects: ["resolve ClaimLine allowed amounts", "compute claim ledger provisional", "set scrubbed_by_user_id", "recompute Practice.ar_balance_cents"]
  - method: POST
    path: "/rcm/claims/{id}/submit"
    description: "Submit to clearinghouse (SCRUBBED -> SUBMITTED); enforces credentialing, enrollment, timely filing, segregation of duties"
    roles: [Biller]
    code: 200
    input: []
    output: Claim
    side_effects: ["set submission_date", "set submitted_by_user_id", "increments Claim.version by 1"]
  - method: POST
    path: "/rcm/claims/{id}/accept"
    description: "Clearinghouse acknowledgement (SUBMITTED -> ACCEPTED)"
    roles: [Biller]
    code: 200
    input: ["clearinghouse_ref?"]
    output: Claim
    side_effects: ["set status=ACCEPTED", "increments Claim.version by 1"]
  - method: POST
    path: "/rcm/claims/{id}/close"
    description: "Close a PAID claim, write off a DENIED claim, or void a DRAFT claim"
    roles: [Biller, Coder]
    code: 200
    input: []
    output: Claim
    side_effects: ["terminal transition per current state", "recompute Practice.ar_balance_cents"]
  # ---- Denial ----
  - method: POST
    path: "/rcm/claims/{id}/denials"
    description: "Record a payer denial against a claim (SUBMITTED/ACCEPTED -> DENIED)"
    roles: [DenialSpecialist]
    code: 201
    input: [denial_code, denied_amount_cents, denial_date]
    output: Denial
    side_effects: ["create Denial OPEN", "set claim.status=DENIED", "increments Claim.version by 1"]
  - method: GET
    path: "/rcm/denials/{id}"
    description: "Fetch a denial"
    roles: [AccountManager, DenialSpecialist, Biller]
    code: 200
    input: []
    output: Denial
    side_effects: []
  - method: GET
    path: "/rcm/denials/{id}/appeals"
    description: "List appeals for a denial (FK reverse-reachability for Appeal.denial_id)"
    roles: [AccountManager, DenialSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: Appeal[]
    side_effects: []
  # ---- Appeal ----
  - method: POST
    path: "/rcm/denials/{id}/appeals"
    description: "Draft an appeal against a denial"
    roles: [DenialSpecialist]
    code: 201
    input: ["level?", narrative]
    output: Appeal
    side_effects: ["create Appeal in status DRAFT"]
  - method: GET
    path: "/rcm/appeals/{id}"
    description: "Fetch an appeal"
    roles: [AccountManager, DenialSpecialist]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: POST
    path: "/rcm/appeals/{id}/submit"
    description: "Submit an appeal (DRAFT -> SUBMITTED); enforces appeal window; cascades Denial and Claim"
    roles: [DenialSpecialist]
    code: 200
    input: []
    output: Appeal
    side_effects: ["set Denial.status=APPEALED", "cascade Claim DENIED->APPEALED", "increment claim.appeal_round"]
  - method: POST
    path: "/rcm/appeals/{id}/decision"
    description: "Decide an appeal: OVERTURN (reopen claim), UPHOLD (denial stands), or WITHDRAW"
    roles: [DenialSpecialist]
    code: 200
    input: [outcome, "recovered_amount_cents?"]
    output: Appeal
    side_effects: ["set Denial.status", "cascade Claim state", "recompute Claim ledger and Practice AR"]
  # ---- Remittance / payment posting / reconciliation ----
  - method: POST
    path: "/rcm/remittances"
    description: "Create a remittance advice (ERA/EOB) from a payer"
    roles: [PaymentPoster]
    code: 201
    input: [payer_id, remittance_ref, total_amount_cents]
    output: RemittanceAdvice
    side_effects: ["create RemittanceAdvice in status RECEIVED"]
  - method: GET
    path: "/rcm/remittances/{id}"
    description: "Fetch a remittance with allocation totals"
    roles: [AccountManager, PaymentPoster]
    code: 200
    input: []
    output: RemittanceAdvice
    side_effects: []
  - method: POST
    path: "/rcm/remittances/{id}/postings"
    description: "Post an ERA line: allocate insurance payment to a claim; OCC on the claim"
    roles: [PaymentPoster]
    code: 201
    input: [claim_id, insurance_paid_cents, patient_responsibility_cents, adjustment_cents, expected_claim_version]
    output: PaymentPosting
    side_effects: ["create PaymentPosting POSTED", "recompute claim ledger (final variant)", "recompute remittance allocation", "increments Claim.version by 1", "cascade Claim ACCEPTED->PAID and Practice collected/AR/fee if fully paid"]
  - method: GET
    path: "/rcm/remittances/{id}/postings"
    description: "List postings under a remittance (FK reverse-reachability for PaymentPosting.remittance_id)"
    roles: [AccountManager, PaymentPoster]
    code: 200
    input: ["limit?", "offset?"]
    output: PaymentPosting[]
    side_effects: []
  - method: POST
    path: "/rcm/remittances/{id}/finalize"
    description: "Finalize a fully-reconciled remittance (POSTING -> POSTED)"
    roles: [PaymentPoster]
    code: 200
    input: []
    output: RemittanceAdvice
    side_effects: ["set status=POSTED"]
  - method: GET
    path: "/rcm/payment-postings/{id}"
    description: "Fetch a payment posting"
    roles: [AccountManager, PaymentPoster]
    code: 200
    input: []
    output: PaymentPosting
    side_effects: []
  - method: POST
    path: "/rcm/payment-postings/{id}/reverse"
    description: "Reverse a posting (compensation): restore claim ledger and remittance unallocated pool"
    roles: [PaymentPoster]
    code: 200
    input: [reason]
    output: PaymentPosting
    side_effects: ["set posting.status=REVERSED", "recompute claim ledger and remittance allocation", "revert Claim PAID->ACCEPTED if balance reopens", "recompute Practice collected/AR"]
  # ---- Patient statement / collections ----
  - method: POST
    path: "/rcm/patient-statements"
    description: "Create a patient statement for a claim's patient responsibility"
    roles: [PaymentPoster, AccountManager]
    code: 201
    input: [claim_id]
    output: PatientStatement
    side_effects: ["create PatientStatement DRAFT with statement_amount_cents = Claim.patient_responsibility_cents"]
  - method: GET
    path: "/rcm/patient-statements/{id}"
    description: "Fetch a statement with current aging bucket"
    roles: [AccountManager, PaymentPoster, PracticeUser]
    code: 200
    input: []
    output: PatientStatement
    side_effects: ["recompute aging_bucket from clock"]
  - method: POST
    path: "/rcm/patient-statements/{id}/send"
    description: "Send a statement to the patient (DRAFT -> SENT); starts aging clock"
    roles: [PaymentPoster]
    code: 200
    input: []
    output: PatientStatement
    side_effects: ["set first_sent_date", "set status=SENT"]
  - method: POST
    path: "/rcm/patient-statements/{id}/record-payment"
    description: "Record a patient payment (SENT/PARTIAL/COLLECTIONS -> PARTIAL/PAID)"
    roles: [PaymentPoster]
    code: 200
    input: [amount_cents]
    output: PatientStatement
    side_effects: ["increment amount_paid_cents", "recompute Claim ledger", "set status PARTIAL or PAID"]
  - method: POST
    path: "/rcm/patient-statements/{id}/collections"
    description: "Send an aged statement to collections (SENT/PARTIAL -> COLLECTIONS) when aging_bucket==OVER_90"
    roles: [PaymentPoster]
    code: 200
    input: []
    output: PatientStatement
    side_effects: ["set status=COLLECTIONS"]
  - method: POST
    path: "/rcm/patient-statements/{id}/write-off"
    description: "Write off a collections statement (COLLECTIONS -> WRITTEN_OFF)"
    roles: [AccountManager]
    code: 200
    input: []
    output: PatientStatement
    side_effects: ["add remaining balance to Claim.write_off_cents", "recompute Claim ledger and Practice.ar_balance_cents", "set status=WRITTEN_OFF"]
  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server default before any call is 2026-05-01T00:00:00Z (never real wall-clock)."
    roles: [AccountManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["advance/set logical clock used by all timely-filing, appeal-window, credentialing-expiry, and statement-aging rules"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this operation"
  - id: ERR_VALIDATION
    http: 422
    condition: "Missing required field, wrong type, or out-of-range value"
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "Enum-typed input carries a value outside the declared set"
  - id: ERR_NEGATIVE_AMOUNT
    http: 422
    condition: "A monetary input is negative"
  - id: ERR_PRACTICE_NOT_FOUND
    http: 404
    condition: "Referenced practice does not exist"
  - id: ERR_PAYER_NOT_FOUND
    http: 404
    condition: "Referenced payer does not exist"
  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "Referenced provider does not exist"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "Referenced payer enrollment does not exist"
  - id: ERR_FEE_SCHEDULE_NOT_FOUND
    http: 404
    condition: "Referenced fee schedule does not exist"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "Referenced claim does not exist"
  - id: ERR_DENIAL_NOT_FOUND
    http: 404
    condition: "Referenced denial does not exist"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "Referenced appeal does not exist"
  - id: ERR_REMITTANCE_NOT_FOUND
    http: 404
    condition: "Referenced remittance does not exist"
  - id: ERR_POSTING_NOT_FOUND
    http: 404
    condition: "Referenced payment posting does not exist"
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "Referenced patient statement does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state"
  - id: ERR_NO_CLAIM_LINES
    http: 422
    condition: "Scrub attempted on a claim with no charge lines"
  - id: ERR_NO_ACTIVE_FEE_SCHEDULE
    http: 422
    condition: "No ACTIVE fee schedule covers the claim service_date at scrub"
  - id: ERR_CPT_NOT_IN_FEE_SCHEDULE
    http: 422
    condition: "A claim line CPT is not priced by the covering fee schedule"
  - id: ERR_PROVIDER_NOT_CREDENTIALED
    http: 422
    condition: "Rendering provider is not APPROVED (or credential expired) at submit"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Submitting user is the same user that scrubbed the claim"
  - id: ERR_ENROLLMENT_NOT_ACTIVE
    http: 422
    condition: "No ACTIVE payer enrollment for (provider,payer) covers service_date at submit"
  - id: ERR_TIMELY_FILING_EXCEEDED
    http: 422
    condition: "Days from service_date to now exceed the payer's timely_filing_days"
  - id: ERR_APPEAL_WINDOW_EXCEEDED
    http: 422
    condition: "Days from denial_date to now exceed the payer's appeal_window_days"
  - id: ERR_APPEAL_LIMIT_EXCEEDED
    http: 422
    condition: "Appeal level exceeds the maximum of 2 rounds for the claim"
  - id: ERR_FEE_SCHEDULE_OVERLAP
    http: 409
    condition: "Activating a fee schedule whose closed effective interval overlaps another ACTIVE schedule for the practice"
  - id: ERR_ENROLLMENT_PERIOD_OVERLAP
    http: 409
    condition: "New enrollment's half-open period overlaps an existing non-TERMINATED enrollment for the same (provider,payer)"
  - id: ERR_OVERALLOCATION
    http: 422
    condition: "A posting would push remittance allocated_amount_cents above total_amount_cents"
  - id: ERR_REMITTANCE_NOT_BALANCED
    http: 422
    condition: "Finalize attempted while allocated_amount_cents != total_amount_cents"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)"

roles:
  - name: AccountManager
    description: "Owns practice onboarding, fee schedules, KPI/commission reporting, and write-offs"
    identity: "opaque"
    exclusive_operations: ["create/activate Practice", "create/activate FeeSchedule", "add FeeScheduleLine", "read KPI and billing-fee", "statement write-off"]
    shared_operations: ["read practices/claims/statements"]
  - name: Coder
    description: "Charge entry and coding scrub"
    identity: "opaque"
    exclusive_operations: ["create Claim", "add ClaimLine", "scrub Claim", "void DRAFT claim"]
    shared_operations: ["read claims and fee schedules"]
  - name: Biller
    description: "Claim submission and clearinghouse handling"
    identity: "opaque"
    exclusive_operations: ["submit Claim", "accept Claim", "close PAID/DENIED claim"]
    shared_operations: ["read claims, providers, payers, denials"]
  - name: DenialSpecialist
    description: "Denial management and appeals"
    identity: "opaque"
    exclusive_operations: ["record Denial", "create/submit/decide Appeal"]
    shared_operations: ["read claims and denials"]
  - name: PaymentPoster
    description: "Payment posting, reconciliation, and patient statements"
    identity: "opaque"
    exclusive_operations: ["create Remittance", "create/reverse PaymentPosting", "finalize Remittance", "create/send/record-payment/collections Statement"]
    shared_operations: ["read claims, remittances, statements"]
  - name: CredentialingSpecialist
    description: "Provider credentialing and payer enrollment linkage"
    identity: "opaque"
    exclusive_operations: ["create Provider", "submit/decide credentialing", "create/activate/terminate PayerEnrollment"]
    shared_operations: ["read providers, payers, enrollments"]
  - name: PracticeUser
    description: "Client practice user with read-only visibility into their own practice"
    identity: "entity_backed:Practice"
    exclusive_operations: []
    shared_operations: ["read own practice, claims, statements, KPI, billing-fee"]
