# =============================================================================
# Scaffold: Donut & Bagel Shop (retail + wholesale) — Expert difficulty
# =============================================================================

scenario: |
  723. Donut & Bagel Shop (retail + wholesale): retail POS & dozen/bulk pricing,
  daily par-bake & waste/markdown, wholesale account & standing-order route,
  pre-order (holiday/event) & catering, loyalty/punch, allergen labeling,
  delivery cutoff, reconciliation

domain_name: donut-bagel-shop
api_prefix: /

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: hybrid
  # ProductionDay is a posture-bearing reconciliation root with nested BakeBatch /
  # RetailOrder / WholesaleDelivery children; Product, LoyaltyAccount,
  # WholesaleAccount, StandingOrder, PreOrder are flat peers linked by FK.

  state_machine_shape: posture_driven
  # ProductionDay status (OPEN→BAKING→SELLING→CUTOFF→RECONCILED) gates which
  # child operations are legal; BakeBatch carries a branching markdown/sweep
  # shape; RetailOrder carries a cyclic void/refund shape.

  relationship_patterns:
    - one_to_many       # ProductionDay -> BakeBatch / RetailOrder / WholesaleDelivery
    - cross_aggregate   # WholesaleDelivery references both StandingOrder and ProductionDay
    - flat_with_references  # Product, WholesaleAccount, LoyaltyAccount linked by FK

  role_model: peer_roles
  # Cashier owns retail POS; RouteDriver owns wholesale deliveries; BakeManager
  # owns production/bake/reconcile; WholesaleClient acts on its own account/orders;
  # ShopAdmin is the operational superset for config + day lifecycle.

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: sku, type: string, source: input, description: "Unique product SKU (e.g., GLAZED)", constraints: "unique across Products" }
      - { name: name, type: string, source: input, description: "Display name (e.g., Glazed Donut)" }
      - { name: category, type: enum, source: input, description: "DONUT | BAGEL", constraints: "one of {DONUT, BAGEL}" }
      - { name: unit_price_cents, type: integer, source: input, description: "Single-unit retail price in cents", constraints: ">= 1" }
      - { name: dozen_price_cents, type: integer, source: input, description: "Price for a dozen (12 units) in cents", constraints: ">= 1" }
      - { name: bulk_threshold, type: integer, source: input, default: 24, description: "Quantity at or above which the flat bulk per-unit rate applies", constraints: ">= 12" }
      - { name: bulk_unit_price_cents, type: integer, source: input, description: "Flat per-unit price applied to the WHOLE line when qty >= bulk_threshold", constraints: ">= 1" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Cost of goods per unit in cents (drives waste cost)", constraints: ">= 0" }
      - { name: allergens, type: array, source: input, default: [], description: "Allergen labels, e.g. [WHEAT, EGG, SOY]; values from {WHEAT, EGG, MILK, SOY, NUT, SESAME}" }
      - { name: active, type: boolean, source: system, default: true, description: "False once retired; retired products cannot be added to new batches/orders" }

  - name: ProductionDay
    parent: null
    common_fields: true
    fields:
      - { name: business_date, type: string, source: input, description: "Calendar date (YYYY-MM-DD) this production day covers", constraints: "unique across ProductionDays" }
      - { name: delivery_cutoff_utc, type: datetime, source: input, description: "ISO8601 UTC instant after which no new WholesaleDelivery may be scheduled and no StandingOrder may be released into this day" }
      - { name: status, type: enum, source: system, description: "OPEN -> BAKING -> SELLING -> CUTOFF -> RECONCILED", constraints: "one of {OPEN, BAKING, SELLING, CUTOFF, RECONCILED}" }
      - { name: gross_sales_cents, type: integer, source: computed, description: "Read-only: sum of PAID RetailOrder.total_cents + INVOICED WholesaleDelivery.amount_cents for this day; 0 until reconcile" }
      - { name: markdown_loss_cents, type: integer, source: computed, description: "Read-only: sum over batches of marked-down units * (unit_price_cents - markdown_price); finalized at reconcile" }
      - { name: waste_cost_cents, type: integer, source: computed, description: "Read-only: sum over SWEPT batches of wasted_qty * Product.unit_cost_cents; finalized at reconcile" }
      - { name: expected_full_value_cents, type: integer, source: computed, description: "Read-only: sum over batches of baked_qty * Product.unit_price_cents; the forward-looking variant baseline" }
      - { name: reconciliation_variance_cents, type: integer, source: computed, description: "Read-only: expected_full_value_cents - gross_sales_cents - markdown_loss_cents - waste_cost_cents; finalized at reconcile, else 0" }

  - name: BakeBatch
    parent: ProductionDay
    common_fields: true
    fields:
      - { name: production_day_id, type: string, source: input, description: "FK -> ProductionDay.id; the day this batch belongs to" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the product baked" }
      - { name: par_qty, type: integer, source: input, description: "Planned par-bake quantity", constraints: ">= 0" }
      - { name: baked_qty, type: integer, source: input, default: 0, description: "Actual quantity baked (set when batch is baked)", constraints: ">= 0" }
      - { name: sold_qty, type: integer, source: computed, description: "Read-only: units of this product sold across PAID RetailOrders on this day (full-price + marked-down)" }
      - { name: markdown_sold_qty, type: integer, source: computed, description: "Read-only: units of this product sold at the markdown price after this batch was MARKED_DOWN" }
      - { name: remaining_qty, type: integer, source: computed, description: "Read-only: baked_qty - sold_qty; never below 0" }
      - { name: wasted_qty, type: integer, source: computed, description: "Read-only: remaining_qty captured at SWEPT (units thrown away); 0 until SWEPT" }
      - { name: status, type: enum, source: system, description: "PLANNED -> BAKED -> MARKED_DOWN -> SWEPT", constraints: "one of {PLANNED, BAKED, MARKED_DOWN, SWEPT}" }

  - name: RetailOrder
    parent: ProductionDay
    common_fields: true
    fields:
      - { name: production_day_id, type: string, source: input, description: "FK -> ProductionDay.id; the selling day" }
      - { name: loyalty_account_id, type: string, source: input, description: "FK -> LoyaltyAccount.id; optional loyalty member; null for anonymous sale" }
      - { name: line_items, type: array, source: input, description: "Array of {product_id, qty, marked_down}; marked_down=true charges the markdown price and pulls from a MARKED_DOWN batch" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Read-only: sum of per-line dozen/bulk (or markdown) prices, no loyalty discount" }
      - { name: loyalty_discount_cents, type: integer, source: computed, description: "Read-only: reward redeemed against this order (0 unless redeem_reward set and reward_balance covers a dozen)" }
      - { name: total_cents, type: integer, source: computed, description: "Read-only: subtotal_cents - loyalty_discount_cents, floored at 0" }
      - { name: redeem_reward, type: boolean, source: input, default: false, description: "If true, apply one available loyalty reward (free-dozen credit) to this order" }
      - { name: status, type: enum, source: system, description: "CART -> PAID -> REFUNDED ; PAID -> VOIDED", constraints: "one of {CART, PAID, VOIDED, REFUNDED}" }

  - name: LoyaltyAccount
    parent: null
    common_fields: true
    fields:
      - { name: phone, type: string, source: input, description: "Member phone number", constraints: "unique across LoyaltyAccounts" }
      - { name: name, type: string, source: input, description: "Member name" }
      - { name: punch_count, type: integer, source: computed, description: "Read-only: current punches toward next reward (0..PUNCHES_PER_REWARD-1 after auto-conversion)" }
      - { name: reward_balance_cents, type: integer, source: computed, description: "Read-only: accrued free-dozen reward value in cents available to redeem" }

  - name: WholesaleAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Wholesale customer business name" }
      - { name: discount_pct, type: number, source: input, description: "Fractional discount applied to wholesale order subtotals (e.g., 0.15)", constraints: "0 <= discount_pct < 1" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding (INVOICED-but-unpaid) balance allowed", constraints: ">= 0" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Read-only: sum of INVOICED WholesaleDelivery.amount_cents minus sum of recorded payments" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> SUSPENDED -> ACTIVE", constraints: "one of {ACTIVE, SUSPENDED}" }

  - name: StandingOrder
    parent: null
    common_fields: true
    fields:
      - { name: wholesale_account_id, type: string, source: input, description: "FK -> WholesaleAccount.id; owning account" }
      - { name: delivery_dow, type: integer, source: input, description: "Day-of-week this standing order recurs (0=Mon .. 6=Sun)", constraints: "0..6" }
      - { name: line_items, type: array, source: input, description: "Array of {product_id, qty}; the recurring route order contents" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> PAUSED -> ACTIVE ; ACTIVE/PAUSED -> CANCELLED", constraints: "one of {ACTIVE, PAUSED, CANCELLED}" }

  - name: WholesaleDelivery
    parent: ProductionDay
    common_fields: true
    fields:
      - { name: production_day_id, type: string, source: input, description: "FK -> ProductionDay.id; the fulfillment day" }
      - { name: standing_order_id, type: string, source: input, description: "FK -> StandingOrder.id; the standing order this delivery realizes" }
      - { name: wholesale_account_id, type: string, source: system, description: "FK -> WholesaleAccount.id; copied from the StandingOrder for ledger lookups" }
      - { name: route_window_start, type: datetime, source: input, description: "ISO8601 UTC start of the driver route stop window (closed interval, buffer-separated from other stops)" }
      - { name: route_window_end, type: datetime, source: input, description: "ISO8601 UTC end of the route stop window; must be > route_window_start" }
      - { name: amount_cents, type: integer, source: computed, description: "Read-only: discounted invoice amount (see wholesale_delivery_amount calc)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> PICKED -> DELIVERED -> INVOICED ; SCHEDULED/PICKED -> CANCELLED", constraints: "one of {SCHEDULED, PICKED, DELIVERED, INVOICED, CANCELLED}" }

  - name: PreOrder
    parent: null
    common_fields: true
    fields:
      - { name: wholesale_account_id, type: string, source: input, description: "FK -> WholesaleAccount.id; owning account (catering/holiday client)" }
      - { name: pickup_production_day_id, type: string, source: input, description: "FK -> ProductionDay.id; the day the pre-order is fulfilled" }
      - { name: pickup_window_start, type: datetime, source: input, description: "ISO8601 UTC start of the catering pickup window (half-open [start, end))" }
      - { name: pickup_window_end, type: datetime, source: input, description: "ISO8601 UTC end of the catering pickup window; must be > pickup_window_start" }
      - { name: line_items, type: array, source: input, description: "Array of {product_id, qty}; the catering/event order contents" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Read-only: sum of per-line dozen/bulk prices before account discount" }
      - { name: deposit_due_cents, type: integer, source: computed, description: "Read-only: required deposit (see preorder_deposit calc); 0 below the catering threshold" }
      - { name: deposit_paid_cents, type: integer, source: computed, description: "Read-only: deposit recorded so far; must reach deposit_due_cents to CONFIRM" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> CONFIRMED -> FULFILLED ; REQUESTED/CONFIRMED -> CANCELLED", constraints: "one of {REQUESTED, CONFIRMED, FULFILLED, CANCELLED}" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: ProductionDay
    initial_state: OPEN
    terminal_states: [RECONCILED]
    transitions:
      - from: OPEN
        to: BAKING
        trigger: "POST /production-days/{id}/start-baking"
        actor: BakeManager
        preconditions:
          - "Day must be OPEN (ERR_DAY_INVALID_STATE)"
          - "At least one BakeBatch exists for the day (ERR_NO_BATCHES)"
        side_effects: []

      - from: BAKING
        to: SELLING
        trigger: "POST /production-days/{id}/open-sales"
        actor: BakeManager
        preconditions:
          - "Day must be BAKING (ERR_DAY_INVALID_STATE)"
          - "Every BakeBatch on the day is BAKED or later (none still PLANNED) (ERR_UNBAKED_BATCHES)"
        side_effects: []

      - from: SELLING
        to: CUTOFF
        trigger: "POST /production-days/{id}/close-cutoff"
        actor: ShopAdmin
        preconditions:
          - "Day must be SELLING (ERR_DAY_INVALID_STATE)"
        side_effects:
          - "No new WholesaleDelivery may be SCHEDULED on this day after CUTOFF (enforced as a validation on schedule)"
          - "RetailOrders may still be created/paid/refunded until reconcile"

      - from: CUTOFF
        to: RECONCILED
        trigger: "POST /production-days/{id}/reconcile"
        actor: BakeManager
        preconditions:
          - "Day must be CUTOFF (ERR_DAY_INVALID_STATE)"
          - "Every BakeBatch on the day is SWEPT (ERR_BATCHES_NOT_SWEPT)"
          - "No WholesaleDelivery on the day is in SCHEDULED, PICKED, or DELIVERED (all must be INVOICED or CANCELLED) (ERR_DELIVERIES_OPEN)"
          - "expected_<production_day>_version must match (OCC) (ERR_STALE_VERSION)"
        side_effects:
          - "Compute and freeze gross_sales_cents, markdown_loss_cents, waste_cost_cents, expected_full_value_cents (reconcile_day calc)"
          - "Compute and freeze reconciliation_variance_cents = expected_full_value_cents - gross_sales_cents - markdown_loss_cents - waste_cost_cents"
          - "increments ProductionDay.version by 1"

  - entity: BakeBatch
    initial_state: PLANNED
    terminal_states: [SWEPT]
    transitions:
      - from: PLANNED
        to: BAKED
        trigger: "POST /production-days/{id}/bake-batches/{batchId}/bake"
        actor: BakeManager
        preconditions:
          - "Batch must be PLANNED (ERR_BATCH_INVALID_STATE)"
          - "Parent day must be BAKING (ERR_DAY_INVALID_STATE)"
          - "baked_qty in request must be >= 1 (ERR_INVALID_BAKE_QTY)"
        side_effects:
          - "baked_qty set from request; remaining_qty initialized to baked_qty; sold_qty=0"

      - from: BAKED
        to: MARKED_DOWN
        trigger: "POST /production-days/{id}/bake-batches/{batchId}/markdown"
        actor: Cashier
        preconditions:
          - "Batch must be BAKED (ERR_BATCH_INVALID_STATE)"
          - "Parent day must be SELLING (ERR_DAY_INVALID_STATE)"
          - "remaining_qty must be >= 1 (ERR_NOTHING_TO_MARK_DOWN)"
        side_effects:
          - "Subsequent RetailOrder lines for this product may set marked_down=true and are charged markdown_price"

      - from: BAKED
        to: SWEPT
        trigger: "POST /production-days/{id}/bake-batches/{batchId}/sweep"
        actor: BakeManager
        preconditions:
          - "Batch must be BAKED or MARKED_DOWN (ERR_BATCH_INVALID_STATE)"
          - "Parent day must be SELLING or CUTOFF (ERR_DAY_INVALID_STATE)"
        side_effects:
          - "wasted_qty frozen = current remaining_qty; batch contributes wasted_qty * Product.unit_cost_cents to the day waste pool"

      - from: MARKED_DOWN
        to: SWEPT
        trigger: "POST /production-days/{id}/bake-batches/{batchId}/sweep"
        actor: BakeManager
        preconditions:
          - "Batch must be BAKED or MARKED_DOWN (ERR_BATCH_INVALID_STATE)"
          - "Parent day must be SELLING or CUTOFF (ERR_DAY_INVALID_STATE)"
        side_effects:
          - "wasted_qty frozen = current remaining_qty; batch contributes wasted_qty * Product.unit_cost_cents to the day waste pool"

  - entity: RetailOrder
    initial_state: CART
    terminal_states: [VOIDED, REFUNDED]
    transitions:
      - from: CART
        to: PAID
        trigger: "POST /production-days/{id}/retail-orders/{orderId}/pay"
        actor: Cashier
        preconditions:
          - "Order must be CART (ERR_ORDER_INVALID_STATE)"
          - "Parent day must be SELLING (ERR_DAY_INVALID_STATE)"
          - "For each marked_down line, the product's batch on this day is MARKED_DOWN and has remaining_qty >= line qty (ERR_INSUFFICIENT_MARKDOWN_STOCK)"
          - "For each line, the product's batch remaining_qty >= line qty (ERR_INSUFFICIENT_STOCK)"
        side_effects:
          - "Decrement each line product's batch sold_qty/remaining_qty (cascade to BakeBatch); markdown lines also bump markdown_sold_qty"
          - "Accrue loyalty punches if loyalty_account_id set (loyalty_punch calc); at threshold auto-convert to reward (cascade to LoyaltyAccount)"
          - "If redeem_reward, debit one reward from LoyaltyAccount.reward_balance_cents (cascade) and set loyalty_discount_cents"

      - from: PAID
        to: VOIDED
        trigger: "POST /production-days/{id}/retail-orders/{orderId}/void"
        actor: Cashier
        preconditions:
          - "Order must be PAID (ERR_ORDER_INVALID_STATE)"
          - "Parent day must be SELLING (ERR_DAY_INVALID_STATE)"
        side_effects:
          - "Restore each line product's batch sold_qty/remaining_qty (compensation; markdown_sold_qty restored for markdown lines)"
          - "Reverse loyalty punches accrued by this order; if a reward auto-converted on this order, revert the conversion (cascade to LoyaltyAccount)"
          - "If redeem_reward, refund the redeemed reward back to LoyaltyAccount.reward_balance_cents (cascade)"

      - from: PAID
        to: REFUNDED
        trigger: "POST /production-days/{id}/retail-orders/{orderId}/refund"
        actor: ShopAdmin
        preconditions:
          - "Order must be PAID (ERR_ORDER_INVALID_STATE)"
        side_effects:
          - "Restore each line product's batch sold_qty/remaining_qty (compensation; markdown_sold_qty restored)"
          - "Reverse loyalty punches and any reward conversion accrued by this order (cascade to LoyaltyAccount)"
          - "If redeem_reward, refund the redeemed reward to LoyaltyAccount.reward_balance_cents (cascade)"

  - entity: WholesaleDelivery
    initial_state: SCHEDULED
    terminal_states: [INVOICED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PICKED
        trigger: "POST /production-days/{id}/wholesale-deliveries/{deliveryId}/pick"
        actor: RouteDriver
        preconditions:
          - "Delivery must be SCHEDULED (ERR_DELIVERY_INVALID_STATE)"
        side_effects: []

      - from: PICKED
        to: DELIVERED
        trigger: "POST /production-days/{id}/wholesale-deliveries/{deliveryId}/deliver"
        actor: RouteDriver
        preconditions:
          - "Delivery must be PICKED (ERR_DELIVERY_INVALID_STATE)"
        side_effects: []

      - from: DELIVERED
        to: INVOICED
        trigger: "POST /production-days/{id}/wholesale-deliveries/{deliveryId}/invoice"
        actor: ShopAdmin
        preconditions:
          - "Delivery must be DELIVERED (ERR_DELIVERY_INVALID_STATE)"
          - "WholesaleAccount must be ACTIVE (ERR_ACCOUNT_SUSPENDED)"
          - "account.outstanding_balance_cents + this.amount_cents <= account.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Increase WholesaleAccount.outstanding_balance_cents by amount_cents (cascade; ledger sync)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /production-days/{id}/wholesale-deliveries/{deliveryId}/cancel"
        actor: RouteDriver
        preconditions:
          - "Delivery must be SCHEDULED or PICKED (ERR_DELIVERY_INVALID_STATE)"
        side_effects: []

      - from: PICKED
        to: CANCELLED
        trigger: "POST /production-days/{id}/wholesale-deliveries/{deliveryId}/cancel"
        actor: RouteDriver
        preconditions:
          - "Delivery must be SCHEDULED or PICKED (ERR_DELIVERY_INVALID_STATE)"
        side_effects: []

  - entity: PreOrder
    initial_state: REQUESTED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /pre-orders/{preOrderId}/confirm"
        actor: ShopAdmin
        preconditions:
          - "PreOrder must be REQUESTED (ERR_PREORDER_INVALID_STATE)"
          - "deposit_paid_cents >= deposit_due_cents (ERR_DEPOSIT_NOT_MET)"
          - "pickup ProductionDay must not be RECONCILED (ERR_DAY_INVALID_STATE)"
        side_effects: []

      - from: CONFIRMED
        to: FULFILLED
        trigger: "POST /pre-orders/{preOrderId}/fulfill"
        actor: ShopAdmin
        preconditions:
          - "PreOrder must be CONFIRMED (ERR_PREORDER_INVALID_STATE)"
          - "pickup ProductionDay must be SELLING or CUTOFF (ERR_DAY_INVALID_STATE)"
        side_effects: []

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /pre-orders/{preOrderId}/cancel"
        actor: ShopAdmin
        preconditions:
          - "PreOrder must be REQUESTED or CONFIRMED (ERR_PREORDER_INVALID_STATE)"
        side_effects: []

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /pre-orders/{preOrderId}/cancel"
        actor: ShopAdmin
        preconditions:
          - "PreOrder must be REQUESTED or CONFIRMED (ERR_PREORDER_INVALID_STATE)"
        side_effects: []

  - entity: WholesaleAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /wholesale-accounts/{id}/suspend"
        actor: ShopAdmin
        preconditions:
          - "Account must be ACTIVE (ERR_ACCOUNT_INVALID_STATE)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /wholesale-accounts/{id}/reactivate"
        actor: ShopAdmin
        preconditions:
          - "Account must be SUSPENDED (ERR_ACCOUNT_INVALID_STATE)"
        side_effects: []

# -----------------------------------------------------------------------------
# Table 1.2.1: Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: reconcile-stale-day
    parent_entity: ProductionDay
    write_endpoint: "POST /production-days/{id}/reconcile"
    occ_field: "expected_production_day_version"
    description: |
      Reconciling a ProductionDay whose version has advanced since the client
      last observed it is rejected. A prior write (e.g., a sweep that froze a
      batch's wasted_qty and bumped the day, or another reconcile attempt) means
      the client's view of the day's pools is stale, so the stale-version
      reconcile is refused rather than freezing figures computed from an
      out-of-date snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: line_price
    trigger: "computing subtotal_cents on RetailOrder pay, PreOrder create, StandingOrder release, and as the per-line input to wholesale_delivery_amount"
    algorithm: tiered_pricing
    formula: |
      # qty, and product fields unit_price_cents (U), dozen_price_cents (D),
      # bulk_threshold (T), bulk_unit_price_cents (B). Evaluation order is PINNED:
      if marked_down:                 # markdown lines bypass dozen/bulk tiers
        line = qty * markdown_price   # markdown_price from markdown_price calc
      elif qty >= T:                  # whole-line flat bulk rate (>=, not >)
        line = qty * B
      else:
        dozens = qty // 12
        rem    = qty % 12
        line   = dozens * D + rem * U
    input_set: "single order line; qty is the requested integer quantity"
    constants: {}
    precision: "integer cents; no rounding needed (all factors integer)"
    note: "bulk rate replaces dozen pricing entirely once qty >= bulk_threshold; the boundary is inclusive"

  - name: markdown_price
    trigger: "BakeBatch markdown, and pricing of marked_down RetailOrder lines"
    algorithm: threshold
    formula: |
      markdown_price = round_half_up(Product.unit_price_cents * (1 - MARKDOWN_PCT))
    input_set: "a single Product's unit_price_cents"
    constants:
      MARKDOWN_PCT: 0.40
    precision: "integer cents, round_half_up"
    note: "e.g. unit_price_cents=150 -> 90; unit_price_cents=175 -> 105"

  - name: retail_order_total
    trigger: "RetailOrder pay"
    algorithm: aggregation
    formula: |
      subtotal_cents = sum(line_price(line) for line in line_items)
      if redeem_reward AND loyalty_account.reward_balance_cents >= REWARD_VALUE_CENTS:
        loyalty_discount_cents = min(REWARD_VALUE_CENTS, subtotal_cents)
      else:
        loyalty_discount_cents = 0
      total_cents = max(0, subtotal_cents - loyalty_discount_cents)
    input_set: "all line_items on the order"
    constants:
      REWARD_VALUE_CENTS: 1200
    precision: "integer cents"
    note: "evaluation order pinned: subtotal first, then reward redemption, then total"

  - name: loyalty_punch
    trigger: "RetailOrder pay (accrue), void/refund (reverse)"
    algorithm: threshold
    formula: |
      earned = (sum of qty across all line_items) // 12     # one punch per full dozen
      punch_count += earned
      while punch_count >= PUNCHES_PER_REWARD:               # >= boundary, auto-convert
        punch_count    -= PUNCHES_PER_REWARD
        reward_balance_cents += REWARD_VALUE_CENTS
      # void/refund applies the exact inverse: subtract earned punches and undo
      # any conversions this order caused (reverse REWARD_VALUE_CENTS per conversion).
    input_set: "the paying RetailOrder's line_items and the linked LoyaltyAccount"
    constants:
      PUNCHES_PER_REWARD: 10
      REWARD_VALUE_CENTS: 1200
    precision: "integer punches / integer cents"
    note: "compensating-invariant target: punches earned then reversed leave LoyaltyAccount punch_count + (rewards*PUNCHES_PER_REWARD) unchanged"

  - name: wholesale_delivery_amount
    trigger: "WholesaleDelivery scheduling (computed) and frozen at invoice"
    algorithm: tiered_pricing
    formula: |
      raw = sum(line_price(line) for line in standing_order.line_items)   # per-line dozen/bulk, NO markdown
      # Rounding order is PINNED: discount the SUMMED raw once, then round (sum-then-round).
      amount_cents = round_half_up(raw * (1 - account.discount_pct))
    input_set: "the StandingOrder.line_items snapshot at scheduling time, plus the WholesaleAccount.discount_pct"
    constants: {}
    precision: "integer cents, round_half_up, applied ONCE after summation"
    note: |
      Sum-then-round is mandatory and differs from round-per-line-then-sum:
      e.g. lines GLAZED qty1 (raw 150) + EVERYTHING qty1 (raw 135), discount 0.15:
      sum-then-round = round_half_up(285*0.85)=round_half_up(242.25)=242,
      whereas per-line-then-sum = round_half_up(127.5)+round_half_up(114.75)=128+115=243.

  - name: preorder_deposit
    trigger: "PreOrder create / recompute; gate for CONFIRM"
    algorithm: threshold
    formula: |
      subtotal_cents = sum(line_price(line) for line in line_items)   # dozen/bulk, NO discount
      if subtotal_cents >= CATERING_DEPOSIT_THRESHOLD_CENTS:           # >= boundary
        deposit_due_cents = round_half_up(subtotal_cents * DEPOSIT_PCT)
      else:
        deposit_due_cents = 0
    input_set: "the PreOrder.line_items"
    constants:
      CATERING_DEPOSIT_THRESHOLD_CENTS: 4050
      DEPOSIT_PCT: 0.25
    precision: "integer cents, round_half_up"
    note: "subtotal exactly 4050 requires a round_half_up(4050*0.25)=1013 deposit; subtotal 4035 (one reachable step below the threshold) requires 0"

  - name: reconcile_day
    trigger: "ProductionDay reconcile"
    algorithm: forward_looking
    formula: |
      # Forward-looking baseline vs chronological actual — the dual-variant pair.
      expected_full_value_cents =
        sum over BakeBatch on day of (baked_qty * Product.unit_price_cents)        # FORWARD
      gross_sales_cents =
        sum(RetailOrder.total_cents where status==PAID and production_day_id==day)  # CHRONOLOGICAL ACTUAL
        + sum(WholesaleDelivery.amount_cents where status==INVOICED and production_day_id==day)
      markdown_loss_cents =
        sum over BakeBatch on day of (markdown_sold_qty * (Product.unit_price_cents - markdown_price))
      waste_cost_cents =
        sum over BakeBatch on day where status==SWEPT of (wasted_qty * Product.unit_cost_cents)
      reconciliation_variance_cents =
        expected_full_value_cents - gross_sales_cents - markdown_loss_cents - waste_cost_cents
    input_set: "all BakeBatch, PAID RetailOrder, INVOICED WholesaleDelivery for the day"
    constants: {}
    precision: "integer cents"
    variants:
      - name: expected_forward
        when: "the par/baked baseline — what the day WOULD have grossed if every baked unit sold at full unit_price_cents"
        difference: "ignores actual sales, markdowns, and waste; depends only on baked_qty and unit_price_cents"
      - name: actual_chronological
        when: "the realized ledger — what actually came in, net of markdown loss and waste"
        difference: "sums realized PAID/INVOICED money plus the realized markdown_loss and waste_cost deductions"

  - name: wholesale_outstanding_balance
    trigger: "WholesaleDelivery invoice (increase), POST wholesale payment (decrease)"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents =
        sum(WholesaleDelivery.amount_cents where status==INVOICED and wholesale_account_id==acct)
        - sum(payment.amount_cents recorded against acct)
    input_set: "INVOICED deliveries and recorded payments for the account"
    constants: {}
    precision: "integer cents"
    note: "compensating-invariant target: invoice then full payment of the same amount leaves outstanding_balance_cents unchanged from its pre-invoice value"

  - name: catering_slot_overlap
    trigger: "PreOrder create"
    algorithm: interval_merge
    formula: |
      # AGGREGATE-CAPACITY semantics over HALF-OPEN intervals [start, end).
      # The candidate window [s, e) overlaps an existing window [s2, e2) iff
      #   s < e2 AND s2 < e   (shared boundary does NOT overlap: e == s2 is OK).
      # Count, over all non-CANCELLED PreOrders on the same pickup_production_day_id,
      # those whose window overlaps [s, e). If that count (existing overlaps) is
      # already >= CATERING_SLOT_CAPACITY, reject — admitting this one would make
      # CATERING_SLOT_CAPACITY+1 concurrent at the point of densest overlap.
      overlapping = count(PreOrder p on day where p.status != CANCELLED
                          and p.pickup_window_start < e and s < p.pickup_window_end)
      if overlapping >= CATERING_SLOT_CAPACITY: reject ERR_CATERING_SLOT_FULL
    input_set: "non-CANCELLED PreOrders sharing pickup_production_day_id"
    constants:
      CATERING_SLOT_CAPACITY: 2
    precision: "n/a (integer count)"
    note: "half-open: a window ending exactly when another begins does NOT overlap"

  - name: route_window_overlap
    trigger: "WholesaleDelivery release/schedule"
    algorithm: interval_merge
    formula: |
      # BUFFER-ADJACENCY semantics over CLOSED intervals [start, end] on a single
      # resource (the same WholesaleAccount's deliveries on this day). Two stops
      # collide if their windows are within ROUTE_BUFFER_MINUTES of each other:
      #   collision iff s <= e2 + BUFFER AND s2 <= e + BUFFER
      # (BUFFER closes the gap, so back-to-back AND near-adjacent stops both reject).
      # Only one prior non-terminal (SCHEDULED/PICKED/DELIVERED) delivery for the
      # same account on the day need collide to reject.
      for d in deliveries(account, day) where d.status in {SCHEDULED, PICKED, DELIVERED}:
        if s <= d.route_window_end + BUFFER and d.route_window_start <= e + BUFFER:
          reject ERR_ROUTE_WINDOW_CONFLICT
    input_set: "SCHEDULED/PICKED/DELIVERED deliveries for the same account+day"
    constants:
      ROUTE_BUFFER_MINUTES: 30
    precision: "n/a (minute arithmetic)"
    note: "closed + buffer: windows must be separated by strictly more than 30 minutes to coexist"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role permitted for this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body resource references exist (validated left-to-right in path)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints with path/body ids

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, qty >= 1 per line, line_items non-empty"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all create/update endpoints

  - priority: 5
    category: state
    check: "Parent ProductionDay in the correct status for the operation (e.g., SELLING to pay a retail order, BAKING to bake a batch)"
    error_id: ERR_DAY_INVALID_STATE
    http_status: 409
    applies_to: "day lifecycle, bake/markdown/sweep, retail pay, delivery schedule"

  - priority: 6
    category: state
    check: "Target resource in the correct status for the requested transition"
    error_id: "varies (ERR_BATCH_INVALID_STATE, ERR_ORDER_INVALID_STATE, ERR_DELIVERY_INVALID_STATE, ERR_PREORDER_INVALID_STATE, ERR_ACCOUNT_INVALID_STATE)"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: business_temporal
    check: "Scheduling a WholesaleDelivery requires the day NOT past delivery_cutoff_utc AND day not in CUTOFF/RECONCILED"
    error_id: ERR_PAST_DELIVERY_CUTOFF
    http_status: 409
    applies_to: "POST /production-days/{id}/wholesale-deliveries"

  - priority: 8
    category: state
    check: "Releasing a delivery requires the StandingOrder to be ACTIVE (not PAUSED/CANCELLED)"
    error_id: ERR_STANDING_ORDER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /production-days/{id}/wholesale-deliveries"

  - priority: 9
    category: business_referential
    check: "WholesaleAccount must be ACTIVE to invoice a delivery or release a standing order"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: "delivery invoice, standing-order release"

  - priority: 10
    category: business_temporal
    check: "Route window must be buffer-separated (>30 min) from other non-terminal deliveries for the same account on this day"
    error_id: ERR_ROUTE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /production-days/{id}/wholesale-deliveries"

  - priority: 11
    category: business_temporal
    check: "Catering pickup window must not exceed CATERING_SLOT_CAPACITY concurrent non-CANCELLED PreOrders on the pickup day"
    error_id: ERR_CATERING_SLOT_FULL
    http_status: 409
    applies_to: "POST /pre-orders"

  - priority: 12
    category: business_constraint
    check: "Markdown line requires the product's batch to be MARKED_DOWN with remaining_qty >= line qty"
    error_id: ERR_INSUFFICIENT_MARKDOWN_STOCK
    http_status: 409
    applies_to: "POST /production-days/{id}/retail-orders/{orderId}/pay"

  - priority: 13
    category: business_constraint
    check: "Full-price line requires the product's batch remaining_qty >= line qty"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /production-days/{id}/retail-orders/{orderId}/pay"

  - priority: 14
    category: business_fiscal
    check: "Invoicing a delivery must not push account.outstanding_balance_cents + amount_cents above credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /production-days/{id}/wholesale-deliveries/{deliveryId}/invoice"

  - priority: 15
    category: business_fiscal
    check: "Confirming a PreOrder requires deposit_paid_cents >= deposit_due_cents"
    error_id: ERR_DEPOSIT_NOT_MET
    http_status: 402
    applies_to: "POST /pre-orders/{preOrderId}/confirm"

  - priority: 16
    category: business_constraint
    check: "Reconcile requires every BakeBatch SWEPT and no open (SCHEDULED/PICKED/DELIVERED) WholesaleDelivery"
    error_id: "varies (ERR_BATCHES_NOT_SWEPT, ERR_DELIVERIES_OPEN)"
    http_status: 409
    applies_to: "POST /production-days/{id}/reconcile"

  - priority: 17
    category: business_constraint
    check: "OCC: expected_production_day_version must equal current ProductionDay.version on reconcile"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /production-days/{id}/reconcile"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Product (config) ---
  - method: POST
    path: "/products"
    description: "Create a product (donut or bagel) with retail/dozen/bulk pricing and allergen labels"
    roles: [ShopAdmin]
    code: 201
    input: [sku, name, category, unit_price_cents, dozen_price_cents, "bulk_threshold?", bulk_unit_price_cents, unit_cost_cents, "allergens?"]
    output: Product
    side_effects: ["active=true"]

  - method: GET
    path: "/products"
    description: "List products"
    roles: [ShopAdmin, Cashier, BakeManager, RouteDriver, WholesaleClient]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: "Product[]"
    side_effects: []

  - method: GET
    path: "/products/{id}"
    description: "Get a product (includes allergens label)"
    roles: [ShopAdmin, Cashier, BakeManager, RouteDriver, WholesaleClient]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/products/{id}/bake-batches"
    description: "List bake batches for a product across days (reverse-reachability for BakeBatch.product_id)"
    roles: [ShopAdmin, BakeManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "BakeBatch[]"
    side_effects: []

  # --- ProductionDay ---
  - method: POST
    path: "/production-days"
    description: "Open a new production day with a delivery cutoff"
    roles: [ShopAdmin]
    code: 201
    input: [business_date, delivery_cutoff_utc]
    output: ProductionDay
    side_effects: ["status=OPEN; all computed pools 0"]

  - method: GET
    path: "/production-days"
    description: "List production days"
    roles: [ShopAdmin, Cashier, BakeManager, RouteDriver, WholesaleClient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ProductionDay[]"
    side_effects: []

  - method: GET
    path: "/production-days/{id}"
    description: "Get a production day with reconciliation pools"
    roles: [ShopAdmin, Cashier, BakeManager, RouteDriver, WholesaleClient]
    code: 200
    input: []
    output: ProductionDay
    side_effects: []

  - method: POST
    path: "/production-days/{id}/start-baking"
    description: "Move day OPEN -> BAKING"
    roles: [BakeManager]
    code: 200
    input: []
    output: ProductionDay
    side_effects: ["status -> BAKING"]

  - method: POST
    path: "/production-days/{id}/open-sales"
    description: "Move day BAKING -> SELLING"
    roles: [BakeManager]
    code: 200
    input: []
    output: ProductionDay
    side_effects: ["status -> SELLING"]

  - method: POST
    path: "/production-days/{id}/close-cutoff"
    description: "Move day SELLING -> CUTOFF; no further wholesale deliveries may be scheduled"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: ProductionDay
    side_effects: ["status -> CUTOFF"]

  - method: POST
    path: "/production-days/{id}/reconcile"
    description: "Move day CUTOFF -> RECONCILED; freeze gross_sales/markdown_loss/waste/expected/variance. OCC-guarded on the day version."
    roles: [BakeManager]
    code: 200
    input: [expected_production_day_version]
    output: ProductionDay
    side_effects:
      - "freeze gross_sales_cents, markdown_loss_cents, waste_cost_cents, expected_full_value_cents, reconciliation_variance_cents (reconcile_day calc)"
      - "status -> RECONCILED"
      - "increments ProductionDay.version by 1"

  # --- BakeBatch (under day) ---
  - method: POST
    path: "/production-days/{id}/bake-batches"
    description: "Plan a par-bake batch for a product on this day"
    roles: [BakeManager]
    code: 201
    input: [product_id, par_qty]
    output: BakeBatch
    side_effects: ["status=PLANNED; baked_qty=0"]

  - method: GET
    path: "/production-days/{id}/bake-batches"
    description: "List batches for the day (reverse-reachability for BakeBatch.production_day_id)"
    roles: [ShopAdmin, Cashier, BakeManager]
    code: 200
    input: ["product_id?", "limit?", "offset?"]
    output: "BakeBatch[]"
    side_effects: []

  - method: GET
    path: "/production-days/{id}/bake-batches/{batchId}"
    description: "Get a batch"
    roles: [ShopAdmin, Cashier, BakeManager]
    code: 200
    input: []
    output: BakeBatch
    side_effects: []

  - method: POST
    path: "/production-days/{id}/bake-batches/{batchId}/bake"
    description: "Mark a batch BAKED with actual quantity"
    roles: [BakeManager]
    code: 200
    input: [baked_qty]
    output: BakeBatch
    side_effects: ["status -> BAKED; remaining_qty=baked_qty"]

  - method: POST
    path: "/production-days/{id}/bake-batches/{batchId}/markdown"
    description: "Mark remaining stock down (BAKED -> MARKED_DOWN)"
    roles: [Cashier]
    code: 200
    input: []
    output: BakeBatch
    side_effects: ["status -> MARKED_DOWN"]

  - method: POST
    path: "/production-days/{id}/bake-batches/{batchId}/sweep"
    description: "Throw away remaining stock (BAKED/MARKED_DOWN -> SWEPT); freezes wasted_qty"
    roles: [BakeManager]
    code: 200
    input: []
    output: BakeBatch
    side_effects: ["status -> SWEPT; wasted_qty frozen = remaining_qty; contributes to day waste pool"]

  # --- RetailOrder (under day) ---
  - method: POST
    path: "/production-days/{id}/retail-orders"
    description: "Open a retail POS cart for this day"
    roles: [Cashier]
    code: 201
    input: [line_items, "loyalty_account_id?", "redeem_reward?"]
    output: RetailOrder
    side_effects: ["status=CART; subtotal_cents computed from line_items"]

  - method: GET
    path: "/production-days/{id}/retail-orders"
    description: "List retail orders for the day (reverse-reachability for RetailOrder.production_day_id)"
    roles: [ShopAdmin, Cashier]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RetailOrder[]"
    side_effects: []

  - method: GET
    path: "/production-days/{id}/retail-orders/{orderId}"
    description: "Get a retail order"
    roles: [ShopAdmin, Cashier]
    code: 200
    input: []
    output: RetailOrder
    side_effects: []

  - method: POST
    path: "/production-days/{id}/retail-orders/{orderId}/pay"
    description: "Pay a cart (CART -> PAID); decrements batch stock, accrues loyalty, redeems reward"
    roles: [Cashier]
    code: 200
    input: []
    output: RetailOrder
    side_effects:
      - "status -> PAID; total_cents finalized"
      - "cascade: BakeBatch sold_qty/remaining_qty (and markdown_sold_qty) updated"
      - "cascade: LoyaltyAccount punch_count/reward_balance_cents updated (loyalty_punch calc)"

  - method: POST
    path: "/production-days/{id}/retail-orders/{orderId}/void"
    description: "Void a paid order same-day (PAID -> VOIDED); compensates stock + loyalty"
    roles: [Cashier]
    code: 200
    input: []
    output: RetailOrder
    side_effects:
      - "status -> VOIDED"
      - "cascade: restore BakeBatch stock; reverse loyalty punches/reward"

  - method: POST
    path: "/production-days/{id}/retail-orders/{orderId}/refund"
    description: "Refund a paid order (PAID -> REFUNDED); compensates stock + loyalty"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: RetailOrder
    side_effects:
      - "status -> REFUNDED"
      - "cascade: restore BakeBatch stock; reverse loyalty punches/reward"

  # --- LoyaltyAccount ---
  - method: POST
    path: "/loyalty-accounts"
    description: "Register a loyalty member"
    roles: [Cashier, ShopAdmin]
    code: 201
    input: [phone, name]
    output: LoyaltyAccount
    side_effects: ["punch_count=0; reward_balance_cents=0"]

  - method: GET
    path: "/loyalty-accounts/{id}"
    description: "Get a loyalty member"
    roles: [Cashier, ShopAdmin]
    code: 200
    input: []
    output: LoyaltyAccount
    side_effects: []

  - method: GET
    path: "/loyalty-accounts/{id}/retail-orders"
    description: "List retail orders linked to a loyalty member (reverse-reachability for RetailOrder.loyalty_account_id)"
    roles: [Cashier, ShopAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "RetailOrder[]"
    side_effects: []

  # --- WholesaleAccount ---
  - method: POST
    path: "/wholesale-accounts"
    description: "Create a wholesale account with discount and credit limit"
    roles: [ShopAdmin]
    code: 201
    input: [name, discount_pct, credit_limit_cents]
    output: WholesaleAccount
    side_effects: ["status=ACTIVE; outstanding_balance_cents=0"]

  - method: GET
    path: "/wholesale-accounts/{id}"
    description: "Get a wholesale account with outstanding balance"
    roles: [ShopAdmin, RouteDriver, WholesaleClient]
    code: 200
    input: []
    output: WholesaleAccount
    side_effects: []

  - method: GET
    path: "/wholesale-accounts/{id}/wholesale-deliveries"
    description: "List deliveries for an account across days (reverse-reachability for WholesaleDelivery.wholesale_account_id)"
    roles: [ShopAdmin, RouteDriver, WholesaleClient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "WholesaleDelivery[]"
    side_effects: []

  - method: POST
    path: "/wholesale-accounts/{id}/suspend"
    description: "Suspend a wholesale account (ACTIVE -> SUSPENDED)"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: WholesaleAccount
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/wholesale-accounts/{id}/reactivate"
    description: "Reactivate a wholesale account (SUSPENDED -> ACTIVE)"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: WholesaleAccount
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/wholesale-accounts/{id}/payments"
    description: "Record a payment against the account; reduces outstanding_balance_cents"
    roles: [ShopAdmin]
    code: 201
    input: [amount_cents]
    output: WholesaleAccount
    side_effects: ["cascade: outstanding_balance_cents decreased (wholesale_outstanding_balance calc)"]

  # --- StandingOrder ---
  - method: POST
    path: "/standing-orders"
    description: "Create a recurring route standing order for an account"
    roles: [ShopAdmin, WholesaleClient]
    code: 201
    input: [wholesale_account_id, delivery_dow, line_items]
    output: StandingOrder
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/standing-orders"
    description: "List standing orders (reverse-reachability for StandingOrder.wholesale_account_id)"
    roles: [ShopAdmin, RouteDriver, WholesaleClient]
    code: 200
    input: ["wholesale_account_id?", "status?", "limit?", "offset?"]
    output: "StandingOrder[]"
    side_effects: []

  - method: GET
    path: "/standing-orders/{id}"
    description: "Get a standing order"
    roles: [ShopAdmin, RouteDriver, WholesaleClient]
    code: 200
    input: []
    output: StandingOrder
    side_effects: []

  - method: GET
    path: "/standing-orders/{id}/wholesale-deliveries"
    description: "List deliveries realized from a standing order (reverse-reachability for WholesaleDelivery.standing_order_id)"
    roles: [ShopAdmin, RouteDriver, WholesaleClient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "WholesaleDelivery[]"
    side_effects: []

  - method: POST
    path: "/standing-orders/{id}/pause"
    description: "Pause a standing order (ACTIVE -> PAUSED)"
    roles: [ShopAdmin, WholesaleClient]
    code: 200
    input: []
    output: StandingOrder
    side_effects: ["status -> PAUSED"]

  - method: POST
    path: "/standing-orders/{id}/resume"
    description: "Resume a standing order (PAUSED -> ACTIVE)"
    roles: [ShopAdmin, WholesaleClient]
    code: 200
    input: []
    output: StandingOrder
    side_effects: ["status -> ACTIVE"]

  # --- WholesaleDelivery (under day) ---
  - method: POST
    path: "/production-days/{id}/wholesale-deliveries"
    description: "Release/schedule a delivery for an ACTIVE standing order onto this day (before cutoff). amount_cents computed."
    roles: [ShopAdmin, RouteDriver]
    code: 201
    input: [standing_order_id, route_window_start, route_window_end]
    output: WholesaleDelivery
    side_effects:
      - "Precondition: day not in CUTOFF/RECONCILED and clock <= delivery_cutoff_utc (ERR_PAST_DELIVERY_CUTOFF)"
      - "Precondition: standing order is ACTIVE (ERR_STANDING_ORDER_NOT_ACTIVE)"
      - "Precondition: owning WholesaleAccount is ACTIVE (ERR_ACCOUNT_SUSPENDED)"
      - "Precondition: route window does not collide (with buffer) with another non-terminal delivery for the same account on this day (ERR_ROUTE_WINDOW_CONFLICT)"
      - "status=SCHEDULED; wholesale_account_id copied from standing order"
      - "amount_cents computed (wholesale_delivery_amount calc) from standing-order lines + account discount"

  - method: GET
    path: "/production-days/{id}/wholesale-deliveries"
    description: "List deliveries for the day (reverse-reachability for WholesaleDelivery.production_day_id and standing_order_id and wholesale_account_id)"
    roles: [ShopAdmin, RouteDriver, WholesaleClient]
    code: 200
    input: ["standing_order_id?", "wholesale_account_id?", "status?", "limit?", "offset?"]
    output: "WholesaleDelivery[]"
    side_effects: []

  - method: GET
    path: "/production-days/{id}/wholesale-deliveries/{deliveryId}"
    description: "Get a delivery"
    roles: [ShopAdmin, RouteDriver, WholesaleClient]
    code: 200
    input: []
    output: WholesaleDelivery
    side_effects: []

  - method: POST
    path: "/production-days/{id}/wholesale-deliveries/{deliveryId}/pick"
    description: "Driver picks up the delivery (SCHEDULED -> PICKED)"
    roles: [RouteDriver]
    code: 200
    input: []
    output: WholesaleDelivery
    side_effects: ["status -> PICKED"]

  - method: POST
    path: "/production-days/{id}/wholesale-deliveries/{deliveryId}/deliver"
    description: "Driver completes the route stop (PICKED -> DELIVERED)"
    roles: [RouteDriver]
    code: 200
    input: []
    output: WholesaleDelivery
    side_effects: ["status -> DELIVERED"]

  - method: POST
    path: "/production-days/{id}/wholesale-deliveries/{deliveryId}/invoice"
    description: "Invoice a delivered order (DELIVERED -> INVOICED); credit-checked; bumps account outstanding balance"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: WholesaleDelivery
    side_effects:
      - "status -> INVOICED"
      - "cascade: WholesaleAccount.outstanding_balance_cents += amount_cents (wholesale_outstanding_balance calc)"

  - method: POST
    path: "/production-days/{id}/wholesale-deliveries/{deliveryId}/cancel"
    description: "Cancel a delivery (SCHEDULED/PICKED -> CANCELLED)"
    roles: [RouteDriver]
    code: 200
    input: []
    output: WholesaleDelivery
    side_effects: ["status -> CANCELLED"]

  # --- PreOrder ---
  - method: POST
    path: "/pre-orders"
    description: "Create a holiday/event/catering pre-order; computes subtotal and deposit_due"
    roles: [ShopAdmin, WholesaleClient]
    code: 201
    input: [wholesale_account_id, pickup_production_day_id, pickup_window_start, pickup_window_end, line_items]
    output: PreOrder
    side_effects:
      - "Precondition: adding this pickup window must not push concurrent (overlapping) non-CANCELLED PreOrders on the pickup day above CATERING_SLOT_CAPACITY (ERR_CATERING_SLOT_FULL)"
      - "status=REQUESTED; subtotal_cents + deposit_due_cents computed (preorder_deposit calc); deposit_paid_cents=0"

  - method: GET
    path: "/pre-orders"
    description: "List pre-orders (reverse-reachability for PreOrder.wholesale_account_id and pickup_production_day_id)"
    roles: [ShopAdmin, WholesaleClient]
    code: 200
    input: ["wholesale_account_id?", "pickup_production_day_id?", "status?", "limit?", "offset?"]
    output: "PreOrder[]"
    side_effects: []

  - method: GET
    path: "/pre-orders/{preOrderId}"
    description: "Get a pre-order"
    roles: [ShopAdmin, WholesaleClient]
    code: 200
    input: []
    output: PreOrder
    side_effects: []

  - method: POST
    path: "/pre-orders/{preOrderId}/deposit"
    description: "Record a deposit payment toward a pre-order"
    roles: [ShopAdmin, WholesaleClient]
    code: 200
    input: [amount_cents]
    output: PreOrder
    side_effects: ["deposit_paid_cents increased"]

  - method: POST
    path: "/pre-orders/{preOrderId}/confirm"
    description: "Confirm a pre-order (REQUESTED -> CONFIRMED); requires deposit met"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: PreOrder
    side_effects: ["status -> CONFIRMED"]

  - method: POST
    path: "/pre-orders/{preOrderId}/fulfill"
    description: "Fulfill a confirmed pre-order on its pickup day (CONFIRMED -> FULFILLED)"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: PreOrder
    side_effects: ["status -> FULFILLED"]

  - method: POST
    path: "/pre-orders/{preOrderId}/cancel"
    description: "Cancel a pre-order (REQUESTED/CONFIRMED -> CANCELLED)"
    roles: [ShopAdmin, WholesaleClient]
    code: 200
    input: []
    output: PreOrder
    side_effects: ["status -> CANCELLED"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (for delivery-cutoff tests). Server startup default is 2026-03-01T00:00:00Z; before any set, the clock reads exactly this default, never real wall-clock."
    roles: [ShopAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource (day, batch, order, product, account, standing order, delivery, pre-order, loyalty) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, qty < 1, empty line_items, negative amount" }
  - { id: ERR_DAY_INVALID_STATE, http: 409, condition: "ProductionDay not in the required status for the operation" }
  - { id: ERR_NO_BATCHES, http: 409, condition: "start-baking requires at least one BakeBatch on the day" }
  - { id: ERR_UNBAKED_BATCHES, http: 409, condition: "open-sales requires no BakeBatch still PLANNED" }
  - { id: ERR_BATCH_INVALID_STATE, http: 409, condition: "BakeBatch not in the required status for bake/markdown/sweep" }
  - { id: ERR_INVALID_BAKE_QTY, http: 422, condition: "baked_qty must be >= 1 when baking" }
  - { id: ERR_NOTHING_TO_MARK_DOWN, http: 409, condition: "markdown requested but batch remaining_qty < 1" }
  - { id: ERR_ORDER_INVALID_STATE, http: 409, condition: "RetailOrder not in the required status for pay/void/refund" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "A full-price line exceeds its batch remaining_qty" }
  - { id: ERR_INSUFFICIENT_MARKDOWN_STOCK, http: 409, condition: "A marked_down line's batch is not MARKED_DOWN or lacks remaining_qty" }
  - { id: ERR_DELIVERY_INVALID_STATE, http: 409, condition: "WholesaleDelivery not in the required status for pick/deliver/invoice/cancel" }
  - { id: ERR_PAST_DELIVERY_CUTOFF, http: 409, condition: "Scheduling a delivery after the day's delivery_cutoff_utc or onto a CUTOFF/RECONCILED day" }
  - { id: ERR_ACCOUNT_SUSPENDED, http: 409, condition: "Wholesale account is SUSPENDED and cannot be invoiced / released" }
  - { id: ERR_ACCOUNT_INVALID_STATE, http: 409, condition: "WholesaleAccount not in the required status for suspend/reactivate" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Invoicing would push outstanding_balance_cents above credit_limit_cents" }
  - { id: ERR_PREORDER_INVALID_STATE, http: 409, condition: "PreOrder not in the required status for confirm/fulfill/cancel" }
  - { id: ERR_DEPOSIT_NOT_MET, http: 402, condition: "PreOrder confirm requires deposit_paid_cents >= deposit_due_cents" }
  - { id: ERR_BATCHES_NOT_SWEPT, http: 409, condition: "Reconcile requires every BakeBatch SWEPT" }
  - { id: ERR_DELIVERIES_OPEN, http: 409, condition: "Reconcile requires no SCHEDULED/PICKED/DELIVERED WholesaleDelivery on the day" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_production_day_version does not match current ProductionDay.version on reconcile" }
  - { id: ERR_STANDING_ORDER_NOT_ACTIVE, http: 409, condition: "Releasing a delivery requires the standing order to be ACTIVE" }
  - { id: ERR_ROUTE_WINDOW_CONFLICT, http: 409, condition: "Delivery route window collides (within 30-min buffer) with another non-terminal delivery for the same account on the day" }
  - { id: ERR_CATERING_SLOT_FULL, http: 409, condition: "Catering pickup window would exceed CATERING_SLOT_CAPACITY concurrent non-CANCELLED PreOrders on the pickup day" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "window_end not strictly after window_start (route or pickup window)" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: ShopAdmin
    description: "Operational superset: config (products, accounts), day lifecycle cutoff, refunds, invoicing, pre-order confirm/fulfill"
    identity: opaque
    exclusive_operations:
      - "POST /products — create product"
      - "POST /production-days — open day"
      - "POST /production-days/{id}/close-cutoff — close cutoff"
      - "POST /production-days/{id}/retail-orders/{orderId}/refund — refund"
      - "POST /production-days/{id}/wholesale-deliveries/{deliveryId}/invoice — invoice"
      - "POST /wholesale-accounts — create account"
      - "POST /wholesale-accounts/{id}/suspend — suspend"
      - "POST /wholesale-accounts/{id}/reactivate — reactivate"
      - "POST /wholesale-accounts/{id}/payments — record payment"
      - "POST /pre-orders/{preOrderId}/confirm — confirm pre-order"
      - "POST /pre-orders/{preOrderId}/fulfill — fulfill pre-order"
    shared_operations:
      - "POST /loyalty-accounts (with Cashier)"
      - "POST /standing-orders, pause, resume (with WholesaleClient)"
      - "POST /pre-orders, deposit, cancel (with WholesaleClient)"
      - "POST /production-days/{id}/wholesale-deliveries (release, with RouteDriver)"
      - "all GET reads"

  - name: BakeManager
    description: "Owns production: bake batches, day baking/sales/reconcile lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /production-days/{id}/start-baking"
      - "POST /production-days/{id}/open-sales"
      - "POST /production-days/{id}/reconcile"
      - "POST /production-days/{id}/bake-batches — plan batch"
      - "POST /production-days/{id}/bake-batches/{batchId}/bake"
      - "POST /production-days/{id}/bake-batches/{batchId}/sweep"
    shared_operations:
      - "all GET reads"

  - name: Cashier
    description: "Owns retail POS: carts, pay, void, markdown, loyalty registration"
    identity: opaque
    exclusive_operations:
      - "POST /production-days/{id}/retail-orders — open cart"
      - "POST /production-days/{id}/retail-orders/{orderId}/pay"
      - "POST /production-days/{id}/retail-orders/{orderId}/void"
      - "POST /production-days/{id}/bake-batches/{batchId}/markdown"
    shared_operations:
      - "POST /loyalty-accounts (with ShopAdmin)"
      - "GET products, days, batches, orders, loyalty"

  - name: RouteDriver
    description: "Owns wholesale route execution: pick, deliver, cancel, and may release deliveries"
    identity: opaque
    exclusive_operations:
      - "POST /production-days/{id}/wholesale-deliveries/{deliveryId}/pick"
      - "POST /production-days/{id}/wholesale-deliveries/{deliveryId}/deliver"
      - "POST /production-days/{id}/wholesale-deliveries/{deliveryId}/cancel"
    shared_operations:
      - "POST /production-days/{id}/wholesale-deliveries (release, with ShopAdmin)"
      - "GET products, days, accounts, standing-orders, deliveries"

  - name: WholesaleClient
    description: "Acts on its own wholesale account: standing orders, pre-orders, deposits"
    identity: "entity_backed:WholesaleAccount"
    exclusive_operations: []
    shared_operations:
      - "POST /standing-orders, pause, resume (with ShopAdmin) — for own account"
      - "POST /pre-orders, deposit, cancel (with ShopAdmin) — for own account"
      - "GET products, days, own account, own standing-orders, own deliveries, own pre-orders"
