              payload: { policy_id: "${pol_id}", entry_type: "EARNED_ADJUSTMENT" }
              as: AgencyAdmin
              captures: { adj: "$.data[0].amount_cents" }
            - call: "GET /agency/producers/${w_id}"
              payload: {}
              as: AgencyAdmin
              captures: { w_status: "$.data.status" }
