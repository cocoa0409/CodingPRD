              payload: {}
              as: HRRecruiter
              as_user_id: ""
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 400 with error_id ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER — not 404, because priority 1 auth runs first"

