  # ===========================================================================
  - section: consistency_model
    instances:
      - name: consistency_withdrawal_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/programs/referrals/{id}/withdraw
          - entities.Enrollment.fields.status
        distinguishing_aspect: "The consistency model is immediate, so every cascaded write of a withdrawal is observable in the responses of reads issued straight afterwards with no delay and no re-read loop."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; open ALL-INT-001; one ENROLLED family with a scheduled occupancy and an active pledge."
          setup_api_calls:
              - call: "POST /_clock/set_current_utc"
                payload: { current_utc: "2026-09-01T00:00:00Z" }
                as: PlatformAdmin
              - call: "POST /programs/research-funds"
                payload: { fund_code: "SJ-FY26", fiscal_year: 2026, fundraising_raised_cents: 400000000, research_allocation_pct: 0.4, federal_grant_cents: 80000000 }
                as: PlatformAdmin
                captures: { fund_id: $.data.id }
              - call: "POST /programs/clinical-protocols"
                payload: { fund_id: "${fund_id}", protocol_code: "ALL-INT-001", disease_group: "ALL", age_min_years: 5, age_max_years: 17, required_stage: "NEWLY_DIAGNOSED", protocol_budget_cents: 10000000, capacity: 8 }
                as: ProtocolCoordinator
                captures: { protocol_id: $.data.id }
              - call: "POST /programs/clinical-protocols/${protocol_id}/open"
                payload: {}
                as: ProtocolCoordinator
                captures: { protocol_v0: $.data.version }
              - call: "POST /programs/housing-facilities"
                payload: { facility_code: "ONC-01", name: "Campus Residence", tier: "ON_CAMPUS", total_beds: 4, buffer_beds: 0 }
                as: HousingCoordinator
                captures: { fac_id: $.data.id }
              - call: "POST /programs/referrals"
                payload: { protocol_id: "${protocol_id}", child_name: "Ava Reyes", child_date_of_birth: "2015-04-01T00:00:00Z", disease_group: "ALL", disease_stage: "NEWLY_DIAGNOSED", household_state_code: "TN", traveling_family_member_count: 3, expected_treatment_days: 245, is_immunosuppressed: true, insurance_coverage_cents: 4000000 }
                as: IntakeCoordinator
                captures: { ref_id: $.data.id }
              - call: "POST /programs/referrals/${ref_id}/screen"
                payload: { expected_protocol_version: "${protocol_v0}" }
                as: IntakeCoordinator
                captures: { ref_v: $.data.version }
              - call: "POST /programs/referrals/${ref_id}/arrive"
                payload: { expected_referral_version: "${ref_v}" }
                as: IntakeCoordinator
                captures: { enr_id: $.data.enrollment_id }
              - call: "POST /programs/housing-assignments"
                payload: { enrollment_id: "${enr_id}", start_at: "2026-09-01T00:00:00Z", end_at: "2026-09-02T00:00:00Z", buffer_window_days: 1 }
                as: HousingCoordinator
                captures: { ha_id: $.data.id }
              - call: "POST /programs/enrollments/${enr_id}/sign-consent"
                payload: { consent_signer: "GUARDIAN_AND_CHILD", guardian_consent_signature_code: "GC-1001", child_assent_signature_code: "CA-1001" }
                as: IntakeCoordinator
                captures: { enr_v: $.data.version }
              - call: "POST /programs/family-support-pledges"
                payload: { enrollment_id: "${enr_id}", patient_support_budget_cents: 400000 }
                as: PatientSupportOfficer
                captures: { pledge_id: $.data.id }
          trigger:
              - call: "POST /programs/referrals/${ref_id}/withdraw"
                payload: { withdrawal_reason: "FAMILY_RELOCATION" }
                as: IntakeCoordinator
              - call: "GET /programs/enrollments/${enr_id}"
                payload: {}
                as: Any
              - call: "GET /programs/housing-assignments/${ha_id}"
                payload: {}
                as: Any
              - call: "GET /programs/family-support-pledges/${pledge_id}"
                payload: {}
                as: Any
          assert:
            - "the withdraw response already reflects Referral.${ref_id}.status == WITHDRAWN"
            - "the immediate enrolment read returns status WITHDRAWN"
            - "the immediate assignment read returns status CANCELLED"
            - "the immediate pledge read returns status VOIDED"
            - "no read needed a delay or a second attempt, so the writes are atomic in the one request"

      - name: excluded_saturation_flag_flip
        claim_type: Violation → Error
        grounds:
          - errors.ERR_PROTOCOL_BUDGET_EXHAUSTED
        excluded_because:
