scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_venue_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Venue, endpoints]
        distinguishing_aspect: "POST /valet/venues with name+address returns 201 and server-minted id, created_at, version=1; currency defaults to USD."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /valet/venues"
              payload: { name: "V1", address: "1 St" }
              as: Supervisor
              captures: { venue_id: $.data.id, ver: $.data.version, cur: $.data.currency }
          assert:
            - "response.http_status == 201"
            - "Venue.${venue_id}.version == 1"
            - "Venue.${venue_id}.currency == USD"

      - name: event_default_rate_fields_applied
        claim_type: Defaults
        grounds: [entities.Event.fields.free_grace_minutes, entities.Event.fields.hourly_rate_cents, entities.Event.fields.tip_split_mode]
        distinguishing_aspect: "Omitting rate fields yields free_grace_minutes=15, hourly_rate_cents=800, daily_max_cents=2500, event_surcharge_cents=500, tip_split_mode=EQUAL."
        test_recipe:
          setup: ["A venue exists."]
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "V1", address: "1 St" }
              as: Supervisor
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "E1", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z" }
              as: Supervisor
              captures: { event_id: $.data.id }
          assert:
            - "Event.${event_id}.free_grace_minutes == 15"
            - "Event.${event_id}.hourly_rate_cents == 800"
            - "Event.${event_id}.tip_split_mode == EQUAL"

      - name: ticket_computed_fields_ignore_client_input
        claim_type: Computed Fields
        grounds: [entities.Ticket.fields.quoted_fee_cents, entities.Ticket.fields.park_status, entities.Ticket.fields.settlement_status]
        distinguishing_aspect: "On check-in park_status is server-set PARKED and settlement_status UNSETTLED; quoted_fee_cents is computed (2100 for a 120-min estimate), regardless of any client-supplied values."
        test_recipe:
          setup: ["ACTIVE event, lot, attendant."]
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "V1", address: "1 St" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "E1", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/events/${event_id}/activate"
              payload: {}
              as: Supervisor
            - call: "POST /valet/lots"
              payload: { venue_id: "${venue_id}", name: "L1", capacity: 5 }
              as: Supervisor
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "Ana" }
              as: Supervisor
              captures: { a1_id: $.data.id }
          trigger:
            - call: "POST /valet/tickets"
              payload: { event_id: "${event_id}", lot_id: "${lot_id}", attendant_id: "${a1_id}", license_plate: "X1", key_tag: "K1", checkin_at: "2026-06-01T10:00:00Z", estimated_departure_at: "2026-06-01T12:00:00Z", expected_lot_version: "${lot_v}" }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { ticket_id: $.data.id }
          assert:
            - "Ticket.${ticket_id}.park_status == PARKED"
            - "Ticket.${ticket_id}.settlement_status == UNSETTLED"
            - "Ticket.${ticket_id}.quoted_fee_cents == 2100"

      - name: list_tickets_pagination_envelope
        claim_type: Listing
        grounds: [endpoints, entities.Ticket]
        distinguishing_aspect: "GET /valet/tickets?event_id=... returns a paginated array envelope with total_count and has_more."
        test_recipe:
          setup: ["ACTIVE event with one checked-in ticket."]
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "V1", address: "1 St" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "E1", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/events/${event_id}/activate"
              payload: {}
              as: Supervisor
            - call: "POST /valet/lots"
              payload: { venue_id: "${venue_id}", name: "L1", capacity: 5 }
              as: Supervisor
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "Ana" }
              as: Supervisor
              captures: { a1_id: $.data.id }
            - call: "POST /valet/tickets"
              payload: { event_id: "${event_id}", lot_id: "${lot_id}", attendant_id: "${a1_id}", license_plate: "X1", key_tag: "K1", checkin_at: "2026-06-01T10:00:00Z", estimated_departure_at: "2026-06-01T12:00:00Z", expected_lot_version: "${lot_v}" }
              as: Attendant
              as_user_id: "${a1_id}"
          trigger:
            - call: "GET /valet/tickets"
              payload: { event_id: "${event_id}", limit: 10, offset: 0 }
              as: Supervisor
          assert:
            - "response.response_type == array"
            - "response.meta contains total_count and has_more"
            - "total_count == 1"

  # =========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_event_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Event.SCHEDULED_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating an already-ACTIVE event returns ERR_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["An event already ACTIVE."]
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "V1", address: "1 St" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "E1", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/events/${event_id}/activate"
              payload: {}
              as: Supervisor
          trigger:
            - call: "POST /valet/events/${event_id}/activate"
              payload: {}
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: close_event_with_parked_ticket_returns_not_closable
        claim_type: Precondition Enforcement
        grounds: [state_machines.Event.ACTIVE_to_CLOSED, "errors[ERR_EVENT_NOT_CLOSABLE]"]
        distinguishing_aspect: "Closing an event while a ticket is still PARKED returns ERR_EVENT_NOT_CLOSABLE; the cross-entity precondition blocks the transition."
        test_recipe:
          setup: ["ACTIVE event with one PARKED ticket."]
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "V1", address: "1 St" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "E1", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/events/${event_id}/activate"
              payload: {}
              as: Supervisor
            - call: "POST /valet/lots"
              payload: { venue_id: "${venue_id}", name: "L1", capacity: 5 }
              as: Supervisor
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "Ana" }
              as: Supervisor
              captures: { a1_id: $.data.id }
            - call: "POST /valet/tickets"
              payload: { event_id: "${event_id}", lot_id: "${lot_id}", attendant_id: "${a1_id}", license_plate: "X1", key_tag: "K1", checkin_at: "2026-06-01T10:00:00Z", estimated_departure_at: "2026-06-01T12:00:00Z", expected_lot_version: "${lot_v}" }
              as: Attendant
              as_user_id: "${a1_id}"
          trigger:
            - call: "POST /valet/events/${event_id}/close"
              payload: {}
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EVENT_NOT_CLOSABLE"
            - "response.http_status == 409"

      - name: checkin_on_scheduled_event_returns_event_not_active
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=5]", "errors[ERR_EVENT_NOT_ACTIVE]"]
        distinguishing_aspect: "Check-in against a SCHEDULED (never activated) event returns ERR_EVENT_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["A SCHEDULED event, a lot, an attendant."]
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "V1", address: "1 St" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "E1", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/lots"
              payload: { venue_id: "${venue_id}", name: "L1", capacity: 5 }
              as: Supervisor
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "Ana" }
              as: Supervisor
              captures: { a1_id: $.data.id }
          trigger:
            - call: "POST /valet/tickets"
              payload: { event_id: "${event_id}", lot_id: "${lot_id}", attendant_id: "${a1_id}", license_plate: "X1", key_tag: "K1", checkin_at: "2026-06-01T10:00:00Z", estimated_departure_at: "2026-06-01T12:00:00Z", expected_lot_version: "${lot_v}" }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EVENT_NOT_ACTIVE"
            - "response.http_status == 409"

      - name: settle_claim_not_approved_returns_error
        claim_type: Invalid Transitions
        grounds: [state_machines.DamageClaim.APPROVED_to_SETTLED, "errors[ERR_CLAIM_NOT_APPROVED]"]
        distinguishing_aspect: "Settling an OPEN (not yet APPROVED) claim returns ERR_CLAIM_NOT_APPROVED (409)."
        test_recipe:
          setup: ["An OPEN damage claim on a checked-in ticket."]
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "V1", address: "1 St" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "E1", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/events/${event_id}/activate"
              payload: {}
              as: Supervisor
            - call: "POST /valet/lots"
              payload: { venue_id: "${venue_id}", name: "L1", capacity: 5 }
              as: Supervisor
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "Ana" }
              as: Supervisor
              captures: { a1_id: $.data.id }
            - call: "POST /valet/tickets"
              payload: { event_id: "${event_id}", lot_id: "${lot_id}", attendant_id: "${a1_id}", license_plate: "X1", key_tag: "K1", checkin_at: "2026-06-01T10:00:00Z", estimated_departure_at: "2026-06-01T12:00:00Z", expected_lot_version: "${lot_v}" }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /valet/damage-claims"
              payload: { ticket_id: "${ticket_id}", description: "ding", claimed_amount_cents: 300 }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /valet/damage-claims/${claim_id}/settle"
              payload: {}
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CLAIM_NOT_APPROVED"
            - "response.http_status == 409"

      - name: retrieval_stage_from_requested_returns_bad_state
        claim_type: Invalid Transitions
        grounds: [state_machines.RetrievalRequest.ASSIGNED_to_STAGING, "errors[ERR_RETRIEVAL_BAD_STATE]"]
        distinguishing_aspect: "Staging a retrieval still in REQUESTED (never ASSIGNED) returns ERR_RETRIEVAL_BAD_STATE (409)."
        test_recipe:
          setup: ["A REQUESTED retrieval on a parked ticket."]
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "V1", address: "1 St" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "E1", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/events/${event_id}/activate"
              payload: {}
              as: Supervisor
            - call: "POST /valet/lots"
              payload: { venue_id: "${venue_id}", name: "L1", capacity: 5 }
              as: Supervisor
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "Ana" }
              as: Supervisor
              captures: { a1_id: $.data.id }
            - call: "POST /valet/tickets"
              payload: { event_id: "${event_id}", lot_id: "${lot_id}", attendant_id: "${a1_id}", license_plate: "X1", key_tag: "K1", checkin_at: "2026-06-01T10:00:00Z", estimated_departure_at: "2026-06-01T12:00:00Z", expected_lot_version: "${lot_v}" }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /valet/retrieval-requests"
              payload: { ticket_id: "${ticket_id}", requested_at: "2026-06-01T11:00:00Z" }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { rr_id: $.data.id }
          trigger:
            - call: "POST /valet/retrieval-requests/${rr_id}/stage"
              payload: {}
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_RETRIEVAL_BAD_STATE"
            - "response.http_status == 409"

      - name: deny_claim_branch_no_ledger_change
        claim_type: Side Effect Execution
        grounds: [state_machines.DamageClaim.OPEN_to_DENIED, entities.Attendant.fields.total_liability_cents]
        distinguishing_aspect: "The DENIED branch leaves Attendant.total_liability_cents at 0 and Ticket.settlement_status UNSETTLED — divergent side-effect set from the APPROVED branch."
        test_recipe:
          setup: ["An OPEN claim on a checked-in ticket handled by a1."]
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "V1", address: "1 St" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "E1", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/events/${event_id}/activate"
              payload: {}
              as: Supervisor
            - call: "POST /valet/lots"
              payload: { venue_id: "${venue_id}", name: "L1", capacity: 5 }
              as: Supervisor
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "Ana" }
              as: Supervisor
              captures: { a1_id: $.data.id }
            - call: "POST /valet/tickets"
              payload: { event_id: "${event_id}", lot_id: "${lot_id}", attendant_id: "${a1_id}", license_plate: "X1", key_tag: "K1", checkin_at: "2026-06-01T10:00:00Z", estimated_departure_at: "2026-06-01T12:00:00Z", expected_lot_version: "${lot_v}" }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /valet/damage-claims"
              payload: { ticket_id: "${ticket_id}", attendant_id: "${a1_id}", description: "disputed", claimed_amount_cents: 9000 }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /valet/damage-claims/${claim_id}/deny"
              payload: {}
              as: Supervisor
          assert:
            - "DamageClaim.${claim_id}.status == DENIED"
            - "Attendant.${a1_id}.total_liability_cents == 0"
            - "Ticket.${ticket_id}.settlement_status == UNSETTLED"

  # =========================================================================
  - section: calculations
    instances:
      - name: reconciliation_expected_revenue_and_variance
        claim_type: Correct Result
        grounds: [calculations.reconciliation_variance, entities.ReconciliationReport.fields.expected_revenue_cents, entities.ReconciliationReport.fields.variance_cents]
        distinguishing_aspect: "For a CLOSED event with one SETTLED ticket (net 2900), expected_revenue_cents=2900 and finalizing with declared_cash 3000 yields variance_cents = 3000 - (2900 - 0) = 100."
        test_recipe:
          setup: ["Event with one ticket checked in 10:00 and out 12:30 (net 2900), event then CLOSED."]
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "V1", address: "1 St" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "E1", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/events/${event_id}/activate"
              payload: {}
              as: Supervisor
            - call: "POST /valet/lots"
              payload: { venue_id: "${venue_id}", name: "L1", capacity: 5 }
              as: Supervisor
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "Ana" }
              as: Supervisor
              captures: { a1_id: $.data.id }
            - call: "POST /valet/tickets"
              payload: { event_id: "${event_id}", lot_id: "${lot_id}", attendant_id: "${a1_id}", license_plate: "X1", key_tag: "K1", checkin_at: "2026-06-01T10:00:00Z", estimated_departure_at: "2026-06-01T12:00:00Z", expected_lot_version: "${lot_v}" }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /valet/tickets/${ticket_id}/checkout"
              payload: { checkout_at: "2026-06-01T12:30:00Z" }
              as: Cashier
            - call: "POST /valet/events/${event_id}/close"
              payload: {}
              as: Supervisor
            - call: "POST /valet/reconciliation-reports"
              payload: { event_id: "${event_id}" }
              as: Supervisor
              captures: { report_id: $.data.id, exp: $.data.expected_revenue_cents }
          trigger:
            - call: "POST /valet/reconciliation-reports/${report_id}/finalize"
              payload: { declared_cash_cents: 3000 }
              as: Supervisor
          assert:
            - "ReconciliationReport.${report_id}.expected_revenue_cents == 2900"
            - "ReconciliationReport.${report_id}.variance_cents == 100"

      - name: validation_percent_then_flat_order_sensitive
        claim_type: Correct Result
        grounds: [calculations.validation_net_charge, entities.ValidationGrant.fields.grant_type]
        distinguishing_aspect: "Applied in created_at order PERCENT(25) then FLAT(500) on final 2900: net = round_half_up(2900*0.75)=2175, then 2175-500 = 1675."
        test_recipe:
          setup: ["A checked-out ticket with final_fee 2900."]
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "V1", address: "1 St" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "E1", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/events/${event_id}/activate"
              payload: {}
              as: Supervisor
            - call: "POST /valet/lots"
              payload: { venue_id: "${venue_id}", name: "L1", capacity: 5 }
              as: Supervisor
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "Ana" }
              as: Supervisor
              captures: { a1_id: $.data.id }
            - call: "POST /valet/tickets"
              payload: { event_id: "${event_id}", lot_id: "${lot_id}", attendant_id: "${a1_id}", license_plate: "X1", key_tag: "K1", checkin_at: "2026-06-01T10:00:00Z", estimated_departure_at: "2026-06-01T12:00:00Z", expected_lot_version: "${lot_v}" }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /valet/tickets/${ticket_id}/checkout"
              payload: { checkout_at: "2026-06-01T12:30:00Z" }
              as: Cashier
            - call: "POST /valet/tickets/${ticket_id}/validations"
              payload: { grant_type: "PERCENT", value: 25 }
              as: Cashier
          trigger:
            - call: "POST /valet/tickets/${ticket_id}/validations"
              payload: { grant_type: "FLAT", value: 500 }
              as: Cashier
          assert:
            - "Ticket.${ticket_id}.net_charge_cents == 1675"

      - name: overflow_surcharge_added_to_final_fee
        claim_type: Correct Result
        grounds: [calculations.parking_fee, entities.Ticket.fields.in_overflow, entities.Event.fields.overflow_surcharge_cents]
        distinguishing_aspect: "An overflow ticket parked 60 min: metered min(800,2500)=800 + surcharge 500 + overflow 700 = 2000."
        test_recipe:
