# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Scaffold Corner Design for
# task_2955_developer_relations_application_programming_interface_program
#
# Breadth probe over the claim-extraction guide's nine sections, walked against this
# scaffold's own §1.1-§1.7 surface. §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) is the depth
# probe; every corner it already asserts appears here only as an `excluded_because:` stub
# citing that instance by name.
#
# Conventions shared by every test_recipe below:
#   * the logical clock starts at 2026-08-01T00:00:00Z (the mandatory startup default) and
#     is only ever moved forward with POST /_clock/set_current_utc.
#   * operator identities are stable opaque ids: adm-1 (PlatformAdmin), drm-1 / drm-2
#     (DevRelManager), tso-1 / tso-2 (TrustAndSafetyOfficer), psa-1 (PartnerSupportAgent),
#     anon-1 (Anonymous). Developer identities are the created Developer ids.
#   * "the canonical PARTNER chain" means the sequence used throughout §1.8:
#     clock -> product (Catalog API, PUBLIC, pool 20000 / 50000000, required_tos_version 1)
#     -> version 1.0.0 -> promote -> developer -> onboarding-acknowledgement (docs 2, tos 1)
#     -> [optional ecosystem-participation] -> access-application (PARTNER, catalog.read,
#     500000 calls) -> submit -> claim-review (drm-1) -> decide APPROVE (adm-1) -> GET product
#     for version -> POST /quota-assignments -> activate.
#     Two trust bands recur, and each recipe below states which one it uses:
#       - WITHOUT the ecosystem-participation call the developer's trust_score is 56
#         (50 base + 6 docs), the TRUST_MULTIPLIER band is 0.75, and a PARTNER assignment
#         gets sustained_rpm 2250, burst_rpm 6750, burst_credit_balance 67500;
#       - WITH a PROFESSIONAL certification (+15) trust_score is 71, the band is 1.00, and a
#         PARTNER assignment gets sustained_rpm 3000, burst_rpm 9000, credit balance 90000.
#     monthly_call_allowance is 500000 either way (min of request, PARTNER cap and pool).
#   * "the unknown id" is the literal 00000000-0000-4000-8000-000000000000, which no chain
#     in this design ever mints.

scaffold_corner_design:
  - section: entities
    instances:
      - name: developer_registration_returns_full_default_shape
        claim_type: Creation
        grounds:
          - entities.Developer
          - endpoints.POST /developers
          - response_envelope.success
        distinguishing_aspect: >-
          A bare registration with only the three input fields must come back 201 with every
          system and computed field at its declared default — standing GOOD_STANDING,
          onboarding_state REGISTERED, directory_state NOT_LISTED, certification_level NONE,
          both trust scores 50 — inside the fixed response envelope, with a prefix-free UUID id
          and version 1.
        test_recipe:
          setup:
            - "the database is empty and the logical clock reads the startup default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "POST /developers"
              payload: { org_name: "Northwind Labs", contact_email: "dev1@northwind.example", region_code: "EU" }
              as: Anonymous
              as_user_id: "anon-1"
              captures: { d1_id: $.data.id }
          assert:
            - "HTTP 201 with meta.api_request_id and meta.api_request_timestamp present and response_type == object"
            - "data.id is a bare UUID with no type prefix and data.version == 1"
            - "data.org_name == Northwind Labs, contact_email == dev1@northwind.example, region_code == EU"
            - "data.onboarding_state == REGISTERED, standing == GOOD_STANDING, directory_state == NOT_LISTED"
            - "data.certification_level == NONE, certification_expires_at == null, hackathon_award_count == 0"
            - "data.docs_version_acknowledged == null, tos_version_accepted == null, directory_summary == null"
            - "data.trust_score == 50, audited_trust_score == 50, violation_points == 0, clean_window_count == 0, throttled_window_count == 0, revoked_at == null"
            - "data.created_at == 2026-08-01T00:00:00.000Z and updated_at == created_at"

      - name: get_developer_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - endpoints.GET /developers/{id}
          - entities.Developer
        distinguishing_aspect: >-
          The single-resource read returns the same field values the creation response reported,
          with version still 1 because a read is not a mutation, and it is readable by an
          operator role that never touched the row.
        test_recipe:
          setup:
            - "one Developer exists, registered anonymously and never mutated"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /developers"
              payload: { org_name: "Northwind Labs", contact_email: "dev1@northwind.example", region_code: "EU" }
              as: Anonymous
              as_user_id: "anon-1"
              captures: { d1_id: $.data.id }
          trigger:
            - call: "GET /developers/${d1_id}"
              payload: {}
              as: TrustAndSafetyOfficer
              as_user_id: "tso-1"
          assert:
            - "HTTP 200 with response_type == object"
            - "data.id == ${d1_id} and data.version == 1"
            - "data.org_name == Northwind Labs and data.region_code == EU"
            - "data.standing == GOOD_STANDING and data.onboarding_state == REGISTERED"
            - "data.updated_at == 2026-08-01T00:00:00.000Z (the read changed nothing)"

      - name: developer_list_is_paginated_and_filterable
        claim_type: Listing
        grounds:
          - endpoints.GET /developers
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: >-
          The collection read reports total_count over the whole filtered set (3) rather than
          over the returned page (2) and sets has_more true only while a further page exists;
          an onboarding_state filter narrows total_count to 1 without changing the page size
          semantics.
        test_recipe:
          setup:
            - "three developers exist; exactly one of them has acknowledged docs 2 / terms 1 and is therefore DOCS_ACKNOWLEDGED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /api-products"
              payload: { name: "Catalog API", data_sensitivity: "PUBLIC", scope_catalog: [{ scope: "catalog.read", sensitivity: "PUBLIC" }], sample_app_slugs: ["quickstart-node"], sustained_rpm_pool: 20000, monthly_call_pool: 50000000, required_tos_version: 1 }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p1_id: $.data.id }
            - call: "POST /developers"
              payload: { org_name: "Northwind Labs", contact_email: "dev1@northwind.example", region_code: "EU" }
              as: DevRelManager
              as_user_id: "drm-1"
              captures: { d1_id: $.data.id }
            - call: "POST /developers"
              payload: { org_name: "Southgate Data", contact_email: "dev2@southgate.example", region_code: "US" }
              as: DevRelManager
              as_user_id: "drm-1"
              captures: { d2_id: $.data.id }
            - call: "POST /developers"
              payload: { org_name: "Eastvale Tools", contact_email: "dev3@eastvale.example", region_code: "APAC" }
              as: DevRelManager
              as_user_id: "drm-1"
              captures: { d3_id: $.data.id }
            - call: "POST /developers/${d1_id}/onboarding-acknowledgement"
              payload: { docs_version: 2, tos_version: 1 }
              as: Developer
              as_user_id: "${d1_id}"
          trigger:
            - call: "GET /developers"
              payload: { limit: 2, offset: 0 }
              as: DevRelManager
              as_user_id: "drm-1"
            - call: "GET /developers"
              payload: { limit: 2, offset: 2 }
              as: DevRelManager
              as_user_id: "drm-1"
            - call: "GET /developers"
              payload: { onboarding_state: "DOCS_ACKNOWLEDGED" }
              as: DevRelManager
              as_user_id: "drm-1"
          assert:
            - "the first page: HTTP 200, response_type == array, len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "the second page: len(data) == 1, total_count == 3, has_more == false, offset == 2"
            - "the filtered read: len(data) == 1, total_count == 3 is NOT reported — total_count == 1 — and data[0].id == ${d1_id}"
            - "the filtered read defaults apply: limit == 10 and offset == 0"

      - name: get_unknown_quota_assignment_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET /quota-assignments/{id}
          - validations.priority_6_path_id_existence
          - errors.ERR_QUOTA_ASSIGNMENT_NOT_FOUND
        distinguishing_aspect: >-
          A well-formed but unminted UUID in the path must produce the entity-specific 404
          (ERR_QUOTA_ASSIGNMENT_NOT_FOUND, not a generic ERR_INVALID_REQUEST or a bare 500),
          and the error body must use the declared error envelope shape.
        test_recipe:
          setup:
            - "no QuotaAssignment has ever been created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "GET /quota-assignments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
          assert:
            - "HTTP 404 with response_type == error and data.error_id == ERR_QUOTA_ASSIGNMENT_NOT_FOUND"
            - "data.message is a non-empty string and meta.api_request_id is present"

      - name: create_api_product_without_monthly_call_pool_rejected
        claim_type: Required Fields
        grounds:
          - endpoints.POST /api-products
          - validations.priority_5_invalid_request
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: >-
          monthly_call_pool has source input with no default, so omitting it is a 400
          ERR_INVALID_REQUEST — distinct from omitting required_tos_version, which has a
          declared default of 1 and must succeed. The pair proves the required/defaulted split
          rather than blanket body validation.
        test_recipe:
          setup:
            - "no ApiProduct exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "POST /api-products"
              payload: { name: "Catalog API", data_sensitivity: "PUBLIC", scope_catalog: [{ scope: "catalog.read", sensitivity: "PUBLIC" }], sample_app_slugs: ["quickstart-node"], sustained_rpm_pool: 20000 }
              as: PlatformAdmin
              as_user_id: "adm-1"
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /api-products returns total_count == 0 (the rejected call persisted nothing)"

      - name: api_product_required_tos_version_defaults_to_one
        claim_type: Defaults
        grounds:
          - entities.ApiProduct.fields.required_tos_version
          - entities.ApiProduct.fields.demand_index
          - endpoints.POST /api-products
        distinguishing_aspect: >-
          Omitting the only defaulted input must yield required_tos_version 1, while the
          derived pool fields must read available == pool with allocated 0 and demand_index at
          the scale-correct 0.00 rather than integer 0 or null.
        test_recipe:
          setup:
            - "no ApiProduct exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "POST /api-products"
              payload: { name: "Catalog API", data_sensitivity: "PUBLIC", scope_catalog: [{ scope: "catalog.read", sensitivity: "PUBLIC" }], sample_app_slugs: ["quickstart-node"], sustained_rpm_pool: 20000, monthly_call_pool: 50000000 }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p1_id: $.data.id }
          assert:
            - "HTTP 201 with data.required_tos_version == 1"
            - "data.allocated_sustained_rpm == 0 and data.available_sustained_rpm == 20000"
            - "data.allocated_monthly_calls == 0 and data.available_monthly_calls == 50000000"
            - "data.demand_index == 0.00 and data.version == 1"

      - name: assignment_computed_fields_derive_from_calculation_not_from_request
        claim_type: Computed Fields
        grounds:
          - calculations.quota_provisioning
          - entities.QuotaAssignment.fields.monthly_call_allowance
          - entities.QuotaAssignment.fields.trust_multiplier_applied
          - endpoints.POST /quota-assignments
        distinguishing_aspect: >-
          The provisioning body carries only access_application_id and the OCC version, so
          every quota figure must come from the calculation: an uncertified STANDARD developer
          (trust 56, multiplier 0.75) asking for 5000000 calls receives the tier cap 1000000
          and sustained 450 / burst 900 / credit 9000 — none of which appear anywhere in the
          request.
        test_recipe:
          setup:
            - "ApiProduct P1 has pools 20000 / 50000000 and one GENERAL_AVAILABILITY version"
            - "Developer D3 acknowledged docs 2 / terms 1 and holds no certification, so trust_score is 56"
            - "D3's STANDARD application for 5000000 monthly calls is APPROVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /api-products"
              payload: { name: "Catalog API", data_sensitivity: "PUBLIC", scope_catalog: [{ scope: "catalog.read", sensitivity: "PUBLIC" }], sample_app_slugs: ["quickstart-node"], sustained_rpm_pool: 20000, monthly_call_pool: 50000000, required_tos_version: 1 }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p1_id: $.data.id }
            - call: "POST /api-products/${p1_id}/versions"
              payload: { semver: "1.0.0", breaking_change: false }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /api-versions/${v1_id}/promote"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /developers"
              payload: { org_name: "Eastvale Tools", contact_email: "dev3@eastvale.example", region_code: "APAC" }
              as: DevRelManager
              as_user_id: "drm-1"
              captures: { d3_id: $.data.id }
            - call: "POST /developers/${d3_id}/onboarding-acknowledgement"
              payload: { docs_version: 2, tos_version: 1 }
              as: Developer
              as_user_id: "${d3_id}"
              captures: { d3_trust: $.data.trust_score }
            - call: "POST /access-applications"
              payload: { developer_id: "${d3_id}", target_api_version_id: "${v1_id}", requested_tier: "STANDARD", requested_scopes: ["catalog.read"], requested_monthly_calls: 5000000, justification_text: "We render a public storefront catalogue and need standard-tier throughput." }
              as: Developer
              as_user_id: "${d3_id}"
              captures: { app3_id: $.data.id }
            - call: "POST /access-applications/${app3_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${d3_id}"
            - call: "POST /access-applications/${app3_id}/claim-review"
              payload: {}
              as: DevRelManager
              as_user_id: "drm-1"
            - call: "POST /access-applications/${app3_id}/decide"
              payload: { decision: "APPROVE", approved_tier: "STANDARD", granted_scopes: ["catalog.read"] }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "GET /api-products/${p1_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p1_ver: $.data.version }
          trigger:
            - call: "POST /quota-assignments"
              payload: { access_application_id: "${app3_id}", expected_api_product_version: "${p1_ver}" }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { qa3_id: $.data.id }
          assert:
            - "Developer.${d3_id}.trust_score == 56"
            - "HTTP 201 with data.trust_multiplier_applied == 0.75"
            - "data.sustained_rpm == 450, burst_rpm == 900, burst_credit_balance == 9000"
            - "data.monthly_call_allowance == 1000000 (the STANDARD cap, not the requested 5000000)"
            - "data.tier == STANDARD, granted_scopes == [catalog.read], pinned_api_version_id == ${v1_id}"
            - "ApiProduct.${p1_id}.available_sustained_rpm == 19550 and available_monthly_calls == 49000000"

      - name: assignment_system_fields_and_state_defaults_are_server_minted
        claim_type: System Fields
        grounds:
          - entities.QuotaAssignment.fields.developer_id
          - entities.QuotaAssignment.fields.entitlement_state
          - entities.QuotaAssignment.fields.throttle_state
          - endpoints.POST /quota-assignments
        distinguishing_aspect: >-
          developer_id, tier and pinned_api_version_id are source system — they are copied from
          the named application rather than accepted from the caller — and the two state
          dimensions must start at PROVISIONED / NORMAL with activated_at, suspended_at and
          retired_at all null and version 1.
        test_recipe:
          setup:
            - "the canonical PARTNER chain has run as far as the APPROVED application (no assignment yet)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /api-products"
              payload: { name: "Catalog API", data_sensitivity: "PUBLIC", scope_catalog: [{ scope: "catalog.read", sensitivity: "PUBLIC" }], sample_app_slugs: ["quickstart-node"], sustained_rpm_pool: 20000, monthly_call_pool: 50000000, required_tos_version: 1 }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p1_id: $.data.id }
            - call: "POST /api-products/${p1_id}/versions"
              payload: { semver: "1.0.0", breaking_change: false }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /api-versions/${v1_id}/promote"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /developers"
              payload: { org_name: "Northwind Labs", contact_email: "dev1@northwind.example", region_code: "EU" }
              as: DevRelManager
              as_user_id: "drm-1"
              captures: { d1_id: $.data.id }
            - call: "POST /developers/${d1_id}/onboarding-acknowledgement"
              payload: { docs_version: 2, tos_version: 1 }
              as: Developer
              as_user_id: "${d1_id}"
            - call: "POST /access-applications"
              payload: { developer_id: "${d1_id}", target_api_version_id: "${v1_id}", requested_tier: "PARTNER", requested_scopes: ["catalog.read"], requested_monthly_calls: 500000, justification_text: "We operate a regulated settlement reconciliation product and require partner-tier sustained throughput for nightly batch windows across twelve markets, with burst headroom for month-end close." }
              as: Developer
              as_user_id: "${d1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /access-applications/${app1_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${d1_id}"
            - call: "POST /access-applications/${app1_id}/claim-review"
              payload: {}
              as: DevRelManager
              as_user_id: "drm-1"
            - call: "POST /access-applications/${app1_id}/decide"
              payload: { decision: "APPROVE", approved_tier: "PARTNER", granted_scopes: ["catalog.read"] }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "GET /api-products/${p1_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p1_ver: $.data.version }
          trigger:
            - call: "POST /quota-assignments"
              payload: { access_application_id: "${app1_id}", expected_api_product_version: "${p1_ver}" }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { qa1_id: $.data.id }
          assert:
            - "HTTP 201 with data.developer_id == ${d1_id} (copied from the application, never supplied)"
            - "data.entitlement_state == PROVISIONED and data.throttle_state == NORMAL"
            - "data.activated_at == null, suspended_at == null, suspension_reason == null, retired_at == null"
            - "data.bonus_call_credit == 0 and data.monthly_calls_consumed == 0"
            - "data.id is a bare UUID, data.version == 1, data.created_at == 2026-08-01T00:00:00.000Z"
            - "ApiProduct.${p1_id}.version == ${p1_ver} + 1 (provisioning bumps the OCC parent)"

      - name: enum_and_range_constraints_rejected_before_any_write
        claim_type: Type Constraints
        grounds:
          - entities.Developer.fields.region_code
          - entities.SandboxLease.fields.lease_days
          - validations.priority_5_invalid_request
          - response_envelope.pagination_defaults
        distinguishing_aspect: >-
          Three different constraint kinds collapse to the same 400 ERR_INVALID_REQUEST: an
          out-of-domain enum (region_code ANTARCTICA), an out-of-range integer (lease_days 31
          against the declared 1..30) and an out-of-range pagination limit (101 against the
          declared max 100) — and none of the three leaves a row behind.
        test_recipe:
          setup:
            - "ApiProduct P1 exists with the sample application slug quickstart-node"
            - "Developer D1 has acknowledged docs 2 / terms 1, so a lease is otherwise admissible"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /api-products"
              payload: { name: "Catalog API", data_sensitivity: "PUBLIC", scope_catalog: [{ scope: "catalog.read", sensitivity: "PUBLIC" }], sample_app_slugs: ["quickstart-node"], sustained_rpm_pool: 20000, monthly_call_pool: 50000000, required_tos_version: 1 }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p1_id: $.data.id }
            - call: "POST /developers"
              payload: { org_name: "Northwind Labs", contact_email: "dev1@northwind.example", region_code: "EU" }
              as: DevRelManager
              as_user_id: "drm-1"
              captures: { d1_id: $.data.id }
            - call: "POST /developers/${d1_id}/onboarding-acknowledgement"
              payload: { docs_version: 2, tos_version: 1 }
              as: Developer
              as_user_id: "${d1_id}"
          trigger:
            - call: "POST /developers"
              payload: { org_name: "Polar Systems", contact_email: "dev9@polar.example", region_code: "ANTARCTICA" }
              as: DevRelManager
              as_user_id: "drm-1"
            - call: "POST /sandbox-leases"
              payload: { developer_id: "${d1_id}", api_product_id: "${p1_id}", starts_at: "2026-08-01T00:00:00Z", lease_days: 31, sample_app_slug: "quickstart-node" }
              as: Developer
              as_user_id: "${d1_id}"
            - call: "GET /sandbox-leases"
              payload: { limit: 101 }
              as: DevRelManager
              as_user_id: "drm-1"
          assert:
            - "the bad enum -> 400 ERR_INVALID_REQUEST and GET /developers reports total_count == 1"
            - "the 31-day lease -> 400 ERR_INVALID_REQUEST"
            - "the limit 101 read -> 400 ERR_INVALID_REQUEST"
            - "GET /sandbox-leases?developer_id=${d1_id} returns total_count == 0"

      - name: usage_window_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.UsageWindow
          - endpoints.POST /quota-assignments/{id}/usage-windows
          - validations.priority_33_window_duplicate
          - errors.ERR_WINDOW_DUPLICATE
        distinguishing_aspect: >-
          UsageWindow declares common_fields false, so its rows carry only id and created_at —
          no version and no updated_at — and §1.5 offers no update or delete path for them. The
          only way to "change" a window is to resubmit its window_start, which is refused with
          409 ERR_WINDOW_DUPLICATE and leaves the stored counters untouched.
        test_recipe:
          setup:
            - "the canonical PARTNER chain has produced an ACTIVE entitlement with allowance 500000"
