  # §1.5 ENDPOINTS — shapes and semantics of the surface itself
  # ==========================================================================
  - section: endpoints
    instances:
      - name: catalog_status_action_returns_the_whole_program_and_moves_one_axis
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /provost/academic-programs/{id}/catalog-status]
          - state_machines.AcademicProgram.catalog_status.LISTED_to_MARKETING_SUPPRESSED
          - validations[priority=13]
        distinguishing_aspect: |
          The action endpoint is not a bare acknowledgement: it returns the whole
          AcademicProgram row, including the derived viability block, and it moves
          only the catalog axis. It also does NOT snapshot
          catalog_status_pre_decision — only the ratification cascade does that —
          and a repeat of the same target is refused because the catalog machine
          declares no self-loop.
        test_recipe:
          setup:
            - "One freshly registered program with no metric snapshots at all, so its derived viability block is the empty-data case."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "GEOG-BA", name: "Geography BA", degree_level: "UNDERGRADUATE", department_code: "GEOG" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /provost/academic-programs/${prog_id}/catalog-status"
              payload: { target_catalog_status: "MARKETING_SUPPRESSED", suppression_note: "Marketing paused pending the departmental review." }
              as: Registrar
            - call: "POST /provost/academic-programs/${prog_id}/catalog-status"
              payload: { target_catalog_status: "MARKETING_SUPPRESSED" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "the first trigger returns 200 and the body is a full AcademicProgram: id, code == GEOG-BA, degree_level, both state axes, every derived field and version — not a bare {ok: true}"
            - "catalog_status == MARKETING_SUPPRESSED while lifecycle_state is still ACTIVE — the action touches exactly one axis"
            - "catalog_status_pre_decision is still null: the manual registrar action does not stash a restore point, unlike the ratification cascade"
            - "version == ${v0} + 1 and updated_at is refreshed"
            - "the derived block reads snapshot_count == 0, composite_score == null, viability_band == INSUFFICIENT_DATA, cost_per_credit_hour_rolling_cents == null and cost_per_credit_hour_latest_cents == null"
            - "the second trigger returns 409 with data.error_id == ERR_CATALOG_TRANSITION_INVALID — the catalog machine declares no MARKETING_SUPPRESSED -> MARKETING_SUPPRESSED edge, so the action is not idempotent"
            - "after the refusal catalog_status is still MARKETING_SUPPRESSED and version is unchanged at ${v0} + 1"

      - name: one_compliance_sweep_marks_every_due_pending_notice_at_once
        claim_type: bulk_action
        grounds:
          - endpoints[POST /provost/compliance-sweeps]
          - calculations.agency_notice_deadline
          - state_machines.AgencyNotification.PENDING_to_OVERDUE
        distinguishing_aspect: |
          The sweep is a single unparameterised call that reaches every
          notification in the system and marks each one it should, reporting the
          count and the ids it touched. It is selective on three axes at once:
          only status PENDING is eligible (an already SENT notice is skipped even
          when overdue), only strictly past-due notices are marked, and a second
          sweep marks nothing because the first sweep left those rows OVERDUE.
        test_recipe:
          setup:
            - "Fixture A program HIST-BA carried to a RATIFIED DISCONTINUATION decision ratified at 2026-09-15T10:00:00Z, so the two AUTO_MINTED notices are due 2026-10-15T10:00:00Z (ACCREDITOR) and 2026-10-30T10:00:00Z (STATE_AGENCY)."
            - "Three further MANUAL notices are added on the same decision: a specialty ACCREDITOR one (due 2026-10-15T10:00:00Z, anchored on ratified_at, left PENDING), a second STATE_AGENCY one that is then SENT, and a FEDERAL one (due 2026-11-14T10:00:00Z, left PENDING)."
            - "The AUTO_MINTED ACCREDITOR notice is SENT and ACKNOWLEDGED; the AUTO_MINTED STATE_AGENCY notice is left PENDING. The clock is then moved to 2026-11-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026SP", term_index: 2, enrollment_headcount: 24, credit_hours: 240, direct_cost_cents: 11000000, completions_count: 3, market_demand_index: 40 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026FA", term_index: 3, enrollment_headcount: 20, credit_hours: 200, direct_cost_cents: 11000000, completions_count: 2, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id }
            - call: "POST /provost/review-cycles/${cycle_id}/self-studies"
              payload: { narrative: "History self-study", section_codes: ["S1"] }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "ACCEPT" }
              as: ReviewCoordinator
            - call: "POST /provost/external-reviewers"
              payload: { full_name: "Dr Nala Osei", institution: "Westmoor University", specialty_code: "HIST" }
              as: ReviewCoordinator
              captures: { rev_id: $.data.id }
            - call: "POST /provost/reviewer-visits"
              payload: { cycle_id: "${cycle_id}", reviewer_id: "${rev_id}", window_start_at: "2026-08-20T09:00:00Z", window_end_at: "2026-08-22T17:00:00Z" }
              as: ReviewCoordinator
              captures: { visit_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-23T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/reviewer-visits/${visit_id}/complete"
              payload: {}
              as: ReviewCoordinator
            - call: "POST /provost/reviewer-visits/${visit_id}/reports"
              payload: { recommendation: "DISCONTINUE", finding_codes: ["F-ENROLL"], narrative: "Enrolment is unsustainable." }
              as: ExternalReviewer
              as_user_id: "${rev_id}"
            - call: "POST /provost/review-cycles/${cycle_id}/program-response"
              payload: { response_concurrence: "CONCUR", response_text: "The department concurs." }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { cyc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T10:00:00Z" }
              as: Provost
            - call: "POST /provost/review-cycles/${cycle_id}/decision-records"
              payload: { outcome: "DISCONTINUATION", rationale: "Composite viability below the discontinuation band.", effective_term_index: 4, expected_cycle_version: "${cyc_v}" }
              as: Provost
              as_user_id: "provost-proposer"
              captures: { dec_id: $.data.id }
            - call: "POST /provost/decision-records/${dec_id}/transitions"
              payload: { action: "RATIFY", ratification_note: "Ratified at the September provost council." }
              as: Provost
              as_user_id: "provost-ratifier"
            - call: "GET /provost/decision-records/${dec_id}/agency-notifications"
              payload: { agency_type: "ACCREDITOR", limit: 10, offset: 0 }
              as: ReviewCoordinator
              captures: { n_acc_id: "$.data[0].id" }
            - call: "GET /provost/decision-records/${dec_id}/agency-notifications"
              payload: { agency_type: "STATE_AGENCY", limit: 10, offset: 0 }
              as: ReviewCoordinator
              captures: { n_state_id: "$.data[0].id" }
            - call: "POST /provost/decision-records/${dec_id}/agency-notifications"
              payload: { agency_type: "ACCREDITOR", agency_code: "SPECIALTY-ACC" }
              as: ReviewCoordinator
              captures: { n_manual_id: $.data.id }
            - call: "POST /provost/decision-records/${dec_id}/agency-notifications"
              payload: { agency_type: "STATE_AGENCY", agency_code: "STATE-CHE-2" }
              as: ReviewCoordinator
              captures: { n_sent_id: $.data.id }
            - call: "POST /provost/decision-records/${dec_id}/agency-notifications"
              payload: { agency_type: "FEDERAL", agency_code: "US-DOE" }
              as: ReviewCoordinator
              captures: { n_fed_id: $.data.id }
            - call: "POST /provost/agency-notifications/${n_acc_id}/transitions"
              payload: { action: "SEND", transmitted_reference: "ACC-TX-0001" }
              as: ReviewCoordinator
            - call: "POST /provost/agency-notifications/${n_acc_id}/transitions"
              payload: { action: "ACKNOWLEDGE" }
              as: ReviewCoordinator
            - call: "POST /provost/agency-notifications/${n_sent_id}/transitions"
              payload: { action: "SEND", transmitted_reference: "STA-TX-0002" }
              as: ReviewCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: ReviewCoordinator
          trigger:
            - call: "POST /provost/compliance-sweeps"
              payload: {}
              as: ReviewCoordinator
            - call: "POST /provost/compliance-sweeps"
              payload: {}
              as: ReviewCoordinator
            - call: "GET /provost/decision-records/${dec_id}"
              payload: {}
              as: ReviewCoordinator
          assert:
            - "the first sweep returns 200 with swept_at == 2026-11-01T00:00:00Z and marked_overdue_count == 2 — one call marks every eligible row, there is no per-notification endpoint for this"
            - "marked_overdue_notification_ids contains exactly ${n_state_id} and ${n_manual_id} (order unspecified): the two notices that are both PENDING and strictly past due"
            - "AgencyNotification.${n_manual_id}.status == OVERDUE with overdue_marked_at == 2026-11-01T00:00:00Z and due_at == 2026-10-15T10:00:00Z — a MANUAL notice on a ratified decision anchors on ratified_at, not on its own creation instant"
            - "AgencyNotification.${n_state_id}.status == OVERDUE with due_at == 2026-10-30T10:00:00Z"
            - "AgencyNotification.${n_sent_id} is skipped even though its due_at 2026-10-30T10:00:00Z is past: the sweep only reaches PENDING rows, so it stays SENT with overdue_marked_at == null"
            - "AgencyNotification.${n_acc_id} is skipped as ACKNOWLEDGED, and AgencyNotification.${n_fed_id} is skipped as not yet due (due_at == 2026-11-14T10:00:00Z, status still PENDING)"
            - "the second sweep returns 200 with marked_overdue_count == 0 and marked_overdue_notification_ids == [] — the rows it marked are no longer PENDING, so a repeated sweep is a no-op rather than a re-mark"
            - "the GET shows notification_count == 5 and unacknowledged_notification_count == 4 (PENDING + SENT + the two OVERDUE) both before and after the sweeps, and DecisionRecord.${dec_id}.state is still RATIFIED — a sweep never advances a decision"
            - "ReviewCycle.${cycle_id}.compliance_posture is NOTICES_PENDING throughout: OVERDUE is still an unacknowledged status"

      - name: self_study_patch_writes_only_the_fields_it_was_given
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /provost/self-studies/{id}]
          - entities.SelfStudy.fields.missing_section_codes
        distinguishing_aspect: |
          A partial update leaves every unmentioned input field byte-identical
          while still re-deriving missing_section_codes, and it cannot reach the
          system-owned fields: passing only an attestation_note must not disturb
          the narrative, the section list, the revision counter or the state.
        test_recipe:
          setup:
            - "A DRAFT self-study on a cycle requiring sections S1 and S2, created holding only S1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "PHIL-BA", name: "Philosophy BA", degree_level: "UNDERGRADUATE", department_code: "PHIL" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1", "S2"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id }
            - call: "POST /provost/review-cycles/${cycle_id}/self-studies"
              payload: { narrative: "Original philosophy narrative.", section_codes: ["S1"] }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { ss_id: $.data.id, ss_v: $.data.version }
          trigger:
            - call: "PATCH /provost/self-studies/${ss_id}"
              payload: { attestation_note: "Attested by the chair." }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "PATCH /provost/self-studies/${ss_id}"
              payload: { section_codes: ["S1", "S2"] }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "GET /provost/review-cycles/${cycle_id}/self-studies"
              payload: { state: "DRAFT" }
              as: ReviewCoordinator
          assert:
            - "the first PATCH returns 200 with attestation_note == 'Attested by the chair.', narrative still 'Original philosophy narrative.', section_codes still [S1] and missing_section_codes still [S2]"
            - "state is still DRAFT, revision_round is still 0, submitted_at and accepted_at are still null — a PATCH reaches no system-owned field"
            - "version == ${ss_v} + 1 after the first PATCH and ${ss_v} + 2 after the second"
            - "the second PATCH returns 200 with section_codes == [S1, S2] and missing_section_codes == [] — the derived shortfall is recomputed even though required_section_codes never changed"
            - "the second PATCH leaves attestation_note == 'Attested by the chair.' and the narrative untouched: an omitted field is not cleared to null"
            - "the GET returns exactly one row, that self-study, with the same field values — the PATCH result is what was persisted"

      - name: teach_out_plan_read_projects_the_whole_seat_and_risk_ledger
        claim_type: computed_read
        grounds:
          - endpoints[GET /provost/teach-out-plans/{id}]
          - calculations.teach_out_seat_ledger
          - calculations.displaced_student_completion_projection
        distinguishing_aspect: |
          Nine derived counters that were never posted appear on the read, each
          from a different aggregation: guaranteed and committed seat totals over
          the guarantees, required seats and risk counts over the students, and
          per-guarantee seats_available on the children. Reading twice returns
          identical bodies and never bumps a version — the ledger is derived on
          read-back from stored rows, not stored as a running total by the read.
        test_recipe:
          setup:
            - "Fixture A program HIST-BA with a RATIFIED DISCONTINUATION decision (effective_term_index 4) and a DRAFT teach-out plan 3/4/5 carrying two guarantees (5 seats in term 4, 4 seats in term 5) and one PENDING student needing 24 credits at a 15-credit ceiling."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026SP", term_index: 2, enrollment_headcount: 24, credit_hours: 240, direct_cost_cents: 11000000, completions_count: 3, market_demand_index: 40 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026FA", term_index: 3, enrollment_headcount: 20, credit_hours: 200, direct_cost_cents: 11000000, completions_count: 2, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id }
            - call: "POST /provost/review-cycles/${cycle_id}/self-studies"
              payload: { narrative: "History self-study", section_codes: ["S1"] }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "ACCEPT" }
              as: ReviewCoordinator
            - call: "POST /provost/external-reviewers"
              payload: { full_name: "Dr Nala Osei", institution: "Westmoor University", specialty_code: "HIST" }
              as: ReviewCoordinator
              captures: { rev_id: $.data.id }
            - call: "POST /provost/reviewer-visits"
              payload: { cycle_id: "${cycle_id}", reviewer_id: "${rev_id}", window_start_at: "2026-08-20T09:00:00Z", window_end_at: "2026-08-22T17:00:00Z" }
              as: ReviewCoordinator
              captures: { visit_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-23T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/reviewer-visits/${visit_id}/complete"
              payload: {}
              as: ReviewCoordinator
            - call: "POST /provost/reviewer-visits/${visit_id}/reports"
              payload: { recommendation: "DISCONTINUE", finding_codes: ["F-ENROLL"], narrative: "Enrolment is unsustainable." }
              as: ExternalReviewer
              as_user_id: "${rev_id}"
            - call: "POST /provost/review-cycles/${cycle_id}/program-response"
              payload: { response_concurrence: "CONCUR", response_text: "The department concurs." }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { cyc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T10:00:00Z" }
              as: Provost
            - call: "POST /provost/review-cycles/${cycle_id}/decision-records"
              payload: { outcome: "DISCONTINUATION", rationale: "Composite viability below the discontinuation band.", effective_term_index: 4, expected_cycle_version: "${cyc_v}" }
              as: Provost
              as_user_id: "provost-proposer"
              captures: { dec_id: $.data.id }
            - call: "POST /provost/decision-records/${dec_id}/transitions"
              payload: { action: "RATIFY", ratification_note: "Ratified at the September provost council." }
              as: Provost
              as_user_id: "provost-ratifier"
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { prog_v: $.data.version }
            - call: "POST /provost/academic-programs/${prog_id}/teach-out-plans"
              payload: { decision_id: "${dec_id}", last_admit_term_index: 3, first_teach_out_term_index: 4, final_award_term_index: 5, expected_program_version: "${prog_v}" }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /provost/teach-out-plans/${plan_id}/course-guarantees"
              payload: { course_code: "HIST-401", term_index: 4, seats_guaranteed: 5 }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { g1_id: $.data.id }
            - call: "POST /provost/teach-out-plans/${plan_id}/course-guarantees"
              payload: { course_code: "HIST-402", term_index: 5, seats_guaranteed: 4 }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { g2_id: $.data.id }
            - call: "POST /provost/teach-out-plans/${plan_id}/displaced-students"
              payload: { student_number: "S-1001", credits_remaining: 24, max_credits_per_term: 15 }
              as: Registrar
              captures: { stu_id: $.data.id, plan_v: $.data.version }
          trigger:
            - call: "GET /provost/teach-out-plans/${plan_id}"
              payload: {}
              as: Provost
            - call: "GET /provost/teach-out-plans/${plan_id}"
              payload: {}
              as: Registrar
            - call: "GET /provost/teach-out-plans/${plan_id}/course-guarantees"
              payload: { limit: 10, offset: 0 }
              as: Registrar
            - call: "GET /provost/teach-out-plans/${plan_id}/displaced-students"
              payload: { at_risk: false, limit: 10, offset: 0 }
              as: Registrar
          assert:
            - "the first GET returns guaranteed_seat_total == 9 (5 + 4, both PLANNED), committed_seat_total == 0, required_seat_total == 8, seat_shortfall == 0 (max(0, 8 - 9)), at_risk_student_count == 0, open_student_count == 1, substituted_guarantee_count == 0 and waived_guarantee_count == 0"
            - "state is still DRAFT with plan_revision_round 0, approved_at, activated_at and completed_at all null"
            - "the second GET is byte-identical to the first including version — reads never mutate, and the ledger is not a stored running total that drifts per read"
            - "the guarantees list returns HIST-401 with seats_available == 5 and HIST-402 with seats_available == 4, both status PLANNED with seats_committed == 0"
            - "the students list returns S-1001 with projection_variant == OPTIMISTIC_FULL_LOAD (advising_status PENDING), projected_terms_remaining == 2 (ceil(24/15)), projected_completion_term_index == 5 (4 + 2 - 1), at_risk == false, required_seat_count == 8 (ceil(24/3)) and committed_seat_count == 0"
            - "not one of these nine plan counters or five student projections appeared in any request payload — every one is derived from the two guarantees and the single student row"

      - name: a_consolidation_decision_is_reachable_from_both_program_links
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /provost/decision-records]
          - endpoints[GET /provost/academic-programs]
          - entities.DecisionRecord.fields.receiving_program_id
          - entities.AcademicProgram.fields.consolidated_into_program_id
        distinguishing_aspect: |
          The decision hangs off its cycle but also names a second, unrelated
          program as the receiver, and the effectuation writes the mirror link on
          the reviewed program. Both directions must be queryable: the decision by
          receiving_program_id, and the absorbed program by
          consolidated_into_program_id — and neither filter may match the other
          program of the pair.
        test_recipe:
          setup:
            - "Fixture A program HIST-BA (composite 29.06, NONVIABLE) plus BIG-BA, three strong terms of 20 heads / 300 credit hours / 3000000 cents / 13, 13, 14 completions / demand 90 giving composite 80.50 and CONTINUE_ELIGIBLE."
            - "A CONSOLIDATION decision on HIST-BA naming BIG-BA is ratified at 2026-09-15T10:00:00Z, both minted notices are acknowledged, and the decision is effectuated. HIST-BA carries no faculty appointments, so deferred_fte is 0.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
