            - "Credential.${cred}.screening_recorded_by_user_id == officer-4 and Credential.${cred}.training_recorded_by_user_id == officer-5"
            - "Program.${prog}.certified_coach_count == 1, expired_credential_count == 0, expired_credential_ratio == 0.0000"
