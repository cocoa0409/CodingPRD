              as: SafetyOfficer
              captures: { plk: $.data.id }
          trigger:
            - call: "POST /entry-permits/${plk}/issue"
              payload: { lockout_checklist_confirmed: false }
              as: SafetyOfficer
              as_user_id: "so-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LOCKOUT_NOT_VERIFIED"
            - "permit remains DRAFT"

      - name: atmosphere_unsafe_on_activate_rejected
        claim_type: violation_to_error
        grounds:
          - "state_machines.EntryPermit.ISSUED_to_ACTIVE"
          - "errors[ERR_ATMOSPHERE_UNSAFE]"
        distinguishing_aspect: "Activating an ISSUED permit with oxygen 18.0 (< 19.5) fails with ERR_ATMOSPHERE_UNSAFE; permit stays ISSUED."
        test_recipe:
