  - method: GET
    path: "/lab/standing-orders"
    description: "List standing orders (paginated; Customer role sees only own)"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: ["customer_id?", "product_id?", "warehouse_id?", "status?", "limit?", "offset?"]
    output: "StandingOrder[]"
    side_effects: []
  - method: GET
    path: "/lab/standing-orders/{standingOrderId}"
    description: "Get one standing order"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: []
    output: StandingOrder
    side_effects: []
  - method: POST
    path: "/lab/standing-orders/{standingOrderId}/pause"
    description: "Pause an ACTIVE standing order"
    roles: [Customer]
    code: 200
    input: []
    output: StandingOrder
    side_effects: ["status ACTIVE -> PAUSED", "increments StandingOrder.version by 1"]
  - method: POST
    path: "/lab/standing-orders/{standingOrderId}/resume"
    description: "Resume a PAUSED standing order"
    roles: [Customer]
    code: 200
    input: []
    output: StandingOrder
    side_effects: ["status PAUSED -> ACTIVE", "increments StandingOrder.version by 1"]
  - method: POST
    path: "/lab/standing-orders/{standingOrderId}/cancel"
    description: "Cancel a standing order (terminal)"
    roles: [Customer]
    code: 200
    input: []
    output: StandingOrder
    side_effects: ["status -> CANCELLED", "increments StandingOrder.version by 1"]

  # --- Consignment ---
  - method: POST
    path: "/lab/consignment-agreements"
    description: "Open a consignment agreement (half-open window overlap rule applies)"
    roles: [AccountManager]
    code: 201
    input: [customer_id, product_id, ceiling_quantity, reorder_point, contract_unit_price_cents, "discount_pct?", replenishment_warehouse_id, "initial_stocked_quantity?", effective_from, effective_until]
    output: ConsignmentAgreement
