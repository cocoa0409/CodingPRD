      - name: corner_loss_of_use_extension_truncates_at_the_part_max_days
        claim_type: Correct Result
        grounds:
          - calculations.claim_settlement_amount
          - entities.Claim.loss_of_use_paid_cents
          - endpoints[POST /inland-marine/claims/{id}/adjust]
          - endpoints[GET /inland-marine/claims/{id}/settlement-worksheet]
          - state_machines.Claim.REPAIR_APPROVED_to_SETTLED
        distinguishing_aspect: |
          The positive loss-of-use branch: a RENTED item on a RENTED_LEASED part with 12
          days claimed against loss_of_use_max_days 10 pays
          min(12, 10) * 50000 == 500000, NOT the 600000 an untruncated day count would
          produce, and that extension is added AFTER the deductible has been subtracted
          and the zero floor applied - so the repair settlement is 2900000 + 500000 ==
          3400000 and the whole 3400000 (not just the indemnity part) draws down the
          part's aggregate capacity. The extension materialises only at adjust time,
          because loss_of_use_days_claimed is still 0 when inspect pre-computes the
          worksheet.
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
            - "One PUBLISHED RateRule: EXCAVATOR, T2_URBAN, age band 0-5, base_rate_bp 180, theft_hazard_grade A."
            - "One IN_FORCE Policy in T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000."
            - "One ACTIVE RENTED_LEASED CoveragePart: valuation_basis ACV, rating_basis SCHEDULED, deductible_cents 100000, per_item_limit_cents 20000000, aggregate_limit_cents 200000000, loss_of_use_daily_limit_cents 50000, loss_of_use_max_days 10."
            - "One ACTIVE EquipmentItem with ownership RENTED, model_year 2022, original_cost_cents 12000000, so insured_value_cents is 8160000 and rated_premium_cents is 173318 - identical to the OWNED unit, because ownership is a coverage fact and not a rating factor."
            - "One INSPECTED Claim on that item with repair_estimate_cents 3000000 and actual_value_at_loss_cents 8160000, inspected by adj-1."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Rented Fleet Earthworks", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "RENTED_LEASED", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000, loss_of_use_daily_limit_cents: 50000, loss_of_use_max_days: 10 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Rented excavator R1", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "RENTED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { it1: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/equipment-items/${it1}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/claims"
              payload: { coverage_part_id: "${cp}", loss_date: "2026-08-01", loss_type: "COLLISION", equipment_item_id: "${it1}" }
              as: Underwriter
              captures: { clm: $.data.id }
            - call: "POST /inland-marine/claims/${clm}/inspect"
              payload: { repair_estimate_cents: 3000000, actual_value_at_loss_cents: 8160000 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          trigger:
            - call: "GET /inland-marine/claims/${clm}/settlement-worksheet"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /inland-marine/claims/${clm}/adjust"
              payload: { adjustment_basis: "REPAIR", loss_of_use_days_claimed: 12 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /inland-marine/claims/${clm}/settle"
              payload: {}
              as: UnderwritingManager
              as_user_id: "mgr-1"
            - call: "GET /inland-marine/coverage-parts/${cp}"
              payload: {}
              as: UnderwritingManager
              as_user_id: "mgr-1"
            - call: "GET /inland-marine/claims/${clm}/ledger-entries"
              payload: { limit: 100, offset: 0 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          assert:
            - "after setup: EquipmentItem.${it1}.insured_value_cents == 8160000 and rated_premium_cents == 173318; Policy.${pol}.written_premium_cents == 180251"
            - "trigger[0] response valuation_at_loss_cents == 8160000, constructive_total_loss_threshold_cents == 6120000, constructive_total_loss_reached == false, repair_basis_selectable == true, underreporting_factor_bp == 10000, claim_limit_cents == 20000000 (per_item_limit_cents governs a RENTED_LEASED part), deductible_cents == 100000, aggregate_available_cents == 200000000"
            - "trigger[0] response loss_of_use_paid_cents == 0 and repair_basis_settlement_cents == 2900000 - at INSPECTED the claimed day count is still 0, so the extension is not yet in the worksheet"
            - "trigger[0] response total_loss_basis_settlement_cents == 8060000 (the TOTAL_LOSS variant never carries loss-of-use)"
            - "trigger[1] HTTP status == 200"
            - "trigger[1] response Claim.loss_of_use_days_claimed == 12 and loss_of_use_paid_cents == 500000 - min(12, 10) * 50000, so the claimed 12 days are truncated to the part's 10 and the naive 600000 is wrong"
            - "trigger[1] response Claim.settlement_amount_cents == 3400000 == max(0, min(3000000, 20000000) - 100000) + 500000, adjustment_basis == REPAIR, adjustment_status == REPAIR_APPROVED and salvage_status == NOT_APPLICABLE"
            - "trigger[2] HTTP status == 200 and response Claim.settlement_paid_cents == 3400000 with adjustment_status == CLOSED (the repair branch runs SETTLED -> CLOSED inside the settling call)"
            - "trigger[3] response CoveragePart.${cp}.aggregate_paid_net_cents == 3400000 and aggregate_available_cents == 196600000 - the loss-of-use money consumes aggregate capacity exactly like the indemnity money"
            - "trigger[3] response CoveragePart.${cp}.rated_premium_cents == 173318 - the repair branch leaves the item on risk, so EquipmentItem.${it1}.status == ACTIVE and Policy.${pol}.written_premium_cents stays 180251"
            - "trigger[4] response: exactly 1 row - CLAIM_SETTLEMENT +3400000 with claim_id ${clm}; the extension is not ledgered separately"
            - "after trigger[2]: Policy.${pol}.incurred_loss_cents == 3400000"

  # =========================================================================
  # Validations
  # =========================================================================
  - section: validations
    instances:

      - name: corner_bind_requires_referral_clearance
        claim_type: Violation → Error
        grounds:
          - validations[priority=70]
          - errors[ERR_REFERRAL_REQUIRED]
          - entities.Policy.referral_required
          - entities.Policy.referral_status
          - endpoints[POST /inland-marine/policies/{id}/refer]
          - endpoints[POST /inland-marine/policies/{id}/referral-decision]
          - endpoints[POST /inland-marine/policies/{id}/bind]
        distinguishing_aspect: |
          A single AGREED_VALUE crane at 60000000 pushes total_insured_value_cents past
          the 50000000 referral trigger, so bind is refused with ERR_REFERRAL_REQUIRED
          even though the policy is a perfectly valid QUOTED risk; only after refer
          (referral_status PENDING) and an APPROVE decision by a different user does
          the byte-identical bind succeed.
        test_recipe:
          setup:
            - "One PUBLISHED RateRule: CRANE, T2_URBAN, age band 0-5, base_rate_bp 310, theft_hazard_grade B."
            - "One DRAFT Policy in T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 50000."
            - "One ACTIVE SCHEDULED_EQUIPMENT CoveragePart, valuation_basis ACV, per_item_limit_cents 100000000, aggregate_limit_cents 200000000."
            - "One RATED EquipmentItem: CRANE, model_year 2024, AGREED_VALUE, stated_value_cents 60000000."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "CRANE", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 310, theft_hazard_grade: "B" }
              as: Actuary
              captures: { rr: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Big Iron Referral Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 50000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", per_item_limit_cents: 100000000, aggregate_limit_cents: 200000000 }
