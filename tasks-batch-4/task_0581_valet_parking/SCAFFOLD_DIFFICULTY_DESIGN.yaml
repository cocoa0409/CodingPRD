  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: lane_assignment_half_open_adjacency_allowed
        grounds:
          - entities.LaneAssignment.fields.window_start
          - entities.LaneAssignment.fields.window_end
          - errors[ERR_LANE_WINDOW_CONFLICT]
          - validations[priority=10]
        distinguishing_aspect: |
          Half-open [start,end) semantics on lane_code: an adjacent reservation starting exactly when the
          prior ends is ACCEPTED, but a genuinely overlapping window is rejected with ERR_LANE_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "Lane A1 reserved for event E over [10:00,12:00)."
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "Lane Venue", address: "15 Birch Ct" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "LaneEvt", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/lane-assignments"
              payload: { venue_id: "${venue_id}", event_id: "${event_id}", lane_code: "A1", window_start: "2026-06-01T10:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: Supervisor
              captures: { la1_id: $.data.id }
            - call: "POST /valet/lane-assignments"
              payload: { venue_id: "${venue_id}", event_id: "${event_id}", lane_code: "A1", window_start: "2026-06-01T12:00:00Z", window_end: "2026-06-01T14:00:00Z" }
              as: Supervisor
              captures: { la2_id: $.data.id }
          trigger:
            - call: "POST /valet/lane-assignments"
              payload: { venue_id: "${venue_id}", event_id: "${event_id}", lane_code: "A1", window_start: "2026-06-01T11:00:00Z", window_end: "2026-06-01T13:00:00Z" }
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "LaneAssignment.${la2_id}.window_start == 2026-06-01T12:00:00Z"
            - "response.data.error_id == ERR_LANE_WINDOW_CONFLICT"
            - "response.http_status == 409"

      - name: shift_rest_buffer_gap_required
        grounds:
          - entities.Shift.fields.start_at
          - entities.Shift.fields.end_at
          - errors[ERR_SHIFT_OVERLAP]
          - validations[priority=10]
        distinguishing_aspect: |
          Buffered-gap semantics on Shift (distinct from lane half-open adjacency): a shift starting exactly
          when the prior ends is REJECTED because it violates the 30-minute rest buffer; a shift starting 30
          minutes later is accepted.
        test_recipe:
          setup:
            - "Attendant a1 has shift S1 [08:00,12:00)."
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "Shift Venue", address: "16 Cedar Ct" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "Ana" }
              as: Supervisor
              captures: { a1_id: $.data.id }
            - call: "POST /valet/shifts"
              payload: { attendant_id: "${a1_id}", start_at: "2026-06-01T08:00:00Z", end_at: "2026-06-01T12:00:00Z" }
              as: Supervisor
              captures: { s1_id: $.data.id }
            - call: "POST /valet/shifts"
              payload: { attendant_id: "${a1_id}", start_at: "2026-06-01T12:30:00Z", end_at: "2026-06-01T14:00:00Z" }
              as: Supervisor
              captures: { s3_id: $.data.id }
          trigger:
            - call: "POST /valet/shifts"
              payload: { attendant_id: "${a1_id}", start_at: "2026-06-01T12:00:00Z", end_at: "2026-06-01T12:20:00Z" }
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "Shift.${s3_id}.start_at == 2026-06-01T12:30:00Z"
            - "response.data.error_id == ERR_SHIFT_OVERLAP"
            - "response.http_status == 409"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: lot_occupancy_conserved_checkin_checkout
        grounds:
          - calculations.lot_occupancy
          - state_machines.Ticket.PARKED_to_CLOSED
          - entities.Lot.fields.occupied_count
        distinguishing_aspect: |
          Conserved quantity = lot space count: check-in (+1) followed by its compensating checkout (-1)
          restores Lot.occupied_count to 0, exactly equal to |{tickets of lot with park_status in
          {PARKED,RETRIEVED}}| = 0.
        test_recipe:
          setup:
            - "ACTIVE event; lot capacity 5 empty; one ticket checked in then checked out."
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "Inv1 Venue", address: "17 Ash Ct" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
