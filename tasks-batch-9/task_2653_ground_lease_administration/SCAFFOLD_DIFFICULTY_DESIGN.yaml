  - rule_id: compensating_invariant
    instances:
      - name: condemnation_allocation_rescinded_restores_arrears_and_every_mortgage_principal_exactly
        grounds:
          - calculations.loss_proceeds_allocation
          - state_machines.LossEvent.ALLOCATED_to_ALLOCATION_RESCINDED
          - state_machines.LossEvent.ALLOCATION_RESCINDED_to_ALLOCATED
          - state_machines.LeaseholdMortgage.RECORDED_to_EXTINGUISHED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          The waterfall moves money on three entities at once - the lease's arrears and two mortgage
          principals - and extinguishes both mortgages. The rescission must reverse all of it exactly:
          arrears back to 1000000, principals back to 3000000 and 2000000, both mortgages back to RECORDED
          from EXTINGUISHED, every bucket back to 0 and allocation_detail cleared. Re-allocating then
          reproduces byte-identical figures, which only holds if the reversal left no drift and the
          re-run reads live ledger values rather than the stored buckets. lessee_share_bps is 6000 on
          both runs while allocated_lessee_cents is 0, because the share is computed on the full pool and
          then capped by what bucket 3 actually has left.
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z default."
            - "One lease with arrears 1000000, improvements 60000000 and reversion land value 40000000, so BONUS_VALUE gives lessee_share_bps 6000."
            - "Two RECORDED mortgages: M1 priority_rank 1 at 3000000 and M2 priority_rank 2 at 2000000."
            - "One CONDEMNATION loss event adjusted to a 6000000 pool with allocation_method BONUS_VALUE."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-63", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/leasehold-mortgages"
              payload: { mortgagee_legal_name: "Keystone Senior Debt Fund", notice_email: "servicing@keystone.example", original_principal_cents: 3000000, priority_rank: 1, cure_extension_days: 30 }
              as: LessorAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/leasehold-mortgages"
              payload: { mortgagee_legal_name: "Bayfront Mezzanine Partners", notice_email: "asset@bayfront.example", original_principal_cents: 2000000, priority_rank: 2, cure_extension_days: 15 }
              as: LessorAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/rent-charges"
              payload: { amount_cents: 1000000, memo: "2026 Q2 ground rent" }
              as: LeaseAccountant
              as_user_id: "acct-1"
            - call: "POST /portfolio/leases/${lease_id}/loss-events"
              payload: { event_type: "CONDEMNATION", scope_code: "PARTIAL", occurred_at: "2026-07-01T00:00:00Z", damage_estimate_cents: 6000000, damaged_area_sqft: 20000 }
              as: AssetManager
              as_user_id: "am-1"
              captures: { loss_id: $.data.id }
            - call: "POST /portfolio/loss-events/${loss_id}/adjust"
              payload: { distributable_pool_cents: 6000000, allocation_method: "BONUS_VALUE" }
              as: AssetManager
              as_user_id: "am-1"
          trigger:
            - call: "POST /portfolio/loss-events/${loss_id}/allocate"
              payload: {}
              as: LeaseAccountant
              as_user_id: "acct-1"
            - call: "POST /portfolio/loss-events/${loss_id}/rescind-allocation"
              payload: { reason_code: "AWARD_APPEALED" }
              as: LeaseAccountant
              as_user_id: "acct-1"
            - call: "POST /portfolio/loss-events/${loss_id}/rescind-allocation"
              payload: { reason_code: "AWARD_APPEALED" }
              as: LeaseAccountant
              as_user_id: "acct-1"
            - call: "POST /portfolio/loss-events/${loss_id}/allocate"
              payload: {}
              as: LeaseAccountant
              as_user_id: "acct-1"
          assert:
            - "trigger[0] returns 200 with LossEvent.${loss_id}.status == ALLOCATED, allocated_arrears_cents 1000000, allocated_mortgagee_cents 5000000, lessee_share_bps 6000, allocated_lessee_cents 0, allocated_lessor_cents 0"
            - "allocation_detail is exactly [{mortgage_id ${m1_id}, amount_cents 3000000}, {mortgage_id ${m2_id}, amount_cents 2000000}] in priority_rank order"
            - "the four buckets sum to 6000000 exactly - bucket 3's indicated 3600000 (6000 bps of the full pool) is capped to 0 because nothing remains after arrears and payoff"
            - "after trigger[0]: Lease.${lease_id}.arrears_balance_cents == 0, LeaseholdMortgage.${m1_id}.outstanding_principal_cents == 0 and status == EXTINGUISHED, LeaseholdMortgage.${m2_id} likewise 0 and EXTINGUISHED"
            - "trigger[1] returns 200 with LossEvent.${loss_id}.status == ALLOCATION_RESCINDED; allocated_arrears_cents, allocated_mortgagee_cents, allocated_lessee_cents and allocated_lessor_cents are all 0, lessee_share_bps is null and allocation_detail is empty"
            - "after trigger[1]: Lease.${lease_id}.arrears_balance_cents == 1000000, LeaseholdMortgage.${m1_id}.outstanding_principal_cents == 3000000 with status RECORDED, LeaseholdMortgage.${m2_id}.outstanding_principal_cents == 2000000 with status RECORDED"
            - "trigger[2] returns ERR_INVALID_STATE (409) - ALLOCATION_RESCINDED has no rescind transition - and the ledger does not double-credit: arrears stays 1000000 and the principals stay 3000000 / 2000000"
            - "trigger[3] returns 200 and reproduces the first allocation exactly: allocated_arrears_cents 1000000, allocated_mortgagee_cents 5000000, allocated_lessee_cents 0, allocated_lessor_cents 0, the same allocation_detail, both mortgages EXTINGUISHED again"
            - "Lease.${lease_id}.version increments by exactly 1 on each of trigger[0], trigger[1] and trigger[3], and not at all on trigger[2]"

      - name: revoked_alteration_returns_envelope_once_and_a_second_revoke_cannot_mint_capacity
        grounds:
          - state_machines.AlterationRequest.APPROVED_to_APPROVAL_REVOKED
          - validations.priority_13_gfa_envelope
          - errors.ERR_GFA_ENVELOPE_EXCEEDED
          - errors.ERR_INVALID_STATE
          - entities.Lease.fields.gfa_unallocated_sqft
        distinguishing_aspect: |
          The revocation credit must be applied exactly once. A second revoke on the same request is a
          move out of a terminal state and must be refused before it touches the envelope, and the proof
          is not the error code but the next approval: with the envelope correctly at 40000 a 170000 sqft
          request is refused, while a double-credited envelope of -110000 would silently wave it through
          and overbuild the site. The follow-up 160000 approval then lands exactly on 200000, showing the
          cap is inclusive and that the credit was neither lost nor doubled.
