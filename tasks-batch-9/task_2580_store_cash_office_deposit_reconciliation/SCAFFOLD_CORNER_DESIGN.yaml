              as_user_id: "U-LP-1"
              captures: { closed_v: $.data.version }
          trigger:
            - call: "POST /cash-ops/variance-cases/${case_id}/attributions"
              payload: { bucket: "SAFE", amount_cents: 500, note: "Late finding", expected_variance_case_version: "${closed_v}" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and data.error_id == \"ERR_VARIANCE_CASE_INVALID_STATE\""
            - "the version supplied was current, so the rejection is a state rejection and NOT ERR_CASE_VERSION_STALE"
            - "VarianceCase.${case_id}.status == \"CLOSED_SUBSTANTIATED\", attributions has exactly 1 entry, attributed_safe_cents == 0, version == ${closed_v}"

