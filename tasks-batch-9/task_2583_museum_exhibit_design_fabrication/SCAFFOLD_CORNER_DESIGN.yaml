      - name: each_design_package_is_scored_from_its_own_four_inputs_and_never_re_scored
        claim_type: input_set_filtering
        grounds:
          - calculations.package_flow_and_accessibility.input_set
          - entities.DesignPackage.fields.flow_capacity_score
          - entities.DesignPackage.fields.superseded_by_package_id
        distinguishing_aspect: |
          The input set is a single row - "no sibling packages participate" - and the
          score is frozen at creation. Three same-stage packages are created in a row
          with wildly different throughput/area pairs, so an implementation that
          averages across the project, or that recomputes a superseded package's
          score from the newest inputs, cannot hold all three numbers at once. The
          third pair also exercises the min(100.0, ...) ceiling BEFORE rounding: a
          raw ratio of 4.6153846 must be reported as 100.00, not 461.54, and the cap
          must not leak into the two lower scores.
        test_recipe:
          setup:
            - "project in phase SCHEMATIC with no design packages yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { pv2: $.data.version }
          trigger:
