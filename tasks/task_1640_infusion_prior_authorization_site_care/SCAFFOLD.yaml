# =============================================================================
# SCAFFOLD.yaml — Infusion Prior Authorization & Site-of-Care Steering
# =============================================================================

scenario: |
  Infusion Prior Authorization & Site-of-Care Steering (infusion authorization team): drug/regimen authorization requirement lookup, clinical criteria submission & appeal, site-of-care policy (home/office vs hospital outpatient) determination, benefit investigation (medical vs pharmacy) & buy-and-bill routing, scheduling coordination with authorization validity window, dose change & re-authorization trigger, financial clearance & patient responsibility estimate, denial escalation & peer-to-peer

domain_name: infusion-prior-authorization
api_prefix: /infusion

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: PayerPolicy
    parent: null
    common_fields: true
    fields:
      - { name: payer_code, type: string, source: input, description: "Payer identifier code" }
      - { name: drug_code, type: string, source: input, description: "Drug / regimen billing code (e.g. J-code)", constraints: "unique together with payer_code (ERR_DUPLICATE_POLICY)" }
      - { name: regimen_name, type: string, source: input, description: "Human-readable regimen label" }
      - { name: requires_prior_auth, type: boolean, source: input, default: true, description: "Whether the drug/regimen requires prior authorization under this policy" }
      - { name: benefit_channel, type: enum, source: input, description: "MEDICAL | PHARMACY | EITHER — which benefit channel the policy pays under" }
      - { name: buy_and_bill_required, type: boolean, source: input, default: false, description: "When true, verification must route BUY_AND_BILL (medical channel); PHARMACY verification is rejected with ERR_ROUTING_VIOLATION" }
      - { name: validity_days, type: integer, source: input, description: "Authorization validity length in days for the medical channel" }
      - { name: pharmacy_validity_days, type: integer, source: input, default: 30, description: "Authorization validity length in days for the pharmacy channel" }
      - { name: max_course_days, type: integer, source: input, description: "Maximum course-of-therapy length in days; caps the authorization validity window" }
      - { name: max_dose_mg, type: integer, source: input, description: "Absolute safety ceiling for a single dose in mg (ERR_DOSE_EXCEEDS_MAX)" }
      - { name: allowed_amount_known, type: boolean, source: input, default: true, description: "When true the plan publishes allowed amounts (ACCUMULATOR_METHOD); when false the estimate falls back to discounted billed charges (BILLED_CHARGES_METHOD)" }
      - { name: discount_rate, type: number, source: input, default: 0.80, description: "Multiplier applied to billed charges in BILLED_CHARGES_METHOD" }
      - { name: site_policy, type: enum, source: input, default: "NO_STEERING", description: "NO_STEERING | STEER_TO_HOME | STEER_TO_OFFICE — site-of-care steering posture" }
      - { name: steer_threshold, type: number, source: input, default: 1.50, description: "steer_score >= steer_threshold triggers steering to the policy target site" }
      - { name: deductible_cents, type: integer, source: input, description: "Plan deductible in cents (reference value on the policy)" }
      - { name: coinsurance_pct, type: number, source: input, description: "Patient coinsurance fraction, e.g. 0.20" }
      - { name: oop_max_cents, type: integer, source: input, description: "Plan out-of-pocket maximum in cents (reference value)" }
      - { name: prepay_limit_cents, type: integer, source: input, description: "Financial clearance fails with ERR_PREPAY_LIMIT_EXCEEDED when the estimate exceeds this limit" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "Payer member identifier" }
      - { name: full_name, type: string, source: input, description: "Patient full name" }
      - { name: diagnosis_code, type: string, source: input, description: "Primary diagnosis code (ICD-10)" }
      - { name: payer_code, type: string, source: input, description: "Payer identifier the patient is enrolled with" }
      - { name: plan_year_end, type: datetime, source: input, description: "Plan year end timestamp; caps the authorization validity window" }
      - { name: deductible_remaining_cents, type: integer, source: input, description: "Patient accumulator: deductible remaining in cents" }
      - { name: oop_remaining_cents, type: integer, source: input, description: "Patient accumulator: out-of-pocket remaining in cents; caps the responsibility estimate" }
      - { name: rural_resident, type: boolean, source: input, default: false, description: "Selects the TRAVEL_BURDEN variant of the site steering score when true" }
      - { name: travel_minutes_to_hospital, type: integer, source: input, default: 0, description: "One-way travel minutes to the hospital outpatient department" }

  - name: AuthorizationRequest
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; the member requesting infusion therapy" }
      - { name: policy_id, type: string, source: input, description: "FK -> PayerPolicy.id; the governing payer policy" }
      - { name: requested_site_type, type: enum, source: input, description: "HOME | OFFICE | HOSPITAL_OUTPATIENT — site requested by the ordering provider" }
      - { name: requested_dose_mg, type: integer, source: input, description: "Requested single dose in mg; must be <= policy.max_dose_mg" }
      - { name: patient_weight_kg, type: number, source: input, description: "Patient weight in kg at intake" }
      - { name: supersedes_request_id, type: string, source: input, required: false, description: "FK -> AuthorizationRequest.id; set when this request is a re-authorization replacing a superseded one" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | PENDED | APPROVED | DENIED | SUPERSEDED | EXPIRED | DENIED_CLOSED" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent DRAFT/PENDED -> SUBMITTED transition" }
      - { name: pended_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent SUBMITTED -> PENDED transition" }
      - { name: denied_at, type: datetime, source: system, description: "Logical-clock timestamp of the SUBMITTED -> DENIED transition" }
      - { name: appeal_deadline, type: datetime, source: computed, description: "= denied_at + 60 days; appeals after this instant are rejected with ERR_APPEAL_WINDOW_CLOSED" }
      - { name: auth_valid_from, type: datetime, source: computed, description: "Start of the authorization validity window (decision date at 00:00:00Z)" }
      - { name: auth_valid_to, type: datetime, source: computed, description: "End of the authorization validity window (inclusive), per auth_validity_window calculation" }
      - { name: approved_dose_mg, type: integer, source: computed, description: "= requested_dose_mg at approval; updated by an approved DoseChangeRequest that did not require re-authorization" }
      - { name: denial_reason, type: string, source: system, description: "Reason recorded on denial" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creator; used by segregation-of-duties checks" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the MedicalDirector who recorded the latest determination" }

  - name: ClinicalCriteriaSubmission
    parent: null
    common_fields: true
    fields:
      - { name: authorization_request_id, type: string, source: input, description: "FK -> AuthorizationRequest.id" }
      - { name: criterion_code, type: string, source: input, description: "Policy criterion identifier being answered" }
      - { name: response_value, type: string, source: input, description: "Clinical response / documentation reference" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REJECTED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the submitting coordinator" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the reviewing MedicalDirector" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: authorization_request_id, type: string, source: input, description: "FK -> AuthorizationRequest.id" }
      - { name: reason, type: string, source: input, description: "Appeal rationale" }
      - { name: status, type: enum, source: system, description: "LEVEL_1 | LEVEL_1_DECIDED | LEVEL_2 | LEVEL_2_DECIDED | EXTERNAL_REVIEW | CLOSED_UPHELD | CLOSED_OVERTURNED" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the MedicalDirector recording the latest appeal decision" }

  - name: PeerToPeerReview
    parent: null
    common_fields: true
    fields:
      - { name: appeal_id, type: string, source: input, description: "FK -> Appeal.id" }
      - { name: reviewer_user_id, type: string, source: input, description: "User id of the payer medical director whose calendar the call occupies" }
      - { name: scheduled_start, type: datetime, source: input, description: "Call window start (closed interval)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Call window end (closed interval)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | NO_SHOW | COMPLETED" }
      - { name: reschedule_count, type: integer, source: system, default: 0, description: "Number of reschedules; the third attempt is rejected with ERR_P2P_RESCHEDULE_LIMIT" }
      - { name: outcome, type: enum, source: system, description: "null | UPHOLD | OVERTURN — recorded at completion" }

  - name: SiteOfCareDetermination
    parent: null
    common_fields: true
    fields:
      - { name: authorization_request_id, type: string, source: input, description: "FK -> AuthorizationRequest.id" }
      - { name: home_allowed_cents, type: integer, source: input, description: "Allowed amount for home infusion" }
      - { name: hospital_allowed_cents, type: integer, source: input, description: "Allowed amount for hospital outpatient infusion" }
      - { name: home_billed_cents, type: integer, source: input, description: "Billed charges for home infusion" }
      - { name: hospital_billed_cents, type: integer, source: input, description: "Billed charges for hospital outpatient infusion" }
      - { name: score_variant, type: enum, source: system, description: "COST_RATIO | TRAVEL_BURDEN — selected from patient.rural_resident" }
      - { name: steer_score, type: number, source: computed, description: "Per site_steering_score calculation, 3 decimal places round_half_up" }
      - { name: recommended_site_type, type: enum, source: computed, description: "HOME | OFFICE | HOSPITAL_OUTPATIENT — the site the system will accept for scheduling" }
      - { name: steered, type: boolean, source: computed, description: "True when recommended_site_type differs from the request's requested_site_type" }

  - name: BenefitInvestigation
    parent: null
    common_fields: true
    fields:
      - { name: authorization_request_id, type: string, source: input, description: "FK -> AuthorizationRequest.id" }
      - { name: status, type: enum, source: system, description: "INITIATED | VERIFIED" }
      - { name: determined_channel, type: enum, source: system, description: "MEDICAL | PHARMACY — recorded at verification" }
      - { name: routing, type: enum, source: computed, description: "BUY_AND_BILL when determined_channel is MEDICAL; SPECIALTY_PHARMACY when PHARMACY" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the verifying FinanceSpecialist" }

  - name: FinancialClearance
    parent: null
    common_fields: true
    fields:
      - { name: authorization_request_id, type: string, source: input, description: "FK -> AuthorizationRequest.id" }
      - { name: method, type: enum, source: system, description: "ACCUMULATOR_METHOD | BILLED_CHARGES_METHOD — from policy.allowed_amount_known" }
      - { name: status, type: enum, source: system, description: "ESTIMATED | CLEARED | ON_HOLD" }
      - { name: estimated_patient_responsibility_cents, type: integer, source: computed, description: "Per patient_responsibility_estimate over ACTIVE line items; recomputed on every line-item mutation" }
      - { name: estimated_by_user_id, type: string, source: system, description: "X-User-ID of the FinanceSpecialist who created the clearance" }
      - { name: cleared_by_user_id, type: string, source: system, description: "X-User-ID of the FinanceSpecialist who cleared it" }

  - name: ResponsibilityLineItem
    parent: null
    common_fields: true
    fields:
      - { name: financial_clearance_id, type: string, source: input, description: "FK -> FinancialClearance.id" }
      - { name: description, type: string, source: input, description: "Line description (drug, administration, supplies)" }
      - { name: allowed_amount_cents, type: integer, source: input, description: "Plan allowed amount for this line" }
      - { name: billed_charges_cents, type: integer, source: input, description: "Provider billed charges for this line" }
      - { name: patient_share_cents, type: integer, source: computed, description: "Per-line patient share after deductible + coinsurance, rounded half-up to cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOIDED" }

  - name: InfusionChair
    parent: null
    common_fields: true
    fields:
      - { name: site_type, type: enum, source: input, description: "HOME | OFFICE | HOSPITAL_OUTPATIENT — the site this chair belongs to" }
      - { name: label, type: string, source: input, description: "Chair label" }
      - { name: turnover_buffer_minutes, type: integer, source: input, default: 15, description: "Cleaning buffer appended to each appointment's end for overlap purposes" }

  - name: InfusionAppointment
    parent: null
    common_fields: true
    fields:
      - { name: authorization_request_id, type: string, source: input, description: "FK -> AuthorizationRequest.id" }
      - { name: chair_id, type: string, source: input, description: "FK -> InfusionChair.id" }
      - { name: scheduled_start, type: datetime, source: input, description: "Infusion start (must satisfy auth_valid_from <= scheduled_start <= auth_valid_to)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Infusion end (must be > scheduled_start)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONFIRMED | COMPLETED | CANCELLED | MISSED" }

  - name: DoseChangeRequest
    parent: null
    common_fields: true
    fields:
      - { name: authorization_request_id, type: string, source: input, description: "FK -> AuthorizationRequest.id" }
      - { name: new_dose_mg, type: integer, source: input, description: "Proposed new dose in mg; must be <= policy.max_dose_mg" }
      - { name: delta_pct, type: number, source: computed, description: "round(|new_dose_mg - approved_dose_mg| / approved_dose_mg * 100, 2) round_half_up" }
      - { name: reauth_required, type: boolean, source: computed, description: "True when delta_pct >= 20.00" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the deciding MedicalDirector" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: AuthorizationRequest
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED, DENIED_CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /infusion/authorization-requests/{id}/submit"
        actor: AuthCoordinator
        preconditions:
          - "At least one BenefitInvestigation with status VERIFIED (ERR_BENEFIT_NOT_VERIFIED)"
          - "At least one ClinicalCriteriaSubmission with status ACCEPTED (ERR_MISSING_REQUIRED_CRITERIA)"
          - "At least one SiteOfCareDetermination exists (ERR_SITE_DETERMINATION_MISSING)"
        side_effects:
          - "submitted_at = current logical clock; version += 1"
      - from: PENDED
        to: SUBMITTED
        trigger: "POST /infusion/authorization-requests/{id}/submit"
        actor: AuthCoordinator
        preconditions:
          - "At least one ClinicalCriteriaSubmission with status ACCEPTED whose created_at > pended_at (ERR_MISSING_REQUIRED_CRITERIA) — the pend/resubmit cycle"
        side_effects:
          - "submitted_at = current logical clock; version += 1"
      - from: SUBMITTED
        to: PENDED
        trigger: "POST /infusion/authorization-requests/{id}/determinations with outcome PENDED"
        actor: MedicalDirector
        preconditions:
          - "deciding X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "expected_authorization_version matches current version (ERR_STALE_VERSION)"
        side_effects:
          - "pended_at = current logical clock; decided_by_user_id set; version += 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /infusion/authorization-requests/{id}/determinations with outcome APPROVED; also cascades from an Appeal decision of OVERTURNED"
        actor: MedicalDirector
        preconditions:
          - "deciding X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "expected_authorization_version matches current version (ERR_STALE_VERSION)"
        side_effects:
          - "compute auth_validity_window; set auth_valid_from/auth_valid_to from decision date"
          - "approved_dose_mg = requested_dose_mg; decided_by_user_id set; version += 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /infusion/authorization-requests/{id}/determinations with outcome DENIED (denial_reason required)"
        actor: MedicalDirector
        preconditions:
          - "deciding X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "expected_authorization_version matches current version (ERR_STALE_VERSION)"
        side_effects:
          - "denied_at = current logical clock; appeal_deadline = denied_at + 60 days; decided_by_user_id set; version += 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system cascade: a DoseChangeRequest with reauth_required = true is APPROVED"
        actor: system
        preconditions: []
        side_effects:
          - "version += 1"
          - "Every InfusionAppointment of this request with status IN {SCHEDULED, CONFIRMED} and scheduled_start > current logical clock transitions to CANCELLED (chair occupation released)"
          - "The FinancialClearance of this request remains ON_HOLD (it was placed ON_HOLD when the dose-change request was created)"
      - from: APPROVED
        to: EXPIRED
        trigger: "system: evaluated when the logical clock advances past auth_valid_to (now > auth_valid_to)"
        actor: system
        preconditions: []
        side_effects:
          - "version += 1"
      - from: DENIED
        to: DENIED_CLOSED
        trigger: "system cascade: an Appeal of this request transitions to CLOSED_UPHELD (the ONLY path; a lapsed appeal_deadline does NOT close the request, it merely blocks new appeals with ERR_APPEAL_WINDOW_CLOSED)"
        actor: system
        preconditions: []
        side_effects:
          - "version += 1"

  - entity: ClinicalCriteriaSubmission
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /infusion/criteria-submissions/{id}/reviews with outcome ACCEPTED"
        actor: MedicalDirector
        preconditions:
          - "reviewing X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_user_id set; version += 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /infusion/criteria-submissions/{id}/reviews with outcome REJECTED"
        actor: MedicalDirector
        preconditions:
          - "reviewing X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_user_id set; version += 1"
        note: "A rejected criterion is corrected by creating a NEW ClinicalCriteriaSubmission; the pend/resubmit cycle on AuthorizationRequest requires a fresh ACCEPTED submission created after pended_at."

  - entity: Appeal
    initial_state: LEVEL_1
    terminal_states: [CLOSED_UPHELD, CLOSED_OVERTURNED]
    transitions:
      - from: LEVEL_1
        to: LEVEL_1_DECIDED
        trigger: "POST /infusion/appeals/{id}/decisions with outcome UPHELD"
        actor: MedicalDirector
        preconditions: []
        side_effects: ["decided_by_user_id set; version += 1"]
      - from: LEVEL_1
        to: CLOSED_OVERTURNED
        trigger: "POST /infusion/appeals/{id}/decisions with outcome OVERTURNED"
        actor: MedicalDirector
        preconditions: []
        side_effects:
          - "Cascade: parent AuthorizationRequest DENIED -> APPROVED; auth_validity_window recomputed from the decision date; auth version += 1"
      - from: LEVEL_1_DECIDED
        to: LEVEL_2
        trigger: "POST /infusion/appeals/{id}/escalations"
        actor: AuthCoordinator
        preconditions: []
        side_effects: ["version += 1"]
      - from: LEVEL_2
        to: LEVEL_2_DECIDED
        trigger: "POST /infusion/appeals/{id}/decisions with outcome UPHELD"
        actor: MedicalDirector
        preconditions: []
        side_effects: ["decided_by_user_id set; version += 1"]
      - from: LEVEL_2
        to: CLOSED_OVERTURNED
        trigger: "POST /infusion/appeals/{id}/decisions with outcome OVERTURNED"
        actor: MedicalDirector
        preconditions: []
        side_effects:
          - "Cascade: parent AuthorizationRequest DENIED -> APPROVED; auth_validity_window recomputed from the decision date; auth version += 1"
      - from: LEVEL_2_DECIDED
        to: EXTERNAL_REVIEW
        trigger: "POST /infusion/appeals/{id}/escalations"
        actor: AuthCoordinator
        preconditions: []
        side_effects: ["version += 1"]
      - from: EXTERNAL_REVIEW
        to: CLOSED_UPHELD
        trigger: "POST /infusion/appeals/{id}/decisions with outcome UPHELD"
        actor: MedicalDirector
        preconditions: []
        side_effects:
          - "Cascade: parent AuthorizationRequest DENIED -> DENIED_CLOSED; auth version += 1"
      - from: EXTERNAL_REVIEW
        to: CLOSED_OVERTURNED
        trigger: "POST /infusion/appeals/{id}/decisions with outcome OVERTURNED"
        actor: MedicalDirector
        preconditions: []
        side_effects:
          - "Cascade: parent AuthorizationRequest DENIED -> APPROVED; auth_validity_window recomputed from the decision date; auth version += 1"
      - from: LEVEL_1_DECIDED
        to: CLOSED_UPHELD
        trigger: "system cascade: a PeerToPeerReview of this appeal completes with outcome UPHOLD"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade: parent AuthorizationRequest DENIED -> DENIED_CLOSED; auth version += 1"
      - from: LEVEL_2_DECIDED
        to: CLOSED_UPHELD
        trigger: "system cascade: a PeerToPeerReview of this appeal completes with outcome UPHOLD"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade: parent AuthorizationRequest DENIED -> DENIED_CLOSED; auth version += 1"
      - from: LEVEL_1_DECIDED
        to: CLOSED_OVERTURNED
        trigger: "system cascade: a PeerToPeerReview of this appeal completes with outcome OVERTURN"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade: parent AuthorizationRequest DENIED -> APPROVED; auth_validity_window recomputed from the decision date; auth version += 1"
      - from: LEVEL_2_DECIDED
        to: CLOSED_OVERTURNED
        trigger: "system cascade: a PeerToPeerReview of this appeal completes with outcome OVERTURN"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade: parent AuthorizationRequest DENIED -> APPROVED; auth_validity_window recomputed from the decision date; auth version += 1"

  - entity: PeerToPeerReview
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /infusion/peer-to-peer-reviews/{id}/reschedules (self-loop; reschedule_count += 1)"
        actor: MedicalDirector
        preconditions:
          - "reschedule_count < 2 before the call (ERR_P2P_RESCHEDULE_LIMIT)"
          - "New window does not closed-interval-overlap another non-COMPLETED review for the same reviewer_user_id (ERR_REVIEWER_SLOT_CONFLICT)"
        side_effects: ["scheduled_start/scheduled_end replaced; version += 1"]
      - from: NO_SHOW
        to: SCHEDULED
        trigger: "POST /infusion/peer-to-peer-reviews/{id}/reschedules"
        actor: MedicalDirector
        preconditions:
          - "reschedule_count < 2 before the call (ERR_P2P_RESCHEDULE_LIMIT)"
          - "New window does not closed-interval-overlap another non-COMPLETED review for the same reviewer_user_id (ERR_REVIEWER_SLOT_CONFLICT)"
        side_effects: ["reschedule_count += 1; version += 1"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system: evaluated when the logical clock advances past scheduled_end + 30 minutes"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /infusion/peer-to-peer-reviews/{id}/completions with outcome UPHOLD | OVERTURN"
        actor: MedicalDirector
        preconditions: []
        side_effects:
          - "outcome recorded; version += 1"
          - "Cascade: parent Appeal LEVEL_1_DECIDED|LEVEL_2_DECIDED -> CLOSED_UPHELD (on UPHOLD) or CLOSED_OVERTURNED (on OVERTURN); the appeal's own cascade then moves the AuthorizationRequest"

  - entity: BenefitInvestigation
    initial_state: INITIATED
    terminal_states: [VERIFIED]
    transitions:
      - from: INITIATED
        to: VERIFIED
        trigger: "POST /infusion/benefit-investigations/{id}/verify with determined_channel MEDICAL | PHARMACY"
        actor: FinanceSpecialist
        preconditions:
          - "If policy.buy_and_bill_required is true, determined_channel must be MEDICAL (ERR_ROUTING_VIOLATION)"
        side_effects:
          - "routing = BUY_AND_BILL when channel MEDICAL else SPECIALTY_PHARMACY; verified_by_user_id set; version += 1"

  - entity: FinancialClearance
    initial_state: ESTIMATED
    terminal_states: [CLEARED]
    transitions:
      - from: ESTIMATED
        to: CLEARED
        trigger: "POST /infusion/financial-clearances/{id}/clear"
        actor: FinanceSpecialist
        preconditions:
          - "clearing X-User-ID != estimated_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "At least one BenefitInvestigation of the parent request is VERIFIED (ERR_BENEFIT_NOT_VERIFIED)"
          - "estimated_patient_responsibility_cents <= policy.prepay_limit_cents (ERR_PREPAY_LIMIT_EXCEEDED)"
        side_effects: ["cleared_by_user_id set; version += 1"]
      - from: ESTIMATED
        to: ON_HOLD
        trigger: "system cascade: a DoseChangeRequest with reauth_required = true is created for the parent request"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: ON_HOLD
        to: ESTIMATED
        trigger: "POST /infusion/financial-clearances/{id}/recompute"
        actor: FinanceSpecialist
        preconditions:
          - "Parent AuthorizationRequest status is APPROVED (ERR_AUTH_NOT_APPROVED) — reachable after the dose-change request is REJECTED"
        side_effects:
          - "estimated_patient_responsibility_cents recomputed per patient_responsibility_estimate; version += 1"

  - entity: InfusionAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, MISSED]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /infusion/appointments/{id}/confirm"
        actor: Scheduler
        preconditions:
          - "Parent AuthorizationRequest status is APPROVED (ERR_AUTH_NOT_APPROVED)"
          - "The FinancialClearance of the parent request has status CLEARED (ERR_CLEARANCE_NOT_CLEARED)"
          - "auth_valid_from <= scheduled_start <= auth_valid_to (ERR_OUTSIDE_VALIDITY_WINDOW)"
        side_effects: ["version += 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /infusion/appointments/{id}/cancel; or system cascade from AuthorizationRequest APPROVED -> SUPERSEDED"
        actor: Scheduler
        preconditions: []
        side_effects: ["version += 1; chair occupation released (chair_occupied_count decreases by 1)"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /infusion/appointments/{id}/cancel; or system cascade from AuthorizationRequest APPROVED -> SUPERSEDED"
        actor: Scheduler
        preconditions: []
        side_effects: ["version += 1; chair occupation released (chair_occupied_count decreases by 1)"]
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system: evaluated when the logical clock reaches scheduled_end (now >= scheduled_end)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: SCHEDULED
        to: MISSED
        trigger: "system: evaluated when the logical clock advances past scheduled_start + 60 minutes without confirmation"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]

  - entity: DoseChangeRequest
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /infusion/dose-change-requests/{id}/decisions with outcome APPROVED"
        actor: MedicalDirector
        preconditions: []
        side_effects:
          - "decided_by_user_id set; version += 1"
          - "If reauth_required = true: parent AuthorizationRequest APPROVED -> SUPERSEDED (which itself cancels its future SCHEDULED/CONFIRMED appointments) — depth-3 cascade"
          - "If reauth_required = false: parent AuthorizationRequest.approved_dose_mg = new_dose_mg; auth version += 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /infusion/dose-change-requests/{id}/decisions with outcome REJECTED"
        actor: MedicalDirector
        preconditions: []
        side_effects:
          - "decided_by_user_id set; version += 1"
          - "The ON_HOLD FinancialClearance (if any) becomes eligible for recompute"

# =============================================================================
# Section 1.2.1: Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: determination-stale-auth-version
    parent_entity: AuthorizationRequest
    write_endpoint: "POST /infusion/authorization-requests/{id}/determinations"
    occ_field: expected_authorization_version
    description: |
      Recording a determination against an AuthorizationRequest whose version
      has advanced since the client last observed it is rejected. This captures
      the case where another writer has just recorded a determination (which
      moved the request out of SUBMITTED) or resubmitted the request, and the
      current writer's view of the request is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: patient_responsibility_estimate
    trigger: "On FinancialClearance creation, on every ResponsibilityLineItem add/void, and on recompute"
    algorithm: waterfall_allocation
    formula: |
      active_lines = ResponsibilityLineItem WHERE financial_clearance_id = clearance.id
                     AND status = ACTIVE, processed in created_at ASC order (tie-break: created_at ASC)
      deductible_remaining = patient.deductible_remaining_cents (snapshot; patient row is not mutated)
      for each line in active_lines:
        base = (method == ACCUMULATOR_METHOD) ? line.allowed_amount_cents
                                              : round_half_up(line.billed_charges_cents * policy.discount_rate)
        ded_applied = min(base, deductible_remaining)
        deductible_remaining -= ded_applied
        coins = round_half_up((base - ded_applied) * policy.coinsurance_pct)   # per-line rounding to whole cents
        line.patient_share_cents = ded_applied + coins                          # ROUND PER LINE, THEN SUM (pinned order)
      raw_total = sum(line.patient_share_cents)
      estimated_patient_responsibility_cents = min(raw_total, patient.oop_remaining_cents)
    input_set: "ResponsibilityLineItem with status ACTIVE only; VOIDED excluded; parent Patient accumulators and PayerPolicy constants"
    constants:
      ROUNDING: "per line item, half-up to whole cents, then sum"
    precision: "integer cents, round_half_up per line"
    variants:
      - name: ACCUMULATOR_METHOD
        when: "policy.allowed_amount_known = true"
        difference: "base = allowed_amount_cents"
      - name: BILLED_CHARGES_METHOD
        when: "policy.allowed_amount_known = false"
        difference: "base = round_half_up(billed_charges_cents * discount_rate); same deductible/coinsurance waterfall afterwards, so identical inputs yield a different estimate"

  - name: site_steering_score
    trigger: "On POST /infusion/authorization-requests/{id}/site-of-care-determinations"
    algorithm: weighted_scoring
    formula: |
      burden_index = min(patient.travel_minutes_to_hospital, 120) / 120
      variant COST_RATIO (patient.rural_resident = false):
        cost_ratio = hospital_allowed_cents / home_allowed_cents
        steer_score = round_half_up(1.0 * cost_ratio + 0.5 * burden_index, 3)
      variant TRAVEL_BURDEN (patient.rural_resident = true):
        cost_ratio = hospital_billed_cents / home_billed_cents
        steer_score = round_half_up(1.0 * cost_ratio + 1.0 * burden_index, 3)
      decision:
        if policy.site_policy == NO_STEERING: recommended_site_type = requested_site_type; steered = false
        elif steer_score >= policy.steer_threshold:
          recommended_site_type = (STEER_TO_HOME -> HOME) | (STEER_TO_OFFICE -> OFFICE); steered = (recommended != requested)
        else: recommended_site_type = requested_site_type; steered = false
    input_set: "Parent AuthorizationRequest.requested_site_type, parent Patient (rural_resident, travel_minutes_to_hospital), parent PayerPolicy (site_policy, steer_threshold)"
    constants:
      COST_WEIGHT: 1.0
      BURDEN_WEIGHT_STANDARD: 0.5
      BURDEN_WEIGHT_RURAL: 1.0
      BURDEN_CAP_MINUTES: 120
    precision: "3 decimal places, round_half_up"
    variants:
      - name: COST_RATIO
        when: "patient.rural_resident = false"
        difference: "cost ratio from allowed amounts; burden weight 0.5"
      - name: TRAVEL_BURDEN
        when: "patient.rural_resident = true"
        difference: "cost ratio from billed charges; burden weight 1.0 — identical inputs yield a different steer_score"

  - name: auth_validity_window
    trigger: "On AuthorizationRequest transition to APPROVED (determination APPROVED or appeal OVERTURNED)"
    algorithm: threshold
    formula: |
      valid_from = decision timestamp truncated to 00:00:00Z of that date
      base_days = (policy.benefit_channel == PHARMACY) ? policy.pharmacy_validity_days : policy.validity_days
      auth_valid_to = min(valid_from + base_days days,
                          patient.plan_year_end,
                          valid_from + policy.max_course_days days)
      Window semantics: closed interval [auth_valid_from, auth_valid_to]; an appointment satisfies the window
      iff auth_valid_from <= scheduled_start <= auth_valid_to (both bounds inclusive).
    input_set: "Parent PayerPolicy (benefit_channel, validity_days, pharmacy_validity_days, max_course_days), parent Patient.plan_year_end, decision timestamp"
    constants:
      APPEAL_WINDOW_DAYS: 60
    precision: "timestamps at 00:00:00Z; inclusive bounds"
    variants: []

  - name: dose_delta_pct
    trigger: "On POST /infusion/authorization-requests/{id}/dose-change-requests"
    algorithm: threshold
    formula: |
      delta_pct = round_half_up(abs(new_dose_mg - auth.approved_dose_mg) / auth.approved_dose_mg * 100, 2)
      reauth_required = (delta_pct >= REAUTH_THRESHOLD_PCT)   # exactly 20.00 triggers; 19.99 does not
    input_set: "DoseChangeRequest.new_dose_mg, parent AuthorizationRequest.approved_dose_mg"
    constants:
      REAUTH_THRESHOLD_PCT: 20.00
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: chair_occupied_count
    trigger: "On InfusionAppointment create/cancel; asserted as a conserved quantity"
    algorithm: aggregation
    formula: |
      chair_occupied_count(chair_id) = COUNT(InfusionAppointment WHERE chair_id = X
                                             AND status IN {SCHEDULED, CONFIRMED, COMPLETED})
      Overlap rule on create: the new appointment occupies the half-open interval
      [scheduled_start, scheduled_end + chair.turnover_buffer_minutes); it conflicts with any existing
      appointment on the same chair with status NOT IN {CANCELLED, MISSED} whose occupied interval
      satisfies: new_start < existing_end + buffer AND existing_start < new_end + buffer.
      Adjacency (new_start == existing_end + buffer) is allowed.
    input_set: "InfusionAppointment of the chair with status NOT IN {CANCELLED, MISSED}"
    constants:
      MISSED_GRACE_MINUTES: 60
    precision: "whole minutes"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Request body required fields present; enum values valid; datetime fields parse; scheduled_end > scheduled_start", error_id: ERR_VALIDATION_FAILED, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path and body-referenced resources exist, validated left-to-right (patient, policy, request, appeal, submission, clearance, line item, chair, appointment, dose-change, benefit investigation, peer-to-peer)", error_id: ERR_AUTH_REQUEST_NOT_FOUND, http_status: 404, applies_to: "all endpoints with ids (per-resource 404 ids in the error catalog)" }
  - { priority: 5, category: auth, check: "Segregation of duties: determinations decider != request creator; criteria reviewer != submission creator; clearance clearer != clearance estimator", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /infusion/authorization-requests/{id}/determinations", "POST /infusion/criteria-submissions/{id}/reviews", "POST /infusion/financial-clearances/{id}/clear"] }
  - { priority: 6, category: state, check: "State-machine from-state preconditions and cross-entity state gates (appointment create/dose-change create require auth APPROVED; appeal create requires auth DENIED; clearance create requires auth APPROVED; confirm requires appointment SCHEDULED and auth APPROVED; reviews/verify/decisions/completions require the entity's open from-state)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "Cross-entity gate: parent AuthorizationRequest must be APPROVED for appointment creation and dose-change creation", error_id: ERR_AUTH_NOT_APPROVED, http_status: 409, applies_to: ["POST /infusion/authorization-requests/{id}/appointments", "POST /infusion/authorization-requests/{id}/dose-change-requests", "POST /infusion/authorization-requests/{id}/financial-clearances", "POST /infusion/financial-clearances/{id}/recompute"] }
  - { priority: 7, category: business_safety, check: "requested_dose_mg / new_dose_mg <= policy.max_dose_mg", error_id: ERR_DOSE_EXCEEDS_MAX, http_status: 422, applies_to: ["POST /infusion/authorization-requests", "POST /infusion/authorization-requests/{id}/dose-change-requests"] }
  - { priority: 8, category: business_referential, check: "Submit requires >= 1 VERIFIED BenefitInvestigation; clearance clear requires >= 1 VERIFIED BenefitInvestigation", error_id: ERR_BENEFIT_NOT_VERIFIED, http_status: 422, applies_to: ["POST /infusion/authorization-requests/{id}/submit", "POST /infusion/financial-clearances/{id}/clear"] }
  - { priority: 9, category: business_referential, check: "Submit requires >= 1 ACCEPTED ClinicalCriteriaSubmission (after a pend, one ACCEPTED submission created after pended_at)", error_id: ERR_MISSING_REQUIRED_CRITERIA, http_status: 422, applies_to: ["POST /infusion/authorization-requests/{id}/submit"] }
  - { priority: 10, category: business_referential, check: "Submit requires >= 1 SiteOfCareDetermination", error_id: ERR_SITE_DETERMINATION_MISSING, http_status: 422, applies_to: ["POST /infusion/authorization-requests/{id}/submit"] }
  - { priority: 11, category: business_referential, check: "Appeal creation requires no other Appeal of the same request with status NOT IN {CLOSED_UPHELD, CLOSED_OVERTURNED}", error_id: ERR_DUPLICATE_OPEN_APPEAL, http_status: 409, applies_to: ["POST /infusion/authorization-requests/{id}/appeals"] }
  - { priority: 12, category: business_referential, check: "Financial clearance creation requires no other FinancialClearance of the same request with status IN {ESTIMATED, CLEARED}", error_id: ERR_DUPLICATE_OPEN_CLEARANCE, http_status: 409, applies_to: ["POST /infusion/authorization-requests/{id}/financial-clearances"] }
  - { priority: 13, category: business_referential, check: "Verification channel must satisfy policy.buy_and_bill_required (PHARMACY rejected when required)", error_id: ERR_ROUTING_VIOLATION, http_status: 422, applies_to: ["POST /infusion/benefit-investigations/{id}/verify"] }
  - { priority: 14, category: business_referential, check: "Appointment confirm requires a FinancialClearance of the parent request with status CLEARED (selector: the request's unique clearance with status IN {ESTIMATED, CLEARED} — at most one can exist per ERR_DUPLICATE_OPEN_CLEARANCE)", error_id: ERR_CLEARANCE_NOT_CLEARED, http_status: 422, applies_to: ["POST /infusion/appointments/{id}/confirm"] }
  - { priority: 15, category: business_temporal, check: "Appointment scheduling/confirm requires auth_valid_from <= scheduled_start <= auth_valid_to (closed interval, both bounds inclusive)", error_id: ERR_OUTSIDE_VALIDITY_WINDOW, http_status: 422, applies_to: ["POST /infusion/authorization-requests/{id}/appointments", "POST /infusion/appointments/{id}/confirm"] }
  - { priority: 16, category: business_temporal, check: "Appeal creation requires now <= appeal_deadline", error_id: ERR_APPEAL_WINDOW_CLOSED, http_status: 422, applies_to: ["POST /infusion/authorization-requests/{id}/appeals"] }
  - { priority: 17, category: business_constraint, check: "Appointment chair's site_type must equal the recommended_site_type of the request's latest SiteOfCareDetermination (selector: greatest created_at)", error_id: ERR_SITE_NOT_ALLOWED, http_status: 422, applies_to: ["POST /infusion/authorization-requests/{id}/appointments"] }
  - { priority: 18, category: business_constraint, check: "Chair half-open interval overlap with turnover buffer (per chair_occupied_count)", error_id: ERR_CHAIR_SCHEDULE_CONFLICT, http_status: 409, applies_to: ["POST /infusion/authorization-requests/{id}/appointments"] }
  - { priority: 19, category: business_constraint, check: "Reviewer closed-interval overlap for the same reviewer_user_id; touching endpoints conflict", error_id: ERR_REVIEWER_SLOT_CONFLICT, http_status: 409, applies_to: ["POST /infusion/appeals/{id}/peer-to-peer-reviews", "POST /infusion/peer-to-peer-reviews/{id}/reschedules"] }
  - { priority: 20, category: business_constraint, check: "PayerPolicy (payer_code, drug_code) unique", error_id: ERR_DUPLICATE_POLICY, http_status: 409, applies_to: ["POST /infusion/payer-policies"] }
  - { priority: 21, category: business_fiscal, check: "Clearance clear requires estimated_patient_responsibility_cents <= policy.prepay_limit_cents", error_id: ERR_PREPAY_LIMIT_EXCEEDED, http_status: 402, applies_to: ["POST /infusion/financial-clearances/{id}/clear"] }
  - { priority: 22, category: state, check: "OCC: expected_authorization_version equals the request's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /infusion/authorization-requests/{id}/determinations"] }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/infusion/payer-policies", description: "Create a payer policy (unique payer_code+drug_code)", roles: [PolicyAdmin], code: 201, input: [payer_code, drug_code, regimen_name, benefit_channel, validity_days, max_course_days, max_dose_mg, deductible_cents, coinsurance_pct, oop_max_cents, prepay_limit_cents, "requires_prior_auth?", "buy_and_bill_required?", "pharmacy_validity_days?", "allowed_amount_known?", "discount_rate?", "site_policy?", "steer_threshold?"], output: PayerPolicy, side_effects: [] }
  - { method: GET, path: "/infusion/payer-policies/{id}", description: "Read a payer policy", roles: [PolicyAdmin, AuthCoordinator, MedicalDirector, FinanceSpecialist, Scheduler], code: 200, input: [], output: PayerPolicy, side_effects: [] }
  - { method: POST, path: "/infusion/patients", description: "Register a patient with plan accumulators", roles: [AuthCoordinator], code: 201, input: [member_id, full_name, diagnosis_code, payer_code, plan_year_end, deductible_remaining_cents, oop_remaining_cents, "rural_resident?", "travel_minutes_to_hospital?"], output: Patient, side_effects: [] }
  - { method: GET, path: "/infusion/patients/{id}", description: "Read a patient", roles: [PolicyAdmin, AuthCoordinator, MedicalDirector, FinanceSpecialist, Scheduler], code: 200, input: [], output: Patient, side_effects: [] }
  - { method: GET, path: "/infusion/authorization-requirements/lookup", description: "Drug/regimen authorization requirement lookup by payer_code + drug_code; ERR_POLICY_NOT_FOUND when no policy matches", roles: [PolicyAdmin, AuthCoordinator, MedicalDirector, FinanceSpecialist, Scheduler], code: 200, input: [payer_code, drug_code], output: { policy_id: string, requires_prior_auth: boolean, benefit_channel: string, validity_days: integer, pharmacy_validity_days: integer, max_dose_mg: integer, site_policy: string, buy_and_bill_required: boolean }, side_effects: [] }
  - { method: POST, path: "/infusion/authorization-requests", description: "Create an authorization request in DRAFT; safety dose cap enforced", roles: [AuthCoordinator], code: 201, input: [patient_id, policy_id, requested_site_type, requested_dose_mg, patient_weight_kg, "supersedes_request_id?"], output: AuthorizationRequest, side_effects: ["created_by_user_id = X-User-ID; status DRAFT"] }
  - { method: GET, path: "/infusion/authorization-requests", description: "List authorization requests with filters and pagination", roles: [PolicyAdmin, AuthCoordinator, MedicalDirector, FinanceSpecialist, Scheduler], code: 200, input: ["patient_id?", "policy_id?", "status?", "supersedes_request_id?", "limit?", "offset?"], output: "AuthorizationRequest[]", side_effects: [] }
  - { method: GET, path: "/infusion/authorization-requests/{id}", description: "Read one authorization request", roles: [PolicyAdmin, AuthCoordinator, MedicalDirector, FinanceSpecialist, Scheduler], code: 200, input: [], output: AuthorizationRequest, side_effects: [] }
  - { method: POST, path: "/infusion/authorization-requests/{id}/submit", description: "Submit a DRAFT or resubmit a PENDED request", roles: [AuthCoordinator], code: 200, input: [], output: AuthorizationRequest, side_effects: ["status -> SUBMITTED; submitted_at set; increments AuthorizationRequest.version by 1"] }
  - { method: POST, path: "/infusion/authorization-requests/{id}/determinations", description: "MedicalDirector records APPROVED | DENIED | PENDED with OCC on the request version", roles: [MedicalDirector], code: 200, input: [outcome, expected_authorization_version, "denial_reason?"], output: AuthorizationRequest, side_effects: ["status transition per outcome; on APPROVED compute auth_validity_window; on DENIED set denied_at + appeal_deadline; increments AuthorizationRequest.version by 1"] }
  - { method: POST, path: "/infusion/authorization-requests/{id}/site-of-care-determinations", description: "Run the site-of-care steering determination", roles: [MedicalDirector], code: 201, input: [home_allowed_cents, hospital_allowed_cents, home_billed_cents, hospital_billed_cents], output: SiteOfCareDetermination, side_effects: ["compute site_steering_score; set recommended_site_type/steered"] }
  - { method: GET, path: "/infusion/authorization-requests/{id}/site-of-care-determinations", description: "List site-of-care determinations of a request", roles: [MedicalDirector, AuthCoordinator, Scheduler], code: 200, input: [], output: "SiteOfCareDetermination[]", side_effects: [] }
  - { method: POST, path: "/infusion/authorization-requests/{id}/benefit-investigations", description: "Open a benefit investigation (medical vs pharmacy)", roles: [AuthCoordinator], code: 201, input: [], output: BenefitInvestigation, side_effects: ["status INITIATED"] }
  - { method: GET, path: "/infusion/authorization-requests/{id}/benefit-investigations", description: "List benefit investigations of a request", roles: [AuthCoordinator, FinanceSpecialist, MedicalDirector], code: 200, input: [], output: "BenefitInvestigation[]", side_effects: [] }
  - { method: POST, path: "/infusion/benefit-investigations/{id}/verify", description: "Verify benefit channel and derive buy-and-bill routing", roles: [FinanceSpecialist], code: 200, input: [determined_channel], output: BenefitInvestigation, side_effects: ["status VERIFIED; routing derived; verified_by_user_id set"] }
  - { method: POST, path: "/infusion/authorization-requests/{id}/criteria-submissions", description: "Submit a clinical criterion response", roles: [AuthCoordinator], code: 201, input: [criterion_code, response_value], output: ClinicalCriteriaSubmission, side_effects: ["status SUBMITTED; created_by_user_id set"] }
  - { method: GET, path: "/infusion/authorization-requests/{id}/criteria-submissions", description: "List criteria submissions of a request", roles: [AuthCoordinator, MedicalDirector], code: 200, input: [], output: "ClinicalCriteriaSubmission[]", side_effects: [] }
  - { method: POST, path: "/infusion/criteria-submissions/{id}/reviews", description: "MedicalDirector accepts or rejects a criterion (SoD vs creator)", roles: [MedicalDirector], code: 200, input: [outcome], output: ClinicalCriteriaSubmission, side_effects: ["status ACCEPTED | REJECTED; reviewed_by_user_id set"] }
  - { method: POST, path: "/infusion/authorization-requests/{id}/appeals", description: "Open an appeal on a DENIED request within the appeal window", roles: [AuthCoordinator], code: 201, input: [reason], output: Appeal, side_effects: ["status LEVEL_1"] }
  - { method: GET, path: "/infusion/authorization-requests/{id}/appeals", description: "List appeals of a request", roles: [AuthCoordinator, MedicalDirector], code: 200, input: [], output: "Appeal[]", side_effects: [] }
  - { method: GET, path: "/infusion/appeals/{id}", description: "Read one appeal", roles: [AuthCoordinator, MedicalDirector], code: 200, input: [], output: Appeal, side_effects: [] }
  - { method: POST, path: "/infusion/appeals/{id}/decisions", description: "MedicalDirector decides UPHELD | OVERTURNED at the current level", roles: [MedicalDirector], code: 200, input: [outcome], output: Appeal, side_effects: ["appeal transition per state machine; OVERTURNED cascades auth -> APPROVED with validity recompute; EXTERNAL UPHELD cascades auth -> DENIED_CLOSED"] }
  - { method: POST, path: "/infusion/appeals/{id}/escalations", description: "Escalate LEVEL_1_DECIDED -> LEVEL_2 or LEVEL_2_DECIDED -> EXTERNAL_REVIEW", roles: [AuthCoordinator], code: 200, input: [], output: Appeal, side_effects: ["appeal level transition"] }
  - { method: POST, path: "/infusion/appeals/{id}/peer-to-peer-reviews", description: "Schedule a peer-to-peer call on a decided appeal level", roles: [MedicalDirector], code: 201, input: [reviewer_user_id, scheduled_start, scheduled_end], output: PeerToPeerReview, side_effects: ["status SCHEDULED; reschedule_count 0"] }
  - { method: GET, path: "/infusion/appeals/{id}/peer-to-peer-reviews", description: "List peer-to-peer reviews of an appeal", roles: [MedicalDirector, AuthCoordinator], code: 200, input: [], output: "PeerToPeerReview[]", side_effects: [] }
  - { method: POST, path: "/infusion/peer-to-peer-reviews/{id}/reschedules", description: "Reschedule a SCHEDULED or NO_SHOW review (max 2 reschedules)", roles: [MedicalDirector], code: 200, input: [scheduled_start, scheduled_end], output: PeerToPeerReview, side_effects: ["reschedule_count += 1; status SCHEDULED"] }
  - { method: POST, path: "/infusion/peer-to-peer-reviews/{id}/completions", description: "Complete a peer-to-peer with outcome UPHOLD | OVERTURN; cascades to appeal and request", roles: [MedicalDirector], code: 200, input: [outcome], output: PeerToPeerReview, side_effects: ["status COMPLETED; outcome set; cascade to Appeal and AuthorizationRequest"] }
  - { method: POST, path: "/infusion/authorization-requests/{id}/financial-clearances", description: "Open a financial clearance on an APPROVED request; computes the initial estimate (0 line items)", roles: [FinanceSpecialist], code: 201, input: [], output: FinancialClearance, side_effects: ["method from policy.allowed_amount_known; estimated_patient_responsibility_cents computed; estimated_by_user_id set"] }
  - { method: GET, path: "/infusion/authorization-requests/{id}/financial-clearances", description: "List financial clearances of a request", roles: [FinanceSpecialist, AuthCoordinator], code: 200, input: [], output: "FinancialClearance[]", side_effects: [] }
  - { method: GET, path: "/infusion/financial-clearances/{id}", description: "Read one financial clearance", roles: [FinanceSpecialist, AuthCoordinator], code: 200, input: [], output: FinancialClearance, side_effects: [] }
  - { method: POST, path: "/infusion/financial-clearances/{id}/line-items", description: "Add a responsibility line item to an ESTIMATED clearance; recomputes the estimate", roles: [FinanceSpecialist], code: 201, input: [description, allowed_amount_cents, billed_charges_cents], output: ResponsibilityLineItem, side_effects: ["patient_share_cents computed; clearance estimate recomputed"] }
  - { method: GET, path: "/infusion/financial-clearances/{id}/line-items", description: "List line items of a clearance", roles: [FinanceSpecialist, AuthCoordinator], code: 200, input: [], output: "ResponsibilityLineItem[]", side_effects: [] }
  - { method: POST, path: "/infusion/responsibility-line-items/{id}/voids", description: "Void an ACTIVE line item; recomputes the estimate", roles: [FinanceSpecialist], code: 200, input: [], output: ResponsibilityLineItem, side_effects: ["status VOIDED; clearance estimate recomputed"] }
  - { method: POST, path: "/infusion/financial-clearances/{id}/clear", description: "Clear an ESTIMATED clearance (SoD vs estimator; prepay limit)", roles: [FinanceSpecialist], code: 200, input: [], output: FinancialClearance, side_effects: ["status CLEARED; cleared_by_user_id set"] }
  - { method: POST, path: "/infusion/financial-clearances/{id}/recompute", description: "Move ON_HOLD -> ESTIMATED with a recomputed estimate once the parent request is APPROVED again", roles: [FinanceSpecialist], code: 200, input: [], output: FinancialClearance, side_effects: ["estimate recomputed; status ESTIMATED"] }
  - { method: POST, path: "/infusion/infusion-chairs", description: "Create an infusion chair resource", roles: [PolicyAdmin], code: 201, input: [site_type, label, "turnover_buffer_minutes?"], output: InfusionChair, side_effects: [] }
  - { method: GET, path: "/infusion/infusion-chairs/{id}", description: "Read one chair", roles: [PolicyAdmin, Scheduler, AuthCoordinator], code: 200, input: [], output: InfusionChair, side_effects: [] }
  - { method: GET, path: "/infusion/infusion-chairs/{id}/appointments", description: "List appointments occupying a chair", roles: [PolicyAdmin, Scheduler, AuthCoordinator], code: 200, input: [], output: "InfusionAppointment[]", side_effects: [] }
  - { method: POST, path: "/infusion/authorization-requests/{id}/appointments", description: "Schedule an infusion within the authorization validity window on a matching-site chair", roles: [Scheduler], code: 201, input: [chair_id, scheduled_start, scheduled_end], output: InfusionAppointment, side_effects: ["status SCHEDULED; chair occupation held"] }
  - { method: GET, path: "/infusion/authorization-requests/{id}/appointments", description: "List appointments of a request", roles: [Scheduler, AuthCoordinator, MedicalDirector], code: 200, input: [], output: "InfusionAppointment[]", side_effects: [] }
  - { method: POST, path: "/infusion/appointments/{id}/confirm", description: "Confirm a SCHEDULED appointment (requires auth APPROVED, clearance CLEARED, window)", roles: [Scheduler], code: 200, input: [], output: InfusionAppointment, side_effects: ["status CONFIRMED"] }
  - { method: POST, path: "/infusion/appointments/{id}/cancel", description: "Cancel a SCHEDULED or CONFIRMED appointment; releases chair occupation", roles: [Scheduler], code: 200, input: [], output: InfusionAppointment, side_effects: ["status CANCELLED; chair occupation released"] }
  - { method: POST, path: "/infusion/authorization-requests/{id}/dose-change-requests", description: "Request a dose change on an APPROVED authorization; computes delta_pct and reauth_required; a reauth-required creation places the clearance ON_HOLD", roles: [AuthCoordinator], code: 201, input: [new_dose_mg], output: DoseChangeRequest, side_effects: ["delta_pct/reauth_required computed; if reauth_required and the request has a clearance with status ESTIMATED (at most one, per ERR_DUPLICATE_OPEN_CLEARANCE): clearance -> ON_HOLD"] }
  - { method: GET, path: "/infusion/authorization-requests/{id}/dose-change-requests", description: "List dose-change requests of a request", roles: [AuthCoordinator, MedicalDirector], code: 200, input: [], output: "DoseChangeRequest[]", side_effects: [] }
  - { method: POST, path: "/infusion/dose-change-requests/{id}/decisions", description: "MedicalDirector approves or rejects a dose change; approval with reauth_required supersedes the authorization and cancels its future appointments", roles: [MedicalDirector], code: 200, input: [outcome], output: DoseChangeRequest, side_effects: ["status APPROVED | REJECTED; supersede cascade or approved_dose_mg update"] }
  - { method: POST, path: "/infusion/_clock/set_current_utc", description: "Test-driving logical clock. Server startup default is exactly 2026-08-01T00:00:00Z (no wall-clock fallback). Setting the clock synchronously applies all time-based transitions: auth EXPIRED past auth_valid_to, appointment MISSED/COMPLETED, peer-to-peer NO_SHOW.", roles: [PolicyAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["applies time-based auto-transitions"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header, or undeclared role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for the endpoint" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID attempts a step forbidden to the creator/estimator of the resource" }
  - { id: ERR_VALIDATION_FAILED, http: 400, condition: "Missing required field, invalid enum value, unparseable datetime, or scheduled_end <= scheduled_start" }
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "patient_id does not exist" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "policy_id does not exist, or requirement lookup matches no policy" }
  - { id: ERR_AUTH_REQUEST_NOT_FOUND, http: 404, condition: "authorization request id does not exist" }
  - { id: ERR_CRITERIA_SUBMISSION_NOT_FOUND, http: 404, condition: "criteria submission id does not exist" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "appeal id does not exist" }
  - { id: ERR_P2P_NOT_FOUND, http: 404, condition: "peer-to-peer review id does not exist" }
  - { id: ERR_BENEFIT_INVESTIGATION_NOT_FOUND, http: 404, condition: "benefit investigation id does not exist" }
  - { id: ERR_CLEARANCE_NOT_FOUND, http: 404, condition: "financial clearance id does not exist" }
  - { id: ERR_LINE_ITEM_NOT_FOUND, http: 404, condition: "responsibility line item id does not exist" }
  - { id: ERR_CHAIR_NOT_FOUND, http: 404, condition: "infusion chair id does not exist" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "appointment id does not exist" }
  - { id: ERR_DOSE_CHANGE_NOT_FOUND, http: 404, condition: "dose-change request id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State-machine from-state precondition violated (including terminal-state lockdown)" }
  - { id: ERR_AUTH_NOT_APPROVED, http: 409, condition: "Operation requires the parent AuthorizationRequest in APPROVED status" }
  - { id: ERR_DUPLICATE_POLICY, http: 409, condition: "A PayerPolicy with the same (payer_code, drug_code) already exists" }
  - { id: ERR_DUPLICATE_OPEN_APPEAL, http: 409, condition: "An appeal with status NOT IN {CLOSED_UPHELD, CLOSED_OVERTURNED} already exists for the request" }
  - { id: ERR_DUPLICATE_OPEN_CLEARANCE, http: 409, condition: "A FinancialClearance with status IN {ESTIMATED, CLEARED} already exists for the request" }
  - { id: ERR_CHAIR_SCHEDULE_CONFLICT, http: 409, condition: "Chair half-open interval (with turnover buffer) overlaps an existing occupation" }
  - { id: ERR_REVIEWER_SLOT_CONFLICT, http: 409, condition: "Reviewer closed-interval overlap; touching endpoints conflict" }
  - { id: ERR_P2P_RESCHEDULE_LIMIT, http: 409, condition: "Third reschedule attempt (reschedule_count already 2)" }
  - { id: ERR_MISSING_REQUIRED_CRITERIA, http: 422, condition: "Submit without an ACCEPTED criteria submission (or, after a pend, without a fresh ACCEPTED submission created after pended_at)" }
  - { id: ERR_SITE_DETERMINATION_MISSING, http: 422, condition: "Submit without any SiteOfCareDetermination" }
  - { id: ERR_BENEFIT_NOT_VERIFIED, http: 422, condition: "Submit/clear without a VERIFIED benefit investigation" }
  - { id: ERR_CLEARANCE_NOT_CLEARED, http: 422, condition: "Appointment confirm without a CLEARED financial clearance" }
  - { id: ERR_DOSE_EXCEEDS_MAX, http: 422, condition: "Dose above policy.max_dose_mg safety ceiling" }
  - { id: ERR_SITE_NOT_ALLOWED, http: 422, condition: "Chair site_type differs from the latest determination's recommended_site_type" }
  - { id: ERR_OUTSIDE_VALIDITY_WINDOW, http: 422, condition: "scheduled_start outside the closed authorization validity window" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "Appeal attempted after appeal_deadline" }
  - { id: ERR_ROUTING_VIOLATION, http: 422, condition: "PHARMACY verification on a buy-and-bill-required policy" }
  - { id: ERR_PREPAY_LIMIT_EXCEEDED, http: 402, condition: "estimated_patient_responsibility_cents exceeds policy.prepay_limit_cents at clear" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_authorization_version does not match the request's current version (OCC)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PolicyAdmin
    description: "Payer policy and chair configuration administrator; operates the test clock"
    identity: opaque
    exclusive_operations: ["POST /infusion/payer-policies", "POST /infusion/infusion-chairs", "POST /infusion/_clock/set_current_utc"]
    shared_operations: ["GET reads across resources", "GET /infusion/authorization-requirements/lookup"]
  - name: AuthCoordinator
    description: "Infusion authorization coordinator; owns intake, submission, criteria, appeals, dose changes"
    identity: opaque
    exclusive_operations: ["POST /infusion/patients", "POST /infusion/authorization-requests", "POST /infusion/authorization-requests/{id}/submit", "POST /infusion/authorization-requests/{id}/criteria-submissions", "POST /infusion/authorization-requests/{id}/benefit-investigations", "POST /infusion/authorization-requests/{id}/appeals", "POST /infusion/appeals/{id}/escalations", "POST /infusion/authorization-requests/{id}/dose-change-requests"]
    shared_operations: ["GET reads across resources", "GET /infusion/authorization-requirements/lookup"]
  - name: MedicalDirector
    description: "Payer medical reviewer; determinations, criteria reviews, appeal decisions, peer-to-peer"
    identity: opaque
    exclusive_operations: ["POST /infusion/authorization-requests/{id}/determinations", "POST /infusion/authorization-requests/{id}/site-of-care-determinations", "POST /infusion/criteria-submissions/{id}/reviews", "POST /infusion/appeals/{id}/decisions", "POST /infusion/appeals/{id}/peer-to-peer-reviews", "POST /infusion/peer-to-peer-reviews/{id}/reschedules", "POST /infusion/peer-to-peer-reviews/{id}/completions", "POST /infusion/dose-change-requests/{id}/decisions"]
    shared_operations: ["GET reads across resources", "GET /infusion/authorization-requirements/lookup"]
  - name: FinanceSpecialist
    description: "Benefit verification and financial clearance specialist"
    identity: opaque
    exclusive_operations: ["POST /infusion/benefit-investigations/{id}/verify", "POST /infusion/authorization-requests/{id}/financial-clearances", "POST /infusion/financial-clearances/{id}/line-items", "POST /infusion/responsibility-line-items/{id}/voids", "POST /infusion/financial-clearances/{id}/clear", "POST /infusion/financial-clearances/{id}/recompute"]
    shared_operations: ["GET reads across resources", "GET /infusion/authorization-requirements/lookup"]
  - name: Scheduler
    description: "Infusion scheduling coordinator; books, confirms and cancels chair appointments"
    identity: opaque
    exclusive_operations: ["POST /infusion/authorization-requests/{id}/appointments", "POST /infusion/appointments/{id}/confirm", "POST /infusion/appointments/{id}/cancel"]
    shared_operations: ["GET reads across resources", "GET /infusion/authorization-requirements/lookup"]
