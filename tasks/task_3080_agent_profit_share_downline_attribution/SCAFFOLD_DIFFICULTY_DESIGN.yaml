scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (two variants, DIFFERENT entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: profit_provisional_vs_final_period_close
        grounds:
          - calculations.market_center_profit
          - entities.ProfitSharePeriod.fields.provisional_profit
          - entities.ProfitSharePeriod.fields.final_profit
          - state_machines.ProfitSharePeriod.FINAL_CLOSE_PENDING_to_FINAL_CLOSED
        distinguishing_aspect: |
          Dual-variant divergence on the ProfitSharePeriod entity domain: the
          PROVISIONAL (forward-looking, POSTED+SETTLED) and FINAL (chronological,
          SETTLED-only) variants of the same period yield provisional_profit 8500.00
          vs final_profit 5500.00 for identical ledger data, because one 10000.00
          commission stays unsettled.
        test_recipe:
          setup:
            - "Market center MC with ACTIVE mca (unsponsored), s1 (sponsored by mca), d1 (sponsored by s1)"
            - "s1 has a 10000.00 POSTED commission (never settled); d1 has a 20000.00 SETTLED commission, both occurred_on 2026-09-10"
            - "Period 2026-09 with a 500.00 EXPENSE entry; ALC chair agent alc enrolled in MC"
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "S One", email: "s1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { s1: $.data.id } }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-s1-att", attested_sponsor_agent_id: "${mca}" }, as: PlatformAdmin }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-s1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-s1-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "D One", email: "d1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${s1}" }, as: PlatformAdmin, captures: { d1: $.data.id } }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-d1-att", attested_sponsor_agent_id: "${s1}" }, as: PlatformAdmin }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-d1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-d1-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "ALC Chair", email: "alc@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { alc: $.data.id } }
            - { call: "POST /agents/${alc}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-alc-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${alc}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-alc-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${s1}", as: PlatformAdmin, captures: { s1v: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${s1}", gross_commission: 10000.00, occurred_on: "2026-09-10T00:00:00Z", external_ref: "ref-s1-1", expected_agent_version: "${s1v}" }, as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "GET /agents/${d1}", as: PlatformAdmin, captures: { d1v: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${d1}", gross_commission: 20000.00, occurred_on: "2026-09-10T00:00:00Z", external_ref: "ref-d1-1", expected_agent_version: "${d1v}" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { ev_d1: $.data.id } }
            - { call: "POST /commission-events/${ev_d1}/settle", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /market-centers/${mc}/profit-share-periods", payload: { period_month: "2026-09" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { per: $.data.id } }
            - { call: "POST /profit-share-periods/${per}/ledger-entries", payload: { entry_type: "EXPENSE", amount: 500.00 }, as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /profit-share-periods/${per}/preliminary-close", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /profit-share-periods/${per}/governance-resolutions", payload: { resolution_type: "FINAL_CLOSE_RATIFICATION" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { res: $.data.id } }
            - { call: "POST /governance-resolutions/${res}/propose", as: MarketCenterAdmin, as_user_id: "${mca}" }
          trigger:
            - { call: "POST /governance-resolutions/${res}/ratify", as: ALCChair, as_user_id: "${alc}" }
            - { call: "GET /profit-share-periods/${per}", as: PlatformAdmin, captures: { prov: $.data.provisional_profit, fin: $.data.final_profit, poolp: $.data.provisional_pool, poolf: $.data.profit_share_pool } }
          assert:
            - "ProfitSharePeriod.${per}.provisional_profit == 8500.00"
            - "ProfitSharePeriod.${per}.final_profit == 5500.00"
            - "ProfitSharePeriod.${per}.provisional_pool == 4420.00"
            - "ProfitSharePeriod.${per}.profit_share_pool == 2860.00"
            - "provisional_profit != final_profit for identical ledger entries (the unsettled 10000.00 event is excluded from FINAL)"

      - name: cap_split_provisional_vs_final_event_replay
        grounds:
          - calculations.agent_cap_split
          - calculations.final_cap_replay
          - entities.CommissionEvent.fields.company_dollar
          - entities.CommissionEvent.fields.final_company_dollar
        distinguishing_aspect: |
          Dual-variant divergence on the CommissionEvent/Agent cap-accounting domain
          (different entity domain from ProfitSharePeriod P&L): an event posted but
          never settled keeps provisional company_dollar 3000.00 while its FINAL
          replay value is 0.00, and the settled sibling replays to exactly 6000.00.
        test_recipe:
          setup:
            - "Same fixture shape as profit_provisional_vs_final_period_close: s1 POSTED 10000.00 (never settled), d1 SETTLED 20000.00; period 2026-09 preliminary-closed and proposed"
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "S One", email: "s1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { s1: $.data.id } }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-s1-att", attested_sponsor_agent_id: "${mca}" }, as: PlatformAdmin }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-s1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-s1-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "D One", email: "d1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${s1}" }, as: PlatformAdmin, captures: { d1: $.data.id } }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-d1-att", attested_sponsor_agent_id: "${s1}" }, as: PlatformAdmin }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-d1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-d1-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "ALC Chair", email: "alc@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { alc: $.data.id } }
            - { call: "POST /agents/${alc}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-alc-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${alc}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-alc-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${s1}", as: PlatformAdmin, captures: { s1v: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${s1}", gross_commission: 10000.00, occurred_on: "2026-09-10T00:00:00Z", external_ref: "ref-s1-1", expected_agent_version: "${s1v}" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { ev_s1: $.data.id } }
            - { call: "GET /agents/${d1}", as: PlatformAdmin, captures: { d1v: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${d1}", gross_commission: 20000.00, occurred_on: "2026-09-10T00:00:00Z", external_ref: "ref-d1-1", expected_agent_version: "${d1v}" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { ev_d1: $.data.id } }
            - { call: "POST /commission-events/${ev_d1}/settle", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /market-centers/${mc}/profit-share-periods", payload: { period_month: "2026-09" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { per: $.data.id } }
            - { call: "POST /profit-share-periods/${per}/ledger-entries", payload: { entry_type: "EXPENSE", amount: 500.00 }, as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /profit-share-periods/${per}/preliminary-close", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /profit-share-periods/${per}/governance-resolutions", payload: { resolution_type: "FINAL_CLOSE_RATIFICATION" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { res: $.data.id } }
            - { call: "POST /governance-resolutions/${res}/propose", as: MarketCenterAdmin, as_user_id: "${mca}" }
          trigger:
            - { call: "POST /governance-resolutions/${res}/ratify", as: ALCChair, as_user_id: "${alc}" }
            - { call: "GET /commission-events/${ev_s1}", as: PlatformAdmin, captures: { s1prov: $.data.company_dollar, s1fin: $.data.final_company_dollar } }
            - { call: "GET /commission-events/${ev_d1}", as: PlatformAdmin, captures: { d1prov: $.data.company_dollar, d1fin: $.data.final_company_dollar } }
          assert:
            - "CommissionEvent.${ev_s1}.company_dollar == 3000.00 (provisional split stands on the POSTED event)"
            - "CommissionEvent.${ev_s1}.final_company_dollar == 0.00 (SETTLED-only replay excludes the never-settled event)"
            - "CommissionEvent.${ev_d1}.final_company_dollar == 6000.00 (matches its provisional value because d1 was far below the cap)"
            - "The two variants diverge on ${ev_s1}: 3000.00 provisional vs 0.00 final"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (instances in DIFFERENT modes a / b / c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cap_split_nested_min_max_with_rollover_branch
        grounds:
          - calculations.agent_cap_split
          - entities.Agent.fields.accrued_company_dollar
          - state_machines.Agent
        distinguishing_aspect: |
          Mode (a) — a >=3-input formula with non-linear interaction: company dollar
          is min(round2(gross*0.30), max(0, 20000 - accrued)) with a conditional
          cap-year rollover branch on occurred_on; a mid-cap-year post of 40000.00
          against accrued 12000.00 yields 8000.00 (cap bound, not rate bound) and
          flips CAPPED at exactly 20000.00.
        test_recipe:
          setup:
            - "ACTIVE agent a1 (unsponsored) in center MC; one prior 40000.00 commission posted 2026-09-05 leaving accrued_company_dollar 12000.00, cap_status UNCAPPED"
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id } }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-a1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-a1-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { a1v: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${a1}", gross_commission: 40000.00, occurred_on: "2026-09-05T00:00:00Z", external_ref: "ref-a1-1", expected_agent_version: "${a1v}" }, as: MarketCenterAdmin, as_user_id: "${a1}", captures: { ev1: $.data.id } }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { a1v2: $.data.version } }
          trigger:
            - { call: "POST /commission-events", payload: { agent_id: "${a1}", gross_commission: 40000.00, occurred_on: "2026-09-20T00:00:00Z", external_ref: "ref-a1-2", expected_agent_version: "${a1v2}" }, as: MarketCenterAdmin, as_user_id: "${a1}", captures: { ev2: $.data.id } }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { a1cap: $.data.cap_status, a1acc: $.data.accrued_company_dollar } }
          assert:
            - "CommissionEvent.${ev1}.company_dollar == 12000.00 (rate bound: round2(40000*0.30))"
            - "CommissionEvent.${ev2}.company_dollar == 8000.00 (cap bound: max(0, 20000-12000), not the 12000.00 rate value)"
            - "CommissionEvent.${ev2}.cap_applied == true"
            - "CommissionEvent.${ev2}.agent_retained == 32000.00"
            - "Agent.${a1}.accrued_company_dollar == 20000.00 and Agent.${a1}.cap_status == CAPPED"

      - name: distribution_per_line_rounding_then_sum
        grounds:
          - calculations.profit_share_distribution
          - entities.ProfitShareDistribution.fields.level_breakdown
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: each entitlement line
          round2(0.50 * 333.33) = 166.67 is rounded per line BEFORE summing, giving
          sponsor distribution 500.01; the prohibited sum-then-round order would
          give 500.00. The scaffold pins per-line-then-sum and the center retains
          pool - distributed = 19.98.
        test_recipe:
          setup:
            - "ACTIVE chain: mca (unsponsored) sponsors s1; s1 sponsors x1, x2, x3 — all joined 2026-09-01"
            - "x1, x2, x3 each post and settle a 1111.10 commission occurred_on 2026-09-10 (company dollar 333.33 each)"
            - "Period 2026-09 with no ledger entries; ALC chair alc enrolled"
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "S One", email: "s1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { s1: $.data.id } }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-s1-att", attested_sponsor_agent_id: "${mca}" }, as: PlatformAdmin }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-s1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-s1-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "X One", email: "x1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${s1}" }, as: PlatformAdmin, captures: { x1: $.data.id } }
            - { call: "POST /agents/${x1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-x1-att", attested_sponsor_agent_id: "${s1}" }, as: PlatformAdmin }
            - { call: "POST /agents/${x1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-x1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${x1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-x1-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "X Two", email: "x2@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${s1}" }, as: PlatformAdmin, captures: { x2: $.data.id } }
            - { call: "POST /agents/${x2}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-x2-att", attested_sponsor_agent_id: "${s1}" }, as: PlatformAdmin }
            - { call: "POST /agents/${x2}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-x2-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${x2}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-x2-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "X Three", email: "x3@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${s1}" }, as: PlatformAdmin, captures: { x3: $.data.id } }
            - { call: "POST /agents/${x3}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-x3-att", attested_sponsor_agent_id: "${s1}" }, as: PlatformAdmin }
            - { call: "POST /agents/${x3}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-x3-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${x3}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-x3-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "ALC Chair", email: "alc@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { alc: $.data.id } }
            - { call: "POST /agents/${alc}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-alc-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${alc}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-alc-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${x1}", as: PlatformAdmin, captures: { x1v: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${x1}", gross_commission: 1111.10, occurred_on: "2026-09-10T00:00:00Z", external_ref: "ref-x1", expected_agent_version: "${x1v}" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { ex1: $.data.id } }
            - { call: "POST /commission-events/${ex1}/settle", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "GET /agents/${x2}", as: PlatformAdmin, captures: { x2v: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${x2}", gross_commission: 1111.10, occurred_on: "2026-09-10T00:00:00Z", external_ref: "ref-x2", expected_agent_version: "${x2v}" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { ex2: $.data.id } }
            - { call: "POST /commission-events/${ex2}/settle", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "GET /agents/${x3}", as: PlatformAdmin, captures: { x3v: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${x3}", gross_commission: 1111.10, occurred_on: "2026-09-10T00:00:00Z", external_ref: "ref-x3", expected_agent_version: "${x3v}" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { ex3: $.data.id } }
            - { call: "POST /commission-events/${ex3}/settle", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /market-centers/${mc}/profit-share-periods", payload: { period_month: "2026-09" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { per: $.data.id } }
            - { call: "POST /profit-share-periods/${per}/preliminary-close", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /profit-share-periods/${per}/governance-resolutions", payload: { resolution_type: "FINAL_CLOSE_RATIFICATION" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { res: $.data.id } }
            - { call: "POST /governance-resolutions/${res}/propose", as: MarketCenterAdmin, as_user_id: "${mca}" }
          trigger:
            - { call: "POST /governance-resolutions/${res}/ratify", as: ALCChair, as_user_id: "${alc}" }
            - { call: "GET /profit-share-distributions", as: PlatformAdmin, payload: { period_id: "${per}", agent_id: "${s1}" }, captures: { s1amt: "$.data[0].amount" } }
            - { call: "GET /profit-share-periods/${per}", as: PlatformAdmin, captures: { pool: $.data.profit_share_pool, ret: $.data.center_retained_amount, dist: $.data.distributed_total } }
          assert:
            - "ProfitSharePeriod.${per}.final_profit == 999.99 and profit_share_pool == 519.99"
            - "Distribution for agent ${s1}: amount == 500.01 (per-line rounding 166.67 x 3, NOT the sum-then-round value 500.00)"
            - "ProfitSharePeriod.${per}.distributed_total == 500.01"
            - "ProfitSharePeriod.${per}.center_retained_amount == 19.98"
            - "distributed_total + center_retained_amount == profit_share_pool"

      - name: final_replay_evaluation_order_tiebreak
        grounds:
          - calculations.final_cap_replay
          - entities.CommissionEvent.fields.final_company_dollar
        distinguishing_aspect: |
          Mode (c) — pinned evaluation order: the FINAL replay processes SETTLED
          events occurred_on ASC with tie-break created_at ASC (never id, never
          gross). An out-of-order creation (September event posted AFTER a December
          rollover event) still replays in business order, so the December event's
          final_company_dollar is 3000.00 (fresh cap year) while the September
          event's is 6000.00 against the prior year — replay order is decoupled
          from posting order.
        test_recipe:
          setup:
            - "ACTIVE agent a1 (unsponsored), join 2026-09-01; cap year [2026-09-01, 2027-09-01)"
            - "ev_sep: 20000.00 occurred_on 2026-09-10, posted and settled FIRST (company dollar 6000.00)"
            - "ev_dec: 10000.00 occurred_on 2026-12-10, posted and settled SECOND (posting rolls the cap year; provisional company dollar 3000.00)"
            - "Period 2026-12 preliminary-closed and proposed; ALC chair alc"
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id } }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-a1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-a1-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "ALC Chair", email: "alc@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { alc: $.data.id } }
            - { call: "POST /agents/${alc}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-alc-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${alc}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-alc-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { v1: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${a1}", gross_commission: 20000.00, occurred_on: "2026-09-10T00:00:00Z", external_ref: "ref-sep", expected_agent_version: "${v1}" }, as: MarketCenterAdmin, as_user_id: "${a1}", captures: { ev_sep: $.data.id } }
            - { call: "POST /commission-events/${ev_sep}/settle", as: MarketCenterAdmin, as_user_id: "${a1}" }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { v2: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${a1}", gross_commission: 10000.00, occurred_on: "2026-12-10T00:00:00Z", external_ref: "ref-dec", expected_agent_version: "${v2}" }, as: MarketCenterAdmin, as_user_id: "${a1}", captures: { ev_dec: $.data.id } }
            - { call: "POST /commission-events/${ev_dec}/settle", as: MarketCenterAdmin, as_user_id: "${a1}" }
            - { call: "POST /market-centers/${mc}/profit-share-periods", payload: { period_month: "2026-12" }, as: MarketCenterAdmin, as_user_id: "${a1}", captures: { per: $.data.id } }
            - { call: "POST /profit-share-periods/${per}/preliminary-close", as: MarketCenterAdmin, as_user_id: "${a1}" }
            - { call: "POST /profit-share-periods/${per}/governance-resolutions", payload: { resolution_type: "FINAL_CLOSE_RATIFICATION" }, as: MarketCenterAdmin, as_user_id: "${a1}", captures: { res: $.data.id } }
            - { call: "POST /governance-resolutions/${res}/propose", as: MarketCenterAdmin, as_user_id: "${a1}" }
          trigger:
            - { call: "POST /governance-resolutions/${res}/ratify", as: ALCChair, as_user_id: "${alc}" }
            - { call: "GET /commission-events/${ev_sep}", as: PlatformAdmin, captures: { sepfin: $.data.final_company_dollar } }
            - { call: "GET /commission-events/${ev_dec}", as: PlatformAdmin, captures: { decfin: $.data.final_company_dollar } }
            - { call: "GET /profit-share-periods/${per}", as: PlatformAdmin, captures: { fin: $.data.final_profit } }
          assert:
            - "CommissionEvent.${ev_sep}.final_company_dollar == 6000.00 (prior cap year, replayed first under occurred_on ASC)"
            - "CommissionEvent.${ev_dec}.final_company_dollar == 3000.00 (fresh cap year: replay of ev_sep (2026-09-10) precedes ev_dec (2026-12-10) under occurred_on ASC, and the anniversary boundary resets the replay accrual between them)"
            - "ProfitSharePeriod.${per}.final_profit == 3000.00 (only the December event's replayed company dollar counts toward the December period)"
            - "Replay order followed occurred_on ASC, not the posting/creation order — the evaluation order is pinned, not arrival-dependent"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (DIFFERENT entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: agent_parallel_membership_and_cap_dimensions
        grounds:
          - state_machines.Agent
          - entities.Agent.fields.membership_status
          - entities.Agent.fields.cap_status
        distinguishing_aspect: |
          Agent carries two independent state dimensions on one row:
          membership_status (ENROLLED_PENDING_DOCS->ACTIVE->DEPARTED) and cap_status
          (UNCAPPED<->CAPPED, a reversible cycle via void). Driving cap_status to
          CAPPED leaves membership_status ACTIVE, and voiding the capping event
          reverts cap_status to UNCAPPED while membership stays ACTIVE.
        test_recipe:
          setup:
            - "ACTIVE agent a1 (unsponsored) with accrued_company_dollar 12000.00 from a 40000.00 post"
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id } }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-a1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-a1-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { v1: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${a1}", gross_commission: 40000.00, occurred_on: "2026-09-05T00:00:00Z", external_ref: "ref-a1-1", expected_agent_version: "${v1}" }, as: MarketCenterAdmin, as_user_id: "${a1}" }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { v2: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${a1}", gross_commission: 40000.00, occurred_on: "2026-09-20T00:00:00Z", external_ref: "ref-a1-2", expected_agent_version: "${v2}" }, as: MarketCenterAdmin, as_user_id: "${a1}", captures: { ev2: $.data.id } }
          trigger:
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { mem: $.data.membership_status, cap: $.data.cap_status } }
            - { call: "POST /commission-events/${ev2}/void", as: MarketCenterAdmin, as_user_id: "${a1}" }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { mem2: $.data.membership_status, cap2: $.data.cap_status, acc2: $.data.accrued_company_dollar } }
          assert:
            - "After capping post: Agent.${a1}.cap_status == CAPPED while Agent.${a1}.membership_status == ACTIVE (dimensions independent)"
            - "After void: Agent.${a1}.cap_status == UNCAPPED (CAPPED -> UNCAPPED cycle via compensation) and accrued_company_dollar == 12000.00"
            - "Agent.${a1}.membership_status == ACTIVE throughout — the void touched only the cap dimension"

      - name: dispute_resolve_appeal_reopen_cycle
        grounds:
          - state_machines.SponsorshipDispute
          - entities.SponsorshipDispute.fields.appeal_count
        distinguishing_aspect: |
          SponsorshipDispute is cyclic (different entity from Agent):
          FILED->UNDER_REVIEW->RESOLVED_UPHELD->REOPENED->UNDER_REVIEW->
          RESOLVED_OVERTURNED, with appeal_count gating the loop (max 1) so the
          second resolution is final — a cycle with a termination counter, not a
          pipeline.
        test_recipe:
          setup:
            - "ACTIVE mca sponsors both r1 and s2 in center MC; s2's SPONSOR_ATTESTATION (doc att) names r1 while recorded sponsor is mca"
            - "r1 files a dispute over s2 citing att; dispute resolved UPHELD once"
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "R One", email: "r1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { r1: $.data.id } }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-r1-att", attested_sponsor_agent_id: "${mca}" }, as: PlatformAdmin }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-r1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-r1-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "S Two", email: "s2@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { s2: $.data.id } }
            - { call: "POST /agents/${s2}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-s2-att", attested_sponsor_agent_id: "${r1}" }, as: PlatformAdmin, captures: { att: $.data.id } }
            - { call: "POST /agents/${s2}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-s2-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${s2}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-s2-w9" }, as: PlatformAdmin }
            - { call: "POST /sponsorship-disputes", payload: { sponsored_agent_id: "${s2}", evidence_document_id: "${att}", reason: "Paperwork names me" }, as: Agent, as_user_id: "${r1}", captures: { dsp: $.data.id } }
            - { call: "POST /sponsorship-disputes/${dsp}/open-review", as: RegionalDirector }
            - { call: "POST /sponsorship-disputes/${dsp}/resolve", payload: { outcome: "UPHELD" }, as: RegionalDirector }
          trigger:
            - { call: "POST /sponsorship-disputes/${dsp}/appeal", payload: { reason: "New evidence" }, as: Agent, as_user_id: "${r1}" }
            - { call: "POST /sponsorship-disputes/${dsp}/open-review", as: RegionalDirector }
            - { call: "POST /sponsorship-disputes/${dsp}/resolve", payload: { outcome: "OVERTURNED" }, as: RegionalDirector, captures: { final_status: $.data.status, ac: $.data.appeal_count } }
          assert:
            - "SponsorshipDispute.${dsp} traversed RESOLVED_UPHELD -> REOPENED -> UNDER_REVIEW -> RESOLVED_OVERTURNED (full cycle)"
            - "SponsorshipDispute.${dsp}.appeal_count == 1"
            - "After OVERTURNED: Agent.${s2}.sponsor_agent_id == ${r1} (re-pointed to filer)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (depth >= 3 and depth >= 2, different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: ratify_final_close_cascade_depth4
        grounds:
          - state_machines.GovernanceResolution.PROPOSED_to_RATIFIED
          - state_machines.ProfitSharePeriod.FINAL_CLOSE_PENDING_to_FINAL_CLOSED
          - state_machines.ProfitShareDistribution.PROJECTION_to_PAYABLE
          - entities.Agent.fields.pending_payable_profit_share
        distinguishing_aspect: |
          Depth-4 chain from a single trigger (ratify): GovernanceResolution
          PROPOSED->RATIFIED mutates ProfitSharePeriod -> FINAL_CLOSED; that
          mutation mutates each ProfitShareDistribution PROJECTION->PAYABLE (FINAL
          recompute); that mutation recomputes each recipient Agent
          .pending_payable_profit_share (mca 476.67, s1 2383.33) and re-evaluates
          linked VestingSchedules — each hop caused by the previous hop, not by
          the ratify call directly.
        test_recipe:
          setup:
            - "Chain mca -> s1 -> d1; s1 POSTED 10000.00 (unsettled), d1 SETTLED 20000.00; period 2026-09 with 500.00 expense, preliminary-closed (PROJECTION distributions mca 1820.00 / s1 2600.00) and proposed; ALC chair alc"
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "S One", email: "s1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { s1: $.data.id } }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-s1-att", attested_sponsor_agent_id: "${mca}" }, as: PlatformAdmin }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-s1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-s1-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "D One", email: "d1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${s1}" }, as: PlatformAdmin, captures: { d1: $.data.id } }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-d1-att", attested_sponsor_agent_id: "${s1}" }, as: PlatformAdmin }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-d1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-d1-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "ALC Chair", email: "alc@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { alc: $.data.id } }
            - { call: "POST /agents/${alc}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-alc-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${alc}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-alc-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${s1}", as: PlatformAdmin, captures: { s1v: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${s1}", gross_commission: 10000.00, occurred_on: "2026-09-10T00:00:00Z", external_ref: "ref-s1-1", expected_agent_version: "${s1v}" }, as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "GET /agents/${d1}", as: PlatformAdmin, captures: { d1v: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${d1}", gross_commission: 20000.00, occurred_on: "2026-09-10T00:00:00Z", external_ref: "ref-d1-1", expected_agent_version: "${d1v}" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { ev_d1: $.data.id } }
            - { call: "POST /commission-events/${ev_d1}/settle", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /market-centers/${mc}/profit-share-periods", payload: { period_month: "2026-09" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { per: $.data.id } }
            - { call: "POST /profit-share-periods/${per}/ledger-entries", payload: { entry_type: "EXPENSE", amount: 500.00 }, as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /profit-share-periods/${per}/preliminary-close", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /profit-share-periods/${per}/governance-resolutions", payload: { resolution_type: "FINAL_CLOSE_RATIFICATION" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { res: $.data.id } }
            - { call: "POST /governance-resolutions/${res}/propose", as: MarketCenterAdmin, as_user_id: "${mca}" }
          trigger:
            - { call: "POST /governance-resolutions/${res}/ratify", as: ALCChair, as_user_id: "${alc}" }
            - { call: "GET /profit-share-periods/${per}", as: PlatformAdmin, captures: { pstat: $.data.status } }
            - { call: "GET /profit-share-distributions", as: PlatformAdmin, payload: { period_id: "${per}", agent_id: "${mca}" }, captures: { mcaa: "$.data[0].amount", mcas: "$.data[0].status" } }
            - { call: "GET /profit-share-distributions", as: PlatformAdmin, payload: { period_id: "${per}", agent_id: "${s1}" }, captures: { s1a: "$.data[0].amount", s1s: "$.data[0].status" } }
            - { call: "GET /agents/${mca}", as: PlatformAdmin, captures: { mcap: $.data.pending_payable_profit_share } }
            - { call: "GET /agents/${s1}", as: PlatformAdmin, captures: { s1p: $.data.pending_payable_profit_share } }
          assert:
            - "Hop 1: ProfitSharePeriod.${per}.status == FINAL_CLOSED"
            - "Hop 2: distributions recomputed FINAL and flipped PROJECTION -> PAYABLE: mca amount 476.67 (was PROJECTION 1820.00), s1 amount 2383.33 (was 2600.00)"
            - "Hop 3: Agent.${mca}.pending_payable_profit_share == 476.67 and Agent.${s1}.pending_payable_profit_share == 2383.33"
            - "Hop 4: VestingSchedules of the recipients re-evaluated without error (GET /agents/${mca}/vesting-schedule returns one ACCRUING schedule)"

      - name: dispute_overturn_sponsor_repoint_cascade
        grounds:
          - state_machines.SponsorshipDispute.UNDER_REVIEW_to_RESOLVED_OVERTURNED
          - calculations.downline_attribution_closure
          - state_machines.ProfitShareDistribution.PROJECTION_to_CLAWED_BACK
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (dispute resolve):
          RESOLVED_OVERTURNED re-points Agent.sponsor_agent_id; that mutation
          SUPERSEDES the old closure edges and creates new ones; that mutation
          CLAWED_BACKs the PROJECTION distributions built on the old tree and
          regenerates them — s1 loses her 416.67 projection, r1 gains 416.67.
        test_recipe:
          setup:
            - "Chain mca -> s1 -> d1 plus r1 (also mca-sponsored); d1's attestation att names r1"
            - "d1 posts+settles 5000.00 (company dollar 1500.00); period 2026-09 preliminary-closed with PROJECTION distributions s1 354.55 / mca 425.45 (scaled to provisional_pool 780.00)"
            - "r1's dispute over d1 is UNDER_REVIEW"
          setup_api_calls:
