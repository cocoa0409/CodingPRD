  - rule_id: resource_temporal_overlap
    instances:
      - name: aggregate_window_capacity_inclusive_overlap
        grounds:
          - calculations.availability_for_window
          - errors[ERR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Resource = Item, AGGREGATE-capacity semantics over INCLUSIVE intervals: with 2
          serviceable units and R1 qty 2 CONFIRMED on Sep 1-10, an overlapping R2 (Sep 10-15 —
          shares the boundary day Sep 10, and inclusive intervals DO overlap there) is rejected
          ERR_CAPACITY_EXCEEDED, while the adjacent R3 (Sep 11-15 — Sep 11 == 10 + 1 day) is
          accepted (201).
        test_recipe:
          setup:
            - "RC published; item with 2 units; renter ACTIVE; production CONFIRMED"
