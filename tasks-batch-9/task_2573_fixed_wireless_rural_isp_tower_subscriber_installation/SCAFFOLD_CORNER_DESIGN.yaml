            - call: "POST /subscribers"
              payload: { serviceability_request_id: "${sr_a}", service_plan_id: "${plan_id}", billing_email: "owner.a@example.com", equipment_mode: "RENTAL" }
              as: SalesAgent
              captures: { sub_a: $.data.id }
            - call: "POST /serviceability-requests"
              payload: { candidate_tower_id: "${tower_id}", requested_plan_id: "${plan_id}", contact_name: "Owner B", premise_latitude: 41.2620, premise_longitude: -104.7620, premise_ground_elevation_m: 1210.0, roof_height_m: 4.0, declared_tree_line_height_m: 3.0, obstruction_class: "CLEAR", path_distance_km: 5.0 }
