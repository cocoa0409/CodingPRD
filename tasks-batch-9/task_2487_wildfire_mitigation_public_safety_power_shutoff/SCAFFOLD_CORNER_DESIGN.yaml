          - state_machines.WildfirePlanFiling.transitions[SUBMITTED->SUBMITTED]
          - errors[ERR_REVIEW_TRACK_ALREADY_DECIDED]
        distinguishing_aspect: "Once the SAFETY track is CLEARED the filing stays SUBMITTED waiting on FISCAL, but a second decision on SAFETY is ERR_REVIEW_TRACK_ALREADY_DECIDED — the fork legs are individually latching, so a re-decision cannot flip a CLEARED leg to DEFICIENT."
        test_recipe:
          setup:
            - "Filing WMP-CYCLE SUBMITTED with the SAFETY track already CLEARED by reviewer_safety."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
            - *k_mp_cc
            - *k_mp_cc_submit
            - *k_mp_cc_approve
            - *k_filing
            - call: "POST /plan-filings/${filing_id}/submit"
              payload: {}
              as: GridPlanner
            - call: "POST /plan-filings/${filing_id}/reviews"
              payload: { review_track: "SAFETY", decision: "CLEAR" }
              as: RegulatoryReviewer
              as_user_id: reviewer_safety
              captures: { filing_v_after_clear: $.data.version }
          trigger:
            - call: "POST /plan-filings/${filing_id}/reviews"
              payload: { review_track: "SAFETY", decision: "DEFICIENT", deficiency_note: "changed my mind" }
              as: RegulatoryReviewer
              as_user_id: reviewer_safety
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_REVIEW_TRACK_ALREADY_DECIDED"
            - "WildfirePlanFiling.${filing_id}.status is still SUBMITTED with safety_review_state CLEARED and fiscal_review_state PENDING"
            - "deficiency_round_count is still 0 and last_deficiency_note is still null"
            - "the filing version is still ${filing_v_after_clear}"

      - name: rescope_replaces_the_previous_scope_snapshot_instead_of_appending
        claim_type: Valid Transition
        grounds:
          - state_machines.PSPSEvent.transitions[SCOPED->SCOPED]
          - calculations.psps_scope_determination
        distinguishing_aspect: "The SCOPED -> SCOPED self-loop is a full re-determination, not an increment: after CHARLIE's row is manually EXCLUDED, a re-scope with a refreshed version rebuilds the set of three CONFIRMED rows, returns excluded_scope_count to 0 and restores the score to 15.48 — and the event still has exactly three scope rows, not six."
        test_recipe:
          setup:
            - "EV-1 SCOPED over the F-CHAIN with CHARLIE's row manually EXCLUDED (score 11.18, confirmed 2, excluded 1)."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
            - *k_bravo
            - *k_charlie
            - *k_ws_a1
            - *k_ws_a2
            - *k_obs_a1a
            - *k_obs_a1b
            - *k_obs_a2a
            - *k_obs_a2b
            - *k_fpi15
            - *k_cust_a1
            - *k_cust_a2
            - *k_cust_a3
            - *k_cust_b1
            - *k_cust_c1
            - *k_ev1
            - *k_scope
            - call: "GET /circuits/${charlie_id}/event-scopes"
              payload: {}
              as: TransmissionEngineer
              captures: { charlie_scope_id: "$.data[0].id" }
            - call: "POST /event-scopes/${charlie_scope_id}/exclude"
              payload: { exclusion_justification: "operator judgement" }
              as: TransmissionEngineer
            - call: "GET /psps-events/${ev1_id}"
              payload: {}
              as: PSPSDutyOfficer
              captures: { ev1_v_now: $.data.version }
          trigger:
            - call: "POST /psps-events/${ev1_id}/scope"
              payload: { expected_psps_event_version: "${ev1_v_now}" }
              as: PSPSDutyOfficer
            - call: "GET /psps-events/${ev1_id}/scopes"
              payload: {}
              as: PSPSDutyOfficer
          assert:
            - "the re-scope returns HTTP 200 and PSPSEvent.${ev1_id}.scope_status is still SCOPED"
            - "PSPSEvent.${ev1_id}.confirmed_scope_count == 3 and excluded_scope_count == 0"
            - "PSPSEvent.${ev1_id}.ignition_risk_avoided_score == 15.48 and impacted_customer_count == 5"
            - "the scopes read returns total_count 3 — the previous snapshot was replaced, not appended to"
            - "all three circuits are back in DE_ENERGIZATION_PENDING"
            - "PSPSEvent.${ev1_id}.version > ${ev1_v_now}"

      - name: circuit_energization_dimension_loops_back_to_energized
        claim_type: Valid Transition
        excluded_because:
          difficulty_instance: circuit_energization_full_cycle_returns_to_energized
          rationale: "The cyclic-shape claim for the Circuit machine — ENERGIZED -> DE_ENERGIZATION_PENDING -> DE_ENERGIZED -> PATROL_IN_PROGRESS -> CLEARED_FOR_RESTORE -> ENERGIZED plus the CLEARED_FOR_RESTORE -> PATROL_IN_PROGRESS repair back-edge — is walked edge by edge there."

      - name: plan_filing_fork_join_needs_both_tracks_cleared
        claim_type: Valid Transition
        excluded_because:
          difficulty_instance: plan_filing_fork_join_requires_both_tracks_cleared
          rationale: "The branching-shape join claim (first CLEAR keeps the row SUBMITTED, second CLEAR by a different reviewer promotes it to APPROVED) is that instance's whole subject."

      - name: mitigation_revision_cycle_is_bounded
        claim_type: Idempotency
        excluded_because:
          difficulty_instance: mitigation_revision_cycle_bounded_at_two_rounds
          rationale: "The SUBMITTED -> REVISION_REQUESTED -> SUBMITTED loop, the non-reset of review_round across re-submits and the ERR_REVIEW_ROUND_LIMIT termination guard are all asserted there."

      - name: resource_center_reactivation_loop_after_demobilization
        claim_type: Valid Transition
        excluded_because:
          difficulty_instance: resource_center_reset_buffer_closed_interval_plus_240_minutes
          rationale: "The DEMOBILIZED -> ACTIVATED re-activation edge and its 240-minute reset-buffer precondition (accepted at exactly +240, rejected one minute earlier) are exercised there."

      - name: psps_event_two_state_dimensions_move_independently
        claim_type: Valid Transition
        excluded_because:
          difficulty_instance: psps_event_two_independent_state_dimensions
          rationale: "The parallel-shape claim — scope_status and notification_status advancing on different triggers and combining into a legal joint state — is that instance's subject."

  # ===========================================================================
  - section: calculations
    instances:

      - name: hardened_fraction_weights_undergrounding_above_covered_and_caps_at_unity
        claim_type: Correct Result
        grounds:
          - calculations.circuit_hardened_fraction
          - state_machines.MitigationProject.transitions[IN_EXECUTION->COMPLETED]
        distinguishing_aspect: "Undergrounding carries a credit factor of 1.0 against covered conductor's 0.6, and the ratio is capped at unity: 3.0 underground miles on a 4.0-mile circuit gives exactly 0.7500, and a second 2.0-mile underground project takes the raw ratio to 1.25 which must be clamped to 1.0000 rather than reported as 1.2500."
        test_recipe:
          setup:
            - "Circuit DELTA (NON_HFTD, 4.0 overhead miles) with no mitigation history."
          setup_api_calls:
            - *k_clock_default
            - &k_delta
              call: "POST /circuits"
              payload: { circuit_code: "DELTA", district_code: "D-SOUTH", hftd_tier: "NON_HFTD", overhead_miles: 4.0, equipment_condition_index: 90, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { delta_id: $.data.id }
            - call: "POST /mitigation-projects"
              payload: { project_code: "UG-1", circuit_id: "${delta_id}", program_type: "UNDERGROUNDING", plan_year: 2026, planned_miles: 3.0, unit_cost_per_mile_cents: 9000000 }
              as: GridPlanner
              captures: { ug1_id: $.data.id }
            - call: "POST /mitigation-projects/${ug1_id}/submit"
              payload: {}
              as: GridPlanner
            - call: "POST /mitigation-projects/${ug1_id}/review"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: reviewer_alpha
            - call: "GET /circuits/${delta_id}"
              payload: {}
              as: AssetInspector
              captures: { delta_v1: $.data.version }
          trigger:
            - call: "POST /mitigation-projects/${ug1_id}/record-completion"
              payload: { completed_miles_delta: 3.0, completion_date: "2026-06-01T00:00:00Z", expected_circuit_version: "${delta_v1}" }
              as: AssetInspector
            - call: "POST /mitigation-projects"
              payload: { project_code: "UG-2", circuit_id: "${delta_id}", program_type: "UNDERGROUNDING", plan_year: 2026, planned_miles: 2.0, unit_cost_per_mile_cents: 9000000 }
              as: GridPlanner
              captures: { ug2_id: $.data.id }
            - call: "POST /mitigation-projects/${ug2_id}/submit"
              payload: {}
              as: GridPlanner
            - call: "POST /mitigation-projects/${ug2_id}/review"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: reviewer_alpha
            - call: "GET /circuits/${delta_id}"
              payload: {}
              as: AssetInspector
              captures: { delta_v2: $.data.version }
            - call: "POST /mitigation-projects/${ug2_id}/record-completion"
              payload: { completed_miles_delta: 2.0, completion_date: "2026-07-01T00:00:00Z", expected_circuit_version: "${delta_v2}" }
              as: AssetInspector
          assert:
            - "after the first completion Circuit.${delta_id}.underground_miles == 3.0, covered_conductor_miles == 0.0 and hardened_fraction == 0.7500"
            - "MitigationProject.${ug1_id}.status == COMPLETED with completed_miles == 3.0"
            - "after the second completion Circuit.${delta_id}.underground_miles == 5.0 and hardened_fraction == 1.0000 (the raw 1.2500 is clamped, not reported)"
            - "Circuit.${delta_id}.risk_posture is still NORMAL — DELTA has no FORECAST index"

      - name: circuit_risk_posture_walks_the_tier_ladder_and_ignores_validated_rows
        claim_type: Constants Applied
        grounds:
          - calculations.circuit_risk_posture
          - calculations.fire_potential_index
        distinguishing_aspect: "The posture ladder is keyed on tier sets, not on the raw score: an R3 index (43.75) yields ELEVATED while a circuit with no index at all stays NORMAL, and adding a VALIDATED index for the same day must leave both the posture and latest_forecast_fpi_score untouched because only FORECAST rows are consulted."
        test_recipe:
          setup:
            - "Circuit ECHO-R3 (TIER_2, equipment_condition_index 80, inspected 2026-05-01 on a 36-month cycle) with a single station of weight 1.00 reporting a 30 mph gust, 50 % humidity and 9.5 % dead fuel moisture; plus circuit DELTA with no weather data at all."
          setup_api_calls:
            - *k_clock_default
            - *k_delta
            - &k_echo3
              call: "POST /circuits"
              payload: { circuit_code: "ECHO-R3", district_code: "D-EAST", hftd_tier: "TIER_2", overhead_miles: 5.0, equipment_condition_index: 80, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { echo3_id: $.data.id }
            - &k_ws_e3
              call: "POST /weather-stations"
              payload: { station_code: "WS-E3", circuit_id: "${echo3_id}", elevation_ft: 900, representativeness_weight: 1.00, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
              captures: { ws_e3_id: $.data.id }
            - &k_obs_e3
              call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_e3_id}", observed_at: "2026-07-31T12:00:00Z", wind_gust_mph: 30.0, relative_humidity_pct: 50.0, temperature_f: 90.0, dead_fuel_moisture_pct: 9.5 }
              as: MeteorologyAnalyst
          trigger:
            - call: "POST /fire-potential-indices"
              payload: { circuit_id: "${echo3_id}", forecast_date: "2026-08-01", computation_variant: "FORECAST" }
              as: MeteorologyAnalyst
              captures: { fpi_e3_fc_id: $.data.id }
            - call: "POST /fire-potential-indices"
              payload: { circuit_id: "${echo3_id}", forecast_date: "2026-08-01", computation_variant: "VALIDATED" }
              as: MeteorologyAnalyst
              captures: { fpi_e3_val_id: $.data.id }
            - call: "GET /circuits/${echo3_id}"
              payload: {}
              as: MeteorologyAnalyst
            - call: "GET /circuits/${delta_id}"
              payload: {}
              as: MeteorologyAnalyst
          assert:
            - "FirePotentialIndex.${fpi_e3_fc_id}.fpi_score == 43.75 and fpi_tier == R3 (wind 25, dryness 60, terrain 70, equipment 20 blended 0.35/0.30/0.20/0.15)"
            - "after the FORECAST insert Circuit.${echo3_id}.risk_posture == ELEVATED, latest_forecast_fpi_score == 43.75 and latest_forecast_fpi_tier == R3"
            - "FirePotentialIndex.${fpi_e3_val_id}.fpi_score == 43.75 as well (one station, one in-window observation, so envelope and latest coincide)"
            - "after the VALIDATED insert Circuit.${echo3_id}.risk_posture is still ELEVATED and latest_forecast_fpi_score is still 43.75 — the VALIDATED row is not the latest FORECAST row"
            - "Circuit.${delta_id}.risk_posture == NORMAL with latest_forecast_fpi_score null and latest_forecast_fpi_tier null"

      - name: fpi_inspection_overdue_penalty_applies_at_the_exact_cycle_boundary
        claim_type: Constants Applied
        grounds:
          - calculations.fire_potential_index
          - entities.Circuit.fields.inspection_cycle_months
        distinguishing_aspect: "The 30-point overdue penalty turns on `logical_clock_now >= last_inspection_completed_at + inspection_cycle_months * 30 days` with an inclusive boundary: on a one-month cycle a circuit inspected on 2026-07-02 is overdue at exactly 2026-08-01T00:00:00Z (score 40.75, R3) while its twin inspected one day later is not (36.25, R2) — a 4.50-point swing decided by a single day."
        test_recipe:
          setup:
            - "Two identical TIER_1 circuits with equipment_condition_index 90 and inspection_cycle_months 1, inspected on 2026-07-02 and 2026-07-03 respectively; the logical clock sits at exactly 2026-08-01T00:00:00Z. Each carries one station of weight 1.00 with the same 30 mph / 50 % / 9.5 % observation."
          setup_api_calls:
            - *k_clock_default
            - call: "POST /circuits"
              payload: { circuit_code: "ROMEO", district_code: "D-EAST", hftd_tier: "TIER_1", overhead_miles: 5.0, equipment_condition_index: 90, inspection_cycle_months: 1, last_inspection_completed_at: "2026-07-02T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { romeo_id: $.data.id }
            - call: "POST /circuits"
              payload: { circuit_code: "SIERRA", district_code: "D-EAST", hftd_tier: "TIER_1", overhead_miles: 5.0, equipment_condition_index: 90, inspection_cycle_months: 1, last_inspection_completed_at: "2026-07-03T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { sierra_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-R1", circuit_id: "${romeo_id}", elevation_ft: 900, representativeness_weight: 1.00, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
              captures: { ws_r1_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-S1", circuit_id: "${sierra_id}", elevation_ft: 900, representativeness_weight: 1.00, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
              captures: { ws_s1_id: $.data.id }
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_r1_id}", observed_at: "2026-07-31T12:00:00Z", wind_gust_mph: 30.0, relative_humidity_pct: 50.0, temperature_f: 90.0, dead_fuel_moisture_pct: 9.5 }
              as: MeteorologyAnalyst
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_s1_id}", observed_at: "2026-07-31T12:00:00Z", wind_gust_mph: 30.0, relative_humidity_pct: 50.0, temperature_f: 90.0, dead_fuel_moisture_pct: 9.5 }
              as: MeteorologyAnalyst
          trigger:
            - call: "POST /fire-potential-indices"
              payload: { circuit_id: "${romeo_id}", forecast_date: "2026-08-01", computation_variant: "FORECAST" }
              as: MeteorologyAnalyst
              captures: { fpi_romeo_id: $.data.id }
            - call: "POST /fire-potential-indices"
              payload: { circuit_id: "${sierra_id}", forecast_date: "2026-08-01", computation_variant: "FORECAST" }
              as: MeteorologyAnalyst
              captures: { fpi_sierra_id: $.data.id }
          assert:
            - "FirePotentialIndex.${fpi_romeo_id}.equipment_component == 40 (10 + the 30-point overdue penalty) and fpi_score == 40.75 with fpi_tier R3"
            - "FirePotentialIndex.${fpi_sierra_id}.equipment_component == 10 and fpi_score == 36.25 with fpi_tier R2"
            - "Circuit.${romeo_id}.risk_posture == ELEVATED while Circuit.${sierra_id}.risk_posture == NORMAL"
            - "both indices report the same wind_component 25 and dryness_component 60 — only the equipment term differs"

      - name: fpi_drops_offline_stations_and_halves_degraded_station_weight
        claim_type: Input Set Filtering
        grounds:
          - calculations.fire_potential_index
          - entities.WeatherStation.fields.telemetry_status
        distinguishing_aspect: "Station eligibility bites twice in the same computation: an OFFLINE station is dropped from both the numerator and the denominator W even though it reports the most extreme weather on the circuit, while a DEGRADED station of nominal weight 1.00 contributes at 0.5 — giving a blended gust of 40.0 and a score of 52.50 rather than the 56.88 an unhalved weight would produce."
        test_recipe:
          setup:
            - "Circuit TANGO (TIER_2, equipment_condition_index 80, inspected 2026-05-01 on a 36-month cycle) with three stations of nominal weight 1.00 — T1 ONLINE at 30 mph, T2 OFFLINE at 100 mph, T3 DEGRADED at 60 mph — all humidity 50 % and dead fuel moisture 9.5 %, all observed on 2026-07-31."
          setup_api_calls:
            - *k_clock_default
            - call: "POST /circuits"
              payload: { circuit_code: "TANGO", district_code: "D-EAST", hftd_tier: "TIER_2", overhead_miles: 5.0, equipment_condition_index: 80, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { tango_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-T1", circuit_id: "${tango_id}", elevation_ft: 900, representativeness_weight: 1.00, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
              captures: { ws_t1_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-T2", circuit_id: "${tango_id}", elevation_ft: 4200, representativeness_weight: 1.00, telemetry_status: "OFFLINE" }
              as: MeteorologyAnalyst
              captures: { ws_t2_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-T3", circuit_id: "${tango_id}", elevation_ft: 2100, representativeness_weight: 1.00, telemetry_status: "DEGRADED" }
              as: MeteorologyAnalyst
              captures: { ws_t3_id: $.data.id }
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_t1_id}", observed_at: "2026-07-31T12:00:00Z", wind_gust_mph: 30.0, relative_humidity_pct: 50.0, temperature_f: 90.0, dead_fuel_moisture_pct: 9.5 }
              as: MeteorologyAnalyst
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_t2_id}", observed_at: "2026-07-31T12:00:00Z", wind_gust_mph: 100.0, relative_humidity_pct: 50.0, temperature_f: 90.0, dead_fuel_moisture_pct: 9.5 }
              as: MeteorologyAnalyst
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_t3_id}", observed_at: "2026-07-31T12:00:00Z", wind_gust_mph: 60.0, relative_humidity_pct: 50.0, temperature_f: 90.0, dead_fuel_moisture_pct: 9.5 }
              as: MeteorologyAnalyst
          trigger:
            - call: "POST /fire-potential-indices"
              payload: { circuit_id: "${tango_id}", forecast_date: "2026-08-01", computation_variant: "FORECAST" }
              as: MeteorologyAnalyst
              captures: { fpi_tango_id: $.data.id }
          assert:
            - "FirePotentialIndex.${fpi_tango_id}.contributing_station_count == 2 — the OFFLINE station is excluded despite having an in-window observation"
            - "FirePotentialIndex.${fpi_tango_id}.effective_wind_gust_mph == 40.0 ((1.0*30 + 0.5*60) / 1.5)"
            - "FirePotentialIndex.${fpi_tango_id}.wind_component == 50 and fpi_score == 52.50 with fpi_tier R3"
            - "the score is NOT 56.88, which is what an unhalved DEGRADED weight would give, and not the far higher figure the OFFLINE station's 100 mph gust would produce"

      - name: scope_determination_filters_by_variant_forecast_date_and_tier
        claim_type: Input Set Filtering
        grounds:
          - calculations.psps_scope_determination
          - endpoints.POST_/psps-events/{id}/scope
        distinguishing_aspect: "Four different reasons for exclusion are exercised in one scope run: VICTOR is R3 (tier outside the de-energization set), WHISKEY has only a VALIDATED index, XRAY has no index at all, and ZULU's R5 index is dated one day before onset — so only UNIFORM is scoped, and none of the four rejects appears even as an EXCLUDED row."
        test_recipe:
          setup:
            - "Five unconnected circuits, one customer on UNIFORM, and an event EV-FILTER with onset 2026-08-21T18:00:00Z triggered by UNIFORM's R5 FORECAST index for 2026-08-21."
          setup_api_calls:
            - *k_clock_default
            - call: "POST /circuits"
              payload: { circuit_code: "UNIFORM", district_code: "D-WEST", hftd_tier: "TIER_2", overhead_miles: 5.0, equipment_condition_index: 80, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { uniform_id: $.data.id }
            - call: "POST /circuits"
              payload: { circuit_code: "VICTOR", district_code: "D-WEST", hftd_tier: "TIER_2", overhead_miles: 5.0, equipment_condition_index: 80, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { victor_id: $.data.id }
            - call: "POST /circuits"
              payload: { circuit_code: "WHISKEY", district_code: "D-WEST", hftd_tier: "TIER_2", overhead_miles: 5.0, equipment_condition_index: 80, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { whiskey_id: $.data.id }
            - call: "POST /circuits"
              payload: { circuit_code: "XRAY", district_code: "D-WEST", hftd_tier: "TIER_3", overhead_miles: 5.0, equipment_condition_index: 55, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { xray_id: $.data.id }
            - call: "POST /circuits"
              payload: { circuit_code: "ZULU", district_code: "D-WEST", hftd_tier: "TIER_2", overhead_miles: 5.0, equipment_condition_index: 80, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { zulu_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-U1", circuit_id: "${uniform_id}", elevation_ft: 1800, representativeness_weight: 1.00, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
              captures: { ws_u1_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-V1", circuit_id: "${victor_id}", elevation_ft: 1800, representativeness_weight: 1.00, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
