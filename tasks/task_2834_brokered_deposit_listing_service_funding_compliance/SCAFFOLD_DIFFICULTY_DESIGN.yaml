      - name: agreement_suspend_three_hop_to_pending_placement_cancel
        grounds:
          - state_machines.BrokerAgreement.APPROVED_to_SUSPENDED
          - state_machines.DepositProgram.OPEN_FOR_PLACEMENT_to_SUSPENDED
          - state_machines.DepositPlacement.PENDING_to_CANCELLED
          - entities.Broker.fields.approved_agreement_count
          - calculations.wholesale_balance_rollup
        distinguishing_aspect: |
          A different triggering transition (BrokerAgreement APPROVED -> SUSPENDED, not an
          exception revocation) driving a depth-3 chain: hop 1 suspends the agreement,
          which causes hop 2 (Broker.diligence_status SUSPENDED and
          approved_agreement_count 1 -> 0), which causes hop 3 (the program drops to
