  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_dispute_info_request_review_cycle
        grounds:
          - state_machines.MeasurementDispute.SUBMITTED_to_UNDER_REVIEW
          - state_machines.MeasurementDispute.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.MeasurementDispute.INFO_REQUESTED_to_UNDER_REVIEW
          - state_machines.Invoice.ISSUED_to_DISPUTED
          - calculations.dispute_sla_clock
          - calculations.invoice_settlement_waterfall
          - entities.MeasurementDispute.fields.dispute_status
          - entities.MeasurementDispute.fields.info_request_count
          - entities.MeasurementDispute.fields.review_rounds
          - entities.MeasurementDispute.fields.sla_response_hours
          - entities.MeasurementDispute.fields.sla_due_at
          - entities.MeasurementDispute.fields.first_response_at
          - entities.MeasurementDispute.fields.sla_breached
          - validations[priority=65]
          - validations[priority=76]
          - concurrency_rules[dispute-create-stale-invoice]
        distinguishing_aspect: |
          MeasurementDispute.dispute_status contains a genuine CYCLE — UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW traversed twice returns the dispute to the same state it started in while the derived fields ratchet monotonically and asymmetrically: info_request_count reaches 2 but review_rounds reaches 3, sla_response_hours climbs 48 -> 96 -> 144, sla_due_at slides 2026-09-07 -> 2026-09-09 -> 2026-09-11, and first_response_at stays pinned at 2026-09-05T00:00:00.000Z because it is only set when null, so state alone cannot tell you how many loops were taken.
        test_recipe:
          setup:
            - "Advertiser DISPCO is ACTIVE and MANAGED with managed_service_fee_pct == 0.05, so the dispute_sla_clock managed_reduction of 24 hours applies."
            - "One ACTIVE BudgetPlan for 2026-Q3 (committed_total_cents 40000000, trade_fund_share_cents 0) and one OPEN TradeFundAccount for 2026-Q3 with accrued_cents == 0, so the STEP 8 deduction ceiling is 0."
            - "One COMPLETED ONSITE_ONLY campaign whose single CPC line item won one auction on an ONSITE slot with floor_cpc_cents == 1250 and recorded exactly one CLICK, giving onsite_spend_cents == 1250."
            - "One Invoice for billing_period_code 2026-08 is ISSUED at clock 2026-09-01T00:00:00Z with net_cash_due_cents == 1313."
            - "The clock is advanced to 2026-09-05T00:00:00Z and one MeasurementDispute with dispute_category == IMPRESSION_DISCREPANCY (SLA_BASE_HOURS 72) and claimed_amount_cents == 1000 is filed, so filed_at == 2026-09-05T00:00:00Z and the Invoice moves ISSUED -> DISPUTED."
            - "The clock is then HELD at 2026-09-05T00:00:00Z for the whole cycle and /_ops/run-daily-checkpoint is never called, so no clock-driven UNDER_REVIEW -> ESCALATED or INFO_REQUESTED -> ESCALATED branch can fire and every provide-info precondition clock_now < sla_due_at holds."
