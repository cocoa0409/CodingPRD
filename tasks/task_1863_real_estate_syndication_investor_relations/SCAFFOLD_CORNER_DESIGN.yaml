  - section: consistency_model
    instances:

      - name: state_change_visible_immediately
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "A POST that mutates a resource is immediately visible in a follow-up GET within the same logical operation"
        test_recipe:
          setup: ["One DRAFT syndication"]
          setup_api_calls:
            - call: "POST /syndications"
              payload: { syndication_name: "ImSyn", sponsor_legal_entity: "Im LLC", preferred_return_pct_annual: 0.08, carried_interest_pct: 0.20 }
              as: SponsorOperator
              captures: { syn_id: "$.data.id" }
          trigger:
            - call: "POST /syndications/${syn_id}/activate"
              payload: {}
              as: SponsorOperator
            - call: "GET /syndications/${syn_id}"
              payload: {}
              as: SponsorOperator
          assert:
            - "POST response status == ACTIVE"
            - "Follow-up GET returns status == ACTIVE (no lag)"
