scaffold_corner_design:
  - section: entities
    instances:
      - name: program_create_returns_defaults_and_computed_posture
        claim_type: creation
        grounds:
          - "entities.ProductionProgram"
        distinguishing_aspect: "A fresh program returns 201 with version 1, announced_target_rate falling back to current_rate_per_month, zero counters, readiness_index 0.0 (supply 0/1) and posture DISTRESSED per the pinned formula."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id", v: "$.data.version", ann: "$.data.announced_target_rate", idx: "$.data.readiness_index", esc: "$.data.open_escape_count", posture: "$.data.posture" } }
          trigger: []
          assert:
            - "version == 1 and id is a server-minted UUID"
            - "announced_target_rate == 5 (no announced case; falls back to current_rate_per_month)"
            - "open_escape_count == 0, traveled_work_open_hours == 0, undelivered_inventory_count == 0"
            - "readiness_index == 0.0 (supply 0 of 1 codes) and posture == DISTRESSED"
      - name: program_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.ProductionProgram.fields.rework_budget_total_cents"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required input rework_budget_total_cents yields 400 ERR_INVALID_REQUEST; no program is persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1 }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400"
      - name: program_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - "entities.ProductionProgram"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields 404 ERR_NOT_FOUND, not 400 or 500."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/programs/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_FOUND with HTTP 404"
      - name: customer_create_rejected_with_extra_system_fields
        claim_type: system_fields
        grounds:
          - "entities.Customer"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Client-supplied system fields (id, version) in a create body are rejected as unknown fields with 400, never silently accepted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD", id: "client-chosen" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400"
      - name: duplicate_supplier_code_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Supplier.fields.supplier_code"
          - "errors[ERR_DUPLICATE_CODE]"
        distinguishing_aspect: "Second supplier with the same supplier_code is rejected with 409 ERR_DUPLICATE_CODE; uniqueness is global, not per-program."
        test_recipe:
          setup: ["supplier S1 exists"]
          setup_api_calls:
            - { call: "POST /api/suppliers", payload: { supplier_code: "S1", name: "Engines Co", region: "NA" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/suppliers", payload: { supplier_code: "S1", name: "Other Co", region: "EU" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_DUPLICATE_CODE with HTTP 409"
      - name: aircraft_duplicate_line_number_in_same_program_rejected
        claim_type: type_constraints
        grounds:
          - "entities.AircraftUnit.fields.line_number"
          - "errors[ERR_DUPLICATE_CODE]"
        distinguishing_aspect: "line_number uniqueness is scoped per program: a second aircraft with line 1001 in the same program fails with ERR_DUPLICATE_CODE."
        test_recipe:
          setup: ["program M1 with customer AL1 and one aircraft line 1001"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 1001, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 1001, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_DUPLICATE_CODE with HTTP 409"
      - name: workforce_readiness_ratio_computed_from_hires
        claim_type: computed_fields
        grounds:
          - "entities.WorkforcePlan.fields.readiness_ratio"
        distinguishing_aspect: "readiness_ratio is derived (hired/required): 3 hires against 12 required yields exactly 0.25; client input for the field is impossible."
        test_recipe:
          setup: ["program M1 with workforce plan AVIONICS required 12"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/workforce-plans", payload: { skill_code: "AVIONICS", required_headcount: 12 }, as: ProductionPlanner, captures: { wf_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/workforce-plans/${wf_id}/hire", payload: { count: 3 }, as: ProductionPlanner, captures: { hired: "$.data.hired_headcount", ratio: "$.data.readiness_ratio" } }
          assert:
            - "hired_headcount == 3 and readiness_ratio == 0.25"
      - name: escape_late_notification_flag_computed_against_clock
        claim_type: computed_fields
        grounds:
          - "entities.QualityEscape.fields.is_late_notification"
          - "entities.QualityEscape.fields.regulator_notified_at"
        distinguishing_aspect: "Notification stamped 26 hours after creation sets is_late_notification == true; the 24-hour window is measured from created_at on the logical clock."
        test_recipe:
          setup: ["program M1, customer AL1, aircraft line 1002, escape created at the default clock 2026-09-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 1002, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/quality-escapes", payload: { severity: "CRITICAL", description: "Wire chafe" }, as: QualityInspector, as_user_id: "insp-1", captures: { esc_id: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T02:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /api/quality-escapes/${esc_id}/notify-regulator", payload: {}, as: QualityInspector, as_user_id: "insp-1", captures: { late: "$.data.is_late_notification", ts: "$.data.regulator_notified_at" } }
          assert:
            - "regulator_notified_at == 2026-09-02T02:00:00Z (the logical clock, not wall time)"
            - "is_late_notification == true (26h > 24h window)"

  - section: state_machines
    instances:
      - name: rate_case_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - "state_machines.RateCase"
        distinguishing_aspect: "A newly created RateCase starts in DRAFT with gating_verdict null."
        test_recipe:
          setup: ["program M1"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id", prog_v: "$.data.version" } }
          trigger:
            - { call: "POST /api/programs/${prog_id}/rate-cases", payload: { proposed_rate: 8, effective_month: "2027-01", demand_backlog_units: 100, expected_program_version: "${prog_v}" }, as: ProductionPlanner, captures: { st: "$.data.status", verdict: "$.data.gating_verdict" } }
          assert:
            - "status == DRAFT and gating_verdict == null"
      - name: rate_case_commit_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.RateCase.GATED_REVIEW_to_COMMITTED"
          - "errors[ERR_INVALID_TRANSITION]"
        distinguishing_aspect: "commit has no DRAFT origin: a DRAFT case cannot skip announce/review."
        test_recipe:
          setup: ["program M1 with DRAFT rate case"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id", prog_v: "$.data.version" } }
            - { call: "POST /api/programs/${prog_id}/rate-cases", payload: { proposed_rate: 8, effective_month: "2027-01", demand_backlog_units: 100, expected_program_version: "${prog_v}" }, as: ProductionPlanner, captures: { rc_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/rate-cases/${rc_id}/commit", payload: {}, as: ProductionPlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_TRANSITION with HTTP 409"
      - name: rate_case_announce_from_shelved_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.RateCase"
          - "errors[ERR_INVALID_TRANSITION]"
        distinguishing_aspect: "SHELVED is terminal: announce after shelve is rejected and announced_target_rate stays at the fallback."
        test_recipe:
          setup: ["program M1 with a rate case that has been shelved from DRAFT"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id", prog_v: "$.data.version" } }
            - { call: "POST /api/programs/${prog_id}/rate-cases", payload: { proposed_rate: 8, effective_month: "2027-01", demand_backlog_units: 100, expected_program_version: "${prog_v}" }, as: ProductionPlanner, captures: { rc_id: "$.data.id" } }
            - { call: "POST /api/rate-cases/${rc_id}/shelve", payload: {}, as: ProductionPlanner }
          trigger:
            - { call: "POST /api/rate-cases/${rc_id}/announce", payload: {}, as: ProductionPlanner, captures: { err: "$.data.error_id" } }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: ProgramAdmin, captures: { ann: "$.data.announced_target_rate" } }
          assert:
            - "error_id == ERR_INVALID_TRANSITION with HTTP 409"
            - "announced_target_rate == 5 (fallback to current rate; shelved case contributes nothing)"
      - name: commitment_confirm_twice_rejected
        claim_type: idempotency
        grounds:
          - "state_machines.SupplierCapacityCommitment.DRAFT_to_CONFIRMED"
          - "errors[ERR_INVALID_TRANSITION]"
        distinguishing_aspect: "Repeating confirm on a CONFIRMED commitment is not idempotent success: the second call is rejected with ERR_INVALID_TRANSITION."
        test_recipe:
          setup: ["program M1; supplier S1 with DRAFT commitment"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { supplier_code: "S1", name: "Engines Co", region: "NA" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/suppliers/${s1_id}/capacity-commitments", payload: { program_id: "${prog_id}", component_code: "ENG", committed_rate_per_month: 8, lead_time_months: 4, unit_price_cents: 1000000 }, as: SupplierManager, as_user_id: "${s1_id}", captures: { c_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/capacity-commitments/${c_id}/confirm", payload: {}, as: SupplierManager, as_user_id: "${s1_id}", captures: { st1: "$.data.status" } }
            - { call: "POST /api/capacity-commitments/${c_id}/confirm", payload: {}, as: SupplierManager, as_user_id: "${s1_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "first confirm: status == CONFIRMED"
            - "second confirm: ERR_INVALID_TRANSITION (409)"
      - name: work_package_complete_after_travel_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.WorkPackage.OPEN_to_TRAVELED"
          - "errors[ERR_INVALID_TRANSITION]"
        distinguishing_aspect: "TRAVELED is terminal for the work package: complete after travel is rejected and no second rework order is spawned."
        test_recipe:
          setup: ["program M1, customer AL1, aircraft line 1003 with a TRAVELED work package"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 1003, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/work-packages", payload: { station_sequence: 1, description: "Join", planned_hours: 10 }, as: LineManager, captures: { wp_id: "$.data.id" } }
            - { call: "POST /api/work-packages/${wp_id}/travel", payload: { traveled_hours: 4 }, as: LineManager }
          trigger:
            - { call: "POST /api/work-packages/${wp_id}/complete", payload: {}, as: LineManager, captures: { err: "$.data.error_id" } }
            - { call: "GET /api/work-packages/${wp_id}/rework-orders", payload: {}, as: LineManager, captures: { rw_src: "$.data[0].source" } }
          assert:
            - "error_id == ERR_INVALID_TRANSITION with HTTP 409"
            - "exactly one rework order exists for the package (the rejected complete spawns nothing), source TRAVELED_WORK"
      - name: rework_credit_from_open_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.ReworkOrder.CLOSED_to_CREDITED"
          - "errors[ERR_INVALID_TRANSITION]"
        distinguishing_aspect: "credit requires CLOSED: an OPEN rework order cannot be credited directly."
        test_recipe:
          setup: ["program M1, customer AL1, aircraft line 1004 with an OPEN escape-sourced rework order"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 1004, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/quality-escapes", payload: { severity: "MAJOR", description: "Dent" }, as: QualityInspector, as_user_id: "insp-1", captures: { esc_id: "$.data.id" } }
            - { call: "POST /api/quality-escapes/${esc_id}/rework-orders", payload: { estimated_hours: 3 }, as: QualityInspector, as_user_id: "insp-1", captures: { rw_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/rework-orders/${rw_id}/credit", payload: {}, as: LineManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_TRANSITION with HTTP 409"
      - name: escape_close_from_open_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.QualityEscape.DISPOSITIONED_to_CLOSED"
          - "errors[ERR_INVALID_TRANSITION]"
        distinguishing_aspect: "close requires DISPOSITIONED: closing a fresh OPEN escape is rejected even if the regulator was never notified."
        test_recipe:
          setup: ["program M1, customer AL1, aircraft line 1005 with one OPEN escape"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 1005, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/quality-escapes", payload: { severity: "MAJOR", description: "Dent" }, as: QualityInspector, as_user_id: "insp-1", captures: { esc_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/quality-escapes/${esc_id}/close", payload: {}, as: QualityInspector, as_user_id: "insp-2", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_TRANSITION with HTTP 409"
      - name: flight_test_record_outcome_twice_rejected
        claim_type: idempotency
        grounds:
          - "state_machines.FlightTest.SCHEDULED_to_COMPLETED"
          - "errors[ERR_INVALID_TRANSITION]"
        distinguishing_aspect: "A COMPLETED flight test is terminal: recording a second outcome is rejected; the first outcome stands."
        test_recipe:
          setup: ["program M1, customer AL1, aircraft line 1006 in FLIGHT_TESTING with one SCHEDULED test"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 1006, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/work-packages", payload: { station_sequence: 1, description: "Join", planned_hours: 5 }, as: LineManager, captures: { wp_id: "$.data.id" } }
            - { call: "POST /api/work-packages/${wp_id}/complete", payload: {}, as: LineManager }
            - { call: "POST /api/aircraft-units/${ac_id}/begin-delivery", payload: {}, as: DeliveryManager }
            - { call: "POST /api/aircraft-units/${ac_id}/flight-tests", payload: { range_code: "RANGE_ALPHA", window_start: "2026-10-02T09:00:00Z", window_end: "2026-10-02T12:00:00Z" }, as: DeliveryManager, captures: { ft_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/flight-tests/${ft_id}/record-outcome", payload: { outcome: "PASS" }, as: DeliveryManager, captures: { oc1: "$.data.outcome" } }
            - { call: "POST /api/flight-tests/${ft_id}/record-outcome", payload: { outcome: "FAIL", rework_estimated_hours: 5 }, as: DeliveryManager, captures: { err: "$.data.error_id" } }
          assert:
            - "first record-outcome: outcome == PASS"
            - "second record-outcome: ERR_INVALID_TRANSITION (409); outcome remains PASS"
      - name: storage_release_twice_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.StoragePreservation.ACTIVE_to_RELEASED"
          - "errors[ERR_INVALID_TRANSITION]"
        distinguishing_aspect: "RELEASED is terminal: a second release is rejected."
        test_recipe:
          setup: ["program M1, customer AL1, aircraft line 1007 with a RELEASED storage record"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 1007, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/work-packages", payload: { station_sequence: 1, description: "Join", planned_hours: 5 }, as: LineManager, captures: { wp_id: "$.data.id" } }
            - { call: "POST /api/work-packages/${wp_id}/complete", payload: {}, as: LineManager }
            - { call: "POST /api/aircraft-units/${ac_id}/storage-preservations", payload: { bay_code: "B1", window_start: "2026-09-10T00:00:00Z", window_end: "2026-12-01T00:00:00Z", daily_rate_cents: 1000, preservation_cycle_days: 30 }, as: DeliveryManager, captures: { sp_id: "$.data.id" } }
            - { call: "POST /api/storage-preservations/${sp_id}/release", payload: {}, as: DeliveryManager }
          trigger:
            - { call: "POST /api/storage-preservations/${sp_id}/release", payload: {}, as: DeliveryManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_TRANSITION with HTTP 409"
      - name: negotiation_agree_twice_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.DeliveryNegotiation.PROPOSED_to_AGREED"
          - "errors[ERR_INVALID_TRANSITION]"
        distinguishing_aspect: "AGREED is terminal: a second agree is rejected and scheduled_delivery_date stays at the agreed value."
        test_recipe:
          setup: ["program M1, GOOD customer AL1, aircraft line 1008 with a PROPOSED negotiation (round 1, proposed 2026-10-11)"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 1008, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/delivery-negotiations", payload: { proposed_delivery_date: "2026-10-11", compensation_variant: "CONTRACTUAL_LIQUIDATED" }, as: DeliveryManager, captures: { neg_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/delivery-negotiations/${neg_id}/agree", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { st1: "$.data.status" } }
            - { call: "POST /api/delivery-negotiations/${neg_id}/agree", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
            - { call: "GET /api/aircraft-units/${ac_id}", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { sched: "$.data.scheduled_delivery_date" } }
          assert:
            - "first agree: status == AGREED"
            - "second agree: ERR_INVALID_TRANSITION (409)"
            - "aircraft scheduled_delivery_date == 2026-10-11 (unchanged by the rejected call)"
      - name: walkthrough_snags_reject_delivery_and_retry_cycle_reopens
        claim_type: side_effect_execution
        grounds:
          - "state_machines.AircraftUnit.delivery_status.CONFIG_VERIFIED_to_delivery_status.REJECTED"
          - "state_machines.AircraftUnit.delivery_status.REJECTED_to_delivery_status.FLIGHT_TESTING"
        distinguishing_aspect: "snag_count >= 1 rejects the walkthrough and spawns exactly one WALKTHROUGH_SNAG rework order priced at snag_count * 4 hours; after closing that rework, begin-delivery reopens the pipeline (REJECTED -> FLIGHT_TESTING retry)."
        test_recipe:
          setup: ["program M1 (budget 1000000), GOOD customer AL1, aircraft line 1009 in CONFIG_VERIFIED with one PASS flight test"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 1009, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/work-packages", payload: { station_sequence: 1, description: "Join", planned_hours: 5 }, as: LineManager, captures: { wp_id: "$.data.id" } }
            - { call: "POST /api/work-packages/${wp_id}/complete", payload: {}, as: LineManager }
            - { call: "POST /api/aircraft-units/${ac_id}/begin-delivery", payload: {}, as: DeliveryManager }
            - { call: "POST /api/aircraft-units/${ac_id}/flight-tests", payload: { range_code: "RANGE_ALPHA", window_start: "2026-10-02T09:00:00Z", window_end: "2026-10-02T12:00:00Z" }, as: DeliveryManager, captures: { ft_id: "$.data.id" } }
            - { call: "POST /api/flight-tests/${ft_id}/record-outcome", payload: { outcome: "PASS" }, as: DeliveryManager }
            - { call: "POST /api/aircraft-units/${ac_id}/verify-configuration", payload: {}, as: DeliveryManager }
          trigger:
            - { call: "POST /api/aircraft-units/${ac_id}/conduct-walkthrough", payload: { snag_count: 2 }, as: Customer, as_user_id: "${cust_id}", captures: { del1: "$.data.delivery_status" } }
            - { call: "GET /api/aircraft-units/${ac_id}/rework-orders", payload: {}, as: DeliveryManager, captures: { rw_id: "$.data[0].id", rw_src: "$.data[0].source", rw_est: "$.data[0].estimated_cost_cents" } }
            - { call: "POST /api/rework-orders/${rw_id}/close", payload: { actual_hours: 8, parts_cents: 0 }, as: LineManager }
            - { call: "POST /api/aircraft-units/${ac_id}/begin-delivery", payload: {}, as: DeliveryManager, captures: { del2: "$.data.delivery_status" } }
          assert:
            - "walkthrough with snag_count 2: delivery_status == REJECTED"
            - "exactly one rework order spawned: source == WALKTHROUGH_SNAG, estimated_cost_cents == 120000 (2 * 4 * 15000 * 1.0)"
            - "after closing the rework: begin-delivery moves delivery_status back to FLIGHT_TESTING (retry cycle)"
      - name: verify_configuration_mismatch_rejected_after_state_gate_passes
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.AircraftUnit.delivery_status.FLIGHT_TESTING_to_delivery_status.CONFIG_VERIFIED"
          - "errors[ERR_CONFIGURATION_MISMATCH]"
        distinguishing_aspect: "With the state gate satisfied (FLIGHT_TESTING, all tests PASS), a configuration code mismatch still blocks verification with ERR_CONFIGURATION_MISMATCH (422)."
        test_recipe:
          setup: ["program M1, GOOD customer AL1, aircraft line 1010 (built CFG-A, ordered CFG-B) in FLIGHT_TESTING with one PASS test"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 1010, configuration_code: "CFG-A", ordered_configuration_code: "CFG-B", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/work-packages", payload: { station_sequence: 1, description: "Join", planned_hours: 5 }, as: LineManager, captures: { wp_id: "$.data.id" } }
            - { call: "POST /api/work-packages/${wp_id}/complete", payload: {}, as: LineManager }
            - { call: "POST /api/aircraft-units/${ac_id}/begin-delivery", payload: {}, as: DeliveryManager }
            - { call: "POST /api/aircraft-units/${ac_id}/flight-tests", payload: { range_code: "RANGE_ALPHA", window_start: "2026-10-02T09:00:00Z", window_end: "2026-10-02T12:00:00Z" }, as: DeliveryManager, captures: { ft_id: "$.data.id" } }
            - { call: "POST /api/flight-tests/${ft_id}/record-outcome", payload: { outcome: "PASS" }, as: DeliveryManager }
          trigger:
            - { call: "POST /api/aircraft-units/${ac_id}/verify-configuration", payload: {}, as: DeliveryManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CONFIGURATION_MISMATCH with HTTP 422 (CFG-A != CFG-B)"

