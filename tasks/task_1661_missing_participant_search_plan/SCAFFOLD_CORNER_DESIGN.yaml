      - name: blackout_complete_before_end_and_census_frozen
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_BLACKOUT_NOT_ENDED]", "errors[ERR_CASE_CENSUS_FROZEN]", "errors[ERR_DISTRIBUTION_NOTICE_REQUIRED]"]
        distinguishing_aspect: "Three leftover guards: completing a blackout before end_at, adding a participant after distributions begin, and beginning distributions without a DISTRIBUTION notice."
        test_recipe:
          setup:
            - "Case A (DRAFT) with blackout [2026-09-01, 2026-09-05), advisory issued 2026-08-01, activated at 2026-09-02; clock at 2026-09-03 (inside the window, before end). Case B effectuated and in DISTRIBUTION_IN_PROGRESS (census frozen). Case C in TERMINATION_EFFECTIVE with no DISTRIBUTION notice."
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "EarlyEnd Co 401k", sponsor_ein: "123456789", plan_number: "202", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_be: "$.data.id", c_be_v: "$.data.version" } }
            - { call: "POST /blackout-periods", payload: { termination_case_id: "${c_be}", start_at: "2026-09-01T00:00:00Z", end_at: "2026-09-05T00:00:00Z", outgoing_recordkeeper: "OldRK", incoming_recordkeeper: "NewRK" }, as: PlanAdministrator, captures: { b_be: "$.data.id" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_be}", notice_type: BLACKOUT_ADVISORY, action_effective_date: "2026-09-01T00:00:00Z", expected_termination_case_version: "${c_be_v}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /blackout-periods/${b_be}/activate", payload: {}, as: Recordkeeper }
            - { call: "POST /termination-cases", payload: { plan_name: "Census Co 401k", sponsor_ein: "123456789", plan_number: "203", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_cf: "$.data.id", c_cf_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /notices", payload: { termination_case_id: "${c_cf}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_cf_v}" }, as: PlanAdministrator }
            - { call: "POST /termination-cases", payload: { plan_name: "NoDist Co 401k", sponsor_ein: "123456789", plan_number: "204", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_ndr: "$.data.id", c_ndr_v: "$.data.version" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_ndr}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_ndr_v}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_cf}/effectuate-termination", payload: {}, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_ndr}/effectuate-termination", payload: {}, as: PlanAdministrator }
            - { call: "GET /termination-cases/${c_cf}", payload: {}, as: PlanAdministrator, captures: { c_cf_v2: "$.data.version" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_cf}", notice_type: DISTRIBUTION, action_effective_date: "2026-10-20T00:00:00Z", expected_termination_case_version: "${c_cf_v2}" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_cf}/begin-distributions", payload: {}, as: PlanAdministrator }
