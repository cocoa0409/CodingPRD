              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/ep-adjustments"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", kind: "TAXABLE_INCOME", amount_cents: 600000, effective_date: "2026-01-15", expected_reit_version: "${reit_v}" }
              as: TaxDirector
              captures: { adj_id: $.data.id }
            - call: "POST /reit-compliance/ep-adjustments/${adj_id}/post"
              payload: {}
              as: TaxDirector
            - call: "POST /reit-compliance/distribution-requirements"
