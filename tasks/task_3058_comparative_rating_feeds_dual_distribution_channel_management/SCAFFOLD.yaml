      - { name: upfront_discount_cents, type: integer, source: computed, default: 0, description: "DIRECT only: 15% participation discount taken at bind" }
      - { name: discount_pct_applied, type: number, source: computed, default: null, description: "Final score-based discount pct realized at SCORED" }
