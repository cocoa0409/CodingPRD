              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /vendors/${v_id}/suspend"
              payload: {}
              as: Sourcing
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-31T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /contracts/${c_id}/renew"
              payload: {}
              as: Sourcing
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VENDOR_SUSPENDED"
            - "HTTP status == 409"

