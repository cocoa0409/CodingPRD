        distinguishing_aspect: "A numeric window boundary on the freshness metric: presenting on the 29th day after decided_at succeeds while presenting on the 30th day fails, because ERR_OFFER_EXPIRED fires on fresh_until <= clock and not on fresh_until < clock."
