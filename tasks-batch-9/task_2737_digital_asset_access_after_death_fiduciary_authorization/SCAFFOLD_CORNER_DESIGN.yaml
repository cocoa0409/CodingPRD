          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:30:00Z" }
              as: EstateAdmin
              captures: { now: $.data.current_utc }
            - call: "POST /documents/${dc_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
              captures: { dc_status2: $.data.verification_status, dc_verified_at: $.data.verified_at, dc_verifier: $.data.verified_by_user_id }
          assert:
            - "${dc_created} == 2026-08-01T00:00:00Z and ${dc_status} == PENDING"
            - "${now} == 2026-09-10T08:30:00Z"
            - "${dc_status2} == VERIFIED"
            - "${dc_verified_at} == 2026-09-10T08:30:00Z"
            - "${dc_verifier} equals the X-User-ID sent with the VERIFY call"
            - "Document.${dc_id}.created_at is still 2026-08-01T00:00:00Z and updated_at == 2026-09-10T08:30:00Z"
            - "Document.${dc_id}.version == 2 (creation 1, one transition)"
            - "Document.${dc_id}.id is unchanged by the transition and revocation_reason is null"
            - "the estate's phase is still INTAKE because no Fiduciary holds ISSUED letters yet"

      - name: platform_request_documents_must_belong_to_the_estate_and_match_their_slots
        claim_type: Parent Relationships
        grounds:
          - validations[priority=37]
          - validations[priority=38]
          - validations[priority=22]
          - endpoints[POST /estates/{estate_id}/platform-requests]
        distinguishing_aspect: |
          The two document slots are checked in three separate ways: an id that does not exist at all
          is ERR_DOCUMENT_NOT_FOUND (404), an id belonging to ANOTHER estate is
          ERR_DOCUMENT_ESTATE_MISMATCH (409, priority 37), and same-estate documents placed in the
          wrong slots are ERR_DOCUMENT_TYPE_MISMATCH (400, priority 38) — so a cross-estate letters
          document that is also of the wrong type reports the ESTATE mismatch, not the type mismatch.
        test_recipe:
          setup:
            - "estate A with fiduciary A, a DEATH_CERTIFICATE and a LETTERS_OF_AUTHORITY document"
            - "estate B with fiduciary B and its own LETTERS_OF_AUTHORITY document"
            - "one Platform"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
