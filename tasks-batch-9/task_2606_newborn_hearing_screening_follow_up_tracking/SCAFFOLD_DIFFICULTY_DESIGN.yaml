      - name: empty_followup_denominator_publishes_null_scores_not_zero
        grounds:
          - calculations.facility_performance_score
          - endpoints.POST_reporting_periods_id_close
          - endpoints.GET_facilities_id_performance
          - entities.Facility.fields.performance_score
          - entities.Facility.fields.last_closed_period_label
        distinguishing_aspect: |
          A DIFFERENT metric on a DIFFERENT endpoint — the empty-collection edge of the
          weighted-score denominators, observed through POST /reporting-periods/{id}/close and
          GET /facilities/{id}/performance. The facility screened its only baby (r1_cohort
          1.0000) but produced zero episodes, so r2_denominator == 0 makes BOTH published scores
          null rather than 0.00, and no re-normalisation over the remaining weights is allowed.
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1) with screener S1 and one infant N born 2026-08-05T00:00:00Z who PASSES at birth admission, so no follow-up episode is ever created."
            - "ReportingPeriod August [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z), submission_due_datetime 2026-09-05T00:00:00Z."
            - "BH1 files an on-time report attesting 1 screen / 0 refers (variance 0) and the auditor accepts it before the close."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
