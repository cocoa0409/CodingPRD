        grounds:
          - validations[priority=8]
          - entities.RateContract.fields.effective_from
          - entities.RateContract.fields.effective_to
        distinguishing_aspect: |
          Interval semantics: half-open [effective_from, effective_to) on RateContract —
          a successor starting exactly at the incumbent's effective_to (2026-12-31) is
          adjacent and activates cleanly, while one starting one day earlier
          (2026-12-30) collides with ERR_CONTRACT_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Standard USD chain with C1 ACTIVE [2026-08-01, 2026-12-31); drafts C5 [2026-12-31, 2027-06-01) and C6 [2026-12-30, 2027-06-01)"
