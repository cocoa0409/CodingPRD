          Three transitions with LEDGER or COUNTER side effects are fired a second time. Rejection alone is
          not enough: the replay must not append a fourth ReserveEntry, must not re-stamp severity, must not
          double-return rooms and must not erase advance_issuing_examiner_user_id, which the scaffold keeps
          after a void precisely so the segregation-of-duties record survives. incurred_total, case_reserve
