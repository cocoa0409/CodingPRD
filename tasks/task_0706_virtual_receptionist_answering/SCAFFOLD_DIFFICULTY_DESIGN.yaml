          assert:
            - "Call.${call_id}.billed_units == 3 after complete"
            - "Call.${call_id}.billed_units == 1 after adjust"
            - "BillingPeriod.${period_id}.consumed_units == 1 after adjust (invariant: == sum of BILLED/ADJUSTED billed_units, no drift)"

      # ---- Instance 2: slot-capacity invariant (CalendarSlot booked_count/available_count conserved)
      - name: cancel_restores_slot_capacity_invariant
        grounds:
          - state_machines.Appointment.status.CONFIRMED_to_CANCELLED
          - entities.CalendarSlot.fields.booked_count
          - entities.CalendarSlot.fields.available_count
          - entities.CalendarSlot.fields.capacity
        distinguishing_aspect: |
          Conserved quantity #2 (different from instance 1's minutes ledger):
          CalendarSlot must always satisfy available_count == capacity -
          booked_count. Forward action (book + confirm: booked 0->1) paired with
          compensating action (cancel: booked 1->0) restores the slot exactly to
          capacity, no drift.
        test_recipe:
          setup:
            - "OPEN slot capacity 2 buffer 0; one appointment booked (booked_count 1, available 1) then confirmed; then cancelled."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "PCcap", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Rho", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /va/calendar-slots"
              payload: { account_id: "${acct_id}", window_start: "2026-03-02T09:00:00Z", window_end: "2026-03-02T17:00:00Z", buffer_minutes: 0, capacity: 2 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /va/appointments"
              payload: { account_id: "${acct_id}", slot_id: "${slot_id}", start_at: "2026-03-02T10:00:00Z", end_at: "2026-03-02T10:30:00Z", expected_slot_version: "${slot_v0}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /va/appointments/${appt_id}/confirm"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "GET /va/calendar-slots/${slot_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { booked_before: $.data.booked_count, avail_before: $.data.available_count }
          trigger:
            - call: "POST /va/appointments/${appt_id}/cancel"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
          assert:
            - "CalendarSlot.${slot_id}.booked_count == 1 AND available_count == 1 before cancel"
            - "CalendarSlot.${slot_id}.booked_count == 0 after cancel"
            - "CalendarSlot.${slot_id}.available_count == 2 after cancel (== capacity - booked_count, invariant restored)"
