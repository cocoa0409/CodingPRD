  - section: endpoints
    instances:
      - name: list_clients_pagination
        claim_type: Computed read
        grounds: [endpoints.GET_/clients, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /clients?limit=1&offset=0 with two clients returns 1 item, total_count=2, has_more=true."
        test_recipe:
          setup: ["Empty DB; two clients."]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Page One", ein: "200000017", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant }
            - { call: "POST /clients", payload: { legal_name: "Page Two", ein: "200000018", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant }
          trigger:
            - { call: "GET /clients", payload: { limit: 1, offset: 0 }, as: BenefitsConsultant }
          assert:
            - "response_type == array"
            - "meta/pagination total_count == 2"
            - "meta/pagination has_more == true"

      - name: list_census_members_by_client_fk
        claim_type: Standard CRUD
