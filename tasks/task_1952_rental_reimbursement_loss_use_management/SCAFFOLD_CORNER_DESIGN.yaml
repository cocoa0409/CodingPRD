        claim_type: violation_to_error
        grounds: ["errors[ERR_PARTNER_SUSPENDED]"]
        excluded_because:
          difficulty_instance: booking_temporal_beats_referential
          rationale: "The control arm of the named §1.8 instance asserts ERR_PARTNER_SUSPENDED on a suspended partner with a valid pickup date."

      - name: error_repair_order_state_on_extension_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_REPAIR_ORDER_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: extension_approve_requires_repair_in_progress
          rationale: "ERR_REPAIR_ORDER_INVALID_STATE on extension approve asserted in the named §1.8 instance; the milestone/complete invalid-from arms are covered by §1.9 state_machines instances."

