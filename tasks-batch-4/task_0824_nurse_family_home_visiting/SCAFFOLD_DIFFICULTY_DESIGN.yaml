            - call: "POST /enrollments"
              payload: { client_id: "${c2_id}" }
              as: IntakeCoordinator
              captures: { e2_id: $.data.id }
            - call: "POST /enrollments/${e2_id}/activate-enrollment"
              payload: {}
              as: IntakeCoordinator
              captures: { e2_v: $.data.version }
            - call: "POST /assignments"
              payload: { enrollment_id: "${e2_id}", nurse_id: "${nurse_id}", expected_enrollment_version: "${e2_v}", high_needs: false }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /visits"
              payload: { enrollment_id: "${e1_id}", nurse_id: "${nurse_id}", phase: "PREGNANCY", target_date: "2026-06-01", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { enrollment_id: "${e2_id}", nurse_id: "${nurse_id}", phase: "PREGNANCY", target_date: "2026-06-01", scheduled_start: "2026-06-01T11:15:00Z", scheduled_end: "2026-06-01T12:00:00Z" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VISIT_OVERLAP"
            - "response http status == 409"

      - name: duplicate_target_date_same_enrollment
        grounds:
          - validations[priority=6]
          - entities.Visit.fields.target_date
          - errors[ERR_DUPLICATE_TARGET_DATE]
        distinguishing_aspect: "Enrollment-resource overlap with calendar-date-equality semantics (no buffer, clock-independent): a second visit on the same enrollment with the same target_date is rejected even with a different nurse and non-overlapping clock time — a different resource and interval geometry than the nurse travel-buffer rule."
        test_recipe:
          setup:
            - "Enrollment E ACTIVE (nurse N1 assigned); an existing visit on E with target_date 2026-06-05 at 09:00-10:00; a second nurse N2 exists."
          setup_api_calls:
            - call: "POST /nurses"
              payload: { full_name: "N Dup1", credential_type: "RN" }
              as: ProgramAdmin
              captures: { n1_id: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "N Dup2", credential_type: "RN" }
              as: ProgramAdmin
              captures: { n2_id: $.data.id }
            - call: "POST /supervisors"
              payload: { full_name: "S Dup" }
              as: ProgramAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C Dup", mother_dob: "2001-10-10", first_time_mother: true, gestational_age_weeks: 20 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/consent"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /enrollments"
              payload: { client_id: "${client_id}" }
              as: IntakeCoordinator
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate-enrollment"
              payload: {}
              as: IntakeCoordinator
              captures: { enr_v2: $.data.version }
            - call: "POST /assignments"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${n1_id}", expected_enrollment_version: "${enr_v2}", high_needs: false }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${n1_id}", phase: "PREGNANCY", target_date: "2026-06-05", scheduled_start: "2026-06-05T09:00:00Z", scheduled_end: "2026-06-05T10:00:00Z" }
              as: HomeVisitNurse
              as_user_id: "${n1_id}"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${n2_id}", phase: "PREGNANCY", target_date: "2026-06-05", scheduled_start: "2026-06-05T14:00:00Z", scheduled_end: "2026-06-05T15:00:00Z" }
              as: HomeVisitNurse
              as_user_id: "${n2_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_TARGET_DATE"
            - "response http status == 409"

  - rule_id: compensating_invariant
    instances:
      - name: caseload_weight_conserved_on_assignment_end
        grounds:
          - calculations.nurse_caseload_weight
          - state_machines.Assignment.ACTIVE_to_ENDED
          - entities.Nurse.fields.current_caseload_weight
        distinguishing_aspect: "Conserved quantity = Nurse.current_caseload_weight: creating a PREGNANCY assignment adds exactly 1.0 and ending it subtracts exactly 1.0, returning the nurse to 0.0 (invariant: current_caseload_weight == sum of ACTIVE assignment weights)."
        test_recipe:
          setup:
            - "Nurse N with one ACTIVE PREGNANCY assignment (weight 1.0), so current_caseload_weight == 1.0."
          setup_api_calls:
            - call: "POST /nurses"
              payload: { full_name: "N Inv1", credential_type: "RN" }
              as: ProgramAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /supervisors"
              payload: { full_name: "S Inv1" }
              as: ProgramAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C Inv1", mother_dob: "2001-11-11", first_time_mother: true, gestational_age_weeks: 20 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/consent"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /enrollments"
              payload: { client_id: "${client_id}" }
              as: IntakeCoordinator
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate-enrollment"
              payload: {}
              as: IntakeCoordinator
              captures: { enr_v2: $.data.version }
            - call: "POST /assignments"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", expected_enrollment_version: "${enr_v2}", high_needs: false }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /assignments/${asg_id}/end"
              payload: {}
              as: Supervisor
              as_user_id: "${sup_id}"
          assert:
            - "response.data.status == ENDED"
            - "GET /nurses/${nurse_id} Nurse.current_caseload_weight == 0.0"

      - name: completed_visit_count_conserved_on_revert
        grounds:
          - calculations.visit_dosage
          - state_machines.Visit.COMPLETED_to_SCHEDULED
          - entities.Enrollment.fields.completed_visit_count
        distinguishing_aspect: "Conserved quantity = Enrollment.completed_visit_count: completing a visit increments it to 1 and revert-completion decrements it back to 0 with the visit returning to SCHEDULED (a different conserved quantity than caseload weight)."
        test_recipe:
          setup:
            - "ACTIVE enrollment with nurse N; one visit completed so completed_visit_count == 1; clock 2026-06-01."
          setup_api_calls:
            - call: "POST /nurses"
              payload: { full_name: "N Inv2", credential_type: "RN" }
              as: ProgramAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /supervisors"
              payload: { full_name: "S Inv2" }
              as: ProgramAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C Inv2", mother_dob: "2001-12-12", first_time_mother: true, gestational_age_weeks: 20 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/consent"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /enrollments"
              payload: { client_id: "${client_id}" }
              as: IntakeCoordinator
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate-enrollment"
              payload: {}
              as: IntakeCoordinator
              captures: { enr_v2: $.data.version }
            - call: "POST /assignments"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", expected_enrollment_version: "${enr_v2}", high_needs: false }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", phase: "PREGNANCY", target_date: "2026-05-01", scheduled_start: "2026-05-01T09:00:00Z", scheduled_end: "2026-05-01T10:00:00Z" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /visits/${v1_id}/complete"
              payload: { completed_date: "2026-05-01" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
          trigger:
            - call: "POST /visits/${v1_id}/revert-completion"
              payload: {}
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
          assert:
            - "response.data.status == SCHEDULED"
            - "GET /enrollments/${enr_id} Enrollment.completed_visit_count == 0"
