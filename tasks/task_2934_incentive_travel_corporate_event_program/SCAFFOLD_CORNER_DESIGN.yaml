          budget_per_qualifier_cents: 2500000
          guest_allowance: 1
          air_cabin_class: BUSINESS
          upgrade_allowance_cents: 150000
          service_load_bp: 1275
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          t1_id: $.data.id
      - call: POST /award-tiers
        payload:
          program_id: ${p_id}
          tier_code: GOLD
          tier_rank: 2
          qualification_threshold: 150000000
          budget_per_qualifier_cents: 1600000
          guest_allowance: 1
          air_cabin_class: PREMIUM_ECONOMY
          upgrade_allowance_cents: 40000
          service_load_bp: 800
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          t2_id: $.data.id
      - call: POST /destinations
        payload:
          program_id: ${p_id}
          city: Lisbon
          country_code: PT
          per_person_cost_cents: 431757
          risk_score: 35
          air_gateway_code: LIS
        as: SourcingManager
        as_user_id: sm-01
        captures:
          d1_id: $.data.id
      - call: POST /destinations/${d1_id}/site-inspection
        payload:
          inspection_score: 82
        as: SourcingManager
        as_user_id: sm-01
      - call: POST /destinations/${d1_id}/shortlist
        payload: {}
        as: SourcingManager
        as_user_id: sm-01
      - call: POST /qualifiers
        payload:
          program_id: ${p_id}
          employee_code: S-1001
          full_name: Ana Reyes
          baseline_metric: 180000000
          actual_metric: 260000000
          guest_count: 1
        as: SalesOpsAnalyst
        as_user_id: so-01
        captures:
          qa_id: $.data.id
      - call: POST /qualifiers/${qa_id}/review
        payload: {}
        as: SalesOpsAnalyst
        as_user_id: so-01
      - call: POST /qualifiers
