            - "GET /parity/nqtl-items?classification_id=${cls_id} returns total_count == 0"
            - "PlanYear.${py_id}.compliance_posture == COMPLIANT (no inventoried item was created)"

      - name: computed_fields_of_parity_test_and_submission_are_server_derived
        claim_type: Computed Fields
        grounds:
          - entities.ParityTest.fields.substantially_all_ratio
          - entities.DataSubmission.fields.disparity_ratio
        excluded_because:
          difficulty_instance: "dual_variant_calc / qtl_predominant_level_plan_payments_versus_claims_count_diverge"
          rationale: "Every computed field of ParityTest and DataSubmission is asserted as a literal in that instance and in boundary_precision_check / disparity_ratio_exactly_at_threshold_versus_one_ten_thousandth_below."

  # ===========================================================================
  # 2. From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: nqtl_item_starts_in_inventoried_and_plan_year_starts_open
        claim_type: Initial State
        grounds:
          - state_machines.NqtlItem
          - state_machines.PlanYear
          - calculations.plan_year_compliance_posture
        distinguishing_aspect: "A freshly created NqtlItem is INVENTORIED with a null stringency index, and that single inventoried item alone drives the owning plan year's posture to AT_RISK via ladder clause 2."
        test_recipe:
          setup:
            - "One Administrator, one PlanYear, one classification."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
          trigger:
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "PRIOR_AUTHORIZATION", applied_to: "BOTH", description: "Prior authorization for outpatient office visits." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_id: $.data.id }
          assert:
            - "NqtlItem.${item_id}.status == INVENTORIED (declared initial_state)"
            - "NqtlItem.${item_id}.stringency_in_operation_index == 0.00 with stringency_flag == false (no evidence, no analysis)"
            - "NqtlItem.${item_id}.determination_recorded_by_user_id == null"
            - "PlanYear.${py_id}.compliance_posture == AT_RISK and status == OPEN"
            - "PlanYear.${py_id}.open_violation_count == 0"

      - name: submitting_an_already_submitted_analysis_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.ComparativeAnalysis.DRAFT_to_SUBMITTED
          - errors.ERR_ANALYSIS_NOT_DRAFT
          - validations.priority_16_ERR_ANALYSIS_NOT_DRAFT
        distinguishing_aspect: "The second POST .../submit on the same analysis returns ERR_ANALYSIS_NOT_DRAFT rather than succeeding idempotently, and the owning item's status does not advance twice."
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear, one classification, one NqtlItem, one SUBMITTED ComparativeAnalysis."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "PRIOR_AUTHORIZATION", applied_to: "BOTH", description: "Prior authorization for outpatient office visits." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_id: $.data.id, item_v0: $.data.version }
            - call: "POST /parity/comparative-analyses"
              payload: { nqtl_item_id: "${item_id}", factor_count: 3, evidentiary_standard_count: 2, stringency_written_finding: "COMPARABLE", stringency_operation_finding: "COMPARABLE", expected_nqtl_item_version: "${item_v0}" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { ca_id: $.data.id }
            - call: "POST /parity/comparative-analyses/${ca_id}/submit"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
          trigger:
            - call: "POST /parity/comparative-analyses/${ca_id}/submit"
              payload: {}
              as: Administrator
              as_user_id: "${adm_id}"
          assert:
            - "409 with data.error_id == ERR_ANALYSIS_NOT_DRAFT"
            - "ComparativeAnalysis.${ca_id}.status == SUBMITTED and revision_round == 0"
            - "NqtlItem.${item_id}.status == ANALYSIS_SUBMITTED (unchanged by the refused call)"
            - "POST /parity/comparative-analyses/${ca_id}/reopen -> 409 ERR_ANALYSIS_NOT_INSUFFICIENT"

      - name: determination_on_an_inventoried_item_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.NqtlItem
          - errors.ERR_ITEM_NOT_AWAITING_DETERMINATION
          - validations.priority_16_ERR_ANALYSIS_NOT_DRAFT
        distinguishing_aspect: "POST .../determinations from INVENTORIED — a state the determination transitions never depart from — returns ERR_ITEM_NOT_AWAITING_DETERMINATION even though the payload, role and OCC version are all correct."
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear, one classification, one INVENTORIED NqtlItem with no analysis at all."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "MEDICAL_NECESSITY_CRITERIA", applied_to: "BOTH", description: "Medical necessity criteria for outpatient office visits." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_id: $.data.id }
            - call: "GET /parity/plan-years/${py_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { py_v: $.data.version }
          trigger:
            - call: "POST /parity/nqtl-items/${item_id}/determinations"
              payload: { outcome: "COMPLIANT", rationale: "Attempting to close an item that has no comparative analysis on file.", expected_plan_year_version: "${py_v}" }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
          assert:
            - "409 with data.error_id == ERR_ITEM_NOT_AWAITING_DETERMINATION"
            - "NqtlItem.${item_id}.status == INVENTORIED and determination_recorded_by_user_id == null"
            - "PlanYear.${py_id}.compliance_posture == AT_RISK (unchanged) and open_violation_count == 0"
            - "GET /parity/nqtl-items/${item_id}/participant-notices returns 0 rows"

      - name: superseding_a_certified_analysis_rejected
        claim_type: Precondition Enforcement
        grounds:
          - validations.priority_13_ERR_ANALYSIS_ALREADY_SUPERSEDED
          - state_machines.ComparativeAnalysis.SUBMITTED_to_WITHDRAWN
          - entities.ComparativeAnalysis.fields.supersedes_analysis_id
        distinguishing_aspect: "supersedes_analysis_id pointing at a CERTIFIED analysis returns ERR_ANALYSIS_ALREADY_SUPERSEDED; the same self-referential FK pointing at a DRAFT analysis succeeds and withdraws the target."
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear, one classification, one NETWORK_ADMISSION NqtlItem applied_to BOTH."
            - "One VALIDATED DENIAL_RATES submission (137/1919 vs 71/1913) so certification is permitted."
            - "One CERTIFIED ComparativeAnalysis authored by user-sponsor-01 and certified by user-officer-02."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
