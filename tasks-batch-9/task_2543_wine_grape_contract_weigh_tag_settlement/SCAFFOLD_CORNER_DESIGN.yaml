            - "${e3} == ERR_BASIS_FIELD_MISMATCH: ACREAGE forbids committed_tons even though contracted_yield_tons_per_acre is present"
            - "${e4} == ERR_BASIS_FIELD_MISMATCH: BLOCK forbids both fields"
            - "${e5} == ERR_BASIS_FIELD_MISMATCH: allocated_acres is REQUIRED when the parent contract's basis is ACREAGE"
            - "${e6} == ERR_BASIS_FIELD_MISMATCH: allocated_acres is FORBIDDEN when the parent contract's basis is not ACREAGE"
            - "None of the six calls created a row: GET /grower-relations/grape-contracts reports total_count == 2 and GET /grower-relations/contract-block-allocations reports total_count == 0"

      - name: malformed_installment_plans_are_rejected_422
        claim_type: Violation → Error
        grounds:
          - validations.priority_10
          - errors[ERR_INVALID_INSTALLMENT_PLAN]
        distinguishing_aspect: |
          Priority 10 has five independent clauses and each needs its own probe: cardinality
          1-6, installment_no values exactly 1..n with no gaps or repeats, every
          pct_of_settlement strictly positive, and the percentages summing to EXACTLY 100.0.
          The sum clause is the subtle one — 99.9 and 100.1 are both refused, so no tolerance
          band is allowed, which is what keeps the waterfall's money-conservation invariant
          provable.
