            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-05", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { absA: $.data.id } }
            - { call: "POST /absences", payload: { staff_member_id: "${t2}", start_date: "2026-08-04", end_date: "2026-08-06", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t2}", captures: { absB: $.data.id } }
            - { call: "POST /absences", payload: { staff_member_id: "${t3}", start_date: "2026-08-06", end_date: "2026-08-07", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t3}", captures: { absC: $.data.id } }
            - { call: "POST /assignments", payload: { absence_id: "${absA}", substitute_id: "${subX}" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { asgA: $.data.id } }
            - { call: "POST /assignments/${asgA}/respond", payload: { decision: "ACCEPT" }, as: Substitute, as_user_id: "${subX}" }
            - { call: "POST /assignments", payload: { absence_id: "${absB}", substitute_id: "${subX}" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { asgB: $.data.id } }
            - { call: "POST /assignments", payload: { absence_id: "${absC}", substitute_id: "${subX}" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { asgC: $.data.id } }
          trigger:
            - { call: "POST /assignments/${asgB}/respond", payload: { decision: "ACCEPT" }, as: Substitute, as_user_id: "${subX}", captures: { errB: $.data.error_id } }
            - { call: "POST /assignments/${asgC}/respond", payload: { decision: "ACCEPT" }, as: Substitute, as_user_id: "${subX}", captures: { asgC_status: $.data.status } }
          assert:
            - "Absence B accept rejected: error_id == ERR_ASSIGNMENT_DATE_OVERLAP (ranges 08-03..08-05 and 08-04..08-06 share 08-04 and 08-05)"
            - "Assignment.${asgB}.status == OFFERED (rejection leaves the offer live)"
            - "Absence C accept succeeds: Assignment.${asgC}.status == ACCEPTED (range 08-06..08-07 is adjacent to 08-03..08-05 with zero shared days)"
            - "Absence.${absC}.fill_status == ASSIGNED"

      - name: internal_coverage_aggregate_capacity_semantics
        grounds:
          - validations[priority=15]
          - errors[ERR_COVERAGE_CAPACITY_EXCEEDED]
          - calculations.coverage_compensation
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on the StaffMember resource — unlike the
          substitute's binary day-exclusion rule, multiple coverages on the same date are
          allowed until the period budget binds: exactly 8 periods on one day pass (cap is
          inclusive), period 9 on that day fails daily, and an 11th period inside the same ISO
          week fails weekly even though that single day had capacity left.
        test_recipe:
          setup:
            - "District defaults (daily_period_cap 8, weekly_period_cap 10); school budget 1000000"
            - "T1 (SCIENCE/HIGH) reports three 1-day absences Mon 2026-08-03, Tue 2026-08-04, Wed 2026-08-05; no substitutes exist (empty pool); batch on 2026-08-05 marks all three UNFILLED"
            - "T2 is the covering teacher"
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "SCIENCE", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach Two", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t2: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Coord One", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { coord: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-03", absence_type: "SICK", required_subject: "SCIENCE", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-04", end_date: "2026-08-04", absence_type: "SICK", required_subject: "SCIENCE", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs2: $.data.id } }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-05", end_date: "2026-08-05", absence_type: "SICK", required_subject: "SCIENCE", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs3: $.data.id } }
            - { call: "POST /dispatch-batches", payload: { district_id: "${dist}", run_for_date: "2026-08-05" }, as: DistrictAdmin, captures: { batch: $.data.id, n_unfilled: $.data.absences_marked_unfilled } }
            - { call: "POST /internal-coverages", payload: { absence_id: "${abs1}", staff_member_id: "${t2}", coverage_date: "2026-08-03", periods: 8 }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { cov1: $.data.id } }
          trigger:
            - { call: "POST /internal-coverages", payload: { absence_id: "${abs1}", staff_member_id: "${t2}", coverage_date: "2026-08-03", periods: 1 }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { errDaily: $.data.error_id } }
            - { call: "POST /internal-coverages", payload: { absence_id: "${abs2}", staff_member_id: "${t2}", coverage_date: "2026-08-04", periods: 2 }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { cov3: $.data.id } }
            - { call: "POST /internal-coverages", payload: { absence_id: "${abs3}", staff_member_id: "${t2}", coverage_date: "2026-08-05", periods: 1 }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { errWeekly: $.data.error_id } }
          assert:
            - "DispatchBatch.${batch}.absences_marked_unfilled == 3"
            - "Coverage ${cov1} created PROPOSED with periods == 8 (daily cap 8 is inclusive: 8 <= 8 passes)"
            - "Second Monday coverage (9th period): error_id == ERR_COVERAGE_CAPACITY_EXCEEDED (daily)"
            - "Tuesday coverage ${cov3} created PROPOSED with periods == 2 (weekly total 8 + 2 == 10 <= 10 passes)"
            - "Wednesday coverage (weekly 11th period): error_id == ERR_COVERAGE_CAPACITY_EXCEEDED (weekly), even though Wednesday's daily usage would have been 1"

  - rule_id: compensating_invariant
    instances:
      - name: budget_commit_then_cancel_restores_available_exactly
        grounds:
          - entities.School.fields.coverage_budget_committed_cents
          - entities.School.fields.coverage_budget_spent_cents
          - entities.School.fields.coverage_budget_available_cents
          - state_machines.Assignment.ACCEPTED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity is money in cents: the forward action (accept) moves 40000 from
          available to committed, and its compensating action (cancel before work) releases
          exactly the same 40000 back — committed + spent + available == 200000 holds before,
          during, and after, with zero drift.
        test_recipe:
          setup:
            - "District defaults; school budget 200000; teacher MATH/HIGH; sub A rate 20000 ACTIVE qualified"
            - "Clock 2026-07-29 -> premium 1.00; absence Mon 2026-08-03..Tue 2026-08-04 (2 days)"
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 200000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Coord One", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { coord: $.data.id } }
            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 20000 }, as: DistrictAdmin, captures: { subA: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subA}", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "BACKGROUND_CHECK", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr1: $.data.id } }
            - { call: "POST /clearances/${clr1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr2: $.data.id } }
            - { call: "POST /clearances/${clr2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subA}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-04", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /assignments", payload: { absence_id: "${abs1}", substitute_id: "${subA}" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { asg1: $.data.id } }
            - { call: "POST /assignments/${asg1}/respond", payload: { decision: "ACCEPT" }, as: Substitute, as_user_id: "${subA}" }
            - { call: "GET /schools/${sch}", payload: {}, as: DistrictAdmin, captures: { committed_mid: $.data.coverage_budget_committed_cents, spent_mid: $.data.coverage_budget_spent_cents, avail_mid: $.data.coverage_budget_available_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-30T00:00:00Z" }, as: DistrictAdmin }
          trigger:
            - { call: "POST /assignments/${asg1}/cancel", payload: {}, as: Substitute, as_user_id: "${subA}" }
            - { call: "GET /schools/${sch}", payload: {}, as: DistrictAdmin, captures: { committed_end: $.data.coverage_budget_committed_cents, spent_end: $.data.coverage_budget_spent_cents, avail_end: $.data.coverage_budget_available_cents } }
          assert:
            - "Mid-flight: committed == 40000, spent == 0, available == 160000 (sum == 200000)"
            - "After compensating cancel: committed == 0, spent == 0, available == 200000 (sum == 200000, exactly restored)"
            - "Assignment.${asg1}.cancel_reason == SUB_CANCEL and Substitute.${subA}.reliability_trailing_score == 95 (SUB_CANCEL_EARLY -5; lead 96h >= 24)"

      - name: absence_day_coverage_conservation_across_approve_and_cancel
        grounds:
          - calculations.absence_day_coverage
          - entities.Absence.fields.days_covered_internal
          - entities.Absence.fields.days_covered_sub
          - entities.Absence.fields.days_uncovered
          - state_machines.InternalCoverage.APPROVED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity is day-count, not money: approving coverage moves one day from
          uncovered to internal, and the compensating cancel moves it back —
          days_covered_internal + days_covered_sub + days_uncovered == total_days (5) at every
          step, and days_covered_sub stays 0 because no substitute assignment exists.
        test_recipe:
          setup:
            - "District defaults; school budget 1000000; T1 (SCIENCE) absent Mon 2026-08-03..Fri 2026-08-07 (5 days); T2 covers; no substitutes (empty pool)"
            - "Batch on 2026-08-05 marks the absence UNFILLED"
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "SCIENCE", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach Two", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t2: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Coord One", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { coord: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-07", absence_type: "SICK", required_subject: "SCIENCE", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /dispatch-batches", payload: { district_id: "${dist}", run_for_date: "2026-08-05" }, as: DistrictAdmin }
            - { call: "POST /internal-coverages", payload: { absence_id: "${abs1}", staff_member_id: "${t2}", coverage_date: "2026-08-03", periods: 4 }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { covMon: $.data.id } }
            - { call: "POST /internal-coverages/${covMon}/review", payload: { decision: "APPROVE" }, as: DistrictAdmin }
            - { call: "GET /absences/${abs1}", payload: {}, as: DistrictAdmin, captures: { dci_mid: $.data.days_covered_internal, dcs_mid: $.data.days_covered_sub, du_mid: $.data.days_uncovered, fill_mid: $.data.fill_status } }
            - { call: "POST /internal-coverages", payload: { absence_id: "${abs1}", staff_member_id: "${t2}", coverage_date: "2026-08-04", periods: 4 }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { covTue: $.data.id } }
            - { call: "POST /internal-coverages/${covTue}/review", payload: { decision: "APPROVE" }, as: DistrictAdmin }
          trigger:
            - { call: "POST /internal-coverages/${covMon}/cancel", payload: {}, as: SchoolCoordinator, as_user_id: "${coord}" }
            - { call: "GET /absences/${abs1}", payload: {}, as: DistrictAdmin, captures: { dci_end: $.data.days_covered_internal, dcs_end: $.data.days_covered_sub, du_end: $.data.days_uncovered, fill_end: $.data.fill_status } }
          assert:
            - "After Monday approval: days_covered_internal == 1, days_covered_sub == 0, days_uncovered == 4, fill_status == COVERED_INTERNALLY (sum == 5 == total_days)"
            - "After Monday cancel (compensation): days_covered_internal == 1 (Tuesday remains), days_covered_sub == 0, days_uncovered == 4 (sum == 5)"
            - "fill_status stays COVERED_INTERNALLY because one approved coverage remains"
            - "InternalCoverage.${covMon}.status == CANCELLED and ${covTue}.status == APPROVED"
