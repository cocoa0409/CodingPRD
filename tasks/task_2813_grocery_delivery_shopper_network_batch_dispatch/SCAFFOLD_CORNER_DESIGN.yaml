          assert:
            - "The batch-side read returns total_count == 2 and has_more == false, with ${bo_m} at sequence_no 1 (order_id ${om}, units 2) and ${bo_n} at sequence_no 2 (order_id ${on}, units 1)"
            - "The order-side read returns total_count == 1 and the single row is ${bo_n} with batch_id ${b50}"
            - "Batch.${b50}.total_units == 3, store_count == 1, total_distance_mi == 7.0 and delivery_deadline == 2026-08-01T10:30:00Z (the earliest member deadline)"

      - name: reauthorize_on_an_unheld_order_is_rejected
        claim_type: conditional_action
        grounds:
          - endpoints[POST /orders/{id}/reauthorize]
          - validations[priority=8]
          - errors.ERR_REAUTH_NOT_REQUIRED
        distinguishing_aspect: "Re-authorization is a conditional action gated on payment_status == REAUTH_HELD: on a plain AUTHORIZED order it answers ERR_REAUTH_NOT_REQUIRED (409) and recomputes nothing."
        test_recipe:
          setup:
            - "Retailer R1 with I1 EACH in_store 400 -> 460; Customer C1; Order O51 (I1 x1) submitted, so payment_status == AUTHORIZED with authorization_ceiling_cents 928."
