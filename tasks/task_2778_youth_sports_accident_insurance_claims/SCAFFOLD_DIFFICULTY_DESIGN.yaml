  - rule_id: boundary_precision_check
    instances:

      - name: deductible_exactly_equals_allowed_amount_pays_zero_vs_one_cent_more
        grounds:
          - calculations.claim_benefit_determination
          - calculations.provider_bill_allowed_amount
          - entities.Claim.fields.deductible_applied_cents
          - entities.Claim.fields.denial_reason
          - state_machines.Claim.UNDER_ADJUDICATION_to_DENIED
          - state_machines.Claim.UNDER_ADJUDICATION_to_APPROVED
        distinguishing_aspect: |
          The deductible boundary is probed at exactly the allowed amount and at exactly one cent above
          it: with allowed_amount_total_cents == 25000 == deductible_cents the benefit is 0 and the claim
          is DENIED with denial_reason NO_BENEFIT_PAYABLE, while with allowed_amount_total_cents == 25001
          the benefit is exactly 1 cent and the claim is APPROVED. A single cent of input flips both the
          money and the terminal state, so an implementation using `>` instead of `>=` (or clamping small
          benefits to zero) fails. Boundary axis: a money equality inside the max(0, net - deductible) leg.
        test_recipe:
          setup:
            - "One BASEBALL_U12 classification (deductible_cents 25000, PHYSICIAN_OFFICE cap 50000) and one ACTIVE policy with enrolled_participant_count 404 written on an EXCESS_ONLY basis, annual_premium_cents 822840."
            - "Two participants P1 and P2, each ENROLLED and each holding one ACTIVE UNVERIFIED FamilyHealthPlan so that request-eob is available."
            - "Both are injured at severity MINOR on the same SANCTIONED GAME, so the MINOR severity cap factor of 10000 bps leaves the PHYSICIAN_OFFICE scheduled cap at 50000 and the fee schedule is the binding term."
            - "Claim A carries one IN_NETWORK PHYSICIAN_OFFICE bill billed 60000 against a fee schedule of exactly 25000; claim B carries the identical bill against a fee schedule of exactly 25001."
            - "Both claims have an outstanding explanation-of-benefits request and the clock is then moved 46 days forward, so the lazy EOB_REQUESTED -> EOB_WAIVED sweep settles both claims on an EXCESS_OF_OTHER basis with other_insurance_paid_cents 0 - the face deductible of 25000 applies to both."
