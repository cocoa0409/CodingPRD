        distinguishing_aspect: |
          A THIRD metric (fill rate in basis points) through a THIRD endpoint
          (GET /events/{id}/staffing-model-recommendation). 4 worked of 5 planned is exactly 8000 bp,
          and the uplift test is strict (< 8000), so the correct answer is HOLD with the ratio
          unchanged at 0.80. Two off-by-one failure modes are ruled out at once: an implementation
