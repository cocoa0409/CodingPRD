scaffold_difficulty_design:
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rental_provisional_vs_final_settlement
        grounds:
          - calculations.rental_settlement
          - state_machines.Rental.ACTIVE_to_RETURNED
          - entities.Rental.fields.provisional_charge_cents
          - entities.Rental.fields.final_charge_cents
        distinguishing_aspect: "On one Rental (Rental domain) provisional=weekly*planned=8000 diverges from final=4000 (early return billed 2 actual weeks), unlike the Customer-domain loyalty tier dual variant."
        test_recipe:
          setup:
            - "GOLD-agnostic customer with due_date; rentable product (weekly 2000, deposit 12000); variant with 2 rental units; clock at 2026-07-01; a RENTAL order (4 weeks from 2026-07-01) reserved then activated; clock advanced to 2026-07-15 for an early return."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "r1@x.com", full_name: "R One", due_date: "2026-10-01T00:00:00Z" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Bump Dress", category: "MATERNITY", rentable: true, buy_price_cents: 12000, rental_weekly_cents: 2000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [2], rental_units_total: 2 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "RENTAL", expected_variant_version: "${var_v}", rental_weeks: 4, rental_start: "2026-07-01T00:00:00Z" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "GET /rentals"
              payload: { order_id: "${order_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { rental_id: "$.data[0].id" }
            - call: "POST /rentals/${rental_id}/activate"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rentals/${rental_id}/return"
              payload: {}
              as: FulfillmentAgent
          assert:
            - "Rental.${rental_id}.provisional_charge_cents == 8000"
            - "Rental.${rental_id}.final_charge_cents == 4000"
            - "Rental.${rental_id}.late_fee_cents == 0"
            - "Rental.${rental_id}.status == RETURNED"

      - name: loyalty_settled_vs_provisional_tier
        grounds:
          - calculations.loyalty_lifetime_valuation
          - entities.Customer.fields.loyalty_tier
          - entities.Customer.fields.lifetime_points
          - entities.Order.fields.earned_points
        distinguishing_aspect: "On one Customer (Customer domain) settled tier from lifetime_points 4900 is SILVER while a forward-looking projection adding the PAID+UNFULFILLED order's earned_points (4900+190=5090) would be GOLD; unlike the Rental-domain settlement dual variant."
        test_recipe:
          setup:
            - "Customer granted 4900 lifetime points (SILVER); places and PAYS (does not fulfill) a BUY order for a 20000-cent variant, earning 190 points that stay pending."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "l1@x.com", full_name: "L One" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /customers/${cust_id}/loyalty-adjustments"
              payload: { points_delta: 4900 }
              as: PlatformAdmin
            - call: "POST /products"
              payload: { name: "Nursing Top", category: "NURSING", buy_price_cents: 20000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "L", trimester_fit: [3], inventory_on_hand: 10 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "BUY", expected_variant_version: "${var_v}", quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cv: "$.data.version" }
          trigger:
            - call: "POST /orders/${order_id}/pay"
              payload: { expected_customer_version: "${cv}", redeemed_points: 0 }
              as: Shopper
              as_user_id: "${cust_id}"
          assert:
            - "Customer.${cust_id}.lifetime_points == 4900"
            - "Customer.${cust_id}.loyalty_tier == SILVER"
            - "Order.${order_id}.earned_points == 190"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_discount_tiered_nonlinear_mode_a
        grounds:
          - calculations.order_discount_pricing
          - calculations.order_grand_total
          - entities.Order.fields.discount_cents
          - state_machines.Order.UNPAID_to_PAID
        distinguishing_aspect: "Mode (a): discount = min(0.20, TIER_RATE[GOLD]=0.10 + SUBSCRIBER_PERK=0.05)*10000 = 1500 combines >=3 inputs (subtotal, tier, subscription-active) with a nested min cap; distinct from the mode (b) capsule rounding instance."
        test_recipe:
          setup:
            - "GOLD customer (5000 lifetime points) with an ACTIVE subscription; BUY order for a 10000-cent variant."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "d1@x.com", full_name: "D One" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /customers/${cust_id}/loyalty-adjustments"
              payload: { points_delta: 5000 }
              as: PlatformAdmin
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_tier: "CAPSULE_PLUS", monthly_fee_cents: 4000, next_ship_date: "2026-08-01T00:00:00Z" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Maternity Coat", category: "MATERNITY", buy_price_cents: 10000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [2], inventory_on_hand: 5 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "BUY", expected_variant_version: "${var_v}", quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
          assert:
            - "Order.${order_id}.subtotal_cents == 10000"
            - "Order.${order_id}.discount_cents == 1500"
            - "Order.${order_id}.shipping_cents == 0"
            - "Order.${order_id}.grand_total_cents == 8500"

      - name: capsule_retail_round_per_item_mode_b
        grounds:
          - calculations.capsule_retail_value
          - entities.Capsule.fields.retail_value_cents
          - state_machines.Capsule.PACKED_to_SHIPPED
        distinguishing_aspect: "Mode (b): retail_value = 3*round_half_up(2005*0.70)=3*1404=4212, whereas sum-then-round gives 4211; the PINNED round-per-item-then-sum order is the tested distinction, different axis from the mode (a) discount."
        test_recipe:
          setup:
            - "Customer with an ACTIVE subscription; a CAPSULE product with three variants each priced 2005 cents; pack a capsule containing all three."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "C One" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_tier: "CAPSULE_BASIC", monthly_fee_cents: 3000, next_ship_date: "2026-08-01T00:00:00Z" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Capsule Set", category: "CAPSULE", buy_price_cents: 2005 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "S", trimester_fit: [1] }
              as: PlatformAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [2] }
              as: PlatformAdmin
              captures: { v2: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "L", trimester_fit: [3] }
              as: PlatformAdmin
              captures: { v3: "$.data.id" }
          trigger:
            - call: "POST /subscriptions/${sub_id}/capsules"
              payload: { item_variant_ids: ["${v1}", "${v2}", "${v3}"], ship_date: "2026-08-01T00:00:00Z" }
              as: FulfillmentAgent
              captures: { capsule_id: "$.data.id" }
          assert:
            - "Capsule.${capsule_id}.retail_value_cents == 4212"
            - "Capsule.${capsule_id}.status == PACKED"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_cyclic_active_paused
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.PAUSED_to_ACTIVE
          - entities.Subscription.fields.status
        distinguishing_aspect: "Subscription returns to ACTIVE after PAUSED then pauses again (a true ACTIVE<->PAUSED cycle), a non-linear machine on Subscription — a different entity than the branching Rental machine."
        test_recipe:
          setup:
            - "Customer with a new ACTIVE subscription."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "s1@x.com", full_name: "S One" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_tier: "CAPSULE_BASIC", monthly_fee_cents: 3000, next_ship_date: "2026-08-01T00:00:00Z" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /subscriptions/${sub_id}/resume"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
          assert:
            - "Subscription.${sub_id}.status == PAUSED"

      - name: rental_branching_convert_vs_return
        grounds:
          - state_machines.Rental.ACTIVE_to_CONVERTED_TO_BUY
          - state_machines.Rental.ACTIVE_to_RETURNED
          - entities.ProductVariant.fields.rental_units_total
        distinguishing_aspect: "From ACTIVE, the CONVERTED_TO_BUY branch decrements ProductVariant.rental_units_total (permanent sale) whereas RETURNED does not — divergent side-effect sets prove branching on Rental, a different entity than the cyclic Subscription."
        test_recipe:
          setup:
            - "Customer with due_date; rentable product (weekly 2000, deposit 12000); variant with exactly 1 rental unit; RENTAL order (4 weeks from 2026-07-01) reserved then activated at clock 2026-07-01."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "r2@x.com", full_name: "R Two", due_date: "2026-10-01T00:00:00Z" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Rental Gown", category: "MATERNITY", rentable: true, buy_price_cents: 12000, rental_weekly_cents: 2000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [2], rental_units_total: 1 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "RENTAL", expected_variant_version: "${var_v}", rental_weeks: 4, rental_start: "2026-07-01T00:00:00Z" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "GET /rentals"
              payload: { order_id: "${order_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { rental_id: "$.data[0].id" }
            - call: "POST /rentals/${rental_id}/activate"
              payload: {}
              as: FulfillmentAgent
          trigger:
            - call: "POST /rentals/${rental_id}/convert-to-buy"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
          assert:
            - "Rental.${rental_id}.status == CONVERTED_TO_BUY"
            - "Rental.${rental_id}.final_charge_cents == 4000"
            - "ProductVariant.${var_id}.rental_units_total == 0"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: order_cancel_releases_rental_unit_depth3
        grounds:
          - state_machines.Order.UNFULFILLED_to_CANCELLED
          - state_machines.Rental.RESERVED_to_CANCELLED
          - entities.ProductVariant.fields.reserved_rental_units
        distinguishing_aspect: "Order cancel (hop1) -> linked Rental CANCELLED (hop2) -> ProductVariant.reserved_rental_units decremented 1->0 (hop3), each hop caused by the prior; a depth-3 chain triggered by order cancel."
        test_recipe:
          setup:
            - "Customer with due_date; rentable product; variant with 2 rental units; a RENTAL order reserved (not activated) so reserved_rental_units==1; clock 2026-07-01."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "r3@x.com", full_name: "R Three", due_date: "2026-10-01T00:00:00Z" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Cascade Dress", category: "MATERNITY", rentable: true, buy_price_cents: 9000, rental_weekly_cents: 1500 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [2], rental_units_total: 2 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "RENTAL", expected_variant_version: "${var_v}", rental_weeks: 3, rental_start: "2026-07-01T00:00:00Z" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "GET /rentals"
              payload: { order_id: "${order_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { rental_id: "$.data[0].id" }
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
          assert:
            - "Order.${order_id}.fulfillment_status == CANCELLED"
            - "Rental.${rental_id}.status == CANCELLED"
            - "ProductVariant.${var_id}.reserved_rental_units == 0"

      - name: return_approve_clawback_depth3
        grounds:
          - state_machines.Return.REQUESTED_to_APPROVED
          - entities.Order.fields.payment_status
          - entities.Customer.fields.lifetime_points
          - calculations.return_settlement
        distinguishing_aspect: "Return approve (hop1) -> linked Order.payment_status REFUNDED (hop2) -> Customer earned-points clawback lifetime_points 100->0 (hop3); a depth-3 chain from a different trigger (return approve) than order cancel."
        test_recipe:
          setup:
            - "COMPLETED BUY order (10000-cent variant, BRONZE, no redemption) that granted 100 earned points at fulfill; a REFUND return then requested within the window."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rt1@x.com", full_name: "RT One" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Postpartum Set", category: "POSTPARTUM", buy_price_cents: 10000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [3], inventory_on_hand: 5 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "BUY", expected_variant_version: "${var_v}", quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cv: "$.data.version" }
            - call: "POST /orders/${order_id}/pay"
              payload: { expected_customer_version: "${cv}", redeemed_points: 0 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /returns"
              payload: { order_id: "${order_id}", reason: "size", return_type: "REFUND" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { return_id: "$.data.id" }
          trigger:
            - call: "POST /returns/${return_id}/approve"
              payload: {}
              as: FulfillmentAgent
          assert:
            - "Return.${return_id}.status == APPROVED"
            - "Return.${return_id}.restocking_fee_cents == 1000"
            - "Return.${return_id}.refund_cents == 9000"
            - "Order.${order_id}.payment_status == REFUNDED"
            - "Customer.${cust_id}.lifetime_points == 0"
            - "Customer.${cust_id}.loyalty_points == 0"

  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pay_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_ORDER_NOT_PAYABLE]
          - errors[ERR_INSUFFICIENT_POINTS]
        distinguishing_aspect: "An already-PAID order (state, priority 6) with redeemed_points 5000 exceeding a 0 balance (business_fiscal, priority 10) returns ERR_ORDER_NOT_PAYABLE — a state vs business_fiscal pairing."
        test_recipe:
          setup:
            - "Customer with 0 loyalty points; a BUY order that has already been PAID once (redeem 0)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "p1@x.com", full_name: "P One" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Basic Tee", category: "NURSING", buy_price_cents: 5000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [1], inventory_on_hand: 5 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "BUY", expected_variant_version: "${var_v}", quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cv: "$.data.version" }
            - call: "POST /orders/${order_id}/pay"
              payload: { expected_customer_version: "${cv}", redeemed_points: 0 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cv2: "$.data.version" }
          trigger:
            - call: "POST /orders/${order_id}/pay"
              payload: { expected_customer_version: "${cv2}", redeemed_points: 5000 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 409"
            - "response.data.error_id == ERR_ORDER_NOT_PAYABLE"

      - name: order_referential_beats_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_PRODUCT_DISCONTINUED]
          - errors[ERR_INSUFFICIENT_STOCK]
        distinguishing_aspect: "Ordering a variant whose product is DISCONTINUED (business_referential, priority 7) while quantity 5 exceeds inventory 1 (business_constraint, priority 9) returns ERR_PRODUCT_DISCONTINUED — a referential vs constraint pairing distinct from the state/fiscal pair."
        test_recipe:
          setup:
            - "A DISCONTINUED product whose variant has only 1 unit of stock."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "p2@x.com", full_name: "P Two" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Retired SKU", category: "MATERNITY", buy_price_cents: 5000, status: "DISCONTINUED" }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [2], inventory_on_hand: 1 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "BUY", expected_variant_version: "${var_v}", quantity: 5 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 409"
            - "response.data.error_id == ERR_PRODUCT_DISCONTINUED"

  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: loyalty_tier_gold_boundary_5000
        grounds:
          - calculations.loyalty_lifetime_valuation
          - entities.Customer.fields.loyalty_tier
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "lifetime_points 4999 -> SILVER but 5000 -> GOLD (>= is inclusive at the exact threshold); a points-metric boundary read via GET /customers/{id}, distinct from the time-metric rental boundary."
        test_recipe:
          setup:
            - "A fresh customer whose lifetime points are raised to 4999 then to 5000 via adjustments."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "b1@x.com", full_name: "B One" }
              as: Guest
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "POST /customers/${cust_id}/loyalty-adjustments"
              payload: { points_delta: 4999 }
              as: PlatformAdmin
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { tier_at_4999: "$.data.loyalty_tier" }
            - call: "POST /customers/${cust_id}/loyalty-adjustments"
              payload: { points_delta: 1 }
              as: PlatformAdmin
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { tier_at_5000: "$.data.loyalty_tier" }
          assert:
            - "tier_at_4999 == SILVER"
            - "tier_at_5000 == GOLD"

      - name: rental_return_equal_end_not_late
        grounds:
          - calculations.rental_settlement
          - state_machines.Rental.ACTIVE_to_RETURNED
          - entities.Rental.fields.late_fee_cents
        distinguishing_aspect: "returned_at exactly equal to rental_end 2026-07-29 is on-time (late only when strictly greater), so late_fee_cents==0 and final_charge_cents==8000; a time-metric boundary on POST /rentals/{id}/return, different endpoint and metric than the loyalty points boundary."
        test_recipe:
          setup:
            - "Rentable product (weekly 2000, deposit 12000); 1 rental unit; RENTAL order 4 weeks from 2026-07-01 (rental_end 2026-07-29) reserved then activated; clock set to exactly 2026-07-29 for return."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "b2@x.com", full_name: "B Two", due_date: "2026-10-01T00:00:00Z" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Edge Gown", category: "MATERNITY", rentable: true, buy_price_cents: 12000, rental_weekly_cents: 2000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [2], rental_units_total: 1 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "RENTAL", expected_variant_version: "${var_v}", rental_weeks: 4, rental_start: "2026-07-01T00:00:00Z" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "GET /rentals"
              payload: { order_id: "${order_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { rental_id: "$.data[0].id" }
            - call: "POST /rentals/${rental_id}/activate"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-29T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rentals/${rental_id}/return"
              payload: {}
              as: FulfillmentAgent
          assert:
            - "Rental.${rental_id}.late_fee_cents == 0"
            - "Rental.${rental_id}.final_charge_cents == 8000"
            - "Rental.${rental_id}.status == RETURNED"

  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: capsule_ship_requires_subscription_active
        grounds:
          - state_machines.Capsule.PACKED_to_SHIPPED
          - entities.Subscription.fields.status
          - errors[ERR_SUBSCRIPTION_NOT_ACTIVE]
        distinguishing_aspect: "A PACKED capsule cannot ship while its parent Subscription is PAUSED (ship gated on Subscription.status==ACTIVE) — a Capsule->Subscription cross-entity dependency."
        test_recipe:
          setup:
            - "Customer with a subscription; a capsule PACKED under it; the subscription then PAUSED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ce1@x.com", full_name: "CE One" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_tier: "CAPSULE_BASIC", monthly_fee_cents: 3000, next_ship_date: "2026-08-01T00:00:00Z" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Capsule Item", category: "CAPSULE", buy_price_cents: 4000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [2] }
              as: PlatformAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/capsules"
              payload: { item_variant_ids: ["${v1}"], ship_date: "2026-08-01T00:00:00Z" }
              as: FulfillmentAgent
              captures: { capsule_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /capsules/${capsule_id}/ship"
              payload: {}
              as: FulfillmentAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 409"
            - "response.data.error_id == ERR_SUBSCRIPTION_NOT_ACTIVE"
            - "Capsule.${capsule_id}.status == PACKED"

      - name: order_place_requires_product_active
        grounds:
          - validations[priority=7]
          - entities.Product.fields.status
          - entities.ProductVariant.fields.status
          - errors[ERR_PRODUCT_DISCONTINUED]
        distinguishing_aspect: "Placing an order depends on the referenced ProductVariant's parent Product.status==ACTIVE; a DISCONTINUED product (with ample stock) blocks the order — an Order->ProductVariant pair, different from Capsule->Subscription."
        test_recipe:
          setup:
            - "A DISCONTINUED product whose variant has ample stock (10 units)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ce2@x.com", full_name: "CE Two" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Dead SKU", category: "MATERNITY", buy_price_cents: 6000, status: "DISCONTINUED" }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "L", trimester_fit: [3], inventory_on_hand: 10 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "BUY", expected_variant_version: "${var_v}", quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 409"
            - "response.data.error_id == ERR_PRODUCT_DISCONTINUED"

  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rental_pool_overlap_with_cleaning_buffer
        grounds:
          - calculations.rental_unit_availability
          - entities.ProductVariant.fields.rental_units_total
          - errors[ERR_NO_RENTAL_UNITS]
        distinguishing_aspect: "Rental B starting 2026-07-30 is one day inside the 2-day cleaning buffer after A's rental_end 2026-07-29 (A occupies [07-01, 07-31]); closed-interval aggregate-capacity(=1) overlap on ProductVariant rejects it — buffer-extended closed semantics."
        test_recipe:
          setup:
            - "Rentable product; variant with exactly 1 rental unit; rental A reserved for 4 weeks from 2026-07-01 (rental_end 2026-07-29); clock 2026-07-01."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "to1@x.com", full_name: "TO One", due_date: "2026-10-01T00:00:00Z" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Overlap Gown", category: "MATERNITY", rentable: true, buy_price_cents: 10000, rental_weekly_cents: 1800 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [2], rental_units_total: 1 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "RENTAL", expected_variant_version: "${var_v}", rental_weeks: 4, rental_start: "2026-07-01T00:00:00Z" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { order_a: "$.data.id" }
            - call: "GET /variants/${var_id}"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { var_v2: "$.data.version" }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "RENTAL", expected_variant_version: "${var_v2}", rental_weeks: 2, rental_start: "2026-07-30T00:00:00Z" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 409"
            - "response.data.error_id == ERR_NO_RENTAL_UNITS"

      - name: capsule_possession_overlap_halfopen
        grounds:
          - entities.Capsule.fields.possession_end
          - state_machines.Capsule.PACKED_to_SHIPPED
          - errors[ERR_CAPSULE_WINDOW_OVERLAP]
        distinguishing_aspect: "A second capsule shipping with ship_date 2026-08-15 has possession window [08-15, 09-14) overlapping the already-SHIPPED capsule's half-open [08-01, 08-31); single-occupancy half-open interval on Subscription with no buffer — distinct from the buffered aggregate-capacity rental overlap."
        test_recipe:
          setup:
            - "Customer with an ACTIVE subscription; capsule 1 shipped (ship_date 2026-08-01, possession_end 2026-08-31); capsule 2 packed with ship_date 2026-08-15."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "to2@x.com", full_name: "TO Two" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_tier: "CAPSULE_PLUS", monthly_fee_cents: 4000, next_ship_date: "2026-08-01T00:00:00Z" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Window Item", category: "CAPSULE", buy_price_cents: 5000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [2] }
              as: PlatformAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/capsules"
              payload: { item_variant_ids: ["${v1}"], ship_date: "2026-08-01T00:00:00Z" }
              as: FulfillmentAgent
              captures: { cap1_id: "$.data.id" }
            - call: "POST /capsules/${cap1_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /subscriptions/${sub_id}/capsules"
              payload: { item_variant_ids: ["${v1}"], ship_date: "2026-08-15T00:00:00Z" }
              as: FulfillmentAgent
              captures: { cap2_id: "$.data.id" }
          trigger:
            - call: "POST /capsules/${cap2_id}/ship"
              payload: {}
              as: FulfillmentAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 409"
            - "response.data.error_id == ERR_CAPSULE_WINDOW_OVERLAP"
            - "Capsule.${cap2_id}.status == PACKED"

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: rental_unit_count_conserved_reserve_then_cancel
        grounds:
          - state_machines.Order.UNFULFILLED_to_CANCELLED
          - state_machines.Rental.RESERVED_to_CANCELLED
          - entities.ProductVariant.fields.reserved_rental_units
          - entities.ProductVariant.fields.rental_units_total
        distinguishing_aspect: "Reserve (order create) then cancel restores ProductVariant.reserved_rental_units to 0 and leaves rental_units_total at 3, so total == reserved + available (3 == 0 + 3) — conserves the physical rental-unit count."
        test_recipe:
          setup:
            - "Rentable product; variant with 3 rental units; one RENTAL order reserved (reserved_rental_units==1) at clock 2026-07-01."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ci1@x.com", full_name: "CI One", due_date: "2026-10-01T00:00:00Z" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Conserve Gown", category: "MATERNITY", rentable: true, buy_price_cents: 11000, rental_weekly_cents: 1600 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [2], rental_units_total: 3 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "RENTAL", expected_variant_version: "${var_v}", rental_weeks: 2, rental_start: "2026-07-01T00:00:00Z" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "GET /variants/${var_id}"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { reserved_after_reserve: "$.data.reserved_rental_units" }
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
          assert:
            - "reserved_after_reserve == 1"
            - "ProductVariant.${var_id}.reserved_rental_units == 0"
            - "ProductVariant.${var_id}.rental_units_total == 3"

      - name: loyalty_points_conserved_redeem_then_cancel
        grounds:
          - state_machines.Order.UNPAID_to_PAID
          - state_machines.Order.UNFULFILLED_to_CANCELLED
          - entities.Customer.fields.loyalty_points
          - entities.LoyaltyLedger.fields.points_delta
        distinguishing_aspect: "Redeeming 600 points at pay then cancelling restores loyalty_points to 1000 and the ledger delta-sum (+1000 -600 +600 = 1000) equals the balance — conserves loyalty points, a different conserved quantity than rental units."
        test_recipe:
          setup:
            - "Customer granted 1000 points; a BUY order (10000-cent variant) paid while redeeming 600 points (loyalty_points -> 400)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ci2@x.com", full_name: "CI Two" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /customers/${cust_id}/loyalty-adjustments"
              payload: { points_delta: 1000 }
              as: PlatformAdmin
            - call: "POST /products"
              payload: { name: "Points Coat", category: "MATERNITY", buy_price_cents: 10000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [2], inventory_on_hand: 5 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "BUY", expected_variant_version: "${var_v}", quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cv: "$.data.version" }
            - call: "POST /orders/${order_id}/pay"
              payload: { expected_customer_version: "${cv}", redeemed_points: 600 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { lp_after_pay: "$.data.loyalty_points" }
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
          assert:
            - "lp_after_pay == 400"
            - "Customer.${cust_id}.loyalty_points == 1000"
