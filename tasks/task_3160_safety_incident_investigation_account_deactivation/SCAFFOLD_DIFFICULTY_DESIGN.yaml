  - rule_id: resource_temporal_overlap
    instances:

      - name: overlap_severed_link_rejoin_refused_on_banned_cluster
        grounds:
          - state_machines.AccountDeviceLink.transitions.DORMANT_to_SEVERED
          - state_machines.DeviceCluster.transitions.WATCHLIST_to_BANNED
          - validations[priority=15]
          - errors[ERR_CLUSTER_BANNED]
        distinguishing_aspect: |
          The cluster's bans are permanent rather than point-in-time, so a severed link is
          refused re-entry even though its own severance window has long lapsed — the
          refused occupation overlaps a ban interval that never closed.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z. R1 policy with cluster_watchlist_threshold 1, cluster_purge_threshold 1 and escalation_enabled true."
