            - "StoreDay.${day_a_id}.day_status == CLOSED and StoreDay.${day_a_id}.closed_at is non-null"
            - "the day's zero retail sales per guest is below the brand's 700-cent liquidation trigger, so the extension branch runs and is a no-op when the location has no ACTIVE clearance schedule"
