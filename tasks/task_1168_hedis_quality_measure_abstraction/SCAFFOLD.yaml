# =============================================================================
# Task 1168 — HEDIS & Quality Measure Abstraction (health plan quality dept)
# Scaffold seed tables (§1.0–§1.7). Difficulty: harder-than-expert.
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 in SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  1168. HEDIS & Quality Measure Abstraction (health plan quality department): measure specification load & eligible population identification, administrative vs hybrid sampling, medical record chart chase & retrieval, abstraction & over-read validation, supplemental data source acceptance & audit, rate calculation & submission deadline, gap list for provider outreach, audit review & measure certification

domain_name: hedis-quality-measures
api_prefix: /hedis

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation      # SAMPLE_ONLY vs ADMIN_SUPPLEMENTED rate; EXACT vs TOLERANT supplemental matching
    - derived_field_reconciliation  # numerator/denominator counters on MeasureRun; provider open_gap_count
    - optimistic_concurrency        # OCC on MeasurementSeason.version (spec load) and MeasureRun.version (compute-rate)
    - rate_threshold_triggers       # IRR ratio tiers 0.95 / 0.90 escalate required over-read fraction
  entity_topology: flat             # all resources top-level under /hedis; FK links in bodies; sub-resource GETs only for reverse reachability
  state_machine_shape: cyclic       # ChartChase re-chase loops; MeasureRun certification reopen cycle; Abstraction remediation loop; parallel dims on MeasureRun
  relationship_patterns:
    - one_to_many                   # Season→Spec/Run/Engagement; Run→Sample/Entry/Batch/GapItem; Sample→Chase; Chase→Abstraction; Abstraction→OverRead
    - cross_aggregate               # Finding gates certification via engagement→run join; GapItem/ChartChase carry denormalized member_ref/provider_ref
  role_model: segregation_of_duties # abstractor ≠ over-reader; run submitter ≠ certifier (X-User-ID comparison)
  consistency_model: immediate      # every mutation + cascade visible in the same request's response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (16 entities)
# =============================================================================
entities:
  - name: MeasurementSeason
    parent: null
    common_fields: true
    fields:
      - { name: measurement_year, type: integer, source: input, description: "HEDIS measurement year (e.g. 2025); service dates and enrollment windows are evaluated against it" }
      - { name: submission_deadline, type: datetime, source: input, description: "ISO8601 UTC; run submissions must occur at or before this instant" }
      - { name: admin_data_cutoff, type: datetime, source: input, description: "ISO8601 UTC; informational cutoff for administrative data refresh" }
      - { name: approved_supplemental_sources, type: array, source: input, description: "Enum strings drawn from LAB_FEED|IMMUNIZATION_REGISTRY|PHARMACY|EHR; the season-level audit registry of acceptable supplemental source types" }
      - { name: status, type: enum, source: system, description: "DRAFT -> OPEN -> SUBMISSION_CLOSED; auto-closes when logical clock passes submission_deadline while OPEN" }
      - { name: certified_run_count, type: integer, source: computed, default: 0, description: "Count of MeasureRuns of this season in reporting_status CERTIFIED; incremented by certify cascade" }

  - name: MeasureSpecification
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> MeasurementSeason.id; season this spec version is loaded into" }
      - { name: hedis_measure_code, type: string, source: input, description: "Measure code (e.g. BCS); unique per season — duplicate (season_id, hedis_measure_code) rejected" }
      - { name: version_label, type: string, source: input, description: "Spec version label, e.g. 2025.1" }
      - { name: collection_method, type: enum, source: input, description: "ADMINISTRATIVE | HYBRID; copied onto runs at creation (version pinning)" }
      - { name: hybrid_policy, type: enum, source: input, default: SAMPLE_ONLY, description: "SAMPLE_ONLY | ADMIN_SUPPLEMENTED; selects rate_determination variant; meaningful only for HYBRID" }
      - { name: matching_policy, type: enum, source: input, default: EXACT, description: "EXACT | TOLERANT; selects supplemental_record_matching variant" }
      - { name: sample_size_floor, type: integer, source: input, default: 411, description: "Minimum hybrid sample size (NCQA-style floor, typically 411; fixtures may set small values)" }
      - { name: age_min, type: integer, source: input, description: "Minimum age in whole years at anchor_date, inclusive" }
      - { name: age_max, type: integer, source: input, description: "Maximum age in whole years at anchor_date, inclusive" }
      - { name: gender_requirement, type: enum, source: input, default: ANY, description: "ANY | F | M; member.gender must match unless ANY" }
      - { name: continuous_enrollment_months, type: integer, source: input, description: "Length in months of the continuous-enrollment window ending at anchor_date" }
      - { name: allowable_gap_days, type: integer, source: input, default: 45, description: "At most one enrollment gap of up to this many days is tolerated inside the window" }
      - { name: anchor_date, type: datetime, source: input, description: "ISO8601 UTC date anchoring age and the end of the enrollment window (e.g. 2025-12-31T00:00:00Z)" }
      - { name: reporting_weight, type: number, source: input, default: 1.0, description: "Measure weight used by provider_gap_burden per-line products" }
      - { name: status, type: enum, source: system, description: "LOADED -> ACTIVE -> RETIRED (RETIRED also from LOADED)" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: member_ref, type: string, source: input, description: "Business identifier of the member; unique across members" }
      - { name: birth_date, type: datetime, source: input, description: "ISO8601 UTC date of birth; drives age-at-anchor evaluation" }
      - { name: gender, type: enum, source: input, description: "F | M" }
      - { name: attributed_provider_ref, type: string, source: input, required: false, description: "Reference to Provider.provider_ref (must exist when provided); denormalized attribution used for chart chase and gap outreach routing" }

  - name: MemberEnrollmentSegment
    parent: null
    common_fields: false
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the enrolled member" }
      - { name: span_start, type: datetime, source: input, description: "ISO8601 UTC inclusive start of the CLOSED enrollment interval" }
      - { name: span_end, type: datetime, source: input, description: "ISO8601 UTC inclusive end of the CLOSED enrollment interval; must be >= span_start" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: provider_ref, type: string, source: input, description: "Business identifier of the provider; unique across providers" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: specialty, type: string, source: input, required: false, description: "Optional specialty label" }
      - { name: open_gap_count, type: integer, source: computed, default: 0, description: "Count of GapItems with provider_ref == this provider_ref and status in {OPEN, OUTREACH_DONE}; reconciled on gap create/close/auto-close" }

  - name: MeasureRun
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> MeasurementSeason.id; the season this run belongs to" }
      - { name: spec_id, type: string, source: input, description: "FK -> MeasureSpecification.id; the spec version pinned at run creation" }
      - { name: spec_version_label, type: string, source: system, description: "Copied from spec at creation; later spec version changes do not affect this run" }
      - { name: collection_method, type: enum, source: system, description: "Copied from spec at creation: ADMINISTRATIVE | HYBRID" }
      - { name: reporting_status, type: enum, source: system, description: "POPULATION_PENDING -> POPULATED -> RATE_COMPUTED -> SUBMITTED -> CERTIFIED | CERTIFICATION_FAILED -> POPULATED (reopen cycle)" }
      - { name: audit_status, type: enum, source: system, description: "UNAUDITED -> IN_REVIEW -> AUDIT_PASSED | AUDIT_FAILED -> IN_REVIEW (re-review cycle); independent dimension from reporting_status" }
      - { name: denominator_count, type: integer, source: computed, description: "Eligible population entries with is_excluded == false" }
      - { name: exclusion_count, type: integer, source: computed, default: 0, description: "Population entries excluded pre-draw via the exclude action" }
      - { name: admin_numerator_count, type: integer, source: computed, default: 0, description: "Non-excluded entries with admin_compliant == true" }
      - { name: sample_exclusion_count, type: integer, source: computed, default: 0, description: "Chart chases in EXCLUDED_VALID (hybrid denominator reduction)" }
      - { name: sample_numerator_count, type: integer, source: computed, default: 0, description: "Per rate_determination variant over sampled entries; recomputed on abstraction submit/retract/finalize and supplemental acceptance" }
      - { name: admin_rate, type: number, source: computed, description: "admin_numerator_count / denominator_count, 4 decimal places round_half_up; null until compute-rate" }
      - { name: hybrid_rate, type: number, source: computed, description: "sample_numerator_count / (drawn_size - sample_exclusion_count), 4 decimal places round_half_up; null until compute-rate; HYBRID runs only" }
      - { name: final_rate, type: number, source: computed, description: "ADMINISTRATIVE -> admin_rate; HYBRID -> hybrid_rate; null until compute-rate" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID captured at submit; used by segregation-of-duties check at certify" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID captured at certify with decision CERTIFIED" }

  - name: PopulationEntry
    parent: null
    common_fields: true
    fields:
      - { name: run_id, type: string, source: system, description: "FK -> MeasureRun.id; owning run (rows are minted by identify-population)" }
      - { name: member_ref, type: string, source: system, description: "Denormalized Member.member_ref for this denominator row" }
      - { name: is_excluded, type: boolean, source: system, default: false, description: "Set true by the exclude action (pre-draw valid exclusion)" }
      - { name: exclusion_reason, type: string, source: system, description: "Reason captured at exclude" }
      - { name: is_sampled, type: boolean, source: system, default: false, description: "Set true when the systematic sample draw selects this entry" }
      - { name: admin_compliant, type: boolean, source: computed, default: false, description: "True once an ACCEPTED supplemental record matches this entry (member_ref + in-window service_date)" }
      - { name: sample_compliant, type: boolean, source: computed, default: false, description: "True once the sampled member's chase has an abstraction with result HIT in status SUBMITTED|CONFIRMED|OVERREAD_PASSED" }

  - name: Sample
    parent: null
    common_fields: true
    fields:
      - { name: run_id, type: string, source: input, description: "FK -> MeasureRun.id; at most one sample per run" }
      - { name: drawn_size, type: integer, source: computed, description: "min(spec.sample_size_floor, denominator_count) at draw time" }
      - { name: draw_step, type: number, source: computed, description: "denominator_count / drawn_size (real-valued step used by systematic_sample_draw)" }
      - { name: status, type: enum, source: system, description: "DRAWN -> FINALIZED -> LOCKED (LOCKED when run is submitted)" }
      - { name: irr_state, type: enum, source: system, description: "PENDING -> PASSED | FAILED; set by evaluate-irr; FAILED may re-evaluate to PASSED" }
      - { name: irr_ratio, type: number, source: computed, description: "AGREE over-reads / total over-reads over the LATEST over-read per abstraction, 4 decimal places round_half_up; null until first evaluate-irr with >= 1 over-read" }
      - { name: remediation_count, type: integer, source: computed, default: 0, description: "Number of abstractions of this sample that ever entered REMEDIATION; incremented by DISAGREE over-read cascade" }
      - { name: required_overread_fraction, type: number, source: computed, default: 0.10, description: "Fraction of SUBMITTED abstractions that must carry requires_overread=true; escalated per overread_fraction_tiering" }

  - name: ChartChase
    parent: null
    common_fields: true
    fields:
      - { name: sample_id, type: string, source: system, description: "FK -> Sample.id; owning sample (rows are minted by the sample draw, one per sampled member)" }
      - { name: member_ref, type: string, source: system, description: "Denormalized Member.member_ref being chased" }
      - { name: provider_ref, type: string, source: system, description: "Denormalized attributed Provider.provider_ref the chase is routed to; null when member unattributed" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> RECEIVED -> REJECTED_UNREADABLE -> REQUESTED (rechase); REQUESTED -> WITHDRAWN -> REQUESTED (rechase); RECEIVED -> ABSTRACTED (side effect); {REQUESTED|RECEIVED|REJECTED_UNREADABLE} -> EXCLUDED_VALID" }
      - { name: chase_round, type: integer, source: system, default: 1, description: "Increments by exactly 1 on every rechase transition" }

  - name: Abstraction
    parent: null
    common_fields: true
    fields:
      - { name: chase_id, type: string, source: input, description: "FK -> ChartChase.id; the retrieved chart being abstracted" }
      - { name: result, type: enum, source: input, description: "HIT | MISS | NOT_ABSTRACTABLE; editable via PUT while DRAFT" }
      - { name: abstractor_user_id, type: string, source: system, description: "X-User-ID of the creating Abstractor; drives segregation-of-duties check on over-reads" }
      - { name: requires_overread, type: boolean, source: computed, default: false, description: "Flagged by the deterministic over-read selector (submitted_at ASC, created_at ASC tie-break) up to ceil(required_overread_fraction * submitted_count)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> CONFIRMED | OVERREAD_PASSED | REMEDIATION -> DRAFT (retract cycle); SUBMITTED -> DRAFT (retract while no over-read exists)" }
      - { name: resubmission_count, type: integer, source: system, default: 0, description: "Increments by 1 on each submit that leaves REMEDIATION (re-submission after a failed over-read)" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent DRAFT->SUBMITTED or REMEDIATION->SUBMITTED transition; selector sort key" }

  - name: OverReadReview
    parent: null
    common_fields: false
    fields:
      - { name: abstraction_id, type: string, source: input, description: "FK -> Abstraction.id; at most one over-read per (abstraction, resubmission_count) round" }
      - { name: reviewer_user_id, type: string, source: system, description: "X-User-ID of the OverReader; must differ from abstraction.abstractor_user_id" }
      - { name: outcome, type: enum, source: input, description: "AGREE | DISAGREE" }
      - { name: final_result, type: enum, source: input, required: false, description: "HIT | MISS; REQUIRED iff outcome == DISAGREE (the over-reader's corrected determination)" }

  - name: SupplementalDataBatch
    parent: null
    common_fields: true
    fields:
      - { name: run_id, type: string, source: input, description: "FK -> MeasureRun.id; the run whose numerator this batch may feed" }
      - { name: source_type, type: enum, source: input, description: "LAB_FEED | IMMUNIZATION_REGISTRY | PHARMACY | EHR; must be in season.approved_supplemental_sources at accept time" }
      - { name: status, type: enum, source: system, description: "RECEIVED -> SCREENED -> ACCEPTED | REJECTED" }
      - { name: record_count, type: integer, source: computed, default: 0, description: "Number of SupplementalRecords in this batch" }
      - { name: accepted_record_count, type: integer, source: computed, default: 0, description: "Records with disposition ACCEPTED after screening; variant-dependent (EXACT vs TOLERANT)" }
      - { name: matching_policy_used, type: enum, source: system, description: "Matching variant copied from the run's pinned spec at screen time: EXACT | TOLERANT" }

  - name: SupplementalRecord
    parent: null
    common_fields: false
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> SupplementalDataBatch.id; records may only be added while batch is RECEIVED" }
      - { name: member_ref, type: string, source: input, description: "Member reference as supplied by the source; matched per matching variant" }
      - { name: service_date, type: datetime, source: input, description: "ISO8601 UTC date of service; must fall inside the measurement year (window check at screen)" }
      - { name: evidence_code, type: string, source: input, description: "Source evidence code (e.g. MAMMO, A1C)" }
      - { name: disposition, type: enum, source: system, description: "PENDING -> ACCEPTED | REJECTED_UNKNOWN_MEMBER | REJECTED_OUT_OF_WINDOW | REJECTED_DUPLICATE; set at screen" }

  - name: GapItem
    parent: null
    common_fields: true
    fields:
      - { name: run_id, type: string, source: system, description: "FK -> MeasureRun.id; owning run (rows are minted by compute-rate)" }
      - { name: member_ref, type: string, source: system, description: "Denormalized Member.member_ref with the open care gap" }
      - { name: provider_ref, type: string, source: system, description: "Denormalized attributed Provider.provider_ref for outreach routing; null when unattributed" }
      - { name: gap_reason, type: string, source: system, description: "NO_EVIDENCE_OF_SERVICE — member in denominator with no compliant evidence under the run's method" }
      - { name: status, type: enum, source: system, description: "OPEN -> OUTREACH_DONE -> CLOSED_COMPLIANT | CLOSED_NONCOMPLIANT; OPEN|OUTREACH_DONE -> CLOSED_COMPLIANT (auto, on supplemental evidence acceptance)" }
      - { name: closure_source, type: enum, source: system, description: "MANUAL | AUTO_EVIDENCE; null until closed" }

  - name: AuditEngagement
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> MeasurementSeason.id; season under audit" }
      - { name: measure_run_id, type: string, source: input, description: "FK -> MeasureRun.id; the run under audit review" }
      - { name: auditor_user_id, type: string, source: input, description: "Opaque auditor operator id; the temporal resource for engagement-window overlap detection" }
      - { name: window_start, type: datetime, source: input, description: "ISO8601 UTC inclusive start of the HALF-OPEN engagement window [window_start, window_end)" }
      - { name: window_end, type: datetime, source: input, description: "ISO8601 UTC exclusive end of the HALF-OPEN engagement window; must be > window_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> IN_REVIEW -> COMPLETED" }
      - { name: outcome, type: enum, source: system, description: "PASS | FAIL; set at complete; null until then" }

  - name: AuditFinding
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> AuditEngagement.id; findings attach to a run through the engagement's measure_run_id" }
      - { name: severity, type: enum, source: input, description: "CRITICAL | MAJOR | MINOR; OPEN CRITICAL findings block certification of the linked run" }
      - { name: summary, type: string, source: input, description: "Finding text" }
      - { name: status, type: enum, source: system, description: "OPEN -> RESOLVED" }

# =============================================================================
# §1.2 State Machine Table (10 machines)
# =============================================================================
state_machines:
  - entity: MeasurementSeason
    initial_state: DRAFT
    terminal_states: [SUBMISSION_CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /hedis/seasons/{seasonId}/open"
        actor: QualityAdmin
        preconditions:
          - "season.status == DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "increments MeasurementSeason.version by 1"
      - from: OPEN
        to: SUBMISSION_CLOSED
        trigger: "POST /hedis/seasons/{seasonId}/close-submission OR system auto-transition when POST /hedis/_clock/set_current_utc moves the logical clock past submission_deadline while OPEN"
        actor: QualityAdmin | system
        preconditions:
          - "manual: season.status == OPEN (else ERR_INVALID_STATE)"
          - "auto: season.status == OPEN AND clock now > submission_deadline"
        side_effects:
          - "increments MeasurementSeason.version by 1"

  - entity: MeasureSpecification
    initial_state: LOADED
    terminal_states: [RETIRED]
    transitions:
      - from: LOADED
        to: ACTIVE
        trigger: "POST /hedis/measure-specifications/{specId}/activate"
        actor: QualityAdmin
        preconditions:
          - "spec.status == LOADED (else ERR_INVALID_STATE)"
          - "spec's season status IN {DRAFT, OPEN} (cross-entity guard; else ERR_INVALID_STATE)"
        side_effects:
          - "increments MeasureSpecification.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /hedis/measure-specifications/{specId}/retire"
        actor: QualityAdmin
        preconditions:
          - "spec.status == ACTIVE (else ERR_INVALID_STATE)"
          - "no MeasureRun with spec_id == spec.id has reporting_status IN {POPULATION_PENDING, POPULATED, RATE_COMPUTED, SUBMITTED} (else ERR_INVALID_STATE)"
        side_effects:
          - "increments MeasureSpecification.version by 1"
      - from: LOADED
        to: RETIRED
        trigger: "POST /hedis/measure-specifications/{specId}/retire"
        actor: QualityAdmin
        preconditions:
          - "spec.status == LOADED (else ERR_INVALID_STATE)"
        side_effects:
          - "increments MeasureSpecification.version by 1"

  - entity: MeasureRun
    initial_state: POPULATION_PENDING
    terminal_states: [CERTIFIED]
    transitions:
      - from: POPULATION_PENDING
        to: POPULATED
        trigger: "POST /hedis/measure-runs/{runId}/identify-population"
        actor: QualityAnalyst
        preconditions:
          - "run.reporting_status == POPULATION_PENDING (else ERR_INVALID_STATE)"
          - "run's pinned spec status == ACTIVE (version-pinning revalidation; else ERR_INVALID_STATE)"
        side_effects:
          - "runs eligible_population_identification; mints one PopulationEntry per eligible member (is_excluded=false, is_sampled=false, admin_compliant=false, sample_compliant=false)"
          - "sets denominator_count = count(minted entries)"
          - "increments MeasureRun.version by 1"
      - from: POPULATED
        to: RATE_COMPUTED
        trigger: "POST /hedis/measure-runs/{runId}/compute-rate"
        actor: QualityAnalyst
        preconditions:
          - "run.reporting_status == POPULATED (else ERR_INVALID_STATE)"
          - "OCC: expected_measure_run_version == run.version (else ERR_STALE_VERSION)"
          - "HYBRID runs: the run's sample status == FINALIZED (cross-entity guard; else ERR_INVALID_STATE)"
          - "denominator_count > 0 (else ERR_DENOMINATOR_ZERO)"
        side_effects:
          - "runs rate_determination; sets admin_rate / hybrid_rate / final_rate (4dp round_half_up)"
          - "regenerates GapItems: deletes this run's GapItems in {OPEN, OUTREACH_DONE}, then mints one OPEN GapItem (gap_reason NO_EVIDENCE_OF_SERVICE) per non-excluded entry not compliant under the run's method"
          - "reconciles Provider.open_gap_count for affected provider_refs"
          - "increments MeasureRun.version by 1"
      - from: RATE_COMPUTED
        to: SUBMITTED
        trigger: "POST /hedis/measure-runs/{runId}/submit"
        actor: QualityAnalyst
        preconditions:
          - "run.reporting_status == RATE_COMPUTED (else ERR_RUN_NOT_SUBMITTABLE)"
          - "run's season status == OPEN (cross-entity guard; else ERR_SEASON_NOT_OPEN)"
          - "logical clock now <= season.submission_deadline (else ERR_SUBMISSION_DEADLINE_PASSED)"
        side_effects:
          - "submitted_by_user_id = X-User-ID"
          - "HYBRID runs: sample FINALIZED -> LOCKED"
          - "increments MeasureRun.version by 1"
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /hedis/measure-runs/{runId}/certify with decision == CERTIFIED"
        actor: QualityDirector
        preconditions:
          - "run.reporting_status == SUBMITTED (else ERR_INVALID_STATE)"
          - "segregation of duties: X-User-ID != run.submitted_by_user_id (else ERR_SOD_SUBMITTER_CERTIFY)"
          - "run.audit_status == AUDIT_PASSED (else ERR_RUN_NOT_CERTIFIABLE)"
          - "no AuditFinding with severity == CRITICAL and status == OPEN linked via engagement.measure_run_id == run.id (else ERR_RUN_NOT_CERTIFIABLE)"
        side_effects:
          - "certified_by_user_id = X-User-ID"
          - "CASCADE link 1: run CERTIFIED increments season.certified_run_count by 1 (the run mutation itself causes the season counter mutation)"
          - "CASCADE link 2: when season.certified_run_count becomes equal to the total number of MeasureRuns of the season, the season auto-transitions OPEN -> SUBMISSION_CLOSED (the counter mutation causes the season status mutation)"
          - "increments MeasureRun.version by 1"
      - from: SUBMITTED
        to: CERTIFICATION_FAILED
        trigger: "POST /hedis/measure-runs/{runId}/certify with decision == FAILED"
        actor: QualityDirector
        preconditions:
          - "run.reporting_status == SUBMITTED (else ERR_INVALID_STATE)"
          - "segregation of duties: X-User-ID != run.submitted_by_user_id (else ERR_SOD_SUBMITTER_CERTIFY)"
        side_effects:
          - "increments MeasureRun.version by 1"
      - from: CERTIFICATION_FAILED
        to: POPULATED
        trigger: "POST /hedis/measure-runs/{runId}/reopen"
        actor: QualityAnalyst
        preconditions:
          - "run.reporting_status == CERTIFICATION_FAILED (else ERR_INVALID_STATE)"
        side_effects:
          - "audit_status -> UNAUDITED (parallel dimension reset)"
          - "HYBRID runs: sample LOCKED -> FINALIZED"
          - "increments MeasureRun.version by 1"

  - entity: Sample
    initial_state: DRAWN
    terminal_states: [LOCKED]
    transitions:
      - from: DRAWN
        to: FINALIZED
        trigger: "POST /hedis/samples/{sampleId}/finalize"
        actor: QualityAnalyst
        preconditions:
          - "sample.status == DRAWN (else ERR_INVALID_STATE)"
          - "no chase of this sample in {REQUESTED, REJECTED_UNREADABLE} (else ERR_CHASES_IN_FLIGHT)"
          - "every chase in RECEIVED has an abstraction in {SUBMITTED, CONFIRMED, OVERREAD_PASSED} (else ERR_UNABSTRACTED_CHARTS)"
          - "no abstraction with requires_overread == true and status == SUBMITTED lacking an over-read (else ERR_OVERREADS_OUTSTANDING)"
          - "if any abstraction requires_overread == true: sample.irr_state == PASSED (else ERR_IRR_NOT_PASSED)"
        side_effects:
          - "abstractions in SUBMITTED with requires_overread == false auto-transition to CONFIRMED"
          - "recomputes run.sample_numerator_count per rate_determination"
          - "increments Sample.version by 1"
      - from: FINALIZED
        to: LOCKED
        trigger: "side effect of POST /hedis/measure-runs/{runId}/submit"
        actor: system
        preconditions:
          - "sample.status == FINALIZED"
        side_effects:
          - "increments Sample.version by 1"
      - from: LOCKED
        to: FINALIZED
        trigger: "side effect of POST /hedis/measure-runs/{runId}/reopen (certification reopen cycle)"
        actor: system
        preconditions:
          - "sample.status == LOCKED"
        side_effects:
          - "increments Sample.version by 1"

  - entity: ChartChase
    initial_state: REQUESTED
    terminal_states: [ABSTRACTED, EXCLUDED_VALID]
    transitions:
      - from: REQUESTED
        to: RECEIVED
        trigger: "POST /hedis/chart-chases/{chaseId}/receive"
        actor: QualityAnalyst
        preconditions:
          - "chase.status == REQUESTED (else ERR_INVALID_STATE)"
          - "chase's sample status == DRAWN (cross-entity guard; else ERR_INVALID_STATE)"
        side_effects:
          - "increments ChartChase.version by 1"
      - from: RECEIVED
        to: REJECTED_UNREADABLE
        trigger: "POST /hedis/chart-chases/{chaseId}/reject-unreadable"
        actor: QualityAnalyst
        preconditions:
          - "chase.status == RECEIVED (else ERR_INVALID_STATE)"
          - "chase's sample status == DRAWN (else ERR_INVALID_STATE)"
        side_effects:
          - "increments ChartChase.version by 1"
      - from: REJECTED_UNREADABLE
        to: REQUESTED
        trigger: "POST /hedis/chart-chases/{chaseId}/rechase"
        actor: QualityAnalyst
        preconditions:
          - "chase.status == REJECTED_UNREADABLE (else ERR_INVALID_STATE)"
          - "chase's sample status == DRAWN (else ERR_INVALID_STATE)"
        side_effects:
          - "chase_round += 1"
          - "increments ChartChase.version by 1"
      - from: REQUESTED
        to: WITHDRAWN
        trigger: "POST /hedis/chart-chases/{chaseId}/withdraw"
        actor: QualityAnalyst
        preconditions:
          - "chase.status == REQUESTED (else ERR_INVALID_STATE)"
          - "chase's sample status == DRAWN (else ERR_INVALID_STATE)"
        side_effects:
          - "increments ChartChase.version by 1"
      - from: WITHDRAWN
        to: REQUESTED
        trigger: "POST /hedis/chart-chases/{chaseId}/rechase"
        actor: QualityAnalyst
        preconditions:
          - "chase.status == WITHDRAWN (else ERR_INVALID_STATE)"
          - "chase's sample status == DRAWN (else ERR_INVALID_STATE)"
        side_effects:
          - "chase_round += 1"
          - "increments ChartChase.version by 1"
      - from: RECEIVED
        to: ABSTRACTED
        trigger: "side effect of POST /hedis/abstractions/{abstractionId}/submit (first submit of the chase's abstraction)"
        actor: system
        preconditions:
          - "chase.status == RECEIVED"
        side_effects:
          - "increments ChartChase.version by 1"
      - from: ABSTRACTED
        to: RECEIVED
        trigger: "side effect of POST /hedis/abstractions/{abstractionId}/retract (compensation: abstraction leaves SUBMITTED)"
        actor: system
        preconditions:
          - "chase.status == ABSTRACTED"
        side_effects:
          - "increments ChartChase.version by 1"
      - from: REQUESTED
        to: EXCLUDED_VALID
        trigger: "POST /hedis/chart-chases/{chaseId}/mark-excluded"
        actor: QualityAnalyst
        preconditions:
          - "chase.status IN {REQUESTED, RECEIVED, REJECTED_UNREADABLE} (else ERR_INVALID_STATE)"
          - "chase's sample status == DRAWN (else ERR_INVALID_STATE)"
          - "no abstraction exists for this chase (else ERR_INVALID_STATE)"
        side_effects:
          - "run.sample_exclusion_count += 1"
          - "increments ChartChase.version by 1"
      - from: RECEIVED
        to: EXCLUDED_VALID
        trigger: "POST /hedis/chart-chases/{chaseId}/mark-excluded"
        actor: QualityAnalyst
        preconditions:
          - "chase.status IN {REQUESTED, RECEIVED, REJECTED_UNREADABLE} (else ERR_INVALID_STATE)"
          - "chase's sample status == DRAWN (else ERR_INVALID_STATE)"
          - "no abstraction exists for this chase (else ERR_INVALID_STATE)"
        side_effects:
          - "run.sample_exclusion_count += 1"
          - "increments ChartChase.version by 1"
      - from: REJECTED_UNREADABLE
        to: EXCLUDED_VALID
        trigger: "POST /hedis/chart-chases/{chaseId}/mark-excluded"
        actor: QualityAnalyst
        preconditions:
          - "chase.status IN {REQUESTED, RECEIVED, REJECTED_UNREADABLE} (else ERR_INVALID_STATE)"
          - "chase's sample status == DRAWN (else ERR_INVALID_STATE)"
          - "no abstraction exists for this chase (else ERR_INVALID_STATE)"
        side_effects:
          - "run.sample_exclusion_count += 1"
          - "increments ChartChase.version by 1"

  - entity: Abstraction
    initial_state: DRAFT
    terminal_states: [CONFIRMED, OVERREAD_PASSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /hedis/abstractions/{abstractionId}/submit"
        actor: Abstractor
        preconditions:
          - "abstraction.status == DRAFT (else ERR_INVALID_STATE)"
          - "segregation of duties is satisfied trivially here; ownership: X-User-ID == abstraction.abstractor_user_id (else ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects:
          - "submitted_at = logical clock now"
          - "chase RECEIVED -> ABSTRACTED (first submit only)"
          - "over-read selector top-up: among this sample's SUBMITTED abstractions ordered by submitted_at ASC then created_at ASC, flag requires_overread=true until count(flagged) >= ceil(required_overread_fraction * submitted_count)"
          - "recomputes run.sample_numerator_count per rate_determination"
          - "increments Abstraction.version by 1"
      - from: REMEDIATION
        to: SUBMITTED
        trigger: "POST /hedis/abstractions/{abstractionId}/submit"
        actor: Abstractor
        preconditions:
          - "abstraction.status == REMEDIATION (else ERR_INVALID_STATE)"
          - "X-User-ID == abstraction.abstractor_user_id (else ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects:
          - "resubmission_count += 1"
          - "submitted_at = logical clock now"
          - "over-read selector top-up (same rule as DRAFT->SUBMITTED)"
          - "recomputes run.sample_numerator_count per rate_determination"
          - "increments Abstraction.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /hedis/abstractions/{abstractionId}/retract"
        actor: Abstractor
        preconditions:
          - "abstraction.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "X-User-ID == abstraction.abstractor_user_id (else ERR_INSUFFICIENT_PERMISSIONS)"
          - "no OverReadReview exists for the current submission round (else ERR_INVALID_STATE)"
        side_effects:
          - "compensation: chase ABSTRACTED -> RECEIVED"
          - "recomputes run.sample_numerator_count per rate_determination (retract removes the abstraction from the counted set)"
          - "increments Abstraction.version by 1"
      - from: REMEDIATION
        to: DRAFT
        trigger: "POST /hedis/abstractions/{abstractionId}/retract"
        actor: Abstractor
        preconditions:
          - "abstraction.status == REMEDIATION (else ERR_INVALID_STATE)"
          - "X-User-ID == abstraction.abstractor_user_id (else ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects:
          - "resubmission_count += 1 (leaving REMEDIATION advances the submission round, unlocking a fresh over-read)"
          - "chase stays ABSTRACTED (chart remains in hand during remediation)"
          - "increments Abstraction.version by 1"
      - from: SUBMITTED
        to: OVERREAD_PASSED
        trigger: "side effect of POST /hedis/over-reads with outcome == AGREE"
        actor: system
        preconditions:
          - "abstraction.status == SUBMITTED"
        side_effects:
          - "recomputes run.sample_numerator_count per rate_determination"
          - "selector top-up re-runs (an abstraction left SUBMITTED): flag earliest unflagged SUBMITTED abstractions until count(flagged among SUBMITTED) >= ceil(required_overread_fraction * submitted_count)"
          - "increments Abstraction.version by 1"
      - from: SUBMITTED
        to: REMEDIATION
        trigger: "side effect of POST /hedis/over-reads with outcome == DISAGREE"
        actor: system
        preconditions:
          - "abstraction.status == SUBMITTED"
        side_effects:
          - "CASCADE link 1 (B->C): sample.remediation_count += 1 (caused by this abstraction entering REMEDIATION)"
          - "CASCADE link 2 (C->D): if remediation_count reaches 2, sample.required_overread_fraction is set to 1.0 immediately (hard override, not deferred to evaluate-irr)"
          - "CASCADE link 3 (D->E): the selector top-up re-runs immediately with the new fraction, flagging still-SUBMITTED abstractions in submitted_at ASC, created_at ASC order"
          - "selector top-up also re-runs whenever any abstraction leaves SUBMITTED (this transition removes one)"
          - "recomputes run.sample_numerator_count per rate_determination"
          - "increments Abstraction.version by 1"
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "side effect of POST /hedis/samples/{sampleId}/finalize (bulk auto-confirm of non-over-read abstractions)"
        actor: system
        preconditions:
          - "abstraction.status == SUBMITTED AND requires_overread == false"
        side_effects:
          - "increments Abstraction.version by 1"

  - entity: SupplementalDataBatch
    initial_state: RECEIVED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: RECEIVED
        to: SCREENED
        trigger: "POST /hedis/supplemental-batches/{batchId}/screen"
        actor: QualityAnalyst
        preconditions:
          - "batch.status == RECEIVED (else ERR_INVALID_STATE)"
        side_effects:
          - "runs supplemental_record_matching under the run's pinned spec matching_policy; sets each record's disposition and batch.accepted_record_count / matching_policy_used"
          - "increments SupplementalDataBatch.version by 1"
      - from: SCREENED
        to: ACCEPTED
        trigger: "POST /hedis/supplemental-batches/{batchId}/accept"
        actor: QualityAnalyst
        preconditions:
          - "batch.status == SCREENED (else ERR_INVALID_STATE)"
          - "batch.source_type IN season.approved_supplemental_sources (business_safety; else ERR_UNAPPROVED_SUPPLEMENTAL_SOURCE)"
          - "every record of the batch references a member_ref present in the run's non-excluded PopulationEntries (business_referential; else ERR_RECORD_MEMBER_NOT_IN_DENOMINATOR) — checked AFTER the source-approval check"
          - "run.reporting_status NOT IN {SUBMITTED, CERTIFIED, CERTIFICATION_FAILED} (else ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE link 1: each ACCEPTED record flips its matching PopulationEntry.admin_compliant = true"
          - "CASCADE link 2: each entry flipped compliant auto-closes its OPEN|OUTREACH_DONE GapItem -> CLOSED_COMPLIANT with closure_source AUTO_EVIDENCE (caused by the entry mutation)"
          - "CASCADE link 3: Provider.open_gap_count is reconciled downward for each auto-closed gap (caused by the gap mutation)"
          - "recomputes run.admin_numerator_count and run.sample_numerator_count per rate_determination"
          - "increments SupplementalDataBatch.version by 1"
      - from: SCREENED
        to: REJECTED
        trigger: "POST /hedis/supplemental-batches/{batchId}/reject"
        actor: QualityAnalyst
        preconditions:
          - "batch.status == SCREENED (else ERR_INVALID_STATE)"
        side_effects:
          - "increments SupplementalDataBatch.version by 1"

  - entity: GapItem
    initial_state: OPEN
    terminal_states: [CLOSED_COMPLIANT, CLOSED_NONCOMPLIANT]
    transitions:
      - from: OPEN
        to: OUTREACH_DONE
        trigger: "POST /hedis/gap-items/{gapId}/mark-outreach-done"
        actor: ProviderRelations
        preconditions:
          - "gap.status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "increments GapItem.version by 1"
      - from: OUTREACH_DONE
        to: CLOSED_COMPLIANT
        trigger: "POST /hedis/gap-items/{gapId}/close with outcome == CLOSED_COMPLIANT"
        actor: ProviderRelations
        preconditions:
          - "gap.status == OUTREACH_DONE (else ERR_INVALID_STATE)"
        side_effects:
          - "closure_source = MANUAL"
          - "Provider.open_gap_count -= 1 for gap.provider_ref"
          - "increments GapItem.version by 1"
      - from: OUTREACH_DONE
        to: CLOSED_NONCOMPLIANT
        trigger: "POST /hedis/gap-items/{gapId}/close with outcome == CLOSED_NONCOMPLIANT"
        actor: ProviderRelations
        preconditions:
          - "gap.status == OUTREACH_DONE (else ERR_INVALID_STATE)"
        side_effects:
          - "closure_source = MANUAL"
          - "Provider.open_gap_count -= 1 for gap.provider_ref"
          - "increments GapItem.version by 1"
      - from: OPEN
        to: CLOSED_COMPLIANT
        trigger: "side effect of supplemental batch acceptance flipping the member's PopulationEntry.admin_compliant"
        actor: system
        preconditions:
          - "gap.status IN {OPEN, OUTREACH_DONE}"
        side_effects:
          - "closure_source = AUTO_EVIDENCE"
          - "Provider.open_gap_count -= 1 for gap.provider_ref"
          - "increments GapItem.version by 1"
      - from: OUTREACH_DONE
        to: CLOSED_COMPLIANT
        trigger: "side effect of supplemental batch acceptance flipping the member's PopulationEntry.admin_compliant"
        actor: system
        preconditions:
          - "gap.status IN {OPEN, OUTREACH_DONE}"
        side_effects:
          - "closure_source = AUTO_EVIDENCE"
          - "Provider.open_gap_count -= 1 for gap.provider_ref"
          - "increments GapItem.version by 1"

  - entity: AuditEngagement
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: IN_REVIEW
        trigger: "POST /hedis/audit-engagements/{engagementId}/begin-review"
        actor: Auditor
        preconditions:
          - "engagement.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "logical clock now IN [window_start, window_end) (business_temporal; else ERR_OUTSIDE_ENGAGEMENT_WINDOW)"
          - "engagement's run reporting_status == SUBMITTED (cross-entity guard; else ERR_INVALID_STATE)"
          - "engagement's run audit_status IN {UNAUDITED, AUDIT_FAILED} (else ERR_INVALID_STATE)"
        side_effects:
          - "run.audit_status -> IN_REVIEW"
          - "increments AuditEngagement.version by 1"
      - from: IN_REVIEW
        to: COMPLETED
        trigger: "POST /hedis/audit-engagements/{engagementId}/complete with outcome PASS | FAIL"
        actor: Auditor
        preconditions:
          - "engagement.status == IN_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "outcome PASS: run.audit_status -> AUDIT_PASSED"
          - "outcome FAIL: run.audit_status -> AUDIT_FAILED AND auto-mints an AuditFinding(severity=CRITICAL, status=OPEN, summary='AUDIT_OUTCOME_FAIL') linked to this engagement"
          - "increments AuditEngagement.version by 1"

  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /hedis/audit-findings/{findingId}/resolve"
        actor: Auditor
        preconditions:
          - "finding.status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "increments AuditFinding.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; both pass the serial-observability filter)
# =============================================================================
concurrency_rules:
  - rule_id: spec-load-stale-season
    parent_entity: MeasurementSeason
    write_endpoint: "POST /hedis/measure-specifications"
    occ_field: expected_season_version
    description: |
      Loading a MeasureSpecification into a MeasurementSeason whose version has
      advanced since the client last observed it is rejected. Spec loads are
      serialized per season so that same-code supersession stays linear: a
      client holding a stale season view (e.g. it has not seen another load
      that bumped the season version) must re-read before writing.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: compute-rate-stale-run
    parent_entity: MeasureRun
    write_endpoint: "POST /hedis/measure-runs/{runId}/compute-rate"
    occ_field: expected_measure_run_version
    description: |
      Recomputing a rate against a MeasureRun whose version has advanced since
      the client last observed it is rejected. A rate computed from a stale
      view would silently miss population or evidence mutations the client has
      not seen; the client must re-read the run before recomputing.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (7 rules)
# =============================================================================
calculations:
  - name: eligible_population_identification
    trigger: "POST /hedis/measure-runs/{runId}/identify-population"
    algorithm: interval_merge
    formula: |
      window_end = spec.anchor_date (date part)
      window_start = window_end - spec.continuous_enrollment_months months + 1 day
      For each Member m (chronological order by member_ref ASC — never id):
        skip if spec.gender_requirement != ANY and m.gender != spec.gender_requirement
        age = whole years between m.birth_date and spec.anchor_date
        skip if age < spec.age_min or age > spec.age_max   (both bounds INCLUSIVE)
        segs = m's MemberEnrollmentSegments sorted by span_start ASC, tie-break span_end ASC
        merge segs as CLOSED intervals; clip merged union to [window_start, window_end]
        gaps = uncovered day-ranges strictly inside the clipped window
        eligible iff (number of gaps <= 1) AND (each gap length in days <= spec.allowable_gap_days)
      Mint one PopulationEntry per eligible member.
    input_set: "all Members and their MemberEnrollmentSegments; no state filter on members (members have no status)"
    constants:
      MAX_GAPS_ALLOWED: 1
    precision: "whole days; gap length = (gap_end - gap_start).days + 1"

  - name: systematic_sample_draw
    trigger: "POST /hedis/samples"
    algorithm: threshold
    formula: |
      pool = run's PopulationEntries with is_excluded == false, sorted by member_ref ASC (member_ref is unique — no tie-break needed; never use id)
      if pool.size < spec.sample_size_floor: reject ERR_SAMPLE_BELOW_FLOOR
      drawn_size = min(spec.sample_size_floor, pool.size)
      step = pool.size / drawn_size   (real division)
      selected indices = floor(i * step) for i in 0 .. drawn_size-1   (zero-based into the sorted pool)
      Mark selected entries is_sampled = true; mint one ChartChase per selected entry
      (status REQUESTED, chase_round 1, member_ref from entry, provider_ref from the member's attributed_provider_ref).
    input_set: "PopulationEntries of the run with is_excluded == false"
    constants: {}
    precision: "index arithmetic uses exact floor on real division"

  - name: rate_determination
    trigger: "POST /hedis/measure-runs/{runId}/compute-rate; also recomputed incrementally on abstraction submit/retract, over-read outcomes, sample finalize, and supplemental acceptance"
    algorithm: aggregation
    formula: |
      COUNTED_ABSTRACTION_STATES = {SUBMITTED, CONFIRMED, OVERREAD_PASSED}
      admin_numerator_count = count(entries: is_excluded == false AND admin_compliant == true)
      admin_rate = round_half_up(admin_numerator_count / denominator_count, 4)
      For HYBRID runs, per sampled entry e:
        sample_hit(e) = exists abstraction a on chase c where c.sample_id == run.sample.id
                        AND c.member_ref == e.member_ref AND a.result == HIT
                        AND a.status IN COUNTED_ABSTRACTION_STATES
        compliant(e)  = sample_hit(e)                                          [variant SAMPLE_ONLY]
        compliant(e)  = sample_hit(e) OR e.admin_compliant                     [variant ADMIN_SUPPLEMENTED]
      sample_numerator_count = count(sampled entries with compliant(e))
      hybrid_denominator = sample.drawn_size - run.sample_exclusion_count
      hybrid_rate = round_half_up(sample_numerator_count / hybrid_denominator, 4)
      final_rate = admin_rate if collection_method == ADMINISTRATIVE else hybrid_rate
    input_set: "non-excluded PopulationEntries for admin; sampled entries plus their chase/abstraction join for hybrid; abstraction states restricted to COUNTED_ABSTRACTION_STATES"
    constants:
      RATE_DECIMALS: 4
    precision: "4 decimal places, round_half_up"
    variants:
      - name: sample_only
        when: "pinned spec hybrid_policy == SAMPLE_ONLY"
        difference: "numerator counts only chart-abstraction HITs; administrative evidence is ignored"
      - name: admin_supplemented
        when: "pinned spec hybrid_policy == ADMIN_SUPPLEMENTED"
        difference: "numerator counts sample_hit OR admin_compliant; identical evidence yields a >= numerator than sample_only whenever any sampled member is admin_compliant without an abstraction HIT"

  - name: supplemental_record_matching
    trigger: "POST /hedis/supplemental-batches/{batchId}/screen"
    algorithm: aggregation
    formula: |
      For each SupplementalRecord r of the batch (processed in created_at ASC order):
        1. match: variant EXACT  -> r.member_ref string-equal to some Member.member_ref
                  variant TOLERANT -> normalize(r.member_ref) string-equal to normalize(Member.member_ref)
                   where normalize(s) = uppercase(trim(s)); if the result is all digits, strip leading zeros (empty -> "0")
           no match -> disposition REJECTED_UNKNOWN_MEMBER
        2. window: r.service_date date part must be within [YYYY-01-01, YYYY-12-31] of season.measurement_year
           else disposition REJECTED_OUT_OF_WINDOW
        3. duplicate: another record in THIS batch earlier in processing order, or already ACCEPTED in another
           ACCEPTED batch of the same run, with equal normalized (member_ref, service_date date, evidence_code)
           -> disposition REJECTED_DUPLICATE
        otherwise disposition ACCEPTED
      accepted_record_count = count(records with disposition ACCEPTED); record_count = total records
    input_set: "all SupplementalRecords of the batch in created_at ASC order; cross-batch duplicate scope is same run, ACCEPTED batches only"
    constants: {}
    precision: "date comparisons at whole-day granularity"
    variants:
      - name: exact_match
        when: "pinned spec matching_policy == EXACT"
        difference: "raw member_ref equality; source formatting differences (case, whitespace, zero padding) reject"
      - name: tolerant_match
        when: "pinned spec matching_policy == TOLERANT"
        difference: "normalized equality; identical record payloads yield a strictly larger accepted_record_count whenever refs carry formatting noise"

  - name: overread_fraction_tiering
    trigger: "POST /hedis/samples/{sampleId}/evaluate-irr"
    algorithm: threshold
    formula: |
      latest over-reads = for each abstraction of the sample, its OverReadReview of the LATEST submission round
      agreements = count(latest over-reads with outcome == AGREE)
      irr_ratio = if no latest over-reads exist then null else round_half_up(agreements / count(latest over-reads), 4)
      tier selection (evaluated top-down):
        if sample.remediation_count >= 2          -> fraction = 1.0     (hard override)
        elif irr_ratio == null                    -> fraction unchanged (no evaluation possible)
        elif irr_ratio >= 0.95                    -> fraction = 0.10
        elif irr_ratio >= 0.90                    -> fraction = 0.25
        else                                      -> fraction = 1.0
      irr_state = PASSED iff irr_ratio != null AND irr_ratio >= 0.95 else FAILED (null -> stays PENDING)
      Then selector top-up: order the sample's SUBMITTED abstractions by submitted_at ASC, tie-break created_at ASC;
      flag requires_overread=true in that order until count(flagged among SUBMITTED) >= ceil(fraction * submitted_count).
    input_set: "latest-round OverReadReviews of abstractions belonging to this sample's chases; SUBMITTED abstractions for the top-up"
    constants:
      IRR_PASS_THRESHOLD: 0.95
      IRR_MID_TIER: 0.90
      BASE_FRACTION: 0.10
      MID_FRACTION: 0.25
      FULL_FRACTION: 1.0
      REMEDIATION_OVERRIDE_COUNT: 2
    precision: "irr_ratio 4 decimal places round_half_up; tier boundaries are >= (0.95 passes; 0.90 maps to 0.25; below 0.90 maps to 1.0)"

  - name: irr_agreement_ratio
    trigger: "embedded in evaluate-irr; reported on the Sample"
    algorithm: aggregation
    formula: |
      irr_ratio = agreements / total latest-round over-reads; boundary: ratio >= 0.95 -> PASSED
    input_set: "latest OverReadReview per abstraction of the sample (all statuses of abstraction count; the LATEST review per abstraction only)"
    constants:
      IRR_PASS_THRESHOLD: 0.95
    precision: "4 decimal places, round_half_up; boundary >= is inclusive"

  - name: provider_gap_burden
    trigger: "GET /hedis/providers/{providerId}/gap-burden"
    algorithm: weighted_scoring
    formula: |
      lines = for each MeasureRun r of the given season whose spec is not RETIRED:
                open_gaps(r) = count(GapItems of r with provider_ref == provider.provider_ref
                                       AND status IN {OPEN, OUTREACH_DONE})
                line(r) = round_half_up(open_gaps(r) * r.spec.reporting_weight, 2)   # ROUND PER LINE FIRST
      burden_score = sum(line(r) for all r)                                          # THEN SUM — order pinned
      open_gap_count = sum(open_gaps(r))
      per_measure_lines = count(r where open_gaps(r) > 0)
    input_set: "MeasureRuns of the season (any reporting_status); GapItems restricted to status {OPEN, OUTREACH_DONE}"
    constants:
      LINE_DECIMALS: 2
    precision: "2 decimal places per line, round_half_up, THEN sum (per-line-then-sum pinned; sum-then-round is the rejected alternative)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Request body shape: required fields present; enum values in their declared sets; span_start <= span_end on enrollment segments"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 3
    category: auth
    check: "X-User-Role must be listed in the endpoint's roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path-template ids and body-supplied FK ids (season_id, spec_id, run_id, member_id, sample_id, chase_id, abstraction_id, batch_id, engagement_id) must resolve, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4.1
    category: existence
    check: "Member.attributed_provider_ref must resolve to an existing Provider.provider_ref when provided"
    error_id: ERR_PROVIDER_NOT_FOUND
    http_status: 404
    applies_to: "POST /hedis/members"
  - priority: 5
    category: state
    check: "OCC: expected_season_version / expected_measure_run_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /hedis/measure-specifications; POST /hedis/measure-runs/{runId}/compute-rate"
  - priority: 6
    category: state
    check: "Target resource's own state machine must allow the transition (covers chase/abstraction/batch/sample/engagement/finding/gap from-state checks, duplicate-active uniqueness is NOT here — see 8.3)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6.1
    category: state
    check: "submit requires run.reporting_status == RATE_COMPUTED"
    error_id: ERR_RUN_NOT_SUBMITTABLE
    http_status: 409
    applies_to: "POST /hedis/measure-runs/{runId}/submit"
  - priority: 7
    category: state
    check: "Cross-entity state guards: submit requires season OPEN (ERR_SEASON_NOT_OPEN); identify-population requires pinned spec ACTIVE; chase mutations require sample DRAWN; abstraction create requires chase RECEIVED; hybrid compute-rate requires sample FINALIZED; record create requires batch RECEIVED; begin-review requires run SUBMITTED and audit_status in {UNAUDITED, AUDIT_FAILED}"
    error_id: ERR_SEASON_NOT_OPEN
    http_status: 409
    applies_to: "POST /hedis/measure-runs/{runId}/submit"
    note: "All other cross-entity guards in this priority band return ERR_INVALID_STATE; ERR_SEASON_NOT_OPEN is the named exception used by the priority-conflict design"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: over-reader X-User-ID must differ from abstraction.abstractor_user_id"
    error_id: ERR_SOD_SELF_OVERREAD
    http_status: 403
    applies_to: "POST /hedis/over-reads"
  - priority: 8.1
    category: business_safety
    check: "Segregation of duties: certifier X-User-ID must differ from run.submitted_by_user_id"
    error_id: ERR_SOD_SUBMITTER_CERTIFY
    http_status: 403
    applies_to: "POST /hedis/measure-runs/{runId}/certify"
  - priority: 8.2
    category: business_safety
    check: "Supplemental batch source_type must be in the season's approved_supplemental_sources audit registry"
    error_id: ERR_UNAPPROVED_SUPPLEMENTAL_SOURCE
    http_status: 422
    applies_to: "POST /hedis/supplemental-batches/{batchId}/accept"
  - priority: 9
    category: business_temporal
    check: "submit: logical clock now must be <= season.submission_deadline"
    error_id: ERR_SUBMISSION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /hedis/measure-runs/{runId}/submit"
  - priority: 9.1
    category: business_temporal
    check: "begin-review: logical clock now must be inside [window_start, window_end)"
    error_id: ERR_OUTSIDE_ENGAGEMENT_WINDOW
    http_status: 422
    applies_to: "POST /hedis/audit-engagements/{engagementId}/begin-review"
  - priority: 9.2
    category: business_temporal
    check: "engagement create: window_end must be strictly greater than window_start"
    error_id: ERR_ENGAGEMENT_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /hedis/audit-engagements"
  - priority: 10
    category: business_constraint
    check: "Uniqueness: (season_id, hedis_measure_code) on spec; member_ref on Member; provider_ref on Provider; at most one Sample per run; at most one non-terminal Abstraction per chase; at most one OverReadReview per (abstraction, resubmission_count) round — a second review in the same round is impossible because the first review always moves the abstraction out of SUBMITTED, so the priority-6 state guard rejects it with ERR_INVALID_STATE"
    error_id: ERR_DUPLICATE_MEASURE_CODE
    http_status: 409
    applies_to: "POST /hedis/measure-specifications"
    note: "Family: ERR_DUPLICATE_MEASURE_CODE (spec) | ERR_DUPLICATE_MEMBER_REF (member) | ERR_DUPLICATE_PROVIDER_REF (provider) | ERR_SAMPLE_ALREADY_EXISTS (sample) | ERR_DUPLICATE_ABSTRACTION (abstraction)"
  - priority: 10.1
    category: business_constraint
    check: "Enrollment segments of the same member are CLOSED intervals: reject when new.span_start <= existing.span_end AND new.span_end >= existing.span_start (touching endpoints DO overlap)"
    error_id: ERR_ENROLLMENT_OVERLAP
    http_status: 409
    applies_to: "POST /hedis/enrollment-segments"
  - priority: 10.2
    category: business_constraint
    check: "Engagement windows of the same auditor_user_id are HALF-OPEN [start, end): reject when new.start < existing.end AND new.end > existing.start (adjacent end == start does NOT overlap)"
    error_id: ERR_AUDITOR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /hedis/audit-engagements"
  - priority: 10.3
    category: business_constraint
    check: "Method gates: POST /hedis/samples requires run.collection_method == HYBRID; population-entry exclude requires method ADMINISTRATIVE or HYBRID-before-draw"
    error_id: ERR_METHOD_NOT_HYBRID
    http_status: 422
    applies_to: "POST /hedis/samples"
    note: "exclude on a HYBRID run after its sample exists returns ERR_EXCLUSION_NOT_ALLOWED"
  - priority: 10.4
    category: business_constraint
    check: "population-entry exclude forbidden once the run's sample exists (HYBRID)"
    error_id: ERR_EXCLUSION_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /hedis/population-entries/{entryId}/exclude"
  - priority: 11
    category: business_referential
    check: "accept: every record of the batch must reference a member_ref present in the run's non-excluded PopulationEntries (checked AFTER the priority-8.2 source-approval check)"
    error_id: ERR_RECORD_MEMBER_NOT_IN_DENOMINATOR
    http_status: 422
    applies_to: "POST /hedis/supplemental-batches/{batchId}/accept"
  - priority: 12
    category: business_fiscal
    check: "Sample draw requires eligible pool (non-excluded entries) >= spec.sample_size_floor"
    error_id: ERR_SAMPLE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /hedis/samples"
  - priority: 12.1
    category: business_fiscal
    check: "compute-rate requires denominator_count > 0"
    error_id: ERR_DENOMINATOR_ZERO
    http_status: 422
    applies_to: "POST /hedis/measure-runs/{runId}/compute-rate"
  - priority: 12.2
    category: business_fiscal
    check: "finalize requires no chases in {REQUESTED, REJECTED_UNREADABLE}"
    error_id: ERR_CHASES_IN_FLIGHT
    http_status: 422
    applies_to: "POST /hedis/samples/{sampleId}/finalize"
  - priority: 12.3
    category: business_fiscal
    check: "finalize requires every RECEIVED chase to have a submitted abstraction"
    error_id: ERR_UNABSTRACTED_CHARTS
    http_status: 422
    applies_to: "POST /hedis/samples/{sampleId}/finalize"
  - priority: 12.4
    category: business_fiscal
    check: "finalize requires no SUBMITTED requires_overread abstraction lacking an over-read"
    error_id: ERR_OVERREADS_OUTSTANDING
    http_status: 422
    applies_to: "POST /hedis/samples/{sampleId}/finalize"
  - priority: 12.5
    category: business_fiscal
    check: "finalize requires irr_state == PASSED whenever any abstraction requires_overread == true"
    error_id: ERR_IRR_NOT_PASSED
    http_status: 422
    applies_to: "POST /hedis/samples/{sampleId}/finalize"
  - priority: 12.6
    category: business_fiscal
    check: "certify (decision CERTIFIED) requires audit_status == AUDIT_PASSED and no OPEN CRITICAL findings linked via engagement"
    error_id: ERR_RUN_NOT_CERTIFIABLE
    http_status: 422
    applies_to: "POST /hedis/measure-runs/{runId}/certify"
  - priority: 12.7
    category: business_constraint
    check: "Duplicate (normalized member_ref, service_date date, evidence_code) within a batch or against ACCEPTED batches of the same run marks the record REJECTED_DUPLICATE at screen (per-record, not a request failure)"
    error_id: ERR_DUPLICATE_SERVICE_DATE
    http_status: 409
    applies_to: "POST /hedis/supplemental-records"
    note: "Request-level rejection applies when an identical (member_ref, service_date, evidence_code) record already exists in the SAME batch; cross-batch duplicates surface as record dispositions"

# =============================================================================
# §1.5 API Endpoint Table (66 endpoints)
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default time 2026-05-01T00:00:00Z) ---
  - method: POST
    path: "/hedis/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-05-01T00:00:00Z; the clock NEVER falls back to wall-clock time. Side effect: seasons OPEN with submission_deadline < now auto-transition to SUBMISSION_CLOSED."
    roles: [QualityAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["auto-close OPEN seasons whose submission_deadline < to_iso8601"]

  # --- MeasurementSeason ---
  - method: POST
    path: "/hedis/seasons"
    description: "Create a measurement season"
    roles: [QualityAdmin]
    code: 201
    input: [measurement_year, submission_deadline, admin_data_cutoff, approved_supplemental_sources]
    output: MeasurementSeason
    side_effects: ["status=DRAFT", "certified_run_count=0"]
  - method: GET
    path: "/hedis/seasons/{seasonId}"
    description: "Get a season"
    roles: [QualityAdmin, QualityAnalyst, Abstractor, OverReader, ProviderRelations, Auditor, QualityDirector]
    code: 200
    input: []
    output: MeasurementSeason
    side_effects: []
  - method: POST
    path: "/hedis/seasons/{seasonId}/open"
    description: "Open a season (DRAFT -> OPEN)"
    roles: [QualityAdmin]
    code: 200
    input: []
    output: MeasurementSeason
    side_effects: ["increments MeasurementSeason.version by 1"]
  - method: POST
    path: "/hedis/seasons/{seasonId}/close-submission"
    description: "Manually close submissions (OPEN -> SUBMISSION_CLOSED)"
    roles: [QualityAdmin]
    code: 200
    input: []
    output: MeasurementSeason
    side_effects: ["increments MeasurementSeason.version by 1"]
  - method: GET
    path: "/hedis/seasons/{id}/measure-specifications"
    description: "List specs of a season (FK reverse reachability) Results ordered by created_at ASC (mint order); where mint order follows a business key (population entries, chart chases) that order is member_ref ASC."
    roles: [QualityAdmin, QualityAnalyst, Abstractor, OverReader, ProviderRelations, Auditor, QualityDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "MeasureSpecification[]"
    side_effects: []
  - method: GET
    path: "/hedis/seasons/{id}/audit-engagements"
    description: "List audit engagements of a season (FK reverse reachability) Results ordered by created_at ASC (mint order); where mint order follows a business key (population entries, chart chases) that order is member_ref ASC."
    roles: [QualityAdmin, QualityAnalyst, Abstractor, OverReader, ProviderRelations, Auditor, QualityDirector]
    code: 200
    input: ["status?"]
    output: "AuditEngagement[]"
    side_effects: []

  # --- MeasureSpecification ---
  - method: POST
    path: "/hedis/measure-specifications"
    description: "Load a measure specification version into a season (OCC on season version)"
    roles: [QualityAdmin]
    code: 201
    input: [season_id, hedis_measure_code, version_label, collection_method, "hybrid_policy?", "matching_policy?", "sample_size_floor?", age_min, age_max, "gender_requirement?", continuous_enrollment_months, "allowable_gap_days?", anchor_date, "reporting_weight?", expected_season_version]
    output: MeasureSpecification
    side_effects: ["status=LOADED", "increments MeasurementSeason.version by 1"]
  - method: GET
    path: "/hedis/measure-specifications/{specId}"
    description: "Get a spec"
    roles: [QualityAdmin, QualityAnalyst, Abstractor, OverReader, ProviderRelations, Auditor, QualityDirector]
    code: 200
    input: []
    output: MeasureSpecification
    side_effects: []
  - method: POST
    path: "/hedis/measure-specifications/{specId}/activate"
    description: "Activate a spec (LOADED -> ACTIVE)"
    roles: [QualityAdmin]
    code: 200
    input: []
    output: MeasureSpecification
    side_effects: ["increments MeasureSpecification.version by 1"]
  - method: POST
    path: "/hedis/measure-specifications/{specId}/retire"
    description: "Retire a spec (LOADED|ACTIVE -> RETIRED)"
    roles: [QualityAdmin]
    code: 200
    input: []
    output: MeasureSpecification
    side_effects: ["increments MeasureSpecification.version by 1"]

  # --- Member / enrollment ---
  - method: POST
    path: "/hedis/members"
    description: "Register a member"
    roles: [QualityAdmin]
    code: 201
    input: [member_ref, birth_date, gender, "attributed_provider_ref?"]
    output: Member
    side_effects: []
  - method: GET
    path: "/hedis/members/{memberId}"
    description: "Get a member"
    roles: [QualityAdmin, QualityAnalyst, Abstractor, OverReader, ProviderRelations, Auditor, QualityDirector]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: "/hedis/members/{id}/enrollment-segments"
    description: "List enrollment segments of a member (FK reverse reachability) Results ordered by created_at ASC (mint order); where mint order follows a business key (population entries, chart chases) that order is member_ref ASC."
    roles: [QualityAdmin, QualityAnalyst, Abstractor, OverReader, ProviderRelations, Auditor, QualityDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: "MemberEnrollmentSegment[]"
    side_effects: []
  - method: POST
    path: "/hedis/enrollment-segments"
    description: "Add a CLOSED-interval enrollment segment to a member"
    roles: [QualityAdmin]
    code: 201
    input: [member_id, span_start, span_end]
    output: MemberEnrollmentSegment
    side_effects: []

  # --- Provider ---
  - method: POST
    path: "/hedis/providers"
    description: "Register a provider"
    roles: [QualityAdmin]
    code: 201
    input: [provider_ref, name, "specialty?"]
    output: Provider
    side_effects: ["open_gap_count=0"]
  - method: GET
    path: "/hedis/providers/{providerId}"
    description: "Get a provider"
    roles: [QualityAdmin, QualityAnalyst, Abstractor, OverReader, ProviderRelations, Auditor, QualityDirector]
    code: 200
    input: []
    output: Provider
    side_effects: []
  - method: GET
    path: "/hedis/providers/{providerId}/gap-burden"
    description: "Computed read: provider gap burden score for a season (provider_gap_burden calculation; per-line rounding then sum)"
    roles: [QualityAdmin, QualityAnalyst, ProviderRelations, QualityDirector]
    code: 200
    input: [season_id]
    output: "{ burden_score: number, open_gap_count: integer, per_measure_lines: integer }"
    side_effects: []

  # --- MeasureRun ---
  - method: POST
    path: "/hedis/measure-runs"
    description: "Create a measure run; pins the spec version (spec_version_label, collection_method copied)"
    roles: [QualityAnalyst]
    code: 201
    input: [season_id, spec_id]
    output: MeasureRun
    side_effects: ["reporting_status=POPULATION_PENDING", "audit_status=UNAUDITED"]
  - method: GET
    path: "/hedis/measure-runs/{runId}"
    description: "Get a run"
    roles: [QualityAdmin, QualityAnalyst, Abstractor, OverReader, ProviderRelations, Auditor, QualityDirector]
    code: 200
    input: []
    output: MeasureRun
    side_effects: []
  - method: GET
    path: "/hedis/measure-runs"
    description: "List runs (filtered; FK reverse reachability for season_id / spec_id) Results ordered by created_at ASC (mint order); where mint order follows a business key (population entries, chart chases) that order is member_ref ASC."
    roles: [QualityAdmin, QualityAnalyst, Abstractor, OverReader, ProviderRelations, Auditor, QualityDirector]
    code: 200
    input: ["season_id?", "spec_id?", "reporting_status?", "limit?", "offset?"]
    output: "MeasureRun[]"
    side_effects: []
  - method: POST
    path: "/hedis/measure-runs/{runId}/identify-population"
    description: "Run eligible population identification; mints PopulationEntries"
    roles: [QualityAnalyst]
    code: 200
    input: []
    output: MeasureRun
    side_effects: ["eligible_population_identification", "denominator_count set", "increments MeasureRun.version by 1"]
  - method: POST
    path: "/hedis/measure-runs/{runId}/compute-rate"
    description: "Compute admin/hybrid/final rates and regenerate the gap list (OCC on run version)"
    roles: [QualityAnalyst]
    code: 200
    input: [expected_measure_run_version]
    output: MeasureRun
    side_effects: ["rate_determination", "gap list regeneration", "Provider.open_gap_count reconciliation", "increments MeasureRun.version by 1"]
  - method: POST
    path: "/hedis/measure-runs/{runId}/submit"
    description: "Submit the run for audit (RATE_COMPUTED -> SUBMITTED)"
    roles: [QualityAnalyst]
    code: 200
    input: []
    output: MeasureRun
    side_effects: ["submitted_by_user_id=X-User-ID", "HYBRID: sample FINALIZED -> LOCKED", "increments MeasureRun.version by 1"]
  - method: POST
    path: "/hedis/measure-runs/{runId}/certify"
    description: "Director certification decision (SUBMITTED -> CERTIFIED | CERTIFICATION_FAILED)"
    roles: [QualityDirector]
    code: 200
    input: [decision]
    output: MeasureRun
    side_effects: ["CERTIFIED: certified_run_count increment cascade and possible season auto-close", "increments MeasureRun.version by 1"]
  - method: POST
    path: "/hedis/measure-runs/{runId}/reopen"
    description: "Reopen a failed certification (CERTIFICATION_FAILED -> POPULATED; audit_status -> UNAUDITED)"
    roles: [QualityAnalyst]
    code: 200
    input: []
    output: MeasureRun
    side_effects: ["audit_status=UNAUDITED", "HYBRID: sample LOCKED -> FINALIZED", "increments MeasureRun.version by 1"]
  - method: GET
    path: "/hedis/measure-runs/{id}/samples"
    description: "List samples of a run (FK reverse reachability; 0 or 1 element) Results ordered by created_at ASC (mint order); where mint order follows a business key (population entries, chart chases) that order is member_ref ASC."
    roles: [QualityAdmin, QualityAnalyst, Abstractor, OverReader, ProviderRelations, Auditor, QualityDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: "Sample[]"
    side_effects: []
  - method: GET
    path: "/hedis/measure-runs/{id}/population-entries"
    description: "List population entries of a run (FK reverse reachability) Results ordered by created_at ASC (mint order); where mint order follows a business key (population entries, chart chases) that order is member_ref ASC."
    roles: [QualityAdmin, QualityAnalyst, Abstractor, OverReader, ProviderRelations, Auditor, QualityDirector]
    code: 200
    input: ["is_sampled?", "admin_compliant?", "limit?", "offset?"]
    output: "PopulationEntry[]"
    side_effects: []
  - method: GET
    path: "/hedis/measure-runs/{id}/supplemental-batches"
    description: "List supplemental batches of a run (FK reverse reachability) Results ordered by created_at ASC (mint order); where mint order follows a business key (population entries, chart chases) that order is member_ref ASC."
    roles: [QualityAdmin, QualityAnalyst, Abstractor, OverReader, ProviderRelations, Auditor, QualityDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SupplementalDataBatch[]"
    side_effects: []
  - method: GET
    path: "/hedis/measure-runs/{id}/gap-items"
    description: "List gap items of a run (FK reverse reachability; provider outreach list) Results ordered by created_at ASC (mint order); where mint order follows a business key (population entries, chart chases) that order is member_ref ASC."
    roles: [QualityAdmin, QualityAnalyst, ProviderRelations, Auditor, QualityDirector]
    code: 200
    input: ["provider_ref?", "status?", "member_ref?", "limit?", "offset?"]
    output: "GapItem[]"
    side_effects: []
  - method: GET
    path: "/hedis/measure-runs/{id}/audit-engagements"
    description: "List audit engagements of a run (FK reverse reachability) Results ordered by created_at ASC (mint order); where mint order follows a business key (population entries, chart chases) that order is member_ref ASC."
    roles: [QualityAdmin, QualityAnalyst, Auditor, QualityDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: "AuditEngagement[]"
    side_effects: []

  # --- PopulationEntry ---
  - method: POST
    path: "/hedis/population-entries/{entryId}/exclude"
    description: "Apply a pre-draw valid exclusion to a denominator entry"
    roles: [QualityAnalyst]
    code: 200
    input: [reason]
    output: PopulationEntry
    side_effects: ["is_excluded=true", "exclusion_reason=reason", "run.exclusion_count += 1", "run.denominator_count -= 1", "increments PopulationEntry.version by 1", "increments MeasureRun.version by 1"]

  # --- Sample ---
  - method: POST
