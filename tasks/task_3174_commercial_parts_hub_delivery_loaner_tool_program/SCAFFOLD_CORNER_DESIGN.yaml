      - PartOrder.${ord}.order_base_cents stays pinned at the creation-time value
      - PartOrder.${ord}.pricing_band == "BRONZE" and tier_discount_cents == 0, so neither line was discounted
- section: validations
  instances:
  - name: missing_user_context_header_beats_every_other_check
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
    distinguishing_aspect: A request with no role header at all fails at priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER even when the payload is also invalid.
    test_recipe:
      setup:
      - Logical clock set; no account exists.
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /commercial/commercial-accounts
        payload: {}
        as: Anonymous
        captures:
          err_id: $.data.error_id
      assert:
      - the response status is 400 with ${err_id} == "ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
      - the same call with a valid role but an empty body instead returns ERR_INVALID_REQUEST, so the two failures are distinguishable
  - name: role_denial_on_credit_analyst_operation_returns_insufficient_permissions
    claim_type: violation_to_error
    grounds:
    - validations[priority=2]
    - errors[ERR_INSUFFICIENT_PERMISSIONS]
    distinguishing_aspect: A role that is not listed on the endpoint is rejected with 403 ERR_INSUFFICIENT_PERMISSIONS before existence or state are checked.
    test_recipe:
      setup:
      - Logical clock set; a satellite exists.
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      - call: POST /commercial/stores
        payload:
          store_code: S100
          name: Rbac Satellite
          store_type: SATELLITE
          delivery_radius_miles: 5.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 240
          daily_capacity_units: 500
        as: PartsCategoryManager
        captures:
          s_sat: $.data.id
      trigger:
      - call: POST /commercial/stores
        payload:
          store_code: S101
          name: Denied
          store_type: SATELLITE
          delivery_radius_miles: 5.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 240
          daily_capacity_units: 500
        as: CreditAnalyst
        captures:
          err_id: $.data.error_id
      assert:
      - the response status is 403 with ${err_id} == "ERR_INSUFFICIENT_PERMISSIONS"
      - no Store with store_code S101 exists afterwards
  - name: path_ids_are_resolved_left_to_right_for_the_first_missing_one
    claim_type: cascading_validation
    grounds:
    - validations[priority=3]
    - errors[ERR_SERVICE_ROUTE_NOT_FOUND]
    - errors[ERR_ROUTE_STOP_NOT_FOUND]
    distinguishing_aspect: With both path ids unknown the leftmost missing id wins, so the reported error names the route rather than the stop.
    test_recipe:
      setup:
      - Logical clock set; nothing has been created.
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /commercial/route-stops/{99999999-0000-0000-0000-000000000001}/deliver
        payload: {}
        as: DeliveryDriver
        captures:
          err_id: $.data.error_id
      assert:
      - the response status is 404 with ${err_id} == "ERR_ROUTE_STOP_NOT_FOUND"
      - the route-level read on the same unknown id returns the route-specific not-found instead, so the two checks are separately reachable
  - name: credit_limit_rule_sits_after_capacity_and_stock
    claim_type: priority_ordering
    grounds:
    - validations[priority=10]
    - validations[priority=12]
    - validations[priority=19]
    distinguishing_aspect: 'All three business checks are violated at once and the ordering is observable: an order with no stock and an over-limit account reports the stock error, because constraint checks precede fiscal checks.'
    test_recipe:
      setup:
      - Logical clock set; satellite has no stock of p_g; account A has a 100-cent limit and already carries a 1673-cent draft order.
      setup_api_calls:
