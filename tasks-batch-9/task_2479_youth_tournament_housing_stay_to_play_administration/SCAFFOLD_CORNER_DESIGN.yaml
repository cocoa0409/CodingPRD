      - name: contract_block_posture_tight_when_only_some_blocks_restricted
        claim_type: aggregation
        grounds:
          - calculations.contract_block_posture
          - calculations.tournament_housing_pressure
        distinguishing_aspect: |
          The posture aggregate has a middle branch the difficulty design never reaches: with two live
          blocks and exactly one RESTRICTED, restricted_count 1 is neither 0 nor equal to the live
          count, so block_posture must be TIGHT — not SOLD_OUT and not AVAILABLE. Because SOLD_OUT is
          required for pressure, the tournament's sold_out_contract_count stays 0 and housing_pressure
          stays NORMAL even though one block is full.
        test_recipe:
          setup:
            - "The two-block fixture: a 20-room block with no bookings and a 10-room block holding a CONFIRMED 4-room booking, plus a second 5-room booking awaiting confirm."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_block10
            - *sc_teamA
            - *sc_regA
            - *sc_teamB
            - *sc_regB
            - *sc_bkA_overlap
            - *sc_rlA4
            - *sc_confirmA
            - *sc_bkB_overlap
            - *sc_rlB5
          trigger:
            - *sc_confirmB
          assert:
            - "response.status == 200"
            - "RoomBlock.${block_id}.status == OPEN"
            - "RoomBlock.${block10_id}.status == RESTRICTED"
            - "HotelContract.${contract_id}.block_posture == TIGHT"
            - "Tournament.${tourn_id}.executed_contract_count == 1"
            - "Tournament.${tourn_id}.sold_out_contract_count == 0"
            - "Tournament.${tourn_id}.housing_pressure == NORMAL"

      - name: peak_night_occupancy_not_sum_over_adjacent_stays
        claim_type: interval_merge
        grounds:
          - calculations.block_rooms_committed
          - calculations.block_utilization_posture
        distinguishing_aspect: |
          rooms_committed is the MAXIMUM over the block's nights of that night's committed occupancy,
          and the stay windows are half-open. Team A holds 4 rooms on [09-10, 09-12) and team B holds
          5 rooms on [09-12, 09-13), so the two never share a night: the peak is 5, utilization is
          0.5000 and the block stays OPEN. Summing rooms across the block instead of taking the
          per-night peak would give 9, utilization 0.9000 and a RESTRICTED block.
        test_recipe:
          setup:
            - "An EXECUTED contract carrying a 10-room block over 2026-09-10 to 2026-09-13 and two registered visiting teams."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_block10
            - *sc_teamA
            - *sc_regA
            - *sc_teamB
            - *sc_regB
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg_a_id}", room_block_id: "${block10_id}", rooms_requested: 4, check_in_date: "2026-09-10", check_out_date: "2026-09-12", expected_registration_version: "${reg_a_v}" }
              as: HousingManager
              captures: { bk_a2_id: "$.data.id" }
