            - call: "POST /ops/flight-legs/${leg}/disruptions"
              payload: { disruption_type: "DELAY", cause: "WEATHER", delay_minutes: 30 }
              as: Passenger
              as_user_id: "${pa}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN with HTTP 403"
            - "leg remains SCHEDULED"

