  - rule_id: transitive_cascade
    instances:
      - name: adjustment_post_cascades_account_resolve_and_ecas_halt
        grounds:
          - state_machines.PatientAccount.ASSISTANCE_HOLD_to_RESOLVED
          - state_machines.CollectionAction.INITIATED_to_HALTED
          - state_machines.DiscountDetermination
        distinguishing_aspect: |
          Depth-3 chain from POST /accounts/{id}/adjustments: (1) WRITE_OFF posts and recomputes
          adjusted_balance_cents; (2) that recompute drives the account's own transition ASSISTANCE_HOLD ->
          RESOLVED; (3) entering RESOLVED halts every INITIATED CollectionAction. Each link is caused by the
          previous link, not by the original POST.
