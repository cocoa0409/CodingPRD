# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Allergy & Immunotherapy Clinic. Nine Difficulty Rules × ≥2 instances each.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.6.
# Default clock = 2026-01-01T00:00:00Z unless a _clock/set_current_utc call moves it.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: panel_screening_vs_clinical_composite_diverge
        grounds:
          - calculations.panel_sensitization_score
          - entities.DiagnosticPanel.fields.screening_composite
          - entities.DiagnosticPanel.fields.clinical_composite
          - entities.DiagnosticPanel.fields.recommended_tier
        distinguishing_aspect: |
          SCREENING (mean over ALL tests) and CLINICAL (mean over clinically_relevant=true
          tests) compute on the DiagnosticPanel domain and yield 3.67 vs 4.50 for the same
          three tests; recommended_tier (driven by CLINICAL) is MODERATE, whereas had SCREENING
          driven it the tier would be LOW (3.67 < 4) — a divergent starting-vial recommendation.
        test_recipe:
          setup:
            - "An ACTIVE patient with an OPEN panel (control_wheal_mm=3) carrying three tests: SKIN wheal 8 (relevant), BLOOD IgE 18 kU (relevant), SKIN wheal 5 (not relevant)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Dora Allen", date_of_birth: "1990-05-05", epinephrine_on_file: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "NE Tree+Grass", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "OAK", method: "SKIN", wheal_mm: 8, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "D_FARINAE", method: "BLOOD", specific_ige_ku: 18, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "TIMOTHY", method: "SKIN", wheal_mm: 5, clinically_relevant: false }
              as: Allergist
          trigger:
            - call: "GET /panels/${panel_id}"
              payload: {}
              as: Allergist
              captures: { scr: $.data.screening_composite, clin: $.data.clinical_composite, tier: $.data.recommended_tier }
          assert:
            - "DiagnosticPanel.${panel_id}.screening_composite == 3.67"
            - "DiagnosticPanel.${panel_id}.clinical_composite == 4.5"
            - "DiagnosticPanel.${panel_id}.recommended_tier == MODERATE (clinical 4.5 in [4,7); screening 3.67 would have given LOW)"

      - name: billing_95165_provisional_vs_final_diverge
        grounds:
          - calculations.billing_charge
          - entities.BillingEntry.fields.billed_dose_units
          - entities.BillingEntry.fields.variant
          - state_machines.BillingEntry.POSTED_to_RECONCILED
        distinguishing_aspect: |
          The 95165 prep charge on the SerumVial/BillingEntry domain bills PROVISIONAL
          ceil(prepared_volume_ml)=ceil(5.0)=5 doses (7250c) at mix but RECONCILES to FINAL
          ceil(drawn=0.30)=1 dose (1450c) once the vial is DISCARDED with only 0.30 mL drawn.
        test_recipe:
          setup:
            - "An ACTIVE RED-start plan with one mixed RED vial (prepared 5.0 mL, PROVISIONAL 95165 posted), one shot released drawing 0.10 mL and another drawing 0.20 mL (0.30 mL total), then the plan discontinued."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Ed Brand", date_of_birth: "1988-02-02", epinephrine_on_file: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Dust", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "DUST", method: "SKIN", wheal_mm: 6, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
              captures: { tier: $.data.recommended_tier }
            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version, start_color: $.data.starting_vial_color }
            - call: "POST /serum-lots"
              payload: { vial_color: "RED", lot_number: "RED-001", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Pharmacist
              captures: { vial_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/activate"
              payload: {}
              as: Allergist
              captures: { plan_v2: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/shot-visits"
              payload: { vial_id: "${vial_id}", expected_plan_version: "${plan_v2}" }
              as: Nurse
              captures: { v1_id: $.data.id, adm1: $.data.administered_at_iso, win1: $.data.observation_window_min }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T01:00:00Z" }
              as: Nurse
            - call: "POST /shot-visits/${v1_id}/release"
              payload: { released_at_iso: "2026-01-01T01:00:00Z", reaction_grade: "NONE" }
              as: Nurse
              captures: { plan_v3: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/shot-visits"
              payload: { vial_id: "${vial_id}", expected_plan_version: "${plan_v3}" }
              as: Nurse
              captures: { v2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T02:00:00Z" }
              as: Nurse
            - call: "POST /shot-visits/${v2_id}/release"
              payload: { released_at_iso: "2026-01-01T02:00:00Z", reaction_grade: "NONE" }
              as: Nurse
          trigger:
            - call: "POST /immunotherapy-plans/${plan_id}/discontinue"
              payload: {}
              as: Allergist
            - call: "GET /billing-entries?vial_id=${vial_id}"
              payload: {}
              as: Biller
          assert:
            - "ImmunotherapyPlan.${plan_id}.starting_vial_color == RED"
            - "The CPT_95165 BillingEntry (vial_id == ${vial_id}) has variant FINAL, billed_dose_units == 1, charge_cents == 1450, status RECONCILED (was PROVISIONAL billed_dose_units 5 / 7250c at mix)."

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: antigen_units_round_at_end_not_per_factor
        grounds:
          - calculations.antigen_units
          - entities.ShotVisit.fields.antigen_units_delivered
          - entities.SerumVial.fields.dilution_factor
        distinguishing_aspect: |
          Mode (b) nested-rounding-order: antigen_units = round(volume * dilution_factor *
          potency, 2) is pinned round-AT-END; for RED 0.10 mL at potency 10000 the single
          end-round product is 100.00 (0.10*0.1*10000), distinct from any per-factor rounding.
        test_recipe:
          setup:
            - "An ACTIVE RED-start plan with a RED vial (potency 10000), one shot administered at RED step1 (0.10 mL)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Fay Cole", date_of_birth: "1991-03-03", epinephrine_on_file: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Cat", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "CAT", method: "SKIN", wheal_mm: 6, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /serum-lots"
              payload: { vial_color: "RED", lot_number: "RED-100", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Pharmacist
              captures: { vial_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/activate"
              payload: {}
              as: Allergist
              captures: { plan_v2: $.data.version }
          trigger:
            - call: "POST /immunotherapy-plans/${plan_id}/shot-visits"
              payload: { vial_id: "${vial_id}", expected_plan_version: "${plan_v2}" }
              as: Nurse
              captures: { visit_id: $.data.id, units: $.data.antigen_units_delivered, dose: $.data.scheduled_dose_volume_ml }
          assert:
            - "ShotVisit.${visit_id}.scheduled_dose_volume_ml == 0.10"
            - "ShotVisit.${visit_id}.antigen_units_delivered == 100.0"

      - name: panel_composite_nonlinear_inclusion_branch
        grounds:
          - calculations.panel_sensitization_score
          - entities.DiagnosticPanel.fields.clinical_composite
          - entities.AllergenTest.fields.sensitization_index
        distinguishing_aspect: |
          Mode (a) ≥3-input non-linear interaction: per-test index branches on method
          (SKIN diff vs BLOOD CAP-class bucketing) AND the composite branches on the
          clinically_relevant inclusion predicate — three interacting inputs (method,
          value, relevance) produce clinical_composite 4.5 here, not a single linear sum.
        test_recipe:
          setup:
            - "An OPEN panel (control_wheal_mm=3) with SKIN wheal 8 (relevant, index 5), BLOOD IgE 18 (relevant, class 4), SKIN wheal 5 (not relevant, index 2)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Gil Dane", date_of_birth: "1985-04-04", epinephrine_on_file: false }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Mixed", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "OAK", method: "SKIN", wheal_mm: 8, clinically_relevant: true }
              as: Allergist
              captures: { t1_id: $.data.id, idx1: $.data.sensitization_index }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "DUST", method: "BLOOD", specific_ige_ku: 18, clinically_relevant: true }
              as: Allergist
              captures: { t2_id: $.data.id, idx2: $.data.sensitization_index }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "TIMOTHY", method: "SKIN", wheal_mm: 5, clinically_relevant: false }
              as: Allergist
              captures: { t3_id: $.data.id, idx3: $.data.sensitization_index }
          trigger:
            - call: "GET /panels/${panel_id}"
              payload: {}
              as: Allergist
              captures: { clin: $.data.clinical_composite }
          assert:
            - "AllergenTest.${t1_id}.sensitization_index == 5"
            - "AllergenTest.${t2_id}.sensitization_index == 4"
            - "AllergenTest.${t3_id}.sensitization_index == 2"
            - "DiagnosticPanel.${panel_id}.clinical_composite == 4.5"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: shot_visit_branch_fork_divergent_side_effects
        grounds:
          - state_machines.ShotVisit.ADMINISTERED_to_RELEASED
          - state_machines.ShotVisit.ADMINISTERED_to_REACTION_LOCAL
          - state_machines.ShotVisit.ADMINISTERED_to_REACTION_SYSTEMIC
        distinguishing_aspect: |
          ShotVisit forks ADMINISTERED -> {RELEASED, REACTION_LOCAL, REACTION_SYSTEMIC}
          with divergent side-effects: RELEASED advances the ladder, REACTION_LOCAL holds
          the step, REACTION_SYSTEMIC cascades plan->HELD + billing->REVERSED. Asserted on
          the SYSTEMIC branch's distinct outcome.
        test_recipe:
          setup:
            - "An ACTIVE RED-start plan with a RED vial and one ADMINISTERED shot (RED step1, 0.10 mL); patient has epinephrine_on_file true."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Hal East", date_of_birth: "1979-06-06", epinephrine_on_file: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Grass", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "RAGWEED", method: "SKIN", wheal_mm: 7, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /serum-lots"
              payload: { vial_color: "RED", lot_number: "RED-200", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Pharmacist
              captures: { vial_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/activate"
              payload: {}
              as: Allergist
              captures: { plan_v2: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/shot-visits"
              payload: { vial_id: "${vial_id}", expected_plan_version: "${plan_v2}" }
              as: Nurse
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /shot-visits/${visit_id}/record-reaction"
              payload: { reaction_grade: "SYSTEMIC", epinephrine_administered: true }
              as: Nurse
          trigger_note: "SYSTEMIC branch chosen; RELEASED/LOCAL branches are mutually exclusive from this same ADMINISTERED state."
          assert:
            - "ShotVisit.${visit_id}.status == REACTION_SYSTEMIC"
            - "ImmunotherapyPlan.${plan_id}.status == HELD"

      - name: plan_held_active_revert_cycle
        grounds:
          - state_machines.ImmunotherapyPlan.ACTIVE_to_HELD
          - state_machines.ImmunotherapyPlan.HELD_to_ACTIVE
          - calculations.reaction_reduction
        distinguishing_aspect: |
          ImmunotherapyPlan exhibits an ACTIVE<->HELD revert cycle (distinct entity from
          ShotVisit): a systemic reaction drives ACTIVE->HELD, and resume drives HELD->ACTIVE
          with a step-back, so the plan re-enters a state it previously occupied.
        test_recipe:
          setup:
            - "A plan held by a systemic reaction after administering RED step2 (0.20 mL); patient epinephrine_on_file true."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Ivy Frost", date_of_birth: "1983-07-07", epinephrine_on_file: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Mold", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "MOLD", method: "SKIN", wheal_mm: 6, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /serum-lots"
              payload: { vial_color: "RED", lot_number: "RED-300", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Pharmacist
              captures: { vial_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/activate"
              payload: {}
              as: Allergist
              captures: { plan_v2: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/shot-visits"
              payload: { vial_id: "${vial_id}", expected_plan_version: "${plan_v2}" }
              as: Nurse
              captures: { v1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T01:00:00Z" }
              as: Nurse
            - call: "POST /shot-visits/${v1_id}/release"
              payload: { released_at_iso: "2026-01-01T01:00:00Z", reaction_grade: "NONE" }
              as: Nurse
              captures: { plan_v3: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/shot-visits"
              payload: { vial_id: "${vial_id}", expected_plan_version: "${plan_v3}" }
              as: Nurse
              captures: { v2_id: $.data.id }
            - call: "POST /shot-visits/${v2_id}/record-reaction"
              payload: { reaction_grade: "SYSTEMIC", epinephrine_administered: true }
              as: Nurse
            - call: "GET /immunotherapy-plans/${plan_id}"
              payload: {}
              as: Allergist
              captures: { plan_v_held: $.data.version }
          trigger:
            - call: "POST /immunotherapy-plans/${plan_id}/resume"
              payload: { expected_plan_version: "${plan_v_held}" }
              as: Allergist
              captures: { resumed_status: $.data.status, color_after: $.data.current_vial_color, step_after: $.data.current_step_index }
          trigger_note: "expected_plan_version captures the version observed on the held plan via a GET right before resume; the v2 administration and the SYSTEMIC->HELD cascade both bumped version, so the literal would go stale — ${plan_v_held} is the only safe form. (Stale-version negative lives in the corner design.)"
          assert:
            - "ImmunotherapyPlan.${plan_id}.status == ACTIVE"
            - "ImmunotherapyPlan.${plan_id}.current_vial_color == RED"
            - "ImmunotherapyPlan.${plan_id}.current_step_index == 1"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: lot_recall_cascade_depth_three
        grounds:
          - state_machines.SerumLot.AVAILABLE_to_RECALLED
          - state_machines.SerumVial.IN_USE_to_DISCARDED
          - state_machines.BillingEntry.POSTED_to_RECONCILED
          - state_machines.ImmunotherapyPlan.ACTIVE_to_HELD
        distinguishing_aspect: |
          Recall triggers a depth-3 chain: recall lot (A) -> its IN_USE vial DISCARDED (B,
          caused by A) -> that vial's 95165 entry RECONCILED to FINAL (C, caused by B) ->
          the plan left with no surviving starting vial HELD (D, caused by B). Distinct
          trigger from the systemic-reaction cascade.
        test_recipe:
          setup:
            - "An ACTIVE RED-start plan with exactly one IN_USE RED vial (prepared 5.0, 0.10 mL drawn via one released shot) backed by lot RED-400, PROVISIONAL 95165 posted."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Joy Gill", date_of_birth: "1992-08-08", epinephrine_on_file: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Tree", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "BIRCH", method: "SKIN", wheal_mm: 6, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /serum-lots"
              payload: { vial_color: "RED", lot_number: "RED-400", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Pharmacist
              captures: { vial_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/activate"
              payload: {}
              as: Allergist
              captures: { plan_v2: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/shot-visits"
              payload: { vial_id: "${vial_id}", expected_plan_version: "${plan_v2}" }
              as: Nurse
              captures: { v1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T01:00:00Z" }
              as: Nurse
            - call: "POST /shot-visits/${v1_id}/release"
              payload: { released_at_iso: "2026-01-01T01:00:00Z", reaction_grade: "NONE" }
              as: Nurse
          trigger:
            - call: "POST /serum-lots/${lot_id}/recall"
              payload: {}
              as: Pharmacist
            - call: "GET /serum-vials/${vial_id}"
              payload: {}
              as: Pharmacist
            - call: "GET /billing-entries?vial_id=${vial_id}"
              payload: {}
              as: Biller
          assert:
            - "SerumLot.${lot_id}.status == RECALLED"
            - "SerumVial.${vial_id}.status == DISCARDED"
            - "The CPT_95165 BillingEntry (vial_id == ${vial_id}) has status RECONCILED, variant FINAL, billed_dose_units == 1, charge_cents == 1450 (ceil(0.10)=1)."
            - "ImmunotherapyPlan.${plan_id}.status == HELD"

      - name: systemic_reaction_cascade_depth_two
        grounds:
          - state_machines.ShotVisit.ADMINISTERED_to_REACTION_SYSTEMIC
          - state_machines.ImmunotherapyPlan.ACTIVE_to_HELD
          - state_machines.BillingEntry.POSTED_to_REVERSED
          - entities.Patient.fields.prior_systemic_reaction
        distinguishing_aspect: |
          Recording SYSTEMIC (A) drives plan ACTIVE->HELD (B, caused by A) and the visit's
          injection BillingEntry POSTED->REVERSED (caused by A); plus patient
          prior_systemic_reaction flips true. Distinct origin transition from the lot-recall
