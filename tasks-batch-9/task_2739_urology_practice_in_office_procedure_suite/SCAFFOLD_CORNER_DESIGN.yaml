              payload: { to_iso8601: "2026-09-14T11:16:00Z" }
              as: PracticeAdmin
            - call: "POST /urology/procedure-cases/${case_2_id}/no-show"
              payload: {}
              as: Scheduler
              as_user_id: "${sch_id}"
            - call: "GET /urology/procedure-rooms/${room_id}"
              payload: {}
              as: PracticeAdmin
              captures: { room_v_end: $.data.version }
          assert:
            - "after the first recall the patient reports outstanding_recall_count 1; after the second, 2 — the counter is recomputed from the open recall set on every recall write"
            - "the STONE recall's due_on is \"2028-09-01\" (LOW, 24 months) and the BLADDER_CANCER recall's is \"2027-09-01\" (LOW, 12 months); both start SCHEDULED_DUE"
            - "after closing the STONE recall the patient reports outstanding_recall_count 1 and status \"CLOSED\" with closed_reason \"PATIENT_DECLINED\" on that row"
            - "the second BLADDER_CANCER recall supersedes the first: the first becomes status \"SUPERSEDED\", the new row records predecessor_recall_id ${recall_bc_id} and due_on \"2026-12-14\" (HIGH, 3 months), and outstanding_recall_count is back to 2 — flat across a supersede, which no monotonic counter would reproduce"
            - "GET /urology/surveillance-recalls?patient_id=${pat_id} has total_count == 3 with exactly one row in SCHEDULED_DUE, one CLOSED and one SUPERSEDED"
            - "the room reports occupied_block_count 1 after the first schedule and 2 after the second"
            - "after cancelling case_1 the room reports occupied_block_count 1; after no-showing case_2 it reports 0 with version ${room_v_end} — the counter reconciles downward as blocks leave the committed set"
            - "each counter value is already correct in the mutating call's own response body, not only in the following GET"

      - name: ccl_cascading_side_effects_depth_and_ordering
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines[ProcedureCase.schedule_status]
          - state_machines[Specimen.chain_status]
        excluded_because:
          difficulty_instance: tc_specimen_result_recall_supersede_depth4
          rationale: "The four-hop chain from filing a pathology result through recall creation, supersede of the prior recall and the patient counter recompute is already asserted hop by hop there, including the created_at ASC processing order of the superseded rows, and tc_complete_case_recall_patient_depth3 covers the completion chain. A §1.9 breadth instance would restate the same calls with the same expected values."

      - name: ccl_cascading_side_effects_scope_quarantine_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines[ScopeAsset.status]
          - state_machines[ReprocessingLog.log_status]
        excluded_because:
          difficulty_instance: nl_scope_reprocessing_full_cycle
          rationale: "CASCADE C — a failing reprocessing log closing, quarantining its scope and forcing leak_test_required while clearing reprocess_due_at — is asserted end to end in that instance, together with the full five-stage cycle back to AVAILABLE. This file only reuses the chain as setup for the priority-50-over-51 claim in err_scope_assignment_state_guards_rejected."

      - name: ccl_dual_variant_calculation_both_variants_and_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.consignment_billing
        excluded_because:
          difficulty_instance: dv_consignment_provisional_vs_final
          rationale: "Both billing variants, the divergence on identical data and the delta applied when the provisional amount is replaced by the final one are asserted there with pre-computed cent literals; the sibling dv_recall_protocol_vs_event_anchored covers variant selection on the recall side. A breadth instance would duplicate both."

  - section: consistency_model
    instances:

      - name: consistency_immediate_all_effects_visible_in_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.case_occupancy_window
          - calculations.check_in_readiness_gates
          - calculations.notification_escalation_clock
        distinguishing_aspect: "consistency_model is immediate, so no derived value ever lags: the schedule response already carries scheduled_end_at and block_end_at, the readiness read taken right after the clearance review already opens the gate, and the result response already carries escalation_due_at and has already pushed the new recall onto the patient's counter. Re-reading every mutated row a second time returns byte-identical values, which is what distinguishes immediate from eventual — there is no window in which a second read differs from the first."
