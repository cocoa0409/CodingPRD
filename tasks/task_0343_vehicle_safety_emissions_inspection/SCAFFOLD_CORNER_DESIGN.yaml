      - name: occ_batch_submit_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[batch-submit-stale-batch]", "errors[ERR_STALE_VERSION]", "validations[priority=6]", "endpoints.POST /state-report-batches/{id}/submit"]
        distinguishing_aspect: "After a line is attached (batch version advances) the submit carrying the pre-attach expected_batch_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["An OPEN batch whose version the client captured at creation, then a line was attached (version advanced)."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "ObStn", state_code: "CA", certificate_serial_prefix: "CA-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
