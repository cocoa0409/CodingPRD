# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Boat Club & Membership Boating — Expert
# 9 Difficulty Rules x 2 instances = 18 instances.
# Every ${var} is bound by an earlier captures: block in the same instance.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dv_dues_estimated_vs_final
        grounds:
          - calculations.dues_invoice_total
          - entities.DuesInvoice.fields.estimated_total_cents
          - entities.DuesInvoice.fields.final_total_cents
        distinguishing_aspect: "On the SAME DuesInvoice, the forward-looking ESTIMATED total pinned at issue (25850) differs from the chronological FINAL total pinned at payment (36700) because a 10000-cent damage fee is assessed between issue and payment; this dual-variant subject is billing (DuesInvoice), a different entity domain from the fuel dual-variant."
        test_recipe:
          setup:
            - "A CRUISE member (base dues 15000) is ACTIVE and BASIC-certified at a home dock with two boats."
            - "One 10000-cent DAMAGE fee is ASSESSED before the invoice is issued; a second 10000-cent DAMAGE fee is assessed after issue but before payment."
          setup_api_calls:
            - { call: "POST /membership-tiers", payload: { tier_code: "CRUISE", monthly_dues_cents: 15000, max_active_reservations: 1, reservations_per_week: 2, reciprocal_access_allowed: false, advance_booking_days_max: 7 }, as: ClubAdmin }
            - { call: "POST /docks", payload: { name: "Home", location_code: "HM", capacity: 10, is_reciprocal: false }, as: ClubAdmin, captures: { hd: "$.data.id" } }
            - { call: "POST /boats", payload: { dock_id: "${hd}", boat_type: "PONTOON" }, as: ClubAdmin, captures: { b1: "$.data.id" } }
            - { call: "POST /boats", payload: { dock_id: "${hd}", boat_type: "PONTOON" }, as: ClubAdmin, captures: { b2: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "A", email: "a@x.com", membership_tier: "CRUISE", home_dock_id: "${hd}" }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /training-sessions", payload: { dock_id: "${hd}", session_type: "ORIENTATION", start_time: "2026-05-02T09:00:00Z", end_time: "2026-05-02T11:00:00Z", capacity: 5, instructor_name: "I" }, as: ClubAdmin, captures: { so: "$.data.id" } }
            - { call: "POST /enrollments", payload: { member_id: "${m}", session_id: "${so}" }, as: Member, as_user_id: "${m}", captures: { eo: "$.data.id" } }
            - { call: "POST /enrollments/${eo}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /training-sessions", payload: { dock_id: "${hd}", session_type: "BASIC_CERT", start_time: "2026-05-02T12:00:00Z", end_time: "2026-05-02T14:00:00Z", capacity: 5, instructor_name: "I" }, as: ClubAdmin, captures: { sb: "$.data.id" } }
            - { call: "POST /enrollments", payload: { member_id: "${m}", session_id: "${sb}" }, as: Member, as_user_id: "${m}", captures: { eb: "$.data.id" } }
            - { call: "POST /enrollments/${eb}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /reservations", payload: { member_id: "${m}", dock_id: "${hd}", boat_type: "PONTOON", start_time: "2026-05-05T10:00:00Z", end_time: "2026-05-05T12:00:00Z" }, as: Member, as_user_id: "${m}", captures: { r: "$.data.id" } }
            - { call: "POST /damage-reports", payload: { reservation_id: "${r}", boat_id: "${b1}", severity: "MINOR", repair_cost_cents: 10000 }, as: DockStaff, captures: { dr1: "$.data.id" } }
            - { call: "POST /damage-reports/${dr1}/assess", payload: {}, as: DockStaff }
            - { call: "GET /members/${m}", payload: {}, as: ClubAdmin, captures: { mv: "$.data.version" } }
            - { call: "POST /members/${m}/dues-invoices", payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", expected_member_version: "${mv}" }, as: ClubAdmin, captures: { inv: "$.data.id" } }
          trigger:
            - { call: "POST /damage-reports", payload: { reservation_id: "${r}", boat_id: "${b2}", severity: "MINOR", repair_cost_cents: 10000 }, as: DockStaff, captures: { dr2: "$.data.id" } }
            - { call: "POST /damage-reports/${dr2}/assess", payload: {}, as: DockStaff }
            - { call: "POST /dues-invoices/${inv}/pay", payload: {}, as: Member, as_user_id: "${m}" }
          assert:
            - "DuesInvoice.${inv}.estimated_total_cents == 25850"
            - "DuesInvoice.${inv}.final_total_cents == 36700"
            - "DuesInvoice.${inv}.estimated_total_cents != DuesInvoice.${inv}.final_total_cents"

      - name: dv_fuel_provisional_vs_final
        grounds:
          - calculations.fuel_fee
          - entities.Reservation.fields.provisional_fuel_fee_cents
          - state_machines.Reservation.CHECKED_OUT_to_RETURNED
        distinguishing_aspect: "For the SAME trip, the PROVISIONAL fuel fee pinned at checkout (6500, projecting a return at the 25% floor) differs from the FINAL FUEL Fee created at return (8000, measured from fuel_at_return=10); this dual-variant subject is the Reservation/fuel domain, distinct from the DuesInvoice billing dual-variant."
        test_recipe:
          setup:
            - "A SAIL member is ACTIVE and BASIC-certified with one PONTOON boat; a reservation is CONFIRMED on that boat."
            - "Checkout records fuel_at_checkout=90; return records fuel_at_return=10 exactly at end_time (no late fee)."
          setup_api_calls:
            - { call: "POST /membership-tiers", payload: { tier_code: "SAIL", monthly_dues_cents: 25000, max_active_reservations: 2, reservations_per_week: 4, reciprocal_access_allowed: true, advance_booking_days_max: 14 }, as: ClubAdmin }
            - { call: "POST /docks", payload: { name: "Home", location_code: "HM", capacity: 10, is_reciprocal: false }, as: ClubAdmin, captures: { hd: "$.data.id" } }
            - { call: "POST /boats", payload: { dock_id: "${hd}", boat_type: "PONTOON" }, as: ClubAdmin, captures: { b1: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "A", email: "a@x.com", membership_tier: "SAIL", home_dock_id: "${hd}" }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /training-sessions", payload: { dock_id: "${hd}", session_type: "ORIENTATION", start_time: "2026-05-02T09:00:00Z", end_time: "2026-05-02T11:00:00Z", capacity: 5, instructor_name: "I" }, as: ClubAdmin, captures: { so: "$.data.id" } }
            - { call: "POST /enrollments", payload: { member_id: "${m}", session_id: "${so}" }, as: Member, as_user_id: "${m}", captures: { eo: "$.data.id" } }
            - { call: "POST /enrollments/${eo}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /training-sessions", payload: { dock_id: "${hd}", session_type: "BASIC_CERT", start_time: "2026-05-02T12:00:00Z", end_time: "2026-05-02T14:00:00Z", capacity: 5, instructor_name: "I" }, as: ClubAdmin, captures: { sb: "$.data.id" } }
            - { call: "POST /enrollments", payload: { member_id: "${m}", session_id: "${sb}" }, as: Member, as_user_id: "${m}", captures: { eb: "$.data.id" } }
            - { call: "POST /enrollments/${eb}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /reservations", payload: { member_id: "${m}", dock_id: "${hd}", boat_type: "PONTOON", start_time: "2026-05-05T10:00:00Z", end_time: "2026-05-05T12:00:00Z" }, as: Member, as_user_id: "${m}", captures: { r: "$.data.id" } }
            - { call: "POST /reservations/${r}/confirm", payload: {}, as: Member, as_user_id: "${m}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T10:00:00Z" }, as: ClubAdmin }
            - { call: "POST /reservations/${r}/checkout", payload: { fuel_at_checkout: 90 }, as: Member, as_user_id: "${m}", captures: { prov: "$.data.provisional_fuel_fee_cents" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T12:00:00Z" }, as: ClubAdmin }
            - { call: "POST /reservations/${r}/return", payload: { fuel_at_return: 10 }, as: Member, as_user_id: "${m}" }
          assert:
            - "Reservation.${r}.provisional_fuel_fee_cents == 6500"
            - "exactly one Fee exists with member_id=${m} and fee_type=FUEL, and its amount_cents == 8000"
            - "Reservation.${r}.provisional_fuel_fee_cents != (that FUEL Fee).amount_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_damage_fee_nested_minmax
        grounds:
          - calculations.damage_fee
          - state_machines.DamageReport.FILED_to_ASSESSED
          - entities.DamageReport.fields.assessed_fee_cents
        distinguishing_aspect: "Mode (a): assessed_fee_cents = min(repair_cost_cents=45000, deductible[SAIL]=30000 + severity_surcharge[MODERATE]=0) = 30000 — a >=3-input nested-min with a conditional severity branch where the tier deductible (not the repair cost) binds."
        test_recipe:
          setup:
            - "A SAIL member (deductible 30000) is ACTIVE and BASIC-certified; a reservation exists on a boat."
            - "A MODERATE damage report with repair_cost_cents=45000 is FILED against the trip."
          setup_api_calls:
            - { call: "POST /membership-tiers", payload: { tier_code: "SAIL", monthly_dues_cents: 25000, max_active_reservations: 2, reservations_per_week: 4, reciprocal_access_allowed: true, advance_booking_days_max: 14 }, as: ClubAdmin }
            - { call: "POST /docks", payload: { name: "Home", location_code: "HM", capacity: 10, is_reciprocal: false }, as: ClubAdmin, captures: { hd: "$.data.id" } }
            - { call: "POST /boats", payload: { dock_id: "${hd}", boat_type: "PONTOON" }, as: ClubAdmin, captures: { b1: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "A", email: "a@x.com", membership_tier: "SAIL", home_dock_id: "${hd}" }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /training-sessions", payload: { dock_id: "${hd}", session_type: "ORIENTATION", start_time: "2026-05-02T09:00:00Z", end_time: "2026-05-02T11:00:00Z", capacity: 5, instructor_name: "I" }, as: ClubAdmin, captures: { so: "$.data.id" } }
            - { call: "POST /enrollments", payload: { member_id: "${m}", session_id: "${so}" }, as: Member, as_user_id: "${m}", captures: { eo: "$.data.id" } }
            - { call: "POST /enrollments/${eo}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /training-sessions", payload: { dock_id: "${hd}", session_type: "BASIC_CERT", start_time: "2026-05-02T12:00:00Z", end_time: "2026-05-02T14:00:00Z", capacity: 5, instructor_name: "I" }, as: ClubAdmin, captures: { sb: "$.data.id" } }
            - { call: "POST /enrollments", payload: { member_id: "${m}", session_id: "${sb}" }, as: Member, as_user_id: "${m}", captures: { eb: "$.data.id" } }
            - { call: "POST /enrollments/${eb}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /reservations", payload: { member_id: "${m}", dock_id: "${hd}", boat_type: "PONTOON", start_time: "2026-05-05T10:00:00Z", end_time: "2026-05-05T12:00:00Z" }, as: Member, as_user_id: "${m}", captures: { r: "$.data.id" } }
            - { call: "POST /damage-reports", payload: { reservation_id: "${r}", boat_id: "${b1}", severity: "MODERATE", repair_cost_cents: 45000 }, as: DockStaff, captures: { dr: "$.data.id" } }
          trigger:
            - { call: "POST /damage-reports/${dr}/assess", payload: {}, as: DockStaff }
          assert:
            - "DamageReport.${dr}.assessed_fee_cents == 30000"
            - "exactly one Fee exists with member_id=${m} and fee_type=DAMAGE, and its amount_cents == 30000"

      - name: cf_dues_perline_tax_rounding_order
        grounds:
          - calculations.dues_invoice_total
          - entities.DuesInvoice.fields.fees_rolled_cents
        distinguishing_aspect: "Mode (b): two 3334-cent fees are taxed per line — round_half_up(3334*1.085)=3617 each, summed to fees_rolled_cents=7234; sum-then-round (round(6668*1.085)=7235) would differ by 1 cent, so the pinned per-line-then-sum order is observable."
        test_recipe:
          setup:
            - "A CRUISE member (base dues 15000) is ACTIVE and BASIC-certified with two boats."
            - "Two 3334-cent DAMAGE fees are ASSESSED before the invoice is issued."
          setup_api_calls:
            - { call: "POST /membership-tiers", payload: { tier_code: "CRUISE", monthly_dues_cents: 15000, max_active_reservations: 1, reservations_per_week: 2, reciprocal_access_allowed: false, advance_booking_days_max: 7 }, as: ClubAdmin }
            - { call: "POST /docks", payload: { name: "Home", location_code: "HM", capacity: 10, is_reciprocal: false }, as: ClubAdmin, captures: { hd: "$.data.id" } }
            - { call: "POST /boats", payload: { dock_id: "${hd}", boat_type: "PONTOON" }, as: ClubAdmin, captures: { b1: "$.data.id" } }
            - { call: "POST /boats", payload: { dock_id: "${hd}", boat_type: "PONTOON" }, as: ClubAdmin, captures: { b2: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "A", email: "a@x.com", membership_tier: "CRUISE", home_dock_id: "${hd}" }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /training-sessions", payload: { dock_id: "${hd}", session_type: "ORIENTATION", start_time: "2026-05-02T09:00:00Z", end_time: "2026-05-02T11:00:00Z", capacity: 5, instructor_name: "I" }, as: ClubAdmin, captures: { so: "$.data.id" } }
            - { call: "POST /enrollments", payload: { member_id: "${m}", session_id: "${so}" }, as: Member, as_user_id: "${m}", captures: { eo: "$.data.id" } }
            - { call: "POST /enrollments/${eo}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /training-sessions", payload: { dock_id: "${hd}", session_type: "BASIC_CERT", start_time: "2026-05-02T12:00:00Z", end_time: "2026-05-02T14:00:00Z", capacity: 5, instructor_name: "I" }, as: ClubAdmin, captures: { sb: "$.data.id" } }
            - { call: "POST /enrollments", payload: { member_id: "${m}", session_id: "${sb}" }, as: Member, as_user_id: "${m}", captures: { eb: "$.data.id" } }
            - { call: "POST /enrollments/${eb}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /reservations", payload: { member_id: "${m}", dock_id: "${hd}", boat_type: "PONTOON", start_time: "2026-05-05T10:00:00Z", end_time: "2026-05-05T12:00:00Z" }, as: Member, as_user_id: "${m}", captures: { r: "$.data.id" } }
            - { call: "POST /damage-reports", payload: { reservation_id: "${r}", boat_id: "${b1}", severity: "MINOR", repair_cost_cents: 3334 }, as: DockStaff, captures: { dr1: "$.data.id" } }
            - { call: "POST /damage-reports/${dr1}/assess", payload: {}, as: DockStaff }
            - { call: "POST /damage-reports", payload: { reservation_id: "${r}", boat_id: "${b2}", severity: "MINOR", repair_cost_cents: 3334 }, as: DockStaff, captures: { dr2: "$.data.id" } }
            - { call: "POST /damage-reports/${dr2}/assess", payload: {}, as: DockStaff }
            - { call: "GET /members/${m}", payload: {}, as: ClubAdmin, captures: { mv: "$.data.version" } }
          trigger:
            - { call: "POST /members/${m}/dues-invoices", payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", expected_member_version: "${mv}" }, as: ClubAdmin, captures: { inv: "$.data.id" } }
          assert:
            - "DuesInvoice.${inv}.fees_rolled_cents == 7234"
            - "DuesInvoice.${inv}.estimated_total_cents == 22234"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nl_boat_availability_cycle
        grounds:
          - state_machines.Boat.AVAILABLE_to_OUT
          - state_machines.Boat.OUT_to_CLEANING
          - state_machines.Boat.CLEANING_to_AVAILABLE
        distinguishing_aspect: "The Boat traverses AVAILABLE->OUT->CLEANING->AVAILABLE and returns to its start state (a cycle), with usage_count incremented to 1 — a non-linear shape on the Boat entity."
        test_recipe:
          setup:
            - "A SAIL member completes a full trip on one boat: confirm, checkout, return, then the boat is cleaned back to service."
          setup_api_calls:
            - { call: "POST /membership-tiers", payload: { tier_code: "SAIL", monthly_dues_cents: 25000, max_active_reservations: 2, reservations_per_week: 4, reciprocal_access_allowed: true, advance_booking_days_max: 14 }, as: ClubAdmin }
            - { call: "POST /docks", payload: { name: "Home", location_code: "HM", capacity: 10, is_reciprocal: false }, as: ClubAdmin, captures: { hd: "$.data.id" } }
            - { call: "POST /boats", payload: { dock_id: "${hd}", boat_type: "PONTOON" }, as: ClubAdmin, captures: { b1: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "A", email: "a@x.com", membership_tier: "SAIL", home_dock_id: "${hd}" }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /training-sessions", payload: { dock_id: "${hd}", session_type: "ORIENTATION", start_time: "2026-05-02T09:00:00Z", end_time: "2026-05-02T11:00:00Z", capacity: 5, instructor_name: "I" }, as: ClubAdmin, captures: { so: "$.data.id" } }
            - { call: "POST /enrollments", payload: { member_id: "${m}", session_id: "${so}" }, as: Member, as_user_id: "${m}", captures: { eo: "$.data.id" } }
            - { call: "POST /enrollments/${eo}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /training-sessions", payload: { dock_id: "${hd}", session_type: "BASIC_CERT", start_time: "2026-05-02T12:00:00Z", end_time: "2026-05-02T14:00:00Z", capacity: 5, instructor_name: "I" }, as: ClubAdmin, captures: { sb: "$.data.id" } }
            - { call: "POST /enrollments", payload: { member_id: "${m}", session_id: "${sb}" }, as: Member, as_user_id: "${m}", captures: { eb: "$.data.id" } }
            - { call: "POST /enrollments/${eb}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /reservations", payload: { member_id: "${m}", dock_id: "${hd}", boat_type: "PONTOON", start_time: "2026-05-05T10:00:00Z", end_time: "2026-05-05T12:00:00Z" }, as: Member, as_user_id: "${m}", captures: { r: "$.data.id" } }
            - { call: "POST /reservations/${r}/confirm", payload: {}, as: Member, as_user_id: "${m}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T10:00:00Z" }, as: ClubAdmin }
            - { call: "POST /reservations/${r}/checkout", payload: { fuel_at_checkout: 90 }, as: Member, as_user_id: "${m}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T12:00:00Z" }, as: ClubAdmin }
            - { call: "POST /reservations/${r}/return", payload: { fuel_at_return: 80 }, as: Member, as_user_id: "${m}" }
          trigger:
            - { call: "POST /boats/${b1}/clean-complete", payload: {}, as: DockStaff }
          assert:
            - "Boat.${b1}.status == AVAILABLE"
            - "Boat.${b1}.usage_count == 1"
            - "Boat.${b1}.needs_cleaning == false"

      - name: nl_member_active_suspend_reinstate_cycle
        grounds:
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.Member.SUSPENDED_to_ACTIVE
          - entities.Member.fields.no_show_strikes
        distinguishing_aspect: "The Member traverses ACTIVE->SUSPENDED->ACTIVE and returns to its start state with no_show_strikes reset to 0 — a cycle on the Member entity, a different entity from the Boat cycle."
        test_recipe:
          setup:
            - "A SAIL member is ACTIVE and BASIC-certified with no outstanding fees, then administratively suspended."
          setup_api_calls:
            - { call: "POST /membership-tiers", payload: { tier_code: "SAIL", monthly_dues_cents: 25000, max_active_reservations: 2, reservations_per_week: 4, reciprocal_access_allowed: true, advance_booking_days_max: 14 }, as: ClubAdmin }
            - { call: "POST /docks", payload: { name: "Home", location_code: "HM", capacity: 10, is_reciprocal: false }, as: ClubAdmin, captures: { hd: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "A", email: "a@x.com", membership_tier: "SAIL", home_dock_id: "${hd}" }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /training-sessions", payload: { dock_id: "${hd}", session_type: "ORIENTATION", start_time: "2026-05-02T09:00:00Z", end_time: "2026-05-02T11:00:00Z", capacity: 5, instructor_name: "I" }, as: ClubAdmin, captures: { so: "$.data.id" } }
            - { call: "POST /enrollments", payload: { member_id: "${m}", session_id: "${so}" }, as: Member, as_user_id: "${m}", captures: { eo: "$.data.id" } }
            - { call: "POST /enrollments/${eo}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /members/${m}/suspend", payload: { reason: "for-cause" }, as: ClubAdmin }
          trigger:
            - { call: "POST /members/${m}/reinstate", payload: {}, as: ClubAdmin }
          assert:
            - "Member.${m}.status == ACTIVE"
            - "Member.${m}.no_show_strikes == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tc_noshow_suspend_cancel_release_depth4
        grounds:
          - state_machines.Reservation.CONFIRMED_to_NO_SHOW
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
        distinguishing_aspect: "Depth-4 chain from the no-show sweep: R3 CONFIRMED->NO_SHOW mutates Member (strike 3 -> SUSPENDED), which itself cancels the member's other CONFIRMED reservation R4, which itself releases R4's boat b1 back to AVAILABLE; each hop is caused by the prior hop, triggered by run-no-show-sweep."
        test_recipe:
          setup:
            - "An UNLIMITED member has already accrued 2 no-show strikes from R1 and R2."
            - "R3 (start 05-05) and R4 (start 05-06) are both CONFIRMED on the same boat b1; the clock is set just past R3's grace but before R4's start."
          setup_api_calls:
            - { call: "POST /membership-tiers", payload: { tier_code: "UNLIMITED", monthly_dues_cents: 40000, max_active_reservations: 3, reservations_per_week: 7, reciprocal_access_allowed: true, advance_booking_days_max: 30 }, as: ClubAdmin }
            - { call: "POST /docks", payload: { name: "Home", location_code: "HM", capacity: 10, is_reciprocal: false }, as: ClubAdmin, captures: { hd: "$.data.id" } }
            - { call: "POST /boats", payload: { dock_id: "${hd}", boat_type: "PONTOON" }, as: ClubAdmin, captures: { b1: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "A", email: "a@x.com", membership_tier: "UNLIMITED", home_dock_id: "${hd}" }, as: ClubAdmin, captures: { m: "$.data.id" } }
