              payload: { carrier_name: "Kite Lines Ltd" }
              as: ClaimsAdjuster
              as_user_id: "adjuster-2"
              captures: { subro_status: $.data.subrogation_status }
          trigger:
            - call: "POST /claim-files/${claim_id}/subrogation-recovery"
              payload: { recovered_amount: 141875.01 }
              as: ClaimsAdjuster
              as_user_id: "adjuster-2"
              captures: { err_recovery: $.data.error_id }
            - call: "POST /claim-files/${claim_id}/subrogation-recovery"
              payload: { recovered_amount: 141875.00 }
              as: ClaimsAdjuster
              as_user_id: "adjuster-2"
              captures: { final_subro: $.data.subrogation_status, net_loss: $.data.net_loss_amount }
            - call: "GET /claim-files/${claim_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adjuster-2"
          assert:
            - "${adjusted} == 141875.00 and ${settled} == 141875.00 and deductible_applied_amount == 2500.00"
            - "${subro_status} == \"NOTICE_SENT\" with subrogation_notice_at == \"2026-08-01T00:00:00Z\" and time_bar_at == \"2027-09-05T00:00:00Z\""
            - "${err_recovery} == \"ERR_RECOVERY_EXCEEDS_SETTLEMENT\" with HTTP 422 — one cent over the settled amount, and still 2499.99 under the claimed 144375.00"
            - "after the refusal subrogation_status is still \"NOTICE_SENT\", recovered_amount 0.00 and net_loss_amount 141875.00"
            - "${final_subro} == \"RECOVERED\" and ${net_loss} == 0.00 with recovered_amount 141875.00"
            - "ClaimFile.${claim_id}.status stayed \"SETTLED\" — the subrogation axis moved alone"

      - name: vessel_block_versus_vessel_accumulation_priority_corner
        claim_type: priority_conflict
        grounds:
          - validations.priority_11
          - validations.priority_22
        distinguishing_aspect: |
          A certificate on a BLOCKED over-age hull that would ALSO breach the
          vessel accumulation limit must return the priority-11 hull error, not
          the priority-22 exposure error.
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / vessel_state_beats_vessel_accumulation_at_issue"
          rationale: |
            The §1.8 instance already drives both rules into a single issue call
            with the hull blocked and the ledger over the limit and asserts
            ERR_VESSEL_BLOCKED, then relaxes each condition in turn to show the
            other error surfacing. A §1.9 duplicate would exercise the same
            two priorities on the same endpoint with the same fixture.

      - name: packaging_warranty_versus_commodity_share_priority_corner
        claim_type: priority_conflict
        grounds:
          - validations.priority_12
          - validations.priority_18
        distinguishing_aspect: |
          A creation request whose packaging_code contradicts the commodity class
          AND whose insured value exceeds the class's conveyance share must
          return the priority-12 warranty error.
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / packaging_warranty_beats_commodity_share_at_certificate_creation"
          rationale: |
            The §1.8 instance already violates both rules in one POST /certificates
            and asserts ERR_PACKAGING_WARRANTY_BREACH, plus the two single-fault
            control legs. Repeating it here would add no new observation about the
            creation-time ordering.

      - name: port_accumulation_exact_limit_boundary_corner
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_23
          - errors.ERR_PORT_ACCUMULATION_EXCEEDED
        distinguishing_aspect: |
          Discharge-port exposure landing exactly on port_accumulation_limit_amount
          must be accepted (<=, not <) while one cent more is refused.
        excluded_because:
          difficulty_instance: "boundary_precision_check / port_accumulation_exact_limit_accepted_one_cent_over_rejected"
          rationale: |
            The §1.8 instance already issues a certificate that brings the port
            bucket to exactly the limit, then a second whose extra cent is
            refused, over the overlapping half-open storage windows. The §1.9
            claim is the same comparison at the same boundary.

      - name: certificate_issue_under_suspended_policy_corner
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_8_policy_not_active
          - errors.ERR_POLICY_NOT_ACTIVE
        distinguishing_aspect: |
          A DRAFT certificate's issuability depends on the CURRENT status of a
          different entity, its OpenPolicy, so suspending the policy after the
          certificate was created must block the issue and reinstating must unblock it.
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / certificate_issue_depends_on_open_policy_status"
          rationale: |
            The §1.8 instance already walks the policy through ACTIVE ->
            SUSPENDED -> ACTIVE around one unchanged issue request and asserts
            ERR_POLICY_NOT_ACTIVE in the middle and ISSUED at the end, including
            the version bookkeeping across the suspension.

      - name: general_average_pending_settlement_block_corner
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_13
          - errors.ERR_GA_ADJUSTMENT_PENDING
        distinguishing_aspect: |
          A GENERAL_AVERAGE claim may only be settled once the linked
          GeneralAverageEvent has reached ADJUSTED, so the same settle call
          fails and then succeeds with no change to the claim itself.
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / claim_settlement_depends_on_general_average_event_status"
          rationale: |
            The §1.8 instance already attempts the settlement while the event is
            SECURITY_COLLECTING, asserts ERR_GA_ADJUSTMENT_PENDING, finalizes the
            adjustment and re-runs the identical settle to SETTLED. The §1.9
            claim would re-test the same guard on the same endpoint.

  - section: endpoints
    instances:
      - name: accumulation_ledger_rows_expose_three_scopes_with_distinct_exposure_windows
        claim_type: computed_read
        grounds:
          - endpoints.GET /accumulation-entries
          - endpoints.GET /accumulation-entries/{id}
          - entities.AccumulationEntry
          - calculations.transit_termination_instant
        distinguishing_aspect: |
          One issue call writes three ledger rows whose windows are NOT the same:
          the VESSEL and LOADING_PORT rows occupy [attachment_at, discharge_date)
          while the DISCHARGE_PORT row occupies [discharge_date,
          transit_termination_at) — the storage window that the port accumulation
          rule overlaps. The filters must slice that set by scope, by vessel, by
          port and by status, and every row's amount must equal the certificate's
          insured_value rather than its premium.
        test_recipe:
          setup:
            - "one certificate insured_value 1155000.00, sailing 2026-08-10, discharge 2026-09-05, discharge port storage_free_days 30"
            - "pinned transit_termination_at 2026-10-05T00:00:00Z"
          setup_api_calls:
            - call: "POST /ports"
              payload: { unlocode: "SGSIN", name: "Singapore", country_code: "SG", port_accumulation_limit_amount: 8000000, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: Underwriter
