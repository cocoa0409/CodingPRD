              as_user_id: "agent-77"
            - call: "POST /logistics-jobs"
              payload: { lease_id: "${la_id}", job_type: "DELIVERY_INSTALL", origin_branch_id: "${b1_id}", scheduled_date: "2026-10-01", mileage_miles: 40, crew_hours: 4.0 }
              as: BranchOps
