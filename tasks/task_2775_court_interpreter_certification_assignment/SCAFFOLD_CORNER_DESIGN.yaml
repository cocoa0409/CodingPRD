        distinguishing_aspect: "Shared operations are not a hierarchy loophole: the same endpoint must accept two or three specific roles and nothing more, and POST /complaints is the only three-role write in the scaffold. Completing an assignment is the one service transition that both the interpreter and the coordinator may perform, which is what lets a coordinator close out a hearing the interpreter never reports on."
