              captures: { cont_x_id: $.data.id }
            - call: "POST /merchandise/containers/${cont_x_id}/depart"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_x_id}/arrive"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers"
              payload: { vendor_id: "${vendor_y_id}", container_number: "HLXU1234567", port_code: "LAX", dc_code: "DC-ATL", total_freight_cents: 0 }
              as: ImportCoordinator
              captures: { cont_y_id: $.data.id }
