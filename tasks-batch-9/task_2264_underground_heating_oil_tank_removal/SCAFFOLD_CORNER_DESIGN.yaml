      - name: permit_issued_and_revoked_side_effect_sets
        claim_type: side_effect_execution
        grounds:
          - state_machines.Permit.SUBMITTED_to_ISSUED
          - state_machines.Permit.ISSUED_to_REVOKED
        excluded_because:
          difficulty_instance: non_linear_state_machine / permit_decision_fork_branches_carry_disjoint_side_effect_sets
          rationale: "That §1.8 instance asserts notice_effective_at, expires_at, the project advance to PERMITTED and the full REVOKED cascade (work order ABORTED, billing WRITTEN_OFF, PERMIT_REVOKED blocker)."

      - name: claim_review_cycle_and_info_request_ceiling
        claim_type: valid_transition
        grounds:
          - state_machines.TrustFundClaim.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.TrustFundClaim.INFO_REQUESTED_to_SUBMITTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / trust_fund_claim_review_cycle_bounded_by_info_request_limit
          rationale: "That §1.8 instance walks the cycle twice and asserts the bounded loop, so the valid-transition and cycle-shape claims are already covered."

      - name: parallel_billing_dimension_independence
        claim_type: valid_transition
        grounds:
          - state_machines.DecommissionWorkOrder.billing_status.BILLABLE_to_INVOICED
        excluded_because:
          difficulty_instance: non_linear_state_machine / work_order_field_and_billing_dimensions_evolve_independently
          rationale: "That §1.8 instance asserts the billing dimension advancing while field_status stays terminal, covering the parallel-shape claim."

      - name: compensating_rescission_reverses_the_closure_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines.NFALetter.ISSUED_to_RESCINDED
          - state_machines.TankProject.CLOSED_NFA_to_REMEDIATION_ACTIVE
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_depth_four_from_nfa_rescission_to_claim_and_reserve_revert
          rationale: "That §1.8 instance asserts every compensation side effect of the rescission, including the claim revert and the reserve re-derivation."

