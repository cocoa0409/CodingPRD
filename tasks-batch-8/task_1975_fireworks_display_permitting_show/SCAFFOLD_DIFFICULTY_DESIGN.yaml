            - { call: "GET /pyro/magazines/${mag}", payload: {}, as: Operator, as_user_id: "${op}", captures: { lbs1: $.data.current_new_lbs } }
            - { call: "POST /pyro/batches/${b1}/movements", payload: { movement_type: "RETURN", quantity: 20, display_event_id: "${ev}" }, as: Operator, as_user_id: "${op}" }
            - { call: "GET /pyro/magazines/${mag}", payload: {}, as: Operator, as_user_id: "${op}", captures: { lbs2: $.data.current_new_lbs } }
          assert:
            - "initial current_new_lbs == 25.00"
            - "after CHECK_OUT 20: == 15.00"
            - "after compensating RETURN 20: == 25.00 exactly (no drift)"

      - name: batch_unit_accountability_partition
        grounds:
          - calculations.c_batch_quantities
          - entities.ProductBatch.fields.qty_at_magazine
          - entities.ProductBatch.fields.qty_at_show
          - entities.ProductBatch.fields.qty_expended
        distinguishing_aspect: |
          Conserved quantity: batch UNIT COUNT partition (quantity_units ==
          qty_at_magazine + qty_at_show + qty_expended), a different conserved quantity
          than checkout_return_restores_magazine_mass's explosive lbs. Across a
          CHECK_OUT(20) / EXPEND(12) / RETURN(8) sequence the partition must hold at
          every step: (30,20,0) -> (30,8,12) -> (38,0,12), always summing to 50.
        test_recipe:
          setup:
