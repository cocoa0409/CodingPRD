  # ===========================================================================
  - section: state_machines
    instances:

      - name: new_ill_request_starts_in_submitted_and_auto_advances_to_sourcing_in_the_same_response
        claim_type: initial_state
        grounds:
          - state_machines.IllRequest.initial_state
          - state_machines.IllRequest.SUBMITTED_to_SOURCING
          - consistency_model
        distinguishing_aspect: "SUBMITTED is the declared initial state but the intake transition fires inside the same request, so the 201 body already reads SOURCING with attempt_count 0 — no separate call is needed to advance it."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Patron P-9010 with default caps; Partner NORTHU on a single-entry LOAN rota quoting 2000 / 4; BibItem with local_holding_status NONE and licensed_access_status NONE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons"
              payload: { external_id: "P-9010", full_name: "Gil Reader", email: "gil@u.edu", patron_type: "GRAD", department: "GEOG" }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { patron_id: $.data.id }
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { northu_id: $.data.id }
            - call: "POST /ill/rotas"
              payload: { name: "Monograph rota", material_type: "LOAN", selection_policy: "LANDED_COST", max_attempts: 3, auto_escalate_pod: false, offer_response_hours: 48 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_id: $.data.id, rota_v0: $.data.version }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_id}", expected_rota_version: "${rota_v0}", partner_id: "${northu_id}", manual_rank: 1, quoted_fee_cents: 2000, quoted_turnaround_days: 4, is_enabled: true }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/bib-items"
              payload: { title: "Glacial Landforms", item_type: "BOOK", publication_year: 2013, isbn: "978-0-000-00030-1", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 9000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_id: $.data.id }
          trigger:
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_id}", rota_id: "${rota_id}", service_type: "LOAN", delivery_mode: "PICKUP", needed_by: "2026-08-09T00:00:00Z", max_supply_fee_cents: 5000 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { req_id: $.data.id, req_status: $.data.status, attempts: $.data.attempt_count }
          assert:
            - "HTTP 201 and ${req_status} == SOURCING — the response of the creating call already shows the advanced state"
            - "${attempts} == 0 and IllRequest.${req_id}.unfilled_reason == NONE"
            - "IllRequest.${req_id}.committed_partner_id is null and committed_fee_cents == 0"
            - "IllRequest.${req_id}.copyright_required == false — a BOOK LOAN needs no clearance"
            - "GET /ill/requests/${req_id}/notifications returns total_count == 1 with kind REQUEST_SUBMITTED"
            - "Patron.${patron_id}.open_request_count == 1"

      - name: pod_approval_then_receipt_fills_the_request_by_purchase_and_shelves_the_item
        claim_type: valid_transition
        grounds:
          - state_machines.PurchaseOnDemandOrder.PROPOSED_to_APPROVED
          - state_machines.PurchaseOnDemandOrder.APPROVED_to_RECEIVED
          - state_machines.IllRequest.ESCALATED_POD_to_FILLED_BY_PURCHASE
          - entities.BibItem.fields.local_holding_status
        distinguishing_aspect: "The PROPOSED → APPROVED → RECEIVED path walks the BibItem from NONE through ON_ORDER to HELD_AVAILABLE and lands the request in the terminal FILLED_BY_PURCHASE, with a POD_APPROVED notification on approval and a PURCHASE_RECEIVED notification on receipt."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Patron P-9011; Partner NORTHU on a LOAN rota with max_attempts 1 and auto_escalate_pod false."
            - "One request taken in, sourced once and declined for NOT_HELD, so it is back in SOURCING with attempt_count 1 == max_attempts."
            - "ill-staff-01 escalates it to purchase-on-demand, so PurchaseOnDemandOrder.escalated_by_user_id is ill-staff-01 and acq-01 is free to decide it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons"
              payload: { external_id: "P-9011", full_name: "Hal Reader", email: "hal@u.edu", patron_type: "FACULTY", department: "ECON" }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { patron_id: $.data.id }
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { northu_id: $.data.id }
            - call: "POST /ill/rotas"
              payload: { name: "Single attempt rota", material_type: "LOAN", selection_policy: "LANDED_COST", max_attempts: 1, auto_escalate_pod: false, offer_response_hours: 48 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_id: $.data.id, rota_v0: $.data.version }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_id}", expected_rota_version: "${rota_v0}", partner_id: "${northu_id}", manual_rank: 1, quoted_fee_cents: 2000, quoted_turnaround_days: 4, is_enabled: true }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/bib-items"
              payload: { title: "Regional Growth Accounting", item_type: "BOOK", publication_year: 2022, isbn: "978-0-000-00031-8", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 11000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_id: $.data.id }
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_id}", rota_id: "${rota_id}", service_type: "LOAN", delivery_mode: "PICKUP", needed_by: "2026-08-09T00:00:00Z", max_supply_fee_cents: 5000 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { req_id: $.data.id }
            - call: "POST /ill/requests/${req_id}/source"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { offer_id: $.data.id }
            - call: "POST /ill/supply-offers/${offer_id}/decline"
              payload: { decline_reason: "NOT_HELD" }
              as: PartnerAgent
              as_user_id: "${northu_id}"
            - call: "POST /ill/requests/${req_id}/escalate"
              payload: { vendor: "AcmeBooks" }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { pod_id: $.data.id, pod_status_0: $.data.status, pod_price: $.data.list_price_cents, escalator: $.data.escalated_by_user_id }
          trigger:
            - call: "POST /ill/pod-orders/${pod_id}/decision"
              payload: { decision: "APPROVE", decision_note: "Cheaper to buy than to borrow twice" }
              as: AcquisitionsLibrarian
              as_user_id: "acq-01"
              captures: { pod_status_1: $.data.status, decider: $.data.decided_by_user_id, decided_at: $.data.decided_at }
            - call: "GET /ill/bib-items/${bib_id}"
              payload: {}
              as: AcquisitionsLibrarian
              as_user_id: "acq-01"
              captures: { holding_mid: $.data.local_holding_status }
            - call: "POST /ill/pod-orders/${pod_id}/receive"
              payload: {}
              as: AcquisitionsLibrarian
              as_user_id: "acq-01"
              captures: { pod_status_2: $.data.status, received_at: $.data.received_at }
          assert:
            - "${pod_status_0} == PROPOSED, ${pod_price} == 11000 (copied from BibItem.list_price_cents) and ${escalator} == ill-staff-01"
            - "${pod_status_1} == APPROVED, ${decider} == acq-01 and ${decided_at} == 2026-08-01T00:00:00Z"
            - "${holding_mid} == ON_ORDER — approval marks the item on order, it does not shelve it"
            - "IllRequest.${req_id}.status == ESCALATED_POD after the approval — approval does not by itself close the request"
            - "${pod_status_2} == RECEIVED and ${received_at} == 2026-08-01T00:00:00Z"
            - "GET /ill/bib-items/${bib_id} now reports local_holding_status HELD_AVAILABLE"
            - "IllRequest.${req_id}.status == FILLED_BY_PURCHASE with closed_at == 2026-08-01T00:00:00Z"
            - "GET /ill/requests/${req_id}/notifications returns kinds REQUEST_SUBMITTED, POD_APPROVED and PURCHASE_RECEIVED"
            - "Patron.${patron_id}.open_request_count == 0"

