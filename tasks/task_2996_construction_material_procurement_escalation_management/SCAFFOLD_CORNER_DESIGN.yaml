- section: cross_cutting_complexity_layers
  instances:
  - name: optimistic_concurrency_a_stale_project_token_is_412_and_frees_its_po_number
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[commitment-create-stale-project]
    - validations[priority=50]
    - errors[ERR_STALE_PROJECT_VERSION]
    distinguishing_aspect: 'The OCC token is the shared project, not the package: buying out a DIFFERENT package advances Project.version and invalidates a token read before it, and because the refusal is total the po_number it carried is still free for the retry.'
    test_recipe:
      setup:
      - A project with two packages (steel 1200000.00 and misc metals 900000.00), each with one OPEN quote
      - The client read Project.version == 1, then a PO was issued against the misc-metals package, taking the project to version 2
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-02, description: Miscellaneous metals package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '900000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 60, delivery_transit_days: 29}
        as: BuyoutManager
        captures: {pkg2_id: $.data.id}
      - call: POST /procurement/suppliers
        payload: {legal_name: Ironworks Fabricators LLC, country_of_origin: US, declared_tariff_rate_pct: '0.00'}
        as: BuyoutManager
        captures: {sup_id: $.data.id}
      - call: POST /procurement/quotes
        payload: {material_package_id: '${pkg_id}', supplier_id: '${sup_id}', base_price: '1150000.00', received_at: '2026-08-01T00:00:00.000Z', price_hold_days: 45}
        as: SupplierRep
        as_user_id: ${sup_id}
        captures: {q_id: $.data.id}
      - call: POST /procurement/quotes
        payload: {material_package_id: '${pkg2_id}', supplier_id: '${sup_id}', base_price: '880000.00', received_at: '2026-08-01T00:00:00.000Z', price_hold_days: 45}
        as: SupplierRep
        as_user_id: ${sup_id}
        captures: {q2_id: $.data.id}
      - call: GET /procurement/projects/${proj_id}
        payload: {}
        as: BuyoutManager
        captures: {pv1: $.data.version}
      - call: POST /procurement/purchase-commitments
        payload: {quote_id: '${q2_id}', po_number: PO-2996-0002, expected_project_version: '${pv1}', is_early_buyout: false}
        as: BuyoutManager
        captures: {pc2_id: $.data.id}
      trigger:
      - call: POST /procurement/purchase-commitments
        payload: {quote_id: '${q_id}', po_number: PO-2996-0001, expected_project_version: '${pv1}', is_early_buyout: false}
        as: BuyoutManager
        captures: {err: $.data.error_id}
      - call: GET /procurement/projects/${proj_id}
        payload: {}
        as: BuyoutManager
      - call: GET /procurement/projects/${proj_id}
        payload: {}
        as: BuyoutManager
        captures: {pv2: $.data.version}
      - call: POST /procurement/purchase-commitments
        payload: {quote_id: '${q_id}', po_number: PO-2996-0001, expected_project_version: '${pv2}', is_early_buyout: false}
