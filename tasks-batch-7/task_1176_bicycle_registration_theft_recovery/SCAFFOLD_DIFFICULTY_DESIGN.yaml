            - { call: "POST /registry/recovery-intakes", payload: { serial_number_raw: "THR500", primary_color: "Green", found_at: "2027-05-10T00:00:00Z", found_location: "Lot", appraised_value_cents: 50000 }, as: Partner, as_user_id: "${org_id}", captures: { iy_id: $.data.id } }
