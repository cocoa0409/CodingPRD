            - { call: "GET /senior-benefits/usage-transactions?merchant_id=${m_id}&limit=2&offset=0", as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "GET /senior-benefits/usage-transactions?merchant_id=${m_id}&limit=2&offset=2", as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "GET /senior-benefits/usage-transactions?merchant_id=${m_id}&status=FLAGGED", as: MerchantOperator, as_user_id: "${m_id}" }
          assert:
            - "page 1 (limit 2, offset 0): 2 items, total_count == 3, has_more == true"
            - "page 2 (limit 2, offset 2): 1 item, total_count == 3, has_more == false"
            - "status=FLAGGED filter: exactly 1 item and it is ${t1}"

      - name: response_envelope_success_and_error_shape
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Success responses carry meta.api_request_id, meta.api_request_timestamp, response_type 'object', and data; error responses carry response_type 'error' and data.error_id + data.message."
        test_recipe:
          setup: ["one merchant exists"]
          setup_api_calls:
            - { call: "POST /senior-benefits/merchants", payload: { name: "Envelope Eats", reimbursement_rate_pct: 25, monthly_reimbursement_cap_cents: 50000 }, as: ProgramAdministrator, captures: { m_id: $.data.id } }
          trigger:
            - { call: "GET /senior-benefits/merchants/${m_id}", as: ProgramAdministrator }
            - { call: "GET /senior-benefits/merchants/00000000-0000-4000-8000-000000000000", as: ProgramAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "success: meta.api_request_id and meta.api_request_timestamp present; response_type == 'object'; data holds the merchant"
            - "failure: response_type == 'error'; data.error_id == ERR_MERCHANT_NOT_FOUND and data.message present"

