  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: claim_payment_cascade_to_predetermination_revalidation_depth3
        grounds:
          - state_machines.Claim.adjudication=PENDING_to_adjudication=PAID
          - entities.PatientCoverage.fields.annual_benefit_used_cents
          - entities.PatientCoverage.fields.annual_max_reached
          - state_machines.Predetermination.APPROVED_to_REQUIRES_REVALIDATION
        distinguishing_aspect: |
          Depth-3 chain, each link caused by the prior: claim adjudicate (A) debits
          coverage.annual_benefit_used (B); B crossing the ceiling flips
          annual_max_reached true (C); C flips every APPROVED Predetermination on
          that coverage to REQUIRES_REVALIDATION (D). Not a fan-out — D is caused
          by C, not by the adjudicate call.
        test_recipe:
          setup:
            - "Coverage with an APPROVED predetermination on item X."
            - "A separate BASIC claim fee=130000 adjudicates to exactly the annual max (100000)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat Casc", date_of_birth: "1982-09-09" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Casc", provider_type: "DENTIST", npi: "1000000007" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /operatories"
              payload: { room_name: "OP-6" }
              as: FrontDesk
              captures: { op_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { carrier_name: "DeltaDent", annual_maximum_cents: 100000, deductible_cents: 5000, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, major_waiting_period_months: 0, frequency_limit_months: 0 }
              as: BillingSpecialist
              captures: { plan_id: $.data.id }
            - call: "POST /patient-coverages"
              payload: { patient_id: "${p_id}", insurance_plan_id: "${plan_id}", coverage_start_date: "2025-01-01", benefit_year_start_date: "2026-01-01" }
              as: BillingSpecialist
              captures: { cov_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}" }
              as: Clinician
              captures: { tp_id: $.data.id }
            # item X: a MAJOR with an approved predetermination
            - call: "POST /treatment-plans/${tp_id}/items"
              payload: { cdt_code: "D2950", category: "MAJOR", fee_cents: 90000, phase_number: 1, tooth_number: 30, requires_predetermination: true }
              as: Clinician
              captures: { item_x_id: $.data.id }
            - call: "POST /predeterminations"
