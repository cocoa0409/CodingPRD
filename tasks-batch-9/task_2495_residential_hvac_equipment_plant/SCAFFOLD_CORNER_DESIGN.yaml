  - section: errors
    instances:
      - name: c_unknown_role_header_returns_unauthorized
        claim_type: violation_to_error
        grounds:
          - validations.role-authorization
          - errors.ERR_UNAUTHORIZED
          - roles
        distinguishing_aspect: "An X-Role value that is not one of the eleven declared roles is rejected with 403 ERR_UNAUTHORIZED, exactly like a recognized-but-unpermitted role - the API never treats an unknown role as an anonymous reader."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z with one ACTIVE A1 program and no platforms."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
