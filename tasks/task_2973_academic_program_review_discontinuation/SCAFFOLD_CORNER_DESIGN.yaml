  - section: validations
    instances:
      - name: duplicate_program_code_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors[ERR_DUPLICATE_PROGRAM_CODE]
        distinguishing_aspect: |
          Uniqueness is on code alone and is global, not scoped to the
          department: a second HIST-BA in a different department with a
          different name is still refused, and the refusal leaves exactly one
          row behind.
        test_recipe:
          setup:
            - "One program HIST-BA in department HIST."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History of Art BA", degree_level: "GRADUATE", department_code: "ARTH" }
              as: ReviewCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns 409 with data.error_id == ERR_DUPLICATE_PROGRAM_CODE"
            - "GET /provost/academic-programs returns total_count == 1 and the surviving row is ${prog_id} with name History BA and department_code HIST"
            - "AcademicProgram.${prog_id}.version == 1 — the refused create did not touch the existing row"

      - name: duplicate_term_snapshot_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_DUPLICATE_TERM_SNAPSHOT]
          - entities.ViabilityMetricSnapshot.fields.term_index
        distinguishing_aspect: |
          term_index is unique per program, not globally, and the refused
          re-post must not disturb the rollups the first snapshot produced —
          which is the only way to tell a rejected duplicate from a silently
          applied overwrite.
        test_recipe:
          setup:
            - "Two programs HIST-BA and PHIL-BA. HIST-BA already has a term_index 1 snapshot (300 credit hours, 12000000 cents)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs"
              payload: { code: "PHIL-BA", name: "Philosophy BA", degree_level: "UNDERGRADUATE", department_code: "PHIL" }
              as: ReviewCoordinator
              captures: { other_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
          trigger:
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025FB", term_index: 1, enrollment_headcount: 99, credit_hours: 900, direct_cost_cents: 1, completions_count: 99, market_demand_index: 99 }
              as: ReviewCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /provost/academic-programs/${other_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
          assert:
            - "the first trigger returns 409 with data.error_id == ERR_DUPLICATE_TERM_SNAPSHOT"
            - "AcademicProgram.${prog_id}.snapshot_count == 1, cost_per_credit_hour_rolling_cents == 40000, composite_score == 39.99 — none of the 99s were applied"
            - "the second trigger returns 201: the same term_index on a DIFFERENT program is legal, so uniqueness is scoped per program"
            - "AcademicProgram.${other_id}.snapshot_count == 1 and cost_per_credit_hour_rolling_cents == 40000"

      - name: second_self_study_on_one_cycle_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors[ERR_SELF_STUDY_ALREADY_EXISTS]
        distinguishing_aspect: |
          The one-self-study-per-cycle rule is checked while the first study is
          still DRAFT, so it is not a state check in disguise; the second
          attempt is refused even though the first has been neither submitted
          nor accepted.
        test_recipe:
          setup:
            - "Program HIST-BA with an open cycle carrying one DRAFT self-study."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
