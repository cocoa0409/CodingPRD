              as: SelectionManager
              captures: { a2_id: $.data.id }
            - call: "POST /corps/applications"
              payload: { applicant_id: "${a1_id}", preferred_region_id: "${r_id}", subject_area: "ENGLISH", grade_preference: "HIGH" }
              as: SelectionManager
              captures: { app1_id: $.data.id }
            - call: "POST /corps/applications"
              payload: { applicant_id: "${a2_id}", preferred_region_id: "${r_id}", subject_area: "ENGLISH", grade_preference: "HIGH" }
              as: SelectionManager
              captures: { app2_id: $.data.id }
            - call: "POST /corps/applications/${app1_id}/review"
              payload: { verified_gpa: 4.0 }
              as: SelectionManager
              as_user_id: "sm_reviewer_1"
            - call: "POST /corps/applications/${app2_id}/review"
              payload: { verified_gpa: 3.99 }
              as: SelectionManager
              as_user_id: "sm_reviewer_2"
          trigger:
            - call: "POST /corps/applications/${app1_id}/decision"
              payload: { decision: "SELECT" }
              as: SelectionManager
              as_user_id: "sm_decider_1"
              captures: { s1: $.data.final_selection_score, st1: $.data.status }
            - call: "POST /corps/applications/${app2_id}/decision"
              payload: { decision: "SELECT" }
              as: SelectionManager
              as_user_id: "sm_decider_2"
              captures: { s2: $.data.final_selection_score, err2: $.data.error_id }
          assert:
            - "Application.${app1_id}.final_selection_score == 85.00 and Application.${app1_id}.status == SELECTED"
            - "Application.${app2_id}.final_selection_score == 84.96 and the response data.error_id == ERR_SCORE_BELOW_THRESHOLD"
            - "85.00 clears the band while 84.96 does not, so the gate is >= 85.00 and not > 85.00"
      - name: deadline_band_boundary_at_14_days
        grounds:
