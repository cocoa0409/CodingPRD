          - entities.Intake.fields.custody_state
          - entities.Intake.fields.compliance_state
        distinguishing_aspect: |
          Non-linearity by PARALLEL dimensions on one row: the manifest submission advances
          compliance_state MANIFEST_DRAFT -> MANIFEST_SUBMITTED while custody_state stays
          DISCHARGED, and the subsequent packaging advances custody_state DISCHARGED ->
          PACKAGED while compliance_state stays MANIFEST_SUBMITTED, so neither dimension is a
          function of the other and the combined state (PACKAGED, MANIFEST_SUBMITTED) is
          reachable in two different call orders.
