              captures: { rep_st: $.data.status }
          assert:
            - "err == ERR_EVIDENCE_REQUIRED (0 documents rejected)"
            - "rep_st == PENDING_REVIEW (1 document crosses the boundary)"

  # ==========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: intake_requires_transaction_posted
        grounds:
          - state_machines.CardTransaction.POSTED_to_DISPUTED
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          DisputeCase x CardTransaction pair: intake is gated on the
          transaction's state — a transaction already SETTLED by a prior
          withdrawn dispute rejects new intake with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Old account; VISA ECOMMERCE txn 8000 posted 2026-07-01; dispute received 2026-08-03 then withdrawn (transaction SETTLED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Cross A", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { xaacct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${xaacct}", merchant_name: "XA", amount_cents: 8000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { xatx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${xatx}", error_type: "INCORRECT_AMOUNT", claim_amount_cents: 8000, claimed_report_delay_days: 5 }
              as: Cardholder
              as_user_id: "${xaacct}"
              captures: { xacase: $.data.id }
            - call: "POST /disputes/${xacase}/withdraw"
              payload: {}
              as: Cardholder
              as_user_id: "${xaacct}"
          trigger:
            - call: "POST /disputes"
              payload: { card_transaction_id: "${xatx}", error_type: "DUPLICATE_CHARGE", claim_amount_cents: 8000, claimed_report_delay_days: 5 }
              as: Cardholder
              as_user_id: "${xaacct}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (transaction SETTLED, not POSTED; DisputeCase intake depends on CardTransaction state)"
      - name: reversal_requires_sent_notice_cooling
        grounds:
          - state_machines.ProvisionalCredit.GRANTED_to_REVERSED
          - validations[priority=9]
          - errors[ERR_REVERSAL_NOTICE_PENDING]
        distinguishing_aspect: |
          ProvisionalCredit x Notification pair (different pair than instance 1):
          manual reversal is gated on a SENT REVERSAL_NOTICE whose sent_at is
          >= 3 business days in the past — rejected at 2 business days, allowed
          at exactly 3.
        test_recipe:
          setup:
            - "Old account balance 100000; VISA ECOMMERCE txn 20000 posted 2026-07-01; non-fraud dispute classified, credit 20000 granted; resolved NO_ERROR on Friday 2026-08-21 (REVERSAL_NOTICE sent 2026-08-21)"
          setup_api_calls:
