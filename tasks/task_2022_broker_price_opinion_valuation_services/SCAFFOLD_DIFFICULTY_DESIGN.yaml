            - call: "POST /bpo/valuation-orders/${ord_x2}/comparables"
              payload: { source_property_id: "${comp_x3}", sale_price_cents: 40000000, sale_date: "2026-06-03T00:00:00Z", distance_miles: 1.5, adjustment_cents: 0 }
