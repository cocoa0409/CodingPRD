              as: Owner
              as_user_id: "${oid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_CRASH_BELOW_THRESHOLD"

      - name: stale_version_on_privacy_patch_rejected
        claim_type: ViolationToError
        grounds:
          - validations[priority=19]
          - concurrency_rules[member-privacy-stale-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "PATCH privacy with expected_member_version behind the current version returns 412 ERR_STALE_VERSION."
