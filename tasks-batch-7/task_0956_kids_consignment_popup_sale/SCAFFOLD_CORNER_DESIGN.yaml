        claim_type: violation_to_error
        grounds: [calculations.markdown_window_conflict, "errors[ERR_MARKDOWN_WINDOW_OVERLAP]"]
        distinguishing_aspect: "Half-open window conflict: a rule overlapping an existing one is rejected; a back-to-back rule (effective_from == prior effective_to) is accepted."
