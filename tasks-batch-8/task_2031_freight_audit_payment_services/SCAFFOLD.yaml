    roles: [FapAdmin, AuditAnalyst, FinanceController, TreasuryApprover, CarrierRep, ClientViewer]
    code: 200
    input: []
    output: "AuditException[]"
    side_effects: []
  - method: GET
    path: "/fap/clients/{id}/exceptions"
    description: "List exceptions of a client"
    roles: [FapAdmin, AuditAnalyst, FinanceController, TreasuryApprover, CarrierRep, ClientViewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AuditException[]"
    side_effects: []
  - method: POST
    path: "/fap/exceptions/{id}/notify_carrier"
    description: "OPEN -> CARRIER_NOTIFIED"
    roles: [AuditAnalyst]
    code: 200
    input: []
    output: AuditException
    side_effects: ["ERR_DISPUTE_WINDOW_EXPIRED"]
  - method: POST
    path: "/fap/exceptions/{id}/carrier_respond"
    description: "CARRIER_NOTIFIED -> CARRIER_RESPONDED (carrier-scoped)"
    roles: [CarrierRep]
    code: 200
    input: ["response_note?"]
    output: AuditException
    side_effects: ["ERR_DISPUTE_WINDOW_EXPIRED"]
  - method: POST
    path: "/fap/exceptions/{id}/counter"
    description: "CARRIER_RESPONDED -> CARRIER_NOTIFIED, round_count += 1 (max 3)"
    roles: [AuditAnalyst]
    code: 200
    input: []
    output: AuditException
    side_effects: ["ERR_NEGOTIATION_ROUND_LIMIT"]
  - method: POST
    path: "/fap/exceptions/{id}/resolve"
    description: "CARRIER_RESPONDED -> RESOLVED_ACCEPTED (outcome=ACCEPT) or RESOLVED_CONCEDED (outcome=CONCEDE, credit_minor); ESCALATED -> RESOLVED_CONCEDED by FapAdmin"
    roles: [AuditAnalyst, FapAdmin]
    code: 200
    input: [outcome, "credit_minor?"]
    output: AuditException
    side_effects: ["invoice approved_amount_minor pinned", "home_total_minor recomputed", "ERR_CREDIT_EXCEEDS_DISPUTED"]
  - method: POST
    path: "/fap/exceptions/{id}/escalate"
    description: "OPEN|CARRIER_NOTIFIED|CARRIER_RESPONDED -> ESCALATED"
    roles: [AuditAnalyst]
    code: 200
    input: []
    output: AuditException
    side_effects: []

