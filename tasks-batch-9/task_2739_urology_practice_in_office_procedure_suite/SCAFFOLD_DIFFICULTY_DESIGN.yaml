            - "trigger call 3 (hop 2 was selective): status == \"SCHEDULED_DUE\", satisfying_case_id is null, due_on == \"2027-02-28\" — the earlier-due STONE recall is untouched because CYSTOSCOPY is not in PROTOCOL_SURVEILLANCE_TYPES[STONE]"
            - "trigger call 4 (hop 3): outstanding_recall_count == 1 and version > ${pat_v3}"
            - "an implementation that ranks by due_on before filtering by protocol satisfies the STONE recall and fails calls 2 and 3; one that stops at hop 2 fails call 4"

      - name: tc_specimen_result_recall_supersede_depth4
        grounds:
          - state_machines[Specimen.chain_status].transitions[ACCESSIONED -> RESULTED].side_effects
          - state_machines[SurveillanceRecall.status].transitions[SCHEDULED_DUE -> SUPERSEDED]
          - state_machines[Specimen.notification_status].transitions[NOT_REQUIRED -> PENDING]
          - calculations.notification_escalation_clock
          - calculations.recall_due_date.constants.SPECIMEN_PROTOCOL_MAP
          - calculations.recall_due_date.constants.RESULT_RISK_TIER
        distinguishing_aspect: |
          CASCADE B at depth 4 from a single POST: filing a MALIGNANT result flips
          the notification dimension to PENDING with a computed escalation clock
          (hop 1), inserts a NEW recall whose protocol and risk tier are looked up
          from two different constant maps (hop 2), supersedes the pre-existing
          PROSTATE recall and back-links it as predecessor_recall_id (hop 3), and
          re-derives the patient counter and version (hop 4). Unlike the other
          transitive instance the chain CREATES a row mid-cascade and rewires a
          self-referential FK, and its hop 2 is unconditional rather than selective.
