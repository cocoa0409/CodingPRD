          - validations[priority 48]
          - calculations.unit_ledger_conservation_invariant
        distinguishing_aspect: "A REVERSED charge is not reversible again: the second reverse is 409 and, critically, must not post a third row — INVARIANT L keeps balance_due_cents at exactly 0 with one POSTED reversal of -20000 against one REVERSED charge of +20000."
