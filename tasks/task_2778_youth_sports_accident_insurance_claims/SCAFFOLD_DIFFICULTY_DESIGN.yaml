  - rule_id: resource_temporal_overlap
    instances:

      - name: policy_terms_are_half_open_so_abutting_terms_bind_but_one_day_overlap_fails
        grounds:
          - validations[priority=28]
          - errors[ERR_POLICY_TERM_OVERLAP]
          - state_machines.LeaguePolicy.QUOTED_to_BOUND
          - entities.LeaguePolicy.fields.term_effective_date
          - entities.LeaguePolicy.fields.term_expiration_date
        distinguishing_aspect: |
          Policy terms are HALF-OPEN [term_effective_date, term_expiration_date), so the term starting
          exactly on the incumbent's expiration date binds successfully - abutment is not overlap - while
          a term starting one single day earlier (2027-02-28 against an expiration of 2027-03-01) is
          rejected 409 ERR_POLICY_TERM_OVERLAP. The overlap set is scoped to the same
          (league_id, sport_classification_id) pair and to statuses BOUND/ACTIVE/RUN_OFF, so the losing
          policy can be created as QUOTED and only fails at bind. This is the DATE-grained, half-open,
          same-resource-pair case; the sibling instance is minute-grained, closed-interval and
          cross-resource.
        test_recipe:
          setup:
            - "One league and one BASEBALL_U12 classification (minimum_participants 25)."
            - "Policy 1 for the half-open term [2026-03-01, 2027-03-01) with 404 participants is created and BOUND."
            - "Policy 2 for [2027-03-01, 2028-03-01) with 410 participants and policy 3 for [2027-02-28, 2028-02-28) with 420 participants are both created and left QUOTED; the term-overlap rule fires only at bind."
            - "The logical clock stays at its default 2026-08-01T00:00:00Z, so no filing or verification window is in play."
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "Fairhaven Baseball Alliance", league_code: "FBA-050", state_code: "NY", governing_body_code: "USYSA", contact_email: "admin@fba.example" }
              as: ProgramAdministrator
              captures: { league_id: "$.data.id" }
            - call: "POST /sport-classifications"
              payload: { sport_code: "BASEBALL_U12", sport_name: "Baseball U12", hazard_class: "CLASS_2_MODERATE", base_rate_per_participant_cents: 1850, deductible_cents: 25000, per_injury_limit_cents: 2500000, cat_attachment_point_cents: 2500000, aggregate_limit_cents: 25000000, cat_lifetime_max_cents: 100000000, minimum_participants: 25, travel_buffer_minutes: 60, service_category_caps: { EMERGENCY_ROOM: 500000, SURGERY: 3000000, DIAGNOSTIC_IMAGING: 300000, PHYSICAL_THERAPY: 20000, DENTAL: 350000, AMBULANCE: 200000, PHYSICIAN_OFFICE: 50000 } }
              as: ProgramAdministrator
              captures: { sport_id: "$.data.id" }
            - call: "POST /league-policies"
              payload: { league_id: "${league_id}", sport_classification_id: "${sport_id}", term_effective_date: "2026-03-01", term_expiration_date: "2027-03-01", enrolled_participant_count: 404, coverage_basis_election: "EXCESS_ONLY", cat_layer_elected: true }
              as: ProgramAdministrator
              captures: { pol1_id: "$.data.id" }
            - call: "POST /league-policies/${pol1_id}/bind"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /league-policies"
              payload: { league_id: "${league_id}", sport_classification_id: "${sport_id}", term_effective_date: "2027-03-01", term_expiration_date: "2028-03-01", enrolled_participant_count: 410, coverage_basis_election: "EXCESS_ONLY", cat_layer_elected: true }
              as: ProgramAdministrator
              captures: { pol2_id: "$.data.id" }
            - call: "POST /league-policies"
              payload: { league_id: "${league_id}", sport_classification_id: "${sport_id}", term_effective_date: "2027-02-28", term_expiration_date: "2028-02-28", enrolled_participant_count: 420, coverage_basis_election: "EXCESS_ONLY", cat_layer_elected: true }
              as: ProgramAdministrator
              captures: { pol3_id: "$.data.id" }
          trigger:
            - call: "POST /league-policies/${pol2_id}/bind"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /league-policies/${pol3_id}/bind"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "before the triggers: LeaguePolicy.${pol1_id}.status == BOUND, LeaguePolicy.${pol2_id}.status == QUOTED, LeaguePolicy.${pol3_id}.status == QUOTED"
            - "trigger call 1 returns HTTP 200 with LeaguePolicy.${pol2_id}.status == BOUND: term_effective_date 2027-03-01 equals policy 1's term_expiration_date, and a half-open term that merely abuts does not overlap"
            - "trigger call 2 returns HTTP 409 with error_id ERR_POLICY_TERM_OVERLAP: [2027-02-28, 2028-02-28) intersects both bound terms by at least one day"
            - "after trigger call 2: LeaguePolicy.${pol3_id}.status is still QUOTED and GET /league-policies?league_id=${league_id}&status=BOUND returns exactly 2 rows"

      - name: participant_activity_windows_are_closed_and_buffered_per_activity_across_policies
        grounds:
          - validations[priority=29]
          - errors[ERR_PARTICIPANT_ACTIVITY_CONFLICT]
          - calculations.participant_activity_conflict_window
          - entities.SportClassification.fields.travel_buffer_minutes
          - entities.Enrollment.fields.participant_id
        distinguishing_aspect: |
          Two activities on two DIFFERENT policies of two different sports collide only because one
          athlete is enrolled under both, and each side is widened by its OWN travel buffer (60 minutes for
          baseball, 30 for swimming). The intervals are CLOSED, so an expanded start of 21:30 touching an
          expanded end of 21:30 is a conflict (409), while shifting the candidate by exactly one minute
          clears it (201). The already-recorded activity is only PENDING_SANCTION, proving the comparison
          set is not restricted to SANCTIONED rows. Minute-grained, closed, cross-resource - the mirror
          image of the sibling instance.
        test_recipe:
          setup:
            - "One league with two classifications: BASEBALL_U12 (travel_buffer_minutes 60) and SWIM_U14 (travel_buffer_minutes 30)."
            - "Two ACTIVE policies on the same league, one per classification, both for the term [2026-03-01, 2027-03-01)."
