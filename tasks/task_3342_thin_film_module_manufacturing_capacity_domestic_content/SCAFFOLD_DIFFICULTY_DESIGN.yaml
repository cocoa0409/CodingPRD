              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { res2_id: $.data.id }
          trigger:
            - call: "POST /v1/capacity-reservations/${res1_id}/post-deposit"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${cust_id}"
            - call: "POST /v1/capacity-reservations/${res2_id}/post-deposit"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${cust_id}"
          assert:
            - "R1 (deposit == required 300000.00): CapacityReservation.${res1_id}.status == DEPOSIT_HELD (boundary >= passes)"
            - "R2 (deposit 299999.99 == required - 0.01): response.http_status == 422"
            - "R2: response.error_id == ERR_DEPOSIT_INSUFFICIENT"
            - "R2: CapacityReservation.${res2_id}.status == PENDING (unchanged)"

      - name: recovery_exact_full_fulfillment
        grounds:
          - calculations.recovery_obligation
          - state_machines.RecyclingObligation.COLLECTING_to_RECOVERED
        distinguishing_aspect: |
          Metric = fulfillment ratio at exactly 1.0, endpoint =
          POST /v1/recycling-obligations/{id}/collections. shipped 100.0 ->
          required == 90.0000; collections of 45.0 + 45.0 hit fulfillment_pct ==
          1.0000 exactly, and exactly 1.0 qualifies for the auto-transition to
          RECOVERED (>= boundary, not >).
        test_recipe:
          setup:
            - "Customer C exists; RecyclingObligation for period_year 2026 with shipped_volume_mw 100.0 (required_collected_mw == 90.0000), status OPEN"
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { legal_name: "Acme Solar Dev", credit_tier: "TIER_A", tax_credit_flag: false }
              as: ContractsOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /v1/recycling-obligations"
              payload: { customer_id: "${cust_id}", period_year: 2026, shipped_volume_mw: 100.0 }
              as: RecyclingCoordinator
              captures: { obl_id: $.data.id }
          trigger:
            - call: "POST /v1/recycling-obligations/${obl_id}/collections"
              payload: { volume_mw: 45.0 }
              as: RecyclingCoordinator
            - call: "GET /v1/customers/${cust_id}/recycling-obligations"
              payload: {}
              as: RecyclingCoordinator
            - call: "POST /v1/recycling-obligations/${obl_id}/collections"
              payload: { volume_mw: 45.0 }
              as: RecyclingCoordinator
          assert:
            - "RecyclingObligation.${obl_id}.required_collected_mw == 90.0000"
            - "after first collection: status == COLLECTING and fulfillment_pct == 0.5000"
            - "after second collection: RecyclingObligation.${obl_id}.collected_volume_mw == 90.0000"
            - "after second collection: RecyclingObligation.${obl_id}.fulfillment_pct == 1.0000"
            - "after second collection: RecyclingObligation.${obl_id}.status == RECOVERED (exactly 1.0 qualifies)"

      - name: warranty_cap_exact_boundary
        grounds:
          - calculations.warranty_capacity_reservation
          - validations[priority=14]
        distinguishing_aspect: |
          Metric = aggregate claimed_mw vs the line warranty cap, endpoint =
          POST /v1/warranty-claims/{id}/adjudicate. Cap == 0.10 * 100.0 == 10.0
          MW: a claim of exactly 10.0 MW with zero prior approved claims PASSES
          (<= at cap is inclusive), while a further 0.5 MW claim (10.5 > 10.0)
          fails with ERR_WARRANTY_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Customer C (TIER_A) with ACTIVE reservation R on line OH-L3 (annual_capacity_mw 100.0 -> cap 10.0 MW)"
            - "Claim W1 PRODUCT_DEFECT claimed_mw 10.0 UNDER_REVIEW; claim W2 PRODUCT_DEFECT claimed_mw 0.5 UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { legal_name: "Acme Solar Dev", credit_tier: "TIER_A", tax_credit_flag: false }
              as: ContractsOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /v1/module-series"
              payload: { series_code: "S6", technology: "CDTE_THIN_FILM", nominal_wattage: 480.0, bin_profile: [{ bin_code: "B1", wattage: 480.0, fraction: 0.5 }, { bin_code: "B2", wattage: 470.0, fraction: 0.5 }], temp_coefficient: -0.0028 }
              as: PlantManager
              captures: { series_id: $.data.id }
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /v1/production-runs"
              payload: { line_id: "${line_id}", series_id: "${series_id}", quarter: 0, input_modules: 100, good_modules: 70, bin_counts: [{ bin_code: "B1", count: 35 }, { bin_code: "B2", count: 35 }] }
              as: PlantManager
            - call: "POST /v1/production-lines/${line_id}/commission"
              payload: {}
              as: PlantManager
            - call: "GET /v1/production-lines/${line_id}"
              payload: {}
              as: PlantManager
              captures: { line_ver: $.data.version }
            - call: "POST /v1/capacity-reservations"
              payload: { customer_id: "${cust_id}", line_id: "${line_id}", series_id: "${series_id}", delivery_year: 2027, contracted_mw: 10.0, price_usd_per_w: 0.25, deposit_usd: 200000.0, term_years: 1, expected_line_version: "${line_ver}" }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /v1/capacity-reservations/${res_id}/post-deposit"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${cust_id}"
            - call: "POST /v1/capacity-reservations/${res_id}/activate"
              payload: {}
              as: ContractsOfficer
            - call: "POST /v1/warranty-claims"
              payload: { reservation_id: "${res_id}", claim_type: "PRODUCT_DEFECT", claimed_mw: 10.0 }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { claim1_id: $.data.id }
            - call: "POST /v1/warranty-claims/${claim1_id}/review"
              payload: {}
              as: WarrantyAdministrator
            - call: "POST /v1/warranty-claims"
              payload: { reservation_id: "${res_id}", claim_type: "PRODUCT_DEFECT", claimed_mw: 0.5 }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { claim2_id: $.data.id }
            - call: "POST /v1/warranty-claims/${claim2_id}/review"
              payload: {}
              as: WarrantyAdministrator
          trigger:
            - call: "POST /v1/warranty-claims/${claim1_id}/adjudicate"
              payload: { outcome: "APPROVE" }
              as: WarrantyAdministrator
            - call: "POST /v1/warranty-claims/${claim2_id}/adjudicate"
              payload: { outcome: "APPROVE" }
              as: WarrantyAdministrator
          assert:
            - "W1 (0.0 + 10.0 <= 10.0, at cap): WarrantyClaim.${claim1_id}.status == APPROVED"
            - "W2 (10.0 + 0.5 > 10.0): response.http_status == 422"
            - "W2: response.error_id == ERR_WARRANTY_CAP_EXCEEDED"
            - "W2: WarrantyClaim.${claim2_id}.status == UNDER_REVIEW (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (>=2 instances, different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: activate_requires_line_ramping_or_capacity
        grounds:
          - state_machines.CapacityReservation.DEPOSIT_HELD_to_ACTIVE
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair = CapacityReservation -> ProductionLine: activation is
          defined only when the LINE is RAMPING or AT_CAPACITY; on a
          COMMISSIONING line the same request is rejected with
          ERR_INVALID_STATE, and succeeds unchanged once the line is commissioned.
        test_recipe:
          setup:
            - "Customer C (TIER_A) with reservation R in DEPOSIT_HELD on line OH-L3 still COMMISSIONING (no first-article run yet)"
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { legal_name: "Acme Solar Dev", credit_tier: "TIER_A", tax_credit_flag: false }
              as: ContractsOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /v1/module-series"
              payload: { series_code: "S6", technology: "CDTE_THIN_FILM", nominal_wattage: 480.0, bin_profile: [{ bin_code: "B1", wattage: 480.0, fraction: 0.5 }, { bin_code: "B2", wattage: 470.0, fraction: 0.5 }], temp_coefficient: -0.0028 }
              as: PlantManager
              captures: { series_id: $.data.id }
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "GET /v1/production-lines/${line_id}"
              payload: {}
              as: PlantManager
              captures: { line_ver: $.data.version }
            - call: "POST /v1/capacity-reservations"
              payload: { customer_id: "${cust_id}", line_id: "${line_id}", series_id: "${series_id}", delivery_year: 2027, contracted_mw: 10.0, price_usd_per_w: 0.25, deposit_usd: 200000.0, term_years: 1, expected_line_version: "${line_ver}" }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /v1/capacity-reservations/${res_id}/post-deposit"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /v1/capacity-reservations/${res_id}/activate"
              payload: {}
              as: ContractsOfficer
            - call: "POST /v1/production-runs"
              payload: { line_id: "${line_id}", series_id: "${series_id}", quarter: 0, input_modules: 100, good_modules: 70, bin_counts: [{ bin_code: "B1", count: 35 }, { bin_code: "B2", count: 35 }] }
              as: PlantManager
            - call: "POST /v1/production-lines/${line_id}/commission"
              payload: {}
              as: PlantManager
            - call: "POST /v1/capacity-reservations/${res_id}/activate"
