      - name: comparable_outside_gla_band_is_excluded_from_arv_input_set
        claim_type: input_set_filtering
        grounds:
          - calculations.arv_and_mao (STEP 1 qualification filter)
          - endpoints[POST /deal-analyses/{deal_analysis_id}/finalize]
        distinguishing_aspect: "A fourth comparable priced far above the others is inside the distance and recency limits but outside the +/-20% GLA band (1300 sqft against a 1800 sqft subject, band 1440..2160), so it is excluded from the weighted mean: ARV stays 30000000 instead of rising to 32500000."
