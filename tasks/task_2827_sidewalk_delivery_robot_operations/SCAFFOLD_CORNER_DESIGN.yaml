scaffold_corner_design:
  - section: entities
    instances:
      - name: zone_create_returns_ordinance_config_and_declared_defaults
        claim_type: creation
        grounds:
          - "entities.ServiceZone"
          - "endpoints[POST /service-zones]"
          - "entities.ServiceZone.fields.permit_state"
          - "entities.ServiceZone.fields.max_crossing_risk"
          - "entities.ServiceZone.fields.remedy_budget_remaining_cents"
        distinguishing_aspect: >-
          The plain creation claim for the configuration root: POST /service-zones persists the ten
          required ordinance fields verbatim and stamps every unsupplied optional and system field from
          the declared defaults, so the 201 body carries permit_state PROVISIONED, max_crossing_risk 45.0,
          takeover_confidence_threshold_pct 35, insurer_notify_threshold_cents 25000, all four ledgers at 0
          and version 1 without any transition having run.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "no ServiceZone rows exist yet"
            - "the request supplies only the ten required fields and omits max_crossing_risk, takeover_confidence_threshold_pct and insurer_notify_threshold_cents"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
          assert:
            - "the response is 201"
            - "response data.name == Mission District and response data.municipality_code == SF"
            - "response data.permit_state == PROVISIONED"
            - "response data.ordinance_min_clearance_cm == 90.0 and response data.ordinance_max_speed_cm_s == 160"
            - "response data.operating_window_start_utc_hhmm == 0700 and response data.operating_window_end_utc_hhmm == 2100"
            - "response data.max_concurrent_robots == 2"
            - "response data.max_crossing_risk == 45.0"
            - "response data.takeover_confidence_threshold_pct == 35"
            - "response data.insurer_notify_threshold_cents == 25000"
            - "response data.remedy_budget_cents == 50000 and response data.remedy_spent_cents == 0"
            - "response data.remedy_budget_remaining_cents == 50000"
            - "response data.reserved_bay_minutes == 0 and response data.open_incident_count == 0 and response data.on_mission_robot_count == 0"
            - "response data.lid_code_sequence == 0 and response data.restriction_reason == null"
            - "response data.version == 1 and response data.created_at == response data.updated_at"
            - "GET /service-zones/${z} returns the identical field values"
      - name: segment_read_returns_the_full_geometry_row
        claim_type: retrieval
        grounds:
          - "entities.SidewalkSegment"
          - "endpoints[GET /sidewalk-segments/{segment_id}]"
          - "entities.SidewalkSegment.fields.crossing_risk_score"
          - "entities.SidewalkSegment.fields.status"
        distinguishing_aspect: >-
          The plain retrieval claim: GET /sidewalk-segments/{segment_id} returns every stored geometry
          field plus the two derived ones exactly as the create-plus-SURVEY-plus-APPROVE sequence left
          them, so the read shows status APPROVED, version 3 after the two transitions and
          crossing_risk_score 0.0 (sightline 40.0 tier 0, flow term 8.4, control NONE, no grade hinge,
          curb-ramp credit -6, clamped at the floor).
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PROVISIONED with ordinance_min_clearance_cm 90.0"
            - "SidewalkSegment S1 WALKWAY, length_m 320.0, measured_clearance_cm 118.0, surface_grade_pct 3.0, sightline_m 40.0, pedestrian_flow_per_min 6.0, curb_ramp_present true"
            - "S1 was SURVEYED with no field overrides and then APPROVED, so its version is 3"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S1", segment_type: "WALKWAY", length_m: 320.0, measured_clearance_cm: 118.0, surface_grade_pct: 3.0, sightline_m: 40.0, pedestrian_flow_per_min: 6.0, curb_ramp_present: true }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
          trigger:
            - call: "GET /sidewalk-segments/${s1}"
              as: FleetDispatcher
          assert:
            - "the response is 200"
            - "response data.zone_id == ${z} and response data.segment_code == S1"
            - "response data.segment_type == WALKWAY and response data.crossing_control == NONE"
            - "response data.length_m == 320.0 and response data.measured_clearance_cm == 118.0"
            - "response data.surface_grade_pct == 3.0 and response data.sightline_m == 40.0"
            - "response data.pedestrian_flow_per_min == 6.0 and response data.curb_ramp_present == true"
            - "response data.crossing_risk_score == 0.0"
            - "response data.status == APPROVED"
            - "response data.connected_segment_ids == [] and response data.blocked_by_closure_id == null"
            - "response data.version == 3"
      - name: robot_listing_pages_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - "endpoints[GET /robots]"
          - "response_envelope.pagination_fields"
          - "response_envelope.pagination_defaults"
          - "entities.Robot.fields.duty_state"
        distinguishing_aspect: >-
          The listing claim for the fleet collection: GET /robots honours limit and offset while reporting
          the unpaginated total, so with three OFFLINE robots in the zone a limit of 2 returns 2 rows with
          total_count 3 and has_more true, and offset 2 returns the remaining 1 row with has_more false;
          the two pages together contain each asset_tag exactly once.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PROVISIONED"
            - "three Robot rows in Z1 created in this order: RBT-001, RBT-002, RBT-003, all duty_state OFFLINE and health_state NOMINAL"
            - "no other Robot rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /robots"
              payload: { zone_id: "${z}", asset_tag: "RBT-001", width_cm: 78.0, container_capacity_liters: 60.0, max_speed_cm_s: 150 }
              as: PlatformAdmin
              captures: { r: $.data.id }
            - call: "POST /robots"
              payload: { zone_id: "${z}", asset_tag: "RBT-002", width_cm: 78.0, container_capacity_liters: 60.0, max_speed_cm_s: 150 }
              as: PlatformAdmin
              captures: { r2: $.data.id }
            - call: "POST /robots"
              payload: { zone_id: "${z}", asset_tag: "RBT-003", width_cm: 78.0, container_capacity_liters: 60.0, max_speed_cm_s: 150 }
              as: PlatformAdmin
              captures: { r3: $.data.id }
          trigger:
            - call: "GET /robots?zone_id=${z}&limit=2&offset=0"
              as: FleetDispatcher
            - call: "GET /robots?zone_id=${z}&limit=2&offset=2"
              as: FleetDispatcher
          assert:
            - "the first page returns 200 with exactly 2 rows in data"
            - "the first page reports total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "the second page returns 200 with exactly 1 row in data"
            - "the second page reports total_count == 3, limit == 2, offset == 2 and has_more == false"
            - "the union of asset_tag over both pages is exactly RBT-001, RBT-002, RBT-003 with no duplicates"
            - "GET /robots?zone_id=${z}&duty_state=OFFLINE reports total_count == 3"
            - "GET /robots?zone_id=${z}&duty_state=AVAILABLE reports total_count == 0 and returns an empty data array"
      - name: mapping_layer_unknown_ids_return_not_found
        claim_type: not_found
        grounds:
          - "validations[priority=30]"
          - "validations[priority=31]"
          - "validations[priority=32]"
          - "validations[priority=33]"
          - "errors.ERR_ZONE_NOT_FOUND"
          - "errors.ERR_SEGMENT_NOT_FOUND"
          - "errors.ERR_CLOSURE_NOT_FOUND"
          - "errors.ERR_MERCHANT_NOT_FOUND"
        distinguishing_aspect: >-
          The not-found claim for the four mapping-layer entities: each referential rule owns a distinct
          error_id, so an unknown id on the zone, segment, closure and merchant endpoints returns 404 with
          ERR_ZONE_NOT_FOUND, ERR_SEGMENT_NOT_FOUND, ERR_CLOSURE_NOT_FOUND and ERR_MERCHANT_NOT_FOUND
          respectively rather than one shared generic 404.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 exists so the failures cannot be blamed on an empty database"
            - "the id 11111111-1111-4111-8111-111111111111 belongs to no row of any entity"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
          trigger:
            - call: "GET /service-zones/11111111-1111-4111-8111-111111111111"
              as: FleetDispatcher
            - call: "GET /sidewalk-segments/11111111-1111-4111-8111-111111111111"
              as: FleetDispatcher
            - call: "POST /segment-closures/11111111-1111-4111-8111-111111111111/transitions"
              payload: { action: "LIFT" }
              as: PlatformAdmin
            - call: "GET /merchants/11111111-1111-4111-8111-111111111111"
              as: CustomerSupport
          assert:
            - "the zone read returns 404 with error_id ERR_ZONE_NOT_FOUND"
            - "the segment read returns 404 with error_id ERR_SEGMENT_NOT_FOUND"
            - "the closure transition returns 404 with error_id ERR_CLOSURE_NOT_FOUND"
            - "the merchant read returns 404 with error_id ERR_MERCHANT_NOT_FOUND"
            - "every one of the four bodies carries a non-empty message string"
      - name: fleet_layer_unknown_ids_return_not_found
        claim_type: not_found
        grounds:
          - "validations[priority=34]"
          - "validations[priority=35]"
          - "validations[priority=36]"
          - "errors.ERR_ROBOT_NOT_FOUND"
          - "errors.ERR_BAY_NOT_FOUND"
          - "errors.ERR_RESERVATION_NOT_FOUND"
        distinguishing_aspect: >-
          The not-found claim for the depot layer, which is distinguished from the mapping layer by which
          rules fire: the robot, bay and reservation referential rules each return their own error_id, and
          the reservation transition proves the check runs on the path id before any state rule, so an
          unknown reservation is 404 ERR_RESERVATION_NOT_FOUND and never 409 ERR_RESERVATION_NOT_ACTIVE.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 exists with one real Robot and one real DepotBay, so the fleet tables are non-empty"
            - "the id 11111111-1111-4111-8111-111111111111 belongs to no row of any entity"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /robots"
              payload: { zone_id: "${z}", asset_tag: "RBT-001", width_cm: 78.0, container_capacity_liters: 60.0, max_speed_cm_s: 150 }
              as: PlatformAdmin
              captures: { r: $.data.id }
            - call: "POST /depot-bays"
              payload: { zone_id: "${z}", bay_code: "B1", bay_type: "CHARGE", power_kw: 22.0, state: "OPEN" }
              as: PlatformAdmin
              captures: { b: $.data.id, b_v: $.data.version }
          trigger:
            - call: "GET /robots/11111111-1111-4111-8111-111111111111"
              as: FleetDispatcher
            - call: "GET /depot-bays/11111111-1111-4111-8111-111111111111"
              as: FleetDispatcher
            - call: "POST /bay-reservations/11111111-1111-4111-8111-111111111111/transitions"
              payload: { action: "CANCEL" }
              as: FleetDispatcher
          assert:
            - "the robot read returns 404 with error_id ERR_ROBOT_NOT_FOUND"
            - "the bay read returns 404 with error_id ERR_BAY_NOT_FOUND"
            - "the reservation transition returns 404 with error_id ERR_RESERVATION_NOT_FOUND and not 409 ERR_RESERVATION_NOT_ACTIVE"
            - "DepotBay.${b}.committed_minutes == 0 is untouched by the failed calls"
      - name: delivery_layer_unknown_ids_return_not_found
        claim_type: not_found
        grounds:
          - "validations[priority=37]"
          - "validations[priority=38]"
          - "validations[priority=39]"
          - "validations[priority=40]"
          - "validations[priority=41]"
          - "errors.ERR_ORDER_NOT_FOUND"
          - "errors.ERR_MISSION_NOT_FOUND"
          - "errors.ERR_PLAN_NOT_FOUND"
          - "errors.ERR_INTERVENTION_NOT_FOUND"
          - "errors.ERR_INCIDENT_NOT_FOUND"
        distinguishing_aspect: >-
          The not-found claim for the five delivery-layer entities, distinguished from the other two
          not-found instances by covering the transition endpoints whose bodies would otherwise trip an
          action or state rule: an unknown plan id is 404 ERR_PLAN_NOT_FOUND rather than 409, and an
          unknown intervention id is 404 ERR_INTERVENTION_NOT_FOUND rather than 409
          ERR_INVALID_STATE_TRANSITION.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 exists; no orders, missions, plans, interventions or incidents have been created"
            - "the id 11111111-1111-4111-8111-111111111111 belongs to no row of any entity"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
          trigger:
            - call: "GET /delivery-orders/11111111-1111-4111-8111-111111111111"
              as: CustomerSupport
            - call: "GET /delivery-missions/11111111-1111-4111-8111-111111111111"
              as: FleetDispatcher
            - call: "POST /route-plans/11111111-1111-4111-8111-111111111111/transitions"
              payload: { action: "VALIDATE" }
              as: FleetDispatcher
            - call: "POST /intervention-events/11111111-1111-4111-8111-111111111111/transitions"
              payload: { action: "ACKNOWLEDGE" }
              as: RemoteOperator
            - call: "GET /incident-reports/11111111-1111-4111-8111-111111111111"
              as: SafetyOfficer
          assert:
            - "the order read returns 404 with error_id ERR_ORDER_NOT_FOUND"
            - "the mission read returns 404 with error_id ERR_MISSION_NOT_FOUND"
            - "the plan transition returns 404 with error_id ERR_PLAN_NOT_FOUND"
            - "the intervention transition returns 404 with error_id ERR_INTERVENTION_NOT_FOUND"
            - "the incident read returns 404 with error_id ERR_INCIDENT_NOT_FOUND"
      - name: segment_optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - "entities.SidewalkSegment.fields.crossing_control"
          - "entities.SidewalkSegment.fields.sightline_m"
          - "entities.SidewalkSegment.fields.pedestrian_flow_per_min"
          - "entities.SidewalkSegment.fields.curb_ramp_present"
          - "entities.SidewalkSegment.fields.connected_segment_ids"
          - "state_machines.SidewalkSegment.MAPPED_to_SURVEYED"
        distinguishing_aspect: >-
          The defaults claim: a segment created with only its six required fields takes crossing_control
          NONE, sightline_m 0.0, pedestrian_flow_per_min 0.0, curb_ramp_present false and
          connected_segment_ids [], and because crossing_risk_score is scored at SURVEY rather than at
          create, the same row reads null immediately after the 201 and 30.0 after a SURVEY that supplies
          no overrides (sightline tier 30 with every other term at 0).
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PROVISIONED with ordinance_min_clearance_cm 90.0"
            - "no segments exist in Z1 yet"
            - "the create request omits crossing_control, sightline_m, pedestrian_flow_per_min, curb_ramp_present and connected_segment_ids"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
          trigger:
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "SD", segment_type: "WALKWAY", length_m: 150.0, measured_clearance_cm: 120.0, surface_grade_pct: 2.0 }
              as: PlatformAdmin
              captures: { sd: $.data.id }
            - call: "POST /sidewalk-segments/${sd}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
          assert:
            - "the create returns 201 with response data.crossing_control == NONE"
            - "immediately after the create SidewalkSegment.${sd}.sightline_m == 0.0 and SidewalkSegment.${sd}.pedestrian_flow_per_min == 0.0"
            - "immediately after the create SidewalkSegment.${sd}.curb_ramp_present == false and SidewalkSegment.${sd}.connected_segment_ids == []"
            - "immediately after the create SidewalkSegment.${sd}.status == MAPPED and SidewalkSegment.${sd}.crossing_risk_score == null"
            - "after the SURVEY SidewalkSegment.${sd}.status == SURVEYED and SidewalkSegment.${sd}.crossing_risk_score == 30.0"
            - "after the SURVEY SidewalkSegment.${sd}.sightline_m == 0.0 (the omitted override left the mapped value in place)"
            - "SidewalkSegment.${sd}.version == 2"
      - name: robot_create_stamps_every_system_field
        claim_type: system_fields
        grounds:
          - "entities.Robot.fields.battery_pct"
          - "entities.Robot.fields.duty_state"
          - "entities.Robot.fields.health_state"
          - "entities.Robot.fields.rolling_autonomy_index"
          - "entities.Robot.fields.lifetime_autonomy_index"
          - "common_fields_contract.version_semantics"
        distinguishing_aspect: >-
          The system-fields claim: POST /robots accepts five caller-supplied fields and stamps fourteen
          server-owned ones, so a brand-new robot reads battery_pct 100.0, duty_state OFFLINE, health_state
          NOMINAL, odometer_m 0.0, yield_event_count 0, tamper_flag false, all four lifetime counters 0,
          both autonomy indices at the START_INDEX 100, both back-pointers null and version 1 - none of
          which the request may set.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PROVISIONED with ordinance_max_speed_cm_s 160"
            - "no Robot rows exist yet"
            - "the request supplies exactly zone_id, asset_tag, width_cm, container_capacity_liters and max_speed_cm_s"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
          trigger:
            - call: "POST /robots"
              payload: { zone_id: "${z}", asset_tag: "RBT-001", width_cm: 78.0, container_capacity_liters: 60.0, max_speed_cm_s: 150 }
              as: PlatformAdmin
              captures: { r: $.data.id }
          assert:
            - "the response is 201"
            - "response data.battery_pct == 100.0"
            - "response data.duty_state == OFFLINE and response data.health_state == NOMINAL"
            - "response data.odometer_m == 0.0 and response data.yield_event_count == 0"
            - "response data.tamper_flag == false"
            - "response data.lifetime_mission_count == 0 and response data.lifetime_intervention_count == 0 and response data.lifetime_escalation_count == 0"
            - "response data.clean_mission_count == 0"
            - "response data.rolling_autonomy_index == 100 and response data.lifetime_autonomy_index == 100"
            - "response data.active_mission_id == null and response data.current_bay_reservation_id == null"
            - "response data.version == 1 and response data.created_at == response data.updated_at"
            - "ServiceZone.${z}.on_mission_robot_count == 0"
      - name: order_create_freezes_tier_urgency_and_quote
        claim_type: computed_fields
        grounds:
          - "calculations.delivery_fee"
          - "entities.DeliveryOrder.fields.payload_tier"
          - "entities.DeliveryOrder.fields.urgency_flag"
          - "entities.DeliveryOrder.fields.quoted_fee_cents"
          - "entities.DeliveryOrder.fields.settled_fee_cents"
          - "calculations.merchant_fee_ledger"
        distinguishing_aspect: >-
          The computed-fields claim at the order boundary: the create response carries three derived values
          and one deliberate null, so a 10.0 L order promised 120 minutes out against a STANDARD merchant
          reads payload_tier SMALL, urgency_flag false, quoted_fee_cents 595 (349 + 8 * 22 + 0 + 0 + 2 * 35
          with a zero grade discount) and settled_fee_cents null, and the 595 lands in the merchant's
          escrow bucket in the same request.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PERMITTED with planning_haul_m 800.0 (8 distance units) and planning_crossings 2"
