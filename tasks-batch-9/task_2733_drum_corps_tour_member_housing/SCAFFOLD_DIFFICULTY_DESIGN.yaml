          setup:
            - "Three members with dietary flags NONE, GLUTEN_FREE and SEVERE_ALLERGEN hold EXECUTED contracts."
            - "The clock has been moved to 2027-06-12 and a billing sweep has promoted all three to ON_TOUR."
