            - "CampusAdmin adjudicate incident -> error_id == ERR_FORBIDDEN (403)"
            - "Volunteer verify own hour entry -> error_id == ERR_FORBIDDEN (403)"

      - name: volunteer_ownership_read_rules
        claim_type: role_exclusive_denial
        grounds: [roles.Volunteer, "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Ownership binding for the entity_backed Volunteer role: reading one's own record succeeds while reading another volunteer's record with the same role fails 403."
        test_recipe:
          setup: ["two volunteers exist (APPLIED)"]
          setup_api_calls:
            - { call: "POST /volunteers", payload: { full_name: "Self Sue", email: "self@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v1_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Other Owen", email: "other@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v2_id: $.data.id } }
          trigger:
            - { call: "GET /volunteers/${v1_id}", payload: {}, as: Volunteer, as_user_id: "${v1_id}", captures: { ok_email: $.data.email } }
            - { call: "GET /volunteers/${v2_id}", payload: {}, as: Volunteer, as_user_id: "${v1_id}", captures: { err: $.data.error_id } }
          assert:
            - "own read succeeds: email == self@x.com"
            - "cross-volunteer read -> error_id == ERR_FORBIDDEN (403)"

      - name: coordinator_hierarchical_override_confirms
        claim_type: role_model_pattern
        grounds: [roles.DistrictCoordinator, complexity_profile.role_model]
        distinguishing_aspect: "Hierarchical override: DistrictCoordinator performs a CampusAdmin-surface operation (placement confirm) successfully."
        test_recipe:
          setup: ["ACTIVE volunteer; OPEN opp cap 2; placement REQUESTED"]
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Override Oz", email: "oz@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "BASIC", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Library Help", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id } }
            - { call: "POST /opportunities/${opp_id}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /placements", payload: { opportunity_id: "${opp_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { pl_id: $.data.id } }
          trigger:
            - { call: "POST /placements/${pl_id}/confirm", payload: {}, as: DistrictCoordinator, captures: { pl_status: $.data.status } }
          assert:
            - "DistrictCoordinator confirm succeeds: Placement.${pl_id}.status == CONFIRMED"
            - "Opportunity.${opp_id}.committed_count == 1"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_background_check_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[background-check-create-stale-volunteer]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Volunteer.version for POST /background-checks: a create carrying the pre-mutation version (1) after the volunteer advanced (check creation + adjudication) is rejected 412 ERR_STALE_VERSION; a create carrying the current version succeeds."
        test_recipe:
          setup: ["volunteer ACTIVE: created (v1), check1 created (v2), ORIENT training, adjudicated NONE (v3)"]
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Version Vic", email: "vic@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "BASIC", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "GET /volunteers/${v_id}", payload: {}, as: DistrictCoordinator, captures: { v_cur: $.data.version } }
          trigger:
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "ENHANCED", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "ENHANCED", expected_volunteer_version: "${v_cur}" }, as: DistrictCoordinator, captures: { chk2_id: $.data.id, chk2_status: $.data.status } }
          assert:
            - "stale create (version ${v_ver}) -> error_id == ERR_STALE_VERSION (412)"
            - "current-version create succeeds: BackgroundCheck.${chk2_id}.status == PENDING"
            - "Volunteer.${v_id}.version advanced by exactly 1 across the successful create"

      - name: occ_manual_award_success_and_stale_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[manual-award-stale-volunteer]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Volunteer.version for POST /recognition-awards: the first award at the observed version succeeds and bumps the version; a second award replaying the same observed version is rejected 412."
        test_recipe:
          setup: ["volunteer exists (APPLIED), version captured at creation"]
          setup_api_calls:
            - { call: "POST /volunteers", payload: { full_name: "Award Ollie", email: "ao@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
          trigger:
            - { call: "POST /recognition-awards", payload: { volunteer_id: "${v_id}", tier: "BRONZE", note: "Manual kudos", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { aw_id: $.data.id, aw_source: $.data.source } }
            - { call: "POST /recognition-awards", payload: { volunteer_id: "${v_id}", tier: "SILVER", note: "Stale replay", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "first award succeeds: RecognitionAward.${aw_id}.source == MANUAL and tier == BRONZE"
            - "replayed stale version -> error_id == ERR_STALE_VERSION (412)"
            - "GET /recognition-awards?volunteer_id=${v_id} total_count == 1"

      - name: match_selector_ranking_tiebreak_and_capacity
        claim_type: selector_policy
        grounds: ["endpoints.POST_/opportunities/{id}/match", calculations.opportunity_fill]
        distinguishing_aspect: "Selector determinism: the match endpoint ranks eligible volunteers by total_verified_hours ASC with tie-break Volunteer.created_at ASC and fills only up to capacity — with cap 2 and candidates (v1: 0h oldest, v2: 0h newer, v3: 5h), it selects exactly v1 and v2."
        test_recipe:
          setup:
            - "helper opp (2026-08-03, cap 5, published) for earning hours; target opp (2026-08-10T14:00-17:00, cap 2, published)"
            - "v1 ACTIVE created first, 0 verified hours; v2 ACTIVE created second, 0 verified hours; v3 ACTIVE created third, 5.0 verified hours via helper opp"
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Helper", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 5, starts_at: "2026-08-03T08:00:00Z", ends_at: "2026-08-03T12:00:00Z" }, as: CampusAdmin, captures: { opp_h: $.data.id } }
            - { call: "POST /opportunities/${opp_h}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Target", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { opp_t: $.data.id } }
            - { call: "POST /opportunities/${opp_t}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /volunteers", payload: { full_name: "First Vic", email: "v1@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v1_id: $.data.id, v1_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v1_id}", level: "BASIC", expected_volunteer_version: "${v1_ver}" }, as: DistrictCoordinator, captures: { c1_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v1_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${c1_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /volunteers", payload: { full_name: "Second Vic", email: "v2@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v2_id: $.data.id, v2_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v2_id}", level: "BASIC", expected_volunteer_version: "${v2_ver}" }, as: DistrictCoordinator, captures: { c2_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v2_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${c2_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /volunteers", payload: { full_name: "Third Vic", email: "v3@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v3_id: $.data.id, v3_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v3_id}", level: "BASIC", expected_volunteer_version: "${v3_ver}" }, as: DistrictCoordinator, captures: { c3_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v3_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${c3_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /placements", payload: { opportunity_id: "${opp_h}" }, as: Volunteer, as_user_id: "${v3_id}", captures: { p3h_id: $.data.id } }
            - { call: "POST /placements/${p3h_id}/confirm", payload: {}, as: CampusAdmin }
            - { call: "POST /hour-entries", payload: { placement_id: "${p3h_id}", worked_date: "2026-08-03", hours: 5.0, activity_category: "STANDARD" }, as: Volunteer, as_user_id: "${v3_id}", captures: { he3_id: $.data.id } }
            - { call: "POST /hour-entries/${he3_id}/verify", payload: {}, as: CampusAdmin }
          trigger:
            - { call: "POST /opportunities/${opp_t}/match", payload: {}, as: DistrictCoordinator, captures: { matched: $.data.matched_count, remaining: $.data.remaining_capacity } }
            - { call: "GET /placements", payload: { opportunity_id: "${opp_t}", status: "CONFIRMED" }, as: DistrictCoordinator }
          assert:
            - "match response matched_count == 2 and remaining_capacity == 0"
            - "the 2 created placements are CONFIRMED and belong to ${v1_id} and ${v2_id} (0-hour volunteers; created_at ASC breaks the tie in v1's favor)"
            - "no placement exists for ${v3_id} on ${opp_t} (5.0 verified hours ranks last)"
            - "Opportunity.${opp_t}.committed_count == 2"

      - name: match_empty_pool_returns_zero
        claim_type: selector_policy
        grounds: ["endpoints.POST_/opportunities/{id}/match"]
        distinguishing_aspect: "Empty-pool fallback: matching an OPEN opportunity with zero eligible volunteers returns 200 with matched_count 0 and creates nothing (no error)."
        test_recipe:
          setup: ["campus + OPEN opp cap 3; no volunteers exist"]
          setup_api_calls:
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Lonely Shift", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 3, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id } }
            - { call: "POST /opportunities/${opp_id}/publish", payload: {}, as: CampusAdmin }
          trigger:
            - { call: "POST /opportunities/${opp_id}/match", payload: {}, as: DistrictCoordinator, captures: { matched: $.data.matched_count, remaining: $.data.remaining_capacity } }
          assert:
            - "match response matched_count == 0 and remaining_capacity == 3"
            - "GET /placements?opportunity_id=${opp_id} total_count == 0"

      - name: clock_sweep_expiry_and_demotion_stub
        claim_type: scheduled_actions
        grounds: [endpoints.POST_/_clock/set_current_utc, state_machines.BackgroundCheck.CLEARED_to_EXPIRED]
        excluded_because:
          difficulty_instance: volunteer_active_rescreen_active_cycle
          rationale: "Sweep expiry of a CLEARED check and the ACTIVE -> RESCREEN_REQUIRED demotion are asserted in that instance's trigger/assert block."

      - name: suspension_cascade_stub
        claim_type: cascading_side_effects
        grounds: [state_machines.Volunteer.ACTIVE_to_SUSPENDED]
        excluded_because:
          difficulty_instance: incident_suspension_cascade
          rationale: "The 3-level incident -> volunteer -> placement -> opportunity cascade (plus check-in force-close) is asserted there."

      - name: verify_tier_award_cascade_stub
        claim_type: cascading_side_effects
        grounds: [state_machines.HourEntry.PENDING_to_VERIFIED]
        excluded_because:
          difficulty_instance: hour_verify_tier_award_cascade
          rationale: "The verify -> totals -> tier -> auto-award chain is asserted there."

      - name: hours_dual_variant_stub
        claim_type: dual_variant_calculation
        grounds: [calculations.volunteer_service_hours]
        excluded_because:
          difficulty_instance: volunteer_hours_provisional_vs_verified
          rationale: "Both variants asserted with literal values there."

      - name: fill_dual_variant_stub
        claim_type: dual_variant_calculation
        grounds: [calculations.opportunity_fill]
        excluded_because:
          difficulty_instance: opportunity_fill_committed_vs_projected
          rationale: "Both fill variants asserted with literal counts there."

      - name: tier_threshold_boundary_stub
        claim_type: rate_threshold_triggers
        grounds: [calculations.recognition_tier]
        excluded_because:
          difficulty_instance: tier_boundary_exactly_fifty_hours
          rationale: "The inclusive >= 50.0 threshold is asserted there."

      - name: reconciliation_stub
        claim_type: derived_field_reconciliation
        grounds: [calculations.volunteer_service_hours, calculations.recognition_points]
        excluded_because:
          difficulty_instance: hours_points_conservation_verify_then_revoke
          rationale: "Derived totals/points reconciliation across verify and revoke asserted there."

      - name: priority_state_beats_safety_stub
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]"]
        excluded_because:
          difficulty_instance: confirm_state_error_beats_safety_error
          rationale: "Dual-failure priority asserted there."

      - name: priority_referential_beats_temporal_stub
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=7]"]
        excluded_because:
          difficulty_instance: hour_entry_referential_beats_temporal
          rationale: "Dual-failure priority asserted there."

      - name: placement_overlap_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_PLACEMENT_TIME_CONFLICT]"]
        excluded_because:
          difficulty_instance: placement_overlap_half_open_adjacency
          rationale: "Half-open adjacency vs overlap asserted there."

      - name: checkin_window_singleton_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_OUTSIDE_CHECKIN_WINDOW]", "errors[ERR_OPEN_CHECKIN_EXISTS]"]
        excluded_because:
          difficulty_instance: checkin_buffer_window_and_singleton
          rationale: "Buffered closed window + singleton session asserted there."

      - name: seat_conservation_stub
        claim_type: side_effect_execution
        grounds: [calculations.opportunity_fill]
        excluded_because:
          difficulty_instance: seat_conservation_confirm_then_cancel
          rationale: "Confirm/cancel seat conservation asserted there."

      - name: restricted_role_error_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_RESTRICTED_ROLE]"]
        excluded_because:
          difficulty_instance: screening_decision_matrix_minor_unsupervised_flags
          rationale: "ERR_RESTRICTED_ROLE is the failure-path assertion of that instance."

      - name: opportunity_full_error_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPPORTUNITY_FULL]"]
        excluded_because:
          difficulty_instance: capacity_boundary_confirm_at_exactly_full
          rationale: "ERR_OPPORTUNITY_FULL at committed_count == capacity asserted there."

      - name: check_branching_terminal_denied_stub
        claim_type: terminal_state_lockdown
        grounds: [state_machines.BackgroundCheck, state_machines.Volunteer.UNDER_SCREENING_to_DENIED]
        excluded_because:
          difficulty_instance: background_check_branching_outcomes
          rationale: "DENIED terminal lockdown (re-screening attempt on DENIED volunteer) asserted there."

      - name: volunteer_not_active_error_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_VOLUNTEER_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: confirm_blocked_when_volunteer_suspended
          rationale: "ERR_VOLUNTEER_INVALID_STATE on confirm for a SUSPENDED volunteer asserted there."
