        excluded_because:
          difficulty_instance: non_linear_state_machine / mrf_validating_fork_reject_revise_publish_supersede
          rationale: "That §1.8 instance drives both fork arms (0 errors -> PUBLISHED, >0 -> REJECTED), the revise cycle edge and the supersede side effect on the earlier published file."

  - section: calculations
