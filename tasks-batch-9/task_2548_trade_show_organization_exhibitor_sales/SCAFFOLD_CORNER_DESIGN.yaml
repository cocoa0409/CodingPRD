              as: ShowDirector
              captures: { show2_id: $.data.id }
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "A100", width_ft: 20, depth_ft: 20, location_class: "CORNER", premium_zone: "MAIN_AISLE", max_height_ft: 16 }
              as: FloorManager
              captures: { b_a: $.data.id }
