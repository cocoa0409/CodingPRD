          Metric = deposit USD at the >= tier-fraction threshold, endpoint =
          POST /v1/capacity-reservations/{id}/post-deposit. TIER_B required ==
          10.0 * 1e6 * 0.30 * 0.10 == 300000.00: exactly 300000.00 PASSES
