            - call: "POST /appointments/${a4_trunc_id}/issue-offer"
              payload: {}
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_4"
              captures: { trunc_enc: "$.data.encumbrance_usd", trunc_rate: "$.data.fringe_rate" }
          assert:
            - "${full_rate} == 0.335"
            - "${full_enc} == 90780.00"
            - "FundingSource.${f4_full_id}.encumbered_usd == 90780.00"
