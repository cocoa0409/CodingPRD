            - "the second trigger returns 422 with data.error_id == ERR_TEAM_SEASON_MISMATCH (both team ids resolve, so this is not a 404)"
            - "the third trigger returns 201 with data.play_status == SCHEDULED, data.result_status == AWAITING_REPORTS, data.server_pool_id == POOL-A and data.scheduled_end_at == 2026-10-01T19:00:00.000Z"
            - "exactly one Match row exists"

      - name: fair_play_case_subject_reference_must_agree_with_the_declared_subject_type
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
