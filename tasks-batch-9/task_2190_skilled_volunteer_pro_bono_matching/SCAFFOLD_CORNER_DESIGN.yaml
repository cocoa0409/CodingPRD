            - {call: "POST /volunteers/${vol_id}/skill-profiles", as: Volunteer, as_user_id: "${vol_id}", payload: {skill_code: "TAX_LAW", proficiency: 4, years_experience: 9.0}}
          trigger:
            - {call: "POST /volunteers/${vol_id}/vet", as: ScopingSpecialist, as_user_id: "spec-1", payload: {verify_skill_codes: ["TAX_LAW"]}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 403"
            - "data.error_id == \"ERR_ROLE_NOT_PERMITTED\""
            - "GET /volunteers/${vol_id} shows status == \"PENDING_VETTING\" and credential_verified_at == null"
            - "GET /volunteers/${vol_id}/skill-profiles shows the TAX_LAW row with verified == false and verified_at == null"
      - name: rbac_partner_contact_cannot_declare_volunteer_skill
