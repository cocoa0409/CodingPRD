          setup:
            - "Three filler panelists X1, X2, X3 all sharing address_hash H-CLUSTER with old accounts, so anyone else in the cluster sees three collisions and addr_base = 18 * min(3,3)/3 = 18."
            - "Referrer R in the same cluster, account opened 2026-07-25 (7 days before the pinned clock): R screens at 18 + 22 = 40.0 and PASSES, is allocated a sample, then a diversion case on that shipment is investigated so R's audit score is 1.5*18 + 22 + 15 = 64.0 >= 55.0 and R becomes FLAGGED."
            - "Panelist P: cluster address, account opened 2026-07-25, referred_by R -> 18 + 22 + 15 = 55.0 exactly."
