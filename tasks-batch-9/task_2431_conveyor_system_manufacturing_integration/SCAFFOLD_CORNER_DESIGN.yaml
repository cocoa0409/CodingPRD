  - section: rbac
    instances:
      - name: design_freeze_and_simulation_are_refused_across_the_two_integrator_desks
        claim_type: role_denied_operation
        grounds:
          - roles.ProjectDirector.exclusive_operations
          - roles.DesignEngineer.exclusive_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: |
          The two desks are peers, not a hierarchy: DesignEngineer is refused the design freeze and ProjectDirector
          is refused the simulation run, both with 403 ERR_ROLE_NOT_PERMITTED, and the freeze then succeeds for
          ProjectDirector on exactly the same fixture that the DesignEngineer call left untouched.
        test_recipe:
          setup:
            - "Fixture A project in DESIGN with segments IB-01 and TR-02, one 10000-bps link and one COMPLETE DEGRADED_AVAILABILITY run (effective 1330 >= required 1250), so the freeze preconditions are all satisfied."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-30", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-080"
              captures: { proj_r1: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_r1}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_r1a: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_r1}", segment_code: "TR-02", equipment_class: "ROLLER", rated_capacity_cph: 1400, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_r1b: $.data.id }
            - call: "POST /flow-links"
              payload: { project_id: "${proj_r1}", from_segment_id: "${seg_r1a}", to_segment_id: "${seg_r1b}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /projects/${proj_r1}/simulations"
              payload: { method: "DEGRADED_AVAILABILITY" }
              as: DesignEngineer
              captures: { sim_r1: $.data.id }
          trigger:
            - call: "POST /projects/${proj_r1}/design-freeze"
              payload: {}
              as: DesignEngineer
              captures: { err_r1: $.data.error_id }
            - call: "POST /projects/${proj_r1}/simulations"
              payload: { method: "DETERMINISTIC" }
              as: ProjectDirector
              as_user_id: "pd-080"
              captures: { err_r2: $.data.error_id }
            - call: "POST /projects/${proj_r1}/design-freeze"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-080"
          assert:
            - "the first call is 403 with error_id ERR_ROLE_NOT_PERMITTED"
            - "the second call is 403 with error_id ERR_ROLE_NOT_PERMITTED"
            - "GET /projects/${proj_r1}/simulation-runs still returns total_count == 1 with the only row id ${sim_r1} and method DEGRADED_AVAILABILITY"
            - "the third call is 200 and Project.${proj_r1}.delivery_status == DESIGN_FROZEN with design_frozen_at set"
            - "SimulationRun.${sim_r1}.status == COMPLETE and effective_throughput_cph == 1330"

      - name: site_manager_is_refused_certificate_issuance_before_any_state_check_runs
        claim_type: role_denied_operation
        grounds:
          - roles.SiteManager.exclusive_operations
          - validations[priority=2]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: |
          The project is still in DESIGN with acceptance_ready false, yet the SiteManager attempt returns
          403 ERR_ROLE_NOT_PERMITTED and never ERR_PROJECT_NOT_COMMISSIONING, proving the priority-2 role gate
          runs ahead of the priority-8 state gate.
        test_recipe:
          setup:
            - "A bare project in DESIGN with no segments, no ramps and acceptance_ready false."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-31", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-081"
              captures: { proj_r2: $.data.id }
          trigger:
            - call: "POST /acceptance-certificates"
              payload: { project_id: "${proj_r2}" }
              as: SiteManager
              as_user_id: "sm-081"
              captures: { err_r3: $.data.error_id }
          assert:
            - "the response is 403 with error_id ERR_ROLE_NOT_PERMITTED, not 409 ERR_PROJECT_NOT_COMMISSIONING"
            - "Project.${proj_r2}.delivery_status == DESIGN and acceptance_ready == false"
            - "Project.${proj_r2}.version == 1 (the refused call wrote nothing)"
            - "GET /projects/${proj_r2}/acceptance-certificates returns total_count == 0"

      - name: every_role_can_read_the_project_through_the_shared_get
        claim_type: role_allowed_operation
        grounds:
          - roles.ProjectDirector.shared_operations
          - roles.DesignEngineer.shared_operations
          - roles.ShopSupervisor.shared_operations
          - roles.SiteManager.shared_operations
          - roles.CustomerRep.shared_operations
          - endpoints[GET /projects/{id}]
        distinguishing_aspect: |
          All five roles receive 200 with the identical contract and share ledger from GET /projects/{id}, and the
          CustomerRep read succeeds for user cust-rep-99 who is not this project's bound rep — the priority-3
          customer binding constrains writes only.
        test_recipe:
          setup:
            - "One project created by pd-082 with customer_rep_user_id cust-rep-77 and no further activity."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-32", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-082"
              captures: { proj_r3: $.data.id }
          trigger:
            - call: "GET /projects/${proj_r3}"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-082"
            - call: "GET /projects/${proj_r3}"
              payload: {}
              as: DesignEngineer
            - call: "GET /projects/${proj_r3}"
              payload: {}
              as: ShopSupervisor
            - call: "GET /projects/${proj_r3}"
              payload: {}
              as: SiteManager
            - call: "GET /projects/${proj_r3}"
              payload: {}
              as: CustomerRep
              as_user_id: "cust-rep-99"
          assert:
            - "all five responses are 200"
            - "every response carries contract_value_cents == 243600000, escalation_fee_cents == 3600000 and legacy_share_bps == 10000"
            - "every response carries delivery_status DESIGN, commercial_status CLEAN and version == 1"
            - "the CustomerRep response is 200 even though cust-rep-99 != Project.customer_rep_user_id"

      - name: only_the_bound_customer_rep_can_record_a_change_order_decision
        claim_type: peer_role_isolation
        grounds:
          - roles.CustomerRep.note
          - validations[priority=3]
          - errors[ERR_NOT_PROJECT_CUSTOMER]
          - endpoints[POST /change-orders/{id}/review-decision]
        distinguishing_aspect: |
          A correctly-roled CustomerRep whose X-User-ID is cust-rep-99 is refused with 403 ERR_NOT_PROJECT_CUSTOMER
          on a SUBMITTED change order, while the bound rep cust-rep-77 approves the identical order with the same
          expected_project_version and reprices the contract to 253750000.
        test_recipe:
          setup:
            - "A project whose customer_rep_user_id is cust-rep-77, carrying one SUBMITTED price-only change order (scope_delta_cph 0, price_delta_cents 10000000)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-33", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-083"
              captures: { proj_r4: $.data.id }
            - call: "POST /change-orders"
              payload: { project_id: "${proj_r4}", title: "Additional merge conveyor controls", scope_delta_cph: 0, price_delta_cents: 10000000, schedule_delta_days: 5 }
              as: ProjectDirector
              as_user_id: "pd-083"
              captures: { co_r4: $.data.id }
            - call: "POST /change-orders/${co_r4}/submit"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-083"
            - call: "GET /projects/${proj_r4}"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-083"
              captures: { pv_r4: $.data.version }
          trigger:
            - call: "POST /change-orders/${co_r4}/review-decision"
              payload: { decision: "APPROVE", expected_project_version: "${pv_r4}" }
              as: CustomerRep
              as_user_id: "cust-rep-99"
              captures: { err_r4: $.data.error_id }
            - call: "POST /change-orders/${co_r4}/review-decision"
              payload: { decision: "APPROVE", expected_project_version: "${pv_r4}" }
              as: CustomerRep
              as_user_id: "cust-rep-77"
              captures: { co_status_r4: $.data.status }
          assert:
            - "the first call is 403 with error_id ERR_NOT_PROJECT_CUSTOMER, not 412 ERR_STALE_PROJECT_VERSION"
            - "after the first call ChangeOrder.${co_r4}.status is still SUBMITTED and Project.${proj_r4}.version == ${pv_r4}"
            - "the second call is 200 with ${co_status_r4} == APPROVED"
            - "Project.${proj_r4}.contract_value_cents == 253750000 and escalation_fee_cents == 3750000"
            - "Project.${proj_r4}.commercial_status == CLEAN and delivery_status == DESIGN (scope_delta_cph 0 reopens nothing)"

