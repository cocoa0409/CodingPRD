            - "the first sale succeeds and PermitRemitBatch.${b_id}.version has advanced by one from ${b_v}"
            - "the second sale reusing the stale ${b_v} is rejected with data.error_id == ERR_STALE_VERSION and http 412"
            - "PermitSale.${s1_id}.fee_cents == 3200 and its status == ISSUED, so the accepted sale is intact"
            - "the batch still holds exactly the one accepted sale, so the rejected call created no row"

      - name: derived_venue_occupancy_reconciles_after_each_release
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Attraction.fields.in_use_units
          - entities.Store.fields.dwell_committed_minutes
          - state_machines.AttractionSession.transitions.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: "The denormalised venue occupancy and the store dwell commit move together on confirmation, cancellation and completion, so no release path leaves either stale."
        test_recipe:
          setup: ["a store with an open aquarium of capacity 20 and two members"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/attractions"
              payload: { attraction_type: "AQUARIUM", capacity_units: 20, dwell_cost_minutes: 30 }
              as: StoreManager
              captures: { at_id: $.data.id }
            - call: "POST /stores/attractions/${at_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_df1@x.com", full_name: "Dell Frost", donation_opt_in: false }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_df2@x.com", full_name: "Dane Frost", donation_opt_in: false }
              as: Anonymous
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m1_id}", session_kind: "GENERAL_ADMISSION", party_size: 3, slot_start_utc: "2026-11-01T09:00:00Z", slot_end_utc: "2026-11-01T10:00:00Z" }
              as: AttractionHost
              captures: { s1_id: $.data.id }
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m2_id}", session_kind: "GENERAL_ADMISSION", party_size: 2, slot_start_utc: "2026-11-01T11:00:00Z", slot_end_utc: "2026-11-01T12:00:00Z" }
              as: AttractionHost
              captures: { s2_id: $.data.id }
            - call: "GET /stores/attractions/${at_id}"
              as: AttractionHost
            - call: "POST /stores/${st_id}/ops-run"
              payload: {}
              as: PlatformAdmin
            - call: "GET /stores/attractions/${at_id}"
              as: AttractionHost
            - call: "GET /stores/${st_id}/dwell-summary"
              as: StoreManager
          assert:
            - "at the first read Attraction.${at_id}.in_use_units == 5 across the two confirmed parties"
            - "the checkpoint moved both sessions to NO_SHOW, since both slots ended before the 2026-09-01 clock"
            - "at the second read Attraction.${at_id}.in_use_units == 0, so the derived occupancy reconciled"
            - "at the dwell summary Store.dwell_committed_minutes == 0, so the store-level derived field reconciled in the same operation"
            - "the two derived fields never disagree, so a no-show releases both the venue and the dwell budget"

      - name: future_slot_session_survives_a_checkpoint
        claim_type: scheduled_actions
        grounds:
          - endpoints.POST /stores/{store_id}/ops-run
          - state_machines.AttractionSession.transitions.WAITLIST_FALLBACK_to_CANCELLED
        distinguishing_aspect: "The checkpoint only expires work whose time window has passed, so a session booked beyond the clock instant is deferred rather than swept."
        test_recipe:
          setup: ["a store with an open aquarium and one member holding a session booked in 2027"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/attractions"
              payload: { attraction_type: "AQUARIUM", capacity_units: 20, dwell_cost_minutes: 30 }
              as: StoreManager
              captures: { at_id: $.data.id }
            - call: "POST /stores/attractions/${at_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_fu@x.com", full_name: "Fern Ude", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m_id}", session_kind: "GENERAL_ADMISSION", party_size: 2, slot_start_utc: "2027-06-01T10:00:00Z", slot_end_utc: "2027-06-01T11:00:00Z" }
              as: AttractionHost
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /stores/${st_id}/ops-run"
              payload: {}
              as: PlatformAdmin
            - call: "GET /stores/sessions/${s_id}"
              as: AttractionHost
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/ops-run"
              payload: {}
              as: PlatformAdmin
            - call: "GET /stores/sessions/${s_id}"
              as: AttractionHost
          assert:
            - "the first checkpoint leaves AttractionSession.${s_id}.status == CONFIRMED, since its slot is still a year ahead of the clock"
            - "Attraction.${at_id}.in_use_units == 2 after that checkpoint, so nothing was swept"
            - "once the clock moves past the slot the second checkpoint moves AttractionSession.${s_id}.status to NO_SHOW"
            - "Attraction.${at_id}.in_use_units == 0 only after the second checkpoint, so the deferral is explicit rather than silent"

      - name: session_list_pagination_with_status_filter
        claim_type: pagination_with_filtering
        grounds:
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - endpoints.GET /stores/sessions
        distinguishing_aspect: "Filtering by status composes with limit and offset, so total_count reflects the filtered set while has_more reflects the page boundary against that filtered set."
        test_recipe:
          setup: ["a store with an open aquarium and one member holding three confirmed sessions"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/attractions"
              payload: { attraction_type: "AQUARIUM", capacity_units: 40, dwell_cost_minutes: 30 }
              as: StoreManager
              captures: { at_id: $.data.id }
            - call: "POST /stores/attractions/${at_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_pg@x.com", full_name: "Page Dune", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m_id}", session_kind: "GENERAL_ADMISSION", party_size: 1, slot_start_utc: "2026-11-01T09:00:00Z", slot_end_utc: "2026-11-01T10:00:00Z" }
              as: AttractionHost
              captures: { s1_id: $.data.id }
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m_id}", session_kind: "GENERAL_ADMISSION", party_size: 1, slot_start_utc: "2026-11-01T10:00:00Z", slot_end_utc: "2026-11-01T11:00:00Z" }
              as: AttractionHost
              captures: { s2_id: $.data.id }
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m_id}", session_kind: "GENERAL_ADMISSION", party_size: 1, slot_start_utc: "2026-11-01T11:00:00Z", slot_end_utc: "2026-11-01T12:00:00Z" }
              as: AttractionHost
              captures: { s3_id: $.data.id }
            - call: "POST /stores/attraction-sessions/${s3_id}/cancel"
              payload: {}
              as: AttractionHost
          trigger:
            - call: "GET /stores/sessions?attraction_id=${at_id}&status=CONFIRMED&limit=1&offset=0"
              as: AttractionHost
            - call: "GET /stores/sessions?attraction_id=${at_id}&status=CANCELLED"
              as: AttractionHost
          assert:
            - "the filtered first page reports total_count == 2, counting only the confirmed sessions rather than all three"
            - "the filtered first page returns exactly 1 element and has_more == true"
            - "the cancelled-session query reports total_count == 1 and returns AttractionSession.${s3_id}"
            - "no response contains the cancelled session in the confirmed page, so the status filter is applied before the page boundary"

      - name: service_intake_forward_only_saga_leaves_prior_steps_intact
        claim_type: saga
        grounds:
          - state_machines.ServiceIntake.transitions.PERMIT_VERIFIED_to_MATERIALS_ORDERED
          - state_machines.ServiceIntake.transitions.INTAKE_QUOTED_to_PERMIT_VERIFIED
          - errors[ERR_OUTSTANDING_DEPOSIT_REQUIRED]
        distinguishing_aspect: "The intake is a forward-only saga: when the deposit gate fails at MATERIALS_ORDERED the earlier PERMIT_VERIFIED step and the lead-time extension it produced are not compensated, so the failure is local rather than a rollback."
        test_recipe:
          setup: ["a store, one member, one HUNTING permit and one verified outfitting intake with a deposit under the floor"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_sg@x.com", full_name: "Sage Rill", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/permit-remit-batches"
              payload: { window_start_utc: "2026-09-01T00:00:00Z", window_end_utc: "2026-09-30T00:00:00Z" }
              as: RemitAdmin
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /stores/${st_id}/permit-sales"
              payload: { member_id: "${m_id}", permit_type: "HUNTING", residency_class: "RESIDENT", term_days: 30, land_access_units: 0, agent_user_id: "clerk_4471", permit_remit_batch_id: "${b_id}", expected_remit_batch_version: "${b_v}" }
              as: PermitClerk
              captures: { ps_id: $.data.id }
            - call: "POST /stores/${st_id}/boat-units"
              payload: { stock_no: "BU-SG", model_name: "Bay 170", unit_price_cents: 4000000, unit_condition: "USED", hull_id_no: "HINSG0000001" }
              as: DealDeskClerk
              captures: { bu_id: $.data.id }
            - call: "POST /stores/${st_id}/service-orders"
              payload: { boat_unit_id: "${bu_id}", order_kind: "TAXIDERMY", promised_lead_days: 60 }
              as: ServiceWriter
              captures: { so_id: $.data.id }
            - call: "POST /stores/${st_id}/service-intakes"
              payload: { member_id: "${m_id}", service_order_id: "${so_id}", intake_kind: "TAXIDERMY", specimen_quantity: 2, quoted_lead_days: 60, deposit_cents: 100, species_code: "WTDEER", permit_sale_id: "${ps_id}" }
              as: ServiceWriter
              captures: { si_id: $.data.id }
            - call: "POST /stores/service-intakes/${si_id}/verify-permit"
              payload: {}
              as: ServiceWriter
            - call: "GET /stores/service-orders/${so_id}"
              as: ServiceTechnician
          trigger:
            - call: "POST /stores/service-intakes/${si_id}/order-materials"
              payload: {}
              as: ServiceWriter
              captures: { err: $.data.error_id }
            - call: "POST /stores/service-intakes/${si_id}/order-materials"
              payload: {}
              as: ServiceWriter
              captures: { err_repeat: $.data.error_id }
            - call: "GET /stores/service-intakes/${si_id}"
              as: ServiceWriter
            - call: "GET /stores/service-orders/${so_id}"
              as: ServiceTechnician
          assert:
            - "the materials step is rejected with data.error_id == ERR_OUTSTANDING_DEPOSIT_REQUIRED and http 422"
            - "ServiceIntake.${si_id}.status == PERMIT_VERIFIED after the failure and after an identical retry, so the step is not rolled back to INTAKE_QUOTED and the retry is refused the same way"
            - "ServiceIntake.${si_id}.project_charge_cents == 45000, the value the PERMIT_VERIFIED step wrote, and it was not recomputed downward"
            - "the linked ServiceOrder read reports ServiceOrder.${so_id}.promised_lead_days == 60, the value that stood before the verification step and which the verification step leaves in place because the PERMIT_VERIFIED quote of 45000 is already covered by the existing 60-day promise"
            - "the saga is forward-only: only the failed step is abandoned, and the step it abandoned had produced no side effects of its own to undo"

  # =========================================================================
  # Section: difficulty_overlap — corners already exercised by §1.8
  # =========================================================================
  - section: difficulty_overlap
    instances:

      - name: stale_permit_batch_version_already_asserted_in_difficulty_design
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[permit-sale-stale-batch-version]
          - errors[ERR_STALE_VERSION]
        excluded_because:
          difficulty_instance: permit_fee_rounding_order_divergence
          rationale: "The stale expected_remit_batch_version rejection is asserted as the negative path of the permit-sale chain in that §1.8 instance."

      - name: settlement_dual_variant_already_asserted_in_difficulty_design
        claim_type: dual_variant_calculation
        grounds:
          - calculations.delivery_settlement_variance
          - entities.BoatDeal.fields.settlement_variance_cents
        excluded_because:
          difficulty_instance: boat_deal_settlement_basis_divergence
          rationale: "Both variants of boat_deal_contract_price and the resulting settlement variance are asserted there."

      - name: title_rejection_compensation_already_asserted_in_difficulty_design
        claim_type: compensating_action
        grounds:
          - state_machines.BoatDeal.transitions.DELIVERED_to_CONTRACTED
        excluded_because:
          difficulty_instance: boat_deal_cyclic_title_rejection_revert
          rationale: "The revert hop zeroing the settlement variance is asserted there."

      - name: posture_gate_already_asserted_in_difficulty_design
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=8]
          - errors[ERR_POSTURE_FROZEN]
        excluded_because:
          difficulty_instance: attraction_session_confirmation_requires_open_posture
          rationale: "The posture gate on session confirmation is asserted there."
