roles:

  - name: PlatformAdmin
    description: "Grubhub Corporate platform operator. Owns programs and the restaurant catalogue; never touches employer money decisions."
    identity: opaque
    exclusive_operations:
      - "POST /meal-programs"
      - "PATCH /meal-programs/{id}"
      - "POST /restaurants"
      - "PATCH /restaurants/{id}"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /meal-programs/{id}"
      - "GET /meal-programs/{id}/employee-groups"
      - "GET /meal-programs/{id}/delivery-locations"
      - "GET /employee-groups/{id}"
      - "GET /employee-groups/{id}/budget-rules"
      - "GET /employees"
      - "GET /restaurants/{id}"

  - name: ProgramAdmin
    description: "Employer-side benefits operations. Structures the program, enrols employees, opens and closes budget periods."
    identity: opaque
    exclusive_operations:
      - "POST /meal-programs/{id}/employee-groups"
      - "POST /meal-programs/{id}/delivery-locations"
      - "POST /employees"
      - "POST /employees/{id}/deactivate"
      - "POST /benefit-periods"
      - "POST /benefit-periods/{id}/close"
