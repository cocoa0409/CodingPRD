# =============================================================================
# SCAFFOLD.yaml — task_3010_subscribe_save_discount_tiering_shipment_consolidation
# Subscribe & Save Discount Tiering & Shipment Consolidation
# =============================================================================

scenario: |
  Subscribe & Save Discount Tiering & Shipment Consolidation (Amazon): subscription
  cadence selection per item with next-delivery date computation, monthly
  consolidation of due subscriptions into a single delivery day with a
  shipment-count discount tier, price-at-ship rather than price-at-subscribe with
  cap and cancellation notification rules, item unavailability substitution and
  skip handling with tier recalculation, promotional add-on qualification and
  coupon stacking limits, cancellation and pause flows with retention offers,
  forecasted demand signal from active subscriptions feeding inventory placement,
  refund and reship handling when a consolidated shipment is damaged

domain_name: subscribe-save
api_prefix: /sns

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: event_sourcing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_actions
    - pagination_with_filtering
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  difficulty_level: beyond_expert

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Customer email, unique" }
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: region, type: string, source: input, description: "Customer fulfillment region code (e.g. US-WEST)" }
      - { name: preferred_delivery_day, type: integer, source: input, description: "Preferred consolidated delivery day-of-month, 1..28", default: 15 }
      - { name: account_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Promotional/goodwill credit balance, never negative", default: 0 }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock keeping unit, unique" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: region, type: string, source: input, description: "Fulfillment region the product is stocked in" }
      - { name: subscription_eligible, type: boolean, source: input, description: "Whether the product may be subscribed to", default: true }
      - { name: discontinued, type: boolean, source: input, description: "Manually discontinued flag", default: false }
      - { name: substitute_product_id, type: string, source: input, description: "FK -> Product.id; designated substitute used when this product is unavailable at lock; nullable" , default: null }
      - { name: availability_status, type: enum, source: computed, description: "IN_STOCK | OUT_OF_STOCK | DISCONTINUED; derived from inventory placements and discontinued flag" }
      - { name: current_price_cents, type: integer, source: computed, description: "Price from the latest PriceEvent with effective_from <= logical now; null if none" }

  - name: PriceEvent
    parent: null
    common_fields: false
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: price_cents, type: integer, source: input, description: "New unit price in cents, > 0" }
      - { name: effective_from, type: datetime, source: input, description: "ISO8601 instant from which the price applies; must be strictly greater than every existing effective_from for the product" }

  - name: InventoryPlacement
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: region, type: string, source: input, description: "Region this placement stocks; unique together with product_id" }
      - { name: received_total_units, type: integer, source: computed, description: "Cumulative units ever received", default: 0 }
      - { name: on_hand_units, type: integer, source: computed, description: "Unreserved units on hand", default: 0 }
      - { name: reserved_units, type: integer, source: computed, description: "Units reserved by locked plans", default: 0 }
      - { name: shipped_units, type: integer, source: computed, description: "Cumulative units shipped or reshipped", default: 0 }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: cadence_months, type: integer, source: input, description: "Delivery cadence in months, 1..6" }
      - { name: quantity, type: integer, source: input, description: "Units per delivery, 1..30" }
      - { name: start_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) of first delivery; must be >= logical today + 2 days" }
      - { name: next_delivery_date, type: string, source: computed, description: "ISO date of the next scheduled delivery; start_date at creation, advanced by cadence with month-end clamping after each plan generation" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED | PENDING_CANCEL | CANCELLED" }
      - { name: price_cap_cents, type: integer, source: input, description: "Optional maximum acceptable unit price at ship time, > 0; null = uncapped", default: null }
      - { name: subscribe_price_cents, type: integer, source: computed, description: "Product current_price_cents captured at subscription creation; baseline for the price-increase notice" }

  - name: DeliveryPlan
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: delivery_month, type: string, source: computed, description: "Consolidation month, YYYY-MM" }
      - { name: delivery_date, type: string, source: computed, description: "ISO date: customer's preferred_delivery_day within delivery_month" }
      - { name: plan_status, type: enum, source: system, description: "OPEN | LOCKED | SHIPPED | DELIVERED | RESOLVED | CANCELLED" }
      - { name: active_line_count, type: integer, source: computed, description: "Count of PlanLines with line_status == SCHEDULED, is_bonus == false, quantity >= 1" }
      - { name: tier_discount_pct, type: number, source: computed, description: "0.00, 0.05, or 0.10 per tier_discount_selection" }
      - { name: estimated_total_cents, type: integer, source: computed, description: "Provisional total computed at generation/refresh from then-current prices" }
      - { name: charged_total_cents, type: integer, source: computed, description: "Final price-at-ship total after tier and coupons; null until lock" }
      - { name: gross_line_total_cents, type: integer, source: computed, description: "Sum of line_charged_cents over all lines charged at lock (excludes AUTO_SKIPPED/SKIPPED lines and coupons); invariant anchor", default: 0 }
      - { name: refunded_total_cents, type: integer, source: computed, description: "Sum of refunded line charges from approved damage claims", default: 0 }
      - { name: applied_coupon_codes, type: array, source: computed, description: "Coupon codes attached to the plan, in attach order" }

  - name: PlanLine
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> DeliveryPlan.id" }
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; null for bonus lines" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; rewritten to the substitute product when substitution fires" }
      - { name: quantity, type: integer, source: computed, description: "Units; copied from subscription at generation, 1 for bonus lines" }
      - { name: is_bonus, type: boolean, source: computed, description: "True for promotional add-on lines; excluded from tier count and discounts", default: false }
      - { name: was_substituted, type: boolean, source: computed, description: "True when the line's product was replaced by its designated substitute at lock", default: false }
      - { name: line_status, type: enum, source: system, description: "SCHEDULED | SKIPPED | AUTO_SKIPPED | SHIPPED | REFUNDED | RESHIPPED" }
      - { name: skip_reason, type: enum, source: system, description: "CUSTOMER | PRICE_CAP | UNAVAILABLE; null unless line is SKIPPED or AUTO_SKIPPED" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Price-at-ship unit price resolved at lock; null until lock" }
      - { name: line_charged_cents, type: integer, source: computed, description: "round_half_up(unit_price_cents * quantity * (1 - tier_discount_pct)); null until lock" }

  - name: Coupon
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique coupon code" }
      - { name: discount_type, type: enum, source: input, description: "PERCENT | FLAT" }
      - { name: percent_off, type: number, source: input, description: "Fraction in (0, 1]; required when discount_type == PERCENT", default: null }
      - { name: flat_off_cents, type: integer, source: input, description: "Flat cents off, > 0; required when discount_type == FLAT", default: null }
      - { name: stackable, type: boolean, source: input, description: "May combine with other coupons", default: false }
      - { name: min_subtotal_cents, type: integer, source: input, description: "Minimum plan estimated subtotal at attach time (inclusive)", default: 0 }
      - { name: valid_from, type: string, source: input, description: "ISO date; coupon valid when plan delivery_date >= valid_from" }
      - { name: valid_to, type: string, source: input, description: "ISO date; coupon valid when plan delivery_date <= valid_to (inclusive)" }
      - { name: coupon_status, type: enum, source: system, description: "ACTIVE | DISABLED" }

  - name: Promotion
    parent: null
    common_fields: true
    fields:
      - { name: bonus_product_id, type: string, source: input, description: "FK -> Product.id; product granted as a zero-price bonus line" }
      - { name: min_line_count, type: integer, source: input, description: "Minimum plan active_line_count (inclusive) for the bonus to attach at lock" }
      - { name: starts_on, type: string, source: input, description: "ISO date; half-open window start (inclusive)" }
      - { name: ends_on, type: string, source: input, description: "ISO date; half-open window end (exclusive)" }
      - { name: promotion_status, type: enum, source: system, description: "ACTIVE | DISABLED" }

  - name: RetentionOffer
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id" }
      - { name: offer_type, type: enum, source: system, description: "CREDIT (fixed 500 cents goodwill credit)" }
      - { name: credit_amount_cents, type: integer, source: system, description: "Credit granted on accept; fixed at 500" }
      - { name: offer_status, type: enum, source: system, description: "OFFERED | ACCEPTED | DECLINED | EXPIRED" }
      - { name: expires_on, type: string, source: computed, description: "ISO date = cancel request date + 7 days; OFFERED offers lapse when logical today > expires_on" }

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> DeliveryPlan.id" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; copied from the plan" }
      - { name: damaged_line_ids, type: array, source: input, description: "Non-empty array of PlanLine ids belonging to the plan, each in SHIPPED status" }
      - { name: claim_status, type: enum, source: system, description: "REPORTED | APPROVED_RESHIP | REJECTED | COMPLETED" }
      - { name: claim_refund_cents, type: integer, source: computed, description: "Sum of damaged lines' line_charged_cents when approved for refund; null otherwise" }

  - name: Reshipment
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> DamageClaim.id" }
      - { name: reshipped_line_ids, type: array, source: computed, description: "PlanLine ids copied from the claim's damaged_line_ids" }
      - { name: reshipment_status, type: enum, source: system, description: "PENDING | DISPATCHED | DELIVERED" }

  - name: DemandForecast
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id" }
      - { name: region, type: string, source: system, description: "Forecast region (equals product region)" }
      - { name: forecast_month, type: string, source: system, description: "YYYY-MM" }
      - { name: committed_units, type: integer, source: computed, description: "Sum of quantity over ACTIVE subscriptions for the product whose next_delivery_date falls in forecast_month" }
      - { name: provisional_units, type: integer, source: computed, description: "committed_units + floor(0.5 * sum of quantity over PAUSED subscriptions in scope)" }

  - name: Notification
    parent: null
    common_fields: false
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: notification_type, type: enum, source: system, description: "OFFER_CREATED | OFFER_EXPIRED | PRICE_INCREASE | PRICE_CAP_SKIP | PLAN_SHIPPED | RESHIP_DISPATCHED" }
      - { name: message, type: string, source: system, description: "Human-readable notification body" }
      - { name: related_plan_id, type: string, source: system, description: "Related delivery plan id where applicable; plain reference, nullable", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    field: account_status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /sns/customers/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "account_status == ACTIVE"
        side_effects:
          - "Customer excluded from future generate-plans runs"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /sns/customers/{id}/unsuspend"
        actor: PlatformAdmin
        preconditions:
          - "account_status == SUSPENDED"
        side_effects: []

  - entity: Subscription
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /sns/subscriptions/{id}/pause"
        actor: Customer
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "Subscription excluded from future generate-plans runs and from committed forecast units"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /sns/subscriptions/{id}/resume"
        actor: Customer
        preconditions:
          - "status == PAUSED"
          - "Customer.account_status == ACTIVE"
        side_effects:
          - "next_delivery_date advanced by cadence_months (month-end clamped) until >= logical today + 2 days"
      - from: ACTIVE
        to: PENDING_CANCEL
        trigger: "POST /sns/subscriptions/{id}/cancel"
        actor: Customer
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "Creates RetentionOffer(OFFERED, CREDIT 500, expires_on = logical today + 7 days)"
          - "Creates Notification(OFFER_CREATED)"
      - from: PAUSED
        to: PENDING_CANCEL
        trigger: "POST /sns/subscriptions/{id}/cancel"
        actor: Customer
        preconditions:
          - "status == PAUSED"
        side_effects:
          - "Creates RetentionOffer(OFFERED, CREDIT 500, expires_on = logical today + 7 days)"
          - "Creates Notification(OFFER_CREATED)"
      - from: PENDING_CANCEL
        to: ACTIVE
        trigger: "POST /sns/retention-offers/{id}/accept"
        actor: Customer
        preconditions:
          - "offer.offer_status == OFFERED"
          - "subscription.status == PENDING_CANCEL"
          - "logical today <= offer.expires_on"
        side_effects:
          - "RetentionOffer.offer_status -> ACCEPTED"
          - "Customer.credit_balance_cents += 500"
      - from: PENDING_CANCEL
        to: CANCELLED
        trigger: "POST /sns/retention-offers/{id}/decline"
        actor: Customer
        preconditions:
          - "offer.offer_status == OFFERED"
          - "subscription.status == PENDING_CANCEL"
        side_effects:
          - "RetentionOffer.offer_status -> DECLINED"
      - from: PENDING_CANCEL
        to: CANCELLED
        trigger: "system (lazy evaluation on any read/mutation of the subscription or its OFFERED offer when logical today > expires_on)"
        actor: system
        preconditions:
          - "offer.offer_status == OFFERED and logical today > offer.expires_on"
        side_effects:
          - "RetentionOffer.offer_status -> EXPIRED"
          - "Creates Notification(OFFER_EXPIRED)"

  - entity: DeliveryPlan
    field: plan_status
    initial_state: OPEN
    terminal_states: [RESOLVED, CANCELLED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /sns/delivery-plans/{id}/lock"
        actor: Customer
        preconditions:
          - "plan_status == OPEN"
        side_effects:
          - "Runs lock_evaluation_pipeline (price-at-ship, substitution, cap auto-skip, tier, per-line charges, coupons, bonus lines)"
          - "Reserves inventory: for each remaining SCHEDULED non-bonus line, placement.on_hand_units -= quantity and placement.reserved_units += quantity; this decrement itself flips Product.availability_status to OUT_OF_STOCK when on_hand reaches 0"
          - "Creates Notification(PRICE_CAP_SKIP) for each line auto-skipped for PRICE_CAP"
          - "Creates Notification(PRICE_INCREASE) for each line whose locked unit price exceeds subscribe_price_cents * 1.10"
          - "Sets charged_total_cents, gross_line_total_cents, tier_discount_pct, active_line_count"
      - from: LOCKED
        to: SHIPPED
        trigger: "POST /sns/delivery-plans/{id}/ship"
        actor: PlatformAdmin
        preconditions:
          - "plan_status == LOCKED"
        side_effects:
          - "Each SCHEDULED PlanLine -> SHIPPED"
          - "For each shipped non-bonus line: placement.reserved_units -= quantity and placement.shipped_units += quantity"
          - "Creates Notification(PLAN_SHIPPED)"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /sns/delivery-plans/{id}/mark-delivered"
        actor: PlatformAdmin
        preconditions:
          - "plan_status == SHIPPED"
        side_effects: []
      - from: DELIVERED
        to: RESOLVED
        trigger: "POST /sns/delivery-plans/{id}/resolve"
        actor: SupportAgent
        preconditions:
          - "plan_status == DELIVERED"
          - "No DamageClaim for this plan in REPORTED or APPROVED_RESHIP"
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /sns/delivery-plans/{id}/cancel"
        actor: SupportAgent
        preconditions:
          - "plan_status == OPEN"
        side_effects:
          - "Every SCHEDULED line -> SKIPPED with skip_reason CUSTOMER"
          - "Subscriptions are untouched and will be re-planned on the next generate-plans run"

  - entity: PlanLine
    field: line_status
    initial_state: SCHEDULED
    terminal_states: [REFUNDED]
    transitions:
      - from: SCHEDULED
        to: SKIPPED
        trigger: "POST /sns/delivery-plans/{id}/lines/{line_id}/skip"
        actor: Customer
        preconditions:
          - "line_status == SCHEDULED"
          - "plan.plan_status == OPEN"
          - "is_bonus == false"
        side_effects:
          - "skip_reason = CUSTOMER"
          - "plan.active_line_count recomputed; the count change itself re-triggers tier_discount_selection; the tier change itself re-triggers estimated line repricing; plan.estimated_total_cents recomputed"
      - from: SKIPPED
        to: SCHEDULED
        trigger: "POST /sns/delivery-plans/{id}/lines/{line_id}/unskip"
        actor: Customer
        preconditions:
          - "line_status == SKIPPED and skip_reason == CUSTOMER"
          - "plan.plan_status == OPEN"
          - "subscription.status == ACTIVE"
        side_effects:
          - "skip_reason = null"
          - "plan.active_line_count, tier_discount_pct, estimated_total_cents recomputed"
      - from: SCHEDULED
        to: AUTO_SKIPPED
        trigger: "system (during lock or refresh: price cap breached, or unavailable with no viable substitute)"
        actor: system
        preconditions:
          - "lock_evaluation_pipeline step 3 (cap) or step 2 (availability/substitution) fails for the line"
        side_effects:
          - "skip_reason = PRICE_CAP or UNAVAILABLE"
          - "Notification(PRICE_CAP_SKIP) created when reason is PRICE_CAP"
          - "plan.active_line_count recomputed; count change re-triggers tier_discount_selection; tier change re-triggers per-line charge recompute; plan totals recomputed"
      - from: AUTO_SKIPPED
        to: SCHEDULED
        trigger: "system (during refresh while plan OPEN: price back under cap and product available)"
        actor: system
        preconditions:
          - "plan.plan_status == OPEN"
          - "current unit price <= subscription.price_cap_cents (or cap is null) and product availability_status == IN_STOCK with sufficient on_hand"
        side_effects:
          - "skip_reason = null"
          - "plan.active_line_count, tier_discount_pct, estimated_total_cents recomputed"
      - from: SCHEDULED
        to: SHIPPED
        trigger: "system (POST /sns/delivery-plans/{id}/ship)"
        actor: system
        preconditions:
          - "plan.plan_status == LOCKED"
        side_effects:
          - "Inventory reserve released to shipped for the line quantity"
      - from: SHIPPED
        to: REFUNDED
        trigger: "system (DamageClaim review decision APPROVE_REFUND)"
        actor: system
        preconditions:
          - "line listed in claim.damaged_line_ids"
        side_effects:
          - "plan.refunded_total_cents += line_charged_cents"
      - from: SHIPPED
        to: RESHIPPED
        trigger: "system (DamageClaim review decision APPROVE_RESHIP)"
        actor: system
        preconditions:
          - "line listed in claim.damaged_line_ids"
        side_effects:
          - "Line id copied into the new Reshipment.reshipped_line_ids"

  - entity: DamageClaim
    field: claim_status
    initial_state: REPORTED
    terminal_states: [REJECTED, COMPLETED]
    transitions:
      - from: REPORTED
        to: COMPLETED
        trigger: "POST /sns/damage-claims/{id}/review with decision APPROVE_REFUND"
        actor: SupportAgent
        preconditions:
          - "claim_status == REPORTED"
        side_effects:
          - "claim_refund_cents = sum of damaged lines' line_charged_cents"
          - "Each damaged PlanLine -> REFUNDED; that flip itself credits plan.refunded_total_cents"
      - from: REPORTED
        to: APPROVED_RESHIP
        trigger: "POST /sns/damage-claims/{id}/review with decision APPROVE_RESHIP"
        actor: SupportAgent
        preconditions:
          - "claim_status == REPORTED"
          - "For every damaged line, the line's product has an InventoryPlacement in the plan customer's region with on_hand_units >= line quantity"
        side_effects:
          - "Creates Reshipment(PENDING) with reshipped_line_ids = damaged_line_ids"
          - "Each damaged PlanLine -> RESHIPPED"
      - from: APPROVED_RESHIP
        to: COMPLETED
        trigger: "system (Reshipment reaches DELIVERED)"
        actor: system
        preconditions:
          - "reshipment.reshipment_status == DELIVERED"
        side_effects: []
      - from: REPORTED
        to: REJECTED
        trigger: "POST /sns/damage-claims/{id}/review with decision REJECT"
        actor: SupportAgent
        preconditions:
          - "claim_status == REPORTED"
        side_effects: []

  - entity: Reshipment
    field: reshipment_status
    initial_state: PENDING
    terminal_states: [DELIVERED]
    transitions:
      - from: PENDING
        to: DISPATCHED
        trigger: "POST /sns/reshipments/{id}/dispatch"
        actor: PlatformAdmin
        preconditions:
          - "reshipment_status == PENDING"
          - "For every reshipped line, placement on_hand_units >= line quantity"
        side_effects:
          - "For each reshipped line: placement.on_hand_units -= quantity and placement.shipped_units += quantity"
          - "Any product whose on_hand reaches 0 flips availability_status to OUT_OF_STOCK"
          - "Creates Notification(RESHIP_DISPATCHED)"
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /sns/reshipments/{id}/mark-delivered"
        actor: PlatformAdmin
        preconditions:
          - "reshipment_status == DISPATCHED"
        side_effects:
          - "DamageClaim -> COMPLETED"

  - entity: Coupon
    field: coupon_status
    initial_state: ACTIVE
    terminal_states: [DISABLED]
    transitions:
      - from: ACTIVE
        to: DISABLED
        trigger: "POST /sns/coupons/{id}/disable"
        actor: PlatformAdmin
        preconditions:
          - "coupon_status == ACTIVE"
        side_effects:
          - "Coupon may no longer be attached to plans"

  - entity: Promotion
    field: promotion_status
    initial_state: ACTIVE
    terminal_states: [DISABLED]
    transitions:
      - from: ACTIVE
        to: DISABLED
        trigger: "POST /sns/promotions/{id}/disable"
        actor: PlatformAdmin
        preconditions:
          - "promotion_status == ACTIVE"
        side_effects:
          - "Promotion no longer qualifies plans at lock"

  - entity: RetentionOffer
    field: offer_status
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /sns/retention-offers/{id}/accept"
        actor: Customer
        preconditions:
          - "offer_status == OFFERED"
          - "logical today <= expires_on"
        side_effects:
          - "Subscription -> ACTIVE; Customer.credit_balance_cents += 500"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /sns/retention-offers/{id}/decline"
        actor: Customer
        preconditions:
          - "offer_status == OFFERED"
        side_effects:
          - "Subscription -> CANCELLED"
      - from: OFFERED
        to: EXPIRED
        trigger: "system (lazy evaluation when logical today > expires_on)"
        actor: system
        preconditions:
          - "logical today > expires_on"
        side_effects:
          - "Subscription -> CANCELLED; Notification(OFFER_EXPIRED)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: plan-refresh-stale-version
    parent_entity: DeliveryPlan
    write_endpoint: "POST /sns/delivery-plans/{id}/refresh"
    occ_field: "expected_plan_version"
    description: |
      Refreshing a DeliveryPlan whose version has advanced since the client last
      observed it is rejected. Refresh legitimately supersedes the plan's computed
      estimate snapshot (re-running substitution, cap re-evaluation, tier, and
      estimated totals), so a client holding an older version is writing against
      a stale basis and must re-read the plan first.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: next_delivery_date_compute
    trigger: "subscription create; generate-plans advances each included subscription; resume fix-up; cadence change via PATCH"
    algorithm: chronological
    formula: |
      add_months_clamped(date, n):
        y, m = date.year, date.month + n
        while m > 12: y += 1; m -= 12
        d = min(date.day, days_in_month(y, m))
        return date(y, m, d)
      At creation: next_delivery_date = start_date.
      After a subscription is consolidated into a generated plan:
        next_delivery_date = add_months_clamped(previous next_delivery_date, cadence_months).
      On resume: while next_delivery_date < logical_today + 2 days:
        next_delivery_date = add_months_clamped(next_delivery_date, cadence_months).
      On cadence PATCH: anchor = add_months_clamped(next_delivery_date, -old_cadence_months);
        next = add_months_clamped(anchor, new_cadence_months);
        while next < logical_today + 2 days: next = add_months_clamped(next, new_cadence_months).
    input_set: "the subscription itself"
    constants:
      MIN_START_LEAD_DAYS: 2
      MIN_CADENCE_MONTHS: 1
      MAX_CADENCE_MONTHS: 6
    precision: "date arithmetic, month-end clamped"

  - name: delivery_consolidation_grouping
    trigger: "POST /sns/ops/generate-plans"
    algorithm: aggregation
    formula: |
      For each Customer with account_status == ACTIVE and no existing DeliveryPlan
      with delivery_month == requested month:
        eligible subscriptions = status == ACTIVE AND next_delivery_date within
          [month_start, month_end] (inclusive both ends).
        If the eligible set is empty, no plan is created for that customer.
        Otherwise create DeliveryPlan(OPEN) with delivery_date =
          date(month, customer.preferred_delivery_day) and one PlanLine(SCHEDULED)
          per eligible subscription (quantity copied, product copied).
        Then each included subscription's next_delivery_date advances per
        next_delivery_date_compute.
      Estimated totals are computed at generation from current prices using the
      same tier/rounding pipeline as lock (variant: estimated).
    input_set: "subscriptions with status == ACTIVE whose next_delivery_date falls in the requested calendar month; customers with account_status == ACTIVE"
    constants: {}
    precision: "dates inclusive"

  - name: tier_discount_selection
    trigger: "lock; refresh; skip; unskip; auto-skip/unskip during lock or refresh"
    algorithm: threshold
    formula: |
      n = count of PlanLines in the plan with line_status == SCHEDULED
          AND is_bonus == false AND quantity >= 1
      tier_discount_pct = 0.10 if n >= 5 else (0.05 if n >= 3 else 0.00)
      Boundaries are inclusive: n == 3 earns 0.05, n == 5 earns 0.10.
    input_set: "plan lines as filtered above"
    constants:
      TIER_MID_MIN_LINES: 3
      TIER_MID_PCT: 0.05
      TIER_TOP_MIN_LINES: 5
      TIER_TOP_PCT: 0.10
    precision: "exact fraction comparison"

  - name: line_charging_and_total
    trigger: "lock (charged variant); generation and refresh (estimated variant)"
    algorithm: tiered_pricing
    formula: |
      For each SCHEDULED non-bonus line:
        line_charged_cents = round_half_up(unit_price_cents * quantity * (1 - tier_discount_pct))
      Bonus lines: unit_price_cents = 0, line_charged_cents = 0.
      gross_line_total_cents = sum over SCHEDULED lines (incl. bonus) of line_charged_cents
      ROUNDING ORDER IS PINNED: each line is rounded to whole cents with
      round_half_up FIRST, then the rounded line values are summed. Computing the
      discount on the unrounded sum and rounding once at the end is FORBIDDEN.
    input_set: "SCHEDULED lines of the plan"
    constants: {}
    precision: "0 decimal places (integer cents), round_half_up, per-line then sum"

  - name: price_at_ship_resolution
    trigger: "lock (final); subscription create (subscribe_price baseline); generation/refresh (estimated)"
    algorithm: chronological
    formula: |
      unit_price(product, at_time) = price_cents of the PriceEvent for the product
      with the greatest effective_from <= at_time; undefined if none.
      FINAL (at lock): line.unit_price_cents = unit_price(line.product_id, lock time).
      ESTIMATED (at generation/refresh): estimate uses unit_price(product, that
      earlier evaluation time), so a price change between generation and lock makes
      estimated_total_cents and charged_total_cents diverge for identical lines.
    input_set: "PriceEvents of the line's product"
    constants: {}
    precision: "integer cents"
    variants:
      - name: estimated
        when: "plan generation and refresh while plan is OPEN"
        difference: "uses prices effective at the earlier generation/refresh instant"
      - name: final
        when: "plan lock"
        difference: "uses prices effective at the lock instant; writes unit_price_cents and charged totals"

  - name: lock_evaluation_pipeline
    trigger: "POST /sns/delivery-plans/{id}/lock (and steps 1-3 during refresh)"
    algorithm: constraint_propagation
    formula: |
      The pipeline has a pinned evaluation order — later steps observe earlier
      steps' outputs, never the reverse:
      (1) Availability & substitution: for each SCHEDULED non-bonus line, if the
          product's placement in the customer region has on_hand_units < quantity:
          if product.substitute_product_id is set, the substitute is IN_STOCK in
          region with on_hand >= quantity, and substitute passes the cap check
          (step 3 applied to the substitute price), rewrite line.product_id to the
          substitute and set was_substituted = true; otherwise AUTO_SKIPPED
          (reason UNAVAILABLE).
      (2) Price-at-ship: unit_price_cents resolved per price_at_ship_resolution
          (final variant) on the (possibly substituted) product.
      (3) Cap check: if subscription.price_cap_cents is not null and
          unit_price_cents > price_cap_cents, line -> AUTO_SKIPPED (reason
          PRICE_CAP). The cap compares the PRE-TIER unit price; equality passes.
      (4) Tier: tier_discount_selection over the surviving SCHEDULED lines.
      (5) Charges: line_charging_and_total (per-line round, then sum).
      (6) Coupons: coupon_discount_application over gross_line_total_cents.
      (7) Promotions: promotion_bonus_qualification appends bonus lines AFTER the
          tier is fixed; bonus lines never feed back into step (4).
      The apparent circularity (tier depends on surviving lines; survivors depend
      on cap checks; cap checks depend on prices; prices depend on substitution)
      is resolved by this fixed order.
    input_set: "plan lines, subscriptions, products, placements, price events"
    constants: {}
    precision: "as per sub-calculations"

  - name: coupon_discount_application
    trigger: "lock (charged); generation/refresh (estimated)"
    algorithm: chronological
    formula: |
      total = gross_line_total_cents
      For each attached coupon in attach order (chronological by attach time,
      tie-break created_at ASC):
        PERCENT p: total = round_half_up(total * (1 - p))
        FLAT f:    total = max(0, total - f)
      charged_total_cents (or estimated_total_cents) = total.
      Each PERCENT step rounds half-up to whole cents before the next step.
    input_set: "coupons in plan.applied_coupon_codes order"
    constants:
      MAX_COUPONS_PER_PLAN: 2
    precision: "integer cents, round_half_up per step"

  - name: promotion_bonus_qualification
    trigger: "lock, after tier and charges are fixed"
    algorithm: threshold
    formula: |
      For each Promotion with promotion_status == ACTIVE and
      starts_on <= plan.delivery_date < ends_on (half-open):
        if plan.active_line_count >= promotion.min_line_count:
          append PlanLine(is_bonus = true, quantity = 1, unit_price_cents = 0,
          line_charged_cents = 0, product_id = promotion.bonus_product_id,
          subscription_id = null).
      Bonus lines do NOT count toward active_line_count and are not discounted.
      Multiple qualifying promotions each append one bonus line, processed in
      promotion created_at ASC order.
    input_set: "ACTIVE promotions whose half-open window contains delivery_date"
    constants: {}
    precision: "inclusive lower bound, exclusive upper bound"

  - name: demand_forecast_units
    trigger: "POST /sns/ops/recompute-forecasts"
    algorithm: aggregation
    formula: |
      For each Product with region == requested region, over subscriptions of that
      product whose next_delivery_date falls within [month_start, month_end] of
      forecast_month (inclusive):
        committed_units  = sum(quantity) over status == ACTIVE
        provisional_units = committed_units + floor(0.5 * sum(quantity) over status == PAUSED)
      PENDING_CANCEL and CANCELLED subscriptions are excluded from both variants.
      Creates or updates the DemandForecast row keyed on (product_id, region, forecast_month).
    input_set: "subscriptions as filtered above"
    constants:
      PAUSED_WEIGHT: 0.5
    precision: "integer units, floor on the paused contribution"
    variants:
      - name: committed
        when: "inventory placement buys"
        difference: "ACTIVE subscriptions only"
      - name: provisional
        when: "planning view"
        difference: "adds half-weight PAUSED demand, floored"

  - name: price_increase_notice
    trigger: "lock, per charged line"
    algorithm: threshold
    formula: |
      For each SCHEDULED non-bonus line at lock:
        if unit_price_cents > round_half_up(subscription.subscribe_price_cents * 1.10):
          create Notification(PRICE_INCREASE) for the customer.
      Comparison is strict: a locked price exactly at 110% of the subscribe price
      does NOT notify.
    input_set: "charged lines with their subscriptions"
    constants:
      INCREASE_THRESHOLD: 1.10
    precision: "round_half_up on the threshold baseline"

  - name: damage_refund_amount
    trigger: "DamageClaim review APPROVE_REFUND"
    algorithm: aggregation
    formula: |
      claim_refund_cents = sum(line_charged_cents) over the claim's damaged lines.
      plan.refunded_total_cents += claim_refund_cents.
      Promotional coupon discounts are forfeited on refund: the refund is the
      line_charged_cents, NOT a coupon-prorated amount.
      INVARIANT (money): for every LOCKED-or-later plan,
        gross_line_total_cents ==
          sum(line_charged_cents over lines in {SHIPPED, RESHIPPED})
          + refunded_total_cents
          + sum(line_charged_cents over lines still SCHEDULED).
    input_set: "damaged lines in SHIPPED status at review"
    constants: {}
    precision: "integer cents"

  - name: inventory_conservation
    trigger: "receive; lock (reserve); ship (release); reshipment dispatch"
    algorithm: aggregation
    formula: |
      INVARIANT (units): for every InventoryPlacement,
        received_total_units == on_hand_units + reserved_units + shipped_units.
      receive(u): received += u; on_hand += u.
      lock reserve(q): on_hand -= q; reserved += q.
      ship release(q): reserved -= q; shipped += q.
      reship dispatch(q): on_hand -= q; shipped += q.
      No operation may drive on_hand_units or reserved_units below 0.
    input_set: "the placement row"
    constants: {}
    precision: "integer units"

  - name: availability_derivation
    trigger: "any mutation of InventoryPlacement.on_hand_units or Product.discontinued"
    algorithm: constraint_propagation
    formula: |
      Product.availability_status =
        DISCONTINUED if product.discontinued == true
        else IN_STOCK if sum(on_hand_units over the product's placements
                             with region == product.region) > 0
        else OUT_OF_STOCK
    input_set: "placements matching the product's region"
    constants: {}
    precision: "exact integer comparison"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: business_constraint
    check: "Request body well-formed: all required fields present, no unknown fields, field types match"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role header is one of the declared roles and X-User-ID header is present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: auth
    check: "Customer role may only touch resources whose owning chain (plan/subscription/claim/offer) resolves to X-User-ID; subscription create body customer_id must equal X-User-ID"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "customer-scoped endpoints"
  - priority: 5
    category: existence
    check: "Path and body referenced resources exist, validated left-to-right (plan before line, product before price event, etc.)"
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "all (per-resource: ERR_CUSTOMER_NOT_FOUND, ERR_PRODUCT_NOT_FOUND, ERR_SUBSCRIPTION_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_LINE_NOT_FOUND, ERR_COUPON_NOT_FOUND, ERR_PROMOTION_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_OFFER_NOT_FOUND, ERR_RESHIPMENT_NOT_FOUND, ERR_FORECAST_NOT_FOUND)"
  - priority: 6
    category: state
    check: "Target resource is in a state that permits the operation (per state machine preconditions; includes OCC expected_plan_version match on refresh)"
    error_id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http_status: 409
    applies_to: "state-gated endpoints (per-endpoint: ERR_SUBSCRIPTION_NOT_ACTIVE, ERR_PLAN_NOT_OPEN, ERR_PLAN_NOT_LOCKED, ERR_PLAN_NOT_DELIVERED, ERR_CLAIM_NOT_REVIEWABLE, ERR_OFFER_NOT_OPEN, ERR_CUSTOMER_SUSPENDED, ERR_STALE_PLAN_VERSION 412)"
  - priority: 7
    category: business_constraint
    check: "Scalar domain constraints: cadence_months in 1..6, preferred_delivery_day in 1..28, quantity in 1..30, price_cap_cents > 0, claim damaged_line_ids non-empty and all in SHIPPED status on the plan"
    error_id: ERR_INVALID_CADENCE
    http_status: 422
    applies_to: "mutation endpoints (per-rule: ERR_INVALID_CADENCE, ERR_INVALID_DELIVERY_DAY, ERR_QUANTITY_OUT_OF_RANGE, ERR_START_DATE_TOO_SOON, ERR_CLAIM_LINES_INVALID)"
  - priority: 8
    category: business_referential
    check: "Referenced catalog entities usable: product subscription_eligible and not discontinued, product has a current price, substitute product exists"
    error_id: ERR_PRODUCT_NOT_SUBSCRIBABLE
    http_status: 422
    applies_to: "subscription create, product patch, promotion create (per-rule: ERR_PRODUCT_NOT_SUBSCRIBABLE, ERR_PRODUCT_WITHOUT_PRICE)"
  - priority: 9
    category: business_temporal
    check: "Temporal rules: start_date >= logical today + 2; coupon window contains delivery_date; price event effective_from strictly increasing per product; promotion half-open windows for the same bonus product do not overlap; retention offer not expired"
    error_id: ERR_START_DATE_TOO_SOON
    http_status: 422
    applies_to: "date/window-bearing endpoints (per-rule: ERR_START_DATE_TOO_SOON, ERR_COUPON_NOT_YET_VALID, ERR_COUPON_EXPIRED, ERR_PRICE_EVENT_NOT_MONOTONIC 409, ERR_PROMOTION_WINDOW_OVERLAP 409)"
  - priority: 10
    category: business_fiscal
    check: "Money/stock gates: plan estimated subtotal >= coupon min_subtotal_cents; coupon stacking limits; reship review/dispatch stock sufficiency"
    error_id: ERR_SUBTOTAL_BELOW_COUPON_MIN
    http_status: 422
    applies_to: "coupon attach, claim review, reshipment dispatch (per-rule: ERR_SUBTOTAL_BELOW_COUPON_MIN, ERR_COUPON_NOT_STACKABLE, ERR_COUPON_STACK_LIMIT, ERR_INSUFFICIENT_INVENTORY)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/sns/customers", description: "Create a customer account", roles: [PlatformAdmin], code: 201, input: [email, full_name, region, "preferred_delivery_day?"], output: Customer, side_effects: [] }
  - { method: GET, path: "/sns/customers/{id}", description: "Read a customer", roles: [PlatformAdmin, SupportAgent, Customer], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: PATCH, path: "/sns/customers/{id}", description: "Update preferred_delivery_day", roles: [PlatformAdmin, Customer], code: 200, input: ["preferred_delivery_day?"], output: Customer, side_effects: [] }
  - { method: POST, path: "/sns/customers/{id}/suspend", description: "Suspend a customer account", roles: [PlatformAdmin], code: 200, input: [], output: Customer, side_effects: ["account_status -> SUSPENDED"] }
  - { method: POST, path: "/sns/customers/{id}/unsuspend", description: "Reactivate a suspended customer", roles: [PlatformAdmin], code: 200, input: [], output: Customer, side_effects: ["account_status -> ACTIVE"] }
  - { method: GET, path: "/sns/customers/{id}/subscriptions", description: "List a customer's subscriptions", roles: [PlatformAdmin, SupportAgent, Customer], code: 200, input: ["limit?", "offset?"], output: "Subscription[]", side_effects: [] }
  - { method: GET, path: "/sns/customers/{id}/delivery-plans", description: "List a customer's delivery plans", roles: [PlatformAdmin, SupportAgent, Customer], code: 200, input: ["limit?", "offset?"], output: "DeliveryPlan[]", side_effects: [] }
  - { method: GET, path: "/sns/customers/{id}/notifications", description: "List a customer's notifications", roles: [PlatformAdmin, SupportAgent, Customer], code: 200, input: ["notification_type?", "limit?", "offset?"], output: "Notification[]", side_effects: ["lazy offer-expiry evaluation"] }
  - { method: GET, path: "/sns/customers/{id}/damage-claims", description: "List a customer's damage claims", roles: [PlatformAdmin, SupportAgent, Customer], code: 200, input: ["limit?", "offset?"], output: "DamageClaim[]", side_effects: [] }

  - { method: POST, path: "/sns/products", description: "Create a catalog product", roles: [PlatformAdmin], code: 201, input: [sku, name, region, "subscription_eligible?", "discontinued?", "substitute_product_id?"], output: Product, side_effects: ["availability_status derived"] }
  - { method: GET, path: "/sns/products/{id}", description: "Read a product", roles: [PlatformAdmin, SupportAgent, Customer], code: 200, input: [], output: Product, side_effects: [] }
  - { method: GET, path: "/sns/products", description: "List/filter products", roles: [PlatformAdmin, SupportAgent, Customer], code: 200, input: ["region?", "substitute_product_id?", "limit?", "offset?"], output: "Product[]", side_effects: [] }
  - { method: PATCH, path: "/sns/products/{id}", description: "Update product flags and substitute", roles: [PlatformAdmin], code: 200, input: ["discontinued?", "substitute_product_id?", "subscription_eligible?"], output: Product, side_effects: ["availability_status re-derived"] }
  - { method: POST, path: "/sns/products/{id}/price-events", description: "Append a price event; effective_from must strictly increase per product", roles: [PlatformAdmin], code: 201, input: [price_cents, effective_from], output: PriceEvent, side_effects: ["product.current_price_cents recomputed"] }
  - { method: GET, path: "/sns/products/{id}/price-events", description: "List a product's price history", roles: [PlatformAdmin, SupportAgent, Customer], code: 200, input: ["limit?", "offset?"], output: "PriceEvent[]", side_effects: [] }
  - { method: GET, path: "/sns/products/{id}/subscriptions", description: "List subscriptions of a product", roles: [PlatformAdmin, SupportAgent], code: 200, input: ["limit?", "offset?"], output: "Subscription[]", side_effects: [] }

  - { method: POST, path: "/sns/inventory-placements", description: "Create an inventory placement for a product+region", roles: [PlatformAdmin], code: 201, input: [product_id, region], output: InventoryPlacement, side_effects: [] }
  - { method: GET, path: "/sns/inventory-placements/{id}", description: "Read a placement", roles: [PlatformAdmin, SupportAgent], code: 200, input: [], output: InventoryPlacement, side_effects: [] }
  - { method: GET, path: "/sns/inventory-placements", description: "List/filter placements", roles: [PlatformAdmin, SupportAgent], code: 200, input: ["product_id?", "region?", "limit?", "offset?"], output: "InventoryPlacement[]", side_effects: [] }
  - { method: POST, path: "/sns/inventory-placements/{id}/receive", description: "Receive stock into a placement", roles: [PlatformAdmin], code: 200, input: [units], output: InventoryPlacement, side_effects: ["received_total_units += units", "on_hand_units += units", "availability_derivation"] }

  - { method: POST, path: "/sns/subscriptions", description: "Create a subscription (customer for self)", roles: [Customer], code: 201, input: [customer_id, product_id, cadence_months, quantity, start_date, "price_cap_cents?"], output: Subscription, side_effects: ["next_delivery_date = start_date", "subscribe_price_cents captured"] }
  - { method: GET, path: "/sns/subscriptions/{id}", description: "Read a subscription; lazily applies offer expiry", roles: [PlatformAdmin, SupportAgent, Customer], code: 200, input: [], output: Subscription, side_effects: ["lazy offer-expiry evaluation"] }
  - { method: PATCH, path: "/sns/subscriptions/{id}", description: "Change cadence, quantity, or price cap while ACTIVE", roles: [Customer], code: 200, input: ["cadence_months?", "quantity?", "price_cap_cents?"], output: Subscription, side_effects: ["next_delivery_date recomputed when cadence changes"] }
  - { method: POST, path: "/sns/subscriptions/{id}/pause", description: "Pause an ACTIVE subscription", roles: [Customer], code: 200, input: [], output: Subscription, side_effects: ["status -> PAUSED"] }
  - { method: POST, path: "/sns/subscriptions/{id}/resume", description: "Resume a PAUSED subscription", roles: [Customer], code: 200, input: [], output: Subscription, side_effects: ["status -> ACTIVE", "next_delivery_date fix-up"] }
  - { method: POST, path: "/sns/subscriptions/{id}/cancel", description: "Begin cancellation; creates a retention offer", roles: [Customer], code: 200, input: [], output: Subscription, side_effects: ["status -> PENDING_CANCEL", "RetentionOffer created", "Notification(OFFER_CREATED)"] }
  - { method: GET, path: "/sns/subscriptions/{id}/retention-offers", description: "List a subscription's retention offers", roles: [PlatformAdmin, SupportAgent, Customer], code: 200, input: ["limit?", "offset?"], output: "RetentionOffer[]", side_effects: ["lazy offer-expiry evaluation"] }

  - { method: GET, path: "/sns/retention-offers/{id}", description: "Read a retention offer", roles: [PlatformAdmin, SupportAgent, Customer], code: 200, input: [], output: RetentionOffer, side_effects: ["lazy offer-expiry evaluation"] }
  - { method: POST, path: "/sns/retention-offers/{id}/accept", description: "Accept the offer; subscription stays active and credit is granted", roles: [Customer], code: 200, input: [], output: RetentionOffer, side_effects: ["offer -> ACCEPTED", "subscription -> ACTIVE", "credit_balance_cents += 500"] }
  - { method: POST, path: "/sns/retention-offers/{id}/decline", description: "Decline the offer; subscription cancels", roles: [Customer], code: 200, input: [], output: RetentionOffer, side_effects: ["offer -> DECLINED", "subscription -> CANCELLED"] }

  - { method: POST, path: "/sns/coupons", description: "Create a coupon", roles: [PlatformAdmin], code: 201, input: [code, discount_type, valid_from, valid_to, "percent_off?", "flat_off_cents?", "stackable?", "min_subtotal_cents?"], output: Coupon, side_effects: [] }
  - { method: GET, path: "/sns/coupons/{id}", description: "Read a coupon", roles: [PlatformAdmin, SupportAgent, Customer], code: 200, input: [], output: Coupon, side_effects: [] }
  - { method: POST, path: "/sns/coupons/{id}/disable", description: "Disable a coupon", roles: [PlatformAdmin], code: 200, input: [], output: Coupon, side_effects: ["coupon_status -> DISABLED"] }

  - { method: POST, path: "/sns/promotions", description: "Create a promotion; half-open windows for the same bonus product must not overlap", roles: [PlatformAdmin], code: 201, input: [bonus_product_id, min_line_count, starts_on, ends_on], output: Promotion, side_effects: [] }
  - { method: GET, path: "/sns/promotions/{id}", description: "Read a promotion", roles: [PlatformAdmin, SupportAgent], code: 200, input: [], output: Promotion, side_effects: [] }
  - { method: GET, path: "/sns/promotions", description: "List/filter promotions", roles: [PlatformAdmin, SupportAgent], code: 200, input: ["bonus_product_id?", "limit?", "offset?"], output: "Promotion[]", side_effects: [] }
  - { method: POST, path: "/sns/promotions/{id}/disable", description: "Disable a promotion", roles: [PlatformAdmin], code: 200, input: [], output: Promotion, side_effects: ["promotion_status -> DISABLED"] }

  - { method: POST, path: "/sns/ops/generate-plans", description: "Monthly consolidation: create OPEN plans for due ACTIVE subscriptions of ACTIVE customers for the given month", roles: [PlatformAdmin], code: 201, input: [delivery_month], output: "DeliveryPlan[]", side_effects: ["delivery_consolidation_grouping", "included subscriptions advance next_delivery_date"] }
  - { method: POST, path: "/sns/ops/recompute-forecasts", description: "Recompute demand forecasts for a region+month", roles: [PlatformAdmin], code: 200, input: [region, forecast_month], output: "DemandForecast[]", side_effects: ["demand_forecast_units upserts"] }

  - { method: GET, path: "/sns/demand-forecasts", description: "List/filter forecasts", roles: [PlatformAdmin, SupportAgent], code: 200, input: ["product_id?", "region?", "forecast_month?", "limit?", "offset?"], output: "DemandForecast[]", side_effects: [] }
  - { method: GET, path: "/sns/demand-forecasts/{id}", description: "Read a forecast", roles: [PlatformAdmin, SupportAgent], code: 200, input: [], output: DemandForecast, side_effects: [] }

  - { method: GET, path: "/sns/delivery-plans/{id}", description: "Read a delivery plan with derived totals", roles: [PlatformAdmin, SupportAgent, Customer], code: 200, input: [], output: DeliveryPlan, side_effects: [] }
  - { method: GET, path: "/sns/delivery-plans/{id}/lines", description: "List a plan's lines", roles: [PlatformAdmin, SupportAgent, Customer], code: 200, input: ["limit?", "offset?"], output: "PlanLine[]", side_effects: [] }
  - { method: POST, path: "/sns/delivery-plans/{id}/refresh", description: "Re-run availability/cap/tier estimation on an OPEN plan; OCC-guarded; increments DeliveryPlan.version by 1", roles: [Customer], code: 200, input: [expected_plan_version], output: DeliveryPlan, side_effects: ["lock_evaluation_pipeline steps 1-3 in estimated mode", "increments DeliveryPlan.version by 1"] }
  - { method: POST, path: "/sns/delivery-plans/{id}/lock", description: "Lock an OPEN plan: price-at-ship, substitution, cap skips, tier, charges, coupons, bonus lines, inventory reserve", roles: [Customer], code: 200, input: [], output: DeliveryPlan, side_effects: ["lock_evaluation_pipeline", "inventory reserve", "notifications"] }
  - { method: POST, path: "/sns/delivery-plans/{id}/ship", description: "Ship a LOCKED plan", roles: [PlatformAdmin], code: 200, input: [], output: DeliveryPlan, side_effects: ["lines -> SHIPPED", "reserve released to shipped", "Notification(PLAN_SHIPPED)"] }
  - { method: POST, path: "/sns/delivery-plans/{id}/mark-delivered", description: "Mark a SHIPPED plan delivered", roles: [PlatformAdmin], code: 200, input: [], output: DeliveryPlan, side_effects: ["plan_status -> DELIVERED"] }
  - { method: POST, path: "/sns/delivery-plans/{id}/resolve", description: "Resolve a DELIVERED plan with no open claims", roles: [SupportAgent], code: 200, input: [], output: DeliveryPlan, side_effects: ["plan_status -> RESOLVED"] }
  - { method: POST, path: "/sns/delivery-plans/{id}/cancel", description: "Cancel an OPEN plan", roles: [SupportAgent], code: 200, input: [], output: DeliveryPlan, side_effects: ["lines -> SKIPPED (CUSTOMER)"] }
  - { method: POST, path: "/sns/delivery-plans/{id}/lines/{line_id}/skip", description: "Customer-skips a SCHEDULED line on an OPEN plan", roles: [Customer], code: 200, input: [], output: PlanLine, side_effects: ["line -> SKIPPED", "tier and estimated totals recompute"] }
  - { method: POST, path: "/sns/delivery-plans/{id}/lines/{line_id}/unskip", description: "Restore a CUSTOMER-skipped line on an OPEN plan", roles: [Customer], code: 200, input: [], output: PlanLine, side_effects: ["line -> SCHEDULED", "tier and estimated totals recompute"] }
  - { method: POST, path: "/sns/delivery-plans/{id}/coupons", description: "Attach a coupon to an OPEN plan", roles: [Customer], code: 200, input: [coupon_code], output: DeliveryPlan, side_effects: ["applied_coupon_codes appended", "estimated totals recomputed"] }
  - { method: POST, path: "/sns/delivery-plans/{id}/damage-claims", description: "Report damaged lines on a DELIVERED plan", roles: [Customer], code: 201, input: [damaged_line_ids], output: DamageClaim, side_effects: ["claim -> REPORTED"] }
  - { method: GET, path: "/sns/delivery-plans/{id}/damage-claims", description: "List a plan's damage claims", roles: [PlatformAdmin, SupportAgent, Customer], code: 200, input: ["limit?", "offset?"], output: "DamageClaim[]", side_effects: [] }

  - { method: GET, path: "/sns/plan-lines/{id}", description: "Read a plan line", roles: [PlatformAdmin, SupportAgent, Customer], code: 200, input: [], output: PlanLine, side_effects: [] }
  - { method: GET, path: "/sns/plan-lines", description: "List/filter plan lines", roles: [PlatformAdmin, SupportAgent, Customer], code: 200, input: ["plan_id?", "subscription_id?", "product_id?", "limit?", "offset?"], output: "PlanLine[]", side_effects: [] }

  - { method: GET, path: "/sns/damage-claims/{id}", description: "Read a damage claim", roles: [PlatformAdmin, SupportAgent, Customer], code: 200, input: [], output: DamageClaim, side_effects: [] }
  - { method: POST, path: "/sns/damage-claims/{id}/review", description: "Review a REPORTED claim: APPROVE_REFUND | APPROVE_RESHIP | REJECT", roles: [SupportAgent], code: 200, input: [decision], output: DamageClaim, side_effects: ["per state machine: refund credit or Reshipment creation"] }
  - { method: GET, path: "/sns/damage-claims/{id}/reshipments", description: "List a claim's reshipments", roles: [PlatformAdmin, SupportAgent, Customer], code: 200, input: ["limit?", "offset?"], output: "Reshipment[]", side_effects: [] }

  - { method: GET, path: "/sns/reshipments/{id}", description: "Read a reshipment", roles: [PlatformAdmin, SupportAgent, Customer], code: 200, input: [], output: Reshipment, side_effects: [] }
  - { method: POST, path: "/sns/reshipments/{id}/dispatch", description: "Dispatch a PENDING reshipment; consumes on-hand stock", roles: [PlatformAdmin], code: 200, input: [], output: Reshipment, side_effects: ["on_hand -> shipped", "availability re-derived", "Notification(RESHIP_DISPATCHED)"] }
  - { method: POST, path: "/sns/reshipments/{id}/mark-delivered", description: "Mark a DISPATCHED reshipment delivered; completes the claim", roles: [PlatformAdmin], code: 200, input: [], output: Reshipment, side_effects: ["claim -> COMPLETED"] }

  - { method: POST, path: "/sns/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Server startup default is 2026-09-01T00:00:00Z; before any set call the logical clock reads exactly that default and never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["lazy offer-expiry evaluation on subsequent reads"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown field, or malformed value type in the request body" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID missing, or role not recognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Customer role acting on a resource owned by a different customer" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not exist" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "Subscription id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "DeliveryPlan id does not exist" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "PlanLine id does not exist (or does not belong to the plan in the path)" }
  - { id: ERR_COUPON_NOT_FOUND, http: 404, condition: "Coupon code does not exist" }
  - { id: ERR_PROMOTION_NOT_FOUND, http: 404, condition: "Promotion id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "DamageClaim id does not exist" }
  - { id: ERR_OFFER_NOT_FOUND, http: 404, condition: "RetentionOffer id does not exist" }
  - { id: ERR_RESHIPMENT_NOT_FOUND, http: 404, condition: "Reshipment id does not exist" }
  - { id: ERR_FORECAST_NOT_FOUND, http: 404, condition: "DemandForecast id does not exist" }
  - { id: ERR_SUBSCRIPTION_NOT_ACTIVE, http: 409, condition: "Subscription not in a status that permits the operation (pause/patch require ACTIVE, resume requires PAUSED, cancel requires ACTIVE or PAUSED)" }
  - { id: ERR_PLAN_NOT_OPEN, http: 409, condition: "Plan must be OPEN for line skip/unskip, coupon attach, refresh, lock, or plan cancel" }
  - { id: ERR_PLAN_NOT_LOCKED, http: 409, condition: "Plan must be LOCKED to ship" }
  - { id: ERR_PLAN_NOT_DELIVERED, http: 409, condition: "Plan must be DELIVERED to open a damage claim" }
  - { id: ERR_CLAIM_NOT_REVIEWABLE, http: 409, condition: "DamageClaim not in REPORTED status" }
  - { id: ERR_OFFER_NOT_OPEN, http: 409, condition: "RetentionOffer not in OFFERED status" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "Customer account SUSPENDED: subscription create and resume are blocked" }
  - { id: ERR_LINE_NOT_SKIPPABLE, http: 409, condition: "Line not in a status that permits skip/unskip (skip requires SCHEDULED; unskip requires SKIPPED with reason CUSTOMER; bonus lines cannot be skipped)" }
  - { id: ERR_PRICE_EVENT_NOT_MONOTONIC, http: 409, condition: "Price event effective_from must be strictly greater than every existing effective_from for the product" }
  - { id: ERR_PROMOTION_WINDOW_OVERLAP, http: 409, condition: "An ACTIVE promotion for the same bonus product already exists whose half-open [starts_on, ends_on) window intersects the requested window" }
  - { id: ERR_STALE_PLAN_VERSION, http: 412, condition: "expected_plan_version does not match the plan's current version on refresh" }
  - { id: ERR_INVALID_CADENCE, http: 422, condition: "cadence_months outside 1..6" }
  - { id: ERR_INVALID_DELIVERY_DAY, http: 422, condition: "preferred_delivery_day outside 1..28" }
  - { id: ERR_QUANTITY_OUT_OF_RANGE, http: 422, condition: "quantity outside 1..30, or receive units <= 0" }
  - { id: ERR_START_DATE_TOO_SOON, http: 422, condition: "start_date earlier than logical today + 2 days" }
  - { id: ERR_PRODUCT_NOT_SUBSCRIBABLE, http: 422, condition: "Product discontinued or subscription_eligible == false" }
  - { id: ERR_PRODUCT_WITHOUT_PRICE, http: 422, condition: "Product has no PriceEvent with effective_from <= logical now" }
  - { id: ERR_CLAIM_LINES_INVALID, http: 422, condition: "damaged_line_ids empty, contains ids not on the plan, or lines not in SHIPPED status" }
  - { id: ERR_COUPON_NOT_YET_VALID, http: 422, condition: "Plan delivery_date < coupon valid_from" }
  - { id: ERR_COUPON_EXPIRED, http: 422, condition: "Plan delivery_date > coupon valid_to" }
  - { id: ERR_SUBTOTAL_BELOW_COUPON_MIN, http: 422, condition: "Plan estimated subtotal below coupon min_subtotal_cents at attach" }
  - { id: ERR_COUPON_NOT_STACKABLE, http: 422, condition: "Attaching this coupon would combine a non-stackable coupon with another coupon" }
  - { id: ERR_COUPON_STACK_LIMIT, http: 422, condition: "Plan already has 2 coupons attached" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 422, condition: "Reship review or dispatch requires on_hand >= line quantity for every reshipped line" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Subscribing customer; manages own subscriptions, plans, coupons on plans, damage claims, retention offers"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /sns/subscriptions"
      - "PATCH /sns/subscriptions/{id}"
      - "POST /sns/subscriptions/{id}/pause"
      - "POST /sns/subscriptions/{id}/resume"
      - "POST /sns/subscriptions/{id}/cancel"
      - "POST /sns/retention-offers/{id}/accept"
      - "POST /sns/retention-offers/{id}/decline"
      - "POST /sns/delivery-plans/{id}/refresh"
      - "POST /sns/delivery-plans/{id}/lock"
      - "POST /sns/delivery-plans/{id}/lines/{line_id}/skip"
      - "POST /sns/delivery-plans/{id}/lines/{line_id}/unskip"
      - "POST /sns/delivery-plans/{id}/coupons"
      - "POST /sns/delivery-plans/{id}/damage-claims"
    shared_operations:
      - "GET reads of own customers, subscriptions, plans, lines, claims, reshipments, offers, notifications, products, coupons"
      - "PATCH /sns/customers/{id} (own record)"
  - name: SupportAgent
    description: "Customer-service operator; reviews damage claims, resolves or cancels plans"
    identity: "opaque"
    exclusive_operations:
      - "POST /sns/damage-claims/{id}/review"
      - "POST /sns/delivery-plans/{id}/resolve"
      - "POST /sns/delivery-plans/{id}/cancel"
    shared_operations:
      - "GET reads across customers, subscriptions, plans, lines, claims, reshipments, offers, notifications, products, coupons, forecasts, placements"
  - name: PlatformAdmin
    description: "Platform operator; manages catalog, prices, inventory, coupons, promotions, ops runs, clock, shipments"
    identity: "opaque"
    exclusive_operations:
      - "POST /sns/customers"
      - "POST /sns/customers/{id}/suspend"
      - "POST /sns/customers/{id}/unsuspend"
      - "POST /sns/products"
      - "PATCH /sns/products/{id}"
      - "POST /sns/products/{id}/price-events"
      - "POST /sns/inventory-placements"
      - "POST /sns/inventory-placements/{id}/receive"
      - "POST /sns/coupons"
      - "POST /sns/coupons/{id}/disable"
      - "POST /sns/promotions"
      - "POST /sns/promotions/{id}/disable"
      - "POST /sns/ops/generate-plans"
      - "POST /sns/ops/recompute-forecasts"
      - "POST /sns/delivery-plans/{id}/ship"
      - "POST /sns/delivery-plans/{id}/mark-delivered"
      - "POST /sns/reshipments/{id}/dispatch"
      - "POST /sns/reshipments/{id}/mark-delivered"
      - "POST /sns/_clock/set_current_utc"
    shared_operations:
      - "GET reads across all resources"
      - "PATCH /sns/customers/{id}"
