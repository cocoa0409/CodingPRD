# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Veteran Volunteer Disaster Response Deployment & Incident Typing
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# Section/claim_type vocabulary follows references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: volunteer_creation_defaults_applied
        claim_type: defaults
        grounds: [entities.Volunteer.fields.readiness_status, entities.Volunteer.fields.availability_windows, entities.Volunteer.fields.instructor_certified]
        distinguishing_aspect: "Omitting optional fields lands REGISTERED with empty availability, instructor_certified=false, scores 0, fatigue 0, version 1."
        test_recipe:
          setup: ["Empty DB; default logical clock 2026-09-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Default Dan", email: "dan@x.org", home_region: "TX-GULF", skills: [DEBRIS] }
              as: SystemAdmin
              captures: { v1: $.data.id }
          assert:
            - "Volunteer.${v1}.readiness_status == REGISTERED"
            - "Volunteer.${v1}.availability_windows == [] and instructor_certified == false"
            - "Volunteer.${v1}.operational_readiness_score == 0 and readiness_score == 0 and fatigue_hours == 0"
            - "Volunteer.${v1}.version == 1"

      - name: volunteer_create_missing_required_email
        claim_type: required_fields
        grounds: [entities.Volunteer.fields.email, "validations[priority=1]"]
        distinguishing_aspect: "POST /vdr/volunteers without email is rejected 400 ERR_VALIDATION before any state change."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /vdr/volunteers"
              payload: { full_name: "No Email", home_region: "TX-GULF", skills: [DEBRIS] }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (http 400)"
            - "No volunteer record is persisted by the rejected call"

      - name: certification_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CERTIFICATION_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent certification id returns 404 ERR_CERTIFICATION_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /vdr/certifications/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CERTIFICATION_NOT_FOUND (http 404)"

      - name: volunteer_unknown_field_rejected
        claim_type: system_fields
        grounds: ["validations[priority=1]", entities.Volunteer.fields.readiness_score]
        distinguishing_aspect: "Injecting the computed field readiness_score into a create payload is an unknown-field violation: 400 ERR_VALIDATION; computed fields can never be client-set."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Score Hacker", email: "hack@x.org", home_region: "TX-GULF", skills: [DEBRIS], readiness_score: 99 }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (http 400)"

      - name: work_order_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.WorkOrder.fields.hazard_kind, "validations[priority=1]"]
        distinguishing_aspect: "hazard_kind outside the five-member enum is rejected 400 ERR_VALIDATION even when the incident is in a valid intake state."
        test_recipe:
          setup: ["Incident ASSESSED"]
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/incidents"
              payload: { name: "Storm A", region: "TX-GULF" }
              as: IncidentCommander
              captures: { i1: $.data.id }
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: ASSESSED, severity: 3, affected_households: 40 }
              as: IncidentCommander
          trigger:
            - call: "POST /vdr/incidents/${i1}/work-orders"
              payload: { requester_name: "Bad Enum", hazard_kind: ARSON }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (http 400)"

  - section: state_machines
    instances:
      - name: incident_closed_terminal_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Incident, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal CLOSED, any further transition (here back to ASSESSED) is rejected with ERR_INVALID_STATE and no field changes."
        test_recipe:
          setup: ["Incident driven REPORTED -> ASSESSED -> TYPED -> STANDING_DOWN -> CLOSED (no operations, so the close gate is vacuously satisfied)"]
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/incidents"
              payload: { name: "Storm A", region: "TX-GULF" }
              as: IncidentCommander
              captures: { i1: $.data.id }
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: ASSESSED, severity: 3, affected_households: 40 }
              as: IncidentCommander
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: TYPED, incident_type: FLOOD }
              as: IncidentCommander
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: STANDING_DOWN }
              as: IncidentCommander
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: CLOSED }
              as: IncidentCommander
          trigger:
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: ASSESSED, severity: 5, affected_households: 99 }
              as: IncidentCommander
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409)"
            - "Incident.${i1}.status == CLOSED and severity == 3 (unchanged)"

      - name: volunteer_jump_registered_to_deployable_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Volunteer, "validations[priority=6]"]
        distinguishing_aspect: "REGISTERED -> DEPLOYABLE skips VETTED and is not a declared edge; rejected ERR_INVALID_STATE even though the target is a valid state."
        test_recipe:
          setup: ["Volunteer registered, no transitions yet"]
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Skip Sam", email: "sam@x.org", home_region: "TX-GULF", skills: [DEBRIS] }
              as: SystemAdmin
              captures: { v1: $.data.id }
          trigger:
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: DEPLOYABLE }
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409)"
            - "Volunteer.${v1}.readiness_status == REGISTERED"

      - name: operation_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.Operation]
        distinguishing_aspect: "A freshly created operation reports status == DRAFT and aar_status == NONE with rostered_count == 0."
        test_recipe:
          setup: ["Incident TYPED"]
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/incidents"
              payload: { name: "Storm A", region: "TX-GULF" }
              as: IncidentCommander
              captures: { i1: $.data.id }
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: ASSESSED, severity: 3, affected_households: 40 }
              as: IncidentCommander
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: TYPED, incident_type: WIND }
              as: IncidentCommander
          trigger:
            - call: "POST /vdr/incidents/${i1}/operations"
              payload: { title: "Fresh Op", hazard_focus: DEBRIS, team_size_required: 2, duration_days: 3, required_capabilities: [HEAVY_EQUIPMENT], start_date: "2026-09-15" }
              as: IncidentCommander
              captures: { op1: $.data.id }
          assert:
            - "Operation.${op1}.status == DRAFT"
            - "Operation.${op1}.aar_status == NONE"
            - "Operation.${op1}.rostered_count == 0 and capability_gap == {HEAVY_EQUIPMENT: 1}"

      - name: cert_verify_stamps_verified_by
        claim_type: side_effect_execution
        grounds: [state_machines.Certification.PENDING_VERIFICATION_to_VERIFIED]
        distinguishing_aspect: "Verification stamps verified_by_user_id with the acting SafetyOfficer's X-User-ID and leaves renewal_count at 0."
        test_recipe:
          setup: ["Volunteer with one PENDING_VERIFICATION cert"]
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Cert Cary", email: "cary@x.org", home_region: "TX-GULF", skills: [MEDICAL] }
              as: SystemAdmin
              captures: { v1: $.data.id }
            - call: "POST /vdr/volunteers/${v1}/certifications"
              payload: { kind: MEDICAL, issued_at: "2026-09-01T00:00:00Z", expires_at: "2027-03-01T00:00:00Z" }
              as: TrainingDirector
              captures: { c1: $.data.id }
          trigger:
            - call: "PATCH /vdr/certifications/${c1}"
              payload: { status: VERIFIED }
              as: SafetyOfficer
              as_user_id: "safety-officer-7"
          assert:
            - "Certification.${c1}.status == VERIFIED"
            - "Certification.${c1}.verified_by_user_id == 'safety-officer-7'"
            - "Certification.${c1}.renewal_count == 0"

      - name: deployment_double_accept_rejected
        claim_type: idempotency
        grounds: [state_machines.Deployment.OFFERED_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Re-sending the accept trigger after a successful accept is not a no-op replay: the second attempt is rejected ERR_INVALID_STATE because ACCEPTED is not a from-state for accept."
        test_recipe:
          setup: ["Operation OPEN; deployment d1 OFFERED then ACCEPTED once"]
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Ada Voss", email: "ada@x.org", home_region: "TX-GULF", skills: [CHAINSAW], availability_windows: [{ start_iso8601: "2026-09-05T00:00:00Z", end_iso8601: "2026-09-30T00:00:00Z" }] }
              as: SystemAdmin
              captures: { v1: $.data.id }
            - call: "POST /vdr/volunteers/${v1}/certifications"
              payload: { kind: CHAINSAW, issued_at: "2026-09-01T00:00:00Z", expires_at: "2027-03-01T00:00:00Z" }
              as: TrainingDirector
              captures: { c1: $.data.id }
            - call: "PATCH /vdr/certifications/${c1}"
              payload: { status: VERIFIED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: VETTED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: DEPLOYABLE }
              as: SafetyOfficer
            - call: "POST /vdr/incidents"
              payload: { name: "Storm A", region: "TX-GULF" }
              as: IncidentCommander
              captures: { i1: $.data.id }
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: ASSESSED, severity: 3, affected_households: 40 }
              as: IncidentCommander
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: TYPED, incident_type: WIND }
              as: IncidentCommander
            - call: "POST /vdr/incidents/${i1}/operations"
              payload: { title: "Tree Ops", hazard_focus: TREE_REMOVAL, team_size_required: 2, duration_days: 4, required_capabilities: [CHAINSAW], start_date: "2026-09-10" }
              as: IncidentCommander
              captures: { op1: $.data.id }
            - call: "PATCH /vdr/operations/${op1}"
              payload: { status: OPEN }
              as: OperationsLead
            - call: "POST /vdr/operations/${op1}/deployments"
              payload: { volunteer_id: "${v1}", travel_mode: SELF, planned_start: "2026-09-10T08:00:00Z", planned_end: "2026-09-14T08:00:00Z", needs_lodging: false }
              as: OperationsLead
              captures: { d1: $.data.id }
            - call: "PATCH /vdr/deployments/${d1}"
              payload: { status: ACCEPTED }
              as: Volunteer
              as_user_id: "${v1}"
          trigger:
            - call: "PATCH /vdr/deployments/${d1}"
              payload: { status: ACCEPTED }
              as: Volunteer
              as_user_id: "${v1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409)"
            - "Deployment.${d1}.status == ACCEPTED (single accept applied once)"

  - section: calculations
    instances:
      - name: priority_age_boost_capped_at_twenty
        claim_type: constants_applied
        grounds: [calculations.work_order_priority_score]
        distinguishing_aspect: "AGE_BOOST_CAP(20) binds: 10 full days of waiting would give floor(240/24)*5 = 50 uncapped, so DEBRIS base 20 + capped 20 = 40 -> P3; an uncapped implementation yields 70 -> P2 and fails."
        test_recipe:
          setup: ["Incident ASSESSED; work order (DEBRIS, non-vulnerable) created at 2026-09-01T00:00:00Z; clock advanced exactly 10 days"]
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/incidents"
              payload: { name: "Storm A", region: "TX-GULF" }
              as: IncidentCommander
              captures: { i1: $.data.id }
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: ASSESSED, severity: 2, affected_households: 15 }
              as: IncidentCommander
            - call: "POST /vdr/incidents/${i1}/work-orders"
              payload: { requester_name: "Patient Owner", hazard_kind: DEBRIS, vulnerable_resident: false }
              as: IntakeCoordinator
              captures: { wo1: $.data.id, wo1_v: $.data.version }
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /vdr/work-orders/${wo1}/triage"
              payload: { expected_work_order_version: "${wo1_v}" }
              as: IntakeCoordinator
          assert:
            - "WorkOrder.${wo1}.priority_score == 40"
            - "WorkOrder.${wo1}.priority_tier == P3"

      - name: fatigue_reset_after_rest_window
        claim_type: correct_result
        grounds: [calculations.duty_fatigue_hours, calculations.volunteer_readiness_score]
        distinguishing_aspect: "Chronological reset mechanism: after >= REST_RESET_HOURS(24) with no in-window shift, an ops run zeroes fatigue_hours and the wellness-adjusted readiness_score recomputes back up to the operational variant (45 -> 65)."
        test_recipe:
          setup:
            - "Volunteer DEPLOYABLE with VERIFIED CHAINSAW + STRUCTURAL certs (operational score 65)"
            - "One 10h shift 2026-09-10T08:00-18:00Z COMPLETED at ops run (fatigue 10, readiness 45)"
            - "Clock advanced to 2026-09-12T19:00:00Z (49h after last shift end, no in-window shift)"
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Bo Karr", email: "bo@x.org", home_region: "TX-GULF", skills: [CHAINSAW, STRUCTURAL], availability_windows: [{ start_iso8601: "2026-09-05T00:00:00Z", end_iso8601: "2026-09-30T00:00:00Z" }] }
              as: SystemAdmin
              captures: { v1: $.data.id }
            - call: "POST /vdr/volunteers/${v1}/certifications"
              payload: { kind: CHAINSAW, issued_at: "2026-09-01T00:00:00Z", expires_at: "2027-03-01T00:00:00Z" }
              as: TrainingDirector
              captures: { c1: $.data.id }
            - call: "PATCH /vdr/certifications/${c1}"
              payload: { status: VERIFIED }
              as: SafetyOfficer
            - call: "POST /vdr/volunteers/${v1}/certifications"
              payload: { kind: STRUCTURAL, issued_at: "2026-09-01T00:00:00Z", expires_at: "2027-03-01T00:00:00Z" }
              as: TrainingDirector
              captures: { c2: $.data.id }
            - call: "PATCH /vdr/certifications/${c2}"
              payload: { status: VERIFIED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: VETTED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: DEPLOYABLE }
              as: SafetyOfficer
            - call: "POST /vdr/incidents"
              payload: { name: "Storm A", region: "TX-GULF" }
              as: IncidentCommander
              captures: { i1: $.data.id }
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: ASSESSED, severity: 4, affected_households: 120 }
              as: IncidentCommander
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: TYPED, incident_type: WIND }
              as: IncidentCommander
            - call: "POST /vdr/incidents/${i1}/operations"
              payload: { title: "Tree Ops", hazard_focus: TREE_REMOVAL, team_size_required: 2, duration_days: 4, required_capabilities: [CHAINSAW], start_date: "2026-09-10" }
              as: IncidentCommander
              captures: { op1: $.data.id }
            - call: "PATCH /vdr/operations/${op1}"
              payload: { status: OPEN }
              as: OperationsLead
            - call: "POST /vdr/operations/${op1}/deployments"
              payload: { volunteer_id: "${v1}", travel_mode: SELF, planned_start: "2026-09-10T08:00:00Z", planned_end: "2026-09-14T08:00:00Z", needs_lodging: false }
              as: OperationsLead
              captures: { d1: $.data.id }
            - call: "PATCH /vdr/deployments/${d1}"
              payload: { status: ACCEPTED }
              as: Volunteer
              as_user_id: "${v1}"
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: SystemAdmin
            - call: "PATCH /vdr/deployments/${d1}"
              payload: { status: ON_SITE }
              as: OperationsLead
            - call: "POST /vdr/operations/${op1}/duty-shifts"
              payload: { deployment_id: "${d1}", kind: OPERATIONS, starts_at: "2026-09-10T08:00:00Z", ends_at: "2026-09-10T18:00:00Z" }
              as: OperationsLead
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T19:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/_ops/run"
              payload: {}
              as: SystemAdmin
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T19:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /vdr/_ops/run"
              payload: {}
              as: SystemAdmin
          assert:
            - "Volunteer.${v1}.fatigue_hours == 0 (reset after 49h idle)"
            - "Volunteer.${v1}.readiness_score == 65 (recomputed to equal operational_readiness_score)"

  - section: validations
    instances:
      - name: fob_full_checkin_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=22]", calculations.fob_occupancy, "errors[ERR_FOB_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "With bunks_total=1 and one ON_SITE lodger, a second lodging check-in is rejected ERR_FOB_CAPACITY_EXCEEDED; occupied == capacity is exactly the rejection point."
        test_recipe:
          setup: ["Operation OPEN (caps [CHAINSAW]); FOB bunks_total=1; d1 ACCEPTED+ON_SITE with lodging occupying the only bunk; d2 (v2, CHAINSAW) ACCEPTED with needs_lodging=true"]
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Ada Voss", email: "ada@x.org", home_region: "TX-GULF", skills: [CHAINSAW], availability_windows: [{ start_iso8601: "2026-09-05T00:00:00Z", end_iso8601: "2026-09-30T00:00:00Z" }] }
              as: SystemAdmin
              captures: { v1: $.data.id }
            - call: "POST /vdr/volunteers/${v1}/certifications"
              payload: { kind: CHAINSAW, issued_at: "2026-09-01T00:00:00Z", expires_at: "2027-03-01T00:00:00Z" }
              as: TrainingDirector
              captures: { c1: $.data.id }
            - call: "PATCH /vdr/certifications/${c1}"
              payload: { status: VERIFIED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: VETTED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: DEPLOYABLE }
              as: SafetyOfficer
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Bo Karr", email: "bo@x.org", home_region: "TX-GULF", skills: [CHAINSAW], availability_windows: [{ start_iso8601: "2026-09-05T00:00:00Z", end_iso8601: "2026-09-30T00:00:00Z" }] }
              as: SystemAdmin
              captures: { v2: $.data.id }
            - call: "POST /vdr/volunteers/${v2}/certifications"
              payload: { kind: CHAINSAW, issued_at: "2026-09-01T00:00:00Z", expires_at: "2027-03-01T00:00:00Z" }
              as: TrainingDirector
              captures: { c2: $.data.id }
            - call: "PATCH /vdr/certifications/${c2}"
              payload: { status: VERIFIED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v2}"
              payload: { readiness_status: VETTED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v2}"
              payload: { readiness_status: DEPLOYABLE }
              as: SafetyOfficer
            - call: "POST /vdr/incidents"
              payload: { name: "Storm A", region: "TX-GULF" }
              as: IncidentCommander
              captures: { i1: $.data.id }
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: ASSESSED, severity: 4, affected_households: 120 }
              as: IncidentCommander
            - call: "PATCH /vdr/incidents/${i1}"
