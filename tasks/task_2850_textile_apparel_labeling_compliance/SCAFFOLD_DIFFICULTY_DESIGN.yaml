            - call: "POST /labeling/origin-determinations/${od_id}/issue"
              payload: { method: "SUBSTANTIAL_TRANSFORMATION" }
              as: ComplianceAdmin
            - call: "POST /labeling/lab-tests"
              payload: { style_id: "${style_id}", test_type: "FIBER_CONTENT", lab_code: "LAB-ATL-1", method: "AATCC_20A", specimen_received_at: "2026-08-03T09:00:00Z", results_due_at: "2026-08-05T09:00:00Z" }
              as: AccreditedLab
