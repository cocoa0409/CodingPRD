              payload: { primary_owner_id: "${ow_pr}", parcel_apn: "PR-1", assessed_value_cents: 1000001, acreage: 1.00, is_developed: true, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_pr}"
              captures: { parcel_pr: $.data.id }
            - call: "POST /annexation-cases/${case_pr}/certify-territory"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_pr}"
            - call: "POST /petitions"
              payload: { annexation_case_id: "${case_pr}", petition_type: "OWNER_MAJORITY", circulation_days: 30 }
              as: MunicipalPlanner
              as_user_id: "${muni_pr}"
              captures: { pet_pr: $.data.id }
          trigger:
            - call: "POST /parcel-owner-consents"
              payload: { petition_id: "${pet_pr}", parcel_id: "${parcel_pr}", property_owner_id: "${ow_pr}", ownership_share_pct: 50.00 }
              as: PropertyOwner
              as_user_id: "${ow_pr}"
              captures: { cons_pr: $.data.id, pr_qualified: $.data.qualified_value_cents }
            - call: "POST /petitions/${pet_pr}/certify-sufficiency"
              payload: {}
              as: CityClerk
              as_user_id: "${muni_pr}"
              captures: { pr_status: $.data.sufficiency_status, pr_sum: $.data.qualified_signature_assessed_value_cents, pr_pct: $.data.signature_value_pct }
          assert:
            - "${pr_qualified} == 500001"
            - "${pr_sum} == 500001"
            - "${pr_pct} == 50.00"
            - "${pr_status} == SUFFICIENT"
            - "second trigger response status == 200"
            - "Petition.${pet_pr}.qualified_signature_owner_count == 1"
            - "Petition.${pet_pr}.signature_owner_pct == 100.00"
            - "Petition.${pet_pr}.circulation_deadline_at == 2026-08-31T00:00:00Z"
            - "ParcelOwnerConsent.${cons_pr}.signed_at == 2026-08-01T00:00:00Z"
            - "AnnexationCase.${case_pr}.status == SUFFICIENCY_REVIEW"

      - name: utility_effective_rate_applies_each_municipalitys_own_surcharge_constant
        claim_type: constants_applied
        grounds:
          - calculations.utility_effective_rate
          - entities.Municipality.fields.utility_outside_surcharge_pct
        distinguishing_aspect: |
          The surcharge multiplier is read from the municipality that owns the account's parcel's
          case, not from a global constant: an identical 5,001-cent base yields
          round_half_up(5001 * 1.50) = 7,502 in a municipality on the 0.50 default and
          round_half_up(5001 * 1.25) = 6,251 in one configured at 0.25, and both accounts start
