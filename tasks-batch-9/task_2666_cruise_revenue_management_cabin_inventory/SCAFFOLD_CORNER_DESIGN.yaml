              as: RevenueManager
              captures: { inv_f: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_f}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 50000, third_berth_fare_cents: 20000, fourth_berth_fare_cents: 15000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_f}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_a: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Bo Chen", email: "bo@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_b: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Cy Danes", email: "cy@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_c: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_f}", cabin_category_id: "${cat_ia}", guest_id: "${g_a}", occupancy_adults: 2 }
              as: ReservationAgent
              captures: { bk_keep: $.data.id }
            - call: "POST /bookings"
