scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: savings_provisional_vs_finalized
        grounds:
          - calculations.savings_measurement
          - entities.SavingsPeriod.fields.provisional_savings_cents
          - entities.SavingsPeriod.fields.finalized_savings_cents
        distinguishing_aspect: |
          On the SavingsPeriod entity domain, the provisional variant counts the
          still-FIRED 70000-cent hit at full value and ignores the 20000-cent
          partial release, while the finalized variant excludes FIRED hits and
          nets releases: identical hit population yields 180000 vs 90000.
        test_recipe:
          setup:
            - "Provider PS; INTERNAL edit ES (DENY, PROFESSIONAL) ACTIVE"
            - "Claim A: one 50000 line; hit upheld (CONFIRMED, attributed 50000)"
            - "Claim B: one 70000 line; hit still FIRED, its task PENDING"
            - "Claim C: one 60000 line; hit upheld then dispute PARTIAL releasing 20000 (hit OVERRIDDEN, released_cents 20000)"
            - "All hits created and resolved under the default clock 2026-08-01 -> period 2026-08"
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-S1", name: "Savings Prov" }, as: PlanAdmin, captures: { ps_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "SAV-DENY", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rs_id: $.data.id, rs_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rs_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny line", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { evs_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${evs_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${evs_id}/approve", payload: { expected_edit_rule_version: "${rs_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "A1", provider_id: "${ps_id}", member_id: "M-S1", claim_type: PROFESSIONAL, total_billed_cents: 50000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${ps_id}", captures: { ca_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${ca_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 50000 }, as: Provider, as_user_id: "${ps_id}" }
            - { call: "POST /payment-integrity/claims/${ca_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${ca_id}" }, as: Any, captures: { ta_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${ta_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${ta_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "B1", provider_id: "${ps_id}", member_id: "M-S2", claim_type: PROFESSIONAL, total_billed_cents: 70000, service_from: "2026-07-11T00:00:00Z", service_to: "2026-07-11T00:00:00Z" }, as: Provider, as_user_id: "${ps_id}", captures: { cb_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cb_id}/lines", payload: { line_number: 1, procedure_code: "99214", billed_cents: 70000 }, as: Provider, as_user_id: "${ps_id}" }
            - { call: "POST /payment-integrity/claims/${cb_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "C1", provider_id: "${ps_id}", member_id: "M-S3", claim_type: PROFESSIONAL, total_billed_cents: 60000, service_from: "2026-07-12T00:00:00Z", service_to: "2026-07-12T00:00:00Z" }, as: Provider, as_user_id: "${ps_id}", captures: { cc_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cc_id}/lines", payload: { line_number: 1, procedure_code: "99215", billed_cents: 60000 }, as: Provider, as_user_id: "${ps_id}" }
            - { call: "POST /payment-integrity/claims/${cc_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${cc_id}" }, as: Any, captures: { tc_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${tc_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${tc_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "GET /payment-integrity/claims/${cc_id}", payload: {}, as: Any, captures: { cc_v: $.data.version } }
            - { call: "GET /payment-integrity/claims/${cc_id}/edit-hits", payload: {}, as: Any, captures: { hc_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/claims/${cc_id}/disputes", payload: { edit_hit_id: "${hc_id}", reason: "partial release requested", expected_claim_version: "${cc_v}" }, as: Provider, as_user_id: "${ps_id}", captures: { dc_id: $.data.id } }
            - { call: "POST /payment-integrity/disputes/${dc_id}/start-review", payload: {}, as: DisputeAdjudicator, as_user_id: adj-1 }
            - { call: "POST /payment-integrity/disputes/${dc_id}/decide", payload: { outcome: PARTIAL, released_cents: 20000 }, as: DisputeAdjudicator, as_user_id: adj-1 }
            - { call: "POST /payment-integrity/savings-periods", payload: { period_key: "2026-08" }, as: PlanAdmin, captures: { sp_id: $.data.id } }
            - { call: "POST /payment-integrity/savings-periods/${sp_id}/begin-reconciliation", payload: {}, as: PlanAdmin }
          trigger:
            - { call: "POST /payment-integrity/savings-periods/${sp_id}/finalize", payload: {}, as: PlanAdmin, captures: { sp_prov: $.data.provisional_savings_cents, sp_fin: $.data.finalized_savings_cents, sp_pend: $.data.pending_pipeline_cents, sp_rev: $.data.reversed_cents } }
          assert:
            - "SavingsPeriod.${sp_id}.provisional_savings_cents == 180000"
            - "SavingsPeriod.${sp_id}.finalized_savings_cents == 90000"
            - "SavingsPeriod.${sp_id}.pending_pipeline_cents == 70000"
            - "SavingsPeriod.${sp_id}.reversed_cents == 20000"
            - "provisional (180000) != finalized (90000) for the identical hit population"

      - name: abrasion_standard_vs_regulatory
        grounds:
          - calculations.provider_abrasion_index
          - entities.ProviderAbrasionProfile.fields.standard_index
          - entities.ProviderAbrasionProfile.fields.regulatory_index
          - entities.ProviderAbrasionProfile.fields.tier
        distinguishing_aspect: |
          On the ProviderAbrasionProfile entity domain, the standard variant
          (trailing-90-day, count-weighted) yields 0.4000 while the regulatory
          variant (lifetime, dollar-weighted) yields 0.5000 for identical
          resolution events; tier is keyed on the standard variant only, so the
          provider is MEDIUM (not monitor_only) even though the regulatory index
          sits at the HIGH threshold.
        test_recipe:
          setup:
            - "Provider PE; INTERNAL edit EE (DENY, PROFESSIONAL) ACTIVE"
            - "Four claims, one 40000 line each: e1 upheld, e2 upheld, e3 task-OVERRIDDEN (released 40000), e4 upheld then dispute OVERTURNED (false positive, released 40000)"
            - "resolved window counts: confirmed 2, overridden 1, fp 1 -> standard = 0.6*(2/4) + 0.4*(1/4) = 0.4000"
            - "lifetime dollars: released 80000 / denied 160000 -> regulatory = 0.5000"
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-E1", name: "Abrasion Prov" }, as: PlanAdmin, captures: { pe_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "ABR-DENY", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { re_id: $.data.id, re_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${re_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny line", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { eve_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${eve_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${eve_id}/approve", payload: { expected_edit_rule_version: "${re_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "E1", provider_id: "${pe_id}", member_id: "M-E1", claim_type: PROFESSIONAL, total_billed_cents: 40000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pe_id}", captures: { ce1_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${ce1_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 40000 }, as: Provider, as_user_id: "${pe_id}" }
            - { call: "POST /payment-integrity/claims/${ce1_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${ce1_id}" }, as: Any, captures: { te1_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${te1_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${te1_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "E2", provider_id: "${pe_id}", member_id: "M-E2", claim_type: PROFESSIONAL, total_billed_cents: 40000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pe_id}", captures: { ce2_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${ce2_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 40000 }, as: Provider, as_user_id: "${pe_id}" }
            - { call: "POST /payment-integrity/claims/${ce2_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${ce2_id}" }, as: Any, captures: { te2_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${te2_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${te2_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "E3", provider_id: "${pe_id}", member_id: "M-E3", claim_type: PROFESSIONAL, total_billed_cents: 40000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pe_id}", captures: { ce3_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${ce3_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 40000 }, as: Provider, as_user_id: "${pe_id}" }
            - { call: "POST /payment-integrity/claims/${ce3_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${ce3_id}" }, as: Any, captures: { te3_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${te3_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${te3_id}/decide", payload: { outcome: OVERRIDE }, as: Reviewer, as_user_id: rev-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "E4", provider_id: "${pe_id}", member_id: "M-E4", claim_type: PROFESSIONAL, total_billed_cents: 40000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pe_id}", captures: { ce4_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${ce4_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 40000 }, as: Provider, as_user_id: "${pe_id}" }
            - { call: "POST /payment-integrity/claims/${ce4_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${ce4_id}" }, as: Any, captures: { te4_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${te4_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${te4_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "GET /payment-integrity/claims/${ce4_id}", payload: {}, as: Any, captures: { ce4_v: $.data.version } }
            - { call: "GET /payment-integrity/claims/${ce4_id}/edit-hits", payload: {}, as: Any, captures: { he4_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/claims/${ce4_id}/disputes", payload: { edit_hit_id: "${he4_id}", reason: "wrongly denied", expected_claim_version: "${ce4_v}" }, as: Provider, as_user_id: "${pe_id}", captures: { de4_id: $.data.id } }
            - { call: "POST /payment-integrity/disputes/${de4_id}/start-review", payload: {}, as: DisputeAdjudicator, as_user_id: adj-1 }
            - { call: "POST /payment-integrity/disputes/${de4_id}/decide", payload: { outcome: OVERTURNED }, as: DisputeAdjudicator, as_user_id: adj-1 }
          trigger:
            - { call: "GET /payment-integrity/abrasion-profiles", payload: { provider_id: "${pe_id}" }, as: Any, captures: { pe_std: "$.data[0].standard_index", pe_reg: "$.data[0].regulatory_index", pe_tier: "$.data[0].tier", pe_mon: "$.data[0].monitor_only" } }
          assert:
            - "ProviderAbrasionProfile[provider=${pe_id}].standard_index == 0.4000"
            - "ProviderAbrasionProfile[provider=${pe_id}].regulatory_index == 0.5000"
            - "ProviderAbrasionProfile[provider=${pe_id}].tier == MEDIUM (keyed on standard_index 0.4000 even though regulatory_index 0.5000 >= 0.50)"
            - "ProviderAbrasionProfile[provider=${pe_id}].monitor_only == false"
  # =========================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) then (b))
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: drg_payment_outlier_and_transfer
        grounds:
          - calculations.drg_base_payment
          - entities.Claim.fields.initial_allowed_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (drg_code weight, LOS, discharge_disposition)
          interact non-linearly through a nested min() outlier cap and a
          conditional transfer branch. DRG 470 at LOS 13 (above the 10-day
          outlier threshold, uncapped) prices to 1650000; the same DRG at LOS 2
          with TRANSFER disposition prices to 600000 via the per-diem min().
        test_recipe:
          setup:
            - "Provider PG; no edit rules (clean screening)"
            - "Claim I1: INSTITUTIONAL_INPATIENT, DRG 470, admission 2026-07-01, discharge 2026-07-14 (LOS 13), disposition HOME, billed 2000000"
            - "Claim I2: INSTITUTIONAL_INPATIENT, DRG 470, admission 2026-07-01, discharge 2026-07-03 (LOS 2), disposition TRANSFER, billed 900000, different member"
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-G1", name: "General Hospital" }, as: PlanAdmin, captures: { pg_id: $.data.id } }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "I1", provider_id: "${pg_id}", member_id: "M-I1", claim_type: INSTITUTIONAL_INPATIENT, total_billed_cents: 2000000, service_from: "2026-07-01T00:00:00Z", service_to: "2026-07-14T00:00:00Z", admission_date: "2026-07-01T00:00:00Z", discharge_date: "2026-07-14T00:00:00Z", drg_code: "470", discharge_disposition: HOME }, as: Provider, as_user_id: "${pg_id}", captures: { ci1_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${ci1_id}/lines", payload: { line_number: 1, procedure_code: "REV-010", billed_cents: 2000000 }, as: Provider, as_user_id: "${pg_id}" }
            - { call: "POST /payment-integrity/claims/${ci1_id}/run-edits", payload: {}, as: PlanAdmin, captures: { ci1_allowed: $.data.initial_allowed_cents, ci1_status: $.data.status } }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "I2", provider_id: "${pg_id}", member_id: "M-I2", claim_type: INSTITUTIONAL_INPATIENT, total_billed_cents: 900000, service_from: "2026-07-01T00:00:00Z", service_to: "2026-07-03T00:00:00Z", admission_date: "2026-07-01T00:00:00Z", discharge_date: "2026-07-03T00:00:00Z", drg_code: "470", discharge_disposition: TRANSFER }, as: Provider, as_user_id: "${pg_id}", captures: { ci2_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${ci2_id}/lines", payload: { line_number: 1, procedure_code: "REV-010", billed_cents: 900000 }, as: Provider, as_user_id: "${pg_id}" }
            - { call: "POST /payment-integrity/claims/${ci2_id}/run-edits", payload: {}, as: PlanAdmin, captures: { ci2_allowed: $.data.initial_allowed_cents } }
          trigger:
            - { call: "GET /payment-integrity/inpatient-reviews", payload: { claim_id: "${ci1_id}", review_type: DRG_VALIDATION }, as: Any, captures: { ci1_rev_status: "$.data[0].status" } }
          assert:
            - "Claim.${ci1_id}.initial_allowed_cents == 1650000 (base 1500000 + outlier min(3*50000, 300000) = 150000)"
            - "Claim.${ci2_id}.initial_allowed_cents == 600000 (transfer: min(1500000, 2 * 300000))"
            - "Claim.${ci1_id}.status == PENDED (DRG_VALIDATION review auto-created, still OPEN)"
            - "InpatientReview for ${ci1_id} has review_type == DRG_VALIDATION and status == OPEN"

      - name: itemized_reprice_per_line_rounding
        grounds:
          - calculations.itemized_reprice
          - entities.ItemizedBillReview.fields.repriced_total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Three 101-cent lines at
          a 6.5% contract discount round to 94 cents per line and sum to 282;
          the sum-then-round order would give round(303 * 0.935) = 283. The
          scaffold pins per-line-round-then-sum, so 282 is the only correct
          answer.
        test_recipe:
          setup:
            - "Provider PR; claim with three lines of 101 cents each (billed total 303), screened clean to READY_TO_PAY (no edit rules exist)"
            - "Manual ItemizedBillReview opened by SeniorReviewer, documents received, audit started"
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-R1", name: "Reprice Prov" }, as: PlanAdmin, captures: { pr_id: $.data.id } }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "R1", provider_id: "${pr_id}", member_id: "M-R1", claim_type: PROFESSIONAL, total_billed_cents: 303, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pr_id}", captures: { cr_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cr_id}/lines", payload: { line_number: 1, procedure_code: "A0001", billed_cents: 101 }, as: Provider, as_user_id: "${pr_id}" }
            - { call: "POST /payment-integrity/claims/${cr_id}/lines", payload: { line_number: 2, procedure_code: "A0002", billed_cents: 101 }, as: Provider, as_user_id: "${pr_id}" }
            - { call: "POST /payment-integrity/claims/${cr_id}/lines", payload: { line_number: 3, procedure_code: "A0003", billed_cents: 101 }, as: Provider, as_user_id: "${pr_id}" }
            - { call: "POST /payment-integrity/claims/${cr_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "POST /payment-integrity/claims/${cr_id}/itemized-bill-reviews", payload: {}, as: SeniorReviewer, as_user_id: senior-1, captures: { ibr_id: $.data.id } }
            - { call: "POST /payment-integrity/itemized-bill-reviews/${ibr_id}/receive-documents", payload: {}, as: Provider, as_user_id: "${pr_id}" }
            - { call: "POST /payment-integrity/itemized-bill-reviews/${ibr_id}/start-audit", payload: {}, as: SeniorReviewer, as_user_id: senior-1 }
          trigger:
            - { call: "POST /payment-integrity/itemized-bill-reviews/${ibr_id}/complete", payload: { findings_cents: 0 }, as: SeniorReviewer, as_user_id: senior-1, captures: { ibr_repriced: $.data.repriced_total_cents } }
          assert:
            - "ItemizedBillReview.${ibr_id}.repriced_total_cents == 282 (per-line round 94 + 94 + 94), NOT 283 (sum-then-round)"
            - "Claim.${cr_id}.allowed_amount_cents == 282 (min(current allowed 303, repriced 282))"
            - "Claim.${cr_id}.denied_amount_cents == 21"
            - "Claim.${cr_id}.status == READY_TO_PAY (gates closed at completion)"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: edit_version_suspend_reactivate_cycle
        grounds:
          - state_machines.EditVersion.ACTIVE_to_SUSPENDED
          - state_machines.EditVersion.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          EditVersion exhibits a true cycle ACTIVE -> SUSPENDED -> ACTIVE (and
          DRAFT -> PENDING_APPROVAL -> DRAFT via reject); a purely linear
          pipeline could not express reactivation after suspension.
        test_recipe:
          setup:
            - "Edit rule RC1 with one version (window 2026-01-01 open-ended), submitted and approved to ACTIVE"
          setup_api_calls:
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "CYC-01", category: POLICY, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rc_id: $.data.id, rc_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rc_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny line", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { evc_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${evc_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${evc_id}/approve", payload: { expected_edit_rule_version: "${rc_v}" }, as: EditApprover, as_user_id: approver-1, captures: { st_active: $.data.status } }
          trigger:
            - { call: "POST /payment-integrity/edit-versions/${evc_id}/suspend", payload: {}, as: EditApprover, as_user_id: approver-1, captures: { st_susp: $.data.status } }
            - { call: "POST /payment-integrity/edit-versions/${evc_id}/reactivate", payload: {}, as: EditApprover, as_user_id: approver-1, captures: { st_back: $.data.status } }
          assert:
            - "EditVersion.${evc_id} reached ACTIVE after approve (st_active == ACTIVE)"
            - "EditVersion.${evc_id}.status == SUSPENDED after suspend"
            - "EditVersion.${evc_id}.status == ACTIVE after reactivate (fp_rate 0 < 0.25 precondition holds)"
            - "cycle closed: ACTIVE -> SUSPENDED -> ACTIVE on the same version row"

      - name: dispute_rfi_round_trip_cycle
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_AWAITING_PROVIDER_INFO
          - state_machines.Dispute.AWAITING_PROVIDER_INFO_to_UNDER_REVIEW
        distinguishing_aspect: |
          Dispute exhibits a request-for-information cycle
          UNDER_REVIEW -> AWAITING_PROVIDER_INFO -> UNDER_REVIEW on a different
          entity than the EditVersion cycle; the hit stays CONFIRMED and claim
          dollars are untouched through the loop.
        test_recipe:
          setup:
            - "Provider PD6; edit ED6 ACTIVE; claim D6 (one 25000 line) screened, hit upheld -> claim DENIED; dispute opened"
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-D6", name: "Dispute Prov" }, as: PlanAdmin, captures: { pd6_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "RFI-DENY", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rd6_id: $.data.id, rd6_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rd6_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny line", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { evd6_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${evd6_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${evd6_id}/approve", payload: { expected_edit_rule_version: "${rd6_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "D6", provider_id: "${pd6_id}", member_id: "M-D6", claim_type: PROFESSIONAL, total_billed_cents: 25000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pd6_id}", captures: { cd6_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cd6_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 25000 }, as: Provider, as_user_id: "${pd6_id}" }
            - { call: "POST /payment-integrity/claims/${cd6_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${cd6_id}" }, as: Any, captures: { td6_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${td6_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${td6_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "GET /payment-integrity/claims/${cd6_id}", payload: {}, as: Any, captures: { cd6_v: $.data.version } }
            - { call: "GET /payment-integrity/claims/${cd6_id}/edit-hits", payload: {}, as: Any, captures: { hd6_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/claims/${cd6_id}/disputes", payload: { edit_hit_id: "${hd6_id}", reason: "contest denial", expected_claim_version: "${cd6_v}" }, as: Provider, as_user_id: "${pd6_id}", captures: { dd6_id: $.data.id } }
            - { call: "POST /payment-integrity/disputes/${dd6_id}/start-review", payload: {}, as: DisputeAdjudicator, as_user_id: adj-1 }
