  - section: state_machines
    instances:

      - name: newly_created_lifecycle_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.DemolitionContractor
          - state_machines.DemolitionWorkOrder
          - state_machines.UtilityDisconnection
          - state_machines.RelocationCase
        distinguishing_aspect: |
          Four independent machines are seeded in one chain: the contractor lands in ACTIVE, the work
          order in ISSUED with required_utility_types copied from REQUIRED_UTILITY_TYPES and
          confirmed_utility_types empty, the relocation case in OPENED with every benefit field 0,
          and the first UtilityDisconnection lands in PENDING while in the same write pushing its
          compound parent off ISSUED to UTILITY_HOLD - the only initial state that is not stable.
        test_recipe:
          setup:
            - "One MitigationProject in DRAFT with one parcel; work orders and relocation cases are not gated on project approval."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /mitigation-projects"
              payload: { project_code: "SM-INIT-1", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj: "$.data.id" }
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-SM-INIT", site_address: "2101 River Rd", acreage: 0.34, occupancy_type: "OWNER_OCCUPIED", structure_type: "SINGLE_FAMILY" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p1: "$.data.id" }
          trigger:
            - call: "POST /demolition-contractors"
              payload: { name: "Riverbend Wrecking", license_no: "DEM-1", asbestos_certified: true, max_concurrent_work_orders: 2 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { ct1: "$.data.id" }
            - call: "POST /parcels/${p1}/demolition-work-orders"
              payload: { parcel_id: "${p1}", contractor_id: "${ct1}", asbestos_survey_status: "CLEARED", scheduled_start: "2026-09-01T08:00:00Z", scheduled_end: "2026-09-03T17:00:00Z" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { wo1: "$.data.id" }
            - call: "POST /demolition-work-orders/${wo1}/utility-disconnections"
              payload: { work_order_id: "${wo1}", utility_type: "WATER", provider_name: "Riverbend Water Authority" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { ud_water: "$.data.id" }
            - call: "POST /parcels/${p1}/relocation-cases"
              payload: { parcel_id: "${p1}", displacee_type: "OWNER_OCCUPANT", household_reference: "HH-SM-INIT", rhp_method: "COMPARABLE_DWELLING", rental_assistance_start_date: "2026-09-01", comparable_dwelling_price_cents: 20600000, moving_expense_cents: 175000 }
              as: RelocationSpecialist
              as_user_id: "rs-1"
