          setup:
            - "One journal whose subject_areas is exactly [ONCOLOGY]; the handling editor covers both ONCOLOGY and CARDIOLOGY so the assignment itself is legal."
            - "One CARDIOLOGY manuscript, screened PLAGIARISM 5.0 (PASS), formatting COMPLIANT, assignment ACTIVE."
