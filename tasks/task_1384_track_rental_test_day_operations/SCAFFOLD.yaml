# =============================================================================
# Track Rental & Test Day Operations — Scaffold Seed Tables (v1)
# =============================================================================

scenario: |
  Track Rental & Test Day Operations (road course track rental): rental block
  booking & group size limits, insurance requirement & waiver collection,
  instructor/coach assignment & run-group classification, on-track incident
  response & session stoppage, noise limit & neighbor compliance monitoring,
  garage/paddock allocation & utilities, safety equipment inspection
  (helmet/harness), cancellation & weather policy

domain_name: track-rental-test-day
api_prefix: /tracks

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - derived_field_reconciliation
    - ops_run_checkpoint
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: posture_driven
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Track
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Track name" }
      - { name: noise_limit_db, type: integer, source: input, description: "Maximum permitted dB at property line" }
      - { name: run_group_capacity, type: integer, source: input, description: "Max simultaneous on-track cars per run group" }
      - { name: garage_bay_count, type: integer, source: input, description: "Total rentable garage bays" }
      - { name: paddock_stall_count, type: integer, source: input, description: "Total paddock stalls" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Coach
    parent: Track
    common_fields: true
    fields:
      - { name: track_id, type: string, source: system, description: "FK -> Track.id; home track" }
      - { name: full_name, type: string, source: input, description: "Coach full name" }
      - { name: cert_level, type: enum, source: input, description: "BASIC | INTERMEDIATE | RACE", constraints: "enum {BASIC, INTERMEDIATE, RACE}" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether coach is currently assignable" }
      - { name: assigned_booking_ids, type: array, source: computed, description: "Bookings this coach is currently attached to (status ACTIVE only)" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: TrackDay
    parent: Track
    common_fields: true
    fields:
      - { name: track_id, type: string, source: system, description: "FK -> Track.id; parent track" }
      - { name: date, type: string, source: input, description: "ISO-8601 date (YYYY-MM-DD) of the test day" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | WEATHER_HOLD | RUNNING | STOPPED | CLOSED | CANCELLED", constraints: "enum {SCHEDULED, OPEN, WEATHER_HOLD, RUNNING, STOPPED, CLOSED, CANCELLED}" }
      - { name: posture, type: enum, source: computed, description: "NORMAL | CAUTION | SUSPENDED — derived from open incidents, noise breaches, weather flag" }
      - { name: weather_flag, type: enum, source: system, default: "CLEAR", description: "CLEAR | WATCH | STOP — set by weather_hold action" }
      - { name: open_incident_count, type: integer, source: computed, description: "Incidents with status OPEN" }
      - { name: noise_breach_count, type: integer, source: computed, description: "NoiseReading rows with breach=true on this track day, last 24h window" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone checkpoint counter, bumped by run_ops" }
      - { name: cancelled_reason, type: enum, source: system, description: "CUSTOMER | WEATHER | SAFETY, null until CANCELLED", constraints: "enum {CUSTOMER, WEATHER, SAFETY}" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: RentalBlock
    parent: TrackDay
    common_fields: true
    fields:
      - { name: track_day_id, type: string, source: system, description: "FK -> TrackDay.id" }
      - { name: block_index, type: integer, source: input, description: "Sequence index within the day (0..N-1)" }
      - { name: start_minute, type: integer, source: input, description: "Minute-of-day start, inclusive" }
      - { name: end_minute, type: integer, source: input, description: "Minute-of-day end, exclusive (half-open interval [start,end))" }
      - { name: max_group_size, type: integer, source: input, description: "Per-block cap on simultaneous on-track cars (must be <= Track.run_group_capacity)" }
      - { name: seats_reserved, type: integer, source: computed, default: 0, description: "Sum of driver_count across bookings in APPROVED status" }
      - { name: seats_available, type: integer, source: computed, description: "= max_group_size - seats_reserved, never negative" }
      - { name: status, type: enum, source: system, description: "OPEN | FULL | CLOSED", constraints: "enum {OPEN, FULL, CLOSED}" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Booking
    parent: RentalBlock
    common_fields: true
    fields:
      - { name: rental_block_id, type: string, source: system, description: "FK -> RentalBlock.id" }
      - { name: organizer_user_id, type: string, source: input, description: "FK -> (opaque) renter's user id; identity used for segregation-of-duties checks" }
      - { name: group_name, type: string, source: input, description: "Display name of the renting group" }
      - { name: run_group_class, type: enum, source: input, description: "NOVICE | INTERMEDIATE | ADVANCED | RACE", constraints: "enum {NOVICE, INTERMEDIATE, ADVANCED, RACE}" }
      - { name: driver_count, type: integer, source: input, description: "Declared simultaneous drivers from this group" }
      - { name: insurance_policy_ref, type: string, source: input, description: "External insurance certificate reference (free-form)" }
      - { name: approval_status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED | CANCELLED", constraints: "enum {PENDING, APPROVED, REJECTED, CANCELLED}" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | AUTHORIZED | CAPTURED | REFUNDED | FORFEITED", constraints: "enum {UNPAID, AUTHORIZED, CAPTURED, REFUNDED, FORFEITED}" }
      - { name: cancel_policy_snapshot, type: object, source: computed, description: "Snapshot of cancellation policy thresholds at approval time" }
      - { name: refund_cents, type: integer, source: computed, default: 0, description: "Refund issued in cents on cancellation; 0 until cancel" }
      - { name: coach_id, type: string, source: system, description: "FK -> Coach.id; null until a coach is assigned" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Driver
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id" }
      - { name: full_name, type: string, source: input, description: "Driver full name" }
      - { name: license_class, type: enum, source: input, description: "STREET | CLUB | PRO", constraints: "enum {STREET, CLUB, PRO}" }
      - { name: waiver_status, type: enum, source: computed, description: "PENDING | SIGNED | EXPIRED", constraints: "enum {PENDING, SIGNED, EXPIRED}" }
      - { name: safety_status, type: enum, source: computed, description: "NOT_INSPECTED | PASSED | FAILED", constraints: "enum {NOT_INSPECTED, PASSED, FAILED}" }
      - { name: cleared_to_run, type: boolean, source: computed, description: "True only when waiver_status==SIGNED AND safety_status==PASSED AND booking APPROVED AND payment CAPTURED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Waiver
    parent: Driver
    common_fields: false
    fields:
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id" }
      - { name: signed_at_utc, type: datetime, source: input, description: "Timestamp the driver signed" }
      - { name: expires_at_utc, type: datetime, source: computed, description: "= signed_at_utc + WAIVER_TTL_HOURS hours" }
      - { name: signature_payload_hash, type: string, source: input, description: "Hash of the e-signature payload" }

  - name: SafetyInspection
    parent: Driver
    common_fields: false
    fields:
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id" }
      - { name: inspector_user_id, type: string, source: input, description: "FK -> (opaque) SafetyOfficer user id; MUST NOT equal Booking.organizer_user_id (segregation of duties)" }
      - { name: helmet_ok, type: boolean, source: input, description: "Helmet meets Snell/SA spec" }
      - { name: harness_ok, type: boolean, source: input, description: "Harness in date and mounted" }
      - { name: result, type: enum, source: computed, description: "PASSED if helmet_ok AND harness_ok else FAILED", constraints: "enum {PASSED, FAILED}" }
      - { name: inspected_at_utc, type: datetime, source: system, description: "Server-stamped inspection time" }

  - name: Session
    parent: TrackDay
    common_fields: true
    fields:
      - { name: track_day_id, type: string, source: system, description: "FK -> TrackDay.id" }
      - { name: rental_block_id, type: string, source: input, description: "FK -> RentalBlock.id; block this session runs in" }
      - { name: run_group_class, type: enum, source: input, description: "NOVICE | INTERMEDIATE | ADVANCED | RACE", constraints: "enum {NOVICE, INTERMEDIATE, ADVANCED, RACE}" }
      - { name: status, type: enum, source: system, description: "GREEN | RED | BLACK | CHECKERED", constraints: "enum {GREEN, RED, BLACK, CHECKERED}" }
      - { name: started_at_utc, type: datetime, source: system, description: "Server-stamped when session went GREEN" }
      - { name: ended_at_utc, type: datetime, source: system, description: "Server-stamped when CHECKERED" }
      - { name: lap_count, type: integer, source: system, default: 0, description: "Incremented by lap_event" }
      - { name: max_db_observed, type: integer, source: computed, default: 0, description: "Max dB across NoiseReading rows attributed to this session" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Incident
    parent: TrackDay
    common_fields: true
    fields:
      - { name: track_day_id, type: string, source: system, description: "FK -> TrackDay.id" }
      - { name: session_id, type: string, source: input, description: "FK -> Session.id; session where incident occurred" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL", constraints: "enum {LOW, MEDIUM, HIGH, CRITICAL}" }
      - { name: status, type: enum, source: system, description: "OPEN | INVESTIGATING | CLEARED", constraints: "enum {OPEN, INVESTIGATING, CLEARED}" }
      - { name: reported_by_user_id, type: string, source: input, description: "FK -> (opaque) reporter (TrackOps or SafetyOfficer)" }
      - { name: cleared_by_user_id, type: string, source: system, description: "FK -> (opaque) SafetyOfficer user id; MUST differ from reported_by_user_id" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: NoiseReading
    parent: TrackDay
    common_fields: false
    fields:
      - { name: track_day_id, type: string, source: system, description: "FK -> TrackDay.id" }
      - { name: session_id, type: string, source: input, description: "FK -> Session.id" }
      - { name: db_level, type: integer, source: input, description: "Observed dB at property line" }
      - { name: recorded_at_utc, type: datetime, source: input, description: "When the reading was taken" }
      - { name: breach, type: boolean, source: computed, description: "true iff db_level > Track.noise_limit_db (strictly greater)" }

  - name: GarageAssignment
    parent: TrackDay
    common_fields: true
    fields:
      - { name: track_day_id, type: string, source: system, description: "FK -> TrackDay.id" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: bay_number, type: integer, source: input, description: "Garage bay index (1..Track.garage_bay_count)" }
      - { name: power_hookups, type: integer, source: input, description: "Number of power hookups reserved (>=0)" }
      - { name: water_hookup, type: boolean, source: input, description: "Whether water hookup is reserved" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED", constraints: "enum {ACTIVE, RELEASED}" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: PaddockAssignment
    parent: TrackDay
    common_fields: true
    fields:
      - { name: track_day_id, type: string, source: system, description: "FK -> TrackDay.id" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: stall_number, type: integer, source: input, description: "Paddock stall index (1..Track.paddock_stall_count)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED", constraints: "enum {ACTIVE, RELEASED}" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TrackDay
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /tracks/{tid}/track-days/{tdid}/open"
        actor: TrackOps
        preconditions:
          - "TrackDay.status == SCHEDULED"
        side_effects:
          - "posture recomputed (NORMAL if no open incidents/breaches/weather stop)"

      - from: OPEN
        to: RUNNING
        trigger: "system (first Session transitions to GREEN on this TrackDay)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RUNNING
        to: STOPPED
        trigger: "system (any Incident with severity in {HIGH, CRITICAL} transitions to OPEN, or weather_flag becomes STOP)"
        actor: system
        preconditions: []
        side_effects:
          - "All GREEN sessions on this TrackDay cascade to RED"
          - "posture recomputed → SUSPENDED"

      - from: STOPPED
        to: RUNNING
        trigger: "POST /tracks/{tid}/track-days/{tdid}/resume"
        actor: SafetyOfficer
        preconditions:
          - "open_incident_count == 0"
          - "weather_flag != STOP"
          - "noise_breach_count < NOISE_BREACH_SUSPENSION_THRESHOLD"
        side_effects:
          - "posture recomputed (NORMAL or CAUTION depending on breach count)"
          - "Every RED session that was active pre-stop returns to GREEN"

      - from: OPEN
        to: WEATHER_HOLD
        trigger: "POST /tracks/{tid}/track-days/{tdid}/weather_hold"
        actor: TrackOps
        preconditions:
          - "weather_flag in {CLEAR, WATCH}"
        side_effects:
          - "weather_flag = WATCH"

      - from: RUNNING
        to: WEATHER_HOLD
        trigger: "POST /tracks/{tid}/track-days/{tdid}/weather_hold"
        actor: TrackOps
        preconditions:
          - "weather_flag in {CLEAR, WATCH}"
        side_effects:
          - "weather_flag = WATCH"
          - "All GREEN sessions → RED"

      - from: WEATHER_HOLD
        to: OPEN
        trigger: "POST /tracks/{tid}/track-days/{tdid}/weather_clear"
        actor: TrackOps
        preconditions:
          - "weather_flag == WATCH"
        side_effects:
          - "weather_flag = CLEAR"

      - from: WEATHER_HOLD
        to: CANCELLED
        trigger: "POST /tracks/{tid}/track-days/{tdid}/cancel (reason=WEATHER)"
        actor: TrackOps
        preconditions: []
        side_effects:
          - "cancelled_reason = WEATHER"
          - "All bookings on this TrackDay cascade to CANCELLED with refund per weather policy"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /tracks/{tid}/track-days/{tdid}/cancel (reason=CUSTOMER or SAFETY)"
        actor: TrackOps
        preconditions:
          - "If reason==SAFETY: open_incident_count > 0"
        side_effects:
          - "cancelled_reason set"
          - "All bookings cascade to CANCELLED; refund policy applied per reason"

      - from: RUNNING
        to: CANCELLED
        trigger: "POST /tracks/{tid}/track-days/{tdid}/cancel (reason=WEATHER or SAFETY)"
        actor: TrackOps
        preconditions: []
        side_effects:
          - "cancelled_reason set"
          - "All GREEN sessions → BLACK; RED sessions → BLACK"
          - "All bookings cascade to CANCELLED; refund policy applied"

      - from: RUNNING
        to: CLOSED
        trigger: "POST /tracks/{tid}/track-days/{tdid}/close"
        actor: TrackOps
        preconditions:
          - "open_incident_count == 0"
          - "No session on this TrackDay in GREEN or RED"
        side_effects:
          - "posture recomputed; Bookings remain, payments finalized"

  - entity: RentalBlock
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system (seats_reserved == max_group_size after a booking approval)"
        actor: system
        preconditions: []
        side_effects:
          - "New booking submissions rejected with ERR_BLOCK_FULL"

      - from: FULL
        to: OPEN
        trigger: "system (seats_reserved < max_group_size after a booking cancel/reject)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OPEN
        to: CLOSED
        trigger: "POST /tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/close_block"
        actor: TrackOps
        preconditions: []
        side_effects:
          - "PENDING bookings on this block → REJECTED"

      - from: FULL
        to: CLOSED
        trigger: "POST /tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/close_block"
        actor: TrackOps
        preconditions: []
        side_effects:
          - "PENDING bookings on this block → REJECTED"

  - entity: Booking
    initial_state: PENDING
    terminal_states: [REJECTED, CANCELLED]
    note: "Parallel state dimensions — approval_status and payment_status evolve semi-independently"
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/bookings/{bid}/approve"
        actor: TrackOps
        preconditions:
          - "RentalBlock.status != CLOSED"
          - "seats_available >= driver_count"
          - "TrackDay.posture != SUSPENDED"
          - "TrackDay.status in {OPEN, RUNNING}"
          - "Coach assignment is required iff run_group_class == NOVICE (coach_id must be set)"
        side_effects:
          - "seats_reserved += driver_count (RentalBlock)"
          - "cancel_policy_snapshot frozen"
          - "If seats_reserved == max_group_size: RentalBlock.status → FULL"

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/bookings/{bid}/cancel"
        actor: "TrackOps | Organizer"
        preconditions:
          - "payment_status determines refund tier"
        side_effects:
          - "seats_reserved -= driver_count"
          - "RentalBlock.status recomputed"
          - "GarageAssignment / PaddockAssignment for this booking → RELEASED"
          - "Coach unassigned (coach_id=null, Coach.assigned_booking_ids updated)"
          - "Refund per cancel policy (chronological vs weather-aware variants)"

      - from: PENDING
        to: REJECTED
        trigger: "POST /tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/bookings/{bid}/reject"
        actor: TrackOps
        preconditions: []
        side_effects: []

  - entity: Driver
    initial_state: NOT_INSPECTED
    terminal_states: []
    note: "Driver state emerges from waiver_status x safety_status x Booking state; computed"
    transitions:
      - from: NOT_INSPECTED
        to: PASSED
        trigger: "POST /tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/bookings/{bid}/drivers/{did}/inspect"
        actor: SafetyOfficer
        preconditions:
          - "helmet_ok AND harness_ok"
          - "inspector_user_id != Booking.organizer_user_id"
        side_effects:
          - "safety_status = PASSED; cleared_to_run recomputed"

      - from: NOT_INSPECTED
        to: FAILED
        trigger: "POST .../inspect with helmet_ok=false OR harness_ok=false"
        actor: SafetyOfficer
        preconditions:
          - "inspector_user_id != Booking.organizer_user_id"
        side_effects:
          - "safety_status = FAILED"

      - from: FAILED
        to: PASSED
        trigger: "POST .../inspect (re-inspection)"
        actor: SafetyOfficer
        preconditions:
          - "helmet_ok AND harness_ok"
          - "inspector_user_id != Booking.organizer_user_id"
        side_effects:
          - "safety_status = PASSED"

  - entity: Session
    initial_state: GREEN
    terminal_states: [CHECKERED]
    transitions:
      - from: GREEN
        to: RED
        trigger: "system (incident OPENED with severity in {MEDIUM,HIGH,CRITICAL} on this session, or weather_hold on TrackDay)"
        actor: system
        preconditions: []
        side_effects:
          - "If incident severity HIGH/CRITICAL: TrackDay cascades to STOPPED"

      - from: RED
        to: GREEN
        trigger: "system (TrackDay resume; every RED session returns to GREEN)"
        actor: system
        preconditions:
          - "open_incident_count == 0"
        side_effects: []

      - from: GREEN
        to: BLACK
        trigger: "system (TrackDay cancel cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "ended_at_utc stamped"

      - from: RED
        to: BLACK
        trigger: "system (TrackDay cancel cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "ended_at_utc stamped"

      - from: GREEN
        to: CHECKERED
        trigger: "POST /tracks/{tid}/track-days/{tdid}/sessions/{sid}/checkered"
        actor: TrackOps
        preconditions:
          - "lap_count >= MIN_LAPS_FOR_CHECKERED"
        side_effects:
          - "ended_at_utc stamped"

  - entity: Incident
    initial_state: OPEN
    terminal_states: [CLEARED]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /tracks/{tid}/track-days/{tdid}/incidents/{iid}/investigate"
        actor: SafetyOfficer
        preconditions: []
        side_effects: []

      - from: INVESTIGATING
        to: CLEARED
        trigger: "POST /tracks/{tid}/track-days/{tdid}/incidents/{iid}/clear"
        actor: SafetyOfficer
        preconditions:
          - "cleared_by_user_id != reported_by_user_id (segregation of duties)"
        side_effects:
          - "open_incident_count -= 1 (TrackDay)"
          - "posture recomputed"

      - from: OPEN
        to: CLEARED
        trigger: "POST /tracks/{tid}/track-days/{tdid}/incidents/{iid}/clear (skipping INVESTIGATING)"
        actor: SafetyOfficer
        preconditions:
          - "severity in {LOW}"
          - "cleared_by_user_id != reported_by_user_id"
        side_effects:
          - "open_incident_count -= 1"
          - "posture recomputed"

  - entity: GarageAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /tracks/{tid}/track-days/{tdid}/garage-assignments/{gid}/release OR system (booking cancel cascade)"
        actor: "TrackOps | system"
        preconditions: []
        side_effects:
          - "Bay freed for reassignment"

  - entity: PaddockAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /tracks/{tid}/track-days/{tdid}/paddock-assignments/{pid}/release OR system (booking cancel cascade)"
        actor: "TrackOps | system"
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: booking-approve-stale-block-version
    parent_entity: RentalBlock
    write_endpoint: "POST /tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/bookings/{bid}/approve"
    occ_field: expected_rental_block_version
    description: |
      Approving a booking against a RentalBlock whose version has advanced
      since the client last observed it is rejected. A prior approval may have
      just consumed the remaining seats, flipping the block to FULL, so the
      current approver's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: trackday-resume-stale-version
    parent_entity: TrackDay
    write_endpoint: "POST /tracks/{tid}/track-days/{tdid}/resume"
    occ_field: expected_track_day_version
    description: |
      Resuming a TrackDay whose version has advanced since the client last
      observed it is rejected. A prior resume or a fresh incident may have
      already advanced state, so the current request is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: garage-assign-stale-trackday-version
    parent_entity: TrackDay
    write_endpoint: "POST /tracks/{tid}/track-days/{tdid}/garage-assignments"
    occ_field: expected_track_day_version
    description: |
      Creating a GarageAssignment against a TrackDay whose version has advanced
      since the client last observed it is rejected. A prior garage assignment
      may have just consumed the last free bay, so the current request's view
      of capacity is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rental_block_seats_available
    trigger: "booking approval, booking cancellation"
    algorithm: aggregation
    formula: |
      seats_reserved = sum(driver_count for Booking on this RentalBlock where approval_status == APPROVED)
      seats_available = max_group_size - seats_reserved
      if seats_available < 0: seats_available = 0   # floor at 0
      RentalBlock.status = FULL iff seats_available == 0, OPEN otherwise (unless CLOSED)
    input_set: "Bookings with approval_status == APPROVED on this RentalBlock"

  - name: trackday_posture
    trigger: "incident create/clear, noise reading create, weather_hold/weather_clear, resume"
    algorithm: derived
    formula: |
      if weather_flag == STOP:
        posture = SUSPENDED
      else if open_incident_count > 0 and any OPEN incident has severity in {HIGH, CRITICAL}:
        posture = SUSPENDED
      else if noise_breach_count >= NOISE_BREACH_SUSPENSION_THRESHOLD:
        posture = SUSPENDED
      else if open_incident_count > 0 OR noise_breach_count >= NOISE_BREACH_CAUTION_THRESHOLD OR weather_flag == WATCH:
        posture = CAUTION
      else:
        posture = NORMAL
    constants:
      NOISE_BREACH_CAUTION_THRESHOLD: 1
      NOISE_BREACH_SUSPENSION_THRESHOLD: 3

  - name: cancel_refund_cents
    trigger: "booking cancel (customer-initiated, or TrackDay cancellation)"
    algorithm: chronological
    formula: |
      Inputs:
        payment_status ∈ {AUTHORIZED, CAPTURED}
        cancelled_reason ∈ {CUSTOMER, WEATHER, SAFETY}
        hours_until_block_start = (rental_block.start on track_day.date) - now_utc, in whole hours, floor
        fee_cents (declared on Booking; assume a fixed fee_per_driver_cents constant × driver_count)
      Variant CHRONOLOGICAL (default for CUSTOMER reason):
        if hours_until_block_start >= FULL_REFUND_HOURS: refund_pct = 1.00
        else if hours_until_block_start >= HALF_REFUND_HOURS: refund_pct = 0.50
        else: refund_pct = 0.00
        refund_cents = round_half_up(fee_cents * refund_pct)
      Variant WEATHER_POLICY (forced when reason==WEATHER):
        # Weather always refunds 75% regardless of notice, minus a fixed facility fee
        refund_cents = round_half_up(fee_cents * 0.75) - WEATHER_FACILITY_FEE_CENTS
        if refund_cents < 0: refund_cents = 0
      Variant SAFETY_POLICY (forced when reason==SAFETY):
        refund_cents = fee_cents  # full refund
      If payment_status == AUTHORIZED (not yet CAPTURED): refund_cents = 0 and authorization is voided.
    variants:
      - name: chronological
        when: "cancelled_reason == CUSTOMER"
        difference: "Refund % depends on notice window; produces 0%, 50%, or 100% of fee"
      - name: weather_policy
        when: "cancelled_reason == WEATHER"
        difference: "Always 75% minus fixed facility fee; independent of notice"
      - name: safety_policy
        when: "cancelled_reason == SAFETY"
        difference: "Always 100%; independent of notice"
    constants:
      FULL_REFUND_HOURS: 72
      HALF_REFUND_HOURS: 24
      WEATHER_FACILITY_FEE_CENTS: 5000
      FEE_PER_DRIVER_CENTS: 35000
    precision: "integer cents, round_half_up"

  - name: trackday_posture_noise_window
    trigger: "noise reading create"
    algorithm: threshold
    formula: |
      # Aggregate over a sliding window: breach counts in the last NOISE_WINDOW_MINUTES
      window_start = now_utc - NOISE_WINDOW_MINUTES minutes
      noise_breach_count = count(NoiseReading on TrackDay where breach==true AND recorded_at_utc >= window_start)
      # Boundary: strictly greater than noise_limit_db triggers breach
    constants:
      NOISE_WINDOW_MINUTES: 60
    precision: "integer"

  - name: run_group_assignment_priority
    trigger: "booking approval when multiple PENDING bookings compete for last seats"
    algorithm: constraint_propagation
    formula: |
      # When approval would consume the last N seats and more than one PENDING booking
      # fits partially, rank by:
      #   (1) run_group_class priority: NOVICE > INTERMEDIATE > ADVANCED > RACE
      #   (2) booking.created_at ASC (earlier submission wins ties)
      # A booking is approved only if driver_count <= seats_available at the moment of approval.
    input_set: "PENDING bookings on this RentalBlock"

  - name: noise_breach_db
    trigger: "noise reading create"
    algorithm: threshold
    formula: |
      breach = (db_level > Track.noise_limit_db)   # strictly greater; equality is NOT a breach
      Session.max_db_observed = max(Session.max_db_observed, db_level)

  - name: garage_utility_fee_cents
    trigger: "garage assignment create"
    algorithm: tiered_pricing
    formula: |
      base_cents = GARAGE_BASE_FEE_CENTS
      # Tiered power hookup fee
      if power_hookups <= 2: power_fee_cents = power_hookups * POWER_TIER1_CENTS
      else: power_fee_cents = 2 * POWER_TIER1_CENTS + (power_hookups - 2) * POWER_TIER2_CENTS
      water_fee_cents = WATER_FLAT_CENTS if water_hookup else 0
      garage_utility_fee_cents = base_cents + power_fee_cents + water_fee_cents
    constants:
      GARAGE_BASE_FEE_CENTS: 15000
      POWER_TIER1_CENTS: 2500
      POWER_TIER2_CENTS: 4000
      WATER_FLAT_CENTS: 3000
    precision: "integer cents"

  - name: coach_utilization
    trigger: "coach assign / unassign"
    algorithm: aggregation
    formula: |
      assigned_booking_ids = list of Booking.id where coach_id == this Coach.id AND approval_status == APPROVED
      A NOVICE booking requires a coach; a coach may serve at most MAX_BOOKINGS_PER_COACH simultaneous bookings on the same TrackDay.
    constants:
      MAX_BOOKINGS_PER_COACH: 3

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header is present and a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is permitted to invoke this endpoint (per §1.5 roles list)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Track / TrackDay / RentalBlock / Booking / Driver / Session / Incident / Assignment ids exist within parent scope"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_constraint
    check: "Required request body fields present, types valid, enums valid, ids well-formed"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version matches current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "endpoints guarded by §1.2.1"

  - priority: 6
    category: state
    check: "TrackDay.status permits forward progress (not CANCELLED, not CLOSED)"
    error_id: ERR_TRACK_DAY_NOT_LIVE
    http_status: 409
    applies_to: "booking create/approve, garage/paddock assignment create, session start, incident report"

  - priority: 7
    category: state
    check: "Resource in valid state for this transition (state-machine precondition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 8
    category: business_safety
    check: "TrackDay.posture != SUSPENDED for any forward-progress operation"
    error_id: ERR_TRACK_SUSPENDED
    http_status: 409
    applies_to: "booking approve, session start (GREEN), garage assignment create, coach assign"

  - priority: 9
    category: business_safety
    check: "Segregation of duties: inspector_user_id != Booking.organizer_user_id; incident cleared_by_user_id != reported_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "driver inspect, incident clear"

  - priority: 10
    category: business_safety
    check: "Driver cleared_to_run prerequisites: waiver SIGNED, safety PASSED, booking APPROVED, payment CAPTURED"
    error_id: ERR_DRIVER_NOT_CLEARED
    http_status: 422
    applies_to: "session lap_event attribution (driver_id), driver start"

  - priority: 11
    category: business_referential
    check: "Coach cert_level suffices for run_group_class: NOVICE requires INTERMEDIATE+; RACE requires RACE cert"
    error_id: ERR_COACH_CERT_INSUFFICIENT
    http_status: 422
    applies_to: "coach assign"

  - priority: 12
    category: business_referential
    check: "Coach.assigned_booking_ids count < MAX_BOOKINGS_PER_COACH for this TrackDay"
    error_id: ERR_COACH_OVERLOADED
    http_status: 409
    applies_to: "coach assign"

  - priority: 13
    category: business_temporal
    check: "RentalBlock interval does not overlap another block on the same TrackDay (half-open [start,end) — adjacent is allowed)"
    error_id: ERR_BLOCK_OVERLAP
    http_status: 409
    applies_to: "rental-block create"

  - priority: 14
    category: business_temporal
    check: "GarageAssignment bay_number not already ACTIVE on this TrackDay"
    error_id: ERR_BAY_OCCUPIED
    http_status: 409
    applies_to: "garage assignment create"

  - priority: 15
    category: business_temporal
    check: "PaddockAssignment stall_number not already ACTIVE on this TrackDay"
    error_id: ERR_STALL_OCCUPIED
    http_status: 409
    applies_to: "paddock assignment create"

  - priority: 16
    category: business_constraint
    check: "RentalBlock.max_group_size <= Track.run_group_capacity"
    error_id: ERR_GROUP_SIZE_EXCEEDS_TRACK_CAP
    http_status: 422
    applies_to: "rental-block create"

  - priority: 17
    category: business_constraint
    check: "Booking.driver_count >= 1 AND <= RentalBlock.max_group_size"
    error_id: ERR_INVALID_DRIVER_COUNT
    http_status: 422
    applies_to: "booking create"

  - priority: 18
    category: business_constraint
    check: "Booking approval: seats_available >= driver_count"
    error_id: ERR_BLOCK_FULL
    http_status: 409
    applies_to: "booking approve"

  - priority: 19
    category: business_fiscal
    check: "Booking approval: insurance_policy_ref must be present and non-empty"
    error_id: ERR_INSURANCE_MISSING
    http_status: 422
    applies_to: "booking approve"

  - priority: 20
    category: business_fiscal
    check: "Payment capture: payment_status must be AUTHORIZED before CAPTURED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "payment capture"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving (last resort: clock + payment simulation) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set logical clock to given ISO-8601 UTC instant. Server starts at 2026-08-01T00:00:00Z by default; this is the only way to advance time."
    roles: [TrackOps]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

  - method: POST
    path: "/_payments/simulate"
    description: "Drive a Booking's payment_status through AUTHORIZED/CAPTURED transitions."
    roles: [TrackOps]
    code: 200
    input: [booking_id, outcome]
    output: Booking
    side_effects:
      - "outcome=AUTHORIZE: payment_status UNPAID → AUTHORIZED"
      - "outcome=CAPTURE: payment_status AUTHORIZED → CAPTURED"
      - "outcome=VOID: payment_status AUTHORIZED → UNPAID"
      - "outcome=REFUND: payment_status CAPTURED → REFUNDED"

  # --- Track ---
  - method: POST
    path: "/tracks"
    description: "Create a Track"
    roles: [TrackOps]
    code: 201
    input: [name, noise_limit_db, run_group_capacity, garage_bay_count, paddock_stall_count]
    output: Track
    side_effects: []

  - method: GET
    path: "/tracks/{tid}"
    description: "Get Track"
    roles: [TrackOps, SafetyOfficer, Coach, Organizer]
    code: 200
    input: []
    output: Track
    side_effects: []

  # --- Coach ---
  - method: POST
    path: "/tracks/{tid}/coaches"
    description: "Register a coach"
    roles: [TrackOps]
    code: 201
    input: [full_name, cert_level, "active?"]
    output: Coach
    side_effects: []

  - method: GET
    path: "/tracks/{tid}/coaches/{cid}"
    description: "Get coach"
    roles: [TrackOps, SafetyOfficer, Coach, Organizer]
    code: 200
    input: []
    output: Coach
    side_effects: []

  - method: GET
    path: "/tracks/{tid}/coaches"
    description: "List coaches"
    roles: [TrackOps, SafetyOfficer, Coach, Organizer]
    code: 200
    input: ["cert_level?", "active?"]
    output: "Coach[]"
    side_effects: []

  # --- TrackDay ---
  - method: POST
    path: "/tracks/{tid}/track-days"
    description: "Create a TrackDay (status=SCHEDULED)"
    roles: [TrackOps]
    code: 201
    input: [date]
    output: TrackDay
    side_effects: ["status=SCHEDULED, weather_flag=CLEAR, ops_run_index=0"]

  - method: GET
    path: "/tracks/{tid}/track-days/{tdid}"
    description: "Get TrackDay"
    roles: [TrackOps, SafetyOfficer, Coach, Organizer]
    code: 200
    input: []
    output: TrackDay
    side_effects: []

  - method: GET
    path: "/tracks/{tid}/track-days"
    description: "List TrackDays"
    roles: [TrackOps, SafetyOfficer, Coach, Organizer]
    code: 200
    input: ["date?", "status?"]
    output: "TrackDay[]"
    side_effects: []

  - method: POST
    path: "/tracks/{tid}/track-days/{tdid}/open"
    description: "Open the track day (SCHEDULED → OPEN)"
    roles: [TrackOps]
    code: 200
    input: []
    output: TrackDay
    side_effects: ["status → OPEN; posture recomputed; increments TrackDay.version by 1"]

  - method: POST
    path: "/tracks/{tid}/track-days/{tdid}/weather_hold"
    description: "Declare weather hold (weather_flag = WATCH)"
    roles: [TrackOps]
    code: 200
    input: []
    output: TrackDay
    side_effects: ["weather_flag=WATCH; if RUNNING: GREEN sessions → RED; increments TrackDay.version by 1"]

  - method: POST
    path: "/tracks/{tid}/track-days/{tdid}/weather_clear"
    description: "Clear weather hold"
    roles: [TrackOps]
    code: 200
    input: []
    output: TrackDay
    side_effects: ["weather_flag=CLEAR; increments TrackDay.version by 1"]

  - method: POST
    path: "/tracks/{tid}/track-days/{tdid}/resume"
    description: "Resume from STOPPED (OCC on TrackDay.version)"
    roles: [SafetyOfficer]
    code: 200
    input: [expected_track_day_version]
    output: TrackDay
    side_effects: ["status → RUNNING; RED sessions → GREEN; posture recomputed; increments TrackDay.version by 1"]

  - method: POST
    path: "/tracks/{tid}/track-days/{tdid}/cancel"
    description: "Cancel the track day"
    roles: [TrackOps]
    code: 200
    input: [reason]
    output: TrackDay
    side_effects: ["status → CANCELLED; sessions → BLACK; bookings → CANCELLED with refunds; increments TrackDay.version by 1"]

  - method: POST
    path: "/tracks/{tid}/track-days/{tdid}/close"
    description: "Close the track day (RUNNING → CLOSED)"
    roles: [TrackOps]
    code: 200
    input: []
    output: TrackDay
    side_effects: ["status → CLOSED; increments TrackDay.version by 1"]

  - method: POST
    path: "/tracks/{tid}/track-days/{tdid}/run_ops"
    description: "Ops checkpoint: bump ops_run_index, expire stale waivers, recompute posture"
    roles: [TrackOps]
    code: 200
    input: []
    output: TrackDay
    side_effects:
      - "ops_run_index += 1"
      - "Waivers with expires_at_utc < now_utc: driver.waiver_status → EXPIRED"
      - "posture recomputed"
      - "increments TrackDay.version by 1"

  # --- RentalBlock ---
  - method: POST
    path: "/tracks/{tid}/track-days/{tdid}/rental-blocks"
    description: "Create a RentalBlock"
    roles: [TrackOps]
    code: 201
    input: [block_index, start_minute, end_minute, max_group_size]
    output: RentalBlock
    side_effects: ["status=OPEN, seats_reserved=0"]

  - method: GET
    path: "/tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}"
    description: "Get RentalBlock"
    roles: [TrackOps, SafetyOfficer, Coach, Organizer]
    code: 200
    input: []
    output: RentalBlock
    side_effects: []

  - method: GET
    path: "/tracks/{tid}/track-days/{tdid}/rental-blocks"
    description: "List RentalBlocks on a TrackDay"
    roles: [TrackOps, SafetyOfficer, Coach, Organizer]
    code: 200
    input: []
    output: "RentalBlock[]"
    side_effects: []

  - method: POST
    path: "/tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/close_block"
    description: "Close the block (reject PENDING bookings)"
    roles: [TrackOps]
    code: 200
    input: []
    output: RentalBlock
    side_effects: ["status → CLOSED; PENDING bookings → REJECTED"]

  # --- Booking ---
  - method: POST
    path: "/tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/bookings"
    description: "Create a booking (status=PENDING, payment=UNPAID)"
    roles: [Organizer]
    code: 201
    input: [organizer_user_id, group_name, run_group_class, driver_count, insurance_policy_ref, "coach_id?"]
    output: Booking
    side_effects: []

  - method: GET
    path: "/tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/bookings/{bid}"
    description: "Get booking"
    roles: [TrackOps, SafetyOfficer, Coach, Organizer]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/bookings"
    description: "List bookings for a block"
    roles: [TrackOps, SafetyOfficer, Coach, Organizer]
    code: 200
    input: ["approval_status?", "run_group_class?"]
    output: "Booking[]"
    side_effects: []

  - method: POST
    path: "/tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/bookings/{bid}/approve"
    description: "Approve a booking (OCC on RentalBlock.version)"
    roles: [TrackOps]
    code: 200
    input: [expected_rental_block_version]
    output: Booking
    side_effects:
      - "approval_status → APPROVED"
      - "RentalBlock.seats_reserved += driver_count"
      - "cancel_policy_snapshot frozen"
      - "increments RentalBlock.version by 1"

  - method: POST
    path: "/tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/bookings/{bid}/reject"
    description: "Reject a PENDING booking"
    roles: [TrackOps]
    code: 200
    input: []
    output: Booking
    side_effects: ["approval_status → REJECTED"]

  - method: POST
    path: "/tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/bookings/{bid}/cancel"
    description: "Cancel a booking (applies refund per cancel_policy_snapshot and reason)"
    roles: [TrackOps, Organizer]
    code: 200
    input: ["reason?"]
    output: Booking
    side_effects:
      - "approval_status → CANCELLED"
      - "RentalBlock.seats_reserved -= driver_count"
      - "GarageAssignment/PaddockAssignment → RELEASED"
      - "Coach unassigned"
      - "Refund applied per cancel_refund_cents calculation"

  - method: POST
    path: "/tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/bookings/{bid}/assign_coach"
    description: "Assign a coach to the booking"
    roles: [TrackOps]
    code: 200
    input: [coach_id]
    output: Booking
    side_effects:
      - "coach_id set"
      - "Coach.assigned_booking_ids updated"

  # --- Driver ---
  - method: POST
    path: "/tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/bookings/{bid}/drivers"
    description: "Register a driver on the booking"
    roles: [Organizer]
    code: 201
    input: [full_name, license_class]
    output: Driver
    side_effects: ["waiver_status=PENDING, safety_status=NOT_INSPECTED"]

  - method: GET
    path: "/tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/bookings/{bid}/drivers/{did}"
    description: "Get driver"
    roles: [TrackOps, SafetyOfficer, Coach, Organizer]
    code: 200
    input: []
    output: Driver
    side_effects: []

  - method: GET
    path: "/tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/bookings/{bid}/drivers"
    description: "List drivers"
    roles: [TrackOps, SafetyOfficer, Coach, Organizer]
    code: 200
    input: []
    output: "Driver[]"
    side_effects: []

  - method: POST
    path: "/tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/bookings/{bid}/drivers/{did}/waiver"
    description: "Submit signed waiver for a driver"
    roles: [Organizer, TrackOps]
    code: 201
    input: [signed_at_utc, signature_payload_hash]
    output: Waiver
    side_effects: ["driver.waiver_status → SIGNED; expires_at_utc computed; cleared_to_run recomputed"]

  - method: GET
    path: "/tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/bookings/{bid}/drivers/{did}/waivers"
    description: "List waivers for the driver"
    roles: [TrackOps, SafetyOfficer, Coach, Organizer]
    code: 200
    input: []
    output: "Waiver[]"
    side_effects: []

  - method: POST
    path: "/tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/bookings/{bid}/drivers/{did}/inspect"
    description: "Submit safety inspection for a driver"
    roles: [SafetyOfficer]
    code: 201
    input: [inspector_user_id, helmet_ok, harness_ok]
    output: SafetyInspection
    side_effects: ["safety_status set to PASSED or FAILED; cleared_to_run recomputed"]

  - method: GET
    path: "/tracks/{tid}/track-days/{tdid}/rental-blocks/{rbid}/bookings/{bid}/drivers/{did}/inspections"
    description: "List safety inspections for the driver"
    roles: [TrackOps, SafetyOfficer, Coach, Organizer]
    code: 200
    input: []
    output: "SafetyInspection[]"
    side_effects: []

  # --- Session ---
  - method: POST
    path: "/tracks/{tid}/track-days/{tdid}/sessions"
    description: "Start a session (status=GREEN) on a RentalBlock"
    roles: [TrackOps]
    code: 201
    input: [rental_block_id, run_group_class]
    output: Session
    side_effects:
      - "Session.status=GREEN; started_at_utc stamped"
      - "If TrackDay.status == OPEN: TrackDay.status → RUNNING"
      - "TrackDay.version incremented (cascade)"

  - method: GET
    path: "/tracks/{tid}/track-days/{tdid}/sessions/{sid}"
    description: "Get session"
    roles: [TrackOps, SafetyOfficer, Coach, Organizer]
    code: 200
    input: []
    output: Session
    side_effects: []

  - method: GET
    path: "/tracks/{tid}/track-days/{tdid}/sessions"
    description: "List sessions"
    roles: [TrackOps, SafetyOfficer, Coach, Organizer]
    code: 200
    input: ["status?", "rental_block_id?"]
