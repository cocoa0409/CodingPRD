            - "Policy.${policy_mec_id}.cash_surrender_value_usd == 1500000.00"
            - "Policy.${policy_nonmec_id}.cost_basis_usd == 1200000.00"
            - "Policy.${policy_mec_id}.cost_basis_usd == 1200000.00"
