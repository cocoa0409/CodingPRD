            - call: "POST /threat-cases/${case_id}/team-assignments"
              payload: { member_employee_id: "${lead_id}", discipline: "HR", role_on_team: "LEAD" }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
              captures: { seat_hr_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/team-assignments"
