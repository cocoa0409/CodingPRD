# =============================================================================
# SCAFFOLD — Managing Partner Equity Buy-In & Restaurant Profit Participation
# Task: task_3042_managing_partner_equity_buy_restaurant_profit_participation
# =============================================================================

scenario: |
  Managing Partner Equity Buy-In & Restaurant Profit Participation (Texas Roadhouse): managing partner contracts with a capital buy-in and a share of restaurant-level profit over a multi-year term, market partner oversight of a group of restaurants with an override share, in-house meat cutting with per-cut yield standards and waste accountability affecting partner profit, partner conference and stock award programs tied to performance, contract renewal, buy-out and transfer on partner departure, restaurant-level profit computation rules including which corporate charges are excluded, partner recruiting pipeline and training tenure requirements, dispute handling on profit calculations

domain_name: managing-partner-equity
api_prefix: /api

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation        # provisional vs final restaurant profit over the same posted data
  secondary_archetype: multi_party_negotiation    # contract renewal offers, departure buy-out approval, dispute evidence rounds
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - scheduled_actions                          # logical-clock-driven lapse/expiry sweeps
  entity_topology: flat                          # peer entities joined by FK references; no nested URL paths
  state_machine_shape: cyclic                    # renewal loop, dispute evidence loop, reopen loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties              # ManagingPartner funds/departs/disputes; CorporateController activates/approves/resolves; OperationsAuditor audits meat; HRRecruiter certifies
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities, flat topology)
# =============================================================================
entities:
  - name: Partner
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Partner legal name" }
      - { name: email, type: string, source: input, description: "Partner contact email, unique" }
      - { name: role_in_program, type: enum, source: input, description: "MANAGING_PARTNER | MARKET_PARTNER — immutable after creation", constraints: "enum {MANAGING_PARTNER, MARKET_PARTNER}" }
      - { name: status, type: enum, source: system, description: "CANDIDATE | IN_TRAINING | TRAINING_EXTENDED | CERTIFIED | PLACED | WITHDRAWN", constraints: "enum; initial CANDIDATE" }
      - { name: training_started_at, type: datetime, source: system, description: "Logical-clock timestamp set by start-training; null until then" }
      - { name: training_weeks_accrued, type: integer, source: computed, description: "Full 7-day weeks elapsed between training_started_at and the logical clock; 0 when training_started_at is null; floor division, no rounding up" }
      - { name: certified_at, type: datetime, source: system, description: "Logical-clock timestamp of certification; null until CERTIFIED" }
      - { name: placed_restaurant_id, type: string, source: system, description: "FK -> Restaurant.id; set by place; null until PLACED" }

  - name: MarketGroup
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Market group name" }
      - { name: status, type: enum, source: system, description: "FORMING | ACTIVE | DISSOLVED", constraints: "enum; initial FORMING" }

  - name: Restaurant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Restaurant name" }
      - { name: city, type: string, source: input, description: "City" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code" }
      - { name: market_group_id, type: string, source: input, description: "FK -> MarketGroup.id; optional at creation" }
      - { name: status, type: enum, source: system, description: "PRE_OPENING | ACTIVE | CLOSED", constraints: "enum; initial PRE_OPENING" }

  - name: ManagingPartnerContract
    parent: null
    common_fields: true
    fields:
      - { name: partner_id, type: string, source: input, description: "FK -> Partner.id; immutable after creation" }
      - { name: restaurant_id, type: string, source: input, description: "FK -> Restaurant.id; immutable after creation" }
      - { name: term_start_date, type: string, source: input, description: "ISO date; half-open interval start [term_start_date, term_end_date)" }
      - { name: term_end_date, type: string, source: input, description: "ISO date; exclusive end; must be after term_start_date" }
      - { name: buy_in_required_cents, type: integer, source: input, description: "Total capital buy-in required before activation; > 0" }
      - { name: buy_in_escrow_cents, type: integer, source: computed, description: "Sum of POSTED BuyInPayment.amount_cents minus refunded payments; starts 0" }
      - { name: capital_account_cents, type: integer, source: computed, description: "Escrow balance moved into restaurant capital at activation; starts 0; escrow set to 0 on activation" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of DRAFT -> PENDING_FUNDING; null until submit" }
      - { name: renewed_count, type: integer, source: system, description: "Number of accepted renewals; starts 0" }
      - { name: departure_date, type: string, source: system, description: "ISO date recorded on depart; null until BUYOUT_PENDING" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_FUNDING | ACTIVE | RENEWAL_OFFERED | BUYOUT_PENDING | SETTLED | TRANSFERRED | LAPSED | EXPIRED", constraints: "enum; initial DRAFT" }

  - name: BuyInPayment
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> ManagingPartnerContract.id; set from path" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount; > 0" }
      - { name: status, type: enum, source: system, description: "POSTED | REFUNDED", constraints: "enum; initial POSTED" }

  - name: MarketPartnerAgreement
    parent: null
    common_fields: true
    fields:
      - { name: partner_id, type: string, source: input, description: "FK -> Partner.id (role_in_program must be MARKET_PARTNER)" }
      - { name: market_group_id, type: string, source: input, description: "FK -> MarketGroup.id" }
      - { name: coverage_start_date, type: string, source: input, description: "ISO date; CLOSED interval start (inclusive)" }
      - { name: coverage_end_date, type: string, source: input, description: "ISO date; CLOSED interval end (inclusive); must be >= coverage_start_date" }
      - { name: override_pct, type: number, source: input, description: "Override percentage applied to group restaurant profit; 0 < override_pct <= 10" }
      - { name: basis, type: enum, source: input, description: "NET_GROUP_BASIS | PER_RESTAURANT_POSITIVE — selects the override variant", constraints: "enum" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | EXPIRED | TERMINATED", constraints: "enum; initial DRAFT" }

  - name: ProfitPeriod
    parent: null
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: input, description: "FK -> Restaurant.id" }
      - { name: period_start_date, type: string, source: input, description: "ISO date; inclusive" }
      - { name: period_end_date, type: string, source: input, description: "ISO date; exclusive; must be after period_start_date" }
      - { name: status, type: enum, source: system, description: "OPEN | COMPUTED | FINALIZED | REOPENED | LOCKED", constraints: "enum; initial OPEN" }
      - { name: provisional_profit_cents, type: integer, source: computed, description: "Partner-basis profit using PROVISIONAL and FINALIZED line items; set by compute; null until first compute" }
      - { name: final_distributable_profit_cents, type: integer, source: computed, description: "Partner-basis profit using FINALIZED line items only, minus consolidated meat waste charge; set by finalize; null until finalized" }
      - { name: partner_share_cents, type: integer, source: computed, description: "Tiered managing-partner share of final_distributable_profit_cents; set by finalize" }
      - { name: market_override_cents, type: integer, source: computed, description: "Market-partner override attributable to this period's restaurant; set by finalize; 0 when no ACTIVE agreement covers the restaurant's group" }
      - { name: corporate_retained_cents, type: integer, source: computed, description: "Remainder bucket: final_distributable_profit_cents - partner_share_cents - market_override_cents (allocation conservation invariant)" }
      - { name: partner_share_paid, type: boolean, source: system, description: "True once a PAID BuyoutOrder has swept this period's accrued share; default false", default: false }
      - { name: finalized_at, type: datetime, source: system, description: "Logical-clock timestamp of most recent COMPUTED -> FINALIZED; null until finalized" }
      - { name: dispute_deadline, type: datetime, source: computed, description: "finalized_at + DISPUTE_WINDOW_DAYS days; disputes accepted while logical clock <= dispute_deadline" }

  - name: ProfitStatementLineItem
    parent: null
    common_fields: true
    fields:
      - { name: period_id, type: string, source: system, description: "FK -> ProfitPeriod.id; set from path" }
      - { name: category, type: enum, source: input, description: "REVENUE | COST_OF_GOODS | LABOR | CORPORATE_ADMIN_FEE | CORPORATE_MARKETING_FEE | MEAT_WASTE_CHARGE | ADJUSTMENT", constraints: "enum" }
      - { name: amount_cents, type: integer, source: input, description: "Signed cents; positive for REVENUE and ADJUSTMENT, positive magnitude for expense categories (subtracted)" }
      - { name: entry_status, type: enum, source: input, description: "PROVISIONAL | FINALIZED at creation; transitions PROVISIONAL -> FINALIZED via line-item finalize", constraints: "enum" }
      - { name: actual_amount_cents, type: integer, source: system, description: "Actualized amount recorded by line-item finalize; equals amount_cents until finalized" }
      - { name: partner_basis, type: enum, source: computed, description: "INCLUDED | EXCLUDED — EXCLUDED only for CORPORATE_ADMIN_FEE (excluded corporate charge); every other category is INCLUDED" }

  - name: YieldStandard
    parent: null
    common_fields: true
    fields:
      - { name: cut_code, type: string, source: input, description: "Cut identifier (e.g. SIRLOIN_8OZ); unique among active standards" }
      - { name: expected_yield_pct, type: number, source: input, description: "Expected sellable yield fraction of sub-primal weight; 0 < pct < 100" }
      - { name: waste_tolerance_pct, type: number, source: input, description: "Allowed waste as a multiple buffer over expected waste; >= 0" }
      - { name: standard_cost_per_lb_cents, type: integer, source: input, description: "Cost basis per excess-waste pound; > 0" }
      - { name: active, type: boolean, source: system, description: "False after deactivate; default true", default: true }

  - name: MeatCutBatch
    parent: null
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: input, description: "FK -> Restaurant.id" }
      - { name: profit_period_id, type: string, source: input, description: "FK -> ProfitPeriod.id; period must belong to restaurant_id" }
      - { name: cut_code, type: string, source: input, description: "Cut code; must match an active YieldStandard.cut_code" }
      - { name: sub_primal_weight_lbs, type: number, source: input, description: "Input weight in lbs, 3 decimal places; > 0" }
      - { name: actual_yield_lbs, type: number, source: system, description: "Sellable yield recorded at audit; null until audited" }
      - { name: actual_waste_lbs, type: number, source: computed, description: "sub_primal_weight_lbs - actual_yield_lbs; set at audit" }
      - { name: excess_waste_lbs, type: number, source: computed, description: "max(0, actual_waste_lbs - allowed_waste_lbs) per meat_waste_charge calculation; set at audit" }
      - { name: waste_charge_cents, type: integer, source: computed, description: "Per-batch rounded charge (round_half_up of excess_waste_lbs * standard_cost_per_lb_cents); reset to 0 on waive" }
      - { name: status, type: enum, source: system, description: "RECORDED | AUDITED_CONFORMING | VARIANCE_CONFIRMED | VARIANCE_WAIVED", constraints: "enum; initial RECORDED" }

  - name: AwardProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name (conference invitation or stock award)" }
      - { name: program_type, type: enum, source: input, description: "CONFERENCE | STOCK_GRANT", constraints: "enum" }
      - { name: performance_period_start_date, type: string, source: input, description: "ISO date; inclusive window start for source periods" }
      - { name: performance_period_end_date, type: string, source: input, description: "ISO date; inclusive window end for source periods" }
      - { name: eligibility_threshold_score, type: number, source: input, description: "Minimum eligibility score, inclusive (score >= threshold passes); default 80", default: 80 }
      - { name: stock_units_pool, type: integer, source: input, description: "Total stock units available; required and > 0 for STOCK_GRANT, ignored for CONFERENCE" }
      - { name: units_reserved, type: integer, source: computed, description: "Units reserved by non-forfeited grants; decremented on grant forfeiture; starts 0" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", constraints: "enum; initial OPEN" }

  - name: AwardGrant
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> AwardProgram.id; set from path" }
      - { name: partner_id, type: string, source: input, description: "FK -> Partner.id" }
      - { name: source_period_id, type: string, source: input, description: "FK -> ProfitPeriod.id; must be FINALIZED or LOCKED" }
      - { name: eligibility_score, type: number, source: computed, description: "Weighted score from award_eligibility_score calculation; 2 decimal places" }
      - { name: units_awarded, type: integer, source: computed, description: "0 for CONFERENCE programs; 100 or 200 for STOCK_GRANT per score tier" }
      - { name: status, type: enum, source: system, description: "EARNED | VESTING | VESTED | FORFEITED", constraints: "enum; initial EARNED" }

  - name: DisputeCase
    parent: null
    common_fields: true
    fields:
      - { name: period_id, type: string, source: input, description: "FK -> ProfitPeriod.id; period must be FINALIZED" }
      - { name: filed_by_partner_id, type: string, source: system, description: "FK -> Partner.id; set from X-User-ID of the filer" }
      - { name: claim_text, type: string, source: input, description: "Dispute description" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp of filing" }
      - { name: adjustment_cents, type: integer, source: system, description: "Positive profit-restoring adjustment recorded on RESOLVED_ADJUSTED; null otherwise" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | EVIDENCE_REQUESTED | RESOLVED_UPHELD | RESOLVED_ADJUSTED | ESCALATED | WITHDRAWN", constraints: "enum; initial SUBMITTED" }

  - name: BuyoutOrder
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> ManagingPartnerContract.id; set from path" }
      - { name: capital_return_cents, type: integer, source: computed, description: "Straight-line depreciated buy-in return per capital_return_depreciation" }
      - { name: accrued_share_cents, type: integer, source: computed, description: "Sum of partner_share_cents over FINALIZED/LOCKED periods of the contract's restaurant with partner_share_paid == false and period_end_date <= departure_date" }
      - { name: offset_cents, type: integer, source: input, description: "Outstanding debits offset against payout; >= 0; must be <= capital_return_cents + accrued_share_cents" }
      - { name: total_payout_cents, type: integer, source: computed, description: "capital_return_cents + accrued_share_cents - offset_cents (pinned evaluation order, see buyout_valuation)" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | PAID", constraints: "enum; initial DRAFT" }

# =============================================================================
# §1.2 State Machine Table (7 machines)
# =============================================================================
state_machines:
  - entity: ManagingPartnerContract
    field: status
    initial_state: DRAFT
    terminal_states: [LAPSED, EXPIRED, SETTLED, TRANSFERRED]
    transitions:
      - from: DRAFT
        to: PENDING_FUNDING
        trigger: "POST /managing-partner-contracts/{id}/submit"
        actor: CorporateController
        preconditions:
          - "Partner.role_in_program == MANAGING_PARTNER (ERR_NOT_MANAGING_PARTNER)"
          - "No other ManagingPartnerContract for the same restaurant_id exists with status in {PENDING_FUNDING, ACTIVE, RENEWAL_OFFERED, BUYOUT_PENDING} (ERR_RESTAURANT_ALREADY_HAS_ACTIVE_CONTRACT)"
          - "Restaurant.status == ACTIVE (ERR_RESTAURANT_NOT_ACTIVE)"
        side_effects:
          - "submitted_at := logical clock now"
          - "increments ManagingPartnerContract.version by 1"

      - from: PENDING_FUNDING
        to: ACTIVE
        trigger: "POST /managing-partner-contracts/{id}/activate"
        actor: CorporateController
        preconditions:
          - "buy_in_escrow_cents >= buy_in_required_cents (ERR_BUY_IN_INCOMPLETE — fires only when escrow > 0 and < required; zero escrow fails the state gate first with ERR_CONTRACT_NOT_FUNDABLE)"
          - "Funding window not lapsed: logical clock < submitted_at + FUNDING_WINDOW_DAYS"
        side_effects:
          - "capital_account_cents := buy_in_escrow_cents"
          - "buy_in_escrow_cents := 0"
          - "Partner.placed_restaurant_id := restaurant_id; Partner.status := PLACED"
          - "increments ManagingPartnerContract.version by 1"

      - from: PENDING_FUNDING
        to: LAPSED
        trigger: "system (POST /_clock/set_current_utc sweep: logical clock >= submitted_at + FUNDING_WINDOW_DAYS days)"
        actor: system
        preconditions: []
        side_effects:
          - "Every POSTED BuyInPayment on the contract -> REFUNDED (ledger reversal)"
          - "buy_in_escrow_cents := 0"
          - "Partner.status := WITHDRAWN"
          - "increments ManagingPartnerContract.version by 1"

      - from: ACTIVE
        to: RENEWAL_OFFERED
        trigger: "POST /managing-partner-contracts/{id}/offer-renewal"
        actor: CorporateController
        preconditions:
          - "No DisputeCase on any ProfitPeriod of this contract's restaurant with status in {SUBMITTED, UNDER_REVIEW, EVIDENCE_REQUESTED, ESCALATED} (ERR_RENEWAL_BLOCKED_BY_OPEN_DISPUTE)"
        side_effects:
          - "increments ManagingPartnerContract.version by 1"

      - from: RENEWAL_OFFERED
        to: ACTIVE
        trigger: "POST /managing-partner-contracts/{id}/accept-renewal"
        actor: ManagingPartner
        preconditions:
          - "X-User-ID == contract.partner_id (ERR_CONTRACT_PARTNER_MISMATCH)"
        side_effects:
          - "term_end_date := term_end_date + RENEWAL_EXTENSION_YEARS years"
          - "renewed_count := renewed_count + 1"
          - "increments ManagingPartnerContract.version by 1"
        note: "cyclic loop — renewal may be offered and accepted repeatedly; renewed_count grows unbounded"

      - from: RENEWAL_OFFERED
        to: EXPIRED
        trigger: "system (POST /_clock/set_current_utc sweep: logical clock date >= term_end_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Partner.status := CERTIFIED (unplaced)"
          - "increments ManagingPartnerContract.version by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /_clock/set_current_utc sweep: logical clock date >= term_end_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Partner.status := CERTIFIED (unplaced)"
          - "increments ManagingPartnerContract.version by 1"

      - from: ACTIVE
        to: BUYOUT_PENDING
        trigger: "POST /managing-partner-contracts/{id}/depart"
        actor: ManagingPartner
        preconditions:
          - "X-User-ID == contract.partner_id (ERR_CONTRACT_PARTNER_MISMATCH)"
          - "No DisputeCase on any ProfitPeriod of this contract's restaurant with status in {SUBMITTED, UNDER_REVIEW, EVIDENCE_REQUESTED, ESCALATED} (ERR_DEPARTURE_BLOCKED_BY_OPEN_DISPUTE)"
        side_effects:
          - "departure_date := logical clock date"
          - "increments ManagingPartnerContract.version by 1"

      - from: BUYOUT_PENDING
        to: SETTLED
        trigger: "system (BuyoutOrder on this contract transitions APPROVED -> PAID)"
        actor: system
        preconditions: []
        side_effects:
          - "Partner.status := WITHDRAWN"
          - "capital_account_cents := 0 (returned via buyout)"
          - "increments ManagingPartnerContract.version by 1"
        note: "depth-3 cascade — see Rule 4"

      - from: BUYOUT_PENDING
        to: TRANSFERRED
        trigger: "POST /managing-partner-contracts/{id}/transfer"
        actor: CorporateController
        preconditions:
          - "Successor Partner exists with role_in_program == MANAGING_PARTNER and status == CERTIFIED (ERR_SUCCESSOR_NOT_ELIGIBLE)"
          - "No BuyoutOrder on this contract with status in {DRAFT, APPROVED} (ERR_BUYOUT_ALREADY_OPEN)"
        side_effects:
          - "Old partner: PLACED -> CERTIFIED, placed_restaurant_id := null"
          - "Successor partner: CERTIFIED -> PLACED, placed_restaurant_id := restaurant_id"
          - "Creates a NEW ManagingPartnerContract row (status DRAFT) with partner_id := successor, same restaurant_id, and a fresh term starting at the logical clock date; the old contract row closes terminally as TRANSFERRED"
          - "increments ManagingPartnerContract.version by 1"
        note: "Transfer and buyout are mutually exclusive departure paths; transfer requires no open buyout order and settles nothing (no capital return — the new contract carries its own buy-in)"

      - from: [DRAFT, PENDING_FUNDING, ACTIVE, RENEWAL_OFFERED, BUYOUT_PENDING]
        to: DRAFT
        trigger: "none (no edit transition exists; contracts are immutable once created — a changed term requires a new contract)"
        actor: system
        preconditions: []
        side_effects: []
        note: "documents the absence of an update path; listed so tests can assert immutability"

  - entity: ProfitPeriod
    field: status
    initial_state: OPEN
    terminal_states: [LOCKED]
    transitions:
      - from: OPEN
        to: COMPUTED
        trigger: "POST /profit-periods/{id}/compute"
        actor: OperationsAuditor
        preconditions:
          - "Restaurant.status == ACTIVE (ERR_RESTAURANT_NOT_ACTIVE)"
          - "ManagingPartnerContract for this restaurant with status in {ACTIVE, RENEWAL_OFFERED, BUYOUT_PENDING} exists (ERR_NO_ACTIVE_CONTRACT_FOR_RESTAURANT)"
        side_effects:
          - "restaurant_profit_computation (provisional variant) runs; provisional_profit_cents set"
          - "increments ProfitPeriod.version by 1"

      - from: COMPUTED
        to: FINALIZED
        trigger: "POST /profit-periods/{id}/finalize"
        actor: CorporateController
        preconditions:
          - "No ProfitStatementLineItem on this period with entry_status == PROVISIONAL (ERR_UNFINALIZED_LINE_ITEMS)"
          - "ManagingPartnerContract for this restaurant with status in {ACTIVE, RENEWAL_OFFERED, BUYOUT_PENDING} exists (ERR_NO_ACTIVE_CONTRACT_FOR_RESTAURANT)"
        side_effects:
          - "restaurant_profit_computation (final variant) runs; final_distributable_profit_cents set (FINALIZED items only, minus consolidated MeatCutBatch waste charges with status in {AUDITED_CONFORMING, VARIANCE_CONFIRMED})"
          - "partner_share_tiering runs; partner_share_cents set"
          - "market_partner_override runs; market_override_cents set"
          - "corporate_retained_cents := final_distributable_profit_cents - partner_share_cents - market_override_cents"
          - "finalized_at := logical clock now; dispute_deadline := finalized_at + DISPUTE_WINDOW_DAYS days"
          - "increments ProfitPeriod.version by 1"

      - from: FINALIZED
        to: REOPENED
        trigger: "system (DisputeCase RESOLVED_ADJUSTED on this period)"
        actor: system
        preconditions: []
        side_effects:
          - "creates ProfitStatementLineItem {category: ADJUSTMENT, amount_cents: dispute.adjustment_cents, entry_status: FINALIZED}"
          - "increments ProfitPeriod.version by 1"

      - from: REOPENED
        to: COMPUTED
        trigger: "POST /profit-periods/{id}/compute"
        actor: OperationsAuditor
        preconditions: []
        side_effects:
          - "restaurant_profit_computation (provisional variant) re-runs including the ADJUSTMENT line"
          - "increments ProfitPeriod.version by 1"
        note: "cyclic loop — finalize -> dispute -> reopen -> recompute -> re-finalize"

      - from: FINALIZED
        to: LOCKED
        trigger: "POST /profit-periods/{id}/lock"
        actor: CorporateController
        preconditions:
          - "No DisputeCase on this period with status in {SUBMITTED, UNDER_REVIEW, EVIDENCE_REQUESTED, ESCALATED} (ERR_OPEN_DISPUTE_BLOCKS_LOCK)"
        side_effects:
          - "increments ProfitPeriod.version by 1"
        note: "terminal — LOCKED periods are excluded from buyout accrual unless already swept and may not be disputed or reopened"

  - entity: MeatCutBatch
    field: status
    initial_state: RECORDED
    terminal_states: [AUDITED_CONFORMING, VARIANCE_CONFIRMED, VARIANCE_WAIVED]
    transitions:
      - from: RECORDED
        to: AUDITED_CONFORMING
        trigger: "POST /meat-cut-batches/{id}/audit"
        actor: OperationsAuditor
        preconditions:
          - "Parent ProfitPeriod.status in {OPEN, COMPUTED, REOPENED} (ERR_PERIOD_NOT_OPEN)"
        side_effects:
          - "meat_waste_charge runs: actual_waste_lbs, excess_waste_lbs computed; excess_waste_lbs == 0 branch"
          - "waste_charge_cents := 0"
          - "increments MeatCutBatch.version by 1"

      - from: RECORDED
        to: VARIANCE_CONFIRMED
        trigger: "POST /meat-cut-batches/{id}/audit"
        actor: OperationsAuditor
        preconditions:
          - "Parent ProfitPeriod.status in {OPEN, COMPUTED, REOPENED} (ERR_PERIOD_NOT_OPEN)"
        side_effects:
          - "meat_waste_charge runs: excess_waste_lbs > 0 branch"
          - "waste_charge_cents := round_half_up(excess_waste_lbs * standard_cost_per_lb_cents) (per-batch rounding, pinned order)"
          - "increments MeatCutBatch.version by 1"

      - from: VARIANCE_CONFIRMED
        to: VARIANCE_WAIVED
        trigger: "POST /meat-cut-batches/{id}/waive"
        actor: CorporateController
        preconditions:
          - "Parent ProfitPeriod.status in {OPEN, COMPUTED, REOPENED} (ERR_PERIOD_NOT_OPEN)"
        side_effects:
          - "waste_charge_cents := 0 (compensation — charge removed from the consolidated waste deduction; batch remains terminally VARIANCE_WAIVED)"
          - "increments MeatCutBatch.version by 1"

  - entity: DisputeCase
    field: status
    initial_state: SUBMITTED
    terminal_states: [RESOLVED_UPHELD, RESOLVED_ADJUSTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "system (automatic on file)"
        actor: system
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: EVIDENCE_REQUESTED
        trigger: "POST /dispute-cases/{id}/request-evidence"
        actor: CorporateController
        preconditions: []
        side_effects:
          - "increments DisputeCase.version by 1"

      - from: EVIDENCE_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /dispute-cases/{id}/submit-evidence"
        actor: ManagingPartner
        preconditions:
          - "X-User-ID == dispute.filed_by_partner_id (ERR_DISPUTE_NOT_OWNED)"
        side_effects:
          - "increments DisputeCase.version by 1"
        note: "cyclic evidence loop — multiple evidence rounds allowed"

      - from: UNDER_REVIEW
        to: RESOLVED_UPHELD
        trigger: "POST /dispute-cases/{id}/resolve"
        actor: CorporateController
        preconditions:
          - "outcome == UPHELD"
        side_effects:
          - "ProfitPeriod unchanged (upheld — original computation stands)"
          - "increments DisputeCase.version by 1"

      - from: UNDER_REVIEW
        to: RESOLVED_ADJUSTED
        trigger: "POST /dispute-cases/{id}/resolve"
        actor: CorporateController
        preconditions:
          - "outcome == ADJUSTED"
          - "adjustment_cents > 0 (ERR_ADJUSTMENT_REQUIRED)"
        side_effects:
          - "adjustment_cents recorded"
          - "ProfitPeriod FINALIZED -> REOPENED (cascade — see Rule 4)"
          - "increments DisputeCase.version by 1"

      - from: EVIDENCE_REQUESTED
        to: ESCALATED
        trigger: "system (POST /_clock/set_current_utc sweep: logical clock > filed_at + DISPUTE_ESCALATION_DAYS days and status == EVIDENCE_REQUESTED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments DisputeCase.version by 1"
        note: "ESCALATED is non-terminal; controller may still resolve from ESCALATED via the same resolve transition semantics as UNDER_REVIEW (resolve allowed from UNDER_REVIEW or ESCALATED)"

      - from: ESCALATED
        to: RESOLVED_UPHELD
        trigger: "POST /dispute-cases/{id}/resolve"
        actor: CorporateController
        preconditions:
          - "outcome == UPHELD"
        side_effects:
          - "increments DisputeCase.version by 1"

      - from: ESCALATED
        to: RESOLVED_ADJUSTED
        trigger: "POST /dispute-cases/{id}/resolve"
        actor: CorporateController
        preconditions:
          - "outcome == ADJUSTED"
          - "adjustment_cents > 0 (ERR_ADJUSTMENT_REQUIRED)"
        side_effects:
          - "adjustment_cents recorded"
          - "ProfitPeriod FINALIZED -> REOPENED"
          - "increments DisputeCase.version by 1"

      - from: [SUBMITTED, UNDER_REVIEW, EVIDENCE_REQUESTED]
        to: WITHDRAWN
        trigger: "POST /dispute-cases/{id}/withdraw"
        actor: ManagingPartner
        preconditions:
          - "X-User-ID == dispute.filed_by_partner_id (ERR_DISPUTE_NOT_OWNED)"
        side_effects:
          - "increments DisputeCase.version by 1"

  - entity: AwardGrant
    field: status
    initial_state: EARNED
    terminal_states: [FORFEITED, VESTED]
    transitions:
      - from: EARNED
        to: VESTING
        trigger: "POST /award-grants/{id}/vest"
        actor: CorporateController
        preconditions: []
        side_effects:
          - "increments AwardGrant.version by 1"

      - from: VESTING
        to: VESTED
        trigger: "system (POST /_clock/set_current_utc sweep: logical clock date >= grant.created_at date + VESTING_DAYS days)"
        actor: system
        preconditions: []
        side_effects:
          - "increments AwardGrant.version by 1"

      - from: [EARNED, VESTING]
        to: FORFEITED
        trigger: "system (cascade: Partner.status -> WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects:
          - "AwardProgram.units_reserved := units_reserved - units_awarded (pool credit)"
          - "increments AwardGrant.version by 1"

  - entity: MarketPartnerAgreement
    field: status
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /market-partner-agreements/{id}/activate"
        actor: CorporateController
        preconditions:
          - "No other MarketPartnerAgreement with status in {DRAFT, ACTIVE} for the same market_group_id whose [coverage_start_date, coverage_end_date] (inclusive both ends) intersects this agreement's interval (ERR_OVERRIDE_COVERAGE_OVERLAP)"
          - "MarketGroup.status == ACTIVE (ERR_MARKET_GROUP_NOT_ACTIVE)"
        side_effects:
          - "increments MarketPartnerAgreement.version by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /_clock/set_current_utc sweep: logical clock date > coverage_end_date)"
        actor: system
        preconditions: []
        side_effects:
          - "increments MarketPartnerAgreement.version by 1"

      - from: [DRAFT, ACTIVE]
        to: TERMINATED
        trigger: "POST /market-partner-agreements/{id}/terminate"
        actor: CorporateController
        preconditions: []
        side_effects:
          - "increments MarketPartnerAgreement.version by 1"

  - entity: Partner
    field: status
    initial_state: CANDIDATE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: CANDIDATE
        to: IN_TRAINING
        trigger: "POST /partners/{id}/start-training"
        actor: HRRecruiter
        preconditions: []
        side_effects:
          - "training_started_at := logical clock now"

      - from: [IN_TRAINING, TRAINING_EXTENDED]
        to: CERTIFIED
        trigger: "POST /partners/{id}/certify"
        actor: HRRecruiter
        preconditions:
          - "training_weeks_accrued >= MIN_TRAINING_WEEKS (ERR_TRAINING_TENURE_INSUFFICIENT)"
        side_effects:
          - "certified_at := logical clock now"

      - from: IN_TRAINING
        to: TRAINING_EXTENDED
        trigger: "system (POST /_clock/set_current_utc sweep: training_weeks_accrued > MAX_TRAINING_WEEKS and status == IN_TRAINING)"
        actor: system
        preconditions: []
        side_effects: []
        note: "extension is informational; certify still allowed once tenure >= MIN_TRAINING_WEEKS"

      - from: CERTIFIED
        to: PLACED
        trigger: "system (ManagingPartnerContract activation places the partner)"
        actor: system
        preconditions: []
        side_effects:
          - "placed_restaurant_id set by contract activation"

      - from: PLACED
        to: CERTIFIED
        trigger: "system (contract EXPIRED sweep or transfer — partner returns to the certified pool)"
        actor: system
        preconditions: []
        side_effects:
          - "placed_restaurant_id := null"

      - from: [CANDIDATE, IN_TRAINING, TRAINING_EXTENDED, CERTIFIED]
        to: WITHDRAWN
        trigger: "POST /partners/{id}/withdraw"
        actor: HRRecruiter
        preconditions: []
        side_effects:
          - "All AwardGrants for this partner with status in {EARNED, VESTING} -> FORFEITED; AwardProgram.units_reserved credited per grant (cascade)"

      - from: PLACED
        to: WITHDRAWN
        trigger: "system (contract SETTLED via paid buyout, or LAPSED funding sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "All AwardGrants for this partner with status in {EARNED, VESTING} -> FORFEITED; AwardProgram.units_reserved credited per grant (cascade)"

  - entity: BuyoutOrder
    field: status
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /buyout-orders/{id}/approve"
        actor: CorporateController
        preconditions:
          - "Contract.status == BUYOUT_PENDING (ERR_CONTRACT_NOT_IN_BUYOUT)"
        side_effects:
          - "increments BuyoutOrder.version by 1"

      - from: APPROVED
        to: PAID
        trigger: "POST /buyout-orders/{id}/pay"
        actor: CorporateController
        preconditions: []
        side_effects:
          - "ManagingPartnerContract BUYOUT_PENDING -> SETTLED"
          - "Partner PLACED -> WITHDRAWN; that transition cascades grant forfeiture (EARNED/VESTING -> FORFEITED) and AwardProgram.units_reserved credits (depth-3 chain, Rule 4)"
          - "Every swept ProfitPeriod.partner_share_paid := true"
          - "increments BuyoutOrder.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: line-item-post-stale-period
    parent_entity: ProfitPeriod
    write_endpoint: "POST /profit-periods/{id}/line-items"
    occ_field: "expected_profit_period_version"
    description: |
      Posting a ProfitStatementLineItem against a ProfitPeriod whose version
      has advanced since the client last observed it is rejected. This
      captures the case where another writer has just posted a line item
      (advancing the period's version) and the current writer's computed
      subtotal context is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: compute-stale-period
    parent_entity: ProfitPeriod
    write_endpoint: "POST /profit-periods/{id}/compute"
    occ_field: "expected_profit_period_version"
    description: |
      Running compute against a ProfitPeriod whose version has advanced
      since the client last observed it is rejected. Two writers who both
      observed version N may both legitimately request a compute; the
      second request carries a stale expected version and is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: buyout-create-stale-contract
    parent_entity: ManagingPartnerContract
    write_endpoint: "POST /managing-partner-contracts/{id}/buyout-orders"
    occ_field: "expected_contract_version"
    description: |
      Creating a BuyoutOrder against a ManagingPartnerContract whose version
      has advanced since the client last observed it is rejected. This
      captures the case where a departure or renewal mutation has changed
      the contract since the writer priced the buyout.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: restaurant_profit_computation
    trigger: "POST /profit-periods/{id}/compute (provisional variant) and POST /profit-periods/{id}/finalize (final variant)"
    algorithm: aggregation
    formula: |
      variant PROVISIONAL (compute):
        items = line items on period with entry_status in {PROVISIONAL, FINALIZED}
        waste  = sum(waste_charge_cents of MeatCutBatch on period with status in {AUDITED_CONFORMING, VARIANCE_CONFIRMED})
        provisional_profit_cents =
            sum(amount of items where partner_basis == INCLUDED and category == REVENUE or ADJUSTMENT)
          - sum(amount of items where partner_basis == INCLUDED and category in {COST_OF_GOODS, LABOR, CORPORATE_MARKETING_FEE, MEAT_WASTE_CHARGE})
          - waste
        CORPORATE_ADMIN_FEE items are partner_basis == EXCLUDED: skipped entirely (excluded corporate charge).
      variant FINAL (finalize):
        items = line items on period with entry_status == FINALIZED ONLY
        final_distributable_profit_cents = same aggregation over the FINALIZED-only item set
      The two variants differ on two axes: item inclusion set (PROVISIONAL+FINALIZED vs FINALIZED only)
      and actual_amount_cents substitution — FINAL reads actual_amount_cents, PROVISIONAL reads amount_cents.
    input_set: "ProfitStatementLineItem rows on the period, filtered by entry_status per variant; MeatCutBatch rows with status in {AUDITED_CONFORMING, VARIANCE_CONFIRMED} (VARIANCE_WAIVED excluded — charge zeroed and status filters it out)"
    constants:
      DISPUTE_WINDOW_DAYS: 30
    precision: "integer cents; no rounding in the aggregation itself"
    variants:
      - name: provisional
        when: "compute endpoint"
        difference: "includes PROVISIONAL items, reads amount_cents"
      - name: final
        when: "finalize endpoint"
        difference: "FINALIZED items only, reads actual_amount_cents"
    note: "rounding discipline — per-category subtotals are rounded to integer cents FIRST (round_half_up), then summed; sum-then-round is forbidden"

  - name: partner_share_tiering
    trigger: "POST /profit-periods/{id}/finalize"
    algorithm: tiered_pricing
    formula: |
      p = final_distributable_profit_cents; if p <= 0 then partner_share_cents = 0.
      Marginal (progressive) tiers, NOT average-rate:
        tier 1: 8.00% of min(p, TIER1_CAP)
        tier 2: 10.00% of max(0, min(p, TIER2_CAP) - TIER1_CAP)
        tier 3: 12.00% of max(0, p - TIER2_CAP)
      Rounding is pinned: each tier's marginal amount is rounded to integer cents
      (round_half_up) BEFORE summing the tiers. Sum-then-round is forbidden.
    input_set: "the period's final_distributable_profit_cents"
    constants:
      TIER1_CAP: 5000000      # $50,000.00
      TIER2_CAP: 10000000     # $100,000.00
      TIER1_RATE: 0.08
      TIER2_RATE: 0.10
      TIER3_RATE: 0.12
    precision: "integer cents, round_half_up per tier then sum"

  - name: market_partner_override
    trigger: "POST /profit-periods/{id}/finalize"
    algorithm: aggregation
    formula: |
      Candidate agreement: the MarketPartnerAgreement with status == ACTIVE whose
      market_group_id == restaurant.market_group_id and whose CLOSED interval
      [coverage_start_date, coverage_end_date] covers the period's
      period_end_date (inclusive both ends). Uniqueness is guaranteed by the
      overlap validation at activation. If none, market_override_cents = 0.
      variant NET_GROUP_BASIS (average-style):
        attributable share = final_distributable_profit_cents * (1 / group_restaurant_count)
        where group_restaurant_count = count of Restaurant rows with
        market_group_id == group and status == ACTIVE at finalize time.
        market_override_cents = max(0, round_half_up(override_pct/100 * attributable share))
        — can be zero or positive; negative restaurant profit contributes a
        negative share which is floored at 0 for the override.
      variant PER_RESTAURANT_POSITIVE (marginal-style):
        market_override_cents = override_pct/100 * max(0, final_distributable_profit_cents),
        rounded round_half_up.
      The two variants diverge whenever group_restaurant_count > 1 or profit < 0.
    input_set: "ACTIVE MarketPartnerAgreement covering the restaurant's group at period end; restaurant's market_group_id; group ACTIVE restaurant count"
    precision: "integer cents, round_half_up"
    variants:
      - name: net_group_basis
        when: "agreement.basis == NET_GROUP_BASIS"
        difference: "profit divided by group restaurant count before percentage"
      - name: per_restaurant_positive
        when: "agreement.basis == PER_RESTAURANT_POSITIVE"
        difference: "percentage of this restaurant's positive profit directly"

  - name: meat_waste_charge
    trigger: "POST /meat-cut-batches/{id}/audit"
    algorithm: constraint_propagation
    formula: |
      standard = active YieldStandard with cut_code == batch.cut_code
      expected_yield_lbs    = sub_primal_weight_lbs * expected_yield_pct / 100
      expected_waste_lbs    = sub_primal_weight_lbs - expected_yield_lbs
      allowed_waste_lbs     = expected_waste_lbs * (1 + waste_tolerance_pct / 100)
      actual_waste_lbs      = sub_primal_weight_lbs - actual_yield_lbs
      excess_waste_lbs      = max(0, actual_waste_lbs - allowed_waste_lbs)
      waste_charge_cents    = round_half_up(excess_waste_lbs * standard_cost_per_lb_cents)
      Boundary: actual_waste_lbs == allowed_waste_lbs exactly -> excess == 0 -> AUDITED_CONFORMING.
      Circular-looking dependency pinned: charge enters the FINAL profit as a
      separate consolidated deduction computed from batch rows, NOT as a line
      item, so the waste charge never feeds back into its own base.
    input_set: "the single batch under audit plus its YieldStandard"
    precision: "weights at 3 decimal places; charge round_half_up to integer cents per batch"

  - name: capital_return_depreciation
    trigger: "POST /managing-partner-contracts/{id}/buyout-orders (buyout valuation)"
    algorithm: chronological
    formula: |
      T = (term_end_date - term_start_date) in days (half-open interval)
      E = (departure_date - term_start_date) in days, clamped to [0, T]
      capital_return_cents = round_half_up(buy_in_required_cents * (1 - E/T))
      Boundary: departure_date == term_start_date -> E = 0 -> full return;
      departure_date >= term_end_date -> E = T -> zero return (clamped, never negative).
    input_set: "contract dates, buy_in_required_cents, contract.departure_date"
    precision: "integer cents, round_half_up"

  - name: buyout_valuation
    trigger: "POST /managing-partner-contracts/{id}/buyout-orders"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order is pinned (circular-looking dependency resolved):
        1. capital_return_cents per capital_return_depreciation
        2. accrued_share_cents = sum(partner_share_cents over ProfitPeriod rows
           of the contract's restaurant with status in {FINALIZED, LOCKED},
           partner_share_paid == false, and period_end_date <= departure_date)
        3. total_payout_cents = capital_return_cents + accrued_share_cents - offset_cents
      offset_cents is validated <= capital_return_cents + accrued_share_cents
      (ERR_OFFSET_EXCEEDS_PAYOUT), so total_payout_cents >= 0 always.
      Conservation invariant: capital_return + accrued_share == total_payout + offset.
    input_set: "contract, its restaurant's FINALIZED/LOCKED ProfitPeriod rows filtered by partner_share_paid and period_end_date"
    precision: "integer cents"

  - name: training_weeks_accrued
    trigger: "read of Partner, POST /partners/{id}/certify, extension sweep"
    algorithm: chronological
    formula: |
      if training_started_at is null: 0
      else floor((logical_clock_now - training_started_at) / 7 days)
      No rounding up: 6 days 23 hours accrued == 0 weeks.
    input_set: "partner.training_started_at, logical clock"
    precision: "integer weeks, floor"

  - name: award_eligibility_score
    trigger: "POST /award-programs/{id}/grants"
    algorithm: weighted_scoring
    formula: |
      source period = ProfitPeriod source_period_id (must be FINALIZED or LOCKED,
      and its [period_start_date, period_end_date] must lie within the program's
      [performance_period_start_date, performance_period_end_date] inclusive window)
      sales_component       = 50 * min(1, revenue_cents_of_period / SALES_TARGET_CENTS)
      profit_margin_component = 30 * min(1, max(0, final_distributable_profit_cents) / max(1, revenue_cents_of_period) / MARGIN_TARGET)
      waste_component       = 20 * (1 - min(1, total_waste_charge_cents_of_period / WASTE_ALLOWANCE_CENTS))
      eligibility_score     = round_half_up(sales_component + profit_margin_component + waste_component, 2 dp)
      revenue_cents_of_period = sum of FINALIZED REVENUE line items' actual_amount_cents on the period.
      total_waste_charge_cents_of_period = sum of waste_charge_cents over batches on the
      period with status in {AUDITED_CONFORMING, VARIANCE_CONFIRMED} (all zero for conforming).
      Tiers: score >= STOCK_TIER2_SCORE -> 200 units; score >= STOCK_TIER1_SCORE -> 100 units;
      else ineligible (ERR_AWARD_NOT_ELIGIBLE). Thresholds inclusive (>=).
    input_set: "one FINALIZED/LOCKED ProfitPeriod, its line items and batches, program thresholds"
    constants:
      SALES_TARGET_CENTS: 20000000
      MARGIN_TARGET: 0.10
      WASTE_ALLOWANCE_CENTS: 500000
      STOCK_TIER1_SCORE: 80
      STOCK_TIER2_SCORE: 90
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Path-referenced resources must exist (validated left-to-right)"
    error_id: "ERR_PARTNER_NOT_FOUND / ERR_CONTRACT_NOT_FOUND / ERR_RESTAURANT_NOT_FOUND / ERR_PERIOD_NOT_FOUND / ERR_LINE_ITEM_NOT_FOUND / ERR_BATCH_NOT_FOUND / ERR_PROGRAM_NOT_FOUND / ERR_GRANT_NOT_FOUND / ERR_DISPUTE_NOT_FOUND / ERR_AGREEMENT_NOT_FOUND / ERR_MARKET_GROUP_NOT_FOUND / ERR_YIELD_STANDARD_NOT_FOUND / ERR_BUYOUT_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids

  - priority: 4
    category: existence
    check: "Body-referenced resources must exist (partner_id, restaurant_id, market_group_id, source_period_id, profit_period_id, cut_code)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "create endpoints with FK fields in body"

  - priority: 5
    category: state
    check: "Target resource must be in the required state for this transition (each transition's from-state; OCC expected_*_version must match current version)"
    error_id: "ERR_INVALID_STATE / ERR_STALE_VERSION (412) / ERR_CONTRACT_NOT_FUNDABLE / ERR_CONTRACT_NOT_IN_BUYOUT / ERR_PERIOD_NOT_OPEN / ERR_DISPUTE_NOT_OWNED / ERR_CONTRACT_PARTNER_MISMATCH"
    http_status: 409
    applies_to: all action endpoints
    note: "OCC mismatch returns 412 ERR_STALE_VERSION and is checked AFTER from-state validity"

  - priority: 6
    category: business_temporal
    check: "Interval and clock rules: line-item post requires logical clock date <= period_end_date; dispute filing requires logical clock <= dispute_deadline; funding activation requires clock < submitted_at + FUNDING_WINDOW_DAYS; training tenure >= MIN_TRAINING_WEEKS weeks at certify"
    error_id: "ERR_PERIOD_CLOSED_FOR_ENTRIES / ERR_DISPUTE_WINDOW_CLOSED / ERR_FUNDING_WINDOW_LAPSED / ERR_TRAINING_TENURE_INSUFFICIENT"
    http_status: 422
    applies_to: "line-item create, dispute file, contract activate, partner certify"
    note: "temporal checks run BEFORE aggregate/capacity checks; ERR_DISPUTE_WINDOW_CLOSED beats ERR_DUPLICATE_OPEN_DISPUTE when both apply"

  - priority: 7
    category: business_referential
    check: "Cross-entity referential rules: contract submit requires Restaurant ACTIVE; compute/finalize require an ACTIVE-family contract on the restaurant; agreement activation requires MarketGroup ACTIVE and non-overlapping closed-interval coverage; batch record requires ProfitPeriod of the same restaurant; grant requires source period FINALIZED/LOCKED inside program window; successor on transfer must be CERTIFIED MANAGING_PARTNER"
    error_id: "ERR_RESTAURANT_NOT_ACTIVE / ERR_NO_ACTIVE_CONTRACT_FOR_RESTAURANT / ERR_MARKET_GROUP_NOT_ACTIVE / ERR_OVERRIDE_COVERAGE_OVERLAP / ERR_BATCH_PERIOD_RESTAURANT_MISMATCH / ERR_AWARD_SOURCE_PERIOD_INELIGIBLE / ERR_SUCCESSOR_NOT_ELIGIBLE / ERR_NOT_MANAGING_PARTNER / ERR_RESTAURANT_ALREADY_HAS_ACTIVE_CONTRACT / ERR_DUPLICATE_OPEN_DISPUTE"
    http_status: 422
    applies_to: "contract submit, period compute/finalize, agreement activate, batch record, grant create, contract transfer, dispute file"

  - priority: 8
    category: business_constraint
    check: "Structural constraints: term_end_date > term_start_date; coverage_end_date >= coverage_start_date; period_end_date > period_start_date; cut_code must match an active YieldStandard; sub_primal_weight_lbs > 0; amount_cents sign conventions; override_pct in (0, 10]"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "create endpoints"

  - priority: 9
    category: business_fiscal
    check: "Aggregate/capacity checks last: buy-in escrow completeness (ERR_BUY_IN_INCOMPLETE, only when 0 < escrow < required); finalize blocked by PROVISIONAL line items (ERR_UNFINALIZED_LINE_ITEMS); stock pool capacity units_reserved + tier_units <= stock_units_pool (ERR_AWARD_POOL_EXHAUSTED); award score >= program threshold (ERR_AWARD_NOT_ELIGIBLE); buyout offset <= capital_return + accrued_share (ERR_OFFSET_EXCEEDS_PAYOUT); adjustment_cents > 0 on ADJUSTED outcome (ERR_ADJUSTMENT_REQUIRED)"
    error_id: "ERR_BUY_IN_INCOMPLETE / ERR_UNFINALIZED_LINE_ITEMS / ERR_AWARD_POOL_EXHAUSTED / ERR_AWARD_NOT_ELIGIBLE / ERR_OFFSET_EXCEEDS_PAYOUT / ERR_ADJUSTMENT_REQUIRED"
    http_status: 422
    applies_to: "contract activate, period finalize, grant create, buyout create, dispute resolve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Advance the logical clock. Before any call the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock. Setting the clock fires every time-based sweep: contract funding lapse, contract expiry, agreement expiry, grant vesting, partner training extension, dispute escalation."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string, sweeps_applied: integer }
    side_effects: ["all scheduled sweeps run"]

  # --- Partner ---
  - method: POST
    path: "/api/partners"
    description: "Register a partner candidate"
    roles: [HRRecruiter]
    code: 201
    input: [full_name, email, role_in_program]
    output: Partner
    side_effects: ["status=CANDIDATE, version=1"]

  - method: GET
    path: "/api/partners"
    description: "List partners"
    roles: [PlatformAdmin, HRRecruiter, CorporateController, OperationsAuditor, ManagingPartner, MarketPartner]
    code: 200
    input: ["role_in_program?", "status?", "placed_restaurant_id?", "limit?", "offset?"]
    output: "Partner[]"
    side_effects: []

  - method: GET
    path: "/api/partners/{id}"
    description: "Get a partner (training_weeks_accrued recomputed at read from logical clock)"
    roles: [PlatformAdmin, HRRecruiter, CorporateController, OperationsAuditor, ManagingPartner, MarketPartner]
    code: 200
    input: []
    output: Partner
    side_effects: []

  - method: POST
    path: "/api/partners/{id}/start-training"
    description: "Begin training tenure"
    roles: [HRRecruiter]
    code: 200
    input: []
    output: Partner
    side_effects: ["status -> IN_TRAINING, training_started_at := clock"]

  - method: POST
    path: "/api/partners/{id}/certify"
    description: "Certify after tenure"
    roles: [HRRecruiter]
    code: 200
    input: []
    output: Partner
    side_effects: ["status -> CERTIFIED, certified_at := clock"]

  - method: POST
    path: "/api/partners/{id}/withdraw"
    description: "Withdraw a candidate/trainee/certified partner"
    roles: [HRRecruiter]
    code: 200
    input: []
    output: Partner
    side_effects: ["status -> WITHDRAWN, grant forfeiture cascade"]

  # --- MarketGroup / Restaurant ---
  - method: POST
    path: "/api/market-groups"
    description: "Create a market group"
    roles: [PlatformAdmin]
    code: 201
    input: [name]
    output: MarketGroup
    side_effects: ["status=FORMING"]

  - method: GET
    path: "/api/market-groups"
    description: "List market groups"
    roles: [PlatformAdmin, HRRecruiter, CorporateController, OperationsAuditor, ManagingPartner, MarketPartner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "MarketGroup[]"
    side_effects: []

  - method: GET
    path: "/api/market-groups/{id}"
    description: "Get a market group"
    roles: [PlatformAdmin, HRRecruiter, CorporateController, OperationsAuditor, ManagingPartner, MarketPartner]
    code: 200
    input: []
    output: MarketGroup
    side_effects: []

  - method: POST
    path: "/api/market-groups/{id}/activate"
    description: "Activate a market group (requires >= 1 ACTIVE restaurant assigned)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: MarketGroup
    side_effects: ["status FORMING -> ACTIVE"]

  - method: POST
    path: "/api/restaurants"
    description: "Create a restaurant"
    roles: [PlatformAdmin]
    code: 201
    input: [name, city, state_code, "market_group_id?"]
    output: Restaurant
    side_effects: ["status=PRE_OPENING"]

  - method: GET
    path: "/api/restaurants"
    description: "List restaurants"
    roles: [PlatformAdmin, HRRecruiter, CorporateController, OperationsAuditor, ManagingPartner, MarketPartner]
    code: 200
    input: ["market_group_id?", "status?", "limit?", "offset?"]
    output: "Restaurant[]"
    side_effects: []

  - method: GET
    path: "/api/restaurants/{id}"
    description: "Get a restaurant"
    roles: [PlatformAdmin, HRRecruiter, CorporateController, OperationsAuditor, ManagingPartner, MarketPartner]
    code: 200
    input: []
    output: Restaurant
    side_effects: []

  - method: POST
    path: "/api/restaurants/{id}/activate"
    description: "Open the restaurant"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Restaurant
    side_effects: ["status PRE_OPENING -> ACTIVE"]

  - method: POST
    path: "/api/restaurants/{id}/close"
    description: "Close the restaurant"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Restaurant
    side_effects: ["status ACTIVE -> CLOSED; blocked while any contract in {PENDING_FUNDING, ACTIVE, RENEWAL_OFFERED, BUYOUT_PENDING} references it (ERR_RESTAURANT_HAS_OPEN_CONTRACTS)"]

  # --- ManagingPartnerContract ---
  - method: POST
    path: "/api/managing-partner-contracts"
    description: "Create a managing partner contract (DRAFT)"
    roles: [CorporateController]
    code: 201
    input: [partner_id, restaurant_id, term_start_date, term_end_date, buy_in_required_cents]
    output: ManagingPartnerContract
    side_effects: ["status=DRAFT, buy_in_escrow_cents=0, capital_account_cents=0, renewed_count=0"]

  - method: GET
    path: "/api/managing-partner-contracts"
    description: "List contracts"
    roles: [PlatformAdmin, CorporateController, OperationsAuditor, ManagingPartner]
    code: 200
    input: ["partner_id?", "restaurant_id?", "status?", "limit?", "offset?"]
    output: "ManagingPartnerContract[]"
    side_effects: []

  - method: GET
    path: "/api/managing-partner-contracts/{id}"
    description: "Get a contract"
    roles: [PlatformAdmin, CorporateController, OperationsAuditor, ManagingPartner]
    code: 200
    input: []
    output: ManagingPartnerContract
    side_effects: []

  - method: POST
    path: "/api/managing-partner-contracts/{id}/submit"
    description: "Submit DRAFT contract for funding"
    roles: [CorporateController]
    code: 200
    input: []
    output: ManagingPartnerContract
    side_effects: ["DRAFT -> PENDING_FUNDING, submitted_at := clock, increments ManagingPartnerContract.version by 1"]

  - method: POST
    path: "/api/managing-partner-contracts/{id}/buy-in-payments"
    description: "Fund the buy-in escrow"
    roles: [ManagingPartner]
    code: 201
    input: [amount_cents]
    output: BuyInPayment
    side_effects: ["contract.buy_in_escrow_cents += amount_cents; overpayment beyond buy_in_required_cents is rejected (ERR_BUY_IN_OVERPAYMENT); X-User-ID must equal contract.partner_id (ERR_CONTRACT_PARTNER_MISMATCH)"]

  - method: GET
    path: "/api/managing-partner-contracts/{id}/buy-in-payments"
    description: "List buy-in payments for a contract"
    roles: [PlatformAdmin, CorporateController, ManagingPartner]
    code: 200
    input: ["limit?", "offset?"]
    output: "BuyInPayment[]"
    side_effects: []

  - method: POST
    path: "/api/managing-partner-contracts/{id}/activate"
    description: "Activate a fully-funded contract"
    roles: [CorporateController]
    code: 200
    input: []
    output: ManagingPartnerContract
    side_effects: ["PENDING_FUNDING -> ACTIVE; escrow moved to capital_account_cents; Partner -> PLACED; increments ManagingPartnerContract.version by 1"]

  - method: POST
    path: "/api/managing-partner-contracts/{id}/offer-renewal"
    description: "Offer a renewal term"
    roles: [CorporateController]
    code: 200
    input: []
    output: ManagingPartnerContract
    side_effects: ["ACTIVE -> RENEWAL_OFFERED; increments ManagingPartnerContract.version by 1"]

  - method: POST
    path: "/api/managing-partner-contracts/{id}/accept-renewal"
    description: "Partner accepts renewal; term extends"
    roles: [ManagingPartner]
    code: 200
    input: []
    output: ManagingPartnerContract
    side_effects: ["RENEWAL_OFFERED -> ACTIVE; term_end_date += 2 years; renewed_count += 1; increments ManagingPartnerContract.version by 1"]

  - method: POST
    path: "/api/managing-partner-contracts/{id}/depart"
    description: "Managing partner initiates departure"
    roles: [ManagingPartner]
    code: 200
    input: []
    output: ManagingPartnerContract
    side_effects: ["ACTIVE -> BUYOUT_PENDING; departure_date := clock date; increments ManagingPartnerContract.version by 1"]

  - method: POST
    path: "/api/managing-partner-contracts/{id}/transfer"
    description: "Transfer contract to a certified successor partner"
    roles: [CorporateController]
    code: 200
    input: [successor_partner_id]
    output: ManagingPartnerContract
    side_effects: ["BUYOUT_PENDING -> TRANSFERRED; successor gets a fresh DRAFT contract for the restaurant; old partner -> CERTIFIED, successor -> PLACED; increments ManagingPartnerContract.version by 1"]

  - method: POST
    path: "/api/managing-partner-contracts/{id}/buyout-orders"
    description: "Price and create a buyout order for a departing partner"
    roles: [CorporateController]
    code: 201
    input: [offset_cents, expected_contract_version]
    output: BuyoutOrder
    side_effects: ["buyout_valuation runs (capital_return_depreciation + accrual sweep); increments ManagingPartnerContract.version by 1"]

  # --- BuyoutOrder ---
  - method: GET
    path: "/api/buyout-orders"
    description: "List buyout orders"
    roles: [PlatformAdmin, CorporateController]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: "BuyoutOrder[]"
    side_effects: []

  - method: GET
    path: "/api/buyout-orders/{id}"
    description: "Get a buyout order"
    roles: [PlatformAdmin, CorporateController, ManagingPartner]
    code: 200
    input: []
    output: BuyoutOrder
    side_effects: []

  - method: POST
    path: "/api/buyout-orders/{id}/approve"
    description: "Approve a priced buyout"
    roles: [CorporateController]
    code: 200
    input: []
    output: BuyoutOrder
    side_effects: ["DRAFT -> APPROVED; increments BuyoutOrder.version by 1"]

  - method: POST
    path: "/api/buyout-orders/{id}/pay"
    description: "Pay an approved buyout; settles the contract"
    roles: [CorporateController]
    code: 200
    input: []
    output: BuyoutOrder
    side_effects: ["APPROVED -> PAID; contract -> SETTLED; partner -> WITHDRAWN; grant forfeiture cascade; swept periods partner_share_paid := true; increments BuyoutOrder.version by 1"]

  # --- MarketPartnerAgreement ---
  - method: POST
    path: "/api/market-partner-agreements"
    description: "Create a market partner agreement (DRAFT)"
    roles: [CorporateController]
    code: 201
    input: [partner_id, market_group_id, coverage_start_date, coverage_end_date, override_pct, basis]
    output: MarketPartnerAgreement
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/api/market-partner-agreements"
    description: "List agreements"
    roles: [PlatformAdmin, CorporateController, OperationsAuditor, MarketPartner]
    code: 200
    input: ["partner_id?", "market_group_id?", "status?", "limit?", "offset?"]
    output: "MarketPartnerAgreement[]"
    side_effects: []

  - method: GET
    path: "/api/market-partner-agreements/{id}"
    description: "Get an agreement"
    roles: [PlatformAdmin, CorporateController, OperationsAuditor, MarketPartner]
    code: 200
    input: []
    output: MarketPartnerAgreement
    side_effects: []

  - method: POST
    path: "/api/market-partner-agreements/{id}/activate"
    description: "Activate an agreement (overlap check on closed intervals)"
    roles: [CorporateController]
    code: 200
    input: []
    output: MarketPartnerAgreement
    side_effects: ["DRAFT -> ACTIVE; increments MarketPartnerAgreement.version by 1"]

  - method: POST
    path: "/api/market-partner-agreements/{id}/terminate"
    description: "Terminate an agreement"
    roles: [CorporateController]
    code: 200
    input: []
    output: MarketPartnerAgreement
    side_effects: ["[DRAFT, ACTIVE] -> TERMINATED; increments MarketPartnerAgreement.version by 1"]

  # --- ProfitPeriod / line items ---
  - method: POST
    path: "/api/profit-periods"
    description: "Open a profit accounting period for a restaurant"
    roles: [OperationsAuditor]
    code: 201
    input: [restaurant_id, period_start_date, period_end_date]
    output: ProfitPeriod
    side_effects: ["status=OPEN; overlap with any non-LOCKED period of the same restaurant is rejected (ERR_PERIOD_OVERLAP)"]

  - method: GET
    path: "/api/profit-periods"
    description: "List profit periods"
    roles: [PlatformAdmin, CorporateController, OperationsAuditor, ManagingPartner, MarketPartner]
    code: 200
    input: ["restaurant_id?", "status?", "limit?", "offset?"]
    output: "ProfitPeriod[]"
    side_effects: []

  - method: GET
    path: "/api/profit-periods/{id}"
    description: "Get a profit period"
    roles: [PlatformAdmin, CorporateController, OperationsAuditor, ManagingPartner, MarketPartner]
    code: 200
    input: []
    output: ProfitPeriod
    side_effects: []

  - method: POST
    path: "/api/profit-periods/{id}/line-items"
    description: "Post a statement line item to an OPEN period"
    roles: [OperationsAuditor]
    code: 201
    input: [category, amount_cents, entry_status, expected_profit_period_version]
    output: ProfitStatementLineItem
    side_effects: ["period must be OPEN; logical clock date <= period_end_date; increments ProfitPeriod.version by 1"]

  - method: GET
    path: "/api/profit-periods/{id}/line-items"
    description: "List line items of a period"
    roles: [PlatformAdmin, CorporateController, OperationsAuditor, ManagingPartner]
    code: 200
    input: ["category?", "entry_status?", "limit?", "offset?"]
    output: "ProfitStatementLineItem[]"
    side_effects: []

  - method: POST
    path: "/api/line-items/{id}/finalize"
    description: "Finalize a PROVISIONAL line item with its actual amount"
    roles: [OperationsAuditor]
    code: 200
    input: [actual_amount_cents]
    output: ProfitStatementLineItem
    side_effects: ["entry_status PROVISIONAL -> FINALIZED; actual_amount_cents recorded; increments ProfitStatementLineItem.version by 1"]

  - method: POST
    path: "/api/profit-periods/{id}/compute"
    description: "Compute provisional restaurant profit"
    roles: [OperationsAuditor]
    code: 200
    input: [expected_profit_period_version]
    output: ProfitPeriod
    side_effects: ["OPEN or REOPENED -> COMPUTED; provisional_profit_cents set; increments ProfitPeriod.version by 1"]

  - method: POST
    path: "/api/profit-periods/{id}/finalize"
    description: "Finalize a computed period: final profit, partner share, override, retained"
    roles: [CorporateController]
    code: 200
    input: []
    output: ProfitPeriod
    side_effects: ["COMPUTED -> FINALIZED; final_distributable_profit_cents, partner_share_cents, market_override_cents, corporate_retained_cents, finalized_at, dispute_deadline set; increments ProfitPeriod.version by 1"]

  - method: POST
    path: "/api/profit-periods/{id}/lock"
    description: "Lock a finalized period"
    roles: [CorporateController]
    code: 200
    input: []
    output: ProfitPeriod
    side_effects: ["FINALIZED -> LOCKED; increments ProfitPeriod.version by 1"]

  # --- YieldStandard / MeatCutBatch ---
  - method: POST
    path: "/api/yield-standards"
    description: "Create a yield standard"
    roles: [CorporateController]
    code: 201
    input: [cut_code, expected_yield_pct, waste_tolerance_pct, standard_cost_per_lb_cents]
    output: YieldStandard
    side_effects: ["active=true; duplicate active cut_code rejected (ERR_DUPLICATE_CUT_CODE)"]

  - method: GET
    path: "/api/yield-standards"
    description: "List yield standards"
    roles: [PlatformAdmin, CorporateController, OperationsAuditor]
    code: 200
    input: ["cut_code?", "active?", "limit?", "offset?"]
    output: "YieldStandard[]"
    side_effects: []

  - method: GET
    path: "/api/yield-standards/{id}"
    description: "Get a yield standard"
    roles: [PlatformAdmin, CorporateController, OperationsAuditor]
    code: 200
    input: []
    output: YieldStandard
    side_effects: []

  - method: POST
    path: "/api/yield-standards/{id}/deactivate"
    description: "Deactivate a yield standard"
    roles: [CorporateController]
    code: 200
    input: []
    output: YieldStandard
    side_effects: ["active := false"]

  - method: POST
    path: "/api/meat-cut-batches"
    description: "Record an in-house meat cutting batch"
    roles: [OperationsAuditor]
    code: 201
    input: [restaurant_id, profit_period_id, cut_code, sub_primal_weight_lbs]
    output: MeatCutBatch
    side_effects: ["status=RECORDED; period must be in {OPEN, COMPUTED, REOPENED}"]

  - method: GET
    path: "/api/meat-cut-batches"
    description: "List meat cut batches"
    roles: [PlatformAdmin, CorporateController, OperationsAuditor, ManagingPartner]
    code: 200
    input: ["restaurant_id?", "profit_period_id?", "status?", "limit?", "offset?"]
    output: "MeatCutBatch[]"
    side_effects: []

  - method: GET
    path: "/api/meat-cut-batches/{id}"
    description: "Get a meat cut batch"
    roles: [PlatformAdmin, CorporateController, OperationsAuditor, ManagingPartner]
    code: 200
    input: []
    output: MeatCutBatch
    side_effects: []

  - method: POST
    path: "/api/meat-cut-batches/{id}/audit"
    description: "Audit a batch: records actual yield, computes waste charge"
    roles: [OperationsAuditor]
    code: 200
    input: [actual_yield_lbs]
    output: MeatCutBatch
    side_effects: ["RECORDED -> AUDITED_CONFORMING or VARIANCE_CONFIRMED per meat_waste_charge; increments MeatCutBatch.version by 1"]

  - method: POST
    path: "/api/meat-cut-batches/{id}/waive"
    description: "Waive a confirmed variance charge"
    roles: [CorporateController]
    code: 200
    input: []
    output: MeatCutBatch
    side_effects: ["VARIANCE_CONFIRMED -> VARIANCE_WAIVED; waste_charge_cents := 0; increments MeatCutBatch.version by 1"]

  # --- AwardProgram / AwardGrant ---
  - method: POST
    path: "/api/award-programs"
    description: "Create a conference or stock award program"
    roles: [CorporateController]
    code: 201
    input: [name, program_type, performance_period_start_date, performance_period_end_date, "eligibility_threshold_score?", "stock_units_pool?"]
    output: AwardProgram
    side_effects: ["status=OPEN, units_reserved=0"]

  - method: GET
    path: "/api/award-programs"
    description: "List award programs"
    roles: [PlatformAdmin, CorporateController, OperationsAuditor, ManagingPartner, MarketPartner]
    code: 200
    input: ["program_type?", "status?", "limit?", "offset?"]
    output: "AwardProgram[]"
    side_effects: []

  - method: GET
    path: "/api/award-programs/{id}"
    description: "Get an award program"
    roles: [PlatformAdmin, CorporateController, OperationsAuditor, ManagingPartner, MarketPartner]
    code: 200
    input: []
    output: AwardProgram
    side_effects: []

  - method: POST
    path: "/api/award-programs/{id}/close"
    description: "Close a program to new grants"
    roles: [CorporateController]
    code: 200
    input: []
    output: AwardProgram
    side_effects: ["status OPEN -> CLOSED"]

  - method: POST
    path: "/api/award-programs/{id}/grants"
    description: "Grant an award to a partner from a source profit period"
    roles: [CorporateController]
    code: 201
    input: [partner_id, source_period_id]
    output: AwardGrant
    side_effects: ["award_eligibility_score runs; status=EARNED; for STOCK_GRANT units_reserved += units_awarded"]

  - method: GET
    path: "/api/award-grants"
    description: "List award grants"
    roles: [PlatformAdmin, CorporateController, OperationsAuditor, ManagingPartner, MarketPartner]
    code: 200
    input: ["program_id?", "partner_id?", "source_period_id?", "status?", "limit?", "offset?"]
    output: "AwardGrant[]"
    side_effects: []

  - method: GET
    path: "/api/award-grants/{id}"
    description: "Get an award grant"
    roles: [PlatformAdmin, CorporateController, OperationsAuditor, ManagingPartner, MarketPartner]
    code: 200
    input: []
    output: AwardGrant
    side_effects: []

  - method: POST
    path: "/api/award-grants/{id}/vest"
    description: "Move a grant into vesting"
    roles: [CorporateController]
    code: 200
    input: []
    output: AwardGrant
    side_effects: ["EARNED -> VESTING; increments AwardGrant.version by 1"]

  # --- DisputeCase ---
  - method: POST
    path: "/api/dispute-cases"
    description: "Managing partner files a profit dispute on a FINALIZED period"
    roles: [ManagingPartner]
    code: 201
    input: [period_id, claim_text]
    output: DisputeCase
    side_effects: ["status=SUBMITTED then auto -> UNDER_REVIEW; filed_by_partner_id := X-User-ID; filer must be the partner of the restaurant's ACTIVE-family contract (ERR_CONTRACT_PARTNER_MISMATCH); rejected when clock > dispute_deadline (ERR_DISPUTE_WINDOW_CLOSED); rejected when another open dispute exists on the period (ERR_DUPLICATE_OPEN_DISPUTE)"]

  - method: GET
    path: "/api/dispute-cases"
    description: "List dispute cases"
    roles: [PlatformAdmin, CorporateController, ManagingPartner]
    code: 200
    input: ["period_id?", "filed_by_partner_id?", "status?", "limit?", "offset?"]
    output: "DisputeCase[]"
    side_effects: []

  - method: GET
    path: "/api/dispute-cases/{id}"
    description: "Get a dispute case"
    roles: [PlatformAdmin, CorporateController, ManagingPartner]
    code: 200
    input: []
    output: DisputeCase
    side_effects: []

  - method: POST
    path: "/api/dispute-cases/{id}/request-evidence"
    description: "Controller requests evidence from the filing partner"
    roles: [CorporateController]
    code: 200
    input: []
    output: DisputeCase
    side_effects: ["UNDER_REVIEW -> EVIDENCE_REQUESTED; increments DisputeCase.version by 1"]

  - method: POST
    path: "/api/dispute-cases/{id}/submit-evidence"
    description: "Filing partner submits evidence; dispute returns to review"
    roles: [ManagingPartner]
    code: 200
    input: [evidence_text]
    output: DisputeCase
    side_effects: ["EVIDENCE_REQUESTED -> UNDER_REVIEW; increments DisputeCase.version by 1"]

  - method: POST
    path: "/api/dispute-cases/{id}/resolve"
    description: "Resolve a dispute: UPHELD (period unchanged) or ADJUSTED (period reopens with ADJUSTMENT line)"
    roles: [CorporateController]
    code: 200
    input: [outcome, "adjustment_cents?"]
    output: DisputeCase
    side_effects: ["UNDER_REVIEW or ESCALATED -> RESOLVED_UPHELD | RESOLVED_ADJUSTED; on ADJUSTED: ProfitPeriod FINALIZED -> REOPENED and ADJUSTMENT line item created; increments DisputeCase.version by 1"]

  - method: POST
    path: "/api/dispute-cases/{id}/withdraw"
    description: "Filing partner withdraws an open dispute"
    roles: [ManagingPartner]
    code: 200
    input: []
    output: DisputeCase
    side_effects: ["[SUBMITTED, UNDER_REVIEW, EVIDENCE_REQUESTED] -> WITHDRAWN; increments DisputeCase.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum, malformed date, or interval bounds violated (end <= start)" }
  - { id: ERR_PARTNER_NOT_FOUND, http: 404, condition: "Partner id does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "ManagingPartnerContract id does not exist" }
  - { id: ERR_RESTAURANT_NOT_FOUND, http: 404, condition: "Restaurant id does not exist" }
  - { id: ERR_MARKET_GROUP_NOT_FOUND, http: 404, condition: "MarketGroup id does not exist" }
  - { id: ERR_PERIOD_NOT_FOUND, http: 404, condition: "ProfitPeriod id does not exist" }
  - { id: ERR_LINE_ITEM_NOT_FOUND, http: 404, condition: "ProfitStatementLineItem id does not exist" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "MeatCutBatch id does not exist" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "AwardProgram id does not exist" }
  - { id: ERR_GRANT_NOT_FOUND, http: 404, condition: "AwardGrant id does not exist" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "DisputeCase id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "MarketPartnerAgreement id does not exist" }
  - { id: ERR_YIELD_STANDARD_NOT_FOUND, http: 404, condition: "YieldStandard id does not exist" }
  - { id: ERR_BUYOUT_NOT_FOUND, http: 404, condition: "BuyoutOrder id does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body-referenced FK (partner_id, restaurant_id, market_group_id, source_period_id, profit_period_id) does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state violation: entity not in a from-state that allows the requested trigger" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  - { id: ERR_CONTRACT_NOT_FUNDABLE, http: 409, condition: "Activate attempted with zero escrow (buy_in_escrow_cents == 0) — state gate before fiscal check" }
  - { id: ERR_BUY_IN_INCOMPLETE, http: 422, condition: "0 < buy_in_escrow_cents < buy_in_required_cents at activation" }
  - { id: ERR_BUY_IN_OVERPAYMENT, http: 422, condition: "Buy-in payment would push buy_in_escrow_cents above buy_in_required_cents" }
  - { id: ERR_FUNDING_WINDOW_LAPSED, http: 422, condition: "Activation attempted after submitted_at + FUNDING_WINDOW_DAYS (contract will be swept to LAPSED)" }
  - { id: ERR_RESTAURANT_NOT_ACTIVE, http: 422, condition: "Operation requires Restaurant.status == ACTIVE" }
  - { id: ERR_RESTAURANT_ALREADY_HAS_ACTIVE_CONTRACT, http: 422, condition: "Another contract on the restaurant is in {PENDING_FUNDING, ACTIVE, RENEWAL_OFFERED, BUYOUT_PENDING}" }
  - { id: ERR_RESTAURANT_HAS_OPEN_CONTRACTS, http: 422, condition: "Restaurant close blocked by open contracts" }
  - { id: ERR_NOT_MANAGING_PARTNER, http: 422, condition: "Contract submit requires Partner.role_in_program == MANAGING_PARTNER" }
  - { id: ERR_NO_ACTIVE_CONTRACT_FOR_RESTAURANT, http: 422, condition: "Compute/finalize requires a contract in {ACTIVE, RENEWAL_OFFERED, BUYOUT_PENDING} on the restaurant" }
  - { id: ERR_RENEWAL_BLOCKED_BY_OPEN_DISPUTE, http: 422, condition: "Renewal offer blocked while any open dispute exists on the restaurant's periods" }
  - { id: ERR_DEPARTURE_BLOCKED_BY_OPEN_DISPUTE, http: 422, condition: "Departure blocked while any open dispute exists on the restaurant's periods" }
  - { id: ERR_CONTRACT_PARTNER_MISMATCH, http: 403, condition: "X-User-ID does not match the contract's (or restaurant's active contract's) partner_id" }
  - { id: ERR_SUCCESSOR_NOT_ELIGIBLE, http: 422, condition: "Transfer successor must be role_in_program == MANAGING_PARTNER with status == CERTIFIED" }
  - { id: ERR_BUYOUT_ALREADY_OPEN, http: 422, condition: "Transfer blocked: a BuyoutOrder in {DRAFT, APPROVED} exists on the contract" }
  - { id: ERR_CONTRACT_NOT_IN_BUYOUT, http: 409, condition: "Buyout order creation/approval requires contract BUYOUT_PENDING" }
  - { id: ERR_OFFSET_EXCEEDS_PAYOUT, http: 422, condition: "offset_cents > capital_return_cents + accrued_share_cents" }
  - { id: ERR_PERIOD_OVERLAP, http: 422, condition: "New ProfitPeriod [start, end) intersects an existing non-LOCKED period of the same restaurant (half-open adjacency allowed)" }
  - { id: ERR_PERIOD_NOT_OPEN, http: 409, condition: "Batch record/audit/waive requires parent period in {OPEN, COMPUTED, REOPENED}" }
  - { id: ERR_PERIOD_CLOSED_FOR_ENTRIES, http: 422, condition: "Line-item post rejected: logical clock date is after period_end_date" }
  - { id: ERR_UNFINALIZED_LINE_ITEMS, http: 422, condition: "Finalize blocked: at least one line item still entry_status == PROVISIONAL" }
  - { id: ERR_BATCH_PERIOD_RESTAURANT_MISMATCH, http: 422, condition: "MeatCutBatch.profit_period_id belongs to a different restaurant than restaurant_id" }
  - { id: ERR_DUPLICATE_CUT_CODE, http: 422, condition: "An active YieldStandard with this cut_code already exists" }
  - { id: ERR_UNKNOWN_CUT_CODE, http: 422, condition: "No active YieldStandard matches the batch cut_code" }
  - { id: ERR_TRAINING_TENURE_INSUFFICIENT, http: 422, condition: "certify requires training_weeks_accrued >= MIN_TRAINING_WEEKS (52)" }
  - { id: ERR_MARKET_GROUP_NOT_ACTIVE, http: 422, condition: "Agreement activation requires MarketGroup.status == ACTIVE" }
  - { id: ERR_OVERRIDE_COVERAGE_OVERLAP, http: 422, condition: "Another DRAFT/ACTIVE agreement covers the same market group on an intersecting CLOSED interval" }
  - { id: ERR_AWARD_SOURCE_PERIOD_INELIGIBLE, http: 422, condition: "Grant source period must be FINALIZED or LOCKED and within the program's inclusive performance window" }
  - { id: ERR_AWARD_NOT_ELIGIBLE, http: 422, condition: "eligibility_score below program eligibility_threshold_score (or below 80 for STOCK_GRANT tier 1)" }
  - { id: ERR_AWARD_POOL_EXHAUSTED, http: 422, condition: "units_reserved + tier units > stock_units_pool" }
  - { id: ERR_DISPUTE_WINDOW_CLOSED, http: 422, condition: "Logical clock > dispute_deadline (finalized_at + 30 days)" }
  - { id: ERR_DUPLICATE_OPEN_DISPUTE, http: 422, condition: "Another DisputeCase on the period is in {SUBMITTED, UNDER_REVIEW, EVIDENCE_REQUESTED, ESCALATED}" }
  - { id: ERR_DISPUTE_NOT_OWNED, http: 403, condition: "X-User-ID does not match dispute.filed_by_partner_id" }
  - { id: ERR_ADJUSTMENT_REQUIRED, http: 422, condition: "Resolve with outcome == ADJUSTED requires adjustment_cents > 0" }
  - { id: ERR_OPEN_DISPUTE_BLOCKS_LOCK, http: 422, condition: "Period lock blocked by an open dispute on the period" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Corporate platform operator; owns clock, market groups, restaurants"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/market-groups* (create, activate)"
      - "POST /api/restaurants* (create, activate, close)"
    shared_operations:
      - "All GET list/detail endpoints"

  - name: HRRecruiter
    description: "Owns the partner recruiting pipeline and training tenure"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/partners (create)"
      - "POST /api/partners/{id}/start-training"
      - "POST /api/partners/{id}/certify"
      - "POST /api/partners/{id}/withdraw"
    shared_operations:
      - "GET /api/partners*"

  - name: CorporateController
    description: "Corporate finance/legal; contracts, buyouts, agreements, finalize, waivers, disputes resolution, awards"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/managing-partner-contracts* (create, submit, activate, offer-renewal, transfer, buyout-orders)"
      - "POST /api/buyout-orders/{id}/approve|pay"
      - "POST /api/market-partner-agreements* (create, activate, terminate)"
      - "POST /api/profit-periods/{id}/finalize|lock"
      - "POST /api/yield-standards* (create, deactivate)"
      - "POST /api/meat-cut-batches/{id}/waive"
      - "POST /api/award-programs* (create, close)"
      - "POST /api/award-programs/{id}/grants"
      - "POST /api/award-grants/{id}/vest"
      - "POST /api/dispute-cases/{id}/request-evidence|resolve"
    shared_operations:
      - "GET endpoints on contracts, periods, batches, disputes, awards, partners, restaurants"

  - name: ManagingPartner
    description: "Entity-backed partner running one restaurant; funds buy-in, accepts renewal, departs, files/owns disputes"
    identity: "entity_backed:Partner"
    exclusive_operations:
      - "POST /api/managing-partner-contracts/{id}/buy-in-payments"
      - "POST /api/managing-partner-contracts/{id}/accept-renewal"
      - "POST /api/managing-partner-contracts/{id}/depart"
      - "POST /api/dispute-cases (file)"
      - "POST /api/dispute-cases/{id}/submit-evidence"
      - "POST /api/dispute-cases/{id}/withdraw"
    shared_operations:
      - "GET endpoints scoped to own contract/periods/disputes"

  - name: MarketPartner
    description: "Entity-backed market partner overseeing a group; read access to group performance"
    identity: "entity_backed:Partner"
    exclusive_operations: []
    shared_operations:
      - "GET /api/market-partner-agreements*"
      - "GET /api/profit-periods*"
      - "GET /api/award-programs*"

  - name: OperationsAuditor
    description: "Operational finance auditor; posts line items, computes profit, records and audits meat batches"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/profit-periods (create)"
      - "POST /api/profit-periods/{id}/line-items"
      - "POST /api/line-items/{id}/finalize"
      - "POST /api/profit-periods/{id}/compute"
      - "POST /api/meat-cut-batches (create)"
      - "POST /api/meat-cut-batches/{id}/audit"
    shared_operations:
      - "GET endpoints on periods, batches, yield standards, contracts"

constants:
  FUNDING_WINDOW_DAYS: 14
  RENEWAL_EXTENSION_YEARS: 2
  MIN_TRAINING_WEEKS: 52
  MAX_TRAINING_WEEKS: 78
  DISPUTE_WINDOW_DAYS: 30
  DISPUTE_ESCALATION_DAYS: 45
  VESTING_DAYS: 365
