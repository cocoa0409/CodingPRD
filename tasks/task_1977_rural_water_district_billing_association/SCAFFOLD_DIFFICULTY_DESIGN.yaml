    distinguishing_aspect: 'AnnexationPetition is a CYCLIC machine on a different entity than

      Invoice: SUBMITTED -> FEASIBILITY_REVIEW -> APPROVED_PENDING_VOTE ->

      REJECTED -> SUBMITTED (resubmission with deposit top-up), and the

      cycle count affects annexation_fee_split because deposit_cents

      accumulates across resubmissions.

      '
    test_recipe:
      setup:
      - District with ACTIVE service area; petition filed with deposit 100000, advanced to APPROVED_PENDING_VOTE, ratification FAILED (3 AGAINST), then resubmitted
        with top-up 50000
