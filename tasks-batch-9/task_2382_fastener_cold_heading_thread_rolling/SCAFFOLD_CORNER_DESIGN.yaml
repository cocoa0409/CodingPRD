            - "After the lot reserves mass the wire lot is at version 3 with available_mass_kg 479.000 and reserved_mass_kg 21.000"
            - "After complete-heading v_read3 == 4 with consumed_mass_kg 20.000, reserved_mass_kg 0.000 and available_mass_kg 480.000"
