  # ===========================================================================
  - section: calculations
    instances:
      - name: cost_summary_medium_tier_units_below_free_allowance
        claim_type: correct_result
        grounds:
          - calculations.connection_monthly_refresh_cost
        distinguishing_aspect: "MEDIUM rate class: 4 SUCCEEDED FULL refreshes at unit cost 4 = 16 units; FREE_UNITS_MEDIUM=20 means billable_units == 0 and cost_cents == 0 — allowance floor honored."
        test_recipe:
          setup: ["ACTIVE connection whose recipient has a MEDIUM tier; complete_auth + 3 explicit FULL refreshes, clock fixed in September 2026"]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Medium Bank", supported_methods: ["CREDENTIALS"], target_method: "CREDENTIALS", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
