            - "ContentBrief.${brief_id}.state == DRAFT"
            - "ContentBrief.${brief_id}.sme_expert_id == null"
            - "ContentItem.${item_id}.workflow_state == DRAFT"
            - "ContentItem.${item_id}.revision_number == 1"
            - "GET /editorial/content-items/${item_id}/review-gates returns exactly 0 rows"
            - "CalendarSlot.${slot_id}.committed_points == 16"
            - "an implementation that snapshotted the brief state onto the item at creation time would let this submit succeed and emit 3 gates"

      - name: publish_blocked_while_campaign_posture_frozen_by_lapsed_usages
        grounds:
          - calculations.campaign_governance_posture
          - state_machines.AssetUsage.transitions[ACTIVE->RIGHTS_LAPSED]
          - validations[priority=22]
          - errors[ERR_CAMPAIGN_POSTURE_FROZEN]
          - endpoints[POST /editorial/content-items/{id}/publish]
        distinguishing_aspect: |
          The gate here is two entities away: expiring two Assets lapses their two AssetUsages, which
          pushes the parent Campaign's expired_usage_count to FREEZE_USAGE_COUNT and flips
          governance_posture to FROZEN. The ContentItem is READY with all gates cleared, so publish
          must consult the campaign posture derived from sibling usages and fail at priority 22 rather
