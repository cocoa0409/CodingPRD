            - "One HousingBlock left in PENDING (created, never opened)."
            - "One EXPOSURE_BASED LossEstimateSnapshot taken while the event has zero ReserveEntry rows (high-water 0, stale false)."
            - "The claim is then triaged, appending ReserveEntry sequence_no 1, which drives the snapshot stale."
