            - "a2_st == PROPOSED (ON_HOLD stories accept new assignment proposals)"
            - "fin_status == DRAFT (accept bubble-up auto-resume)"

      - name: kill_cancels_open_assignments
        claim_type: side_effect_execution
        grounds: [state_machines.Story.KILLED, calculations.active_assignment_count]
        distinguishing_aspect: "Cascade down: killing a story cancels its PROPOSED and ACCEPTED assignments (conditional on non-terminal status) and reconciles both staff counters to 0."
        test_recipe:
          setup: ["DRAFT story with one ACCEPTED (reporter A) and one PROPOSED (reporter B) assignment"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk KC", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep A KC", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { ra_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep B KC", role_capability: REPORTER, home_desk: SPORTS, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rb_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "ME KC", role_capability: MANAGING_EDITOR, home_desk: METRO, hourly_rate_cents: 8000 }, as: NewsDirector, captures: { me_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "KC", summary: "x", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${ra_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { story_id: "$.data.greenlit_story_id" } }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${story_id}", staff_id: "${ra_id}", assignment_role: REPORTER, start_at: "2026-08-01T08:00:00Z", end_at: "2026-08-01T09:00:00Z", planned_effort_minutes: 60 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { a1_id: "$.data.id" } }
            - { call: "POST /newsroom/assignments/${a1_id}/accept", payload: {}, as: Reporter, as_user_id: "${ra_id}" }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${story_id}", staff_id: "${rb_id}", assignment_role: REPORTER, start_at: "2026-08-01T08:00:00Z", end_at: "2026-08-01T09:00:00Z", planned_effort_minutes: 60 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { a2_id: "$.data.id" } }
          trigger:
            - { call: "POST /newsroom/stories/${story_id}/kill", payload: {}, as: ManagingEditor, as_user_id: "${me_id}" }
            - { call: "GET /newsroom/stories/${story_id}/assignments", payload: {}, as: NewsDirector, captures: { a1_st: "$.data[0].status", a2_st: "$.data[1].status" } }
            - { call: "GET /newsroom/staff/${ra_id}", payload: {}, as: NewsDirector, captures: { ra_cnt: "$.data.active_assignment_count" } }
            - { call: "GET /newsroom/staff/${rb_id}", payload: {}, as: NewsDirector, captures: { rb_cnt: "$.data.active_assignment_count" } }
          assert:
            - "a1_st == CANCELLED and a2_st == CANCELLED"
            - "ra_cnt == 0 and rb_cnt == 0"

      - name: resolve_expires_paged_callins
        claim_type: side_effect_execution
        grounds: [state_machines.BreakingNewsEvent.ACTIVE_to_RESOLVED, state_machines.StaffCallIn.PAGED_to_EXPIRED]
        distinguishing_aspect: "Resolving an event force-expires its still-PAGED call-ins in the same request."
        test_recipe:
          setup: ["one ACTIVE reporter; band-2 event activated with call_in_pool_size 1 -> one PAGED call-in"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep RE", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/breaking-events", payload: { title: "RE event", priority_band: 3, window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T12:00:00Z", call_in_pool_size: 1 }, as: NewsDirector, captures: { ev_id: "$.data.id" } }
            - { call: "POST /newsroom/breaking-events/${ev_id}/activate", payload: {}, as: NewsDirector }
            - { call: "GET /newsroom/breaking-events/${ev_id}/call-ins", payload: {}, as: NewsDirector, captures: { ci_id: "$.data[0].id", ci_st: "$.data[0].status" } }
          trigger:
            - { call: "POST /newsroom/breaking-events/${ev_id}/resolve", payload: {}, as: NewsDirector }
            - { call: "GET /newsroom/breaking-events/${ev_id}/call-ins", payload: {}, as: NewsDirector, captures: { ci_after: "$.data[0].status" } }
          assert:
            - "ci_st == PAGED (after activation)"
            - "ci_after == EXPIRED (resolve cascade)"

      - name: callin_double_confirm_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.StaffCallIn, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CONFIRMED is terminal for a call-in; a second confirm fails."
        test_recipe:
          setup: ["PAGED call-in for the reporter (event activated, pool 1)"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep DC", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/breaking-events", payload: { title: "DC event", priority_band: 1, window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T12:00:00Z", call_in_pool_size: 1 }, as: NewsDirector, captures: { ev_id: "$.data.id" } }
            - { call: "POST /newsroom/breaking-events/${ev_id}/activate", payload: {}, as: NewsDirector }
            - { call: "GET /newsroom/breaking-events/${ev_id}/call-ins", payload: {}, as: NewsDirector, captures: { ci_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /newsroom/call-ins/${ci_id}/confirm", payload: {}, as: Reporter, as_user_id: "${rep_id}", captures: { st1: "$.data.status" } }
            - { call: "POST /newsroom/call-ins/${ci_id}/confirm", payload: {}, as: Reporter, as_user_id: "${rep_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "st1 == CONFIRMED"
            - "err == ERR_INVALID_STATE (second confirm rejected)"


      - name: callin_decline_works_and_survives_resolve
        claim_type: valid_transition
        grounds: [state_machines.StaffCallIn.PAGED_to_DECLINED, state_machines.BreakingNewsEvent.ACTIVE_to_RESOLVED]
        distinguishing_aspect: "The paged staff member can decline (PAGED -> DECLINED); the later event resolve only expires still-PAGED call-ins, so the DECLINED record is untouched."
        test_recipe:
          setup: ["one ACTIVE reporter; band-2 event activated with pool 1 -> one PAGED call-in"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep DL", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/breaking-events", payload: { title: "DL event", priority_band: 2, window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T12:00:00Z", call_in_pool_size: 1 }, as: NewsDirector, captures: { ev_id: "$.data.id" } }
            - { call: "POST /newsroom/breaking-events/${ev_id}/activate", payload: {}, as: NewsDirector }
            - { call: "GET /newsroom/breaking-events/${ev_id}/call-ins", payload: {}, as: NewsDirector, captures: { ci_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /newsroom/call-ins/${ci_id}/decline", payload: {}, as: Reporter, as_user_id: "${rep_id}", captures: { st1: "$.data.status" } }
            - { call: "POST /newsroom/breaking-events/${ev_id}/resolve", payload: {}, as: NewsDirector }
            - { call: "GET /newsroom/breaking-events/${ev_id}/call-ins", payload: {}, as: NewsDirector, captures: { st2: "$.data[0].status" } }
          assert:
            - "st1 == DECLINED"
            - "st2 == DECLINED (resolve's expiry sweep touches only PAGED records)"

  - section: calculations
    instances:
      - name: provisional_cost_known_inputs
        claim_type: correct_result
        grounds: [calculations.assignment_cost, entities.Assignment.fields.provisional_cost_cents]
        distinguishing_aspect: "PROVISIONAL variant: planned 90 min at 6000c/h -> 100c/min -> 9000c, computed at creation and immutable thereafter."
        test_recipe:
          setup: ["reporter at 6000c/h; DRAFT story"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk PC", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep PC", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "PC", summary: "x", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { story_id: "$.data.greenlit_story_id" } }
          trigger:
            - { call: "POST /newsroom/assignments", payload: { story_id: "${story_id}", staff_id: "${rep_id}", assignment_role: REPORTER, start_at: "2026-08-01T08:00:00Z", end_at: "2026-08-01T09:30:00Z", planned_effort_minutes: 90 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { prov: "$.data.provisional_cost_cents", fin: "$.data.final_cost_cents" } }
          assert:
            - "prov == 9000 (round_half_up(90 x 6000/60, 0))"
            - "fin == null (FINAL only at completion)"

      - name: final_cost_overtime_split
        claim_type: constants_applied
        grounds: [calculations.assignment_cost, calculations.payroll_week_total]
        distinguishing_aspect: "FINAL variant threshold split at exactly 2400 weekly minutes: a single 2500-minute completion at 6000c/h splits into 2400 regular + 100 overtime and costs 255000c = (2400 + 100 x 1.5) x 100."
        test_recipe:
          setup: ["reporter at 6000c/h with one ACCEPTED assignment; clock at Monday 2026-08-03T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk OT", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep OT", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "OT", summary: "x", desk: METRO, deadline_at: "2026-08-05T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { story_id: "$.data.greenlit_story_id" } }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${story_id}", staff_id: "${rep_id}", assignment_role: REPORTER, start_at: "2026-08-03T08:00:00Z", end_at: "2026-08-03T09:00:00Z", planned_effort_minutes: 60 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { asg_id: "$.data.id" } }
            - { call: "POST /newsroom/assignments/${asg_id}/accept", payload: {}, as: Reporter, as_user_id: "${rep_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: NewsDirector }
          trigger:
            - { call: "POST /newsroom/assignments/${asg_id}/complete", payload: { actual_effort_minutes: 2500 }, as: Reporter, as_user_id: "${rep_id}", captures: { fin: "$.data.final_cost_cents" } }
            - { call: "GET /newsroom/staff/${rep_id}/payroll?week_start=2026-08-03", payload: {}, as: NewsDirector, captures: { total: "$.data.total_cents", reg: "$.data.regular_minutes", ot: "$.data.overtime_minutes" } }
          assert:
            - "fin == 255000"
            - "total == 255000 and reg == 2400 and ot == 100"

      - name: payroll_empty_week_zero
        claim_type: correct_result
        grounds: [calculations.payroll_week_total]
        distinguishing_aspect: "Empty input set: a week with zero COMPLETED assignments yields total_cents 0, assignment_count 0, not an error."
        test_recipe:
          setup: ["one reporter, no assignments"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep EW", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
          trigger:
            - { call: "GET /newsroom/staff/${rep_id}/payroll?week_start=2026-08-03", payload: {}, as: NewsDirector, captures: { total: "$.data.total_cents", cnt: "$.data.assignment_count", reg: "$.data.regular_minutes", ot: "$.data.overtime_minutes" } }
          assert:
            - "total == 0 and cnt == 0 and reg == 0 and ot == 0"

      - name: payroll_chronological_split_order
        claim_type: correct_result
        grounds: [calculations.payroll_week_total, calculations.assignment_cost]
        distinguishing_aspect: "Chronological allocation: the 600-minute assignment completed first at 10:00 is fully regular (60000c); the 2000-minute assignment completed at 11:00 absorbs the overtime (reg 1800 + ot 200 = 210000c) — completing the same two assignments in the opposite order would swap which one carries overtime."
        test_recipe:
          setup: ["reporter at 6000c/h with two ACCEPTED assignments on two DRAFT stories; completions at Monday 10:00 (600m) and 11:00 (2000m)"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk CO", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep CO", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "CO one", summary: "x", desk: METRO, deadline_at: "2026-08-05T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p1_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "CO two", summary: "y", desk: METRO, deadline_at: "2026-08-05T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p2_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p1_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p1_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { s1_id: "$.data.greenlit_story_id" } }
            - { call: "POST /newsroom/pitches/${p2_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p2_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { s2_id: "$.data.greenlit_story_id" } }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${s1_id}", staff_id: "${rep_id}", assignment_role: REPORTER, start_at: "2026-08-03T08:00:00Z", end_at: "2026-08-03T09:00:00Z", planned_effort_minutes: 600 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { a1_id: "$.data.id" } }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${s2_id}", staff_id: "${rep_id}", assignment_role: REPORTER, start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T11:00:00Z", planned_effort_minutes: 2000 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { a2_id: "$.data.id" } }
            - { call: "POST /newsroom/assignments/${a1_id}/accept", payload: {}, as: Reporter, as_user_id: "${rep_id}" }
            - { call: "POST /newsroom/assignments/${a2_id}/accept", payload: {}, as: Reporter, as_user_id: "${rep_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: NewsDirector }
            - { call: "POST /newsroom/assignments/${a1_id}/complete", payload: { actual_effort_minutes: 600 }, as: Reporter, as_user_id: "${rep_id}", captures: { f1: "$.data.final_cost_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T11:00:00Z" }, as: NewsDirector }
            - { call: "POST /newsroom/assignments/${a2_id}/complete", payload: { actual_effort_minutes: 2000 }, as: Reporter, as_user_id: "${rep_id}", captures: { f2: "$.data.final_cost_cents" } }
          trigger:
            - { call: "GET /newsroom/staff/${rep_id}/payroll?week_start=2026-08-03", payload: {}, as: NewsDirector, captures: { total: "$.data.total_cents", reg: "$.data.regular_minutes", ot: "$.data.overtime_minutes" } }
          assert:
            - "f1 == 60000 (600 regular minutes x 100c)"
            - "f2 == 210000 ((1800 + 200 x 1.5) x 100c; overtime lands on the LATER completion)"
            - "total == 270000 and reg == 2400 and ot == 200"

      - name: performance_tier_boundary
        claim_type: constants_applied
        grounds: [calculations.performance_score]
        distinguishing_aspect: "Tier boundaries are >=-inclusive on raw_score: raw exactly 100.00 -> tier A (125.00), raw 39.94 -> tier C (31.95); both reports hang off one published story with different window_end values."
        test_recipe:
          setup: ["published story (full pipeline; slot [06:00,07:00), scheduler at 06:30)"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk TB", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep TB", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Copy TB", role_capability: COPY_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { copy_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Fact TB", role_capability: FACT_CHECKER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { fact_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Legal TB", role_capability: LEGAL_REVIEWER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { legal_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Ana TB", role_capability: ANALYST, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { ana_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NewsDirector }
            - { call: "POST /newsroom/pitches", payload: { title: "TB", summary: "x", desk: METRO, deadline_at: "2026-08-02T00:00:00Z", urgency: URGENT }, as: Reporter, as_user_id: "${rep_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { story_id: "$.data.greenlit_story_id" } }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${story_id}", staff_id: "${rep_id}", assignment_role: REPORTER, start_at: "2026-08-01T01:00:00Z", end_at: "2026-08-01T03:00:00Z", planned_effort_minutes: 60 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { asg_id: "$.data.id" } }
            - { call: "POST /newsroom/assignments/${asg_id}/accept", payload: {}, as: Reporter, as_user_id: "${rep_id}" }
            - { call: "POST /newsroom/stories/${story_id}/submit-edit", payload: {}, as: Reporter, as_user_id: "${rep_id}" }
            - { call: "POST /newsroom/stories/${story_id}/complete-edit", payload: {}, as: CopyEditor, as_user_id: "${copy_id}", captures: { v4: "$.data.version" } }
            - { call: "POST /newsroom/stories/${story_id}/reviews", payload: { review_type: FACT_CHECK, verdict: PASS, expected_story_version: "${v4}" }, as: FactChecker, as_user_id: "${fact_id}" }
            - { call: "GET /newsroom/stories/${story_id}", payload: {}, as: NewsDirector, captures: { v5: "$.data.version" } }
            - { call: "POST /newsroom/stories/${story_id}/reviews", payload: { review_type: LEGAL, verdict: PASS, expected_story_version: "${v5}" }, as: LegalReviewer, as_user_id: "${legal_id}" }
            - { call: "GET /newsroom/stories/${story_id}", payload: {}, as: NewsDirector, captures: { v6: "$.data.version" } }
            - { call: "POST /newsroom/slots", payload: { channel: PRINT, window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T07:00:00Z", capacity: 1 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { slot_id: "$.data.id" } }
            - { call: "POST /newsroom/stories/${story_id}/schedule", payload: { slot_id: "${slot_id}", expected_story_version: "${v6}" }, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:30:00Z" }, as: NewsDirector }
            - { call: "POST /newsroom/ops/run-publication-scheduler", payload: {}, as: NewsDirector }
          trigger:
            - { call: "POST /newsroom/stories/${story_id}/analytics-reports", payload: { variant: SETTLED, window_start: "2026-08-01T07:00:00Z", window_end: "2026-08-02T07:00:00Z", views: 1000, engagement_minutes: 1000 }, as: AnalyticsProducer, as_user_id: "${ana_id}", captures: { s1: "$.data.performance_score", t1: "$.data.tier", r1: "$.data.raw_score" } }
