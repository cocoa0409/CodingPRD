              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Seb Sequence", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: false }
              as: PayrollAdmin
              captures: { drv_seq: $.data.id }
