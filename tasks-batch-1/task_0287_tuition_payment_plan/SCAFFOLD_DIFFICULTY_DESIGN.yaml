  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: delinquency_count_boundary_three_vs_two
        grounds:
          - calculations.delinquency_evaluation
          - state_machines.Installment.SCHEDULED_to_OVERDUE
          - entities.Hold.fields.reason
        distinguishing_aspect: |
          Count threshold is >= DELINQUENCY_COUNT_LIMIT (3): with [40000 x5] (each
          overdue < amount limit), exactly 2 overdue (total 80000) yields NO hold,
          while exactly 3 overdue (total 120000, still < 150000 amount limit)
          yields a DELINQUENCY_COUNT hold — boundary on the installment-count
          metric, reached via run-delinquency.
        test_recipe:
          setup:
            - "Institution INST_K clock 2026-09-15; Term FALL2026; Student S11; Template 5PAY (down 0)."
            - "Enrollment ACTIVE charges 200000 -> [40000 x5] dues 09-21/10-11/10-31/11-20/12-10; clock 2026-10-15 so only installments 1,2 OVERDUE (count 2)."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst K", currency: "USD", refund_policy: "DATE_BASED" }
              as: Registrar
              captures: { inst_k: $.data.id }
            - call: "POST /institutions/${inst_k}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00.000Z" }
              as: Registrar
            - call: "POST /institutions/terms"
