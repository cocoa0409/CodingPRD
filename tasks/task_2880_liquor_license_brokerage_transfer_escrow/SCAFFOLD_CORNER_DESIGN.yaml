        distinguishing_aspect: "Priority 10 and 12 run ahead of every other check: an empty X-User-Role, an empty X-User-ID and a role string outside the six declared roles all answer 401 ERR_UNAUTHENTICATED even when the rest of the request is perfectly valid, and an empty-string header counts as absent rather than as a role named blank."
        test_recipe:
          setup:
            - "County SON exists so the requests below are otherwise well formed."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "SON", name: "Sonoma", state_code: "CA", quota_licenses_total: 100 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /counties/${c_id}"
              payload: {}
              as: ""
              as_user_id: ""
              expect_error: true
              captures: { e_blank: $.data.error_id }
            - call: "GET /counties/${c_id}"
              payload: {}
