            - "One labor call (crew 2, Oct 1 08:00-12:00Z) was estimated at 4 hours: per crew round_half_up(4 * 5000) = 20000, total 40000, which lifted deposit_required_cents to ceil_100(round_half_up(0.25 * 740000)) = 185000."
            - "The rider (1000 kg / 200 A / 2 universes) was reviewed to CAPABLE and cleared with no equipment lines, so additional_equipment_cost_cents stays 0."
            - "The client paid 185000, risk was assessed (credit A -> 0, arrears 0/185000 -> 0, lead 62 days -> 0.20 * (1 - 62/120) = 0.096667, score round_half_up(9.67) = 10 -> LOW -> CLEARED) and the engagement was confirmed."
            - "Hours were reported as 4 with meal_break_taken true, so §1.3 labor_cost ACTUAL also gives 40000 (no meal penalty at 4 <= 5 hours) and the call is WORKED."
            - "The clock was moved to 2026-10-03T00:00:00Z, past performance_end_utc, and the settlement was opened, which auto-advanced the engagement to PERFORMED and froze box_office_gross_cents 0, restoration_fees_cents 0, adjusted_gross_cents 0, guarantee_cents 0, actual_labor_cents 40000, actual_equipment_cents 0."
          setup_api_calls:
