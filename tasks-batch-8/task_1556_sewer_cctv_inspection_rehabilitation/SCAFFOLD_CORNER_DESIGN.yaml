            - call: "POST /sewer/technicians"
              payload: { full_name: "C S5", nassco_cert_number: "PACP-CS5X", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["CODER"] }
              as: DistrictEngineer
              captures: { tc_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "Q S5", nassco_cert_number: "PACP-QS5X", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["QA_REVIEWER"] }
              as: DistrictEngineer
              captures: { tq_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "W S5", nassco_cert_number: "PACP-WS5X", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["CREW_LEAD"] }
              as: DistrictEngineer
              captures: { tw_id: $.data.id }
            - call: "POST /sewer/districts/${d_id}/inspection-cycles"
              payload: { label: "CY-S5", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: DistrictEngineer
              captures: { cy_id: $.data.id }
            - call: "POST /sewer/inspection-cycles/${cy_id}/open"
              payload: {}
              as: DistrictEngineer
            - call: "POST /sewer/districts/${d_id}/segments"
              payload: { segment_ref: "MH-1->MH-2", diameter_mm: 200, material: "PVC", length_m: 100, install_year: 1980 }
