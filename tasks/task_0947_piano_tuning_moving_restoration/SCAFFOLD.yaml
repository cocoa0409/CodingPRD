# ---------------------------------------------------------------------------
# CONSERVATION INVARIANTS (Difficulty Rule 9) - explicit formulas over §1.1 fields
# ---------------------------------------------------------------------------
conservation_invariants:
  - id: parts-quantity-conservation
    conserved_quantity: "physical part units in a lot"
    formula: "PartsLot.on_hand_qty + PartsLot.allocated_qty + PartsLot.consumed_qty == PartsLot.initial_qty"
    forward_action: "POST /service-orders/{id}/parts-allocations (reserve)"
    compensating_action: "POST /parts-allocations/{id}/release"
    note: "Holds after every allocation, release, consume, and after the cascade release fired by ServiceOrder cancellation."

  - id: route-minutes-conservation
    conserved_quantity: "committed technician minutes on a route day"
    formula: "RouteDay.committed_minutes == sum(Appointment.total_block_minutes for Appointment.route_day_id == RouteDay.id and Appointment.scheduling_status IN {SCHEDULED, CONFIRMED})"
    forward_action: "POST /appointments"
    compensating_action: "POST /appointments/{id}/cancel"
    note: "Recomputed from scratch (not incrementally patched) after every appointment create, reschedule, cancel, and after cascade cancellation."

  - id: client-ledger-conservation
    conserved_quantity: "client money balance"
    formula: "Client.account_credit_cents == sum(LedgerEntry.amount_cents for every LedgerEntry with client_id == Client.id)"
    forward_action: "any endpoint that appends a LedgerEntry"
    compensating_action: "a REVERSAL LedgerEntry carrying the negated amount, with reverses_entry_id pointing at the row it undoes"
    note: "LedgerEntry rows are append-only and immutable: a reversal NEVER edits or hides the original row, it appends its negation. The balance is therefore the plain sum over every row of the client, and a forward entry paired with its reversal leaves that sum exactly where it started."

  - id: consignment-proceeds-conservation
    conserved_quantity: "sale proceeds of a consigned instrument"
    formula: "ConsignmentAgreement.sale_price_cents == ConsignmentAgreement.advance_recovered_cents + ConsignmentAgreement.shop_commission_cents + ConsignmentAgreement.consignor_payout_cents"
    forward_action: "POST /consignment-agreements/{id}/record-sale"
    compensating_action: "none - SOLD is terminal; the invariant is asserted at the moment of sale"
    note: "Any rounding remainder is absorbed by shop_commission_cents, which is computed last as the residual."

  - id: service-order-billing-conservation
    conserved_quantity: "contracted service value"
    formula: "ServiceOrder.billed_cents + ServiceOrder.unbilled_cents == ServiceOrder.contract_total_cents AND sum(Milestone.amount_cents for Milestone.service_order_id == ServiceOrder.id and Milestone.status != CANCELLED) + sum(Milestone.amount_cents for Milestone.status == CANCELLED) == ServiceOrder.contract_total_cents"
    forward_action: "POST /milestones/{id}/accept (moves a milestone amount from unbilled to billed)"
    compensating_action: "POST /milestones/{id}/reject (moves it back)"
    note: "Milestone amounts are minted once at ServiceOrder creation and never re-derived, so the sum over all milestones equals contract_total_cents for the whole lifetime of the order."

  - id: deposit-disposition-conservation
    conserved_quantity: "deposit money held against a service order"
    formula: "ServiceOrder.deposit_held_cents == ServiceOrder.deposit_applied_cents + ServiceOrder.deposit_refunded_cents + ServiceOrder.deposit_forfeited_cents at every terminal status of the order"
    forward_action: "POST /service-orders (deposit charged and held)"
    compensating_action: "POST /service-orders/{id}/cancel or the VOIDED_BY_REBUILD cascade (deposit split into applied / refunded / forfeited)"
    note: "deposit_forfeited_cents absorbs the cancellation fee; deposit_applied_cents absorbs milestone acceptance; the remainder refunds."

# ---------------------------------------------------------------------------
# 1.1 ENTITY-RELATIONSHIP TABLE
# ---------------------------------------------------------------------------
entities:

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: Legal or trading name of the client.
      - name: email
        type: string
        source: input
        description: Contact email; must contain "@".
      - name: phone
        type: string
        source: input
        description: Contact phone string, stored verbatim.
      - name: client_type
        type: enum
        source: input
        default: INDIVIDUAL
        constraints: "one of INDIVIDUAL, INSTITUTION, DEALER"
        description: Drives the quote pricing variant and the deposit variant.
      - name: home_zone_code
        type: enum
        source: input
        constraints: "one of ZONE_A, ZONE_B, ZONE_C"
        description: Default service zone for this client.
      - name: account_credit_cents
        type: integer
        source: computed
        default: 0
        description: Signed money balance; equals the plain sum of amount_cents over ALL of this client's LedgerEntry rows.
      - name: status
        type: enum
        source: system
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED, CLOSED"
        description: SUSPENDED and CLOSED clients cannot originate quotes, appointments or claims.

  - name: Location
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client who controls this address."
      - name: label
        type: string
        source: input
        description: Human label for the address ("Main Hall", "Residence").
      - name: zone_code
        type: enum
        source: input
        constraints: "one of ZONE_A, ZONE_B, ZONE_C"
        description: Service zone; selects the zone surcharge and the travel-buffer rule.
      - name: address_key
        type: string
        source: input
        description: Exact-match key used to detect two appointments at the same physical address on one route day.
      - name: stair_flights
        type: integer
        source: input
        default: 0
        constraints: "integer 0..8 (MAX_STAIR_FLIGHTS_PER_LOCATION)"
        description: Flights of stairs the crew must negotiate at this address.
      - name: has_service_elevator
        type: boolean
        source: input
        default: false
        description: When true this location contributes 0 stair flights to a move regardless of stair_flights.
      - name: climate_controlled
        type: boolean
        source: input
        default: false
        description: Selects CLIMATE_CONTROLLED_MULTIPLIER vs CLIMATE_UNCONTROLLED_MULTIPLIER in the tuning-cycle interval.
      - name: distance_miles_from_shop
        type: number
        source: input
        constraints: "number >= 0"
        description: Road distance from the shop; informational, move pricing uses MoveJob.distance_miles.
      - name: out_of_band_flag
        type: boolean
        source: computed
        default: false
        description: True when the climate history in the lookback window is out of band per calculation climate_out_of_band_evaluation.
      - name: readings_in_window
        type: integer
        source: computed
        default: 0
        description: Count of ClimateReading rows for this location inside the lookback window at the last recomputation.
      - name: out_of_band_count
        type: integer
        source: computed
        default: 0
        description: Count of those readings whose relative_humidity_pct is outside the RH band.

  - name: Instrument
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; current owner of record."
      - name: current_location_id
        type: string
        source: input
        description: "FK -> Location.id; where the instrument physically sits."
      - name: consignment_agreement_id
        type: string
        source: computed
        default: null
        description: "FK -> ConsignmentAgreement.id; set when a consignment activates, cleared when it ends."
      - name: make
        type: string
        source: input
        description: Manufacturer.
      - name: model
        type: string
        source: input
        description: Model designation.
      - name: serial_number
        type: string
        source: input
        description: Serial number; unique across all instruments.
      - name: instrument_class
        type: enum
        source: input
        constraints: "one of UPRIGHT, CONSOLE, BABY_GRAND, GRAND, CONCERT_GRAND"
        description: Drives price multiplier, minute multiplier, cycle adjustment, move base and parts requirement.
      - name: usage_tier
        type: enum
        source: input
        constraints: "one of HOME, STUDIO, INSTITUTIONAL, PERFORMANCE"
        description: Selects the tuning-cycle base interval.
      - name: target_pitch_hz
        type: number
        source: input
        default: 440.0
        constraints: "number in [415.0, 445.0]"
        description: Pitch standard this instrument is maintained at; a pitch assessment must cite the same reference.
      - name: last_tuning_date
        type: string
        source: input
        default: null
        description: ISO date (YYYY-MM-DD) of the most recent completed tuning; refreshed when a TUNE service order completes.
      - name: pitch_deviation_cents
        type: number
        source: computed
        default: null
        description: Signed cents deviation from target_pitch_hz recorded by the most recent pitch assessment.
      - name: raw_pitch_tier
        type: enum
        source: computed
        default: null
        constraints: "one of TIER_0, TIER_1, TIER_2, TIER_3"
        description: Band of abs(pitch_deviation_cents) before the overdue bump.
      - name: pitch_raise_tier
        type: enum
        source: computed
        default: null
        constraints: "one of TIER_0, TIER_1, TIER_2, TIER_3"
        description: Effective tier after the overdue bump; drives service composition, duration and quote line count.
      - name: planned_visit_count
        type: integer
        source: computed
        default: 1
        description: Visits a tune needs at the effective tier (PITCH_TIER_VISIT_COUNT_* by tier).
      - name: condition_status
        type: enum
        source: system
        default: NEEDS_ASSESSMENT
        constraints: "one of NEEDS_ASSESSMENT, SERVICEABLE, NEEDS_REGULATION, NEEDS_VOICING, REBUILD_REQUIRED, RESTORED"
        description: Mechanical-condition axis; gates which service types may be quoted.
      - name: custody_status
        type: enum
        source: system
        default: AT_CLIENT_SITE
        constraints: "one of AT_CLIENT_SITE, IN_TRANSIT, IN_SHOP, SHOWROOM_FLOOR, SOLD"
        description: Physical-custody axis; advances independently of condition_status but constrains it.
      - name: unauthorized_move_flag
        type: boolean
        source: computed
        default: false
        description: Set true when custody moved to IN_TRANSIT without an authorizing MoveJob; voids active warranties.
      - name: tuning_cycle_interval_days
        type: integer
        source: computed
        default: null
        description: Output of calculation tuning_cycle_interval; recomputed whenever a TuningRecall is created for this instrument.

  - name: TuningRecall
    parent: null
    common_fields: true
    fields:
      - name: instrument_id
        type: string
        source: input
        description: "FK -> Instrument.id; the instrument whose cycle this recall tracks."
      - name: cycle_start_date
        type: string
        source: input
        description: ISO date the cycle starts from (normally the last completed tuning date).
      - name: interval_days
        type: integer
        source: computed
        description: Snapshot of the instrument's tuning_cycle_interval_days at recall creation.
      - name: due_date
        type: string
        source: computed
        description: cycle_start_date plus interval_days, as an ISO date.
      - name: days_overdue
        type: integer
        source: computed
        default: 0
        description: max(0, logical clock date minus due_date) in whole days, refreshed by the daily sweep.
      - name: overdue_tier
        type: enum
        source: computed
        default: ON_TIME
        constraints: "one of ON_TIME, OVERDUE_T1, OVERDUE_T2, LAPSED_TIER"
        description: Band of days_overdue; OVERDUE_T2 and LAPSED_TIER bump the instrument's pitch tier.
      - name: status
        type: enum
        source: system
        default: PENDING
        constraints: "one of PENDING, NOTIFIED, SCHEDULED, FULFILLED, LAPSED"
        description: Recall lifecycle; SCHEDULED can fall back to NOTIFIED when its appointment is cancelled.
      - name: notified_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant the client was notified.

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: Technician name.
      - name: certification_level
        type: enum
        source: input
        constraints: "one of APPRENTICE, JOURNEYMAN, MASTER"
        description: Ranked by TECH_CERT_RANK_*; gates which service types this technician may perform.
      - name: move_certified
        type: boolean
        source: input
        default: false
        description: Required to be true to lead a move of a CONCERT_GRAND or any crane move.
      - name: zone_codes
        type: array
        source: input
        constraints: "non-empty array of ZONE_A / ZONE_B / ZONE_C"
        description: Zones this technician serves; a location outside them is rejected at booking.
      - name: daily_capacity_minutes
        type: integer
        source: input
        default: 480
        constraints: "integer 60..960"
        description: Default capacity copied onto every RouteDay created for this technician.
      - name: status
        type: enum
        source: system
        default: ACTIVE
        constraints: "one of ACTIVE, INACTIVE"
        description: INACTIVE technicians cannot receive new route days or appointments.

  - name: RouteDay
    parent: null
    common_fields: true
    fields:
      - name: technician_id
        type: string
        source: input
        description: "FK -> Technician.id; whose day this is."
      - name: service_date
        type: string
        source: input
        description: ISO date (YYYY-MM-DD) the route covers.
      - name: capacity_minutes
        type: integer
        source: input
        default: 480
        constraints: "integer 60..960"
        description: Minutes available; defaults from the technician's daily_capacity_minutes when omitted.
      - name: committed_minutes
        type: integer
        source: computed
        default: 0
        description: Sum of total_block_minutes over this day's SCHEDULED or CONFIRMED appointments.
      - name: stop_count
        type: integer
        source: computed
        default: 0
        description: Count of this day's SCHEDULED or CONFIRMED appointments.
      - name: status
        type: enum
        source: system
        default: OPEN
        constraints: "one of OPEN, LOCKED, DISPATCHED"
        description: OPEN accepts bookings, LOCKED freezes them, DISPATCHED is terminal; LOCKED can revert to OPEN.

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: instrument_id
        type: string
        source: input
        description: "FK -> Instrument.id; the instrument to be serviced."
      - name: route_day_id
        type: string
        source: input
        description: "FK -> RouteDay.id; the technician-day this stop belongs to."
      - name: location_id
        type: string
        source: input
        description: "FK -> Location.id; where the stop happens."
      - name: service_order_id
        type: string
        source: input
        default: null
        description: "FK -> ServiceOrder.id; optional link to the order this visit executes."
      - name: tuning_recall_id
        type: string
        source: input
        default: null
        description: "FK -> TuningRecall.id; optional link to the recall this visit fulfils."
      - name: service_type
        type: enum
        source: input
        constraints: "one of TUNE, PITCH_RAISE, REGULATE, VOICE, REBUILD"
        description: What the visit performs; drives service_minutes and estimated_price_cents.
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: Start instant of the stop; its date must equal the route day's service_date.
      - name: service_minutes
        type: integer
        source: computed
        description: Output of calculation appointment_service_minutes.
      - name: travel_buffer_minutes
        type: integer
        source: computed
        description: Output of calculation appointment_travel_buffer.
      - name: total_block_minutes
        type: integer
        source: computed
        description: service_minutes plus travel_buffer_minutes; the quantity route capacity consumes.
      - name: same_address_chained
        type: boolean
        source: computed
        default: false
        description: True when an earlier SCHEDULED or CONFIRMED stop on the same route day has the same Location.address_key.
      - name: estimated_price_cents
        type: integer
        source: computed
        description: Output of calculation appointment_estimated_price, including the same-address discount.
      - name: cancellation_fee_cents
        type: integer
        source: computed
        default: 0
        description: Fee assessed when this appointment is cancelled; 0 while not cancelled.
      - name: reschedule_count
        type: integer
        source: computed
        default: 0
        description: Number of successful reschedules; capped at RESCHEDULE_LIMIT.
      - name: scheduling_status
        type: enum
        source: system
        default: REQUESTED
        constraints: "one of REQUESTED, SCHEDULED, CONFIRMED, RESCHEDULED, CANCELLED"
        description: Booking axis; RESCHEDULED immediately re-enters SCHEDULED within the same request.
      - name: fulfillment_status
        type: enum
        source: system
        default: PENDING
        constraints: "one of PENDING, EN_ROUTE, IN_PROGRESS, COMPLETED, NO_SHOW, ABORTED"
        description: Execution axis; advances independently of scheduling_status but is gated by it.

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - name: instrument_id
        type: string
        source: input
        description: "FK -> Instrument.id; the instrument being quoted."
      - name: client_id
        type: string
        source: computed
        description: "FK -> Client.id; copied from the instrument's owner at creation."
      - name: supersedes_quote_id
        type: string
        source: computed
        default: null
        description: "FK -> Quote.id; set on a re-issued quote to point at the quote it replaced."
      - name: service_type
        type: enum
        source: input
        constraints: "one of TUNE, PITCH_RAISE, REGULATE, VOICE, REBUILD"
        description: Service class being quoted.
      - name: version_number
        type: integer
        source: system
        default: 1
        description: Quote-chain version; a re-issue mints version_number + 1 on a NEW row.
      - name: line_count
        type: integer
        source: computed
        description: Number of priced lines; 2 when a TUNE quote auto-adds a PITCH_RAISE line, otherwise 1.
      - name: base_price_cents
        type: integer
        source: computed
        description: Sum of the undiscounted line bases.
      - name: line_discount_cents
        type: integer
        source: computed
        description: base_price_cents minus the sum of the per-line rounded net amounts.
      - name: zone_surcharge_cents
        type: integer
        source: computed
        description: Zone surcharge for the instrument's current location.
      - name: subtotal_cents
        type: integer
        source: computed
        description: Sum of per-line net amounts plus zone_surcharge_cents.
      - name: loyalty_discount_cents
        type: integer
        source: computed
        description: Loyalty discount keyed on subtotal_cents (never on total_cents).
      - name: total_cents
        type: integer
        source: computed
        description: subtotal_cents minus loyalty_discount_cents; becomes ServiceOrder.contract_total_cents.
      - name: deposit_required_cents
        type: integer
        source: computed
        description: Output of calculation deposit_required.
      - name: deposit_variant
        type: enum
        source: computed
        constraints: "one of PERCENT_OF_CONTRACT, FLAT_MINIMUM, NET_TERMS"
        description: Which deposit branch produced deposit_required_cents.
      - name: pricing_variant
        type: enum
        source: computed
        constraints: "one of RETAIL, DEALER_NET, INSTITUTIONAL"
        description: Which discount percentage applied to every line.
      - name: issued_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant the quote was issued.
      - name: expires_at
        type: datetime
        source: computed
        default: null
        description: issued_at plus QUOTE_VALID_DAYS; null while DRAFT.
      - name: status
        type: enum
        source: system
        default: DRAFT
        constraints: "one of DRAFT, ISSUED, APPROVED, DECLINED, EXPIRED, SUPERSEDED"
        description: Quote lifecycle; an expired quote is never mutated back, it is re-issued as a new row.

  - name: ServiceOrder
    parent: null
    common_fields: true
    fields:
      - name: quote_id
        type: string
        source: input
        description: "FK -> Quote.id; the APPROVED quote this order realises."
      - name: instrument_id
        type: string
        source: computed
        description: "FK -> Instrument.id; copied from the quote."
      - name: client_id
        type: string
        source: computed
        description: "FK -> Client.id; copied from the quote; re-pointed to the buyer when a consignment sale transfers the order."
      - name: assigned_technician_id
        type: string
        source: input
        default: null
        description: "FK -> Technician.id; who performs the work."
      - name: service_type
        type: enum
        source: computed
        constraints: "one of TUNE, PITCH_RAISE, REGULATE, VOICE, REBUILD"
        description: Copied from the quote.
      - name: contract_total_cents
        type: integer
        source: computed
        description: Copied from Quote.total_cents at creation and never re-derived.
      - name: billed_cents
        type: integer
        source: computed
        default: 0
        description: Sum of ACCEPTED milestone amounts.
      - name: unbilled_cents
        type: integer
        source: computed
        description: contract_total_cents minus billed_cents.
      - name: deposit_held_cents
        type: integer
        source: computed
        default: 0
        description: Copied from Quote.deposit_required_cents at creation.
      - name: deposit_applied_cents
        type: integer
        source: computed
        default: 0
        description: Portion of the deposit consumed by accepted milestones.
      - name: deposit_refunded_cents
        type: integer
        source: computed
        default: 0
        description: Portion of the deposit returned to the client.
      - name: deposit_forfeited_cents
        type: integer
        source: computed
        default: 0
        description: Portion of the deposit absorbed by a cancellation fee.
      - name: estimated_minutes
        type: integer
        source: computed
        description: Output of calculation service_order_duration.
      - name: visit_plan_variant
        type: enum
        source: computed
        constraints: "one of SINGLE_VISIT, SPLIT_VISIT"
        description: Which duration variant produced estimated_minutes.
      - name: started_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant work started.
      - name: completed_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant work completed.
      - name: status
        type: enum
        source: system
        default: PENDING
        constraints: "one of PENDING, IN_PROGRESS, ON_HOLD, COMPLETED, CANCELLED, VOIDED_BY_REBUILD"
        description: Order lifecycle; ON_HOLD is re-entrant back into IN_PROGRESS.

  - name: Milestone
    parent: null
    common_fields: true
    fields:
      - name: service_order_id
        type: string
        source: input
        description: "FK -> ServiceOrder.id; the order this milestone bills against."
      - name: sequence_index
        type: integer
        source: computed
        description: 1-based position; a milestone may only be released when all lower indices are ACCEPTED.
      - name: label
        type: string
        source: computed
        description: Stage name minted from the order's service type.
      - name: amount_cents
        type: integer
        source: computed
        description: Waterfall share of contract_total_cents; the last index absorbs the remainder.
      - name: rejection_count
        type: integer
        source: computed
        default: 0
        description: Times this milestone was rejected; capped at MILESTONE_REJECTION_RETRY_LIMIT.
      - name: released_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the operator who released it; used by the segregation-of-duties check.
      - name: released_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of release.
      - name: accepted_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of acceptance.
      - name: status
        type: enum
        source: system
        default: PENDING
        constraints: "one of PENDING, READY, RELEASED, ACCEPTED, REJECTED, CANCELLED"
        description: Billing lifecycle; REJECTED returns to READY, up to the retry cap.

  - name: MoveJob
    parent: null
    common_fields: true
    fields:
      - name: instrument_id
        type: string
        source: input
        description: "FK -> Instrument.id; the instrument being moved."
      - name: client_id
        type: string
        source: computed
        description: "FK -> Client.id; copied from the instrument's owner."
      - name: origin_location_id
        type: string
        source: input
        description: "FK -> Location.id; pickup address."
      - name: destination_location_id
        type: string
        source: input
        description: "FK -> Location.id; delivery address."
      - name: move_technician_id
        type: string
        source: input
        default: null
        description: "FK -> Technician.id; crew lead."
      - name: distance_miles
        type: number
        source: input
        constraints: "number > 0"
        description: Road miles for this move; selects the distance band.
      - name: distance_band
        type: enum
        source: computed
        constraints: "one of LOCAL, REGIONAL, LONG_HAUL"
        description: Band derived from distance_miles.
      - name: distance_variant
        type: enum
        source: computed
        constraints: "one of FLAT_LOCAL, PER_MILE, LONG_HAUL_FLAT"
        description: Which distance formula produced distance_cents.
      - name: stair_flights_total
        type: integer
        source: computed
        description: Sum of the two locations' effective stair flights (a service elevator contributes 0).
      - name: crane_required
        type: boolean
        source: input
        default: false
        description: Whether a crane or hoist is used.
      - name: climate_controlled_transport
        type: boolean
        source: input
        default: false
        description: Whether a climate-controlled truck is used.
      - name: scheduled_window_start_utc
        type: datetime
        source: input
        description: Start of the move window.
      - name: scheduled_window_end_utc
        type: datetime
        source: input
        description: End of the move window; must be strictly after the start.
      - name: base_cents
        type: integer
        source: computed
        description: Class base rate.
      - name: stair_cents
        type: integer
        source: computed
        description: Stair component - per-flight or the flat bundle.
      - name: crane_cents
        type: integer
        source: computed
        description: Crane component.
      - name: distance_cents
        type: integer
        source: computed
        description: Distance component per the selected variant.
      - name: climate_cents
        type: integer
        source: computed
        description: Climate-controlled transport component.
      - name: total_cents
        type: integer
        source: computed
        description: Sum of the five components.
      - name: status
        type: enum
        source: system
        default: DRAFT
        constraints: "one of DRAFT, SCHEDULED, DISPATCHED, IN_TRANSIT, DELIVERED, CANCELLED"
        description: Move lifecycle; DELIVERED and CANCELLED are terminal.

  - name: ClimateReading
    parent: null
    common_fields: false
    fields:
      - name: location_id
        type: string
        source: input
        description: "FK -> Location.id; where the reading was taken."
      - name: recorded_at_utc
        type: datetime
        source: input
        description: Instant of the reading; must not be after the logical clock.
      - name: relative_humidity_pct
        type: number
        source: input
        constraints: "number in [0.0, 100.0]"
        description: Relative humidity percentage.
      - name: temperature_f
        type: number
        source: input
        constraints: "number in [-20.0, 140.0]"
        description: Temperature in Fahrenheit; recorded but not used by any gate.
      - name: in_band
        type: boolean
        source: computed
        description: True when relative_humidity_pct is within the inclusive RH band.

  - name: Warranty
    parent: null
    common_fields: true
    fields:
      - name: service_order_id
        type: string
        source: input
        description: "FK -> ServiceOrder.id; the completed order this warranty covers."
      - name: instrument_id
        type: string
        source: computed
        description: "FK -> Instrument.id; copied from the order."
      - name: client_id
        type: string
        source: computed
        description: "FK -> Client.id; current beneficiary; re-pointed to the buyer on a consignment sale."
      - name: service_type
        type: enum
        source: computed
        constraints: "one of TUNE, PITCH_RAISE, REGULATE, VOICE, REBUILD"
        description: Copied from the order; selects the term length.
      - name: term_days
        type: integer
        source: computed
        description: WARRANTY_TERM_DAYS_* for the service type, prorated on transfer.
      - name: start_date
        type: string
        source: computed
        description: ISO date the term starts (the order's completion date).
      - name: end_date
        type: string
        source: computed
        description: start_date plus term_days as an ISO date.
      - name: covered_price_cents
        type: integer
        source: computed
        description: ServiceOrder.contract_total_cents at completion; the base for a prorated credit.
      - name: claim_count
        type: integer
        source: computed
        default: 0
        description: Claims filed against this warranty; capped at WARRANTY_CLAIM_LIMIT.
      - name: transferred_from_client_id
        type: string
        source: system
        default: null
        description: Prior beneficiary retained for audit only; never used as a lookup key or decision input.
      - name: void_reason
        type: enum
        source: system
        default: null
        constraints: "one of UNAUTHORIZED_MOVE, CLIMATE_OUT_OF_BAND, TUNING_CYCLE_LAPSED, MANUAL"
        description: Why the warranty was voided; null unless status is VOIDED.
      - name: status
        type: enum
        source: system
        default: ACTIVE
        constraints: "one of ACTIVE, VOIDED, EXPIRED, TRANSFERRED"
        description: Warranty lifecycle; TRANSFERRED warranties keep covering the instrument under the new owner.

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: warranty_id
        type: string
        source: input
        description: "FK -> Warranty.id; the warranty being claimed against."
      - name: service_order_id
        type: string
        source: computed
        description: "FK -> ServiceOrder.id; copied from the warranty."
      - name: reported_issue
        type: string
        source: input
        description: Free-text description of the defect.
      - name: elapsed_fraction
        type: number
        source: computed
        description: Days elapsed since warranty start divided by term_days, clamped to [0.0, 1.0], rounded to 4 decimals.
      - name: resolution_variant
        type: enum
        source: computed
        constraints: "one of FREE_RESERVICE, PRORATED_CREDIT"
        description: Selected at submission from elapsed_fraction against WARRANTY_PRORATION_THRESHOLD.
      - name: credit_cents
        type: integer
        source: computed
        default: 0
        description: Provisional prorated credit; 0 under the FREE_RESERVICE variant.
      - name: adjudicated_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the adjudicator; must differ from the released_by_user_id of the covered order's milestones.
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        constraints: "one of SUBMITTED, UNDER_REVIEW, APPROVED_RESERVICE, APPROVED_CREDIT, DENIED"
        description: Claim lifecycle; the three outcomes are terminal.

  - name: ConsignmentAgreement
    parent: null
    common_fields: true
    fields:
      - name: instrument_id
        type: string
        source: input
        description: "FK -> Instrument.id; the consigned instrument."
      - name: consignor_client_id
        type: string
        source: input
        description: "FK -> Client.id; the owner placing the instrument on consignment."
      - name: buyer_client_id
        type: string
        source: input
        default: null
        description: "FK -> Client.id; set when the sale is recorded."
      - name: reserve_price_cents
        type: integer
        source: input
        constraints: "integer >= 50000 (CONSIGNMENT_MIN_RESERVE_CENTS)"
        description: Reserve price; selects the proceeds-split variant and the sale floor.
      - name: advanced_restoration_cents
        type: integer
        source: computed
        default: 0
        description: Shop money advanced on restoration for this instrument; recovered off the top of proceeds.
      - name: start_date
        type: string
        source: computed
        description: ISO date the agreement activated.
      - name: expires_at
        type: datetime
        source: computed
        default: null
        description: Activation instant plus CONSIGNMENT_TERM_DAYS.
      - name: sale_price_cents
        type: integer
        source: input
        default: null
        description: Recorded sale price; null until sold.
      - name: split_variant
        type: enum
        source: computed
        default: null
        constraints: "one of AT_OR_BELOW_RESERVE, ABOVE_RESERVE"
        description: Which commission formula applied.
      - name: advance_recovered_cents
        type: integer
        source: computed
        default: 0
