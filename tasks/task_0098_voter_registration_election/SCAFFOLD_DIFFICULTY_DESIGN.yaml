            - call: "POST /elections/${e_id}/transition"
              payload: { target_status: "REGISTRATION_OPEN" }
              as: ElectionAdmin
            - call: "POST /elections/${e_id}/transition"
              payload: { target_status: "VOTING_OPEN" }
              as: ElectionAdmin
            - call: "POST /elections/${e_id}/transition"
              payload: { target_status: "POLLS_CLOSED" }
              as: ElectionAdmin
          trigger:
            - call: "POST /elections/${e_id}/transition"
