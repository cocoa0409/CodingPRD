              payload: { bridge_program_id: "${bp_id}", kind: "DEPARTING_TAX", amount_cents: 500000, due_date: "2026-10-01T00:00:00Z" }
              as: Coordinator
          trigger:
            - call: "POST /knock/interim-loans/${loan_id}/repayments"
              payload: { amount_cents: 1, expected_interim_loan_version: "${loan_v}" }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { e1: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE — the loan is still ORIGINATED (no repayment transition exists from ORIGINATED), so the priority-11 state check fires before the priority-26 ERR_CARRYING_COST_UNPAID that the 500000 unpaid carrying cost would also raise"
      - name: safety_over_constraint_appraisal
        grounds:
          - validations[priority=19]
          - validations[priority=30]
          - errors[ERR_REGULATORY_PRICE_FLOOR]
          - errors[ERR_APPRAISAL_STALE]
        distinguishing_aspect: |
          The `business_safety` vs `business_constraint` error-category pair: a backup offer priced
          below the regulatory floor on a stale appraisal fails the priority-18 safety check first,
          so ERR_REGULATORY_PRICE_FLOOR wins over ERR_APPRAISAL_STALE.
        test_recipe:
          setup:
            - "A program P is in occupancy_status DEPARTING_LISTED with departing property D appraised 50000000, condition_grade C, appraisal_date 2026-01-01 (stale against the 2026-09-01 clock)."
            - "The regulatory floor for D is max(44000000*0.955, 42500000) == 42500000, so an offer of 42000000 violates it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Coordinator
