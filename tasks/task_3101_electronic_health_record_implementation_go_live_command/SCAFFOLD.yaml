  - { method: GET,   path: "/interface-channels", description: "List interface channels filtered by program", roles: [ImplementationAnalyst, InterfaceEngineer], code: 200, input: ["ehr_implementation_id?", "channel_type?", "status?"], output: "InterfaceChannel[]", side_effects: [] }
  - { method: GET,   path: "/interface-channels/{id}", description: "Get one interface channel", roles: [ImplementationAnalyst, InterfaceEngineer], code: 200, input: [], output: InterfaceChannel, side_effects: [] }
  - { method: POST,  path: "/interface-channels/{id}/begin-build", description: "Begin channel build", roles: [InterfaceEngineer], code: 200, input: [], output: InterfaceChannel, side_effects: ["status -> BUILDING"] }
  - { method: POST,  path: "/interface-channels/{id}/begin-validation", description: "Begin message validation", roles: [InterfaceEngineer], code: 200, input: [], output: InterfaceChannel, side_effects: ["status -> IN_MESSAGE_VALIDATION"] }
  - { method: POST,  path: "/interface-channels/{id}/complete-validation", description: "Close channel validation", roles: [InterfaceEngineer], code: 200, input: [], output: InterfaceChannel, side_effects: ["status -> VALIDATED"] }
  - { method: POST,  path: "/interface-channels/{id}/return-to-build", description: "Return a failed channel to build", roles: [InterfaceEngineer], code: 200, input: [], output: InterfaceChannel, side_effects: ["status -> BUILDING", "validated_message_count -> 0", "rejected_message_count -> 0"] }

  # --- InterfaceMessage ----------------------------------------------------
  - { method: POST,  path: "/interface-channels/{id}/messages", description: "Receive an interface message", roles: [InterfaceEngineer], code: 201, input: [message_code, direction, sent_utc], output: InterfaceMessage, side_effects: ["validation_status -> RECEIVED", "received_utc -> clock", "latency_minutes -> (received_utc - sent_utc) minutes"] }
  - { method: GET,   path: "/interface-channels/{id}/messages", description: "List a channel's messages", roles: [ImplementationAnalyst, InterfaceEngineer], code: 200, input: ["validation_status?"], output: "InterfaceMessage[]", side_effects: [] }
  - { method: GET,   path: "/interface-messages", description: "List messages filtered by channel", roles: [ImplementationAnalyst, InterfaceEngineer], code: 200, input: ["interface_channel_id?", "ehr_implementation_id?", "validation_status?"], output: "InterfaceMessage[]", side_effects: [] }
  - { method: GET,   path: "/interface-messages/{id}", description: "Get one interface message", roles: [ImplementationAnalyst, InterfaceEngineer], code: 200, input: [], output: InterfaceMessage, side_effects: [] }
  - { method: POST,  path: "/interface-messages/{id}/validate", description: "Validate a received message", roles: [InterfaceEngineer], code: 200, input: [], output: InterfaceMessage, side_effects: ["validation_status -> VALIDATED", "recompute InterfaceChannel.validated_message_count"] }

  # --- CutoverTask ---------------------------------------------------------
  - { method: POST,  path: "/facilities/{id}/cutover-tasks", description: "Add a cutover plan step", roles: [CutoverLead], code: 201, input: [task_class, sequence_index, planned_start_utc, planned_end_utc], output: CutoverTask, side_effects: ["status -> PLANNED", "duration_minutes -> (planned_end_utc - planned_start_utc) in minutes"] }
  - { method: GET,   path: "/facilities/{id}/cutover-tasks", description: "List a facility's cutover tasks", roles: [ImplementationAnalyst, CutoverLead], code: 200, input: ["task_class?", "status?"], output: "CutoverTask[]", side_effects: [] }
  - { method: GET,   path: "/cutover-tasks", description: "List cutover tasks filtered by facility", roles: [ImplementationAnalyst, CutoverLead], code: 200, input: ["facility_id?", "ehr_implementation_id?", "task_class?", "status?"], output: "CutoverTask[]", side_effects: [] }
  - { method: GET,   path: "/cutover-tasks/{id}", description: "Get one cutover task", roles: [ImplementationAnalyst, CutoverLead], code: 200, input: [], output: CutoverTask, side_effects: [] }
  - { method: POST,  path: "/cutover-tasks/{id}/start", description: "Start a cutover step", roles: [CutoverLead], code: 200, input: [], output: CutoverTask, side_effects: ["status -> IN_PROGRESS"] }
  - { method: POST,  path: "/cutover-tasks/{id}/complete", description: "Complete a cutover step", roles: [CutoverLead], code: 200, input: [], output: CutoverTask, side_effects: ["status -> COMPLETE"] }
  - { method: POST,  path: "/cutover-tasks/{id}/skip", description: "Skip a non-essential cutover step", roles: [CutoverLead], code: 200, input: [], output: CutoverTask, side_effects: ["status -> SKIPPED"] }
  - { method: POST,  path: "/cutover-tasks/{id}/block", description: "Block a cutover step", roles: [CutoverLead], code: 200, input: [block_reason], output: CutoverTask, side_effects: ["status -> BLOCKED"] }
  - { method: POST,  path: "/cutover-tasks/{id}/unblock", description: "Unblock a cutover step", roles: [CutoverLead], code: 200, input: [], output: CutoverTask, side_effects: ["status -> IN_PROGRESS"] }

  # --- CommandCenterTicket -------------------------------------------------
  - { method: POST,  path: "/command-center-tickets", description: "Raise a command-center ticket", roles: [CommandCenterLead, TriageCommander], code: 201, input: [facility_id, "department_id?", target_ref, severity, at_the_elbow_zone, "linked_test_defect_id?"], output: CommandCenterTicket, side_effects: ["triage_state -> REPORTED", "reported_utc -> clock", "resolution_sla_minutes -> command_center_sla_minutes output"] }
  - { method: GET,   path: "/command-center-tickets", description: "List command-center tickets", roles: [CommandCenterLead, TriageCommander, ImplementationAnalyst], code: 200, input: ["ehr_implementation_id?", "facility_id?", "department_id?", "linked_test_defect_id?", "severity?", "triage_state?", "limit?", "offset?"], output: "CommandCenterTicket[]", side_effects: [] }
  - { method: GET,   path: "/command-center-tickets/{id}", description: "Get one ticket", roles: [CommandCenterLead, TriageCommander, ImplementationAnalyst], code: 200, input: [], output: CommandCenterTicket, side_effects: [] }
  - { method: POST,  path: "/command-center-tickets/{id}/triage", description: "Triage a reported ticket", roles: [TriageCommander], code: 200, input: [], output: CommandCenterTicket, side_effects: ["triage_state -> TRIAGED"] }
  - { method: POST,  path: "/command-center-tickets/{id}/begin-resolution", description: "Begin ticket resolution", roles: [TriageCommander], code: 200, input: [], output: CommandCenterTicket, side_effects: ["triage_state -> IN_RESOLUTION"] }
  - { method: POST,  path: "/command-center-tickets/{id}/resolve", description: "Resolve a ticket", roles: [TriageCommander], code: 200, input: [], output: CommandCenterTicket, side_effects: ["triage_state -> RESOLVED"] }

  # --- StaffingShift -------------------------------------------------------
  - { method: POST,  path: "/staffing-shifts", description: "Schedule a command-center shift", roles: [CommandCenterLead], code: 201, input: [staff_id, facility_id, support_role, start_utc, end_utc], output: StaffingShift, side_effects: ["status -> SCHEDULED", "handoff_buffer_minutes -> 30"] }
  - { method: GET,   path: "/staffing-shifts", description: "List staffing shifts", roles: [CommandCenterLead, ImplementationAnalyst], code: 200, input: ["ehr_implementation_id?", "staff_id?", "facility_id?", "support_role?", "status?"], output: "StaffingShift[]", side_effects: [] }
  - { method: GET,   path: "/staffing-shifts/{id}", description: "Get one staffing shift", roles: [CommandCenterLead, ImplementationAnalyst], code: 200, input: [], output: StaffingShift, side_effects: [] }
  - { method: POST,  path: "/staffing-shifts/{id}/activate", description: "Activate a shift at its start", roles: [CommandCenterLead], code: 200, input: [], output: StaffingShift, side_effects: ["status -> ACTIVE"] }
  - { method: POST,  path: "/staffing-shifts/{id}/complete", description: "Complete a shift", roles: [CommandCenterLead], code: 200, input: [], output: StaffingShift, side_effects: ["status -> COMPLETED"] }
  - { method: POST,  path: "/staffing-shifts/{id}/reassign", description: "Reassign a future shift", roles: [CommandCenterLead], code: 200, input: [], output: StaffingShift, side_effects: ["status -> REASSIGNED"] }

  # --- OptimizationBacklogItem ---------------------------------------------
  - { method: POST,  path: "/optimization-backlog-items", description: "Raise an optimization backlog item", roles: [OptimizationLead], code: 201, input: [department_id, title, effort_points, expected_ehr_implementation_version], output: OptimizationBacklogItem, side_effects: ["status -> NEW", "requested_epoch -> current_epoch_index", "increments EhrImplementation.version by 1"] }
  - { method: GET,   path: "/optimization-backlog-items", description: "List optimization items", roles: [OptimizationLead, ImplementationAnalyst], code: 200, input: ["department_id?", "ehr_implementation_id?", "status?"], output: "OptimizationBacklogItem[]", side_effects: [] }
  - { method: GET,   path: "/optimization-backlog-items/{id}", description: "Get one optimization item", roles: [OptimizationLead, ImplementationAnalyst], code: 200, input: [], output: OptimizationBacklogItem, side_effects: [] }
  - { method: POST,  path: "/optimization-backlog-items/{id}/triage", description: "Triage an optimization item", roles: [OptimizationLead], code: 200, input: [], output: OptimizationBacklogItem, side_effects: ["status -> TRIAGED"] }
  - { method: POST,  path: "/optimization-backlog-items/{id}/schedule", description: "Schedule an item into a release epoch", roles: [OptimizationLead], code: 200, input: [target_epoch], output: OptimizationBacklogItem, side_effects: ["status -> SCHEDULED", "scheduled_epoch -> optimization_release_allocation output"] }
  - { method: POST,  path: "/optimization-backlog-items/{id}/start", description: "Begin optimization work", roles: [OptimizationLead], code: 200, input: [], output: OptimizationBacklogItem, side_effects: ["status -> IN_PROGRESS"] }
  - { method: POST,  path: "/optimization-backlog-items/{id}/release", description: "Release an optimization item", roles: [OptimizationLead], code: 200, input: [], output: OptimizationBacklogItem, side_effects: ["status -> RELEASED"] }
  - { method: POST,  path: "/optimization-backlog-items/{id}/reject", description: "Reject an optimization item", roles: [OptimizationLead], code: 200, input: [], output: OptimizationBacklogItem, side_effects: ["status -> REJECTED"] }

  # --- test-driving endpoints ----------------------------------------------
  - { method: POST,  path: "/_clock/set_current_utc", description: "Set the logical clock. The server's startup default is 2026-09-01T00:00:00Z; before any call the clock reads exactly that instant and never falls back to wall-clock time.", roles: [ImplementationDirector], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock -> to_iso8601; all time-derived computed fields (aging_hours, latency, expiry, AR factors) follow"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID missing, or the role is not a declared §1.7 role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "the acting role is not listed in the endpoint's roles" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "the acting user already performed the segregated counterpart step (exam result vs trainer certification, go/no-go decision vs linked defect resolution)" }
  - { id: ERR_UNVERIFIED_TRAINER, http: 403, condition: "the ProficiencyExam proctor has no CredentialedTrainer row in status CERTIFIED for the exam's application_code" }
  # --- existence ---
  - { id: ERR_EHR_IMPLEMENTATION_NOT_FOUND, http: 404, condition: "no EhrImplementation matches the path id" }
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "no Facility matches the path id" }
  - { id: ERR_STAFF_NOT_FOUND, http: 404, condition: "no Staff matches the path id or the staff_id body field" }
  - { id: ERR_DEPARTMENT_NOT_FOUND, http: 404, condition: "no Department matches the path or body id, including an unresolvable polymorphic target_ref" }
  - { id: ERR_BUILD_ITEM_NOT_FOUND, http: 404, condition: "no SystemBuildItem matches the path id" }
  - { id: ERR_TEST_SCENARIO_NOT_FOUND, http: 404, condition: "no TestScenario matches the path id" }
  - { id: ERR_DEFECT_NOT_FOUND, http: 404, condition: "no TestDefect matches the path id or linked_test_defect_id" }
  - { id: ERR_CHANNEL_NOT_FOUND, http: 404, condition: "no InterfaceChannel matches the path id" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "no CommandCenterTicket matches the path id" }
  - { id: ERR_CONVERSION_BATCH_NOT_FOUND, http: 404, condition: "no DataConversionBatch matches the path id" }
  - { id: ERR_PATIENT_ORDER_NOT_FOUND, http: 404, condition: "no PatientOrder matches the path id" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "a required field is missing, a field type/enum is invalid, or a client-supplied system field is rejected" }
  - { id: ERR_BATCH_SIZE_INVALID, http: 400, condition: "DataConversionBatch.source_count or reconciled_count is negative or non-integer" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "the target resource is not in the from-state required by the transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "the target resource is already in a terminal state" }
  - { id: ERR_POSTURE_BLOCKS_OPERATION, http: 409, condition: "the owning EhrImplementation.readiness_posture is ROLLBACK_REQUIRED and the trigger is not a remediation trigger" }
  - { id: ERR_EPOCH_MISMATCH, http: 409, condition: "the DataConversionBatch.attempt_epoch differs from EhrImplementation.current_epoch_index" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "the supplied expected_<parent>_version does not equal the parent's current version" }
  # --- safety / constraints ---
  - { id: ERR_ORDER_NOT_RECONCILED, http: 422, condition: "a claim action is attempted while the PatientOrder.clinical_state is not RECONCILED" }
  - { id: ERR_PROCEDURE_CREDENTIAL_MISSING, http: 422, condition: "a PROCEDURE PatientOrder is reconciled by an actor without the charge-capture credential" }
  - { id: ERR_CUSTOMIZATION_LIMIT_EXCEEDED, http: 422, condition: "a LOCAL_CUSTOM SystemBuildItem with customization_risk_points > 40.00 advances without a remediation record" }
  - { id: ERR_DEFECT_BLOCKS_DEPARTMENT, http: 422, condition: "a department has an open SEV1/SEV2 build-and-test defect blocking facility validation or gate closure" }
  - { id: ERR_CHANNEL_NOT_VALIDATED, http: 422, condition: "an interface channel of the program is not VALIDATED at cutover readiness or validation finalization" }
  - { id: ERR_GO_LIVE_BLOCKED, http: 422, condition: "an open SEV1/SEV2 TestDefect exists at the go-live decision or facility stabilization" }
  - { id: ERR_DEFECT_SEVERITY_NOT_DEFERRABLE, http: 422, condition: "a SEV1 or SEV2 TestDefect was submitted for deferral" }
  - { id: ERR_TRAINER_OBSERVATION_INSUFFICIENT, http: 422, condition: "observation_hours is below the certification_level floor" }
  - { id: ERR_CLAIM_RESPONSE_INVALID, http: 422, condition: "claim_response is not compatible with the order's current billing_state" }
  - { id: ERR_PRIMARY_FACILITY_MISMATCH, http: 422, condition: "Staff.primary_facility_id differs from the facility referenced by the shift or ticket" }
  - { id: ERR_BALANCE_VARIANCE_EXCEEDED, http: 422, condition: "conversion_reconciliation_variance exceeds the payload_class cap" }
  - { id: ERR_INTERFACE_MESSAGE_INVALID, http: 422, condition: "message_code is not a member of VALID_MESSAGE_CODES for the owning channel_type" }
  - { id: ERR_INTERFACE_LATENCY_EXCEEDED, http: 422, condition: "InterfaceMessage.latency_minutes exceeds the owning channel's max_latency_minutes" }
  # --- temporal ---
  - { id: ERR_TRAINING_HOURS_INSUFFICIENT, http: 422, condition: "a TrainingAssignment is completed while completed_hours < required_hours" }
  - { id: ERR_PROFICIENCY_GATE_CLOSED, http: 422, condition: "a department gate is closed while proficiency_cleared_ratio < PROFICIENCY_GATE_PCT" }
  - { id: ERR_TEMPORAL_OVERLAP, http: 409, condition: "a new CutoverTask interval or StaffingShift interval overlaps an existing one after the handoff buffer is applied" }
  - { id: ERR_PRECEDING_STEP_INCOMPLETE, http: 409, condition: "a CutoverTask is started while an earlier-sequence_index task is not COMPLETE or SKIPPED" }
  - { id: ERR_RETEST_COOLDOWN_ACTIVE, http: 409, condition: "a proficiency retake or NO_SHOW is recorded before next_attempt_eligible_utc" }
  - { id: ERR_GO_LIVE_AFTER_TARGET, http: 422, condition: "the go-live decision instant exceeds go_live_target_utc plus the approved extension" }
  # --- capacity ---
  - { id: ERR_RELEASE_CAPACITY_EXCEEDED, http: 409, condition: "an OptimizationBacklogItem does not fit the target epoch's remaining release capacity and cannot overflow" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "two StaffingShift rows of the same staff or two AT_THE_ELBOW shifts at the same facility overlap" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ImplementationDirector
    description: "Program owner; controls program phase gates, go-live and archival; also the operational role that drives the logical clock"
    identity: "opaque"
    exclusive_operations: ["POST /ehr-implementations", "POST /ehr-implementations/{id}/start-build", "POST /ehr-implementations/{id}/start-validation", "POST /ehr-implementations/{id}/finalize-validation", "POST /ehr-implementations/{id}/execute-go-live", "POST /ehr-implementations/{id}/begin-optimization", "POST /ehr-implementations/{id}/archive", "POST /ehr-implementations/{id}/advance-epoch", "POST /facilities/{id}/mark-validated", "POST /_clock/set_current_utc"]
    shared_operations: ["GET /ehr-implementations", "GET /facilities", "GET /departments", "GET /staffs"]
  - name: ImplementationAnalyst
    description: "Read-only program analytics; computes and reviews readiness, conversion and stabilization reporting"
    identity: "opaque"
    exclusive_operations: []
    shared_operations: ["GET /ehr-implementations", "GET /facilities", "GET /departments", "GET /system-build-items", "GET /staffs", "GET /test-scenarios", "GET /test-defects", "GET /data-conversion-batches", "GET /patient-orders", "GET /interface-channels", "GET /cutover-tasks", "GET /command-center-tickets", "GET /staffing-shifts", "GET /optimization-backlog-items"]
  - name: BuildAnalyst
    description: "Builds and reworks departmental application configuration, and remediates defects"
    identity: "opaque"
    exclusive_operations: ["POST /departments", "POST /departments/{id}/complete-build", "POST /system-build-items", "POST /system-build-items/{id}/start-build", "POST /system-build-items/{id}/complete-build", "POST /system-build-items/{id}/rework", "POST /system-build-items/{id}/reset-to-draft", "POST /test-defects/{id}/begin-remediation", "POST /test-defects/{id}/resolve", "POST /facilities/{id}/configure-build"]
    shared_operations: ["GET /departments", "GET /system-build-items", "GET /test-defects", "GET /test-scenarios"]
  - name: TestLead
    description: "Owns integrated and charge-capture test cycles and defect triage/deferral/reopen"
    identity: "opaque"
    exclusive_operations: ["POST /system-build-items/{id}/start-testing", "POST /system-build-items/{id}/complete-validation", "POST /test-scenarios", "POST /test-scenarios/{id}/execute", "POST /test-scenarios/{id}/record-defect", "POST /test-defects/{id}/defer", "POST /test-defects/{id}/reopen"]
    shared_operations: ["GET /system-build-items", "GET /test-scenarios", "GET /test-defects"]
  - name: TrainingCoordinator
    description: "Runs role-based training, credentialed-trainer certification and proficiency gating"
    identity: "opaque"
    exclusive_operations: ["POST /staffs", "POST /staffs/{id}/issue-credential", "POST /staffs/{id}/reassign-training", "POST /staffs/{id}/training-assignments", "POST /training-assignments/{id}/complete", "POST /training-assignments/{id}/waive", "POST /staffs/{id}/credentialed-trainers", "POST /credentialed-trainers/{id}/certify", "POST /credentialed-trainers/{id}/revoke", "POST /credentialed-trainers/{id}/recertify", "POST /staffs/{id}/proficiency-exams", "POST /departments/{id}/begin-training", "POST /departments/{id}/close-proficiency-gate"]
    shared_operations: ["GET /staffs", "GET /training-assignments", "GET /credentialed-trainers", "GET /proficiency-exams", "GET /departments"]
  - name: CredentialedTrainer
    description: "A certified trainer who proctors and records proficiency exam outcomes; identity is the CredentialedTrainer row itself"
    identity: "entity_backed:CredentialedTrainer"
    exclusive_operations: ["POST /proficiency-exams/{id}/record-result", "POST /proficiency-exams/{id}/mark-no-show"]
    shared_operations: ["GET /proficiency-exams", "GET /credentialed-trainers"]
  - name: ConversionAnalyst
    description: "Loads and reconciles legacy data conversion batches and converts active patient orders"
    identity: "opaque"
    exclusive_operations: ["POST /facilities/{id}/data-conversion-batches", "POST /data-conversion-batches/{id}/begin-validation", "POST /data-conversion-batches/{id}/load", "POST /data-conversion-batches/{id}/reconcile", "POST /data-conversion-batches/{id}/rollback", "POST /facilities/{id}/patient-orders"]
    shared_operations: ["GET /data-conversion-batches", "GET /patient-orders", "GET /facilities"]
  - name: OrderReconciler
    description: "Reconciles converted orders against paper backfill during cutover"
    identity: "opaque"
    exclusive_operations: ["POST /patient-orders/{id}/reconcile", "POST /patient-orders/{id}/backfill-paper-order"]
    shared_operations: ["GET /patient-orders", "GET /cutover-tasks"]
  - name: RevenueCycleAnalyst
    description: "Posts charges and manages claim submission and payer responses"
    identity: "opaque"
    exclusive_operations: ["POST /patient-orders/{id}/post-charge", "POST /patient-orders/{id}/submit-claim", "POST /patient-orders/{id}/record-claim-response", "POST /patient-orders/{id}/reopen-claim"]
    shared_operations: ["GET /patient-orders", "GET /facilities"]
  - name: InterfaceEngineer
    description: "Builds laboratory, imaging, pharmacy and device interfaces and validates messages"
    identity: "opaque"
    exclusive_operations: ["POST /interface-channels", "POST /interface-channels/{id}/begin-build", "POST /interface-channels/{id}/begin-validation", "POST /interface-channels/{id}/complete-validation", "POST /interface-channels/{id}/return-to-build", "POST /interface-channels/{id}/messages", "POST /interface-messages/{id}/validate"]
    shared_operations: ["GET /interface-channels", "GET /interface-messages"]
  - name: CutoverLead
    description: "Owns the cutover plan, downtime procedures and go/no-go decision"
    identity: "opaque"
    exclusive_operations: ["POST /facilities/{id}/cutover-tasks", "POST /cutover-tasks/{id}/start", "POST /cutover-tasks/{id}/complete", "POST /cutover-tasks/{id}/skip", "POST /cutover-tasks/{id}/block", "POST /cutover-tasks/{id}/unblock", "POST /facilities/{id}/complete-cutover-dress-rehearsal"]
    shared_operations: ["GET /cutover-tasks", "GET /facilities", "GET /patient-orders"]
  - name: CommandCenterLead
    description: "Staffs and runs the go-live command center and stabilizes live facilities"
    identity: "opaque"
    exclusive_operations: ["POST /ehr-implementations/{id}/activate-command-center", "POST /facilities/{id}/stabilize", "POST /staffing-shifts", "POST /staffing-shifts/{id}/activate", "POST /staffing-shifts/{id}/complete", "POST /staffing-shifts/{id}/reassign", "POST /command-center-tickets"]
    shared_operations: ["GET /staffing-shifts", "GET /command-center-tickets", "GET /facilities"]
  - name: TriageCommander
    description: "Triages command-center issues by severity and drives them to resolution"
    identity: "opaque"
    exclusive_operations: ["POST /command-center-tickets/{id}/triage", "POST /command-center-tickets/{id}/begin-resolution", "POST /command-center-tickets/{id}/resolve"]
    shared_operations: ["GET /command-center-tickets", "GET /test-defects"]
  - name: OptimizationLead
    description: "Curates and schedules the post-live optimization backlog"
    identity: "opaque"
    exclusive_operations: ["POST /optimization-backlog-items", "POST /optimization-backlog-items/{id}/triage", "POST /optimization-backlog-items/{id}/schedule", "POST /optimization-backlog-items/{id}/start", "POST /optimization-backlog-items/{id}/release", "POST /optimization-backlog-items/{id}/reject"]
    shared_operations: ["GET /optimization-backlog-items", "GET /departments"]
