      - name: license_reject_resubmit_verify_cycle_swaps_sod_counterparty
        grounds:
          - state_machines.TherapistLicense
          - state_machines.TherapistLicense.PENDING_REVIEW_to_REJECTED
          - state_machines.TherapistLicense.REJECTED_to_PENDING_REVIEW
          - state_machines.TherapistLicense.PENDING_REVIEW_to_VERIFIED
          - entities.TherapistLicense.fields.submitted_by_user_id
          - entities.TherapistLicense.fields.reviewed_by_user_id
          - validations[priority=11]
          - endpoints.POST_/therapist-licenses/{id}/resubmit
        distinguishing_aspect: |
          Cyclic shape with a state-carried authorisation flip: the licence walks
          PENDING_REVIEW -> REJECTED -> PENDING_REVIEW -> VERIFIED, and because
          resubmit rewrites submitted_by_user_id, the segregation-of-duties
          counterparty INVERTS across the loop — co-2 could review on the first
          pass and cannot on the second, while co-1 could not on the first pass
          and can on the second. A same-state replay is therefore not idempotent
          in the permission sense, which a linear machine cannot express. The
          other instance in this rule exercises the parallel Appointment shape.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00.000Z"
            - "one ACTIVE Therapist in HI"
            - "one PENDING_REVIEW TherapistLicense submitted by co-1 with ce_hours_required 0 and expires_on 2027-06-30"
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "Kai Mahelona", employment_type: "EMPLOYEE", commission_tier: "MASTER", base_hourly_cost_cents: 6000, practice_state_code: "HI" }
              as: SpaDirector
              captures: { th_id: $.data.id }
            - call: "POST /therapists/${th_id}/licenses"
              payload: { license_number: "HI-LMT-7781", license_type: "LMT", state_code: "HI", issued_on: "2023-01-01", expires_on: "2027-06-30", current_period_start_on: "2024-01-01", ce_hours_required: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { lic_id: $.data.id }
          trigger:
            - call: "POST /therapist-licenses/${lic_id}/review"
              payload: { decision: "REJECTED", review_note: "state seal illegible" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /therapist-licenses/${lic_id}/review"
              payload: { decision: "VERIFIED" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /therapist-licenses/${lic_id}/resubmit"
              payload: { license_number: "HI-LMT-7781R", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /therapist-licenses/${lic_id}/review"
              payload: { decision: "VERIFIED" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /therapist-licenses/${lic_id}/review"
              payload: { decision: "VERIFIED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "trigger 1 returns 200 with verification_status == REJECTED, reviewed_by_user_id == co-2, verified_at == null"
            - "trigger 2 returns 409 ERR_INVALID_LICENSE_STATE (priority 9): REJECTED has no review transition, so the repeat trigger is refused on state grounds before any SoD check runs"
