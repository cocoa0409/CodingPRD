            - call: "POST /space-holds/${hold_one_id}/release"
              payload: {}
              as: CenterScheduler
              captures: { hold_one_status: $.data.status, hold_one_reason: $.data.release_reason }
            - call: "GET /opportunities/${opp_id}"
              payload: {}
              as: SalesManager
              captures: { posture_released: $.data.hold_posture }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-10T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /space-holds"
              payload: { opportunity_id: "${opp_id}", center_hall_id: "${hall_id}", move_in_start: "2028-04-08T00:00:00Z", move_out_end: "2028-04-13T00:00:00Z" }
