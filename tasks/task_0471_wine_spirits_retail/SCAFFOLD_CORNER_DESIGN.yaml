        distinguishing_aspect: "After a successful IdScan verify fires the compliance recompute, the unverified-age contribution (+2) is removed so the derived compliance_status reconciles to CLEAR (score 0)."
        test_recipe:
          setup: ["Clock 2026-06-01. Customer registered, a valid PENDING scan created, then verified."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /customers/register"
              payload: { email: "dr1@x.com", full_name: "DR", date_of_birth: "2000-01-01", ship_state_code: "CA" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /id-scans"
              payload: { customer_id: "${cust}", id_state_code: "CA", id_expiry_date: "2030-01-01", scanned_dob: "2000-01-01" }
              as: StoreAssociate
              captures: { scan: $.data.id }
          trigger:
            - call: "POST /id-scans/${scan}/verify"
              payload: {}
              as: StoreAssociate
          assert:
            - "Customer.${cust}.compliance_status == CLEAR"
            - "Customer.${cust}.age_verified == true"

      - name: capture_provisional_to_settled_reconciliation_excluded_stub
        claim_type: dual_variant_calculation
        grounds: [calculations.provisional_order_total, calculations.settled_order_total]
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_vs_settled_total_diverge_on_bonded_line
          rationale: "Provisional->settled divergence and reconciliation is the core assertion of the named §1.8 instance."

      - name: bonded_to_taxed_cascade_excluded_stub
        claim_type: cascading_side_effects
        grounds: [state_machines.Order.AUTHORIZED_to_CAPTURED, entities.InventoryLot.fields.qty_on_hand]
        excluded_because:
          difficulty_instance: transitive_cascade / capture_bonded_withdrawal_line_to_bonded_lot_to_taxed_lot_depth3
          rationale: "The bonded->taxed cascade chain is asserted end-to-end by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_totals_visible_in_submit_response
        claim_type: immediate
        grounds: [calculations.provisional_order_total, entities.Order.fields.provisional_total_cents]
        distinguishing_aspect: "provisional_total_cents and discount_cents are present and correct in the same submit response (immediate consistency, no read-after-write lag): full case price 5000 qty 6 -> discount 4500, provisional 27349."
        test_recipe:
          setup: ["Clock 2026-06-01. Age-verified customer; TAXED vintage price 5000 pack 6, lot qty 6; line qty 6."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /customers/register"
              payload: { email: "im2@x.com", full_name: "IM2", date_of_birth: "2000-01-01", ship_state_code: "CA" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /id-scans"
              payload: { customer_id: "${cust}", id_state_code: "CA", id_expiry_date: "2030-01-01", scanned_dob: "2000-01-01" }
              as: StoreAssociate
              captures: { scan: $.data.id }
            - call: "POST /id-scans/${scan}/verify"
              payload: {}
              as: StoreAssociate
            - call: "POST /products"
              payload: { sku: "IM-2", name: "IM2", category: "WINE", container_type: "BOTTLE", bottle_volume_ml: 750, abv_pct: 13.00 }
              as: Admin
              captures: { prod: $.data.id }
            - call: "POST /products/${prod}/vintages"
              payload: { vintage_year: 2020, list_price_cents: 5000, case_pack_size: 6 }
              as: Admin
              captures: { vint: $.data.id }
            - call: "POST /vintages/${vint}/lots"
              payload: { tax_status: "TAXED", qty_on_hand: 6, excise_band_cents_per_unit: 0 }
              as: Admin
            - call: "POST /vintages/${vint}/release"
              payload: {}
              as: Admin
            - call: "POST /orders"
              payload: { customer_id: "${cust}", channel: "POS" }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { vintage_id: "${vint}", qty: 6 }
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /orders/${ord}"
              as: Customer
              as_user_id: "${cust}"
              captures: { ov: $.data.version }
          trigger:
            - call: "POST /orders/${ord}/submit"
              payload: { expected_order_version: "${ov}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { disc: $.data.discount_cents, prov: $.data.provisional_total_cents }
          assert:
            - "Order.${ord}.discount_cents == 4500"
            - "Order.${ord}.provisional_total_cents == 27349"
