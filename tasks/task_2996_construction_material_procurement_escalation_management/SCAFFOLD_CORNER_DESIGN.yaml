      rationale: The §1.8 instance walks three counters and asserts the fourth returns ERR_NEGOTIATION_ROUNDS_EXHAUSTED with no mutation.
  - name: errors_triggerable_a_storage_window_before_the_release_is_refused
    claim_type: errors_triggerable
    grounds:
    - errors[ERR_STORAGE_WINDOW_INVALID]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / storage_window_temporal_check_beats_warehouse_conflict_constraint
      rationale: The §1.8 instance triggers ERR_STORAGE_WINDOW_INVALID from a stored_from preceding released_for_fab_at.
