              as: ProjectManager
              captures: { ta_id: $.data.id }
            - call: "POST /assignments/${ta_id}/accept"
              payload: {}
              as: Translator
              as_user_id: "${tl_id}"
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ProjectManager
              captures: { jv2: $.data.version }
            - call: "POST /assignments"
              payload: { job_id: "${job_id}", linguist_id: "${rl_id}", role: "REVIEWER", window_start: "2026-06-01T00:00:00.000Z", window_end: "2026-06-02T00:00:00.000Z", expected_job_version: "${jv2}" }
              as: ProjectManager
              captures: { ra_id: $.data.id }
            - call: "POST /assignments/${ra_id}/accept"
              payload: {}
              as: Reviewer
              as_user_id: "${rl_id}"
            - call: "POST /jobs/${job_id}/submit-translation"
              payload: {}
              as: Translator
              as_user_id: "${tl_id}"
            - call: "POST /jobs/${job_id}/qa-reports"
              payload: { reviewer_assignment_id: "${ra_id}", critical_count: 1, major_count: 3, minor_count: 5, scored_word_count: 2600 }
              as: Reviewer
              as_user_id: "${rl_id}"
          trigger:
            - call: "POST /jobs/${job_id}/submit-translation"
              payload: {}
              as: Translator
              as_user_id: "${tl_id}"
              captures: { st: $.data.status, rr: $.data.revision_rounds }
            - call: "POST /jobs/${job_id}/qa-reports"
              payload: { reviewer_assignment_id: "${ra_id}", critical_count: 0, major_count: 0, minor_count: 1, scored_word_count: 2600 }
              as: Reviewer
              as_user_id: "${rl_id}"
          assert:
            - "ProjectJob.${job_id}.status == QA_PASSED"
            - "ProjectJob.${job_id}.revision_rounds == 1"
            - "ProjectJob.${job_id}.latest_qa_score == 99.6"

      - name: nlsm_invoice_void_revert_branch
        grounds:
          - state_machines.Invoice.ISSUED_to_VOIDED
          - state_machines.Project.INVOICED_to_DELIVERED
          - state_machines.Invoice.DRAFT_to_VOIDED
        distinguishing_aspect: |
          Branching-with-revert on a DIFFERENT entity (Invoice): ISSUED→VOIDED diverges from
