            - "ERR_DUPLICATE_SIGNAL, the ninth uniqueness rule, is exercised by the §1.8 instance duplicate_signal_outranks_signal_outside_week and is deliberately not repeated here"

      - name: interval_shape_is_checked_on_all_three_carriers_and_outranks_concurrency
        claim_type: priority_ordering
        grounds:
          - validations[priority=34, ERR_INVALID_INTERVAL]
          - validations[priority=40, ERR_STALE_NEIGHBORHOOD_VERSION]
        distinguishing_aspect: "Three entities carry intervals with two different semantics - the SeatAllocation window is HALF-OPEN, so equal endpoints are empty and refused, while DeskAssignment and ExceptionRequest are CLOSED, so equal endpoints are a legal one-day interval - and the band-34 shape check runs BEFORE the band-40 optimistic-concurrency check, so a request that is both malformed and stale answers with the interval error."
        test_recipe:
          setup:
            - "Cycle, team T-A (entitled_seats 10), employee E-1001, neighborhood N-1 with seat_count 13 and buffer_seats 4, and one RESERVED 2-seat allocation over [2026-W37, 2026-W40) whose creation advanced Neighborhood.version from 1 to 2 - so the captured ${na_v1} is now stale."
