      - name: the_cost_benchmark_read_reports_every_declared_field_on_a_half_open_window
        claim_type: Computed read
        grounds:
          - endpoints[GET /fleet/domiciles/{domicile_id}/cost-benchmark]
          - calculations.domicile_cost_benchmark
          - errors.ERR_BENCHMARK_NO_VOLUME
        distinguishing_aspect: "The benchmark read is driven entirely by its window: the trip's planned_start_at must fall in [window_start, window_end), a sub-day window still reports window_days 1 because the floor is clamped upward, and a window that excludes the only trip is refused with ERR_BENCHMARK_NO_VOLUME rather than returning zeros or dividing by zero."
        test_recipe:
          setup:
            - "DOM-E3 completed exactly one trip: 100 miles, one COMPLETED 600-case DELIVERY, driver pay 10000 (plan MILE-Z: 100*80 + 2000), settlement ACCRUED, planned_start_at 2026-08-20T06:00:00Z."
            - "Expected arithmetic: fuel 100*62 = 6200, maintenance 100*19 = 1900, variable 10000 + 6200 + 1900 - 0 = 18100; fixed pool 1 * (10000 + 3000) = 13000; INCREMENTAL_VARIABLE total 18100; cost_per_case round_half_up(18100/600) = 30; cost_per_mile 181; advantage 205 - 30 = 175."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-E3", region_code: "MIDWEST", tractor_capacity: 20, driver_headcount_target: 10, fixed_ownership_cents_per_day: 10000, overhead_cents_per_day: 3000, dedicated_rate_cents_per_mile: 280, dedicated_rate_cents_per_case: 205 }
