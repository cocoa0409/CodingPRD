              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id", und_v: "$.data.version" }
            - call: "POST /disclosure/dissemination-engagements"
              payload: { undertaking_id: "${und_id}", agent_name: "Transit Filing Partners", effective_date: "2026-09-01", expiration_date: "2027-12-31", retainer_cents: 250000, last_calendar_ack_date: "2026-09-01", expected_undertaking_version: "${und_v}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { eng_id: "$.data.id" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "UNSCHEDULED_DRAW_ON_RESERVE", occurrence_date: "2026-09-01" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { na_id: "$.data.id", na_deadline: "$.data.filing_deadline_date" }
            - call: "POST /disclosure/material-event-notices"
