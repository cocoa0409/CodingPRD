            - { call: "POST /fsa/projects/${p}/donations", payload: { amount_cents: 10000, donor_name: "D", donor_email: "d@x.org", payment_method: "CARD" }, as: Donor, as_user_id: user_donor_1, captures: { d: $.data.id } }
            - { call: "POST /fsa/donations/${d}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "POST /fsa/donations/${d}/request-refund", payload: { amount_cents: 10000, reason: "r" }, as: Donor, as_user_id: user_donor_1 }
          trigger:
            - { call: "POST /fsa/donations/${d}/decide-refund", payload: { decision: "APPROVE" }, as: Donor, as_user_id: user_donor_1, captures: { e: $.data.error_id } }
