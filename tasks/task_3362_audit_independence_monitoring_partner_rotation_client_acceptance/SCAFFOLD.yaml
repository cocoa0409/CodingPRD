    side_effects: []
  - method: POST
    path: "/audit/professionals"
    description: "Register a firm professional."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, grade, home_affiliate_id, rotation_role_class, "max_workload_points?"]
    output: Professional
    side_effects: ["Professional.active_workload_points computed via assignment_workload_points", "Professional.availability computed"]
  - method: GET
    path: "/audit/professionals"
    description: "List professionals with filters."
    roles: [PlatformAdmin, EngagementPartner, ClientAcceptanceCommittee, IndependenceOfficer, AuditCommitteeLiaison, QualityReviewer]
    code: 200
    input: ["home_affiliate_id?", "grade?", "rotation_role_class?", "availability?", "limit?", "offset?"]
    output: Professional[]
    side_effects: []
  - method: GET
    path: "/audit/professionals/{id}"
    description: "Read one professional."
    roles: [PlatformAdmin, EngagementPartner, ClientAcceptanceCommittee, IndependenceOfficer, AuditCommitteeLiaison, QualityReviewer]
    code: 200
    input: []
    output: Professional
    side_effects: []
  - method: POST
    path: "/audit/role-assignments"
    description: "Staff a professional on an engagement role; OCC-guarded by the engagement version."
    roles: [EngagementPartner]
