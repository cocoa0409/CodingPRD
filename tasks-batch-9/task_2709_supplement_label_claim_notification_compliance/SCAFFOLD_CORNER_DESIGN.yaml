        claim_type: cyclic
        grounds:
          - state_machines.Product.LABEL_LOCKED_to_DRAFT
        excluded_because:
          difficulty_instance: non_linear_state_machine / product_label_lock_cycle_revisits_draft_via_superseding_panel
          rationale: "The lock -> DRAFT -> lock loop and its version arithmetic are the whole subject of the named §1.8 instance."
      - name: corner_parallel_lifecycle_and_posture_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.Product.label_posture
        excluded_because:
          difficulty_instance: boundary_precision_check / serious_ae_fifteen_business_day_deadline_boundary
          rationale: "That instance drives label_posture to RESTRICTED while lifecycle_status stays DRAFT, which is exactly the independence claim."
