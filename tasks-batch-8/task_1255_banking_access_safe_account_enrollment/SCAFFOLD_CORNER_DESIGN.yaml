          assert:
            - "opening_claim_cents == 4963 (1 x round(5000 x 0.9925))"
            - "education_stipend_cents == 496 (round_half_up(0.10 x 4963) = round(496.3); completion rate 1/1 >= 0.5)"
            - "claim_total_cents == 5459 (4963 + 0 + 496; stipend must not feed back into its own base)"

      - name: coach_caseload_boundary
        claim_type: constants_applied
        grounds: [calculations.coach_caseload, "errors[ERR_COACH_CASELOAD_FULL]"]
        distinguishing_aspect: "MAX_ACTIVE_PAIRINGS_PER_COACH = 3: the third ACTIVE pairing succeeds, the fourth fails with ERR_COACH_CASELOAD_FULL (boundary at == limit)."
        test_recipe:
          setup: ["four participants registered; coach-1 assigned to the first three"]
          setup_api_calls:
            - { call: "POST /api/participants", payload: { full_name: "P One", date_of_birth: "1990-01-01", contact_zip: "90001", prior_banking_record: "CLEAN" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p1: $.data.id } }
            - { call: "POST /api/participants", payload: { full_name: "P Two", date_of_birth: "1990-01-02", contact_zip: "90001", prior_banking_record: "CLEAN" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p2: $.data.id } }
            - { call: "POST /api/participants", payload: { full_name: "P Three", date_of_birth: "1990-01-03", contact_zip: "90001", prior_banking_record: "CLEAN" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p3: $.data.id } }
