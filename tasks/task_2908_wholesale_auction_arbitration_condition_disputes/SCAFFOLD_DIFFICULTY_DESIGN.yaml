            - "neither unwind posted a reversal — GET /arbitration/sales/${sale_a1_id}/ledger-entries and GET /arbitration/sales/${sale_b1_id}/ledger-entries both return 0 rows, because both sales were UNSETTLED"

      - name: mileage_limit_inclusive_at_250_and_barred_at_251
        grounds:
          - calculations.arbitration_window_evaluation
          - entities.ArbitrationCase.fields.miles_driven_at_claim
          - validations[priority=34]
          - errors.ERR_MILEAGE_LIMIT_EXCEEDED
        distinguishing_aspect: |
          The second axis of the same eligibility calculation, probed one unit apart on an
          INTEGER scale rather than a rounded decimal one, and with the time axis held
          wide open (the claims are filed at hour 0 of a 48-hour window). Isolating the
          mileage boundary this way proves the two axes are conjunctive and independent:
          only miles_driven_at_claim moves between the admitted and the barred probe.
        test_recipe:
          setup:
            - "one Seller, one Buyer and the MECHANICAL policy with mileage_limit 250 and window_hours 48"
            - "TWO AuctionSale rows at hammer_time_utc 2026-08-01T00:00:00Z, the first announced at 84000 miles and the second at 61000 miles"
            - "the clock stays at its default 2026-08-01T00:00:00Z so hours_elapsed_at_claim is 0.0 on both probes and the time axis can never be the reason for a rejection"
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /arbitration/policies"
              payload: { defect_class: "MECHANICAL", window_hours: 48, mileage_limit: 250, min_claim_amount_cents: 60000, requires_third_party_verification: false, max_allowance_bps: 2000, psi_extension_hours: 96, psi_clean_waives_rights: true }
              as: AuctionAdmin
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE12345", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "YELLOW", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale_at_limit_id: $.data.id }
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE22222", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 900000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 61000, light_channel: "YELLOW", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale_over_limit_id: $.data.id }
          trigger:
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale_at_limit_id}", defect_class: "MECHANICAL", claim_amount_cents: 100000, odometer_at_claim: 84250, complaint_text: "Driven exactly to the mileage limit" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { case_at_limit_id: $.data.id }
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale_over_limit_id}", defect_class: "MECHANICAL", claim_amount_cents: 100000, odometer_at_claim: 61251, complaint_text: "Driven one mile past the limit" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
          assert:
            - "probe 1 (exactly at the limit) — HTTP 201 with miles_driven_at_claim == 250, hours_elapsed_at_claim == 0.0 and window_eligible == true; the mileage comparison is inclusive"
            - "probe 2 (one mile past) — HTTP 409 with response.data.error_id == \"ERR_MILEAGE_LIMIT_EXCEEDED\", not ERR_ARBITRATION_WINDOW_EXPIRED, because the time axis is satisfied"
            - "GET /arbitration/cases/${case_at_limit_id} returns miles_driven_at_claim == 250 and effective_window_hours == 48"
            - "GET /arbitration/cases?sale_id=${sale_over_limit_id} returns 0 rows"
            - "GET /arbitration/sales/${sale_at_limit_id} returns arbitration_status == \"ACTIVE\" and open_case_count == 1 while GET /arbitration/sales/${sale_over_limit_id} returns arbitration_status == \"NONE\" and open_case_count == 0"
            - "GET /arbitration/buyers/${buyer_id} returns open_claim_count == 1 and lifetime_claim_count == 1"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: settle_gated_by_seller_policy_tier_then_released_by_reinstate
        grounds:
          - validations[priority=29]
          - errors.ERR_SELLER_BLOCKED
          - state_machines.Seller.BLOCKED_to_PROBATION
          - state_machines.AuctionSale.settlement_hold_cleared_by_reinstate
          - endpoints[POST /arbitration/sellers/{id}/reinstate]
        distinguishing_aspect: |
          The blocking condition lives entirely on a THIRD entity: nothing about sale 2 or
          its buyer changes between the refused settle and the successful one — only
          Seller.policy_tier and the hold flag the block wrote. The dependency is proved in
          both directions on the same sale, and the releasing operation is on yet another
          endpoint (the seller's reinstate route), so an implementation that caches the
          sale's eligibility at creation time fails the second half.
        test_recipe:
          setup:
            - "one Seller with FOUR AuctionSale rows at hammer_time_utc 2026-08-01T00:00:00Z, all UNSETTLED, and one Buyer"
            - "the FRAME_DAMAGE policy with max_allowance_bps 3000"
            - "one FRAME_DAMAGE case on sale 1, evidenced, reviewed by arb-intake-01, offered 200000 and accepted by the buyer, which pushes the rolling rate to 1 upheld / 4 sales = 2500 bps and BLOCKS the seller"
            - "the block cascade has already set settlement_hold true on sales 2, 3 and 4"
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
