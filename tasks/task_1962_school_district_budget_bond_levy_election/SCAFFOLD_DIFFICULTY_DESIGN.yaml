              as: BoardClerk
            - call: "POST /district/bond-proposals/${bp}/projects"
              payload: { name: "HVAC Replacement", site_code: "HS-01", estimated_cost: 5000000, construction_start: "2028-09-01", construction_end: "2028-11-30", priority_rank: 2 }
              as: BoardClerk
            - call: "POST /district/bond-proposals/${bp}/projects"
              payload: { name: "Gym Renovation", site_code: "ES-02", estimated_cost: 7000000, construction_start: "2028-06-01", construction_end: "2028-12-15", priority_rank: 3 }
              as: BoardClerk
            - call: "POST /district/bond-proposals/${bp}/approve-board"
              as: BoardClerk
            - call: "POST /district/elections"
              payload: { election_date: "2027-11-02", election_type: "REGULAR" }
              as: BoardClerk
              captures: { el: $.data.id }
            - call: "POST /district/elections/${el}/ballot-measures"
              payload: { bond_proposal_id: "${bp}", ballot_language: "Shall the District issue bonds for capital improvements" }
              as: BoardClerk
              as_user_id: "clerk-drafter-1"
              captures: { bm: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-15T00:00:00Z" }
              as: BoardClerk
            - call: "POST /district/ballot-measures/${bm}/certify"
              as: BoardClerk
              as_user_id: "clerk-certifier-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-11-03T00:00:00Z" }
              as: BoardClerk
          trigger:
            - call: "POST /district/elections/${el}/canvass"
              payload: { results: [ { ballot_measure_id: "${bm}", yes_votes: 5200, no_votes: 4800 } ] }
              as: BoardClerk
              captures: { n: $.data.canvassed_count }
            - call: "GET /district/ballot-measures/${bm}"
              as: Auditor
              captures: { bm_st: $.data.status, bm_yes: $.data.yes_votes }
            - call: "GET /district/bond-proposals/${bp}"
              as: Auditor
              captures: { bp_st: $.data.status, bp_passed: $.data.passed_at }
            - call: "GET /district/bond-proposals/${bp}/projects"
              as: Auditor
              captures: { p0_st: "$.data[0].status", p0_auth: "$.data[0].authorized_amount", p1_st: "$.data[1].status", p2_st: "$.data[2].status" }
          assert:
            - "Canvass accepted: canvassed_count == 1 and Election.status == CANVASSED"
            - "Link 1: BallotMeasure.${bm} status == PASSED with yes_votes == 5200, no_votes == 4800 (5200 > 4800 strict)"
            - "Link 2: BondProposal.${bp} status == PASSED with passed_at set (caused by the measure passing)"
            - "Link 3: all three BondProjects status == AUTHORIZED with authorized_amount == estimated_cost (6000000.00 / 5000000.00 / 7000000.00), caused by the proposal passing"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (two different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: adopt_state_error_beats_fiscal_balance_error
        grounds:
          - validations[priority=8]
          - validations[priority=13]
          - errors[ERR_BUDGET_VERSION_NOT_HEARING_HELD]
          - errors[ERR_BUDGET_NOT_BALANCED]
        distinguishing_aspect: |
          Category pair state-vs-business_fiscal: an adopt call on a DRAFT budget version
          whose lines (20,000,000) exceed its total revenue (10,200,000) violates BOTH the
          HEARING_HELD state precondition and the balance rule — the state error
          ERR_BUDGET_VERSION_NOT_HEARING_HELD (priority 8) wins over ERR_BUDGET_NOT_BALANCED
          (priority 13).
        test_recipe:
          setup:
            - "FY2028 OPEN; one ELEMENTARY projection 1200; budget version DRAFT (never proposed) with one 20,000,000 line and a revenue estimate totalling 10,200,000 (state aid floors to 0: 7600*1200 - 0.023*480M < 0)"
