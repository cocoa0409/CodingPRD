              as: FittingSpecialist
              as_user_id: "${fs_id}"
          assert:
            - "stale re-quote (expected ${spec_v}) is 412 ERR_STALE_VERSION"
            - "re-quote with the current version (${spec_v2}) succeeds 200; status QUOTED and version == ${spec_v2} + 1"

      - name: occ_stale_offer_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[appraisal-offer-supersede-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "after the first offer bumps the appraisal version, a second offer carrying the stale expected version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["appraisal SUBMITTED (version 1), one offer issued (version 2)"]
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Ott Ode", email: "ott@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Fred Fitter", staff_role: "FITTING_SPECIALIST" }
              as: ShopAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /golf-shop/trade-in-appraisals"
              payload: { customer_id: "${c_id}", clubs: [ { club_type: "DRIVER", condition_grade: "B" } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { appr_id: $.data.id, appr_v: $.data.version }
            - call: "POST /golf-shop/trade-in-appraisals/${appr_id}/offers"
              payload: { basis: "GRADE_MATRIX", expected_appraisal_version: "${appr_v}" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { appr_v2: $.data.version }
          trigger:
            - call: "POST /golf-shop/trade-in-appraisals/${appr_id}/offers"
              payload: { basis: "MARKET_COMP", market_comps_cents: [20000], expected_appraisal_version: "${appr_v}" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response is 412 with error_id == ERR_STALE_VERSION"
            - "TradeInAppraisal.${appr_id}.version == ${appr_v2} (unchanged) and offered_value_cents == 13500 (round(29999*0.45) from the surviving first offer)"

      - name: clock_default_startup_time
        claim_type: scheduled_actions
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "with no set_current_utc call, the logical clock starts at exactly 2026-05-01T00:00:00Z and entity created_at stamps reflect it."
        test_recipe:
