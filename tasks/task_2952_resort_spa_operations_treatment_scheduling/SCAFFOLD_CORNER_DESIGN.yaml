  - name: cascading_side_effects_multi_hop_chain
    claim_type: cascading_side_effects
    grounds:
    - complexity_profile.complexity_layers
    excluded_because:
      difficulty_instance: transitive_cascade / compliance_sweep_license_expiry_five_hop_cascade
      rationale: That instance verifies the full five-hop chain end to end — licence EXPIRED, therapist SUSPENDED with reason LICENSE_EXPIRED, appointments BLOCKED with reason LICENSE_INVALID in start_at ASC order, RECOMMENDED attachments EXPIRED, and CONFIRMED appointments inside the 48-hour horizon auto-cancelled with their minute ledgers released — including ordering sensitivity, so a separate layer test would only re-walk the same hops.
  - name: dual_variant_calculation_delta_on_switch
    claim_type: dual_variant_calculation
    grounds:
    - complexity_profile.complexity_layers
    excluded_because:
      difficulty_instance: dual_variant_calc / settlement_provisional_vs_final_divergence
      rationale: That instance runs four appointments whose actual durations straddle both grace bands through PROVISIONAL and FINAL, pins every distribution field on both variants and reconciles the SETTLEMENT_ADJUSTMENT deltas (+2950, 0 and -2124) against the guest folio, which fully covers both the divergence and the reconciliation rows of this layer.

