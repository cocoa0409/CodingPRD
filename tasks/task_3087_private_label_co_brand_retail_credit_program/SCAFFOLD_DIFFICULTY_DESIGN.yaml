- rule_id: boundary_precision_check
  instances:
  - name: credit_limit_over_limit_strict_greater_than_boundary
    grounds:
    - calculations.account_delinquency_risk
    - entities.Account.fields.credit_limit_cents
    - entities.Account.fields.outstanding_balance_cents
    - endpoints.GET_/servicing/credit-programs/{id}/summary
    distinguishing_aspect: The over-limit term uses strict >, so outstanding_balance_cents == credit_limit_cents scores 20 while one cent above scores 320 — a numeric-threshold crossing reachable only through the risk rollup read.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. One program, one ACTIVE account with credit_limit_cents 200000 and exactly 200000 principal.
