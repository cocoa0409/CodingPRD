      - name: staffing_adequacy_ratio_at_exactly_80_then_one_minute_less_then_zero_demand
        grounds:
          - calculations.staffing_adequacy
          - calculations.staffing_adequacy.constants.TARGET_OCCUPANCY_PCT
          - endpoints[GET /staffing-adequacy]
        distinguishing_aspect: "Three reads over the same data pin all three edges of the posture ladder: 28 of 35 required minutes is exactly 80.0 and must be STRAINED (the boundary belongs to STRAINED), 27 minutes is 77.142857 which must render as 77.1 and CRITICAL, and a state with zero offered calls must return 100.0 / ADEQUATE instead of dividing by zero."
        test_recipe:
          setup:
            - "Clock at 2026-08-03T14:30:00Z (in-hours) so both calls are created inside the query windows."
            - "nurse_a is licensed in CA with one shift 2026-08-03T14:32:00Z to 2026-08-03T15:00:00Z — 28 minutes inside the one-hour window and 27 minutes inside the 59-minute window."
            - "nurse_d is licensed only in NV with a shift covering the whole window, so NV has supply but no demand."
            - "Two CA-state calls, neither of which needs an assignment for the calculation to see them."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
              as: PlatformAdmin
            - call: "POST /practices"
