            - "Trigger call 3: data.total_count == 1 with data[0].id == ${ti83c_id}"
            - "Trigger call 4: data.total_count == 3 - nothing has been run yet, so every record is still RAW"
            - "Trigger call 5: data.total_count == 0 with data.data == [] - an empty filtered page is a 200, not a 404"
            - "Trigger call 6: data.total_count == 0 - no interval is synthetic until an edit pass ascribes one"
            - "Trigger call 7: len(data) == 1 and data.total_count == 3 and data.has_more == false - the third page of a two-per-page listing"
            - "Trigger call 8: data.meter_id == ${mt83s_id}, data.household_id == ${h83_id}, data.source_methodology == STREAMING_SDK, data.tuning_minutes == 45, data.usable_minutes == 0, data.state == RAW, data.processing_run_id == null and data.ascribed == false"
            - "Trigger call 9: data.compliance_rate_rolling_30 == 1.0000 - the ROLLING_30 snapshot was refreshed by the last POST /tuning-intervals over the two REPORTED days 2026-08-03 (60 minutes) and 2026-08-04 (60 + 45 minutes), both at or above the 30-minute floor"

      - name: household_weight_read_matches_the_weighting_pass
        claim_type: computed_read
        grounds:
          - endpoints[GET /household-weights/{household_weight_id}]
          - endpoints[GET /household-weights]
          - calculations.household_compliance_rate.variants
        distinguishing_aspect: "The weight row is a read-only projection of one weighting pass: every one of its computed columns is asserted against the formula, the capped and weight_variant filters are shown to be discriminating rather than constant, and a stray id returns ERR_HOUSEHOLD_WEIGHT_NOT_FOUND rather than an empty row."
        test_recipe:
          setup:
            - "CHAIN C complete with CODE DMA-684, RANK 184, T 1, B 2000, BUDGET 500000, PERSONS 2, SERIAL MT-002089, LABEL RS-C77, opened by stat-opener-84 and published by stat-publisher-84: one ACTIVE household, one 350-minute in-home record inside a 1440-minute window, a cell population of 100000 households, weight_variant FINAL."
          setup_api_calls:
            - call: "GET /processing-runs"
              payload: { state: "PUBLISHED" }
              as: MethodologyStatistician
              captures: { run84_id: "$.data[0].id" }
          trigger:
            - call: "GET /household-weights"
              payload: { processing_run_id: "${run84_id}" }
              as: MethodologyStatistician
              captures: { hw84_id: "$.data[0].id", hw84_hh: "$.data[0].household_id" }
            - call: "GET /household-weights/${hw84_id}"
              payload: {}
              as: AccreditationAuditor
            - call: "GET /household-weights"
              payload: { processing_run_id: "${run84_id}", weight_variant: "FINAL" }
              as: MethodologyStatistician
            - call: "GET /household-weights"
              payload: { processing_run_id: "${run84_id}", weight_variant: "DESIGN" }
              as: MethodologyStatistician
            - call: "GET /household-weights"
              payload: { processing_run_id: "${run84_id}", capped: true }
              as: MethodologyStatistician
            - call: "GET /household-weights"
              payload: { household_id: "${hw84_hh}", capped: false }
              as: MethodologyStatistician
            - call: "GET /household-weights/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: MethodologyStatistician
              captures: { e84: "$.data.error_id" }
          assert:
            - "Trigger call 1: data.total_count == 1 - exactly one row per contributing household"
            - "Trigger call 2: data.processing_run_id == ${run84_id}, data.weight_variant == FINAL, data.base_weight == 100000.0000 (cell population 100000 over a FINAL denominator of 1 contributor), data.adjusted_weight == 100000.0000 (no cap applied), data.usable_minutes == 350, data.contribution == round_half_up(100000.0000 * 350 / 1440, 2) == 24305.56 and data.capped == false"
            - "Trigger call 2: data.run_compliance_rate == 1.0000 - the RUN_SCOPED variant divides by ceil(1440 / 1440) == 1 evaluated day and the household's 350 credited minutes on 2026-08-10 clear the 30-minute floor"
            - "Trigger call 3: data.total_count == 1 and Trigger call 4: data.total_count == 0 - the variant filter matches the run's stored weight_variant"
            - "Trigger call 5: data.total_count == 0 and Trigger call 6: data.total_count == 1 - the capped flag is discriminating, not always-false-shaped"
            - "Trigger call 7: HTTP 404 with ${e84} == ERR_HOUSEHOLD_WEIGHT_NOT_FOUND"

      - name: client_deliverable_listing_filters_by_kind_state_and_hold_reason
        claim_type: standard_crud
        grounds:
          - endpoints[GET /client-deliverables]
          - endpoints[POST /clients/{client_id}/scheduled-deliverables]
          - endpoints[POST /client-deliverables]
        distinguishing_aspect: "The two creation endpoints of the same entity produce rows that differ in kind, starting state and question, and only one of them consumes the tier quota; the hold_reason filter then discriminates rows that share the state HELD. It also pins the fields a scheduled row starts at ZERO (gross_cents, total_cents) rather than null."
        test_recipe:
          setup:
            - "CHAIN C complete with CODE DMA-685, RANK 185, T 1, B 2000, BUDGET 500000, PERSONS 2, SERIAL MT-002090, LABEL RS-C78, opened by stat-opener-85 and published by stat-publisher-85; the clock reads 2026-08-11T00:00:00Z."
            - "One PREMIUM client contracted to the run's market: tier_base_fee_cents 120000, delivery_sla_hours 24, custom_analysis_quota 10."
          setup_api_calls:
            - call: "GET /processing-runs"
              payload: { state: "PUBLISHED" }
              as: ClientServiceRep
              captures: { run85_id: "$.data[0].id", m85_id: "$.data[0].market_id" }
            - call: "POST /clients"
              payload: { name: "Northline Media", tier: "PREMIUM", contract_market_ids: ["${m85_id}"] }
              as: ClientServiceRep
              captures: { cl85_id: "$.data.id" }
          trigger:
            - call: "POST /clients/${cl85_id}/scheduled-deliverables"
              payload: { processing_run_id: "${run85_id}", requested_cell_count: 2 }
              as: ClientServiceRep
              captures: { d85a_id: "$.data.id" }
            - call: "POST /client-deliverables"
              payload: { client_id: "${cl85_id}", processing_run_id: "${run85_id}", question: "Rank the top five stations by 18-34 reach", requested_cell_count: 3 }
              as: ClientServiceRep
              captures: { d85b_id: "$.data.id" }
            - call: "POST /client-deliverables/${d85a_id}/hold"
              payload: { hold_reason: "DATA_QUALITY_REVIEW" }
              as: ClientServiceRep
            - call: "GET /client-deliverables"
              payload: { client_id: "${cl85_id}" }
              as: ClientServiceRep
            - call: "GET /client-deliverables"
              payload: { client_id: "${cl85_id}", kind: "CUSTOM_ANALYSIS" }
              as: ClientServiceRep
            - call: "GET /client-deliverables"
              payload: { client_id: "${cl85_id}", kind: "SCHEDULED_DATASET" }
              as: ClientServiceRep
            - call: "GET /client-deliverables"
              payload: { state: "HELD" }
              as: ClientServiceRep
            - call: "GET /client-deliverables"
              payload: { hold_reason: "DATA_QUALITY_REVIEW" }
              as: ClientServiceRep
            - call: "GET /client-deliverables"
              payload: { hold_reason: "CLIENT_REQUESTED" }
              as: ClientServiceRep
            - call: "GET /client-deliverables"
              payload: { processing_run_id: "${run85_id}", limit: 1, offset: 0 }
              as: ClientServiceRep
            - call: "GET /clients/${cl85_id}"
              payload: {}
              as: ClientServiceRep
          assert:
            - "Trigger call 1: HTTP 201 with data.kind == SCHEDULED_DATASET, data.state == SCHEDULED, data.question == null, data.requested_cell_count == 2, data.gross_cents == 0, data.total_cents == 0, data.revision_count == 0 and data.due_at == 2026-08-12T00:00:00Z (the run is already PUBLISHED, so the 24-hour PREMIUM SLA starts at once)"
            - "Trigger call 2: HTTP 201 with data.kind == CUSTOM_ANALYSIS, data.state == REQUESTED (NOT the machine's declared initial_state SCHEDULED), data.question set and data.due_at == 2026-08-12T00:00:00Z"
            - "Trigger call 3: HTTP 200 with data.state == HELD, data.held_from_state == SCHEDULED and data.hold_reason == DATA_QUALITY_REVIEW"
            - "Trigger call 4: data.total_count == 2, ordered by created_at ASC so data[0].id == ${d85a_id}"
            - "Trigger call 5: data.total_count == 1 with data[0].id == ${d85b_id}; Trigger call 6: data.total_count == 1 with data[0].id == ${d85a_id}"
            - "Trigger call 7: data.total_count == 1 - only the scheduled row was held"
            - "Trigger call 8: data.total_count == 1 and Trigger call 9: data.total_count == 0 - hold_reason discriminates within the HELD state"
            - "Trigger call 10: len(data) == 1, data.total_count == 2 and data.has_more == true"
            - "Trigger call 11: data.custom_analysis_used == 1 (only the custom analysis consumes quota), data.held_deliverable_count == 1 and data.delivery_sla_credit_cents == 0 - a DATA_QUALITY_REVIEW hold earns no credit, because only UPSTREAM_RUN_REPIN does"

      - name: scheduled_placement_accepts_an_unpublished_run_but_never_a_superseded_one
        claim_type: conditional_action
        grounds:
          - endpoints[POST /clients/{client_id}/scheduled-deliverables]
          - endpoints[POST /client-deliverables]
          - validations[priority 46]
          - validations[priority 47]
          - validations[priority 48]
        distinguishing_aspect: "The two deliverable creation endpoints have OPPOSITE run-state requirements: a contractual schedule may be placed against a run that is still OPEN (only SUPERSEDED is refused) while a custom analysis demands a PUBLISHED run. The contract check at 46 outranks both, so an uncontracted client gets ERR_MARKET_NOT_CONTRACTED even when the run state would also be wrong."
        test_recipe:
          setup:
            - "CHAIN C steps C1..C9 ONLY with CODE DMA-686, RANK 186, T 1, B 2000, BUDGET 500000, PERSONS 2, SERIAL MT-002091, LABEL RS-C79, opened by stat-opener-86 - so run A exists in state OPEN over the window [2026-08-10T00:00:00Z, 2026-08-11T00:00:00Z) and is never edited, weighted or published. The clock reads 2026-08-11T00:00:00Z."
            - "A bare market DMA-687 (rank 187) with no cells, used to contract a client to the WRONG market."
          setup_api_calls:
            - call: "GET /processing-runs"
              payload: { state: "OPEN" }
              as: MethodologyStatistician
              captures: { run86a_id: "$.data[0].id", m86_id: "$.data[0].market_id", ue86_id: "$.data[0].universe_estimate_id", rs79_id: "$.data[0].edit_rule_set_id" }
            - call: "POST /markets"
              payload: { name: "Metro Uncontracted", market_code: "DMA-687", dma_rank: 187, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m87_id: "$.data.id" }
            - call: "GET /markets/${m86_id}"
              payload: {}
              as: MethodologyStatistician
              captures: { m86_v: "$.data.version" }
          trigger:
            - call: "POST /processing-runs"
              payload: { market_id: "${m86_id}", universe_estimate_id: "${ue86_id}", edit_rule_set_id: "${rs79_id}", window_start_iso: "2026-08-10T00:00:00Z", window_end_iso: "2026-08-11T00:00:00Z", expected_market_version: "${m86_v}" }
              as: MethodologyStatistician
              as_user_id: "stat-opener-86b"
              captures: { run86b_id: "$.data.id" }
            - call: "GET /processing-runs/${run86a_id}"
              payload: {}
              as: MethodologyStatistician
            - call: "POST /clients"
              payload: { name: "Seaboard Networks", tier: "STANDARD", contract_market_ids: ["${m86_id}"] }
              as: ClientServiceRep
              captures: { cl86_id: "$.data.id" }
            - call: "POST /clients/${cl86_id}/scheduled-deliverables"
              payload: { processing_run_id: "${run86a_id}", requested_cell_count: 1 }
              as: ClientServiceRep
              captures: { e86a: "$.data.error_id" }
            - call: "POST /clients/${cl86_id}/scheduled-deliverables"
              payload: { processing_run_id: "${run86b_id}", requested_cell_count: 1 }
              as: ClientServiceRep
              captures: { d86_id: "$.data.id" }
            - call: "POST /clients"
              payload: { name: "Inland Cable", tier: "BASIC", contract_market_ids: ["${m87_id}"] }
              as: ClientServiceRep
              captures: { cl87_id: "$.data.id" }
            - call: "POST /clients/${cl87_id}/scheduled-deliverables"
              payload: { processing_run_id: "${run86b_id}", requested_cell_count: 1 }
              as: ClientServiceRep
              captures: { e86b: "$.data.error_id" }
            - call: "POST /client-deliverables"
              payload: { client_id: "${cl87_id}", processing_run_id: "${run86b_id}", question: "Share of viewing by daypart", requested_cell_count: 1 }
              as: ClientServiceRep
              captures: { e86c: "$.data.error_id" }
            - call: "POST /client-deliverables"
              payload: { client_id: "${cl86_id}", processing_run_id: "${run86b_id}", question: "Share of viewing by daypart", requested_cell_count: 1 }
              as: ClientServiceRep
              captures: { e86d: "$.data.error_id" }
          assert:
            - "Trigger call 1: HTTP 201 - a byte-identical window is a re-run rather than an overlap, so no ERR_RUN_WINDOW_OVERLAP; run B starts OPEN"
            - "Trigger call 2: data.state == SUPERSEDED and data.superseded_at is the logical clock - the earlier OPEN run over the same window was retired by the cascade"
            - "Trigger call 4: HTTP 409 with ${e86a} == ERR_RUN_SUPERSEDED - a schedule can never be pinned to a run that has been re-run away"
            - "Trigger call 5: HTTP 201 with data.state == SCHEDULED and data.due_at == null - run B has not published, so the SLA clock has not started; gross_cents and total_cents are 0"
            - "Trigger call 7: HTTP 403 with ${e86b} == ERR_MARKET_NOT_CONTRACTED - the BASIC client's contract covers DMA-687 only"
            - "Trigger call 8: HTTP 403 with ${e86c} == ERR_MARKET_NOT_CONTRACTED - the contract check at priority 46 is reported even though the run is also unpublished (47) and the BASIC quota is 0 (49)"
            - "Trigger call 9: HTTP 409 with ${e86d} == ERR_RUN_NOT_PUBLISHED - the contracted client clears 46, and now the custom-analysis-only requirement bites on the very run that accepted a schedule in call 5"

      - name: clock_endpoint_is_monotonic_and_open_to_every_role
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - validations[priority 9]
        distinguishing_aspect: "The comparison is >=, so re-setting the clock to its current value is accepted while a single second backwards is refused, and the refusal must leave the clock where it was - proved by a timestamp stamped afterwards. Every one of the seven roles is listed on the endpoint, so a FieldTechnician and a ClientUser can both move it."
        test_recipe:
          setup:
            - "A bare fixture: one market DMA-688 (rank 188) with one quota cell, created at the startup clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Clock", market_code: "DMA-688", dma_rank: 188, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m88_id: "$.data.id" }
            - call: "POST /markets/${m88_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 4, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c88_id: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: FieldTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: ClientUser
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T23:59:59Z" }
              as: MethodologyStatistician
              captures: { e88: "$.data.error_id" }
            - call: "POST /households"
              payload: { market_id: "${m88_id}", quota_cell_id: "${c88_id}", recruitment_source: "RDD_PHONE", persons_count: 3 }
              as: PanelOperationsManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AccreditationAuditor
          assert:
            - "Trigger call 1: HTTP 200 and the clock now reads 2026-08-05T00:00:00Z"
            - "Trigger call 2: HTTP 200 - setting the clock to exactly its current value satisfies the >= rule, and a ClientUser is authorised on this endpoint"
            - "Trigger call 3: HTTP 422 with ${e88} == ERR_CLOCK_NOT_MONOTONIC - one second backwards is refused"
            - "Trigger call 4: data.recruited_at == 2026-08-05T00:00:00Z - the rejected call did not roll the clock back, and system timestamps come from the logical clock rather than wall time"
            - "Trigger call 5: HTTP 200 - the clock may jump forward by any amount"

      - name: audit_creation_links_two_entities_and_reports_the_earlier_missing_one
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /accreditation-audits]
          - endpoints[GET /accreditation-audits]
          - validations[priority 5]
        distinguishing_aspect: "The audit row joins a Market to an EditRuleSet, so each reference must be resolved independently and a body with BOTH ids missing reports the earlier one in the declared input order. Creation also freezes the market, which the listing filters then have to keep visible."
        test_recipe:
          setup:
            - "Market DMA-689 (rank 189) with one quota cell, plus a PUBLISHED edit rule set RS-C80 carrying the standard CHAIN C values."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Audited", market_code: "DMA-689", dma_rank: 189, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m89_id: "$.data.id" }
            - call: "POST /markets/${m89_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 4, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c89_id: "$.data.id" }
            - call: "POST /edit-rule-sets"
              payload: { label: "RS-C80", missing_interval_ascription_minutes: 60, invalid_tuning_max_minutes: 900, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.5, fault_missing_minutes_threshold: 1440 }
              as: MethodologyStatistician
              captures: { rs80_id: "$.data.id" }
            - call: "POST /edit-rule-sets/${rs80_id}/publish"
              payload: {}
              as: MethodologyStatistician
          trigger:
            - call: "POST /accreditation-audits"
              payload: { market_id: "00000000-0000-0000-0000-000000000000", scope_edit_rule_set_id: "${rs80_id}", auditor_note: "Annual methodology review" }
              as: AccreditationAuditor
              captures: { e89a: "$.data.error_id" }
            - call: "POST /accreditation-audits"
              payload: { market_id: "${m89_id}", scope_edit_rule_set_id: "00000000-0000-0000-0000-000000000000", auditor_note: "Annual methodology review" }
              as: AccreditationAuditor
              captures: { e89b: "$.data.error_id" }
            - call: "POST /accreditation-audits"
              payload: { market_id: "00000000-0000-0000-0000-000000000000", scope_edit_rule_set_id: "00000000-0000-0000-0000-000000000000", auditor_note: "Annual methodology review" }
              as: AccreditationAuditor
              captures: { e89c: "$.data.error_id" }
            - call: "POST /accreditation-audits"
              payload: { market_id: "${m89_id}", scope_edit_rule_set_id: "${rs80_id}", auditor_note: "Annual methodology review" }
              as: AccreditationAuditor
              as_user_id: "auditor-opener-89"
              captures: { au89_id: "$.data.id" }
            - call: "GET /accreditation-audits"
              payload: { market_id: "${m89_id}", state: "OPEN" }
              as: AccreditationAuditor
            - call: "GET /accreditation-audits"
              payload: { scope_edit_rule_set_id: "${rs80_id}", outcome: "ACCREDITED" }
              as: AccreditationAuditor
            - call: "GET /accreditation-audits/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AccreditationAuditor
              captures: { e89d: "$.data.error_id" }
            - call: "GET /markets/${m89_id}"
              payload: {}
              as: AccreditationAuditor
          assert:
            - "Trigger call 1: HTTP 404 with ${e89a} == ERR_MARKET_NOT_FOUND"
            - "Trigger call 2: HTTP 404 with ${e89b} == ERR_EDIT_RULE_SET_NOT_FOUND - the second reference is resolved independently of the first"
            - "Trigger call 3: HTTP 404 with ${e89c} == ERR_MARKET_NOT_FOUND - with both references missing the earlier one in the endpoint's declared input order wins"
            - "Trigger call 4: HTTP 201 with data.state == OPEN, data.market_id == ${m89_id}, data.scope_edit_rule_set_id == ${rs80_id}, data.outcome == null, data.limitation_disclosures == [] and data.opened_by_user_id == auditor-opener-89"
            - "Trigger call 5: data.total_count == 1 with data[0].id == ${au89_id}"
            - "Trigger call 6: data.total_count == 0 - the audit is in scope for the rule-set filter but has no outcome yet, so combining the two filters yields nothing"
            - "Trigger call 7: HTTP 404 with ${e89d} == ERR_ACCREDITATION_AUDIT_NOT_FOUND"
            - "Trigger call 8: data.recruitment_posture == FROZEN and data.open_audit_count == 1 - opening the audit froze the market as a side effect of the link"

  # ===========================================================================
  # SECTION 6 - Errors (§1.6)
  #
  # Table 6 asks only that every catalogued error be reachable. The instances
  # below sweep the ids that no earlier section triggers - the NOT_FOUND family
  # and three lone business rules - and they assert the error envelope shape
  # ({ response_type: "error", data: { error_id, message } }) as well as the id.
  # ===========================================================================
  - section: errors
    instances:

      - name: measurement_path_ids_that_do_not_resolve_return_the_owning_entity_error
        claim_type: error_triggerable
        grounds:
          - validations[priority 4]
          - errors
        distinguishing_aspect: "Each of the six measurement-side entities has its OWN not-found id, so a single shared ERR_NOT_FOUND fails here; the probes also show that path resolution happens before any state or payload rule, since a well-formed body against a missing parent still reports 404 rather than 409 or 422."
        test_recipe:
          setup:
            - "No fixture at all beyond an empty database: every id below is the all-zeroes UUID, which cannot exist."
          setup_api_calls: []
          trigger:
            - call: "GET /quota-cells/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PanelOperationsManager
              captures: { x1: "$.data.error_id" }
            - call: "GET /households/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PanelOperationsManager
              captures: { x2: "$.data.error_id" }
            - call: "GET /meters/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FieldTechnician
              captures: { x3: "$.data.error_id" }
            - call: "GET /tuning-intervals/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: MethodologyStatistician
              captures: { x4: "$.data.error_id" }
            - call: "GET /processing-runs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: MethodologyStatistician
              captures: { x5: "$.data.error_id" }
            - call: "GET /universe-estimates/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: MethodologyStatistician
              captures: { x6: "$.data.error_id" }
            - call: "POST /markets/00000000-0000-0000-0000-000000000000/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 4, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { x7: "$.data.error_id" }
            - call: "POST /households/00000000-0000-0000-0000-000000000000/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
              captures: { x8: "$.data.error_id" }
            - call: "POST /meters/00000000-0000-0000-0000-000000000000/fault-reports"
              payload: { fault_code: "NO_SIGNAL" }
              as: FieldTechnician
              captures: { x9: "$.data.error_id" }
            - call: "GET /quota-cells"
              payload: {}
              as: PanelOperationsManager
          assert:
            - "Trigger calls 1-6: HTTP 404 with ${x1} == ERR_QUOTA_CELL_NOT_FOUND, ${x2} == ERR_HOUSEHOLD_NOT_FOUND, ${x3} == ERR_METER_NOT_FOUND, ${x4} == ERR_TUNING_INTERVAL_NOT_FOUND, ${x5} == ERR_PROCESSING_RUN_NOT_FOUND, ${x6} == ERR_UNIVERSE_ESTIMATE_NOT_FOUND - six distinct ids, one per entity"
            - "Trigger calls 1-6: each response body is the error envelope - response_type == \"error\" and data holding exactly error_id and message, with no entity fields"
            - "Trigger call 7: HTTP 404 with ${x7} == ERR_MARKET_NOT_FOUND - the body is entirely valid, so the 404 proves the path parent is resolved before the payload is considered"
            - "Trigger call 8: HTTP 404 with ${x8} == ERR_HOUSEHOLD_NOT_FOUND and NOT the state error ERR_HOUSEHOLD_NOT_ENUMERABLE - priority 4 precedes priority 20"
            - "Trigger call 9: HTTP 404 with ${x9} == ERR_METER_NOT_FOUND and NOT ERR_METER_NOT_INSTALLED"
            - "Trigger call 10: HTTP 200 with data.data == [], data.total_count == 0 and data.has_more == false - an empty collection is not a 404"

      - name: commercial_and_governance_ids_that_do_not_resolve_return_their_own_error
        claim_type: error_triggerable
        grounds:
          - validations[priority 4]
          - validations[priority 5]
          - errors
        distinguishing_aspect: "The commercial and governance entities each carry their own not-found id too, and the body-reference rule at priority 5 reports the FIRST unresolvable reference in the endpoint's declared input order - client_id before processing_run_id on POST /client-deliverables - rather than a generic invalid-request."
        test_recipe:
          setup:
            - "No fixture: every id below is the all-zeroes UUID."
          setup_api_calls: []
          trigger:
            - call: "GET /clients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClientServiceRep
              captures: { y1: "$.data.error_id" }
            - call: "POST /clients/00000000-0000-0000-0000-000000000000/suspend"
              payload: { suspended_reason: "Non-payment" }
              as: ClientServiceRep
              captures: { y2: "$.data.error_id" }
            - call: "GET /client-deliverables/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClientServiceRep
              captures: { y3: "$.data.error_id" }
            - call: "POST /client-deliverables/00000000-0000-0000-0000-000000000000/start"
              payload: {}
              as: ClientServiceRep
              captures: { y4: "$.data.error_id" }
            - call: "GET /client-notifications/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClientServiceRep
              captures: { y5: "$.data.error_id" }
            - call: "GET /methodology-changes/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: GovernanceDirector
              captures: { y6: "$.data.error_id" }
            - call: "POST /methodology-changes/00000000-0000-0000-0000-000000000000/notify"
              payload: {}
              as: GovernanceDirector
              captures: { y7: "$.data.error_id" }
            - call: "POST /client-deliverables"
              payload: { client_id: "00000000-0000-0000-0000-000000000000", processing_run_id: "00000000-0000-0000-0000-000000000000", question: "Anything at all", requested_cell_count: 1 }
              as: ClientServiceRep
              captures: { y8: "$.data.error_id" }
          assert:
            - "Trigger calls 1-2: HTTP 404 with ${y1} == ${y2} == ERR_CLIENT_NOT_FOUND - the action endpoint resolves its path id before the state rule at priority 45"
            - "Trigger calls 3-4: HTTP 404 with ${y3} == ${y4} == ERR_CLIENT_DELIVERABLE_NOT_FOUND"
            - "Trigger call 5: HTTP 404 with ${y5} == ERR_CLIENT_NOTIFICATION_NOT_FOUND"
            - "Trigger calls 6-7: HTTP 404 with ${y6} == ${y7} == ERR_METHODOLOGY_CHANGE_NOT_FOUND and NOT the state error ERR_CHANGE_NOT_ASSESSED"
            - "Trigger call 8: HTTP 404 with ${y8} == ERR_CLIENT_NOT_FOUND - both body references are unresolvable, and client_id is declared first in the endpoint's input list"

      - name: quota_cell_triple_uniqueness_and_cross_market_pairing_are_separate_rules
        claim_type: error_triggerable
        grounds:
          - validations[priority 11]
          - validations[priority 68]
          - errors
        distinguishing_aspect: "The (age_band, income_band, geo_zone) key is unique PER MARKET, so the identical triple is legal in a second market, and one differing component is enough to make a new cell in the same market. The pairing rule then rejects a household whose cell belongs to a different market than its own market_id, while a missing cell id is still a 404 first."
        test_recipe:
          setup:
            - "Market DMA-690 (rank 190) with one cell cA (P18_34/MID/URBAN, target 4, base 1000)."
            - "Market DMA-691 (rank 191) with no cells yet."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Keys", market_code: "DMA-690", dma_rank: 190, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m90_id: "$.data.id" }
            - call: "POST /markets/${m90_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 4, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c90a_id: "$.data.id" }
            - call: "POST /markets"
              payload: { name: "Metro Twin", market_code: "DMA-691", dma_rank: 191, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m91_id: "$.data.id" }
          trigger:
            - call: "POST /markets/${m90_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 6, base_incentive_cents: 2500 }
              as: PanelOperationsManager
              captures: { z1: "$.data.error_id" }
            - call: "POST /markets/${m90_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "SUBURBAN", target_households: 4, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c90b_id: "$.data.id" }
            - call: "POST /markets/${m91_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 4, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c91f_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m90_id}", quota_cell_id: "${c91f_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { z2: "$.data.error_id" }
            - call: "POST /households"
              payload: { market_id: "${m90_id}", quota_cell_id: "00000000-0000-0000-0000-000000000000", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { z3: "$.data.error_id" }
            - call: "POST /households"
              payload: { market_id: "${m90_id}", quota_cell_id: "${c90a_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
          assert:
            - "Trigger call 1: HTTP 409 with ${z1} == ERR_QUOTA_CELL_DUPLICATE - the differing target and base incentive do not matter, only the demographic triple"
            - "Trigger call 2: HTTP 201 - changing geo_zone alone makes a distinct key inside the same market"
            - "Trigger call 3: HTTP 201 - the identical triple is legal in DMA-691, so uniqueness is scoped per market and not global"
            - "Trigger call 4: HTTP 422 with ${z2} == ERR_QUOTA_CELL_MARKET_MISMATCH - the cell exists but belongs to DMA-691 while the body names DMA-690"
            - "Trigger call 5: HTTP 404 with ${z3} == ERR_QUOTA_CELL_NOT_FOUND - existence at priority 5 outranks the pairing rule at 11"
            - "Trigger call 6: HTTP 201 with data.status == RECRUITED and the cell's intab_count still 0 - the correctly paired request is the only one that creates a household"

      - name: reverse_accrual_requires_a_period_entry_that_is_not_already_reversed
        claim_type: error_triggerable
        grounds:
          - validations[priority 69]
          - endpoints[POST /households/{household_id}/reverse-accrual]
          - errors
        distinguishing_aspect: "The rule reads BOTH the label and the reversed flag, so the same call is refused before any accrual exists, refused for a label that was never accrued, and refused a second time after a successful reversal - while the accrual_periods entry is kept in place rather than deleted."
        test_recipe:
          setup:
            - "CHAIN B with CODE DMA-692, RANK 192, T 4, B 2000, BUDGET 500000, PERSONS 2, SERIAL MT-002092 - one ACTIVE household whose cell is UNDER_TARGET, so an accrual costs round_half_up(2000 * 1.25, 0) == 2500."
