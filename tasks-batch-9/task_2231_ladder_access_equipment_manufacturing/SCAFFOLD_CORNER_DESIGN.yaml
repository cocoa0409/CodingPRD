# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2231 — Ladder & Access Equipment Manufacturing
#
# Breadth probe over the §1.1-§1.7 surface: one instance per applicable row of
# references/claim-extraction-guide.md, plus excluded_because stubs wherever
# SCAFFOLD_DIFFICULTY_DESIGN.yaml already asserts the corner.
# The logical clock starts at 2026-08-01T00:00:00Z; every chain sets it
# explicitly so the derived *_at / *_until literals below are reproducible.
# =============================================================================
scaffold_corner_design:
- section: entities
  instances:
  - name: product_creation_returns_all_derived_thresholds
    claim_type: creation
    grounds:
    - entities.Product
    - endpoints[POST /ladder-ops/products]
    - calculations.required_test_load_derivation
    distinguishing_aspect: POST /ladder-ops/products with the six input fields returns 201 and the four derived thresholds plus both status dimensions in the same response body; no second call is needed
      to observe them.
    test_recipe:
      setup:
      - The database is empty apart from the logical clock at 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      trigger:
      - call: POST /ladder-ops/products
        payload:
          model_code: AL-STEP-12-II
          product_type: STEP_LADDER
          material: ALUMINUM_EXTRUSION
          duty_rating: TYPE_II
          working_length_ft: 12.0
          retail_sku: SKU-AL12II
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          pnew: $.data.id
      assert:
      - HTTP status == 201
      - response.data.model_code == AL-STEP-12-II
      - response.data.product_type == STEP_LADDER
      - response.data.material == ALUMINUM_EXTRUSION
      - response.data.duty_rating == TYPE_II
      - response.data.working_length_ft == 12.0
      - response.data.retail_sku == SKU-AL12II
      - Product.${pnew}.rated_load_lb == 225
      - Product.${pnew}.safety_factor == 4.00
      - Product.${pnew}.required_test_load_lb == 900.00
      - Product.${pnew}.required_pull_force_lbf == 337.50
      - Product.${pnew}.max_allowed_deflection_in == 0.800
      - Product.${pnew}.design_status == DRAFT
      - Product.${pnew}.market_status == NOT_RELEASED
      - Product.${pnew}.version == 1
  - name: design_revision_retrieval_returns_stored_fields
    claim_type: retrieval
    grounds:
    - entities.DesignRevision
    - endpoints[GET /ladder-ops/design-revisions/{id}]
    distinguishing_aspect: GET /ladder-ops/design-revisions/{id} echoes exactly what POST stored, including the numeric precision of structural_margin_pct (2 dp) and rail_section_modulus_in3 (3 dp).
    test_recipe:
      setup:
      - Product FG-EXT-24-IA exists with revision A in DRAFT (margin 6.50, modulus 0.250).
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-EXT-24-IA
          product_type: EXTENSION_LADDER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-FG24IA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          p1: $.data.id
          p1v: $.data.version
      - call: POST /ladder-ops/design-revisions
        payload:
          product_id: ${p1}
          revision_label: A
          joint_type: RIVETED
          structural_margin_pct: 6.5
          rail_section_modulus_in3: 0.25
          expected_product_version: ${p1v}
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          r1: $.data.id
      trigger:
      - call: GET /ladder-ops/design-revisions/${r1}
        payload: {}
        as: DesignEngineer
      assert:
      - HTTP status == 200
      - response.data.id == ${r1}
      - response.data.product_id == ${p1}
      - response.data.revision_label == A
      - response.data.joint_type == RIVETED
      - response.data.structural_margin_pct == 6.50
      - response.data.rail_section_modulus_in3 == 0.250
      - response.data.status == DRAFT
      - response.data.review_round == 1
      - response.data.submitted_by_user_id == null
      - response.data.superseded_at == null
      - response.meta.api_request_id is a non-empty string and response.response_type == object
  - name: product_listing_pagination_reports_total_count_and_has_more
    claim_type: listing
    grounds:
    - entities.Product
    - endpoints[GET /ladder-ops/products]
    - response_envelope.pagination_fields
    distinguishing_aspect: 'Three products with limit=2 exercises both pages of the envelope: page one has has_more true, page two returns the single remainder with has_more false, and total_count stays
      3 on both pages.'
    test_recipe:
      setup:
      - 'Exactly three products exist: FG-EXT-24-IA, AL-STEP-12-II and FG-TOWER-28-IAA.'
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-EXT-24-IA
          product_type: EXTENSION_LADDER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-FG24IA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          p1: $.data.id
      - call: POST /ladder-ops/products
        payload:
          model_code: AL-STEP-12-II
          product_type: STEP_LADDER
          material: ALUMINUM_EXTRUSION
          duty_rating: TYPE_II
          working_length_ft: 12.0
          retail_sku: SKU-AL12II
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          p2: $.data.id
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-TOWER-28-IAA
          product_type: MOBILE_SCAFFOLD_TOWER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IAA
          working_length_ft: 28.0
          retail_sku: SKU-TW28IAA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          p3: $.data.id
      trigger:
      - call: GET /ladder-ops/products
        payload:
          limit: 2
          offset: 0
        as: ComplianceOfficer
      - call: GET /ladder-ops/products
        payload:
          limit: 2
          offset: 2
        as: ComplianceOfficer
      - call: GET /ladder-ops/products
        payload:
          material: ALUMINUM_EXTRUSION
        as: ComplianceOfficer
      assert:
      - 'page one: HTTP 200, response.response_type == array, len(response.data) == 2'
      - 'page one: response.total_count == 3 and response.has_more == true'
      - 'page one: response.limit == 2 and response.offset == 0'
      - 'page two: len(response.data) == 1, response.total_count == 3, response.has_more == false'
      - 'filtered call: len(response.data) == 1 and response.data[0].id == ${p2}'
      - 'filtered call: response.total_count == 1 and response.has_more == false'
  - name: production_lot_not_found_returns_404
    claim_type: not_found
    grounds:
    - entities.ProductionLot
    - errors[ERR_PRODUCTION_LOT_NOT_FOUND]
    - validations[priority=3]
    distinguishing_aspect: A syntactically valid UUID that matches no ProductionLot row must yield 404 ERR_PRODUCTION_LOT_NOT_FOUND on the single GET, not an empty 200 body.
    test_recipe:
      setup:
      - No ProductionLot rows exist at all.
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      trigger:
      - call: GET /ladder-ops/production-lots/00000000-0000-0000-0000-0000000009ff
        payload: {}
        as: ProductionSupervisor
      assert:
      - HTTP status == 404
      - response.response_type == error
      - response.data.error_id == ERR_PRODUCTION_LOT_NOT_FOUND
      - response.data.message is a non-empty string
  - name: test_bench_missing_required_cooldown_minutes_rejected
    claim_type: required_fields
    grounds:
    - entities.TestBench.fields.cooldown_minutes
    - validations[priority=6]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: cooldown_minutes has source input with no default, so omitting it is a 400 ERR_INVALID_REQUEST rather than an implicit 0 — unlike TestBench.reserved_minutes_total, which is computed
      and defaults to 0.
    test_recipe:
      setup:
      - No TestBench rows exist.
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      trigger:
      - call: POST /ladder-ops/test-benches
        payload:
          bench_code: BENCH-9
          max_load_capacity_lb: 5000
        as: TestLabTechnician
      assert:
      - HTTP status == 400
      - response.data.error_id == ERR_INVALID_REQUEST
      - GET /ladder-ops/bench-reservations?test_bench_id is unusable because no bench was created; the request created no TestBench row
  - name: product_document_defaults_applied_when_optional_fields_omitted
    claim_type: defaults
    grounds:
    - entities.ProductDocument.fields.pictogram_count
    - entities.ProductDocument.fields.includes_assembly_instructions
    - entities.ProductDocument.fields.status
    distinguishing_aspect: Omitting pictogram_count and includes_assembly_instructions on a CONSUMER_SAFETY_SHEET applies the declared defaults 0 and false, and status defaults to DRAFT with approved_at
      still null.
    test_recipe:
      setup:
      - Product FG-EXT-24-IA exists in design_status DRAFT.
      - No ProductDocument rows exist for it.
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-EXT-24-IA
          product_type: EXTENSION_LADDER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-FG24IA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          p1: $.data.id
          p1v: $.data.version
      trigger:
      - call: POST /ladder-ops/product-documents
        payload:
          product_id: ${p1}
          doc_kind: CONSUMER_SAFETY_SHEET
          document_version: '1.0'
          text_digest: sha256:consumer_saf
        as: ComplianceOfficer
        captures:
          dx: $.data.id
      assert:
      - HTTP status == 201
      - ProductDocument.${dx}.pictogram_count == 0
      - ProductDocument.${dx}.includes_assembly_instructions == false
      - ProductDocument.${dx}.placement_zone == null
      - ProductDocument.${dx}.status == DRAFT
      - ProductDocument.${dx}.approved_at == null
      - ProductDocument.${dx}.version == 1
  - name: production_lot_counter_fields_are_computed_at_create
    claim_type: computed_fields
    grounds:
    - entities.ProductionLot.fields.produced_units
    - entities.ProductionLot.fields.units_wip
    - entities.ProductionLot.fields.required_joint_sample_count
    - entities.ProductionLot.fields.conformance_index
    distinguishing_aspect: 'At lot creation every counter is computed, not input: produced_units and all four unit buckets are 0, required_joint_sample_count is 0 (not the max(4, ...) floor, which is only
      derived at start-production) and conformance_index is null.'
    test_recipe:
      setup:
      - Product FG-EXT-24-IA is DESIGN_FROZEN on revision A.
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
