              payload: { sub_block_id: "${gen_sb_id}", attendee_id: "${att3_id}", check_in_date: "2026-09-15", check_out_date: "2026-09-17", occupants: 1 }
              as: Attendee
              as_user_id: "${att3_id}"
          assert:
            - "first trigger call returns HTTP 201"
            - "Reservation.${resB_id}.reservation_status == CONFIRMED"
            - "Reservation.${resB_id}.room_nights == 2"
            - "Reservation.${resB_id}.total_room_charge_cents == 50260"
            - "second trigger call returns HTTP 409 with response.data.error_id == ERR_SUB_BLOCK_NIGHT_CAPACITY_EXCEEDED"
            - "SubBlock.${gen_sb_id}.committed_rooms == 1"
            - "SubBlock.${gen_sb_id}.available_rooms == 0"
            - "SubBlock.${gen_sb_id}.inventory_status == FULL"
            - "GET /housing/reservations?sub_block_id=${gen_sb_id} returns total_count == 2"

      - name: attendee_closed_buffered_stay_overlap_rejects_one_day_gap
        grounds:
          - calculations.attendee_stay_overlap_check
          - validations[priority=75]
          - errors[ERR_ATTENDEE_STAY_OVERLAP]
        distinguishing_aspect: |
          Different resource entity (the Attendee, not the room inventory) AND different interval
          geometry: the existing stay is inflated by SHOULDER_BUFFER_DAYS 1 on both ends and compared
          as a CLOSED interval, so a 2026-09-17..2026-09-18 stay a full day after a
          2026-09-14..2026-09-16 stay still collides — the exact configuration the half-open
          per-night capacity rule would happily admit (the sub-block has 2 rooms free every night).
        test_recipe:
          setup:
            - "OPEN block with an APPROVED GENERAL sub-block of 2 rooms, so no night ever reaches its allotment and the fiscal capacity rule cannot fire."
            - "Attendee 1 already holds one CONFIRMED stay 2026-09-14..2026-09-16, whose buffered closed interval is 2026-09-13..2026-09-17."
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block_id: $.data.id, block_v1: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/contract"
              payload: { confirmation_number: "CN-SUM26-001" }
              as: HotelManager
              as_user_id: "${hotel_id}"
              captures: { block_v3: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/sub-blocks"
              payload: { segment: "GENERAL", allotted_rooms: 2, expected_hotel_block_version: "${block_v3}" }
              as: BureauCoordinator
              as_user_id: "coord-1"
              captures: { gen_sb_id: $.data.id }
            - call: "POST /housing/hotel-blocks/${block_id}/open"
              payload: {}
              as: BureauCoordinator
            - call: "POST /housing/attendees"
              payload: { event_id: "${event_id}", email: "a1@example.com", full_name: "Attendee One", registration_id: "REG-1", attendee_type: "GENERAL" }
              as: BureauCoordinator
              captures: { att1_id: $.data.id }
            - call: "POST /housing/reservations"
              payload: { sub_block_id: "${gen_sb_id}", attendee_id: "${att1_id}", check_in_date: "2026-09-14", check_out_date: "2026-09-16", occupants: 1 }
              as: Attendee
              as_user_id: "${att1_id}"
              captures: { resA_id: $.data.id }
          trigger:
            - call: "POST /housing/reservations"
              payload: { sub_block_id: "${gen_sb_id}", attendee_id: "${att1_id}", check_in_date: "2026-09-17", check_out_date: "2026-09-18", occupants: 1 }
              as: Attendee
              as_user_id: "${att1_id}"
          assert:
            - "response HTTP status == 409"
            - "response.data.error_id == ERR_ATTENDEE_STAY_OVERLAP"
            - "SubBlock.${gen_sb_id}.committed_rooms == 1"
            - "SubBlock.${gen_sb_id}.available_rooms == 1"
            - "GET /housing/reservations?attendee_id=${att1_id} returns total_count == 1"
            - "Reservation.${resA_id}.reservation_status == CONFIRMED"

  # =====================================================================================
  # RULE 9 — compensating-action invariants over DIFFERENT conserved quantities
  #   instance 1: conserved quantity = rooms per night (physical inventory)
  #   instance 2: conserved quantity = collected commission cash (money ledger)
  # =====================================================================================
  - rule_id: compensating_invariant
    instances:
      - name: sub_block_reject_restores_room_per_night_conservation
        grounds:
          - state_machines.SubBlock.PENDING_APPROVAL_to_REJECTED
          - entities.HotelBlock.fields.unassigned_rooms_per_night
          - entities.HotelBlock.fields.released_rooms_per_night
          - entities.SubBlock.fields.allotted_rooms
        distinguishing_aspect: |
          Conserved quantity: rooms per night. The carve is the forward action and the controller's
          rejection is its compensating action, and afterwards the block invariant
          contracted_rooms_per_night == unassigned_rooms_per_night + released_rooms_per_night +
          SUM(SubBlock.allotted_rooms) must hold at 10 == 4 + 0 + (6 + 0), with the 4 rooms back in
          unassigned inventory rather than leaked into released_rooms_per_night.
        test_recipe:
          setup:
            - "One CONTRACTED block of 10 rooms per night with one APPROVED GENERAL sub-block of 6 rooms, so unassigned_rooms_per_night == 4 and released_rooms_per_night == 0."
            - "The block version is re-read immediately before the carve so the OCC input is current."
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block_id: $.data.id, block_v1: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/contract"
              payload: { confirmation_number: "CN-SUM26-001" }
              as: HotelManager
              as_user_id: "${hotel_id}"
              captures: { block_v3: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/sub-blocks"
              payload: { segment: "GENERAL", allotted_rooms: 6, expected_hotel_block_version: "${block_v3}" }
              as: BureauCoordinator
              as_user_id: "coord-1"
              captures: { gen_sb_id: $.data.id }
            - call: "GET /housing/hotel-blocks/${block_id}"
              payload: {}
              as: BureauCoordinator
              captures: { block_v4: $.data.version }
          trigger:
            - call: "POST /housing/hotel-blocks/${block_id}/sub-blocks"
              payload: { segment: "STAFF", allotted_rooms: 4, eligibility_code: "STAFF-CORE", expected_hotel_block_version: "${block_v4}" }
              as: BureauCoordinator
              as_user_id: "coord-1"
              captures: { staff_sb_id: $.data.id }
            - call: "POST /housing/sub-blocks/${staff_sb_id}/reject"
              payload: {}
              as: BureauController
              as_user_id: "ctrl-1"
          assert:
            - "SubBlock.${staff_sb_id}.approval_status == REJECTED"
            - "SubBlock.${staff_sb_id}.allotted_rooms == 0"
            - "SubBlock.${gen_sb_id}.allotted_rooms == 6"
            - "HotelBlock.${block_id}.unassigned_rooms_per_night == 4"
            - "HotelBlock.${block_id}.released_rooms_per_night == 0"
            - "HotelBlock.${block_id}.contracted_rooms_per_night == 10"
            - "invariant holds: 10 == 4 + 0 + (6 + 0)"

      - name: commission_payment_reversal_restores_collected_cash_ledger
        grounds:
          - state_machines.CommissionInvoice.ISSUED_to_PAID
          - state_machines.CommissionInvoice.PARTIALLY_PAID_to_ISSUED
          - entities.Event.fields.commission_collected_cents
          - entities.CommissionInvoice.fields.outstanding_cents
          - calculations.commission_due
        distinguishing_aspect: |
          A different conserved quantity — collected commission cash, not rooms: the payment of
          15768 cents and its full reversal must leave Event.commission_collected_cents back at 0,
          CommissionInvoice.paid_cents at 0 and outstanding_cents back at the untouched
          commission_due_cents 15768, with the invoice status walking ISSUED -> PAID -> ISSUED and
          written_off_cents never moving.
        test_recipe:
          setup:
            - "Block of 10 rooms at 21900 cents with commission_pct 0.12; two CONFIRMED reservations of 4 and 2 room nights -> 131400 pre-tax cents -> bureau commission 15768 cents."
            - "Clock advanced to the cutoff, block swept to CUTOFF_PASSED, and a BUREAU_CONFIRMED invoice issued with outstanding_cents 15768 (no pickup report exists, so variance_cents is null)."
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block_id: $.data.id, block_v1: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/contract"
              payload: { confirmation_number: "CN-SUM26-001" }
              as: HotelManager
              as_user_id: "${hotel_id}"
              captures: { block_v3: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/sub-blocks"
              payload: { segment: "GENERAL", allotted_rooms: 6, expected_hotel_block_version: "${block_v3}" }
              as: BureauCoordinator
              as_user_id: "coord-1"
              captures: { gen_sb_id: $.data.id }
            - call: "POST /housing/hotel-blocks/${block_id}/open"
              payload: {}
              as: BureauCoordinator
            - call: "POST /housing/attendees"
              payload: { event_id: "${event_id}", email: "a1@example.com", full_name: "Attendee One", registration_id: "REG-1", attendee_type: "GENERAL" }
              as: BureauCoordinator
              captures: { att1_id: $.data.id }
            - call: "POST /housing/attendees"
              payload: { event_id: "${event_id}", email: "a2@example.com", full_name: "Attendee Two", registration_id: "REG-2", attendee_type: "GENERAL" }
              as: BureauCoordinator
              captures: { att2_id: $.data.id }
            - call: "POST /housing/reservations"
              payload: { sub_block_id: "${gen_sb_id}", attendee_id: "${att1_id}", check_in_date: "2026-09-14", check_out_date: "2026-09-18", occupants: 1 }
              as: Attendee
              as_user_id: "${att1_id}"
              captures: { res1_id: $.data.id }
            - call: "POST /housing/reservations"
              payload: { sub_block_id: "${gen_sb_id}", attendee_id: "${att2_id}", check_in_date: "2026-09-15", check_out_date: "2026-09-17", occupants: 1 }
              as: Attendee
              as_user_id: "${att2_id}"
              captures: { res2_id: $.data.id }
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: BureauCoordinator
            - call: "POST /housing/hotel-blocks/${block_id}/cutoff"
              payload: {}
              as: BureauCoordinator
            - call: "POST /housing/hotel-blocks/${block_id}/commission-invoice"
              payload: { basis: "BUREAU_CONFIRMED" }
              as: BureauCoordinator
              captures: { inv_id: $.data.id, due_cents: $.data.commission_due_cents }
          trigger:
            - call: "POST /housing/commission-invoices/${inv_id}/payments"
              payload: { amount_cents: 15768, reference: "WIRE-001" }
              as: HotelManager
              as_user_id: "${hotel_id}"
            - call: "POST /housing/commission-invoices/${inv_id}/payment-reversals"
              payload: { amount_cents: 15768, reference: "WIRE-001-REV" }
              as: BureauController
              as_user_id: "ctrl-1"
          assert:
            - "${due_cents} == 15768"
            - "after the payment CommissionInvoice.${inv_id}.status == PAID and Event.${event_id}.commission_collected_cents == 15768"
            - "CommissionInvoice.${inv_id}.status == ISSUED"
            - "CommissionInvoice.${inv_id}.paid_cents == 0"
            - "CommissionInvoice.${inv_id}.written_off_cents == 0"
            - "CommissionInvoice.${inv_id}.commission_due_cents == 15768"
            - "CommissionInvoice.${inv_id}.outstanding_cents == 15768"
            - "CommissionInvoice.${inv_id}.billable_room_nights == 6"
            - "CommissionInvoice.${inv_id}.rebate_due_cents == 4200"
            - "Event.${event_id}.commission_collected_cents == 0"
