            - "Office.${o_id}.valid_votes_count == 3"
            - "Candidacy.${c_a_id}.raw_votes_count == 2"
            - "Candidacy.${c_a_id}.provisional_share_pct == 40.00"
            - "Candidacy.${c_a_id}.certified_share_pct == 66.67"
