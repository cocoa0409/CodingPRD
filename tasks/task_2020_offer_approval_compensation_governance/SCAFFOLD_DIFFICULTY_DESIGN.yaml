              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /api/clearance-checks/${bg_id}/transition"
              payload: { to: IN_PROGRESS }
              as: BackgroundScreener
              as_user_id: scr-1
            - call: "POST /api/clearance-checks/${bg_id}/transition"
              payload: { to: CLEARED }
              as: BackgroundScreener
              as_user_id: scr-1
            - call: "GET /api/offers/${offer_id}"
              as: Recruiter
              as_user_id: rec-1
              captures: { mid_status: $.data.status, mid_posture: $.data.clearance_posture }
