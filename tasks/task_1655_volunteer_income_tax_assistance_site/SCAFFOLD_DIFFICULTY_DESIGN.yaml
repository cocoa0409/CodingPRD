# §1.8 Scaffold Difficulty Design — VITA site
# Nine Difficulty Rules × 2 instances each. All chains start from empty-DB.
# Logical clock default 2026-08-01T00:00:00Z is used throughout (no wall-clock waits).
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: refund_estimate_vs_final_diverge
        grounds:
          - calculations.refund_estimate
          - calculations.refund_final
          - entities.TaxReturn.fields.estimated_refund_cents
          - entities.TaxReturn.fields.final_refund_cents
        distinguishing_aspect: |
          TaxReturn domain: the provisional variant (flat 15% EITC capped at
          600000, no liability, reported withholding) and the final variant
          (tiered EITC 10/20/25% with per-tier caps, 12% liability, verified
          withholding) produce DIFFERENT refunds for identical inputs:
          450000 vs 310000.
        test_recipe:
          setup:
            - "Certified OPEN site with active coordinator, screener, preparer (ETHICS+BASIC), reviewer (ETHICS+INTAKE_QR+ADVANCED)"
            - "Verified taxpayer with CHECKED_IN appointment 2026-08-03 10:00-11:00"
            - "Return created; patched with wages=2000000, earned=2000000, other=0, withholding reported=verified=150000, children=1, DIRECT_DEPOSIT"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Coord Ann", email: "coord@x.org", is_coordinator: true }, as: SponsorAdmin, captures: { coord_id: $.data.id, coord_v: $.data.version } }
            - { call: "POST /volunteers/${coord_id}/certifications", payload: { test_type: ETHICS, score: 95, tax_season: 2026, expected_volunteer_version: "${coord_v}" }, as: SponsorAdmin }
            - { call: "POST /volunteers/${coord_id}/state", payload: { to_status: ACTIVE }, as: SponsorAdmin }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: CERTIFIED }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: OPEN }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Screen Sam", email: "scr@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { scr_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Prep Pat", email: "prep@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_id: $.data.id, prep_v: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: ETHICS, score: 90, tax_season: 2026, expected_volunteer_version: "${prep_v}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /volunteers/${prep_id}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_v2: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: BASIC, score: 88, tax_season: 2026, expected_volunteer_version: "${prep_v2}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers/${prep_id}/state", payload: { to_status: ACTIVE }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Rev Rita", email: "rev@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { rev_id: $.data.id, rev_v: $.data.version } }
            - { call: "POST /volunteers/${rev_id}/certifications", payload: { test_type: ETHICS, score: 90, tax_season: 2026, expected_volunteer_version: "${rev_v}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /volunteers/${rev_id}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { rev_v2: $.data.version } }
            - { call: "POST /volunteers/${rev_id}/certifications", payload: { test_type: INTAKE_QR, score: 92, tax_season: 2026, expected_volunteer_version: "${rev_v2}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /volunteers/${rev_id}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { rev_v3: $.data.version } }
            - { call: "POST /volunteers/${rev_id}/certifications", payload: { test_type: ADVANCED, score: 85, tax_season: 2026, expected_volunteer_version: "${rev_v3}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers/${rev_id}/state", payload: { to_status: ACTIVE }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /taxpayers", payload: { full_name: "Taxpayer One", ssn_token: "SSN-001", phone: "555-0101" }, as: Screener, as_user_id: "${scr_id}", captures: { tp_id: $.data.id } }
            - { call: "POST /taxpayers/${tp_id}/verify-identity", payload: { id_document_type: DRIVERS_LICENSE }, as: Screener, as_user_id: "${scr_id}" }
            - { call: "POST /appointments", payload: { site_id: "${site_id}", taxpayer_id: "${tp_id}", volunteer_id: "${prep_id}", purpose: PREPARATION, start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T11:00:00Z" }, as: Screener, as_user_id: "${scr_id}", captures: { appt_id: $.data.id } }
            - { call: "POST /appointments/${appt_id}/state", payload: { to_status: CHECKED_IN }, as: Screener, as_user_id: "${scr_id}" }
            - { call: "POST /tax-returns", payload: { appointment_id: "${appt_id}", tax_year: 2025, filing_status: SINGLE }, as: Preparer, as_user_id: "${prep_id}", captures: { ret_id: $.data.id, ret_v: $.data.version } }
            - { call: "PATCH /tax-returns/${ret_id}", payload: { documents_received: ["PHOTO_ID", "SSN_CARD", "W2", "BANK_INFO"], interview_confirmed: true, wages_cents: 2000000, other_income_cents: 0, earned_income_cents: 2000000, qualifying_children: 1, withholding_reported_cents: 150000, withholding_verified_cents: 150000, refund_method: DIRECT_DEPOSIT, expected_return_version: "${ret_v}" }, as: Preparer, as_user_id: "${prep_id}", captures: { ret_v2: $.data.version, est_seen: $.data.estimated_refund_cents } }
          trigger:
            - { call: "POST /tax-returns/${ret_id}/state", payload: { to_status: IN_PREPARATION }, as: Preparer, as_user_id: "${prep_id}" }
            - { call: "POST /tax-returns/${ret_id}/state", payload: { to_status: PENDING_QR }, as: Preparer, as_user_id: "${prep_id}", captures: { final_seen: $.data.final_refund_cents } }
          assert:
            - "TaxReturn.${ret_id}.estimated_refund_cents == 450000 after the PATCH (150000 + min(0.15*2000000, 600000))"
            - "TaxReturn.${ret_id}.final_refund_cents == 310000 after submit-for-review (150000 + min(0.20*2000000, 400000) - 0.12*2000000)"
            - "estimated_refund_cents (450000) != final_refund_cents (310000) for identical wage/withholding inputs"

      - name: report_first_pass_vs_final_resolution_diverge
        grounds:
          - calculations.site_report_aggregates
          - entities.SiteReport.fields.first_pass_acceptance_rate_bp
          - entities.SiteReport.fields.final_resolution_rate_bp
        distinguishing_aspect: |
          SiteReport domain (distinct from the TaxReturn refund domain): the
          first-pass variant counts only returns whose FIRST acknowledgement was
          ACCEPTED (3333 bp), while the final-resolution variant counts returns
          currently ACCEPTED/COMPLETED (6667 bp) — the same three transmitted
          returns yield two different rates because one return was rejected,
          reworked, and then accepted.
        test_recipe:
          setup:
            - "Certified OPEN site (capacity 4) with coordinator, screener, preparer, reviewer"
            - "Return A: transmitted then ACCEPTED on first acknowledgement"
            - "Return B: transmitted, REJECTED (R0000-503), rejection RESOLVED, reworked, re-transmitted, ACCEPTED"
            - "Return C: transmitted, REJECTED, left REJECTED"
            - "All three returns use PAPER_CHECK (no allocations needed); each has its own verified taxpayer and own appointment on 2026-08-03/04/05"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Coord Ann", email: "coord@x.org", is_coordinator: true }, as: SponsorAdmin, captures: { coord_id: $.data.id, coord_v: $.data.version } }
            - { call: "POST /volunteers/${coord_id}/certifications", payload: { test_type: ETHICS, score: 95, tax_season: 2026, expected_volunteer_version: "${coord_v}" }, as: SponsorAdmin }
            - { call: "POST /volunteers/${coord_id}/state", payload: { to_status: ACTIVE }, as: SponsorAdmin }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: CERTIFIED }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: OPEN }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Screen Sam", email: "scr@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { scr_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Prep Pat", email: "prep@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_id: $.data.id, prep_v: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: ETHICS, score: 90, tax_season: 2026, expected_volunteer_version: "${prep_v}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /volunteers/${prep_id}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_v2: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: BASIC, score: 88, tax_season: 2026, expected_volunteer_version: "${prep_v2}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers/${prep_id}/state", payload: { to_status: ACTIVE }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Rev Rita", email: "rev@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { rev_id: $.data.id, rev_v: $.data.version } }
            - { call: "POST /volunteers/${rev_id}/certifications", payload: { test_type: ETHICS, score: 90, tax_season: 2026, expected_volunteer_version: "${rev_v}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /volunteers/${rev_id}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { rev_v2: $.data.version } }
            - { call: "POST /volunteers/${rev_id}/certifications", payload: { test_type: INTAKE_QR, score: 92, tax_season: 2026, expected_volunteer_version: "${rev_v2}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /volunteers/${rev_id}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { rev_v3: $.data.version } }
            - { call: "POST /volunteers/${rev_id}/certifications", payload: { test_type: ADVANCED, score: 85, tax_season: 2026, expected_volunteer_version: "${rev_v3}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers/${rev_id}/state", payload: { to_status: ACTIVE }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            # --- Return A: accept on first ack ---
            - { call: "POST /taxpayers", payload: { full_name: "Tp A", ssn_token: "SSN-A", phone: "555-1001" }, as: Screener, as_user_id: "${scr_id}", captures: { tp_a: $.data.id } }
            - { call: "POST /taxpayers/${tp_a}/verify-identity", payload: { id_document_type: PASSPORT }, as: Screener, as_user_id: "${scr_id}" }
            - { call: "POST /appointments", payload: { site_id: "${site_id}", taxpayer_id: "${tp_a}", volunteer_id: "${prep_id}", purpose: PREPARATION, start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T11:00:00Z" }, as: Screener, as_user_id: "${scr_id}", captures: { appt_a: $.data.id } }
            - { call: "POST /appointments/${appt_a}/state", payload: { to_status: CHECKED_IN }, as: Screener, as_user_id: "${scr_id}" }
            - { call: "POST /tax-returns", payload: { appointment_id: "${appt_a}", tax_year: 2025, filing_status: SINGLE }, as: Preparer, as_user_id: "${prep_id}", captures: { ret_a: $.data.id, ret_a_v: $.data.version } }
            - { call: "PATCH /tax-returns/${ret_a}", payload: { documents_received: ["PHOTO_ID", "SSN_CARD", "W2"], interview_confirmed: true, wages_cents: 1000000, earned_income_cents: 1000000, withholding_reported_cents: 100000, withholding_verified_cents: 100000, expected_return_version: "${ret_a_v}" }, as: Preparer, as_user_id: "${prep_id}" }
            - { call: "POST /tax-returns/${ret_a}/state", payload: { to_status: IN_PREPARATION }, as: Preparer, as_user_id: "${prep_id}" }
            - { call: "POST /tax-returns/${ret_a}/state", payload: { to_status: PENDING_QR }, as: Preparer, as_user_id: "${prep_id}" }
            - { call: "POST /tax-returns/${ret_a}/state", payload: { to_status: QR_PASSED }, as: QualityReviewer, as_user_id: "${rev_id}" }
            - { call: "POST /tax-returns/${ret_a}/state", payload: { to_status: TRANSMITTED }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /tax-returns/${ret_a}/state", payload: { to_status: ACCEPTED }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            # --- Return B: reject, resolve, rework, retransmit, accept ---
            - { call: "POST /taxpayers", payload: { full_name: "Tp B", ssn_token: "SSN-B", phone: "555-1002" }, as: Screener, as_user_id: "${scr_id}", captures: { tp_b: $.data.id } }
            - { call: "POST /taxpayers/${tp_b}/verify-identity", payload: { id_document_type: STATE_ID }, as: Screener, as_user_id: "${scr_id}" }
            - { call: "POST /appointments", payload: { site_id: "${site_id}", taxpayer_id: "${tp_b}", volunteer_id: "${prep_id}", purpose: PREPARATION, start_at: "2026-08-04T10:00:00Z", end_at: "2026-08-04T11:00:00Z" }, as: Screener, as_user_id: "${scr_id}", captures: { appt_b: $.data.id } }
            - { call: "POST /appointments/${appt_b}/state", payload: { to_status: CHECKED_IN }, as: Screener, as_user_id: "${scr_id}" }
            - { call: "POST /tax-returns", payload: { appointment_id: "${appt_b}", tax_year: 2025, filing_status: SINGLE }, as: Preparer, as_user_id: "${prep_id}", captures: { ret_b: $.data.id, ret_b_v: $.data.version } }
            - { call: "PATCH /tax-returns/${ret_b}", payload: { documents_received: ["PHOTO_ID", "SSN_CARD", "W2"], interview_confirmed: true, wages_cents: 1000000, earned_income_cents: 1000000, withholding_reported_cents: 100000, withholding_verified_cents: 100000, expected_return_version: "${ret_b_v}" }, as: Preparer, as_user_id: "${prep_id}" }
            - { call: "POST /tax-returns/${ret_b}/state", payload: { to_status: IN_PREPARATION }, as: Preparer, as_user_id: "${prep_id}" }
            - { call: "POST /tax-returns/${ret_b}/state", payload: { to_status: PENDING_QR }, as: Preparer, as_user_id: "${prep_id}" }
            - { call: "POST /tax-returns/${ret_b}/state", payload: { to_status: QR_PASSED }, as: QualityReviewer, as_user_id: "${rev_id}" }
            - { call: "POST /tax-returns/${ret_b}/state", payload: { to_status: TRANSMITTED }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /tax-returns/${ret_b}/state", payload: { to_status: REJECTED, rejection_code: "R0000-503", rejection_text: "Spouse SSN mismatch" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /tax-returns/${ret_b}/rejections", as: QualityReviewer, as_user_id: "${rev_id}", captures: { rej_b: "$.data[0].id" } }
            - { call: "POST /efile-rejections/${rej_b}/follow-up", payload: { outcome: RESOLVED, resolution_note: "Taxpayer confirmed SSN; corrected" }, as: QualityReviewer, as_user_id: "${rev_id}" }
            - { call: "POST /tax-returns/${ret_b}/state", payload: { to_status: IN_PREPARATION }, as: Preparer, as_user_id: "${prep_id}" }
            - { call: "POST /tax-returns/${ret_b}/state", payload: { to_status: PENDING_QR }, as: Preparer, as_user_id: "${prep_id}" }
            - { call: "POST /tax-returns/${ret_b}/state", payload: { to_status: QR_PASSED }, as: QualityReviewer, as_user_id: "${rev_id}" }
            - { call: "POST /tax-returns/${ret_b}/state", payload: { to_status: TRANSMITTED }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /tax-returns/${ret_b}/state", payload: { to_status: ACCEPTED }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            # --- Return C: reject, leave open ---
            - { call: "POST /taxpayers", payload: { full_name: "Tp C", ssn_token: "SSN-C", phone: "555-1003" }, as: Screener, as_user_id: "${scr_id}", captures: { tp_c: $.data.id } }
            - { call: "POST /taxpayers/${tp_c}/verify-identity", payload: { id_document_type: MILITARY_ID }, as: Screener, as_user_id: "${scr_id}" }
            - { call: "POST /appointments", payload: { site_id: "${site_id}", taxpayer_id: "${tp_c}", volunteer_id: "${prep_id}", purpose: PREPARATION, start_at: "2026-08-05T10:00:00Z", end_at: "2026-08-05T11:00:00Z" }, as: Screener, as_user_id: "${scr_id}", captures: { appt_c: $.data.id } }
            - { call: "POST /appointments/${appt_c}/state", payload: { to_status: CHECKED_IN }, as: Screener, as_user_id: "${scr_id}" }
            - { call: "POST /tax-returns", payload: { appointment_id: "${appt_c}", tax_year: 2025, filing_status: HEAD_OF_HOUSEHOLD }, as: Preparer, as_user_id: "${prep_id}", captures: { ret_c: $.data.id, ret_c_v: $.data.version } }
            - { call: "PATCH /tax-returns/${ret_c}", payload: { documents_received: ["PHOTO_ID", "SSN_CARD", "W2"], interview_confirmed: true, wages_cents: 800000, earned_income_cents: 800000, withholding_reported_cents: 50000, withholding_verified_cents: 50000, expected_return_version: "${ret_c_v}" }, as: Preparer, as_user_id: "${prep_id}" }
            - { call: "POST /tax-returns/${ret_c}/state", payload: { to_status: IN_PREPARATION }, as: Preparer, as_user_id: "${prep_id}" }
            - { call: "POST /tax-returns/${ret_c}/state", payload: { to_status: PENDING_QR }, as: Preparer, as_user_id: "${prep_id}" }
            - { call: "POST /tax-returns/${ret_c}/state", payload: { to_status: QR_PASSED }, as: QualityReviewer, as_user_id: "${rev_id}" }
            - { call: "POST /tax-returns/${ret_c}/state", payload: { to_status: TRANSMITTED }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /tax-returns/${ret_c}/state", payload: { to_status: REJECTED, rejection_code: "IND-507", rejection_text: "Dependent already claimed" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
          trigger:
            - { call: "POST /sites/${site_id}/reports", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { rp_first: $.data.first_pass_acceptance_rate_bp, rp_final: $.data.final_resolution_rate_bp, rp_trans: $.data.returns_transmitted_count } }
          assert:
            - "SiteReport.returns_transmitted_count == 3"
            - "SiteReport.first_pass_accepted_count == 1 (only return A)"
            - "SiteReport.returns_accepted_count == 2 (A and B)"
            - "SiteReport.first_pass_acceptance_rate_bp == 3333 (round_half_up(1*10000/3))"
            - "SiteReport.final_resolution_rate_bp == 6667 (round_half_up(2*10000/3))"
            - "first_pass_acceptance_rate_bp (3333) != final_resolution_rate_bp (6667) for identical underlying data"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: eitc_final_tier_cap_composition
        grounds:
          - calculations.refund_final
        distinguishing_aspect: |
          Mode (a): a >=3-input formula with non-linear interaction — tier
          selection on qualifying_children (2 -> 25% tier), nested
          min(round(0.25*3000000), 650000) where the cap binds, then a 12%
          liability on wages+other and a max(0, ...) floor; changing any one of
          the five inputs changes the branch or the bound that binds.
        test_recipe:
          setup:
            - "Certified OPEN site; preparer and reviewer active; verified taxpayer with CHECKED_IN appointment 2026-08-03"
            - "Return created with filing_status HEAD_OF_HOUSEHOLD; patched wages=3000000, other=500000, earned=3000000, verified withholding=200000, children=2"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Coord Ann", email: "coord@x.org", is_coordinator: true }, as: SponsorAdmin, captures: { coord_id: $.data.id, coord_v: $.data.version } }
            - { call: "POST /volunteers/${coord_id}/certifications", payload: { test_type: ETHICS, score: 95, tax_season: 2026, expected_volunteer_version: "${coord_v}" }, as: SponsorAdmin }
            - { call: "POST /volunteers/${coord_id}/state", payload: { to_status: ACTIVE }, as: SponsorAdmin }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: CERTIFIED }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: OPEN }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Screen Sam", email: "scr@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { scr_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Prep Pat", email: "prep@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_id: $.data.id, prep_v: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: ETHICS, score: 90, tax_season: 2026, expected_volunteer_version: "${prep_v}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /volunteers/${prep_id}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_v2: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: BASIC, score: 88, tax_season: 2026, expected_volunteer_version: "${prep_v2}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers/${prep_id}/state", payload: { to_status: ACTIVE }, as: SiteCoordinator, as_user_id: "${coord_id}" }
