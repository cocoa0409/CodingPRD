        distinguishing_aspect: "POSSESSION perfection is allowed only on a PAPER receipt, and its side effects differ from ELECTRONIC_CONTROL: holder_party_id moves to the lender while registry_control_party_id stays null, and 290482 is committed against the 50000000 credit line."
        test_recipe:
          setup:
            - "Licensed warehouse; PAPER NEGOTIABLE receipt WR-0004 for 949 bushels of US_NO_1; lender AgCredit Bank with a 50000000 credit line."
            - "Clock at 2026-08-20T09:00:00Z so PROVISIONAL storage is 5314 and receiving 5694; a MARK_TO_MARKET lien at 450 c/bu is REQUESTED."
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_len
            - *b_agr
            - *b_bin
            - *b_tk
