            - "Site Bravo's 100 MW application over 2030-01-01..2030-06-30 STUDY_COMPLETE (diversified 92.2 MW, within the 10% restudy tolerance); its window starts 2030-01-01 which is inside Site Alpha's buffered end 2030-03-31, so the two windows overlap."
