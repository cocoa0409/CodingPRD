              as: ReleaseManager
              captures: { cs_sod_first_id: $.data.id }
            - call: "POST /platform/change-sets/${cs_sod_first_id}/validate"
              payload: {}
              as: ReleaseManager
            - call: "POST /platform/change-sets/${cs_sod_first_id}/approve"
              payload: {}
              as: PlatformAdmin
              as_user_id: "0050a0000aaa01"
            - call: "POST /platform/change-sets"
              payload: { source_environment_id: "${env_sod_s_id}", target_environment_id: "${env_sod_t2_id}", component_list: [{ component: "acme_layout", version_tag: 1 }], component_dependencies: [], expected_environment_version: "${env_sod_t2_v}" }
              as: ReleaseManager
              captures: { cs_sod_second_id: $.data.id }
            - call: "POST /platform/change-sets/${cs_sod_second_id}/validate"
              payload: {}
              as: ReleaseManager
          trigger:
            - call: "POST /platform/change-sets/${cs_sod_second_id}/approve"
              payload: {}
              as: PlatformAdmin
              as_user_id: "0050a0000aaa01"
              captures: { err_sod: $.data.error_id }
            - call: "POST /platform/change-sets/${cs_sod_second_id}/approve"
              payload: {}
              as: PlatformAdmin
              as_user_id: "0050a0000aaa02"
          assert:
            - "MetadataChangeSet.${cs_sod_first_id}.approved_by_user_id == \"0050a0000aaa01\""
            - "the same-operator approval returns error_id ERR_SEGREGATION_OF_DUTIES with http 403"
            - "MetadataChangeSet.${cs_sod_second_id}.status remains VALIDATED after the refusal and component_digests is still {}"
            - "the approval by a different operator succeeds with MetadataChangeSet.${cs_sod_second_id}.status == APPROVED and approved_by_user_id == \"0050a0000aaa02\""

      - name: apply_release_before_scheduling_returns_invalid_state
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - state_machines.Environment.SCHEDULED_to_RELEASED
          - endpoints.POST_/platform/environments/{id}/apply-release
        distinguishing_aspect: "The environment release gate is evaluated before any business rule: applying a release to an environment that has not been scheduled returns ERR_INVALID_STATE at 409 rather than a business error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox still in CONFIG."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Unscheduled Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_us_id: $.data.id }
          trigger:
            - call: "POST /platform/environments/${env_us_id}/apply-release"
              payload: {}
              as: ReleaseManager
              captures: { err_us: $.data.error_id }
          assert:
            - "the response carries error_id ERR_INVALID_STATE with http 409"
            - "Environment.${env_us_id}.release_status remains CONFIG"
            - "Environment.${env_us_id}.applied_release_version is null and refresh_generation is 0"

      - name: duplicate_environment_name_returns_invalid_request
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.Environment.fields.name
          - endpoints.POST_/platform/environments
        distinguishing_aspect: "Name uniqueness is enforced across the whole environment collection: a second environment reusing an existing name is refused with ERR_INVALID_REQUEST at 400 while a different name on the same request shape succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox named Integration West."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Integration West", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_dup_id: $.data.id }
          trigger:
            - call: "POST /platform/environments"
              payload: { name: "Integration West", type: "PARTIAL", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { err_dup: $.data.error_id }
            - call: "POST /platform/environments"
              payload: { name: "Integration East", type: "PARTIAL", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_dup2_id: $.data.id }
          assert:
            - "the duplicate name returns error_id ERR_INVALID_REQUEST with http 400"
            - "the successful create returns http 201 with Environment.${env_dup2_id}.name == \"Integration East\""
            - "both environments are distinct rows, so the duplicate was rejected and not merged"

      - name: component_requires_absent_target_returns_missing_dependency
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_MISSING_COMPONENT_DEPENDENCY]
          - entities.MetadataChangeSet.fields.component_dependencies
          - endpoints.POST_/platform/change-sets/{id}/validate
        distinguishing_aspect: "A validation-time referential failure: a dependency edge naming a component absent from the list is refused with ERR_MISSING_COMPONENT_DEPENDENCY at 422, and the change set stays in DRAFT."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A DEVELOPER source sandbox and a DEVELOPER target sandbox."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Dangling Source", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_dg_s_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Dangling Target", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_dg_t_id: $.data.id, env_dg_t_v: $.data.version }
            - call: "POST /platform/change-sets"
              payload: { source_environment_id: "${env_dg_s_id}", target_environment_id: "${env_dg_t_id}", component_list: [{ component: "acme_controller", version_tag: 1 }], component_dependencies: [{ component: "acme_controller", requires: ["acme_missing"], min_version: 1 }], expected_environment_version: "${env_dg_t_v}" }
              as: ReleaseManager
              captures: { cs_dg_id: $.data.id }
          trigger:
            - call: "POST /platform/change-sets/${cs_dg_id}/validate"
              payload: {}
              as: ReleaseManager
              captures: { err_dg: $.data.error_id }
          assert:
            - "the response carries error_id ERR_MISSING_COMPONENT_DEPENDENCY with http 422"
            - "MetadataChangeSet.${cs_dg_id}.status remains DRAFT"
            - "MetadataChangeSet.${cs_dg_id}.validated_at is null"
            - "the component_list still holds exactly 1 entry, so the failed validation did not mutate the change set"

      - name: cyclic_component_graph_and_cyclic_callout_graph_return_cycle_detected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_CYCLE_DETECTED]
          - entities.MetadataChangeSet.fields.component_dependencies
          - entities.GovernorLimitRequest.fields.callout_graph
        distinguishing_aspect: "Cycle detection is shared across two different graphs on two different entities: a component dependency cycle fails validation and a callout graph cycle fails submission, both with ERR_CYCLE_DETECTED at 409."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A DEVELOPER source sandbox, a DEVELOPER target sandbox and a GovernorLimitRequest with acyclic-in-list but cyclic callout edges."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Cycle Source", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_cy_s_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Cycle Target", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_cy_t_id: $.data.id, env_cy_t_v: $.data.version }
            - call: "POST /platform/change-sets"
              payload: { source_environment_id: "${env_cy_s_id}", target_environment_id: "${env_cy_t_id}", component_list: [{ component: "acme_a", version_tag: 1 }, { component: "acme_b", version_tag: 1 }], component_dependencies: [{ component: "acme_a", requires: ["acme_b"], min_version: 1 }, { component: "acme_b", requires: ["acme_a"], min_version: 1 }], expected_environment_version: "${env_cy_t_v}" }
              as: ReleaseManager
              captures: { cs_cy_id: $.data.id }
            - call: "POST /platform/environments/${env_cy_t_id}/governor-limit-requests"
              payload: { request_kind: "QUEUEABLE", scope_count: 10, callout_graph: [{ node: "syncA", calls: ["syncB"] }, { node: "syncB", calls: ["syncA"] }], max_concurrent_jobs: 5 }
              as: AppDeveloper
              captures: { gov_cy_id: $.data.id }
          trigger:
            - call: "POST /platform/change-sets/${cs_cy_id}/validate"
              payload: {}
              as: ReleaseManager
              captures: { err_cy_comp: $.data.error_id }
            - call: "POST /platform/governor-limit-requests/${gov_cy_id}/submit"
              payload: {}
              as: AppDeveloper
              captures: { err_cy_call: $.data.error_id }
          assert:
            - "the cyclic component graph returns error_id ERR_CYCLE_DETECTED with http 409"
            - "the cyclic callout graph returns error_id ERR_CYCLE_DETECTED with http 409"
            - "MetadataChangeSet.${cs_cy_id}.status remains DRAFT and GovernorLimitRequest.${gov_cy_id}.status remains DRAFT"
            - "the same callout graph with a single edge syncA to syncB submits successfully afterwards, so the rejection is caused by the cycle and not by the edge count"

      - name: child_refresh_across_release_boundary_returns_release_mismatch
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors[ERR_RELEASE_MISMATCH]
          - entities.Environment.fields.parent_environment_id
          - endpoints.POST_/platform/refresh-jobs/{id}/complete-refresh
        distinguishing_aspect: "A cross-entity release-boundary check: a sandbox whose parent environment sits on SP26 while it itself has never been released is refused completion with ERR_RELEASE_MISMATCH at 409."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A DEVELOPER parent sandbox released onto SP26 and a DEVELOPER child sandbox created under it, never released."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Boundary Parent", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_bp_id: $.data.id }
            - call: "POST /platform/environments/${env_bp_id}/schedule-release"
              payload: { target_release_version: "SP26" }
              as: ReleaseManager
            - call: "POST /platform/environments/${env_bp_id}/apply-release"
              payload: {}
              as: ReleaseManager
            - call: "POST /platform/environments"
              payload: { name: "Boundary Child", type: "DEVELOPER", parent_environment_id: "${env_bp_id}", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_bc_id: $.data.id }
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_bc_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: EnvironmentAdmin
              captures: { rj_bc_id: $.data.id }
            - call: "POST /platform/refresh-jobs/${rj_bc_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
          trigger:
            - call: "POST /platform/refresh-jobs/${rj_bc_id}/complete-refresh"
              payload: {}
              as: EnvironmentAdmin
              captures: { err_boundary: $.data.error_id }
          assert:
            - "Environment.${env_bp_id}.applied_release_version == \"SP26\" and Environment.${env_bc_id}.applied_release_version is null"
            - "the completion returns error_id ERR_RELEASE_MISMATCH with http 409"
            - "RefreshJob.${rj_bc_id}.status remains COMPLETING and consumed_aperture == false"
            - "after the child is scheduled onto SP26 and applied, the same completion succeeds with RefreshJob status COMPLETED"

      - name: governor_ceiling_exceeded_on_second_acceptance
        claim_type: violation_to_error
        grounds:
          - validations[priority=23]
          - errors[ERR_GOVERNOR_LIMIT_EXCEEDED]
          - constants.ORG_GOVERNOR_CEILING_UNITS
          - endpoints.POST_/platform/governor-limit-requests/{id}/approve
        distinguishing_aspect: "The aggregate ceiling is evaluated against the sum of already accepted requests: 40000 units accepted plus a second request of 70000 pushes the environment past the 100000 ceiling and is refused."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox with two submitted requests of 40000 and 70000 units."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Ceiling Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_cl_id: $.data.id }
            - call: "POST /platform/environments/${env_cl_id}/governor-limit-requests"
              payload: { request_kind: "BATCH", scope_count: 20000, callout_graph: [], max_concurrent_jobs: 5 }
              as: AppDeveloper
              captures: { gov_cl1_id: $.data.id }
            - call: "POST /platform/environments/${env_cl_id}/governor-limit-requests"
              payload: { request_kind: "BATCH", scope_count: 35000, callout_graph: [], max_concurrent_jobs: 5 }
              as: AppDeveloper
              captures: { gov_cl2_id: $.data.id }
            - call: "POST /platform/governor-limit-requests/${gov_cl1_id}/submit"
              payload: {}
              as: AppDeveloper
            - call: "POST /platform/governor-limit-requests/${gov_cl2_id}/submit"
              payload: {}
              as: AppDeveloper
            - call: "POST /platform/governor-limit-requests/${gov_cl1_id}/approve"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /platform/governor-limit-requests/${gov_cl2_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { err_ceil: $.data.error_id }
          assert:
            - "GovernorLimitRequest.${gov_cl1_id}.projected_governor_units == 40000 and GovernorLimitRequest.${gov_cl2_id}.projected_governor_units == 70000"
            - "the second approval returns error_id ERR_GOVERNOR_LIMIT_EXCEEDED with http 402"
            - "GovernorLimitRequest.${gov_cl2_id}.status remains SUBMITTED"
            - "GovernorLimitRequest.${gov_cl1_id}.status == ACCEPTED and its governor_headroom_units == 60000"

      - name: governor_concurrency_ceiling_blocks_second_submission
        claim_type: violation_to_error
        grounds:
          - validations[priority=24]
          - errors[ERR_GOVERNOR_LIMIT_EXCEEDED]
          - entities.GovernorLimitRequest.fields.max_concurrent_jobs
          - endpoints.POST_/platform/governor-limit-requests/{id}/submit
        distinguishing_aspect: "The instantaneous dimension of the same error id: with max_concurrent_jobs 1 the first request may be submitted while the second is refused because the environment already holds one SUBMITTED request, so the cumulative and instantaneous ceilings are distinguishable."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox with two requests declared at max_concurrent_jobs 1."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Concurrency Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_gc_id: $.data.id }
            - call: "POST /platform/environments/${env_gc_id}/governor-limit-requests"
              payload: { request_kind: "SCHEDULED", scope_count: 100, callout_graph: [], max_concurrent_jobs: 1 }
              as: AppDeveloper
              captures: { gov_gc1_id: $.data.id }
            - call: "POST /platform/environments/${env_gc_id}/governor-limit-requests"
              payload: { request_kind: "SCHEDULED", scope_count: 100, callout_graph: [], max_concurrent_jobs: 1 }
              as: AppDeveloper
              captures: { gov_gc2_id: $.data.id }
            - call: "POST /platform/governor-limit-requests/${gov_gc1_id}/submit"
              payload: {}
              as: AppDeveloper
          trigger:
            - call: "POST /platform/governor-limit-requests/${gov_gc2_id}/submit"
              payload: {}
              as: AppDeveloper
              captures: { err_conc: $.data.error_id }
          assert:
            - "the first submission succeeds with GovernorLimitRequest.${gov_gc1_id}.status == SUBMITTED"
            - "the second submission returns error_id ERR_GOVERNOR_LIMIT_EXCEEDED with http 402"
            - "GovernorLimitRequest.${gov_gc2_id}.status remains DRAFT"
            - "the projected units of both requests are 200 each, so the refusal is caused by the concurrency ceiling and not by the cumulative ceiling"

      - name: refresh_before_interval_elapsed_returns_business_rule_violation
        claim_type: violation_to_error
        grounds:
          - errors[ERR_BUSINESS_RULE_VIOLATION]
          - entities.Environment.fields.refresh_interval_days
          - entities.Environment.fields.last_refresh_at
          - endpoints.POST_/platform/refresh-jobs/{id}/complete-refresh
        distinguishing_aspect: "The declared refresh interval is enforced against elapsed logical days: a second completion only 14 days after the first, against an interval of 30, is refused with ERR_BUSINESS_RULE_VIOLATION at 409."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox with refresh_interval_days 30 and one completed refresh."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Interval Env", type: "DEVELOPER", refresh_interval_days: 30, aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_iv_id: $.data.id }
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_iv_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: EnvironmentAdmin
              captures: { iv_rj1_id: $.data.id }
            - call: "POST /platform/refresh-jobs/${iv_rj1_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs/${iv_rj1_id}/complete-refresh"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_iv_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: EnvironmentAdmin
              captures: { iv_rj2_id: $.data.id }
            - call: "POST /platform/refresh-jobs/${iv_rj2_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
          trigger:
            - call: "POST /platform/refresh-jobs/${iv_rj2_id}/complete-refresh"
              payload: {}
              as: EnvironmentAdmin
              captures: { err_interval: $.data.error_id }
          assert:
            - "Environment.${env_iv_id}.last_refresh_at == 2026-09-01T00:00:00Z and refresh_interval_days == 30"
            - "the completion returns error_id ERR_BUSINESS_RULE_VIOLATION with http 409"
            - "RefreshJob.${iv_rj2_id}.status remains COMPLETING and Environment.${env_iv_id}.refresh_generation remains 1"
            - "after advancing the clock to 2026-10-05T00:00:00Z the same completion succeeds, so the boundary is elapsed days and not calendar month"

      - name: err_stale_version_already_asserted_by_difficulty
