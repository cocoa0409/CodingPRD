  # ==========================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: activate_disclosure_safety_beats_future_date_temporal
        grounds:
          - "validations[priority=8]"
          - "validations[priority=23]"
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal: an activate attempt that violates BOTH
          the disclosure gate (priority 8) and the effective-date gate (priority 23) returns
          ERR_DISCLOSURE_LEAD_TIME_UNMET, never ERR_FUTURE_EFFECTIVE_DATE.
        test_recipe:
          setup:
            - "P-PRIO (SAVINGS, term 0, WHOLE_BALANCE, cap 500); sheet in US-WEST, effective 2026-08-10, lead 7, floor 0, single tier [0,unbounded)@100, advanced to SCHEDULED with all 4 deployments DEPLOYED and NO notices sent; clock at 2026-08-05 (< effective_date)"
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "PRIO", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_pr: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_pr}", market_code: "US-WEST", effective_date: "2026-08-10", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 100, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_pr: $.data.id } }
            - { call: "POST /rate-sheets/${s_pr}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s_pr}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s_pr}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s_pr}" }, as: ChannelOperator, captures: { d0: "$.data[0].id", d1: "$.data[1].id", d2: "$.data[2].id", d3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${d0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: OperationsAdmin }
          trigger:
            - { call: "POST /rate-sheets/${s_pr}/activate", payload: {}, as: PricingAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DISCLOSURE_LEAD_TIME_UNMET (business_safety, priority 8) — NOT ERR_FUTURE_EFFECTIVE_DATE (business_temporal, priority 23), though both gates fail"
            - "sheet remains SCHEDULED"

      - name: exception_baseline_referential_beats_delta_fiscal
        grounds:
          - "validations[priority=20]"
          - "validations[priority=25]"
        distinguishing_aspect: |
          Category pair business_referential vs business_fiscal (different from the safety/temporal
          pair): an exception request whose baseline sheet is not EFFECTIVE AND whose delta (80 bp)
          exceeds the 75 bp maximum returns ERR_BASELINE_SHEET_NOT_EFFECTIVE, never
          ERR_EXCEPTION_DELTA_EXCEEDS_MAX.
        test_recipe:
          setup:
            - "P-CDP (CD, term 12, WHOLE_BALANCE, cap 900): S1 EFFECTIVE in US-WEST, tiers [0,500000)@350, [500000,5000000)@425, [5000000,unbounded)@480 (effective 2026-08-15, lead 7, floor 0)"
            - "S2 for the same pair exists but is still DRAFT (same tiers)"
            - "Account APX with 5,000,000 cents on S1"
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "CDP", product_class: "CD", term_months: 12, tier_application: "WHOLE_BALANCE", rate_cap_bp: 900, allows_promos: false, allows_exceptions: true }, as: OperationsAdmin, captures: { p_cdp: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_cdp}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 500000, rate_bp: 350, projected_balance_cents: 1000000 }, { tier_index: 1, lower_bound_cents: 500000, upper_bound_cents: 5000000, rate_bp: 425, projected_balance_cents: 1000000 }, { tier_index: 2, lower_bound_cents: 5000000, upper_bound_cents: -1, rate_bp: 480, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s1p: $.data.id } }
            - { call: "POST /rate-sheets/${s1p}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s1p}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s1p}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s1p}" }, as: ChannelOperator, captures: { d0: "$.data[0].id", d1: "$.data[1].id", d2: "$.data[2].id", d3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${d0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s1p}" }, as: ComplianceOfficer, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id", n3: "$.data[3].id" } }
            - { call: "POST /disclosure-notices/${n0}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n1}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n2}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n3}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /rate-sheets/${s1p}/activate", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_cdp}", market_code: "US-WEST", effective_date: "2026-09-01", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 500000, rate_bp: 350, projected_balance_cents: 1000000 }, { tier_index: 1, lower_bound_cents: 500000, upper_bound_cents: 5000000, rate_bp: 425, projected_balance_cents: 1000000 }, { tier_index: 2, lower_bound_cents: 5000000, upper_bound_cents: -1, rate_bp: 480, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s2p: $.data.id } }
            - { call: "POST /deposit-accounts", payload: { customer_ref: "CPX", product_id: "${p_cdp}", market_code: "US-WEST", opening_balance_cents: 5000000, channel: "BRANCH" }, as: BranchBanker, captures: { apx: $.data.id } }
          trigger:
            - { call: "POST /exception-pricing-requests", payload: { account_id: "${apx}", sheet_id: "${s2p}", requested_rate_bp: 560, term_days: 60, justification_doc_ref: "DOC-1" }, as: BranchBanker, as_user_id: "banker-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BASELINE_SHEET_NOT_EFFECTIVE (business_referential, priority 20) — NOT ERR_EXCEPTION_DELTA_EXCEEDS_MAX (business_fiscal, priority 25), though delta 560-480 = 80 > 75 also fails"

  # ==========================================================================
  # Rule 6 — boundary_precision_check (different metrics, distinct endpoints)
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: tier_boundary_balance_exact_lower_inclusive
        grounds:
          - calculations.tiered_balance_rate
          - endpoints."GET /deposit-accounts/{id}/rate-quote"
        distinguishing_aspect: |
          Metric: balance-in-cents at a tier breakpoint, via rate-quote. Balance exactly 2,500,000
          belongs to tier 2 (185 bp, lower-inclusive [lower, upper)); one cent below (2,499,999)
          belongs to tier 1 (120 bp).
        test_recipe:
          setup:
            - "P-BND (SAVINGS, term 0, WHOLE_BALANCE, cap 500) with EFFECTIVE sheet in US-WEST: tiers [0,2500000)@120, [2500000,unbounded)@185 (effective 2026-08-15, lead 7, floor 0)"
            - "Account AB opened with exactly 2,500,000 cents"
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "BND", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_bnd: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_bnd}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 2500000, rate_bp: 120, projected_balance_cents: 1000000 }, { tier_index: 1, lower_bound_cents: 2500000, upper_bound_cents: -1, rate_bp: 185, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_bnd: $.data.id } }
            - { call: "POST /rate-sheets/${s_bnd}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s_bnd}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s_bnd}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s_bnd}" }, as: ChannelOperator, captures: { d0: "$.data[0].id", d1: "$.data[1].id", d2: "$.data[2].id", d3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${d0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s_bnd}" }, as: ComplianceOfficer, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id", n3: "$.data[3].id" } }
            - { call: "POST /disclosure-notices/${n0}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n1}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n2}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n3}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /rate-sheets/${s_bnd}/activate", payload: {}, as: PricingAnalyst }
            - { call: "POST /deposit-accounts", payload: { customer_ref: "CB", product_id: "${p_bnd}", market_code: "US-WEST", opening_balance_cents: 2500000, channel: "ONLINE" }, as: BranchBanker, captures: { ab: $.data.id, ab_v: $.data.version } }
          trigger:
            - { call: "GET /deposit-accounts/${ab}/rate-quote", payload: {}, as: BranchBanker, captures: { q_hi: $.data.base_rate_bp } }
            - { call: "PATCH /deposit-accounts/${ab}", payload: { expected_account_version: "${ab_v}", balance_cents: 2499999 }, as: BranchBanker }
            - { call: "GET /deposit-accounts/${ab}/rate-quote", payload: {}, as: BranchBanker, captures: { q_lo: $.data.base_rate_bp } }
          assert:
            - "balance == 2,500,000 exactly -> base_rate_bp == 185 (tier lower bound inclusive)"
            - "balance == 2,499,999 -> base_rate_bp == 120"

      - name: exception_authority_boundary_25_vs_26
        grounds:
          - entities.ExceptionPricingRequest.fields.authority_tier
          - "validations[priority=26]"
        distinguishing_aspect: |
          Metric: exception delta_bp at the authority boundary, via the decision endpoint.
          delta == 25 is BRANCH (banker-approvable); delta == 26 is COMMITTEE and the same banker
          is rejected with ERR_EXCEPTION_AUTHORITY_INSUFFICIENT while the committee succeeds.
        test_recipe:
          setup:
            - "P-CDA (CD, term 12, WHOLE_BALANCE, cap 900) with EFFECTIVE sheet in US-WEST, tiers [0,5000000)@400, [5000000,unbounded)@480 (effective 2026-08-15, lead 7, floor 0)"
            - "Account AA 5,000,000 (baseline 480); X25 requests 505 (delta 25, BRANCH); X26 requests 506 (delta 26, COMMITTEE, with justification_doc_ref)"
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "CDA", product_class: "CD", term_months: 12, tier_application: "WHOLE_BALANCE", rate_cap_bp: 900, allows_promos: false, allows_exceptions: true }, as: OperationsAdmin, captures: { p_cda: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_cda}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 5000000, rate_bp: 400, projected_balance_cents: 1000000 }, { tier_index: 1, lower_bound_cents: 5000000, upper_bound_cents: -1, rate_bp: 480, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_cda: $.data.id } }
            - { call: "POST /rate-sheets/${s_cda}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s_cda}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s_cda}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s_cda}" }, as: ChannelOperator, captures: { d0: "$.data[0].id", d1: "$.data[1].id", d2: "$.data[2].id", d3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${d0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s_cda}" }, as: ComplianceOfficer, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id", n3: "$.data[3].id" } }
            - { call: "POST /disclosure-notices/${n0}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n1}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n2}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n3}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /rate-sheets/${s_cda}/activate", payload: {}, as: PricingAnalyst }
            - { call: "POST /deposit-accounts", payload: { customer_ref: "CAA", product_id: "${p_cda}", market_code: "US-WEST", opening_balance_cents: 5000000, channel: "BRANCH" }, as: BranchBanker, captures: { aa: $.data.id } }
            - { call: "POST /exception-pricing-requests", payload: { account_id: "${aa}", sheet_id: "${s_cda}", requested_rate_bp: 505, term_days: 60 }, as: BranchBanker, as_user_id: "banker-1", captures: { x25: $.data.id, x25_tier: $.data.authority_tier } }
            - { call: "POST /exception-pricing-requests", payload: { account_id: "${aa}", sheet_id: "${s_cda}", requested_rate_bp: 506, term_days: 60, justification_doc_ref: "DOC-26" }, as: BranchBanker, as_user_id: "banker-1", captures: { x26: $.data.id, x26_tier: $.data.authority_tier } }
          trigger:
            - { call: "POST /exception-pricing-requests/${x25}/decision", payload: { decision: "APPROVE" }, as: BranchBanker, as_user_id: "banker-2", captures: { x25_st: $.data.status } }
            - { call: "POST /exception-pricing-requests/${x26}/decision", payload: { decision: "APPROVE" }, as: BranchBanker, as_user_id: "banker-2", captures: { err26: $.data.error_id } }
            - { call: "POST /exception-pricing-requests/${x26}/decision", payload: { decision: "APPROVE" }, as: PricingCommittee, as_user_id: "committee-1", captures: { x26_st: $.data.status } }
          assert:
            - "X25: authority_tier == BRANCH (delta exactly 25 is inclusive); banker-2 approval -> APPROVED"
            - "X26: authority_tier == COMMITTEE (delta 26); banker-2 approval -> error_id ERR_EXCEPTION_AUTHORITY_INSUFFICIENT (403)"
            - "X26: PricingCommittee approval -> APPROVED"

      - name: disclosure_required_by_exact_equality_not_late
        grounds:
          - entities.DisclosureNotice.fields.required_by_date
          - entities.DisclosureNotice.fields.is_late
        distinguishing_aspect: |
