  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: earnest_forfeit_unwinds_award_depth5
        grounds:
          - state_machines.EarnestMoneyDeposit.PENDING_to_LATE
          - state_machines.EarnestMoneyDeposit.LATE_to_FORFEITED
          - state_machines.Buyer.QUALIFIED_to_DISQUALIFIED
          - state_machines.Bid.CONFIRMED_WINNER_to_VOIDED
          - state_machines.AuctionEvent.AWARDED_to_NO_SALE
          - state_machines.Listing.UNDER_CONTRACT_to_MARKETED
        distinguishing_aspect: |
          Depth-5 transitive chain triggered by the clock sweep (different trigger than the other
          Rule-4 instance): EMD FORFEITED causes Buyer DISQUALIFIED, which causes the winning Bid
          VOIDED, which causes AuctionEvent AWARDED -> NO_SALE, which causes Listing
          UNDER_CONTRACT -> MARKETED and Tracts SOLD -> OFFERED. Each hop is caused by the previous
          hop, not by the clock directly.
        test_recipe:
          setup:
            - "Awarded COMBINATION flow as in net_sheet instance (B3 combo 1400000 wins [T1,T2] at 2026-08-10T19:00:00Z); EMD PENDING amount_due 42000.00 due 2026-08-12T19:00:00Z, never paid"
