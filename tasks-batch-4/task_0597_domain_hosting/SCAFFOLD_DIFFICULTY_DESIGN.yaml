              as_user_id: "${acct_id}"
              captures: { mbx_a_id: $.data.id }
          trigger:
            - call: "POST /registrar/add-ons"
              payload: { subscription_id: "${sub_id}", domain_id: "${dom_id}", add_on_type: "EMAIL_MAILBOX", term_days: 365, mailbox_address: "sales", storage_mb_quota: 2048 }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { mbx_b_id: $.data.id }
            - call: "DELETE /registrar/add-ons/${mbx_b_id}"
              payload: {}
              as: Registrant
              as_user_id: "${acct_id}"
          assert:
            - "before the trigger: HostingSubscription.${sub_id}.storage_committed_mb == 2048"
            - "after creating mailbox 'sales': HostingSubscription.${sub_id}.storage_committed_mb == 4096 and AddOn.${mbx_b_id}.status == 'ACTIVE'"
            - "after DELETE: AddOn.${mbx_b_id}.status == 'CANCELLED'"
            - "after DELETE: HostingSubscription.${sub_id}.storage_committed_mb == 2048 — exactly the pre-create value, no drift"
            - "AddOn.${mbx_a_id}.status == 'ACTIVE' (untouched)"

