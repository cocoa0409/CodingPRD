            - { call: "POST /api/production-companies", payload: { legal_name: "Peachtree Pictures LLC", fein: "58-1002003", contact_email: "ops@peachtree.example" }, as: Producer, captures: { co_id: $.data.id } }
            - { call: "POST /api/productions", payload: { production_company_id: "${co_id}", title: "Atlantic Crossing", production_type: "FEATURE", scheduled_start_date: "2026-09-01T00:00:00Z", scheduled_wrap_date: "2026-12-15T00:00:00Z", total_budget_cents: 400000000 }, as: Producer, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "POST /api/applications", payload: { production_id: "${prod_id}", jurisdiction_program_id: "${prog_id}", estimated_qualified_spend_cents: 250000000 }, as: Producer, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /api/applications/${app_id}/submit", payload: {}, as: Producer, as_user_id: "${co_id}" }
            - { call: "POST /api/applications/${app_id}/claim-review", payload: {}, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/applications/${app_id}/approve", payload: {}, as: FilmOfficeReviewer, as_user_id: "reviewer-2" }
            - { call: "POST /api/vendors", payload: { production_id: "${prod_id}", legal_name: "Savannah Grip & Electric", tax_id: "47-2201988", residency_jurisdiction: "GA" }, as: Producer, as_user_id: "${co_id}", captures: { vend_id: $.data.id } }
            - { call: "POST /api/vendors/${vend_id}/review-residency", payload: { decision: "VERIFIED" }, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/spend-entries", payload: { application_id: "${app_id}", vendor_id: "${vend_id}", external_invoice_ref: "INV-ATL-001", category: "ATL", spend_date: "2026-10-05T00:00:00Z", amount_cents: 40000000 }, as: Producer, as_user_id: "${co_id}", captures: { e_atl: $.data.id } }
            - { call: "POST /api/spend-entries", payload: { application_id: "${app_id}", vendor_id: "${vend_id}", external_invoice_ref: "INV-BTL-003", category: "BTL", spend_date: "2026-10-19T00:00:00Z", amount_cents: 60000000 }, as: Producer, as_user_id: "${co_id}", captures: { e_btl2: $.data.id } }
            - { call: "POST /api/spend-entries", payload: { application_id: "${app_id}", vendor_id: "${vend_id}", external_invoice_ref: "INV-BTL-002", category: "BTL", is_resident_labor: true, spend_date: "2026-10-12T00:00:00Z", amount_cents: 100000000 }, as: Producer, as_user_id: "${co_id}", captures: { e3: $.data.id } }
            - { call: "POST /api/spend-entries/${e_atl}/review", payload: { decision: "QUALIFY" }, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/spend-entries/${e_btl2}/review", payload: { decision: "QUALIFY" }, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /api/applications/${app_id}", as: FilmOfficeReviewer, as_user_id: "reviewer-1", captures: { pre_atl: $.data.atl_qualified_cents, pre_btl: $.data.btl_qualified_cents, pre_capped: $.data.capped_total_qualified_cents, pre_prov: $.data.provisional_credit_cents } }
          trigger:
            - { call: "POST /api/spend-entries/${e3}/review", payload: { decision: "QUALIFY" }, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/spend-entries/${e3}/review", payload: { decision: "DISQUALIFY", disqualify_reason: "invoice voided by vendor" }, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
