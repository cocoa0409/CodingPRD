            - "QualificationItem.${qi}.reconciled_amount == 88000.00 (22000.00 booked earlier plus 66000.00 now)"
            - "QualificationItem.${qi}.variance_amount == -2000.00 (88000.00 booked less the 90000.00 expected at 60.0000 for 1500 units)"
            - "QualificationItem.${qi}.status == FULLY_RECONCILED and reconciliation_seq == 2"
            - "the identity allocated_units 1500 == remaining_units 0 + reconciled_units 1500 holds"

      - name: error_precedence_unauthenticated_then_unauthorized_then_invalid_request
        claim_type: priority_ordering
        grounds:
          - validations.priority_10
          - validations.priority_20
          - validations.priority_30
          - validations.priority_71
        distinguishing_aspect: |
          The ordered table is walked before any lookup: an unauthenticated call naming a
          nonexistent project reports ERR_UNAUTHENTICATED, not ERR_PROJECT_NOT_FOUND; a
          wrong-role call on the same path reports ERR_UNAUTHORIZED; and a malformed enum on a
          real project reports ERR_INVALID_REQUEST even though the state check at priority 71
          would also have failed.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /projects/00000000-0000-0000-0000-000000000000/audit-request"
              payload: {}
              as: NONE
              captures: { e1: $.data.error_id }
            - call: "POST /projects/00000000-0000-0000-0000-000000000000/audit-request"
              payload: {}
              as: IndependentAuditor
              captures: { e2: $.data.error_id }
            - call: "POST /projects/${proj}/audit-actions"
              payload: { action: "NOT_AN_ACTION" }
              as: IndependentAuditor
              captures: { e3: $.data.error_id }
            - call: "POST /projects/${proj}/audit-actions"
              payload: { action: "CLOSE" }
              as: IndependentAuditor
              captures: { e4: $.data.error_id }
          assert:
            - "trigger call 1 is sent with no X-Role and no X-User-ID header and returns 401 with data.error_id == ERR_UNAUTHENTICATED, not 404"
            - "trigger call 2 returns 403 with data.error_id == ERR_UNAUTHORIZED (audit-request is OwnerRepresentative only), still not 404"
            - "trigger call 3 returns 422 with data.error_id == ERR_INVALID_REQUEST: the shape check at priority 30 outranks the audit-state check at priority 71"
            - "trigger call 4 returns 409 with data.error_id == ERR_AUDIT_STATE_INVALID, proving that call 3's project was reachable and its audit_status was the blocking condition all along"
            - "CmarProject.${proj}.audit_status is still NOT_REQUESTED and audit_adjustment_total == 0.00 after all four calls"

      - name: bid_opening_before_the_solicitation_closes_is_rejected_and_the_boundary_is_inclusive
        claim_type: temporal_validation
        grounds:
          - validations.priority_100
          - entities.WorkPackage
          - endpoints.POST_/self-perform-bids/{id}/open
        distinguishing_aspect: |
          The opening gate compares the logical clock against solicitation_closes_at with an
          INCLUSIVE boundary: one second early is refused, the exact instant is permitted. An
          implementation using a strict > comparison keeps every bid sealed until a second after
          the advertised close.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "SD", submitted_cost_of_work: 1000000.00, expected_project_version: "${pv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { pv2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 1000000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${pv2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
            - call: "POST /gmp-proposals/${prop}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /gmp-proposals/${prop}/decide"
              payload: { decision: "EXECUTE" }
              as: OwnerRepresentative
            - call: "POST /work-packages"
              payload: { project_id: "${proj}", trade_division: "03-CONCRETE", budget_amount: 500000.00, self_perform_intent: false }
              as: ConstructionManager
              captures: { wp: $.data.id }
            - call: "POST /work-packages/${wp}/solicit"
              payload: { solicitation_opens_at: "2026-08-01T00:00:00Z", solicitation_closes_at: "2026-08-15T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /self-perform-bids"
              payload: { work_package_id: "${wp}", bidder_type: "THIRD_PARTY", bidder_name: "Cascade Concrete", base_bid_amount: 460000.00, open_book_cost_breakdown: { labor: 200000.00, material: 180000.00, equipment: 40000.00, overhead: 25000.00, profit: 15000.00 } }
              as: ConstructionManager
              as_user_id: "cm-estimator-1"
              captures: { bid: $.data.id }
          trigger:
            - call: "POST /self-perform-bids/${bid}/open"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "po-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-14T23:59:59Z" }
              as: ProgramAdmin
            - call: "POST /self-perform-bids/${bid}/open"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "po-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /self-perform-bids/${bid}/open"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "po-1"
          assert:
            - "trigger call 1 returns 422 with data.error_id == ERR_SOLICITATION_STILL_OPEN at clock 2026-08-01T00:00:00Z"
            - "trigger call 3 returns 422 with data.error_id == ERR_SOLICITATION_STILL_OPEN at clock 2026-08-14T23:59:59Z, one second before the close"
            - "SelfPerformBid.${bid}.status is still SEALED and opened_at is null after calls 1 and 3"
            - "trigger call 5 returns 200 with SelfPerformBid.${bid}.status == OPENED, opened_by_user_id == po-1 and opened_at == 2026-08-15T00:00:00Z, the exact close instant"
            - "the response to call 5 now populates open_book_cost_breakdown, whose five components sum to the 460000.00 base_bid_amount"

      - name: open_book_breakdown_must_sum_exactly_to_the_base_bid_amount
        claim_type: aggregate_validation
        grounds:
