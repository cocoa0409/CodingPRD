            - "A LOW-tier household and an APPROVED assessment with assessed_panel_amps 200 listing both measures."
            - "Because the tier cost share is 1.00, each line's cost_share_cap equals its estimated cost, so the estimated costs 550000 and 250000 are the Stage 1 line values."
