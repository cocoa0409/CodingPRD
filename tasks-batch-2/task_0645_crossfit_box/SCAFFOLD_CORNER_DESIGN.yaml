      - name: error_invalid_request_value_not_positive
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.BenchmarkResult.fields.value
        distinguishing_aspect: "Recording a BenchmarkResult with value <= 0 violates the >0 constraint and returns ERR_INVALID_REQUEST (422)."
        test_recipe:
