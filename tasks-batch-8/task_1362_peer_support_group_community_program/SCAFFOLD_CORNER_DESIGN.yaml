      - name: immediate_consistency_enrollment_confirm_reflects_in_group
        claim_type: immediate
        grounds: [state_machines.Enrollment.RESERVED_to_CONFIRMED, entities.PeerGroup.fields.active_enrollment_count]
        distinguishing_aspect: "After confirm returns 200, immediate GET on group shows updated count (no eventual lag)"
        test_recipe:
          setup:
            - "PeerGroup G, Participant A enrolled RESERVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "P", focus_area: "GRIEF" }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /programs/${pid}/groups"
              payload: { name: "G", modality: "VIRTUAL", base_capacity: 5, required_facilitator_level: 1 }
              as: ProgramAdmin
              captures: { gid: $.data.id }
            - call: "POST /programs/${pid}/groups/${gid}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /participants"
              payload: { full_name: "A", email: "a@x.com", household_size: 1 }
              as: ProgramAdmin
              captures: { pa: $.data.id }
            - call: "POST /participants/${pa}/agreements"
              payload: { signed_at: "2026-07-25T00:00:00Z", expires_at: "2027-07-25T00:00:00Z", agreement_version: 1 }
              as: ProgramAdmin
            - call: "POST /participants/${pa}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid}/enrollments"
              payload: { participant_id: "${pa}" }
              as: ProgramAdmin
              captures: { eid: $.data.id }
            - call: "GET /programs/${pid}/groups/${gid}"
              payload: {}
              as: ProgramAdmin
              captures: { gv: $.data.version }
          trigger:
            - call: "POST /programs/${pid}/groups/${gid}/enrollments/${eid}/confirm"
              payload: { expected_group_version: "${gv}" }
              as: ProgramAdmin
            - call: "GET /programs/${pid}/groups/${gid}"
              payload: {}
              as: ProgramAdmin
              captures: { cnt: $.data.active_enrollment_count }
          assert:
            - "cnt == 1 (immediate visibility, same request scope)"
