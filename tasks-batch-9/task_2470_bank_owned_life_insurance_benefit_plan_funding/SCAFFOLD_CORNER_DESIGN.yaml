  - section: rbac
    instances:
      - name: benefits_analyst_cannot_perform_risk_officer_exclusive_operations
        claim_type: role_denial
        grounds:
          - roles.BenefitsAnalyst.exclusive_operations
          - roles.RiskOfficer.exclusive_operations
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The role gate is evaluated at priority 2, before any state or business check: a BenefitsAnalyst calling the risk officer's approve, decline and clear-diligence endpoints gets ERR_UNAUTHORIZED (403) even when the target resource is in exactly the right state for those calls to succeed for a RiskOfficer."
        test_recipe:
          setup:
            - "One CapitalPosition with tier1_capital_usd 1000000000.00."
            - "Carrier Elmwood (A_PLUS, 400000000.00 surplus) with a 2026 review submitted by analyst-1 and left UNDER_REVIEW."
