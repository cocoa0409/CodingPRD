            - call: "POST /advancement/pledges"
              payload: { agreement_id: "${agr_id}", total_amount_cents: 3000000, installment_count: 3, frequency: "MONTHLY", first_due_date: "2026-08-15T00:00:00Z" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { pl_id: $.data.id }
            - call: "POST /advancement/gift-payments"
              payload: { donor_prospect_id: "${p_id}", pledge_id: "${pl_id}", amount_cents: 1000000, received_at: "2026-08-16T00:00:00Z", payment_method: "WIRE" }
