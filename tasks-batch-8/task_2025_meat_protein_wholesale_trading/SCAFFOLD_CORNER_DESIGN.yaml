      - name: run_allocation_tier_waterfall_partial_and_shortfall
        claim_type: correct_result
        grounds: [calculations.allocation_waterfall, entities.Allocation.fields.allocated_lbs]
        distinguishing_aspect: "Waterfall over tiers: TIER_1 takes its full 2000, TIER_2 partially fills 1000 of 1500 (still CONFIRMED), TIER_3 gets exactly 0 -> SHORTFALL; line allocated_lbs sums to the 3000 cap."
