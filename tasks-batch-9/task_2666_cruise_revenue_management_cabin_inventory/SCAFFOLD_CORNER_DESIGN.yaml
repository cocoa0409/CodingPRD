          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing PRC-2701 (nights 4, total_lower_berths 32, embark 2027-01-10T17:00:00Z) is OPEN_FOR_SALE with an IA allotment of 10 physical cabins / allowance 0 and a 730..0 fare window at base 50000."
