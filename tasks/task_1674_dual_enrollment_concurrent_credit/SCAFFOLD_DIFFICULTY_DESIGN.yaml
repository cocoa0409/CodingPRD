            - { call: "POST /dual-credit/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:01Z" }, as: DualCreditAdmin }
            - { call: "POST /dual-credit/enrollments/${e2}/drop", payload: {}, as: HsCoordinator, captures: { e2_drop_err: $.data.error_id } }
            - { call: "POST /dual-credit/enrollments/${e2}/withdraw", payload: {}, as: HsCoordinator, captures: { e2_status: $.data.status, e2_grade: $.data.grade } }
