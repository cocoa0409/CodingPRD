            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "gate probe", estimated_downtime_days: 10, quoted_labor_hours: 5, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-20T00:00:00Z" }, as: ShopManager, captures: { wo_id: "$.data.id", wo_v1: "$.data.version" } }
