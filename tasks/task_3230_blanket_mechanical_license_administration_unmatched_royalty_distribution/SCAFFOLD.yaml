    roles: [MLCAdministrator, MemberUser, PublicSearcher]
    code: 200
    input: []
    output: CycleRun
    side_effects: []

  - method: POST
    path: "/mlc/cycle-runs/{id}/close"
    description: "Close a cycle: sweep expired accruals and run the market-share waterfall"
    roles: [MLCAdministrator]
    code: 200
    input: []
    output: CycleRun
    side_effects: ["status -> CLOSED", "expired accruals -> DISTRIBUTED (in window) or FORFEITED (out of window)", "pool_cents computed", "DistributionLines created per historical_market_share_allocation", "member prior-epoch snapshots frozen"]

  - method: GET
    path: "/mlc/cycle-runs/{id}/distribution-lines"
    description: "List distribution lines of a cycle (FK reverse reachability)"
    roles: [MLCAdministrator, MemberUser, PublicSearcher]
    code: 200
    input: ["limit?", "offset?", "member_id?"]
    output: "DistributionLine[]"
    side_effects: []

  - method: GET
    path: "/mlc/distribution-lines"
    description: "Filtered list of distribution lines (FK reverse reachability by member_id)"
    roles: [MLCAdministrator, MemberUser, PublicSearcher]
    code: 200
    input: ["limit?", "offset?", "cycle_run_id?", "member_id?"]
    output: "DistributionLine[]"
    side_effects: []

  - method: GET
    path: "/mlc/distribution-lines/{id}"
    description: "Get one distribution line"
    roles: [MLCAdministrator, MemberUser, PublicSearcher]
    code: 200
    input: []
    output: DistributionLine
    side_effects: []

  # --- Test-driving endpoints (last resort, `/_` namespace) ---
  - method: POST
    path: "/mlc/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-09-01T00:00:00Z; before any set_current_utc call the clock reads this default and never falls back to wall-clock time."
    roles: [MLCAdministrator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Logical clock advanced (no catch-up batch transitions fire retroactively; scheduled effects evaluate at their next triggering call)"]

# =============================================================================
# §1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body or missing required field" }
  - { id: ERR_SERVICE_PROVIDER_NOT_FOUND, http: 404, condition: "Service provider id not found" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "Member id not found" }
  - { id: ERR_PAYEE_NOT_FOUND, http: 404, condition: "Payee id not found" }
  - { id: ERR_WORK_NOT_FOUND, http: 404, condition: "Musical work id not found" }
  - { id: ERR_SHARE_NOT_FOUND, http: 404, condition: "Work share id not found" }
  - { id: ERR_RATE_SCHEDULE_NOT_FOUND, http: 404, condition: "Rate schedule id not found" }
  - { id: ERR_USAGE_REPORT_NOT_FOUND, http: 404, condition: "Usage report id not found" }
  - { id: ERR_USAGE_LINE_NOT_FOUND, http: 404, condition: "Usage line id not found" }
  - { id: ERR_ACCRUAL_NOT_FOUND, http: 404, condition: "Royalty accrual id not found" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Claim id not found" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "Dispute id not found" }
  - { id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "Statement id not found" }
  - { id: ERR_AUDIT_NOT_FOUND, http: 404, condition: "Audit engagement id not found" }
  - { id: ERR_CYCLE_RUN_NOT_FOUND, http: 404, condition: "Cycle run id not found" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in the state required by the operation" }
  - { id: ERR_DSP_NOT_ACTIVE, http: 409, condition: "Operation requires the owning DSP in ACTIVE participation status" }
  - { id: ERR_DSP_NOT_SUSPENDABLE, http: 409, condition: "Suspension requires at least one SUBMITTED or UNDER_AUDIT report" }
  - { id: ERR_DSP_HAS_OPEN_REPORTS, http: 409, condition: "Termination blocked by reports in SUBMITTED or UNDER_AUDIT" }
  - { id: ERR_AUDIT_IN_PROGRESS, http: 409, condition: "Termination blocked by an OPEN or FINDINGS_ISSUED audit" }
  - { id: ERR_FUTURE_PERIOD, http: 422, condition: "reporting_month is not a fully elapsed month" }
  - { id: ERR_EMPTY_REPORT, http: 422, condition: "Submit requires at least one usage line" }
  - { id: ERR_STALE_RATE_SCHEDULE, http: 412, condition: "Payload accepted_rate_schedule_version lags the DSP's current value (OCC)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "Payload expected_work_version lags the work's current version (OCC)" }
  - { id: ERR_OUT_OF_ORDER_ACCEPTANCE, http: 409, condition: "An earlier reporting_month report is still SUBMITTED" }
  - { id: ERR_MATCH_RATE_FLOOR_BREACH, http: 422, condition: "Acceptance would leave unmatched_usage_cents above 60% of total_usage_cents" }
  - { id: ERR_RATE_SCHEDULE_NOT_YET_EFFECTIVE, http: 422, condition: "Rate schedule effective_from is in the future" }
  - { id: ERR_RATE_SCHEDULE_OVERLAP, http: 409, condition: "New schedule window overlaps the ACTIVE schedule's window (half-open adjacency permitted)" }
  - { id: ERR_SHARE_SUM_EXCEEDS_100, http: 409, condition: "Sum of ACTIVE share_percent on the work would exceed 100" }
  - { id: ERR_INVALID_SHARE_INTERVAL, http: 422, condition: "effective_to is not null and not strictly after effective_from" }
  - { id: ERR_SHARE_OVERLAP_NEEDS_SUPERSEDE, http: 409, condition: "New share overlaps an existing ACTIVE share of the same claimant without supersedes_share_id" }
  - { id: ERR_SUPERSEDES_NOT_FOUND, http: 422, condition: "supersedes_share_id missing or not a share of the same work" }
  - { id: ERR_PAYEE_ROUTING_INVALID, http: 422, condition: "routing_number fails the 9-digit ABA checksum, or is present for CHECK / absent for ACH|WIRE" }
  - { id: ERR_LAST_PAYEE_TERMINATION, http: 409, condition: "Cannot terminate the member's last remaining ACTIVE|SUSPENDED payee" }
  - { id: ERR_NO_ACTIVE_PAYEE, http: 422, condition: "Statement finalization requires at least one ACTIVE payee" }
  - { id: ERR_MEMBER_HAS_ACTIVE_SHARES, http: 409, condition: "Member termination blocked by ACTIVE or DISPUTED shares" }
  - { id: ERR_WORK_HAS_ACTIVE_USAGE, http: 409, condition: "Work withdrawal blocked by non-terminal usage lines" }
  - { id: ERR_WORK_HAS_HELD_ACCRUALS, http: 409, condition: "Work withdrawal blocked by HELD accruals naming the work" }
  - { id: ERR_ACCRUAL_NOT_HELD, http: 409, condition: "Claim validation requires the accrual in HELD status" }
  - { id: ERR_HOLD_EXPIRED, http: 422, condition: "Accrual claiming period has ended (hold_expires_at <= now)" }
  - { id: ERR_CLAIMANT_SHARE_NOT_FOUND, http: 422, condition: "No ACTIVE WorkShare of the claimed work covers claimant and share_percent_claimed" }
  - { id: ERR_NOT_CLAIM_OWNER, http: 403, condition: "Acting member is not the claim/audit owner" }
  - { id: ERR_DISPUTE_WINNER_NOT_IN_SET, http: 422, condition: "winning_claim_id is not among the dispute's claim_ids" }
  - { id: ERR_DISPUTE_TOO_FRESH, http: 422, condition: "Dispute has been OPEN for fewer than 90 logical days" }
  - { id: ERR_SOD_CONFLICT, http: 403, condition: "Segregation of duties: claim validator is the match-run initiator for the underlying line" }
  - { id: ERR_AUDIT_CREDITS_EXHAUSTED, http: 422, condition: "DSP has no unused audit credits" }
  - { id: ERR_AUDIT_ADJUSTMENT_OUT_OF_RANGE, http: 422, condition: "adjustment_cents magnitude exceeds the scoped reports' total_usage_cents sum" }
  - { id: ERR_CYCLE_OUT_OF_ORDER, http: 409, condition: "An earlier-month CycleRun is still OPEN" }
  - { id: ERR_STATEMENT_SUPERSEDED, http: 409, condition: "A newer FINALIZED or DELIVERED statement exists for a later period_month" }

# =============================================================================
# §1.7: RBAC Matrix
# =============================================================================
roles:
  - name: MLCAdministrator
    description: "Collective operations staff: administers members, works, schedules, report acceptance, claims, disputes, statements, cycles, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /mlc/service-providers, /activate, /suspend, /reinstate, /terminate"
      - "POST /mlc/members lifecycle (create/suspend/reinstate/terminate)"
      - "POST /mlc/rate-schedules and /activate"
      - "POST /mlc/service-providers/{id}/usage-reports/{reportId}/accept and /reject"
      - "POST /mlc/match-runs"
      - "POST /mlc/claims/{id}/validate and /reject"
      - "POST /mlc/disputes/{id}/resolve and /escalate"
      - "POST /mlc/members/{id}/statements lifecycle (create/finalize/reopen/deliver)"
      - "POST /mlc/cycle-runs and /close"
      - "POST /mlc/audits/{id}/close"
      - "POST /mlc/_clock/set_current_utc"
    shared_operations:
      - "GET reads across all resources"
      - "POST /mlc/works and /mlc/works/{id}/shares (with MemberUser)"
      - "POST /mlc/service-providers/{id}/usage-reports and /lines (with ServiceProviderUser)"
      - "POST /mlc/members/{id}/payees (with MemberUser)"

  - name: ServiceProviderUser
    description: "A DSP's reporting user; files and submits usage reports for its own service provider"
    identity: "entity_backed:ServiceProvider"
    exclusive_operations:
      - "POST /mlc/service-providers/{id}/usage-reports/{reportId}/submit and /reopen"
    shared_operations:
      - "GET reads of own reports, works, accruals (public search), schedules"
      - "POST /mlc/service-providers/{id}/usage-reports and /lines (with MLCAdministrator)"

  - name: MemberUser
    description: "A rights holder's user; maintains payees, registers shares, files and withdraws claims, opens audits"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /mlc/claims and /mlc/claims/{id}/withdraw"
      - "POST /mlc/service-providers/{id}/audits"
      - "POST /mlc/audits/{id}/issue-findings and /withdraw"
    shared_operations:
      - "GET reads of works, shares, accruals, statements, disputes, cycles"
      - "POST /mlc/works and /mlc/works/{id}/shares (with MLCAdministrator)"
      - "POST /mlc/members/{id}/payees (with MLCAdministrator)"
      - "POST /mlc/disputes (with MLCAdministrator)"

  - name: PublicSearcher
    description: "Unauthenticated-equivalent public search principal for the unmatched-royalty search tools"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /mlc/works, /mlc/works/{id}, /mlc/works/{id}/shares"
      - "GET /mlc/accruals, /mlc/accruals/{id}, /mlc/accruals/{id}/claims"
      - "GET /mlc/disputes, /mlc/cycle-runs, /mlc/match-runs, /mlc/distribution-lines"
