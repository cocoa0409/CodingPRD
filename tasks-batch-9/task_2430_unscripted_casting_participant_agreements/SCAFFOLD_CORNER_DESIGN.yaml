  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: agreement_create_with_stale_applicant_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency.optimistic_applicant_version
          - validations.priority_9
          - errors.ERR_STALE_APPLICANT_VERSION
          - endpoints.POST_/casting/participant-agreements
        distinguishing_aspect: |
          Concurrency claim on the applicant guard, including the version bookkeeping the
          guard depends on. A one-behind expected_applicant_version answers
          ERR_STALE_APPLICANT_VERSION at 412; the current value succeeds; and REPLAYING the
          same value immediately afterwards is stale, which proves the create itself
          incremented Applicant.version. Supplying the now-current value instead yields
          ERR_DUPLICATE_AGREEMENT at 409 — the OCC check has passed and the next guard in
          the ladder fires — so a build that returned 409 for the stale attempt or 412 for
          the duplicate attempt has the ordering wrong.
        test_recipe:
          setup:
            - "One production and one published call with a single CLEARED adult applicant; no agreements yet."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 13, max_age: 60, exclusivity_window_days: 0 }
              as: CastingDirector
              captures: { call_id: $.data.id }
            - call: "POST /casting/casting-calls/${call_id}/publish"
              payload: {}
              as: CastingDirector
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Ada Reyes", date_of_birth: "1994-04-02", residency_state_code: "GA" }
              as: CastingDirector
              captures: { app_id: $.data.id }
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "INTERVIEW", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "BACKGROUND_CHECK", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "MEDICAL_EXAM", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
