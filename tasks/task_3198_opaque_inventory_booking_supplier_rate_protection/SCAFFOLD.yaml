    path: "/opaque/bookings"
    description: "List bookings"
    roles: [PlatformAdmin, CustomerService, FinanceOps, Customer]
    code: 200
    input: ["customer_id?", "supplier_id?", "property_id?", "opaque_bid_id?", "rate_window_id?", "fulfillment_status?", "limit?", "offset?"]
