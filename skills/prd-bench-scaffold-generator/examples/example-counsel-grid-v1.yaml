# =============================================================================
# Example: counsel-grid benchmark seed tables (v1)
# =============================================================================

scenario: |
  CounselGrid legal holds and collections platform. Manages legal matters with
  custodians, litigation holds, and evidence collections within workspaces.
  Enforces storage quotas, workspace posture (NORMAL/REVIEW/LOCKDOWN),
  matter posture (OPEN/REVIEW/FROZEN), court-ordered hold restrictions,
  cascading corrections on releases/voids/purges, and optimistic concurrency
  via etags.

domain_name: counsel-grid
api_prefix: /workspaces

# =============================================================================
# Table 1: Entity Relationship Table
# =============================================================================
entities:
  - name: Workspace
    parent: null
    common_fields: true  # id, created_at, updated_at
    fields:
      - { name: name, type: string, source: input, description: "Workspace name" }
      - { name: quota_bytes, type: number, source: input, description: "Total storage quota in bytes" }
      - { name: bytes_reserved, type: number, source: computed, description: "Capacity tied to in-flight collections (SUBMITTED, APPROVED, IN_PROGRESS)" }
      - { name: bytes_stored, type: number, source: computed, description: "Capacity consumed by delivered evidence" }
      - { name: bytes_available, type: number, source: computed, description: "= quota_bytes - bytes_reserved - bytes_stored" }
      - { name: posture, type: enum, source: computed, description: "NORMAL | REVIEW | LOCKDOWN — derived from matters and capacity" }
      - { name: etag, type: string, source: system, description: "Optimistic concurrency token" }

  - name: Matter
    parent: Workspace
    common_fields: true
    fields:
      - { name: workspace_id, type: string, source: system, description: "Parent workspace ID" }
      - { name: title, type: string, source: input, description: "Matter title" }
      - { name: matter_type, type: enum, source: input, description: "LITIGATION | INVESTIGATION" }
      - { name: status, type: enum, source: system, description: "DRAFT → ACTIVE → CLOSED (reopenable)" }
      - { name: posture, type: enum, source: computed, description: "OPEN | REVIEW | FROZEN — derived from holds/collections" }
      - { name: bytes_reserved, type: number, source: computed, description: "Reservation scoped to this matter" }
      - { name: bytes_stored, type: number, source: computed, description: "Storage scoped to this matter" }
      - { name: etag, type: string, source: system, description: "Optimistic concurrency token" }

  - name: Custodian
    parent: Matter
    common_fields: true
    fields:
      - { name: matter_id, type: string, source: system, description: "Parent matter ID" }
      - { name: full_name, type: string, source: input, description: "Custodian full name" }
      - { name: email, type: string, source: input, description: "Custodian email" }
      - { name: status, type: enum, source: system, description: "ACTIVE → DEPARTED → PURGED" }
      - { name: etag, type: string, source: system, description: "Optimistic concurrency token" }

  - name: Hold
    parent: Matter
    common_fields: true
    fields:
      - { name: matter_id, type: string, source: system, description: "Parent matter ID" }
      - { name: title, type: string, source: input, description: "Hold title" }
      - { name: legal_basis, type: enum, source: input, description: "LITIGATION | REGULATORY | CONTRACT" }
      - { name: scope, type: enum, source: input, description: "ALL_DATA | EMAIL_ONLY | CHAT_ONLY | DRIVE_ONLY" }
      - { name: is_court_ordered, type: boolean, source: input, description: "Whether hold is court-ordered" }
      - { name: custodian_ids, type: array, source: input, description: "List of custodian IDs covered by this hold" }
      - { name: status, type: enum, source: system, description: "DRAFT → ISSUED → ACTIVE → SUSPENDED → RELEASED / VOID" }
      - { name: etag, type: string, source: system, description: "Optimistic concurrency token" }

  - name: Collection
    parent: Matter
    common_fields: true
    fields:
      - { name: matter_id, type: string, source: system, description: "Parent matter ID" }
      - { name: hold_id, type: string, source: input, description: "Associated hold ID" }
      - { name: custodian_id, type: string, source: input, description: "Associated custodian ID" }
      - { name: data_source, type: enum, source: input, description: "EMAIL | CHAT | DRIVE" }
      - { name: estimated_bytes, type: number, source: input, description: "Estimated storage for this collection" }
      - { name: actual_bytes, type: number, source: input, description: "Actual bytes delivered (set on DELIVERED transition)" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → APPROVED → IN_PROGRESS → DELIVERED / WITHDRAWN / REJECTED" }
      - { name: etag, type: string, source: system, description: "Optimistic concurrency token" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Matter
    initial_state: DRAFT
    terminal_states: []  # CLOSED is not truly terminal — can reopen
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST .../matters/{matterId}/state
        actor: Any
        preconditions:
          - "At least one custodian with status ACTIVE"
          - "If matter has court-ordered holds, those holds must already be ACTIVE"
        side_effects: []

      - from: ACTIVE
        to: CLOSED
        trigger: POST .../matters/{matterId}/state
        actor: Any
        preconditions:
          - "No holds in ISSUED, ACTIVE, or SUSPENDED (ERR_MATTER_HAS_ACTIVE_HOLDS)"
          - "No collections in SUBMITTED, APPROVED, or IN_PROGRESS (ERR_MATTER_HAS_PENDING_COLLECTIONS)"
        side_effects: []

      - from: CLOSED
        to: ACTIVE
        trigger: POST .../matters/{matterId}/state
        actor: Any
        preconditions: []
        side_effects:
          - "Reopening does not resurrect withdrawn collections"

  - entity: Custodian
    initial_state: ACTIVE
    terminal_states: [PURGED]
    transitions:
      - from: ACTIVE
        to: DEPARTED
        trigger: POST .../custodians/{custodianId}/state
        actor: Any
        preconditions: []
        side_effects: []

      - from: DEPARTED
        to: PURGED
        trigger: POST .../custodians/{custodianId}/state
        actor: Any
        preconditions:
          - "Custodian must not be covered by any court-ordered hold that is ACTIVE (ERR_COURT_ORDERED_RESTRICTION)"
        side_effects:
          - "All non-court-ordered holds still including custodian → RELEASED"
          - "All non-delivered collections for custodian → WITHDRAWN"
          - "Already delivered evidence stays stored"

      - from: ACTIVE
        to: PURGED
        trigger: POST .../custodians/{custodianId}/state
        actor: Any
        preconditions:
          - "Custodian must not be covered by any court-ordered hold that is ACTIVE"
        side_effects:
          - "Same cascade as DEPARTED → PURGED"

  - entity: Hold
    initial_state: DRAFT
    terminal_states: [RELEASED, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: POST .../holds/{holdId}/state
        actor: Any
        preconditions: []
        side_effects: []

      - from: ISSUED
        to: ACTIVE
        trigger: POST .../holds/{holdId}/state
        actor: Any
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: POST .../holds/{holdId}/state
        actor: Any
        preconditions:
          - "Court-ordered holds cannot be suspended (ERR_COURT_ORDERED_RESTRICTION)"
        side_effects:
          - "Collections under hold in DRAFT, SUBMITTED, APPROVED → WITHDRAWN"
          - "IN_PROGRESS collections stay but can't deliver until hold reactivated"

      - from: SUSPENDED
        to: ACTIVE
        trigger: POST .../holds/{holdId}/state
        actor: Any
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: RELEASED
        trigger: POST .../holds/{holdId}/state
        actor: Any
        preconditions: []
        side_effects:
          - "Non-delivered collections under hold → WITHDRAWN"
          - "Delivered evidence stays stored"

      - from: ISSUED
        to: RELEASED
        trigger: POST .../holds/{holdId}/state
        actor: Any
        preconditions: []
        side_effects:
          - "Non-delivered collections under hold → WITHDRAWN"

      - from: SUSPENDED
        to: RELEASED
        trigger: POST .../holds/{holdId}/state
        actor: Any
        preconditions: []
        side_effects:
          - "Non-delivered collections under hold → WITHDRAWN"

      - from: DRAFT
        to: VOID
        trigger: POST .../holds/{holdId}/state
        actor: Any
        preconditions: []
        side_effects:
          - "Non-delivered collections under hold → WITHDRAWN"

      - from: ISSUED
        to: VOID
        trigger: POST .../holds/{holdId}/state
        actor: Any
        preconditions: []
        side_effects:
          - "Non-delivered collections under hold → WITHDRAWN"

      - from: ACTIVE
        to: VOID
        trigger: POST .../holds/{holdId}/state
        actor: Any
        preconditions: []
        side_effects:
          - "Non-delivered collections under hold → WITHDRAWN"

      - from: SUSPENDED
        to: VOID
        trigger: POST .../holds/{holdId}/state
        actor: Any
        preconditions: []
        side_effects:
          - "Non-delivered collections under hold → WITHDRAWN"

  - entity: Collection
    initial_state: DRAFT
    terminal_states: [DELIVERED, WITHDRAWN, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST .../collections/{collectionId}/state
        actor: Any
        preconditions:
          - "Hold must be ACTIVE (ERR_HOLD_NOT_ACTIVE)"
          - "Hold scope must cover data_source (ERR_HOLD_SCOPE_MISMATCH)"
          - "Custodian must be in hold's custodian_ids (ERR_CUSTODIAN_NOT_IN_HOLD)"
          - "Sufficient workspace capacity (ERR_QUOTA_EXCEEDED)"
        side_effects:
          - "estimated_bytes becomes reserved (bytes_reserved increases)"

      - from: SUBMITTED
        to: APPROVED
        trigger: POST .../collections/{collectionId}/state
        actor: Any
        preconditions:
          - "If workspace posture is REVIEW: only allowed for court-ordered holds (ERR_POSTURE_BLOCKED)"
          - "If workspace posture is LOCKDOWN: blocked (ERR_POSTURE_BLOCKED)"
        side_effects: []

      - from: APPROVED
        to: IN_PROGRESS
        trigger: POST .../collections/{collectionId}/state
        actor: Any
        preconditions:
          - "Custodian must not be DEPARTED (ERR_CUSTODIAN_DEPARTED) unless court-ordered"
          - "If workspace posture is REVIEW: only allowed for court-ordered holds (ERR_POSTURE_BLOCKED)"
          - "If workspace posture is LOCKDOWN: blocked (ERR_POSTURE_BLOCKED)"
        side_effects: []

      - from: IN_PROGRESS
        to: DELIVERED
        trigger: POST .../collections/{collectionId}/state
        actor: Any
        preconditions:
          - "Hold must be ACTIVE (collection can't deliver while hold suspended)"
          - "actual_bytes required in request"
          - "Capacity check: actual_bytes replaces estimated_bytes reservation"
        side_effects:
          - "Reservation released, actual_bytes becomes stored"
          - "bytes_reserved decreases by estimated_bytes"
          - "bytes_stored increases by actual_bytes"

      - from: DRAFT
        to: WITHDRAWN
        trigger: POST .../collections/{collectionId}/state
        actor: Any
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: POST .../collections/{collectionId}/state
        actor: Any
        preconditions: []
        side_effects:
          - "Release reservation (bytes_reserved decreases by estimated_bytes)"

      - from: APPROVED
        to: WITHDRAWN
        trigger: POST .../collections/{collectionId}/state
        actor: Any
        preconditions: []
        side_effects:
          - "Release reservation"

      - from: IN_PROGRESS
        to: WITHDRAWN
        trigger: POST .../collections/{collectionId}/state
        actor: Any
        preconditions: []
        side_effects:
          - "Release reservation"

      - from: SUBMITTED
        to: REJECTED
        trigger: POST .../collections/{collectionId}/state
        actor: Any
        preconditions: []
        side_effects:
          - "Release reservation"

      - from: APPROVED
        to: REJECTED
        trigger: POST .../collections/{collectionId}/state
        actor: Any
        preconditions: []
        side_effects:
          - "Release reservation"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: workspace_posture
    trigger: "any change to matters, holds, or collections"
    algorithm: derived
    formula: |
      if any matter has posture FROZEN:
        workspace.posture = LOCKDOWN
      else if bytes_available < 0.10 * quota_bytes:
        workspace.posture = REVIEW
      else:
        workspace.posture = NORMAL

  - name: matter_posture
    trigger: "any change to holds or collections under the matter"
    algorithm: derived
    formula: |
      if any hold on matter has is_court_ordered=true AND status=ACTIVE:
        matter.posture = FROZEN
      else if any hold in ISSUED OR any collection in SUBMITTED/APPROVED/IN_PROGRESS:
        matter.posture = REVIEW
      else:
        matter.posture = OPEN

  - name: bytes_available
    trigger: "any collection state change"
    algorithm: aggregation
    formula: |
      bytes_available = quota_bytes - bytes_reserved - bytes_stored
      bytes_reserved = sum(estimated_bytes for collections in SUBMITTED, APPROVED, IN_PROGRESS)
      bytes_stored = sum(actual_bytes for DELIVERED collections)

  - name: capacity_check
    trigger: "collection submission, delivery"
    algorithm: threshold
    formula: |
      On SUBMITTED: if bytes_reserved + estimated_bytes > bytes_available (pre-change):
        reject with ERR_QUOTA_EXCEEDED
      On DELIVERED: reservation replaced by actual_bytes;
        if actual_bytes > estimated_bytes + remaining_free: reject with ERR_QUOTA_EXCEEDED

  - name: hold_scope_check
    trigger: "collection submission"
    algorithm: matching
    formula: |
      ALL_DATA covers EMAIL, CHAT, DRIVE
      EMAIL_ONLY covers EMAIL only
      CHAT_ONLY covers CHAT only
      DRIVE_ONLY covers DRIVE only
      If hold scope does not cover collection data_source: ERR_HOLD_SCOPE_MISMATCH

  - name: legal_basis_compatibility
    trigger: "hold creation"
    algorithm: matching
    formula: |
      LITIGATION matters: LITIGATION and CONTRACT are normal; REGULATORY requires court-ordered
      INVESTIGATION matters: REGULATORY and CONTRACT are normal; LITIGATION requires court-ordered

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: headers
    check: "Idempotency-Key required on all POST/PATCH that create or change data"
    error_id: ERR_MISSING_IDEMPOTENCY_KEY
    http_status: 400
    applies_to: "All mutating endpoints"

  - priority: 1.5
    category: headers
    check: "If-Match required on PATCH and .../state endpoints"
    error_id: ERR_MISSING_IF_MATCH
    http_status: 400
    applies_to: "PATCH, state transition endpoints"

  - priority: 2
    category: existence
    check: "Resource IDs must exist within the correct workspace/matter scope"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 3
    category: concurrency
    check: "Etag must match (If-Match header)"
    error_id: ERR_ETAG_MISMATCH
    http_status: 409
    applies_to: "PATCH and state transition endpoints"

  - priority: 4
    category: posture
    check: "Workspace/matter posture gates"
    error_id: ERR_POSTURE_BLOCKED
    http_status: 403
    applies_to: "Collection advancement in LOCKDOWN/REVIEW"

  - priority: 5
    category: state
    check: "Resource must be in correct state for transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "All state transition endpoints"

  - priority: 6
    category: business
    check: "Domain/business rule failures (quota, scope mismatch, etc.)"
    error_id: "ERR_QUOTA_EXCEEDED / ERR_HOLD_SCOPE_MISMATCH / ERR_HOLD_NOT_ACTIVE / etc."
    http_status: "400/409"
    applies_to: "Various domain-specific endpoints"

response_envelope:
  success: |
    { "response_type": "object" | "array", "data": {} }
  error: |
    { "response_type": "error",
      "data": { "error_code": "ERR_XXX", "message": "..." } }
  pagination_fields: []
  pagination_defaults: {}

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Workspace ---
  - method: POST
    path: "/workspaces"
    description: "Create a new Workspace"
    roles: [Any]
    code: 201
    input: [name, quota_bytes]
    output: Workspace
    side_effects:
      - "bytes_reserved=0, bytes_stored=0, bytes_available=quota_bytes"
      - "posture=NORMAL"

  - method: GET
    path: "/workspaces/{workspaceId}"
    description: "Get a specific Workspace"
    roles: [Any]
    code: 200
    input: []
    output: Workspace
    side_effects: []

  # --- Matter ---
  - method: POST
    path: "/workspaces/{workspaceId}/matters"
    description: "Create a new Matter"
    roles: [Any]
    code: 201
    input: [title, matter_type]
    output: Matter
    side_effects: ["status=DRAFT, posture=OPEN"]

  - method: GET
    path: "/workspaces/{workspaceId}/matters/{matterId}"
    description: "Get a specific Matter"
    roles: [Any]
    code: 200
    input: []
    output: Matter
    side_effects: []

  - method: PATCH
    path: "/workspaces/{workspaceId}/matters/{matterId}"
    description: "Update a Matter"
    roles: [Any]
    code: 200
    input: ["title?"]
    output: Matter
    side_effects: []

  - method: POST
    path: "/workspaces/{workspaceId}/matters/{matterId}/state"
    description: "Transition matter status"
    roles: [Any]
    code: 200
    input: [to_status]
    output: Matter
    side_effects: ["State transition per matter state machine"]

  # --- Custodian ---
  - method: POST
    path: "/workspaces/{workspaceId}/matters/{matterId}/custodians"
    description: "Create a Custodian"
    roles: [Any]
    code: 201
    input: [full_name, email]
    output: Custodian
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/workspaces/{workspaceId}/matters/{matterId}/custodians/{custodianId}"
    description: "Get a specific Custodian"
    roles: [Any]
    code: 200
    input: []
    output: Custodian
    side_effects: []

  - method: POST
    path: "/workspaces/{workspaceId}/matters/{matterId}/custodians/{custodianId}/state"
    description: "Transition custodian status"
    roles: [Any]
    code: 200
    input: [to_status]
    output: Custodian
    side_effects: ["State transition per custodian state machine, including purge cascade"]

  # --- Hold ---
  - method: POST
    path: "/workspaces/{workspaceId}/matters/{matterId}/holds"
    description: "Create a Hold"
    roles: [Any]
    code: 201
    input: ["title, legal_basis, scope, is_court_ordered, custodian_ids"]
    output: Hold
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/workspaces/{workspaceId}/matters/{matterId}/holds/{holdId}"
    description: "Get a specific Hold"
    roles: [Any]
    code: 200
    input: []
    output: Hold
    side_effects: []

  - method: PATCH
    path: "/workspaces/{workspaceId}/matters/{matterId}/holds/{holdId}"
    description: "Update a Hold (only in DRAFT)"
    roles: [Any]
    code: 200
    input: ["title?, legal_basis?, scope?, custodian_ids?"]
    output: Hold
    side_effects: []

  - method: POST
    path: "/workspaces/{workspaceId}/matters/{matterId}/holds/{holdId}/state"
    description: "Transition hold status"
    roles: [Any]
    code: 200
    input: [to_status]
    output: Hold
    side_effects: ["State transition per hold state machine, including cascading withdrawals"]

  # --- Collection ---
  - method: POST
    path: "/workspaces/{workspaceId}/matters/{matterId}/collections"
    description: "Create a Collection"
    roles: [Any]
    code: 201
    input: ["hold_id, custodian_id, data_source, estimated_bytes"]
    output: Collection
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/workspaces/{workspaceId}/matters/{matterId}/collections/{collectionId}"
    description: "Get a specific Collection"
    roles: [Any]
    code: 200
    input: []
    output: Collection
    side_effects: []

  - method: PATCH
    path: "/workspaces/{workspaceId}/matters/{matterId}/collections/{collectionId}"
    description: "Update a Collection"
    roles: [Any]
    code: 200
    input: ["estimated_bytes?"]
    output: Collection
    side_effects: []

  - method: POST
    path: "/workspaces/{workspaceId}/matters/{matterId}/collections/{collectionId}/state"
    description: "Transition collection status"
    roles: [Any]
    code: 200
    input: ["to_status, actual_bytes? (required for DELIVERED)"]
    output: Collection
    side_effects: ["State transition per collection state machine, capacity enforcement"]

# =============================================================================
# Table 6: Error Code Catalogue
# =============================================================================
errors:
  - id: ERR_BAD_REQUEST
    http: 400
    condition: "General malformed request"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource not found or wrong scope"

  - id: ERR_MISSING_IDEMPOTENCY_KEY
    http: 400
    condition: "Idempotency-Key header missing on mutating request"

  - id: ERR_MISSING_IF_MATCH
    http: 400
    condition: "If-Match header missing on PATCH or state change"

  - id: ERR_IDEMPOTENCY_REPLAY_MISMATCH
    http: 409
    condition: "Same idempotency key with different payload"

  - id: ERR_ETAG_MISMATCH
    http: 409
    condition: "If-Match etag does not match current resource version"

  - id: ERR_POSTURE_BLOCKED
    http: 403
    condition: "Operation blocked by workspace or matter posture"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is in wrong state for requested transition"

  - id: ERR_QUOTA_EXCEEDED
    http: 409
    condition: "Collection would exceed workspace quota"

  - id: ERR_HOLD_SCOPE_MISMATCH
    http: 409
    condition: "Hold scope does not cover collection data_source"

  - id: ERR_HOLD_NOT_ACTIVE
    http: 409
    condition: "Hold must be ACTIVE for collection submission"

  - id: ERR_CUSTODIAN_NOT_IN_HOLD
    http: 409
    condition: "Custodian is not in the hold's custodian_ids"

  - id: ERR_CUSTODIAN_DEPARTED
    http: 409
    condition: "Custodian is DEPARTED; non-court-ordered IN_PROGRESS blocked"

  - id: ERR_CUSTODIAN_PURGED
    http: 409
    condition: "Custodian is PURGED; no new work allowed"

  - id: ERR_COURT_ORDERED_RESTRICTION
    http: 409
    condition: "Court-ordered hold prevents operation (suspend, purge while active)"

  - id: ERR_MATTER_HAS_ACTIVE_HOLDS
    http: 409
    condition: "Matter cannot close with active holds"

  - id: ERR_MATTER_HAS_PENDING_COLLECTIONS
    http: 409
    condition: "Matter cannot close with in-flight collections"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: Any
    description: "CounselGrid does not define explicit role-based restrictions in its PRD. All endpoints are accessible to any authenticated user. Role-based access control is implicit through the Idempotency-Key and If-Match header requirements."
    shared_operations:
      - "POST /workspaces — Create workspace"
      - "GET /workspaces/{id} — Get workspace"
      - "POST .../matters — Create matter"
      - "GET .../matters/{id} — Get matter"
      - "PATCH .../matters/{id} — Update matter"
      - "POST .../matters/{id}/state — Transition matter"
      - "POST .../custodians — Create custodian"
      - "GET .../custodians/{id} — Get custodian"
      - "POST .../custodians/{id}/state — Transition custodian"
      - "POST .../holds — Create hold"
      - "GET .../holds/{id} — Get hold"
      - "PATCH .../holds/{id} — Update hold"
      - "POST .../holds/{id}/state — Transition hold"
      - "POST .../collections — Create collection"
      - "GET .../collections/{id} — Get collection"
      - "PATCH .../collections/{id} — Update collection"
      - "POST .../collections/{id}/state — Transition collection"
