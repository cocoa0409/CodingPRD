              captures: { item_two: $.data.id }
            - call: "POST /seafood-ops/ad-items/${item_two}/clear-cool"
              payload: { decision: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "officer-cool-1"
            - call: "POST /seafood-ops/ad-items/${item_two}/clear-claim"
              payload: { decision: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "officer-claim-2"
            - call: "POST /seafood-ops/ad-items/${item_two}/publish"
              payload: {}
              as: MerchandisingLead
              as_user_id: "merch-lead-1"
            - call: "POST /seafood-ops/ad-items/${item_two}/retract"
              payload: { reason: "MANUAL" }
              as: MerchandisingLead
              as_user_id: "merch-lead-1"
