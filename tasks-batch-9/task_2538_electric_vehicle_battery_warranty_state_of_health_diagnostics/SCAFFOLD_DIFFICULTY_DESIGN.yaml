  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_fulfilment_gated_on_thermal_event_containment_state
        entity_pair: "WarrantyClaim depends on ThermalEvent"
        grounds:
          - validations[priority=47]
          - state_machines.ThermalEvent.PACK_QUARANTINED_to_CONTAINMENT_CLOSED
          - state_machines.WarrantyClaim.APPROVED_MODULE_to_FULFILLED
          - entities.ThermalEvent.fields.containment_status
          - entities.BatteryModule.fields.status
        distinguishing_aspect: |
          An already-APPROVED_MODULE claim becomes unfulfillable the instant an unrelated S3 event is
          reported on its pack, and stays unfulfillable through the intermediate containment states -
          DETECTED and PACK_QUARANTINED both refuse - so only the third containment step (itself
          gated on the regulatory dimension) unblocks the very same fulfil request.
        test_recipe:
          setup:
            - "L3 center with a pack lift and insulation_tester_cal_due_at 2027-01-01; an L3 technician whose certificate runs to 2027-06-01."
            - "Vehicle in service 2020-03-10 with retention 70.00 % and two faulted modules (3, 7); the claim is adjudicated MODULE_REPLACEMENT, so it sits in APPROVED_MODULE with remedy_cost_cents 363092."
            - "No thermal event exists at claim time - that is what lets the claim be filed at all."
