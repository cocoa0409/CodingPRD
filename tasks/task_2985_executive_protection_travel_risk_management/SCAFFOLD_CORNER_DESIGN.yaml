        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / submit_with_no_advance_work_and_returned_assessment_returns_safety_error
          rationale: "That instance violates priorities 31 and 42 together, asserts the priority-31 code, then fixes only the advance work to expose the priority-42 code."

