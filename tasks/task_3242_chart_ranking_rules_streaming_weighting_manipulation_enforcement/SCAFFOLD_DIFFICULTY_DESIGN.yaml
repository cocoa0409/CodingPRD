            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chart-weeks/${wk_id}/lock"
              payload: {}
              as: ChartManager
          trigger:
            - call: "POST /chart-weeks/${wk_id}/compute"
              payload: {}
              as: ChartManager
          assert:
            - "ChartEntry for ${trk_id}.points == 515.4000 (= 1.0*500 + 0.5*(floor(10000/1250)+floor(7500/3750)) + 0.2*floor(5000/2500) + 0.0001*100000)"

      - name: per_buyer_cap_waterfall_mode_c_ordered_allocation
        grounds:
          - calculations.countable_album_units
        distinguishing_aspect: |
          Mode (c): circular-looking per-buyer allocation where headroom depends on the running allocation itself; the scaffold pins evaluation order (created_at ASC, quantity ASC tie-break, min(quantity, headroom) fill-in-order), so two batches of quantities 4 and 3 from one buyer yield 4 then 0 — not a proportional split — and total quantity 7 is NOT an exact multiple of the cap 4 while a total of 8 makes the LAST batch receive 0.
        test_recipe:
          setup:
            - "Label L, album title T, ALBUMS chart with ACTIVE methodology, week W1 OPEN [2026-09-04T00:00:00Z, 2026-09-11T00:00:00Z)"
