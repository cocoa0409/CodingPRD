            - "Inspection.${insp_id}.provisional_adjusted_score is null and final_adjusted_score is null"
            - "Inspection.${insp_id}.provisional_outcome is null and final_outcome is null"
            - "Inspection.${insp_id}.demerit_balance_before_finalize is null"
            - "Inspection.${insp_id}.complaint_reference is null and reinspection_of_id is null"

      - name: state_machine_inspection_start_moves_scheduled_to_in_progress
        claim_type: valid_transition
        grounds:
          - state_machines.Inspection.status.SCHEDULED_to_IN_PROGRESS
          - endpoints.POST_/cosmetology/inspections/{id}/start
        distinguishing_aspect: "The start action stamps started_at from the logical clock (2026-08-01T00:00:00.000Z at startup) and bumps version to 2, while hazard_state stays NONE and the establishment's own license_status is untouched."
        test_recipe:
          setup:
            - "One establishment 'Kickoff Salon' still PENDING_INSPECTION with a SCHEDULED ROUTINE inspection."
          setup_api_calls:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Kickoff Salon", establishment_type: "BARBERSHOP", county_code: "ABB", station_capacity: 4 }
