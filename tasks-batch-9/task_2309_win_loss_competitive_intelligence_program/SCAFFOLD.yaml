    success: 201
    side_effects:
      - "depth = 1 when parent_reason_id is null, else parent.depth + 1; is_leaf = true"
      - "the parent's is_leaf becomes false, which retroactively bars it from new attributions (validations priority 26)"

  - method: GET
    path: /loss-reasons/{reason_id}
    description: "Reads one taxonomy node with its depth and leaf flag."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: []
    output: LossReason
    success: 200
    side_effects: []

  - method: GET
    path: /loss-reasons
    description: "Filtered list of taxonomy nodes; reverse lookup for LossReason.program_id and the self-referential LossReason.parent_reason_id."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: ["program_id?", "parent_reason_id?", "status?", "is_leaf?", "depth?", "limit?", "offset?"]
    output: "LossReason[]"
    success: 200
    side_effects: []
    notes: "Ordering: depth ASC, then code ASC."

  - method: PATCH
    path: /loss-reasons/{reason_id}
    description: "Re-parents or relabels a taxonomy node; the cycle and depth guards run here."
    roles: [ProgramAdmin]
    input: ["label?", "parent_reason_id?"]
    output: LossReason
    success: 200
    side_effects:
      - "depth recomputed for the node and every descendant; is_leaf recomputed for the old and new parent"
      - "increments LossReason.version"

  - method: POST
    path: /loss-reasons/{reason_id}/deprecate
    description: "ACTIVE -> DEPRECATED; existing attributions keep counting toward trends, new ones are refused."
    roles: [ProgramAdmin]
    input: []
    output: LossReason
    success: 200
    side_effects:
      - "increments LossReason.version"

  # --- LossAttribution -----------------------------------------------------
  - method: POST
    path: /loss-attributions
    description: "Authors a loss attribution for an interviewed deal under optimistic concurrency (§1.2.1 attribution-create-stale-deal). Supersedes the deal's currently RATIFIED attribution when one exists."
    roles: [ResearchAnalyst]
    input: [deal_id, primary_reason_id, weight_primary, expected_deal_version, "secondary_reason_id?"]
    output: LossAttribution
    success: 201
    side_effects:
      - "status = PROVISIONAL; authored_by_analyst_id = X-User-ID; weight_secondary = 1.00 - weight_primary; confidence_score computed"
      - "Deal.attribution_status UNATTRIBUTED -> PROVISIONAL, or RATIFIED -> PROVISIONAL when superseding"
      - "when superseding: the prior attribution -> SUPERSEDED, LossReason.ratified_attribution_count and Competitor.ratified_loss_count decremented, Deal.research_status SYNTHESIZED -> INTERVIEWED, and every NEW/TRIAGED ProductGap touching the deal is re-scored (4-link attribution_supersede_recompute)"
      - "increments Deal.version"

  - method: GET
    path: /loss-attributions/{attribution_id}
    description: "Reads one attribution with its weights and confidence score."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: []
    output: LossAttribution
    success: 200
    side_effects: []

  - method: GET
    path: /loss-attributions
    description: "Filtered list; reverse lookup for LossAttribution.deal_id, primary_reason_id, secondary_reason_id, authored_by_analyst_id and ratified_by_analyst_id."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: ["deal_id?", "primary_reason_id?", "secondary_reason_id?", "authored_by_analyst_id?", "ratified_by_analyst_id?", "status?", "limit?", "offset?"]
    output: "LossAttribution[]"
    success: 200
    side_effects: []
    notes: "Ordering: created_at ASC."

  - method: POST
    path: /loss-attributions/{attribution_id}/ratify
    description: "PROVISIONAL -> RATIFIED by an analyst who neither authored the attribution nor conducted an interview on the deal (segregation of duties)."
    roles: [ResearchAnalyst]
    input: []
    output: LossAttribution
    success: 200
    side_effects:
      - "ratified_by_analyst_id = X-User-ID; Deal.attribution_status -> RATIFIED; Deal.research_status INTERVIEWED -> SYNTHESIZED"
      - "LossReason.ratified_attribution_count += 1 for the primary and, when present, the secondary reason"
      - "Competitor.ratified_loss_count += 1 when the deal was LOST or NO_DECISION against a known competitor"
      - "increments LossAttribution.version, Deal.version, LossReason.version and Competitor.version"

