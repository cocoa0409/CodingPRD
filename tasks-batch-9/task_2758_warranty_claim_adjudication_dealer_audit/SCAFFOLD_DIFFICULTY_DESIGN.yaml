  # =====================================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: claim_state_gate_outranks_labor_time_ceiling_on_adjudicate
        grounds:
          - validations.priority_40.ERR_CLAIM_NOT_ADJUDICABLE
          - validations.priority_75.ERR_LABOR_TIME_EXCEEDS_MAX
          - endpoints.POST_/warranty/claims/{id}/adjudicate
        distinguishing_aspect: |
          One request violates two rules at once - the claim is already APPROVED (priority 40) and
          the body asks for 9.0 hours against a 2.5-hour ceiling (priority 75). The 409 state gate
          must speak, not the 422 body check, even though a body check is the cheaper thing to
          evaluate first and is the one most naive implementations run at the top of the handler.
          The control call proves rule 75 is live by firing it on a SUBMITTED claim with the
          identical body.
        test_recipe:
          setup:
            - "World A fixture (CA profile, dealer D1 at 13750/0.40, VEH1, labor op A1234-56 with max_time_hours 2.5, part BRK-PAD-9931)."
            - "Claim CL_P1 submitted at 1.5 h and immediately approved, so it sits in APPROVED."
            - "A second claim CL_P2 on a different vehicle left in SUBMITTED for the control."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
