      - name: quoting_after_the_response_deadline_is_refused_though_the_submission_is_still_sent
        claim_type: guarded transitions
        grounds:
          - state_machines.MarketSubmission.transitions[SENT->QUOTED].preconditions
          - validations[priority=45]
          - validations[priority=44]
          - errors.ERR_RESPONSE_DEADLINE_PASSED
          - errors.ERR_DEADLINE_NOT_IN_FUTURE
