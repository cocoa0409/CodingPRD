            - call: "POST /recommerce/trade-ins/${ti2_id}/authenticate"
              payload: { authenticity_result: "GENUINE", assessed_grade: "B" }
              as: Authenticator
              as_user_id: "auth-001"
            - call: "POST /recommerce/trade-ins/${ti2_id}/disposition"
              payload: { decision: "ACCEPT", ownership_treatment: "OWNED_INVENTORY" }
              as: Authenticator
              as_user_id: "auth-001"
            - call: "GET /recommerce/resale-units?trade_in_id=${ti2_id}"
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { u2_id: "$.data[0].id", u2_ver: "$.data[0].version" }
            - call: "POST /recommerce/refurb-orders"
              payload: { resale_unit_id: "${u1_id}", refurb_bay_id: "${bay_id}", window_start_at: "2026-08-01T09:00:00Z", window_end_at: "2026-08-01T11:00:00Z", expected_resale_unit_version: "${u1_ver}" }
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { ro1_id: "$.data.id", ro1_status: "$.data.status" }
          trigger:
            - call: "POST /recommerce/refurb-orders"
              payload: { resale_unit_id: "${u2_id}", refurb_bay_id: "${bay_id}", window_start_at: "2026-08-01T11:00:00Z", window_end_at: "2026-08-01T12:30:00Z", expected_resale_unit_version: "${u2_ver}" }
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { touch_err: "$.data.error_id" }
            - call: "POST /recommerce/refurb-orders"
              payload: { resale_unit_id: "${u2_id}", refurb_bay_id: "${bay_id}", window_start_at: "2026-08-01T11:30:00Z", window_end_at: "2026-08-01T13:00:00Z", expected_resale_unit_version: "${u2_ver}" }
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { buffer_err: "$.data.error_id" }
            - call: "POST /recommerce/refurb-orders"
              payload: { resale_unit_id: "${u2_id}", refurb_bay_id: "${bay_id}", window_start_at: "2026-08-01T08:00:00Z", window_end_at: "2026-08-01T08:45:00Z", expected_resale_unit_version: "${u2_ver}" }
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { before_err: "$.data.error_id" }
            - call: "POST /recommerce/refurb-orders"
              payload: { resale_unit_id: "${u2_id}", refurb_bay_id: "${bay_id}", window_start_at: "2026-08-01T12:00:00Z", window_end_at: "2026-08-01T14:00:00Z", expected_resale_unit_version: "${u2_ver}" }
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { ro2_id: "$.data.id", ro2_status: "$.data.status", ro2_start: "$.data.window_start_at" }
          assert:
            - "${ro1_status} == SCHEDULED"
            - "${touch_err} == ERR_BAY_WINDOW_CONFLICT  # HTTP 409: 11:00 touches the existing end instant — the interval is CLOSED, not half-open"
            - "${buffer_err} == ERR_BAY_WINDOW_CONFLICT  # HTTP 409: a 30-minute gap is under SANITATION_BUFFER_MINUTES = 60"
            - "${before_err} == ERR_BAY_WINDOW_CONFLICT  # HTTP 409: the buffer applies on the earlier side too, 08:45 -> 09:00 is only 15 minutes"
            - "${ro2_status} == SCHEDULED and ${ro2_start} == 2026-08-01T12:00:00Z  # HTTP 201: a gap of exactly 60 minutes clears the buffer"
            - "GET /recommerce/refurb-orders?refurb_bay_id=${bay_id} returns exactly 2 rows; the three refused windows created nothing"
            - "ResaleUnit.${u2_id}.version == ${u2_ver} at the moment of the accepted call, proving the refusals consumed no concurrency token"

      - name: markdown_campaign_window_uses_half_open_interval_with_channel_capacity_cap
        grounds:
          - validations[priority=67]
          - validations[priority=68]
          - global_constants.MAX_CONCURRENT_CAMPAIGNS_PER_CHANNEL
          - entities.MarkdownCampaign.fields.window_start_at
          - entities.MarkdownCampaign.fields.window_end_at
        distinguishing_aspect: |
          A different resource entity (Channel, whose contended capacity is a campaign slot rather
          than a physical bay) and the opposite interval convention: HALF-OPEN with no buffer, so
          back-to-back campaigns that share an instant are legal — exactly the bookings that the
          bay rule refuses. It also layers an aggregate cap on top of the pairwise rule.
        test_recipe:
          setup:
            - "One ACTIVE RESALE_MARKETPLACE channel."
            - "Campaign C1 for FOOTWEAR over [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z), left SCHEDULED."
          setup_api_calls:
            - call: "POST /recommerce/channels"
              payload: { code: "RESALE-MP", channel_type: "RESALE_MARKETPLACE", allowed_assortment: "RESALE_ONLY", max_resale_price_ratio_bp: 7000, region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { chan_id: "$.data.id" }
            - call: "POST /recommerce/markdown-campaigns"
              payload: { channel_id: "${chan_id}", product_category: "FOOTWEAR", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", cadence_days: 7, step_bp: 1500, floor_pct_bp: 6000 }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { c1_id: "$.data.id" }
          trigger:
            - call: "POST /recommerce/markdown-campaigns"
              payload: { channel_id: "${chan_id}", product_category: "FOOTWEAR", window_start_at: "2026-08-31T00:00:00Z", window_end_at: "2026-10-01T00:00:00Z", cadence_days: 7, step_bp: 1000, floor_pct_bp: 7000 }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { one_day_err: "$.data.error_id" }
            - call: "POST /recommerce/markdown-campaigns"
              payload: { channel_id: "${chan_id}", product_category: "FOOTWEAR", window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-10-01T00:00:00Z", cadence_days: 7, step_bp: 1000, floor_pct_bp: 7000 }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { c2_id: "$.data.id", c2_start: "$.data.window_start_at" }
            - call: "POST /recommerce/markdown-campaigns"
              payload: { channel_id: "${chan_id}", product_category: "FOOTWEAR", window_start_at: "2026-10-01T00:00:00Z", window_end_at: "2026-11-01T00:00:00Z", cadence_days: 7, step_bp: 1000, floor_pct_bp: 7000 }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { c3_id: "$.data.id" }
            - call: "POST /recommerce/markdown-campaigns"
              payload: { channel_id: "${chan_id}", product_category: "OUTERWEAR", window_start_at: "2026-08-15T00:00:00Z", window_end_at: "2026-09-15T00:00:00Z", cadence_days: 7, step_bp: 1000, floor_pct_bp: 7000 }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { cap_err: "$.data.error_id" }
            - call: "POST /recommerce/markdown-campaigns"
              payload: { channel_id: "${chan_id}", product_category: "OUTERWEAR", window_start_at: "2026-08-15T00:00:00Z", window_end_at: "2026-08-25T00:00:00Z", cadence_days: 7, step_bp: 1000, floor_pct_bp: 7000 }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { c4_id: "$.data.id", c4_status: "$.data.status" }
          assert:
            - "${one_day_err} == ERR_CAMPAIGN_CATEGORY_OVERLAP  # HTTP 409: [08-31, 10-01) overlaps C1 by exactly one day"
            - "${c2_start} == 2026-09-01T00:00:00Z  # HTTP 201: sharing C1's exclusive end instant is NOT an overlap under half-open semantics"
            - "${c3_id} is a new id  # HTTP 201: C3 abuts C2's exclusive end the same way"
            - "${cap_err} == ERR_CAMPAIGN_CAPACITY_EXCEEDED  # HTTP 409: [08-15, 09-15) overlaps both C1 and C2, so it would be the third overlapping campaign on one channel"
            - "${c4_status} == SCHEDULED  # HTTP 201: [08-15, 08-25) overlaps only C1, so the channel holds 2 overlapping campaigns which is exactly the cap"
            - "GET /recommerce/channels/${chan_id}/markdown-campaigns returns exactly 4 rows"

  - rule_id: compensating_invariant
    instances:
