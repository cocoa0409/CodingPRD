              captures: { auth1_id: $.data.id }
            - call: "POST /authorizations/${auth1_id}/submit"
              payload: {}
              as: Authorizer
            - call: "POST /authorizations/${auth1_id}/approve"
              payload: {}
              as: Authorizer
            - call: "POST /authorizations"
              payload: { patient_id: "${pat_id}", body_region: "RIGHT_ARM", payer_name: "Acme Health", auth_number: "AUTH-2", visit_cap: 5, effective_start_date: "2026-05-01", effective_end_date: "2026-05-02" }
              as: Authorizer
              captures: { auth2_id: $.data.id }
            - call: "POST /authorizations/${auth2_id}/submit"
              payload: {}
              as: Authorizer
            - call: "POST /authorizations/${auth2_id}/approve"
              payload: {}
              as: Authorizer
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", authorization_id: "${auth1_id}", prescribed_daily_minutes: 60 }
              as: Clinician
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/activate"
              payload: {}
