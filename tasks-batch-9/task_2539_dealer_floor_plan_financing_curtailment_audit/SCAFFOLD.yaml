scenario: |
  Generate task harder than expert level!

  2539. Dealer Floor Plan Financing & Curtailment Audit (floorplan lender): credit line establishment with advance rates by new, used and demonstrator inventory, unit funding on invoice with title and manufacturer statement of origin control, curtailment schedule requiring principal paydown as units age with aging exception approvals, sold-out-of-trust detection through physical inventory audits and title verification, audit frequency by dealer risk rating with unannounced counts, ineligible unit classification for damaged, wholesale or missing vehicles, covenant monitoring on capital, cash flow and out-of-trust incidents, default remedies including line suspension and inventory repossession

domain_name: dealer-floorplan-curtailment-audit
api_prefix: "/floorplan"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
    - rate_threshold_triggers

  entity_topology: graph
  # UnitAuditObservation is a junction entity between FloorPlanAudit and
  # InventoryUnit (many-to-many: a unit is observed across many audits, an audit
  # observes many units). CurtailmentObligation is self-referential through
  # supersedes_obligation_id. OutOfTrustIncident fans in from four different
  # aggregates (Dealer, InventoryUnit, FloorPlanAudit, UnitAuditObservation).

  state_machine_shape: parallel
  # InventoryUnit carries two independent state dimensions that evolve on the
  # same row: funding_status (REGISTERED -> FLOORED -> DELINQUENT_CURTAILMENT ->
  # SOT_OPEN -> REPOSSESSED) and title_custody_status (NOT_RECEIVED ->
  # LENDER_HELD -> LOST -> LENDER_HELD -> RELEASED_FOR_SALE). Dealer and
  # CreditLine are cyclic (ACTIVE -> SUSPENDED -> ACTIVE). FloorPlanAudit and
  # FundingAdvance are branching with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # Dealer -> CreditLine -> InventoryUnit -> CurtailmentObligation
    - many_to_many         # FloorPlanAudit <-> InventoryUnit via UnitAuditObservation
    - self_referential     # CurtailmentObligation.supersedes_obligation_id
    - cross_aggregate      # OutOfTrustIncident references Dealer, InventoryUnit, FloorPlanAudit, UnitAuditObservation

  role_model: segregation_of_duties
  # Three enforced separations, each keyed on X-User-ID:
  #  (1) the CreditOfficer operator who funded a unit's advance may not decide
  #      an aging exception on that unit's curtailment obligations;
  #  (2) a FieldAuditor operator who recorded any observation on an audit may
  #      not reconcile that audit as AuditManager;
  #  (3) the CreditRiskManager operator who issued a RemedyAction may not
  #      execute it.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 13 entities / 48 endpoints / 41 error codes / 9 calculations (2 dual-variant)
  # / 11 state machines / 2 OCC races.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

global_constants:
  DEMO_HIGH_MILEAGE_THRESHOLD_MILES: 3000        # strictly greater than triggers the haircut
  DEMO_HIGH_MILEAGE_HAIRCUT_BPS: 500
  AGED_INVOICE_HAIRCUT_DAYS: 45                  # >= triggers the haircut
  AGED_INVOICE_HAIRCUT_BPS: 250
  MAX_FLOOR_AGE_DAYS: 90                         # invoice older than this cannot be floored
  LATE_FEE_BPS: 200
  LATE_FEE_CAP_CENTS: 50000
  MAX_EXTENSION_DAYS_PER_REQUEST: 45
  MAX_EXTENSION_DAYS_PER_UNIT: 60                # cumulative across all approved exceptions on a unit
  MAX_APPROVED_EXCEPTIONS_PER_UNIT: 2
  AUDIT_NOTICE_DAYS: 7                           # ANNOUNCED audits only
  MIN_UNANNOUNCED_GAP_DAYS: 14                   # UNANNOUNCED audits only
  SOT_SUSPENSION_EXPOSURE_CENTS: 10000000        # >= auto-suspends the credit line
  SOT_CURE_DAYS: 10
  COVENANT_BREACH_SUSPENSION_COUNT: 2            # >= auto-suspends the credit line
  COVENANT_TNW_BPS_OF_LIMIT: 1000                # required tangible net worth = 10% of credit limit
  COVENANT_MIN_DSCR_LENDER_STANDARD: "1.2500"
  REINSTATEMENT_MIN_DSCR_DEALER_ADJUSTED: "1.4000"
  COVENANT_MAX_TRAILING_SOT_INCIDENTS: 1
  ADVANCE_REVERSAL_WINDOW_DAYS: 5
  RISK_POINTS_PER_OPEN_SOT_INCIDENT: 15
  RISK_POINTS_PER_DELINQUENT_UNIT: 10
  RISK_POINTS_COVENANT_FAIL: 20
  AUDIT_FREQUENCY_DAYS_BY_RATING: { A: 180, B: 90, C: 45, D: 21 }
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Dealer
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the dealership borrower"
        constraints: "1..200 chars"
      - name: dba_name
        type: string
        source: input
        description: "Trade name the dealership operates under"
        default: null
      - name: franchise_type
        type: enum
        source: input
        description: "Dealer channel, drives nothing computationally but partitions reporting"
        constraints: "one of {FRANCHISE_NEW_CAR, INDEPENDENT_USED, POWERSPORTS}"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code of the dealership's licensed location"
        constraints: "exactly 2 uppercase letters"
      - name: status
        type: enum
        source: system
        description: "Dealer relationship lifecycle state"
        default: PROSPECT
        constraints: "one of {PROSPECT, ACTIVE, SUSPENDED, DEFAULTED, TERMINATED}"
      - name: risk_score
        type: integer
        source: computed
        description: "Output of calculations.dealer_risk_rating; clamped to 0..100"
        default: 100
      - name: risk_rating
        type: enum
        source: computed
        description: "Letter grade derived from risk_score by calculations.dealer_risk_rating"
        default: A
        constraints: "one of {A, B, C, D}"
      - name: audit_frequency_days
        type: integer
        source: computed
        description: "AUDIT_FREQUENCY_DAYS_BY_RATING[risk_rating]; drives next_audit_due_at"
        default: 180
      - name: next_audit_due_at
        type: datetime
        source: computed
        description: "reconciled_at of the most recent RECONCILED_* audit plus audit_frequency_days; set to credit_line.activated_at plus audit_frequency_days when no audit has ever been reconciled"
        default: null
      - name: open_sot_incident_count
        type: integer
        source: computed
        description: "COUNT(OutOfTrustIncident WHERE dealer_id = this.id AND status = OPEN)"
        default: 0
      - name: open_sot_exposure_cents
        type: integer
        source: computed
        description: "SUM(OutOfTrustIncident.exposure_cents WHERE dealer_id = this.id AND status = OPEN)"
        default: 0
      - name: delinquent_unit_count
        type: integer
        source: computed
        description: "COUNT(InventoryUnit WHERE dealer_id = this.id AND funding_status = DELINQUENT_CURTAILMENT)"
        default: 0
      - name: covenant_breach_count
        type: integer
        source: computed
        description: "Running count of CovenantTest rows with result = FAIL since the last successful credit-line reinstatement; reset to 0 by POST /credit-lines/{id}/reinstate"
        default: 0
      - name: last_covenant_result
        type: enum
        source: computed
        description: "result of the CovenantTest with the greatest period_end_date (tie-break: greatest created_at)"
        default: null
        constraints: "one of {PASS, FAIL} or null when no CovenantTest exists"
      - name: unapplied_credit_cents
        type: integer
        source: computed
        description: "Residual remittance money that the waterfall could not allocate; increased by calculations.remittance_waterfall_allocation"
        default: 0
      - name: audit_in_progress
        type: boolean
        source: computed
        description: "True while any FloorPlanAudit for this dealer has status IN_PROGRESS"
        default: false

  - name: CreditLine
    parent: Dealer
    common_fields: true
    entity_kind: resource
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; at most one CreditLine per dealer may have status IN {PENDING, ACTIVE, SUSPENDED}"
      - name: status
        type: enum
        source: system
        description: "Credit facility lifecycle state"
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, SUSPENDED, TERMINATED}"
      - name: credit_limit_cents
        type: integer
        source: input
        description: "Total committed floor plan facility size in cents"
        constraints: ">= 100000"
      - name: advance_rate_bps_new
        type: integer
        source: input
        description: "Base advance rate in basis points applied to NEW inventory invoice amounts"
        constraints: "0..10000"
      - name: advance_rate_bps_used
        type: integer
        source: input
        description: "Base advance rate in basis points applied to USED inventory invoice amounts"
        constraints: "0..10000"
      - name: advance_rate_bps_demonstrator
        type: integer
        source: input
        description: "Base advance rate in basis points applied to DEMONSTRATOR inventory invoice amounts"
        constraints: "0..10000"
      - name: max_unit_advance_cents_new
        type: integer
        source: input
        description: "Per-unit advance basis cap for NEW inventory; caps the basis, never rejects the request"
        constraints: "> 0"
      - name: max_unit_advance_cents_used
        type: integer
        source: input
        description: "Per-unit advance basis cap for USED inventory"
        constraints: "> 0"
      - name: max_unit_advance_cents_demonstrator
        type: integer
        source: input
        description: "Per-unit advance basis cap for DEMONSTRATOR inventory"
        constraints: "> 0"
      - name: class_sublimit_cents_used
        type: integer
        source: input
        description: "Maximum aggregate outstanding principal across USED units on this line"
        constraints: "> 0"
      - name: class_sublimit_cents_demonstrator
        type: integer
        source: input
        description: "Maximum aggregate outstanding principal across DEMONSTRATOR units on this line"
        constraints: "> 0"
      - name: curtailment_grace_days
        type: integer
        source: input
        description: "Days after a CurtailmentObligation.due_date before it becomes DELINQUENT"
        default: 10
        constraints: "0..30"
      - name: outstanding_principal_cents
        type: integer
        source: computed
        description: "SUM(InventoryUnit.outstanding_principal_cents WHERE credit_line_id = this.id AND funding_status IN {FLOORED, DELINQUENT_CURTAILMENT, SOT_OPEN})"
        default: 0
      - name: charged_off_principal_cents
        type: integer
        source: computed
        description: "Cumulative principal removed from outstanding by REPOSSESSION remedy execution; never decreases"
        default: 0
      - name: available_credit_cents
        type: integer
        source: computed
        description: "credit_limit_cents - outstanding_principal_cents - charged_off_principal_cents"
        default: 0
      - name: eligible_collateral_cents
        type: integer
        source: computed
        description: "SUM(InventoryUnit.outstanding_principal_cents WHERE credit_line_id = this.id AND eligibility_status = ELIGIBLE AND funding_status IN {FLOORED, DELINQUENT_CURTAILMENT})"
        default: 0
      - name: borrowing_base_deficiency_cents
        type: integer
        source: computed
        description: "max(0, outstanding_principal_cents - eligible_collateral_cents)"
        default: 0
      - name: class_outstanding_cents_used
        type: integer
        source: computed
        description: "SUM(InventoryUnit.outstanding_principal_cents WHERE credit_line_id = this.id AND inventory_class = USED AND funding_status IN {FLOORED, DELINQUENT_CURTAILMENT, SOT_OPEN})"
        default: 0
      - name: class_outstanding_cents_demonstrator
        type: integer
        source: computed
        description: "Same aggregate as class_outstanding_cents_used but for inventory_class = DEMONSTRATOR"
        default: 0
      - name: activated_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the line transitioned PENDING -> ACTIVE"
        default: null
      - name: suspension_reason_code
        type: enum
        source: computed
        description: "Why the line is SUSPENDED; cleared to null on reinstatement"
        default: null
        constraints: "one of {SOT_EXPOSURE_THRESHOLD, COVENANT_BREACH_LIMIT, REMEDY_ACTION} or null"

  - name: CurtailmentTier
    parent: CreditLine
    common_fields: false
    entity_kind: configuration
    fields:
      - name: credit_line_id
        type: string
        source: input
        description: "FK -> CreditLine.id; tiers are scoped to one line and one inventory_class"
      - name: inventory_class
        type: enum
        source: input
        description: "Inventory class this tier row applies to"
        constraints: "one of {NEW, USED, DEMONSTRATOR}"
      - name: age_days_from
        type: integer
        source: input
        description: "Inclusive lower bound of the unit-age bucket, in days since InventoryUnit.floored_at"
        constraints: ">= 0"
      - name: age_days_to
        type: integer
        source: input
        description: "Exclusive upper bound of the unit-age bucket; null means unbounded"
        default: null
        constraints: "null or > age_days_from"
      - name: cumulative_paydown_bps
        type: integer
        source: input
        description: "Cumulative fraction of the original advance that must have been repaid by age_days_from, in basis points"
        constraints: "0..10000"

  - name: InventoryUnit
    parent: CreditLine
    common_fields: true
    entity_kind: resource
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; must equal X-User-ID when the caller role is DealerPrincipal"
      - name: credit_line_id
        type: string
        source: input
        description: "FK -> CreditLine.id; the line must belong to dealer_id"
      - name: vin
        type: string
        source: input
        description: "Vehicle identification number; unique per dealer_id"
        constraints: "exactly 17 uppercase alphanumeric characters"
      - name: inventory_class
        type: enum
        source: input
        description: "Collateral class selecting the advance rate, per-unit cap, sublimit and curtailment tier set"
        constraints: "one of {NEW, USED, DEMONSTRATOR}"
      - name: invoice_amount_cents
        type: integer
        source: input
        description: "Manufacturer or acquisition invoice amount in cents; the advance basis before capping"
        constraints: "> 0"
      - name: invoice_date
        type: datetime
        source: input
        description: "Invoice issue instant; drives the aged-invoice haircut and the MAX_FLOOR_AGE_DAYS gate"
      - name: odometer_miles
        type: integer
        source: input
        description: "Odometer reading at registration; only DEMONSTRATOR units use it for the mileage haircut"
        default: 0
        constraints: ">= 0"
      - name: title_document_type
        type: enum
        source: input
        description: "MSO (manufacturer statement of origin) for NEW units, TITLE for USED and DEMONSTRATOR units"
        constraints: "one of {MSO, TITLE}"
      - name: funding_status
        type: enum
        source: system
        description: "First independent state dimension: where the unit sits in the floor plan funding lifecycle"
        default: REGISTERED
        constraints: "one of {REGISTERED, PENDING_FUNDING, FLOORED, DELINQUENT_CURTAILMENT, SOT_OPEN, PAID_OFF, REPOSSESSED}"
      - name: title_custody_status
        type: enum
        source: system
        description: "Second independent state dimension: custody of the MSO or title document"
        default: NOT_RECEIVED
        constraints: "one of {NOT_RECEIVED, LENDER_HELD, LOST, RELEASED_FOR_SALE}"
      - name: eligibility_status
        type: enum
        source: system
        description: "Borrowing-base eligibility; only ELIGIBLE units count toward CreditLine.eligible_collateral_cents"
        default: ELIGIBLE
        constraints: "one of {ELIGIBLE, INELIGIBLE_DAMAGE, INELIGIBLE_WHOLESALE, INELIGIBLE_MISSING, INELIGIBLE_TITLE_DEFECT, INELIGIBLE_SOLD_OUT_OF_TRUST}"
      - name: advance_amount_cents
        type: integer
        source: computed
        description: "Output of calculations.unit_advance_amount, frozen at funding; the denominator base of every curtailment tier"
        default: 0
      - name: outstanding_principal_cents
        type: integer
        source: computed
        description: "advance_amount_cents - principal_paid_cents while floored; forced to 0 by UNIT_PAYOFF and by REPOSSESSION charge-off"
        default: 0
      - name: principal_paid_cents
        type: integer
        source: computed
        description: "Cumulative principal applied to this unit by calculations.remittance_waterfall_allocation"
        default: 0
      - name: floored_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the FUNDED transition; the age-zero anchor for every curtailment tier"
        default: null
      - name: funded_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the CreditOfficer operator who funded the advance; the segregation-of-duties source for aging-exception decisions"
        default: null
      - name: aging_exception_count
        type: integer
        source: computed
        description: "COUNT(AgingExceptionRequest WHERE its obligation's unit_id = this.id AND status = APPROVED)"
        default: 0
      - name: curtailment_extension_days_total
        type: integer
        source: computed
        description: "SUM(AgingExceptionRequest.decided_extension_days WHERE its obligation's unit_id = this.id AND status = APPROVED)"
        default: 0
      - name: ineligibility_reason_code
        type: enum
        source: computed
        description: "Why the unit left ELIGIBLE; null while eligibility_status = ELIGIBLE"
        default: null
        constraints: "one of {DAMAGE, WHOLESALE, MISSING, TITLE_DEFECT, SOLD_OUT_OF_TRUST} or null"

  - name: FundingAdvance
    parent: InventoryUnit
    common_fields: true
    entity_kind: resource
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> InventoryUnit.id; at most one FundingAdvance per unit may have status IN {REQUESTED, FUNDED}"
      - name: credit_line_id
        type: string
        source: system
        description: "FK -> CreditLine.id; copied from the unit at request time so the OCC parent is unambiguous"
      - name: status
        type: enum
        source: system
        description: "Advance lifecycle state"
        default: REQUESTED
        constraints: "one of {REQUESTED, FUNDED, REJECTED, VOIDED, REVERSED}"
      - name: requested_amount_cents
        type: integer
        source: input
        description: "Amount the dealer asks to draw; informational only, the funded amount is always calculations.unit_advance_amount"
        constraints: "> 0"
      - name: dealer_invoice_reference
        type: string
        source: input
        description: "Dealer's own invoice or purchase-order reference"
      - name: disbursement_reference
        type: string
        source: input
        description: "Wire or ACH reference supplied on the fund call"
        default: null
      - name: approved_advance_amount_cents
        type: integer
        source: computed
        description: "Output of calculations.unit_advance_amount at the moment of funding"
        default: 0
      - name: effective_advance_rate_bps
        type: integer
        source: computed
        description: "Base class rate after the demonstrator-mileage and aged-invoice haircuts"
        default: 0
      - name: rate_adjustment_codes
        type: array
        source: computed
        description: "Ordered list of applied haircut codes; emitted as HIGH_MILEAGE_DEMO before AGED_INVOICE when both apply"
        default: []
        constraints: "subset of [HIGH_MILEAGE_DEMO, AGED_INVOICE]"
      - name: invoice_age_days_at_funding
        type: integer
        source: computed
        description: "Whole days between InventoryUnit.invoice_date and the logical clock at funding"
        default: null
      - name: funded_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the REQUESTED -> FUNDED transition"
        default: null
      - name: funded_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the funding CreditOfficer operator"
        default: null
      - name: reason_code
        type: enum
        source: computed
        description: "Terminal-branch reason: rejection, void or reversal cause"
        default: null
        constraints: "one of {CREDIT_DECLINE, TITLE_DEFECT, DUPLICATE_INVOICE, LINE_SUSPENDED, DEALER_REQUEST, FUNDING_ERROR} or null"

  - name: CurtailmentObligation
    parent: InventoryUnit
    common_fields: true
    entity_kind: resource
    fields:
      - name: unit_id
        type: string
        source: system
        description: "FK -> InventoryUnit.id; the unit whose aging drives this obligation"
      - name: dealer_id
        type: string
        source: system
        description: "FK -> Dealer.id; denormalized from the unit so the curtailment run can scope by dealer"
      - name: supersedes_obligation_id
        type: string
        source: system
        description: "FK -> CurtailmentObligation.id; null unless this row replaces an obligation superseded by an APPROVED AgingExceptionRequest"
        default: null
      - name: status
        type: enum
        source: system
        description: "Obligation lifecycle state"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, DUE, DELINQUENT, PAID, SUPERSEDED, CANCELLED}"
      - name: tier_age_days_from
        type: integer
        source: system
        description: "CurtailmentTier.age_days_from of the tier this obligation was generated from; frozen at creation"
      - name: tier_cumulative_paydown_bps
        type: integer
        source: system
        description: "CurtailmentTier.cumulative_paydown_bps of the generating tier; frozen at creation"
      - name: due_date
        type: datetime
        source: computed
        description: "InventoryUnit.floored_at plus tier_age_days_from days, plus extension_days_applied when this row replaces a superseded obligation"
      - name: projected_principal_cents
        type: integer
        source: computed
        description: "Forward-looking variant of calculations.curtailment_requirement, frozen at obligation creation; assumes every earlier tier was paid exactly on schedule and no voluntary prepayment occurred"
        default: 0
      - name: required_principal_cents
        type: integer
        source: computed
        description: "Assessed chronological variant of calculations.curtailment_requirement, written at the SCHEDULED -> DUE transition from the unit's actual principal_paid_cents"
        default: 0
      - name: late_fee_cents
        type: integer
        source: computed
        description: "Output of calculations.delinquency_assessment, written at the DUE -> DELINQUENT transition"
        default: 0
      - name: total_amount_due_cents
        type: integer
        source: computed
        description: "required_principal_cents + late_fee_cents"
        default: 0
      - name: principal_paid_cents
        type: integer
        source: computed
        description: "Principal allocated to this obligation by calculations.remittance_waterfall_allocation"
        default: 0
      - name: fee_paid_cents
        type: integer
        source: computed
        description: "Late fee allocated to this obligation by calculations.remittance_waterfall_allocation"
        default: 0
      - name: became_due_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the SCHEDULED -> DUE transition"
        default: null
      - name: became_delinquent_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the DUE -> DELINQUENT transition"
        default: null
      - name: extension_days_applied
        type: integer
        source: computed
        description: "AgingExceptionRequest.decided_extension_days that shifted this row's due_date relative to the obligation it supersedes"
        default: 0

  - name: AgingExceptionRequest
    parent: CurtailmentObligation
    common_fields: true
    entity_kind: resource
    fields:
      - name: obligation_id
        type: string
        source: system
        description: "FK -> CurtailmentObligation.id; the obligation the dealer wants pushed out"
      - name: status
        type: enum
        source: system
        description: "Exception decision state"
        default: PENDING
        constraints: "one of {PENDING, APPROVED, DENIED, EXPIRED}"
      - name: requested_extension_days
        type: integer
        source: input
        description: "Days of relief the dealer asks for"
        constraints: "1..45 (MAX_EXTENSION_DAYS_PER_REQUEST)"
      - name: justification_code
        type: enum
        source: input
        description: "Business reason for the aging relief"
        constraints: "one of {RETAIL_DEAL_PENDING, TITLE_DELAY, FLEET_ORDER, DAMAGE_REPAIR}"
      - name: requested_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the requesting DealerPrincipal, which equals the Dealer.id of the owning dealer"
      - name: decided_extension_days
        type: integer
        source: input
        description: "Days actually granted; required on APPROVE, must be <= requested_extension_days"
        default: null
      - name: decided_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the deciding CreditRiskManager operator; must differ from InventoryUnit.funded_by_user_id"
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the decision transition"
        default: null
      - name: reason_code
        type: enum
        source: input
        description: "Decision rationale recorded by the credit risk manager"
        default: null
        constraints: "one of {RELIEF_GRANTED, INSUFFICIENT_JUSTIFICATION, EXPOSURE_TOO_HIGH, DOCUMENTATION_MISSING} or null"
      - name: replacement_obligation_id
        type: string
        source: computed
        description: "Identifier of the CurtailmentObligation created on approval; the canonical link is CurtailmentObligation.supersedes_obligation_id = this request's obligation_id"
        default: null

  - name: FloorPlanAudit
    parent: Dealer
    common_fields: true
    entity_kind: resource
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the dealership whose lot is being counted"
      - name: audit_type
        type: enum
        source: input
        description: "ANNOUNCED audits require AUDIT_NOTICE_DAYS notice; UNANNOUNCED audits need no notice but must honor MIN_UNANNOUNCED_GAP_DAYS and a window of at most 3 days"
        constraints: "one of {ANNOUNCED, UNANNOUNCED}"
      - name: status
        type: enum
        source: system
        description: "Audit lifecycle state; the two RECONCILED_* branches carry divergent side-effect sets"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, RECONCILED_CLEAN, RECONCILED_EXCEPTIONS, ABORTED}"
      - name: window_start_date
        type: datetime
        source: input
        description: "Inclusive first instant of the permitted count window"
      - name: window_end_date
        type: datetime
        source: input
        description: "Inclusive last instant of the permitted count window; overlap arithmetic treats [window_start_date, window_end_date] as a closed interval"
      - name: started_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the SCHEDULED -> IN_PROGRESS transition"
        default: null
      - name: reconciled_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the reconcile transition; the anchor for Dealer.next_audit_due_at"
        default: null
      - name: units_in_scope_count
        type: integer
        source: computed
        description: "COUNT(InventoryUnit WHERE dealer_id = this.dealer_id AND funding_status IN {FLOORED, DELINQUENT_CURTAILMENT}) frozen at the start transition"
        default: 0
      - name: units_verified_count
        type: integer
        source: computed
        description: "COUNT(UnitAuditObservation WHERE audit_id = this.id AND classification = VERIFIED)"
        default: 0
      - name: units_exception_count
        type: integer
        source: computed
        description: "COUNT(UnitAuditObservation WHERE audit_id = this.id AND classification != VERIFIED)"
        default: 0
      - name: units_unobserved_count
        type: integer
        source: computed
        description: "units_in_scope_count minus units_verified_count minus units_exception_count; the conserved-count invariant holds at every observable moment"
        default: 0
      - name: sot_exposure_cents
        type: integer
        source: computed
        description: "Output of calculations.audit_sot_exposure, written at the reconcile transition"
        default: 0
      - name: observer_user_ids
        type: array
        source: computed
        description: "Distinct X-User-ID values of FieldAuditor operators who recorded observations, in first-observation order; the segregation-of-duties source for reconcile"
        default: []
      - name: reconciled_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the AuditManager operator who reconciled; must not appear in observer_user_ids"
        default: null
      - name: abort_reason_code
        type: enum
        source: input
        description: "Why the audit was abandoned"
        default: null
        constraints: "one of {DEALER_UNAVAILABLE, AUDITOR_REASSIGNED, DATA_ERROR} or null"

  - name: UnitAuditObservation
    parent: FloorPlanAudit
    common_fields: false
    entity_kind: event
    fields:
      - name: audit_id
        type: string
        source: system
        description: "FK -> FloorPlanAudit.id; the count this observation belongs to"
      - name: unit_id
        type: string
        source: input
        description: "FK -> InventoryUnit.id; the unit the field auditor looked for"
      - name: observed_condition
        type: enum
        source: input
        description: "What the field auditor physically found on the lot"
        constraints: "one of {PRESENT, PRESENT_DAMAGED, SOLD_NO_PAYOFF, WHOLESALED, MISSING}"
      - name: title_verified
        type: boolean
        source: input
        description: "True when the lender-held MSO or title was physically matched to the VIN during the count"
      - name: odometer_miles
        type: integer
        source: input
        description: "Odometer reading recorded during the count; recorded for audit trail only, never re-prices the advance"
        default: null
      - name: sale_contract_reference
        type: string
        source: input
        description: "Retail buyer's order reference the dealer produced for a sold unit"
        default: null
      - name: classification
        type: enum
        source: computed
        description: "Output of calculations.observation_classification, frozen at creation because this entity is immutable"
        constraints: "one of {VERIFIED, TITLE_EXCEPTION, DAMAGE_EXCEPTION, WHOLESALE_EXCEPTION, SOLD_OUT_OF_TRUST}"
      - name: is_out_of_trust
        type: boolean
        source: computed
        description: "True exactly when classification = SOLD_OUT_OF_TRUST"
      - name: observed_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the recording FieldAuditor operator"
      - name: unit_outstanding_principal_cents_at_observation
        type: integer
        source: computed
        description: "Snapshot of InventoryUnit.outstanding_principal_cents when the observation was recorded; used by calculations.observation_classification for the WHOLESALED branch"

  - name: OutOfTrustIncident
    parent: Dealer
    common_fields: true
    entity_kind: resource
    fields:
      - name: dealer_id
        type: string
        source: system
        description: "FK -> Dealer.id; the borrower who sold or lost collateral out of trust"
      - name: unit_id
        type: string
        source: system
        description: "FK -> InventoryUnit.id; the collateral that is gone"
      - name: audit_id
        type: string
        source: system
        description: "FK -> FloorPlanAudit.id; the audit whose reconcile created this incident"
      - name: observation_id
        type: string
        source: system
        description: "FK -> UnitAuditObservation.id; the observation that classified as SOLD_OUT_OF_TRUST"
      - name: status
        type: enum
        source: system
        description: "Incident resolution state"
        default: OPEN
        constraints: "one of {OPEN, CURED, CHARGED_OFF}"
      - name: exposure_cents
        type: integer
        source: computed
        description: "InventoryUnit.outstanding_principal_cents at the moment of reconcile; frozen thereafter"
      - name: cure_deadline_at
        type: datetime
        source: computed
        description: "FloorPlanAudit.reconciled_at plus SOT_CURE_DAYS days"
      - name: cured_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which a SOT_CURE remittance fully covered exposure_cents"
        default: null
      - name: charged_off_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which a REPOSSESSION remedy charged the exposure off"
        default: null
      - name: resolution_reason_code
        type: enum
        source: computed
        description: "How the incident left OPEN"
        default: null
        constraints: "one of {DEALER_PAYOFF, REPOSSESSION_CHARGE_OFF} or null"

  - name: PaymentRemittance
    parent: Dealer
    common_fields: true
    entity_kind: resource
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; must equal X-User-ID because only the DealerPrincipal remits"
      - name: target_unit_id
        type: string
        source: input
        description: "FK -> InventoryUnit.id; required for PRINCIPAL_PREPAYMENT, UNIT_PAYOFF and SOT_CURE, null for portfolio-wide CURTAILMENT"
        default: null
      - name: target_obligation_id
        type: string
        source: input
        description: "FK -> CurtailmentObligation.id; optional narrowing for CURTAILMENT intent, forbidden for every other intent"
        default: null
      - name: intent
        type: enum
        source: input
        description: "Which waterfall bucket ordering calculations.remittance_waterfall_allocation applies"
        constraints: "one of {CURTAILMENT, PRINCIPAL_PREPAYMENT, UNIT_PAYOFF, SOT_CURE}"
      - name: amount_cents
        type: integer
        source: input
        description: "Money received from the dealer in cents"
        constraints: "> 0"
      - name: payment_reference
        type: string
        source: input
        description: "Dealer's wire or check reference"
      - name: status
        type: enum
        source: system
        description: "Allocation state; RECEIVED is the pre-allocation instant and auto-advances inside the same request"
        default: RECEIVED
        constraints: "one of {RECEIVED, APPLIED, PARTIALLY_APPLIED}"
      - name: applied_principal_cents
        type: integer
        source: computed
        description: "Total principal placed against obligations and units by the waterfall"
        default: 0
      - name: applied_fee_cents
        type: integer
        source: computed
        description: "Total late fees placed against obligations by the waterfall"
        default: 0
      - name: applied_sot_cure_cents
        type: integer
        source: computed
        description: "Total money placed against OPEN OutOfTrustIncident exposure by the waterfall"
        default: 0
      - name: unapplied_cents
        type: integer
        source: computed
        description: "amount_cents minus applied_principal_cents minus applied_fee_cents minus applied_sot_cure_cents; added to Dealer.unapplied_credit_cents"
        default: 0
      - name: allocation_breakdown
        type: array
        source: computed
        description: "Ordered allocation log; each element is { bucket, target_id, principal_cents, fee_cents } in the exact order the waterfall consumed money"
        default: []
      - name: applied_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which allocation completed"
        default: null

  - name: CovenantTest
    parent: Dealer
    common_fields: false
    entity_kind: event
    fields:
      - name: dealer_id
        type: string
        source: system
        description: "FK -> Dealer.id; the borrower whose financials were tested"
      - name: period_end_date
        type: datetime
        source: input
        description: "Fiscal period close the reported figures cover; anchors the trailing out-of-trust window"
      - name: reported_tangible_net_worth_cents
        type: integer
        source: input
        description: "Dealer-reported tangible net worth; the capital covenant input"
      - name: reported_ebitda_cents
        type: integer
        source: input
        description: "Dealer-reported EBITDA for the period; the cash-flow covenant numerator"
        constraints: ">= 0"
      - name: reported_interest_expense_cents
        type: integer
        source: input
        description: "Floor plan interest expense for the period; denominator term and the DEALER_ADJUSTED add-back"
        constraints: ">= 0"
      - name: reported_curtailment_paid_cents
        type: integer
        source: input
        description: "Curtailment principal actually paid during the period; denominator term"
        constraints: ">= 0"
      - name: reported_unrestricted_cash_cents
        type: integer
        source: input
        description: "Unrestricted cash at period end; recorded for the covenant package, not used by either DSCR variant"
        constraints: ">= 0"
      - name: required_tangible_net_worth_cents
        type: integer
        source: computed
        description: "round_half_up(CreditLine.credit_limit_cents * COVENANT_TNW_BPS_OF_LIMIT / 10000) for the dealer's non-TERMINATED line"
      - name: dscr_lender_standard
        type: number
        source: computed
        description: "LENDER_STANDARD variant of calculations.covenant_dscr, 4 decimal places"
      - name: dscr_dealer_adjusted
        type: number
        source: computed
        description: "DEALER_ADJUSTED variant of calculations.covenant_dscr, 4 decimal places"
      - name: trailing_sot_incident_count
        type: integer
        source: computed
        description: "COUNT(OutOfTrustIncident WHERE dealer_id = this.dealer_id AND status IN {OPEN, CURED, CHARGED_OFF} AND created_at >= period_end_date minus 364 days at 00:00:00.000Z AND created_at < period_end_date plus 1 day at 00:00:00.000Z)"
      - name: result
        type: enum
        source: computed
        description: "PASS only when all three covenants hold; otherwise FAIL"
        constraints: "one of {PASS, FAIL}"
      - name: failure_reason_codes
        type: array
        source: computed
        description: "Breached covenant codes in fixed order: CAPITAL before CASH_FLOW before OUT_OF_TRUST"
        default: []
        constraints: "subset of [CAPITAL, CASH_FLOW, OUT_OF_TRUST]"
      - name: submitted_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the CreditRiskManager operator who filed the test"

  - name: RemedyAction
    parent: Dealer
    common_fields: true
    entity_kind: resource
    fields:
      - name: dealer_id
        type: string
        source: system
        description: "FK -> Dealer.id; the defaulting borrower"
      - name: action_type
        type: enum
        source: input
        description: "Remedy ladder step; each step gates on a different Dealer.status"
        constraints: "one of {LINE_SUSPENSION, REPOSSESSION, LINE_TERMINATION}"
      - name: status
        type: enum
        source: system
        description: "Remedy execution state"
        default: ISSUED
        constraints: "one of {ISSUED, EXECUTED}"
      - name: reason_code
        type: enum
        source: input
        description: "Which default trigger justifies the remedy"
        constraints: "one of {SOT_INCIDENT, COVENANT_BREACH, CURTAILMENT_DELINQUENCY}"
      - name: justification_snapshot
        type: object
        source: computed
        description: "Frozen copy of { open_sot_incident_count, covenant_breach_count, delinquent_unit_count } read from the Dealer at issuance"
      - name: issued_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the issuing CreditRiskManager operator; the executor must differ"
      - name: executed_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the executing CreditRiskManager operator"
        default: null
      - name: executed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the ISSUED -> EXECUTED transition"
        default: null
      - name: units_repossessed_count
        type: integer
        source: computed
        description: "Number of units moved to REPOSSESSED by a REPOSSESSION execution; 0 for other action types"
        default: 0
      - name: principal_charged_off_cents
        type: integer
        source: computed
        description: "Principal moved from CreditLine.outstanding_principal_cents to CreditLine.charged_off_principal_cents by this execution"
        default: 0

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Dealer
    dimension: status
    initial_state: PROSPECT
    terminal_states: [TERMINATED]
    shape: cyclic
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /floorplan/credit-lines/{id}/activate (cascaded from the line activation)"
        actor: CreditOfficer
        preconditions:
          - "dealer.status == PROSPECT"
          - "the activating CreditLine.dealer_id == dealer.id"
        side_effects:
          - "Dealer.next_audit_due_at = CreditLine.activated_at + Dealer.audit_frequency_days days"
          - "increments Dealer.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: CreditLine ACTIVE -> SUSPENDED for any reason code"
        actor: system
        preconditions:
          - "dealer.status == ACTIVE"
        side_effects:
          - "no further FundingAdvance may be funded because every fund call re-checks CreditLine.status == ACTIVE"
          - "increments Dealer.version by 1"
        note: "Hop 5 of the reconcile cascade and hop 3 of the covenant-breach cascade both land here."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /floorplan/credit-lines/{id}/reinstate (cascaded from the line reinstatement)"
        actor: CreditRiskManager
        preconditions:
          - "dealer.status == SUSPENDED"
          - "dealer.open_sot_exposure_cents == 0"
          - "dealer.delinquent_unit_count == 0"
        side_effects:
          - "Dealer.covenant_breach_count = 0"
          - "increments Dealer.version by 1"
        note: "The cycle back to ACTIVE is what makes this machine non-linear."
      - from: SUSPENDED
        to: DEFAULTED
        trigger: "POST /floorplan/remedy-actions/{id}/execute with action_type = REPOSSESSION"
        actor: CreditRiskManager
        preconditions:
          - "dealer.status == SUSPENDED"
          - "dealer.open_sot_incident_count >= 1"
        side_effects:
          - "recomputes calculations.dealer_risk_rating"
          - "increments Dealer.version by 1"
      - from: DEFAULTED
        to: TERMINATED
        trigger: "POST /floorplan/remedy-actions/{id}/execute with action_type = LINE_TERMINATION"
        actor: CreditRiskManager
        preconditions:
          - "dealer.status == DEFAULTED"
        side_effects:
          - "CreditLine.status -> TERMINATED"
          - "increments Dealer.version by 1"

  - entity: CreditLine
    dimension: status
    initial_state: PENDING
    terminal_states: [TERMINATED]
    shape: cyclic
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /floorplan/credit-lines/{id}/activate"
        actor: CreditOfficer
        preconditions:
          - "line.status == PENDING"
          - "at least one CurtailmentTier row exists for this line"
        side_effects:
          - "CreditLine.activated_at = logical clock"
          - "CreditLine.available_credit_cents recomputed by calculations.credit_line_availability"
          - "Dealer.status PROSPECT -> ACTIVE"
          - "increments CreditLine.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: Dealer.open_sot_exposure_cents >= SOT_SUSPENSION_EXPOSURE_CENTS after audit reconcile, OR Dealer.covenant_breach_count >= COVENANT_BREACH_SUSPENSION_COUNT after a FAIL covenant test, OR POST /floorplan/remedy-actions/{id}/execute with action_type = LINE_SUSPENSION"
        actor: system
        preconditions:
          - "line.status == ACTIVE"
        side_effects:
          - "CreditLine.suspension_reason_code = SOT_EXPOSURE_THRESHOLD | COVENANT_BREACH_LIMIT | REMEDY_ACTION per the trigger"
          - "every FundingAdvance on this line with status == REQUESTED transitions to VOIDED with reason_code = LINE_SUSPENDED, processed in FundingAdvance.created_at ASC order"
          - "each VOIDED advance drives its InventoryUnit.funding_status PENDING_FUNDING -> REGISTERED"
          - "Dealer.status ACTIVE -> SUSPENDED"
          - "increments CreditLine.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /floorplan/credit-lines/{id}/reinstate"
        actor: CreditRiskManager
        preconditions:
          - "line.status == SUSPENDED"
          - "dealer.open_sot_exposure_cents == 0"
          - "dealer.delinquent_unit_count == 0"
          - "the CovenantTest with the greatest period_end_date (tie-break greatest created_at) for this dealer has dscr_dealer_adjusted >= REINSTATEMENT_MIN_DSCR_DEALER_ADJUSTED"
        side_effects:
          - "CreditLine.suspension_reason_code = null"
          - "Dealer.status SUSPENDED -> ACTIVE"
          - "Dealer.covenant_breach_count = 0"
          - "increments CreditLine.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /floorplan/remedy-actions/{id}/execute with action_type = LINE_TERMINATION"
        actor: CreditRiskManager
        preconditions:
          - "dealer.status == DEFAULTED"
        side_effects:
          - "CreditLine.available_credit_cents = 0"
          - "increments CreditLine.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /floorplan/remedy-actions/{id}/execute with action_type = LINE_TERMINATION"
        actor: CreditRiskManager
        preconditions:
          - "dealer.status == DEFAULTED"
        side_effects:
          - "CreditLine.available_credit_cents = 0"
          - "increments CreditLine.version by 1"

  - entity: InventoryUnit
    dimension: funding_status
    initial_state: REGISTERED
    terminal_states: [PAID_OFF, REPOSSESSED]
    shape: branching_with_cycles
    transitions:
      - from: REGISTERED
        to: PENDING_FUNDING
        trigger: "POST /floorplan/units/{id}/funding-advances"
        actor: DealerPrincipal
        preconditions:
          - "unit.funding_status == REGISTERED"
          - "no FundingAdvance for this unit has status IN {REQUESTED, FUNDED}"
        side_effects:
          - "creates FundingAdvance in REQUESTED with credit_line_id copied from the unit"
          - "increments InventoryUnit.version by 1"
      - from: PENDING_FUNDING
        to: FLOORED
        trigger: "POST /floorplan/funding-advances/{id}/fund"
        actor: CreditOfficer
        preconditions:
          - "unit.funding_status == PENDING_FUNDING"
          - "unit.title_custody_status == LENDER_HELD"
          - "unit.eligibility_status == ELIGIBLE"
          - "CreditLine.status == ACTIVE and Dealer.status == ACTIVE"
        side_effects:
          - "InventoryUnit.advance_amount_cents = calculations.unit_advance_amount output"
          - "InventoryUnit.outstanding_principal_cents = advance_amount_cents"
          - "InventoryUnit.floored_at = logical clock; InventoryUnit.funded_by_user_id = X-User-ID"
          - "creates one CurtailmentObligation in SCHEDULED per CurtailmentTier of this line and inventory_class whose cumulative_paydown_bps > 0, in tier_age_days_from ASC order, each with projected_principal_cents from the forward-looking variant of calculations.curtailment_requirement"
          - "CreditLine.outstanding_principal_cents and class_outstanding_cents_* increased; available_credit_cents recomputed by calculations.credit_line_availability"
          - "CreditLine.eligible_collateral_cents increased by the advance; borrowing_base_deficiency_cents recomputed"
          - "increments CreditLine.version by 1"
          - "increments InventoryUnit.version by 1"
      - from: PENDING_FUNDING
        to: REGISTERED
        trigger: "POST /floorplan/funding-advances/{id}/reject, or system void when the line is suspended"
        actor: CreditOfficer
        preconditions:
          - "unit.funding_status == PENDING_FUNDING"
        side_effects:
          - "FundingAdvance.status -> REJECTED or VOIDED"
          - "increments InventoryUnit.version by 1"
      - from: FLOORED
        to: REGISTERED
        trigger: "POST /floorplan/funding-advances/{id}/reverse"
        actor: CreditOfficer
        preconditions:
          - "unit.funding_status == FLOORED"
          - "InventoryUnit.principal_paid_cents == 0"
          - "logical clock <= FundingAdvance.funded_at + ADVANCE_REVERSAL_WINDOW_DAYS days"
          - "no CurtailmentObligation for this unit has status IN {DUE, DELINQUENT, PAID}"
        side_effects:
          - "FundingAdvance.status FUNDED -> REVERSED with reason_code = FUNDING_ERROR"
          - "every CurtailmentObligation of this unit with status == SCHEDULED transitions to CANCELLED, in due_date ASC then created_at ASC order"
          - "InventoryUnit.advance_amount_cents = 0; outstanding_principal_cents = 0; floored_at = null; funded_by_user_id = null"
          - "CreditLine.outstanding_principal_cents and class_outstanding_cents_* decreased by the reversed advance; available_credit_cents recomputed by calculations.credit_line_availability"
          - "CreditLine.eligible_collateral_cents and borrowing_base_deficiency_cents recomputed"
          - "increments CreditLine.version by 1"
          - "increments InventoryUnit.version by 1"
        note: "Compensating action for the fund transition; the capacity identity credit_limit_cents == available_credit_cents + outstanding_principal_cents + charged_off_principal_cents must read identically before the fund and after the reverse."
      - from: FLOORED
        to: DELINQUENT_CURTAILMENT
        trigger: "POST /floorplan/curtailment-runs (system checkpoint)"
        actor: system
        preconditions:
          - "unit.funding_status == FLOORED"
          - "at least one CurtailmentObligation of this unit transitioned to DELINQUENT during this run"
        side_effects:
          - "Dealer.delinquent_unit_count incremented"
          - "recomputes calculations.dealer_risk_rating, which rewrites Dealer.risk_score, Dealer.risk_rating and Dealer.audit_frequency_days"
          - "Dealer.next_audit_due_at recomputed from the new audit_frequency_days"
          - "CreditLine.eligible_collateral_cents unchanged: a delinquent unit stays in the borrowing base until it is classified ineligible"
          - "increments InventoryUnit.version by 1"
      - from: DELINQUENT_CURTAILMENT
        to: FLOORED
        trigger: "POST /floorplan/remittances with intent = CURTAILMENT clearing every DELINQUENT obligation of the unit"
        actor: DealerPrincipal
        preconditions:
          - "unit.funding_status == DELINQUENT_CURTAILMENT"
          - "after allocation, no CurtailmentObligation of this unit has status == DELINQUENT"
        side_effects:
          - "Dealer.delinquent_unit_count decremented"
          - "recomputes calculations.dealer_risk_rating and Dealer.audit_frequency_days"
          - "increments InventoryUnit.version by 1"
        note: "Second leg of the funding-status cycle FLOORED -> DELINQUENT_CURTAILMENT -> FLOORED."
      - from: FLOORED
        to: SOT_OPEN
        trigger: "POST /floorplan/audits/{id}/reconcile (cascaded through OutOfTrustIncident creation)"
        actor: system
        preconditions:
          - "unit.funding_status == FLOORED"
          - "an OutOfTrustIncident was just created for this unit"
        side_effects:
          - "InventoryUnit.eligibility_status -> INELIGIBLE_SOLD_OUT_OF_TRUST or INELIGIBLE_MISSING per calculations.observation_classification"
          - "InventoryUnit.ineligibility_reason_code set to SOLD_OUT_OF_TRUST or MISSING"
          - "CreditLine.eligible_collateral_cents recomputed; borrowing_base_deficiency_cents recomputed"
          - "increments InventoryUnit.version by 1"
      - from: DELINQUENT_CURTAILMENT
        to: SOT_OPEN
        trigger: "POST /floorplan/audits/{id}/reconcile (cascaded through OutOfTrustIncident creation)"
        actor: system
        preconditions:
          - "unit.funding_status == DELINQUENT_CURTAILMENT"
          - "an OutOfTrustIncident was just created for this unit"
        side_effects:
          - "InventoryUnit.eligibility_status and ineligibility_reason_code set per calculations.observation_classification"
          - "Dealer.delinquent_unit_count decremented because the unit left DELINQUENT_CURTAILMENT"
          - "CreditLine.eligible_collateral_cents and borrowing_base_deficiency_cents recomputed"
          - "increments InventoryUnit.version by 1"
      - from: SOT_OPEN
        to: FLOORED
        trigger: "POST /floorplan/remittances with intent = SOT_CURE covering the full incident exposure"
        actor: DealerPrincipal
        preconditions:
          - "unit.funding_status == SOT_OPEN"
          - "the unit's OutOfTrustIncident with status == OPEN receives applied_sot_cure_cents >= its exposure_cents"
        side_effects:
          - "OutOfTrustIncident.status OPEN -> CURED with resolution_reason_code = DEALER_PAYOFF"
          - "InventoryUnit.eligibility_status -> ELIGIBLE and ineligibility_reason_code -> null"
          - "InventoryUnit.outstanding_principal_cents reduced by the cure amount; principal_paid_cents increased by the same amount"
          - "Dealer.open_sot_incident_count and open_sot_exposure_cents decreased"
          - "CreditLine.eligible_collateral_cents and borrowing_base_deficiency_cents recomputed"
          - "increments InventoryUnit.version by 1"
        note: "Second cycle on this dimension: SOT_OPEN -> FLOORED restores a cured unit to the borrowing base."
      - from: SOT_OPEN
        to: REPOSSESSED
        trigger: "POST /floorplan/remedy-actions/{id}/execute with action_type = REPOSSESSION"
        actor: CreditRiskManager
        preconditions:
          - "unit.funding_status == SOT_OPEN"
          - "dealer.status == SUSPENDED"
        side_effects:
          - "OutOfTrustIncident.status OPEN -> CHARGED_OFF with resolution_reason_code = REPOSSESSION_CHARGE_OFF"
          - "CreditLine.charged_off_principal_cents increased by InventoryUnit.outstanding_principal_cents"
          - "InventoryUnit.outstanding_principal_cents = 0"
          - "CreditLine.outstanding_principal_cents decreased by the same amount; available_credit_cents recomputed by calculations.credit_line_availability so the capacity identity still holds"
          - "Dealer.open_sot_incident_count and open_sot_exposure_cents decreased; Dealer.status SUSPENDED -> DEFAULTED"
          - "every CurtailmentObligation of this unit with status IN {SCHEDULED, DUE, DELINQUENT} transitions to CANCELLED, in due_date ASC then created_at ASC order"
          - "increments InventoryUnit.version by 1"
      - from: FLOORED
        to: PAID_OFF
        trigger: "POST /floorplan/remittances with intent = UNIT_PAYOFF"
        actor: DealerPrincipal
        preconditions:
          - "unit.funding_status == FLOORED"
          - "remittance.amount_cents >= unit.outstanding_principal_cents plus every unpaid late_fee_cents on the unit's DUE and DELINQUENT obligations"
        side_effects:
          - "InventoryUnit.outstanding_principal_cents = 0; principal_paid_cents = advance_amount_cents"
          - "every CurtailmentObligation of this unit with status IN {SCHEDULED, DUE, DELINQUENT} transitions to CANCELLED, in due_date ASC then created_at ASC order"
          - "CreditLine.outstanding_principal_cents decreased; available_credit_cents recomputed by calculations.credit_line_availability"
          - "CreditLine.eligible_collateral_cents and borrowing_base_deficiency_cents recomputed"
          - "increments InventoryUnit.version by 1"
      - from: DELINQUENT_CURTAILMENT
        to: PAID_OFF
        trigger: "POST /floorplan/remittances with intent = UNIT_PAYOFF"
        actor: DealerPrincipal
        preconditions:
          - "unit.funding_status == DELINQUENT_CURTAILMENT"
          - "remittance.amount_cents >= unit.outstanding_principal_cents plus every unpaid late_fee_cents on the unit's DUE and DELINQUENT obligations"
        side_effects:
          - "same ledger side effects as the FLOORED -> PAID_OFF transition"
          - "Dealer.delinquent_unit_count decremented; recomputes calculations.dealer_risk_rating"
          - "increments InventoryUnit.version by 1"

  - entity: InventoryUnit
    dimension: title_custody_status
    initial_state: NOT_RECEIVED
    terminal_states: [RELEASED_FOR_SALE]
    shape: cyclic
    note: "Second, independent state dimension on the same InventoryUnit row. It advances on its own trigger set and its values gate the funding dimension, but the funding dimension never moves this one."
    transitions:
      - from: NOT_RECEIVED
        to: LENDER_HELD
        trigger: "POST /floorplan/units/{id}/title-custody with new_custody_status = LENDER_HELD"
        actor: CreditOfficer
        preconditions:
          - "unit.title_custody_status == NOT_RECEIVED"
          - "unit.title_document_type == MSO when unit.inventory_class == NEW, otherwise TITLE"
        side_effects:
          - "the unit becomes fundable because the fund transition requires LENDER_HELD"
          - "increments InventoryUnit.version by 1"
      - from: NOT_RECEIVED
        to: LOST
        trigger: "POST /floorplan/units/{id}/title-custody with new_custody_status = LOST"
        actor: CreditOfficer
        preconditions:
          - "unit.title_custody_status == NOT_RECEIVED"
        side_effects:
          - "InventoryUnit.eligibility_status -> INELIGIBLE_TITLE_DEFECT and ineligibility_reason_code -> TITLE_DEFECT"
          - "CreditLine.eligible_collateral_cents and borrowing_base_deficiency_cents recomputed"
          - "increments InventoryUnit.version by 1"
      - from: LENDER_HELD
        to: LOST
        trigger: "POST /floorplan/units/{id}/title-custody with new_custody_status = LOST"
        actor: CreditOfficer
        preconditions:
          - "unit.title_custody_status == LENDER_HELD"
        side_effects:
          - "InventoryUnit.eligibility_status -> INELIGIBLE_TITLE_DEFECT and ineligibility_reason_code -> TITLE_DEFECT"
          - "CreditLine.eligible_collateral_cents recomputed; borrowing_base_deficiency_cents recomputed"
          - "increments InventoryUnit.version by 1"
      - from: LOST
        to: LENDER_HELD
        trigger: "POST /floorplan/units/{id}/title-custody with new_custody_status = LENDER_HELD (duplicate document recovered)"
        actor: CreditOfficer
        preconditions:
          - "unit.title_custody_status == LOST"
          - "document_reference is present in the request body"
        side_effects:
          - "InventoryUnit.eligibility_status -> ELIGIBLE and ineligibility_reason_code -> null, but only when ineligibility_reason_code == TITLE_DEFECT"
          - "CreditLine.eligible_collateral_cents and borrowing_base_deficiency_cents recomputed"
          - "increments InventoryUnit.version by 1"
        note: "Closes the cycle on this dimension."
      - from: LENDER_HELD
        to: RELEASED_FOR_SALE
        trigger: "POST /floorplan/units/{id}/title-custody with new_custody_status = RELEASED_FOR_SALE"
        actor: CreditOfficer
        preconditions:
          - "unit.title_custody_status == LENDER_HELD"
          - "unit.outstanding_principal_cents == 0"
          - "unit.funding_status IN {REGISTERED, PAID_OFF}"
        side_effects:
          - "the document leaves lender custody permanently; this dimension is terminal"
          - "increments InventoryUnit.version by 1"

  - entity: FundingAdvance
    dimension: status
    initial_state: REQUESTED
    terminal_states: [REJECTED, VOIDED, REVERSED]
    shape: branching
    transitions:
      - from: REQUESTED
        to: FUNDED
        trigger: "POST /floorplan/funding-advances/{id}/fund"
        actor: CreditOfficer
        preconditions:
          - "advance.status == REQUESTED"
          - "payload expected_credit_line_version == CreditLine.version"
          - "CreditLine.status == ACTIVE and Dealer.status == ACTIVE"
          - "unit.title_custody_status == LENDER_HELD and unit.eligibility_status == ELIGIBLE"
          - "invoice_age_days_at_funding <= MAX_FLOOR_AGE_DAYS"
          - "at least one CurtailmentTier exists for (credit_line_id, unit.inventory_class)"
          - "calculations.unit_advance_amount output <= CreditLine.available_credit_cents"
          - "for USED and DEMONSTRATOR units, class_outstanding_cents_<class> + advance <= class_sublimit_cents_<class>"
        side_effects:
          - "writes approved_advance_amount_cents, effective_advance_rate_bps, rate_adjustment_codes and invoice_age_days_at_funding from calculations.unit_advance_amount"
          - "InventoryUnit.funding_status PENDING_FUNDING -> FLOORED with its full side-effect set"
          - "increments CreditLine.version by 1"
        note: "Branch A of the fork; carries the ledger and obligation-ladder side effects."
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /floorplan/funding-advances/{id}/reject"
        actor: CreditOfficer
        preconditions:
          - "advance.status == REQUESTED"
        side_effects:
          - "FundingAdvance.reason_code set from the request body"
          - "InventoryUnit.funding_status PENDING_FUNDING -> REGISTERED"
          - "no ledger movement whatsoever: CreditLine.available_credit_cents is untouched"
        note: "Branch B of the fork; deliberately side-effect-free on the ledger, which is what distinguishes it from VOIDED."
      - from: REQUESTED
        to: VOIDED
        trigger: "system event: CreditLine ACTIVE -> SUSPENDED"
        actor: system
        preconditions:
          - "advance.status == REQUESTED"
          - "the advance's credit_line_id is the line being suspended"
        side_effects:
          - "FundingAdvance.reason_code = LINE_SUSPENDED"
          - "InventoryUnit.funding_status PENDING_FUNDING -> REGISTERED"
        note: "Branch C of the fork; reached only by cascade, never by a direct client call."
      - from: FUNDED
        to: REVERSED
        trigger: "POST /floorplan/funding-advances/{id}/reverse"
        actor: CreditOfficer
        preconditions:
          - "advance.status == FUNDED"
          - "payload expected_credit_line_version == CreditLine.version"
          - "logical clock <= funded_at + ADVANCE_REVERSAL_WINDOW_DAYS days"
          - "InventoryUnit.principal_paid_cents == 0"
          - "no CurtailmentObligation of the unit has status IN {DUE, DELINQUENT, PAID}"
        side_effects:
          - "FundingAdvance.reason_code = FUNDING_ERROR"
          - "InventoryUnit.funding_status FLOORED -> REGISTERED with its full compensating side-effect set"
          - "increments CreditLine.version by 1"

  - entity: CurtailmentObligation
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [PAID, SUPERSEDED, CANCELLED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: DUE
        trigger: "POST /floorplan/curtailment-runs"
        actor: system
        preconditions:
          - "obligation.status == SCHEDULED"
          - "run as_of_date >= obligation.due_date"
          - "the obligation's unit has funding_status IN {FLOORED, DELINQUENT_CURTAILMENT}"
        side_effects:
          - "required_principal_cents written from the assessed chronological variant of calculations.curtailment_requirement"
          - "total_amount_due_cents = required_principal_cents (late_fee_cents is still 0)"
          - "became_due_at = logical clock"
          - "contributes required_principal_cents to the run's calculations.curtailment_run_dealer_total output"
          - "increments CurtailmentObligation.version by 1"
      - from: DUE
        to: DELINQUENT
        trigger: "POST /floorplan/curtailment-runs"
        actor: system
        preconditions:
          - "obligation.status == DUE"
          - "run as_of_date > obligation.due_date + CreditLine.curtailment_grace_days days"
          - "principal_paid_cents < required_principal_cents"
        side_effects:
          - "late_fee_cents and total_amount_due_cents written by calculations.delinquency_assessment"
          - "became_delinquent_at = logical clock"
          - "any AgingExceptionRequest on this obligation with status == PENDING transitions to EXPIRED"
          - "the obligation's InventoryUnit transitions FLOORED -> DELINQUENT_CURTAILMENT, which starts the risk-rating cascade"
          - "increments CurtailmentObligation.version by 1"
      - from: DUE
        to: PAID
        trigger: "POST /floorplan/remittances (waterfall allocation)"
        actor: DealerPrincipal
        preconditions:
          - "obligation.status == DUE"
          - "principal_paid_cents == required_principal_cents after allocation"
        side_effects:
          - "InventoryUnit.principal_paid_cents increased and outstanding_principal_cents decreased by the allocated principal"
          - "CreditLine.outstanding_principal_cents decreased; available_credit_cents recomputed by calculations.credit_line_availability"
          - "increments CurtailmentObligation.version by 1"
      - from: DELINQUENT
        to: PAID
        trigger: "POST /floorplan/remittances (waterfall allocation)"
        actor: DealerPrincipal
        preconditions:
          - "obligation.status == DELINQUENT"
          - "fee_paid_cents == late_fee_cents AND principal_paid_cents == required_principal_cents after allocation"
        side_effects:
          - "same ledger movements as the DUE -> PAID transition"
          - "when no DELINQUENT obligation remains on the unit, InventoryUnit transitions DELINQUENT_CURTAILMENT -> FLOORED"
          - "increments CurtailmentObligation.version by 1"
        note: "Fees are consumed before principal inside a single obligation, so a partial payment on a DELINQUENT obligation clears late_fee_cents first."
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "POST /floorplan/aging-exceptions/{id}/decision with decision = APPROVE"
        actor: CreditRiskManager
        preconditions:
          - "obligation.status == SCHEDULED"
        side_effects:
          - "creates a replacement CurtailmentObligation in SCHEDULED with supersedes_obligation_id = this row's id, extension_days_applied = decided_extension_days, due_date = this row's due_date + decided_extension_days days, and projected_principal_cents copied unchanged"
          - "InventoryUnit.aging_exception_count and curtailment_extension_days_total increased"
          - "increments CurtailmentObligation.version by 1"
      - from: DUE
        to: SUPERSEDED
        trigger: "POST /floorplan/aging-exceptions/{id}/decision with decision = APPROVE"
        actor: CreditRiskManager
        preconditions:
          - "obligation.status == DUE"
        side_effects:
          - "creates a replacement CurtailmentObligation in SCHEDULED as in the SCHEDULED -> SUPERSEDED transition; required_principal_cents on the replacement resets to 0 and will be re-assessed at its own DUE transition"
          - "InventoryUnit.aging_exception_count and curtailment_extension_days_total increased"
          - "increments CurtailmentObligation.version by 1"
        note: "The replacement's required_principal_cents is re-assessed later, so an approved exception on a DUE obligation can change the amount owed, not just the date."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /floorplan/remittances with intent = UNIT_PAYOFF, POST /floorplan/funding-advances/{id}/reverse, or REPOSSESSION remedy execution"
        actor: system
        preconditions:
          - "obligation.status == SCHEDULED"
        side_effects:
          - "no ledger movement; the obligation simply leaves the ladder"
          - "increments CurtailmentObligation.version by 1"
      - from: DUE
        to: CANCELLED
        trigger: "POST /floorplan/remittances with intent = UNIT_PAYOFF, or REPOSSESSION remedy execution"
        actor: system
        preconditions:
          - "obligation.status == DUE"
        side_effects:
          - "no ledger movement beyond what the payoff or charge-off already recorded"
          - "increments CurtailmentObligation.version by 1"
      - from: DELINQUENT
        to: CANCELLED
        trigger: "POST /floorplan/remittances with intent = UNIT_PAYOFF, or REPOSSESSION remedy execution"
        actor: system
        preconditions:
          - "obligation.status == DELINQUENT"
        side_effects:
          - "Dealer.delinquent_unit_count decremented when the unit no longer has any DELINQUENT obligation"
          - "increments CurtailmentObligation.version by 1"

  - entity: AgingExceptionRequest
    dimension: status
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED, EXPIRED]
    shape: branching
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /floorplan/aging-exceptions/{id}/decision with decision = APPROVE"
        actor: CreditRiskManager
        preconditions:
          - "request.status == PENDING"
          - "X-User-ID != InventoryUnit.funded_by_user_id of the obligation's unit"
          - "the obligation's unit has no OutOfTrustIncident with status == OPEN"
          - "decided_extension_days is present and 1 <= decided_extension_days <= requested_extension_days"
          - "InventoryUnit.aging_exception_count < MAX_APPROVED_EXCEPTIONS_PER_UNIT"
          - "InventoryUnit.curtailment_extension_days_total + decided_extension_days <= MAX_EXTENSION_DAYS_PER_UNIT"
          - "obligation.status IN {SCHEDULED, DUE}"
        side_effects:
          - "decided_by_user_id = X-User-ID; decided_at = logical clock; replacement_obligation_id set"
          - "the target CurtailmentObligation transitions to SUPERSEDED, which creates the replacement obligation"
          - "InventoryUnit.aging_exception_count += 1 and curtailment_extension_days_total += decided_extension_days"
          - "increments AgingExceptionRequest.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /floorplan/aging-exceptions/{id}/decision with decision = DENY"
        actor: CreditRiskManager
        preconditions:
          - "request.status == PENDING"
          - "X-User-ID != InventoryUnit.funded_by_user_id of the obligation's unit"
        side_effects:
          - "decided_by_user_id and decided_at written; reason_code recorded"
          - "the target obligation keeps its status and due_date unchanged"
          - "increments AgingExceptionRequest.version by 1"
      - from: PENDING
        to: EXPIRED
        trigger: "POST /floorplan/curtailment-runs (the target obligation went DUE -> DELINQUENT)"
        actor: system
        preconditions:
          - "request.status == PENDING"
          - "the target obligation transitioned to DELINQUENT during this run"
        side_effects:
          - "no obligation is created; the dealer must remit or request relief again on the replacement ladder"
          - "counted in the run output's exceptions_expired_count"
          - "increments AgingExceptionRequest.version by 1"

  - entity: FloorPlanAudit
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [RECONCILED_CLEAN, RECONCILED_EXCEPTIONS, ABORTED]
    shape: branching_fork_join
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /floorplan/audits/{id}/start"
        actor: FieldAuditor
        preconditions:
          - "audit.status == SCHEDULED"
          - "Dealer.status IN {ACTIVE, SUSPENDED}"
          - "window_start_date <= logical clock <= window_end_date, comparing calendar dates inclusively at both ends"
          - "Dealer.audit_in_progress == false"
        side_effects:
          - "units_in_scope_count = COUNT(InventoryUnit WHERE dealer_id = audit.dealer_id AND funding_status IN {FLOORED, DELINQUENT_CURTAILMENT})"
          - "units_unobserved_count = units_in_scope_count; units_verified_count = 0; units_exception_count = 0"
          - "started_at = logical clock; Dealer.audit_in_progress = true"
          - "increments FloorPlanAudit.version by 1"
      - from: IN_PROGRESS
        to: RECONCILED_CLEAN
        trigger: "POST /floorplan/audits/{id}/reconcile"
        actor: AuditManager
        preconditions:
          - "audit.status == IN_PROGRESS"
          - "X-User-ID does not appear in audit.observer_user_ids"
          - "units_verified_count + units_exception_count >= 1 OR units_in_scope_count == 0"
          - "units_exception_count == 0"
        side_effects:
          - "sot_exposure_cents = 0 (calculations.audit_sot_exposure over an empty out-of-trust set)"
          - "reconciled_at = logical clock; reconciled_by_user_id = X-User-ID; Dealer.audit_in_progress = false"
          - "no OutOfTrustIncident is created and no unit's eligibility_status changes"
          - "recomputes calculations.dealer_risk_rating, then Dealer.next_audit_due_at = reconciled_at + Dealer.audit_frequency_days days"
          - "increments FloorPlanAudit.version by 1"
        note: "Clean branch: the join point writes next_audit_due_at exactly as the exception branch does, which is what makes an unannounced count 'count' toward the frequency requirement."
      - from: IN_PROGRESS
        to: RECONCILED_EXCEPTIONS
        trigger: "POST /floorplan/audits/{id}/reconcile"
        actor: AuditManager
        preconditions:
          - "audit.status == IN_PROGRESS"
          - "X-User-ID does not appear in audit.observer_user_ids"
          - "units_verified_count + units_exception_count >= 1"
          - "units_exception_count >= 1"
        side_effects:
          - "sot_exposure_cents written by calculations.audit_sot_exposure"
          - "hop 1: for every UnitAuditObservation of this audit with is_out_of_trust == true, in created_at ASC order, creates an OutOfTrustIncident in OPEN with exposure_cents = the unit's current outstanding_principal_cents and cure_deadline_at = reconciled_at + SOT_CURE_DAYS days"
          - "hop 2: each created incident drives its InventoryUnit funding_status -> SOT_OPEN and eligibility_status to the value calculations.observation_classification mapped"
          - "hop 2b: every non-out-of-trust exception observation writes its unit's eligibility_status and ineligibility_reason_code (TITLE_EXCEPTION -> INELIGIBLE_TITLE_DEFECT/TITLE_DEFECT, DAMAGE_EXCEPTION -> INELIGIBLE_DAMAGE/DAMAGE, WHOLESALE_EXCEPTION -> INELIGIBLE_WHOLESALE/WHOLESALE) without creating an incident"
          - "hop 3: each unit leaving ELIGIBLE forces CreditLine.eligible_collateral_cents and borrowing_base_deficiency_cents to be recomputed, and Dealer.open_sot_incident_count / open_sot_exposure_cents to be increased"
          - "hop 4: when Dealer.open_sot_exposure_cents >= SOT_SUSPENSION_EXPOSURE_CENTS, CreditLine.status ACTIVE -> SUSPENDED with suspension_reason_code = SOT_EXPOSURE_THRESHOLD"
          - "hop 5: the line suspension voids every REQUESTED FundingAdvance on the line and drives Dealer.status ACTIVE -> SUSPENDED"
          - "reconciled_at = logical clock; reconciled_by_user_id = X-User-ID; Dealer.audit_in_progress = false"
          - "recomputes calculations.dealer_risk_rating, then Dealer.next_audit_due_at = reconciled_at + Dealer.audit_frequency_days days"
          - "increments FloorPlanAudit.version by 1"
        note: "Exception branch: same join point, radically different side-effect set. This is the depth-5 cascade of Rule 4."
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /floorplan/audits/{id}/abort"
        actor: AuditManager
        preconditions:
          - "audit.status == SCHEDULED"
        side_effects:
          - "abort_reason_code recorded; counters stay at 0 so units_in_scope_count == units_verified_count + units_exception_count + units_unobserved_count still holds"
          - "increments FloorPlanAudit.version by 1"
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /floorplan/audits/{id}/abort"
        actor: AuditManager
        preconditions:
          - "audit.status == IN_PROGRESS"
        side_effects:
          - "units_verified_count = 0; units_exception_count = 0; units_unobserved_count = units_in_scope_count; sot_exposure_cents = 0"
          - "already-recorded UnitAuditObservation rows are immutable and remain readable through GET /floorplan/audits/{id}/observations"
          - "no OutOfTrustIncident is created and no unit's eligibility_status or funding_status changes"
          - "Dealer.audit_in_progress = false; Dealer.next_audit_due_at is NOT advanced"
          - "increments FloorPlanAudit.version by 1"
        note: "Compensating action for the observation transitions; the count identity units_in_scope_count == units_verified_count + units_exception_count + units_unobserved_count must read identically before the first observation and after the abort."

  - entity: OutOfTrustIncident
    dimension: status
    initial_state: OPEN
    terminal_states: [CURED, CHARGED_OFF]
    shape: branching
    transitions:
      - from: OPEN
        to: CURED
        trigger: "POST /floorplan/remittances with intent = SOT_CURE"
        actor: DealerPrincipal
        preconditions:
          - "incident.status == OPEN"
          - "the waterfall allocated applied_sot_cure_cents >= incident.exposure_cents"
        side_effects:
          - "cured_at = logical clock; resolution_reason_code = DEALER_PAYOFF"
          - "InventoryUnit.funding_status SOT_OPEN -> FLOORED with its full side-effect set"
          - "Dealer.open_sot_incident_count -= 1 and open_sot_exposure_cents -= exposure_cents"
          - "recomputes calculations.dealer_risk_rating and Dealer.audit_frequency_days"
          - "increments OutOfTrustIncident.version by 1"
      - from: OPEN
        to: CHARGED_OFF
        trigger: "POST /floorplan/remedy-actions/{id}/execute with action_type = REPOSSESSION"
        actor: CreditRiskManager
        preconditions:
          - "incident.status == OPEN"
          - "dealer.status == SUSPENDED"
        side_effects:
          - "charged_off_at = logical clock; resolution_reason_code = REPOSSESSION_CHARGE_OFF"
          - "InventoryUnit.funding_status SOT_OPEN -> REPOSSESSED with its full side-effect set"
          - "Dealer.open_sot_incident_count -= 1 and open_sot_exposure_cents -= exposure_cents"
          - "recomputes calculations.dealer_risk_rating and Dealer.audit_frequency_days"
          - "increments OutOfTrustIncident.version by 1"

  - entity: PaymentRemittance
    dimension: status
    initial_state: RECEIVED
    terminal_states: [APPLIED, PARTIALLY_APPLIED]
    shape: branching
    note: "Allocation is synchronous: the RECEIVED instant exists only inside the POST /floorplan/remittances request, and the response always carries APPLIED or PARTIALLY_APPLIED."
    transitions:
      - from: RECEIVED
        to: APPLIED
        trigger: "POST /floorplan/remittances (automatic, same request)"
        actor: system
        preconditions:
          - "calculations.remittance_waterfall_allocation consumed the whole amount, i.e. unapplied_cents == 0"
        side_effects:
          - "applied_principal_cents, applied_fee_cents, applied_sot_cure_cents and allocation_breakdown written"
          - "applied_at = logical clock"
          - "every touched CurtailmentObligation, InventoryUnit, CreditLine and OutOfTrustIncident is updated per the waterfall"
          - "increments Dealer.version by 1"
      - from: RECEIVED
        to: PARTIALLY_APPLIED
        trigger: "POST /floorplan/remittances (automatic, same request)"
        actor: system
        preconditions:
          - "calculations.remittance_waterfall_allocation left a residue, i.e. unapplied_cents > 0"
        side_effects:
          - "Dealer.unapplied_credit_cents += unapplied_cents"
          - "applied_principal_cents, applied_fee_cents, applied_sot_cure_cents and allocation_breakdown written"
          - "applied_at = logical clock"
          - "increments Dealer.version by 1"

  - entity: RemedyAction
    dimension: status
    initial_state: ISSUED
    terminal_states: [EXECUTED]
    shape: linear
    transitions:
      - from: ISSUED
        to: EXECUTED
        trigger: "POST /floorplan/remedy-actions/{id}/execute"
        actor: CreditRiskManager
        preconditions:
          - "remedy.status == ISSUED"
          - "X-User-ID != remedy.issued_by_user_id"
          - "action_type == LINE_SUSPENSION requires Dealer.status == ACTIVE and CreditLine.status == ACTIVE"
          - "action_type == REPOSSESSION requires Dealer.status == SUSPENDED and Dealer.open_sot_incident_count >= 1"
          - "action_type == LINE_TERMINATION requires Dealer.status == DEFAULTED"
        side_effects:
          - "executed_by_user_id = X-User-ID; executed_at = logical clock"
          - "LINE_SUSPENSION: CreditLine.status ACTIVE -> SUSPENDED with suspension_reason_code = REMEDY_ACTION and its full cascade"
          - "REPOSSESSION: every InventoryUnit of the dealer with funding_status == SOT_OPEN, processed in InventoryUnit.created_at ASC order, transitions SOT_OPEN -> REPOSSESSED; units_repossessed_count and principal_charged_off_cents written; Dealer.status SUSPENDED -> DEFAULTED"
          - "LINE_TERMINATION: CreditLine.status -> TERMINATED and Dealer.status DEFAULTED -> TERMINATED"
          - "increments RemedyAction.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's version; no other mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: advance-fund-stale-credit-line
    parent_entity: CreditLine
    write_endpoint: "POST /floorplan/funding-advances/{id}/fund"
    occ_field: "expected_credit_line_version"
    description: |
      Funding an advance against a CreditLine whose version has advanced since
      the client last read it is rejected with a stale-version error. Funding a
      second, different advance on the same line is legitimate product behavior
      (the line has capacity and each advance is its own resource), so the
      operation cannot be resolved by any state precondition: a second sequential
      fund of advance B observes advance B still in REQUESTED and the line still
      ACTIVE. What the second caller does not see is that funding advance A moved
      CreditLine.available_credit_cents and bumped CreditLine.version, so its
      capacity view is stale. The OCC check turns that into a deterministic
      412 the caller resolves by re-reading the line.
    error_id: ERR_STALE_CREDIT_LINE_VERSION
    http_status: 412
  - rule_id: remittance-apply-stale-dealer
    parent_entity: Dealer
    write_endpoint: "POST /floorplan/remittances"
    occ_field: "expected_dealer_version"
    description: |
      Applying a remittance against a Dealer whose version has advanced since
      the client last read it is rejected with a stale-version error. A dealer
      may legitimately remit any number of times, so a second sequential
      remittance is never blocked by a state precondition; but the allocation
      waterfall consumes obligations in a fixed order, so a caller whose view of
      the dealer predates an earlier allocation would silently direct money at
      buckets that no longer exist. OCC on Dealer.version forces the caller to
      re-read the post-allocation ledger before remitting again.
    error_id: ERR_STALE_DEALER_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: unit_advance_amount
    trigger: "FundingAdvance REQUESTED -> FUNDED (POST /floorplan/funding-advances/{id}/fund)"
    algorithm: threshold
    formula: |
      # Step 1 - basis capping (per-class cap, never a rejection)
      cap_cents = CreditLine.max_unit_advance_cents_<lower(unit.inventory_class)>
      basis_cents = min(unit.invoice_amount_cents, cap_cents)

      # Step 2 - invoice age in whole days against the logical clock
      invoice_age_days = floor((logical_clock - unit.invoice_date) / 1 day)

      # Step 3 - haircuts, applied additively to the base rate in a pinned order
      base_bps = CreditLine.advance_rate_bps_<lower(unit.inventory_class)>
      effective_bps = base_bps
      rate_adjustment_codes = []
      if unit.inventory_class == DEMONSTRATOR
         and unit.odometer_miles > DEMO_HIGH_MILEAGE_THRESHOLD_MILES:
          effective_bps -= DEMO_HIGH_MILEAGE_HAIRCUT_BPS
          rate_adjustment_codes.append("HIGH_MILEAGE_DEMO")
      if invoice_age_days >= AGED_INVOICE_HAIRCUT_DAYS:
          effective_bps -= AGED_INVOICE_HAIRCUT_BPS
          rate_adjustment_codes.append("AGED_INVOICE")
      effective_bps = max(0, effective_bps)

      # Step 4 - single rounding step, no intermediate rounding
      advance_cents = round_half_up(basis_cents * effective_bps / 10000)

      # Step 5 - capacity gates (rejections, NOT partial funding)
      if advance_cents > CreditLine.available_credit_cents:
          reject ERR_CREDIT_LIMIT_EXCEEDED
      if unit.inventory_class in {USED, DEMONSTRATOR}
         and CreditLine.class_outstanding_cents_<lower(class)> + advance_cents
             > CreditLine.class_sublimit_cents_<lower(class)>:
          reject ERR_CLASS_SUBLIMIT_EXCEEDED
      return advance_cents
    input_set: "Exactly one InventoryUnit in funding_status PENDING_FUNDING whose title_custody_status is LENDER_HELD and eligibility_status is ELIGIBLE, plus the ACTIVE CreditLine it names."
    constants:
      DEMO_HIGH_MILEAGE_THRESHOLD_MILES: 3000
      DEMO_HIGH_MILEAGE_HAIRCUT_BPS: 500
      AGED_INVOICE_HAIRCUT_DAYS: 45
      AGED_INVOICE_HAIRCUT_BPS: 250
    precision: "Integer cents; the single division is rounded round_half_up to 0 decimals. Rounding happens exactly once, after both haircuts are folded into effective_bps."
    boundary_notes:
      - "odometer_miles == 3000 does NOT trigger the mileage haircut; 3001 does (strict >)."
      - "invoice_age_days == 45 DOES trigger the aged-invoice haircut (>=); 44 does not."
      - "advance_cents == available_credit_cents is allowed; only advance_cents > available_credit_cents is rejected."
      - "Both haircuts stack: a DEMONSTRATOR with 3001 miles and a 45-day-old invoice loses 750 bps."

  - name: curtailment_requirement
    trigger: "Forward-looking variant: CurtailmentObligation creation during FundingAdvance REQUESTED -> FUNDED, and on every GET /floorplan/units/{id}/curtailment-schedule read. Assessed variant: CurtailmentObligation SCHEDULED -> DUE during POST /floorplan/curtailment-runs."
    algorithm: chronological
    formula: |
      # Tier ladder for the unit: all CurtailmentTier rows of the unit's
      # credit_line_id and inventory_class with cumulative_paydown_bps > 0,
      # ordered by age_days_from ASC (the half-open buckets never overlap, so
      # this order is total and needs no tie-break).
      tiers = [t for t in CurtailmentTier
               if t.credit_line_id == unit.credit_line_id
               and t.inventory_class == unit.inventory_class
               and t.cumulative_paydown_bps > 0]
              sorted by age_days_from ASC

      cumulative(k) = round_half_up(unit.advance_amount_cents
                                    * tiers[k].cumulative_paydown_bps / 10000)
      cumulative(-1) = 0

      # --- FORWARD_PROJECTED (variant 1) -------------------------------------
      # Assumes every earlier tier requirement was paid exactly on its due date
      # and that no voluntary prepayment ever happened.
      projected_principal_cents(k) = cumulative(k) - cumulative(k - 1)

      # --- ASSESSED_ACTUAL (variant 2) ---------------------------------------
      # Reads the unit's real principal_paid_cents at the moment the obligation
      # goes DUE, so voluntary prepayments and early curtailments reduce it.
      required_principal_cents(k) = max(0,
          min(cumulative(k) - unit.principal_paid_cents,
              unit.outstanding_principal_cents))
    input_set: "One InventoryUnit with funding_status IN {FLOORED, DELINQUENT_CURTAILMENT} and its non-zero CurtailmentTier rows. CANCELLED and SUPERSEDED obligations are excluded from principal_paid_cents only in the sense that principal_paid_cents is a unit-level total: every cent the waterfall ever applied to the unit counts, regardless of which obligation absorbed it."
    constants: {}
    precision: "Integer cents; each cumulative(k) is rounded round_half_up independently, then subtracted. Never round the difference."
    variants:
      - name: FORWARD_PROJECTED
        when: "Written into CurtailmentObligation.projected_principal_cents at obligation creation (funding time) and returned by GET /floorplan/units/{id}/curtailment-schedule at any later time, unchanged."
        difference: "Uses the difference of adjacent cumulative tier requirements over the ORIGINAL advance_amount_cents. It is blind to actual payments, so it never changes after funding."
      - name: ASSESSED_ACTUAL
        when: "Written into CurtailmentObligation.required_principal_cents at the SCHEDULED -> DUE transition inside a curtailment run."
        difference: "Subtracts the unit's ACTUAL principal_paid_cents from the cumulative requirement and clamps to the remaining outstanding principal. Identical inputs plus one voluntary prepayment make it strictly smaller than the projected figure for the same obligation row."
    divergence_example: |
      advance_amount_cents = 3000000; tiers 1000 / 2500 / 5000 bps at 90 / 180 / 270 days.
      cumulative = [300000, 750000, 1500000]
      FORWARD_PROJECTED = [300000, 450000, 750000]  (total 1500000)
      Dealer pays the day-90 obligation (300000) on time, then prepays 200000 on
      day 100. At day 180 principal_paid_cents = 500000, outstanding = 2500000:
      ASSESSED_ACTUAL(1) = max(0, min(750000 - 500000, 2500000)) = 250000,
      while the same row's projected_principal_cents still reads 450000.

  - name: curtailment_run_dealer_total
    trigger: "POST /floorplan/curtailment-runs"
    algorithm: aggregation
    formula: |
      # Processing order is fully pinned:
      #   dealers      : Dealer.created_at ASC
      #   units        : InventoryUnit.floored_at ASC, then InventoryUnit.created_at ASC
      #   obligations  : CurtailmentObligation.due_date ASC, then created_at ASC
      #
      # ROUNDING ORDER IS PINNED: round each unit's per-obligation requirement
      # first (inside curtailment_requirement), THEN sum the already-rounded
      # integers. Summing the unrounded products and rounding once at the end is
      # WRONG and observably differs.
      total_required_paydown_cents =
          SUM over obligations that transitioned SCHEDULED -> DUE in this run
              of obligation.required_principal_cents
      obligations_marked_due_count       = COUNT of those obligations
      obligations_marked_delinquent_count = COUNT of obligations that
              transitioned DUE -> DELINQUENT in this run
      units_flagged_delinquent_count      = COUNT of units that transitioned
              FLOORED -> DELINQUENT_CURTAILMENT in this run
      exceptions_expired_count            = COUNT of AgingExceptionRequest rows
              that transitioned PENDING -> EXPIRED in this run
    input_set: "Dealers with status IN {ACTIVE, SUSPENDED} (a DEFAULTED or TERMINATED dealer is skipped entirely), restricted to a single dealer_id when the request supplies one. Within a dealer, only units with funding_status IN {FLOORED, DELINQUENT_CURTAILMENT}. Obligations with status IN {PAID, SUPERSEDED, CANCELLED} are never touched."
    constants: {}
    precision: "Integer cents. Per-unit round_half_up first, then integer summation - never sum-then-round."
    rounding_trap_example: |
      Three NEW units each with advance_amount_cents = 3333333 crossing the
      1000 bps tier in the same run:
        per-unit  round_half_up(3333333 * 1000 / 10000) = 333333, sum = 999999
        sum-first round_half_up(9999999 * 1000 / 10000) = 1000000
      The scaffold pins 999999.

  - name: delinquency_assessment
    trigger: "CurtailmentObligation DUE -> DELINQUENT during POST /floorplan/curtailment-runs"
    algorithm: threshold
    formula: |
      # EVALUATION ORDER IS PINNED to break the apparent circularity.
      # total_amount_due_cents depends on late_fee_cents, and the late fee is a
      # percentage of "the amount owed" - but the fee base is the PRE-FEE
      # principal requirement, never the fee-inclusive total. Evaluate strictly
      # in this order:
      #   1. required_principal_cents        (already written at the DUE step)
      #   2. late_fee_cents                  (function of step 1 only)
      #   3. total_amount_due_cents          (sum of steps 1 and 2)
      raw_fee_cents  = required_principal_cents * LATE_FEE_BPS / 10000
      late_fee_cents = min(LATE_FEE_CAP_CENTS, round_half_up(raw_fee_cents))
      total_amount_due_cents = required_principal_cents + late_fee_cents
      # A fixed-point reading (fee charged on the fee-inclusive total, i.e.
      # total = principal / (1 - LATE_FEE_BPS/10000)) is explicitly WRONG:
      # for required_principal_cents = 300000 it yields 306122, not 306000.
    input_set: "One CurtailmentObligation in DUE whose unit is FLOORED or DELINQUENT_CURTAILMENT, past due_date + CreditLine.curtailment_grace_days, with principal_paid_cents < required_principal_cents."
    constants:
      LATE_FEE_BPS: 200
      LATE_FEE_CAP_CENTS: 50000
    precision: "Integer cents; round_half_up applied to the raw fee BEFORE the cap comparison."
    boundary_notes:
      - "required_principal_cents = 300000 -> fee 6000, total 306000."
      - "required_principal_cents = 3000000 -> uncapped fee would be 60000, so the cap binds at 50000 and total is 3050000."
      - "The grace comparison is strict: as_of_date == due_date + grace_days keeps the obligation DUE; only as_of_date > due_date + grace_days makes it DELINQUENT."

  - name: observation_classification
    trigger: "POST /floorplan/audits/{id}/observations (frozen at UnitAuditObservation creation because the entity is immutable)"
    algorithm: constraint_propagation
    formula: |
      snapshot = unit.outstanding_principal_cents          # frozen on the row
      if observed_condition == PRESENT and title_verified == true:
          classification = VERIFIED;            is_out_of_trust = false
      elif observed_condition == PRESENT and title_verified == false:
          classification = TITLE_EXCEPTION;     is_out_of_trust = false
      elif observed_condition == PRESENT_DAMAGED:
          classification = DAMAGE_EXCEPTION;    is_out_of_trust = false
      elif observed_condition == WHOLESALED:
          classification = WHOLESALE_EXCEPTION
          is_out_of_trust = (snapshot > 0)
      elif observed_condition == SOLD_NO_PAYOFF:
          classification = SOLD_OUT_OF_TRUST;   is_out_of_trust = true
      elif observed_condition == MISSING:
          classification = SOLD_OUT_OF_TRUST;   is_out_of_trust = true
      # Note the asymmetry: WHOLESALED keeps its own classification even when it
      # IS out of trust, so classification alone cannot be used to decide
      # incident creation - reconcile keys on is_out_of_trust.
    input_set: "One InventoryUnit in the audit's scope (dealer matches, funding_status IN {FLOORED, DELINQUENT_CURTAILMENT}) with no prior observation on this audit."
    constants: {}
    precision: "Exact enum mapping; no arithmetic beyond the snapshot > 0 test."
    boundary_notes:
      - "A WHOLESALED unit whose outstanding_principal_cents is exactly 0 is a WHOLESALE_EXCEPTION with is_out_of_trust = false, so reconcile creates no incident for it while still making it ineligible."

  - name: audit_sot_exposure
    trigger: "FloorPlanAudit IN_PROGRESS -> RECONCILED_CLEAN or RECONCILED_EXCEPTIONS (POST /floorplan/audits/{id}/reconcile)"
    algorithm: aggregation
    formula: |
      sot_exposure_cents = SUM over UnitAuditObservation rows where
          audit_id == audit.id AND is_out_of_trust == true,
          taken in UnitAuditObservation.created_at ASC order,
          of that observation's InventoryUnit.outstanding_principal_cents
          READ AT RECONCILE TIME (not the snapshot stored on the observation)
    input_set: "Only observations of THIS audit with is_out_of_trust == true. Observations of other audits on the same units are excluded. An audit with zero such observations produces exactly 0."
    constants: {}
    precision: "Integer cents; a pure integer sum with no rounding."
    aggregate_selection:
      source_filter: "UnitAuditObservation.audit_id == audit.id AND is_out_of_trust == true"
      window: "No time window; every matching observation of this audit participates regardless of when it was recorded"
      tie_break: "created_at ASC determines incident creation order, which determines OutOfTrustIncident.created_at ordering downstream"
    boundary_notes:
      - "Reading live outstanding_principal_cents rather than the observation snapshot matters when the dealer remitted between the observation and the reconcile: the incident exposure is the smaller, current figure."

  - name: remittance_waterfall_allocation
    trigger: "POST /floorplan/remittances"
    algorithm: waterfall_allocation
    formula: |
      remaining = amount_cents
      breakdown = []

      # Bucket order depends on intent. Within every bucket, fees are consumed
      # before principal on a given obligation.
      if intent == SOT_CURE:
          # single target: the unit's OPEN incident, oldest first by created_at ASC
          for incident in OPEN incidents of target_unit_id ordered by created_at ASC:
              take = min(remaining, incident.exposure_cents)
              applied_sot_cure_cents += take; remaining -= take
              breakdown.append({bucket: "SOT_CURE", target_id: incident.id,
                                principal_cents: take, fee_cents: 0})
      elif intent == UNIT_PAYOFF:
          payoff_due = target_unit.outstanding_principal_cents
                       + SUM(late_fee_cents - fee_paid_cents over that unit's
                             DUE and DELINQUENT obligations)
          if remaining < payoff_due: reject ERR_REMITTANCE_BELOW_PAYOFF
          # fees first, in due_date ASC then created_at ASC order, then all principal
          ... consume every unpaid fee, then the whole outstanding principal ...
      elif intent == PRINCIPAL_PREPAYMENT:
          take = min(remaining, target_unit.outstanding_principal_cents)
          applied_principal_cents += take; remaining -= take
          breakdown.append({bucket: "PRINCIPAL_PREPAYMENT",
                            target_id: target_unit.id,
                            principal_cents: take, fee_cents: 0})
      elif intent == CURTAILMENT:
          # candidate set: obligations of this dealer with status IN
          # {DELINQUENT, DUE}, narrowed to target_obligation_id when supplied
          # and to target_unit_id when supplied.
          # Bucket 1: every DELINQUENT obligation, ordered due_date ASC then created_at ASC
          # Bucket 2: every DUE obligation,        ordered due_date ASC then created_at ASC
          for ob in bucket1 + bucket2:
              fee_gap = ob.late_fee_cents - ob.fee_paid_cents
              take_fee = min(remaining, fee_gap)
              ob.fee_paid_cents += take_fee; applied_fee_cents += take_fee
              remaining -= take_fee
              prin_gap = ob.required_principal_cents - ob.principal_paid_cents
              take_prin = min(remaining, prin_gap)
              ob.principal_paid_cents += take_prin
              applied_principal_cents += take_prin; remaining -= take_prin
              unit.principal_paid_cents += take_prin
              unit.outstanding_principal_cents -= take_prin
              breakdown.append({bucket: "CURTAILMENT", target_id: ob.id,
                                principal_cents: take_prin, fee_cents: take_fee})
              if ob.fee_paid_cents == ob.late_fee_cents
                 and ob.principal_paid_cents == ob.required_principal_cents:
                  ob.status -> PAID
              if remaining == 0: break
          if bucket1 and bucket2 are both empty: reject ERR_NO_ALLOCATABLE_OBLIGATION

      unapplied_cents = remaining
      status = APPLIED if unapplied_cents == 0 else PARTIALLY_APPLIED
    input_set: "Obligations of the remitting dealer with status IN {DUE, DELINQUENT} for CURTAILMENT; the single target unit for PRINCIPAL_PREPAYMENT and UNIT_PAYOFF; OPEN incidents of the target unit for SOT_CURE. SCHEDULED, PAID, SUPERSEDED and CANCELLED obligations never receive money."
    constants: {}
    precision: "Integer cents throughout; no division, therefore no rounding. Every cent is either allocated or lands in unapplied_cents."
    money_conservation: "amount_cents == applied_principal_cents + applied_fee_cents + applied_sot_cure_cents + unapplied_cents, always."

  - name: covenant_dscr
    trigger: "POST /floorplan/dealers/{id}/covenant-tests"
    algorithm: weighted_scoring
    formula: |
      denominator = reported_interest_expense_cents + reported_curtailment_paid_cents
      if denominator == 0:
          dscr_lender_standard = 9999.9999
          dscr_dealer_adjusted = 9999.9999
      else:
          dscr_lender_standard = round_half_up(
              reported_ebitda_cents / denominator, 4)
          dscr_dealer_adjusted = round_half_up(
              (reported_ebitda_cents + reported_interest_expense_cents)
              / denominator, 4)

      required_tangible_net_worth_cents = round_half_up(
          CreditLine.credit_limit_cents * COVENANT_TNW_BPS_OF_LIMIT / 10000)

      failure_reason_codes = []            # fixed emission order
      if reported_tangible_net_worth_cents < required_tangible_net_worth_cents:
          failure_reason_codes.append("CAPITAL")
      if dscr_lender_standard < COVENANT_MIN_DSCR_LENDER_STANDARD:
          failure_reason_codes.append("CASH_FLOW")
      if trailing_sot_incident_count > COVENANT_MAX_TRAILING_SOT_INCIDENTS:
          failure_reason_codes.append("OUT_OF_TRUST")
      result = PASS if failure_reason_codes == [] else FAIL
    input_set: "One CovenantTest submission plus the dealer's single CreditLine with status IN {PENDING, ACTIVE, SUSPENDED} (a TERMINATED line is ignored), plus every OutOfTrustIncident of the dealer inside the trailing window described on CovenantTest.trailing_sot_incident_count."
    constants:
      COVENANT_TNW_BPS_OF_LIMIT: 1000
      COVENANT_MIN_DSCR_LENDER_STANDARD: "1.2500"
      REINSTATEMENT_MIN_DSCR_DEALER_ADJUSTED: "1.4000"
      COVENANT_MAX_TRAILING_SOT_INCIDENTS: 1
    precision: "Both ratios are quantized to exactly 4 decimal places with round_half_up. The comparison against the covenant minimum uses the ROUNDED value."
    variants:
      - name: LENDER_STANDARD
        when: "Always computed, and it is the ONLY variant that decides CovenantTest.result and therefore Dealer.covenant_breach_count."
        difference: "EBITDA over (interest + curtailment paid); floor plan interest is a real cash cost that is not added back."
      - name: DEALER_ADJUSTED
        when: "Always computed, and it is the ONLY variant consulted by POST /floorplan/credit-lines/{id}/reinstate."
        difference: "Adds reported_interest_expense_cents back into the numerator (an EBITDAF reading), so it is strictly greater than LENDER_STANDARD whenever interest expense is non-zero."
    divergence_example: |
      ebitda 1000000, interest 400000, curtailment_paid 560000:
        LENDER_STANDARD = 1.0417 -> below 1.2500 -> result FAIL (CASH_FLOW)
        DEALER_ADJUSTED = 1.4583 -> at or above 1.4000 -> reinstatement permitted
      The same filing therefore simultaneously breaches the covenant and
      satisfies the reinstatement test - the two variants must not be conflated.
      With ebitda 1200000 and the same denominator: LENDER_STANDARD is exactly
      1.2500 (PASS at the boundary) and DEALER_ADJUSTED is 1.6667.

  - name: dealer_risk_rating
    trigger: "Any mutation that changes Dealer.open_sot_incident_count, Dealer.delinquent_unit_count or Dealer.last_covenant_result: audit reconcile, curtailment run, remittance allocation, covenant test filing, remedy execution."
    algorithm: weighted_scoring
    formula: |
      risk_score = 100
                   - RISK_POINTS_PER_OPEN_SOT_INCIDENT * open_sot_incident_count
                   - RISK_POINTS_PER_DELINQUENT_UNIT   * delinquent_unit_count
                   - (RISK_POINTS_COVENANT_FAIL if last_covenant_result == FAIL else 0)
      risk_score = max(0, min(100, risk_score))
      risk_rating = "A" if risk_score >= 90
               else "B" if risk_score >= 75
               else "C" if risk_score >= 55
               else "D"
      audit_frequency_days = AUDIT_FREQUENCY_DAYS_BY_RATING[risk_rating]
      # next_audit_due_at is rewritten from the SAME anchor it already used:
      #   most recent RECONCILED_* audit's reconciled_at, else CreditLine.activated_at
      next_audit_due_at = anchor + audit_frequency_days days
    input_set: "The dealer's own denormalized counters only. It never re-walks incidents or units, so the counters are the single source of truth and must be maintained by every cascade."
    constants:
      RISK_POINTS_PER_OPEN_SOT_INCIDENT: 15
      RISK_POINTS_PER_DELINQUENT_UNIT: 10
      RISK_POINTS_COVENANT_FAIL: 20
      AUDIT_FREQUENCY_DAYS_BY_RATING: { A: 180, B: 90, C: 45, D: 21 }
    precision: "Integer score; rating bands use >= so a score of exactly 90 is an A and exactly 75 is a B."
    boundary_notes:
      - "One delinquent unit alone gives 90 -> still rating A (>= 90) and audit_frequency_days 180."
      - "Two delinquent units give 80 -> rating B and audit_frequency_days 90."
      - "Two open out-of-trust incidents give 70 -> rating C and audit_frequency_days 45."

  - name: credit_line_availability
    trigger: "Every mutation of CreditLine.outstanding_principal_cents or charged_off_principal_cents: funding, funding reversal, remittance allocation, repossession charge-off, line termination."
    algorithm: aggregation
    formula: |
      outstanding_principal_cents = SUM(InventoryUnit.outstanding_principal_cents
          WHERE credit_line_id == line.id
            AND funding_status IN {FLOORED, DELINQUENT_CURTAILMENT, SOT_OPEN})
      eligible_collateral_cents   = SUM(InventoryUnit.outstanding_principal_cents
          WHERE credit_line_id == line.id
            AND eligibility_status == ELIGIBLE
            AND funding_status IN {FLOORED, DELINQUENT_CURTAILMENT})
      available_credit_cents = credit_limit_cents
                               - outstanding_principal_cents
                               - charged_off_principal_cents
      borrowing_base_deficiency_cents = max(0, outstanding_principal_cents
                                               - eligible_collateral_cents)
      class_outstanding_cents_used = same SUM restricted to inventory_class == USED
      class_outstanding_cents_demonstrator = same SUM restricted to DEMONSTRATOR
    input_set: "Units of this line only. REGISTERED, PENDING_FUNDING, PAID_OFF and REPOSSESSED units contribute nothing. SOT_OPEN units still count toward outstanding principal (the debt is real) but never toward eligible collateral (the collateral is gone)."
    constants: {}
    precision: "Integer cents; pure summation."
    capacity_identity: "credit_limit_cents == available_credit_cents + outstanding_principal_cents + charged_off_principal_cents holds after every single mutation, including every cascaded one."

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
# Priority bands
#   10      authentication
#   20      authorization (role)
#   30      dealer-scope ownership (entity_backed identity)
#   40-49   existence, evaluated strictly left-to-right along the path, then
#           left-to-right through the body in the declared input order
#   50      request schema / enum / range
#   55      optimistic concurrency (§1.2.1)
#   60-69   state preconditions on the target and on its parents
#   70      segregation of duties / compliance
#   80-89   title, MSO and collateral-eligibility control
#   90-99   uniqueness, interval and temporal constraints
#   100-109 cross-entity referential consistency
#   110     fiscal capacity (always last, so a capacity error never masks a
#           compliance or state error)
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 20
    category: auth
    check: "The acting X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 30
    category: auth
    check: "When X-User-Role is DealerPrincipal, X-User-ID must equal the dealer_id of the resource being read or written (directly for Dealer, or transitively through unit.dealer_id / obligation.dealer_id / audit.dealer_id). A DealerPrincipal may never act on another dealer's resources, even for GETs."
    error_id: ERR_DEALER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints whose roles include DealerPrincipal"

  - priority: 40
    category: existence
    check: "The Dealer named by the {id} path segment or by the dealer_id body field exists"
    error_id: ERR_DEALER_NOT_FOUND
    http_status: 404
    applies_to: "GET /floorplan/dealers/{id}, POST /floorplan/dealers/{id}/covenant-tests, GET /floorplan/dealers/{id}/covenant-tests, POST /floorplan/dealers/{id}/remedy-actions, GET /floorplan/dealers/{id}/remedy-actions, POST /floorplan/credit-lines, POST /floorplan/units, POST /floorplan/audits, POST /floorplan/remittances, POST /floorplan/curtailment-runs"

  - priority: 41
    category: existence
    check: "The CreditLine named by the {id} path segment or by the credit_line_id body field exists"
    error_id: ERR_CREDIT_LINE_NOT_FOUND
    http_status: 404
    applies_to: "GET /floorplan/credit-lines/{id}, POST /floorplan/credit-lines/{id}/activate, POST /floorplan/credit-lines/{id}/reinstate, POST /floorplan/credit-lines/{id}/curtailment-tiers, GET /floorplan/credit-lines/{id}/curtailment-tiers, POST /floorplan/units"

  - priority: 42
    category: existence
    check: "The InventoryUnit named by the {id} path segment or by the unit_id body field exists"
    error_id: ERR_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "GET /floorplan/units/{id}, GET /floorplan/units/{id}/curtailment-schedule, GET /floorplan/units/{id}/audit-observations, POST /floorplan/units/{id}/title-custody, POST /floorplan/units/{id}/ineligibility, POST /floorplan/units/{id}/funding-advances, POST /floorplan/audits/{id}/observations, POST /floorplan/remittances"

  - priority: 43
    category: existence
    check: "The FundingAdvance named by the {id} path segment exists"
    error_id: ERR_ADVANCE_NOT_FOUND
    http_status: 404
    applies_to: "GET /floorplan/funding-advances/{id}, POST /floorplan/funding-advances/{id}/fund, POST /floorplan/funding-advances/{id}/reject, POST /floorplan/funding-advances/{id}/reverse"

  - priority: 44
    category: existence
    check: "The CurtailmentObligation named by the {id} path segment or by target_obligation_id exists"
    error_id: ERR_OBLIGATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /floorplan/curtailment-obligations/{id}, POST /floorplan/curtailment-obligations/{id}/aging-exceptions, GET /floorplan/curtailment-obligations/{id}/aging-exceptions, POST /floorplan/remittances"

  - priority: 45
    category: existence
    check: "The AgingExceptionRequest named by the {id} path segment exists"
    error_id: ERR_EXCEPTION_NOT_FOUND
    http_status: 404
    applies_to: "POST /floorplan/aging-exceptions/{id}/decision"

  - priority: 46
    category: existence
    check: "The FloorPlanAudit named by the {id} path segment exists"
    error_id: ERR_AUDIT_NOT_FOUND
    http_status: 404
    applies_to: "GET /floorplan/audits/{id}, POST /floorplan/audits/{id}/start, POST /floorplan/audits/{id}/observations, GET /floorplan/audits/{id}/observations, POST /floorplan/audits/{id}/reconcile, POST /floorplan/audits/{id}/abort"

  - priority: 47
    category: existence
    check: "The OutOfTrustIncident named by the {id} path segment exists"
    error_id: ERR_INCIDENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /floorplan/out-of-trust-incidents/{id}"

  - priority: 48
    category: existence
    check: "The RemedyAction named by the {id} path segment exists"
    error_id: ERR_REMEDY_NOT_FOUND
    http_status: 404
    applies_to: "POST /floorplan/remedy-actions/{id}/execute"

  - priority: 49
    category: existence
    check: "The PaymentRemittance named by the {id} path segment exists"
    error_id: ERR_REMITTANCE_NOT_FOUND
    http_status: 404
    applies_to: "GET /floorplan/remittances/{id}"

  - priority: 50
    category: business_constraint
    check: "Every required input field is present; every enum field holds a declared member; every *_cents and *_bps field is a non-negative integer; every *_bps rate field is <= 10000; requested_amount_cents > 0; amount_cents > 0; odometer_miles >= 0; every *_date field is a valid ISO-8601 date; limit is 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 55
    category: state
    check: "expected_credit_line_version equals the current CreditLine.version (see §1.2.1 advance-fund-stale-credit-line)"
    error_id: ERR_STALE_CREDIT_LINE_VERSION
    http_status: 412
    applies_to: "POST /floorplan/funding-advances/{id}/fund, POST /floorplan/funding-advances/{id}/reverse"

  - priority: 55
    category: state
    check: "expected_dealer_version equals the current Dealer.version (see §1.2.1 remittance-apply-stale-dealer)"
    error_id: ERR_STALE_DEALER_VERSION
    http_status: 412
    applies_to: "POST /floorplan/remittances"

  - priority: 60
    category: state
    check: "The FundingAdvance is in REQUESTED"
    error_id: ERR_ADVANCE_NOT_PENDING
    http_status: 409
    applies_to: "POST /floorplan/funding-advances/{id}/fund, POST /floorplan/funding-advances/{id}/reject"

  - priority: 60
    category: state
    check: "The FundingAdvance is in FUNDED"
    error_id: ERR_ADVANCE_NOT_PENDING
    http_status: 409
    applies_to: "POST /floorplan/funding-advances/{id}/reverse"

  - priority: 61
    category: state
    check: "The governing CreditLine is in ACTIVE. Evaluated BEFORE any capacity arithmetic, so a suspended line over its limit reports the state error, never the fiscal one."
    error_id: ERR_CREDIT_LINE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /floorplan/units, POST /floorplan/units/{id}/funding-advances, POST /floorplan/funding-advances/{id}/fund, POST /floorplan/credit-lines/{id}/curtailment-tiers"

  - priority: 61
    category: state
    check: "The CreditLine is in PENDING (activation) or SUSPENDED (reinstatement)"
    error_id: ERR_CREDIT_LINE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /floorplan/credit-lines/{id}/activate, POST /floorplan/credit-lines/{id}/reinstate"

  - priority: 62
    category: state
    check: "The Dealer is in ACTIVE. A PROSPECT dealer cannot floor units, a DEFAULTED or TERMINATED dealer cannot request funding, file exceptions or remit."
    error_id: ERR_DEALER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /floorplan/units, POST /floorplan/units/{id}/funding-advances, POST /floorplan/curtailment-obligations/{id}/aging-exceptions, POST /floorplan/remittances"

  - priority: 63
    category: state
    check: "The InventoryUnit is in REGISTERED (advance request) or PENDING_FUNDING (funding) or FLOORED/DELINQUENT_CURTAILMENT (observation, ineligibility flag, and the target of a CURTAILMENT, PRINCIPAL_PREPAYMENT or UNIT_PAYOFF remittance) or SOT_OPEN (the target of a SOT_CURE remittance, which is the only remittance intent that may name a unit already sold out of trust)"
    error_id: ERR_UNIT_NOT_FLOORED
    http_status: 409
    applies_to: "POST /floorplan/units/{id}/funding-advances, POST /floorplan/funding-advances/{id}/fund, POST /floorplan/audits/{id}/observations, POST /floorplan/units/{id}/ineligibility, POST /floorplan/remittances"

  - priority: 63
    category: state
    check: "new_custody_status must be a legal successor of the unit's current title_custody_status per §1.2 InventoryUnit.title_custody_status: NOT_RECEIVED -> LENDER_HELD only; LENDER_HELD -> LOST or RELEASED_FOR_SALE; LOST -> LENDER_HELD; RELEASED_FOR_SALE is terminal"
    error_id: ERR_INVALID_TITLE_TRANSITION
    http_status: 409
    applies_to: "POST /floorplan/units/{id}/title-custody"

  - priority: 64
    category: state
    check: "The FloorPlanAudit is in SCHEDULED (start) or IN_PROGRESS (observations, reconcile, abort)"
    error_id: ERR_AUDIT_NOT_IN_PROGRESS
    http_status: 409
    applies_to: "POST /floorplan/audits/{id}/start, POST /floorplan/audits/{id}/observations, POST /floorplan/audits/{id}/reconcile, POST /floorplan/audits/{id}/abort"

  - priority: 65
    category: business_temporal
    check: "The logical clock is inside [window_start_date, window_end_date] for an ANNOUNCED audit and inside [window_start_date, window_end_date] for an UNANNOUNCED audit; an audit can only be started inside its declared window"
    error_id: ERR_AUDIT_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /floorplan/audits/{id}/start"

  - priority: 66
    category: state
    check: "The AgingExceptionRequest is in PENDING"
    error_id: ERR_EXCEPTION_NOT_PENDING
    http_status: 409
    applies_to: "POST /floorplan/aging-exceptions/{id}/decision"

  - priority: 67
    category: state
    check: "The CurtailmentObligation is in SCHEDULED or DUE (relief must be sought before the obligation goes delinquent; DELINQUENT, PAID, SUPERSEDED and CANCELLED are all rejected, and a PENDING request expires the moment its obligation turns DELINQUENT)"
    error_id: ERR_OBLIGATION_NOT_OPEN
    http_status: 409
    applies_to: "POST /floorplan/curtailment-obligations/{id}/aging-exceptions"

  - priority: 68
    category: state
    check: "The RemedyAction is in ISSUED"
    error_id: ERR_REMEDY_NOT_ISSUED
    http_status: 409
    applies_to: "POST /floorplan/remedy-actions/{id}/execute"

  - priority: 69
    category: state
    check: "The audit has at least one UnitAuditObservation whenever at least one unit was in scope at start time (units_in_scope_count > 0 and units_observed_count == 0 is a refusal to reconcile, not a clean audit)"
    error_id: ERR_AUDIT_NO_OBSERVATIONS
    http_status: 409
    applies_to: "POST /floorplan/audits/{id}/reconcile"

  - priority: 70
    category: business_safety
    check: "Segregation of duties on aging exceptions: the X-User-ID deciding the exception must differ from the unit's funded_by_user_id (the credit officer who disbursed the advance). Evaluated BEFORE the open-out-of-trust referential check, so a self-approval on an out-of-trust unit reports the SoD error."
    error_id: ERR_SOD_EXCEPTION_APPROVER
    http_status: 403
    applies_to: "POST /floorplan/aging-exceptions/{id}/decision"

  - priority: 70
    category: business_safety
    check: "Segregation of duties on audits: the X-User-ID reconciling the audit must not appear in the audit's observer_user_ids (the field auditor who counted the units cannot sign off on the reconciliation)"
    error_id: ERR_SOD_AUDIT_RECONCILER
    http_status: 403
    applies_to: "POST /floorplan/audits/{id}/reconcile"

  - priority: 70
    category: business_safety
    check: "Segregation of duties on remedies: the X-User-ID executing a RemedyAction must differ from its issued_by_user_id"
    error_id: ERR_SOD_REMEDY_EXECUTOR
    http_status: 403
    applies_to: "POST /floorplan/remedy-actions/{id}/execute"

  - priority: 71
    category: business_safety
    check: "A RemedyAction is only justified when the dealer's record supports it: LINE_SUSPENSION requires Dealer.open_sot_incident_count > 0 or Dealer.covenant_breach_count > 0; INVENTORY_REPOSSESSION requires at least one unit of the dealer in SOT_OPEN; DEMAND_LETTER requires Dealer.risk_rating in {C, D}; TERMINATION requires Dealer.status == DEFAULTED"
    error_id: ERR_REMEDY_NOT_JUSTIFIED
    http_status: 422
    applies_to: "POST /floorplan/dealers/{id}/remedy-actions"

  - priority: 72
    category: business_safety
    check: "Reinstating a SUSPENDED CreditLine requires the dealer to have zero OPEN OutOfTrustIncident rows AND a most-recent CovenantTest whose dscr_dealer_adjusted >= REINSTATEMENT_MIN_DSCR_DEALER_ADJUSTED (1.4000). Note this consults the DEALER_ADJUSTED variant, so a line whose covenant test FAILED on LENDER_STANDARD can still be reinstated."
    error_id: ERR_REINSTATEMENT_CRITERIA_NOT_MET
    http_status: 422
    applies_to: "POST /floorplan/credit-lines/{id}/reinstate"

  - priority: 80
    category: business_safety
    check: "A NEW unit must present a manufacturer statement of origin: title_document_type == MSO is mandatory when inventory_class == NEW, and forbidden when inventory_class is USED (which requires TITLE). DEMONSTRATOR accepts either."
    error_id: ERR_MSO_REQUIRED_FOR_NEW_UNIT
    http_status: 422
    applies_to: "POST /floorplan/units"

  - priority: 81
    category: business_safety
    check: "A unit cannot be funded unless title_custody_status == LENDER_HELD. NOT_RECEIVED, LOST and RELEASED_FOR_SALE all block disbursement."
    error_id: ERR_TITLE_NOT_LENDER_HELD
    http_status: 422
    applies_to: "POST /floorplan/funding-advances/{id}/fund"

  - priority: 82
    category: business_safety
    check: "Title may only move LENDER_HELD -> RELEASED_FOR_SALE when the unit has no unpaid obligation and no OPEN OutOfTrustIncident: funding_status must be PAID_OFF, or outstanding_principal_cents == 0 with zero DUE/DELINQUENT obligations"
    error_id: ERR_TITLE_RELEASE_BLOCKED
    http_status: 422
    applies_to: "POST /floorplan/units/{id}/title-custody"

  - priority: 83
    category: business_safety
    check: "A unit whose eligibility_status is INELIGIBLE cannot be funded or receive a new advance request"
    error_id: ERR_UNIT_INELIGIBLE
    http_status: 422
    applies_to: "POST /floorplan/units/{id}/funding-advances, POST /floorplan/funding-advances/{id}/fund"

  - priority: 84
    category: business_temporal
    check: "invoice_date must not be more than MAX_FLOOR_AGE_DAYS (90) days before the logical clock at funding time; an invoice exactly 90 days old still funds, 91 days does not"
    error_id: ERR_INVOICE_TOO_OLD_TO_FLOOR
    http_status: 422
    applies_to: "POST /floorplan/funding-advances/{id}/fund"

  - priority: 90
    category: business_constraint
    check: "vin is unique across all InventoryUnit rows of the same dealer_id whose funding_status is not REPOSSESSED"
    error_id: ERR_DUPLICATE_VIN
    http_status: 409
    applies_to: "POST /floorplan/units"

  - priority: 91
    category: business_constraint
    check: "At most one UnitAuditObservation per (audit_id, unit_id) pair; observations are immutable so a correction is impossible by design"
    error_id: ERR_DUPLICATE_OBSERVATION
    http_status: 409
    applies_to: "POST /floorplan/audits/{id}/observations"

  - priority: 92
    category: business_temporal
    check: "A new FloorPlanAudit's CLOSED interval [window_start_date, window_end_date] must not intersect the closed interval of any existing audit of the same dealer whose status is in {SCHEDULED, IN_PROGRESS, RECONCILED_CLEAN, RECONCILED_EXCEPTIONS}. Touching endpoints DO collide: an audit ending 2026-08-10 blocks another starting 2026-08-10. ABORTED audits free their window."
    error_id: ERR_AUDIT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /floorplan/audits"

  - priority: 93
    category: business_constraint
    check: "A new CurtailmentTier's HALF-OPEN interval [age_days_from, age_days_to) must not intersect any existing tier of the same (credit_line_id, inventory_class). Touching endpoints do NOT collide: a tier [90, 180) permits a tier [180, 270). age_days_to == null means unbounded and may only be used once per (line, class)."
    error_id: ERR_TIER_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /floorplan/credit-lines/{id}/curtailment-tiers"

  - priority: 94
    category: business_constraint
    check: "age_days_from >= 0, and age_days_to is either null or strictly greater than age_days_from; cumulative_paydown_bps must be strictly greater than the cumulative_paydown_bps of every tier of the same (line, class) with a smaller age_days_from (the ladder must be monotonically increasing)"
    error_id: ERR_TIER_INTERVAL_INVALID
    http_status: 422
    applies_to: "POST /floorplan/credit-lines/{id}/curtailment-tiers"

  - priority: 95
    category: business_temporal
    check: "An ANNOUNCED audit must be scheduled at least AUDIT_NOTICE_DAYS (7) days ahead: window_start_date - logical_clock_date >= 7 days. Exactly 7 days is acceptable."
    error_id: ERR_AUDIT_NOTICE_TOO_SHORT
    http_status: 422
    applies_to: "POST /floorplan/audits"

  - priority: 96
    category: business_temporal
    check: "An UNANNOUNCED audit needs no notice period but must respect MIN_UNANNOUNCED_GAP_DAYS (14): window_start_date must be at least 14 days after the window_end_date of the dealer's most recent RECONCILED_CLEAN or RECONCILED_EXCEPTIONS audit. Exactly 14 days is acceptable."
    error_id: ERR_AUDIT_GAP_TOO_SHORT
    http_status: 422
    applies_to: "POST /floorplan/audits"

  - priority: 97
    category: business_temporal
    check: "An UNANNOUNCED audit window must be at most 3 days long (window_end_date - window_start_date <= 2 days) and window_end_date >= window_start_date for every audit type"
    error_id: ERR_UNANNOUNCED_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /floorplan/audits"

  - priority: 98
    category: business_constraint
    check: "requested_extension_days must be >= 1 and <= MAX_EXTENSION_DAYS_PER_REQUEST (45) at request time; at decision time decided_extension_days must be >= 1, <= requested_extension_days, and unit.curtailment_extension_days_total + decided_extension_days must not exceed MAX_EXTENSION_DAYS_PER_UNIT (60)"
    error_id: ERR_EXTENSION_EXCEEDS_MAX
    http_status: 422
    applies_to: "POST /floorplan/curtailment-obligations/{id}/aging-exceptions, POST /floorplan/aging-exceptions/{id}/decision"

  - priority: 99
    category: business_constraint
    check: "unit.aging_exception_count (the count of APPROVED exceptions on the unit) must be < MAX_APPROVED_EXCEPTIONS_PER_UNIT (2) before an APPROVED decision; the third approval on the same unit is refused"
    error_id: ERR_EXCEPTION_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /floorplan/aging-exceptions/{id}/decision"

  - priority: 100
    category: business_referential
    check: "The unit must have zero OutOfTrustIncident rows in OPEN before an aging exception may be APPROVED (a unit already sold out of trust does not get more time). Lower priority than the SoD check at 70."
    error_id: ERR_UNIT_HAS_OPEN_SOT
    http_status: 409
    applies_to: "POST /floorplan/aging-exceptions/{id}/decision"

  - priority: 101
    category: business_referential
    check: "The unit named in an observation must belong to the audit's dealer_id and must have been in scope when the audit started"
    error_id: ERR_UNIT_NOT_IN_AUDIT_SCOPE
    http_status: 422
    applies_to: "POST /floorplan/audits/{id}/observations"

  - priority: 102
    category: business_referential
    check: "Remittance intent and targets must agree: CURTAILMENT accepts an optional target_unit_id or target_obligation_id but not both; UNIT_PAYOFF, PRINCIPAL_PREPAYMENT and SOT_CURE all require target_unit_id and forbid target_obligation_id; every supplied target must belong to dealer_id"
    error_id: ERR_REMITTANCE_INTENT_TARGET_MISMATCH
    http_status: 422
    applies_to: "POST /floorplan/remittances"

  - priority: 103
    category: business_referential
    check: "A CURTAILMENT remittance requires at least one obligation of the dealer in DUE or DELINQUENT after the target filters are applied"
    error_id: ERR_NO_ALLOCATABLE_OBLIGATION
    http_status: 422
    applies_to: "POST /floorplan/remittances"

  - priority: 104
    category: business_fiscal
    check: "A UNIT_PAYOFF remittance must cover the unit's full outstanding principal plus every unpaid late fee on its DUE and DELINQUENT obligations"
    error_id: ERR_REMITTANCE_BELOW_PAYOFF
    http_status: 422
    applies_to: "POST /floorplan/remittances"

  - priority: 105
    category: business_referential
    check: "A unit cannot be funded unless its CreditLine has at least one CurtailmentTier with cumulative_paydown_bps > 0 for the unit's inventory_class; without a ladder there is no obligation schedule to create"
    error_id: ERR_NO_CURTAILMENT_SCHEDULE
    http_status: 422
    applies_to: "POST /floorplan/funding-advances/{id}/fund"

  - priority: 106
    category: business_temporal
    check: "A FUNDED advance may only be reversed within ADVANCE_REVERSAL_WINDOW_DAYS (5) days of funded_at, and only while the unit has received no payment (unit.principal_paid_cents == 0) and has no observation on any audit"
    error_id: ERR_ADVANCE_REVERSAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /floorplan/funding-advances/{id}/reverse"

  - priority: 110
    category: business_fiscal
    check: "The computed advance_cents must not exceed CreditLine.available_credit_cents. Evaluated dead last, after every state, compliance, title and referential check."
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /floorplan/funding-advances/{id}/fund"

  - priority: 111
    category: business_fiscal
    check: "For USED and DEMONSTRATOR units, class_outstanding_cents_<class> + advance_cents must not exceed class_sublimit_cents_<class>"
    error_id: ERR_CLASS_SUBLIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /floorplan/funding-advances/{id}/fund"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an arbitrary UTC instant so age, curtailment, notice-period and cure-deadline rules are deterministic. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Every 'now', 'today' and age computation in this scaffold reads the logical clock."
    roles: [SystemOperator]
    code: 200
    input: [to_iso8601]
