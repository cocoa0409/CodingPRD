  # ==============================================================
  # Section: calculations
  # ==============================================================
  - section: calculations
    instances:
      - name: calc_trial_conversion_fee_pinned_order
        claim_type: correct_result
        grounds: [calculations.trial_conversion_fee, state_machines.DeviceOrder.ACTIVE_to_CONVERTED]
        distinguishing_aspect: "Pinned evaluation order (mode c flavor): 10 days used on a 100000-cent model with 5000-cent warranty yields credit 20000, subtotal 80000, service fee 9600 (12% of subtotal, not of total), total 94600."
        test_recipe:
          setup:
            - "TRIAL order (trial_days 14, warranty 5000) on a 100000-cent CCTV allocated at default clock 2026-05-01; clock advanced to 2026-05-11 (10 days used)"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Fee Calc", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "CCTV" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "CCTV Pro 24", category: "CCTV", list_price_cents: 100000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-FC", condition: "NEW" }, as: ClinicAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "TRIAL", trial_days: 14, warranty_cents: 5000 }, as: VisionSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/device-orders/${o_id}/allocate", payload: { device_unit_id: "${u_id}" }, as: VisionSpecialist }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: ClinicAdmin }
          trigger:
            - { call: "POST /api/device-orders/${o_id}/convert", payload: {}, as: VisionSpecialist, captures: { total: $.data.conversion_total_cents, st: $.data.status } }
          assert:
            - "${st} == CONVERTED"
            - "${total} == 94600  # credit min(100000*0.02*10, 30000)=20000; subtotal 80000; fee round(80000*0.12)=9600; 80000+9600+5000"

      - name: calc_subscription_loyalty_tier_boundary
        claim_type: constants_applied
        grounds: [calculations.subscription_loyalty_fee]
        distinguishing_aspect: "Threshold precision: the 5% tier applies at total_paid_cents == 50000 exactly (>=). Second renewal charges 23750, not 25000."
        test_recipe:
          setup: ["ACTIVE subscription (monthly 25000) created at 2026-05-01; one renewal already paid (total_paid 50000)"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Tier Edge", date_of_birth: "1975-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/device-models", payload: { name: "ReadAloud SR", category: "SCREEN_READER", list_price_cents: 0, subscription_monthly_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/subscriptions", payload: { client_id: "${c_id}", device_model_id: "${m_id}", period_start: "2026-05-01T00:00:00Z" }, as: BillingSpecialist, captures: { sub_id: $.data.id, fee0: $.data.last_fee_cents } }
            - { call: "POST /api/subscriptions/${sub_id}/renew", payload: {}, as: BillingSpecialist, captures: { fee1: $.data.last_fee_cents } }
          trigger:
            - { call: "POST /api/subscriptions/${sub_id}/renew", payload: {}, as: BillingSpecialist, captures: { fee2: $.data.last_fee_cents, tot: $.data.total_paid_cents, pe: $.data.period_end } }
          assert:
            - "${fee0} == 25000 and ${fee1} == 25000  # tiers 0 (prior 0) and 0 (prior 25000 < 50000)"
            - "${fee2} == 23750  # prior 50000 >= 50000: round_half_up(25000*0.95)"
            - "${tot} == 73750 and ${pe} == 2026-07-30T00:00:00Z"

      - name: calc_subscription_cancel_credit_proration
        claim_type: correct_result
        grounds: [calculations.subscription_cancel_credit, state_machines.Subscription.ACTIVE_to_CANCELLED]
        distinguishing_aspect: "Proration: cancelling an ACTIVE subscription with 15 of 30 days remaining credits round_half_up(25000*15/30) = 12500."
        test_recipe:
          setup: ["ACTIVE subscription period [2026-05-01, 2026-05-31]; clock at 2026-05-16T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Pro Rate", date_of_birth: "1975-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/device-models", payload: { name: "ReadAloud SR", category: "SCREEN_READER", list_price_cents: 0, subscription_monthly_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/subscriptions", payload: { client_id: "${c_id}", device_model_id: "${m_id}", period_start: "2026-05-01T00:00:00Z" }, as: BillingSpecialist, captures: { sub_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-16T00:00:00Z" }, as: ClinicAdmin }
          trigger:
            - { call: "POST /api/subscriptions/${sub_id}/cancel", payload: {}, as: BillingSpecialist, captures: { st: $.data.status, credit: $.data.credit_cents } }
          assert:
            - "${st} == CANCELLED"
            - "${credit} == 12500  # 15 days remaining of 30"

      - name: calc_selector_trial_prefers_loaner_condition
        claim_type: correct_result
        grounds: [calculations.order_unit_selector]
        distinguishing_aspect: "Selector determinism: TRIAL auto-allocation ranks LOANER before REFURB before NEW (created_at ASC tie-break); PURCHASE excludes LOANER units entirely."
        test_recipe:
          setup: ["MAGNIFIER model with unit SN-N1 (NEW, created first) and unit SN-L1 (LOANER, created second); two FINALIZED-evaluation-backed orders: one TRIAL, one PURCHASE"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Sel Test", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-N1", condition: "NEW" }, as: ClinicAdmin, captures: { u_new: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-L1", condition: "LOANER" }, as: ClinicAdmin, captures: { u_loaner: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "TRIAL", trial_days: 14 }, as: VisionSpecialist, captures: { o_trial: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "PURCHASE" }, as: VisionSpecialist, captures: { o_pur: $.data.id } }
          trigger:
            - { call: "POST /api/device-orders/${o_trial}/allocate", payload: {}, as: VisionSpecialist, captures: { pick_trial: $.data.device_unit_id } }
            - { call: "POST /api/device-orders/${o_pur}/allocate", payload: {}, as: VisionSpecialist, captures: { pick_pur: $.data.device_unit_id } }
          assert:
            - "${pick_trial} == ${u_loaner}  # LOANER ranks first for TRIAL"
            - "${pick_pur} == ${u_new}  # LOANER excluded for PURCHASE"

      - name: calc_selector_empty_pool_returns_no_eligible_unit
        claim_type: violation_to_error
        grounds: [calculations.order_unit_selector, "errors[ERR_NO_ELIGIBLE_UNIT]"]
        distinguishing_aspect: "Empty-pool fallback: auto-allocation with zero eligible IN_STOCK units fails with ERR_NO_ELIGIBLE_UNIT and the order stays PLACED."
        test_recipe:
          setup: ["FINALIZED evaluation; MAGNIFIER model with no units; TRIAL order PLACED"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Empty Pool", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "TRIAL", trial_days: 14 }, as: VisionSpecialist, captures: { o_id: $.data.id } }
          trigger:
            - { call: "POST /api/device-orders/${o_id}/allocate", payload: {}, as: VisionSpecialist, captures: { err: $.data.error_id } }
            - { call: "GET /api/device-orders/${o_id}", as: VisionSpecialist, captures: { st: $.data.status } }
          assert:
            - "${err} == ERR_NO_ELIGIBLE_UNIT"
            - "${st} == PLACED  # no partial allocation"

      - name: calc_claim_provisional_dual_variant
        claim_type: variant_divergence
        grounds: [calculations.claim_provisional_total]
        excluded_because:
          difficulty_instance: dvc_claim_provisional_vs_final
          rationale: "Variant divergence and reconciliation asserted in the named §1.8 instance."
      - name: calc_payer_responsibility_variants
        claim_type: correct_result
        grounds: [calculations.payer_responsibility]
        excluded_because:
          difficulty_instance: cf_payer_responsibility_min_cap_branch
          rationale: "Nested min/branch behavior asserted in the named §1.8 instance."
      - name: calc_outcome_composite_variants
        claim_type: variant_divergence
        grounds: [calculations.outcome_composite]
        excluded_because:
          difficulty_instance: dvc_outcome_provisional_vs_final
          rationale: "Provisional-vs-final divergence asserted in the named §1.8 instance."

  # ==============================================================
  # Section: validations
  # ==============================================================
  - section: validations
    instances:
      - name: val_missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Missing/blank X-User-Role or X-User-ID yields ERR_UNAUTHENTICATED (401) before any role or existence check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/clients", payload: { full_name: "No Auth", date_of_birth: "1960-01-01" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_UNAUTHENTICATED"

      - name: val_schema_checked_before_existence
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]"]
        distinguishing_aspect: "A body missing source_type AND referencing a non-existent client fails with ERR_VALIDATION (priority 3), not ERR_NOT_FOUND (priority 4)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/referrals", payload: { client_id: "123e4567-e89b-42d3-a456-426614174000", referring_party: "self" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION  # schema (3) precedes existence (4)"

      - name: val_state_checked_before_segregation
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=7]"]
        distinguishing_aspect: "Adjudicating a DRAFT authorization as the very user who created it returns ERR_INVALID_STATE (priority 6 state), not ERR_SEGREGATION_OF_DUTIES (priority 7)."
        test_recipe:
          setup: ["DRAFT authorization created by fc-1 (never submitted)"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Prio Check", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/funding-authorizations", payload: { client_id: "${c_id}", payer_type: "VR", payer_ref: "VR-PC", authorized_amount_cents: 9000, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-12-31T23:59:59Z" }, as: FundingCoordinator, as_user_id: "fc-1", captures: { fa_id: $.data.id } }
          trigger:
            - { call: "POST /api/funding-authorizations/${fa_id}/adjudicate", payload: { decision: "APPROVE" }, as: PayerAdjudicator, as_user_id: "fc-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE  # DRAFT has no adjudicate transition; state precedes SoD"

      - name: val_segregation_funding_adjudicate_same_user_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The PayerAdjudicator whose X-User-ID equals submitted_by_user_id is rejected ERR_SEGREGATION_OF_DUTIES (403); a different adjudicator succeeds."
        test_recipe:
          setup: ["authorization SUBMITTED by fc-9"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Sod Fund", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/funding-authorizations", payload: { client_id: "${c_id}", payer_type: "VR", payer_ref: "VR-SOD", authorized_amount_cents: 9000, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-12-31T23:59:59Z" }, as: FundingCoordinator, as_user_id: "fc-9", captures: { fa_id: $.data.id } }
            - { call: "POST /api/funding-authorizations/${fa_id}/submit", payload: {}, as: FundingCoordinator, as_user_id: "fc-9" }
          trigger:
            - { call: "POST /api/funding-authorizations/${fa_id}/adjudicate", payload: { decision: "APPROVE" }, as: PayerAdjudicator, as_user_id: "fc-9", captures: { err: $.data.error_id } }
            - { call: "POST /api/funding-authorizations/${fa_id}/adjudicate", payload: { decision: "APPROVE" }, as: PayerAdjudicator, as_user_id: "pa-9", captures: { st: $.data.status } }
          assert:
            - "${err} == ERR_SEGREGATION_OF_DUTIES  # same person cannot submit and adjudicate"
            - "${st} == APPROVED  # distinct adjudicator passes"

      - name: val_segregation_claim_adjudicate_same_user_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The same segregation rule on the claims endpoint: claim submitted by zz-1 cannot be adjudicated by zz-1."
        test_recipe:
          setup: ["APPROVED INSURANCE authorization 50000; allocated order; claim SUBMITTED by billing user zz-1"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Sod Claim", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-SOD", condition: "NEW" }, as: ClinicAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "PURCHASE" }, as: VisionSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/device-orders/${o_id}/allocate", payload: { device_unit_id: "${u_id}" }, as: VisionSpecialist }
            - { call: "POST /api/funding-authorizations", payload: { client_id: "${c_id}", payer_type: "INSURANCE", payer_ref: "POL-SOD", authorized_amount_cents: 50000, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-12-31T23:59:59Z" }, as: FundingCoordinator, as_user_id: "fc-1", captures: { fa_id: $.data.id } }
            - { call: "POST /api/funding-authorizations/${fa_id}/submit", payload: {}, as: FundingCoordinator, as_user_id: "fc-1" }
            - { call: "POST /api/funding-authorizations/${fa_id}/adjudicate", payload: { decision: "APPROVE" }, as: PayerAdjudicator, as_user_id: "pa-1" }
            - { call: "POST /api/claims", payload: { funding_authorization_id: "${fa_id}", device_order_id: "${o_id}", service_date: "2026-05-10T00:00:00Z", lines: [ { line_type: "DEVICE", unit_price_cents: 1000, quantity: 1 } ] }, as: BillingSpecialist, captures: { cl_id: $.data.id } }
            - { call: "POST /api/claims/${cl_id}/submit", payload: {}, as: BillingSpecialist, as_user_id: "zz-1" }
          trigger:
            - { call: "POST /api/claims/${cl_id}/adjudicate", payload: { decision: "PAY", allowed_amount_cents: 1000 }, as: PayerAdjudicator, as_user_id: "zz-1", captures: { err: $.data.error_id } }
            - { call: "GET /api/claims/${cl_id}", as: BillingSpecialist, captures: { st: $.data.status } }
          assert:
            - "${err} == ERR_SEGREGATION_OF_DUTIES"
            - "${st} == SUBMITTED  # unchanged"

      - name: val_referral_not_accepted_blocks_evaluation
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_REFERRAL_NOT_ACCEPTED]"]
        distinguishing_aspect: "Creating an evaluation against a RECEIVED (never decided) referral fails ERR_REFERRAL_NOT_ACCEPTED."
        test_recipe:
          setup: ["client with a RECEIVED referral"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Ref Gate", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id, c_v: $.data.version } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}" }, as: VisionSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_REFERRAL_NOT_ACCEPTED"

      - name: val_order_not_active_blocks_training_plan
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_ORDER_NOT_ACTIVE]"]
        distinguishing_aspect: "A training plan for a PLACED (not yet allocated) order is rejected ERR_ORDER_NOT_ACTIVE."
        test_recipe:
          setup: ["client with FINALIZED evaluation and a PLACED PURCHASE order"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Plan Gate", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "PURCHASE" }, as: VisionSpecialist, captures: { o_id: $.data.id } }
          trigger:
            - { call: "POST /api/training-plans", payload: { client_id: "${c_id}", device_order_id: "${o_id}", total_sessions: 3 }, as: VisionSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_ORDER_NOT_ACTIVE"

      - name: val_loan_still_active_blocks_qa_pass
        claim_type: cross_entity_validation
        grounds: ["validations[priority=8]", "errors[ERR_LOAN_STILL_ACTIVE]", state_machines.RepairTicket.QA_CHECK_to_RESOLVED]
        distinguishing_aspect: "RepairTicket -> LoanAgreement pair: QA_PASS is blocked while the ticket's loan is ACTIVE; returning the loan unblocks resolution."
        test_recipe:
          setup: ["repair ticket in QA_CHECK with an ACTIVE loaner loan outstanding"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "QA Gate", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "CCTV" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "CCTV Pro 24", category: "CCTV", list_price_cents: 100000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-QA1", condition: "NEW" }, as: ClinicAdmin, captures: { u_broken: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-QA2", condition: "LOANER" }, as: ClinicAdmin }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "PURCHASE" }, as: VisionSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/device-orders/${o_id}/allocate", payload: { device_unit_id: "${u_broken}" }, as: VisionSpecialist }
            - { call: "POST /api/repair-tickets", payload: { device_unit_id: "${u_broken}", issue_description: "dead pixels" }, as: RepairTechnician, captures: { t_id: $.data.id } }
            - { call: "POST /api/repair-tickets/${t_id}/advance", payload: { action: "DIAGNOSE" }, as: RepairTechnician }
            - { call: "POST /api/repair-tickets/${t_id}/advance", payload: { action: "START_REPAIR", needs_loaner: true }, as: RepairTechnician, captures: { loan_id: $.data.loan_agreement_id } }
            - { call: "POST /api/repair-tickets/${t_id}/advance", payload: { action: "SUBMIT_QA" }, as: RepairTechnician }
          trigger:
            - { call: "POST /api/repair-tickets/${t_id}/advance", payload: { action: "QA_PASS" }, as: RepairTechnician, captures: { err: $.data.error_id } }
            - { call: "POST /api/loan-agreements/${loan_id}/return", payload: {}, as: RepairTechnician }
            - { call: "POST /api/repair-tickets/${t_id}/advance", payload: { action: "QA_PASS" }, as: RepairTechnician, captures: { st: $.data.status } }
          assert:
            - "${err} == ERR_LOAN_STILL_ACTIVE  # QA_PASS gated on the linked loan"
            - "${st} == RESOLVED  # after the loan is returned"

      - name: val_funding_window_inclusive_boundary
        claim_type: temporal_validation
        grounds: ["validations[priority=9]", "errors[ERR_FUNDING_WINDOW_INVALID]"]
        distinguishing_aspect: "The funding window is inclusive: service_date exactly equal to valid_until submits fine; one second past it fails ERR_FUNDING_WINDOW_INVALID."
        test_recipe:
          setup: ["APPROVED INSURANCE authorization 50000 with window [2026-05-01T00:00:00Z, 2026-05-31T23:59:59Z]; allocated PURCHASE order"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Window Edge", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-WE", condition: "NEW" }, as: ClinicAdmin, captures: { u_id: $.data.id } }
