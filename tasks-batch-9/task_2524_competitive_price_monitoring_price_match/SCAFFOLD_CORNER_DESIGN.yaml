        distinguishing_aspect: "Proximity is scoped to (link_id, collection_method) and is strict at 60 minutes: an ONLINE row 30 minutes away is refused, an ONLINE row exactly 60 minutes away is accepted, and a STORE_AUDIT row at the very same instant is accepted."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; product SKU-PROX-1, ACTIVE PRIMARY competitor C-A, PROPOSED link."
