    roles: [DamageSurveyor]
    code: 200
    input: ["revised_claim_amount_cents"]
    output: CarrierClaim
    side_effects:
      - "status DISPUTED -> FILED; revision_round += 1; disputed_amount_cents -> null"
      - "recoverable_amount_cents recomputed under the claim's current recoverable_basis"

  - method: POST
    path: /vpc/carrier-claims/{claimId}/settle
    description: "Settle an accepted claim. The settler may not be the filer (segregation of duties)."
    roles: [DistributionManager]
    code: 200
    input: ["settled_amount_cents"]
    output: CarrierClaim
    side_effects: ["status ACCEPTED_PENDING_SETTLEMENT -> SETTLED; settled_by_user_id := X-User-ID"]

