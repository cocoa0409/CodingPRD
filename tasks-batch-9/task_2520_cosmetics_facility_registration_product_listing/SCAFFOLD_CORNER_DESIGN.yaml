            - "${ok_flag} == false — the identical 07A payload without the professional flag is created (201), so the rule is conditional on professional_use_only"
            - "GET /cosmetics/listings?facility_id=${fac_id} returns exactly one row and ResponsiblePerson.active_designation_count == 1"

