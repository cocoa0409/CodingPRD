        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a bound enrollment with one wildfire claim of 50000000 reported and reviewed."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
            - *prop_base
            - *appr_200m
            - *appr_review
            - *appr_approve
            - *posture_eval
            - call: "POST /hnw/properties/${p1_id}/mitigation-requirements"
              payload: { requirement_code: "DEFENSIBLE_SPACE", band_awarded: "CLEARED", source: "UNDERWRITING", due_on: "2026-12-01T00:00:00Z" }
              as: RiskConsultant
              captures: { mit_id: $.data.id }
            - call: "POST /hnw/mitigation-requirements/${mit_id}/verify"
              payload: { verified_band: "CLEARED", verification_count: 0 }
              as: RiskConsultant
            - call: "POST /hnw/properties/${p1_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 300000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /hnw/enrollments/${e1_id}/submit"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
            - call: "POST /hnw/enrollments/${e1_id}/approve"
              payload: {}
              as: Underwriter
            - *get_prop_v_attach
            - call: "POST /hnw/enrollments/${e1_id}/attach"
              payload: { expected_property_version: "${p1_va}" }
              as: Underwriter
            - call: "POST /hnw/enrollments/${e1_id}/claims"
              payload: { cause_of_loss: "WILDFIRE", loss_date: "2026-09-20T00:00:00Z", reported_indemnity_cents: 50000000, adjuster_user_id: "adj-morgan", adjuster_override: false }
              as: ClaimsAdjuster
              captures: { c1_id: $.data.id }
            - call: "POST /hnw/claims/${c1_id}/review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /hnw/claims/${c1_id}/approve"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "GET /hnw/claims"
              payload: { enrollment_id: "${e1_id}", status: "APPROVED" }
              as: ClaimsAdjuster
              captures: { flat_amount: "$.data[0].settlement_amount_cents" }
          assert:
            - "GET /hnw/claims?enrollment_id=${e1_id}&status=APPROVED returns exactly 1 row with settlement_amount_cents == 50000000 and deductible_applied_cents == 6000000"
            - "GET /hnw/enrollments/${e1_id}/claims?status=APPROVED returns exactly 1 row carrying the same settlement_amount_cents 50000000"
            - "Claim.${c1_id}.limit_applied_cents == 300000000 and cash_settlement_eligible == false"
            - "after POST /hnw/claims/${c1_id}/settle both read surfaces report status SETTLED with the same settlement_amount_cents"

      - name: logical_clock_defaults_to_the_fixed_startup_instant
        claim_type: consistency_model
        grounds:
          - endpoints.POST_/hnw/_clock/set_current_utc
          - entities.AppraisalDocument.fields.expires_on
        distinguishing_aspect: "Before any clock call the logical clock reads exactly 2026-09-01T00:00:00Z rather than real wall-clock time, so a document filed with an appraisal_date 24 months earlier derives EXPIRED deterministically and the same fixture yields the same band on any run date."
        test_recipe:
          setup:
            - "No clock call is made at all: the server is at its startup default."
          setup_api_calls:
            - *zone_extreme
            - *ag_base
            - *prop_base
            - call: "POST /hnw/properties/${p1_id}/appraisal-documents"
              payload: { item_class: "WINE", appraiser_name: "Corner Cellars", appraisal_date: "2024-09-01T00:00:00Z", appraised_value_cents: 30000000 }
              as: Underwriter
              captures: { doc_id: $.data.id }
          trigger:
            - call: "GET /hnw/properties/${p1_id}/appraisal-documents"
              payload: {}
              as: Underwriter
          assert:
            - "AppraisalDocument.${doc_id}.currency_months == 24 and currency_status == EXPIRED against an untouched clock"
            - "AppraisalDocument.${doc_id}.expires_on == 2026-09-01T00:00:00Z"
            - "the same document reads currency_months 23 and currency_status AGING after POST /hnw/_clock/set_current_utc to 2026-08-31T23:59:59Z"
            - "the clock never falls back to real wall-clock time: running the read without any clock call reproduces the same EXPIRED answer"
