          - calculations.repair_loss_liability
        distinguishing_aspect: "An empty-collection / zero-count edge reachable through POST /service-plan-registrations/{id}/terminate on a store that holds no loads at all: terminating the store's only registration must leave open_inspection_count == 0 rather than -1, and a store with no repairs must report open_repair_liability_cents == 0 rather than null or a stale value."
