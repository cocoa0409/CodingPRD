            - call: "POST /solar/piles/${pile}/drive-results"
              payload: { actual_embedment_mm: 3000, plumb_deviation_mm: 5.0, blow_count: 42, refusal: false, driven_at: "2026-08-03T14:00:00Z" }
              as: InstallationForeman
              captures: { pile_status: $.data.status }
          assert:
            - "${ga_status} == GRADED before acceptance"
            - "the first drive-results returns 409 with error_id == ERR_GRADING_AREA_NOT_ACCEPTED"
            - "after the refusal Pile.${pile}.status == PLANNED with actual_embedment_mm, plumb_deviation_mm, blow_count and driven_at all null, and Block.${blk}.piles_accepted_count == 0 with mechanical_status == PLANNED"
            - "${ga_after} == ACCEPTED"
            - "the second drive-results returns 200 with ${pile_status} == ACCEPTED, and Block.${blk}.piles_accepted_count == 1 with mechanical_status == PILES_COMPLETE and mc_ready == false"

  - rule_id: resource_temporal_overlap
    instances:
      - name: laydown_yard_half_open_windows_share_capacity_in_aggregate
        grounds:
          - calculations.laydown_window_capacity_check
          - calculations.yard_zone_pallet_ledger
          - validations[priority=18]
          - concurrency_rules.delivery-create-stale-yard-zone
        distinguishing_aspect: |
          The contended resource is a YardZone and the interval semantics are
          HALF-OPEN with AGGREGATE capacity: overlap alone is legal, only the
          summed pallets of pairwise-overlapping reservations may not exceed
          pallet_capacity, and a window that starts exactly when another ends
          does not overlap at all.
        test_recipe:
          setup:
            - "One yard zone with pallet_capacity 100 and no deliveries"
            - "One 60-pallet MODULE reservation over the half-open window [2026-08-03T00:00Z, 2026-08-07T00:00Z)"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Creosote Mesa", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/yard-zones"
              payload: { zone_code: "Y1", pallet_capacity: 100 }
              as: ProcurementCoordinator
              captures: { yz: $.data.id, v0: $.data.version }
            - call: "POST /solar/deliveries"
              payload: { project_id: "${proj}", yard_zone_id: "${yz}", component_type: "MODULE", unit_qty: 600, pallets: 60, planned_arrival_at: "2026-08-03T09:00:00Z", laydown_window_start: "2026-08-03T00:00:00Z", laydown_window_end: "2026-08-07T00:00:00Z", expected_yard_zone_version: "${v0}" }
              as: ProcurementCoordinator
              captures: { d_a: $.data.id }
            - call: "GET /solar/yard-zones/${yz}"
              payload: {}
              as: ProcurementCoordinator
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /solar/deliveries"
              payload: { project_id: "${proj}", yard_zone_id: "${yz}", component_type: "TRACKER", unit_qty: 500, pallets: 50, planned_arrival_at: "2026-08-05T09:00:00Z", laydown_window_start: "2026-08-05T00:00:00Z", laydown_window_end: "2026-08-09T00:00:00Z", expected_yard_zone_version: "${v1}" }
              as: ProcurementCoordinator
            - call: "POST /solar/deliveries"
              payload: { project_id: "${proj}", yard_zone_id: "${yz}", component_type: "TRACKER", unit_qty: 300, pallets: 30, planned_arrival_at: "2026-08-07T09:00:00Z", laydown_window_start: "2026-08-07T00:00:00Z", laydown_window_end: "2026-08-09T00:00:00Z", expected_yard_zone_version: "${v1}" }
              as: ProcurementCoordinator
              captures: { d_c: $.data.id }
            - call: "GET /solar/yard-zones/${yz}"
              payload: {}
              as: ProcurementCoordinator
              captures: { v2: $.data.version }
            - call: "POST /solar/deliveries"
              payload: { project_id: "${proj}", yard_zone_id: "${yz}", component_type: "INVERTER", unit_qty: 20, pallets: 10, planned_arrival_at: "2026-08-06T09:00:00Z", laydown_window_start: "2026-08-06T00:00:00Z", laydown_window_end: "2026-08-08T00:00:00Z", expected_yard_zone_version: "${v2}" }
              as: ProcurementCoordinator
              captures: { d_d: $.data.id }
            - call: "GET /solar/yard-zones/${yz}"
              payload: {}
              as: ProcurementCoordinator
              captures: { v3: $.data.version }
            - call: "POST /solar/deliveries"
              payload: { project_id: "${proj}", yard_zone_id: "${yz}", component_type: "INVERTER", unit_qty: 2, pallets: 1, planned_arrival_at: "2026-08-06T10:00:00Z", laydown_window_start: "2026-08-06T00:00:00Z", laydown_window_end: "2026-08-08T00:00:00Z", expected_yard_zone_version: "${v3}" }
              as: ProcurementCoordinator
          assert:
            - "the 50-pallet [08-05, 08-09) request returns 409 with error_id == ERR_YARD_WINDOW_CAPACITY_EXCEEDED: it overlaps delivery A, so occupied 60 + 50 == 110 > 100"
            - "the 30-pallet [08-07, 08-09) request returns 201 — its start equals A's end, and half-open windows that merely touch do not overlap, so occupied is 0"
            - "the 10-pallet [08-06, 08-08) request returns 201 even though it overlaps BOTH A and C: occupied 60 + 30 == 90 and 90 + 10 == 100 is exactly at capacity, not over it"
            - "the final 1-pallet request over the same window returns 409 ERR_YARD_WINDOW_CAPACITY_EXCEEDED: occupied 100 + 1 == 101 > 100"
            - "YardZone.${yz}.reserved_pallets == 100 and available_pallets == 0, with exactly 3 RESERVED deliveries (${d_a}, ${d_c}, ${d_d}); ${v1} < ${v2} < ${v3} while the two rejected creates left the version untouched"

      - name: outage_windows_are_exclusive_with_a_switching_buffer
        grounds:
          - calculations.outage_window_conflict_check
          - validations[priority=15]
          - state_machines.OutageWindow.REQUESTED_to_DENIED
          - entities.OutageWindow.fields.status
        distinguishing_aspect: |
          A different resource entity (the utility feeder behind a Substation)
          under the OPPOSITE interval semantics: CLOSED intervals, EXCLUSIVE
          occupancy, and a 120-minute switching buffer applied to BOTH sides. A
          90-minute gap collides, a touching endpoint collides, one minute past
          the buffer does not, and DENYING a window frees the feeder for an
          identical re-request.
        test_recipe:
          setup:
            - "One substation with one APPROVED BACKFEED window [2026-08-10T00:00Z, 2026-08-10T04:00Z]"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Saguaro Gap", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/substations"
              payload: { substation_code: "S1", interconnection_voltage_kv: 138.0, mv_collection_km: 12.5 }
              as: UtilityCoordinator
              captures: { sub: $.data.id }
            - call: "POST /solar/substations/${sub}/outage-windows"
              payload: { start_at: "2026-08-10T00:00:00Z", end_at: "2026-08-10T04:00:00Z", purpose: "BACKFEED" }
              as: UtilityCoordinator
              captures: { w1: $.data.id }
            - call: "POST /solar/outage-windows/${w1}/utility-response"
              payload: { decision: "APPROVE", utility_reference: "SO-4471" }
              as: UtilityCoordinator
          trigger:
            - call: "POST /solar/substations/${sub}/outage-windows"
              payload: { start_at: "2026-08-10T05:30:00Z", end_at: "2026-08-10T07:00:00Z", purpose: "SWITCHING" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/outage-windows"
              payload: { start_at: "2026-08-10T04:00:00Z", end_at: "2026-08-10T05:00:00Z", purpose: "SWITCHING" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/outage-windows"
              payload: { start_at: "2026-08-10T06:01:00Z", end_at: "2026-08-10T08:00:00Z", purpose: "TIE_IN" }
              as: UtilityCoordinator
              captures: { w2: $.data.id, w2_status: $.data.status }
            - call: "POST /solar/outage-windows/${w2}/utility-response"
              payload: { decision: "DENY", utility_reference: "SO-4472" }
              as: UtilityCoordinator
              captures: { w2_after: $.data.status }
            - call: "POST /solar/substations/${sub}/outage-windows"
              payload: { start_at: "2026-08-10T06:01:00Z", end_at: "2026-08-10T08:00:00Z", purpose: "TIE_IN" }
              as: UtilityCoordinator
              captures: { w3: $.data.id, w3_status: $.data.status }
          assert:
            - "the [05:30, 07:00] request returns 409 with error_id == ERR_OUTAGE_WINDOW_CONFLICT: 05:30 <= 04:00 + 120 minutes, so a 90-minute gap is still inside the switching buffer"
            - "the [04:00, 05:00] request returns 409 ERR_OUTAGE_WINDOW_CONFLICT — closed intervals collide on a touching endpoint, unlike the half-open laydown windows"
            - "the [06:01, 08:00] request returns 201 with ${w2_status} == REQUESTED: 06:01 > 04:00 + 120 minutes clears the buffer by one minute"
            - "${w2_after} == DENIED and the identical re-request returns 201 with ${w3_status} == REQUESTED and ${w3} != ${w2} — DENIED windows are excluded from the input set"
            - "GET /solar/substations/${sub}/outage-windows returns exactly 3 windows: ${w1} APPROVED, ${w2} DENIED and ${w3} REQUESTED, and Substation.${sub}.status is still SITE_CIVIL"

  - rule_id: compensating_invariant
    instances:
      - name: cancelling_a_reservation_restores_yard_pallet_positions_exactly
        grounds:
          - calculations.yard_zone_pallet_ledger
          - state_machines.Delivery.RESERVED_to_CANCELLED
          - entities.YardZone.fields.reserved_pallets
          - entities.YardZone.fields.available_pallets
        distinguishing_aspect: |
          The conserved quantity is PALLET POSITIONS in a laydown zone:
          pallet_capacity == reserved_pallets + available_pallets must hold after
          every write, and the reserve -> cancel round trip must return both
          counters to their exact pre-reservation values (no pallet drift) while
          still advancing YardZone.version by exactly 2, proving the release is a
          real compensating write rather than a silent rollback.
        test_recipe:
          setup:
            - "One yard zone with pallet_capacity 100, reserved_pallets 0 and available_pallets 100"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Mesquite Wash", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/yard-zones"
              payload: { zone_code: "Y1", pallet_capacity: 100 }
              as: ProcurementCoordinator
              captures: { yz: $.data.id, v0: $.data.version, res0: $.data.reserved_pallets, avail0: $.data.available_pallets }
          trigger:
            - call: "POST /solar/deliveries"
              payload: { project_id: "${proj}", yard_zone_id: "${yz}", component_type: "MODULE", unit_qty: 600, pallets: 60, planned_arrival_at: "2026-08-03T09:00:00Z", laydown_window_start: "2026-08-03T00:00:00Z", laydown_window_end: "2026-08-07T00:00:00Z", expected_yard_zone_version: "${v0}" }
              as: ProcurementCoordinator
              captures: { d_a: $.data.id, d_a_status: $.data.status }
            - call: "GET /solar/yard-zones/${yz}"
              payload: {}
              as: ProcurementCoordinator
              captures: { v1: $.data.version, res1: $.data.reserved_pallets, avail1: $.data.available_pallets }
            - call: "POST /solar/deliveries/${d_a}/cancellation"
              payload: { cancel_reason: "supplier slipped the ship date" }
              as: ProcurementCoordinator
              captures: { d_a_after: $.data.status }
            - call: "GET /solar/yard-zones/${yz}"
              payload: {}
              as: ProcurementCoordinator
              captures: { v2: $.data.version, res2: $.data.reserved_pallets, avail2: $.data.available_pallets }
            - call: "POST /solar/deliveries"
              payload: { project_id: "${proj}", yard_zone_id: "${yz}", component_type: "MODULE", unit_qty: 1000, pallets: 100, planned_arrival_at: "2026-08-04T09:00:00Z", laydown_window_start: "2026-08-03T00:00:00Z", laydown_window_end: "2026-08-07T00:00:00Z", expected_yard_zone_version: "${v2}" }
              as: ProcurementCoordinator
              captures: { d_b: $.data.id, d_b_status: $.data.status }
          assert:
            - "${res0} == 0, ${avail0} == 100 and ${d_a_status} == RESERVED"
            - "${res1} == 60 and ${avail1} == 40 — capacity 100 == 60 + 40 holds mid-flight"
            - "${d_a_after} == CANCELLED, ${res2} == 0 and ${avail2} == 100 — both counters are byte-for-byte back to their pre-reservation values"
            - "${v2} == ${v0} + 2: the reservation and its cancellation are two distinct versioned writes on the zone, so the compensation is not a rollback"
            - "the 100-pallet reservation over the identical window returns 201 with ${d_b_status} == RESERVED (CANCELLED deliveries leave the input set entirely), leaving YardZone.${yz}.reserved_pallets == 100 and available_pallets == 0"

      - name: voiding_a_labor_entry_restores_certified_payroll_hours_exactly
        grounds:
          - calculations.payroll_hour_ledger
          - state_machines.LaborEntry.POSTED_to_VOIDED
          - entities.PayrollWeek.fields.total_hours
          - entities.Project.fields.total_labor_hours
        distinguishing_aspect: |
          A different conserved quantity — CERTIFIED PAYROLL HOURS — reconciled
          across two levels at once: apprentice_hours + journeyworker_hours ==
          total_hours must hold on the week after every write, and the
          post -> void round trip must restore the week's four counters AND the
          project's two denormalized rollups to their exact prior values, with the
          derived apprentice_pct recomputed rather than left stale.
        test_recipe:
          setup:
            - "One project with prevailing_wage_election REMEDIABLE and one OPEN payroll week 2026-08-03"
            - "One POSTED 8.00-hour apprentice entry, so the week reads total 8.00 / apprentice 8.00 / journeyworker 0.00 / pct 100.00"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Palo Verde Flats", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69, prevailing_wage_election: "REMEDIABLE", apprenticeship_basis: "PROJECT_AGGREGATE", apprenticeship_min_pct: 15.00 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/payroll-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: LaborComplianceOfficer
              captures: { wk: $.data.id }
            - call: "POST /solar/payroll-weeks/${wk}/labor-entries"
              payload: { worker_ref: "W-501", classification: "ELECTRICIAN", is_apprentice: true, hours: 8.00, paid_rate_cents: 4500, fringe_rate_cents: 500, prevailing_rate_cents: 5000, work_date: "2026-08-03" }
              as: LaborComplianceOfficer
              captures: { le_appr: $.data.id }
            - call: "GET /solar/payroll-weeks/${wk}"
              payload: {}
              as: LaborComplianceOfficer
              captures: { t0: $.data.total_hours, a0: $.data.apprentice_hours, j0: $.data.journeyworker_hours, p0: $.data.apprentice_pct, n0: $.data.entry_count }
          trigger:
            - call: "POST /solar/payroll-weeks/${wk}/labor-entries"
              payload: { worker_ref: "W-502", classification: "OPERATOR", is_apprentice: false, hours: 10.00, paid_rate_cents: 4500, fringe_rate_cents: 500, prevailing_rate_cents: 5000, work_date: "2026-08-04" }
              as: LaborComplianceOfficer
              captures: { le_journ: $.data.id }
            - call: "GET /solar/payroll-weeks/${wk}"
              payload: {}
              as: LaborComplianceOfficer
              captures: { t1: $.data.total_hours, a1: $.data.apprentice_hours, j1: $.data.journeyworker_hours, p1: $.data.apprentice_pct, n1: $.data.entry_count }
            - call: "GET /solar/projects/${proj}"
              payload: {}
              as: LaborComplianceOfficer
              captures: { pt1: $.data.total_labor_hours, pa1: $.data.apprentice_labor_hours }
            - call: "POST /solar/labor-entries/${le_journ}/void"
              payload: { void_reason: "hours booked to the wrong project" }
              as: LaborComplianceOfficer
              captures: { le_journ_status: $.data.status }
            - call: "GET /solar/payroll-weeks/${wk}"
              payload: {}
              as: LaborComplianceOfficer
              captures: { t2: $.data.total_hours, a2: $.data.apprentice_hours, j2: $.data.journeyworker_hours, p2: $.data.apprentice_pct, n2: $.data.entry_count }
            - call: "GET /solar/projects/${proj}"
              payload: {}
              as: LaborComplianceOfficer
              captures: { pt2: $.data.total_labor_hours, pa2: $.data.apprentice_labor_hours }
          assert:
            - "${t0} == 8.00, ${a0} == 8.00, ${j0} == 0.00, ${p0} == 100.00 and ${n0} == 1"
            - "${t1} == 18.00, ${a1} == 8.00, ${j1} == 10.00, ${p1} == 44.44 (8 / 18 * 100 rounded half up) and ${n1} == 2; ${pt1} == 18.00 and ${pa1} == 8.00"
            - "${le_journ_status} == VOIDED"
            - "${t2} == 8.00, ${a2} == 8.00, ${j2} == 0.00, ${n2} == 1 — every week counter is exactly back to its pre-post value, and 8.00 + 0.00 == 8.00 satisfies the invariant"
            - "${p2} == 100.00, NOT the stale 44.44 — the derived percentage is recomputed by the compensating write"
            - "${pt2} == 8.00 and ${pa2} == 8.00 — the project-level rollups are reconciled too, so no hours are left stranded one level up"
