              payload: { restaurant_id: "${rid}", customer_id: "${cust}", table_id: "${tbl}", expected_table_version: "${tbl_v0}", party_size: 4, reservation_start: "2026-06-15T19:00:00Z" }
              as: Host
              captures: { err: $.data.error_id }
          assert:
            - "the reservation create returns ERR_AREA_BOUGHT_OUT (HTTP 409)"
            - "DiningArea.${area}.status == BOUGHT_OUT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_funds_conserved_hold_then_release
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.DepositHold.HELD_to_RELEASED
          - entities.DepositHold.fields.captured_cents
          - entities.DepositHold.fields.amount_cents
        distinguishing_aspect: "Conserved quantity = captured funds (cents). Invariant: place hold (amount 15000) then early-cancel → DepositHold.captured_cents stays 0 and status RELEASED; the forward action (hold) paired with its compensating action (early cancel/release) leaves net captured == 0, no drift."
        test_recipe:
          setup:
            - "A CONFIRMED party-6 reservation with a 15000 HELD hold, clock 6h before reservation_start with a 2-hour cutoff so the cancel is early (6 >= 2 → refundable, fee 0)."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R17", timezone: "UTC", per_seat_deposit_cents: 2500, deposit_required_party_threshold: 6, late_cancel_cutoff_hours: 2, default_turn_time_minutes: 90, cleanup_buffer_minutes: 15 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN", kind: "STANDARD" }
              as: Manager
              captures: { area: $.data.id }
            - call: "POST /tables"
              payload: { dining_area_id: "${area}", label: "T1", min_party_size: 1, max_party_size: 8 }
              as: Manager
              captures: { tbl: $.data.id, tbl_v0: $.data.version }
            - call: "POST /service-periods"
              payload: { restaurant_id: "${rid}", name: "DINNER", start_local_time: "17:00", end_local_time: "23:00", slot_interval_minutes: 30, pacing_max_covers_per_slot: 10 }
              as: Manager
            - call: "POST /customers"
              payload: { full_name: "Rae", phone: "+15551110018" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { restaurant_id: "${rid}", customer_id: "${cust}", table_id: "${tbl}", expected_table_version: "${tbl_v0}", party_size: 6, reservation_start: "2026-06-15T18:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { res: $.data.id }
            - call: "POST /reservations/${res}/deposit-holds"
              payload: { card_last4: "4242" }
              as: Customer
              as_user_id: "${cust}"
              captures: { hold: $.data.id }
            - call: "POST /reservations/${res}/confirm"
              payload: {}
              as: Host
          trigger:
            - call: "POST /reservations/${res}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "DepositHold.${hold}.amount_cents == 15000 and DepositHold.${hold}.captured_cents == 0"
            - "DepositHold.${hold}.status == RELEASED"
            - "Reservation.${res}.cancellation_fee_cents == 0"

      - name: table_slot_availability_conserved_book_then_cancel
        grounds:
          - state_machines.Reservation.REQUESTED_to_CANCELLED
          - validations[priority=10]
          - entities.Table.fields.version
          - errors[ERR_TABLE_DOUBLE_BOOKED]
        distinguishing_aspect: "Conserved quantity = bookable table-slot capacity (a different conserved quantity than funds). Invariant: booking the only table at 18:00 then cancelling that reservation must free the slot so a fresh 18:00 booking on the same table succeeds — the forward booking (debit slot) and its cancel (credit slot) leave net availability unchanged (re-bookable)."
        test_recipe:
          setup:
            - "One table; a REQUESTED reservation at 18:00 that is then cancelled, after which a new 18:00 booking is attempted on the same table."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R18", timezone: "UTC", default_turn_time_minutes: 90, cleanup_buffer_minutes: 15 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN", kind: "STANDARD" }
              as: Manager
              captures: { area: $.data.id }
            - call: "POST /tables"
              payload: { dining_area_id: "${area}", label: "T1", min_party_size: 1, max_party_size: 8 }
              as: Manager
              captures: { tbl: $.data.id, tbl_v0: $.data.version }
            - call: "POST /service-periods"
              payload: { restaurant_id: "${rid}", name: "DINNER", start_local_time: "17:00", end_local_time: "23:00", slot_interval_minutes: 30, pacing_max_covers_per_slot: 10 }
              as: Manager
            - call: "POST /customers"
              payload: { full_name: "Sam", phone: "+15551110019" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { restaurant_id: "${rid}", customer_id: "${cust}", table_id: "${tbl}", expected_table_version: "${tbl_v0}", party_size: 2, reservation_start: "2026-06-15T18:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /tables/${tbl}"
              payload: {}
              as: Host
              captures: { tbl_v1: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { restaurant_id: "${rid}", customer_id: "${cust}", table_id: "${tbl}", expected_table_version: "${tbl_v1}", party_size: 2, reservation_start: "2026-06-15T18:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { res2: $.data.id }
          assert:
            - "the second 18:00 create on ${tbl} succeeds with status REQUESTED (slot freed by cancel)"
            - "Reservation.${res1}.status == CANCELLED"
