      - name: grant_window_violation
        claim_type: violation_to_error
        grounds:
          - "validations[priority=33]"
          - "errors[ERR_GRANT_WINDOW_VIOLATION]"
        distinguishing_aspect: "A booking dated 2027-01-05 against a grant ending 2026-12-31 fails the chargeable-window check even though the grant is ACTIVE today."
        test_recipe:
          setup: ["canonical stack (grant 2026-01-01..2026-12-31)"]
