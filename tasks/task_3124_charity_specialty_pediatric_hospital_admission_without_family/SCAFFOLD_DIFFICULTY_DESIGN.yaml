              captures: { s1: $.data.id }
            - call: "POST /charity-care/outreach-clinics/${cl1}/screenings"
              payload: { patient_full_name: "S End", patient_date_of_birth: "2019-05-01T00:00:00Z", suspected_condition_category: "ORTHOPEDIC", screening_date: "2026-10-02T00:00:00Z" }
              as: OutreachPlanner
              as_user_id: "op-1"
              captures: { s2: $.data.id }
            - call: "POST /charity-care/outreach-clinics/${cl1}/screenings"
              payload: { patient_full_name: "S Third", patient_date_of_birth: "2019-05-01T00:00:00Z", suspected_condition_category: "ORTHOPEDIC", screening_date: "2026-10-02T00:00:00Z" }
              as: OutreachPlanner
              as_user_id: "op-1"
              captures: { err_cap: $.data.error_id }
            - call: "POST /charity-care/outreach-clinics/${cl1}/screenings"
              payload: { patient_full_name: "S Late", patient_date_of_birth: "2019-05-01T00:00:00Z", suspected_condition_category: "ORTHOPEDIC", screening_date: "2026-10-03T00:00:00Z" }
              as: OutreachPlanner
              as_user_id: "op-1"
              captures: { err_date: $.data.error_id }
          assert:
            - "S1 (screening_date == start_date) books successfully: OutreachScreening.${s1}.status == BOOKED"
            - "S2 (screening_date == end_date) books successfully: OutreachScreening.${s2}.status == BOOKED"
            - "the third in-interval booking returns 409 and err_cap == ERR_CLINIC_CAPACITY_REACHED"
            - "the 2026-10-03 booking returns 409 and err_date == ERR_SCREENING_DATE_OUTSIDE_CLINIC"
            - "OutreachClinic.${cl1}.booked_screening_count == 2"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: family_balance_invariant_under_adjudicate_and_deny
        grounds:
          - entities.BillingAccount.fields.family_balance_cents
          - state_machines.Claim.SUBMITTED_to_ADJUDICATED
          - state_machines.Claim.SUBMITTED_to_DENIED_CLAIM
        distinguishing_aspect: |
          Conserved quantity 1 (family_balance_cents == 0): submit claim [charge 1000]
          (open_claim +1000, balance 0), adjudicate at contract rate
          (insurance_paid +600, writeoff +400, open_claim -1000, balance 0), submit
          [2000] then deny (writeoff +2000, balance 0) — every forward/compensating
          pair leaves family_balance_cents == 0 and
          total_charged == insurance_paid + charity_writeoff + open_claim.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Accepted application A1 with VERIFIED coverage (hospital H1 capacity 5, ORTHOPEDIC program P1 non-staged, source RS1); billing account BA1."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/programs"
              payload: { category: "ORTHOPEDIC", accepts_international: false, min_age_months: 0, max_age_months: 215, staged_care_required: false }
              as: NetworkAdmin
              captures: { p1: $.data.id }
            - call: "POST /charity-care/referral-sources"
              payload: { source_type: "COMMUNITY_PHYSICIAN", display_name: "Dr. Rivera", contact_email: "rivera@example.org", country_code: "US" }
              as: NetworkAdmin
              captures: { rs1: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid One", patient_date_of_birth: "2020-01-01T00:00:00Z", condition_category: "ORTHOPEDIC", referral_source_id: "${rs1}", program_id: "${p1}", home_latitude: 45.0, home_longitude: -121.0 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { a1: $.data.id, a1_v0: $.data.version }
            - call: "POST /charity-care/applications/${a1}/insurance-policies"
              payload: { payer_name: "PayerCo", policy_number: "POL-1", coverage_exists: true }
              as: IntakeCoordinator
              as_user_id: "ic-1"
            - call: "POST /charity-care/applications/${a1}/open-review"
              payload: {}
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${a1}/vote"
              payload: { vote: "ACCEPT", vote_weight: 2 }
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${a1}/vote"
              payload: { vote: "ACCEPT", vote_weight: 1 }
              as: ReviewCommitteeMember
              as_user_id: "rcm-2"
            - call: "POST /charity-care/applications/${a1}/decide"
              payload: { decision: "ACCEPT", decision_reason: "ok", expected_application_version: "${a1_v0} + 3" }
              as: ReviewCommitteeMember
              as_user_id: "rcm-3"
            - call: "GET /charity-care/applications/${a1}/billing-account"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { ba1: "$.data[0].id" }
          trigger:
            - call: "POST /charity-care/billing-accounts/${ba1}/claims"
              payload: { service_date: "2026-09-02T00:00:00Z", lines: [{ cpt_code: "99213", charge_cents: 1000 }] }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { cl1: $.data.id }
            - call: "POST /charity-care/claims/${cl1}/adjudicate"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bs-1"
            - call: "POST /charity-care/billing-accounts/${ba1}/claims"
              payload: { service_date: "2026-09-03T00:00:00Z", lines: [{ cpt_code: "99214", charge_cents: 2000 }] }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { cl2: $.data.id }
            - call: "POST /charity-care/claims/${cl2}/deny"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bs-1"
            - call: "GET /charity-care/billing-accounts/${ba1}"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bs-1"
          assert:
            - "BillingAccount.${ba1}.total_charged_cents == 3000"
            - "BillingAccount.${ba1}.insurance_paid_cents == 600      # round(1000*0.60)"
            - "BillingAccount.${ba1}.charity_writeoff_cents == 2400  # (1000-600) + 2000"
            - "BillingAccount.${ba1}.open_claim_cents == 0"
            - "BillingAccount.${ba1}.family_balance_cents == 0       # conserved across BOTH forward+compensating pairs"
            - "total_charged_cents == insurance_paid_cents + charity_writeoff_cents + open_claim_cents"

      - name: fund_conservation_under_commit_release_cycle
        grounds:
          - entities.PhilanthropicFund.fields.allocated_cents
          - entities.PhilanthropicFund.fields.available_cents
          - state_machines.FundAllocation.PLEDGED_to_COMMITTED
          - state_machines.FundAllocation.COMMITTED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity 2 (allocated_cents + available_cents == total_committed_cents
          — a fund-level quantity, not a billing one): commit 40000 then release 40000
          leaves allocated 0 / available 100000 exactly; the WITHDRAWN pledge never
          touched the conserved pair at all. Different conserved quantity type than the
          sibling's family balance.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1 capacity 5. Fund F1 total_committed 100000 OPEN. AL1 pledged 40000; AL2 pledged 5000."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/philanthropic-funds"
              payload: { fund_name: "General Fund", fiscal_year: 2026, total_committed_cents: 100000 }
              as: PhilanthropyOfficer
              as_user_id: "po-1"
              captures: { f1: $.data.id, f1_v0: $.data.version }
            - call: "POST /charity-care/philanthropic-funds/${f1}/allocations"
              payload: { hospital_id: "${h1}", amount_cents: 40000 }
              as: PhilanthropyOfficer
              as_user_id: "po-1"
              captures: { al1: $.data.id }
            - call: "POST /charity-care/philanthropic-funds/${f1}/allocations"
              payload: { hospital_id: "${h1}", amount_cents: 5000 }
              as: PhilanthropyOfficer
              as_user_id: "po-1"
              captures: { al2: $.data.id }
          trigger:
            - call: "POST /charity-care/fund-allocations/${al1}/commit"
              payload: { expected_fund_version: "${f1_v0}" }
              as: PhilanthropyOfficer
              as_user_id: "po-1"
            - call: "POST /charity-care/fund-allocations/${al2}/withdraw"
              payload: {}
              as: PhilanthropyOfficer
              as_user_id: "po-1"
            - call: "POST /charity-care/fund-allocations/${al1}/release"
              payload: {}
              as: PhilanthropyOfficer
              as_user_id: "po-1"
            - call: "GET /charity-care/philanthropic-funds/${f1}"
              payload: {}
              as: PhilanthropyOfficer
              as_user_id: "po-1"
          assert:
            - "after commit: PhilanthropicFund.${f1}.allocated_cents == 40000 and available_cents == 60000"
            - "withdraw of the PLEDGED allocation leaves both fund counters unchanged (still 40000 / 60000 at that point)"
            - "after release: PhilanthropicFund.${f1}.allocated_cents == 0 and available_cents == 100000"
            - "allocated_cents + available_cents == total_committed_cents == 100000 after every step"
            - "FundAllocation.${al1}.status == RELEASED and FundAllocation.${al2}.status == WITHDRAWN"
