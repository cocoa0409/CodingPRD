              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-BURGER", display_name: "Classic Burger", category: "ENTREE", base_price_cents: 500, screen_reader_text: "Classic burger", contrast_ratio: 7.1 }
              as: ContentManager
              captures: { item_a_id: $.data.id }
            - call: "POST /kiosk-ops/content-bundles"
              payload: { cluster_id: "${cl_id}", effective_from_utc: "2026-08-05T00:00:00Z" }
              as: ContentManager
              captures: { bundle_id: $.data.id, bundle_ver: $.data.version }
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/daypart-slots"
              payload: { expected_content_bundle_version: "${bundle_ver}", daypart_code: "LUNCH", start_minute_of_day: 660, end_minute_of_day: 960, layout_code: "LUNCH_GRID", buffer_minutes: 15, category_codes: ["ENTREE"] }
              as: ContentManager
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "ACCESSIBILITY_AUDIT", audit_result: "PASS" }
              as: ComplianceOfficer
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "VALIDATE" }
              as: ContentManager
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "PUBLISH" }
              as: ContentManager
            - call: "POST /kiosk-ops/stores/${store_id}/item-availabilities"
              payload: { menu_item_id: "${item_a_id}", on_hand_units: 40, reserved_units: 0, par_units: 20 }
              as: StoreOperator
              as_user_id: "${store_id}"
          trigger:
            - call: "GET /kiosk-ops/stores/${store_id}/menu-projection?at_minute_of_day=944"
              payload: {}
              as: ContentManager
              captures: { p944_daypart: $.data.daypart_code, p944_phase: $.data.phase, p944_layout: $.data.layout_code }
            - call: "GET /kiosk-ops/stores/${store_id}/menu-projection?at_minute_of_day=945"
              payload: {}
              as: ContentManager
              captures: { p945_phase: $.data.phase }
            - call: "GET /kiosk-ops/stores/${store_id}/menu-projection?at_minute_of_day=959"
              payload: {}
              as: ContentManager
              captures: { p959_daypart: $.data.daypart_code, p959_phase: $.data.phase, p959_layout: $.data.layout_code, p959_minute: $.data.local_minute_of_day }
            - call: "GET /kiosk-ops/stores/${store_id}/menu-projection?at_minute_of_day=960"
              payload: {}
              as: ContentManager
              captures: { p960_daypart: $.data.daypart_code, p960_phase: $.data.phase, p960_layout: $.data.layout_code, p960_minute: $.data.local_minute_of_day }
          assert:
            - "${p944_daypart} == LUNCH, ${p944_layout} == LUNCH_GRID and ${p944_phase} == ACTIVE (944 < 960 - 15)"
            - "${p945_phase} == TRANSITIONING (the buffer edge 960 - 15 = 945 is inclusive)"
            - "${p959_daypart} == LUNCH, ${p959_layout} == LUNCH_GRID, ${p959_phase} == TRANSITIONING and ${p959_minute} == 959"
            - "${p960_daypart} is null, ${p960_layout} == STATIC_FALLBACK, ${p960_phase} == FALLBACK and ${p960_minute} == 960"
            - "all four responses are HTTP 200 and resolved_bundle_id == ${bundle_id}; the fallback is not an error"

      - name: low_stock_threshold_inclusive_at_par_ratio_units
        grounds:
          - calculations.availability_rollup
