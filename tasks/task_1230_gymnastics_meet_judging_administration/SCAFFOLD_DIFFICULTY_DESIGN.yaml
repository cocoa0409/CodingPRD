scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1: dual_variant_calc — 2 instances across different entity domains
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: score_provisional_vs_final_after_upheld_inquiry
        grounds:
          - calculations.provisional_score
          - calculations.final_score
          - state_machines.Score.UNDER_INQUIRY_to_INQUIRY_RESOLVED
        distinguishing_aspect: |
          Entity domain = Score. Two valid variants of total-score computation
          produce different numbers for the same routine: the publish-time
          provisional_total (D+E-ND on raw inputs) vs the post-inquiry
          final_total (recomputed after UPHELD applies d/e/deduction deltas).
          The two variants MUST differ by exactly the applied deltas.
        test_recipe:
          setup:
            - "Meet M in IN_COMPETITION posture with tiebreak_policy=USAG_CLASSIC, inquiry_window_minutes=5"
            - "Session S (L9) with one Squad SQ of 1 athlete, one Rotation R (VAULT) OPEN_FOR_SCORING at 2026-05-02T14:00:00Z"
            - "AthleteEntry E1 CHECKED_IN then COMPETING, with Gymnast G1 competitive_level=L9"
            - "JudgePanel JP(VAULT) ACTIVE with Judge J1 CONFIRMED as PANEL_CHIEF"
            - "Coach C1 CREDENTIALED with CoachMeetPass FLOOR_ACCESS_GRANTED"
            - "Score SC for E1/VAULT published with D=5.2, E=8.85, ND=0.1"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "Spring State", sanction_year: 2026, sanction_number: "USAG-2026-0001", venue_name: "Arena A", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z", tiebreak_policy: "USAG_CLASSIC", qualifying_score_rule: "BOTH", inquiry_window_minutes: 5 }
              as: MeetDirector
              captures: { meet_id: $.data.id }
            - call: "POST /api/v1/meets/${meet_id}/sessions"
              payload: { session_label: "S1 L9", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { session_id: $.data.id }
            - call: "POST /api/v1/sessions/${session_id}/squads"
              payload: { squad_label: "A", starting_apparatus: "VAULT" }
              as: MeetDirector
              captures: { squad_id: $.data.id }
            - call: "POST /api/v1/gymnasts"
              payload: { usag_member_number: "A1234567", legal_name: "G One", date_of_birth: "2010-03-15T00:00:00Z", competitive_level: "L9", home_gym: "Metro" }
              as: MeetDirector
              captures: { g1_id: $.data.id }
            - call: "POST /api/v1/sessions/${session_id}/athlete-entries"
              payload: { gymnast_id: "${g1_id}" }
              as: MeetDirector
              captures: { e1_id: $.data.id }
            - call: "POST /api/v1/coaches"
              payload: { usag_coach_number: "C1234567", legal_name: "Coach One", affiliated_gym: "Metro", background_check_expiry: "2027-01-01T00:00:00Z", safety_cert_expiry: "2027-01-01T00:00:00Z" }
              as: MeetDirector
              captures: { c1_id: $.data.id }
            - call: "POST /api/v1/coaches/${c1_id}/verify"
              payload: {}
              as: MeetDirector
            - call: "POST /api/v1/meets/${meet_id}/coach-meet-passes"
              payload: { coach_id: "${c1_id}" }
              as: MeetDirector
              captures: { pass_id: $.data.id }
            - call: "POST /api/v1/coach-meet-passes/${pass_id}/grant-floor-access"
              payload: {}
              as: MeetDirector
            - call: "POST /api/v1/judges"
              payload: { usag_judge_number: "J1234567", legal_name: "Judge One", rating: "BREVET", affiliated_gym: "Neutral Club", availability_start: "2026-05-02T00:00:00Z", availability_end: "2026-05-03T00:00:00Z" }
              as: MeetReferee
              captures: { j1_id: $.data.id }
            - call: "POST /api/v1/sessions/${session_id}/judge-panels"
              payload: { meet_id: "${meet_id}", apparatus: "VAULT" }
              as: MeetReferee
              captures: { jp_id: $.data.id }
            - call: "POST /api/v1/judge-panels/${jp_id}/auto-assign"
              payload: {}
              as: MeetReferee
              captures: { pa_id: "$.data[0].id" }
            - call: "POST /api/v1/panel-assignments/${pa_id}/confirm"
              payload: {}
              as: MeetReferee
            - call: "POST /api/v1/meets/${meet_id}/publish"
              payload: {}
              as: MeetDirector
            - call: "POST /api/v1/sessions/${session_id}/rotations/generate"
              payload: {}
              as: MeetDirector
              captures: { rot_vt_id: "$.data[0].id" }
            - call: "POST /api/v1/athlete-entries/${e1_id}/check-in"
              payload: {}
              as: Coach
              as_user_id: "${c1_id}"
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T14:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/rotations/${rot_vt_id}/open-scoring"
              payload: {}
              as: MeetDirector
            - call: "POST /api/v1/athlete-entries/${e1_id}/scores"
              payload: { rotation_id: "${rot_vt_id}", apparatus: "VAULT", difficulty_score: 5.2, execution_score: 8.85, neutral_deduction: 0.1 }
              as: JudgePanelChief
              as_user_id: "${j1_id}"
              captures: { sc_id: $.data.id, sc_v: $.data.version }
            - call: "POST /api/v1/scores/${sc_id}/publish"
              payload: { expected_score_version: "${sc_v}" }
              as: JudgePanelChief
              as_user_id: "${j1_id}"
              captures: { sc_prov: $.data.provisional_total }
          trigger:
            - call: "POST /api/v1/scores/${sc_id}/inquiries"
              payload: { filed_by_coach_id: "${c1_id}" }
              as: Coach
              as_user_id: "${c1_id}"
              captures: { inq_id: $.data.id }
            - call: "POST /api/v1/inquiries/${inq_id}/begin-review"
              payload: {}
              as: MeetReferee
            - call: "GET /api/v1/inquiries/${inq_id}"
              payload: {}
              as: MeetReferee
              captures: { inq_v: $.data.version }
            - call: "POST /api/v1/inquiries/${inq_id}/resolve"
              payload: { expected_inquiry_version: "${inq_v}", resolution: "D_RAISED", d_score_delta: 0.3, e_score_delta: 0.15, deduction_delta: -0.1, resolution_reason: "missed DV" }
              as: MeetReferee
          assert:
            - "Score.${sc_id}.provisional_total == 14.500 (recomputed after deltas: (5.2+0.3)+(8.85+0.15)-(0.1-0.1))"
            - "Score.${sc_id}.score_state == INQUIRY_RESOLVED"
            - "Score.${sc_id}.provisional_total at publish (captured sc_prov) == 13.950"
            - "Score.${sc_id}.provisional_total != captured sc_prov (14.500 != 13.950)"

      - name: qualification_aa_only_vs_per_event_path
        grounds:
          - calculations.qualification_evaluation
          - entities.Meet.fields.qualifying_score_rule
        distinguishing_aspect: |
          Entity domain = AthleteEntry qualification. Three rule variants
          (ALL_AROUND_ONLY vs PER_EVENT vs BOTH) select different input sets
          and produce different qualification outcomes for the same scoring
          data: an athlete with AA=30.000 but one event=9.100 qualifies under
          PER_EVENT and BOTH but NOT under ALL_AROUND_ONLY.
        test_recipe:
          setup:
            - "Meet M1 with qualifying_score_rule=ALL_AROUND_ONLY and Meet M2 with qualifying_score_rule=PER_EVENT; both in DRAFT"
            - "Each meet has one L4 Session (state threshold AA >= 32.000) with one Squad, all 4 Rotations generated, all judge panels ACTIVE"
            - "Gymnast G1 (L4) entered in M1's session; same Gymnast G1 also entered in M2's session (different meets so no double-entry)"
            - "G1's four apparatus scores in each meet: VT=8.500, UB=7.000, BB=7.400, FX=9.100 → AA=32.000 would fail; we use VT=7.400, UB=7.000, BB=7.500, FX=9.100 → AA=31.000"
            - "Per-event: FX=9.100 >= 9.000 triggers PER_EVENT path; AA=31.000 < 32.000 fails AA path"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/gymnasts"
              payload: { usag_member_number: "A2222222", legal_name: "G Two", date_of_birth: "2014-01-01T00:00:00Z", competitive_level: "L4", home_gym: "Metro" }
              as: MeetDirector
              captures: { g2_id: $.data.id }
            - call: "POST /api/v1/meets"
              payload: { meet_name: "M-AA", sanction_year: 2026, sanction_number: "USAG-2026-1001", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z", qualifying_score_rule: "ALL_AROUND_ONLY" }
              as: MeetDirector
              captures: { meet_aa_id: $.data.id }
            - call: "POST /api/v1/meets"
              payload: { meet_name: "M-EV", sanction_year: 2026, sanction_number: "USAG-2026-1002", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z", qualifying_score_rule: "PER_EVENT" }
              as: MeetDirector
              captures: { meet_ev_id: $.data.id }
            - call: "POST /api/v1/meets/${meet_aa_id}/sessions"
              payload: { session_label: "S1", level_band: "L4", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { sess_aa_id: $.data.id }
            - call: "POST /api/v1/meets/${meet_ev_id}/sessions"
              payload: { session_label: "S1", level_band: "L4", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { sess_ev_id: $.data.id }
            - call: "POST /api/v1/sessions/${sess_aa_id}/athlete-entries"
              payload: { gymnast_id: "${g2_id}" }
              as: MeetDirector
              captures: { e_aa_id: $.data.id }
            - call: "POST /api/v1/sessions/${sess_ev_id}/athlete-entries"
              payload: { gymnast_id: "${g2_id}" }
              as: MeetDirector
              captures: { e_ev_id: $.data.id }
          trigger:
            - call: "GET /api/v1/athlete-entries/${e_aa_id}"
              payload: {}
              as: MeetDirector
            - call: "GET /api/v1/athlete-entries/${e_ev_id}"
              payload: {}
              as: MeetDirector
          assert:
            - "For the same gymnast scores (AA=31.000, best_event=9.100): M-AA (ALL_AROUND_ONLY) computes qualified_for_next_meet == false; M-EV (PER_EVENT) computes qualified_for_next_meet == true"
            - "AthleteEntry.${e_aa_id}.qualification_mobility_score reflects the AA path; AthleteEntry.${e_ev_id}.qualification_mobility_score == 9.100 (best event)"

  # ==========================================================================
  # Rule 2: combinatorial_formula — 2 instances in DIFFERENT modes {(a),(b),(c)}
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: award_tiebreak_usag_classic_multi_input_chain
        grounds:
          - calculations.award_ordering
          - entities.Meet.fields.tiebreak_policy
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction
          (conditional branch on Meet.tiebreak_policy, then tiered multi-key
          sort). USAG_CLASSIC walks final_total DESC, then execution DESC,
          then difficulty DESC, then deduction ASC, then created_at ASC.
          Same tied final_total yields different ordering than NCAA_MODIFIED.
        test_recipe:
          setup:
            - "Meet M (USAG_CLASSIC) with one L9 Session, two gymnasts G1 and G2 both with VAULT final_total == 13.850"
            - "G1: D=5.0, E=8.85, ND=0.0; G2: D=5.2, E=8.65, ND=0.0 (both final=13.850)"
            - "Session CLOSED so award_ordering has run"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "TB Classic", sanction_year: 2026, sanction_number: "USAG-2026-2001", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z", tiebreak_policy: "USAG_CLASSIC" }
              as: MeetDirector
              captures: { meet_id: $.data.id }
            - call: "POST /api/v1/meets/${meet_id}/sessions"
              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { sess_id: $.data.id }
            - call: "POST /api/v1/gymnasts"
              payload: { usag_member_number: "A3000001", legal_name: "G A", date_of_birth: "2010-01-01T00:00:00Z", competitive_level: "L9", home_gym: "Metro" }
              as: MeetDirector
              captures: { g_a_id: $.data.id }
            - call: "POST /api/v1/gymnasts"
              payload: { usag_member_number: "A3000002", legal_name: "G B", date_of_birth: "2010-01-01T00:00:00Z", competitive_level: "L9", home_gym: "South" }
              as: MeetDirector
              captures: { g_b_id: $.data.id }
            - call: "POST /api/v1/sessions/${sess_id}/athlete-entries"
              payload: { gymnast_id: "${g_a_id}" }
              as: MeetDirector
              captures: { e_a_id: $.data.id }
            - call: "POST /api/v1/sessions/${sess_id}/athlete-entries"
              payload: { gymnast_id: "${g_b_id}" }
              as: MeetDirector
              captures: { e_b_id: $.data.id }
          trigger:
            - call: "GET /api/v1/sessions/${sess_id}/awards"
              payload: { category: "VAULT" }
              as: MeetDirector
          assert:
            - "G1 (E=8.85) outranks G2 (E=8.65) despite identical final_total == 13.850 — USAG_CLASSIC tie-break on execution_score"
            - "Award.athlete_entry_id == ${e_a_id} has place == 1 AND was_tiebroken == true"
            - "Award.athlete_entry_id == ${e_b_id} has place == 2 AND was_tiebroken == true"

      - name: warmup_block_waterfall_remainder_allocation
        grounds:
          - calculations.warmup_block_layout
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned by evaluation order:
          each squad's block_end depends on accumulated allocation from prior
          squads, and the LAST squad's block absorbs the window remainder
          (waterfall). Allocation order (rotation_index ASC, created_at ASC)
          changes the final boundary; if sum-of-raw exceeds 60min, the last
          squad's block gets squeezed instead.
        test_recipe:
          setup:
            - "Session with 3 Squads A (rotation_index=0, 4 athletes), B (rotation_index=1, 4 athletes), C (rotation_index=2, 4 athletes)"
            - "Rotation.scheduled_start = 2026-05-02T14:00:00Z; window = [13:00, 14:00]"
            - "Per-squad raw = ceil(4 * 2) = 8 min; allocated = 8+8+8 = 24; remainder = 36 min flows to LAST squad C"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "WF Meet", sanction_year: 2026, sanction_number: "USAG-2026-3001", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
              captures: { meet_id: $.data.id }
            - call: "POST /api/v1/meets/${meet_id}/sessions"
              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { sess_id: $.data.id }
            - call: "POST /api/v1/sessions/${sess_id}/squads"
              payload: { squad_label: "A", starting_apparatus: "VAULT" }
              as: MeetDirector
              captures: { sq_a_id: $.data.id }
            - call: "POST /api/v1/sessions/${sess_id}/squads"
              payload: { squad_label: "B", starting_apparatus: "UNEVEN_BARS" }
              as: MeetDirector
              captures: { sq_b_id: $.data.id }
            - call: "POST /api/v1/sessions/${sess_id}/squads"
              payload: { squad_label: "C", starting_apparatus: "BALANCE_BEAM" }
              as: MeetDirector
              captures: { sq_c_id: $.data.id }
            - call: "POST /api/v1/sessions/${sess_id}/rotations/generate"
              payload: {}
              as: MeetDirector
              captures: { rot_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/v1/rotations/${rot_id}/warmup-blocks/generate"
              payload: {}
              as: MeetDirector
              captures: { blocks: $.data }
          assert:
            - "WarmupBlock count == 3 (one per squad)"
            - "Squad A block: [13:00, 13:08) (8 min)"
            - "Squad B block: [13:08, 13:16) (8 min)"
            - "Squad C block: [13:16, 14:00] — absorbs 8 + 36 = 44 min (waterfall remainder flows to last squad)"
            - "Sum of block durations == 60 minutes exactly (full window consumed)"

  # ==========================================================================
  # Rule 3: non_linear_state_machine — 2 instances on different entities
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: inquiry_cyclic_return_to_queue
        grounds:
          - state_machines.Inquiry.UNDER_REVIEW_to_FILED
          - state_machines.Inquiry.FILED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Entity = Inquiry. Cyclic shape: FILED -> UNDER_REVIEW -> FILED ->
          UNDER_REVIEW loops are allowed (referee defers without resolution).
          Loop count is unbounded until terminal resolution.
        test_recipe:
          setup:
            - "Score SC PUBLISHED; Inquiry INQ filed on SC"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "Cyc", sanction_year: 2026, sanction_number: "USAG-2026-4001", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z", inquiry_window_minutes: 5 }
              as: MeetDirector
              captures: { meet_id: $.data.id }
            - call: "POST /api/v1/meets/${meet_id}/sessions"
              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { sess_id: $.data.id }
            - call: "POST /api/v1/gymnasts"
              payload: { usag_member_number: "A4000001", legal_name: "G C", date_of_birth: "2010-01-01T00:00:00Z", competitive_level: "L9", home_gym: "Metro" }
              as: MeetDirector
              captures: { g_id: $.data.id }
            - call: "POST /api/v1/sessions/${sess_id}/athlete-entries"
              payload: { gymnast_id: "${g_id}" }
              as: MeetDirector
              captures: { e_id: $.data.id }
            - call: "POST /api/v1/coaches"
              payload: { usag_coach_number: "C4000001", legal_name: "Coach C", affiliated_gym: "Metro", background_check_expiry: "2027-01-01T00:00:00Z", safety_cert_expiry: "2027-01-01T00:00:00Z" }
              as: MeetDirector
              captures: { c_id: $.data.id }
            - call: "POST /api/v1/coaches/${c_id}/verify"
              payload: {}
              as: MeetDirector
            - call: "POST /api/v1/meets/${meet_id}/coach-meet-passes"
              payload: { coach_id: "${c_id}" }
              as: MeetDirector
              captures: { pass_id: $.data.id }
            - call: "POST /api/v1/coach-meet-passes/${pass_id}/grant-floor-access"
              payload: {}
              as: MeetDirector
            - call: "POST /api/v1/judges"
              payload: { usag_judge_number: "J4000001", legal_name: "J", rating: "BREVET", affiliated_gym: "Neutral", availability_start: "2026-05-02T00:00:00Z", availability_end: "2026-05-03T00:00:00Z" }
              as: MeetReferee
              captures: { j_id: $.data.id }
            - call: "POST /api/v1/sessions/${sess_id}/judge-panels"
              payload: { meet_id: "${meet_id}", apparatus: "VAULT" }
              as: MeetReferee
              captures: { jp_id: $.data.id }
            - call: "POST /api/v1/judge-panels/${jp_id}/auto-assign"
              payload: {}
              as: MeetReferee
              captures: { pa_id: "$.data[0].id" }
            - call: "POST /api/v1/panel-assignments/${pa_id}/confirm"
              payload: {}
              as: MeetReferee
            - call: "POST /api/v1/meets/${meet_id}/publish"
              payload: {}
              as: MeetDirector
            - call: "POST /api/v1/sessions/${sess_id}/rotations/generate"
              payload: {}
              as: MeetDirector
              captures: { rot_id: "$.data[0].id" }
            - call: "POST /api/v1/athlete-entries/${e_id}/check-in"
              payload: {}
              as: Coach
              as_user_id: "${c_id}"
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T14:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/rotations/${rot_id}/open-scoring"
              payload: {}
              as: MeetDirector
            - call: "POST /api/v1/athlete-entries/${e_id}/scores"
