  - rule_id: transitive_cascade
    instances:
      - name: dispense_drains_shelf_cascades_par_posture_clinic_suspension_sibling_hold
        grounds:
          - state_machines.DispenseEncounter.FITTED_to_DELIVERED
          - state_machines.ClinicParLevel.OK_to_STOCKOUT
          - state_machines.Clinic.RESTRICTED_to_SUSPENDED
          - calculations.par_stock_posture
          - calculations.clinic_dispensing_posture
          - entities.ClinicParLevel.fields.stock_posture
          - entities.Clinic.fields.stockout_par_level_count
          - entities.Clinic.fields.dispensing_status
          - entities.DispenseEncounter.fields.compliance_hold
          - entities.DispenseEncounter.fields.hold_reason
        distinguishing_aspect: |
          Depth-4 cascade whose origin trigger is POST
          /dme/encounters/{id}/dispense: hop 1 the dispense decrements
          ClinicParLevel P1.on_hand_qty from 1 to 0; hop 2 that quantity
          mutation -- not the dispense -- makes calculations.par_stock_posture
          flip P1.stock_posture OK -> STOCKOUT; hop 3 that posture change --
          not the dispense -- makes calculations.clinic_dispensing_posture
          recount 2 stocked-out shelves and move Clinic.dispensing_status
          RESTRICTED -> SUSPENDED; hop 4 that clinic status change -- not the
          dispense -- sets compliance_hold = true and hold_reason =
          CLINIC_SUSPENDED on a DIFFERENT, still-RESERVED encounter on a third
          shelf. Each link is caused by the previous link, and the origin
          trigger differs from the second instance's supplier attestation.
