    input: [reason_code]
    output: CertificationRecord
    side_effects: ["status = REVOKED", "When certification_level IN {STANDARD, SENIOR, INSTRUCTOR}: cascades the piercer to SUSPENDED", "Recomputes Piercer.eligibility_score via piercer_eligibility_score"]

