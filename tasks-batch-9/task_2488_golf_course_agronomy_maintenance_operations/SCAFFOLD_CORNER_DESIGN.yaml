              as: Superintendent
              as_user_id: "super-1"
              captures: { wx1_cleared_at: $.data.cleared_at }
          trigger:
            - call: "POST /weather-events/${wx1_id}/clear"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 and ${err_id} == ERR_WEATHER_STATE_INVALID"
            - "WeatherEvent.${wx1_id}.status == CLEARED"
            - "WeatherEvent.${wx1_id}.cleared_at == ${wx1_cleared_at} == 2026-08-01T00:00:00Z"
            - "Course.${course_id}.play_posture == OPEN and Course.${course_id}.version == 3 (create 1, declare 2, clear 3)"

      - name: plan_return_cycle_stops_at_the_revision_limit
        claim_type: precondition_enforcement
        grounds:
          - state_machines.AgronomicPlan.SUBMITTED_to_DRAFT
          - entities.AgronomicPlan.fields.return_count
          - validations[priority=47]
          - errors[ERR_REVISION_LIMIT_REACHED]
        distinguishing_aspect: "MAX_PLAN_RETURNS is 2 and the guard is strict, so the third return attempt returns ERR_REVISION_LIMIT_REACHED (409) and leaves the plan SUBMITTED at return_count 2; each accepted return also clears submitted_by_user_id, which the next submit re-stamps with the new caller."
        test_recipe:
          setup:
            - "One course, one 5500 sq ft GREEN on hole 7."
            - "One DRAFT 2026 plan carrying one PLANNED AERATION task."
            - "Two returned revisions already consumed: submit by agro-1, return, submit by agro-2, return, submit by agro-1 again."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /agronomic-plans"
              payload: { course_id: "${course_id}", plan_year: 2026, nitrogen_budget_lb: 40.00 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_id: $.data.id }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green7_id}", task_type: "AERATION", planned_window_start: "2026-08-10T00:00:00Z", planned_window_end: "2026-08-20T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task1_id: $.data.id }
            - call: "POST /agronomic-plans/${plan_id}/submit"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
            - call: "POST /agronomic-plans/${plan_id}/return"
              payload: { return_note: "Split the September aeration into two windows." }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /agronomic-plans/${plan_id}/submit"
              payload: {}
              as: Agronomist
              as_user_id: "agro-2"
            - call: "POST /agronomic-plans/${plan_id}/return"
              payload: { return_note: "Nitrogen still front-loaded." }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /agronomic-plans/${plan_id}/submit"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_v_third_submit: $.data.version }
          trigger:
            - call: "POST /agronomic-plans/${plan_id}/return"
