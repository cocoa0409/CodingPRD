              as: ProgramDirector
              captures: { err_trk: $.data.error_id }
          assert:
            - "the response status is 422"
            - "error_id == ERR_INSTRUCTOR_UNAVAILABLE"

      - name: scholarship_revoke_with_disbursed_balance_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_SCHOLARSHIP_NOT_REVOCABLE
          - state_machines.ScholarshipAward.AWARDED_to_REVOKED
        distinguishing_aspect: "Scholarship in AWARDED state with disbursed_cents > 0 cannot be revoked."
        test_recipe:
          setup: ["Scholarship awarded, student has an invoice, disbursement applied."]
          setup_api_calls:
            - *c_clock
            - *c_lvl
            - *c_term
            - *c_instr
            - call: "POST /terms/${c_term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - *c_sec_a
            - call: "POST /terms/${c_term_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - *c_stu
            - &c_sch
              call: "POST /scholarships"
              payload: { student_id: "${c_sid}", kind: "NEED_BASED", amount_cents: 5000 }
              as: FinanceOfficer
              captures: { c_sch_id: $.data.id }
            - call: "POST /scholarships/${c_sch_id}/award"
              payload: {}
              as: FinanceOfficer
            - call: "POST /enrollments"
              payload: { student_id: "${c_sid}", section_id: "${c_sec_a_id}", expected_section_version: "${c_sec_a_v}" }
              as: Registrar
          trigger:
            - call: "POST /scholarships/${c_sch_id}/revoke"
