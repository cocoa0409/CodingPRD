            - "PerfectionReport.${rep_now}.expiring_within_horizon_count == 1"
            - "PerfectionReport.${rep_now}.lapsed_count == 1"
            - "PerfectionReport.${rep_now}.terminated_count == 1"
            - "PerfectionReport.${rep_now}.projected_lapsed_count == 0"
            - "PerfectionReport.${rep_now}.perfected_exposure_cents == 500000"
            - "PerfectionReport.${rep_now}.unperfected_exposure_cents == 300000"
            - "PerfectionReport.${rep_now}.projected_lapsed_exposure_cents == 0"
            - "PerfectionReport.${rep_fwd}.projected_lapsed_count == 1"
            - "PerfectionReport.${rep_fwd}.active_count == 1"
            - "PerfectionReport.${rep_fwd}.perfected_count == 0"
            - "PerfectionReport.${rep_fwd}.unreflected_count == 1"
            - "PerfectionReport.${rep_fwd}.projected_lapsed_exposure_cents == 500000"
            - "PerfectionReport.${rep_fwd}.perfected_exposure_cents == 0"
            - "PerfectionReport.${rep_fwd}.as_of == 2026-10-30T00:00:00Z"

  # ---------------------------------------------------------------- rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: fee_county_tiered_expedited_multi_input
        grounds:
          - calculations.filing_fee
          - validations[priority=11]
        distinguishing_aspect: |
          Mode (a): five inputs interact non-linearly — county branch (FIXTURE in CA
          forces COUNTY, adding 2500), per-additional-debtor tier (2 extra = +3000),
          kind delta (NEW_UCC1 = 0), and the EXPEDITED 1.5x multiplier on the whole
          subtotal: (10000 + 2*1500 + 2500 + 0) * 1.5 = 23250.
        test_recipe:
          setup:
            - "CA profile (FIXTURE files at county, county surcharge 2500); client/debtor/secured party exist"
            - "FIXTURE request with county LOS_ANGELES, 2 additional debtors, EXPEDITED, is READY"
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "FIXTURE", county_name: "LOS_ANGELES", service_level: "EXPEDITED", additional_debtor_count: 2, fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${rid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way", secured_amount_cents: 500000 }, as: FilingSpecialist, captures: { fid: $.data.id } }
          trigger:
            - { call: "POST /filings/${fid}/submit", payload: {}, as: FilingSpecialist, captures: { charged: $.data.charged_fee_cents } }
          assert:
            - "FilingRequest.${rid}.filing_office == COUNTY"
            - "UCCFiling.${fid}.charged_fee_cents == 23250"
            - "UCCFiling.${fid}.filing_office == COUNTY"
            - "UCCFiling.${fid}.county_name == LOS_ANGELES"

      - name: continuation_expiration_anchored_to_prior_expiration
        grounds:
          - calculations.expiration_computation
          - state_machines.UCCFiling.SUBMITTED_to_ACTIVE
          - entities.UCCFiling.fields.expiration_at
        distinguishing_aspect: |
          Mode (c): the continuation extension reads the STORED expiration
          (2031-03-10) and adds 60 months — anchoring to filed_at (2030-12-01)
          would give 2035-12-01; the pinned evaluation order must yield
          2036-03-10T00:00:00Z, proving the anchor is the prior expiration.
        test_recipe:
          setup:
            - "Root INITIAL filing ACTIVE, filed 2026-03-10, expiration 2031-03-10"
            - "Clock advanced to 2030-12-01 (inside continuation window 2030-09-10 .. 2031-03-10)"
            - "CONTINUATION request against the root is READY with a DRAFT attempt"
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-10T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${rid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way", secured_amount_cents: 500000 }, as: FilingSpecialist, captures: { fid: $.data.id } }
            - { call: "POST /filings/${fid}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /filings/${fid}/record-acceptance", payload: { filing_number: "CA-2026-0001", filed_at: "2026-03-10T00:00:00Z" }, as: FilingOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2030-12-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /filings/${fid}", as: PlatformAdmin, captures: { fv: $.data.version } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "CONTINUATION", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000, target_filing_id: "${fid}", expected_target_filing_version: "${fv}" }, as: FilingSpecialist, captures: { crid: $.data.id } }
            - { call: "POST /filing-requests/${crid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${crid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${crid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc." }, as: FilingSpecialist, captures: { cfid: $.data.id } }
            - { call: "POST /filings/${cfid}/submit", payload: {}, as: FilingSpecialist }
          trigger:
            - { call: "POST /filings/${cfid}/record-acceptance", payload: { filing_number: "CA-2030-9001", filed_at: "2030-12-01T00:00:00Z" }, as: FilingOfficer }
          assert:
            - "UCCFiling.${fid}.expiration_at == 2036-03-10T00:00:00Z"
            - "UCCFiling.${fid}.expiration_at != 2035-12-01T00:00:00Z (filed_at anchoring is wrong)"
            - "UCCFiling.${fid}.effectiveness_status == ACTIVE"
            - "UCCFiling.${cfid}.effectiveness_status == ACTIVE"
            - "FilingRequest.${crid}.status == FULFILLED"

      - name: fee_expedited_rounding_half_up_single_pass
        grounds:
          - calculations.filing_fee
          - entities.UCCFiling.fields.charged_fee_cents
        distinguishing_aspect: |
          Mode (b): pinned rounding order — the 1.5 multiplier applies once to the
          integer subtotal with a single round_half_up at the end: 10001 * 1.5 =
          15001.5 must become 15002 (half-up), not 15001 (truncation) and not a
          per-component rounded sum.
        test_recipe:
          setup:
            - "CA profile base_fee_cents raised to 10001; EXPEDITED GENERAL NEW_UCC1 request (0 additional debtors, STATE office) is READY"
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin, captures: { prof_ca: $.data.id } }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", service_level: "EXPEDITED", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "PUT /jurisdiction-profiles/${prof_ca}", payload: { base_fee_cents: 10001 }, as: PlatformAdmin }
            - { call: "POST /filing-requests/${rid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way", secured_amount_cents: 500000 }, as: FilingSpecialist, captures: { fid: $.data.id } }
          trigger:
            - { call: "POST /filings/${fid}/submit", payload: {}, as: FilingSpecialist, captures: { charged: $.data.charged_fee_cents } }
          assert:
            - "UCCFiling.${fid}.charged_fee_cents == 15002"
            - "UCCFiling.${fid}.effectiveness_status == SUBMITTED"

  # ---------------------------------------------------------------- rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: request_correction_cycle_rejection_refile_loop
        grounds:
          - state_machines.FilingRequest.IN_PROCESS_to_CORRECTION_REQUIRED
          - state_machines.FilingRequest.CORRECTION_REQUIRED_to_READY
          - entities.UCCFiling.fields.supersedes_attempt_id
        distinguishing_aspect: |
          FilingRequest traverses a true cycle: IN_PROCESS -> CORRECTION_REQUIRED
          (office rejection) -> READY (re-approval) -> IN_PROCESS (refiled attempt)
          -> FULFILLED, and the refiled attempt must link supersedes_attempt_id to
          the REJECTED attempt — proving the loop was traversed, not a fresh request.
        test_recipe:
          setup:
            - "READY NEW_UCC1 request; first attempt submitted and then REJECTED by the office (NAME_MISMATCH); clock at default 2026-08-01"
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${rid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way", secured_amount_cents: 500000 }, as: FilingSpecialist, captures: { fid1: $.data.id } }
            - { call: "POST /filings/${fid1}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /filings/${fid1}/record-rejection", payload: { rejection_reason_code: "NAME_MISMATCH" }, as: FilingOfficer }
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
          trigger:
            - { call: "POST /filing-requests/${rid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way", secured_amount_cents: 500000 }, as: FilingSpecialist, captures: { fid2: $.data.id, sup: $.data.supersedes_attempt_id } }
            - { call: "POST /filings/${fid2}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /filings/${fid2}/record-acceptance", payload: { filing_number: "CA-2026-0002", filed_at: "2026-08-01T00:00:00Z" }, as: FilingOfficer }
          assert:
            - "UCCFiling.${fid2}.supersedes_attempt_id == ${fid1}"
            - "UCCFiling.${fid1}.effectiveness_status == REJECTED"
            - "UCCFiling.${fid2}.effectiveness_status == ACTIVE"
            - "FilingRequest.${rid}.status == FULFILLED"
            - "UCCFiling.${fid2}.expiration_at == 2031-08-01T00:00:00Z"

      - name: filing_parallel_effectiveness_and_reflection_dimensions
        grounds:
          - state_machines.UCCFiling
          - entities.UCCFiling.fields.reflection_status
          - state_machines.LienSearch.ORDERED_to_DISCREPANCY
          - state_machines.LienSearch.ORDERED_to_VERIFIED
        distinguishing_aspect: |
          UCCFiling carries two independent state dimensions: while a verification
          search flips reflection UNVERIFIED -> DISCREPANCY -> REFLECTED (via two
          searches), effectiveness_status must stay ACTIVE throughout — dimensions
          evolve on one row without interfering.
        test_recipe:
          setup:
            - "Root INITIAL filing ACTIVE (filed 2026-08-01, number CA-2026-0001, reflection UNVERIFIED)"
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${rid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way", secured_amount_cents: 500000 }, as: FilingSpecialist, captures: { fid: $.data.id } }
            - { call: "POST /filings/${fid}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /filings/${fid}/record-acceptance", payload: { filing_number: "CA-2026-0001", filed_at: "2026-08-01T00:00:00Z" }, as: FilingOfficer }
            - { call: "POST /lien-searches", payload: { client_id: "${cid}", purpose: "POST_FILING_VERIFICATION", debtor_id: "${did}", jurisdiction_code: "CA", subject_filing_id: "${fid}" }, as: FilingSpecialist, captures: { s1: $.data.id } }
            - { call: "POST /lien-searches/${s1}/record-results", payload: { through_date: "2026-08-01T00:00:00Z", hits: [] }, as: SearchAnalyst, captures: { s1_status: $.data.status } }
          trigger:
            - { call: "POST /lien-searches", payload: { client_id: "${cid}", purpose: "POST_FILING_VERIFICATION", debtor_id: "${did}", jurisdiction_code: "CA", subject_filing_id: "${fid}" }, as: FilingSpecialist, captures: { s2: $.data.id } }
            - { call: "POST /lien-searches/${s2}/record-results", payload: { through_date: "2026-08-01T00:00:00Z", hits: [ { found_debtor_name: "Acme Manufacturing, Inc.", found_filing_number: "CA-2026-0001", found_filed_at: "2026-08-01T00:00:00Z", secured_party_name: "Acme Lending" } ] }, as: SearchAnalyst, captures: { s2_status: $.data.status, s2_pos: $.data.priority_position_of_subject } }
          assert:
            - "LienSearch.${s1}.status == DISCREPANCY"
            - "UCCFiling.${fid}.effectiveness_status == ACTIVE (unchanged by search outcomes)"
            - "UCCFiling.${fid}.reflection_status == REFLECTED (was DISCREPANCY after first search)"
            - "LienSearch.${s2}.status == VERIFIED"
            - "LienSearch.${s2}.priority_position_of_subject == 1"

  # ---------------------------------------------------------------- rule 4
  - rule_id: transitive_cascade
    instances:
      - name: termination_acceptance_cascade_depth3
        grounds:
          - state_machines.UCCFiling.SUBMITTED_to_ACTIVE
          - state_machines.UCCFiling.ACTIVE_to_TERMINATED
          - state_machines.FilingRequest.DRAFT_INTAKE_to_CANCELLED
          - entities.UCCFiling.fields.open_ucc3_request_count
        distinguishing_aspect: |
          Depth-3 cascade triggered by TERMINATION acceptance: root TERMINATED (1)
          -> open AMENDMENT request CANCELLED with TARGET_TERMINATED (2) -> its DRAFT
          attempt WITHDRAWN (3); each hop is caused by the previous one, and the
          open_ucc3_request_count ledger must settle back to 0.
        test_recipe:
          setup:
            - "Root R ACTIVE (filed 2026-08-01); AMENDMENT request A open against R in READY with a DRAFT attempt; TERMINATION request T subsequently opened (TERMINATION is exempt from the UCC3-in-flight rule) and its attempt SUBMITTED"
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${rid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way", secured_amount_cents: 500000 }, as: FilingSpecialist, captures: { fid: $.data.id } }
            - { call: "POST /filings/${fid}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /filings/${fid}/record-acceptance", payload: { filing_number: "CA-2026-0001", filed_at: "2026-08-01T00:00:00Z" }, as: FilingOfficer }
            - { call: "GET /filings/${fid}", as: PlatformAdmin, captures: { rv1: $.data.version } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "AMENDMENT", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000, target_filing_id: "${fid}", expected_target_filing_version: "${rv1}" }, as: FilingSpecialist, captures: { arid: $.data.id } }
            - { call: "POST /filing-requests/${arid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${arid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${arid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", amendment_scope: "COLLATERAL", collateral_change_op: "ADD", collateral_text: "All inventory stored at 200 Dock Street" }, as: FilingSpecialist, captures: { afid: $.data.id } }
            - { call: "GET /filings/${fid}", as: PlatformAdmin, captures: { rv2: $.data.version } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "TERMINATION", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000, target_filing_id: "${fid}", expected_target_filing_version: "${rv2}" }, as: FilingSpecialist, captures: { trid: $.data.id } }
            - { call: "POST /filing-requests/${trid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${trid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${trid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc." }, as: FilingSpecialist, captures: { tfid: $.data.id } }
            - { call: "POST /filings/${tfid}/submit", payload: {}, as: FilingSpecialist }
          trigger:
            - { call: "POST /filings/${tfid}/record-acceptance", payload: { filing_number: "CA-2026-0007", filed_at: "2026-08-01T00:00:00Z" }, as: FilingOfficer }
          assert:
            - "UCCFiling.${fid}.effectiveness_status == TERMINATED (hop 1)"
            - "FilingRequest.${arid}.status == CANCELLED (hop 2)"
            - "FilingRequest.${arid}.cancel_reason == TARGET_TERMINATED"
            - "UCCFiling.${afid}.effectiveness_status == WITHDRAWN (hop 3)"
            - "UCCFiling.${fid}.open_ucc3_request_count == 0"
            - "FilingRequest.${trid}.status == FULFILLED"

      - name: lapse_sweep_cascade_depth3
        grounds:
          - calculations.lapse_sweep
          - state_machines.UCCFiling.ACTIVE_to_LAPSED
          - state_machines.FilingRequest.DRAFT_INTAKE_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 cascade triggered by the clock (a different trigger than the
          acceptance cascade): lapse sweep lapses the root (1) -> the open
          CONTINUATION request is CANCELLED with TARGET_LAPSED (2) -> its DRAFT
          attempt is WITHDRAWN (3); the ucc3 ledger returns to 0 without any
          client action.
        test_recipe:
          setup:
            - "Root filed 2021-06-01 (expiration 2026-06-01), ACTIVE; CONTINUATION request open in READY with a DRAFT attempt; clock jumps from 2021-06-01 to 2026-08-01"
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2021-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${rid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way", secured_amount_cents: 500000 }, as: FilingSpecialist, captures: { fid: $.data.id } }
            - { call: "POST /filings/${fid}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /filings/${fid}/record-acceptance", payload: { filing_number: "CA-2021-0001", filed_at: "2021-06-01T00:00:00Z" }, as: FilingOfficer }
            - { call: "GET /filings/${fid}", as: PlatformAdmin, captures: { fv: $.data.version } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "CONTINUATION", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000, target_filing_id: "${fid}", expected_target_filing_version: "${fv}" }, as: FilingSpecialist, captures: { crid: $.data.id } }
            - { call: "POST /filing-requests/${crid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${crid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${crid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc." }, as: FilingSpecialist, captures: { cfid: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          assert:
            - "UCCFiling.${fid}.effectiveness_status == LAPSED (hop 1; expiration 2026-06-01 <= now)"
            - "FilingRequest.${crid}.status == CANCELLED (hop 2)"
            - "FilingRequest.${crid}.cancel_reason == TARGET_LAPSED"
            - "UCCFiling.${cfid}.effectiveness_status == WITHDRAWN (hop 3)"
            - "UCCFiling.${fid}.open_ucc3_request_count == 0"

  # ---------------------------------------------------------------- rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_temporal_on_approve_preparation
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_REQUEST_INVALID_STATE]
          - errors[ERR_SEARCH_STALE]
        distinguishing_aspect: |
          Category pair state x business_temporal: the request is still
          DRAFT_INTAKE (state violation) AND its supporting search is stale
          (temporal violation) — the state error ERR_REQUEST_INVALID_STATE must
          win over ERR_SEARCH_STALE.
        test_recipe:
          setup:
            - "Completed PRE_FILING search with through_date 2026-04-15 (90-day validity expires 2026-07-14; now is 2026-08-01, so it is stale)"
            - "NEW_UCC1 request referencing it as supporting_search_id, left in DRAFT_INTAKE (intake never submitted)"
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /lien-searches", payload: { client_id: "${cid}", purpose: "PRE_FILING", debtor_id: "${did}", jurisdiction_code: "CA" }, as: FilingSpecialist, captures: { sid: $.data.id } }
            - { call: "POST /lien-searches/${sid}/record-results", payload: { through_date: "2026-04-15T00:00:00Z", hits: [] }, as: SearchAnalyst }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000, supporting_search_id: "${sid}" }, as: FilingSpecialist, captures: { rid: $.data.id } }
          trigger:
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REQUEST_INVALID_STATE (not ERR_SEARCH_STALE)"
            - "FilingRequest.${rid}.status == DRAFT_INTAKE (unchanged)"

      - name: safety_vs_fiscal_on_attempt_submit
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_DEBTOR_NAME_SERIOUSLY_MISLEADING]
          - errors[ERR_FEE_AUTHORIZATION_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_safety x business_fiscal: the attempt's debtor
          name is seriously misleading AND the charged fee (10000) exceeds the
          5000 authorization — the safety error must win over the fiscal one.
        test_recipe:
          setup:
            - "READY NEW_UCC1 request with fee_authorization_cents 5000 (< any CA fee); DRAFT attempt carries a misleading debtor name 'Acme Mfg, Inc.'"
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 5000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${rid}/attempts", payload: { debtor_name_on_filing: "Acme Mfg, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way", secured_amount_cents: 500000 }, as: FilingSpecialist, captures: { fid: $.data.id } }
          trigger:
            - { call: "POST /filings/${fid}/submit", payload: {}, as: FilingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DEBTOR_NAME_SERIOUSLY_MISLEADING (not ERR_FEE_AUTHORIZATION_EXCEEDED)"
            - "UCCFiling.${fid}.effectiveness_status == DRAFT (no fee was locked)"
            - "UCCFiling.${fid}.charged_fee_cents == null"

  # ---------------------------------------------------------------- rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: continuation_window_open_inclusive
        grounds:
          - calculations.expiration_computation
          - errors[ERR_CONTINUATION_OUTSIDE_WINDOW]
          - "endpoints[POST /filings/{id}/record-acceptance]"
        distinguishing_aspect: |
          Time-metric boundary on the continuation window's lower edge: filed_at
          exactly == expiration - 6 months (2030-09-10T00:00:00Z) is INSIDE the
          window (inclusive >=), while one second earlier is rejected — the
          >= vs > distinction decides acceptance.
        test_recipe:
          setup:
            - "Two roots for different debtors, both filed 2026-03-10 (expiration 2031-03-10T00:00:00Z); clock at 2030-09-09 for submission, then 2030-09-10 for acceptance"
            - "Each root has a SUBMITTED continuation attempt"
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did1: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Beta Holdings, LLC", jurisdiction_of_formation: "CA" }, as: ClientManager, as_user_id: "${cid}", captures: { did2: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-10T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did1}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { ra: $.data.id } }
            - { call: "POST /filing-requests/${ra}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${ra}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${ra}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way" }, as: FilingSpecialist, captures: { fa: $.data.id } }
            - { call: "POST /filings/${fa}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /filings/${fa}/record-acceptance", payload: { filing_number: "CA-2026-0001", filed_at: "2026-03-10T00:00:00Z" }, as: FilingOfficer }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did2}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rb: $.data.id } }
            - { call: "POST /filing-requests/${rb}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${rb}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${rb}/attempts", payload: { debtor_name_on_filing: "Beta Holdings, LLC", collateral_text: "All manufacturing equipment located at 100 Industrial Way" }, as: FilingSpecialist, captures: { fb: $.data.id } }
            - { call: "POST /filings/${fb}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /filings/${fb}/record-acceptance", payload: { filing_number: "CA-2026-0002", filed_at: "2026-03-10T00:00:00Z" }, as: FilingOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2030-09-09T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /filings/${fa}", as: PlatformAdmin, captures: { fav: $.data.version } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "CONTINUATION", debtor_id: "${did1}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000, target_filing_id: "${fa}", expected_target_filing_version: "${fav}" }, as: FilingSpecialist, captures: { cra: $.data.id } }
            - { call: "POST /filing-requests/${cra}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${cra}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${cra}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc." }, as: FilingSpecialist, captures: { cfa: $.data.id } }
            - { call: "POST /filings/${cfa}/submit", payload: {}, as: FilingSpecialist }
            - { call: "GET /filings/${fb}", as: PlatformAdmin, captures: { fbv: $.data.version } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "CONTINUATION", debtor_id: "${did2}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000, target_filing_id: "${fb}", expected_target_filing_version: "${fbv}" }, as: FilingSpecialist, captures: { crb: $.data.id } }
            - { call: "POST /filing-requests/${crb}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${crb}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${crb}/attempts", payload: { debtor_name_on_filing: "Beta Holdings, LLC" }, as: FilingSpecialist, captures: { cfb: $.data.id } }
            - { call: "POST /filings/${cfb}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2030-09-10T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /filings/${cfa}/record-acceptance", payload: { filing_number: "CA-2030-9001", filed_at: "2030-09-10T00:00:00Z" }, as: FilingOfficer, captures: { ok_exp_root: $.data.id } }
            - { call: "POST /filings/${cfb}/record-acceptance", payload: { filing_number: "CA-2030-9002", filed_at: "2030-09-09T23:59:59Z" }, as: FilingOfficer, captures: { err: $.data.error_id } }
          assert:
            - "Continuation A accepted: UCCFiling.${cfa}.effectiveness_status == ACTIVE"
            - "UCCFiling.${fa}.expiration_at == 2036-03-10T00:00:00Z"
            - "Continuation B rejected: error_id == ERR_CONTINUATION_OUTSIDE_WINDOW (one second before window open)"
            - "UCCFiling.${cfb}.effectiveness_status == SUBMITTED (rejection leaves attempt in place)"
            - "UCCFiling.${fb}.expiration_at == 2031-03-10T00:00:00Z (unchanged)"

      - name: fee_debtor_count_tier_zero_vs_one
        grounds:
          - calculations.filing_fee
          - entities.FilingRequest.fields.additional_debtor_count
          - "endpoints[POST /filing-requests/{id}/approve-preparation]"
        distinguishing_aspect: |
          Count-metric boundary on a different endpoint (approve-preparation, not
          acceptance): additional_debtor_count == 0 yields NO per-debtor surcharge
          (quote 10000) while == 1 adds exactly one surcharge (quote 11500) — the
          max(0, count) tier edge at the first additional debtor.
        test_recipe:
          setup:
            - "CA profile; two NEW_UCC1 GENERAL STANDARD requests differ only in additional_debtor_count (0 vs 1); both taken through intake"
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { r0: $.data.id } }
            - { call: "POST /filing-requests/${r0}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", additional_debtor_count: 1, fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { r1: $.data.id } }
            - { call: "POST /filing-requests/${r1}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
          trigger:
            - { call: "POST /filing-requests/${r0}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1", captures: { q0: $.data.quoted_fee_cents } }
            - { call: "POST /filing-requests/${r1}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1", captures: { q1: $.data.quoted_fee_cents } }
          assert:
            - "FilingRequest.${r0}.quoted_fee_cents == 10000 (count 0: no surcharge)"
            - "FilingRequest.${r1}.quoted_fee_cents == 11500 (count 1: exactly one 1500 surcharge)"
            - "FilingRequest.${r0}.additional_debtor_count == 0 (default applied)"

      - name: priority_position_empty_competing_set_is_one
        grounds:
          - calculations.priority_position
          - entities.LienSearch.fields.priority_position_of_subject
          - "endpoints[POST /lien-searches/{id}/record-results]"
        distinguishing_aspect: |
          Empty-set boundary on a third endpoint (record-results): the verification
          search returns exactly one hit — the subject itself — so the competing set
          is empty and the position must be exactly 1 (not null, not 0).
        test_recipe:
          setup:
            - "Root INITIAL ACTIVE (filed 2026-08-01, number CA-2026-0100); verification search ordered against it"
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${rid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way" }, as: FilingSpecialist, captures: { fid: $.data.id } }
            - { call: "POST /filings/${fid}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /filings/${fid}/record-acceptance", payload: { filing_number: "CA-2026-0100", filed_at: "2026-08-01T00:00:00Z" }, as: FilingOfficer }
            - { call: "POST /lien-searches", payload: { client_id: "${cid}", purpose: "POST_FILING_VERIFICATION", debtor_id: "${did}", jurisdiction_code: "CA", subject_filing_id: "${fid}" }, as: FilingSpecialist, captures: { sid: $.data.id } }
          trigger:
            - { call: "POST /lien-searches/${sid}/record-results", payload: { through_date: "2026-08-01T00:00:00Z", hits: [ { found_debtor_name: "Acme Manufacturing, Inc.", found_filing_number: "CA-2026-0100", found_filed_at: "2026-08-01T00:00:00Z", secured_party_name: "Acme Lending" } ] }, as: SearchAnalyst, captures: { pos: $.data.priority_position_of_subject, st: $.data.status } }
          assert:
            - "LienSearch.${sid}.status == VERIFIED"
            - "LienSearch.${sid}.priority_position_of_subject == 1"
            - "UCCFiling.${fid}.reflection_status == REFLECTED"

  # ---------------------------------------------------------------- rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: attempt_create_requires_request_ready
        grounds:
          - state_machines.UCCFiling.DRAFT_to_SUBMITTED
          - validations[priority=7]
          - errors[ERR_REQUEST_NOT_READY]
        distinguishing_aspect: |
          Pair UCCFiling x FilingRequest: an attempt cannot be created while the
          parent request is merely IN_REVIEW (intake submitted but never approved)
          — the child entity's creation gate reads the parent's state.
        test_recipe:
          setup:
            - "NEW_UCC1 request taken to IN_REVIEW only (submit-intake done, approve-preparation not called)"
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
          trigger:
            - { call: "POST /filing-requests/${rid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way" }, as: FilingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REQUEST_NOT_READY"
            - "FilingRequest.${rid}.status == IN_REVIEW (unchanged)"

      - name: verification_search_requires_subject_active
        grounds:
          - state_machines.LienSearch
          - errors[ERR_TARGET_FILING_NOT_ACTIVE]
          - entities.LienSearch.fields.subject_filing_id
        distinguishing_aspect: |
          Pair LienSearch x UCCFiling (a different pair than request x attempt):
          a POST_FILING_VERIFICATION search cannot be ordered against a filing whose
          effectiveness is REJECTED — search creation reads the filing's state.
        test_recipe:
          setup:
            - "Attempt under a NEW_UCC1 request was submitted then REJECTED by the office (terminal, never ACTIVE)"
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${rid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way" }, as: FilingSpecialist, captures: { fid: $.data.id } }
            - { call: "POST /filings/${fid}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /filings/${fid}/record-rejection", payload: { rejection_reason_code: "MISSING_SIGNATURE" }, as: FilingOfficer }
          trigger:
            - { call: "POST /lien-searches", payload: { client_id: "${cid}", purpose: "POST_FILING_VERIFICATION", debtor_id: "${did}", jurisdiction_code: "CA", subject_filing_id: "${fid}" }, as: FilingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TARGET_FILING_NOT_ACTIVE"
            - "UCCFiling.${fid}.effectiveness_status == REJECTED (unchanged)"

      - name: intake_requires_client_active
        grounds:
          - state_machines.FilingRequest.DRAFT_INTAKE_to_IN_REVIEW
          - state_machines.ClientAccount.ACTIVE_to_SUSPENDED
          - errors[ERR_CLIENT_SUSPENDED]
        distinguishing_aspect: |
          Pair FilingRequest x ClientAccount (third distinct pair): submit-intake
          is gated on the parent client's status — a SUSPENDED client's request
          cannot enter review even though the request itself is well-formed.
        test_recipe:
          setup:
            - "Client with a DRAFT_INTAKE NEW_UCC1 request; client then suspended"
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/suspend", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLIENT_SUSPENDED"
            - "FilingRequest.${rid}.status == DRAFT_INTAKE (unchanged)"

  # ---------------------------------------------------------------- rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: perfection_slot_overlap_half_open_with_truncation
        grounds:
          - state_machines.UCCFiling.SUBMITTED_to_ACTIVE
          - errors[ERR_OVERLAPPING_ACTIVE_FILING]
          - entities.UCCFiling.fields.expiration_at
        distinguishing_aspect: |
          Interval semantics: half-open effectiveness interval [filed_at,
          expiration_at) on the (debtor, jurisdiction, office) perfection slot of
          entity UCCFiling — a second INITIAL acceptance overlaps and is rejected,
          but TERMINATION truncates the interval early, so the SAME acceptance
          retried afterwards succeeds. Adjacency (filed exactly at the prior
          expiration) is allowed because the prior filing is already LAPSED.
        test_recipe:
          setup:
            - "Root X ACTIVE for debtor D in CA/STATE (filed 2026-08-01, number CA-2026-0001)"
            - "Second INITIAL attempt for the same debtor/jurisdiction/office submitted (acceptance not yet recorded)"
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { r1: $.data.id } }
            - { call: "POST /filing-requests/${r1}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${r1}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${r1}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way", secured_amount_cents: 500000 }, as: FilingSpecialist, captures: { f1: $.data.id } }
            - { call: "POST /filings/${f1}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /filings/${f1}/record-acceptance", payload: { filing_number: "CA-2026-0001", filed_at: "2026-08-01T00:00:00Z" }, as: FilingOfficer }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { r2: $.data.id } }
            - { call: "POST /filing-requests/${r2}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${r2}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${r2}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All inventory and equipment of debtor" }, as: FilingSpecialist, captures: { f2: $.data.id } }
            - { call: "POST /filings/${f2}/submit", payload: {}, as: FilingSpecialist }
          trigger:
            - { call: "POST /filings/${f2}/record-acceptance", payload: { filing_number: "CA-2026-0002", filed_at: "2026-08-01T00:00:00Z" }, as: FilingOfficer, captures: { err: $.data.error_id } }
            - { call: "GET /filings/${f1}", as: PlatformAdmin, captures: { f1v: $.data.version } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "TERMINATION", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000, target_filing_id: "${f1}", expected_target_filing_version: "${f1v}" }, as: FilingSpecialist, captures: { trid: $.data.id } }
            - { call: "POST /filing-requests/${trid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${trid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${trid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc." }, as: FilingSpecialist, captures: { tf: $.data.id } }
            - { call: "POST /filings/${tf}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /filings/${tf}/record-acceptance", payload: { filing_number: "CA-2026-0009", filed_at: "2026-08-01T00:00:00Z" }, as: FilingOfficer }
            - { call: "POST /filings/${f2}/record-acceptance", payload: { filing_number: "CA-2026-0002", filed_at: "2026-08-01T00:00:00Z" }, as: FilingOfficer }
          assert:
            - "First acceptance of ${f2} failed with error_id == ERR_OVERLAPPING_ACTIVE_FILING"
            - "UCCFiling.${f1}.effectiveness_status == TERMINATED (interval truncated)"
            - "Retry after truncation: UCCFiling.${f2}.effectiveness_status == ACTIVE"
            - "UCCFiling.${f2}.filing_number == CA-2026-0002"

      - name: expedited_daily_capacity_bucket_reset
        grounds:
          - validations[priority=10]
          - errors[ERR_EXPEDITED_CAPACITY_REACHED]
          - entities.JurisdictionProfile.fields.expedited_daily_capacity
        distinguishing_aspect: |
          Different interval semantics AND different resource: not pairwise
          half-open overlap on UCCFiling but aggregate capacity over a UTC-day
          bucket on JurisdictionProfile — the third EXPEDITED submission on
          2026-08-01 exceeds capacity 2 and is rejected; moving the clock to
          2026-08-02 opens a fresh bucket and the same attempt submits.
        test_recipe:
          setup:
            - "CA profile expedited_daily_capacity == 2; three READY EXPEDITED requests each with a DRAFT attempt (same client and debtor)"
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", service_level: "EXPEDITED", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { r1: $.data.id } }
            - { call: "POST /filing-requests/${r1}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${r1}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${r1}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way" }, as: FilingSpecialist, captures: { a1: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", service_level: "EXPEDITED", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { r2: $.data.id } }
            - { call: "POST /filing-requests/${r2}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${r2}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${r2}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way" }, as: FilingSpecialist, captures: { a2: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", service_level: "EXPEDITED", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { r3: $.data.id } }
            - { call: "POST /filing-requests/${r3}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${r3}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${r3}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way" }, as: FilingSpecialist, captures: { a3: $.data.id } }
            - { call: "POST /filings/${a1}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /filings/${a2}/submit", payload: {}, as: FilingSpecialist }
          trigger:
            - { call: "POST /filings/${a3}/submit", payload: {}, as: FilingSpecialist, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /filings/${a3}/submit", payload: {}, as: FilingSpecialist }
          assert:
            - "Third same-day EXPEDITED submit failed with error_id == ERR_EXPEDITED_CAPACITY_REACHED"
            - "After clock moves to 2026-08-02: UCCFiling.${a3}.effectiveness_status == SUBMITTED"
            - "UCCFiling.${a3}.charged_fee_cents == 15000 (10000 * 1.5, locked only on the successful submit)"
            - "UCCFiling.${a1}.effectiveness_status == SUBMITTED"
            - "UCCFiling.${a2}.effectiveness_status == SUBMITTED"

  # ---------------------------------------------------------------- rule 9
  - rule_id: compensating_invariant
    instances:
      - name: fee_charge_refund_net_exposure_conserved
        grounds:
          - state_machines.UCCFiling.DRAFT_to_SUBMITTED
          - state_machines.UCCFiling.SUBMITTED_to_REJECTED
          - entities.ClientAccount.fields.fees_charged_total_cents
          - entities.ClientAccount.fields.fees_refunded_total_cents
        distinguishing_aspect: |
          Conserved quantity = net fee exposure (money):
          fees_charged_total_cents - fees_refunded_total_cents must equal the sum of
          charged_fee_cents over attempts in SUBMITTED or ACTIVE; the submit
          (debit) + reject (refund) pair returns the client's net exposure to its
          pre-submit value of exactly 0.
        test_recipe:
          setup:
            - "Client ledger starts at charged 0 / refunded 0; a READY request with a DRAFT attempt exists (STANDARD CA GENERAL, fee 10000)"
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${rid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way" }, as: FilingSpecialist, captures: { fid: $.data.id } }
          trigger:
            - { call: "POST /filings/${fid}/submit", payload: {}, as: FilingSpecialist }
            - { call: "GET /client-accounts/${cid}", as: PlatformAdmin, captures: { chg_mid: $.data.fees_charged_total_cents, ref_mid: $.data.fees_refunded_total_cents } }
            - { call: "POST /filings/${fid}/record-rejection", payload: { rejection_reason_code: "FEE_INCORRECT" }, as: FilingOfficer }
            - { call: "GET /client-accounts/${cid}", as: PlatformAdmin, captures: { chg_end: $.data.fees_charged_total_cents, ref_end: $.data.fees_refunded_total_cents } }
          assert:
            - "After submit: ClientAccount.${cid}.fees_charged_total_cents == 10000 and fees_refunded_total_cents == 0 (net exposure 10000)"
            - "After reject: fees_charged_total_cents == 10000 and fees_refunded_total_cents == 10000 (net exposure back to 0)"
            - "net = charged - refunded == 0 at the end, identical to the pre-submit value"
            - "UCCFiling.${fid}.effectiveness_status == REJECTED"

      - name: open_ucc3_request_count_conserved
        grounds:
          - entities.UCCFiling.fields.open_ucc3_request_count
          - state_machines.FilingRequest.DRAFT_INTAKE_to_CANCELLED
          - concurrency_rules[ucc3-create-stale-target]
        distinguishing_aspect: |
          Conserved quantity = open UCC-3 request ledger (count, not money):
          root.open_ucc3_request_count must equal the number of requests with
          target_filing_id == root in non-terminal states; the create (+1) /
          cancel (-1) pair returns it to 0, and each mutation bumps root.version.
        test_recipe:
          setup:
            - "Root INITIAL ACTIVE (filed 2026-08-01); its version observed before any UCC-3 activity"
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${rid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way" }, as: FilingSpecialist, captures: { fid: $.data.id } }
            - { call: "POST /filings/${fid}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /filings/${fid}/record-acceptance", payload: { filing_number: "CA-2026-0001", filed_at: "2026-08-01T00:00:00Z" }, as: FilingOfficer }
            - { call: "GET /filings/${fid}", as: PlatformAdmin, captures: { v0: $.data.version, cnt0: $.data.open_ucc3_request_count } }
          trigger:
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "AMENDMENT", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000, target_filing_id: "${fid}", expected_target_filing_version: "${v0}" }, as: FilingSpecialist, captures: { arid: $.data.id } }
            - { call: "GET /filings/${fid}", as: PlatformAdmin, captures: { v1: $.data.version, cnt1: $.data.open_ucc3_request_count } }
            - { call: "POST /filing-requests/${arid}/cancel", payload: {}, as: FilingSpecialist }
            - { call: "GET /filings/${fid}", as: PlatformAdmin, captures: { v2: $.data.version, cnt2: $.data.open_ucc3_request_count } }
          assert:
            - "Before any UCC-3: open_ucc3_request_count == 0"
            - "After AMENDMENT request creation: open_ucc3_request_count == 1 and version == v0 + 1"
            - "After cancellation: open_ucc3_request_count == 0 (conserved) and version == v0 + 2"
            - "FilingRequest.${arid}.status == CANCELLED"
            - "FilingRequest.${arid}.cancel_reason == CLIENT_REQUEST"
