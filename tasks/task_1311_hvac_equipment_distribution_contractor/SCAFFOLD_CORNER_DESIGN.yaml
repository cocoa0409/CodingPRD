  # =========================================================================
  # Section: endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: order_patch_occ_stale_version_conflict
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[order-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH /orders/{id} with a stale expected_order_version fails 412 ERR_STALE_VERSION; the current version succeeds and bumps version by 1."
        test_recipe:
          setup: ["contractor C-O; DRAFT order O-O at version 2 (create=1, one line add=2)"]
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Occ Co", license_number: "LIC-C500" }
              as: DistributorAdmin
              captures: { co_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-O500", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-Y8", list_price_cents: 500000 }
              as: DistributorAdmin
              captures: { mo_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${co_id}" }
              as: ContractorUser
              as_user_id: "${co_id}"
              captures: { oo_id: $.data.id, oo_v1: $.data.version }
            - call: "POST /api/v1/orders/${oo_id}/lines"
              payload: { equipment_model_id: "${mo_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${co_id}"
            - call: "GET /api/v1/orders/${oo_id}"
              payload: {}
              as: ContractorUser
              as_user_id: "${co_id}"
              captures: { oo_v2: $.data.version }
          trigger:
            - call: "PATCH /api/v1/orders/${oo_id}"
              payload: { expected_order_version: "${oo_v1}" }
              as: ContractorUser
              as_user_id: "${co_id}"
              captures: { e: $.data.error_id }
            - call: "PATCH /api/v1/orders/${oo_id}"
              payload: { expected_order_version: "${oo_v2}" }
              as: ContractorUser
              as_user_id: "${co_id}"
          assert:
            - "first PATCH error_id == ERR_STALE_VERSION (http 412): expected ${oo_v1} but version advanced when the line was added"
            - "second PATCH succeeds and Order.${oo_id}.version == ${oo_v2} + 1"

      - name: rebate_patch_occ_stale_version_conflict
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[rebate-docs-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH /rebate-submissions/{id} with expected_rebate_version one behind current fails 412; current version succeeds and union-adds docs."
        test_recipe:
          setup: ["DRAFT rebate RB-O at version 1 on a DELIVERED order with PREMIUM rating"]
