scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: resale_formula_appraisal_vs_indexed_diverge
        grounds:
          - calculations.resale_formula
          - entities.ResaleListing.fields.asking_price_cents
          - entities.ResaleListing.fields.subsidy_retained_cents
          - entities.CLTProgram.fields.resale_formula_kind
        distinguishing_aspect: |
          Same seller inputs (P0=20000000, A0=25000000, A1=35000000, Y=10) produce different
          asking_price_cents and subsidy_retained_cents depending on whether the program is
          APPRAISAL_BASED (asking=22500000, retained=12500000) or INDEXED (asking=23000000,
          retained=17000000). The domain is ResaleListing pricing on a Unit.
        test_recipe:
          setup:
            - "Two programs, one with resale_formula_kind=APPRAISAL_BASED, one INDEXED"
            - "Each program has identical unit economics: seller_lease.purchase_price_cents=20000000, original_subsidy=5000000, A0=25000000 (captured on seller lease start), A1=35000000"
            - "Lease started exactly 10 years before listing (via /_clock/set_current_utc)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P-APPR", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "APPRAISAL_BASED", appraisal_seller_share_pct: 0.25, indexed_annual_appreciation_pct: 0.015 }
              as: PlatformAdmin
              captures: { prog_a: $.data.id }
            - call: "POST /programs"
              payload: { name: "P-INDX", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED", appraisal_seller_share_pct: 0.25, indexed_annual_appreciation_pct: 0.015 }
              as: PlatformAdmin
              captures: { prog_i: $.data.id }
            - call: "POST /programs/${prog_a}/units"
              payload: { address: "1 A St", bedrooms: 3, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit_a: $.data.id }
            - call: "POST /programs/${prog_i}/units"
              payload: { address: "1 I St", bedrooms: 3, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit_i: $.data.id }
            - call: "POST /programs/${prog_a}/households"
              payload: { legal_name: "Seller A", household_size: 4, annual_gross_income_cents: 7000000 }
              as: IntakeSpecialist
              captures: { hh_a: $.data.id }
            - call: "POST /programs/${prog_i}/households"
              payload: { legal_name: "Seller I", household_size: 4, annual_gross_income_cents: 7000000 }
              as: IntakeSpecialist
              captures: { hh_i: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2016-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /programs/${prog_a}/units/${unit_a}/leases"
              payload: { household_id: "${hh_a}", start_date: "2016-05-01T00:00:00Z", purchase_price_cents: 20000000 }
              as: LeaseManager
              captures: { lease_a: $.data.id }
            - call: "POST /programs/${prog_i}/units/${unit_i}/leases"
              payload: { household_id: "${hh_i}", start_date: "2016-05-01T00:00:00Z", purchase_price_cents: 20000000 }
              as: LeaseManager
              captures: { lease_i: $.data.id }
            # Bypass full activation for setup purposes — open resale listing directly via LeaseManager
            # by using resale-listings against the draft lease is not permitted; instead activate first.
            # For this test we need only listing inputs, so we fake activation by direct seeding via activate endpoint with OCC.
            - call: "GET /programs/${prog_a}/units/${unit_a}"
              as: LeaseManager
              captures: { unit_a_v: $.data.version }
            - call: "GET /programs/${prog_i}/units/${unit_i}"
              as: LeaseManager
              captures: { unit_i_v: $.data.version }
            # Skipping lease activation in setup since activate requires eligibility; instead, create resale listing directly against the DRAFT lease (still accepted because seller_lease_id resolves)
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /programs/${prog_a}/units/${unit_a}/resale-listings"
              payload: { seller_lease_id: "${lease_a}", appraisal_at_listing_cents: 35000000 }
              as: LeaseManager
              captures: { listing_a: $.data.id, ask_a: $.data.asking_price_cents, retained_a: $.data.subsidy_retained_cents }
            - call: "POST /programs/${prog_i}/units/${unit_i}/resale-listings"
              payload: { seller_lease_id: "${lease_i}", appraisal_at_listing_cents: 35000000 }
              as: LeaseManager
              captures: { listing_i: $.data.id, ask_i: $.data.asking_price_cents, retained_i: $.data.subsidy_retained_cents }
          assert:
            - "ResaleListing.${listing_a}.asking_price_cents == 22500000"
            - "ResaleListing.${listing_a}.subsidy_retained_cents == 12500000"
            - "ResaleListing.${listing_i}.asking_price_cents == 23000000"
            - "ResaleListing.${listing_i}.subsidy_retained_cents == 17000000"
            - "ResaleListing.${listing_a}.asking_price_cents != ResaleListing.${listing_i}.asking_price_cents"

      - name: lease_fee_tier_low_income_vs_middle_boundary
        grounds:
          - calculations.lease_fee_tier
          - entities.GroundLease.fields.monthly_fee_cents
          - entities.Household.fields.ami_pct
        distinguishing_aspect: |
          Two valid fee computations produce different monthly_fee_cents on identical base fee
          depending on whether the household AMI sits in the LOW_INCOME tier (<=0.50) or the
          MIDDLE tier (0.50 < ami <= 0.80). The domain is GroundLease monthly_fee_cents (a
          different entity domain from ResaleListing pricing).
        test_recipe:
          setup:
            - "One program with ground_lease_base_fee_cents=50000 and low_income_fee_reduction_pct=0.5"
            - "Two households H_low with ami_pct=0.50 and H_mid with ami_pct=0.70, both ELIGIBLE"
            - "Each household has a DRAFT lease on its own VACANT unit"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P1", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, low_income_fee_reduction_pct: 0.5, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/units"
              payload: { address: "1 L St", bedrooms: 2, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit_l: $.data.id }
            - call: "POST /programs/${prog}/units"
              payload: { address: "1 M St", bedrooms: 2, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit_m: $.data.id }
            # H_low household with size 4 and income exactly 50% AMI: 10000000 * 1.00 * 0.50 = 5000000 cents
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "H Low", household_size: 4, annual_gross_income_cents: 5000000 }
              as: IntakeSpecialist
              captures: { hh_l: $.data.id }
            # H_mid: income 70% AMI = 7000000 cents
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "H Mid", household_size: 4, annual_gross_income_cents: 7000000 }
              as: IntakeSpecialist
              captures: { hh_m: $.data.id }
            # Certify both via intake-specialist submission + compliance-officer approval
            - call: "POST /programs/${prog}/households/${hh_l}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 5000000, verified_annual_income_cents: 5000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { cert_l: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_l}/income-certifications/${cert_l}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh_l}/income-certifications/${cert_l}/approve"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh_m}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 7000000, verified_annual_income_cents: 7000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { cert_m: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_m}/income-certifications/${cert_m}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh_m}/income-certifications/${cert_m}/approve"
              as: ComplianceOfficer
            # Required education course + completions
            - call: "POST /programs/${prog}/education-courses"
              payload: { code: "HOME-101", title: "Homebuyer Basics", credit_hours: 8, is_required: true, validity_months: 24 }
              as: ProgramAdmin
              captures: { course: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_l}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-04-01T00:00:00Z", score_pct: 0.85 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/households/${hh_m}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-04-01T00:00:00Z", score_pct: 0.85 }
              as: IntakeSpecialist
            # Draft leases on each unit
            - call: "POST /programs/${prog}/units/${unit_l}/leases"
              payload: { household_id: "${hh_l}", start_date: "2026-05-01T00:00:00Z", purchase_price_cents: 20000000 }
              as: LeaseManager
              captures: { lease_l: $.data.id }
            - call: "POST /programs/${prog}/units/${unit_m}/leases"
              payload: { household_id: "${hh_m}", start_date: "2026-05-01T00:00:00Z", purchase_price_cents: 20000000 }
              as: LeaseManager
              captures: { lease_m: $.data.id }
            - call: "GET /programs/${prog}/units/${unit_l}"
              as: LeaseManager
              captures: { unit_l_v: $.data.version }
            - call: "GET /programs/${prog}/units/${unit_m}"
              as: LeaseManager
              captures: { unit_m_v: $.data.version }
          trigger:
            - call: "POST /programs/${prog}/units/${unit_l}/leases/${lease_l}/activate"
              payload: { expected_unit_version: "${unit_l_v}" }
              as: LeaseManager
              captures: { fee_l: $.data.monthly_fee_cents }
            - call: "POST /programs/${prog}/units/${unit_m}/leases/${lease_m}/activate"
              payload: { expected_unit_version: "${unit_m_v}" }
              as: LeaseManager
              captures: { fee_m: $.data.monthly_fee_cents }
          assert:
            - "GroundLease.${lease_l}.monthly_fee_cents == 25000"
            - "GroundLease.${lease_m}.monthly_fee_cents == 41667"
            - "GroundLease.${lease_l}.monthly_fee_cents != GroundLease.${lease_m}.monthly_fee_cents"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_multi_input_nonlinear
        grounds:
          - calculations.priority_score_calc
          - entities.WaitlistEntry.fields.priority_score
        distinguishing_aspect: |
          Mode (a) — multi-input non-linear formula: priority_score = (1-ami_pct)*1000 +
          min(wait_age_days, 365) + size_match_bonus. The size_match bonus is conditional on
          |bedrooms - household_size| <= 1 (evaluated at match time), introducing a nested
          conditional branch. Three inputs interact non-linearly: ami_pct (continuous),
          wait_age_days (capped), and a boolean conditional bonus.
        test_recipe:
          setup:
            - "Program with two households queued on the waitlist"
            - "H_young: ami_pct=0.60, joined 30 days ago, household_size=4"
            - "H_old:   ami_pct=0.60, joined 400 days ago, household_size=4 (age capped at 365)"
            - "Listing unit has 3 bedrooms (|3-4|=1, both get size_match bonus)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P2", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/units"
              payload: { address: "1 X St", bedrooms: 3, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit: $.data.id }
            # Seller household + lease so listing can exist
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "Seller", household_size: 4, annual_gross_income_cents: 7000000 }
              as: IntakeSpecialist
              captures: { hh_s: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_s}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 7000000, verified_annual_income_cents: 7000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { cert_s: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_s}/income-certifications/${cert_s}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh_s}/income-certifications/${cert_s}/approve"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/education-courses"
              payload: { code: "H101", title: "Basics", credit_hours: 8, is_required: true, validity_months: 24 }
              as: ProgramAdmin
              captures: { course: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_s}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-04-01T00:00:00Z", score_pct: 0.85 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/units/${unit}/leases"
              payload: { household_id: "${hh_s}", start_date: "2020-05-01T00:00:00Z", purchase_price_cents: 20000000 }
              as: LeaseManager
              captures: { lease_s: $.data.id }
            - call: "GET /programs/${prog}/units/${unit}"
              as: LeaseManager
              captures: { unit_v: $.data.version }
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease_s}/activate"
              payload: { expected_unit_version: "${unit_v}" }
              as: LeaseManager
            # H_young: created 30 days ago
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "H Young", household_size: 4, annual_gross_income_cents: 6000000 }
              as: IntakeSpecialist
              captures: { hh_y: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_y}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 6000000, verified_annual_income_cents: 6000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { cert_y: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_y}/income-certifications/${cert_y}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh_y}/income-certifications/${cert_y}/approve"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh_y}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-04-01T00:00:00Z", score_pct: 0.9 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/households/${hh_y}/waitlist-entries"
              payload: { desired_bedrooms: 3, max_price_cents: 50000000 }
              as: IntakeSpecialist
              captures: { entry_y: $.data.id, score_y: $.data.priority_score }
            # H_old: created 400 days ago
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-03-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "H Old", household_size: 4, annual_gross_income_cents: 6000000 }
              as: IntakeSpecialist
              captures: { hh_o: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_o}/income-certifications"
              payload: { tax_year: 2024, reported_annual_income_cents: 6000000, verified_annual_income_cents: 6000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { cert_o: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_o}/income-certifications/${cert_o}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh_o}/income-certifications/${cert_o}/approve"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh_o}/education-completions"
              payload: { course_id: "${course}", completed_at: "2025-03-28T00:00:00Z", score_pct: 0.9 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/households/${hh_o}/waitlist-entries"
              payload: { desired_bedrooms: 3, max_price_cents: 50000000 }
              as: IntakeSpecialist
              captures: { entry_o: $.data.id, score_o: $.data.priority_score }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            # Create resale listing now (seller lease is active, unit occupied)
            - call: "POST /programs/${prog}/units/${unit}/resale-listings"
              payload: { seller_lease_id: "${lease_s}", appraisal_at_listing_cents: 25000000 }
              as: LeaseManager
              captures: { listing: $.data.id }
            - call: "GET /programs/${prog}/units/${unit}/resale-listings/${listing}"
              as: LeaseManager
              captures: { listing_v: $.data.version }
          trigger:
            - call: "POST /programs/${prog}/units/${unit}/resale-listings/${listing}/run-matching"
              payload: { expected_listing_version: "${listing_v}" }
              as: LeaseManager
          assert:
            # At creation (H_young at 2026-04-01): need_score=round(0.4*1000)=400, age_score=0, no size bonus at creation
            - "WaitlistEntry.${entry_y}.priority_score == 400"
            # At creation (H_old at 2025-03-28): need_score=400, age_score=0
            - "WaitlistEntry.${entry_o}.priority_score == 400"
            # At match time (2026-05-01): H_young age=30, H_old age=399 (capped 365) — scores diverge
            - "ResaleListing.${listing}.matched_waitlist_entry_id == \"${entry_o}\""
            # H_old effective = 400 + 365 + 50 = 815; H_young effective = 400 + 30 + 50 = 480

      - name: resale_formula_nested_min_max_branching
        grounds:
          - calculations.resale_formula
          - entities.ResaleListing.fields.asking_price_cents
        distinguishing_aspect: |
          Mode (a) tiered conditional branch combined with nested min/max: asking_price under
          INDEXED variant = min(round_half_up(P0 * (1 + r*Y)), A1). When indexed_value > A1,
          the min() caps the asking price; when indexed_value < A1, the indexed value wins.
          Two structurally different outcomes from one formula.
        test_recipe:
          setup:
            - "Program with INDEXED formula, r=0.015, seller lease started 30 years ago"
            - "P0=20000000; Y=30; indexed_value = round(20000000 * 1.45) = 29000000"
            - "Case A: A1=35000000 (above cap) → asking=29000000 (indexed wins)"
            - "Case B: A1=25000000 (below cap) → asking=25000000 (min caps)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P3", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED", indexed_annual_appreciation_pct: 0.015 }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/units"
              payload: { address: "1 A St", bedrooms: 3, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit_a: $.data.id }
            - call: "POST /programs/${prog}/units"
              payload: { address: "1 B St", bedrooms: 3, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit_b: $.data.id }
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "Seller", household_size: 4, annual_gross_income_cents: 7000000 }
              as: IntakeSpecialist
              captures: { hh_s: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_s}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 7000000, verified_annual_income_cents: 7000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { cert_s: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_s}/income-certifications/${cert_s}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh_s}/income-certifications/${cert_s}/approve"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/education-courses"
              payload: { code: "H101", title: "Basics", credit_hours: 8, is_required: true, validity_months: 24 }
              as: ProgramAdmin
              captures: { course: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_s}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-04-01T00:00:00Z", score_pct: 0.85 }
              as: IntakeSpecialist
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "1996-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /programs/${prog}/units/${unit_a}/leases"
              payload: { household_id: "${hh_s}", start_date: "1996-05-01T00:00:00Z", purchase_price_cents: 20000000 }
              as: LeaseManager
              captures: { lease_a: $.data.id }
            - call: "POST /programs/${prog}/units/${unit_b}/leases"
              payload: { household_id: "${hh_s}", start_date: "1996-05-01T00:00:00Z", purchase_price_cents: 20000000 }
              as: LeaseManager
              captures: { lease_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /programs/${prog}/units/${unit_a}/resale-listings"
              payload: { seller_lease_id: "${lease_a}", appraisal_at_listing_cents: 35000000 }
              as: LeaseManager
              captures: { listing_a: $.data.id }
            - call: "POST /programs/${prog}/units/${unit_b}/resale-listings"
              payload: { seller_lease_id: "${lease_b}", appraisal_at_listing_cents: 25000000 }
              as: LeaseManager
              captures: { listing_b: $.data.id }
          assert:
            # indexed = round(20000000 * 1.45) = 29000000
            - "ResaleListing.${listing_a}.asking_price_cents == 29000000"
            - "ResaleListing.${listing_b}.asking_price_cents == 25000000"
            - "ResaleListing.${listing_a}.subsidy_retained_cents == 5000000 + (35000000 - 29000000)"

      - name: ami_pct_size_adjustment_tiered_lookup
        grounds:
          - calculations.ami_pct_calc
          - entities.IncomeCertification.fields.ami_pct_at_cert
        distinguishing_aspect: |
          Mode (a) — tiered size_adjustment lookup with 8 branches (household_size 1..8+) is a
          combinatorial formula: same income yields different ami_pct depending on which tier
          the size falls into. A size-1 household at 5000000 cents AMI=0.7143; a size-4 household
          at the same income AMI=0.5000; a size-8 household at the same income AMI=0.3788.
        test_recipe:
          setup:
            - "Program with area_median_income_cents=10000000"
            - "Three households with identical verified income 5000000 but sizes 1, 4, 8"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P4", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "H1", household_size: 1, annual_gross_income_cents: 5000000 }
              as: IntakeSpecialist
              captures: { h1: $.data.id }
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "H4", household_size: 4, annual_gross_income_cents: 5000000 }
              as: IntakeSpecialist
              captures: { h4: $.data.id }
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "H8", household_size: 8, annual_gross_income_cents: 5000000 }
              as: IntakeSpecialist
              captures: { h8: $.data.id }
            - call: "POST /programs/${prog}/households/${h1}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 5000000, verified_annual_income_cents: 5000000, household_size_at_cert: 1 }
              as: IntakeSpecialist
              captures: { c1: $.data.id }
            - call: "POST /programs/${prog}/households/${h4}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 5000000, verified_annual_income_cents: 5000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { c4: $.data.id }
            - call: "POST /programs/${prog}/households/${h8}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 5000000, verified_annual_income_cents: 5000000, household_size_at_cert: 8 }
              as: IntakeSpecialist
              captures: { c8: $.data.id }
          trigger:
            - call: "GET /programs/${prog}/households/${h1}/income-certifications/${c1}"
              as: ComplianceOfficer
              captures: { ami_1: $.data.ami_pct_at_cert }
            - call: "GET /programs/${prog}/households/${h4}/income-certifications/${c4}"
              as: ComplianceOfficer
              captures: { ami_4: $.data.ami_pct_at_cert }
            - call: "GET /programs/${prog}/households/${h8}/income-certifications/${c8}"
              as: ComplianceOfficer
              captures: { ami_8: $.data.ami_pct_at_cert }
          assert:
            # ami = 5000000 / (10000000 * adj); round_half_up to 4 dp
            # size1: adj=0.70 → 5000000/7000000 = 0.714285... → 0.7143
            - "IncomeCertification.${c1}.ami_pct_at_cert == 0.7143"
            # size4: adj=1.00 → 5000000/10000000 = 0.5000
            - "IncomeCertification.${c4}.ami_pct_at_cert == 0.5000"
            # size8: adj=1.32 → 5000000/13200000 = 0.378787... → 0.3788
            - "IncomeCertification.${c8}.ami_pct_at_cert == 0.3788"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: ground_lease_default_cure_cycle
        grounds:
          - state_machines.GroundLease
          - state_machines.DefaultNotice
        distinguishing_aspect: |
          GroundLease has a cyclic shape: ACTIVE → IN_DEFAULT → ACTIVE (on cure) → IN_DEFAULT
          (on next default) — a true cycle, not a one-way revert. Combined with the side loop
          IN_DEFAULT → CURE_PERIOD → ACTIVE. Two different entities (GroundLease, DefaultNotice)
          have interlocking non-linear shapes: notice is OPEN→CURED|ESCALATED|DISMISSED.
        test_recipe:
          setup:
            - "Program with one ELIGIBLE household on an ACTIVE lease"
            - "A LeaseFee that has gone LATE and generated a DefaultNotice(FEE_ARREARS)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P5", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/units"
              payload: { address: "1 D St", bedrooms: 2, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit: $.data.id }
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "Buyer", household_size: 4, annual_gross_income_cents: 7000000 }
              as: IntakeSpecialist
              captures: { hh: $.data.id }
            - call: "POST /programs/${prog}/households/${hh}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 7000000, verified_annual_income_cents: 7000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { cert: $.data.id }
            - call: "POST /programs/${prog}/households/${hh}/income-certifications/${cert}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh}/income-certifications/${cert}/approve"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/education-courses"
              payload: { code: "H101", title: "Basics", credit_hours: 8, is_required: true, validity_months: 24 }
              as: ProgramAdmin
              captures: { course: $.data.id }
            - call: "POST /programs/${prog}/households/${hh}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-04-01T00:00:00Z", score_pct: 0.9 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/units/${unit}/leases"
              payload: { household_id: "${hh}", start_date: "2026-05-01T00:00:00Z", purchase_price_cents: 20000000 }
              as: LeaseManager
              captures: { lease: $.data.id }
            - call: "GET /programs/${prog}/units/${unit}"
              as: LeaseManager
              captures: { unit_v: $.data.version }
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/activate"
              payload: { expected_unit_version: "${unit_v}" }
              as: LeaseManager
            # Directly issue a FEE_ARREARS default notice (simulating late fee)
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/default-notices"
              payload: { notice_kind: "FEE_ARREARS", amount_due_cents: 50000 }
              as: LeaseManager
              captures: { notice: $.data.id }
          trigger:
            # Cycle step 1: lease is IN_DEFAULT; cure it
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/default-notices/${notice}/cure"
              payload: { cure_evidence: "paid-arrears-txn-001" }
              as: LeaseManager
          assert:
            - "DefaultNotice.${notice}.status == CURED"
            - "GroundLease.${lease}.status == ACTIVE"
            - "Unit.${unit}.occupancy_status == OCCUPIED"

      - name: resale_listing_branching_cancel_path
        grounds:
          - state_machines.ResaleListing
        distinguishing_aspect: |
          ResaleListing has branching fork: OPEN → MATCHED → UNDER_CONTRACT → CLOSED OR
          OPEN|MATCHED → CANCELLED. From MATCHED there are three outgoing transitions
          (open-contract, close-via-open-contract, cancel). Different entity from GroundLease,
          different shape.
        test_recipe:
          setup:
            - "Program with seller lease ACTIVE and a MATCHED resale listing"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P6", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/units"
              payload: { address: "1 R St", bedrooms: 3, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit: $.data.id }
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "Seller", household_size: 4, annual_gross_income_cents: 7000000 }
              as: IntakeSpecialist
              captures: { hh_s: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_s}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 7000000, verified_annual_income_cents: 7000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { cert_s: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_s}/income-certifications/${cert_s}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh_s}/income-certifications/${cert_s}/approve"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/education-courses"
              payload: { code: "H101", title: "Basics", credit_hours: 8, is_required: true, validity_months: 24 }
              as: ProgramAdmin
              captures: { course: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_s}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-04-01T00:00:00Z", score_pct: 0.9 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/units/${unit}/leases"
              payload: { household_id: "${hh_s}", start_date: "2026-05-01T00:00:00Z", purchase_price_cents: 20000000 }
              as: LeaseManager
              captures: { lease_s: $.data.id }
            - call: "GET /programs/${prog}/units/${unit}"
              as: LeaseManager
              captures: { unit_v: $.data.version }
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease_s}/activate"
              payload: { expected_unit_version: "${unit_v}" }
              as: LeaseManager
            # Buyer household on waitlist
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "Buyer", household_size: 4, annual_gross_income_cents: 6000000 }
              as: IntakeSpecialist
              captures: { hh_b: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_b}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 6000000, verified_annual_income_cents: 6000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { cert_b: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_b}/income-certifications/${cert_b}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh_b}/income-certifications/${cert_b}/approve"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh_b}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-04-01T00:00:00Z", score_pct: 0.9 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/households/${hh_b}/waitlist-entries"
              payload: { desired_bedrooms: 3, max_price_cents: 50000000 }
              as: IntakeSpecialist
              captures: { entry: $.data.id }
            - call: "POST /programs/${prog}/units/${unit}/resale-listings"
              payload: { seller_lease_id: "${lease_s}", appraisal_at_listing_cents: 25000000 }
              as: LeaseManager
              captures: { listing: $.data.id }
            - call: "GET /programs/${prog}/units/${unit}/resale-listings/${listing}"
              as: LeaseManager
              captures: { listing_v: $.data.version }
            - call: "POST /programs/${prog}/units/${unit}/resale-listings/${listing}/run-matching"
              payload: { expected_listing_version: "${listing_v}" }
              as: LeaseManager
          trigger:
            # Cancel from MATCHED — branching back to OPEN side effects
            - call: "POST /programs/${prog}/units/${unit}/resale-listings/${listing}/cancel"
              as: LeaseManager
          assert:
            - "ResaleListing.${listing}.status == CANCELLED"
            - "WaitlistEntry.${entry}.status == ACTIVE"
            - "WaitlistEntry.${entry}.matched_unit_id == null"
            - "Unit.${unit}.occupancy_status == OCCUPIED"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: inspection_failed_cascade_to_default_and_unit
        grounds:
          - state_machines.InspectionRecord
          - state_machines.DefaultNotice
          - state_machines.GroundLease
          - state_machines.Unit
        distinguishing_aspect: |
          Depth-3 cascade: Inspector records FAILED → DefaultNotice auto-issued → GroundLease
          transitions ACTIVE → IN_DEFAULT → Unit.occupancy_status transitions OCCUPIED → IN_DEFAULT.
          Each link caused by the previous. Trigger: record-result on InspectionRecord.
        test_recipe:
          setup:
            - "Program with ELIGIBLE household on ACTIVE lease (unit OCCUPIED)"
            - "A PENDING InspectionRecord scheduled on the unit"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P7", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/units"
              payload: { address: "1 F St", bedrooms: 2, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit: $.data.id }
            - call: "POST /programs/${prog}/households"
