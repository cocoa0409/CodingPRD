        claim_type: Violation -> Error
        grounds: ["validations[priority=13]", "errors.ERR_COMPONENT_ALREADY_RECORDED", "errors.ERR_CHECK_ALREADY_ADJUDICATED"]
        distinguishing_aspect: "Recording NSOPR twice on a PENDING check is 409 ERR_COMPONENT_ALREADY_RECORDED; once the third component adjudicates the check, ANY further component call is 409 ERR_CHECK_ALREADY_ADJUDICATED (check-level guard beats component-level)."
        test_recipe:
          setup: ["Member A has a PENDING check with NSOPR already CLEAR."]
          setup_api_calls:
