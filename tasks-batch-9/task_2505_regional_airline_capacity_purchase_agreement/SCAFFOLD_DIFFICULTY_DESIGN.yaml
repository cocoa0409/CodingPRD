            - call: "POST /cpa/aircraft"
              payload: { agreement_id: "${ag}", assigned_base_id: "${base}", tail_number: "N1101RG", seat_count: 76, ownership: "REGIONAL_OWNED" }
              as: RegionalOpsController
              captures: { ac1: $.data.id }
          trigger:
            - call: "POST /cpa/aircraft/${ac1}/induct"
              payload: {}
              as: RegionalOpsController
            - call: "POST /cpa/pilots/${p2}/advance"
              payload: { to_status: "LINE_QUALIFIED" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/aircraft/${ac1}/induct"
              payload: {}
              as: RegionalOpsController
          assert:
            - "The first induct returns HTTP 409 with error.code == ERR_BASE_UNDERSTAFFED — (0 + 1) * 2 = 2 > line_qualified_pilot_count 1"
            - "Immediately after that rejection Aircraft.${ac1}.status == PENDING_INDUCTION, Aircraft.${ac1}.inducted_at == null and CrewBase.${base}.assigned_aircraft_count == 0"
            - "At that moment CrewBase.${base}.allocatable_aircraft_count == 0 — pipeline_available is 1 + floor(1 * 0.65) == 1 and min(2, floor(1 / 2)) == 0, so PIPELINE_BASIS also supports no tail yet"
            - "After the advance, CrewBase.${base}.line_qualified_pilot_count == 2 and in_training_pilot_count == 0"
            - "The second induct returns HTTP 200 and Aircraft.${ac1}.status == IN_SERVICE"
            - "CrewBase.${base}.assigned_aircraft_count == 1, required_pilot_count == 2, headcount_shortfall == 0, staffing_posture == STAFFED"

      - name: invoice_issue_gated_on_passthrough_claim_terminality
        grounds:
