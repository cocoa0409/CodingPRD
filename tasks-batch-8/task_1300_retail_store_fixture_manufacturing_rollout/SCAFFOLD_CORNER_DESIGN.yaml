  - section: complexity_layers
    instances:
      - name: kit_patch_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[kit-config-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH with an expected_config_version the server has already advanced past (two sequential patches carrying the same captured version) is rejected 412 ERR_STALE_VERSION; the second writer must re-read."
        test_recipe:
          setup: ["Program ACTIVE; prototype APPROVED; kit created in DRAFT (version 1)"]
          setup_api_calls:
            - call: "POST /rollout-programs"
              payload: { program_name: "P-OCC1", retailer_code: "RTL-C", budget_total_cents: 1000000, contingency_budget_cents: 100000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /rollout-programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /fixture-prototypes"
              payload: { program_id: "${prog_id}", fixture_code: "ENDCAP", bom_lines: [ { part_number: "PN-600", quantity: 1, list_unit_cost_cents: 3000 } ], target_cost_cents: 999999 }
              as: FixtureEngineer
              captures: { proto_id: $.data.id }
            - call: "POST /fixture-prototypes/${proto_id}/submit-review"
              payload: {}
              as: FixtureEngineer
              as_user_id: "eng-1"
            - call: "POST /fixture-prototypes/${proto_id}/approve"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /store-kit-configs"
              payload: { program_id: "${prog_id}", prototype_id: "${proto_id}", store_code: "STORE-OCC1" }
              as: ConfigCoordinator
              captures: { kit_id: $.data.id, kit_v: $.data.version }
          trigger:
            - call: "PATCH /store-kit-configs/${kit_id}"
              payload: { config_lines: [ { part_number: "PN-600", quantity: 3, unit_cost_cents: 1000 } ], expected_config_version: "${kit_v}" }
              as: ConfigCoordinator
            - call: "PATCH /store-kit-configs/${kit_id}"
              payload: { config_lines: [ { part_number: "PN-600", quantity: 7, unit_cost_cents: 1000 } ], expected_config_version: "${kit_v}" }
              as: ConfigCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "First PATCH succeeds: version becomes 2, total_components == 3"
            - "Second PATCH (same expected_config_version): error_id == ERR_STALE_VERSION, http_status == 412"
            - "StoreKitConfig.${kit_id}.total_components == 3 (stale write not applied)"

