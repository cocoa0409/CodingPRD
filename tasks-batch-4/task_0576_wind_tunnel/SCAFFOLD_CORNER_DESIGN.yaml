        distinguishing_aspect: "POST /tunnels as Flyer returns ERR_FORBIDDEN (tunnel creation is Manager-exclusive)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Flyer
              as_user_id: "flyer-x"
              captures: { err: $.data.error_id }
          assert: ["captured err == ERR_FORBIDDEN"]

      - name: frontdesk_cannot_create_instructor_returns_forbidden
        claim_type: Cannot perform other role's exclusive op
        grounds: [roles.Manager, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "POST /instructors as FrontDesk returns ERR_FORBIDDEN (instructor creation is Manager-exclusive)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /instructors"
              payload: { name: "Ivy", cert_level: "L2" }
