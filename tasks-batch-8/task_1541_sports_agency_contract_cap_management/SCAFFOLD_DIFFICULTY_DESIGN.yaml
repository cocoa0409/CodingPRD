            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Mgr", email: "m@v.example", cert_number: "MV1", is_manager: true }
              as: AgencyManager
              captures: { m_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${m_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Agt", email: "a@v.example", cert_number: "AV1" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${a_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "PV", position: "PG" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 40000000, guaranteed_cents: 40000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${contract_id}/proposals"
              payload: { proposed_by_agent_id: "${a_id}", proposed_aav_cents: 40000000, proposed_guaranteed_cents: 40000000 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { p_id: $.data.id }
            - call: "GET /teams/${team_id}/cap_seasons/${cs_id}"
              as: LeagueOfficer
              captures: { cs_v: $.data.version }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${contract_id}/proposals/${p_id}/submit"
              payload: { expected_cap_season_version: "${cs_v}" }
              as: Agent
              as_user_id: "${a_id}"
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${contract_id}/proposals/${p_id}/accept"
              payload: {}
              as: Team
              as_user_id: "${team_id}"
            - call: "GET /agencies/${agency_id}/clients/${c_id}/contracts/${contract_id}"
              as: Agent
              as_user_id: "${a_id}"
              captures: { contract_v: $.data.version }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${contract_id}/sign"
              payload: { expected_contract_version: "${contract_v}" }
              as: Agent
              as_user_id: "${a_id}"
          trigger:
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${contract_id}/void"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
          assert:
            - "Contract.${contract_id}.signing_status == VOIDED  # level 1"
            - "Contract.${contract_id}.cap_posting_status == REVERSED"
            - "CapSeason.${cs_id}.committed_cents == 0   # level 2 — ledger sync reversed"
            - "FeeLedgerEntry for contract ${contract_id} has status == VOIDED  # level 2 — compensation"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (≥2 instances, different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_proposal_submit
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_AGENT_NOT_CERTIFIED]
        distinguishing_aspect: |
          Pair = state vs business_safety. A submit attempt where the
          Proposal is already WITHDRAWN (state violation) AND the acting
          agent is SUSPENDED (business_safety violation) MUST return
          ERR_INVALID_STATE (priority 4 beats priority 5). The state check
          fires first.
        test_recipe:
          setup:
            - "Agency, manager, certified agent AG1, client, contract, proposal P1"
            - "P1 submitted then withdrawn by AG1 (so P1.status == WITHDRAWN)"
            - "AG1 then suspended (cert_status == SUSPENDED)"
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "PriTeam", league_code: "NBA" }
              as: LeagueOfficer
              captures: { team_id: $.data.id }
            - call: "POST /teams/${team_id}/cap_seasons"
              payload: { season_year: 2026, cap_limit_cents: 500000000, luxury_threshold_cents: 600000000 }
              as: LeagueOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "PriAgency", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { agency_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Mgr", email: "m@pr.example", cert_number: "MPR", is_manager: true }
              as: AgencyManager
              captures: { m_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${m_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Agt", email: "a@pr.example", cert_number: "APR" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${a_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "P", position: "PG" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 10000000, guaranteed_cents: 10000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { con_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/proposals"
              payload: { proposed_by_agent_id: "${a_id}", proposed_aav_cents: 10000000, proposed_guaranteed_cents: 10000000 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { p_id: $.data.id }
            - call: "GET /teams/${team_id}/cap_seasons/${cs_id}"
              as: LeagueOfficer
              captures: { cs_v: $.data.version }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/proposals/${p_id}/submit"
              payload: { expected_cap_season_version: "${cs_v}" }
              as: Agent
              as_user_id: "${a_id}"
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/proposals/${p_id}/withdraw"
              payload: {}
              as: Agent
              as_user_id: "${a_id}"
            - call: "POST /agencies/${agency_id}/agents/${a_id}/suspend"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "GET /teams/${team_id}/cap_seasons/${cs_id}"
              as: LeagueOfficer
              captures: { cs_v2: $.data.version }
          trigger:
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/proposals/${p_id}/submit"
              payload: { expected_cap_season_version: "${cs_v2}" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE   # priority 4 (state) wins over priority 5 (agent-not-certified)"
            - "http status == 409"

      - name: business_temporal_vs_business_referential_on_tender_exercise
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_OWNERSHIP_VIOLATION]
          - errors[ERR_WINDOW_CLOSED]
        distinguishing_aspect: |
          Pair = business_referential (priority 6) vs business_temporal
          (priority 7). Different category pair from instance 1. An Agent
          other than the client's primary attempts to exercise a
          TenderOption whose window has already closed. The referential
          (ownership) check fires first, so ERR_OWNERSHIP_VIOLATION wins
          over ERR_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "Agency with manager + two certified agents AG1 (primary) and AG2 (intruder)"
            - "Client C1 (primary=AG1) with a SIGNED contract"
            - "TenderOption on the contract with window [2026-07-01, 2026-07-15) — already closed relative to logical clock 2026-08-01"
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "TenderTeam", league_code: "NBA" }
              as: LeagueOfficer
              captures: { team_id: $.data.id }
            - call: "POST /teams/${team_id}/cap_seasons"
              payload: { season_year: 2026, cap_limit_cents: 500000000, luxury_threshold_cents: 600000000 }
              as: LeagueOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "TenderAgency", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { agency_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Mgr", email: "m@tender.example", cert_number: "MTD", is_manager: true }
              as: AgencyManager
              captures: { m_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${m_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Primary", email: "p@tender.example", cert_number: "APT" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${a1_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Intruder", email: "i@tender.example", cert_number: "AIT" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a2_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${a2_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/clients"
              payload: { primary_agent_id: "${a1_id}", full_name: "Tender Player", position: "C" }
              as: Agent
              as_user_id: "${a1_id}"
              captures: { c_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 5000000, guaranteed_cents: 5000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a1_id}"
              captures: { con_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/proposals"
              payload: { proposed_by_agent_id: "${a1_id}", proposed_aav_cents: 5000000, proposed_guaranteed_cents: 5000000 }
              as: Agent
              as_user_id: "${a1_id}"
              captures: { p_id: $.data.id }
            - call: "GET /teams/${team_id}/cap_seasons/${cs_id}"
              as: LeagueOfficer
              captures: { cs_v: $.data.version }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/proposals/${p_id}/submit"
              payload: { expected_cap_season_version: "${cs_v}" }
              as: Agent
              as_user_id: "${a1_id}"
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/proposals/${p_id}/accept"
              payload: {}
              as: Team
              as_user_id: "${team_id}"
            - call: "GET /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}"
              as: Agent
              as_user_id: "${a1_id}"
              captures: { con_v: $.data.version }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/sign"
              payload: { expected_contract_version: "${con_v}" }
              as: Agent
              as_user_id: "${a1_id}"
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/tender_options"
              payload: { kind: "PLAYER_OPTION", window_open_at: "2026-07-01T00:00:00Z", window_close_at: "2026-07-15T00:00:00Z" }
              as: Agent
              as_user_id: "${a1_id}"
              captures: { tender_id: $.data.id }
          trigger:
            # Intruder agent (NOT primary) attempts to exercise a window that is also closed
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${con_id}/tender_options/${tender_id}/exercise"
              payload: {}
              as: Agent
              as_user_id: "${a2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OWNERSHIP_VIOLATION   # priority 6 (referential) wins over priority 7 (temporal)"
            - "http status == 422"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (≥2 instances, different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: proposal_submit_luxury_threshold_equality
        grounds:
          - validations[priority=8]
          - calculations.cap_space_projection
        distinguishing_aspect: |
          Metric = luxury_threshold_cents (numeric), endpoint = proposal
          submit. Scaffold uses `<=` for the luxury check: submitting such
          that committed + reserved + proposed == luxury_threshold MUST
          succeed; +1 cent MUST fail with ERR_CAP_WOULD_EXCEED.
        test_recipe:
          setup:
            - "CapSeason cap_limit=200M, luxury=250M; committed=100M (one signed contract); reserved=50M (one submitted proposal)"
            - "New proposal P3 with proposed_aav_cents=100M ready to submit (will land exactly at luxury)"
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "BoundTeam", league_code: "NBA" }
              as: LeagueOfficer
              captures: { team_id: $.data.id }
            - call: "POST /teams/${team_id}/cap_seasons"
              payload: { season_year: 2026, cap_limit_cents: 200000000, luxury_threshold_cents: 250000000 }
              as: LeagueOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "BoundAgency", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { agency_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents"
