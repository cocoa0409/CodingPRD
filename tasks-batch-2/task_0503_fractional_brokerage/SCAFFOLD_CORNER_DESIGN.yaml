  - section: rbac
    instances:
      - name: account_holder_cannot_freeze_account
        claim_type: peer_roles
        grounds: [roles.AccountHolder, roles.ComplianceOfficer, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "An AccountHolder calling PATCH /accounts/{id}/compliance-hold (a ComplianceOfficer-exclusive op) returns ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["CASH account A_RB owned by the acting holder."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_email: "rb@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_rb: $.data.id }
          trigger:
