              payload: { counted_lines: [{ denomination_cents: 2000, quantity: 6 }, { denomination_cents: 1000, quantity: 1 }] }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-3"
          trigger:
            - call: "POST /cash-ops/till-sessions/${session_b_id}/reconcile"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-3"
          assert:
            - "link 1: TillSession.${session_b_id}.status == RECONCILED, expected_cash_cents == 20000, variance_cents == -7000, variance_basis == DECLARED_DROPS"
            - "link 2: Cashier.${cashier_id}.rolling_absolute_variance_cents == 10000, rolling_net_variance_cents == -10000, reconciled_session_count == 2, till_eligibility == RESTRICTED"
            - "link 3: GET /cash-ops/variance-cases?sales_journal_id=${journal_id} returns exactly 3 cases — two SESSION_VARIANCE with total_variance_cents 3000 and 7000, and one ROLLING_PATTERN with total_variance_cents == 10000 and status == OPEN"
            - "link 3: Cashier.${cashier_id}.open_case_count == 3"
            - "link 4: SalesJournal.${journal_id}.reconciled_session_count == 2, session_count == 2, register_cash_tieout_cents == -10000, open_case_count == 3, status == OUT_OF_BALANCE"
            - "Cashier.${cashier_id}.coaching_state == COACHING_DUE and coaching_due_at == 2026-08-06T17:00:00Z"
            - "Safe.${safe_id}.balance_cents == 710000"

      - name: escalation_cascade_case_to_cashier_to_safe_freeze
        grounds:
          - state_machines.VarianceCase.OPEN_to_ESCALATED
          - entities.Cashier.fields.till_eligibility
          - entities.Safe.fields.posture
          - validations[priority=45]
          - validations[priority=60]
          - endpoints["POST /cash-ops/variance-cases/{id}/escalate"]
          - endpoints["POST /cash-ops/change-orders/{id}/receive"]
        distinguishing_aspect: |
          Three causally chained links across three different entities from a single escalate:
          (1) the case becomes ESCALATED with suspected_theft true; (2) BECAUSE it is escalated the
          cashier is BARRED; (3) BECAUSE it is escalated every safe of the store has posture FROZEN,
          which is then observable as a change-order receipt failing with ERR_SAFE_FROZEN. The chain
          is triggered by a compliance action and terminates in a blocked unrelated endpoint, unlike
          the reconcile cascade whose links are all arithmetic re-derivations.
        test_recipe:
