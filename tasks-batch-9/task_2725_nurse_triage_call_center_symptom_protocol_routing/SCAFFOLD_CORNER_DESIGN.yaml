              captures: { patient_id: $.data.id }
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_id}", caller_name: "Dana Reyes", caller_phone: "+14155550100", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "chest discomfort" }
              as: IntakeAgent
              captures: { call_id: $.data.id, version_on_create: $.data.version }
            - call: "POST /triage-calls/${call_id}/match-patient"
              payload: { patient_id: "${patient_id}", match_method: "MRN" }
              as: IntakeAgent
              captures: { version_after_match: $.data.version }
            - call: "POST /triage-calls/${call_id}/consent"
              payload: { consent_type: "PATIENT_SELF", consent_given_by: "Dana Reyes" }
              as: IntakeAgent
              captures: { version_after_consent: $.data.version }
            - call: "POST /triage-calls/${call_id}/assign-nurse"
              payload: { preferred_nurse_id: "${nurse_a_id}" }
              as: IntakeAgent
              captures: { stale_version: $.data.version }
            - call: "POST /triage-calls/${call_id}/assessments"
              payload: { protocol_id: "${protocol_id}", confirmation_mode: "CONFIRMED", red_flag_count: 1, confirmed_pregnancy_status: "NOT_PREGNANT" }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { assessment_id: $.data.id }
          trigger:
            - call: "POST /dispositions"
              payload: { call_id: "${call_id}", assessment_id: "${assessment_id}", final_level: "ED_NOW", expected_call_version: "${stale_version}" }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              expect_error: ERR_STALE_CALL_VERSION
              expect_status: 412
            - call: "GET /triage-calls/${call_id}"
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { fresh_version: $.data.version, fresh_status: $.data.status }
            - call: "POST /dispositions"
              payload: { call_id: "${call_id}", assessment_id: "${assessment_id}", final_level: "ED_NOW", expected_call_version: "${fresh_version}" }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { disposition_id: $.data.id, advice: $.data.advice_status }
          assert:
            - "${version_on_create} == 1"
            - "${version_after_match} == 2"
            - "${version_after_consent} == 3"
            - "${stale_version} == 4"
            - "the first trigger response carries error_id ERR_STALE_CALL_VERSION with HTTP status 412"
            - "immediately after that refusal TriageCall.${call_id}.version == 5 and no Disposition exists for the call"
            - "${fresh_status} == ASSESSING"
            - "${fresh_version} == 5"
            - "${advice} == AUTHORIZED"
            - "TriageCall.${call_id}.version == 6"
            - "TriageCall.${call_id}.status == DISPOSITIONED"

      - name: selector_policy_ranks_by_load_then_seniority_then_created_at
        claim_type: selector_policy
        grounds:
          - calculations.nurse_assignment_selector
          - complexity_profile.complexity_layers
          - entities.Nurse.fields.active_call_load
          - entities.Nurse.fields.seniority_level
        distinguishing_aspect: "Three consecutive assignments exercise all three ranking keys with no randomness and no id ordering: the first pick is decided by created_at because two nurses tie on load 0 and seniority 4, the second by seniority once the winner's load rises, and the third by load once the two senior nurses are both busy — so replaying the same three calls always yields the same three nurses in the same order."
        test_recipe:
          setup:
            - "Clock 2026-08-03T14:30:00Z; three nurses, all ON_ROTATION with ACTIVE CA licences and 12:00-20:00 shifts, all with max_concurrent_calls 2."
            - "Creation order and seniority: nurse_junior (seniority 2) first, then nurse_senior_early (seniority 4), then nurse_senior_late (seniority 4)."
            - "Three consented calls from CA callers are waiting, each created in order."
