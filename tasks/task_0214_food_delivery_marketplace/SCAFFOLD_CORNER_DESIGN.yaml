# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 0214 — Food Delivery Marketplace  (EXPERT tier)
# Breadth probe: enumerates testable claims of §1.1–§1.7 not covered by §1.8.
# Sections & claim_types per references/claim-extraction-guide.md.
# Reuses canonical zone "DT" from SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_zone_returns_201_with_fields
        claim_type: Creation
        grounds:
          - entities.Zone
          - endpoints
        distinguishing_aspect: "POST /zones with all required fields returns 201 and a Zone with active_order_count == 0 and version == 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 850 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id, aoc: $.data.active_order_count, v: $.data.version }
          assert:
            - "response.status == 201"
            - "Zone.${zone_id}.active_order_count == 0"
            - "Zone.${zone_id}.version == 1"

      - name: get_order_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Order
          - errors[ERR_ORDER_NOT_FOUND]
        distinguishing_aspect: "GET /orders/{id} with a random unknown UUID returns 404 ERR_ORDER_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_ORDER_NOT_FOUND"

      - name: create_dasher_missing_required_home_zone_id
        claim_type: Required Fields
        grounds:
          - entities.Dasher.fields.home_zone_id
          - errors[ERR_INVALID_PAYLOAD]
        distinguishing_aspect: "POST /dashers without required home_zone_id returns 400 ERR_INVALID_PAYLOAD."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /dashers"
              payload: { name: "Dan" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_PAYLOAD"

      - name: create_dasher_default_max_batch_size_applied
        claim_type: Defaults
        grounds:
          - entities.Dasher.fields.max_batch_size
        distinguishing_aspect: "Omitting max_batch_size on POST /dashers applies the declared default of 2."
        test_recipe:
          setup: ["Zone DT exists."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 850 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
          trigger:
            - call: "POST /dashers"
              payload: { name: "Dan", home_zone_id: "${zone_id}" }
              as: PlatformAdmin
              captures: { dasher_id: $.data.id, mbs: $.data.max_batch_size }
          assert:
            - "Dasher.${dasher_id}.max_batch_size == 2"
            - "Dasher.${dasher_id}.availability == ONLINE"

      - name: order_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Order.fields.zone_id
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: "Order.zone_id is copied from the restaurant (system) and fulfillment_status is PLACED at creation; client cannot set them."
        test_recipe:
          setup: ["Zone DT, open restaurant in DT, $20 item, a customer."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 850 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /restaurants"
              payload: { zone_id: "${zone_id}", name: "Burgers", route_distance_km: 4, is_open: true }
              as: PlatformAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /restaurants/${rest_id}/menu-items"
              payload: { name: "Combo", price_cents: 2000, available: true }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { item_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cara" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, z: $.data.zone_id, fs: $.data.fulfillment_status, bs: $.data.billing_status }
          assert:
            - "Order.${order_id}.zone_id == ${zone_id}"
            - "Order.${order_id}.fulfillment_status == PLACED"
            - "Order.${order_id}.billing_status == UNSETTLED"

      - name: place_order_invalid_refund_destination_enum
        claim_type: Type Constraints
        grounds:
          - entities.OrderIssue.fields.refund_destination
          - errors[ERR_INVALID_ENUM]
        distinguishing_aspect: "Filing an issue with refund_destination not in {ORIGINAL, WALLET} returns 422 ERR_INVALID_ENUM."
        test_recipe:
          setup: ["A DELIVERED order with a line, ready for an issue."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 0 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /restaurants"
              payload: { zone_id: "${zone_id}", name: "Burgers", route_distance_km: 4, is_open: true }
              as: PlatformAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /restaurants/${rest_id}/menu-items"
              payload: { name: "Taco", price_cents: 500, available: true }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { item_id: $.data.id }
            - call: "POST /dashers"
              payload: { name: "Dan", home_zone_id: "${zone_id}", availability: "ONLINE" }
              as: PlatformAdmin
              captures: { dasher_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cara" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 2 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, ver: $.data.version }
            - call: "GET /orders/${order_id}/line-items"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: "$.data[0].id" }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { expected_order_version: "${ver}" }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { delivery_id: $.data.id }
            - call: "POST /deliveries/${delivery_id}/accept"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
            - call: "POST /deliveries/${delivery_id}/picked-up"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
            - call: "POST /deliveries/${delivery_id}/delivered"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
          trigger:
            - call: "POST /orders/${order_id}/issues"
              payload: { line_item_id: "${line_id}", missing_quantity: 1, refund_destination: "BANK" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_ENUM"

      - name: create_restaurant_unknown_zone_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Restaurant.fields.zone_id
          - errors[ERR_ZONE_NOT_FOUND]
        distinguishing_aspect: "POST /restaurants referencing a non-existent zone_id returns 404 ERR_ZONE_NOT_FOUND (FK existence)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /restaurants"
              payload: { zone_id: "00000000-0000-4000-8000-000000000000", name: "Burgers", route_distance_km: 4 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_ZONE_NOT_FOUND"

      - name: empty_line_items_returns_empty_order_error
        claim_type: Type Constraints
        grounds:
          - errors[ERR_EMPTY_ORDER]
          - endpoints
        distinguishing_aspect: "POST /orders with an empty line_items array returns 422 ERR_EMPTY_ORDER (zero-collection boundary)."
        test_recipe:
          setup: ["Zone DT, open restaurant, a customer."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 850 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /restaurants"
              payload: { zone_id: "${zone_id}", name: "Burgers", route_distance_km: 4, is_open: true }
              as: PlatformAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cara" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_EMPTY_ORDER"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: accept_already_accepted_delivery_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Delivery.OFFERED_to_ACCEPTED
          - errors[ERR_INVALID_DELIVERY_STATE]
        distinguishing_aspect: "Accepting a delivery already in ACCEPTED returns 409 ERR_INVALID_DELIVERY_STATE; idempotency not allowed."
        test_recipe:
          setup: ["Order dispatched and accepted (Delivery ACCEPTED)."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 850 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /restaurants"
              payload: { zone_id: "${zone_id}", name: "Burgers", route_distance_km: 4, is_open: true }
              as: PlatformAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /restaurants/${rest_id}/menu-items"
              payload: { name: "Combo", price_cents: 2000, available: true }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { item_id: $.data.id }
            - call: "POST /dashers"
              payload: { name: "Dan", home_zone_id: "${zone_id}", availability: "ONLINE" }
              as: PlatformAdmin
              captures: { dasher_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cara" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ], tip_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, ver: $.data.version }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { expected_order_version: "${ver}" }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { delivery_id: $.data.id }
            - call: "POST /deliveries/${delivery_id}/accept"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
          trigger:
            - call: "POST /deliveries/${delivery_id}/accept"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_DELIVERY_STATE"

      - name: cancel_delivered_order_not_cancellable
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Order.PLACED_to_CANCELLED
          - errors[ERR_ORDER_NOT_CANCELLABLE]
        distinguishing_aspect: "Cancelling a DELIVERED (terminal-fulfillment) order returns 409 ERR_ORDER_NOT_CANCELLABLE; no refund issued."
        test_recipe:
          setup: ["An order taken to DELIVERED."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 850 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /restaurants"
              payload: { zone_id: "${zone_id}", name: "Burgers", route_distance_km: 4, is_open: true }
              as: PlatformAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /restaurants/${rest_id}/menu-items"
              payload: { name: "Combo", price_cents: 2000, available: true }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { item_id: $.data.id }
            - call: "POST /dashers"
              payload: { name: "Dan", home_zone_id: "${zone_id}", availability: "ONLINE" }
              as: PlatformAdmin
              captures: { dasher_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cara" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ], tip_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, ver: $.data.version }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { expected_order_version: "${ver}" }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { delivery_id: $.data.id }
            - call: "POST /deliveries/${delivery_id}/accept"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
            - call: "POST /deliveries/${delivery_id}/picked-up"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
            - call: "POST /deliveries/${delivery_id}/delivered"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ORDER_NOT_CANCELLABLE"

      - name: deactivate_restaurant_cascades_delist_menu
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Restaurant.ACTIVE_to_DEACTIVATED
          - state_machines.MenuItem.LISTED_to_DELISTED
        distinguishing_aspect: "Deactivating an ACTIVE restaurant with no active orders cascades all its LISTED MenuItems to DELISTED."
        test_recipe:
          setup: ["Zone DT, open restaurant with one LISTED item, no orders."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 850 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /restaurants"
              payload: { zone_id: "${zone_id}", name: "Burgers", route_distance_km: 4, is_open: true }
              as: PlatformAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /restaurants/${rest_id}/menu-items"
              payload: { name: "Combo", price_cents: 2000, available: true }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /restaurants/${rest_id}/deactivate"
              payload: {}
              as: Restaurant
              as_user_id: "${rest_id}"
            - call: "GET /menu-items/${item_id}"
              payload: {}
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { st: $.data.status }
          assert:
            - "Restaurant.${rest_id}.status == DEACTIVATED"
            - "MenuItem.${item_id}.status == DELISTED"

      - name: release_scheduled_order_before_due_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Order.SCHEDULED_to_PLACED
          - errors[ERR_SCHEDULE_NOT_DUE]
        distinguishing_aspect: "Releasing a SCHEDULED order while current clock < scheduled_for returns 409 ERR_SCHEDULE_NOT_DUE; order stays SCHEDULED."
        test_recipe:
          setup: ["Clock at 2026-06-07T10:00:00Z; a scheduled order for 2026-06-07T18:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-07T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 850 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /restaurants"
              payload: { zone_id: "${zone_id}", name: "Burgers", route_distance_km: 4, is_open: true }
              as: PlatformAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /restaurants/${rest_id}/menu-items"
              payload: { name: "Combo", price_cents: 2000, available: true }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { item_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cara" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ], scheduled_for: "2026-06-07T18:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, fs: $.data.fulfillment_status }
          trigger:
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SCHEDULE_NOT_DUE"
            - "Order.${order_id}.fulfillment_status == SCHEDULED"

      - name: release_scheduled_order_when_due_succeeds
        claim_type: Valid Transition
        grounds:
          - state_machines.Order.SCHEDULED_to_PLACED
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: "After advancing the clock past scheduled_for, releasing the order moves SCHEDULED -> PLACED and increments Zone.active_order_count to 1."
        test_recipe:
          setup: ["Clock at 2026-06-07T10:00:00Z; scheduled order for 2026-06-07T12:00:00Z; then clock advanced to 2026-06-07T12:30:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-07T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 850 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /restaurants"
              payload: { zone_id: "${zone_id}", name: "Burgers", route_distance_km: 4, is_open: true }
              as: PlatformAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /restaurants/${rest_id}/menu-items"
              payload: { name: "Combo", price_cents: 2000, available: true }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { item_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cara" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ], scheduled_for: "2026-06-07T12:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-07T12:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { fs: $.data.fulfillment_status }
            - call: "GET /zones/${zone_id}"
              payload: {}
              as: PlatformAdmin
              captures: { aoc: $.data.active_order_count }
          assert:
            - "Order.${order_id}.fulfillment_status == PLACED"
            - "Zone.${zone_id}.active_order_count == 1"

      - name: reject_open_issue_no_money_moves
        claim_type: Valid Transition
        grounds:
          - state_machines.OrderIssue.OPEN_to_REJECTED
          - entities.OrderIssue.fields.refund_amount_cents
        distinguishing_aspect: "Rejecting an OPEN issue moves it to REJECTED with refund_amount_cents staying 0 and Order.refunded_cents unchanged at 0."
        test_recipe:
          setup: ["A DELIVERED order with an OPEN missing-item issue."]
          setup_api_calls:
            - call: "POST /zones"
