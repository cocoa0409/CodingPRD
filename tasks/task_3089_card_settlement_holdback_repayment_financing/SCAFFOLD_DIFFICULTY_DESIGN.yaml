              as: PlatformAdmin
              captures: { e5: $.data.id }
            - call: "POST /lending/processing_batches/${e5}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-02-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { e6: $.data.id }
            - call: "POST /lending/processing_batches/${e6}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-03-01", gross_cents: 1000000 }
