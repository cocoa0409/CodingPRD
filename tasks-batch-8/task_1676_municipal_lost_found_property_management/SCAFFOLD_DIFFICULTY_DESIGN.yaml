              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc_t: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc_t}", category: "ELECTRONICS", declared_value_cents: 5000, description: "earbuds", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id }
            - call: "POST /items/${it}/publish"
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
          trigger:
            - call: "POST /items/${it}/refer-to-law-enforcement"
              payload: { agency_name: "CPD", case_number: "C-100" }
