      - name: shared_operations_succeed_for_every_role_that_declares_them
        claim_type: shared_operations
        grounds:
          - roles.CteDirector.shared_operations
          - roles.StateComplianceReviewer.shared_operations
          - roles.GrantFiscalOfficer.shared_operations
          - roles.CommitteeChair.shared_operations
          - roles.SchoolRegistrar.shared_operations
          - endpoints[GET /cte/programs-of-study/{id}]
          - endpoints[POST /cte/programs-of-study/{id}/clna-advance]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          The mirror of the exclusive-operation denials: an over-tight RBAC table that simply mapped one endpoint to one
          role would pass every 403 test and fail here. The program read is declared for all five roles including the
          entity-backed chair, the needs-assessment advance is declared for two roles and must accept BOTH of them on
          consecutive phases of the same program, and the clock endpoint is declared for all five, so it is driven by the
          registrar. All five reads must agree on the same id and version, which also shows a read is not a write.
        test_recipe:
          setup:
            - "One DRAFT ProgramOfStudy with an ACTIVE advisory committee holding three seated members and two FINALIZED quorate CLNA_STAKEHOLDER meetings, so the needs assessment can advance."
            - "The logical clock stays at 2026-08-01T00:00:00Z."
