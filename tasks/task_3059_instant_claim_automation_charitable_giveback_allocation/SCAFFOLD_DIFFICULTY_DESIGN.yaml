      - name: rate_filing_two_filings_per_state_supersede_cycle
        grounds:
          - state_machines.RateFiling.SUBMITTED_to_APPROVED
          - state_machines.RateFiling.APPROVED_to_SUPERSEDED
        distinguishing_aspect: |
          Non-linear machine on the RateFiling entity (different entity from
          Claim): approving a second filing for state TX drives the previously
          APPROVED filing into SUPERSEDED by a system transition — a fork where
          one actor action resolves two filings' states, and the SUPERSEDED
          filing can never re-enter SUBMITTED.
