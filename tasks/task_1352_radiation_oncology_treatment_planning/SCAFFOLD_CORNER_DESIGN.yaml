      - name: machine_down_twice_and_restore_when_operational_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TreatmentMachine.OPERATIONAL_to_DOWN, state_machines.TreatmentMachine.DOWN_to_OPERATIONAL]
        distinguishing_aspect: "Machine status transitions are guarded both ways: DOWN on an already-DOWN machine fails ERR_MACHINE_ALREADY_DOWN, and OPERATIONAL on an OPERATIONAL machine fails ERR_MACHINE_NOT_DOWN."
        test_recipe:
          setup: ["one OPERATIONAL LINAC"]
          setup_api_calls:
            - { call: "POST /oncology/machines", payload: { name: "Linac-V18", machine_type: "LINAC", room: "TX9" }, as: SystemAdmin, captures: { m: $.data.id } }
            - { call: "PUT /oncology/machines/${m}/status", payload: { status: "DOWN" }, as: SystemAdmin }
          trigger:
            - { call: "PUT /oncology/machines/${m}/status", payload: { status: "DOWN" }, as: SystemAdmin, captures: { err1: $.data.error_id } }
            - { call: "PUT /oncology/machines/${m}/status", payload: { status: "OPERATIONAL" }, as: SystemAdmin }
            - { call: "PUT /oncology/machines/${m}/status", payload: { status: "OPERATIONAL" }, as: SystemAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_MACHINE_ALREADY_DOWN"
            - "err2 == ERR_MACHINE_NOT_DOWN"
  # ===================================================================
  # Section: endpoints
  # ===================================================================
  - section: endpoints
    instances:
      - name: get_patient_not_found_returns_404
        claim_type: not_found
        grounds: ["endpoints.GET_/oncology/patients/{id}", errors.ERR_NOT_FOUND]
        distinguishing_aspect: "GET on a well-formed but non-existent patient id returns 404 with ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /oncology/patients/00000000-0000-4000-8000-00000000dead", payload: {}, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND (http 404)"

      - name: list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints.GET_/oncology/patients]
        distinguishing_aspect: "The default page size is 10: with 12 patients the first page returns 10 rows with total_count 12 and has_more true; offset 10 returns 2 rows with has_more false."
        test_recipe:
          setup: ["12 patients registered"]
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-PG-01", full_name: "Page One", date_of_birth: "1980-01-01" }, as: Scheduler }
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-PG-02", full_name: "Page Two", date_of_birth: "1980-01-01" }, as: Scheduler }
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-PG-03", full_name: "Page Three", date_of_birth: "1980-01-01" }, as: Scheduler }
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-PG-04", full_name: "Page Four", date_of_birth: "1980-01-01" }, as: Scheduler }
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-PG-05", full_name: "Page Five", date_of_birth: "1980-01-01" }, as: Scheduler }
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-PG-06", full_name: "Page Six", date_of_birth: "1980-01-01" }, as: Scheduler }
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-PG-07", full_name: "Page Seven", date_of_birth: "1980-01-01" }, as: Scheduler }
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-PG-08", full_name: "Page Eight", date_of_birth: "1980-01-01" }, as: Scheduler }
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-PG-09", full_name: "Page Nine", date_of_birth: "1980-01-01" }, as: Scheduler }
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-PG-10", full_name: "Page Ten", date_of_birth: "1980-01-01" }, as: Scheduler }
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-PG-11", full_name: "Page Eleven", date_of_birth: "1980-01-01" }, as: Scheduler }
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-PG-12", full_name: "Page Twelve", date_of_birth: "1980-01-01" }, as: Scheduler }
          trigger:
            - { call: "GET /oncology/patients", payload: {}, as: Scheduler }
            - { call: "GET /oncology/patients", payload: { offset: 10 }, as: Scheduler }
          assert:
            - "first page: 10 rows, total_count == 12, has_more == true (default limit 10 applied)"
            - "second page (offset 10): 2 rows, total_count == 12, has_more == false"

      - name: error_response_envelope_shape
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Error responses carry response_type \"error\" and a data object with error_id and message; no data payload leaks on errors."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /oncology/machines/00000000-0000-4000-8000-00000000dead", payload: {}, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND and the envelope has response_type == \"error\" with data.message present (non-empty string)"

