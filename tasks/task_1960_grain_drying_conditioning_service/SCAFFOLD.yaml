  - { method: POST, path: "/grain-drying/dryer-runs/{id}/cancel", description: "Cancel a scheduled run", roles: [DryerOperator], code: 200, input: [], output: DryerRun, side_effects: ["SCHEDULED -> CANCELLED"] }

