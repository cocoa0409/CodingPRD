      - name: zone_truck_capacity_exactly_at_limit
        grounds:
          - calculations.zone_capacity_overlap
          - "endpoints.POST /truck-blocks"
        distinguishing_aspect: |
          Metric = COUNT (integer consumers), reached via a DIFFERENT endpoint
          (POST /truck-blocks) than the cutoff metric. The 4th overlapping block
          succeeds; the 5th fails ERR_CAPACITY_EXCEEDED; an ADJACENT window
