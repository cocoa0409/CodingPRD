              captures: { shift_id: $.data.id, shift_v: $.data.version }
            - call: "POST /pdn/shift-assignments"
              payload: { shift_id: "${shift_id}", nurse_id: "${n1_id}", expected_shift_version: "${shift_v}" }
              as: Scheduler
              as_user_id: "sch-001"
            - call: "POST /pdn/_clock/set_current_utc"
