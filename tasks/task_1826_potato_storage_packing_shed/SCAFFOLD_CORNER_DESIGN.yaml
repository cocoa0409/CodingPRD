          assert:
            - "pool == 3500.00 = (100x2000 + 300x4000) / 400; the SHORTFALLED 9999-priced contract is excluded"
            - "basis == 75.00 (unclosed lot: available 100.00 x default fraction 0.75; no assessment recorded)"

      - name: c_storage_weeks_floor_boundary
        claim_type: precision
        grounds:
          - "calculations.storage_fee"
        distinguishing_aspect: "Storage weeks are completed whole weeks (floor): a lot closed at 13 days accrues 1 week (fee 2500.00), a lot closed at exactly 14 days accrues 2 weeks (fee 5000.00) — the floor of an exact integer is itself."
        test_recipe:
          setup: ["growers G_a and G_b each with one 200.00-cwt RUSSET_BURBANK lot binned 2026-08-02; lot A condemned WASTE at clock 2026-08-15 (13 days), lot B at 2026-08-16 (exactly 14 days)"]
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers", payload: { name: "Grower SA", grower_code: "G-SA" }, as: ShedAdmin, captures: { ga_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers", payload: { name: "Grower SB", grower_code: "G-SB" }, as: ShedAdmin, captures: { gb_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed DC" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${ga_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-28", original_weight_cwt: 200.00 }, as: IntakeClerk, captures: { la_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${la_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk }
            - { call: "POST /potato-shed/growers/${gb_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-28", original_weight_cwt: 200.00 }, as: IntakeClerk, captures: { lb_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${lb_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk }
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/field-lots/${la_id}/quality-transition", payload: { to_status: "ON_HOLD" }, as: QualityAssuranceManager }
            - { call: "POST /potato-shed/field-lots/${la_id}/quality-transition", payload: { to_status: "CONDEMNED", diversion_channel: "WASTE" }, as: QualityAssuranceManager }
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/field-lots/${lb_id}/quality-transition", payload: { to_status: "ON_HOLD" }, as: QualityAssuranceManager }
            - { call: "POST /potato-shed/field-lots/${lb_id}/quality-transition", payload: { to_status: "CONDEMNED", diversion_channel: "WASTE" }, as: QualityAssuranceManager }
            - { call: "GET /potato-shed/growers/${ga_id}", payload: {}, as: SettlementClerk, captures: { ga_v: "$.data.version" } }
            - { call: "GET /potato-shed/growers/${gb_id}", payload: {}, as: SettlementClerk, captures: { gb_v: "$.data.version" } }
            - { call: "POST /potato-shed/growers/${ga_id}/settlements", payload: { season_label: "2026-storage", expected_grower_version: "${ga_v}" }, as: SettlementClerk, captures: { sta_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${gb_id}/settlements", payload: { season_label: "2026-storage", expected_grower_version: "${gb_v}" }, as: SettlementClerk, captures: { stb_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/settlements/${sta_id}/finalize", payload: {}, as: SettlementClerk, as_user_id: "clerk_one", captures: { fee_a: "$.data.storage_fees_cents" } }
            - { call: "POST /potato-shed/settlements/${stb_id}/finalize", payload: {}, as: SettlementClerk, as_user_id: "clerk_one", captures: { fee_b: "$.data.storage_fees_cents" } }
          assert:
            - "fee_a == 2500.00 (floor(13/7) = 1 week x 12.5 x 200.00)"
            - "fee_b == 5000.00 (floor(14/7) = 2 weeks exactly — 14 days is NOT 1 week)"

      - name: c_wash_turbidity_inclusive_boundary
        claim_type: constants_applied
        grounds:
          - "calculations.wash_water_result"
        distinguishing_aspect: "Turbidity boundary is inclusive: exactly 4.0 NTU passes (<=), 4.01 fails; chlorine bounds 50 and 200 are likewise inclusive."
        test_recipe:
          setup: ["one shed"]
          setup_api_calls:
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed DD" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/sheds/${s_id}/wash-water-checks", payload: { measured_at: "2026-08-01T01:00:00Z", turbidity_ntu: 4.0, chlorine_ppm: 50, water_temp_f: 45 }, as: QualityAssuranceManager, captures: { r1: "$.data.result" } }
            - { call: "POST /potato-shed/sheds/${s_id}/wash-water-checks", payload: { measured_at: "2026-08-01T02:00:00Z", turbidity_ntu: 4.01, chlorine_ppm: 100, water_temp_f: 50 }, as: QualityAssuranceManager, captures: { r2: "$.data.result" } }
            - { call: "POST /potato-shed/sheds/${s_id}/wash-water-checks", payload: { measured_at: "2026-08-01T03:00:00Z", turbidity_ntu: 2.0, chlorine_ppm: 200, water_temp_f: 60 }, as: QualityAssuranceManager, captures: { r3: "$.data.result" } }
            - { call: "POST /potato-shed/sheds/${s_id}/wash-water-checks", payload: { measured_at: "2026-08-01T04:00:00Z", turbidity_ntu: 2.0, chlorine_ppm: 49, water_temp_f: 50 }, as: QualityAssuranceManager, captures: { r4: "$.data.result" } }
          assert:
            - "r1 == PASS (4.0 <= 4.0, chlorine 50 and temp 45 on the inclusive bounds)"
            - "r2 == FAIL (4.01 > 4.0) and r3 == PASS (chlorine 200, temp 60 inclusive)"
            - "r4 == FAIL (chlorine 49 < 50)"

      - name: c_open_market_cap_boundary_corner
        claim_type: correct_result
        grounds:
          - "calculations.open_market_cap"
        distinguishing_aspect: "Open-market cap equality is allowed: requested == cap allocates; cap - 0.00 edge exercised in §1.8, here the satisfying side and its exact reservation arithmetic stand alone."
        excluded_because:
          difficulty_instance: open_market_cap_net_of_contract_commitments
          rationale: "The §1.8 instance exercises both the satisfying (80.00 == cap) and violating (0.01 > 0 cap-exhausted) sides with pinned reservation arithmetic; this corner would duplicate it."

      - name: c_allocation_ranking_harvest_then_created
        claim_type: correct_result
        grounds:
          - "calculations.allocation_waterfall"
        distinguishing_aspect: "Waterfall ranking is harvest_date ASC with created_at tie-break: the earlier-harvest lot is drained before the later one even though it was intaked second; two same-harvest lots order by created_at."
        test_recipe:
          setup: ["lot OLD created second but harvest 2026-07-15 (f 0.75 default); lot NEW created first, harvest 2026-07-25; both 100.00 RUSSET_BURBANK in one bin; contract 500.00; order requested 75.00"]
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers", payload: { name: "Grower T", grower_code: "G-T" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed DE" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-25", original_weight_cwt: 100.00 }, as: IntakeClerk, captures: { lnew_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${lnew_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-15", original_weight_cwt: 100.00 }, as: IntakeClerk, captures: { lold_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${lold_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk }
            - { call: "POST /potato-shed/contracts", payload: { buyer_name: "Buyer U", variety: "RUSSET_BURBANK", committed_volume_cwt: 500.00, price_cents_per_cwt: 2000, grade_min_us1_pct: 50.0, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z", priority_rank: 1 }, as: SalesManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "CONTRACT", contract_id: "${c_id}", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 50.0, requested_packed_cwt: 75.00, allocation_policy: "LOT_ASSESSMENT" }, as: SalesManager, captures: { o_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/pack-orders/${o_id}/allocate", payload: {}, as: SalesManager, captures: { res: "$.data.reservations" } }
          assert:
            - "res == [ { field_lot_id: ${lold_id}, raw_cwt: 100.00, packed_equiv_cwt: 75.00 } ]: the earlier-harvest lot is drawn first despite being intaked later (harvest_date ASC, created_at only on ties, id never consulted)"

  - section: validations
    instances:
      - name: c_priority_authz_before_existence
        claim_type: priority_ordering
        grounds:
          - "validations[priority=2]"
          - "validations[priority=3]"
        distinguishing_aspect: "A Grower-role call to create a lot under a nonexistent grower id returns 403 ERR_INSUFFICIENT_PERMISSIONS (authorization p2) before any 404 (existence p3)."
        test_recipe:
          setup: ["a grower entity exists to authenticate as"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower U0", grower_code: "G-U0" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/growers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-28", original_weight_cwt: 100.00 }, as: Grower, as_user_id: "${g_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INSUFFICIENT_PERMISSIONS (http 403), not ERR_GROWER_NOT_FOUND"

      - name: c_assessment_pct_sum_returns_422
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_GRADE_PERCENT_SUM_INVALID]"
          - "validations[priority=9]"
        distinguishing_aspect: "us1 70 + us2 20 + cull 9.99 = 99.99 != 100.00 is rejected; the exact 100.00 sum passes."
        test_recipe:
          setup: ["BINNED lot"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower V", grower_code: "G-V" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed DF" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-28", original_weight_cwt: 100.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk, captures: { l_v: "$.data.version" } }
          trigger:
            - { call: "POST /potato-shed/field-lots/${l_id}/assessments", payload: { assessment_date: "2026-08-01", us1_pct: 70.0, us2_pct: 20.0, cull_pct: 9.99, cumulative_shrink_cwt: 0.00, expected_field_lot_version: "${l_v}" }, as: StorageManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_GRADE_PERCENT_SUM_INVALID (http 422); GET assessments shows zero records"

      - name: c_assessment_shrink_monotonic_and_capped_returns_422
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SHRINK_INVALID]"
          - "validations[priority=9]"
        distinguishing_aspect: "Cumulative shrink must be monotonic non-decreasing (30 then 25 rejected) and capped at original - packed - cull - condemned (600 on a 500 lot rejected)."
        test_recipe:
          setup: ["BINNED lot 500.00 with one assessment at cumulative 30.00"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower W", grower_code: "G-W" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed DG" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-28", original_weight_cwt: 500.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk, captures: { l_v: "$.data.version" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/assessments", payload: { assessment_date: "2026-08-01", us1_pct: 70.0, us2_pct: 20.0, cull_pct: 10.0, cumulative_shrink_cwt: 30.00, expected_field_lot_version: "${l_v}" }, as: StorageManager }
          trigger:
            - { call: "GET /potato-shed/field-lots/${l_id}", payload: {}, as: StorageManager, captures: { v2: "$.data.version" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/assessments", payload: { assessment_date: "2026-08-05", us1_pct: 70.0, us2_pct: 20.0, cull_pct: 10.0, cumulative_shrink_cwt: 25.00, expected_field_lot_version: "${v2}" }, as: StorageManager, captures: { err1: "$.data.error_id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/assessments", payload: { assessment_date: "2026-08-05", us1_pct: 70.0, us2_pct: 20.0, cull_pct: 10.0, cumulative_shrink_cwt: 600.00, expected_field_lot_version: "${v2}" }, as: StorageManager, captures: { err2: "$.data.error_id" } }
          assert:
            - "err1 == ERR_SHRINK_INVALID (25.00 < previous cumulative 30.00)"
            - "err2 == ERR_SHRINK_INVALID (600.00 > 500.00 available ceiling)"
            - "FieldLot.${l_id}.shrink_cwt remains 30.00"

      - name: c_condemn_without_channel_returns_400
        claim_type: conditional_validation
        grounds:
          - "errors[ERR_INVALID_REQUEST]"
          - "state_machines.FieldLot.ON_HOLD_to_CONDEMNED"
        distinguishing_aspect: "diversion_channel is conditionally required exactly when to_status == CONDEMNED: omitting it returns 400 ERR_INVALID_REQUEST while the lot stays ON_HOLD."
        test_recipe:
          setup: ["BINNED lot placed ON_HOLD"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower X", grower_code: "G-X" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed DH" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-28", original_weight_cwt: 100.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk }
            - { call: "POST /potato-shed/field-lots/${l_id}/quality-transition", payload: { to_status: "ON_HOLD" }, as: QualityAssuranceManager }
          trigger:
            - { call: "POST /potato-shed/field-lots/${l_id}/quality-transition", payload: { to_status: "CONDEMNED" }, as: QualityAssuranceManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400); quality_status remains ON_HOLD and condemned_cwt == 0"

      - name: c_order_conditional_fields_return_400
        claim_type: conditional_validation
        grounds:
          - "errors[ERR_INVALID_REQUEST]"
          - "entities.PackOrder.fields.contract_id"
          - "entities.PackOrder.fields.market_price_cents_per_cwt"
        distinguishing_aspect: "CONTRACT orders require contract_id and OPEN_MARKET orders require market_price_cents_per_cwt; omitting either returns 400 before any state or fiscal check."
        test_recipe:
          setup: ["shed exists"]
          setup_api_calls:
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed DI" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "CONTRACT", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 50.0, requested_packed_cwt: 10.00 }, as: SalesManager, captures: { err1: "$.data.error_id" } }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "OPEN_MARKET", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 50.0, requested_packed_cwt: 10.00 }, as: SalesManager, captures: { err2: "$.data.error_id" } }
          assert:
            - "err1 == ERR_INVALID_REQUEST (contract_id absent on CONTRACT) and err2 == ERR_INVALID_REQUEST (market price absent on OPEN_MARKET)"

      - name: c_run_close_draw_imbalance_returns_422
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_RUN_DRAW_IMBALANCE]"
          - "state_machines.PackRun.SCHEDULED_to_COMPLETED"
        distinguishing_aspect: "A COMPLETED close whose draw violates raw == packed + cull (100.00 != 70.00 + 20.00) is rejected and the run stays SCHEDULED."
        test_recipe:
          setup: ["allocated order (requested 75.00, reservation raw 100.00 at default blend 0.75) with a SCHEDULED run"]
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers", payload: { name: "Grower Y", grower_code: "G-Y" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed DJ" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-20", original_weight_cwt: 500.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk }
            - { call: "POST /potato-shed/contracts", payload: { buyer_name: "Buyer V", variety: "RUSSET_BURBANK", committed_volume_cwt: 300.00, price_cents_per_cwt: 2000, grade_min_us1_pct: 50.0, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z", priority_rank: 1 }, as: SalesManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "CONTRACT", contract_id: "${c_id}", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 50.0, requested_packed_cwt: 75.00, allocation_policy: "LOT_ASSESSMENT" }, as: SalesManager, captures: { o_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders/${o_id}/allocate", payload: {}, as: SalesManager }
            - { call: "POST /potato-shed/sheds/${s_id}/wash-water-checks", payload: { measured_at: "2026-08-02T06:00:00Z", turbidity_ntu: 2.0, chlorine_ppm: 100, water_temp_f: 50 }, as: QualityAssuranceManager }
            - { call: "POST /potato-shed/pack-orders/${o_id}/pack-runs", payload: { scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T10:00:00Z" }, as: PackLineSupervisor, captures: { r_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/pack-runs/${r_id}/close", payload: { outcome: "COMPLETED", draws: [ { field_lot_id: "${l_id}", raw_drawn_cwt: 100.00, packed_cwt: 70.00, us1_cwt: 60.00, us2_cwt: 10.00, cull_cwt: 20.00, cull_channel: "WASTE" } ] }, as: PackLineSupervisor, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_RUN_DRAW_IMBALANCE (100.00 != 70.00 + 20.00); PackRun.${r_id}.status remains SCHEDULED and lot weights are unchanged (available 500.00, reserved 100.00)"

      - name: c_run_close_draw_exceeds_reservation_returns_422
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_RUN_DRAW_EXCEEDS_RESERVATION]"
        distinguishing_aspect: "A balanced draw that exceeds the order's reservation for that lot by 0.01 raw cwt is rejected (boundary: reserved 100.00, drawn 100.01)."
        test_recipe:
          setup: ["same shape as draw-imbalance setup: reservation raw 100.00 on the lot, run SCHEDULED"]
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers", payload: { name: "Grower Z", grower_code: "G-Z" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
