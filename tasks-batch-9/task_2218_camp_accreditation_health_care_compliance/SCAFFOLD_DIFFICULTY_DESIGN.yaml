          assert:
            - "VisitAssignment.${asg_first_id}.travel_days == 3 and Visitor.${v_id}.committed_travel_days == 3 before the triggers"
            - "the 2026-09-05..2026-09-07 assignment returns 422 ERR_VISITOR_TRAVEL_CONFLICT even though the raw blocks 09-01..09-03 and 09-05..09-07 do not intersect"
            - "after the rejection Visitor.${v_id}.committed_travel_days == 3 and GET /accreditation/visit-assignments?visitor_id=${v_id} returns total_count == 1"
            - "the 2026-09-06..2026-09-08 assignment returns 201 with VisitAssignment.${asg_second_id}.travel_days == 3 and status == ASSIGNED"
            - "Visitor.${v_id}.committed_travel_days == 6 after the accepted assignment"
            - "AccreditationVisit.${visit_w_id}.team_size == 1 and AccreditationVisit.${visit_e_id}.team_size == 1"

      - name: controlled_dose_window_half_open_boundary_at_exactly_24_hours
        grounds:
          - validations.ERR_CONTROLLED_DOSE_WINDOW_EXCEEDED
          - calculations.controlled_substance_ledger
          - calculations.controlled_substance_ledger.constants.MAX_CONTROLLED_PER_24H
          - calculations.controlled_substance_ledger.constants.CONTROLLED_WINDOW_HOURS
          - entities.MedicationAdministrationRecord.fields.administered_at
          - entities.Camp.fields.controlled_on_hand_units
        distinguishing_aspect: |
          A different resource and a different interval semantics from the travel-buffer
          instance: the resource is a per-camper rolling dosing window on a camp health
          center, and the interval is HALF-OPEN at millisecond resolution. A dose at
          exactly 24 hours after the earliest prior dose still sees that dose because
          the lower bound is inclusive, while one millisecond later drops it - so the
          rejection and the acceptance differ by 0.001 seconds, and the upper bound is
          exclusive so the record being written never counts itself.
        test_recipe:
          setup:
            - "Mesa Day Camp is a DAY / YOUTH_ONLY camp in OH with health_staffing_level RN_ONSITE, which is rank 3 and therefore permits CONTROLLED administration, and its required level is only FIRST_AIDER_ONLY so compliance_posture is OPEN."
            - "The logical clock is advanced to 2026-08-11T12:00:00Z so all administration instants are in the past."
            - "The health center receives 100 controlled units, so controlled_intake_units and controlled_on_hand_units are both 100."
            - "Camper handle CR-77 already has two RECORDED CONTROLLED doses of 1 unit each, at 2026-08-10T08:00:00.000Z and 2026-08-10T14:00:00.000Z, both RN administered with a second signature."
            - "MAX_CONTROLLED_PER_24H is 2 over the half-open window [administered_at minus 24 hours, administered_at)."
          setup_api_calls:
            - call: "POST /accreditation/camps"
              payload: { name: "Mesa Day Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", program_elements: [], resident_census: 0, distance_to_hospital_km: 0, max_daily_census: 55, health_staffing_level: "RN_ONSITE", prior_accredited_cycle_count: 0 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T12:00:00Z" }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
            - call: "PATCH /accreditation/camps/${camp_id}/health-center"
              payload: { controlled_intake_units_added: 100 }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/medication-records"
              payload: { camp_id: "${camp_id}", camper_reference: "CR-77", medication_class: "CONTROLLED", dose_units: 1, administered_at: "2026-08-10T08:00:00.000Z", administered_by_role: "RN", second_signature_present: true }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
              captures: { mar1_id: "$.data.id" }
            - call: "POST /accreditation/medication-records"
              payload: { camp_id: "${camp_id}", camper_reference: "CR-77", medication_class: "CONTROLLED", dose_units: 1, administered_at: "2026-08-10T14:00:00.000Z", administered_by_role: "RN", second_signature_present: true }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
              captures: { mar2_id: "$.data.id" }
          trigger:
            - call: "POST /accreditation/medication-records"
              payload: { camp_id: "${camp_id}", camper_reference: "CR-77", medication_class: "CONTROLLED", dose_units: 1, administered_at: "2026-08-11T08:00:00.000Z", administered_by_role: "RN", second_signature_present: true }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/medication-records"
              payload: { camp_id: "${camp_id}", camper_reference: "CR-77", medication_class: "CONTROLLED", dose_units: 1, administered_at: "2026-08-11T08:00:00.001Z", administered_by_role: "RN", second_signature_present: true }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
              captures: { mar3_id: "$.data.id" }
          assert:
            - "Camp.${camp_id}.controlled_intake_units == 100 and controlled_on_hand_units == 98 before the triggers"
            - "MedicationAdministrationRecord.${mar1_id}.compliance_flag == COMPLIANT and MedicationAdministrationRecord.${mar2_id}.compliance_flag == COMPLIANT"
            - "the 2026-08-11T08:00:00.000Z record returns 422 ERR_CONTROLLED_DOSE_WINDOW_EXCEEDED, because the inclusive lower bound still catches the 2026-08-10T08:00:00.000Z dose"
            - "after the rejection Camp.${camp_id}.controlled_on_hand_units == 98 and GET /accreditation/medication-records?camp_id=${camp_id} returns total_count == 2"
            - "the 2026-08-11T08:00:00.001Z record returns 201, because shifting the window start by one millisecond drops the earliest dose and leaves only one in the window"
            - "MedicationAdministrationRecord.${mar3_id}.record_status == RECORDED and compliance_flag == COMPLIANT"
            - "Camp.${camp_id}.controlled_on_hand_units == 97 and controlled_intake_units == 100 after the accepted record"

  # ==========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: controlled_ledger_and_dosing_window_restored_exactly_after_void
        grounds:
          - endpoints.POST_/accreditation/medication-records/{recordId}/void
          - calculations.controlled_substance_ledger
          - entities.Camp.fields.controlled_on_hand_units
          - entities.Camp.fields.controlled_intake_units
          - entities.MedicationAdministrationRecord.fields.record_status
          - validations.ERR_CONTROLLED_DOSE_WINDOW_EXCEEDED
        distinguishing_aspect: |
          The conserved quantity is physical stock, and the void must restore TWO
          derived quantities at once: controlled_on_hand_units returns to its exact
          pre-record value while the cumulative controlled_intake_units never moves,
          and the voided record also vacates the per-camper 24 hour dosing window so a
          replacement dose that would otherwise be rejected is admitted. An
          implementation that decrements intake on void, or that leaves VOIDED rows in
          the window count, fails one half each.
        test_recipe:
          setup:
            - "Mica Day Camp is a DAY / YOUTH_ONLY camp in OH with health_staffing_level RN_ONSITE, so CONTROLLED administration is permitted and compliance_posture is OPEN."
            - "The logical clock is advanced to 2026-08-11T12:00:00Z."
            - "The health center receives 100 controlled units, so controlled_intake_units and controlled_on_hand_units are both 100."
            - "Camper handle CR-88 receives two RECORDED CONTROLLED doses of 2 units each, at 2026-08-11T08:00:00.000Z and 2026-08-11T09:00:00.000Z, driving controlled_on_hand_units to 96."
          setup_api_calls:
            - call: "POST /accreditation/camps"
              payload: { name: "Mica Day Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", program_elements: [], resident_census: 0, distance_to_hospital_km: 0, max_daily_census: 55, health_staffing_level: "RN_ONSITE", prior_accredited_cycle_count: 0 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T12:00:00Z" }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
            - call: "PATCH /accreditation/camps/${camp_id}/health-center"
              payload: { controlled_intake_units_added: 100 }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/medication-records"
              payload: { camp_id: "${camp_id}", camper_reference: "CR-88", medication_class: "CONTROLLED", dose_units: 2, administered_at: "2026-08-11T08:00:00.000Z", administered_by_role: "RN", second_signature_present: true }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
              captures: { mar_a_id: "$.data.id" }
            - call: "POST /accreditation/medication-records"
              payload: { camp_id: "${camp_id}", camper_reference: "CR-88", medication_class: "CONTROLLED", dose_units: 2, administered_at: "2026-08-11T09:00:00.000Z", administered_by_role: "RN", second_signature_present: true }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
              captures: { mar_b_id: "$.data.id" }
          trigger:
            - call: "POST /accreditation/medication-records"
              payload: { camp_id: "${camp_id}", camper_reference: "CR-88", medication_class: "CONTROLLED", dose_units: 2, administered_at: "2026-08-11T10:00:00.000Z", administered_by_role: "RN", second_signature_present: true }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/medication-records/${mar_b_id}/void"
              payload: { void_reason: "wrong camper handle transcribed" }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/medication-records"
              payload: { camp_id: "${camp_id}", camper_reference: "CR-88", medication_class: "CONTROLLED", dose_units: 2, administered_at: "2026-08-11T10:00:00.000Z", administered_by_role: "RN", second_signature_present: true }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
              captures: { mar_c_id: "$.data.id" }
          assert:
            - "Camp.${camp_id}.controlled_on_hand_units == 96 and controlled_intake_units == 100 before the triggers"
            - "the first 2026-08-11T10:00:00.000Z record returns 422 ERR_CONTROLLED_DOSE_WINDOW_EXCEEDED because two RECORDED doses sit in the window"
            - "MedicationAdministrationRecord.${mar_b_id}.record_status == VOIDED with void_reason recorded after the void"
            - "Camp.${camp_id}.controlled_on_hand_units == 98 after the void, exactly the value it held before ${mar_b_id} was written, with no drift"
            - "Camp.${camp_id}.controlled_intake_units == 100 after the void, so the cumulative intake ledger is untouched by the compensation"
            - "the replayed 2026-08-11T10:00:00.000Z record returns 201, proving the void also vacated the per-camper dosing window"
            - "Camp.${camp_id}.controlled_on_hand_units == 96 and controlled_intake_units == 100 after the replacement dose, back to the same conserved pair"
            - "MedicationAdministrationRecord.${mar_a_id}.record_status == RECORDED and MedicationAdministrationRecord.${mar_c_id}.record_status == RECORDED, so exactly two doses of 2 units are charged against stock"

      - name: visitor_committed_travel_days_restored_exactly_after_withdrawal
        grounds:
          - endpoints.POST_/accreditation/visit-assignments/{assignmentId}/withdraw
          - calculations.visitor_travel_commitment
          - entities.Visitor.fields.committed_travel_days
          - entities.AccreditationVisit.fields.team_size
          - entities.AccreditationVisit.fields.lead_visitor_id
          - validations.ERR_VISITOR_TRAVEL_CONFLICT
        distinguishing_aspect: |
          The conserved quantity here is scheduling capacity in days rather than
          physical stock, and the compensation has to unwind THREE derived values -
          the visitor's committed_travel_days, the visit's team_size and its
          lead_visitor_id - and also release the buffered calendar interval, which is
          proved by re-seating the same visitor on the identical block afterwards. The
          co-visitor's seat must be left alone, so a blanket recompute that zeroes the
          whole visit is caught.
        test_recipe:
          setup:
            - "Standards edition ACA-2026-P is PUBLISHED with SU.1 SUPERVISION mandatory scoring_weight 1, universal."
            - "Camp NORTH is a DAY / YOUTH_ONLY camp in OH with a 2026 cycle and a DRAFT visit for the window 2026-09-01..2026-09-10."
            - "Visitor CAPTAIN lives in PA with LEAD_VISITOR and visitor CREW lives in NY; both are seated on the DRAFT visit for the closed travel block 2026-09-01..2026-09-03, CAPTAIN as LEAD and CREW as MEMBER."
            - "The visit is never scheduled, so no cycle reversion cascade can confuse the ledger arithmetic."
          setup_api_calls:
            - call: "POST /accreditation/standards-sets"
              payload: { edition_code: "ACA-2026-P", effective_year: 2026 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { pset_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${pset_id}", code: "SU.1", title: "Staff supervision ratios", domain: "SUPERVISION", mandatory: true, scoring_weight: 1 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards-sets/${pset_id}/publish"
              payload: {}
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "North Day Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", program_elements: [], resident_census: 0, distance_to_hospital_km: 0, max_daily_census: 50, health_staffing_level: "FIRST_AIDER_ONLY", prior_accredited_cycle_count: 0 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id", camp_v: "$.data.version" }
            - call: "POST /accreditation/cycles"
              payload: { camp_id: "${camp_id}", standards_set_id: "${pset_id}", cycle_year: 2026, expected_camp_version: "${camp_v}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cyc_id: "$.data.id" }
            - call: "GET /accreditation/cycles/${cyc_id}"
              payload: {}
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cyc_v: "$.data.version" }
            - call: "POST /accreditation/visits"
              payload: { cycle_id: "${cyc_id}", window_start_date: "2026-09-01", window_end_date: "2026-09-10", expected_cycle_version: "${cyc_v}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { visit_id: "$.data.id" }
            - call: "POST /accreditation/visitors"
              payload: { full_name: "Captain Visitor", home_state_code: "PA", trained_through_year: 2026, certifications: ["LEAD_VISITOR"] }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { v_lead_id: "$.data.id" }
            - call: "POST /accreditation/visitors"
              payload: { full_name: "Crew Visitor", home_state_code: "NY", trained_through_year: 2026, certifications: [] }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { v_mem_id: "$.data.id" }
            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "${visit_id}", visitor_id: "${v_lead_id}", team_role: "LEAD", travel_block_start_date: "2026-09-01", travel_block_end_date: "2026-09-03" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { asg_lead_id: "$.data.id" }
            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "${visit_id}", visitor_id: "${v_mem_id}", team_role: "MEMBER", travel_block_start_date: "2026-09-01", travel_block_end_date: "2026-09-03" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { asg_mem_id: "$.data.id" }
          trigger:
            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "${visit_id}", visitor_id: "${v_lead_id}", team_role: "MEMBER", travel_block_start_date: "2026-09-02", travel_block_end_date: "2026-09-04" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/visit-assignments/${asg_lead_id}/withdraw"
              payload: { withdrawal_reason: "family emergency" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "${visit_id}", visitor_id: "${v_lead_id}", team_role: "LEAD", travel_block_start_date: "2026-09-01", travel_block_end_date: "2026-09-03" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { asg_reseat_id: "$.data.id" }
          assert:
            - "before the triggers VisitAssignment.${asg_lead_id}.travel_days == 3, Visitor.${v_lead_id}.committed_travel_days == 3, AccreditationVisit.${visit_id}.team_size == 2 and lead_visitor_id == ${v_lead_id}"
            - "the 2026-09-02..2026-09-04 double-booking attempt returns 422 ERR_VISITOR_TRAVEL_CONFLICT, so the interval was genuinely held"
            - "after the withdrawal VisitAssignment.${asg_lead_id}.status == WITHDRAWN with withdrawal_reason recorded"
            - "after the withdrawal Visitor.${v_lead_id}.committed_travel_days == 0, exactly its pre-assignment value, with no residue from the withdrawn seat"
            - "after the withdrawal AccreditationVisit.${visit_id}.team_size == 1 and lead_visitor_id == null"
            - "VisitAssignment.${asg_mem_id}.status == ASSIGNED and Visitor.${v_mem_id}.committed_travel_days == 3 are untouched by the compensation"
            - "the re-seat on the identical block 2026-09-01..2026-09-03 returns 201, proving the buffered interval was released and not merely marked"
            - "after the re-seat VisitAssignment.${asg_reseat_id}.travel_days == 3, Visitor.${v_lead_id}.committed_travel_days == 3, AccreditationVisit.${visit_id}.team_size == 2 and lead_visitor_id == ${v_lead_id}"
            - "AccreditationVisit.${visit_id}.status == DRAFT throughout and AccreditationCycle.${cyc_id}.status == SELF_ASSESSMENT throughout"
