  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispatch_blocked_when_membership_lapsed
        grounds:
          - validations[priority=9]
          - state_machines.ServiceCall.REQUESTED_to_DISPATCHED
          - state_machines.Membership.ACTIVE_to_LAPSED
        distinguishing_aspect: |
          ServiceCall creation depends on Membership state (entity pair
          ServiceCall -> Membership): an administratively LAPSED membership cannot open
          new calls even though the household member is ACTIVE and the tier has
          remaining cap.
        test_recipe:
          setup:
            - "M1 CLASSIC ACTIVE with primary household member; then M1 administratively lapsed (no open calls)"
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club_nca: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club_nca}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /motor-club/memberships/${m1}/household-members"
              payload: { full_name: "Pat Primary", relationship: "SPOUSE", date_of_birth: "1980-01-01T00:00:00Z", is_primary: true }
              as: MemberServicesRep
              captures: { hm1: $.data.id }
            - call: "POST /motor-club/memberships/${m1}/lapse"
              payload: {}
              as: MemberServicesRep
          trigger:
            - call: "POST /motor-club/service-calls"
              payload: { membership_id: "${m1}", requesting_member_id: "${hm1}", service_type: "TOW", breakdown_location_state: "CA", requested_tow_miles: 10 }
              as: Dispatcher
              captures: { err1: $.data.error_id }
          assert:
            - "error_id == ERR_MEMBERSHIP_NOT_SERVICEABLE, http 422"
            - "no ServiceCall row created for ${m1}"
      - name: provider_suspend_blocked_by_open_dispatch
        grounds:
          - state_machines.ServiceProvider.ACTIVE_to_SUSPENDED
          - state_machines.Dispatch.ASSIGNED_to_ACCEPTED
          - calculations.dispatch_provider_selection
        distinguishing_aspect: |
          ServiceProvider suspension depends on Dispatch state (entity pair
          ServiceProvider -> Dispatch): PUT status SUSPENDED is rejected with
          ERR_PROVIDER_BUSY while the provider holds a non-terminal dispatch, and
          succeeds after that dispatch completes — a different entity pair than
          ServiceCall -> Membership.
        test_recipe:
          setup:
            - "Provider P1 holds one ASSIGNED dispatch for an in-progress call"
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club_nca: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club_nca}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /motor-club/memberships/${m1}/household-members"
              payload: { full_name: "Pat Primary", relationship: "SPOUSE", date_of_birth: "1980-01-01T00:00:00Z", is_primary: true }
              as: MemberServicesRep
              captures: { hm1: $.data.id }
            - call: "POST /motor-club/providers"
              payload: { servicing_club_id: "${club_nca}", name: "NCA Fleet 1", provider_kind: "OWNED", capabilities: ["TOW"], home_base_state_code: "CA", sla_multiplier: 1.0, shift_start_minute: 0, shift_end_minute: 0, max_concurrent_dispatches: 2 }
              as: ClubAdmin
              captures: { p1: $.data.id }
            - call: "POST /motor-club/service-calls"
              payload: { membership_id: "${m1}", requesting_member_id: "${hm1}", service_type: "TOW", breakdown_location_state: "CA", requested_tow_miles: 10 }
              as: Dispatcher
              captures: { c1: $.data.id, c1v: $.data.version }
            - call: "POST /motor-club/service-calls/${c1}/dispatch"
              payload: { expected_service_call_version: "${c1v}" }
              as: Dispatcher
              captures: { d1: $.data.id }
          trigger:
            - call: "PUT /motor-club/providers/${p1}"
              payload: { status: "SUSPENDED" }
              as: ClubAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /motor-club/dispatches/${d1}/accept"
              payload: { en_route: true }
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d1}/arrive"
              payload: {}
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d1}/complete"
              payload: { actual_tow_miles: 5 }
              as: ProviderOps
            - call: "PUT /motor-club/providers/${p1}"
              payload: { status: "SUSPENDED" }
              as: ClubAdmin
              captures: { p1_status: $.data.status }
          assert:
            - "first suspend attempt error_id == ERR_PROVIDER_BUSY (http 422) while dispatch ASSIGNED"
            - "after completion the same PUT succeeds and provider status == SUSPENDED"
            - "suspended provider is excluded from subsequent dispatch candidate pools"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: provider_shift_window_half_open_eligibility
        grounds:
          - calculations.dispatch_provider_selection
          - entities.ServiceProvider.fields.shift_start_minute
          - entities.ServiceProvider.fields.shift_end_minute
        distinguishing_aspect: |
          Interval semantics = point-in-window with half-open bounds: at exactly
          shift_start the provider IS eligible, at exactly shift_end it is NOT
          ([start, end)), and start == end means 24x7 (always eligible). Resource is the
          provider's availability window — eligibility flips at the exact minute.
        test_recipe:
          setup:
            - "Single TOW provider with shift [480, 960) (08:00-16:00); one call dispatched at 08:00 sharp (selected), then after that dispatch completes, clock moved to 16:00 sharp and a new call finds the pool empty"
          setup_api_calls:
