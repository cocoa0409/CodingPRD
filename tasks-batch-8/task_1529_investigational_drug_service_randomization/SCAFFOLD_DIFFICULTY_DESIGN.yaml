            - { call: "POST /api/kits/${k1}/release", as: Pharmacist, as_user_id: "${p1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STUDY_NOT_ACTIVE (kit release requires the parent study ACTIVE)"
            - "Kit.${k1}.status remains QUARANTINED_RECEIPT"
