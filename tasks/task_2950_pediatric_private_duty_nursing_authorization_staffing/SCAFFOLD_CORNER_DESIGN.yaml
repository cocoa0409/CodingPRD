              payload: { plan_of_care_id: "${poc_id}", payer_id: "${payer_id}", approved_hours_per_week: 90, effective_start: "2026-08-03T00:00:00Z", effective_end: "2026-11-01T00:00:00Z", expected_plan_of_care_version: "${poc_v}" }
              as: PayerReviewer
