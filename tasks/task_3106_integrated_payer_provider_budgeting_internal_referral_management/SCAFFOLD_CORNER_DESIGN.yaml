            - "Provider.${p1}.comp_total_cents == base_component_cents + panel_capitation_component_cents + quality_bonus_cents with quality_bonus_cents == 0 while quality_score is below 85"
            - "POST /providers/${p1}/compensation-model with the same fields succeeds for SALARY, PANEL_CAPITATION and QUALITY_BONUS with volume_component_cents still 0"

  # ===========================================================================
  - section: validations
    instances:

      - name: member_create_without_user_context_headers_returns_context_header_error
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "The priority-1 auth check runs before existence and state, so a request missing X-User-Role returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER even when the path id is also unknown."
        test_recipe:
          setup:
            - "Logical clock default. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /regions/00000000-0000-4000-8000-000000000000/members"
              payload: { member_ref: "M-HEADER", plan_product: "COMMERCIAL_HMO", benefit_tier: "TIER_1", risk_score: 1.0, coverage_effective_date: "2026-09-01T00:00:00Z" }
              as: RegionalFinanceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "error_id != ERR_REGION_NOT_FOUND, proving the header check outranks path existence"

      - name: care_team_member_cannot_create_a_region
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors.ERR_INSUFFICIENT_PERMISSIONS
          - roles.CareTeamMember
        distinguishing_aspect: "Region creation is exclusive to PlatformAdmin, so CareTeamMember is refused with 403 ERR_INSUFFICIENT_PERMISSIONS before any business check."
        test_recipe:
          setup:
            - "Logical clock default. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /regions"
              payload: { name: "Forbidden Region", state_codes: ["CA"], margin_target_pct: 0.03, capitation_index: 1.0 }
              as: CareTeamMember
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "GET /regions returns 0 rows"

      - name: appointment_with_a_department_in_another_region_returns_cross_region_reference
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=5]
          - errors.ERR_CROSS_REGION_REFERENCE
        distinguishing_aspect: "A member from one region booked into the other region's department is rejected as a cross-region body reference even though both rows exist."
        test_recipe:
          setup:
            - "Logical clock default; two regions each with a site, department, provider and member."
          setup_api_calls:
            - *c_clock
            - *c_region
            - call: "POST /regions"
              payload: { name: "Other Region", state_codes: ["NV"], margin_target_pct: 0.03, capitation_index: 1.0 }
              as: PlatformAdmin
              captures: { r2: $.data.id }
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
            - call: "POST /regions/${r2}/care-sites"
              payload: { site_name: "Other Medical Office", site_type: "MEDICAL_OFFICE", licensed_beds: 0, staffing_fte_budget: 10.0, facility_investment_budget_cents: 2000000 }
              as: RegionalFinanceOfficer
              captures: { cs2: $.data.id }
            - call: "POST /care-sites/${cs2}/departments"
              payload: { specialty: "PRIMARY_CARE", appointment_slots_budgeted: 200, wait_threshold_days: 14 }
              as: AccessScheduler
              captures: { d2: $.data.id }
            - call: "POST /care-sites/${cs2}/providers"
              payload: { provider_name: "Dr Other", specialty: "PRIMARY_CARE", compensation_model: "SALARY", base_component_cents: 1250000, panel_size_target: 1000 }
              as: RegionalFinanceOfficer
              captures: { p2: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { department_id: "${d2}", provider_id: "${p2}", member_id: "${m1}", appointment_type: "ROUTINE", start_utc: "2026-09-10T09:00:00Z", duration_minutes: 20, expected_member_version: "${m1_v}" }
              as: AccessScheduler
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_CROSS_REGION_REFERENCE"
            - "GET /appointments?member_id=${m1} returns 0 rows"
            - "error_id != ERR_DEPARTMENT_NOT_FOUND and error_id != ERR_MEMBER_NOT_FOUND"

      - name: referral_decision_after_triage_window_returns_window_expired
        claim_type: Temporal validation
        grounds:
          - validations[priority=7]
          - errors.ERR_REFERRAL_TRIAGE_WINDOW_EXPIRED
        distinguishing_aspect: "A referral decision outside created_at + REFERRAL_TRIAGE_WINDOW_DAYS is rejected as ERR_REFERRAL_TRIAGE_WINDOW_EXPIRED even while the referral is still PENDING_TRIAGE."
        test_recipe:
