      - name: pricing_violation_penalty_min_and_multiplier
        claim_type: constants_applied
        grounds: ["calculations.policy_violation_penalty"]
        distinguishing_aspect: "STREET_PRICING penalty = max(5000, 2 * overcharge): overcharge 2,000 hits the 5,000-cent floor; overcharge 10,000 doubles to 20,000."
        test_recipe:
          setup: ["ACTIVE lease"]
          setup_api_calls:
