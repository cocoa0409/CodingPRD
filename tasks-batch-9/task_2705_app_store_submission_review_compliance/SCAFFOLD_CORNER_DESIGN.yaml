            - "the response status is 409 and error.error_id == ERR_REMEDIATION_INCOMPLETE"
            - "ImpactAssessment.${ia_id}.status == REMEDIATION_REQUIRED"
            - "ImpactAssessment.${ia_id}.remediated_at is null"

      - name: re_passing_the_staled_mapping_then_marking_remediated_closes_the_assessment
        claim_type: Valid Transition
        grounds:
          - state_machines.FeatureMapping.transitions.STALE_to_IN_PROGRESS
          - state_machines.ImpactAssessment.transitions.REMEDIATION_REQUIRED_to_REMEDIATED
          - calculations.feature_compliance_index
        distinguishing_aspect: "The remediation path walks the index through three values in order - 50.00 STALE, 25.00 IN_PROGRESS, 100.00 PASSED - and only then does MARK_REMEDIATED succeed, stamping remediated_at 2026-08-01T00:00:00Z and clearing the posture to OPEN."
        test_recipe:
          setup:
            - "The impact assessment is REMEDIATION_REQUIRED; its one affected mapping has been restarted and re-passed with a fresh evidence_ref."
          setup_api_calls:
            - *c_clock
            - *c_acct
            - *c_cert
            - *c_acct_reread
            - *c_cert_act
            - *c_prof
            - *c_prof_act
            - *c_app
            - *c_rule
            - *c_rule_pub
            - *c_map
            - *c_map_start
            - *c_map_pass
            - *c_rule_v2
            - *c_rule_v2_pub
            - *c_ia_list
            - *c_ia_start
            - *c_ia_require
            - *c_map_start
