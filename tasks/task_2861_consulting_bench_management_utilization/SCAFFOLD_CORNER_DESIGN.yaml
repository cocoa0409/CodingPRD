          - validations[priority=33]
          - calculations.discount_tier_and_margin
          - calculations.utilization_period_metrics
        distinguishing_aspect: "Two rules are pushed to the exact value they permit and both operations succeed: a discount of exactly 35.00% (the hard cap) is accepted as a PENDING L2_FINANCE request, and a period whose period_end_on is exactly one day before the clock closes cleanly, switching its variant of record."
        test_recipe:
          setup:
            - "Clock 2026-08-03. NA group, CLOUD_ARCH skill, one CONSULTANT-level consultant with no assignments, one QUALIFIED demand at standard 250.00 with min_proficiency_level 3."
            - "An OPEN UtilizationPeriod [2026-08-03, 2026-08-28] with the default holiday_hours 0.00: capacity_hours 160.00, net_available_hours 160.00, billable_hours 0.00."
            - "The clock then moves to 2026-08-29, exactly one day past period_end_on."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: FinanceController
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
