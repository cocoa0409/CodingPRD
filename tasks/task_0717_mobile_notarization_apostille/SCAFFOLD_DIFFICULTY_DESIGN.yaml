          - entities.LoanPackage.fields.package_fee_cents
          - entities.LoanPackage.fields.scrub_passed
        distinguishing_aspect: "Conserved quantity = LoanPackage.package_fee_cents baseline. Forward scrub computes package_fee_cents>0/scrub_passed=true; the compensating unscrub MUST restore package_fee_cents==0 and scrub_passed==false exactly, leaving no drift in the fee field."
        test_recipe:
          setup:
            - "LOAN_SIGNING request with one DEED document (signing_fee_cents=5000); LoanPackage DRAFT with discount 0; scrub then unscrub."
          setup_api_calls:
            - call: "POST /notary/fee-schedules"
              payload: { state_code: "CA", per_stamp_cents: 1500, travel_base_cents: 4000, travel_per_mile_cents: 100, ron_surcharge_cents: 2500, state_cap_cents: 20000 }
              as: CoordinatorOps
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme", default_state_code: "CA" }
              as: CoordinatorOps
              captures: { acct_id: $.data.id }
            - call: "POST /notary/notaries"
              payload: { account_id: "${acct_id}", full_name: "Nora", commission_state: "CA", commission_expires_at: "2027-01-01T00:00:00Z", ron_authorized: true, nsa_certified: true }
              as: CoordinatorOps
              captures: { not_id: $.data.id }
            - call: "POST /notary/signers"
              payload: { account_id: "${acct_id}", full_name: "Sam", email: "s@x.com", id_doc_type: "DRIVERS_LICENSE" }
              as: CoordinatorOps
              captures: { signer_id: $.data.id }
            - call: "POST /notary/requests"
              payload: { account_id: "${acct_id}", signer_id: "${signer_id}", state_code: "CA", doc_category: "LOAN_SIGNING", delivery_mode: "MOBILE", expected_stamp_count: 1 }
              as: CoordinatorOps
              captures: { req_id: $.data.id }
            - call: "POST /notary/documents"
              payload: { request_id: "${req_id}", title: "Deed", doc_type: "DEED", signing_fee_cents: 5000 }
              as: CoordinatorOps
            - call: "POST /notary/loan-packages"
              payload: { request_id: "${req_id}", lender_ref: "LN-9", package_discount_pct: 0 }
              as: Notary
              as_user_id: "${not_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /notary/loan-packages/${pkg_id}/scrub"
              payload: {}
              as: Notary
              as_user_id: "${not_id}"
              captures: { fee_after_scrub: $.data.package_fee_cents }
          trigger:
            - call: "POST /notary/loan-packages/${pkg_id}/unscrub"
              payload: {}
              as: Notary
              as_user_id: "${not_id}"
              captures: { fee_after_unscrub: $.data.package_fee_cents }
          assert:
            - "LoanPackage.${pkg_id}.package_fee_cents == 0"
            - "LoanPackage.${pkg_id}.scrub_passed == false"
            - "LoanPackage.${pkg_id}.status == DRAFT"

      - name: request_assign_revise_preserves_notary_session_count_invariant
        grounds:
          - state_machines.SigningRequest.QUOTED_to_ASSIGNED
          - state_machines.SigningRequest.ASSIGNED_to_DRAFT
          - calculations.notary_active_session_count
          - entities.Notary.fields.active_session_count
        distinguishing_aspect: "Conserved quantity = Notary.active_session_count (a different conserved quantity than package fee). Assigning then scheduling a session raises it to 1; the compensating revise cancels the SCHEDULED session, and active_session_count MUST return to 0 with no drift."
        test_recipe:
          setup:
            - "ASSIGNED request with one SCHEDULED session on the notary, so active_session_count==1 before revise."
          setup_api_calls:
            - call: "POST /notary/fee-schedules"
              payload: { state_code: "CA", per_stamp_cents: 1500, travel_base_cents: 4000, travel_per_mile_cents: 100, ron_surcharge_cents: 2500, state_cap_cents: 20000 }
