        distinguishing_aspect: |
          Entity pair Case -> ProgramEnrollment: POST /program-enrollments is valid only while
          the referenced Case has service_status == ACTIVE; the same request against a PLANNING
          case fails with ERR_CASE_NOT_ACTIVE and succeeds once the case reaches ACTIVE.
        test_recipe:
          setup:
            - "Case driven to PLANNING (verified assessment, no ACTIVE plan yet); program OPEN"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "Mgr Two", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr2_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Nadia Client", preferred_language: "ar", date_of_birth: "1997-03-03", household_size: 1 }
              as: IntakeSpecialist
              captures: { cli_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cli_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /assessments"
              payload: { case_id: "${case_id}", housing_score: 1, employment_score: 1, education_score: 1, language_score: 1, health_score: 1 }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/submit"
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /assessments/${asmt_id}/verify"
              as: CaseManager
              as_user_id: "${mgr2_id}"
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "ASSESSED" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "PLANNING" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_v2: $.data.version }
            - call: "POST /programs"
              payload: { name: "ESOL Eve", kind: "ESOL", capacity: 5, base_fee_cents: 0, cost_per_completion_cents: 12000 }
              as: CenterAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /program-enrollments"
              payload: { case_id: "${case_id}", program_id: "${prog_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /cases/${case_id}/plans"
              payload: { title: "Plan P", budgeted_hours: 5, expected_case_version: "${case_v2}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /program-enrollments"
              payload: { case_id: "${case_id}", program_id: "${prog_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { enr_id: $.data.id, enr_stat: $.data.status }
          assert:
            - "While case is PLANNING: error ERR_CASE_NOT_ACTIVE"
            - "After case reaches ACTIVE: creation succeeds with status APPLIED"

      - name: referral_send_requires_organization_active
        grounds:
          - state_machines.Referral.DRAFT_to_SENT
          - errors[ERR_ORG_SUSPENDED]
        distinguishing_aspect: |
          Entity pair Organization -> Referral: with consent present and posture STANDARD, the
          send still fails with ERR_ORG_SUSPENDED when the partner is SUSPENDED, and succeeds
          after reactivation — a different entity pair than Case -> ProgramEnrollment.
        test_recipe:
          setup:
            - "Client WITH REFERRAL_SHARE consent; case INTAKE; org SUSPENDED; DRAFT referral to it"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Omar Client", preferred_language: "ar", date_of_birth: "1991-05-05", household_size: 2 }
              as: IntakeSpecialist
              captures: { cli_id: $.data.id }
            - call: "POST /consents"
              payload: { client_id: "${cli_id}", scope: "REFERRAL_SHARE" }
              as: CenterAdmin
            - call: "POST /cases"
              payload: { client_id: "${cli_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_id: $.data.id }
            - call: "POST /organizations"
              payload: { name: "Org Z", service_categories: ["EMPLOYMENT"], referral_capacity: 3, contact_email: "z@org.test" }
              as: CenterAdmin
              captures: { org_id: $.data.id }
            - call: "POST /organizations/${org_id}/suspend"
              as: CenterAdmin
            - call: "POST /referrals"
              payload: { case_id: "${case_id}", organization_id: "${org_id}", service_category: "EMPLOYMENT" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_id}/send"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /organizations/${org_id}/reactivate"
              as: CenterAdmin
            - call: "POST /referrals/${ref_id}/send"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { ref_stat: $.data.status }
          assert:
            - "While org is SUSPENDED: error ERR_ORG_SUSPENDED and referral remains DRAFT"
            - "After reactivate: send succeeds, Referral.${ref_id}.status == SENT"

  - rule_id: resource_temporal_overlap
    instances:
      - name: advocate_half_open_interval_adjacency
        grounds:
          - calculations.advocate_schedule_conflict
          - errors[ERR_ADVOCATE_TIME_CONFLICT]
        distinguishing_aspect: |
          Resource: StaffMember (advocate). Semantics: half-open [start, end) — an appointment
          starting exactly at the existing one's end is legal (adjacency allowed) while one
          overlapping by 30 minutes conflicts. Different interval semantics and resource than
          the room rule.
        test_recipe:
          setup:
            - "Case INTAKE; advocate mgr holds appointment 2026-08-10 10:00-11:00 (REQUESTED counts as occupying)"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Petra Client", preferred_language: "uk", date_of_birth: "1998-01-19", household_size: 1 }
              as: IntakeSpecialist
              captures: { cli_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cli_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_id: $.data.id }
            - call: "POST /appointments"
              payload: { case_id: "${case_id}", advocate_id: "${mgr1_id}", kind: "DOCUMENT_ID", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T11:00:00Z" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { appt1_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { case_id: "${case_id}", advocate_id: "${mgr1_id}", kind: "ORIENTATION", starts_at: "2026-08-10T11:00:00Z", ends_at: "2026-08-10T12:00:00Z" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { appt2_id: $.data.id }
            - call: "POST /appointments"
              payload: { case_id: "${case_id}", advocate_id: "${mgr1_id}", kind: "BENEFITS", starts_at: "2026-08-10T11:30:00Z", ends_at: "2026-08-10T12:30:00Z" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "11:00-12:00 adjacent to 10:00-11:00: created (half-open adjacency is not a conflict)"
            - "11:30-12:30 overlapping 11:00-12:00: ERR_ADVOCATE_TIME_CONFLICT"

      - name: room_buffered_closed_interval_touch
        grounds:
          - calculations.room_schedule_conflict
          - errors[ERR_ROOM_TIME_CONFLICT]
        distinguishing_aspect: |
          Resource: Room. Semantics: buffered CLOSED interval (+-15 min turnover, endpoints
          inclusive) — even a gap of exactly 30 minutes conflicts because the buffered endpoints
          touch, while 31 minutes passes. Adjacency-allowed half-open arithmetic (advocate rule)
          would accept the 30-minute gap; the closed-buffer semantics reject it.
        test_recipe:
          setup:
            - "Room R hosts SCHEDULED session 2026-08-10 10:00-11:00"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Room R", capacity: 25 }
              as: CenterAdmin
              captures: { room_id: $.data.id }
            - call: "POST /workshop-sessions"
              payload: { room_id: "${room_id}", title: "Session 1", capacity: 10, starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T11:00:00Z" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { sess1_id: $.data.id }
          trigger:
            - call: "POST /workshop-sessions"
              payload: { room_id: "${room_id}", title: "Session 30-gap", capacity: 10, starts_at: "2026-08-10T11:30:00Z", ends_at: "2026-08-10T12:30:00Z" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /workshop-sessions"
              payload: { room_id: "${room_id}", title: "Session 31-gap", capacity: 10, starts_at: "2026-08-10T11:31:00Z", ends_at: "2026-08-10T12:30:00Z" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { sess2_id: $.data.id }
          assert:
            - "11:30 start (30-minute gap == 2*BUFFER_MIN, buffered endpoints touch at 11:15): ERR_ROOM_TIME_CONFLICT (closed-interval touch counts as conflict)"
            - "11:31 start (31-minute gap): created successfully"

  - rule_id: compensating_invariant
    instances:
      - name: workshop_seat_conservation_across_enroll_cancel
        grounds:
          - calculations.workshop_seat_allocation
          - entities.WorkshopSession.fields.open_seats
          - state_machines.WorkshopEnrollment.transitions
        distinguishing_aspect: |
          Conserved quantity: workshop seats. enrolled_count + open_seats == capacity must hold
          before, during, and after a forward enroll paired with its compensating cancel — no
          seat drift (and no waitlist present to mask drift via promotion).
        test_recipe:
          setup:
            - "Session capacity 2; case A enrolled (enrolled_count 1, open_seats 1)"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Room S", capacity: 30 }
              as: CenterAdmin
              captures: { room_id: $.data.id }
            - call: "POST /workshop-sessions"
              payload: { room_id: "${room_id}", title: "Seat Session", capacity: 2, starts_at: "2026-08-20T10:00:00Z", ends_at: "2026-08-20T11:00:00Z" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Qin A", preferred_language: "zh", date_of_birth: "1990-02-02", household_size: 1 }
              as: IntakeSpecialist
              captures: { clia_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Qin B", preferred_language: "zh", date_of_birth: "1990-02-03", household_size: 1 }
              as: IntakeSpecialist
              captures: { clib_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${clia_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { casea_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${clib_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { caseb_id: $.data.id }
            - call: "POST /workshop-enrollments"
              payload: { session_id: "${sess_id}", case_id: "${casea_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { ea_id: $.data.id }
          trigger:
            - call: "POST /workshop-enrollments"
              payload: { session_id: "${sess_id}", case_id: "${caseb_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { eb_id: $.data.id }
            - call: "GET /workshop-sessions/${sess_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { enr_mid: $.data.enrolled_count, open_mid: $.data.open_seats }
            - call: "POST /workshop-enrollments/${eb_id}/cancel"
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "GET /workshop-sessions/${sess_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { enr_end: $.data.enrolled_count, open_end: $.data.open_seats }
          assert:
            - "After forward enroll: enrolled_count == 2, open_seats == 0, sum == 2 == capacity"
            - "After compensating cancel: enrolled_count == 1, open_seats == 1, sum == 2 == capacity (no drift; waitlist empty so no promotion masks the release)"

      - name: org_referral_slot_conservation_across_send_withdraw
        grounds:
          - calculations.referral_slot_accounting
          - state_machines.Referral.DRAFT_to_SENT
          - state_machines.Referral.SENT_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity: partner referral slots (different quantity than workshop seats).
          referral_slots_used + referral_slots_open == referral_capacity across a send
          (forward) paired with withdraw (compensating) — withdrawing a SENT referral releases
          exactly the slot the send took.
        test_recipe:
          setup:
            - "Org capacity 3; client with REFERRAL_SHARE consent; case INTAKE; DRAFT referral"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Rosa Client", preferred_language: "es", date_of_birth: "1986-06-06", household_size: 3 }
              as: IntakeSpecialist
              captures: { cli_id: $.data.id }
            - call: "POST /consents"
              payload: { client_id: "${cli_id}", scope: "REFERRAL_SHARE" }
              as: CenterAdmin
            - call: "POST /cases"
              payload: { client_id: "${cli_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_id: $.data.id }
            - call: "POST /organizations"
              payload: { name: "Org C", service_categories: ["HEALTH"], referral_capacity: 3, contact_email: "c@org.test" }
              as: CenterAdmin
              captures: { org_id: $.data.id }
            - call: "POST /referrals"
              payload: { case_id: "${case_id}", organization_id: "${org_id}", service_category: "HEALTH" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_id}/send"
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "GET /organizations/${org_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { used_mid: $.data.referral_slots_used, open_mid: $.data.referral_slots_open }
            - call: "POST /referrals/${ref_id}/withdraw"
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "GET /organizations/${org_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { used_end: $.data.referral_slots_used, open_end: $.data.referral_slots_open }
          assert:
            - "After send: referral_slots_used == 1, referral_slots_open == 2, sum == 3 == referral_capacity"
            - "After withdraw: referral_slots_used == 0, referral_slots_open == 3, sum == 3 (compensating action restores the baseline exactly)"
