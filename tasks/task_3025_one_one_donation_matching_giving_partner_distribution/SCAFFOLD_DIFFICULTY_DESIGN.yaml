          setup:
            - "The running season is OPEN at 2026-09-01T00:00:00Z with freezes_at far ahead."
            - "One ACTIVE DUAL_CHANNEL product with two ACTIVE eligible lines; one PAID order carrying the first line with 7 units."
            - "One APPROVED partner with an ACTIVE capacity profile and one APPROVED allocation of 7 units attributed to the product."
