            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: NEUROLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_b: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000000071" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000000071" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_a}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-TC2", specialty_track_id: "${track_a}", question_text: "Chronic stable angina, medication refill interaction question regarding ranolazine and simvastatin.", icd10_primary: "I20", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_a: $.data.id, st_a: $.data.status } }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-TC3", specialty_track_id: "${track_b}", question_text: "New onset migraine with aura; asks about starting triptan versus prophylaxis given frequency.", icd10_primary: "G43", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_b: $.data.id, st_b: $.data.status } }
          trigger:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-04T01:00:00Z" }, as: ProgramCoordinator }
            - { call: "GET /econsult/consult-requests/${cons_a}", as: ProgramCoordinator, captures: { a_status: $.data.status, a_billing: $.data.billing_status, a_breach: $.data.sla_breached } }
            - { call: "GET /econsult/consult-requests/${cons_b}", as: ProgramCoordinator, captures: { b_status: $.data.status, b_billing: $.data.billing_status } }
            - { call: "GET /econsult/panel-memberships/${memb_id}", as: ProgramCoordinator, captures: { m_expired: $.data.expired_count, m_open: $.data.open_consult_count } }
          assert:
            - "pre-sweep: ConsultRequest.${cons_a}.status == ASSIGNED and ConsultRequest.${cons_b}.status == QUEUED (no panel on NEUROLOGY)"
            - "link 1: after sweep to 2026-06-04T01:00:00Z (> sla + 24h = 2026-06-04T00:00:00Z), consult A status == EXPIRED, sla_breached == true, billing_status == VOID"
            - "link 1b: consult B status == EXPIRED (queue TTL 72h exceeded, strict >), billing_status == VOID"
            - "link 2: PanelMembership.${memb_id}.expired_count == 1 and open_consult_count == 0"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: claim_submit_state_error_beats_fiscal_error
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - state_machines.BillingClaim.DRAFT_to_SUBMITTED
          - calculations.billing_cap_check
        distinguishing_aspect: |
          Error-category pair = state vs business_fiscal. A claim submit that
          violates both the state gate (consult.billing_status ==
          PENDING_DOCUMENTATION, priority 4) and the fiscal gate (10500 cents
          against a 100-cent monthly cap, priority 9) in one request MUST return
          ERR_CONSULT_NOT_CHARGEABLE (409), and after the state gate is cured
          the same submit MUST surface ERR_TRACK_BILLING_CAP_EXCEEDED (402) —
          proving both checks were live and priority-ordered.
        test_recipe:
          setup:
            - "Track RHEUMATOLOGY with monthly_billing_cap_cents 100; consult answered on time, NOT documented"
            - "DRAFT claim created (amount 10500 = 10000 + 500 add-on)"
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: RHEUMATOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 100 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
