            - call: "POST /api/market-partner-agreements"
              payload: { partner_id: "${p2_id}", market_group_id: "${g1_id}", coverage_start_date: "2027-01-01", coverage_end_date: "2027-12-31", override_pct: 5, basis: "PER_RESTAURANT_POSITIVE" }
              as: CorporateController
              captures: { ag2_id: $.data.id }
            - call: "POST /api/market-partner-agreements/${ag2_id}/activate"
              payload: {}
              as: CorporateController
            - call: "POST /api/profit-periods"
              payload: { restaurant_id: "${r1_id}", period_start_date: "2027-03-01", period_end_date: "2027-04-01" }
              as: OperationsAuditor
              captures: { pp3_id: $.data.id, pp3_v: $.data.version }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2027-04-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/profit-periods/${pp3_id}/line-items"
              payload: { category: "REVENUE", amount_cents: 9000000, entry_status: "FINALIZED", expected_profit_period_version: "${pp3_v}" }
              as: OperationsAuditor
            - call: "GET /api/profit-periods/${pp3_id}"
              payload: {}
              as: OperationsAuditor
              captures: { pp3_v2: $.data.version }
            - call: "POST /api/profit-periods/${pp3_id}/line-items"
              payload: { category: "COST_OF_GOODS", amount_cents: 3000000, entry_status: "FINALIZED", expected_profit_period_version: "${pp3_v2}" }
              as: OperationsAuditor
            - call: "GET /api/profit-periods/${pp3_id}"
              payload: {}
              as: OperationsAuditor
              captures: { pp3_v3: $.data.version }
            - call: "POST /api/profit-periods/${pp3_id}/compute"
