# =============================================================================
# Task 1263 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth coverage of §1.1–§1.7 claims not already covered by §1.8.
# Sections follow references/claim-extraction-guide.md. Default logical clock
# 2026-05-01T00:00:00Z unless a chain sets it. "standard fixture" = approved
# application (composite 90.0) + ACTIVE contract 2027-07-01..2032-06-30 with
# targets 0.5/0.25/0.25.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: entity_application_creation_defaults
        claim_type: creation_defaults
        grounds: [entities.CharterApplication]
        distinguishing_aspect: "Create returns 201 with server defaults: status SUBMITTED, review_scores [], rubric_complete false, composite_score null, composite_variant PROVISIONAL, version 1."
        test_recipe:
          setup: ["empty DB; clock default"]
          setup_api_calls: []
          trigger:
            - call: "POST /authorizer/applications"
              payload: { school_name: "Ent Academy", founding_group: "FG E1", cycle_year: 2027, proposed_grades: "K-8" }
              as: Applicant
              as_user_id: applicant_e1
              captures: { app_id: $.data.id, st: $.data.status, rc: $.data.rubric_complete, cv: $.data.composite_variant, ver: $.data.version }
          assert:
            - "captured status == 'SUBMITTED', rubric_complete == false, composite_variant == 'PROVISIONAL', version == 1"
            - "CharterApplication.${app_id}.review_scores == [] and composite_score == null and decided_by_user_id == null"

      - name: entity_application_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.CharterApplication, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input school_name is rejected with ERR_INVALID_REQUEST (400); no entity is persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /authorizer/applications"
              payload: { founding_group: "FG E2", cycle_year: 2027, proposed_grades: "K-8" }
              as: Applicant
              as_user_id: applicant_e2
              captures: { err: $.data.error_id }
          assert:
            - "captured error_id == 'ERR_INVALID_REQUEST' and HTTP status == 400"

      - name: entity_application_get_not_found
        claim_type: not_found
        grounds: [entities.CharterApplication, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent application id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /authorizer/applications/11111111-2222-4333-8444-555555555555"
              as: AuthorizerStaff
              captures: { err: $.data.error_id }
          assert:
            - "captured error_id == 'ERR_NOT_FOUND' and HTTP status == 404"

      - name: entity_applications_pagination_envelope
        claim_type: listing_pagination
        grounds: [entities.CharterApplication, response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset and returns total_count + has_more: with 2 applications, limit=1 yields total_count 2, has_more true; offset=1 yields the second record."
        test_recipe:
          setup: ["two applications created in the same cycle"]
          setup_api_calls:
            - call: "POST /authorizer/applications"
              payload: { school_name: "Page Academy 1", founding_group: "FG E3", cycle_year: 2027, proposed_grades: "K-8" }
              as: Applicant
              as_user_id: applicant_e3
              captures: { pa1: $.data.id }
            - call: "POST /authorizer/applications"
              payload: { school_name: "Page Academy 2", founding_group: "FG E3", cycle_year: 2027, proposed_grades: "K-8" }
              as: Applicant
              as_user_id: applicant_e3
              captures: { pa2: $.data.id }
          trigger:
            - call: "GET /authorizer/applications?limit=1&offset=0"
              as: AuthorizerStaff
            - call: "GET /authorizer/applications?limit=1&offset=1"
              as: AuthorizerStaff
          assert:
            - "page 1: data length == 1, total_count == 2, has_more == true"
            - "page 2: data length == 1, has_more == false, and the two pages contain ${pa1} and ${pa2} exactly once between them"

      - name: entity_school_cascade_defaults
        claim_type: computed_fields
        grounds: [entities.School, state_machines.CharterApplication.BOARD_REVIEW_to_APPROVED]
        distinguishing_aspect: "The approve cascade creates School with system-copied school_name, status PRE_OPENING, all three standings GOOD, current_contract_id null."
        test_recipe:
          setup: ["application driven to BOARD_REVIEW with composite 90.0 (rubric 90 x5, panel 90)"]
          setup_api_calls:
            - call: "POST /authorizer/applications"
              payload: { school_name: "Ent School Academy", founding_group: "FG E4", cycle_year: 2027, proposed_grades: "K-5" }
              as: Applicant
              as_user_id: applicant_e4
              captures: { app_id: $.data.id }
            - call: "POST /authorizer/applications/${app_id}/accept-intake"
              payload: {}
              as: AuthorizerStaff
            - call: "POST /authorizer/applications/${app_id}/scores"
              payload: { criterion: "ACADEMIC_PLAN", score: 90 }
              as: ApplicationReviewer
              as_user_id: rev_e4
            - call: "POST /authorizer/applications/${app_id}/scores"
              payload: { criterion: "FINANCE_PLAN", score: 90 }
              as: ApplicationReviewer
              as_user_id: rev_e4
            - call: "POST /authorizer/applications/${app_id}/scores"
              payload: { criterion: "GOVERNANCE", score: 90 }
              as: ApplicationReviewer
              as_user_id: rev_e4
            - call: "POST /authorizer/applications/${app_id}/scores"
              payload: { criterion: "OPERATIONS_PLAN", score: 90 }
              as: ApplicationReviewer
              as_user_id: rev_e4
            - call: "POST /authorizer/applications/${app_id}/scores"
              payload: { criterion: "COMMUNITY_SUPPORT", score: 90 }
              as: ApplicationReviewer
              as_user_id: rev_e4
            - call: "POST /authorizer/applications/${app_id}/interviews"
              payload: { scheduled_start: "2026-05-21T10:00:00Z", scheduled_end: "2026-05-21T11:00:00Z", panelist_user_ids: ["rev_panel_e4"] }
              as: AuthorizerStaff
              captures: { int_id: $.data.id }
            - call: "POST /authorizer/interviews/${int_id}/score"
              payload: { panel_score: 90 }
              as: ApplicationReviewer
              as_user_id: rev_panel_e4
            - call: "POST /authorizer/applications/${app_id}/advance-to-board"
              payload: {}
              as: AuthorizerStaff
          trigger:
            - call: "POST /authorizer/applications/${app_id}/decide"
              payload: { outcome: "APPROVED" }
              as: BoardMember
              as_user_id: board_1
            - call: "GET /authorizer/applications/${app_id}/schools"
              as: AuthorizerStaff
              captures: { school_id : "$.data[0].id", st : "$.data[0].status", sa : "$.data[0].academic_standing", sf : "$.data[0].financial_standing", so : "$.data[0].operational_standing", cc: "$.data[0].current_contract_id" }
          assert:
            - "exactly one school; captured status == 'PRE_OPENING'"
            - "captured standings all == 'GOOD' and current_contract_id == null"
            - "School.${school_id}.school_name == 'Ent School Academy' and application_id == ${app_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: sm_decide_from_submitted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CharterApplication, "errors[ERR_APPLICATION_INVALID_STATE]"]
        distinguishing_aspect: "decide is only valid from BOARD_REVIEW; calling it on a SUBMITTED application fails with ERR_APPLICATION_INVALID_STATE and no School is created."
        test_recipe:
          setup: ["application created, still SUBMITTED"]
          setup_api_calls:
            - call: "POST /authorizer/applications"
              payload: { school_name: "SM Early Decide", founding_group: "FG S1", cycle_year: 2027, proposed_grades: "K-8" }
              as: Applicant
              as_user_id: applicant_s1
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /authorizer/applications/${app_id}/decide"
              payload: { outcome: "APPROVED" }
              as: BoardMember
              as_user_id: board_1
              captures: { err: $.data.error_id }
          assert:
            - "captured error_id == 'ERR_APPLICATION_INVALID_STATE' and HTTP status == 409"
            - "GET /authorizer/applications/${app_id}/schools returns empty array"

      - name: sm_interview_double_score_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.CapacityInterview, "errors[ERR_INTERVIEW_INVALID_STATE]"]
        distinguishing_aspect: "SCORED is terminal for scoring: a second score call on the same interview fails with ERR_INTERVIEW_INVALID_STATE; application.interview_score keeps the first value."
        test_recipe:
          setup: ["application UNDER_REVIEW with one SCORED interview (panel 70)"]
          setup_api_calls:
            - call: "POST /authorizer/applications"
              payload: { school_name: "SM Double Score", founding_group: "FG S2", cycle_year: 2027, proposed_grades: "K-8" }
              as: Applicant
              as_user_id: applicant_s2
              captures: { app_id: $.data.id }
            - call: "POST /authorizer/applications/${app_id}/accept-intake"
              payload: {}
              as: AuthorizerStaff
            - call: "POST /authorizer/applications/${app_id}/interviews"
              payload: { scheduled_start: "2026-05-22T10:00:00Z", scheduled_end: "2026-05-22T11:00:00Z", panelist_user_ids: ["rev_panel_s2"] }
              as: AuthorizerStaff
              captures: { int_id: $.data.id }
            - call: "POST /authorizer/interviews/${int_id}/score"
              payload: { panel_score: 70 }
              as: ApplicationReviewer
              as_user_id: rev_panel_s2
          trigger:
            - call: "POST /authorizer/interviews/${int_id}/score"
              payload: { panel_score: 95 }
              as: ApplicationReviewer
              as_user_id: rev_panel_s2
              captures: { err: $.data.error_id }
          assert:
            - "captured error_id == 'ERR_INTERVIEW_INVALID_STATE'"
            - "CapacityInterview.${int_id}.panel_score == 70 (unchanged)"

      - name: sm_report_return_requires_notes
        claim_type: precondition_enforcement
        grounds: [state_machines.MonitoringReport.SUBMITTED_to_RETURNED, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "RETURN without return_notes fails with ERR_INVALID_REQUEST and the report stays SUBMITTED."
        test_recipe:
          setup: ["school OPEN (standard fixture); report fiscal 2028 SUBMITTED"]
          setup_api_calls:
            - call: "POST /authorizer/applications"
              payload: { school_name: "SM Report Academy", founding_group: "FG S3", cycle_year: 2027, proposed_grades: "K-8" }
              as: Applicant
              as_user_id: applicant_s3
              captures: { app_id: $.data.id }
