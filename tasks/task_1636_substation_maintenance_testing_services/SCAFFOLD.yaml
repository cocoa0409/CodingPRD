    input: []
    output: "{ condition_score: number, next_due_interval_baseline: string, next_due_condition_adjusted: string, escalation_active: boolean }"
    side_effects: []
  - method: POST
    path: "/assets/{id}/decommission"
    description: "Decommission an in-service asset (no non-terminal outage windows may exist for it)"
    roles: [OperationsManager]
    code: 200
    input: []
