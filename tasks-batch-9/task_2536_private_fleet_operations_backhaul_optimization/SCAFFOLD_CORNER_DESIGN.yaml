# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml  --  §1.9 Scaffold Corner Design
# Domain: private-fleet-backhaul-operations   (api_prefix /fleet)
#
# Breadth probe over §1.1-§1.7 of SCAFFOLD.yaml. Sections and claim_type values
# are taken verbatim from references/claim-extraction-guide.md; corners already
# proven by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) appear as excluded_because
# stubs citing the covering instance by name.
#
# Logical clock: every recipe pins it explicitly; the default epoch is
# 2026-08-01T00:00:00Z.
#
# Shorthand used in setup prose only (never in calls):
#   BASE = store S-2001 (600 cases/hour, docks 0..1439, 2 doors)
#        + domicile DOM-COR + pay plan MILE-C + driver DX + tractor TX
#        + trailer VX (DRY_VAN, 1800 cases)
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: store_creation_returns_every_declared_field
        claim_type: Creation
        grounds:
          - entities.Store
          - endpoints[POST /fleet/stores]
          - response_envelope.success
        distinguishing_aspect: "A store created with the six required inputs answers 201 with the four common fields plus the system default status ACTIVE and both computed ledgers at 0; nothing about a store is nullable on creation."
        test_recipe:
          setup:
            - "Empty database with the clock at the default epoch."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
          trigger:
            - call: "POST /fleet/stores"
              payload: { store_code: "S-2001", region_code: "MIDWEST", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 0, dock_close_minute: 1439 }
              as: FleetPlanner
              captures: { s_id: $.data.id, s_code: $.data.store_code, s_docks: $.data.dock_count, s_rate: $.data.cases_per_hour_unload_rate, s_open: $.data.dock_open_minute, s_close: $.data.dock_close_minute, s_status: $.data.status, s_open_cases: $.data.open_scheduled_cases, s_delivered: $.data.delivered_cases_total, s_version: $.data.version }
          assert:
            - "HTTP 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "${s_code} == S-2001, ${s_docks} == 2, ${s_rate} == 600, ${s_open} == 0, ${s_close} == 1439"
            - "${s_status} == ACTIVE, ${s_open_cases} == 0, ${s_delivered} == 0, ${s_version} == 1"
            - "${s_id} is a bare UUID with no type prefix"

      - name: trip_retrieval_returns_the_stored_row
        claim_type: Retrieval
        grounds:
          - entities.Trip
          - endpoints[GET /fleet/trips/{trip_id}]
        distinguishing_aspect: "GET on a freshly created trip echoes the three inputs and reports both state dimensions at their initial values with every aggregate zeroed and planned_end_at null - a trip with no stops has no end."
        test_recipe:
          setup:
            - "One domicile exists; TRIP-C1 is created and never touched again."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-COR", region_code: "MIDWEST", tractor_capacity: 20, driver_headcount_target: 10, fixed_ownership_cents_per_day: 10000, overhead_cents_per_day: 3000, dedicated_rate_cents_per_mile: 280, dedicated_rate_cents_per_case: 205 }
              as: FleetPlanner
              captures: { dom_id: $.data.id }
            - call: "POST /fleet/trips"
              payload: { trip_code: "TRIP-C1", domicile_id: "${dom_id}", planned_start_at: "2026-08-15T06:00:00Z" }
              as: FleetPlanner
              captures: { trip_id: $.data.id }
          trigger:
            - call: "GET /fleet/trips/${trip_id}"
              payload: {}
              as: TransportManager
              captures: { g_code: $.data.trip_code, g_dom: $.data.domicile_id, g_start: $.data.planned_start_at, g_plan: $.data.plan_status, g_settle: $.data.settlement_status, g_stops: $.data.stop_count, g_end: $.data.planned_end_at, g_miles: $.data.total_miles, g_duty: $.data.planned_duty_minutes, g_pay: $.data.driver_pay_cents, g_driver: $.data.driver_id }
          assert:
            - "HTTP 200; ${g_code} == TRIP-C1, ${g_dom} == ${dom_id}, ${g_start} == 2026-08-15T06:00:00Z"
            - "${g_plan} == DRAFT and ${g_settle} == PENDING"
            - "${g_stops} == 0, ${g_end} == null, ${g_miles} == 0, ${g_duty} == 0, ${g_pay} == 0, ${g_driver} == null"

      - name: replenishment_order_listing_paginates_and_filters_by_store
        claim_type: Listing
        grounds:
          - endpoints[GET /fleet/replenishment-orders]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three orders exist at store A and one at store B. Filtering by store A with limit 2 returns 2 rows with total_count 3 and has_more true; offset 2 returns the last row with has_more false. The store B row never appears, so filter and window compose."
        test_recipe:
          setup:
            - "Stores S-2002 and S-2003 exist. S-2002 has three UNSCHEDULED orders created in a pinned order; S-2003 has one."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/stores"
              payload: { store_code: "S-2002", region_code: "EAST", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 0, dock_close_minute: 1439 }
              as: FleetPlanner
              captures: { store_a_id: $.data.id }
            - call: "POST /fleet/stores"
              payload: { store_code: "S-2003", region_code: "EAST", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 0, dock_close_minute: 1439 }
              as: FleetPlanner
              captures: { store_b_id: $.data.id }
            - call: "POST /fleet/replenishment-orders"
              payload: { store_id: "${store_a_id}", cases: 100, weight_lbs: 2200, requested_window_start: "2026-08-16T08:00:00Z", requested_window_end: "2026-08-16T14:00:00Z", temperature_mode: "DRY", priority: 1 }
              as: FleetPlanner
              captures: { ord_1_id: $.data.id }
            - call: "POST /fleet/replenishment-orders"
              payload: { store_id: "${store_a_id}", cases: 200, weight_lbs: 4400, requested_window_start: "2026-08-16T08:00:00Z", requested_window_end: "2026-08-16T14:00:00Z", temperature_mode: "DRY", priority: 2 }
              as: FleetPlanner
              captures: { ord_2_id: $.data.id }
            - call: "POST /fleet/replenishment-orders"
              payload: { store_id: "${store_a_id}", cases: 300, weight_lbs: 6600, requested_window_start: "2026-08-16T08:00:00Z", requested_window_end: "2026-08-16T14:00:00Z", temperature_mode: "REFRIGERATED", priority: 3 }
              as: FleetPlanner
              captures: { ord_3_id: $.data.id }
            - call: "POST /fleet/replenishment-orders"
              payload: { store_id: "${store_b_id}", cases: 400, weight_lbs: 8800, requested_window_start: "2026-08-16T08:00:00Z", requested_window_end: "2026-08-16T14:00:00Z", temperature_mode: "DRY", priority: 3 }
              as: FleetPlanner
              captures: { ord_4_id: $.data.id }
          trigger:
            - call: "GET /fleet/replenishment-orders"
              payload: { store_id: "${store_a_id}", limit: 2, offset: 0 }
              as: FleetPlanner
              captures: { page1_first: "$.data[0].id", page1_first_store: "$.data[0].store_id" }
            - call: "GET /fleet/replenishment-orders"
              payload: { store_id: "${store_a_id}", limit: 2, offset: 2 }
              as: FleetPlanner
              captures: { page2_first: "$.data[0].id" }
            - call: "GET /fleet/replenishment-orders"
              payload: { store_id: "${store_a_id}", temperature_mode: "REFRIGERATED" }
              as: FleetPlanner
              captures: { reefer_first: "$.data[0].id" }
          assert:
            - "page 1: response_type == array, exactly 2 rows, meta/pagination reports limit 2, offset 0, total_count 3 and has_more true"
            - "${page1_first_store} == ${store_a_id} - the S-2003 order ${ord_4_id} appears on no page of this filter"
            - "page 2: exactly 1 row, ${page2_first} is the third S-2002 order, total_count 3, has_more false"
            - "the temperature filter returns exactly 1 row and ${reefer_first} == ${ord_3_id}"
            - "omitting limit and offset would apply the declared defaults limit 10 and offset 0"

      - name: driver_lookup_with_unknown_uuid_returns_driver_not_found
        claim_type: Not Found
        grounds:
          - errors.ERR_DRIVER_NOT_FOUND
          - endpoints[GET /fleet/drivers/{driver_id}]
        distinguishing_aspect: "A well-formed UUID that was never minted answers 404 with the entity-specific ERR_DRIVER_NOT_FOUND, not a generic 404, and the error envelope carries response_type == error."
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
          trigger:
            - call: "GET /fleet/drivers/99999999-8888-4777-8666-555544443333"
              payload: {}
              as: TransportManager
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "HTTP 404, ${err} == ERR_DRIVER_NOT_FOUND, ${msg} is a non-empty string"
            - "response_type == error and data carries exactly error_id and message"

      - name: store_creation_without_dock_count_is_rejected
        claim_type: Required Fields
        grounds:
          - entities.Store.dock_count
          - errors.ERR_INVALID_REQUEST
          - validations[priority 7 request_shape]
        distinguishing_aspect: "dock_count has source input and no default, so omitting it is a shape error at priority 7 - ERR_INVALID_REQUEST 400 - and no store row is created; the same is true for a null value."
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
          trigger:
            - call: "POST /fleet/stores"
              payload: { store_code: "S-2004", region_code: "WEST", cases_per_hour_unload_rate: 600, dock_open_minute: 0, dock_close_minute: 1439 }
              as: FleetPlanner
              captures: { err: $.data.error_id }
            - call: "GET /fleet/stores"
              payload: { region_code: "WEST" }
              as: FleetPlanner
          assert:
            - "HTTP 400 and ${err} == ERR_INVALID_REQUEST"
            - "the follow-up list returns 0 rows with total_count 0 - the refused create persisted nothing"
            - "the same 400 is returned for every other input field of Store that has no declared default: store_code, region_code, cases_per_hour_unload_rate, dock_open_minute, dock_close_minute"

      - name: fuel_stop_omits_cases_and_defaults_to_zero
        claim_type: Defaults
        grounds:
          - entities.TripStop.cases
          - calculations.trip_plan_totals.constants.FIXED_FUEL_MINUTES
          - endpoints[POST /fleet/trips/{trip_id}/stops]
        distinguishing_aspect: "cases declares default 0, so a FUEL stop that omits it stores 0 rather than rejecting; the stop still books the fixed 25 service minutes, which proves the default is applied before the service rule runs."
        test_recipe:
          setup:
            - "Domicile DOM-COR2 and trip TRIP-C2 (DRAFT, no stops) exist."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-COR2", region_code: "MIDWEST", tractor_capacity: 20, driver_headcount_target: 10, fixed_ownership_cents_per_day: 10000, overhead_cents_per_day: 3000, dedicated_rate_cents_per_mile: 280, dedicated_rate_cents_per_case: 205 }
              as: FleetPlanner
              captures: { dom2_id: $.data.id }
            - call: "POST /fleet/trips"
              payload: { trip_code: "TRIP-C2", domicile_id: "${dom2_id}", planned_start_at: "2026-08-17T06:00:00Z" }
              as: FleetPlanner
              captures: { trip2_id: $.data.id }
          trigger:
            - call: "POST /fleet/trips/${trip2_id}/stops"
              payload: { sequence: 1, stop_type: "FUEL", scheduled_arrival_at: "2026-08-17T07:00:00Z", scheduled_departure_at: "2026-08-17T07:25:00Z", drive_minutes_from_prev: 45, miles_from_prev: 40, segment_loaded: true }
              as: FleetPlanner
              captures: { stop_cases: $.data.cases, stop_service: $.data.service_minutes, stop_status: $.data.status }
            - call: "GET /fleet/trips/${trip2_id}"
              payload: {}
              as: FleetPlanner
              captures: { t_service: $.data.planned_service_minutes, t_duty: $.data.planned_duty_minutes, t_delivery_cases: $.data.planned_delivery_cases, t_peak: $.data.peak_case_load }
          assert:
            - "HTTP 201, ${stop_cases} == 0, ${stop_service} == 25 and ${stop_status} == PLANNED"
            - "${t_service} == 25, ${t_duty} == 70 (45 drive + 25 service, no break), ${t_delivery_cases} == 0 and ${t_peak} == 0"

      - name: store_creation_with_extra_ledger_fields_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Store.open_scheduled_cases
          - entities.Store.delivered_cases_total
          - endpoints[POST /fleet/stores]
        distinguishing_aspect: "open_scheduled_cases and delivered_cases_total are source computed; supplying them in the create body must not seed them. The row comes back with both at 0, proving the server derives them from the SCHEDULED-order filter rather than trusting the client."
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
          trigger:
            - call: "POST /fleet/stores"
              payload: { store_code: "S-2005", region_code: "SOUTH", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 0, dock_close_minute: 1439, open_scheduled_cases: 5000, delivered_cases_total: 9000, status: "SUSPENDED" }
              as: FleetPlanner
              captures: { s_open: $.data.open_scheduled_cases, s_delivered: $.data.delivered_cases_total, s_status: $.data.status }
          assert:
            - "${s_open} == 0 and ${s_delivered} == 0 - the computed ledgers ignore the body"
            - "${s_status} == ACTIVE - status is source system and only POST /fleet/stores/{store_id}/status may move it"

      - name: driver_system_fields_are_server_minted
        claim_type: System Fields
        grounds:
          - entities.Driver
          - endpoints[POST /fleet/drivers]
        distinguishing_aspect: "A driver created with only its four inputs comes back with the server-minted id/created_at/updated_at/version plus every system default: status ACTIVE, hos_status OFF_DUTY, all three HOS counters 0, safety_score 100, coaching_hold false and ytd_gross_cents 0."
        test_recipe:
          setup:
            - "Domicile DOM-COR3 and pay plan MILE-C exist."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-COR3", region_code: "MIDWEST", tractor_capacity: 20, driver_headcount_target: 10, fixed_ownership_cents_per_day: 10000, overhead_cents_per_day: 3000, dedicated_rate_cents_per_mile: 280, dedicated_rate_cents_per_case: 205 }
              as: FleetPlanner
              captures: { dom3_id: $.data.id }
            - call: "POST /fleet/driver-pay-plans"
              payload: { plan_code: "MILE-C", mileage_cents_per_mile: 80, stop_cents_per_stop: 2000, drop_hook_cents: 1400, hourly_cents_per_minute: 40, minimum_daily_cents: 20000, backhaul_bonus_pct: 0.04 }
              as: PayrollAnalyst
              captures: { planc_id: $.data.id }
          trigger:
            - call: "POST /fleet/drivers"
              payload: { driver_code: "DX-1", domicile_id: "${dom3_id}", pay_plan_id: "${planc_id}", seniority_date: "2021-01-04" }
              as: TransportManager
              captures: { d_id: $.data.id, d_version: $.data.version, d_status: $.data.status, d_hos: $.data.hos_status, d_drive: $.data.drive_minutes_used_today, d_duty: $.data.duty_minutes_used_today, d_weekly: $.data.weekly_on_duty_minutes, d_points: $.data.open_penalty_points, d_score: $.data.safety_score, d_hold: $.data.coaching_hold, d_ytd: $.data.ytd_gross_cents }
          assert:
            - "HTTP 201, ${d_version} == 1 and ${d_id} is a bare UUID; created_at and updated_at are ISO 8601 UTC with three fractional digits"
            - "${d_status} == ACTIVE, ${d_hos} == OFF_DUTY"
            - "${d_drive} == 0, ${d_duty} == 0, ${d_weekly} == 0, ${d_points} == 0, ${d_score} == 100, ${d_hold} == false, ${d_ytd} == 0"

      - name: trailer_type_with_undeclared_enum_value_is_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Trailer.trailer_type
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "trailer_type is constrained to {DRY_VAN, REEFER}; a plausible-looking third value is a 400 at priority 7, and the same rule rejects a capacity_cases of 0 because §1.1 constrains it to be positive."
        test_recipe:
          setup:
            - "Domicile DOM-COR4 exists."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-COR4", region_code: "MIDWEST", tractor_capacity: 20, driver_headcount_target: 10, fixed_ownership_cents_per_day: 10000, overhead_cents_per_day: 3000, dedicated_rate_cents_per_mile: 280, dedicated_rate_cents_per_case: 205 }
              as: FleetPlanner
              captures: { dom4_id: $.data.id }
          trigger:
            - call: "POST /fleet/trailers"
              payload: { trailer_code: "VAN-960", domicile_id: "${dom4_id}", trailer_type: "REFRIGERATED", capacity_cases: 1800, inspection_due_at: "2026-12-01T00:00:00Z" }
              as: MaintenanceCoordinator
              captures: { enum_err: $.data.error_id }
            - call: "POST /fleet/trailers"
              payload: { trailer_code: "VAN-960", domicile_id: "${dom4_id}", trailer_type: "REEFER", capacity_cases: 0, inspection_due_at: "2026-12-01T00:00:00Z" }
              as: MaintenanceCoordinator
              captures: { range_err: $.data.error_id }
            - call: "POST /fleet/trailers"
              payload: { trailer_code: "VAN-960", domicile_id: "${dom4_id}", trailer_type: "REEFER", capacity_cases: 1800, inspection_due_at: "2026-12-01T00:00:00Z" }
              as: MaintenanceCoordinator
              captures: { ok_type: $.data.trailer_type }
          assert:
            - "${enum_err} == ERR_INVALID_REQUEST with HTTP 400 - REFRIGERATED is the ReplenishmentOrder vocabulary, not the Trailer vocabulary"
            - "${range_err} == ERR_INVALID_REQUEST with HTTP 400 for capacity_cases 0"
            - "${ok_type} == REEFER with HTTP 201 - the trailer_code VAN-960 was still free, so neither refusal had created a row"

      - name: telematics_event_is_immutable_with_no_version_field
        claim_type: Immutability
        grounds:
          - entities.TelematicsEvent
          - endpoints[POST /fleet/telematics-events]
          - endpoints[GET /fleet/telematics-events]
        distinguishing_aspect: "TelematicsEvent declares common_fields false: the created row exposes id and created_at but NO version and NO updated_at, and §1.5 offers no PATCH or DELETE for it. The only mutation is the coach action, which flips coached without touching penalty_points."
        test_recipe:
          setup:
            - "Domicile, pay plan and driver DX-2 exist; one HARD_BRAKE severity 3 event is recorded (2 * 3 = 6 points)."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-COR5", region_code: "MIDWEST", tractor_capacity: 20, driver_headcount_target: 10, fixed_ownership_cents_per_day: 10000, overhead_cents_per_day: 3000, dedicated_rate_cents_per_mile: 280, dedicated_rate_cents_per_case: 205 }
              as: FleetPlanner
              captures: { dom5_id: $.data.id }
            - call: "POST /fleet/driver-pay-plans"
              payload: { plan_code: "MILE-C", mileage_cents_per_mile: 80, stop_cents_per_stop: 2000, drop_hook_cents: 1400, hourly_cents_per_minute: 40, minimum_daily_cents: 20000, backhaul_bonus_pct: 0.04 }
              as: PayrollAnalyst
              captures: { planc_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "DX-2", domicile_id: "${dom5_id}", pay_plan_id: "${planc_id}", seniority_date: "2021-02-04" }
              as: TransportManager
              captures: { d2_id: $.data.id }
          trigger:
            - call: "POST /fleet/telematics-events"
              payload: { driver_id: "${d2_id}", event_type: "HARD_BRAKE", severity: 3, occurred_at: "2026-07-30T15:00:00Z" }
              as: SafetyManager
              captures: { ev_id: $.data.id, ev_points: $.data.penalty_points, ev_coached: $.data.coached, ev_coached_at: $.data.coached_at, ev_by: $.data.coached_by_user_id }
            - call: "GET /fleet/telematics-events"
              payload: { driver_id: "${d2_id}" }
              as: SafetyManager
              captures: { list_first: "$.data[0].id", list_points: "$.data[0].penalty_points" }
            - call: "GET /fleet/drivers/${d2_id}"
              payload: {}
              as: SafetyManager
              captures: { d2_points: $.data.open_penalty_points, d2_score: $.data.safety_score }
          assert:
            - "${ev_points} == 6, ${ev_coached} == false, ${ev_coached_at} == null, ${ev_by} == null"
            - "the created row exposes id and created_at only; no version and no updated_at appear in the payload"
            - "${list_first} == ${ev_id} and ${list_points} == 6"
            - "${d2_points} == 6 and ${d2_score} == 94 - the immutable event still drives the derived driver fields"
            - "§1.5 declares no PATCH /fleet/telematics-events/{event_id} and no DELETE for the entity, so the row can never be edited"

      - name: trip_stop_creation_under_an_unknown_trip_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.TripStop.trip_id
          - errors.ERR_TRIP_NOT_FOUND
          - validations[priority 4 existence]
        distinguishing_aspect: "TripStop's parent arrives through the path segment, so an unknown {trip_id} is a priority-4 path-existence failure (404 ERR_TRIP_NOT_FOUND) that pre-empts every body-shape objection - the body here is deliberately also invalid, carrying a DELIVERY stop with no store_id."
        test_recipe:
          setup:
            - "Empty database apart from the clock; the trip id below was never minted."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
          trigger:
            - call: "POST /fleet/trips/44444444-3333-4222-8111-000000000000/stops"
