      - name: case_cycles_hardship_review_back_to_option_exploration
        grounds:
          - state_machines.AccommodationRequest.HARDSHIP_REVIEW_to_OPTION_EXPLORATION
          - state_machines.AccommodationRequest.OPTION_EXPLORATION_to_HARDSHIP_REVIEW
          - entities.AccommodationRequest.fields.interactive_round_count
          - entities.AccommodationRequest.fields.blocked_option_count
        distinguishing_aspect: |
          AccommodationRequest.stage returns to a state it already left
          (HARDSHIP_REVIEW -> OPTION_EXPLORATION -> HARDSHIP_REVIEW) and the
          loop counter interactive_round_count advances from 0 to 1, so this
          machine is a true cycle on the AccommodationRequest entity, not the
