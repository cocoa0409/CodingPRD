  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # ---- Material usage + void conserves truck quantity_on_hand
      - name: invariant_usage_then_void_conserves_truck_stock
        grounds:
          - calculations.truck_stock_balance
          - state_machines.Permit.APPLIED_to_ISSUED
          - entities.TruckStockItem.fields.quantity_on_hand
          - entities.MaterialUsage.fields.voided
        distinguishing_aspect: |
          Conserved quantity = TruckStockItem.quantity_on_hand: recording a MaterialUsage debits
          quantity by N and voiding it credits quantity by exactly N, so quantity_on_hand returns to
          its pre-usage value (10 -> 7 -> 10); the forward+compensating pair leaves the integer-unit
          stock total unchanged.
        test_recipe:
          setup:
            - "MASTER tech zone '900' with truck-stock quantity_on_hand=10 for a SKU."
            - "An IN_PROGRESS OUTLET job in zone '900', tech on site."
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { full_name: "CI1 Cust", email: "ci1@x.com", service_zip: "90001", phone: "555" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /v1/technicians"
              payload: { full_name: "CI1 Tech", license_class: "JOURNEYMAN", service_zone: "900", hourly_rate_cents: 10000, on_call: false }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /v1/material-skus"
              payload: { sku_code: "CI1-SKU", description: "Romex", unit_price_cents: 1000, taxable: true }
              as: Dispatcher
              captures: { sku_id: $.data.id }
