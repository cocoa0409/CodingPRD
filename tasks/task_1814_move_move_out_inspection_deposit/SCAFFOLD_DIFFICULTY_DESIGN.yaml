              as: PropertyManager
              captures: { stmt_a: $.data.id }
            - call: "GET /pm/tenancies/${ten_b}"
              as: PropertyManager
              captures: { ten_b_v: $.data.version }
            - call: "POST /pm/statements"
              payload: { tenancy_id: "${ten_b}", expected_tenancy_version: "${ten_b_v}" }
              as: PropertyManager
              captures: { stmt_b: $.data.id }
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: ManagerAdmin }
            - { call: "POST /pm/statements/${stmt_a}/issue", payload: {}, as: PropertyManager }
            - { call: "POST /pm/statements/${stmt_b}/issue", payload: {}, as: PropertyManager }
            - call: "POST /pm/disputes"
              payload: { statement_id: "${stmt_a}", disputed_amount_cents: 20000, reason: "paint wear" }
