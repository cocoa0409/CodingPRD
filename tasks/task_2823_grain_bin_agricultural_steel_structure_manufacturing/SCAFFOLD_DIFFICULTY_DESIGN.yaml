      - name: order_cancel_cascades_credit_release_to_dealer_reactivation_to_held_order_requeue
        grounds:
          - state_machines.DealerOrder.cancel_to_CANCELLED_and_VOIDED
          - state_machines.Dealer.CREDIT_HOLD_to_ACTIVE
          - state_machines.DealerOrder.production_status_HOLD_CREDIT_to_QUEUED
          - calculations.dealer_credit_ledger
        distinguishing_aspect: |
          Depth 3 from a completely different triggering transition - POST /dealer-orders/{id}/cancel
          rather than a failure determination - and through a different entity path. Hop 1: the
          cancelled order's credit_hold_cents drops to 0. Hop 2 is caused by that release: the
          recomputed dealer_credit_ledger lifts credit_available_cents from -1 to 1999733, driving
          Dealer CREDIT_HOLD -> ACTIVE. Hop 3 is caused by the dealer returning to ACTIVE: the OTHER
          order, sitting in HOLD_CREDIT, returns to QUEUED. Cancelling an order therefore unblocks a
          sibling order it never referenced.
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST (seal_required false), GrainProfile CORN, CoatingSpec G115, engineer PE-1001."
            - "Dealer Alpha created with credit_limit_cents 900000000 so that both confirmations succeed."
            - "BinDesign D1 (12.0 m x 9.6 m, ASD) at UNDER_REVIEW via one PASS ASD analysis plus submit-review."
            - "Two DealerOrders O1 and O2, both on D1 (NONE / GRAVITY), each credit_hold_cents 1999734, both confirmed to QUEUED; Dealer.credit_committed_cents is then 3999468 and credit_available_cents 896000532."
            - "The credit limit is then lowered to 3999467, exactly one cent short of the committed amount, so credit_available_cents becomes -1 and the Dealer enters CREDIT_HOLD with both orders cascaded to HOLD_CREDIT."
