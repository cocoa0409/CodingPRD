            - "GET /cpa/extension-negotiations?agreement_id=${ag} returns data == [] and total_count == 0"

      - name: error_aircraft_not_available_on_leg_creation
        claim_type: violation_to_error
        grounds:
          - errors[ERR_AIRCRAFT_NOT_AVAILABLE]
          - validations[priority=30]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / grounded_cross_agreement_tail_safety_beats_referential
          rationale: "That §1.8 instance schedules onto a GROUNDED_STAFFING tail and asserts the safety error at priority 30 wins over the referential error at priority 40."

      - name: error_cross_agreement_reference_on_leg_creation
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CROSS_AGREEMENT_REFERENCE]
          - validations[priority=40]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / grounded_cross_agreement_tail_safety_beats_referential
          rationale: "The same §1.8 instance repairs the safety violation to expose ERR_CROSS_AGREEMENT_REFERENCE underneath, which is the only way to observe it in isolation."

      - name: error_base_understaffed_on_induction
        claim_type: violation_to_error
