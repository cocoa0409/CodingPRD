        grounds: [state_machines.Claim.PAID_to_PAYMENT_REVERSED, calculations.property_ledger_rollup]
        distinguishing_aspect: "The undo leg reverses the payout with no drift in the property's derived balance."
        excluded_because:
          difficulty_instance: "compensating_invariant / claim_payout_and_reversal_restore_property_ledger_net_exactly"
          rationale: "That §1.8 instance already pins the exact pre-payout balance, asserts both ledger legs sum to zero, and asserts approved_amount_cents is left unchanged so the reversal cannot be recomputed into a different figure."

      - name: claim_approval_requires_a_live_entitlement_on_a_different_entity
        claim_type: guarded_transitions
        grounds: [state_machines.Claim.UNDER_REVIEW_to_APPROVED, validations.priority_17]
        distinguishing_aspect: "The APPROVE leg is gated by the state of a BenefitEntitlement row, not by anything on the Claim itself."
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / claim_approval_blocked_by_forfeited_benefit_entitlement_state"
          rationale: "That §1.8 instance already establishes the guard by mutating only the entitlement's state between triage and decision, and contrasts the ungated DENY path against the gated APPROVE path on identical data."

  - section: calculations
