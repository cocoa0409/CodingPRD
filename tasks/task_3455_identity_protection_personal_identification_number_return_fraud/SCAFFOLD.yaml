# =============================================================================
# Scaffold: IRS Identity Protection PIN & Return Fraud Filters
# =============================================================================

scenario: |
  Identity Protection Personal Identification Number & Return Fraud Filters (Internal Revenue Service): identity theft victim identification through duplicate filing detection and taxpayer reports, protection number issuance with annual regeneration and delivery channel options, return filtering models that hold refunds for review with false positive burden on legitimate filers, identity verification through online, phone and in-person channels with document requirements, refund release after verification with interest computation on delayed refunds, dependent claim conflicts where two filers claim the same person with resolution procedures, refund fraud scheme detection across preparer networks and bank product patterns, taxpayer advocate escalation for hardship cases with expedited handling

domain_name: identity-protection-return-fraud
api_prefix: /identity-protection

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Taxpayer
    parent: null
    common_fields: true
    fields:
      - { name: tin, type: string, source: input, description: "9-digit taxpayer identification number; unique across Taxpayer" , constraints: "unique; exactly 9 digits" }
      - { name: full_name, type: string, source: input, description: "Legal full name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date of birth (YYYY-MM-DD)" }
      - { name: prior_year_refund_cents, type: integer, source: input, default: 0, description: "Refund amount claimed on the prior tax year's accepted return; feeds refund-delta scoring" , constraints: ">= 0" }
      - { name: pin_delivery_channel, type: enum, source: input, default: "POSTAL_MAIL", description: "Preferred IP PIN delivery channel: POSTAL_MAIL | ONLINE_ACCOUNT" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VICTIM_FLAGGED; VICTIM_FLAGGED set when an IdentityTheftReport is CONFIRMED" }
      - { name: ip_pin_enrollment, type: enum, source: system, description: "NOT_ENROLLED | ENROLLED | OPTED_OUT; starts NOT_ENROLLED" }

  - name: IdentityTheftReport
    parent: null
    common_fields: true
    fields:
      - { name: taxpayer_id, type: string, source: system, description: "FK -> Taxpayer.id; subject of the report" }
      - { name: source, type: enum, source: input, description: "TAXPAYER_REPORT | DUPLICATE_DETECTION; DUPLICATE_DETECTION is set by the system on auto-created reports" }
      - { name: description, type: string, source: input, description: "Free-text victim statement (optional)", default: "" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creator; 'system' when auto-created by duplicate detection" }
      - { name: confirmed_tax_year, type: integer, source: system, description: "Tax year for which the IP PIN was issued on confirm; null until CONFIRMED" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | CONFIRMED | REJECTED" }

  - name: ProtectionPin
    parent: null
    common_fields: true
    fields:
      - { name: taxpayer_id, type: string, source: system, description: "FK -> Taxpayer.id; pin holder" }
      - { name: tax_year, type: integer, source: input, description: "Tax year this pin authorizes filings for" }
      - { name: pin_value, type: string, source: system, description: "6-digit identity protection PIN; unique per (taxpayer_id, tax_year)" }
      - { name: delivery_channel, type: enum, source: input, description: "POSTAL_MAIL | ONLINE_ACCOUNT; defaults to taxpayer.pin_delivery_channel" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED | REVOKED; at most one ACTIVE per (taxpayer_id, tax_year)" }

  - name: Preparer
    parent: null
    common_fields: true
    fields:
      - { name: ptin, type: string, source: input, description: "Preparer tax identification number; unique", constraints: "unique" }
      - { name: firm_name, type: string, source: input, description: "Firm display name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; SUSPENDED is terminal, set by fraud-scheme confirmation" }
      - { name: filed_return_count, type: integer, source: computed, default: 0, description: "Count of TaxReturn rows with preparer_id = this preparer; recomputed on every return intake" }

  - name: TaxReturn
    parent: null
    common_fields: true
    fields:
      - { name: taxpayer_id, type: string, source: input, description: "FK -> Taxpayer.id; filer" }
      - { name: preparer_id, type: string, source: input, description: "FK -> Preparer.id; null when self-filed" }
      - { name: tax_year, type: integer, source: input, description: "Tax year of the return" }
      - { name: filing_status, type: enum, source: input, description: "SINGLE | MARRIED_JOINT | HEAD_OF_HOUSEHOLD" }
      - { name: claimed_refund_cents, type: integer, source: input, description: "Refund amount claimed in cents", constraints: ">= 0" }
      - { name: ip_pin_submitted, type: string, source: input, description: "IP PIN presented with the filing; required iff filer is ENROLLED", default: null }
      - { name: bank_product, type: enum, source: input, default: "NONE", description: "NONE | REFUND_TRANSFER (refund routed through a preparer bank product)" }
      - { name: bank_account_fingerprint, type: string, source: input, description: "Hash of the deposit account; null when bank_product == NONE", default: null }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp of filing" }
      - { name: risk_score, type: integer, source: computed, description: "Filter score 0..100 computed at intake by calculations.filter_risk_score" }
      - { name: scoring_model_version, type: string, source: computed, description: "model_version of the ACTIVE FilterModelConfig used at intake" }
      - { name: adjustment_cents, type: integer, source: system, default: 0, description: "Signed refund adjustments applied by dependent-conflict resolution (negative)" }
      - { name: status, type: enum, source: system, description: "RECEIVED | FILTER_PASSED | FILTER_HELD | REFUND_SCHEDULED | REFUND_RELEASED | FRAUD_CONFIRMED" }

  - name: FilterHold
    parent: null
    common_fields: true
    fields:
      - { name: return_id, type: string, source: system, description: "FK -> TaxReturn.id; at most one FilterHold per return" , constraints: "unique per return_id" }
      - { name: risk_score, type: integer, source: system, description: "Score that caused the hold (copy of TaxReturn.risk_score at intake)" }
      - { name: model_version, type: string, source: system, description: "FilterModelConfig.model_version active at intake" }
      - { name: zone, type: enum, source: system, description: "GRAY | FULL; GRAY when gray_zone_threshold <= score < hold_threshold, FULL when score >= hold_threshold" }
      - { name: reason_codes, type: array, source: system, description: "Machine reasons, e.g. [REFUND_DELTA, BANK_PRODUCT, VICTIM_FLAGGED, INTERACTION, SCHEME_CONFIRMED]" }
      - { name: priority_review, type: boolean, source: system, default: false, description: "Set true when a linked AdvocateCase is expedited" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED_VERIFIED | RESOLVED_FALSE_POSITIVE | RESOLVED_FRAUD" }

  - name: IdentityVerificationCase
    parent: null
    common_fields: true
    fields:
      - { name: return_id, type: string, source: input, description: "FK -> TaxReturn.id; null for enrollment-verification cases" }
      - { name: taxpayer_id, type: string, source: input, description: "FK -> Taxpayer.id; subject of verification" }
      - { name: channel, type: enum, source: input, description: "ONLINE | PHONE | IN_PERSON" }
      - { name: attempts_count, type: integer, source: system, default: 0, description: "Failed verification attempts; EXPIRED when it reaches MAX_VERIFICATION_ATTEMPTS (3)" }
      - { name: required_document_types, type: array, source: system, description: "Derived from channel: ONLINE -> [PHOTO_ID, PRIOR_YEAR_RETURN]; PHONE -> [PHOTO_ID, SSA_CARD]; IN_PERSON -> [PHOTO_ID, UTILITY_BILL]" }
      - { name: deadline_at, type: datetime, source: system, description: "created_at + 30 days; an expedited AdvocateCase shrinks it to min(current deadline, expedite time + 7 days)" }
      - { name: status, type: enum, source: system, description: "OPENED | DOCS_REQUESTED | DOCS_SUBMITTED | VERIFIED | FAILED | EXPIRED" }

  - name: VerificationDocument
    parent: null
    common_fields: false
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> IdentityVerificationCase.id" }
      - { name: doc_type, type: enum, source: input, description: "PHOTO_ID | PRIOR_YEAR_RETURN | W2 | SSA_CARD | UTILITY_BILL" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp of submission" }

  - name: ServiceOffice
    parent: null
    common_fields: true
    fields:
      - { name: office_code, type: string, source: input, description: "Unique office code", constraints: "unique" }
      - { name: name, type: string, source: input, description: "Office display name" }
      - { name: capacity, type: integer, source: input, description: "Max count of BOOKED appointments whose half-open intervals may overlap at any single instant", constraints: ">= 1" }

  - name: VerificationAppointment
    parent: null
    common_fields: true
    fields:
      - { name: office_id, type: string, source: system, description: "FK -> ServiceOffice.id" }
      - { name: case_id, type: string, source: input, description: "FK -> IdentityVerificationCase.id; case must have channel IN_PERSON" }
      - { name: start_at, type: datetime, source: input, description: "Half-open interval start [start_at, end_at)" }
      - { name: end_at, type: datetime, source: input, description: "Half-open interval end; must be > start_at" }
      - { name: status, type: enum, source: system, description: "BOOKED | COMPLETED" }

  - name: DependentClaim
    parent: null
    common_fields: true
    fields:
      - { name: return_id, type: string, source: system, description: "FK -> TaxReturn.id; return that claims the dependent" }
      - { name: dependent_tin, type: string, source: input, description: "9-digit TIN of the claimed dependent" }
      - { name: relationship, type: enum, source: input, description: "CHILD | STEPCHILD | SIBLING | PARENT | OTHER" }
      - { name: credit_cents, type: integer, source: system, default: 200000, description: "Dependent credit at stake; equals DEPENDENT_CREDIT_CENTS" }
      - { name: status, type: enum, source: system, description: "CLAIMED | CONTESTED | SUSTAINED | DISALLOWED" }

  - name: DependentConflict
    parent: null
    common_fields: true
    fields:
      - { name: dependent_tin, type: string, source: system, description: "TIN claimed by two returns" }
      - { name: tax_year, type: integer, source: system, description: "Tax year of the conflicting claims" }
      - { name: return_a_id, type: string, source: system, description: "FK -> TaxReturn.id; earlier-filed return (by received_at, tie-break created_at ASC)" }
      - { name: return_b_id, type: string, source: system, description: "FK -> TaxReturn.id; later-filed return" }
      - { name: evidence_window_ends_at, type: datetime, source: system, description: "created_at + EVIDENCE_WINDOW_DAYS (30)" }
      - { name: evidence_a_submitted, type: boolean, source: system, default: false, description: "First filer submitted evidence" }
      - { name: evidence_b_submitted, type: boolean, source: system, default: false, description: "Second filer submitted evidence" }
      - { name: resolution, type: enum, source: system, description: "null | FIRST_FILER | SECOND_FILER" }
      - { name: resolved_reason, type: enum, source: system, description: "null | ANALYST_DECISION | DEFAULT_NO_EVIDENCE | FRAUD_FORFEIT" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED" }

  - name: FraudSchemeAlert
    parent: null
    common_fields: true
    fields:
      - { name: preparer_id, type: string, source: system, description: "FK -> Preparer.id; null for BANK_PRODUCT_CLUSTER alerts spanning self-filers" }
      - { name: pattern_type, type: enum, source: system, description: "PREPARER_NETWORK_VELOCITY | BANK_PRODUCT_CLUSTER" }
      - { name: evidence, type: object, source: system, description: "{ return_ids: string[], window_days: integer, match_count: integer }" }
      - { name: confirmed_by_user_id, type: string, source: system, description: "X-User-ID of the confirming FraudAnalyst; null until CONFIRMED_SCHEME" }
      - { name: status, type: enum, source: system, description: "FLAGGED | CONFIRMED_SCHEME | CLEARED" }

  - name: RefundDisbursement
    parent: null
    common_fields: true
    fields:
      - { name: return_id, type: string, source: system, description: "FK -> TaxReturn.id; exactly one disbursement per return", constraints: "unique per return_id" }
      - { name: base_cents, type: integer, source: system, description: "claimed_refund_cents + adjustment_cents at scheduling; re-synced when a conflict resolution adjusts a SCHEDULED return" }
      - { name: provisional_interest_cents, type: integer, source: computed, description: "Simple-accrual estimate computed at scheduling (variant PROVISIONAL of calculations.refund_interest)" }
      - { name: final_interest_cents, type: integer, source: computed, description: "Compound per-component interest computed at release (variant FINAL); null while SCHEDULED" }
      - { name: amount_cents, type: integer, source: computed, description: "base_cents + final_interest_cents once RELEASED; base_cents + provisional_interest_cents while SCHEDULED" }
      - { name: scheduled_at, type: datetime, source: system, description: "Logical-clock time of scheduling" }
      - { name: released_at, type: datetime, source: system, description: "Logical-clock time of release; null until RELEASED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | RELEASED | CANCELLED" }

  - name: AdvocateCase
    parent: null
    common_fields: true
    fields:
      - { name: taxpayer_id, type: string, source: input, description: "FK -> Taxpayer.id; hardship subject" }
      - { name: return_id, type: string, source: input, description: "FK -> TaxReturn.id; null for account-level hardship" }
      - { name: hardship_type, type: enum, source: input, description: "LEVY_THREAT | EVICTION | MEDICAL | UTILITY_SHUTOFF | OTHER" }
      - { name: expedited, type: boolean, source: system, default: false, description: "True once expedite action succeeds" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the opening TaxpayerAdvocate; segregation-of-duties anchor" }
      - { name: resolution_note, type: string, source: input, description: "Optional resolution note", default: "" }
      - { name: status, type: enum, source: system, description: "OPENED | EXPEDITED_REVIEW | RESOLVED" }

  - name: FilterModelConfig
    parent: null
    common_fields: true
    fields:
      - { name: model_version, type: string, source: input, description: "Unique model version label", constraints: "unique" }
      - { name: w_victim_flagged, type: integer, source: input, description: "Weight when taxpayer.status == VICTIM_FLAGGED" }
      - { name: w_refund_delta, type: integer, source: input, description: "Weight per refund-delta step (step = REFUND_DELTA_STEP_CENTS)" }
      - { name: w_bank_product, type: integer, source: input, description: "Weight when bank_product == REFUND_TRANSFER" }
      - { name: w_preparer_flagged, type: integer, source: input, description: "Weight when the return's preparer has a FLAGGED FraudSchemeAlert" }
      - { name: w_dependent_conflict, type: integer, source: input, description: "Weight when any claim on the return is CONTESTED at intake" }
      - { name: interaction_bonus, type: integer, source: input, description: "Added when taxpayer is VICTIM_FLAGGED and bank_product == REFUND_TRANSFER" }
      - { name: gray_zone_threshold, type: integer, source: input, description: "score >= this and < hold_threshold => GRAY hold; must be < hold_threshold" }
      - { name: hold_threshold, type: integer, source: input, description: "score >= this => FULL hold" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED; exactly one ACTIVE at a time" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Taxpayer
    initial_state: ACTIVE
    terminal_states: []
    note: "Two independent system-managed dimensions: status (ACTIVE | VICTIM_FLAGGED) and ip_pin_enrollment (NOT_ENROLLED | ENROLLED | OPTED_OUT). Enrollment transitions below; status flips to VICTIM_FLAGGED on report confirm and never reverts."
    transitions:
      - from: NOT_ENROLLED
        to: ENROLLED
        trigger: "POST /identity-protection/taxpayers/{id}/ip-pin-opt-in"
        actor: Taxpayer
        preconditions:
          - "ip_pin_enrollment == NOT_ENROLLED or OPTED_OUT (else ERR_INVALID_STATE)"
        side_effects:
          - "Create ProtectionPin for payload tax_year with status ACTIVE (supersede any existing ACTIVE pin for the same tax_year)"
      - from: OPTED_OUT
        to: ENROLLED
        trigger: "POST /identity-protection/taxpayers/{id}/ip-pin-opt-in"
        actor: Taxpayer
        preconditions: []
        side_effects:
          - "Create ProtectionPin for payload tax_year with status ACTIVE (supersede any existing ACTIVE pin for the same tax_year)"
      - from: ENROLLED
        to: OPTED_OUT
        trigger: "POST /identity-protection/taxpayers/{id}/ip-pin-opt-out"
        actor: Taxpayer
        preconditions:
          - "ip_pin_enrollment == ENROLLED (else ERR_NOT_ENROLLED)"
        side_effects:
          - "Every ACTIVE ProtectionPin of this taxpayer -> REVOKED"

  - entity: IdentityTheftReport
    initial_state: SUBMITTED
    terminal_states: []
    note: "Cyclic: REJECTED reports may be reopened to SUBMITTED; CONFIRMED is sticky (no outbound transitions) but not listed terminal so reopen only applies from REJECTED."
    transitions:
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /identity-protection/identity-theft-reports/{id}/confirm"
        actor: FraudAnalyst
        preconditions:
          - "status == SUBMITTED"
          - "Segregation of duties: X-User-ID != created_by_user_id (else ERR_DUTY_SEGREGATION_VIOLATION)"
        side_effects:
          - "Cascade link 1: Taxpayer.status -> VICTIM_FLAGGED and Taxpayer.ip_pin_enrollment -> ENROLLED (increments Taxpayer.version)"
          - "Cascade link 2 (caused by link 1 enrollment): create ProtectionPin for payload tax_year, status ACTIVE"
          - "Cascade link 3 (caused by link 2 pin creation): any existing ACTIVE ProtectionPin for the same (taxpayer, tax_year) -> SUPERSEDED"
          - "Set confirmed_tax_year = payload tax_year"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /identity-protection/identity-theft-reports/{id}/reject"
        actor: FraudAnalyst
        preconditions:
          - "status == SUBMITTED"
        side_effects: []
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /identity-protection/identity-theft-reports/{id}/reopen"
        actor: Taxpayer
        preconditions:
          - "status == REJECTED"
        side_effects: []

  - entity: ProtectionPin
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, REVOKED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a new ACTIVE pin is created for the same (taxpayer_id, tax_year) via opt-in, manual reissue, report confirm, or annual regeneration)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /identity-protection/taxpayers/{id}/ip-pin-opt-out"
        actor: Taxpayer
        preconditions: []
        side_effects: []

  - entity: Preparer
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /identity-protection/fraud-scheme-alerts/{id}/confirm"
        actor: FraudAnalyst
        preconditions:
          - "Alert status == FLAGGED and alert.preparer_id == this preparer"
        side_effects:
          - "Cascade: every TaxReturn with preparer_id == this preparer and status == FILTER_PASSED -> FILTER_HELD, and a FilterHold is created for each such return that has none (zone FULL, reason_codes [SCHEME_CONFIRMED], risk_score and model_version copied from the return)"

  - entity: TaxReturn
    initial_state: RECEIVED
    terminal_states: [REFUND_RELEASED, FRAUD_CONFIRMED]
    note: "RECEIVED is transient: intake scoring (calculations.filter_risk_score) auto-advances the return to FILTER_PASSED or FILTER_HELD within the POST /tax-returns request; the creation response already shows the post-scoring state."
    transitions:
      - from: RECEIVED
        to: FILTER_PASSED
        trigger: "system (automatic at intake when risk_score < gray_zone_threshold)"
        actor: system
        preconditions: []
        side_effects:
          - "Preparer.filed_return_count recomputed (increment by 1) when preparer_id is set"
      - from: RECEIVED
        to: FILTER_HELD
        trigger: "system (automatic at intake when risk_score >= gray_zone_threshold)"
        actor: system
        preconditions: []
        side_effects:
          - "Create FilterHold (zone GRAY when score < hold_threshold else FULL, reason_codes from scoring, status OPEN)"
          - "Preparer.filed_return_count recomputed (increment by 1) when preparer_id is set"
      - from: FILTER_HELD
        to: FILTER_PASSED
        trigger: "system (linked IdentityVerificationCase reaches VERIFIED) or POST /identity-protection/filter-holds/{id}/mark-false-positive"
        actor: system
        preconditions: []
        side_effects:
          - "The return's OPEN FilterHold -> RESOLVED_VERIFIED (via verification) or RESOLVED_FALSE_POSITIVE (via mark-false-positive)"
      - from: FILTER_PASSED
        to: REFUND_SCHEDULED
        trigger: "POST /identity-protection/tax-returns/{id}/release-refund"
        actor: FraudAnalyst
        preconditions:
          - "status == FILTER_PASSED"
        side_effects:
          - "Create RefundDisbursement (status SCHEDULED, base_cents = claimed_refund_cents + adjustment_cents, provisional_interest_cents per calculations.refund_interest variant PROVISIONAL)"
      - from: FILTER_HELD
        to: REFUND_SCHEDULED
        trigger: "POST /identity-protection/tax-returns/{id}/release-refund"
        actor: FraudAnalyst
        preconditions:
          - "status == FILTER_HELD"
          - "A linked IdentityVerificationCase with status == VERIFIED exists (else ERR_VERIFICATION_INCOMPLETE)"
        side_effects:
          - "Create RefundDisbursement as above"
      - from: REFUND_SCHEDULED
        to: REFUND_RELEASED
        trigger: "system (POST /identity-protection/refund-disbursements/{id}/release on its disbursement)"
        actor: SystemAdmin
        preconditions: []
        side_effects:
          - "RefundDisbursement.status -> RELEASED, final_interest_cents computed (variant FINAL), amount_cents finalized, released_at set"
      - from: FILTER_HELD
        to: FRAUD_CONFIRMED
        trigger: "POST /identity-protection/tax-returns/{id}/confirm-fraud or system (linked case reaches EXPIRED)"
        actor: FraudAnalyst
        preconditions:
          - "status == FILTER_HELD or REFUND_SCHEDULED"
        side_effects:
          - "OPEN FilterHold -> RESOLVED_FRAUD"
          - "Any non-terminal linked IdentityVerificationCase -> EXPIRED"
          - "Cascade: every DependentClaim with return_id == this return -> DISALLOWED"
          - "Cascade: every OPEN DependentConflict involving a claim of this return -> RESOLVED in favor of the other filer with resolved_reason FRAUD_FORFEIT"
      - from: REFUND_SCHEDULED
        to: FRAUD_CONFIRMED
        trigger: "POST /identity-protection/tax-returns/{id}/confirm-fraud"
        actor: FraudAnalyst
        preconditions:
          - "status == FILTER_HELD or REFUND_SCHEDULED"
        side_effects:
          - "Compensation: the return's SCHEDULED RefundDisbursement -> CANCELLED (no funds move; base_cents and interest are voided)"
          - "All FRAUD_CONFIRMED side effects listed on the FILTER_HELD -> FRAUD_CONFIRMED transition"

  - entity: FilterHold
    initial_state: OPEN
    terminal_states: [RESOLVED_VERIFIED, RESOLVED_FALSE_POSITIVE, RESOLVED_FRAUD]
    transitions:
      - from: OPEN
        to: RESOLVED_VERIFIED
        trigger: "system (linked IdentityVerificationCase VERIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "TaxReturn FILTER_HELD -> FILTER_PASSED"
      - from: OPEN
        to: RESOLVED_FALSE_POSITIVE
        trigger: "POST /identity-protection/filter-holds/{id}/mark-false-positive"
        actor: FraudAnalyst
        preconditions:
          - "status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "TaxReturn FILTER_HELD -> FILTER_PASSED"
      - from: OPEN
        to: RESOLVED_FRAUD
        trigger: "system (TaxReturn -> FRAUD_CONFIRMED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: IdentityVerificationCase
    initial_state: OPENED
    terminal_states: [VERIFIED, EXPIRED]
    note: "Cyclic retry loop: FAILED -> request-documents -> DOCS_REQUESTED while attempts_count < 3; the fail that reaches 3 attempts lands in EXPIRED instead of FAILED."
    transitions:
      - from: OPENED
        to: DOCS_REQUESTED
        trigger: "POST /identity-protection/verification-cases/{id}/request-documents"
        actor: VerificationAgent
        preconditions:
          - "status == OPENED or FAILED"
        side_effects: []
      - from: FAILED
        to: DOCS_REQUESTED
        trigger: "POST /identity-protection/verification-cases/{id}/request-documents"
        actor: VerificationAgent
        preconditions:
          - "status == OPENED or FAILED"
        side_effects: []
      - from: DOCS_REQUESTED
        to: DOCS_SUBMITTED
        trigger: "system (POST /identity-protection/verification-cases/{id}/documents when the set of received doc_type values covers required_document_types)"
        actor: Taxpayer
        preconditions:
          - "Current logical-clock time <= deadline_at (else ERR_VERIFICATION_WINDOW_EXPIRED)"
        side_effects: []
      - from: DOCS_SUBMITTED
        to: VERIFIED
        trigger: "POST /identity-protection/verification-cases/{id}/verify"
        actor: VerificationAgent
        preconditions:
          - "status == DOCS_SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "When return_id is set and the return is FILTER_HELD: TaxReturn FILTER_HELD -> FILTER_PASSED and its OPEN FilterHold -> RESOLVED_VERIFIED"
      - from: DOCS_REQUESTED
        to: FAILED
        trigger: "POST /identity-protection/verification-cases/{id}/fail"
        actor: VerificationAgent
        preconditions:
          - "status == DOCS_REQUESTED or DOCS_SUBMITTED"
          - "attempts_count + 1 < MAX_VERIFICATION_ATTEMPTS (3)"
        side_effects:
          - "attempts_count += 1"
      - from: DOCS_SUBMITTED
        to: FAILED
        trigger: "POST /identity-protection/verification-cases/{id}/fail"
        actor: VerificationAgent
        preconditions:
          - "status == DOCS_REQUESTED or DOCS_SUBMITTED"
          - "attempts_count + 1 < MAX_VERIFICATION_ATTEMPTS (3)"
        side_effects:
          - "attempts_count += 1"
      - from: DOCS_REQUESTED
        to: EXPIRED
        trigger: "POST /identity-protection/verification-cases/{id}/fail (third attempt)"
        actor: VerificationAgent
        preconditions:
          - "attempts_count + 1 == MAX_VERIFICATION_ATTEMPTS (3)"
        side_effects:
          - "Cascade link 1: case EXPIRED (attempts_count set to 3)"
          - "Cascade link 2 (when return_id set and return is FILTER_HELD): TaxReturn -> FRAUD_CONFIRMED"
          - "Cascade link 3 (caused by link 2): return's DependentClaims -> DISALLOWED, OPEN DependentConflicts -> RESOLVED FRAUD_FORFEIT, OPEN FilterHold -> RESOLVED_FRAUD"
      - from: DOCS_SUBMITTED
        to: EXPIRED
        trigger: "POST /identity-protection/verification-cases/{id}/fail (third attempt)"
        actor: VerificationAgent
        preconditions:
          - "attempts_count + 1 == MAX_VERIFICATION_ATTEMPTS (3)"
        side_effects:
          - "Same cascade as DOCS_REQUESTED -> EXPIRED"

  - entity: VerificationAppointment
    initial_state: BOOKED
    terminal_states: [COMPLETED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "system (clock advances past end_at)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DependentClaim
    initial_state: CLAIMED
    terminal_states: [SUSTAINED, DISALLOWED]
    transitions:
      - from: CLAIMED
        to: CONTESTED
        trigger: "system (a second return claims the same (dependent_tin, tax_year); both claims CONTESTED and a DependentConflict is created)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONTESTED
        to: SUSTAINED
        trigger: "system (DependentConflict resolved in this filer's favor)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONTESTED
        to: DISALLOWED
        trigger: "system (DependentConflict resolved against this filer)"
        actor: system
        preconditions: []
        side_effects:
          - "Losing TaxReturn: adjustment_cents -= min(DEPENDENT_CREDIT_CENTS, claimed_refund_cents); claimed_refund_cents reduced by the same delta (floor 0)"
          - "If the losing return is REFUND_SCHEDULED: its disbursement base_cents re-syncs to claimed_refund_cents + adjustment_cents and provisional_interest_cents recomputes"
      - from: CLAIMED
        to: DISALLOWED
        trigger: "system (owning TaxReturn -> FRAUD_CONFIRMED; also applies to CONTESTED claims of that return)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Fraud-forfeit disallowance applies to CLAIMED and CONTESTED claims alike and carries no credit adjustment (the whole refund is denied); the adjustment cascade belongs to conflict resolution against a live return"

  - entity: DependentConflict
    initial_state: OPEN
    terminal_states: [RESOLVED]
    note: "Branching fork: resolution lands FIRST_FILER or SECOND_FILER with divergent side-effect sets (which return absorbs the credit adjustment)."
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /identity-protection/dependent-conflicts/{id}/resolve"
        actor: FraudAnalyst
        preconditions:
          - "status == OPEN (else ERR_CONFLICT_ALREADY_RESOLVED)"
        side_effects:
          - "resolution = payload winner; resolved_reason = ANALYST_DECISION"
          - "Winner claim -> SUSTAINED; loser claim -> DISALLOWED with the adjustment cascade on the loser's TaxReturn"
      - from: OPEN
        to: RESOLVED
        trigger: "system (POST /_clock/set_current_utc sweeps conflicts whose evidence_window_ends_at < new clock time)"
        actor: system
        preconditions:
          - "logical clock > evidence_window_ends_at"
        side_effects:
          - "resolution = SECOND_FILER when evidence_b_submitted and not evidence_a_submitted, else FIRST_FILER; resolved_reason = DEFAULT_NO_EVIDENCE"
          - "Winner claim -> SUSTAINED; loser claim -> DISALLOWED with the adjustment cascade"
      - from: OPEN
        to: RESOLVED
        trigger: "system (one side's TaxReturn -> FRAUD_CONFIRMED)"
        actor: system
        preconditions: []
        side_effects:
          - "resolution = the filer whose return is not FRAUD_CONFIRMED; resolved_reason = FRAUD_FORFEIT"
          - "Winner claim -> SUSTAINED; loser claim already DISALLOWED by the fraud cascade (no double adjustment)"

  - entity: FraudSchemeAlert
    initial_state: FLAGGED
    terminal_states: [CONFIRMED_SCHEME, CLEARED]
    transitions:
      - from: FLAGGED
        to: CONFIRMED_SCHEME
        trigger: "POST /identity-protection/fraud-scheme-alerts/{id}/confirm"
        actor: FraudAnalyst
        preconditions:
          - "status == FLAGGED (else ERR_INVALID_STATE)"
        side_effects:
          - "confirmed_by_user_id = X-User-ID"
          - "When preparer_id set: Preparer ACTIVE -> SUSPENDED with its return re-hold cascade (see Preparer)"
      - from: FLAGGED
        to: CLEARED
        trigger: "POST /identity-protection/fraud-scheme-alerts/{id}/clear"
        actor: FraudAnalyst
        preconditions:
          - "status == FLAGGED (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: RefundDisbursement
    initial_state: SCHEDULED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /identity-protection/refund-disbursements/{id}/release"
        actor: SystemAdmin
        preconditions:
          - "status == SCHEDULED (else ERR_ALREADY_TERMINAL)"
          - "payload expected_amount_cents == base_cents + computed final_interest_cents (else ERR_DISBURSEMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "final_interest_cents computed per calculations.refund_interest variant FINAL; amount_cents = base_cents + final_interest_cents; released_at set"
          - "TaxReturn REFUND_SCHEDULED -> REFUND_RELEASED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (TaxReturn -> FRAUD_CONFIRMED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AdvocateCase
    initial_state: OPENED
    terminal_states: [RESOLVED]
    transitions:
      - from: OPENED
        to: EXPEDITED_REVIEW
        trigger: "POST /identity-protection/advocate-cases/{id}/expedite"
        actor: TaxpayerAdvocate
        preconditions:
          - "status == OPENED"
          - "return_id is set and that return's status == FILTER_HELD (else ERR_HARDSHIP_NOT_EXPEDITABLE)"
        side_effects:
          - "expedited = true"
          - "The return's OPEN FilterHold.priority_review -> true"
          - "A linked non-terminal IdentityVerificationCase (same return_id), if any, gets deadline_at = min(deadline_at, now + EXPEDITED_CASE_DEADLINE_DAYS days)"
      - from: OPENED
        to: RESOLVED
        trigger: "POST /identity-protection/advocate-cases/{id}/resolve"
        actor: TaxpayerAdvocate
        preconditions:
          - "status == OPENED or EXPEDITED_REVIEW"
          - "Segregation of duties: X-User-ID != opened_by_user_id (else ERR_DUTY_SEGREGATION_VIOLATION)"
        side_effects: []
      - from: EXPEDITED_REVIEW
        to: RESOLVED
        trigger: "POST /identity-protection/advocate-cases/{id}/resolve"
        actor: TaxpayerAdvocate
        preconditions:
          - "status == OPENED or EXPEDITED_REVIEW"
          - "Segregation of duties: X-User-ID != opened_by_user_id (else ERR_DUTY_SEGREGATION_VIOLATION)"
        side_effects: []

  - entity: FilterModelConfig
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /identity-protection/filter-model-configs/{id}/activate"
        actor: SystemAdmin
        preconditions:
          - "status == DRAFT (else ERR_CONFIG_NOT_DRAFT)"
          - "gray_zone_threshold < hold_threshold (else ERR_THRESHOLD_ORDER_INVALID)"
        side_effects:
          - "The previously ACTIVE FilterModelConfig, if any, -> RETIRED"
      - from: ACTIVE
        to: RETIRED
        trigger: "system (another config is activated)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: taxpayer-profile-stale-version
    parent_entity: Taxpayer
    write_endpoint: "PUT /identity-protection/taxpayers/{id}"
    occ_field: expected_taxpayer_version
    description: |
      Updating a Taxpayer profile whose version has advanced since the caller
      last observed it is rejected. Another writer (for example a profile edit
      or a report-confirm cascade) has legitimately moved the taxpayer forward,
      so the caller's view is stale and must be refreshed before writing.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: pin-reissue-stale-version
    parent_entity: Taxpayer
    write_endpoint: "POST /identity-protection/protection-pins"
    occ_field: expected_taxpayer_version
    description: |
      Manually reissuing a ProtectionPin against a Taxpayer whose version has
      advanced since the caller last observed it is rejected. A reissue
      legitimately supersedes the prior ACTIVE pin, so issuing from a stale
      taxpayer view could supersede a pin the caller never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: filter_risk_score
    trigger: "POST /identity-protection/tax-returns, after all intake validations pass and after dependent claims/conflicts for this filing are created, before the return leaves RECEIVED"
    algorithm: weighted_scoring
    description: "Scores a newly filed return with the weights of the single ACTIVE FilterModelConfig; the score selects the hold tier."
    formula: |
      cfg = the FilterModelConfig with status == ACTIVE
      delta_steps = min(MAX_DELTA_STEPS, floor(abs(return.claimed_refund_cents - taxpayer.prior_year_refund_cents) / REFUND_DELTA_STEP_CENTS))
      victim = 1 if taxpayer.status == VICTIM_FLAGGED else 0
      bank_rt = 1 if return.bank_product == REFUND_TRANSFER else 0
      preparer_flagged = 1 if return.preparer_id is not null and exists FraudSchemeAlert with preparer_id == return.preparer_id and status == FLAGGED else 0
      dep_contested = 1 if any DependentClaim with return_id == return.id has status == CONTESTED else 0
      raw = cfg.w_victim_flagged * victim
          + cfg.w_refund_delta * delta_steps
          + cfg.w_bank_product * bank_rt
          + cfg.w_preparer_flagged * preparer_flagged
          + cfg.w_dependent_conflict * dep_contested
      if victim == 1 and bank_rt == 1:
          raw += cfg.interaction_bonus
      score = min(SCORE_CAP, max(0, raw))
      tier: score >= cfg.hold_threshold        -> FILTER_HELD, FilterHold zone FULL
            cfg.gray_zone_threshold <= score < cfg.hold_threshold -> FILTER_HELD, FilterHold zone GRAY
            score < cfg.gray_zone_threshold    -> FILTER_PASSED
    input_set: "The return being filed, its Taxpayer, its Preparer (if any), that preparer's FLAGGED alerts, and the return's DependentClaims as just created (including CONTESTED flips from same-request conflict creation)."
    constants:
      REFUND_DELTA_STEP_CENTS: 100000
      MAX_DELTA_STEPS: 3
      SCORE_CAP: 100
    precision: "integer score; floor division for delta steps"
    variants:
      - name: model_version_variant
        when: "Whichever FilterModelConfig is ACTIVE at intake; activating a new config changes scores for identical return payloads from that moment on"
        difference: "Identical return data scores differently under two configs with different weights/thresholds; the applied config's model_version is stamped on TaxReturn.scoring_model_version"

  - name: refund_interest
    trigger: "Variant PROVISIONAL runs when POST /identity-protection/tax-returns/{id}/release-refund creates the disbursement; variant FINAL runs when POST /identity-protection/refund-disbursements/{id}/release executes"
    algorithm: chronological
    description: "Interest owed on refunds released after the statutory interest-free window; PROVISIONAL is a simple-accrual estimate, FINAL is daily-compounded with per-component rounding."
    formula: |
      anchor_date = max(date(return.received_at), FILING_DEADLINE[return.tax_year])
      # PROVISIONAL (at scheduling; projected release date == scheduling date):
      days_late_p = (date(scheduled_at) - anchor_date).days - INTEREST_FREE_DAYS
      provisional_interest_cents = 0 when days_late_p <= 0
                                 else round_half_up(base_cents * (ANNUAL_RATE_PCT/100 / DAY_COUNT_BASIS) * days_late_p)
      # FINAL (at release; single round per component, then sum — pinned rounding order):
      days_late_f = (date(released_at) - anchor_date).days - INTEREST_FREE_DAYS
      component_0 = base as of scheduling (claimed_refund_cents at that time), accruing max(0, days_late_f) days
      each adjustment a_i applied at resolution date d_i (sign included) accrues
          days_i = max(0, (date(released_at) - max(anchor_date + INTEREST_FREE_DAYS, d_i)).days)
      interest_i = round_half_up(component_i * ((1 + ANNUAL_RATE_PCT/100 / DAY_COUNT_BASIS) ** days_i - 1))
      final_interest_cents = sum(interest_i)   # round per component THEN sum; the sum-then-round order is explicitly rejected
    input_set: "The return, its disbursement, and every adjustment_cents delta with its resolution date; returns released within the interest-free window accrue zero."
    constants:
      ANNUAL_RATE_PCT: 7.0
      DAY_COUNT_BASIS: 365
      INTEREST_FREE_DAYS: 45
      FILING_DEADLINE: "tax_year 2026 -> 2027-04-15"
    precision: "integer cents, round_half_up; per-component rounding for FINAL, single rounding for PROVISIONAL"
    variants:
      - name: provisional
        when: "Disbursement creation"
        difference: "Simple daily accrual on the full base for days_late measured to the scheduling date; single round at the end"
      - name: final
        when: "Disbursement release"
        difference: "Daily compounding to the actual release date with per-component rounding; produces different cents than PROVISIONAL for identical base and day counts"

  - name: preparer_velocity_scan
    trigger: "After each POST /identity-protection/tax-returns that carries a preparer_id, and after each filing that carries a bank_account_fingerprint"
    algorithm: aggregation
    description: "Detects refund-fraud schemes: preparer refund-transfer velocity over a trailing 7-day window, and bank-product routing clusters across distinct taxpayers."
    formula: |
      # Scan A (PREPARER_NETWORK_VELOCITY), only when the new return has preparer_id P and bank_product == REFUND_TRANSFER:
      n = count of TaxReturn rows with preparer_id == P and bank_product == REFUND_TRANSFER
          and received_at in [now - VELOCITY_WINDOW_DAYS, now]  (both bounds inclusive)
      if n >= VELOCITY_THRESHOLD and no FraudSchemeAlert with preparer_id == P and status == FLAGGED exists:
          create FraudSchemeAlert(PREPARER_NETWORK_VELOCITY, evidence.return_ids = the n returns' ids ordered by received_at ASC then created_at ASC)
      # Scan B (BANK_PRODUCT_CLUSTER), only when the new return has bank_account_fingerprint F:
      S = set of distinct taxpayer_id over TaxReturn rows with bank_account_fingerprint == F
          and received_at in [now - VELOCITY_WINDOW_DAYS, now]  (both bounds inclusive)
      if |S| >= ROUTING_THRESHOLD and no FLAGGED alert with evidence.fingerprint == F exists:
          create FraudSchemeAlert(BANK_PRODUCT_CLUSTER, preparer_id = null, evidence.return_ids = matching returns ordered by received_at ASC then created_at ASC)
    input_set: "All TaxReturn rows regardless of status, windowed by received_at against the current logical clock."
    constants:
      VELOCITY_WINDOW_DAYS: 7
      VELOCITY_THRESHOLD: 10
      ROUTING_THRESHOLD: 3
    precision: "integer counts; >= comparisons (count exactly at the threshold fires)"
    variants: []

  - name: annual_pin_regeneration
    trigger: "POST /identity-protection/ops/annual-pin-regeneration"
    algorithm: aggregation
    description: "Ops-run batch: issues next-season pins to every ENROLLED taxpayer and supersedes prior-year ACTIVE pins. Idempotent per tax_year."
    formula: |
      for each Taxpayer with ip_pin_enrollment == ENROLLED, processed in created_at ASC order:
          if an ACTIVE ProtectionPin already exists for (taxpayer, payload tax_year): skipped_count += 1; continue
          create ProtectionPin(tax_year = payload tax_year, status ACTIVE, delivery_channel = taxpayer.pin_delivery_channel)
          every ACTIVE ProtectionPin of this taxpayer with tax_year != payload tax_year -> SUPERSEDED
          created_count += 1
      re-running with the same tax_year creates nothing (created_count == 0, all previously-created pins counted as skipped)
    input_set: "All Taxpayer rows with ip_pin_enrollment == ENROLLED."
    constants: {}
    precision: "integer counts"
    variants: []

  - name: dependent_conflict_adjustment
    trigger: "DependentConflict resolution by analyst decision or clock-sweep default (FRAUD_FORFEIT resolutions apply no adjustment — the losing claim was already disallowed by the fraud cascade)"
    algorithm: aggregation
    description: "Removes exactly one dependent credit from the losing filer's return and re-syncs a SCHEDULED disbursement."
    formula: |
      loser = the return whose claim is DISALLOWED
      delta = min(DEPENDENT_CREDIT_CENTS, loser.claimed_refund_cents)
      loser.claimed_refund_cents -= delta          # floor 0 guaranteed by min
      loser.adjustment_cents -= delta
      if loser.status == REFUND_SCHEDULED:
          loser.disbursement.base_cents = loser.claimed_refund_cents + loser.adjustment_cents
          loser.disbursement.provisional_interest_cents recomputed per calculations.refund_interest variant PROVISIONAL with the new base
    input_set: "The losing return and its disbursement (if any)."
    constants:
      DEPENDENT_CREDIT_CENTS: 200000
    precision: "integer cents"
    variants: []

  - name: verification_document_coverage
    trigger: "POST /identity-protection/verification-cases/{id}/documents"
    algorithm: aggregation
    description: "A DOCS_REQUESTED case advances to DOCS_SUBMITTED exactly when the set of received doc_type values covers required_document_types."
    formula: |
      received = set of doc_type over VerificationDocument rows with case_id == case.id
      if required_document_types is a subset of received: case.status -> DOCS_SUBMITTED
      extra doc types beyond the required set are accepted but do not change the transition
    input_set: "All VerificationDocument rows of the case."
    constants:
      MAX_VERIFICATION_ATTEMPTS: 3
      CASE_DEADLINE_DAYS: 30
      EXPEDITED_CASE_DEADLINE_DAYS: 7
    precision: "set inclusion"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and non-empty", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Entity-backed ownership: role Taxpayer may only act on resources whose taxpayer_id == X-User-ID (and TaxPreparer only on returns with preparer_id == X-User-ID); segregation of duties: report confirm rejects X-User-ID == created_by_user_id, advocate resolve rejects X-User-ID == opened_by_user_id", error_id: ERR_DUTY_SEGREGATION_VIOLATION, http_status: 403, applies_to: "ownership-scoped and SoD-constrained endpoints (ownership mismatch itself yields ERR_UNAUTHORIZED)" }
  - { priority: 4, category: existence, check: "Path parameters resolve to existing resources, validated left-to-right", error_id: ERR_TAXPAYER_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids (specific ids map to ERR_RETURN_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_CONFLICT_NOT_FOUND, ERR_PREPARER_NOT_FOUND, ERR_ALERT_NOT_FOUND, ERR_OFFICE_NOT_FOUND, ERR_DISBURSEMENT_NOT_FOUND, ERR_CONFIG_NOT_FOUND, ERR_HOLD_NOT_FOUND, ERR_ADVOCATE_CASE_NOT_FOUND)" }
  - { priority: 5, category: business_constraint, check: "OCC: expected_taxpayer_version equals the Taxpayer's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PUT /identity-protection/taxpayers/{id}; POST /identity-protection/protection-pins" }
  - { priority: 6, category: state, check: "Target entity's current state permits the requested transition; terminal entities reject everything", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints (terminal-state rejections use ERR_ALREADY_TERMINAL)" }
  - { priority: 7, category: business_safety, check: "IP PIN gate: filer ENROLLED requires ip_pin_submitted present (ERR_IP_PIN_REQUIRED) and equal to the ACTIVE pin for (taxpayer, tax_year) (ERR_IP_PIN_MISMATCH); preparer must not be SUSPENDED (ERR_PREPARER_SUSPENDED)", error_id: ERR_IP_PIN_MISMATCH, http_status: 422, applies_to: "POST /identity-protection/tax-returns" }
  - { priority: 8, category: business_constraint, check: "Uniqueness and exclusivity: tin unique on taxpayer create (ERR_DUPLICATE_TIN); no second non-terminal return per (tin, tax_year) (ERR_DUPLICATE_RETURN); no third claim on a dependent_tin+tax_year with an OPEN conflict (ERR_DEPENDENT_CONFLICT_OPEN); no second OPEN verification case per return (ERR_CASE_ALREADY_OPEN); ptin/office_code/model_version uniqueness (ERR_INVALID_REQUEST)", error_id: ERR_DUPLICATE_RETURN, http_status: 409, applies_to: "create endpoints" }
  - { priority: 9, category: business_constraint, check: "Temporal-window exclusivity: a new IdentityTheftReport is rejected while the taxpayer has a SUBMITTED report whose closed review window [created_at, created_at + 60 days] contains the new report's submission time (ERR_ACTIVE_REPORT_WINDOW); a new VerificationAppointment is rejected when any instant in its half-open [start_at, end_at) would make overlapping BOOKED appointments at the office reach capacity (ERR_APPOINTMENT_CAPACITY_EXCEEDED)", error_id: ERR_ACTIVE_REPORT_WINDOW, http_status: 409, applies_to: "POST identity-theft-reports; POST appointments" }
  - { priority: 10, category: business_temporal, check: "Deadline gate: documents submitted after IdentityVerificationCase.deadline_at (ERR_VERIFICATION_WINDOW_EXPIRED). Note: no analogous evidence-window error exists for conflicts — the clock sweep auto-resolves an expired conflict before any late evidence can arrive, so late evidence meets ERR_CONFLICT_ALREADY_RESOLVED instead", error_id: ERR_VERIFICATION_WINDOW_EXPIRED, http_status: 422, applies_to: "POST documents" }
  - { priority: 11, category: business_referential, check: "Cross-entity requirements: release-refund on FILTER_HELD requires a VERIFIED linked case (ERR_VERIFICATION_INCOMPLETE); verification case for a GRAY-zone hold must use channel ONLINE (ERR_CHANNEL_NOT_ALLOWED); appointment requires case channel IN_PERSON (ERR_CHANNEL_NOT_ALLOWED); verification case requires its return FILTER_HELD (ERR_RETURN_NOT_HELD); advocate expedite requires linked return FILTER_HELD (ERR_HARDSHIP_NOT_EXPEDITABLE); opt-out and manual pin reissue require enrollment ENROLLED (ERR_NOT_ENROLLED); return filing requires exactly one ACTIVE FilterModelConfig (ERR_CONFIG_NOT_ACTIVE)", error_id: ERR_VERIFICATION_INCOMPLETE, http_status: 422, applies_to: "release-refund; verification-cases create; appointments create; advocate expedite; opt-out; protection-pins create; tax-returns create" }
  - { priority: 12, category: business_fiscal, check: "Money consistency: disbursement release payload expected_amount_cents must equal base_cents + computed final_interest_cents", error_id: ERR_DISBURSEMENT_AMOUNT_MISMATCH, http_status: 422, applies_to: "POST /identity-protection/refund-disbursements/{id}/release" }
  - { priority: 13, category: business_constraint, check: "Config coherence: gray_zone_threshold < hold_threshold on config create and activate", error_id: ERR_THRESHOLD_ORDER_INVALID, http_status: 422, applies_to: "POST /identity-protection/filter-model-configs; POST /identity-protection/filter-model-configs/{id}/activate" }
  - { priority: 14, category: business_constraint, check: "Payload shape: required fields present, enums in their declared sets, date ranges valid (appointment end_at > start_at), tax_year == 2026 unless stated, integers in range", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or empty X-User-ID / X-User-Role headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not in endpoint roles, or entity-backed ownership mismatch (Taxpayer acting on another taxpayer's resource, TaxPreparer on another preparer's return)" }
  - { id: ERR_DUTY_SEGREGATION_VIOLATION, http: 403, condition: "Segregation of duties: report confirm by its creator, or advocate-case resolve by its opener" }
  - { id: ERR_TAXPAYER_NOT_FOUND, http: 404, condition: "Taxpayer path/body id does not exist" }
  - { id: ERR_RETURN_NOT_FOUND, http: 404, condition: "TaxReturn id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "IdentityTheftReport id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "IdentityVerificationCase id does not exist" }
  - { id: ERR_CONFLICT_NOT_FOUND, http: 404, condition: "DependentConflict id does not exist" }
  - { id: ERR_PREPARER_NOT_FOUND, http: 404, condition: "Preparer id does not exist" }
  - { id: ERR_ALERT_NOT_FOUND, http: 404, condition: "FraudSchemeAlert id does not exist" }
  - { id: ERR_OFFICE_NOT_FOUND, http: 404, condition: "ServiceOffice id does not exist" }
  - { id: ERR_DISBURSEMENT_NOT_FOUND, http: 404, condition: "RefundDisbursement id does not exist" }
  - { id: ERR_CONFIG_NOT_FOUND, http: 404, condition: "FilterModelConfig id does not exist" }
  - { id: ERR_HOLD_NOT_FOUND, http: 404, condition: "FilterHold id does not exist" }
  - { id: ERR_ADVOCATE_CASE_NOT_FOUND, http: 404, condition: "AdvocateCase id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, enum outside its declared set, malformed date/TIN, appointment end_at <= start_at, or uniqueness of ptin/office_code/model_version violated" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Current entity state does not permit the requested transition (non-terminal)" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Target entity is in a terminal state (REFUND_RELEASED, FRAUD_CONFIRMED, RELEASED, CANCELLED, VERIFIED, EXPIRED, RESOLVED, RETIRED, SUSPENDED)" }
  - { id: ERR_RETURN_NOT_HELD, http: 409, condition: "Opening a verification case for a return that is not FILTER_HELD" }
  - { id: ERR_CASE_ALREADY_OPEN, http: 409, condition: "A non-terminal IdentityVerificationCase already exists for this return" }
  - { id: ERR_CONFLICT_ALREADY_RESOLVED, http: 409, condition: "Action on a DependentConflict in RESOLVED" }
  - { id: ERR_CONFIG_NOT_DRAFT, http: 409, condition: "Activating a config that is not DRAFT" }
  - { id: ERR_CONFIG_NOT_ACTIVE, http: 409, condition: "Filing a return when no FilterModelConfig is ACTIVE" }
  - { id: ERR_DUPLICATE_TIN, http: 409, condition: "Creating a taxpayer whose tin already exists" }
  - { id: ERR_DUPLICATE_RETURN, http: 409, condition: "A non-terminal return already exists for (tin, tax_year); the rejected filing still auto-creates a DUPLICATE_DETECTION IdentityTheftReport" }
  - { id: ERR_DEPENDENT_CONFLICT_OPEN, http: 409, condition: "Claiming a dependent_tin+tax_year that already has an OPEN DependentConflict" }
  - { id: ERR_ACTIVE_REPORT_WINDOW, http: 409, condition: "Taxpayer has a SUBMITTED report whose closed review window [created_at, created_at+60d] contains the new submission time" }
  - { id: ERR_APPOINTMENT_CAPACITY_EXCEEDED, http: 409, condition: "The half-open appointment interval would make overlapping BOOKED appointments at the office reach its capacity at some instant" }
  - { id: ERR_PREPARER_SUSPENDED, http: 409, condition: "A SUSPENDED preparer filing returns" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_taxpayer_version does not match the Taxpayer's current version (OCC)" }
  - { id: ERR_IP_PIN_REQUIRED, http: 422, condition: "ENROLLED filer submitted a return without ip_pin_submitted" }
  - { id: ERR_IP_PIN_MISMATCH, http: 422, condition: "ip_pin_submitted does not equal the ACTIVE pin for (taxpayer, tax_year)" }
  - { id: ERR_NOT_ENROLLED, http: 422, condition: "Opt-out or manual pin reissue while ip_pin_enrollment != ENROLLED" }
  - { id: ERR_THRESHOLD_ORDER_INVALID, http: 422, condition: "gray_zone_threshold >= hold_threshold on config create or activate" }
  - { id: ERR_VERIFICATION_WINDOW_EXPIRED, http: 422, condition: "Document submitted after IdentityVerificationCase.deadline_at" }
  - { id: ERR_VERIFICATION_INCOMPLETE, http: 422, condition: "release-refund on a FILTER_HELD return without a VERIFIED linked case" }
  - { id: ERR_CHANNEL_NOT_ALLOWED, http: 422, condition: "GRAY-zone hold case opened on a channel other than ONLINE, or appointment booked for a non-IN_PERSON case" }
  - { id: ERR_DISBURSEMENT_AMOUNT_MISMATCH, http: 422, condition: "expected_amount_cents != base_cents + computed final_interest_cents at disbursement release" }
  - { id: ERR_HARDSHIP_NOT_EXPEDITABLE, http: 409, condition: "Advocate-case expedite without a linked FILTER_HELD return" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/identity-protection/taxpayers", description: " Register a taxpayer", roles: [SystemAdmin], code: 201, input: [tin, full_name, date_of_birth, "prior_year_refund_cents?", "pin_delivery_channel?"], output: Taxpayer, side_effects: [] }
  - { method: GET, path: "/identity-protection/taxpayers/{id}", description: " Read one taxpayer", roles: [SystemAdmin, FraudAnalyst, VerificationAgent, TaxpayerAdvocate, Taxpayer], code: 200, input: [], output: Taxpayer, side_effects: [] }
  - { method: PUT, path: "/identity-protection/taxpayers/{id}", description: " Update taxpayer profile; OCC-guarded on expected_taxpayer_version; increments Taxpayer.version by 1", roles: [Taxpayer, SystemAdmin], code: 200, input: [expected_taxpayer_version, "full_name?", "date_of_birth?", "prior_year_refund_cents?", "pin_delivery_channel?"], output: Taxpayer, side_effects: [" increments Taxpayer.version by 1"] }
  - { method: POST, path: "/identity-protection/taxpayers/{id}/ip-pin-opt-in", description: " Enroll in the IP PIN program and issue an ACTIVE pin for tax_year", roles: [Taxpayer, SystemAdmin], code: 200, input: [tax_year, "delivery_channel?"], output: Taxpayer, side_effects: [" ip_pin_enrollment -> ENROLLED", " create ProtectionPin ACTIVE for tax_year; supersede existing ACTIVE pin of same tax_year", " increments Taxpayer.version by 1"] }
  - { method: POST, path: "/identity-protection/taxpayers/{id}/ip-pin-opt-out", description: " Leave the IP PIN program; all ACTIVE pins revoked", roles: [Taxpayer, SystemAdmin], code: 200, input: [], output: Taxpayer, side_effects: [" ip_pin_enrollment -> OPTED_OUT", " all ACTIVE ProtectionPin -> REVOKED", " increments Taxpayer.version by 1"] }
  - { method: POST, path: "/identity-protection/taxpayers/{id}/identity-theft-reports", description: " File an identity-theft report", roles: [Taxpayer, FraudAnalyst], code: 201, input: [source, "description?"], output: IdentityTheftReport, side_effects: [] }
  - { method: GET, path: "/identity-protection/taxpayers/{id}/identity-theft-reports", description: " List a taxpayer's theft reports", roles: [Taxpayer, FraudAnalyst, TaxpayerAdvocate, SystemAdmin], code: 200, input: ["limit?", "offset?"], output: " IdentityTheftReport[]", side_effects: [] }
  - { method: POST, path: "/identity-protection/identity-theft-reports/{id}/confirm", description: " Confirm a theft report; cascades victim flag, enrollment, pin issuance and supersession", roles: [FraudAnalyst], code: 200, input: [tax_year], output: IdentityTheftReport, side_effects: [" Taxpayer VICTIM_FLAGGED + ENROLLED", " create ProtectionPin ACTIVE for tax_year", " supersede prior ACTIVE pin of same tax_year"] }
  - { method: POST, path: "/identity-protection/identity-theft-reports/{id}/reject", description: " Reject a theft report", roles: [FraudAnalyst], code: 200, input: [], output: IdentityTheftReport, side_effects: [] }
  - { method: POST, path: "/identity-protection/identity-theft-reports/{id}/reopen", description: " Reopen a REJECTED report back to SUBMITTED", roles: [Taxpayer, TaxpayerAdvocate], code: 200, input: [], output: IdentityTheftReport, side_effects: [] }
  - { method: GET, path: "/identity-protection/taxpayers/{id}/protection-pins", description: " List a taxpayer's IP PINs (all statuses)", roles: [Taxpayer, SystemAdmin, FraudAnalyst, TaxpayerAdvocate], code: 200, input: ["limit?", "offset?"], output: " ProtectionPin[]", side_effects: [] }
  - { method: POST, path: "/identity-protection/protection-pins", description: " Manually reissue an IP PIN; OCC-guarded; supersedes the ACTIVE pin of the same tax_year; increments Taxpayer.version by 1", roles: [SystemAdmin, TaxpayerAdvocate], code: 201, input: [taxpayer_id, tax_year, expected_taxpayer_version, "delivery_channel?"], output: ProtectionPin, side_effects: [" new pin ACTIVE; prior ACTIVE pin of same (taxpayer, tax_year) -> SUPERSEDED", " increments Taxpayer.version by 1"] }
  - { method: POST, path: "/identity-protection/ops/annual-pin-regeneration", description: " Ops run: issue next-season pins to all ENROLLED taxpayers and supersede prior-year ACTIVE pins; idempotent per tax_year", roles: [SystemAdmin], code: 200, input: [tax_year], output: "{ created_count: integer, superseded_count: integer, skipped_count: integer }", side_effects: [" creates/supersedes ProtectionPin rows per calculations.annual_pin_regeneration"] }
  - { method: POST, path: "/identity-protection/tax-returns", description: " File a return; runs intake validations, dependent-claim creation + conflict detection, risk scoring, and scheme scans; duplicate filings are rejected with ERR_DUPLICATE_RETURN but still auto-create a DUPLICATE_DETECTION theft report", roles: [Taxpayer, TaxPreparer], code: 201, input: [taxpayer_id, "preparer_id?", tax_year, filing_status, claimed_refund_cents, "ip_pin_submitted?", "bank_product?", "bank_account_fingerprint?", "dependents?"], output: TaxReturn, side_effects: [" calculations.filter_risk_score", " create DependentClaim rows from dependents[]", " auto-create DependentConflict when a dependent_tin+tax_year is already CLAIMED", " calculations.preparer_velocity_scan (may create FraudSchemeAlert)", " auto-create IdentityTheftReport(DUPLICATE_DETECTION) on duplicate filing"] }
  - { method: GET, path: "/identity-protection/tax-returns", description: " List returns with filters", roles: [FraudAnalyst, SystemAdmin, VerificationAgent], code: 200, input: ["taxpayer_id?", "preparer_id?", "status?", "limit?", "offset?"], output: " TaxReturn[]", side_effects: [] }
