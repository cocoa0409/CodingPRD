            - "the fourth trigger call returns HTTP 200"
            - "ChangeoverOrder.${order_id}.floor_stage == STRIKING"
            - "ChangeoverOrder.${order_id}.seating_stage == NOT_STARTED"
            - "ChangeoverOrder.${order_id}.infra_stage == NOT_STARTED"
            - "ChangeoverOrder.${order_id}.status == IN_PROGRESS"
            - "ChangeoverOrder.${order_id}.started_at_utc == 2026-08-01T00:00:00.000Z"
            - "EventBooking.${b_con}.status == CONFIRMED"

