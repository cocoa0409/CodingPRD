# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Art Gallery & Exhibition Sales (Expert)
# Breadth probe. Walks references/claim-extraction-guide.md section-by-section
# against SCAFFOLD.yaml §1.1–§1.7. Names are unique across §1.8 ∪ §1.9.
# excluded_because stubs cite §1.8 instance names verbatim.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_gallery_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Gallery, endpoints]
        distinguishing_aspect: "POST /galleries with required fields -> 201; response carries id, name, home_state_code, sales_tax_rate_bps, clock_utc."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /galleries"
              payload: { name: "Fresh", home_state_code: "CA", sales_tax_rate_bps: 875 }
              as: GalleryAdmin
              captures: { g: $.data.id }
          assert:
            - "http status == 201"
            - "Gallery.${g}.home_state_code == CA"
            - "Gallery.${g}.sales_tax_rate_bps == 875"
            - "Gallery.${g}.clock_utc == 2026-04-01T00:00:00Z"

      - name: get_artwork_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.Artwork"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET an artwork id that does not exist within the gallery -> ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Gallery exists; no artwork with the probed id."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Nf", home_state_code: "CA", sales_tax_rate_bps: 875 }
              as: GalleryAdmin
              captures: { g: $.data.id }
          trigger:
            - call: "GET /artworks/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: GalleryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: create_sale_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.Sale"
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /sales omitting required gross_amount_cents -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Gallery + ACTIVE artist + CONSIGNED artwork."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Rf", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Rf A" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Rf W", list_price_cents: 100000, insured_value_cents: 100000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
          trigger:
            - call: "POST /sales"
              payload: { gallery_id: "${g}", artwork_id: "${aw}", buyer_name: "X", buyer_state_code: "CA" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http status == 400"

      - name: sale_discount_default_zero_applied
        claim_type: Defaults
        grounds: [entities.Sale.fields.discount_bps, calculations.sale_money_breakdown]
        distinguishing_aspect: "Omitting discount_bps defaults to 0; net_amount_cents equals gross 250000."
        test_recipe:
          setup: ["Gallery CA; artwork; sale gross 250000 buyer CA, discount omitted."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Df", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Df A" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Df W", list_price_cents: 250000, insured_value_cents: 250000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
          trigger:
            - call: "POST /sales"
              payload: { gallery_id: "${g}", artwork_id: "${aw}", buyer_name: "Dd", buyer_state_code: "CA", gross_amount_cents: 250000 }
              as: SalesAssociate
              captures: { s: $.data.id }
          assert:
            - "Sale.${s}.discount_bps == 0"
            - "Sale.${s}.net_amount_cents == 250000"

      - name: artwork_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds: [entities.Artwork.fields.status, entities.Artwork.fields.provenance_count]
        distinguishing_aspect: "On consign, status and provenance_count are system-set (CONSIGNED, 1); any client-sent status/version is ignored."
        test_recipe:
          setup: ["Gallery + ACTIVE artist."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Sf", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Sf A" }
              as: GalleryAdmin
              captures: { a: $.data.id }
          trigger:
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Sf W", list_price_cents: 100000, insured_value_cents: 100000 }
              as: GalleryAdmin
              captures: { aw: $.data.id, st: $.data.status, pc: $.data.provenance_count }
          assert:
            - "Artwork.${aw}.status == CONSIGNED"
            - "Artwork.${aw}.provenance_count == 1"
            - "Artwork.${aw}.version == 1"

      - name: list_artworks_pagination_envelope
        claim_type: Listing
        grounds: [entities.Artwork, endpoints]
        distinguishing_aspect: "GET /artworks returns paginated array with total_count and has_more in meta/pagination fields."
        test_recipe:
          setup: ["Gallery with two artworks."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Lp", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Lp A" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "W1", list_price_cents: 100000, insured_value_cents: 100000 }
              as: GalleryAdmin
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "W2", list_price_cents: 100000, insured_value_cents: 100000 }
              as: GalleryAdmin
          trigger:
            - call: "GET /artworks"
              payload: { limit: 1, offset: 0 }
              as: GalleryAdmin
          assert:
            - "response_type == array"
            - "total_count == 2"
            - "has_more == true"

      - name: pagination_limit_out_of_bounds_rejected
        claim_type: Type Constraints
        grounds:
          - "errors[ERR_VALIDATION_PAGINATION]"
        distinguishing_aspect: "GET /artworks with limit 101 -> ERR_VALIDATION_PAGINATION 400 (max 100)."
        test_recipe:
          setup: ["Gallery exists."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Pg", home_state_code: "CA", sales_tax_rate_bps: 875 }
              as: GalleryAdmin
              captures: { g: $.data.id }
          trigger:
            - call: "GET /artworks"
              payload: { limit: 101, offset: 0 }
              as: GalleryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION_PAGINATION"
            - "http status == 400"

      - name: exhibition_closes_before_opens_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Exhibition.fields.closes_utc"
          - "validations[priority=4]"
        distinguishing_aspect: "POST /exhibitions with closes_utc <= opens_utc -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Gallery exists."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Ex", home_state_code: "CA", sales_tax_rate_bps: 875 }
              as: GalleryAdmin
              captures: { g: $.data.id }
          trigger:
            - call: "POST /exhibitions"
              payload: { gallery_id: "${g}", title: "Bad", wall_capacity: 2, opens_utc: "2026-05-10T00:00:00Z", closes_utc: "2026-05-01T00:00:00Z" }
              as: GalleryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http status == 400"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: settle_from_reserved_without_invoice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Sale.INVOICED_to_SETTLED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Settling a sale still in RESERVED (never invoiced/paid) -> ERR_INVALID_STATE; no ledger accrual."
        test_recipe:
          setup: ["Sale RESERVED, never invoiced."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Iv", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Iv A" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Iv W", list_price_cents: 200000, insured_value_cents: 200000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /sales"
              payload: { gallery_id: "${g}", artwork_id: "${aw}", buyer_name: "Iv B", buyer_state_code: "NY", gross_amount_cents: 200000 }
              as: SalesAssociate
              captures: { s: $.data.id }
          trigger:
            - call: "POST /sales/${s}/settle"
              payload: {}
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Artist.${a}.ledger_accrued_cents == 0"

      - name: cancel_exhibition_from_open_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Exhibition.PLANNED_to_CANCELLED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancel is only valid from PLANNED; from OPEN it returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Exhibition OPEN (one slot placed, clock >= opens)."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Op", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Op A" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Op W", list_price_cents: 100000, insured_value_cents: 100000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /exhibitions"
              payload: { gallery_id: "${g}", title: "Op Show", wall_capacity: 2, opens_utc: "2026-04-10T00:00:00Z", closes_utc: "2026-05-10T00:00:00Z" }
              as: GalleryAdmin
              captures: { ex: $.data.id, exv: $.data.version }
            - call: "POST /exhibitions/${ex}/wall-slots"
              payload: { artwork_id: "${aw}", wall_label: "O-1", position_index: 0, expected_exhibition_version: "${exv}" }
              as: Registrar
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: GalleryAdmin
            - call: "POST /exhibitions/${ex}/open"
              payload: {}
              as: GalleryAdmin
          trigger:
            - call: "POST /exhibitions/${ex}/cancel"
              payload: {}
              as: GalleryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: artwork_initial_state_is_consigned
        claim_type: initial_state
        grounds: [state_machines.Artwork, entities.Artwork.fields.status]
        distinguishing_aspect: "A freshly consigned artwork is in CONSIGNED with provenance entry seq 1."
        test_recipe:
          setup: ["Gallery + ACTIVE artist."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "In", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "In A" }
              as: GalleryAdmin
              captures: { a: $.data.id }
          trigger:
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "In W", list_price_cents: 100000, insured_value_cents: 100000 }
              as: GalleryAdmin
              captures: { aw: $.data.id, st: $.data.status }
          assert:
            - "Artwork.${aw}.status == CONSIGNED"

      - name: settle_sold_artwork_terminal_lockdown
        claim_type: terminal_state
        grounds:
          - "state_machines.Artwork"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Once an artwork is SOLD (terminal), voiding its sale is rejected ERR_INVALID_STATE (no resurrection)."
        test_recipe:
          setup: ["A SETTLED sale; artwork SOLD."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Tl", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Tl A" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Tl W", list_price_cents: 400000, insured_value_cents: 400000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /sales"
              payload: { gallery_id: "${g}", artwork_id: "${aw}", buyer_name: "Tl B", buyer_state_code: "NY", gross_amount_cents: 400000 }
              as: SalesAssociate
              captures: { s: $.data.id }
            - call: "POST /sales/${s}/invoice"
              payload: {}
              as: SalesAssociate
              captures: { sv: $.data.version }
            - call: "POST /sales/${s}/payments"
              payload: { amount_cents: 400000, expected_sale_version: "${sv}" }
              as: SalesAssociate
            - call: "POST /sales/${s}/settle"
              payload: {}
              as: SalesAssociate
          trigger:
            - call: "POST /sales/${s}/void"
              payload: {}
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Artwork.${aw}.status == SOLD"

      - name: rsvp_waitlisted_when_capacity_full_then_promoted_on_cancel
        claim_type: side_effect_execution
        grounds: [calculations.rsvp_seat_allocation, state_machines.Rsvp.WAITLISTED_to_PROMOTED, entities.Rsvp.fields.status]
        distinguishing_aspect: "Event capacity 10: RSVP A(4) CONFIRMED, B(5) CONFIRMED, C(3) WAITLISTED (12>10); cancel A frees 4 -> seats_free 5 -> C PROMOTED."
        test_recipe:
          setup: ["Event capacity 10; A party 4 CONFIRMED; B party 5 CONFIRMED; C party 3 WAITLISTED."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Wl", home_state_code: "CA", sales_tax_rate_bps: 875 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /exhibitions"
              payload: { gallery_id: "${g}", title: "Wl Show", wall_capacity: 3, opens_utc: "2026-05-01T00:00:00Z", closes_utc: "2026-06-01T00:00:00Z" }
              as: GalleryAdmin
              captures: { ex: $.data.id }
            - call: "POST /opening-events"
              payload: { exhibition_id: "${ex}", capacity: 10, starts_utc: "2026-05-01T18:00:00Z", rsvp_deadline_utc: "2026-04-30T00:00:00Z" }
              as: GalleryAdmin
              captures: { ev: $.data.id }
            - call: "POST /rsvps"
              payload: { opening_event_id: "${ev}", guest_name: "A", party_size: 4 }
              as: SalesAssociate
              captures: { ra: $.data.id }
            - call: "POST /rsvps"
              payload: { opening_event_id: "${ev}", guest_name: "B", party_size: 5 }
              as: SalesAssociate
              captures: { rb: $.data.id }
            - call: "POST /rsvps"
              payload: { opening_event_id: "${ev}", guest_name: "C", party_size: 3 }
              as: SalesAssociate
              captures: { rc: $.data.id, rcs: $.data.status }
          trigger:
            - call: "POST /rsvps/${ra}/cancel"
              payload: {}
              as: SalesAssociate
            - call: "GET /rsvps/${rc}"
              payload: {}
              as: SalesAssociate
              captures: { rcst: $.data.status }
          assert:
            - "Rsvp.${rc}.status == WAITLISTED before cancel"
            - "Rsvp.${rc}.status == PROMOTED after cancel of A"
            - "OpeningEvent.${ev}.confirmed_count seats == 8"

      - name: loan_sweep_overdue_marks_overdue
        claim_type: side_effect_execution
        grounds: [state_machines.Loan.OUTSTANDING_to_OVERDUE, entities.Loan.fields.status]
        distinguishing_aspect: "After clock advances past due_utc, sweep-overdue flips OUTSTANDING -> OVERDUE; artwork stays ON_LOAN."
        test_recipe:
          setup: ["Loan OUTSTANDING [2026-04-05,2026-05-05); clock set to 2026-05-06."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Od", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Od A" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Od W", list_price_cents: 200000, insured_value_cents: 200000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /loans"
              payload: { artwork_id: "${aw}", borrower_name: "Od B", coverage_value_cents: 200000, out_utc: "2026-04-05T00:00:00Z", due_utc: "2026-05-05T00:00:00Z" }
              as: Registrar
              captures: { l: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T00:00:00Z" }
              as: GalleryAdmin
          trigger:
            - call: "POST /loans/${l}/sweep-overdue"
              payload: {}
              as: Registrar
              captures: { st: $.data.status }
          assert:
            - "Loan.${l}.status == OVERDUE"
            - "Artwork.${aw}.status == ON_LOAN"

      - name: payment_plan_default_boundary_exact_two_missed
        claim_type: side_effect_execution
        grounds: [calculations.plan_default_check, state_machines.PaymentPlan.ACTIVE_to_DEFAULTED]
        distinguishing_aspect: "Plan with first_due 2026-05-01, cadence 30, 3 installments, 0 posted; clock 2026-05-31 -> 2 due -> missed 2 -> DEFAULTED."
        test_recipe:
          setup: ["Invoiced sale buyer_total 1000000; ACTIVE plan 3x cadence 30 first_due 2026-05-01; clock 2026-05-31; no installments posted."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Pd", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Pd A" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Pd W", list_price_cents: 1000000, insured_value_cents: 1000000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /sales"
              payload: { gallery_id: "${g}", artwork_id: "${aw}", buyer_name: "Pd B", buyer_state_code: "NY", gross_amount_cents: 1000000 }
              as: SalesAssociate
              captures: { s: $.data.id }
            - call: "POST /sales/${s}/invoice"
              payload: {}
              as: SalesAssociate
            - call: "POST /payment-plans"
              payload: { sale_id: "${s}", installment_count: 3, cadence_days: 30, first_due_utc: "2026-05-01T00:00:00Z" }
              as: SalesAssociate
              captures: { pl: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-31T00:00:00Z" }
              as: GalleryAdmin
          trigger:
            - call: "POST /payment-plans/${pl}/sweep-overdue"
              payload: {}
              as: SalesAssociate
              captures: { st: $.data.status }
          assert:
            - "PaymentPlan.${pl}.missed_installment_count == 2"
            - "PaymentPlan.${pl}.status == DEFAULTED"

      - name: lease_buyout_credit_after_five_months
        claim_type: side_effect_execution
        grounds: [calculations.lease_buyout, entities.LeaseAgreement.fields.buyout_price_cents]
        distinguishing_aspect: "Lease list 1000000, monthly 50000, credit 2000bps, start 2026-04-01, clock 2026-09-01 (5 mo) -> rent 250000, credit 50000, buyout 950000."
        test_recipe:
          setup: ["ACTIVE lease started 2026-04-01; clock 2026-09-01."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Lb", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Lb A" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Lb W", list_price_cents: 1000000, insured_value_cents: 1000000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /leases"
              payload: { artwork_id: "${aw}", lessee_name: "Lb L", monthly_rate_cents: 50000, term_months: 12, starts_utc: "2026-04-01T00:00:00Z", purchase_credit_bps: 2000 }
              as: SalesAssociate
              captures: { ls: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: GalleryAdmin
          trigger:
            - call: "GET /leases/${ls}"
              payload: {}
              as: SalesAssociate
              captures: { mo: $.data.months_accrued, bo: $.data.buyout_price_cents }
          assert:
            - "LeaseAgreement.${ls}.months_accrued == 5"
            - "LeaseAgreement.${ls}.rent_accrued_cents == 250000"
            - "LeaseAgreement.${ls}.buyout_price_cents == 950000"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: tax_exempt_out_of_state_buyer
        claim_type: Constants Applied
