            - "second auditor: credit_status == APPROVED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_slot_add_stale_reel_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reel-slot-add-stale-reel]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential slot creates against reel version observed at 1: the first succeeds (version advances to 2); the second, still carrying expected_reel_version 1, is deterministically rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["reel ASSEMBLING at version 1; two APPROVED campaigns of distinct categories"]
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T19:00:00Z" }, as: NetworkOps, captures: { st_id: "$.data.id" } }
            - { call: "GET /network/showtimes/${st_id}/reel", payload: {}, as: NetworkOps, captures: { r_id: "$.data[0].id", rv: "$.data[0].version" } }
            - { call: "POST /network/advertisers", payload: { name: "AutoCo", advertiser_type: NATIONAL, category: AUTOMOTIVE }, as: SalesManager, captures: { a1: "$.data.id" } }
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a1}", name: "C1", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 500000 }, as: SalesManager, as_user_id: "sm-1", captures: { c1: "$.data.id" } }
            - { call: "POST /network/campaigns/${c1}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /network/campaigns/${c1}/approve", payload: {}, as: SalesManager, as_user_id: "sm-2" }
            - { call: "POST /network/advertisers", payload: { name: "BurgerCo", advertiser_type: NATIONAL, category: QSR }, as: SalesManager, captures: { a2: "$.data.id" } }
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a2}", name: "C2", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 500000 }, as: SalesManager, as_user_id: "sm-1", captures: { c2: "$.data.id" } }
            - { call: "POST /network/campaigns/${c2}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /network/campaigns/${c2}/approve", payload: {}, as: SalesManager, as_user_id: "sm-2" }
          trigger:
            - { call: "POST /network/reels/${r_id}/slots", payload: { campaign_id: "${c1}", start_offset_seconds: 0, duration_seconds: 60, expected_reel_version: "${rv}" }, as: SalesManager }
            - { call: "POST /network/reels/${r_id}/slots", payload: { campaign_id: "${c2}", start_offset_seconds: 60, duration_seconds: 30, expected_reel_version: "${rv}" }, as: SalesManager, captures: { err: "$.data.error_id" } }
          assert:
            - "second create: http 412 and error_id == ERR_STALE_VERSION (reel version advanced to ${rv}+1 by the first create)"
            - "no second slot exists; national_used_seconds == 60"

      - name: occ_reel_lock_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reel-lock-stale-reel]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Lock carrying the pre-slot-add version (1) after the add advanced the reel to 2 fails with 412; re-reading and locking with the fresh version succeeds."
        test_recipe:
          setup: ["reel ASSEMBLING with one RESERVED slot (version now 2)"]
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T19:00:00Z" }, as: NetworkOps, captures: { st_id: "$.data.id" } }
            - { call: "GET /network/showtimes/${st_id}/reel", payload: {}, as: NetworkOps, captures: { r_id: "$.data[0].id", rv: "$.data[0].version" } }
            - { call: "POST /network/advertisers", payload: { name: "AutoCo", advertiser_type: NATIONAL, category: AUTOMOTIVE }, as: SalesManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a_id}", name: "C1", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 500000 }, as: SalesManager, as_user_id: "sm-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /network/campaigns/${c_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /network/campaigns/${c_id}/approve", payload: {}, as: SalesManager, as_user_id: "sm-2" }
            - { call: "POST /network/reels/${r_id}/slots", payload: { campaign_id: "${c_id}", start_offset_seconds: 0, duration_seconds: 60, expected_reel_version: "${rv}" }, as: SalesManager }
          trigger:
            - { call: "POST /network/reels/${r_id}/lock", payload: { expected_reel_version: "${rv}" }, as: NetworkOps, captures: { err: "$.data.error_id" } }
            - { call: "GET /network/reels/${r_id}", payload: {}, as: NetworkOps, captures: { rv2: "$.data.version" } }
            - { call: "POST /network/reels/${r_id}/lock", payload: { expected_reel_version: "${rv2}" }, as: NetworkOps, captures: { st_ok: "$.data.reel_status" } }
          assert:
            - "stale lock: http 412 ERR_STALE_VERSION; reel stays ASSEMBLING"
            - "fresh lock: reel_status == LOCKED and slot transitioned RESERVED -> CONFIRMED"

      - name: occ_credit_apply_stale_invoice_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[credit-apply-stale-invoice]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Applying make-good B with the invoice version observed before make-good A was applied (which bumped the version) fails with 412; a fresh read and retry succeeds, crediting a further 165."
        test_recipe:
          setup: ["CERTIFIED invoice (audited 2350) with make-good A APPROVED (credit 165)"]
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T19:00:00Z" }, as: NetworkOps, captures: { st_id: "$.data.id" } }
            - { call: "GET /network/showtimes/${st_id}/reel", payload: {}, as: NetworkOps, captures: { r_id: "$.data[0].id", rv: "$.data[0].version" } }
            - { call: "POST /network/advertisers", payload: { name: "AutoCo", advertiser_type: NATIONAL, category: AUTOMOTIVE }, as: SalesManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a_id}", name: "C1", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 1000, cpm_cents: 2500, budget_cents: 500000 }, as: SalesManager, as_user_id: "sm-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /network/campaigns/${c_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /network/campaigns/${c_id}/approve", payload: {}, as: SalesManager, as_user_id: "sm-2" }
            - { call: "POST /network/reels/${r_id}/slots", payload: { campaign_id: "${c_id}", start_offset_seconds: 0, duration_seconds: 60, expected_reel_version: "${rv}" }, as: SalesManager, captures: { sl: "$.data.id" } }
            - { call: "GET /network/reels/${r_id}", payload: {}, as: NetworkOps, captures: { rv2: "$.data.version" } }
            - { call: "POST /network/reels/${r_id}/lock", payload: { expected_reel_version: "${rv2}" }, as: NetworkOps }
            - { call: "POST /network/reels/${r_id}/dispatch", payload: {}, as: NetworkOps }
            - { call: "POST /network/reels/${r_id}/acknowledge-delivery", payload: { outcome: DELIVERED }, as: TheaterOps, as_user_id: "${t_id}" }
            - { call: "POST /network/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T21:30:00Z" }, as: NetworkOps }
            - { call: "POST /network/showtimes/${st_id}/attendance-reports", payload: { reported_attendance: 940 }, as: TheaterOps, as_user_id: "${t_id}", captures: { ar: "$.data.id" } }
            - { call: "POST /network/attendance-reports/${ar}/review", payload: { decision: ACCEPT }, as: NetworkOps }
            - { call: "POST /network/slots/${sl}/playlogs", payload: { outcome: VERIFIED }, as: TheaterOps, as_user_id: "${t_id}" }
            - { call: "POST /network/campaigns/${c_id}/invoices", payload: { period_start_date: "2026-08-10", period_end_date: "2026-08-20" }, as: SalesManager, captures: { inv: "$.data.id" } }
            - { call: "POST /network/invoices/${inv}/issue", payload: {}, as: SalesManager, as_user_id: "sm-2" }
            - { call: "POST /network/invoices/${inv}/certify", payload: {}, as: Auditor, as_user_id: "aud-1" }
            - { call: "POST /network/invoices/${inv}/make-goods", payload: {}, as: Auditor, as_user_id: "aud-1", captures: { mg1: "$.data.id" } }
            - { call: "POST /network/make-goods/${mg1}/review", payload: { decision: APPROVE }, as: Auditor, as_user_id: "aud-2" }
            - { call: "GET /network/invoices/${inv}", payload: {}, as: SalesManager, captures: { iv: "$.data.version" } }
          trigger:
            - { call: "POST /network/make-goods/${mg1}/apply", payload: { expected_invoice_version: "${iv}" }, as: SalesManager }
            - { call: "POST /network/invoices/${inv}/make-goods", payload: {}, as: Auditor, as_user_id: "aud-1", captures: { mg2: "$.data.id" } }
            - { call: "POST /network/make-goods/${mg2}/review", payload: { decision: APPROVE }, as: Auditor, as_user_id: "aud-2" }
            - { call: "POST /network/make-goods/${mg2}/apply", payload: { expected_invoice_version: "${iv}" }, as: SalesManager, captures: { err: "$.data.error_id" } }
            - { call: "GET /network/invoices/${inv}", payload: {}, as: SalesManager, captures: { iv2: "$.data.version" } }
            - { call: "POST /network/make-goods/${mg2}/apply", payload: { expected_invoice_version: "${iv2}" }, as: SalesManager, captures: { st_ok: "$.data.credit_status" } }
          assert:
            - "apply with stale expected_invoice_version: http 412 ERR_STALE_VERSION"
            - "retry with fresh version: credit_status == APPLIED"
            - "final invoice state: applied_credit_cents == 330 and final_amount_cents == 2020 (2350 - 165 - 165)"

      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: ["entities.Campaign", "complexity_profile.complexity_layers"]
        distinguishing_aspect: "Common-field discipline: a Campaign is created at version 1 and each mutating call (PATCH) advances it by exactly 1 with a refreshed updated_at."
        test_recipe:
          setup: ["campaign created in DRAFT"]
          setup_api_calls:
            - { call: "POST /network/advertisers", payload: { name: "AutoCo", advertiser_type: NATIONAL, category: AUTOMOTIVE }, as: SalesManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a_id}", name: "C1", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 500000 }, as: SalesManager, as_user_id: "sm-1", captures: { c_id: "$.data.id", v0: "$.data.version" } }
          trigger:
            - { call: "PATCH /network/campaigns/${c_id}", payload: { name: "C1-renamed" }, as: SalesManager, as_user_id: "sm-1", captures: { v1: "$.data.version" } }
          assert:
            - "create: version == 1; after PATCH: version == 2 and updated_at refreshed"

      - name: layer_cascading_side_effects
        claim_type: cascading_side_effects
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: "transitive_cascade / audit_revision_cascade_depth3; transitive_cascade / playlog_failure_cascade_depth2"
          rationale: "The N-level cascade chains are asserted end-to-end by the named §1.8 instances."

      - name: layer_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / invoice_provisional_vs_audited_billing; dual_variant_calc / forecast_opening_week_vs_standard; calculations / attributed_partial_strict_vs_lenient"
          rationale: "Variant divergence and reconciliation are asserted by the named instances."

      - name: layer_rate_threshold_triggers
        claim_type: rate_threshold_triggers
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / make_good_threshold_exactly_5pct_rejected; boundary_precision_check / pool_capacity_exact_fill_allowed"
          rationale: "Cumulative and instantaneous threshold boundaries are asserted by the named §1.8 instances."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_of_credits_and_cascades
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        excluded_because:
          difficulty_instance: "calculations / make_good_eligible_credit_computed_and_applied; transitive_cascade / audit_revision_cascade_depth3"
          rationale: "Credit math is asserted visible in the same response cycle as the apply call, and cascade results are asserted immediately after the audit call — the immediate-consistency claim has no separate residual behavior to test."
