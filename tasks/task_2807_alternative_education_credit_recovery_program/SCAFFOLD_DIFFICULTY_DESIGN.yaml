  - rule_id: transitive_cascade
    instances:
      - name: award_credit_cascade_to_cohort_flag
        depth: 4
        grounds:
          - state_machines.CourseEnrollment.SUBMITTED_FOR_AWARD_to_AWARDED
          - state_machines.GraduationPlan.ACTIVE_to_COMPLETED
          - calculations.transcript_gpa
          - calculations.graduation_plan_posture
          - calculations.cohort_accountability
          - entities.HomeSchool.fields.cohort_flag
        distinguishing_aspect: |
          A single POST /course-enrollments/{id}/award-credit walks four hops that each live on a
          different entity: hop 1 posts the CreditAward and stamps the failed PriorCourseRecord
          REPLACED, hop 2 re-derives Student.credits_earned_total/gpa, hop 3 completes the
          GraduationPlan, hop 4 flips Student.status to GRADUATED and re-rates the HomeSchool cohort
          (adjusted_grad_rate 1.0000, cohort_flag COMPLIANT). Only the last hop is observable on an
          entity the request never names.
        test_recipe:
          setup:
            - "one home school with accountability_cohort_year 2026 (cohort_size 0, adjusted_grad_rate null, cohort_flag NOT_RATED)"
            - "one center with seat_capacity 10, certified_teacher_fte 4.00, max_students_per_teacher 12"
            - "one PACKET course ALG1 with credit_value 1.00, total_modules 8, required_seat_hours 60.00, proctoring_required false, ncaa_approved false"
            - "one grade-12 student in cohort_year 2026 who FAILED ALG1 historically (original_percent 48.00, credits_attempted 1.00, original_grade_code F, replacement_status NOT_REPLACED)"
            - "an ACTIVE graduation plan with required_credits_total 1.00 and grade_replacement_policy REPLACE_ON_RECOVERY"
            - "a COMPETENCY placement holding one CREDIT_RECOVERY enrollment in ALG1 backed by that failed record, with modules_passed 7, module_avg_percent 84.00 (mastery_pct 84.00), submitted for award at final_percent 84.00 by user teach-01"
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
            - call: "POST /centers"
              payload: { name: "Cedar AEC", seat_capacity: 10, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_id: $.data.id, ctr_v1: $.data.version }
            - call: "POST /courses"
              payload: { code: "ALG1", title: "Algebra I", subject_area: "MATH", credit_value: 1.00, modality: "PACKET", total_modules: 8, required_seat_hours: 60.00, pacing_days: 40, proctoring_required: false, ncaa_approved: false, min_passing_percent: 60.00 }
              as: DistrictAdmin
              captures: { crs_id: $.data.id }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-7001", full_name: "Ida Novak", cohort_year: 2026, grade_level: 12 }
              as: Registrar
