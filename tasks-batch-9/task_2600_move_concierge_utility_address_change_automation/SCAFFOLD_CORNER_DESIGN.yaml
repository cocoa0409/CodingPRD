      - name: priority_ordering_self_merge_outranks_survivor_eligibility
        claim_type: priority_ordering
        grounds:
          - "validations[priority=43]"
          - "validations[priority=44]"
          - "errors[ERR_SELF_MERGE_FORBIDDEN]"
          - "errors[ERR_SURVIVOR_MOVE_INVALID]"
        distinguishing_aspect: |
          A move is always eligible to be its own survivor by the resident/address test, so a
          request naming itself violates priority 43 and satisfies priority 44's data test at the
          same time. The reported error must be the self-merge one. The remaining calls then
          separate the two independent clauses of priority 44: a survivor that shares neither key,
          and a survivor that shares the resident but has reached a terminal state.
        test_recipe:
          setup:
