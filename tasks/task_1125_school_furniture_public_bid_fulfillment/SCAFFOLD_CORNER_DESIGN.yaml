            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "AWARD_FLAT", flat_unit_price_cents: 11000, install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po1: $.data.id } }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 10 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { l1: $.data.id } }
            - { call: "POST /v1/purchase-orders/${po1}/accept", payload: {}, as: FulfillmentCoordinator }
            - { call: "POST /v1/shipments", payload: { purchase_order_id: "${po1}", school_site_id: "${site1}", scheduled_date: "2026-07-01", lines: [ { po_line_id: "${l1}", qty: 10 } ] }, as: FulfillmentCoordinator, captures: { ship1: $.data.id } }
            - { call: "POST /v1/shipments/${ship1}/mark-delivered", payload: { lines: [ { po_line_id: "${l1}", delivered_qty: 10, manufacturer: "Acme", model: "Desk-100" } ] }, as: FulfillmentCoordinator }
          trigger:
            - { call: "POST /v1/po-lines/${l1}/declare-backorder", payload: { initial_eta_date: "2026-07-20" }, as: FulfillmentCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (ordered_qty - delivered_qty == 0; no remainder to backorder)"

      - name: po_closeout_total_cents_computed_at_close
        claim_type: computed_read
        grounds: [entities.PurchaseOrder.fields.closeout_total_cents]
        excluded_because:
          difficulty_instance: install_closeout_per_line_rounding_before_sum
          rationale: "The close endpoint's computed closeout_total_cents is asserted with a pre-computed literal (97600) in the named §1.8 instance."

