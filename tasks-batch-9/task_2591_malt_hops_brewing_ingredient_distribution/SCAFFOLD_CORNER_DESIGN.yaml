          assert:
            - "order EARLY: HTTP 422 with ${dw_err} == ERR_SHIP_DATE_OUTSIDE_DELIVERY_WINDOW, fulfillment_status still DRAFT and HopContract.${dw_k_id}.committed_lbs == 0"
            - "order EDGE at exactly delivery_window_end: HTTP 200 with ${dw_status} == CONFIRMED"
            - "${dw_total} == 305000 — subtotal 250000, freight 25000 at the TIER_1 minimum plus the 18000 reefer surcharge, pallet break 4500, small-order surcharge 7500, no volume discount because 250000 is under DISCOUNT_TIER_1_CENTS"
            - "HopContract.${dw_k_id}.committed_lbs == 1000 and remaining_lbs == 4000 after the EDGE confirm"
            - "the line on order EARLY is still status OPEN — the window check refuses the confirm, it does not trim the line"

      - name: propagation_accepts_a_pitch_date_exactly_at_the_lead_time
        claim_type: Temporal validation
        grounds:
          - validations[priority=28]
          - errors.ERR_INSUFFICIENT_PROPAGATION_LEAD_TIME
          - entities.YeastStrain.fields.propagation_lead_time_days
        distinguishing_aspect: "The lead-time gate counts whole days from the logical clock and is inclusive at the boundary: with a 7-day strain and the clock at 2026-08-01, a pitch date of 2026-08-07 is refused and 2026-08-08 is accepted."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer in GOOD_STANDING; WLP001 with propagation_lead_time_days 7; a recipe on that strain."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Lead Time Brewing", brewery_license_no: "BR-1028", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: false, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { lt_id: $.data.id }
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { lt_prod_id: $.data.id }
            - call: "POST /yeast-strains"
              payload: { strain_code: "WLP001", name: "California Ale", fermentation_type: "ALE", propagation_lead_time_days: 7, list_price_cents_per_l: 1200.00, viability_pct_at_ship: 92.0, cells_per_ml_slurry_billion: 1.2, min_batch_l: 20.0, vessel_max_l: 2000.0 }
              as: WarehouseOperator
              captures: { lt_strain_id: $.data.id }
            - call: "POST /brewer-recipes"
              payload: { brewer_id: "${lt_id}", malt_product_id: "${lt_prod_id}", yeast_strain_id: "${lt_strain_id}", name: "House Ale", batch_volume_bbl: 30.0, original_gravity_plato: 12.50, target_color_lovibond: 2.50, target_extract_pct: 80.00, target_protein_pct: 11.00, requested_pitch_rate_million_cells_per_ml_per_plato: 0.75, adjunct_pct: 0.0 }
              as: Brewer
              as_user_id: "${lt_id}"
              captures: { lt_recipe_id: $.data.id }
          trigger:
            - call: "POST /yeast-propagation-jobs"
              payload: { brewer_id: "${lt_id}", recipe_id: "${lt_recipe_id}", yeast_strain_id: "${lt_strain_id}", pitch_date: "2026-08-07T00:00:00Z" }
              as: Brewer
              as_user_id: "${lt_id}"
              captures: { lt_err: $.data.error_id }
            - call: "POST /yeast-propagation-jobs"
              payload: { brewer_id: "${lt_id}", recipe_id: "${lt_recipe_id}", yeast_strain_id: "${lt_strain_id}", pitch_date: "2026-08-08T00:00:00Z" }
              as: Brewer
              as_user_id: "${lt_id}"
              captures: { lt_job_id: $.data.id, lt_job_status: $.data.status }
          assert:
            - "six days out: HTTP 422 with ${lt_err} == ERR_INSUFFICIENT_PROPAGATION_LEAD_TIME and no job row is created"
            - "exactly seven days out: HTTP 201 with ${lt_job_status} == REQUESTED"
            - "YeastPropagationJob.${lt_job_id}.ready_at == null — readiness is dated when the job starts, not when it is requested"
            - "advancing the clock to 2026-08-02 and requesting 2026-08-08 again returns 422, because the gate is measured from the CURRENT logical clock"

      - name: staging_window_must_be_strictly_forward
        claim_type: Violation -> Error
        grounds:
          - validations[priority=26]
          - errors.ERR_INVALID_STAGING_WINDOW
        distinguishing_aspect: "A zero-length staging window is refused as firmly as an inverted one, so stage_until == stage_from cannot be used to park a pallet without consuming zone capacity."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Certified brewer; Citra requiring reefer; zone Z1 with capacity 10."
            - "An 880 lb SPOT Citra order confirmed, credit APPROVED and PICKED, so it is eligible for staging."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
