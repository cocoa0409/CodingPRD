            - call: "POST /hhg/shipments"
              payload: { order_id: "${o_id}", entitlement_id: "${ent_id}", tsp_id: "${tsp_id}", shipment_code: "SHP-0021", shipment_method: "HHG", origin_market_code: "MKT-BWI", requested_pack_date: "2026-08-14T00:00:00Z", requested_pickup_date: "2026-08-17T00:00:00Z", requested_delivery_date: "2026-08-24T00:00:00Z", expected_entitlement_version: "${ent_v}" }
              as: MoveCounselor
