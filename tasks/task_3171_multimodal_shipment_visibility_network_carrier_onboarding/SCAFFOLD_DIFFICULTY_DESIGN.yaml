# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3171_multimodal_shipment_visibility_network_carrier_onboarding
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 and drives empty-DB state
# via declared §1.5 endpoints only. All formula-derived asserts were computed
# by hand from §1.3 formulas and constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: eta_scheduled_baseline_vs_telemetry_blended_diverge
        grounds:
          - calculations.eta_prediction
          - entities.Shipment.fields.eta_at
          - entities.Shipment.fields.eta_variant
        distinguishing_aspect: |
          Shipment-domain dual variant: for identical planned timestamps, the
          SCHEDULED_BASELINE variant yields eta_at == planned_arrival_at while
          TELEMETRY_BLENDED on a second shipment with a DELAY_REPORTED event
          yields eta_at == 2026-09-03T03:00:00Z — different results for the
          same plan data, on the Shipment entity domain.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One carrier with an ACTIVE TELEMATICS connection supporting TRUCKLOAD (quality scored 100 via a single on-time heartbeat inside a 15-minute checkpoint window: expected_count = floor(15/15) = 1)."
            - "Shipper with two TRUCKLOAD shipments on that connection, both planned 2026-09-01T00:00:00Z -> 2026-09-03T00:00:00Z (R = 2880 minutes)."
            - "Shipment B has two events: DEPARTED at 2026-09-01T12:00:00Z, DELAY_REPORTED at 2026-09-01T18:00:00Z with delay_minutes 180."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "RoadOne", scac_code: "RDON" }
              as: NetworkOps
              captures: { dv_car_id: $.data.id }
            - call: "POST /carriers/${dv_car_id}/connections"
              payload: { channel: "TELEMATICS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { dv_conn_id: $.data.id }
            - call: "POST /connections/${dv_conn_id}/submit-credentials"
              payload: { credential_ref: "vault://rdon-telematics" }
              as: CarrierRep
              as_user_id: "${dv_car_id}"
            - call: "POST /connections/${dv_conn_id}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-10T00:00:00Z" }
              as: NetworkOps
            - call: "POST /connections/${dv_conn_id}/heartbeats"
              payload: { reported_at: "2026-09-01T00:00:00Z", payload_completeness_pct: 100 }
              as: CarrierRep
              as_user_id: "${dv_car_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:15:00Z" }
              as: PlatformAdmin
            - call: "POST /_ops/run-checkpoint"
              payload: {}
              as: PlatformAdmin
            - call: "POST /connections/${dv_conn_id}/activate"
              payload: {}
              as: NetworkOps
            - call: "POST /shippers"
              payload: { company_name: "ShipCo" }
              as: PlatformAdmin
              captures: { dv_shp_id: $.data.id }
            - call: "POST /shippers/${dv_shp_id}/shipments"
              payload: { carrier_id: "${dv_car_id}", connection_id: "${dv_conn_id}", mode: "TRUCKLOAD", tracking_reference: "TRK-A", mode_reference: "PRO-1", destination_code: "LAX", planned_departure_at: "2026-09-01T00:00:00Z", planned_arrival_at: "2026-09-03T00:00:00Z" }
              as: ShipperRep
              as_user_id: "${dv_shp_id}"
              captures: { dv_ship_a: $.data.id }
            - call: "POST /shippers/${dv_shp_id}/shipments"
              payload: { carrier_id: "${dv_car_id}", connection_id: "${dv_conn_id}", mode: "TRUCKLOAD", tracking_reference: "TRK-B", mode_reference: "PRO-2", destination_code: "LAX", planned_departure_at: "2026-09-01T00:00:00Z", planned_arrival_at: "2026-09-03T00:00:00Z" }
              as: ShipperRep
              as_user_id: "${dv_shp_id}"
              captures: { dv_ship_b: $.data.id }
            - call: "POST /shipments/${dv_ship_b}/events"
              payload: { event_time: "2026-09-01T12:00:00Z", event_type: "DEPARTED" }
              as: CarrierRep
              as_user_id: "${dv_car_id}"
            - call: "POST /shipments/${dv_ship_b}/events"
              payload: { event_time: "2026-09-01T18:00:00Z", event_type: "DELAY_REPORTED", delay_minutes: 180 }
              as: CarrierRep
              as_user_id: "${dv_car_id}"
          trigger:
            - call: "GET /shipments/${dv_ship_a}"
              payload: {}
              as: NetworkOps
            - call: "GET /shipments/${dv_ship_b}"
              payload: {}
              as: NetworkOps
          assert:
            - "Shipment.${dv_ship_a}.eta_variant == SCHEDULED_BASELINE and eta_at == \"2026-09-03T00:00:00Z\""
            - "Shipment.${dv_ship_b}.eta_variant == TELEMETRY_BLENDED and eta_at == \"2026-09-03T03:00:00Z\""
            - "Shipment.${dv_ship_b}.eta_confidence_halfwidth_minutes == 120 (BASE 120 * (1 + 0/100), quality 100, FRESH)"

      - name: quality_score_instantaneous_vs_epoch_windowed_diverge
        grounds:
          - calculations.data_quality_score_epoch
          - calculations.data_quality_score_instantaneous
          - entities.CarrierConnection.fields.data_quality_score
          - entities.CarrierConnection.fields.instantaneous_quality_score
        distinguishing_aspect: |
          CarrierConnection-domain dual variant (different entity domain from
          the ETA instance): the same two on-time completeness-80 heartbeats in
          a 6000-minute window produce epoch_windowed data_quality_score == 70
          while the instantaneous variant on the latest heartbeat yields 92.
        test_recipe:
          setup:
            - "Logical clock starts 2026-09-01T00:00:00Z. TMS connection (cadence 240) in TESTING with window [2026-09-01, 2026-09-10]."
            - "Two on-time heartbeats, both payload_completeness_pct 80, recorded at 2026-09-01T10:00:00Z and 2026-09-02T00:00:00Z."
            - "Checkpoint runs at 2026-09-05T04:00:00Z: window W = 6000 minutes, total = 2, expected_count = floor(6000/240) = 25, cadence_raw = 100*min(1, 2/25) = 8."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "DualScore Carriers", scac_code: "DSCC" }
              as: NetworkOps
              captures: { qs_car_id: $.data.id }
            - call: "POST /carriers/${qs_car_id}/connections"
              payload: { channel: "TMS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { qs_conn_id: $.data.id }
            - call: "POST /connections/${qs_conn_id}/submit-credentials"
              payload: { credential_ref: "vault://dscc" }
              as: CarrierRep
              as_user_id: "${qs_car_id}"
            - call: "POST /connections/${qs_conn_id}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-10T00:00:00Z" }
              as: NetworkOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /connections/${qs_conn_id}/heartbeats"
              payload: { reported_at: "2026-09-01T10:00:00Z", payload_completeness_pct: 80 }
              as: CarrierRep
              as_user_id: "${qs_car_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /connections/${qs_conn_id}/heartbeats"
              payload: { reported_at: "2026-09-02T00:00:00Z", payload_completeness_pct: 80 }
              as: CarrierRep
              as_user_id: "${qs_car_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T04:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_ops/run-checkpoint"
              payload: {}
              as: PlatformAdmin
            - call: "GET /connections/${qs_conn_id}"
              payload: {}
              as: NetworkOps
          assert:
            - "CarrierConnection.${qs_conn_id}.data_quality_score == 70 (round_half_up(0.40*100 + 0.35*80 + 0.25*8) = round_half_up(70.0))"
            - "CarrierConnection.${qs_conn_id}.instantaneous_quality_score == 92 (round_half_up(0.60*100 + 0.40*80))"
            - "CarrierConnection.${qs_conn_id}.health_status == HEALTHY"
            - "CarrierConnection.${qs_conn_id}.data_quality_score != CarrierConnection.${qs_conn_id}.instantaneous_quality_score"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: quality_score_per_dimension_rounding_order
        grounds:
          - calculations.data_quality_score_epoch
        distinguishing_aspect: |
          Mode (b) nested-rounding: rounding each dimension to integer BEFORE
          the weighted sum is pinned — cadence_raw 33.33 rounds to 33 first,
          yielding round_half_up(40 + 35 + 8.25) == 83; summing raw values
          first (40 + 35 + 8.33 = 83.33) would round to the same 83 here, so
          the load-bearing pin is proven by the companion boundary instance
          where per-dimension rounding of 68.95 lands on 69, not 70 — order
          changes the integer outcome.
        test_recipe:
          setup:
            - "Logical clock starts 2026-09-01T00:00:00Z. TMS connection (cadence 240) in TESTING, window [2026-09-01, 2026-09-10]."
            - "One on-time heartbeat, payload_completeness_pct 100, recorded at 2026-09-01T10:00:00Z."
            - "Checkpoint at 2026-09-01T12:00:00Z: W = 720 minutes, expected_count = floor(720/240) = 3, total = 1, cadence_raw = 33.333..., d = round_half_up = 33, t = 100, c = 100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "RoundCo", scac_code: "RNDC" }
              as: NetworkOps
              captures: { ro_car_id: $.data.id }
            - call: "POST /carriers/${ro_car_id}/connections"
              payload: { channel: "TMS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { ro_conn_id: $.data.id }
            - call: "POST /connections/${ro_conn_id}/submit-credentials"
              payload: { credential_ref: "vault://rndc" }
              as: CarrierRep
              as_user_id: "${ro_car_id}"
            - call: "POST /connections/${ro_conn_id}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-10T00:00:00Z" }
              as: NetworkOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /connections/${ro_conn_id}/heartbeats"
              payload: { reported_at: "2026-09-01T10:00:00Z", payload_completeness_pct: 100 }
              as: CarrierRep
              as_user_id: "${ro_car_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_ops/run-checkpoint"
              payload: {}
              as: PlatformAdmin
            - call: "GET /connections/${ro_conn_id}"
              payload: {}
              as: NetworkOps
          assert:
            - "CarrierConnection.${ro_conn_id}.data_quality_score == 83 (round_half_up(0.40*100 + 0.35*100 + 0.25*33) = round_half_up(83.25))"
            - "CarrierConnection.${ro_conn_id}.health_status == HEALTHY (83 >= 70)"

      - name: detention_exposure_tiered_free_time_and_adherence_grace
        grounds:
          - calculations.detention_exposure
          - entities.Appointment.fields.exposure_minutes
        distinguishing_aspect: |
          Mode (a) combinatorial: three inputs (dwell, tiered free_time by
          shipment mode, adherent conditional) with a nested max() — an
          adherent 120-minute TRUCKLOAD dwell yields exposure 0
          (max(0, 120 - 120 - 15)) while a non-adherent 210-minute dwell at
          the same facility yields 90 (max(0, 210 - 120)), showing the
          conditional grace branch flips the tiered result.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Facility ACTIVE. Carrier with connection in TESTING (shipment creation allowed), TRUCKLOAD shipment."
            - "Appointment X: window [2026-09-01T10:00, 2026-09-01T11:00), adherent completion arrival 10:30 depart 12:30."
            - "Appointment Y: window [2026-09-02T10:00, 2026-09-02T11:00), non-adherent completion arrival 11:30 depart 15:00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "DetCo", scac_code: "DETC" }
              as: NetworkOps
              captures: { de_car_id: $.data.id }
            - call: "POST /carriers/${de_car_id}/connections"
              payload: { channel: "TMS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { de_conn_id: $.data.id }
            - call: "POST /connections/${de_conn_id}/submit-credentials"
              payload: { credential_ref: "vault://detc" }
              as: CarrierRep
              as_user_id: "${de_car_id}"
            - call: "POST /connections/${de_conn_id}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-10T00:00:00Z" }
              as: NetworkOps
            - call: "POST /shippers"
              payload: { company_name: "DetShip" }
              as: PlatformAdmin
              captures: { de_shp_id: $.data.id }
            - call: "POST /shippers/${de_shp_id}/shipments"
              payload: { carrier_id: "${de_car_id}", connection_id: "${de_conn_id}", mode: "TRUCKLOAD", tracking_reference: "TRK-D", mode_reference: "PRO-D", destination_code: "DAL", planned_departure_at: "2026-09-01T00:00:00Z", planned_arrival_at: "2026-09-03T00:00:00Z" }
              as: ShipperRep
              as_user_id: "${de_shp_id}"
              captures: { de_ship_id: $.data.id }
            - call: "POST /facilities"
              payload: { facility_name: "Dal DC", facility_type: "DESTINATION" }
              as: PlatformAdmin
              captures: { de_fac_id: $.data.id, de_fac_v: $.data.version }
            - call: "POST /facilities/${de_fac_id}/appointments"
              payload: { shipment_id: "${de_ship_id}", window_start: "2026-09-01T10:00:00Z", window_end: "2026-09-01T11:00:00Z", expected_facility_version: "${de_fac_v}" }
              as: CarrierRep
              as_user_id: "${de_car_id}"
              captures: { de_appt_x: $.data.id }
            - call: "GET /facilities/${de_fac_id}"
              payload: {}
              as: PlatformAdmin
              captures: { de_fac_v2: $.data.version }
            - call: "POST /facilities/${de_fac_id}/appointments"
              payload: { shipment_id: "${de_ship_id}", window_start: "2026-09-02T10:00:00Z", window_end: "2026-09-02T11:00:00Z", expected_facility_version: "${de_fac_v2}" }
              as: CarrierRep
              as_user_id: "${de_car_id}"
              captures: { de_appt_y: $.data.id }
          trigger:
            - call: "POST /appointments/${de_appt_x}/complete"
              payload: { actual_arrival_at: "2026-09-01T10:30:00Z", actual_departure_at: "2026-09-01T12:30:00Z" }
              as: CarrierRep
              as_user_id: "${de_car_id}"
            - call: "POST /appointments/${de_appt_y}/complete"
              payload: { actual_arrival_at: "2026-09-02T11:30:00Z", actual_departure_at: "2026-09-02T15:00:00Z" }
              as: CarrierRep
              as_user_id: "${de_car_id}"
            - call: "GET /facilities/${de_fac_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Appointment.${de_appt_x}.adherent == true and dwell_minutes == 120 and exposure_minutes == 0 (max(0, 120 - 120 - 15))"
            - "Appointment.${de_appt_y}.adherent == false and dwell_minutes == 210 and exposure_minutes == 90 (max(0, 210 - 120))"
            - "Facility.${de_fac_id}.total_dwell_minutes == 330"
            - "Facility.${de_fac_id}.detention_exposure_minutes == 90"
            - "Facility.${de_fac_id}.appointment_adherence_pct == 50 (round_half_up(100 * 1/2))"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: connection_testing_timeout_cycle_back_to_draft
        grounds:
          - state_machines.CarrierConnection.TESTING_to_DRAFT
          - state_machines.CarrierConnection.ACTIVE_to_SUSPENDED
          - state_machines.CarrierConnection.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          CarrierConnection is cyclic, not a pipeline: TESTING auto-resets to
          DRAFT at checkpoint when its window expires (cycle 1), and an
          ACTIVE connection can be SUSPENDED and resumed back to ACTIVE
          (cycle 2) — resume additionally gated on a remediation heartbeat
          recorded after suspended_at.
        test_recipe:
          setup:
            - "Logical clock starts 2026-09-01T00:00:00Z. Connection A: TESTING with window [2026-09-01, 2026-09-02]; clock advances past window end before activation."
            - "Connection B: scored 100 and ACTIVE, then suspended at 2026-09-03T00:00:00Z; a remediation heartbeat is posted at 2026-09-03T00:05:00Z while SUSPENDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "CycleCarrier", scac_code: "CYCC" }
              as: NetworkOps
              captures: { cy_car_id: $.data.id }
            - call: "POST /carriers/${cy_car_id}/connections"
              payload: { channel: "TELEMATICS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { cy_conn_a: $.data.id }
            - call: "POST /connections/${cy_conn_a}/submit-credentials"
              payload: { credential_ref: "vault://cycc-a" }
              as: CarrierRep
              as_user_id: "${cy_car_id}"
            - call: "POST /connections/${cy_conn_a}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-02T00:00:00Z" }
              as: NetworkOps
            - call: "POST /carriers/${cy_car_id}/connections"
              payload: { channel: "TELEMATICS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { cy_conn_b: $.data.id }
            - call: "POST /connections/${cy_conn_b}/submit-credentials"
              payload: { credential_ref: "vault://cycc-b" }
              as: CarrierRep
              as_user_id: "${cy_car_id}"
            - call: "POST /connections/${cy_conn_b}/begin-testing"
              payload: { testing_window_start: "2026-09-03T00:00:00Z", testing_window_end: "2026-09-10T00:00:00Z" }
              as: NetworkOps
            - call: "POST /connections/${cy_conn_b}/heartbeats"
              payload: { reported_at: "2026-09-01T00:00:00Z", payload_completeness_pct: 100 }
              as: CarrierRep
              as_user_id: "${cy_car_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:15:00Z" }
              as: PlatformAdmin
            - call: "POST /_ops/run-checkpoint"
              payload: {}
              as: PlatformAdmin
            - call: "POST /connections/${cy_conn_b}/activate"
              payload: {}
              as: NetworkOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /connections/${cy_conn_b}/suspend"
              payload: { reason: "manual audit" }
              as: NetworkOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:05:00Z" }
              as: PlatformAdmin
            - call: "POST /connections/${cy_conn_b}/heartbeats"
              payload: { reported_at: "2026-09-03T00:05:00Z", payload_completeness_pct: 100 }
              as: CarrierRep
              as_user_id: "${cy_car_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:10:00Z" }
              as: PlatformAdmin
            - call: "POST /_ops/run-checkpoint"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /connections/${cy_conn_a}/submit-credentials"
              payload: { credential_ref: "vault://cycc-a2" }
              as: CarrierRep
              as_user_id: "${cy_car_id}"
              captures: { cy_conn_a_state: $.data.status }
            - call: "POST /connections/${cy_conn_b}/resume"
              payload: {}
              as: NetworkOps
              captures: { cy_conn_b_state: $.data.status }
          assert:
            - "the second checkpoint reset Connection ${cy_conn_a} TESTING -> DRAFT (window_end 2026-09-02T00:00:00Z < now 2026-09-03T00:10:00Z)"
            - "after re-submitting credentials, Connection.${cy_conn_a}.status == CREDENTIALS_SUBMITTED (cycle DRAFT -> ... -> TESTING -> DRAFT -> CREDENTIALS_SUBMITTED)"
            - "Connection.${cy_conn_b}.status == ACTIVE after resume (cycle ACTIVE -> SUSPENDED -> ACTIVE): remediation proven because the heartbeat recorded at 2026-09-03T00:05:00Z is strictly after suspended_at 2026-09-03T00:00:00Z"
            - "Connection.${cy_conn_b}.suspended_at is null after resume"

      - name: shipment_parallel_identity_and_tracking_dimensions
        grounds:
          - state_machines.Shipment
          - entities.Shipment.fields.tracking_status
          - entities.Shipment.fields.identity_state
        distinguishing_aspect: |
          Shipment carries two independent state dimensions on one row:
          tracking_status (event-replay derived, cyclic via
          IN_TRANSIT -> EXCEPTION -> IN_TRANSIT) and identity_state
          (UNRESOLVED -> MATCHED_PROVISIONAL -> MATCHED_CONFIRMED); the test
          interleaves a tracking cycle with identity confirmation and shows
          neither dimension perturbs the other.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. ACTIVE TELEMATICS connection (quality 100). Shipper, PO (po_number PO-7, booking_reference BK-7, destination_code LAX)."
            - "Shipment with po_reference_claim PO-7, tracking_reference BK-7, destination_code LAX (match score 1.0), planned 2026-09-01 -> 2026-09-03."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "ParCo", scac_code: "PARC" }
              as: NetworkOps
              captures: { pd_car_id: $.data.id }
            - call: "POST /carriers/${pd_car_id}/connections"
              payload: { channel: "TELEMATICS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { pd_conn_id: $.data.id }
            - call: "POST /connections/${pd_conn_id}/submit-credentials"
