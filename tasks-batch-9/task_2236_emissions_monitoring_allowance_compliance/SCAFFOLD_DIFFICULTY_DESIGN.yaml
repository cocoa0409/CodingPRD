      - name: cascade_true_up_shortfall_creates_penalty_flips_posture_and_restricts_dispatch
        grounds:
          - state_machines.AllowanceAccount.OPEN_to_TRUE_UP_LOCKED
          - state_machines.Unit.ONLINE_to_RESERVE_SHUTDOWN
          - calculations.allowance_true_up_waterfall
          - calculations.facility_compliance_posture
          - entities.AllowanceTransaction.fields.origin
          - entities.Unit.fields.dispatch_restricted
        distinguishing_aspect: |
          DEPTH-4 cascade triggered by a DIFFERENT transition — AllowanceAccount
          OPEN -> TRUE_UP_LOCKED — which crosses three aggregates the
          out-of-control cascade never touches: the account waterfall mints a
          TRUE_UP_PENALTY transaction, that flips Facility.compliance_posture to
          DEFICIT, and the posture change reaches down to every Unit of the
          facility, shutting down only the ONLINE one.
