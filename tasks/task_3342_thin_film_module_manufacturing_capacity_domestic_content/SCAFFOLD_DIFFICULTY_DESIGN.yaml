  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (>=2 instances, different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: delivery_windows_half_open_touching
        grounds:
          - calculations.delivery_window_conflict
          - validations[priority=8]
        distinguishing_aspect: |
          Interval semantics = half-open [start, end) pointwise overlap on the
          reservation's delivery timeline: strict overlap (2027-03-15 inside
          [2027-03-01, 2027-04-01)) conflicts, but touching
          (new_start == existing_end) is NOT a conflict and is accepted.
        test_recipe:
          setup:
            - "Customer C (TIER_A) with ACTIVE reservation R (contracted_mw 10.0); VERIFIED lot"
            - "Delivery D1 SCHEDULED [2027-03-01T00:00:00Z, 2027-04-01T00:00:00Z) volume 1.0"
          setup_api_calls:
            - call: "POST /v1/customers"
