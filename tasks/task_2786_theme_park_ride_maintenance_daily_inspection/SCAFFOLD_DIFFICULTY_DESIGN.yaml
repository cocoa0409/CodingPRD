              as: ParkOpsAdmin
              captures: { attr2_id: "$.data.id" }
            - call: "POST /park-ops/components"
              payload: { attraction_id: "${attr1_id}", name: "Lift chain assembly", component_type: "LIFT_CHAIN", criticality: "SAFETY_CRITICAL", ndt_interval_cycles: 80000, ndt_interval_days: 365 }
              as: ParkOpsAdmin
              captures: { comp1_id: "$.data.id" }
            - call: "POST /park-ops/components"
              payload: { attraction_id: "${attr2_id}", name: "Buggy axle", component_type: "AXLE", criticality: "ESSENTIAL", ndt_interval_cycles: 30000, ndt_interval_days: 365 }
              as: ParkOpsAdmin
              captures: { comp2_id: "$.data.id" }
            - call: "POST /park-ops/shop-bays"
              payload: { name: "Bay 3", concurrent_slot_capacity: 1 }
              as: ParkOpsAdmin
              captures: { bay_id: "$.data.id", bay_v0: "$.data.version" }
            - call: "POST /park-ops/overhaul-work-orders"
              payload: { attraction_id: "${attr1_id}", component_id: "${comp1_id}", shop_bay_id: "${bay_id}", expected_shop_bay_version: "${bay_v0}", window_start_date: "2026-11-10", window_end_date: "2026-11-14", parts_subtotal_cents: 1000000, labor_hours: 20 }
              as: MaintenanceManager
              captures: { wo1_id: "$.data.id" }
            - call: "GET /park-ops/shop-bays/${bay_id}"
              payload: {}
              as: MaintenanceManager
              captures: { bay_v1: "$.data.version" }
          trigger:
            - call: "POST /park-ops/overhaul-work-orders"
              payload: { attraction_id: "${attr1_id}", component_id: "${comp2_id}", shop_bay_id: "${bay_id}", expected_shop_bay_version: "${bay_v1}", window_start_date: "2026-11-14", window_end_date: "2026-11-19", parts_subtotal_cents: 500000, labor_hours: 10 }
              as: MaintenanceManager
          assert:
            - "error_id == ERR_COMPONENT_ATTRACTION_MISMATCH with http_status 422"
            - "error_id is NOT ERR_BAY_CAPACITY_CONFLICT and NOT ERR_STALE_SHOP_BAY_VERSION"
            - "ShopBay.${bay_id}.booked_order_count == 1 and version == ${bay_v1}, both unchanged by the rejected call"
            - "OverhaulWorkOrder.${wo1_id} is the only work order for ${bay_id} and is still SCHEDULED"

  - rule_id: boundary_precision_check
    instances:
      - name: ndt_cycle_interval_and_grace_ceiling_are_inclusive_at_50000_and_60000
        grounds:
          - calculations.component_ndt_due_status
          - entities.ComponentAsset.fields.ndt_status
          - endpoints[POST /park-ops/attractions/{id}/cycles]
          - calculations.operational_posture_derivation
          - validations[priority=9]
        distinguishing_aspect: |
          Both comparisons are >= and the grace ceiling is ceil(50000 * 1.20) = 60000, so the status
          walks CURRENT at 49999 cycles-since, DUE at exactly 50000, still DUE at 59999 and OVERDUE at
          exactly 60000. Off-by-one implementations that use > instead of >=, or that truncate the
          grace product to 59999, disagree at precisely two of the four probes; the day interval is
          set to 3650 so it can never be the trigger.
        test_recipe:
          setup:
            - "logical clock left at its default 2026-08-01T00:00:00Z"
            - "one attraction at cumulative_cycles 0"
            - "one SAFETY_CRITICAL component with ndt_interval_cycles 50000 and ndt_interval_days 3650, baselined at 0 cycles on creation"
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Steel Vortex", park_area: "SKYLINE", manufacturer: "B&M", model_code: "IV-2", ride_class: "THRILL", theoretical_hourly_capacity: 1200, min_operators_required: 3, parts_budget_cents: 8000000 }
              as: ParkOpsAdmin
              captures: { attr_id: "$.data.id" }
            - call: "POST /park-ops/components"
              payload: { attraction_id: "${attr_id}", name: "Wheel bogie axle", component_type: "AXLE", criticality: "SAFETY_CRITICAL", ndt_interval_cycles: 50000, ndt_interval_days: 3650 }
              as: ParkOpsAdmin
              captures: { comp_id: "$.data.id" }
          trigger:
            - call: "POST /park-ops/attractions/${attr_id}/cycles"
              payload: { service_date: "2026-08-01", cycles_added: 49999 }
              as: MaintenanceTechnician
            - call: "POST /park-ops/attractions/${attr_id}/cycles"
              payload: { service_date: "2026-08-01", cycles_added: 1 }
              as: MaintenanceTechnician
            - call: "POST /park-ops/attractions/${attr_id}/cycles"
              payload: { service_date: "2026-08-01", cycles_added: 9999 }
              as: MaintenanceTechnician
            - call: "POST /park-ops/attractions/${attr_id}/cycles"
              payload: { service_date: "2026-08-01", cycles_added: 1 }
              as: MaintenanceTechnician
          assert:
            - "ComponentAsset.${comp_id}.last_ndt_cycles == 0 and last_ndt_at == 2026-08-01T00:00:00.000Z at creation, with ndt_status CURRENT"
            - "after cycles_added 49999: Attraction.${attr_id}.cumulative_cycles == 49999 and ComponentAsset.${comp_id}.ndt_status == CURRENT"
            - "after the next cycles_added 1: cumulative_cycles == 50000 and ndt_status == DUE"
            - "after cycles_added 9999: cumulative_cycles == 59999 and ndt_status is still DUE"
            - "after the final cycles_added 1: cumulative_cycles == 60000 and ndt_status == OVERDUE"
            - "Attraction.${attr_id}.operational_posture == DOWN once the SAFETY_CRITICAL component is OVERDUE"
      - name: parts_budget_ceiling_permits_exact_equality_and_refuses_one_extra_cent
        grounds:
          - validations[priority=26]
          - calculations.parts_budget_committed_ledger
          - entities.Attraction.fields.parts_budget_committed_cents
          - endpoints[POST /park-ops/part-requisitions/{id}/reserve]
          - endpoints[POST /park-ops/part-requisitions/{id}/backorder]
        distinguishing_aspect: |
          The ceiling is <= with equality explicitly permitted, so the second reserve must succeed at
          committed == parts_budget_cents == 1000000 exactly, and a one-cent requisition immediately
          afterwards must fail with the 402. Both the reserve leg and the backorder leg share the
          ceiling, so the same one-cent row is refused twice and the ledger never moves.
        test_recipe:
          setup:
            - "one attraction with parts_budget_cents 1000000 and parts_budget_committed_cents 0"
            - "requisition A worth 750000 cents (3 x 250000) and requisition B worth 250000 cents (1 x 250000)"
            - "requisition C worth exactly 1 cent (1 x 1)"
            - "A reserved first, so the committed total stands at 750000 before the boundary probes"
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Harbor Hopper", park_area: "LAGOON", manufacturer: "Zierer", model_code: "HH-6", ride_class: "FAMILY", theoretical_hourly_capacity: 520, min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              captures: { attr_id: "$.data.id" }
            - call: "POST /park-ops/part-requisitions"
              payload: { attraction_id: "${attr_id}", part_number: "P-750", quantity: 3, unit_cost_cents: 250000, needed_by_date: "2026-08-20" }
              as: MaintenanceTechnician
              captures: { req_a: "$.data.id" }
            - call: "POST /park-ops/part-requisitions"
              payload: { attraction_id: "${attr_id}", part_number: "P-250", quantity: 1, unit_cost_cents: 250000, needed_by_date: "2026-08-20" }
              as: MaintenanceTechnician
              captures: { req_b: "$.data.id" }
            - call: "POST /park-ops/part-requisitions"
              payload: { attraction_id: "${attr_id}", part_number: "P-001", quantity: 1, unit_cost_cents: 1, needed_by_date: "2026-08-20" }
              as: MaintenanceTechnician
              captures: { req_c: "$.data.id" }
            - call: "POST /park-ops/part-requisitions/${req_a}/reserve"
              payload: {}
              as: MaintenanceManager
          trigger:
            - call: "POST /park-ops/part-requisitions/${req_b}/reserve"
              payload: {}
              as: MaintenanceManager
            - call: "POST /park-ops/part-requisitions/${req_c}/reserve"
              payload: {}
              as: MaintenanceManager
            - call: "POST /park-ops/part-requisitions/${req_c}/backorder"
              payload: { expected_availability_date: "2026-09-01" }
              as: MaintenanceManager
          assert:
            - "PartRequisition.${req_a}.total_cost_cents == 750000 and Attraction.${attr_id}.parts_budget_committed_cents == 750000 after the setup reserve"
            - "the ${req_b} reserve returns 200 with status RESERVED and Attraction.${attr_id}.parts_budget_committed_cents == 1000000, exactly equal to parts_budget_cents"
            - "the ${req_c} reserve returns ERR_PARTS_BUDGET_EXCEEDED with http_status 402"
            - "the ${req_c} backorder returns ERR_PARTS_BUDGET_EXCEEDED with http_status 402"
            - "PartRequisition.${req_c}.status is still REQUESTED and Attraction.${attr_id}.parts_budget_committed_cents is still 1000000"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: signoff_gated_by_incident_hold_on_the_attraction_until_the_incident_clears
        grounds:
          - validations[priority=10]
          - entities.Attraction.fields.regulatory_hold
          - state_machines.IncidentReport.INTERNAL_REVIEW_CLOSED_to_CLEARED_TO_OPERATE
          - endpoints[POST /park-ops/daily-inspections/{id}/sign-off]
          - calculations.operational_posture_derivation
        distinguishing_aspect: |
          The inspection itself is flawless - PENDING_SIGN_OFF, nothing pending, nothing blocking, no
          components to go overdue, a different signer - yet sign-off is refused because a sibling
          entity two hops away (IncidentReport -> Attraction.regulatory_hold) is in a holding state.
          The identical request succeeds unchanged once the incident reaches CLEARED_TO_OPERATE, so
          the gate is purely the other entity's state and the posture walks HOLD -> OPEN.
        test_recipe:
          setup:
            - "one attraction with no components and an ACTIVE single-line ESSENTIAL template"
            - "the 2026-08-01 inspection recorded PASS by tech-5 and submitted, so it sits in PENDING_SIGN_OFF"
            - "one MINOR incident escalated with hold-ride, so Attraction.regulatory_hold is true and posture is HOLD"
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Sunset Wheel", park_area: "LAGOON", manufacturer: "Chance", model_code: "GW-90", ride_class: "FAMILY", theoretical_hourly_capacity: 480, min_operators_required: 2, parts_budget_cents: 900000 }
              as: ParkOpsAdmin
              captures: { attr_id: "$.data.id" }
            - call: "POST /park-ops/inspection-templates"
              payload: { attraction_id: "${attr_id}", effective_from_date: "2026-07-01" }
              as: ParkOpsAdmin
              captures: { tpl_id: "$.data.id" }
            - call: "POST /park-ops/inspection-templates/${tpl_id}/items"
              payload: { sequence_no: 1, description: "Gondola door latch function", severity_class: "ESSENTIAL" }
              as: ParkOpsAdmin
            - call: "GET /park-ops/attractions/${attr_id}"
              payload: {}
              as: ParkOpsAdmin
              captures: { attr_v: "$.data.version" }
            - call: "POST /park-ops/inspection-templates/${tpl_id}/activate"
              payload: { expected_attraction_version: "${attr_v}" }
              as: ParkOpsAdmin
            - call: "POST /park-ops/daily-inspections"
              payload: { attraction_id: "${attr_id}", service_date: "2026-08-01" }
              as: MaintenanceTechnician
              as_user_id: "tech-5"
              captures: { insp_id: "$.data.id" }
            - call: "GET /park-ops/inspection-item-results"
              payload: { inspection_id: "${insp_id}" }
              as: MaintenanceTechnician
              as_user_id: "tech-5"
              captures: { res1_id: "$.data[0].id" }
            - call: "POST /park-ops/inspection-item-results/${res1_id}/record"
              payload: { outcome: "PASS" }
              as: MaintenanceTechnician
              as_user_id: "tech-5"
            - call: "POST /park-ops/daily-inspections/${insp_id}/submit"
              payload: {}
              as: MaintenanceTechnician
              as_user_id: "tech-5"
            - call: "POST /park-ops/incidents"
              payload: { attraction_id: "${attr_id}", occurred_at: "2026-08-01T08:00:00.000Z", injury_severity: "MINOR", guest_count_affected: 1, narrative: "Guest reported pinched finger at gondola door" }
              as: SafetyOfficer
              captures: { inc_id: "$.data.id" }
            - call: "POST /park-ops/incidents/${inc_id}/hold-ride"
              payload: {}
              as: SafetyOfficer
          trigger:
            - call: "POST /park-ops/daily-inspections/${insp_id}/sign-off"
              payload: {}
              as: QualifiedInspector
              as_user_id: "insp-8"
            - call: "POST /park-ops/incidents/${inc_id}/investigate"
              payload: {}
              as: SafetyOfficer
            - call: "POST /park-ops/incidents/${inc_id}/close-internal"
              payload: {}
              as: SafetyOfficer
            - call: "POST /park-ops/incidents/${inc_id}/clear"
              payload: {}
              as: SafetyOfficer
            - call: "POST /park-ops/daily-inspections/${insp_id}/sign-off"
              payload: {}
              as: QualifiedInspector
              as_user_id: "insp-8"
          assert:
            - "the first sign-off returns ERR_REGULATORY_HOLD_ACTIVE with http_status 409"
            - "DailyInspection.${insp_id}.status is still PENDING_SIGN_OFF with signed_off_by_user_id == null"
            - "Attraction.${attr_id}.operational_posture == HOLD while the incident is held"
            - "after the clear: IncidentReport.${inc_id}.status == CLEARED_TO_OPERATE and Attraction.${attr_id}.regulatory_hold == false"
            - "the second sign-off returns 200 with DailyInspection.${insp_id}.status == SIGNED_OFF and signed_off_by_user_id == insp-8"
            - "Attraction.${attr_id}.last_signed_off_service_date == 2026-08-01 and operational_posture == OPEN"
      - name: bulletin_action_verify_gated_by_linked_requisition_then_bubbles_bulletin_to_completed
        grounds:
          - validations[priority=14]
          - entities.BulletinAction.fields.required_part_received
          - state_machines.PartRequisition.RESERVED_to_RECEIVED
          - state_machines.MaintenanceBulletin.ACKNOWLEDGED_to_COMPLETED
          - endpoints[POST /park-ops/bulletin-actions/{id}/verify]
        distinguishing_aspect: |
          Verification depends on a grandchild entity: the action is legitimately IN_WORK but its
          linked PartRequisition is only RESERVED, so required_part_received is false and the verify
          is refused. Receiving the part flips the derived flag on the action without any call to the
          action itself, and the retried verify then bubbles the parent bulletin ACKNOWLEDGED ->
          COMPLETED because action_verified_count has caught action_total_count at 1.
        test_recipe:
          setup:
            - "one attraction whose manufacturer and model_code match exactly one bulletin, so the fan-out produces a single action"
            - "an ADVISORY bulletin acknowledged, giving one PENDING action, then started to IN_WORK"
            - "one PartRequisition worth 50000 cents linked to that action and reserved but not received"
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Prospector Mine Train", park_area: "FRONTIER", manufacturer: "Arrow", model_code: "MT-77", ride_class: "FAMILY", theoretical_hourly_capacity: 760, min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              captures: { attr_id: "$.data.id" }
            - call: "POST /park-ops/bulletins"
              payload: { bulletin_ref: "SB-2026-204", manufacturer: "Arrow", model_code: "MT-77", severity: "ADVISORY", issued_date: "2026-07-20", compliance_deadline_date: "2026-09-30" }
              as: ParkOpsAdmin
              captures: { b_id: "$.data.id" }
            - call: "POST /park-ops/bulletins/${b_id}/acknowledge"
              payload: {}
              as: MaintenanceManager
            - call: "GET /park-ops/bulletin-actions"
              payload: { bulletin_id: "${b_id}" }
              as: MaintenanceManager
              captures: { act_id: "$.data[0].id" }
            - call: "POST /park-ops/part-requisitions"
              payload: { attraction_id: "${attr_id}", part_number: "KIT-204", quantity: 1, unit_cost_cents: 50000, needed_by_date: "2026-09-15", bulletin_action_id: "${act_id}" }
              as: MaintenanceTechnician
              captures: { req_id: "$.data.id" }
            - call: "POST /park-ops/part-requisitions/${req_id}/reserve"
              payload: {}
              as: MaintenanceManager
            - call: "POST /park-ops/bulletin-actions/${act_id}/start"
              payload: {}
              as: MaintenanceTechnician
          trigger:
            - call: "POST /park-ops/bulletin-actions/${act_id}/verify"
              payload: {}
              as: QualifiedInspector
              as_user_id: "insp-2"
            - call: "POST /park-ops/part-requisitions/${req_id}/receive"
              payload: {}
              as: MaintenanceTechnician
            - call: "POST /park-ops/bulletin-actions/${act_id}/verify"
              payload: {}
              as: QualifiedInspector
              as_user_id: "insp-2"
          assert:
            - "MaintenanceBulletin.${b_id}.action_total_count == 1 and action_verified_count == 0 after acknowledge"
            - "BulletinAction.${act_id}.required_part_received == false while ${req_id} is RESERVED"
            - "the first verify returns ERR_PART_NOT_RECEIVED with http_status 409 and BulletinAction.${act_id}.status is still IN_WORK"
            - "after the receive: PartRequisition.${req_id}.status == RECEIVED and BulletinAction.${act_id}.required_part_received == true"
            - "Attraction.${attr_id}.parts_budget_committed_cents == 50000 both before and after the receive, because RECEIVED stays inside the committed set"
            - "the second verify returns 200 with BulletinAction.${act_id}.status == VERIFIED and verified_by_user_id == insp-2"
            - "MaintenanceBulletin.${b_id}.action_verified_count == 1 and status == COMPLETED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: shop_bay_closed_windows_collide_through_the_one_day_changeover_buffer
        grounds:
          - validations[priority=24]
          - entities.OverhaulWorkOrder.fields.window_start_date
          - entities.ShopBay.fields.concurrent_slot_capacity
          - entities.ShopBay.fields.booked_order_count
          - endpoints[POST /park-ops/overhaul-work-orders]
        distinguishing_aspect: |
          Bay windows are inclusive on both ends and the requested window is expanded by one
          changeover day on each side before the per-day count runs, so a request starting the day
          AFTER an existing order ends still collides: 2026-11-15..2026-11-18 expands to
          2026-11-14..2026-11-19 and 2026-11-14 is the incumbent's last day. Sliding the request one
          day later to 2026-11-16..2026-11-19 clears the buffer and is accepted, and the incumbent's
          own window is NOT buffered - only the requested one is.
        test_recipe:
          setup:
            - "one attraction with one SAFETY_CRITICAL gearbox"
            - "one shop bay with concurrent_slot_capacity 1"
            - "an incumbent SCHEDULED work order occupying 2026-11-10 to 2026-11-14"
            - "the bay version re-read after the incumbent booking so both probes carry a fresh OCC token"
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Ironwood Express", park_area: "FRONTIER", manufacturer: "Vekoma", model_code: "IE-15", ride_class: "FAMILY", theoretical_hourly_capacity: 700, min_operators_required: 2, parts_budget_cents: 3000000 }
              as: ParkOpsAdmin
              captures: { attr_id: "$.data.id" }
            - call: "POST /park-ops/components"
              payload: { attraction_id: "${attr_id}", name: "Transfer table gearbox", component_type: "GEARBOX", criticality: "SAFETY_CRITICAL", ndt_interval_cycles: 70000, ndt_interval_days: 365 }
              as: ParkOpsAdmin
              captures: { comp_id: "$.data.id" }
            - call: "POST /park-ops/shop-bays"
              payload: { name: "Bay 5", concurrent_slot_capacity: 1 }
              as: ParkOpsAdmin
              captures: { bay_id: "$.data.id", bay_v0: "$.data.version" }
            - call: "POST /park-ops/overhaul-work-orders"
              payload: { attraction_id: "${attr_id}", component_id: "${comp_id}", shop_bay_id: "${bay_id}", expected_shop_bay_version: "${bay_v0}", window_start_date: "2026-11-10", window_end_date: "2026-11-14", parts_subtotal_cents: 200000, labor_hours: 8 }
              as: MaintenanceManager
              captures: { wo_incumbent: "$.data.id" }
            - call: "GET /park-ops/shop-bays/${bay_id}"
              payload: {}
              as: MaintenanceManager
              captures: { bay_v1: "$.data.version" }
          trigger:
            - call: "POST /park-ops/overhaul-work-orders"
              payload: { attraction_id: "${attr_id}", component_id: "${comp_id}", shop_bay_id: "${bay_id}", expected_shop_bay_version: "${bay_v1}", window_start_date: "2026-11-15", window_end_date: "2026-11-18", parts_subtotal_cents: 300000, labor_hours: 9 }
              as: MaintenanceManager
            - call: "POST /park-ops/overhaul-work-orders"
              payload: { attraction_id: "${attr_id}", component_id: "${comp_id}", shop_bay_id: "${bay_id}", expected_shop_bay_version: "${bay_v1}", window_start_date: "2026-11-16", window_end_date: "2026-11-19", parts_subtotal_cents: 300000, labor_hours: 9 }
              as: MaintenanceManager
              captures: { wo_accepted: "$.data.id" }
          assert:
            - "the 2026-11-15 request returns ERR_BAY_CAPACITY_CONFLICT with http_status 409"
            - "ShopBay.${bay_id}.booked_order_count == 1 and version == ${bay_v1} immediately after the refusal"
            - "the 2026-11-16 request returns 201 with OverhaulWorkOrder.${wo_accepted}.status == SCHEDULED and off_season == true"
            - "ShopBay.${bay_id}.booked_order_count == 2 after the accepted booking"
            - "OverhaulWorkOrder.${wo_incumbent}.window_end_date == 2026-11-14 and it is untouched by both probes"
      - name: certification_half_open_intervals_accept_exact_adjacency_and_split_on_one_second
        grounds:
          - validations[priority=25]
          - entities.OperatorCertification.fields.effective_from
          - entities.OperatorCertification.fields.expires_at
          - calculations.certification_status_derivation
          - endpoints[POST /park-ops/operator-certifications]
        distinguishing_aspect: |
          Certification windows are half-open on the resource key (attraction_id, operator_user_id),
          so a new row starting exactly at the incumbent's expires_at is accepted while a row starting
          one second earlier is refused - a closed-interval implementation rejects both and an
          off-by-one implementation accepts both. The same operator on a DIFFERENT attraction may hold
          a byte-identical interval, because the key is the pair and not the operator alone.
        test_recipe:
          setup:
            - "logical clock left at its default 2026-08-01T00:00:00Z"
            - "two attractions"
            - "one incumbent certification for op-20 on attraction 1 covering [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) with passing scores, so it derives CERTIFIED"
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Cliffside Chairlift", park_area: "SKYLINE", manufacturer: "Doppelmayr", model_code: "CL-2", ride_class: "FAMILY", theoretical_hourly_capacity: 900, min_operators_required: 2, parts_budget_cents: 1100000 }
              as: ParkOpsAdmin
              captures: { attr1_id: "$.data.id" }
            - call: "POST /park-ops/attractions"
              payload: { name: "Meadow Monorail", park_area: "KIDS_COVE", manufacturer: "Doppelmayr", model_code: "MM-3", ride_class: "KIDDIE", theoretical_hourly_capacity: 400, min_operators_required: 1, parts_budget_cents: 700000 }
              as: ParkOpsAdmin
              captures: { attr2_id: "$.data.id" }
            - call: "POST /park-ops/operator-certifications"
              payload: { attraction_id: "${attr1_id}", operator_user_id: "op-20", effective_from: "2026-08-01T00:00:00.000Z", expires_at: "2026-09-01T00:00:00.000Z", restraint_verification_score: 91, dispatch_procedure_score: 86 }
              as: MaintenanceManager
              captures: { cert_incumbent: "$.data.id" }
          trigger:
            - call: "POST /park-ops/operator-certifications"
              payload: { attraction_id: "${attr1_id}", operator_user_id: "op-20", effective_from: "2026-09-01T00:00:00.000Z", expires_at: "2026-10-01T00:00:00.000Z", restraint_verification_score: 93, dispatch_procedure_score: 88 }
              as: MaintenanceManager
              captures: { cert_adjacent: "$.data.id" }
            - call: "POST /park-ops/operator-certifications"
              payload: { attraction_id: "${attr1_id}", operator_user_id: "op-20", effective_from: "2026-08-31T23:59:59.000Z", expires_at: "2026-09-30T00:00:00.000Z", restraint_verification_score: 93, dispatch_procedure_score: 88 }
              as: MaintenanceManager
            - call: "POST /park-ops/operator-certifications"
              payload: { attraction_id: "${attr2_id}", operator_user_id: "op-20", effective_from: "2026-08-01T00:00:00.000Z", expires_at: "2026-09-01T00:00:00.000Z", restraint_verification_score: 91, dispatch_procedure_score: 86 }
              as: MaintenanceManager
              captures: { cert_other_ride: "$.data.id" }
          assert:
            - "OperatorCertification.${cert_incumbent}.status == CERTIFIED, since the clock sits on the inclusive lower bound"
            - "the exact-adjacency request returns 201 and OperatorCertification.${cert_adjacent}.status == TRAINEE, because effective_from is still in the future"
            - "the 2026-08-31T23:59:59Z request returns ERR_CERTIFICATION_WINDOW_OVERLAP with http_status 409"
            - "the second-attraction request returns 201 with OperatorCertification.${cert_other_ride}.status == CERTIFIED"
            - "Attraction.${attr1_id}.certified_operator_count == 1 and Attraction.${attr2_id}.certified_operator_count == 1"
            - "exactly three OperatorCertification rows exist for operator op-20 across both attractions"

  - rule_id: compensating_invariant
    instances:
      - name: void_restores_ytd_downtime_minutes_exactly_and_drops_the_event_from_both_variants
        grounds:
          - calculations.downtime_minutes_ledger
          - calculations.downtime_capacity_loss
          - state_machines.DowntimeEvent.CLOSED_to_VOIDED
          - entities.Attraction.fields.ytd_downtime_minutes
          - endpoints[POST /park-ops/downtime-events/{id}/void]
        distinguishing_aspect: |
          The ledger is a conserved quantity: two closes drive ytd_downtime_minutes 0 -> 105 -> 135,
          and voiding the first event must return it to exactly 30 - the second event's contribution
          alone - not to 0 and not to 135. The same void also removes the event from the capacity
          window, so event_count falls to 1 and the SETTLED figure drops from 1800.00 to 500.00 while
          the voided row keeps its own settled_guest_slots_lost 1300.00 for audit.
        test_recipe:
          setup:
            - "logical clock set to 2026-08-01T20:00:00Z"
            - "one attraction with theoretical_hourly_capacity 1000 and ytd_downtime_minutes 0"
            - "event 1: 10:00Z-11:45Z, 105 minutes, 45 of them peak, closed"
            - "event 2: 13:00Z-13:30Z, 30 minutes, all peak, closed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T20:00:00.000Z" }
              as: ParkOpsAdmin
            - call: "POST /park-ops/attractions"
              payload: { name: "Pinewood Plunge", park_area: "LAGOON", manufacturer: "Hafema", model_code: "PP-5", ride_class: "WATER", theoretical_hourly_capacity: 1000, min_operators_required: 2, parts_budget_cents: 1400000 }
              as: ParkOpsAdmin
              captures: { attr_id: "$.data.id" }
            - call: "POST /park-ops/downtime-events"
              payload: { attraction_id: "${attr_id}", started_at: "2026-08-01T10:00:00.000Z", cause_category: "WEATHER" }
              as: MaintenanceTechnician
              captures: { e1_id: "$.data.id" }
            - call: "POST /park-ops/downtime-events/${e1_id}/diagnose"
              payload: { root_cause_code: "WX-002" }
              as: MaintenanceTechnician
            - call: "POST /park-ops/downtime-events/${e1_id}/resolve"
              payload: { ended_at: "2026-08-01T11:45:00.000Z" }
              as: MaintenanceTechnician
            - call: "POST /park-ops/downtime-events/${e1_id}/close"
              payload: {}
              as: MaintenanceManager
            - call: "POST /park-ops/downtime-events"
              payload: { attraction_id: "${attr_id}", started_at: "2026-08-01T13:00:00.000Z", cause_category: "GUEST_ILLNESS" }
              as: MaintenanceTechnician
              captures: { e2_id: "$.data.id" }
            - call: "POST /park-ops/downtime-events/${e2_id}/diagnose"
              payload: { root_cause_code: "GI-011" }
              as: MaintenanceTechnician
            - call: "POST /park-ops/downtime-events/${e2_id}/resolve"
              payload: { ended_at: "2026-08-01T13:30:00.000Z" }
              as: MaintenanceTechnician
            - call: "POST /park-ops/downtime-events/${e2_id}/close"
              payload: {}
              as: MaintenanceManager
          trigger:
            - call: "POST /park-ops/downtime-events/${e1_id}/void"
              payload: { void_reason: "Logged against the wrong attraction by the duty manager" }
              as: MaintenanceManager
            - call: "GET /park-ops/attractions/${attr_id}/capacity-impact"
              payload: {}
              as: MaintenanceManager
          assert:
            - "before the void: DowntimeEvent.${e1_id}.duration_minutes == 105 with peak_minutes 45 and settled_guest_slots_lost == 1300.00"
            - "before the void: DowntimeEvent.${e2_id}.duration_minutes == 30 with peak_minutes 30 and settled_guest_slots_lost == 500.00"
            - "before the void: Attraction.${attr_id}.ytd_downtime_minutes == 135"
            - "the void returns 200 with DowntimeEvent.${e1_id}.status == VOIDED and void_reason stored"
            - "after the void: Attraction.${attr_id}.ytd_downtime_minutes == 30, exactly the pre-close value for ${e1_id} restored"
            - "DowntimeEvent.${e1_id}.duration_minutes is still 105 and settled_guest_slots_lost is still 1300.00, so the void compensates the ledger without rewriting history"
            - "the capacity-impact read returns event_count == 1, settled_guest_slots_lost == 500.00, provisional_guest_slots_lost == 425.00 and divergence_guest_slots == 75.00"
      - name: requisition_cancel_releases_exactly_what_it_committed_and_requested_cancel_is_a_no_op
        grounds:
          - calculations.parts_budget_committed_ledger
          - state_machines.PartRequisition.RESERVED_to_CANCELLED
          - state_machines.PartRequisition.REQUESTED_to_CANCELLED
          - entities.Attraction.fields.parts_budget_committed_cents
          - endpoints[POST /park-ops/part-requisitions/{id}/cancel]
        distinguishing_aspect: |
          Three cancels behave three different ways against one conserved counter: cancelling the
          RESERVED 500000 row releases exactly 500000 (800000 -> 300000), cancelling the never
          committed REQUESTED row releases nothing (300000 -> 300000), and receiving the BACKORDERED
          row leaves it committed. The proof that the release was exact rather than approximate is the
          final 700000 reserve, which is admissible only if committed stands at precisely 300000.
        test_recipe:
          setup:
            - "one attraction with parts_budget_cents 1000000"
            - "requisition A 500000 cents reserved, requisition B 300000 cents backordered, requisition C 100000 cents left REQUESTED"
            - "requisition D 700000 cents created and left REQUESTED as the exactness probe"
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Copper Canyon Rapids", park_area: "FRONTIER", manufacturer: "Intamin", model_code: "CC-8", ride_class: "WATER", theoretical_hourly_capacity: 1100, min_operators_required: 3, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              captures: { attr_id: "$.data.id" }
            - call: "POST /park-ops/part-requisitions"
              payload: { attraction_id: "${attr_id}", part_number: "PR-A", quantity: 2, unit_cost_cents: 250000, needed_by_date: "2026-08-25" }
              as: MaintenanceTechnician
              captures: { req_a: "$.data.id" }
            - call: "POST /park-ops/part-requisitions"
              payload: { attraction_id: "${attr_id}", part_number: "PR-B", quantity: 3, unit_cost_cents: 100000, needed_by_date: "2026-08-26" }
              as: MaintenanceTechnician
              captures: { req_b: "$.data.id" }
            - call: "POST /park-ops/part-requisitions"
              payload: { attraction_id: "${attr_id}", part_number: "PR-C", quantity: 1, unit_cost_cents: 100000, needed_by_date: "2026-08-27" }
              as: MaintenanceTechnician
              captures: { req_c: "$.data.id" }
            - call: "POST /park-ops/part-requisitions"
              payload: { attraction_id: "${attr_id}", part_number: "PR-D", quantity: 7, unit_cost_cents: 100000, needed_by_date: "2026-08-28" }
              as: MaintenanceTechnician
              captures: { req_d: "$.data.id" }
            - call: "POST /park-ops/part-requisitions/${req_a}/reserve"
              payload: {}
              as: MaintenanceManager
            - call: "POST /park-ops/part-requisitions/${req_b}/backorder"
              payload: { expected_availability_date: "2026-09-05" }
              as: MaintenanceManager
          trigger:
            - call: "POST /park-ops/part-requisitions/${req_a}/cancel"
              payload: { cancel_reason: "Superseded by the rebuild kit" }
              as: MaintenanceManager
            - call: "POST /park-ops/part-requisitions/${req_c}/cancel"
              payload: { cancel_reason: "Ordered in error" }
              as: MaintenanceManager
            - call: "POST /park-ops/part-requisitions/${req_b}/receive"
              payload: {}
              as: MaintenanceTechnician
            - call: "POST /park-ops/part-requisitions/${req_d}/reserve"
              payload: {}
              as: MaintenanceManager
          assert:
            - "after the setup reserve and backorder: Attraction.${attr_id}.parts_budget_committed_cents == 800000"
            - "after cancelling ${req_a}: status == CANCELLED and parts_budget_committed_cents == 300000, exactly 500000 released"
            - "after cancelling ${req_c}: status == CANCELLED and parts_budget_committed_cents is still 300000, because a REQUESTED row was never committed"
            - "after receiving ${req_b}: status == RECEIVED and parts_budget_committed_cents is still 300000"
            - "the ${req_d} reserve returns 200 with status RESERVED and parts_budget_committed_cents == 1000000, which is only reachable if the release was exact"
            - "PartRequisition.${req_a}.total_cost_cents == 500000 and ${req_d}.total_cost_cents == 700000 are unchanged by any cancel"
