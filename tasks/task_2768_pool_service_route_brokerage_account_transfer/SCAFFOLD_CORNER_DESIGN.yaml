      - name: denied_permit_transfer_can_be_reapplied_but_an_approved_one_cannot
        claim_type: conditional_action
        grounds:
          - "endpoints[POST /license-transfers/{id}/apply]"
          - "endpoints[POST /license-transfers/{id}/decide]"
          - "endpoints[POST /license-transfers/{id}/waive]"
          - "state_machines.LicenseTransfer[DENIED -> APPLIED]"
          - "errors.ERR_LICENSE_TRANSFER_NOT_PENDING"
          - "validations[priority=29]"
        distinguishing_aspect: "One endpoint trio guarded by three different source-state sets: apply accepts NOT_STARTED or DENIED, decide accepts only APPLIED, waive only NOT_STARTED -- so the retry edge exists exactly once (through DENIED), attempt_count counts it, and the processing window is recomputed from the new applied_on."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the NV profile requires BUSINESS_TAX only, with transfer_processing_days 10 and cooling_off_days 7."
            - "Seller Sun Valley Pools LLC, buyer Desert Blue Route Co (AZ, LICENSED, APPROVED)."
            - "NV listing LV-SOUTH is LISTED with one VERIFIED 20000-MRR account; a 180000 SELLER_NOTE deal has been accepted, so a single NOT_STARTED BUSINESS_TAX LicenseTransfer exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
            - call: "POST /state-license-profiles"
