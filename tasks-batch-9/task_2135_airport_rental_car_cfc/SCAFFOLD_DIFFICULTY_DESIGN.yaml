              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
              captures: { rem_final_id: $.data.id }
          assert:
            - "CfcRemittance.${rem_prov_id}.expected_amount_cents == 2000000"
            - "CfcRemittance.${rem_final_id}.expected_amount_cents == 2500000"
            - "CfcRemittance.${rem_final_id}.expected_amount_cents - CfcRemittance.${rem_prov_id}.expected_amount_cents == 500000"
            - "CfcRemittance.${rem_prov_id}.due_date == 2026-02-20"
            - "CfcRemittance.${rem_final_id}.due_date == 2026-02-20"
            - "CfcRemittance.${rem_final_id}.status == PENDING and CfcRemittance.${rem_final_id}.shortfall_cents == 2500000"

      - name: shuttle_cost_basis_transaction_days_vs_gross_revenue_split
