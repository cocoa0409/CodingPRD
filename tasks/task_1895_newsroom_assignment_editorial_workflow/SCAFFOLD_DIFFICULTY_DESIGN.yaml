# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Newsroom Assignment & Editorial Workflow
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: story_priority_desk_vs_analytics
        grounds:
          - calculations.story_priority_score
          - calculations.author_track_record
          - entities.Story.fields.priority_score
        distinguishing_aspect: |
          Story-domain dual variant: with identical story data, DESK_FORWARD
          (forward-looking desk inputs only) returns 22.00 while ANALYTICS_BLEND
          (0.6 x desk_base + 0.4 x author track record) returns 13.20 because the
          author has zero settled analytics; the second instance of this rule sits
          on a different entity domain (AnalyticsReport).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; a desk editor and a FEATURES reporter exist"
            - "A STANDARD FEATURES pitch with deadline_at 2026-08-04T00:00:00Z (exactly 72h out, time_pressure = 0) is greenlit into a PRINT story"
            - "The author has no PUBLISHED stories, so author_track_record = 0"
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk One", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep One", role_capability: REPORTER, home_desk: FEATURES, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NewsDirector }
            - { call: "POST /newsroom/pitches", payload: { title: "Garden gala", summary: "Annual botanical society gala", desk: FEATURES, deadline_at: "2026-08-04T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { story_id: "$.data.greenlit_story_id" } }
          trigger:
            - { call: "GET /newsroom/stories/${story_id}", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { stored_pri: "$.data.priority_score" } }
            - { call: "GET /newsroom/stories/${story_id}/priority-score?variant=DESK", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { desk_score: "$.data.score" } }
            - { call: "GET /newsroom/stories/${story_id}/priority-score?variant=ANALYTICS", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { alt_score: "$.data.score" } }
          assert:
            - "stored_pri == 22.00  (10*2 + 2 + 0*30)"
            - "desk_score == 22.00"
            - "alt_score == 13.20  (round_half_up(0.6*22.00 + 0.4*0, 2))"
            - "desk_score != alt_score for identical story data"

      - name: analytics_performance_realtime_vs_settled
        grounds:
          - calculations.performance_score
          - entities.AnalyticsReport.fields.performance_score
        distinguishing_aspect: |
          AnalyticsReport-domain dual variant (different entity domain from
          story_priority_desk_vs_analytics): identical views/engagement inputs
          produce performance_score 390.00 as SETTLED but 351.00 as REALTIME
          because REALTIME applies the 0.9 dampening factor and re-rounds.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; full editorial staff exists (desk editor, reporter, copy editor, fact checker, legal reviewer, analyst)"
            - "A story driven DRAFT -> IN_EDIT -> FACT_CHECK -> LEGAL_REVIEW -> CLEARED -> SCHEDULED into a PRINT slot [2026-08-01T06:00, 07:00) and published by the scheduler at 2026-08-01T06:30:00Z"
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk Two", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep Two", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Copy Two", role_capability: COPY_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { copy_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Fact Two", role_capability: FACT_CHECKER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { fact_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Legal Two", role_capability: LEGAL_REVIEWER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { legal_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Ana Two", role_capability: ANALYST, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { ana_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NewsDirector }
            - { call: "POST /newsroom/pitches", payload: { title: "Council vote", summary: "Metro council budget vote", desk: METRO, deadline_at: "2026-08-02T00:00:00Z", urgency: URGENT }, as: Reporter, as_user_id: "${rep_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { story_id: "$.data.greenlit_story_id" } }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${story_id}", staff_id: "${rep_id}", assignment_role: REPORTER, start_at: "2026-08-01T01:00:00Z", end_at: "2026-08-01T03:00:00Z", planned_effort_minutes: 90 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { asg_id: "$.data.id" } }
            - { call: "POST /newsroom/assignments/${asg_id}/accept", payload: {}, as: Reporter, as_user_id: "${rep_id}" }
            - { call: "PATCH /newsroom/stories/${story_id}", payload: { word_count: 1200 }, as: Reporter, as_user_id: "${rep_id}", captures: { v2: "$.data.version" } }
            - { call: "POST /newsroom/stories/${story_id}/submit-edit", payload: {}, as: Reporter, as_user_id: "${rep_id}", captures: { v3: "$.data.version" } }
            - { call: "POST /newsroom/stories/${story_id}/complete-edit", payload: {}, as: CopyEditor, as_user_id: "${copy_id}", captures: { v4: "$.data.version" } }
            - { call: "POST /newsroom/stories/${story_id}/reviews", payload: { review_type: FACT_CHECK, verdict: PASS, expected_story_version: "${v4}" }, as: FactChecker, as_user_id: "${fact_id}" }
            - { call: "GET /newsroom/stories/${story_id}", payload: {}, as: NewsDirector, captures: { v5: "$.data.version" } }
            - { call: "POST /newsroom/stories/${story_id}/reviews", payload: { review_type: LEGAL, verdict: PASS, expected_story_version: "${v5}" }, as: LegalReviewer, as_user_id: "${legal_id}" }
            - { call: "GET /newsroom/stories/${story_id}", payload: {}, as: NewsDirector, captures: { v6: "$.data.version" } }
            - { call: "POST /newsroom/slots", payload: { channel: PRINT, window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T07:00:00Z", capacity: 2 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { slot_id: "$.data.id" } }
            - { call: "POST /newsroom/stories/${story_id}/schedule", payload: { slot_id: "${slot_id}", expected_story_version: "${v6}" }, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:30:00Z" }, as: NewsDirector }
            - { call: "POST /newsroom/ops/run-publication-scheduler", payload: {}, as: NewsDirector }
          trigger:
            - { call: "POST /newsroom/stories/${story_id}/analytics-reports", payload: { variant: SETTLED, window_start: "2026-08-01T07:00:00Z", window_end: "2026-08-02T07:00:00Z", views: 5000, engagement_minutes: 300 }, as: AnalyticsProducer, as_user_id: "${ana_id}", captures: { settled_score: "$.data.performance_score", settled_raw: "$.data.raw_score", settled_tier: "$.data.tier" } }
            - { call: "POST /newsroom/stories/${story_id}/analytics-reports", payload: { variant: REALTIME, window_start: "2026-08-01T07:00:00Z", window_end: "2026-08-02T08:00:00Z", views: 5000, engagement_minutes: 300 }, as: AnalyticsProducer, as_user_id: "${ana_id}", captures: { rt_score: "$.data.performance_score" } }
            - { call: "GET /newsroom/stories/${story_id}", payload: {}, as: NewsDirector, captures: { story_status: "$.data.status" } }
          assert:
            - "story_status == PUBLISHED (setup sanity)"
            - "settled_raw == 312.00  (round_half_up((5000*6 + 300*4)/100, 2))"
            - "settled_tier == A  (raw >= 100)"
            - "settled_score == 390.00  (312.00 x 1.25)"
            - "rt_score == 351.00  (round_half_up(312.00 x 1.25 x 0.9, 2))"
            - "rt_score != settled_score for identical inputs"

  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_multifactor_nonlinear
        grounds:
          - calculations.story_priority_score
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (urgency tier, desk weight, clamped time
          pressure) with non-linear min/max interaction — a pitch whose deadline
          already passed clamps time_pressure at 1 (54.00), while a BREAKING
          pitch 12h out lands mid-clamp at 108.00.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; desk editor + reporter exist"
            - "Pitch A: STANDARD BUSINESS deadline_at 2026-07-31T00:00:00Z (24h in the past -> raw pressure (72+24)/72 = 1.333 clamped to 1)"
            - "Pitch B: BREAKING SPORTS deadline_at 2026-08-01T12:00:00Z (+12h -> pressure (72-12)/72 x 30 = 25.00)"
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk Three", role_capability: DESK_EDITOR, home_desk: BUSINESS, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep Three", role_capability: REPORTER, home_desk: BUSINESS, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NewsDirector }
            - { call: "POST /newsroom/pitches", payload: { title: "Late budget wrap", summary: "Belated budget recap", desk: BUSINESS, deadline_at: "2026-07-31T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { pa_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "Stadium fire", summary: "Fire at the stadium", desk: SPORTS, deadline_at: "2026-08-01T12:00:00Z", urgency: BREAKING }, as: Reporter, as_user_id: "${rep_id}", captures: { pb_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${pa_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${pa_id}/greenlight", payload: { story_type: DIGITAL }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { sa_id: "$.data.greenlit_story_id" } }
            - { call: "POST /newsroom/pitches/${pb_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${pb_id}/greenlight", payload: { story_type: BROADCAST }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { sb_id: "$.data.greenlit_story_id" } }
          trigger:
            - { call: "GET /newsroom/stories/${sa_id}/priority-score?variant=DESK", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { score_a: "$.data.score" } }
            - { call: "GET /newsroom/stories/${sb_id}/priority-score?variant=DESK", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { score_b: "$.data.score" } }
          assert:
            - "score_a == 54.00  (10*2 + 4 + clamp(1.333,0,1)*30; clamp boundary active)"
            - "score_b == 108.00  (40*2 + 3 + (72-12)/72*30 = 80+3+25)"
            - "score_b > score_a but the gap is non-linear: pressure term saturates at 30 for any deadline in the past"

      - name: payroll_per_assignment_rounding
        grounds:
          - calculations.payroll_week_total
          - calculations.assignment_cost
        distinguishing_aspect: |
          Mode (b) nested rounding (different mode from
          priority_score_multifactor_nonlinear's mode (a)): the scaffold pins
          round-per-assignment-then-sum; at rate 6050c/h two 45-minute
          completions round to 4538 each and total 9076, whereas the forbidden
          sum-then-round order would yield 9075.
        test_recipe:
          setup:
            - "Reporter rate 6050c/h; two DRAFT stories each with one ACCEPTED assignment (planned 60 min)"
            - "Clock advanced to Monday 2026-08-03; both assignments completed with actual 45 min at 10:00 and 10:30 (same payroll week, chronological order)"
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk Four", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep Four", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6050, max_concurrent_assignments: 3 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NewsDirector }
            - { call: "POST /newsroom/pitches", payload: { title: "Story one", summary: "s1", desk: METRO, deadline_at: "2026-08-04T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p1_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "Story two", summary: "s2", desk: METRO, deadline_at: "2026-08-04T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p2_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p1_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p1_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { s1_id: "$.data.greenlit_story_id" } }
            - { call: "POST /newsroom/pitches/${p2_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p2_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { s2_id: "$.data.greenlit_story_id" } }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${s1_id}", staff_id: "${rep_id}", assignment_role: REPORTER, start_at: "2026-08-03T08:00:00Z", end_at: "2026-08-03T09:30:00Z", planned_effort_minutes: 60 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { a1_id: "$.data.id" } }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${s2_id}", staff_id: "${rep_id}", assignment_role: REPORTER, start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T11:30:00Z", planned_effort_minutes: 60 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { a2_id: "$.data.id" } }
            - { call: "POST /newsroom/assignments/${a1_id}/accept", payload: {}, as: Reporter, as_user_id: "${rep_id}" }
            - { call: "POST /newsroom/assignments/${a2_id}/accept", payload: {}, as: Reporter, as_user_id: "${rep_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: NewsDirector }
            - { call: "POST /newsroom/assignments/${a1_id}/complete", payload: { actual_effort_minutes: 45 }, as: Reporter, as_user_id: "${rep_id}", captures: { f1: "$.data.final_cost_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:30:00Z" }, as: NewsDirector }
            - { call: "POST /newsroom/assignments/${a2_id}/complete", payload: { actual_effort_minutes: 45 }, as: Reporter, as_user_id: "${rep_id}", captures: { f2: "$.data.final_cost_cents" } }
          trigger:
            - { call: "GET /newsroom/staff/${rep_id}/payroll?week_start=2026-08-03", payload: {}, as: NewsDirector, captures: { total: "$.data.total_cents", reg: "$.data.regular_minutes", ot: "$.data.overtime_minutes", cnt: "$.data.assignment_count" } }
          assert:
            - "f1 == 4538  (round_half_up(45 x 6050/60) = round_half_up(4537.5))"
            - "f2 == 4538  (running total 90 < 2400, no overtime)"
            - "total == 9076  (4538 + 4538; sum-then-round would give round_half_up(9075.0) = 9075)"
            - "reg == 90 and ot == 0 and cnt == 2"
  - rule_id: non_linear_state_machine
    instances:
      - name: pitch_rework_cycle
        grounds:
          - state_machines.Pitch.SUBMITTED_to_DESK_REVIEW
          - state_machines.Pitch.DESK_REVIEW_to_SUBMITTED
          - validations[priority=13]
        distinguishing_aspect: |
          Pitch is a cyclic machine (SUBMITTED -> DESK_REVIEW -> SUBMITTED loop)
          on entity Pitch: three returns succeed (rework_round 1, 2, 3) and the
          fourth return is rejected with ERR_PITCH_REWORK_LIMIT; the second
          non-linear instance lives on a different entity (Story).
        test_recipe:
          setup:
            - "Desk editor and reporter exist; one pitch freshly SUBMITTED (rework_round 0)"
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk Five", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep Five", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "Zoo expansion", summary: "Zoo expansion pitch", desk: METRO, deadline_at: "2026-08-04T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p_id: "$.data.id" } }
          trigger:
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/return", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { rr1: "$.data.rework_round" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/return", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { rr2: "$.data.rework_round" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/return", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { rr3: "$.data.rework_round" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/return", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { err: "$.data.error_id" } }
            - { call: "GET /newsroom/pitches/${p_id}", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { fin_status: "$.data.status", fin_rr: "$.data.rework_round" } }
          assert:
            - "rr1 == 1 and rr2 == 2 and rr3 == 3 (cycle traversed three times)"
            - "err == ERR_PITCH_REWORK_LIMIT (fourth return rejected at rework_round == 3)"
            - "fin_status == DESK_REVIEW and fin_rr == 3 (failed return changed nothing)"

      - name: story_factcheck_revision_loop
        grounds:
          - state_machines.Story.IN_EDIT_to_FACT_CHECK
          - state_machines.Story.FACT_CHECK_to_IN_EDIT
          - state_machines.Story.FACT_CHECK_to_LEGAL_REVIEW
          - entities.ReviewRecord.fields.review_round
          - entities.ReviewRecord.fields.is_current
        distinguishing_aspect: |
          Story is a cyclic machine on a different entity than Pitch: the
          IN_EDIT -> FACT_CHECK -> IN_EDIT revision loop runs twice (review_round
          1 and 2 flip to is_current=false) before a PASS in round 3 advances the
          same story to LEGAL_REVIEW — a cycle with per-round bookkeeping, not a
          linear pipeline.
        test_recipe:
          setup:
            - "Full desk staff; story driven to FACT_CHECK at version v4 with one ACCEPTED reporter assignment"
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk Six", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep Six", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Copy Six", role_capability: COPY_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { copy_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Fact Six", role_capability: FACT_CHECKER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { fact_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "Transit audit", summary: "Transit agency audit", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: URGENT }, as: Reporter, as_user_id: "${rep_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { story_id: "$.data.greenlit_story_id" } }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${story_id}", staff_id: "${rep_id}", assignment_role: REPORTER, start_at: "2026-08-01T08:00:00Z", end_at: "2026-08-01T10:00:00Z", planned_effort_minutes: 90 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { asg_id: "$.data.id" } }
            - { call: "POST /newsroom/assignments/${asg_id}/accept", payload: {}, as: Reporter, as_user_id: "${rep_id}" }
