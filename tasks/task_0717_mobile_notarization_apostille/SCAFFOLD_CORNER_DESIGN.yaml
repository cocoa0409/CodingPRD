scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_signing_request_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.SigningRequest
          - endpoints.POST_/notary/requests
        distinguishing_aspect: "POST /notary/requests with all required fields returns 201 with status=DRAFT, estimate_fee_cents=0, final_fee_cents=0, version=1, and a prefix-free UUID id."
        test_recipe:
          setup:
            - "Account and signer exist."
          setup_api_calls:
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme", default_state_code: "CA" }
              as: CoordinatorOps
              captures: { acct_id: $.data.id }
            - call: "POST /notary/signers"
              payload: { account_id: "${acct_id}", full_name: "Sam", email: "s@x.com", id_doc_type: "DRIVERS_LICENSE" }
              as: CoordinatorOps
              captures: { signer_id: $.data.id }
          trigger:
            - call: "POST /notary/requests"
              payload: { account_id: "${acct_id}", signer_id: "${signer_id}", state_code: "CA", doc_category: "GENERAL", delivery_mode: "MOBILE", expected_stamp_count: 2 }
              as: CoordinatorOps
              captures: { req_id: $.data.id, ver: $.data.version }
          assert:
            - "response.status == 201"
            - "SigningRequest.${req_id}.status == DRAFT"
            - "SigningRequest.${req_id}.estimate_fee_cents == 0"
            - "SigningRequest.${req_id}.final_fee_cents == 0"
            - "SigningRequest.${req_id}.version == 1"

      - name: get_request_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.SigningRequest
          - endpoints.GET_/notary/requests/{id}
        distinguishing_aspect: "GET /notary/requests/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /notary/requests/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: Viewer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_request_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - entities.SigningRequest.fields.doc_category
          - endpoints.POST_/notary/requests
        distinguishing_aspect: "POST /notary/requests omitting doc_category returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Account and signer exist."
          setup_api_calls:
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme", default_state_code: "CA" }
              as: CoordinatorOps
              captures: { acct_id: $.data.id }
            - call: "POST /notary/signers"
              payload: { account_id: "${acct_id}", full_name: "Sam", email: "s@x.com", id_doc_type: "DRIVERS_LICENSE" }
              as: CoordinatorOps
              captures: { signer_id: $.data.id }
          trigger:
            - call: "POST /notary/requests"
              payload: { account_id: "${acct_id}", signer_id: "${signer_id}", state_code: "CA", delivery_mode: "MOBILE", expected_stamp_count: 2 }
              as: CoordinatorOps
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: request_default_estimated_travel_miles_zero
        claim_type: Defaults
        grounds:
          - entities.SigningRequest.fields.estimated_travel_miles
        distinguishing_aspect: "Omitting estimated_travel_miles applies the default 0 on the created request."
        test_recipe:
          setup:
            - "Account and signer exist."
          setup_api_calls:
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme", default_state_code: "CA" }
              as: CoordinatorOps
              captures: { acct_id: $.data.id }
            - call: "POST /notary/signers"
              payload: { account_id: "${acct_id}", full_name: "Sam", email: "s@x.com", id_doc_type: "DRIVERS_LICENSE" }
              as: CoordinatorOps
              captures: { signer_id: $.data.id }
          trigger:
            - call: "POST /notary/requests"
              payload: { account_id: "${acct_id}", signer_id: "${signer_id}", state_code: "CA", doc_category: "GENERAL", delivery_mode: "MOBILE", expected_stamp_count: 2 }
              as: CoordinatorOps
              captures: { req_id: $.data.id }
          assert:
            - "SigningRequest.${req_id}.estimated_travel_miles == 0"

      - name: invalid_enum_id_doc_type_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Signer.fields.id_doc_type
          - endpoints.POST_/notary/signers
        distinguishing_aspect: "POST /notary/signers with id_doc_type=PHOTO (not in enum) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Account exists."
          setup_api_calls:
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme", default_state_code: "CA" }
              as: CoordinatorOps
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /notary/signers"
              payload: { account_id: "${acct_id}", full_name: "Sam", email: "s@x.com", id_doc_type: "PHOTO" }
              as: CoordinatorOps
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: journal_entry_immutable_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.JournalEntry
        distinguishing_aspect: "JournalEntry has common_fields:false (no version); only POST (append) and void exist, never an edit/PUT — append-only contract."
        test_recipe:
          setup:
            - "A COMPLETED journal entry exists (full happy-path run)."
          setup_api_calls:
            - call: "POST /notary/fee-schedules"
              payload: { state_code: "CA", per_stamp_cents: 1500, travel_base_cents: 4000, travel_per_mile_cents: 100, ron_surcharge_cents: 2500, state_cap_cents: 20000 }
              as: CoordinatorOps
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme", default_state_code: "CA" }
              as: CoordinatorOps
              captures: { acct_id: $.data.id }
            - call: "POST /notary/notaries"
              payload: { account_id: "${acct_id}", full_name: "Nora", commission_state: "CA", commission_expires_at: "2027-01-01T00:00:00Z", ron_authorized: true, nsa_certified: true }
              as: CoordinatorOps
              captures: { not_id: $.data.id }
            - call: "POST /notary/signers"
              payload: { account_id: "${acct_id}", full_name: "Sam", email: "s@x.com", id_doc_type: "DRIVERS_LICENSE" }
              as: CoordinatorOps
              captures: { signer_id: $.data.id }
            - call: "POST /notary/requests"
              payload: { account_id: "${acct_id}", signer_id: "${signer_id}", state_code: "CA", doc_category: "GENERAL", delivery_mode: "RON", expected_stamp_count: 1 }
              as: CoordinatorOps
              captures: { req_id: $.data.id }
            - call: "POST /notary/documents"
              payload: { request_id: "${req_id}", title: "A", doc_type: "AFFIDAVIT", signing_fee_cents: 1000 }
              as: CoordinatorOps
              captures: { doc_id: $.data.id }
            - call: "POST /notary/requests/${req_id}/quote"
              payload: {}
              as: CoordinatorOps
              captures: { vq: $.data.version }
            - call: "POST /notary/requests/${req_id}/assign"
              payload: { notary_id: "${not_id}", expected_request_version: "${vq}" }
              as: CoordinatorOps
            - call: "POST /notary/id-verifications"
              payload: { request_id: "${req_id}", signer_id: "${signer_id}", kba_score: 80, credential_score: 90, biometric_score: 80 }
              as: Notary
              as_user_id: "${not_id}"
            - call: "POST /notary/ron-sessions"
              payload: { request_id: "${req_id}", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: Notary
              as_user_id: "${not_id}"
            - call: "POST /notary/requests/${req_id}/start-session"
              payload: {}
              as: Notary
              as_user_id: "${not_id}"
            - call: "POST /notary/journal-entries"
              payload: { request_id: "${req_id}", document_id: "${doc_id}", act_type: "JURAT" }
              as: Notary
              as_user_id: "${not_id}"
              captures: { je_id: $.data.id }
          trigger:
            - call: "GET /notary/journal-entries/${je_id}"
              payload: {}
              as: Viewer
              captures: { st: $.data.entry_status }
          assert:
            - "JournalEntry.${je_id}.entry_status == COMPLETED"

  # =========================================================================
  # State machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_request_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.SigningRequest.DRAFT_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A CANCELLED request cancelled again returns ERR_INVALID_STATE (409); CANCELLED is terminal, no side effects fire."
        test_recipe:
          setup:
            - "A DRAFT request cancelled once (now CANCELLED)."
          setup_api_calls:
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme", default_state_code: "CA" }
              as: CoordinatorOps
              captures: { acct_id: $.data.id }
            - call: "POST /notary/signers"
              payload: { account_id: "${acct_id}", full_name: "Sam", email: "s@x.com", id_doc_type: "DRIVERS_LICENSE" }
              as: CoordinatorOps
              captures: { signer_id: $.data.id }
            - call: "POST /notary/requests"
              payload: { account_id: "${acct_id}", signer_id: "${signer_id}", state_code: "CA", doc_category: "GENERAL", delivery_mode: "MOBILE", expected_stamp_count: 1 }
              as: CoordinatorOps
              captures: { req_id: $.data.id }
            - call: "POST /notary/requests/${req_id}/cancel"
              payload: {}
              as: CoordinatorOps
          trigger:
            - call: "POST /notary/requests/${req_id}/cancel"
              payload: {}
              as: CoordinatorOps
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: new_request_starts_in_draft
        claim_type: initial_state
        grounds:
          - state_machines.SigningRequest
          - entities.SigningRequest.fields.status
        distinguishing_aspect: "A freshly created SigningRequest has status == DRAFT (initial_state)."
        test_recipe:
          setup:
            - "Account and signer exist."
          setup_api_calls:
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme", default_state_code: "CA" }
              as: CoordinatorOps
              captures: { acct_id: $.data.id }
            - call: "POST /notary/signers"
              payload: { account_id: "${acct_id}", full_name: "Sam", email: "s@x.com", id_doc_type: "DRIVERS_LICENSE" }
              as: CoordinatorOps
              captures: { signer_id: $.data.id }
          trigger:
            - call: "POST /notary/requests"
              payload: { account_id: "${acct_id}", signer_id: "${signer_id}", state_code: "CA", doc_category: "GENERAL", delivery_mode: "MOBILE", expected_stamp_count: 1 }
              as: CoordinatorOps
              captures: { req_id: $.data.id }
          assert:
            - "SigningRequest.${req_id}.status == DRAFT"

      - name: notary_reinstate_cycle_active_again
        claim_type: valid_transition
        grounds:
          - state_machines.Notary.ACTIVE_to_SUSPENDED
          - state_machines.Notary.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "Cyclic edge: ACTIVE notary suspended then reinstated returns to ACTIVE (cycle in the Notary commission machine)."
        test_recipe:
          setup:
            - "ACTIVE notary; suspended once."
          setup_api_calls:
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme", default_state_code: "CA" }
              as: CoordinatorOps
              captures: { acct_id: $.data.id }
            - call: "POST /notary/notaries"
              payload: { account_id: "${acct_id}", full_name: "Nora", commission_state: "CA", commission_expires_at: "2027-01-01T00:00:00Z", ron_authorized: true, nsa_certified: true }
              as: CoordinatorOps
              captures: { not_id: $.data.id }
            - call: "POST /notary/notaries/${not_id}/suspend"
              payload: {}
              as: CoordinatorOps
          trigger:
            - call: "POST /notary/notaries/${not_id}/reinstate"
              payload: {}
              as: CoordinatorOps
              captures: { st: $.data.status }
          assert:
            - "Notary.${not_id}.status == ACTIVE"

      - name: expire_notary_with_live_session_blocked
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Notary.ACTIVE_to_EXPIRED
          - errors[ERR_NOTARY_HAS_LIVE_SESSION]
        distinguishing_aspect: "Expiring a notary who hosts a LIVE session returns ERR_NOTARY_HAS_LIVE_SESSION (409); the precondition blocks the terminal transition."
        test_recipe:
          setup:
            - "Notary hosting an IN_SESSION request with a LIVE RonSession."
          setup_api_calls:
            - call: "POST /notary/fee-schedules"
              payload: { state_code: "CA", per_stamp_cents: 1500, travel_base_cents: 4000, travel_per_mile_cents: 100, ron_surcharge_cents: 2500, state_cap_cents: 20000 }
              as: CoordinatorOps
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme", default_state_code: "CA" }
              as: CoordinatorOps
              captures: { acct_id: $.data.id }
            - call: "POST /notary/notaries"
              payload: { account_id: "${acct_id}", full_name: "Nora", commission_state: "CA", commission_expires_at: "2027-01-01T00:00:00Z", ron_authorized: true, nsa_certified: true }
              as: CoordinatorOps
              captures: { not_id: $.data.id }
            - call: "POST /notary/signers"
              payload: { account_id: "${acct_id}", full_name: "Sam", email: "s@x.com", id_doc_type: "DRIVERS_LICENSE" }
              as: CoordinatorOps
              captures: { signer_id: $.data.id }
            - call: "POST /notary/requests"
              payload: { account_id: "${acct_id}", signer_id: "${signer_id}", state_code: "CA", doc_category: "GENERAL", delivery_mode: "RON", expected_stamp_count: 1 }
              as: CoordinatorOps
              captures: { req_id: $.data.id }
            - call: "POST /notary/documents"
              payload: { request_id: "${req_id}", title: "A", doc_type: "AFFIDAVIT", signing_fee_cents: 1000 }
              as: CoordinatorOps
            - call: "POST /notary/requests/${req_id}/quote"
              payload: {}
              as: CoordinatorOps
              captures: { vq: $.data.version }
            - call: "POST /notary/requests/${req_id}/assign"
              payload: { notary_id: "${not_id}", expected_request_version: "${vq}" }
              as: CoordinatorOps
            - call: "POST /notary/id-verifications"
              payload: { request_id: "${req_id}", signer_id: "${signer_id}", kba_score: 80, credential_score: 90, biometric_score: 80 }
              as: Notary
              as_user_id: "${not_id}"
            - call: "POST /notary/ron-sessions"
              payload: { request_id: "${req_id}", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: Notary
              as_user_id: "${not_id}"
            - call: "POST /notary/requests/${req_id}/start-session"
              payload: {}
              as: Notary
              as_user_id: "${not_id}"
          trigger:
            - call: "POST /notary/notaries/${not_id}/expire"
              payload: {}
              as: CoordinatorOps
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NOTARY_HAS_LIVE_SESSION"

      - name: apostille_resubmit_limit_exceeded
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ApostilleOrder.RETURNED_to_SUBMITTED
          - errors[ERR_RESUBMIT_LIMIT]
        distinguishing_aspect: "After three RETURNED->SUBMITTED cycles (resubmit_count==3), a fourth resubmit from RETURNED returns ERR_RESUBMIT_LIMIT (409)."
        test_recipe:
          setup:
            - "A COMPLETED apostille-bound document; ApostilleOrder cycled to resubmit_count=3 and currently RETURNED."
          setup_api_calls:
            - call: "POST /notary/fee-schedules"
              payload: { state_code: "CA", per_stamp_cents: 1500, travel_base_cents: 4000, travel_per_mile_cents: 100, ron_surcharge_cents: 2500, state_cap_cents: 20000 }
              as: CoordinatorOps
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme", default_state_code: "CA" }
              as: CoordinatorOps
              captures: { acct_id: $.data.id }
            - call: "POST /notary/notaries"
              payload: { account_id: "${acct_id}", full_name: "Nora", commission_state: "CA", commission_expires_at: "2027-01-01T00:00:00Z", ron_authorized: true, nsa_certified: true }
              as: CoordinatorOps
              captures: { not_id: $.data.id }
            - call: "POST /notary/signers"
              payload: { account_id: "${acct_id}", full_name: "Sam", email: "s@x.com", id_doc_type: "PASSPORT" }
              as: CoordinatorOps
              captures: { signer_id: $.data.id }
            - call: "POST /notary/requests"
              payload: { account_id: "${acct_id}", signer_id: "${signer_id}", state_code: "CA", doc_category: "APOSTILLE_BOUND", delivery_mode: "RON", expected_stamp_count: 1 }
              as: CoordinatorOps
              captures: { req_id: $.data.id }
            - call: "POST /notary/documents"
              payload: { request_id: "${req_id}", title: "Cert", doc_type: "BIRTH_CERT", requires_apostille: true, signing_fee_cents: 1000 }
              as: CoordinatorOps
              captures: { doc_id: $.data.id }
            - call: "POST /notary/requests/${req_id}/quote"
              payload: {}
              as: CoordinatorOps
              captures: { vq: $.data.version }
            - call: "POST /notary/requests/${req_id}/assign"
              payload: { notary_id: "${not_id}", expected_request_version: "${vq}" }
              as: CoordinatorOps
            - call: "POST /notary/id-verifications"
              payload: { request_id: "${req_id}", signer_id: "${signer_id}", kba_score: 80, credential_score: 90, biometric_score: 80 }
              as: Notary
              as_user_id: "${not_id}"
            - call: "POST /notary/ron-sessions"
              payload: { request_id: "${req_id}", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: Notary
              as_user_id: "${not_id}"
            - call: "POST /notary/requests/${req_id}/start-session"
              payload: {}
              as: Notary
              as_user_id: "${not_id}"
            - call: "POST /notary/journal-entries"
              payload: { request_id: "${req_id}", document_id: "${doc_id}", act_type: "ACKNOWLEDGMENT" }
              as: Notary
              as_user_id: "${not_id}"
            - call: "POST /notary/requests/${req_id}/complete"
              payload: {}
              as: Notary
              as_user_id: "${not_id}"
            - call: "POST /notary/apostille-orders"
              payload: { document_id: "${doc_id}", destination_country: "FR", sos_office_state: "CA" }
              as: ApostilleClerk
              captures: { ord_id: $.data.id }
            - call: "POST /notary/apostille-orders/${ord_id}/route"
              payload: {}
              as: ApostilleClerk
            - call: "POST /notary/apostille-orders/${ord_id}/return"
              payload: {}
              as: ApostilleClerk
            - call: "POST /notary/apostille-orders/${ord_id}/resubmit"
              payload: {}
              as: ApostilleClerk
            - call: "POST /notary/apostille-orders/${ord_id}/route"
              payload: {}
              as: ApostilleClerk
            - call: "POST /notary/apostille-orders/${ord_id}/return"
              payload: {}
              as: ApostilleClerk
            - call: "POST /notary/apostille-orders/${ord_id}/resubmit"
              payload: {}
              as: ApostilleClerk
            - call: "POST /notary/apostille-orders/${ord_id}/route"
              payload: {}
              as: ApostilleClerk
            - call: "POST /notary/apostille-orders/${ord_id}/return"
              payload: {}
              as: ApostilleClerk
            - call: "POST /notary/apostille-orders/${ord_id}/resubmit"
              payload: {}
              as: ApostilleClerk
            - call: "POST /notary/apostille-orders/${ord_id}/route"
              payload: {}
              as: ApostilleClerk
            - call: "POST /notary/apostille-orders/${ord_id}/return"
              payload: {}
              as: ApostilleClerk
          trigger:
            - call: "POST /notary/apostille-orders/${ord_id}/resubmit"
              payload: {}
              as: ApostilleClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RESUBMIT_LIMIT"

      - name: notary_expire_cascade_excluded
        claim_type: side_effect_execution
        grounds:
          - state_machines.Notary.ACTIVE_to_EXPIRED
        excluded_because:
          difficulty_instance: transitive_cascade / notary_expire_cascade_depth3
          rationale: "The depth-3 cascade (notary expire -> assignment release -> request revert) is asserted by the named §1.8 instance."

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: apostille_certification_fee_non_hague
        claim_type: Correct Result
        grounds:
          - calculations.apostille_authentication
          - entities.ApostilleOrder.fields.authentication_type
          - entities.ApostilleOrder.fields.fee_cents
        distinguishing_aspect: "destination_country=BR (non-Hague) yields authentication_type=CERTIFICATION and fee_cents=4000; FR (Hague) yields APOSTILLE/2000."
        test_recipe:
          setup:
            - "A document on any request; order created for BR."
          setup_api_calls:
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme", default_state_code: "CA" }
              as: CoordinatorOps
              captures: { acct_id: $.data.id }
            - call: "POST /notary/signers"
              payload: { account_id: "${acct_id}", full_name: "Sam", email: "s@x.com", id_doc_type: "PASSPORT" }
              as: CoordinatorOps
              captures: { signer_id: $.data.id }
            - call: "POST /notary/requests"
              payload: { account_id: "${acct_id}", signer_id: "${signer_id}", state_code: "CA", doc_category: "APOSTILLE_BOUND", delivery_mode: "MOBILE", expected_stamp_count: 1 }
              as: CoordinatorOps
              captures: { req_id: $.data.id }
            - call: "POST /notary/documents"
              payload: { request_id: "${req_id}", title: "Cert", doc_type: "BIRTH_CERT", requires_apostille: true, signing_fee_cents: 1000 }
              as: CoordinatorOps
              captures: { doc_id: $.data.id }
          trigger:
            - call: "POST /notary/apostille-orders"
              payload: { document_id: "${doc_id}", destination_country: "BR", sos_office_state: "CA" }
              as: ApostilleClerk
              captures: { ord_id: $.data.id, at: $.data.authentication_type, fee: $.data.fee_cents }
          assert:
            - "ApostilleOrder.${ord_id}.authentication_type == CERTIFICATION"
            - "ApostilleOrder.${ord_id}.fee_cents == 4000"

      - name: final_fee_excludes_voided_journal_entries
        claim_type: Input Set Filtering
        grounds:
          - calculations.request_fee_quote
          - entities.JournalEntry.fields.entry_status
        distinguishing_aspect: "FINAL fee counts only COMPLETED journal entries: with 3 acts recorded then one VOIDED on a RON request, final_fee_cents = 2*1500 + 4000 + 2500(ron) = 9500 (the voided act is excluded from the stamp count)."
        test_recipe:
          setup:
            - "RON request through completion: 3 journal acts recorded then 1 voided; RON ignores miles and adds the surcharge."
          setup_api_calls:
            - call: "POST /notary/fee-schedules"
              payload: { state_code: "CA", per_stamp_cents: 1500, travel_base_cents: 4000, travel_per_mile_cents: 100, ron_surcharge_cents: 2500, state_cap_cents: 20000 }
              as: CoordinatorOps
