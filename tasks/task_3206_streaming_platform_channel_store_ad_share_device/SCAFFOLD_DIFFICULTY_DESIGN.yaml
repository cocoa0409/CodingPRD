            - call: "POST /device-models"
              payload: { manufacturer_id: "${mfr}", model_code: "L-2", recovery_policy: "STRAIGHT_LINE" }
              as: TvManufacturer
              as_user_id: "${mfr}"
              captures: { m2: $.data.id }
