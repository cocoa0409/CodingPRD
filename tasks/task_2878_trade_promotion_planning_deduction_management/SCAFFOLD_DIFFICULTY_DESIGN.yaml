            - "Promotion.${promo_x_id}.spend_ratio == 1.0500 and spend_status == OVERSPENT"

      - name: tactic_window_temporal_outranks_tpr_capacity_constraint
        conflicting_rules: [71, 80]
        expected_error: ERR_TACTIC_WINDOW_OUTSIDE_PROMOTION
        grounds:
          - validations.priority_71
          - validations.priority_80
          - errors.ERR_TACTIC_WINDOW_OUTSIDE_PROMOTION
          - errors.ERR_TPR_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          A different endpoint and a different error-category pair from the approve instance:
          one tactic-create call violates a business_temporal rule at priority 71 (422) and a
          business_constraint rule at priority 80 (409). The requested window 2026-08-03 ->
          2026-08-24 starts a week before its own promotion's window (2026-08-10) and would
          simultaneously be the third live TPR tactic covering the same customer and brand on
          the days 2026-08-10 through 2026-08-24. The temporal rule must win and the status
          must be 422, not 409. Note that here the lower-priority rule is the one carrying the
          409, the opposite arrangement to the approve instance, so an implementation that
          orders by HTTP status rather than by priority fails exactly one of the two.
