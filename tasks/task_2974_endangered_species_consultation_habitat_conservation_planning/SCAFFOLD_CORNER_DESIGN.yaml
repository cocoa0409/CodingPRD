              as: Auditor
              as_user_id: "fws-user-auditor"
              captures: {e_pd: "$.data.error_id"}
            - call: "GET /consultations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Auditor
              as_user_id: "fws-user-auditor"
              captures: {e_consultation: "$.data.error_id"}
            - call: "GET /habitat-conservation-plans/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Auditor
              as_user_id: "fws-user-auditor"
              captures: {e_hcp: "$.data.error_id"}
            - call: "GET /conservation-banks/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Auditor
              as_user_id: "fws-user-auditor"
              captures: {e_bank: "$.data.error_id"}
            - call: "GET /incidental-take-permits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Auditor
              as_user_id: "fws-user-auditor"
              captures: {e_permit: "$.data.error_id"}
            - call: "POST /monitoring-reports/00000000-0000-4000-8000-000000000000/adjudication"
              payload: {decision: "ACCEPT", adjudication_note: "n/a"}
              as: WildlifeAgency
              as_user_id: "fws-user-adjudicator"
