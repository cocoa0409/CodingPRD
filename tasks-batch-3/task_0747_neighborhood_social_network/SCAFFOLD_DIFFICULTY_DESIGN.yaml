              payload: { group_id: "${g1_id}", neighborhood_id: "${n1_id}", title: "E3", venue_lat: 37.75, venue_lng: -122.42, starts_at: "2026-06-10T12:00:00Z", ends_at: "2026-06-10T14:00:00Z", capacity: 10 }
