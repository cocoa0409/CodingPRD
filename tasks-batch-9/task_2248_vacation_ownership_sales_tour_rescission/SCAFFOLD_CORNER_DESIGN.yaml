              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-07-31T23:00:00Z" }
              as: MarketingManager
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-01T00:59:59Z" }
              as: MarketingManager
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-01T01:00:00Z" }
