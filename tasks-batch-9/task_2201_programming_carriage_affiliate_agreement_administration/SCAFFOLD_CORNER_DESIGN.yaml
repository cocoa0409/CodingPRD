      - name: terminated_agreement_rejects_every_further_lifecycle_action
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CarriageAgreement.NEGOTIATING_to_TERMINATED
          - errors[ERR_INVALID_AGREEMENT_STATE]
          - errors[ERR_AGREEMENT_NOT_EXECUTED]
        distinguishing_aspect: >-
          TERMINATED is terminal on SM1: EXECUTE, SUSPEND, REINSTATE and a second
          TERMINATE all return 422 ERR_INVALID_AGREEMENT_STATE, and a report filed
          against the dead agreement is rejected too — while the terminal row itself
          never changes version again.
        test_recipe:
          setup:
            - "One agreement taken NEGOTIATING then TERMINATED; no invoice ever existed, so no receivable blocks the termination."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Meridian Broadband"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 1500000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                dm_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${dm_id}"
                contract_code: "MB-DEAD"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                ag_id: "id"
            - call: "POST /carriage/agreements/${ag_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${ag_id}/lifecycle"
              payload:
                action: "TERMINATE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                dead_version: "version"
          trigger:
            - call: "POST /carriage/agreements/${ag_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
          assert:
            - "response status code == 422"
            - "response body data.error_id == \"ERR_INVALID_AGREEMENT_STATE\""
            - "the same endpoint with action=\"SUSPEND\" and suspension_reason=\"MANUAL_SUSPENSION\" returns 422 ERR_INVALID_AGREEMENT_STATE"
            - "the same endpoint with action=\"REINSTATE\" returns 422 ERR_INVALID_AGREEMENT_STATE"
            - "the same endpoint with action=\"TERMINATE\" again returns 422 ERR_INVALID_AGREEMENT_STATE"
            - "POST /carriage/subscriber-reports with agreement_id=${ag_id}, period_month=\"2026-06\", reported_subscribers=900000, reported_tier=\"BASIC\" and expected_agreement_version=${dead_version} returns 422 with data.error_id == \"ERR_AGREEMENT_NOT_EXECUTED\""
            - "GET /carriage/agreements/${ag_id} returns lifecycle_status == \"TERMINATED\" and version == ${dead_version} after all five rejected calls"

      - name: execute_requires_penetration_floor_that_binds_a_subscriber
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CarriageAgreement.NEGOTIATING_to_EXECUTED
