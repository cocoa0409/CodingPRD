          trigger:
            - call: "POST /atfm/tmis/${tmi}/publish"
              as: CommandCenterAdmin
              as_user_id: "fm-1"
              captures: { err: $.data.error_id }
            - call: "POST /atfm/tmis/${tmi}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
              captures: { st: $.data.status }
          assert:
