            - { call: "POST /comp/physicians", payload: { npi: "1000000081", full_name: "Dr Blocked", specialty: "IM", provider_type: PHYSICIAN, fte: 1.0, hire_date: "2018-01-01" }, as: SystemAdmin, captures: { phys: $.data.id } }
            - { call: "POST /comp/comp-plans", payload: { name: "Blk Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", credit_attribution_mode: SERVICE_DATE, quality_model: ALL_OR_NOTHING, quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 0.97, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/review-decision", payload: { decision: APPROVED }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/comp-plans/${plan}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${phys}", plan_id: "${plan}", base_salary_cents: 24000000, period_draw_cents: 1000000, effective_date: "2026-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { agr: $.data.id } }
            - { call: "POST /comp/physician-agreements/${agr}/submit-fmv", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr}/fmv-review", payload: { decision: APPROVED, benchmark_percentile: 55 }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/physician-agreements/${agr}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements/${agr}/production-captures", payload: { cpt_code: "99213", units: 10, service_date: "2026-02-10", posting_date: "2026-02-10" }, as: CompAnalyst, as_user_id: an_1, captures: { cap: $.data.id } }
            - { call: "POST /comp/production-captures/${cap}/validate", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr}/comp-statements", payload: { period_year: 2026, period_month: 2 }, as: CompAnalyst, as_user_id: an_1, captures: { stmt: $.data.id } }
            - { call: "POST /comp/comp-statements/${stmt}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/disputes", payload: { subject_type: CAPTURE, subject_capture_id: "${cap}", reason: "questioning units" }, as: Physician, as_user_id: "${phys}", captures: { dsp: $.data.id } }
          trigger:
            - { call: "POST /comp/comp-statements/${stmt}/finalize", payload: {}, as: CompCommittee, as_user_id: cc_9, captures: { err: $.data.error_id } }
            - { call: "POST /comp/disputes/${dsp}/start-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/disputes/${dsp}/resolve", payload: { resolution: REJECTED }, as: CompCommittee, as_user_id: cc_9 }
            - { call: "POST /comp/comp-statements/${stmt}/finalize", payload: {}, as: CompCommittee, as_user_id: cc_9, captures: { stmt_st: $.data.status } }
          assert:
            - "First finalize: 409 ERR_OPEN_DISPUTES while Dispute.${dsp}.status == \"FILED\""
            - "CompStatement.${stmt}.status still \"UNDER_REVIEW\" after the blocked finalize"
            - "After dispute resolved REJECTED (terminal): finalize succeeds, status == \"FINALIZED\""
            - "GET /comp/production-captures/${cap} -> capture_status == \"LOCKED\" (finalize cascade) and credit_status == \"CREDITED\" (rejection carried no compensation)"

