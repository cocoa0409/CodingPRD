  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dispute_revision_loop_submit_review_queue_resubmit
        grounds:
          - state_machines.Dispute.SUBMITTED_to_UNDER_REVIEW
          - state_machines.Dispute.UNDER_REVIEW_to_SUBMITTED
          - entities.Dispute.fields.status
        distinguishing_aspect: |
          Cyclic shape on the Dispute entity: UNDER_REVIEW -> SUBMITTED ->
          UNDER_REVIEW is legal any number of times (reviewer returns the
          dispute to the queue for more evidence), while terminal states
          remain locked — the loop is on Dispute, not on any other entity.
