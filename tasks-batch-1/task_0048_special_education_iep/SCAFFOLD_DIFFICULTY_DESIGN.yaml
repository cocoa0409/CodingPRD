scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: goal_progress_provisional_vs_cumulative_diverge
        grounds:
          - calculations.goal_progress_provisional
          - calculations.goal_progress_cumulative
          - entities.Goal.fields.latest_progress_pct
          - entities.Goal.fields.cumulative_progress_pct
        distinguishing_aspect: >-
          On a single Goal (READING domain), provisional (latest report only) yields 66.67 while
          cumulative (average of all reports) yields 44.45 for identical underlying ProgressReports —
          two valid algorithms, different numbers, on the Goal entity domain.
        test_recipe:
          setup:
            - "An IEP exists for an ELIGIBLE student with a READING Goal (baseline_value=0, target_value=3)."
            - "Three ProgressReports recorded: period1 measured 0, period2 measured 2, period3 measured 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: SpecialEdAdmin
            - call: "POST /students"
              payload: { full_name: "Dana Reyes", date_of_birth: "2014-04-01", grade_level: 6 }
              as: SpecialEdAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /evaluations"
              payload: { student_id: "${stu_id}", eval_type: "INITIAL", cognitive_score: 110, academic_score: 70, adaptive_score: 75, proposed_category: "SLD" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/request-consent"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
            - call: "GET /consent-requests"
              payload: { student_id: "${stu_id}", consent_type: "EVALUATION", status: "PENDING" }
              as: Parent
              as_user_id: "par_1"
              captures: { cr_eval_id: "$.data[0].id" }
            - call: "POST /consent-requests/${cr_eval_id}/decide"
              payload: { decision: "GRANT" }
              as: Parent
              as_user_id: "par_1"
            - call: "POST /evaluations/${eval_id}/begin"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
            - call: "POST /ieps"
              payload: { student_id: "${stu_id}", school_day_minutes: 360, annual_review_due_date: "2027-03-01" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { iep_id: $.data.id }
            - call: "POST /goals"
              payload: { iep_id: "${iep_id}", domain: "READING", baseline_value: 0, target_value: 3 }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { goal_id: $.data.id }
            - call: "POST /progress-reports"
              payload: { goal_id: "${goal_id}", reporting_period: 1, measured_value: 0 }
              as: CaseManager
              as_user_id: "cm_1"
            - call: "POST /progress-reports"
              payload: { goal_id: "${goal_id}", reporting_period: 2, measured_value: 2 }
              as: CaseManager
              as_user_id: "cm_1"
          trigger:
            - call: "POST /progress-reports"
              payload: { goal_id: "${goal_id}", reporting_period: 3, measured_value: 2 }
              as: CaseManager
              as_user_id: "cm_1"
            - call: "GET /goals/${goal_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
              captures: { lp: $.data.latest_progress_pct, cp: $.data.cumulative_progress_pct }
          assert:
            - "Goal.${goal_id}.latest_progress_pct == 66.67"
            - "Goal.${goal_id}.cumulative_progress_pct == 44.45"

      - name: eligibility_composite_initial_vs_triennial_diverge
        grounds:
          - calculations.eligibility_composite_score
          - entities.Evaluation.fields.composite_eligibility_score
          - entities.Evaluation.fields.eval_type
          - state_machines.Evaluation.IN_PROGRESS_to_FINALIZED
        distinguishing_aspect: >-
          On the Evaluation entity domain, identical sub-scores (110/70/75) produce composite 33.50
          under the INITIAL model (gap_weight 0.5) versus 37.50 under the TRIENNIAL model
          (gap_weight 0.6) — a different entity domain than the Goal-progress dual variant.
        test_recipe:
          setup:
            - "Student has one FINALIZED INITIAL Evaluation (110/70/75) and, three years later, a TRIENNIAL Evaluation with the same scores."
            - "Clock advanced past the triennial reeval-due date before the second evaluation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T09:00:00Z" }
              as: SpecialEdAdmin
            - call: "POST /students"
              payload: { full_name: "Lee Ng", date_of_birth: "2016-02-01", grade_level: 4 }
              as: SpecialEdAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /evaluations"
              payload: { student_id: "${stu_id}", eval_type: "INITIAL", cognitive_score: 110, academic_score: 70, adaptive_score: 75, proposed_category: "SLD" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { eval1_id: $.data.id }
            - call: "POST /evaluations/${eval1_id}/request-consent"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
            - call: "GET /consent-requests"
              payload: { student_id: "${stu_id}", consent_type: "EVALUATION", status: "PENDING" }
              as: Parent
              as_user_id: "par_1"
              captures: { cr1_id: "$.data[0].id" }
            - call: "POST /consent-requests/${cr1_id}/decide"
              payload: { decision: "GRANT" }
              as: Parent
              as_user_id: "par_1"
            - call: "POST /evaluations/${eval1_id}/begin"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
            - call: "POST /evaluations/${eval1_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
              captures: { c1: $.data.composite_eligibility_score }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-02-01T09:00:00Z" }
              as: SpecialEdAdmin
            - call: "POST /evaluations"
              payload: { student_id: "${stu_id}", eval_type: "TRIENNIAL", cognitive_score: 110, academic_score: 70, adaptive_score: 75, proposed_category: "SLD" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { eval2_id: $.data.id }
            - call: "POST /evaluations/${eval2_id}/request-consent"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
            - call: "GET /consent-requests"
              payload: { student_id: "${stu_id}", consent_type: "EVALUATION", status: "PENDING" }
              as: Parent
              as_user_id: "par_1"
              captures: { cr2_id: "$.data[0].id" }
            - call: "POST /consent-requests/${cr2_id}/decide"
              payload: { decision: "GRANT" }
              as: Parent
              as_user_id: "par_1"
            - call: "POST /evaluations/${eval2_id}/begin"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
          trigger:
            - call: "POST /evaluations/${eval2_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
              captures: { c2: $.data.composite_eligibility_score }
          assert:
            - "Evaluation.${eval1_id}.composite_eligibility_score == 33.50"
            - "Evaluation.${eval2_id}.composite_eligibility_score == 37.50"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: eligibility_composite_nonlinear_three_inputs
        grounds:
          - calculations.eligibility_composite_score
          - entities.Evaluation.fields.cognitive_score
          - entities.Evaluation.fields.academic_score
          - entities.Evaluation.fields.adaptive_score
        distinguishing_aspect: >-
          Mode (a): the eligibility composite combines three standard scores through a non-linear
          interaction — a clamped ability-achievement discrepancy (max(0, cog-acad)), a conditional
          eval_type branch on gap_weight, and two below-100 deficit terms — yielding 33.50 for
          (110,70,75) INITIAL, not a simple linear sum.
        test_recipe:
          setup:
            - "An eligible student has an INITIAL Evaluation IN_PROGRESS with scores 110/70/75."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: SpecialEdAdmin
            - call: "POST /students"
              payload: { full_name: "Mara Vox", date_of_birth: "2015-05-05", grade_level: 5 }
              as: SpecialEdAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /evaluations"
              payload: { student_id: "${stu_id}", eval_type: "INITIAL", cognitive_score: 110, academic_score: 70, adaptive_score: 75, proposed_category: "SLD" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/request-consent"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
            - call: "GET /consent-requests"
              payload: { student_id: "${stu_id}", consent_type: "EVALUATION", status: "PENDING" }
              as: Parent
              as_user_id: "par_1"
              captures: { cr_id: "$.data[0].id" }
            - call: "POST /consent-requests/${cr_id}/decide"
              payload: { decision: "GRANT" }
              as: Parent
              as_user_id: "par_1"
            - call: "POST /evaluations/${eval_id}/begin"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
          trigger:
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
              captures: { c: $.data.composite_eligibility_score, o: $.data.outcome }
          assert:
            - "Evaluation.${eval_id}.composite_eligibility_score == 33.50"
            - "Evaluation.${eval_id}.outcome == ELIGIBLE"

      - name: goal_cumulative_rounding_order_pinned
        grounds:
          - calculations.goal_progress_cumulative
          - entities.Goal.fields.cumulative_progress_pct
        distinguishing_aspect: >-
          Mode (b): cumulative progress over reports {0,66.67,66.67} (baseline 0, target 3, measured
          0/2/2) is 44.45 under the pinned round-per-report-then-average order, NOT 44.44 which
          average-then-round would yield — a rounding-order axis distinct from the eligibility
          composite's nested-conditional axis.
        test_recipe:
          setup:
            - "A READING Goal (baseline_value=0, target_value=3) on an IEP for an eligible student."
            - "Two ProgressReports already recorded: period1 measured 0, period2 measured 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: SpecialEdAdmin
            - call: "POST /students"
              payload: { full_name: "Theo Park", date_of_birth: "2014-06-06", grade_level: 6 }
              as: SpecialEdAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /evaluations"
              payload: { student_id: "${stu_id}", eval_type: "INITIAL", cognitive_score: 110, academic_score: 70, adaptive_score: 75, proposed_category: "SLD" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/request-consent"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
            - call: "GET /consent-requests"
              payload: { student_id: "${stu_id}", consent_type: "EVALUATION", status: "PENDING" }
              as: Parent
              as_user_id: "par_1"
              captures: { cr_id: "$.data[0].id" }
            - call: "POST /consent-requests/${cr_id}/decide"
              payload: { decision: "GRANT" }
              as: Parent
              as_user_id: "par_1"
            - call: "POST /evaluations/${eval_id}/begin"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
            - call: "POST /ieps"
              payload: { student_id: "${stu_id}", school_day_minutes: 360, annual_review_due_date: "2027-03-01" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { iep_id: $.data.id }
            - call: "POST /goals"
              payload: { iep_id: "${iep_id}", domain: "READING", baseline_value: 0, target_value: 3 }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { goal_id: $.data.id }
            - call: "POST /progress-reports"
              payload: { goal_id: "${goal_id}", reporting_period: 1, measured_value: 0 }
              as: CaseManager
              as_user_id: "cm_1"
            - call: "POST /progress-reports"
              payload: { goal_id: "${goal_id}", reporting_period: 2, measured_value: 2 }
              as: CaseManager
              as_user_id: "cm_1"
          trigger:
            - call: "POST /progress-reports"
              payload: { goal_id: "${goal_id}", reporting_period: 3, measured_value: 2 }
              as: CaseManager
              as_user_id: "cm_1"
            - call: "GET /goals/${goal_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
              captures: { cp: $.data.cumulative_progress_pct }
          assert:
            - "Goal.${goal_id}.cumulative_progress_pct == 44.45"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: consent_branching_revert_grant_revoke_rerequest
        grounds:
          - state_machines.ConsentRequest.PENDING_to_GRANTED
          - state_machines.ConsentRequest.GRANTED_to_REVOKED
          - state_machines.ConsentRequest.PENDING_to_DENIED
        distinguishing_aspect: >-
          ConsentRequest is branching-with-revert: PENDING forks to GRANTED or DENIED, GRANTED
          reverts to REVOKED (terminal), and a retry requires a fresh ConsentRequest — a non-linear
          shape on the ConsentRequest entity, distinct from the IEP cycle.
        test_recipe:
          setup:
            - "A student has a PLACEMENT ConsentRequest in PENDING for a MEETING_HELD IEP."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: SpecialEdAdmin
            - call: "POST /students"
              payload: { full_name: "Ivy Cole", date_of_birth: "2014-07-07", grade_level: 6 }
              as: SpecialEdAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /evaluations"
              payload: { student_id: "${stu_id}", eval_type: "INITIAL", cognitive_score: 110, academic_score: 70, adaptive_score: 75, proposed_category: "SLD" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/request-consent"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
            - call: "GET /consent-requests"
              payload: { student_id: "${stu_id}", consent_type: "EVALUATION", status: "PENDING" }
              as: Parent
              as_user_id: "par_1"
              captures: { cr_eval_id: "$.data[0].id" }
            - call: "POST /consent-requests/${cr_eval_id}/decide"
              payload: { decision: "GRANT" }
              as: Parent
              as_user_id: "par_1"
            - call: "POST /evaluations/${eval_id}/begin"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
            - call: "POST /ieps"
              payload: { student_id: "${stu_id}", school_day_minutes: 360, annual_review_due_date: "2027-03-01" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { iep_id: $.data.id }
            - call: "POST /ieps/${iep_id}/hold-meeting"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
            - call: "GET /consent-requests"
              payload: { student_id: "${stu_id}", iep_id: "${iep_id}", consent_type: "PLACEMENT", status: "PENDING" }
              as: Parent
              as_user_id: "par_1"
              captures: { cr_plc_id: "$.data[0].id" }
          trigger:
            - call: "POST /consent-requests/${cr_plc_id}/decide"
              payload: { decision: "GRANT" }
              as: Parent
              as_user_id: "par_1"
              captures: { st_after_grant: $.data.status }
            - call: "POST /consent-requests/${cr_plc_id}/revoke"
              payload: {}
              as: Parent
              as_user_id: "par_1"
              captures: { st_after_revoke: $.data.status }
          assert:
            - "ConsentRequest.${cr_plc_id}.status after decide GRANT == GRANTED"
            - "ConsentRequest.${cr_plc_id}.status after revoke == REVOKED"

      - name: iep_cycle_active_amendment_active
        grounds:
          - state_machines.IEP.ACTIVE_to_AMENDMENT_PENDING
          - state_machines.IEP.AMENDMENT_PENDING_to_ACTIVE
        distinguishing_aspect: >-
          The IEP entity is cyclic: ACTIVE -> AMENDMENT_PENDING -> ACTIVE loops for revision rounds,
          a distinct non-linear shape on a different entity than the ConsentRequest branch-with-revert.
        test_recipe:
          setup:
            - "An IEP is ACTIVE for an eligible student with a GRANTED PLACEMENT consent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: SpecialEdAdmin
            - call: "POST /students"
              payload: { full_name: "Omar Diaz", date_of_birth: "2014-08-08", grade_level: 6 }
              as: SpecialEdAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /evaluations"
              payload: { student_id: "${stu_id}", eval_type: "INITIAL", cognitive_score: 110, academic_score: 70, adaptive_score: 75, proposed_category: "SLD" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/request-consent"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
            - call: "GET /consent-requests"
              payload: { student_id: "${stu_id}", consent_type: "EVALUATION", status: "PENDING" }
              as: Parent
              as_user_id: "par_1"
              captures: { cr_eval_id: "$.data[0].id" }
            - call: "POST /consent-requests/${cr_eval_id}/decide"
              payload: { decision: "GRANT" }
              as: Parent
              as_user_id: "par_1"
            - call: "POST /evaluations/${eval_id}/begin"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
            - call: "POST /ieps"
              payload: { student_id: "${stu_id}", school_day_minutes: 360, annual_review_due_date: "2027-03-01" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { iep_id: $.data.id }
            - call: "POST /ieps/${iep_id}/hold-meeting"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
            - call: "GET /consent-requests"
              payload: { student_id: "${stu_id}", iep_id: "${iep_id}", consent_type: "PLACEMENT", status: "PENDING" }
              as: Parent
              as_user_id: "par_1"
              captures: { cr_plc_id: "$.data[0].id" }
            - call: "POST /consent-requests/${cr_plc_id}/decide"
              payload: { decision: "GRANT" }
              as: Parent
              as_user_id: "par_1"
            - call: "POST /ieps/${iep_id}/activate"
              payload: {}
              as: SpecialEdAdmin
              as_user_id: "adm_1"
              captures: { iep_v: $.data.version }
          trigger:
            - call: "POST /ieps/${iep_id}/open-amendment"
              payload: { expected_iep_version: "${iep_v}" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { st_amend: $.data.status }
            - call: "POST /ieps/${iep_id}/activate"
              payload: {}
              as: SpecialEdAdmin
              as_user_id: "adm_1"
              captures: { st_reactive: $.data.status }
          assert:
            - "IEP.${iep_id}.status after open-amendment == AMENDMENT_PENDING"
            - "IEP.${iep_id}.status after second activate == ACTIVE"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: archive_iep_cascades_goals_and_services_depth3
        grounds:
          - state_machines.IEP.ACTIVE_to_ARCHIVED
          - state_machines.Goal.ACTIVE_to_DISCONTINUED
          - state_machines.RelatedService.ACTIVE_to_DISCONTINUED
          - entities.Student.fields.active_iep_id
        distinguishing_aspect: >-
          Depth-3 cascade originating from IEP archive: archive (A) clears Student.active_iep_id and,
          for each ACTIVE Goal it discontinues (B), and each ACTIVE RelatedService it discontinues (C)
          — each link a consequence of the IEP leaving ACTIVE; trigger is IEP ACTIVE->ARCHIVED.
        test_recipe:
          setup:
            - "An ACTIVE IEP for an eligible student with one ACTIVE READING Goal and one ACTIVE pull-out SPEECH service."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: SpecialEdAdmin
            - call: "POST /students"
