            - { call: "POST /api/claims", payload: { enrollment_id: "${enr_id}", claim_type: "REIMBURSEMENT", service_date: "2026-02-08T00:00:00Z", receipt_ref: "R-91", line_items: [ { description: "edge late", unit_amount_cents: 1000, quantity: 1, tax_pct: 0.0 } ] }, as: Member, as_user_id: "${m_id}", captures: { err: $.data.error_id } }
          assert:
            - "Claim.${c90} created (201) — exactly 90 days old is inside the window"
            - "Second create error_id == ERR_CLAIM_FILING_DEADLINE — 91 days old is outside"

      - name: dependent_child_age_26_boundary
        grounds:
          - validations[priority=7]
          - errors[ERR_DEPENDENT_AGE_INELIGIBLE]
        distinguishing_aspect: |
          Boundary on the dependent-age metric via the dependents endpoint: at plan period_start
