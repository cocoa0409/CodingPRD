          assert:
            - "setup: gen1_generation == 1, gen2_generation == 2, pinned_generation == 1, scheduled_generation == 1, gen2_status == \"PUBLISHED\""
            - "setup: GET /research-billing/study-calendars/${calendar_gen1_id} now shows status == \"RETIRED\" as a side effect of publishing generation 2"
            - "trigger response 409 with error_id == \"ERR_STALE_CALENDAR_GENERATION\""
            - "GET /research-billing/subject-visits/${subject_visit_id} still shows status == \"SCHEDULED\" and generated_charge_count == 0 - no charge was dropped"
            - "GET /research-billing/study-subjects/${subject_id} still shows consented_calendar_id == ${pinned_calendar_id} and consented_calendar_generation == 1; the pin is not silently re-pointed at generation 2"
            - "GET /research-billing/charges?study_id=${study_id} returns total_count == 0 - the cascade that would have created charges never ran"

      - name: analysis_approval_blocked_by_undetermined_study_qct
        grounds: "§1.2 CoverageAnalysis UNDER_REVIEW -> APPROVED precondition on study.qct_determination when qct_conditional_item_count >= 1; §1.4 priority 21 (drafting allowed) and priority 35 (approval refused); §1.6 ERR_QCT_DETERMINATION_REQUIRED; §1.1 CoverageAnalysis.qct_conditional_item_count."
        distinguishing_aspect: "Entity pair (CoverageAnalysis, Study) - a third distinct pair, and the only one where the two entities disagree about when the dependency applies. Priority 21 deliberately lets a ROUTINE_CARE / QCT_CONDITIONAL item be drafted onto the grid while the study is UNDETERMINED, so the analyst can prepare work in parallel with the compliance determination; priority 35 then refuses to bless it. The dependency is also conditional on a derived counter: the identical approval succeeds when every routine item is STANDARD_OF_CARE, so qct_conditional_item_count is doing the gating, not the classification alone."
        test_recipe:
          setup:
            - "One study with qct_determination UNDETERMINED whose analysis carries one ROUTINE_CARE item with medicare_coverage_basis QCT_CONDITIONAL (accepted at draft time) and one RESEARCH_PAID item, submitted for review."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-W", title: "Conditional coverage probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true, registry_number: "NCT10000021" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version", determination_at_creation: "$.data.qct_determination" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "78815", description: "PET/CT skull base to mid-thigh", classification: "ROUTINE_CARE", medicare_coverage_basis: "QCT_CONDITIONAL", budget_category: "PER_PATIENT", charge_master_unit_cents: 450000, negotiated_unit_cents: 450000, units_per_occurrence: 1, expected_occurrences: 2 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { conditional_item_id: "$.data.id" }
            - call: "GET /research-billing/coverage-analyses/${analysis_id}"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_v2: "$.data.version", conditional_count: "$.data.qct_conditional_item_count" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v2}", item_code: "J9999", description: "Investigational infusion", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 55000, negotiated_unit_cents: 40000, units_per_occurrence: 1, expected_occurrences: 1 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { status_before_trigger: "$.data.status" }
          trigger:
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { observed_error: "$.data.error_id" }
          assert:
            - "setup: determination_at_creation == \"UNDETERMINED\"; the QCT_CONDITIONAL routine item was accepted with 201 (priority 21 does not block a merely undetermined study) and conditional_count == 1; status_before_trigger == \"UNDER_REVIEW\""
            - "trigger response 409 with error_id == \"ERR_QCT_DETERMINATION_REQUIRED\""
            - "trigger response error_id is NOT \"ERR_ROUTINE_CARE_REQUIRES_QCT\" (that code belongs to item creation) and NOT \"ERR_SEGREGATION_OF_DUTIES\" (reviewer_1 did not prepare the analysis)"
            - "GET /research-billing/coverage-analyses/${analysis_id} still shows status == \"UNDER_REVIEW\", approved_at null, approved_by_user_id null"
            - "GET /research-billing/studies/${study_id} still shows lifecycle_status == \"COVERAGE_PENDING\" - the LC-2 transition did not fire"
            - "after POST /research-billing/studies/${study_id}/qct-determination with basis DEEMED_IND_IDE, the identical approve call succeeds with status \"APPROVED\" and the study moves to \"COVERAGE_APPROVED\""

  # =========================================================================
  # RULE 8 - resource_temporal_overlap
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: calendar_visit_windows_are_closed_and_may_not_touch
        grounds: "§1.4 priority 36 and §1.6 ERR_VISIT_WINDOW_OVERLAP; §1.1 CalendarVisit.window_start_day and window_end_day; §1.5 POST /research-billing/calendar-visits."
        distinguishing_aspect: "Resource: the day-offset axis of one StudyCalendar. Interval semantics: CLOSED intervals in which touching endpoints collide. Visit 1 occupies [0, 3]; a second visit at target day 7 with window_before_days 4 occupies [3, 10] and is refused because day 3 belongs to both, even though neither visit's TARGET day conflicts. Shifting the target one day later to [4, 12] is accepted, so the boundary between 'adjacent' and 'touching' is exactly one day wide."
        test_recipe:
          setup:
            - "One study with an approved analysis and a DRAFT calendar carrying a single visit at target day 0 with window_before_days 0 and window_after_days 3, i.e. the closed interval [0, 3]."
          setup_api_calls:
