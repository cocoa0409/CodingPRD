              as: ComplianceAdmin
          assert:
            - "${cycle_status} == PLANNING"
            - "the both-unknown request returns 404 ERR_CYCLE_NOT_FOUND, proving cycle_id is resolved before officer_member_id"
            - "the unknown-member request returns 404 ERR_MEMBER_NOT_FOUND"
            - "the charter-B officer returns 409 ERR_MEMBER_CHARTER_MISMATCH"
            - "the non-officer charter-A member returns 409 ERR_MEMBER_SEAT_INVALID"
            - "${cert_cycle} == \"${cycle_id}\" and ${cert_member} == \"${ceo_id}\" and ${cert_type_out} == CEO_302 and ${cert_status} == BLOCKED"
            - "the second CEO_302 request returns 409 ERR_DUPLICATE_CERTIFICATION even though it names a different officer"
            - "${cfo_seat} == RECUSED and the CFO_302 request then returns 409 ERR_MEMBER_SEAT_INVALID"
            - "the closing list read returns exactly 1 row whose id == \"${cert_id}\" and total_count == 1"

      - name: approved_document_still_accepts_tie_out_writes_but_refuses_every_adjusted_measure_write
        claim_type: conditional_action
        grounds:
          - validations[priority=13]
          - endpoints[POST /disclosure/documents/{id}/tie-out-items]
          - endpoints[POST /disclosure/tie-out-items/{id}/review]
          - endpoints[POST /disclosure/documents/{id}/adjusted-measures]
          - endpoints[POST /disclosure/adjusted-measures/{id}/reconcile]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          §1.4 priority 13 gives the SAME parent state two different answers depending on which child is
          being written: a DraftDocument in APPROVED still accepts TieOutItem creation and tie-out review —
          deliberately, because a late-discovered tie-out break on an approved document is what drives the
          HOP 3 cascade — while AdjustedMeasure creation, measure reconciliation and question clearance are
          restricted to {DRAFT, IN_REVIEW, CHANGES_REQUESTED}. Four child writes are fired at one APPROVED
          document in the same chain: two succeed and two are refused with ERR_INVALID_STATE. An
          implementation that applies one uniform "editable while not approved" rule fails the two
          successful legs; one that applies no rule at all fails the two refusals.
        test_recipe:
          setup:
            - "An adopted charter with two FINANCE seats and a LEGAL seat, and a FY2026-Q2 cycle in CLOSE_OPEN."
            - "A PERIODIC_FILING document carried to APPROVED with one RECONCILED AdjustedMeasure (gap 0.00, prominence ok) and one MATCHED tie-out line, so measure_gate_status is CLEARED and tie_out_status is PASSED."
