      - name: expired_cert_blocks_qa_certify_after_epoch
        claim_type: conditional_validation
        grounds:
          - validations[priority=11]
          - state_machines.MechanicCertification
        distinguishing_aspect: "Conditional on certification status: QA mechanic's QA_AUTHORITY cert (expiry 2026-07-01) is flipped to EXPIRED by run_epoch at clock 2026-08-01, after which QA_CERTIFY fails with ERR_CERT_EXPIRED — distinct from ERR_CERT_REQUIRED (never held)."
        test_recipe:
          setup: ["WO in PENDING_QA (lead m1); m2 holds QA_AUTHORITY with expiry 2026-07-01 (VALID at creation despite past date; expiry only applied by epoch sweep)"]
          setup_api_calls:
