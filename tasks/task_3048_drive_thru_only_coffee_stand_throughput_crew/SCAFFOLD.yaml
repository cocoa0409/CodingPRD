    roles: [PlatformAdmin, RegionalManager, StandOperator]
    code: 200
    input: []
    output: OperatorAgreement
    side_effects: []

  - method: GET
    path: "/operator-agreements"
    description: "List operator agreements, filterable by stand or crew member"
    roles: [PlatformAdmin, RegionalManager, StandOperator]
    code: 200
    input: ["stand_id?", "crew_member_id?", "status?", "limit?", "offset?"]
    output: "OperatorAgreement[]"
    side_effects: []

  - method: POST
    path: "/operator-agreements/{agreementId}/approve"
    description: "PlatformAdmin approves a nomination; approver must differ from nominator (segregation of duties)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: OperatorAgreement
    side_effects: ["status NOMINATED -> APPROVED", "approved_by set"]

  - method: POST
    path: "/operator-agreements/{agreementId}/activate"
