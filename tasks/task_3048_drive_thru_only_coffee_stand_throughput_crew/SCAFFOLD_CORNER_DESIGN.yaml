              captures: { v_now: $.data.version }
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "LOYALTY_APP", loyalty_account_id: "${acct_id}", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${v_now}" }
              as: LoyaltyCustomer
              as_user_id: "${acct_id}"
              captures: { app_order: $.data.id }
            - call: "GET /stands/${stand_id}"
              payload: {}
              as: LoyaltyCustomer
