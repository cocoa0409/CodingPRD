scaffold_corner_design:
- section: entities
  instances:
  - name: create_crop_applies_defaults_and_system_fields
    claim_type: creation
    grounds:
    - entities.Crop
    - endpoints."POST /farm/crops"
    distinguishing_aspect: 'A well-formed create returns 201 with system defaults: crop_status == ACTIVE, version == 1, server-minted id, created_at present.'
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /farm/crops
        payload:
          crop_code: KALE-01
          display_name: Kale
          category: LEAFY_GREEN
          margin_cents_per_lb: 300
          floor_price_cents_per_lb: 100
        as: FarmManager
        captures:
          c_id: $.data.id
          c_status: $.data.crop_status
          c_v: $.data.version
      assert:
      - http 201; Crop.crop_status == ACTIVE (system default, not client-set)
      - Crop.version == 1 and id is a server-minted UUID (client supplied none)
      - created_at equals the logical clock default 2026-08-01T00:00:00Z (clock never set)
  - name: create_crop_missing_required_field_rejected
    claim_type: required_fields
    grounds:
    - entities.Crop.fields.margin_cents_per_lb
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting the required input field margin_cents_per_lb yields ERR_INVALID_REQUEST (400); the entity is not created.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /farm/crops
        payload:
          crop_code: KALE-01
          display_name: Kale
          category: LEAFY_GREEN
          floor_price_cents_per_lb: 100
        as: FarmManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST (400); GET /farm/crops afterwards returns total_count 0
  - name: create_crop_invalid_enum_rejected
    claim_type: type_constraints
    grounds:
    - entities.Crop.fields.category
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: category must be one of LEAFY_GREEN | HERB | FRUITING; 'TREE' is rejected.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /farm/crops
        payload:
          crop_code: OAK-01
          display_name: Oak
          category: TREE
          margin_cents_per_lb: 300
          floor_price_cents_per_lb: 100
        as: FarmManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST (400)
  - name: create_crop_duplicate_code_rejected
    claim_type: type_constraints
    grounds:
    - entities.Crop.fields.crop_code
    - errors[ERR_DUPLICATE_CODE]
    distinguishing_aspect: crop_code uniqueness is enforced across crops; the second create with the same code fails.
    test_recipe:
      setup:
      - Crop KALE-01 exists
      setup_api_calls:
      - call: POST /farm/crops
        payload:
          crop_code: KALE-01
          display_name: Kale
          category: LEAFY_GREEN
          margin_cents_per_lb: 300
          floor_price_cents_per_lb: 100
        as: FarmManager
      trigger:
      - call: POST /farm/crops
        payload:
          crop_code: KALE-01
          display_name: Kale Again
          category: HERB
          margin_cents_per_lb: 400
          floor_price_cents_per_lb: 90
        as: FarmManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_DUPLICATE_CODE (422)
  - name: get_crop_not_found_returns_404
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    - endpoints."GET /farm/crops/{id}"
    distinguishing_aspect: A well-formed but unknown UUID in the path yields ERR_NOT_FOUND (404), not a validation error.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: GET /farm/crops/00000000-0000-4000-8000-000000000000
        as: FarmManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_FOUND (404)
  - name: system_fields_input_ignored_on_create
    claim_type: system_fields
    grounds:
    - entities.Crop
    - response_envelope
    distinguishing_aspect: 'Client-supplied crop_status/version/id in the create body are ignored: the created crop is ACTIVE with version 1 and a server id.'
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /farm/crops
        payload:
          crop_code: KALE-01
          display_name: Kale
          category: LEAFY_GREEN
          margin_cents_per_lb: 300
          floor_price_cents_per_lb: 100
          crop_status: RETIRED
          version: 9
          id: 11111111-1111-4111-8111-111111111111
        as: FarmManager
        captures:
          c_id: $.data.id
          c_status: $.data.crop_status
          c_v: $.data.version
      assert:
      - crop_status == ACTIVE and version == 1 (system inputs ignored)
      - id != 11111111-1111-4111-8111-111111111111 (server minted)
  - name: rack_creation_autocreates_towers_with_indices
    claim_type: creation
    grounds:
    - entities.Rack
    - entities.Tower
    - endpoints."POST /farm/racks"
    - endpoints."GET /farm/racks/{id}/towers"
    distinguishing_aspect: 'Rack creation is the only Tower producer: tower_count 3 yields exactly towers with tower_index 1, 2, 3, all IDLE, all FK-linked to the rack.'
    test_recipe:
      setup:
      - Water loop WL-A exists
      setup_api_calls:
      - call: POST /farm/water-loops
        payload:
          loop_code: WL-A
        as: FarmManager
        captures:
          wl_a: $.data.id
      trigger:
      - call: POST /farm/racks
        payload:
          rack_code: R-01
          water_loop_id: ${wl_a}
          zone: Z1
          tower_count: 3
        as: FarmManager
        captures:
          rk: $.data.id
      - call: GET /farm/racks/${rk}/towers
        as: FarmManager
        captures:
          t0_idx: $.data[0].tower_index
          t2_idx: $.data[2].tower_index
          t0_status: $.data[0].tower_status
          t0_rack: $.data[0].rack_id
      assert:
      - exactly 3 towers returned; tower_index values are 1, 2, 3 (first 1, last 3)
      - every tower tower_status == IDLE and rack_id == ${rk}
  - name: energy_reading_immutable_entity_has_no_version
    claim_type: immutability
    grounds:
    - entities.EnergyMeterReading
    - endpoints."POST /farm/energy-readings"
    distinguishing_aspect: 'EnergyMeterReading is append-only (common_fields false): the response carries id and created_at but NO version or updated_at, and no update/delete endpoint exists for it.'
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /farm/energy-readings
        payload:
          scope_type: FACILITY
          period_start_at: '2026-08-03T00:00:00Z'
          period_end_at: '2026-08-24T00:00:00Z'
          kwh_consumed: 40000.0
          peak_demand_kw: 480.0
        as: FarmManager
        captures:
          r_id: $.data.id
      assert:
      - http 201; response data has id and created_at
      - 'response data has NO ''version'' and NO ''updated_at'' key (common_fields: false)'
  - name: crop_list_pagination_envelope
    claim_type: listing
    grounds:
    - response_envelope
    - endpoints."GET /farm/crops"
    distinguishing_aspect: 'List responses carry the fixed pagination contract: limit/offset honored, total_count and has_more correct at the boundary (2 items, limit 1).'
    test_recipe:
      setup:
      - Two crops exist
      setup_api_calls:
      - call: POST /farm/crops
        payload:
          crop_code: KALE-01
          display_name: Kale
          category: LEAFY_GREEN
          margin_cents_per_lb: 300
          floor_price_cents_per_lb: 100
        as: FarmManager
      - call: POST /farm/crops
        payload:
          crop_code: BASIL-01
          display_name: Basil
          category: HERB
          margin_cents_per_lb: 500
          floor_price_cents_per_lb: 200
        as: FarmManager
      trigger:
      - call: GET /farm/crops
        payload:
          limit: 1
          offset: 0
        as: FarmManager
      assert:
      - 'data array length == 1; envelope pagination: total_count == 2, has_more == true'
      - a second call with limit 1 offset 1 returns the other crop and has_more == false
  - name: crop_filter_by_enum_listing
    claim_type: listing
    grounds:
    - endpoints."GET /farm/crops"
    distinguishing_aspect: 'The crop_status filter narrows the list: after retiring one of two crops, crop_status=RETIRED returns exactly it.'
    test_recipe:
      setup:
      - Crops KALE-01 (retired) and BASIL-01 (active) exist
      setup_api_calls:
      - call: POST /farm/crops
        payload:
          crop_code: KALE-01
          display_name: Kale
          category: LEAFY_GREEN
          margin_cents_per_lb: 300
          floor_price_cents_per_lb: 100
        as: FarmManager
        captures:
          c_kale: $.data.id
      - call: POST /farm/crops
        payload:
          crop_code: BASIL-01
          display_name: Basil
          category: HERB
          margin_cents_per_lb: 500
          floor_price_cents_per_lb: 200
        as: FarmManager
      - call: POST /farm/crops/${c_kale}/retire
        as: FarmManager
      trigger:
      - call: GET /farm/crops
        payload:
          crop_status: RETIRED
        as: FarmManager
        captures:
          first_code: $.data[0].crop_code
      assert:
      - exactly one row returned; crop_code == KALE-01; envelope total_count == 1
- section: state_machines
  instances:
  - name: batch_seed_twice_rejected
    claim_type: idempotency
    grounds:
    - state_machines.GrowBatch
    - errors[ERR_INVALID_STATE_TRANSITION]
    distinguishing_aspect: Repeating the seed trigger against a SEEDED batch is a hard 409, not a silent no-op — same-trigger-twice is an invalid transition.
    test_recipe:
      setup:
      - Batch PLANNED on one tower of R-01 (WL-A), crop KALE-01 with ACTIVE recipe
      setup_api_calls:
      - call: POST /farm/crops
        payload:
          crop_code: KALE-01
          display_name: Kale
          category: LEAFY_GREEN
          margin_cents_per_lb: 300
          floor_price_cents_per_lb: 100
        as: FarmManager
        captures:
          c_kale: $.data.id
          c_kale_v: $.data.version
      - call: POST /farm/recipes
        payload:
          crop_id: ${c_kale}
          light_hours_per_day: 16
          light_ppfd_umol: 600
          ec_target_ms: 1.8
          ph_target: 5.8
          temp_day_c: 22
          temp_night_c: 18
          humidity_pct: 65
          co2_ppm: 900
          days_to_harvest: 21
          expected_yield_lb_per_tower: 12.5
        as: Grower
        captures:
          r_kale: $.data.id
      - call: POST /farm/recipes/${r_kale}/activate
        payload:
          expected_crop_version: ${c_kale_v}
        as: Grower
      - call: POST /farm/water-loops
        payload:
          loop_code: WL-A
        as: FarmManager
        captures:
          wl_a: $.data.id
      - call: POST /farm/racks
        payload:
          rack_code: R-01
          water_loop_id: ${wl_a}
          zone: Z1
          tower_count: 1
        as: FarmManager
        captures:
          rk_1: $.data.id
      - call: GET /farm/racks/${rk_1}/towers
        as: FarmManager
        captures:
          t1: $.data[0].id
      - call: POST /farm/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T06:00:00Z'
        as: FarmManager
      - call: POST /farm/batches
        payload:
          crop_id: ${c_kale}
          tower_ids:
          - ${t1}
        as: Grower
        captures:
          b1: $.data.id
      - call: POST /farm/batches/${b1}/seed
        as: Grower
      trigger:
      - call: POST /farm/batches/${b1}/seed
        as: Grower
        captures:
          err: $.data.error_id
      assert:
      - second seed -> error_id == ERR_INVALID_STATE_TRANSITION (409); batch remains SEEDED
  - name: harvest_from_terminal_failed_rejected
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.GrowBatch
    distinguishing_aspect: 'FAILED is terminal: every further production trigger (harvest shown) is rejected and no side effects fire.'
    test_recipe:
      setup:
      - Batch FAILED (cause EQUIPMENT) after seeding on one tower
      setup_api_calls:
      - call: POST /farm/crops
        payload:
          crop_code: KALE-01
          display_name: Kale
          category: LEAFY_GREEN
          margin_cents_per_lb: 300
          floor_price_cents_per_lb: 100
        as: FarmManager
        captures:
          c_kale: $.data.id
          c_kale_v: $.data.version
      - call: POST /farm/recipes
        payload:
          crop_id: ${c_kale}
          light_hours_per_day: 16
          light_ppfd_umol: 600
          ec_target_ms: 1.8
          ph_target: 5.8
          temp_day_c: 22
          temp_night_c: 18
          humidity_pct: 65
          co2_ppm: 900
          days_to_harvest: 21
          expected_yield_lb_per_tower: 12.5
        as: Grower
        captures:
          r_kale: $.data.id
      - call: POST /farm/recipes/${r_kale}/activate
        payload:
          expected_crop_version: ${c_kale_v}
        as: Grower
      - call: POST /farm/water-loops
        payload:
          loop_code: WL-A
        as: FarmManager
        captures:
          wl_a: $.data.id
      - call: POST /farm/racks
        payload:
          rack_code: R-01
          water_loop_id: ${wl_a}
          zone: Z1
          tower_count: 1
        as: FarmManager
        captures:
          rk_1: $.data.id
      - call: GET /farm/racks/${rk_1}/towers
        as: FarmManager
        captures:
          t1: $.data[0].id
      - call: POST /farm/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T06:00:00Z'
        as: FarmManager
      - call: POST /farm/batches
        payload:
          crop_id: ${c_kale}
          tower_ids:
          - ${t1}
        as: Grower
        captures:
          b1: $.data.id
      - call: POST /farm/batches/${b1}/seed
        as: Grower
      - call: POST /farm/batches/${b1}/fail
        payload:
          cause_category: EQUIPMENT
        as: Grower
      trigger:
      - call: POST /farm/batches/${b1}/harvest
        payload:
          grade_a_lb: 10.0
          grade_b_lb: 0.0
          cull_lb: 0.0
        as: Grower
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE_TRANSITION (409)
      - batch stays FAILED; no harvest fields written (harvested_at remains null)
  - name: recipe_activate_from_retired_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.GrowRecipe
    distinguishing_aspect: 'RETIRED is terminal for recipes: a DRAFT recipe retired while unused cannot be activated later.'
    test_recipe:
      setup:
      - Crop KALE-01; recipe R1 DRAFT then retired (no batches reference it)
      setup_api_calls:
      - call: POST /farm/crops
        payload:
          crop_code: KALE-01
          display_name: Kale
          category: LEAFY_GREEN
          margin_cents_per_lb: 300
          floor_price_cents_per_lb: 100
        as: FarmManager
        captures:
          c_kale: $.data.id
          c_kale_v: $.data.version
      - call: POST /farm/recipes
        payload:
          crop_id: ${c_kale}
          light_hours_per_day: 16
          light_ppfd_umol: 600
          ec_target_ms: 1.8
          ph_target: 5.8
          temp_day_c: 22
          temp_night_c: 18
          humidity_pct: 65
          co2_ppm: 900
          days_to_harvest: 21
          expected_yield_lb_per_tower: 12.5
        as: Grower
        captures:
          r1: $.data.id
      - call: POST /farm/recipes/${r1}/retire
        as: Grower
      trigger:
      - call: POST /farm/recipes/${r1}/activate
        payload:
          expected_crop_version: ${c_kale_v}
        as: Grower
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE_TRANSITION (409); recipe stays RETIRED
  - name: sanitation_record_result_before_start_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.SanitationCycle
    distinguishing_aspect: record-result is only valid from IN_PROGRESS; calling it on a SCHEDULED cycle is a 409.
    test_recipe:
      setup:
      - Loop WL-A; cycle CY1 SCHEDULED [2026-08-10T08:00, 2026-08-10T10:00]
      setup_api_calls:
      - call: POST /farm/water-loops
        payload:
          loop_code: WL-A
        as: FarmManager
        captures:
          wl_a: $.data.id
      - call: POST /farm/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-08T00:00:00Z'
        as: FarmManager
      - call: POST /farm/sanitation-cycles
        payload:
          water_loop_id: ${wl_a}
          scheduled_start_at: '2026-08-10T08:00:00Z'
          scheduled_end_at: '2026-08-10T10:00:00Z'
        as: SanitationLead
        captures:
          cy1: $.data.id
      trigger:
      - call: POST /farm/sanitation-cycles/${cy1}/record-result
        payload:
          result: PASSED
          coliform_cfu: 0
        as: SanitationLead
        as_user_id: san-1
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE_TRANSITION (409); cycle stays SCHEDULED; loop posture unchanged (IN_SERVICE)
  - name: shipment_ship_twice_rejected
    claim_type: idempotency
    grounds:
    - state_machines.Shipment
    distinguishing_aspect: 'SHIPPED is terminal: a second ship call on the same shipment is rejected, and invoice_total_cents does not change.'
    test_recipe:
      setup:
      - Batch packed 46.00 lb and RELEASED on 2026-08-24 (sanitation PASS 2026-08-22T03:30:00Z); contract CT1; shipment S1 PACKED (line 10.00 lb); clock inside window
      setup_api_calls:
      - call: POST /farm/crops
        payload:
          crop_code: KALE-01
          display_name: Kale
          category: LEAFY_GREEN
          margin_cents_per_lb: 300
          floor_price_cents_per_lb: 100
        as: FarmManager
        captures:
          c_kale: $.data.id
          c_kale_v: $.data.version
      - call: POST /farm/recipes
        payload:
          crop_id: ${c_kale}
          light_hours_per_day: 16
          light_ppfd_umol: 600
          ec_target_ms: 1.8
          ph_target: 5.8
          temp_day_c: 22
          temp_night_c: 18
          humidity_pct: 65
          co2_ppm: 900
          days_to_harvest: 21
          expected_yield_lb_per_tower: 12.5
        as: Grower
        captures:
          r_kale: $.data.id
      - call: POST /farm/recipes/${r_kale}/activate
        payload:
          expected_crop_version: ${c_kale_v}
        as: Grower
      - call: POST /farm/water-loops
        payload:
          loop_code: WL-A
        as: FarmManager
        captures:
          wl_a: $.data.id
      - call: POST /farm/racks
        payload:
          rack_code: R-01
          water_loop_id: ${wl_a}
          zone: Z1
          tower_count: 4
        as: FarmManager
        captures:
          rk_1: $.data.id
      - call: GET /farm/racks/${rk_1}/towers
        as: FarmManager
        captures:
          t1: $.data[0].id
          t2: $.data[1].id
          t3: $.data[2].id
          t4: $.data[3].id
      - call: POST /farm/sanitation-cycles
        payload:
          water_loop_id: ${wl_a}
          scheduled_start_at: '2026-08-22T01:00:00Z'
          scheduled_end_at: '2026-08-22T03:00:00Z'
        as: SanitationLead
        captures:
          cy1: $.data.id
      - call: POST /farm/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T06:00:00Z'
        as: FarmManager
      - call: POST /farm/batches
        payload:
          crop_id: ${c_kale}
          tower_ids:
          - ${t1}
          - ${t2}
          - ${t3}
          - ${t4}
        as: Grower
        captures:
          b1: $.data.id
      - call: POST /farm/batches/${b1}/seed
        as: Grower
      - call: POST /farm/batches/${b1}/germination-check
        payload:
          germination_rate_pct: 96.0
        as: Grower
      - call: POST /farm/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-22T01:00:00Z'
        as: FarmManager
      - call: POST /farm/sanitation-cycles/${cy1}/start
        as: SanitationLead
      - call: POST /farm/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-22T03:30:00Z'
        as: FarmManager
      - call: POST /farm/sanitation-cycles/${cy1}/record-result
        payload:
          result: PASSED
          coliform_cfu: 0
        as: SanitationLead
        as_user_id: san-1
      - call: POST /farm/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-22T06:00:00Z'
        as: FarmManager
      - call: POST /farm/batches/${b1}/mark-harvest-ready
        as: Grower
      - call: POST /farm/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-24T06:30:00Z'
        as: FarmManager
      - call: POST /farm/batches/${b1}/harvest
        payload:
          grade_a_lb: 46.0
          grade_b_lb: 0.0
          cull_lb: 0.0
        as: Grower
        as_user_id: grower-7
      - call: POST /farm/batches/${b1}/safety-release
        payload:
          decision: RELEASED
          lab_ref: LAB-C1
        as: QualityAssurance
        as_user_id: qa-1
      - call: POST /farm/batches/${b1}/pack
        payload:
          packed_lb: 46.0
        as: Grower
      - call: POST /farm/contracts
        payload:
          retailer_name: FreshMart
          crop_id: ${c_kale}
          weekly_commitment_lb: 500
          price_per_pound_cents: 245
          penalty_cents_per_short_lb: 150
          fill_rate_threshold: 0.98
          week_start_day: MONDAY
          start_date: '2026-08-24'
          end_date: '2026-09-20'
        as: ContractsManager
        captures:
          ct1: $.data.id
          ct1_v: $.data.version
      - call: POST /farm/shipments
        payload:
          contract_id: ${ct1}
          ship_date: '2026-08-24'
          window_start_at: '2026-08-24T08:00:00Z'
          window_end_at: '2026-08-24T20:00:00Z'
          expected_contract_version: ${ct1_v}
          lines:
          - batch_id: ${b1}
            reserved_lb: 10.0
        as: ContractsManager
        captures:
          s1: $.data.id
      - call: GET /farm/shipments/${s1}/lines
        as: ContractsManager
