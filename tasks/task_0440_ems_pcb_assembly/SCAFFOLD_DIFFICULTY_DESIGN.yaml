scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: work_order_planned_vs_consumed_material_cost
        grounds:
          - calculations.work_order_material_cost
          - state_machines.WorkOrder.SETUP_to_RUNNING
          - entities.WorkOrder.fields.material_cost_cents
          - entities.InventoryLot.fields.unit_cost_cents
        distinguishing_aspect: |
          On the WorkOrder entity domain, the planned_standard_cost variant
          (Part.standard_cost_cents * required_qty = 50*4 = 200) diverges from the
          consumed_actual_cost variant (FIFO lot.unit_cost_cents per draw = 4*40 =
          160) for identical kitting inputs because the consumed lot's unit cost
          differs from the part's standard cost.
        test_recipe:
          setup:
            - "Part P (std cost 50), one APPROVED AvlEntry, one AVAILABLE RoHS+CMRT lot of qty 100 at unit_cost 40."
            - "RELEASED BOM with one non-DNP line: part P, designators [R1,R2], qty_per_assembly 2."
            - "WorkOrder planned_qty 2 kitted (required 4) then started (consumed 4 from the lot)."
          setup_api_calls:
            - call: "POST /parts"
              payload: { internal_pn: "P-100", description: "10k 0402 res", package_type: "0402", standard_cost_cents: 50, is_rohs_required: true, contains_conflict_minerals: false }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { part_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Acme Distribution", cage_code: "1ABC2", is_rohs_certified: true }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /avl-entries"
              payload: { part_id: "${part_id}", vendor_id: "${vendor_id}", vendor_pn: "ACM-RES-10K", approval_rank: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { avl_id: $.data.id, avl_v: $.data.version }
            - call: "POST /avl-entries/${avl_id}/receive-lot"
              payload: { lot_code: "LOT-A", received_qty: 100, unit_cost_cents: 40, is_rohs_compliant: true, has_cmrt: true, received_at: "2026-01-02T00:00:00.000Z", expected_avl_entry_version: "${avl_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { lot_id: $.data.id }
            - call: "POST /boms"
              payload: { product_code: "BRD-1", revision: "A" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { bom_id: $.data.id }
            - call: "POST /boms/${bom_id}/lines"
              payload: { part_id: "${part_id}", ref_designators: ["R1","R2"], qty_per_assembly: 2, is_dnp: false }
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /boms/${bom_id}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /work-orders"
              payload: { bom_id: "${bom_id}", planned_qty: 2 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/kit"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
          trigger:
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { wo_cost: $.data.material_cost_cents }
          assert:
            - "WorkOrder.${wo_id}.material_cost_cents == 160"
            - "WorkOrder.${wo_id}.material_cost_cents != 200"
            - "InventoryLot.${lot_id}.remaining_qty == 96"

      - name: rma_warranty_credit_vs_rework_surcharge_cost
        grounds:
          - calculations.rma_warranty_credit
          - calculations.rework_material_cost
          - entities.Rma.fields.warranty_credit_cents
          - entities.ReworkOrder.fields.added_material_cost_cents
        distinguishing_aspect: |
          The dual-variant logic spans two different entity domains: warranty
          crediting on the Rma (weighted_scoring: unit_build_cost * credit_factor)
          and material costing on the ReworkOrder (tiered_pricing: base + tiered
          handling surcharge). For a returned reworked unit the COMPONENT-class
          credit (60% of unit_build_cost) is computed entirely independently of the
          rework's tiered surcharge, proving dual-variant behavior on more than one
          subject.
        test_recipe:
          setup:
            - "A SHIPPED unit on a CLOSED WorkOrder whose material_cost_cents=200, built_qty=2 (unit_build_cost=100)."
            - "An RMA opened for that unit and triaged COMPONENT."
          setup_api_calls:
            - call: "POST /parts"
              payload: { internal_pn: "P-200", description: "cap", package_type: "0603", standard_cost_cents: 50, is_rohs_required: true, contains_conflict_minerals: false }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { part_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Vendor B", cage_code: "2BCD3", is_rohs_certified: true }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /avl-entries"
              payload: { part_id: "${part_id}", vendor_id: "${vendor_id}", vendor_pn: "VB-CAP", approval_rank: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { avl_id: $.data.id, avl_v: $.data.version }
            - call: "POST /avl-entries/${avl_id}/receive-lot"
              payload: { lot_code: "LOT-B", received_qty: 100, unit_cost_cents: 50, is_rohs_compliant: true, has_cmrt: true, received_at: "2026-01-02T00:00:00.000Z", expected_avl_entry_version: "${avl_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /boms"
              payload: { product_code: "BRD-2", revision: "A" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { bom_id: $.data.id }
            - call: "POST /boms/${bom_id}/lines"
              payload: { part_id: "${part_id}", ref_designators: ["C1","C2"], qty_per_assembly: 2 }
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /boms/${bom_id}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /line-programs"
              payload: { bom_id: "${bom_id}", line_code: "LINE-A", feeder_slot_count: 8, program_checksum: "CK1" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { prog_id: $.data.id }
            - call: "POST /line-programs/${prog_id}/verify"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /work-orders"
              payload: { bom_id: "${bom_id}", planned_qty: 2 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/kit"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/setup"
              payload: { line_program_id: "${prog_id}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/units"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { unit1_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/units"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { unit2_id: $.data.id }
            - call: "POST /units/${unit1_id}/test-result"
              payload: { result: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /units/${unit2_id}/test-result"
              payload: { result: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /work-orders/${wo_id}/finalize-test"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { wo_v_pre_ship: $.data.version }
            - call: "POST /work-orders/${wo_id}/ship"
              payload: { expected_work_order_version: "${wo_v_pre_ship}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /rmas"
              payload: { unit_id: "${unit1_id}", reported_defect_code: "FIELD-OPEN" }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { rma_id: $.data.id }
          trigger:
            - call: "POST /rmas/${rma_id}/triage"
              payload: { failure_class: "COMPONENT" }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { credit: $.data.warranty_credit_cents }
          assert:
            - "Rma.${rma_id}.warranty_credit_cents == 60"
            - "Rma.${rma_id}.status == TRIAGED"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rework_cost_tiered_handling_surcharge_mode_a
        grounds:
          - calculations.rework_material_cost
          - state_machines.ReworkOrder.OPEN_to_CLOSED
          - entities.ReworkOrder.fields.added_material_cost_cents
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula — base_part_cost (qty*unit_cost),
          tier selection (3 conditional branches on base), and tiered rate
          (flat/0.20/0.30) interact non-linearly. base=25000 selects HIGH_RATE 0.30
          -> surcharge 7500 -> added_material_cost_cents 32500, which a flat or
          mid-rate reading would not produce.
        test_recipe:
          setup:
            - "A FAILED unit on an AT_TEST WorkOrder; a replacement part with an AVAILABLE lot of qty 100 at unit_cost 2500 (RoHS+CMRT)."
          setup_api_calls:
            - call: "POST /parts"
              payload: { internal_pn: "P-BGA", description: "BGA replacement", package_type: "BGA", standard_cost_cents: 2500, is_rohs_required: true, contains_conflict_minerals: false }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { part_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Vendor C", cage_code: "3CDE4", is_rohs_certified: true }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /avl-entries"
              payload: { part_id: "${part_id}", vendor_id: "${vendor_id}", vendor_pn: "VC-BGA", approval_rank: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { avl_id: $.data.id, avl_v: $.data.version }
            - call: "POST /avl-entries/${avl_id}/receive-lot"
              payload: { lot_code: "LOT-C", received_qty: 100, unit_cost_cents: 2500, is_rohs_compliant: true, has_cmrt: true, received_at: "2026-01-02T00:00:00.000Z", expected_avl_entry_version: "${avl_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /boms"
              payload: { product_code: "BRD-3", revision: "A" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { bom_id: $.data.id }
            - call: "POST /boms/${bom_id}/lines"
              payload: { part_id: "${part_id}", ref_designators: ["U1"], qty_per_assembly: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /boms/${bom_id}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /line-programs"
              payload: { bom_id: "${bom_id}", line_code: "LINE-A", feeder_slot_count: 4, program_checksum: "CK3" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { prog_id: $.data.id }
            - call: "POST /line-programs/${prog_id}/verify"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /work-orders"
              payload: { bom_id: "${bom_id}", planned_qty: 1 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/kit"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/setup"
              payload: { line_program_id: "${prog_id}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/units"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/test-result"
              payload: { result: "FAIL", defect_code: "SOLDER-BRIDGE" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /rework-orders"
              payload: { unit_id: "${unit_id}", defect_code: "SOLDER-BRIDGE" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { rwo_id: $.data.id }
          trigger:
            - call: "POST /rework-orders/${rwo_id}/close"
              payload: { replacement_part_id: "${part_id}", replacement_qty: 10, acting_user_id: "pp-1" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { add_cost: $.data.added_material_cost_cents }
          assert:
            - "ReworkOrder.${rwo_id}.added_material_cost_cents == 32500"
            - "Unit.${unit_id}.quality_status == REWORKED"

      - name: material_cost_fifo_straddle_order_mode_b
        grounds:
          - calculations.work_order_material_cost
          - state_machines.WorkOrder.SETUP_to_RUNNING
          - entities.InventoryLot.fields.received_at
          - entities.WorkOrder.fields.material_cost_cents
        distinguishing_aspect: |
          Mode (b): nested ordering where the pinned FIFO sequence (received_at ASC,
          created_at ASC) determines the per-draw decomposition. Required 90 straddles
          lot1 (older, qty 50 @ 40) then lot2 (newer, qty 100 @ 60): pinned order
          gives 50*40 + 40*60 = 4400; the reverse order would give 50*60 + 40*40 =
          4600, so the result is order-defined.
        test_recipe:
          setup:
            - "Part P with two AVAILABLE lots: LOT-OLD received 2026-01-02 qty 50 cost 40; LOT-NEW received 2026-01-05 qty 100 cost 60 (both RoHS+CMRT)."
            - "RELEASED BOM one line qty_per_assembly 3 [R1,R2,R3]; WorkOrder planned_qty 30 kitted (required 90) then started."
          setup_api_calls:
            - call: "POST /parts"
              payload: { internal_pn: "P-FIFO", description: "res", package_type: "0402", standard_cost_cents: 50, is_rohs_required: true, contains_conflict_minerals: false }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { part_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Vendor D", cage_code: "4DEF5", is_rohs_certified: true }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /avl-entries"
              payload: { part_id: "${part_id}", vendor_id: "${vendor_id}", vendor_pn: "VD-RES", approval_rank: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { avl_id: $.data.id, avl_v0: $.data.version }
            - call: "POST /avl-entries/${avl_id}/receive-lot"
              payload: { lot_code: "LOT-OLD", received_qty: 50, unit_cost_cents: 40, is_rohs_compliant: true, has_cmrt: true, received_at: "2026-01-02T00:00:00.000Z", expected_avl_entry_version: "${avl_v0}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { avl_v1: $.data.version }
            - call: "POST /avl-entries/${avl_id}/receive-lot"
              payload: { lot_code: "LOT-NEW", received_qty: 100, unit_cost_cents: 60, is_rohs_compliant: true, has_cmrt: true, received_at: "2026-01-05T00:00:00.000Z", expected_avl_entry_version: "${avl_v1}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { lot_new_id: $.data.id }
            - call: "POST /boms"
              payload: { product_code: "BRD-4", revision: "A" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { bom_id: $.data.id }
            - call: "POST /boms/${bom_id}/lines"
              payload: { part_id: "${part_id}", ref_designators: ["R1","R2","R3"], qty_per_assembly: 3 }
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /boms/${bom_id}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /work-orders"
              payload: { bom_id: "${bom_id}", planned_qty: 30 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/kit"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
          trigger:
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { wo_cost: $.data.material_cost_cents }
          assert:
            - "WorkOrder.${wo_id}.material_cost_cents == 4400"
            - "InventoryLot.${lot_new_id}.remaining_qty == 60"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: eco_reject_resubmit_cycle
        grounds:
          - state_machines.Eco.SUBMITTED_to_REJECTED
          - state_machines.Eco.REJECTED_to_SUBMITTED
          - state_machines.Eco.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          The Eco machine is cyclic: SUBMITTED->REJECTED->SUBMITTED->APPROVED. The
          same ECO returns to SUBMITTED after rejection and can then be approved,
          which a linear A->B->C pipeline cannot express.
        test_recipe:
          setup:
            - "A BOM and an ECO authored by pe-1, submitted then rejected."
          setup_api_calls:
            - call: "POST /boms"
              payload: { product_code: "BRD-5", revision: "A" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { bom_id: $.data.id }
            - call: "POST /ecos"
              payload: { title: "Swap cap value", bom_id: "${bom_id}", change_summary: "C5 10uF->22uF" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { eco_id: $.data.id }
            - call: "POST /ecos/${eco_id}/submit"
              payload: { acting_user_id: "pe-1" }
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /ecos/${eco_id}/reject"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
          trigger:
            - call: "POST /ecos/${eco_id}/submit"
              payload: { acting_user_id: "pe-1" }
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /ecos/${eco_id}/approve"
              payload: { acting_user_id: "qe-1" }
              as: QualityEngineer
              as_user_id: "qe-1"
          assert:
            - "Eco.${eco_id}.status == APPROVED"
            - "Eco.${eco_id}.approved_by_user_id == qe-1"

      - name: unit_parallel_quality_and_disposition_dimensions
        grounds:
          - state_machines.Unit.BUILT_to_FAIL
          - state_machines.Unit.FAIL_to_REWORKED
          - entities.Unit.fields.quality_status
          - entities.Unit.fields.disposition
        distinguishing_aspect: |
          On the Unit entity, quality_status (BUILT->FAIL->REWORKED) and disposition
          (IN_PROCESS->...) evolve as independent parallel dimensions on the same row:
          a unit can be quality_status REWORKED while disposition is still IN_PROCESS,
          a combined state no single linear axis captures.
        test_recipe:
          setup:
            - "A FAILED unit on an AT_TEST WorkOrder with a replacement lot available."
          setup_api_calls:
            - call: "POST /parts"
              payload: { internal_pn: "P-PAR", description: "ic", package_type: "QFN", standard_cost_cents: 100, is_rohs_required: false, contains_conflict_minerals: false }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { part_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Vendor E", cage_code: "5EFG6" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /avl-entries"
              payload: { part_id: "${part_id}", vendor_id: "${vendor_id}", vendor_pn: "VE-IC", approval_rank: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { avl_id: $.data.id, avl_v: $.data.version }
            - call: "POST /avl-entries/${avl_id}/receive-lot"
              payload: { lot_code: "LOT-E", received_qty: 50, unit_cost_cents: 100, received_at: "2026-01-02T00:00:00.000Z", expected_avl_entry_version: "${avl_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /boms"
              payload: { product_code: "BRD-6", revision: "A" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { bom_id: $.data.id }
            - call: "POST /boms/${bom_id}/lines"
              payload: { part_id: "${part_id}", ref_designators: ["U1"], qty_per_assembly: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /boms/${bom_id}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /line-programs"
              payload: { bom_id: "${bom_id}", line_code: "LINE-B", feeder_slot_count: 4, program_checksum: "CK6" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { prog_id: $.data.id }
            - call: "POST /line-programs/${prog_id}/verify"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /work-orders"
              payload: { bom_id: "${bom_id}", planned_qty: 1 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/kit"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/setup"
              payload: { line_program_id: "${prog_id}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/units"
              payload: {}
              as: ProductionPlanner
