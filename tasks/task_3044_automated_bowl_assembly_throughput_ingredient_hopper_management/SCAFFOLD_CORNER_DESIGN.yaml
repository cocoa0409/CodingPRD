              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 500, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 300, expected_hopper_version: "${h1_v}" }
              as: LineOperator
            - call: "POST /api/prep-batches"
              payload: { restaurant_id: "${r1}", ingredient_id: "${ing}", quantity_grams: 1000 }
              as: PrepCook
              captures: { b1: $.data.id }
            - call: "POST /api/prep-batches/${b1}/mark-ready"
              payload: {}
              as: PrepCook
            - call: "POST /api/hoppers/${h1}/sensor-reading"
              payload: { grams_reading: 150 }
              as: LineOperator
            - call: "GET /api/hoppers/${h1}/refill-tasks"
              payload: {}
              as: LineOperator
              captures: { t1: $.data.0.id }
