  # ===========================================================================
  - section: state_machines
    instances:
      - name: edition_advance_invalid_from_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.FestivalEdition"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Advance from SETUP directly to SCREENING is not a declared transition and is rejected."
        test_recipe:
          setup: ["Edition in SETUP"]
          setup_api_calls:
            - { call: "POST /festival/editions", payload: { year: 2027, host_country_code: "US", intake_open_at: "2026-08-01T00:00:00Z", early_deadline_at: "2026-08-15T00:00:00Z", regular_deadline_at: "2026-09-01T00:00:00Z", late_deadline_at: "2026-09-15T00:00:00Z", rsvp_window_days: 7, festival_start_at: "2027-01-21T00:00:00Z", festival_end_at: "2027-02-01T00:00:00Z", hotel_nights_pool: 10, travel_budget_cents: 400000, prize_pool_cents: 5000000 }, as: FESTIVAL_ADMIN, captures: { ed: $.data.id } }
          trigger:
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: SCREENING }, as: FESTIVAL_ADMIN, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (409); edition remains SETUP"

      - name: edition_open_requires_category_config
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.FestivalEdition.SETUP_to_INTAKE_OPEN"
          - "errors[ERR_NO_CATEGORY_CONFIG]"
        distinguishing_aspect: "SETUP -> INTAKE_OPEN requires at least one CategoryConfig; adding the config then advancing succeeds."
        test_recipe:
          setup: ["Edition in SETUP with no configs"]
          setup_api_calls:
            - { call: "POST /festival/editions", payload: { year: 2027, host_country_code: "US", intake_open_at: "2026-08-01T00:00:00Z", early_deadline_at: "2026-08-15T00:00:00Z", regular_deadline_at: "2026-09-01T00:00:00Z", late_deadline_at: "2026-09-15T00:00:00Z", rsvp_window_days: 7, festival_start_at: "2027-01-21T00:00:00Z", festival_end_at: "2027-02-01T00:00:00Z", hotel_nights_pool: 10, travel_budget_cents: 400000, prize_pool_cents: 5000000 }, as: FESTIVAL_ADMIN, captures: { ed: $.data.id } }
          trigger:
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: INTAKE_OPEN }, as: FESTIVAL_ADMIN, captures: { err: $.data.error_id } }
            - { call: "POST /festival/category-configs", payload: { edition_id: "${ed}", category: SHORT_FILM, min_runtime_minutes: 1, max_runtime_minutes: 40, premiere_requirement: NONE, completion_cutoff: "2025-01-01", early_fee_cents: 4000, regular_fee_cents: 5500, late_fee_cents: 7000 }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: INTAKE_OPEN }, as: FESTIVAL_ADMIN, captures: { st: $.data.status } }
          assert:
            - "first advance: err == ERR_NO_CATEGORY_CONFIG"
            - "after adding a config: st == INTAKE_OPEN"

      - name: terminal_lockdown_ineligible_submission
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.Submission"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "INELIGIBLE is terminal: further eligibility rulings, withdraw, and checkout all fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Edition INTAKE_OPEN; one paid submission ruled INELIGIBLE"]
          setup_api_calls:
            - { call: "POST /festival/editions", payload: { year: 2027, host_country_code: "US", intake_open_at: "2026-08-01T00:00:00Z", early_deadline_at: "2026-08-15T00:00:00Z", regular_deadline_at: "2026-09-01T00:00:00Z", late_deadline_at: "2026-09-15T00:00:00Z", rsvp_window_days: 7, festival_start_at: "2027-01-21T00:00:00Z", festival_end_at: "2027-02-01T00:00:00Z", hotel_nights_pool: 10, travel_budget_cents: 400000, prize_pool_cents: 5000000 }, as: FESTIVAL_ADMIN, captures: { ed: $.data.id } }
            - { call: "POST /festival/category-configs", payload: { edition_id: "${ed}", category: SHORT_FILM, min_runtime_minutes: 1, max_runtime_minutes: 40, premiere_requirement: NONE, completion_cutoff: "2025-01-01", early_fee_cents: 4000, regular_fee_cents: 5500, late_fee_cents: 7000, screener_count_required: 2 }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: INTAKE_OPEN }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/submitters", payload: { legal_name: "Ann Ash", email: "ann@example.com", country_of_residence: "US" }, as: PUBLIC, captures: { subm: $.data.id } }
            - { call: "POST /festival/submissions", payload: { edition_id: "${ed}", category: SHORT_FILM, title: "Terminal", runtime_minutes: 20, completion_date: "2025-06-01", premiere_status: NONE, production_company: "A Co", format: DCP_2K }, as: FILMMAKER, as_user_id: "${subm}", captures: { film: $.data.id } }
            - { call: "POST /festival/submissions/${film}/checkout", payload: {}, as: FILMMAKER, as_user_id: "${subm}", captures: { pay: $.data.id } }
            - { call: "POST /festival/_payments/simulate", payload: { fee_payment_id: "${pay}", outcome: SUCCEEDED }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/submissions/${film}/eligibility-decision", payload: { decision: INELIGIBLE, reason: "prior release" }, as: FESTIVAL_ADMIN }
          trigger:
            - { call: "POST /festival/submissions/${film}/eligibility-decision", payload: { decision: ELIGIBLE }, as: FESTIVAL_ADMIN, captures: { err1: $.data.error_id } }
            - { call: "POST /festival/submissions/${film}/withdraw", payload: {}, as: FILMMAKER, as_user_id: "${subm}", captures: { err2: $.data.error_id } }
            - { call: "POST /festival/submissions/${film}/checkout", payload: {}, as: FILMMAKER, as_user_id: "${subm}", captures: { err3: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_STATE (terminal lockdown on rulings)"
            - "err2 == ERR_INVALID_STATE (withdraw not offered from INELIGIBLE)"
            - "err3 == ERR_INVALID_STATE (checkout requires DRAFT)"

