  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dispense_fill_inventory_lowstock_depth3
        grounds:
          - state_machines.FormulaDispense.REQUESTED_to_FILLED
          - entities.HerbItem.fields.on_hand_grams
          - entities.HerbItem.fields.stock_status
          - calculations.inventory_deduction
        distinguishing_aspect: |
          Depth-3 chain from the FILL trigger: fill snapshots grams (HOP-1) -> each HerbItem.on_hand_grams
          debited (HOP-2, caused by HOP-1) -> HerbItem crossing reorder_threshold auto-flips stock_status to
          LOW_STOCK (HOP-3, caused by HOP-2). Distinct trigger from the plan-cancel cascade.
        test_recipe:
          setup:
            - "Herb item H (initial 500g, reorder_threshold 400g). Formula F with one line H @ 120g/dose."
            - "Patient with finalized intake and ACTIVE plan; a REQUESTED dispense of 1 dose."
          setup_api_calls:
            - call: "POST /herb-items"
              payload: { herb_name: "Bai Shao", initial_grams: 500, reorder_threshold_grams: 400 }
              as: Pharmacist
              captures: { h_id: $.data.id }
            - call: "POST /formulas"
              payload: { formula_name: "Test Formula", line_items: [ { herb_item_id: "${h_id}", grams_per_dose: 120 } ] }
              as: Pharmacist
              captures: { f_id: $.data.id }
