# =============================================================================
# Shared Power Bank Operation System — Test Targeting Index (§1.8)
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine Difficulty Rules.
# Each instance is a single concrete test recipe whose distinguishing_aspect
# names the §0.5 differentiation and whose assert lines pin literal values.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: rental_billing_provisional_vs_final_with_cross_city
        grounds:
          - calculations.rental_billing
          - calculations.rental_billing.variants.provisional
          - calculations.rental_billing.variants.final
          - state_machines.Rental.rental_status.ACTIVE_to_RETURNED
          - entities.Rental.fields.charged_amount
          - entities.PricingPlan.fields.cross_city_surcharge
        distinguishing_aspect: |
          Dual variant lives on the Rental entity domain. Provisional uses end_time = clock.now()
          and never applies cross_city_surcharge. Final uses end_time = rental.returned_at AND
          applies cross_city_surcharge when the return cabinet's city_code differs from the start
          cabinet's. Same Rental row therefore has two distinguishable computed amounts.
        test_recipe:
          setup:
            - "POST /pricing-plans {city_code:'BJ', hourly_rate:3.00, daily_cap:30.00, free_minutes:5, cross_city_surcharge:10.00}"
            - "POST /pricing-plans {city_code:'SH', hourly_rate:4.00, daily_cap:40.00, free_minutes:5, cross_city_surcharge:10.00}"
            - "POST /location-partners {partner_code:'P1', name:'P1', revenue_share_pct:0.5}"
            - "POST /location-partners {partner_code:'P2', name:'P2', revenue_share_pct:0.5}"
            - "POST /cabinets {cabinet_code:'C1', city_code:'BJ', location_partner_id:P1.id, model:'SLOT_8', firmware_version:'v1'}"
            - "POST /cabinets {cabinet_code:'C2', city_code:'SH', location_partner_id:P2.id, model:'SLOT_8', firmware_version:'v1'}"
            - "POST /_clock/advance {to:'2026-01-01T10:00:00Z'}"
            - "POST /cabinets/{C1.id}/heartbeat {timestamp:'2026-01-01T10:00:00Z'}"
            - "POST /cabinets/{C2.id}/heartbeat {timestamp:'2026-01-01T10:00:00Z'}"
            - "POST /devices {device_code:'D1', model:'PB_5K', battery_level:80, current_cabinet_id:C1.id, current_slot_index:0}"
            - "POST /users {phone:'U1'}"
            - "POST /users/{U1.id}/deposit {amount:99.00}"
            - "POST /users/{U1.id}/wallet/topup {amount:100.00}"
            - "POST /rentals {cabinet_id:C1.id} as U1  (rented_at = 2026-01-01T10:00:00Z)"
          trigger:
            - "POST /_clock/advance {to:'2026-01-01T11:30:00Z'}  # 90 min elapsed"
            - "POST /cabinets/{C1.id}/heartbeat {timestamp:'2026-01-01T11:30:00Z'}"
            - "POST /cabinets/{C2.id}/heartbeat {timestamp:'2026-01-01T11:30:00Z'}"
            - "GET /rentals/{r1.id}  # provisional read"
            - "POST /_clock/advance {to:'2026-01-01T12:30:00Z'}  # 150 min elapsed"
            - "POST /cabinets/{C2.id}/heartbeat {timestamp:'2026-01-01T12:30:00Z'}"
            - "POST /rentals/{r1.id}/return {return_cabinet_id:C2.id}  # final at SH"
          assert:
            - "GET response at 11:30: data.provisional_amount == 6.00  (90 min total → 85 billable_minutes → ceil(85/60)=2 billable_hours → min(2*3.00, 30.00)=6.00; cross_city_surcharge NOT applied on provisional)"
            - "GET response at 11:30: data.rental_status == 'ACTIVE'"
            - "GET response at 11:30: data.payment_status == 'PENDING'"
            - "Return response: data.charged_amount == 19.00  (150 min total → 145 billable_minutes → ceil(145/60)=3 billable_hours → min(3*3.00, 30.00)=9.00; PLUS cross_city_surcharge 10.00 because BJ≠SH; 9.00+10.00=19.00)"
            - "Return response: data.rental_status == 'RETURNED'"
            - "Return response: data.payment_status == 'BILLED'"
            - "GET /users/{U1.id}: data.wallet_balance == 81.00  (100.00 - 19.00)"

      - name: revenue_share_provisional_vs_settled_with_refund_attribution
        grounds:
          - calculations.revenue_share_for_settlement
          - calculations.revenue_share_for_settlement.variants.provisional
          - calculations.revenue_share_for_settlement.variants.settled
          - state_machines.Settlement.DRAFT_to_APPROVED
          - state_machines.Settlement.APPROVED_to_INVOICED
          - state_machines.Rental.payment_status.BILLED_to_REFUNDED
          - entities.Settlement.fields.partner_amount
          - entities.Settlement.fields.refund_adjustment
        distinguishing_aspect: |
          Dual variant lives on the Settlement entity domain (different domain from Rental). Provisional
          (computed at POST /settlements) counts only payment_status==BILLED rentals and reports
          refund_adjustment=0. Settled (computed at POST /settlements/{id}/issue-invoice) additionally
          subtracts refund_adjustment, attributing partner-share refunds back. Same Settlement row therefore
          has two distinguishable computed partner_amount values.
        test_recipe:
          setup:
            - "POST /pricing-plans {city_code:'BJ', hourly_rate:3.00, daily_cap:30.00, free_minutes:5, cross_city_surcharge:10.00}"
            - "POST /location-partners {partner_code:'P1', name:'P1', revenue_share_pct:0.335}"
            - "POST /cabinets {cabinet_code:'C1', city_code:'BJ', location_partner_id:P1.id, model:'SLOT_8', firmware_version:'v1'}"
            - "POST /_clock/advance {to:'2026-01-01T00:00:00Z'}"
            - "POST /cabinets/{C1.id}/heartbeat {timestamp:'2026-01-01T00:00:00Z'}"
            - "POST /devices x3: D1(battery_level:80, slot 0), D2(battery_level:70, slot 1), D3(battery_level:60, slot 2)"
            - "POST /users x3: U1, U2, U3 each {phone}, deposit 99.00, wallet topup 100.00"
            - "Per user Ui (i=1..3): rent at 10:00, advance 1h, heartbeat refresh, return at C1 at 11:00 — yields rental ri with charged_amount==3.00, payment_status==BILLED  (60 min → 55 billable_minutes → 1 billable_hour → 3.00)"
          trigger:
            - "POST /settlements {location_partner_id:P1.id, period_start:'2026-01-01T00:00:00Z', period_end:'2026-01-02T00:00:00Z'}  # provisional"
            - "POST /rentals/{r1.id}/refund  # admin refunds rental r1; r1.refund_amount==3.00; payment_status→REFUNDED"
            - "POST /settlements/{s1.id}/approve"
            - "POST /settlements/{s1.id}/issue-invoice  # settled recompute"
          assert:
            - "After POST /settlements: data.partner_amount == 3.03  (per-rental: round(3.00*0.335,2)=1.01 each; sum=1.01*3=3.03)"
            - "After POST /settlements: data.refund_adjustment == 0.00"
            - "After POST /settlements: data.gross_revenue == 9.00"
            - "After POST /settlements: data.status == 'DRAFT'"
            - "After issue-invoice: data.partner_amount == 1.01  (BILLED-share sum 2*1.01=2.02 minus refund_adjustment 1.01 = 1.01)"
            - "After issue-invoice: data.refund_adjustment == 1.01  (round(3.00*0.335,2)=1.01)"
            - "After issue-invoice: data.gross_revenue == 6.00  (9.00 - 3.00)"
            - "After issue-invoice: data.status == 'INVOICED'"
            - "After issue-invoice: data.invoice_number is non-null"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: rental_billing_nested_min_ceil_with_cap_activation
        grounds:
          - calculations.rental_billing
          - entities.PricingPlan.fields.hourly_rate
          - entities.PricingPlan.fields.daily_cap
          - entities.PricingPlan.fields.free_minutes
        distinguishing_aspect: |
          Mode (a) — formula with 5 inputs (rented_at, end_time, hourly_rate, daily_cap, free_minutes)
          and non-linear interaction: ceil() on billable_minutes is wrapped by an outer min() against
          daily_cap. The test forces both non-linear operations to fire (ceil rounds 655 → 11 hours;
          min clamps 11*3.00=33.00 down to daily_cap=30.00).
        test_recipe:
          setup:
            - "POST /pricing-plans {city_code:'BJ', hourly_rate:3.00, daily_cap:30.00, free_minutes:5, cross_city_surcharge:10.00}"
            - "POST /location-partners P1 share_pct:0.5"
            - "POST /cabinets C1 (BJ, P1, SLOT_8)"
            - "POST /_clock/advance {to:'2026-01-01T10:00:00Z'}"
            - "POST /cabinets/{C1.id}/heartbeat at clock.now()"
            - "POST /devices D1 (battery 80, slot 0)"
            - "POST /users U1, deposit 99, wallet 100"
            - "POST /rentals as U1, cabinet C1 → rental r1 rented_at = 10:00"
          trigger:
            - "POST /_clock/advance {to:'2026-01-01T20:55:00Z'}  # 655 min elapsed"
            - "POST /cabinets/{C1.id}/heartbeat at clock.now()"
            - "GET /rentals/{r1.id}"
          assert:
            - "data.provisional_amount == 30.00  (655 min total → max(0, 655-5)=650 billable_minutes → ceil(650/60)=11 billable_hours → min(11*3.00, 30.00)=min(33.00, 30.00)=30.00; the ceil() rounds non-trivially AND the min() clamps non-trivially)"
            - "data.rental_status == 'ACTIVE'  (655 min < 24h, no overdue)"

      - name: revenue_share_round_per_rental_then_sum_order_pin
        grounds:
          - calculations.revenue_share_for_settlement
          - calculations.revenue_share_for_settlement.precision
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The scaffold pins per-rental round-then-sum.
          With 3 rentals at charged_amount=3.00 and partner share_pct=0.335, per-rental round yields
          1.01 each → sum 3.03; sum-then-round yields round(9.00*0.335,2)=round(3.015,2)=3.02. The two
          orders produce different cents, and the scaffold mandates 3.03 (not 3.02).
        test_recipe:
          setup:
            - "POST /pricing-plans BJ {hourly_rate:3.00, daily_cap:30.00, free_minutes:5, cross_city_surcharge:10.00}"
            - "POST /location-partners P1 {revenue_share_pct:0.335}"
            - "POST /cabinets C1 (BJ, P1)"
            - "Three users U1..U3 each rent for exactly 1h at C1, return at C1; each rental.charged_amount==3.00, payment_status==BILLED"
          trigger:
            - "POST /settlements {location_partner_id:P1.id, period_start, period_end covering all three rentals}"
          assert:
            - "data.partner_amount == 3.03  (per-rental rounding: round(Decimal('3.00')*Decimal('0.335'),2,ROUND_HALF_UP)=1.01; summed: 1.01*3=3.03; the alternative sum-then-round of 3.02 is forbidden)"
            - "data.gross_revenue == 9.00"
            - "data.refund_adjustment == 0.00"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: rental_parallel_status_dimensions
        grounds:
          - state_machines.Rental.rental_status
          - state_machines.Rental.payment_status
          - state_machines.Rental.payment_status.BILLED_to_REFUNDED
          - entities.Rental.fields.rental_status
          - entities.Rental.fields.payment_status
        distinguishing_aspect: |
          Parallel state dimensions on a single Rental row. rental_status evolves on its axis (ACTIVE →
          OVERDUE → RETURNED), while payment_status evolves independently on its axis (PENDING → BILLED →
          REFUNDED). After refund, rental_status is RETURNED while payment_status is REFUNDED — two
          independent terminal-ish positions on the SAME row that no linear A→B→C→D pipeline could
          capture.
        test_recipe:
          setup:
            - "POST /pricing-plans BJ"
            - "POST /location-partners P1, /cabinets C1, /devices D1 (battery 80, slot 0)"
            - "POST /_clock/advance {to:'2026-01-01T10:00:00Z'}; heartbeat C1"
            - "POST /users U1, deposit 99, wallet 100"
            - "POST /rentals as U1 cabinet C1 → r1: (rental_status='ACTIVE', payment_status='PENDING')"
          trigger:
            - "POST /_clock/advance {to:'2026-01-02T11:00:00Z'}  # 25h elapsed"
            - "POST /cabinets/{C1.id}/heartbeat at clock.now()"
            - "POST /_sweep/run {sweep_type:'overdue'}  # rental_status: ACTIVE → OVERDUE; payment_status STAYS PENDING"
            - "GET /rentals/{r1.id}  # observe parallel divergence"
            - "POST /rentals/{r1.id}/return {return_cabinet_id:C1.id}  # rental_status → RETURNED, payment_status → BILLED"
            - "POST /rentals/{r1.id}/refund  # rental_status STAYS RETURNED, payment_status → REFUNDED"
            - "GET /rentals/{r1.id}  # final observation"
          assert:
            - "After overdue sweep: r1.rental_status == 'OVERDUE' AND r1.payment_status == 'PENDING'  (axes diverged: rental advanced, payment did not)"
            - "After return: r1.rental_status == 'RETURNED' AND r1.payment_status == 'BILLED'  (both axes advanced together via bubble-up)"
            - "After refund: r1.rental_status == 'RETURNED' AND r1.payment_status == 'REFUNDED'  (rental axis stays put; payment axis advances independently)"

      - name: repair_ticket_in_progress_on_hold_cycle_iterates_twice
        grounds:
          - state_machines.RepairTicket.IN_PROGRESS_to_ON_HOLD
          - state_machines.RepairTicket.ON_HOLD_to_IN_PROGRESS
          - state_machines.RepairTicket.IN_PROGRESS_to_RESOLVED
        distinguishing_aspect: |
          Cycle ON_HOLD ↔ IN_PROGRESS on RepairTicket entity (different entity from Rental). The cycle
          can iterate any number of times before reaching RESOLVED. Iterating it twice in a single test
          shows it is genuinely cyclic, not a one-shot diversion.
        test_recipe:
          setup:
            - "POST /pricing-plans BJ; POST /location-partners P1; POST /cabinets C1; heartbeat"
            - "POST /devices D1 (battery 4, slot 0)  # below ABNORMAL_BATTERY threshold"
            - "POST /_sweep/run {sweep_type:'anomaly'}  # creates RepairTicket T1 (OPEN), cascades device→FAULTY, slot→FAULTY, OperatorTask"
          trigger:
            - "POST /repair-tickets/{T1.id}/assign as Operator  # OPEN → ASSIGNED"
            - "POST /repair-tickets/{T1.id}/hold  # ASSIGNED → IN_PROGRESS (auto) → ON_HOLD"
            - "POST /repair-tickets/{T1.id}/resume  # ON_HOLD → IN_PROGRESS  (cycle iter 1)"
            - "POST /repair-tickets/{T1.id}/hold  # IN_PROGRESS → ON_HOLD"
            - "POST /repair-tickets/{T1.id}/resume  # ON_HOLD → IN_PROGRESS  (cycle iter 2)"
            - "POST /repair-tickets/{T1.id}/resolve  # IN_PROGRESS → RESOLVED"
          assert:
            - "After first /hold: T1.status == 'ON_HOLD'"
            - "After first /resume: T1.status == 'IN_PROGRESS'"
            - "After second /hold: T1.status == 'ON_HOLD'  (returned to ON_HOLD — cycle is genuine)"
            - "After second /resume: T1.status == 'IN_PROGRESS'"
            - "After /resolve: T1.status == 'RESOLVED'"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: anomaly_sweep_to_operator_task_depth_4_chain
        grounds:
          - endpoints.POST_/_sweep/run
          - state_machines.Device.AVAILABLE_to_FAULTY
          - state_machines.Slot.OCCUPIED_to_FAULTY
          - entities.OperatorTask
          - calculations.operator_task_priority
        distinguishing_aspect: |
          Depth-4 transitive cascade originating from POST /_sweep/run sweep_type=anomaly. Each link
          is caused by the previous link, NOT by the original sweep action: (1) sweep creates
          RepairTicket; (2) ticket creation causes Device.status AVAILABLE→FAULTY (Device transition's
          trigger explicitly cites the ticket creation, not the sweep); (3) Device→FAULTY causes
          housing Slot.slot_status OCCUPIED→FAULTY (Slot transition's trigger explicitly cites the
          device transition); (4) Slot→FAULTY causes OperatorTask auto-creation. Triggering
          transition: POST /_sweep/run.
        test_recipe:
          setup:
            - "POST /pricing-plans BJ"
            - "POST /location-partners P1 share_pct:0.5"
            - "POST /cabinets C1 (BJ, P1, SLOT_8)"
            - "POST /_clock/advance {to:'2026-01-01T10:00:00Z'}; heartbeat C1"
            - "POST /devices D1 {battery_level:4, current_cabinet_id:C1.id, current_slot_index:0}  # below ABNORMAL_BATTERY threshold; D1.status=AVAILABLE"
          trigger:
            - "POST /_sweep/run {sweep_type:'anomaly'}"
          assert:
            - "Exactly one RepairTicket exists with target_type=='DEVICE', target_id==D1.id, source=='AUTO_ANOMALY', issue_code=='ABNORMAL_BATTERY', status=='OPEN'  (depth 1: ticket-creation as direct effect of sweep action)"
            - "GET /devices/{D1.id}: data.status == 'FAULTY'  (depth 2: caused by ticket creation, not by sweep)"
            - "GET /cabinets/{C1.id}: slots[0].slot_status == 'FAULTY'  (depth 3: caused by D1 transition)"
            - "Exactly one OperatorTask exists with cabinet_id==C1.id, task_type=='REPAIR_DISPATCH', linked_repair_ticket_id==<the ticket id from depth 1>, status=='PENDING'  (depth 4: caused by slot transition)"
            - "That OperatorTask's priority_score == 5  (calc operator_task_priority: low_battery_count=0 because D1 is now FAULTY not AVAILABLE; faulty_slot_count=1; offline_bonus=0; score = 10*0 + 5*1 + 0 = 5)"

      - name: ticket_resolve_repairs_slot_depth_3_chain
        grounds:
          - state_machines.RepairTicket.IN_PROGRESS_to_RESOLVED
          - state_machines.Device.FAULTY_to_AVAILABLE
          - state_machines.Slot.FAULTY_to_EMPTY
          - state_machines.Slot
        distinguishing_aspect: |
          Depth-3 transitive cascade originating from POST /repair-tickets/{id}/resolve — a DIFFERENT
          triggering transition than the sweep instance. (1) resolve transitions ticket IN_PROGRESS →
          RESOLVED; (2) ticket resolution causes Device.status FAULTY → AVAILABLE; (3) device returning
          to AVAILABLE while housed in slot causes Slot.slot_status FAULTY → OCCUPIED.
        test_recipe:
          setup:
            - "Run the full anomaly cascade above to leave: T1 in OPEN, D1 in FAULTY, slot 0 of C1 in FAULTY, OT1 in PENDING"
            - "POST /repair-tickets/{T1.id}/assign as Operator  # T1: OPEN → ASSIGNED"
          trigger:
            - "POST /repair-tickets/{T1.id}/resolve  # T1: ASSIGNED → IN_PROGRESS (auto) → RESOLVED"
          assert:
            - "GET /repair-tickets/{T1.id}: data.status == 'RESOLVED'  (depth 1: direct effect of resolve)"
            - "GET /devices/{D1.id}: data.status == 'AVAILABLE'  (depth 2: caused by ticket resolution)"
            - "GET /cabinets/{C1.id}: slots[0].slot_status == 'OCCUPIED'  (depth 3: caused by D1 returning to AVAILABLE; slot.device_id remained pointing at D1 throughout, so cascade resolves to OCCUPIED not EMPTY)"
            - "GET /cabinets/{C1.id}: slots[0].device_id == D1.id"

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_referential_on_borrow
        grounds:
          - validations[priority=6]    # ERR_DUPLICATE_RENTAL (state)
          - validations[priority=13]   # ERR_PRICING_NOT_CONFIGURED (business_referential)
          - errors.ERR_DUPLICATE_RENTAL
          - errors.ERR_PRICING_NOT_CONFIGURED
        distinguishing_aspect: |
          Category pair: state (priority 6) vs business_referential (priority 13). Both checks would
          fail simultaneously: the user has an ACTIVE rental (state failure) AND the target cabinet's
          city_code has no PricingPlan configured (business_referential failure). The scaffold pins
          state first; therefore ERR_DUPLICATE_RENTAL must be returned, NOT ERR_PRICING_NOT_CONFIGURED.
        test_recipe:
          setup:
            - "POST /pricing-plans {city_code:'BJ', hourly_rate:3.00, daily_cap:30.00, free_minutes:5, cross_city_surcharge:10.00}  # BJ plan exists"
            - "Note: deliberately do NOT create a SH PricingPlan"
            - "POST /location-partners P1 share_pct:0.5"
            - "POST /cabinets C1 (city_code:'BJ', P1, SLOT_8); POST /cabinets C2 (city_code:'SH', P1, SLOT_8)"
            - "POST /_clock/advance {to:'2026-01-01T10:00:00Z'}; heartbeats for C1 and C2"
            - "POST /devices D1 (battery 80, C1 slot 0); POST /devices D2 (battery 80, C2 slot 0)"
            - "POST /users U1; POST /users/{U1.id}/deposit {amount:99.00}; POST /users/{U1.id}/wallet/topup {amount:100.00}"
            - "POST /rentals as U1 cabinet C1 → r1 ACTIVE  (succeeds because BJ plan exists)"
          trigger:
            - "POST /rentals as U1 cabinet C2  # both ERR_DUPLICATE_RENTAL (r1 ACTIVE) AND ERR_PRICING_NOT_CONFIGURED (SH has no plan) would fail"
          assert:
            - "Response status: 409"
            - "Response body: data.error_id == 'ERR_DUPLICATE_RENTAL'  (state priority 6 wins over business_referential priority 13)"
            - "Response body: data.error_id != 'ERR_PRICING_NOT_CONFIGURED'"

      - name: business_safety_beats_business_constraint_on_borrow
        grounds:
          - validations[priority=8]    # ERR_CABINET_OFFLINE (business_safety)
          - validations[priority=10]   # ERR_NO_AVAILABLE_DEVICE (business_constraint)
          - errors.ERR_CABINET_OFFLINE
          - errors.ERR_NO_AVAILABLE_DEVICE
        distinguishing_aspect: |
          Category pair: business_safety (priority 8) vs business_constraint (priority 10). Both fail
          simultaneously; scaffold pins safety first; therefore ERR_CABINET_OFFLINE must be returned,
          NOT ERR_NO_AVAILABLE_DEVICE. Different category pair from instance 1.
        test_recipe:
          setup:
            - "POST /pricing-plans BJ; POST /location-partners P1; POST /cabinets C1 (model SLOT_8)"
            - "POST /_clock/advance {to:'2026-01-01T10:00:00Z'}"
            - "POST /cabinets/{C1.id}/heartbeat {timestamp:'2026-01-01T08:00:00Z'}  # 2h stale > HEARTBEAT_TIMEOUT_SECONDS=300; cabinet is OFFLINE"
            - "POST /devices D_low {battery_level:10, current_cabinet_id:C1.id, current_slot_index:0}  # below MIN_BORROW_BATTERY=50"
            - "POST /users U1, deposit 99, wallet 100"
          trigger:
            - "POST /rentals as U1 cabinet C1  # both ERR_CABINET_OFFLINE AND ERR_NO_AVAILABLE_DEVICE would fail"
          assert:
            - "Response status: 409"
            - "Response body: data.error_id == 'ERR_CABINET_OFFLINE'  (business_safety priority 8 wins over business_constraint priority 10)"
            - "Response body: data.error_id != 'ERR_NO_AVAILABLE_DEVICE'"

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary precision checks on different metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: free_minutes_inclusive_minute_boundary_on_get_rental
        grounds:
          - calculations.rental_billing
          - entities.PricingPlan.fields.free_minutes
          - endpoints.GET_/rentals/{id}
        distinguishing_aspect: |
          Metric: minutes. Endpoint: GET /rentals/{id} (provisional read). Pinned boundary:
          billable_minutes = max(0, total_minutes - free_minutes). At total_minutes==5 exactly,
          billable_minutes==0 (free); at total_minutes==6, billable_minutes==1, ceil(1/60)==1
          billable_hour, fee==3.00. The boundary is inclusive on the free side (≤free_minutes is free).
        test_recipe:
          setup:
            - "POST /pricing-plans BJ {hourly_rate:3.00, daily_cap:30.00, free_minutes:5}"
            - "POST /location-partners P1; POST /cabinets C1 (BJ); heartbeat C1"
            - "POST /devices D1 (battery 80, slot 0)"
            - "POST /users U1, deposit 99, wallet 100"
            - "POST /_clock/advance {to:'2026-01-01T10:00:00Z'}"
            - "POST /rentals as U1 cabinet C1 → r1 rented_at=10:00"
          trigger:
            - "POST /_clock/advance {to:'2026-01-01T10:05:00Z'}  # exactly 5 min"
            - "POST /cabinets/{C1.id}/heartbeat at clock.now()"
            - "GET /rentals/{r1.id}  # observation A — boundary just inclusive"
            - "POST /_clock/advance {to:'2026-01-01T10:06:00Z'}  # 6 min (1 min past boundary)"
            - "POST /cabinets/{C1.id}/heartbeat at clock.now()"
            - "GET /rentals/{r1.id}  # observation B — boundary just exceeded"
          assert:
            - "Observation A (5 min): data.provisional_amount == 0.00  (total_minutes=5, billable_minutes=max(0,5-5)=0, billable_hours=0, fee=min(0,30)=0.00)"
            - "Observation B (6 min): data.provisional_amount == 3.00  (total_minutes=6, billable_minutes=1, billable_hours=ceil(1/60)=1, fee=min(1*3.00,30)=3.00)"

      - name: lost_threshold_inclusive_hour_boundary_on_sweep
        grounds:
          - calculations.lost_conversion
          - state_machines.Rental.rental_status.OVERDUE_to_LOST
          - endpoints.POST_/_sweep/run
        distinguishing_aspect: |
          Metric: hours. Endpoint: POST /_sweep/run sweep_type=lost. Pinned boundary: rental_status
          flips to LOST when elapsed_hours >= 168 (inclusive). At 167h59m, still OVERDUE; at exactly
          168h, LOST. Different metric (hours) and different endpoint (sweep) than instance 1.
        test_recipe:
          setup:
            - "POST /pricing-plans BJ"
            - "POST /location-partners P1; POST /cabinets C1; heartbeat at 2026-01-01T00:00:00Z"
            - "POST /devices D1 (battery 80, slot 0)"
            - "POST /users U1, deposit 99, wallet 100"
            - "POST /_clock/advance {to:'2026-01-01T00:00:00Z'}"
            - "POST /rentals as U1 cabinet C1 → r1 rented_at=2026-01-01T00:00:00Z"
            - "POST /_clock/advance {to:'2026-01-02T01:00:00Z'}; heartbeat refresh"
            - "POST /_sweep/run {sweep_type:'overdue'}  # r1.rental_status: ACTIVE → OVERDUE"
          trigger:
            - "POST /_clock/advance {to:'2026-01-07T23:59:00Z'}  # 167h59m elapsed"
            - "POST /cabinets/{C1.id}/heartbeat at clock.now()"
            - "POST /_sweep/run {sweep_type:'lost'}  # observation A — just below threshold"
            - "GET /rentals/{r1.id}"
            - "POST /_clock/advance {to:'2026-01-08T00:00:00Z'}  # exactly 168h elapsed"
            - "POST /cabinets/{C1.id}/heartbeat at clock.now()"
            - "POST /_sweep/run {sweep_type:'lost'}  # observation B — at threshold"
            - "GET /rentals/{r1.id}"
            - "GET /users/{U1.id}"
            - "GET /devices/{D1.id}"
          assert:
            - "Observation A (167h59m): r1.rental_status == 'OVERDUE'  (NOT LOST; 167 < 168)"
            - "Observation A (167h59m): r1.payment_status == 'PENDING'"
            - "Observation B (168h): r1.rental_status == 'LOST'"
            - "Observation B (168h): r1.payment_status == 'DEPOSIT_DEDUCTED'"
            - "Observation B (168h): r1.charged_amount == 99.00  (LOST_DEVICE_FEE)"
            - "Observation B (168h): U1.deposit_balance == 0.00  (deducted 99.00)"
            - "Observation B (168h): U1.wallet_balance == 100.00  (unchanged; deposit covered the fee fully)"
            - "Observation B (168h): D1.status == 'LOST'"

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: rental_borrow_blocked_by_cabinet_offline
        grounds:
          - validations[priority=8]
          - state_machines.Rental.rental_status
          - entities.Cabinet.fields.online_status
          - errors.ERR_CABINET_OFFLINE
        distinguishing_aspect: |
          Entity pair: Rental ← Cabinet. Rental's transition into ACTIVE depends on the linked
          Cabinet's online_status==ONLINE. The check is purely state-of-other-entity.
        test_recipe:
          setup:
            - "POST /pricing-plans BJ; POST /location-partners P1; POST /cabinets C1"
            - "POST /devices D1 (battery 80, slot 0)"
            - "POST /users U1, deposit 99, wallet 100"
            - "POST /_clock/advance {to:'2026-01-01T10:00:00Z'}"
            - "POST /cabinets/{C1.id}/heartbeat {timestamp:'2026-01-01T09:00:00Z'}  # 1h stale > 300s timeout → OFFLINE"
          trigger:
            - "POST /rentals as U1 cabinet C1"
          assert:
            - "Response status: 409"
            - "Response body: data.error_id == 'ERR_CABINET_OFFLINE'"
            - "GET /cabinets/{C1.id}: data.online_status == 'OFFLINE'"

      - name: operator_task_complete_blocked_by_repair_ticket_unresolved
        grounds:
          - validations[priority=19]
          - state_machines.OperatorTask
          - state_machines.RepairTicket
          - entities.OperatorTask.fields.linked_repair_ticket_id
          - errors.ERR_TICKET_UNRESOLVED
        distinguishing_aspect: |
          Entity pair: OperatorTask ← RepairTicket (different pair from Rental ← Cabinet). Task complete
          requires the linked RepairTicket.status == RESOLVED. The check is on a different pair of
          entities and a different relationship direction.
        test_recipe:
          setup:
            - "Run the anomaly sweep cascade so T1 (OPEN) and OT1 (PENDING, linked to T1) exist on cabinet C1"
            - "POST /operator-tasks/auto-assign as Operator {city_code:'BJ'}  # OT1: PENDING → ASSIGNED"
            - "T1 is still in status OPEN (or ASSIGNED if operator assigned it; but NOT RESOLVED)"
          trigger:
            - "POST /operator-tasks/{OT1.id}/complete as Operator"
          assert:
            - "Response status: 409"
            - "Response body: data.error_id == 'ERR_TICKET_UNRESOLVED'  (task complete blocked because linked ticket.status != RESOLVED)"

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: maintenance_window_half_open_overlap_on_cabinet
        grounds:
          - validations[priority=12]
          - entities.MaintenanceWindow
          - entities.MaintenanceWindow.fields.window_start
          - entities.MaintenanceWindow.fields.window_end
          - errors.ERR_MAINTENANCE_WINDOW_OVERLAP
        distinguishing_aspect: |
          Resource: Cabinet (maintenance windows scheduled on the same cabinet). Interval semantics:
          half-open [start, end). Touching (a.window_end == b.window_start) is permitted (no overlap);
          true overlap is rejected. This is finite-interval, half-open arithmetic.
        test_recipe:
          setup:
            - "POST /pricing-plans BJ; POST /location-partners P1; POST /cabinets C1"
            - "POST /maintenance-windows {cabinet_id:C1.id, window_start:'2026-02-01T10:00:00Z', window_end:'2026-02-01T12:00:00Z'}  # MW1"
          trigger:
            - "POST /maintenance-windows {cabinet_id:C1.id, window_start:'2026-02-01T12:00:00Z', window_end:'2026-02-01T14:00:00Z'}  # touching: end==start → permitted"
            - "POST /maintenance-windows {cabinet_id:C1.id, window_start:'2026-02-01T11:00:00Z', window_end:'2026-02-01T13:00:00Z'}  # genuine overlap → rejected"
          assert:
            - "First request (touching): HTTP 201, MW2 created with status='SCHEDULED'"
            - "Second request (overlap): HTTP 409, data.error_id == 'ERR_MAINTENANCE_WINDOW_OVERLAP'"
            - "Second request must NOT have created a new window (count of MaintenanceWindow rows for cabinet remains 2 after both calls)"

      - name: user_active_rental_open_ended_exclusivity
        grounds:
          - validations[priority=6]
          - state_machines.Rental.rental_status
          - errors.ERR_DUPLICATE_RENTAL
        distinguishing_aspect: |
          Resource: User (different resource from Cabinet). Interval semantics: OPEN-ENDED. An ACTIVE
          rental occupies [rented_at, ∞) on the User dimension; any second borrow attempt overlaps. No
          finite end-time arithmetic — exclusivity is on "has any rental in {ACTIVE, OVERDUE, STUCK}".
          Distinct from the half-open finite-interval semantics of instance 1.
        test_recipe:
          setup:
            - "POST /pricing-plans BJ; POST /location-partners P1; POST /cabinets C1, C2; heartbeats"
            - "POST /devices D1 in C1 slot 0, D2 in C2 slot 0"
            - "POST /users U1, deposit 99, wallet 100"
            - "POST /rentals as U1 cabinet C1 → r1 ACTIVE"
          trigger:
            - "POST /rentals as U1 cabinet C2  # 2nd borrow attempt while r1 is ACTIVE"
          assert:
            - "Response status: 409"
            - "Response body: data.error_id == 'ERR_DUPLICATE_RENTAL'"
            - "GET /rentals/{r1.id}: data.rental_status == 'ACTIVE'  (r1 unchanged)"
            - "Count of rentals for U1 == 1 (no second rental created)"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: refund_preserves_user_money_total
        grounds:
          - state_machines.Rental.payment_status.BILLED_to_REFUNDED
          - state_machines.Rental.rental_status.ACTIVE_to_RETURNED
          - entities.User.fields.wallet_balance
          - entities.Rental.fields.charged_amount
          - entities.Rental.fields.refund_amount
        distinguishing_aspect: |
          Conserved quantity: CNY (money). Invariant pinned formula across the rent → return → refund
          cycle: U.wallet_balance_pre_borrow == U.wallet_balance_post_refund (with no other operations).
          Equivalently: U.wallet_balance + (sum of charged_amount where payment_status==BILLED) — minus
          (sum of refund_amount where payment_status==REFUNDED) — is invariant across the cycle.
        test_recipe:
          setup:
            - "POST /pricing-plans BJ; POST /location-partners P1; POST /cabinets C1; heartbeat"
            - "POST /devices D1 (battery 80, slot 0)"
            - "POST /users U1; POST /users/{U1.id}/deposit {amount:99.00}; POST /users/{U1.id}/wallet/topup {amount:100.00}"
            - "GET /users/{U1.id}: data.wallet_balance == 100.00  (pre-borrow snapshot)"
          trigger:
            - "POST /_clock/advance {to:'2026-01-01T10:00:00Z'}; heartbeat"
            - "POST /rentals as U1 cabinet C1 → r1"
            - "POST /_clock/advance {to:'2026-01-01T11:00:00Z'}; heartbeat"
            - "POST /rentals/{r1.id}/return {return_cabinet_id:C1.id}  # 60 min, charge=3.00"
            - "GET /users/{U1.id}: snapshot post-return"
            - "POST /rentals/{r1.id}/refund"
            - "GET /users/{U1.id}: snapshot post-refund"
            - "GET /rentals/{r1.id}: snapshot post-refund"
          assert:
            - "Post-return: U1.wallet_balance == 97.00  (100.00 - 3.00); r1.charged_amount == 3.00; r1.payment_status == 'BILLED'"
            - "Post-refund: U1.wallet_balance == 100.00  (97.00 + 3.00 = back to pre-borrow value — money is conserved)"
            - "Post-refund: r1.charged_amount == 3.00  (unchanged — historical record preserved)"
            - "Post-refund: r1.refund_amount == 3.00  (refund equals original charge)"
            - "Post-refund: r1.payment_status == 'REFUNDED'"
            - "Pinned formula: U.wallet_balance_post_refund - U.wallet_balance_pre_borrow == 0.00 (money invariant)"

      - name: borrow_return_preserves_global_device_count
        grounds:
          - state_machines.Device.AVAILABLE_to_BORROWED
          - state_machines.Device.BORROWED_to_AVAILABLE
          - entities.Device
          - entities.Slot
        distinguishing_aspect: |
          Conserved quantity: COUNT of Device records (different conserved quantity from CNY). The
          borrow → return cycle moves a device through BORROWED then back to AVAILABLE (possibly at a
          different cabinet) without creating or destroying any Device row. count(Device) is preserved
          across the closed loop.
        test_recipe:
          setup:
            - "POST /pricing-plans BJ; POST /location-partners P1; POST /cabinets C1, C2 (both BJ, SLOT_8); heartbeats"
            - "POST /devices D1 (battery 80, C1 slot 0), D2 (battery 70, C1 slot 1), D3 (battery 60, C1 slot 2)  # initial pool of 3"
            - "POST /users U1, deposit 99, wallet 100"
            - "Snapshot of devices before cycle: each of D1, D2, D3 reachable via GET /devices/{id} with status='AVAILABLE'"
          trigger:
            - "POST /_clock/advance {to:'2026-01-01T10:00:00Z'}; heartbeats"
            - "POST /rentals as U1 cabinet C1 → r1  (selector picks D1, highest battery)"
            - "Snapshot devices mid-cycle"
            - "POST /_clock/advance {to:'2026-01-01T11:00:00Z'}; heartbeats"
            - "POST /rentals/{r1.id}/return {return_cabinet_id:C2.id}"
            - "Snapshot devices post-cycle"
          assert:
            - "Pre-cycle: GET /devices/{D1.id}, /devices/{D2.id}, /devices/{D3.id} all 200 with status='AVAILABLE'  (count == 3)"
            - "Mid-cycle (post-borrow): D1.status == 'BORROWED' AND D1.current_cabinet_id IS null AND D1.current_slot_index IS null; D2.status == 'AVAILABLE' AND D2.current_cabinet_id == C1.id; D3.status == 'AVAILABLE' AND D3.current_cabinet_id == C1.id  (count == 3 — no creation, no destruction)"
            - "Post-cycle: D1.status == 'AVAILABLE' AND D1.current_cabinet_id == C2.id AND D1.current_slot_index == 0; D2.status == 'AVAILABLE' AND D2.current_cabinet_id == C1.id; D3.status == 'AVAILABLE' AND D3.current_cabinet_id == C1.id  (count == 3 — preserved)"
            - "GET /cabinets/{C1.id}: count of slots with device_id != null == 2  (slots 1 and 2 still hold D2, D3); slot 0 EMPTY"
            - "GET /cabinets/{C2.id}: count of slots with device_id != null == 1  (slot 0 holds D1)"
            - "Pinned formula: count(distinct Device records reachable via GET) is 3 across all three snapshots — the conserved quantity"
