            - call: "POST /water-service/emergency-tickets/${tkt_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /water-service/emergency-tickets/${tkt_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /water-service/emergency-tickets/${tkt_id}/diagnosis"
              payload: { cause_class: "CONTROL_FAILURE", onsite_estimate_cents: 20000 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /water-service/work-orders"
              payload: { property_id: "${prop_id}", well_profile_id: "${well_id}", assigned_technician_id: "${tech_id}", scope: "REPAIR", emergency_ticket_id: "${tkt_id}" }
              as: Dispatcher
