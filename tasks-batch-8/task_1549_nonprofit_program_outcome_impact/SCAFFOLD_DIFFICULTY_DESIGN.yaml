            - call: "POST /certifications"
              payload: { staff_user_id: "collector-1", instrument_id: "${instr1}", expires_at: "2027-01-01T00:00:00Z" }
              as: EvaluationLead
              captures: { cert: $.data.id }
            - call: "POST /instruments/${instr1}/new-revision"
              payload: {}
              as: EvaluationLead
              captures: { instr2: $.data.id }
          trigger:
            - call: "POST /instruments/${instr2}/publish"
              payload: {}
              as: EvaluationLead
            - call: "GET /instruments/${instr1}"
              payload: {}
              as: EvaluationLead
              captures: { i1_status: $.data.status }
            - call: "GET /instruments/${instr2}"
              payload: {}
              as: EvaluationLead
              captures: { i2_status: $.data.status, i2_ver: $.data.instrument_version }
            - call: "GET /certifications/${cert}"
              payload: {}
              as: EvaluationLead
              captures: { cert_status: $.data.status, cert_ver: $.data.certified_instrument_version }
          assert:
            - "instr2.status == PUBLISHED and instr2.instrument_version == 2"
            - "instr1.status == RETIRED (predecessor hop)"
            - "certification.status == STALE with certified_instrument_version == 1 (certification hop)"

  # ==========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_safety_on_closed_cycle_observation
