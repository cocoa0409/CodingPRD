# =============================================================================
# SCAFFOLD.yaml — Instant Claim Automation & Charitable Giveback Allocation
# Lemonade-style insurance automation benchmark (difficulty: beyond Expert)
# =============================================================================

scenario: |
  Instant Claim Automation & Charitable Giveback Allocation (Lemonade): policy
  issuance through a conversational flow with instant binding and behavioral
  fraud signals, first-notice-of-loss captured by video statement with automated
  claim triage and instant payment for low-value clean claims, escalation rules
  routing suspicious or complex claims to human adjusters, flat-fee business
  model where a fixed portion of premium is retained and the remainder funds
  claims and reinsurance, annual giveback where unused claim funds are donated
  to policyholder-selected causes with allocation accounting, reinsurance quota
  share affecting retained risk and giveback computation, claim denial
  communication and appeal handling, state rate filing constraints on the fee
  structure.

domain_name: instant-claim-giveback-insurance
api_prefix: /

complexity_profile:
  primary_archetype: ledger_reconciliation        # fee / claims-pot / reinsurance / giveback ledgers that must reconcile exactly
  secondary_archetype: compliance_audit           # state rate filings gate fee config; appeal deadline windows; segregation of duties on claims
  complexity_layers:
    - optimistic_concurrency                      # OCC on Policy (cause election), RateFiling (fee update), Claim (adjuster approve/deny/reserve)
    - cascading_side_effects                      # instant pay → policy ledger → cohort ledger → giveback projection; quota-share attachment retro-effect
    - dual_variant_calculation                    # retained loss: ACTUAL_PAID vs PAID_PLUS_RESERVE; filing caps: ABSOLUTE vs RATIO
    - rate_threshold_triggers                     # auto-pay clean-claim ceiling at exactly 250000 cents; fraud hard/soft thresholds; appeal 30-day window (strict >)
    - derived_field_reconciliation                # policy premium paid-to-date, cohort pot/reinsurance/giveback fields reconciled from ledger entries
    - ops_run_checkpoint                          # annual giveback run per cohort (epoch-advancing batch)
    - scheduled_actions                           # quote expires; retro-effective reinsurance attachment date
    - pagination_with_filtering                   # claim list filtered by cohort/status; ledger entry lists
  entity_topology: flat                           # peer entities joined by foreign keys; no nested URL paths
  state_machine_shape: branching                  # divergent instant-pay vs escalation branches, re-open cycles, approval chains
  relationship_patterns:
    - one_to_many                                 # Cohort→Policy→Claim→ClaimLedgerEntry; RateFiling→FeeConfig
    - cross_aggregate                             # Claim references Cohort through Policy; ReinsuranceTreaty references Cohort
  role_model: segregation_of_duties               # UnderwritingAdmin (filings) vs ClaimsAdjuster (pay/deny) vs FinanceOps (giveback) vs PlatformAdmin (config)
  consistency_model: immediate                    # every cascade is atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: RateFiling
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "US state code, e.g. CA, TX, NY" }
      - { name: max_flat_fee_pct, type: number, source: input, description: "Maximum retainable fee as a fraction of premium, e.g. 0.25" }
      - { name: max_flat_fee_cap_cents, type: integer, source: input, description: "Maximum retainable fee as an absolute cents cap; null means uncapped", constraints: "null or integer >= 0" }
      - { name: filing_mode, type: enum, source: input, description: "Which cap representation governs fee checks: ABSOLUTE_CENTS | PCT_OF_PREMIUM", constraints: "ABSOLUTE_CENTS | PCT_OF_PREMIUM" }
      - { name: status, type: enum, source: system, description: "SUBMITTED → APPROVED | REJECTED; APPROVED → SUPERSEDED (system)", default: SUBMITTED, constraints: "SUBMITTED | APPROVED | REJECTED | SUPERSEDED" }
      - { name: approved_at, type: datetime, source: system, description: "Set when transition to APPROVED; null otherwise" }

  - name: FeeConfig
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "US state code this configuration governs" }
      - { name: filing_id, type: string, source: input, description: "FK -> RateFiling.id; referenced filing MUST be APPROVED at activation time" }
      - { name: flat_fee_pct, type: number, source: input, description: "Fee as fraction of premium (used when filing filing_mode == PCT_OF_PREMIUM)", constraints: "0 < flat_fee_pct <= 1" }
      - { name: flat_fee_cents, type: integer, source: input, description: "Fee as absolute cents per premium charge (used when filing filing_mode == ABSOLUTE_CENTS)", constraints: "integer > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT → ACTIVE | RETIRED; ACTIVE → RETIRED", default: DRAFT, constraints: "DRAFT | ACTIVE | RETIRED" }

  - name: ReinsuranceTreaty
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Treaty label" }
      - { name: quota_share_pct, type: number, source: input, description: "Fraction of premium ceded and of claim amounts covered, e.g. 0.75", constraints: "0 < quota_share_pct < 1" }
      - { name: status, type: enum, source: system, description: "DRAFT → ACTIVE | RETIRED; ACTIVE → RETIRED", default: DRAFT, constraints: "DRAFT | ACTIVE | RETIRED" }

  - name: Cause
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Charitable cause name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE, constraints: "ACTIVE | RETIRED" }

  - name: Cohort
    parent: null
    common_fields: true
    fields:
      - { name: cohort_year, type: integer, source: input, description: "Giveback year, e.g. 2026", constraints: "unique" }
      - { name: cause_id, type: string, source: input, description: "FK -> Cause.id; cause MUST be ACTIVE at cohort creation" }
      - { name: status, type: enum, source: system, description: "OPEN → CLOSED → DONATED; OPEN → EXPIRED (system)", default: OPEN, constraints: "OPEN | CLOSED | DONATED | EXPIRED" }
      - { name: premium_pool_cents, type: integer, source: computed, description: "Sum of PREMIUM_CHARGE ledger entries across policies in this cohort", default: 0 }
      - { name: fee_retained_cents, type: integer, source: computed, description: "Sum of FEE_RETAINED ledger entries across policies in this cohort", default: 0 }
      - { name: reinsurance_ceded_cents, type: integer, source: computed, description: "Sum of REINSURANCE_CEDED ledger entries across policies in this cohort", default: 0 }
      - { name: claims_pot_cents, type: integer, source: computed, description: "premium_pool_cents - fee_retained_cents - reinsurance_ceded_cents, kept in sync on every ledger mutation", default: 0 }
      - { name: retained_claims_actual_cents, type: integer, source: computed, description: "Sum of max(0, payout - reinsurance_share) over PAID claims; recomputed when treaty attachment or claim payment changes", default: 0 }
      - { name: retained_claims_reserved_cents, type: integer, source: computed, description: "Sum of max(0, payout - reinsurance_share) over PAID claims PLUS sum of max(0, reserve - reinsurance_share) over ESCALATED claims; the provisional variant of retained claims", default: 0 }
      - { name: giveback_actual_cents, type: integer, source: computed, description: "max(0, claims_pot_cents - retained_claims_actual_cents), recomputed on every relevant ledger/claim/treaty mutation", default: 0 }
      - { name: giveback_projected_cents, type: integer, source: computed, description: "max(0, claims_pot_cents - retained_claims_reserved_cents); the provisional giveback projection", default: 0 }

  - name: Policyholder
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique email", constraints: "unique" }
      - { name: full_name, type: string, source: input, description: "Full name" }
      - { name: state_code, type: string, source: input, description: "US state of residence" }
      - { name: fraud_strike_count, type: integer, source: computed, description: "Count of DENIED claims with denial_reason == FRAUD; drives application auto-decline at >= 3", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEBARRED (system at 3 fraud strikes)", default: ACTIVE, constraints: "ACTIVE | DEBARRED" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: policyholder_id, type: string, source: system, description: "FK -> Policyholder.id" }
      - { name: coverage_amount_cents, type: integer, source: input, description: "Requested coverage", constraints: "integer > 0" }
      - { name: premium_cents, type: integer, source: input, description: "Quoted annual premium", constraints: "integer > 0" }
      - { name: state_code, type: string, source: system, description: "Copied from Policyholder.state_code at creation" }
      - { name: expires_at, type: datetime, source: computed, description: "created_at + QUOTE_TTL_DAYS (30 days)" }
      - { name: premium_grace_days, type: integer, source: input, description: "Days of grace before an underpaid bound policy may be lapsed", default: 60, constraints: "integer >= 0" }
      - { name: status, type: enum, source: system, description: "OPEN → BOUND; OPEN → EXPIRED (system)", default: OPEN, constraints: "OPEN | BOUND | EXPIRED" }

  - name: PolicyApplication
    parent: null
    common_fields: true
    fields:
      - { name: policyholder_id, type: string, source: system, description: "FK -> Policyholder.id" }
      - { name: quote_id, type: string, source: system, description: "FK -> Quote.id; one application per quote (unique)" }
      - { name: checkout_velocity_seconds, type: integer, source: input, description: "Seconds the applicant took to complete the conversational flow", constraints: "integer >= 0" }
      - { name: device_reuse_count, type: integer, source: input, description: "How many prior policyholders share this device fingerprint", constraints: "integer >= 0" }
      - { name: answers_ipa_acknowledged, type: boolean, source: input, description: "Whether the applicant acknowledged the Insurance Policy Agreement; false is a behavioral fraud signal" }
      - { name: behavioral_signal_count, type: integer, source: computed, description: "Count of triggered signals: velocity < VELOCITY_THRESHOLD_SECONDS, device_reuse_count >= DEVICE_REUSE_THRESHOLD, answers_ipa_acknowledged == false", default: 0 }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW → APPROVED | DECLINED", default: UNDER_REVIEW, constraints: "UNDER_REVIEW | APPROVED | DECLINED" }

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: policyholder_id, type: string, source: system, description: "FK -> Policyholder.id" }
      - { name: quote_id, type: string, source: system, description: "FK -> Quote.id" }
      - { name: cohort_id, type: string, source: system, description: "FK -> Cohort.id; resolved at bind time as the unique cohort with status == OPEN whose cohort_year == bind year" }
      - { name: fee_config_id, type: string, source: system, description: "FK -> FeeConfig.id; the ACTIVE fee config for the policy state at bind time" }
      - { name: annual_premium_cents, type: integer, source: system, description: "Copied from Quote.premium_cents" }
      - { name: premium_paid_cents, type: integer, source: computed, description: "Sum of PREMIUM_CHARGE entries on this policy's ledger", default: 0 }
      - { name: premium_outstanding_cents, type: integer, source: computed, description: "annual_premium_cents - premium_paid_cents, floored at 0; equals annual_premium_cents at bind", default: 0 }
      - { name: fraud_flag, type: boolean, source: computed, description: "true when the bound application had behavioral_signal_count >= FRAUD_SOFT_THRESHOLD (1); claims on flagged policies never auto-pay and always escalate", default: false }
      - { name: cause_id, type: string, source: computed, description: "FK -> Cause.id; elected cause, or cohort default when null", constraints: "null until elected" }
      - { name: cause_election_version, type: integer, source: system, description: "OCC guard counter for cause election", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE → LAPSED | CANCELLED", default: ACTIVE, constraints: "ACTIVE | LAPSED | CANCELLED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: video_statement_ref, type: string, source: input, description: "Opaque reference to the recorded video statement" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount requested by the policyholder", constraints: "integer > 0" }
      - { name: fraud_score, type: number, source: input, description: "Automated fraud score attached at FNOL intake, in [0, 1]" }
      - { name: payout_cents, type: integer, source: computed, description: "Final approved payout (claimed_amount_cents on instant/auto approval; adjuster-set otherwise); null until a paying transition", default: null }
      - { name: reserve_cents, type: integer, source: computed, description: "Open indemnity reserve on ESCALATED claims; drives the reserved variant of retained claims; null otherwise", default: null }
      - { name: reinsurance_share_cents, type: integer, source: computed, description: "Ceded share of payout_cents under the cohort's ACTIVE treaty at payment time; 0 when no treaty attached", default: 0 }
      - { name: denial_reason, type: enum, source: computed, description: "Set on deny or appeal denial; cleared to null on overturn", constraints: "FRAUD | COVERAGE | OTHER; null until denied" }
      - { name: denied_by_adjuster_id, type: string, source: system, description: "X-User-ID of the adjuster who executed the deny; drives appeal segregation-of-duties; null unless denied" }
      - { name: appeal_deadline, type: datetime, source: computed, description: "denial timestamp + APPEAL_WINDOW_DAYS (30 days); null unless denied" }
      - { name: appeal_count, type: integer, source: system, description: "Number of appeals filed; hard-capped at MAX_APPEALS_PER_CLAIM (1)", default: 0 }
      - { name: status, type: enum, source: system, description: "FNOL_SUBMITTED → AUTO_APPROVED | ESCALATED; AUTO_APPROVED → PAID; ESCALATED → PAID | DENIED; DENIED → APPEALED; APPEALED → PAID | DENIED", default: FNOL_SUBMITTED, constraints: "FNOL_SUBMITTED | AUTO_APPROVED | ESCALATED | PAID | DENIED | APPEALED" }

  - name: ClaimPayment
    parent: null
    common_fields: false
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: amount_cents, type: integer, source: system, description: "Gross payout paid" }
      - { name: reinsurance_share_cents, type: integer, source: system, description: "Portion ceded to reinsurer at payment time" }
      - { name: fee_cents, type: integer, source: system, description: "Always 0 — payments never carry fee; present so the ledger reconciles by construction", default: 0 }
      - { name: status, type: enum, source: system, description: "SETTLED | VOIDED", default: SETTLED, constraints: "SETTLED | VOIDED" }

  - name: PolicyLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: kind, type: enum, source: system, description: "PREMIUM_CHARGE | FEE_RETAINED | REINSURANCE_CEDED | CLAIM_PAYOUT | CLAIM_PAYOUT_REVERSAL", constraints: "PREMIUM_CHARGE | FEE_RETAINED | REINSURANCE_CEDED | CLAIM_PAYOUT | CLAIM_PAYOUT_REVERSAL" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount in cents for this policy's ledger" }
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; set only on CLAIM_PAYOUT / CLAIM_PAYOUT_REVERSAL entries, null otherwise" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: statement, type: string, source: input, description: "Free-text appeal statement" }
      - { name: review_note, type: string, source: input, description: "Adjuster note recorded on review", constraints: "set at review" }
      - { name: status, type: enum, source: system, description: "PENDING → UPHELD | OVERTURNED", default: PENDING, constraints: "PENDING | UPHELD | OVERTURNED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RateFiling
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /rate-filings/{id}/approve"
        actor: UnderwritingAdmin
        preconditions:
          - "filing status == SUBMITTED (else ERR_FILING_NOT_SUBMITTED)"
        side_effects:
          - "Every other filing with the same state_code in status APPROVED transitions to SUPERSEDED (system)"
          - "approved_at set to current logical clock"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /rate-filings/{id}/reject"
        actor: UnderwritingAdmin
        preconditions:
          - "filing status == SUBMITTED (else ERR_FILING_NOT_SUBMITTED)"
        side_effects: []
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system — a second filing for the same state_code is approved"
        actor: system
        preconditions: []
        side_effects:
          - "FeeConfigs referencing the superseded filing keep their status (no cascade); only NEW activations must reference an APPROVED filing"

  - entity: FeeConfig
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /fee-configs/{id}/activate"
        actor: UnderwritingAdmin
        preconditions:
          - "fee config status == DRAFT (else ERR_INVALID_STATE)"
          - "referenced RateFiling status == APPROVED (else ERR_RATE_FILING_NOT_APPROVED)"
          - "filing_mode == ABSOLUTE_CENTS ⇒ flat_fee_cents <= max_flat_fee_cap_cents (else ERR_FLAT_FEE_VIOLATES_FILING)"
          - "filing_mode == PCT_OF_PREMIUM ⇒ flat_fee_pct <= max_flat_fee_pct (else ERR_FLAT_FEE_VIOLATES_FILING)"
          - "no other FeeConfig for the same state_code in status ACTIVE (else ERR_FEE_CONFIG_ALREADY_ACTIVE)"
        side_effects:
          - "status → ACTIVE"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /fee-configs/{id}/retire"
        actor: UnderwritingAdmin
        preconditions:
          - "fee config status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "status → RETIRED; subsequent binds for that state fail with ERR_FEE_CONFIG_NOT_FOUND until a new config is activated"

  - entity: ReinsuranceTreaty
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /reinsurance-treaties/{id}/activate"
        actor: FinanceOps
        preconditions:
          - "treaty status == DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "status → ACTIVE"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /reinsurance-treaties/{id}/retire"
        actor: FinanceOps
        preconditions:
          - "treaty status == ACTIVE (else ERR_INVALID_STATE)"
          - "treaty must not be attached to any cohort (else ERR_TREATY_IN_USE)"
        side_effects:
          - "status → RETIRED"

  - entity: Cohort
    initial_state: OPEN
    terminal_states: [DONATED, EXPIRED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system — logical clock reaches {cohort_year + 1}-07-01T00:00:00Z"
        actor: system
        preconditions: []
        side_effects:
          - "No further binds or ledger entries may be added to policies in this cohort"
      - from: CLOSED
        to: DONATED
        trigger: "POST /cohorts/{id}/run-giveback"
        actor: FinanceOps
        preconditions:
          - "cohort status == CLOSED (else ERR_COHORT_NOT_CLOSED)"
        side_effects:
          - "Per cause: donation = sum over policies in cohort of elected-share of giveback_actual_cents (see giveback_allocation calculation)"
          - "status → DONATED"
      - from: OPEN
        to: EXPIRED
        trigger: "system — cohort_year already past when clock set far forward (no policies ever bound)"
        actor: system
        preconditions:
          - "cohort has zero policies"
        side_effects: []

  - entity: Quote
    initial_state: OPEN
    terminal_states: [BOUND, EXPIRED]
    transitions:
      - from: OPEN
        to: BOUND
        trigger: "POST /applications/{id}/approve (system side effect)"
        actor: system
        preconditions: []
        side_effects:
          - "A Policy is created referencing this quote"
      - from: OPEN
        to: EXPIRED
        trigger: "system — current logical clock > Quote.expires_at"
        actor: system
        preconditions: []
        side_effects:
          - "Applications submitted against an EXPIRED quote fail with ERR_QUOTE_EXPIRED"

  - entity: PolicyApplication
    initial_state: UNDER_REVIEW
    terminal_states: [APPROVED, DECLINED]
    transitions:
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /applications/{id}/approve"
        actor: UnderwritingAdmin
        preconditions:
          - "application status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "policyholder.status == ACTIVE (else ERR_POLICYHOLDER_DEBARRED)"
          - "behavioral_signal_count < FRAUD_HARD_THRESHOLD (2) (else ERR_APPLICATION_AUTO_DECLINE_REQUIRED)"
        side_effects:
          - "Quote transitions OPEN → BOUND"
          - "Policy created: cohort resolved to the unique OPEN cohort whose cohort_year == bind year (else ERR_COHORT_NOT_OPEN); fee_config resolved to ACTIVE FeeConfig for policy state (else ERR_FEE_CONFIG_NOT_FOUND)"
          - "Policy.fraud_flag = (behavioral_signal_count >= FRAUD_SOFT_THRESHOLD (1)) — soft-signaled binds are allowed but their claims never auto-pay"
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /applications/{id}/decline OR system auto-decline when behavioral_signal_count >= FRAUD_HARD_THRESHOLD (2)"
        actor: UnderwritingAdmin | system
        preconditions:
          - "application status == UNDER_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "Quote remains OPEN (may be re-applied against until expiry)"

  - entity: Policy
    initial_state: ACTIVE
    terminal_states: [LAPSED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /policies/{id}/lapse"
        actor: FinanceOps
        preconditions:
          - "policy status == ACTIVE (else ERR_INVALID_STATE)"
          - "premium_outstanding_cents > 0 (else ERR_INVALID_REQUEST — nothing to lapse for)"
          - "current logical clock >= Policy.created_at + Quote.premium_grace_days (default 60) (else ERR_LAPSE_GRACE_NOT_ELAPSED)"
        side_effects:
          - "status → LAPSED; no further claims accepted (FNOL rejects with ERR_POLICY_NOT_ACTIVE); policy is excluded from giveback allocation weights"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: Policyholder
        preconditions:
          - "policy status == ACTIVE (else ERR_INVALID_STATE)"
          - "acting policyholder owns the policy (else ERR_FORBIDDEN)"
        side_effects:
          - "Policy keeps its ledger rows; cohort aggregates unchanged (premiums are earned)"

  - entity: Claim
    initial_state: FNOL_SUBMITTED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: FNOL_SUBMITTED
        to: AUTO_APPROVED
        trigger: "system — FNOL triage when fraud_score < FRAUD_SCORE_AUTO_THRESHOLD (0.30) AND claimed_amount_cents <= INSTANT_PAY_LIMIT_CENTS (250000) AND policy.fraud_flag == false"
        actor: system
        preconditions: []
        side_effects:
          - "payout_cents = claimed_amount_cents"
      - from: FNOL_SUBMITTED
        to: ESCALATED
        trigger: "system — FNOL triage when any auto-approve precondition fails"
        actor: system
        preconditions: []
        side_effects:
          - "reserve_cents = claimed_amount_cents (initial reserve)"
          - "Cohort.retained_claims_reserved_cents and giveback_projected_cents recomputed"
      - from: AUTO_APPROVED
        to: PAID
        trigger: "system — instant payment dispatched in the same request as triage"
        actor: system
        preconditions: []
        side_effects:
          - "ClaimPayment created (status SETTLED)"
          - "reinsurance_share_cents = round(payout_cents * treaty.quota_share_pct) when the policy's cohort has an ACTIVE attached treaty, else 0"
          - "PolicyLedgerEntry CLAIM_PAYOUT amount=payout_cents appended to policy ledger"
          - "Cohort.retained_claims_actual_cents and giveback_actual_cents recomputed"
      - from: ESCALATED
        to: PAID
        trigger: "POST /claims/{id}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "claim status == ESCALATED (else ERR_INVALID_STATE)"
          - "expected_claim_version matches claim.version (else ERR_STALE_VERSION)"
          - "payout_cents input > 0 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "payout_cents = adjuster-provided payout"
          - "reserve_cents = null (reserve released)"
          - "ClaimPayment created; reinsurance_share under cohort treaty; ledger CLAIM_PAYOUT appended"
          - "Cohort retained/giveback fields recomputed (both variants)"
          - "increments Claim.version by 1"
      - from: ESCALATED
        to: DENIED
        trigger: "POST /claims/{id}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "claim status == ESCALATED (else ERR_INVALID_STATE)"
          - "expected_claim_version matches claim.version (else ERR_STALE_VERSION)"
          - "denial_reason in {FRAUD, COVERAGE, OTHER} (else ERR_INVALID_REQUEST)"
        side_effects:
          - "reserve_cents = null"
          - "denial_reason set; appeal_deadline = now + 30 days"
          - "When denial_reason == FRAUD: Policyholder.fraud_strike_count += 1; if fraud_strike_count reaches 3 → policyholder.status = DEBARRED and every UNDER_REVIEW PolicyApplication of that policyholder auto-transitions to DECLINED"
          - "Cohort retained_claims_reserved_cents and giveback_projected_cents recomputed"
          - "increments Claim.version by 1"
      - from: DENIED
        to: APPEALED
        trigger: "POST /claims/{id}/appeals"
        actor: Policyholder
        preconditions:
          - "claim status == DENIED (else ERR_INVALID_STATE)"
          - "appeal_count < MAX_APPEALS_PER_CLAIM (1) (else ERR_APPEAL_LIMIT_REACHED)"
          - "current logical clock <= appeal_deadline (strictly: now - denial_time <= 30 days; later than deadline fails ERR_APPEAL_WINDOW_CLOSED)"
          - "acting policyholder owns the claim's policy (else ERR_FORBIDDEN)"
        side_effects:
          - "Appeal created status PENDING"
          - "appeal_count += 1"
      - from: APPEALED
        to: DENIED
        trigger: "POST /appeals/{id}/uphold"
        actor: ClaimsAdjuster
        preconditions:
          - "appeal status == PENDING (else ERR_INVALID_STATE)"
          - "the reviewing adjuster's X-User-ID != the original denying adjuster id recorded on the claim (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "appeal.status → UPHELD; claim returns to DENIED (terminal)"
      - from: APPEALED
        to: PAID
        trigger: "POST /appeals/{id}/overturn"
        actor: ClaimsAdjuster
        preconditions:
          - "appeal status == PENDING (else ERR_INVALID_STATE)"
          - "the reviewing adjuster's X-User-ID != the original denying adjuster id (else ERR_SEGREGATION_OF_DUTIES)"
          - "payout_cents input > 0 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "appeal.status → OVERTURNED; claim → PAID with adjuster payout"
          - "ClaimPayment + ledger + cohort recompute as in ESCALATED → PAID"
          - "claim.denial_reason cleared to null"

  - entity: Appeal
    initial_state: PENDING
    terminal_states: [UPHELD, OVERTURNED]
    transitions:
      - from: PENDING
        to: UPHELD
        trigger: "POST /appeals/{id}/uphold"
        actor: ClaimsAdjuster
        preconditions: ["see Claim APPEALED → DENIED"]
        side_effects: ["Claim → DENIED"]
      - from: PENDING
        to: OVERTURNED
        trigger: "POST /appeals/{id}/overturn"
        actor: ClaimsAdjuster
        preconditions: ["see Claim APPEALED → PAID"]
        side_effects: ["Claim → PAID with payout"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: policy-cause-election-stale-version
    parent_entity: Policy
    write_endpoint: "POST /policies/{id}/cause-election"
    occ_field: "expected_policy_version"
    description: |
      Electing a cause on a Policy whose version has advanced since the client
      last observed it is rejected. A second sequential election carrying the
      previously observed version is deterministically rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: fee-config-update-stale-version
    parent_entity: FeeConfig
    write_endpoint: "POST /fee-configs/{id}/update"
    occ_field: "expected_fee_config_version"
    description: |
      Updating a DRAFT FeeConfig whose version has advanced since the client
      last observed it is rejected; the writer must re-read and re-apply.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: claim-adjudication-stale-version
    parent_entity: Claim
    write_endpoint: "POST /claims/{id}/approve"
    occ_field: "expected_claim_version"
    description: |
      Approving an ESCALATED claim with a stale expected_claim_version is
      rejected; the adjuster must re-read the claim before approving.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: claim-denial-stale-version
    parent_entity: Claim
    write_endpoint: "POST /claims/{id}/deny"
    occ_field: "expected_claim_version"
    description: |
      Denying an ESCALATED claim with a stale expected_claim_version is
      rejected; the adjuster must re-read the claim before denying.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fee_split_on_premium_charge
    trigger: "POST /policies/{id}/premium-payments"
    algorithm: waterfall_allocation
    formula: |
      charge = min(amount_cents, Policy.premium_outstanding_cents)
      fee_config = Policy.fee_config_id → FeeConfig; filing = FeeConfig.filing_id → RateFiling
      if filing.filing_mode == ABSOLUTE_CENTS:
          fee = min(FeeConfig.flat_fee_cents, charge)
      else:  # PCT_OF_PREMIUM
          fee = round_half_up(charge * FeeConfig.flat_fee_pct)
      treaty = ACTIVE treaty attached to Policy's cohort, else null
      ceded = round_half_up((charge - fee) * treaty.quota_share_pct) if treaty else 0
      pot_increment = charge - fee - ceded
      Append three ledger entries: PREMIUM_CHARGE(+charge), FEE_RETAINED(+fee),
      REINSURANCE_CEDED(+ceded). Evaluation order pinned: fee first (mode-dependent),
      then ceded on (charge - fee), then pot remainder. Rounding pinned: each of
      fee and ceded rounded individually with round_half_up to integer cents
      BEFORE subtraction — never sum-then-round.
    input_set: "Policy in ACTIVE; premium_outstanding_cents > 0; cohort of the policy must be OPEN"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; per-component round_half_up before subtraction"
    variants:
      - name: absolute_cents_fee
        when: "governing RateFiling.filing_mode == ABSOLUTE_CENTS"
        difference: "fee = min(flat_fee_cents, charge) — independent of premium size; identical charge can yield different fee than the pct variant"
      - name: pct_of_premium_fee
        when: "governing RateFiling.filing_mode == PCT_OF_PREMIUM"
        difference: "fee = round_half_up(charge * flat_fee_pct) — scales with charge; diverges from absolute variant whenever charge != flat_fee_cents / flat_fee_pct"

  - name: retained_claims_and_giveback
    trigger: "claim payment (instant or adjuster), claim escalation (reserve set), claim denial (reserve released), treaty attach/detach on cohort, cohort giveback run"
    algorithm: aggregation
    formula: |
      For each claim of policies in the cohort:
        retained(c) = max(0, c.payout_cents - c.reinsurance_share_cents)   when c.status == PAID
        retained(c) = 0                                                    when c.status == DENIED
        reserve_part(c) = max(0, c.reserve_cents - c.reinsurance_share_cents) when c.status == ESCALATED
      retained_actual   = Σ retained(c) over PAID claims
      retained_reserved = retained_actual + Σ reserve_part(c) over ESCALATED claims
      giveback_actual    = max(0, Cohort.claims_pot_cents - retained_actual)
      giveback_projected = max(0, Cohort.claims_pot_cents - retained_reserved)
      Note: for ESCALATED claims reinsurance_share_cents is 0 until payment, so
      reserve_part(c) = reserve_cents unless a treaty is attached — attach is
      retroactive for RESERVES: on treaty attach, every ESCALATED claim's
      reinsurance_share_cents is recomputed as round_half_up(reserve_cents *
      quota_share_pct) and both variants recomputed.
    input_set: "claims whose policy.cohort_id == cohort.id and claim.status IN {PAID, ESCALATED, DENIED}; ledger kinds {PREMIUM_CHARGE, FEE_RETAINED, REINSURANCE_CEDED} for the pot"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents"
    variants:
      - name: actual_paid_basis
        when: "final/giveback-run context (giveback_actual_cents)"
        difference: "only PAID claims count; ESCALATED reserves excluded — unused reserves flow to giveback"
      - name: paid_plus_reserve_basis
        when: "provisional/projection context (giveback_projected_cents)"
        difference: "PAID claims plus ESCALATED reserves count; identical cohort state yields a strictly smaller giveback whenever any claim is ESCALATED with reserve > 0"

  - name: giveback_allocation
    trigger: "POST /cohorts/{id}/run-giveback"
    algorithm: waterfall_allocation
    formula: |
      eligible_policies = policies with cohort_id == cohort.id AND status != LAPSED
      pot = Cohort.giveback_actual_cents
      weight(p) = p.premium_paid_cents
      total_weight = Σ weight(p) over eligible_policies
      if total_weight == 0 or pot == 0: no allocations; cohort still transitions to DONATED
      raw(p) = pot * weight(p) / total_weight   (exact rational)
      floor(p) = floor(raw(p))
      remainder = pot - Σ floor(p)
      Distribute remainder one cent at a time to policies ordered by
      (fractional part of raw(p) DESC, Policy.created_at ASC), one cent each,
      cycling until remainder exhausted (largest-remainder method; ties by
      created_at, never by id).
      cause_amount(cause) = Σ allocation(p) over eligible p with
      effective_cause(p) = (p.cause_id if not null else cohort.cause_id)
    input_set: "policies in the cohort with status IN {ACTIVE, CANCELLED}; claims only enter via giveback_actual_cents"
    constants: {}
    precision: "integer cents; largest-remainder with created_at tie-break"

  - name: fraud_behavioral_scoring
    trigger: "POST /applications"
    algorithm: threshold
    formula: |
      signals = 0
      signals += 1 if checkout_velocity_seconds < VELOCITY_THRESHOLD_SECONDS
      signals += 1 if device_reuse_count >= DEVICE_REUSE_THRESHOLD
      signals += 1 if answers_ipa_acknowledged == false
      behavioral_signal_count = signals
      if policyholder.fraud_strike_count >= FRAUD_STRIKES_DEBAR (3):
          submission rejected with ERR_POLICYHOLDER_DEBARRED (no application created)
      elif signals >= FRAUD_HARD_THRESHOLD (2):
          application auto-DECLINED (status DECLINED immediately)
      elif signals == FRAUD_SOFT_THRESHOLD (1):
          status stays UNDER_REVIEW but flagged soft: manual approve still allowed
      else:
          status UNDER_REVIEW, clean
      Boundary discipline: velocity EXACTLY 8.0 seconds is NOT a signal (strict <);
      device_reuse_count EXACTLY 2 IS a signal (>=); strikes EXACTLY 3 debar (>=).
    input_set: "the submitted application fields; the policyholder's current fraud_strike_count"
    constants:
      VELOCITY_THRESHOLD_SECONDS: 8
      DEVICE_REUSE_THRESHOLD: 2
      FRAUD_SOFT_THRESHOLD: 1
      FRAUD_HARD_THRESHOLD: 2
      FRAUD_STRIKES_DEBAR: 3
    precision: "integer signal count"

  - name: fnol_triage_routing
    trigger: "POST /claims"
    algorithm: threshold
    formula: |
      auto_pay = (fraud_score < FRAUD_SCORE_AUTO_THRESHOLD)
                 AND (claimed_amount_cents <= INSTANT_PAY_LIMIT_CENTS)
                 AND (policy.fraud_flag == false)
      if auto_pay: FNOL_SUBMITTED → AUTO_APPROVED → PAID in one request
      else: FNOL_SUBMITTED → ESCALATED, reserve_cents = claimed_amount_cents
      Boundary discipline: fraud_score EXACTLY 0.30 escalates (strict <);
      claimed_amount_cents EXACTLY 250000 auto-pays (<=).
    input_set: "the new claim's fraud_score, claimed_amount_cents; policy.fraud_flag"
    constants:
      FRAUD_SCORE_AUTO_THRESHOLD: 0.30
      INSTANT_PAY_LIMIT_CENTS: 250000
    precision: "score compared as exact decimal; amount in integer cents"

  - name: appeal_window_check
    trigger: "POST /claims/{id}/appeals"
    algorithm: threshold
    formula: |
      deadline = claim.appeal_deadline  (= denial timestamp + 30 days)
      allowed iff current logical clock <= deadline
      A request at exactly the deadline instant is allowed; one second after
      fails with ERR_APPEAL_WINDOW_CLOSED. Appeal count cap: appeal_count < 1,
      i.e. exactly one appeal per claim.
    input_set: "claim.appeal_deadline, claim.appeal_count, current logical clock"
    constants:
      APPEAL_WINDOW_DAYS: 30
      MAX_APPEALS_PER_CLAIM: 1
    precision: "second precision on ISO8601 UTC"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per §1.7", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: existence, check: "Path ids exist (left-to-right); unknown policyholder/quote/policy/claim/etc.", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints" }
  - { priority: 4, category: state, check: "Target resource in a legal from-state for the operation (generic state guard)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 5, category: business_constraint, check: "OCC expected_*_version matches current entity version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /policies/{id}/cause-election, POST /fee-configs/{id}/update, POST /claims/{id}/approve, POST /claims/{id}/deny" }
  - { priority: 6, category: business_referential, check: "FeeConfig.filing_id references a RateFiling in status APPROVED", error_id: ERR_RATE_FILING_NOT_APPROVED, http_status: 422, applies_to: "POST /fee-configs, POST /fee-configs/{id}/activate" }
  - { priority: 7, category: business_safety, check: "Fee values within the governing filing caps (mode-dependent check)", error_id: ERR_FLAT_FEE_VIOLATES_FILING, http_status: 422, applies_to: "POST /fee-configs, POST /fee-configs/{id}/update, POST /fee-configs/{id}/activate" }
  - { priority: 8, category: business_constraint, check: "No other ACTIVE FeeConfig for the same state_code on activate", error_id: ERR_FEE_CONFIG_ALREADY_ACTIVE, http_status: 409, applies_to: "POST /fee-configs/{id}/activate" }
  - { priority: 9, category: business_temporal, check: "Quote status OPEN and current clock <= Quote.expires_at", error_id: ERR_QUOTE_EXPIRED, http_status: 422, applies_to: "POST /applications" }
  - { priority: 10, category: business_referential, check: "Cohort.cause_id references an ACTIVE Cause", error_id: ERR_CAUSE_NOT_ACTIVE, http_status: 422, applies_to: "POST /cohorts" }
  - { priority: 11, category: business_safety, check: "policyholder.status must be ACTIVE at application submission", error_id: ERR_POLICYHOLDER_DEBARRED, http_status: 422, applies_to: "POST /applications" }
  - { priority: 11, category: business_constraint, check: "at approve: behavioral_signal_count < FRAUD_HARD_THRESHOLD", error_id: ERR_APPLICATION_AUTO_DECLINE_REQUIRED, http_status: 422, applies_to: "POST /applications/{id}/approve" }
  - { priority: 12, category: business_referential, check: "Bind requires an OPEN cohort for bind year and ACTIVE FeeConfig for state", error_id: ERR_COHORT_NOT_OPEN, http_status: 422, applies_to: "POST /applications/{id}/approve" }
  - { priority: 13, category: business_referential, check: "Bind requires an ACTIVE FeeConfig for the policy state", error_id: ERR_FEE_CONFIG_NOT_FOUND, http_status: 422, applies_to: "POST /applications/{id}/approve" }
  - { priority: 14, category: state, check: "FNOL requires policy.status == ACTIVE", error_id: ERR_POLICY_NOT_ACTIVE, http_status: 409, applies_to: "POST /claims" }
  - { priority: 15, category: business_fiscal, check: "Premium payment amount > 0 and policy premium_outstanding_cents > 0", error_id: ERR_PREMIUM_ALREADY_PAID, http_status: 422, applies_to: "POST /policies/{id}/premium-payments" }
  - { priority: 16, category: business_temporal, check: "Appeal within window: now <= appeal_deadline", error_id: ERR_APPEAL_WINDOW_CLOSED, http_status: 422, applies_to: "POST /claims/{id}/appeals" }
  - { priority: 17, category: business_constraint, check: "appeal_count < MAX_APPEALS_PER_CLAIM", error_id: ERR_APPEAL_LIMIT_REACHED, http_status: 409, applies_to: "POST /claims/{id}/appeals" }
  - { priority: 18, category: business_safety, check: "Appeal reviewer differs from original denying adjuster", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: "POST /appeals/{id}/uphold, POST /appeals/{id}/overturn" }
  - { priority: 19, category: business_constraint, check: "Giveback run requires cohort CLOSED and treaty retirement requires unattached treaty", error_id: ERR_COHORT_NOT_CLOSED, http_status: 409, applies_to: "POST /cohorts/{id}/run-giveback" }
  - { priority: 20, category: business_constraint, check: "Cause election requires cohort.status == OPEN (elections locked after close)", error_id: ERR_COHORT_CLOSED, http_status: 409, applies_to: "POST /policies/{id}/cause-election" }
  - { priority: 21, category: business_referential, check: "Treaty attach/detach requires cohort status OPEN", error_id: ERR_COHORT_CLOSED, http_status: 409, applies_to: "POST /cohorts/{id}/reinsurance" }
  - { priority: 22, category: business_temporal, check: "Lapse requires clock >= Policy.created_at + premium_grace_days of the bound quote (default 60)", error_id: ERR_LAPSE_GRACE_NOT_ELAPSED, http_status: 409, applies_to: "POST /policies/{id}/lapse" }
  - { priority: 23, category: business_constraint, check: "Malformed request body (missing required fields, bad types, out-of-range)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all endpoints" }

# =============================================================================
# §1.5 API Endpoint Table (32 endpoints)
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z (startup default, never wall-clock)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["advances logical clock; time-driven system transitions re-evaluated (quote expiry, cohort close, lapse) lazily on next read/write"]

  # --- RateFiling ---
  - method: POST
    path: "/rate-filings"
    description: "Submit a state rate filing"
    roles: [UnderwritingAdmin]
    code: 201
    input: [state_code, max_flat_fee_pct, max_flat_fee_cap_cents, filing_mode]
    output: RateFiling
    side_effects: ["status=SUBMITTED"]
  - method: GET
    path: "/rate-filings"
    description: "List rate filings"
    roles: [UnderwritingAdmin, PlatformAdmin, FinanceOps]
    code: 200
    input: ["state_code?", "status?", "limit?", "offset?"]
    output: RateFiling[]
    side_effects: []
  - method: GET
    path: "/rate-filings/{id}"
    description: "Get a rate filing"
    roles: [UnderwritingAdmin, PlatformAdmin, FinanceOps]
    code: 200
    input: []
    output: RateFiling
    side_effects: []
  - method: POST
    path: "/rate-filings/{id}/approve"
    description: "Approve a filing; supersedes prior APPROVED filing for the same state"
    roles: [UnderwritingAdmin]
    code: 200
    input: []
    output: RateFiling
    side_effects: ["status → APPROVED; sibling APPROVED filings for same state_code → SUPERSEDED"]
  - method: POST
    path: "/rate-filings/{id}/reject"
    description: "Reject a filing"
    roles: [UnderwritingAdmin]
    code: 200
    input: []
    output: RateFiling
    side_effects: ["status → REJECTED"]

  # --- FeeConfig ---
  - method: POST
    path: "/fee-configs"
    description: "Create a fee configuration (DRAFT)"
    roles: [UnderwritingAdmin]
    code: 201
    input: [state_code, filing_id, flat_fee_pct, flat_fee_cents]
    output: FeeConfig
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/fee-configs"
    description: "List fee configs"
    roles: [UnderwritingAdmin, PlatformAdmin]
    code: 200
    input: ["state_code?", "status?", "filing_id?", "limit?", "offset?"]
    output: FeeConfig[]
    side_effects: []
  - method: GET
    path: "/fee-configs/{id}"
    description: "Get a fee config"
    roles: [UnderwritingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: FeeConfig
    side_effects: []
  - method: GET
    path: "/fee-configs/{id}/policies"
    description: "List policies bound under this fee config"
    roles: [UnderwritingAdmin, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Policy[]
    side_effects: []
  - method: POST
    path: "/fee-configs/{id}/update"
    description: "Update a DRAFT fee config (OCC)"
    roles: [UnderwritingAdmin]
    code: 200
    input: ["flat_fee_pct?", "flat_fee_cents?", expected_fee_config_version]
    output: FeeConfig
    side_effects: ["increments FeeConfig.version by 1"]
  - method: POST
    path: "/fee-configs/{id}/activate"
    description: "Activate a DRAFT fee config"
    roles: [UnderwritingAdmin]
    code: 200
    input: []
    output: FeeConfig
    side_effects: ["status → ACTIVE"]
  - method: POST
    path: "/fee-configs/{id}/retire"
    description: "Retire an ACTIVE fee config"
    roles: [UnderwritingAdmin]
    code: 200
    input: []
    output: FeeConfig
    side_effects: ["status → RETIRED"]

  # --- ReinsuranceTreaty ---
  - method: POST
    path: "/reinsurance-treaties"
    description: "Create a quota-share treaty (DRAFT)"
    roles: [FinanceOps]
    code: 201
    input: [name, quota_share_pct]
    output: ReinsuranceTreaty
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/reinsurance-treaties"
    description: "List treaties"
    roles: [FinanceOps, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReinsuranceTreaty[]
    side_effects: []
  - method: POST
    path: "/reinsurance-treaties/{id}/activate"
    description: "Activate a treaty"
    roles: [FinanceOps]
    code: 200
    input: []
    output: ReinsuranceTreaty
    side_effects: ["status → ACTIVE"]
  - method: POST
    path: "/reinsurance-treaties/{id}/retire"
    description: "Retire a treaty (must not be attached)"
    roles: [FinanceOps]
    code: 200
    input: []
    output: ReinsuranceTreaty
    side_effects: ["status → RETIRED"]

  # --- Cause ---
