scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: borrower_provisional_vs_final_grade_divergence
        grounds:
          - calculations.borrower_provisional_grade
          - calculations.borrower_final_grade
          - entities.Borrower.fields.provisional_grade
          - entities.Borrower.fields.final_grade
        distinguishing_aspect: |
          Provisional grade and final grade operate on the SAME entity domain (Borrower) but use
          DIFFERENT input sets: provisional reads only Borrower.annual_revenue_cents and
          requested_amount_cents (self-reported), while final reads the attached PlaidSnapshot
          (deposits, balance, NSF, debt service). For an inflated-revenue borrower the two yield
          different grade letters, which the Listing locks via grade_at_listing = final_grade.
        test_recipe:
          setup:
            - "Create Platform with defaults (max_borrower_concentration_bps=1000)"
            - "POST /platforms/{p}/borrowers with annual_revenue_cents=1_000_000_00, requested_amount_cents=100_000_00 → expect provisional_grade='A'"
            - "POST /platforms/{p}/borrowers/{b}/plaid_snapshots with deposits_last_90d_cents=15_000_00 (low), avg_daily_balance_cents=2_000_00, nsf_count_last_90d=3, existing_debt_service_cents=2_000_00"
          trigger:
            - "GET /platforms/{p}/borrowers/{b} after snapshot attach"
          assert:
            - "Borrower.provisional_grade == 'A'"
            - "Borrower.final_grade IN {'D', 'E'} (Plaid score is materially lower)"
            - "Borrower.provisional_grade != Borrower.final_grade"

      - name: charge_off_loss_forward_vs_chronological
        grounds:
          - calculations.charge_off_loss_distribution
          - calculations.charge_off_loss_distribution.variants
          - state_machines.Loan.DEFAULT_to_CHARGED_OFF
          - entities.Loan.fields.charged_off_loss_cents
          - entities.Loan.fields.principal_outstanding_cents
        distinguishing_aspect: |
          Loss measurement operates on the Loan entity domain (distinct from grading's Borrower
          domain). Forward-looking computes loss as the amortized principal remaining at the DEFAULT
          day; chronological replays the actual Payment ledger so partial cures between DEFAULT and
          CHARGE_OFF reduce realized loss. The scaffold PINS chronological — charged_off_loss_cents
          equals principal_outstanding_cents at the CHARGE_OFF moment (post-ledger).
        test_recipe:
          setup:
            - "Originate a Loan with principal_cents=100_000, term_months=12, rate_bps=900 (grade B)"
            - "advance_clock past installments 1-2-3 with no payment → Loan transitions ACTIVE→DELINQUENT→DEFAULT"
            - "POST a partial Payment amount_cents=10_000 — applied via waterfall (see Rule 2 instance)"
            - "advance_clock until consecutive_missed_installments >= 5 → CHARGE_OFF"
          trigger:
            - "GET /platforms/{p}/loans/{l}"
          assert:
            - "Loan.charged_off_loss_cents == Loan.principal_outstanding_cents recorded JUST BEFORE the CHARGED_OFF transition (chronological, post-payment), NOT the amortized remaining at DEFAULT day (forward-looking)"
            - "Loan.charged_off_loss_cents < forward_looking_estimate (a payment occurred between DEFAULT and CHARGE_OFF)"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_interest_rate_with_term_premium_mode_a
        grounds:
          - calculations.tiered_interest_rate
          - entities.LoanListing.fields.interest_rate_bps
          - entities.LoanListing.fields.grade_at_listing
          - entities.LoanListing.fields.term_months
        distinguishing_aspect: |
          MODE (a): a formula with three inputs (grade tier, term_months, fixed BASE_BPS_TABLE) and
          NON-LINEAR interaction — tiered lookup composed with a piecewise-linear term premium that
          activates only above 24 months (max(0, term-24)*10). Linear-additive interpretation
          ignores the max() clamp at term<=24 and produces wrong rates.
        test_recipe:
          setup:
            - "Approve Borrower with final_grade='C'"
          trigger:
            - "POST /platforms/{p}/borrowers/{b}/listings with principal_cents=100_000, term_months=36 → listing created"
            - "POST a second listing (after first WITHDRAWN) with term_months=24 → second listing"
            - "POST a third listing with term_months=12"
          assert:
            - "listing_36.interest_rate_bps == 1420  (1300 + (36-24)*10)"
            - "listing_24.interest_rate_bps == 1300  (1300 + max(0,0)*10 — boundary AT 24)"
            - "listing_12.interest_rate_bps == 1300  (1300 + max(0,-12)*10 — clamped to 0, NOT negative premium)"

      - name: amortization_schedule_residual_last_installment_mode_b
        grounds:
          - calculations.monthly_amortized_payment
          - entities.Loan.fields.monthly_payment_cents
          - entities.Installment.fields.scheduled_principal_cents
          - entities.Installment.fields.scheduled_interest_cents
        distinguishing_aspect: |
          MODE (b): nested rounding where ORDER MATTERS. The scaffold pins per-installment
          round_half_up for monthly_payment_cents AND for each installment's interest, then derives
          principal as (payment - interest). Residual cents from cumulative rounding land on the
          LAST installment. 'Round at the end' (sum then round) vs 'round per installment then sum'
          produce different cents on the final installment.
        test_recipe:
          setup:
            - "Originate Loan principal_cents=100_000, term_months=12, interest_rate_bps=900"
          trigger:
            - "GET /platforms/{p}/loans/{l}/installments"
          assert:
            - "Loan.monthly_payment_cents == 8745"
            - "Installments[0..10] each have scheduled_principal + scheduled_interest == 8745"
            - "Installments[11] (last) scheduled_principal + scheduled_interest == 8748 (absorbs +3 cent residual)"
            - "sum(scheduled_principal_cents for all installments) == 100000 EXACTLY"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_delinquent_active_revert_cycle
        grounds:
          - state_machines.Loan.ACTIVE_to_DELINQUENT
          - state_machines.Loan.DELINQUENT_to_ACTIVE
          - state_machines.Loan.DELINQUENT_to_DEFAULT
          - state_machines.Loan.DELINQUENT_to_PAID_OFF
          - entities.Loan.fields.consecutive_missed_installments
        distinguishing_aspect: |
          The Loan state machine contains a CYCLIC revert path ACTIVE→DELINQUENT→ACTIVE: a borrower
          who cures all LATE installments returns to ACTIVE, then a future missed payment can
          re-enter DELINQUENT. This is non-linear (not A→B→C→…→terminal); the same node is
          reachable multiple times.
        test_recipe:
          setup:
            - "Originate Loan principal_cents=100_000, term_months=12, interest_rate_bps=900"
            - "advance_clock past installment 1's due+grace with no payment → Loan ACTIVE→DELINQUENT"
            - "Post Payment amount_cents=9999 (cures late_fee 2500 + interest 750 + principal 6749) — leaves installment 1 LATE"
          trigger:
            - "Post Payment amount_cents=2746 (enough to close installment 1: pays remaining principal residual 1246 + … actually: borrower pays full curing amount totaling 2500 + 750 + 7995 = 11245)"
          assert:
            - "After full cure: Loan.consecutive_missed_installments == 0"
            - "Loan.status returned from DELINQUENT to ACTIVE (revert)"
            - "Cycle property: the same loan_id has Loan.status='ACTIVE' at TWO distinct clock_day_index values with at least one DELINQUENT period between"

      - name: borrower_suspend_reinstate_cycle
        grounds:
          - state_machines.Borrower.APPROVED_to_SUSPENDED
          - state_machines.Borrower.SUSPENDED_to_APPROVED
          - state_machines.Borrower.APPROVED_to_BANNED
          - state_machines.Borrower.SUSPENDED_to_BANNED
        distinguishing_aspect: |
          The Borrower state machine on a DIFFERENT entity than Rule 3 instance 1 also has a cycle:
          APPROVED→SUSPENDED→APPROVED via reinstate. Plus branching: from SUSPENDED both APPROVED
          (reinstate) and BANNED (terminal) are reachable — a non-linear fork.
        test_recipe:
          setup:
            - "Borrower in APPROVED status with no CHARGED_OFF loans"
            - "POST /platforms/{p}/borrowers/{b}/suspend → status=SUSPENDED"
          trigger:
            - "POST /platforms/{p}/borrowers/{b}/reinstate"
          assert:
            - "Borrower.status == 'APPROVED' after reinstate"
            - "Subsequent POST /suspend returns 200 (cycle re-entry)"
            - "From the same SUSPENDED state, POST /ban (instead of /reinstate) would lead to terminal BANNED — branching fork confirmed"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: charge_off_cascade_depth_3
        grounds:
          - state_machines.Loan.DEFAULT_to_CHARGED_OFF
          - state_machines.Installment.LATE_to_WAIVED
          - state_machines.Investment.CONVERTED_to_LOST
          - entities.Investor.fields.outstanding_principal_cents
        distinguishing_aspect: |
          Depth-3 chain triggered by advance_clock pushing Loan DEFAULT→CHARGED_OFF.
          Link 1: clock advance → Loan.status transitions DEFAULT→CHARGED_OFF.
          Link 2: That Loan transition → each remaining Installment SCHEDULED/DUE/LATE → WAIVED.
          Link 3: That Loan transition → each CONVERTED Investment → LOST AND that Investment
          transition → Investor.outstanding_principal_cents decremented by per-investor loss share.
          Each hop is caused by the PRIOR hop, not the original clock tick directly.
        test_recipe:
          setup:
            - "Originate Loan principal_cents=100_000 with 3 CONVERTED investments shares (30%, 30%, 40%)"
            - "advance_clock past installments 1-2-3 with no payment → Loan ACTIVE→DELINQUENT→DEFAULT"
          trigger:
            - "advance_clock further until consecutive_missed_installments >= 5"
          assert:
            - "Loan.status == 'CHARGED_OFF' (link 1)"
            - "All remaining Installments have status == 'WAIVED' (link 2 caused by link 1)"
            - "All three Investments status == 'LOST' (link 3 from link 1)"
            - "Each Investor.outstanding_principal_cents decremented by their share of charged_off_loss_cents (link 3's own side-effect)"
            - "Investor_a delta == 30000, Investor_b delta == 30000, Investor_c delta == 40000 (sum == 100000)"

      - name: borrower_ban_cascade_depth_2
        grounds:
          - state_machines.Borrower.APPROVED_to_BANNED
          - state_machines.LoanListing.OPEN_to_WITHDRAWN
          - state_machines.Investment.COMMITTED_to_RELEASED
          - entities.Investor.fields.cash_balance_cents
        distinguishing_aspect: |
          Depth-2 chain originating from a DIFFERENT trigger (ComplianceOfficer ban, not clock).
          Link 1: ban → Borrower.status APPROVED→BANNED.
          Link 2: That Borrower transition → each OPEN LoanListing transitions to WITHDRAWN, AND
          that LoanListing transition itself → each COMMITTED Investment transitions to RELEASED
          with Investor.cash_balance_cents refunded. The Investment release is caused by the
          listing withdraw, not directly by the ban.
        test_recipe:
          setup:
            - "Borrower in APPROVED with one OPEN LoanListing principal=50_000_00"
            - "Investor A invested 10_000_00 (COMMITTED); cash_balance went from 100_000_00 to 90_000_00"
          trigger:
            - "POST /platforms/{p}/borrowers/{b}/ban"
          assert:
            - "Borrower.status == 'BANNED' (link 1)"
            - "LoanListing.status == 'WITHDRAWN' (link 2a caused by link 1)"
            - "Investment.status == 'RELEASED' (link 2b caused by listing transition, NOT by ban directly)"
            - "Investor.cash_balance_cents == 100_000_00 (refunded by the listing's release side-effect)"

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_constraint_payment_on_charged_off_with_zero_amount
        grounds:
          - validations[priority=4]
          - validations[priority=12]
          - errors.ERR_INVALID_STATE_TRANSITION
          - errors.ERR_LOAN_NOT_PAYABLE
        distinguishing_aspect: |
          Category pair: STATE vs BUSINESS_CONSTRAINT. Posting a Payment with amount_cents=0 on a
          CHARGED_OFF loan triggers TWO failures: priority 4 (state — loan terminal) and priority 12
          (business_constraint — amount must be positive). Per priority order, state wins:
          ERR_LOAN_NOT_PAYABLE is returned (priority 12 is the more specific business check), but
          because priority 4 ERR_INVALID_STATE_TRANSITION sits earlier the contract MUST return
          ERR_LOAN_NOT_PAYABLE only when status is non-terminal. Here we PIN: ERR_LOAN_NOT_PAYABLE
          (priority 12 specifically applies to payments on terminal loans).
        test_recipe:
          setup:
            - "Bring a Loan to CHARGED_OFF status"
          trigger:
            - "POST /platforms/{p}/loans/{l}/payments with amount_cents=0"
          assert:
            - "Response error_id == 'ERR_LOAN_NOT_PAYABLE' (priority-12 business rule wins because the priority-12 check is explicitly the one that covers terminal loans)"
            - "Response http_status == 409"
            - "NOT 'ERR_INVALID_REQUEST' (zero amount) — the loan-payability check takes precedence over the per-field amount validation per pinned priority order"

      - name: business_safety_vs_business_constraint_self_investment
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors.ERR_SEGREGATION_VIOLATION
          - errors.ERR_DIVERSIFICATION_CAP_EXCEEDED
        distinguishing_aspect: |
          A DIFFERENT category pair: BUSINESS_SAFETY (segregation) vs BUSINESS_CONSTRAINT
          (diversification). Borrower attempts to invest in their OWN listing AND the proposed
          amount exceeds the diversification cap. Two failures simultaneously — priority 5 (safety)
          wins; expected error_id is ERR_SEGREGATION_VIOLATION, NOT ERR_DIVERSIFICATION_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Create a Borrower B and create an Investor I where X-User-ID happens to equal B.id when role=Investor (or set up a user with both roles)"
            - "Open a LoanListing on B"
          trigger:
            - "POST /platforms/{p}/listings/{listingId}/investments with X-User-Role=Borrower (or with an investor configured to map to borrower B) amount_cents=999_99 (far exceeding any cap)"
          assert:
            - "Response error_id == 'ERR_SEGREGATION_VIOLATION'"
            - "Response http_status == 403"
            - "NOT 'ERR_DIVERSIFICATION_CAP_EXCEEDED' (priority 5 fires before priority 7)"

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: diversification_cap_inclusive_boundary_on_investments_endpoint
        grounds:
          - calculations.investor_diversification_check
          - validations[priority=7]
          - endpoints./platforms/{platformId}/listings/{listingId}/investments
        distinguishing_aspect: |
          Numeric-threshold boundary at EXACTLY the cap. Investor with committed_capital_cents=
          10_000_00 and max_borrower_concentration_bps=1000 has cap_cents=100000. Investment of
          exactly 100000 cents to a single borrower MUST be allowed ('<=' is inclusive); 100001
          cents MUST be rejected. The metric is investor-borrower exposure; the endpoint is
          POST /investments.
        test_recipe:
          setup:
            - "Platform with max_borrower_concentration_bps=1000"
            - "Investor I with committed_capital_cents=10_000_00, cash_balance_cents=10_000_00"
            - "Borrower B with one OPEN LoanListing principal=500_000_00"
          trigger:
            - "POST /investments amount_cents=100_000 (== cap exactly) → expect 201"
            - "POST /investments amount_cents=100 (would push exposure to 100_100 > 100_000) → expect 409"
          assert:
            - "First investment.status == 'COMMITTED' (boundary inclusive: 100000 cents allowed)"
            - "Second response error_id == 'ERR_DIVERSIFICATION_CAP_EXCEEDED'"
            - "After failure, Investor.cash_balance_cents unchanged from after the first investment"

      - name: empty_pledged_listing_expiration_zero_count_on_advance_clock
        grounds:
          - state_machines.LoanListing.OPEN_to_EXPIRED
          - entities.LoanListing.fields.pledged_cents
          - entities.LoanListing.fields.funding_deadline_day_index
          - endpoints./platforms/{platformId}/advance_clock
        distinguishing_aspect: |
          A DIFFERENT metric: empty-collection / zero-count boundary on advance_clock. A LoanListing
          with pledged_cents == 0 (no investments at all) at the moment Platform.clock_day_index
          crosses funding_deadline_day_index MUST transition OPEN→EXPIRED with no investments to
          refund. The zero-pledge boundary tests the EMPTY-SET path of the EXPIRED transition's
          'refund all COMMITTED investments' side effect (the iteration over an empty list).
        test_recipe:
          setup:
            - "Platform.clock_day_index = 0"
            - "Open a LoanListing → funding_deadline_day_index = 14, pledged_cents=0 (no investments)"
          trigger:
            - "POST /platforms/{p}/advance_clock with days=14 → clock_day_index=14 (boundary, equal)"
            - "Inspect listing — should still be OPEN (boundary uses '>')"
            - "POST /platforms/{p}/advance_clock with days=1 → clock_day_index=15 (one past deadline)"
          assert:
            - "After 14-day advance: LoanListing.status == 'OPEN' (boundary: '>' strict, so at exactly the deadline still open)"
            - "After 15-day advance: LoanListing.status == 'EXPIRED'"
            - "No Investment records were modified (empty-set iteration produced no errors)"

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: listing_originate_requires_borrower_approved
        grounds:
          - state_machines.LoanListing.FUNDED_to_ORIGINATED
          - state_machines.Borrower
          - errors.ERR_BORROWER_NOT_APPROVED
          - entities.Borrower.fields.status
        distinguishing_aspect: |
          Entity pair LoanListing→Borrower. Listing transition FUNDED→ORIGINATED requires
          Borrower.status == APPROVED at the originate moment. If the borrower was suspended after
          listing was funded but before originate, originate MUST fail with ERR_BORROWER_NOT_APPROVED.
        test_recipe:
          setup:
            - "Borrower B in APPROVED, LoanListing fully FUNDED"
            - "POST /borrowers/{B}/suspend → B.status=SUSPENDED"
          trigger:
            - "POST /listings/{L}/originate"
          assert:
            - "Response error_id == 'ERR_BORROWER_NOT_APPROVED'"
            - "LoanListing.status remains 'FUNDED' (transition refused)"
            - "No Loan entity created"

      - name: disclosure_publish_requires_subject_state_stable
        grounds:
          - state_machines.Disclosure.DRAFT_to_PUBLISHED
          - validations[priority=13]
          - errors.ERR_DISCLOSURE_STALE
          - entities.Disclosure.fields.subject_type
          - entities.Disclosure.fields.subject_id
        distinguishing_aspect: |
          A DIFFERENT entity pair: Disclosure→subject (Loan/Listing/Borrower). A DEFAULT_NOTICE
          disclosure was emitted while Loan.status was DEFAULT. If the loan progresses to
          CHARGED_OFF before the officer publishes, the DRAFT is stale: ERR_DISCLOSURE_STALE.
          Cross-entity reference is via Disclosure.subject_type + subject_id, with the staleness
          check comparing the subject's current state against the kind's expected state.
        test_recipe:
          setup:
            - "Loan in DEFAULT status; system emitted Disclosure { kind=DEFAULT_NOTICE, subject_type=LOAN, subject_id=L }"
            - "advance_clock further until Loan transitions to CHARGED_OFF (new disclosure CHARGE_OFF_NOTICE emitted)"
          trigger:
            - "POST /disclosures/{originalDefaultNoticeId}/publish"
          assert:
            - "Response error_id == 'ERR_DISCLOSURE_STALE'"
            - "Disclosure.published == false (DRAFT unchanged)"
            - "The CHARGE_OFF_NOTICE disclosure (still DRAFT) IS publishable (subject state matches)"

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: borrower_one_open_listing_at_a_time_singleton_interval
        grounds:
          - validations[priority=10]
          - errors.ERR_BORROWER_NOT_LISTABLE
          - entities.LoanListing.fields.status
          - entities.LoanListing.fields.funding_deadline_day_index
        distinguishing_aspect: |
          SINGLETON-occupation interval semantics on the Borrower resource. A Borrower can hold AT
          MOST ONE LoanListing in {OPEN, FUNDED} at any time. The 'interval' here is the active
          lifetime of a listing on the borrower; adjacency is fine (you may open a new listing the
          instant the prior one terminates). Differs from instance 2 because adjacency is allowed
          and the interval is unbounded above (no fixed-length window).
        test_recipe:
          setup:
            - "Borrower B in APPROVED"
            - "POST /borrowers/{B}/listings (listing_1) → OPEN"
          trigger:
            - "POST /borrowers/{B}/listings (listing_2) while listing_1 is still OPEN"
            - "POST /listings/{listing_1}/withdraw → listing_1 WITHDRAWN"
            - "POST /borrowers/{B}/listings (listing_3) immediately after withdraw (same clock_day_index — adjacency)"
          assert:
            - "Second POST (during listing_1 OPEN): error_id == 'ERR_BORROWER_NOT_LISTABLE'"
            - "Third POST (after withdraw, same day): 201 — adjacency ALLOWED because the prior listing is in WITHDRAWN (terminal) at that exact clock_day_index"

      - name: investor_per_borrower_exposure_aggregate_capacity_interval
        grounds:
          - calculations.investor_diversification_check
          - validations[priority=7]
          - errors.ERR_DIVERSIFICATION_CAP_EXCEEDED
          - entities.Investment.fields.status
        distinguishing_aspect: |
          A DIFFERENT 'interval' semantic: AGGREGATE-CAPACITY across all of one investor's active
          Investments on a single borrower. Two investments on the SAME borrower 'overlap' (both
          active simultaneously); their summed amount_cents must stay <= cap_cents. Unlike instance
          1's singleton, this rule allows MANY overlapping intervals so long as the aggregate sum
          fits the cap. Sits on a different resource entity (Investor) and uses sum-aggregation,
          not interval count.
        test_recipe:
          setup:
            - "Platform with max_borrower_concentration_bps=1000"
            - "Investor I with committed_capital_cents=10_000_00 → cap=100_000 cents"
            - "Borrower B with two OPEN listings (listing_x, listing_y)"
            - "POST /investments on listing_x amount_cents=60_000 (status COMMITTED) — exposure 60_000"
          trigger:
            - "POST /investments on listing_y amount_cents=40_000 (would bring exposure to exactly 100_000 == cap)"
            - "POST /investments on listing_y amount_cents=100 (would bring exposure to 100_100 > cap)"
          assert:
            - "First overlapping investment (40_000 cents) succeeds — boundary inclusive"
            - "Second attempt (100 cents) error_id == 'ERR_DIVERSIFICATION_CAP_EXCEEDED'"
            - "Aggregate of two overlapping CONVERTED+COMMITTED investments on same borrower == 100_000 cents (not rejected for count, only for sum)"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: invest_then_listing_withdraw_preserves_investor_cash_balance
        grounds:
          - state_machines.Investment.COMMITTED_to_RELEASED
          - state_machines.LoanListing.OPEN_to_WITHDRAWN
          - entities.Investor.fields.cash_balance_cents
          - endpoints./platforms/{platformId}/investors/{investorId}/deposits
        distinguishing_aspect: |
          CONSERVED QUANTITY: Investor.cash_balance_cents (cash). Forward action: POST /investments
          debits cash by amount_cents. Compensating action: listing withdraw triggers Investment
          COMMITTED→RELEASED, which refunds amount_cents. INVARIANT (explicit formula over fields):
          Investor.cash_balance_cents AFTER withdraw == Investor.cash_balance_cents BEFORE the
          investment, for EVERY pair of (invest, withdraw) on the same investor.
        test_recipe:
          setup:
            - "Investor I with cash_balance_cents = 50_000_00 after a deposit"
            - "OPEN listing on Borrower B"
          trigger:
            - "POST /investments amount_cents=10_000 → COMMITTED"
            - "POST /listings/{L}/withdraw"
          assert:
            - "After invest: Investor.cash_balance_cents == 50_000_00 - 10_000 == 4_990_000"
            - "After withdraw: Investor.cash_balance_cents == 50_000_00 (forward + compensating leaves cash unchanged from baseline)"
            - "Investment.status == 'RELEASED' (compensating action terminal)"
            - "Invariant formula: cash_after_withdraw == cash_before_invest exactly, integer cents"

      - name: charge_off_distribution_preserves_total_loss
        grounds:
          - calculations.charge_off_loss_distribution
          - state_machines.Loan.DEFAULT_to_CHARGED_OFF
          - state_machines.Investment.CONVERTED_to_LOST
          - entities.Loan.fields.charged_off_loss_cents
          - entities.Investor.fields.outstanding_principal_cents
        distinguishing_aspect: |
          A DIFFERENT conserved quantity: TOTAL LOSS DISTRIBUTED (principal). When Loan → CHARGED_OFF,
          the per-investor decrements of outstanding_principal_cents MUST sum exactly to
          Loan.charged_off_loss_cents (no cent disappears or duplicates). The residual rounding cent
          is pinned to the LAST investor (created_at DESC tail). INVARIANT formula:
          sum_over_investors(delta_outstanding_principal_cents) == Loan.charged_off_loss_cents.
        test_recipe:
          setup:
            - "Originate Loan with principal_cents=100_000 and three CONVERTED investments shares 30%, 30%, 40% (created_at order A, B, C)"
