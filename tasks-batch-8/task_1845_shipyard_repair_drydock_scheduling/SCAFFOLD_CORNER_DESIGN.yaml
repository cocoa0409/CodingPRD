              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/award"
              as: CommercialApprover
              as_user_id: "comm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v: $.data.version }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-20T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r_id: $.data.id }
            - call: "POST /v1/dock-reservations/${r_id}/activate"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v2: $.data.version }
            - call: "POST /v1/change-orders"
              payload: { project_id: "${p_id}", expected_project_version: "${p_v2}", description: "Engine room piping growth", trade_code: "PIPING", pricing_mode: "TIME_AND_MATERIALS", duration_days: 5, schedule_delta_days: 2, estimated_hours: 520, hourly_rate_cents: 9600, materials_cost_cents: 100000 }
