              as: RegistryAdmin
              captures: { st: $.data.status, issued: $.data.issued_on, exp: $.data.expires_on, lapse: $.data.lapse_deadline, rc: $.data.renewed_count, ver: $.data.version }
          assert:
            - "201; status == ACTIVE; version == 1; renewed_count == 0"
            - "issued_on == 2026-09-04T00:00:00Z; expires_on == 2028-09-04T00:00:00Z; lapse_deadline == 2032-09-04T00:00:00Z"

      - name: clock_default_is_2026_09_01
        claim_type: system_fields
        grounds: [endpoints.POST_/_clock/set_current_utc]
        distinguishing_aspect: "Without any set_current_utc call the logical clock reads exactly 2026-09-01T00:00:00Z — the ATT minted at approval proves the default (issued_on and expires_on are literal-pinnable)."
        test_recipe:
          setup: ["entire chain executed without ever calling the clock endpoint"]
          setup_api_calls:
            - call: "POST /registry/level-definitions"
              payload: { code: "EMT", display_name: "Emergency Medical Technician", scope_summary: "BLS", cognitive_cut_score: 0.66, ce_total_hours: 40, ce_national_min_hours: 20, ce_local_min_hours: 10, ce_individual_min_hours: 10, hourly_model_total_hours: 40, remedial_hours_required: 20, refresher_hours_required: 24, initial_application_fee_cents: 9800, recert_application_fee_cents: 4500 }
              as: RegistryAdmin
              captures: { lv: $.data.id }
            - call: "POST /registry/candidates"
              payload: { full_name: "Default Dan", email: "dan@example.com" }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /registry/education-programs"
              payload: { name: "County EMT Academy", level_id: "${lv}", director_user_id: "dir-1" }
              as: RegistryAdmin
              captures: { p: $.data.id }
            - call: "POST /registry/program-completion-records"
              payload: { candidate_id: "${c}", program_id: "${p}", completion_date: "2026-09-01" }
              as: ProgramDirector
              as_user_id: "dir-1"
              captures: { rec: $.data.id }
            - { call: "POST /registry/program-completion-records/${rec}/decision", payload: { outcome: "VERIFIED" }, as: RegistryAdmin }
            - call: "POST /registry/exam-applications"
              payload: { level_id: "${lv}", completion_record_id: "${rec}" }
              as: Candidate
              as_user_id: "${c}"
              captures: { app: $.data.id }
          trigger:
            - call: "POST /registry/exam-applications/${app}/decision"
              payload: { outcome: "APPROVED" }
              as: RegistryAdmin
              captures: { att: $.data.att_id }
            - call: "GET /registry/authorizations-to-test"
              payload: { exam_application_id: "${app}" }
              as: RegistryAdmin
              captures: { issued: "$.data[0].issued_on", exp: "$.data[0].expires_on" }
          assert:
            - "ATT issued_on == 2026-09-01T00:00:00Z (server startup default, no wall-clock fallback)"
            - "ATT expires_on == 2026-11-30T00:00:00Z (issued_on + 90 days)"

      - name: pagination_limit_offset
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoints honor the envelope's pagination contract: limit/offset windowing with total_count and has_more."
        test_recipe:
          setup: ["three state policies created (OR, WA, TX)"]
          setup_api_calls:
            - call: "POST /registry/state-adoption-policies"
              payload: { state_code: "OR", adoption_mode: "NREMT_ACCEPTED", accepted_level_codes: ["EMT"], base_license_fee_cents: 12000 }
              as: RegistryAdmin
            - call: "POST /registry/state-adoption-policies"
              payload: { state_code: "WA", adoption_mode: "NREMT_ACCEPTED", accepted_level_codes: ["EMT"], base_license_fee_cents: 9990, national_verification_surcharge_cents: 9990 }
              as: RegistryAdmin
            - call: "POST /registry/state-adoption-policies"
              payload: { state_code: "TX", adoption_mode: "STATE_EXAM", base_license_fee_cents: 10000, state_exam_fee_cents: 2500 }
              as: RegistryAdmin
          trigger:
            - call: "GET /registry/state-adoption-policies"
              payload: { limit: 2, offset: 0 }
              as: RegistryAdmin
            - call: "GET /registry/state-adoption-policies"
              payload: { limit: 2, offset: 2 }
              as: RegistryAdmin
          assert:
            - "Page 1 (limit=2, offset=0): data has 2 rows, total_count == 3, has_more == true"
            - "Page 2 (limit=2, offset=2): data has 1 row, total_count == 3, has_more == false"

