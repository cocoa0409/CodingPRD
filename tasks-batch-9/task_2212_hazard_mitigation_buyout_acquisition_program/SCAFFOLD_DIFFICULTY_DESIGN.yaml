  - rule_id: boundary_precision_check
    instances:

      - name: benefit_cost_ratio_exactly_one_point_zero_permits_approval
        grounds:
          - calculations.benefit_cost_ratio
          - global_constants.BCR_APPROVAL_THRESHOLD
          - validations.priority_47
          - entities.MitigationProject.fields.validated_bcr
          - state_machines.MitigationProject.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Exact-equality boundary on a STRICT inequality: priority 47 fails only when
          validated_bcr < 1.0, so a project whose bcr is exactly 1.000 (45000000 benefits over
          45000000 cost) must be APPROVED while an otherwise identical project at 0.667 must be
          refused. An implementation using <= instead of < denies the first project.
        test_recipe:
          setup:
            - "Project AT-THRESHOLD in SUBMITTED with a VALIDATED PRE_CALCULATED_BENEFIT analysis: annualized_loss_avoided_cents 1500000, project_useful_life_years 30, mitigation_cost_cents 45000000."
            - "Project BELOW-THRESHOLD in SUBMITTED, identical except annualized_loss_avoided_cents 1000000."
            - "Each project was validated by pa-validator, so pa-approver is required by SoD-2."
          setup_api_calls:
            - call: "POST /mitigation-projects"
              payload: { project_code: "AT-THRESHOLD", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj_at: $.data.id }
            - call: "POST /mitigation-projects/${proj_at}/benefit-cost-analyses"
              payload: { project_id: "${proj_at}", analysis_method: "PRE_CALCULATED_BENEFIT", hazard_type: "RIVERINE_FLOOD", sfha_zone: "AE", annualized_loss_avoided_cents: 1500000, project_useful_life_years: 30, mitigation_cost_cents: 45000000 }
              as: SubrecipientCoordinator
              as_user_id: "${proj_at}"
              captures: { bca_at: $.data.id }
            - call: "POST /benefit-cost-analyses/${bca_at}/validate"
              payload: { bca_id: "${bca_at}", decision: "VALIDATE" }
              as: ProgramAdministrator
              as_user_id: "pa-validator"
            - call: "POST /mitigation-projects/${proj_at}/submit"
              payload: { project_id: "${proj_at}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj_at}"
            - call: "POST /mitigation-projects"
              payload: { project_code: "BELOW-THRESHOLD", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj_below: $.data.id }
            - call: "POST /mitigation-projects/${proj_below}/benefit-cost-analyses"
              payload: { project_id: "${proj_below}", analysis_method: "PRE_CALCULATED_BENEFIT", hazard_type: "RIVERINE_FLOOD", sfha_zone: "AE", annualized_loss_avoided_cents: 1000000, project_useful_life_years: 30, mitigation_cost_cents: 45000000 }
              as: SubrecipientCoordinator
              as_user_id: "${proj_below}"
              captures: { bca_below: $.data.id }
            - call: "POST /benefit-cost-analyses/${bca_below}/validate"
              payload: { bca_id: "${bca_below}", decision: "VALIDATE" }
              as: ProgramAdministrator
              as_user_id: "pa-validator"
            - call: "POST /mitigation-projects/${proj_below}/submit"
              payload: { project_id: "${proj_below}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj_below}"
          trigger:
            - call: "POST /mitigation-projects/${proj_at}/approve"
              payload: { project_id: "${proj_at}", decision: "APPROVE" }
              as: ProgramAdministrator
              as_user_id: "pa-approver"
            - call: "POST /mitigation-projects/${proj_below}/approve"
              payload: { project_id: "${proj_below}", decision: "APPROVE" }
              as: ProgramAdministrator
              as_user_id: "pa-approver"
          assert:
            - "BenefitCostAnalysis.${bca_at}.npv_benefits_cents == 45000000"
            - "BenefitCostAnalysis.${bca_at}.bcr == 1.000"
            - "BenefitCostAnalysis.${bca_below}.npv_benefits_cents == 30000000"
            - "BenefitCostAnalysis.${bca_below}.bcr == 0.667"
            - "the first trigger call returns 200 and MitigationProject.${proj_at}.status == APPROVED"
            - "MitigationProject.${proj_at}.validated_bcr == 1.000"
            - "MitigationProject.${proj_at}.validated_bca_method == PRE_CALCULATED_BENEFIT"
            - "MitigationProject.${proj_at}.validated_by_user_id == pa-validator"
            - "the second trigger call returns 422 and data.error_id == ERR_BCR_BELOW_THRESHOLD"
            - "MitigationProject.${proj_below}.status == SUBMITTED"

      - name: debris_diversion_rounds_up_to_the_minimum_before_the_gate_compares
        grounds:
          - calculations.debris_diversion_pct
          - global_constants.MIN_DIVERSION_PCT
          - validations.priority_53
          - entities.DemolitionWorkOrder.fields.diversion_pct
          - state_machines.DemolitionWorkOrder.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Rounding-before-comparison boundary, not an equality boundary: the raw ratio
          25.00 / 100.02 is 24.995001 percent, STRICTLY BELOW the 25.0 minimum, yet it rounds
          half-up to 25.00 at 2 decimals and therefore PASSES, while 25.00 / 100.04 is 24.990004,
          rounds to 24.99 and FAILS. An implementation that compares the unrounded ratio rejects
          the first work order.
        test_recipe:
          setup:
            - "One MitigationProject in DRAFT with two parcels."
            - "Two ACTIVE asbestos-certified DemolitionContractors, one per work order, so the buffered-window capacity check never fires."
            - "Two DemolitionWorkOrders, both IN_PROGRESS with asbestos_survey_status CLEARED and all four utility disconnections CONFIRMED."
          setup_api_calls:
            - call: "POST /mitigation-projects"
              payload: { project_code: "DIVERSION-EDGE", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj: $.data.id }
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-D1", site_address: "401 River Rd", acreage: 0.30, occupancy_type: "VACANT", structure_type: "SINGLE_FAMILY" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { pa: $.data.id }
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-D2", site_address: "403 River Rd", acreage: 0.30, occupancy_type: "VACANT", structure_type: "SINGLE_FAMILY" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { pb: $.data.id }
            - call: "POST /demolition-contractors"
              payload: { name: "Alpha Wrecking", license_no: "DEM-A", asbestos_certified: true, max_concurrent_work_orders: 1 }
              as: ProgramAdministrator
