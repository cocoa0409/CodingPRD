      - name: expired_due_diligence_beats_pretreatment_requirement
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_SUPPLIER_DUE_DILIGENCE_EXPIRED]
          - errors[ERR_PRETREATMENT_REQUIRED]
          - calculations.pretreatment_tier_and_fee
        distinguishing_aspect: |
          The same request changes its error identity when only the clock moves. A high-FFA TALLOW lot sitting in
          PRETREAT_REQUIRED behind a supplier verified for one month yields ERR_PRETREATMENT_REQUIRED while the
          due-diligence certificate is live, and ERR_SUPPLIER_DUE_DILIGENCE_EXPIRED once the clock passes
          dd_expires_at — priority 10 pre-empting priority 11 with no change to the payload, the lot or the run.
        test_recipe:
          setup:
            - "HTU-1 with an approved catalyst-change window and one ACTIVE charge."
            - "A TALLOW supplier verified with valid_months 1 at the 2026-08-01T00:00:00Z clock, so dd_expires_at is 2026-08-31T00:00:00Z."
            - "One 300.000 MT TALLOW lot whose quality test (ffa 6.00) leaves it in PRETREAT_REQUIRED at tier HEAVY."
