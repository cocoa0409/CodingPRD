              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /ca/domain-authorizations"
              payload: { subscriber_id: "${sub_id}", profile_id: "${profile_id}", domain_name: "www.allowed.example", method: "TLS_ALPN" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { auth_id: $.data.id, auth_token: $.data.challenge_token, auth_state: $.data.state, auth_expires: $.data.expires_at }
            - call: "POST /ca/domain-authorizations/${auth_id}/validate"
