scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: match_variance_two_way_vs_three_way_basis_diverges
        grounds:
          - calculations.match_variance
          - entities.Invoice.fields.variance_cents
          - entities.PurchaseOrder.fields.received_amount_cents
          - state_machines.Invoice.CAPTURED_to_MATCHED
        distinguishing_aspect: |
          The same invoice amount (90000) against the same ordered PO (100000) yields
          variance -10000 under the TWO_WAY (ordered) basis but 0 under the THREE_WAY
          (received=90000) basis — divergence lives on the Invoice/PurchaseOrder domain.
        test_recipe:
          setup:
            - "Vendor ACH, no discount; PO ordered 100000 coded to postable GL 5000."
            - "One PO has zero POSTED receipts (TWO_WAY); a sibling PO has a POSTED receipt of 90000 (THREE_WAY)."
            - "Two invoices, each one line of 90000, one per PO."
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
              captures: { gl: $.data.code }
            - call: "POST /ap/vendors"
              payload: { legal_name: "Acme", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/purchase-orders"
              payload: { vendor_id: "${ven}", gl_account_code: "5000", ordered_amount_cents: 100000 }
              as: APManager
              captures: { po_two: $.data.id }
            - call: "POST /ap/purchase-orders"
              payload: { vendor_id: "${ven}", gl_account_code: "5000", ordered_amount_cents: 100000 }
              as: APManager
              captures: { po_three: $.data.id }
            - call: "POST /ap/goods-receipts"
              payload: { po_id: "${po_three}", received_amount_cents: 90000, received_date: "2026-05-01", coverage_days: 5 }
              as: APClerk
              captures: { gr: $.data.id }
            - call: "POST /ap/goods-receipts/${gr}/post"
              payload: {}
              as: APClerk
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", po_id: "${po_two}", invoice_number: "INV-2W", invoice_date: "2026-05-10" }
              as: APClerk
              captures: { inv_two: $.data.id }
            - call: "POST /ap/invoices/${inv_two}/lines"
              payload: { gl_account_code: "5000", amount_cents: 90000, description: "line" }
              as: APClerk
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", po_id: "${po_three}", invoice_number: "INV-3W", invoice_date: "2026-05-10" }
              as: APClerk
              captures: { inv_three: $.data.id }
            - call: "POST /ap/invoices/${inv_three}/lines"
              payload: { gl_account_code: "5000", amount_cents: 90000, description: "line" }
              as: APClerk
          trigger:
            - call: "POST /ap/invoices/${inv_two}/code"
              payload: {}
              as: APClerk
              captures: { st2: $.data.status, var2: $.data.variance_cents }
            - call: "POST /ap/invoices/${inv_three}/code"
              payload: {}
              as: APClerk
              captures: { st3: $.data.status, var3: $.data.variance_cents }
          assert:
            - "Invoice.${inv_two}.variance_cents == -10000"
            - "Invoice.${inv_two}.match_type == TWO_WAY"
            - "Invoice.${inv_two}.status == CODING_REVIEW"
            - "Invoice.${inv_three}.variance_cents == 0"
            - "Invoice.${inv_three}.match_type == THREE_WAY"
            - "Invoice.${inv_three}.status == MATCHED"

      - name: accrual_estimate_vs_final_true_up_diverges
        grounds:
          - calculations.accrual_amount
          - entities.Accrual.fields.estimated_cents
          - entities.Accrual.fields.final_cents
          - state_machines.PaymentBatch.RELEASED_to_SETTLED
        distinguishing_aspect: |
          On the Accrual domain, ESTIMATE booked when received=100000/matched=0 yields
          100000, but FINAL recomputed after an invoice matches (matched=100500) yields
          0 — same formula, two snapshot times, different result.
        test_recipe:
          setup:
            - "Vendor ACH; PO ordered 100000 with a POSTED receipt of 100000 and zero matched invoices at booking."
            - "An accrual is booked (estimated_cents=100000), then an invoice of 100500 is matched (matched_amount_cents=100500), then the accrual is reversed."
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Acme", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/purchase-orders"
              payload: { vendor_id: "${ven}", gl_account_code: "5000", ordered_amount_cents: 100000 }
              as: APManager
              captures: { po: $.data.id }
            - call: "POST /ap/goods-receipts"
              payload: { po_id: "${po}", received_amount_cents: 100000, received_date: "2026-05-01", coverage_days: 5 }
              as: APClerk
              captures: { gr: $.data.id }
            - call: "POST /ap/goods-receipts/${gr}/post"
              payload: {}
              as: APClerk
            - call: "POST /ap/accruals"
              payload: { po_id: "${po}", period_label: "2026-05", period_start: "2026-05-01", period_end: "2026-05-31" }
              as: APManager
              captures: { acc: $.data.id, est: $.data.estimated_cents }
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", po_id: "${po}", invoice_number: "INV-ACC", invoice_date: "2026-05-10" }
              as: APClerk
              captures: { inv: $.data.id }
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 100500, description: "line" }
              as: APClerk
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: APClerk
              captures: { inv_status: $.data.status }
          trigger:
            - call: "POST /ap/accruals/${acc}/reverse"
              payload: {}
              as: APManager
              captures: { fin: $.data.final_cents }
          assert:
            - "Accrual.${acc}.estimated_cents == 100000"
            - "Accrual.${acc}.final_cents == 0"
            - "Accrual.${acc}.status == REVERSED"
            - "Invoice.${inv}.status == MATCHED"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: match_variance_tolerance_nonlinear_mode_a
        grounds:
          - calculations.match_variance
          - entities.PurchaseOrder.fields.ordered_amount_cents
          - entities.PurchaseOrder.fields.received_amount_cents
        distinguishing_aspect: |
          Mode (a): tolerance = max(ABS_TOLERANCE_CENTS, round(ordered*PCT)) feeds a
          conditional branch on match_type that selects the variance basis — three
          inputs (ordered, received, match_type) interact non-linearly via nested max
          and a branch, not a single linear formula.
        test_recipe:
          setup:
            - "Vendor ACH; PO ordered 100000, POSTED receipt 100000 (THREE_WAY)."
            - "Invoice of 102100 coded: variance 2100 vs tolerance max(1000, round(100000*0.02))=2000 -> breach."
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Acme", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/purchase-orders"
              payload: { vendor_id: "${ven}", gl_account_code: "5000", ordered_amount_cents: 100000 }
              as: APManager
              captures: { po: $.data.id }
            - call: "POST /ap/goods-receipts"
              payload: { po_id: "${po}", received_amount_cents: 100000, received_date: "2026-05-01", coverage_days: 5 }
              as: APClerk
              captures: { gr: $.data.id }
            - call: "POST /ap/goods-receipts/${gr}/post"
              payload: {}
              as: APClerk
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", po_id: "${po}", invoice_number: "INV-TOL", invoice_date: "2026-05-10" }
              as: APClerk
              captures: { inv: $.data.id }
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 102100, description: "line" }
              as: APClerk
          trigger:
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: APClerk
              captures: { st: $.data.status, var: $.data.variance_cents }
          assert:
            - "Invoice.${inv}.variance_cents == 2100"
            - "Invoice.${inv}.status == CODING_REVIEW"

      - name: batch_total_sum_of_rounded_not_round_of_sum_mode_b
        grounds:
          - calculations.batch_total
          - calculations.early_pay_discount
          - entities.PaymentBatch.fields.total_disbursed_cents
          - entities.Payment.fields.net_amount_cents
        distinguishing_aspect: |
          Mode (b): each Payment net is rounded once at add-time (round(2525*0.02)=51 ->
          net 2474); the batch sums the rounded integers (4948). Round-of-sum would be
          gross 5050, round(101)=101, net 4949 — the pinned sum-of-rounded order yields
          4948, one cent different.
        test_recipe:
          setup:
            - "Vendor ACH, early_pay_terms_pct 0.02, window 30 days; run_date inside window."
            - "Two APPROVED invoices each total 2525, added to one ACH batch -> each net 2474."
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Disc", payment_method: "ACH", early_pay_terms_pct: 0.02, early_pay_window_days: 30, net_terms_days: 60 }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/approval-routes"
              payload: { min_amount_cents: 0, max_amount_cents: 1000000000, required_levels: 1 }
              as: APManager
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "NP-A", invoice_date: "2026-05-01" }
              as: APClerk
              captures: { inv_a: $.data.id }
            - call: "POST /ap/invoices/${inv_a}/lines"
              payload: { gl_account_code: "5000", amount_cents: 2525, description: "a" }
              as: APClerk
            - call: "POST /ap/invoices/${inv_a}/code"
              payload: {}
              as: APClerk
            - call: "POST /ap/invoices/${inv_a}/submit-approval"
              payload: {}
              as: APClerk
            - call: "GET /ap/invoices/${inv_a}/approval-steps"
              payload: {}
              as: APManager
              captures: { step_a: "$.data[0].id" }
            - call: "POST /ap/approval-steps/${step_a}/approve"
              payload: {}
              as: Approver
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "NP-B", invoice_date: "2026-05-01" }
              as: APClerk
              captures: { inv_b: $.data.id }
            - call: "POST /ap/invoices/${inv_b}/lines"
              payload: { gl_account_code: "5000", amount_cents: 2525, description: "b" }
              as: APClerk
            - call: "POST /ap/invoices/${inv_b}/code"
              payload: {}
              as: APClerk
            - call: "POST /ap/invoices/${inv_b}/submit-approval"
              payload: {}
              as: APClerk
            - call: "GET /ap/invoices/${inv_b}/approval-steps"
              payload: {}
              as: APManager
              captures: { step_b: "$.data[0].id" }
            - call: "POST /ap/approval-steps/${step_b}/approve"
              payload: {}
              as: Approver
            - call: "POST /ap/payment-batches"
              payload: { payment_method: "ACH", run_date: "2026-05-10" }
              as: APManager
              captures: { batch: $.data.id }
            - call: "POST /ap/payment-batches/${batch}/payments"
              payload: { invoice_id: "${inv_a}" }
              as: APManager
              captures: { pay_a: $.data.id, net_a: $.data.net_amount_cents }
          trigger:
            - call: "POST /ap/payment-batches/${batch}/payments"
              payload: { invoice_id: "${inv_b}" }
              as: APManager
              captures: { pay_b: $.data.id, net_b: $.data.net_amount_cents }
          assert:
            - "Payment.${pay_a}.net_amount_cents == 2474"
            - "Payment.${pay_b}.net_amount_cents == 2474"
            - "PaymentBatch.${batch}.total_disbursed_cents == 4948"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: invoice_coding_review_revision_cycle
        grounds:
          - state_machines.Invoice.CAPTURED_to_CODING_REVIEW
          - state_machines.Invoice.CODING_REVIEW_to_MATCHED
          - state_machines.MatchException.PENDING_to_RESOLVED
        distinguishing_aspect: |
          Cycle on Invoice: CAPTURED -> (breach) CODING_REVIEW -> (exception resolved)
          MATCHED — the invoice loops back through CODING_REVIEW and forward again, not
          a one-way A->B->C pipeline.
        test_recipe:
          setup:
            - "Vendor ACH; PO ordered 100000, POSTED receipt 80000 (THREE_WAY)."
            - "Invoice 100000 coded once -> breach var 20000 -> CODING_REVIEW + PENDING QTY_VARIANCE exception."
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Acme", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/purchase-orders"
              payload: { vendor_id: "${ven}", gl_account_code: "5000", ordered_amount_cents: 100000 }
              as: APManager
              captures: { po: $.data.id }
            - call: "POST /ap/goods-receipts"
              payload: { po_id: "${po}", received_amount_cents: 80000, received_date: "2026-05-01", coverage_days: 5 }
              as: APClerk
              captures: { gr: $.data.id }
            - call: "POST /ap/goods-receipts/${gr}/post"
              payload: {}
              as: APClerk
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", po_id: "${po}", invoice_number: "INV-CYC", invoice_date: "2026-05-10" }
              as: APClerk
              captures: { inv: $.data.id }
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 100000, description: "line" }
              as: APClerk
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: APClerk
              captures: { st1: $.data.status }
            - call: "GET /ap/invoices/${inv}/match-exceptions"
              payload: {}
              as: APClerk
              captures: { exc: "$.data[0].id", exc_reason: "$.data[0].reason" }
            - call: "POST /ap/match-exceptions/${exc}/resolve"
              payload: {}
              as: APClerk
          trigger:
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: APClerk
              captures: { st2: $.data.status }
          assert:
            - "Invoice.${inv}.status == MATCHED"
            - "MatchException.${exc}.reason == QTY_VARIANCE"
            - "MatchException.${exc}.resolution == RESOLVED"

      - name: match_exception_branch_writeoff_vs_escalate
        grounds:
          - state_machines.MatchException.PENDING_to_WRITTEN_OFF
          - state_machines.MatchException.PENDING_to_ESCALATED
          - entities.MatchException.fields.resolution
        distinguishing_aspect: |
          Branching on MatchException: from PENDING, a small variance (4000) branches to
          WRITTEN_OFF (side-effect zeroes Invoice.variance_cents) while a large variance
          (20000) on a different exception branches to ESCALATED (no variance change) —
          divergent side-effect sets per branch.
        test_recipe:
          setup:
            - "Two TWO_WAY invoices: one breach 4000 (writeoff-eligible), one breach 20000 (escalate-only); each yields a PENDING exception."
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Acme", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/purchase-orders"
              payload: { vendor_id: "${ven}", gl_account_code: "5000", ordered_amount_cents: 100000 }
              as: APManager
              captures: { po_s: $.data.id }
            - call: "POST /ap/purchase-orders"
              payload: { vendor_id: "${ven}", gl_account_code: "5000", ordered_amount_cents: 100000 }
              as: APManager
              captures: { po_l: $.data.id }
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", po_id: "${po_s}", invoice_number: "INV-SM", invoice_date: "2026-05-10" }
              as: APClerk
              captures: { inv_s: $.data.id }
            - call: "POST /ap/invoices/${inv_s}/lines"
              payload: { gl_account_code: "5000", amount_cents: 104000, description: "s" }
              as: APClerk
            - call: "POST /ap/invoices/${inv_s}/code"
              payload: {}
              as: APClerk
            - call: "GET /ap/invoices/${inv_s}/match-exceptions"
              payload: {}
              as: APClerk
              captures: { exc_s: "$.data[0].id" }
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", po_id: "${po_l}", invoice_number: "INV-LG", invoice_date: "2026-05-10" }
              as: APClerk
              captures: { inv_l: $.data.id }
            - call: "POST /ap/invoices/${inv_l}/lines"
              payload: { gl_account_code: "5000", amount_cents: 120000, description: "l" }
              as: APClerk
            - call: "POST /ap/invoices/${inv_l}/code"
              payload: {}
              as: APClerk
            - call: "GET /ap/invoices/${inv_l}/match-exceptions"
              payload: {}
              as: APClerk
              captures: { exc_l: "$.data[0].id" }
          trigger:
            - call: "POST /ap/match-exceptions/${exc_s}/write-off"
              payload: {}
              as: APClerk
              captures: { res_s: $.data.resolution }
            - call: "POST /ap/match-exceptions/${exc_l}/escalate"
              payload: {}
              as: APClerk
              captures: { res_l: $.data.resolution }
          assert:
            - "MatchException.${exc_s}.resolution == WRITTEN_OFF"
            - "Invoice.${inv_s}.variance_cents == 0"
            - "MatchException.${exc_l}.resolution == ESCALATED"
            - "Invoice.${inv_l}.variance_cents == 20000"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: settle_cascade_payment_then_vendor_ytd_depth3
        grounds:
          - state_machines.PaymentBatch.RELEASED_to_SETTLED
          - state_machines.Payment.PENDING_to_SETTLED
          - entities.Vendor.fields.ytd_1099_paid_cents
        distinguishing_aspect: |
          Depth-3 chain from the settle trigger: settle batch (A) -> Payment.settlement_status
          PENDING->SETTLED (B, caused by A) -> Vendor.ytd_1099_paid_cents recomputed from the
          now-SETTLED payment (C, caused by B). Each hop caused by the prior, not a fan-out.
        test_recipe:
          setup:
            - "1099 Vendor ACH with tax_id; one APPROVED non-PO invoice total 50000 scheduled, batch released."
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Reportable", payment_method: "ACH", is_1099: true, tax_id: "12-3456789" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/approval-routes"
              payload: { min_amount_cents: 0, max_amount_cents: 1000000000, required_levels: 1 }
              as: APManager
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "NP-1099", invoice_date: "2026-05-01" }
              as: APClerk
              captures: { inv: $.data.id }
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 50000, description: "svc" }
              as: APClerk
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: APClerk
            - call: "POST /ap/invoices/${inv}/submit-approval"
              payload: {}
              as: APClerk
            - call: "GET /ap/invoices/${inv}/approval-steps"
              payload: {}
              as: APManager
              captures: { step: "$.data[0].id" }
            - call: "POST /ap/approval-steps/${step}/approve"
              payload: {}
              as: Approver
            - call: "POST /ap/payment-batches"
              payload: { payment_method: "ACH", run_date: "2026-05-10" }
              as: APManager
              captures: { batch: $.data.id }
            - call: "POST /ap/payment-batches/${batch}/payments"
              payload: { invoice_id: "${inv}" }
              as: APManager
              captures: { pay: $.data.id, net: $.data.net_amount_cents }
            - call: "GET /ap/payment-batches/${batch}"
              payload: {}
              as: APManager
              captures: { bver2: $.data.version }
            - call: "POST /ap/payment-batches/${batch}/release"
              payload: { expected_paymentbatch_version: "${bver2}" }
              as: APManager
          trigger:
            - call: "POST /ap/payment-batches/${batch}/settle"
              payload: {}
              as: APManager
          assert:
            - "PaymentBatch.${batch}.status == SETTLED"
            - "Payment.${pay}.settlement_status == SETTLED"
            - "Vendor.${ven}.ytd_1099_paid_cents == 50000"

      - name: reject_cascade_steps_then_po_matched_depth2
        grounds:
          - state_machines.Invoice.PENDING_APPROVAL_to_REJECTED
          - entities.PurchaseOrder.fields.matched_amount_cents
          - entities.ApprovalStep.fields.status
        distinguishing_aspect: |
          Depth-2 chain from the approval-step reject trigger: reject step (A) -> Invoice
          PENDING_APPROVAL->REJECTED (B, caused by A) which then debits
          PurchaseOrder.matched_amount_cents back down (the ledger compensation is part of B).
          Different trigger than the settle cascade.
        test_recipe:
          setup:
            - "THREE_WAY invoice 100500 matched in tolerance (PO matched_amount=100500), submitted for 1-level approval."
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Acme", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/approval-routes"
              payload: { min_amount_cents: 0, max_amount_cents: 1000000000, required_levels: 1 }
              as: APManager
            - call: "POST /ap/purchase-orders"
              payload: { vendor_id: "${ven}", gl_account_code: "5000", ordered_amount_cents: 100000 }
              as: APManager
              captures: { po: $.data.id }
            - call: "POST /ap/goods-receipts"
              payload: { po_id: "${po}", received_amount_cents: 100000, received_date: "2026-05-01", coverage_days: 5 }
              as: APClerk
              captures: { gr: $.data.id }
            - call: "POST /ap/goods-receipts/${gr}/post"
              payload: {}
              as: APClerk
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", po_id: "${po}", invoice_number: "INV-REJ", invoice_date: "2026-05-10" }
              as: APClerk
              captures: { inv: $.data.id }
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 100500, description: "line" }
              as: APClerk
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: APClerk
            - call: "POST /ap/invoices/${inv}/submit-approval"
              payload: {}
              as: APClerk
            - call: "GET /ap/invoices/${inv}/approval-steps"
              payload: {}
              as: APManager
              captures: { step: "$.data[0].id" }
          trigger:
            - call: "POST /ap/approval-steps/${step}/reject"
              payload: {}
              as: Approver
          assert:
            - "Invoice.${inv}.status == REJECTED"
            - "ApprovalStep.${step}.status == REJECTED"
            - "PurchaseOrder.${po}.matched_amount_cents == 0"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: not_found_beats_invalid_state_on_code
        grounds:
          - validations[priority=3]
          - validations[priority=5]
        distinguishing_aspect: |
          Error-category pair existence(3) vs state(5): coding a non-existent invoice id
          returns ERR_NOT_FOUND (404), never ERR_INVALID_STATE — existence outranks state.
        test_recipe:
          setup:
            - "Empty DB; reference a random non-existent invoice id."
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
          trigger:
            - call: "POST /ap/invoices/00000000-0000-4000-8000-000000000000/code"
              payload: {}
              as: APClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: segregation_beats_stale_version_on_release
        grounds:
          - validations[priority=9]
          - validations[priority=18]
          - concurrency_rules[batch-release-stale-batch]
        distinguishing_aspect: |
          Error-category pair business_safety(9) vs business_fiscal(16): a release that both
          violates segregation of duties (releaser also coded the member invoice) AND carries
          a stale expected_paymentbatch_version returns ERR_SEGREGATION_OF_DUTIES (403), not
          ERR_STALE_BATCH_VERSION — the safety check is evaluated first.
        test_recipe:
          setup:
            - "Non-PO invoice 50000 coded by user U1 (APClerk), approved, scheduled into an ACH batch."
            - "Batch version advanced by a second add then a delete so a stale version is available; releaser is U1 acting as APManager."
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Acme", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/approval-routes"
              payload: { min_amount_cents: 0, max_amount_cents: 1000000000, required_levels: 1 }
              as: APManager
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "NP-SOD", invoice_date: "2026-05-01" }
              as: APClerk
              as_user_id: "U1"
              captures: { inv: $.data.id }
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 50000, description: "svc" }
              as: APClerk
              as_user_id: "U1"
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: APClerk
              as_user_id: "U1"
            - call: "POST /ap/invoices/${inv}/submit-approval"
              payload: {}
              as: APClerk
              as_user_id: "U1"
            - call: "GET /ap/invoices/${inv}/approval-steps"
              payload: {}
              as: APManager
              captures: { step: "$.data[0].id" }
            - call: "POST /ap/approval-steps/${step}/approve"
              payload: {}
              as: Approver
              as_user_id: "U2"
            - call: "POST /ap/payment-batches"
              payload: { payment_method: "ACH", run_date: "2026-05-10" }
              as: APManager
              as_user_id: "U1"
              captures: { batch: $.data.id, bv0: $.data.version }
            - call: "POST /ap/payment-batches/${batch}/payments"
              payload: { invoice_id: "${inv}" }
              as: APManager
              as_user_id: "U1"
              captures: { pay: $.data.id }
          trigger:
            - call: "POST /ap/payment-batches/${batch}/release"
              payload: { expected_paymentbatch_version: "${bv0}" }
              as: APManager
              as_user_id: "U1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "error_id == ERR_SEGREGATION_OF_DUTIES"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: early_pay_discount_on_exact_deadline_earns_discount
        grounds:
          - calculations.early_pay_discount
          - entities.Invoice.fields.discount_deadline
          - entities.Payment.fields.discount_taken_cents
        distinguishing_aspect: |
          Numeric/date boundary on the discount metric via POST payment: run_date EXACTLY
          equal to discount_deadline (2026-05-11 = invoice_date 2026-05-01 + window 10)
          still earns the discount (<= is inclusive); discount_taken 1000 on a 50000 invoice.
        test_recipe:
          setup:
            - "Vendor ACH early_pay 0.02 window 10 days; non-PO invoice 50000 approved; batch run_date == discount_deadline."
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Disc", payment_method: "ACH", early_pay_terms_pct: 0.02, early_pay_window_days: 10 }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/approval-routes"
              payload: { min_amount_cents: 0, max_amount_cents: 1000000000, required_levels: 1 }
              as: APManager
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "NP-BND", invoice_date: "2026-05-01" }
              as: APClerk
              captures: { inv: $.data.id, deadline: $.data.discount_deadline }
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 50000, description: "svc" }
              as: APClerk
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: APClerk
            - call: "POST /ap/invoices/${inv}/submit-approval"
              payload: {}
              as: APClerk
            - call: "GET /ap/invoices/${inv}/approval-steps"
              payload: {}
              as: APManager
              captures: { step: "$.data[0].id" }
            - call: "POST /ap/approval-steps/${step}/approve"
              payload: {}
              as: Approver
            - call: "POST /ap/payment-batches"
              payload: { payment_method: "ACH", run_date: "2026-05-11" }
              as: APManager
              captures: { batch: $.data.id }
          trigger:
            - call: "POST /ap/payment-batches/${batch}/payments"
              payload: { invoice_id: "${inv}" }
              as: APManager
              captures: { disc: $.data.discount_taken_cents, net: $.data.net_amount_cents }
          assert:
            - "Payment.discount_taken_cents == 1000"
            - "Payment.net_amount_cents == 49000"

      - name: release_empty_batch_zero_count_rejected
        grounds:
          - errors[ERR_BATCH_EMPTY]
          - state_machines.PaymentBatch.BUILDING_to_RELEASED
          - entities.PaymentBatch.fields.total_disbursed_cents
        distinguishing_aspect: |
          Empty-set boundary on a different metric/endpoint: releasing a batch with zero
          Payments (count == 0) via POST release is rejected with ERR_BATCH_EMPTY — distinct
          from the numeric discount-deadline boundary above.
        test_recipe:
          setup:
            - "An ACH batch is opened and never receives a payment (member count 0)."
          setup_api_calls:
            - call: "POST /ap/payment-batches"
              payload: { payment_method: "ACH", run_date: "2026-05-10" }
              as: APManager
              captures: { batch: $.data.id, bv: $.data.version }
          trigger:
            - call: "POST /ap/payment-batches/${batch}/release"
              payload: { expected_paymentbatch_version: "${bv}" }
              as: APManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "error_id == ERR_BATCH_EMPTY"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: payment_add_blocked_by_vendor_on_hold
        grounds:
          - validations[priority=11]
          - entities.Vendor.fields.status
          - state_machines.Invoice.APPROVED_to_SCHEDULED
        distinguishing_aspect: |
          Entity pair Payment(add)->Vendor: an APPROVED invoice cannot be scheduled into a
          batch when its Vendor.status == ON_HOLD; the Payment.batch transition depends on the
          Vendor's state. Returns ERR_VENDOR_ON_HOLD.
        test_recipe:
          setup:
            - "Vendor ACH approved invoice 50000; vendor then placed ON_HOLD before scheduling."
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Hold", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/approval-routes"
              payload: { min_amount_cents: 0, max_amount_cents: 1000000000, required_levels: 1 }
              as: APManager
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "NP-HOLD", invoice_date: "2026-05-01" }
              as: APClerk
              captures: { inv: $.data.id }
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 50000, description: "svc" }
              as: APClerk
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: APClerk
            - call: "POST /ap/invoices/${inv}/submit-approval"
              payload: {}
              as: APClerk
            - call: "GET /ap/invoices/${inv}/approval-steps"
              payload: {}
              as: APManager
              captures: { step: "$.data[0].id" }
            - call: "POST /ap/approval-steps/${step}/approve"
              payload: {}
              as: Approver
            - call: "POST /ap/vendors/${ven}/hold"
              payload: { on_hold: true }
              as: APManager
            - call: "POST /ap/payment-batches"
              payload: { payment_method: "ACH", run_date: "2026-05-10" }
              as: APManager
              captures: { batch: $.data.id }
          trigger:
            - call: "POST /ap/payment-batches/${batch}/payments"
              payload: { invoice_id: "${inv}" }
              as: APManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "error_id == ERR_VENDOR_ON_HOLD"
            - "Invoice.${inv}.status == APPROVED"

      - name: goods_receipt_post_blocked_by_closed_po
        grounds:
          - validations[priority=20]
          - entities.PurchaseOrder.fields.status
          - entities.GoodsReceipt.fields.status
        distinguishing_aspect: |
          Different entity pair GoodsReceipt(post)->PurchaseOrder: posting a receipt against a
          PO whose status == CLOSED (matched_amount >= ordered) is rejected with ERR_PO_CLOSED;
          the receipt transition depends on the PO's derived state.
        test_recipe:
          setup:
            - "PO ordered 100000; a THREE_WAY invoice of 100000 matched in tolerance closes the PO (matched 100000 >= 100000)."
            - "A second DRAFT goods receipt then attempts to post against the now-CLOSED PO."
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Acme", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/purchase-orders"
              payload: { vendor_id: "${ven}", gl_account_code: "5000", ordered_amount_cents: 100000 }
              as: APManager
              captures: { po: $.data.id }
            - call: "POST /ap/goods-receipts"
              payload: { po_id: "${po}", received_amount_cents: 100000, received_date: "2026-05-01", coverage_days: 5 }
              as: APClerk
              captures: { gr1: $.data.id }
            - call: "POST /ap/goods-receipts/${gr1}/post"
              payload: {}
              as: APClerk
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", po_id: "${po}", invoice_number: "INV-CLOSE", invoice_date: "2026-05-10" }
              as: APClerk
              captures: { inv: $.data.id }
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 100000, description: "line" }
              as: APClerk
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: APClerk
              captures: { inv_st: $.data.status }
            - call: "POST /ap/goods-receipts"
              payload: { po_id: "${po}", received_amount_cents: 5000, received_date: "2026-05-20", coverage_days: 3 }
              as: APClerk
              captures: { gr2: $.data.id }
          trigger:
            - call: "POST /ap/goods-receipts/${gr2}/post"
              payload: {}
              as: APClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "error_id == ERR_PO_CLOSED"
            - "PurchaseOrder.${po}.status == CLOSED"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: goods_receipt_half_open_window_overlap_rejected_adjacency_ok
        grounds:
          - validations[priority=21]
          - entities.GoodsReceipt.fields.received_date
          - entities.GoodsReceipt.fields.coverage_days
        distinguishing_aspect: |
          Half-open interval semantics on GoodsReceipt: posting a receipt
          [2026-05-03, 2026-05-08) overlaps an existing POSTED [2026-05-01, 2026-05-06) on the
          same PO -> ERR_RECEIPT_WINDOW_OVERLAP; an adjacent [2026-05-06, 2026-05-09) (start ==
          prior end) is allowed because the interval is half-open.
        test_recipe:
          setup:
            - "PO with a POSTED receipt window [2026-05-01, 2026-05-06) (received_date 2026-05-01, coverage 5)."
            - "An adjacent receipt [2026-05-06, 2026-05-09) posts successfully; an overlapping [2026-05-03, 2026-05-08) is the trigger."
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Acme", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/purchase-orders"
              payload: { vendor_id: "${ven}", gl_account_code: "5000", ordered_amount_cents: 1000000 }
              as: APManager
              captures: { po: $.data.id }
            - call: "POST /ap/goods-receipts"
              payload: { po_id: "${po}", received_amount_cents: 10000, received_date: "2026-05-01", coverage_days: 5 }
              as: APClerk
              captures: { gr1: $.data.id }
            - call: "POST /ap/goods-receipts/${gr1}/post"
              payload: {}
              as: APClerk
            - call: "POST /ap/goods-receipts"
              payload: { po_id: "${po}", received_amount_cents: 10000, received_date: "2026-05-06", coverage_days: 3 }
              as: APClerk
              captures: { gr_adj: $.data.id }
            - call: "POST /ap/goods-receipts/${gr_adj}/post"
              payload: {}
              as: APClerk
              captures: { adj_status: $.data.status }
            - call: "POST /ap/goods-receipts"
              payload: { po_id: "${po}", received_amount_cents: 10000, received_date: "2026-05-03", coverage_days: 5 }
              as: APClerk
              captures: { gr_ovl: $.data.id }
          trigger:
            - call: "POST /ap/goods-receipts/${gr_ovl}/post"
              payload: {}
              as: APClerk
              captures: { err: $.data.error_id }
          assert:
            - "GoodsReceipt.${gr_adj}.status == POSTED"
            - "response.status == 409"
            - "error_id == ERR_RECEIPT_WINDOW_OVERLAP"

      - name: accrual_closed_period_overlap_rejected_shared_endpoint_counts
        grounds:
          - validations[priority=22]
          - entities.Accrual.fields.period_start
          - entities.Accrual.fields.period_end
        distinguishing_aspect: |
          Closed interval semantics on Accrual (different resource entity): a second BOOKED
          accrual [2026-05-31, 2026-06-30] shares the single endpoint date 2026-05-31 with the
          first [2026-05-01, 2026-05-31] and is rejected with ERR_ACCRUAL_PERIOD_OVERLAP —
          closed intervals treat a shared endpoint as overlap, unlike the half-open receipt rule.
        test_recipe:
          setup:
            - "PO with a BOOKED accrual covering closed period [2026-05-01, 2026-05-31]."
            - "A second accrual [2026-05-31, 2026-06-30] sharing the endpoint 2026-05-31 is the trigger."
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Acme", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/purchase-orders"
              payload: { vendor_id: "${ven}", gl_account_code: "5000", ordered_amount_cents: 100000 }
              as: APManager
              captures: { po: $.data.id }
            - call: "POST /ap/accruals"
              payload: { po_id: "${po}", period_label: "2026-05", period_start: "2026-05-01", period_end: "2026-05-31" }
              as: APManager
              captures: { acc1: $.data.id }
          trigger:
            - call: "POST /ap/accruals"
              payload: { po_id: "${po}", period_label: "2026-06", period_start: "2026-05-31", period_end: "2026-06-30" }
              as: APManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "error_id == ERR_ACCRUAL_PERIOD_OVERLAP"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payment_return_conserves_vendor_ytd_1099
        grounds:
          - state_machines.Payment.SETTLED_to_RETURNED
          - state_machines.Payment.PENDING_to_SETTLED
          - entities.Vendor.fields.ytd_1099_paid_cents
        distinguishing_aspect: |
          Conserved quantity #1 — Vendor.ytd_1099_paid_cents. After settle (+net 50000) then
          return (-net 50000) the invariant Vendor.ytd_1099_paid_cents == 0 holds: the forward
          settlement and its compensating return leave the YTD total unchanged.
        test_recipe:
          setup:
            - "1099 vendor; non-PO invoice 50000 paid in a released+settled ACH batch (ytd 50000), then the payment is returned."
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Reportable", payment_method: "ACH", is_1099: true, tax_id: "99-9999999" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/approval-routes"
              payload: { min_amount_cents: 0, max_amount_cents: 1000000000, required_levels: 1 }
              as: APManager
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "NP-RET", invoice_date: "2026-05-01" }
              as: APClerk
              captures: { inv: $.data.id }
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 50000, description: "svc" }
              as: APClerk
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: APClerk
            - call: "POST /ap/invoices/${inv}/submit-approval"
              payload: {}
              as: APClerk
            - call: "GET /ap/invoices/${inv}/approval-steps"
              payload: {}
              as: APManager
              captures: { step: "$.data[0].id" }
            - call: "POST /ap/approval-steps/${step}/approve"
              payload: {}
              as: Approver
            - call: "POST /ap/payment-batches"
              payload: { payment_method: "ACH", run_date: "2026-06-30" }
              as: APManager
              captures: { batch: $.data.id }
            - call: "POST /ap/payment-batches/${batch}/payments"
              payload: { invoice_id: "${inv}" }
              as: APManager
              captures: { pay: $.data.id }
            - call: "GET /ap/payment-batches/${batch}"
              payload: {}
              as: APManager
              captures: { bv: $.data.version }
            - call: "POST /ap/payment-batches/${batch}/release"
              payload: { expected_paymentbatch_version: "${bv}" }
              as: APManager
            - call: "POST /ap/payment-batches/${batch}/settle"
              payload: {}
              as: APManager
          trigger:
            - call: "POST /ap/payments/${pay}/return"
              payload: {}
              as: APManager
              captures: { ss: $.data.settlement_status }
          assert:
            - "Payment.${pay}.settlement_status == RETURNED"
            - "Vendor.${ven}.ytd_1099_paid_cents == 0"
            - "Invoice.${inv}.status == APPROVED"

      - name: payment_remove_conserves_po_matched_amount
        grounds:
          - state_machines.Invoice.SCHEDULED_to_APPROVED
          - state_machines.Invoice.APPROVED_to_SCHEDULED
          - entities.PurchaseOrder.fields.matched_amount_cents
        distinguishing_aspect: |
          Conserved quantity #2 — PurchaseOrder.matched_amount_cents. Scheduling a payment then
          removing it (DELETE) round-trips Invoice APPROVED->SCHEDULED->APPROVED and leaves
          PurchaseOrder.matched_amount_cents == 100000 unchanged (the match-time ledger debit is
          untouched by scheduling/unscheduling). Different conserved quantity than the YTD invariant.
        test_recipe:
          setup:
            - "THREE_WAY invoice 100000 matched in tolerance (PO matched 100000), approved, scheduled into an ACH batch."
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Acme", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/approval-routes"
              payload: { min_amount_cents: 0, max_amount_cents: 1000000000, required_levels: 1 }
              as: APManager
            - call: "POST /ap/purchase-orders"
              payload: { vendor_id: "${ven}", gl_account_code: "5000", ordered_amount_cents: 200000 }
              as: APManager
              captures: { po: $.data.id }
            - call: "POST /ap/goods-receipts"
              payload: { po_id: "${po}", received_amount_cents: 100000, received_date: "2026-05-01", coverage_days: 5 }
              as: APClerk
              captures: { gr: $.data.id }
            - call: "POST /ap/goods-receipts/${gr}/post"
              payload: {}
              as: APClerk
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", po_id: "${po}", invoice_number: "INV-MV", invoice_date: "2026-05-10" }
              as: APClerk
              captures: { inv: $.data.id }
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 100000, description: "line" }
              as: APClerk
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: APClerk
            - call: "POST /ap/invoices/${inv}/submit-approval"
              payload: {}
              as: APClerk
            - call: "GET /ap/invoices/${inv}/approval-steps"
              payload: {}
              as: APManager
              captures: { step: "$.data[0].id" }
            - call: "POST /ap/approval-steps/${step}/approve"
              payload: {}
              as: Approver
            - call: "POST /ap/payment-batches"
              payload: { payment_method: "ACH", run_date: "2026-05-20" }
              as: APManager
              captures: { batch: $.data.id }
            - call: "POST /ap/payment-batches/${batch}/payments"
              payload: { invoice_id: "${inv}" }
              as: APManager
              captures: { pay: $.data.id }
          trigger:
            - call: "DELETE /ap/payments/${pay}"
              payload: {}
              as: APManager
          assert:
            - "Invoice.${inv}.status == APPROVED"
            - "PurchaseOrder.${po}.matched_amount_cents == 100000"
            - "PurchaseOrder.${po}.status == OPEN"
