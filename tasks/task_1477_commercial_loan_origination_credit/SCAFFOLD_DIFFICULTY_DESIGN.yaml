          assert:
            - "LoanApplication.${app1}.proposed_amount_cents == 100000000 and CommitteeDecision.${dec1}.level_required == SMALL with votes_required == 2 (100,000,000 exactly is INSIDE the inclusive SMALL tier)"
            - "one DECLINE vote closes ${dec1}: status == DECLINED (SMALL decline threshold = size 2 - quorum 2 + 1 = 1); LoanApplication.${app1}.status == DECLINED"
            - "LoanApplication.${app2}.proposed_amount_cents == 100000001 and CommitteeDecision.${dec2}.level_required == STANDARD with votes_required == 2 (one cent over the cap crosses the tier)"
            - "after the first DECLINE on ${dec2}: status == OPEN (STANDARD decline threshold = 3 - 2 + 1 = 2); after the second: status == DECLINED and LoanApplication.${app2}.status == DECLINED"
            - "the one-cent difference (100,000,000 vs 100,000,001) is the only input divergence — proving the tier comparison is <=, not <"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: application_creation_blocked_by_borrower_status
        grounds:
          - validations[priority=13]
          - entities.Borrower.fields.status
          - state_machines.LoanApplication.INTAKE_to_SPREADING
        distinguishing_aspect: |
          Entity pair LoanApplication -> Borrower: the create transition is
          gated on the PARENT-REFERRED borrower's status field — ACTIVE admits
          the application (201), and after the same borrower is manually set
          EXITED the identical request is rejected with
          ERR_BORROWER_NOT_ACTIVE even though every application-side field is
          unchanged.
        test_recipe:
          setup:
            - "Officer rm; borrower initially ACTIVE"
            - "Control application A1 created while ACTIVE (201, INTAKE); borrower then patched to EXITED"
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Departing Client Co", naics_code: "332710", relationship_since: "2019-06-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: EQUIPMENT, requested_amount_cents: 5000000, term_months: 36 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app1: $.data.id } }
            - { call: "PATCH /credit/borrowers/${bor}", payload: { status: EXITED }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor_status: $.data.status } }
          trigger:
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: EQUIPMENT, requested_amount_cents: 5000000, term_months: 36 }, as: RelationshipManager, as_user_id: "${rm}", captures: { err: $.data.error_id } }
          assert:
            - "control: LoanApplication.${app1} was created with status INTAKE while Borrower was ACTIVE"
            - "Borrower.${bor}.status == EXITED after the PATCH"
            - "second create: status 409, error_id == ERR_BORROWER_NOT_ACTIVE (the borrower's state gates the application's creation)"
            - "GET /credit/borrowers/${bor}/loan-applications still returns exactly 1 application (the rejected create left no row)"

      - name: vote_blocked_by_session_window_state
        grounds:
          - validations[priority=28]
          - state_machines.CommitteeSession.SCHEDULED_to_ADJOURNED
          - state_machines.CommitteeDecision.OPEN_to_APPROVED
          - entities.CommitteeDecision.fields.votes
        distinguishing_aspect: |
          Entity pair CommitteeDecision -> CommitteeSession (distinct from the
          LoanApplication -> Borrower pair above): a vote on an OPEN decision
          is rejected once the REFERENCED session has left its SCHEDULED
          half-open window — the clock sweep adjourns the session, and the
          vote fails with ERR_COMMITTEE_SESSION_NOT_OPEN even though the
          decision itself is still OPEN and the officer is eligible.
        test_recipe:
          setup:
