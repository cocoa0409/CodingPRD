              as_user_id: "${acctA}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN (Bettor X-User-ID acctA != path account acctB)"

      - name: trading_ops_cannot_decide_kyc
        claim_type: role_denied
        grounds:
          - roles
          - endpoints
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "TradingOps calling POST /accounts/{id}/kyc-decision → ERR_FORBIDDEN (403); KYC is ComplianceOfficer-exclusive (SoD)."
        test_recipe:
          setup: ["One PENDING account."]
          setup_api_calls:
