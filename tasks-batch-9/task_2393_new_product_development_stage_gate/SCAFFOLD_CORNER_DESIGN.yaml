            - call: "POST /gate-reviews/${sod_gr_id}/votes"
              payload: { function: "MARKETING", vote: "APPROVE", rationale: "Brand fit is clear." }
              as: FunctionalReviewer
              as_user_id: "rev-mkt-sod"
          trigger:
            - call: "POST /gate-reviews/${sod_gr_id}/votes"
              payload: { function: "MARKETING", vote: "APPROVE", rationale: "Agreeing with myself." }
