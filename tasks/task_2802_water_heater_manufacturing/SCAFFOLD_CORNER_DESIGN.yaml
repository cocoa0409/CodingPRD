  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_product_model_version_on_certification_create_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cert-create-stale-model]
          - errors[ERR_STALE_PARENT_VERSION]
          - endpoints[POST /mfg/rating-certifications]
          - validations[priority 7]
          - complexity_profile.complexity_layers.optimistic_concurrency
        distinguishing_aspect: >
          This is the OCC rule whose own side effect is what invalidates the next client's token: creating a
          certification bumps ProductModel.version, so a second engineer holding the version they read before that
          create is stale by exactly one. No state precondition stands in the way - superseding a DRAFT is legitimate -
          so 412 is the ONLY thing that stops the blind supersede, and the rejected call must leave no certification
          row and no further version bump behind.
        test_recipe:
          setup:
            - "Model GX50-T has three PASSED UEF tests plus PASSED first-hour-rating and recovery tests, so certification creation is otherwise legal."
            - "Engineer A reads the model version, then creates certification cert2, which bumps the model's version."
            - "Engineer B is still holding the version captured before cert2 existed."
          setup_api_calls:
            - call: "POST /mfg/product-models"
              payload: { model_code: "GX50-T", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "TRADE", insulation_r_value: 20, is_private_label: false }
