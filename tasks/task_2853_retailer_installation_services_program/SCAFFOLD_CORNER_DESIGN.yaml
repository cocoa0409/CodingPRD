          difficulty_instance: "compensating_invariant / installer_committed_minutes_are_conserved_through_release_and_rebooking"
          rationale: "That instance books, releases and rebooks across three assignments and asserts committed_minutes returns to the exact pre-booking value each time, which subsumes the single-shot action-endpoint claim for this endpoint."

  # ==========================================================================
  # SECTION — errors  (claim-extraction-guide Table 6: every catalogue entry
  # must be reachable by at least one test)
  # ==========================================================================
  - section: errors
    instances:

      - name: every_entity_has_its_own_not_found_code_on_a_bare_read
        claim_type: error_triggerable
        grounds:
          - errors.ERR_SERVICE_CATEGORY_NOT_FOUND
          - errors.ERR_INSTALLER_CREDENTIAL_NOT_FOUND
          - errors.ERR_CUSTOMER_NOT_FOUND
          - errors.ERR_MEASUREMENT_NOT_FOUND
          - errors.ERR_CHANGE_ORDER_NOT_FOUND
          - errors.ERR_MATERIAL_DELIVERY_NOT_FOUND
          - errors.ERR_INSTALLER_ASSIGNMENT_NOT_FOUND
          - errors.ERR_PUNCH_LIST_ITEM_NOT_FOUND
          - errors.ERR_WARRANTY_CLAIM_NOT_FOUND
          - validations[priority=6]
        distinguishing_aspect: "Nine sibling GET-by-id endpoints must each return their OWN entity-specific 404 code rather than a shared generic one, and they must do so on an empty database where no row of any kind exists."
        test_recipe:
          setup:
            - "No setup at all: the store is empty, so every id below is unknown by construction."
          setup_api_calls: []
          trigger:
            - call: "GET /service-categories/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ProgramAdmin
              captures: { e_cat: $.data.error_id }
            - call: "GET /installer-credentials/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: NetworkManager
              captures: { e_cred: $.data.error_id }
            - call: "GET /customers/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ProgramAdmin
              captures: { e_cust: $.data.error_id }
            - call: "GET /measurements/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: ProjectCoordinator
              captures: { e_meas: $.data.error_id }
            - call: "GET /change-orders/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: ProjectCoordinator
              captures: { e_co: $.data.error_id }
            - call: "GET /material-deliveries/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: ProjectCoordinator
              captures: { e_del: $.data.error_id }
            - call: "GET /installer-assignments/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: ProjectCoordinator
              captures: { e_asg: $.data.error_id }
            - call: "GET /punch-list-items/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: ProjectCoordinator
              captures: { e_punch: $.data.error_id }
            - call: "GET /warranty-claims/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: ServiceManager
              captures: { e_war: $.data.error_id }
          assert:
            - "${e_cat} == 'ERR_SERVICE_CATEGORY_NOT_FOUND' AND ${e_cred} == 'ERR_INSTALLER_CREDENTIAL_NOT_FOUND' AND ${e_cust} == 'ERR_CUSTOMER_NOT_FOUND'"
            - "${e_meas} == 'ERR_MEASUREMENT_NOT_FOUND' AND ${e_co} == 'ERR_CHANGE_ORDER_NOT_FOUND' AND ${e_del} == 'ERR_MATERIAL_DELIVERY_NOT_FOUND'"
            - "${e_asg} == 'ERR_INSTALLER_ASSIGNMENT_NOT_FOUND' AND ${e_punch} == 'ERR_PUNCH_LIST_ITEM_NOT_FOUND' AND ${e_war} == 'ERR_WARRANTY_CLAIM_NOT_FOUND'"
            - "Every one of the nine responses is HTTP 404 with response_type 'error' and a meta.api_request_id"

      - name: empty_identity_header_and_foreign_ownership_are_different_failures
        claim_type: error_triggerable
        grounds:
          - errors.ERR_MISSING_AUTH_HEADERS
          - errors.ERR_NOT_RESOURCE_OWNER
          - validations[priority=1]
          - validations[priority=29]
          - roles.Customer.ownership_rule
        distinguishing_aspect: "An empty X-User-ID is 401 ERR_MISSING_AUTH_HEADERS at priority 1, while a well-formed Customer identity that is not Project.customer_id is 403 ERR_NOT_RESOURCE_OWNER at priority 29 — and the second failure survives a payload that would otherwise be perfectly valid."
        test_recipe:
          setup:
            - "Two customers, A and B, on the same jurisdiction; a FLOOR-DIRECT 420.00-unit project owned by A with deposit_required_cents 51306 and no deposit paid yet."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-DIRECT", name: "Direct-Ship Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "NEVER", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-02", name: "Harbor District", permit_required_trades: [], permit_responsible_party: "RETAILER", inspection_required: false, min_liability_coverage_cents: 100000000, permit_unit_threshold: 0, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.00, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_a: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Milo Frank", email: "milo@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_b: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_a}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id, pv: $.data.version }
          trigger:
            - call: "POST /projects/${proj_id}/deposit"
              payload: { amount_cents: 51306 }
              as: Customer
              as_user_id: ""
              captures: { e_auth: $.data.error_id }
            - call: "POST /projects/${proj_id}/deposit"
              payload: { amount_cents: 51306 }
              as: Customer
              as_user_id: "${cust_b}"
              captures: { e_own: $.data.error_id }
            - call: "POST /projects/${proj_id}/deposit"
              payload: { amount_cents: 51306 }
              as: Customer
              as_user_id: "${cust_a}"
              captures: { fin: $.data.financial_status }
          assert:
            - "${e_auth} == 'ERR_MISSING_AUTH_HEADERS' with HTTP 401 — an empty X-User-ID counts as absent, and the same holds when X-User-Role is sent empty"
            - "${e_own} == 'ERR_NOT_RESOURCE_OWNER' with HTTP 403, NOT ERR_UNAUTHORIZED_ROLE — Customer is on the endpoint's role list, but B does not own A's project"
            - "After both failures, Project.${proj_id}.financial_status == 'QUOTED' AND deposit_paid_cents == 0 AND version == ${pv}"
            - "${fin} == 'DEPOSIT_HELD' — the owning customer's identical payload succeeds"

      - name: cancelled_project_blocks_children_recancellation_and_late_reinstatement
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PROJECT_CANCELLED
          - errors.ERR_NOT_CANCELLABLE
          - errors.ERR_REINSTATE_WINDOW_CLOSED
          - validations[priority=14]
          - validations[priority=38]
          - validations[priority=32]
          - calculations.cancellation_settlement
        distinguishing_aspect: "Three different codes fall out of one CANCELLED project: a child write is ERR_PROJECT_CANCELLED (409), a second cancel is ERR_NOT_CANCELLABLE (409, never ERR_INVALID_STATE, per the priority-12 carve-out), and a reinstatement at exactly 72 hours after cancelled_at is ERR_REINSTATE_WINDOW_CLOSED because the window is strictly less than 72 hours."
        test_recipe:
          setup:
            - "FLOOR-MEASURED (measurement_required true) 420.00-unit project in METRO-02, no deposit paid, cancelled by the ProjectCoordinator at the initial clock 2026-08-01T00:00:00.000Z — with deposit_held_cents 0 the settlement retains 0 and refunds 0, landing in REFUNDED."
            - "The clock is then moved to 2026-08-04T00:00:00.000Z, exactly 72 hours after cancelled_at."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-MEASURED", name: "Measured Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: true, permit_policy: "NEVER", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-02", name: "Harbor District", permit_required_trades: [], permit_responsible_party: "RETAILER", inspection_required: false, min_liability_coverage_cents: 100000000, permit_unit_threshold: 0, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.00, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id, ful0: $.data.fulfillment_status }
            - call: "POST /projects/${proj_id}/cancel"
              payload: { cancel_reason: "Customer withdrew before measurement" }
              as: ProjectCoordinator
              captures: { ful1: $.data.fulfillment_status, fin1: $.data.financial_status, cv: $.data.version }
          trigger:
            - call: "POST /projects/${proj_id}/material-deliveries"
              payload: { promised_window_start: "2026-08-19T09:00:00.000Z", promised_window_end: "2026-08-20T09:00:00.000Z", sku_count: 4, material_cost_cents: 250000 }
              as: ProjectCoordinator
              captures: { e_child: $.data.error_id }
            - call: "POST /projects/${proj_id}/cancel"
              payload: { cancel_reason: "Second attempt" }
              as: ProjectCoordinator
              captures: { e_cancel: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:00.000Z" }
              as: ProgramAdmin
              captures: { now: $.data.current_utc }
            - call: "POST /projects/${proj_id}/reinstate"
              payload: { expected_project_version: "${cv}", reinstate_note: "Customer changed their mind" }
              as: ProjectCoordinator
              captures: { e_reinstate: $.data.error_id }
          assert:
            - "${ful0} == 'MEASURE_PENDING' AND ${ful1} == 'CANCELLED' AND ${fin1} == 'REFUNDED' — a zero-held cancellation still lands in REFUNDED"
            - "${e_child} == 'ERR_PROJECT_CANCELLED' with HTTP 409, and no MaterialDelivery row exists for the project"
            - "${e_cancel} == 'ERR_NOT_CANCELLABLE' with HTTP 409 — the specific rule at priority 38 beats the generic state rule"
            - "${now} == '2026-08-04T00:00:00.000Z'"
            - "${e_reinstate} == 'ERR_REINSTATE_WINDOW_CLOSED' with HTTP 409 — 72 hours exactly is outside the strictly-less-than window"
            - "Project.${proj_id}.fulfillment_status == 'CANCELLED' AND financial_status == 'REFUNDED' AND version == ${cv} after all three failures"

      - name: stale_background_check_and_unheld_deposit_are_separate_assignment_refusals
