          Triggering transition: DownstreamClaim ADJUDICATED_APPROVED -> PAID —
          a different transition on a different entity from the depth-5 file
          cascade. Depth 4, again strictly serial: paid_cents is set (L1), the
          pool's paid ledger moves only because paid_cents was set (L2), the
          enrollee's cumulative total and the pool's stop-loss eligible count
          move only because the pool ledger moved (L3), and the deficit flag and
