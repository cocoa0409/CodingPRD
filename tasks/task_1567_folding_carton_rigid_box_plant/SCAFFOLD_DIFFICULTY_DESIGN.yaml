            - { call: "POST /plant/finishing-bookings", payload: { job_id: "${job}", line_id: "${line}", operation: "COAT", start_utc: "2026-08-11T08:00:00Z", end_utc: "2026-08-11T09:00:00Z" }, as: FinishingOperator, captures: { fb: $.data.id } }
            - { call: "POST /plant/finishing-bookings/${fb}/complete", payload: {}, as: FinishingOperator }
