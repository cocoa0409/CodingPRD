  - method: GET
    path: "/econsult/in-person-conversions/{id}"
    description: "Get a conversion"
    roles: [ProgramCoordinator, ReferringProvider, Specialist, QualityReviewer, BillingClerk]
    code: 200
    input: []
    output: InPersonConversion
    side_effects: []

  # --- Billing claims ---
  - method: POST
    path: "/econsult/consult-requests/{id}/billing-claims"
    description: "Create a DRAFT billing claim for an answered consult (amount per pinned rounding order)"
    roles: [BillingClerk]
    code: 201
    input: []
    output: BillingClaim
    side_effects: ["claim_code and amount_cents computed", "status DRAFT"]
  - method: GET
    path: "/econsult/consult-requests/{id}/billing-claims"
    description: "List claims of a consult (reverse reachability)"
    roles: [ProgramCoordinator, ReferringProvider, Specialist, QualityReviewer, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "BillingClaim[]"
    side_effects: []
  - method: GET
    path: "/econsult/billing-claims/{id}"
    description: "Get a billing claim"
    roles: [ProgramCoordinator, ReferringProvider, Specialist, QualityReviewer, BillingClerk]
    code: 200
    input: []
    output: BillingClaim
    side_effects: []
  - method: POST
    path: "/econsult/billing-claims/{id}/submit"
