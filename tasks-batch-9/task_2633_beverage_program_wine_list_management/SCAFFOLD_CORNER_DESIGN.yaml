      - name: missing_header_wrong_role_and_foreign_distributor_all_rejected
        claim_type: Triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_DISTRIBUTOR_SCOPE_VIOLATION]
          - validations[priority 1]
          - validations[priority 2]
          - validations[priority 3]
          - validations[priority 5]
        distinguishing_aspect: >-
          The three auth failures are distinct rungs: no headers at all is 401, a declared role that is
          not on the endpoint is 403 ERR_FORBIDDEN_ROLE, and a DistributorRep acting for someone else's
          distributor is 403 ERR_DISTRIBUTOR_SCOPE_VIOLATION. All three must beat the body validation
          that the same malformed payload would otherwise trigger.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Two distributors dst-A and dst-B, and one allocated RED wine."
            - "Every call below carries the same otherwise-valid offer body."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/distributors"
              payload: { name: "Coastal Selections", license_number: "LIC-0001", allocation_tier: "A" }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { d_a_id: $.data.id }
            - call: "POST /beverage-program/distributors"
              payload: { name: "Inland Cellars", license_number: "LIC-0002", allocation_tier: "B" }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { d_b_id: $.data.id }
            - call: "POST /beverage-program/wines"
              payload: { producer: "Ridge", cuvee: "Monte Bello", vintage_year: 2019, category: "RED", reference_cost_cents: 2400, bottle_size_ml: 750, case_pack: 6, is_allocated: true }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /beverage-program/allocation-offers"
              payload: { distributor_id: "${d_a_id}", wine_id: "${w1_id}", offered_bottles: 10, unit_cost_cents: 3000, response_deadline: "2026-09-30T00:00:00Z" }
              as: DistributorRep
              as_user_id: ""
            - call: "POST /beverage-program/allocation-offers"
              payload: { distributor_id: "${d_a_id}", wine_id: "${w1_id}", offered_bottles: 10, unit_cost_cents: 3000, response_deadline: "2026-09-30T00:00:00Z" }
              as: Controller
              as_user_id: "ctl-001"
            - call: "POST /beverage-program/allocation-offers"
              payload: { distributor_id: "${d_a_id}", wine_id: "${w1_id}", offered_bottles: 10, unit_cost_cents: 3000, response_deadline: "2026-09-30T00:00:00Z" }
              as: DistributorRep
              as_user_id: "${d_b_id}"
            - call: "GET /beverage-program/allocation-offers"
              payload: { distributor_id: "${d_a_id}" }
              as: DistributorRep
              as_user_id: "${d_b_id}"
            - call: "POST /beverage-program/allocation-offers"
              payload: { distributor_id: "${d_a_id}", wine_id: "${w1_id}", offered_bottles: 10, unit_cost_cents: 3000, response_deadline: "2026-09-30T00:00:00Z" }
              as: DistributorRep
              as_user_id: "${d_a_id}"
          assert:
            - "the first call is issued with NO X-User-Role and NO X-User-ID header at all and returns 401 ERR_UNAUTHENTICATED; the same is true for a request carrying a role string outside the five declared roles"
            - "the Controller call returns 403 ERR_FORBIDDEN_ROLE — POST /allocation-offers is DistributorRep-exclusive"
            - "the dst-B rep posting for dst-A returns 403 ERR_DISTRIBUTOR_SCOPE_VIOLATION, and the same rep filtering the offer list by dst-A returns the same 403"
            - "only the last call succeeds: 201 with fulfillment_state OPEN, compliance_state PENDING_LICENSE_CHECK, unallocated_bottles 10 and claim_count 0"
