            - "L2: ${bal_after} == 1648001, ${basis_after} == 24000 and ${gross_after} == 0 — recomputed from the empty ISSUED set, not decremented."
            - "L2 continued: GET /plan-accounts/${acct_id}/money-sources is byte-for-byte unchanged (AFTER_TAX 58800, EMPLOYER_MATCH 876193, PRE_TAX_DEFERRAL 1417006, LOAN_RECEIVABLE 300000) — a SEPARATE_INTEREST void restores the payee's pool, never the participant's sources."
            - "L3: GET /tax-reports with alternate_payee_account_id=${ap_id} returns exactly 2 rows, never 0; the first has reportable_gross_cents +1050000, reportable_taxable_cents +1034709, federal_withheld_cents +206942, correction_of_tax_report_id null; ${corr_gross} == -1050000 with reportable_taxable_cents -1034709, federal_withheld_cents -206942, distribution_code \"CODE_2\", tax_year 2026 and correction_of_tax_report_id == \"${orig_tax_id}\"."
            - "${corr_id} is not \"${orig_tax_id}\" and GET /tax-reports/${corr_id} resolves — the self-referential edge is navigable in both directions."
