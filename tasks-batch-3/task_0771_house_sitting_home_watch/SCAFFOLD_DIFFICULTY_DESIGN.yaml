            - call: "POST /home-watch/key-assignments/${key_id}/check-out"
              payload: {}
              as: Coordinator
            - call: "POST /home-watch/bookings/${bk_id}/activate"
              payload: {}
              as: Coordinator
            - call: "GET /home-watch/visits?booking_id=${bk_id}"
              payload: {}
              as: Coordinator
              captures: { vis1_id: "$.data[0].id", vis2_id: "$.data[1].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Coordinator
            - call: "POST /home-watch/visits/${vis1_id}/check-in"
