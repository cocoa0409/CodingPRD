# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Medical Group Board & Governance. 19 instances across the 9 Difficulty Rules.
# All monetary literals pre-computed by executing the §1.3 formulas with the
# pinned setup constants (default clock 2026-08-01T00:00:00Z).
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: buyout_provisional_vs_final_diverge
        grounds:
          - calculations.buy_out_valuation
          - entities.ExitValuation.fields.provisional_value_cents
          - entities.ExitValuation.fields.final_value_cents
        distinguishing_aspect: |
          Dual-variant logic on the ExitValuation domain: the provisional variant
          (capital account + EBITDA-multiple share) and the final variant
          (appraised value x ownership x (1 - minority discount)) produce
          different cents for identical physician state: 34833333 vs 11333333.
        test_recipe:
          setup:
            - "Policy: 1000000 authorized shares, quorum 1, trailing EBITDA 50000000 cents"
            - "Physician X: founding SHAREHOLDER, 1000 shares, hired 2010-01-01; Physician Y: founding SHAREHOLDER, 8000 shares (outstanding 9000)"
            - "Capital call of 13500000 adopted and billed; X paid the 1500000 assessment in full (X capital account = 1500000)"
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1, trailing_ebitda_cents: 50000000 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr X", hire_date: "2010-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { x_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr Y", hire_date: "2011-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 8000 }, as: BoardAdmin, captures: { y_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${x_id}", payload: { amount_cents: 13500000, due_date: "2026-08-20T00:00:00Z", purpose: "Imaging equipment" } }, as: Physician, as_user_id: "${x_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${x_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${x_id}" }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${x_id}" }
            - { call: "POST /governance/motions/${m_id}/close", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/capital-calls?motion_id=${m_id}", as: BoardAdmin, captures: { cc_id: "$.data[0].id" } }
            - { call: "POST /governance/capital-calls/${cc_id}/bill", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/physicians/${x_id}/assessments", as: BoardAdmin, captures: { asmt_id: "$.data[0].id" } }
            - { call: "POST /governance/capital-call-assessments/${asmt_id}/pay", payload: { amount_cents: 1500000 }, as: BoardAdmin }
          trigger:
            - { call: "POST /governance/exit-valuations", payload: { physician_id: "${x_id}", trigger_type: VOLUNTARY }, as: BoardAdmin, captures: { val_id: $.data.id, val_v: $.data.version } }
            - { call: "POST /governance/exit-valuations/${val_id}/appraise", payload: { appraised_practice_value_cents: 120000000, expected_valuation_version: "${val_v}" }, as: BoardAdmin }
          assert:
            - "ExitValuation.${val_id}.provisional_value_cents == 34833333 (1500000 + round_half_up(1000/9000 * 50000000 * 6))"
            - "ExitValuation.${val_id}.final_value_cents == 11333333 (round_half_up(120000000 * 1000/9000 * 0.85))"
            - "ExitValuation.${val_id}.provisional_value_cents != ExitValuation.${val_id}.final_value_cents"
            - "Physician.${x_id}.partnership_status == EXITING"

      - name: distribution_pro_rata_vs_seniority_tiered_diverge
        grounds:
          - calculations.distribution_allocation
          - entities.Distribution.fields.allocations
        distinguishing_aspect: |
          Dual-variant logic on the Distribution domain (different entity domain
          from buyout_provisional_vs_final_diverge): identical shareholders,
          shares, and total yield different per-physician cents under PRO_RATA
          (A 4000001) vs SENIORITY_TIERED (A 4200001).
        test_recipe:
          setup:
            - "Policy: quorum 1, defaults otherwise (carve 0.20, seniority tier 5 years)"
            - "A: SHAREHOLDER 1000 shares hired 2015-01-01 (senior); B: SHAREHOLDER 1000 shares hired 2016-01-01 (senior); C: SHAREHOLDER 500 shares hired 2025-01-01 (junior); A created before B before C"
            - "Two adopted DISTRIBUTION motions of 10000001 cents each: d1 PRO_RATA, d2 SENIORITY_TIERED (NIBB 800000000)"
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr B", hire_date: "2016-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr C", hire_date: "2025-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 500 }, as: BoardAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: DISTRIBUTION, sponsor_physician_id: "${a_id}", payload: { amount_cents: 10000001, method: PRO_RATA, fiscal_net_income_before_bonus_cents: 800000000 } }, as: Physician, as_user_id: "${a_id}", captures: { m1_id: $.data.id } }
            - { call: "POST /governance/motions/${m1_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m1_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m1_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m1_id}/close", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/distributions?motion_id=${m1_id}", as: BoardAdmin, captures: { d1_id: "$.data[0].id" } }
            - { call: "POST /governance/motions", payload: { motion_type: DISTRIBUTION, sponsor_physician_id: "${a_id}", payload: { amount_cents: 10000001, method: SENIORITY_TIERED, fiscal_net_income_before_bonus_cents: 800000000 } }, as: Physician, as_user_id: "${a_id}", captures: { m2_id: $.data.id } }
            - { call: "POST /governance/motions/${m2_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m2_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m2_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${b_id}" }
            - { call: "POST /governance/motions/${m2_id}/close", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/distributions?motion_id=${m2_id}", as: BoardAdmin, captures: { d2_id: "$.data[0].id" } }
          trigger:
            - { call: "GET /governance/distributions/${d1_id}", as: BoardAdmin }
            - { call: "GET /governance/distributions/${d2_id}", as: BoardAdmin }
          assert:
            - "Distribution.${d1_id}.allocations for A == 4000001, B == 4000000, C == 2000000 (floor + 1 residual penny to A: shares tie 1000=1000, tie-break created_at ASC)"
            - "Distribution.${d2_id}.allocations for A == 4200001, B == 4200000, C == 1600000 (carve 2000000 split equally A/B, then 8000001 pro-rata)"
            - "A's PRO_RATA allocation 4000001 != A's SENIORITY_TIERED allocation 4200001"
            - "Each distribution's allocations sum to exactly 10000001"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: buy_in_price_tenure_discount_proration_floor
        grounds:
          - calculations.buy_in_price
          - entities.BuyInOffer.fields.final_amount_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: 4 inputs (tier base, tenure discount with
          nested min vs cap, fiscal-month proration, min-price floor) interact
          non-linearly; the two offers below bind the min() discount cap
          differently (0.12 vs the 0.20 ceiling) under identical proration.
        test_recipe:
          setup:
            - "Policy defaults: base SHAREHOLDER 25000000, tenure discount 0.02/yr capped 0.20, floor 5000000, fiscal year starts month 7; clock at default 2026-08-01T00:00:00Z (August -> fiscal_month_index 2 -> 11/12 proration)"
            - "P1 associate hired 2020-07-01 (6 full years); P2 associate hired 2000-01-01 (26 full years, discount capped)"
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr P1", hire_date: "2020-07-01T00:00:00Z" }, as: BoardAdmin, captures: { p1_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr P2", hire_date: "2000-01-01T00:00:00Z" }, as: BoardAdmin, captures: { p2_id: $.data.id } }
          trigger:
            - { call: "POST /governance/buy-in-offers", payload: { physician_id: "${p1_id}", target_tier: SHAREHOLDER, share_grant: 500, installment_count: 3 }, as: BoardAdmin, captures: { o1_id: $.data.id } }
            - { call: "POST /governance/buy-in-offers", payload: { physician_id: "${p2_id}", target_tier: SHAREHOLDER, share_grant: 500, installment_count: 3 }, as: BoardAdmin, captures: { o2_id: $.data.id } }
          assert:
            - "BuyInOffer.${o1_id}.discount_pct_applied == 0.12 and proration_twelfths == 11"
            - "BuyInOffer.${o1_id}.final_amount_cents == 20166667 (round_half_up(25000000 * 0.88 * 11/12))"
            - "BuyInOffer.${o1_id}.installment_schedule_cents == [6722223, 6722222, 6722222] (remainder cent on FIRST installment)"
            - "BuyInOffer.${o2_id}.discount_pct_applied == 0.2 (26 * 0.02 capped at max_tenure_discount_pct)"
            - "BuyInOffer.${o2_id}.final_amount_cents == 18333333 (round_half_up(25000000 * 0.80 * 11/12))"

      - name: distribution_penny_residual_allocation_order
        grounds:
          - calculations.distribution_allocation
          - entities.Distribution.fields.allocations
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding order is pinned as
          floor-per-allocation THEN residual pennies (shares DESC, created_at
          ASC). Rounding each allocation instead would drop the residual cent
          (sum 10000000 != total 10000001); A, not B, receives the penny purely
          by the created_at tie-break at equal shares.
        test_recipe:
          setup:
            - "Policy quorum 1; A 1000 shares (created first), B 1000 shares, C 500 shares — all SHAREHOLDER"
            - "Adopted PRO_RATA distribution of 10000001 cents (NIBB 800000000)"
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr B", hire_date: "2016-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr C", hire_date: "2025-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 500 }, as: BoardAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: DISTRIBUTION, sponsor_physician_id: "${a_id}", payload: { amount_cents: 10000001, method: PRO_RATA, fiscal_net_income_before_bonus_cents: 800000000 } }, as: Physician, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/close", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/distributions?motion_id=${m_id}", as: BoardAdmin, captures: { d_id: "$.data[0].id" } }
          trigger:
            - { call: "GET /governance/distributions/${d_id}", as: BoardAdmin }
          assert:
            - "raw shares: A 4000000.4, B 4000000.4, C 2000000.2 -> floors 4000000/4000000/2000000, residual 1 cent"
            - "Distribution.${d_id}.allocations: A == 4000001 (residual penny: shares DESC tie broken by created_at ASC), B == 4000000, C == 2000000"
            - "Sum of allocated_cents == 10000001 == total_amount_cents (no cent lost, no cent invented)"

      - name: distributable_cap_bonus_first_evaluation_order
        grounds:
          - calculations.distributable_cap
          - entities.Distribution.fields.distributable_cap_cents
        distinguishing_aspect: |
          Mode (c) combinatorial: circular-looking dependency — the cap is a
          fraction of net income that is itself reduced by a bonus accrual
          computed from the same pre-bonus base. Pinned order (bonus 25% first,
          then 60% of the remainder) yields 360000000; the wrong order (60% of
          pre-bonus) yields 480000000 and would wrongly accept a 400000000 ask.
        test_recipe:
          setup:
            - "Policy defaults (bonus_pool_pct 0.25, distribution_cap_pct 0.60), quorum 1; one SHAREHOLDER A with 1000 shares"
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
          trigger:
            - { call: "POST /governance/motions", payload: { motion_type: DISTRIBUTION, sponsor_physician_id: "${a_id}", payload: { amount_cents: 400000000, method: PRO_RATA, fiscal_net_income_before_bonus_cents: 800000000 } }, as: Physician, as_user_id: "${a_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /governance/motions", payload: { motion_type: DISTRIBUTION, sponsor_physician_id: "${a_id}", payload: { amount_cents: 360000000, method: PRO_RATA, fiscal_net_income_before_bonus_cents: 800000000 } }, as: Physician, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/close", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/distributions?motion_id=${m_id}", as: BoardAdmin, captures: { d_id: "$.data[0].id" } }
          assert:
            - "First create rejected: err1 == ERR_DISTRIBUTION_CAP_EXCEEDED (400000000 > 360000000 cap even though 400000000 < 480000000 naive-order value)"
            - "Second create at exactly the cap (360000000) is accepted (<= boundary)"
            - "Distribution.${d_id}.bonus_accrual_cents == 200000000 and distributable_cap_cents == 360000000"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: motion_open_tabled_open_cycle
        grounds:
          - state_machines.Motion.OPEN_to_TABLED
          - state_machines.Motion.TABLED_to_OPEN
        distinguishing_aspect: |
          Motion is a cyclic machine (OPEN <-> TABLED negotiation loop), not a
          linear pipeline: table freezes ballots, resume re-opens with a fresh
          voting window, and adoption effects still fire after the loop.
        test_recipe:
          setup:
            - "Policy quorum 1; SHAREHOLDER A (1000 shares); CAPITAL_CALL motion proposed and opened at the default clock"
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 1000000, due_date: "2026-08-20T00:00:00Z", purpose: "Roof repair" } }, as: Physician, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
          trigger:
            - { call: "POST /governance/motions/${m_id}/table", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${a_id}", captures: { err_tabled: $.data.error_id } }
            - { call: "POST /governance/motions/${m_id}/resume", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/close", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/capital-calls?motion_id=${m_id}", as: BoardAdmin, captures: { cc_id: "$.data[0].id" } }
          assert:
            - "After table: Motion.${m_id}.status == TABLED; vote while TABLED rejected with err_tabled == ERR_MOTION_NOT_OPEN"
            - "After resume: status == OPEN, opened_at == 2026-08-01T00:00:00Z and closes_at == 2026-08-15T00:00:00Z (fresh window from current clock)"
            - "After close: status == ADOPTED; CapitalCall.${cc_id}.status == APPROVED with total_amount_cents == 1000000 (cycle did not consume the adoption effect)"

      - name: exit_valuation_appraised_disputed_cycle
        grounds:
          - state_machines.ExitValuation.APPRAISED_to_DISPUTED
          - state_machines.ExitValuation.DISPUTED_to_APPRAISED
        distinguishing_aspect: |
          ExitValuation is a cyclic machine (APPRAISED <-> DISPUTED re-appraisal
          rounds, distinct entity from Motion): the loop is bounded by
          max_dispute_rounds, after which only ARBITRATION unblocks it, and an
          arbitrator appraisal sets appraisal_final which forbids further disputes.
        test_recipe:
          setup:
            - "Policy defaults (max_dispute_rounds 2); sole SHAREHOLDER X (1000 shares -> ownership 1.0); exit initiated (VOLUNTARY)"
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr X", hire_date: "2010-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { x_id: $.data.id } }
            - { call: "POST /governance/exit-valuations", payload: { physician_id: "${x_id}", trigger_type: VOLUNTARY }, as: BoardAdmin, captures: { val_id: $.data.id, v1: $.data.version } }
            - { call: "POST /governance/exit-valuations/${val_id}/appraise", payload: { appraised_practice_value_cents: 90000000, expected_valuation_version: "${v1}" }, as: BoardAdmin, captures: { v2: $.data.version } }
          trigger:
            - { call: "POST /governance/exit-valuations/${val_id}/dispute", payload: {}, as: Physician, as_user_id: "${x_id}", captures: { v3: $.data.version } }
            - { call: "POST /governance/exit-valuations/${val_id}/appraise", payload: { appraised_practice_value_cents: 95000000, expected_valuation_version: "${v3}" }, as: BoardAdmin, captures: { v4: $.data.version } }
            - { call: "POST /governance/exit-valuations/${val_id}/dispute", payload: {}, as: Physician, as_user_id: "${x_id}", captures: { v5: $.data.version } }
            - { call: "POST /governance/exit-valuations/${val_id}/dispute", payload: {}, as: Physician, as_user_id: "${x_id}", captures: { err_limit: $.data.error_id } }
            - { call: "POST /governance/exit-valuations/${val_id}/arbitrate", payload: {}, as: BoardAdmin, captures: { v6: $.data.version } }
            - { call: "POST /governance/exit-valuations/${val_id}/appraise", payload: { appraised_practice_value_cents: 100000000, expected_valuation_version: "${v6}" }, as: BoardAdmin, captures: { v7: $.data.version } }
            - { call: "POST /governance/exit-valuations/${val_id}/dispute", payload: {}, as: Physician, as_user_id: "${x_id}", captures: { err_final: $.data.error_id } }
          assert:
            - "First dispute: status DISPUTED, dispute_rounds == 1; re-appraisal returns to APPRAISED with final_value_cents == 80750000 (95000000 * 0.85)"
            - "Second dispute: DISPUTED, dispute_rounds == 2; third dispute rejected err_limit == ERR_DISPUTE_LIMIT_REACHED"
            - "After arbitrate + arbitrator appraisal: APPRAISED with appraisal_final == true and final_value_cents == 85000000 (100000000 * 0.85)"
            - "Dispute of a final appraisal rejected: err_final == ERR_INVALID_STATE"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: exit_finalize_three_hop_cascade
        grounds:
          - state_machines.ExitValuation.APPRAISED_to_FINALIZED
          - state_machines.Physician
          - state_machines.BoardSeat
          - state_machines.Committee
        distinguishing_aspect: |
          Depth-3 chain from the finalize trigger: ExitValuation FINALIZED ->
          Physician EXITED with shares returned (link 1) -> held BoardSeat
          vacated and committee membership removed (link 2, caused by the
          physician exit) -> Committee drops below quorum and becomes IMPAIRED
          (link 3, caused by the membership removal).
        test_recipe:
          setup:
            - "Policy quorum 1; S SHAREHOLDER 1000 shares; T SHAREHOLDER 1000 shares"
            - "Quality committee (quorum_count 1) with S as sole CHAIR -> ACTIVE; SEAT-1 FILLED by S (term 2026-08-01..2029-08-01)"
            - "S exit valuation APPRAISED at 90000000 (final 38250000 at ownership 1/2); BUYOUT_APPROVAL motion adopted (T is the only eligible voter once S is EXITING)"
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr S", hire_date: "2012-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr T", hire_date: "2013-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /governance/committees", payload: { name: "Quality Committee", committee_type: QUALITY, quorum_count: 1, approval_threshold: SIMPLE_MAJORITY }, as: BoardAdmin, captures: { com_id: $.data.id } }
            - { call: "POST /governance/committees/${com_id}/members", payload: { physician_id: "${s_id}", committee_role: CHAIR }, as: BoardAdmin }
            - { call: "POST /governance/board-seats", payload: { seat_label: "SEAT-1", seat_class: CLINICAL }, as: BoardAdmin, captures: { seat_id: $.data.id } }
            - { call: "POST /governance/board-seats/${seat_id}/appoint", payload: { physician_id: "${s_id}", term_start: "2026-08-01T00:00:00Z", term_end: "2029-08-01T00:00:00Z" }, as: BoardAdmin }
            - { call: "POST /governance/exit-valuations", payload: { physician_id: "${s_id}", trigger_type: VOLUNTARY }, as: BoardAdmin, captures: { val_id: $.data.id, val_v: $.data.version } }
            - { call: "POST /governance/exit-valuations/${val_id}/appraise", payload: { appraised_practice_value_cents: 90000000, expected_valuation_version: "${val_v}" }, as: BoardAdmin }
            - { call: "POST /governance/motions", payload: { motion_type: BUYOUT_APPROVAL, sponsor_physician_id: "${t_id}", payload: { exit_valuation_id: "${val_id}" } }, as: Physician, as_user_id: "${t_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${t_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${t_id}" }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${t_id}" }
            - { call: "POST /governance/motions/${m_id}/close", payload: {}, as: BoardAdmin }
          trigger:
            - { call: "POST /governance/exit-valuations/${val_id}/finalize", payload: { motion_id: "${m_id}" }, as: BoardAdmin }
            - { call: "GET /governance/physicians/${s_id}", as: BoardAdmin }
            - { call: "GET /governance/board-seats/${seat_id}", as: BoardAdmin }
            - { call: "GET /governance/committees/${com_id}", as: BoardAdmin }
            - { call: "GET /governance/policy", as: BoardAdmin }
          assert:
            - "ExitValuation.${val_id}.status == FINALIZED; payment_schedule_cents == [15300000, 11475000, 11475000] (40/30/30 of 38250000)"
            - "Link 1: Physician.${s_id}.partnership_status == EXITED and shares_held == 0; GovernancePolicy.treasury_shares == 999000 (998000 authorized remainder + 1000 returned)"
            - "Link 2: BoardSeat.${seat_id}.status == VACANT with current_holder_physician_id == null (no successor booked)"
            - "Link 3: Committee.${com_id}.active_member_count == 0 and status == IMPAIRED (0 < quorum_count 1)"

      - name: coi_flag_recusal_vote_voiding_cascade
        grounds:
          - state_machines.COIDisclosure.FILED_to_FLAGGED
          - state_machines.Vote.CAST_to_VOIDED
          - calculations.vote_threshold
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (COI review, not finalize):
          FLAGGED -> Motion recusal recompute (link 1: eligible_voter_count and
          required_votes change) -> the recused physician's CAST vote is VOIDED
          (link 2, caused by the recusal, not by the review directly).
        test_recipe:
          setup:
            - "Policy quorum 1; T, U, V SHAREHOLDERs (1000 each); FINANCE committee ACTIVE (V is its sole member, quorum 1)"
            - "CHARTER_AMENDMENT motion (SUPERMAJORITY) OPEN with snapshot {T,U,V}: eligible 3, required_votes 2; T has voted FOR; T's COI disclosure on the motion is FILED"
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr T", hire_date: "2014-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr U", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr V", hire_date: "2016-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /governance/committees", payload: { name: "Finance Committee", committee_type: FINANCE, quorum_count: 1, approval_threshold: SIMPLE_MAJORITY }, as: BoardAdmin, captures: { com_id: $.data.id } }
            - { call: "POST /governance/committees/${com_id}/members", payload: { physician_id: "${v_id}", committee_role: MEMBER }, as: BoardAdmin }
            - { call: "POST /governance/motions", payload: { motion_type: CHARTER_AMENDMENT, sponsor_physician_id: "${t_id}", committee_id: "${com_id}", payload: { new_quorum_count: 1 } }, as: Physician, as_user_id: "${t_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${t_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${t_id}" }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${t_id}", captures: { vote_id: $.data.id } }
            - { call: "POST /governance/coi-disclosures", payload: { related_motion_id: "${m_id}", description: "Spouse employed by vendor under charter review" }, as: Physician, as_user_id: "${t_id}", captures: { coi_id: $.data.id } }
          trigger:
            - { call: "POST /governance/coi-disclosures/${coi_id}/review", payload: { outcome: FLAGGED, review_note: "Material conflict confirmed" }, as: ComplianceOfficer }
            - { call: "GET /governance/motions/${m_id}", as: BoardAdmin }
            - { call: "GET /governance/motions/${m_id}/votes", as: BoardAdmin }
          assert:
            - "COIDisclosure.${coi_id}.status == FLAGGED and reviewed_by is the ComplianceOfficer id"
            - "Link 1: Motion.${m_id}.recused_physician_ids contains ${t_id}; eligible_voter_count == 2; required_votes == 2 (ceil(2/3 * 2))"
            - "Link 2: Vote.${vote_id}.status == VOIDED with void_reason == COI_RECUSAL; Motion.${m_id}.votes_for == 0 (tally excludes voided ballots)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: assessment_pay_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_ASSESSMENT_NOT_PAYABLE]
          - errors[ERR_OVERPAYMENT]
        distinguishing_aspect: |
          Category pair state-vs-business_fiscal: a payment that is BOTH on a
          DEFAULTED assessment (state) AND above the remaining due (fiscal)
          must return the state error ERR_ASSESSMENT_NOT_PAYABLE (priority 6
          before priority 10).
        test_recipe:
          setup:
            - "Policy defaults (late_fee 0.10, grace 30 days) with quorum 1; sole SHAREHOLDER A (1000 shares)"
            - "Capital call 5000000 due 2026-08-10T00:00:00Z adopted and billed; A's assessment is 5000000"
            - "Clock advanced past due date (DELINQUENT, late fee 500000) then past due+grace (DEFAULTED)"
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 5000000, due_date: "2026-08-10T00:00:00Z", purpose: " malpractice tail" } }, as: Physician, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/close", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/capital-calls?motion_id=${m_id}", as: BoardAdmin, captures: { cc_id: "$.data[0].id" } }
            - { call: "POST /governance/capital-calls/${cc_id}/bill", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/physicians/${a_id}/assessments", as: BoardAdmin, captures: { asmt_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: BoardAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: BoardAdmin }
          trigger:
            - { call: "POST /governance/capital-call-assessments/${asmt_id}/pay", payload: { amount_cents: 99000000 }, as: BoardAdmin, captures: { err_pay: $.data.error_id } }
            - { call: "GET /governance/physicians/${a_id}", as: BoardAdmin }
          assert:
            - "err_pay == ERR_ASSESSMENT_NOT_PAYABLE (state category beats the fiscal ERR_OVERPAYMENT the amount would also trigger)"
            - "CapitalCallAssessment.${asmt_id}.status == DEFAULTED with late_fee_cents == 500000 applied exactly once"
            - "Sweep cascade: Physician.${a_id}.standing == SUSPENDED"

      - name: recused_vote_safety_beats_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_VOTER_RECUSED]
          - errors[ERR_VOTING_CLOSED]
        distinguishing_aspect: |
          Category pair business_safety-vs-business_temporal (different pair
          from assessment_pay_state_beats_fiscal): a ballot that is BOTH from a
          recused voter AND at/after closes_at must return ERR_VOTER_RECUSED
          (priority 7 before priority 8).
        test_recipe:
          setup:
            - "Policy quorum 1, voting window 14 days; SHAREHOLDERs A (sponsor) and B"
            - "CAPITAL_CALL motion OPEN since 2026-08-01T00:00:00Z (closes_at 2026-08-15T00:00:00Z); B recused via FLAGGED COI disclosure on this motion"
            - "Clock at exactly 2026-08-15T00:00:00Z: the sweep expires only when clock > closes_at, so the motion is still OPEN but the ballot gate (clock < closes_at) is closed"
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr B", hire_date: "2016-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 100000, due_date: "2026-08-20T00:00:00Z", purpose: "Supplies" } }, as: Physician, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/coi-disclosures", payload: { related_motion_id: "${m_id}", description: "B owns the supplier company" }, as: Physician, as_user_id: "${b_id}", captures: { coi_id: $.data.id } }
            - { call: "POST /governance/coi-disclosures/${coi_id}/review", payload: { outcome: FLAGGED }, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: BoardAdmin }
          trigger:
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${b_id}", captures: { err_vote: $.data.error_id } }
            - { call: "GET /governance/motions/${m_id}", as: BoardAdmin }
          assert:
            - "err_vote == ERR_VOTER_RECUSED (safety priority 7 beats temporal priority 8; ERR_VOTING_CLOSED must NOT be returned)"
            - "Motion.${m_id}.status == OPEN (clock == closes_at does not trigger the strict-> expiry sweep)"
            - "Motion.${m_id}.votes_for == 0 (no ballot recorded)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: supermajority_exact_threshold_boundary
        grounds:
          - calculations.vote_threshold
          - entities.Motion.fields.required_votes
        distinguishing_aspect: |
          Ballot-count metric through POST /motions/{id}/close: with 3 eligible
          voters the SUPERMAJORITY requirement is ceil(2/3*3) == 2; votes_for ==
          2 adopts (>= is inclusive) while votes_for == 1 rejects — the boundary
          sits exactly at the required count.
        test_recipe:
          setup:
            - "Policy quorum 2; SHAREHOLDERs A, B, C (1000 each); QUALITY committee ACTIVE (A sole member, quorum 1)"
            - "M1: CHARTER_AMENDMENT OPEN (eligible 3, required 2) with two FOR ballots; M2: same shape with one FOR and one AGAINST"
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 2 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr B", hire_date: "2016-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr C", hire_date: "2017-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /governance/committees", payload: { name: "Quality Committee", committee_type: QUALITY, quorum_count: 1, approval_threshold: SIMPLE_MAJORITY }, as: BoardAdmin, captures: { com_id: $.data.id } }
            - { call: "POST /governance/committees/${com_id}/members", payload: { physician_id: "${a_id}", committee_role: MEMBER }, as: BoardAdmin }
            - { call: "POST /governance/motions", payload: { motion_type: CHARTER_AMENDMENT, sponsor_physician_id: "${a_id}", committee_id: "${com_id}", payload: { new_quorum_count: 1 } }, as: Physician, as_user_id: "${a_id}", captures: { m1_id: $.data.id } }
            - { call: "POST /governance/motions/${m1_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m1_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m1_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m1_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${b_id}" }
            - { call: "POST /governance/motions/${m1_id}/close", payload: {}, as: BoardAdmin }
            - { call: "POST /governance/motions", payload: { motion_type: CHARTER_AMENDMENT, sponsor_physician_id: "${a_id}", committee_id: "${com_id}", payload: { new_quorum_count: 1 } }, as: Physician, as_user_id: "${a_id}", captures: { m2_id: $.data.id } }
            - { call: "POST /governance/motions/${m2_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m2_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m2_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m2_id}/votes", payload: { vote_choice: AGAINST }, as: Physician, as_user_id: "${b_id}" }
            - { call: "POST /governance/motions/${m2_id}/close", payload: {}, as: BoardAdmin }
          trigger:
            - { call: "GET /governance/motions/${m1_id}", as: BoardAdmin }
            - { call: "GET /governance/motions/${m2_id}", as: BoardAdmin }
            - { call: "GET /governance/committees/${com_id}", as: BoardAdmin }
          assert:
            - "M1: votes_for == 2 == required_votes -> status ADOPTED (equality meets the threshold)"
            - "Adoption side effect fired exactly for M1: Committee.${com_id}.quorum_count == 1 and charter_version == 2"
            - "M2: votes_for == 1 < required_votes == 2 -> status REJECTED (ballots 2 >= quorum 2, so the rejection is the threshold boundary, not quorum)"
            - "Committee charter_version still == 2 after M2 (no adoption side effect on rejection)"

      - name: assessment_pay_exact_remaining_boundary
        grounds:
          - entities.CapitalCallAssessment.fields.total_due_cents
          - calculations.capital_call_assessment
          - errors[ERR_OVERPAYMENT]
        distinguishing_aspect: |
          Money-remaining metric (different metric from ballot counts) through
          POST /capital-call-assessments/{id}/pay (different endpoint from
          close): amount == total_due succeeds exactly (PAID), amount ==
          total_due + 1 cent fails with ERR_OVERPAYMENT, amount == total_due -
          1 leaves PARTIAL.
        test_recipe:
          setup:
            - "Policy quorum 1; sole SHAREHOLDER A; two adopted+billed capital calls of 5000000 each (assessment1 and assessment2, 5000000 each)"
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 5000000, due_date: "2026-08-20T00:00:00Z", purpose: "Call one" } }, as: Physician, as_user_id: "${a_id}", captures: { m1_id: $.data.id } }
            - { call: "POST /governance/motions/${m1_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m1_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m1_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m1_id}/close", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/capital-calls?motion_id=${m1_id}", as: BoardAdmin, captures: { cc1_id: "$.data[0].id" } }
            - { call: "POST /governance/capital-calls/${cc1_id}/bill", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/capital-calls/${cc1_id}/assessments", as: BoardAdmin, captures: { asmt1_id: "$.data[0].id" } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 5000000, due_date: "2026-08-20T00:00:00Z", purpose: "Call two" } }, as: Physician, as_user_id: "${a_id}", captures: { m2_id: $.data.id } }
            - { call: "POST /governance/motions/${m2_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m2_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m2_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m2_id}/close", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/capital-calls?motion_id=${m2_id}", as: BoardAdmin, captures: { cc2_id: "$.data[0].id" } }
            - { call: "POST /governance/capital-calls/${cc2_id}/bill", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/capital-calls/${cc2_id}/assessments", as: BoardAdmin, captures: { asmt2_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /governance/capital-call-assessments/${asmt1_id}/pay", payload: { amount_cents: 5000000 }, as: BoardAdmin }
            - { call: "POST /governance/capital-call-assessments/${asmt2_id}/pay", payload: { amount_cents: 5000001 }, as: BoardAdmin, captures: { err_over: $.data.error_id } }
            - { call: "POST /governance/capital-call-assessments/${asmt2_id}/pay", payload: { amount_cents: 4999999 }, as: BoardAdmin }
          assert:
            - "assessment1: paid_cents == 5000000 == total_due_cents -> status PAID (exact-remaining succeeds)"
            - "assessment2: 5000001 rejected err_over == ERR_OVERPAYMENT; no partial application (paid_cents still 0)"
            - "assessment2 after 4999999: status PARTIAL, paid_cents == 4999999 (one cent short of PAID)"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: charter_amendment_open_requires_active_committee
        grounds:
          - state_machines.Motion.PROPOSED_to_OPEN
          - state_machines.Committee
          - errors[ERR_COMMITTEE_IMPAIRED]
        distinguishing_aspect: |
          Entity pair Motion -> Committee: a CHARTER_AMENDMENT motion may only
          open while its committee is ACTIVE; impairing the committee (member
          removal below quorum) blocks open, and restoring membership unblocks it.
        test_recipe:
          setup:
            - "Policy quorum 1; SHAREHOLDER A; COMPENSATION committee (quorum 1) with A as CHAIR -> ACTIVE, then A removed -> IMPAIRED"
            - "CHARTER_AMENDMENT motion (sponsor A) in PROPOSED targeting that committee"
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/committees", payload: { name: "Compensation Committee", committee_type: COMPENSATION, quorum_count: 1, approval_threshold: SIMPLE_MAJORITY }, as: BoardAdmin, captures: { com_id: $.data.id } }
            - { call: "POST /governance/committees/${com_id}/members", payload: { physician_id: "${a_id}", committee_role: CHAIR }, as: BoardAdmin }
            - { call: "POST /governance/committees/${com_id}/members/${a_id}/remove", payload: {}, as: BoardAdmin }
            - { call: "POST /governance/motions", payload: { motion_type: CHARTER_AMENDMENT, sponsor_physician_id: "${a_id}", committee_id: "${com_id}", payload: { new_quorum_count: 1 } }, as: Physician, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
          trigger:
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}", captures: { err_open: $.data.error_id } }
            - { call: "POST /governance/committees/${com_id}/members", payload: { physician_id: "${a_id}", committee_role: CHAIR }, as: BoardAdmin }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
          assert:
            - "First open rejected: err_open == ERR_COMMITTEE_IMPAIRED (committee IMPAIRED blocks the motion, a Motion -> Committee dependency)"
            - "Re-adding the chair returns Committee.${com_id}.status to ACTIVE (IMPAIRED -> ACTIVE cycle)"
            - "Second open succeeds: Motion.${m_id}.status == OPEN with eligible_voter_count == 1"

      - name: exit_finalize_requires_adopted_buyout_motion
        grounds:
          - state_machines.ExitValuation.APPRAISED_to_FINALIZED
          - errors[ERR_BUYOUT_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair ExitValuation -> Motion (different pair from
          Motion -> Committee): finalize is gated on an ADOPTED BUYOUT_APPROVAL
          motion whose payload links this valuation; a merely PROPOSED motion
          yields ERR_BUYOUT_NOT_APPROVED, and only after adoption does finalize succeed.
        test_recipe:
          setup:
            - "Policy quorum 1; X SHAREHOLDER 1000 (exiting), T SHAREHOLDER 1000"
            - "X's exit valuation APPRAISED at 90000000 (final 38250000 at ownership 1/2); BUYOUT_APPROVAL motion sponsored by T, initially only PROPOSED"
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr X", hire_date: "2010-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { x_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr T", hire_date: "2011-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /governance/exit-valuations", payload: { physician_id: "${x_id}", trigger_type: RETIREMENT }, as: BoardAdmin, captures: { val_id: $.data.id, val_v: $.data.version } }
            - { call: "POST /governance/exit-valuations/${val_id}/appraise", payload: { appraised_practice_value_cents: 90000000, expected_valuation_version: "${val_v}" }, as: BoardAdmin }
            - { call: "POST /governance/motions", payload: { motion_type: BUYOUT_APPROVAL, sponsor_physician_id: "${t_id}", payload: { exit_valuation_id: "${val_id}" } }, as: Physician, as_user_id: "${t_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${t_id}" }
          trigger:
            - { call: "POST /governance/exit-valuations/${val_id}/finalize", payload: { motion_id: "${m_id}" }, as: BoardAdmin, captures: { err_fin: $.data.error_id } }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${t_id}" }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${t_id}" }
            - { call: "POST /governance/motions/${m_id}/close", payload: {}, as: BoardAdmin }
            - { call: "POST /governance/exit-valuations/${val_id}/finalize", payload: { motion_id: "${m_id}" }, as: BoardAdmin }
          assert:
            - "First finalize rejected: err_fin == ERR_BUYOUT_NOT_APPROVED while the motion is merely PROPOSED"
            - "After adoption, finalize succeeds: status FINALIZED, approving_motion_id == ${m_id}"
            - "payment_schedule_cents == [15300000, 11475000, 11475000] and Physician.${x_id}.partnership_status == EXITED"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: board_seat_half_open_term_succession
        grounds:
          - state_machines.BoardSeat
          - entities.BoardSeat.fields.current_term_end
          - errors[ERR_SEAT_TERM_OVERLAP]
        distinguishing_aspect: |
          BoardSeat terms use HALF-OPEN interval semantics [start, end): a
          successor window starting exactly at current_term_end is legal
          adjacency, while one day earlier collides; the sweep at clock ==
          term_end promotes the booked successor.
        test_recipe:
          setup:
            - "Policy defaults; SHAREHOLDERs A, B, C; SEAT-9 (AT_LARGE) FILLED by A with term [2026-08-01, 2029-08-01)"
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr B", hire_date: "2016-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr C", hire_date: "2017-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /governance/board-seats", payload: { seat_label: "SEAT-9", seat_class: AT_LARGE }, as: BoardAdmin, captures: { seat_id: $.data.id } }
            - { call: "POST /governance/board-seats/${seat_id}/appoint", payload: { physician_id: "${a_id}", term_start: "2026-08-01T00:00:00Z", term_end: "2029-08-01T00:00:00Z" }, as: BoardAdmin }
          trigger:
            - { call: "POST /governance/board-seats/${seat_id}/appoint", payload: { physician_id: "${b_id}", term_start: "2029-01-01T00:00:00Z", term_end: "2032-01-01T00:00:00Z" }, as: BoardAdmin, captures: { err_olap: $.data.error_id } }
            - { call: "POST /governance/board-seats/${seat_id}/appoint", payload: { physician_id: "${b_id}", term_start: "2029-08-01T00:00:00Z", term_end: "2032-08-01T00:00:00Z" }, as: BoardAdmin }
            - { call: "POST /governance/board-seats/${seat_id}/appoint", payload: { physician_id: "${c_id}", term_start: "2032-08-01T00:00:00Z", term_end: "2035-08-01T00:00:00Z" }, as: BoardAdmin, captures: { err_succ: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2029-08-01T00:00:00Z" }, as: BoardAdmin }
            - { call: "GET /governance/board-seats/${seat_id}", as: BoardAdmin }
          assert:
            - "err_olap == ERR_SEAT_TERM_OVERLAP (2029-01-01 < current_term_end 2029-08-01)"
            - "Adjacent booking (start == current_term_end) succeeds: next_holder == ${b_id} (half-open semantics allow touching intervals)"
            - "err_succ == ERR_SUCCESSOR_ALREADY_BOOKED (at most one booked successor)"
            - "After sweep at exactly term_end: seat FILLED with current_holder == ${b_id}, current_term_start == 2029-08-01T00:00:00Z, next_holder cleared to null"

      - name: buy_in_offer_closed_acceptance_window
        grounds:
          - state_machines.BuyInOffer
          - entities.BuyInOffer.fields.acceptance_deadline
          - errors[ERR_OFFER_WINDOW_OVERLAP]
        distinguishing_aspect: |
          BuyInOffer acceptance windows use CLOSED interval semantics (different
          geometry from the half-open seat terms and on a different resource):
          acceptance AT the deadline instant is legal, a second offer collides
          while the window is open, and only clock > deadline expires it.
        test_recipe:
          setup:
            - "Policy defaults (offer window 30 days); associates P and Q (hired 2024-01-01)"
            - "O1 for P offered at 2026-08-01T00:00:00Z (deadline 2026-08-31T00:00:00Z), priced 8800000 (10000000 base x 0.96 tenure x 11/12 proration)"
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr P", hire_date: "2024-01-01T00:00:00Z" }, as: BoardAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr Q", hire_date: "2024-01-01T00:00:00Z" }, as: BoardAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /governance/buy-in-offers", payload: { physician_id: "${p_id}", target_tier: PARTNER_TRACK, share_grant: 0, installment_count: 1 }, as: BoardAdmin, captures: { o1_id: $.data.id } }
          trigger:
            - { call: "POST /governance/buy-in-offers", payload: { physician_id: "${p_id}", target_tier: PARTNER_TRACK, share_grant: 0, installment_count: 1 }, as: BoardAdmin, captures: { err_olap: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: BoardAdmin }
            - { call: "POST /governance/buy-in-offers/${o1_id}/respond", payload: { decision: ACCEPT }, as: Physician, as_user_id: "${p_id}" }
            - { call: "POST /governance/buy-in-offers", payload: { physician_id: "${p_id}", target_tier: PARTNER_TRACK, share_grant: 0, installment_count: 1 }, as: BoardAdmin, captures: { o2_id: $.data.id } }
            - { call: "POST /governance/buy-in-offers", payload: { physician_id: "${q_id}", target_tier: PARTNER_TRACK, share_grant: 0, installment_count: 1 }, as: BoardAdmin, captures: { o3_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: BoardAdmin }
            - { call: "POST /governance/buy-in-offers/${o3_id}/respond", payload: { decision: ACCEPT }, as: Physician, as_user_id: "${q_id}", captures: { err_late: $.data.error_id } }
          assert:
            - "err_olap == ERR_OFFER_WINDOW_OVERLAP (O1's window still open at 2026-08-01)"
            - "Acceptance AT the deadline instant (clock == 2026-08-31T00:00:00Z) succeeds: O1.status == ACCEPTED (closed interval, inclusive end)"
            - "After acceptance the window is closed by the terminal-ish state: a fresh offer O2 for P is created successfully"
            - "Q's offer swept to EXPIRED once clock > deadline; late accept rejected err_late == ERR_OFFER_NOT_OPEN"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: shares_conserved_across_exit_and_buyin
        grounds:
          - entities.GovernancePolicy.fields.treasury_shares
          - entities.Physician.fields.shares_held
          - calculations.ownership_recalc
        distinguishing_aspect: |
          Conserved quantity = authorized share count: exit finalize (forward)
          moves 1000 shares to treasury (991000 -> 992000) and buy-in completion
          (compensating) moves 1000 back out (992000 -> 991000);
          treasury_shares + sum(shares_held) == total_shares_authorized after each leg.
        test_recipe:
          setup:
            - "Policy 1000000 authorized, quorum 1; X SHAREHOLDER 1000, Y SHAREHOLDER 8000 (treasury 991000)"
            - "X's exit finalized via adopted BUYOUT_APPROVAL (final value 8500000 at ownership 1/9 of 90000000 appraisal with 0.85 factor)"
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr X", hire_date: "2011-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { x_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr Y", hire_date: "2012-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 8000 }, as: BoardAdmin, captures: { y_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr Z", hire_date: "2024-08-01T00:00:00Z" }, as: BoardAdmin, captures: { z_id: $.data.id } }
            - { call: "POST /governance/exit-valuations", payload: { physician_id: "${x_id}", trigger_type: VOLUNTARY }, as: BoardAdmin, captures: { val_id: $.data.id, val_v: $.data.version } }
            - { call: "POST /governance/exit-valuations/${val_id}/appraise", payload: { appraised_practice_value_cents: 90000000, expected_valuation_version: "${val_v}" }, as: BoardAdmin }
            - { call: "POST /governance/motions", payload: { motion_type: BUYOUT_APPROVAL, sponsor_physician_id: "${y_id}", payload: { exit_valuation_id: "${val_id}" } }, as: Physician, as_user_id: "${y_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${y_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${y_id}" }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${y_id}" }
            - { call: "POST /governance/motions/${m_id}/close", payload: {}, as: BoardAdmin }
          trigger:
            - { call: "POST /governance/exit-valuations/${val_id}/finalize", payload: { motion_id: "${m_id}" }, as: BoardAdmin }
            - { call: "GET /governance/policy", as: BoardAdmin, captures: { treasury_after_exit: $.data.treasury_shares } }
            - { call: "POST /governance/buy-in-offers", payload: { physician_id: "${z_id}", target_tier: SHAREHOLDER, share_grant: 1000, installment_count: 1 }, as: BoardAdmin, captures: { oz_id: $.data.id, z_amt: $.data.final_amount_cents } }
            - { call: "POST /governance/buy-in-offers/${oz_id}/respond", payload: { decision: ACCEPT }, as: Physician, as_user_id: "${z_id}" }
            - { call: "POST /governance/buy-in-offers/${oz_id}/pay-installment", payload: { amount_cents: "${z_amt}" }, as: BoardAdmin }
            - { call: "GET /governance/policy", as: BoardAdmin, captures: { treasury_after_buyin: $.data.treasury_shares } }
          assert:
            - "treasury_after_exit == 992000 (991000 + 1000 returned shares); X.shares_held == 0"
            - "Z's offer final_amount_cents == 22000000 (25000000 x 0.96 x 11/12, tenure 2 years) and completing it issues 1000 shares"
            - "treasury_after_buyin == 991000; Z.partnership_status == SHAREHOLDER with shares_held == 1000"
            - "Invariant: treasury_shares + sum(shares_held over all physicians) == 1000000 after BOTH the forward (exit) and compensating (buy-in) legs"

      - name: capital_ledger_conserved_across_pay_and_clawback
        grounds:
          - entities.Physician.fields.capital_account_balance_cents
          - state_machines.Distribution
          - calculations.distribution_allocation
        distinguishing_aspect: |
          Conserved quantity = the capital ledger identity (different quantity
          type from share counts): sum(capital_account_balance_cents) ==
          sum(assessment paid_cents) - sum(PAID allocation cents). Allocation
          pay (forward) drives A negative (-2000001); distribution void
          (compensating) restores every account exactly.
        test_recipe:
          setup:
            - "Policy quorum 1; A 1000 shares (senior), B 1000 shares (senior), C 500 shares (junior)"
            - "Capital call 5000000 adopted+billed (A 2000000, B 2000000, C 1000000) and all three paid in full -> call COLLECTED"
            - "PRO_RATA distribution 10000001 adopted (A 4000001, B 4000000, C 2000000); only A's allocation disbursed"
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr B", hire_date: "2016-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr C", hire_date: "2025-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 500 }, as: BoardAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 5000000, due_date: "2026-08-20T00:00:00Z", purpose: "Equipment" } }, as: Physician, as_user_id: "${a_id}", captures: { m1_id: $.data.id } }
            - { call: "POST /governance/motions/${m1_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m1_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m1_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m1_id}/close", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/capital-calls?motion_id=${m1_id}", as: BoardAdmin, captures: { cc_id: "$.data[0].id" } }
            - { call: "POST /governance/capital-calls/${cc_id}/bill", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/physicians/${a_id}/assessments", as: BoardAdmin, captures: { asmt_a: "$.data[0].id" } }
            - { call: "GET /governance/physicians/${b_id}/assessments", as: BoardAdmin, captures: { asmt_b: "$.data[0].id" } }
            - { call: "GET /governance/physicians/${c_id}/assessments", as: BoardAdmin, captures: { asmt_c: "$.data[0].id" } }
            - { call: "POST /governance/capital-call-assessments/${asmt_a}/pay", payload: { amount_cents: 2000000 }, as: BoardAdmin }
            - { call: "POST /governance/capital-call-assessments/${asmt_b}/pay", payload: { amount_cents: 2000000 }, as: BoardAdmin }
            - { call: "POST /governance/capital-call-assessments/${asmt_c}/pay", payload: { amount_cents: 1000000 }, as: BoardAdmin }
            - { call: "POST /governance/motions", payload: { motion_type: DISTRIBUTION, sponsor_physician_id: "${a_id}", payload: { amount_cents: 10000001, method: PRO_RATA, fiscal_net_income_before_bonus_cents: 800000000 } }, as: Physician, as_user_id: "${a_id}", captures: { m2_id: $.data.id } }
            - { call: "POST /governance/motions/${m2_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m2_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m2_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${b_id}" }
            - { call: "POST /governance/motions/${m2_id}/close", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/distributions?motion_id=${m2_id}", as: BoardAdmin, captures: { d_id: "$.data[0].id" } }
            - { call: "POST /governance/distributions/${d_id}/allocations/${a_id}/pay", payload: {}, as: BoardAdmin }
          trigger:
            - { call: "POST /governance/distributions/${d_id}/void", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/physicians/${a_id}", as: BoardAdmin }
            - { call: "GET /governance/physicians/${b_id}", as: BoardAdmin }
            - { call: "GET /governance/physicians/${c_id}", as: BoardAdmin }
            - { call: "GET /governance/distributions/${d_id}", as: BoardAdmin }
          assert:
            - "Before void: A.capital_account_balance_cents == -2000001 (2000000 - 4000001); ledger identity 999999 == 5000000 - 4000001"
            - "After void: A == 2000000, B == 2000000, C == 1000000 — every account restored to the post-call balance exactly"
            - "Distribution.${d_id}.status == VOIDED; A's allocation CLAWED_BACK, B and C allocations CANCELLED"
            - "Invariant: sum(capital accounts) 5000000 == sum(assessment payments) 5000000 - sum(PAID allocations) 0"
