            - { call: "POST /plant/additive-lots/${cul_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/additive-lots/${coa_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/make-sheets", payload: { vat_id: "${vat_id}", milk_intake_id: "${milk_id}", variety: "MUENSTER", scheduled_start: "2026-08-01T02:00:00Z", scheduled_end: "2026-08-01T04:00:00Z", liters_committed: 5000.0, culture_lot_id: "${cul_id}", coagulant_lot_id: "${coa_id}", culture_units_planned: 5.0, coagulant_ml_planned: 250.0, expected_vat_version: "${vat_v}" }, as: MakePlanner, captures: { make_a: $.data.id } }
            - { call: "POST /plant/make-sheets/${make_a}/start", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
