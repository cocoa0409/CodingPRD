              payload: { tariff_code: "DD-NEI-1", charge_scope: "DEMURRAGE", free_time_days: 2, per_diem_rate_cents: 5000, accrual_method: "CALENDAR", change_type: "NEW", effective_date: "2026-09-02T00:00:00Z", expected_carrier_version: "${carrier_bv}" }
              as: CarrierRep
              as_user_id: "${carrier_b}"
              captures: { t_nei: $.data.id }
            - *c_clock3
            - call: "POST /fmc/tariff-publications/${t_nei}/publish"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_b}"
            - *c_clock10
          trigger:
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-XREF-1", charge_basis: "TARIFF", tariff_id: "${t_nei}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU9200004", port_code: "USNYC", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-08T00:00:00Z", last_accrual_date: "2026-09-08T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_TARIFF_CARRIER_MISMATCH"
            - "no invoice persists for ${carrier_id}"

      - name: contract_basis_invoice_wrong_billed_party_rejected_then_correct_accepted
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors.ERR_BILLED_PARTY_NOT_CONTRACT_PARTY
        distinguishing_aspect: "SERVICE_CONTRACT-basis invoicing pins the billed party to the contract's shipper: billing a different shipper fails 422 ERR_BILLED_PARTY_NOT_CONTRACT_PARTY; billing the contract shipper succeeds and prices from the negotiated terms (3 free days, 12000/day -> 2 billable days = 24000)."
        test_recipe:
          setup:
            - "VOCC carrier; shippers S1 (contract party) and S2; EFFECTIVE contract SC-RT-1 for S1; clock 2026-09-10."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - *c_shipper
