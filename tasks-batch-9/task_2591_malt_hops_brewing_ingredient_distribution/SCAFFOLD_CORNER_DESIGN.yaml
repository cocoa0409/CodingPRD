              as: Brewer
              as_user_id: "${tl_id}"
              captures: { tl_a_line: $.data.id }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${tl_id}", requested_ship_date: "2026-09-11T00:00:00Z", purchase_order_ref: "PO-TL-B" }
              as: Brewer
              as_user_id: "${tl_id}"
              captures: { tl_b_id: $.data.id }
