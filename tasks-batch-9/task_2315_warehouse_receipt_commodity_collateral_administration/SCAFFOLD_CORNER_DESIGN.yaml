        distinguishing_aspect: "The void window is measured on the logical clock: at 2026-08-09T08:00:00Z the receipt issued 2026-08-05T08:00:00Z is 96 hours old, past RECEIPT_VOID_WINDOW_HOURS 72, so the void returns 422 ERR_VOID_WINDOW_EXPIRED and the receipt stays ISSUED."
