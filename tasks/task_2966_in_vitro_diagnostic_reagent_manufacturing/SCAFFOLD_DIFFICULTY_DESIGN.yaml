      - name: fefo_waterfall_four_phase_order_with_filtered_earliest_lot
        grounds:
          - calculations.fefo_allocation
          - calculations.reagent_lot_unit_conservation
          - entities.Allocation.fields.sequence_index
          - entities.DistributionOrder.fields.required_min_shelf_life_days
          - entities.ProductSpecification.fields.min_shelf_life_days_at_ship
          - state_machines.DistributionOrder.DRAFT_to_ALLOCATED
        distinguishing_aspect: |
          Four released lots interact through the pinned four-phase order: the lot
          with the EARLIEST expiry (118 remaining days) is removed in phase 1 and
          therefore never wins the phase-2 ranking, the boundary lot at exactly
          120 remaining days survives the inclusive filter, and the draw stops
          mid-lot on the third candidate. floor_days is itself a max() of two
          independent inputs (order.required_min_shelf_life_days 120 and
          ProductSpecification.min_shelf_life_days_at_ship 90). Creation order is
          deliberately NOT expiry order, so a ranking that falls back on
          created_at or on insertion order produces a different waterfall.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z, then advanced per fill."
            - "One qualified ANTIBODY MaterialLot AB-CD19 with 4000.00 units received."
            - "One CLEARED ProductSpecification IVD-FEFO-1 with shelf_life_months_claim 6, min_shelf_life_days_at_ship 90 and release_test_codes [ACTIVITY]; clearance obtained through a complete four-record design trace."
