      - name: slot_lock_blocks_late_signup_and_late_cancel
        claim_type: precondition_enforcement
        grounds: [state_machines.ShiftSlot.OPEN_to_LOCKED, "errors[ERR_SLOT_LOCKED]", "errors[ERR_INVALID_SLOT_STATE]", "validations[priority=13]"]
        distinguishing_aspect: "Two enforcement layers for the same rule: before the scheduler epoch the slot is still OPEN and the dynamic T-24h check rejects with ERR_SLOT_LOCKED; after the epoch the slot is LOCKED and the state guard rejects with ERR_INVALID_SLOT_STATE. A late cancel of a CONFIRMED signup is also rejected."
        test_recipe:
          setup: ["slot 2026-08-15 09:00-12:00 OPEN; V1 oriented+signed with CONFIRMED signup S1; V2 oriented+signed"]
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/volunteers", payload: { full_name: "V Two", email: "v2@x.com", date_of_birth: "1990-05-21" }, as: GardenAdmin, captures: { v2_id: $.data.id } }
            - { call: "POST /api/volunteers/${v1_id}/orientation/complete", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v1_id}/waiver/sign", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v2_id}/orientation/complete", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v2_id}/waiver/sign", as: GardenAdmin }
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 100, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
            - { call: "POST /api/shift-slots", payload: { season_id: "${season_id}", task_type: "WEEDING", starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-15T12:00:00Z", capacity_total: 3, capacity_youth: 1 }, as: GardenAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /api/shift-slots/${slot_id}/transition", payload: { to_state: "OPEN" }, as: GardenAdmin }
            - { call: "POST /api/shift-signups", payload: { slot_id: "${slot_id}", volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { s1: $.data.id } }
            - { call: "POST /api/shift-signups/${s1}/confirm", as: GardenAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T10:00:00Z" }, as: GardenAdmin }
          trigger:
            - { call: "POST /api/shift-signups", payload: { slot_id: "${slot_id}", volunteer_id: "${v2_id}" }, as: Volunteer, as_user_id: "${v2_id}", captures: { err_late_signup: $.data.error_id } }
            - { call: "POST /api/shift-signups/${s1}/cancel", as: Volunteer, as_user_id: "${v1_id}", captures: { err_late_cancel: $.data.error_id } }
            - { call: "POST /api/_scheduler/run_epoch", as: GardenAdmin }
            - { call: "GET /api/shift-slots/${slot_id}", as: GardenAdmin, captures: { slot_st: $.data.status } }
            - { call: "POST /api/shift-signups", payload: { slot_id: "${slot_id}", volunteer_id: "${v2_id}" }, as: Volunteer, as_user_id: "${v2_id}", captures: { err_locked_signup: $.data.error_id } }
          assert:
            - "err_late_signup == ERR_SLOT_LOCKED (2026-08-14T10:00 >= starts_at - 24h; slot still OPEN — temporal guard fires)"
            - "err_late_cancel == ERR_SLOT_LOCKED"
            - "after epoch: slot_st == LOCKED"
            - "err_locked_signup == ERR_INVALID_SLOT_STATE (state guard now fires first)"

      - name: youth_signup_requires_certified_supervising_adult
        claim_type: guarded_transition
        grounds: [state_machines.ShiftSignup.REQUESTED_to_CONFIRMED, entities.ShiftSignup.fields.supervision_adult_signup_id, "errors[ERR_YOUTH_SUPERVISION_REQUIRED]", entities.ShiftSignup.fields.is_youth]
