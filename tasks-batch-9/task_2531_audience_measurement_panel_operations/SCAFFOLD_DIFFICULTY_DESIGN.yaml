              as: FieldTechnician
              captures: { mtv1_id: "$.data.id" }
            - call: "POST /meters/${mtv1_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /meters"
              payload: { household_id: "${hv1_id}", meter_type: "PORTABLE_OOH", serial_no: "MT-001702" }
              as: FieldTechnician
              captures: { mtv2_id: "$.data.id" }
