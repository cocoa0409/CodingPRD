      - name: cyclic_shape_bounded_revision_loop
        claim_type: cyclic_shape
        excluded_because:
          difficulty_instance: biocontrol_release_approve_return_revision_loop_is_bounded_at_two_passes
          rationale: |
            The only cycle in the scaffold is BioControlRelease REQUESTED -> APPROVED -> REQUESTED, and the
            §1.8 non_linear_state_machine instance already drives it three times, asserts revision_count at
            each pass and proves MAX_RELEASE_REVISIONS bounds the loop. A breadth copy would repeat the same
            calls with weaker assertions.

      - name: parallel_shape_independent_dimensions
        claim_type: parallel_shape
        excluded_because:
          difficulty_instance: harvest_lot_grading_and_cold_chain_dimensions_advance_independently
          rationale: |
            HarvestLot is the scaffold's only two-dimension entity, and the §1.8 instance interleaves the
            cold-chain and grading dimensions call by call, capturing the opposite dimension after every
            write to prove neither drags the other.

      - name: side_effect_cascade_down_from_a_parent_abort
        claim_type: side_effect_cascade_down
        excluded_because:
          difficulty_instance: crop_cycle_abort_cascade_cancels_task_then_repays_zone_budget
          rationale: |
            The cycle-abort cascade is the scaffold's cascade-down path: it force-cancels the scheduled task
            and repays the zone budget. The §1.8 instance already pins both hops to literals, including the
            exact 149.96 USD repayment and the worker's returned hours.

      - name: side_effect_compensation_on_undo
        claim_type: side_effect_compensation
        excluded_because:
          difficulty_instance: harvest_lot_graded_pounds_are_conserved_across_allocate_and_revoke
          rationale: |
            Revoking an allocation is the scaffold's compensation path. The §1.8 compensating_invariant
            instance asserts the pound identity before and after the undo plus the week and program rollback,
            which is strictly stronger than a breadth check that the fields merely changed.

      - name: guarded_transition_across_entities
        claim_type: guarded_transition
        excluded_because:
          difficulty_instance: lot_allocation_confirm_is_gated_on_the_harvest_lot_cold_chain_dimension
          rationale: |
            The LotAllocation PROVISIONAL -> CONFIRMED edge is guarded on the referenced HarvestLot's
            cold_chain_status, and the §1.8 cross_entity_state_dependency instance shows both the blocked and
            the unblocked call with only the guarding entity changing in between.

  # ===========================================================================
  - section: calculations
    instances:

      - name: pollination_strength_decays_one_week_and_the_mid_band_penalty_applies
        claim_type: correct_result
        grounds:
          - calculations.pollination_strength_decay
          - endpoints[POST /crop-cycles/{id}/hive-placements]
          - endpoints[POST /crop-cycles/{id}/pollination-checks]
          - entities.CropCycle.fields.pollination_haircut_pct
        test_recipe:
          setup:
            - "One zone with hive_slot_capacity 8, one tomato variety with requires_pollination true, one crop cycle in PRODUCTION."
            - "Four hives placed on 2026-08-24T08:00:00Z."
            - "The clock is then advanced to 2026-08-31T09:00:00Z, exactly one whole week after placement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZC-20", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zc20: $.data.id }
            - call: "POST /varieties"
              payload: { name: "Merlice TOV", crop_type: "TOMATO", cycle_length_weeks: 13, first_harvest_week: 4, plant_density_per_sqft: 0.24, yield_curve_lbs_per_sqft: [0.4, 0.8, 1.1, 1.3, 1.3, 1.2, 1.0, 0.9, 0.7, 0.5], grade_a_ratio_pct: 60, requires_pollination: true, ec_target_ms: 3.0 }
              as: GrowerManager
              captures: { vc20: $.data.id }
            - call: "POST /crop-cycles"
              payload: { zone_id: "${zc20}", variety_id: "${vc20}", transplant_date: "2026-08-03", plants_transplanted: 2157 }
              as: GrowerManager
              captures: { cc20: $.data.id, cc20_baseline: $.data.baseline_total_yield_lbs }
            - call: "POST /crop-cycles/${cc20}/transitions"
              payload: { to_status: "TRANSPLANTED" }
              as: GrowerManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-24T06:00:00Z" }
              as: GrowerManager
            - call: "POST /crop-cycles/${cc20}/transitions"
              payload: { to_status: "PRODUCTION" }
              as: GrowerManager
            - call: "POST /crop-cycles/${cc20}/hive-placements"
              payload: { hive_count: 4, placed_at: "2026-08-24T08:00:00Z" }
              as: GrowerManager
              captures: { cc20_hives: $.data.hive_count_placed, cc20_placed_at: $.data.hives_placed_at }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T09:00:00Z" }
              as: GrowerManager
          trigger:
            - call: "POST /crop-cycles/${cc20}/pollination-checks"
              payload: { observed_at: "2026-08-31T09:00:00Z", flower_visit_pct: 78, hive_activity_count: 60 }
              as: GrowerManager
              captures: { cc20_strength: $.data.pollination_strength_index, cc20_risk: $.data.pollination_risk_score, cc20_haircut: $.data.pollination_haircut_pct }
          assert:
            - "${cc20_hives} == 4"
            - "${cc20_baseline} == 82688.64"
            - "weeks_since_placement is floor(7 days 1 hour / 7 days) == 1, so base_strength is 100 * 0.88 == 88.00"
            - "flower_visit_pct 78 falls in the [LOW_VISIT_PCT 70, TARGET_VISIT_PCT 85) band, costing MID_BAND_PENALTY 8"
            - "hive_activity_count 60 is at or above MIN_ACTIVITY_COUNT 40, so LOW_ACTIVITY_PENALTY does not apply"
            - "${cc20_strength} == 80.00"
            - "${cc20_risk} == 20.00"
            - "${cc20_haircut} == 0.00"
            - "20.00 is below POLLINATION_RISK_THRESHOLD 30, so no haircut is taken"
            - "CropCycle.${cc20}.expected_total_yield_lbs == 82688.64"
            - "Zone.${zc20}.hive_slots_used == 4"

