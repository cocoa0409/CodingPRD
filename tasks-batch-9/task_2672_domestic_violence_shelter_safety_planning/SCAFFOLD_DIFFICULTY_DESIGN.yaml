          - entities.Client.fields.protective_order_active
          - calculations.client_confidentiality_posture
          - endpoints[POST /protective-order-cases/{id}/record-outcome]
        distinguishing_aspect: |
          ProtectiveOrderCase is a cyclic machine on a different entity: FILED -> PETITION_DRAFTED -> FILED is
          traversed twice, and the third DENIED outcome takes the other branch out of FILED because refile_count
          has reached 2 - the same trigger word (outcome DENIED) selects a different target state on the third lap.
