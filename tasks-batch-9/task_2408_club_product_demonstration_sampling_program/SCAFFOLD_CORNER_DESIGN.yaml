              captures: { cap: "$.data.daily_event_capacity", confirmed: "$.data.confirmed_count", remaining: "$.data.remaining_slots", food_confirmed: "$.data.food_confirmed_count", cats: "$.data.category_counts", wk: "$.data.week_start_date", pool: "$.data.weekly_sample_case_pool", pool_used: "$.data.pool_cases_used", pool_left: "$.data.pool_remaining", reserve_left: "$.data.reserve_remaining" }
          assert:
            - "the response status is 200"
            - "${cap} == 4"
