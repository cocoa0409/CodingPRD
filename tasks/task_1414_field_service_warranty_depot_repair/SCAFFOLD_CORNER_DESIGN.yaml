            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
          trigger:
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} , captures: { st: $.data.status, cov: $.data.coverage_path, prov: $.data.provisional_estimate_cents } }
            - { call: "GET /depot/rmas/${rma}", as: IntakeAgent, captures: { st2: $.data.status, cov2: $.data.coverage_path } }
          assert:
            - "authorize response: status == AUTHORIZED, coverage_path == IN_WARRANTY, provisional_estimate_cents == 15000"
            - "GET re-read agrees: status == AUTHORIZED, coverage_path == IN_WARRANTY, warranty_end_date_used == '2027-01-01'"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: inspect_available_loaner_rejected
        claim_type: invalid_transition
        grounds: [state_machines.LoanerUnit, "errors[ERR_INVALID_LOANER_STATE]"]
        distinguishing_aspect: "inspect is only valid from INSPECTION; calling it on an AVAILABLE loaner unit fails with ERR_INVALID_LOANER_STATE and completed_loan_cycles stays 0."
        test_recipe:
          setup: ["Loaner unit LU-1 registered (AVAILABLE)"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/loaner-units", as: DepotManager, payload: { asset_tag: "LU-1", model_id: "${mdl}", condition_grade: "A", deposit_value_cents: 40000 }, captures: { lu: $.data.id } }
          trigger:
            - { call: "POST /depot/loaner-units/${lu}/inspect", as: DepotTechnician, payload: { outcome: "PASS" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_LOANER_STATE"
            - "LoanerUnit.${lu}.status == AVAILABLE and completed_loan_cycles == 0"
