            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-05T15:00:01Z" }
              as: MSHAAdmin
            - call: "POST /msha/imminent-danger-orders"
              payload: { mine_id: "${m_id}", hazard_description: "second hazard one second later" }
              as: Inspector
              as_user_id: "${i1}"
              captures: { ido2: $.data.id }
          assert:
            - "ImminentDangerOrder.${ido1}.terminated_at == 2026-03-05T15:00:00Z"
            - "reissuing at exactly terminated_at answers 409 ERR_IDO_ACTIVE_EXISTS (closed interval: the shared instant is occupied)"
            - "reissuing at terminated_at + 1 second succeeds (201): ImminentDangerOrder.${ido2}.status == ISSUED"
            - "Mine.${m_id}.production_status == HALTED again after the second issuance"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: issue_vacate_pair_conserves_mine_penalty_exposure
        grounds:
          - calculations.penalty_dollar_pipeline
          - state_machines.Citation
          - state_machines.PenaltyAssessment
        distinguishing_aspect: |
          Conserved quantity = the mine's penalty exposure in cents, pinned as
          exposure(mine) = sum over citations with contest_status != VACATED of
          (final_penalty_cents if assessment FINAL else proposed_penalty_cents).
          Issuing citation 2 (forward action, +1687500c) paired with its contest
          + VACATED decision (compensating action) returns exposure to exactly
          the pre-issuance value 258750c — zero drift.
        test_recipe:
          setup:
            - "Operator 120000 tons (size tier 5). Citation 1: REASONABLY_LIKELY + repeat -> 20 points -> proposed 258750c."
            - "Citation 2 (same inspection): MODERATE + REASONABLY_LIKELY + MINOR + 2 persons + S&S -> 25+15+10+5+15+5(size)+0(history tier for 1 prior) = 75 points -> proposed 1687500c."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-10T08:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/operators"
              payload: { legal_name: "Big River Minerals", annual_tonnage_tons: 120000, home_district: "D-02" }
              as: MSHAAdmin
              captures: { op_id: $.data.id }
            - call: "POST /msha/mines"
              payload: { operator_id: "${op_id}", mine_name: "Big River No 2", mine_type: "SURFACE", activation_date: "2026-01-01" }
              as: MSHAAdmin
              captures: { m_id: $.data.id }
            - call: "POST /msha/inspectors"
              payload: { full_name: "R. Alvarez", badge_number: "INSP-100", district_code: "D-02", certification: "BOTH", conflicted_operator_ids: [] }
              as: MSHAAdmin
              captures: { i1: $.data.id }
            - call: "POST /msha/inspections"
              payload: { mine_id: "${m_id}", inspector_id: "${i1}", kind: "SPOT", planned_start_at: "2026-02-10T08:00:00Z", planned_end_at: "2026-02-10T17:00:00Z" }
              as: DistrictManager
              captures: { insp1: $.data.id }
            - call: "POST /msha/inspections/${insp1}/file-review"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /msha/inspections/${insp1}/start"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-10T09:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/citations"
              payload: { inspection_id: "${insp1}", mine_id: "${m_id}", standard_code: "30 CFR 56.9300", kind: "CITATION", negligence: "NONE", gravity_likelihood: "REASONABLY_LIKELY", gravity_severity: "NO_INJURY", persons_affected: 1, significant_and_substantial: false, repeat_violation: true }
              as: Inspector
              as_user_id: "${i1}"
              captures: { cit1: $.data.id }
            - call: "POST /msha/citations"
              payload: { inspection_id: "${insp1}", mine_id: "${m_id}", standard_code: "30 CFR 56.14100", kind: "CITATION", negligence: "MODERATE", gravity_likelihood: "REASONABLY_LIKELY", gravity_severity: "MINOR", persons_affected: 2, significant_and_substantial: true, repeat_violation: false }
              as: Inspector
              as_user_id: "${i1}"
              captures: { cit2: $.data.id, cv2: $.data.version }
            - call: "GET /msha/citations/${cit1}/penalty-assessments"
              payload: {}
              as: DistrictManager
              captures: { asm1: "$.data[0].id" }
            - call: "GET /msha/citations/${cit2}/penalty-assessments"
              payload: {}
              as: DistrictManager
              captures: { asm2: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-12T10:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/contests"
              payload: { citation_id: "${cit2}", expected_citation_version: "${cv2}", grounds: "severity overstated" }
              as: OperatorRep
              as_user_id: "${op_id}"
              captures: { con2: $.data.id }
            - call: "POST /msha/contests/${con2}/docket"
              payload: {}
              as: CommissionJudge
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-20T10:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/contests/${con2}/decide"
              payload: { outcome: "VACATED" }
              as: CommissionJudge
          assert:
            - "before the pair: exposure == 258750 (PenaltyAssessment.${asm1}.proposed_penalty_cents)"
            - "after citation 2 issued: exposure == 1946250 (258750 + 1687500)"
            - "after VACATED: PenaltyAssessment.${asm2}.final_penalty_cents == 0 and Citation.${cit2}.contest_status == VACATED"
            - "final exposure == 258750 exactly — the forward/compensating pair conserves the mine's penalty exposure"
            - "PenaltyAssessment.${asm1} is untouched: still PROPOSED with proposed_penalty_cents == 258750"

      - name: approve_supersede_conserves_single_approved_plan
        grounds:
          - state_machines.MinePlan.SUBMITTED_to_APPROVED
          - state_machines.MinePlan.APPROVED_to_SUPERSEDED
          - concurrency_rules[plan-approve-stale-mine]
        distinguishing_aspect: |
          Conserved quantity = a CARDINALITY, not a currency: |{MinePlans of
          (mine, VENTILATION) with status == APPROVED}| == 1 at every observable
          point. Approving revision 2 (forward) supersedes revision 1
          (compensating), so the set holds exactly one member across the whole
          sequence — and the supersede link records the chain.
        test_recipe:
          setup:
            - "UNDERGROUND mine; VENTILATION revision 1 approved at 2026-01-05; revision 2 submitted 2026-02-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/operators"
              payload: { legal_name: "Canyon Coal Co", annual_tonnage_tons: 1000, home_district: "D-11" }
              as: MSHAAdmin
              captures: { op_id: $.data.id }
            - call: "POST /msha/mines"
              payload: { operator_id: "${op_id}", mine_name: "Canyon No 22", mine_type: "UNDERGROUND", activation_date: "2026-01-01" }
              as: MSHAAdmin
              captures: { m_id: $.data.id }
            - call: "POST /msha/mines/${m_id}/mine-plans"
              payload: { plan_type: "VENTILATION", document_ref: "doc-vent-r1" }
              as: OperatorRep
              as_user_id: "${op_id}"
              captures: { plan_r1: $.data.id }
            - call: "GET /msha/mines/${m_id}"
              payload: {}
              as: DistrictManager
              captures: { mv1: $.data.version }
            - call: "POST /msha/mine-plans/${plan_r1}/approve"
              payload: { expected_mine_version: "${mv1}" }
              as: DistrictManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T09:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/mines/${m_id}/mine-plans"
              payload: { plan_type: "VENTILATION", document_ref: "doc-vent-r2" }
              as: OperatorRep
              as_user_id: "${op_id}"
              captures: { plan_r2: $.data.id }
            - call: "GET /msha/mines/${m_id}"
              payload: {}
              as: DistrictManager
              captures: { mv2: $.data.version }
          trigger:
            - call: "POST /msha/mine-plans/${plan_r2}/approve"
              payload: { expected_mine_version: "${mv2}" }
              as: DistrictManager
            - call: "GET /msha/mine-plans"
              payload: { mine_id: "${m_id}", plan_type: "VENTILATION", status: "APPROVED" }
              as: DistrictManager
          assert:
            - "before the trigger the APPROVED set was exactly {${plan_r1}}; after it the set is exactly {${plan_r2}} — cardinality 1 conserved"
            - "MinePlan.${plan_r1}.status == SUPERSEDED and MinePlan.${plan_r2}.status == APPROVED"
            - "MinePlan.${plan_r2}.supersedes_plan_id == ${plan_r1} and revision_no == 2"
            - "the filtered list GET returns exactly 1 row"
