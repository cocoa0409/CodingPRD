scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_member_success_and_defaults
        claim_type: creation
        grounds:
          - "entities.Member"
          - "endpoints[POST /coop/members]"
        distinguishing_aspect: "POST /coop/members with all required fields returns 201, system status defaults to APPLICANT, computed balances start at 0, and version starts at 1."
        test_recipe:
          setup: ["Cooperative exists"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
          trigger:
            - call: "POST /coop/members"
              payload: { legal_name: "New M", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_id: $.data.id, m_status: $.data.status, m_ver: $.data.version, m_bal: $.data.capital_credit_balance_cents }
          assert:
            - "Member.${m_id}.status == APPLICANT"
            - "Member.${m_id}.version == 1"
            - "Member.${m_id}.capital_credit_balance_cents == 0"
            - "Member.${m_id}.unclaimed_credit_cents == 0"

      - name: create_member_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Member"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required legal_name yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Cooperative exists"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
          trigger:
            - call: "POST /coop/members"
              payload: { member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: get_member_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Cooperative exists"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
          trigger:
            - call: "GET /coop/members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: MemberServicesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: member_list_pagination_envelope
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints[GET /coop/members]"
        distinguishing_aspect: "GET /coop/members returns pagination fields limit/offset/total_count/has_more and honors limit=2 with 3 members present."
        test_recipe:
          setup: ["Cooperative exists; 3 members created"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "A", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
            - call: "POST /coop/members"
              payload: { legal_name: "B", member_type: "RESIDENTIAL", district_id: 2 }
              as: MemberServicesRep
            - call: "POST /coop/members"
              payload: { legal_name: "C", member_type: "RESIDENTIAL", district_id: 3 }
              as: MemberServicesRep
          trigger:
            - call: "GET /coop/members?limit=2&offset=0"
              payload: {}
              as: MemberServicesRep
          assert:
            - "Response envelope includes meta.api_request_id and meta.api_request_timestamp"
            - "data array length == 2 and pagination reports total_count == 3, has_more == true"

      - name: meter_reading_immutable_event_no_version
        claim_type: immutability
        grounds:
          - "entities.MeterReading"
        distinguishing_aspect: "MeterReading has common_fields: false — it carries id and created_at only; no update endpoint exists and no version field is exposed."
        test_recipe:
          setup: ["Cooperative; ACTIVE member with location"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_id: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_id}", address: "1", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: MemberServicesRep
          trigger:
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_id}", reading_at: "2026-08-01T00:00:00Z", kwh_register: 100, demand_kw: 1.5, source: "AMR" }
              as: BillingClerk
              captures: { mr_id: $.data.id }
          assert:
            - "MeterReading.${mr_id} response exposes id and created_at but no version and no updated_at field"

      - name: invalid_enum_on_member_type_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "entities.Member.fields.member_type"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "member_type outside {RESIDENTIAL, COMMERCIAL, IRRIGATION} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Cooperative exists"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
          trigger:
            - call: "POST /coop/members"
              payload: { legal_name: "X", member_type: "WHOLESALE", district_id: 1 }
              as: MemberServicesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: terminate_from_applicant_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Member"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Member in APPLICANT cannot be terminated (only ACTIVE or SUSPENDED) — invalid-from rejection."
        test_recipe:
          setup: ["Cooperative; member in APPLICANT"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /coop/members/${m_id}/terminate"
              payload: {}
              as: MemberServicesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: terminated_member_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Member"
        distinguishing_aspect: "A TERMINATED member rejects every further lifecycle transition (suspend, reinstate, terminate again) with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Cooperative; member terminated from ACTIVE with no unpaid invoices"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_id: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_id}", address: "1", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/members/${m_id}/terminate"
              payload: {}
              as: MemberServicesRep
          trigger:
            - call: "POST /coop/members/${m_id}/reinstate"
              payload: {}
              as: MemberServicesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (TERMINATED is terminal)"

      - name: member_suspend_blocked_by_provisional_invoice
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Member.ACTIVE_to_SUSPENDED"
          - "errors[ERR_MEMBER_PROVISIONAL_INVOICE]"
        distinguishing_aspect: "Suspend is rejected while any of the member's locations has a PROVISIONAL invoice."
        test_recipe:
          setup: ["ACTIVE member with an ENERGIZED location and a PROVISIONAL invoice"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_id: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_id}", address: "1", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/rate-schedules"
              payload: { code: "RS-1", rate_class: "RESIDENTIAL", effective_from: "2025-01-01T00:00:00Z", customer_charge_cents: 2000, tiers: [{up_to_kwh: null, cents_per_kwh: 10}], demand_charge_cents_per_kw: 0, irrigation_offseason_discount_pct: 0, load_management_credit_cents: 0 }
              as: RateAnalyst
              captures: { rs_id: $.data.id }
            - call: "POST /coop/rate-schedules/${rs_id}/publish"
              payload: {}
              as: RateAnalyst
            - call: "POST /coop/invoices"
              payload: { service_location_id: "${loc_id}", billing_period_start: "2026-07-01T00:00:00Z", billing_period_end: "2026-08-01T00:00:00Z" }
              as: BillingClerk
          trigger:
            - call: "POST /coop/members/${m_id}/suspend"
              payload: {}
              as: MemberServicesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MEMBER_PROVISIONAL_INVOICE"

      - name: finalize_without_reading_returns_reading_missing
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Invoice.PROVISIONAL_to_FINALIZED"
          - "errors[ERR_READING_MISSING]"
        distinguishing_aspect: "Finalize is rejected when no MeterReading exists at or after billing_period_end."
        test_recipe:
          setup: ["ACTIVE member, ENERGIZED location, PUBLISHED schedule, PROVISIONAL invoice for July; no readings at/after 2026-08-01"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_id: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_id}", address: "1", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/rate-schedules"
              payload: { code: "RS-1", rate_class: "RESIDENTIAL", effective_from: "2025-01-01T00:00:00Z", customer_charge_cents: 2000, tiers: [{up_to_kwh: null, cents_per_kwh: 10}], demand_charge_cents_per_kw: 0, irrigation_offseason_discount_pct: 0, load_management_credit_cents: 0 }
              as: RateAnalyst
              captures: { rs_id: $.data.id }
            - call: "POST /coop/rate-schedules/${rs_id}/publish"
              payload: {}
              as: RateAnalyst
            - call: "POST /coop/invoices"
              payload: { service_location_id: "${loc_id}", billing_period_start: "2026-07-01T00:00:00Z", billing_period_end: "2026-08-01T00:00:00Z" }
              as: BillingClerk
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /coop/invoices/${inv_id}/finalize"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_READING_MISSING"

      - name: void_provisional_invoice_valid
        claim_type: valid_transition
        grounds:
          - "state_machines.Invoice.PROVISIONAL_to_VOID"
        distinguishing_aspect: "PROVISIONAL invoice can be voided; a voided invoice rejects finalize (terminal)."
        test_recipe:
          setup: ["PROVISIONAL invoice exists"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_id: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_id}", address: "1", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/rate-schedules"
              payload: { code: "RS-1", rate_class: "RESIDENTIAL", effective_from: "2025-01-01T00:00:00Z", customer_charge_cents: 2000, tiers: [{up_to_kwh: null, cents_per_kwh: 10}], demand_charge_cents_per_kw: 0, irrigation_offseason_discount_pct: 0, load_management_credit_cents: 0 }
              as: RateAnalyst
              captures: { rs_id: $.data.id }
            - call: "POST /coop/rate-schedules/${rs_id}/publish"
              payload: {}
              as: RateAnalyst
            - call: "POST /coop/invoices"
              payload: { service_location_id: "${loc_id}", billing_period_start: "2026-07-01T00:00:00Z", billing_period_end: "2026-08-01T00:00:00Z" }
              as: BillingClerk
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /coop/invoices/${inv_id}/void"
              payload: {}
              as: BillingClerk
              captures: { st: $.data.status }
            - call: "POST /coop/invoices/${inv_id}/finalize"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "First trigger: status == VOID"
            - "Second trigger: error_id == ERR_INVALID_STATE (VOID is terminal)"

      - name: outage_acknowledge_twice_idempotency_rejection
        claim_type: idempotency
        grounds:
          - "state_machines.OutageReport"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Acknowledging an already-ACKNOWLEDGED outage fails with ERR_INVALID_STATE (same trigger twice rejected)."
        test_recipe:
          setup: ["Outage REPORTED then ACKNOWLEDGED"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_id: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_id}", address: "1", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/outage-reports"
              payload: { service_location_id: "${loc_id}", cause: "EQUIPMENT" }
              as: Member
              as_user_id: "${m_id}"
              captures: { out_id: $.data.id }
            - call: "POST /coop/outage-reports/${out_id}/acknowledge"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /coop/outage-reports/${out_id}/acknowledge"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: mark_duplicate_with_terminal_parent_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.OutageReport.REPORTED_to_DUPLICATE"
          - "errors[ERR_PARENT_OUTAGE_TERMINAL]"
        distinguishing_aspect: "mark-duplicate against a parent already RESTORED fails with ERR_PARENT_OUTAGE_TERMINAL."
        test_recipe:
          setup: ["Parent outage RESTORED; second outage still REPORTED"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_id: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_id}", address: "1", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/outage-reports"
              payload: { service_location_id: "${loc_id}", cause: "WEATHER" }
              as: Member
              as_user_id: "${m_id}"
              captures: { out_p: $.data.id }
            - call: "POST /coop/outage-reports/${out_p}/acknowledge"
              payload: {}
              as: Dispatcher
            - call: "POST /coop/outage-reports/${out_p}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /coop/outage-reports/${out_p}/restore"
              payload: {}
              as: FieldOpsCoordinator
            - call: "POST /coop/outage-reports"
              payload: { service_location_id: "${loc_id}", cause: "WEATHER" }
              as: Member
              as_user_id: "${m_id}"
              captures: { out_d: $.data.id }
          trigger:
            - call: "POST /coop/outage-reports/${out_d}/mark-duplicate"
              payload: { parent_outage_id: "${out_p}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PARENT_OUTAGE_TERMINAL"

      - name: energize_without_constructed_order_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.ServiceLocation"
          - "errors[ERR_SERVICE_NOT_CONSTRUCTED]"
        distinguishing_aspect: "Energize fails with ERR_SERVICE_NOT_CONSTRUCTED when no ServiceOrder for the location is CONSTRUCTED."
        test_recipe:
          setup: ["Location PENDING_CONSTRUCTION with a service order only in ESTIMATED; ROW RECORDED"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_id: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_id}", address: "1", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/service-orders"
              payload: { service_location_id: "${loc_id}", order_type: "NEW_SERVICE", distance_ft: 100, requires_road_bore: false }
              as: MemberServicesRep
              captures: { so_id: $.data.id }
            - call: "POST /coop/service-orders/${so_id}/estimate"
              payload: {}
              as: FieldOpsCoordinator
            - call: "POST /coop/right-of-way-agreements"
              payload: { service_location_id: "${loc_id}", easement_width_ft: 30 }
              as: FieldOpsCoordinator
              captures: { row_id: $.data.id }
            - call: "POST /coop/right-of-way-agreements/${row_id}/consent"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /coop/right-of-way-agreements/${row_id}/record"
              payload: {}
              as: FieldOpsCoordinator
          trigger:
            - call: "POST /coop/service-locations/${loc_id}/energize"
              payload: {}
              as: FieldOpsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SERVICE_NOT_CONSTRUCTED"

      - name: schedule_requires_recorded_row
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.ServiceOrder.PAID_to_SCHEDULED"
          - "errors[ERR_ROW_NOT_RECORDED]"
        distinguishing_aspect: "ServiceOrder schedule fails with ERR_ROW_NOT_RECORDED when the ROW agreement is only MEMBER_CONSENTED (not yet RECORDED)."
        test_recipe:
          setup: ["ServiceOrder PAID; ROW MEMBER_CONSENTED but not recorded"]
          setup_api_calls:
