scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: trade_chart_variant_and_market_surplus_variant_carry_opposite_signs
        grounds:
          - calculations.pick_trade_value_balance
          - entities.PickTrade.fields.chart_balance_points
          - entities.PickTrade.fields.surplus_balance_points
          - entities.DraftPick.fields.slot_total_value_cents
        distinguishing_aspect: |
          On the PickTrade entity domain the authoritative positional chart variant scores
          the same one-for-one swap as -60.0 for the proposer while the advisory market
          surplus variant scores it as +8.5, so the two variants carry opposite signs on
          identical data and only the chart variant gates acceptance.
        test_recipe:
          setup:
            - "DraftCycle 2027 with rounds_count 2 in ORDER_FINAL, six registered clubs, draft order ELM, CED, BRN, HAR, DEL, FOX"
            - "12 PENDING DraftPicks exist; overall 1 (round 1 pick 1, chart 1000.0, slot_total_value_cents 511476212) is owned by ELM and overall 2 (round 1 pick 2, chart 940.0, slot_total_value_cents 502951609) is owned by CED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00.000Z" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles"
              payload: { season_year: 2027, declaration_deadline_at: "2027-01-15T23:59:59.000Z", combine_week_start_at: "2027-02-22T08:00:00.000Z", combine_week_end_at: "2027-02-28T20:00:00.000Z", draft_start_at: "2027-04-22T18:00:00.000Z", rounds_count: 2 }
              as: LeagueDraftAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "HAR", market_name: "Harbor City", prior_season_win_pct: 0.125, strength_of_schedule: 0.520, head_to_head_rank: 1, rookie_pool_total_cents: 500000000, lottery_combinations: 140 }
              as: LeagueDraftAdmin
              captures: { har_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "BRN", market_name: "Brenton", prior_season_win_pct: 0.250, strength_of_schedule: 0.480, head_to_head_rank: 2, rookie_pool_total_cents: 500000000, lottery_combinations: 125 }
              as: LeagueDraftAdmin
              captures: { brn_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "CED", market_name: "Cedar Falls", prior_season_win_pct: 0.250, strength_of_schedule: 0.510, head_to_head_rank: 3, rookie_pool_total_cents: 500000000, lottery_combinations: 105 }
              as: LeagueDraftAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "DEL", market_name: "Delta Bay", prior_season_win_pct: 0.375, strength_of_schedule: 0.500, head_to_head_rank: 4, rookie_pool_total_cents: 500000000, lottery_combinations: 90 }
              as: LeagueDraftAdmin
              captures: { del_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "ELM", market_name: "Elmwood", prior_season_win_pct: 0.500, strength_of_schedule: 0.470, head_to_head_rank: 5, rookie_pool_total_cents: 896721432, lottery_combinations: 75 }
              as: LeagueDraftAdmin
              captures: { elm_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "FOX", market_name: "Foxridge", prior_season_win_pct: 0.750, strength_of_schedule: 0.505, head_to_head_rank: 6, rookie_pool_total_cents: 500000000, playoff_qualified: true, playoff_exit_round: 2 }
              as: LeagueDraftAdmin
              captures: { fox_id: $.data.id }
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/phase"
              payload: { target_status: "DECLARATION_OPEN" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/prospects"
              payload: { draft_cycle_id: "${cycle_id}", full_name: "Avery Lane", position_group: "QB", school_code: "NRT", seasons_played: 4, scouting_grade: 92.50, position_group_scarcity_rank: 1 }
              as: LeagueDraftAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /draft-ops/prospects/${p1_id}/declaration"
              payload: { action: "DECLARE" }
              as: ProspectAgent
              as_user_id: "${p1_id}"
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/phase"
              payload: { target_status: "COMBINE_WEEK" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/phase"
              payload: { target_status: "ORDER_PENDING" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/lottery"
              payload: { drawn_combination_sequence: [500, 300, 500, 200, 50] }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/draft-order/finalize"
              payload: {}
              as: LeagueDraftAdmin
              captures: { created_picks: $.data.created_pick_count }
            - call: "GET /draft-ops/draft-picks?draft_cycle_id=${cycle_id}&round_number=1&limit=10"
              payload: {}
              as: LeagueDraftAdmin
              captures: { r1p1_id: "$.data[0].id", r1p2_id: "$.data[1].id" }
          trigger:
            - call: "POST /draft-ops/pick-trades"
              payload: { draft_cycle_id: "${cycle_id}", proposing_club_id: "${elm_id}", receiving_club_id: "${ced_id}", offered_pick_ids: ["${r1p1_id}"], requested_pick_ids: ["${r1p2_id}"] }
              as: ClubGM
              as_user_id: "${elm_id}"
              captures: { trade_id: $.data.id }
          assert:
            - "PickTrade.${trade_id}.chart_balance_points == -60.0"
            - "PickTrade.${trade_id}.imbalance_ratio == 0.0600"
            - "PickTrade.${trade_id}.surplus_balance_points == 8.5"
            - "PickTrade.${trade_id}.chart_balance_points < 0 AND PickTrade.${trade_id}.surplus_balance_points > 0"
            - "PickTrade.${trade_id}.status == PROPOSED"
            - "PickTrade.${trade_id}.conditional_status == NONE"

      - name: compensatory_banded_snap_score_and_raw_snap_advisory_diverge
        grounds:
          - calculations.compensatory_pick_award_score
          - entities.CompensatoryClaim.fields.claim_score
          - entities.CompensatoryClaim.fields.advisory_snap_adjusted_score
          - entities.CompensatoryClaim.fields.qualifies
        distinguishing_aspect: |
          On the CompensatoryClaim entity domain a departure with snap_pct 0.72 scores
          1470.00 under the authoritative banded snap factor (1.00) and 1064.00 under the
          advisory raw snap share, a 406.00 divergence on identical inputs, and only the
          banded variant sets awarded_round.
        test_recipe:
          setup:
            - "DraftCycle 2027 in SETUP with one registered club HAR"
            - "No compensatory claims exist yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00.000Z" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles"
              payload: { season_year: 2027, declaration_deadline_at: "2027-01-15T23:59:59.000Z", combine_week_start_at: "2027-02-22T08:00:00.000Z", combine_week_end_at: "2027-02-28T20:00:00.000Z", draft_start_at: "2027-04-22T18:00:00.000Z", rounds_count: 2 }
              as: LeagueDraftAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "HAR", market_name: "Harbor City", prior_season_win_pct: 0.125, strength_of_schedule: 0.520, head_to_head_rank: 1, rookie_pool_total_cents: 500000000, lottery_combinations: 140 }
              as: LeagueDraftAdmin
              captures: { har_id: $.data.id }
          trigger:
            - call: "POST /draft-ops/compensatory-claims"
              payload: { draft_cycle_id: "${cycle_id}", club_id: "${har_id}", claim_type: "DEPARTURE", player_name: "Rowan Petty", departed_apy_cents: 1450000000, snap_pct: 0.72, postseason_honor: "ALL_CONFERENCE" }
              as: ClubGM
              as_user_id: "${har_id}"
              captures: { claim_id: $.data.id }
          assert:
            - "CompensatoryClaim.${claim_id}.claim_score == 1470.00"
            - "CompensatoryClaim.${claim_id}.advisory_snap_adjusted_score == 1064.00"
            - "CompensatoryClaim.${claim_id}.claim_score - CompensatoryClaim.${claim_id}.advisory_snap_adjusted_score == 406.00"
            - "CompensatoryClaim.${claim_id}.qualifies == true"
            - "CompensatoryClaim.${claim_id}.status == SUBMITTED"
            - "CompensatoryClaim.${claim_id}.awarded_round == 0"

  - rule_id: combinatorial_formula
    instances:
      - name: lottery_order_nonlinear_seed_tiebreak_duplicate_skip_and_playoff_tail
        grounds:
          - calculations.draft_order_ranking
          - entities.Club.fields.pre_lottery_rank
          - entities.Club.fields.draft_order_index
          - entities.DraftCycle.fields.lottery_slot_club_ids
          - state_machines.DraftCycle.ORDER_PENDING_to_ORDER_PENDING
        distinguishing_aspect: |
          Mode (a): the final order is a non-linear composition of four inputs — a three-key
          tiebreak seed (win_pct, strength_of_schedule, head_to_head_rank), contiguous
          combination-range lookup, min(LOTTERY_SLOT_CAP, non_playoff_count) slot truncation
          with duplicate-draw skipping, and a separate playoff tail sort — so BRN outranks
          CED on strength_of_schedule alone while the drawn sequence reorders the head of
          the order away from the seed.
        test_recipe:
          setup:
            - "DraftCycle 2027 in ORDER_PENDING with six REGISTERED clubs"
            - "Non-playoff clubs HAR 0.125/0.520/140, BRN 0.250/0.480/125, CED 0.250/0.510/105, DEL 0.375/0.500/90, ELM 0.500/0.470/75; playoff club FOX 0.750/0.505 with playoff_exit_round 2 and 0 combinations"
            - "Combination ranges assigned in pre_lottery_rank order are HAR 1-140, BRN 141-265, CED 266-370, DEL 371-460, ELM 461-535"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00.000Z" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles"
              payload: { season_year: 2027, declaration_deadline_at: "2027-01-15T23:59:59.000Z", combine_week_start_at: "2027-02-22T08:00:00.000Z", combine_week_end_at: "2027-02-28T20:00:00.000Z", draft_start_at: "2027-04-22T18:00:00.000Z", rounds_count: 2 }
              as: LeagueDraftAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "HAR", market_name: "Harbor City", prior_season_win_pct: 0.125, strength_of_schedule: 0.520, head_to_head_rank: 1, rookie_pool_total_cents: 500000000, lottery_combinations: 140 }
              as: LeagueDraftAdmin
              captures: { har_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "BRN", market_name: "Brenton", prior_season_win_pct: 0.250, strength_of_schedule: 0.480, head_to_head_rank: 2, rookie_pool_total_cents: 500000000, lottery_combinations: 125 }
              as: LeagueDraftAdmin
              captures: { brn_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "CED", market_name: "Cedar Falls", prior_season_win_pct: 0.250, strength_of_schedule: 0.510, head_to_head_rank: 3, rookie_pool_total_cents: 500000000, lottery_combinations: 105 }
              as: LeagueDraftAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "DEL", market_name: "Delta Bay", prior_season_win_pct: 0.375, strength_of_schedule: 0.500, head_to_head_rank: 4, rookie_pool_total_cents: 500000000, lottery_combinations: 90 }
              as: LeagueDraftAdmin
              captures: { del_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "ELM", market_name: "Elmwood", prior_season_win_pct: 0.500, strength_of_schedule: 0.470, head_to_head_rank: 5, rookie_pool_total_cents: 896721432, lottery_combinations: 75 }
              as: LeagueDraftAdmin
              captures: { elm_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "FOX", market_name: "Foxridge", prior_season_win_pct: 0.750, strength_of_schedule: 0.505, head_to_head_rank: 6, rookie_pool_total_cents: 500000000, playoff_qualified: true, playoff_exit_round: 2 }
              as: LeagueDraftAdmin
              captures: { fox_id: $.data.id }
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/phase"
              payload: { target_status: "DECLARATION_OPEN" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/prospects"
              payload: { draft_cycle_id: "${cycle_id}", full_name: "Avery Lane", position_group: "QB", school_code: "NRT", seasons_played: 4, scouting_grade: 92.50, position_group_scarcity_rank: 1 }
              as: LeagueDraftAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /draft-ops/prospects/${p1_id}/declaration"
              payload: { action: "DECLARE" }
              as: ProspectAgent
              as_user_id: "${p1_id}"
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/phase"
              payload: { target_status: "COMBINE_WEEK" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/phase"
              payload: { target_status: "ORDER_PENDING" }
              as: LeagueDraftAdmin
          trigger:
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/lottery"
              payload: { drawn_combination_sequence: [500, 300, 500, 200, 50] }
              as: LeagueDraftAdmin
              captures: { lottery_done: $.data.lottery_completed }
          assert:
            - "Club.${har_id}.pre_lottery_rank == 1"
            - "Club.${brn_id}.pre_lottery_rank == 2"
            - "Club.${ced_id}.pre_lottery_rank == 3"
            - "Club.${del_id}.pre_lottery_rank == 4"
            - "Club.${elm_id}.pre_lottery_rank == 5"
            - "Club.${fox_id}.pre_lottery_rank == 0"
            - "DraftCycle.${cycle_id}.lottery_slot_club_ids == [${elm_id}, ${ced_id}, ${brn_id}, ${har_id}]"
            - "Club.${elm_id}.draft_order_index == 1"
            - "Club.${ced_id}.draft_order_index == 2"
            - "Club.${brn_id}.draft_order_index == 3"
            - "Club.${har_id}.draft_order_index == 4"
            - "Club.${del_id}.draft_order_index == 5"
            - "Club.${fox_id}.draft_order_index == 6"
            - "DraftCycle.${cycle_id}.lottery_completed == true"

      - name: rookie_contract_bonus_prorated_per_year_before_summation
        grounds:
          - calculations.slotted_rookie_contract_value
          - entities.PlayerContract.fields.total_cap_commitment_cents
          - entities.PlayerContract.fields.first_year_cap_charge_cents
          - entities.DraftPick.fields.slot_signing_bonus_cents
        distinguishing_aspect: |
          Mode (b): for overall pick 1 the pinned order (prorate the 306885727 bonus per
          year with round_half_up, then sum the four shares) yields
          total_cap_commitment_cents 818361940, one cent MORE than the sum-then-add order's
          818361939, so the assertion fails if the implementation adds the bonus once.
        test_recipe:
          setup:
            - "DraftCycle 2027 with rounds_count 2 in DRAFT_LIVE, two registered clubs ELM (draft_order_index 1, rookie_pool_total_cents 896721432) and HAR (draft_order_index 2)"
            - "Prospect Avery Lane is DECLARED and ELIGIBLE; DraftPick overall 1 (round 1 pick 1) is USED by ELM having selected Avery Lane"
            - "Logical clock at 2027-04-22T18:00:00.000Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00.000Z" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles"
              payload: { season_year: 2027, declaration_deadline_at: "2027-01-15T23:59:59.000Z", combine_week_start_at: "2027-02-22T08:00:00.000Z", combine_week_end_at: "2027-02-28T20:00:00.000Z", draft_start_at: "2027-04-22T18:00:00.000Z", rounds_count: 2 }
              as: LeagueDraftAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "ELM", market_name: "Elmwood", prior_season_win_pct: 0.500, strength_of_schedule: 0.470, head_to_head_rank: 5, rookie_pool_total_cents: 896721432, lottery_combinations: 75 }
              as: LeagueDraftAdmin
              captures: { elm_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "HAR", market_name: "Harbor City", prior_season_win_pct: 0.125, strength_of_schedule: 0.520, head_to_head_rank: 1, rookie_pool_total_cents: 500000000, lottery_combinations: 140 }
              as: LeagueDraftAdmin
              captures: { har_id: $.data.id }
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/phase"
              payload: { target_status: "DECLARATION_OPEN" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/prospects"
              payload: { draft_cycle_id: "${cycle_id}", full_name: "Avery Lane", position_group: "QB", school_code: "NRT", seasons_played: 4, scouting_grade: 92.50, position_group_scarcity_rank: 1 }
              as: LeagueDraftAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /draft-ops/prospects/${p1_id}/declaration"
              payload: { action: "DECLARE" }
              as: ProspectAgent
              as_user_id: "${p1_id}"
            - call: "POST /draft-ops/prospects/${p1_id}/eligibility-determination"
              payload: { action: "DECLARE_ELIGIBLE" }
              as: EligibilityCommittee
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/phase"
              payload: { target_status: "COMBINE_WEEK" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/phase"
              payload: { target_status: "ORDER_PENDING" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/lottery"
              payload: { drawn_combination_sequence: [200, 50] }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/draft-order/finalize"
              payload: {}
              as: LeagueDraftAdmin
              captures: { r1p1_id: $.data.first_overall_pick_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-22T18:00:00.000Z" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/phase"
              payload: { target_status: "DRAFT_LIVE" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/clock/advance"
              payload: {}
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-picks/${r1p1_id}/selections"
              payload: { prospect_id: "${p1_id}" }
              as: ClubGM
              as_user_id: "${elm_id}"
            - call: "GET /draft-ops/prospects/${p1_id}"
              payload: {}
              as: LeagueDraftAdmin
              captures: { p1_v: $.data.version }
          trigger:
            - call: "POST /draft-ops/player-contracts"
              payload: { prospect_id: "${p1_id}", club_id: "${elm_id}", origin: "DRAFTED", draft_pick_id: "${r1p1_id}", expected_prospect_version: "${p1_v}" }
              as: ClubGM
              as_user_id: "${elm_id}"
              captures: { contract_id: $.data.id }
          assert:
            - "PlayerContract.${contract_id}.contract_years == 4"
            - "PlayerContract.${contract_id}.total_value_cents == 511476212"
            - "PlayerContract.${contract_id}.signing_bonus_cents == 306885727"
            - "PlayerContract.${contract_id}.first_year_cap_charge_cents == 196721432"
            - "PlayerContract.${contract_id}.total_cap_commitment_cents == 818361940"
            - "PlayerContract.${contract_id}.total_cap_commitment_cents != 818361939"
            - "PlayerContract.${contract_id}.status == OFFERED"
            - "Prospect.${p1_id}.signing_status == OFFER_OUT"

      - name: udfa_pool_credit_rate_tier_keyed_on_base_pool_not_post_credit_total
        grounds:
          - calculations.udfa_pool_allocation
          - entities.Club.fields.udfa_pool_total_cents
          - entities.Club.fields.rookie_pool_remaining_cents
          - state_machines.DraftCycle.DRAFT_COMPLETE_to_UDFA_WINDOW
        distinguishing_aspect: |
          Mode (c): base_pool 110000000 selects UDFA_CREDIT_RATE_MID 0.40 giving
          udfa_pool_total_cents 167049207, whereas keying the tier on the post-credit total
          252623018 would select UDFA_CREDIT_RATE_LOW 0.25 and give 145655755 — the pinned
          evaluation order is the only thing that makes the value well-defined.
        test_recipe:
          setup:
            - "DraftCycle 2027 rounds_count 2 with clubs ELM (draft_order_index 1, rookie_pool_total_cents 896721432) and HAR (draft_order_index 2)"
            - "ELM has selected Avery Lane with overall pick 1 and that contract is SIGNED, so ELM.rookie_pool_remaining_cents == 700000000"
            - "The cycle has reached DRAFT_COMPLETE and ELM's remaining pick, overall 3 (round 2 pick 1, slot_first_year_cap_charge_cents 142623018), is LAPSED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00.000Z" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles"
              payload: { season_year: 2027, declaration_deadline_at: "2027-01-15T23:59:59.000Z", combine_week_start_at: "2027-02-22T08:00:00.000Z", combine_week_end_at: "2027-02-28T20:00:00.000Z", draft_start_at: "2027-04-22T18:00:00.000Z", rounds_count: 2 }
              as: LeagueDraftAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "ELM", market_name: "Elmwood", prior_season_win_pct: 0.500, strength_of_schedule: 0.470, head_to_head_rank: 5, rookie_pool_total_cents: 896721432, lottery_combinations: 75 }
              as: LeagueDraftAdmin
              captures: { elm_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "HAR", market_name: "Harbor City", prior_season_win_pct: 0.125, strength_of_schedule: 0.520, head_to_head_rank: 1, rookie_pool_total_cents: 500000000, lottery_combinations: 140 }
              as: LeagueDraftAdmin
              captures: { har_id: $.data.id }
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/phase"
              payload: { target_status: "DECLARATION_OPEN" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/prospects"
