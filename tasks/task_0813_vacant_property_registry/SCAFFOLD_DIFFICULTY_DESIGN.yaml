      - name: demolition_min_violations_count_boundary
        grounds:
          - validations[priority=16]
          - errors[ERR_INSUFFICIENT_VIOLATIONS]
          - entities.Property.fields.open_violation_count
        distinguishing_aspect: |
          Metric = open_violation_count on POST /registry/demolition-listings: with exactly 2 open
          violations (one short of the required 3) the listing is rejected ERR_INSUFFICIENT_VIOLATIONS
