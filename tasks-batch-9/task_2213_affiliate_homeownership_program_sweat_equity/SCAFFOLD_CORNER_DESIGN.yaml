            - { call: "POST /homeownership/education-enrollments/${enr_id}/module-completions", payload: { outcome: "PASSED", module_code: "HBC-01" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
          trigger:
            - { call: "POST /homeownership/education-enrollments", payload: { household_id: "${hh_id}", curriculum_code: "HOMEBUYER_CORE", required_module_count: 2 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { e_dup: $.data.error_id } }
            - { call: "POST /homeownership/education-enrollments", payload: { household_id: "${hh_id}", curriculum_code: "BUDGET_COACHING", required_module_count: 1 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
