  - rule_id: resource_temporal_overlap
    instances:
      - name: assessor_booking_uses_half_open_intervals_so_touching_slots_are_allowed
        resource_entity: Assessor
        interval_semantics: "half-open [starts_at, ends_at) instant intervals; intersection is a conflict, touching is not"
        grounds:
          - validations.priority_12_ERR_ASSESSOR_SCHEDULE_CONFLICT
          - calculations.witness_session_day_count
          - entities.WitnessSession.fields.starts_at
          - entities.WitnessSession.fields.ends_at
        distinguishing_aspect: |
          The contended resource is a person and the interval semantics are half-open instant
          intervals: a slot beginning exactly at another slot's ends_at only touches it and must be
          accepted, while a slot beginning one minute earlier intersects and must be rejected with
          409 ERR_ASSESSOR_SCHEDULE_CONFLICT. An implementation using closed intervals rejects the
          back-to-back slot; one using date granularity accepts the overlapping slot.
