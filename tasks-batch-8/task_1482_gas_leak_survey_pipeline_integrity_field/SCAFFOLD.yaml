scenario: |
  Gas Leak Survey & Pipeline Integrity Field Program (gas LDC integrity program): survey route & instrument calibration, leak grading (1/2/3) & repair clock by grade, re-survey interval & regrade, cathodic protection reading & anomaly, patrol/aerial survey record, repair crew dispatch & permit for excavation, compliance report to regulator, integrity-management risk model input

domain_name: gas-leak-survey-pipeline-integrity
api_prefix: /integrity-program

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - scheduled_actions

  entity_topology: hybrid
  # Central pipe-segment registry with satellite survey/repair/inspection entities; flat cross-cutting
  # references between Instrument, Crew, RegulatorReport, RiskModelSnapshot.

  state_machine_shape: compound
  # Leak has a cyclic grade-revision loop; RepairOrder has parallel dimensions
  # (dispatch_status x excavation_permit_status); ComplianceReport has fork-join branching
  # on inclusion of cathodic vs leak sections; PipeSegment posture derived from children.

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential

  role_model: segregation_of_duties
  # Same individual may not perform leak grade (FieldTechnician) AND approve repair
  # completion (ComplianceOfficer) on the same RepairOrder; same for instrument
  # calibration vs survey attestation.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PipeSegment
    parent: null
    common_fields: true
    fields:
      - { name: segment_code, type: string, source: input, description: "Unique operator-assigned segment identifier (e.g., 'ML-2024-NORTH-001')", constraints: "unique across all PipeSegment" }
      - { name: install_year, type: integer, source: input, description: "Year pipe was installed" }
      - { name: material, type: enum, source: input, description: "STEEL | CAST_IRON | PLASTIC_PE | PLASTIC_PVC | COPPER", constraints: "one of enum" }
      - { name: diameter_inches, type: number, source: input, description: "Nominal outside diameter in inches" }
      - { name: length_feet, type: number, source: input, description: "Segment linear length in feet" }
      - { name: operating_pressure_psi, type: number, source: input, description: "Maximum allowable operating pressure" }
      - { name: pressure_class, type: enum, source: input, description: "DISTRIBUTION | TRANSMISSION | SERVICE", constraints: "one of enum" }
      - { name: is_high_consequence_area, type: boolean, source: input, description: "Whether the segment lies in an HCA (49 CFR §192.903)" }
      - { name: risk_score, type: number, source: computed, description: "Latest integrity risk score from risk_score calculation" }
      - { name: open_grade1_count, type: integer, source: computed, default: 0, description: "Count of Leaks currently at grade G1 on this segment" }
      - { name: open_grade2_count, type: integer, source: computed, default: 0, description: "Count of Leaks currently at grade G2 on this segment" }
      - { name: open_grade3_count, type: integer, source: computed, default: 0, description: "Count of Leaks currently at grade G3 on this segment" }
      - { name: posture, type: enum, source: computed, description: "NORMAL | ELEVATED | CRITICAL — derived from open leak counts and CP anomalies" }
      - { name: last_surveyed_at, type: datetime, source: computed, description: "Timestamp of the most recent COMPLETED SurveyRun touching this segment; null if never surveyed" }
      - { name: next_survey_due_at, type: datetime, source: computed, description: "Earliest due timestamp computed from re-survey interval rule" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OUT_OF_SERVICE | ABANDONED" }

  - name: Instrument
    parent: null
    common_fields: true
    fields:
      - { name: serial_number, type: string, source: input, description: "Unique instrument serial (e.g., 'FI-2241-A')", constraints: "unique across all Instrument" }
      - { name: instrument_type, type: enum, source: input, description: "FLAME_IONIZATION | CGI | OMD | AERIAL_LIDAR | CP_VOLTMETER", constraints: "one of enum" }
      - { name: calibrated_at, type: datetime, source: system, description: "Timestamp of last successful Calibration" }
      - { name: calibration_due_at, type: datetime, source: computed, description: "calibrated_at + calibration interval per instrument_type (in days)" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | OUT_OF_CALIBRATION | RETIRED" }

  - name: Calibration
    parent: Instrument
    common_fields: true
    fields:
      - { name: instrument_id, type: string, source: input, description: "FK -> Instrument.id; instrument under calibration" }
      - { name: performed_by_user_id, type: string, source: input, description: "X-User-ID of CalibrationTech performing calibration" }
      - { name: reference_gas_ppm, type: number, source: input, description: "Reference gas concentration in ppm" }
      - { name: observed_ppm, type: number, source: input, description: "Instrument reading of the reference gas in ppm" }
      - { name: drift_pct, type: number, source: computed, description: "abs(observed_ppm - reference_gas_ppm) / reference_gas_ppm * 100" }
      - { name: outcome, type: enum, source: computed, description: "PASS if drift_pct <= MAX_DRIFT_PCT else FAIL" }

  - name: SurveyRoute
    parent: null
    common_fields: true
    fields:
      - { name: route_code, type: string, source: input, description: "Unique route identifier (e.g., 'R-NORTH-2024-Q3')", constraints: "unique across all SurveyRoute" }
      - { name: survey_method, type: enum, source: input, description: "WALKING | MOBILE | AERIAL | PATROL", constraints: "one of enum" }
      - { name: scheduled_window_start, type: datetime, source: input, description: "Start of authorized survey window" }
      - { name: scheduled_window_end, type: datetime, source: input, description: "End of authorized survey window (exclusive)" }
      - { name: status, type: enum, source: system, description: "PLANNED | DISPATCHED | IN_PROGRESS | COMPLETED | ABORTED" }

  - name: RouteSegmentAssignment
    parent: SurveyRoute
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> SurveyRoute.id; the route" }
      - { name: segment_id, type: string, source: input, description: "FK -> PipeSegment.id; the segment to survey" }
      - { name: sequence_index, type: integer, source: input, description: "Order in which the segment is walked on this route (1-based)" }
      - { name: status, type: enum, source: system, description: "PENDING | COVERED | SKIPPED" }

  - name: SurveyRun
    parent: SurveyRoute
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> SurveyRoute.id; the route executed" }
      - { name: instrument_id, type: string, source: input, description: "FK -> Instrument.id; must be IN_SERVICE at run start" }
      - { name: technician_id, type: string, source: system, description: "X-User-ID of FieldTechnician" }
      - { name: started_at, type: datetime, source: system, description: "Server logical clock at run start" }
      - { name: ended_at, type: datetime, source: system, description: "Server logical clock at run end" }
      - { name: distance_covered_feet, type: number, source: input, description: "Feet of pipe actually surveyed" }
      - { name: coverage_pct, type: number, source: computed, description: "Sum of length_feet over COVERED RouteSegmentAssignments / total assigned length * 100" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED" }

  - name: Leak
    parent: PipeSegment
    common_fields: true
    fields:
      - { name: segment_id, type: string, source: input, description: "FK -> PipeSegment.id; segment where leak was detected" }
      - { name: survey_run_id, type: string, source: input, description: "FK -> SurveyRun.id; the run that detected the leak" }
      - { name: discovered_at, type: datetime, source: system, description: "Logical clock at leak creation" }
      - { name: concentration_ppm, type: number, source: input, description: "Measured gas concentration in ppm" }
      - { name: distance_to_building_feet, type: number, source: input, description: "Feet to nearest building wall; null if open field" }
      - { name: bar_hole_reading_pct_lel, type: number, source: input, description: "Bar-hole reading as percent of LEL (0-100)" }
      - { name: is_migration_evidence, type: boolean, source: input, description: "Whether gas migration observed" }
      - { name: grade, type: enum, source: computed, description: "G1 | G2 | G3 — assigned per leak_grade calculation" }
      - { name: repair_due_at, type: datetime, source: computed, description: "discovered_at + repair_clock_days(grade); recalculated on regrade" }
      - { name: regrade_count, type: integer, source: computed, default: 0, description: "Number of times this Leak has been re-graded" }
      - { name: status, type: enum, source: system, description: "OPEN | REPAIR_SCHEDULED | UNDER_REPAIR | REPAIRED_PENDING_VERIFICATION | VERIFIED_CLEARED | ABANDONED_SEGMENT" }

  - name: RepairOrder
    parent: Leak
    common_fields: true
    fields:
      - { name: leak_id, type: string, source: input, description: "FK -> Leak.id; the leak being repaired" }
      - { name: priority, type: enum, source: computed, description: "P1_EMERGENCY | P2_URGENT | P3_ROUTINE — mapped from Leak.grade at creation" }
      - { name: crew_id, type: string, source: system, description: "FK -> RepairCrew.id; null until dispatched" }
      - { name: dispatched_at, type: datetime, source: system, description: "Logical clock at dispatch" }
      - { name: repair_method, type: enum, source: input, description: "CLAMP | WRAP | CUT_AND_REPLACE | ABANDON_SEGMENT | INSERT_LINER" }
      - { name: dispatch_status, type: enum, source: system, description: "PENDING_DISPATCH | DISPATCHED | ON_SITE | WORK_COMPLETE | CANCELLED" }
      - { name: excavation_permit_status, type: enum, source: system, description: "NOT_REQUIRED | PERMIT_REQUIRED | PERMIT_APPLIED | PERMIT_GRANTED | PERMIT_DENIED | PERMIT_EXPIRED" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock at WORK_COMPLETE entry" }
      - { name: verified_by_officer_id, type: string, source: system, description: "X-User-ID of ComplianceOfficer approving; set on VERIFIED_CLEARED" }

  - name: ExcavationPermit
    parent: RepairOrder
    common_fields: true
    fields:
      - { name: repair_order_id, type: string, source: input, description: "FK -> RepairOrder.id; repair needing excavation" }
      - { name: permit_number, type: string, source: input, description: "Municipality-issued permit number", constraints: "unique across all ExcavationPermit" }
      - { name: jurisdiction, type: string, source: input, description: "Issuing authority" }
      - { name: applied_at, type: datetime, source: system, description: "Logical clock at application" }
      - { name: granted_at, type: datetime, source: system, description: "Logical clock at grant" }
      - { name: expires_at, type: datetime, source: input, description: "Permit expiry timestamp" }
      - { name: status, type: enum, source: system, description: "APPLIED | GRANTED | DENIED | EXPIRED" }

  - name: RepairCrew
    parent: null
    common_fields: true
    fields:
      - { name: crew_code, type: string, source: input, description: "Unique crew identifier", constraints: "unique across all RepairCrew" }
      - { name: home_region, type: string, source: input, description: "Region crew is based in" }
      - { name: is_qualified_excavation, type: boolean, source: input, description: "Crew qualified for excavation work" }
      - { name: max_concurrent_orders, type: integer, source: input, description: "Crew capacity for open repair orders" }
      - { name: open_order_count, type: integer, source: computed, default: 0, description: "Current open RepairOrders assigned (dispatch_status in {DISPATCHED, ON_SITE})" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | AT_CAPACITY | OFF_DUTY" }

  - name: CathodicProtectionReading
    parent: PipeSegment
    common_fields: true
    fields:
      - { name: segment_id, type: string, source: input, description: "FK -> PipeSegment.id; segment tested" }
      - { name: test_point_id, type: string, source: input, description: "Operator-assigned test point identifier" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical clock at reading" }
      - { name: pipe_to_soil_potential_mv, type: number, source: input, description: "Pipe-to-soil potential in millivolts (negative value)" }
      - { name: instant_off_potential_mv, type: number, source: input, description: "Instant-off potential in millivolts" }
      - { name: is_anomalous, type: boolean, source: computed, description: "True when instant_off_potential_mv > CP_ANOMALY_THRESHOLD_MV (-850 mV)" }
      - { name: anomaly_status, type: enum, source: system, description: "NONE | OPEN | ACKNOWLEDGED | RESOLVED" }

  - name: ComplianceReport
    parent: null
    common_fields: true
    fields:
      - { name: reporting_period_start, type: datetime, source: input, description: "Period start (inclusive)" }
      - { name: reporting_period_end, type: datetime, source: input, description: "Period end (exclusive)" }
      - { name: regulator, type: enum, source: input, description: "PHMSA | STATE_PUC | LOCAL_FIRE_MARSHAL" }
      - { name: report_payload_uri, type: string, source: system, description: "Where the generated report artifact is stored" }
      - { name: leak_section_snapshot_id, type: string, source: system, description: "FK -> RiskModelSnapshot.id pinned at submission for leak section" }
      - { name: cp_section_snapshot_id, type: string, source: system, description: "FK -> RiskModelSnapshot.id pinned at submission for CP section" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at submission" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_REVIEW | SUBMITTED | ACCEPTED | REJECTED_BY_REGULATOR | RESUBMISSION_REQUIRED" }

  - name: RiskModelSnapshot
    parent: null
    common_fields: true
    fields:
      - { name: snapshot_label, type: string, source: input, description: "Human label (e.g., 'Q3-2026-leak-section')" }
      - { name: snapshot_kind, type: enum, source: input, description: "LEAK_SECTION | CP_SECTION | FULL", constraints: "one of enum" }
      - { name: input_set_hash, type: string, source: computed, description: "Deterministic hash over inputs (segment ids, leak ids, CP reading ids)" }
      - { name: total_segments_scored, type: integer, source: computed, description: "Count of PipeSegments scored in this snapshot" }
      - { name: high_risk_segment_ids, type: array, source: computed, description: "Array of PipeSegment.id whose risk_score >= HIGH_RISK_THRESHOLD" }
      - { name: generated_at, type: datetime, source: system, description: "Logical clock at snapshot generation" }
      - { name: status, type: enum, source: system, description: "STALE | CURRENT | PINNED" }

  - name: RegradeEvent
    parent: Leak
    common_fields: true
    fields:
      - { name: leak_id, type: string, source: input, description: "FK -> Leak.id; the leak being re-graded" }
      - { name: previous_grade, type: enum, source: system, description: "Grade before re-grade" }
      - { name: new_grade, type: enum, source: system, description: "Grade after re-grade" }
      - { name: reason, type: string, source: input, description: "Free-text reason for regrade" }
      - { name: performed_by_user_id, type: string, source: system, description: "X-User-ID of FieldTechnician" }
      - { name: triggered_at, type: datetime, source: system, description: "Logical clock at regrade" }

  - name: FieldTechnician
    parent: null
    common_fields: true
    fields:
      - { name: employee_code, type: string, source: input, description: "Unique employee code", constraints: "unique across all FieldTechnician" }
      - { name: full_name, type: string, source: input, description: "Full legal name" }
      - { name: qualified_methods, type: array, source: input, description: "List of survey methods the tech is qualified for" }
      - { name: home_region, type: string, source: input, description: "Home region for routing" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED" }

  - name: ComplianceOfficer
    parent: null
    common_fields: true
    fields:
      - { name: employee_code, type: string, source: input, description: "Unique employee code", constraints: "unique across all ComplianceOfficer" }
      - { name: full_name, type: string, source: input, description: "Full legal name" }
      - { name: jurisdiction_scope, type: array, source: input, description: "List of regulator enums this officer is authorized to file with" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED" }

  - name: CalibrationTech
    parent: null
    common_fields: true
    fields:
      - { name: employee_code, type: string, source: input, description: "Unique employee code", constraints: "unique across all CalibrationTech" }
      - { name: full_name, type: string, source: input, description: "Full legal name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED" }

  - name: DispatchCoordinator
    parent: null
    common_fields: true
    fields:
      - { name: employee_code, type: string, source: input, description: "Unique employee code", constraints: "unique across all DispatchCoordinator" }
      - { name: full_name, type: string, source: input, description: "Full legal name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED" }

  - name: IntegrityAnalyst
    parent: null
    common_fields: true
    fields:
      - { name: employee_code, type: string, source: input, description: "Unique employee code", constraints: "unique across all IntegrityAnalyst" }
      - { name: full_name, type: string, source: input, description: "Full legal name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PipeSegment
    initial_state: ACTIVE
    terminal_states: [ABANDONED]
    transitions:
      - from: ACTIVE
        to: OUT_OF_SERVICE
        trigger: "POST /pipe-segments/{id}/out-of-service"
        actor: IntegrityAnalyst
        preconditions:
          - "PipeSegment.status == ACTIVE (ERR_SEGMENT_NOT_ACTIVE)"
          - "No RepairOrder on this segment has dispatch_status in {DISPATCHED, ON_SITE} (ERR_OPEN_REPAIR_ORDERS_EXIST)"
        side_effects:
          - "Cascade: every Leak on this segment in status OPEN | REPAIR_SCHEDULED moves to ABANDONED_SEGMENT"
          - "Cascade: every RepairOrder on those leaks with dispatch_status == PENDING_DISPATCH moves to CANCELLED"
          - "Recompute PipeSegment.open_grade1_count, open_grade2_count, open_grade3_count (all become 0)"
          - "Recompute PipeSegment.posture (becomes NORMAL)"
          - "Increments PipeSegment.version by 1"

      - from: OUT_OF_SERVICE
        to: ABANDONED
        trigger: "POST /pipe-segments/{id}/abandon"
        actor: IntegrityAnalyst
        preconditions:
          - "PipeSegment.status == OUT_OF_SERVICE (ERR_SEGMENT_NOT_OUT_OF_SERVICE)"
        side_effects:
          - "Increments PipeSegment.version by 1"

      - from: OUT_OF_SERVICE
        to: ACTIVE
        trigger: "POST /pipe-segments/{id}/return-to-service"
        actor: IntegrityAnalyst
        preconditions:
          - "PipeSegment.status == OUT_OF_SERVICE (ERR_SEGMENT_NOT_OUT_OF_SERVICE)"
          - "CathodicProtectionReading on this segment in last 90 days exists with is_anomalous == false (ERR_NO_RECENT_CLEAN_CP_READING)"
        side_effects:
          - "Increments PipeSegment.version by 1"

  - entity: SurveyRoute
    initial_state: PLANNED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /survey-routes/{id}/dispatch"
        actor: DispatchCoordinator
        preconditions:
          - "SurveyRoute.status == PLANNED (ERR_ROUTE_NOT_PLANNED)"
          - "Every RouteSegmentAssignment on this route references a PipeSegment with status == ACTIVE (ERR_ROUTE_INCLUDES_INACTIVE_SEGMENT)"
          - "Current logical clock is before scheduled_window_end (ERR_ROUTE_WINDOW_PASSED)"
        side_effects:
          - "Increments SurveyRoute.version by 1"

      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /survey-routes/{id}/start"
        actor: FieldTechnician
        preconditions:
          - "SurveyRoute.status == DISPATCHED (ERR_ROUTE_NOT_DISPATCHED)"
          - "FieldTechnician.qualified_methods contains SurveyRoute.survey_method (ERR_TECHNICIAN_NOT_QUALIFIED)"
          - "Current logical clock is within [scheduled_window_start, scheduled_window_end) (ERR_OUTSIDE_SCHEDULED_WINDOW)"
        side_effects:
          - "Increments SurveyRoute.version by 1"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /survey-routes/{id}/complete"
        actor: FieldTechnician
        preconditions:
          - "SurveyRoute.status == IN_PROGRESS (ERR_ROUTE_NOT_IN_PROGRESS)"
          - "At least one SurveyRun with status == ACCEPTED exists for this route (ERR_NO_ACCEPTED_RUN)"
        side_effects:
          - "For every RouteSegmentAssignment of this route where status == COVERED: set PipeSegment.last_surveyed_at = completed_at; recompute PipeSegment.next_survey_due_at per resurvey_interval calculation"
          - "Recompute risk_score for every COVERED segment per risk_score calculation"
          - "Increments SurveyRoute.version by 1"

      - from: PLANNED
        to: ABORTED
        trigger: "POST /survey-routes/{id}/abort"
        actor: DispatchCoordinator
        preconditions:
          - "SurveyRoute.status in {PLANNED, DISPATCHED} (ERR_ROUTE_NOT_ABORTABLE)"
        side_effects:
          - "Increments SurveyRoute.version by 1"

      - from: DISPATCHED
        to: ABORTED
        trigger: "POST /survey-routes/{id}/abort"
        actor: DispatchCoordinator
        preconditions:
          - "SurveyRoute.status in {PLANNED, DISPATCHED} (ERR_ROUTE_NOT_ABORTABLE)"
        side_effects:
          - "Increments SurveyRoute.version by 1"

  - entity: SurveyRun
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /survey-runs/{id}/submit"
        actor: FieldTechnician
        preconditions:
          - "SurveyRun.status == DRAFT (ERR_RUN_NOT_DRAFT)"
          - "SurveyRun.instrument_id refers to an Instrument with status == IN_SERVICE (ERR_INSTRUMENT_OUT_OF_CALIBRATION)"
          - "SurveyRun.technician_id == X-User-ID (ERR_NOT_RUN_OWNER)"
        side_effects:
          - "Increments SurveyRun.version by 1"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /survey-runs/{id}/accept"
        actor: IntegrityAnalyst
        preconditions:
          - "SurveyRun.status == SUBMITTED (ERR_RUN_NOT_SUBMITTED)"
          - "SurveyRun.coverage_pct >= MIN_COVERAGE_PCT (95) (ERR_COVERAGE_BELOW_MINIMUM)"
          - "Segregation of duties: X-User-ID != SurveyRun.technician_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "For every RouteSegmentAssignment on this route whose PipeSegment lies inside SurveyRun coverage: set status = COVERED"
          - "For every Leak discovered in this run: status remains OPEN; PipeSegment open_gradeX_count counters refresh"
          - "Recompute PipeSegment.posture for every covered segment"
          - "Increments SurveyRun.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /survey-runs/{id}/reject"
        actor: IntegrityAnalyst
        preconditions:
          - "SurveyRun.status == SUBMITTED (ERR_RUN_NOT_SUBMITTED)"
        side_effects:
          - "Every Leak referencing this SurveyRun in status OPEN moves to ABANDONED_SEGMENT"
          - "Recompute PipeSegment counters and posture for affected segments"
          - "Increments SurveyRun.version by 1"

  - entity: Leak
    initial_state: OPEN
    terminal_states: [VERIFIED_CLEARED, ABANDONED_SEGMENT]
    transitions:
      - from: OPEN
        to: REPAIR_SCHEDULED
        trigger: "POST /leaks/{id}/schedule-repair (creates RepairOrder)"
        actor: DispatchCoordinator
        preconditions:
          - "Leak.status == OPEN (ERR_LEAK_NOT_OPEN)"
          - "PipeSegment.status == ACTIVE (ERR_SEGMENT_NOT_ACTIVE)"
        side_effects:
          - "Create RepairOrder with priority mapped from Leak.grade (G1->P1_EMERGENCY, G2->P2_URGENT, G3->P3_ROUTINE)"
          - "Increments Leak.version by 1"

      - from: REPAIR_SCHEDULED
        to: UNDER_REPAIR
        trigger: "system (automatic when RepairOrder.dispatch_status flips DISPATCHED -> ON_SITE)"
        actor: system
        preconditions:
          - "RepairOrder.dispatch_status == ON_SITE"
        side_effects:
          - "Increments Leak.version by 1"

      - from: UNDER_REPAIR
        to: REPAIRED_PENDING_VERIFICATION
        trigger: "system (automatic when RepairOrder.dispatch_status flips ON_SITE -> WORK_COMPLETE)"
        actor: system
        preconditions:
          - "RepairOrder.dispatch_status == WORK_COMPLETE"
        side_effects:
          - "Increments Leak.version by 1"

      - from: REPAIRED_PENDING_VERIFICATION
        to: VERIFIED_CLEARED
        trigger: "POST /leaks/{id}/verify-clear"
        actor: ComplianceOfficer
        preconditions:
          - "Leak.status == REPAIRED_PENDING_VERIFICATION (ERR_LEAK_NOT_PENDING_VERIFICATION)"
          - "A post-repair SurveyRun on the segment with status == ACCEPTED and a Leak-free finding exists (ERR_NO_POST_REPAIR_SURVEY)"
          - "Segregation of duties: X-User-ID != the FieldTechnician who created the originating SurveyRun (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Decrement PipeSegment.open_gradeX_count for the grade the Leak held"
          - "Recompute PipeSegment.posture"
          - "Recompute PipeSegment.risk_score per risk_score calculation"
          - "Increments Leak.version by 1"

      - from: OPEN
        to: ABANDONED_SEGMENT
        trigger: "system (cascade from PipeSegment out-of-service)"
        actor: system
        preconditions:
          - "PipeSegment transition ACTIVE -> OUT_OF_SERVICE fired"
        side_effects:
          - "Any RepairOrder on this Leak with dispatch_status == PENDING_DISPATCH moves to CANCELLED"

      - from: REPAIR_SCHEDULED
        to: ABANDONED_SEGMENT
        trigger: "system (cascade from PipeSegment out-of-service)"
        actor: system
        preconditions:
          - "PipeSegment transition ACTIVE -> OUT_OF_SERVICE fired"
        side_effects:
          - "Any RepairOrder on this Leak with dispatch_status == PENDING_DISPATCH moves to CANCELLED"

      - from: OPEN
        to: OPEN
        trigger: "POST /leaks/{id}/regrade (self-loop: grade field changes)"
        actor: FieldTechnician
        preconditions:
          - "Leak.status == OPEN (ERR_LEAK_NOT_OPEN)"
          - "New grade differs from current Leak.grade (ERR_REGRADE_SAME_GRADE)"
          - "Regrade regrade_count <= MAX_REGRADE_COUNT (3) (ERR_REGRADE_LIMIT_EXCEEDED)"
        side_effects:
          - "Create RegradeEvent recording previous_grade/new_grade"
          - "Recompute Leak.repair_due_at per leak_grade calculation using new grade and the ORIGINAL discovered_at"
          - "If new grade > old grade (upgrade): decrement PipeSegment.open_grade<old>_count, increment PipeSegment.open_grade<new>_count, recompute posture"
          - "If new grade < old grade (downgrade): same counter shift; posture may downgrade"
          - "Increments Leak.regrade_count by 1"
          - "Increments Leak.version by 1"
        note: "Cyclic self-loop on OPEN; same Leak entity, mutated grade and counters"

  - entity: RepairOrder
    initial_state: PENDING_DISPATCH
    terminal_states: [WORK_COMPLETE, CANCELLED]
    transitions:
      - from: PENDING_DISPATCH
        to: DISPATCHED
        trigger: "POST /repair-orders/{id}/dispatch"
        actor: DispatchCoordinator
        preconditions:
          - "RepairOrder.dispatch_status == PENDING_DISPATCH (ERR_ORDER_NOT_PENDING_DISPATCH)"
          - "Target RepairCrew.status != OFF_DUTY (ERR_CREW_OFF_DUTY)"
          - "Target RepairCrew.open_order_count < RepairCrew.max_concurrent_orders (ERR_CREW_AT_CAPACITY)"
          - "If repair_method == CUT_AND_REPLACE or ABANDON_SEGMENT: target RepairCrew.is_qualified_excavation == true (ERR_CREW_NOT_QUALIFIED_EXCAVATION)"
          - "If repair_method == CUT_AND_REPLACE or ABANDON_SEGMENT: an ExcavationPermit for this order exists with status == GRANTED and expires_at > current logical clock (ERR_NO_VALID_EXCAVATION_PERMIT)"
        side_effects:
          - "Set RepairOrder.crew_id; set dispatched_at = current logical clock"
          - "Increment RepairCrew.open_order_count by 1; recompute RepairCrew.status (AT_CAPACITY if open_order_count >= max_concurrent_orders)"
          - "Increments RepairOrder.version by 1"

      - from: DISPATCHED
        to: ON_SITE
        trigger: "POST /repair-orders/{id}/arrive-on-site"
        actor: DispatchCoordinator
        preconditions:
          - "RepairOrder.dispatch_status == DISPATCHED (ERR_ORDER_NOT_DISPATCHED)"
        side_effects:
          - "Trigger Leak status transition REPAIR_SCHEDULED -> UNDER_REPAIR"
          - "Increments RepairOrder.version by 1"

      - from: ON_SITE
        to: WORK_COMPLETE
        trigger: "POST /repair-orders/{id}/mark-work-complete"
        actor: DispatchCoordinator
        preconditions:
          - "RepairOrder.dispatch_status == ON_SITE (ERR_ORDER_NOT_ON_SITE)"
        side_effects:
          - "Set RepairOrder.completed_at = current logical clock"
          - "Decrement RepairCrew.open_order_count by 1; recompute RepairCrew.status"
          - "Trigger Leak status transition UNDER_REPAIR -> REPAIRED_PENDING_VERIFICATION"
          - "Increments RepairOrder.version by 1"

      - from: PENDING_DISPATCH
        to: CANCELLED
        trigger: "POST /repair-orders/{id}/cancel"
        actor: DispatchCoordinator
        preconditions:
          - "RepairOrder.dispatch_status in {PENDING_DISPATCH, DISPATCHED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "If previously DISPATCHED: decrement RepairCrew.open_order_count by 1; recompute RepairCrew.status"
          - "Cascade: Leak status reverts REPAIR_SCHEDULED -> OPEN (compensating action)"
          - "Increments RepairOrder.version by 1"

      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /repair-orders/{id}/cancel"
        actor: DispatchCoordinator
        preconditions:
          - "RepairOrder.dispatch_status in {PENDING_DISPATCH, DISPATCHED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "Decrement RepairCrew.open_order_count by 1; recompute RepairCrew.status"
          - "Cascade: Leak status reverts REPAIR_SCHEDULED -> OPEN"
          - "Increments RepairOrder.version by 1"

      - from: PENDING_DISPATCH
        to: PENDING_DISPATCH
        trigger: "POST /repair-orders/{id}/apply-permit (self-loop on excavation_permit_status)"
        actor: ComplianceOfficer
        preconditions:
          - "RepairOrder.dispatch_status == PENDING_DISPATCH (ERR_ORDER_NOT_PENDING_DISPATCH)"
          - "RepairOrder.excavation_permit_status == PERMIT_REQUIRED (ERR_PERMIT_NOT_REQUIRED)"
        side_effects:
          - "Create ExcavationPermit (status=APPLIED); update RepairOrder.excavation_permit_status = PERMIT_APPLIED"
          - "Increments RepairOrder.version by 1"
        note: "Parallel state dimension — excavation_permit_status evolves independently of dispatch_status"

  - entity: ExcavationPermit
    initial_state: APPLIED
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: APPLIED
        to: GRANTED
        trigger: "POST /excavation-permits/{id}/grant"
        actor: ComplianceOfficer
        preconditions:
          - "ExcavationPermit.status == APPLIED (ERR_PERMIT_NOT_APPLIED)"
        side_effects:
          - "Set ExcavationPermit.granted_at = current logical clock"
          - "Update parent RepairOrder.excavation_permit_status = PERMIT_GRANTED"
          - "Increments ExcavationPermit.version by 1"

      - from: APPLIED
        to: DENIED
        trigger: "POST /excavation-permits/{id}/deny"
        actor: ComplianceOfficer
        preconditions:
          - "ExcavationPermit.status == APPLIED (ERR_PERMIT_NOT_APPLIED)"
        side_effects:
          - "Update parent RepairOrder.excavation_permit_status = PERMIT_DENIED"
          - "Increments ExcavationPermit.version by 1"

      - from: GRANTED
        to: EXPIRED
        trigger: "system (automatic when current logical clock > expires_at AND RepairOrder.dispatch_status != WORK_COMPLETE)"
        actor: system
        preconditions:
          - "current logical clock > ExcavationPermit.expires_at"
          - "RepairOrder.dispatch_status != WORK_COMPLETE"
        side_effects:
          - "Update parent RepairOrder.excavation_permit_status = PERMIT_EXPIRED"
          - "If RepairOrder.dispatch_status in {DISPATCHED, ON_SITE}: revert RepairOrder.dispatch_status to PENDING_DISPATCH, decrement RepairCrew.open_order_count, and revert Leak status to REPAIR_SCHEDULED (compensating unwind)"
          - "Increments ExcavationPermit.version by 1"

  - entity: ComplianceReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /compliance-reports/{id}/submit-for-review"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceReport.status == DRAFT (ERR_REPORT_NOT_DRAFT)"
          - "ComplianceReport.leak_section_snapshot_id refers to a RiskModelSnapshot with status == CURRENT (ERR_SNAPSHOT_STALE)"
          - "ComplianceReport.cp_section_snapshot_id refers to a RiskModelSnapshot with status == CURRENT (ERR_SNAPSHOT_STALE)"
        side_effects:
          - "Pin both RiskModelSnapshots: status becomes PINNED (immutable)"
          - "Increments ComplianceReport.version by 1"

      - from: PENDING_REVIEW
        to: SUBMITTED
        trigger: "POST /compliance-reports/{id}/submit-to-regulator"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceReport.status == PENDING_REVIEW (ERR_REPORT_NOT_PENDING_REVIEW)"
          - "ComplianceOfficer.jurisdiction_scope contains ComplianceReport.regulator (ERR_OFFICER_OUT_OF_JURISDICTION)"
          - "Current logical clock <= reporting_period_end + 60 days (ERR_REPORT_PAST_DUE)"
        side_effects:
          - "Set ComplianceReport.submitted_at = current logical clock"
          - "Increments ComplianceReport.version by 1"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /compliance-reports/{id}/record-acceptance"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceReport.status == SUBMITTED (ERR_REPORT_NOT_SUBMITTED)"
        side_effects:
          - "Increments ComplianceReport.version by 1"

      - from: SUBMITTED
        to: REJECTED_BY_REGULATOR
        trigger: "POST /compliance-reports/{id}/record-rejection"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceReport.status == SUBMITTED (ERR_REPORT_NOT_SUBMITTED)"
        side_effects:
          - "Increments ComplianceReport.version by 1"

      - from: REJECTED_BY_REGULATOR
        to: RESUBMISSION_REQUIRED
        trigger: "POST /compliance-reports/{id}/request-resubmission"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceReport.status == REJECTED_BY_REGULATOR (ERR_REPORT_NOT_REJECTED)"
        side_effects:
          - "Increments ComplianceReport.version by 1"

      - from: RESUBMISSION_REQUIRED
        to: DRAFT
        trigger: "POST /compliance-reports/{id}/reopen-draft"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceReport.status == RESUBMISSION_REQUIRED (ERR_REPORT_NOT_RESUBMISSION_REQUIRED)"
        side_effects:
          - "Both pinned RiskModelSnapshots revert PINNED -> STALE (forcing regeneration)"
          - "Null out leak_section_snapshot_id, cp_section_snapshot_id"
          - "Increments ComplianceReport.version by 1"
        note: "Cyclic DRAFT -> ... -> RESUBMISSION_REQUIRED -> DRAFT loop"

  - entity: RiskModelSnapshot
    initial_state: CURRENT
    terminal_states: [STALE]
    transitions:
      - from: CURRENT
        to: PINNED
        trigger: "system (when ComplianceReport pinning)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PINNED
        to: STALE
        trigger: "system (when ComplianceReport reopens draft)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CURRENT
        to: STALE
        trigger: "system (when any input changes: new Leak, Leak VERIFIED_CLEARED, CP anomaly opens, segment posture shift)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Auto-staling on data change enforces version-pinning discipline on ComplianceReport"

  - entity: Instrument
    initial_state: IN_SERVICE
    terminal_states: [RETIRED]
    transitions:
      - from: IN_SERVICE
        to: OUT_OF_CALIBRATION
        trigger: "system (automatic when current logical clock > Instrument.calibration_due_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments Instrument.version by 1"

      - from: OUT_OF_CALIBRATION
        to: IN_SERVICE
        trigger: "POST /instruments/{id}/calibrate (creates Calibration with outcome=PASS)"
        actor: CalibrationTech
        preconditions:
          - "Calibration.outcome == PASS (ERR_CALIBRATION_DRIFT_EXCEEDED)"
        side_effects:
          - "Update Instrument.calibrated_at = current logical clock"
          - "Recompute Instrument.calibration_due_at per instrument_calibration_due calculation"
          - "Increments Instrument.version by 1"

      - from: IN_SERVICE
        to: RETIRED
        trigger: "POST /instruments/{id}/retire"
        actor: CalibrationTech
        preconditions:
          - "No SurveyRun referencing this instrument with status in {DRAFT, SUBMITTED} (ERR_INSTRUMENT_IN_USE)"
        side_effects:
          - "Increments Instrument.version by 1"

  - entity: RepairCrew
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: AT_CAPACITY
        trigger: "system (automatic when open_order_count >= max_concurrent_orders)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AT_CAPACITY
        to: AVAILABLE
        trigger: "system (automatic when open_order_count < max_concurrent_orders)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AVAILABLE
        to: OFF_DUTY
        trigger: "POST /repair-crews/{id}/set-off-duty"
        actor: DispatchCoordinator
        preconditions: []
        side_effects: []

      - from: AT_CAPACITY
        to: OFF_DUTY
        trigger: "POST /repair-crews/{id}/set-off-duty"
        actor: DispatchCoordinator
        preconditions:
          - "No open RepairOrder for this crew (dispatch_status in {DISPATCHED, ON_SITE}) (ERR_CREW_HAS_OPEN_ORDERS)"
        side_effects: []

      - from: OFF_DUTY
        to: AVAILABLE
        trigger: "POST /repair-crews/{id}/set-on-duty"
        actor: DispatchCoordinator
        preconditions: []
        side_effects: []

  - entity: CathodicProtectionReading
    initial_state: NONE
    terminal_states: [RESOLVED]
    transitions:
      - from: NONE
        to: OPEN
        trigger: "system (automatic when CathodicProtectionReading created with is_anomalous=true)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute PipeSegment.posture (CP anomaly contributes)"
          - "Stale any RiskModelSnapshot touching this segment"
          - "Increments CathodicProtectionReading.version by 1"

      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /cp-readings/{id}/acknowledge"
        actor: IntegrityAnalyst
        preconditions:
          - "CathodicProtectionReading.anomaly_status == OPEN (ERR_ANOMALY_NOT_OPEN)"
        side_effects:
          - "Increments CathodicProtectionReading.version by 1"

      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /cp-readings/{id}/resolve"
        actor: IntegrityAnalyst
        preconditions:
          - "CathodicProtectionReading.anomaly_status == ACKNOWLEDGED (ERR_ANOMALY_NOT_ACKNOWLEDGED)"
          - "A newer CathodicProtectionReading on the same segment with is_anomalous=false exists (ERR_NO_CLEANUP_READING)"
        side_effects:
          - "Recompute PipeSegment.posture"
          - "Increments CathodicProtectionReading.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: leak-schedule-stale-leak
    parent_entity: Leak
    write_endpoint: "POST /leaks/{id}/schedule-repair"
    occ_field: "expected_leak_version"
    description: |
      Creating a RepairOrder against a Leak whose version has advanced since the
      dispatcher last observed it is rejected. This captures the case where another
      writer has just re-graded the Leak (mutating grade and repair_due_at) or has
      already scheduled a repair; the dispatcher's view of the leak is stale.
    error_id: ERR_STALE_LEAK_VERSION
    http_status: 412

  - rule_id: report-submit-stale-report
    parent_entity: ComplianceReport
    write_endpoint: "POST /compliance-reports/{id}/submit-for-review"
    occ_field: "expected_report_version"
    description: |
      Submitting a ComplianceReport whose version has advanced since the officer
      last observed it is rejected. This captures the case where another writer
      has just rebound one of the snapshot ids (refreshing inputs) and the
      submitting officer's view of the draft is stale.
    error_id: ERR_STALE_REPORT_VERSION
    http_status: 412

  - rule_id: snapshot-bind-stale-report
    parent_entity: ComplianceReport
    write_endpoint: "POST /compliance-reports/{id}/bind-snapshots"
    occ_field: "expected_report_version"
    description: |
      Binding snapshot ids onto a ComplianceReport whose version has advanced
      since the writer last observed it is rejected. This captures the case where
      another writer has rebound snapshots already, and the current write would
      silently overwrite a fresher pin.
    error_id: ERR_STALE_REPORT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: leak_grade
    trigger: "On Leak creation (POST /leaks) AND on POST /leaks/{id}/regrade"
    algorithm: threshold
    formula: |
      if bar_hole_reading_pct_lel >= G1_LEL_THRESHOLD_PCT (25) or
         (is_migration_evidence and distance_to_building_feet <= G1_MIGRATION_BUILDING_FT (20)):
          grade = G1
      elif concentration_ppm >= G2_PPM_THRESHOLD (10000) or
           (distance_to_building_feet is not null and distance_to_building_feet <= G2_BUILDING_FT (50)) or
           bar_hole_reading_pct_lel >= G2_LEL_THRESHOLD_PCT (5):
          grade = G2
      else:
          grade = G3
      repair_clock_days(grade) = {G1: 1, G2: 30, G3: 365}
      repair_due_at = discovered_at + repair_clock_days(grade) days
    input_set: "Newly created Leak input fields"
    constants:
      G1_LEL_THRESHOLD_PCT: 25
      G1_MIGRATION_BUILDING_FT: 20
      G2_PPM_THRESHOLD: 10000
      G2_BUILDING_FT: 50
      G2_LEL_THRESHOLD_PCT: 5
      G1_REPAIR_DAYS: 1
      G2_REPAIR_DAYS: 30
      G3_REPAIR_DAYS: 365
    precision: "datetime to second, integer ppm"
    variants:
      - name: conservative_grade
        when: "PipeSegment.is_high_consequence_area == true"
        difference: "Escalate by one grade level (G3 -> G2, G2 -> G1) when inputs land on the boundary; G1 remains G1"
      - name: standard_grade
        when: "PipeSegment.is_high_consequence_area == false"
        difference: "Apply thresholds as written with no escalation"

  - name: resurvey_interval
    trigger: "When SurveyRoute transitions IN_PROGRESS -> COMPLETED; recomputes PipeSegment.next_survey_due_at for each COVERED segment"
    algorithm: threshold
    formula: |
      base_interval_days(pressure_class, is_high_consequence_area) =
        if pressure_class == TRANSMISSION and is_high_consequence_area: 90
        elif pressure_class == TRANSMISSION: 180
        elif pressure_class == DISTRIBUTION and is_high_consequence_area: 180
        elif pressure_class == DISTRIBUTION: 365
        elif pressure_class == SERVICE and is_high_consequence_area: 365
        else: 730  # SERVICE non-HCA

      # Adjustments stack (multiply):
      factor = 1.0
      if PipeSegment.open_grade1_count > 0: factor = min(factor, 0.25)   # quarterly
      elif PipeSegment.open_grade2_count > 0: factor = min(factor, 0.5)  # semiannual
      if PipeSegment has any CathodicProtectionReading with anomaly_status in {OPEN, ACKNOWLEDGED}:
          factor = factor * 0.5

      interval_days = floor(base_interval_days * factor)
      next_survey_due_at = completed_at + interval_days days
    input_set: "PipeSegment (posture inputs) + Leak counters + CP readings"
    constants:
      BASE_TRANSMISSION_HCA_DAYS: 90
      BASE_TRANSMISSION_DAYS: 180
      BASE_DISTRIBUTION_HCA_DAYS: 180
      BASE_DISTRIBUTION_DAYS: 365
      BASE_SERVICE_HCA_DAYS: 365
      BASE_SERVICE_DAYS: 730
      G1_FACTOR: 0.25
      G2_FACTOR: 0.5
      CP_ANOMALY_FACTOR: 0.5
    precision: "integer days, datetime to second"
    variants:
      - name: forward_looking_estimate
        when: "Computed at SurveyRoute completion for scheduling"
        difference: "Uses leak counters and anomaly flags as of completion_at; subsequent leak changes do NOT retroactively recompute"
      - name: on_demand_estimate
        when: "GET /pipe-segments/{id}/next-survey-due endpoint recomputes live"
        difference: "Uses CURRENT counters and CURRENT anomaly flags at request time; may differ from forward_looking_estimate if leaks changed since route completion"

  - name: risk_score
    trigger: "On Leak VERIFIED_CLEARED, on SurveyRoute COMPLETED for covered segments, on CP anomaly transitions, on PipeSegment posture change"
    algorithm: weighted_scoring
    formula: |
      # Weights per contribution
      age_years = current_year - PipeSegment.install_year
      age_score = min(age_years / 50.0, 1.0) * W_AGE (0.20)

      material_score_map = { STEEL: 0.8, CAST_IRON: 1.0, PLASTIC_PE: 0.2, PLASTIC_PVC: 0.3, COPPER: 0.5 }
      material_score = material_score_map[PipeSegment.material] * W_MATERIAL (0.15)

      # Leak history component
      leak_score = (PipeSegment.open_grade1_count * 3.0 +
                    PipeSegment.open_grade2_count * 1.5 +
                    PipeSegment.open_grade3_count * 0.5) * W_LEAK (0.30)
      leak_score = min(leak_score, 1.0)

      # CP anomaly component
      open_cp_anomalies = count(CathodicProtectionReading on segment where anomaly_status in {OPEN, ACKNOWLEDGED})
      cp_score = min(open_cp_anomalies / 3.0, 1.0) * W_CP (0.20)

      # HCA multiplier applied AFTER sum
      base = age_score + material_score + leak_score + cp_score
      if PipeSegment.is_high_consequence_area:
          base = base * HCA_MULTIPLIER (1.5)
      risk_score = min(round(base * 100, 2), 100.0)  # 0-100 scale, half-up
    input_set: "PipeSegment fields, Leak counters, CP anomaly counts, install_year, material"
    constants:
      W_AGE: 0.20
      W_MATERIAL: 0.15
      W_LEAK: 0.30
      W_CP: 0.20
      HCA_MULTIPLIER: 1.5
      HIGH_RISK_THRESHOLD: 70.0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_risk_score
        when: "Computed at SurveyRoute completion before leak verifications flow through"
        difference: "Uses pre-completion open_gradeX_count values (snapshot of counters at route-complete time); does not reflect leaks VERIFIED_CLEARED after the route completes"
      - name: final_risk_score
        when: "Computed when leaks VERIFIED_CLEARED or CP anomaly resolves"
        difference: "Uses post-event counters and anomaly flags; may differ from provisional by >= 1 cent for the same logical segment"

  - name: crew_dispatch_selection
    trigger: "On POST /repair-orders/{id}/dispatch (crew_id assignment by selector policy)"
    algorithm: weighted_scoring
    formula: |
      # Eligibility: RepairCrew.status != OFF_DUTY AND open_order_count < max_concurrent_orders
      # If repair_method is CUT_AND_REPLACE or ABANDON_SEGMENT: also require is_qualified_excavation == true
      # If repair needs excavation (CUT_AND_REPLACE or ABANDON_SEGMENT): require valid ExcavationPermit (GRANTED, expires_at > now)

      # Ranking expression per candidate crew:
      # utilization_ratio = open_order_count / max_concurrent_orders
      # dispatch_score = (1 - utilization_ratio) * 0.7 + (1 if crew.home_region == segment.region_hint else 0) * 0.3
      #   (For this benchmark, region_hint is set on PipeSegment via input field; if null, region contribution is 0)
      # Sort dispatch_score DESC.
      # Tie-break 1: open_order_count ASC.
      # Tie-break 2: created_at ASC.
      # Fallback if candidate set empty: raise ERR_NO_ELIGIBLE_CREW.
    input_set: "All RepairCrew with status != OFF_DUTY, RepairOrder fields, PipeSegment reference"
    constants:
      UTILIZATION_WEIGHT: 0.7
      REGION_MATCH_WEIGHT: 0.3
    precision: "4 decimal places on dispatch_score, round_half_up"

  - name: posture_derivation
    trigger: "On Leak create/grade change/status change, on CP anomaly transitions, on PipeSegment out-of-service"
    algorithm: threshold
    formula: |
      if PipeSegment.open_grade1_count >= 1:
          posture = CRITICAL
      elif PipeSegment.open_grade2_count >= 2:
          posture = CRITICAL
      elif PipeSegment.open_grade2_count == 1 or open_cp_anomaly_count >= 1:
          posture = ELEVATED
      elif PipeSegment.open_grade3_count >= 3:
          posture = ELEVATED
      else:
          posture = NORMAL
    input_set: "PipeSegment open_grade counters, CP anomaly count"
    constants:
      G1_CRITICAL_MIN: 1
      G2_CRITICAL_MIN: 2
      G3_ELEVATED_MIN: 3
    precision: "enum value"

  - name: instrument_calibration_due
    trigger: "On successful Calibration (outcome=PASS) — updates Instrument.calibration_due_at"
    algorithm: forward_looking
    formula: |
      interval_days(instrument_type) =
        FLAME_IONIZATION: 90
        CGI: 60
        OMD: 90
        AERIAL_LIDAR: 180
        CP_VOLTMETER: 365

      calibration_due_at = calibrated_at + interval_days(instrument_type) days
    input_set: "Instrument fields, Calibration record"
    constants:
      FLAME_IONIZATION_INTERVAL_DAYS: 90
      CGI_INTERVAL_DAYS: 60
      OMD_INTERVAL_DAYS: 90
      AERIAL_LIDAR_INTERVAL_DAYS: 180
      CP_VOLTMETER_INTERVAL_DAYS: 365
      MAX_DRIFT_PCT: 5.0
    precision: "datetime to second"

  - name: report_payload_generation
    trigger: "On POST /compliance-reports (DRAFT creation) AND on POST /compliance-reports/{id}/submit-to-regulator"
    algorithm: aggregation
    formula: |
      # Two-section aggregation, each pinning one RiskModelSnapshot
      # leak_section: counts of leaks by grade opened in [reporting_period_start, reporting_period_end),
      #   plus counts VERIFIED_CLEARED in window, plus on-time repair rate
      # cp_section: counts of CP readings taken, anomalies opened, anomalies resolved
      # Nested rounding rule (CRITICAL): compute each ratio at FULL precision,
      #   round each ratio to 4 decimal places (round_half_up) FIRST,
      #   then assemble into payload. Do NOT round the final aggregate again.
      on_time_rate_leak = round(count(Leak where VERIFIED_CLEARED_at <= repair_due_at) /
                                  max(count(Leak where VERIFIED_CLEARED_at in window), 1), 4)
      cp_anomaly_rate = round(count(CP readings where is_anomalous) /
                              max(count(CP readings in window), 1), 4)
    input_set: "All Leak + CathodicProtectionReading entities where discovered_at/recorded_at falls in [period_start, period_end)"
    constants: {}
    precision: "ratios to 4 decimal places, round_half_up"

  - name: overdue_leak_count
    trigger: "On GET /pipe-segments/{id}/compliance-summary AND on RiskModelSnapshot generation"
    algorithm: aggregation
    formula: |
      # A Leak is OVERDUE if status in {OPEN, REPAIR_SCHEDULED, UNDER_REPAIR, REPAIRED_PENDING_VERIFICATION}
      # AND current logical clock > Leak.repair_due_at
      overdue_count = count(Leak on segment where status in {OPEN, REPAIR_SCHEDULED, UNDER_REPAIR, REPAIRED_PENDING_VERIFICATION}
                             and current_logical_clock > repair_due_at)
      # Boundary precision: a leak whose repair_due_at == current clock is NOT overdue (strictly greater-than)
    input_set: "Leak entities on the segment, current logical clock"
    constants: {}
    precision: "integer count"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of declared role enum"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted to invoke this endpoint per RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path-templated and body-referenced id resolves to an existing entity (path ids left-to-right, then body ids)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target entity in correct state for this transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: business_safety
    check: "Instrument referenced by SurveyRun has status == IN_SERVICE at run start"
    error_id: ERR_INSTRUMENT_OUT_OF_CALIBRATION
    http_status: 422
    applies_to: "POST /survey-runs, POST /survey-runs/{id}/submit"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: officer approving verification != technician who originated the survey run"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /survey-runs/{id}/accept, POST /leaks/{id}/verify-clear"

  - priority: 7
    category: business_safety
    check: "ComplianceOfficer jurisdiction_scope includes ComplianceReport.regulator"
    error_id: ERR_OFFICER_OUT_OF_JURISDICTION
    http_status: 422
    applies_to: "POST /compliance-reports/{id}/submit-to-regulator"

  - priority: 8
    category: business_temporal
    check: "Current logical clock within SurveyRoute scheduled window at start"
    error_id: ERR_OUTSIDE_SCHEDULED_WINDOW
    http_status: 422
    applies_to: "POST /survey-routes/{id}/start"

  - priority: 9
    category: business_temporal
    check: "ComplianceReport submitted within reporting_period_end + 60 days"
    error_id: ERR_REPORT_PAST_DUE
    http_status: 422
    applies_to: "POST /compliance-reports/{id}/submit-to-regulator"

  - priority: 10
    category: business_temporal
    check: "ExcavationPermit expires_at > current logical clock when used for dispatch"
    error_id: ERR_NO_VALID_EXCAVATION_PERMIT
    http_status: 422
    applies_to: "POST /repair-orders/{id}/dispatch"

  - priority: 11
    category: business_constraint
    check: "RepairCrew has capacity and is_qualified_excavation when required"
    error_id: ERR_CREW_NOT_QUALIFIED_EXCAVATION
    http_status: 422
    applies_to: "POST /repair-orders/{id}/dispatch"

  - priority: 12
    category: business_constraint
    check: "RepairCrew open_order_count < max_concurrent_orders"
    error_id: ERR_CREW_AT_CAPACITY
    http_status: 422
    applies_to: "POST /repair-orders/{id}/dispatch"

  - priority: 13
    category: business_constraint
    check: "SurveyRun coverage_pct >= MIN_COVERAGE_PCT (95)"
    error_id: ERR_COVERAGE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /survey-runs/{id}/accept"

  - priority: 14
    category: business_referential
    check: "RiskModelSnapshot bound to ComplianceReport has status == CURRENT"
    error_id: ERR_SNAPSHOT_STALE
    http_status: 422
    applies_to: "POST /compliance-reports/{id}/submit-for-review, POST /compliance-reports/{id}/bind-snapshots"

  - priority: 15
    category: business_referential
    check: "Post-repair SurveyRun with status == ACCEPTED and leak-free finding exists"
    error_id: ERR_NO_POST_REPAIR_SURVEY
    http_status: 422
    applies_to: "POST /leaks/{id}/verify-clear"

  - priority: 16
    category: business_constraint
    check: "Regrade regrade_count < MAX_REGRADE_COUNT (3)"
    error_id: ERR_REGRADE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /leaks/{id}/regrade"

  - priority: 17
    category: business_constraint
    check: "Regrade new_grade != current Leak.grade"
    error_id: ERR_REGRADE_SAME_GRADE
    http_status: 422
    applies_to: "POST /leaks/{id}/regrade"

  - priority: 18
    category: business_fiscal
    check: "Leak.discovered_at and PipeSegment.install_year within sane bounds (year >= 1900)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /leaks, POST /pipe-segments"

  - priority: 19
    category: business_referential
    check: "Post-resolution cleanup CP reading exists (is_anomalous=false, more recent)"
    error_id: ERR_NO_CLEANUP_READING
    http_status: 422
    applies_to: "POST /cp-readings/{id}/resolve"

  - priority: 20
    category: existence
    check: "OCC expected_<parent>_version matches current entity version"
    error_id: ERR_STALE_LEAK_VERSION
    http_status: 412
    applies_to: "POST /leaks/{id}/schedule-repair"

  - priority: 21
    category: existence
    check: "OCC expected_report_version matches current ComplianceReport version"
    error_id: ERR_STALE_REPORT_VERSION
    http_status: 412
    applies_to: "POST /compliance-reports/{id}/submit-for-review, POST /compliance-reports/{id}/bind-snapshots"

