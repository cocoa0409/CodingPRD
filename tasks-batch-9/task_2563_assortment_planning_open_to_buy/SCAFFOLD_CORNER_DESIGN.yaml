            - "after CLIMATE 10500 joins it: ${mult_vc} == 11550, because the chain restarts from 10000 and walks CLIMATE first (10000 -> 10500) then VOLUME (10500 -> round_half_up(11550.0) == 11550); ${st_vc} == 7305"
            - "with all three ACTIVE: ${mult_all} == 12417 by the pinned walk 10000 -> 10500 (CLIMATE) -> round_half_up(11287.5) == 11288 (DEMOGRAPHIC) -> round_half_up(12416.8) == 12417 (VOLUME)"
            - "${st_all} == 7854 == round_half_up(5500 * 11500 * 12417 / 100000000) with ${basis_all} still NEW_ITEM_BASIS"
            - "multiplying the three factors before rounding gives 12416 and a sell_through of 7853; applying the same three overlays in creation order (VOLUME, CLIMATE, DEMOGRAPHIC) also gives 12416 - so both the per-step rounding and the type-pinned order are falsified by a one-bps drift that propagates to the forecast"
            - "12417 sits inside [OVERLAY_MULTIPLIER_FLOOR_BPS 5000, OVERLAY_MULTIPLIER_CEILING_BPS 15000], so the clamp is inert here and cannot be masking the arithmetic"
            - "the three overlays share one window without tripping ERR_OVERLAY_WINDOW_CONFLICT because that rule is scoped per (store_cluster_id, overlay_type) and these are three different types"

      - name: otb_planned_versus_projected_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.plan_month_open_to_buy.variants
          - entities.PlanMonth.fields.active_basis
        distinguishing_aspect: "The same authored month yields a different otb_planned_cents under PLANNED_BASIS and PROJECTED_BASIS, and the basis switch is driven by the existence of ActualsPost rows rather than by any request field."
        excluded_because:
          difficulty_instance: otb_basis_divergence_planned_vs_projected
          rationale: "That §1.8 instance is the dual-variant-calculation probe for this exact pair: it computes the month under PLANNED_BASIS, posts one week of actuals, and re-reads it under PROJECTED_BASIS, asserting both money figures and the active_basis flip, so a breadth instance would repeat it verbatim."

      - name: sell_through_variant_selected_by_lifecycle_stage
        claim_type: variant_selection
        grounds:
          - calculations.item_sell_through_forecast.variants
          - entities.AssortmentItem.fields.sell_through_basis
          - calculations.item_sell_through_forecast.constants
        distinguishing_aspect: "lifecycle_stage alone selects the branch: NEW reads the tier benchmark, the cluster sales index and the overlay multiplier while ignoring prior_season_sell_through_bps, and CARRYOVER/CORE/EXIT read prior_season_sell_through_bps and the cluster demographic index while ignoring all three of the others - and either branch is finally capped at SELL_THROUGH_CAP_BPS 9800."
        excluded_because:
          difficulty_instance: sell_through_basis_divergence_new_vs_carryover
          rationale: "That §1.8 instance builds two items that differ only in lifecycle_stage on the same option plan, asserts both branch formulas and the ignored inputs, and drives the CARRYOVER branch through the 9800 ceiling, so both the selection and the cap are already covered."

      - name: vendor_capacity_interval_merge_over_ship_windows
        claim_type: interval_merge
        grounds:
          - calculations.vendor_window_load
          - validations[priority=31].ERR_VENDOR_CAPACITY_EXCEEDED
        distinguishing_aspect: "Capacity is aggregated over the set of commitments whose half-open ship windows overlap the candidate's, so touching windows never combine while genuinely overlapping ones sum against weekly_unit_capacity."
        excluded_because:
          difficulty_instance: vendor_ship_window_half_open_capacity_aggregate
          rationale: "That §1.8 instance is the resource-temporal-overlap probe for vendor_window_load: it places touching windows that must both be accepted and an overlapping third that must be rejected, and asserts the aggregate sum against weekly_unit_capacity, which is strictly broader than a breadth restatement."

      - name: receipt_budget_nested_min_max_shape
        claim_type: correct_result
        grounds:
          - calculations.plan_receipt_budget
          - entities.CategoryPlan.fields.receipt_budget_cents
        distinguishing_aspect: "The budget is min(department cap, max(role capacity, turn capacity)) - a nested selection where the department cap can veto a generous role multiplier and the two inner candidates compete on already-rounded integers."
        excluded_because:
          difficulty_instance: receipt_budget_nested_min_max_department_cap
          rationale: "That §1.8 instance is the combinatorial-formula probe for this nesting: it drives the department-capped case where the inner max is beaten by the outer min and asserts each named intermediate, so the nesting shape itself needs no separate breadth instance (the constants-applied corner of the same formula is covered here by receipt_budget_turn_floor_and_seasonal_multiplier)."

      - name: markdown_reserve_single_pass_evaluation_order
        claim_type: constraint_propagation
        grounds:
          - calculations.markdown_reserve
          - calculations.markdown_reserve.trigger
        distinguishing_aspect: "The reserve looks circular - it feeds otb_planned_cents, which gates receipts, which feed the sell-through that picks the reserve rate - and the rule is a single pass fired on exactly two events, never iterated to a fixed point."
        excluded_because:
          difficulty_instance: markdown_reserve_pinned_single_pass
          rationale: "That §1.8 instance is the dedicated probe for the pinned order: it commits receipts and shows that provisional_sell_through_bps, reserve_rate_bps and markdown_reserve_cents do NOT move until the next declared trigger, and that the newly committed dollars then enter the denominator exactly once."

  # === 4. From Table 4 (Validations) ===
  - section: validations
    instances:
      - name: authorization_open_unit_ceiling_is_an_aggregate_limb
        claim_type: aggregate_validation
        grounds:
          - validations[priority=31].ERR_VENDOR_CAPACITY_EXCEEDED
          - calculations.vendor_window_load
          - entities.VendorAuthorization.fields.max_open_units
        distinguishing_aspect: "ERR_VENDOR_CAPACITY_EXCEEDED has two independent limbs and this instance isolates the SECOND one: the category-level open-unit ceiling, which ignores ship windows entirely. The two existing commitments sit in windows a month apart, so the weekly limb never sees them together and 12000 is never approached; the rejection comes purely from summing open units across the category. The sum is driven to exactly max_open_units first (accepted) and then one unit past it (rejected), and withdrawing one commitment releases its units so the same one-unit candidate then succeeds."
