              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { pool_id: $.data.id }
            - call: "POST /api/donors"
              payload: { display_name: "Dana Cole", email: "dana@example.com" }
              as: Anonymous
              captures: { d_id: $.data.id }
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "CAMPAIGN", designation_id: "${camp_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_matched_id: $.data.id }
            - call: "POST /api/donations/${don_matched_id}/settle"
              payload: { outcome: "SETTLED" }
              as: PlatformAdmin
            - call: "POST /api/match-pools/${pool_id}/close"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "CAMPAIGN", designation_id: "${camp_id}", amount_cents: 2000 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_unmatched_id: $.data.id }
            - call: "POST /api/donations/${don_unmatched_id}/settle"
              payload: { outcome: "SETTLED" }
              as: PlatformAdmin
