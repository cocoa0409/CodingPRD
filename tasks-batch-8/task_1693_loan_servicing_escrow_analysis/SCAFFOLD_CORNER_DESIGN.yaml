      - name: sod_payee_self_verify_rejected
        claim_type: role_denial
        grounds: ["validations[priority=12]", "errors[ERR_SOD_VIOLATION]", "state_machines.Payee"]
        distinguishing_aspect: "Segregation of duties: a user holding the PayeeVerifier role but whose X-User-ID equals the payee's created_by_user_id (dp_1, the creator wearing the verifier hat) -> ERR_SOD_VIOLATION; a genuinely independent verifier (pv_1) succeeds."
        test_recipe:
          setup: ["Payee created by dp_1"]
          setup_api_calls:
            - { call: "POST /servicing/payees", payload: { payee_type: "TAX_AUTHORITY", legal_name: "County Treasurer", remit_to_address: "1 Civic Center", ach_routing_mask: "****1234" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
          trigger:
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "dp_1", captures: { err: $.data.error_id } }
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "pv_1" }
          assert:
            - "err == ERR_SOD_VIOLATION (role allowed, identity collides with created_by_user_id)"
            - "Payee.${pay_id}.verification_status == VERIFIED after pv_1 verify, verified_by_user_id == pv_1"

      - name: sod_disbursement_self_release_rejected
        claim_type: role_denial
        grounds: ["validations[priority=12]", "errors[ERR_SOD_VIOLATION]", "state_machines.Disbursement.SCHEDULED_to_RELEASED"]
        distinguishing_aspect: "Scheduler dp_1 releasing their own disbursement -> ERR_SOD_VIOLATION; a second processor (dp_2) succeeds."
        test_recipe:
          setup: ["Setup A account ACTIVE; balance 100000; disbursement scheduled by dp_1; clock at release date 2026-08-10"]
          setup_api_calls:
            - { call: "POST /servicing/payees", payload: { payee_type: "TAX_AUTHORITY", legal_name: "County Treasurer", remit_to_address: "1 Civic Center", ach_routing_mask: "****1234" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "pv_1" }
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-RBAC-3", borrower_name: "Sod Release", principal_balance_cents: 30000000, monthly_pi_cents: 180000, closing_date: "2026-08-01", escrow_required: true }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/escrow-account", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "PROPERTY_TAX", expected_annual_amount_cents: 240000, installments_per_year: 2, first_due_date: "2026-12-15" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { li_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/deposits", payload: { amount_cents: 100000, effective_date: "2026-08-05" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/disbursements", payload: { line_item_id: "${li_id}", payee_id: "${pay_id}", amount_cents: 30000, due_date: "2026-08-20", scheduled_release_date: "2026-08-10" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { disb_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1" }
          trigger:
            - { call: "POST /servicing/disbursements/${disb_id}/release", payload: {}, as: DisbursementProcessor, as_user_id: "dp_1", captures: { err: $.data.error_id } }
            - { call: "POST /servicing/disbursements/${disb_id}/release", payload: {}, as: DisbursementProcessor, as_user_id: "dp_2" }
          assert:
            - "err == ERR_SOD_VIOLATION (releaser == scheduler)"
            - "Second release by dp_2 succeeds: Disbursement.${disb_id}.status == RELEASED and released_by_user_id == dp_2"

      - name: sod_resolver_is_investigator_rejected
        claim_type: role_denial
        grounds: ["validations[priority=12]", "errors[ERR_SOD_VIOLATION]", "state_machines.ErrorResolutionCase"]
        distinguishing_aspect: "Case assigned to co_2 cannot be resolved by co_2 (ERR_SOD_VIOLATION); co_1 resolves cleanly."
