            - "GET /institutions/${inst} still reports period_count == 0 and unrestricted_giving_base_cents == 0"
            - "The same body with donor_restricted_endowment_draw_cents 10000000 (sum exactly 60000000) is accepted with unrestricted_contributions_cents == 0"

      - name: board_quorum_exactly_at_the_bylaws_threshold_passes_while_below_is_rejected
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=28]
          - errors[ERR_BOARD_QUORUM_NOT_MET]
          - entities.GovernanceAuthorization.fields.board_quorum_pct
        distinguishing_aspect: "The quorum comparison is inclusive on a 4-decimal rounded quotient: 8/12 -> 0.6667 equals bylaws_quorum_pct 0.6667 and verifies, while 7/12 -> 0.5833 is 422 ERR_BOARD_QUORUM_NOT_MET."
        test_recipe:
          setup:
            - "One institution with bylaws_quorum_pct 0.6667 and two SUBMITTED packets: one carrying 8 of 12 votes, one carrying 7 of 12."
          setup_api_calls:
