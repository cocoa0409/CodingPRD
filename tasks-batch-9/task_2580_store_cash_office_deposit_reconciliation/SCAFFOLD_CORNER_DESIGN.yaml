      - name: cashier_cannot_drop_into_another_cashiers_till
        claim_type: peer_role_isolation
        grounds:
          - validations[priority=20]
          - errors[ERR_UNAUTHORIZED]
          - endpoints["POST /cash-ops/till-sessions/{id}/drops"].roles
        distinguishing_aspect: >
          Role membership is not enough for a Cashier: the second clause of the priority-20 check
          compares X-User-ID with TillSession.cashier_id, so cashier E-200 — a legitimate Cashier with
