        distinguishing_aspect: "Zero/boundary edge on a different metric (temperature) through a different endpoint: transit_temp_celsius exactly 4.0 C PASSES receipt (violation requires strictly greater), 4.1 C FAILS; the sibling instance uses distance, not temperature."
