  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (money zero-sum vs unit conservation)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: chargeback_zero_sum_between_factory_and_buyer
        grounds:
          - state_machines.QualityClaim.FILED_to_APPROVED
          - entities.Factory.fields.debit_balance_cents
          - entities.Buyer.fields.credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity: chargeback money. Approving claim c1 (base
          1,000, penalty 51, total 1,051) adds exactly 1,051 to BOTH
          factory.debit_balance_cents and buyer.credit_balance_cents; the
          conserved quantity (factory debit − buyer credit) stays 0, and the
          PO's remaining_payable_cents drops by the same 1,051 — money moved
          between the two ledgers with no creation or loss.
        test_recipe:
          setup:
            - "Buyer b1, agents a1 (assigned) + a2 (adjudicator), factory f1 grade-A with APPAREL docs verified (posture COMPLIANT)"
            - "PO p1: 25 @ 400 = 10,000, CLOSED via full milestone/PSI/shipment/receipt flow"
            - "Claim c1 filed on p1 with lines 333/333/334 (defective_qty 3, defect_rate 0.1200)"
          setup_api_calls:
            - call: "POST /sourcing/buyers"
              payload: { name: "Buyer One", country_code: "US" }
              as: PlatformAdmin
              captures: { b1_id: "$.data.id" }
            - call: "POST /sourcing/agents"
              payload: { name: "Agent One", agency_name: "AgencyCo" }
              as: PlatformAdmin
              captures: { a1_id: "$.data.id" }
