      - Product.${p2}.created_at == 2026-08-20T00:00:00Z
      - Product.${p2}.updated_at == 2026-08-20T00:00:00Z
      - Product.${p1}.created_at == 2026-08-01T00:00:00Z
      - Product.${p1}.updated_at == 2026-08-01T00:00:00Z
