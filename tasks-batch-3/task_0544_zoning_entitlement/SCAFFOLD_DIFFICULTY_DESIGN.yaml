          - state_machines.EntitlementApplication.SCHEDULED_to_WITHDRAWN
        distinguishing_aspect: "Conserved quantity = integer agenda slots (distinct from fee cents): placing an application consumes one slot (5->4); withdrawing it removes the item and restores Hearing.agenda_slots_remaining to the full capacity 5."
