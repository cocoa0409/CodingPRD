            - "au2 is a created authorization id with amount 9000 (current version accepted)"

      - name: occ_review_create_stale_application_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[abandonment-review-create-stale-application]", "errors[ERR_STALE_VERSION]", "validations[priority=5]"]
        distinguishing_aspect: "OCC on Application.version: review creation with the observed version succeeds and bumps the application version; replaying the original version on a second create is rejected 412 ERR_STALE_VERSION (before the ERR_REVIEW_ALREADY_OPEN business check, which the fresh-version twin in validations/review_already_open_and_occ_precedence demonstrates)."
        test_recipe:
          setup: ["US rule; client; family; PENDING app at known version"]
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction: "US", oa_response_months: 3, max_extensions: 2, extension_months: 1, extension_fee_cents: 20000, annuity_start_year: 3, term_years: 5, surcharge_window_months: 6, surcharge_bps_month_1: 2500, surcharge_bps_late: 5000, small_entity_multiplier_bps: 5000, fee_tier_bounds: "1-3|4-7|8-12|13-20", fee_tier_1_cents: 10000, fee_tier_2_cents: 20000, fee_tier_3_cents: 30000, fee_tier_4_cents: 40000, paris_window_months: 12, pct_window_months: 30, fx_to_usd_cents_bps: 10000 }
