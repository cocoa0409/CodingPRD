              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { addr1_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr1_id}", household_size: 4, annual_income_cents: 4341600, last_3mo_income_cents: 1085400, qualifying_benefit: "NONE", tribal_lands_flag: false }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "2 Bravo St", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { addr2_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Bea Tso", date_of_birth: "1975-09-02", last4_ssn: "8823", address_id: "${addr2_id}", household_size: 4, annual_income_cents: 4341601, last_3mo_income_cents: 1085401, qualifying_benefit: "NONE", tribal_lands_flag: false }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { sub2_id: $.data.id }
          trigger:
            - call: "POST /lifeline/subscribers/${sub1_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-N1" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { chk1_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub2_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-N2" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { over_err: $.data.error_id }
          assert:
            - "Subscriber.${sub1_id}.income_threshold_cents == 4341600"
            - "Subscriber.${sub2_id}.income_threshold_cents == 4341600"
            - "the first trigger call returns HTTP 201"
            - "EligibilityCheck.${chk1_id}.status == PENDING_VERIFIER"
            - "EligibilityCheck.${chk1_id}.evaluated_income_cents == 4341600"
            - "EligibilityCheck.${chk1_id}.income_threshold_cents == 4341600"
            - "EligibilityCheck.${chk1_id}.income_variant == STRICT_ANNUALIZED"
            - "EligibilityCheck.${chk1_id}.claimed_basis == INCOME"
            - "Subscriber.${sub1_id}.status == ELIGIBILITY_PENDING"
            - "the second trigger call returns HTTP 409 and ${over_err} == ERR_SUBSCRIBER_INCOME_ABOVE_THRESHOLD"
            - "Subscriber.${sub2_id}.status == PROSPECT"

  # =========================================================================
  # RULE 7 - cross_entity_state_dependency
  # Two dependencies across DIFFERENT ENTITY PAIRS:
  #   7A -> Enrollment depends on HouseholdAddress.status
  #   7B -> ServiceTransfer depends on the TARGET Provider.status
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: enrollment_creation_gated_on_household_address_duplicate_resolution
        grounds:
          - validations[priority=64]
          - state_machines.HouseholdAddress.status.UNVERIFIED_to_DUPLICATE_FLAGGED
          - state_machines.HouseholdAddress.status.DUPLICATE_FLAGGED_to_RESOLVED_MULTI_HOUSEHOLD
          - calculations.address_normalization_hash
          - calculations.household_benefit_occupancy
          - concurrency_rules[address-resolution-stale-address]
        distinguishing_aspect: |
          The entity pair is Enrollment -> HouseholdAddress: POST /lifeline/enrollments is
          refused with ERR_ADDRESS_DUPLICATE_UNRESOLVED purely because the certified
          address sits in DUPLICATE_FLAGGED, and the identical payload succeeds once
          POST /lifeline/addresses/{id}/duplicate-resolution moves that OTHER entity to
          RESOLVED_MULTI_HOUSEHOLD - the subscriber and the check are unchanged throughout.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Provider licensed in TX with enrollment_cap 50."
            - "Address A1 '1200 N Main St / Apt 4B / El Paso / TX / 79901' with subscriber S1 already VERIFIED_ELIGIBLE on an unexpired check."
            - "Address A2 is a differently punctuated spelling of the same dwelling, so both A1 and A2 hold status DUPLICATE_FLAGGED and A1.occupied_benefit_slots is 0."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143016", study_area_code: "489016", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_a_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", unit_designator: "Apt 4B", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { addr1_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr1_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000, qualifying_benefit: "NONE", tribal_lands_flag: false }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub1_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-O1" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { chk1_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk1_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 n. main st.", unit_designator: "apt 4-b", city: "EL PASO", state_code: "TX", postal_code: "79901-2214" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { addr2_id: $.data.id }
          trigger:
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub1_id}", provider_id: "${prov_a_id}", eligibility_check_id: "${chk1_id}", certified_address_id: "${addr1_id}", service_type: "VOICE", one_per_household_attested: true }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { blocked_err: $.data.error_id }
            - call: "GET /lifeline/addresses/${addr1_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { addr1_ver: $.data.version, addr1_cohort: $.data.cohort_address_count, addr1_hash: $.data.address_hash }
            - call: "POST /lifeline/addresses/${addr1_id}/duplicate-resolution"
              payload: { resolution: "MULTI_HOUSEHOLD", expected_address_version: "${addr1_ver}", declared_household_count: 2, independent_household_worksheet_ref: "WS-1", resolution_note: "two independent economic households share the unit" }
              as: ProgramAdministrator
              as_user_id: "PA-1"
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub1_id}", provider_id: "${prov_a_id}", eligibility_check_id: "${chk1_id}", certified_address_id: "${addr1_id}", service_type: "VOICE", one_per_household_attested: true }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { enr1_id: $.data.id }
          assert:
            - "the first trigger call returns HTTP 409 and ${blocked_err} == ERR_ADDRESS_DUPLICATE_UNRESOLVED"
            - "${addr1_cohort} == 2"
            - "${addr1_hash} == 1200NMAINST|APT4B|ELPASO|TX|79901"
            - "HouseholdAddress.${addr1_id}.status == RESOLVED_MULTI_HOUSEHOLD"
            - "HouseholdAddress.${addr1_id}.declared_household_count == 2"
            - "HouseholdAddress.${addr1_id}.max_permitted_benefit_slots == 2"
            - "HouseholdAddress.${addr1_id}.independent_household_worksheet_ref == WS-1"
            - "HouseholdAddress.${addr2_id}.status == DUPLICATE_FLAGGED"
            - "HouseholdAddress.${addr2_id}.max_permitted_benefit_slots == 1"
            - "the last trigger call returns HTTP 201"
            - "Enrollment.${enr1_id}.benefit_status == ACTIVE"
            - "Enrollment.${enr1_id}.certified_address_id == ${addr1_id}"
            - "HouseholdAddress.${addr1_id}.occupied_benefit_slots == 1"
            - "Subscriber.${sub1_id}.status == ENROLLED"

      - name: transfer_acceptance_gated_on_target_provider_active_status
        grounds:
          - validations[priority=59]
          - state_machines.ServiceTransfer.status.REQUESTED_to_ACCEPTED_COMPLETED
          - state_machines.ServiceTransfer.status.REQUESTED_to_SUPERSEDED
          - calculations.benefit_port_freeze_window
          - concurrency_rules[transfer-request-stale-enrollment]
          - entities.Provider.fields.status
        distinguishing_aspect: |
          The entity pair is ServiceTransfer -> Provider (the TARGET carrier, not the
          source): a REQUESTED transfer to a SUSPENDED carrier is refused with
          ERR_PROVIDER_NOT_ACTIVE and stays REQUESTED, while a second transfer of the same
          enrollment to an ACTIVE carrier completes - the blocking state lives on a
          Provider row that the accept call never writes to.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "Provider A ACTIVE (TX, cap 50), Provider B created with status SUSPENDED (TX, cap 50), Provider C ACTIVE (TX, cap 50)."
            - "Enrollment E1 at Provider A on VOICE with benefit_start_date 2026-08-01, so port_freeze_until is 2026-09-30T00:00:00Z."
            - "Clock moved to exactly 2026-09-30T00:00:00Z, the first instant outside the half-open port freeze."
            - "Transfer T1 requested from A to the SUSPENDED Provider B."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143017", study_area_code: "489017", licensed_state_codes: ["TX"], enrollment_cap: 50, status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { prov_a_id: $.data.id }
            - call: "POST /lifeline/providers"
              payload: { name: "Assurance Mobile", spin_id: "143018", study_area_code: "489018", licensed_state_codes: ["TX"], enrollment_cap: 50, status: "SUSPENDED" }
              as: ProgramAdministrator
              captures: { prov_b_id: $.data.id }
            - call: "POST /lifeline/providers"
              payload: { name: "Q Link Wireless", spin_id: "143019", study_area_code: "489019", licensed_state_codes: ["TX"], enrollment_cap: 50, status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { prov_c_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", unit_designator: "Apt 4B", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { addr1_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr1_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000, qualifying_benefit: "NONE", tribal_lands_flag: false }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub1_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-P1" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { chk1_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk1_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub1_id}", provider_id: "${prov_a_id}", eligibility_check_id: "${chk1_id}", certified_address_id: "${addr1_id}", service_type: "VOICE", one_per_household_attested: true }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { enr1_id: $.data.id }
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: ProgramAdministrator
            - call: "GET /lifeline/enrollments/${enr1_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { enr1_ver_1: $.data.version, freeze_until: $.data.port_freeze_until }
            - call: "POST /lifeline/service-transfers"
              payload: { enrollment_id: "${enr1_id}", target_provider_id: "${prov_b_id}", subscriber_consent_ref: "CONSENT-1", expected_enrollment_version: "${enr1_ver_1}" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /lifeline/service-transfers/${t1_id}/accept"
              payload: { acceptance_note: "welcome aboard" }
              as: ProviderAgent
              as_user_id: "${prov_b_id}"
              captures: { blocked_err: $.data.error_id }
            - call: "GET /lifeline/enrollments/${enr1_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { enr1_ver_2: $.data.version }
            - call: "POST /lifeline/service-transfers"
              payload: { enrollment_id: "${enr1_id}", target_provider_id: "${prov_c_id}", subscriber_consent_ref: "CONSENT-2", expected_enrollment_version: "${enr1_ver_2}" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /lifeline/service-transfers/${t2_id}/accept"
              payload: { acceptance_note: "port accepted" }
              as: ProviderAgent
              as_user_id: "${prov_c_id}"
          assert:
            - "${freeze_until} == 2026-09-30T00:00:00Z"
            - "the first trigger call returns HTTP 409 and ${blocked_err} == ERR_PROVIDER_NOT_ACTIVE"
            - "ServiceTransfer.${t1_id}.status == SUPERSEDED"
            - "ServiceTransfer.${t1_id}.target_provider_id == ${prov_b_id}"
            - "ServiceTransfer.${t1_id}.port_freeze_until_snapshot == 2026-09-30T00:00:00Z"
            - "ServiceTransfer.${t2_id}.status == ACCEPTED_COMPLETED"
            - "ServiceTransfer.${t2_id}.source_provider_id == ${prov_a_id}"
            - "ServiceTransfer.${t2_id}.target_provider_id == ${prov_c_id}"
            - "ServiceTransfer.${t2_id}.completed_at == 2026-09-30T00:00:00Z"
            - "Enrollment.${enr1_id}.provider_id == ${prov_c_id}"
            - "Enrollment.${enr1_id}.transfer_count == 1"
            - "Enrollment.${enr1_id}.port_freeze_until == 2026-09-30T00:00:00Z"
            - "Enrollment.${enr1_id}.benefit_start_date == 2026-08-01T00:00:00Z"
            - "Enrollment.${enr1_id}.usage_status == PENDING_FIRST_USE"
            - "Enrollment.${enr1_id}.audit_risk_score == 15"
            - "Provider.${prov_a_id}.active_enrollment_count == 0"
            - "Provider.${prov_c_id}.active_enrollment_count == 1"
            - "Provider.${prov_b_id}.active_enrollment_count == 0"
            - "Provider.${prov_b_id}.status == SUSPENDED"

  # =========================================================================
  # RULE 8 - resource_temporal_overlap
  # Two overlap rules with DIFFERENT INTERVAL SEMANTICS on different resources:
  #   8A -> HouseholdAddress benefit slot: HALF-OPEN [start, end), adjacency ALLOWED,
  #         aggregate capacity max_permitted_benefit_slots;
  #   8B -> Device/handset per subscriber: CLOSED AT BOTH ENDS with a 30-day
  #         re-issue BUFFER on top of the 365-day term, adjacency FORBIDDEN.
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: household_benefit_slot_half_open_interval_admits_adjacent_start
        grounds:
          - calculations.household_benefit_occupancy
          - validations[priority=62]
          - entities.HouseholdAddress.fields.max_permitted_benefit_slots
          - entities.Enrollment.fields.benefit_end_date
        distinguishing_aspect: |
          The household benefit slot is a HALF-OPEN interval [benefit_start_date,
          benefit_end_date) so ADJACENCY IS ALLOWED: with a closed-off prior benefit
          spanning [2026-05-01, 2026-09-01) a new benefit starting at exactly
          2026-09-01T00:00:00Z is ACCEPTED, while one starting a single millisecond earlier
          at 2026-08-31T23:59:59.999Z overlaps and is rejected with
          ERR_ONE_PER_HOUSEHOLD_VIOLATION.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "Provider licensed in TX with enrollment_cap 50."
            - "Address A1 alone in its cohort, max_permitted_benefit_slots 1."
            - "Subscriber S1 enrolled at A1 with benefit_start_date backdated to 2026-05-01, then de-enrolled at exactly 2026-09-01T00:00:00Z so benefit_end_date is 2026-09-01T00:00:00Z."
            - "Subscriber S2, also at A1, VERIFIED_ELIGIBLE on a check confirmed 2026-08-01 that expires 2026-10-30."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143020", study_area_code: "489020", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_a_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", unit_designator: "Apt 4B", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { addr1_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr1_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000, qualifying_benefit: "NONE", tribal_lands_flag: false }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub1_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-Q1" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { chk1_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk1_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub1_id}", provider_id: "${prov_a_id}", eligibility_check_id: "${chk1_id}", certified_address_id: "${addr1_id}", service_type: "VOICE", one_per_household_attested: true, benefit_start_date: "2026-05-01T00:00:00Z" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { enr1_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Beto Ruiz", date_of_birth: "1958-12-19", last4_ssn: "2290", address_id: "${addr1_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000, qualifying_benefit: "NONE", tribal_lands_flag: false }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { sub2_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub2_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-Q2" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { chk2_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk2_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/enrollments/${enr1_id}/de-enroll"
              payload: { de_enrollment_reason: "SUBSCRIBER_REQUEST", note: "household split" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
          trigger:
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub2_id}", provider_id: "${prov_a_id}", eligibility_check_id: "${chk2_id}", certified_address_id: "${addr1_id}", service_type: "VOICE", one_per_household_attested: true, benefit_start_date: "2026-08-31T23:59:59.999Z" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { overlap_err: $.data.error_id }
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub2_id}", provider_id: "${prov_a_id}", eligibility_check_id: "${chk2_id}", certified_address_id: "${addr1_id}", service_type: "VOICE", one_per_household_attested: true, benefit_start_date: "2026-09-01T00:00:00Z" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
