        distinguishing_aspect: "Weights and the critical-overdue doubler are exact: HIGH overdue + LOW fresh = 7; adding one CRITICAL overdue recomputes to (7 + 8) * 2 = 30, not 15."
        test_recipe:
          setup:
            - "Clock 2026-06-01; contact C1; process P ACTIVE; three gaps: HIGH due 2026-05-20 (overdue), LOW due 2026-12-01 (fresh), CRITICAL due 2026-05-20 (overdue)"
          setup_api_calls:
            - call: "POST /resilience/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ResilienceAdmin
            - call: "POST /resilience/contacts"
              payload: { full_name: "Author Ann", email: "ann@x.com", role_title: "Author" }
              as: ResilienceAdmin
