      - name: posting_amounts_must_be_positive_and_reversals_must_match_exactly
        claim_type: violation_to_error
        grounds:
          - validations.priority_106_ERR_INVALID_POSTING_AMOUNT
          - endpoints.POST_/loans/{id}/payments
          - calculations.payment_waterfall_allocation
        distinguishing_aspect: |
          The rule has two independent legs on the same priority: any posting of 0 cents is
          refused (the >= 1 floor, which priority 10's ">= 0" integer check lets through), and a
          REVERSAL must carry the reversed posting's amount to the cent — 1999 against a
          2000-cent payment is refused, 2000 is accepted and restores the ledger.
        test_recipe:
          setup:
            - "PRIME Handset B loan originated 2026-08-01 with a single 2000-cent payment that partially satisfies installment 1 (1579 principal + 421 premium)."
          setup_api_calls:
            - call: "POST /device-models"
              payload: { sku: "MDL-B", display_name: "Handset B", retail_price_cents: 89900, monthly_protection_premium_cents: 999, trade_in_base_credit_cents: 45000, generation_year: 2026 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { m_b: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Kwame Boateng", email: "kwame.boateng@example.com", mobile_number: "+15550100047" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { cust: "$.data.id" }
            - call: "POST /credit-applications"
              payload: { customer_id: "${cust}", device_model_id: "${m_b}", requested_term_months: 24, declared_down_payment_cents: 0 }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { app: "$.data.id" }
            - call: "POST /credit-applications/${app}/decision"
              payload: { credit_score_band: "PRIME" }
              as: CreditUnderwriter
              as_user_id: "u-uw-1"
            - call: "POST /loans"
              payload: { credit_application_id: "${app}", down_payment_cents: 0, imei: "356938035643029" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { loan: "$.data.id" }
            - call: "POST /loans/${loan}/payments"
              payload: { posting_type: "PAYMENT", amount_cents: 2000 }
              as: Customer
              as_user_id: "${cust}"
              captures: { pay1: "$.data.id" }
          trigger:
            - call: "POST /loans/${loan}/payments"
              payload: { posting_type: "PAYMENT", amount_cents: 0 }
              as: Customer
              as_user_id: "${cust}"
              captures: { e_zero: "$.data.error_id" }
            - call: "POST /loans/${loan}/payments"
              payload: { posting_type: "REVERSAL", amount_cents: 1999, reverses_posting_id: "${pay1}" }
              as: CollectionsOfficer
              as_user_id: "u-coll-1"
              captures: { e_short: "$.data.error_id" }
            - call: "POST /loans/${loan}/payments"
              payload: { posting_type: "REVERSAL", amount_cents: 2000, reverses_posting_id: "${pay1}" }
              as: CollectionsOfficer
              as_user_id: "u-coll-1"
              captures: { rev: "$.data.id" }
          assert:
            - "PaymentPosting.${pay1}.allocated_principal_cents == 1579 and allocated_premium_cents == 421 and allocated_late_fee_cents == 0 and obligation_balance_after_cents == 111876"
            - "the 0-cent posting returns HTTP 422 with error_id ERR_INVALID_POSTING_AMOUNT"
            - "the 1999-cent reversal returns HTTP 422 with error_id ERR_INVALID_POSTING_AMOUNT and PaymentPosting.${pay1}.reversed_by_posting_id is still null"
            - "the 2000-cent reversal returns HTTP 201 with posting_type == REVERSAL, allocated_principal_cents == 0, allocated_premium_cents == 0, installments_satisfied_count == 0 and obligation_balance_after_cents == 113876"
            - "PaymentPosting.${pay1}.reversed_by_posting_id == ${rev}"
            - "installment 1 of ${loan} is back to status SCHEDULED with paid_principal_cents == 0 and paid_premium_cents == 0, and InstallmentLoan.${loan}.paid_installment_count == 0"
            - "GET /payment-postings?loan_id=${loan} returns total_count == 2 (the payment and its reversal are both retained)"

      - name: trade_in_declaration_is_once_only_and_the_window_closes_at_its_end
        claim_type: violation_to_error
        grounds:
          - validations.priority_55_ERR_UPGRADE_REQUEST_NOT_AWAITING_TRADE_IN
          - validations.priority_83_ERR_FULFILLMENT_WINDOW_ELAPSED
          - entities.UpgradeRequest.fields.fulfillment_window_end
        distinguishing_aspect: |
          A second declaration on the same upgrade request is refused because the request has
          already left ELIGIBILITY_PASSED (priority 55, which outranks the window rule), and the
          7-day fulfillment window is half-open on the right: at exactly
          fulfillment_window_end == 2027-07-04T00:00:00Z the receipt call is refused with
