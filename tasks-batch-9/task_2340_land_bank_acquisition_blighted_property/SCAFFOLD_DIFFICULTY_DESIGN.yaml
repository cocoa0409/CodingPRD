# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: county-land-bank-authority   (scenario 2340)
# All monetary literals below were computed by executing the §1.3 formulas.
# The logical clock starts at its mandatory default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: blight_intake_snapshot_vs_sweep_final_holding_divergence
        grounds:
          - calculations.blight_priority_score
          - entities.Property.fields.intake_blight_score
          - entities.Property.fields.current_blight_score
          - state_machines.Property.custody_status.PROSPECT_to_ACQUIRED
        distinguishing_aspect: |
          This instance exercises the two variants of blight_priority_score on the Property
          entity: INTAKE_PROVISIONAL is frozen at acquisition close with hold_pts fixed at 0,
          while SWEEP_FINAL adds min(12, 0.5 * whole 30-day months held) on every recompute, so
          after 184 days of holding the same parcel reads intake_blight_score 48.0 and
          current_blight_score 51.0 in the same response.
        test_recipe:
          setup:
            - "One ACTIVE GRANT funding source with restriction ANY, authorized 1000000 cents."
            - "One parcel, grade D, structure present, vacancy_months 24, 4 nuisance complaints, 2 open code violations, no adjacency edges."
            - "The parcel is acquired by donation at the default clock 2026-08-01T00:00:00Z, which stamps intake_blight_score once."
            - "The logical clock is then advanced to 2027-02-01T00:00:00Z (184 days held)."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Blight Elimination Grant", source_type: "GRANT", authorized_cents: 1000000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-100001", address: "12 Ash St", situs_ward: 3, lot_area_sqft: 6000, assessed_value_cents: 400000, structure_present: true, structure_condition_grade: "D", vacancy_months: 24 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
            - call: "POST /land-bank/properties/${p_id}/code-violation-report"
              payload: { open_code_violation_count: 2, nuisance_complaint_count: 4 }
              as: IntakeOfficer
              as_user_id: "intake-1"
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p_id}", funding_source_id: "${fs_id}", channel: "DONATION", offer_price_cents: 0, title_search_fee_cents: 50000, donor_name: "Ash Street Trust" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets/${pk_id}/board-approval"
              payload: { resolution_no: "R-2026-011" }
              as: BoardClerk
              as_user_id: "clerk-1"
            - call: "POST /land-bank/acquisition-packets/${pk_id}/close"
              payload: { deed_reference: "BK-4410-PG-77" }
              as: IntakeOfficer
              as_user_id: "intake-2"
            - call: "GET /land-bank/properties/${p_id}"
              payload: {}
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { intake_after_close: $.data.intake_blight_score }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: InventoryManager
              as_user_id: "inv-1"
          trigger:
            - call: "POST /land-bank/properties/${p_id}/code-violation-report"
              payload: { open_code_violation_count: 2, nuisance_complaint_count: 4 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { intake_score: $.data.intake_blight_score, sweep_score: $.data.current_blight_score }
          assert:
            - "Property.${p_id}.intake_blight_score == 48.0  # 30 grade D + 6.0 vacancy + 6.0 complaints + 6.0 violations, hold_pts 0"
            - "Property.${p_id}.current_blight_score == 51.0  # same terms + hold_pts min(12, 0.5 * 6 months) == 3.0"
            - "Property.${p_id}.current_blight_score - Property.${p_id}.intake_blight_score == 3.0"
            - "${intake_after_close} == 48.0 and Property.${p_id}.intake_blight_score == 48.0 after the trigger: the INTAKE_PROVISIONAL snapshot is never recomputed"
            - "Property.${p_id}.custody_status == ACQUIRED and Property.${p_id}.acquired_at == 2026-08-01T00:00:00Z"

      - name: tax_discharge_statutory_vs_negotiated_divergence
        grounds:
          - calculations.tax_discharge_and_abatement
          - entities.DevelopmentAgreement.fields.discharge_mode
          - entities.DevelopmentAgreement.fields.discharged_tax_cents
          - entities.DevelopmentAgreement.fields.abatement_annual_cents
          - state_machines.Property.custody_status.LISTED_to_CONVEYED
        distinguishing_aspect: |
          This instance exercises the two variants of tax_discharge_and_abatement on the
          DevelopmentAgreement entity (a different entity and a different calculation from the
          blight instance): from byte-identical parcel and offer inputs, STATUTORY discharges the
          whole frozen 2000000-cent pre-acquisition delinquency and abates against the projected
          improved value (annual 213000), while NEGOTIATED caps the discharge at 40% of the
          3600000-cent sale price (1440000) and abates against the assessed value (annual 56800).
        test_recipe:
          setup:
            - "One ACQUISITION_ONLY funding source, authorized 500000 cents, ACTIVE."
            - "Two identical parcels W and X: lot 9000 sqft, assessed 4000000 cents, grade C, structure present, each carrying a 2000000-cent delinquent balance posted before acquisition, so pre_acquisition_delinquency_cents is frozen at 2000000 on both."
            - "Both parcels acquired by donation, quiet-titled to CLEAR and LISTED."
            - "Two DEVELOPER applicants A and B, each with a BOARD_APPROVED DEVELOPER_RFP application at the quoted 3600000 cents."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Acquisition Revolving Line", source_type: "GENERAL_FUND", authorized_cents: 500000, restriction: "ACQUISITION_ONLY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-100010", address: "10 Birch Ave", situs_ward: 2, lot_area_sqft: 9000, assessed_value_cents: 4000000, structure_present: true, structure_condition_grade: "C", vacancy_months: 10 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pw_id: $.data.id }
            - call: "POST /land-bank/properties/${pw_id}/tax-roll-posting"
              payload: { delinquent_tax_balance_cents: 2000000, tax_year: 2025 }
              as: CountyTreasurer
              as_user_id: "treas-1"
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${pw_id}", funding_source_id: "${fs_id}", channel: "DONATION", offer_price_cents: 0, title_search_fee_cents: 20000, donor_name: "Birch Holdings" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pkw_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets/${pkw_id}/board-approval"
              payload: { resolution_no: "R-2026-021" }
              as: BoardClerk
              as_user_id: "clerk-1"
            - call: "POST /land-bank/acquisition-packets/${pkw_id}/close"
              payload: { deed_reference: "BK-4411-PG-01" }
              as: IntakeOfficer
              as_user_id: "intake-2"
            - call: "POST /land-bank/properties/${pw_id}/title-actions"
              payload: { action_type: "QUIET_TITLE_SUIT" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { taw_id: $.data.id }
            - call: "POST /land-bank/title-actions/${taw_id}/adjudicate"
              payload: { outcome: "CLEARED" }
              as: IntakeOfficer
              as_user_id: "intake-1"
            - call: "POST /land-bank/properties/${pw_id}/list"
              payload: {}
              as: DispositionOfficer
              as_user_id: "disp-1"
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-100011", address: "11 Birch Ave", situs_ward: 2, lot_area_sqft: 9000, assessed_value_cents: 4000000, structure_present: true, structure_condition_grade: "C", vacancy_months: 10 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { px_id: $.data.id }
            - call: "POST /land-bank/properties/${px_id}/tax-roll-posting"
              payload: { delinquent_tax_balance_cents: 2000000, tax_year: 2025 }
              as: CountyTreasurer
              as_user_id: "treas-1"
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${px_id}", funding_source_id: "${fs_id}", channel: "DONATION", offer_price_cents: 0, title_search_fee_cents: 20000, donor_name: "Birch Holdings" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pkx_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets/${pkx_id}/board-approval"
              payload: { resolution_no: "R-2026-022" }
              as: BoardClerk
              as_user_id: "clerk-1"
            - call: "POST /land-bank/acquisition-packets/${pkx_id}/close"
              payload: { deed_reference: "BK-4411-PG-02" }
              as: IntakeOfficer
              as_user_id: "intake-2"
            - call: "POST /land-bank/properties/${px_id}/title-actions"
              payload: { action_type: "QUIET_TITLE_SUIT" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { tax_id: $.data.id }
            - call: "POST /land-bank/title-actions/${tax_id}/adjudicate"
              payload: { outcome: "CLEARED" }
              as: IntakeOfficer
              as_user_id: "intake-1"
            - call: "POST /land-bank/properties/${px_id}/list"
              payload: {}
              as: DispositionOfficer
              as_user_id: "disp-1"
            - call: "POST /land-bank/applicants"
              payload: { legal_name: "Northline Development LLC", applicant_type: "DEVELOPER", contact_email: "a@northline.dev" }
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /land-bank/applicants"
              payload: { legal_name: "Southgate Builders Inc", applicant_type: "DEVELOPER", contact_email: "b@southgate.dev" }
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { appl_b_id: $.data.id }
            - call: "POST /land-bank/disposition-applications"
              payload: { property_id: "${pw_id}", applicant_id: "${appl_a_id}", program: "DEVELOPER_RFP", proposed_use: "Six-unit infill townhomes", offer_price_cents: 3600000 }
