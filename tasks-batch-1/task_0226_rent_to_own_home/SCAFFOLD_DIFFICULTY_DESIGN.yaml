              captures: { a_id: $.data.id }
            - call: "POST /agreements/${a_id}/activate"
              payload: { expected_property_version: "${p_ver}" }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /agreements/${a_id}/option-exercises"
              payload: { exercised_at: "2026-06-01T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { oe_id: $.data.id }
          trigger:
            - call: "POST /agreements/${a_id}/mortgage"
              payload: { option_exercise_id: "${oe_id}", annual_rate_bps: 0, term_months: 360 }
              as: EscrowAgent
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_CREDIT_SCORE_TOO_LOW"
            - "Agreement.${a_id}.status == EXERCISED (unchanged)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rto_property_single_active_agreement_occupancy
        grounds:
          - state_machines.Property.AVAILABLE_to_UNDER_AGREEMENT
          - state_machines.Agreement.DRAFT_to_ACTIVE
          - entities.Property.fields.status
          - validations[priority=8]
        distinguishing_aspect: |
          Interval semantics #1 — exclusive single-occupancy on the Property resource: a Property may
          host at most ONE ACTIVE agreement at a time (point-occupancy / mutual exclusion); activating
          a second agreement while the property is UNDER_AGREEMENT collides and is rejected.
        test_recipe:
          setup:
            - "Property P UNDER_AGREEMENT via activated A1; a second DRAFT agreement A2 on P."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "L15", email: "l15@x.com", payout_account_ref: "acct_l15" }
              as: Landlord
              captures: { l_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T15", email: "t15@x.com", credit_score: 700 }
              as: Tenant
              captures: { t_id: $.data.id }
            - call: "POST /properties"
              payload: { landlord_id: "${l_id}", address: "15 OneAtATime Ave", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_id: $.data.id, p_ver0: $.data.version }
            - call: "POST /agreements"
              payload: { property_id: "${p_id}", tenant_id: "${t_id}", locked_price_cents: 30000000, option_fee_cents: 500000, monthly_payment_cents: 200000, credit_pct: 0.30, lease_start: "2026-01-01T00:00:00Z", option_term_months: 24 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /agreements"
              payload: { property_id: "${p_id}", tenant_id: "${t_id}", locked_price_cents: 30000000, option_fee_cents: 500000, monthly_payment_cents: 200000, credit_pct: 0.30, lease_start: "2027-01-01T00:00:00Z", option_term_months: 24 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { a2_id: $.data.id }
            - call: "POST /agreements/${a1_id}/activate"
              payload: { expected_property_version: "${p_ver0}" }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "GET /properties/${p_id}"
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_ver1: $.data.version }
          trigger:
            - call: "POST /agreements/${a2_id}/activate"
              payload: { expected_property_version: "${p_ver1}" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_PROPERTY_NOT_AVAILABLE (OCC passes with the fresh Property.version; single-occupancy check fires)"

      - name: rto_rentpayment_period_index_collision
        grounds:
          - validations[priority=14]
          - entities.RentPayment.fields.period_index
          - errors[ERR_DUPLICATE_PERIOD]
        distinguishing_aspect: |
          Interval semantics #2 — discrete period-slot uniqueness on the RentPayment resource (a
          DIFFERENT resource entity, DIFFERENT geometry from Property single-occupancy): two non-
          superseded RentPayments cannot occupy the same (agreement_id, period_index) slot; the
          second collides with ERR_DUPLICATE_PERIOD.
        test_recipe:
          setup:
            - "Agreement A ACTIVE with a RentPayment at period_index=1; a second create reuses period_index=1."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "L16", email: "l16@x.com", payout_account_ref: "acct_l16" }
              as: Landlord
              captures: { l_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T16", email: "t16@x.com", credit_score: 700 }
              as: Tenant
              captures: { t_id: $.data.id }
            - call: "POST /properties"
              payload: { landlord_id: "${l_id}", address: "16 Slot St", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /agreements"
              payload: { property_id: "${p_id}", tenant_id: "${t_id}", locked_price_cents: 30000000, option_fee_cents: 500000, monthly_payment_cents: 200000, credit_pct: 0.30, lease_start: "2026-01-01T00:00:00Z", option_term_months: 24 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agreements/${a_id}/activate"
              payload: { expected_property_version: "${p_ver}" }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /agreements/${a_id}/rent-payments"
              payload: { period_index: 1, due_date: "2026-02-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { rp1_id: $.data.id }
          trigger:
            - call: "POST /agreements/${a_id}/rent-payments"
              payload: { period_index: 1, due_date: "2026-02-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_DUPLICATE_PERIOD"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ci_gross_accrual_create_then_forfeit_conserved
        grounds:
          - calculations.payment_split
          - calculations.rent_credit_accrual
          - state_machines.RentPayment.PENDING_to_FORFEITED
          - entities.Agreement.fields.gross_credit_accrued_cents
        distinguishing_aspect: |
          Conserved quantity #1 = Agreement.gross_credit_accrued_cents. Forward action (create
          RentPayment: gross += credit_portion) paired with its compensator (forfeit: gross -=
          credit_portion) MUST leave gross unchanged: gross_after_create_then_forfeit ==
          gross_before == 0. Invariant: gross == SUM(credit_portion over non-FORFEITED rows).
        test_recipe:
          setup:
            - "Agreement A ACTIVE with no payments (gross_credit_accrued_cents=0). Create one RentPayment (gross becomes 60000), then forfeit it."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "L17", email: "l17@x.com", payout_account_ref: "acct_l17" }
              as: Landlord
              captures: { l_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T17", email: "t17@x.com", credit_score: 700 }
              as: Tenant
              captures: { t_id: $.data.id }
            - call: "POST /properties"
              payload: { landlord_id: "${l_id}", address: "17 Conserve Ct", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /agreements"
              payload: { property_id: "${p_id}", tenant_id: "${t_id}", locked_price_cents: 30000000, option_fee_cents: 500000, monthly_payment_cents: 200000, credit_pct: 0.30, lease_start: "2026-01-01T00:00:00Z", option_term_months: 24 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agreements/${a_id}/activate"
              payload: { expected_property_version: "${p_ver}" }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /agreements/${a_id}/rent-payments"
              payload: { period_index: 1, due_date: "2026-02-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { rp1_id: $.data.id }
          trigger:
            - call: "POST /rent-payments/${rp1_id}/forfeit"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
            - call: "GET /agreements/${a_id}"
              as: Landlord
              as_user_id: "${l_id}"
              captures: { gross: $.data.gross_credit_accrued_cents }
          assert:
            - "Agreement.${a_id}.gross_credit_accrued_cents == 0 (60000 added on create, 60000 removed on forfeit; net drift 0)"

      - name: ci_maintenance_cost_fully_allocated_conserved
        grounds:
          - calculations.maintenance_cost_split
          - state_machines.MaintenanceTicket.APPROVED_to_RESOLVED
          - entities.MaintenanceTicket.fields.tenant_share_cents
          - entities.MaintenanceTicket.fields.landlord_share_cents
        distinguishing_aspect: |
          Conserved quantity #2 = total repair cost (DIFFERENT conserved quantity than rent credit):
          tenant_share_cents + landlord_share_cents MUST exactly equal actual_cost_cents after
          resolve — the split allocates the whole cost with zero drift: 50000 + 70000 == 120000.
        test_recipe:
          setup:
            - "Agreement A ACTIVE; MaintenanceTicket M approved then resolved with actual_cost_cents=120000 (threshold 50000)."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "L18", email: "l18@x.com", payout_account_ref: "acct_l18" }
              as: Landlord
              captures: { l_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T18", email: "t18@x.com", credit_score: 700 }
              as: Tenant
              captures: { t_id: $.data.id }
            - call: "POST /properties"
              payload: { landlord_id: "${l_id}", address: "18 Allocate Aly", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /agreements"
              payload: { property_id: "${p_id}", tenant_id: "${t_id}", locked_price_cents: 30000000, option_fee_cents: 500000, monthly_payment_cents: 200000, credit_pct: 0.30, maintenance_threshold_cents: 50000, lease_start: "2026-01-01T00:00:00Z", option_term_months: 24 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agreements/${a_id}/activate"
              payload: { expected_property_version: "${p_ver}" }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /agreements/${a_id}/maintenance-tickets"
              payload: { summary: "Roof", estimated_cost_cents: 80000 }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { m_id: $.data.id }
            - call: "POST /maintenance-tickets/${m_id}/approve"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
          trigger:
            - call: "POST /maintenance-tickets/${m_id}/resolve"
              payload: { actual_cost_cents: 120000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { tshare: $.data.tenant_share_cents, lshare: $.data.landlord_share_cents }
          assert:
            - "MaintenanceTicket.${m_id}.tenant_share_cents == 50000"
            - "MaintenanceTicket.${m_id}.landlord_share_cents == 70000"
            - "tenant_share_cents + landlord_share_cents == 120000 (== actual_cost_cents; no drift)"
