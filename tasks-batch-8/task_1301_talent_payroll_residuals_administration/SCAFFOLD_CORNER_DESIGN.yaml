          assert:
            - "Page 1: exactly 1 row, total_count == 2, has_more == true"
            - "Page 2 (offset 1): exactly 1 row, total_count == 2, has_more == false"
            - "Every response envelope carries meta.api_request_id and meta.api_request_timestamp; error responses carry data.error_id and data.message"
      - name: timecard_list_filter_by_engagement_isolates_children
        claim_type: listing
        grounds:
          - "endpoints"
          - "entities.Timecard.fields.engagement_id"
        distinguishing_aspect: "Filtered-list FK reverse reachability: GET /timecards?engagement_id=X returns only X's cards; a second engagement with no cards returns an empty array (not an error)."
        test_recipe:
          setup: ["standard fixture; engagement E1 ACTIVE with one timecard; engagement E2 (performer 2) exists in DRAFT with none"]
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - *c_tca
            - call: "POST /payroll/performers"
              payload: { legal_name: "Jordan Star", primary_union_code: "SAG_AFTRA", tax_residency_state: "CA" }
              as: PayrollAdmin
              captures: { perf2: $.data.id }
            - call: "POST /payroll/engagements"
              payload: { production_id: "${prod}", union_agreement_id: "${agr}", performer_id: "${perf2}", tier_code: "T2", payee_type: "DIRECT", weekly_guarantee_cents: 300000, guaranteed_days: 10, start_date: "2026-08-03", end_date: "2026-09-11" }
              as: ProductionAccountant
              captures: { eng2: $.data.id }
          trigger:
            - call: "GET /payroll/timecards"
              payload: { engagement_id: "${eng}" }
              as: PayrollClerk
            - call: "GET /payroll/timecards"
              payload: { engagement_id: "${eng2}" }
              as: PayrollClerk
          assert:
            - "Filter engagement_id=${eng}: total_count == 1 (only TC-A)"
            - "Filter engagement_id=${eng2}: total_count == 0, has_more == false, empty data array (HTTP 200, not an error)"

