          setup:
            - "Award 5,000,000,000 signed 2026-09-01; fund with 325,000,000 equity + 175,000,000 leverage; QEI 500,000,000 (400bps reserve tier, fees 20,000,000, net 480,000,000) issued 2026-09-01."
            - "A single QLICI of 100,000,000 cents, so direct tracing is 100,000,000/480,000,000 = 20.83 — far below 85.00, guaranteeing a FAIL at every annual test."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertifyingAgency
