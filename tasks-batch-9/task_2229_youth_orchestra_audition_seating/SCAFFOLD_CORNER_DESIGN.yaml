# 1.9 Scaffold Corner Design (breadth probe)
# Walks references/claim-extraction-guide.md row-by-row against SCAFFOLD.yaml
# 1.1-1.7. Every numeric assert was computed by executing the referenced
# 1.3 formula against the pinned fixture inputs. Logical clock starts at
# 2026-08-01T00:00:00Z. `excluded_because:` stubs cite instances that exist
# by name in SCAFFOLD_DIFFICULTY_DESIGN.yaml.

scaffold_corner_design:

  # =========================================================================
  # Table 1 (Entities) - one instance per applicable claim-type row.
  # `parent_relationships` is skipped: all 13 entities declare `parent: null`
  # (flat topology), so no entity has a URL-nested parent to validate.
  - section: entities
    instances:
      - name: season_creation_returns_planning_state_and_derived_counters
        claim_type: creation
        grounds:
          - entities.Season
          - entities.Season.fields.aid_available_cents
          - entities.Season.fields.ensemble_count
          - endpoints[POST /seasons]
        distinguishing_aspect: |
          The Season create response must carry every declared field in one shot: the
          system-defaulted status PLANNING, the two aid ledger halves seeded to
          aid_committed_cents 0 / aid_available_cents 100000 (== aid_budget_cents), both
          ensemble counters at 0 and version 1 - no follow-up read is needed.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
          trigger:
            - call: "POST /seasons"
              payload: { name: "2026-2027 Season", year_label: "2026-27", audition_window_start: "2026-08-10T09:00:00Z", audition_window_end: "2026-08-20T18:00:00Z", tuition_base_cents: 123223, tuition_due_at: "2026-12-01T00:00:00Z", aid_budget_cents: 100000 }
              as: ArtisticDirector
              captures: { season_id: "$.data.id" }
          assert:
            - "trigger[0] -> 201"
            - "data.name == \"2026-2027 Season\" and data.year_label == \"2026-27\""
            - "data.status == \"PLANNING\""
            - "data.tuition_base_cents == 123223 and data.aid_budget_cents == 100000"
            - "data.aid_committed_cents == 0 and data.aid_available_cents == 100000"
            - "data.ensemble_count == 0 and data.seated_ensemble_count == 0"
            - "data.version == 1 and data.id is a non-empty string"
            - "data.created_at and data.updated_at are both present ISO-8601 UTC strings"

      - name: season_retrieval_returns_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - entities.Season
          - endpoints[GET /seasons/{seasonId}]
        distinguishing_aspect: |
          GET /seasons/{seasonId} returns the same row the create call minted: same id,
          same input echo, status still PLANNING and version still 1 - a read performs no
          mutation, so version does not advance.
        test_recipe:
          setup:
            - "One Season created at clock 2026-08-05T09:00:00Z, still in PLANNING with no ensembles."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
            - call: "POST /seasons"
              payload: { name: "2026-2027 Season", year_label: "2026-27", audition_window_start: "2026-08-10T09:00:00Z", audition_window_end: "2026-08-20T18:00:00Z", tuition_base_cents: 123223, tuition_due_at: "2026-12-01T00:00:00Z", aid_budget_cents: 100000 }
              as: ArtisticDirector
              captures: { season_id: "$.data.id" }
          trigger:
            - call: "GET /seasons/${season_id}"
              as: RegistrarStaff
          assert:
            - "trigger[0] -> 200"
            - "data.id == ${season_id}"
            - "data.name == \"2026-2027 Season\" and data.tuition_due_at == \"2026-12-01T00:00:00Z\""
            - "data.audition_window_start == \"2026-08-10T09:00:00Z\""
            - "data.audition_window_end == \"2026-08-20T18:00:00Z\""
            - "data.status == \"PLANNING\" and data.version == 1"
            - "data.aid_available_cents == 100000"

      - name: panelist_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Panelist
          - endpoints[GET /panelists]
          - validations[priority=7]
        distinguishing_aspect: |
          With exactly three Panelist rows, limit=2/offset=0 returns 2 rows with
          meta.total_count 3 and meta.has_more true, while limit=2/offset=2 returns the
          remaining 1 row with meta.has_more false - the four declared pagination fields
          are all present and consistent.
        test_recipe:
          setup:
            - "Three Panelist rows exist: Panel One, Panel Two, Panel Three (all VIOLIN)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
            - call: "POST /panelists"
              payload: { display_name: "Panel One", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p1_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel Two", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p2_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel Three", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p3_id: "$.data.id" }
          trigger:
            - call: "GET /panelists"
              payload: { limit: 2, offset: 0 }
              as: RegistrarStaff
            - call: "GET /panelists"
              payload: { limit: 2, offset: 2 }
              as: RegistrarStaff
            - call: "GET /panelists"
              as: RegistrarStaff
          assert:
            - "trigger[0] -> 200 with len(data) == 2"
            - "trigger[0] meta.total_count == 3, meta.has_more == true, meta.limit == 2, meta.offset == 0"
            - "trigger[1] -> 200 with len(data) == 1"
            - "trigger[1] meta.total_count == 3, meta.has_more == false, meta.limit == 2, meta.offset == 2"
            - "trigger[2] -> 200 with len(data) == 3 and meta.limit == 10 and meta.offset == 0 (declared defaults)"
            - "every returned row has panel_role == \"ADJUDICATOR\", conflict_member_ids == [] and available_for_panels == true"

      - name: member_and_placement_reads_with_unknown_id_return_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_MEMBER_NOT_FOUND]
          - errors[ERR_PLACEMENT_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: |
          A syntactically valid but unknown path id resolves to that resource family's
          own NOT_FOUND error at validation priority 4 - ERR_MEMBER_NOT_FOUND for
          /members/{memberId} and ERR_PLACEMENT_NOT_FOUND for /placements/{placementId} -
          never a generic 404 or a 500.
        test_recipe:
          setup:
            - "Empty database apart from the logical-clock call; no Member and no Placement exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000999"
              as: RegistrarStaff
              captures: { err1: "$.data.error_id" }
            - call: "GET /placements/00000000-0000-4000-8000-000000000999"
              as: ArtisticDirector
              captures: { err2: "$.data.error_id" }
          assert:
            - "trigger[0] -> 404 with data.error_id == \"ERR_MEMBER_NOT_FOUND\""
            - "trigger[1] -> 404 with data.error_id == \"ERR_PLACEMENT_NOT_FOUND\""
            - "both responses carry response_type == \"error\" and a non-empty data.message"

      - name: ensemble_and_quota_creation_missing_required_fields_rejected
        claim_type: required_fields
        grounds:
          - entities.Ensemble.fields.tier
          - entities.SectionQuota.fields.max_count
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Every §1.5 `input:` entry without a trailing `?` is mandatory: omitting
          Ensemble.tier and omitting SectionQuota.max_count each produce
          ERR_INVALID_REQUEST (400) at priority 5, and no row is persisted.
        test_recipe:
          setup:
            - "One Season in PLANNING; one Ensemble exists so the quota call has a resolvable FK."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
            - call: "POST /seasons"
              payload: { name: "2026-2027 Season", year_label: "2026-27", audition_window_start: "2026-08-10T09:00:00Z", audition_window_end: "2026-08-20T18:00:00Z", tuition_base_cents: 123223, tuition_due_at: "2026-12-01T00:00:00Z", aid_budget_cents: 100000 }
              as: ArtisticDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /ensembles"
              payload: { season_id: "${season_id}", name: "Philharmonic", tier: "PHILHARMONIC", min_total_size: 1, max_total_size: 4, rehearsal_weekday: "SAT" }
              as: ArtisticDirector
              captures: { ens_id: "$.data.id" }
          trigger:
            - call: "POST /ensembles"
              payload: { season_id: "${season_id}", name: "No Tier", min_total_size: 1, max_total_size: 4, rehearsal_weekday: "SAT" }
              as: ArtisticDirector
              captures: { err1: "$.data.error_id" }
            - call: "POST /section-quotas"
              payload: { ensemble_id: "${ens_id}", instrument: "VIOLIN", min_count: 1, target_count: 1 }
              as: ArtisticDirector
              captures: { err2: "$.data.error_id" }
            - call: "GET /ensembles?season_id=${season_id}"
              as: ArtisticDirector
          assert:
            - "trigger[0] -> 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "trigger[1] -> 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "trigger[2] -> 200 with meta.total_count == 1 (the rejected ensemble was not persisted)"
            - "Season.${season_id}.ensemble_count == 1 and Season.${season_id}.version == 2"

      - name: omitted_optional_inputs_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.SectionQuota.fields.principal_required
          - entities.SectionQuota.fields.rotation_policy
          - entities.Member.fields.years_in_org
          - entities.Member.fields.sibling_enrolled
          - entities.AuditionSlot.fields.quorum_required
          - entities.AuditionSlot.fields.capacity
        distinguishing_aspect: |
          Omitting every `?`-marked input yields exactly the §1.1 defaults:
          SectionQuota principal_required true / rotation_policy ROTATING, Member
          years_in_org 0 / sibling_enrolled false / alumni_engagement_opt_in false, and
          AuditionSlot required_excerpt_codes [] / quorum_required 3 / capacity 1.
        test_recipe:
          setup:
            - "Season in AUDITIONS_OPEN (it owns one ensemble with one VIOLIN quota, so the"
            - "advance-status precondition at priority 46 is satisfied)."
            - "Three available VIOLIN panelists exist for the slot's default quorum of 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
            - call: "POST /seasons"
              payload: { name: "2026-2027 Season", year_label: "2026-27", audition_window_start: "2026-08-10T09:00:00Z", audition_window_end: "2026-08-20T18:00:00Z", tuition_base_cents: 123223, tuition_due_at: "2026-12-01T00:00:00Z", aid_budget_cents: 100000 }
              as: ArtisticDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /ensembles"
              payload: { season_id: "${season_id}", name: "Philharmonic", tier: "PHILHARMONIC", min_total_size: 1, max_total_size: 4, rehearsal_weekday: "SAT" }
              as: ArtisticDirector
              captures: { ens_id: "$.data.id" }
            - call: "POST /section-quotas"
              payload: { ensemble_id: "${ens_id}", instrument: "VIOLIN", min_count: 1, target_count: 1, max_count: 2 }
              as: ArtisticDirector
              captures: { q_violin_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel One", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p1_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel Two", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p2_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel Three", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p3_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/advance-status"
              payload: { to_status: "AUDITIONS_OPEN" }
              as: ArtisticDirector
          trigger:
            - call: "POST /section-quotas"
              payload: { ensemble_id: "${ens_id}", instrument: "CELLO", min_count: 1, target_count: 2, max_count: 3 }
              as: ArtisticDirector
              captures: { q_cello_id: "$.data.id" }
            - call: "POST /members"
              payload: { legal_name: "Default Dana", primary_instrument: "CELLO", grade_level: 9, graduation_year: 2029, household_income_band: "BAND_C" }
              as: RegistrarStaff
              captures: { m1_id: "$.data.id" }
            - call: "POST /audition-slots"
              payload: { season_id: "${season_id}", room_code: "R7", start_at: "2026-08-12T14:00:00Z", end_at: "2026-08-12T15:00:00Z", panelist_ids: ["${p1_id}", "${p2_id}", "${p3_id}"], instrument_focus: "CELLO" }
              as: RegistrarStaff
              captures: { slot_id: "$.data.id" }
          assert:
            - "trigger[0] -> 201 with data.principal_required == true and data.rotation_policy == \"ROTATING\""
            - "trigger[0] data.filled_count == 0, data.rotation_cycle_index == 0, data.balance_state == \"UNDERFILLED\""
            - "trigger[1] -> 201 with data.years_in_org == 0, data.sibling_enrolled == false, data.alumni_engagement_opt_in == false"
            - "trigger[1] data.enrollment_status == \"PROSPECT\", data.standing_status == \"CLEAR\", data.probation_baseline_count == 0"
            - "trigger[2] -> 201 with data.required_excerpt_codes == [], data.quorum_required == 3, data.capacity == 1"
            - "trigger[2] data.booked_count == 0 and data.status == \"OPEN\""

      - name: member_instrument_class_computed_from_primary_instrument
        claim_type: computed_fields
        grounds:
          - entities.Member.fields.instrument_class
          - entities.Member.fields.effective_unexcused_count
        distinguishing_aspect: |
          instrument_class is never supplied by the caller (it is not in POST /members
          `input:`): BASS derives STRING, FLUTE derives WIND and PERCUSSION derives
          PERCUSSION, and the three attendance counters all derive 0 on a fresh row.
        test_recipe:
          setup:
            - "Empty database; only the logical clock has been set."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
          trigger:
            - call: "POST /members"
              payload: { legal_name: "Bass Bo", primary_instrument: "BASS", grade_level: 11, graduation_year: 2027, household_income_band: "BAND_A", years_in_org: 3 }
              as: RegistrarStaff
              captures: { m_bass_id: "$.data.id" }
            - call: "POST /members"
              payload: { legal_name: "Flute Fay", primary_instrument: "FLUTE", grade_level: 8, graduation_year: 2030, household_income_band: "BAND_B" }
              as: RegistrarStaff
              captures: { m_flute_id: "$.data.id" }
            - call: "POST /members"
              payload: { legal_name: "Perc Pia", primary_instrument: "PERCUSSION", grade_level: 12, graduation_year: 2026, household_income_band: "BAND_C" }
              as: RegistrarStaff
              captures: { m_perc_id: "$.data.id" }
          assert:
            - "trigger[0] -> 201 with data.instrument_class == \"STRING\""
            - "trigger[1] -> 201 with data.instrument_class == \"WIND\""
            - "trigger[2] -> 201 with data.instrument_class == \"PERCUSSION\""
            - "all three rows have unexcused_absence_count == 0, tardy_count == 0, effective_unexcused_count == 0"
            - "all three rows have version == 1"

      - name: audition_system_fields_stamped_at_registration
        claim_type: system_fields
        grounds:
          - entities.Audition.fields.blind_code
          - entities.Audition.fields.status
          - entities.Audition.fields.slot_id
          - state_machines.Audition
        distinguishing_aspect: |
          The Audition create response is fully system-stamped: status REQUESTED (the
          declared initial_state), revision_round 0, slot_id null, both composite variants
          and tier_recommendation null, submitted_score_count 0, and a server-minted
          blind_code carrying the member's instrument - none of which appears in the
          POST /auditions `input:` list.
        test_recipe:
          setup:
            - "One Season in PLANNING (POST /auditions is admitted in PLANNING and AUDITIONS_OPEN)."
            - "One VIOLIN member registered as a PROSPECT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
            - call: "POST /seasons"
              payload: { name: "2026-2027 Season", year_label: "2026-27", audition_window_start: "2026-08-10T09:00:00Z", audition_window_end: "2026-08-20T18:00:00Z", tuition_base_cents: 123223, tuition_due_at: "2026-12-01T00:00:00Z", aid_budget_cents: 100000 }
              as: ArtisticDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /members"
              payload: { legal_name: "Ada Strings", primary_instrument: "VIOLIN", grade_level: 10, graduation_year: 2028, household_income_band: "BAND_B", years_in_org: 1 }
              as: RegistrarStaff
              captures: { m1_id: "$.data.id" }
          trigger:
            - call: "POST /auditions"
              payload: { member_id: "${m1_id}", season_id: "${season_id}", declared_program: "Bruch Concerto mvt I", excerpt_ids: ["EX1"], scale_attested: true }
              as: Guardian
              as_user_id: "${m1_id}"
              captures: { a1_id: "$.data.id" }
          assert:
            - "trigger[0] -> 201"
            - "data.status == \"REQUESTED\" and data.revision_round == 0 and data.slot_id == null"
            - "data.submitted_score_count == 0"
            - "data.composite_provisional_score == null and data.composite_final_score == null"
            - "data.tier_recommendation == null"
            - "data.blind_code is a non-empty string beginning with \"VIOLIN-\" and never contains \"Ada Strings\""
            - "data.scale_attested == true and data.excerpt_ids == [\"EX1\"]"
            - "data.version == 1 and data.member_id == ${m1_id}"

      - name: out_of_range_enum_and_interval_inputs_rejected
        claim_type: type_constraints
        grounds:
          - entities.Member.fields.grade_level
          - entities.Member.fields.primary_instrument
          - entities.EnsembleEvent.fields.end_at
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Priority 5 rejects three distinct shape failures with the same
          ERR_INVALID_REQUEST: grade_level 13 outside the declared 4..12 range, an
          undeclared primary_instrument enum member, and an EnsembleEvent whose end_at
          equals its start_at (the interval must be strictly positive).
        test_recipe:
          setup:
            - "One Season in PLANNING owning one Ensemble, so the event call has a resolvable FK."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
            - call: "POST /seasons"
              payload: { name: "2026-2027 Season", year_label: "2026-27", audition_window_start: "2026-08-10T09:00:00Z", audition_window_end: "2026-08-20T18:00:00Z", tuition_base_cents: 123223, tuition_due_at: "2026-12-01T00:00:00Z", aid_budget_cents: 100000 }
              as: ArtisticDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /ensembles"
              payload: { season_id: "${season_id}", name: "Philharmonic", tier: "PHILHARMONIC", min_total_size: 1, max_total_size: 4, rehearsal_weekday: "SAT" }
              as: ArtisticDirector
              captures: { ens_id: "$.data.id" }
          trigger:
            - call: "POST /members"
              payload: { legal_name: "Too Senior", primary_instrument: "VIOLIN", grade_level: 13, graduation_year: 2028, household_income_band: "BAND_B" }
              as: RegistrarStaff
              captures: { err1: "$.data.error_id" }
            - call: "POST /members"
              payload: { legal_name: "Bad Enum", primary_instrument: "GUITAR", grade_level: 10, graduation_year: 2028, household_income_band: "BAND_B" }
              as: RegistrarStaff
              captures: { err2: "$.data.error_id" }
            - call: "POST /ensemble-events"
              payload: { ensemble_id: "${ens_id}", kind: "REHEARSAL", start_at: "2026-09-05T18:00:00Z", end_at: "2026-09-05T18:00:00Z", venue_code: "HALL-A" }
              as: ArtisticDirector
              captures: { err3: "$.data.error_id" }
            - call: "GET /members"
              as: RegistrarStaff
          assert:
            - "trigger[0] -> 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "trigger[1] -> 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "trigger[2] -> 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "trigger[3] -> 200 with meta.total_count == 0 (no Member row survived a rejected create)"

      - name: panel_score_row_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.PanelScore
          - calculations.panelist_weighted_total
          - endpoints[GET /panel-scores/{scoreId}]
        distinguishing_aspect: |
          PanelScore declares `common_fields: false`: §1.5 exposes only POST (create)
          and the two GETs for it - no PUT, PATCH or DELETE - and the returned row carries
          no `version` field, so a submitted rubric sheet can never be amended, only
          superseded by a new revision round.
        test_recipe:
          setup:
            - "Season in AUDITIONS_OPEN with a 3-panelist VIOLIN slot (quorum 3, capacity 4)."
            - "One VIOLIN member whose audition is SCHEDULED into that slot; no PanelScore rows yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
            - call: "POST /seasons"
              payload: { name: "2026-2027 Season", year_label: "2026-27", audition_window_start: "2026-08-10T09:00:00Z", audition_window_end: "2026-08-20T18:00:00Z", tuition_base_cents: 123223, tuition_due_at: "2026-12-01T00:00:00Z", aid_budget_cents: 100000 }
              as: ArtisticDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /ensembles"
              payload: { season_id: "${season_id}", name: "Philharmonic", tier: "PHILHARMONIC", min_total_size: 1, max_total_size: 4, rehearsal_weekday: "SAT" }
              as: ArtisticDirector
              captures: { ens_id: "$.data.id" }
            - call: "POST /section-quotas"
              payload: { ensemble_id: "${ens_id}", instrument: "VIOLIN", min_count: 1, target_count: 1, max_count: 2 }
              as: ArtisticDirector
              captures: { q_violin_id: "$.data.id" }
            - call: "POST /members"
              payload: { legal_name: "Base Case", primary_instrument: "VIOLIN", grade_level: 10, graduation_year: 2028, household_income_band: "BAND_B", years_in_org: 1 }
              as: RegistrarStaff
              captures: { m1_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel 1", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
