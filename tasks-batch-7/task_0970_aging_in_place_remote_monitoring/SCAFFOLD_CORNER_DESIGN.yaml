            - { call: "POST /v1/wellness-reports", payload: { senior_id: "${s_dup}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-02T00:00:00Z", mode: "FINAL" }, as: PlatformAdmin }
          trigger:
