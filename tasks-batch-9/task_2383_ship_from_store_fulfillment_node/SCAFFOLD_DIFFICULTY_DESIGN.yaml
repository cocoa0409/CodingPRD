            - "accepting a2 at 13:30 succeeds with HTTP 200: a1's interval [09:05, 13:00) does not intersect [13:30, 16:00), so the load is 18.00 of cap 30 and not 36.00"
            - "accepting a3 at 13:35 succeeds with HTTP 200 at a load of exactly 30.00 because a2's interval [13:30, 16:00) does intersect [13:35, 16:00)"
            - "accepting a4 at 13:40 returns HTTP 422 with ${err_over} == ERR_LABOR_WINDOW_OVERSUBSCRIBED because a2 and a3 both overlap and the load would be 39.00"
            - "FulfillmentAssignment.${a1}.status == ACCEPTED"
            - "FulfillmentAssignment.${a1}.pick_deadline_utc == 2026-08-03T13:00:00Z"
            - "FulfillmentAssignment.${a1}.accepted_at == 2026-08-03T09:05:00Z"
            - "FulfillmentAssignment.${a2}.status == ACCEPTED"
            - "FulfillmentAssignment.${a2}.pick_deadline_utc == 2026-08-03T16:00:00Z"
            - "FulfillmentAssignment.${a2}.accepted_at == 2026-08-03T13:30:00Z"
            - "FulfillmentAssignment.${a2}.labor_minutes_reserved == 18.00"
            - "FulfillmentAssignment.${a3}.status == ACCEPTED"
            - "FulfillmentAssignment.${a3}.labor_minutes_reserved == 12.00"
            - "FulfillmentAssignment.${a4}.status == ASSIGNED"
            - "FulfillmentAssignment.${a4}.accepted_at == null"
            - "FulfillmentAssignment.${a4}.labor_minutes_reserved == 9.00"
            - "Store.${s4}.reserved_labor_minutes == 57.00"
            - "Store.${s4}.units_committed_epoch == 11"
            - "Store.${s4}.eligibility_score == 25.99"
            - "StoreInventory.${inv1}.reserved_units == 11"
            - "StoreInventory.${inv1}.available_to_promise_units == 7"

  - rule_id: compensating_invariant
    instances:
      - name: inventory_reservation_round_trip_restores_available_to_promise
        grounds:
          - calculations.reserved_units_reconciliation
          - calculations.store_available_to_promise
          - validations.ERR_INVENTORY_BELOW_RESERVED
          - validations.ERR_SAFETY_STOCK_EXCEEDS_ON_HAND
        distinguishing_aspect: |
          Conserved quantity 1 = promise-able units at a node
          (on_hand == available_to_promise + reserved + safety): a routing commit and its
          compensating reject must return available_to_promise_units to the exact pre-action
          value, an adjustment that would strand already-promised units is refused outright,
          and only a safety raise past on_hand - reserved may suspend the identity through the
          max(0, ...) clamp.
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; two nodes, S1 (origin zone 4) and S3 (origin zone 2), each with an OPEN window at epoch 1."
            - "SKU-A is stocked at S1 with on_hand 12 / safety 2 (available_to_promise 10, so 12 == 10 + 0 + 2) and at S3 with on_hand 5 / safety 2 (available_to_promise 3, so 5 == 3 + 0 + 2)."
            - "Order O1 has a single line of SKU-A x2 to destination zone 4, GROUND, and has not been routed."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S3-SUBURB", region_code: "WEST", origin_zone: 2, daily_unit_capacity: 200, staffed_labor_minutes: 600, labor_standard_minutes_per_order: 10, pick_labor_minutes_per_unit: 2, labor_rate_cents_per_minute: 20, cutoff_utc_minutes: 960, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s3: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s1}", sku_id: "${sku_a}", on_hand_units: 12, safety_stock_units: 2 }
              as: NetworkPlanner
              captures: { inv_s1: "$.data.id" }
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s3}", sku_id: "${sku_a}", on_hand_units: 5, safety_stock_units: 2 }
              as: NetworkPlanner
              captures: { inv_s3: "$.data.id" }
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-7001", customer_ref: "C-51", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-03T15:00:00Z" }
              as: CustomerCare
              captures: { o1: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_a}", quantity: 2, unit_price_cents: 4500 }
              as: CustomerCare
              captures: { ol1: "$.data.id" }
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v: "$.data.version" }
          trigger:
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o1_v}" }
              as: NetworkPlanner
            - call: "GET /fulfillment-network/assignments"
              payload: { order_id: "${o1}", store_id: "${s3}" }
              as: NetworkPlanner
              captures: { a1: "$.data[0].id" }
            - call: "GET /fulfillment-network/store-inventories/${inv_s3}"
              payload: {}
              as: NetworkPlanner
              captures: { inv_s3_v1: "$.data.version" }
            - call: "POST /fulfillment-network/store-inventories/${inv_s3}/adjustments"
              payload: { expected_inventory_version: "${inv_s3_v1}", counted_on_hand_units: 1, reason: "SHRINK", safety_stock_units: 0 }
              as: NetworkPlanner
              captures: { err_below: "$.data.error_id" }
            - call: "POST /fulfillment-network/assignments/${a1}/reject"
              payload: { reject_reason_code: "NO_STOCK_ON_FLOOR" }
              as: StoreAssociate
              as_user_id: "${s3}"
            - call: "GET /fulfillment-network/assignments"
              payload: { order_id: "${o1}", store_id: "${s1}" }
              as: NetworkPlanner
              captures: { a2: "$.data[0].id" }
            - call: "GET /fulfillment-network/store-inventories/${inv_s3}"
              payload: {}
              as: NetworkPlanner
              captures: { inv_s3_v2: "$.data.version" }
            - call: "POST /fulfillment-network/store-inventories/${inv_s3}/adjustments"
              payload: { expected_inventory_version: "${inv_s3_v2}", counted_on_hand_units: 5, reason: "MARKDOWN_PULL", safety_stock_units: 4 }
              as: NetworkPlanner
            - call: "GET /fulfillment-network/store-inventories/${inv_s1}"
              payload: {}
              as: NetworkPlanner
              captures: { inv_s1_v1: "$.data.version" }
            - call: "POST /fulfillment-network/store-inventories/${inv_s1}/adjustments"
              payload: { expected_inventory_version: "${inv_s1_v1}", counted_on_hand_units: 12, reason: "MARKDOWN_PULL", safety_stock_units: 11 }
              as: NetworkPlanner
          assert:
            - "the COMMIT run selects S3 (routing_score 85.66 against S1's 82.58, both at coverage_ratio 1.0000) and creates ${a1} with assigned_units 2 and provisional_cost_cents 985"
            - "immediately after the commit StoreInventory.${inv_s3} satisfies 5 == 1 + 2 + 2: reserved_units 2, available_to_promise_units 1, safety_stock_units 2"
            - "CustomerOrder.${o1}.provisional_cost_cents == 1044 and cost_index_bps == 4995 right after the commit"
            - "the adjustment counting S3 down to 1 unit returns HTTP 422 with ${err_below} == ERR_INVENTORY_BELOW_RESERVED, because counted_on_hand_units 1 < reserved_units 2 would strand a promised unit"
            - "the refused adjustment leaves StoreInventory.${inv_s3} untouched: on_hand_units 5, reserved_units 2, safety_stock_units 2, available_to_promise_units 1, last_adjustment_reason null, and version still ${inv_s3_v1}"
            - "after the reject StoreInventory.${inv_s3} is back to the exact pre-commit decomposition 5 == 3 + 0 + 2: reserved_units 0 and available_to_promise_units 3"
            - "FulfillmentAssignment.${a1}.status == REJECTED"
            - "FulfillmentAssignment.${a1}.reject_reason_code == NO_STOCK_ON_FLOOR"
            - "Store.${s3}.units_committed_epoch == 0"
            - "Store.${s3}.reserved_labor_minutes == 0.00"
            - "Store.${s3}.eligibility_score == 88.00"
            - "the reroute moves the reservation to S1: FulfillmentAssignment.${a2}.store_id == ${s1}, status ASSIGNED, assigned_units 2, provisional_cost_cents 1336, reroute_generation 1"
            - "StoreInventory.${inv_s1} then satisfies 12 == 8 + 2 + 2: reserved_units 2, available_to_promise_units 8"
            - "Store.${s1}.reserved_labor_minutes == 18.00 and Store.${s1}.eligibility_score == 70.48"
            - "CustomerOrder.${o1}.provisional_cost_cents == 1512 and cost_index_bps == 7234 after the reroute (1426 pre-fee including the 90-cent reroute overhead)"
            - "the S3 adjustment to counted 5 / safety 4 succeeds with HTTP 200 and restores the identity at the new buffer: 5 == 1 + 0 + 4, last_adjustment_reason MARKDOWN_PULL"
            - "the S1 adjustment to counted 12 / safety 11 succeeds with HTTP 200 (safety 11 <= on_hand 12 and counted 12 >= reserved 2) and clamps available_to_promise_units to 0"
            - "StoreInventory.${inv_s1}.available_to_promise_units == 0 while on_hand_units 12, reserved_units 2 and safety_stock_units 11 sum to 13, so the identity is suspended exactly where on_hand - reserved - safety < 0"
            - "no unit was created or destroyed: across both rows reserved_units totals 2 before the reject and 2 after it, only the owning node changed"

      - name: labor_minute_reservations_release_the_full_standard_on_ship_and_cancel
        grounds:
          - calculations.reserved_labor_minutes_reconciliation
          - calculations.assignment_labor_standard
          - endpoints.POST /fulfillment-network/assignments/{assignment_id}/pick
        distinguishing_aspect: |
          Conserved quantity 2 = node labour minutes
          (Store.reserved_labor_minutes == the sum of labor_minutes_reserved over the five
          non-terminal statuses): a short pick must NOT re-price the reserved standard down to
