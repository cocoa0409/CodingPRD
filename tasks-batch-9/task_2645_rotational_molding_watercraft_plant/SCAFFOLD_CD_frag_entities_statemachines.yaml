            - "ProductionOrder POR-SM-TRM (ordered_qty 2) is released, takes CYC-ABORT with a RESERVED 24.000 kg charge, and that cycle is aborted from SCHEDULED — so the cycle reaches ABORTED without ever locking the mould."
