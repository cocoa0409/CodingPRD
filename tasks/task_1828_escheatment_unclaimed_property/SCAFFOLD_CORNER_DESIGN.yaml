      - name: retention_purge_boundary
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_RETENTION_PERIOD_NOT_ELAPSED]"
          - "state_machines.DocumentRecord.REGISTERED_to_PURGED"
        distinguishing_aspect: "Purge is allowed exactly ON retention_until (closed boundary); one day earlier is rejected with 409."
        test_recipe:
          setup: ["REPORT_FILE record created at 2026-08-01 (retention_until 2036-08-01)."]
          setup_api_calls:
            - { call: "POST /escheatment/document-records", payload: { artifact_type: "REPORT_FILE", related_entity_type: "HolderReport", related_entity_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { doc1: $.data.id } }
          trigger:
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2036-07-31T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/document-records/${doc1}/purge", as: HolderAdmin, as_user_id: "ha-1", captures: { err_id: $.data.error_id } }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2036-08-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/document-records/${doc1}/purge", as: HolderAdmin, as_user_id: "ha-1", captures: { d_st: $.data.status } }
            - { call: "POST /escheatment/document-records/${doc1}/purge", as: HolderAdmin, as_user_id: "ha-1", captures: { err2: $.data.error_id } }
          assert:
            - "Purge at 2036-07-31 -> ERR_RETENTION_PERIOD_NOT_ELAPSED (409)"
            - "Purge at 2036-08-01 (exactly retention_until) -> 200, status PURGED, purged_at set"
            - "Second purge -> ERR_DOCUMENT_ALREADY_PURGED (409)"

