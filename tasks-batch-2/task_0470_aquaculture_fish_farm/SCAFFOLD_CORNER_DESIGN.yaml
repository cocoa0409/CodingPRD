  # =========================================================================
  # Calculations — correctness, constants, precision, variant selection
  # =========================================================================
  - section: calculations
    instances:
      - name: classify_reading_warning_band
        claim_type: Constants Applied
        grounds: ["calculations.classify_reading", "entities.WaterQualityReading.fields.severity"]
        distinguishing_aspect: "A reading DO 5.5 (< DO_WARNING 6.0) classifies severity WARNING and drives Tank.posture RESTRICTED."
        test_recipe:
          setup: ["Tank T1 OPEN."]
          setup_api_calls:
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /tanks/${t1}/water-quality-readings"
              payload: { measured_at: "2026-01-02T00:00:00Z", dissolved_oxygen_mg_l: 5.5, ammonia_mg_l: 0.1, water_temp_c: 10.0 }
              as: FarmTechnician
              captures: { sev: $.data.severity }
          assert:
            - "data.severity == WARNING; subsequent GET /tanks/${t1} shows posture RESTRICTED."

      - name: ammonia_critical_threshold_strict_greater
        claim_type: Correct Result
        grounds: ["calculations.classify_reading"]
        distinguishing_aspect: "Ammonia exactly 1.0 (NH3_CRITICAL) is NOT critical (strict >): 1.0 > 1.0 is false, so a reading with DO 8.0, ammonia 1.0 classifies WARNING (1.0 > 0.5)."
        test_recipe:
          setup: ["Tank T1 OPEN."]
          setup_api_calls:
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /tanks/${t1}/water-quality-readings"
              payload: { measured_at: "2026-01-02T00:00:00Z", dissolved_oxygen_mg_l: 8.0, ammonia_mg_l: 1.0, water_temp_c: 10.0 }
              as: FarmTechnician
              captures: { sev: $.data.severity }
          assert:
            - "data.severity == WARNING (ammonia 1.0 is not > 1.0; it is > 0.5)."

      - name: compute_treatment_window_precision
        claim_type: Correct Result
        grounds: ["calculations.compute_treatment_window", "entities.HealthTreatment.fields.withdrawal_end_at"]
        distinguishing_aspect: "Treatment started 2026-02-01 duration 5 withdrawal 10 yields treatment_end_at 2026-02-06 and withdrawal_end_at 2026-02-16."
        test_recipe:
          setup: ["Tank + Cohort exist; clock default."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 100, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: FarmManager
          trigger:
            - call: "POST /health-treatments"
              payload: { cohort_id: "${c1}", tank_id: "${t1}", medication: "oxytet", started_at: "2026-02-01T00:00:00Z", duration_days: 5, withdrawal_days: 10 }
              as: Veterinarian
              captures: { tx: $.data.id }
          assert:
            - "data.treatment_end_at == 2026-02-06T00:00:00Z; data.withdrawal_end_at == 2026-02-16T00:00:00Z."

      - name: provisional_fcr_selected_at_summary
        claim_type: Variant Selection
        grounds: ["calculations.compute_fcr"]
        excluded_because:
          difficulty_instance: dual_variant_calc / fcr_provisional_vs_final_diverges_on_cohort
          rationale: "Provisional-vs-final variant selection and divergence are the core of the named §1.8 FCR instance."

      - name: estimated_yield_constant_applied
        claim_type: Constants Applied
        grounds: ["calculations.estimate_processing_yield"]
        excluded_because:
          difficulty_instance: dual_variant_calc / processing_yield_estimate_vs_actual_diverges_on_batch
          rationale: "default_processing_yield_pct application to estimated_yield_kg is asserted in the named §1.8 instance."

