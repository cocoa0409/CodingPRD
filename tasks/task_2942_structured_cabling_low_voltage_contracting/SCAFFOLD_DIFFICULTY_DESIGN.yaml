  - rule_id: resource_temporal_overlap
    instances:

      - name: rack_unit_intervals_are_closed_with_unit_capacity_one
        grounds:
          - calculations.rack_ru_ledger
          - validations[priority=165]
          - entities.RackUnitAssignment.fields.start_ru
          - entities.RackUnitAssignment.fields.end_ru
        distinguishing_aspect: |
          Spatial interval geometry: CLOSED inclusive integer intervals [start_ru, end_ru], no
          buffer, and capacity 1 per rack unit. A candidate [4,6] against an ACTIVE [1,4] shares
          exactly one endpoint unit and is refused with 409 ERR_RACK_RU_CONFLICT, while [5,8] is
          admitted with a zero gap because the neighbouring endpoints touch without sharing a
          unit. This is a different geometry from
          room_change_windows_are_half_open_with_a_thirty_minute_buffer (half-open time
          intervals, buffered, aggregate capacity 2).
        test_recipe:
          setup:
            - "Project RVT1 with telecom room TR01 (ups_capacity_va 3000) and rack A of total_ru 42"
            - "RackUnitAssignment 'Core switch' occupies the closed interval [1,4] with power_va 1200 and assignment_state ACTIVE"
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
            - call: "POST /cabling/racks"
              payload: { telecom_room_id: "${room}", rack_code: "A", total_ru: 42 }
              as: DesignEngineer
              captures: { rack: $.data.id, rack_v1: $.data.version }
            - call: "POST /cabling/rack-unit-assignments"
              payload: { rack_id: "${rack}", equipment_label: "Core switch", start_ru: 1, end_ru: 4, power_va: 1200, expected_rack_version: "${rack_v1}" }
              as: DesignEngineer
              captures: { asg1: $.data.id }
            - call: "GET /cabling/racks/${rack}"
              payload: {}
              as: DesignEngineer
              captures: { rack_v2: $.data.version }
          trigger:
            - call: "POST /cabling/rack-unit-assignments"
              payload: { rack_id: "${rack}", equipment_label: "Patch panel P1", start_ru: 4, end_ru: 6, power_va: 0, expected_rack_version: "${rack_v2}" }
              as: DesignEngineer
              captures: { err: $.data.error_id }
            - call: "POST /cabling/rack-unit-assignments"
              payload: { rack_id: "${rack}", equipment_label: "Patch panel P1", start_ru: 5, end_ru: 8, power_va: 300, expected_rack_version: "${rack_v2}" }
              as: DesignEngineer
              captures: { asg2: $.data.id }
          assert:
            - "GET /cabling/racks/${rack} before the trigger returns occupied_ru == 4, available_ru == 38 and power_draw_va == 1200"
            - "the [4,6] attempt returns 409 with error_id == \"ERR_RACK_RU_CONFLICT\" because rack unit 4 is already ACTIVE"
            - "the [5,8] attempt returns 201 with span_ru == 4 and assignment_state == \"ACTIVE\""
            - "GET /cabling/racks/${rack} after the trigger returns occupied_ru == 8, available_ru == 34 and power_draw_va == 1500"
            - "GET /cabling/telecom-rooms/${room} after the trigger returns power_load_va == 1500 and power_headroom_va == 1500"
            - "GET /cabling/rack-unit-assignments returns total_count == 2 when filtered by rack_id ${rack}, so the refused interval persisted nothing"

      - name: room_change_windows_are_half_open_with_a_thirty_minute_buffer
        grounds:
          - calculations.mac_window_occupancy_check
          - validations[priority=170]
          - entities.MacTicket.fields.scheduled_window_start
          - entities.MacTicket.fields.scheduled_window_end
        distinguishing_aspect: |
          Temporal interval geometry: HALF-OPEN [start, end) instants, a 30-minute changeover
          buffer added to BOTH ends of the candidate only, and AGGREGATE capacity 2 per telecom
          room. An exact 30-minute gap is admitted (T.end > effective_start is false at
          equality), a second overlapping window is admitted, and only the third is refused with
          409 ERR_ROOM_WINDOW_CONFLICT. Contrast rack_unit_intervals_are_closed_with_unit_capacity_one,
          where the intervals are closed integers with capacity 1 and no buffer.
        test_recipe:
          setup:
            - "Project RVT1 with mac_budget_cents 500000, occupancy_status OCCUPIED and one CERTIFIED link in room TR01"
            - "Ticket W0 is SCHEDULED for 2026-08-14T09:00:00Z..10:00:00Z with labor_hours_estimate 1.0"
            - "Tickets W1, W2 and W3 are SUBMITTED, each with labor_hours_estimate 1.0 and expedite_requested false"
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1", mac_budget_cents: 500000 }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
            - call: "POST /cabling/telecom-rooms/${room}/grounding-verification"
              payload: { tgb_installed: true, bonding_conductor_awg: 6, ground_resistance_milliohms: 5000 }
              as: ProjectManager
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6A", jacket_rating: "CMP", outer_diameter_mm: 7.9, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 150, applications: ["DATA_HORIZONTAL"] }
              as: DesignEngineer
