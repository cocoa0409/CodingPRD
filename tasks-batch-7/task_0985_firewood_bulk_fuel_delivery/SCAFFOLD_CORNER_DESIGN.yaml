scaffold_corner_design:
  # ==========================================================================
  # Section: entities
  # ==========================================================================
  - section: entities
    instances:
      - name: customer_creation_required_fields_and_defaults
        claim_type: creation
        grounds: ["entities.Customer"]
        distinguishing_aspect: "Customer POST with all required fields returns 201; system fields initialized (credit_balance_cents=0, loyalty_tier=STANDARD, account_status=ACTIVE); id is UUID without prefix."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "POST /api/v1/customers"
              payload: { full_name: "New Cust", email: "new@x.com", phone: "9", street_address: "9 Oak", postal_code: "01010" }
              as: CustomerService
              captures: { cid: $.data.id, tier: $.data.loyalty_tier, status: $.data.account_status, credit: $.data.credit_balance_cents, lifetime: $.data.lifetime_cord_equivalent_delivered }
          assert:
            - "HTTP 201"
            - "Customer.${cid}.loyalty_tier == 'STANDARD'"
            - "Customer.${cid}.account_status == 'ACTIVE'"
            - "Customer.${cid}.credit_balance_cents == 0"
            - "Customer.${cid}.lifetime_cord_equivalent_delivered == 0"

      - name: customer_creation_missing_required_field_returns_validation
        claim_type: required_fields
        grounds: ["entities.Customer", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /customers missing email returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "POST /api/v1/customers"
              payload: { full_name: "NoEmail", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_VALIDATION"

      - name: customer_get_not_found_returns_404
        claim_type: not_found
        grounds: ["entities.Customer", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /customers/{nonexistent-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "GET /api/v1/customers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_NOT_FOUND"

      - name: order_line_quantity_granularity_pellet_bag_integer
        claim_type: type_constraints
        grounds: ["entities.OrderLine.fields.quantity", "validations[priority=11]", "errors[ERR_INVALID_QUANTITY]"]
        distinguishing_aspect: "PELLET_BAG quantity must be positive integer; quantity=1.5 rejected."
        test_recipe:
          setup:
            - "Customer CU exists; Product PB: PELLET_BAG/HARDWOOD_BLEND/KILN_DRIED base 700, moisture 10, qty 1000"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu PB", email: "pb@x.com", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_pb_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "PB1", product_kind: "PELLET_BAG", species: "HARDWOOD_BLEND", seasoned_grade: "KILN_DRIED", base_price_cents: 700, moisture_ceiling_pct: 10.0, available_qty: 1000 }
              as: OperationsManager
              captures: { pb_id: $.data.id }
          trigger:
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu_pb_id}", delivery_street_address: "1 St", delivery_postal_code: "01010", requested_delivery_date: "2026-08-15", lines: [{ product_id: "${pb_id}", quantity: 1.5 }] }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_INVALID_QUANTITY (PELLET_BAG requires integer quantity)"

      - name: order_line_quantity_granularity_half_cord_half_step
        claim_type: type_constraints
        grounds: ["entities.OrderLine.fields.quantity", "validations[priority=11]"]
        distinguishing_aspect: "CORD quantity must be multiple of 0.5; 1.3 rejected; 1.5 accepted."
        test_recipe:
          setup: ["Customer + Product CORD"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu HC", email: "hc@x.com", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_hc_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "HC1", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 100 }
              as: OperationsManager
              captures: { hc_id: $.data.id }
          trigger:
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu_hc_id}", delivery_street_address: "1 St", delivery_postal_code: "01010", requested_delivery_date: "2026-08-15", lines: [{ product_id: "${hc_id}", quantity: 1.3 }] }
              as: CustomerService
              captures: { err: $.data.error_id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu_hc_id}", delivery_street_address: "1 St", delivery_postal_code: "01010", requested_delivery_date: "2026-08-15", lines: [{ product_id: "${hc_id}", quantity: 1.5 }] }
              as: CustomerService
              captures: { o_hc_ok: $.data.id }
          assert:
            - "quantity=1.3 rejected with ERR_INVALID_QUANTITY"
            - "quantity=1.5 accepted (multiple of 0.5)"

      - name: pellet_product_must_use_blend_species
        claim_type: type_constraints
        grounds: ["entities.Product.fields.species", "validations[priority=12]", "errors[ERR_INVALID_PRODUCT_SPEC]"]
        distinguishing_aspect: "PELLET_TON with species=OAK rejected; must use HARDWOOD_BLEND or SOFTWOOD_BLEND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "POST /api/v1/products"
              payload: { sku: "PBAD", product_kind: "PELLET_TON", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 25000, moisture_ceiling_pct: 10.0, available_qty: 100 }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_INVALID_PRODUCT_SPEC"

      - name: product_computed_reserved_qty_ignores_input
        claim_type: computed_fields
        grounds: ["entities.Product.fields.reserved_qty"]
        distinguishing_aspect: "Client-supplied reserved_qty in POST /products is ignored; system initializes to 0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "POST /api/v1/products"
              payload: { sku: "PC", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 10 }
              as: OperationsManager
              captures: { p_id: $.data.id, p_reserved: $.data.reserved_qty }
          assert:
            - "Product.${p_id}.reserved_qty == 0 (system-computed; input would be ignored even if supplied)"

  # ==========================================================================
  # Section: state_machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: order_initial_state_is_draft_and_unpaid
        claim_type: initial_state
        grounds: ["state_machines.Order"]
        distinguishing_aspect: "Newly created Order has fulfillment_status=DRAFT and payment_status=UNPAID."
        test_recipe:
          setup: ["Customer + Product"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu IS", email: "is@x.com", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_is_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "PIS", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 10 }
              as: OperationsManager
              captures: { p_is_id: $.data.id }
          trigger:
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu_is_id}", delivery_street_address: "1 St", delivery_postal_code: "01010", requested_delivery_date: "2026-08-15", lines: [{ product_id: "${p_is_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { o_is: $.data }
          assert:
            - "Order.fulfillment_status == 'DRAFT'"
            - "Order.payment_status == 'UNPAID'"

      - name: order_deliver_from_confirmed_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Order", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DELIVER is only valid from OUT_FOR_DELIVERY. Calling deliver on a CONFIRMED order returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Order O submitted and PAID -> CONFIRMED (not yet dispatched)"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu IT", email: "it@x.com", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_it_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "PIT", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 10 }
              as: OperationsManager
              captures: { p_it_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu_it_id}", delivery_street_address: "1 St", delivery_postal_code: "01010", requested_delivery_date: "2026-08-15", lines: [{ product_id: "${p_it_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { o_it_id: $.data.id }
            - call: "POST /api/v1/orders/${o_it_id}/submit"
              payload: {}
              as: CustomerService
            - call: "POST /api/v1/orders/${o_it_id}/payments"
              payload: { event_kind: "CAPTURE", amount_cents: 53500, external_ref: "cap-it" }
              as: CustomerService
          trigger:
            - call: "POST /api/v1/orders/${o_it_id}/deliver"
              payload: {}
              as: Driver
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE (cannot deliver from CONFIRMED)"

      - name: terminal_state_lockdown_delivered_order_cannot_be_cancelled
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Order", "errors[ERR_NOT_CANCELLABLE]"]
        distinguishing_aspect: "DELIVERED is terminal; cancel returns 409 ERR_NOT_CANCELLABLE."
        test_recipe:
          setup: ["Order fully delivered"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu TL", email: "tl@x.com", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_tl_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "PTL", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 10 }
              as: OperationsManager
              captures: { p_tl_id: $.data.id }
            - call: "POST /api/v1/delivery-routes"
              payload: { route_code: "RTL", depot_name: "C", service_postal_prefixes: ["0"], capacity_cord_equivalent: 50.0 }
              as: RoutePlanner
              captures: { r_tl_id: $.data.id }
            - call: "POST /api/v1/delivery-windows"
              payload: { route_id: "${r_tl_id}", service_date: "2026-08-15", start_hour: 8, end_hour: 18, capacity_cord_equivalent: 50.0 }
              as: RoutePlanner
              captures: { w_tl_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu_tl_id}", delivery_street_address: "1 St", delivery_postal_code: "01010", requested_delivery_date: "2026-08-15", lines: [{ product_id: "${p_tl_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { o_tl_id: $.data.id }
            - call: "POST /api/v1/orders/${o_tl_id}/submit"
              payload: {}
              as: CustomerService
            - call: "POST /api/v1/orders/${o_tl_id}/payments"
              payload: { event_kind: "CAPTURE", amount_cents: 53500, external_ref: "cap-tl" }
              as: CustomerService
            - call: "GET /api/v1/orders/${o_tl_id}"
              payload: {}
              as: RoutePlanner
              captures: { o_tl_v: $.data.version }
            - call: "POST /api/v1/orders/${o_tl_id}/schedule"
              payload: { delivery_window_id: "${w_tl_id}", expected_order_version: "${o_tl_v}" }
              as: RoutePlanner
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T10:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/delivery-windows/${w_tl_id}/lock"
              payload: {}
              as: RoutePlanner
            - call: "POST /api/v1/orders/${o_tl_id}/dispatch"
              payload: {}
              as: Driver
            - call: "GET /api/v1/orders/${o_tl_id}/lines"
              payload: {}
              as: Driver
              captures: { o_tl_line: "$.data[0].id" }
            - call: "POST /api/v1/order-lines/${o_tl_line}/moisture-readings"
              payload: { moisture_pct: 18.0 }
              as: Driver
            - call: "POST /api/v1/orders/${o_tl_id}/deliver"
              payload: {}
              as: Driver
          trigger:
            - call: "POST /api/v1/orders/${o_tl_id}/cancel"
              payload: { reason: "too late" }
              as: Customer
              as_user_id: "${cu_tl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_NOT_CANCELLABLE"

      - name: subscription_pending_to_cancelled_no_credit_movement
        claim_type: valid_transition
        grounds: ["state_machines.Subscription.PENDING_to_CANCELLED"]
        distinguishing_aspect: "Cancelling a PENDING subscription never credits prepaid_cents to customer (credit only moves on activation)."
        test_recipe:
          setup: ["Customer CU_PC, Subscription S_PC PENDING with prepaid_cents=5000"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu PC", email: "pc@x.com", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_pc_id: $.data.id, cu_pc_v0: $.data.version }
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${cu_pc_id}", tier: "HEARTH", season_year: 2026, commitment_cord_equivalent: 2.0, prepaid_cents: 5000, discount_pct: 0.05, expected_customer_version: "${cu_pc_v0}" }
              as: CustomerService
              captures: { s_pc_id: $.data.id }
          trigger:
            - call: "POST /api/v1/subscriptions/${s_pc_id}/cancel"
              payload: { reason: "changed mind" }
              as: CustomerService
            - call: "GET /api/v1/customers/${cu_pc_id}"
              payload: {}
              as: CustomerService
              captures: { cu_pc_final: $.data }
          assert:
            - "Subscription.${s_pc_id}.status == 'CANCELLED'"
            - "Customer.${cu_pc_id}.credit_balance_cents == 0 (prepaid_cents never credited — subscription was never activated)"

      - name: dispatch_requires_window_locked_and_time_in_window
        claim_type: precondition_enforcement
        grounds: ["state_machines.Order.SCHEDULED_to_OUT_FOR_DELIVERY"]
        distinguishing_aspect: "Dispatch fails if current logical hour is outside [start_hour, end_hour) even when window is LOCKED and date matches."
        test_recipe:
          setup: ["Order O_DP SCHEDULED into W_DP (8-12), window LOCKED, clock at 14:00 (outside window hours)"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu DP", email: "dp@x.com", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_dp_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "PDP", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 10 }
              as: OperationsManager
              captures: { p_dp_id: $.data.id }
            - call: "POST /api/v1/delivery-routes"
              payload: { route_code: "RDP", depot_name: "C", service_postal_prefixes: ["0"], capacity_cord_equivalent: 50.0 }
              as: RoutePlanner
              captures: { r_dp_id: $.data.id }
            - call: "POST /api/v1/delivery-windows"
              payload: { route_id: "${r_dp_id}", service_date: "2026-08-15", start_hour: 8, end_hour: 12, capacity_cord_equivalent: 50.0 }
              as: RoutePlanner
              captures: { w_dp_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu_dp_id}", delivery_street_address: "1 St", delivery_postal_code: "01010", requested_delivery_date: "2026-08-15", lines: [{ product_id: "${p_dp_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { o_dp_id: $.data.id }
            - call: "POST /api/v1/orders/${o_dp_id}/submit"
              payload: {}
              as: CustomerService
            - call: "POST /api/v1/orders/${o_dp_id}/payments"
              payload: { event_kind: "CAPTURE", amount_cents: 53500, external_ref: "cap-dp" }
              as: CustomerService
            - call: "GET /api/v1/orders/${o_dp_id}"
              payload: {}
              as: RoutePlanner
              captures: { o_dp_v: $.data.version }
            - call: "POST /api/v1/orders/${o_dp_id}/schedule"
              payload: { delivery_window_id: "${w_dp_id}", expected_order_version: "${o_dp_v}" }
              as: RoutePlanner
            - call: "POST /api/v1/delivery-windows/${w_dp_id}/lock"
              payload: {}
              as: RoutePlanner
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T14:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "POST /api/v1/orders/${o_dp_id}/dispatch"
              payload: {}
              as: Driver
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE (current hour 14 outside [8,12))"

  # ==========================================================================
  # Section: calculations
  # ==========================================================================
  - section: calculations
    instances:
      - name: seasoned_grade_price_multiplier_applied_correctly
        claim_type: correct_result
        grounds: ["calculations.seasoned_grade_price_multiplier"]
        distinguishing_aspect: "GREEN grade unit_price = base × 0.75; KILN_DRIED = base × 1.35; SEMI_SEASONED = base × 1.00. Computed unit_price overrides any client-supplied value."
        test_recipe:
          setup: ["Products for each grade with same base 40000"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/products"
              payload: { sku: "PG", product_kind: "CORD", species: "OAK", seasoned_grade: "GREEN", base_price_cents: 40000, moisture_ceiling_pct: 60.0, available_qty: 10 }
              as: OperationsManager
              captures: { p_green: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "PS", product_kind: "CORD", species: "OAK", seasoned_grade: "SEMI_SEASONED", base_price_cents: 40000, moisture_ceiling_pct: 25.0, available_qty: 10 }
              as: OperationsManager
              captures: { p_semi: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "PK", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 10 }
              as: OperationsManager
              captures: { p_kiln: $.data.id }
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu GR", email: "gr@x.com", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_gr_id: $.data.id }
          trigger:
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu_gr_id}", delivery_street_address: "1 St", delivery_postal_code: "01010", requested_delivery_date: "2026-08-15", lines: [{ product_id: "${p_green}", quantity: 1.0 }, { product_id: "${p_semi}", quantity: 1.0 }, { product_id: "${p_kiln}", quantity: 1.0 }] }
              as: CustomerService
              captures: { o_gr_id: $.data.id }
            - call: "GET /api/v1/orders/${o_gr_id}/lines"
              payload: {}
              as: CustomerService
              captures: { lines: $.data }
          assert:
            - "Line for GREEN product: unit_price_cents == 30000 (40000 * 0.75)"
            - "Line for SEMI_SEASONED: unit_price_cents == 40000"
            - "Line for KILN_DRIED: unit_price_cents == 54000 (40000 * 1.35)"

      - name: cord_equivalent_conversion_per_kind
        claim_type: correct_result
        grounds: ["calculations.cord_equivalent_conversion"]
        distinguishing_aspect: "CORD=1.0, HALF_CORD=0.5, PELLET_TON=0.8, PELLET_BAG=0.016 cord-equivalent per unit."
        test_recipe:
          setup: ["One product per kind"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/products"
              payload: { sku: "CE_C", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 100 }
              as: OperationsManager
              captures: { ce_c: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "CE_H", product_kind: "HALF_CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 22000, moisture_ceiling_pct: 20.0, available_qty: 100 }
              as: OperationsManager
              captures: { ce_h: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "CE_T", product_kind: "PELLET_TON", species: "HARDWOOD_BLEND", seasoned_grade: "KILN_DRIED", base_price_cents: 30000, moisture_ceiling_pct: 10.0, available_qty: 100 }
              as: OperationsManager
              captures: { ce_t: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "CE_B", product_kind: "PELLET_BAG", species: "HARDWOOD_BLEND", seasoned_grade: "KILN_DRIED", base_price_cents: 700, moisture_ceiling_pct: 10.0, available_qty: 1000 }
              as: OperationsManager
              captures: { ce_b: $.data.id }
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu CE", email: "ce@x.com", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_ce_id: $.data.id }
          trigger:
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu_ce_id}", delivery_street_address: "1 St", delivery_postal_code: "01010", requested_delivery_date: "2026-08-15", lines: [{ product_id: "${ce_c}", quantity: 1.0 }, { product_id: "${ce_h}", quantity: 1.0 }, { product_id: "${ce_t}", quantity: 1.0 }, { product_id: "${ce_b}", quantity: 50 }] }
              as: CustomerService
              captures: { o_ce: $.data }
          assert:
            - "Order.total_cord_equivalent == 1.0 + 0.5 + 0.8 + (50 * 0.016) == 3.1"

      - name: invoice_amount_snapshot_immutable_after_issuance
        claim_type: input_set_filtering
        grounds: ["calculations.invoice_amount_snapshot", "entities.Invoice.fields.amount_cents"]
        distinguishing_aspect: "Invoice.amount_cents is a snapshot at issuance; subsequent line edits on a DRAFT order are not permitted (must be DRAFT) so amount never changes, but a fresh invoice would reflect new totals."
        test_recipe:
          setup: ["Order submitted -> invoice issued at total_cents"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu IA", email: "ia@x.com", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_ia_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "PIA", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 10 }
              as: OperationsManager
              captures: { p_ia_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu_ia_id}", delivery_street_address: "1 St", delivery_postal_code: "01010", requested_delivery_date: "2026-08-15", lines: [{ product_id: "${p_ia_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { o_ia_id: $.data.id }
            - call: "POST /api/v1/orders/${o_ia_id}/submit"
              payload: {}
              as: CustomerService
          trigger:
            - call: "GET /api/v1/invoices"
              payload: { order_id: "${o_ia_id}" }
              as: CustomerService
              captures: { inv: "$.data[0]" }
          assert:
            - "Invoice.amount_cents == Order.total_cents at submit time (snapshot)"
            - "Invoice.status == OPEN"
            - "Invoice.due_date == requested_delivery_date + 7 days == 2026-08-22"

  # ==========================================================================
  # Section: validations
  # ==========================================================================
  - section: validations
    instances:
      - name: insufficient_stock_at_submit
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_INSUFFICIENT_STOCK]"]
        distinguishing_aspect: "Submitting an order where line quantity exceeds available_qty returns ERR_INSUFFICIENT_STOCK."
        test_recipe:
          setup: ["Product with available_qty=1.0; order line quantity 2.0"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu ST", email: "st@x.com", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_st_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "PST", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 1.0 }
              as: OperationsManager
              captures: { p_st_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu_st_id}", delivery_street_address: "1 St", delivery_postal_code: "01010", requested_delivery_date: "2026-08-15", lines: [{ product_id: "${p_st_id}", quantity: 2.0 }] }
              as: CustomerService
              captures: { o_st_id: $.data.id }
          trigger:
            - call: "POST /api/v1/orders/${o_st_id}/submit"
              payload: {}
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_INSUFFICIENT_STOCK"

      - name: product_discontinued_cannot_be_added
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_PRODUCT_DISCONTINUED]"]
        distinguishing_aspect: "Adding a discontinued product to a new order returns ERR_PRODUCT_DISCONTINUED."
        test_recipe:
          setup: ["Product with discontinued=true"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu PD", email: "pd@x.com", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_pd_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "PPD", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 10, discontinued: true }
              as: OperationsManager
              captures: { p_pd_id: $.data.id }
          trigger:
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu_pd_id}", delivery_street_address: "1 St", delivery_postal_code: "01010", requested_delivery_date: "2026-08-15", lines: [{ product_id: "${p_pd_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_PRODUCT_DISCONTINUED"

      - name: subscription_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_SUBSCRIPTION_MISMATCH]"]
        distinguishing_aspect: "Order created with subscription_id belonging to a different customer returns ERR_SUBSCRIPTION_MISMATCH."
        test_recipe:
          setup: ["Customers CU_A and CU_B; subscription S_B owned by CU_B"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu A", email: "a@x.com", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_a_id: $.data.id }
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu B", email: "b@x.com", phone: "2", street_address: "2 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_b_id: $.data.id, cu_b_v0: $.data.version }
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${cu_b_id}", tier: "HEARTH", season_year: 2026, commitment_cord_equivalent: 2.0, prepaid_cents: 0, discount_pct: 0.05, expected_customer_version: "${cu_b_v0}" }
              as: CustomerService
              captures: { s_b_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "PSM", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 10 }
              as: OperationsManager
              captures: { p_sm_id: $.data.id }
          trigger:
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu_a_id}", delivery_street_address: "1 St", delivery_postal_code: "01010", requested_delivery_date: "2026-12-15", subscription_id: "${s_b_id}", lines: [{ product_id: "${p_sm_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_SUBSCRIPTION_MISMATCH"

      - name: window_capacity_mismatch_with_route
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_CAPACITY_MISMATCH]"]
        distinguishing_aspect: "Window capacity > parent route capacity rejected."
        test_recipe:
          setup: ["Route capacity 5.0; attempt window capacity 6.0"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/delivery-routes"
              payload: { route_code: "RCM", depot_name: "C", service_postal_prefixes: ["0"], capacity_cord_equivalent: 5.0 }
              as: RoutePlanner
              captures: { r_cm_id: $.data.id }
          trigger:
            - call: "POST /api/v1/delivery-windows"
              payload: { route_id: "${r_cm_id}", service_date: "2026-09-01", start_hour: 8, end_hour: 12, capacity_cord_equivalent: 6.0 }
              as: RoutePlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_CAPACITY_MISMATCH"

      - name: end_hour_must_exceed_start_hour
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Window with end_hour <= start_hour rejected."
        test_recipe:
          setup: ["Route exists"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/delivery-routes"
              payload: { route_code: "RHH", depot_name: "C", service_postal_prefixes: ["0"], capacity_cord_equivalent: 50.0 }
              as: RoutePlanner
              captures: { r_hh_id: $.data.id }
          trigger:
            - call: "POST /api/v1/delivery-windows"
              payload: { route_id: "${r_hh_id}", service_date: "2026-09-01", start_hour: 12, end_hour: 8, capacity_cord_equivalent: 10.0 }
              as: RoutePlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_VALIDATION (end_hour must be > start_hour)"

      - name: activation_after_season_start_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_SUBSCRIPTION_OUT_OF_SEASON]"]
        distinguishing_aspect: "Subscription activation when logical clock is past Nov 1 of season_year is rejected."
        test_recipe:
          setup: ["Clock 2026-11-15 (past Nov 1 of season_year 2026); subscription PENDING"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu SA", email: "sa@x.com", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_sa_id: $.data.id, cu_sa_v0: $.data.version }
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${cu_sa_id}", tier: "HEARTH", season_year: 2026, commitment_cord_equivalent: 2.0, prepaid_cents: 0, discount_pct: 0.05, expected_customer_version: "${cu_sa_v0}" }
              as: CustomerService
              captures: { s_sa_id: $.data.id }
          trigger:
            - call: "POST /api/v1/subscriptions/${s_sa_id}/activate"
              payload: {}
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_SUBSCRIPTION_OUT_OF_SEASON"

      - name: invoice_void_rejected_when_paid_or_order_not_cancelled
        claim_type: violation_to_error
        grounds: ["validations[priority=23]", "errors[ERR_INVOICE_NOT_VOIDABLE]"]
        distinguishing_aspect: "Voiding an invoice on a non-cancelled order returns ERR_INVOICE_NOT_VOIDABLE."
        test_recipe:
          setup: ["Order submitted (not cancelled); invoice OPEN"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu IV", email: "iv@x.com", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_iv_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "PIV", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 10 }
              as: OperationsManager
              captures: { p_iv_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu_iv_id}", delivery_street_address: "1 St", delivery_postal_code: "01010", requested_delivery_date: "2026-08-15", lines: [{ product_id: "${p_iv_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { o_iv_id: $.data.id }
            - call: "POST /api/v1/orders/${o_iv_id}/submit"
              payload: {}
              as: CustomerService
            - call: "GET /api/v1/invoices"
              payload: { order_id: "${o_iv_id}" }
              as: CustomerService
              captures: { i_iv_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/v1/invoices/${i_iv_id}/void"
              payload: {}
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVOICE_NOT_VOIDABLE (order not cancelled)"

      - name: customer_close_with_outstanding_refund_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=24]", "errors[ERR_OUTSTANDING_REFUND]"]
        distinguishing_aspect: "Closing a customer with outstanding_refund_cents > 0 rejected."
        test_recipe:
          setup: ["Customer with outstanding_refund_cents > 0 (constructed via wallet adjustment of -1 then a refund clamp overflow — simplest: use wallet adjustment to seed outstanding)"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu OR", email: "or@x.com", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_or_id: $.data.id }
            - call: "POST /api/v1/customers/${cu_or_id}/wallet-adjustments"
              payload: { amount_cents: -500, reason: "seed outstanding" }
              as: OperationsManager
          trigger:
            - call: "POST /api/v1/customers/${cu_or_id}/close"
              payload: {}
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_OUTSTANDING_REFUND"

