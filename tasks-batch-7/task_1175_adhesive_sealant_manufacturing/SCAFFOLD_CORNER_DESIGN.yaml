# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Adhesive & Sealant Manufacturing (task 1175)
# Enumerative coverage of every §1.1–§1.7 claim not already probed by §1.8.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: formulation_created_with_initial_state_and_system_fields
        claim_type: creation
        grounds: [entities.Formulation, "endpoints.POST /api/formulations"]
        distinguishing_aspect: "A formulation created with all required fields lands in DRAFT with server-minted id, created_at, updated_at and version == 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /api/formulations"
              payload: { code: "EPX-CR-1", name: "Epx Create", chemistry_family: "EPOXY", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 120, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
          assert:
            - "http 201; data.status == DRAFT; data.version == 1"
            - "data.id == ${form_id} (a bare UUID, no type prefix); data.created_at and data.updated_at present in ISO8601 UTC"

      - name: formulation_retrieval_by_id
        claim_type: retrieval
        grounds: [entities.Formulation, "endpoints.GET /api/formulations/{formulationId}"]
        distinguishing_aspect: "GET by id returns exactly the stored field values."
        test_recipe:
          setup: ["one formulation EPX-CR-2 exists"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/formulations"
              payload: { code: "EPX-CR-2", name: "Epx Read", chemistry_family: "ACRYLIC", moisture_sensitive: true, solvent_content_pct: 12.5, flash_point_c: 45.0, pot_life_minutes: 90, shelf_life_months: 12, spec_min_bond_strength_mpa: 10.0, min_remaining_shelf_life_days: 60 }
              as: PlantManager
              captures: { form_id: $.data.id }
          trigger:
            - { call: "GET /api/formulations/${form_id}", payload: {}, as: PlantManager }
          assert:
            - "data.code == EPX-CR-2 AND data.chemistry_family == ACRYLIC AND data.moisture_sensitive == true AND data.solvent_content_pct == 12.5 AND data.pot_life_minutes == 90"

      - name: formulation_list_pagination_envelope
        claim_type: listing
        grounds: ["endpoints.GET /api/formulations", response_envelope]
        distinguishing_aspect: "limit/offset paging exposes total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["two formulations PG-1 and PG-2 exist"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/formulations"
              payload: { code: "PG-1", name: "Pg One", chemistry_family: "EPOXY", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 120, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
            - call: "POST /api/formulations"
              payload: { code: "PG-2", name: "Pg Two", chemistry_family: "SILICONE", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 120, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
          trigger:
            - { call: "GET /api/formulations", payload: { limit: 1, offset: 0 }, as: PlantManager }
            - { call: "GET /api/formulations", payload: { limit: 1, offset: 1 }, as: PlantManager }
          assert:
            - "first page: exactly 1 item, total_count == 2, has_more == true"
            - "second page: exactly 1 item, total_count == 2, has_more == false"

      - name: get_formulation_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "A well-formed but unknown UUID yields 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["empty database (clock initialized)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "GET /api/formulations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "http 404; ${err} == ERR_NOT_FOUND"

      - name: formulation_missing_required_code_returns_400
        claim_type: required_fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations[priority=3]"]
        distinguishing_aspect: "Omitting the required input field code fails schema validation with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database (clock initialized)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /api/formulations"
              payload: { name: "No Code", chemistry_family: "EPOXY", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 120, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "http 400; ${err} == ERR_INVALID_REQUEST"

      - name: formulation_invalid_enum_returns_400
        claim_type: type_constraints
        grounds: [entities.Formulation.fields.chemistry_family, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An undeclared enum member (GLUE) for chemistry_family is rejected."
        test_recipe:
          setup: ["empty database (clock initialized)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /api/formulations"
              payload: { code: "BAD-ENUM", name: "Bad Enum", chemistry_family: "GLUE", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 120, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "http 400; ${err} == ERR_INVALID_REQUEST"

      - name: batch_create_extra_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.ProductionBatch.fields.remaining_bulk_volume_ml, "endpoints.POST /api/batches"]
        distinguishing_aspect: "A client-supplied value for the computed field remaining_bulk_volume_ml is ignored; the server sets it to batch_volume_ml."
        test_recipe:
          setup: ["EFFECTIVE formulation and vessel exist"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/formulations"
              payload: { code: "EPX-CI-1", name: "Epx CI", chemistry_family: "EPOXY", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 120, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - { call: "POST /api/formulations/${form_id}/activate", payload: {}, as: PlantManager }
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-CI-1", capacity_liters: 100 }
              as: PlantManager
              captures: { ves_id: $.data.id }
          trigger:
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T09:00:00Z", batch_volume_ml: 5000, remaining_bulk_volume_ml: 1 }
              as: BatchOperator
          assert:
            - "http 201; data.remaining_bulk_volume_ml == 5000 (client-supplied 1 ignored)"
            - "data.status == MIXING; data.mixed_at == null; data.pot_life_deadline == null"

      - name: exposure_event_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.MoistureExposureEvent]
        distinguishing_aspect: "MoistureExposureEvent has common_fields: false — its response carries id and created_at but no version and no updated_at."
        test_recipe:
          setup: ["a MIXED batch with an OPEN packaging run"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/formulations"
              payload: { code: "EPX-EV-1", name: "Epx EV", chemistry_family: "EPOXY", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 240, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - { call: "POST /api/formulations/${form_id}/activate", payload: {}, as: PlantManager }
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-EV-1", capacity_liters: 100 }
              as: PlantManager
              captures: { ves_id: $.data.id }
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T09:00:00Z", batch_volume_ml: 5000 }
              as: BatchOperator
              captures: { bat_id: $.data.id, lot_id: $.data.production_lot_id }
            - { call: "POST /api/batches/${bat_id}/complete-mix", payload: {}, as: BatchOperator }
            - call: "POST /api/packaging-runs"
              payload: { batch_id: "${bat_id}", pack_format: "PAIL", unit_volume_ml: 5000, planned_units: 1, planned_start_at: "2026-05-01T08:10:00Z", planned_end_at: "2026-05-01T09:30:00Z" }
              as: BatchOperator
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /api/packaging-runs/${run_id}/exposure-events"
              payload: { exposure_minutes: 10, occurred_at: "2026-05-01T08:20:00Z" }
              as: BatchOperator
          assert:
            - "http 201; data contains id and created_at; data has NO version key and NO updated_at key"
            - "PackagingRun.${run_id}.status == OPEN (10 < 30 minutes: logged only, no HOLD)"

      - name: batch_creation_creates_production_lot_one_to_one
        claim_type: parent_relationships
        grounds: [entities.ProductionLot.fields.batch_id, "endpoints.POST /api/batches", "endpoints.GET /api/production-lots"]
        distinguishing_aspect: "Every batch atomically mints exactly one ProductionLot (AWAITING_TEST, hold CLEAR) reachable via the batch_id filter."
        test_recipe:
          setup: ["EFFECTIVE formulation and vessel exist"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/formulations"
              payload: { code: "EPX-1TO1", name: "Epx One", chemistry_family: "EPOXY", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 120, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - { call: "POST /api/formulations/${form_id}/activate", payload: {}, as: PlantManager }
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-1TO1", capacity_liters: 100 }
              as: PlantManager
              captures: { ves_id: $.data.id }
          trigger:
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T09:00:00Z", batch_volume_ml: 5000 }
              as: BatchOperator
              captures: { bat_id: $.data.id, lot_id: $.data.production_lot_id }
            - { call: "GET /api/production-lots", payload: { batch_id: "${bat_id}" }, as: QAManager }
          assert:
            - "create response carries production_lot_id == ${lot_id} (non-null, server-minted)"
            - "GET /api/production-lots?batch_id=${bat_id}: total_count == 1 AND data[0].id == ${lot_id} AND data[0].qa_status == AWAITING_TEST AND data[0].hold_status == CLEAR AND data[0].lot_number == LOT-000001 (fresh sequence)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: complete_mix_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.ProductionBatch.MIXING_to_MIXED, "errors[ERR_BATCH_INVALID_STATE]"]
        distinguishing_aspect: "The same complete-mix trigger fired twice is rejected the second time; no state drift."
        test_recipe:
          setup: ["batch in MIXED (complete-mix already applied once)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/formulations"
              payload: { code: "EPX-IDEM", name: "Epx Idem", chemistry_family: "EPOXY", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 120, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - { call: "POST /api/formulations/${form_id}/activate", payload: {}, as: PlantManager }
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-IDEM", capacity_liters: 100 }
              as: PlantManager
              captures: { ves_id: $.data.id }
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T09:00:00Z", batch_volume_ml: 5000 }
              as: BatchOperator
              captures: { bat_id: $.data.id }
            - { call: "POST /api/batches/${bat_id}/complete-mix", payload: {}, as: BatchOperator }
          trigger:
            - { call: "POST /api/batches/${bat_id}/complete-mix", payload: {}, as: BatchOperator }
          assert:
            - "http 409 ERR_BATCH_INVALID_STATE"
            - "ProductionBatch.${bat_id}.status == MIXED (unchanged) and mixed_at unchanged"

      - name: run_complete_from_hold_returns_409
        claim_type: invalid_transition
        grounds: [state_machines.PackagingRun.OPEN_to_SEALED, "errors[ERR_RUN_INVALID_STATE]"]
        distinguishing_aspect: "complete is invalid from HOLD (only OPEN may complete)."
        test_recipe:
          setup: ["a SEALED run driven to HOLD by a 45-minute exposure"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/formulations"
              payload: { code: "EPX-HLD", name: "Epx Hld", chemistry_family: "EPOXY", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 240, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - { call: "POST /api/formulations/${form_id}/activate", payload: {}, as: PlantManager }
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-HLD", capacity_liters: 100 }
              as: PlantManager
              captures: { ves_id: $.data.id }
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T09:00:00Z", batch_volume_ml: 5000 }
              as: BatchOperator
              captures: { bat_id: $.data.id, lot_id: $.data.production_lot_id }
            - { call: "POST /api/batches/${bat_id}/complete-mix", payload: {}, as: BatchOperator }
            - call: "POST /api/packaging-runs"
              payload: { batch_id: "${bat_id}", pack_format: "CARTRIDGE", unit_volume_ml: 310, planned_units: 3, planned_start_at: "2026-05-01T08:10:00Z", planned_end_at: "2026-05-01T09:30:00Z" }
              as: BatchOperator
              captures: { run_id: $.data.id }
            - { call: "POST /api/packaging-runs/${run_id}/complete", payload: {}, as: BatchOperator }
            - { call: "POST /api/packaging-runs/${run_id}/exposure-events", payload: { exposure_minutes: 45, occurred_at: "2026-05-01T08:45:00Z" }, as: BatchOperator }
          trigger:
            - { call: "POST /api/packaging-runs/${run_id}/complete", payload: {}, as: BatchOperator }
          assert:
            - "http 409 ERR_RUN_INVALID_STATE"
            - "PackagingRun.${run_id}.status == HOLD (unchanged)"

      - name: lot_terminal_rejected_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ProductionLot.qa_UNDER_REVIEW_to_REJECTED, "errors[ERR_LOT_INVALID_STATE]"]
        distinguishing_aspect: "From terminal REJECTED, both release and request-retest are rejected; the reject side effect condemned the sealed units."
        test_recipe:
          setup: ["lot UNDER_REVIEW with an ACCEPTED passing FULL test, then rejected by a different QA user"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/formulations"
              payload: { code: "EPX-LOCK", name: "Epx Lock", chemistry_family: "EPOXY", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 240, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - { call: "POST /api/formulations/${form_id}/activate", payload: {}, as: PlantManager }
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-LOCK", capacity_liters: 100 }
              as: PlantManager
              captures: { ves_id: $.data.id }
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T09:00:00Z", batch_volume_ml: 5000 }
              as: BatchOperator
              captures: { bat_id: $.data.id, lot_id: $.data.production_lot_id }
            - { call: "POST /api/batches/${bat_id}/complete-mix", payload: {}, as: BatchOperator }
            - call: "POST /api/packaging-runs"
              payload: { batch_id: "${bat_id}", pack_format: "CARTRIDGE", unit_volume_ml: 310, planned_units: 3, planned_start_at: "2026-05-01T08:10:00Z", planned_end_at: "2026-05-01T09:30:00Z" }
              as: BatchOperator
              captures: { run_id: $.data.id }
            - { call: "POST /api/packaging-runs/${run_id}/complete", payload: {}, as: BatchOperator }
            - call: "POST /api/production-lots/${lot_id}/cure-tests"
              payload: { method: "FULL", specimens: [13.0, 12.5, 12.4, 12.3, 12.6] }
              as: QATechnician
              as_user_id: "tech-1"
              captures: { t1: $.data.id }
            - { call: "POST /api/cure-tests/${t1}/accept", payload: {}, as: QAManager, as_user_id: "qm-1" }
            - { call: "POST /api/production-lots/${lot_id}/reject", payload: { reason: "visual defect" }, as: QAManager, as_user_id: "qm-1" }
          trigger:
            - { call: "POST /api/production-lots/${lot_id}/release", payload: {}, as: QAManager, as_user_id: "qm-1" }
            - { call: "POST /api/production-lots/${lot_id}/request-retest", payload: {}, as: QAManager, as_user_id: "qm-1" }
          assert:
            - "release on REJECTED lot: http 409 ERR_LOT_INVALID_STATE"
            - "request-retest on REJECTED lot: http 409 ERR_LOT_INVALID_STATE"
            - "ProductionLot.${lot_id}.qa_status == REJECTED; reject side effect: units_condemned == 3 AND batch.written_off_volume_ml == 948"

      - name: withdraw_blocked_by_inflight_batch
        claim_type: precondition_enforcement
        grounds: [state_machines.Formulation.EFFECTIVE_to_WITHDRAWN, "errors[ERR_FORMULATION_HAS_INFLIGHT_BATCHES]"]
        distinguishing_aspect: "Withdraw is blocked while a batch of the formulation is still MIXING (in-flight guard)."
        test_recipe:
          setup: ["EFFECTIVE formulation with one MIXING batch"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/formulations"
              payload: { code: "EPX-WD", name: "Epx WD", chemistry_family: "EPOXY", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 120, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - { call: "POST /api/formulations/${form_id}/activate", payload: {}, as: PlantManager }
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-WD", capacity_liters: 100 }
              as: PlantManager
              captures: { ves_id: $.data.id }
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T09:00:00Z", batch_volume_ml: 5000 }
              as: BatchOperator
          trigger:
            - { call: "POST /api/formulations/${form_id}/withdraw", payload: {}, as: PlantManager }
          assert:
            - "http 409 ERR_FORMULATION_HAS_INFLIGHT_BATCHES"
            - "Formulation.${form_id}.status == EFFECTIVE (unchanged)"

      - name: mixing_batch_expiry_sweep_on_clock_advance
        claim_type: valid_transition
        grounds: [state_machines.ProductionBatch.MIXING_to_EXPIRED, "endpoints.POST /api/_clock/set_current_utc"]
        distinguishing_aspect: "Advancing the logical clock past mix_end_at sweeps the MIXING batch to EXPIRED and rejects its lot; a late complete-mix then fails as a state error."
        test_recipe:
          setup: ["batch in MIXING with mix window [08:00, 09:00]; clock at 08:00"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/formulations"
              payload: { code: "EPX-SWP", name: "Epx Swp", chemistry_family: "EPOXY", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 120, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - { call: "POST /api/formulations/${form_id}/activate", payload: {}, as: PlantManager }
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-SWP", capacity_liters: 100 }
