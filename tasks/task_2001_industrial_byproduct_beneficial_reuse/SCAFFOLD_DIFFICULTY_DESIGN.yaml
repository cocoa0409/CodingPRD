            - "error_id == ERR_AGREEMENT_NOT_ACTIVE with HTTP 409"
            - "GET /api/shipments?supply_agreement_id=${a_id} returns total_count == 0 (no shipment persisted)"

      - name: dispatch_blocked_by_expired_eligibility
        grounds:
          - state_machines.ReuseEligibility.APPROVED_to_EXPIRED
