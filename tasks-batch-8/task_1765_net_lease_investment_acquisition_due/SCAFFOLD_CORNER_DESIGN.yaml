              payload:
                closing_date: "2026-09-15T00:00:00Z"
                proration_inputs:
                  - { line_type: "BASE_RENT", lease_id: "${l}", annual_amount_cents: 1200000, period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
                  - { line_type: "TAX", lease_id: "${l}", annual_amount_cents: 365000, period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }
              as: EscrowOfficer
            - call: "GET /acquisition-deals/deals/${d}"
              payload: {}
              as: EscrowOfficer
              captures: { dv_pre: $.data.version }
          trigger:
            # First reissue: fresh deal version -> succeeds, supersedes stmt, creates stmt2 (DRAFT), bumps deal.version
            - call: "POST /acquisition-deals/deals/${d}/closing-statements/${stmt}/reissue"
              payload:
                expected_deal_version: "${dv_pre}"
                closing_date: "2026-09-16T00:00:00Z"
                proration_inputs:
                  - { line_type: "BASE_RENT", lease_id: "${l}", annual_amount_cents: 1200000, period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
                  - { line_type: "TAX", lease_id: "${l}", annual_amount_cents: 365000, period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }
              as: EscrowOfficer
              captures: { stmt2: $.data.id, ok: $.data.status }
            # Issue the new statement so it is in ISSUED (a valid from-state for reissue)
            - call: "POST /acquisition-deals/deals/${d}/closing-statements/${stmt2}/issue"
              payload:
                closing_date: "2026-09-16T00:00:00Z"
                proration_inputs:
                  - { line_type: "BASE_RENT", lease_id: "${l}", annual_amount_cents: 1200000, period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
                  - { line_type: "TAX", lease_id: "${l}", annual_amount_cents: 365000, period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }
              as: EscrowOfficer
            # Second reissue targets the STILL-ISSUED stmt2 but reuses the STALE deal version
            # captured before the first reissue; the stale deal version is the sole discriminator
            # (stmt2 is in a valid from-state), so the OCC guard fires deterministically.
            - call: "POST /acquisition-deals/deals/${d}/closing-statements/${stmt2}/reissue"
              payload:
                expected_deal_version: "${dv_pre}"
                closing_date: "2026-09-17T00:00:00Z"
                proration_inputs:
                  - { line_type: "BASE_RENT", lease_id: "${l}", annual_amount_cents: 1200000, period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
                  - { line_type: "TAX", lease_id: "${l}", annual_amount_cents: 365000, period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }
              as: EscrowOfficer
              captures: { err: $.data.error_id }
          assert:
            - "First reissue with fresh expected_deal_version succeeds: response status == DRAFT (new statement), old ${stmt} SUPERSEDED, deal.version bumped from ${dv_pre}"
            - "Second reissue against the still-ISSUED ${stmt2} reusing stale ${dv_pre} returns 412 ERR_STALE_DEAL_VERSION (true race: stmt2 in valid from-state, only the parent deal version is stale)"

