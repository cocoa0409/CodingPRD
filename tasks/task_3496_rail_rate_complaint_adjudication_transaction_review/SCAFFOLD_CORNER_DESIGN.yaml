            - "at exactly comment_close_at: decide succeeds, MergerApplication.${m1}.status == REJECTED"

      - name: trail_use_window_boundary_precision
        claim_type: temporal_validation
        grounds:
          - errors[ERR_TRAIL_USE_NOTICE_EXPIRED]
          - errors[ERR_TRAIL_USE_WINDOW_OPEN]
          - state_machines.AbandonmentApplication.TRAIL_PENDING_to_TRAIL_CONVERTED
          - state_machines.AbandonmentApplication.TRAIL_PENDING_to_CONSUMMATED
        distinguishing_aspect: "NITU issued 2026-09-01 expires 2027-02-28T00:00:00Z: convert is allowed AT the expiry instant (<=) while consummate from TRAIL_PENDING requires strictly later; after the window, convert fails ERR_TRAIL_USE_NOTICE_EXPIRED and consummate succeeds — complementary half-open boundary behavior on one deadline."
        test_recipe:
          setup:
            - "Carrier OKTX (base 1000). AB1 (50 miles, ref 'MP 0.0-MP 50.0') and AB2 (120 miles, ref 'MP 100.0-MP 220.0') both GRANTED with trail-use notices issued at 2026-09-01T00:00:00Z (nitu_expires_at 2027-02-28T00:00:00Z)."
