scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: valuation_method_variant_divergence_lump_sum_vs_prepaid
        grounds:
          - calculations.stream_valuation_value
          - entities.StreamValuation.fields.method
          - entities.StreamValuation.fields.value_cents
          - entities.StreamValuation.fields.horizon_years
        distinguishing_aspect: |
          The divergence is in the StreamValuation entity and is driven by the `method` enum: the
          LUMP_SUM_PERPETUAL variant discounts a 40-year horizon at the bare tier rate and haircuts
          only the post-contract years, while PREPAID_RENT_TERM discounts a term-clamped horizon at
          the tier rate plus a 150 bps term-risk premium and then applies one 500 bps haircut to the
          summed present value; on identical stream inputs the two produce 44627011 and 22028616.
        test_recipe:
          setup:
            - "One tower company, tower site, landowner and lease stream: annual rent 3600000 cents, FIXED_PCT escalator at 300 bps, 180 remaining months."
            - "One INVESTMENT_GRADE ANCHOR tenancy is ACTIVE on the stream, so tenancy_quality_score is 40 and the discount tier is 1000 bps."
            - "Logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /lease-buyouts/portfolios"
              payload: { name: "Northeast Tower Aggregation", program_code: "NE-AGG-01", total_capital_cents: 50000000 }
              as: PlatformAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /lease-buyouts/tower-companies"
              payload: { legal_name: "Summit Towers LLC", notice_email: "rofr@summit.example", rofr_required: false, rofr_window_days: 30 }
              as: PlatformAdmin
              captures: { tc_id: $.data.id }
            - call: "POST /lease-buyouts/tower-sites"
              payload: { tower_company_id: "${tc_id}", site_code: "NE-1042", state_code: "NY", ground_area_sqft: 2500, structure_type: "MONOPOLE" }
              as: AcquisitionAnalyst
              captures: { ts_id: $.data.id }
            - call: "POST /lease-buyouts/landowners"
              payload: { legal_name: "Hollis Farm LLC", entity_type: "LLC", contact_email: "owner@hollis.example" }
              as: AcquisitionAnalyst
              captures: { lo_id: $.data.id }
            - call: "POST /lease-buyouts/lease-streams"
              payload: { tower_site_id: "${ts_id}", landowner_id: "${lo_id}", current_annual_rent_cents: 3600000, escalator_type: "FIXED_PCT", escalator_pct_bps: 300, remaining_term_months: 180 }
              as: AcquisitionAnalyst
              captures: { ls_id: $.data.id }
            - call: "POST /lease-buyouts/lease-streams/${ls_id}/tenancies"
              payload: { carrier_name: "Vantage Wireless", carrier_credit_tier: "INVESTMENT_GRADE", tenancy_type: "ANCHOR", monthly_rent_share_cents: 250000, term_end_date: "2034-06-30" }
              as: AcquisitionAnalyst
              captures: { t1_id: $.data.id }
            - call: "GET /lease-buyouts/lease-streams/${ls_id}"
              payload: {}
              as: AcquisitionAnalyst
              captures: { ls_v1: $.data.version, score: $.data.tenancy_quality_score }
          trigger:
            - call: "POST /lease-buyouts/lease-streams/${ls_id}/valuations"
              payload: { method: "LUMP_SUM_PERPETUAL", expected_lease_stream_version: "${ls_v1}" }
              as: AcquisitionAnalyst
              captures: { val_lump_id: $.data.id, lump_value: $.data.value_cents }
            - call: "GET /lease-buyouts/lease-streams/${ls_id}"
              payload: {}
              as: AcquisitionAnalyst
              captures: { ls_v2: $.data.version }
            - call: "POST /lease-buyouts/lease-streams/${ls_id}/valuations"
              payload: { method: "PREPAID_RENT_TERM", prepaid_term_months: 120, expected_lease_stream_version: "${ls_v2}" }
              as: AcquisitionAnalyst
              captures: { val_prepaid_id: $.data.id, prepaid_value: $.data.value_cents }
          assert:
            - "LeaseStream.${ls_id}.tenancy_quality_score == 40"
            - "StreamValuation.${val_lump_id}.discount_rate_bps == 1000"
            - "StreamValuation.${val_lump_id}.horizon_years == 40"
            - "StreamValuation.${val_lump_id}.value_cents == 44627011"
            - "StreamValuation.${val_lump_id}.max_bid_cents == 46858362"
            - "StreamValuation.${val_prepaid_id}.discount_rate_bps == 1150"
            - "StreamValuation.${val_prepaid_id}.horizon_years == 10"
            - "StreamValuation.${val_prepaid_id}.value_cents == 22028616"
            - "StreamValuation.${val_lump_id}.value_cents - StreamValuation.${val_prepaid_id}.value_cents == 22598395"

      - name: facility_valuation_basis_variant_divergence_mark_to_model_vs_cost_basis
        grounds:
          - calculations.facility_borrowing_base
          - calculations.pledge_eligible_value
          - entities.FinancingFacility.fields.valuation_basis
          - entities.CollateralPledge.fields.basis_value_cents
        distinguishing_aspect: |
          This divergence lives in the FinancingFacility/CollateralPledge pair and is driven by the
          facility's `valuation_basis` enum rather than by a valuation method: the same acquired
          lease stream pledged to a MARK_TO_MODEL facility takes its basis from the approved model
          value 44627011 while the COST_BASIS facility takes it from the closed deal's
          total_commitment_cents 36540000, producing borrowing bases of 29007557 and 23751000.
        test_recipe:
          setup:
            - "The lease stream from valuation_method_variant_divergence_lump_sum_vs_prepaid has been acquired through a closed deal: approved LUMP_SUM_PERPETUAL valuation 44627011, accepted offer 36000000, total_commitment_cents 36540000."
            - "Two financing facilities on the same portfolio, both with advance_rate_bps 6500: facility M with valuation_basis MARK_TO_MODEL and facility C with valuation_basis COST_BASIS."
            - "The stream is PERFORMING with no disputes, so the pledge haircut is 0 bps."
          setup_api_calls:
            - call: "POST /lease-buyouts/portfolios"
              payload: { name: "Northeast Tower Aggregation", program_code: "NE-AGG-01", total_capital_cents: 50000000 }
              as: PlatformAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /lease-buyouts/tower-companies"
              payload: { legal_name: "Summit Towers LLC", notice_email: "rofr@summit.example", rofr_required: false, rofr_window_days: 30 }
              as: PlatformAdmin
              captures: { tc_id: $.data.id }
            - call: "POST /lease-buyouts/tower-sites"
              payload: { tower_company_id: "${tc_id}", site_code: "NE-1042", state_code: "NY", ground_area_sqft: 2500, structure_type: "MONOPOLE" }
              as: AcquisitionAnalyst
              captures: { ts_id: $.data.id }
            - call: "POST /lease-buyouts/landowners"
              payload: { legal_name: "Hollis Farm LLC", entity_type: "LLC", contact_email: "owner@hollis.example" }
              as: AcquisitionAnalyst
              captures: { lo_id: $.data.id }
            - call: "POST /lease-buyouts/lease-streams"
              payload: { tower_site_id: "${ts_id}", landowner_id: "${lo_id}", current_annual_rent_cents: 3600000, escalator_type: "FIXED_PCT", escalator_pct_bps: 300, remaining_term_months: 180 }
              as: AcquisitionAnalyst
              captures: { ls_id: $.data.id }
            - call: "POST /lease-buyouts/lease-streams/${ls_id}/tenancies"
              payload: { carrier_name: "Vantage Wireless", carrier_credit_tier: "INVESTMENT_GRADE", tenancy_type: "ANCHOR", monthly_rent_share_cents: 250000, term_end_date: "2034-06-30" }
              as: AcquisitionAnalyst
              captures: { t1_id: $.data.id }
            - call: "GET /lease-buyouts/lease-streams/${ls_id}"
              payload: {}
              as: AcquisitionAnalyst
              captures: { ls_v1: $.data.version }
            - call: "POST /lease-buyouts/lease-streams/${ls_id}/valuations"
              payload: { method: "LUMP_SUM_PERPETUAL", expected_lease_stream_version: "${ls_v1}" }
              as: AcquisitionAnalyst
              captures: { val_id: $.data.id }
            - call: "POST /lease-buyouts/stream-valuations/${val_id}/approve"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-alice"
            - call: "POST /lease-buyouts/deals"
              payload: { portfolio_id: "${pf_id}", lease_stream_id: "${ls_id}", valuation_id: "${val_id}", easement_type: "PERPETUAL_EASEMENT", revenue_share_bps: 2500 }
              as: AcquisitionAnalyst
              captures: { deal_id: $.data.id }
            - call: "POST /lease-buyouts/deals/${deal_id}/outreach"
              payload: {}
              as: AcquisitionAnalyst
            - call: "POST /lease-buyouts/deals/${deal_id}/offers"
              payload: { offer_type: "LUMP_SUM", amount_cents: 36000000, expires_at: "2026-09-30T00:00:00Z" }
              as: AcquisitionAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /lease-buyouts/offers/${offer_id}/transitions"
              payload: { action: "SEND" }
              as: AcquisitionAnalyst
            - call: "POST /lease-buyouts/offers/${offer_id}/transitions"
              payload: { action: "ACCEPT" }
              as: Landowner
              as_user_id: "${lo_id}"
            - call: "POST /lease-buyouts/deals/${deal_id}/title-reports"
              payload: { snda_required: false }
              as: AcquisitionAnalyst
              captures: { tr_id: $.data.id }
            - call: "POST /lease-buyouts/title-reports/${tr_id}/transitions"
              payload: { action: "RECORD_FINDINGS", exception_count: 0, mortgage_present: false }
              as: TitleOfficer
            - call: "POST /lease-buyouts/deals/${deal_id}/escrow-funding"
              payload: {}
              as: TreasuryOfficer
            - call: "POST /lease-buyouts/deals/${deal_id}/close"
              payload: { recording_ref: "BK1420-PG318" }
              as: PortfolioManager
              as_user_id: "pm-bob"
            - call: "POST /lease-buyouts/financing-facilities"
              payload: { portfolio_id: "${pf_id}", facility_name: "Warehouse M", advance_rate_bps: 6500, valuation_basis: "MARK_TO_MODEL", carrier_concentration_limit_bps: 10000 }
              as: TreasuryOfficer
              captures: { fac_m_id: $.data.id }
            - call: "POST /lease-buyouts/financing-facilities"
              payload: { portfolio_id: "${pf_id}", facility_name: "Warehouse C", advance_rate_bps: 6500, valuation_basis: "COST_BASIS", carrier_concentration_limit_bps: 10000 }
              as: TreasuryOfficer
              captures: { fac_c_id: $.data.id }
            - call: "GET /lease-buyouts/financing-facilities/${fac_m_id}"
              payload: {}
              as: TreasuryOfficer
              captures: { fac_m_v: $.data.version }
            - call: "GET /lease-buyouts/financing-facilities/${fac_c_id}"
              payload: {}
              as: TreasuryOfficer
              captures: { fac_c_v: $.data.version }
          trigger:
            - call: "POST /lease-buyouts/financing-facilities/${fac_m_id}/pledges"
              payload: { lease_stream_id: "${ls_id}", pledge_start_date: "2026-08-01", pledge_end_date: "2026-12-31", expected_facility_version: "${fac_m_v}" }
              as: TreasuryOfficer
              captures: { pl_m_id: $.data.id }
            - call: "POST /lease-buyouts/financing-facilities/${fac_c_id}/pledges"
              payload: { lease_stream_id: "${ls_id}", pledge_start_date: "2027-01-01", pledge_end_date: "2027-06-30", expected_facility_version: "${fac_c_v}" }
              as: TreasuryOfficer
              captures: { pl_c_id: $.data.id }
          assert:
            - "CollateralPledge.${pl_m_id}.valuation_basis_snapshot == MARK_TO_MODEL"
            - "CollateralPledge.${pl_m_id}.basis_value_cents == 44627011"
            - "CollateralPledge.${pl_m_id}.haircut_bps == 0"
            - "CollateralPledge.${pl_m_id}.eligible_value_cents == 44627011"
            - "CollateralPledge.${pl_c_id}.valuation_basis_snapshot == COST_BASIS"
            - "CollateralPledge.${pl_c_id}.basis_value_cents == 36540000"
            - "CollateralPledge.${pl_c_id}.eligible_value_cents == 36540000"
            - "FinancingFacility.${fac_m_id}.borrowing_base_cents == 29007557"
            - "FinancingFacility.${fac_c_id}.borrowing_base_cents == 23751000"
            - "FinancingFacility.${fac_m_id}.borrowing_base_cents - FinancingFacility.${fac_c_id}.borrowing_base_cents == 5256557"

      - name: amendment_share_variant_divergence_colocation_vs_rent_increase
        grounds:
          - calculations.amendment_revenue_share_split
          - entities.AmendmentEvent.fields.event_type
          - entities.AmendmentEvent.fields.share_bps_applied
          - entities.AmendmentEvent.fields.effective_pass_through_cents
        distinguishing_aspect: |
          This third divergence sits in AmendmentEvent and is driven by `event_type` rather than by
          a valuation method or a facility basis: on the identical gross 1000002 with the deal's
          revenue_share_bps 2500, COLOCATION_ADDED shares the full gross at 2500 bps (landowner
          250001), AMENDMENT first caps the pass-through at 2000 bps of gross before sharing
          (landowner 200001), and RENT_INCREASE halves the share rate to 1250 bps (landowner 125000).
        test_recipe:
          setup:
            - "The lease stream is ACQUIRED via a closed deal whose revenue_share_bps is 2500 (same chain as facility_valuation_basis_variant_divergence_mark_to_model_vs_cost_basis, up to and including the close)."
            - "No amendment events recorded yet, so both cumulative revenue-share fields are 0."
