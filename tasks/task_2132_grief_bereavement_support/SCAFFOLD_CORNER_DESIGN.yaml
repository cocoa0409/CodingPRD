            - "Invitation.${inv_id}.status == SENT"
            - "Invitation.${inv_id}.responded_at is null"
            - "RemembranceEvent.${ev_id}.confirmed_headcount == 0"
            - "RemembranceEvent.${ev_id}.invitations_accepted == 0"

      - name: cohort_seats_total_above_space_capacity_returns_space_capacity_exceeded
        claim_type: Violation to Error
        grounds: ["validations[priority=13]", "errors[ERR_SPACE_CAPACITY_EXCEEDED]", "entities.MeetingSpace.fields.capacity"]
        distinguishing_aspect: "A 5-seat room cannot host a 10-seat cohort: the create returns ERR_SPACE_CAPACITY_EXCEEDED (422) with an empty space, so no temporal rule can mask it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One MeetingSpace with capacity 5 and nothing booked in it."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/meeting-spaces"
              payload: { name: "Small Room", capacity: 5, turnover_buffer_minutes: 30 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
          trigger:
            - call: "POST /bereavement/cohorts"
              payload: { name: "Too Big Group", loss_type: "ANTICIPATED_ILLNESS", meeting_space_id: "${sp_id}", seats_total: 10, min_viable_enrollment: 2, weekday: "TUE", start_minute_utc: 600, duration_minutes: 90, series_start_date: "2026-09-08", sessions_total: 8, direct_cost_cents: 100000 }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "err == ERR_SPACE_CAPACITY_EXCEEDED"
            - "GET /bereavement/cohorts?meeting_space_id=${sp_id} returns 0 rows"

      - name: duplicate_award_reference_and_overlapping_report_window_are_refused
        claim_type: Violation to Error
        grounds: ["validations[priority=13]", "errors[ERR_DUPLICATE_AWARD_REFERENCE]", "errors[ERR_REPORT_PERIOD_OVERLAP]"]
        distinguishing_aspect: "Two uniqueness rules on the funding surface: a second GrantAward reusing award_reference HF-2026-UNIQ returns ERR_DUPLICATE_AWARD_REFERENCE (409), and a second DRAFT report over 2026-09-15..2026-10-15 overlapping an existing 2026-09-01..2026-09-30 report returns ERR_REPORT_PERIOD_OVERLAP (409)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One ACTIVE GrantAward with award_reference HF-2026-UNIQ and one DRAFT GrantReport over 2026-09-01..2026-09-30."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/grant-awards"
              payload: { funder_name: "Hollis Foundation", award_reference: "HF-2026-UNIQ", awarded_cents: 100000, allowed_categories: ["GROUP_PROGRAM"], period_start: "2026-01-01", period_end: "2026-12-31", indirect_rate_bps: 1200 }
              as: ProgramDirector
              captures: { g_id: $.data.id }
            - call: "POST /bereavement/grant-reports"
              payload: { grant_award_id: "${g_id}", period_start: "2026-09-01", period_end: "2026-09-30" }
              as: ProgramDirector
              captures: { rpt_id: $.data.id }
          trigger:
            - call: "POST /bereavement/grant-awards"
              payload: { funder_name: "Other Funder", award_reference: "HF-2026-UNIQ", awarded_cents: 200000, allowed_categories: ["COUNSELING"], period_start: "2026-01-01", period_end: "2026-12-31", indirect_rate_bps: 1000 }
              as: ProgramDirector
              captures: { err_ref: $.data.error_id }
            - call: "POST /bereavement/grant-reports"
              payload: { grant_award_id: "${g_id}", period_start: "2026-09-15", period_end: "2026-10-15" }
              as: ProgramDirector
              captures: { err_period: $.data.error_id }
          assert:
            - "The first trigger call returns HTTP 409"
            - "err_ref == ERR_DUPLICATE_AWARD_REFERENCE"
            - "The second trigger call returns HTTP 409"
            - "err_period == ERR_REPORT_PERIOD_OVERLAP"
            - "GET /bereavement/grant-reports?grant_award_id=${g_id} returns exactly 1 row"

      - name: duplicate_referral_for_same_contact_and_date_of_death_is_refused
        claim_type: Violation to Error
        grounds: ["validations[priority=13]", "errors[ERR_DUPLICATE_REFERRAL]"]
        distinguishing_aspect: "A second referral with the same contact_email and date_of_death as a live RECEIVED referral returns ERR_DUPLICATE_REFERRAL (409); the same pair becomes admissible again only after the first referral is DECLINED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One RECEIVED Referral for ben.vance@example.org with date_of_death 2026-06-01."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/referrals"
              payload: { source_type: "HOSPICE", source_org_name: "Riverside Hospice", decedent_name: "Ann Vance", date_of_death: "2026-06-01", relationship_to_deceased: "SPOUSE", loss_type: "ANTICIPATED_ILLNESS", contact_name: "Ben Vance", contact_email: "ben.vance@example.org" }
              as: ReferralSource
              captures: { ref1_id: $.data.id }
          trigger:
            - call: "POST /bereavement/referrals"
              payload: { source_type: "FUNERAL_HOME", source_org_name: "Calder Funeral Home", decedent_name: "Ann Vance", date_of_death: "2026-06-01", relationship_to_deceased: "SPOUSE", loss_type: "ANTICIPATED_ILLNESS", contact_name: "Ben Vance", contact_email: "ben.vance@example.org" }
              as: ReferralSource
              captures: { err: $.data.error_id }
            - call: "POST /bereavement/referrals/${ref1_id}/decline"
              payload: { decline_reason: "DUPLICATE" }
              as: IntakeCoordinator
            - call: "POST /bereavement/referrals"
              payload: { source_type: "FUNERAL_HOME", source_org_name: "Calder Funeral Home", decedent_name: "Ann Vance", date_of_death: "2026-06-01", relationship_to_deceased: "SPOUSE", loss_type: "ANTICIPATED_ILLNESS", contact_name: "Ben Vance", contact_email: "ben.vance@example.org" }
              as: ReferralSource
              captures: { ref2_id: $.data.id }
          assert:
            - "The first trigger call returns HTTP 409"
            - "err == ERR_DUPLICATE_REFERRAL"
            - "Referral.${ref1_id}.status == DECLINED"
            - "The third trigger call returns HTTP 201"
            - "Referral.${ref2_id}.status == RECEIVED"
            - "GET /bereavement/referrals returns exactly 2 rows"

      - name: exit_assessment_before_any_baseline_returns_assessment_sequence_invalid
        claim_type: Cascading Validation
        grounds: ["validations[priority=13]", "errors[ERR_ASSESSMENT_SEQUENCE_INVALID]", "entities.Assessment.fields.kind"]
        distinguishing_aspect: "An EXIT Assessment recorded for a Participant with only a NEEDS row returns ERR_ASSESSMENT_SEQUENCE_INVALID (422); recording a BASELINE first makes the identical EXIT call succeed."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One accepted Participant with exactly one NEEDS Assessment and no BASELINE row."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/referrals"
              payload: { source_type: "SELF", decedent_name: "Elin Roos", date_of_death: "2026-05-20", relationship_to_deceased: "SPOUSE", loss_type: "SUDDEN_DEATH", contact_name: "Finn Roos", contact_email: "finn.roos@example.org" }
              as: ReferralSource
              captures: { ref_id: $.data.id }
            - call: "POST /bereavement/referrals/${ref_id}/screen"
              payload: { eligibility_note: "ok" }
              as: IntakeCoordinator
            - call: "POST /bereavement/referrals/${ref_id}/accept"
              payload: {}
              as: IntakeCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /bereavement/participants/${p_id}/assessments"
              payload: { kind: "NEEDS", instrument: "ICG_SF", grief_severity: 20, isolation_index: 8, functional_impairment: 8, suicidality_flag: false }
              as: IntakeCoordinator
          trigger:
            - call: "POST /bereavement/participants/${p_id}/assessments"
              payload: { kind: "EXIT", instrument: "ICG_SF", grief_severity: 10, isolation_index: 4, functional_impairment: 4, suicidality_flag: false }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /bereavement/participants/${p_id}/assessments"
              payload: { kind: "BASELINE", instrument: "ICG_SF", grief_severity: 20, isolation_index: 8, functional_impairment: 8, suicidality_flag: false }
              as: IntakeCoordinator
              captures: { base_id: $.data.id }
            - call: "POST /bereavement/participants/${p_id}/assessments"
              payload: { kind: "EXIT", instrument: "ICG_SF", grief_severity: 10, isolation_index: 4, functional_impairment: 4, suicidality_flag: false }
              as: IntakeCoordinator
              captures: { exit_id: $.data.id }
          assert:
            - "The first trigger call returns HTTP 422"
            - "err == ERR_ASSESSMENT_SEQUENCE_INVALID"
            - "The third trigger call returns HTTP 201"
            - "Participant.${p_id}.baseline_score == 45.00"
            - "Participant.${p_id}.latest_score == 22.50"
            - "Participant.${p_id}.composite_need_index == 45.00"
            - "GET /bereavement/participants/${p_id}/assessments returns exactly 3 rows"

      - name: group_program_allocation_against_a_forming_cohort_returns_cohort_not_fundable
        claim_type: Cross-entity Validation
        grounds: ["errors[ERR_COHORT_NOT_FUNDABLE]", "validations[priority=9]", "state_machines.Cohort.FORMING_to_OPEN_ENROLLMENT"]
        distinguishing_aspect: "A GROUP_PROGRAM allocation may only target a Cohort in OPEN_ENROLLMENT, RUNNING or SUSPENDED; against a FORMING cohort it returns ERR_COHORT_NOT_FUNDABLE (409) even though the award has 5000000 cents available, and the identical call succeeds once the cohort is opened."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "A GrantAward with awarded_cents 5000000, allowed_categories [GROUP_PROGRAM] and period 2026-01-01..2026-12-31."
            - "One Cohort with seats_total 4 and direct_cost_cents 240000 left in FORMING, so seats_filled and seats_held are both 0."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/meeting-spaces"
              payload: { name: "Chapel Room", capacity: 20, turnover_buffer_minutes: 30 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
            - call: "POST /bereavement/grant-awards"
              payload: { funder_name: "Hollis Foundation", award_reference: "HF-2026-FORM", awarded_cents: 5000000, allowed_categories: ["GROUP_PROGRAM"], period_start: "2026-01-01", period_end: "2026-12-31", indirect_rate_bps: 1200 }
              as: ProgramDirector
              captures: { g_id: $.data.id, g_v1: $.data.version }
            - call: "POST /bereavement/cohorts"
              payload: { name: "Not Fundable Yet", loss_type: "ANTICIPATED_ILLNESS", meeting_space_id: "${sp_id}", seats_total: 4, min_viable_enrollment: 1, weekday: "TUE", start_minute_utc: 600, duration_minutes: 90, series_start_date: "2026-09-08", sessions_total: 8, direct_cost_cents: 240000 }
              as: ProgramDirector
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /bereavement/funding-allocations"
              payload: { grant_award_id: "${g_id}", category: "GROUP_PROGRAM", cohort_id: "${c_id}", expected_grant_award_version: "${g_v1}" }
              as: ProgramDirector
              captures: { err: $.data.error_id }
            - call: "POST /bereavement/cohorts/${c_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - call: "POST /bereavement/funding-allocations"
              payload: { grant_award_id: "${g_id}", category: "GROUP_PROGRAM", cohort_id: "${c_id}", expected_grant_award_version: "${g_v1}" }
              as: ProgramDirector
              captures: { alloc_id: $.data.id, prov: $.data.provisional_cents }
          assert:
            - "The first trigger call returns HTTP 409"
            - "err == ERR_COHORT_NOT_FUNDABLE"
            - "err != ERR_GRANT_FUNDS_INSUFFICIENT"
            - "The third trigger call returns HTTP 201"
            - "prov == 0"
            - "FundingAllocation.${alloc_id}.basis == PROJECTED_ENROLLMENT"
            - "FundingAllocation.${alloc_id}.status == COMMITTED"
            - "GrantAward.${g_id}.committed_cents == 0"
            - "GrantAward.${g_id}.available_cents == 5000000"

  # ===================================================================
  - section: endpoints
    instances:

      - name: response_envelope_shape_is_identical_for_object_and_array_reads
        claim_type: Standard CRUD
        grounds: ["response_envelope", "endpoints.GET_/bereavement/referrals", "endpoints.GET_/bereavement/referrals/{id}"]
        distinguishing_aspect: "Both reads wrap their payload in meta.api_request_id / meta.api_request_timestamp; the single read carries response_type object with data as a mapping, and the list carries response_type array with data as a JSON array plus limit, offset, total_count and has_more."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One RECEIVED Referral."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/referrals"
              payload: { source_type: "SELF", decedent_name: "Elin Roos", date_of_death: "2026-05-20", relationship_to_deceased: "SPOUSE", loss_type: "SUDDEN_DEATH", contact_name: "Finn Roos", contact_email: "finn.roos@example.org" }
              as: ReferralSource
              captures: { ref_id: $.data.id }
          trigger:
            - call: "GET /bereavement/referrals/${ref_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { got_id: $.data.id }
            - call: "GET /bereavement/referrals"
              payload: {}
              as: IntakeCoordinator
              captures: { first_id: "$.data[0].id" }
          assert:
            - "got_id == ${ref_id}"
            - "The single read has response_type object and a non-null meta.api_request_id"
            - "The list read has response_type array, total_count 1, limit 10, offset 0 and has_more false"
            - "first_id == ${ref_id}"

      - name: participants_list_pagination_honours_limit_and_offset_defaults
        claim_type: Standard CRUD
        grounds: [response_envelope, endpoints.GET_/bereavement/participants]
        distinguishing_aspect: "With 3 accepted Participants, GET /bereavement/participants with no query returns all 3 under the default limit 10 / offset 0 with has_more false, and limit=2&offset=0 returns 2 rows with total_count 3 and has_more true."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Three accepted Participants."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/referrals"
              payload: { source_type: "SELF", decedent_name: "D One", date_of_death: "2026-06-01", relationship_to_deceased: "SPOUSE", loss_type: "SUDDEN_DEATH", contact_name: "P One", contact_email: "p.one@example.org" }
              as: ReferralSource
              captures: { r1_id: $.data.id }
            - call: "POST /bereavement/referrals/${r1_id}/screen"
              payload: { eligibility_note: "ok" }
              as: IntakeCoordinator
            - call: "POST /bereavement/referrals/${r1_id}/accept"
              payload: {}
              as: IntakeCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /bereavement/referrals"
              payload: { source_type: "SELF", decedent_name: "D Two", date_of_death: "2026-06-02", relationship_to_deceased: "CHILD", loss_type: "SUDDEN_DEATH", contact_name: "P Two", contact_email: "p.two@example.org" }
              as: ReferralSource
              captures: { r2_id: $.data.id }
            - call: "POST /bereavement/referrals/${r2_id}/screen"
              payload: { eligibility_note: "ok" }
              as: IntakeCoordinator
            - call: "POST /bereavement/referrals/${r2_id}/accept"
              payload: {}
              as: IntakeCoordinator
              captures: { p2_id: $.data.id }
            - call: "POST /bereavement/referrals"
              payload: { source_type: "SELF", decedent_name: "D Three", date_of_death: "2026-06-03", relationship_to_deceased: "SIBLING", loss_type: "PERINATAL", contact_name: "P Three", contact_email: "p.three@example.org" }
              as: ReferralSource
              captures: { r3_id: $.data.id }
            - call: "POST /bereavement/referrals/${r3_id}/screen"
              payload: { eligibility_note: "ok" }
              as: IntakeCoordinator
            - call: "POST /bereavement/referrals/${r3_id}/accept"
              payload: {}
              as: IntakeCoordinator
              captures: { p3_id: $.data.id }
          trigger:
            - call: "GET /bereavement/participants"
              payload: {}
              as: IntakeCoordinator
            - call: "GET /bereavement/participants?limit=2&offset=0"
              payload: {}
              as: IntakeCoordinator
            - call: "GET /bereavement/participants?loss_type=PERINATAL"
              payload: {}
              as: IntakeCoordinator
              captures: { only_id: "$.data[0].id" }
          assert:
            - "The first call returns 3 rows with limit 10, offset 0, total_count 3 and has_more false"
            - "The second call returns 2 rows with limit 2, offset 0, total_count 3 and has_more true"
            - "The third call returns exactly 1 row and only_id == ${p3_id}"

      - name: participants_list_with_limit_above_max_returns_invalid_request
        claim_type: Standard CRUD
        grounds: ["response_envelope", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "The declared pagination bounds are min 1 and max 100, so limit=101 returns ERR_INVALID_REQUEST (422) rather than silently clamping to 100."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "GET /bereavement/participants?limit=101"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "err == ERR_INVALID_REQUEST"

      - name: logical_clock_defaults_to_the_declared_startup_instant
        claim_type: Computed Read
        grounds: [endpoints.POST_/bereavement/_clock/set_current_utc, calculations.referral_screening_band]
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z: screening a referral with date_of_death 2026-07-02 on a freshly started server stores days_since_death 30 and screening_band URGENT, independent of real wall-clock time."
        test_recipe:
          setup:
            - "A freshly started server whose logical clock has never been set."
          setup_api_calls:
            - call: "POST /bereavement/referrals"
              payload: { source_type: "SELF", decedent_name: "Default Clock", date_of_death: "2026-07-02", relationship_to_deceased: "SPOUSE", loss_type: "SUDDEN_DEATH", contact_name: "Clock Tester", contact_email: "clock.tester@example.org" }
              as: ReferralSource
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /bereavement/referrals/${ref_id}/screen"
              payload: { eligibility_note: "default clock probe" }
              as: IntakeCoordinator
              captures: { dsd: $.data.days_since_death, band: $.data.screening_band }
          assert:
            - "dsd == 30"
            - "band == URGENT"
            - "Referral.${ref_id}.created_at == 2026-08-01T00:00:00.000Z"

      - name: outcome_summary_computed_read_returns_both_variants
        claim_type: Computed Read
        grounds: ["endpoints.GET_/bereavement/participants/{id}/outcome-summary"]
        excluded_because:
          difficulty_instance: dual_variant_calc / outcome_raw_delta_vs_attendance_adjusted_delta_on_participant_scores
          rationale: "That §1.8 instance already pins every field of the outcome-summary computed read to literals (-25.00 raw, -16.80 adjusted, 3.00 correction)."

  # ===================================================================
  - section: errors
    instances:

      - name: referral_screen_with_unknown_id_returns_referral_not_found
        claim_type: Violation to Error
        grounds: ["errors[ERR_REFERRAL_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "An unused UUID in the path of the screen action returns ERR_REFERRAL_NOT_FOUND (404) at priority 5, before the state rule that would otherwise complain about the missing RECEIVED status."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
