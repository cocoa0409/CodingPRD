              as: Student
              as_user_id: "${s_gd}"
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s_gd}", course_id: "${kB}", term_id: "${term12}", priority_rank: 2 }
              as: Student
              as_user_id: "${s_gd}"
              captures: { rqB: "$.data.id" }
            - call: "POST /scheduling/course-requests/${rqB}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_gd}"
            - call: "POST /scheduling/terms/${term12}/close-collection"
              payload: {}
              as: Administrator
            - call: "POST /scheduling/terms/${term12}/generate-sections"
              payload: {}
              as: Administrator
            - call: "POST /scheduling/teachers"
              payload: { full_name: "T Grid", max_sections: 5 }
              as: Administrator
              captures: { t_grid: "$.data.id" }
            - call: "POST /scheduling/teachers/${t_grid}/qualifications"
              payload: { course_id: "${kA}", qualified_at: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /scheduling/teachers/${t_grid}/qualifications"
              payload: { course_id: "${kB}", qualified_at: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /scheduling/rooms"
              payload: { room_number: "GR-1", capacity: 32, room_type: "STANDARD" }
              as: Administrator
              captures: { rm_grid: "$.data.id" }
            - call: "POST /scheduling/rooms"
              payload: { room_number: "GR-2", capacity: 32, room_type: "STANDARD" }
              as: Administrator
              captures: { rm_grid2: "$.data.id" }
          trigger:
            - call: "GET /scheduling/sections"
              as: Administrator
              captures: { sec_a: "$.data[0].id", sec_b: "$.data[1].id" }
            - call: "GET /scheduling/terms/${term12}"
              as: Administrator
              captures: { term12_v: "$.data.version" }
            - call: "PATCH /scheduling/sections/${sec_a}"
              payload: { teacher_id: "${t_grid}", room_id: "${rm_grid}", period: 3, capacity: 32, expected_term_version: "${term12_v}" }
              as: Administrator
            - call: "GET /scheduling/terms/${term12}"
              as: Administrator
              captures: { term12_v2: "$.data.version" }
