      - name: higher_priority_error_wins_when_two_rules_are_violated
        claim_type: priority_ordering
        grounds:
          - validations
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / execute_state_50_outranks_accreditation_60
          rationale: "That instance violates the priority-50 state rule and the priority-60 accreditation rule in one request and asserts the priority-50 error, then repairs the state rule and shows the priority-60 error surface."
      - name: adjacent_priority_pair_resolves_deterministically
        claim_type: priority_conflict
        grounds:
          - validations
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / confirm_referential_71_outranks_temporal_74
          rationale: "That instance pairs the priority-71 referential rule with the priority-74 temporal rule on the same confirm request and asserts both orders of resolution."
      - name: a_legal_write_can_create_a_future_conflict
        claim_type: temporal_validation
        grounds:
          - validations[priority=84, error_id=ERR_QUARANTINE_ROOM_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / quarantine_room_half_open_window_with_phase_conditional_buffer
          rationale: "That instance books a legal occupancy and then shows the later request that collides with it, including the buffer days the first occupancy's phase adds."
