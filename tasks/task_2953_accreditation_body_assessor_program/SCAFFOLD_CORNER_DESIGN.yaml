        assert: ['the first call, whose X-User-Role header is the empty string "", returns HTTP 401 with data.error_id == "ERR_UNAUTHENTICATED"', 'the second call, whose X-User-Role is LeadAssessor but whose X-User-ID header is the empty string "", also returns HTTP 401 with data.error_id == "ERR_UNAUTHENTICATED"', neither 401 response body carries a data.items array or any pagination field, 'the third call, sent with X-User-Role SchemeManager, returns HTTP 200 with total_count == 1', 'authentication is decided before pagination: sending limit=0 together with the empty role still yields ERR_UNAUTHENTICATED, not ERR_INVALID_PAGINATION']
    - name: list_schemes_with_limit_outside_the_declared_window_rejected
