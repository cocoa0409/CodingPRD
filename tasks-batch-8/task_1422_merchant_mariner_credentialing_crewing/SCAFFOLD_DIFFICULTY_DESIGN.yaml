            - { call: "GET /assignments/${a2_id}", as: CrewingManager, captures: { a2_status: $.data.assignment_status } }
          assert:
            - "dt_status == COMPLETED (hop 0/1: the recording itself)"
            - "m_posture == BLOCKED and m_reasons contains DRUG_RESULT_POSITIVE (hop 2)"
            - "m_until == 2027-01-02T00:00:00Z (unchanged: POSITIVE never extends the currency window)"
            - "a1_status == SUSPENDED and a2_status == SUSPENDED (hop 3 fans to BOTH future CONFIRMED assignments)"
      - name: no_show_strike_privileges_cascade
        grounds:
          - state_machines.TrainingEnrollment.ENROLLED_to_NO_SHOW
          - entities.Mariner.fields.no_show_strike_count
          - entities.Mariner.fields.training_privileges
        distinguishing_aspect: |
          Depth-3 cascade from a third distinct trigger (record-completion NO_SHOW):
          enrollment -> NO_SHOW releases its budget reservation; the strike mutation
          (no_show_strike_count 1->2) itself triggers training_privileges SUSPENDED; that flip
          cascades to OTHER enrollments (REQUESTED -> REJECTED, APPROVED -> CANCELLED). The
          NO_SHOW course keeps its seat (seats_reserved unchanged) while budget is released.
        test_recipe:
          setup:
            - "M activated; courses CD, CA, CB, CC (cost 100000 each, capacity 5)"
            - "eD ENROLLED then NO_SHOW (strike 1, reservation released)"
            - "eA ENROLLED (reserved 80000), eB REQUESTED, eC APPROVED"
