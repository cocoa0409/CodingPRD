        grounds:
          - roles.ParticipantAdmin.identity
          - validations[priority=25]
          - errors[ERR_PARTICIPANT_SCOPE_VIOLATION]
        distinguishing_aspect: "ParticipantAdmin is entity-backed, so holding the role is not enough: the X-User-ID must equal the participant that owns the resource. Beta's administrator invoking Beta's own exclusive operation, but naming Alpha in the body, is refused at 403 - and the check reads the body participant_id, not the path."
        test_recipe:
