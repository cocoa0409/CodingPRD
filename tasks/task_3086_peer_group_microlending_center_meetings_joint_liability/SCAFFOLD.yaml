    roles: [Member]
    code: 201
    input: [decision]
    output: ConsensusVote
    side_effects: ["unanimous 4th APPROVE: application -> APPROVED", "any REJECT: application -> REJECTED"]

  - method: GET
    path: "/loan-applications/{id}/votes"
    description: "List votes on an application"
    roles: [ProgramAdmin, BranchManager, CenterManager, FieldOfficer, Member]
    code: 200
    input: []
    output: "ConsensusVote[]"
    side_effects: []

  - method: GET
    path: "/loan-applications/{id}/loan"
    description: "Get the loan created by this application's disbursement (array of 0 or 1)"
    roles: [ProgramAdmin, BranchManager, CenterManager, FieldOfficer, Member]
    code: 200
    input: []
    output: "Loan[]"
    side_effects: []

  - method: POST
    path: "/loan-applications/{id}/disburse"
    description: "Disburse an APPROVED application: creates the Loan, opens the savings account, files the PROVISIONAL bureau report"
    roles: [BranchManager]
    code: 200
    input: []
    output: Loan
    side_effects: ["application -> DISBURSED", "Loan created ACTIVE", "member ELIGIBLE -> ACTIVE_BORROWER", "SavingsAccount opened", "CreditBureauReport PROVISIONAL created", "applied_ceiling_cents recorded"]

  # --- Loans ---
  - method: GET
