            - "${e9} == ERR_DRAWING_NOT_FOUND, ${e10} == ERR_WINDOW_NOT_FOUND, ${e11} == ERR_PUNCH_ITEM_NOT_FOUND"
            - "all eleven codes are pairwise distinct - a single shared ERR_NOT_FOUND fails this instance"
            - "${e12} == ERR_ZONE_NOT_FOUND, not ERR_PROJECT_NOT_FOUND and not ERR_CASE_NOT_FOUND - the path project resolves, so the failure belongs to the body-supplied zone_id"
            - "${e13} == ERR_ARTIFACT_NOT_FOUND - and it is a 404 even though expected_case_version is correct, because existence at priority 13 runs before the version check at priority 25"
            - "no row was created by either failing POST: GET /gallery-zones/${zone1}/artifact-cases still returns exactly the one seeded case and its placed_artifact_count is still 0"

      - name: each_missing_required_field_is_rejected_with_invalid_request_before_existence
        claim_type: required_fields
        grounds:
          - validations.priority_6
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/exhibit-projects
          - endpoints.POST_/exhibit-projects/{id}/design-packages
          - endpoints.POST_/shop-drawings/{id}/decision
        distinguishing_aspect: |
          Priority 6 sits above every existence check (8-18) and above the
          optimistic-concurrency checks (24-25), so a request that is missing a
          required field must be a flat 400 even when the id in its path does not
          exist and even when the omitted field is the OCC token itself. That
          ordering is the whole point: an implementation that resolves the path row
          first answers 404, and one that reads expected_project_version as "absent
          means don't care" answers 201. A field present but explicitly null is also
          missing - "present and non-null" is the wording of the rule.
        test_recipe:
          setup:
            - "one project in INTERPRETIVE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /exhibit-projects"
              payload: { name: "No Money Hall", museum_name: "Ridgeline Museum", storyline_title: "Untitled", objective_codes: ["OBJ-A"], target_open_date: "2027-05-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { r1: $.data.error_id }
            - call: "POST /exhibit-projects"
              payload: { name: null, museum_name: "Ridgeline Museum", storyline_title: "Untitled", objective_codes: ["OBJ-A"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 500000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { r2: $.data.error_id }
            - call: "POST /exhibit-projects/${proj}/artifacts"
              payload: { accession_number: "2019.99.1", material_class: "PAPER", required_rh_min_pct: 45.0, required_rh_max_pct: 55.0, max_lux: 50.0, condition_status: "STABLE" }
              as: Curator
              as_user_id: cur-01
              captures: { r3: $.data.error_id }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { r4: $.data.error_id }
            - call: "POST /shop-drawings/%(U)s/decision"
              payload: { decision: "APPROVE" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { r5: $.data.error_id }
            - call: "POST /design-packages/%(U)s/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager"] }
              as: ProjectManager
              as_user_id: pm-01
              captures: { r6: $.data.error_id }
            - call: "GET /exhibit-projects"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { rows: $.data }
          assert:
            - "${r1} == ERR_INVALID_REQUEST with HTTP 400 - contract_value_cents omitted"
            - "${r2} == ERR_INVALID_REQUEST with HTTP 400 - an explicit null is not a present value"
            - "${r3} == ERR_INVALID_REQUEST with HTTP 400 - security_class omitted"
            - "${r4} == ERR_INVALID_REQUEST with HTTP 400 and NOT ERR_STALE_PROJECT_VERSION 412 - the OCC token is a required field, so its absence is a shape error at priority 6, not a version mismatch at priority 24"
            - "${r5} == ERR_INVALID_REQUEST with HTTP 400 and NOT ERR_DRAWING_NOT_FOUND 404 - actual_shop_hours and actual_waste_factor are conditionally required whenever decision == APPROVE, and priority 6 precedes priority 16"
            - "${r6} == ERR_INVALID_REQUEST with HTTP 400 and NOT ERR_PACKAGE_NOT_FOUND 404 - decision_deadline_at omitted"
            - "${rows} still contains exactly the one seeded project - none of the six rejected requests created a row"

      - name: undeclared_enums_out_of_domain_numbers_and_the_exclusive_or_pairs_are_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_6
          - entities.Artifact.fields.material_class
          - entities.GalleryZone.fields.visitor_route_order
          - entities.ShopDrawing.subject_case_id
          - entities.PunchItem.interactive_id
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          The §1.1 constraint column carries three shapes that a JSON-schema-only
          implementation will miss: a cross-field inequality
          (required_rh_max_pct > required_rh_min_pct), closed numeric domains that
          are exclusive on one end and inclusive on the other (max_noise_dba > 0,
          case_slot_capacity between 1 and 20 inclusive, dust buffer 0-480
          inclusive), and two exclusive-or pairs where BOTH supplied and NEITHER
          supplied are equally invalid. Every one of them is the same 400 code, so
          the discriminating power is in which requests are refused, not in which
          code comes back.
        test_recipe:
          setup:
            - "one project advanced to SCHEMATIC so that zone, artifact and case creates are phase-legal and the only remaining objection can be the field domain"
