      - name: tuition_and_aid_run_errors_are_each_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PAYMENT_EXCEEDS_BALANCE]
          - errors[ERR_ASSESSMENT_ALREADY_FINAL]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations[priority 47]
          - validations[priority 52]
          - validations[priority 82]
          - calculations.tuition_assessment
          - calculations.aid_award_waterfall
        distinguishing_aspect: |
          Overpayment is refused, not credited: 123224 against a 123223 balance is 422
          ERR_PAYMENT_EXCEEDS_BALANCE. The FINAL assessment is computed exactly once -
          123223 gross with no sibling discount and one year of loyalty credit
          (round(123223 x 0.015) = 1848) gives assessed_cents 121375 - and the second
          finalize call is 409 ERR_ASSESSMENT_ALREADY_FINAL. Finally the award run enforces
          segregation of duties on identity: fin-reviewer-1, who moved the request to
          UNDER_REVIEW, is refused with 403 ERR_SEGREGATION_OF_DUTIES, while fin-director-9
          executes the identical call and grants min(40000 requested, 30000 per-account
          ceiling, 100000 remaining) = 30000.
        test_recipe:
          setup:
            - "Season in IN_SEASON with tuition_base_cents 123223, tuition_due_at 2026-12-01"
            - "and aid_budget_cents 100000. Ada Strings (household_income_band BAND_B,"
            - "years_in_org 1, no sibling, no loan) is seated in the PHILHARMONIC tier with a"
            - "CURRENT account: assessment_variant PRELIMINARY, assessed_cents 123223,"
            - "balance_cents 123223, aid_status NONE. The clock reads 2026-08-05T09:00:00Z."
