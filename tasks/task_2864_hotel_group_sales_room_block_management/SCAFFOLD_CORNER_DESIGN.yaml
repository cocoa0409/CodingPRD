    grounds:
    - state_machines.GroupContract[SENT -> SIGNED]
    - state_machines.RoomBlock[OPEN -> CUT_OFF]
    excluded_because:
      difficulty_instance: cascading_side_effects / contract_sign_cascade_four_hops_block_inventory_hold_and_function_space
      rationale: Both four-hop chains are already walked hop by hop in §1.8 — the sign cascade in the
        named instance and the cutoff cascade in block_cutoff_cascade_four_hops_through_sub_block_to_inventory
        — and block_night_room_conservation_survives_cancel_then_cutoff covers the ordering sensitivity
        between them. A separate breadth instance would only re-assert the same hops.
