          - entities.PracticeSession.fields.scheduled_end
          - endpoints.POST_practice-sessions
        distinguishing_aspect: |
          The contended resource is the coach credential and the interval semantics are HALF-OPEN WITH A
          15-MINUTE BUFFER on both sides: an existing 10:00-11:00 session reserves
          [09:45, 11:15). A new session starting 11:10 collides (409 ERR_COACH_SESSION_OVERLAP), while one
          starting at exactly 11:15 - the instant the buffered interval opens - is accepted, so the
          boundary instant belongs to the newcomer.
        test_recipe:
          setup:
            - "Program with one CERTIFIED coach credential and one PRACTICE_OPEN season"
            - "One SCHEDULED session for that credential on 2026-09-10 from 10:00 to 11:00, whose buffered reservation is [09:45, 11:15)"
