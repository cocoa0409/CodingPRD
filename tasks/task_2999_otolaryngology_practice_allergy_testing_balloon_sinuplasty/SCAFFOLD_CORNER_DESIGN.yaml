              as: PracticeAdmin
              captures: { pat_3: $.data.id }
            - call: "POST /surgery-center-blocks"
              payload: { center_name: "Eastside Surgery Center", block_start_at: "2026-08-10T08:00:00Z", block_end_at: "2026-08-10T12:00:00Z", max_concurrent_cases: 2 }
              as: PracticeAdmin
              captures: { block_id: $.data.id, cap_0: $.data.capacity_minutes }
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_1}", procedure_type: "TYMPANOSTOMY_TUBES", venue: "SURGERY_CENTER", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T12:00:00Z", physician_user_id: "u_ent_1", surgery_center_block_id: "${block_id}" }
              as: PracticeAdmin
              captures: { book_1: $.data.id }
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_2}", procedure_type: "TYMPANOSTOMY_TUBES", venue: "SURGERY_CENTER", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T12:00:00Z", physician_user_id: "u_ent_1", surgery_center_block_id: "${block_id}" }
              as: PracticeAdmin
              captures: { book_2: $.data.id }
            - call: "GET /surgery-center-blocks/${block_id}"
              payload: {}
              as: PracticeAdmin
              captures: { booked_full: $.data.booked_minutes, util_full: $.data.utilization_bps, status_full: $.data.status }
          trigger:
            - call: "POST /procedure-bookings/${book_2}/cancel"
              payload: { cancel_reason: "PATIENT_REQUEST" }
              as: PracticeAdmin
            - call: "GET /surgery-center-blocks/${block_id}"
              payload: {}
              as: PracticeAdmin
              captures: { booked_after: $.data.booked_minutes, util_after: $.data.utilization_bps, status_after: $.data.status }
