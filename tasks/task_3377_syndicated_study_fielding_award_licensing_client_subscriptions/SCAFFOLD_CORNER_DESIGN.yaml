# =============================================================================
# 1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7 beyond the nine Difficulty Rules.
# Same replay rules as §1.8: every chain drives empty-DB -> precondition using
# only §1.5 endpoints; literals wherever author-determinable.
# =============================================================================
scaffold_corner_design:
  # ------------------------------------------------------------- entities ---
  - section: entities
    instances:
      - name: create_study_applies_defaults_and_initial_state
        claim_type: creation
        grounds: ["entities.Study", "state_machines.Study"]
        distinguishing_aspect: "A valid create returns 201 with system fields initialized: status DRAFT, version 1, active_methodology_id null, published_at null."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/studies"
              payload: { code: "VDS-2026", name: "2026 Vehicle Dependability", industry_code: "AUTO", cycle_year: 2026, min_sample_per_brand: 3, significance_alpha: 0.05, embargo_lift_at: "2026-10-15T00:00:00Z" }
              as: StudyAdmin
              captures: { sid: $.data.id }
          trigger:
            - { call: "GET /research/studies/${sid}", payload: {}, as: StudyAdmin }
          assert:
            - "Study.status == DRAFT and version == 1"
            - "active_methodology_id is null and published_at is null"
            - "created_at == 2026-09-01T00:00:00Z (logical clock, not wall clock)"

      - name: study_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Study.fields.embargo_lift_at", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input embargo_lift_at is a 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
          trigger:
            - call: "POST /research/studies"
              payload: { code: "VDS-2026", name: "2026 Vehicle Dependability", industry_code: "AUTO", cycle_year: 2026, min_sample_per_brand: 3, significance_alpha: 0.05 }
              as: StudyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST with http 400; no Study is created"

      - name: system_fields_input_ignored_on_brand_create
        claim_type: system_fields
        grounds: ["entities.Brand"]
        distinguishing_aspect: "Client-supplied id/version/created_at on create are ignored; the server mints its own."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
          trigger:
            - call: "POST /research/brands"
              payload: { name: "BrandA", industry_code: "AUTO", id: "00000000-0000-0000-0000-000000000000", version: 99, created_at: "1999-01-01T00:00:00Z" }
              as: StudyAdmin
              captures: { bid: $.data.id }
          assert:
            - "201; Brand.id != 00000000-0000-0000-0000-000000000000 (server-minted), version == 1, created_at == 2026-09-01T00:00:00Z"

      - name: get_nonexistent_study_returns_not_found
        claim_type: not_found
        grounds: ["entities.Study", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A well-formed UUID that does not exist returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
          trigger:
            - call: "GET /research/studies/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: StudyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND with http 404"

  # -------------------------------------------------------- state_machines ---
  - section: state_machines
    instances:
      - name: draft_to_fielding_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Study", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DRAFT -> FIELDING is not a transition (FIELDING requires DESIGN_LOCKED via pin); rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["one study in DRAFT, no methodology"]
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/studies"
              payload: { code: "VDS-2026", name: "2026 Vehicle Dependability", industry_code: "AUTO", cycle_year: 2026, min_sample_per_brand: 3, significance_alpha: 0.05, embargo_lift_at: "2026-10-15T00:00:00Z" }
              as: StudyAdmin
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /research/studies/${sid}/state"
              payload: { to_status: "FIELDING" }
              as: StudyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE; Study.status stays DRAFT"

      - name: design_locked_reachable_only_via_pin
        claim_type: invalid_transition
        grounds: ["state_machines.Study.DRAFT_to_DESIGN_LOCKED"]
        distinguishing_aspect: "POST .../state {to_status: DESIGN_LOCKED} is rejected even from DRAFT — the state is pin-cascade only."
        test_recipe:
          setup: ["one study in DRAFT"]
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/studies"
              payload: { code: "VDS-2026", name: "2026 Vehicle Dependability", industry_code: "AUTO", cycle_year: 2026, min_sample_per_brand: 3, significance_alpha: 0.05, embargo_lift_at: "2026-10-15T00:00:00Z" }
              as: StudyAdmin
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /research/studies/${sid}/state"
              payload: { to_status: "DESIGN_LOCKED" }
              as: StudyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE; Study.status stays DRAFT"

      - name: cancelled_study_is_terminal
        claim_type: terminal_lockdown
        grounds: ["state_machines.Study.DRAFT_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From CANCELLED no further transition is defined; FIELDING attempt returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["one study cancelled from DRAFT"]
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/studies"
              payload: { code: "VDS-2026", name: "2026 Vehicle Dependability", industry_code: "AUTO", cycle_year: 2026, min_sample_per_brand: 3, significance_alpha: 0.05, embargo_lift_at: "2026-10-15T00:00:00Z" }
              as: StudyAdmin
              captures: { sid: $.data.id }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "CANCELLED" }, as: StudyAdmin }
          trigger:
            - call: "POST /research/studies/${sid}/state"
              payload: { to_status: "FIELDING" }
              as: StudyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE; Study.status stays CANCELLED"

      - name: cancel_from_fielding_closes_open_frames
        claim_type: side_effect_execution
        grounds: ["state_machines.Study.FIELDING_to_CANCELLED", "state_machines.SampleFrame.OPEN_to_CLOSED"]
        distinguishing_aspect: "Cancellation cascade: every OPEN frame of the study flips to CLOSED; already-CLOSED frames are unaffected."
        test_recipe:
          setup: ["Study in FIELDING with two OPEN frames (BrandA PANEL, BrandB CUSTOMER_LIST)"]
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/studies"
              payload: { code: "VDS-2026", name: "2026 Vehicle Dependability", industry_code: "AUTO", cycle_year: 2026, min_sample_per_brand: 3, significance_alpha: 0.05, embargo_lift_at: "2026-10-15T00:00:00Z" }
              as: StudyAdmin
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /research/methodology-versions"
              payload: { study_id: "${sid}", change_class: "FULL_COMPARABLE", min_duration_seconds: 180, straightline_min_items: 12, pooled_sd_1000: 60, z_value: 1.96, tie_epsilon: 3, factors: [ { code: "QUAL", name: "Quality & Reliability", weight_bp: 6000, ordinal: 1 }, { code: "FEAT", name: "Features & Controls", weight_bp: 4000, ordinal: 2 } ] }
              as: MethodologyLead
              as_user_id: u_ml_001
              captures: { mv: $.data.id }
            - { call: "POST /research/methodology-versions/${mv}/pin", payload: { expected_study_version: "${sv}" }, as: MethodologyLead, as_user_id: u_ml_001 }
            - call: "POST /research/brands"
              payload: { name: "BrandA", industry_code: "AUTO" }
              as: StudyAdmin
              captures: { ba: $.data.id }
            - call: "POST /research/brands"
              payload: { name: "BrandB", industry_code: "AUTO" }
              as: StudyAdmin
              captures: { bb: $.data.id }
            - call: "POST /research/sample-frames"
              payload: { study_id: "${sid}", brand_id: "${ba}", source_type: "PANEL", target_completes: 4 }
              as: FieldOps
              captures: { fa: $.data.id }
            - call: "POST /research/sample-frames"
              payload: { study_id: "${sid}", brand_id: "${bb}", source_type: "CUSTOMER_LIST", target_completes: 4 }
              as: FieldOps
              captures: { fb: $.data.id }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "FIELDING" }, as: StudyAdmin }
          trigger:
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "CANCELLED" }, as: StudyAdmin }
            - { call: "GET /research/sample-frames", payload: { study_id: "${sid}", status: "CLOSED" }, as: FieldOps }
          assert:
            - "Study.status == CANCELLED"
            - "Both ${fa} and ${fb} are CLOSED (filtered list returns exactly 2 rows)"

      - name: repin_supersedes_previous_version
        claim_type: valid_transition
        grounds: ["state_machines.MethodologyVersion.DRAFT_to_PINNED", "state_machines.MethodologyVersion.PINNED_to_SUPERSEDED", "concurrency_rules[mv-pin-stale-study]"]
        distinguishing_aspect: "Re-pin during DESIGN_LOCKED supersedes the prior PINNED version and bumps Study.version again (1 -> 2 -> 3); the OCC happy path."
        test_recipe:
          setup: ["Study with mv1 PINNED (design locked); mv2 drafted afterwards while the study is still DESIGN_LOCKED"]
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/studies"
              payload: { code: "VDS-2026", name: "2026 Vehicle Dependability", industry_code: "AUTO", cycle_year: 2026, min_sample_per_brand: 3, significance_alpha: 0.05, embargo_lift_at: "2026-10-15T00:00:00Z" }
              as: StudyAdmin
              captures: { sid: $.data.id, sv1: $.data.version }
            - call: "POST /research/methodology-versions"
              payload: { study_id: "${sid}", change_class: "FULL_COMPARABLE", min_duration_seconds: 180, straightline_min_items: 12, pooled_sd_1000: 60, z_value: 1.96, tie_epsilon: 3, factors: [ { code: "QUAL", name: "Quality & Reliability", weight_bp: 6000, ordinal: 1 }, { code: "FEAT", name: "Features & Controls", weight_bp: 4000, ordinal: 2 } ] }
              as: MethodologyLead
              as_user_id: u_ml_001
              captures: { mv1: $.data.id }
            - { call: "POST /research/methodology-versions/${mv1}/pin", payload: { expected_study_version: "${sv1}" }, as: MethodologyLead, as_user_id: u_ml_001 }
            - call: "POST /research/methodology-versions"
              payload: { study_id: "${sid}", change_class: "ADJUSTED", change_notes: "rebalanced weights", min_duration_seconds: 200, straightline_min_items: 12, pooled_sd_1000: 60, z_value: 1.96, tie_epsilon: 3, factors: [ { code: "QUAL", name: "Quality & Reliability", weight_bp: 5000, ordinal: 1 }, { code: "FEAT", name: "Features & Controls", weight_bp: 5000, ordinal: 2 } ] }
              as: MethodologyLead
              as_user_id: u_ml_001
              captures: { mv2: $.data.id }
            - call: "GET /research/studies/${sid}"
              payload: {}
              as: StudyAdmin
              captures: { sv2: $.data.version }
          trigger:
            - { call: "POST /research/methodology-versions/${mv2}/pin", payload: { expected_study_version: "${sv2}" }, as: MethodologyLead, as_user_id: u_ml_001 }
            - { call: "GET /research/methodology-versions/${mv1}", payload: {}, as: MethodologyLead }
            - { call: "GET /research/studies/${sid}", payload: {}, as: StudyAdmin }
          assert:
            - "mv2.status == PINNED and mv1.status == SUPERSEDED"
            - "Study.active_methodology_id == ${mv2} and Study.version == 3 (create 1, pin 2, repin 3)"
            - "Study.status remains DESIGN_LOCKED (re-pin does not reopen DRAFT)"

      - name: withdrawn_license_is_terminal
        claim_type: terminal_lockdown
        grounds: ["state_machines.License.QUOTED_to_WITHDRAWN", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal: a subsequent activation attempt returns ERR_INVALID_STATE, not ERR_AWARD_NOT_PUBLISHED or a fee recompute."
        test_recipe:
          setup: ["Study in AWARDS_SET (min_sample 1 chain); a QUOTED license on the fresh award is WITHDRAWN"]
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/studies"
              payload: { code: "VDS-2026", name: "2026 Vehicle Dependability", industry_code: "AUTO", cycle_year: 2026, min_sample_per_brand: 1, significance_alpha: 0.05, embargo_lift_at: "2026-10-15T00:00:00Z" }
              as: StudyAdmin
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /research/methodology-versions"
              payload: { study_id: "${sid}", change_class: "FULL_COMPARABLE", min_duration_seconds: 180, straightline_min_items: 12, pooled_sd_1000: 60, z_value: 1.96, tie_epsilon: 3, factors: [ { code: "QUAL", name: "Quality & Reliability", weight_bp: 6000, ordinal: 1 }, { code: "FEAT", name: "Features & Controls", weight_bp: 4000, ordinal: 2 } ] }
              as: MethodologyLead
              as_user_id: u_ml_001
              captures: { mv: $.data.id }
            - { call: "POST /research/methodology-versions/${mv}/pin", payload: { expected_study_version: "${sv}" }, as: MethodologyLead, as_user_id: u_ml_001 }
            - call: "POST /research/brands"
              payload: { name: "BrandA", industry_code: "AUTO" }
              as: StudyAdmin
              captures: { ba: $.data.id }
            - call: "POST /research/sample-frames"
              payload: { study_id: "${sid}", brand_id: "${ba}", source_type: "PANEL", target_completes: 3 }
              as: FieldOps
              captures: { fa: $.data.id }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "FIELDING" }, as: StudyAdmin }
            - call: "POST /research/responses"
              payload: { frame_id: "${fa}", respondent_token: "rt-1", duration_seconds: 300, item_count: 15, distinct_values: 4, factor_scores: [ { factor_code: "QUAL", score: 9 }, { factor_code: "FEAT", score: 8 } ] }
              as: FieldOps
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "FIELDING_CLOSED" }, as: StudyAdmin }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "SCORING" }, as: StudyAdmin }
            - { call: "POST /research/studies/${sid}/scoring/compute", payload: {}, as: AwardsOfficer, as_user_id: u_ao_001 }
            - { call: "POST /research/studies/${sid}/awards/determine", payload: {}, as: AwardsOfficer, as_user_id: u_ao_001 }
            - call: "GET /research/awards"
              payload: { study_id: "${sid}" }
              as: AwardsOfficer
              captures: { aw: "$.data[0].id" }
            - call: "POST /research/clients"
              payload: { name: "ClientA", client_type: "BRAND", country: "US", brand_id: "${ba}" }
              as: StudyAdmin
              captures: { cl: $.data.id }
            - call: "POST /research/licenses"
              payload: { award_id: "${aw}", client_id: "${cl}", tier: "DIGITAL", term_months: 12, markets_count: 1 }
              as: LicensingManager
              captures: { lic: $.data.id }
            - { call: "POST /research/licenses/${lic}/state", payload: { to_status: "WITHDRAWN" }, as: LicensingManager }
          trigger:
            - call: "POST /research/licenses/${lic}/state"
              payload: { to_status: "ACTIVE" }
              as: LicensingManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE; License.status stays WITHDRAWN and fee_final_cents stays null"

      - name: reopen_without_shortfall_returns_no_shortfall
        claim_type: precondition_enforcement
        grounds: ["state_machines.Study.FIELDING_CLOSED_to_FIELDING", "errors[ERR_NO_SHORTFALL]"]
        distinguishing_aspect: "The cyclic reopen edge is guarded: when every framed brand meets min_sample, reopen fails with ERR_NO_SHORTFALL."
        test_recipe:
          setup: ["Study (min_sample 1) in FIELDING_CLOSED; the single brand has 1 ACCEPTED response (no shortfall)"]
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/studies"
              payload: { code: "VDS-2026", name: "2026 Vehicle Dependability", industry_code: "AUTO", cycle_year: 2026, min_sample_per_brand: 1, significance_alpha: 0.05, embargo_lift_at: "2026-10-15T00:00:00Z" }
              as: StudyAdmin
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /research/methodology-versions"
              payload: { study_id: "${sid}", change_class: "FULL_COMPARABLE", min_duration_seconds: 180, straightline_min_items: 12, pooled_sd_1000: 60, z_value: 1.96, tie_epsilon: 3, factors: [ { code: "QUAL", name: "Quality & Reliability", weight_bp: 6000, ordinal: 1 }, { code: "FEAT", name: "Features & Controls", weight_bp: 4000, ordinal: 2 } ] }
              as: MethodologyLead
              as_user_id: u_ml_001
              captures: { mv: $.data.id }
            - { call: "POST /research/methodology-versions/${mv}/pin", payload: { expected_study_version: "${sv}" }, as: MethodologyLead, as_user_id: u_ml_001 }
            - call: "POST /research/brands"
              payload: { name: "BrandA", industry_code: "AUTO" }
              as: StudyAdmin
              captures: { ba: $.data.id }
            - call: "POST /research/sample-frames"
              payload: { study_id: "${sid}", brand_id: "${ba}", source_type: "PANEL", target_completes: 3 }
              as: FieldOps
              captures: { fa: $.data.id }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "FIELDING" }, as: StudyAdmin }
            - call: "POST /research/responses"
              payload: { frame_id: "${fa}", respondent_token: "rt-1", duration_seconds: 300, item_count: 15, distinct_values: 4, factor_scores: [ { factor_code: "QUAL", score: 9 }, { factor_code: "FEAT", score: 8 } ] }
              as: FieldOps
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "FIELDING_CLOSED" }, as: StudyAdmin }
          trigger:
            - call: "POST /research/studies/${sid}/state"
              payload: { to_status: "FIELDING" }
              as: StudyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NO_SHORTFALL (409); Study.status stays FIELDING_CLOSED and no frame reopens"

      - name: determine_twice_returns_invalid_state
        claim_type: idempotency
        grounds: ["state_machines.Study.SCORED_to_AWARDS_SET", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second awards/determine after the study left SCORED is rejected — award determination is not idempotent-replayable."
        test_recipe:
          setup: ["Study in AWARDS_SET (min_sample 1 chain with one award)"]
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/studies"
              payload: { code: "VDS-2026", name: "2026 Vehicle Dependability", industry_code: "AUTO", cycle_year: 2026, min_sample_per_brand: 1, significance_alpha: 0.05, embargo_lift_at: "2026-10-15T00:00:00Z" }
              as: StudyAdmin
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /research/methodology-versions"
              payload: { study_id: "${sid}", change_class: "FULL_COMPARABLE", min_duration_seconds: 180, straightline_min_items: 12, pooled_sd_1000: 60, z_value: 1.96, tie_epsilon: 3, factors: [ { code: "QUAL", name: "Quality & Reliability", weight_bp: 6000, ordinal: 1 }, { code: "FEAT", name: "Features & Controls", weight_bp: 4000, ordinal: 2 } ] }
              as: MethodologyLead
              as_user_id: u_ml_001
              captures: { mv: $.data.id }
            - { call: "POST /research/methodology-versions/${mv}/pin", payload: { expected_study_version: "${sv}" }, as: MethodologyLead, as_user_id: u_ml_001 }
            - call: "POST /research/brands"
              payload: { name: "BrandA", industry_code: "AUTO" }
              as: StudyAdmin
              captures: { ba: $.data.id }
            - call: "POST /research/sample-frames"
              payload: { study_id: "${sid}", brand_id: "${ba}", source_type: "PANEL", target_completes: 3 }
              as: FieldOps
              captures: { fa: $.data.id }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "FIELDING" }, as: StudyAdmin }
            - call: "POST /research/responses"
              payload: { frame_id: "${fa}", respondent_token: "rt-1", duration_seconds: 300, item_count: 15, distinct_values: 4, factor_scores: [ { factor_code: "QUAL", score: 9 }, { factor_code: "FEAT", score: 8 } ] }
              as: FieldOps
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "FIELDING_CLOSED" }, as: StudyAdmin }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "SCORING" }, as: StudyAdmin }
            - { call: "POST /research/studies/${sid}/scoring/compute", payload: {}, as: AwardsOfficer, as_user_id: u_ao_001 }
            - { call: "POST /research/studies/${sid}/awards/determine", payload: {}, as: AwardsOfficer, as_user_id: u_ao_001 }
          trigger:
            - call: "POST /research/studies/${sid}/awards/determine"
              payload: {}
              as: AwardsOfficer
              as_user_id: u_ao_001
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE; still exactly 1 Award exists for the study"

  # --------------------------------------------------------- calculations ---
  - section: calculations
    instances:
      - name: quality_classification_boundaries
        claim_type: precision
        grounds: ["calculations.response_quality_classification"]
        distinguishing_aspect: "Speeder threshold is strict <: duration 179 REJECTED (SPEEDER), 180 ACCEPTED. Straightline needs item_count >= 12: (distinct 1, items 12) REJECTED STRAIGHTLINE, (distinct 1, items 11) ACCEPTED."
        test_recipe:
          setup: ["Study in FIELDING with one OPEN frame"]
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/studies"
