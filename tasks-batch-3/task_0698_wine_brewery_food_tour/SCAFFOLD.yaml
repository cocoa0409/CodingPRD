# =============================================================================
# PRD Benchmark Seed Tables — Wine, Brewery & Food Tour Operator
# Difficulty tier: Expert (§0.4)
# =============================================================================

scenario: |
  698. Wine, Brewery & Food Tour Operator: tour catalog & itinerary
  (stops/tastings), seat/van capacity & schedule, per-person pricing & private
  charter, age verification & waiver, partner-venue commission & confirmation,
  pickup-point & route, weather/cancellation, gratuity/add-on

domain_name: wine-brewery-food-tour
# Flat topology: peer top-level resource collections (/tour-products, /departures,
# /bookings, /partner-venues, ...). No single nesting resource owns the domain, so
# the api_prefix is the root "/" and every collection sits directly beneath it.
api_prefix: /

complexity_profile:
  primary_archetype: "Quota / allocation (seat & van capacity competed for, reserved, committed, released)"
  secondary_archetype: "Pricing engine (tiered per-person pricing, charter, gratuity/add-on, partner commission)"
  complexity_layers:
    - optimistic_concurrency      # OCC on Departure.version for booking creation (CREATE-with-supersede on a finite seat pool)
    - cascading_side_effects      # departure cancel -> bookings cancel -> refunds + venue-confirmation release
    - dual_variant_calculation    # partner commission: estimated (forward-looking) vs settled (chronological)
    - rate_threshold_triggers     # group-size pricing tiers; lead-time refund thresholds

  entity_topology: flat
  # Peer entities linked by foreign keys; no deep URL nesting. Booking, Departure,
  # Stop, VenueConfirmation, Guest all reference parents by FK in the body.

  state_machine_shape: branching
  # Booking has parallel dimensions (lifecycle + payment); VenueConfirmation has a
  # cyclic request<->revision loop; Departure branches into divergent cancel paths.

  relationship_patterns:
    - one_to_many        # TourProduct -> Departure; Departure -> Booking; Departure -> Stop
    - many_to_many       # Departure <-> PartnerVenue via Stop; Departure <-> add-ons via BookingAddOn
    - cross_aggregate    # Booking references Departure AND PickupPoint AND AddOn

  role_model: peer_roles
  # Operator (runs catalog/departures/ops), Guide (checks guests in, completes),
  # PartnerVenue (confirms/declines its own stop), Guest (books, waives, cancels).

  consistency_model: immediate
  # All seat math, ledger debits, and cascades are atomic within the request.

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: TourProduct
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Catalog name, e.g. 'Napa Cellar Crawl'" }
      - { name: theme, type: enum, source: input, description: "Tour theme", constraints: "WINE | BREWERY | FOOD | MIXED" }
      - { name: base_price_per_person_cents, type: integer, source: input, description: "List price per guest before group discount, in cents (> 0)" }
      - { name: gratuity_pct, type: number, source: input, description: "Default gratuity rate applied to seats+add-ons, 0.0..0.30", default: 0.18 }
      - { name: charter_fee_cents, type: integer, source: input, description: "Flat surcharge added once when a Departure is a private charter (>= 0)", default: 0 }
      - { name: min_guest_age, type: integer, source: input, description: "Minimum guest age for booking; tasting tours commonly 21", default: 21 }
      - { name: status, type: enum, source: system, description: "Catalog lifecycle", constraints: "DRAFT | PUBLISHED | RETIRED" }

  - name: AddOn
    parent: null
    common_fields: true
    fields:
      - { name: tour_product_id, type: string, source: input, description: "FK -> TourProduct.id; the product this add-on is offered on" }
      - { name: name, type: string, source: input, description: "Add-on name, e.g. 'Cheese Pairing Flight'" }
      - { name: price_per_person_cents, type: integer, source: input, description: "Add-on charge per guest in cents (>= 0); never discounted" }
      - { name: status, type: enum, source: system, description: "Availability; set ACTIVE on create", constraints: "ACTIVE" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Van label/plate" }
      - { name: seat_capacity, type: integer, source: input, description: "Total passenger seats on the van (> 0)" }
      - { name: status, type: enum, source: system, description: "Fleet status", constraints: "AVAILABLE | OUT_OF_SERVICE" }

  - name: PartnerVenue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Venue name, e.g. 'Oak Ridge Cellars'" }
      - { name: kind, type: enum, source: input, description: "Venue category", constraints: "WINERY | BREWERY | RESTAURANT" }
      - { name: commission_pct, type: number, source: input, description: "Commission the operator owes the venue on tasting revenue, 0.0..0.50" }
      - { name: tasting_cost_per_guest_cents, type: integer, source: input, description: "Per-guest tasting cost at this venue in cents (>= 0)" }
      - { name: status, type: enum, source: system, description: "Partner status", constraints: "ACTIVE | SUSPENDED" }

  - name: PickupPoint
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Pickup location name, e.g. 'Downtown Transit Hub'" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: status, type: enum, source: system, description: "Pickup availability; set ACTIVE on create", constraints: "ACTIVE" }

  - name: Departure
    parent: null
    common_fields: true
    fields:
      - { name: tour_product_id, type: string, source: input, description: "FK -> TourProduct.id; the catalog product this departure runs" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; the van assigned to this departure" }
      - { name: depart_at, type: datetime, source: input, description: "Scheduled departure start (ISO 8601 UTC)" }
      - { name: return_at, type: datetime, source: input, description: "Scheduled return end (ISO 8601 UTC); must be after depart_at" }
      - { name: is_private_charter, type: boolean, source: input, description: "True = whole-van private charter (single booking owns all seats)", default: false }
      - { name: seat_capacity, type: integer, source: system, description: "Effective seat pool = assigned Vehicle.seat_capacity at schedule time" }
      - { name: seats_taken, type: integer, source: computed, description: "Sum of party_size over Bookings in {RESERVED, PAID, CHECKED_IN}" }
      - { name: expected_headcount, type: integer, source: computed, description: "Sum of party_size over Bookings in {RESERVED, PAID} (forward-looking)" }
      - { name: status, type: enum, source: system, description: "Departure lifecycle", constraints: "SCHEDULED | CONFIRMED | DEPARTED | COMPLETED | CANCELLED_WEATHER | CANCELLED_OPS" }
      - { name: cancel_reason, type: string, source: system, required: false, description: "Free-text reason recorded on cancellation" }

  - name: Stop
    parent: null
    common_fields: true
    fields:
      - { name: departure_id, type: string, source: input, description: "FK -> Departure.id; the departure this stop belongs to" }
      - { name: partner_venue_id, type: string, source: input, description: "FK -> PartnerVenue.id; the venue visited at this stop" }
      - { name: sequence, type: integer, source: input, description: "1-based ordering of the stop within the itinerary; unique per departure" }
      - { name: dwell_minutes, type: integer, source: input, description: "Planned minutes spent at this stop (> 0)" }
      - { name: estimated_commission_cents, type: integer, source: computed, description: "Forward-looking commission for this stop at Departure CONFIRMED, 0 until then" }
      - { name: settled_commission_cents, type: integer, source: computed, description: "Final commission for this stop at Departure COMPLETED, 0 until then" }
      - { name: status, type: enum, source: system, description: "Stop lifecycle: PLANNED on create, VISITED when the departure completes", constraints: "PLANNED | VISITED" }

  - name: VenueConfirmation
    parent: null
    common_fields: true
    fields:
      - { name: stop_id, type: string, source: input, description: "FK -> Stop.id; the itinerary stop awaiting venue sign-off" }
      - { name: partner_venue_id, type: string, source: system, description: "FK -> PartnerVenue.id; copied from the Stop's venue for ownership checks" }
      - { name: requested_headcount, type: integer, source: input, description: "Headcount the operator asked the venue to hold" }
      - { name: revision_count, type: integer, source: system, description: "Number of times the request returned to REQUESTED after a CHANGES_REQUESTED loop, starts at 0" }
      - { name: decline_note, type: string, source: system, required: false, description: "Venue note on decline or changes-requested" }
      - { name: status, type: enum, source: system, description: "Confirmation lifecycle", constraints: "REQUESTED | CONFIRMED | CHANGES_REQUESTED | DECLINED | RELEASED" }

  - name: Guest
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Guest legal name" }
      - { name: birth_date, type: datetime, source: input, description: "Date of birth (ISO 8601); used for age verification against TourProduct.min_guest_age" }
      - { name: age_verified, type: boolean, source: system, description: "True once an OCR/ID verification event has cleared this guest", default: false }
      - { name: waiver_signed, type: boolean, source: system, description: "True once the liability waiver has been signed", default: false }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: departure_id, type: string, source: input, description: "FK -> Departure.id; the departure being booked" }
      - { name: lead_guest_id, type: string, source: input, description: "FK -> Guest.id; the booking's lead/paying guest" }
      - { name: pickup_point_id, type: string, source: input, description: "FK -> PickupPoint.id; where the party is collected" }
      - { name: party_size, type: integer, source: input, description: "Number of seats requested by this booking (> 0)" }
      - { name: add_on_id, type: string, source: input, required: false, description: "FK -> AddOn.id; optional single add-on applied to every guest in the party" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Discounted seats + add-ons + charter fee; see booking_price_quote" }
      - { name: gratuity_cents, type: integer, source: computed, description: "Gratuity over seats+add-ons (charter excluded); see gratuity_amount" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + gratuity_cents; the amount owed" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Amount captured so far, 0 until PAID", default: 0 }
      - { name: refund_cents, type: integer, source: computed, description: "Amount refunded on cancellation, 0 until refunded", default: 0 }
      - { name: status, type: enum, source: system, description: "Booking lifecycle", constraints: "DRAFT | RESERVED | PAID | CHECKED_IN | COMPLETED | CANCELLED" }
      - { name: payment_status, type: enum, source: system, description: "Independent payment dimension", constraints: "UNPAID | CAPTURED | REFUNDED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # TourProduct — simple catalog lifecycle (linear) with retire guard
  # ---------------------------------------------------------------------------
  - entity: TourProduct
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /tour-products/{id}/publish"
        actor: Operator
        preconditions:
          - "TourProduct has at least one AddOn? — no; publish only requires status==DRAFT"
        side_effects:
          - "increments TourProduct.version by 1"
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /tour-products/{id}/retire"
        actor: Operator
        preconditions:
          - "No Departure of this product in status IN {SCHEDULED, CONFIRMED, DEPARTED} (else ERR_PRODUCT_HAS_ACTIVE_DEPARTURES)"
        side_effects:
          - "increments TourProduct.version by 1"

  # ---------------------------------------------------------------------------
  # VenueConfirmation — CYCLIC (REQUESTED <-> CHANGES_REQUESTED revision loop) [Rule 3]
  # ---------------------------------------------------------------------------
  - entity: VenueConfirmation
    initial_state: REQUESTED
    terminal_states: [DECLINED, RELEASED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /venue-confirmations/{id}/confirm"
        actor: PartnerVenue
        preconditions:
          - "acting PartnerVenue (X-User-ID) == VenueConfirmation.partner_venue_id"
        side_effects:
          - "Stop.status stays PLANNED; the stop is now venue-confirmed for Departure confirm eligibility"
          - "increments VenueConfirmation.version by 1"
      - from: REQUESTED
        to: CHANGES_REQUESTED
        trigger: "POST /venue-confirmations/{id}/request-changes"
        actor: PartnerVenue
        preconditions:
          - "acting PartnerVenue (X-User-ID) == VenueConfirmation.partner_venue_id"
        side_effects:
          - "decline_note set from body"
          - "increments VenueConfirmation.version by 1"
      - from: CHANGES_REQUESTED
        to: REQUESTED
        trigger: "POST /venue-confirmations/{id}/resubmit"
        actor: Operator
        preconditions:
          - "VenueConfirmation.revision_count < 3 (else ERR_REVISION_LIMIT_REACHED)"
        side_effects:
          - "requested_headcount updated from body"
          - "revision_count incremented by 1 (cycle counter)"
          - "increments VenueConfirmation.version by 1"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /venue-confirmations/{id}/decline"
        actor: PartnerVenue
        preconditions:
          - "acting PartnerVenue (X-User-ID) == VenueConfirmation.partner_venue_id"
        side_effects:
          - "decline_note set from body"
          - "increments VenueConfirmation.version by 1"
      - from: CHANGES_REQUESTED
        to: DECLINED
        trigger: "POST /venue-confirmations/{id}/decline"
        actor: PartnerVenue
        preconditions:
          - "acting PartnerVenue (X-User-ID) == VenueConfirmation.partner_venue_id"
        side_effects:
          - "increments VenueConfirmation.version by 1"
      - from: CONFIRMED
        to: RELEASED
        trigger: "system (Departure cancelled via cancel-weather or cancel-ops)"
        actor: system
        preconditions: []
        side_effects:
          - "increments VenueConfirmation.version by 1"

  # ---------------------------------------------------------------------------
  # Departure — BRANCHING with divergent cancel paths (weather vs ops) [Rule 3]
  # ---------------------------------------------------------------------------
  - entity: Departure
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED_WEATHER, CANCELLED_OPS]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /departures/{id}/confirm"
        actor: Operator
        preconditions:
          - "Every Stop of this Departure has a VenueConfirmation in status CONFIRMED (else ERR_VENUE_NOT_CONFIRMED) [cross-entity: Departure depends on VenueConfirmation/Stop state]"
          - "assigned Vehicle.status == AVAILABLE (else ERR_VEHICLE_UNAVAILABLE) [cross-entity: Departure depends on Vehicle state]"
          - "expected_headcount >= 1 (at least one Booking RESERVED or PAID; else ERR_NO_BOOKINGS)"
        side_effects:
          - "Each Stop.estimated_commission_cents recomputed via partner_commission (estimated variant) over expected_headcount"
          - "increments Departure.version by 1"
      - from: CONFIRMED
        to: DEPARTED
        trigger: "POST /departures/{id}/depart"
        actor: Guide
        preconditions:
          - "logical clock now >= depart_at (else ERR_TOO_EARLY_TO_DEPART)"
        side_effects:
          - "Bookings in {RESERVED} with payment_status != CAPTURED are auto-CANCELLED (no-show holds), seats released [cascade origin A, hop 1]"
          - "Each auto-CANCELLED booking: refund_cents computed via cancellation_refund (0% inside 48h) [cascade A, hop 2]"
          - "increments Departure.version by 1"
      - from: DEPARTED
        to: COMPLETED
        trigger: "POST /departures/{id}/complete"
        actor: Guide
        preconditions:
          - "logical clock now >= return_at (else ERR_TOO_EARLY_TO_COMPLETE)"
        side_effects:
          - "Each Stop.settled_commission_cents recomputed via partner_commission (settled variant) over CHECKED_IN headcount"
          - "Each Stop.status PLANNED -> VISITED"
          - "Bookings in {CHECKED_IN} -> COMPLETED"
          - "increments Departure.version by 1"
      - from: SCHEDULED
        to: CANCELLED_WEATHER
        trigger: "POST /departures/{id}/cancel-weather"
        actor: Operator
        preconditions: []
        side_effects:
          - "Every non-terminal Booking -> CANCELLED with refund_cents = 100% of amount_paid_cents (weather override) [cascade origin B, hop 1]"
          - "Each cascaded Booking.payment_status CAPTURED -> REFUNDED [cascade B, hop 2]"
          - "Every Stop's CONFIRMED VenueConfirmation -> RELEASED [cascade B, hop 2 sibling]"
          - "cancel_reason set from body"
          - "increments Departure.version by 1"
      - from: CONFIRMED
        to: CANCELLED_WEATHER
        trigger: "POST /departures/{id}/cancel-weather"
        actor: Operator
        preconditions: []
        side_effects:
          - "Every non-terminal Booking -> CANCELLED with refund_cents = 100% of amount_paid_cents (weather override) [cascade origin B, hop 1]"
          - "Each cascaded Booking.payment_status CAPTURED -> REFUNDED [cascade B, hop 2]"
          - "Every Stop's CONFIRMED VenueConfirmation -> RELEASED [cascade B, hop 2 sibling]"
          - "cancel_reason set from body"
          - "increments Departure.version by 1"
      - from: SCHEDULED
        to: CANCELLED_OPS
        trigger: "POST /departures/{id}/cancel-ops"
        actor: Operator
        preconditions: []
        side_effects:
          - "Every non-terminal Booking -> CANCELLED with refund_cents via cancellation_refund (lead-time tiered, NOT weather override) [cascade origin B variant, hop 1]"
          - "Each cascaded Booking with refund > 0 and payment_status CAPTURED -> REFUNDED [hop 2]"
          - "Every Stop's CONFIRMED VenueConfirmation -> RELEASED"
          - "cancel_reason set from body"
          - "increments Departure.version by 1"
      - from: CONFIRMED
        to: CANCELLED_OPS
        trigger: "POST /departures/{id}/cancel-ops"
        actor: Operator
        preconditions: []
        side_effects:
          - "Every non-terminal Booking -> CANCELLED with refund_cents via cancellation_refund (lead-time tiered) [cascade origin B variant, hop 1]"
          - "Each cascaded Booking with refund > 0 and payment_status CAPTURED -> REFUNDED [hop 2]"
          - "Every Stop's CONFIRMED VenueConfirmation -> RELEASED"
          - "cancel_reason set from body"
          - "increments Departure.version by 1"

  # ---------------------------------------------------------------------------
  # Booking — PARALLEL dimensions: lifecycle (status) x payment (payment_status) [Rule 3]
  #   Plus a check-in path guarded by Guest state (cross-entity) [Rule 7]
  # ---------------------------------------------------------------------------
  - entity: Booking
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: RESERVED
        trigger: "POST /bookings/{id}/reserve"
        actor: Guest
        preconditions:
          - "Departure.status == SCHEDULED (else ERR_DEPARTURE_NOT_BOOKABLE)"
          - "seats_taken + party_size <= Departure.seat_capacity (else ERR_SEAT_CAPACITY_EXCEEDED) [resource overlap: seat pool]"
          - "for is_private_charter Departure: party_size == Departure.seat_capacity AND no other non-terminal Booking exists (else ERR_CHARTER_WHOLE_VAN_REQUIRED)"
          - "expected_<departure>_version matches Departure.version (else ERR_STALE_VERSION) [OCC]"
        side_effects:
          - "Departure.seats_taken += party_size; Departure.expected_headcount += party_size [ledger sync]"
          - "increments Departure.version by 1"
      - from: RESERVED
        to: PAID
        trigger: "POST /bookings/{id}/pay"
        actor: Guest
        preconditions:
          - "Booking.payment_status == UNPAID"
          - "Booking lead Guest.age_verified == true AND Booking lead Guest.waiver_signed == true (else ERR_GUEST_NOT_CLEARED) [cross-entity: Booking depends on Guest state]"
        side_effects:
          - "payment_status -> CAPTURED; amount_paid_cents = total_cents [parallel payment dimension advances]"
          - "increments Booking.version by 1"
      - from: PAID
        to: CHECKED_IN
        trigger: "POST /bookings/{id}/check-in"
        actor: Guide
        preconditions:
          - "Departure.status == DEPARTED (else ERR_INVALID_STATE) [cross-entity: Booking depends on Departure state]"
          - "Booking lead Guest.age_verified == true (else ERR_GUEST_NOT_CLEARED)"
        side_effects:
          - "increments Booking.version by 1"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system (Departure -> COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Booking.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Guest
        preconditions: []
        side_effects:
          - "increments Booking.version by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Guest
        preconditions: []
        side_effects:
          - "Departure.seats_taken -= party_size; Departure.expected_headcount -= party_size [compensating: seat pool restored]"
          - "increments Departure.version by 1"
          - "increments Booking.version by 1"
      - from: PAID
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Guest
        preconditions: []
        side_effects:
          - "refund_cents computed via cancellation_refund over amount_paid_cents at lead time vs Departure.depart_at [compensating: payment ledger]"
          - "if refund_cents > 0 and payment_status == CAPTURED: payment_status -> REFUNDED"
          - "Departure.seats_taken -= party_size; Departure.expected_headcount -= party_size [compensating: seat pool restored]"
          - "increments Departure.version by 1"
          - "increments Booking.version by 1"

# =============================================================================
# Concurrency Rules (§1.2.1) — OCC on Departure.version (CREATE-with-supersede on seat pool)
# =============================================================================
concurrency_rules:
  - rule_id: booking-reserve-stale-departure
    parent_entity: Departure
    write_endpoint: "POST /bookings/{id}/reserve"
    occ_field: "expected_departure_version"
    description: |
      Reserving seats against a Departure whose version has advanced since the
      client last observed it is rejected. Another writer has already reserved
      seats (legitimately consuming the shared pool and advancing the
      Departure's version), so the current writer's view of remaining capacity
      is stale and the reservation is rejected on the stale version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: booking_price_quote
    trigger: "POST /bookings (DRAFT created) and recomputed on reserve"
    algorithm: tiered_pricing
    formula: |
      # Group-size tier discount on per-person BASE price only (not add-ons, not charter).
      # Tier selection by party_size (>= boundaries):
      #   party_size >= 12 -> 0.15 ; >= 8 -> 0.10 ; >= 4 -> 0.05 ; else 0.00
      tier_pct          = tier(party_size)
      disc_pp_cents     = round_half_up(base_price_per_person_cents * (1 - tier_pct))   # round PER-PERSON first
      seats_total_cents = disc_pp_cents * party_size                                     # then multiply -> "round-then-sum"
      addon_total_cents = (add_on ? add_on.price_per_person_cents * party_size : 0)      # add-ons never discounted
      charter_cents     = (Departure.is_private_charter ? TourProduct.charter_fee_cents : 0)
      subtotal_cents    = seats_total_cents + addon_total_cents + charter_cents
    input_set: "Single Booking + its Departure + TourProduct + optional AddOn; no cross-booking aggregation."
    constants:
      TIER_4_PCT: 0.05
      TIER_8_PCT: 0.10
      TIER_12_PCT: 0.15
    precision: "integer cents, round_half_up; pinned order = round per-person THEN multiply by party_size"

  - name: gratuity_amount
    trigger: "POST /bookings (DRAFT created); recomputed whenever subtotal changes"
    algorithm: threshold
    formula: |
      # Circular-looking dependency pinned: total depends on gratuity, gratuity depends
      # on a base derived from the SAME quote subtotal MINUS charter. Evaluation order:
      #   1) compute subtotal_cents (booking_price_quote)
      #   2) gratuity_base_cents = seats_total_cents + addon_total_cents   (charter EXCLUDED)
      #   3) gratuity_cents      = round_half_up(gratuity_base_cents * TourProduct.gratuity_pct)
      #   4) total_cents         = subtotal_cents + gratuity_cents
      gratuity_base_cents = seats_total_cents + addon_total_cents
      gratuity_cents      = round_half_up(gratuity_base_cents * gratuity_pct)
      total_cents         = subtotal_cents + gratuity_cents
    input_set: "Single Booking quote components; charter fee deliberately outside the gratuity base."
    constants:
      MAX_GRATUITY_PCT: 0.30
    precision: "integer cents, round_half_up; evaluation order pinned 1->4 so total is well-defined"

  - name: partner_commission
    trigger: "Departure confirm (estimated) and Departure complete (settled)"
    algorithm: forward_looking
    formula: |
      # Per Stop: commission owed to its PartnerVenue on tasting revenue.
      # headcount source differs by variant (dual-variant) -> different cents for same data.
      commission_cents = round_half_up(headcount * partner_venue.tasting_cost_per_guest_cents * partner_venue.commission_pct)
    input_set: "Per Stop; headcount aggregated over the Departure's Bookings filtered by status per variant."
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: estimated
        when: "Departure SCHEDULED -> CONFIRMED; writes Stop.estimated_commission_cents"
        difference: "headcount = sum of party_size over Bookings in {RESERVED, PAID} (forward-looking, includes not-yet-attended)."
      - name: settled
        when: "Departure DEPARTED -> COMPLETED; writes Stop.settled_commission_cents"
        difference: "headcount = sum of party_size over Bookings in {CHECKED_IN} only (chronological, actual attendance); no-shows excluded so settled <= estimated."

  - name: cancellation_refund
    trigger: "Booking cancel (PAID), Departure cancel cascade, no-show auto-cancel on depart"
    algorithm: threshold
    formula: |
      # Lead-time tier by hours between logical-clock now and Departure.depart_at:
      hours_before = (Departure.depart_at - clock_now) / 3600
      if weather_override: refund_pct = 1.00                # CANCELLED_WEATHER path always full refund
      elif hours_before >= 168: refund_pct = 1.00           # >= 7 days
      elif hours_before >= 48:  refund_pct = 0.50           # >= 48h and < 168h
      else:                     refund_pct = 0.00           # < 48h
      refund_cents = round_half_up(amount_paid_cents * refund_pct)
    input_set: "Single Booking.amount_paid_cents; clock_now vs Departure.depart_at; weather_override flag from the cancel path."
    constants:
      FULL_REFUND_HOURS: 168
      HALF_REFUND_HOURS: 48
    precision: "integer cents, round_half_up; boundaries are >= (48h -> 50%, 47h -> 0%)"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except GET endpoints marked Anonymous"

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all mutating endpoints"

  - priority: 3
    category: existence
    check: "Path-id resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 4
    category: existence
    check: "Foreign keys in body reference existing resources (departure_id, lead_guest_id, pickup_point_id, add_on_id, vehicle_id, tour_product_id, partner_venue_id, stop_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 422
    applies_to: "POST /departures, POST /stops, POST /bookings, POST /add-ons, POST /venue-confirmations"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed; required fields present and correct type"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 6
    category: business_constraint
    check: "Enum fields hold a declared value (theme, kind, payment_mode-like fields, statuses set only by system)"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "POST /tour-products, POST /partner-venues, POST /departures"

  - priority: 7
    category: business_constraint
    check: "Numeric fields in range: base_price_per_person_cents > 0; seat_capacity > 0; party_size > 0; 0 <= gratuity_pct <= 0.30; 0 <= commission_pct <= 0.50; depart_at < return_at"
    error_id: ERR_VALUE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /tour-products, POST /vehicles, POST /partner-venues, POST /departures, POST /bookings"

  - priority: 8
    category: state
    check: "Target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all */{action} transition endpoints"

  - priority: 9
    category: business_referential
    check: "Acting PartnerVenue (X-User-ID) owns the VenueConfirmation it confirms/declines/requests-changes on"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /venue-confirmations/{id}/confirm, /decline, /request-changes"

  - priority: 10
    category: business_referential
    check: "Stop.sequence is unique within its Departure"
    error_id: ERR_DUPLICATE_STOP_SEQUENCE
    http_status: 409
    applies_to: "POST /stops"

  - priority: 11
    category: business_safety
    check: "Lead Guest meets TourProduct.min_guest_age computed from birth_date at booking reserve"
    error_id: ERR_UNDERAGE_GUEST
    http_status: 422
    applies_to: "POST /bookings/{id}/reserve"

  - priority: 12
    category: business_safety
    check: "Lead Guest is age_verified AND waiver_signed before payment; age_verified before check-in"
    error_id: ERR_GUEST_NOT_CLEARED
    http_status: 409
    applies_to: "POST /bookings/{id}/pay, POST /bookings/{id}/check-in"

  - priority: 13
    category: business_temporal
    check: "Departure cannot depart before depart_at, nor complete before return_at (logical clock)"
    error_id: ERR_TOO_EARLY_TO_DEPART
    http_status: 409
    applies_to: "POST /departures/{id}/depart, POST /departures/{id}/complete"

  - priority: 14
    category: business_referential
    check: "Departure confirm requires every Stop to have a CONFIRMED VenueConfirmation"
    error_id: ERR_VENUE_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /departures/{id}/confirm"

  - priority: 15
    category: business_referential
    check: "Departure confirm requires assigned Vehicle.status == AVAILABLE"
    error_id: ERR_VEHICLE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /departures/{id}/confirm"

  - priority: 16
    category: business_constraint
    check: "Departure confirm requires expected_headcount >= 1"
    error_id: ERR_NO_BOOKINGS
    http_status: 409
    applies_to: "POST /departures/{id}/confirm"

  - priority: 17
    category: business_constraint
    check: "Private-charter departure: a booking must take the whole van and be the only non-terminal booking"
    error_id: ERR_CHARTER_WHOLE_VAN_REQUIRED
    http_status: 409
    applies_to: "POST /bookings/{id}/reserve"

  - priority: 18
    category: state
    check: "Booking can only reserve while its Departure is in state SCHEDULED (cross-entity state precondition)"
    error_id: ERR_DEPARTURE_NOT_BOOKABLE
    http_status: 409
    applies_to: "POST /bookings/{id}/reserve"

  - priority: 19
    category: business_constraint
    check: "VenueConfirmation resubmit blocked once revision_count would exceed 3"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /venue-confirmations/{id}/resubmit"

  - priority: 20
    category: business_constraint
    check: "TourProduct retire blocked while it has SCHEDULED/CONFIRMED/DEPARTED departures"
    error_id: ERR_PRODUCT_HAS_ACTIVE_DEPARTURES
    http_status: 409
    applies_to: "POST /tour-products/{id}/retire"

  - priority: 21
    category: business_fiscal
    check: "Reservation rejected when seats_taken + party_size > Departure.seat_capacity"
    error_id: ERR_SEAT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /bookings/{id}/reserve"

  - priority: 22
    category: concurrency
    check: "expected_departure_version must equal Departure.version on reserve (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /bookings/{id}/reserve"

  - priority: 23
    category: business_constraint
    check: "Pagination: limit in [1,100], offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

# =============================================================================
# Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (29 endpoints)
# =============================================================================
endpoints:
  # ---- Logical clock (test-driving) -----------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Server startup default is 2026-03-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Operator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced/rewound to to_iso8601"]

  # ---- Guest ID/age verification (test-driving) -----------------------------
  - method: POST
    path: "/_verify/age"
    description: "Synthetic ID/OCR verification event: marks a Guest age_verified true (no real document upload in the benchmark)."
    roles: [Operator, Guide]
    code: 200
    input: [guest_id]
    output: Guest
    side_effects: ["Guest.age_verified = true; increments Guest.version by 1"]

  # ---- TourProduct ----------------------------------------------------------
  - method: POST
    path: "/tour-products"
    description: "Create a tour catalog product (DRAFT)"
    roles: [Operator]
    code: 201
    input: [name, theme, base_price_per_person_cents, "gratuity_pct?", "charter_fee_cents?", "min_guest_age?"]
    output: TourProduct
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/tour-products"
    description: "List tour products (paginated)"
    roles: [Operator, Guide, PartnerVenue, Guest, Anonymous]
    code: 200
    input: ["status?", "theme?", "limit?", "offset?"]
    output: TourProduct[]
    side_effects: []

  - method: GET
    path: "/tour-products/{id}"
    description: "Get a tour product"
    roles: [Operator, Guide, PartnerVenue, Guest, Anonymous]
    code: 200
    input: []
    output: TourProduct
    side_effects: []

  - method: POST
    path: "/tour-products/{id}/publish"
    description: "Publish a DRAFT product"
    roles: [Operator]
    code: 200
    input: []
    output: TourProduct
    side_effects: ["status DRAFT->PUBLISHED; increments TourProduct.version by 1"]

  - method: POST
    path: "/tour-products/{id}/retire"
    description: "Retire a PUBLISHED product"
    roles: [Operator]
    code: 200
    input: []
    output: TourProduct
    side_effects: ["status PUBLISHED->RETIRED; increments TourProduct.version by 1"]

  # ---- AddOn ----------------------------------------------------------------
  - method: POST
    path: "/add-ons"
    description: "Create an add-on for a tour product"
    roles: [Operator]
    code: 201
    input: [tour_product_id, name, price_per_person_cents]
    output: AddOn
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/add-ons"
    description: "List add-ons; filter by tour_product_id"
    roles: [Operator, Guest, Anonymous]
    code: 200
    input: ["tour_product_id?", "limit?", "offset?"]
    output: AddOn[]
    side_effects: []

  - method: GET
    path: "/add-ons/{id}"
    description: "Get an add-on"
    roles: [Operator, Guest, Anonymous]
    code: 200
    input: []
    output: AddOn
    side_effects: []

  # ---- Vehicle --------------------------------------------------------------
  - method: POST
    path: "/vehicles"
    description: "Register a van"
    roles: [Operator]
    code: 201
    input: [label, seat_capacity]
    output: Vehicle
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/vehicles/{id}"
    description: "Get a vehicle"
    roles: [Operator, Guide]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: POST
    path: "/vehicles/{id}/set-status"
    description: "Set a vehicle AVAILABLE or OUT_OF_SERVICE"
    roles: [Operator]
    code: 200
    input: [status]
    output: Vehicle
    side_effects: ["increments Vehicle.version by 1"]

  # ---- PartnerVenue ---------------------------------------------------------
  - method: POST
    path: "/partner-venues"
    description: "Create a partner venue"
    roles: [Operator]
    code: 201
    input: [name, kind, commission_pct, tasting_cost_per_guest_cents]
    output: PartnerVenue
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/partner-venues/{id}"
    description: "Get a partner venue"
    roles: [Operator, PartnerVenue, Anonymous]
    code: 200
    input: []
    output: PartnerVenue
    side_effects: []

  - method: POST
    path: "/partner-venues/{id}/set-status"
    description: "Set a partner venue ACTIVE or SUSPENDED"
    roles: [Operator]
    code: 200
    input: [status]
    output: PartnerVenue
    side_effects: ["increments PartnerVenue.version by 1"]

  # ---- PickupPoint ----------------------------------------------------------
  - method: POST
    path: "/pickup-points"
    description: "Create a pickup point"
    roles: [Operator]
    code: 201
    input: [name, address]
    output: PickupPoint
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/pickup-points/{id}"
    description: "Get a pickup point"
    roles: [Operator, Guest, Anonymous]
    code: 200
    input: []
    output: PickupPoint
    side_effects: []

  # ---- Guest ----------------------------------------------------------------
  - method: POST
    path: "/guests"
    description: "Register a guest (age unverified, waiver unsigned)"
    roles: [Operator, Guest]
    code: 201
    input: [full_name, birth_date]
    output: Guest
    side_effects: ["age_verified=false, waiver_signed=false"]

  - method: GET
    path: "/guests/{id}"
    description: "Get a guest"
    roles: [Operator, Guide, Guest]
    code: 200
    input: []
    output: Guest
    side_effects: []

  - method: POST
    path: "/guests/{id}/sign-waiver"
    description: "Sign the liability waiver for a guest"
    roles: [Operator, Guest]
    code: 200
    input: []
    output: Guest
    side_effects: ["waiver_signed=true; increments Guest.version by 1"]

  # ---- Departure ------------------------------------------------------------
  - method: POST
    path: "/departures"
    description: "Schedule a departure for a product on a van"
    roles: [Operator]
    code: 201
    input: [tour_product_id, vehicle_id, depart_at, return_at, "is_private_charter?"]
    output: Departure
    side_effects: ["status=SCHEDULED; seat_capacity copied from Vehicle.seat_capacity; seats_taken=0; expected_headcount=0"]

  - method: GET
    path: "/departures"
    description: "List departures; filter by tour_product_id or vehicle_id (reverse-reachability for Departure.tour_product_id and Departure.vehicle_id)"
    roles: [Operator, Guide, Guest, Anonymous]
    code: 200
    input: ["tour_product_id?", "vehicle_id?", "status?", "limit?", "offset?"]
    output: Departure[]
    side_effects: []

  - method: GET
    path: "/departures/{id}"
    description: "Get a departure (includes seats_taken, expected_headcount)"
    roles: [Operator, Guide, Guest, Anonymous]
    code: 200
    input: []
    output: Departure
    side_effects: []

  - method: POST
    path: "/departures/{id}/confirm"
    description: "Confirm a SCHEDULED departure once all stops are venue-confirmed"
    roles: [Operator]
    code: 200
    input: []
    output: Departure
    side_effects: ["Stop.estimated_commission_cents recomputed (estimated variant); increments Departure.version by 1"]

  - method: POST
    path: "/departures/{id}/depart"
    description: "Mark a CONFIRMED departure DEPARTED (clock >= depart_at)"
    roles: [Guide]
    code: 200
    input: []
    output: Departure
    side_effects: ["RESERVED-but-uncaptured bookings auto-cancelled+refunded; increments Departure.version by 1"]

  - method: POST
    path: "/departures/{id}/complete"
    description: "Mark a DEPARTED departure COMPLETED (clock >= return_at)"
    roles: [Guide]
    code: 200
    input: []
    output: Departure
    side_effects: ["Stop.settled_commission_cents recomputed (settled variant); CHECKED_IN bookings -> COMPLETED; increments Departure.version by 1"]

  - method: POST
    path: "/departures/{id}/cancel-weather"
    description: "Cancel a departure for weather (full refunds)"
    roles: [Operator]
    code: 200
    input: [cancel_reason]
    output: Departure
    side_effects: ["all non-terminal bookings CANCELLED with 100% refund; CONFIRMED venue-confirmations RELEASED; increments Departure.version by 1"]

  - method: POST
    path: "/departures/{id}/cancel-ops"
    description: "Cancel a departure for operational reasons (lead-time tiered refunds)"
    roles: [Operator]
    code: 200
    input: [cancel_reason]
    output: Departure
    side_effects: ["all non-terminal bookings CANCELLED with tiered refund; CONFIRMED venue-confirmations RELEASED; increments Departure.version by 1"]

  # ---- Stop -----------------------------------------------------------------
  - method: POST
    path: "/stops"
    description: "Add an itinerary stop (venue tasting) to a SCHEDULED departure"
    roles: [Operator]
    code: 201
    input: [departure_id, partner_venue_id, sequence, dwell_minutes]
    output: Stop
    side_effects: ["status=PLANNED; estimated_commission_cents=0; settled_commission_cents=0"]

  - method: GET
    path: "/stops"
    description: "List stops; filter by departure_id or partner_venue_id (reverse-reachability for Stop.departure_id and Stop.partner_venue_id)"
    roles: [Operator, Guide, PartnerVenue, Anonymous]
    code: 200
    input: ["departure_id?", "partner_venue_id?", "limit?", "offset?"]
    output: Stop[]
    side_effects: []

  - method: GET
    path: "/stops/{id}"
    description: "Get a stop"
    roles: [Operator, Guide, PartnerVenue, Anonymous]
    code: 200
    input: []
    output: Stop
    side_effects: []

  # ---- VenueConfirmation ----------------------------------------------------
  - method: POST
    path: "/venue-confirmations"
    description: "Request a partner venue to confirm a stop's hold"
    roles: [Operator]
    code: 201
    input: [stop_id, requested_headcount]
    output: VenueConfirmation
    side_effects: ["status=REQUESTED; revision_count=0; partner_venue_id copied from Stop.partner_venue_id"]

  - method: GET
    path: "/venue-confirmations/{id}"
    description: "Get a venue confirmation"
    roles: [Operator, PartnerVenue]
    code: 200
    input: []
    output: VenueConfirmation
    side_effects: []

  - method: GET
    path: "/venue-confirmations"
    description: "List venue confirmations; filter by stop_id or partner_venue_id (reverse-reachability for VenueConfirmation.stop_id and .partner_venue_id)"
    roles: [Operator, PartnerVenue]
    code: 200
    input: ["stop_id?", "partner_venue_id?", "status?", "limit?", "offset?"]
    output: VenueConfirmation[]
    side_effects: []

  - method: POST
    path: "/venue-confirmations/{id}/confirm"
    description: "Venue confirms the stop"
    roles: [PartnerVenue]
    code: 200
    input: []
    output: VenueConfirmation
    side_effects: ["status REQUESTED->CONFIRMED; increments VenueConfirmation.version by 1"]

  - method: POST
    path: "/venue-confirmations/{id}/request-changes"
    description: "Venue asks for changes (cycle back)"
    roles: [PartnerVenue]
    code: 200
    input: [decline_note]
    output: VenueConfirmation
    side_effects: ["status REQUESTED->CHANGES_REQUESTED; decline_note set; increments VenueConfirmation.version by 1"]

  - method: POST
    path: "/venue-confirmations/{id}/resubmit"
    description: "Operator resubmits an updated request (revision loop)"
    roles: [Operator]
    code: 200
    input: [requested_headcount]
    output: VenueConfirmation
    side_effects: ["status CHANGES_REQUESTED->REQUESTED; revision_count += 1; increments VenueConfirmation.version by 1"]

  - method: POST
    path: "/venue-confirmations/{id}/decline"
    description: "Venue declines the stop"
    roles: [PartnerVenue]
    code: 200
    input: ["decline_note?"]
    output: VenueConfirmation
    side_effects: ["status -> DECLINED; increments VenueConfirmation.version by 1"]

  # ---- Booking --------------------------------------------------------------
  - method: POST
    path: "/bookings"
    description: "Create a DRAFT booking; quote computed immediately"
    roles: [Operator, Guest]
    code: 201
    input: [departure_id, lead_guest_id, pickup_point_id, party_size, "add_on_id?"]
    output: Booking
    side_effects: ["status=DRAFT; payment_status=UNPAID; subtotal_cents/gratuity_cents/total_cents computed via booking_price_quote + gratuity_amount"]

  - method: GET
    path: "/bookings"
    description: "List bookings; filter by departure_id, lead_guest_id, pickup_point_id, or add_on_id (reverse-reachability for Booking.departure_id, Booking.lead_guest_id, Booking.pickup_point_id, Booking.add_on_id)"
    roles: [Operator, Guide, Guest]
    code: 200
    input: ["departure_id?", "lead_guest_id?", "pickup_point_id?", "add_on_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: GET
    path: "/bookings/{id}"
    description: "Get a booking"
    roles: [Operator, Guide, Guest]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: POST
    path: "/bookings/{id}/reserve"
    description: "Reserve seats (consumes the departure seat pool; OCC on departure version)"
    roles: [Operator, Guest]
    code: 200
    input: [expected_departure_version]
    output: Booking
    side_effects: ["status DRAFT->RESERVED; Departure.seats_taken += party_size; Departure.expected_headcount += party_size; increments Departure.version by 1; increments Booking.version by 1"]

  - method: POST
    path: "/bookings/{id}/pay"
    description: "Capture payment for a RESERVED booking (requires cleared lead guest)"
    roles: [Operator, Guest]
    code: 200
    input: []
    output: Booking
    side_effects: ["status RESERVED->PAID; payment_status->CAPTURED; amount_paid_cents=total_cents; increments Booking.version by 1"]

  - method: POST
    path: "/bookings/{id}/check-in"
    description: "Guide checks a PAID booking in on a DEPARTED departure"
    roles: [Guide]
    code: 200
    input: []
    output: Booking
    side_effects: ["status PAID->CHECKED_IN; increments Booking.version by 1"]

  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Cancel a booking (refund + seat release per state)"
    roles: [Operator, Guest]
    code: 200
    input: []
    output: Booking
    side_effects: ["status->CANCELLED; refund_cents via cancellation_refund if PAID; seat pool restored if RESERVED/PAID; increments Departure.version by 1 (if seats released); increments Booking.version by 1"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID on a protected endpoint" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role is not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting PartnerVenue does not own the VenueConfirmation it acts on" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-id resource does not exist" }
  - { id: ERR_FK_NOT_FOUND, http: 422, condition: "A foreign-key field in the body references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body or missing required field" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "Enum field holds an undeclared value" }
  - { id: ERR_VALUE_OUT_OF_RANGE, http: 422, condition: "Numeric field outside allowed range or depart_at >= return_at" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit outside [1,100] or offset < 0" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state that permits this transition" }
  - { id: ERR_DUPLICATE_STOP_SEQUENCE, http: 409, condition: "Stop.sequence already used in this departure" }
  - { id: ERR_UNDERAGE_GUEST, http: 422, condition: "Lead guest below TourProduct.min_guest_age at reserve" }
  - { id: ERR_GUEST_NOT_CLEARED, http: 409, condition: "Lead guest not age_verified and/or waiver not signed when required" }
  - { id: ERR_TOO_EARLY_TO_DEPART, http: 409, condition: "Depart requested before depart_at, or complete before return_at" }
  - { id: ERR_TOO_EARLY_TO_COMPLETE, http: 409, condition: "Complete requested before return_at" }
  - { id: ERR_VENUE_NOT_CONFIRMED, http: 409, condition: "A stop lacks a CONFIRMED VenueConfirmation at departure confirm" }
  - { id: ERR_VEHICLE_UNAVAILABLE, http: 409, condition: "Assigned vehicle is OUT_OF_SERVICE at departure confirm" }
  - { id: ERR_NO_BOOKINGS, http: 409, condition: "Departure confirm with expected_headcount < 1" }
  - { id: ERR_CHARTER_WHOLE_VAN_REQUIRED, http: 409, condition: "Private-charter booking does not take the whole van or is not the sole booking" }
  - { id: ERR_DEPARTURE_NOT_BOOKABLE, http: 409, condition: "Reserve attempted while departure not SCHEDULED" }
  - { id: ERR_REVISION_LIMIT_REACHED, http: 409, condition: "VenueConfirmation resubmit would exceed 3 revisions" }
  - { id: ERR_PRODUCT_HAS_ACTIVE_DEPARTURES, http: 409, condition: "Retire attempted while product has SCHEDULED/CONFIRMED/DEPARTED departures" }
  - { id: ERR_SEAT_CAPACITY_EXCEEDED, http: 409, condition: "seats_taken + party_size > seat_capacity" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_departure_version != Departure.version on reserve" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Operator
    description: "Tour operator staff: builds catalog, schedules departures, manages stops/venue requests, cancels for weather/ops, sets the clock and runs ID verification."
    identity: opaque
    exclusive_operations:
      - "POST /tour-products, /tour-products/{id}/publish, /tour-products/{id}/retire"
      - "POST /add-ons, /vehicles, /vehicles/{id}/set-status, /partner-venues, /pickup-points"
      - "POST /departures, /departures/{id}/confirm, /departures/{id}/cancel-weather, /departures/{id}/cancel-ops"
      - "POST /stops, /venue-confirmations, /venue-confirmations/{id}/resubmit"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /guests, /guests/{id}/sign-waiver (with Guest)"
      - "POST /_verify/age (with Guide)"
      - "POST /bookings, /bookings/{id}/reserve, /bookings/{id}/pay, /bookings/{id}/cancel (with Guest)"
      - "GET reads"

  - name: Guide
    description: "On-the-day tour guide: departs/completes the trip, checks guests in."
    identity: opaque
    exclusive_operations:
      - "POST /departures/{id}/depart, /departures/{id}/complete"
      - "POST /bookings/{id}/check-in"
    shared_operations:
      - "POST /_verify/age (with Operator)"
      - "GET reads"

  - name: PartnerVenue
    description: "A partner winery/brewery/restaurant acting on its own venue confirmations."
    identity: "entity_backed:PartnerVenue"
    exclusive_operations:
      - "POST /venue-confirmations/{id}/confirm, /request-changes, /decline (only for own venue)"
    shared_operations:
      - "GET reads"

  - name: Guest
    description: "A booking guest: registers, signs waiver, books, pays, cancels."
    identity: "entity_backed:Guest"
    exclusive_operations: []
    shared_operations:
      - "POST /guests, /guests/{id}/sign-waiver (with Operator)"
      - "POST /bookings, /bookings/{id}/reserve, /bookings/{id}/pay, /bookings/{id}/cancel (with Operator)"
      - "GET reads"

  - name: Anonymous
    description: "Unauthenticated public catalog reader; permitted only on the GET endpoints whose roles list includes Anonymous (public catalog: tour-products, add-ons, partner-venues, pickup-points, departures, stops). Any mutating call with no headers fails ERR_UNAUTHENTICATED."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /tour-products, /tour-products/{id}, /add-ons, /add-ons/{id}"
      - "GET /partner-venues/{id}, /pickup-points/{id}, /departures, /departures/{id}, /stops, /stops/{id}"
