scenario: "Import-export customs brokerage: client commission agreement with consignor profile, scope-of-service agreement, fee-schedule attachment, electronic-signature workflow, agreement-validity and renewal management, and termination clauses; customs declaration preparation with shipment-information intake (commercial-invoice/packing-list/bill-of-lading/contract), HS-code classification verification, country-of-origin and trade-agreement preference determination, declared-value review, declaration-form generation per jurisdiction, and pre-declaration validation; document review with document-completeness check (license/inspection-certificate/dangerous-goods-declaration), cross-document consistency check, missing-document follow-up with client, and document-authenticity preliminary screening; customs filing with electronic single-window submission, customs response monitoring (release/query/inspection), query-response workflow within the time limit, manifest matching, and amendment-declaration handling; inspection response with inspection notification receipt, scheduling with customs and warehouse, client coordination for sample provision, inspection-outcome handling (release/detention/penalty), and post-inspection documentation; tariff advance and settlement with tariff and VAT and consumption-tax calculation, broker-advance funding workflow, client-side reimbursement billing, late-reimbursement interest rules, multi-currency settlement, and tax-payment-voucher delivery; rejection handling with rejection-reason classification, amendment and re-submission, withdrawal-of-declaration workflow, return-shipment coordination, and rejection-record archiving for compliance analytics; event-driven synchronization with customs single-window, inspection-and-quarantine, banking, and logistics systems; audit logging for declaration changes and advance-payment records."

domain_name: "customs-brokerage"
api_prefix: "/customs"

complexity_profile:
  primary_archetype: "workflow_orchestration"
  secondary_archetype: "compliance_audit"
  complexity_layers:
    - "cascading_side_effects"
    - "dual_variant_calculation"
    - "rate_threshold_triggers"
    - "version_pinning_on_approval"
    - "scheduled_deferred_actions"

  entity_topology: "hybrid"
  state_machine_shape: "branching"
  relationship_patterns:
    - "one_to_many"
    - "cross_aggregate"
    - "polymorphic"

  role_model: "segregation_of_duties"
  consistency_model: "saga"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ─────────────────────────────────────────────────────────────────────────────
# §1.1 Entity-Relationship Table
# ─────────────────────────────────────────────────────────────────────────────
entities:
  - name: ClientCompany
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the consignor / client company"
        constraints: "1..200 chars, unique among non-archived clients"
      - name: tax_id
        type: string
        source: input
        description: "Tax registration number (importer/exporter ID)"
        constraints: "1..40 chars, unique among non-archived clients"
      - name: country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country of incorporation"
        constraints: "Exactly 2 uppercase letters"
      - name: contact_email
        type: string
        source: input
        description: "Primary contact email used for missing-document follow-up"
        constraints: "Valid email format, 1..200 chars"
      - name: default_settlement_currency
        type: enum
        source: input
        description: "Currency used when issuing reimbursement bills to this client"
        constraints: "One of {USD, EUR, CNY, JPY, GBP}"
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the client record"
        default: "ACTIVE"
        constraints: "One of {ACTIVE, ARCHIVED}"

  - name: CommissionAgreement
    parent: ClientCompany
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK to ClientCompany.id"
      - name: scope_of_service
        type: array
        source: input
        description: "Enumerated service codes the broker is authorized to perform"
        constraints: "Non-empty subset of {DECLARATION, INSPECTION, TARIFF_ADVANCE, RETURN_SHIP, AMENDMENT}"
      - name: fee_schedule
        type: object
        source: input
        description: "Per-service fee table — keys are service codes from scope_of_service; values are numeric fees in the agreement currency"
        constraints: "Every key in scope_of_service must appear; every value >= 0"
      - name: agreement_currency
        type: enum
        source: input
        description: "Currency in which fee_schedule amounts are denominated"
        constraints: "One of {USD, EUR, CNY, JPY, GBP}"
      - name: valid_from
        type: datetime
        source: input
        description: "Inclusive start of validity window (ISO 8601 UTC)"
      - name: valid_until
        type: datetime
        source: input
        description: "Exclusive end of validity window (ISO 8601 UTC)"
        constraints: "Must be strictly greater than valid_from"
      - name: late_interest_daily_rate_bps
        type: integer
        source: input
        description: "Late-reimbursement interest, in basis points per day (1 bp = 0.01%)"
        constraints: "0..1000"
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the agreement"
        default: "DRAFT"
        constraints: "One of {DRAFT, AWAITING_SIGNATURE, ACTIVE, TERMINATED, EXPIRED, RENEWED}"
      - name: signed_at
        type: datetime
        source: system
        description: "Timestamp the client e-signed; null until signature is captured"
        default: null
      - name: signature_token
        type: string
        source: system
        description: "Opaque token presented by client at signature; null until generated"
        default: null
      - name: pinned_fee_schedule_version
        type: integer
        source: system
        description: "Snapshot of CommissionAgreement.version at the moment of activation. Used to detect drift between Declarations and their fee table."
        default: null
      - name: renewed_from_agreement_id
        type: string
        source: input
        description: "If this is a renewal, FK to the parent agreement; null otherwise"
        default: null
      - name: terminated_reason
        type: enum
        source: input
        description: "Reason category when status=TERMINATED"
        default: null
        constraints: "One of {CLIENT_REQUEST, BREACH, REGULATORY, NULL}"

  - name: Declaration
    parent: CommissionAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK to CommissionAgreement.id under which this declaration is filed"
      - name: jurisdiction_code
        type: enum
        source: input
        description: "Destination customs jurisdiction; controls which declaration-form template is generated"
        constraints: "One of {CN, US, EU, JP, GB}"
      - name: shipment_reference
        type: string
        source: input
        description: "Carrier/forwarder reference for the shipment (e.g., MBL/AWB number)"
        constraints: "1..60 chars, unique per agreement_id among non-WITHDRAWN declarations"
      - name: hs_code
        type: string
        source: input
        description: "Harmonized System code, 6-10 digits depending on jurisdiction"
        constraints: "Numeric, length in {6,8,10}"
      - name: country_of_origin
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 origin"
        constraints: "Exactly 2 uppercase letters"
      - name: trade_agreement_code
        type: enum
        source: input
        description: "Preferential trade agreement claimed; NONE means MFN (general) tariff applies"
        default: "NONE"
        constraints: "One of {NONE, RCEP, USMCA, EU_GSP, CPTPP}"
      - name: declared_value_amount
        type: number
        source: input
        description: "Declared customs value in declared_currency"
        constraints: ">= 0, two decimal places"
      - name: declared_currency
        type: enum
        source: input
        description: "Currency in which declared_value_amount is denominated"
        constraints: "One of {USD, EUR, CNY, JPY, GBP}"
      - name: fx_rate_to_settlement
        type: number
        source: system
        description: "FX rate snapshot from declared_currency to the agreement's settlement currency, captured at PRE_VALIDATED transition. 1.0 if currencies match."
        default: null
      - name: declared_value_review_status
        type: enum
        source: system
        description: "Output of declared-value review heuristic"
        default: "PENDING"
        constraints: "One of {PENDING, ACCEPTED, FLAGGED}"
      - name: form_payload
        type: object
        source: computed
        description: "Generated jurisdiction-specific declaration form (key/value pairs per jurisdiction template)"
        default: null
      - name: status
        type: enum
        source: system
        description: "Declaration workflow state"
        default: "DRAFT"
        constraints: "One of {DRAFT, DOCS_PENDING, PRE_VALIDATED, FILED, QUERIED, INSPECTING, RELEASED, REJECTED, WITHDRAWN, AMENDING}"
      - name: rejection_reason_code
        type: enum
        source: system
        description: "Set when status=REJECTED; classifies the rejection for analytics"
        default: null
        constraints: "One of {HS_MISMATCH, VALUE_UNDERSTATED, MISSING_LICENSE, INSPECTION_FAILED, MANIFEST_MISMATCH, OTHER, NULL}"
      - name: amendment_count
        type: integer
        source: system
        description: "Number of times this declaration has cycled through AMENDING and been re-filed"
        default: 0
      - name: pinned_agreement_version
        type: integer
        source: system
        description: "Snapshot of CommissionAgreement.version at the moment status flipped to PRE_VALIDATED. Stale check at FILED→… transitions."
        default: null

  - name: ShipmentDocument
    parent: Declaration
    common_fields: true
    fields:
      - name: declaration_id
        type: string
        source: input
        description: "FK to Declaration.id"
      - name: doc_type
        type: enum
        source: input
        description: "Document category"
        constraints: "One of {COMMERCIAL_INVOICE, PACKING_LIST, BILL_OF_LADING, CONTRACT, IMPORT_LICENSE, INSPECTION_CERT, DANGEROUS_GOODS_DECL}"
      - name: storage_uri
        type: string
        source: input
        description: "Opaque URI where the file is stored (e.g., s3://...)"
        constraints: "1..500 chars"
      - name: declared_total_value
        type: number
        source: input
        description: "Total value claimed by this document, when applicable (e.g., invoice/packing-list); null for documents without a numeric total"
        default: null
      - name: declared_total_currency
        type: enum
        source: input
        description: "Currency of declared_total_value; null when declared_total_value is null"
        default: null
        constraints: "One of {USD, EUR, CNY, JPY, GBP, NULL}"
      - name: authenticity_score
        type: number
        source: system
        description: "Output of preliminary authenticity screening, 0.00..1.00"
        default: null
      - name: authenticity_status
        type: enum
        source: system
        description: "Coarse-grained authenticity verdict"
        default: "UNSCREENED"
        constraints: "One of {UNSCREENED, ACCEPTED, FLAGGED}"
      - name: follow_up_requested_at
        type: datetime
        source: system
        description: "Timestamp at which client was asked to provide a missing document of this type; null if not requested"
        default: null

  - name: Filing
    parent: Declaration
    common_fields: true
    fields:
      - name: declaration_id
        type: string
        source: input
        description: "FK to Declaration.id"
      - name: single_window_ref
        type: string
        source: system
        description: "Reference assigned by the customs single-window event on submission"
      - name: submitted_at
        type: datetime
        source: system
        description: "Timestamp of submission to the customs single window"
      - name: response_type
        type: enum
        source: system
        description: "Customs response classification"
        default: "AWAITING"
        constraints: "One of {AWAITING, RELEASE, QUERY, INSPECT, REJECT}"
      - name: response_received_at
        type: datetime
        source: system
        description: "Timestamp the customs response was received (via emit endpoint)"
        default: null
      - name: query_due_at
        type: datetime
        source: system
        description: "Deadline by which broker must respond to a QUERY response; computed as response_received_at + 48h. Null when response_type != QUERY."
        default: null
      - name: query_response_at
        type: datetime
        source: system
        description: "Timestamp at which broker responded to the query; null until response submitted"
        default: null
      - name: manifest_match_status
        type: enum
        source: system
        description: "Result of matching the filing to the carrier manifest event"
        default: "UNMATCHED"
        constraints: "One of {UNMATCHED, MATCHED, MISMATCHED}"
      - name: is_amendment
        type: boolean
        source: input
        description: "True if this is an amendment-declaration filing (declaration.amendment_count > 0)"
        default: false

  - name: InspectionCase
    parent: Filing
    common_fields: true
    fields:
      - name: filing_id
        type: string
        source: input
        description: "FK to Filing.id (filings whose response_type=INSPECT)"
      - name: warehouse_code
        type: string
        source: input
        description: "Bonded warehouse code where inspection will be conducted"
        constraints: "1..40 chars"
      - name: scheduled_at
        type: datetime
        source: input
        description: "Customs-scheduled inspection start time (ISO 8601 UTC). Inspection window is [scheduled_at, scheduled_at + 4h)."
      - name: sample_required
        type: boolean
        source: input
        description: "Whether client must provide a physical sample"
        default: false
      - name: sample_provided_at
        type: datetime
        source: system
        description: "Timestamp client confirmed sample was provided; null if not yet provided or not required"
        default: null
      - name: outcome
        type: enum
        source: system
        description: "Inspection outcome assigned by customs"
        default: "PENDING"
        constraints: "One of {PENDING, RELEASE, DETENTION, PENALTY}"
      - name: penalty_amount
        type: number
        source: input
        description: "Penalty levied when outcome=PENALTY (in declared_currency); 0 otherwise"
        default: 0
      - name: post_inspection_doc_uri
        type: string
        source: input
        description: "Customs-issued post-inspection report URI; set when outcome is recorded"
        default: null

  - name: Settlement
    parent: Declaration
    common_fields: true
    fields:
      - name: declaration_id
        type: string
        source: input
        description: "FK to Declaration.id"
      - name: tariff_amount
        type: number
        source: computed
        description: "Computed tariff in settlement_currency, per calc:compute_tariff"
        default: null
      - name: vat_amount
        type: number
        source: computed
        description: "Computed VAT in settlement_currency, per calc:compute_vat"
        default: null
      - name: consumption_tax_amount
        type: number
        source: computed
        description: "Computed consumption tax in settlement_currency, per calc:compute_consumption_tax"
        default: null
      - name: penalty_amount
        type: number
        source: computed
        description: "Penalty fees from InspectionCase, converted to settlement_currency at Declaration.fx_rate_to_settlement"
        default: 0
      - name: broker_fee_amount
        type: number
        source: computed
        description: "Broker service fee per CommissionAgreement.fee_schedule, summed over services consumed by this declaration"
        default: 0
      - name: settlement_currency
        type: enum
        source: system
        description: "Snapshot of ClientCompany.default_settlement_currency at advance creation"
        constraints: "One of {USD, EUR, CNY, JPY, GBP}"
      - name: advance_paid_amount
        type: number
        source: system
        description: "Total broker-advanced principal in settlement_currency (= tariff+vat+consumption_tax+penalty)"
        default: 0
      - name: advance_paid_at
        type: datetime
        source: system
        description: "Timestamp broker funded the advance to customs"
        default: null
      - name: reimbursement_due_at
        type: datetime
        source: system
        description: "Deadline for client to reimburse the broker; computed as advance_paid_at + 7 days"
        default: null
      - name: reimbursed_at
        type: datetime
        source: system
        description: "Timestamp client reimbursed broker; null until reimbursed"
        default: null
      - name: late_interest_amount
        type: number
        source: computed
        description: "Accumulated late-reimbursement interest at the moment of settlement closure; recomputed on each clock advance after due date"
        default: 0
      - name: voucher_uri
        type: string
        source: system
        description: "Tax-payment voucher URI delivered to client after reimbursement; null until reimbursed"
        default: null
      - name: status
        type: enum
        source: system
        description: "Settlement lifecycle"
        default: "PROVISIONAL"
        constraints: "One of {PROVISIONAL, FINAL, ADVANCED, REIMBURSED, VOIDED}"

  - name: RejectionRecord
    parent: Declaration
    common_fields: false
    fields:
      - name: declaration_id
        type: string
        source: input
        description: "FK to Declaration.id"
      - name: rejection_reason_code
        type: enum
        source: input
        description: "Reason classification"
        constraints: "One of {HS_MISMATCH, VALUE_UNDERSTATED, MISSING_LICENSE, INSPECTION_FAILED, MANIFEST_MISMATCH, OTHER}"
      - name: archived_at
        type: datetime
        source: system
        description: "Timestamp the rejection was archived (ISO 8601 UTC)"
      - name: free_text_note
        type: string
        source: input
        description: "Operator-supplied note describing the rejection context"
        default: null
        constraints: "0..500 chars"
      - name: prior_amendment_count
        type: integer
        source: system
        description: "Declaration.amendment_count snapshot at archival"

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: entity_type
        type: enum
        source: system
        description: "Which entity the event pertains to"
        constraints: "One of {DECLARATION, SETTLEMENT, FILING, INSPECTION_CASE, AGREEMENT}"
      - name: entity_id
        type: string
        source: system
        description: "ID of the entity instance"
      - name: event_type
        type: enum
        source: system
        description: "Category of audit event"
        constraints: "One of {STATE_TRANSITION, FIELD_CHANGE, ADVANCE_PAID, REIMBURSED, AMENDMENT_FILED, VOUCHER_DELIVERED}"
      - name: actor_role
        type: string
        source: system
        description: "Role of the user (or 'system') who triggered the event"
      - name: actor_id
        type: string
        source: system
        description: "X-User-ID of the triggering actor, or 'system' for clock/event-driven changes"
      - name: payload
        type: object
        source: system
        description: "Event-specific snapshot — for STATE_TRANSITION: {from, to}; for FIELD_CHANGE: {field, old, new}; for ADVANCE_PAID/REIMBURSED: {amount, currency}; etc."

  - name: ExternalEvent
    parent: null
    common_fields: false
    fields:
      - name: source_system
        type: enum
        source: input
        description: "Originating external system"
        constraints: "One of {SINGLE_WINDOW, INSPECTION_QUARANTINE, BANK, LOGISTICS}"
      - name: event_type
        type: enum
        source: input
        description: "Event subtype within the source system"
        constraints: "One of {CUSTOMS_RESPONSE, MANIFEST_DROPPED, INSPECTION_NOTICE, BANK_DEBIT_CONFIRMED, RETURN_SHIPMENT_DISPATCHED}"
      - name: target_entity_type
        type: enum
        source: input
        description: "Which scaffold entity the event targets"
        constraints: "One of {FILING, DECLARATION, SETTLEMENT, INSPECTION_CASE}"
      - name: target_entity_id
        type: string
        source: input
        description: "ID of the target entity instance"
      - name: payload
        type: object
        source: input
        description: "Event-specific data (e.g., {response_type: 'QUERY'} for CUSTOMS_RESPONSE, {manifest_matches: true} for MANIFEST_DROPPED)"
      - name: processed_at
        type: datetime
        source: system
        description: "Timestamp the event was processed"

# ─────────────────────────────────────────────────────────────────────────────
# §1.2 State Machine Table
# ─────────────────────────────────────────────────────────────────────────────
state_machines:
  - entity: CommissionAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED, RENEWED]
    transitions:
      - from: DRAFT
        to: AWAITING_SIGNATURE
        trigger: "POST /customs/agreements/{id}/request-signature"
        actor: BrokerOps
        preconditions:
          - "ClientCompany.status == ACTIVE"
          - "fee_schedule keys == scope_of_service exactly"
          - "valid_from < valid_until"
        side_effects:
          - "Generate signature_token (opaque uuid) and persist"
          - "AuditLog: STATE_TRANSITION {DRAFT→AWAITING_SIGNATURE}"
      - from: AWAITING_SIGNATURE
        to: ACTIVE
        trigger: "POST /customs/agreements/{id}/sign"
        actor: ClientUser
        preconditions:
          - "signature_token in request matches stored signature_token"
          - "now() < valid_until"
        side_effects:
          - "Set signed_at = now()"
          - "Snapshot pinned_fee_schedule_version = version (post-increment)"
          - "If renewed_from_agreement_id is set: set predecessor.status = RENEWED"
          - "AuditLog: STATE_TRANSITION + FIELD_CHANGE(signed_at)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /customs/_clock/advance crosses valid_until"
        actor: system
        preconditions:
          - "now() >= valid_until"
          - "No Declarations under this agreement in non-terminal status"
        side_effects:
          - "AuditLog: STATE_TRANSITION {ACTIVE→EXPIRED}"
        note: "If non-terminal declarations exist, the agreement stays ACTIVE past valid_until until they settle or reject — see validation V-AGR-EXP-BLOCK."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /customs/agreements/{id}/terminate"
        actor: BrokerOps
        preconditions:
          - "terminated_reason ∈ {CLIENT_REQUEST, BREACH, REGULATORY}"
          - "No Declarations under this agreement in {DRAFT, DOCS_PENDING, PRE_VALIDATED, FILED, QUERIED, INSPECTING, AMENDING}"
        side_effects:
          - "AuditLog: STATE_TRANSITION + FIELD_CHANGE(terminated_reason)"
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /customs/agreements/{id}/terminate"
        actor: BrokerOps
        preconditions:
          - "terminated_reason ∈ {CLIENT_REQUEST, BREACH, REGULATORY}"
        side_effects:
          - "AuditLog: STATE_TRANSITION"

  - entity: Declaration
    initial_state: DRAFT
    terminal_states: [RELEASED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: DOCS_PENDING
        trigger: "POST /customs/declarations/{id}/request-documents"
        actor: DeclarationOfficer
        preconditions:
          - "hs_code, country_of_origin, declared_value_amount, declared_currency populated"
          - "CommissionAgreement.status == ACTIVE"
          - "DECLARATION ∈ agreement.scope_of_service"
        side_effects:
          - "For each ShipmentDocument doc_type NOT yet present in {COMMERCIAL_INVOICE, PACKING_LIST, BILL_OF_LADING, CONTRACT}: create stub with follow_up_requested_at = now()"
          - "AuditLog: STATE_TRANSITION"
      - from: DOCS_PENDING
        to: PRE_VALIDATED
        trigger: "POST /customs/declarations/{id}/pre-validate"
        actor: DocReviewer
        preconditions:
          - "All four core docs {COMMERCIAL_INVOICE, PACKING_LIST, BILL_OF_LADING, CONTRACT} present"
          - "Any required jurisdiction-specific docs present (see V-DOC-LICENSE, V-DOC-DG)"
          - "Cross-document consistency: max(invoice.declared_total_value, packing_list.declared_total_value) - min(...) <= 0.5% of max (when both present and same currency)"
          - "No ShipmentDocument has authenticity_status = FLAGGED"
          - "declared_value_review_status != FLAGGED"
        side_effects:
          - "Compute fx_rate_to_settlement (snapshot)"
          - "Generate form_payload per jurisdiction_code template"
          - "Snapshot pinned_agreement_version = CommissionAgreement.version"
          - "AuditLog: STATE_TRANSITION + FIELD_CHANGE(form_payload, fx_rate_to_settlement)"
      - from: PRE_VALIDATED
        to: FILED
        trigger: "POST /customs/declarations/{id}/file"
        actor: FilingOfficer
        preconditions:
          - "pinned_agreement_version == CommissionAgreement.version (no drift since pre-validation)"
          - "Actor X-User-ID differs from the DocReviewer X-User-ID that performed the pre-validation transition (segregation of duties)"
        side_effects:
          - "Create Filing with submitted_at=now(), single_window_ref=<uuid>, response_type=AWAITING"
          - "AuditLog: STATE_TRANSITION + AMENDMENT_FILED (if amendment_count > 0)"
      - from: FILED
        to: QUERIED
        trigger: "POST /customs/_events/emit with source_system=SINGLE_WINDOW, event_type=CUSTOMS_RESPONSE, payload.response_type=QUERY"
        actor: system
        preconditions:
          - "Filing.response_type == AWAITING"
        side_effects:
          - "Set Filing.response_type=QUERY, response_received_at=now(), query_due_at=now()+48h"
          - "AuditLog: STATE_TRANSITION"
      - from: FILED
        to: INSPECTING
        trigger: "POST /customs/_events/emit with source_system=SINGLE_WINDOW, event_type=CUSTOMS_RESPONSE, payload.response_type=INSPECT"
        actor: system
        preconditions:
          - "Filing.response_type == AWAITING"
        side_effects:
          - "Set Filing.response_type=INSPECT, response_received_at=now()"
          - "AuditLog: STATE_TRANSITION (Declaration), STATE_TRANSITION (Filing implicitly)"
      - from: FILED
        to: RELEASED
        trigger: "POST /customs/_events/emit with source_system=SINGLE_WINDOW, event_type=CUSTOMS_RESPONSE, payload.response_type=RELEASE"
        actor: system
        preconditions:
          - "Filing.response_type == AWAITING"
          - "Filing.manifest_match_status == MATCHED"
        side_effects:
          - "Set Filing.response_type=RELEASE, response_received_at=now()"
          - "Cascade: create Settlement with status=FINAL; populate tariff/vat/consumption_tax via calc:compute_tariff, compute_vat, compute_consumption_tax"
          - "Cascade: AuditLog STATE_TRANSITION on Declaration AND Settlement (PROVISIONAL→FINAL implicit at creation)"
      - from: FILED
        to: REJECTED
        trigger: "POST /customs/_events/emit with source_system=SINGLE_WINDOW, event_type=CUSTOMS_RESPONSE, payload.response_type=REJECT"
        actor: system
        preconditions:
          - "Filing.response_type == AWAITING"
        side_effects:
          - "Set Filing.response_type=REJECT, response_received_at=now()"
          - "Set rejection_reason_code = payload.reason_code"
          - "Create RejectionRecord with archived_at=now(), prior_amendment_count = amendment_count"
          - "Cascade: AuditLog STATE_TRANSITION + AMENDMENT_FILED-rollback semantics"
      - from: QUERIED
        to: FILED
        trigger: "POST /customs/declarations/{id}/respond-query"
        actor: FilingOfficer
        preconditions:
          - "now() < Filing.query_due_at"
          - "Filing.response_type == QUERY"
        side_effects:
          - "Set Filing.query_response_at = now()"
          - "Set Filing.response_type = AWAITING (re-enters monitoring)"
          - "AuditLog: STATE_TRANSITION"
      - from: QUERIED
        to: REJECTED
        trigger: "system: POST /customs/_clock/advance crosses Filing.query_due_at without query_response_at"
        actor: system
        preconditions:
          - "now() >= Filing.query_due_at"
          - "Filing.query_response_at == null"
        side_effects:
          - "Set rejection_reason_code = OTHER"
          - "Create RejectionRecord with archived_at=now()"
          - "AuditLog: STATE_TRANSITION"
      - from: INSPECTING
        to: RELEASED
        trigger: "POST /customs/inspection-cases/{id}/record-outcome with outcome=RELEASE"
        actor: InspectionOfficer
        preconditions:
          - "InspectionCase.outcome == PENDING before this call"
          - "If sample_required=true: sample_provided_at is not null"
          - "now() >= InspectionCase.scheduled_at"
        side_effects:
          - "Set InspectionCase.outcome=RELEASE, post_inspection_doc_uri = request.doc_uri"
          - "Cascade: create Settlement with status=FINAL; populate amounts (penalty_amount=0)"
          - "AuditLog: STATE_TRANSITION + cascade"
      - from: INSPECTING
        to: REJECTED
        trigger: "POST /customs/inspection-cases/{id}/record-outcome with outcome ∈ {DETENTION, PENALTY}"
        actor: InspectionOfficer
        preconditions:
          - "InspectionCase.outcome == PENDING"
          - "If outcome=PENALTY: penalty_amount > 0"
        side_effects:
          - "Set InspectionCase.outcome, penalty_amount (if applicable), post_inspection_doc_uri"
          - "Set Declaration.rejection_reason_code = INSPECTION_FAILED"
          - "Create RejectionRecord with archived_at=now()"
          - "If outcome=PENALTY: cascade-create Settlement with penalty included via calc:compute_penalty_in_settlement_currency"
          - "AuditLog: STATE_TRANSITION + cascade"
      - from: REJECTED
        to: AMENDING
        trigger: "POST /customs/declarations/{id}/amend"
        actor: DeclarationOfficer
        preconditions:
          - "rejection_reason_code != INSPECTION_FAILED (inspection failures cannot be amended — must withdraw)"
          - "amendment_count < 3"
          - "RejectionRecord exists for this declaration"
        side_effects:
          - "Increment amendment_count by 1"
          - "Clear rejection_reason_code"
          - "Clear pinned_agreement_version (must re-pre-validate)"
          - "AuditLog: STATE_TRANSITION + FIELD_CHANGE(amendment_count)"
      - from: AMENDING
        to: PRE_VALIDATED
        trigger: "POST /customs/declarations/{id}/pre-validate"
        actor: DocReviewer
        preconditions:
          - "Same as DOCS_PENDING→PRE_VALIDATED preconditions"
        side_effects:
          - "Same as DOCS_PENDING→PRE_VALIDATED side effects"
      - from: REJECTED
        to: WITHDRAWN
        trigger: "POST /customs/declarations/{id}/withdraw"
        actor: BrokerOps
        preconditions:
          - "RejectionRecord exists for this declaration"
          - "No Settlement with status ∈ {ADVANCED, REIMBURSED}"
        side_effects:
          - "If a PROVISIONAL Settlement exists: set Settlement.status=VOIDED"
          - "Emit ExternalEvent to LOGISTICS with event_type=RETURN_SHIPMENT_DISPATCHED"
          - "AuditLog: STATE_TRANSITION"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /customs/declarations/{id}/withdraw"
        actor: BrokerOps
        preconditions:
          - "No Filing exists"
        side_effects:
          - "AuditLog: STATE_TRANSITION"

  - entity: Filing
    initial_state: AWAITING
    terminal_states: [RELEASE, REJECT]
    transitions:
      - from: AWAITING
        to: AWAITING
        trigger: "POST /customs/_events/emit with source_system=LOGISTICS, event_type=MANIFEST_DROPPED"
        actor: system
        preconditions:
          - "Filing.response_type == AWAITING"
        side_effects:
          - "Set manifest_match_status = MATCHED iff payload.shipment_reference == Declaration.shipment_reference and payload.hs_code == Declaration.hs_code; else MISMATCHED"
          - "If MISMATCHED: AuditLog FIELD_CHANGE; subsequent CUSTOMS_RESPONSE=RELEASE will be rejected by V-FIL-MANIFEST"
        note: "Filing state stays AWAITING; only the manifest_match_status changes. Declaration state is unaffected here."

  - entity: InspectionCase
    initial_state: PENDING
    terminal_states: [RELEASE, DETENTION, PENALTY]
    transitions:
      - from: PENDING
        to: RELEASE
        trigger: "POST /customs/inspection-cases/{id}/record-outcome with outcome=RELEASE"
        actor: InspectionOfficer
        preconditions:
          - "see Declaration.INSPECTING→RELEASED"
        side_effects:
          - "see Declaration.INSPECTING→RELEASED"
      - from: PENDING
        to: DETENTION
        trigger: "POST /customs/inspection-cases/{id}/record-outcome with outcome=DETENTION"
        actor: InspectionOfficer
        preconditions:
          - "see Declaration.INSPECTING→REJECTED"
        side_effects:
          - "see Declaration.INSPECTING→REJECTED"
      - from: PENDING
        to: PENALTY
        trigger: "POST /customs/inspection-cases/{id}/record-outcome with outcome=PENALTY"
        actor: InspectionOfficer
        preconditions:
          - "see Declaration.INSPECTING→REJECTED"
        side_effects:
          - "see Declaration.INSPECTING→REJECTED"

  - entity: Settlement
    initial_state: PROVISIONAL
    terminal_states: [REIMBURSED, VOIDED]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "system: created on Declaration.RELEASED transition"
        actor: system
        preconditions:
          - "Declaration.status == RELEASED"
        side_effects:
          - "Settlement is created already in FINAL — PROVISIONAL state exists only for the brief instant during creation in code. The state column reads FINAL after the transition fully completes. No separate persisted PROVISIONAL row."
        note: "PROVISIONAL is logically the initial state but never observable from the API — it transitions to FINAL atomically during the cascade. The enum value remains in the constraint set so that tooling and audit logs may reference it."
      - from: FINAL
        to: ADVANCED
        trigger: "POST /customs/settlements/{id}/advance"
        actor: SettlementOfficer
        preconditions:
          - "Settlement.status == FINAL"
          - "Settlement.tariff_amount + vat_amount + consumption_tax_amount + penalty_amount > 0"
          - "Actor X-User-ID differs from FilingOfficer who performed PRE_VALIDATED→FILED transition (segregation of duties)"
        side_effects:
          - "Set advance_paid_amount = tariff + vat + consumption_tax + penalty"
          - "Set advance_paid_at = now()"
          - "Set reimbursement_due_at = now() + 7 days"
          - "AuditLog: STATE_TRANSITION + ADVANCE_PAID {amount, currency}"
      - from: ADVANCED
        to: REIMBURSED
        trigger: "POST /customs/_events/emit with source_system=BANK, event_type=BANK_DEBIT_CONFIRMED, target=Settlement"
        actor: system
        preconditions:
          - "Settlement.status == ADVANCED"
          - "payload.amount equals advance_paid_amount + late_interest_amount(now())"
        side_effects:
          - "Set reimbursed_at = now()"
          - "Recompute late_interest_amount one final time at now() and freeze the value"
          - "Generate voucher_uri = 'voucher://' + settlement.id"
          - "AuditLog: STATE_TRANSITION + REIMBURSED {amount, currency} + VOUCHER_DELIVERED"
      - from: PROVISIONAL
        to: VOIDED
        trigger: "system: Declaration.REJECTED→WITHDRAWN"
        actor: system
        preconditions:
          - "Declaration.status == WITHDRAWN"
          - "Settlement.status == PROVISIONAL"
        side_effects:
          - "AuditLog: STATE_TRANSITION"
      - from: FINAL
        to: VOIDED
        trigger: "system: Declaration.REJECTED→WITHDRAWN"
        actor: system
        preconditions:
          - "Declaration.status == WITHDRAWN"
          - "Settlement.status == FINAL"
        side_effects:
          - "AuditLog: STATE_TRANSITION"

# ─────────────────────────────────────────────────────────────────────────────
# §1.2.1 Concurrency Rules
# ─────────────────────────────────────────────────────────────────────────────
concurrency_rules:
  - scenario: "Two FilingOfficers click 'file' on the same PRE_VALIDATED declaration simultaneously"
    guarantee: "At most one Filing per Declaration in non-terminal Filing state; loser is rejected"
    error_id: ERR_FILING_ALREADY_EXISTS
    http_status: 409
    serialization: "First-writer-wins on Filing creation under a given declaration_id"

  - scenario: "Customs sends CUSTOMS_RESPONSE=RELEASE event while FilingOfficer concurrently submits respond-query (which would re-enter AWAITING)"
    guarantee: "Exactly one transition succeeds; loser is rejected as state precondition violation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Filing.response_type field"

  - scenario: "Two SettlementOfficers click 'advance' on the same FINAL settlement simultaneously"
    guarantee: "At most one advance per Settlement; loser is rejected"
    error_id: ERR_SETTLEMENT_ALREADY_ADVANCED
    http_status: 409
    serialization: "First-writer-wins on Settlement.advance_paid_at field"

  - scenario: "Withdrawal of declaration races with advance funding on the same settlement"
    guarantee: "Either advance succeeds (then withdrawal is blocked by V-DEC-WITHDRAW-NOADV) or withdrawal succeeds (then advance is blocked by V-SET-ADV-WITHDRAWN). Exactly one outcome."
    error_id: ERR_SETTLEMENT_HAS_ADVANCE
    http_status: 409
    serialization: "First-writer-wins on Settlement.status; if advance wins, withdrawal returns ERR_SETTLEMENT_HAS_ADVANCE; if withdrawal wins, advance returns ERR_INVALID_STATE"

  - scenario: "Two DeclarationOfficers concurrently sign an agreement in AWAITING_SIGNATURE"
    guarantee: "At most one sign succeeds; loser is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on CommissionAgreement.signed_at"

# ─────────────────────────────────────────────────────────────────────────────
# §1.3 Calculation Rules Table
# ─────────────────────────────────────────────────────────────────────────────
calculations:
  - name: compute_tariff
    trigger: "Side effect of Declaration FILED→RELEASED (or INSPECTING→RELEASED, or INSPECTING→PENALTY); writes Settlement.tariff_amount"
    algorithm: tiered_pricing
    formula: |
      # Step 1: convert declared value to settlement_currency
      base_value = round(declared_value_amount * fx_rate_to_settlement, 2)  # round per line item

      # Step 2: select duty rate
      if trade_agreement_code == "NONE":
          rate = MFN_RATE_TABLE[jurisdiction_code][hs_code_first_4]  # general tariff
      else:
          # Preferential rate — variant A
          rate = FTA_RATE_TABLE[trade_agreement_code][jurisdiction_code][hs_code_first_4]

      # Step 3: tiered surcharge above declared-value breakpoints (in settlement currency)
      if base_value <= 10000:
          tier_factor = 1.00
      elif base_value <= 50000:
          tier_factor = 1.05  # +5% over [10000, 50000]
      else:
          tier_factor = 1.10  # +10% over (50000, ∞)

      tariff_amount = round(base_value * rate * tier_factor, 2)  # round once at the end
    input_set: "Inputs are Declaration fields snapshotted at PRE_VALIDATED (declared_value_amount, declared_currency, fx_rate_to_settlement, jurisdiction_code, hs_code, trade_agreement_code, country_of_origin). Excludes any fields mutated after PRE_VALIDATED."
    constants:
      MFN_RATE_TABLE:
        CN: { default: 0.10, "8517": 0.05 }
        US: { default: 0.08, "8517": 0.04 }
        EU: { default: 0.12, "8517": 0.06 }
        JP: { default: 0.09, "8517": 0.045 }
        GB: { default: 0.10, "8517": 0.05 }
      FTA_RATE_TABLE:
        RCEP: { CN: { default: 0.05, "8517": 0.02 }, JP: { default: 0.04, "8517": 0.02 } }
        USMCA: { US: { default: 0.03, "8517": 0.015 } }
        EU_GSP: { EU: { default: 0.06, "8517": 0.03 } }
        CPTPP: { JP: { default: 0.035, "8517": 0.015 } }
    precision: "Multi-step: round base_value (2dp) per line-item conversion; final tariff_amount rounded once at end (2dp, round_half_up). Order: convert→round→multiply→multiply→round. Variant A vs B differ only in which rate table is consulted."
    variants:
      - name: general_tariff
        when: "trade_agreement_code == NONE OR country_of_origin not listed in FTA_RATE_TABLE[trade_agreement_code][jurisdiction_code]"
        difference: "Uses MFN_RATE_TABLE; produces strictly higher tariff than preferential for the same hs_code (since FTA rates < MFN rates by construction in the constants table)"
      - name: preferential_tariff
        when: "trade_agreement_code != NONE AND country_of_origin is eligible under the agreement (eligibility table inlined in PRD)"
        difference: "Uses FTA_RATE_TABLE; preferential rate applied; same base_value and tier_factor as general_tariff"

  - name: compute_vat
    trigger: "Side effect of Declaration FILED→RELEASED (or INSPECTING→RELEASED, or INSPECTING→PENALTY); writes Settlement.vat_amount"
    algorithm: aggregation
    formula: |
      # VAT base = base_value + tariff_amount  (after tariff has been computed)
      vat_rate = VAT_RATE_TABLE[jurisdiction_code]
      vat_base = base_value + tariff_amount   # use already-rounded tariff
      vat_amount = round(vat_base * vat_rate, 2)
    input_set: "base_value (from compute_tariff), tariff_amount (must be computed before VAT), jurisdiction_code"
    constants:
      VAT_RATE_TABLE:
        CN: 0.13
        US: 0.00
        EU: 0.21
        JP: 0.10
        GB: 0.20
    precision: "2 decimal places, round_half_up. Evaluation order pinned: compute_tariff → compute_vat → compute_consumption_tax. Each result is rounded to 2dp before feeding into the next; do NOT recompute tariff inside vat formula with higher precision."

  - name: compute_consumption_tax
    trigger: "Side effect of Declaration FILED→RELEASED (or INSPECTING→RELEASED, or INSPECTING→PENALTY); writes Settlement.consumption_tax_amount"
    algorithm: threshold
    formula: |
      # Consumption tax only applies to certain HS codes and jurisdictions
      key = (jurisdiction_code, hs_code_first_4)
      if key not in CONSUMPTION_TAX_TABLE:
          consumption_tax_amount = 0
      else:
          ct_rate = CONSUMPTION_TAX_TABLE[key]
          # Base = base_value + tariff_amount (NOT including VAT)
          ct_base = base_value + tariff_amount
          if ct_base < 100:
              consumption_tax_amount = 0       # boundary: < 100 means exemption, >= 100 means taxed
          else:
              consumption_tax_amount = round(ct_base * ct_rate, 2)
    input_set: "base_value, tariff_amount, jurisdiction_code, hs_code_first_4"
    constants:
      CONSUMPTION_TAX_TABLE:
        "(CN, 2208)": 0.20      # spirits
        "(JP, 2208)": 0.15
        "(US, 2402)": 0.30      # tobacco
        "(GB, 2402)": 0.25
    precision: "2 decimal places, round_half_up. Boundary: ct_base >= 100 triggers tax; ct_base < 100 returns 0."

  - name: compute_late_interest
    trigger: "Side effect of POST /customs/_clock/advance any time after Settlement.reimbursement_due_at; finalized on Settlement.ADVANCED→REIMBURSED"
    algorithm: chronological
    formula: |
      # If reimbursed_at is null:
      if now() <= reimbursement_due_at:
          late_interest_amount = 0
      else:
          days_late = ceil( (now() - reimbursement_due_at).total_seconds() / 86400 )
          # daily rate from the agreement, in basis points
          rate_per_day = CommissionAgreement.late_interest_daily_rate_bps / 10000
          # interest = sum of daily compounding on principal (advance_paid_amount)
          # IMPORTANT: simple interest, not compounded — multi-step but final round once
          late_interest_amount = round(advance_paid_amount * rate_per_day * days_late, 2)
      # If reimbursed_at is not null: late_interest_amount is frozen at the value computed at reimbursed_at moment
    input_set: "advance_paid_amount, reimbursement_due_at, reimbursed_at, agreement.late_interest_daily_rate_bps, current clock"
    constants:
      DAY_SECONDS: 86400
    precision: "2 decimal places, round_half_up. Day count uses ceil() — a partial day still counts as a full day. Boundary: now() == reimbursement_due_at returns 0; now() == reimbursement_due_at + 1 microsecond returns 1 day of interest."
    variants:
      - name: ongoing_estimate
        when: "Settlement.status == ADVANCED and reimbursed_at is null"
        difference: "Returns the current snapshot at now() (changes as clock advances). This value is reported in GET responses but never persisted until REIMBURSED."
      - name: finalized
        when: "Settlement.status == REIMBURSED"
        difference: "Frozen at the value computed at the moment of REIMBURSED transition; subsequent clock advances do not change it"

  - name: compute_broker_fee
    trigger: "Side effect of Settlement creation (Declaration→RELEASED or INSPECTING→PENALTY)"
    algorithm: aggregation
    formula: |
      # Sum the agreement.fee_schedule entries for services actually consumed by this declaration
      services_consumed = ["DECLARATION"]                   # always
      if InspectionCase exists for this declaration: services_consumed.append("INSPECTION")
      if Settlement.advance_paid_amount > 0:               # always for FINAL settlements
          services_consumed.append("TARIFF_ADVANCE")
      if declaration.amendment_count > 0:                  # paid per amendment cycle
          services_consumed.append("AMENDMENT")

      raw_total_in_agreement_currency = sum(
          agreement.fee_schedule[svc] for svc in services_consumed
      )
      # Convert from agreement_currency to settlement_currency using the same fx snapshot path
      # (declared_currency→settlement_currency rate is fx_rate_to_settlement;
      #  agreement_currency→declared_currency uses AGREEMENT_FX_TABLE)
      fx_agreement_to_declared = AGREEMENT_FX_TABLE[(agreement_currency, declared_currency)]
      broker_fee_amount = round(
          raw_total_in_agreement_currency * fx_agreement_to_declared * fx_rate_to_settlement,
          2
      )
    input_set: "agreement.fee_schedule, agreement_currency, declared_currency, fx_rate_to_settlement, declaration.amendment_count, presence of InspectionCase"
    constants:
      AGREEMENT_FX_TABLE:
        "(USD, USD)": 1.00
        "(USD, CNY)": 7.20
        "(USD, EUR)": 0.92
        "(USD, JPY)": 150.0
        "(USD, GBP)": 0.78
        "(CNY, CNY)": 1.00
        "(CNY, USD)": 0.139
        "(EUR, EUR)": 1.00
        "(EUR, USD)": 1.08
        "(JPY, JPY)": 1.00
        "(JPY, USD)": 0.0067
        "(GBP, GBP)": 1.00
        "(GBP, USD)": 1.28
    precision: "Single round at end (2dp, round_half_up). Multi-step but rounding deferred — sum then multiply then round."

  - name: compute_authenticity_score
    trigger: "Side effect of POST /customs/declarations/{id}/documents (creating a ShipmentDocument); side effect of POST /customs/documents/{id}/screen"
    algorithm: weighted_scoring
    formula: |
      # Three signals, each in [0,1]:
      signal_total_match = 1.0 if (this doc has declared_total_value and another doc of different
                                    doc_type ∈ {COMMERCIAL_INVOICE, PACKING_LIST}
                                    has matching declared_total_value within 0.5%) else 0.0
      signal_currency_consistent = 1.0 if declared_total_currency == declaration.declared_currency else 0.0
      signal_uri_format = 1.0 if storage_uri matches pattern '^[a-z]+://.+$' else 0.5
      # Weights
      authenticity_score = round(
          0.5 * signal_total_match
        + 0.3 * signal_currency_consistent
        + 0.2 * signal_uri_format,
          2
      )
      # Threshold:
      authenticity_status = "ACCEPTED" if authenticity_score >= 0.70 else "FLAGGED"
    input_set: "ShipmentDocument fields + sibling documents of same Declaration + Declaration.declared_currency"
    constants:
      ACCEPT_THRESHOLD: 0.70
    precision: "2 decimal places, round_half_up. Boundary at exactly 0.70 → ACCEPTED."
    variants:
      - name: provisional_on_create
        when: "Triggered by POST /customs/declarations/{id}/documents"
        difference: "Computed against sibling docs that exist at the moment of insert. If a later sibling arrives that would have improved the score, this doc's score is NOT recomputed unless POST /screen is called."
      - name: final_on_screen
        when: "Triggered by POST /customs/documents/{id}/screen"
        difference: "Recomputes against the full current set of sibling docs. A doc that was FLAGGED on insert may become ACCEPTED after later siblings arrive and screen is called."

  - name: compute_declared_value_review
    trigger: "Side effect of POST /customs/declarations/{id} (PATCH updating declared_value_amount); side effect of POST /customs/declarations/{id}/pre-validate"
    algorithm: threshold
    formula: |
      # Reference price for the (jurisdiction, hs_code_first_4) pair
      ref_price = REFERENCE_PRICE_TABLE.get((jurisdiction_code, hs_code_first_4), None)
      if ref_price is None:
          declared_value_review_status = "ACCEPTED"   # no reference data → pass
      else:
          base_value = round(declared_value_amount * fx_rate_to_settlement, 2) if fx_rate_to_settlement else declared_value_amount
          deviation = abs(base_value - ref_price) / ref_price
          if deviation <= 0.25:
              declared_value_review_status = "ACCEPTED"
          else:
              declared_value_review_status = "FLAGGED"
    input_set: "declared_value_amount, declared_currency, fx_rate_to_settlement (when populated, else 1.0), jurisdiction_code, hs_code"
    constants:
      REFERENCE_PRICE_TABLE:
        "(CN, 8517)": 800.00
        "(US, 8517)": 800.00
        "(EU, 8517)": 800.00
        "(JP, 8517)": 800.00
        "(GB, 8517)": 800.00
        "(CN, 2208)": 50.00
    precision: "2 decimal places, round_half_up. Boundary: deviation <= 0.25 → ACCEPTED; deviation > 0.25 → FLAGGED."

# ─────────────────────────────────────────────────────────────────────────────
# §1.4 Validation Rules Table (Ordered by Priority)
# ─────────────────────────────────────────────────────────────────────────────
validations:
  # 1-9: Auth
  - priority: 1
    category: auth
    check: "X-User-Role header present and ∈ {BrokerOps, DeclarationOfficer, DocReviewer, FilingOfficer, InspectionOfficer, SettlementOfficer, ClientUser, SystemAdmin}"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-ID header present"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: all

  # 10-19: Authorization
  - priority: 10
    category: auth
    check: "Acting role is permitted to call this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  # 20-29: Existence (left-to-right path traversal)
  - priority: 20
    category: existence
    check: "URL-path resource(s) exist (404 ordered left-to-right when multiple ids appear)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 21
    category: existence
    check: "Referenced agreement_id / declaration_id / filing_id in request body exists"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST /declarations, POST /declarations/{id}/documents, POST /_events/emit"

  # 30-39: Optimistic concurrency
  - priority: 30
    category: state
    check: "If request body includes version, it must equal current entity version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PUT/PATCH/action endpoints"

  # 40-69: State preconditions
  - priority: 40
    category: state
    check: "Target resource is in a state where the requested operation is defined per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition action endpoints"
  - priority: 41
    category: state
    check: "(V-DEC-WITHDRAW-NOADV) Withdraw declaration: no Settlement with status ∈ {ADVANCED, REIMBURSED} for this declaration"
    error_id: ERR_SETTLEMENT_HAS_ADVANCE
    http_status: 409
    applies_to: "POST /declarations/{id}/withdraw"
  - priority: 42
    category: state
    check: "(V-SET-ADV-WITHDRAWN) Advance settlement: declaration status != WITHDRAWN"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /settlements/{id}/advance"

  # 70-89: business_safety / compliance / segregation_of_duties
  - priority: 70
    category: business_safety
    check: "(V-SOD-PREVAL-FILE) FilingOfficer who files MUST differ in X-User-ID from the DocReviewer who pre-validated"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /declarations/{id}/file"
  - priority: 71
    category: business_safety
    check: "(V-SOD-FILE-ADV) SettlementOfficer who advances funds MUST differ in X-User-ID from the FilingOfficer who filed the declaration"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /settlements/{id}/advance"
  - priority: 72
    category: business_safety
    check: "(V-DOC-AUTH-FLAGGED) Pre-validate declaration: no ShipmentDocument under it has authenticity_status = FLAGGED"
    error_id: ERR_DOC_AUTHENTICITY_FLAGGED
    http_status: 409
    applies_to: "POST /declarations/{id}/pre-validate"
  - priority: 73
    category: business_safety
    check: "(V-DOC-LICENSE) When hs_code starts with restricted prefix (28xx, 29xx) or jurisdiction=CN AND first 2 chars=29: an IMPORT_LICENSE doc must exist"
    error_id: ERR_DOC_MISSING_LICENSE
    http_status: 409
    applies_to: "POST /declarations/{id}/pre-validate"
  - priority: 74
    category: business_safety
    check: "(V-DOC-DG) When hs_code starts with 2208, 2402, or 2710: a DANGEROUS_GOODS_DECL doc must exist"
    error_id: ERR_DOC_MISSING_DG
    http_status: 409
    applies_to: "POST /declarations/{id}/pre-validate"

  # 90-109: business_constraint / consistency
  - priority: 90
    category: business_constraint
    check: "(V-DOC-COMPLETE) Pre-validate: all four core docs {COMMERCIAL_INVOICE, PACKING_LIST, BILL_OF_LADING, CONTRACT} exist for this declaration"
    error_id: ERR_DOC_INCOMPLETE
    http_status: 409
    applies_to: "POST /declarations/{id}/pre-validate"
  - priority: 91
    category: business_constraint
    check: "(V-DOC-CONSISTENCY) Pre-validate: |invoice.declared_total_value - packing_list.declared_total_value| <= 0.5% * max(both) when both present in same currency"
    error_id: ERR_DOC_INCONSISTENT
    http_status: 409
    applies_to: "POST /declarations/{id}/pre-validate"
  - priority: 92
    category: business_constraint
    check: "(V-DEC-VALUE-FLAGGED) File declaration: declared_value_review_status != FLAGGED"
    error_id: ERR_DECLARED_VALUE_FLAGGED
    http_status: 409
    applies_to: "POST /declarations/{id}/file"
  - priority: 93
    category: business_constraint
    check: "(V-FIL-MANIFEST) Process RELEASE customs response: Filing.manifest_match_status == MATCHED"
    error_id: ERR_MANIFEST_MISMATCH
    http_status: 409
    applies_to: "POST /_events/emit (when payload.response_type=RELEASE)"
  - priority: 94
    category: business_constraint
    check: "(V-AGR-FEE-KEYS) Activate agreement: every key in fee_schedule must equal some entry in scope_of_service, and vice versa"
    error_id: ERR_FEE_SCHEDULE_INVALID
    http_status: 422
    applies_to: "POST /agreements, POST /agreements/{id}/request-signature"

  # 110-129: business_temporal
  - priority: 110
    category: business_temporal
    check: "(V-AGR-VALIDITY) Create declaration: now() in [agreement.valid_from, agreement.valid_until)"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /declarations"
  - priority: 111
    category: business_temporal
    check: "(V-QRY-DEADLINE) Respond query: now() < Filing.query_due_at"
    error_id: ERR_QUERY_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /declarations/{id}/respond-query"
  - priority: 112
    category: business_temporal
    check: "(V-AGR-EXP-BLOCK) Auto-expire agreement: blocked if any Declaration under it is in {DRAFT, DOCS_PENDING, PRE_VALIDATED, FILED, QUERIED, INSPECTING, AMENDING}"
    error_id: ERR_AGREEMENT_HAS_OPEN_DECLARATIONS
    http_status: 409
    applies_to: "system: clock advance"

  # 130-149: business_referential
  - priority: 130
    category: business_referential
    check: "(V-AGR-DRIFT) File declaration: pinned_agreement_version == CommissionAgreement.version"
    error_id: ERR_AGREEMENT_VERSION_DRIFT
    http_status: 409
    applies_to: "POST /declarations/{id}/file"
  - priority: 131
    category: business_referential
    check: "(V-DEC-AMEND-CAP) Amend declaration: amendment_count < 3"
    error_id: ERR_AMENDMENT_CAP_REACHED
    http_status: 409
    applies_to: "POST /declarations/{id}/amend"
  - priority: 132
    category: business_referential
    check: "(V-DEC-AMEND-INSP) Amend declaration: rejection_reason_code != INSPECTION_FAILED (inspection rejections must be WITHDRAWN, not amended)"
    error_id: ERR_INSPECTION_REJECTION_NOT_AMENDABLE
    http_status: 409
    applies_to: "POST /declarations/{id}/amend"
  - priority: 133
    category: business_referential
    check: "(V-DEC-SCOPE) Create declaration: 'DECLARATION' ∈ agreement.scope_of_service"
    error_id: ERR_SERVICE_OUT_OF_SCOPE
    http_status: 409
    applies_to: "POST /declarations"

  # 150-169: business_fiscal / boundary
  - priority: 150
    category: business_fiscal
    check: "(V-SET-ADV-AMOUNT) Advance settlement: tariff+vat+consumption_tax+penalty > 0 (zero-amount settlements cannot be advanced)"
    error_id: ERR_SETTLEMENT_ZERO_AMOUNT
    http_status: 409
    applies_to: "POST /settlements/{id}/advance"
  - priority: 151
    category: business_fiscal
    check: "(V-BANK-DEBIT-AMT) Bank debit event: payload.amount == advance_paid_amount + late_interest_amount(now())"
    error_id: ERR_BANK_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /_events/emit (when source_system=BANK)"

  # 170-189: input format
  - priority: 170
    category: business_constraint
    check: "(V-INP-FORMAT) Request body field types, enum values, ranges per entity constraints"
    error_id: ERR_INVALID_INPUT
    http_status: 422
    applies_to: all

# ─────────────────────────────────────────────────────────────────────────────
# §1.5 API Endpoint Table
# ─────────────────────────────────────────────────────────────────────────────
endpoints:
  # ---- Clients ----
  - method: POST
    path: "/customs/clients"
    description: "Create a client company (consignor)"
    roles: [BrokerOps, SystemAdmin]
    code: 201
    input: [legal_name, tax_id, country_code, contact_email, default_settlement_currency]
    output: ClientCompany
    side_effects: []
  - method: GET
    path: "/customs/clients/{id}"
    description: "Read client"
    roles: [BrokerOps, SystemAdmin, ClientUser]
    code: 200
    input: []
    output: ClientCompany
    side_effects: []
  - method: GET
    path: "/customs/clients"
    description: "List clients (filterable by status)"
    roles: [BrokerOps, SystemAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ClientCompany[]"
    side_effects: []
  - method: PATCH
    path: "/customs/clients/{id}"
    description: "Update client (excluding tax_id once set)"
    roles: [BrokerOps, SystemAdmin]
    code: 200
    input: ["legal_name?", "contact_email?", "default_settlement_currency?", "status?", version]
    output: ClientCompany
    side_effects: []

  # ---- Agreements ----
  - method: POST
    path: "/customs/agreements"
    description: "Create a commission agreement (DRAFT)"
    roles: [BrokerOps]
    code: 201
    input: [client_id, scope_of_service, fee_schedule, agreement_currency, valid_from, valid_until, late_interest_daily_rate_bps, "renewed_from_agreement_id?"]
    output: CommissionAgreement
    side_effects: []
  - method: GET
    path: "/customs/agreements/{id}"
    description: "Read agreement"
    roles: [BrokerOps, DeclarationOfficer, FilingOfficer, SettlementOfficer, ClientUser, SystemAdmin]
    code: 200
    input: []
    output: CommissionAgreement
    side_effects: []
  - method: POST
    path: "/customs/agreements/{id}/request-signature"
    description: "Move DRAFT→AWAITING_SIGNATURE; mints signature_token"
    roles: [BrokerOps]
    code: 200
    input: [version]
    output: CommissionAgreement
    side_effects: ["State transition", "AuditLog"]
  - method: POST
    path: "/customs/agreements/{id}/sign"
    description: "Move AWAITING_SIGNATURE→ACTIVE; client e-signs"
    roles: [ClientUser]
    code: 200
    input: [signature_token, version]
    output: CommissionAgreement
    side_effects: ["State transition", "pinned_fee_schedule_version snapshot", "predecessor.status=RENEWED if renewal"]
  - method: POST
    path: "/customs/agreements/{id}/terminate"
    description: "Terminate agreement"
    roles: [BrokerOps]
    code: 200
    input: [terminated_reason, version]
    output: CommissionAgreement
    side_effects: ["State transition", "AuditLog"]

  # ---- Declarations ----
  - method: POST
    path: "/customs/declarations"
    description: "Create declaration (DRAFT)"
    roles: [DeclarationOfficer, BrokerOps]
    code: 201
    input: [agreement_id, jurisdiction_code, shipment_reference, hs_code, country_of_origin, "trade_agreement_code?", declared_value_amount, declared_currency]
    output: Declaration
    side_effects: ["compute_declared_value_review (writes declared_value_review_status)"]
  - method: GET
    path: "/customs/declarations/{id}"
    description: "Read declaration with computed live fields"
    roles: [DeclarationOfficer, DocReviewer, FilingOfficer, SettlementOfficer, BrokerOps, ClientUser, SystemAdmin]
    code: 200
    input: []
    output: Declaration
    side_effects: []
  - method: GET
    path: "/customs/declarations"
    description: "List declarations (filter by status, agreement_id)"
    roles: [DeclarationOfficer, DocReviewer, FilingOfficer, SettlementOfficer, BrokerOps, SystemAdmin]
    code: 200
    input: ["status?", "agreement_id?", "limit?", "offset?"]
    output: "Declaration[]"
    side_effects: []
  - method: PATCH
    path: "/customs/declarations/{id}"
    description: "Update mutable fields (declared_value_amount, hs_code, country_of_origin, trade_agreement_code) — only in {DRAFT, DOCS_PENDING, AMENDING}"
    roles: [DeclarationOfficer]
    code: 200
    input: ["declared_value_amount?", "hs_code?", "country_of_origin?", "trade_agreement_code?", version]
    output: Declaration
    side_effects: ["compute_declared_value_review if declared_value_amount changes"]
  - method: POST
    path: "/customs/declarations/{id}/request-documents"
    description: "DRAFT→DOCS_PENDING; mark core docs as follow_up_requested"
    roles: [DeclarationOfficer]
    code: 200
    input: [version]
    output: Declaration
    side_effects: ["State transition", "create stub ShipmentDocuments with follow_up_requested_at"]
  - method: POST
    path: "/customs/declarations/{id}/documents"
    description: "Attach a ShipmentDocument to a declaration"
    roles: [DeclarationOfficer, ClientUser]
    code: 201
    input: [doc_type, storage_uri, "declared_total_value?", "declared_total_currency?"]
    output: ShipmentDocument
    side_effects: ["compute_authenticity_score (provisional variant)"]
  - method: POST
    path: "/customs/documents/{id}/screen"
    description: "Re-run authenticity screening (final variant)"
    roles: [DocReviewer]
    code: 200
    input: [version]
    output: ShipmentDocument
    side_effects: ["compute_authenticity_score (final variant)"]
  - method: POST
    path: "/customs/declarations/{id}/pre-validate"
    description: "DOCS_PENDING→PRE_VALIDATED (or AMENDING→PRE_VALIDATED)"
    roles: [DocReviewer]
    code: 200
    input: [version]
    output: Declaration
    side_effects: ["State transition", "compute_declared_value_review", "snapshot fx_rate_to_settlement", "generate form_payload", "pinned_agreement_version snapshot"]
  - method: POST
    path: "/customs/declarations/{id}/file"
    description: "PRE_VALIDATED→FILED; submits to single window"
    roles: [FilingOfficer]
    code: 200
    input: [version]
    output: Declaration
    side_effects: ["State transition", "Create Filing"]
  - method: POST
    path: "/customs/declarations/{id}/respond-query"
    description: "QUERIED→FILED (back to AWAITING for re-evaluation)"
    roles: [FilingOfficer]
    code: 200
    input: [response_note, version]
    output: Declaration
    side_effects: ["State transition", "Set Filing.query_response_at"]
  - method: POST
    path: "/customs/declarations/{id}/amend"
    description: "REJECTED→AMENDING (non-inspection rejections only)"
    roles: [DeclarationOfficer]
    code: 200
    input: [version]
    output: Declaration
    side_effects: ["State transition", "Increment amendment_count", "Clear pinned_agreement_version"]
  - method: POST
    path: "/customs/declarations/{id}/withdraw"
    description: "DRAFT→WITHDRAWN or REJECTED→WITHDRAWN"
    roles: [BrokerOps]
    code: 200
    input: [version]
    output: Declaration
    side_effects: ["State transition", "Void PROVISIONAL settlement (if any)", "Emit logistics RETURN_SHIPMENT event"]

  # ---- Inspection ----
  - method: POST
    path: "/customs/inspection-cases"
    description: "Create inspection case (only when Filing.response_type=INSPECT)"
    roles: [InspectionOfficer, BrokerOps]
    code: 201
    input: [filing_id, warehouse_code, scheduled_at, "sample_required?"]
    output: InspectionCase
    side_effects: []
  - method: POST
    path: "/customs/inspection-cases/{id}/provide-sample"
    description: "Client confirms sample provision"
    roles: [ClientUser, BrokerOps]
    code: 200
    input: [version]
    output: InspectionCase
    side_effects: ["Set sample_provided_at"]
  - method: POST
    path: "/customs/inspection-cases/{id}/record-outcome"
    description: "Record inspection outcome (PENDING→RELEASE|DETENTION|PENALTY)"
    roles: [InspectionOfficer]
    code: 200
    input: [outcome, "penalty_amount?", post_inspection_doc_uri, version]
    output: InspectionCase
    side_effects: ["State transition", "Cascade to Declaration RELEASED or REJECTED + Settlement creation"]
  - method: GET
    path: "/customs/inspection-cases/{id}"
    description: "Read inspection case"
    roles: [InspectionOfficer, BrokerOps, DeclarationOfficer, ClientUser, SystemAdmin]
    code: 200
    input: []
    output: InspectionCase
    side_effects: []

  # ---- Settlement ----
  - method: GET
    path: "/customs/settlements/{id}"
    description: "Read settlement with live late_interest_amount"
    roles: [SettlementOfficer, BrokerOps, ClientUser, SystemAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: ["compute_late_interest variant=ongoing_estimate"]
  - method: GET
    path: "/customs/settlements"
    description: "List settlements (filter by status, declaration_id)"
    roles: [SettlementOfficer, BrokerOps, SystemAdmin]
    code: 200
    input: ["status?", "declaration_id?", "limit?", "offset?"]
    output: "Settlement[]"
    side_effects: []
  - method: POST
    path: "/customs/settlements/{id}/advance"
    description: "FINAL→ADVANCED; broker funds the tariff+VAT+CT+penalty"
    roles: [SettlementOfficer]
    code: 200
    input: [version]
    output: Settlement
    side_effects: ["State transition", "Set advance_paid_amount, advance_paid_at, reimbursement_due_at"]

  # ---- Audit + Rejection ----
  - method: GET
    path: "/customs/audit-log"
    description: "List audit-log events (filter by entity_type, entity_id)"
    roles: [SystemAdmin, BrokerOps]
    code: 200
    input: ["entity_type?", "entity_id?", "event_type?", "limit?", "offset?"]
    output: "AuditLog[]"
    side_effects: []
  - method: GET
    path: "/customs/rejection-records"
    description: "List rejection records (filter by reason_code, declaration_id)"
    roles: [SystemAdmin, BrokerOps, DeclarationOfficer]
    code: 200
    input: ["rejection_reason_code?", "declaration_id?", "limit?", "offset?"]
    output: "RejectionRecord[]"
    side_effects: []

  # ---- External events (drives system transitions) ----
  - method: POST
    path: "/customs/_events/emit"
    description: "Emit an external event (single window response, manifest drop, bank debit, etc.). Driver for system transitions."
    roles: [SystemAdmin]
    code: 202
    input: [source_system, event_type, target_entity_type, target_entity_id, payload]
    output: ExternalEvent
    side_effects: ["Triggers state transitions on the target entity per §1.2"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/customs/_clock/advance"
    description: "Advance internal clock for time-gated transitions (auto-expire agreement, query deadline, late interest)"
    roles: [SystemAdmin]
    code: 200
    input: [to_timestamp]
    output: "{ now: datetime, transitions_triggered: integer }"
    side_effects: ["Triggers system transitions for any entity whose preconditions newly hold"]

# ─────────────────────────────────────────────────────────────────────────────
# §1.6 Error Code Catalog
# ─────────────────────────────────────────────────────────────────────────────
errors:
  # Auth / Authz
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role is not permitted for this endpoint"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Same X-User-ID attempted two steps that must be performed by different individuals"

  # Existence
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist"

  # Concurrency
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Provided version does not match current entity version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state where the operation is defined"
  - id: ERR_FILING_ALREADY_EXISTS
    http: 409
    condition: "Declaration already has a Filing in non-terminal Filing state"
  - id: ERR_SETTLEMENT_ALREADY_ADVANCED
    http: 409
    condition: "Settlement is already in ADVANCED or REIMBURSED state"
  - id: ERR_SETTLEMENT_HAS_ADVANCE
    http: 409
    condition: "Cannot withdraw a declaration whose Settlement has been ADVANCED or REIMBURSED"

  # Business — declaration / documents
  - id: ERR_DOC_INCOMPLETE
    http: 409
    condition: "One or more of the four core docs is missing at pre-validate time"
  - id: ERR_DOC_INCONSISTENT
    http: 409
    condition: "Invoice and packing-list declared totals differ by more than 0.5%"
  - id: ERR_DOC_AUTHENTICITY_FLAGGED
    http: 409
    condition: "A ShipmentDocument has authenticity_status=FLAGGED at pre-validate time"
  - id: ERR_DOC_MISSING_LICENSE
    http: 409
    condition: "Restricted-HS declaration without IMPORT_LICENSE doc"
  - id: ERR_DOC_MISSING_DG
    http: 409
    condition: "Dangerous-goods HS prefix declaration without DANGEROUS_GOODS_DECL doc"
  - id: ERR_DECLARED_VALUE_FLAGGED
    http: 409
    condition: "Declared-value review status is FLAGGED at file time"
  - id: ERR_MANIFEST_MISMATCH
    http: 409
    condition: "Customs RELEASE response received but manifest_match_status != MATCHED"
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "Cannot create declaration: agreement not ACTIVE or now() outside [valid_from, valid_until)"
  - id: ERR_AGREEMENT_VERSION_DRIFT
    http: 409
    condition: "Agreement has been mutated between pre-validate and file; declaration must be re-pre-validated"
  - id: ERR_AGREEMENT_HAS_OPEN_DECLARATIONS
    http: 409
    condition: "Agreement auto-expire blocked because non-terminal declarations exist"
  - id: ERR_AMENDMENT_CAP_REACHED
    http: 409
    condition: "Declaration.amendment_count >= 3"
  - id: ERR_INSPECTION_REJECTION_NOT_AMENDABLE
    http: 409
    condition: "Cannot amend a declaration rejected due to INSPECTION_FAILED — use withdraw instead"
  - id: ERR_QUERY_DEADLINE_PASSED
    http: 409
    condition: "Respond-query attempted after Filing.query_due_at"
  - id: ERR_SERVICE_OUT_OF_SCOPE
    http: 409
    condition: "Operation requires a service not in agreement.scope_of_service"
  - id: ERR_FEE_SCHEDULE_INVALID
    http: 422
    condition: "fee_schedule keys do not exactly match scope_of_service"

  # Business — settlement
  - id: ERR_SETTLEMENT_ZERO_AMOUNT
    http: 409
    condition: "Cannot advance a settlement whose total tariff+vat+ct+penalty is zero"
  - id: ERR_BANK_AMOUNT_MISMATCH
    http: 422
    condition: "Bank debit event amount does not equal advance_paid_amount + current late_interest_amount"

  # Input
  - id: ERR_INVALID_INPUT
    http: 422
    condition: "Field types, enum values, or ranges violate entity constraints"

# ─────────────────────────────────────────────────────────────────────────────
# §1.7 RBAC Matrix
# ─────────────────────────────────────────────────────────────────────────────
roles:
  - name: BrokerOps
    description: "Senior broker operator — manages clients, agreements, and oversees end-to-end declaration lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /customs/clients"
      - "POST /customs/agreements"
      - "POST /customs/agreements/{id}/request-signature"
      - "POST /customs/agreements/{id}/terminate"
      - "POST /customs/declarations/{id}/withdraw"
    shared_operations:
      - "POST /customs/declarations (with DeclarationOfficer)"
      - "GET /customs/declarations, /customs/audit-log, /customs/rejection-records"
      - "POST /customs/inspection-cases"

  - name: DeclarationOfficer
    description: "Prepares declaration content, attaches documents, drives DRAFT→DOCS_PENDING→AMENDING"
    identity: opaque
    exclusive_operations:
      - "POST /customs/declarations/{id}/request-documents"
      - "PATCH /customs/declarations/{id}"
      - "POST /customs/declarations/{id}/amend"
    shared_operations:
      - "POST /customs/declarations"
      - "POST /customs/declarations/{id}/documents (with ClientUser)"

  - name: DocReviewer
    description: "Reviews documents and pre-validates the declaration; must differ from FilingOfficer for segregation of duties"
    identity: opaque
    exclusive_operations:
      - "POST /customs/documents/{id}/screen"
      - "POST /customs/declarations/{id}/pre-validate"
    shared_operations:
      - "GET /customs/declarations"

  - name: FilingOfficer
    description: "Files PRE_VALIDATED declarations and handles query responses"
    identity: opaque
    exclusive_operations:
      - "POST /customs/declarations/{id}/file"
      - "POST /customs/declarations/{id}/respond-query"
    shared_operations:
      - "GET /customs/declarations"

  - name: InspectionOfficer
    description: "Coordinates with customs/warehouse, records inspection outcomes"
    identity: opaque
    exclusive_operations:
      - "POST /customs/inspection-cases/{id}/record-outcome"
    shared_operations:
      - "POST /customs/inspection-cases"
      - "GET /customs/inspection-cases/{id}"

  - name: SettlementOfficer
    description: "Funds broker advance and reconciles client reimbursement"
    identity: opaque
    exclusive_operations:
      - "POST /customs/settlements/{id}/advance"
    shared_operations:
      - "GET /customs/settlements, /customs/settlements/{id}"

  - name: ClientUser
    description: "External client (consignor) acting on their own ClientCompany; signs agreements, uploads documents, confirms samples"
    identity: "entity_backed:ClientCompany"
    exclusive_operations:
      - "POST /customs/agreements/{id}/sign"
    shared_operations:
      - "POST /customs/declarations/{id}/documents (read-only on others)"
      - "POST /customs/inspection-cases/{id}/provide-sample"
      - "GET /customs/clients/{id} (only their own)"
      - "GET /customs/declarations (only their own agreements')"
      - "GET /customs/settlements/{id} (only their own)"

  - name: SystemAdmin
    description: "Operates clock and external-event endpoints; full read access"
    identity: opaque
    exclusive_operations:
      - "POST /customs/_clock/advance"
      - "POST /customs/_events/emit"
    shared_operations:
      - "GET /customs/audit-log"
      - "GET on every resource"
