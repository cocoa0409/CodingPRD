# =============================================================================
# PRD Benchmark Scaffold — Hay Production, Testing & Brokerage (hay broker)
# =============================================================================

scenario: |
  Hay Production, Testing & Brokerage (hay broker): cutting schedule & weather window,
  bale inventory by cutting/quality lot, forage testing (RFV/protein) & pricing tier,
  storage/shrink & spoilage, freight-inclusive quoting by load, buyer contract &
  partial-load allocation, drought-market price volatility, custom baling service billing

domain_name: hay-brokerage
api_prefix: /api

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat            # peer collections under /api joined by FK references
  state_machine_shape: cyclic      # dominant: weather-slip, retest, quote-revise, dispute loops; DeliveryLoad adds parallel dims
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override  # PlatformAdmin superset; peer roles own slices
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (flat topology; FK joins via query filters)
# =============================================================================
entities:
  - name: Grower
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Grower display name" }
      - { name: region_code, type: string, source: input, description: "Region code used for weather-window evaluation and market index lookup (e.g. OR-WILLAMETTE)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }
      - { name: settled_tons_ytd, type: number, source: computed, description: "Read-only: cumulative settled tonnage for the current calendar year of the logical clock; drives commission tier; starts 0.0" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Read-only: unpaid custom-baling invoice total; starts 0" }

  - name: Field
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id; owning grower" }
      - { name: name, type: string, source: input, description: "Field name" }
      - { name: acres, type: number, source: input, description: "Field acreage; must be > 0" }
      - { name: forage_type, type: enum, source: input, description: "ALFALFA | GRASS | MIXED" }
      - { name: irrigated, type: boolean, source: input, description: "Whether the field is irrigated", default: false }

  - name: Cutting
    parent: null
    common_fields: true
    fields:
      - { name: field_id, type: string, source: input, description: "FK -> Field.id; field being cut" }
      - { name: cutting_number, type: integer, source: input, description: "Ordinal cutting of the season for this field (1, 2, 3...); unique per field per season_year" }
      - { name: season_year, type: integer, source: input, description: "Season year the cutting belongs to (e.g. 2026)" }
      - { name: planned_window_start, type: datetime, source: input, description: "Planned window start date (YYYY-MM-DD), inclusive" }
      - { name: planned_window_end, type: datetime, source: input, description: "Planned window end date (YYYY-MM-DD), inclusive; must be >= planned_window_start" }
      - { name: actual_cut_date, type: datetime, source: system, description: "Set by mark-cut; null until CUT" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | WINDOW_OPEN | CUT | HARVESTED | ABANDONED", default: SCHEDULED }

  - name: WeatherReport
    parent: null
    common_fields: false
    fields:
      - { name: region_code, type: string, source: input, description: "Region the report applies to" }
      - { name: report_date, type: datetime, source: input, description: "Calendar date (YYYY-MM-DD) the report describes; unique per region_code" }
      - { name: precipitation_mm, type: number, source: input, description: "Precipitation in mm; day is WET iff precipitation_mm > 2.0" }
      - { name: drying_index, type: integer, source: input, description: "0-100 drying conditions index; day is DRYING-CAPABLE iff drying_index >= 60" }

  - name: StorageSite
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site name" }
      - { name: region_code, type: string, source: input, description: "Region the site is located in" }
      - { name: capacity_tons, type: number, source: input, description: "Maximum physical tonnage the site can hold; must be > 0" }
      - { name: moisture_controlled, type: boolean, source: input, description: "Climate-controlled storage halves the shrink rate", default: false }

  - name: BaleLot
    parent: null
    common_fields: true
    fields:
      - { name: cutting_id, type: string, source: input, description: "FK -> Cutting.id; cutting this lot was baled from" }
      - { name: storage_site_id, type: string, source: input, description: "FK -> StorageSite.id; current storage site" }
      - { name: bale_type, type: enum, source: input, description: "SMALL_SQUARE | LARGE_SQUARE | ROUND" }
      - { name: bale_count, type: integer, source: input, description: "Number of bales; must be > 0" }
      - { name: harvested_tonnage, type: number, source: input, description: "As-baled tonnage; must be > 0" }
      - { name: harvested_date, type: datetime, source: input, description: "Date (YYYY-MM-DD) the lot was baled; shrink accrues from this date" }
      - { name: quality_tier, type: enum, source: computed, description: "UNGRADED | SUPREME | PREMIUM | GOOD | FAIR; starts UNGRADED; set by latest CERTIFIED ForageTest" }
      - { name: certified_protein_pct, type: number, source: computed, description: "Protein pct from the latest CERTIFIED ForageTest; null while UNGRADED" }
      - { name: shipped_tonnage, type: number, source: computed, description: "Read-only: tons delivered out of this lot; starts 0.0" }
      - { name: spoilage_tonnage, type: number, source: computed, description: "Read-only: cumulative tons lost to SpoilageEvents; starts 0.0" }
      - { name: open_allocated_tonnage, type: number, source: computed, description: "Read-only: tons currently reserved by OPEN LoadAllocations; starts 0.0" }
      - { name: allocatable_tonnage, type: number, source: computed, description: "Read-only: simple-shrink accounting tonnage available for new allocations (see shrink_tonnage calculation, ACCOUNTING variant)" }
      - { name: physical_tonnage, type: number, source: computed, description: "Read-only: compound-shrink physical tonnage occupying the site (see shrink_tonnage calculation, PHYSICAL variant)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEPLETED | CONDEMNED", default: ACTIVE }

  - name: SpoilageEvent
    parent: null
    common_fields: false
    fields:
      - { name: bale_lot_id, type: string, source: input, description: "FK -> BaleLot.id; lot losing tonnage" }
      - { name: event_date, type: datetime, source: input, description: "Date (YYYY-MM-DD) the loss occurred" }
      - { name: tons_lost, type: number, source: input, description: "Tons lost to spoilage; must be > 0" }
      - { name: reason, type: enum, source: input, description: "MOLD | MOISTURE | PEST | FIRE | OTHER" }

  - name: ForageTest
    parent: null
    common_fields: true
    fields:
      - { name: bale_lot_id, type: string, source: input, description: "FK -> BaleLot.id; lot sampled" }
      - { name: sample_date, type: datetime, source: input, description: "Date (YYYY-MM-DD) the sample was collected" }
      - { name: lab_reference, type: string, source: input, description: "Lab submission reference, supplied at submit" }
      - { name: rfv, type: number, source: system, description: "Relative Feed Value recorded at record-result; null until RESULTED" }
      - { name: protein_pct, type: number, source: system, description: "Crude protein pct recorded at record-result; null until RESULTED" }
      - { name: moisture_pct, type: number, source: system, description: "Moisture pct recorded at record-result; null until RESULTED" }
      - { name: resulted_by_user_id, type: string, source: system, description: "X-User-ID of the LabTechnician who recorded the current result (segregation-of-duties anchor)" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the certifying LabTechnician; null until CERTIFIED" }
      - { name: status, type: enum, source: system, description: "COLLECTED | SUBMITTED | RESULTED | CERTIFIED | INVALIDATED", default: COLLECTED }

  - name: MarketIndex
    parent: null
    common_fields: false
    fields:
      - { name: region_code, type: string, source: input, description: "Region the index prices" }
      - { name: forage_type, type: enum, source: input, description: "ALFALFA | GRASS | MIXED" }
      - { name: effective_date, type: datetime, source: input, description: "Date (YYYY-MM-DD) the index takes effect; unique per (region_code, forage_type)" }
      - { name: price_per_ton_cents, type: integer, source: input, description: "Index price per ton in cents; must be > 0" }
      - { name: drought_regime, type: enum, source: computed, description: "STABLE | VOLATILE | DROUGHT; derived at creation by market_regime_classification" }

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Buyer display name" }
      - { name: region_code, type: string, source: input, description: "Buyer home region" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding contract reserve in cents; must be > 0" }
      - { name: credit_used_cents, type: integer, source: computed, description: "Read-only: cents currently reserved by non-terminal Contracts; starts 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }

  - name: FreightLane
    parent: null
    common_fields: true
    fields:
      - { name: origin_region_code, type: string, source: input, description: "Origin region; unique pair with dest_region_code" }
      - { name: dest_region_code, type: string, source: input, description: "Destination region; unique pair with origin_region_code" }
      - { name: distance_miles, type: integer, source: input, description: "Lane distance; must be > 0" }
      - { name: rate_per_mile_cents, type: integer, source: input, description: "Flat rate per mile; must be > 0" }
      - { name: min_charge_cents, type: integer, source: input, description: "Minimum freight charge before fuel surcharge; must be >= 0" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; requesting buyer" }
      - { name: forage_type, type: enum, source: input, description: "ALFALFA | GRASS | MIXED" }
      - { name: quality_tier, type: enum, source: input, description: "Enum membership SUPREME | PREMIUM | GOOD | FAIR | UNGRADED; UNGRADED passes schema but is rejected by the priority-10 business rule ERR_UNGRADED_TIER" }
      - { name: tons, type: number, source: input, description: "Tons quoted; must be > 0" }
      - { name: origin_region_code, type: string, source: input, description: "Region hay ships from; selects market index and freight lane" }
      - { name: dest_region_code, type: string, source: input, description: "Destination region; selects freight lane" }
      - { name: requested_delivery_by, type: datetime, source: input, description: "Date (YYYY-MM-DD) the buyer wants delivery by; becomes Contract.delivery_deadline" }
      - { name: pinned_market_index_id, type: string, source: system, description: "FK -> MarketIndex.id; index pinned at ISSUE time (null while DRAFT); LOCKED variant anchor" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Read-only: per-ton price computed by quote_pricing" }
      - { name: commodity_cents, type: integer, source: computed, description: "Read-only: unit_price_cents x tons" }
      - { name: freight_cents, type: integer, source: computed, description: "Read-only: freight_charge result" }
      - { name: total_cents, type: integer, source: computed, description: "Read-only: commodity_cents + freight_cents" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issue; null while DRAFT" }
      - { name: expires_at, type: datetime, source: system, description: "issued_at + 72h; null while DRAFT" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | ACCEPTED | DECLINED | EXPIRED", default: DRAFT }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: system, description: "FK -> Quote.id; accepted quote this contract was created from" }
      - { name: buyer_id, type: string, source: system, description: "FK -> Buyer.id; copied from the quote" }
      - { name: quality_tier, type: enum, source: system, description: "SUPREME | PREMIUM | GOOD | FAIR; copied from the quote" }
      - { name: forage_type, type: enum, source: system, description: "ALFALFA | GRASS | MIXED; copied from the quote" }
      - { name: committed_tons, type: number, source: system, description: "Tons committed; copied from quote.tons" }
      - { name: unit_price_cents, type: integer, source: system, description: "LOCKED unit price copied from the accepted quote; never re-priced" }
      - { name: total_reserved_cents, type: integer, source: system, description: "Credit reserve held on the buyer; equals quote.total_cents at accept" }
      - { name: delivery_deadline, type: datetime, source: system, description: "Copied from quote.requested_delivery_by" }
      - { name: delivered_tons, type: number, source: computed, description: "Read-only: tons delivered against this contract; starts 0.0" }
      - { name: open_allocated_tons, type: number, source: computed, description: "Read-only: tons in OPEN LoadAllocations for this contract; starts 0.0" }
      - { name: remaining_tons, type: number, source: computed, description: "Read-only: committed_tons - delivered_tons - open_allocated_tons" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | FULFILLED | DEFAULTED | CANCELLED", default: ACTIVE }

  - name: DeliveryLoad
    parent: null
    common_fields: true
    fields:
      - { name: carrier_name, type: string, source: input, description: "Carrier label for the load" }
      - { name: capacity_tons, type: number, source: input, description: "Truck capacity in tons; must be > 0" }
      - { name: planned_ship_date, type: datetime, source: input, description: "Planned ship date (YYYY-MM-DD)" }
      - { name: loaded_tons, type: number, source: computed, description: "Read-only: sum of tons over OPEN LoadAllocations; starts 0.0" }
      - { name: logistics_status, type: enum, source: system, description: "PLANNED | LOADING | IN_TRANSIT | DELIVERED", default: PLANNED }
      - { name: settlement_status, type: enum, source: system, description: "OPEN | SETTLED", default: OPEN }

  - name: LoadAllocation
    parent: null
    common_fields: true
    fields:
      - { name: delivery_load_id, type: string, source: input, description: "FK -> DeliveryLoad.id; load carrying the tonnage" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; contract being supplied" }
      - { name: bale_lot_id, type: string, source: input, description: "FK -> BaleLot.id; source lot" }
      - { name: tons, type: number, source: input, description: "Tons allocated; must be > 0" }
      - { name: settled_gross_cents, type: integer, source: computed, description: "Gross grower proceeds for this allocation at SETTLED; null until settled" }
      - { name: settled_commission_cents, type: integer, source: computed, description: "Broker commission charged on this allocation; null until settled" }
      - { name: settled_net_cents, type: integer, source: computed, description: "Net grower proceeds (gross - commission); null until settled" }
      - { name: status, type: enum, source: system, description: "OPEN | DELIVERED | RELEASED | SETTLED", default: OPEN }

  - name: BalingServiceOrder
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id; grower hiring the broker to bale" }
      - { name: cutting_id, type: string, source: input, description: "FK -> Cutting.id; cutting to be baled" }
      - { name: scheduled_date, type: datetime, source: system, description: "Scheduled service date (YYYY-MM-DD); set at schedule" }
      - { name: equipment_unit, type: string, source: system, description: "Equipment unit identifier; set at schedule; drives buffer-day conflict rule" }
      - { name: actual_bale_count, type: integer, source: system, description: "Actual bales produced; set at complete" }
      - { name: baled_moisture_pct, type: number, source: system, description: "Bale moisture at completion; > 18.0 adds wet surcharge; > 20.0 is unsafe and rejected" }
      - { name: invoice_cents, type: integer, source: computed, description: "Read-only: baling_service_billing result at INVOICED; null until then" }
      - { name: status, type: enum, source: system, description: "REQUESTED | SCHEDULED | IN_PROGRESS | COMPLETED | DISPUTED | INVOICED | CANCELLED", default: REQUESTED }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Grower
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /api/growers/{id}/suspend
        actor: PlatformAdmin
        preconditions:
          - "Grower must be ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Conditional cascade: every BalingServiceOrder with grower_id == this grower and status IN {REQUESTED, SCHEDULED} -> CANCELLED"

  - entity: Buyer
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /api/buyers/{id}/suspend
        actor: PlatformAdmin
        preconditions:
          - "Buyer must be ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Conditional cascade: every Contract with buyer_id == this buyer and status == ACTIVE -> SUSPENDED (no credit release; reserve stays held)"

  - entity: Cutting
    initial_state: SCHEDULED
    terminal_states: [HARVESTED, ABANDONED]
    transitions:
      - from: SCHEDULED
        to: WINDOW_OPEN
        trigger: "system — POST /api/weather-reports re-evaluates every Cutting whose field's grower region_code == report.region_code AND (report_date within [planned_window_start, planned_window_end] OR status == WINDOW_OPEN)"
        actor: system
        preconditions:
          - "Trailing 3 calendar days ending on report_date each have a WeatherReport that is DRY (precipitation_mm <= 2.0) AND DRYING-CAPABLE (drying_index >= 60); a day with no report counts as NOT dry"
        side_effects:
          - "status -> WINDOW_OPEN; Cutting.version increments"
      - from: WINDOW_OPEN
        to: SCHEDULED
        trigger: "system — same weather-report re-evaluation"
        actor: system
        preconditions:
          - "Any of the trailing 3 calendar days ending on report_date is WET (precipitation_mm > 2.0), not DRYING-CAPABLE (drying_index < 60), or has no report"
        side_effects:
          - "status -> SCHEDULED (weather-slip revert); Cutting.version increments"
      - from: WINDOW_OPEN
        to: CUT
        trigger: POST /api/cuttings/{id}/mark-cut
        actor: Grower | PlatformAdmin
        preconditions:
          - "Cutting must be WINDOW_OPEN (ERR_CUTTING_NOT_OPEN)"
          - "actual_cut_date within [planned_window_start, planned_window_end] inclusive (ERR_CUTTING_WINDOW_RANGE)"
          - "Trailing 3 calendar days ending on actual_cut_date each have a DRY and DRYING-CAPABLE WeatherReport (ERR_CUTTING_NOT_OPEN)"
          - "Acting Grower must own the cutting's field (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "actual_cut_date set"
      - from: CUT
        to: HARVESTED
        trigger: "system — automatic when the first BaleLot is created for this cutting"
        actor: system
        preconditions:
          - "A BaleLot creation succeeds against this cutting while status == CUT"
        side_effects:
          - "status -> HARVESTED; further BaleLot creation remains allowed in HARVESTED"
      - from: SCHEDULED
        to: ABANDONED
        trigger: POST /api/cuttings/{id}/abandon
        actor: Grower | PlatformAdmin
        preconditions:
          - "Acting Grower must own the cutting's field (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "Conditional cascade: BalingServiceOrders with cutting_id == this cutting and status IN {REQUESTED, SCHEDULED} -> CANCELLED"
      - from: WINDOW_OPEN
        to: ABANDONED
        trigger: POST /api/cuttings/{id}/abandon
        actor: Grower | PlatformAdmin
        preconditions:
          - "Acting Grower must own the cutting's field (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "Conditional cascade: BalingServiceOrders with cutting_id == this cutting and status IN {REQUESTED, SCHEDULED} -> CANCELLED"

  - entity: BaleLot
    initial_state: ACTIVE
    terminal_states: [DEPLETED, CONDEMNED]
    transitions:
      - from: ACTIVE
        to: CONDEMNED
        trigger: POST /api/bale-lots/{id}/condemn
        actor: BrokerOps
        preconditions:
          - "Lot must be ACTIVE (ERR_LOT_NOT_ACTIVE)"
        side_effects:
          - "Cascade hop 1: every LoadAllocation with bale_lot_id == this lot and status == OPEN -> RELEASED (tons stop being reserved)"
          - "Cascade hop 2 (from hop 1): for each affected DeliveryLoad, loaded_tons recomputed; if the load was LOADING, it reverts LOADING -> PLANNED"
      - from: ACTIVE
        to: DEPLETED
        trigger: "system — automatic on DeliveryLoad deliver when allocatable_tonnage reaches exactly 0.0 and shipped_tonnage > 0"
        actor: system
        preconditions:
          - "allocatable_tonnage == 0.0 after the deliver side effects are applied"
        side_effects: []

  - entity: ForageTest
    initial_state: COLLECTED
    terminal_states: [CERTIFIED, INVALIDATED]
    transitions:
      - from: COLLECTED
        to: SUBMITTED
        trigger: POST /api/forage-tests/{id}/submit
        actor: LabTechnician
        preconditions:
          - "Test must be COLLECTED or RESULTED (ERR_TEST_WRONG_STATE)"
          - "BaleLot referenced by bale_lot_id must not be CONDEMNED (ERR_LOT_NOT_ACTIVE)"
        side_effects: []
      - from: SUBMITTED
        to: RESULTED
        trigger: POST /api/forage-tests/{id}/record-result
        actor: LabTechnician
        preconditions:
          - "Test must be SUBMITTED (ERR_TEST_WRONG_STATE)"
        side_effects:
          - "rfv, protein_pct, moisture_pct stored; resulted_by_user_id := acting X-User-ID"
      - from: RESULTED
        to: SUBMITTED
        trigger: POST /api/forage-tests/{id}/submit (retest loop — resubmission with a new lab_reference)
        actor: LabTechnician
        preconditions:
          - "Test must be COLLECTED or RESULTED (ERR_TEST_WRONG_STATE)"
        side_effects:
          - "rfv, protein_pct, moisture_pct and resulted_by_user_id cleared to null"
      - from: RESULTED
        to: CERTIFIED
        trigger: POST /api/forage-tests/{id}/certify
        actor: LabTechnician
        preconditions:
          - "Test must be RESULTED (ERR_TEST_WRONG_STATE)"
          - "Segregation of duties: acting X-User-ID != resulted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "BaleLot referenced by bale_lot_id must be ACTIVE (ERR_LOT_NOT_ACTIVE)"
        side_effects:
          - "certified_by_user_id := acting X-User-ID"
          - "BaleLot.quality_tier := quality_tier_assignment(rfv, protein_pct, moisture_pct); BaleLot.certified_protein_pct := protein_pct (last certify wins, ordered by the test's updated_at, never by id)"
      - from: COLLECTED
        to: INVALIDATED
        trigger: POST /api/forage-tests/{id}/invalidate
        actor: LabTechnician | BrokerOps
        preconditions:
          - "Test must be COLLECTED or SUBMITTED (ERR_TEST_WRONG_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: INVALIDATED
        trigger: POST /api/forage-tests/{id}/invalidate
        actor: LabTechnician | BrokerOps
        preconditions:
          - "Test must be COLLECTED or SUBMITTED (ERR_TEST_WRONG_STATE)"
        side_effects: []

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: POST /api/quotes/{id}/issue
        actor: Buyer
        preconditions:
          - "Quote must be DRAFT (ERR_QUOTE_NOT_ISSUABLE)"
          - "Acting Buyer must be the quote owner (ERR_FORBIDDEN_OWNERSHIP) and Buyer.status == ACTIVE (ERR_BUYER_SUSPENDED)"
        side_effects:
          - "quote_pricing runs with the LOCKED variant: pinned_market_index_id := latest MarketIndex (origin_region_code, forage_type) with effective_date <= current clock date; unit_price_cents / commodity_cents / freight_cents / total_cents recomputed and frozen"
          - "issued_at := current clock; expires_at := issued_at + 72h"
      - from: ISSUED
        to: DRAFT
        trigger: POST /api/quotes/{id}/revise
        actor: Buyer
        preconditions:
          - "Quote must be ISSUED (ERR_QUOTE_NOT_ISSUABLE)"
          - "OCC: expected_quote_version must equal current Quote.version (ERR_STALE_VERSION)"
          - "Acting Buyer must be the quote owner (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "pinned_market_index_id, issued_at, expires_at cleared to null; pricing fields recomputed SPOT on next read"
      - from: ISSUED
        to: ACCEPTED
        trigger: POST /api/quotes/{id}/accept
        actor: Buyer
        preconditions:
          - "OCC: expected_quote_version must equal current Quote.version (ERR_STALE_VERSION)"
          - "Quote must be ISSUED (ERR_QUOTE_NOT_ISSUABLE); if current clock > expires_at the quote auto-transitions to EXPIRED and the accept fails (ERR_QUOTE_EXPIRED)"
          - "Acting Buyer must be the quote owner (ERR_FORBIDDEN_OWNERSHIP) and Buyer.status == ACTIVE (ERR_BUYER_SUSPENDED)"
          - "Buyer.credit_used_cents + total_cents <= credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED); equality is allowed"
        side_effects:
          - "Cascade hop 1: Contract created (status ACTIVE, fields copied from quote)"
          - "Cascade hop 2 (from hop 1): Buyer.credit_used_cents += total_cents"
      - from: ISSUED
        to: DECLINED
        trigger: POST /api/quotes/{id}/decline
        actor: Buyer
        preconditions:
          - "Quote must be ISSUED (ERR_QUOTE_NOT_ISSUABLE)"
          - "Acting Buyer must be the quote owner (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: []
      - from: ISSUED
        to: EXPIRED
        trigger: "system — lazy sweep: evaluated whenever the quote is read or acted on, and in bulk whenever POST /api/_clock/set_current_utc advances the clock past expires_at"
        actor: system
        preconditions:
          - "current clock > expires_at"
        side_effects: []

  - entity: Contract
    initial_state: ACTIVE
    terminal_states: [FULFILLED, DEFAULTED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: FULFILLED
        trigger: "system — automatic on DeliveryLoad deliver when delivered_tons >= committed_tons"
        actor: system
        preconditions:
          - "delivered_tons >= committed_tons after the deliver side effects are applied (exact equality fulfills)"
        side_effects:
          - "Cascade hop: Buyer.credit_used_cents -= total_reserved_cents (full reserve release)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — cascade from POST /api/buyers/{id}/suspend"
        actor: system
        preconditions:
          - "Owning buyer was suspended"
        side_effects: []
      - from: ACTIVE
        to: DEFAULTED
        trigger: POST /api/contracts/{id}/declare-default
        actor: PlatformAdmin
        preconditions:
          - "Contract must be ACTIVE or SUSPENDED (ERR_CONTRACT_NOT_ACTIVE)"
          - "current clock date > delivery_deadline (ERR_DEADLINE_NOT_PASSED)"
          - "delivered_tons < committed_tons (ERR_CONTRACT_NOT_ACTIVE if already fulfilled)"
        side_effects:
          - "Every LoadAllocation with contract_id == this contract and status == OPEN -> RELEASED"
          - "Buyer.credit_used_cents -= total_reserved_cents"
      - from: SUSPENDED
        to: DEFAULTED
        trigger: POST /api/contracts/{id}/declare-default
        actor: PlatformAdmin
        preconditions:
          - "Contract must be ACTIVE or SUSPENDED (ERR_CONTRACT_NOT_ACTIVE)"
          - "current clock date > delivery_deadline (ERR_DEADLINE_NOT_PASSED)"
        side_effects:
          - "Every LoadAllocation with contract_id == this contract and status == OPEN -> RELEASED"
          - "Buyer.credit_used_cents -= total_reserved_cents"
      - from: ACTIVE
        to: CANCELLED
        trigger: POST /api/contracts/{id}/cancel
        actor: PlatformAdmin
        preconditions:
          - "Contract must be ACTIVE or SUSPENDED (ERR_CONTRACT_NOT_ACTIVE)"
        side_effects:
          - "Every LoadAllocation with contract_id == this contract and status == OPEN -> RELEASED"
          - "Buyer.credit_used_cents -= total_reserved_cents"
      - from: SUSPENDED
        to: CANCELLED
        trigger: POST /api/contracts/{id}/cancel
        actor: PlatformAdmin
        preconditions:
          - "Contract must be ACTIVE or SUSPENDED (ERR_CONTRACT_NOT_ACTIVE)"
        side_effects:
          - "Every LoadAllocation with contract_id == this contract and status == OPEN -> RELEASED"
          - "Buyer.credit_used_cents -= total_reserved_cents"

  - entity: DeliveryLoad
    initial_state: PLANNED
    terminal_states: [DELIVERED]
    note: "Parallel state dimensions: logistics_status (PLANNED -> LOADING -> IN_TRANSIT -> DELIVERED) evolves independently of settlement_status (OPEN -> SETTLED), except settle requires logistics_status == DELIVERED."
    transitions:
      - from: PLANNED
        to: LOADING
        trigger: POST /api/delivery-loads/{id}/start-loading
        actor: BrokerOps
        preconditions:
          - "logistics_status == PLANNED (ERR_LOAD_WRONG_STATE)"
          - "At least one LoadAllocation with status == OPEN exists for this load (ERR_LOAD_WRONG_STATE)"
        side_effects: []
      - from: LOADING
        to: PLANNED
        trigger: "system — automatic when the last OPEN LoadAllocation is released (via release, condemn cascade, or contract cancel/default cascade)"
        actor: system
        preconditions:
          - "No OPEN LoadAllocations remain for this load"
        side_effects: []
      - from: LOADING
        to: IN_TRANSIT
        trigger: POST /api/delivery-loads/{id}/depart
        actor: BrokerOps
        preconditions:
          - "logistics_status == LOADING (ERR_LOAD_WRONG_STATE)"
        side_effects: []
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: POST /api/delivery-loads/{id}/deliver
        actor: BrokerOps
        preconditions:
          - "logistics_status == IN_TRANSIT (ERR_LOAD_WRONG_STATE)"
        side_effects:
          - "Cascade hop 1: every OPEN LoadAllocation -> DELIVERED; BaleLot.shipped_tonnage += tons; Contract.delivered_tons += tons; Contract.open_allocated_tons -= tons; derived tonnage fields recomputed"
          - "Cascade hop 2 (from hop 1): Contract whose delivered_tons >= committed_tons -> FULFILLED; BaleLot whose allocatable_tonnage == 0.0 and shipped_tonnage > 0 -> DEPLETED"
          - "Cascade hop 3 (from hop 2): on Contract FULFILLED, Buyer.credit_used_cents -= total_reserved_cents"
      - from: OPEN
        to: SETTLED
        trigger: POST /api/delivery-loads/{id}/settle
        actor: BrokerOps
        preconditions:
          - "settlement_status == OPEN (ERR_LOAD_WRONG_STATE)"
          - "logistics_status == DELIVERED (ERR_LOAD_WRONG_STATE)"
        side_effects:
          - "grower_settlement runs per DELIVERED LoadAllocation in created_at ASC order; allocation settled_* fields written; LoadAllocation.status -> SETTLED; Grower.settled_tons_ytd += tons"
        note: "This transition is on the settlement_status dimension; logistics_status remains DELIVERED."

  - entity: LoadAllocation
    initial_state: OPEN
    terminal_states: [RELEASED, SETTLED]
    transitions:
      - from: OPEN
        to: RELEASED
        trigger: POST /api/load-allocations/{id}/release
        actor: BrokerOps
        preconditions:
          - "Allocation must be OPEN (ERR_INVALID_STATE)"
          - "Owning DeliveryLoad.logistics_status IN {PLANNED, LOADING} (ERR_LOAD_WRONG_STATE)"
        side_effects:
          - "BaleLot.open_allocated_tonnage -= tons; Contract.open_allocated_tons -= tons; DeliveryLoad.loaded_tons -= tons; if the load was LOADING and no OPEN allocations remain, load reverts to PLANNED"
      - from: OPEN
        to: DELIVERED
        trigger: "system — cascade from DeliveryLoad deliver"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: RELEASED
        trigger: "system — cascade from BaleLot condemn or Contract cancel/declare-default"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: SETTLED
        trigger: "system — cascade from DeliveryLoad settle"
        actor: system
        preconditions: []
        side_effects:
          - "settled_gross_cents / settled_commission_cents / settled_net_cents written by grower_settlement"

  - entity: BalingServiceOrder
    initial_state: REQUESTED
    terminal_states: [INVOICED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: POST /api/baling-service-orders/{id}/schedule
        actor: BrokerOps
        preconditions:
          - "Order must be REQUESTED (ERR_BSO_WRONG_STATE)"
          - "Cutting referenced by cutting_id must be WINDOW_OPEN or CUT (ERR_BSO_WRONG_STATE)"
          - "Equipment buffer: no other BalingServiceOrder with the same equipment_unit and status IN {SCHEDULED, IN_PROGRESS} may have |scheduled_date - this.scheduled_date| < 2 days (ERR_EQUIPMENT_BUFFER_CONFLICT)"
        side_effects:
          - "scheduled_date and equipment_unit set"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: POST /api/baling-service-orders/{id}/start
        actor: BrokerOps
        preconditions:
          - "Order must be SCHEDULED (ERR_BSO_WRONG_STATE)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: POST /api/baling-service-orders/{id}/complete
        actor: BrokerOps
        preconditions:
          - "Order must be IN_PROGRESS (ERR_BSO_WRONG_STATE)"
          - "baled_moisture_pct <= 20.0 (ERR_MOISTURE_UNSAFE)"
        side_effects:
          - "actual_bale_count and baled_moisture_pct set"
      - from: COMPLETED
        to: INVOICED
        trigger: POST /api/baling-service-orders/{id}/invoice
        actor: BrokerOps
        preconditions:
          - "Order must be COMPLETED (ERR_BSO_WRONG_STATE)"
        side_effects:
          - "invoice_cents := baling_service_billing(actual_bale_count, baled_moisture_pct); Grower.outstanding_balance_cents += invoice_cents"
      - from: COMPLETED
        to: DISPUTED
        trigger: POST /api/baling-service-orders/{id}/dispute
        actor: Grower
        preconditions:
          - "Order must be COMPLETED (ERR_BSO_WRONG_STATE)"
          - "Acting Grower must own the order (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: []
      - from: DISPUTED
        to: COMPLETED
        trigger: POST /api/baling-service-orders/{id}/resolve
        actor: BrokerOps
        preconditions:
          - "Order must be DISPUTED (ERR_BSO_WRONG_STATE)"
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: POST /api/baling-service-orders/{id}/cancel
        actor: Grower | PlatformAdmin
        preconditions:
          - "Order must be REQUESTED or SCHEDULED (ERR_BSO_WRONG_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /api/baling-service-orders/{id}/cancel
        actor: Grower | PlatformAdmin
        preconditions:
          - "Order must be REQUESTED or SCHEDULED (ERR_BSO_WRONG_STATE)"
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "system — cascade from Grower suspend or Cutting abandon"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system — cascade from Grower suspend or Cutting abandon"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: quote-patch-stale-version
    parent_entity: Quote
    write_endpoint: "PATCH /api/quotes/{id}"
    occ_field: expected_quote_version
    description: |
      Updating a DRAFT quote's tons/destination while carrying an
      expected_quote_version that no longer matches Quote.version is rejected.
      A prior PATCH bumps Quote.version without changing status, so a second
      sequential update carrying the earlier version observes identical state
      (still DRAFT) yet is working from stale pricing inputs.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: quote-accept-stale-version
    parent_entity: Quote
    write_endpoint: "POST /api/quotes/{id}/accept"
    occ_field: expected_quote_version
    description: |
      Accepting an ISSUED quote with an expected_quote_version that no longer
      matches Quote.version is rejected. The quote may have been revised and
      re-issued since the client read it (a revise + issue pair leaves status
      ISSUED but advances the version and may change pinned pricing), so a
      stale accept would contract against pricing the client never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: allocation-create-stale-load
    parent_entity: DeliveryLoad
    write_endpoint: "POST /api/load-allocations"
    occ_field: expected_delivery_load_version
    description: |
      Creating a LoadAllocation against a DeliveryLoad whose version has
      advanced since the client last read it is rejected. Allocation creation
      bumps DeliveryLoad.version without leaving PLANNED/LOADING, so a second
      sequential allocation carrying the earlier version sees identical state
      and would succeed on capacity math computed from a stale loaded_tons.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: lot-transfer-stale-version
    parent_entity: BaleLot
    write_endpoint: "POST /api/bale-lots/{id}/transfer"
    occ_field: expected_bale_lot_version
    description: |
      Transferring a BaleLot to another storage site with an
      expected_bale_lot_version that no longer matches BaleLot.version is
      rejected. Spoilage postings and allocations bump the lot version while
      leaving it ACTIVE, so a stale transfer would run the destination
      capacity check against tonnage the client no longer holds.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: weather_window_evaluation
    description: "Decides whether a Cutting's weather window is open on a given date"
    trigger: "POST /api/weather-reports (system re-evaluation) and POST /api/cuttings/{id}/mark-cut (guard check)"
    algorithm: threshold
    formula: |
      dry(d) = exists WeatherReport(region_code == grower.region_code, report_date == d)
               AND precipitation_mm <= WET_DAY_THRESHOLD_MM      # exactly 2.0 is DRY
               AND drying_index >= DRYING_INDEX_MIN               # exactly 60 is capable
      window_open(date) = dry(date) AND dry(date-1) AND dry(date-2)
      A day missing a WeatherReport counts as NOT dry.
    input_set: "WeatherReports for the grower's region_code over the trailing 3 calendar days ending on the evaluated date, inclusive"
    constants:
      WET_DAY_THRESHOLD_MM: 2.0
      DRYING_INDEX_MIN: 60
      WINDOW_DRY_DAYS_REQUIRED: 3
    precision: "boolean result; precipitation compared as given (1 decimal)"

  - name: quality_tier_assignment
    description: "Derives the sellable quality tier from a forage test result; runs at certify"
    trigger: "POST /api/forage-tests/{id}/certify"
    algorithm: threshold
    formula: |
      if rfv >= 185: base = SUPREME
      elif rfv >= 170: base = PREMIUM      # rfv exactly 170.0 -> PREMIUM
      elif rfv >= 150: base = GOOD
      elif rfv >= 125: base = FAIR
      else: base = UNGRADED                 # rfv < 125 is unsellable
      if moisture_pct > MOISTURE_TIER_CAP_PCT AND base IN {SUPREME, PREMIUM, GOOD}:
          base = FAIR                       # moisture cap: exactly 16.0 does NOT cap
      tier = base
    input_set: "the single RESULTED ForageTest being certified"
    constants:
      MOISTURE_TIER_CAP_PCT: 16.0
    precision: "inputs taken as given (1 decimal)"

  - name: market_regime_classification
    description: "Classifies a newly posted MarketIndex against the most recent prior index in the lookback window (drought-market volatility)"
    trigger: "POST /api/market-indices"
    algorithm: threshold
    formula: |
      prior = latest MarketIndex with same (region_code, forage_type)
              AND effective_date < new.effective_date
              AND effective_date >= new.effective_date - REGIME_LOOKBACK_DAYS days
      if prior is null: drought_regime = STABLE
      else:
        pct = (new.price_per_ton_cents - prior.price_per_ton_cents) / prior.price_per_ton_cents
        if pct >= DROUGHT_REGIME_PCT: drought_regime = DROUGHT      # exactly +15% -> DROUGHT
        elif abs(pct) >= VOLATILE_REGIME_PCT: drought_regime = VOLATILE  # exactly +/-8% -> VOLATILE
        else: drought_regime = STABLE
    input_set: "MarketIndex rows sharing (region_code, forage_type) with effective_date in [new.effective_date - 30 days, new.effective_date)"
    constants:
      DROUGHT_REGIME_PCT: 0.15
      VOLATILE_REGIME_PCT: 0.08
      REGIME_LOOKBACK_DAYS: 30
    precision: "pct compared in exact decimal arithmetic"

  - name: quote_pricing
    description: "Freight-inclusive quote price: per-unit rounding BEFORE tonnage multiplication (pinned order)"
    trigger: "POST /api/quotes (SPOT variant), PATCH /api/quotes/{id} (SPOT reprice), POST /api/quotes/{id}/issue (LOCKED variant — freezes the result)"
    algorithm: tiered_pricing
    formula: |
      idx = SPOT: latest MarketIndex (origin_region_code, forage_type) with effective_date <= current clock date
            LOCKED: the MarketIndex referenced by pinned_market_index_id
            (no matching index -> ERR_NO_MARKET_INDEX)
      lane = FreightLane(origin_region_code, dest_region_code)  (none -> ERR_NO_FREIGHT_LANE)
      unit_price_cents = round_half_up_0(idx.price_per_ton_cents
                           * TIER_MULTIPLIER[quality_tier]
                           * (1 + DROUGHT_SURCHARGE_PCT if idx.drought_regime == DROUGHT else 0))
      commodity_cents = unit_price_cents * tons                 # integer math AFTER unit rounding
      freight_base = max(lane.min_charge_cents, round_half_up_0(lane.distance_miles * lane.rate_per_mile_cents))
      fuel_pct = 0.0 if lane.distance_miles < 100
                 else 0.06 if lane.distance_miles < 300        # 100..299 -> 6%
                 else 0.11                                      # >= 300 -> 11%
      freight_surcharge = round_half_up_0(freight_base * fuel_pct)
      freight_cents = freight_base + freight_surcharge          # sum AFTER both parts rounded
      total_cents = commodity_cents + freight_cents
      All intermediate products use exact decimal arithmetic (no binary float drift);
      round_half_up_0 rounds to whole cents, half away from zero.
    input_set: "the Quote's own fields plus the selected MarketIndex and FreightLane"
    constants:
      TIER_MULTIPLIER_SUPREME: 1.30
      TIER_MULTIPLIER_PREMIUM: 1.15
      TIER_MULTIPLIER_GOOD: 1.00
      TIER_MULTIPLIER_FAIR: 0.85
      DROUGHT_SURCHARGE_PCT: 0.05
      FUEL_SURCHARGE_TIER1_MAX_MILES: 100
      FUEL_SURCHARGE_TIER2_MAX_MILES: 300
    precision: "0 decimal places (whole cents), round_half_up, applied at each pinned step"
    variants:
      - name: SPOT
        when: "DRAFT quotes (create, PATCH reprice, and any read of a DRAFT quote)"
        difference: "uses the latest MarketIndex effective on the CURRENT clock date; result changes as new indices are posted"
      - name: LOCKED
        when: "ISSUED/ACCEPTED/DECLINED/EXPIRED quotes and the Contract created from them"
        difference: "uses pinned_market_index_id frozen at issue time; identical quote inputs yield different totals once a newer index posts"

  - name: shrink_tonnage
    description: "Storage shrink over time; two sanctioned variants on the same lot produce different tonnage"
    trigger: "computed on read of BaleLot / occupancy / allocation checks, using the current logical clock"
    algorithm: decay_function
    formula: |
      months = full calendar months between harvested_date and current clock date:
               (y2-y1)*12 + (m2-m1), minus 1 if day(clock) < day(harvested_date)
      rate = SHRINK_MONTHLY_PCT, or SHRINK_CONTROLLED_MONTHLY_PCT if the CURRENT site's moisture_controlled
      simple_shrunk   = harvested_tonnage * (1 - min(SHRINK_CAP_PCT, months * rate))
      compound_shrunk = harvested_tonnage * (1 - rate)^months, floored at harvested_tonnage * (1 - SHRINK_CAP_PCT)
      allocatable_tonnage = max(0, simple_shrunk   - spoilage_tonnage - shipped_tonnage - open_allocated_tonnage)
      physical_tonnage    = max(0, compound_shrunk - spoilage_tonnage - shipped_tonnage)
      Tonnage outputs rounded to 2 decimals, round_half_up, AFTER the full expression.
    input_set: "the BaleLot, its current StorageSite, all SpoilageEvents, and OPEN LoadAllocations referencing it"
    constants:
      SHRINK_MONTHLY_PCT: 0.015
      SHRINK_CONTROLLED_MONTHLY_PCT: 0.0075
      SHRINK_CAP_PCT: 0.12
    precision: "2 decimal places, round_half_up"
    variants:
      - name: ACCOUNTING
        when: "allocation checks and the allocatable_tonnage field"
        difference: "simple (straight-line) shrink on original harvested tonnage; e.g. 100t stored 3 months -> 95.50"
      - name: PHYSICAL
        when: "storage capacity/occupancy checks and the physical_tonnage field"
        difference: "compound shrink on remaining tonnage; same lot -> 95.57, so a lot can fit a site by PHYSICAL while its ACCOUNTING tonnage differs"

  - name: freight_charge
    description: "Standalone freight computation reused inside quote_pricing; tiered fuel surcharge"
    trigger: "inside quote_pricing"
    algorithm: tiered_pricing
    formula: |
      base = max(min_charge_cents, round_half_up_0(distance_miles * rate_per_mile_cents))
      surcharge = round_half_up_0(base * fuel_pct(distance_miles))
      freight_cents = base + surcharge
    input_set: "the matched FreightLane"
    constants:
      FUEL_TIER1_MAX_MILES: 100
      FUEL_TIER2_MAX_MILES: 300
      FUEL_TIER2_PCT: 0.06
      FUEL_TIER3_PCT: 0.11
    precision: "0 decimal places, round_half_up at each pinned step"

  - name: auto_allocation_waterfall
    description: "Server-side partial-load allocation of a DeliveryLoad across contracts and lots"
    trigger: "POST /api/delivery-loads/{id}/auto-allocate"
    algorithm: waterfall_allocation
    formula: |
      eligible_contracts = Contract where status == ACTIVE AND remaining_tons > 0
        ranked by delivery_deadline ASC, tie-break created_at ASC
        (empty -> ERR_NO_ELIGIBLE_CONTRACT)
      eligible_lots(tier) = BaleLot where status == ACTIVE AND quality_tier == tier
        AND allocatable_tonnage > 0
        ranked by harvested_date ASC, tie-break created_at ASC
      remaining_capacity = load.capacity_tons - load.loaded_tons
      for contract in eligible_contracts (in rank order), while remaining_capacity > 0:
        take = min(contract.remaining_tons, remaining_capacity)
        if take <= 0: continue
        for lot in eligible_lots(contract.quality_tier) (in rank order), while take > 0:
          lot_take = min(lot.allocatable_tonnage, take)
          if lot_take <= 0: continue
          create LoadAllocation(load, contract, lot, lot_take)
          take -= lot_take; remaining_capacity -= lot_take
      if no allocation was created at all -> ERR_NO_ELIGIBLE_LOT
    input_set: "ACTIVE contracts with remaining_tons > 0; ACTIVE lots matching each contract's quality_tier"
    constants: {}
    precision: "tons to 2 decimals; partial fills allowed (partial-load allocation)"

  - name: grower_settlement
    description: "Grower proceeds at load settle; circular-looking dependency pinned to an explicit evaluation order"
    trigger: "POST /api/delivery-loads/{id}/settle"
    algorithm: chronological
    formula: |
      Process the load's DELIVERED LoadAllocations in created_at ASC order (never by id).
      For each allocation A:
        ytd = Grower.settled_tons_ytd BEFORE adding A            # evaluation order pinned
        commission_rate = 0.08 if ytd < 500
                          else 0.06 if ytd < 1500                # ytd exactly 500 -> 6%
                          else 0.04                              # ytd >= 1500
        gross = round_half_up_0(A.tons * Contract.unit_price_cents
                * (1 + PROTEIN_BONUS_PCT if BaleLot.certified_protein_pct >= PROTEIN_BONUS_THRESHOLD else 0))
        commission = round_half_up_0(gross * commission_rate)    # commission on GROSS, never on net
        net = gross - commission
        write A.settled_gross_cents / settled_commission_cents / settled_net_cents
        Grower.settled_tons_ytd += A.tons                        # cumulative update before next allocation
      Grower is resolved via BaleLot -> Cutting -> Field -> Grower.
    input_set: "DELIVERED LoadAllocations of the settled load, in created_at ASC order"
    constants:
      COMMISSION_TIER1_MAX_TONS: 500
      COMMISSION_TIER2_MAX_TONS: 1500
      COMMISSION_TIER1_PCT: 0.08
      COMMISSION_TIER2_PCT: 0.06
      COMMISSION_TIER3_PCT: 0.04
      PROTEIN_BONUS_THRESHOLD: 20.0
      PROTEIN_BONUS_PCT: 0.02
    precision: "0 decimal places, round_half_up at each pinned step"

  - name: storage_occupancy
    description: "Aggregate physical occupancy of a storage site; gate for lot create/transfer"
    trigger: "GET /api/storage-sites/{id}/occupancy; validated on POST /api/bale-lots and POST /api/bale-lots/{id}/transfer"
    algorithm: aggregation
    formula: |
      occupied = sum(BaleLot.physical_tonnage) over BaleLot where storage_site_id == site
                 AND status IN {ACTIVE, DEPLETED}                 # CONDEMNED lots are pulled from storage
      Guard: occupied + incoming.physical_tonnage <= capacity_tons  # equality is allowed
      else ERR_CAPACITY_EXCEEDED
    input_set: "BaleLots at the site with status IN {ACTIVE, DEPLETED}, computed at the current clock"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: baling_service_billing
    description: "Custom baling invoice: marginal per-bale tiers, wet surcharge, minimum charge (evaluation order pinned)"
    trigger: "POST /api/baling-service-orders/{id}/invoice"
    algorithm: tiered_pricing
    formula: |
      subtotal = sum over bale i (1..actual_bale_count) of marginal rate:
                 bale 1..500 -> 1200; bale 501..1000 -> 1050; bale 1001+ -> 900
      wet_surcharge = round_half_up_0(subtotal * WET_BALING_SURCHARGE_PCT)
                      if baled_moisture_pct > WET_BALING_MOISTURE_PCT else 0   # exactly 18.0 -> no surcharge
      invoice_cents = max(MIN_BALING_CHARGE_CENTS, subtotal + wet_surcharge)   # minimum applied LAST
      Completion is rejected outright when baled_moisture_pct > 20.0 (ERR_MOISTURE_UNSAFE).
    input_set: "the BalingServiceOrder's actual_bale_count and baled_moisture_pct"
    constants:
      BALE_RATE_TIER1_CENTS: 1200
      BALE_RATE_TIER2_CENTS: 1050
      BALE_RATE_TIER3_CENTS: 900
      BALE_TIER1_MAX: 500
      BALE_TIER2_MAX: 1000
      MIN_BALING_CHARGE_CENTS: 600000
      WET_BALING_MOISTURE_PCT: 18.0
      WET_BALING_SURCHARGE_PCT: 0.15
      UNSAFE_BALING_MOISTURE_PCT: 20.0
    precision: "0 decimal places, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — first match wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is in the endpoint's roles list", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Request body schema: required fields present, types valid, enum values in declared membership", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path and body resource ids resolve, validated left-to-right (path first, then body FKs in declared field order)", error_id: ERR_GROWER_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a Grower" }
  - { priority: 4, category: existence, check: "Field id resolves", error_id: ERR_FIELD_NOT_FOUND, http_status: 404, applies_to: "POST /api/cuttings; GET /api/fields/{id}" }
  - { priority: 4, category: existence, check: "Cutting id resolves", error_id: ERR_CUTTING_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a Cutting" }
  - { priority: 4, category: existence, check: "StorageSite id resolves", error_id: ERR_SITE_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a StorageSite" }
  - { priority: 4, category: existence, check: "BaleLot id resolves", error_id: ERR_LOT_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a BaleLot" }
  - { priority: 4, category: existence, check: "ForageTest id resolves", error_id: ERR_TEST_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a ForageTest" }
  - { priority: 4, category: existence, check: "Buyer id resolves", error_id: ERR_BUYER_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a Buyer" }
  - { priority: 4, category: existence, check: "Quote id resolves", error_id: ERR_QUOTE_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a Quote" }
  - { priority: 4, category: existence, check: "Contract id resolves", error_id: ERR_CONTRACT_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a Contract" }
  - { priority: 4, category: existence, check: "DeliveryLoad id resolves", error_id: ERR_LOAD_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a DeliveryLoad" }
  - { priority: 4, category: existence, check: "LoadAllocation id resolves", error_id: ERR_ALLOCATION_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a LoadAllocation" }
  - { priority: 4, category: existence, check: "BalingServiceOrder id resolves", error_id: ERR_BSO_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a BalingServiceOrder" }
  - { priority: 5, category: existence, check: "Entity-backed ownership: acting Buyer owns the quote; acting Grower owns the field/cutting/BalingServiceOrder", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "owner-scoped endpoints" }
  - { priority: 6, category: state, check: "State-machine guard for the attempted transition (from-state must match)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints (generic guard)" }
  - { priority: 6, category: state, check: "Cutting must be WINDOW_OPEN with trailing-3-day dry reports through actual_cut_date", error_id: ERR_CUTTING_NOT_OPEN, http_status: 409, applies_to: "POST /api/cuttings/{id}/mark-cut" }
  - { priority: 6, category: state, check: "BaleLot must be ACTIVE for submit/certify/condemn/transfer; on the allocation path a DEPLETED lot fails here while a CONDEMNED lot falls through to the priority-7 safety rule", error_id: ERR_LOT_NOT_ACTIVE, http_status: 409, applies_to: "lot-scoped action endpoints" }
  - { priority: 6, category: state, check: "ForageTest from-state must match the attempted transition", error_id: ERR_TEST_WRONG_STATE, http_status: 409, applies_to: "POST /api/forage-tests/{id}/submit|record-result|certify|invalidate" }
  - { priority: 6, category: state, check: "Quote from-state must be ISSUED for accept/decline/revise, DRAFT for issue/PATCH", error_id: ERR_QUOTE_NOT_ISSUABLE, http_status: 409, applies_to: "quote action endpoints" }
  - { priority: 6, category: state, check: "Quote past expires_at auto-transitions to EXPIRED before any other accept-time check", error_id: ERR_QUOTE_EXPIRED, http_status: 409, applies_to: "POST /api/quotes/{id}/accept" }
  - { priority: 6, category: state, check: "Contract must be ACTIVE or SUSPENDED for cancel/declare-default; ACTIVE for allocation", error_id: ERR_CONTRACT_NOT_ACTIVE, http_status: 409, applies_to: "contract action endpoints, POST /api/load-allocations, auto-allocate" }
  - { priority: 6, category: state, check: "DeliveryLoad logistics/settlement from-state must match the attempted transition", error_id: ERR_LOAD_WRONG_STATE, http_status: 409, applies_to: "delivery-load action endpoints" }
  - { priority: 6, category: state, check: "BalingServiceOrder from-state must match the attempted transition", error_id: ERR_BSO_WRONG_STATE, http_status: 409, applies_to: "baling-service-order action endpoints" }
  - { priority: 6, category: state, check: "OCC: expected_*_version equals the parent entity's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /api/quotes/{id}; POST /api/quotes/{id}/revise; POST /api/quotes/{id}/accept; POST /api/load-allocations; POST /api/bale-lots/{id}/transfer" }
  - { priority: 7, category: business_safety, check: "baled_moisture_pct <= 20.0 at BalingServiceOrder complete", error_id: ERR_MOISTURE_UNSAFE, http_status: 422, applies_to: "POST /api/baling-service-orders/{id}/complete" }
  - { priority: 7, category: business_safety, check: "CONDEMNED lots can never be allocated to a load (spoiled hay cannot ship)", error_id: ERR_LOT_CONDEMNED_UNSHIPPABLE, http_status: 422, applies_to: "POST /api/load-allocations" }
  - { priority: 8, category: business_temporal, check: "New Cutting planned window must not overlap any non-ABANDONED Cutting on the same field in the same season_year; windows are half-open [start, end) for overlap purposes, so back-to-back windows (prev.end == next.start) are allowed", error_id: ERR_FIELD_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /api/cuttings" }
  - { priority: 8, category: business_temporal, check: "Equipment buffer: same equipment_unit jobs IN {SCHEDULED, IN_PROGRESS} must differ by >= 2 days (one idle day)", error_id: ERR_EQUIPMENT_BUFFER_CONFLICT, http_status: 409, applies_to: "POST /api/baling-service-orders/{id}/schedule" }
  - { priority: 8, category: business_temporal, check: "actual_cut_date within [planned_window_start, planned_window_end] inclusive", error_id: ERR_CUTTING_WINDOW_RANGE, http_status: 422, applies_to: "POST /api/cuttings/{id}/mark-cut" }
  - { priority: 8, category: business_temporal, check: "declare-default requires current clock date > delivery_deadline", error_id: ERR_DEADLINE_NOT_PASSED, http_status: 422, applies_to: "POST /api/contracts/{id}/declare-default" }
  - { priority: 10, category: business_constraint, check: "(cutting_number, field_id, season_year) unique among non-ABANDONED cuttings", error_id: ERR_DUPLICATE_CUTTING_NUMBER, http_status: 409, applies_to: "POST /api/cuttings" }
  - { priority: 10, category: business_constraint, check: "(region_code, report_date) unique for WeatherReport", error_id: ERR_DUPLICATE_WEATHER_REPORT, http_status: 409, applies_to: "POST /api/weather-reports" }
  - { priority: 10, category: business_constraint, check: "(region_code, forage_type, effective_date) unique for MarketIndex", error_id: ERR_DUPLICATE_MARKET_INDEX, http_status: 409, applies_to: "POST /api/market-indices" }
  - { priority: 10, category: business_constraint, check: "(origin_region_code, dest_region_code) unique for FreightLane", error_id: ERR_DUPLICATE_FREIGHT_LANE, http_status: 409, applies_to: "POST /api/freight-lanes" }
  - { priority: 10, category: business_constraint, check: "Tonnage-carrying fields (tons, tons_lost, harvested_tonnage) must be > 0; other numeric sanity (acres, capacity_tons, miles, rates, prices, counts) is schema-level ERR_INVALID_REQUEST", error_id: ERR_TONS_NOT_POSITIVE, http_status: 422, applies_to: "tonnage-bearing create endpoints" }
  - { priority: 10, category: business_constraint, check: "Quote quality_tier must be a sellable tier (SUPREME/PREMIUM/GOOD/FAIR); UNGRADED hay cannot be quoted", error_id: ERR_UNGRADED_TIER, http_status: 422, applies_to: "POST /api/quotes" }
  - { priority: 10, category: business_constraint, check: "A MarketIndex effective on/before the current clock date must exist for (origin_region_code, forage_type)", error_id: ERR_NO_MARKET_INDEX, http_status: 422, applies_to: "POST /api/quotes; PATCH /api/quotes/{id}" }
  - { priority: 10, category: business_constraint, check: "A FreightLane must exist for (origin_region_code, dest_region_code)", error_id: ERR_NO_FREIGHT_LANE, http_status: 422, applies_to: "POST /api/quotes; PATCH /api/quotes/{id}" }
  - { priority: 10, category: business_constraint, check: "Storage capacity: site occupancy (physical) + incoming physical tonnage <= capacity_tons", error_id: ERR_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /api/bale-lots; POST /api/bale-lots/{id}/transfer" }
  - { priority: 10, category: business_constraint, check: "Allocation tons <= Contract.remaining_tons at creation time", error_id: ERR_ALLOCATION_EXCEEDS_REMAINING, http_status: 422, applies_to: "POST /api/load-allocations" }
  - { priority: 10, category: business_constraint, check: "Load total: loaded_tons + new tons <= capacity_tons", error_id: ERR_LOAD_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /api/load-allocations" }
  - { priority: 10, category: business_constraint, check: "auto-allocate requires at least one ACTIVE contract with remaining_tons > 0", error_id: ERR_NO_ELIGIBLE_CONTRACT, http_status: 422, applies_to: "POST /api/delivery-loads/{id}/auto-allocate" }
  - { priority: 10, category: business_constraint, check: "auto-allocate created zero allocations because no ACTIVE lot matched any eligible contract's tier", error_id: ERR_NO_ELIGIBLE_LOT, http_status: 422, applies_to: "POST /api/delivery-loads/{id}/auto-allocate" }
  - { priority: 10, category: business_constraint, check: "Segregation of duties: certifier X-User-ID != resulted_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: "POST /api/forage-tests/{id}/certify" }
  - { priority: 11, category: business_fiscal, check: "Buyer.credit_used_cents + quote.total_cents <= credit_limit_cents at accept (equality allowed)", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 402, applies_to: "POST /api/quotes/{id}/accept" }
  - { priority: 9, category: business_referential, check: "Referenced Grower must be ACTIVE when creating Fields, BaleLots (via Cutting->Field->Grower), BalingServiceOrders", error_id: ERR_GROWER_SUSPENDED, http_status: 422, applies_to: "POST /api/fields; POST /api/bale-lots; POST /api/baling-service-orders" }
  - { priority: 9, category: business_referential, check: "Buyer must be ACTIVE when creating/issuing/accepting quotes", error_id: ERR_BUYER_SUSPENDED, http_status: 422, applies_to: "POST /api/quotes; POST /api/quotes/{id}/issue; POST /api/quotes/{id}/accept" }
  - { priority: 9, category: business_referential, check: "Cutting must be CUT or HARVESTED when creating a BaleLot", error_id: ERR_CUTTING_NOT_CUT, http_status: 422, applies_to: "POST /api/bale-lots" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time. Advancing the clock triggers the quote-expiry sweep and re-dates shrink computations."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["ISSUED quotes with expires_at < new time -> EXPIRED"]

  # --- Grower ---
  - { method: POST, path: "/api/growers", description: "Create a grower", roles: [PlatformAdmin], code: 201, input: [name, region_code], output: Grower, side_effects: ["status ACTIVE, settled_tons_ytd 0.0, outstanding_balance_cents 0"] }
  - { method: GET, path: "/api/growers/{id}", description: "Get a grower", roles: [PlatformAdmin, BrokerOps, Grower], code: 200, input: [], output: Grower, side_effects: [] }
  - { method: POST, path: "/api/growers/{id}/suspend", description: "Suspend a grower; cancels their REQUESTED/SCHEDULED baling orders", roles: [PlatformAdmin], code: 200, input: [], output: Grower, side_effects: ["Grower.status -> SUSPENDED; open BalingServiceOrders -> CANCELLED"] }

  # --- Field ---
  - { method: POST, path: "/api/fields", description: "Create a field for an ACTIVE grower", roles: [PlatformAdmin, Grower], code: 201, input: [grower_id, name, acres, forage_type, "irrigated?"], output: Field, side_effects: [] }
  - { method: GET, path: "/api/fields", description: "List fields, optionally by grower", roles: [PlatformAdmin, BrokerOps, Grower], code: 200, input: ["grower_id?", "limit?", "offset?"], output: "Field[]", side_effects: [] }
  - { method: GET, path: "/api/fields/{id}", description: "Get a field", roles: [PlatformAdmin, BrokerOps, Grower], code: 200, input: [], output: Field, side_effects: [] }

  # --- Cutting ---
  - { method: POST, path: "/api/cuttings", description: "Schedule a cutting; planned windows on one field are half-open non-overlapping", roles: [PlatformAdmin, Grower], code: 201, input: [field_id, cutting_number, season_year, planned_window_start, planned_window_end], output: Cutting, side_effects: ["status SCHEDULED"] }
  - { method: GET, path: "/api/cuttings", description: "List cuttings with filters", roles: [PlatformAdmin, BrokerOps, Grower], code: 200, input: ["field_id?", "status?", "limit?", "offset?"], output: "Cutting[]", side_effects: [] }
  - { method: GET, path: "/api/cuttings/{id}", description: "Get a cutting", roles: [PlatformAdmin, BrokerOps, Grower], code: 200, input: [], output: Cutting, side_effects: [] }
  - { method: POST, path: "/api/cuttings/{id}/mark-cut", description: "Mark the cutting as cut on actual_cut_date (weather-window guarded)", roles: [PlatformAdmin, Grower], code: 200, input: [actual_cut_date], output: Cutting, side_effects: ["status -> CUT; actual_cut_date set"] }
  - { method: POST, path: "/api/cuttings/{id}/abandon", description: "Abandon a scheduled/open cutting; cancels dependent baling orders", roles: [PlatformAdmin, Grower], code: 200, input: [], output: Cutting, side_effects: ["status -> ABANDONED; REQUESTED/SCHEDULED BalingServiceOrders for this cutting -> CANCELLED"] }

  # --- WeatherReport ---
  - { method: POST, path: "/api/weather-reports", description: "Post a daily weather report; re-evaluates cutting weather windows in the region", roles: [PlatformAdmin], code: 201, input: [region_code, report_date, precipitation_mm, drying_index], output: WeatherReport, side_effects: ["weather_window_evaluation for affected cuttings; SCHEDULED<->WINDOW_OPEN flips"] }

  # --- StorageSite ---
  - { method: POST, path: "/api/storage-sites", description: "Create a storage site", roles: [PlatformAdmin], code: 201, input: [name, region_code, capacity_tons, "moisture_controlled?"], output: StorageSite, side_effects: [] }
  - { method: GET, path: "/api/storage-sites", description: "List storage sites", roles: [PlatformAdmin, BrokerOps], code: 200, input: ["limit?", "offset?"], output: "StorageSite[]", side_effects: [] }
  - { method: GET, path: "/api/storage-sites/{id}", description: "Get a storage site", roles: [PlatformAdmin, BrokerOps], code: 200, input: [], output: StorageSite, side_effects: [] }
  - method: GET
    path: "/api/storage-sites/{id}/occupancy"
    description: "Computed read: current physical occupancy of the site"
    roles: [PlatformAdmin, BrokerOps]
    code: 200
    input: []
    output: "{ occupied_physical_tons: number, capacity_tons: number, available_tons: number, lot_count: integer }"
    side_effects: []

  # --- BaleLot ---
  - { method: POST, path: "/api/bale-lots", description: "Create a bale lot from a CUT/HARVESTED cutting into a storage site (capacity-checked)", roles: [BrokerOps, PlatformAdmin], code: 201, input: [cutting_id, storage_site_id, bale_type, bale_count, harvested_tonnage, harvested_date], output: BaleLot, side_effects: ["first lot flips cutting CUT -> HARVESTED; quality_tier UNGRADED"] }
  - { method: GET, path: "/api/bale-lots", description: "List bale lots with filters", roles: [PlatformAdmin, BrokerOps], code: 200, input: ["cutting_id?", "storage_site_id?", "status?", "quality_tier?", "limit?", "offset?"], output: "BaleLot[]", side_effects: [] }
  - { method: GET, path: "/api/bale-lots/{id}", description: "Get a bale lot (computed tonnages at current clock)", roles: [PlatformAdmin, BrokerOps], code: 200, input: [], output: BaleLot, side_effects: [] }
  - { method: POST, path: "/api/bale-lots/{id}/condemn", description: "Condemn a lot; releases its open allocations and replans LOADING loads", roles: [BrokerOps, PlatformAdmin], code: 200, input: [], output: BaleLot, side_effects: ["status -> CONDEMNED; OPEN LoadAllocations -> RELEASED; affected LOADING loads revert to PLANNED"] }
  - { method: POST, path: "/api/bale-lots/{id}/transfer", description: "Move a lot to another storage site (OCC-guarded; destination capacity-checked)", roles: [BrokerOps, PlatformAdmin], code: 200, input: [dest_storage_site_id, expected_bale_lot_version], output: BaleLot, side_effects: ["storage_site_id updated; increments BaleLot.version by 1"] }

  # --- SpoilageEvent ---
  - { method: POST, path: "/api/spoilage-events", description: "Record a spoilage loss against a lot", roles: [BrokerOps, PlatformAdmin], code: 201, input: [bale_lot_id, event_date, tons_lost, reason], output: SpoilageEvent, side_effects: ["BaleLot.spoilage_tonnage += tons_lost; allocatable/physical recomputed"] }
  - { method: GET, path: "/api/bale-lots/{id}/spoilage-events", description: "List spoilage events for a lot", roles: [PlatformAdmin, BrokerOps], code: 200, input: ["limit?", "offset?"], output: "SpoilageEvent[]", side_effects: [] }

  # --- ForageTest ---
  - { method: POST, path: "/api/forage-tests", description: "Collect a sample from a lot (creates test in COLLECTED)", roles: [BrokerOps, PlatformAdmin], code: 201, input: [bale_lot_id, sample_date], output: ForageTest, side_effects: ["status COLLECTED"] }
  - { method: GET, path: "/api/forage-tests", description: "List forage tests with filters", roles: [PlatformAdmin, BrokerOps, LabTechnician], code: 200, input: ["bale_lot_id?", "status?", "limit?", "offset?"], output: "ForageTest[]", side_effects: [] }
  - { method: GET, path: "/api/forage-tests/{id}", description: "Get a forage test", roles: [PlatformAdmin, BrokerOps, LabTechnician], code: 200, input: [], output: ForageTest, side_effects: [] }
  - { method: POST, path: "/api/forage-tests/{id}/submit", description: "Submit (or resubmit for retest) a sample to the lab", roles: [LabTechnician], code: 200, input: [lab_reference], output: ForageTest, side_effects: ["status -> SUBMITTED; from RESULTED clears prior result fields"] }
  - { method: POST, path: "/api/forage-tests/{id}/record-result", description: "Record RFV/protein/moisture results", roles: [LabTechnician], code: 200, input: [rfv, protein_pct, moisture_pct], output: ForageTest, side_effects: ["status -> RESULTED; resulted_by_user_id set"] }
  - { method: POST, path: "/api/forage-tests/{id}/certify", description: "Certify a result (segregation of duties); writes the lot's quality tier", roles: [LabTechnician], code: 200, input: [], output: ForageTest, side_effects: ["status -> CERTIFIED; BaleLot.quality_tier + certified_protein_pct updated"] }
  - { method: POST, path: "/api/forage-tests/{id}/invalidate", description: "Invalidate a COLLECTED/SUBMITTED test", roles: [LabTechnician, BrokerOps], code: 200, input: [], output: ForageTest, side_effects: ["status -> INVALIDATED"] }

  # --- MarketIndex ---
  - { method: POST, path: "/api/market-indices", description: "Post a market index; drought regime computed against the 30-day lookback", roles: [PlatformAdmin], code: 201, input: [region_code, forage_type, effective_date, price_per_ton_cents], output: MarketIndex, side_effects: ["drought_regime computed by market_regime_classification"] }
  - { method: GET, path: "/api/market-indices", description: "List market indices with filters", roles: [PlatformAdmin, BrokerOps, Buyer], code: 200, input: ["region_code?", "forage_type?", "limit?", "offset?"], output: "MarketIndex[]", side_effects: [] }

  # --- Buyer ---
  - { method: POST, path: "/api/buyers", description: "Create a buyer", roles: [PlatformAdmin], code: 201, input: [name, region_code, credit_limit_cents], output: Buyer, side_effects: ["status ACTIVE, credit_used_cents 0"] }
  - { method: GET, path: "/api/buyers/{id}", description: "Get a buyer", roles: [PlatformAdmin, BrokerOps, Buyer], code: 200, input: [], output: Buyer, side_effects: [] }
  - { method: POST, path: "/api/buyers/{id}/suspend", description: "Suspend a buyer; suspends their ACTIVE contracts", roles: [PlatformAdmin], code: 200, input: [], output: Buyer, side_effects: ["Buyer.status -> SUSPENDED; ACTIVE Contracts -> SUSPENDED"] }

  # --- FreightLane ---
  - { method: POST, path: "/api/freight-lanes", description: "Create a freight lane", roles: [PlatformAdmin], code: 201, input: [origin_region_code, dest_region_code, distance_miles, rate_per_mile_cents, min_charge_cents], output: FreightLane, side_effects: [] }

  # --- Quote ---
  - { method: POST, path: "/api/quotes", description: "Create a DRAFT freight-inclusive quote (SPOT pricing at current clock)", roles: [Buyer], code: 201, input: [buyer_id, forage_type, quality_tier, tons, origin_region_code, dest_region_code, requested_delivery_by], output: Quote, side_effects: ["quote_pricing SPOT variant"] }
  - { method: GET, path: "/api/quotes", description: "List quotes (Buyers see only their own) with filters", roles: [PlatformAdmin, BrokerOps, Buyer], code: 200, input: ["buyer_id?", "status?", "pinned_market_index_id?", "limit?", "offset?"], output: "Quote[]", side_effects: [] }
  - { method: GET, path: "/api/quotes/{id}", description: "Get a quote (owner-enforced for Buyer role)", roles: [PlatformAdmin, BrokerOps, Buyer], code: 200, input: [], output: Quote, side_effects: ["lazy EXPIRED sweep"] }
  - { method: PATCH, path: "/api/quotes/{id}", description: "Update a DRAFT quote's tons/destination/deadline (OCC-guarded); reprices SPOT", roles: [Buyer], code: 200, input: [expected_quote_version, "tons?", "dest_region_code?", "requested_delivery_by?"], output: Quote, side_effects: ["quote_pricing SPOT recompute; increments Quote.version by 1"] }
  - { method: POST, path: "/api/quotes/{id}/issue", description: "Issue a DRAFT quote: pins the current market index and starts the 72h validity window", roles: [Buyer], code: 200, input: [], output: Quote, side_effects: ["status -> ISSUED; LOCKED pricing frozen; issued_at/expires_at set; increments Quote.version by 1"] }
  - { method: POST, path: "/api/quotes/{id}/revise", description: "Return an ISSUED quote to DRAFT for repricing (OCC-guarded)", roles: [Buyer], code: 200, input: [expected_quote_version], output: Quote, side_effects: ["status -> DRAFT; pin cleared; increments Quote.version by 1"] }
  - { method: POST, path: "/api/quotes/{id}/accept", description: "Accept an ISSUED quote (OCC-guarded); creates the Contract and reserves buyer credit", roles: [Buyer], code: 200, input: [expected_quote_version], output: Quote, side_effects: ["status -> ACCEPTED; Contract created ACTIVE; Buyer.credit_used_cents += total_cents; increments Quote.version by 1"] }
  - { method: POST, path: "/api/quotes/{id}/decline", description: "Decline an ISSUED quote", roles: [Buyer], code: 200, input: [], output: Quote, side_effects: ["status -> DECLINED"] }

  # --- Contract ---
  - { method: GET, path: "/api/contracts", description: "List contracts with filters", roles: [PlatformAdmin, BrokerOps, Buyer], code: 200, input: ["buyer_id?", "quote_id?", "status?", "limit?", "offset?"], output: "Contract[]", side_effects: [] }
  - { method: GET, path: "/api/contracts/{id}", description: "Get a contract", roles: [PlatformAdmin, BrokerOps, Buyer], code: 200, input: [], output: Contract, side_effects: [] }
  - { method: POST, path: "/api/contracts/{id}/cancel", description: "Cancel an ACTIVE/SUSPENDED contract; releases allocations and the credit reserve", roles: [PlatformAdmin], code: 200, input: [], output: Contract, side_effects: ["status -> CANCELLED; OPEN LoadAllocations -> RELEASED; Buyer.credit_used_cents -= total_reserved_cents"] }
  - { method: POST, path: "/api/contracts/{id}/declare-default", description: "Declare default on a past-deadline under-delivered contract", roles: [PlatformAdmin], code: 200, input: [], output: Contract, side_effects: ["status -> DEFAULTED; OPEN LoadAllocations -> RELEASED; Buyer.credit_used_cents -= total_reserved_cents"] }

  # --- DeliveryLoad ---
  - { method: POST, path: "/api/delivery-loads", description: "Create a delivery load", roles: [BrokerOps, PlatformAdmin], code: 201, input: [carrier_name, capacity_tons, planned_ship_date], output: DeliveryLoad, side_effects: ["logistics PLANNED, settlement OPEN"] }
  - { method: GET, path: "/api/delivery-loads/{id}", description: "Get a delivery load", roles: [PlatformAdmin, BrokerOps], code: 200, input: [], output: DeliveryLoad, side_effects: [] }
  - { method: POST, path: "/api/delivery-loads/{id}/start-loading", description: "PLANNED -> LOADING (requires at least one OPEN allocation)", roles: [BrokerOps, PlatformAdmin], code: 200, input: [], output: DeliveryLoad, side_effects: [] }
  - { method: POST, path: "/api/delivery-loads/{id}/depart", description: "LOADING -> IN_TRANSIT", roles: [BrokerOps, PlatformAdmin], code: 200, input: [], output: DeliveryLoad, side_effects: [] }
  - { method: POST, path: "/api/delivery-loads/{id}/deliver", description: "IN_TRANSIT -> DELIVERED; runs the 3-hop delivery cascade (lot shipped, contract fulfillment, credit release)", roles: [BrokerOps, PlatformAdmin], code: 200, input: [], output: DeliveryLoad, side_effects: ["allocations -> DELIVERED; Contract.delivered_tons updated; FULFILLED/DEPLETED auto-transitions; credit release on FULFILLED"] }
  - { method: POST, path: "/api/delivery-loads/{id}/settle", description: "OPEN -> SETTLED (requires DELIVERED); runs grower_settlement", roles: [BrokerOps, PlatformAdmin], code: 200, input: [], output: DeliveryLoad, side_effects: ["settlement lines written per allocation; Grower.settled_tons_ytd updated"] }
  - { method: POST, path: "/api/delivery-loads/{id}/auto-allocate", description: "Waterfall partial-load allocation across eligible contracts and lots", roles: [BrokerOps, PlatformAdmin], code: 200, input: [], output: "LoadAllocation[]", side_effects: ["allocations created per auto_allocation_waterfall; increments DeliveryLoad.version by 1"] }

  # --- LoadAllocation ---
  - { method: POST, path: "/api/load-allocations", description: "Manually allocate lot tonnage to a contract on a load (OCC-guarded on the load)", roles: [BrokerOps, PlatformAdmin], code: 201, input: [delivery_load_id, contract_id, bale_lot_id, tons, expected_delivery_load_version], output: LoadAllocation, side_effects: ["BaleLot.open_allocated_tonnage += tons; Contract.open_allocated_tons += tons; DeliveryLoad.loaded_tons += tons; increments DeliveryLoad.version by 1"] }
  - { method: GET, path: "/api/load-allocations", description: "List allocations with filters; results sorted by created_at ASC", roles: [PlatformAdmin, BrokerOps], code: 200, input: ["delivery_load_id?", "contract_id?", "bale_lot_id?", "status?", "limit?", "offset?"], output: "LoadAllocation[]", side_effects: [] }
  - { method: GET, path: "/api/load-allocations/{id}", description: "Get an allocation", roles: [PlatformAdmin, BrokerOps], code: 200, input: [], output: LoadAllocation, side_effects: [] }
  - { method: POST, path: "/api/load-allocations/{id}/release", description: "Release an OPEN allocation; reserved tonnage returns to the lot and contract", roles: [BrokerOps, PlatformAdmin], code: 200, input: [], output: LoadAllocation, side_effects: ["status -> RELEASED; reserved tonnage returned; LOADING load with zero OPEN allocations reverts to PLANNED"] }

  # --- BalingServiceOrder ---
  - { method: POST, path: "/api/baling-service-orders", description: "Request custom baling of a cutting", roles: [Grower, PlatformAdmin], code: 201, input: [grower_id, cutting_id], output: BalingServiceOrder, side_effects: ["status REQUESTED"] }
  - { method: GET, path: "/api/baling-service-orders", description: "List baling orders with filters", roles: [PlatformAdmin, BrokerOps, Grower], code: 200, input: ["grower_id?", "cutting_id?", "status?", "limit?", "offset?"], output: "BalingServiceOrder[]", side_effects: [] }
  - { method: GET, path: "/api/baling-service-orders/{id}", description: "Get a baling order", roles: [PlatformAdmin, BrokerOps, Grower], code: 200, input: [], output: BalingServiceOrder, side_effects: [] }
  - { method: POST, path: "/api/baling-service-orders/{id}/schedule", description: "Schedule the job on an equipment unit (buffer-day rule; cutting must be WINDOW_OPEN or CUT)", roles: [BrokerOps, PlatformAdmin], code: 200, input: [scheduled_date, equipment_unit], output: BalingServiceOrder, side_effects: ["status -> SCHEDULED"] }
  - { method: POST, path: "/api/baling-service-orders/{id}/start", description: "SCHEDULED -> IN_PROGRESS", roles: [BrokerOps, PlatformAdmin], code: 200, input: [], output: BalingServiceOrder, side_effects: [] }
  - { method: POST, path: "/api/baling-service-orders/{id}/complete", description: "IN_PROGRESS -> COMPLETED (moisture safety gate)", roles: [BrokerOps, PlatformAdmin], code: 200, input: [actual_bale_count, baled_moisture_pct], output: BalingServiceOrder, side_effects: ["actual_bale_count, baled_moisture_pct set"] }
  - { method: POST, path: "/api/baling-service-orders/{id}/dispute", description: "COMPLETED -> DISPUTED (grower disputes the count/charges)", roles: [Grower, PlatformAdmin], code: 200, input: [], output: BalingServiceOrder, side_effects: [] }
  - { method: POST, path: "/api/baling-service-orders/{id}/resolve", description: "DISPUTED -> COMPLETED (dispute resolved, billing may proceed)", roles: [BrokerOps, PlatformAdmin], code: 200, input: [], output: BalingServiceOrder, side_effects: [] }
  - { method: POST, path: "/api/baling-service-orders/{id}/invoice", description: "COMPLETED -> INVOICED; computes the bill and debits the grower", roles: [BrokerOps, PlatformAdmin], code: 200, input: [], output: BalingServiceOrder, side_effects: ["invoice_cents := baling_service_billing; Grower.outstanding_balance_cents += invoice_cents"] }
  - { method: POST, path: "/api/baling-service-orders/{id}/cancel", description: "REQUESTED/SCHEDULED -> CANCELLED", roles: [Grower, PlatformAdmin], code: 200, input: [], output: BalingServiceOrder, side_effects: [] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed actor does not own the target resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, bad type, or enum value out of range" }
  - { id: ERR_GROWER_NOT_FOUND, http: 404, condition: "Grower id does not resolve" }
  - { id: ERR_FIELD_NOT_FOUND, http: 404, condition: "Field id does not resolve" }
  - { id: ERR_CUTTING_NOT_FOUND, http: 404, condition: "Cutting id does not resolve" }
  - { id: ERR_SITE_NOT_FOUND, http: 404, condition: "StorageSite id does not resolve" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "BaleLot id does not resolve" }
  - { id: ERR_TEST_NOT_FOUND, http: 404, condition: "ForageTest id does not resolve" }
  - { id: ERR_BUYER_NOT_FOUND, http: 404, condition: "Buyer id does not resolve" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "Quote id does not resolve" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "Contract id does not resolve" }
  - { id: ERR_LOAD_NOT_FOUND, http: 404, condition: "DeliveryLoad id does not resolve" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "LoadAllocation id does not resolve" }
  - { id: ERR_BSO_NOT_FOUND, http: 404, condition: "BalingServiceOrder id does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic from-state guard (grower/buyer suspend from non-ACTIVE; allocation release from non-OPEN)" }
  - { id: ERR_CUTTING_NOT_OPEN, http: 409, condition: "mark-cut attempted while cutting not WINDOW_OPEN or trailing-3-day dry rule fails" }
  - { id: ERR_CUTTING_WINDOW_RANGE, http: 422, condition: "actual_cut_date outside [planned_window_start, planned_window_end] inclusive" }
  - { id: ERR_LOT_NOT_ACTIVE, http: 409, condition: "Lot-scoped action attempted on a DEPLETED/CONDEMNED lot" }
  - { id: ERR_TEST_WRONG_STATE, http: 409, condition: "ForageTest from-state does not match the attempted transition" }
  - { id: ERR_QUOTE_NOT_ISSUABLE, http: 409, condition: "Quote action attempted from the wrong state" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Accept attempted after expires_at (quote auto-transitions to EXPIRED first) or on an already-EXPIRED quote" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Contract action attempted from a non-ACTIVE/non-SUSPENDED state, or allocation against a non-ACTIVE contract" }
  - { id: ERR_LOAD_WRONG_STATE, http: 409, condition: "DeliveryLoad logistics/settlement from-state mismatch (including settle before DELIVERED)" }
  - { id: ERR_BSO_WRONG_STATE, http: 409, condition: "BalingServiceOrder from-state mismatch (including schedule against a non-WINDOW_OPEN/non-CUT cutting)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent entity's current version" }
  - { id: ERR_MOISTURE_UNSAFE, http: 422, condition: "baled_moisture_pct > 20.0 at BalingServiceOrder complete" }
  - { id: ERR_LOT_CONDEMNED_UNSHIPPABLE, http: 422, condition: "Allocation attempted against a CONDEMNED lot" }
  - { id: ERR_FIELD_WINDOW_OVERLAP, http: 409, condition: "New cutting window overlaps a non-ABANDONED cutting on the same field/season (half-open intervals; adjacency allowed)" }
  - { id: ERR_EQUIPMENT_BUFFER_CONFLICT, http: 409, condition: "Same equipment_unit already has a SCHEDULED/IN_PROGRESS job within < 2 days" }
  - { id: ERR_DEADLINE_NOT_PASSED, http: 422, condition: "declare-default before delivery_deadline has passed" }
  - { id: ERR_DUPLICATE_CUTTING_NUMBER, http: 409, condition: "cutting_number already used on the same field+season among non-ABANDONED cuttings" }
  - { id: ERR_DUPLICATE_WEATHER_REPORT, http: 409, condition: "WeatherReport already exists for (region_code, report_date)" }
  - { id: ERR_DUPLICATE_MARKET_INDEX, http: 409, condition: "MarketIndex already exists for (region_code, forage_type, effective_date)" }
  - { id: ERR_DUPLICATE_FREIGHT_LANE, http: 409, condition: "FreightLane already exists for (origin_region_code, dest_region_code)" }
  - { id: ERR_TONS_NOT_POSITIVE, http: 422, condition: "A tonnage field was <= 0" }
  - { id: ERR_UNGRADED_TIER, http: 422, condition: "Quote requested for UNGRADED hay (not sellable)" }
  - { id: ERR_NO_MARKET_INDEX, http: 422, condition: "No MarketIndex effective on/before the current clock for the quote's origin region + forage type" }
  - { id: ERR_NO_FREIGHT_LANE, http: 422, condition: "No FreightLane for the quote's origin/dest region pair" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Storage site physical occupancy would exceed capacity_tons" }
  - { id: ERR_LOAD_CAPACITY_EXCEEDED, http: 422, condition: "Allocation would push the load over capacity_tons" }
  - { id: ERR_ALLOCATION_EXCEEDS_REMAINING, http: 422, condition: "Allocation tons exceed the contract's remaining_tons" }
  - { id: ERR_NO_ELIGIBLE_CONTRACT, http: 422, condition: "auto-allocate found no ACTIVE contract with remaining_tons > 0" }
  - { id: ERR_NO_ELIGIBLE_LOT, http: 422, condition: "auto-allocate found contracts but zero matching ACTIVE graded lots, so no allocation was created" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Certifying technician is the same user who recorded the result" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Accept would push credit_used_cents above credit_limit_cents" }
  - { id: ERR_GROWER_SUSPENDED, http: 422, condition: "Referenced grower is SUSPENDED" }
  - { id: ERR_BUYER_SUSPENDED, http: 422, condition: "Acting/referenced buyer is SUSPENDED" }
  - { id: ERR_CUTTING_NOT_CUT, http: 422, condition: "BaleLot creation against a cutting that is not CUT or HARVESTED" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Brokerage platform administrator; superset of all operations plus admin-only surfaces (clock, weather, market indices, freight lanes, storage sites, grower/buyer management, contract cancel/default)"
    identity: opaque
    exclusive_operations: ["POST /api/_clock/set_current_utc", "POST /api/weather-reports", "POST /api/market-indices", "POST /api/freight-lanes", "POST /api/storage-sites", "POST /api/growers", "POST /api/growers/{id}/suspend", "POST /api/buyers", "POST /api/buyers/{id}/suspend", "POST /api/contracts/{id}/cancel", "POST /api/contracts/{id}/declare-default"]
    shared_operations: ["all other business endpoints"]
  - name: BrokerOps
    description: "Brokerage operations staff; runs inventory, lab intake, loads, allocations, and baling service execution"
    identity: opaque
    exclusive_operations: ["POST /api/bale-lots", "POST /api/bale-lots/{id}/condemn", "POST /api/bale-lots/{id}/transfer", "POST /api/spoilage-events", "POST /api/forage-tests", "POST /api/delivery-loads", "POST /api/delivery-loads/{id}/start-loading", "POST /api/delivery-loads/{id}/depart", "POST /api/delivery-loads/{id}/deliver", "POST /api/delivery-loads/{id}/settle", "POST /api/delivery-loads/{id}/auto-allocate", "POST /api/load-allocations", "POST /api/load-allocations/{id}/release", "POST /api/baling-service-orders/{id}/schedule", "POST /api/baling-service-orders/{id}/start", "POST /api/baling-service-orders/{id}/complete", "POST /api/baling-service-orders/{id}/resolve", "POST /api/baling-service-orders/{id}/invoice"]
    shared_operations: ["GET endpoints within scope", "POST /api/forage-tests/{id}/invalidate"]
  - name: Grower
    description: "Hay grower; manages own fields and cuttings, requests and disputes custom baling"
    identity: "entity_backed:Grower"
    exclusive_operations: ["POST /api/fields", "POST /api/cuttings", "POST /api/cuttings/{id}/mark-cut", "POST /api/cuttings/{id}/abandon", "POST /api/baling-service-orders", "POST /api/baling-service-orders/{id}/dispute"]
    shared_operations: ["GET own grower/fields/cuttings/baling-orders", "POST /api/baling-service-orders/{id}/cancel"]
  - name: Buyer
    description: "Hay buyer; requests, issues, accepts and declines own quotes; views own contracts"
    identity: "entity_backed:Buyer"
    exclusive_operations: ["POST /api/quotes", "PATCH /api/quotes/{id}", "POST /api/quotes/{id}/issue", "POST /api/quotes/{id}/revise", "POST /api/quotes/{id}/accept", "POST /api/quotes/{id}/decline"]
    shared_operations: ["GET own buyer/quotes/contracts", "GET /api/market-indices"]
  - name: LabTechnician
    description: "Forage lab technician; submits samples, records results, certifies results recorded by a different technician (segregation of duties)"
    identity: opaque
    exclusive_operations: ["POST /api/forage-tests/{id}/submit", "POST /api/forage-tests/{id}/record-result", "POST /api/forage-tests/{id}/certify"]
    shared_operations: ["GET /api/forage-tests", "GET /api/forage-tests/{id}", "POST /api/forage-tests/{id}/invalidate"]
