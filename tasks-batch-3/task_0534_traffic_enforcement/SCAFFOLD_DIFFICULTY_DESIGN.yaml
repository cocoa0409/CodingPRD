        distinguishing_aspect: |
          Temporal boundary on a different endpoint (contest create): a contest filed AT exactly due_at_utc
          (clock == due) is allowed (inclusive <=), succeeding; one second past would be ERR_CONTEST_WINDOW_CLOSED.
          due_at_utc = notice (2026-05-01T09:00:00Z) + 30 days = 2026-05-31T09:00:00Z.
        test_recipe:
