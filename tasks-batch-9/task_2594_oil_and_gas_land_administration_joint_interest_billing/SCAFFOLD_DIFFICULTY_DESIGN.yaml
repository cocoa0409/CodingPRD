        shape: cyclic
        distinguishing_aspect: |
          BillingDispute loops OPEN -> OPERATOR_RESPONDED -> OPEN, and each traversal both increments
          round_count and RESETS response_due_date to the rebuttal date plus 60 days, so the deadline
          that gates the loop is rewritten by the loop itself. The termination condition is the round
          cap, not a deadline: after two rebuttals round_count == 2 and the third rebuttal is rejected
          with ERR_MAX_DISPUTE_ROUNDS_EXCEEDED even though the rebuttal window is still open, which
