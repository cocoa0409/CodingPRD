              payload: { doc_refs: ["BL-1"] }
              as: FactoryRep
              as_user_id: "${f1_id}"
            - call: "POST /sourcing/shipments/${sh1_id}/confirm-receipt"
              payload: {}
              as: BuyerManager
              as_user_id: "${b1_id}"
            - call: "GET /sourcing/purchase-orders/${po1_id}"
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { po1_final: "$.data.final_commission_cents", po1_status: "$.data.status", po1_rate2: "$.data.commission_rate_bp" }
            - call: "GET /sourcing/buyers/${b1_id}"
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { b1_ytd: "$.data.ytd_gmv_cents" }
          assert:
