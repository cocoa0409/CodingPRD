  - rule_id: transitive_cascade
    instances:

      - name: engagement_termination_four_hop_cascade
        grounds:
          - state_machines.EngagementLetter.ACTIVE_to_TERMINATED
          - state_machines.RatingRequest.TEAM_CONFIRMED_to_WITHDRAWN
          - state_machines.AnalyticalTeamAssignment.PROPOSED_to_REVOKED
          - calculations.consecutive_lead_months
        distinguishing_aspect: |
          A four-hop causal chain: terminating the letter withdraws the request
          (hop 1); the withdrawal revokes the team assignment (hop 2); the
          revocation recomputes the lead's consecutive_lead_months (hop 3);
          the shortened streak restores rotation_eligible (hop 4). Each hop is
          caused by the previous one, not by the original terminate call.
        test_recipe:
          setup:
            - "Empty database. An ACTIVE engagement, a request at TEAM_CONFIRMED with a CONFIRMED assignment, and a lead whose streak matters."
          setup_api_calls:
            - call: "POST /rating-agency/_clock/set_current_utc"
