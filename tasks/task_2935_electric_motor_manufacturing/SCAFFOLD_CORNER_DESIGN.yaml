              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { e_body_wo: $.data.error_id }
            - call: "POST /stator-builds/00000000-0000-4000-8000-000000000000/impregnate"
              payload: { oven_id: "${oven_a_id}", impregnation_window_start: "2026-08-03T08:00:00.000Z", impregnation_window_end: "2026-08-03T12:00:00.000Z", varnish_process: "VPI", varnish_cycles: 2, cure_temp_c: 165.0 }
              as: BuildTechnician
