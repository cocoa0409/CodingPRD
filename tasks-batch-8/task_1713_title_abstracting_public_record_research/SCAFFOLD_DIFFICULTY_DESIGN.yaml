            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_772", property_address: "1300 Red River", county: "Travis", state_code: "TX", legal_description_text: "LOT 18 BLK Q", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_772
              captures: { ord2: $.data.id }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord2}", abstracter_ref: "abs_772b", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T12:00:00Z" }
              as: OperationsManager
              captures: { asg2: $.data.id }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord2}", assignment_id: "${asg2}", instrument_type: "DEED", grantor_name: "A Smith", grantee_name: "B Jones", instrument_number: "INST-772-B", recording_date: "2010-01-01" }
              as: Abstracter
              as_user_id: abs_772b
              captures: { doc2: $.data.id }
            - call: "POST /api/record-documents/${doc2}/verify"
              payload: {}
              as: Abstracter
              as_user_id: abs_772b
            - call: "POST /api/search-assignments/${asg2}/submit"
              payload: {}
              as: Abstracter
              as_user_id: abs_772b
            - call: "POST /api/search-assignments/${asg2}/accept"
              payload: {}
              as: Examiner
              as_user_id: ex_772
            - call: "GET /api/abstract-orders/${ord2}"
              as: OperationsManager
              captures: { ord2_v: $.data.version }
            - call: "POST /api/abstract-reports"
              payload: { order_id: "${ord2}", title: "Report 772-2", expected_abstract_order_version: "${ord2_v}" }
              as: Abstracter
