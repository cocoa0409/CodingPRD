scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: renewal_price_full_vs_partial_on_subscription
        grounds:
          - calculations.renewal_price
          - state_machines.Subscription.PENDING_to_ACTIVE
          - entities.Subscription.fields.locked_price_cents
        distinguishing_aspect: |
          Same Section (base_price_cents=200000), same single ASSIGNED seat, same
          BRONZE holder, but a FULL plan (price_multiplier_bps=10000) yields
          locked_price_cents=200000 while a PARTIAL plan (5500) yields 110000 —
          two valid pricing variants of the same Subscription input diverge.
        test_recipe:
          setup:
            - "Section base_price_cents=200000; one FULL plan and one PARTIAL(5500) plan"
            - "Two BRONZE accounts, each with a PENDING subscription holding exactly one ASSIGNED seat (one seat per account)"
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 101", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "A", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat1_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "A", seat_number: 2, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat2_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full 2026", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { full_plan_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Partial 2026", plan_type: "PARTIAL", game_count: 20, price_multiplier_bps: 5500 }
              as: BoxOfficeAgent
              captures: { part_plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Holder Full", email: "full@x.com" }
              as: BoxOfficeAgent
              captures: { acc_full_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Holder Part", email: "part@x.com" }
              as: BoxOfficeAgent
              captures: { acc_part_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_full_id}", season_plan_id: "${full_plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_full_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_part_id}", season_plan_id: "${part_plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_part_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_full_id}", seat_id: "${seat1_id}" }
              as: BoxOfficeAgent
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_part_id}", seat_id: "${seat2_id}" }
              as: BoxOfficeAgent
          trigger:
            - call: "POST /subscriptions/${sub_full_id}/activate"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub_part_id}/activate"
              payload: {}
              as: BoxOfficeAgent
          assert:
            - "Subscription.${sub_full_id}.locked_price_cents == 200000"
            - "Subscription.${sub_part_id}.locked_price_cents == 110000"
            - "Subscription.${sub_full_id}.locked_price_cents != Subscription.${sub_part_id}.locked_price_cents"

      - name: priority_points_standard_vs_playoff_on_account
        grounds:
          - calculations.priority_points_accrual
          - state_machines.Subscription.PENDING_to_ACTIVE
          - entities.Account.fields.priority_points
        distinguishing_aspect: |
          Same 1-seat activation with consecutive_seasons=0, but a plan with
          includes_playoffs=false grants 100 points while includes_playoffs=true
          grants 300 (adds PLAYOFF_BONUS_PER_SEAT*seat_count=200) — the dual
          variant lands on Account.priority_points, a different entity domain
          than renewal_price's Subscription.locked_price_cents.
        test_recipe:
          setup:
            - "Section base_price_cents=200000; one FULL non-playoff plan and one FULL playoff plan"
            - "Two BRONZE accounts (consecutive_seasons=0), each PENDING subscription holding one ASSIGNED seat"
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 102", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "B", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seatA_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "B", seat_number: 2, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seatB_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full No Playoff", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000, includes_playoffs: false }
              as: BoxOfficeAgent
              captures: { plan_std_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full Playoff", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000, includes_playoffs: true }
              as: BoxOfficeAgent
              captures: { plan_pf_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Std Holder", email: "std@x.com", consecutive_seasons: 0 }
              as: BoxOfficeAgent
              captures: { acc_std_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Playoff Holder", email: "pf@x.com", consecutive_seasons: 0 }
              as: BoxOfficeAgent
              captures: { acc_pf_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_std_id}", season_plan_id: "${plan_std_id}" }
              as: BoxOfficeAgent
              captures: { sub_std_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_pf_id}", season_plan_id: "${plan_pf_id}" }
              as: BoxOfficeAgent
              captures: { sub_pf_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_std_id}", seat_id: "${seatA_id}" }
              as: BoxOfficeAgent
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_pf_id}", seat_id: "${seatB_id}" }
              as: BoxOfficeAgent
          trigger:
            - call: "POST /subscriptions/${sub_std_id}/activate"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub_pf_id}/activate"
              payload: {}
              as: BoxOfficeAgent
          assert:
            - "Account.${acc_std_id}.priority_points == 100"
            - "Account.${acc_pf_id}.priority_points == 300"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: renewal_price_tiered_multiplier_loyalty_floor_mode_a
        grounds:
          - calculations.renewal_price
          - state_machines.Subscription.PENDING_to_ACTIVE
          - entities.SeatAssignment.fields.assigned_price_cents
        distinguishing_aspect: |
          Mode (a): renewal_price combines >=3 inputs (Section.base_price_cents,
          SeasonPlan.price_multiplier_bps, loyalty_bps) with a non-linear max()
          floor. With base=150000, PARTIAL 5500, BRONZE(0): plan_adjusted=82500,
          loyalty_disc=0, and the max(82500, MIN_PARTIAL_FLOOR_CENTS=100000)
          clamp BINDS, raising assigned_price_cents to 100000.
        test_recipe:
          setup:
            - "Section base_price_cents=150000; PARTIAL plan multiplier 5500; BRONZE account; PENDING subscription with one ASSIGNED seat"
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Upper 301", tier: "VALUE", base_price_cents: 150000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "Z", seat_number: 9, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Partial Floor", plan_type: "PARTIAL", game_count: 20, price_multiplier_bps: 5500 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Floor Holder", email: "floor@x.com" }
              as: BoxOfficeAgent
              captures: { acc_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat_id}" }
              as: BoxOfficeAgent
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: BoxOfficeAgent
          assert:
            - "SeatAssignment.${sa_id}.assigned_price_cents == 100000"
            - "Subscription.${sub_id}.locked_price_cents == 100000"

      - name: resale_payout_round_each_fee_component_mode_b
        grounds:
          - calculations.resale_payout
          - state_machines.TicketTransfer.LISTED_to_SOLD
          - entities.TicketTransfer.fields.payout_cents
        distinguishing_aspect: |
          Mode (b): with gross=10005, rounding EACH fee component then summing
          (mkt=round_half_up(750.375)=750, proc=round_half_up(290.145)=290 →
          payout=10005-750-290=8965) differs by one cent from combining the
          rates and rounding once (round_half_up(1040.52)=1041 → 8964). The
          scaffold pins round-each-then-sum, so payout_cents==8965. The entity
          domain is TicketTransfer, distinct from renewal_price's Subscription.
        test_recipe:
          setup:
            - "An ACTIVE FULL subscription owned by holder with one ASSIGNED seat; a RESALE transfer LISTED at listing_price_cents=10005; a buyer account exists"
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 110", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "C", seat_number: 5, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full Resale", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Seller", email: "seller@x.com" }
              as: BoxOfficeAgent
              captures: { seller_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Buyer", email: "buyer@x.com" }
              as: BoxOfficeAgent
              captures: { buyer_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${seller_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat_id}" }
              as: BoxOfficeAgent
              captures: { sa_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /ticket-transfers"
              payload: { seat_assignment_id: "${sa_id}", transfer_type: "RESALE", listing_price_cents: 10005 }
              as: AccountHolder
              as_user_id: "${seller_id}"
              captures: { tt_id: $.data.id }
            - call: "POST /ticket-transfers/${tt_id}/list"
              payload: {}
              as: AccountHolder
              as_user_id: "${seller_id}"
          trigger:
            - call: "POST /ticket-transfers/${tt_id}/complete-sale"
              payload: { recipient_account_id: "${buyer_id}" }
              as: BoxOfficeAgent
          assert:
            - "TicketTransfer.${tt_id}.payout_cents == 8965"
            - "TicketTransfer.${tt_id}.status == SOLD"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_relocation_cycle_active_relocating_active
        grounds:
          - state_machines.Subscription.ACTIVE_to_RELOCATING
          - state_machines.Subscription.RELOCATING_to_ACTIVE
          - entities.Subscription.fields.status
        distinguishing_aspect: |
          Subscription is cyclic: ACTIVE -> RELOCATING (begin) -> ACTIVE (confirm)
          returns to a non-terminal state it already visited, and can repeat. A
          linear pipeline could not re-enter ACTIVE after leaving it.
        test_recipe:
          setup:
            - "ACTIVE subscription with one ASSIGNED seat (seat1) in section S; a second AVAILABLE seat (seat2) in the same section sharing the same season window"
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 120", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "D", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat1_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "D", seat_number: 2, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat2_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full Reloc", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Reloc Holder", email: "reloc@x.com" }
              as: BoxOfficeAgent
              captures: { acc_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat1_id}" }
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: BoxOfficeAgent
              captures: { v_active: $.data.version }
          trigger:
            - call: "POST /subscriptions/${sub_id}/relocate"
              payload: { expected_subscription_version: "${v_active}" }
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub_id}/relocate/confirm"
              payload: { target_seat_ids: ["${seat2_id}"] }
              as: BoxOfficeAgent
          assert:
            - "Subscription.${sub_id}.status == ACTIVE"
            - "Seat.${seat1_id}.status == AVAILABLE"
            - "Seat.${seat2_id}.status == SOLD"

      - name: ticket_transfer_branch_forward_vs_listed_divergent_effects
        grounds:
          - state_machines.TicketTransfer.PENDING_to_FORWARDED
          - state_machines.TicketTransfer.PENDING_to_LISTED
          - state_machines.TicketTransfer.LISTED_to_SOLD
        distinguishing_aspect: |
          TicketTransfer forks at PENDING into two branches with divergent
          side-effect sets: FORWARD ends at terminal FORWARDED with payout_cents==0
          (no fee), whereas RESALE goes PENDING->LISTED->SOLD and sets
          payout_cents from resale_payout. Same entity, two divergent branches.
        test_recipe:
          setup:
            - "Two ACTIVE FULL subscriptions each owning one ASSIGNED seat: sellerF forwards, sellerR resells; recipient and buyer accounts exist"
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 130", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "E", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seatF_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "E", seat_number: 2, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seatR_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full Branch", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "SellerF", email: "sellerf@x.com" }
              as: BoxOfficeAgent
              captures: { sf_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "SellerR", email: "sellerr@x.com" }
              as: BoxOfficeAgent
              captures: { sr_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Recipient", email: "recip@x.com" }
              as: BoxOfficeAgent
              captures: { recip_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Buyer2", email: "buyer2@x.com" }
              as: BoxOfficeAgent
              captures: { buyer_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${sf_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { subF_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${sr_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { subR_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${subF_id}", seat_id: "${seatF_id}" }
              as: BoxOfficeAgent
              captures: { saF_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${subR_id}", seat_id: "${seatR_id}" }
              as: BoxOfficeAgent
              captures: { saR_id: $.data.id }
            - call: "POST /subscriptions/${subF_id}/activate"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${subR_id}/activate"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /ticket-transfers"
              payload: { seat_assignment_id: "${saF_id}", transfer_type: "FORWARD", recipient_account_id: "${recip_id}" }
              as: AccountHolder
              as_user_id: "${sf_id}"
              captures: { ttF_id: $.data.id }
            - call: "POST /ticket-transfers"
              payload: { seat_assignment_id: "${saR_id}", transfer_type: "RESALE", listing_price_cents: 20000 }
              as: AccountHolder
              as_user_id: "${sr_id}"
              captures: { ttR_id: $.data.id }
            - call: "POST /ticket-transfers/${ttR_id}/list"
              payload: {}
              as: AccountHolder
              as_user_id: "${sr_id}"
          trigger:
            - call: "POST /ticket-transfers/${ttF_id}/forward"
              payload: {}
              as: AccountHolder
              as_user_id: "${sf_id}"
            - call: "POST /ticket-transfers/${ttR_id}/complete-sale"
              payload: { recipient_account_id: "${buyer_id}" }
              as: BoxOfficeAgent
          assert:
            - "TicketTransfer.${ttF_id}.status == FORWARDED"
            - "TicketTransfer.${ttF_id}.payout_cents == 0"
            - "TicketTransfer.${ttR_id}.status == SOLD"
            - "TicketTransfer.${ttR_id}.payout_cents == 17920"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_cascades_subscription_plan_installments_depth3
        grounds:
          - state_machines.Subscription.ACTIVE_to_CANCELLED
          - state_machines.PaymentPlan.ACTIVE_to_CANCELLED
          - entities.Installment.fields.status
        distinguishing_aspect: |
          Depth-3 chain from cancel: Subscription ACTIVE->CANCELLED *causes*
          its PaymentPlan ACTIVE->CANCELLED, which *itself causes* every SCHEDULED
          Installment->VOID. Each hop is triggered by the previous hop, not by the
          original cancel call directly.
        test_recipe:
          setup:
            - "ACTIVE FULL subscription (one seat, locked_price_cents=200000) financed by an ACTIVE 4-installment PaymentPlan with all four Installments SCHEDULED"
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 140", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "F", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full Cascade", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Cascade Holder", email: "cascade@x.com" }
              as: BoxOfficeAgent
              captures: { acc_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat_id}" }
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /payment-plans"
              payload: { subscription_id: "${sub_id}", installment_count: 4 }
              as: FinanceClerk
              captures: { pp_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: BoxOfficeAgent
          assert:
            - "Subscription.${sub_id}.status == CANCELLED"
            - "PaymentPlan.${pp_id}.status == CANCELLED"
            - "every Installment under PaymentPlan.${pp_id} has status == VOID"

      - name: default_cascades_paymentplan_subscription_suspended_depth2
        grounds:
          - state_machines.PaymentPlan.ACTIVE_to_DEFAULTED
          - state_machines.Subscription.ACTIVE_to_SUSPENDED
          - entities.Subscription.fields.status
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (payment-plan default, not cancel):
          PaymentPlan ACTIVE->DEFAULTED *causes* the financed Subscription
          ACTIVE->SUSPENDED. Distinct propagation pattern and origin from the
          depth-3 cancel cascade.
        test_recipe:
          setup:
            - "ACTIVE FULL subscription financed by an ACTIVE 4-installment PaymentPlan with SCHEDULED installments remaining"
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 150", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
