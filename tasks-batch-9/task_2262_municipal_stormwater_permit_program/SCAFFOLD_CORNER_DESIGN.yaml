# Scaffold Corner Design — §1.9 breadth probe for task_2262 Municipal Stormwater Permit Program.
# Taxonomy: references/claim-extraction-guide.md. Section names are the guide's nine sections.
# Every one of the 73 error codes in SCAFFOLD.yaml §1.6 is reachable from this file plus the
# excluded_because stubs that point into SCAFFOLD_DIFFICULTY_DESIGN.yaml.
scaffold_corner_design:

  - section: entities
    instances:

      - name: permit_term_creation_applies_every_declared_default
        claim_type: defaults
        grounds:
          - entities.PermitTerm
          - endpoints.POST /stormwater/permit-terms
        distinguishing_aspect: "A term created with only the three required inputs returns tmdl_applicable false, eru_sqft 3000, funding_target_cents 0, status DRAFT, compliance_posture COMPLIANT and version 1."
        test_recipe:
          setup:
            - "empty database with the logical clock pinned at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
          trigger:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-DEFAULTS", term_start_date: "2026-01-01", term_end_date: "2026-12-31" }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
              captures: { t_id: $.data.id }
          assert:
            - "HTTP 201 and the envelope is { meta: { api_request_id, api_request_timestamp }, response_type: 'object', data: { ... } }"
            - "PermitTerm.${t_id}: status == DRAFT, tmdl_applicable == false, tmdl_pollutant == null, tmdl_wla_lb_per_year == null, eru_sqft == 3000, funding_target_cents == 0"
            - "PermitTerm.${t_id}: compliance_posture == COMPLIANT, behind_measure_count == 0, exceeding_outfall_count == 0, total_assessed_penalty_cents == 0, projected_annual_revenue_cents == 0, funding_adequacy_status == ADEQUATE"
            - "PermitTerm.${t_id}: activated_at == null, expired_at == null, last_compiled_at == null"
            - "PermitTerm.${t_id}: version == 1 and created_at == updated_at == 2026-08-01T00:00:00Z"

      - name: permit_term_retrieval_and_listing_report_pagination_metadata
        claim_type: listing
        grounds:
          - endpoints.GET /stormwater/permit-terms
          - endpoints.GET /stormwater/permit-terms/{id}
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three terms stored, GET /stormwater/permit-terms?limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset 2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "three DRAFT permit terms with distinct permit_number values, created in a fixed order"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2024-A", term_start_date: "2024-01-01", term_end_date: "2024-12-31" }
              as: StormwaterProgramManager
              captures: { t1_id: $.data.id }
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2025-A", term_start_date: "2025-01-01", term_end_date: "2025-12-31" }
              as: StormwaterProgramManager
              captures: { t2_id: $.data.id }
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31" }
              as: StormwaterProgramManager
              captures: { t3_id: $.data.id }
          trigger:
            - call: "GET /stormwater/permit-terms"
              payload: { limit: 2, offset: 0 }
              as: UtilityBillingClerk
            - call: "GET /stormwater/permit-terms"
              payload: { limit: 2, offset: 2 }
              as: UtilityBillingClerk
            - call: "GET /stormwater/permit-terms/${t2_id}"
              payload: {}
              as: UtilityBillingClerk
            - call: "GET /stormwater/permit-terms"
              payload: { status: "ACTIVE" }
              as: UtilityBillingClerk
          assert:
            - "call 1: response_type == 'array', 2 rows, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "call 2: 1 row, offset == 2, total_count == 3, has_more == false"
            - "call 3: data.id == ${t2_id} and permit_number == MS4-2025-A"
            - "call 4: 0 rows with total_count == 0, since all three terms are DRAFT"

      - name: path_ids_that_resolve_to_nothing_return_the_entity_specific_not_found
        claim_type: not_found
        grounds:
          - validations[priority=40]
          - errors.ERR_PERMIT_TERM_NOT_FOUND
          - errors.ERR_CONTROL_MEASURE_NOT_FOUND
          - errors.ERR_OUTFALL_NOT_FOUND
          - errors.ERR_OBSERVATION_NOT_FOUND
          - errors.ERR_CASE_NOT_FOUND
          - errors.ERR_CONSTRUCTION_SITE_NOT_FOUND
          - errors.ERR_FACILITY_NOT_FOUND
          - errors.ERR_INSPECTION_NOT_FOUND
          - errors.ERR_ENFORCEMENT_ACTION_NOT_FOUND
          - errors.ERR_ACCOUNT_NOT_FOUND
          - errors.ERR_CREDIT_APPLICATION_NOT_FOUND
          - errors.ERR_ANNUAL_REPORT_NOT_FOUND
        distinguishing_aspect: "Each read path returns the 404 code named for its own entity rather than a generic not-found, and the well-formed but unknown UUID is rejected at priority 40 before any body handling."
        test_recipe:
          setup:
            - "one DRAFT permit term exists so the database is not empty"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31" }
              as: StormwaterProgramManager
              captures: { t_id: $.data.id }
          trigger:
            - call: "GET /stormwater/permit-terms/{id}"
              payload: {}
              as: StormwaterProgramManager
              captures: { err: $.data.error_id }
            - call: "GET /stormwater/control-measures/{id}"
              payload: {}
              as: StormwaterProgramManager
            - call: "GET /stormwater/outfalls/{id}"
              payload: {}
              as: StormwaterProgramManager
            - call: "POST /stormwater/observations/{id}/validate"
              payload: { decision: "VALIDATE" }
              as: StormwaterProgramManager
            - call: "GET /stormwater/illicit-discharge-cases/{id}"
              payload: {}
              as: IDDEInvestigator
            - call: "GET /stormwater/construction-sites/{id}"
              payload: {}
              as: ConstructionInspector
            - call: "GET /stormwater/post-construction-facilities/{id}"
              payload: {}
              as: ConstructionInspector
            - call: "GET /stormwater/inspections/{id}"
              payload: {}
              as: ConstructionInspector
            - call: "GET /stormwater/enforcement-actions/{id}"
              payload: {}
              as: EnforcementOfficer
            - call: "GET /stormwater/accounts/{id}"
              payload: {}
              as: UtilityBillingClerk
            - call: "GET /stormwater/fee-credit-applications/{id}"
              payload: {}
              as: UtilityBillingClerk
            - call: "GET /stormwater/annual-reports/{id}"
              payload: {}
              as: StormwaterProgramManager
          assert:
            - "every call uses the literal path id 00000000-0000-0000-0000-000000000000, which exists in no table"
            - "the twelve responses are HTTP 404 with error_id ERR_PERMIT_TERM_NOT_FOUND, ERR_CONTROL_MEASURE_NOT_FOUND, ERR_OUTFALL_NOT_FOUND, ERR_OBSERVATION_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_CONSTRUCTION_SITE_NOT_FOUND, ERR_FACILITY_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_ENFORCEMENT_ACTION_NOT_FOUND, ERR_ACCOUNT_NOT_FOUND, ERR_CREDIT_APPLICATION_NOT_FOUND and ERR_ANNUAL_REPORT_NOT_FOUND in that order"
            - "each error body is { error_id, message } inside data with response_type 'error'"
            - "PermitTerm.${t_id} is untouched: version == 1"

      - name: body_foreign_keys_that_resolve_to_nothing_return_not_found_at_priority_50
        claim_type: parent_relationships
        grounds:
          - validations[priority=50]
          - entities.ControlMeasure.fields.permit_term_id
          - entities.PostConstructionFacility.fields.construction_site_id
          - entities.FeeCreditApplication.fields.stormwater_account_id
          - entities.AnnualReport.fields.permit_term_id
          - complexity_profile.entity_topology
        distinguishing_aspect: "In a flat topology every foreign key supplied in the body is dereferenced before business rules run, so a bogus permit_term_id, construction_site_id, stormwater_account_id or illicit_discharge_case_id yields that entity's 404 and creates no row."
        test_recipe:
          setup:
            - "one DRAFT permit term plus one real StormwaterAccount, so that valid sibling ids and a live version exist and only the FK under test is bogus"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31" }
              as: StormwaterProgramManager
              captures: { t_id: $.data.id }
            - call: "POST /stormwater/accounts"
              payload: { permit_term_id: "${t_id}", parcel_id: "P-1000", owner_name: "Ada Owner", parcel_class: "COMMERCIAL", impervious_area_sqft: 9020 }
              as: UtilityBillingClerk
              captures: { acct_id: $.data.id, acct_ver: $.data.version }
          trigger:
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "00000000-0000-0000-0000-000000000000", measure_code: "PUBLIC_EDUCATION", measurable_goal_target: 12 }
              as: StormwaterProgramManager
              captures: { err: $.data.error_id }
            - call: "POST /stormwater/post-construction-facilities"
              payload: { construction_site_id: "00000000-0000-0000-0000-000000000000", facility_type: "BIORETENTION", ownership: "PRIVATE", design_capacity_cf: 4000, service_area_acres: 1.00 }
              as: ConstructionInspector
            - call: "POST /stormwater/fee-credit-applications"
              payload: { stormwater_account_id: "00000000-0000-0000-0000-000000000000", requested_credit_pct: 0.1000, bmp_description: "Rain garden", expected_stormwater_account_version: "${acct_ver}" }
              as: UtilityBillingClerk
            - call: "POST /stormwater/enforcement-actions"
              payload: { action_type: "NOTICE_OF_VIOLATION", violation_days: 0, illicit_discharge_case_id: "00000000-0000-0000-0000-000000000000" }
              as: EnforcementOfficer
            - call: "POST /stormwater/annual-reports"
              payload: { permit_term_id: "00000000-0000-0000-0000-000000000000", reporting_period_start: "2026-01-01", reporting_period_end: "2026-12-31" }
              as: StormwaterProgramManager
          assert:
            - "the five responses are HTTP 404 with error_id ERR_PERMIT_TERM_NOT_FOUND, ERR_CONSTRUCTION_SITE_NOT_FOUND, ERR_ACCOUNT_NOT_FOUND, ERR_CASE_NOT_FOUND and ERR_PERMIT_TERM_NOT_FOUND"
            - "the fee-credit call carries the CURRENT version of a real account, so it fails at priority 50 on the missing account id and never reaches the priority 60 concurrency check"
            - "GET /stormwater/permit-terms/${t_id}/control-measures returns total_count 0 and GET /stormwater/permit-terms/${t_id}/annual-reports returns total_count 0: no partial rows were written"

      - name: missing_required_body_fields_are_rejected_before_any_lookup
        claim_type: required_fields
        grounds:
          - validations[priority=30]
          - errors.ERR_VALIDATION
          - endpoints.POST /stormwater/permit-terms
          - endpoints.POST /stormwater/outfalls
          - endpoints.POST /stormwater/construction-sites
        distinguishing_aspect: "Omitting term_end_date, priority_tier or disturbed_acres returns ERR_VALIDATION with HTTP 400 and writes nothing, even when every other field including the foreign key is valid."
        test_recipe:
          setup:
            - "one DRAFT permit term so the foreign keys in the payloads below are valid"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31" }
              as: StormwaterProgramManager
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2027-A", term_start_date: "2027-01-01" }
              as: StormwaterProgramManager
              captures: { err: $.data.error_id }
            - call: "POST /stormwater/outfalls"
              payload: { permit_term_id: "${t_id}", outfall_code: "OF-91", receiving_water: "Mill Creek", drainage_area_acres: 12.00, baseline_concentration_mg_per_l: 0.20, design_runoff_kl: 8000 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/construction-sites"
              payload: { permit_term_id: "${t_id}", site_name: "SITE-NULL", operator_name: "Nullworks" }
              as: ConstructionInspector
          assert:
            - "all three responses are HTTP 400 with error_id ERR_VALIDATION"
            - "call 1 names the missing term_end_date, call 2 the missing priority_tier, call 3 the missing disturbed_acres in data.message"
            - "GET /stormwater/permit-terms returns total_count 1: MS4-2027-A was not created"
            - "GET /stormwater/permit-terms/${t_id}/outfalls and GET /stormwater/permit-terms/${t_id}/construction-sites both return total_count 0"

      - name: enum_and_range_constraints_are_enforced_on_input_fields
        claim_type: type_constraints
        grounds:
          - validations[priority=30]
          - entities.Outfall.fields.priority_tier
          - entities.ControlMeasure.fields.weight
          - entities.ConstructionSite.fields.disturbed_acres
          - entities.PermitTerm.fields.eru_sqft
          - errors.ERR_VALIDATION
        distinguishing_aspect: "priority_tier URGENT is not a declared enum member, weight 6 is above the 1..5 range, disturbed_acres 0.50 is below the 1.00 floor and eru_sqft 50 is below the 100 floor — all four are ERR_VALIDATION, not domain errors."
        test_recipe:
          setup:
            - "one DRAFT permit term to own the rejected children"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31" }
              as: StormwaterProgramManager
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /stormwater/outfalls"
              payload: { permit_term_id: "${t_id}", outfall_code: "OF-92", receiving_water: "Mill Creek", drainage_area_acres: 12.00, priority_tier: "URGENT", baseline_concentration_mg_per_l: 0.20, design_runoff_kl: 8000 }
              as: StormwaterProgramManager
              captures: { err: $.data.error_id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${t_id}", measure_code: "PUBLIC_EDUCATION", measurable_goal_target: 12, weight: 6 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/construction-sites"
              payload: { permit_term_id: "${t_id}", site_name: "SITE-TINY", operator_name: "Tinyworks", disturbed_acres: 0.50 }
              as: ConstructionInspector
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2028-A", term_start_date: "2028-01-01", term_end_date: "2028-12-31", eru_sqft: 50 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2029-A", term_start_date: "01-01-2029", term_end_date: "2029-12-31" }
              as: StormwaterProgramManager
          assert:
            - "all five responses are HTTP 400 with error_id ERR_VALIDATION"
            - "the enum rejection lists the declared members HIGH, MEDIUM and LOW; the weight rejection names the 1..5 range; the acreage rejection names the 1.00 minimum; the eru_sqft rejection names the 100 minimum; the date rejection names ISO 8601"
            - "GET /stormwater/permit-terms/${t_id}/outfalls, .../control-measures and .../construction-sites all return total_count 0"

      - name: system_and_computed_fields_ignore_extra_field_input
        claim_type: system_fields
        grounds:
          - entities.Outfall.fields.status
          - entities.Outfall.fields.screening_status
          - entities.Outfall.fields.screening_count
          - entities.ConstructionSite.fields.plan_status
          - entities.ConstructionSite.fields.field_status
        distinguishing_aspect: "A create payload that also carries status, screening_status, screening_count, id, version and created_at is accepted, and every one of those server-owned values is derived rather than taken from the request."
        test_recipe:
          setup:
            - "one DRAFT permit term"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31" }
              as: StormwaterProgramManager
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /stormwater/outfalls"
              payload: { permit_term_id: "${t_id}", outfall_code: "OF-93", receiving_water: "Mill Creek", drainage_area_acres: 12.00, priority_tier: "LOW", baseline_concentration_mg_per_l: 0.20, design_runoff_kl: 8000, status: "RETIRED", screening_status: "SUSPECT", screening_count: 99, id: "11111111-1111-1111-1111-111111111111", version: 42 }
              as: StormwaterProgramManager
              captures: { of_id: $.data.id }
            - call: "POST /stormwater/construction-sites"
              payload: { permit_term_id: "${t_id}", site_name: "SITE-J", operator_name: "Juniper Civil", disturbed_acres: 2.50, plan_status: "APPROVED", field_status: "ACTIVE_DISTURBANCE", stop_work_count: 7 }
              as: ConstructionInspector
              captures: { site_j_id: $.data.id }
          assert:
            - "Outfall.${of_id}: status == ACTIVE, screening_status == NOT_SCREENED, screening_count == 0, tmdl_status == NOT_ASSESSED, version == 1, and id != 11111111-1111-1111-1111-111111111111"
            - "ConstructionSite.${site_j_id}: plan_status == SUBMITTED, field_status == PRE_CONSTRUCTION, stop_work_count == 0, plan_review_round == 0, open_deficiency_score == 0"
            - "ConstructionSite.${site_j_id}.post_construction_control_required == true, computed from disturbed_acres 2.50 >= 2.00 and not supplied by the client"
            - "both rows carry server-minted created_at and updated_at equal to the logical clock"

      - name: observation_creation_stamps_the_recorder_and_derives_the_sample_load
        claim_type: computed_fields
        grounds:
          - entities.OutfallObservation.fields.recorded_by_user_id
          - entities.OutfallObservation.fields.validation_status
          - entities.OutfallObservation.fields.sample_load_lb
          - entities.OutfallObservation.fields.screening_result
          - calculations.outfall_annual_pollutant_load
        distinguishing_aspect: "A WET_WEATHER_SAMPLE of 0.45 mg/L over 40000 kL stores sample_load_lb 39.6832 with validation_status PENDING and screening_result null, while a DRY_WEATHER_SCREENING on the same outfall stores validation_status NOT_APPLICABLE with sample_load_lb null."
        test_recipe:
          setup:
            - "ACTIVE permit term with all six control measures and outfall OF-01"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31", tmdl_applicable: false, eru_sqft: 3000, funding_target_cents: 25000 }
              as: StormwaterProgramManager
              captures: { term_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "PUBLIC_EDUCATION", measurable_goal_target: 12, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "ILLICIT_DISCHARGE", measurable_goal_target: 20, weight: 3 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "CONSTRUCTION_RUNOFF", measurable_goal_target: 30, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "POST_CONSTRUCTION", measurable_goal_target: 8, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MUNICIPAL_OPERATIONS", measurable_goal_target: 20, weight: 1, salt_storage_covered: true, fleet_wash_recycle: true }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MONITORING", measurable_goal_target: 4, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/outfalls"
              payload: { permit_term_id: "${term_id}", outfall_code: "OF-01", receiving_water: "Mill Creek", drainage_area_acres: 45.00, priority_tier: "HIGH", baseline_concentration_mg_per_l: 0.45, design_runoff_kl: 20000, sweeping_capacity_lane_miles_per_month: 40.00 }
              as: StormwaterProgramManager
              captures: { of1_id: $.data.id }
            - call: "POST /stormwater/permit-terms/${term_id}/activate"
              payload: {}
              as: StormwaterProgramManager
          trigger:
            - call: "POST /stormwater/outfalls/${of1_id}/observations"
              payload: { observation_type: "WET_WEATHER_SAMPLE", observed_at: "2026-07-20T09:00:00Z", pollutant_concentration_mg_per_l: 0.45, runoff_volume_kl: 40000, field_notes: "First flush grab sample" }
              as: MunicipalOperationsSupervisor
              as_user_id: "ops-01"
              captures: { samp_id: $.data.id }
            - call: "POST /stormwater/outfalls/${of1_id}/observations"
              payload: { observation_type: "DRY_WEATHER_SCREENING", observed_at: "2026-07-25T09:00:00Z", dry_weather_flow_present: false }
              as: IDDEInvestigator
              as_user_id: "idde-01"
              captures: { scr_id: $.data.id }
          assert:
            - "OutfallObservation.${samp_id}: recorded_by_user_id == ops-01, validation_status == PENDING, sample_load_lb == 39.6832 (0.45 * 40000 * 0.00220462 at 4 decimals), screening_result == null, validated_at == null"
            - "OutfallObservation.${scr_id}: recorded_by_user_id == idde-01, validation_status == NOT_APPLICABLE, screening_result == CLEAR, sample_load_lb == null"
            - "Outfall.${of1_id}: screening_count == 1, last_screened_at == 2026-07-25T09:00:00Z, screening_status == CLEAR, open_case_count == 0"
            - "Outfall.${of1_id}: last_assessed_gross_load_lb == 0.00 and tmdl_status == NOT_ASSESSED, because recording a sample is not an assessment"

      - name: sub_resource_reads_return_only_the_children_of_the_named_parent
        claim_type: parent_relationships
        grounds:
          - endpoints.GET /stormwater/permit-terms/{id}/control-measures
          - endpoints.GET /stormwater/permit-terms/{id}/outfalls
          - endpoints.GET /stormwater/permit-terms/{id}/accounts
          - endpoints.GET /stormwater/construction-sites/{id}/post-construction-facilities
          - complexity_profile.entity_topology
        distinguishing_aspect: "With two terms each owning one measure, one outfall and one account, every sub-resource read returns exactly the one child of the requested parent and never the sibling term's row."
        test_recipe:
          setup:
            - "two DRAFT permit terms, each with one ControlMeasure, one Outfall and one StormwaterAccount"
            - "one construction site under term A carrying one PostConstructionFacility"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31" }
              as: StormwaterProgramManager
              captures: { ta_id: $.data.id }
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2027-B", term_start_date: "2027-01-01", term_end_date: "2027-12-31" }
              as: StormwaterProgramManager
              captures: { tb_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${ta_id}", measure_code: "PUBLIC_EDUCATION", measurable_goal_target: 12 }
              as: StormwaterProgramManager
              captures: { ma_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${tb_id}", measure_code: "PUBLIC_EDUCATION", measurable_goal_target: 15 }
              as: StormwaterProgramManager
              captures: { mb_id: $.data.id }
            - call: "POST /stormwater/outfalls"
              payload: { permit_term_id: "${ta_id}", outfall_code: "OF-01", receiving_water: "Mill Creek", drainage_area_acres: 45.00, priority_tier: "HIGH", baseline_concentration_mg_per_l: 0.45, design_runoff_kl: 20000 }
              as: StormwaterProgramManager
              captures: { ofa_id: $.data.id }
            - call: "POST /stormwater/outfalls"
