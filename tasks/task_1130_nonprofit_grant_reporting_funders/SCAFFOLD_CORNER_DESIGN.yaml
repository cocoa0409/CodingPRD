            - { call: "POST /reports/${r1}/accept", payload: {}, as: Funder, as_user_id: "${f1}" }
          trigger:
            - { call: "GET /grants/${g1}/summary", payload: {}, as: GrantsOfficer, captures: { te: $.data.total_expended_cents, pool: $.data.indirect_pool_cents, bt: $.data.burn_trailing_cents, bc: $.data.burn_cumulative_cents, pr: $.data.pacing_ratio, mv: $.data.match_verified_only_cents } }
