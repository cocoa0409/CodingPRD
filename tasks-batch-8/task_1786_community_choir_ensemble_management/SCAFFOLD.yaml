# =============================================================================
# Community Choir & Ensemble Management — benchmark seed tables (harder-than-expert)
# =============================================================================

scenario: |
  Community Choir & Ensemble Management (community chorus): membership audition & voice-part balance, dues & scholarship policy, rehearsal attendance requirement & performance eligibility, music library checkout & return, concert venue booking & program planning, volunteer committee & fundraising, guest musician contracting, tour/festival participation & travel logistics

domain_name: community-choir-ensemble
api_prefix: /v1

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: quota_allocation
  complexity_layers: [optimistic_concurrency, cascading_side_effects, rate_threshold_triggers, dual_variant_calculation]
  entity_topology: flat
  state_machine_shape: posture_driven
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (20 entities)
# =============================================================================
entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Season display name" }
      - { name: base_dues_cents, type: integer, source: input, description: "Base season dues before discounts" }
      - { name: early_bird_pct, type: number, source: input, description: "Early-bird discount fraction (e.g. 0.10)" }
      - { name: early_bird_cutoff, type: datetime, source: input, description: "Payments received at or before this instant keep the early-bird discount" }
      - { name: dues_due_date, type: datetime, source: input, description: "Invoices with positive balance become OVERDUE after this instant" }
      - { name: late_fee_weekly_cents, type: integer, source: input, description: "Late fee added per full week overdue" }
      - { name: late_fee_cap_cents, type: integer, source: input, description: "Maximum accrued late fee per invoice" }
      - { name: scholarship_pool_cents, type: integer, source: input, description: "Initial scholarship fund for the season" }
      - { name: audition_slot_minutes, type: integer, source: input, default: 30, description: "Fixed audition slot length; two non-cancelled auditions in the same season must start at least this many minutes apart" }
      - { name: attendance_threshold, type: number, source: input, default: 0.75, description: "Minimum attendance_rate for performance eligibility (inclusive)" }
      - { name: posture, type: enum, source: system, description: "DRAFT | OPEN | REHEARSING | CONCERT_LOCK | ARCHIVED" }
      - { name: ops_week_index, type: integer, source: system, default: 0, description: "Checkpoint epoch counter, bumped by POST /v1/seasons/{id}/checkpoint" }
      - { name: pool_available_cents, type: integer, source: computed, description: "Scholarship funds not reserved or spent" }
      - { name: pool_reserved_cents, type: integer, source: computed, description: "Scholarship funds reserved by APPROVED (not yet APPLIED) grants" }
      - { name: pool_spent_cents, type: integer, source: computed, description: "Scholarship funds consumed by APPLIED grants" }
      - { name: treasury_balance_cents, type: integer, source: computed, description: "Cash ledger per treasury_balance calculation" }

  - name: Section
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: voice_part, type: enum, source: input, description: "SOPRANO | ALTO | TENOR | BASS; unique per season" }
      - { name: target_min, type: integer, source: input, description: "Minimum singers required for season to enter REHEARSING" }
      - { name: target_max, type: integer, source: input, description: "Maximum singers; audition ACCEPT blocked at this count" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED" }
      - { name: active_count, type: integer, source: computed, description: "Members in this section with status ENROLLED | ACTIVE | PROBATION" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: email, type: string, source: input, description: "Member email; unique per season" }
      - { name: section_id, type: string, source: system, description: "FK -> Section.id; nullable; set on audition ACCEPT" }
      - { name: status, type: enum, source: system, description: "APPLICANT | AUDITION_SCHEDULED | AUDITIONED | ENROLLED | ACTIVE | PROBATION | SUSPENDED | WAITLISTED | REJECTED | DROPPED | RESIGNED" }
      - { name: enrolled_at, type: datetime, source: system, description: "Logical clock time when member first reached ENROLLED; nullable" }
      - { name: attendance_rate, type: number, source: computed, default: 1.0, description: "Weighted attendance over counted rehearsals; 1.0 when no counted rehearsals" }
      - { name: performance_eligible, type: boolean, source: computed, description: "status == ACTIVE AND attendance_rate >= season.attendance_threshold AND dues_balance_cents == 0" }
      - { name: dues_balance_cents, type: integer, source: computed, description: "Sum of balance_cents over the member's non-terminal invoices" }
      - { name: ledger_balance_cents, type: integer, source: computed, description: "Outstanding charges (library fines, lost-score charges); positive = member owes" }

  - name: Audition
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: scheduled_at, type: datetime, source: input, description: "Audition start instant (logical clock domain)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: tone_score, type: integer, source: input, description: "0-10, set by score endpoint" }
      - { name: pitch_score, type: integer, source: input, description: "0-10, set by score endpoint" }
      - { name: sight_score, type: integer, source: input, description: "0-10, set by score endpoint" }
      - { name: composite_score, type: number, source: computed, description: "Weighted composite per audition_composite_score" }
      - { name: decision, type: enum, source: system, default: NONE, description: "NONE | ACCEPTED | WAITLISTED | REJECTED" }

  - name: DuesInvoice
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: season_id, type: string, source: system, description: "FK -> Season.id; copied from member" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock time at issuance" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Provisional variant of dues_invoice_amount at issuance" }
      - { name: final_amount_cents, type: integer, source: computed, description: "Final variant of dues_invoice_amount; revealed on first payment or scholarship application" }
      - { name: scholarship_applied_cents, type: integer, source: system, default: 0, description: "Scholarship funds applied to this invoice" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Sum of POSTED payment allocations to this invoice" }
      - { name: late_fee_cents, type: integer, source: computed, default: 0, description: "Accrued late fee per late_fee_accrual" }
      - { name: balance_cents, type: integer, source: computed, description: "final_amount_cents - scholarship_applied_cents - paid_cents + late_fee_cents" }
      - { name: status, type: enum, source: system, description: "ISSUED | PARTIAL | PAID | WAIVED | OVERDUE" }

  - name: DuesPayment
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: amount_cents, type: integer, source: input, description: "Total cash received; allocated by payment_waterfall" }
      - { name: method, type: enum, source: input, description: "CASH | CHECK | CARD" }
      - { name: allocations, type: array, source: system, description: "List of {invoice_id, amount_cents} produced by waterfall; references DuesInvoice ids (see payment_waterfall)" }
      - { name: status, type: enum, source: system, description: "POSTED | REFUNDED" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock time of payment; drives early-bird determination" }

  - name: ScholarshipGrant
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: season_id, type: string, source: system, description: "FK -> Season.id; copied from member" }
      - { name: requested_cents, type: integer, source: input, description: "Amount requested by the member" }
      - { name: need_note, type: string, source: input, description: "Free-form need statement" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | APPLIED | REVOKED" }
      - { name: approved_cents, type: integer, source: system, description: "Amount reserved at approval (min of requested and pool_available)" }
      - { name: invoice_id, type: string, source: system, description: "FK -> DuesInvoice.id; nullable; set on apply" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of Treasurer who decided" }

  - name: Rehearsal
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: scheduled_at, type: datetime, source: input, description: "Rehearsal start instant" }
      - { name: location, type: string, source: input, description: "Free-form location" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: AttendanceRecord
    parent: null
    common_fields: true
    fields:
      - { name: rehearsal_id, type: string, source: system, description: "FK -> Rehearsal.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: status, type: enum, source: input, description: "PRESENT | LATE | ABSENT_UNEXCUSED | ABSENT_EXCUSED" }
      - { name: excused_by_user_id, type: string, source: system, description: "Director user who excused; nullable" }

  - name: MusicScore
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Score title" }
      - { name: composer, type: string, source: input, description: "Composer" }
      - { name: copy_count, type: integer, source: input, description: "Total physical copies owned" }
      - { name: copies_available, type: integer, source: computed, description: "copy_count - open checkouts - copies_lost" }
      - { name: copies_lost, type: integer, source: system, default: 0, description: "Copies written off via LOST checkouts" }
      - { name: replacement_cost_cents, type: integer, source: input, description: "Charged to member ledger when a copy is lost" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: ScoreCheckout
    parent: null
    common_fields: true
    fields:
      - { name: score_id, type: string, source: input, description: "FK -> MusicScore.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: checked_out_at, type: datetime, source: system, description: "Logical clock time of checkout" }
      - { name: due_date, type: datetime, source: input, description: "Due back instant" }
      - { name: returned_at, type: datetime, source: system, description: "Nullable; set on return" }
      - { name: status, type: enum, source: system, description: "CHECKED_OUT | OVERDUE | RETURNED | LOST" }
      - { name: fine_cents, type: integer, source: computed, default: 0, description: "Accrued overdue fine per checkout_fine_accrual" }
      - { name: charge_cents, type: integer, source: system, default: 0, description: "Replacement charge posted when LOST" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Venue name" }
      - { name: capacity, type: integer, source: input, description: "Maximum audience" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED" }

  - name: Concert
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: title, type: string, source: input, description: "Concert title" }
      - { name: expected_attendance, type: integer, source: input, description: "Expected audience size; must fit venue capacity" }
      - { name: status, type: enum, source: system, description: "PLANNING | VENUE_BOOKED | PROGRAM_LOCKED | READY | PERFORMED | CANCELLED" }
      - { name: program_duration_seconds, type: integer, source: computed, default: 0, description: "Sum of duration_seconds over CONFIRMED program pieces" }

  - name: VenueBooking
    parent: null
    common_fields: true
    fields:
      - { name: concert_id, type: string, source: input, description: "FK -> Concert.id" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: start_at, type: datetime, source: input, description: "Half-open interval start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Half-open interval end (exclusive); adjacency permitted" }
      - { name: deposit_cents, type: integer, source: input, description: "Deposit debited from treasury on confirm, refunded on release" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | DECLINED | RELEASED | CANCELLED" }

  - name: ProgramPiece
    parent: null
    common_fields: true
    fields:
      - { name: concert_id, type: string, source: system, description: "FK -> Concert.id" }
      - { name: title, type: string, source: input, description: "Piece title" }
      - { name: duration_seconds, type: integer, source: input, description: "Piece duration" }
      - { name: sequence_no, type: integer, source: input, description: "Running order; unique per concert among non-VOID pieces" }
      - { name: featured_member_ids, type: array, source: input, description: "Member ids featured on this piece; each must be performance_eligible at confirm" }
      - { name: guest_contract_id, type: string, source: input, description: "FK -> GuestContract.id; nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | CONFIRMED | VOID" }

  - name: GuestContract
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: concert_id, type: string, source: input, description: "FK -> Concert.id; nullable" }
      - { name: musician_name, type: string, source: input, description: "Guest musician name" }
      - { name: service_lines, type: array, source: input, description: "List of {kind: REHEARSAL | CONCERT | MASTERCLASS, units: number, rate_cents: integer}" }
      - { name: travel_stipend_cents, type: integer, source: input, default: 0, description: "Flat travel stipend added after per-line rounding" }
      - { name: quoted_fee_cents, type: integer, source: computed, description: "Per guest_fee_quote (round per line, then sum)" }
      - { name: cancellation_fee_cents, type: integer, source: computed, default: 0, description: "20% of quoted_fee_cents when cancelled after ACCEPTED" }
      - { name: counter_count, type: integer, source: system, default: 0, description: "Number of counter-offer cycles" }
      - { name: status, type: enum, source: system, description: "DRAFT | OFFERED | COUNTERED | ACCEPTED | DECLINED | APPROVED | PAID | CANCELLED" }
      - { name: approved_by_user_id, type: string, source: system, description: "President user who approved; nullable" }
      - { name: paid_by_user_id, type: string, source: system, description: "Treasurer user who paid; nullable" }

  - name: TourTrip
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: name, type: string, source: input, description: "Tour or festival name" }
      - { name: destination, type: string, source: input, description: "Destination" }
      - { name: departure_at, type: datetime, source: input, description: "Departure instant; refund schedule anchored here" }
      - { name: return_at, type: datetime, source: input, description: "Return instant" }
      - { name: seat_count, type: integer, source: input, description: "Total travel seats" }
      - { name: min_seats, type: integer, source: input, description: "Minimum confirmed seats used for provisional share" }
      - { name: transport_lodging_cost_cents, type: integer, source: input, description: "Total tour cost to split across confirmed seats" }
      - { name: provisional_share_cents, type: integer, source: computed, description: "round_half_up(transport_lodging_cost_cents / min_seats)" }
      - { name: final_share_cents, type: integer, source: computed, description: "round_half_up(transport_lodging_cost_cents / confirmed_count) at roster lock; null before lock" }
      - { name: confirmed_count, type: integer, source: computed, default: 0, description: "Registrations in CONFIRMED status" }
      - { name: status, type: enum, source: system, description: "PLANNING | REGISTRATION_OPEN | ROSTER_LOCKED | COMPLETED | CANCELLED" }

  - name: TourRegistration
    parent: null
    common_fields: true
    fields:
      - { name: tour_id, type: string, source: input, description: "FK -> TourTrip.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; taken from X-User-ID of Member caller" }
      - { name: status, type: enum, source: system, description: "REGISTERED | CONFIRMED | WAITLISTED | CANCELLED | REFUNDED" }
      - { name: deposit_paid_cents, type: integer, source: system, default: 0, description: "Deposit posted at confirm (equals tour provisional_share_cents)" }
      - { name: share_charge_cents, type: integer, source: system, description: "Final per-seat charge set at roster lock; null before" }
      - { name: refund_cents, type: integer, source: computed, default: 0, description: "Refund per tour_refund_schedule" }

  - name: Committee
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: name, type: string, source: input, description: "Committee name" }
      - { name: chair_member_id, type: string, source: input, description: "FK -> Member.id; chair must be ACTIVE at activation" }
      - { name: fundraising_goal_cents, type: integer, source: input, description: "Goal amount" }
      - { name: raised_cents, type: integer, source: computed, default: 0, description: "Sum of FULFILLED pledge amounts" }
      - { name: status, type: enum, source: system, description: "FORMING | ACTIVE | DISSOLVED" }

  - name: FundraiserPledge
    parent: null
    common_fields: true
    fields:
      - { name: committee_id, type: string, source: input, description: "FK -> Committee.id" }
      - { name: donor_name, type: string, source: input, description: "Donor display name" }
      - { name: amount_cents, type: integer, source: input, description: "Pledged amount" }
      - { name: status, type: enum, source: system, description: "PLEDGED | FULFILLED | CANCELLED | REFUNDED" }
      - { name: recognition_tier, type: enum, source: computed, description: "BRONZE | SILVER | GOLD per recognition_tier calculation" }
      - { name: recorded_by_user_id, type: string, source: system, description: "Treasurer user who recorded the pledge" }
      - { name: fulfilled_by_user_id, type: string, source: system, description: "Treasurer user who fulfilled; must differ from recorded_by_user_id" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Season
    field: posture
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /v1/seasons/{id}/posture (posture=OPEN)"
        actor: President
        preconditions: []
        side_effects: ["increments Season.version by 1"]
      - from: OPEN
        to: REHEARSING
        trigger: "POST /v1/seasons/{id}/posture (posture=REHEARSING)"
        actor: President
        preconditions:
          - "Every Section of this season with status OPEN satisfies target_min <= active_count <= target_max (else ERR_SECTION_UNBALANCED)"
          - "No Audition of this season is in SCHEDULED status (else ERR_AUDITIONS_PENDING)"
        side_effects: ["increments Season.version by 1"]
      - from: REHEARSING
        to: CONCERT_LOCK
        trigger: "POST /v1/seasons/{id}/posture (posture=CONCERT_LOCK)"
        actor: President
        preconditions: []
        side_effects: ["increments Season.version by 1"]
      - from: CONCERT_LOCK
        to: ARCHIVED
        trigger: "POST /v1/seasons/{id}/posture (posture=ARCHIVED)"
        actor: President
        preconditions:
          - "All Concerts of this season are in PERFORMED or CANCELLED (else ERR_CONCERTS_OPEN)"
        side_effects: ["increments Season.version by 1"]
      - from: DRAFT
        to: ARCHIVED
        trigger: "POST /v1/seasons/{id}/posture (posture=ARCHIVED)"
        actor: President
        preconditions: []
        side_effects: ["increments Season.version by 1"]

  - entity: Section
    field: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "PATCH /v1/sections/{id} (status=CLOSED)"
        actor: ChoirDirector
        preconditions: []
        side_effects: ["CLOSED sections are skipped by the OPEN->REHEARSING balance gate and reject audition ACCEPT (ERR_SECTION_CLOSED)"]
      - from: CLOSED
        to: OPEN
        trigger: "PATCH /v1/sections/{id} (status=OPEN)"
        actor: ChoirDirector
        preconditions: []
        side_effects: []

  - entity: Member
    field: status
    initial_state: APPLICANT
    terminal_states: [REJECTED, DROPPED, RESIGNED]
    transitions:
      - from: APPLICANT
        to: AUDITION_SCHEDULED
        trigger: "POST /v1/auditions"
        actor: ChoirDirector
        preconditions: ["Season posture is OPEN", "Audition slot does not violate the buffered-slot overlap rule (ERR_AUDITION_OVERLAP)"]
        side_effects: ["Audition created in SCHEDULED"]
      - from: AUDITION_SCHEDULED
        to: APPLICANT
        trigger: "POST /v1/auditions/{id}/cancel"
        actor: ChoirDirector
        preconditions: []
        side_effects: ["Audition -> CANCELLED"]
      - from: AUDITION_SCHEDULED
        to: AUDITIONED
        trigger: "POST /v1/auditions/{id}/score"
        actor: ChoirDirector
        preconditions: []
        side_effects: ["Audition -> COMPLETED; composite_score computed"]
      - from: AUDITION_SCHEDULED
        to: APPLICANT
        trigger: "system (checkpoint: audition scheduled_at < now and still SCHEDULED)"
        actor: system
        preconditions: []
        side_effects: ["Audition -> NO_SHOW"]
      - from: AUDITIONED
        to: ENROLLED
        trigger: "POST /v1/auditions/{id}/decision (decision=ACCEPT)"
        actor: ChoirDirector
        preconditions:
          - "composite_score >= 7.0 (ERR_SCORE_BELOW_THRESHOLD)"
          - "Target section status OPEN (ERR_SECTION_CLOSED) and active_count < target_max (ERR_SECTION_FULL)"
        side_effects:
          - "member.section_id set; enrolled_at = clock now; audition.decision = ACCEPTED"
          - "section.active_count recomputed"
      - from: AUDITIONED
        to: WAITLISTED
        trigger: "POST /v1/auditions/{id}/decision (decision=WAITLIST)"
        actor: ChoirDirector
        preconditions: ["composite_score >= 7.0 (ERR_SCORE_BELOW_THRESHOLD)"]
        side_effects: ["audition.decision = WAITLISTED"]
      - from: AUDITIONED
        to: REJECTED
        trigger: "POST /v1/auditions/{id}/decision (decision=REJECT)"
        actor: ChoirDirector
        preconditions: []
        side_effects: ["audition.decision = REJECTED"]
      - from: WAITLISTED
        to: ENROLLED
        trigger: "system (checkpoint: waitlist promotion)"
        actor: system
        preconditions: ["An OPEN section exists with active_count < target_max"]
        side_effects:
          - "Selector: WAITLISTED members ranked by composite_score DESC, tie-break audition created_at ASC; member assigned to the section with the largest (target_max - active_count) gap, tie-break section created_at ASC"
          - "member.section_id set; enrolled_at = clock now"
      - from: WAITLISTED
        to: REJECTED
        trigger: "POST /v1/members/{id}/status (action=DROP)"
        actor: ChoirDirector
        preconditions: []
        side_effects: []
      - from: ENROLLED
        to: ACTIVE
        trigger: "system (bubble-up: a DuesInvoice for this member reaches PAID or WAIVED)"
        actor: system
        preconditions: ["Member has at least one DuesInvoice and dues_balance_cents == 0"]
        side_effects: ["performance_eligible recomputed"]
      - from: ACTIVE
        to: PROBATION
        trigger: "system (checkpoint: attendance sweep)"
        actor: system
        preconditions: ["attendance_rate < season.attendance_threshold"]
        side_effects: ["performance_eligible recomputed"]
      - from: PROBATION
        to: ACTIVE
        trigger: "system (checkpoint: attendance sweep)"
        actor: system
        preconditions: ["attendance_rate >= season.attendance_threshold AND dues_balance_cents == 0"]
        side_effects: ["performance_eligible recomputed"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (checkpoint: invoice OVERDUE sweep) or POST /v1/members/{id}/status (action=SUSPEND)"
        actor: "system | ChoirDirector"
        preconditions: ["System path: member has an OVERDUE invoice"]
        side_effects: ["performance_eligible recomputed"]
      - from: PROBATION
        to: SUSPENDED
        trigger: "system (checkpoint: invoice OVERDUE sweep) or POST /v1/members/{id}/status (action=SUSPEND)"
        actor: "system | ChoirDirector"
        preconditions: ["System path: member has an OVERDUE invoice"]
        side_effects: ["performance_eligible recomputed"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (bubble-up: all OVERDUE invoices cured) or POST /v1/members/{id}/status (action=REINSTATE)"
        actor: "system | ChoirDirector"
        preconditions: ["dues_balance_cents == 0", "attendance_rate >= season.attendance_threshold"]
        side_effects: ["performance_eligible recomputed"]
      - from: ENROLLED
        to: DROPPED
        trigger: "POST /v1/members/{id}/status (action=DROP)"
        actor: ChoirDirector
        preconditions: []
        side_effects: ["member-drop cascade (see ScoreCheckout and TourRegistration)"]
      - from: ACTIVE
        to: DROPPED
        trigger: "POST /v1/members/{id}/status (action=DROP)"
        actor: ChoirDirector
        preconditions: []
        side_effects: ["member-drop cascade (see ScoreCheckout and TourRegistration)"]
      - from: PROBATION
        to: DROPPED
        trigger: "POST /v1/members/{id}/status (action=DROP)"
        actor: ChoirDirector
        preconditions: []
        side_effects: ["member-drop cascade (see ScoreCheckout and TourRegistration)"]
      - from: SUSPENDED
        to: DROPPED
        trigger: "POST /v1/members/{id}/status (action=DROP)"
        actor: ChoirDirector
        preconditions: []
        side_effects: ["member-drop cascade (see ScoreCheckout and TourRegistration)"]
      - from: ENROLLED
        to: RESIGNED
        trigger: "POST /v1/members/{id}/resign"
        actor: "Member (self) | ChoirDirector"
        preconditions: []
        side_effects: ["Same cascades as DROP"]
      - from: ACTIVE
        to: RESIGNED
        trigger: "POST /v1/members/{id}/resign"
        actor: "Member (self) | ChoirDirector"
        preconditions: []
        side_effects: ["Same cascades as DROP"]
      - from: PROBATION
        to: RESIGNED
        trigger: "POST /v1/members/{id}/resign"
        actor: "Member (self) | ChoirDirector"
        preconditions: []
        side_effects: ["Same cascades as DROP"]
      - from: SUSPENDED
        to: RESIGNED
        trigger: "POST /v1/members/{id}/resign"
        actor: "Member (self) | ChoirDirector"
        preconditions: []
        side_effects: ["Same cascades as DROP"]

  - entity: Audition
