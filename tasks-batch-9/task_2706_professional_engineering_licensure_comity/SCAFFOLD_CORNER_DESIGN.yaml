  - section: calculations
    instances:
      - name: application_fee_standard_two_records_totals_30000
        claim_type: correct_result
        grounds:
          - calculations.application_fee_assessment
          - endpoints[GET /applications/{application_id}/fee-assessment]
        distinguishing_aspect: "A STANDARD_EXAM application with two experience records, no expedite and no matched NCEES packet assesses base_fee 25000 + records_fee 5000 = pre_credit_total 30000 with comity_credit_tier_pct 0.00, so assessment_total_cents is exactly 30000."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Fay Olund' holds a DRAFT STANDARD_EXAM application (expedite_requested false, ncees_record_status NOT_REQUESTED) with two non-overlapping experience records."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Fay Olund", email: "fay.olund@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_fay: $.data.id }
            - call: "POST /applications"
              payload: { engineer_id: "${eng_fay}", pathway: "STANDARD_EXAM", exam_code: "PE_ELECTRICAL", degree_level: "BS", expedite_requested: false }
              as: Applicant
              as_user_id: "${eng_fay}"
              captures: { app_fay: $.data.id }
            - call: "POST /applications/${app_fay}/experience-records"
              payload: { employer_name: "Olund Power", position_title: "Engineer I", period_start_month: "2019-01", period_end_month: "2020-12", responsibility_level: "SUBORDINATE", post_degree: true }
              as: Applicant
              as_user_id: "${eng_fay}"
            - call: "POST /applications/${app_fay}/experience-records"
              payload: { employer_name: "Olund Power", position_title: "Engineer III", period_start_month: "2021-01", period_end_month: "2022-12", responsibility_level: "RESPONSIBLE_CHARGE", post_degree: true }
              as: Applicant
              as_user_id: "${eng_fay}"
          trigger:
            - call: "GET /applications/${app_fay}/fee-assessment"
              payload: {}
              as: Applicant
              as_user_id: "${eng_fay}"
          assert:
            - "trigger[0] http_status == 200"
            - "trigger[0] response.data.base_fee_cents == 25000"
            - "trigger[0] response.data.records_verification_fee_cents == 5000"
            - "trigger[0] response.data.ncees_record_fee_cents == 0"
            - "trigger[0] response.data.expedite_surcharge_cents == 0"
            - "trigger[0] response.data.pre_credit_total_cents == 30000"
            - "trigger[0] response.data.comity_credit_tier_pct == 0.00"
            - "trigger[0] response.data.comity_credit_cents == 0"
            - "trigger[0] response.data.assessment_total_cents == 30000"
            - "Application.${app_fay}.fee_assessment_cents == 30000"

      - name: audit_verified_total_counts_only_accepted_documentation
        claim_type: input_set_filtering
        grounds:
          - calculations.cpc_pdh_valuation
          - calculations.cpc_pdh_valuation.variants.audit_verified
          - endpoints[POST /pdh-records/{pdh_record_id}/documentation-review]
        distinguishing_aspect: "Under variant audit_verified only documentation_status == ACCEPTED rows enter the input set: after accepting the 28.0-hour line audit_verified_total_pdh is 28.0, and rejecting the 2.0-hour ethics line leaves it at 28.0 while self_certified_total_pdh stays 30.0 throughout."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Yuri Falk' holds an ACTIVE STANDARD licence issued 2026-01-15 (pdh_requirement 30, current_period_end 2028-01-15)."
            - "His CPCReport for that period carries a 28.0-hour COURSE and a 2.0-hour ethics COURSE, both documentation_status NONE, and has been ACCEPTED then drawn into audit cycle '2028-FILTER' (sample_pct 1.0) so it sits UNDER_AUDIT with audit_verified_total_pdh 0.0."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Yuri Falk", email: "yuri.falk@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_yuri: $.data.id }
            - call: "POST /licenses"
              payload: { engineer_id: "${eng_yuri}", license_type: "STANDARD", issued_on: "2026-01-15T00:00:00Z" }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
              captures: { lic_yuri: $.data.id, lic_yuri_ver: $.data.version }
            - call: "POST /cpc-reports"
              payload: { license_id: "${lic_yuri}", period_start: "2026-01-15T00:00:00Z", period_end: "2028-01-15T00:00:00Z", self_certified_pdh: 30, carryover_pdh_claimed: 0, expected_license_version: "${lic_yuri_ver}" }
              as: Licensee
              as_user_id: "${eng_yuri}"
              captures: { rep_yuri: $.data.id }
            - call: "POST /cpc-reports/${rep_yuri}/pdh-records"
              payload: { activity_type: "COURSE", pdh_hours: 28.0, completed_on: "2026-09-01T00:00:00Z", ethics_flag: false }
              as: Licensee
              as_user_id: "${eng_yuri}"
              captures: { pdh_yuri_main: $.data.id }
            - call: "POST /cpc-reports/${rep_yuri}/pdh-records"
              payload: { activity_type: "COURSE", pdh_hours: 2.0, completed_on: "2026-10-01T00:00:00Z", ethics_flag: true }
              as: Licensee
              as_user_id: "${eng_yuri}"
              captures: { pdh_yuri_ethics: $.data.id }
            - call: "POST /cpc-reports/${rep_yuri}/accept"
              payload: {}
              as: BoardReviewer
              as_user_id: "REV-1"
            - call: "POST /cpc-audits"
              payload: { audit_cycle_label: "2028-FILTER", sample_pct: 1.0, as_of_period_end: "2028-01-15T00:00:00Z" }
              as: BoardSecretary
              as_user_id: "SEC-9"
          trigger:
            - call: "POST /pdh-records/${pdh_yuri_main}/documentation-review"
              payload: { decision: "ACCEPT" }
              as: BoardReviewer
              as_user_id: "REV-4"
            - call: "POST /pdh-records/${pdh_yuri_ethics}/documentation-review"
              payload: { decision: "REJECT" }
              as: BoardReviewer
              as_user_id: "REV-4"
          assert:
            - "trigger[0] response.data.documentation_status == \"ACCEPTED\""
            - "after trigger[0], CPCReport.${rep_yuri}.audit_verified_total_pdh == 28.0"
            - "trigger[1] response.data.documentation_status == \"REJECTED\""
            - "after trigger[1], CPCReport.${rep_yuri}.audit_verified_total_pdh == 28.0"
            - "CPCReport.${rep_yuri}.self_certified_total_pdh == 30.0"
            - "CPCReport.${rep_yuri}.status == \"UNDER_AUDIT\""

      - name: pdh_self_study_cap_eight_applied_under_self_certification
        claim_type: constants_applied
        grounds:
          - calculations.cpc_pdh_valuation.constants.CAP_SELF_STUDY_SELF_CERTIFIED
          - calculations.cpc_pdh_valuation.constants.ETHICS_REQUIRED_PDH
          - entities.License.fields.pdh_requirement
        distinguishing_aspect: "12.0 claimed SELF_STUDY hours are trimmed to the CAP_SELF_STUDY_SELF_CERTIFIED constant 8, so self_certified_total_pdh is 28.0 and shortfall_pdh is the additive 4.0 (2.0 hour deficit against the 30 requirement plus the full 2.0 ETHICS_REQUIRED_PDH deficit)."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Bea Kollen' holds an ACTIVE STANDARD licence issued 2026-01-15 with the default pdh_requirement 30."
            - "Her SUBMITTED CPCReport for 2026-01-15..2028-01-15 has no PDH records yet and carryover_pdh_claimed 0."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Bea Kollen", email: "bea.kollen@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_bea: $.data.id }
            - call: "POST /licenses"
              payload: { engineer_id: "${eng_bea}", license_type: "STANDARD", issued_on: "2026-01-15T00:00:00Z" }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
              captures: { lic_bea: $.data.id, lic_bea_ver: $.data.version }
            - call: "POST /cpc-reports"
              payload: { license_id: "${lic_bea}", period_start: "2026-01-15T00:00:00Z", period_end: "2028-01-15T00:00:00Z", self_certified_pdh: 28, carryover_pdh_claimed: 0, expected_license_version: "${lic_bea_ver}" }
              as: Licensee
              as_user_id: "${eng_bea}"
              captures: { rep_bea: $.data.id }
          trigger:
            - call: "POST /cpc-reports/${rep_bea}/pdh-records"
              payload: { activity_type: "SELF_STUDY", pdh_hours: 12.0, completed_on: "2026-11-01T00:00:00Z", ethics_flag: false }
              as: Licensee
              as_user_id: "${eng_bea}"
            - call: "POST /cpc-reports/${rep_bea}/pdh-records"
              payload: { activity_type: "COURSE", pdh_hours: 20.0, completed_on: "2027-02-01T00:00:00Z", ethics_flag: false }
              as: Licensee
              as_user_id: "${eng_bea}"
          assert:
            - "after trigger[0], CPCReport.${rep_bea}.self_certified_total_pdh == 8.0"
            - "after trigger[1], CPCReport.${rep_bea}.self_certified_total_pdh == 28.0"
            - "after trigger[1], CPCReport.${rep_bea}.shortfall_pdh == 4.0"
            - "License.${lic_bea}.pdh_requirement == 30"

      - name: pdh_total_holds_one_decimal_without_float_drift
        claim_type: precision
        grounds:
          - calculations.cpc_pdh_valuation.precision
          - entities.PDHRecord.fields.pdh_hours
        distinguishing_aspect: "Three 10.1-hour activities sum to exactly 30.3 after round_half_up to one decimal place — not 30.299999999999997 and not 30.0 — and shortfall_pdh is exactly 0.0 because the ethics hours are present."
