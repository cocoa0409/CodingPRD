  # ===========================================================================
  # RULE 4 - transitive_cascade
  # Instance 1: depth 5, triggered by a Project milestone advance.
  # Instance 2: depth 3, triggered by a RiskEvent committee acceptance -
  #             a completely different transition on a different entity.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: milestone_advance_five_hop_cascade_to_effective_and_security_release
        grounds:
          - state_machines.Project.INTERCONNECTION_APPROVED_to_NTP_ISSUED
          - state_machines.ConditionPrecedent.PENDING_to_SATISFIED
          - state_machines.Deal.EXECUTED_to_EFFECTIVE
          - state_machines.CreditSupportInstrument.POSTED_to_RELEASED
          - calculations.cp_completion_pct
          - endpoints.POST_/ppa/projects/{id}/advance-milestone
        distinguishing_aspect: |
          Depth 5 from a single request, and the trigger is a PROJECT milestone
          advance - an entity the deal does not even own. Hop 2 fires only because
          hop 1 changed Project.status, hop 3 only because hop 2 satisfied the last
          condition, hop 4 only because hop 3 made the deal EFFECTIVE, and hop 5
          only because hop 4 released the instrument. The instrument is released
          without any call to /ppa/credit-support/{id}/release, which is the proof
          the last two hops are cascade effects rather than direct writes.
        test_recipe:
          setup:
            - "Buyer NW (A, 2.5, CDP_AND_TCFD, EBITDA 60000000.00, registry account WREGIS-ACC-00417) is QUALIFIED with unsecured_credit_limit_usd 3000000.00, so no REGISTRY_ACCOUNT condition is templated."
            - "Project KJ1 (SOLAR, 100.000 MW) has already been advanced twice, to PERMITTED and then INTERCONNECTION_APPROVED, while no deal existed - so those two advances cascaded onto nothing."
            - "Deal D (25.000 MW, VIRTUAL_CFD, base 42.50, escalation 2.0, first_delivery_year 2027, AS_GENERATED, SHARED, commercial_operation_deadline 2029-12-31T00:00:00Z) prices at 44.10 with expected_annual_mwh 61320.00, exposure_usd 2704212.00 and credit_support_required_usd 0.00 because the buyer's unsecured limit covers it."
            - "One LETTER_OF_CREDIT of purpose DEVELOPMENT_SECURITY, face 500000.00, issuer_rating A (haircut 0.00, eligible 500000.00) has been POSTED voluntarily, so Deal.posted_credit_support_usd is 500000.00 and released_credit_support_usd is 0.00."
            - "The deal has been executed, and because the project was already INTERCONNECTION_APPROVED the CP template yields exactly ONE condition, NOTICE_TO_PROCEED, so cp_total_count is 1 and cp_completion_pct is 0.00 with Deal.status EXECUTED."
            - "Logical clock is the 2026-08-01T00:00:00Z startup default throughout."
