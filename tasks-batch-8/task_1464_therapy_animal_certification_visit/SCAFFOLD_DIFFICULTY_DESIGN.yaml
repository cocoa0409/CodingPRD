      - name: evaluation_composite_boundary
        grounds:
          - calculations.evaluation_composite
          - state_machines.Evaluation.SCHEDULED_to_FAILED
          - state_machines.Evaluation.FAILED_to_APPEALED
        distinguishing_aspect: |
          Metric = composite score points, endpoint = POST
          /v1/evaluations/{id}/score: 70/70 yields composite 70.0 which passes
          both section floors but fails composite >= 75.0 (FAILED); on the
          retake (attempt 2) the bar rises to >= 80.0 and 80/80 yields exactly
          80.0 which PASSES at equality.
        test_recipe:
          setup:
            - "Handler h ACTIVE; team t FORMING; evaluation e1 REQUESTED; evaluator ev ACTIVE specializing in DOG"
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H B2", email: "hb2@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h: $.data.id } }
