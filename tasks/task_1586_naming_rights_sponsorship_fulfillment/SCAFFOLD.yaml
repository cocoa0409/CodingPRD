# =============================================================================
# Scaffold: Naming Rights & Sponsorship Fulfillment (venue sponsorship dept)
# =============================================================================

scenario: |
  Naming Rights & Sponsorship Fulfillment (venue sponsorship department): asset
  inventory (signage/digital/hospitality) & valuation, contract term, escalator &
  category exclusivity, activation plan & fulfillment evidence collection,
  make-good for missed elements, measurement/valuation report to sponsor,
  renewal & upsell pipeline, conflict between team/venue/league rights,
  payment schedule & receivable.

domain_name: naming-rights-sponsorship
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing      # category exclusivity grants + suite bookings occupy intervals on scarce resources
  secondary_archetype: ledger_reconciliation # installment schedule vs invoices vs payments vs make-good credits
  complexity_layers:
    - rate_threshold_triggers        # make-good multiplier tiers at 0.90 / 0.70 fulfillment; paid-in-full equality
    - derived_field_reconciliation   # contract receivable_cents / make_good_outstanding_cents recomputed from children
    - cascading_side_effects         # sponsor BLOCKED -> contract TERMINATED -> deliverable CANCELLED -> evidence VOIDED
    - optimistic_concurrency         # OCC on Contract.version (countersign) and RenewalOpportunity.version (counter)
  entity_topology: flat              # peer collections joined by FK references; no nested URL ownership
  state_machine_shape: cyclic        # DRAFT<->PROPOSED revision loop; SUBMITTED->REJECTED->SUBMITTED resubmit loop; PROPOSED<->NEGOTIATING counter loop; plus contract_status x rights_status parallel dimensions
  relationship_patterns:
    - one_to_many                    # contract -> deliverables/invoices/credits/reports
    - cross_aggregate                # deliverable -> asset; grant -> rights window (conflict), credit -> invoice (redeem)
    - self_referential               # SponsorshipContract.renewed_from_contract_id -> SponsorshipContract.id
  role_model: segregation_of_duties  # evidence approver must differ from submitter (same-role 4-eyes); credit requester (Activation) != approver (Finance)
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (12 entities, flat topology)
# Seasons are integer years (e.g. 2026); the venue epoch advances via
# POST /venues/{id}/advance-season (ops-run checkpoint) — no wall-clock logic.
# =============================================================================
entities:
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Venue display name" }
      - { name: city, type: string, source: input, description: "Venue city" }
      - { name: current_season, type: integer, source: system, description: "Venue season epoch; starts at 2026, +1 per advance-season call", default: 2026 }

  - name: SponsorAccount
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Sponsor legal entity name" }
      - { name: display_name, type: string, source: input, description: "Sponsor brand display name" }
      - { name: industry_category, type: enum, source: input, description: "Sponsorship category; constraints: BEVERAGE | BANKING | AUTO | AIRLINE | TECH", constraints: "BEVERAGE | BANKING | AUTO | AIRLINE | TECH" }
      - { name: sponsor_status, type: enum, source: system, description: "PROSPECT | ACTIVE | SUSPENDED | BLOCKED", default: "PROSPECT" }

  - name: Asset
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; owning venue" }
      - { name: name, type: string, source: input, description: "Asset name (e.g. 'Bowl LED Ribbon', 'Suite 12')" }
      - { name: asset_class, type: enum, source: input, description: "Inventory class; constraints: SIGNAGE | DIGITAL | HOSPITALITY", constraints: "SIGNAGE | DIGITAL | HOSPITALITY" }
      - { name: rate_card_unit_cents, type: integer, source: input, description: "Rate-card value per contracted unit (provisional valuation basis)" }
      - { name: avg_impressions_per_unit, type: integer, source: input, description: "Audited average impressions per unit (final valuation basis)" }
      - { name: cpm_cents, type: integer, source: input, description: "Cost-per-thousand-impressions in cents (final valuation basis)" }
      - { name: asset_status, type: enum, source: system, description: "AVAILABLE | RETIRED", default: "AVAILABLE" }

  - name: RightsWindow
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; venue whose rights are reserved" }
      - { name: holder, type: enum, source: input, description: "Rights holder; constraints: TEAM | VENUE | LEAGUE", constraints: "TEAM | VENUE | LEAGUE" }
      - { name: category, type: enum, source: input, description: "Category reserved; constraints: BEVERAGE | BANKING | AUTO | AIRLINE | TECH", constraints: "BEVERAGE | BANKING | AUTO | AIRLINE | TECH" }
      - { name: first_season, type: integer, source: input, description: "First reserved season (inclusive)" }
      - { name: last_season, type: integer, source: input, description: "Last reserved season (inclusive)" }
      - { name: window_status, type: enum, source: system, description: "RESERVED | ACTIVE | RELEASED | EXPIRED", default: "RESERVED" }

  - name: SponsorshipContract
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; selling venue" }
      - { name: sponsor_id, type: string, source: input, description: "FK -> SponsorAccount.id; buying sponsor" }
      - { name: title, type: string, source: input, description: "Contract title (e.g. 'Stadium Naming Rights 2026-2028')" }
      - { name: term_first_season, type: integer, source: input, description: "First contract season (inclusive); must be >= venue.current_season at create" }
      - { name: term_last_season, type: integer, source: input, description: "Last contract season (inclusive); must be >= term_first_season" }
      - { name: base_fee_cents, type: integer, source: input, description: "Season-1 fee in cents before escalator" }
      - { name: escalator_pct, type: number, source: input, description: "Annual escalator as decimal (e.g. 0.03); >= 0" }
      - { name: escalator_mode, type: enum, source: input, description: "Escalator variant; constraints: COMPOUND | SIMPLE", constraints: "COMPOUND | SIMPLE" }
      - { name: renewed_from_contract_id, type: string, source: input, required: false, description: "FK -> SponsorshipContract.id; set when this contract renews a prior one (self-reference)", default: null }
      - { name: contract_status, type: enum, source: system, description: "DRAFT | PROPOSED | COUNTERSIGNED | ACTIVE | SUSPENDED | EXPIRED | TERMINATED", default: "DRAFT" }
      - { name: rights_status, type: enum, source: system, description: "Parallel dimension: CLEAR | CONTESTED (derived from its grants)", default: "CLEAR" }
      - { name: scheduled_total_cents, type: integer, source: computed, description: "Sum of season_fee_cents over term; computed at COUNTERSIGN, 0 before", default: 0 }
      - { name: receivable_cents, type: integer, source: computed, description: "Sum of (amount_cents - paid_cents - credits_applied_cents) over invoices with status IN {ISSUED, PARTIALLY_PAID, PAID, WRITTEN_OFF}", default: 0 }
      - { name: make_good_outstanding_cents, type: integer, source: computed, description: "Sum of approved_amount_cents over MakeGoodCredit of this contract with status APPROVED", default: 0 }

  - name: ExclusivityGrant
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> SponsorshipContract.id; owning contract" }
      - { name: category, type: enum, source: input, description: "Exclusive category; constraints: BEVERAGE | BANKING | AUTO | AIRLINE | TECH", constraints: "BEVERAGE | BANKING | AUTO | AIRLINE | TECH" }
      - { name: first_season, type: integer, source: input, description: "First exclusive season (inclusive); must be >= contract term_first_season" }
      - { name: last_season, type: integer, source: input, description: "Last exclusive season (inclusive); must be <= contract term_last_season" }
      - { name: grant_status, type: enum, source: system, description: "PENDING | ACTIVE | CONFLICTED | RELEASED", default: "PENDING" }

  - name: Deliverable
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> SponsorshipContract.id; owning contract" }
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; inventory asset delivering the element" }
      - { name: season, type: integer, source: input, description: "Season this element runs; must be within contract term and >= venue.current_season" }
      - { name: unit_kind, type: enum, source: input, description: "Element kind; constraints: GAME_DISPLAY | IMPRESSION_BLOCK | SUITE_NIGHT", constraints: "GAME_DISPLAY | IMPRESSION_BLOCK | SUITE_NIGHT" }
      - { name: contracted_units, type: integer, source: input, description: "Units owed to sponsor this season; > 0" }
      - { name: checkin_date, type: string, source: input, required: false, description: "ISO date; required iff unit_kind == SUITE_NIGHT", default: null }
      - { name: checkout_date, type: string, source: input, required: false, description: "ISO date; required iff unit_kind == SUITE_NIGHT; must be >= checkin_date", default: null }
      - { name: approved_units, type: integer, source: computed, description: "Sum of units_claimed over APPROVED evidence submissions", default: 0 }
      - { name: deliverable_status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | FULFILLED | MISSED | COMPED | CANCELLED", default: "SCHEDULED" }

  - name: EvidenceSubmission
    parent: null
    common_fields: true
    fields:
      - { name: deliverable_id, type: string, source: input, description: "FK -> Deliverable.id; element being evidenced" }
      - { name: units_claimed, type: integer, source: input, description: "Units this evidence proves; > 0" }
      - { name: evidence_uri, type: string, source: input, description: "URI of proof-of-performance artifact (photo log, broadcast affidavit)" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the submitting ActivationManager (SoD baseline)" }
      - { name: submission_status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | VOIDED", default: "SUBMITTED" }
      - { name: review_note, type: string, source: system, required: false, description: "Reviewer note set on APPROVE/REJECT", default: null }

  - name: MakeGoodCredit
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> SponsorshipContract.id; contract owing the make-good" }
      - { name: deliverable_id, type: string, source: input, description: "FK -> Deliverable.id; missed element being compensated" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Amount requested (auto-created credits use the make_good_credit formula); > 0" }
      - { name: approved_amount_cents, type: integer, source: system, required: false, description: "Amount approved by FinanceManager; <= computed cap", default: null }
      - { name: redeemed_against_invoice_id, type: string, source: system, required: false, description: "FK -> Invoice.id; invoice the credit was applied to on REDEEM", default: null }
      - { name: credit_status, type: enum, source: system, description: "REQUESTED | APPROVED | REDEEMED | DECLINED | VOIDED", default: "REQUESTED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> SponsorshipContract.id; billed contract (set at countersign generation)" }
      - { name: installment_seq, type: integer, source: system, description: "Installment order within contract schedule (1, 2, 3)" }
      - { name: installment_label, type: enum, source: system, description: "SIGNING | MID_SEASON | POST_SEASON" }
      - { name: amount_cents, type: integer, source: system, description: "Installment amount from installment_split calculation" }
      - { name: paid_cents, type: integer, source: computed, description: "Sum of amount_cents over payment sub-records with voided == false", default: 0 }
      - { name: credits_applied_cents, type: integer, source: computed, description: "Sum of approved_amount_cents redeemed against this invoice", default: 0 }
      - { name: invoice_status, type: enum, source: system, description: "DRAFT | ISSUED | PARTIALLY_PAID | PAID | VOID | WRITTEN_OFF", default: "DRAFT" }
      - { name: payments, type: array, source: system, description: "Append-only sub-records: { payment_id, amount_cents, method, external_ref, posted_at, voided }", default: [] }

  - name: ValuationReport
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> SponsorshipContract.id; reported contract" }
      - { name: season, type: integer, source: input, description: "Reported season; must be < venue.current_season and within contract term" }
      - { name: report_status, type: enum, source: system, description: "DRAFT | ISSUED | ACKNOWLEDGED", default: "DRAFT" }
      - { name: delivered_value_provisional_cents, type: integer, source: computed, description: "Rate-card provisional value: sum of approved_units x rate_card_unit_cents" }
      - { name: delivered_value_final_cents, type: integer, source: computed, description: "Audited media-value final: per-deliverable round(approved_units x avg_impressions_per_unit x cpm_cents / 1000), then summed" }
      - { name: fulfillment_pct, type: number, source: computed, description: "Sum(approved_units) / Sum(contracted_units) over the season's non-CANCELLED deliverables" }
      - { name: make_good_due_cents, type: integer, source: computed, description: "Sum of approved_amount_cents over credits (status APPROVED or REDEEMED) tied to this season's deliverables" }

  - name: RenewalOpportunity
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> SponsorshipContract.id; expiring/expired contract being renewed" }
      - { name: proposed_fee_cents, type: integer, source: input, description: "Proposed season-1 base fee for the renewal term; > 0" }
      - { name: stage, type: enum, source: system, description: "IDENTIFIED | PROPOSED | NEGOTIATING | WON | LOST", default: "IDENTIFIED" }
      - { name: resulting_contract_id, type: string, source: system, required: false, description: "FK -> SponsorshipContract.id; renewal contract created on MARK_WON", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SponsorAccount
    field: sponsor_status
    initial_state: PROSPECT
    terminal_states: [BLOCKED]
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /sponsors/{id}/transition (action=QUALIFY)"
        actor: SponsorshipSales
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /sponsors/{id}/transition (action=SUSPEND)"
        actor: SponsorshipSales
        preconditions: []
        side_effects:
          - "Each SponsorshipContract of this sponsor in ACTIVE -> SUSPENDED (cascade hop 1)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /sponsors/{id}/transition (action=REINSTATE)"
        actor: SponsorshipSales
        preconditions: []
        side_effects: []
        note: "Does NOT auto-reinstate contracts; each contract needs its own REINSTATE."
      - from: ACTIVE
        to: BLOCKED
        trigger: "POST /sponsors/{id}/transition (action=BLOCK)"
        actor: SponsorshipSales
        preconditions: []
        side_effects:
          - "Cascade hop 1: each SponsorshipContract of this sponsor in {COUNTERSIGNED, ACTIVE, SUSPENDED} -> TERMINATED"
          - "Cascade hop 2 (caused by hop 1): each Deliverable of a terminated contract in {SCHEDULED, IN_PROGRESS} -> CANCELLED; each ExclusivityGrant of a terminated contract in {PENDING, ACTIVE, CONFLICTED} -> RELEASED; each DRAFT Invoice of a terminated contract -> VOID; each MakeGoodCredit in {REQUESTED, APPROVED} -> VOIDED"
          - "Cascade hop 3 (caused by hop 2): each EvidenceSubmission of a cancelled deliverable in {SUBMITTED, REJECTED} -> VOIDED"
      - from: SUSPENDED
        to: BLOCKED
        trigger: "POST /sponsors/{id}/transition (action=BLOCK)"
        actor: SponsorshipSales
        preconditions: []
        side_effects:
          - "Same 3-hop cascade as ACTIVE -> BLOCKED"

  - entity: Asset
    field: asset_status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /assets/{id}/transition (action=RETIRE)"
        actor: VenueAdmin
        preconditions: []
        side_effects: []
        note: "Existing deliverables are unaffected; only new deliverable creation is blocked (ERR_ASSET_NOT_AVAILABLE)."
      - from: RETIRED
        to: AVAILABLE
        trigger: "POST /assets/{id}/transition (action=REINSTATE)"
        actor: VenueAdmin
        preconditions: []
        side_effects: []

  - entity: RightsWindow
    field: window_status
    initial_state: RESERVED
    terminal_states: [RELEASED, EXPIRED]
    transitions:
      - from: RESERVED
        to: ACTIVE
        trigger: "POST /rights-windows/{id}/transition (action=ACTIVATE)"
        actor: VenueAdmin
        preconditions: []
        side_effects:
          - "If holder == LEAGUE: each ExclusivityGrant with same venue_id+category, status ACTIVE, and overlapping seasons -> CONFLICTED (cascade hop 1)"
          - "Cascade hop 2 (caused by hop 1): each affected grant's contract rights_status -> CONTESTED"
        note: "League preemption: league activation succeeds and contests the venue's grants."
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /rights-windows/{id}/transition (action=RELEASE)"
        actor: VenueAdmin
        preconditions: []
        side_effects:
          - "Each ExclusivityGrant with same venue_id+category, status CONFLICTED, whose only blocking ACTIVE LEAGUE window is this one -> ACTIVE"
          - "Each such re-activated grant's contract: rights_status -> CLEAR if the contract then has zero CONFLICTED grants"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (advance-season: last_season < new current_season)"
        actor: system
        preconditions: []
        side_effects:
          - "Same CONFLICTED-grant re-evaluation as RELEASE"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /rights-windows/{id}/transition (action=RELEASE)"
        actor: VenueAdmin
        preconditions: []
        side_effects: []

  - entity: SponsorshipContract
    field: contract_status
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    note: "Parallel dimension rights_status (CLEAR | CONTESTED) evolves independently via RightsWindow cascades; CONTESTED blocks deliverable creation and invoice issue (ERR_CONTRACT_RIGHTS_CONTESTED) but not contract_status transitions."
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /contracts/{id}/transition (action=PROPOSE)"
        actor: SponsorshipSales
        preconditions:
          - "SponsorAccount.sponsor_status == ACTIVE (ERR_SPONSOR_NOT_ACTIVE)"
        side_effects: []
      - from: PROPOSED
        to: DRAFT
        trigger: "POST /contracts/{id}/transition (action=REVISE)"
        actor: SponsorshipSales
        preconditions: []
        side_effects: []
        note: "Revision loop: DRAFT <-> PROPOSED may cycle any number of times."
      - from: PROPOSED
        to: COUNTERSIGNED
        trigger: "POST /contracts/{id}/countersign"
        actor: SponsorContact
        preconditions:
          - "X-User-ID == contract.sponsor_id (ERR_FORBIDDEN)"
          - "expected_contract_version == contract.version (ERR_STALE_CONTRACT_VERSION, 412)"
        side_effects:
          - "scheduled_total_cents = contract_total_value_cents calculation result"
          - "installment_split runs: creates exactly 3 DRAFT Invoices (SIGNING seq 1, MID_SEASON seq 2, POST_SEASON seq 3)"
          - "increments SponsorshipContract.version by 1"
      - from: COUNTERSIGNED
        to: ACTIVE
        trigger: "POST /contracts/{id}/transition (action=ACTIVATE)"
        actor: SponsorshipSales
        preconditions:
          - "SponsorAccount.sponsor_status == ACTIVE (ERR_SPONSOR_NOT_ACTIVE)"
          - "No ExclusivityGrant of this contract in {PENDING, CONFLICTED} (ERR_INVALID_STATE)"
          - "venue.current_season <= term_last_season (ERR_SEASON_CLOSED)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (sponsor SUSPEND cascade) or POST /contracts/{id}/transition (action=SUSPEND)"
        actor: "system or SponsorshipSales"
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /contracts/{id}/transition (action=REINSTATE)"
        actor: SponsorshipSales
        preconditions:
          - "SponsorAccount.sponsor_status == ACTIVE (ERR_SPONSOR_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (advance-season: term_last_season < new current_season)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade hop 2: each ExclusivityGrant of this contract in {ACTIVE, CONFLICTED} -> RELEASED"
          - "Deliverables/invoices/credits are NOT touched by expiry (term completes naturally)"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (advance-season: term_last_season < new current_season)"
        actor: system
        preconditions: []
        side_effects:
          - "Same grant RELEASE cascade as ACTIVE -> EXPIRED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /contracts/{id}/transition (action=TERMINATE) or system (sponsor BLOCK cascade)"
        actor: "SponsorshipSales or system"
        preconditions: []
        side_effects:
          - "Cascade hop 2: each Deliverable in {SCHEDULED, IN_PROGRESS} -> CANCELLED; each ExclusivityGrant in {PENDING, ACTIVE, CONFLICTED} -> RELEASED; each DRAFT Invoice -> VOID; each MakeGoodCredit in {REQUESTED, APPROVED} -> VOIDED"
          - "Cascade hop 3: each EvidenceSubmission of a cancelled deliverable in {SUBMITTED, REJECTED} -> VOIDED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /contracts/{id}/transition (action=TERMINATE) or system (sponsor BLOCK cascade)"
        actor: "SponsorshipSales or system"
        preconditions: []
        side_effects:
          - "Same cascades as ACTIVE -> TERMINATED"
      - from: COUNTERSIGNED
        to: TERMINATED
        trigger: "system (sponsor BLOCK cascade only)"
        actor: system
        preconditions: []
        side_effects:
          - "Same cascades as ACTIVE -> TERMINATED (DRAFT invoices -> VOID)"

  - entity: ExclusivityGrant
    field: grant_status
    initial_state: PENDING
    terminal_states: [RELEASED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /exclusivity-grants/{id}/transition (action=ACTIVATE)"
        actor: VenueAdmin
        preconditions:
          - "Contract.contract_status == COUNTERSIGNED (ERR_INVALID_STATE)"
          - "No ACTIVE LEAGUE RightsWindow with same venue_id+category and overlapping seasons (ERR_RIGHTS_CONFLICT, business_safety p6)"
          - "No other ExclusivityGrant with same venue (via its contract), same category, status ACTIVE, overlapping seasons (ERR_CATEGORY_EXCLUSIVITY_CONFLICT, business_constraint p8)"
        side_effects: []
      - from: CONFLICTED
        to: ACTIVE
        trigger: "system (blocking LEAGUE RightsWindow RELEASED/EXPIRED) or POST /exclusivity-grants/{id}/transition (action=ACTIVATE)"
        actor: "system or VenueAdmin"
        preconditions:
          - "Manual path: same preconditions as PENDING -> ACTIVE except contract may be COUNTERSIGNED or ACTIVE"
        side_effects:
          - "Parent contract rights_status -> CLEAR if it then has zero CONFLICTED grants"
      - from: ACTIVE
        to: CONFLICTED
        trigger: "system (LEAGUE RightsWindow ACTIVATED with same venue_id+category and overlapping seasons)"
        actor: system
        preconditions: []
        side_effects:
          - "Parent contract rights_status -> CONTESTED"
      - from: PENDING
        to: RELEASED
        trigger: "system (contract TERMINATED/EXPIRED cascade) or POST /exclusivity-grants/{id}/transition (action=RELEASE)"
        actor: "system or VenueAdmin"
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RELEASED
        trigger: "system (contract TERMINATED/EXPIRED cascade) or POST /exclusivity-grants/{id}/transition (action=RELEASE)"
        actor: "system or VenueAdmin"
        preconditions: []
        side_effects:
          - "Parent contract rights_status unchanged (grant no longer counts as CONFLICTED source)"
      - from: CONFLICTED
        to: RELEASED
        trigger: "system (contract TERMINATED/EXPIRED cascade) or POST /exclusivity-grants/{id}/transition (action=RELEASE)"
        actor: "system or VenueAdmin"
        preconditions: []
        side_effects:
          - "Parent contract rights_status -> CLEAR if it then has zero CONFLICTED grants"

  - entity: Deliverable
    field: deliverable_status
    initial_state: SCHEDULED
    terminal_states: [FULFILLED, COMPED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system (advance-season makes venue.current_season == deliverable.season) or system at create (season == current_season)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: FULFILLED
        trigger: "system (evidence APPROVE makes approved_units >= contracted_units)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: MISSED
        trigger: "system (advance-season: deliverable.season < new current_season and approved_units < contracted_units)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade hop 2: auto-create MakeGoodCredit (contract_id, deliverable_id set; requested_amount_cents = make_good_credit formula; credit_status REQUESTED)"
      - from: IN_PROGRESS
        to: MISSED
        trigger: "system (advance-season: deliverable.season < new current_season and approved_units < contracted_units)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade hop 2: auto-create MakeGoodCredit (requested_amount_cents = make_good_credit formula; REQUESTED)"
      - from: MISSED
        to: COMPED
        trigger: "system (a MakeGoodCredit tied to this deliverable is REDEEMED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /deliverables/{id}/transition (action=CANCEL) or system (contract TERMINATED cascade)"
        actor: "ActivationManager or system"
        preconditions: []
        side_effects:
          - "Cascade hop: each EvidenceSubmission of this deliverable in {SUBMITTED, REJECTED} -> VOIDED"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /deliverables/{id}/transition (action=CANCEL) or system (contract TERMINATED cascade)"
        actor: "ActivationManager or system"
        preconditions: []
        side_effects:
          - "Cascade hop: each EvidenceSubmission of this deliverable in {SUBMITTED, REJECTED} -> VOIDED"

  - entity: EvidenceSubmission
    field: submission_status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /evidence-submissions/{id}/transition (action=APPROVE)"
        actor: ActivationManager
        preconditions:
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES, 403 — four-eyes)"
          - "Deliverable.deliverable_status == IN_PROGRESS (ERR_DELIVERABLE_NOT_OPEN, business_referential p9)"
          - "Contract of the deliverable has rights_status == CLEAR (ERR_CONTRACT_RIGHTS_CONTESTED, business_safety p6)"
          - "approved_units + units_claimed <= contracted_units (ERR_OVER_DELIVERY, business_constraint p8)"
        side_effects:
          - "Deliverable.approved_units += units_claimed; if approved_units == contracted_units, Deliverable -> FULFILLED"
          - "review_note set from input"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /evidence-submissions/{id}/transition (action=REJECT)"
        actor: ActivationManager
        preconditions:
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES, 403)"
        side_effects:
          - "review_note set from input"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /evidence-submissions/{id}/transition (action=RESUBMIT)"
        actor: ActivationManager
        preconditions:
          - "Deliverable.deliverable_status == IN_PROGRESS (ERR_DELIVERABLE_NOT_OPEN)"
        side_effects:
          - "evidence_uri replaced by input evidence_uri; submitted_by_user_id replaced by acting X-User-ID; review_note cleared"
        note: "Resubmit loop: SUBMITTED -> REJECTED -> SUBMITTED may cycle."
      - from: SUBMITTED
        to: VOIDED
        trigger: "system (deliverable CANCELLED or contract TERMINATED cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: VOIDED
        trigger: "system (deliverable CANCELLED or contract TERMINATED cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MakeGoodCredit
    field: credit_status
    initial_state: REQUESTED
    terminal_states: [REDEEMED, DECLINED, VOIDED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /make-good-credits/{id}/transition (action=APPROVE)"
        actor: FinanceManager
        preconditions:
          - "approved_amount_cents input present, > 0 (ERR_INVALID_AMOUNT)"
          - "approved_amount_cents <= make_good_credit cap for the linked deliverable (ERR_CREDIT_EXCEEDS_CAP, business_fiscal p10)"
        side_effects:
          - "approved_amount_cents set; Contract.make_good_outstanding_cents += approved_amount_cents"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /make-good-credits/{id}/transition (action=DECLINE)"
        actor: FinanceManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: REDEEMED
        trigger: "POST /make-good-credits/{id}/transition (action=REDEEM)"
        actor: FinanceManager
        preconditions:
          - "Selector — target invoice: invoices of credit.contract_id with invoice_status IN {ISSUED, PARTIALLY_PAID}; rank installment_seq ASC; tie-break created_at ASC; empty pool -> ERR_NO_PAYABLE_INVOICE (409)"
          - "approved_amount_cents <= target invoice remaining (amount_cents - paid_cents - credits_applied_cents) (ERR_CREDIT_EXCEEDS_INVOICE_BALANCE, 422)"
        side_effects:
          - "redeemed_against_invoice_id = target invoice id"
          - "Target invoice credits_applied_cents += approved_amount_cents; if invoice remaining hits 0 -> invoice PAID"
          - "Contract.make_good_outstanding_cents -= approved_amount_cents; Contract.receivable_cents recomputed"
          - "Linked Deliverable (deliverable_id) in MISSED -> COMPED"
      - from: REQUESTED
        to: VOIDED
        trigger: "system (contract TERMINATED cascade) or POST /make-good-credits/{id}/transition (action=VOID)"
        actor: "system or FinanceManager"
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: VOIDED
        trigger: "system (contract TERMINATED cascade) or POST /make-good-credits/{id}/transition (action=VOID)"
        actor: "system or FinanceManager"
        preconditions: []
        side_effects:
          - "Contract.make_good_outstanding_cents -= approved_amount_cents"

  - entity: Invoice
    field: invoice_status
    initial_state: DRAFT
    terminal_states: [PAID, VOID, WRITTEN_OFF]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/transition (action=ISSUE)"
        actor: FinanceManager
        preconditions:
          - "Contract.contract_status == ACTIVE (ERR_CONTRACT_NOT_ACTIVE, business_referential p9)"
          - "Contract.rights_status == CLEAR (ERR_CONTRACT_RIGHTS_CONTESTED, business_safety p6)"
        side_effects:
          - "Contract.receivable_cents recomputed"
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "system (payment posted or credit redeemed with 0 < paid_cents + credits_applied_cents < amount_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "Contract.receivable_cents recomputed"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "system (payment posted or credit redeemed making paid_cents + credits_applied_cents == amount_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "Contract.receivable_cents recomputed"
      - from: ISSUED
        to: PAID
        trigger: "system (single payment or credit redemption covers full remaining balance)"
        actor: system
        preconditions: []
        side_effects:
          - "Contract.receivable_cents recomputed"
      - from: PAID
        to: PARTIALLY_PAID
        trigger: "system (a payment is voided, leaving 0 < paid + credits < amount)"
        actor: system
        preconditions: []
        side_effects:
          - "Contract.receivable_cents recomputed"
      - from: PAID
        to: ISSUED
        trigger: "system (payments voided back to paid_cents == 0 and credits_applied_cents == 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Contract.receivable_cents recomputed"
      - from: PARTIALLY_PAID
        to: ISSUED
        trigger: "system (payments voided back to paid_cents == 0 and credits_applied_cents == 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Contract.receivable_cents recomputed"
      - from: DRAFT
        to: VOID
        trigger: "POST /invoices/{id}/transition (action=VOID) or system (contract TERMINATED cascade)"
        actor: "FinanceManager or system"
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: WRITTEN_OFF
        trigger: "POST /invoices/{id}/transition (action=WRITE_OFF)"
        actor: FinanceManager
        preconditions: []
        side_effects:
          - "Contract.receivable_cents recomputed (written-off balance remains in receivable per formula's status set)"
      - from: PARTIALLY_PAID
        to: WRITTEN_OFF
        trigger: "POST /invoices/{id}/transition (action=WRITE_OFF)"
        actor: FinanceManager
        preconditions: []
        side_effects:
          - "Contract.receivable_cents recomputed"

  - entity: ValuationReport
    field: report_status
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /valuation-reports/{id}/transition (action=ISSUE)"
        actor: ActivationManager
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /valuation-reports/{id}/transition (action=ACKNOWLEDGE)"
        actor: SponsorContact
        preconditions:
          - "X-User-ID == report contract's sponsor_id (ERR_FORBIDDEN)"
        side_effects: []

  - entity: RenewalOpportunity
    field: stage
    initial_state: IDENTIFIED
    terminal_states: [WON, LOST]
    transitions:
      - from: IDENTIFIED
        to: PROPOSED
        trigger: "POST /renewal-opportunities/{id}/transition (action=PROPOSE)"
        actor: SponsorshipSales
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: NEGOTIATING
        trigger: "POST /renewal-opportunities/{id}/transition (action=OPEN_NEGOTIATION)"
        actor: SponsorshipSales
        preconditions: []
        side_effects: []
      - from: NEGOTIATING
        to: PROPOSED
        trigger: "POST /renewal-opportunities/{id}/counter"
        actor: SponsorshipSales
        preconditions:
          - "expected_opportunity_version == opportunity.version (ERR_STALE_OPPORTUNITY_VERSION, 412)"
          - "proposed_fee_cents > 0 (ERR_INVALID_AMOUNT)"
        side_effects:
          - "proposed_fee_cents replaced by input"
          - "increments RenewalOpportunity.version by 1"
        note: "Counter loop: PROPOSED -> NEGOTIATING -> PROPOSED may cycle."
      - from: PROPOSED
        to: WON
        trigger: "POST /renewal-opportunities/{id}/transition (action=MARK_WON)"
        actor: SponsorshipSales
        preconditions: []
        side_effects:
          - "Creates renewal SponsorshipContract (DRAFT): venue_id/sponsor_id/escalator_pct/escalator_mode copied; term_first_season = source term_last_season + 1; term_last_season = source term_last_season + (source term length); base_fee_cents = proposed_fee_cents; renewed_from_contract_id = source contract id"
          - "resulting_contract_id set"
      - from: NEGOTIATING
        to: WON
        trigger: "POST /renewal-opportunities/{id}/transition (action=MARK_WON)"
        actor: SponsorshipSales
        preconditions: []
        side_effects:
          - "Same renewal-contract creation as PROPOSED -> WON"
      - from: IDENTIFIED
        to: LOST
        trigger: "POST /renewal-opportunities/{id}/transition (action=MARK_LOST)"
        actor: SponsorshipSales
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: LOST
        trigger: "POST /renewal-opportunities/{id}/transition (action=MARK_LOST)"
        actor: SponsorshipSales
        preconditions: []
        side_effects: []
      - from: NEGOTIATING
        to: LOST
        trigger: "POST /renewal-opportunities/{id}/transition (action=MARK_LOST)"
        actor: SponsorshipSales
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true OCC races only)
# =============================================================================
concurrency_rules:
  - rule_id: contract-countersign-stale-version
    parent_entity: SponsorshipContract
    write_endpoint: "POST /contracts/{id}/countersign"
    occ_field: "expected_contract_version"
    description: |
      Countersigning a contract whose version has advanced since the sponsor
      last observed it (e.g. a PATCH changed fee/escalator terms after the
      proposal was read) is rejected: the sponsor would be signing stale terms.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
  - rule_id: opportunity-counter-stale-version
    parent_entity: RenewalOpportunity
    write_endpoint: "POST /renewal-opportunities/{id}/counter"
    occ_field: "expected_opportunity_version"
    description: |
      Countering a renewal proposal whose version has advanced since the
      seller last observed it (e.g. another counter already rewrote
      proposed_fee_cents) is rejected: the new counter would be priced
      against stale terms.
    error_id: ERR_STALE_OPPORTUNITY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: season_fee_cents
    trigger: "contract_total_value_cents at COUNTERSIGN; make_good_credit cap at APPROVE"
    algorithm: tiered_pricing
    formula: |
      k = season - term_first_season   (0-based season index)
      COMPOUND variant: fee(season) = round_half_up(base_fee_cents * (1 + escalator_pct)^k)
      SIMPLE   variant: fee(season) = round_half_up(base_fee_cents * (1 + escalator_pct * k))
      Single rounding step at the end of each variant (no cumulative per-year rounding).
    input_set: "The contract's base_fee_cents, escalator_pct, escalator_mode, term_first_season; the target season"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: COMPOUND
        when: "contract.escalator_mode == COMPOUND"
        difference: "Escalator compounds on the prior year's fee: (1+pct)^k"
      - name: SIMPLE
        when: "contract.escalator_mode == SIMPLE"
        difference: "Escalator applies to base only: (1 + pct*k); produces a strictly smaller fee than COMPOUND for k >= 2 and pct > 0"

  - name: contract_total_value_cents
    trigger: "POST /contracts/{id}/countersign success"
    algorithm: aggregation
    formula: |
      scheduled_total_cents = sum over season in [term_first_season .. term_last_season] of season_fee_cents(season)
    input_set: "All seasons of the contract term, inclusive both ends"
    constants: {}
    precision: "integer cents (sum of already-rounded season fees)"

  - name: installment_split
    trigger: "POST /contracts/{id}/countersign success (after contract_total_value_cents)"
    algorithm: waterfall_allocation
    formula: |
      percents = [0.40, 0.30, 0.30] mapped to labels [SIGNING(seq 1), MID_SEASON(seq 2), POST_SEASON(seq 3)]
      PINNED ORDER (nested rounding, per-line then remainder absorption):
        amount_1 = round_half_up(scheduled_total_cents * 0.40)
        amount_2 = round_half_up(scheduled_total_cents * 0.30)
        amount_3 = scheduled_total_cents - amount_1 - amount_2   (last installment absorbs the rounding remainder)
      Note: round_half_up(total*0.40) + round_half_up(total*0.30) + round_half_up(total*0.30)
      can differ from total by +/-1 cent; the PINNED ORDER above, not per-line rounding
      of all three, is the contract.
    input_set: "scheduled_total_cents at countersign time"
    constants:
      SIGNING_PCT: 0.40
      MID_SEASON_PCT: 0.30
      POST_SEASON_PCT: 0.30
    precision: "integer cents, round_half_up per line in seq order; last line = remainder"

  - name: delivered_value
    trigger: "ValuationReport creation (POST /valuation-reports)"
    algorithm: aggregation
    formula: |
      Per deliverable d of the contract with d.season == report.season and
      d.deliverable_status != CANCELLED:
        provisional_d = d.approved_units * d.asset.rate_card_unit_cents
        final_d       = round_half_up(d.approved_units * d.asset.avg_impressions_per_unit * d.asset.cpm_cents / 1000)
      delivered_value_provisional_cents = sum(provisional_d)
      delivered_value_final_cents       = sum(final_d)   (per-deliverable rounding, then sum — pinned)
      fulfillment_pct = sum(d.approved_units) / sum(d.contracted_units)   (same input set; exact rational, 4 dp round_half_up)
      make_good_due_cents = sum(c.approved_amount_cents) over MakeGoodCredit c
        whose deliverable is in the input set and c.credit_status IN {APPROVED, REDEEMED}
    input_set: "Deliverables of the contract with season == report.season and status != CANCELLED; their assets; credits tied to those deliverables"
    constants: {}
    precision: "integer cents, round_half_up per deliverable line before summing"
    variants:
      - name: provisional
        when: "rate-card view (what the venue quoted)"
        difference: "Values delivery at rate_card_unit_cents per unit"
      - name: final
        when: "audited media-equivalency view (what the exposure was worth)"
        difference: "Values delivery at avg_impressions_per_unit x cpm_cents / 1000 per unit; for identical approved_units the two variants differ whenever impressions-based unit value != rate_card_unit_cents"

  - name: make_good_credit
    trigger: "auto-create of MakeGoodCredit when a deliverable flips to MISSED (advance-season); cap check at credit APPROVE"
    algorithm: threshold
    formula: |
      missed_units  = contracted_units - approved_units            (> 0 for MISSED deliverables)
      missed_value  = missed_units * asset.rate_card_unit_cents
      pct           = approved_units / contracted_units            (exact rational comparison)
      multiplier    = 1.00 if pct >= 0.90
                    = 1.25 if 0.70 <= pct < 0.90
                    = 1.50 if pct < 0.70
      credit        = round_half_up(missed_value * multiplier)
      cap           = season_fee_cents(deliverable.season)         (of the owning contract)
      make_good     = min(credit, cap)
      Auto-created credit: requested_amount_cents = make_good.
      APPROVE validation: approved_amount_cents <= make_good (else ERR_CREDIT_EXCEEDS_CAP).
      Tier boundaries are >= : pct exactly 0.90 uses 1.00; pct exactly 0.70 uses 1.25.
    input_set: "The MISSED deliverable, its asset, its contract's escalator terms"
    constants:
      TIER1_PCT: 0.90
      TIER1_MULT: 1.00
      TIER2_PCT: 0.70
      TIER2_MULT: 1.25
      TIER3_MULT: 1.50
    precision: "integer cents, round_half_up after multiplier"

  - name: receivable_cents
    trigger: "invoice ISSUE / payment post / payment void / credit REDEEM / invoice WRITE_OFF"
    algorithm: aggregation
    formula: |
      contract.receivable_cents = sum over invoices of the contract with
        invoice_status IN {ISSUED, PARTIALLY_PAID, PAID, WRITTEN_OFF}
        of (amount_cents - paid_cents - credits_applied_cents)
      DRAFT and VOID invoices contribute nothing.
    input_set: "All invoices of the contract in the listed statuses"
    constants: {}
    precision: "integer cents"

  - name: make_good_outstanding_cents
    trigger: "credit APPROVE / REDEEM / VOID-from-APPROVED"
    algorithm: aggregation
    formula: |
      contract.make_good_outstanding_cents = sum over MakeGoodCredit of the contract
        with credit_status == APPROVED of approved_amount_cents
    input_set: "Credits of the contract in APPROVED status only (REQUESTED/DECLINED/REDEEMED/VOIDED excluded)"
    constants: {}
    precision: "integer cents"

  - name: grant_season_overlap
    trigger: "ExclusivityGrant ACTIVATE; LEAGUE RightsWindow ACTIVATE contest sweep"
    algorithm: interval_merge
    formula: |
      Two season windows [a.first_season, a.last_season] and [b.first_season, b.last_season]
      (inclusive integer seasons) overlap iff:
        a.first_season <= b.last_season AND b.first_season <= a.last_season
      Back-to-back windows (b.first_season == a.last_season + 1) do NOT overlap.
      Applies to grant-vs-grant (same venue, same category, both ACTIVE) and
      grant-vs-league-window (same venue, same category, window ACTIVE, holder LEAGUE).
    input_set: "Grants/windows of the same venue and category in the relevant status sets"
    constants: {}
    precision: "integer season comparison"

  - name: suite_date_conflict
    trigger: "Deliverable create with unit_kind == SUITE_NIGHT"
    algorithm: interval_merge
    formula: |
      Each SUITE_NIGHT deliverable occupies [checkin_date, checkout_date] plus a
      1-day turnaround buffer after checkout: blocked span is [checkin, checkout + 1 day].
      A new SUITE_NIGHT deliverable d2 on the SAME asset conflicts with an existing one d1
      (d1.deliverable_status != CANCELLED) iff the buffered spans intersect:
        d2.checkin_date <= d1.checkout_date + 1 day  AND  d1.checkin_date <= d2.checkout_date + 1 day
      Boundary: d2.checkin == d1.checkout + 1 day CONFLICTS (buffer day);
      d2.checkin == d1.checkout + 2 days is ALLOWED.
      Requires checkin_date <= checkout_date else ERR_SEASON_WINDOW_INVALID.
    input_set: "Existing SUITE_NIGHT deliverables on the same asset with status != CANCELLED"
    constants:
      TURNAROUND_BUFFER_DAYS: 1
    precision: "ISO date arithmetic in whole days"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: request_shape
    check: "Request body well-formed: all required input fields present, no undeclared fields, enum values within declared constraint sets, integer/date fields parse"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Role permitted for endpoint; SponsorContact may only touch resources whose contract.sponsor_id == X-User-ID (countersign, report acknowledge, scoped reads)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; body FK references (venue_id, sponsor_id, contract_id, asset_id, deliverable_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "Target entity's own state machine permits the transition (wrong from-state, terminal-state lockdown, contract not COUNTERSIGNED for grant ACTIVATE, credit not REQUESTED for APPROVE/DECLINE, invoice not DRAFT for VOID, etc.)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition/countersign/counter endpoints"
  - priority: 6
    category: business_safety
    check: "Rights compliance: (a) grant ACTIVATE rejected when an ACTIVE LEAGUE RightsWindow overlaps same venue+category+seasons (ERR_RIGHTS_CONFLICT); (b) deliverable create / evidence APPROVE / invoice ISSUE rejected while contract.rights_status == CONTESTED (ERR_CONTRACT_RIGHTS_CONTESTED)"
    error_id: ERR_RIGHTS_CONFLICT
    http_status: 409
    applies_to: "POST /exclusivity-grants/{id}/transition (ACTIVATE); POST /deliverables; POST /evidence-submissions/{id}/transition (APPROVE); POST /invoices/{id}/transition (ISSUE)"
  - priority: 6
    category: business_safety
    check: "Contract rights contested gate for deliverable create / evidence approve / invoice issue"
    error_id: ERR_CONTRACT_RIGHTS_CONTESTED
    http_status: 409
    applies_to: "POST /deliverables; POST /evidence-submissions/{id}/transition (APPROVE); POST /invoices/{id}/transition (ISSUE)"
  - priority: 7
    category: business_temporal
    check: "Season/date window well-formed and placed: term_first_season >= venue.current_season and term_last_season >= term_first_season at contract create (ERR_SEASON_WINDOW_INVALID); checkin_date <= checkout_date for SUITE_NIGHT (ERR_SEASON_WINDOW_INVALID)"
    error_id: ERR_SEASON_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /contracts; POST /deliverables"
  - priority: 7
    category: business_temporal
    check: "Deliverable season within [term_first_season, term_last_season] (ERR_SEASON_OUT_OF_TERM) and >= venue.current_season (ERR_SEASON_CLOSED)"
    error_id: ERR_SEASON_OUT_OF_TERM
    http_status: 422
    applies_to: "POST /deliverables"
  - priority: 7
    category: business_temporal
    check: "Deliverable season must not already be closed (season < venue.current_season)"
    error_id: ERR_SEASON_CLOSED
    http_status: 422
    applies_to: "POST /deliverables; POST /contracts/{id}/transition (ACTIVATE)"
  - priority: 7
    category: business_temporal
    check: "Grant window inside contract term: first_season >= term_first_season and last_season <= term_last_season"
    error_id: ERR_GRANT_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /exclusivity-grants"
  - priority: 7
    category: business_temporal
    check: "Report season must be closed: season < venue.current_season"
    error_id: ERR_SEASON_NOT_CLOSED
    http_status: 422
    applies_to: "POST /valuation-reports"
  - priority: 8
    category: business_constraint
    check: "No other ACTIVE ExclusivityGrant with same venue (via contract), same category, overlapping seasons"
    error_id: ERR_CATEGORY_EXCLUSIVITY_CONFLICT
    http_status: 409
    applies_to: "POST /exclusivity-grants/{id}/transition (ACTIVATE)"
  - priority: 8
    category: business_constraint
    check: "No duplicate PENDING/ACTIVE grant with same contract + category"
    error_id: ERR_DUPLICATE_GRANT
    http_status: 409
    applies_to: "POST /exclusivity-grants"
  - priority: 8
    category: business_constraint
    check: "SUITE_NIGHT deliverable's buffered date span must not intersect another non-CANCELLED SUITE_NIGHT deliverable on the same asset (suite_date_conflict)"
    error_id: ERR_SUITE_DATE_CONFLICT
    http_status: 409
    applies_to: "POST /deliverables"
  - priority: 8
    category: business_constraint
    check: "Evidence approval must not push approved_units + units_claimed beyond contracted_units"
    error_id: ERR_OVER_DELIVERY
    http_status: 422
    applies_to: "POST /evidence-submissions/{id}/transition (APPROVE)"
  - priority: 8
    category: business_constraint
    check: "At most one open (IDENTIFIED/PROPOSED/NEGOTIATING) RenewalOpportunity per contract"
    error_id: ERR_DUPLICATE_OPEN_OPPORTUNITY
    http_status: 409
    applies_to: "POST /renewal-opportunities"
  - priority: 8
    category: business_constraint
    check: "Segregation of duties: evidence APPROVE/REJECT X-User-ID must differ from submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /evidence-submissions/{id}/transition (APPROVE, REJECT)"
  - priority: 9
    category: business_referential
    check: "Sponsor must be ACTIVE for contract create, PROPOSE, ACTIVATE, contract REINSTATE"
    error_id: ERR_SPONSOR_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /contracts; POST /contracts/{id}/transition (PROPOSE, ACTIVATE, REINSTATE)"
  - priority: 9
    category: business_referential
    check: "Asset must be AVAILABLE (not RETIRED) at deliverable create"
    error_id: ERR_ASSET_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /deliverables"
  - priority: 9
    category: business_referential
    check: "Contract must be ACTIVE for invoice ISSUE and deliverable create"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /invoices/{id}/transition (ISSUE); POST /deliverables"
  - priority: 9
    category: business_referential
    check: "Deliverable must be IN_PROGRESS for evidence create / APPROVE / RESUBMIT"
    error_id: ERR_DELIVERABLE_NOT_OPEN
    http_status: 409
    applies_to: "POST /evidence-submissions; POST /evidence-submissions/{id}/transition (APPROVE, RESUBMIT)"
  - priority: 9
    category: business_referential
    check: "Renewal source contract must be ACTIVE or EXPIRED"
    error_id: ERR_RENEWAL_CONTRACT_STATE
    http_status: 409
    applies_to: "POST /renewal-opportunities"
  - priority: 10
    category: business_fiscal
    check: "amounts must be positive integers (contracted_units, units_claimed, base_fee_cents, rate cards, proposed_fee_cents, requested/approved amounts, payment amount)"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "create endpoints; POST /invoices/{id}/payments; POST /make-good-credits/{id}/transition (APPROVE); POST /renewal-opportunities/{id}/counter"
  - priority: 10
    category: business_fiscal
    check: "approved_amount_cents <= make_good_credit formula cap for the linked deliverable"
    error_id: ERR_CREDIT_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /make-good-credits/{id}/transition (APPROVE)"
  - priority: 10
    category: business_fiscal
    check: "payment amount_cents <= invoice remaining balance (amount - paid - credits_applied)"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /invoices/{id}/payments"
  - priority: 10
    category: business_fiscal
    check: "credit REDEEM: approved_amount_cents <= selected invoice remaining balance; a payable invoice must exist (ERR_NO_PAYABLE_INVOICE 409 when pool empty)"
    error_id: ERR_CREDIT_EXCEEDS_INVOICE_BALANCE
    http_status: 422
    applies_to: "POST /make-good-credits/{id}/transition (REDEEM)"
  - priority: 10
    category: business_fiscal
    check: "Invoice must be ISSUED or PARTIALLY_PAID to accept a payment"
    error_id: ERR_INVOICE_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /invoices/{id}/payments"
  - priority: 10
    category: business_fiscal
    check: "Credit REDEEM requires at least one ISSUED/PARTIALLY_PAID invoice on the contract"
    error_id: ERR_NO_PAYABLE_INVOICE
    http_status: 409
    applies_to: "POST /make-good-credits/{id}/transition (REDEEM)"

# =============================================================================
# §1.5 API Endpoint Table (50 endpoints, flat collections)
# Transition endpoints take `action` in the body; the from-state machine above
# pins which actions are legal from which states. Read endpoints accept the
# pagination fields from §1.0 plus the listed optional filters as query/body
# parameters. List endpoints return records sorted by created_at ASC (stable,
# deterministic; id is never used for ordering). SponsorContact reads are
# scoped to their own sponsor_id.
# =============================================================================
endpoints:
  # --- Venue (epoch root) ---
  - method: POST
    path: "/venues"
    description: "Create a venue; current_season initialized to 2026"
    roles: [VenueAdmin]
    code: 201
    input: [display_name, city]
    output: Venue
    side_effects: ["current_season = 2026"]
  - method: GET
    path: "/venues/{venue_id}"
    description: "Get a venue (includes current_season epoch)"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: []
    output: Venue
    side_effects: []
  - method: POST
    path: "/venues/{venue_id}/advance-season"
    description: "Ops-run checkpoint: current_season += 1, then evaluate season close for the old season — SCHEDULED deliverables entering the new current season flip to IN_PROGRESS; deliverables whose season < new current_season with approved_units < contracted_units flip to MISSED and auto-create a REQUESTED MakeGoodCredit (make_good_credit formula); ACTIVE contracts with term_last_season < new current_season flip to EXPIRED (grants RELEASED); ACTIVE RightsWindows with last_season < new current_season flip to EXPIRED (CONFLICTED grants re-evaluated). Processing order within the checkpoint: deliverable evaluation first (created_at ASC per contract), then contract expiry, then rights-window expiry"
    roles: [VenueAdmin]
    code: 200
    input: []
    output: Venue
    side_effects: ["increments Venue.version by 1", "current_season += 1", "season-close cascades per description"]

  # --- SponsorAccount ---
  - method: POST
    path: "/sponsors"
    description: "Create a sponsor account (starts PROSPECT)"
    roles: [SponsorshipSales]
    code: 201
    input: [legal_name, display_name, industry_category]
    output: SponsorAccount
    side_effects: ["sponsor_status = PROSPECT"]
  - method: GET
    path: "/sponsors/{sponsor_id}"
    description: "Get a sponsor"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: []
    output: SponsorAccount
    side_effects: []
  - method: POST
    path: "/sponsors/{sponsor_id}/transition"
    description: "Sponsor lifecycle: QUALIFY | SUSPEND | REINSTATE | BLOCK; BLOCK runs the 3-hop termination cascade (contracts -> deliverables -> evidence)"
    roles: [SponsorshipSales]
    code: 200
    input: [action]
    output: SponsorAccount
    side_effects: ["sponsor state transition + cascades per §1.2", "increments SponsorAccount.version by 1"]

  # --- Asset ---
  - method: POST
    path: "/assets"
    description: "Register an inventory asset with its valuation basis"
    roles: [VenueAdmin]
    code: 201
    input: [venue_id, name, asset_class, rate_card_unit_cents, avg_impressions_per_unit, cpm_cents]
    output: Asset
    side_effects: ["asset_status = AVAILABLE"]
  - method: GET
    path: "/assets/{asset_id}"
    description: "Get an asset"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: []
    output: Asset
    side_effects: []
  - method: GET
    path: "/assets"
    description: "List assets with optional filters"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: ["venue_id?", "asset_class?", "asset_status?", "limit?", "offset?"]
    output: Asset[]
    side_effects: []
  - method: POST
    path: "/assets/{asset_id}/transition"
    description: "Asset lifecycle: RETIRE | REINSTATE"
    roles: [VenueAdmin]
    code: 200
    input: [action]
    output: Asset
    side_effects: ["asset state transition", "increments Asset.version by 1"]

  # --- RightsWindow ---
  - method: POST
    path: "/rights-windows"
    description: "Reserve a team/venue/league rights window for a category over seasons"
    roles: [VenueAdmin]
    code: 201
    input: [venue_id, holder, category, first_season, last_season]
    output: RightsWindow
    side_effects: ["window_status = RESERVED"]
  - method: GET
    path: "/rights-windows/{window_id}"
    description: "Get a rights window"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: []
    output: RightsWindow
    side_effects: []
  - method: GET
    path: "/rights-windows"
    description: "List rights windows with optional filters"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: ["venue_id?", "holder?", "category?", "window_status?", "limit?", "offset?"]
    output: RightsWindow[]
    side_effects: []
  - method: POST
    path: "/rights-windows/{window_id}/transition"
    description: "Window lifecycle: ACTIVATE | RELEASE; LEAGUE ACTIVATE preempts overlapping ACTIVE grants (grant -> CONFLICTED, contract -> CONTESTED); RELEASE/EXPIRED re-activates solely-blocked CONFLICTED grants"
    roles: [VenueAdmin]
    code: 200
    input: [action]
    output: RightsWindow
    side_effects: ["window state transition + contest/release cascades per §1.2", "increments RightsWindow.version by 1"]

  # --- SponsorshipContract ---
  - method: POST
    path: "/contracts"
    description: "Create a contract in DRAFT; sponsor must be ACTIVE; term window validated against venue epoch"
    roles: [SponsorshipSales]
    code: 201
    input: [venue_id, sponsor_id, title, term_first_season, term_last_season, base_fee_cents, escalator_pct, escalator_mode, "renewed_from_contract_id?"]
    output: SponsorshipContract
    side_effects: ["contract_status = DRAFT", "rights_status = CLEAR", "scheduled_total_cents = 0"]
  - method: GET
    path: "/contracts/{contract_id}"
    description: "Get a contract (SponsorContact: own contracts only)"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: []
    output: SponsorshipContract
    side_effects: []
  - method: GET
    path: "/contracts"
    description: "List contracts with optional filters (SponsorContact: scoped to sponsor_id == X-User-ID)"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: ["venue_id?", "sponsor_id?", "renewed_from_contract_id?", "contract_status?", "limit?", "offset?"]
    output: SponsorshipContract[]
    side_effects: []
  - method: PATCH
    path: "/contracts/{contract_id}"
    description: "Edit commercial terms while DRAFT; every successful PATCH bumps version (drives countersign OCC)"
    roles: [SponsorshipSales]
    code: 200
    input: ["title?", "term_first_season?", "term_last_season?", "base_fee_cents?", "escalator_pct?", "escalator_mode?"]
    output: SponsorshipContract
    side_effects: ["increments SponsorshipContract.version by 1"]
  - method: POST
    path: "/contracts/{contract_id}/transition"
    description: "Contract lifecycle: PROPOSE | REVISE | ACTIVATE | SUSPEND | REINSTATE | TERMINATE per §1.2"
    roles: [SponsorshipSales]
    code: 200
    input: [action]
    output: SponsorshipContract
    side_effects: ["contract state transition + cascades per §1.2", "increments SponsorshipContract.version by 1"]
  - method: POST
    path: "/contracts/{contract_id}/countersign"
    description: "Sponsor countersigns a PROPOSED contract (OCC on expected_contract_version); generates scheduled_total_cents and the 3 DRAFT installment invoices"
    roles: [SponsorContact]
    code: 200
    input: [expected_contract_version]
    output: SponsorshipContract
    side_effects: ["contract_status -> COUNTERSIGNED", "contract_total_value_cents + installment_split run", "3 DRAFT invoices created", "increments SponsorshipContract.version by 1"]

  # --- ExclusivityGrant ---
  - method: POST
    path: "/exclusivity-grants"
    description: "Grant category exclusivity to a contract over a season window inside its term"
    roles: [SponsorshipSales]
    code: 201
    input: [contract_id, category, first_season, last_season]
    output: ExclusivityGrant
    side_effects: ["grant_status = PENDING"]
  - method: GET
    path: "/exclusivity-grants/{grant_id}"
    description: "Get a grant"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: []
    output: ExclusivityGrant
    side_effects: []
  - method: GET
    path: "/exclusivity-grants"
    description: "List grants with optional filters"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: ["contract_id?", "category?", "grant_status?", "limit?", "offset?"]
    output: ExclusivityGrant[]
    side_effects: []
  - method: POST
    path: "/exclusivity-grants/{grant_id}/transition"
    description: "Grant lifecycle: ACTIVATE (rights-conflict + exclusivity-overlap checks) | RELEASE"
    roles: [VenueAdmin]
    code: 200
    input: [action]
    output: ExclusivityGrant
    side_effects: ["grant state transition + contract rights_status recompute per §1.2", "increments ExclusivityGrant.version by 1"]

  # --- Deliverable (activation plan) ---
  - method: POST
    path: "/deliverables"
    description: "Add an activation element to an ACTIVE contract for a season; SUITE_NIGHT requires checkin/checkout and runs the buffered date-conflict check"
    roles: [ActivationManager]
    code: 201
    input: [contract_id, asset_id, season, unit_kind, contracted_units, "checkin_date?", "checkout_date?"]
    output: Deliverable
    side_effects: ["deliverable_status = SCHEDULED, or IN_PROGRESS when season == venue.current_season", "approved_units = 0"]
  - method: GET
    path: "/deliverables/{deliverable_id}"
    description: "Get a deliverable"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: []
    output: Deliverable
    side_effects: []
  - method: GET
    path: "/deliverables"
    description: "List deliverables with optional filters"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: ["contract_id?", "asset_id?", "season?", "deliverable_status?", "limit?", "offset?"]
    output: Deliverable[]
    side_effects: []
  - method: POST
    path: "/deliverables/{deliverable_id}/transition"
    description: "Deliverable lifecycle manual action: CANCEL (from SCHEDULED or IN_PROGRESS; voids open evidence)"
    roles: [ActivationManager]
    code: 200
    input: [action]
    output: Deliverable
    side_effects: ["deliverable state transition + evidence void cascade per §1.2", "increments Deliverable.version by 1"]

  # --- EvidenceSubmission (fulfillment evidence) ---
  - method: POST
    path: "/evidence-submissions"
    description: "Submit proof-of-performance evidence against an IN_PROGRESS deliverable; records submitted_by_user_id from X-User-ID"
    roles: [ActivationManager]
    code: 201
    input: [deliverable_id, units_claimed, evidence_uri]
    output: EvidenceSubmission
    side_effects: ["submission_status = SUBMITTED", "submitted_by_user_id = X-User-ID"]
  - method: GET
    path: "/evidence-submissions/{submission_id}"
    description: "Get an evidence submission"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: []
    output: EvidenceSubmission
    side_effects: []
  - method: GET
    path: "/evidence-submissions"
    description: "List evidence submissions with optional filters"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: ["deliverable_id?", "submission_status?", "limit?", "offset?"]
    output: EvidenceSubmission[]
    side_effects: []
  - method: POST
    path: "/evidence-submissions/{submission_id}/transition"
    description: "Evidence review: APPROVE | REJECT | RESUBMIT; APPROVE/REJECT enforce four-eyes SoD; APPROVE accrues approved_units and may auto-FULFILL the deliverable"
    roles: [ActivationManager]
    code: 200
    input: [action, "review_note?", "evidence_uri?"]
    output: EvidenceSubmission
    side_effects: ["submission state transition + deliverable accrual per §1.2", "increments EvidenceSubmission.version by 1"]

  # --- MakeGoodCredit ---
  - method: POST
    path: "/make-good-credits"
    description: "Request a make-good credit for a MISSED deliverable (manual path; season-close also auto-creates them)"
    roles: [ActivationManager]
    code: 201
    input: [contract_id, deliverable_id, requested_amount_cents]
    output: MakeGoodCredit
    side_effects: ["credit_status = REQUESTED"]
  - method: GET
    path: "/make-good-credits/{credit_id}"
    description: "Get a make-good credit"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: []
    output: MakeGoodCredit
    side_effects: []
  - method: GET
    path: "/make-good-credits"
    description: "List make-good credits with optional filters"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: ["contract_id?", "deliverable_id?", "redeemed_against_invoice_id?", "credit_status?", "limit?", "offset?"]
    output: MakeGoodCredit[]
    side_effects: []
  - method: POST
    path: "/make-good-credits/{credit_id}/transition"
    description: "Credit lifecycle: APPROVE (cap check, sets approved_amount_cents) | DECLINE | REDEEM (applies to oldest payable invoice) | VOID"
    roles: [FinanceManager]
    code: 200
    input: [action, "approved_amount_cents?"]
    output: MakeGoodCredit
    side_effects: ["credit state transition + outstanding/receivable recompute per §1.2", "increments MakeGoodCredit.version by 1"]

  # --- Invoice (payment schedule & receivable) ---
  - method: GET
    path: "/invoices/{invoice_id}"
    description: "Get an invoice including its payment sub-records"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices"
    description: "List invoices with optional filters"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: ["contract_id?", "invoice_status?", "installment_label?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/invoices/{invoice_id}/transition"
    description: "Invoice lifecycle: ISSUE (requires contract ACTIVE and rights CLEAR) | VOID (from DRAFT) | WRITE_OFF (from ISSUED/PARTIALLY_PAID)"
    roles: [FinanceManager]
    code: 200
    input: [action]
    output: Invoice
    side_effects: ["invoice state transition + receivable recompute", "increments Invoice.version by 1"]
  - method: POST
    path: "/invoices/{invoice_id}/payments"
    description: "Post a payment against an ISSUED/PARTIALLY_PAID invoice; amount must be > 0 and <= remaining balance; appends a payment sub-record and may flip the invoice to PARTIALLY_PAID or PAID"
    roles: [FinanceManager]
    code: 200
    input: [amount_cents, method, "external_ref?"]
    output: "{ payment_id: string, invoice_id: string, amount_cents: integer, paid_cents_after: integer, invoice_status: string }"
    side_effects: ["payment sub-record appended (voided=false)", "paid_cents += amount_cents", "invoice status re-derived", "Contract.receivable_cents recomputed"]
  - method: POST
    path: "/invoices/{invoice_id}/payments/{payment_id}/void"
    description: "Void a posted payment (compensation); restores paid_cents and re-derives invoice status (PAID can fall back to PARTIALLY_PAID/ISSUED)"
    roles: [FinanceManager]
    code: 200
    input: []
    output: "{ payment_id: string, invoice_id: string, voided: boolean, paid_cents_after: integer, invoice_status: string }"
    side_effects: ["payment sub-record voided = true", "paid_cents -= amount_cents", "invoice status re-derived", "Contract.receivable_cents recomputed"]

  # --- ValuationReport (measurement/valuation to sponsor) ---
  - method: POST
    path: "/valuation-reports"
    description: "Generate the season measurement report: provisional (rate-card) vs final (audited media value) snapshot, fulfillment_pct, make_good_due_cents; season must be closed and within term"
    roles: [ActivationManager]
    code: 201
    input: [contract_id, season]
    output: ValuationReport
    side_effects: ["report_status = DRAFT", "delivered_value calculation runs (both variants)"]
  - method: GET
    path: "/valuation-reports/{report_id}"
    description: "Get a valuation report"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: []
    output: ValuationReport
    side_effects: []
  - method: GET
    path: "/valuation-reports"
    description: "List valuation reports with optional filters"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: ["contract_id?", "season?", "report_status?", "limit?", "offset?"]
    output: ValuationReport[]
    side_effects: []
  - method: POST
    path: "/valuation-reports/{report_id}/transition"
    description: "Report lifecycle: ISSUE (ActivationManager) | ACKNOWLEDGE (SponsorContact owner)"
    roles: [ActivationManager, SponsorContact]
    code: 200
    input: [action]
    output: ValuationReport
    side_effects: ["report state transition", "increments ValuationReport.version by 1"]

  # --- RenewalOpportunity (renewal & upsell pipeline) ---
  - method: POST
    path: "/renewal-opportunities"
    description: "Open a renewal/upsell opportunity for an ACTIVE or EXPIRED contract; at most one open opportunity per contract"
    roles: [SponsorshipSales]
    code: 201
    input: [contract_id, proposed_fee_cents]
    output: RenewalOpportunity
    side_effects: ["stage = IDENTIFIED"]
  - method: GET
    path: "/renewal-opportunities/{opportunity_id}"
    description: "Get a renewal opportunity"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: []
    output: RenewalOpportunity
    side_effects: []
  - method: GET
    path: "/renewal-opportunities"
    description: "List renewal opportunities with optional filters"
    roles: [VenueAdmin, SponsorshipSales, ActivationManager, FinanceManager, SponsorContact]
    code: 200
    input: ["contract_id?", "resulting_contract_id?", "stage?", "limit?", "offset?"]
    output: RenewalOpportunity[]
    side_effects: []
  - method: POST
    path: "/renewal-opportunities/{opportunity_id}/transition"
    description: "Pipeline stage moves: PROPOSE | OPEN_NEGOTIATION | MARK_WON (creates the renewal contract) | MARK_LOST"
    roles: [SponsorshipSales]
    code: 200
    input: [action]
    output: RenewalOpportunity
    side_effects: ["stage transition; MARK_WON creates renewal SponsorshipContract per §1.2", "increments RenewalOpportunity.version by 1"]
  - method: POST
    path: "/renewal-opportunities/{opportunity_id}/counter"
    description: "Issue revised terms from NEGOTIATING back to PROPOSED (OCC on expected_opportunity_version)"
    roles: [SponsorshipSales]
    code: 200
    input: [proposed_fee_cents, expected_opportunity_version]
    output: RenewalOpportunity
    side_effects: ["stage -> PROPOSED", "proposed_fee_cents updated", "increments RenewalOpportunity.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog (31 codes)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint, or SponsorContact touching a resource outside their sponsor_id scope" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Evidence APPROVE/REJECT attempted by the same X-User-ID that submitted it" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced body FK does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown field, or invalid enum value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity's own state machine forbids the action (wrong from-state or terminal state)" }
  - { id: ERR_RIGHTS_CONFLICT, http: 409, condition: "Grant ACTIVATE overlaps an ACTIVE LEAGUE RightsWindow for the same venue+category+seasons" }
  - { id: ERR_CONTRACT_RIGHTS_CONTESTED, http: 409, condition: "Contract rights_status == CONTESTED blocks deliverable create, evidence approve, invoice issue" }
  - { id: ERR_SEASON_WINDOW_INVALID, http: 422, condition: "Term window malformed (first > last, or first < venue.current_season at create); or SUITE_NIGHT checkin > checkout" }
  - { id: ERR_SEASON_OUT_OF_TERM, http: 422, condition: "Deliverable season outside [term_first_season, term_last_season]" }
  - { id: ERR_SEASON_CLOSED, http: 422, condition: "Deliverable season already closed (< venue.current_season), or contract ACTIVATE after term_last_season has passed" }
  - { id: ERR_SEASON_NOT_CLOSED, http: 422, condition: "ValuationReport season must be < venue.current_season" }
  - { id: ERR_GRANT_OUTSIDE_TERM, http: 422, condition: "Grant window not contained in contract term" }
  - { id: ERR_CATEGORY_EXCLUSIVITY_CONFLICT, http: 409, condition: "Another ACTIVE grant on the same venue+category overlaps the requested seasons" }
  - { id: ERR_DUPLICATE_GRANT, http: 409, condition: "Contract already holds a PENDING/ACTIVE grant for this category" }
  - { id: ERR_SUITE_DATE_CONFLICT, http: 409, condition: "SUITE_NIGHT buffered date span intersects another non-CANCELLED SUITE_NIGHT deliverable on the same asset" }
  - { id: ERR_OVER_DELIVERY, http: 422, condition: "Evidence approval would push approved_units beyond contracted_units" }
  - { id: ERR_DUPLICATE_OPEN_OPPORTUNITY, http: 409, condition: "Contract already has an open (IDENTIFIED/PROPOSED/NEGOTIATING) renewal opportunity" }
  - { id: ERR_SPONSOR_NOT_ACTIVE, http: 409, condition: "Sponsor must be ACTIVE for contract create/PROPOSE/ACTIVATE/REINSTATE" }
  - { id: ERR_ASSET_NOT_AVAILABLE, http: 409, condition: "Asset is RETIRED; cannot attach new deliverables" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Contract must be ACTIVE (deliverable create, invoice ISSUE)" }
  - { id: ERR_DELIVERABLE_NOT_OPEN, http: 409, condition: "Deliverable must be IN_PROGRESS for evidence create/approve/resubmit" }
  - { id: ERR_RENEWAL_CONTRACT_STATE, http: 409, condition: "Renewal source contract must be ACTIVE or EXPIRED" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "Amount/quantity/fee field must be a positive integer (pct >= 0)" }
  - { id: ERR_CREDIT_EXCEEDS_CAP, http: 422, condition: "approved_amount_cents exceeds the make_good_credit formula cap for the linked deliverable" }
  - { id: ERR_CREDIT_EXCEEDS_INVOICE_BALANCE, http: 422, condition: "Credit approved_amount exceeds the selected invoice's remaining balance" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "Payment exceeds invoice remaining balance" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "Invoice must be ISSUED or PARTIALLY_PAID to accept a payment" }
  - { id: ERR_NO_PAYABLE_INVOICE, http: 409, condition: "Credit REDEEM finds no ISSUED/PARTIALLY_PAID invoice on the contract" }
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "expected_contract_version != contract.version at countersign" }
  - { id: ERR_STALE_OPPORTUNITY_VERSION, http: 412, condition: "expected_opportunity_version != opportunity.version at counter" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: VenueAdmin
    description: "Venue sponsorship operations administrator: inventory, rights windows, season epoch"
    identity: opaque
    exclusive_operations:
      - "POST /venues; GET+/advance-season"
      - "POST /assets; POST /assets/{id}/transition"
      - "POST /rights-windows; POST /rights-windows/{id}/transition"
      - "POST /exclusivity-grants/{id}/transition (ACTIVATE/RELEASE)"
    shared_operations:
      - "All GET endpoints"
  - name: SponsorshipSales
    description: "Sponsorship sales team: sponsors, contracts, grants, renewal pipeline"
    identity: opaque
    exclusive_operations:
      - "POST /sponsors; POST /sponsors/{id}/transition"
      - "POST /contracts; PATCH /contracts/{id}; POST /contracts/{id}/transition"
      - "POST /exclusivity-grants"
      - "POST /renewal-opportunities; POST /renewal-opportunities/{id}/transition; POST /renewal-opportunities/{id}/counter"
    shared_operations:
      - "All GET endpoints"
  - name: ActivationManager
    description: "Activation/fulfillment team: deliverables, evidence (submit + four-eyes review), make-good requests, valuation reports"
    identity: opaque
    exclusive_operations:
      - "POST /deliverables; POST /deliverables/{id}/transition"
      - "POST /evidence-submissions; POST /evidence-submissions/{id}/transition (SoD: approver != submitter)"
      - "POST /make-good-credits"
      - "POST /valuation-reports; POST /valuation-reports/{id}/transition (ISSUE)"
    shared_operations:
      - "All GET endpoints"
      - "POST /valuation-reports/{id}/transition shared with SponsorContact (ISSUE vs ACKNOWLEDGE actions)"
  - name: FinanceManager
    description: "Finance: installment invoices, payments, make-good approval/redemption"
    identity: opaque
    exclusive_operations:
      - "POST /invoices/{id}/transition"
      - "POST /invoices/{id}/payments; POST /invoices/{id}/payments/{payment_id}/void"
      - "POST /make-good-credits/{id}/transition (APPROVE/DECLINE/REDEEM/VOID)"
    shared_operations:
      - "All GET endpoints"
  - name: SponsorContact
    description: "External sponsor contact; X-User-ID equals the SponsorAccount id they represent"
    identity: "entity_backed:SponsorAccount"
    exclusive_operations:
      - "POST /contracts/{id}/countersign (own contracts only)"
      - "POST /valuation-reports/{id}/transition action=ACKNOWLEDGE (own sponsor's reports only)"
    shared_operations:
      - "All GET endpoints, scoped to resources whose contract chain leads back to sponsor_id == X-User-ID (ERR_FORBIDDEN otherwise)"
