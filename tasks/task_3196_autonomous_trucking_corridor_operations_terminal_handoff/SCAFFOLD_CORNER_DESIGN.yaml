            - "after the trigger Carrier.${car_id}.recordable_incidents_last_epoch == 2 and incident_band == WATCH, so the band recomputed from the source count"
            - "a monitoring window created after the trigger reads safe_stop_fee_cents == 25000, while the earlier window keeps its stored 0"
            - "a third MINOR report would take recordable_incidents_last_epoch to 3, which stays WATCH because SUSPENDED starts at exactly 5"

