# =============================================================================
# Airport Badging & SIDA Access Control — benchmark seed tables (v1)
# =============================================================================

scenario: |
  Airport Badging & SIDA Access Control (airport security badging office): applicant sponsorship & background/CHRC check, security threat assessment & fingerprint submission, training completion & badge issuance with expiration, door/area authorization by badge type, lost/stolen badge & audit of unreturned badges, annual audit & recovery rate reporting, violation & badge suspension, escort privilege management

domain_name: airport-badging-sida
api_prefix: /badging

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: access_control_matrix
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - dual_variant_calculation
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (9 entities)
# =============================================================================
entities:
  - name: Sponsor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal name of the sponsoring employer/tenant organization" }
      - { name: sponsor_code, type: string, source: input, description: "Unique short code for the sponsor (globally unique)", constraints: "unique across all sponsors" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }
      - { name: active_badge_quota, type: integer, source: input, description: "Maximum number of badges in status ACTIVE or SUSPENDED the sponsor may hold", constraints: ">= 1" }
      - { name: active_badge_count, type: integer, source: computed, description: "Read-only: count of Badge rows with sponsor_id = this sponsor and status IN {ACTIVE, SUSPENDED}" }
      - { name: suspended_at, type: datetime, source: system, description: "When the sponsor was suspended; null while ACTIVE", default: null }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_id, type: string, source: input, description: "FK -> Sponsor.id; owning sponsor; must equal the SponsorSignatory's X-User-ID" }
      - { name: full_name, type: string, source: input, description: "Applicant legal full name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD)" }
      - { name: government_id_number, type: string, source: input, description: "Government-issued ID number used for the CHRC submission" }

  - name: BadgeApplication
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; the person the application is for" }
      - { name: sponsor_id, type: string, source: system, description: "FK -> Sponsor.id; denormalized copy of applicant.sponsor_id at creation time" }
      - { name: badge_class, type: enum, source: input, description: "SIDA | STERILE | AOA" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | STA_PENDING | PENDING_REQUIREMENTS | READY | ISSUED | DENIED | WITHDRAWN | EXPIRED", default: SUBMITTED }
      - { name: chrc_outcome, type: enum, source: system, description: "PASS | FAIL; null until CHRC result recorded", default: null }
      - { name: sta_outcome, type: enum, source: system, description: "CLEARED | DENIED; null until STA result recorded", default: null }
      - { name: denial_reason, type: enum, source: system, description: "CHRC_FAILED | STA_DENIED | SPONSOR_SUSPENDED; set when status becomes DENIED", default: null }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock time at creation" }
      - { name: application_expires_at, type: datetime, source: system, description: "submitted_at + 90 days; non-terminal applications at or past this instant are swept to EXPIRED" }
      - { name: issued_badge_id, type: string, source: system, description: "id of the Badge created at issuance (canonical reverse link is Badge.application_id); null until ISSUED", default: null }

  - name: TrainingCompletion
    parent: null
    common_fields: false
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; the person who completed the course" }
      - { name: course_code, type: enum, source: input, description: "SIDA_INITIAL | AOA_SAFETY | AOA_DRIVING | STERILE_INITIAL" }
      - { name: completed_at, type: datetime, source: input, description: "ISO 8601 datetime the course was completed" }
      - { name: expires_at, type: datetime, source: computed, description: "completed_at + course validity (SIDA_INITIAL 12mo, AOA_SAFETY 24mo, AOA_DRIVING 12mo, STERILE_INITIAL 12mo); calendar-month addition preserving day-of-month" }

  - name: Badge
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> BadgeApplication.id; the application this badge was issued from" }
      - { name: applicant_id, type: string, source: system, description: "FK -> Applicant.id; badge holder (copied from application)" }
      - { name: sponsor_id, type: string, source: system, description: "FK -> Sponsor.id; sponsoring organization (copied from application)" }
      - { name: badge_number, type: string, source: input, description: "Printed badge number; globally unique across all badges", constraints: "unique" }
      - { name: badge_class, type: enum, source: system, description: "SIDA | STERILE | AOA (copied from application)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | LOST | STOLEN | EXPIRED | REVOKED | VOIDED | RETURNED", default: ACTIVE }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock time of issuance" }
      - { name: expires_at, type: datetime, source: computed, description: "min(issued_at + 24 months, min over required-course horizons); horizon = completion.expires_at at initial issuance, completion.expires_at + 30 days at replacement (renewal grace)" }
      - { name: deactivated_at, type: datetime, source: system, description: "Instant the badge left ACTIVE/SUSPENDED (set on LOST/STOLEN/EXPIRED/REVOKED/VOIDED); null while active", default: null }
      - { name: return_deadline, type: datetime, source: system, description: "deactivated_at + 30 days; null for VOIDED badges (administratively accounted, no return obligation)", default: null }
      - { name: returned_at, type: datetime, source: system, description: "Instant a deactivated badge was physically returned; null until RETURNED", default: null }
      - { name: suspended_by, type: string, source: system, description: "X-User-ID of the SecurityManager who suspended the badge (or who suspended the sponsor for cascade suspensions); null while not suspended", default: null }
      - { name: suspended_until, type: datetime, source: system, description: "End of a violation-points suspension (now + tier days); null for manual/sponsor suspensions (immediately reinstatable)", default: null }
      - { name: suspension_reason, type: enum, source: system, description: "MANUAL | VIOLATION_POINTS | SPONSOR_SUSPENDED; null while not suspended", default: null }
      - { name: superseded_by_badge_id, type: string, source: system, description: "FK -> Badge.id; set on the old badge when replaced (self-referential replacement chain); null otherwise", default: null }

  - name: EscortPrivilege
    parent: null
    common_fields: true
    fields:
      - { name: badge_id, type: string, source: system, description: "FK -> Badge.id; badge this privilege is attached to" }
      - { name: max_escortees, type: integer, source: input, description: "Maximum number of escorted persons allowed per entry (1..10)", constraints: "1 <= n <= 10" }
      - { name: status, type: enum, source: system, description: "GRANTED | REVOKED", default: GRANTED }
      - { name: granted_by, type: string, source: system, description: "X-User-ID of the granting SecurityManager" }
      - { name: revoked_reason, type: enum, source: system, description: "MANUAL | BADGE_SUSPENDED | BADGE_DEACTIVATED | SUPERSEDED; null while GRANTED", default: null }

  - name: AccessEvent
    parent: null
    common_fields: false
    fields:
      - { name: badge_id, type: string, source: input, description: "FK -> Badge.id; badge presented at the door; null for a badgeless attempt" , constraints: "nullable" }
      - { name: zone_code, type: enum, source: input, description: "PUBLIC_TERMINAL | STERILE_CONCOURSE | AOA_MOVEMENT | SECURE_ID_AREA (fixed zone catalog, see access_decision calculation)" }
      - { name: escortee_count, type: integer, source: input, description: "Number of escorted persons accompanying the badge holder", default: 0, constraints: ">= 0" }
      - { name: decision, type: enum, source: system, description: "ALLOWED | DENIED" }
      - { name: denial_reason, type: enum, source: system, description: "DENIED_NO_BADGE | DENIED_BADGE_INACTIVE | DENIED_ZONE_CLASS | DENIED_ESCORT_NOT_PERMITTED | DENIED_ESCORT_CAPACITY; null when ALLOWED", default: null }
      - { name: occurred_at, type: datetime, source: system, description: "Logical clock time of the access check" }

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - { name: badge_id, type: string, source: input, description: "FK -> Badge.id; badge the violation was committed against" }
      - { name: violation_type, type: enum, source: input, description: "FAILURE_TO_DISPLAY (3 pts) | ESCORT_VIOLATION (6 pts) | UNAUTHORIZED_AREA (6 pts) | SECURITY_BREACH (12 pts)" }
      - { name: points, type: integer, source: computed, description: "Server-assigned from violation_type: 3/6/6/12" }
      - { name: occurred_at, type: datetime, source: input, description: "When the violation occurred (drives the rolling 24-month window)" }
      - { name: status, type: enum, source: system, description: "RECORDED | SUSTAINED | DISMISSED", default: RECORDED }
      - { name: recorded_by, type: string, source: system, description: "X-User-ID of the BadgingOfficer who recorded the violation" }
      - { name: sustained_by, type: string, source: system, description: "X-User-ID of the SecurityManager who sustained it; null until SUSTAINED", default: null }
      - { name: dismissed_by, type: string, source: system, description: "X-User-ID of the SecurityManager who dismissed it; null until DISMISSED", default: null }

  - name: AuditCycle
    parent: null
    common_fields: true
    fields:
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the audit window (ISO 8601 datetime)" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive end of the audit window; must be > window_start" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", default: OPEN }
      - { name: scoped_count, type: integer, source: computed, description: "Badges with deactivated_at in [window_start, window_end); computed at close, frozen; null while OPEN", default: null }
      - { name: accounted_count, type: integer, source: computed, description: "Scoped badges whose current status is RETURNED or VOIDED; computed at close, frozen; null while OPEN", default: null }
      - { name: recovery_rate_pct, type: number, source: computed, description: "round(100 * accounted_count / scoped_count, 2) half-up, aggregate-then-round (NOT the mean of rounded per-class rates); 100.00 when scoped_count = 0; null while OPEN", default: null }
      - { name: per_class_rates, type: array, source: computed, description: "One entry per badge_class present in scope: { badge_class, scoped, accounted, rate_pct } each rate_pct rounded half-up to 2 decimals; sorted by badge_class alphabetically (AOA, SIDA, STERILE); null while OPEN", default: null }
      - { name: outcome, type: enum, source: computed, description: "COMPLIANT if recovery_rate_pct >= 95.00 else DEFICIENT; null while OPEN", default: null }
      - { name: due_scoped_count, type: integer, source: computed, description: "Live provisional: scoped badges with return_deadline <= current logical clock; null once CLOSED", default: null }
      - { name: due_accounted_count, type: integer, source: computed, description: "Live provisional: due-scoped badges with status RETURNED or VOIDED; null once CLOSED", default: null }
      - { name: recovery_rate_provisional_pct, type: number, source: computed, description: "Live provisional: round(100 * due_accounted_count / due_scoped_count, 2) half-up; null when due_scoped_count = 0 and null once CLOSED", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Sponsor
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /badging/sponsors/{id}/suspend"
        actor: SecurityManager
        preconditions:
          - "Sponsor must be ACTIVE (ERR_SPONSOR_NOT_ACTIVE)"
        side_effects:
          - "Sets suspended_at = current logical clock"
          - "Cascade 1: every BadgeApplication of this sponsor in {SUBMITTED, STA_PENDING, PENDING_REQUIREMENTS, READY} -> DENIED with denial_reason SPONSOR_SUSPENDED"
          - "Cascade 2: every Badge of this sponsor in {ACTIVE, SUSPENDED} -> SUSPENDED with suspension_reason SPONSOR_SUSPENDED, suspended_by = the acting manager, suspended_until = null; badges already SUSPENDED keep their original suspended_by/suspended_until/suspension_reason"
          - "Cascade 3 (chained from cascade 2): each badge that newly entered SUSPENDED revokes its GRANTED EscortPrivilege (status -> REVOKED, revoked_reason BADGE_SUSPENDED)"

  - entity: BadgeApplication
    initial_state: SUBMITTED
    terminal_states: [ISSUED, DENIED, WITHDRAWN, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: STA_PENDING
        trigger: "POST /badging/applications/{id}/record-chrc with outcome PASS"
        actor: BadgingOfficer
        preconditions:
          - "Application must be SUBMITTED (ERR_APPLICATION_NOT_OPEN)"
        side_effects:
          - "chrc_outcome = PASS; STA is submitted to TSA as part of the same record (no separate step)"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /badging/applications/{id}/record-chrc with outcome FAIL"
        actor: BadgingOfficer
        preconditions:
          - "Application must be SUBMITTED (ERR_APPLICATION_NOT_OPEN)"
        side_effects:
          - "chrc_outcome = FAIL; denial_reason = CHRC_FAILED"

      - from: STA_PENDING
        to: PENDING_REQUIREMENTS
        trigger: "POST /badging/applications/{id}/record-sta-result with outcome CLEARED"
        actor: BadgingOfficer
        preconditions:
          - "Application must be STA_PENDING (ERR_APPLICATION_NOT_OPEN)"
        side_effects:
          - "sta_outcome = CLEARED"
          - "ready_evaluation runs immediately: if all required courses for badge_class are strictly current at the current logical clock, status continues to READY instead of resting at PENDING_REQUIREMENTS"

      - from: STA_PENDING
        to: DENIED
        trigger: "POST /badging/applications/{id}/record-sta-result with outcome DENIED"
        actor: BadgingOfficer
        preconditions:
          - "Application must be STA_PENDING (ERR_APPLICATION_NOT_OPEN)"
        side_effects:
          - "sta_outcome = DENIED; denial_reason = STA_DENIED"

      - from: PENDING_REQUIREMENTS
        to: READY
        trigger: "system (automatic when ready_evaluation passes: all required courses strictly current)"
        actor: system
        preconditions:
          - "Application is PENDING_REQUIREMENTS"
          - "Every required course for badge_class has a TrainingCompletion with expires_at > current logical clock"
        side_effects: []
        note: "Evaluated on training-completion recording, on STA clearance, and on every clock set"

      - from: READY
        to: PENDING_REQUIREMENTS
        trigger: "system (automatic regression on clock set when a required completion lapses)"
        actor: system
        preconditions:
          - "Application is READY"
          - "Some required course for badge_class has no TrainingCompletion with expires_at > current logical clock"
        side_effects: []
        note: "This regression plus the promotion above forms the PENDING_REQUIREMENTS <-> READY cycle"

      - from: READY
        to: ISSUED
        trigger: "POST /badging/applications/{id}/issue-badge"
        actor: BadgingOfficer
        preconditions:
          - "Application must be READY (ERR_APPLICATION_NOT_READY)"
          - "Applicant has no other Badge of the same badge_class with status IN {ACTIVE, SUSPENDED, LOST, STOLEN} whose validity window [issued_at, expires_at) overlaps now (ERR_ACTIVE_BADGE_EXISTS)"
          - "Sponsor has no overdue unreturned badge (ERR_SPONSOR_DELINQUENT)"
          - "Sponsor active_badge_count < active_badge_quota (ERR_SPONSOR_QUOTA_EXCEEDED)"
        side_effects:
          - "Creates Badge: status ACTIVE, issued_at = current clock, expires_at per badge_expiry_computation (initial-issuance variant), applicant/sponsor/class copied"
          - "issued_badge_id set to the new Badge id"
          - "sponsor active_badge_count recomputed (increases by 1)"

      - from: [SUBMITTED, STA_PENDING, PENDING_REQUIREMENTS, READY]
        to: WITHDRAWN
        trigger: "POST /badging/applications/{id}/withdraw"
        actor: SponsorSignatory
        preconditions:
          - "Application must be non-terminal (ERR_APPLICATION_NOT_OPEN)"
          - "Caller sponsor must own the application (ERR_SPONSOR_OWNERSHIP_MISMATCH)"
        side_effects: []

      - from: [SUBMITTED, STA_PENDING, PENDING_REQUIREMENTS, READY]
        to: DENIED
        trigger: "system (cascade from sponsor suspension)"
        actor: system
        preconditions:
          - "Application's sponsor was just suspended"
        side_effects:
          - "denial_reason = SPONSOR_SUSPENDED"

      - from: [SUBMITTED, STA_PENDING, PENDING_REQUIREMENTS, READY]
        to: EXPIRED
        trigger: "system (clock set sweep when current clock >= application_expires_at)"
        actor: system
        preconditions:
          - "Application is non-terminal and application_expires_at <= current logical clock"
        side_effects: []

  - entity: Badge
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED, VOIDED, RETURNED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /badging/badges/{id}/suspend (manual), system (violation points >= 12 on sustain), or system (sponsor suspension cascade)"
        actor: SecurityManager | system
        preconditions:
          - "Badge must be ACTIVE (ERR_BADGE_NOT_ACTIVE)"
        side_effects:
          - "suspended_by = acting manager (manual) or sustaining manager (points) or sponsor-suspending manager (cascade)"
          - "suspension_reason = MANUAL | VIOLATION_POINTS | SPONSOR_SUSPENDED"
          - "suspended_until = now + 7 days (12-17 points) or now + 30 days (18-23 points) for VIOLATION_POINTS; null otherwise"
          - "Chained cascade: this badge's GRANTED EscortPrivilege (if any) -> REVOKED with revoked_reason BADGE_SUSPENDED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /badging/badges/{id}/reinstate"
        actor: SecurityManager
        preconditions:
          - "Badge must be SUSPENDED (ERR_BADGE_NOT_SUSPENDED)"
          - "Segregation of duties: caller X-User-ID != badge.suspended_by (ERR_SEGREGATION_OF_DUTIES)"
          - "If suspended_until is not null, current clock >= suspended_until (ERR_SUSPENSION_NOT_SERVED)"
        side_effects:
          - "suspended_by / suspended_until / suspension_reason cleared to null"
          - "EscortPrivilege is NOT restored; a new grant requires POST /badging/badges/{id}/escort-privileges"

      - from: [ACTIVE, SUSPENDED]
        to: LOST
        trigger: "POST /badging/badges/{id}/report-lost with report_type LOST"
        actor: "SponsorSignatory (own sponsor) or BadgingOfficer"
        preconditions:
          - "Badge must be ACTIVE or SUSPENDED (ERR_BADGE_NOT_ACTIVE)"
        side_effects:
          - "deactivated_at = current clock; return_deadline = deactivated_at + 30 days"
          - "Chained cascade: GRANTED EscortPrivilege -> REVOKED with revoked_reason BADGE_DEACTIVATED"
          - "sponsor active_badge_count recomputed (decreases by 1 if badge was ACTIVE or SUSPENDED)"

      - from: [ACTIVE, SUSPENDED]
        to: STOLEN
        trigger: "POST /badging/badges/{id}/report-lost with report_type STOLEN"
        actor: "SponsorSignatory (own sponsor) or BadgingOfficer"
        preconditions:
          - "Badge must be ACTIVE or SUSPENDED (ERR_BADGE_NOT_ACTIVE)"
        side_effects:
          - "Same as -> LOST"

      - from: [ACTIVE, SUSPENDED]
        to: EXPIRED
        trigger: "system (clock set sweep when current clock >= expires_at)"
        actor: system
        preconditions:
          - "Badge is ACTIVE or SUSPENDED and expires_at <= current logical clock"
        side_effects:
          - "deactivated_at = expires_at; return_deadline = expires_at + 30 days"
          - "Chained cascade: GRANTED EscortPrivilege -> REVOKED with revoked_reason BADGE_DEACTIVATED"
          - "sponsor active_badge_count recomputed"

      - from: [ACTIVE, SUSPENDED]
        to: REVOKED
        trigger: "POST /badging/badges/{id}/revoke (manual) or system (violation points >= 24 on sustain)"
        actor: SecurityManager | system
        preconditions:
          - "Badge must be ACTIVE or SUSPENDED (ERR_BADGE_NOT_ACTIVE)"
        side_effects:
          - "deactivated_at = current clock; return_deadline = deactivated_at + 30 days"
          - "Chained cascade: GRANTED EscortPrivilege -> REVOKED with revoked_reason BADGE_DEACTIVATED"
          - "sponsor active_badge_count recomputed"

      - from: [ACTIVE, SUSPENDED, EXPIRED]
        to: VOIDED
        trigger: "POST /badging/badges/{id}/replace"
        actor: BadgingOfficer
        preconditions:
          - "Badge must be ACTIVE, SUSPENDED, or EXPIRED (ERR_BADGE_NOT_REPLACEABLE)"
          - "Renewal training gate: every required course for badge_class has a completion with expires_at + 30 days > current clock (renewal-grace variant); failure -> ERR_BADGE_NOT_REPLACEABLE"
          - "Computed new expires_at must be > current clock (else ERR_BADGE_NOT_REPLACEABLE)"
        side_effects:
          - "Old badge: status VOIDED, deactivated_at = current clock, return_deadline = null (administratively accounted), superseded_by_badge_id = new badge id"
          - "Chained cascade: old badge's GRANTED EscortPrivilege (if any) -> REVOKED with revoked_reason SUPERSEDED"
          - "New Badge created ACTIVE with new badge_number, same applicant/sponsor/class, issued_at = current clock, expires_at per badge_expiry_computation (renewal variant: horizons are completion.expires_at + 30 days)"
          - "sponsor active_badge_count recomputed (unchanged: one deactivation + one issuance)"

      - from: [LOST, STOLEN, EXPIRED, REVOKED]
        to: RETURNED
        trigger: "POST /badging/badges/{id}/mark-returned"
        actor: BadgingOfficer
        preconditions:
          - "Badge must be LOST, STOLEN, EXPIRED, or REVOKED (ERR_BADGE_NOT_INACTIVE)"
        side_effects:
          - "returned_at = current clock"

  - entity: EscortPrivilege
    initial_state: GRANTED
    terminal_states: [REVOKED]
    transitions:
      - from: GRANTED
        to: REVOKED
        trigger: "POST /badging/escort-privileges/{id}/revoke (MANUAL), system cascades (BADGE_SUSPENDED | BADGE_DEACTIVATED), or supersession by a new grant (SUPERSEDED)"
        actor: SecurityManager | system
        preconditions:
          - "Privilege must be GRANTED (ERR_ESCORT_NOT_GRANTED) — applies to the manual revoke endpoint"
        side_effects:
          - "revoked_reason set per trigger"

  - entity: Violation
    initial_state: RECORDED
    terminal_states: [DISMISSED]
    transitions:
      - from: RECORDED
        to: SUSTAINED
        trigger: "POST /badging/violations/{id}/sustain"
        actor: SecurityManager
        preconditions:
          - "Violation must be RECORDED (ERR_VIOLATION_NOT_OPEN)"
        side_effects:
          - "sustained_by = acting manager"
          - "Recompute holder windowed points (sum of points over SUSTAINED violations of badges of the same applicant with occurred_at > now - 24 months)"
          - "Cascade threshold: if points >= 24 and badge is ACTIVE or SUSPENDED -> badge REVOKED (with its escort-revocation chain); else if points >= 12 and badge is ACTIVE -> badge SUSPENDED with tier days (with its escort-revocation chain)"

      - from: [RECORDED, SUSTAINED]
        to: DISMISSED
        trigger: "POST /badging/violations/{id}/dismiss"
        actor: SecurityManager
        preconditions:
          - "Violation must be RECORDED or SUSTAINED (ERR_VIOLATION_NOT_OPEN)"
          - "Segregation of duties: dismissing a RECORDED violation requires caller != recorded_by; dismissing a SUSTAINED violation requires caller != sustained_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "dismissed_by = acting manager"
          - "Holder windowed points recomputed (dismissed violation's points removed)"
          - "A badge already SUSPENDED/REVOKED by the threshold cascade is NOT auto-restored; reinstatement is a separate manual action"

  - entity: AuditCycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /badging/audit-cycles/{id}/close"
        actor: Auditor
        preconditions:
          - "AuditCycle must be OPEN (ERR_AUDIT_NOT_OPEN)"
        side_effects:
          - "Computes and freezes scoped_count, accounted_count, recovery_rate_pct (aggregate-then-round), per_class_rates, outcome"
          - "Provisional fields (due_scoped_count, due_accounted_count, recovery_rate_provisional_pct) become null"

  - entity: AccessEvent
    initial_state: null
    terminal_states: []
    transitions: []
    note: "Append-only event log; no state machine. Rows are created exclusively by POST /badging/access-checks."

  - entity: TrainingCompletion
    initial_state: null
    terminal_states: []
    transitions: []
    note: "Immutable record; expires_at computed at creation. No update or delete."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: escort-grant-stale-badge
    parent_entity: Badge
    write_endpoint: "POST /badging/badges/{id}/escort-privileges"
    occ_field: expected_badge_version
    description: |
      Granting an EscortPrivilege against a Badge whose version has advanced
      since the client last observed it is rejected. A new grant legitimately
      supersedes any currently GRANTED privilege (which becomes REVOKED with
      revoked_reason SUPERSEDED), so without the version check a writer working
      from a stale badge view would silently supersede a grant it never saw.
      The check is evaluated after state validations: the badge must be ACTIVE
      and expected_badge_version must equal the badge's current version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: training_currency_check
    trigger: "ready_evaluation (on training-completion record, STA clearance, clock set), and the replace renewal gate"
    algorithm: threshold
    formula: |
      required_courses(badge_class):
        SIDA    -> {SIDA_INITIAL (12mo), AOA_SAFETY (24mo)}
        STERILE -> {STERILE_INITIAL (12mo)}
        AOA     -> {SIDA_INITIAL (12mo), AOA_DRIVING (12mo)}
      A completion is STRICT-current at time T iff completion.expires_at > T
      (at T == expires_at exactly, the completion is lapsed).
      A completion is GRACE-current at time T iff completion.expires_at + 30 days > T.
      strict:   all required courses have a STRICT-current completion
      grace:    all required courses have a GRACE-current completion
    constants:
      RENEWAL_GRACE_DAYS: 30
      VALIDITY_MONTHS: { SIDA_INITIAL: 12, AOA_SAFETY: 24, AOA_DRIVING: 12, STERILE_INITIAL: 12 }
    variants:
      - name: strict
        when: "Initial issuance path: ready_evaluation gating READY, hence issue-badge"
        difference: "No grace; completion expires_at must be strictly in the future"
      - name: renewal_grace
        when: "Replacement path: POST /badging/badges/{id}/replace"
        difference: "A completion lapsed by at most 30 days still counts; identical data can pass renewal_grace while failing strict"
    precision: "datetime comparison, second precision"

  - name: badge_expiry_computation
    trigger: "badge issuance (initial variant) and replacement (renewal variant)"
    algorithm: constraint_propagation
    formula: |
      Let H = min over required courses c of horizon(c), where
        horizon(c) = completion.expires_at               (initial issuance)
        horizon(c) = completion.expires_at + 30 days     (renewal / replace)
      expires_at = min(issued_at + 24 months, H)
      Inputs: issued_at, the 24-month cap, and one horizon per required course
      (>= 3 inputs combined through nested min).
    constants:
      BADGE_VALIDITY_MONTHS: 24
      RENEWAL_GRACE_DAYS: 30
    precision: "datetime, second precision; calendar-month addition preserves day-of-month"

  - name: violation_points_and_suspension
    trigger: "violation sustain (accumulate + threshold) and dismiss (reverse)"
    algorithm: aggregation
    formula: |
      holder(badge) = badge.applicant_id
      windowed_points(P, T) = sum(v.points) over Violation v where
        v.status == SUSTAINED
        and badge(v.badge_id).applicant_id == P
        and v.occurred_at > T - 24 months        (strictly greater; a violation
                                                  exactly 24 months old is excluded)
      On sustain at time T:
        pts = windowed_points(holder, T)
        if pts >= 24: badge -> REVOKED (escort chain fires)
        elif pts >= 12: badge -> SUSPENDED (escort chain fires), tier:
          12 <= pts <= 17 -> suspended_until = T + 7 days
          18 <= pts <= 23 -> suspended_until = T + 30 days
        Boundary: exactly 12 points suspends; 11 does not.
      On dismiss: points recomputed; no automatic badge restoration.
    constants:
      POINTS: { FAILURE_TO_DISPLAY: 3, ESCORT_VIOLATION: 6, UNAUTHORIZED_AREA: 6, SECURITY_BREACH: 12 }
      SUSPEND_THRESHOLD: 12
      REVOKE_THRESHOLD: 24
      TIER_LOW_DAYS: 7
      TIER_HIGH_DAYS: 30
      WINDOW_MONTHS: 24
    precision: "integer points"

  - name: audit_recovery_rate
    trigger: "GET /badging/audit-cycles/{id} while OPEN (provisional variant, computed live); POST close (final variant, frozen)"
    algorithm: aggregation
    formula: |
      scope(S) = { Badge b : b.deactivated_at IN [window_start, window_end) }  (half-open)
      accounted(b) = (b.status == RETURNED) OR (b.status == VOIDED)
      due(S, T) = { b IN S : b.return_deadline != null AND b.return_deadline <= T }
      FINAL (at close):
        scoped_count = |scope|
        accounted_count = |{b IN scope : accounted(b)}|
        recovery_rate_pct = scoped_count == 0 ? 100.00
                          : round(100 * accounted_count / scoped_count, 2) round_half_up
        per_class_rates: for each badge_class present in scope, sorted by badge_class
          alphabetically: rate_c = round(100 * accounted_c / scoped_c, 2) round_half_up
        PINNED ROUNDING ORDER: the overall rate is aggregate-then-round over the full
        scope; it is NOT the mean of the rounded per-class rates.
        outcome = recovery_rate_pct >= 95.00 ? COMPLIANT : DEFICIENT
      PROVISIONAL (live while OPEN, T = current logical clock):
        due_scoped_count = |due(scope, T)|
        due_accounted_count = |{b IN due(scope, T) : accounted(b)}|
        recovery_rate_provisional_pct = due_scoped_count == 0 ? null
                          : round(100 * due_accounted_count / due_scoped_count, 2) round_half_up
    constants:
      RETURN_WINDOW_DAYS: 30
      RECOVERY_THRESHOLD_PCT: 95.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "AuditCycle OPEN; read live on GET"
        difference: "Denominator counts only badges whose 30-day return deadline has passed; null when none are due"
      - name: final
        when: "AuditCycle closed"
        difference: "Denominator is the entire deactivation scope regardless of due date; frozen at close"
    note: "Same scope data yields different rates under the two variants whenever not-yet-due unreturned badges exist"

  - name: sponsor_active_badge_count
    trigger: "computed on demand; consulted by issue-badge (quota) and replace (exempt)"
    algorithm: aggregation
    formula: |
      active_badge_count(S) = |{ Badge b : b.sponsor_id == S AND b.status IN {ACTIVE, SUSPENDED} }|
      issue-badge is rejected when active_badge_count >= active_badge_quota
      (at count == quota exactly, issuance is blocked; count == quota - 1 proceeds).
      replace is exempt from the quota check (it conserves the count).
    precision: "integer"

  - name: sponsor_delinquency_check
    trigger: "issue-badge"
    algorithm: threshold
    formula: |
      delinquent(S) = exists Badge b : b.sponsor_id == S
        AND b.status IN {LOST, STOLEN, EXPIRED, REVOKED}
        AND b.return_deadline <= current logical clock
      (overdue comparison is inclusive: due exactly at return_deadline)
      issue-badge is rejected when delinquent(sponsor) is true.
    precision: "datetime comparison, second precision"

  - name: access_decision
    trigger: "POST /badging/access-checks (every call is logged as an AccessEvent; denial is a 201 with decision DENIED, never an error response)"
    algorithm: constraint_propagation
    formula: |
      ZONES (fixed catalog):
        PUBLIC_TERMINAL:    allowed_badge_classes = [],                  escorted_entry_allowed = true
        STERILE_CONCOURSE:  allowed_badge_classes = [SIDA, STERILE],     escorted_entry_allowed = true
        AOA_MOVEMENT:       allowed_badge_classes = [SIDA, AOA],         escorted_entry_allowed = true
        SECURE_ID_AREA:     allowed_badge_classes = [SIDA],              escorted_entry_allowed = false
      decide(badge_id, zone_code, escortee_count, T):
        1. badge_id is null            -> DENIED / DENIED_NO_BADGE
        2. badge.status != ACTIVE      -> DENIED / DENIED_BADGE_INACTIVE
        3. badge.badge_class NOT IN zone.allowed_badge_classes
                                       -> DENIED / DENIED_ZONE_CLASS
        4. escortee_count > 0:
             a. zone.escorted_entry_allowed == false
                                       -> DENIED / DENIED_ESCORT_NOT_PERMITTED
             b. no GRANTED EscortPrivilege on badge
                                       -> DENIED / DENIED_ESCORT_NOT_PERMITTED
             c. escortee_count > privilege.max_escortees
                                       -> DENIED / DENIED_ESCORT_CAPACITY
             (escortee_count == max_escortees is allowed; boundary is inclusive)
        5. otherwise                   -> ALLOWED
      Inputs: badge status, badge class, zone class set, zone escort flag,
      escort privilege presence, escortee_count vs max_escortees (>= 3 inputs,
      nested conditional branches).
    precision: "integer comparison"

  - name: application_deadline
    trigger: "application creation (computes) and clock set (sweeps)"
    algorithm: threshold
    formula: |
      application_expires_at = submitted_at + 90 days
      On every clock set: each application in {SUBMITTED, STA_PENDING,
      PENDING_REQUIREMENTS, READY} with application_expires_at <= new clock
      transitions to EXPIRED (boundary inclusive).
    constants:
      APPLICATION_WINDOW_DAYS: 90
    precision: "datetime, second precision"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "X-User-Role must be one of the endpoint's allowed roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: auth
    check: "SponsorSignatory ownership: X-User-ID must equal the sponsor owning the target resource (applicant.sponsor_id, application.sponsor_id, badge.sponsor_id); on POST /applicants it must equal the body's sponsor_id"
    error_id: ERR_SPONSOR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /badging/applicants, POST /badging/applications, POST /badging/applications/{id}/withdraw, POST /badging/badges/{id}/report-lost (when called by SponsorSignatory)"

  - priority: 4
    category: existence
    check: "Resource IDs in path (validated left to right) and FK references in body must exist; unknown enum values and malformed fields rejected here as ERR_INVALID_REQUEST"
    error_id: "ERR_SPONSOR_NOT_FOUND | ERR_APPLICANT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_BADGE_NOT_FOUND | ERR_ESCORT_PRIVILEGE_NOT_FOUND | ERR_VIOLATION_NOT_FOUND | ERR_AUDIT_CYCLE_NOT_FOUND | ERR_INVALID_REQUEST"
    http_status: 404
    applies_to: all endpoints with path or body references

  - priority: 5
    category: state
    check: "Target entity must be in the state required by the transition (sponsor ACTIVE for sponsor-scoped creation; application SUBMITTED/STA_PENDING/READY per step; badge ACTIVE/SUSPENDED/inactive per action; audit OPEN; privilege GRANTED; violation RECORDED-or-SUSTAINED)"
    error_id: "ERR_SPONSOR_NOT_ACTIVE | ERR_APPLICATION_NOT_OPEN | ERR_APPLICATION_NOT_READY | ERR_BADGE_NOT_ACTIVE | ERR_BADGE_NOT_SUSPENDED | ERR_BADGE_NOT_INACTIVE | ERR_BADGE_NOT_REPLACEABLE | ERR_AUDIT_NOT_OPEN | ERR_ESCORT_NOT_GRANTED | ERR_VIOLATION_NOT_OPEN"
    http_status: 409
    applies_to: state transition endpoints

  - priority: 6
    category: state
    check: "OCC: expected_badge_version must equal the badge's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /badging/badges/{id}/escort-privileges"

  - priority: 7
    category: business_constraint
    check: "Uniqueness and segregation rules: one non-terminal application per applicant; no second ACTIVE/SUSPENDED/LOST/STOLEN badge of the same class whose window [issued_at, expires_at) overlaps issuance time (half-open: an old badge expiring exactly at issuance does not conflict); badge_number globally unique; reinstate requires caller != suspended_by; dismiss requires caller != recorded_by (RECORDED) or != sustained_by (SUSTAINED)"
    error_id: "ERR_OPEN_APPLICATION_EXISTS | ERR_ACTIVE_BADGE_EXISTS | ERR_BADGE_NUMBER_TAKEN | ERR_SEGREGATION_OF_DUTIES"
    http_status: 409
    applies_to: "POST /badging/applications, POST /badging/applications/{id}/issue-badge, POST /badging/badges/{id}/reinstate, POST /badging/violations/{id}/dismiss"

  - priority: 8
    category: business_temporal
    check: "Time-window rules: reinstate requires now >= suspended_until when set; new audit window must not overlap any existing cycle ([start,end) half-open; touching is allowed) and, if any cycle exists, must start exactly at the latest cycle's window_end (mandatory adjacency — gaps rejected; overlap checked before gap)"
    error_id: "ERR_SUSPENSION_NOT_SERVED | ERR_AUDIT_WINDOW_OVERLAP | ERR_AUDIT_WINDOW_GAP"
    http_status: 409
    applies_to: "POST /badging/badges/{id}/reinstate, POST /badging/audit-cycles"

  - priority: 9
    category: business_fiscal
    check: "Sponsor delinquency: sponsor has no badge in {LOST, STOLEN, EXPIRED, REVOKED} with return_deadline <= now"
    error_id: ERR_SPONSOR_DELINQUENT
    http_status: 409
    applies_to: "POST /badging/applications/{id}/issue-badge"

  - priority: 10
    category: business_fiscal
    check: "Sponsor quota: active_badge_count < active_badge_quota (blocked at count == quota)"
    error_id: ERR_SPONSOR_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /badging/applications/{id}/issue-badge"

# =============================================================================
# §1.5 API Endpoint Table (36 endpoints)
# =============================================================================
endpoints:
  # --- Sponsors ---
  - method: POST
    path: "/badging/sponsors"
    description: "Register a sponsoring employer/tenant organization"
    roles: [SecurityManager]
    code: 201
    input: [name, sponsor_code, active_badge_quota]
    output: Sponsor
    side_effects: ["status ACTIVE, active_badge_count 0"]

  - method: GET
    path: "/badging/sponsors/{id}"
    description: "Get a sponsor (includes computed active_badge_count)"
    roles: [SponsorSignatory, BadgingOfficer, SecurityManager, Auditor, AccessControlSystem]
    code: 200
    input: []
    output: Sponsor
    side_effects: []

  - method: POST
    path: "/badging/sponsors/{id}/suspend"
    description: "Suspend a sponsor; cascades to its applications and badges"
    roles: [SecurityManager]
    code: 200
    input: [reason]
    output: Sponsor
    side_effects:
      - "Sponsor -> SUSPENDED, suspended_at = now"
      - "Non-terminal applications of the sponsor -> DENIED (SPONSOR_SUSPENDED)"
      - "ACTIVE/SUSPENDED badges of the sponsor -> SUSPENDED (SPONSOR_SUSPENDED, suspended_until null); newly suspended badges revoke their GRANTED escort privileges (BADGE_SUSPENDED)"

  # --- Applicants ---
  - method: POST
    path: "/badging/applicants"
    description: "Register an applicant under the caller's sponsor (sponsor must be ACTIVE)"
    roles: [SponsorSignatory]
    code: 201
    input: [sponsor_id, full_name, date_of_birth, government_id_number]
    output: Applicant
    side_effects: []

  - method: GET
    path: "/badging/applicants/{id}"
    description: "Get an applicant"
    roles: [SponsorSignatory, BadgingOfficer, SecurityManager, Auditor, AccessControlSystem]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  - method: GET
    path: "/badging/sponsors/{id}/applicants"
    description: "List applicants of a sponsor (paginated; ordered by created_at ascending)"
    roles: [SponsorSignatory, BadgingOfficer, SecurityManager, Auditor, AccessControlSystem]
    code: 200
    input: ["limit?", "offset?"]
    output: "Applicant[]"
    side_effects: []

  # --- Applications ---
  - method: POST
    path: "/badging/applications"
    description: "Open a badge application for an applicant of the caller's sponsor"
    roles: [SponsorSignatory]
    code: 201
    input: [applicant_id, badge_class]
    output: BadgeApplication
    side_effects: ["status SUBMITTED; sponsor_id copied from applicant; submitted_at = now; application_expires_at = now + 90 days"]

  - method: GET
    path: "/badging/applications"
    description: "List applications (filterable; paginated; ordered by created_at ascending)"
    roles: [SponsorSignatory, BadgingOfficer, SecurityManager, Auditor, AccessControlSystem]
    code: 200
    input: ["applicant_id?", "sponsor_id?", "status?", "limit?", "offset?"]
    output: "BadgeApplication[]"
    side_effects: []

  - method: GET
    path: "/badging/applications/{id}"
    description: "Get an application"
    roles: [SponsorSignatory, BadgingOfficer, SecurityManager, Auditor, AccessControlSystem]
    code: 200
    input: []
    output: BadgeApplication
    side_effects: []

  - method: POST
    path: "/badging/applications/{id}/record-chrc"
    description: "Record fingerprint + CHRC submission and its adjudicated result in one step"
    roles: [BadgingOfficer]
    code: 200
    input: [fingerprint_submitted_at, outcome]
    output: BadgeApplication
    side_effects: ["PASS -> STA_PENDING (STA submitted as part of the same step); FAIL -> DENIED (CHRC_FAILED)"]

  - method: POST
    path: "/badging/applications/{id}/record-sta-result"
    description: "Record the TSA security threat assessment result"
    roles: [BadgingOfficer]
    code: 200
    input: [outcome]
    output: BadgeApplication
    side_effects: ["CLEARED -> PENDING_REQUIREMENTS, then ready_evaluation may immediately promote to READY; DENIED -> DENIED (STA_DENIED)"]

  - method: POST
    path: "/badging/applications/{id}/withdraw"
    description: "Sponsor withdraws a non-terminal application"
    roles: [SponsorSignatory]
    code: 200
    input: []
    output: BadgeApplication
    side_effects: ["status -> WITHDRAWN"]

  - method: POST
    path: "/badging/applications/{id}/issue-badge"
    description: "Issue the badge for a READY application (validations p5 state, p7 constraint, p9 delinquency, p10 quota)"
    roles: [BadgingOfficer]
    code: 201
    input: [badge_number]
    output: Badge
    side_effects: ["Application -> ISSUED with issued_badge_id; Badge created ACTIVE, expires_at per badge_expiry_computation (initial variant); sponsor active_badge_count +1"]

  # --- Training ---
  - method: POST
    path: "/badging/training-completions"
    description: "Record a completed training course for an applicant (expires_at computed from course validity)"
    roles: [BadgingOfficer]
    code: 201
    input: [applicant_id, course_code, completed_at]
    output: TrainingCompletion
    side_effects: ["expires_at = completed_at + validity_months(course_code); ready_evaluation re-run for the applicant's PENDING_REQUIREMENTS applications (may promote to READY)"]

  - method: GET
    path: "/badging/applicants/{id}/training-completions"
    description: "List an applicant's training completions (ordered by created_at ascending)"
    roles: [SponsorSignatory, BadgingOfficer, SecurityManager, Auditor, AccessControlSystem]
    code: 200
    input: ["limit?", "offset?"]
    output: "TrainingCompletion[]"
    side_effects: []

  # --- Badges ---
  - method: GET
    path: "/badging/badges"
    description: "List badges (filterable; paginated; ordered by created_at ascending)"
    roles: [SponsorSignatory, BadgingOfficer, SecurityManager, Auditor, AccessControlSystem]
    code: 200
    input: ["applicant_id?", "sponsor_id?", "application_id?", "superseded_by_badge_id?", "status?", "limit?", "offset?"]
    output: "Badge[]"
    side_effects: []

  - method: GET
    path: "/badging/badges/{id}"
    description: "Get a badge"
    roles: [SponsorSignatory, BadgingOfficer, SecurityManager, Auditor, AccessControlSystem]
    code: 200
    input: []
    output: Badge
    side_effects: []

  - method: POST
    path: "/badging/badges/{id}/suspend"
    description: "Manually suspend an ACTIVE badge"
    roles: [SecurityManager]
    code: 200
    input: [reason]
    output: Badge
    side_effects: ["Badge -> SUSPENDED (MANUAL, suspended_until null, suspended_by = caller); GRANTED escort privilege -> REVOKED (BADGE_SUSPENDED)"]

  - method: POST
    path: "/badging/badges/{id}/reinstate"
    description: "Reinstate a SUSPENDED badge; caller must differ from suspended_by (segregation of duties); suspension must be served"
    roles: [SecurityManager]
    code: 200
    input: []
    output: Badge
    side_effects: ["Badge -> ACTIVE; suspension fields cleared; escort privilege NOT restored"]

  - method: POST
    path: "/badging/badges/{id}/report-lost"
    description: "Report a badge lost or stolen"
    roles: [SponsorSignatory, BadgingOfficer]
    code: 200
    input: [report_type]
    output: Badge
    side_effects: ["Badge -> LOST or STOLEN; deactivated_at = now; return_deadline = now + 30 days; GRANTED escort privilege -> REVOKED (BADGE_DEACTIVATED); sponsor active_badge_count recomputed"]

  - method: POST
    path: "/badging/badges/{id}/mark-returned"
    description: "Record physical return of a deactivated badge"
    roles: [BadgingOfficer]
    code: 200
    input: []
    output: Badge
    side_effects: ["Badge (LOST|STOLEN|EXPIRED|REVOKED) -> RETURNED; returned_at = now"]

  - method: POST
    path: "/badging/badges/{id}/revoke"
    description: "Permanently revoke a badge"
    roles: [SecurityManager]
    code: 200
    input: [reason]
    output: Badge
    side_effects: ["Badge (ACTIVE|SUSPENDED) -> REVOKED; deactivated_at = now; return_deadline = now + 30 days; GRANTED escort privilege -> REVOKED (BADGE_DEACTIVATED); sponsor active_badge_count recomputed"]

  - method: POST
    path: "/badging/badges/{id}/replace"
    description: "Replace an ACTIVE/SUSPENDED/EXPIRED badge: old becomes VOIDED (accounted, no return obligation), new badge issued under the renewal-grace training variant; exempt from sponsor quota"
    roles: [BadgingOfficer]
    code: 201
    input: [badge_number]
    output: Badge
    side_effects: ["Old badge -> VOIDED, superseded_by_badge_id = new id, return_deadline null; old GRANTED escort privilege -> REVOKED (SUPERSEDED); new Badge ACTIVE with expires_at per badge_expiry_computation (renewal variant); sponsor active_badge_count unchanged"]

  # --- Escort privileges ---
  - method: POST
    path: "/badging/badges/{id}/escort-privileges"
    description: "Grant (or supersede) the badge's escort privilege; OCC-guarded by expected_badge_version"
    roles: [SecurityManager]
    code: 201
    input: [max_escortees, expected_badge_version]
    output: EscortPrivilege
    side_effects: ["New EscortPrivilege GRANTED; any previously GRANTED privilege -> REVOKED (SUPERSEDED); increments Badge.version by 1"]

  - method: GET
    path: "/badging/badges/{id}/escort-privileges"
    description: "List escort privileges of a badge, current and historical (ordered by created_at ascending)"
    roles: [SponsorSignatory, BadgingOfficer, SecurityManager, Auditor, AccessControlSystem]
    code: 200
    input: ["limit?", "offset?"]
    output: "EscortPrivilege[]"
    side_effects: []

  - method: POST
    path: "/badging/escort-privileges/{id}/revoke"
    description: "Manually revoke a GRANTED escort privilege"
    roles: [SecurityManager]
    code: 200
    input: []
    output: EscortPrivilege
    side_effects: ["Privilege -> REVOKED (MANUAL)"]

  # --- Access checks ---
  - method: POST
    path: "/badging/access-checks"
    description: "Evaluate a door/zone access attempt and log it; denial is a logged decision, not an error"
    roles: [AccessControlSystem]
    code: 201
    input: [zone_code, "badge_id?", "escortee_count?"]
    output: AccessEvent
    side_effects: ["AccessEvent created with decision and denial_reason per access_decision; occurred_at = now"]

  - method: GET
    path: "/badging/badges/{id}/access-events"
    description: "List access events for a badge (ordered by created_at ascending)"
    roles: [SponsorSignatory, BadgingOfficer, SecurityManager, Auditor, AccessControlSystem]
    code: 200
    input: ["limit?", "offset?"]
    output: "AccessEvent[]"
    side_effects: []

  # --- Violations ---
  - method: POST
    path: "/badging/violations"
    description: "Record a violation against a badge (points assigned from violation_type)"
    roles: [BadgingOfficer]
    code: 201
    input: [badge_id, violation_type, occurred_at]
    output: Violation
    side_effects: ["status RECORDED; recorded_by = caller"]

  - method: GET
    path: "/badging/badges/{id}/violations"
    description: "List violations for a badge (ordered by created_at ascending)"
    roles: [SponsorSignatory, BadgingOfficer, SecurityManager, Auditor, AccessControlSystem]
    code: 200
    input: ["limit?", "offset?"]
    output: "Violation[]"
    side_effects: []

  - method: POST
    path: "/badging/violations/{id}/sustain"
    description: "Sustain a recorded violation; recomputes holder points and may suspend (>=12) or revoke (>=24) the badge"
    roles: [SecurityManager]
    code: 200
    input: []
    output: Violation
    side_effects: ["Violation -> SUSTAINED; windowed points recomputed; threshold cascade to Badge (and its escort privilege) per violation_points_and_suspension"]

  - method: POST
    path: "/badging/violations/{id}/dismiss"
    description: "Dismiss a violation; caller must differ from recorded_by (RECORDED) or sustained_by (SUSTAINED)"
    roles: [SecurityManager]
    code: 200
    input: []
    output: Violation
    side_effects: ["Violation -> DISMISSED; points recomputed (removed); no automatic badge restoration"]

  # --- Audit cycles ---
  - method: POST
    path: "/badging/audit-cycles"
    description: "Open an annual audit cycle; window must not overlap existing cycles and must be contiguous with the latest cycle"
    roles: [Auditor]
    code: 201
    input: [window_start, window_end]
    output: AuditCycle
    side_effects: ["status OPEN; close-computed fields null"]

  - method: GET
    path: "/badging/audit-cycles/{id}"
    description: "Get an audit cycle; while OPEN includes live provisional recovery fields"
    roles: [SponsorSignatory, BadgingOfficer, SecurityManager, Auditor, AccessControlSystem]
    code: 200
    input: []
    output: AuditCycle
    side_effects: []

  - method: POST
    path: "/badging/audit-cycles/{id}/close"
    description: "Close the audit: freeze scope, recovery rate (aggregate-then-round), per-class rates, and outcome"
    roles: [Auditor]
    code: 200
    input: []
    output: AuditCycle
    side_effects: ["status -> CLOSED; final fields frozen; provisional fields null"]

  # --- Test-driving clock ---
  - method: POST
    path: "/badging/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Setting the clock atomically sweeps time-driven transitions: badge expirations (ACTIVE/SUSPENDED -> EXPIRED at expires_at), application expirations (non-terminal -> EXPIRED at application_expires_at), READY -> PENDING_REQUIREMENTS regression and PENDING_REQUIREMENTS -> READY promotion per ready_evaluation; sponsor active_badge_count recomputed accordingly."
    roles: [BadgingOfficer, SecurityManager, Auditor]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Applies all time-driven transitions listed in the description in a single step"]

# =============================================================================
# §1.6 Error Code Catalog (31 errors)
# =============================================================================
errors:
  # --- Authentication / authorization ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role is not in the endpoint's allowed roles" }
  - { id: ERR_SPONSOR_OWNERSHIP_MISMATCH, http: 403, condition: "SponsorSignatory X-User-ID does not match the sponsor owning the target resource (or body sponsor_id)" }

  # --- Existence / request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, unknown enum value, malformed datetime, max_escortees outside 1..10, or audit window_end <= window_start" }
  - { id: ERR_SPONSOR_NOT_FOUND, http: 404, condition: "No sponsor with the given id" }
  - { id: ERR_APPLICANT_NOT_FOUND, http: 404, condition: "No applicant with the given id" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "No application with the given id" }
  - { id: ERR_BADGE_NOT_FOUND, http: 404, condition: "No badge with the given id" }
  - { id: ERR_ESCORT_PRIVILEGE_NOT_FOUND, http: 404, condition: "No escort privilege with the given id" }
  - { id: ERR_VIOLATION_NOT_FOUND, http: 404, condition: "No violation with the given id" }
  - { id: ERR_AUDIT_CYCLE_NOT_FOUND, http: 404, condition: "No audit cycle with the given id" }

  # --- State preconditions ---
  - { id: ERR_SPONSOR_NOT_ACTIVE, http: 409, condition: "Sponsor must be ACTIVE (applicant/application creation, sponsor suspension)" }
  - { id: ERR_APPLICATION_NOT_OPEN, http: 409, condition: "Application not in the state the step requires (record-chrc needs SUBMITTED, record-sta-result needs STA_PENDING, withdraw needs any non-terminal state)" }
  - { id: ERR_APPLICATION_NOT_READY, http: 409, condition: "issue-badge requires the application to be READY" }
  - { id: ERR_BADGE_NOT_ACTIVE, http: 409, condition: "Badge must be ACTIVE (suspend, escort grant) or ACTIVE/SUSPENDED (report-lost, revoke)" }
  - { id: ERR_BADGE_NOT_SUSPENDED, http: 409, condition: "reinstate requires the badge to be SUSPENDED" }
  - { id: ERR_BADGE_NOT_INACTIVE, http: 409, condition: "mark-returned requires the badge to be LOST, STOLEN, EXPIRED, or REVOKED" }
  - { id: ERR_BADGE_NOT_REPLACEABLE, http: 409, condition: "replace requires ACTIVE/SUSPENDED/EXPIRED badge, renewal-grace-current training, and a future computed expires_at" }
  - { id: ERR_AUDIT_NOT_OPEN, http: 409, condition: "close requires the audit cycle to be OPEN" }
  - { id: ERR_ESCORT_NOT_GRANTED, http: 409, condition: "revoke requires the escort privilege to be GRANTED" }
  - { id: ERR_VIOLATION_NOT_OPEN, http: 409, condition: "sustain requires RECORDED; dismiss requires RECORDED or SUSTAINED" }

  # --- Business rules ---
  - { id: ERR_OPEN_APPLICATION_EXISTS, http: 409, condition: "Applicant already has a non-terminal application (SUBMITTED, STA_PENDING, PENDING_REQUIREMENTS, or READY)" }
  - { id: ERR_ACTIVE_BADGE_EXISTS, http: 409, condition: "Applicant already holds a badge of the same class in {ACTIVE, SUSPENDED, LOST, STOLEN} whose [issued_at, expires_at) window overlaps issuance time" }
  - { id: ERR_BADGE_NUMBER_TAKEN, http: 409, condition: "badge_number already in use by another badge" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Reinstate caller equals suspended_by, or dismiss caller equals recorded_by/sustained_by" }
  - { id: ERR_SUSPENSION_NOT_SERVED, http: 409, condition: "reinstate before suspended_until (violation-points suspensions only)" }
  - { id: ERR_SPONSOR_DELINQUENT, http: 409, condition: "Sponsor has a badge in {LOST, STOLEN, EXPIRED, REVOKED} whose return_deadline has passed (overdue unreturned)" }
  - { id: ERR_SPONSOR_QUOTA_EXCEEDED, http: 409, condition: "active_badge_count >= active_badge_quota at issuance" }
  - { id: ERR_AUDIT_WINDOW_OVERLAP, http: 409, condition: "New audit window overlaps an existing cycle's [window_start, window_end)" }
  - { id: ERR_AUDIT_WINDOW_GAP, http: 409, condition: "New audit window starts after the latest cycle's window_end (cycles must tile contiguously)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_badge_version does not match the badge's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SponsorSignatory
    description: "Authorized signatory of a sponsoring organization; submits applicants/applications and reports lost badges for its own sponsor only"
    identity: "entity_backed:Sponsor"
    exclusive_operations:
      - "POST /badging/applicants — register applicant (sponsor_id must equal X-User-ID)"
      - "POST /badging/applications — open application for own applicant"
      - "POST /badging/applications/{id}/withdraw — withdraw own application"
    shared_operations:
      - "POST /badging/badges/{id}/report-lost — report own sponsor's badge lost/stolen (shared with BadgingOfficer)"
      - "All GET endpoints"

  - name: BadgingOfficer
    description: "Badging office staff: processes background checks, training, issuance, replacement, returns, and violation intake"
    identity: "opaque"
    exclusive_operations:
      - "POST /badging/applications/{id}/record-chrc"
      - "POST /badging/applications/{id}/record-sta-result"
      - "POST /badging/applications/{id}/issue-badge"
      - "POST /badging/training-completions"
      - "POST /badging/badges/{id}/mark-returned"
      - "POST /badging/badges/{id}/replace"
      - "POST /badging/violations"
    shared_operations:
      - "POST /badging/badges/{id}/report-lost (shared with SponsorSignatory)"
      - "POST /badging/_clock/set_current_utc (shared with SecurityManager, Auditor)"
      - "All GET endpoints"

  - name: SecurityManager
    description: "Airport security manager: sponsor administration, badge suspension/revocation, escort privileges, violation adjudication"
    identity: "opaque"
    exclusive_operations:
      - "POST /badging/sponsors"
      - "POST /badging/sponsors/{id}/suspend"
      - "POST /badging/badges/{id}/suspend"
      - "POST /badging/badges/{id}/reinstate — segregation of duties: caller must differ from badge.suspended_by"
      - "POST /badging/badges/{id}/revoke"
      - "POST /badging/badges/{id}/escort-privileges"
      - "POST /badging/escort-privileges/{id}/revoke"
      - "POST /badging/violations/{id}/sustain"
      - "POST /badging/violations/{id}/dismiss — segregation of duties: caller must differ from recorded_by/sustained_by"
    shared_operations:
      - "POST /badging/_clock/set_current_utc"
      - "All GET endpoints"

  - name: Auditor
    description: "Compliance auditor running annual badge audits"
    identity: "opaque"
    exclusive_operations:
      - "POST /badging/audit-cycles"
      - "POST /badging/audit-cycles/{id}/close"
    shared_operations:
      - "POST /badging/_clock/set_current_utc"
      - "All GET endpoints"

  - name: AccessControlSystem
    description: "Physical access control system presenting badges at doors"
    identity: "opaque"
    exclusive_operations:
      - "POST /badging/access-checks"
    shared_operations:
      - "All GET endpoints"
