      - name: movement_scheduling_gated_by_permit_status
        grounds:
          - state_machines.MovementRecord.SCHEDULED_to_IN_TRANSIT
          - state_machines.MovementPermit.ISSUED_to_SUSPENDED
          - validations[priority=6]
        distinguishing_aspect: |
          Pair MovementRecord-x-MovementPermit (a different entity pair from
          Certificate-x-Premises): scheduling a movement is permitted only while
          the permit is ISSUED; once the outbreak cascade flips the permit to
          SUSPENDED, the same schedule request fails with ERR_PERMIT_NOT_ISSUED.
        test_recipe:
          setup:
            - "Issued certificate and ISSUED permit at clock 2026-08-10; ACTIVE zone covering origin (escalated) has suspended the permit"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch K", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 20, disease_status: "MONITORED" }
              as: ProgramAdmin
