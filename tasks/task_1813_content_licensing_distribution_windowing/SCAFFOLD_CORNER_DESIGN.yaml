            - "terminate: error_id == ERR_LICENSE_ALREADY_TERMINAL (HTTP 409)"

      - name: license_extend_from_terminated_returns_409
        claim_type: invalid_transition
        grounds: [state_machines.LicenseAgreement, "errors[ERR_LICENSE_NOT_EXTENDABLE]", "concurrency_rules[license-extend-stale-version]"]
        distinguishing_aspect: "Extend requires EXECUTED|ACTIVE; on a TERMINATED license the state check fires (ERR_LICENSE_NOT_EXTENDABLE) even with a fresh OCC version."
        test_recipe:
          setup: ["license L TERMINATED (was window [2026-08-01, 2026-12-01) on slot S, rights to 2027-08-01)"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 }, as: RightsManager, captures: { l_id: $.data.id } }
            - { call: "POST /licensing/license-agreements/${l_id}/terminate", as: RightsManager, captures: { lt_v: $.data.version } }
          trigger:
            - { call: "POST /licensing/license-agreements/${l_id}/extend", payload: { new_license_end: "2027-06-01T00:00:00Z", expected_license_version: "${lt_v}" }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LICENSE_NOT_EXTENDABLE (HTTP 409) — state checked before/alongside OCC"

      - name: license_activate_twice_returns_409
        claim_type: idempotency
        grounds: [state_machines.LicenseAgreement.EXECUTED_to_ACTIVE, "errors[ERR_LICENSE_NOT_EXECUTABLE]"]
        distinguishing_aspect: "Activation is a one-way edge: a second activate on the ACTIVE license fails with ERR_LICENSE_NOT_EXECUTABLE."
        test_recipe:
          setup: ["license L (window [2026-08-01, 2027-01-01)) EXECUTED with a DELIVERED batch (platform requires [4K_HDR], spec MEC-2.3)"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2027-01-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 }, as: RightsManager, captures: { l_id: $.data.id } }
            - { call: "POST /licensing/delivery-batches", payload: { license_id: "${l_id}", asset_manifest: ["4K_HDR"], metadata_spec_version: "MEC-2.3" }, as: RightsManager, captures: { b_id: $.data.id } }
            - { call: "POST /licensing/delivery-batches/${b_id}/submit", as: RightsManager }
            - { call: "POST /licensing/license-agreements/${l_id}/activate", as: RightsManager, captures: { st_a: $.data.license_status } }
          trigger:
            - { call: "POST /licensing/license-agreements/${l_id}/activate", as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "first activate succeeded (st_a == ACTIVE)"
            - "second activate: error_id == ERR_LICENSE_NOT_EXECUTABLE (HTTP 409)"

      - name: batch_submit_after_delivered_returns_409
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DeliveryBatch, "errors[ERR_BATCH_INVALID_STATE]"]
        distinguishing_aspect: "DELIVERED is terminal: submit on a DELIVERED batch fails with ERR_BATCH_INVALID_STATE."
        test_recipe:
          setup: ["DELIVERED batch B for license L (platform requires [4K_HDR], spec MEC-2.3)"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2027-01-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 }, as: RightsManager, captures: { l_id: $.data.id } }
            - { call: "POST /licensing/delivery-batches", payload: { license_id: "${l_id}", asset_manifest: ["4K_HDR"], metadata_spec_version: "MEC-2.3" }, as: RightsManager, captures: { b_id: $.data.id } }
            - { call: "POST /licensing/delivery-batches/${b_id}/submit", as: RightsManager, captures: { st_d: $.data.delivery_status } }
          trigger:
            - { call: "POST /licensing/delivery-batches/${b_id}/submit", as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "first submit delivered (st_d == DELIVERED)"
            - "second submit: error_id == ERR_BATCH_INVALID_STATE (HTTP 409)"

      - name: batch_resubmit_from_queued_returns_409
        claim_type: invalid_transition
        grounds: [state_machines.DeliveryBatch.REJECTED_to_QUEUED, "errors[ERR_BATCH_INVALID_STATE]"]
        distinguishing_aspect: "Resubmit is defined only from REJECTED; calling it on a fresh QUEUED batch fails with ERR_BATCH_INVALID_STATE."
        test_recipe:
          setup: ["QUEUED batch B for license L (never submitted)"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2027-01-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 }, as: RightsManager, captures: { l_id: $.data.id } }
            - { call: "POST /licensing/delivery-batches", payload: { license_id: "${l_id}", asset_manifest: ["4K_HDR"], metadata_spec_version: "MEC-2.3" }, as: RightsManager, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/delivery-batches/${b_id}/resubmit", payload: { asset_manifest: ["4K_HDR", "CC_EN"], metadata_spec_version: "MEC-2.3" }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BATCH_INVALID_STATE (HTTP 409); batch remains QUEUED"

      - name: statement_finalize_twice_returns_409
        claim_type: idempotency
        grounds: [state_machines.RoyaltyStatement.DRAFT_to_FINALIZED, "errors[ERR_STATEMENT_NOT_DRAFT]"]
        distinguishing_aspect: "Finalize is a one-way edge; second finalize fails with ERR_STATEMENT_NOT_DRAFT."
        test_recipe:
          setup: ["holder H; DRAFT statement ST (period [2026-07-01, 2026-08-01], BY_REPORT_DATE, zero reports in scope)"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/royalty-statements", payload: { rights_holder_id: "${h_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", attribution_mode: "BY_REPORT_DATE" }, as: FinanceAnalyst, captures: { st_id: $.data.id } }
            - { call: "POST /licensing/royalty-statements/${st_id}/finalize", as: FinanceAnalyst, as_user_id: "fin-ana-1" }
          trigger:
            - { call: "POST /licensing/royalty-statements/${st_id}/finalize", as: FinanceAnalyst, as_user_id: "fin-ana-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STATEMENT_NOT_DRAFT (HTTP 409)"

      - name: statement_mark_paid_from_draft_returns_409
        claim_type: precondition_enforcement
        grounds: [state_machines.RoyaltyStatement.FINALIZED_to_PAID, "errors[ERR_STATEMENT_NOT_FINALIZED]"]
        distinguishing_aspect: "Mark-paid requires FINALIZED; on a DRAFT statement it fails with ERR_STATEMENT_NOT_FINALIZED (the SoD check is never reached)."
        test_recipe:
          setup: ["holder H; DRAFT statement ST"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/royalty-statements", payload: { rights_holder_id: "${h_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", attribution_mode: "BY_REPORT_DATE" }, as: FinanceAnalyst, captures: { st_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/royalty-statements/${st_id}/mark-paid", as: FinanceController, as_user_id: "fin-ctl-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STATEMENT_NOT_FINALIZED (HTTP 409)"

      - name: statement_finalize_snapshots_totals
        claim_type: side_effect_execution
        grounds: [state_machines.RoyaltyStatement.DRAFT_to_FINALIZED, calculations.statement_attribution]
        distinguishing_aspect: "Finalize stores finalized_by_user_id and freezes the totals: a report submitted after finalization does not change the FINALIZED statement even though it falls inside the statement period."
        test_recipe:
          setup:
            - "holder H (share 100); REVENUE_SHARE 50 license L (window [2026-08-01, 2027-08-01))"
            - "R1 gross 1000 submitted at default clock (payable 500); statement ST [2026-07-01, 2026-08-01] BY_REPORT_DATE finalized by fin-ana-1 (due 500)"
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2027-08-01T00:00:00Z", exclusive: false, fee_model: "REVENUE_SHARE", revenue_share_pct: 50 }, as: RightsManager, captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "POST /licensing/license-agreements/${l_id}/revenue-reports", payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-31T00:00:00Z", gross_revenue_cents: 1000, expected_license_version: "${l_v}" }, as: PlatformBuyer, as_user_id: "${p_id}" }
            - { call: "POST /licensing/royalty-statements", payload: { rights_holder_id: "${h_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", attribution_mode: "BY_REPORT_DATE" }, as: FinanceAnalyst, captures: { st_id: $.data.id } }
            - { call: "POST /licensing/royalty-statements/${st_id}/finalize", as: FinanceAnalyst, as_user_id: "fin-ana-1", captures: { st_fin_by: $.data.finalized_by_user_id, st_due: $.data.holder_royalty_due_cents } }
          trigger:
            - { call: "GET /licensing/license-agreements/${l_id}", as: RightsManager, captures: { l_v2: $.data.version } }
            - { call: "POST /licensing/license-agreements/${l_id}/revenue-reports", payload: { period_start: "2026-07-15T00:00:00Z", period_end: "2026-07-31T00:00:00Z", gross_revenue_cents: 2000, expected_license_version: "${l_v2}" }, as: PlatformBuyer, as_user_id: "${p_id}" }
            - { call: "GET /licensing/royalty-statements/${st_id}", as: FinanceAnalyst, captures: { st_due2: $.data.holder_royalty_due_cents, st_status: $.data.statement_status } }
          assert:
            - "finalize recorded finalized_by_user_id == fin-ana-1 and due == 500 at finalize time"
            - "after the late report (payable 1000), statement still shows holder_royalty_due_cents == 500 and statement_status == FINALIZED (snapshot semantics)"

  # ======================================================== calculations ====
  - section: calculations
    instances:
      - name: discount_tier_boundary_exactly_2000000_cents
        claim_type: correct_result
        grounds: [calculations.package_volume_discount, entities.AvailPackage.fields.discount_pct]
        distinguishing_aspect: "Tier boundary is inclusive (>=): an accepted guaranteed total of exactly 2000000 cents selects the 10% tier (not 5%); allocation is exact: L1 discount 150000, L2 discount 50000."
        test_recipe:
          setup:
            - "slots S1 (SVOD) and S2 (AVOD), rights [2026-08-01, 2027-08-01); OFFERED package PKG with L1 FLAT_FEE 1500000 on S1 and L2 MINIMUM_GUARANTEE 500000 share 40 on S2, both windows [2026-09-01T00:00:00Z, 2026-12-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s1_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "AVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s2_id: $.data.id } }
            - { call: "POST /licensing/avail-packages", payload: { platform_id: "${p_id}", name: "PKG", offer_expires_at: "2026-12-01T00:00:00Z", lines: [ { slot_id: "${s1_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 1500000 }, { slot_id: "${s2_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "MINIMUM_GUARANTEE", minimum_guarantee_cents: 500000, revenue_share_pct: 40 } ] }, as: RightsManager, captures: { pkg_id: $.data.id } }
            - { call: "POST /licensing/avail-packages/${pkg_id}/offer", as: RightsManager }
          trigger:
            - { call: "POST /licensing/avail-packages/${pkg_id}/accept", payload: { accepted_slot_ids: ["${s1_id}", "${s2_id}"] }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { dpct: $.data.discount_pct, dc: $.data.discount_cents, net: $.data.net_total_cents, lic1: "$.data.lines[0].created_license_id", lic2: "$.data.lines[1].created_license_id" } }
            - { call: "GET /licensing/license-agreements/${lic1}", as: RightsManager, captures: { fee1: $.data.allocated_fee_cents } }
            - { call: "GET /licensing/license-agreements/${lic2}", as: RightsManager, captures: { fee2: $.data.allocated_fee_cents } }
          assert:
            - "discount_pct == 10   # gross 2000000 >= 2000000 -> second tier, boundary inclusive"
            - "discount_cents == 200000 and net_total_cents == 1800000"
            - "L1 allocated_fee_cents == 1350000 and L2 allocated_fee_cents == 450000"
            - "package_status == ACCEPTED (all lines accepted)"

      - name: holdback_until_derived_with_buffer_constant
        claim_type: constants_applied
        grounds: [calculations.holdback_derivation, entities.LicenseAgreement.fields.holdback_until]
        distinguishing_aspect: "The 30-day SVOD buffer constant is applied to license_end exactly (2026-12-01 -> 2026-12-31) for exclusive licenses; an exclusive AVOD license (empty matrix row) gets holdback_until null."
        test_recipe:
          setup: ["slots SV (SVOD) and AV (AVOD), same title US/en, rights [2026-08-01, 2028-01-01)"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2028-01-01T00:00:00Z" }, as: RightsManager, captures: { sv_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "AVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2028-01-01T00:00:00Z" }, as: RightsManager, captures: { av_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${sv_id}", platform_id: "${p_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: true, fee_model: "FLAT_FEE", flat_fee_cents: 300000 }, as: RightsManager, captures: { hb1: $.data.holdback_until } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${av_id}", platform_id: "${p_id}", license_start: "2027-01-01T00:00:00Z", license_end: "2027-06-01T00:00:00Z", exclusive: true, fee_model: "FLAT_FEE", flat_fee_cents: 90000 }, as: RightsManager, captures: { hb2: $.data.holdback_until } }
          assert:
            - "SVOD exclusive: holdback_until == 2026-12-31T00:00:00Z (license_end + 30 days)"
            - "AVOD exclusive: holdback_until == null (AVOD blocks no other window)"
            - "second license created successfully because 2027-01-01 > 2026-12-31 (outside the first license's holdback)"

      - name: sweep_expires_license_and_executes_notice
        claim_type: correct_result
        grounds: [calculations.expiration_sweep, state_machines.TakedownNotice.SCHEDULED_to_EXECUTED]
        distinguishing_aspect: "One clock advance past license_end performs the whole scheduled takedown: license EXPIRED, its SCHEDULED notice EXECUTED with executed_at equal to the new clock, and the sweep response reports the counts."
        test_recipe:
          setup: ["license L window [2026-08-01T00:00:00Z, 2026-09-15T00:00:00Z) EXECUTED; its auto-created notice SCHEDULED at 2026-09-15"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2026-09-15T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 }, as: RightsManager, captures: { l_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: RightsManager, captures: { c_now: $.data.current_utc, c_lexp: $.data.licenses_expired, c_nexec: $.data.notices_executed } }
            - { call: "GET /licensing/license-agreements/${l_id}", as: RightsManager, captures: { l_status: $.data.license_status } }
            - { call: "GET /licensing/takedown-notices?license_id=${l_id}", as: RightsManager, captures: { n_status: "$.data[0].notice_status", n_exec: "$.data[0].executed_at", n_sched: "$.data[0].scheduled_for" } }
          assert:
            - "clock response: current_utc == 2026-10-01T00:00:00Z, licenses_expired == 1, notices_executed == 1"
            - "license_status == EXPIRED"
            - "notice: notice_status == EXECUTED, scheduled_for == 2026-09-15T00:00:00Z (== license_end), executed_at == 2026-10-01T00:00:00Z"

      - name: recoupment_waterfall_correctness
        claim_type: correct_result
        grounds: [calculations.recoupment_split]
        excluded_because:
          difficulty_instance: recoupment_waterfall_min_interaction
          rationale: "Correct-result and boundary coverage asserted by the §1.8 instance (three-report waterfall with exact-exhaustion)."
      - name: statement_attribution_variant_coverage
        claim_type: variant_divergence
        grounds: [calculations.statement_attribution]
        excluded_because:
          difficulty_instance: statement_attribution_mode_divergence
          rationale: "Both attribution variants are exercised with diverging totals in the named §1.8 instance."
      - name: termination_credit_variant_coverage
        claim_type: variant_divergence
        grounds: [calculations.termination_credit]
        excluded_because:
          difficulty_instance: termination_credit_proration_divergence
          rationale: "Both proration variants produce pinned diverging credits in the named §1.8 instance."
      - name: package_discount_ordering_coverage
        claim_type: correct_result
        grounds: [calculations.package_volume_discount]
        excluded_because:
          difficulty_instance: package_discount_evaluation_order
          rationale: "Gross-keyed tier selection and pro-rata allocation asserted in the named §1.8 instance."

  # ========================================================== validations ====
  - section: validations
    instances:
      - name: slot_create_in_embargoed_territory_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_TERRITORY_EMBARGOED]"]
        distinguishing_aspect: "Creating a slot whose territory_code is in its title's embargoed_territories fails the compliance check even though all other inputs are valid."
        test_recipe:
          setup: ["title T with embargoed_territories [CN]; holder H exists"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024, embargoed_territories: ["CN"] }, as: RightsManager, captures: { t_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "CN", language_code: "zh", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TERRITORY_EMBARGOED (HTTP 422)"

      - name: duplicate_slot_tuple_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_SLOT]"]
        distinguishing_aspect: "A second AVAILABLE slot with the same (title, territory, language, window_type) tuple is rejected."
        test_recipe:
          setup: ["slot S (T/H, US/en/SVOD) exists and is AVAILABLE"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-09-01T00:00:00Z", sellable_to: "2027-06-01T00:00:00Z" }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_SLOT (HTTP 409) even though the rights periods differ"

      - name: duplicate_slot_tuple_freed_after_withdraw
        claim_type: satisfaction_pass
        grounds: ["validations[priority=8]", state_machines.RightsSlot.AVAILABLE_to_WITHDRAWN]
        distinguishing_aspect: "The uniqueness constraint ranges only over AVAILABLE/ENCUMBERED slots: after withdrawing the first slot, the same tuple can be recreated."
        test_recipe:
          setup: ["slot S (T/H, US/en/SVOD) withdrawn"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s1_id: $.data.id } }
            - { call: "POST /licensing/rights-slots/${s1_id}/withdraw", as: RightsManager }
          trigger:
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s2_id: $.data.id, s2_st: $.data.slot_status } }
          assert:
            - "second create succeeds (201) with a new id != ${s1_id} and slot_status == AVAILABLE"

      - name: accept_with_empty_slot_list_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_EMPTY_ACCEPTANCE]"]
        distinguishing_aspect: "An accept with an empty accepted_slot_ids array is rejected — accepting nothing is not a valid decline (decline has its own endpoint)."
        test_recipe:
          setup: ["OFFERED package PKG with one line on slot S"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/avail-packages", payload: { platform_id: "${p_id}", name: "PKG", offer_expires_at: "2026-12-01T00:00:00Z", lines: [ { slot_id: "${s_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 } ] }, as: RightsManager, captures: { pkg_id: $.data.id } }
            - { call: "POST /licensing/avail-packages/${pkg_id}/offer", as: RightsManager }
          trigger:
            - { call: "POST /licensing/avail-packages/${pkg_id}/accept", payload: { accepted_slot_ids: [] }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EMPTY_ACCEPTANCE (HTTP 422); package stays OFFERED"

      - name: accept_with_foreign_slot_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_LINE_NOT_IN_PACKAGE]"]
        distinguishing_aspect: "accepted_slot_ids naming a real slot that is not part of the package fails referential membership (ERR_LINE_NOT_IN_PACKAGE), not a not-found error."
        test_recipe:
          setup: ["OFFERED package PKG with a line on S1 only; S2 exists (AVOD) but is not in the package"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s1_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "AVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s2_id: $.data.id } }
            - { call: "POST /licensing/avail-packages", payload: { platform_id: "${p_id}", name: "PKG", offer_expires_at: "2026-12-01T00:00:00Z", lines: [ { slot_id: "${s1_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 } ] }, as: RightsManager, captures: { pkg_id: $.data.id } }
            - { call: "POST /licensing/avail-packages/${pkg_id}/offer", as: RightsManager }
          trigger:
            - { call: "POST /licensing/avail-packages/${pkg_id}/accept", payload: { accepted_slot_ids: ["${s2_id}"] }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LINE_NOT_IN_PACKAGE (HTTP 422)"

      - name: package_with_duplicate_line_slots_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_DUPLICATE_LINE_SLOT]"]
        distinguishing_aspect: "Two lines referencing the same slot inside one package are rejected at creation."
        test_recipe:
          setup: ["platform P and slot S exist"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/avail-packages", payload: { platform_id: "${p_id}", name: "PKG", offer_expires_at: "2026-12-01T00:00:00Z", lines: [ { slot_id: "${s_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 }, { slot_id: "${s_id}", license_start: "2026-10-01T00:00:00Z", license_end: "2027-01-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 20000 } ] }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_LINE_SLOT (HTTP 422)"

      - name: flat_fee_license_missing_fee_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_FEE_STRUCTURE_INVALID]"]
        distinguishing_aspect: "fee_model FLAT_FEE without flat_fee_cents violates the fee-structure rule (all window/conflict checks otherwise pass)."
        test_recipe:
          setup: ["slot S (AVAILABLE), platform P exist"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE" }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FEE_STRUCTURE_INVALID (HTTP 422)"

      - name: mg_license_without_share_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_FEE_STRUCTURE_INVALID]"]
        distinguishing_aspect: "MINIMUM_GUARANTEE requires revenue_share_pct in (0,100]; omitting it (or sending 0) is invalid."
        test_recipe:
          setup: ["slot S (AVAILABLE), platform P exist"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "MINIMUM_GUARANTEE", minimum_guarantee_cents: 50000, revenue_share_pct: 0 }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FEE_STRUCTURE_INVALID (HTTP 422)"

      - name: holder_share_pct_out_of_range_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_FEE_STRUCTURE_INVALID]"]
        distinguishing_aspect: "royalty_share_pct must be in (0,100]; 150 is rejected at holder creation."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 150 }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FEE_STRUCTURE_INVALID (HTTP 422)"

      - name: report_with_future_period_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_REPORT_PERIOD_FUTURE]"]
        distinguishing_aspect: "A report whose period_end is after the logical clock (future-dated revenue) is rejected even on a reportable license with a fresh OCC version."
        test_recipe:
          setup: ["REVENUE_SHARE 50 license L EXECUTED at default clock 2026-08-01"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2027-08-01T00:00:00Z", exclusive: false, fee_model: "REVENUE_SHARE", revenue_share_pct: 50 }, as: RightsManager, captures: { l_id: $.data.id, l_v: $.data.version } }
          trigger:
            - { call: "POST /licensing/license-agreements/${l_id}/revenue-reports", payload: { period_start: "2026-08-15T00:00:00Z", period_end: "2026-09-15T00:00:00Z", gross_revenue_cents: 1000, expected_license_version: "${l_v}" }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REPORT_PERIOD_FUTURE (HTTP 422) — period_end 2026-09-15 > clock 2026-08-01"

      - name: report_with_zero_gross_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_NONPOSITIVE_REVENUE]"]
        distinguishing_aspect: "gross_revenue_cents == 0 is rejected (boundary: the fiscal floor is strict > 0) on an otherwise fully reportable license."
        test_recipe:
          setup: ["REVENUE_SHARE 50 license L EXECUTED at default clock"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2027-08-01T00:00:00Z", exclusive: false, fee_model: "REVENUE_SHARE", revenue_share_pct: 50 }, as: RightsManager, captures: { l_id: $.data.id, l_v: $.data.version } }
          trigger:
            - { call: "POST /licensing/license-agreements/${l_id}/revenue-reports", payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-31T00:00:00Z", gross_revenue_cents: 0, expected_license_version: "${l_v}" }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NONPOSITIVE_REVENUE (HTTP 422)"

      - name: activate_before_window_start_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_LICENSE_NOT_STARTED]"]
        distinguishing_aspect: "A delivered batch alone does not permit activation: with license_start in the future the temporal gate fires (ERR_LICENSE_NOT_STARTED)."
        test_recipe:
          setup: ["license L window [2026-10-01T00:00:00Z, 2027-01-01T00:00:00Z) EXECUTED at default clock 2026-08-01; DELIVERED batch exists"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-10-01T00:00:00Z", license_end: "2027-01-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 }, as: RightsManager, captures: { l_id: $.data.id } }
            - { call: "POST /licensing/delivery-batches", payload: { license_id: "${l_id}", asset_manifest: ["4K_HDR"], metadata_spec_version: "MEC-2.3" }, as: RightsManager, captures: { b_id: $.data.id } }
            - { call: "POST /licensing/delivery-batches/${b_id}/submit", as: RightsManager }
          trigger:
            - { call: "POST /licensing/license-agreements/${l_id}/activate", as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LICENSE_NOT_STARTED (HTTP 422)"

      - name: license_window_outside_rights_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_WINDOW_OUTSIDE_RIGHTS]"]
        distinguishing_aspect: "Single-failure case: license_end beyond the slot's sellable_to is rejected even with no conflicting licenses."
        test_recipe:
          setup: ["slot S with rights [2026-08-01T00:00:00Z, 2027-01-01T00:00:00Z); platform P"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-01-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2027-06-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_WINDOW_OUTSIDE_RIGHTS (HTTP 422)"

      - name: offer_with_past_expiry_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_OFFER_WINDOW_PAST]"]
        distinguishing_aspect: "offer_expires_at at/before the logical clock is rejected at offer time (the package may be created in DRAFT but can never be offered)."
        test_recipe:
          setup: ["DRAFT package PKG (one valid line on AVAILABLE slot S) with offer_expires_at 2026-07-01T00:00:00Z (before the default clock)"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/avail-packages", payload: { platform_id: "${p_id}", name: "PKG", offer_expires_at: "2026-07-01T00:00:00Z", lines: [ { slot_id: "${s_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 } ] }, as: RightsManager, captures: { pkg_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/avail-packages/${pkg_id}/offer", as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OFFER_WINDOW_PAST (HTTP 422); package stays DRAFT"

      - name: statement_period_overlap_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_STATEMENT_PERIOD_OVERLAP]"]
        distinguishing_aspect: "A second DRAFT statement for the same holder whose closed period interval intersects an existing DRAFT statement's period is rejected."
        test_recipe:
          setup: ["holder H; DRAFT statement ST1 with period [2026-07-01, 2026-08-01]"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/royalty-statements", payload: { rights_holder_id: "${h_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", attribution_mode: "BY_REPORT_DATE" }, as: FinanceAnalyst, captures: { st1_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/royalty-statements", payload: { rights_holder_id: "${h_id}", period_start: "2026-07-15T00:00:00Z", period_end: "2026-08-15T00:00:00Z", attribution_mode: "BY_USAGE_PERIOD" }, as: FinanceAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STATEMENT_PERIOD_OVERLAP (HTTP 409) regardless of differing attribution_mode"

      - name: clock_regression_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_CLOCK_REGRESSION]"]
        distinguishing_aspect: "The logical clock is monotonic: setting it before the current value (default 2026-08-01) is rejected and the clock does not move."
        test_recipe:
          setup: ["empty DB; clock at startup default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /licensing/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLOCK_REGRESSION (HTTP 422)"

      - name: license_create_on_withdrawn_slot_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_SLOT_NOT_AVAILABLE]"]
        distinguishing_aspect: "Direct license creation on a WITHDRAWN slot fails the state gate (ERR_SLOT_NOT_AVAILABLE) even when the window lies inside the rights period."
        test_recipe:
          setup: ["slot S withdrawn; platform P exists"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/rights-slots/${s_id}/withdraw", as: RightsManager }
          trigger:
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SLOT_NOT_AVAILABLE (HTTP 409)"

  # ============================================================= endpoints ====
  - section: endpoints
    instances:
      - name: license_list_filtered_by_slot
        claim_type: standard_crud
        grounds: [entities.LicenseAgreement.fields.slot_id]
        distinguishing_aspect: "The slot_id filter on GET /licensing/license-agreements returns exactly the licenses of that slot (2 of 3), demonstrating the FK reverse-reachability filtered-list form."
        test_recipe:
          setup: ["slots S1 (SVOD) and S2 (AVOD); two non-exclusive licenses on S1 (windows [2026-08-01, 2026-12-01) and [2026-12-01, 2027-04-01)), one on S2"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s1_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "AVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s2_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s1_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 }, as: RightsManager, captures: { la_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s1_id}", platform_id: "${p_id}", license_start: "2026-12-01T00:00:00Z", license_end: "2027-04-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 }, as: RightsManager, captures: { lb_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s2_id}", platform_id: "${p_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 }, as: RightsManager, captures: { lc_id: $.data.id } }
          trigger:
            - { call: "GET /licensing/license-agreements?slot_id=${s1_id}", as: RightsManager }
            - { call: "GET /licensing/license-agreements?slot_id=${s2_id}", as: RightsManager }
          assert:
            - "filter slot_id == ${s1_id}: total_count == 2 (licenses ${la_id}, ${lb_id})"
            - "filter slot_id == ${s2_id}: total_count == 1 (license ${lc_id})"

      - name: accept_creates_licenses_and_notices_atomically
        claim_type: action_endpoint
        grounds: [state_machines.AvailPackage.OFFERED_to_ACCEPTED, entities.TakedownNotice]
        distinguishing_aspect: "One accept of a two-line package creates exactly two EXECUTED licenses (no discount under the 500000 floor) and exactly one SCHEDULED takedown notice per license with scheduled_for == license_end."
        test_recipe:
          setup: ["OFFERED package PKG with L1 FLAT_FEE 100000 on S1 (SVOD) and L2 FLAT_FEE 50000 on S2 (AVOD), both windows [2026-09-01T00:00:00Z, 2026-12-01T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s1_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "AVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s2_id: $.data.id } }
            - { call: "POST /licensing/avail-packages", payload: { platform_id: "${p_id}", name: "PKG", offer_expires_at: "2026-12-01T00:00:00Z", lines: [ { slot_id: "${s1_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 100000 }, { slot_id: "${s2_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 50000 } ] }, as: RightsManager, captures: { pkg_id: $.data.id } }
            - { call: "POST /licensing/avail-packages/${pkg_id}/offer", as: RightsManager }
          trigger:
            - { call: "POST /licensing/avail-packages/${pkg_id}/accept", payload: { accepted_slot_ids: ["${s1_id}", "${s2_id}"] }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { st: $.data.package_status, lic1: "$.data.lines[0].created_license_id", lic2: "$.data.lines[1].created_license_id", dc: $.data.discount_cents } }
            - { call: "GET /licensing/license-agreements?package_id=${pkg_id}", as: RightsManager }
            - { call: "GET /licensing/takedown-notices?license_id=${lic1}", as: RightsManager, captures: { n1_status: "$.data[0].notice_status", n1_sched: "$.data[0].scheduled_for" } }
            - { call: "GET /licensing/takedown-notices?license_id=${lic2}", as: RightsManager, captures: { n2_status: "$.data[0].notice_status", n2_sched: "$.data[0].scheduled_for" } }
          assert:
            - "package_status == ACCEPTED; discount_cents == 0 (guaranteed 150000 below the 500000 tier floor)"
            - "GET by package_id returns total_count == 2, both license_status == EXECUTED"
            - "each license has exactly one notice: SCHEDULED with scheduled_for == 2026-12-01T00:00:00Z (== license_end)"

      - name: error_envelope_returns_typed_error_body
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Error responses use the fixed envelope: response_type == 'error' and data carries error_id plus a human-readable message; success responses carry meta.api_request_id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /licensing/titles/11111111-1111-1111-1111-111111111111", as: RightsManager, captures: { err: $.data.error_id, msg: $.data.message } }
          assert:
            - "response_type == 'error'; data.error_id == ERR_TITLE_NOT_FOUND; data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

  # ================================================================ errors ====
  - section: errors
    instances:
      - name: request_without_role_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers is rejected 401 before any role, existence, or business check runs."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and HTTP status == 401"

      - name: reverse_nonexistent_report_returns_404
        claim_type: violation_to_error
        grounds: ["errors[ERR_REPORT_NOT_FOUND]"]
        distinguishing_aspect: "The reverse action (not just GET) resolves the path id first: unknown report id -> ERR_REPORT_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /licensing/revenue-reports/11111111-1111-1111-1111-111111111111/reverse", as: FinanceAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REPORT_NOT_FOUND and HTTP status == 404"

  # ================================================================== rbac ====
  - section: rbac
    instances:
      - name: platform_buyer_cannot_create_title
        claim_type: exclusive_operation_denial
        grounds: ["roles[RightsManager].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Catalog writes are RightsManager-exclusive; a PlatformBuyer gets ERR_FORBIDDEN even with a well-formed payload."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: PlatformBuyer, as_user_id: "11111111-1111-1111-1111-111111111111", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN and HTTP status == 403"

      - name: platform_buyer_cannot_withdraw_package
        claim_type: exclusive_operation_denial
        grounds: ["roles[RightsManager].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Package withdraw is studio-side only; the platform that owns the offer still cannot withdraw it."
        test_recipe:
          setup: ["OFFERED package PKG for platform P (one line on slot S)"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/avail-packages", payload: { platform_id: "${p_id}", name: "PKG", offer_expires_at: "2026-12-01T00:00:00Z", lines: [ { slot_id: "${s_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 } ] }, as: RightsManager, captures: { pkg_id: $.data.id } }
            - { call: "POST /licensing/avail-packages/${pkg_id}/offer", as: RightsManager }
          trigger:
            - { call: "POST /licensing/avail-packages/${pkg_id}/withdraw", as: PlatformBuyer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (HTTP 403); package remains OFFERED"

      - name: finance_controller_cannot_finalize_statement
        claim_type: exclusive_operation_denial
        grounds: ["roles[FinanceAnalyst].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Finalize is FinanceAnalyst-exclusive; the FinanceController (who pays) cannot also finalize — the two duties sit in different roles."
        test_recipe:
          setup: ["holder H; DRAFT statement ST"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/royalty-statements", payload: { rights_holder_id: "${h_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", attribution_mode: "BY_REPORT_DATE" }, as: FinanceAnalyst, captures: { st_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/royalty-statements/${st_id}/finalize", as: FinanceController, as_user_id: "fin-ctl-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (HTTP 403); statement stays DRAFT"

      - name: rights_manager_cannot_submit_revenue_report
        claim_type: exclusive_operation_denial
        grounds: ["roles[PlatformBuyer].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Revenue reports come from the platform only; studio-side RightsManager gets ERR_FORBIDDEN despite a fully valid payload and fresh OCC version."
        test_recipe:
          setup: ["REVENUE_SHARE 50 license L EXECUTED"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2027-08-01T00:00:00Z", exclusive: false, fee_model: "REVENUE_SHARE", revenue_share_pct: 50 }, as: RightsManager, captures: { l_id: $.data.id, l_v: $.data.version } }
          trigger:
            - { call: "POST /licensing/license-agreements/${l_id}/revenue-reports", payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-31T00:00:00Z", gross_revenue_cents: 1000, expected_license_version: "${l_v}" }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (HTTP 403)"

      - name: platform_buyer_cannot_accept_other_platforms_package
        claim_type: ownership_denial
        grounds: ["validations[priority=2]", "roles[PlatformBuyer]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Ownership is pinned to the entity-backed identity: a buyer whose X-User-ID is platform PB cannot accept a package addressed to platform PA."
        test_recipe:
          setup: ["platforms PA and PB; OFFERED package PKG addressed to PA (one line on slot S)"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "PA", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { pa_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "PB", platform_type: "AVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["HD"] }, as: RightsManager, captures: { pb_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/avail-packages", payload: { platform_id: "${pa_id}", name: "PKG", offer_expires_at: "2026-12-01T00:00:00Z", lines: [ { slot_id: "${s_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 } ] }, as: RightsManager, captures: { pkg_id: $.data.id } }
            - { call: "POST /licensing/avail-packages/${pkg_id}/offer", as: RightsManager }
          trigger:
            - { call: "POST /licensing/avail-packages/${pkg_id}/accept", payload: { accepted_slot_ids: ["${s_id}"] }, as: PlatformBuyer, as_user_id: "${pb_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (HTTP 403); package remains OFFERED with no licenses created"

      - name: statement_payer_must_differ_from_finalizer
        claim_type: segregation_of_duties
        grounds: ["validations[priority=5]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.RoyaltyStatement.FINALIZED_to_PAID]
        distinguishing_aspect: "The same person (X-User-ID user-7) may finalize (as FinanceAnalyst) but then may NOT mark paid (even holding the FinanceController role); a different controller user-8 can — duties are segregated by identity, not just by role."
        test_recipe:
          setup: ["holder H; statement ST finalized by user-7"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/royalty-statements", payload: { rights_holder_id: "${h_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", attribution_mode: "BY_REPORT_DATE" }, as: FinanceAnalyst, captures: { st_id: $.data.id } }
            - { call: "POST /licensing/royalty-statements/${st_id}/finalize", as: FinanceAnalyst, as_user_id: "user-7", captures: { fin_by: $.data.finalized_by_user_id } }
          trigger:
            - { call: "POST /licensing/royalty-statements/${st_id}/mark-paid", as: FinanceController, as_user_id: "user-7", captures: { err: $.data.error_id } }
            - { call: "POST /licensing/royalty-statements/${st_id}/mark-paid", as: FinanceController, as_user_id: "user-8", captures: { st_paid: $.data.statement_status, paid_by: $.data.paid_by_user_id } }
          assert:
            - "finalized_by_user_id == user-7"
            - "mark-paid by user-7 (same person): error_id == ERR_SEGREGATION_OF_DUTIES (HTTP 403)"
            - "mark-paid by user-8 (different person): statement_status == PAID, paid_by_user_id == user-8"

  # ================================================== cross-cutting layers ====
  - section: cross_cutting_layers
    instances:
      - name: report_submit_with_stale_license_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[revenue-report-stale-license-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After R1 is booked (license.version advanced to 2), a second submit still carrying the pre-R1 version is rejected 412; the same payload with the fresh version succeeds."
        test_recipe:
          setup: ["REVENUE_SHARE 50 license L EXECUTED; client holds version 1"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2027-08-01T00:00:00Z", exclusive: false, fee_model: "REVENUE_SHARE", revenue_share_pct: 50 }, as: RightsManager, captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "POST /licensing/license-agreements/${l_id}/revenue-reports", payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-31T00:00:00Z", gross_revenue_cents: 1000, expected_license_version: "${l_v}" }, as: PlatformBuyer, as_user_id: "${p_id}" }
          trigger:
            - { call: "POST /licensing/license-agreements/${l_id}/revenue-reports", payload: { period_start: "2026-07-15T00:00:00Z", period_end: "2026-07-31T00:00:00Z", gross_revenue_cents: 2000, expected_license_version: "${l_v}" }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
            - { call: "GET /licensing/license-agreements/${l_id}", as: RightsManager, captures: { l_v2: $.data.version } }
            - { call: "POST /licensing/license-agreements/${l_id}/revenue-reports", payload: { period_start: "2026-07-15T00:00:00Z", period_end: "2026-07-31T00:00:00Z", gross_revenue_cents: 2000, expected_license_version: "${l_v2}" }, as: PlatformBuyer, as_user_id: "${p_id}", captures: { r2_id: $.data.id } }
          assert:
            - "stale submit: error_id == ERR_STALE_VERSION (HTTP 412) — the license version moved to 2 when R1 was booked"
            - "fresh submit with the re-read version succeeds (201); two SUBMITTED reports exist"

      - name: extend_with_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[license-extend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Extension is OCC-guarded: the first extend succeeds and bumps the version; a second extend replaying the pre-extension version is rejected 412."
        test_recipe:
          setup: ["FLAT_FEE license L window [2026-08-01, 2026-12-01) on slot S (rights to 2027-12-01); client holds version 1"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-12-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 }, as: RightsManager, captures: { l_id: $.data.id, l_v: $.data.version } }
          trigger:
            - { call: "POST /licensing/license-agreements/${l_id}/extend", payload: { new_license_end: "2027-06-01T00:00:00Z", expected_license_version: "${l_v}" }, as: RightsManager, captures: { l_end: $.data.license_end } }
            - { call: "POST /licensing/license-agreements/${l_id}/extend", payload: { new_license_end: "2027-09-01T00:00:00Z", expected_license_version: "${l_v}" }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "first extend succeeds: license_end == 2027-06-01T00:00:00Z"
            - "second extend with the stale version: error_id == ERR_STALE_VERSION (HTTP 412); license_end stays 2027-06-01"

      - name: extend_cancels_and_replaces_takedown_notice
        claim_type: scheduled_actions
        grounds: [state_machines.TakedownNotice.SCHEDULED_to_CANCELLED, entities.TakedownNotice.fields.scheduled_for]
        distinguishing_aspect: "Extension is a deferred-action reschedule: the notice scheduled at the old license_end is CANCELLED and a replacement notice appears SCHEDULED at the new end — the license keeps exactly one pending takedown."
        test_recipe:
          setup: ["FLAT_FEE license L window [2026-08-01, 2026-12-01) on slot S (rights to 2027-12-01); notice N0 SCHEDULED at 2026-12-01"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-12-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 }, as: RightsManager, captures: { l_id: $.data.id, l_v: $.data.version } }
          trigger:
            - { call: "POST /licensing/license-agreements/${l_id}/extend", payload: { new_license_end: "2027-06-01T00:00:00Z", expected_license_version: "${l_v}" }, as: RightsManager }
            - { call: "GET /licensing/takedown-notices?license_id=${l_id}", as: RightsManager, captures: { n0: "$.data[0].notice_status", n1: "$.data[1].notice_status" } }
          assert:
            - "exactly 2 notices exist for the license: one CANCELLED with scheduled_for == 2026-12-01T00:00:00Z, one SCHEDULED with scheduled_for == 2027-06-01T00:00:00Z"
            - "a later clock sweep to 2027-06-01 would execute only the replacement notice"

      - name: license_mutation_increments_version
        claim_type: optimistic_concurrency
        grounds: [entities.LicenseAgreement, "concurrency_rules[license-extend-stale-version]"]
        distinguishing_aspect: "Every license mutation bumps the integer version by exactly 1 (the field OCC checks): create -> 1, terminate -> 2."
        test_recipe:
          setup: ["FLAT_FEE license L created (version 1)"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-08-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: false, fee_model: "FLAT_FEE", flat_fee_cents: 10000 }, as: RightsManager, captures: { l_id: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "POST /licensing/license-agreements/${l_id}/terminate", as: RightsManager, captures: { v2: $.data.version } }
          assert:
            - "v1 == 1 at creation; v2 == 2 after terminate (exactly +1 per mutation)"

      - name: derived_fields_reconciled_after_reversal
        claim_type: derived_field_reconciliation
        grounds: [entities.LicenseAgreement.fields.outstanding_recoupment_cents]
        excluded_because:
          difficulty_instance: report_reverse_restores_recoupment_invariant
          rationale: "Recouped/payable/outstanding reconciliation after a report reversal is asserted with exact literals in the named §1.8 instance."

      - name: cascade_chains_end_to_end
        claim_type: cascading_side_effects
        grounds: [state_machines.RightsSlot, state_machines.AvailPackage]
        excluded_because:
          difficulty_instance: slot_withdraw_block_package_expire_chain
          rationale: "Depth-3 withdraw cascade and depth-2 terminate cascade are asserted hop-by-hop in the two §1.8 transitive_cascade instances."

  # ======================================================== consistency ======
  - section: consistency_model
    instances:
      - name: create_license_response_includes_computed_fields
        claim_type: immediate_consistency
        grounds: [entities.LicenseAgreement, calculations.holdback_derivation]
        distinguishing_aspect: "The create response itself carries every computed field in its final value (immediate consistency, no re-read or async reconciliation): outstanding == MG, allocated == input fee for a direct deal, holdback_until derived, status EXECUTED."
        test_recipe:
          setup: ["slot S (SVOD, rights [2026-08-01, 2027-08-01)); platform P"]
          setup_api_calls:
            - { call: "POST /licensing/rights-holders", payload: { name: "H", payee_reference: "PAY-1", royalty_share_pct: 100 }, as: RightsManager, captures: { h_id: $.data.id } }
            - { call: "POST /licensing/titles", payload: { title_code: "T1", name: "T", content_type: "FILM", original_language: "en", production_year: 2024 }, as: RightsManager, captures: { t_id: $.data.id } }
            - { call: "POST /licensing/platforms", payload: { name: "P", platform_type: "SVOD", metadata_spec_version: "MEC-2.3", required_asset_profiles: ["4K_HDR"] }, as: RightsManager, captures: { p_id: $.data.id } }
            - { call: "POST /licensing/rights-slots", payload: { title_id: "${t_id}", rights_holder_id: "${h_id}", territory_code: "US", language_code: "en", window_type: "SVOD", sellable_from: "2026-08-01T00:00:00Z", sellable_to: "2027-08-01T00:00:00Z" }, as: RightsManager, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /licensing/license-agreements", payload: { slot_id: "${s_id}", platform_id: "${p_id}", license_start: "2026-09-01T00:00:00Z", license_end: "2026-12-01T00:00:00Z", exclusive: true, fee_model: "MINIMUM_GUARANTEE", minimum_guarantee_cents: 80000, revenue_share_pct: 50 }, as: RightsManager, captures: { l_status: $.data.license_status, l_rec: $.data.recouped_cents, l_out: $.data.outstanding_recoupment_cents, l_alloc: $.data.allocated_fee_cents, l_hb: $.data.holdback_until, l_pkg: $.data.package_id } }
          assert:
            - "response (201): license_status == EXECUTED, recouped_cents == 0, outstanding_recoupment_cents == 80000"
            - "allocated_fee_cents == 80000 (direct deal: no discount), holdback_until == 2026-12-31T00:00:00Z (exclusive SVOD + 30d)"
            - "package_id == null for a direct deal"
