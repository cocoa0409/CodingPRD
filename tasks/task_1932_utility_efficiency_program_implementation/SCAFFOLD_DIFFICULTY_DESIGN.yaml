scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1: Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: incentive_provisional_vs_final_on_project
        grounds:
          - calculations.project_incentive_amount
          - state_machines.Project.PROPOSED_to_APPROVED
          - state_machines.Project.INSPECTING_to_COMPLETED
        distinguishing_aspect: |
          Same Project inputs produce two different incentive values: PROVISIONAL variant
          (floor rounding, no cost-overrun adjustment) vs FINAL variant (cost-overrun
          adjusted savings, round_half_up). Computed on the Project / IncentivePayment
          entity domain.
        test_recipe:
          setup:
            - "One ACTIVE program with budget 200000, trc_threshold 1.0"
            - "One APPROVED contractor with one ACTIVE HVAC certification"
            - "One customer, one lead (HVAC, estimated 4000 kWh/yr), lead distributed and accepted"
            - "One project with measure_cost_cents = 1000000 (above 500000 baseline, so FINAL applies 0.5 savings adjustment)"
          setup_api_calls:
            - call: "POST /efficiency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/programs"
              payload: { code: "RES-HVAC", name: "Residential HVAC", sector: "RESIDENTIAL", budget_cents: 200000, avoided_kwh_target: 100000, trc_threshold: 1.0 }
              as: ProgramManager
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /efficiency/programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/contractors"
              payload: { legal_name: "Acme HVAC", license_number: "L-100", sector: "RESIDENTIAL", service_zip_codes: ["94110"] }
              as: ProgramManager
              captures: { ctr_id: $.data.id }
            - call: "POST /efficiency/certifications"
              payload: { contractor_id: "${ctr_id}", measure_type: "HVAC", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/contractors/${ctr_id}/approve"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/customers"
              payload: { full_name: "Alice", email: "alice@x.com", service_zip: "94110", sector: "RESIDENTIAL", utility_account_id: "UA-1" }
              as: ProgramManager
              captures: { cust_id: $.data.id }
            - call: "POST /efficiency/leads"
              payload: { customer_id: "${cust_id}", program_id: "${prog_id}", measure_type: "HVAC", estimated_annual_kwh_savings: 4000, source_channel: "WEB" }
              as: ProgramManager
              captures: { lead_id: $.data.id, lead_v0: $.data.version }
            - call: "POST /efficiency/leads/${lead_id}/distribute"
              payload: { expected_lead_version: "${lead_v0}" }
              as: ProgramManager
            - call: "POST /efficiency/leads/${lead_id}/accept"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/projects"
              payload: { lead_id: "${lead_id}", customer_id: "${cust_id}", contractor_id: "${ctr_id}", program_id: "${prog_id}", measure_type: "HVAC", measure_cost_cents: 1000000, estimated_annual_kwh_savings: 4000, incentive_recipient: "CONTRACTOR" }
              as: ProgramManager
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /efficiency/projects/${proj_id}/approve"
              payload: { expected_program_version: "${prog_v0}" }
              as: ProgramManager
              captures: { prov_amt: $.data.incentive_amount_provisional_cents, init_amt: $.data.incentive_amount_cents }
            - call: "POST /efficiency/projects/${proj_id}/work_orders"
              payload: { contractor_id: "${ctr_id}", scheduled_on: "2026-08-02T00:00:00Z", duration_hours: 4 }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /efficiency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/work_orders/${wo_id}/start"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/inspectors"
              payload: { full_name: "I", license_number: "I-1", excluded_contractor_ids: [] }
              as: ProgramManager
              captures: { insp_id: $.data.id }
            - call: "POST /efficiency/work_orders/${wo_id}/complete"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/inspections"
              payload: { work_order_id: "${wo_id}", project_id: "${proj_id}", inspector_id: "${insp_id}", scheduled_on: "2026-08-03T00:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins_id: $.data.id }
            - call: "POST /efficiency/inspections/${ins_id}/record"
              payload: { outcome: "PASS", score_bps: 9000 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /efficiency/incentive_payments"
              payload: {}
              as: ProgramManager
              captures: { final_amt: "$.data[0].amount_cents", delta: "$.data[0].reconciliation_delta_cents" }
          assert:
            - "prov_amt == 74000 (= floor(min(2000*25 + 2000*12, 80000)) = floor(74000))"
            - "init_amt == 74000 (PROVISIONAL == initial incentive_amount_cents)"
            - "final_amt == 50000 (FINAL: 4000 * 0.5 = 2000 kWh → 2000*25 + 0*12 = 50000; under 80000 cap; round_half_up)"
            - "delta == 50000 - 74000 == -24000"
            - "prov_amt != final_amt"

      - name: trc_ratio_threshold_flag_variants
        grounds:
          - calculations.trc_cost_effectiveness
          - entities.CostEffectivenessReport.fields.trc_flag
          - entities.CostEffectivenessReport.fields.trc_ratio
        distinguishing_aspect: |
          TRC ratio uses threshold breakpoints to derive trc_flag: PASS at >= threshold,
          MARGINAL in [threshold - 0.10, threshold), FAIL below threshold - 0.10.
          Operates on the CostEffectivenessReport entity domain — different from Project
          incentive calculations (different subject: aggregate program economics vs
          individual project incentive).
        test_recipe:
          setup:
            - "One ACTIVE program with budget 10000000, trc_threshold 1.00"
            - "One APPROVED contractor with ACTIVE HVAC cert"
            - "One customer, one lead (HVAC, 3000 kWh/yr savings), distributed and accepted"
            - "One project measure_cost_cents = 400000 (below 500000 baseline, so no FINAL adjustment), approved, completed with PASS inspection"
            - "Payment disbursed"
          setup_api_calls:
            - call: "POST /efficiency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/programs"
              payload: { code: "RES-HVAC-T", name: "TRC Test", sector: "RESIDENTIAL", budget_cents: 10000000, avoided_kwh_target: 10000, trc_threshold: 1.0 }
              as: ProgramManager
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /efficiency/programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/contractors"
              payload: { legal_name: "C1", license_number: "L-1", sector: "RESIDENTIAL", service_zip_codes: ["94110"] }
              as: ProgramManager
              captures: { ctr_id: $.data.id }
            - call: "POST /efficiency/certifications"
              payload: { contractor_id: "${ctr_id}", measure_type: "HVAC", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/contractors/${ctr_id}/approve"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/customers"
              payload: { full_name: "Bob", email: "b@x.com", service_zip: "94110", sector: "RESIDENTIAL", utility_account_id: "UA-T" }
              as: ProgramManager
              captures: { cust_id: $.data.id }
            - call: "POST /efficiency/leads"
              payload: { customer_id: "${cust_id}", program_id: "${prog_id}", measure_type: "HVAC", estimated_annual_kwh_savings: 3000, source_channel: "WEB" }
              as: ProgramManager
              captures: { lead_id: $.data.id, lead_v0: $.data.version }
            - call: "POST /efficiency/leads/${lead_id}/distribute"
              payload: { expected_lead_version: "${lead_v0}" }
              as: ProgramManager
            - call: "POST /efficiency/leads/${lead_id}/accept"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/projects"
              payload: { lead_id: "${lead_id}", customer_id: "${cust_id}", contractor_id: "${ctr_id}", program_id: "${prog_id}", measure_type: "HVAC", measure_cost_cents: 400000, estimated_annual_kwh_savings: 3000, incentive_recipient: "CUSTOMER" }
              as: ProgramManager
              captures: { proj_id: $.data.id }
            - call: "POST /efficiency/projects/${proj_id}/approve"
              payload: { expected_program_version: "${prog_v0}" }
              as: ProgramManager
            - call: "POST /efficiency/projects/${proj_id}/work_orders"
              payload: { contractor_id: "${ctr_id}", scheduled_on: "2026-08-02T00:00:00Z", duration_hours: 4 }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /efficiency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/work_orders/${wo_id}/start"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/inspectors"
              payload: { full_name: "Insp A", license_number: "I-1", excluded_contractor_ids: [] }
              as: ProgramManager
              captures: { insp_id: $.data.id }
            - call: "POST /efficiency/work_orders/${wo_id}/complete"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/inspections"
              payload: { work_order_id: "${wo_id}", project_id: "${proj_id}", inspector_id: "${insp_id}", scheduled_on: "2026-08-03T00:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins_id: $.data.id }
            - call: "POST /efficiency/inspections/${ins_id}/record"
              payload: { outcome: "PASS", score_bps: 9000 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /efficiency/incentive_payments"
              payload: {}
              as: ProgramManager
              captures: { pay_id: "$.data[0].id" }
            - call: "POST /efficiency/incentive_payments/${pay_id}/disburse"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /efficiency/reports"
              payload: { program_id: "${prog_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", total_admin_cost_cents: 50000 }
              as: ProgramManager
              captures: { rep_id: $.data.id, trc_ratio: $.data.trc_ratio, trc_flag: $.data.trc_flag }
          assert:
            - "CostEffectivenessReport.total_avoided_kwh == 3000"
            - "CostEffectivenessReport.total_incentive_paid_cents == 62000 (PROVISIONAL = FINAL since no cost adjustment: floor(min(2000*25+1000*12, 80000)) = 62000)"
            - "trc_ratio computed via 12-year NPV at 4% discount over 3000*11 cents annual benefit, denominator = 62000 + 50000 + max(0, 400000-62000) = 450000"
            - "trc_flag ∈ {PASS, MARGINAL, FAIL} according to breakpoint rules vs program.trc_threshold = 1.00"

  # ===========================================================================
  # Rule 2: Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_incentive_with_cap_and_cost_adjustment
        grounds:
          - calculations.project_incentive_amount
        distinguishing_aspect: |
          Mode (a) — formula with ≥3 inputs (savings_kwh, measure_cost_cents, constants)
          and non-linear interaction: tiered marginal rates (2000 kWh breakpoint), cap
          min(raw, 80000), conditional branch on cost_cents > baseline. The nested
          min/max and the conditional adjustment together make it combinatorial.
        test_recipe:
          setup:
            - "Program with budget 500000, trc_threshold 1.0, ACTIVE"
            - "Contractor APPROVED with HVAC cert"
            - "Customer + lead (HVAC, 5000 kWh/yr), distributed and accepted"
            - "Project with measure_cost_cents = 400000 (below baseline → no FINAL adjustment), incentive_recipient CUSTOMER"
          setup_api_calls:
            - call: "POST /efficiency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/programs"
              payload: { code: "P-COMB", name: "Comb", sector: "RESIDENTIAL", budget_cents: 500000, avoided_kwh_target: 50000, trc_threshold: 1.0 }
              as: ProgramManager
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /efficiency/programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/contractors"
              payload: { legal_name: "CC", license_number: "L-C", sector: "RESIDENTIAL", service_zip_codes: ["94110"] }
              as: ProgramManager
              captures: { ctr_id: $.data.id }
            - call: "POST /efficiency/certifications"
              payload: { contractor_id: "${ctr_id}", measure_type: "HVAC", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/contractors/${ctr_id}/approve"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/customers"
              payload: { full_name: "C", email: "c@x.com", service_zip: "94110", sector: "RESIDENTIAL", utility_account_id: "UA-C" }
              as: ProgramManager
              captures: { cust_id: $.data.id }
            - call: "POST /efficiency/leads"
              payload: { customer_id: "${cust_id}", program_id: "${prog_id}", measure_type: "HVAC", estimated_annual_kwh_savings: 5000, source_channel: "WEB" }
              as: ProgramManager
              captures: { lead_id: $.data.id, lead_v0: $.data.version }
            - call: "POST /efficiency/leads/${lead_id}/distribute"
              payload: { expected_lead_version: "${lead_v0}" }
              as: ProgramManager
            - call: "POST /efficiency/leads/${lead_id}/accept"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/projects"
              payload: { lead_id: "${lead_id}", customer_id: "${cust_id}", contractor_id: "${ctr_id}", program_id: "${prog_id}", measure_type: "HVAC", measure_cost_cents: 400000, estimated_annual_kwh_savings: 5000, incentive_recipient: "CUSTOMER" }
              as: ProgramManager
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /efficiency/projects/${proj_id}/approve"
              payload: { expected_program_version: "${prog_v0}" }
              as: ProgramManager
          assert:
            - "Project.incentive_amount_provisional_cents == floor(min(2000*25 + 3000*12, 80000)) = floor(min(50000+36000, 80000)) = floor(80000) = 80000 (cap binds)"
            - "Project.incentive_amount_cents == 80000"

      - name: trc_npv_multi_year_discount
        grounds:
          - calculations.trc_cost_effectiveness
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with explicit evaluation order:
          denominator includes total_incentive_paid_cents which depends on completed
          projects, which in turn depend on report scope (period_end). The NPV benefit
          is computed by summing a 12-year discounted series; the denominator uses
          customer_incremental_cost_cents which subtracts the very incentive_amount_cents
          the same report's total_incentive_paid_cents aggregates. The scaffold pins
          evaluation order: benefit first, then denominator, then ratio.
        test_recipe:
          setup:
            - "Same setup as trc_ratio_threshold_flag_variants (one COMPLETED project, 3000 kWh savings, 400000 cost, 62000 incentive paid, 50000 admin cost)"
          setup_api_calls:
            - call: "POST /efficiency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/programs"
              payload: { code: "TRC2", name: "TRC2", sector: "RESIDENTIAL", budget_cents: 10000000, avoided_kwh_target: 10000, trc_threshold: 1.0 }
              as: ProgramManager
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /efficiency/programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/contractors"
              payload: { legal_name: "C2", license_number: "L-2", sector: "RESIDENTIAL", service_zip_codes: ["94110"] }
              as: ProgramManager
              captures: { ctr_id: $.data.id }
            - call: "POST /efficiency/certifications"
              payload: { contractor_id: "${ctr_id}", measure_type: "HVAC", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/contractors/${ctr_id}/approve"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/customers"
              payload: { full_name: "D", email: "d@x.com", service_zip: "94110", sector: "RESIDENTIAL", utility_account_id: "UA-D" }
              as: ProgramManager
              captures: { cust_id: $.data.id }
            - call: "POST /efficiency/leads"
              payload: { customer_id: "${cust_id}", program_id: "${prog_id}", measure_type: "HVAC", estimated_annual_kwh_savings: 3000, source_channel: "WEB" }
              as: ProgramManager
              captures: { lead_id: $.data.id, lead_v0: $.data.version }
            - call: "POST /efficiency/leads/${lead_id}/distribute"
              payload: { expected_lead_version: "${lead_v0}" }
              as: ProgramManager
            - call: "POST /efficiency/leads/${lead_id}/accept"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/projects"
              payload: { lead_id: "${lead_id}", customer_id: "${cust_id}", contractor_id: "${ctr_id}", program_id: "${prog_id}", measure_type: "HVAC", measure_cost_cents: 400000, estimated_annual_kwh_savings: 3000, incentive_recipient: "CUSTOMER" }
              as: ProgramManager
              captures: { proj_id: $.data.id }
            - call: "POST /efficiency/projects/${proj_id}/approve"
              payload: { expected_program_version: "${prog_v0}" }
              as: ProgramManager
            - call: "POST /efficiency/projects/${proj_id}/work_orders"
              payload: { contractor_id: "${ctr_id}", scheduled_on: "2026-08-02T00:00:00Z", duration_hours: 4 }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /efficiency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/work_orders/${wo_id}/start"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/inspectors"
              payload: { full_name: "I", license_number: "I-2", excluded_contractor_ids: [] }
              as: ProgramManager
              captures: { insp_id: $.data.id }
            - call: "POST /efficiency/work_orders/${wo_id}/complete"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/inspections"
              payload: { work_order_id: "${wo_id}", project_id: "${proj_id}", inspector_id: "${insp_id}", scheduled_on: "2026-08-03T00:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins_id: $.data.id }
            - call: "POST /efficiency/inspections/${ins_id}/record"
              payload: { outcome: "PASS", score_bps: 9000 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /efficiency/incentive_payments"
              payload: {}
              as: ProgramManager
              captures: { pay_id: "$.data[0].id" }
            - call: "POST /efficiency/incentive_payments/${pay_id}/disburse"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /efficiency/reports"
              payload: { program_id: "${prog_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", total_admin_cost_cents: 50000 }
              as: ProgramManager
              captures: { trc_ratio: $.data.trc_ratio, total_incentive_paid: $.data.total_incentive_paid_cents, total_avoided: $.data.total_avoided_kwh }
          assert:
            - "total_incentive_paid == 62000"
            - "total_avoided == 3000"
            - "benefit_cents = sum_{t=1..12} 33000 / (1.04)^t = 309707.4341 (computed at 4 decimals)"
            - "denominator = 62000 + 50000 + (400000 - 62000) = 450000"
            - "trc_ratio == 0.6882 (rounded to 4 decimals, round_half_up)"

  # ===========================================================================
  # Rule 3: Non-linear state machines on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: project_remediation_loop
        grounds:
          - state_machines.Project.INSPECTING_to_REMEDIATION
          - state_machines.Project.REMEDIATION_to_INSPECTING
        distinguishing_aspect: |
          Project has a revision loop: INSPECTING -> REMEDIATION -> INSPECTING. A FAIL
          inspection routes the project back for remediation; a re-inspection routes
          it forward again. Loop terminates only on PASS (-> COMPLETED) or cancel.
          Different entity from the Lead/Contractor machine.
        test_recipe:
          setup:
            - "Full project setup reaching INSTALLED state (approved, work order scheduled, started, completed)"
          setup_api_calls:
            - call: "POST /efficiency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/programs"
              payload: { code: "P-LOOP", name: "Loop", sector: "RESIDENTIAL", budget_cents: 500000, avoided_kwh_target: 10000, trc_threshold: 1.0 }
              as: ProgramManager
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /efficiency/programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/contractors"
              payload: { legal_name: "CL", license_number: "L-L", sector: "RESIDENTIAL", service_zip_codes: ["94110"] }
              as: ProgramManager
              captures: { ctr_id: $.data.id }
            - call: "POST /efficiency/certifications"
              payload: { contractor_id: "${ctr_id}", measure_type: "HVAC", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/contractors/${ctr_id}/approve"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/customers"
              payload: { full_name: "L", email: "l@x.com", service_zip: "94110", sector: "RESIDENTIAL", utility_account_id: "UA-L" }
              as: ProgramManager
              captures: { cust_id: $.data.id }
            - call: "POST /efficiency/leads"
              payload: { customer_id: "${cust_id}", program_id: "${prog_id}", measure_type: "HVAC", estimated_annual_kwh_savings: 1000, source_channel: "WEB" }
              as: ProgramManager
              captures: { lead_id: $.data.id, lead_v0: $.data.version }
            - call: "POST /efficiency/leads/${lead_id}/distribute"
              payload: { expected_lead_version: "${lead_v0}" }
              as: ProgramManager
            - call: "POST /efficiency/leads/${lead_id}/accept"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/projects"
              payload: { lead_id: "${lead_id}", customer_id: "${cust_id}", contractor_id: "${ctr_id}", program_id: "${prog_id}", measure_type: "HVAC", measure_cost_cents: 100000, estimated_annual_kwh_savings: 1000, incentive_recipient: "CONTRACTOR" }
              as: ProgramManager
              captures: { proj_id: $.data.id }
