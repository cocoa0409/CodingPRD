            - "the first cure submit returns the filing to SUBMITTED with both review states reset to PENDING while deficiency_round_count stays 1"
            - "after the second DEFICIENT deficiency_round_count is 2 and the filing is DEFICIENCY_ISSUED again"
            - "after the third DEFICIENT WildfirePlanFiling status is REJECTED with deficiency_round_count 3 and fiscal_review_state DEFICIENT"
            - "the closing submit returns HTTP 409 with data.error_id == ERR_FILING_INVALID_STATE — REJECTED is terminal"
            - "safety_review_state is PENDING on the rejected row because the third DEFICIENT landed on the FISCAL track and never waited for its sibling"

