# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — Nightclub & Bar
# Nine §0.5 rules, >= 2 instances each (>= 18 total).
# Every grounds[] resolves into SCAFFOLD.yaml §1.1-§1.6.
# Every setup_api_calls / trigger call resolves to a §1.5 endpoint; every ${var}
# is bound by an earlier captures:. Formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: tab_final_total_walk_up_vs_reservation_tab
        grounds:
          - calculations.tab_final_total
          - calculations.reservation_minimum_shortfall
          - state_machines.Tab.RUNNING_to_SETTLED
          - entities.Tab.fields.final_total_cents
        distinguishing_aspect: "Same Tab settlement formula yields final_total == subtotal+gratuity for a walk-up tab (reservation_id null) but final_total == spend_minimum for an under-minimum reservation tab because the SEATED->SETTLED cascade appends a SERVICE top-up line; the divergence is on the Tab domain."
        test_recipe:
          setup:
            - "Venue V (cap 10, base 2000, grat default). Two tabs: walk-up tab W with 5 ALCOHOL @1200 grat 0.2 (subtotal 6000, grand 7200); reservation tab R linked to a SEATED reservation with spend_minimum 50000 and the same 5 ALCOHOL @1200 lines (pre-top-up grand 7200)."
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z", cover_base_cents: 2000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /nightclub/tabs"
              payload: { venue_id: "${v_id}", patron_name: "Walkup", preauth_cents: 100000, gratuity_pct: 0.2 }
              as: Bartender
              captures: { w_tab: $.data.id }
            - call: "POST /nightclub/tabs/${w_tab}/items"
              payload: { name: "Vodka", category: "ALCOHOL", qty: 5, unit_price_cents: 1200 }
              as: Bartender
            - call: "POST /nightclub/reservations"
              payload: { venue_id: "${v_id}", table_label: "VIP-1", party_size: 4, window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2026-03-16T05:00:00Z", spend_minimum_cents: 50000, expected_venue_version: "${v_ver}" }
              as: FloorManager
              captures: { res_id: $.data.id, v_ver2: $.data.version }
            - call: "POST /nightclub/reservations/${res_id}/seat"
              payload: {}
              as: FloorManager
            - call: "POST /nightclub/tabs"
              payload: { venue_id: "${v_id}", patron_name: "VIP", preauth_cents: 100000, reservation_id: "${res_id}", gratuity_pct: 0.2 }
              as: Bartender
              captures: { r_tab: $.data.id }
            - call: "POST /nightclub/tabs/${r_tab}/items"
              payload: { name: "Vodka", category: "ALCOHOL", qty: 5, unit_price_cents: 1200 }
              as: Bartender
          trigger:
            - call: "POST /nightclub/tabs/${w_tab}/settle"
              payload: {}
              as: Bartender
              captures: { w_final: $.data.final_total_cents }
            - call: "POST /nightclub/reservations/${res_id}/settle"
              payload: {}
              as: FloorManager
            - call: "GET /nightclub/tabs/${r_tab}"
              payload: {}
              as: Bartender
              captures: { r_final: $.data.final_total_cents }
          assert:
            - "Tab.${w_tab}.final_total_cents == 7200"
            - "Tab.${r_tab}.final_total_cents == 50000"
            - "Tab.${w_tab}.final_total_cents != Tab.${r_tab}.final_total_cents"

      - name: id_check_outcome_pass_vs_expired_override
        grounds:
          - calculations.id_check_outcome
          - calculations.patron_age_years
          - entities.IdCheck.fields.outcome
        distinguishing_aspect: "Same id_check_outcome formula yields PASS for an of-age patron with a valid ID but REFUSED_EXPIRED_ID for an of-age patron whose ID expiry is before the clock; the divergence is on the IdCheck domain (distinct from the Tab pricing dual-variant), and the expiry gate overrides the age result."
        test_recipe:
          setup:
            - "Clock at 2026-03-15. Venue V. IdCheck P1 dob 2000-01-01 expiry 2027-01-01 (age 26, valid). IdCheck P2 dob 2000-01-01 expiry 2026-03-14 (age 26 but expired)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "P1", date_of_birth: "2000-01-01", id_expiry: "2027-01-01" }
              as: DoorHost
              captures: { p1_out: $.data.outcome }
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "P2", date_of_birth: "2000-01-01", id_expiry: "2026-03-14" }
              as: DoorHost
              captures: { p2_out: $.data.outcome }
          assert:
            - "IdCheck.P1.outcome == PASS"
            - "IdCheck.P2.outcome == REFUSED_EXPIRED_ID"
            - "IdCheck.P2.computed_age_years == 26"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cover_charge_surge_then_discount_then_comp_mode_a
        grounds:
          - calculations.cover_charge_amount
          - entities.Entry.fields.cover_paid_cents
          - state_machines.Entry.INSIDE
        distinguishing_aspect: "cover_charge_amount is mode (a): >=3 inputs (cover_base_cents, cover_surge_pct, occupancy band, promoter guest_discount_pct, comp_value_cents) with non-linear nested branches — surge selection then multiplicative discount then comp floor at 0; surge active (occ 9 of cap 10) + promoter disc 0.5 + comp 200 -> 800."
        test_recipe:
          setup:
            - "Venue V cap 10 base 2000 surge 0.5. Promoter PR guest_discount_pct 0.5 comp_budget 100000. GuestListEntry GLE under PR with comp_value 200. Drive occupancy to 9 with 9 walk-up admits so the 10th (off GLE) lands in the surge band (occ 9 >= ceil(0.9*10)=9)."
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z", cover_base_cents: 2000, cover_surge_pct: 0.5 }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/promoters"
              payload: { venue_id: "${v_id}", name: "PR", comp_budget_cents: 100000, guest_discount_pct: 0.5 }
              as: FloorManager
              captures: { pr_id: $.data.id }
            - call: "POST /nightclub/guest-list"
              payload: { venue_id: "${v_id}", guest_name: "VIP", party_size: 1, promoter_id: "${pr_id}", comp_value_cents: 200 }
              as: DoorHost
              captures: { gle_id: $.data.id }
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "VIP", date_of_birth: "1990-01-01", id_expiry: "2030-01-01" }
              as: DoorHost
              captures: { idc_vip: $.data.id }
            - call: "POST /_inject/occupancy"
              payload: { venue_id: "${v_id}", target_inside: 9 }
              as: PlatformAdmin
              captures: { v_after: $.data.version }
          trigger:
            - call: "POST /nightclub/entries"
              payload: { venue_id: "${v_id}", id_check_id: "${idc_vip}", guest_list_entry_id: "${gle_id}", expected_venue_version: "${v_after}" }
              as: DoorHost
              captures: { e_id: $.data.id, paid: $.data.cover_paid_cents }
          assert:
            - "Entry.${e_id}.cover_paid_cents == 800"

      - name: tab_gratuity_sum_then_round_mode_b
        grounds:
          - calculations.tab_final_total
          - state_machines.Tab.RUNNING_to_SETTLED
          - entities.Tab.fields.final_total_cents
        distinguishing_aspect: "tab_final_total is mode (b): rounding ORDER is pinned to sum-then-round. Two lines at 2510 with gratuity 0.15 give gratuity rhu(5020*0.15)=753 (sum-then-round); round-per-line-then-sum would give 377*2=754. The scaffold pins 753."
        test_recipe:
          setup:
            - "Venue V. Walk-up tab T, gratuity 0.15, two FOOD lines @2510 (subtotal 5020)."
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /nightclub/tabs"
              payload: { venue_id: "${v_id}", patron_name: "T", preauth_cents: 100000, gratuity_pct: 0.15 }
              as: Bartender
              captures: { t_id: $.data.id }
            - call: "POST /nightclub/tabs/${t_id}/items"
              payload: { name: "Steak", category: "FOOD", qty: 1, unit_price_cents: 2510 }
              as: Bartender
            - call: "POST /nightclub/tabs/${t_id}/items"
              payload: { name: "Lobster", category: "FOOD", qty: 1, unit_price_cents: 2510 }
              as: Bartender
          trigger:
            - call: "POST /nightclub/tabs/${t_id}/settle"
              payload: {}
              as: Bartender
              captures: { fin: $.data.final_total_cents }
          assert:
            - "Tab.${t_id}.running_subtotal_cents == 5020"
            - "Tab.${t_id}.final_total_cents == 5773"

      - name: reservation_shortfall_circular_eval_order_mode_c
        grounds:
          - calculations.reservation_minimum_shortfall
          - calculations.tab_final_total
          - state_machines.Reservation.SEATED_to_SETTLED
          - entities.Reservation.fields.minimum_shortfall_cents
        distinguishing_aspect: "reservation_minimum_shortfall is mode (c): the circular-looking tab<->shortfall dependency is pinned — STEP1 compute tab grand over existing lines (subtotal 6000 + gratuity 1200 = 7200), STEP2 shortfall = max(0, 50000-7200)=42800, STEP3 append SERVICE line AFTER gratuity (so it earns no gratuity), STEP4 tab final = 7200+42800 = exactly 50000."
        test_recipe:
          setup:
            - "Venue V. Reservation res spend_minimum 50000 SEATED. Linked tab rt grat 0.2 with 5 ALCOHOL @1200 (subtotal 6000)."
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/reservations"
              payload: { venue_id: "${v_id}", table_label: "VIP-1", party_size: 4, window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2026-03-16T05:00:00Z", spend_minimum_cents: 50000, expected_venue_version: "${v0}" }
              as: FloorManager
              captures: { res_id: $.data.id }
            - call: "POST /nightclub/reservations/${res_id}/seat"
              payload: {}
              as: FloorManager
            - call: "POST /nightclub/tabs"
              payload: { venue_id: "${v_id}", patron_name: "VIP", preauth_cents: 100000, reservation_id: "${res_id}", gratuity_pct: 0.2 }
              as: Bartender
              captures: { rt_id: $.data.id }
            - call: "POST /nightclub/tabs/${rt_id}/items"
              payload: { name: "Bottle", category: "ALCOHOL", qty: 5, unit_price_cents: 1200 }
              as: Bartender
          trigger:
            - call: "POST /nightclub/reservations/${res_id}/settle"
              payload: {}
              as: FloorManager
              captures: { sf: $.data.minimum_shortfall_cents }
            - call: "GET /nightclub/tabs/${rt_id}"
              payload: {}
              as: Bartender
              captures: { rt_final: $.data.final_total_cents }
          assert:
            - "Reservation.${res_id}.minimum_shortfall_cents == 42800"
            - "Tab.${rt_id}.final_total_cents == 50000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: tab_running_to_open_revert_on_last_void
        grounds:
          - state_machines.Tab.RUNNING_to_OPEN
          - state_machines.Tab.OPEN_to_RUNNING
          - entities.Tab.fields.running_subtotal_cents
          - entities.Tab.fields.bac_strikes
        distinguishing_aspect: "Tab is non-linear branching-with-revert on the Tab entity: OPEN->RUNNING on first item, then RUNNING->OPEN when the last non-voided item is voided, resetting running_subtotal_cents and bac_strikes to 0 — a backward edge a linear pipeline cannot express."
        test_recipe:
          setup:
            - "Venue V. Tab t with one ALCOHOL item (status RUNNING, subtotal 1200, bac_strikes 1)."
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /nightclub/tabs"
              payload: { venue_id: "${v_id}", patron_name: "T", preauth_cents: 50000 }
              as: Bartender
              captures: { t_id: $.data.id }
            - call: "POST /nightclub/tabs/${t_id}/items"
              payload: { name: "Beer", category: "ALCOHOL", qty: 1, unit_price_cents: 1200 }
              as: Bartender
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /nightclub/tabs/${t_id}/items/${item_id}/void"
              payload: {}
              as: Bartender
            - call: "GET /nightclub/tabs/${t_id}"
              payload: {}
              as: Bartender
              captures: { st: $.data.status }
          assert:
            - "Tab.${t_id}.status == OPEN"
            - "Tab.${t_id}.running_subtotal_cents == 0"
            - "Tab.${t_id}.bac_strikes == 0"

      - name: reservation_fork_booked_to_no_show_branch
        grounds:
          - state_machines.Reservation.BOOKED_to_NO_SHOW
          - state_machines.Reservation.BOOKED_to_SEATED
          - state_machines.Reservation.BOOKED_to_CANCELLED
          - entities.Reservation.fields.status
        distinguishing_aspect: "Reservation is non-linear branching-fork on the Reservation entity (a different entity than Tab): BOOKED forks to one of {SEATED, NO_SHOW, CANCELLED} with divergent side effects (NO_SHOW forfeits deposit, CANCELLED refunds it), not a single forward edge."
        test_recipe:
          setup:
            - "Clock 2026-03-16T05:30:00Z. Venue V. Reservation res window [2026-03-16T03:00:00Z, 2026-03-16T05:00:00Z) BOOKED deposit 5000; window already lapsed so no-show is legal."
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/reservations"
              payload: { venue_id: "${v_id}", table_label: "T1", party_size: 2, window_start_utc: "2026-03-16T03:00:00Z", window_end_utc: "2026-03-16T05:00:00Z", spend_minimum_cents: 10000, deposit_cents: 5000, expected_venue_version: "${v0}" }
              as: FloorManager
              captures: { res_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-16T05:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /nightclub/reservations/${res_id}/no-show"
              payload: {}
              as: FloorManager
              captures: { st: $.data.status }
          assert:
            - "Reservation.${res_id}.status == NO_SHOW"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: venue_close_cascade_reservation_tab_preauth_depth3
        grounds:
          - state_machines.Venue.OPEN_to_CLOSED
          - state_machines.Reservation.SEATED_to_SETTLED
          - state_machines.Tab.RUNNING_to_SETTLED
          - calculations.reservation_minimum_shortfall
          - calculations.tab_final_total
        distinguishing_aspect: "Depth-3 cascade from venue close: close -> Reservation SEATED->SETTLED (hop1) -> that settle appends a SERVICE top-up and settles the linked Tab RUNNING->SETTLED (hop2) -> tab settle computes final_total and captures pre-auth (hop3). Each hop is caused by the previous, not by the close directly."
        test_recipe:
          setup:
            - "Venue V. Reservation res SEATED spend_minimum 50000. Linked tab rt grat 0.2 with 5 ALCOHOL @1200 (pre-top-up grand 7200). Entry e INSIDE."
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/reservations"
              payload: { venue_id: "${v_id}", table_label: "VIP-1", party_size: 4, window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2026-03-16T05:00:00Z", spend_minimum_cents: 50000, expected_venue_version: "${v0}" }
              as: FloorManager
              captures: { res_id: $.data.id }
            - call: "POST /nightclub/reservations/${res_id}/seat"
              payload: {}
              as: FloorManager
            - call: "POST /nightclub/tabs"
              payload: { venue_id: "${v_id}", patron_name: "VIP", preauth_cents: 100000, reservation_id: "${res_id}", gratuity_pct: 0.2 }
              as: Bartender
              captures: { rt_id: $.data.id }
            - call: "POST /nightclub/tabs/${rt_id}/items"
              payload: { name: "Bottle", category: "ALCOHOL", qty: 5, unit_price_cents: 1200 }
              as: Bartender
          trigger:
            - call: "POST /nightclub/venues/${v_id}/close"
              payload: {}
              as: FloorManager
              captures: { posture: $.data.posture }
            - call: "GET /nightclub/reservations/${res_id}"
              payload: {}
              as: FloorManager
              captures: { res_st: $.data.status, res_sf: $.data.minimum_shortfall_cents }
            - call: "GET /nightclub/tabs/${rt_id}"
              payload: {}
              as: Bartender
              captures: { tab_st: $.data.status, tab_fin: $.data.final_total_cents }
          assert:
            - "Venue.${v_id}.posture == CLOSED"
            - "Reservation.${res_id}.status == SETTLED"
            - "Reservation.${res_id}.minimum_shortfall_cents == 42800"
            - "Tab.${rt_id}.status == SETTLED"
            - "Tab.${rt_id}.final_total_cents == 50000"

      - name: ejection_cascade_entry_occupancy_posture_depth3
        grounds:
          - state_machines.Entry.INSIDE_to_EJECTED
          - state_machines.Venue.AT_CAPACITY_to_OPEN
          - entities.Venue.fields.occupancy_count
          - entities.Venue.fields.posture
        distinguishing_aspect: "Depth-3 cascade from a different trigger (file incident with action EJECTION): incident -> Entry INSIDE->EJECTED (hop1) -> occupancy_count decrements (hop2) -> posture recompute AT_CAPACITY->OPEN (hop3). Distinct origin transition from the venue-close cascade."
        test_recipe:
          setup:
            - "Venue V cap 1. One PASS id-check, one Entry admitted (occupancy 1, posture AT_CAPACITY)."
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 1, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "A", date_of_birth: "1990-01-01", id_expiry: "2030-01-01" }
              as: DoorHost
              captures: { idc_a: $.data.id }
            - call: "POST /nightclub/entries"
              payload: { venue_id: "${v_id}", id_check_id: "${idc_a}", expected_venue_version: "${v0}" }
              as: DoorHost
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /nightclub/incidents"
              payload: { venue_id: "${v_id}", severity: "SERIOUS", action: "EJECTION", narrative: "fight", subject_entry_id: "${e_id}" }
              as: SecurityOfficer
            - call: "GET /nightclub/entries/${e_id}"
              payload: {}
              as: SecurityOfficer
              captures: { e_st: $.data.status }
            - call: "GET /nightclub/venues/${v_id}"
              payload: {}
              as: SecurityOfficer
              captures: { occ: $.data.occupancy_count, pos: $.data.posture }
          assert:
            - "Entry.${e_id}.status == EJECTED"
            - "Venue.${v_id}.occupancy_count == 0"
            - "Venue.${v_id}.posture == OPEN"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: id_check_safety_beats_capacity_constraint
        grounds:
          - validations[priority=9]
          - validations[priority=15]
          - errors[ERR_ID_CHECK_NOT_PASSED]
          - errors[ERR_AT_CAPACITY]
        distinguishing_aspect: "On admit, a request that both references a non-PASS id-check (business_safety p9) AND hits a full venue (business_constraint p15) returns ERR_ID_CHECK_NOT_PASSED (the lower priority number / safety category wins over capacity)."
        test_recipe:
          setup:
            - "Clock 2026-03-15. Venue V cap 1, already full (occupancy 1). A second IdCheck with outcome REFUSED_UNDERAGE (dob 2005-03-16 -> age 20)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 1, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "A", date_of_birth: "1990-01-01", id_expiry: "2030-01-01" }
              as: DoorHost
              captures: { idc_a: $.data.id }
            - call: "POST /nightclub/entries"
              payload: { venue_id: "${v_id}", id_check_id: "${idc_a}", expected_venue_version: "${v0}" }
              as: DoorHost
              captures: { v1: $.data.id }
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "B", date_of_birth: "2005-03-16", id_expiry: "2030-01-01" }
              as: DoorHost
              captures: { idc_b: $.data.id }
            - call: "GET /nightclub/venues/${v_id}"
              payload: {}
              as: DoorHost
              captures: { v_now: $.data.version }
          trigger:
            - call: "POST /nightclub/entries"
              payload: { venue_id: "${v_id}", id_check_id: "${idc_b}", expected_venue_version: "${v_now}" }
              as: DoorHost
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ID_CHECK_NOT_PASSED"
            - "response.http_status == 422"

      - name: stale_version_state_beats_double_book_constraint
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - errors[ERR_STALE_VENUE_VERSION]
          - errors[ERR_TABLE_DOUBLE_BOOKED]
          - concurrency_rules[reserve-table-stale-venue]
        distinguishing_aspect: "Booking a reservation that both carries a stale expected_venue_version (state p6) AND would double-book an occupied table_label window (business_constraint p13) returns ERR_STALE_VENUE_VERSION — a different category pair (state vs business_constraint) than the safety-vs-constraint conflict above."
        test_recipe:
          setup:
            - "Venue V. Reservation A BOOKED on table 'VIP-1' window [t0,t1). Venue version has advanced past what the client holds (it reads v0 before A was created)."
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/reservations"
              payload: { venue_id: "${v_id}", table_label: "VIP-1", party_size: 4, window_start_utc: "2026-03-16T01:00:00Z", window_end_utc: "2026-03-16T03:00:00Z", spend_minimum_cents: 10000, expected_venue_version: "${v0}" }
              as: FloorManager
              captures: { res_a: $.data.id }
          trigger:
            - call: "POST /nightclub/reservations"
              payload: { venue_id: "${v_id}", table_label: "VIP-1", party_size: 4, window_start_utc: "2026-03-16T02:00:00Z", window_end_utc: "2026-03-16T04:00:00Z", spend_minimum_cents: 10000, expected_venue_version: "${v0}" }
              as: FloorManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VENUE_VERSION"
            - "response.http_status == 412"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: age_exactly_21_passes_inclusive
        grounds:
          - calculations.patron_age_years
          - calculations.id_check_outcome
          - entities.IdCheck.fields.outcome
        distinguishing_aspect: "Age boundary at the /nightclub/id-checks endpoint: dob 2005-03-15 at clock 2026-03-15 is exactly age 21 -> PASS (inclusive); dob 2005-03-16 is age 20 -> REFUSED_UNDERAGE. This is the numeric-threshold edge."
        test_recipe:
          setup:
            - "Clock 2026-03-15T20:00:00Z. Venue V."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "Exactly21", date_of_birth: "2005-03-15", id_expiry: "2030-01-01" }
              as: DoorHost
              captures: { out21: $.data.outcome, age21: $.data.computed_age_years }
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "Day20", date_of_birth: "2005-03-16", id_expiry: "2030-01-01" }
              as: DoorHost
              captures: { out20: $.data.outcome, age20: $.data.computed_age_years }
          assert:
            - "IdCheck.Exactly21.computed_age_years == 21"
            - "IdCheck.Exactly21.outcome == PASS"
            - "IdCheck.Day20.computed_age_years == 20"
            - "IdCheck.Day20.outcome == REFUSED_UNDERAGE"

      - name: occupancy_at_exact_capacity_blocks_next_admit
        grounds:
          - validations[priority=15]
          - state_machines.Venue.OPEN_to_AT_CAPACITY
          - errors[ERR_AT_CAPACITY]
          - entities.Venue.fields.occupancy_count
        distinguishing_aspect: "Occupancy boundary at /nightclub/entries (a different endpoint and a count metric, not an age metric): admitting the cap-th patron succeeds and flips posture AT_CAPACITY; the (cap+1)-th admit is rejected ERR_AT_CAPACITY exactly when occupancy_count == fire_code_capacity."
        test_recipe:
          setup:
            - "Venue V cap 2. Two PASS id-checks A,B admitted (occupancy 2, posture AT_CAPACITY). A third PASS id-check C ready."
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 2, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "A", date_of_birth: "1990-01-01", id_expiry: "2030-01-01" }
              as: DoorHost
              captures: { idc_a: $.data.id }
            - call: "POST /nightclub/entries"
              payload: { venue_id: "${v_id}", id_check_id: "${idc_a}", expected_venue_version: "${v0}" }
              as: DoorHost
              captures: { ea: $.data.id, v1: $.data.version }
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "B", date_of_birth: "1990-01-01", id_expiry: "2030-01-01" }
              as: DoorHost
              captures: { idc_b: $.data.id }
            - call: "POST /nightclub/entries"
              payload: { venue_id: "${v_id}", id_check_id: "${idc_b}", expected_venue_version: "${v1}" }
              as: DoorHost
              captures: { eb: $.data.id, v2: $.data.version }
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "C", date_of_birth: "1990-01-01", id_expiry: "2030-01-01" }
              as: DoorHost
              captures: { idc_c: $.data.id }
          trigger:
            - call: "POST /nightclub/entries"
              payload: { venue_id: "${v_id}", id_check_id: "${idc_c}", expected_venue_version: "${v2}" }
              as: DoorHost
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_AT_CAPACITY"
            - "response.http_status == 409"
            - "Venue.${v_id}.occupancy_count == 2"
            - "Venue.${v_id}.posture == AT_CAPACITY"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: reservation_seat_requires_venue_not_last_call
        grounds:
          - state_machines.Reservation.BOOKED_to_SEATED
          - state_machines.Venue.OPEN_to_LAST_CALL
          - entities.Venue.fields.posture
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Reservation->Venue dependency: a BOOKED reservation can only SEAT while Venue.posture IN {OPEN, AT_CAPACITY}; once the clock pushes the venue to LAST_CALL the same seat is rejected ERR_INVALID_STATE. The valid next-state of Reservation depends on Venue's derived posture."
        test_recipe:
          setup:
            - "Venue V closing 2026-03-16T06:00:00Z, last_call_offset 30 (LAST_CALL begins 05:30). Reservation res BOOKED window [2026-01-01T00:00:00Z, 2026-03-16T06:00:00Z). Advance clock to 05:45 so posture is LAST_CALL but still inside the reservation window."
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z", last_call_offset_minutes: 30 }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/reservations"
              payload: { venue_id: "${v_id}", table_label: "T1", party_size: 2, window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2026-03-16T06:00:00Z", spend_minimum_cents: 10000, expected_venue_version: "${v0}" }
              as: FloorManager
              captures: { res_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-16T05:45:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /nightclub/reservations/${res_id}/seat"
              payload: {}
              as: FloorManager
              captures: { err: $.data.error_id }
          assert:
            - "Venue.${v_id}.posture == LAST_CALL"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: reservation_settle_requires_linked_tab_settleable
        grounds:
          - state_machines.Reservation.SEATED_to_SETTLED
          - state_machines.Tab.RUNNING_to_SETTLED
          - entities.Tab.fields.reservation_id
          - calculations.tab_final_total
        distinguishing_aspect: "Reservation->Tab dependency (a different entity pair than Reservation->Venue): settling a SEATED reservation drives the linked Tab (Tab.reservation_id == res.id) from RUNNING->SETTLED as part of the cascade; the reservation's settle outcome depends on the linked Tab's state and lines."
        test_recipe:
          setup:
            - "Venue V. Reservation res SEATED spend_minimum 5000 (met). Linked tab rt RUNNING grat 0.2 with one FOOD line @6000 (grand 7200 >= 5000, shortfall 0)."
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/reservations"
              payload: { venue_id: "${v_id}", table_label: "VIP-1", party_size: 4, window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2026-03-16T05:00:00Z", spend_minimum_cents: 5000, expected_venue_version: "${v0}" }
              as: FloorManager
              captures: { res_id: $.data.id }
            - call: "POST /nightclub/reservations/${res_id}/seat"
              payload: {}
              as: FloorManager
            - call: "POST /nightclub/tabs"
              payload: { venue_id: "${v_id}", patron_name: "VIP", preauth_cents: 100000, reservation_id: "${res_id}", gratuity_pct: 0.2 }
              as: Bartender
              captures: { rt_id: $.data.id }
            - call: "POST /nightclub/tabs/${rt_id}/items"
              payload: { name: "Platter", category: "FOOD", qty: 1, unit_price_cents: 6000 }
              as: Bartender
          trigger:
            - call: "POST /nightclub/reservations/${res_id}/settle"
              payload: {}
              as: FloorManager
              captures: { res_st: $.data.status, sf: $.data.minimum_shortfall_cents }
            - call: "GET /nightclub/tabs/${rt_id}"
              payload: {}
              as: Bartender
              captures: { tab_st: $.data.status, tab_fin: $.data.final_total_cents }
          assert:
            - "Reservation.${res_id}.status == SETTLED"
            - "Reservation.${res_id}.minimum_shortfall_cents == 0"
            - "Tab.${rt_id}.status == SETTLED"
            - "Tab.${rt_id}.final_total_cents == 7200"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: table_double_book_half_open_overlap_rejected
        grounds:
          - validations[priority=13]
          - errors[ERR_TABLE_DOUBLE_BOOKED]
          - entities.Reservation.fields.table_label
          - entities.Reservation.fields.window_start_utc
        distinguishing_aspect: "Reservation/table overlap uses HALF-OPEN [start,end) interval arithmetic with ZERO buffer: a second BOOKED reservation on the same table_label whose window strictly overlaps an existing one is rejected ERR_TABLE_DOUBLE_BOOKED; touching endpoints (next.start == prev.end) do NOT conflict (tested as the accepted control)."
        test_recipe:
          setup:
            - "Venue V. Reservation A BOOKED on 'VIP-1' window [01:00, 03:00). A second booking B on 'VIP-1' window [02:00, 04:00) overlaps."
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/reservations"
              payload: { venue_id: "${v_id}", table_label: "VIP-1", party_size: 4, window_start_utc: "2026-03-16T01:00:00Z", window_end_utc: "2026-03-16T03:00:00Z", spend_minimum_cents: 10000, expected_venue_version: "${v0}" }
              as: FloorManager
              captures: { res_a: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /nightclub/reservations"
              payload: { venue_id: "${v_id}", table_label: "VIP-1", party_size: 4, window_start_utc: "2026-03-16T02:00:00Z", window_end_utc: "2026-03-16T04:00:00Z", spend_minimum_cents: 10000, expected_venue_version: "${v1}" }
              as: FloorManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_TABLE_DOUBLE_BOOKED"
            - "response.http_status == 409"

      - name: patron_reentry_unbounded_active_interval_rejected
        grounds:
          - validations[priority=14]
          - errors[ERR_PATRON_ALREADY_INSIDE]
          - entities.Entry.fields.id_check_id
          - entities.Entry.fields.status
        distinguishing_aspect: "Entry/patron overlap uses an UNBOUNDED live-occupancy interval [admitted_at, +inf) keyed on id_check_id (different resource entity and different interval semantics than the bounded table window): re-admitting a patron whose prior Entry is still INSIDE is rejected ERR_PATRON_ALREADY_INSIDE; once that Entry EXITs the interval closes and re-admit succeeds (accepted control)."
        test_recipe:
          setup:
            - "Venue V cap 10. PASS id-check IDC. Entry e1 admitted via IDC (INSIDE, no exit -> open-ended interval)."
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "A", date_of_birth: "1990-01-01", id_expiry: "2030-01-01" }
              as: DoorHost
              captures: { idc: $.data.id }
            - call: "POST /nightclub/entries"
              payload: { venue_id: "${v_id}", id_check_id: "${idc}", expected_venue_version: "${v0}" }
              as: DoorHost
              captures: { e1: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /nightclub/entries"
              payload: { venue_id: "${v_id}", id_check_id: "${idc}", expected_venue_version: "${v1}" }
              as: DoorHost
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PATRON_ALREADY_INSIDE"
            - "response.http_status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: tab_void_item_then_readd_conserves_subtotal
        grounds:
          - state_machines.Tab.RUNNING_to_RUNNING
          - entities.Tab.fields.running_subtotal_cents
          - entities.Tab.fields.bac_strikes
          - calculations.tab_final_total
        distinguishing_aspect: "Conserved quantity = Tab.running_subtotal_cents (a money sum). Forward action add-item paired with its compensator void-item leaves running_subtotal_cents == sum(qty*unit_price over non-voided lines) exactly: add A(2000)+B(1500) -> 3500; void B -> 2000; the named invariant running_subtotal_cents == sum(non-voided) holds with no drift."
        test_recipe:
          setup:
            - "Venue V. Tab t RUNNING with two FOOD lines A @2000 and B @1500 (subtotal 3500)."
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /nightclub/tabs"
              payload: { venue_id: "${v_id}", patron_name: "T", preauth_cents: 100000, gratuity_pct: 0.2 }
              as: Bartender
              captures: { t_id: $.data.id }
            - call: "POST /nightclub/tabs/${t_id}/items"
              payload: { name: "A", category: "FOOD", qty: 1, unit_price_cents: 2000 }
              as: Bartender
              captures: { item_a: $.data.id }
            - call: "POST /nightclub/tabs/${t_id}/items"
              payload: { name: "B", category: "FOOD", qty: 1, unit_price_cents: 1500 }
              as: Bartender
              captures: { item_b: $.data.id }
          trigger:
            - call: "POST /nightclub/tabs/${t_id}/items/${item_b}/void"
              payload: {}
              as: Bartender
            - call: "GET /nightclub/tabs/${t_id}"
              payload: {}
              as: Bartender
              captures: { sub: $.data.running_subtotal_cents }
          assert:
            - "Tab.${t_id}.running_subtotal_cents == 2000"
            - "Tab.${t_id}.status == RUNNING"

      - name: reservation_cancel_refunds_deposit_conserves_occupancy
        grounds:
          - state_machines.Reservation.BOOKED_to_CANCELLED
          - entities.Reservation.fields.deposit_cents
          - entities.Venue.fields.occupancy_count
          - entities.Venue.fields.version
        distinguishing_aspect: "Conserved quantity = Venue.occupancy_count (a head count, distinct from a money sum): booking then cancelling a reservation (deposit refunded, BOOKED->CANCELLED) is a forward+compensating pair that leaves occupancy_count unchanged at 0 — reservations never themselves admit heads, so the count invariant holds with no drift."
        test_recipe:
          setup:
            - "Clock 2026-01-01 (before window). Venue V occupancy 0. Reservation res BOOKED window [2026-03-16T03:00:00Z, 2026-03-16T05:00:00Z) deposit 5000 (window not yet open -> cancellable)."
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/reservations"
              payload: { venue_id: "${v_id}", table_label: "T1", party_size: 2, window_start_utc: "2026-03-16T03:00:00Z", window_end_utc: "2026-03-16T05:00:00Z", spend_minimum_cents: 10000, deposit_cents: 5000, expected_venue_version: "${v0}" }
              as: FloorManager
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /nightclub/reservations/${res_id}/cancel"
              payload: {}
              as: FloorManager
              captures: { st: $.data.status }
            - call: "GET /nightclub/venues/${v_id}"
              payload: {}
              as: FloorManager
              captures: { occ: $.data.occupancy_count }
          assert:
            - "Reservation.${res_id}.status == CANCELLED"
            - "Venue.${v_id}.occupancy_count == 0"
