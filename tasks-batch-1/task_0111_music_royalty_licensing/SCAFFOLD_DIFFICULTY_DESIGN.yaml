            - call: "POST /rightsholders"
              payload: { legal_name: "R8", party_type: "WRITER", payee_country: "US", minimum_payout_cents: 1, withholding_pct: 0 }
              as: Administrator
              captures: { r8_id: $.data.id }
            - call: "POST /works"
              payload: { title: "Song Q", iswc: "T-000000017-0", pro_affiliation: "ASCAP", duration_seconds: 180 }
              as: Administrator
              captures: { workq_id: $.data.id }
            - call: "POST /composition-shares"
              payload: { work_id: "${workq_id}", rightsholder_id: "${r8_id}", role: "WRITER", split_bps: 10000 }
              as: Administrator
            - call: "POST /works/${workq_id}/register"
              payload: {}
              as: Administrator
            - call: "POST /recordings"
              payload: { work_id: "${workq_id}", isrc: "USAAA1700001", title: "Song Q Master", release_type: "STREAMING", duration_seconds: 180 }
              as: Administrator
              captures: { recq_id: $.data.id }
            - call: "POST /recording-shares"
              payload: { recording_id: "${recq_id}", rightsholder_id: "${r8_id}", split_bps: 10000 }
              as: Administrator
            - call: "POST /recordings/${recq_id}/lock-shares"
              payload: {}
              as: Administrator
            - call: "POST /rights-windows"
              payload: { recording_id: "${recq_id}", territory: "US", rights_type: "PERFORMANCE", term_start: "2026-12-01T00:00:00.000Z", term_end: "2027-01-01T00:00:00.000Z" }
              as: Administrator
            - call: "POST /statements"
              payload: { rightsholder_id: "${r8_id}", period_start: "2026-12-01T00:00:00.000Z", period_end: "2027-01-01T00:00:00.000Z" }
              as: RoyaltyOperator
              captures: { stmtq_id: $.data.id }
            - call: "POST /usage-events"
              payload: { recording_id: "${recq_id}", usage_type: "PERFORMANCE", territory: "US", occurred_at: "2026-12-15T00:00:00.000Z", quantity: 1000, gross_revenue_cents: 200000 }
              as: RoyaltyOperator
              captures: { ueq_id: $.data.id }
            - call: "POST /usage-events/${ueq_id}/allocate"
              payload: {}
              as: RoyaltyOperator
            - call: "GET /statements/${stmtq_id}"
              as: RoyaltyOperator
              captures: { stmtq_v: $.data.version }
            - call: "POST /statements/${stmtq_id}/finalize"
              payload: { expected_statement_version: "${stmtq_v}" }
              as: RoyaltyOperator
            - call: "POST /payouts"
              payload: { statement_id: "${stmtq_id}" }
              as: RoyaltyOperator
              captures: { payq_id: $.data.id }
          trigger:
            - call: "POST /payouts/${payq_id}/reverse"
              payload: {}
              as: RoyaltyOperator
          assert:
            - "Payout.${payq_id}.amount_cents == 112000 (captured the net at payout)"
            - "Statement.${stmtq_id}.status == FINALIZED after reverse (returned to pre-payout state)"
            - "Statement.${stmtq_id}.net_payable_cents == 112000 unchanged throughout (conserved payable position)"
