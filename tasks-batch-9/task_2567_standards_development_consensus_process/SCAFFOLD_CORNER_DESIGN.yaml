      - name: an_unexplained_negative_is_rejected_while_an_unexplained_abstain_is_accepted
        claim_type: conditional_validation
        grounds:
          - validations[priority=98]
          - errors[ERR_NEGATIVE_REQUIRES_COMMENT]
          - entities.Comment.fields.source_vote_id
        distinguishing_aspect: "comment_text is conditionally required on exactly one position value: the same seat sending NEGATIVE with no comment_text gets 400 ERR_NEGATIVE_REQUIRES_COMMENT while ABSTAIN with no comment_text is accepted, and the explained negative is the only one that spawns a BALLOT_NEGATIVE Comment."
        test_recipe:
