# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — Hydrant Flow Testing & Flushing Program
# §1.9 Corner Design: breadth coverage of every §1.1–§1.7 claim that §1.8 does
# not already exercise. Logical clock default is 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------- entities ---
  - section: entities
    instances:
      - name: hydrant_create_applies_defaults
        claim_type: defaults
        grounds: [entities.Hydrant.fields.outlet_diameter_in, entities.Hydrant.fields.discharge_coefficient, entities.Hydrant.fields.status]
        distinguishing_aspect: "Omitting outlet_diameter_in and discharge_coefficient stores the defaults 2.5 and 0.9; new hydrant starts IN_SERVICE at version 1."
        test_recipe:
          setup: ["Program OPEN and zone exist"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
          trigger:
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1500 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
          assert:
            - "Hydrant.${h_id}.outlet_diameter_in == 2.5 and discharge_coefficient == 0.9"
            - "Hydrant.${h_id}.status == IN_SERVICE and version == 1 and inspection_tier == CURRENT"
            - "Hydrant.${h_id}.provisional_fire_flow_gpm is null and approved_fire_flow_gpm is null"

      - name: hydrant_create_private_missing_owner_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Hydrant.fields.private_owner_id, "errors[ERR_INVALID_REQUEST]", "validations[priority=2]"]
        distinguishing_aspect: "Conditional-required field: ownership PRIVATE without private_owner_id is a schema-level ERR_INVALID_REQUEST (400), not a state error."
        test_recipe:
          setup: ["Program OPEN and zone exist"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
          trigger:
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "PRIVATE", required_fire_flow_gpm: 1500 }, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400; no hydrant is persisted"

      - name: hydrant_number_duplicate_rejected
        claim_type: type_constraints
        grounds: [entities.Hydrant.fields.hydrant_number, "errors[ERR_HYDRANT_NUMBER_NOT_UNIQUE]"]
        distinguishing_aspect: "Uniqueness constraint on hydrant_number fires on the second create with an identical number."
        test_recipe:
          setup: ["Program OPEN, zone, hydrant H-100 already registered"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1500 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
          trigger:
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 2000 }, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_HYDRANT_NUMBER_NOT_UNIQUE with http 409"

      - name: hydrant_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_HYDRANT_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "GET with a well-formed but unknown hydrant id returns ERR_HYDRANT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /hydrants/00000000-0000-0000-0000-000000000000", as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_HYDRANT_NOT_FOUND with http 404"

      - name: iso_snapshot_draft_metrics_null
        claim_type: computed_fields
        grounds: [entities.ISOSnapshot.fields.iso_points, state_machines.ISOSnapshot]
        distinguishing_aspect: "A freshly created snapshot is DRAFT and every computed metric is null until publish pins them."
        test_recipe:
          setup: ["Program OPEN with one hydrant"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1500 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
          trigger:
            - { call: "POST /programs/${prog_id}/iso-snapshots", payload: { weighting_profile: "MUNICIPAL_ONLY" }, as: ProgramAdmin, captures: { snap_id: $.data.id } }
          assert:
            - "ISOSnapshot.${snap_id}.status == DRAFT"
            - "ISOSnapshot.${snap_id}.iso_points is null and flow_coverage_pct is null and published_at is null"

      - name: inspection_create_sets_hydrant_pointer_and_bumps_version
        claim_type: side_effect_execution
        grounds: ["concurrency_rules[inspection-create-stale-hydrant]", entities.Hydrant.fields.latest_inspection_id]
        distinguishing_aspect: "Successful inspection create writes Hydrant.latest_inspection_id and increments Hydrant.version from 1 to 2 — the OCC-observable mutation."
        test_recipe:
          setup: ["Program OPEN, zone, hydrant H at version 1"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1500 }, as: ProgramAdmin, captures: { h_id: $.data.id, h_v: $.data.version } }
          trigger:
            - { call: "POST /inspections", payload: { hydrant_id: "${h_id}", scheduled_date: "2026-08-10T00:00:00Z", expected_hydrant_version: "${h_v}" }, as: FieldOperator, as_user_id: "op_1", captures: { in_id: $.data.id } }
            - { call: "GET /hydrants/${h_id}", as: FieldOperator, as_user_id: "op_1" }
          assert:
            - "Inspection.${in_id}.status == SCHEDULED"
            - "Hydrant.${h_id}.latest_inspection_id == ${in_id} and version == 2"

  # -------------------------------------------------------- state_machines ---
  - section: state_machines
    instances:
      - name: flowtest_results_from_cancelled_rejected
        claim_type: invalid_transition
        grounds: [state_machines.FlowTest.SCHEDULED_to_RESULTS_SUBMITTED, "errors[ERR_FLOW_TEST_NOT_SCHEDULED]"]
        distinguishing_aspect: "A CANCELLED flow test is terminal for results: submitting readings returns ERR_FLOW_TEST_NOT_SCHEDULED and computes nothing."
        test_recipe:
          setup: ["Program, zone, hydrant H; flow test FT cancelled while SCHEDULED"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /flow-tests", payload: { hydrant_id: "${h_id}", window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T11:00:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { ft_id: $.data.id } }
            - { call: "POST /flow-tests/${ft_id}/cancel", as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:30:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /flow-tests/${ft_id}/results", payload: { static_psi: 80, residual_psi: 40, pitot_psi: 64 }, as: FieldOperator, as_user_id: "op_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FLOW_TEST_NOT_SCHEDULED with http 409"
            - "FlowTest.${ft_id}.flow_at_20psi_gpm remains null and status remains CANCELLED"

      - name: inspection_verify_twice_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Inspection.PENDING_VERIFICATION_to_VERIFIED, "errors[ERR_INSPECTION_NOT_PENDING_VERIFICATION]"]
        distinguishing_aspect: "VERIFIED is terminal: a second verify returns ERR_INSPECTION_NOT_PENDING_VERIFICATION."
        test_recipe:
          setup: ["Hydrant H; inspection recorded by op_1 and verified by sup_1 (PASS)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id, h_v: $.data.version } }
            - { call: "POST /inspections", payload: { hydrant_id: "${h_id}", scheduled_date: "2026-08-10T00:00:00Z", expected_hydrant_version: "${h_v}" }, as: FieldOperator, as_user_id: "op_1", captures: { in_id: $.data.id } }
            - { call: "POST /inspections/${in_id}/record", payload: { performed_date: "2026-08-10T00:00:00Z", defects_found: false }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /inspections/${in_id}/verify", payload: { decision: "VERIFY" }, as: UtilitySupervisor, as_user_id: "sup_1" }
          trigger:
            - { call: "POST /inspections/${in_id}/verify", payload: { decision: "VERIFY" }, as: UtilitySupervisor, as_user_id: "sup_2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSPECTION_NOT_PENDING_VERIFICATION with http 409"
            - "Inspection.${in_id}.status remains VERIFIED and result == PASS"

      - name: sequence_abort_from_completed_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.FlushSequence.IN_PROGRESS_to_ABORTED, "errors[ERR_SEQUENCE_NOT_IN_PROGRESS]"]
        distinguishing_aspect: "COMPLETED is terminal for abort: aborting a completed sequence returns ERR_SEQUENCE_NOT_IN_PROGRESS; computed totals stay pinned."
        test_recipe:
          setup: ["Sequence S COMPLETED (1 step executed, residual 0.05)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /flush-sequences", payload: { program_id: "${prog_id}", zone_id: "${zone_id}", hydrant_id: "${h_id}", window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T12:00:00Z", steps: [{ step_index: 1, valve_tag: "V-A", action: "OPEN" }] }, as: FieldOperator, as_user_id: "op_1", captures: { seq_id: $.data.id } }
            - { call: "POST /flush-sequences/${seq_id}/start", payload: { source_chlorine_residual_mg_L: 1.0 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /flush-sequences/${seq_id}/execute-step", payload: { step_index: 1, flow_gpm: 400, duration_minutes: 10 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /flush-sequences/${seq_id}/complete", payload: { final_discharge_residual_mg_L: 0.05 }, as: FieldOperator, as_user_id: "op_1" }
          trigger:
            - { call: "POST /flush-sequences/${seq_id}/abort", as: FieldOperator, as_user_id: "op_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SEQUENCE_NOT_IN_PROGRESS with http 409"
            - "FlushSequence.${seq_id}.status remains COMPLETED and total_flushed_gallons == 4000"

      - name: outage_close_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.HydrantOutage.ACTIVE_to_CLOSED, "errors[ERR_OUTAGE_NOT_ACTIVE]"]
        distinguishing_aspect: "Closing an already-CLOSED outage returns ERR_OUTAGE_NOT_ACTIVE; counters are not decremented twice."
        test_recipe:
          setup: ["Hydrant H cycled OUT_OF_SERVICE and back (outage closed)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /outages", payload: { hydrant_id: "${h_id}", reason: "LEAK" }, as: FieldOperator, as_user_id: "op_1", captures: { out_id: $.data.id } }
            - { call: "POST /outages/${out_id}/acknowledge-notification", as: FireDeptLiaison, as_user_id: "fd_1" }
            - { call: "POST /outages/${out_id}/close", as: FieldOperator, as_user_id: "op_1" }
          trigger:
            - { call: "POST /outages/${out_id}/close", as: FieldOperator, as_user_id: "op_1", captures: { err: $.data.error_id } }
            - { call: "GET /programs/${prog_id}", as: ProgramAdmin }
          assert:
            - "error_id == ERR_OUTAGE_NOT_ACTIVE with http 409"
            - "FlushingProgram.${prog_id}.hydrants_out_of_service_count == 0 (no double decrement)"

      - name: flowtest_missed_on_sweep_then_reschedule
        claim_type: valid_transition
        grounds: [state_machines.FlowTest.SCHEDULED_to_MISSED, state_machines.FlowTest.MISSED_to_SCHEDULED]
        distinguishing_aspect: "Sweep converts a stale SCHEDULED test (window_end < clock) to MISSED; reschedule from MISSED re-enters SCHEDULED with the new window."
        test_recipe:
          setup: ["Hydrant H; flow test FT SCHEDULED for window 2026-08-02T10:00-11:00Z; clock advanced to 2026-08-05T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /flow-tests", payload: { hydrant_id: "${h_id}", window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T11:00:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { ft_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /programs/${prog_id}/sweep", as: ProgramAdmin, captures: { missed: $.data.missed_flow_tests } }
            - { call: "POST /flow-tests/${ft_id}/reschedule", payload: { window_start: "2026-08-06T10:00:00Z", window_end: "2026-08-06T11:00:00Z" }, as: FieldOperator, as_user_id: "op_1" }
          assert:
            - "sweep returns missed_flow_tests == 1"
            - "FlowTest.${ft_id}.status == SCHEDULED with window_start == 2026-08-06T10:00:00Z after reschedule"

      - name: outage_escalation_on_sweep
        claim_type: side_effect_execution
        grounds: [entities.HydrantOutage.fields.escalated, entities.HydrantOutage.fields.ack_deadline]
        distinguishing_aspect: "An outage whose notification stays PENDING past ack_deadline (created + 2h) is flagged escalated by the sweep; counters keep the unacknowledged count."
        test_recipe:
          setup: ["Hydrant H tagged OUT_OF_SERVICE at default clock 2026-08-01T00:00:00Z (ack_deadline 2026-08-01T02:00:00Z); clock advanced to 2026-08-01T03:00:00Z"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /outages", payload: { hydrant_id: "${h_id}", reason: "DAMAGE" }, as: FieldOperator, as_user_id: "op_1", captures: { out_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T03:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /programs/${prog_id}/sweep", as: ProgramAdmin, captures: { esc: $.data.escalated_outages } }
            - { call: "GET /outages/${out_id}", as: ProgramAdmin }
          assert:
            - "sweep returns escalated_outages == 1"
            - "HydrantOutage.${out_id}.escalated == true and notification_status remains PENDING"
            - "FlushingProgram.${prog_id}.unacknowledged_notification_count == 1"

      - name: inspection_fail_verification_autocreates_work_order
        claim_type: side_effect_execution
        grounds: [state_machines.Inspection.PENDING_VERIFICATION_to_VERIFIED, entities.RepairWorkOrder.fields.source_inspection_id]
        distinguishing_aspect: "A VERIFY decision with defects_found true yields result FAIL and auto-creates a DRAFT RepairWorkOrder linked via source_inspection_id with created_by_user_id 'system'."
        test_recipe:
          setup: ["Hydrant H; inspection recorded with defects_found true"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id, h_v: $.data.version } }
            - { call: "POST /inspections", payload: { hydrant_id: "${h_id}", scheduled_date: "2026-08-10T00:00:00Z", expected_hydrant_version: "${h_v}" }, as: FieldOperator, as_user_id: "op_1", captures: { in_id: $.data.id } }
            - { call: "POST /inspections/${in_id}/record", payload: { performed_date: "2026-08-10T00:00:00Z", defects_found: true, condition_notes: "broken cap" }, as: FieldOperator, as_user_id: "op_1" }
          trigger:
            - { call: "POST /inspections/${in_id}/verify", payload: { decision: "VERIFY" }, as: UtilitySupervisor, as_user_id: "sup_1" }
            - { call: "GET /work-orders", payload: { hydrant_id: "${h_id}" }, as: UtilitySupervisor, as_user_id: "sup_1" }
          assert:
            - "Inspection.${in_id}.result == FAIL and status == VERIFIED"
            - "GET /work-orders?hydrant_id=${h_id} returns exactly 1 work order: status DRAFT, source_inspection_id == ${in_id}, created_by_user_id == 'system'"
            - "Hydrant.${h_id}.last_verified_inspection_date == 2026-08-10T00:00:00Z"

      - name: sequence_complete_resolves_linked_complaint
        claim_type: side_effect_execution
        grounds: [state_machines.FlushSequence.IN_PROGRESS_to_COMPLETED, state_machines.WaterQualityComplaint.LINKED_to_RESOLVED]
        distinguishing_aspect: "Completion cascades to complaints: the LINKED complaint flips to RESOLVED and the hydrant's targeted_flush_pending clears."
        test_recipe:
          setup: ["Hydrant H; sequence S with 1 step; complaint C (category ODOR, OPEN) manually linked to S; S IN_PROGRESS with step executed"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /flush-sequences", payload: { program_id: "${prog_id}", zone_id: "${zone_id}", hydrant_id: "${h_id}", window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T12:00:00Z", steps: [{ step_index: 1, valve_tag: "V-A", action: "OPEN" }] }, as: FieldOperator, as_user_id: "op_1", captures: { seq_id: $.data.id } }
            - { call: "POST /complaints", payload: { hydrant_id: "${h_id}", category: "ODOR" }, as: FieldOperator, as_user_id: "op_1", captures: { c_id: $.data.id } }
            - { call: "POST /complaints/${c_id}/link", payload: { flush_sequence_id: "${seq_id}" }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /flush-sequences/${seq_id}/start", payload: { source_chlorine_residual_mg_L: 1.0 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /flush-sequences/${seq_id}/execute-step", payload: { step_index: 1, flow_gpm: 400, duration_minutes: 10 }, as: FieldOperator, as_user_id: "op_1" }
          trigger:
            - { call: "POST /flush-sequences/${seq_id}/complete", payload: { final_discharge_residual_mg_L: 0.05 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "GET /complaints/${c_id}", as: FieldOperator, as_user_id: "op_1" }
          assert:
            - "WaterQualityComplaint.${c_id}.status == RESOLVED"
            - "FlushSequence.${seq_id}.status == COMPLETED"

      - name: sequence_abort_returns_linked_complaint_to_open
        claim_type: side_effect_execution
        grounds: [state_machines.FlushSequence.IN_PROGRESS_to_ABORTED, state_machines.WaterQualityComplaint.LINKED_to_OPEN]
        distinguishing_aspect: "Abort compensation reverses the link: the complaint returns to OPEN with flush_sequence_id cleared — no drift after the compensating action."
        test_recipe:
          setup: ["Hydrant H; sequence S IN_PROGRESS; complaint C (ODOR) LINKED to S"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /flush-sequences", payload: { program_id: "${prog_id}", zone_id: "${zone_id}", hydrant_id: "${h_id}", window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T12:00:00Z", steps: [{ step_index: 1, valve_tag: "V-A", action: "OPEN" }] }, as: FieldOperator, as_user_id: "op_1", captures: { seq_id: $.data.id } }
            - { call: "POST /complaints", payload: { hydrant_id: "${h_id}", category: "ODOR" }, as: FieldOperator, as_user_id: "op_1", captures: { c_id: $.data.id } }
            - { call: "POST /complaints/${c_id}/link", payload: { flush_sequence_id: "${seq_id}" }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /flush-sequences/${seq_id}/start", payload: { source_chlorine_residual_mg_L: 1.0 }, as: FieldOperator, as_user_id: "op_1" }
          trigger:
            - { call: "POST /flush-sequences/${seq_id}/abort", as: FieldOperator, as_user_id: "op_1" }
            - { call: "GET /complaints/${c_id}", as: FieldOperator, as_user_id: "op_1" }
          assert:
            - "FlushSequence.${seq_id}.status == ABORTED"
            - "WaterQualityComplaint.${c_id}.status == OPEN and flush_sequence_id is null"

      - name: rejected_flowtest_recomputes_provisional
        claim_type: side_effect_execution
        grounds: [state_machines.FlowTest.RESULTS_SUBMITTED_to_REJECTED, calculations.hydrant_available_fire_flow]
        distinguishing_aspect: "Rejecting the latest submitted test recomputes provisional_fire_flow_gpm from the remaining non-terminal tests (falls back from 1589 to 1671)."
        test_recipe:
          setup:
            - "Hydrant H; FT1 RESULTS_SUBMITTED with Q20 1671; FT2 RESULTS_SUBMITTED with Q20 1589 (provisional currently 1589)"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /flow-tests", payload: { hydrant_id: "${h_id}", window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T11:00:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { ft1_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:30:00Z" }, as: ProgramAdmin }
            - { call: "POST /flow-tests/${ft1_id}/results", payload: { static_psi: 80, residual_psi: 40, pitot_psi: 64 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /flow-tests", payload: { hydrant_id: "${h_id}", window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T11:00:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { ft2_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:30:00Z" }, as: ProgramAdmin }
            - { call: "POST /flow-tests/${ft2_id}/results", payload: { static_psi: 90, residual_psi: 50, pitot_psi: 49 }, as: FieldOperator, as_user_id: "op_1" }
          trigger:
            - { call: "POST /flow-tests/${ft2_id}/review", payload: { decision: "REJECT" }, as: UtilitySupervisor, as_user_id: "sup_1" }
            - { call: "GET /hydrants/${h_id}", as: UtilitySupervisor, as_user_id: "sup_1" }
          assert:
            - "FlowTest.${ft2_id}.status == REJECTED"
            - "Hydrant.${h_id}.provisional_fire_flow_gpm == 1671 (recomputed from FT1)"
            - "Hydrant.${h_id}.approved_fire_flow_gpm is null (nothing APPROVED yet)"

  # ---------------------------------------------------------- calculations ---
  - section: calculations
    instances:
      - name: inspection_tier_boundaries_via_sweep
        claim_type: correct_result
        grounds: [calculations.inspection_due_tier, entities.Hydrant.fields.inspection_tier]
        distinguishing_aspect: "Tier thresholds pinned at exact boundaries for a never-inspected municipal hydrant (baseline created_at 2026-08-01): due-30d 2027-07-02 -> DUE_SOON, due 2027-08-01 -> OVERDUE, due+90d 2027-10-30 -> CRITICAL."
        test_recipe:
          setup: ["Program, zone, hydrant H created at default clock 2026-08-01T00:00:00Z, no inspections (municipal, 12-month cycle)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-07-02T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /programs/${prog_id}/sweep", as: ProgramAdmin }
            - { call: "GET /hydrants/${h_id}", as: ProgramAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /programs/${prog_id}/sweep", as: ProgramAdmin }
            - { call: "GET /hydrants/${h_id}", as: ProgramAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-10-30T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /programs/${prog_id}/sweep", as: ProgramAdmin }
            - { call: "GET /hydrants/${h_id}", as: ProgramAdmin }
          assert:
            - "At 2027-07-02 (exactly due - 30 days): inspection_tier == DUE_SOON"
            - "At 2027-08-01 (exactly due date): inspection_tier == OVERDUE"
            - "At 2027-10-30 (exactly due + 90 days): inspection_tier == CRITICAL"

      - name: dechlorination_tablet_ceiling
        claim_type: constants_applied
        grounds: [calculations.dechlorination_tablets]
        distinguishing_aspect: "Ceiling semantics: a small flush (1000 gal at 0.5 mg/L -> 1892.5 mg) still requires exactly 1 tablet (ceil of 0.2226)."
        test_recipe:
          setup: ["Hydrant H; sequence S IN_PROGRESS with residual 0.5, one step executed at 100 gpm for 10 minutes"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /flush-sequences", payload: { program_id: "${prog_id}", zone_id: "${zone_id}", hydrant_id: "${h_id}", window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T12:00:00Z", steps: [{ step_index: 1, valve_tag: "V-A", action: "OPEN" }] }, as: FieldOperator, as_user_id: "op_1", captures: { seq_id: $.data.id } }
            - { call: "POST /flush-sequences/${seq_id}/start", payload: { source_chlorine_residual_mg_L: 0.5 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /flush-sequences/${seq_id}/execute-step", payload: { step_index: 1, flow_gpm: 100, duration_minutes: 10 }, as: FieldOperator, as_user_id: "op_1" }
          trigger:
            - { call: "POST /flush-sequences/${seq_id}/complete", payload: { final_discharge_residual_mg_L: 0.05 }, as: FieldOperator, as_user_id: "op_1" }
          assert:
            - "FlushSequence.${seq_id}.total_flushed_gallons == 1000"
            - "FlushSequence.${seq_id}.dechlorination_tablets_required == 1"

      - name: pressure_residual_must_exceed_twenty
        claim_type: violation_to_error
        grounds: [calculations.flow_at_20psi, "errors[ERR_PRESSURE_READING_INVALID]"]
        distinguishing_aspect: "Boundary on the validity gate: residual_psi exactly 20 violates the strict > 20 rule and is rejected before any flow arithmetic."
        test_recipe:
          setup: ["Hydrant H; flow test FT SCHEDULED; clock inside window"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /flow-tests", payload: { hydrant_id: "${h_id}", window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T11:00:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { ft_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:30:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /flow-tests/${ft_id}/results", payload: { static_psi: 80, residual_psi: 20, pitot_psi: 64 }, as: FieldOperator, as_user_id: "op_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PRESSURE_READING_INVALID with http 422; FlowTest remains SCHEDULED with null results"

      - name: pressure_static_must_exceed_residual
        claim_type: violation_to_error
        grounds: [calculations.flow_at_20psi, "errors[ERR_PRESSURE_READING_INVALID]"]
        distinguishing_aspect: "static_psi equal to residual_psi (40 == 40) violates the strict ordering and is rejected with the same safety error."
        test_recipe:
          setup: ["Hydrant H; flow test FT SCHEDULED; clock inside window"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /flow-tests", payload: { hydrant_id: "${h_id}", window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T11:00:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { ft_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:30:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /flow-tests/${ft_id}/results", payload: { static_psi: 40, residual_psi: 40, pitot_psi: 64 }, as: FieldOperator, as_user_id: "op_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PRESSURE_READING_INVALID with http 422"

      - name: iso_publish_points_literal_municipal
        claim_type: correct_result
        grounds: [calculations.iso_rating_points]
        distinguishing_aspect: "Excluded here — the two-profile publish with pinned literals (53.3 / 60.0) is the difficulty instance."
        excluded_because:
          difficulty_instance: dual_variant_calc / iso_points_municipal_only_vs_half_private
          rationale: "That instance publishes both weighting profiles over identical data and asserts the pinned iso_points literals."

      - name: flow_formula_literal_covered
        claim_type: correct_result
        grounds: [calculations.pitot_flow, calculations.flow_at_20psi]
        distinguishing_aspect: "Excluded — pinned pitot/Q20 literals are asserted in the difficulty instance."
        excluded_because:
          difficulty_instance: combinatorial_formula / flow_at_20psi_three_input_exponent
          rationale: "Asserts pitot_flow_gpm == 1342.35 and flow_at_20psi_gpm == 1671 with classification PASS."

      - name: flush_rounding_literal_covered
        claim_type: precision
        grounds: [calculations.flush_volume_total]
        distinguishing_aspect: "Excluded — per-step rounding order pinned by the difficulty instance."
        excluded_because:
          difficulty_instance: combinatorial_formula / flush_volume_per_step_rounding
          rationale: "Asserts total_flushed_gallons == 3305 against the forbidden sum-then-round value 3304."

  # ------------------------------------------------------------ validations ---
  - section: validations
    instances:
      - name: hydrant_create_missing_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Requests without X-User-ID/X-User-Role headers fail at priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any schema or role check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "00000000-0000-0000-0000-000000000000", zone_id: "00000000-0000-0000-0000-000000000000", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER with http 400 (call sent with no X-User-* headers)"

      - name: complaint_create_invalid_enum_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", entities.WaterQualityComplaint.fields.category]
        distinguishing_aspect: "An out-of-enum category value is a schema error ERR_INVALID_REQUEST (400), evaluated before state or business checks."
        test_recipe:
          setup: ["Program, zone, hydrant H"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
          trigger:
            - { call: "POST /complaints", payload: { hydrant_id: "${h_id}", category: "NOISE" }, as: FieldOperator, as_user_id: "op_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400; no complaint persisted"

      - name: sod_verify_own_inspection_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties: a supervisor whose X-User-ID equals the inspection's performed_by_user_id cannot verify it, even though the role is correct."
        test_recipe:
          setup: ["Hydrant H; inspection recorded by user op_1 (FieldOperator)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id, h_v: $.data.version } }
            - { call: "POST /inspections", payload: { hydrant_id: "${h_id}", scheduled_date: "2026-08-10T00:00:00Z", expected_hydrant_version: "${h_v}" }, as: FieldOperator, as_user_id: "op_1", captures: { in_id: $.data.id } }
            - { call: "POST /inspections/${in_id}/record", payload: { performed_date: "2026-08-10T00:00:00Z", defects_found: false }, as: FieldOperator, as_user_id: "op_1" }
          trigger:
            - { call: "POST /inspections/${in_id}/verify", payload: { decision: "VERIFY" }, as: UtilitySupervisor, as_user_id: "op_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES with http 403; inspection remains PENDING_VERIFICATION"

      - name: sod_review_own_flowtest_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", state_machines.FlowTest.RESULTS_SUBMITTED_to_APPROVED]
        distinguishing_aspect: "The reviewer must differ from the recorder: X-User-ID op_1 reviewing own results gets ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["Hydrant H; flow test FT with results recorded by op_1"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /flow-tests", payload: { hydrant_id: "${h_id}", window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T11:00:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { ft_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:30:00Z" }, as: ProgramAdmin }
            - { call: "POST /flow-tests/${ft_id}/results", payload: { static_psi: 80, residual_psi: 40, pitot_psi: 64 }, as: FieldOperator, as_user_id: "op_1" }
          trigger:
            - { call: "POST /flow-tests/${ft_id}/review", payload: { decision: "APPROVE" }, as: UtilitySupervisor, as_user_id: "op_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES with http 403; FlowTest remains RESULTS_SUBMITTED"

      - name: sod_approve_own_work_order_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", state_machines.RepairWorkOrder.SUBMITTED_to_APPROVED]
        distinguishing_aspect: "The approver must differ from the creator: X-User-ID op_1 approving the order op_1 created gets ERR_SEGREGATION_OF_DUTIES, checked before the OCC comparison."
        test_recipe:
          setup: ["Hydrant H; part P; work order W created by op_1, one line, SUBMITTED"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /parts", payload: { sku: "GASKET-6", name: "6in gasket", unit_price_cents: 6500, on_hand_qty: 100 }, as: ProgramAdmin, captures: { part_id: $.data.id } }
            - { call: "POST /work-orders", payload: { hydrant_id: "${h_id}", description: "Replace gaskets" }, as: FieldOperator, as_user_id: "op_1", captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/part-lines", payload: { part_id: "${part_id}", qty: 1 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /work-orders/${wo_id}/submit", as: FieldOperator, as_user_id: "op_1" }
            - { call: "GET /work-orders/${wo_id}", as: UtilitySupervisor, as_user_id: "op_1", captures: { wo_v: $.data.version } }
          trigger:
            - { call: "POST /work-orders/${wo_id}/approve", payload: { expected_work_order_version: "${wo_v}" }, as: UtilitySupervisor, as_user_id: "op_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES with http 403; work order remains SUBMITTED with lines PENDING"

      - name: private_hydrant_record_by_operator_rejected
        claim_type: conditional_validation
        grounds: ["validations[priority=4]", "errors[ERR_HYDRANT_OWNERSHIP_MISMATCH]"]
        distinguishing_aspect: "Ownership scoping: a FieldOperator may not record inspection evidence on a PRIVATE hydrant (owner rep only) — ERR_HYDRANT_OWNERSHIP_MISMATCH (403)."
        test_recipe:
          setup: ["Owner O1; PRIVATE hydrant H owned by O1; inspection opened by operator"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /private-owners", payload: { name: "Mall Corp", contact_email: "ops@mall.example" }, as: ProgramAdmin, captures: { owner_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-P1", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "PRIVATE", private_owner_id: "${owner_id}", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id, h_v: $.data.version } }
            - { call: "POST /inspections", payload: { hydrant_id: "${h_id}", scheduled_date: "2026-08-10T00:00:00Z", expected_hydrant_version: "${h_v}" }, as: FieldOperator, as_user_id: "op_1", captures: { in_id: $.data.id } }
          trigger:
            - { call: "POST /inspections/${in_id}/record", payload: { performed_date: "2026-08-10T00:00:00Z", defects_found: false }, as: FieldOperator, as_user_id: "op_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_HYDRANT_OWNERSHIP_MISMATCH with http 403; inspection remains SCHEDULED"

      - name: sequence_program_mismatch_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=10]", "errors[ERR_PROGRAM_MISMATCH]", entities.FlushSequence.fields.program_id]
        distinguishing_aspect: "Referential consistency: a flush sequence whose program_id differs from its hydrant's program is rejected with ERR_PROGRAM_MISMATCH even though both programs exist."
        test_recipe:
          setup: ["Programs P1 and P2 OPEN; zone; hydrant H in P1"]
          setup_api_calls:
