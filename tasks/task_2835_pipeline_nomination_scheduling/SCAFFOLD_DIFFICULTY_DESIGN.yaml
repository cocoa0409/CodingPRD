  - rule_id: resource_temporal_overlap
    instances:
      - name: maintenance_window_buffer_conflict_on_segment
        grounds:
          - validations[priority=58]
          - errors[ERR_MAINTENANCE_WINDOW_CONFLICT]
          - entities.MaintenanceEvent.fields.window_start
          - entities.MaintenanceEvent.fields.window_end
        distinguishing_aspect: |
          The contended resource is the single PipelineSegment and the exclusion zone is padded: a
          new window starting 2026-09-13T00:00:00Z is refused because it lands exactly on the
          closed 24-hour buffer after an existing PLANNED window that ends 2026-09-12T00:00:00Z,
          while a window starting one day later at 2026-09-14T00:00:00Z is accepted with 201.
        test_recipe:
          setup:
            - "Segment HOU-NAS exists and is OPERATIONAL with no maintenance history."
            - "One MaintenanceEvent of kind PIGGING is PLANNED for 2026-09-10T00:00:00Z to 2026-09-12T00:00:00Z."
            - "The 24-hour buffer on each side makes the effective exclusion zone 2026-09-09T00:00:00Z to 2026-09-13T00:00:00Z, compared closed-closed."
            - "The logical clock is 2026-08-01T00:00:00Z; nothing has been notified, so the segment is not derated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TariffAdministrator
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "HOU", name: "Houston Origin", role_kind: "ORIGIN", shell_capacity_bbl: 500000, min_operating_inventory_bbl: 10000, injection_bays: 2 }
              as: TariffAdministrator
              captures: { org_id: "$.data.id" }
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "NAS", name: "Nashville Delivery", role_kind: "DESTINATION", shell_capacity_bbl: 400000, min_operating_inventory_bbl: 5000 }
              as: TariffAdministrator
              captures: { dst_id: "$.data.id" }
            - call: "POST /pipeline/product-grades"
              payload: { grade_code: "ULSD", name: "Ultra Low Sulfur Diesel", sequence_rank: 3, max_sulfur_ppm: 15, max_rvp_psi: 12 }
              as: TariffAdministrator
              captures: { ulsd_id: "$.data.id" }
            - call: "POST /pipeline/segments"
              payload: { segment_code: "HOU-NAS", origin_terminal_id: "${org_id}", destination_terminal_id: "${dst_id}", linefill_grade_id: "${ulsd_id}", capacity_bbl_per_cycle: 101000, transmix_reserve_bbl: 1000, transmix_cut_bbl: 250, min_tender_bbl: 6000, linefill_requirement_bbl: 20000, proration_policy: "HISTORY_WEIGHTED" }
              as: TariffAdministrator
              captures: { seg_id: "$.data.id" }
            - call: "POST /pipeline/maintenance-events"
              payload: { segment_id: "${seg_id}", kind: "PIGGING", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-12T00:00:00Z", capacity_derate_pct: 0.30, notes: "scraper run" }
              as: PipelineScheduler
              captures: { mev_first_id: "$.data.id" }
          trigger:
            - call: "POST /pipeline/maintenance-events"
              payload: { segment_id: "${seg_id}", kind: "INTEGRITY_DIG", window_start: "2026-09-13T00:00:00Z", window_end: "2026-09-14T00:00:00Z", capacity_derate_pct: 0.20, notes: "anomaly verification dig, inside the buffer" }
              as: PipelineScheduler
            - call: "POST /pipeline/maintenance-events"
              payload: { segment_id: "${seg_id}", kind: "INTEGRITY_DIG", window_start: "2026-09-14T00:00:00Z", window_end: "2026-09-15T00:00:00Z", capacity_derate_pct: 0.20, notes: "anomaly verification dig, clear of the buffer" }
              as: PipelineScheduler
              captures: { mev_clear_id: "$.data.id" }
          assert:
            - "the first trigger response status is 409 and data.error_id == ERR_MAINTENANCE_WINDOW_CONFLICT"
            - "the second trigger response status is 201 and MaintenanceEvent.${mev_clear_id}.window_start == 2026-09-14T00:00:00Z with status == PLANNED"
            - "GET /pipeline/maintenance-events?segment_id=${seg_id} returns total_count == 2"
            - "MaintenanceEvent.${mev_first_id}.status == PLANNED (unchanged by either attempt)"
            - "PipelineSegment.${seg_id}.derate_pct == 0 and PipelineSegment.${seg_id}.operational_status == OPERATIONAL (a PLANNED event never derates)"

      - name: terminal_bay_aggregate_overlap_half_open
        grounds:
          - calculations.terminal_bay_occupancy
          - validations[priority=58]
          - errors[ERR_TERMINAL_BAY_CONFLICT]
          - entities.Terminal.fields.injection_bays
          - entities.BatchTicket.fields.injection_window_start
        distinguishing_aspect: |
          The contended resource is an aggregate-capacity one (Terminal.injection_bays == 2) rather
          than an exclusive segment, and the comparison is half-open: a requested window
          [2026-09-01T12:00:00Z, 2026-09-02T12:00:00Z) overlaps two peer PLANNED tickets and is
          refused, while [2026-09-02T00:00:00Z, 2026-09-03T00:00:00Z) overlaps only one peer because
          abutment at 2026-09-02T00:00:00Z is not an overlap, and is accepted with 200.
        test_recipe:
          setup:
            - "Origin terminal HOU has injection_bays 2."
            - "Three brand-new shippers NOVA, ORION and PEGASUS - created in that order and with no shipping history - each nominated 20000 bbl of ULSD on cycle 2026-09."
            - "Effective capacity is 100000 bbl, so after proration each holds its full 20000 bbl and the cycle's proration_factor is 1.000000."
            - "build-schedule produced three PLANNED tickets in created_at order with the half-open windows [2026-09-01T00:00:00Z, 2026-09-02T00:00:00Z), [2026-09-02T00:00:00Z, 2026-09-03T00:00:00Z) and [2026-09-03T00:00:00Z, 2026-09-04T00:00:00Z)."
