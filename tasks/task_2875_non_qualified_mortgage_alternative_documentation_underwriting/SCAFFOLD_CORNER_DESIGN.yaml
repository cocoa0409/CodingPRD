            - "First trigger call: HTTP status == 422 and error_id == ERR_FINDING_STATE_INVALID - RETURN_FOR_MORE_INFO needs a REBUTTED finding and this one is still ISSUED, even though UPHOLD and WAIVE are both legal from ISSUED"
            - "Second trigger call: HTTP status == 200 and status == WAIVED; the parent audit is now defect_score == 0, grade == A_CLEAN, open_finding_count == 0 and status == CLEARED"
            - "Third trigger call: HTTP status == 422 and error_id == ERR_FINDING_STATE_INVALID - WAIVED is terminal, so a rebuttal is refused and rebuttal_round stays 0"
            - "Fourth trigger call: HTTP status == 422 and error_id == ERR_FINDING_STATE_INVALID - the parent audit is CLEARED and closed to new findings; GET /post-close-audits/${audit_id}/findings still returns exactly 1 row"
            - "Fifth trigger call: HTTP status == 422 and error_id == ERR_LOAN_NOT_IN_POOL, NOT ERR_POOL_STATE_INVALID (the pool is OPEN) and NOT ERR_LOAN_FILE_NOT_FOUND (the loan exists and is CLOSED with securitization_eligible == true); the pool still shows member_loan_count == 0 and its version is unchanged at ${pool_version}"

