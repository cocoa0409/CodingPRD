              as: SalesAssociate
              captures: { application_id: $.data.id, application_v: $.data.version }
          trigger:
            - call: "POST /credit-applications/${application_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: CreditAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_REGULATION_TERMS_VIOLATION (priority 6)"
            - "error_id != ERR_CREDIT_LIMIT_EXCEEDED even though the request also breaches priority 20"
            - "error_id != ERR_REGISTRY_ROW_MISSING even though no registry row exists either (priority 19)"
            - "CreditApplication.${application_id}.decision_status is still PENDING and version is still ${application_v}"

      # --- Pair: business_safety vs business_referential ---
      - name: credit_frozen_hazard_outranks_terminated_plan_terms_on_complete
