        grounds:
          - calculations.protocol_version_pinning
          - entities.Review.fields.protocol_version_id
        distinguishing_aspect: "Pinning is window containment on CallRecord.received_at, not 'the newest approved version': a call received 2026-08-05 pins MPDS-13.0 whose window is [2026-07-01, 2026-08-10) while a call received 2026-08-12 pins MPDS-14.0, and putting MPDS-14.0 live afterwards must leave the first review's pin untouched."
