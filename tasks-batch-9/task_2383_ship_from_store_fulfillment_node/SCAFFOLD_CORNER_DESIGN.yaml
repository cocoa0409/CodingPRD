            - "all three cross-node writes return HTTP 403 with error_id ERR_STORE_SCOPE_VIOLATION: ${e_assign}, ${e_inv} and ${e_pkg}"
            - "${e_inv} is the scope error and not ERR_STALE_INVENTORY_VERSION even though expected_inventory_version was read from the row itself: priority 6 runs ahead of priority 7"
