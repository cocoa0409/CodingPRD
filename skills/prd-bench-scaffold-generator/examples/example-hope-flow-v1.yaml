# =============================================================================
# Example: hope-flow benchmark seed tables (v1)
# =============================================================================

scenario: |
  HopeFlow charitable fundraising platform. Manages campaigns with pledges,
  contributions (with 3% processing fee), matching grants from corporate
  sponsors, allocation of funds to prioritized causes, disbursements to
  beneficiaries, and compliance holds that control campaign posture.
  Handles grant revocation with proportional allocation clawback,
  contribution refunds with cascading effects, and cause status auto-transitions.

domain_name: hope-flow
api_prefix: /campaigns

# =============================================================================
# Table 1: Entity Relationship Table
# =============================================================================
entities:
  - name: Campaign
    parent: null
    common_fields: true  # id, created_at, updated_at
    fields:
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: fundraising_target, type: number, source: input, description: "Fundraising target amount" }
      - { name: phase, type: enum, source: system, description: "ACTIVE | CLOSED" }
      - { name: posture, type: enum, source: computed, description: "OPEN | RESTRICTED | FROZEN — derived from active holds" }
      - { name: pledge_outstanding, type: number, source: computed, description: "Sum of amounts from OUTSTANDING pledges" }
      - { name: contribution_total, type: number, source: computed, description: "Sum of net_amount from CLEARED contributions" }
      - { name: match_total, type: number, source: computed, description: "Sum of all active matching funds" }
      - { name: allocated_total, type: number, source: computed, description: "Sum of all allocations across causes" }
      - { name: disbursed_total, type: number, source: computed, description: "Sum of COMPLETED disbursement amounts" }
      - { name: available_balance, type: number, source: computed, description: "contribution_total + match_total - disbursed_total" }

  - name: Pledge
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "Parent Campaign ID" }
      - { name: donor_name, type: string, source: input, description: "Donor name" }
      - { name: donor_email, type: string, source: input, description: "Donor email" }
      - { name: amount, type: number, source: input, description: "Pledged amount" }
      - { name: status, type: enum, source: system, description: "OUTSTANDING | FULFILLED | LAPSED | VOIDED" }
      - { name: fulfilled_contribution_id, type: string, source: system, description: "ID of fulfilling contribution, null until fulfilled" }

  - name: Contribution
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "Parent Campaign ID" }
      - { name: donor_name, type: string, source: input, description: "Donor name" }
      - { name: donor_email, type: string, source: input, description: "Donor email" }
      - { name: gross_amount, type: number, source: input, description: "Gross donation amount" }
      - { name: fee_amount, type: number, source: computed, description: "3% processing fee (rounded down to nearest cent)" }
      - { name: net_amount, type: number, source: computed, description: "gross_amount - fee_amount" }
      - { name: match_eligible, type: boolean, source: input, default: true, description: "Whether eligible for grant matching" }
      - { name: fulfills_pledge_id, type: string, source: input, required: false, description: "Optional pledge ID to fulfill" }
      - { name: matched_amount, type: number, source: computed, description: "Total matching funds received" }
      - { name: allocations, type: array, source: system, description: "Array of {cause_id, amount} objects" }
      - { name: status, type: enum, source: system, description: "CLEARED | REFUNDED" }

  - name: Grant
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "Parent Campaign ID" }
      - { name: sponsor_name, type: string, source: input, description: "Corporate sponsor name" }
      - { name: match_ratio, type: number, source: input, description: "Matching ratio (e.g., 1.0 for dollar-for-dollar)" }
      - { name: cap_amount, type: number, source: input, description: "Maximum matching amount" }
      - { name: min_contribution, type: number, source: input, default: 0, description: "Minimum gross_amount to qualify for matching" }
      - { name: excludes_pledge_fulfillment, type: boolean, source: input, default: false, description: "If true, skip contributions that fulfill pledges" }
      - { name: matched_so_far, type: number, source: computed, description: "Total matched amount from this grant" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | REVOKED | EXHAUSTED" }

  - name: Cause
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "Parent Campaign ID" }
      - { name: name, type: string, source: input, description: "Cause name" }
      - { name: target_amount, type: number, source: input, description: "Funding target" }
      - { name: priority, type: integer, source: input, description: "Priority (lower number = higher priority); unique within campaign" }
      - { name: threshold_percent, type: number, source: input, default: 100, description: "Percentage of target that must be reached before disbursements allowed" }
      - { name: allocated_amount, type: number, source: computed, description: "Total allocated to this cause" }
      - { name: disbursed_amount, type: number, source: computed, description: "Total disbursed from this cause" }
      - { name: status, type: enum, source: computed, description: "OPEN | THRESHOLD_MET | FUNDED | CLOSED — auto-transitions based on allocated_amount" }

  - name: Disbursement
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "Parent Campaign ID" }
      - { name: cause_id, type: string, source: input, description: "Associated Cause ID" }
      - { name: beneficiary_name, type: string, source: input, description: "Beneficiary name" }
      - { name: amount, type: number, source: input, description: "Disbursement amount" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | COMPLETED | VOIDED" }

  - name: Hold
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "Parent Campaign ID" }
      - { name: reason, type: string, source: input, description: "Reason for the hold" }
      - { name: severity, type: enum, source: input, description: "STANDARD | CRITICAL" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RESOLVED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Campaign
    field: phase
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: POST /campaigns/:campaign_id/close
        actor: Any
        preconditions:
          - "All pledges must be in terminal status: FULFILLED, LAPSED, or VOIDED (ERR_PLEDGES_OUTSTANDING)"
          - "Campaign posture must be OPEN"
        side_effects:
          - "No new pledges, contributions, or grants"
          - "Allocations, disbursements, causes, holds still allowed"

  - entity: Campaign
    field: posture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: "*"
        to: FROZEN
        trigger: "system (automatic when any CRITICAL hold becomes ACTIVE)"
        actor: system
        preconditions:
          - "At least one ACTIVE hold with severity CRITICAL"
        side_effects:
          - "Only hold resolution and read operations allowed"

      - from: "*"
        to: RESTRICTED
        trigger: "system (automatic when highest severity active hold is STANDARD)"
        actor: system
        preconditions:
          - "At least one ACTIVE hold with severity STANDARD, no ACTIVE CRITICAL holds"
        side_effects:
          - "Contributions and disbursements blocked"
          - "Pledges and admin actions allowed"

      - from: "*"
        to: OPEN
        trigger: "system (automatic when no ACTIVE holds remain)"
        actor: system
        preconditions:
          - "No ACTIVE holds"
        side_effects:
          - "Normal operations resume"

  - entity: Pledge
    initial_state: OUTSTANDING
    terminal_states: [FULFILLED, LAPSED, VOIDED]
    transitions:
      - from: OUTSTANDING
        to: FULFILLED
        trigger: "system (automatic when contribution with fulfills_pledge_id is created)"
        actor: system
        preconditions:
          - "Pledge must be OUTSTANDING"
          - "Contribution gross_amount must equal pledge amount (ERR_PLEDGE_MISMATCH)"
        side_effects:
          - "fulfilled_contribution_id set to contribution ID"
          - "pledge_outstanding reduced by pledge amount"

      - from: OUTSTANDING
        to: LAPSED
        trigger: POST /campaigns/:campaign_id/pledges/:pledge_id/lapse
        actor: Any
        preconditions:
          - "Pledge must be OUTSTANDING (ERR_INVALID_STATE)"
        side_effects:
          - "pledge_outstanding reduced by pledge amount"

      - from: OUTSTANDING
        to: VOIDED
        trigger: POST /campaigns/:campaign_id/pledges/:pledge_id/void
        actor: Any
        preconditions:
          - "Pledge must be OUTSTANDING (ERR_INVALID_STATE)"
        side_effects:
          - "pledge_outstanding reduced by pledge amount"

      - from: FULFILLED
        to: OUTSTANDING
        trigger: "system (automatic when fulfilling contribution is refunded)"
        actor: system
        preconditions: []
        side_effects:
          - "fulfilled_contribution_id set to null"
          - "pledge_outstanding increased by pledge amount"

  - entity: Contribution
    initial_state: CLEARED
    terminal_states: [REFUNDED]
    transitions:
      - from: CLEARED
        to: REFUNDED
        trigger: POST /campaigns/:campaign_id/contributions/:contribution_id/refund
        actor: Any
        preconditions:
          - "Contribution must be CLEARED (ERR_INVALID_STATE)"
        side_effects:
          - "contribution_total reduced by net_amount"
          - "match_total reduced by matched_amount (clawback)"
          - "All allocations reversed from their causes"
          - "allocated_total reduced"
          - "If fulfilled a pledge, pledge reverts to OUTSTANDING"

  - entity: Grant
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /campaigns/:campaign_id/grants/:grant_id/suspend
        actor: Any
        preconditions:
          - "Grant must be ACTIVE or SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "Stops matching new contributions; existing matches preserved"

      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /campaigns/:campaign_id/grants/:grant_id/reactivate
        actor: Any
        preconditions:
          - "Grant must be ACTIVE or SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "Returns to ACTIVE (or EXHAUSTED if already at cap)"

      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (automatic when matched_so_far reaches cap_amount)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: REVOKED
        trigger: POST /campaigns/:campaign_id/grants/:grant_id/revoke
        actor: Any
        preconditions:
          - "Grant must be ACTIVE, SUSPENDED, or EXHAUSTED (ERR_INVALID_STATE)"
        side_effects:
          - "All previous matches clawed back"
          - "Each contribution's matched_amount reduced"
          - "match_total reduced"
          - "Allocations proportionally reversed"
          - "Cannot be reactivated"

      - from: SUSPENDED
        to: REVOKED
        trigger: POST /campaigns/:campaign_id/grants/:grant_id/revoke
        actor: Any
        preconditions:
          - "Same as ACTIVE → REVOKED"
        side_effects:
          - "Same as ACTIVE → REVOKED"

      - from: EXHAUSTED
        to: REVOKED
        trigger: POST /campaigns/:campaign_id/grants/:grant_id/revoke
        actor: Any
        preconditions: []
        side_effects:
          - "Same as ACTIVE → REVOKED"

  - entity: Cause
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: THRESHOLD_MET
        trigger: "system (automatic when allocated_amount >= threshold_percent * target_amount / 100)"
        actor: system
        preconditions: []
        side_effects:
          - "Disbursements now allowed"

      - from: THRESHOLD_MET
        to: FUNDED
        trigger: "system (automatic when allocated_amount >= target_amount)"
        actor: system
        preconditions: []
        side_effects:
          - "No more allocations accepted"

      - from: FUNDED
        to: THRESHOLD_MET
        trigger: "system (automatic when allocations reversed and amount drops below target but stays above threshold)"
        actor: system
        preconditions: []
        side_effects: []

      - from: THRESHOLD_MET
        to: OPEN
        trigger: "system (automatic when allocations reversed and amount drops below threshold)"
        actor: system
        preconditions: []
        side_effects: []

      - from: FUNDED
        to: OPEN
        trigger: "system (automatic when allocations reversed and amount drops below threshold)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OPEN
        to: CLOSED
        trigger: POST /campaigns/:campaign_id/causes/:cause_id/close
        actor: Any
        preconditions: []
        side_effects:
          - "No more allocations; disbursements still allowed"

      - from: THRESHOLD_MET
        to: CLOSED
        trigger: POST /campaigns/:campaign_id/causes/:cause_id/close
        actor: Any
        preconditions: []
        side_effects:
          - "Same as OPEN → CLOSED"

      - from: FUNDED
        to: CLOSED
        trigger: POST /campaigns/:campaign_id/causes/:cause_id/close
        actor: Any
        preconditions: []
        side_effects:
          - "Same as OPEN → CLOSED"

  - entity: Disbursement
    initial_state: PENDING
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: POST /campaigns/:campaign_id/disbursements/:disbursement_id/approve
        actor: Any
        preconditions:
          - "Disbursement must be PENDING (ERR_INVALID_STATE)"
        side_effects: []

      - from: APPROVED
        to: COMPLETED
        trigger: POST /campaigns/:campaign_id/disbursements/:disbursement_id/complete
        actor: Any
        preconditions:
          - "Disbursement must be APPROVED (ERR_INVALID_STATE)"
          - "Campaign posture must be OPEN"
        side_effects:
          - "cause.disbursed_amount += amount"
          - "campaign.disbursed_total += amount"
          - "available_balance decreases"

      - from: PENDING
        to: VOIDED
        trigger: POST /campaigns/:campaign_id/disbursements/:disbursement_id/void
        actor: Any
        preconditions:
          - "Disbursement must be PENDING or APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "Reserved amount released"

      - from: APPROVED
        to: VOIDED
        trigger: POST /campaigns/:campaign_id/disbursements/:disbursement_id/void
        actor: Any
        preconditions:
          - "Same as PENDING → VOIDED"
        side_effects:
          - "Same as PENDING → VOIDED"

  - entity: Hold
    initial_state: ACTIVE
    terminal_states: [RESOLVED]
    transitions:
      - from: ACTIVE
        to: RESOLVED
        trigger: POST /campaigns/:campaign_id/holds/:hold_id/resolve
        actor: Any
        preconditions:
          - "Hold must be ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Campaign posture recalculated"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: processing_fee
    trigger: "contribution creation"
    algorithm: simple
    formula: |
      fee_amount = floor(gross_amount * 0.03 * 100) / 100  # 3%, rounded down to nearest cent
      net_amount = gross_amount - fee_amount

  - name: grant_matching
    trigger: "contribution creation"
    algorithm: sequential
    formula: |
      For each ACTIVE grant in creation order (earliest first):
        1. Skip if min_contribution > contribution.gross_amount
        2. Skip if excludes_pledge_fulfillment and contribution fulfills a pledge
        3. potential_match = gross_amount * match_ratio
        4. remaining_capacity = cap_amount - matched_so_far
        5. actual_match = min(potential_match, remaining_capacity)
        6. contribution.matched_amount += actual_match
        7. grant.matched_so_far += actual_match
        8. campaign.match_total += actual_match
        9. If grant.matched_so_far >= cap_amount: grant → EXHAUSTED
    note: "Only match-eligible contributions receive matching"

  - name: grant_revocation_clawback
    trigger: "grant revocation"
    algorithm: proportional
    formula: |
      For each contribution that received matching from this grant:
        1. Reduce contribution.matched_amount by the grant's match amount
        2. Reduce campaign.match_total accordingly
        3. Proportionally reverse allocations:
           If contribution had net + matched = total, and match removed is X,
           each allocation is reduced by (X / total) * allocation_amount
        4. Causes' allocated_amounts decrease; cause status may revert

  - name: contribution_refund
    trigger: "contribution refund"
    algorithm: cascading
    formula: |
      1. Subtract net_amount from contribution_total
      2. Subtract matched_amount from match_total (clawback all matching)
      3. Reverse all allocations from this contribution
      4. Each cause's allocated_amount decreases; status may revert
      5. If contribution fulfilled a pledge, pledge reverts to OUTSTANDING

  - name: allocation
    trigger: "POST /contributions/:id/allocate"
    algorithm: simple
    formula: |
      Constraints:
        - contribution must be CLEARED
        - cause must be OPEN or THRESHOLD_MET
        - amount <= unallocated balance (net_amount + matched_amount - sum(allocations))
        - amount <= cause.target_amount - cause.allocated_amount
      On success:
        - cause.allocated_amount += amount
        - campaign.allocated_total += amount
        - Cause status auto-transitions if thresholds crossed

  - name: disbursement_eligibility
    trigger: "disbursement creation"
    algorithm: constraint
    formula: |
      1. Campaign posture must be OPEN
      2. Cause status must be THRESHOLD_MET, FUNDED, or CLOSED
      3. amount <= disbursable (allocated_amount - disbursed_amount - pending/approved disbursements)
      4. amount <= available_balance

  - name: campaign_posture
    trigger: "hold creation or resolution"
    algorithm: derived
    formula: |
      If any ACTIVE hold has severity CRITICAL: posture = FROZEN
      Else if any ACTIVE hold has severity STANDARD: posture = RESTRICTED
      Else: posture = OPEN

  - name: available_balance
    trigger: "any financial change"
    algorithm: derived
    formula: |
      available_balance = contribution_total + match_total - disbursed_total

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: request
    check: "Request must be well-formed with all required fields"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: existence
    check: "Campaign and resource must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 3
    category: phase
    check: "Campaign must be ACTIVE for pledge/contribution/grant creation"
    error_id: ERR_CAMPAIGN_CLOSED
    http_status: 409
    applies_to: "POST pledges, contributions, grants"

  - priority: 4
    category: posture
    check: "Campaign posture must not be FROZEN"
    error_id: ERR_POSTURE_FROZEN
    http_status: 409
    applies_to: "most write operations"

  - priority: 5
    category: posture
    check: "Campaign posture must not be RESTRICTED (for contributions and disbursements)"
    error_id: ERR_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "contributions creation, disbursement creation/completion"

  - priority: 6
    category: state
    check: "Resource must be in correct state for the operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state transition endpoints

  - priority: 7
    category: business
    check: "Contribution gross_amount must match pledge amount for fulfillment"
    error_id: ERR_PLEDGE_MISMATCH
    http_status: 409
    applies_to: "POST contributions with fulfills_pledge_id"

  - priority: 8
    category: financial
    check: "Sufficient available_balance for disbursements"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 402
    applies_to: "POST disbursements"

  - priority: 9
    category: allocation
    check: "Allocation must not exceed contribution's unallocated balance"
    error_id: ERR_ALLOCATION_EXCEEDED
    http_status: 409
    applies_to: "POST /contributions/:id/allocate"

  - priority: 10
    category: allocation
    check: "Allocation must not exceed cause's remaining capacity"
    error_id: ERR_CAUSE_FULL
    http_status: 409
    applies_to: "POST /contributions/:id/allocate"

  - priority: 11
    category: business
    check: "Disbursement blocked by pending disbursements needing void"
    error_id: ERR_DISBURSEMENT_BLOCKED
    http_status: 409
    applies_to: "refund/revocation when pending disbursements would be underfunded"

  - priority: 12
    category: business
    check: "Cannot close campaign with outstanding pledges"
    error_id: ERR_PLEDGES_OUTSTANDING
    http_status: 409
    applies_to: "POST /campaigns/:id/close"

  - priority: 13
    category: business
    check: "Cause priority must be unique within campaign"
    error_id: ERR_PRIORITY_CONFLICT
    http_status: 409
    applies_to: "POST /causes"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (28 endpoints)
# =============================================================================
endpoints:
  # --- Campaign ---
  - method: POST
    path: "/campaigns"
    description: "Create a new Campaign"
    roles: [Any]
    code: 201
    input: [name, fundraising_target]
    output: Campaign
    side_effects: ["phase=ACTIVE, posture=OPEN, all computed fields initialized to 0"]

  - method: GET
    path: "/campaigns/:campaign_id"
    description: "Get a specific Campaign"
    roles: [Any]
    code: 200
    input: []
    output: Campaign
    side_effects: []

  - method: POST
    path: "/campaigns/:campaign_id/close"
    description: "Close a campaign"
    roles: [Any]
    code: 200
    input: []
    output: Campaign
    side_effects:
      - "phase → CLOSED"
      - "No new pledges, contributions, or grants"

  # --- Pledge ---
  - method: POST
    path: "/campaigns/:campaign_id/pledges"
    description: "Create a new Pledge"
    roles: [Any]
    code: 201
    input: [donor_name, donor_email, amount]
    output: Pledge
    side_effects: ["status=OUTSTANDING, pledge_outstanding increased"]

  - method: GET
    path: "/campaigns/:campaign_id/pledges/:pledge_id"
    description: "Get a specific Pledge"
    roles: [Any]
    code: 200
    input: []
    output: Pledge
    side_effects: []

  - method: POST
    path: "/campaigns/:campaign_id/pledges/:pledge_id/fulfill"
    description: "Fulfill a pledge (links to contribution)"
    roles: [Any]
    code: 200
    input: []
    output: Pledge
    side_effects:
      - "status → FULFILLED (triggered by contribution creation)"
      - "pledge_outstanding reduced"

  - method: POST
    path: "/campaigns/:campaign_id/pledges/:pledge_id/lapse"
    description: "Lapse a pledge"
    roles: [Any]
    code: 200
    input: []
    output: Pledge
    side_effects: ["status → LAPSED, pledge_outstanding reduced"]

  - method: POST
    path: "/campaigns/:campaign_id/pledges/:pledge_id/void"
    description: "Void a pledge"
    roles: [Any]
    code: 200
    input: []
    output: Pledge
    side_effects: ["status → VOIDED, pledge_outstanding reduced"]

  # --- Contribution ---
  - method: POST
    path: "/campaigns/:campaign_id/contributions"
    description: "Create a new Contribution"
    roles: [Any]
    code: 201
    input: [donor_name, donor_email, gross_amount, "fulfills_pledge_id?", "match_eligible?"]
    output: Contribution
    side_effects:
      - "fee_amount and net_amount calculated"
      - "contribution_total increased by net_amount"
      - "If fulfills_pledge_id: pledge → FULFILLED (amount must match)"
      - "If match_eligible: active grants apply matching"

  - method: GET
    path: "/campaigns/:campaign_id/contributions/:contribution_id"
    description: "Get a specific Contribution"
    roles: [Any]
    code: 200
    input: []
    output: Contribution
    side_effects: []

  - method: POST
    path: "/campaigns/:campaign_id/contributions/:contribution_id/refund"
    description: "Refund a contribution"
    roles: [Any]
    code: 200
    input: []
    output: Contribution
    side_effects:
      - "status → REFUNDED"
      - "contribution_total -= net_amount"
      - "match_total -= matched_amount (clawback)"
      - "All allocations reversed"
      - "If fulfilled a pledge, pledge → OUTSTANDING"

  - method: POST
    path: "/campaigns/:campaign_id/contributions/:contribution_id/allocate"
    description: "Allocate funds from a contribution to a cause"
    roles: [Any]
    code: 200
    input: [cause_id, amount]
    output: Contribution
    side_effects:
      - "Allocation added to contribution's allocations array"
      - "cause.allocated_amount increased"
      - "campaign.allocated_total increased"
      - "Cause status auto-transitions if thresholds crossed"

  # --- Grant ---
  - method: POST
    path: "/campaigns/:campaign_id/grants"
    description: "Create a new Grant"
    roles: [Any]
    code: 201
    input: [sponsor_name, match_ratio, cap_amount, "min_contribution?", "excludes_pledge_fulfillment?"]
    output: Grant
    side_effects: ["status=ACTIVE, matched_so_far=0"]

  - method: GET
    path: "/campaigns/:campaign_id/grants/:grant_id"
    description: "Get a specific Grant"
    roles: [Any]
    code: 200
    input: []
    output: Grant
    side_effects: []

  - method: POST
    path: "/campaigns/:campaign_id/grants/:grant_id/suspend"
    description: "Suspend a grant"
    roles: [Any]
    code: 200
    input: []
    output: Grant
    side_effects: ["status → SUSPENDED, stops matching new contributions"]

  - method: POST
    path: "/campaigns/:campaign_id/grants/:grant_id/reactivate"
    description: "Reactivate a suspended grant"
    roles: [Any]
    code: 200
    input: []
    output: Grant
    side_effects: ["status → ACTIVE (or EXHAUSTED if at cap)"]

  - method: POST
    path: "/campaigns/:campaign_id/grants/:grant_id/revoke"
    description: "Revoke a grant (claws back all matches)"
    roles: [Any]
    code: 200
    input: []
    output: Grant
    side_effects:
      - "status → REVOKED"
      - "All previous matches clawed back from contributions"
      - "match_total reduced"
      - "Allocations proportionally reversed"
      - "Cannot be reactivated"

  # --- Cause ---
  - method: POST
    path: "/campaigns/:campaign_id/causes"
    description: "Create a new Cause"
    roles: [Any]
    code: 201
    input: [name, target_amount, priority, "threshold_percent?"]
    output: Cause
    side_effects: ["status=OPEN, priority must be unique (ERR_PRIORITY_CONFLICT)"]

  - method: GET
    path: "/campaigns/:campaign_id/causes/:cause_id"
    description: "Get a specific Cause"
    roles: [Any]
    code: 200
    input: []
    output: Cause
    side_effects: []

  - method: POST
    path: "/campaigns/:campaign_id/causes/:cause_id/close"
    description: "Close a cause"
    roles: [Any]
    code: 200
    input: []
    output: Cause
    side_effects: ["status → CLOSED, no more allocations, disbursements still allowed"]

  # --- Disbursement ---
  - method: POST
    path: "/campaigns/:campaign_id/disbursements"
    description: "Create a new Disbursement"
    roles: [Any]
    code: 201
    input: [cause_id, beneficiary_name, amount]
    output: Disbursement
    side_effects:
      - "status=PENDING"
      - "Amount reserved from cause's disbursable"
      - "Posture must be OPEN, cause must allow disbursements"

  - method: GET
    path: "/campaigns/:campaign_id/disbursements/:disbursement_id"
    description: "Get a specific Disbursement"
    roles: [Any]
    code: 200
    input: []
    output: Disbursement
    side_effects: []

  - method: POST
    path: "/campaigns/:campaign_id/disbursements/:disbursement_id/approve"
    description: "Approve a disbursement"
    roles: [Any]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["status → APPROVED"]

  - method: POST
    path: "/campaigns/:campaign_id/disbursements/:disbursement_id/complete"
    description: "Complete a disbursement"
    roles: [Any]
    code: 200
    input: []
    output: Disbursement
    side_effects:
      - "status → COMPLETED"
      - "cause.disbursed_amount += amount"
      - "campaign.disbursed_total += amount"
      - "Campaign posture must be OPEN"

  - method: POST
    path: "/campaigns/:campaign_id/disbursements/:disbursement_id/void"
    description: "Void a disbursement"
    roles: [Any]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["status → VOIDED, reserved amount released"]

  # --- Hold ---
  - method: POST
    path: "/campaigns/:campaign_id/holds"
    description: "Create a new Hold"
    roles: [Any]
    code: 201
    input: [reason, severity]
    output: Hold
    side_effects: ["status=ACTIVE, campaign posture recalculated"]

  - method: GET
    path: "/campaigns/:campaign_id/holds/:hold_id"
    description: "Get a specific Hold"
    roles: [Any]
    code: 200
    input: []
    output: Hold
    side_effects: []

  - method: POST
    path: "/campaigns/:campaign_id/holds/:hold_id/resolve"
    description: "Resolve a hold"
    roles: [Any]
    code: 200
    input: []
    output: Hold
    side_effects: ["status → RESOLVED, campaign posture recalculated"]

# =============================================================================
# Table 6: Error Code Catalogue (13 error codes)
# =============================================================================
errors:
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed request, missing required fields, invalid field values"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Campaign or resource does not exist"

  - id: ERR_CAMPAIGN_CLOSED
    http: 409
    condition: "Campaign is closed and operation requires active campaign"

  - id: ERR_POSTURE_FROZEN
    http: 409
    condition: "Campaign posture is FROZEN"

  - id: ERR_POSTURE_RESTRICTED
    http: 409
    condition: "Campaign posture is RESTRICTED (blocks contributions and disbursements)"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is in wrong state for the operation"

  - id: ERR_PLEDGE_MISMATCH
    http: 409
    condition: "Contribution gross_amount does not match pledge amount"

  - id: ERR_INSUFFICIENT_FUNDS
    http: 402
    condition: "Not enough available_balance for the operation"

  - id: ERR_ALLOCATION_EXCEEDED
    http: 409
    condition: "Allocation would exceed contribution's unallocated balance"

  - id: ERR_CAUSE_FULL
    http: 409
    condition: "Cause has reached its target_amount"

  - id: ERR_DISBURSEMENT_BLOCKED
    http: 409
    condition: "Disbursement blocked; pending disbursements need to be voided first"

  - id: ERR_PLEDGES_OUTSTANDING
    http: 409
    condition: "Cannot close campaign with outstanding pledges"

  - id: ERR_PRIORITY_CONFLICT
    http: 409
    condition: "Cause priority already used within this campaign"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: Any
    description: "HopeFlow has no role restrictions; all operations are available to any caller"
    shared_operations:
      - "All 29 endpoints are accessible to any caller"
