            - "LEAVE: total_count == 1 and ${seen_leave} == ${lr135}; the row reports decision_order_index == null"
            - "TRADES: HTTP 200 with response_type == \"array\", data == [] and total_count == 0 — an empty collection is not a 404"
            - "VACANCY DETAIL: HTTP 200 with status \"OFFERING\", driver \"VACANT_POSITION\", required_certification \"NONE\", filled_by_assignment_id == null and duty_shift_id == ${sh135}"
            - "The seat ${asg135} filled the sibling vacancy, so GET /fire-ops/vacancies?duty_shift_id=${sh135}&status=FILLED returns total_count == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: duty_shift_initial_state_is_draft
        claim_type: Initial State
        grounds:
          - state_machines.DutyShift.initial_state
          - endpoints["POST /fire-ops/duty-shifts"]
        distinguishing_aspect: "A newly created shift is in DRAFT with ops_run_index 0 and no vacancies, so no seat may be created against it until it is published."
        test_recipe:
          setup:
            - "Station 71 with one company ENGINE-71 (crew 2, no required certifications)."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 71", battalion_code: "D4", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st71: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st71}", unit_designation: "ENGINE-71", apparatus_type: "ENGINE", minimum_crew_size: 2, required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng71: "$.data.id" }
          trigger:
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st71}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh71: "$.data.id" }
          assert:
            - "HTTP 201 and DutyShift.${sh71}.status == \"DRAFT\""
            - "DutyShift.${sh71}.ops_run_index == 0, open_vacancy_count == 0, closed_apparatus_ids == [], version == 1"
            - "GET /fire-ops/vacancies?duty_shift_id=${sh71} returns total_count == 0"

      - name: publish_moves_draft_shift_to_hiring_and_mints_one_vacancy_per_seat
        claim_type: Valid Transition
        grounds:
          - state_machines.DutyShift.DRAFT_to_HIRING
          - calculations.vacancy_generation
          - endpoints["POST /fire-ops/duty-shifts/{duty_shift_id}/publish"]
        distinguishing_aspect: "Publishing a shift whose companies need 3 seats creates exactly 3 OPEN vacancies with seat_index 1..2 on the engine and 1 on the medic, sets open_vacancy_count 3 and leaves the shift HIRING."
        test_recipe:
          setup:
            - "Station 72 with floor 1 and two companies: ENGINE-72 (crew 2, no required certifications, closure_priority 10) and MEDIC-72 (crew 1, requires PARAMEDIC, closure_priority 20)."
            - "A DRAFT shift on 2026-08-11 (platoon C)."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 72", battalion_code: "D5", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st72: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st72}", unit_designation: "ENGINE-72", apparatus_type: "ENGINE", minimum_crew_size: 2, required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng72: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st72}", unit_designation: "MEDIC-72", apparatus_type: "MEDIC", minimum_crew_size: 1, required_certifications: ["PARAMEDIC"], closure_priority: 20 }
              as: StaffingOfficer
              captures: { med72: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st72}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh72: "$.data.id" }
          trigger:
            - call: "POST /fire-ops/duty-shifts/${sh72}/publish"
              payload: {}
              as: StaffingOfficer
          assert:
            - "HTTP 200 and DutyShift.${sh72}.status == \"HIRING\""
            - "DutyShift.${sh72}.required_staffing == 3, open_vacancy_count == 3, staffing_gap == 3, certification_gap_count == 1, staffing_posture == \"CRITICAL\""
            - "GET /fire-ops/vacancies?duty_shift_id=${sh72} returns total_count == 3, all with status \"OPEN\" and driver \"VACANT_POSITION\""
            - "Exactly one of those vacancies has required_certification \"PARAMEDIC\" and apparatus_id ${med72}; the other two have required_certification \"NONE\" and apparatus_id ${eng72}"
            - "DutyShift.${sh72}.version == 2"

      - name: publish_of_shift_with_no_open_companies_goes_straight_to_staffed
        claim_type: Valid Transition
        grounds:
          - state_machines.DutyShift.DRAFT_to_STAFFED
          - calculations.staffing_posture
          - endpoints["POST /fire-ops/duty-shifts/{duty_shift_id}/publish"]
        distinguishing_aspect: "With no IN_SERVICE company at the station required_staffing is 0, so publish takes the branch that lands directly in STAFFED with zero vacancies rather than in HIRING."
        test_recipe:
          setup:
            - "Station 73 with minimum_staffing_floor 0 and exactly one company created OUT_OF_SERVICE, so no company is open."
            - "A DRAFT shift on 2026-08-11 (platoon C)."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 73", battalion_code: "D5", minimum_staffing_floor: 0, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st73: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st73}", unit_designation: "ENGINE-73", apparatus_type: "ENGINE", minimum_crew_size: 2, required_certifications: [], closure_priority: 10, status: "OUT_OF_SERVICE" }
              as: StaffingOfficer
              captures: { eng73: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st73}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh73: "$.data.id" }
          trigger:
            - call: "POST /fire-ops/duty-shifts/${sh73}/publish"
              payload: {}
              as: StaffingOfficer
          assert:
            - "DutyShift.${sh73}.status == \"STAFFED\", not \"HIRING\""
            - "DutyShift.${sh73}.required_staffing == 0, staffing_gap == 0, certification_gap_count == 0, open_vacancy_count == 0, leave_floor_headcount == 0, staffing_posture == \"FULLY_STAFFED\""
            - "GET /fire-ops/vacancies?duty_shift_id=${sh73} returns total_count == 0"

      - name: republish_of_already_published_shift_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.DutyShift.DRAFT_to_HIRING.preconditions
          - errors[ERR_SHIFT_NOT_DRAFT]
          - endpoints["POST /fire-ops/duty-shifts/{duty_shift_id}/publish"]
        distinguishing_aspect: "The second publish on the same shift returns ERR_SHIFT_NOT_DRAFT (409) and does not mint a second set of vacancies."
        test_recipe:
          setup:
            - "Station 74 with one company ENGINE-74 (crew 1, no required certifications) and a shift on 2026-08-11 already published, so it is HIRING with one OPEN vacancy."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 74", battalion_code: "D5", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st74: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st74}", unit_designation: "ENGINE-74", apparatus_type: "ENGINE", minimum_crew_size: 1, required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng74: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st74}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh74: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh74}/publish"
              payload: {}
              as: StaffingOfficer
              captures: { sh74_v: "$.data.version" }
          trigger:
            - call: "POST /fire-ops/duty-shifts/${sh74}/publish"
              payload: {}
              as: StaffingOfficer
              captures: { err74: "$.data.error_id" }
          assert:
            - "HTTP 409 and error_id == \"ERR_SHIFT_NOT_DRAFT\""
            - "DutyShift.${sh74}.status == \"HIRING\", open_vacancy_count == 1 and version == ${sh74_v}"
            - "GET /fire-ops/vacancies?duty_shift_id=${sh74} still returns total_count == 1"

      - name: complete_before_shift_date_elapsed_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DutyShift.STAFFED_to_COMPLETED.preconditions
          - errors[ERR_SHIFT_NOT_ELAPSED]
          - endpoints["POST /fire-ops/duty-shifts/{duty_shift_id}/complete"]
        distinguishing_aspect: "With the clock at 2026-08-01 a shift dated 2026-08-11 cannot be closed out: ERR_SHIFT_NOT_ELAPSED (409) is returned and no assignment moves to WORKED."
        test_recipe:
          setup:
            - "Station 75 with one company ENGINE-75 (crew 1, no required certifications) and one member seated REGULAR on the published 2026-08-11 shift, so it is STAFFED."
            - "Logical clock at its default 2026-08-01T00:00:00Z — ten days before the shift."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 75", battalion_code: "D6", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st75: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st75}", unit_designation: "ENGINE-75", apparatus_type: "ENGINE", minimum_crew_size: 1, required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng75: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st75}", full_name: "V Vogel", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 1, kelly_day_cycle_position: 1, certifications: [], hourly_rate_cents: 4000 }
              as: StaffingOfficer
              captures: { ff75: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st75}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh75: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh75}/publish"
              payload: {}
              as: StaffingOfficer
              captures: { sh75_v: "$.data.version" }
            - call: "POST /fire-ops/shift-assignments"
              payload: { duty_shift_id: "${sh75}", firefighter_id: "${ff75}", apparatus_id: "${eng75}", assignment_type: "REGULAR", seat_certification: "NONE", scheduled_hours: 24, expected_duty_shift_version: "${sh75_v}" }
              as: CompanyOfficer
              as_user_id: "${ff75}"
              captures: { asg75: "$.data.id" }
          trigger:
            - call: "POST /fire-ops/duty-shifts/${sh75}/complete"
              payload: {}
              as: PayrollAnalyst
              captures: { err75: "$.data.error_id" }
          assert:
            - "HTTP 409 and error_id == \"ERR_SHIFT_NOT_ELAPSED\""
            - "DutyShift.${sh75}.status == \"STAFFED\""
            - "ShiftAssignment.${asg75}.status == \"SCHEDULED\" and actual_hours == null"
            - "Station.${st75}.ot_actual_cents == 0"

      - name: completed_shift_locks_seat_cancellation_and_further_ops_runs
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.DutyShift.terminal_states
          - errors[ERR_ASSIGNMENT_NOT_SCHEDULED]
          - errors[ERR_SHIFT_NOT_HIRING]
          - endpoints["POST /fire-ops/shift-assignments/{shift_assignment_id}/cancel"]
          - endpoints["POST /fire-ops/duty-shifts/{duty_shift_id}/staffing-run"]
        distinguishing_aspect: "Once the shift reaches the terminal COMPLETED state its seats are WORKED and immutable: cancelling one returns ERR_ASSIGNMENT_NOT_SCHEDULED and a further ops-run returns ERR_SHIFT_NOT_HIRING."
        test_recipe:
          setup:
            - "Station 76 with one company ENGINE-76 (crew 1, no required certifications) and member ff76 seated REGULAR for 24 hours on the published 2026-08-11 shift, so it is STAFFED."
            - "The clock is moved to 2026-08-12T00:00:00Z and the shift is completed by payroll, so it is COMPLETED and the seat is WORKED with actual_hours 24."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 76", battalion_code: "D6", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st76: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st76}", unit_designation: "ENGINE-76", apparatus_type: "ENGINE", minimum_crew_size: 1, required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng76: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st76}", full_name: "W Weiss", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 1, kelly_day_cycle_position: 1, certifications: [], hourly_rate_cents: 4000 }
              as: StaffingOfficer
              captures: { ff76: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st76}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh76: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh76}/publish"
              payload: {}
              as: StaffingOfficer
              captures: { sh76_v: "$.data.version" }
            - call: "POST /fire-ops/shift-assignments"
              payload: { duty_shift_id: "${sh76}", firefighter_id: "${ff76}", apparatus_id: "${eng76}", assignment_type: "REGULAR", seat_certification: "NONE", scheduled_hours: 24, expected_duty_shift_version: "${sh76_v}" }
              as: CompanyOfficer
              as_user_id: "${ff76}"
              captures: { asg76: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-12T00:00:00Z" }
              as: PayrollAnalyst
            - call: "POST /fire-ops/duty-shifts/${sh76}/complete"
              payload: {}
              as: PayrollAnalyst
          trigger:
            - call: "POST /fire-ops/shift-assignments/${asg76}/cancel"
              payload: { reason: "attempt to unwind a closed-out tour" }
              as: CompanyOfficer
              as_user_id: "${ff76}"
              captures: { err76a: "$.data.error_id" }
            - call: "POST /fire-ops/duty-shifts/${sh76}/staffing-run"
              payload: {}
              as: StaffingOfficer
              captures: { err76b: "$.data.error_id" }
          assert:
            - "CANCEL: HTTP 409 and error_id == \"ERR_ASSIGNMENT_NOT_SCHEDULED\" — the seat's own state is checked before the shift's"
            - "OPS RUN: HTTP 409 and error_id == \"ERR_SHIFT_NOT_HIRING\""
            - "DutyShift.${sh76}.status == \"COMPLETED\" and ops_run_index == 0"
            - "ShiftAssignment.${asg76}.status == \"WORKED\" and actual_hours == 24"
            - "Station.${st76}.ot_actual_cents == 0 — a REGULAR seat carries no overtime premium"

      - name: second_response_to_an_answered_offer_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.OvertimeOffer.OFFERED_to_ACCEPTED.preconditions
          - errors[ERR_OFFER_NOT_PENDING]
          - endpoints["POST /fire-ops/overtime-offers/{overtime_offer_id}/response"]
        distinguishing_aspect: "After ACCEPT the offer is terminal, so a second response returns ERR_OFFER_NOT_PENDING (409) and neither a duplicate seat nor a second encumbrance appears."
        test_recipe:
          setup:
            - "Station 77 with floor 1, a 900,000-cent budget, one company ENGINE-77 (crew 1, no required certifications) and a VOLUNTARY_OT roster scoped NONE."
            - "Member ff77 (platoon C, Kelly 1, rate 4000) accepted a 24-hour VOLUNTARY offer on the published 2026-08-11 shift, priced at 144000 cents, so the vacancy is FILLED and the shift is STAFFED."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 77", battalion_code: "D7", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 900000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st77: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st77}", unit_designation: "ENGINE-77", apparatus_type: "ENGINE", minimum_crew_size: 1, required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng77: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st77}", full_name: "X Xiong", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 1, kelly_day_cycle_position: 1, certifications: [], hourly_rate_cents: 4000 }
              as: StaffingOfficer
              captures: { ff77: "$.data.id" }
            - call: "POST /fire-ops/hiring-rosters"
              payload: { station_id: "${st77}", roster_type: "VOLUNTARY_OT", certification_scope: "NONE" }
              as: StaffingOfficer
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st77}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh77: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh77}/publish"
              payload: {}
              as: StaffingOfficer
            - call: "GET /fire-ops/vacancies"
              payload: { duty_shift_id: "${sh77}", status: "OPEN" }
              as: StaffingOfficer
              captures: { vac77: "$.data[0].id" }
            - call: "POST /fire-ops/vacancies/${vac77}/offer"
              payload: { hiring_mode: "VOLUNTARY", offer_hours: 24 }
              as: StaffingOfficer
              captures: { off77: "$.data.id" }
            - call: "POST /fire-ops/overtime-offers/${off77}/response"
              payload: { response: "ACCEPT" }
              as: Firefighter
              as_user_id: "${ff77}"
          trigger:
            - call: "POST /fire-ops/overtime-offers/${off77}/response"
              payload: { response: "DECLINE" }
              as: Firefighter
              as_user_id: "${ff77}"
              captures: { err77: "$.data.error_id" }
          assert:
            - "HTTP 409 and error_id == \"ERR_OFFER_NOT_PENDING\""
            - "OvertimeOffer.${off77}.status == \"ACCEPTED\" and projected_cost_cents == 144000"
            - "Vacancy.${vac77}.status == \"FILLED\" and GET /fire-ops/shift-assignments?source_offer_id=${off77} returns total_count == 1"
            - "Station.${st77}.ot_committed_cents == 144000 — not 288000"
            - "Firefighter.${ff77}.voluntary_ot_hours_charged == 24 and ot_pass_count == 0"

      - name: revoke_of_queued_leave_rejected_as_not_revocable
        claim_type: Invalid Transitions
        grounds:
          - state_machines.LeaveRequest.APPROVED_to_REVOKED.preconditions
