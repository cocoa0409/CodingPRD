          - state_machines.PrescriptionAuthorization.AUTHORIZED_to_DISPENSED
        distinguishing_aspect: "state (priority 5) versus business_fiscal (priority 16): a pharmacy handoff raised against a REVOKED prescription whose requested quantity also exceeds the prescribed quantity must be refused with ERR_AUTHORIZATION_NOT_ACTIVE, because the state precondition is evaluated before the quantity budget."
