scenario: |
  Generate task harder than expert level!

  2445. Package Sortation Facility Operations & Peak Staffing (parcel sort center): inbound trailer scheduling, unload sequencing and volume forecasting by destination, primary and secondary sortation with chute assignment, jam recovery and mis-sort correction, labor planning by shift with headcount to volume ratios and flex staffing pools, peak season hiring, onboarding and training throughput with attrition modeling, outbound trailer loading, cube utilization and dispatch cut times, damaged, unlabeled and oversized package exception handling, safety, ergonomics and injury tracking on high-volume lines, cost-per-package metrics and automation utilization
domain_name: package-sortation-peak-staffing
api_prefix: "/sortation"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: posture_driven
  state_machine_shape_notes: |
    SortCenter.ops_posture is the derived aggregate gate (OPEN/RESTRICTED/FROZEN) that
    guards child operations. Layered on top: TrailerAppointment is cyclic
    (UNLOADING -> JAM_HELD -> UNLOADING), ShiftPlan is branching with a revision cycle
    (SUBMITTED -> {APPROVED, REJECTED}, REJECTED -> DRAFT, APPROVED <-> AT_RISK), and
    OutboundLoad carries two independent state dimensions (load_status x seal_status)
    that must both reach a target value before dispatch.
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  role_model_notes: |
    Five opaque operator roles own disjoint resource families (peer_roles), plus one
    entity_backed Worker role. Segregation of duties: the operator identified by
    X-User-ID who submitted a ShiftPlan may never approve it.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: SortCenter
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: facility code
        constraints: unique across all SortCenters, 3-10 chars
      - name: name
        type: string
        source: input
        description: facility display name
      - name: automation_utilization_pct
        type: number
        source: input
        description: planned automation utilization of the sorter, selects the throughput tier in required_headcount
        default: 0
        constraints: 0-100 inclusive, 2 decimal places
      - name: flex_pool_total
        type: integer
        source: input
        description: total flex staffing pool headcount owned by this facility
        default: 0
        constraints: ">= 0; immutable after create"
      - name: flex_pool_available
        type: integer
        source: computed
        description: unreserved flex headcount; initialized to flex_pool_total at create
        default: 0
      - name: flex_pool_reserved
        type: integer
        source: computed
        description: flex headcount reserved by APPROVED or AT_RISK ShiftPlans
        default: 0
      - name: ops_posture
        type: enum
        source: computed
        description: derived aggregate gate recomputed by calculation ops_posture_derivation
        default: OPEN
        constraints: "one of OPEN, RESTRICTED, FROZEN"
      - name: open_jam_count
        type: integer
        source: computed
        description: number of TrailerAppointments of this center currently in JAM_HELD
        default: 0
      - name: open_serious_injury_count
        type: integer
        source: computed
        description: number of InjuryReports of this center with severity SERIOUS and status OPEN
        default: 0
      - name: packages_inducted_count
        type: integer
        source: computed
        description: cumulative packages inducted by complete-unload; left side of the package-conservation invariant
        default: 0
      - name: wip_package_count
        type: integer
        source: computed
        description: inducted packages not yet scanned to an OutboundLoad
        default: 0
      - name: exception_hold_count
        type: integer
        source: computed
        description: packages held inside OPEN PackageExceptions
        default: 0
      - name: disposed_package_count
        type: integer
        source: computed
        description: packages removed from the network by DISPOSE resolutions
        default: 0
      - name: missort_corrected_count
        type: integer
        source: computed
        description: packages re-laned by REROUTE resolutions
        default: 0
      - name: last_posture_change_at
        type: datetime
        source: system
        description: logical-clock instant of the last ops_posture change, null until first change
        default: null

  - name: DockDoor
    parent: SortCenter
    common_fields: true
    fields:
      - name: sort_center_id
        type: string
        source: input
        description: FK -> SortCenter.id; owning facility, taken from the path
      - name: door_number
        type: integer
        source: input
        description: door label
        constraints: unique per sort_center_id, >= 1
      - name: kind
        type: enum
        source: input
        description: inbound unload door or outbound load door
        constraints: "one of INBOUND, OUTBOUND"
      - name: status
        type: enum
        source: input
        description: door availability
        default: ACTIVE
        constraints: "one of ACTIVE, OUT_OF_SERVICE"
      - name: turnaround_buffer_min
        type: integer
        source: input
        description: minutes of mandatory clear time required between two appointments on this door
        default: 15
        constraints: ">= 0"

  - name: SortChute
    parent: SortCenter
    common_fields: true
    fields:
      - name: sort_center_id
        type: string
        source: input
        description: FK -> SortCenter.id; owning facility, taken from the path
      - name: chute_number
        type: integer
        source: input
        description: chute label
        constraints: unique per sort_center_id, >= 1
      - name: throughput_pph
        type: integer
        source: input
        description: rated packages per hour of this chute; summed into DestinationLane.assigned_capacity_pph
        constraints: ">= 1"
      - name: max_concurrent_destinations
        type: integer
        source: input
        description: aggregate interval capacity - how many ACTIVE ChuteAssignments may overlap at any instant
        default: 2
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: ACTIVE by default; set to CONGESTED by a jam-hold cascade and back to ACTIVE by the resume-unload cascade
        default: ACTIVE
        constraints: "one of ACTIVE, CONGESTED"
      - name: jam_hold_count
        type: integer
        source: computed
        description: cumulative jam-holds recorded against this chute
        default: 0

  - name: DestinationLane
    parent: SortCenter
    common_fields: true
    fields:
      - name: sort_center_id
        type: string
        source: input
        description: FK -> SortCenter.id; owning facility, taken from the path
      - name: lane_code
        type: string
        source: input
        description: destination code
        constraints: unique per sort_center_id
      - name: region
        type: string
        source: input
        description: destination region label
      - name: service_class
        type: enum
        source: input
        description: service commitment of the destination
        constraints: "one of GROUND, EXPRESS, FREIGHT"
      - name: forecast_hourly_volume
        type: integer
        source: input
        description: forecast packages per hour for this destination; the backlog increment applied by one suspension hour
        constraints: ">= 0"
      - name: sorted_package_count
        type: integer
        source: computed
        description: packages scanned onto OutboundLoads of this lane minus packages pulled into MISSORT exceptions
        default: 0
      - name: backlog_package_count
        type: integer
        source: computed
        description: packages queued behind suspended chute capacity
        default: 0
      - name: assigned_capacity_pph
        type: integer
        source: computed
        description: sum of SortChute.throughput_pph over chutes holding an ACTIVE ChuteAssignment to this lane
        default: 0
      - name: lane_pressure_ratio
        type: number
        source: computed
        description: backlog_package_count / max(1, assigned_capacity_pph), 4 decimal places
        default: 0
      - name: status
        type: enum
        source: input
        description: lane availability
        default: ACTIVE
        constraints: "one of ACTIVE, CLOSED"

  - name: ChuteAssignment
    parent: SortChute
    common_fields: true
    fields:
      - name: chute_id
        type: string
        source: input
        description: FK -> SortChute.id; the chute occupied over the window
      - name: destination_lane_id
        type: string
        source: input
        description: FK -> DestinationLane.id; the destination sorted into that chute
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the occupation interval
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the occupation interval
        constraints: must be strictly after window_start
      - name: status
        type: enum
        source: computed
        description: ACTIVE at create; SUSPENDED by jam cascade; ACTIVE again by resume cascade; SUPERSEDED when a supersede create replaces it; ENDED when the owning appointment completes unload
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED, SUPERSEDED, ENDED"
      - name: suspended_reason
        type: string
        source: computed
        description: jam reason copied from the cascading jam-hold, null while ACTIVE
        default: null
      - name: effective_window_end
        type: datetime
        source: computed
        description: window_end, or the superseding assignment's window_start when this row was SUPERSEDED
        default: null

  - name: TrailerAppointment
    parent: SortCenter
    common_fields: true
    fields:
      - name: sort_center_id
        type: string
        source: input
        description: FK -> SortCenter.id; receiving facility
      - name: door_id
        type: string
        source: input
        description: FK -> DockDoor.id; inbound door reserved for the window
      - name: trailer_code
        type: string
        source: input
        description: carrier trailer identifier
        constraints: unique per sort_center_id among appointments with status in {SCHEDULED, ARRIVED, UNLOADING, JAM_HELD}
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the door occupation
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the door occupation
        constraints: must be strictly after window_start
      - name: priority_class
        type: enum
        source: input
        description: unload priority band, first key of unload_sequence_ranking
        constraints: "one of CRITICAL, EXPRESS, STANDARD, DEFERRED"
      - name: manifest_package_count
        type: integer
        source: input
        description: packages declared on the manifest, inducted at complete-unload
        constraints: ">= 0"
      - name: unload_sequence_rank
        type: integer
        source: computed
        description: 1-based rank among ARRIVED appointments of the same center per unload_sequence_ranking, null while not ARRIVED
        default: null
      - name: jam_count
        type: integer
        source: computed
        description: number of jam-holds recorded on this appointment
        default: 0
      - name: status
        type: enum
        source: computed
        description: appointment lifecycle
        default: SCHEDULED
        constraints: "one of SCHEDULED, ARRIVED, UNLOADING, JAM_HELD, UNLOADED"
      - name: arrived_at
        type: datetime
        source: system
        description: logical-clock instant of the arrive transition
        default: null
      - name: unloaded_at
        type: datetime
        source: system
        description: logical-clock instant of the complete-unload transition
        default: null

  - name: ShiftPlan
    parent: SortCenter
    common_fields: true
    fields:
      - name: sort_center_id
        type: string
        source: input
        description: FK -> SortCenter.id; planned facility
      - name: shift_date
        type: string
        source: input
        description: calendar date of the shift, YYYY-MM-DD
      - name: shift_window_start
        type: datetime
        source: input
        description: inclusive start of the shift
      - name: shift_window_end
        type: datetime
        source: input
        description: exclusive end of the shift
        constraints: must be strictly after shift_window_start
      - name: shift_hours
        type: number
        source: computed
        description: (shift_window_end - shift_window_start) in hours, 2 decimal places
        default: 0
      - name: forecast_volume
        type: integer
        source: input
        description: forecast packages for the shift, denominator of the PROVISIONAL cost variant
        constraints: ">= 1"
      - name: planned_core_headcount
        type: integer
        source: input
        description: CORE associates the planner commits
        constraints: ">= 0"
      - name: planned_seasonal_headcount
        type: integer
        source: input
        description: SEASONAL associates the planner commits
        constraints: ">= 0"
      - name: labor_budget_cents
        type: integer
        source: input
        description: fiscal ceiling checked against planned_labor_cents at approve
        constraints: ">= 0"
      - name: required_headcount
        type: integer
        source: computed
        description: output of calculation required_headcount, recomputed at submit
        default: 0
      - name: flex_draw_count
        type: integer
        source: computed
        description: flex headcount reserved from SortCenter.flex_pool_available for this plan
        default: 0
      - name: planned_labor_cents
        type: integer
        source: computed
        description: output of calculation planned_labor_cost, set at approve
        default: 0
      - name: committed_headcount
        type: integer
        source: computed
        description: planned_core_headcount + planned_seasonal_headcount + flex_draw_count - count(StaffAssignments of this plan with status == NO_SHOW)
        default: 0
      - name: staffing_gap
        type: integer
        source: computed
        description: max(0, required_headcount - committed_headcount)
        default: 0
      - name: unfilled_gap
        type: integer
        source: computed
        description: staffing gap that the flex pool could not cover at the last recompute
        default: 0
      - name: sorted_package_count
        type: integer
        source: computed
        description: packages scanned to OutboundLoads while this plan was the attributed plan
        default: 0
      - name: missort_package_count
        type: integer
        source: computed
        description: sum of PackageException.package_count with exception_type MISSORT attributed to this plan
        default: 0
      - name: actual_labor_cents
        type: integer
        source: computed
        description: output of calculation actual_labor_cost, set at close
        default: 0
      - name: provisional_cost_per_package_cents
        type: number
        source: computed
        description: PROVISIONAL variant of cost_per_package, set at approve, 2 decimal places
        default: null
      - name: final_cost_per_package_cents
        type: number
        source: computed
        description: FINAL variant of cost_per_package, set at close, 2 decimal places
        default: null
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator that performed submit; compared against the approver for segregation of duties
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator that performed approve
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: reason recorded by reject, null otherwise
        default: null
      - name: status
        type: enum
        source: computed
        description: plan lifecycle
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, APPROVED, REJECTED, AT_RISK, CLOSED"

  - name: Worker
    parent: SortCenter
    common_fields: true
    fields:
      - name: sort_center_id
        type: string
        source: input
        description: FK -> SortCenter.id; home facility
      - name: full_name
        type: string
        source: input
        description: worker name
      - name: hire_class
        type: enum
        source: input
        description: pay and attrition class
        constraints: "one of CORE, SEASONAL, FLEX"
      - name: hire_date
        type: string
        source: input
        description: hire date YYYY-MM-DD, basis of tenure_days
      - name: status
        type: enum
        source: computed
        description: onboarding and training lifecycle
        default: APPLIED
        constraints: "one of APPLIED, ONBOARDING, CLEARED, CERTIFIED, SEPARATED"
      - name: training_sessions_completed
        type: integer
        source: computed
        description: count of TRAINING_SESSION_COMPLETED onboarding events
        default: 0
      - name: training_sessions_missed
        type: integer
        source: computed
        description: count of TRAINING_SESSION_MISSED onboarding events
        default: 0
      - name: no_show_count
        type: integer
        source: computed
        description: count of StaffAssignments of this worker with status NO_SHOW
        default: 0
      - name: completed_assignment_count
        type: integer
        source: computed
        description: count of StaffAssignments of this worker with status COMPLETED; selects the attrition variant
        default: 0
      - name: consecutive_completed_shifts
        type: integer
        source: computed
        description: completed shifts since the last REST_DAY_RECORDED event, ergonomics counter
        default: 0
      - name: tenure_days
        type: integer
        source: computed
        description: floor((logical clock date - hire_date) in whole days), recomputed on every read-affecting mutation of this worker
        default: 0
      - name: attrition_risk_score
        type: number
        source: computed
        description: output of calculation attrition_risk_score, 4 decimal places
        default: 0
      - name: attrition_risk_basis
        type: enum
        source: computed
        description: which attrition variant produced attrition_risk_score
        default: COHORT_BASELINE
        constraints: "one of COHORT_BASELINE, INDIVIDUAL_OBSERVED"
      - name: attrition_flagged
        type: boolean
        source: computed
        description: attrition_risk_score >= ATTRITION_FLAG_THRESHOLD
        default: false

  - name: StaffAssignment
    parent: ShiftPlan
    common_fields: true
    fields:
      - name: shift_plan_id
        type: string
        source: input
        description: FK -> ShiftPlan.id; the staffed shift
      - name: worker_id
        type: string
        source: input
        description: FK -> Worker.id; the staffed worker
      - name: line_chute_id
        type: string
        source: input
        description: FK -> SortChute.id; the sort line the worker is placed on
      - name: role_on_line
        type: enum
        source: input
        description: position on the line
        constraints: "one of UNLOADER, PRIMARY_SORTER, SECONDARY_SORTER, LOADER, JAM_TECH"
      - name: status
        type: enum
        source: computed
        description: assignment lifecycle
        default: ASSIGNED
        constraints: "one of ASSIGNED, CHECKED_IN, COMPLETED, NO_SHOW"
      - name: checked_in_at
        type: datetime
        source: system
        description: logical-clock instant of check-in
        default: null
      - name: checked_out_at
        type: datetime
        source: system
        description: logical-clock instant of check-out
        default: null
      - name: worked_hours
        type: number
        source: computed
        description: (checked_out_at - checked_in_at) in hours, 2 decimal places, 0 until check-out
        default: 0

  - name: OutboundLoad
    parent: SortCenter
    common_fields: true
    fields:
      - name: sort_center_id
        type: string
        source: input
        description: FK -> SortCenter.id; loading facility
      - name: door_id
        type: string
        source: input
        description: FK -> DockDoor.id; outbound door
      - name: destination_lane_id
        type: string
        source: input
        description: FK -> DestinationLane.id; destination this trailer carries
      - name: trailer_code
        type: string
        source: input
        description: outbound trailer identifier
      - name: trailer_cube_cuft
        type: number
        source: input
        description: usable cube of the trailer in cubic feet
        constraints: "> 0, 2 decimal places"
      - name: cube_used_cuft
        type: number
        source: computed
        description: output of calculation cube_consumption, 2 decimal places
        default: 0
      - name: cube_utilization_pct
        type: number
        source: computed
        description: cube_used_cuft / trailer_cube_cuft * 100, 2 decimal places
        default: 0
      - name: package_count
        type: integer
        source: computed
        description: packages scanned onto this load
        default: 0
      - name: dispatch_cut_time
        type: datetime
        source: input
        description: latest logical-clock instant at which dispatch is permitted
      - name: load_status
        type: enum
        source: computed
        description: loading dimension of the parallel state machine
        default: STAGING
        constraints: "one of STAGING, LOADING, LOADED, DISPATCHED"
      - name: seal_status
        type: enum
        source: computed
        description: seal dimension of the parallel state machine, evolves independently of load_status
        default: UNSEALED
        constraints: "one of UNSEALED, SEALED, BROKEN"
      - name: seal_code
        type: string
        source: input
        description: seal identifier recorded by seal, null while UNSEALED
        default: null
      - name: dispatched_at
        type: datetime
        source: system
        description: logical-clock instant of dispatch
        default: null

  - name: PackageException
    parent: SortCenter
    common_fields: true
    fields:
      - name: sort_center_id
        type: string
        source: input
        description: FK -> SortCenter.id; facility holding the packages
      - name: exception_type
        type: enum
        source: input
        description: exception family
        constraints: "one of DAMAGED, UNLABELED, OVERSIZED, MISSORT"
      - name: package_count
        type: integer
        source: input
        description: packages pulled into this exception batch
        constraints: ">= 1"
      - name: from_destination_lane_id
        type: string
        source: input
        description: FK -> DestinationLane.id; lane the packages were pulled out of, required for MISSORT and null otherwise
        default: null
      - name: to_destination_lane_id
        type: string
        source: computed
        description: FK -> DestinationLane.id; lane the packages were re-laned into by a REROUTE resolution, null otherwise
        default: null
      - name: outbound_load_id
        type: string
        source: input
        description: FK -> OutboundLoad.id; load the packages were found on, null when found on the inbound side
        default: null
      - name: trailer_appointment_id
        type: string
        source: input
        description: FK -> TrailerAppointment.id; inbound trailer the packages arrived on, null when found on the outbound side
        default: null
      - name: shift_plan_id
        type: string
        source: computed
        description: FK -> ShiftPlan.id; plan attributed by selector attributed_shift_plan at create, null when no plan covers the clock
        default: null
      - name: resolved_via_chute_id
        type: string
        source: computed
        description: FK -> SortChute.id; chute picked by selector reroute_chute_selection at a REROUTE resolution, null otherwise
        default: null
      - name: status
        type: enum
        source: computed
        description: exception lifecycle
        default: OPEN
        constraints: "one of OPEN, RESOLVED"
      - name: resolution
        type: enum
        source: input
        description: how the batch left the exception queue, null while OPEN
        default: null
        constraints: "one of REROUTE, DISPOSE, RELABEL"
      - name: resolved_at
        type: datetime
        source: system
        description: logical-clock instant of resolve
        default: null

  - name: InjuryReport
    parent: SortCenter
    common_fields: true
    fields:
      - name: sort_center_id
        type: string
        source: input
        description: FK -> SortCenter.id; facility where the injury occurred
      - name: worker_id
        type: string
        source: input
        description: FK -> Worker.id; injured worker
      - name: chute_id
        type: string
        source: input
        description: FK -> SortChute.id; line involved, null when not line-specific
        default: null
      - name: severity
        type: enum
        source: input
        description: injury severity band; SERIOUS drives the FROZEN posture
        constraints: "one of FIRST_AID, RECORDABLE, SERIOUS"
      - name: body_part
        type: string
        source: input
        description: injured body part
      - name: occurred_at
        type: datetime
        source: input
        description: instant the injury occurred
      - name: lost_time_days
        type: integer
        source: input
        description: lost time recorded at close
        default: 0
      - name: status
        type: enum
        source: computed
        description: report lifecycle
        default: OPEN
        constraints: "one of OPEN, CLOSED"

state_machines:
  # ---- 1. SortCenter: derived posture gate (compound, cyclic in both directions)
  - entity: SortCenter
    state_field: ops_posture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system recompute of calculation ops_posture_derivation at any of: POST /trailer-appointments/{id}/jam-hold, POST /trailer-appointments/{id}/resume-unload, POST /injury-reports, POST /injury-reports/{id}/close, POST /package-exceptions, POST /package-exceptions/{id}/resolve, POST /outbound-loads/{id}/scan-packages, POST /trailer-appointments/{id}/complete-unload"
        actor: system
        preconditions:
          - "ops_posture_derivation evaluates to RESTRICTED: open_serious_injury_count == 0 AND open_jam_count < JAM_FREEZE_THRESHOLD AND (open_jam_count >= 1 OR max(DestinationLane.lane_pressure_ratio over lanes of this center with status == ACTIVE) >= LANE_PRESSURE_RESTRICT_RATIO OR automation_utilization_pct < AUTOMATION_RESTRICT_PCT)"
        side_effects:
          - "ops_posture = RESTRICTED; last_posture_change_at = logical clock; SortCenter.version += 1"
          - "subsequent required_headcount recomputations use POSTURE_MULTIPLIER[RESTRICTED] = 1.10"
      - from: RESTRICTED
        to: OPEN
        trigger: "system recompute of ops_posture_derivation at the same trigger points"
        actor: system
        preconditions:
          - "ops_posture_derivation evaluates to OPEN: open_serious_injury_count == 0 AND open_jam_count == 0 AND max lane_pressure_ratio < LANE_PRESSURE_RESTRICT_RATIO AND automation_utilization_pct >= AUTOMATION_RESTRICT_PCT"
        side_effects:
          - "ops_posture = OPEN; last_posture_change_at = logical clock; SortCenter.version += 1"
      - from: OPEN
        to: FROZEN
        trigger: "system recompute of ops_posture_derivation, typically from POST /injury-reports with severity SERIOUS"
        actor: system
        preconditions:
          - "ops_posture_derivation evaluates to FROZEN: open_serious_injury_count >= 1 OR open_jam_count >= JAM_FREEZE_THRESHOLD"
        side_effects:
          - "ops_posture = FROZEN; last_posture_change_at = logical clock; SortCenter.version += 1"
          - "all child operations gated by validation priority 22 (ERR_CENTER_FROZEN) are refused while FROZEN"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system recompute of ops_posture_derivation, typically from POST /injury-reports with severity SERIOUS or the third concurrent jam-hold"
        actor: system
        preconditions:
          - "ops_posture_derivation evaluates to FROZEN"
        side_effects:
          - "ops_posture = FROZEN; last_posture_change_at = logical clock; SortCenter.version += 1"
      - from: FROZEN
        to: RESTRICTED
        trigger: "system recompute of ops_posture_derivation, typically from POST /injury-reports/{id}/close while a jam is still held"
        actor: system
        preconditions:
          - "ops_posture_derivation evaluates to RESTRICTED"
        side_effects:
          - "ops_posture = RESTRICTED; last_posture_change_at = logical clock; SortCenter.version += 1"
      - from: FROZEN
        to: OPEN
        trigger: "system recompute of ops_posture_derivation, typically from POST /injury-reports/{id}/close with no other trigger outstanding"
        actor: system
        preconditions:
          - "ops_posture_derivation evaluates to OPEN"
        side_effects:
          - "ops_posture = OPEN; last_posture_change_at = logical clock; SortCenter.version += 1"

  # ---- 2. TrailerAppointment: cyclic (UNLOADING <-> JAM_HELD)
  - entity: TrailerAppointment
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [UNLOADED]
    transitions:
      - from: SCHEDULED
        to: ARRIVED
        trigger: "POST /sortation/trailer-appointments/{id}/arrive"
        actor: InboundCoordinator
        preconditions:
          - "status == SCHEDULED"
          - "SortCenter.ops_posture != FROZEN"
        side_effects:
          - "arrived_at = logical clock"
          - "unload_sequence_rank recomputed by calculation unload_sequence_ranking for every appointment of this center with status == ARRIVED"
      - from: ARRIVED
        to: UNLOADING
        trigger: "POST /sortation/trailer-appointments/{id}/start-unload"
        actor: InboundCoordinator
        preconditions:
          - "status == ARRIVED"
          - "the DockDoor referenced by door_id has status == ACTIVE (cross-entity guard, else ERR_DOOR_OUT_OF_SERVICE)"
          - "SortCenter.ops_posture != FROZEN"
        side_effects:
          - "unload_sequence_rank recomputed for the center's ARRIVED set (this appointment leaves the ranked set)"
      - from: UNLOADING
        to: JAM_HELD
        trigger: "POST /sortation/trailer-appointments/{id}/jam-hold"
        actor: InboundCoordinator
        preconditions:
          - "status == UNLOADING"
          - "jam_count < JAM_RETRY_LIMIT (else ERR_JAM_RETRY_LIMIT_REACHED)"
          - "the SortChute referenced by the request body chute_id belongs to the same sort_center_id"
        side_effects:
          - "L1: status = JAM_HELD; jam_count += 1"
          - "L2 (caused by L1): the SortChute named by chute_id flips status ACTIVE -> CONGESTED and jam_hold_count += 1"
          - "L3 (caused by L2): every ChuteAssignment with chute_id == that chute and status == ACTIVE flips to SUSPENDED with suspended_reason = request body jam_reason"
          - "L4 (caused by L3): for each ChuteAssignment suspended in L3, its DestinationLane.backlog_package_count += that lane's forecast_hourly_volume, assigned_capacity_pph is recomputed over the remaining ACTIVE assignments, and lane_pressure_ratio is recomputed by calculation lane_pressure"
          - "L5 (caused by L4): SortCenter.open_jam_count recomputed and ops_posture recomputed by ops_posture_derivation; SortCenter.version += 1"
        note: "depth-4 transitive cascade (appointment -> chute -> chute assignment -> lane -> center posture)"
      - from: JAM_HELD
        to: UNLOADING
        trigger: "POST /sortation/trailer-appointments/{id}/resume-unload"
        actor: InboundCoordinator
        preconditions:
          - "status == JAM_HELD"
          - "the SortChute referenced by the request body chute_id has status == CONGESTED"
        side_effects:
          - "status = UNLOADING (jam_count is NOT decremented - it is the retry counter)"
          - "the named SortChute flips CONGESTED -> ACTIVE"
          - "every ChuteAssignment on that chute with status == SUSPENDED flips back to ACTIVE and suspended_reason = null"
          - "for each reactivated assignment, its DestinationLane.backlog_package_count = max(0, backlog_package_count - forecast_hourly_volume); assigned_capacity_pph and lane_pressure_ratio recomputed"
          - "SortCenter.open_jam_count recomputed and ops_posture recomputed; SortCenter.version += 1"
        note: "compensating transition for jam-hold; restores lane backlog exactly"
      - from: UNLOADING
        to: UNLOADED
        trigger: "POST /sortation/trailer-appointments/{id}/complete-unload"
        actor: InboundCoordinator
        preconditions:
          - "status == UNLOADING"
          - "SortCenter.ops_posture != FROZEN"
        side_effects:
          - "status = UNLOADED; unloaded_at = logical clock"
          - "SortCenter.packages_inducted_count += manifest_package_count; SortCenter.wip_package_count += manifest_package_count; SortCenter.version += 1"
          - "ops_posture recomputed by ops_posture_derivation"

  # ---- 3. ChuteAssignment: cyclic (ACTIVE <-> SUSPENDED)
  - entity: ChuteAssignment
    state_field: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, ENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system, as link L3 of the POST /sortation/trailer-appointments/{id}/jam-hold cascade"
        actor: system
        preconditions:
          - "status == ACTIVE AND chute_id == the jammed chute"
        side_effects:
          - "suspended_reason = jam_reason; DestinationLane backlog and capacity recomputed (link L4)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system, as part of the POST /sortation/trailer-appointments/{id}/resume-unload cascade"
        actor: system
        preconditions:
          - "status == SUSPENDED AND chute_id == the resumed chute"
        side_effects:
          - "suspended_reason = null; DestinationLane backlog decremented by forecast_hourly_volume with a floor of 0"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system, when POST /sortation/chute-assignments is called with supersede == true for the same chute_id and destination_lane_id"
        actor: system
        preconditions:
          - "status == ACTIVE AND chute_id and destination_lane_id both equal the incoming request values"
        side_effects:
          - "effective_window_end = the incoming assignment's window_start; the superseded row no longer counts toward chute concurrency or lane assigned_capacity_pph"
          - "DestinationLane.assigned_capacity_pph and lane_pressure_ratio recomputed"
      - from: ACTIVE
        to: ENDED
        trigger: "system, as part of the POST /sortation/shift-plans/{id}/close cascade"
        actor: system
        preconditions:
          - "status IN {ACTIVE, SUSPENDED} AND window_end <= the closing plan's shift_window_end AND the assignment's chute belongs to the plan's sort_center_id"
        side_effects:
          - "effective_window_end = window_end; DestinationLane.assigned_capacity_pph and lane_pressure_ratio recomputed"
      - from: SUSPENDED
        to: ENDED
        trigger: "system, as part of the POST /sortation/shift-plans/{id}/close cascade"
        actor: system
        preconditions:
          - "status == SUSPENDED AND window_end <= the closing plan's shift_window_end"
        side_effects:
          - "effective_window_end = window_end; lane capacity and pressure recomputed"

  # ---- 4. ShiftPlan: branching fork + revision cycle + AT_RISK cycle
  - entity: ShiftPlan
    state_field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /sortation/shift-plans/{id}/submit"
        actor: LaborPlanner
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "shift_hours recomputed; required_headcount recomputed by calculation required_headcount using the center's current ops_posture, automation_utilization_pct and line_count"
          - "submitted_by_user_id = X-User-ID of the caller"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /sortation/shift-plans/{id}/approve"
        actor: OpsManager
        preconditions:
          - "status == SUBMITTED"
          - "expected_center_version == SortCenter.version (OCC, else ERR_STALE_CENTER_VERSION)"
          - "X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "planned_core_headcount + planned_seasonal_headcount + flex_needed <= MAX_LINE_HEADCOUNT * line_count (else ERR_LINE_HEADCOUNT_EXCEEDED)"
          - "SortCenter.flex_pool_available >= flex_needed where flex_needed = max(0, required_headcount - planned_core_headcount - planned_seasonal_headcount) (else ERR_FLEX_POOL_EXHAUSTED)"
          - "planned_labor_cents <= labor_budget_cents (else ERR_LABOR_BUDGET_EXCEEDED)"
        side_effects:
          - "flex_draw_count = flex_needed; SortCenter.flex_pool_available -= flex_draw_count; SortCenter.flex_pool_reserved += flex_draw_count; SortCenter.version += 1"
          - "planned_labor_cents set by calculation planned_labor_cost; provisional_cost_per_package_cents set by calculation cost_per_package variant PROVISIONAL"
          - "committed_headcount and staffing_gap recomputed; approved_by_user_id = X-User-ID"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /sortation/shift-plans/{id}/reject"
        actor: OpsManager
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "rejection_reason recorded; no flex reservation is taken and SortCenter.flex_pool_available / flex_pool_reserved are untouched (divergent side-effect set versus the APPROVED branch)"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /sortation/shift-plans/{id}/revise"
        actor: LaborPlanner
        preconditions:
          - "status == REJECTED"
        side_effects:
          - "any supplied forecast_volume / planned_core_headcount / planned_seasonal_headcount / labor_budget_cents overwrite the stored values"
          - "rejection_reason = null; submitted_by_user_id = null; required_headcount = 0 until the next submit"
        note: "closes the revision cycle DRAFT -> SUBMITTED -> REJECTED -> DRAFT"
      - from: APPROVED
        to: AT_RISK
        trigger: "system, as link L4 of the POST /sortation/staff-assignments/{id}/no-show cascade"
        actor: system
        preconditions:
          - "status == APPROVED AND staffing_gap > AT_RISK_GAP_THRESHOLD after committed_headcount was recomputed"
        side_effects:
          - "L5 (caused by L4): auto flex top-up draw = min(staffing_gap, SortCenter.flex_pool_available); SortCenter.flex_pool_available -= draw; SortCenter.flex_pool_reserved += draw; flex_draw_count += draw; committed_headcount and staffing_gap recomputed; unfilled_gap = staffing_gap after the draw; SortCenter.version += 1"
      - from: AT_RISK
        to: APPROVED
        trigger: "system, as link L6 of the no-show cascade, when the L5 flex top-up closed the gap"
        actor: system
        preconditions:
          - "status == AT_RISK AND staffing_gap == 0 after the L5 top-up"
        side_effects:
          - "unfilled_gap = 0"
        note: "closes the APPROVED <-> AT_RISK cycle inside a single request when flex capacity exists"
      - from: APPROVED
        to: CLOSED
        trigger: "POST /sortation/shift-plans/{id}/close"
        actor: OpsManager
        preconditions:
          - "status == APPROVED"
          - "expected_center_version == SortCenter.version (OCC, else ERR_STALE_CENTER_VERSION)"
        side_effects:
          - "actual_labor_cents set by calculation actual_labor_cost; final_cost_per_package_cents set by calculation cost_per_package variant FINAL"
          - "flex release: SortCenter.flex_pool_available += flex_draw_count; SortCenter.flex_pool_reserved -= flex_draw_count; SortCenter.version += 1 (compensating action of the approve reservation; flex_pool_total is conserved)"
          - "every ChuteAssignment of this center with status IN {ACTIVE, SUSPENDED} and window_end <= shift_window_end flips to ENDED; affected DestinationLane.assigned_capacity_pph and lane_pressure_ratio recomputed"
      - from: AT_RISK
        to: CLOSED
        trigger: "POST /sortation/shift-plans/{id}/close"
        actor: OpsManager
        preconditions:
          - "status == AT_RISK"
          - "expected_center_version == SortCenter.version (OCC, else ERR_STALE_CENTER_VERSION)"
        side_effects:
          - "same close side effects as APPROVED -> CLOSED, including the flex release and the ChuteAssignment ENDED cascade"

  # ---- 5. Worker: onboarding / training pipeline with an early exit
  - entity: Worker
    state_field: status
    initial_state: APPLIED
    terminal_states: [SEPARATED]
    transitions:
      - from: APPLIED
        to: ONBOARDING
        trigger: "POST /sortation/workers/{id}/onboarding-events with event_type == ONBOARDING_STARTED"
        actor: LaborPlanner
        preconditions:
          - "status == APPLIED"
        side_effects:
          - "attrition_risk_score recomputed by calculation attrition_risk_score"
      - from: ONBOARDING
        to: CLEARED
        trigger: "POST /sortation/workers/{id}/onboarding-events with event_type == BACKGROUND_CLEARED"
        actor: LaborPlanner
        preconditions:
          - "status == ONBOARDING"
        side_effects:
          - "attrition_risk_score recomputed"
      - from: CLEARED
        to: CLEARED
        trigger: "POST /sortation/workers/{id}/onboarding-events with event_type IN {TRAINING_SESSION_COMPLETED, TRAINING_SESSION_MISSED, REST_DAY_RECORDED}"
        actor: LaborPlanner
        preconditions:
          - "status == CLEARED"
        side_effects:
          - "TRAINING_SESSION_COMPLETED: training_sessions_completed += 1; TRAINING_SESSION_MISSED: training_sessions_missed += 1; REST_DAY_RECORDED: consecutive_completed_shifts = 0"
          - "attrition_risk_score, attrition_risk_basis and attrition_flagged recomputed"
        note: "training throughput self-loop BEFORE certification; this is the only way to raise training_sessions_completed to REQUIRED_TRAINING_SESSIONS, which the CLEARED -> CERTIFIED transition demands"
      - from: CLEARED
        to: CERTIFIED
        trigger: "POST /sortation/workers/{id}/onboarding-events with event_type == CERTIFIED"
        actor: LaborPlanner
        preconditions:
          - "status == CLEARED"
          - "training_sessions_completed >= REQUIRED_TRAINING_SESSIONS (else ERR_WORKER_NOT_CLEARED)"
        side_effects:
          - "attrition_risk_score recomputed; the CERTIFIED credit of -0.04 now applies to the INDIVIDUAL_OBSERVED variant"
      - from: CLEARED
        to: SEPARATED
        trigger: "POST /sortation/workers/{id}/onboarding-events with event_type == SEPARATED"
        actor: LaborPlanner
        preconditions:
          - "status == CLEARED"
        side_effects:
          - "every StaffAssignment of this worker with status == ASSIGNED flips to NO_SHOW and the full no-show cascade (L1..L6) runs for each affected ShiftPlan"
      - from: CERTIFIED
        to: SEPARATED
        trigger: "POST /sortation/workers/{id}/onboarding-events with event_type == SEPARATED"
        actor: LaborPlanner
        preconditions:
          - "status == CERTIFIED"
        side_effects:
          - "same separation cascade as CLEARED -> SEPARATED"
      - from: CERTIFIED
        to: CERTIFIED
        trigger: "POST /sortation/workers/{id}/onboarding-events with event_type IN {TRAINING_SESSION_COMPLETED, TRAINING_SESSION_MISSED, REST_DAY_RECORDED}"
        actor: LaborPlanner
        preconditions:
          - "status == CERTIFIED"
        side_effects:
          - "TRAINING_SESSION_COMPLETED: training_sessions_completed += 1; TRAINING_SESSION_MISSED: training_sessions_missed += 1; REST_DAY_RECORDED: consecutive_completed_shifts = 0"
          - "attrition_risk_score, attrition_risk_basis and attrition_flagged recomputed"
        note: "self-loop that keeps the training counters mutable after certification"

  # ---- 6. StaffAssignment
  - entity: StaffAssignment
    state_field: status
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, NO_SHOW]
    transitions:
      - from: ASSIGNED
        to: CHECKED_IN
        trigger: "POST /sortation/staff-assignments/{id}/check-in"
        actor: Worker
        preconditions:
          - "status == ASSIGNED"
          - "X-User-ID == worker_id (else ERR_NOT_ASSIGNMENT_OWNER)"
          - "the Worker referenced by worker_id has status == CERTIFIED (cross-entity guard, else ERR_WORKER_NOT_CLEARED)"
          - "the ShiftPlan referenced by shift_plan_id has status IN {APPROVED, AT_RISK} (cross-entity guard, else ERR_INVALID_SHIFT_PLAN_STATE)"
          - "SortCenter.ops_posture != FROZEN"
        side_effects:
          - "checked_in_at = logical clock"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /sortation/staff-assignments/{id}/check-out"
        actor: Worker
        preconditions:
          - "status == CHECKED_IN"
          - "X-User-ID == worker_id (else ERR_NOT_ASSIGNMENT_OWNER)"
        side_effects:
          - "checked_out_at = logical clock; worked_hours = round((checked_out_at - checked_in_at) / 3600, 2)"
          - "Worker.completed_assignment_count += 1; Worker.consecutive_completed_shifts += 1"
          - "Worker.attrition_risk_score recomputed; attrition_risk_basis switches to INDIVIDUAL_OBSERVED once completed_assignment_count >= MIN_OBSERVATION_ASSIGNMENTS"
      - from: ASSIGNED
        to: NO_SHOW
        trigger: "POST /sortation/staff-assignments/{id}/no-show"
        actor: LaborPlanner
        preconditions:
          - "status == ASSIGNED"
        side_effects:
          - "L1: status = NO_SHOW; Worker.no_show_count += 1"
          - "L2 (caused by L1 on the Worker): attrition_risk_score, attrition_risk_basis and attrition_flagged recomputed"
          - "L3 (caused by L1 on the ShiftPlan): committed_headcount recomputed (the NO_SHOW row subtracts one) and staffing_gap recomputed"
          - "L4 (caused by L3): when status == APPROVED and staffing_gap > AT_RISK_GAP_THRESHOLD the plan flips APPROVED -> AT_RISK"
          - "L5 (caused by L4): flex top-up draw = min(staffing_gap, SortCenter.flex_pool_available) reserved from the center pool; unfilled_gap = residual gap; SortCenter.version += 1"
          - "L6 (caused by L5): when staffing_gap == 0 after the top-up the plan flips AT_RISK -> APPROVED"
        note: "depth-3+ transitive cascade (assignment -> plan headcount/status -> center flex pool -> plan status again)"

  # ---- 7. OutboundLoad, dimension load_status (parallel dimension 1 of 2)
  - entity: OutboundLoad
    state_field: load_status
    initial_state: STAGING
    terminal_states: [DISPATCHED]
    transitions:
      - from: STAGING
        to: LOADING
        trigger: "POST /sortation/outbound-loads/{id}/scan-packages (first successful scan)"
        actor: SortSupervisor
        preconditions:
          - "load_status == STAGING"
          - "SortCenter.ops_posture != FROZEN"
          - "cube_consumption result <= trailer_cube_cuft (else ERR_TRAILER_CUBE_EXCEEDED)"
        side_effects:
          - "cube_used_cuft, cube_utilization_pct and package_count updated by calculation cube_consumption"
          - "SortCenter.wip_package_count -= scanned packages; DestinationLane.sorted_package_count += scanned packages; SortCenter.version += 1"
          - "ShiftPlan.sorted_package_count += scanned packages for the plan chosen by selector attributed_shift_plan"
      - from: LOADING
        to: LOADING
        trigger: "POST /sortation/outbound-loads/{id}/scan-packages (subsequent scans)"
        actor: SortSupervisor
        preconditions:
          - "load_status == LOADING"
          - "SortCenter.ops_posture != FROZEN"
          - "cube_used_cuft after this batch <= trailer_cube_cuft (else ERR_TRAILER_CUBE_EXCEEDED)"
        side_effects:
          - "same accumulation as the STAGING -> LOADING transition; cube_used_cuft = round(previous cube_used_cuft + batch line sum, 2)"
      - from: LOADING
        to: LOADED
        trigger: "POST /sortation/outbound-loads/{id}/close-load"
        actor: SortSupervisor
        preconditions:
          - "load_status == LOADING"
        side_effects:
          - "cube_utilization_pct refreshed; no change to seal_status (the dimensions are independent)"
      - from: LOADED
        to: DISPATCHED
        trigger: "POST /sortation/outbound-loads/{id}/dispatch"
        actor: OpsManager
        preconditions:
          - "load_status == LOADED"
          - "seal_status == SEALED (join of the two parallel dimensions, else ERR_LOAD_NOT_SEALED)"
          - "logical clock < dispatch_cut_time, strictly (a clock exactly equal to the cut time is too late, else ERR_DISPATCH_CUT_PASSED)"
          - "SortCenter.ops_posture != FROZEN (else ERR_CENTER_FROZEN)"
        side_effects:
          - "dispatched_at = logical clock; the load's packages stay counted in DestinationLane.sorted_package_count"

  # ---- 8. OutboundLoad, dimension seal_status (parallel dimension 2 of 2, cyclic)
  - entity: OutboundLoad
    state_field: seal_status
    initial_state: UNSEALED
    terminal_states: []
    transitions:
      - from: UNSEALED
        to: SEALED
        trigger: "POST /sortation/outbound-loads/{id}/seal"
        actor: SortSupervisor
        preconditions:
          - "seal_status == UNSEALED"
          - "load_status IN {LOADING, LOADED} (a STAGING load has nothing to seal, else ERR_INVALID_LOAD_STATE)"
        side_effects:
          - "seal_code recorded; load_status is unchanged"
      - from: SEALED
        to: BROKEN
        trigger: "system, when POST /sortation/package-exceptions is created with outbound_load_id pointing at this load"
        actor: system
        preconditions:
          - "seal_status == SEALED"
        side_effects:
          - "seal_code = null; load_status unchanged, so a LOADED load stays LOADED but can no longer be dispatched until re-sealed"
      - from: BROKEN
        to: SEALED
        trigger: "POST /sortation/outbound-loads/{id}/seal"
        actor: SortSupervisor
        preconditions:
          - "seal_status == BROKEN"
          - "load_status IN {LOADING, LOADED}"
        side_effects:
          - "seal_code recorded with the new value; closes the UNSEALED -> SEALED -> BROKEN -> SEALED cycle"

  # ---- 9. PackageException
  - entity: PackageException
    state_field: status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /sortation/package-exceptions/{id}/resolve"
        actor: SortSupervisor
        preconditions:
          - "status == OPEN (else ERR_INVALID_EXCEPTION_STATE)"
          - "resolution == REROUTE requires to_destination_lane_id present with DestinationLane.status == ACTIVE, at least one ChuteAssignment ever created for that lane (else ERR_LANE_NOT_ASSIGNED_TO_CHUTE), and a non-empty eligible set under selector reroute_chute_selection (else ERR_NO_ELIGIBLE_CHUTE)"
          - "SortCenter.ops_posture != FROZEN (else ERR_CENTER_FROZEN)"
        side_effects:
          - "resolved_at = logical clock; resolution recorded"
          - "REROUTE: SortCenter.exception_hold_count -= package_count; the target DestinationLane.sorted_package_count += package_count; SortCenter.missort_corrected_count += package_count; resolved_via_chute_id = the chute picked by reroute_chute_selection"
          - "DISPOSE: SortCenter.exception_hold_count -= package_count; SortCenter.disposed_package_count += package_count"
          - "RELABEL: SortCenter.exception_hold_count -= package_count; SortCenter.wip_package_count += package_count"
          - "SortCenter.version += 1; ops_posture recomputed"

  # ---- 10. InjuryReport
  - entity: InjuryReport
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /sortation/injury-reports/{id}/close"
        actor: OpsManager
        preconditions:
          - "status == OPEN"
        side_effects:
          - "lost_time_days recorded"
          - "SortCenter.open_serious_injury_count recomputed and ops_posture recomputed by ops_posture_derivation; SortCenter.version += 1"

concurrency_rules:
  - rule_id: chute-assignment-create-stale-chute
    parent_entity: SortChute
    write_endpoint: "POST /sortation/chute-assignments"
    occ_field: "expected_chute_version"
    description: |
      Creating a ChuteAssignment against a SortChute whose version has advanced since
      the client last read it is rejected. This captures the case where another writer
      already re-chuted the same destination with supersede == true (which legitimately
      ends the prior assignment at the new window_start), or where a jam-hold cascade
      flipped the chute to CONGESTED, so the writer's view of the chute is stale.
    error_id: ERR_STALE_CHUTE_VERSION
    http_status: 412
  - rule_id: shift-plan-approve-stale-center
    parent_entity: SortCenter
    write_endpoint: "POST /sortation/shift-plans/{id}/approve"
    occ_field: "expected_center_version"
    description: |
      Approving a ShiftPlan reserves flex headcount from the shared SortCenter pool.
      An approve carrying a SortCenter version older than the stored one is rejected,
      because the flex pool the approver sized the draw against has already moved -
      another plan's approve, a no-show flex top-up, or a posture change has advanced
      the center. Approving a different plan is legitimate on its own, so the stale
      view is resolved by OCC rather than by a state precondition.
    error_id: ERR_STALE_CENTER_VERSION
    http_status: 412
  - rule_id: shift-plan-close-stale-center
    parent_entity: SortCenter
    write_endpoint: "POST /sortation/shift-plans/{id}/close"
    occ_field: "expected_center_version"
    description: |
      Closing a ShiftPlan releases its flex reservation back into the shared pool.
      A close carrying a SortCenter version older than the stored one is rejected,
      because the released amount is reconciled against a pool the caller has not
      observed since another plan's approve or an auto top-up moved it.
    error_id: ERR_STALE_CENTER_VERSION
    http_status: 412

calculations:
  - name: required_headcount
    trigger: "POST /sortation/shift-plans/{id}/submit (DRAFT -> SUBMITTED); writes ShiftPlan.required_headcount"
    algorithm: threshold
    formula: |
      shift_hours = round((shift_window_end - shift_window_start) / 3600, 2)
      # tier selection is on the CENTER's automation_utilization_pct, evaluated top-down
      base_pph_per_associate =
          1200 if SortCenter.automation_utilization_pct >= 85
          else 950 if SortCenter.automation_utilization_pct >= 60
          else 700
      line_count = count(SortChute of this sort_center_id with status IN {ACTIVE, CONGESTED})
      raw_headcount = forecast_volume / (base_pph_per_associate * shift_hours)      # exact rational, no rounding here
      posture_adjusted = raw_headcount * POSTURE_MULTIPLIER[SortCenter.ops_posture]  # multiply FIRST
      required_headcount = max(MIN_HEADCOUNT_PER_LINE * line_count, ceil(posture_adjusted))  # ceil AFTER the multiply
      # pinned order: multiply by the posture multiplier, then ceil, then apply the per-line floor.
      # ceil-then-multiply is explicitly NOT the contract (it yields 15 instead of 14 at
      # forecast_volume=96000, automation 70, 8h, RESTRICTED).
    input_set: "the ShiftPlan's own input fields plus SortCenter.automation_utilization_pct, SortCenter.ops_posture at submit time, and the count of SortChutes with status IN {ACTIVE, CONGESTED}"
    constants:
      AUTOMATION_TIER_HIGH_PCT: 85
      AUTOMATION_TIER_MID_PCT: 60
      PPH_TIER_HIGH: 1200
      PPH_TIER_MID: 950
      PPH_TIER_LOW: 700
      POSTURE_MULTIPLIER: { OPEN: 1.00, RESTRICTED: 1.10, FROZEN: 1.25 }
      MIN_HEADCOUNT_PER_LINE: 4
    precision: "integer result; the intermediate posture_adjusted is kept exact and only ceil'd once"

  - name: planned_labor_cost
    trigger: "POST /sortation/shift-plans/{id}/approve (SUBMITTED -> APPROVED); writes ShiftPlan.planned_labor_cents and ShiftPlan.flex_draw_count"
    algorithm: constraint_propagation
    formula: |
      # The flex premium tier is keyed on the flex ratio, and the flex ratio depends on the
      # flex draw, which is itself sized from required_headcount. The evaluation order below
      # is PINNED so the value is well-defined; evaluating the premium before the draw is wrong.
      step_1: flex_needed   = max(0, required_headcount - planned_core_headcount - planned_seasonal_headcount)
      step_2: flex_draw     = flex_needed                       # rejected earlier by ERR_FLEX_POOL_EXHAUSTED if the pool cannot cover it
      step_3: total_headcount = planned_core_headcount + planned_seasonal_headcount + flex_draw
      step_4: base_cents   = round(planned_core_headcount     * shift_hours * RATE_CENTS_PER_HOUR.CORE)
                           + round(planned_seasonal_headcount * shift_hours * RATE_CENTS_PER_HOUR.SEASONAL)
                           + round(flex_draw                  * shift_hours * RATE_CENTS_PER_HOUR.FLEX)
              # per-class rounding to whole cents, THEN summed
      step_5: flex_ratio   = flex_draw / total_headcount        # exact rational; 0 when total_headcount == 0
      step_6: flex_premium_pct = 0.00 if flex_ratio <  0.20
                            else 0.05 if flex_ratio <  0.35
                            else 0.12
      step_7: planned_labor_cents = round(base_cents * (1 + flex_premium_pct))   # round_half_up to whole cents
      step_8: budget gate compares planned_labor_cents (post-premium) against labor_budget_cents
    input_set: "ShiftPlan.required_headcount, planned_core_headcount, planned_seasonal_headcount, shift_hours, and the flex draw that approve is about to reserve"
    constants:
      RATE_CENTS_PER_HOUR: { CORE: 2150, SEASONAL: 1875, FLEX: 2480 }
      FLEX_PREMIUM_TIER_1_MAX_RATIO: 0.20
      FLEX_PREMIUM_TIER_2_MAX_RATIO: 0.35
      FLEX_PREMIUM_PCT: { TIER_1: 0.00, TIER_2: 0.05, TIER_3: 0.12 }
    precision: "whole cents, round_half_up, applied per class line in step_4 and once more in step_7"

  - name: actual_labor_cost
    trigger: "POST /sortation/shift-plans/{id}/close; writes ShiftPlan.actual_labor_cents"
    algorithm: aggregation
    formula: |
      worked = [ (a.worked_hours, Worker[a.worker_id].hire_class)
                 for a in StaffAssignment where a.shift_plan_id == this plan
                                            and a.status == COMPLETED ]        # CHECKED_IN rows contribute 0
      base_cents = sum over worked of round(worked_hours * RATE_CENTS_PER_HOUR[hire_class])   # per-assignment rounding, then sum
      actual_flex_headcount = count(worked rows whose hire_class == FLEX) + flex_draw_count
      actual_total_headcount = count(worked rows) + flex_draw_count
      flex_ratio = actual_flex_headcount / actual_total_headcount   # 0 when actual_total_headcount == 0
      flex_premium_pct = same tier table as planned_labor_cost
      actual_labor_cents = round(base_cents * (1 + flex_premium_pct))
    input_set: "StaffAssignments of this plan with status == COMPLETED only; ASSIGNED, CHECKED_IN and NO_SHOW rows are excluded"
    constants:
      RATE_CENTS_PER_HOUR: { CORE: 2150, SEASONAL: 1875, FLEX: 2480 }
    precision: "whole cents, round_half_up per assignment line then once on the premium"

  - name: staffing_commitment_and_gap
    trigger: "recomputed at POST /sortation/shift-plans/{id}/approve, POST /sortation/staff-assignments, POST /sortation/staff-assignments/{id}/no-show and the Worker SEPARATED cascade; writes ShiftPlan.committed_headcount, staffing_gap and unfilled_gap"
    algorithm: aggregation
    formula: |
      committed_headcount = planned_core_headcount + planned_seasonal_headcount + flex_draw_count
                          - count(StaffAssignment of this plan with status == NO_SHOW)
      staffing_gap        = max(0, required_headcount - committed_headcount)
      unfilled_gap        = staffing_gap remaining after the L5 flex top-up of the no-show cascade
                            (0 whenever the plan is APPROVED)
      at-risk test: staffing_gap > AT_RISK_GAP_THRESHOLD flips APPROVED -> AT_RISK
      per-line cap: count(StaffAssignment on one line_chute_id with status != NO_SHOW) <= MAX_LINE_HEADCOUNT
      ergonomics cap: a new assignment requires Worker.consecutive_completed_shifts < MAX_CONSECUTIVE_SHIFTS
    input_set: "StaffAssignments of this plan; ASSIGNED, CHECKED_IN and COMPLETED rows all count as committed, only NO_SHOW rows subtract"
    constants:
      AT_RISK_GAP_THRESHOLD: 0
      MAX_LINE_HEADCOUNT: 22
      MAX_CONSECUTIVE_SHIFTS: 5
      REQUIRED_TRAINING_SESSIONS: 2
      JAM_RETRY_LIMIT: 3
    precision: "exact integers; staffing_gap never goes negative"

  - name: cost_per_package
    trigger: "PROVISIONAL at POST /sortation/shift-plans/{id}/approve; FINAL at POST /sortation/shift-plans/{id}/close"
    algorithm: forward_looking
    formula: |
      PROVISIONAL: numerator = planned_labor_cents + FIXED_OVERHEAD_CENTS_PER_SHIFT
                   denominator = forecast_volume
                   provisional_cost_per_package_cents = round(numerator / denominator, 2)
      FINAL:       rework_cents = missort_package_count * REWORK_CENTS_PER_MISSORT_PACKAGE
                   numerator = actual_labor_cents + FIXED_OVERHEAD_CENTS_PER_SHIFT + rework_cents
                   denominator = max(1, sorted_package_count - missort_package_count)
                   final_cost_per_package_cents = round(numerator / denominator, 2)
    input_set: "PROVISIONAL reads only planned fields and forecast_volume; FINAL reads actual_labor_cents, ShiftPlan.sorted_package_count (packages scanned while this plan was the attributed plan) and ShiftPlan.missort_package_count (sum of PackageException.package_count with exception_type == MISSORT and shift_plan_id == this plan, counted whether the exception is OPEN or RESOLVED)"
    constants:
      FIXED_OVERHEAD_CENTS_PER_SHIFT: 12000
      REWORK_CENTS_PER_MISSORT_PACKAGE: 35
    precision: "cents with 2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "written at approve, against forecast volume and planned headcount"
        difference: "numerator uses planned_labor_cents (planned headcount x standard rates, premium included) and NO rework; denominator is the full forecast_volume including packages that will later be mis-sorted"
      - name: FINAL
        when: "written at close, against actually worked hours and actually sorted packages"
        difference: "numerator uses actual_labor_cents (COMPLETED assignments only, so a no-show removes its hours) plus mis-sort rework; denominator nets mis-sorted packages OUT of sorted_package_count - the same shift therefore yields a different cents-per-package than PROVISIONAL"

  - name: attrition_risk_score
    trigger: "recomputed on every Worker mutation: POST /sortation/workers/{id}/onboarding-events, POST /sortation/staff-assignments/{id}/check-out, POST /sortation/staff-assignments/{id}/no-show; writes Worker.attrition_risk_score, attrition_risk_basis, attrition_flagged"
    algorithm: weighted_scoring
    formula: |
      tenure_days = floor((date(logical clock) - date(hire_date)) in whole days)
      bucket_base = 0.42 if tenure_days <= 14
               else 0.31 if tenure_days <= 45
               else 0.18 if tenure_days <= 120
               else 0.09
      class_adj = HIRE_CLASS_ATTRITION_ADJ[hire_class]
      observed_adj = 0.06 * no_show_count
                   + 0.05 * training_sessions_missed
                   - (0.04 if status == CERTIFIED else 0.00)
      if completed_assignment_count < MIN_OBSERVATION_ASSIGNMENTS:
          attrition_risk_basis  = COHORT_BASELINE
          attrition_risk_score  = round(min(0.95, bucket_base + class_adj), 4)          # observed_adj ignored
      else:
          attrition_risk_basis  = INDIVIDUAL_OBSERVED
          attrition_risk_score  = round(min(0.95, max(0.02, bucket_base + class_adj + observed_adj)), 4)
      attrition_flagged = attrition_risk_score >= ATTRITION_FLAG_THRESHOLD
    input_set: "the Worker's own counters plus the logical clock; no other worker's data enters the score"
    constants:
      TENURE_BUCKET_RISK: { D0_14: 0.42, D15_45: 0.31, D46_120: 0.18, D121_PLUS: 0.09 }
      HIRE_CLASS_ATTRITION_ADJ: { CORE: 0.00, SEASONAL: 0.12, FLEX: 0.07 }
      NO_SHOW_WEIGHT: 0.06
      MISSED_TRAINING_WEIGHT: 0.05
      CERTIFIED_CREDIT: 0.04
      MIN_OBSERVATION_ASSIGNMENTS: 3
      ATTRITION_FLAG_THRESHOLD: 0.55
      SCORE_CEILING: 0.95
      SCORE_FLOOR: 0.02
    precision: "4 decimal places, round_half_up"
    variants:
      - name: COHORT_BASELINE
        when: "completed_assignment_count < MIN_OBSERVATION_ASSIGNMENTS"
        difference: "uses only the cohort curve (tenure bucket + hire class); the worker's own no-shows, missed training and certification credit are all ignored"
      - name: INDIVIDUAL_OBSERVED
        when: "completed_assignment_count >= MIN_OBSERVATION_ASSIGNMENTS"
        difference: "adds observed_adj, so the identical worker record scores differently the moment the third assignment completes - upward when missed training dominates, downward when the CERTIFIED credit dominates"

  - name: cube_consumption
    trigger: "POST /sortation/outbound-loads/{id}/scan-packages; writes OutboundLoad.cube_used_cuft, cube_utilization_pct, package_count"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round each class line to 2 dp, THEN sum the lines,
      # THEN add to the stored total and round once more.
      line_cuft[c]   = round(count_c * CUFT_PER_PACKAGE[c], 2)      for c in {SMALL, MEDIUM, LARGE, OVERSIZED}
      batch_cuft     = line_cuft[SMALL] + line_cuft[MEDIUM] + line_cuft[LARGE] + line_cuft[OVERSIZED]
      cube_used_cuft = round(cube_used_cuft_before + batch_cuft, 2)
      # sum-then-round (round(sum(count_c * CUFT_PER_PACKAGE[c]), 2)) is NOT the contract:
      # at (1201 SMALL, 907 MEDIUM, 301 LARGE, 13 OVERSIZED) it yields 2775.09 instead of 2775.11.
      cube_utilization_pct = round(cube_used_cuft / trailer_cube_cuft * 100, 2)
      package_count = package_count_before + count_SMALL + count_MEDIUM + count_LARGE + count_OVERSIZED
      capacity gate: reject with ERR_TRAILER_CUBE_EXCEEDED when cube_used_cuft > trailer_cube_cuft
                     (equality is ACCEPTED - the comparison is strictly greater-than)
    input_set: "only the four class counts in this request body; omitted counts default to 0"
    constants:
      CUFT_PER_PACKAGE: { SMALL: 0.335, MEDIUM: 1.205, LARGE: 3.755, OVERSIZED: 11.505 }
    precision: "2 decimal places, round_half_up, applied per class line and then to the running total"

  - name: unload_sequence_ranking
    trigger: "POST /sortation/trailer-appointments/{id}/arrive and POST /sortation/trailer-appointments/{id}/start-unload; writes TrailerAppointment.unload_sequence_rank"
    algorithm: chronological
    formula: |
      candidates = TrailerAppointment where sort_center_id == this center AND status == ARRIVED
      sort candidates by, in order:
        1. PRIORITY_CLASS_RANK[priority_class]  ASC   (CRITICAL 0, EXPRESS 1, STANDARD 2, DEFERRED 3)
        2. window_start                          ASC
        3. manifest_package_count                DESC
        4. created_at                            ASC   (final tie-break; `id` is never used)
      unload_sequence_rank = 1-based position in that ordering
      every appointment leaving the ARRIVED set (start-unload) causes the remaining ARRIVED
      appointments to be re-ranked in the same request; appointments not in ARRIVED hold rank null
    input_set: "appointments of the same sort_center_id with status == ARRIVED; SCHEDULED, UNLOADING, JAM_HELD and UNLOADED appointments are excluded"
    constants:
      PRIORITY_CLASS_RANK: { CRITICAL: 0, EXPRESS: 1, STANDARD: 2, DEFERRED: 3 }
    precision: "integer rank starting at 1"

  - name: lane_pressure
    trigger: "recomputed whenever a ChuteAssignment of the lane changes status or backlog_package_count changes: the jam-hold cascade (L4), the resume-unload cascade, POST /sortation/chute-assignments, and the close cascade; writes DestinationLane.assigned_capacity_pph and lane_pressure_ratio"
    algorithm: aggregation
    formula: |
      assigned_capacity_pph = sum of SortChute.throughput_pph over chutes c such that
          there exists a ChuteAssignment a with a.destination_lane_id == this lane,
          a.chute_id == c.id and a.status == ACTIVE
        (each qualifying chute contributes its throughput once, even with two ACTIVE assignments)
      lane_pressure_ratio = round(backlog_package_count / max(1, assigned_capacity_pph), 4)
    input_set: "ChuteAssignments with status == ACTIVE only; SUSPENDED, SUPERSEDED and ENDED rows contribute no capacity"
    constants:
      CAPACITY_FLOOR: 1
    precision: "4 decimal places, round_half_up"

  - name: ops_posture_derivation
    trigger: "recomputed at the end of every request that mutates open_jam_count, open_serious_injury_count, a lane's lane_pressure_ratio, or automation_utilization_pct; writes SortCenter.ops_posture"
    algorithm: threshold
    formula: |
      open_jam_count            = count(TrailerAppointment of this center with status == JAM_HELD)
      open_serious_injury_count = count(InjuryReport of this center with severity == SERIOUS and status == OPEN)
      max_pressure              = max(lane_pressure_ratio over DestinationLane of this center with status == ACTIVE), 0 when there are none
      ops_posture =
          FROZEN     if open_serious_injury_count >= 1 OR open_jam_count >= JAM_FREEZE_THRESHOLD
          RESTRICTED if open_jam_count >= 1
                       OR max_pressure >= LANE_PRESSURE_RESTRICT_RATIO
                       OR automation_utilization_pct < AUTOMATION_RESTRICT_PCT
          OPEN       otherwise
      evaluation is top-down: the FROZEN test is applied before the RESTRICTED test
    input_set: "JAM_HELD appointments, OPEN SERIOUS injuries, and ACTIVE lanes of this center only"
    constants:
      JAM_FREEZE_THRESHOLD: 3
      LANE_PRESSURE_RESTRICT_RATIO: 1.50
      AUTOMATION_RESTRICT_PCT: 45
    precision: "enum, no rounding; the ratio comparison uses the already-rounded 4 dp lane_pressure_ratio"

  - name: attributed_shift_plan
    trigger: "POST /sortation/outbound-loads/{id}/scan-packages and POST /sortation/package-exceptions; selects the ShiftPlan that absorbs sorted_package_count / missort_package_count"
    algorithm: projection
    formula: |
      eligibility filter: ShiftPlan where sort_center_id == this center
                                     AND status IN {APPROVED, AT_RISK}
                                     AND shift_window_start <= logical clock < shift_window_end
      ranking expression:  shift_window_start ASC
      tie-break:           created_at ASC        (`id` is never used)
      empty-set fallback:  no plan is attributed; ShiftPlan counters are left untouched and the
                           request still succeeds (lane and center counters are always updated)
    input_set: "ShiftPlans of the same sort_center_id with status IN {APPROVED, AT_RISK} whose half-open window contains the logical clock"
    constants: {}
    precision: "single ShiftPlan or none"

  - name: reroute_chute_selection
    trigger: "POST /sortation/package-exceptions/{id}/resolve with resolution == REROUTE; writes PackageException.resolved_via_chute_id"
    algorithm: waterfall_allocation
    formula: |
      eligibility filter: ChuteAssignment a where a.destination_lane_id == to_destination_lane_id
                                            AND a.status == ACTIVE
                                            AND a.window_start <= logical clock < a.window_end
                                            AND SortChute[a.chute_id].status == ACTIVE
      ranking expression:  SortChute.throughput_pph DESC
      tie-break:           ChuteAssignment.created_at ASC     (`id` is never used)
      empty-set fallback:  ERR_NO_ELIGIBLE_CHUTE (422) - but only after the referential check
                           at validation priority 34 has confirmed the lane has at least one
                           ChuteAssignment row in ANY status
      resolved_via_chute_id = SortChute.id of the winning assignment
    input_set: "ChuteAssignments of the target lane with status == ACTIVE whose half-open window covers the logical clock and whose chute is ACTIVE (a CONGESTED chute is not eligible)"
    constants: {}
    precision: "single SortChute or the empty-pool error"

  - name: door_interval_conflict
    trigger: "POST /sortation/trailer-appointments; gates the create with ERR_DOOR_WINDOW_CONFLICT"
    algorithm: interval_merge
    formula: |
      occupied = TrailerAppointment where door_id == request door_id
                                     AND status IN {SCHEDULED, ARRIVED, UNLOADING, JAM_HELD}
      buffer_min = DockDoor.turnaround_buffer_min of that door
      conflict(new, existing) =
          new.window_start < existing.window_end   + buffer_min minutes
          AND
          existing.window_start < new.window_end   + buffer_min minutes
      reject when any existing row conflicts.
      Interval semantics: base intervals are half-open [window_start, window_end), and the
      buffer is inflated on BOTH sides, so exact adjacency (new.window_start == existing.window_end)
      is a CONFLICT while a gap of exactly buffer_min minutes is ACCEPTED (strict `<`).
    input_set: "appointments on the same door with status IN {SCHEDULED, ARRIVED, UNLOADING, JAM_HELD}; UNLOADED appointments free the door"
    constants:
      DEFAULT_TURNAROUND_BUFFER_MIN: 15
    precision: "whole minutes; comparisons are strict less-than"

  - name: chute_concurrency_capacity
    trigger: "POST /sortation/chute-assignments; gates the create with ERR_CHUTE_CONCURRENCY_EXCEEDED"
    algorithm: interval_merge
    formula: |
      existing = ChuteAssignment where chute_id == request chute_id AND status IN {ACTIVE, SUSPENDED}
                 (rows the supersede clause is about to retire are excluded from `existing`)
      overlaps(new, e) = new.window_start < e.window_end AND e.window_start < new.window_end
                         # half-open intervals, NO buffer: exact adjacency is NOT an overlap
      max_concurrency = 1 + max over instants t in [new.window_start, new.window_end) of
                        count(e in existing where overlaps at t)
      reject when max_concurrency > SortChute.max_concurrent_destinations
      Interval semantics: aggregate capacity over half-open intervals - two overlapping
      assignments are legal on a chute with max_concurrent_destinations == 2 and only the
      third simultaneous destination is refused; adjacency at a shared endpoint never counts.
    input_set: "ChuteAssignments on the same chute with status IN {ACTIVE, SUSPENDED}; SUPERSEDED and ENDED rows are excluded"
    constants:
      DEFAULT_MAX_CONCURRENT_DESTINATIONS: 2
    precision: "integer count of simultaneous destinations"

  - name: package_conservation_invariant
    trigger: "asserted after every request that moves packages: complete-unload, scan-packages, package-exception create, package-exception resolve"
    algorithm: aggregation
    formula: |
      SortCenter.packages_inducted_count
        == SortCenter.wip_package_count
         + SortCenter.exception_hold_count
         + SortCenter.disposed_package_count
         + sum(DestinationLane.sorted_package_count over ALL lanes of this center, any status)
      Package movements, each of which preserves the identity:
        complete-unload            : inducted += N ; wip += N
        scan-packages              : wip -= N      ; lane.sorted += N
        exception create (from lane): lane.sorted -= K ; exception_hold += K
        exception create (from WIP) : wip -= K         ; exception_hold += K
        resolve REROUTE            : exception_hold -= K ; target lane.sorted += K ; missort_corrected_count += K
        resolve DISPOSE            : exception_hold -= K ; disposed += K
        resolve RELABEL            : exception_hold -= K ; wip += K
    input_set: "all DestinationLanes of the center regardless of status, plus the four center-level package counters"
    constants: {}
    precision: "exact integers; the forward action (MISSORT exception create) and its compensating action (REROUTE resolve) must leave the identity unchanged"

  - name: flex_pool_conservation_invariant
    trigger: "asserted after every request that reserves or releases flex headcount: shift-plan approve, staff-assignment no-show (flex top-up), shift-plan close"
    algorithm: aggregation
    formula: |
      SortCenter.flex_pool_total == SortCenter.flex_pool_available + SortCenter.flex_pool_reserved
      and
      SortCenter.flex_pool_reserved == sum(ShiftPlan.flex_draw_count over plans of this center
                                          with status IN {APPROVED, AT_RISK})
      approve reserves flex_draw_count; the no-show top-up reserves an additional draw;
      close releases exactly flex_draw_count back to flex_pool_available.
    input_set: "ShiftPlans of the center with status IN {APPROVED, AT_RISK}; DRAFT, SUBMITTED, REJECTED and CLOSED plans hold no reservation"
    constants: {}
    precision: "exact integers; flex_pool_total never changes after create"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the called endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body shape: required fields present, enum values inside the declared enum, integers non-negative, percentages within 0..100, cube and count fields > 0, expected_*_version an integer when the endpoint declares it"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PATCH endpoints"

  - priority: 4
    category: existence
    check: "the SortCenter named by the path segment or by sort_center_id exists"
    error_id: ERR_SORT_CENTER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints that name a sort center by path or body"

  - priority: 5
    category: existence
    check: "referenced DockDoor, SortChute, DestinationLane and ChuteAssignment ids exist (validated left-to-right in the path, then in body-field declaration order)"
    error_id: ERR_FACILITY_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "PATCH /sortation/dock-doors/{id}, GET /sortation/sort-chutes/{id}, GET /sortation/destination-lanes/{id}, GET+POST /sortation/chute-assignments, POST /sortation/trailer-appointments, POST /sortation/staff-assignments, POST /sortation/outbound-loads, POST /sortation/injury-reports, POST /sortation/package-exceptions"

  - priority: 6
    category: existence
    check: "the referenced TrailerAppointment exists"
    error_id: ERR_TRAILER_APPOINTMENT_NOT_FOUND
    http_status: 404
    applies_to: "all /sortation/trailer-appointments/{id}... endpoints and POST /sortation/package-exceptions"

  - priority: 7
    category: existence
    check: "the referenced ShiftPlan exists"
    error_id: ERR_SHIFT_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "all /sortation/shift-plans/{id}... endpoints and POST /sortation/staff-assignments"

  - priority: 8
    category: existence
    check: "the referenced Worker or StaffAssignment exists"
    error_id: ERR_LABOR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "GET /sortation/workers/{id}, POST /sortation/workers/{id}/onboarding-events, all /sortation/staff-assignments/{id}... endpoints, POST /sortation/injury-reports"

  - priority: 9
    category: existence
    check: "the referenced OutboundLoad or PackageException exists"
    error_id: ERR_OUTBOUND_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all /sortation/outbound-loads/{id}... and /sortation/package-exceptions/{id}... endpoints"

  - priority: 10
    category: auth
    check: "when the acting role is Worker, X-User-ID equals StaffAssignment.worker_id of the targeted assignment"
    error_id: ERR_NOT_ASSIGNMENT_OWNER
    http_status: 403
    applies_to: "POST /sortation/staff-assignments/{id}/check-in, POST /sortation/staff-assignments/{id}/check-out"

  - priority: 11
    category: business_temporal
    check: "window_end is strictly after window_start; shift_window_end strictly after shift_window_start; dispatch_cut_time and occurred_at are parseable RFC3339 UTC timestamps"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /sortation/trailer-appointments, POST /sortation/chute-assignments, POST /sortation/sort-centers/{id}/shift-plans, POST /sortation/outbound-loads, POST /sortation/injury-reports"

  - priority: 12
    category: business_constraint
    check: "uniqueness within the owning scope: SortCenter.code globally; DockDoor.door_number, SortChute.chute_number and DestinationLane.lane_code per sort center; ShiftPlan.shift_date per sort center among plans with status != REJECTED"
    error_id: ERR_DUPLICATE_FACILITY_RESOURCE
    http_status: 409
    applies_to: "POST /sortation/sort-centers, POST /sortation/sort-centers/{id}/dock-doors, POST /sortation/sort-centers/{id}/sort-chutes, POST /sortation/sort-centers/{id}/destination-lanes, POST /sortation/sort-centers/{id}/shift-plans"

  - priority: 13
    category: business_constraint
    check: "trailer_code is unique per sort center among TrailerAppointments with status != UNLOADED and among OutboundLoads with load_status != DISPATCHED"
    error_id: ERR_DUPLICATE_TRAILER_CODE
    http_status: 409
    applies_to: "POST /sortation/trailer-appointments, POST /sortation/outbound-loads"

  - priority: 14
    category: state
    check: "the TrailerAppointment is in the from-state the requested transition declares in §1.2"
    error_id: ERR_INVALID_APPOINTMENT_STATE
    http_status: 409
    applies_to: "POST /sortation/trailer-appointments/{id}/arrive, /start-unload, /jam-hold, /resume-unload, /complete-unload"

  - priority: 15
    category: state
    check: "the ShiftPlan is in the from-state the requested transition declares in §1.2"
    error_id: ERR_INVALID_SHIFT_PLAN_STATE
    http_status: 409
    applies_to: "POST /sortation/shift-plans/{id}/submit, /approve, /reject, /revise, /close, POST /sortation/staff-assignments"

  - priority: 16
    category: state
    check: "the OutboundLoad's load_status and seal_status permit the requested transition per §1.2 (scan-packages requires STAGING or LOADING; close-load requires LOADING; seal requires load_status IN {LOADING, LOADED} with seal_status IN {UNSEALED, BROKEN}; dispatch requires LOADED)"
    error_id: ERR_INVALID_LOAD_STATE
    http_status: 409
    applies_to: "POST /sortation/outbound-loads/{id}/scan-packages, /close-load, /seal, /dispatch"

  - priority: 17
    category: state
    check: "the StaffAssignment is in the from-state the requested transition declares in §1.2"
    error_id: ERR_INVALID_ASSIGNMENT_STATE
    http_status: 409
    applies_to: "POST /sortation/staff-assignments/{id}/check-in, /check-out, /no-show"

  - priority: 18
    category: state
    check: "the PackageException is OPEN, and the referenced InjuryReport is OPEN when closing it"
    error_id: ERR_INVALID_EXCEPTION_STATE
    http_status: 409
    applies_to: "POST /sortation/package-exceptions/{id}/resolve, POST /sortation/injury-reports/{id}/close"

  - priority: 19
    category: state
    check: "expected_chute_version equals the current SortChute.version"
    error_id: ERR_STALE_CHUTE_VERSION
    http_status: 412
    applies_to: "POST /sortation/chute-assignments"

  - priority: 20
    category: state
    check: "expected_center_version equals the current SortCenter.version"
    error_id: ERR_STALE_CENTER_VERSION
    http_status: 412
    applies_to: "POST /sortation/shift-plans/{id}/approve, POST /sortation/shift-plans/{id}/close"

  - priority: 21
    category: auth
    check: "the X-User-ID approving or rejecting a ShiftPlan differs from ShiftPlan.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /sortation/shift-plans/{id}/approve, POST /sortation/shift-plans/{id}/reject"

  - priority: 22
    category: business_safety
    check: "the SortCenter's ops_posture is not FROZEN for package-moving and staffing-commitment operations (a frozen center still accepts jam recovery, injury closure and shift-plan closure)"
    error_id: ERR_CENTER_FROZEN
    http_status: 409
    applies_to: "POST /sortation/trailer-appointments/{id}/start-unload, POST /sortation/trailer-appointments/{id}/complete-unload, POST /sortation/outbound-loads/{id}/scan-packages, POST /sortation/outbound-loads/{id}/dispatch, POST /sortation/shift-plans/{id}/approve, POST /sortation/staff-assignments, POST /sortation/staff-assignments/{id}/check-in, POST /sortation/package-exceptions/{id}/resolve"

  - priority: 23
    category: business_safety
    check: "planned_core_headcount + planned_seasonal_headcount + the flex draw approve is about to reserve must not exceed MAX_LINE_HEADCOUNT (22) x the count of SortChutes with status IN {ACTIVE, CONGESTED}; at staff-assignment create the count of non-NO_SHOW assignments on one line_chute_id must not exceed MAX_LINE_HEADCOUNT"
    error_id: ERR_LINE_HEADCOUNT_EXCEEDED
    http_status: 422
    applies_to: "POST /sortation/shift-plans/{id}/approve, POST /sortation/staff-assignments"

  - priority: 24
    category: business_safety
    check: "the worker's consecutive_completed_shifts is below MAX_CONSECUTIVE_SHIFTS (5) before a new assignment is created, and the worker has no OPEN InjuryReport with severity IN {RECORDABLE, SERIOUS}"
    error_id: ERR_ERGONOMIC_ROTATION_REQUIRED
    http_status: 422
    applies_to: "POST /sortation/staff-assignments"

  - priority: 25
    category: business_safety
    check: "worker readiness: assignment create requires Worker.status IN {CLEARED, CERTIFIED}; check-in requires Worker.status == CERTIFIED; the CERTIFIED onboarding event requires training_sessions_completed >= REQUIRED_TRAINING_SESSIONS (2)"
    error_id: ERR_WORKER_NOT_CLEARED
    http_status: 409
    applies_to: "POST /sortation/staff-assignments, POST /sortation/staff-assignments/{id}/check-in, POST /sortation/workers/{id}/onboarding-events"

  - priority: 26
    category: business_constraint
    check: "the referenced DockDoor has status == ACTIVE and its kind matches the use (INBOUND for trailer appointments, OUTBOUND for outbound loads)"
    error_id: ERR_DOOR_OUT_OF_SERVICE
    http_status: 409
    applies_to: "POST /sortation/trailer-appointments, POST /sortation/outbound-loads"

  - priority: 27
    category: business_constraint
    check: "per calculation door_interval_conflict: the requested window, inflated by the door's turnaround_buffer_min on both sides, must not overlap any appointment on that door with status IN {SCHEDULED, ARRIVED, UNLOADING, JAM_HELD}"
    error_id: ERR_DOOR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /sortation/trailer-appointments"

  - priority: 28
    category: business_constraint
    check: "per calculation chute_concurrency_capacity: the instantaneous count of destinations held on the chute must not exceed SortChute.max_concurrent_destinations at any instant of the requested window"
    error_id: ERR_CHUTE_CONCURRENCY_EXCEEDED
    http_status: 409
    applies_to: "POST /sortation/chute-assignments"

  - priority: 29
    category: business_constraint
    check: "TrailerAppointment.jam_count is below JAM_RETRY_LIMIT (3) before recording another jam hold"
    error_id: ERR_JAM_RETRY_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /sortation/trailer-appointments/{id}/jam-hold"

  - priority: 30
    category: business_constraint
    check: "per calculation cube_consumption: the post-scan cube_used_cuft must not be strictly greater than trailer_cube_cuft (exact equality is accepted)"
    error_id: ERR_TRAILER_CUBE_EXCEEDED
    http_status: 422
    applies_to: "POST /sortation/outbound-loads/{id}/scan-packages"

  - priority: 31
    category: business_constraint
    check: "an exception's package_count must not exceed the pool it is drawn from: DestinationLane.sorted_package_count when from_destination_lane_id is given, otherwise SortCenter.wip_package_count"
    error_id: ERR_EXCEPTION_COUNT_EXCEEDS_SOURCE
    http_status: 422
    applies_to: "POST /sortation/package-exceptions"

  - priority: 32
    category: business_constraint
    check: "the OutboundLoad's seal_status is SEALED at dispatch"
    error_id: ERR_LOAD_NOT_SEALED
    http_status: 409
    applies_to: "POST /sortation/outbound-loads/{id}/dispatch"

  - priority: 33
    category: business_temporal
    check: "the logical clock is strictly before OutboundLoad.dispatch_cut_time at dispatch"
    error_id: ERR_DISPATCH_CUT_PASSED
    http_status: 422
    applies_to: "POST /sortation/outbound-loads/{id}/dispatch"

  - priority: 34
    category: business_referential
    check: "the destination lane involved in the operation has at least one ChuteAssignment row in any status (a lane that has never been mapped to a chute cannot receive packages)"
    error_id: ERR_LANE_NOT_ASSIGNED_TO_CHUTE
    http_status: 409
    applies_to: "POST /sortation/outbound-loads, POST /sortation/package-exceptions/{id}/resolve"

  - priority: 35
    category: business_referential
    check: "cross-center integrity: Worker.sort_center_id equals the ShiftPlan's sort_center_id; the chute, lane, door and appointment referenced by a request all belong to the same sort center as the target resource"
    error_id: ERR_WORKER_CENTER_MISMATCH
    http_status: 409
    applies_to: "POST /sortation/staff-assignments, POST /sortation/chute-assignments, POST /sortation/outbound-loads, POST /sortation/injury-reports"

  - priority: 36
    category: business_constraint
    check: "per calculation reroute_chute_selection: the eligible-chute pool for the target lane is non-empty (at least one ACTIVE assignment on an ACTIVE chute whose window covers the logical clock)"
    error_id: ERR_NO_ELIGIBLE_CHUTE
    http_status: 422
    applies_to: "POST /sortation/package-exceptions/{id}/resolve"

  - priority: 37
    category: business_fiscal
    check: "SortCenter.flex_pool_available covers the flex draw the operation needs (approve draws required_headcount minus planned core+seasonal; the no-show top-up draws 1)"
    error_id: ERR_FLEX_POOL_EXHAUSTED
    http_status: 409
    applies_to: "POST /sortation/shift-plans/{id}/approve, POST /sortation/staff-assignments/{id}/no-show"

  - priority: 38
    category: business_fiscal
    check: "per calculation planned_labor_cost: planned_labor_cents (premium included) must not exceed ShiftPlan.labor_budget_cents"
    error_id: ERR_LABOR_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /sortation/shift-plans/{id}/approve"

endpoints:
  # ---- test-driving clock (outside the business prefix, inside the scaffold contract)
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every timestamp comparison (appointment windows, chute-assignment windows, shift windows, dispatch cut times, tenure days) reads that default and never falls back to real wall-clock time."
    roles: [FacilityAdmin, InboundCoordinator, SortSupervisor, LaborPlanner, OpsManager]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects:
      - "logical clock set; no entity is mutated and no posture is recomputed"

  # ---- SortCenter
  - method: POST
    path: "/sortation/sort-centers"
    description: "Registers a sort center with its automation utilization and its flex staffing pool size."
    roles: [FacilityAdmin]
    code: 201
    input: [code, name, automation_utilization_pct, flex_pool_total]
    output: SortCenter
    side_effects:
      - "flex_pool_available = flex_pool_total; flex_pool_reserved = 0; all package and jam counters = 0; version = 1"
      - "ops_posture derived immediately by calculation ops_posture_derivation, so a center created with automation_utilization_pct < AUTOMATION_RESTRICT_PCT (45) is born RESTRICTED"
  - method: GET
    path: "/sortation/sort-centers"
    description: "Lists sort centers."
    roles: [FacilityAdmin, InboundCoordinator, SortSupervisor, LaborPlanner, OpsManager, Worker]
    code: 200
    input: ["code?", "ops_posture?", "limit?", "offset?"]
    output: SortCenter[]
    side_effects: []
  - method: GET
    path: "/sortation/sort-centers/{id}"
    description: "Reads one sort center, including ops_posture, the flex pool triple and the package conservation counters."
    roles: [FacilityAdmin, InboundCoordinator, SortSupervisor, LaborPlanner, OpsManager, Worker]
    code: 200
    input: []
    output: SortCenter
    side_effects: []
  - method: PATCH
    path: "/sortation/sort-centers/{id}"
    description: "Updates the center's automation utilization (an automation outage or a new sorter commissioning)."
    roles: [FacilityAdmin]
    code: 200
    input: [automation_utilization_pct]
    output: SortCenter
    side_effects:
      - "ops_posture recomputed by ops_posture_derivation; version += 1"
      - "the next required_headcount recomputation uses the new automation tier"

  # ---- DockDoor
  - method: POST
    path: "/sortation/sort-centers/{id}/dock-doors"
    description: "Adds an inbound or outbound dock door to a center."
    roles: [FacilityAdmin]
    code: 201
    input: [door_number, kind, "turnaround_buffer_min?"]
    output: DockDoor
    side_effects:
      - "turnaround_buffer_min defaults to 15 when omitted; status = ACTIVE"
  - method: GET
    path: "/sortation/sort-centers/{id}/dock-doors"
    description: "Lists the dock doors of a center (FK reverse reachability for DockDoor.sort_center_id)."
    roles: [FacilityAdmin, InboundCoordinator, SortSupervisor, LaborPlanner, OpsManager]
    code: 200
    input: ["kind?", "status?"]
    output: DockDoor[]
    side_effects: []
  - method: GET
    path: "/sortation/dock-doors/{id}"
    description: "Reads one dock door."
    roles: [FacilityAdmin, InboundCoordinator, SortSupervisor, LaborPlanner, OpsManager]
    code: 200
    input: []
    output: DockDoor
    side_effects: []
  - method: PATCH
    path: "/sortation/dock-doors/{id}"
    description: "Takes a door out of service or back into service, or retunes its turnaround buffer."
    roles: [FacilityAdmin]
    code: 200
    input: ["status?", "turnaround_buffer_min?"]
    output: DockDoor
    side_effects:
      - "version += 1; existing appointments on the door keep their windows but start-unload is refused while the door is OUT_OF_SERVICE"

  # ---- SortChute
  - method: POST
    path: "/sortation/sort-centers/{id}/sort-chutes"
    description: "Commissions a sortation chute (a line) with its rated throughput and its concurrent-destination limit."
    roles: [FacilityAdmin]
    code: 201
    input: [chute_number, throughput_pph, "max_concurrent_destinations?"]
    output: SortChute
    side_effects:
      - "max_concurrent_destinations defaults to 2; status = ACTIVE; jam_hold_count = 0; version = 1"
      - "line_count for calculation required_headcount increases, which raises the MIN_HEADCOUNT_PER_LINE floor"
  - method: GET
    path: "/sortation/sort-centers/{id}/sort-chutes"
    description: "Lists the chutes of a center (FK reverse reachability for SortChute.sort_center_id)."
    roles: [FacilityAdmin, InboundCoordinator, SortSupervisor, LaborPlanner, OpsManager]
    code: 200
    input: ["status?"]
    output: SortChute[]
    side_effects: []
  - method: GET
    path: "/sortation/sort-chutes/{id}"
    description: "Reads one chute, including its version (the OCC parent for chute-assignment creates) and jam_hold_count."
    roles: [FacilityAdmin, InboundCoordinator, SortSupervisor, LaborPlanner, OpsManager]
    code: 200
    input: []
    output: SortChute
    side_effects: []

  # ---- DestinationLane
  - method: POST
    path: "/sortation/sort-centers/{id}/destination-lanes"
    description: "Opens a destination lane with its hourly volume forecast."
    roles: [FacilityAdmin]
    code: 201
    input: [lane_code, region, service_class, forecast_hourly_volume]
    output: DestinationLane
    side_effects:
      - "status = ACTIVE; sorted_package_count = backlog_package_count = assigned_capacity_pph = 0; lane_pressure_ratio = 0.0000"
  - method: GET
    path: "/sortation/sort-centers/{id}/destination-lanes"
    description: "Lists the destination lanes of a center (FK reverse reachability for DestinationLane.sort_center_id)."
    roles: [FacilityAdmin, InboundCoordinator, SortSupervisor, LaborPlanner, OpsManager]
    code: 200
    input: ["status?", "service_class?"]
    output: DestinationLane[]
    side_effects: []
  - method: GET
    path: "/sortation/destination-lanes/{id}"
    description: "Reads one destination lane, including backlog_package_count, assigned_capacity_pph and lane_pressure_ratio."
    roles: [FacilityAdmin, InboundCoordinator, SortSupervisor, LaborPlanner, OpsManager]
    code: 200
    input: []
    output: DestinationLane
    side_effects: []
  - method: PATCH
    path: "/sortation/destination-lanes/{id}"
    description: "Closes or reopens a lane, or restates its hourly forecast."
    roles: [FacilityAdmin]
    code: 200
    input: ["status?", "forecast_hourly_volume?"]
    output: DestinationLane
    side_effects:
      - "lane_pressure_ratio recomputed by calculation lane_pressure; version += 1"
      - "SortCenter.ops_posture recomputed, because a CLOSED lane leaves the max-pressure input set"

  # ---- ChuteAssignment
  - method: POST
    path: "/sortation/chute-assignments"
    description: "Maps a destination lane onto a chute for a window. OCC parent is the SortChute. With supersede == true the prior ACTIVE assignment for the same chute and lane is retired at this assignment's window_start."
    roles: [SortSupervisor, FacilityAdmin]
    code: 201
    input: [chute_id, destination_lane_id, window_start, window_end, expected_chute_version, "supersede?"]
    output: ChuteAssignment
    side_effects:
      - "increments SortChute.version by 1"
      - "supersede == true: the prior ACTIVE assignment for the same (chute_id, destination_lane_id) flips ACTIVE -> SUPERSEDED with effective_window_end = the new window_start"
      - "DestinationLane.assigned_capacity_pph and lane_pressure_ratio recomputed by calculation lane_pressure for every lane whose assignment set changed"
      - "SortCenter.ops_posture recomputed; SortCenter.version += 1"
  - method: GET
    path: "/sortation/chute-assignments"
    description: "Lists chute assignments filtered by chute or by destination lane (FK reverse reachability for ChuteAssignment.chute_id and ChuteAssignment.destination_lane_id)."
    roles: [FacilityAdmin, InboundCoordinator, SortSupervisor, LaborPlanner, OpsManager]
    code: 200
    input: ["chute_id?", "destination_lane_id?", "status?", "limit?", "offset?"]
    output: ChuteAssignment[]
    side_effects: []
  - method: GET
    path: "/sortation/chute-assignments/{id}"
    description: "Reads one chute assignment, including status, suspended_reason and effective_window_end."
    roles: [FacilityAdmin, InboundCoordinator, SortSupervisor, LaborPlanner, OpsManager]
    code: 200
    input: []
    output: ChuteAssignment
    side_effects: []

  # ---- TrailerAppointment
  - method: POST
    path: "/sortation/trailer-appointments"
    description: "Schedules an inbound trailer onto an inbound dock door for a window."
    roles: [InboundCoordinator, FacilityAdmin]
    code: 201
    input: [sort_center_id, door_id, trailer_code, window_start, window_end, priority_class, manifest_package_count]
    output: TrailerAppointment
    side_effects:
      - "status = SCHEDULED; jam_count = 0; unload_sequence_rank = null"
      - "the door-buffer geometry of calculation door_interval_conflict is enforced against the door's other non-UNLOADED appointments"
  - method: GET
    path: "/sortation/trailer-appointments"
    description: "Lists trailer appointments filtered by center or door (FK reverse reachability for TrailerAppointment.sort_center_id and door_id)."
    roles: [FacilityAdmin, InboundCoordinator, SortSupervisor, LaborPlanner, OpsManager]
    code: 200
    input: ["sort_center_id?", "door_id?", "status?", "priority_class?", "limit?", "offset?"]
    output: TrailerAppointment[]
    side_effects: []
  - method: GET
    path: "/sortation/trailer-appointments/{id}"
    description: "Reads one trailer appointment, including unload_sequence_rank and jam_count."
    roles: [FacilityAdmin, InboundCoordinator, SortSupervisor, LaborPlanner, OpsManager]
    code: 200
    input: []
    output: TrailerAppointment
    side_effects: []
  - method: POST
    path: "/sortation/trailer-appointments/{id}/arrive"
    description: "Records trailer arrival at the yard and re-ranks the center's ARRIVED queue."
    roles: [InboundCoordinator]
    code: 200
    input: []
    output: TrailerAppointment
    side_effects:
      - "arrived_at = logical clock; status = ARRIVED"
      - "unload_sequence_rank recomputed by calculation unload_sequence_ranking for every ARRIVED appointment of the center"
  - method: POST
    path: "/sortation/trailer-appointments/{id}/start-unload"
    description: "Starts unloading the highest-priority arrived trailer at its door."
    roles: [InboundCoordinator]
    code: 200
    input: []
    output: TrailerAppointment
    side_effects:
      - "status = UNLOADING; the appointment leaves the ranked ARRIVED set and the remaining ARRIVED appointments are re-ranked"
  - method: POST
    path: "/sortation/trailer-appointments/{id}/jam-hold"
    description: "Records a line jam on a named chute during unload, running the depth-4 jam cascade."
    roles: [InboundCoordinator, SortSupervisor]
    code: 200
    input: [chute_id, jam_reason]
    output: TrailerAppointment
    side_effects:
      - "L1: status = JAM_HELD; jam_count += 1"
      - "L2: the named SortChute flips ACTIVE -> CONGESTED; jam_hold_count += 1; SortChute.version += 1"
      - "L3: every ACTIVE ChuteAssignment on that chute flips to SUSPENDED with suspended_reason = jam_reason"
      - "L4: each affected DestinationLane.backlog_package_count += its forecast_hourly_volume; assigned_capacity_pph and lane_pressure_ratio recomputed"
      - "L5: SortCenter.open_jam_count recomputed; ops_posture recomputed; SortCenter.version += 1"
  - method: POST
    path: "/sortation/trailer-appointments/{id}/resume-unload"
    description: "Clears the jam and resumes unloading; the compensating action of jam-hold."
    roles: [InboundCoordinator, SortSupervisor]
    code: 200
    input: [chute_id]
    output: TrailerAppointment
    side_effects:
      - "status = UNLOADING; jam_count is NOT decremented"
      - "the named SortChute flips CONGESTED -> ACTIVE; SortChute.version += 1"
      - "every SUSPENDED ChuteAssignment on that chute flips back to ACTIVE with suspended_reason = null"
      - "each affected DestinationLane.backlog_package_count = max(0, backlog - forecast_hourly_volume); capacity and pressure recomputed"
      - "SortCenter.open_jam_count recomputed; ops_posture recomputed; SortCenter.version += 1"
  - method: POST
    path: "/sortation/trailer-appointments/{id}/complete-unload"
    description: "Finishes the unload and inducts the manifest into work-in-process."
    roles: [InboundCoordinator]
    code: 200
    input: []
    output: TrailerAppointment
    side_effects:
      - "status = UNLOADED; unloaded_at = logical clock"
      - "SortCenter.packages_inducted_count += manifest_package_count; SortCenter.wip_package_count += manifest_package_count; SortCenter.version += 1"
      - "ops_posture recomputed; the door is freed for later appointments"

  # ---- ShiftPlan
  - method: POST
    path: "/sortation/sort-centers/{id}/shift-plans"
    description: "Drafts a labor plan for one shift of one center."
    roles: [LaborPlanner]
    code: 201
    input: [shift_date, shift_window_start, shift_window_end, forecast_volume, planned_core_headcount, planned_seasonal_headcount, labor_budget_cents]
    output: ShiftPlan
    side_effects:
      - "status = DRAFT; shift_hours computed from the window; required_headcount = 0 until submit"
      - "all committed/actual/cost fields = 0 or null"
  - method: GET
    path: "/sortation/sort-centers/{id}/shift-plans"
    description: "Lists the shift plans of a center (FK reverse reachability for ShiftPlan.sort_center_id)."
    roles: [FacilityAdmin, LaborPlanner, OpsManager, SortSupervisor]
    code: 200
    input: ["status?", "shift_date?"]
    output: ShiftPlan[]
    side_effects: []
  - method: GET
    path: "/sortation/shift-plans/{id}"
    description: "Reads one shift plan, including required_headcount, flex_draw_count, staffing_gap, unfilled_gap and both cost-per-package variants."
    roles: [FacilityAdmin, LaborPlanner, OpsManager, SortSupervisor, Worker]
    code: 200
    input: []
    output: ShiftPlan
    side_effects: []
  - method: POST
    path: "/sortation/shift-plans/{id}/submit"
    description: "Submits a draft plan for approval and freezes the headcount requirement."
    roles: [LaborPlanner]
    code: 200
    input: []
    output: ShiftPlan
    side_effects:
      - "status = SUBMITTED; submitted_by_user_id = X-User-ID"
      - "required_headcount computed by calculation required_headcount from the center's current automation tier, ops_posture and line count"
  - method: POST
    path: "/sortation/shift-plans/{id}/approve"
    description: "Approves a submitted plan, reserving the flex draw from the center pool and pricing the shift."
    roles: [OpsManager]
    code: 200
    input: [expected_center_version]
    output: ShiftPlan
    side_effects:
      - "increments SortCenter.version by 1"
      - "status = APPROVED; approved_by_user_id = X-User-ID"
      - "flex_draw_count set; SortCenter.flex_pool_available -= flex_draw_count; flex_pool_reserved += flex_draw_count"
      - "planned_labor_cents by calculation planned_labor_cost; provisional_cost_per_package_cents by calculation cost_per_package variant PROVISIONAL"
      - "committed_headcount and staffing_gap recomputed"
  - method: POST
    path: "/sortation/shift-plans/{id}/reject"
    description: "Rejects a submitted plan back to the planner."
    roles: [OpsManager]
    code: 200
    input: [rejection_reason]
    output: ShiftPlan
    side_effects:
      - "status = REJECTED; rejection_reason recorded"
      - "no flex reservation is taken and no cost field is written (divergent from the APPROVED branch)"
  - method: POST
    path: "/sortation/shift-plans/{id}/revise"
    description: "Returns a rejected plan to DRAFT, optionally restating volume, headcount or budget."
    roles: [LaborPlanner]
    code: 200
    input: ["forecast_volume?", "planned_core_headcount?", "planned_seasonal_headcount?", "labor_budget_cents?"]
    output: ShiftPlan
    side_effects:
      - "status = DRAFT; rejection_reason = null; submitted_by_user_id = null; required_headcount = 0"
      - "supplied fields overwrite the stored values; omitted fields keep their prior values"
  - method: POST
    path: "/sortation/shift-plans/{id}/close"
    description: "Closes an approved or at-risk plan, settling actual labor cost and releasing the flex reservation."
    roles: [OpsManager]
    code: 200
    input: [expected_center_version]
    output: ShiftPlan
    side_effects:
      - "increments SortCenter.version by 1"
      - "status = CLOSED; actual_labor_cents by calculation actual_labor_cost; final_cost_per_package_cents by calculation cost_per_package variant FINAL"
      - "SortCenter.flex_pool_available += flex_draw_count; flex_pool_reserved -= flex_draw_count"
      - "every ChuteAssignment of the center with status IN {ACTIVE, SUSPENDED} and window_end <= shift_window_end flips to ENDED; affected lanes recomputed"

  # ---- Worker
  - method: POST
    path: "/sortation/sort-centers/{id}/workers"
    description: "Hires an applicant into a center's core, seasonal or flex class."
    roles: [LaborPlanner]
    code: 201
    input: [full_name, hire_class, hire_date]
    output: Worker
    side_effects:
      - "status = APPLIED; all counters = 0"
      - "attrition_risk_score and attrition_risk_basis computed by calculation attrition_risk_score (basis COHORT_BASELINE at hire)"
  - method: GET
    path: "/sortation/sort-centers/{id}/workers"
    description: "Lists the workers of a center (FK reverse reachability for Worker.sort_center_id)."
    roles: [FacilityAdmin, LaborPlanner, OpsManager, SortSupervisor]
    code: 200
    input: ["status?", "hire_class?", "attrition_flagged?", "limit?", "offset?"]
    output: Worker[]
    side_effects: []
  - method: GET
    path: "/sortation/workers/{id}"
    description: "Reads one worker, including tenure_days, attrition_risk_score, attrition_risk_basis and attrition_flagged."
    roles: [FacilityAdmin, LaborPlanner, OpsManager, SortSupervisor, Worker]
    code: 200
    input: []
    output: Worker
    side_effects: []
  - method: POST
    path: "/sortation/workers/{id}/onboarding-events"
    description: "Records an onboarding, training, rest-day or separation event against a worker and re-scores attrition."
    roles: [LaborPlanner]
    code: 200
    input: [event_type]
    output: Worker
    side_effects:
      - "status transition per the Worker state machine; training and rest counters updated"
      - "attrition_risk_score, attrition_risk_basis and attrition_flagged recomputed"
      - "SEPARATED: every ASSIGNED StaffAssignment of this worker flips to NO_SHOW and the full no-show cascade runs for each affected plan"

  # ---- StaffAssignment
  - method: POST
    path: "/sortation/staff-assignments"
    description: "Assigns a cleared worker to a line for an approved shift plan."
    roles: [LaborPlanner, SortSupervisor]
    code: 201
    input: [shift_plan_id, worker_id, line_chute_id, role_on_line]
    output: StaffAssignment
    side_effects:
      - "status = ASSIGNED; worked_hours = 0"
      - "ShiftPlan.committed_headcount and staffing_gap recomputed"
  - method: GET
    path: "/sortation/staff-assignments"
    description: "Lists staff assignments filtered by plan, worker or line (FK reverse reachability for StaffAssignment.shift_plan_id, worker_id and line_chute_id)."
    roles: [FacilityAdmin, LaborPlanner, OpsManager, SortSupervisor, Worker]
    code: 200
    input: ["shift_plan_id?", "worker_id?", "line_chute_id?", "status?", "role_on_line?", "limit?", "offset?"]
    output: StaffAssignment[]
    side_effects: []
  - method: GET
    path: "/sortation/staff-assignments/{id}"
    description: "Reads one staff assignment, including checked_in_at, checked_out_at and worked_hours."
    roles: [FacilityAdmin, LaborPlanner, OpsManager, SortSupervisor, Worker]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: []
  - method: POST
    path: "/sortation/staff-assignments/{id}/check-in"
    description: "The assigned worker clocks in at the logical clock."
    roles: [Worker]
    code: 200
    input: []
    output: StaffAssignment
    side_effects:
      - "status = CHECKED_IN; checked_in_at = logical clock"
  - method: POST
    path: "/sortation/staff-assignments/{id}/check-out"
    description: "The assigned worker clocks out; worked_hours is settled and the worker's attrition basis may flip."
    roles: [Worker]
    code: 200
    input: []
    output: StaffAssignment
    side_effects:
      - "status = COMPLETED; checked_out_at = logical clock; worked_hours = round((checked_out_at - checked_in_at) / 3600, 2)"
      - "Worker.completed_assignment_count += 1; Worker.consecutive_completed_shifts += 1; attrition re-scored (basis flips to INDIVIDUAL_OBSERVED at the third completion)"
  - method: POST
    path: "/sortation/staff-assignments/{id}/no-show"
    description: "Marks an assigned worker as a no-show, running the plan/flex-pool cascade."
    roles: [LaborPlanner, SortSupervisor]
    code: 200
    input: []
    output: StaffAssignment
    side_effects:
      - "L1: status = NO_SHOW; Worker.no_show_count += 1"
      - "L2: worker attrition re-scored"
      - "L3: ShiftPlan.committed_headcount and staffing_gap recomputed"
      - "L4: APPROVED -> AT_RISK when staffing_gap > AT_RISK_GAP_THRESHOLD"
      - "L5: flex top-up draw = min(staffing_gap, SortCenter.flex_pool_available); flex_draw_count += draw; pool moved from available to reserved; unfilled_gap set; SortCenter.version += 1"
      - "L6: AT_RISK -> APPROVED when the top-up closed the gap"

  # ---- OutboundLoad
  - method: POST
    path: "/sortation/outbound-loads"
    description: "Stages an outbound trailer at an outbound door for one destination lane, with its cube and its dispatch cut time."
    roles: [SortSupervisor]
    code: 201
    input: [sort_center_id, door_id, destination_lane_id, trailer_code, trailer_cube_cuft, dispatch_cut_time]
    output: OutboundLoad
    side_effects:
      - "load_status = STAGING; seal_status = UNSEALED; cube_used_cuft = 0; cube_utilization_pct = 0.00; package_count = 0"
  - method: GET
    path: "/sortation/outbound-loads"
    description: "Lists outbound loads filtered by center, door or destination lane (FK reverse reachability for OutboundLoad.sort_center_id, door_id and destination_lane_id)."
    roles: [FacilityAdmin, InboundCoordinator, SortSupervisor, OpsManager, LaborPlanner]
    code: 200
    input: ["sort_center_id?", "door_id?", "destination_lane_id?", "load_status?", "seal_status?", "limit?", "offset?"]
    output: OutboundLoad[]
    side_effects: []
  - method: GET
    path: "/sortation/outbound-loads/{id}"
    description: "Reads one outbound load, including cube_used_cuft, cube_utilization_pct, both status dimensions and seal_code."
    roles: [FacilityAdmin, InboundCoordinator, SortSupervisor, OpsManager, LaborPlanner]
    code: 200
    input: []
    output: OutboundLoad
    side_effects: []
  - method: POST
    path: "/sortation/outbound-loads/{id}/scan-packages"
    description: "Scans a batch of packages by size class into the load; consumes cube and moves packages from work-in-process to the destination lane."
    roles: [SortSupervisor]
    code: 200
    input: ["small_count?", "medium_count?", "large_count?", "oversized_count?"]
    output: OutboundLoad
    side_effects:
      - "load_status STAGING -> LOADING on the first scan; LOADING -> LOADING afterwards"
      - "cube_used_cuft, cube_utilization_pct and package_count updated by calculation cube_consumption"
      - "SortCenter.wip_package_count -= scanned; DestinationLane.sorted_package_count += scanned; SortCenter.version += 1"
      - "ShiftPlan.sorted_package_count += scanned for the plan chosen by selector attributed_shift_plan, or no plan when the selector's pool is empty"
      - "SortCenter.ops_posture recomputed"
  - method: POST
    path: "/sortation/outbound-loads/{id}/close-load"
    description: "Stops loading the trailer and freezes its cube utilization."
    roles: [SortSupervisor]
    code: 200
    input: []
    output: OutboundLoad
    side_effects:
      - "load_status = LOADED; cube_utilization_pct refreshed; seal_status untouched"
  - method: POST
    path: "/sortation/outbound-loads/{id}/seal"
    description: "Seals (or re-seals) the trailer; independent of the load_status dimension."
    roles: [SortSupervisor]
    code: 200
    input: [seal_code]
    output: OutboundLoad
    side_effects:
      - "seal_status = SEALED; seal_code recorded; load_status unchanged"
  - method: POST
    path: "/sortation/outbound-loads/{id}/dispatch"
    description: "Dispatches a sealed, closed trailer before its cut time."
    roles: [OpsManager]
    code: 200
    input: []
    output: OutboundLoad
    side_effects:
      - "load_status = DISPATCHED; dispatched_at = logical clock"

  # ---- PackageException
  - method: POST
    path: "/sortation/package-exceptions"
    description: "Records a damaged, unlabeled, oversized or mis-sorted package group and moves it into exception hold."
    roles: [SortSupervisor, InboundCoordinator]
    code: 201
    input: [sort_center_id, exception_type, package_count, "from_destination_lane_id?", "outbound_load_id?", "trailer_appointment_id?"]
    output: PackageException
    side_effects:
      - "status = OPEN; SortCenter.exception_hold_count += package_count; SortCenter.version += 1"
      - "the source pool is debited: DestinationLane.sorted_package_count -= package_count when from_destination_lane_id is given, otherwise SortCenter.wip_package_count -= package_count"
      - "shift_plan_id set by selector attributed_shift_plan; a MISSORT exception therefore lands on that plan's missort_package_count"
      - "when outbound_load_id is given and that load's seal_status == SEALED, the load flips SEALED -> BROKEN and seal_code = null"
      - "SortCenter.ops_posture recomputed"
  - method: GET
    path: "/sortation/package-exceptions"
    description: "Lists package exceptions filtered by any of their foreign keys (FK reverse reachability for PackageException.sort_center_id, from_destination_lane_id, to_destination_lane_id, outbound_load_id, trailer_appointment_id, shift_plan_id and resolved_via_chute_id)."
    roles: [FacilityAdmin, InboundCoordinator, SortSupervisor, OpsManager, LaborPlanner]
    code: 200
    input: ["sort_center_id?", "from_destination_lane_id?", "to_destination_lane_id?", "outbound_load_id?", "trailer_appointment_id?", "shift_plan_id?", "resolved_via_chute_id?", "exception_type?", "status?", "limit?", "offset?"]
    output: PackageException[]
    side_effects: []
  - method: GET
    path: "/sortation/package-exceptions/{id}"
    description: "Reads one package exception, including resolution and resolved_via_chute_id."
    roles: [FacilityAdmin, InboundCoordinator, SortSupervisor, OpsManager, LaborPlanner]
    code: 200
    input: []
    output: PackageException
    side_effects: []
  - method: POST
    path: "/sortation/package-exceptions/{id}/resolve"
    description: "Resolves an open exception by rerouting to another lane, disposing the packages, or relabeling them back into work-in-process."
    roles: [SortSupervisor]
    code: 200
    input: [resolution, "to_destination_lane_id?"]
    output: PackageException
    side_effects:
      - "status = RESOLVED; resolved_at = logical clock; SortCenter.exception_hold_count -= package_count; SortCenter.version += 1"
      - "REROUTE: target DestinationLane.sorted_package_count += package_count; SortCenter.missort_corrected_count += package_count; resolved_via_chute_id = the chute chosen by selector reroute_chute_selection"
      - "DISPOSE: SortCenter.disposed_package_count += package_count"
      - "RELABEL: SortCenter.wip_package_count += package_count"
      - "SortCenter.ops_posture recomputed"

  # ---- InjuryReport
  - method: POST
    path: "/sortation/injury-reports"
    description: "Files an injury report against a worker, optionally naming the chute the injury occurred on."
    roles: [SortSupervisor, OpsManager]
    code: 201
    input: [sort_center_id, worker_id, severity, body_part, occurred_at, "chute_id?"]
    output: InjuryReport
    side_effects:
      - "status = OPEN; lost_time_days = 0"
      - "SortCenter.open_serious_injury_count recomputed; ops_posture recomputed (a SERIOUS injury freezes the center); SortCenter.version += 1"
  - method: GET
    path: "/sortation/injury-reports"
    description: "Lists injury reports filtered by center, worker or chute (FK reverse reachability for InjuryReport.sort_center_id, worker_id and chute_id)."
    roles: [FacilityAdmin, SortSupervisor, OpsManager, LaborPlanner]
    code: 200
    input: ["sort_center_id?", "worker_id?", "chute_id?", "severity?", "status?", "limit?", "offset?"]
    output: InjuryReport[]
    side_effects: []
  - method: GET
    path: "/sortation/injury-reports/{id}"
    description: "Reads one injury report."
    roles: [FacilityAdmin, SortSupervisor, OpsManager, LaborPlanner]
    code: 200
    input: []
    output: InjuryReport
    side_effects: []
  - method: POST
    path: "/sortation/injury-reports/{id}/close"
    description: "Closes an injury report and records lost time, which may thaw the center's posture."
    roles: [OpsManager]
    code: 200
    input: [lost_time_days]
    output: InjuryReport
    side_effects:
      - "status = CLOSED; lost_time_days recorded"
      - "SortCenter.open_serious_injury_count recomputed; ops_posture recomputed by ops_posture_derivation; SortCenter.version += 1"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, value outside a declared enum, negative count, percentage outside 0..100, non-positive trailer_cube_cuft, or non-integer expected_*_version"
  - id: ERR_SORT_CENTER_NOT_FOUND
    http: 404
    condition: "the sort center named by the path or by sort_center_id does not exist"
  - id: ERR_FACILITY_RESOURCE_NOT_FOUND
    http: 404
    condition: "a referenced DockDoor, SortChute, DestinationLane or ChuteAssignment does not exist"
  - id: ERR_TRAILER_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "the referenced TrailerAppointment does not exist"
  - id: ERR_SHIFT_PLAN_NOT_FOUND
    http: 404
    condition: "the referenced ShiftPlan does not exist"
  - id: ERR_LABOR_RESOURCE_NOT_FOUND
    http: 404
    condition: "the referenced Worker or StaffAssignment does not exist"
  - id: ERR_OUTBOUND_RESOURCE_NOT_FOUND
    http: 404
    condition: "the referenced OutboundLoad or PackageException does not exist"
  - id: ERR_NOT_ASSIGNMENT_OWNER
    http: 403
    condition: "a Worker acts on a StaffAssignment whose worker_id differs from the caller's X-User-ID"
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "window_end is not strictly after window_start, or a supplied timestamp is not a parseable RFC3339 UTC instant"
  - id: ERR_DUPLICATE_FACILITY_RESOURCE
    http: 409
    condition: "duplicate SortCenter.code, duplicate door_number / chute_number / lane_code within a center, or a second non-REJECTED ShiftPlan for the same center and shift_date"
  - id: ERR_DUPLICATE_TRAILER_CODE
    http: 409
    condition: "trailer_code already in use at the center by a TrailerAppointment that is not UNLOADED or by an OutboundLoad that is not DISPATCHED"
  - id: ERR_INVALID_APPOINTMENT_STATE
    http: 409
    condition: "the TrailerAppointment is not in the from-state the requested transition needs"
  - id: ERR_INVALID_SHIFT_PLAN_STATE
    http: 409
    condition: "the ShiftPlan is not in the from-state the requested transition needs, or a staff assignment is created against a plan that is not APPROVED or AT_RISK"
  - id: ERR_INVALID_LOAD_STATE
    http: 409
    condition: "the OutboundLoad's load_status or seal_status does not permit the requested transition (scanning a LOADED load, closing a STAGING load, sealing a STAGING load, dispatching an already DISPATCHED load)"
  - id: ERR_INVALID_ASSIGNMENT_STATE
    http: 409
    condition: "the StaffAssignment is not in the from-state the requested transition needs (checking in twice, checking out before check-in, or marking a completed assignment as a no-show)"
  - id: ERR_INVALID_EXCEPTION_STATE
    http: 409
    condition: "resolving an already RESOLVED PackageException, or closing an already CLOSED InjuryReport"
  - id: ERR_STALE_CHUTE_VERSION
    http: 412
    condition: "expected_chute_version does not equal the current SortChute.version"
  - id: ERR_STALE_CENTER_VERSION
    http: 412
    condition: "expected_center_version does not equal the current SortCenter.version"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID approving or rejecting a ShiftPlan equals ShiftPlan.submitted_by_user_id"
  - id: ERR_CENTER_FROZEN
    http: 409
    condition: "a package-moving or staffing-commitment operation is attempted while SortCenter.ops_posture == FROZEN"
  - id: ERR_LINE_HEADCOUNT_EXCEEDED
    http: 422
    condition: "the plan's committed bodies exceed MAX_LINE_HEADCOUNT x line_count at approve, or one line exceeds MAX_LINE_HEADCOUNT at staff-assignment create"
  - id: ERR_ERGONOMIC_ROTATION_REQUIRED
    http: 422
    condition: "the worker already has MAX_CONSECUTIVE_SHIFTS consecutive completed shifts with no REST_DAY_RECORDED, or has an OPEN RECORDABLE/SERIOUS injury"
  - id: ERR_WORKER_NOT_CLEARED
    http: 409
    condition: "the worker is not CLEARED/CERTIFIED for assignment, is not CERTIFIED at check-in, or has fewer than REQUIRED_TRAINING_SESSIONS completed sessions at certification"
  - id: ERR_DOOR_OUT_OF_SERVICE
    http: 409
    condition: "the referenced DockDoor has status == OUT_OF_SERVICE, or its kind does not match the requested use"
  - id: ERR_DOOR_WINDOW_CONFLICT
    http: 409
    condition: "the requested appointment window, inflated by the door's turnaround_buffer_min on both sides, overlaps a live appointment on that door"
  - id: ERR_CHUTE_CONCURRENCY_EXCEEDED
    http: 409
    condition: "the chute would hold more simultaneous destinations than max_concurrent_destinations at some instant of the requested window"
  - id: ERR_JAM_RETRY_LIMIT_REACHED
    http: 409
    condition: "a jam hold is recorded on an appointment whose jam_count already equals JAM_RETRY_LIMIT"
  - id: ERR_TRAILER_CUBE_EXCEEDED
    http: 422
    condition: "the scanned batch would push cube_used_cuft strictly above trailer_cube_cuft"
  - id: ERR_EXCEPTION_COUNT_EXCEEDS_SOURCE
    http: 422
    condition: "the exception's package_count exceeds the lane's sorted_package_count (or the center's wip_package_count when no source lane is given)"
  - id: ERR_LOAD_NOT_SEALED
    http: 409
    condition: "dispatch is attempted while seal_status is UNSEALED or BROKEN"
  - id: ERR_DISPATCH_CUT_PASSED
    http: 422
    condition: "the logical clock is at or after the load's dispatch_cut_time when dispatch is attempted"
  - id: ERR_LANE_NOT_ASSIGNED_TO_CHUTE
    http: 409
    condition: "the destination lane has never had a ChuteAssignment in any status"
  - id: ERR_WORKER_CENTER_MISMATCH
    http: 409
    condition: "a referenced worker, chute, lane, door or appointment belongs to a different sort center than the target resource"
  - id: ERR_NO_ELIGIBLE_CHUTE
    http: 422
    condition: "the lane has chute assignments but none is ACTIVE on an ACTIVE chute with a window covering the logical clock"
  - id: ERR_FLEX_POOL_EXHAUSTED
    http: 409
    condition: "SortCenter.flex_pool_available is smaller than the flex draw the operation needs"
  - id: ERR_LABOR_BUDGET_EXCEEDED
    http: 402
    condition: "planned_labor_cents including the flex premium exceeds the plan's labor_budget_cents"

roles:
  - name: FacilityAdmin
    description: "Owns the physical surface of the building: centers, dock doors, chutes, destination lanes and automation utilization."
    identity: opaque
    exclusive_operations:
      - "POST /sortation/sort-centers"
      - "PATCH /sortation/sort-centers/{id}"
      - "POST /sortation/sort-centers/{id}/dock-doors"
      - "PATCH /sortation/dock-doors/{id}"
      - "POST /sortation/sort-centers/{id}/sort-chutes"
      - "POST /sortation/sort-centers/{id}/destination-lanes"
      - "PATCH /sortation/destination-lanes/{id}"
    shared_operations:
      - "POST /sortation/chute-assignments (with SortSupervisor)"
      - "POST /sortation/trailer-appointments (with InboundCoordinator)"
      - "POST /_clock/set_current_utc (with every role)"
      - "all GET endpoints"
  - name: InboundCoordinator
    description: "Runs the inbound yard and the unload sequence: arrivals, unload starts, jam holds and induction."
    identity: opaque
    exclusive_operations:
      - "POST /sortation/trailer-appointments/{id}/arrive"
      - "POST /sortation/trailer-appointments/{id}/start-unload"
      - "POST /sortation/trailer-appointments/{id}/complete-unload"
    shared_operations:
      - "POST /sortation/trailer-appointments (with FacilityAdmin)"
      - "POST /sortation/trailer-appointments/{id}/jam-hold (with SortSupervisor)"
      - "POST /sortation/trailer-appointments/{id}/resume-unload (with SortSupervisor)"
      - "POST /sortation/package-exceptions (with SortSupervisor)"
      - "POST /_clock/set_current_utc"
      - "GET endpoints other than the worker and shift-plan sub-resources"
  - name: SortSupervisor
    description: "Runs the sort floor and the outbound dock: chute assignments, scanning, sealing, exception resolution."
    identity: opaque
    exclusive_operations:
      - "POST /sortation/outbound-loads"
      - "POST /sortation/outbound-loads/{id}/scan-packages"
      - "POST /sortation/outbound-loads/{id}/close-load"
      - "POST /sortation/outbound-loads/{id}/seal"
      - "POST /sortation/package-exceptions/{id}/resolve"
    shared_operations:
      - "POST /sortation/chute-assignments (with FacilityAdmin)"
      - "POST /sortation/trailer-appointments/{id}/jam-hold (with InboundCoordinator)"
      - "POST /sortation/trailer-appointments/{id}/resume-unload (with InboundCoordinator)"
      - "POST /sortation/package-exceptions (with InboundCoordinator)"
      - "POST /sortation/staff-assignments (with LaborPlanner)"
      - "POST /sortation/staff-assignments/{id}/no-show (with LaborPlanner)"
      - "POST /sortation/injury-reports (with OpsManager)"
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"
  - name: LaborPlanner
    description: "Builds shift plans, hires and onboards workers, and staffs the lines. Never approves its own plan."
    identity: opaque
    exclusive_operations:
      - "POST /sortation/sort-centers/{id}/shift-plans"
      - "POST /sortation/shift-plans/{id}/submit"
      - "POST /sortation/shift-plans/{id}/revise"
      - "POST /sortation/sort-centers/{id}/workers"
      - "POST /sortation/workers/{id}/onboarding-events"
    shared_operations:
      - "POST /sortation/staff-assignments (with SortSupervisor)"
      - "POST /sortation/staff-assignments/{id}/no-show (with SortSupervisor)"
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"
  - name: OpsManager
    description: "Holds the money and the safety authority: plan approval/rejection/closure, dispatch release, injury closure."
    identity: opaque
    exclusive_operations:
      - "POST /sortation/shift-plans/{id}/approve"
      - "POST /sortation/shift-plans/{id}/reject"
      - "POST /sortation/shift-plans/{id}/close"
      - "POST /sortation/outbound-loads/{id}/dispatch"
      - "POST /sortation/injury-reports/{id}/close"
    shared_operations:
      - "POST /sortation/injury-reports (with SortSupervisor)"
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"
  - name: Worker
    description: "An hourly associate acting as itself; X-User-ID is the Worker.id. Can only clock in and out of its own assignments."
    identity: "entity_backed:Worker"
    exclusive_operations:
      - "POST /sortation/staff-assignments/{id}/check-in"
      - "POST /sortation/staff-assignments/{id}/check-out"
    shared_operations:
      - "GET /sortation/staff-assignments, GET /sortation/staff-assignments/{id}, GET /sortation/workers/{id}, GET /sortation/shift-plans/{id}, GET /sortation/sort-centers, GET /sortation/sort-centers/{id}"
