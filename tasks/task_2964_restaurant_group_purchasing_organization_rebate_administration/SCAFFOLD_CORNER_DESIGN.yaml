            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45 }
