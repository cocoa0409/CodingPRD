            - "GET /matches/${mt2_id} with an empty X-User-ID returns 401 with the same code - reads carry the authentication gate too, and priority 1 is consulted before the endpoint's role list"
            - "the request that carries a valid role, an unknown actor id, an unknown match in the path and an unknown team in the body returns 403 with data.error_id == 'ERR_UNKNOWN_ACTOR' - priority 3 runs ahead of both existence checks, even though three things are wrong"
            - "with the actor repaired but the path match still unknown, the same request returns 404 with data.error_id == 'ERR_MATCH_NOT_FOUND', not ERR_TEAM_NOT_FOUND - priority 4 resolves path parameters before priority 5 looks at the body"
            - "with the path repaired and both team_id and a slot membership_id unknown, the request returns 404 with data.error_id == 'ERR_TEAM_NOT_FOUND' - priority 5 resolves body ids in declaration order, and team_id is declared before slots"
