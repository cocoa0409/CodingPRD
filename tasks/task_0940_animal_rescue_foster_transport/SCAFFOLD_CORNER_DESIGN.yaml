              captures: { org_id: $.data.id }
            - call: "POST /rescue/persons"
              payload: { full_name: "Gil Marsh", email: "gil@example.test" }
              as: PlatformAdmin
              captures: { donor_id: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "Pixel", species: "CAT", size_class: "SMALL", weight_lb: 9.0, date_of_birth: "2024-01-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
