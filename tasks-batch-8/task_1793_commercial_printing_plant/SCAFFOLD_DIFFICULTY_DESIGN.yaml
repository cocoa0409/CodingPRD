            - "After complete: PaperLot consumed_sheets == 4000 and reserved_sheets == 0 (excess 3000 beyond reservation drawn FIFO)"
            - "PaperStock.${stock}.available_sheets == 4000"
            - "Exactly 1 AUTO_REPLENISH PaperPurchaseOrder exists with ordered_sheets == 20000 and status == ORDERED"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: expired_estimate_beats_credit_hold
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_ESTIMATE_EXPIRED]
          - errors[ERR_CREDIT_HOLD]
        distinguishing_aspect: |
          Error-category pair business_temporal (priority 8) vs business_fiscal
          (priority 10): an accept attempted when the estimate is past expires_at
          AND the customer is in CREDIT_HOLD MUST fail with ERR_ESTIMATE_EXPIRED
          (and transition the estimate to EXPIRED), never ERR_CREDIT_HOLD.
        test_recipe:
          setup:
            - "Customer with credit_limit_cents 100; estimate E1 (total 85000) accepted -> exposure 85000 > 100 -> posture CREDIT_HOLD"
            - "Estimate E2 for the same customer QUOTED at clock 2026-08-01 (expires 2026-08-31T00:00:00Z); clock then advanced to 2026-09-01"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Low Limit", credit_limit_cents: 100, default_tolerance_pct: 5 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /paper-stocks", payload: { name: "70U", grade: "UNCOATED", cost_per_sheet_cents: 5, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "E1", quantity_ordered: 1000, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "A", pages: 8, up_count: 1, paper_stock_id: "${stock}", make_ready_cents: 50000, rate_per_thousand_cents: 30000 } ], press_spoilage_pct: 0, bindery_spoilage_pct: 0, quote_valid_days: 30, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { e1: $.data.id } }
            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "E2", quantity_ordered: 1000, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "A", pages: 8, up_count: 1, paper_stock_id: "${stock}", make_ready_cents: 50000, rate_per_thousand_cents: 30000 } ], press_spoilage_pct: 0, bindery_spoilage_pct: 0, quote_valid_days: 30, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { e2: $.data.id } }
            - { call: "POST /estimates/${e1}/quote", payload: {}, as: Estimator }
            - { call: "POST /estimates/${e2}/quote", payload: {}, as: Estimator }
            - { call: "POST /estimates/${e1}/accept", payload: {}, as: Customer, as_user_id: "${cust}", captures: { j1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /estimates/${e2}/accept", payload: {}, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ESTIMATE_EXPIRED (temporal priority 8 beats fiscal priority 10)"
            - "Estimate.${e2}.status == EXPIRED"
            - "Customer.${cust}.posture == CREDIT_HOLD (fiscal violation also existed and lost)"

      - name: gang_ineligibility_beats_due_window
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_GANG_INELIGIBLE_JOB]
          - errors[ERR_GANG_DUE_WINDOW_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair business_referential (priority 7) vs
          business_temporal (priority 8) — a different pair than
          expired_estimate_beats_credit_hold: adding a member whose press_type
