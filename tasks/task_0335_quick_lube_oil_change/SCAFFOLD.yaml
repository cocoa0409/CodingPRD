    path: "/queue-tickets"
    description: "List the queue; filter by shop_id, status, vehicle_id, requested_package_id (ordered by queue_seq ASC)"
    roles: [ShopManager, ServiceAdvisor, Technician]
    code: 200
    input: ["shop_id?", "status?", "vehicle_id?", "requested_package_id?", "limit?", "offset?"]
    output: "QueueTicket[]"
