        distinguishing_aspect: "From INITIATED the ONLY outbound trigger is docs action=REQUEST; SUBMIT, FILE, APPROVE and DENY are all off-graph and must all yield ERR_VISA_STATE_INVALID (409). This is the ordering-sensitive half of the RFE cycle: SUBMIT is a legal trigger in DOCS_REQUESTED and only there."
        test_recipe:
          setup: ["An invited residency for an FR applicant, so the create cascade opened a VisaCase in INITIATED. The residency is SCHEDULED with session_start_date 2027-02-01."]
          setup_api_calls:
