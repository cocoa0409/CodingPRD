  # ===========================================================================
  - section: complexity_layers
    instances:

      - name: occ_correct_version_succeeds_and_bumps
        claim_type: "optimistic_concurrency"
        grounds:
          - concurrency_rules[allocation-create-stale-spec]
          - endpoints.POST_/crayon-works/retail-allocations
        distinguishing_aspect: "The happy path of the OCC rule: a create carrying the spec's current version succeeds (201), and the success itself increments AssortmentSpec.version by exactly 1 — which is what makes the next stale writer fail deterministically."
        test_recipe:
          setup:
            - "Color Cerulean ACTIVE; spec ACTIVE at version 1 (captured)."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_camp
            - *k_open
            - *k_epoch
            - *k_pass
            - *k_close
            - *k_epoch
            - *k_spec
            - call: "GET /crayon-works/assortment-specs/${spec_id}"
              payload: {}
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { spec_v: $.data.version }
          trigger:
            - call: "POST /crayon-works/retail-allocations"
              payload: { assortment_spec_id: "${spec_id}", retailer_name: "MegaMart", priority_tier: PLATINUM, requested_boxes: 10, requested_ship_date: "2027-07-15T00:00:00Z", expected_assortment_spec_version: "${spec_v}" }
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { a1_id: $.data.id }
          assert:
            - "the response status is 201 and RetailAllocation.${a1_id}.status == REQUESTED"
            - "GET /crayon-works/assortment-specs/${spec_id} shows version == ${spec_v} + 1 (the reservation bump)"
            - "boxes_reserved == 0 (provisional share of an empty pool is 0)"

      - name: version_increments_on_every_mutation
        claim_type: "optimistic_concurrency"
        grounds:
          - entities.Ticket
          - entities.AttractionSession
        distinguishing_aspect: "Version arithmetic is exact on both sides of a cascade: a ticket is created at version 1 and its refund moves it to 2; the session, whose booked_units the booking and refund mutate, moves 1 -> 2 -> 3."
        test_recipe:
          setup:
            - "Session Hall A 2026-10-17 capacity 100 (version 1); one INDIVIDUAL ticket booked."
          setup_api_calls:
            - *k_clock0
            - *k_session
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_id}", kind: INDIVIDUAL }
              as: BoxOffice
              as_user_id: "bo-1"
              captures: { t_id: $.data.id, t_v0: $.data.version }
          trigger:
            - call: "POST /crayon-works/tickets/${t_id}/decision"
              payload: { action: REFUND }
              as: BoxOffice
              as_user_id: "bo-1"
              captures: { t_v1: $.data.version }
          assert:
            - "the ticket captured version 1 at creation (${t_v0}) and version 2 after the refund (${t_v1})"
            - "GET /crayon-works/attraction-sessions/${ses_id} shows version == 3 (create, booking cascade, refund cascade) and booked_units == 0"

      - name: epoch_opens_scheduled_campaign_at_inclusive_boundary
        claim_type: "ops_run_checkpoint"
        grounds:
          - state_machines.VoteCampaign.SCHEDULED_to_OPEN
          - endpoints.POST_/crayon-works/ops/run-epoch
        distinguishing_aspect: "The deferred opening is boundary-exact against the logical clock: an epoch at 2026-09-04T23:59:59Z opens nothing, and the epoch at exactly opens_on 2026-09-05T00:00:00Z opens the campaign (inclusive lower bound)."
        test_recipe:
          setup:
            - "Color Cerulean with a SCHEDULED campaign, opens_on 2026-09-05T00:00:00Z."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_camp
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T23:59:59Z" }
              as: PlatformAdmin
            - call: "POST /crayon-works/ops/run-epoch"
              payload: {}
              as: PlatformAdmin
              captures: { opened_early: $.data.campaigns_opened }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /crayon-works/ops/run-epoch"
              payload: {}
              as: PlatformAdmin
              captures: { opened_on_time: $.data.campaigns_opened }
          assert:
            - "the early epoch opened nothing (${opened_early} == 0) and the campaign was still SCHEDULED"
            - "the on-time epoch reports campaigns_opened == 1 (${opened_on_time})"
            - "GET /crayon-works/colors/${c_id}/vote-campaigns shows data[0].status == OPEN"

      - name: waitlist_promotion_head_of_line_blocking
        claim_type: "cascading_side_effects"
        grounds:
          - state_machines.Ticket.WAITLISTED_to_CONFIRMED
          - state_machines.Ticket.CONFIRMED_to_REFUNDED
        distinguishing_aspect: "The promotion selector is strict FIFO with head-of-line blocking and no skipping: refunding 20 units promotes neither the 45-unit head (too big) nor the 10-unit second entry (not the head), even though 10 would fit — a skip-happy implementation is observably wrong."
        test_recipe:
          setup:
            - "Session Hall E 2026-10-19 capacity 50: G1 (30) and G4 (20) CONFIRMED (booked 50); G2 (45, older) and G3 (10, newer) WAITLISTED."
          setup_api_calls:
            - *k_clock0
            - call: "POST /crayon-works/attraction-sessions"
              payload: { venue_name: "Hall E", session_date: "2026-10-19T00:00:00Z", start_minute: 600, duration_minutes: 120, capacity_units: 50, base_price_cents: 2000 }
              as: PlatformAdmin
              captures: { ses_id: $.data.id }
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_id}", kind: GROUP, group_size: 30, school_name: "Lincoln Elementary" }
              as: BoxOffice
              as_user_id: "bo-1"
              captures: { g1_id: $.data.id }
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_id}", kind: GROUP, group_size: 45, school_name: "Roosevelt Middle" }
              as: BoxOffice
              as_user_id: "bo-1"
              captures: { g2_id: $.data.id }
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_id}", kind: GROUP, group_size: 10, school_name: "Jefferson High" }
              as: BoxOffice
              as_user_id: "bo-1"
              captures: { g3_id: $.data.id }
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_id}", kind: GROUP, group_size: 20, school_name: "Washington Primary" }
              as: BoxOffice
              as_user_id: "bo-1"
              captures: { g4_id: $.data.id }
          trigger:
            - call: "POST /crayon-works/tickets/${g4_id}/decision"
              payload: { action: REFUND }
              as: BoxOffice
              as_user_id: "bo-1"
          assert:
            - "Ticket.${g2_id}.status == WAITLISTED (head of line, 45 > 20 freed — blocks)"
            - "Ticket.${g3_id}.status == WAITLISTED (fits but is not the head — no skipping)"
            - "AttractionSession.${ses_id}.booked_units == 30 (only G1 remains)"

      - name: reinstate_happy_path_after_recall_closes
        claim_type: "version_pinning_on_approval"
        grounds:
          - state_machines.LicensedLine.SUSPENDED_to_APPROVED
          - entities.LicensedLine.fields.pinned_formula_version
          - state_machines.RecallCase
        distinguishing_aspect: "Re-validation on state change: a line suspended by the recall cascade becomes REINSTATE-able only once the recall is CLOSED and the pinned formula version still matches — here both hold, so REINSTATE returns the line to APPROVED with the pin intact."
        test_recipe:
          setup:
            - "Production-capable setup; run R1 completed (125 boxes); line APPROVED (pinned formula version 4). Batch retro-rejected at clock 2026-11-02 -> recall OPEN, run and lot QUARANTINED, line SUSPENDED. An epoch contains the recall; the clock reaches 2026-11-17 (past the 14-day CLASS_II cooling) and a second epoch closes it."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_camp
            - *k_open
            - *k_epoch
            - *k_pass
            - *k_close
            - *k_epoch
            - *k_spec
            - *k_batch
