              as: Borrower
              as_user_id: "${lf1_id}"
            - call: "POST /appraisal-desk/rov-requests/${rov1_id}/evidence"
              payload: { evidence_type: "CLOSED_SALE", street_address: "11 Birch Lane", sale_price_cents: 48900000, sale_date: "2026-05-10T00:00:00Z", distance_miles: 1.40 }
              as: Borrower
              as_user_id: "${lf1_id}"
