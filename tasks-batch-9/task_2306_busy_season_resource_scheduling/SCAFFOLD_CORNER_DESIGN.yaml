      - name: plan_apply_with_a_stale_engagement_version_rejected_then_retried
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reschedule-apply-stale-engagement]
          - validations[priority=42]
          - errors[ERR_STALE_ENGAGEMENT_VERSION]
          - endpoints[POST /scheduling/reschedule-plans/{reschedule_plan_id}/apply]
        distinguishing_aspect: |
          The two guards on apply are independent: the simulation is fresh here
          (simulation_stale == false, so priority 38 passes) and only the supplied
          expected_engagement_version is wrong, which yields 412 rather than 409 — and the
          rejected apply leaves the plan SIMULATED and the phase window untouched.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T09:00:00Z; MERIDIAN client, partner P1, DOMESTIC senior S1."
            - "Engagement E1 with phase PH1 FIELDWORK expecting 21.00 hours in 2026-08-03..2026-08-31; A1 books S1 21.00 hours over [2026-08-24, 2026-08-31); E1 scheduled."
            - "Plan PL1 (CLIENT_READINESS_SLIP, shift_days 7) simulated, so simulated_at_engagement_version equals the current Engagement.version ${e_ver}."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
