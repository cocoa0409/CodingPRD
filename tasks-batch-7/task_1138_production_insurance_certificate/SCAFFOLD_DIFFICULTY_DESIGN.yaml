              as: ProductionManager
              captures: { fte_id: $.data.id }
          trigger:
            - call: "POST /productions/${prod_id}/foreign-travel-extensions/${fte_id}/approve"
              payload: {}
              as: UnderwriterAgent
              captures: { status: $.data.status }
          assert:
            - "ForeignTravelExtension.${fte_id}.status == APPROVED"

      - name: endorsement_issue_requires_policy_bound
        grounds:
          - state_machines.CastEndorsement.DRAFT_to_ISSUED
          - state_machines.Policy.QUOTED_to_BOUND
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          CastEndorsement issuance depends on Policy entity state (must
          be in {BOUND, ENDORSED_PENDING, ACTIVE}); a different entity
          pair (CastEndorsement ↔ Policy) than the ForeignTravelExtension
          ↔ Policy pair.
        test_recipe:
          setup:
            - "Production DRAFT with cast member exam CLEARED"
            - "CAST policy still QUOTED (not bound)"
            - "CastEndorsement in DRAFT referencing the QUOTED policy"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-X2"
                title: "Cross Entity 2"
                production_type: "FEATURE"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-08-01T00:00:00Z"
                budget_cents: 100000000
                requires_completion_bond: false
              as: BrokerAgent
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/cast-members"
              payload: { full_name: "Stunt X", role_tier: "STUNT", weekly_salary_cents: 500000, essential_element: false }
              as: ProductionManager
              captures: { cm_id: $.data.id }
            - call: "POST /productions/${prod_id}/cast-members/${cm_id}/physical-exam"
              payload: { outcome: "CLEARED" }
              as: UnderwriterAgent
            - call: "POST /productions/${prod_id}/policies"
              payload:
                coverage_line: "CAST"
                carrier_code: "CHUBB"
                policy_number: "CHU-CAST-X2"
                limit_cents: 50000000
                aggregate_limit_cents: 100000000
                deductible_cents: 100000
                effective_date: "2026-05-15T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 100000000
              as: BrokerAgent
              captures: { pol_id: $.data.id }
            - call: "POST /productions/${prod_id}/cast-endorsements"
              payload:
                cast_member_id: "${cm_id}"
                policy_id: "${pol_id}"
                endorsement_type: "STUNT_RIDER"
              as: UnderwriterAgent
              captures: { endo_id: $.data.id }
          trigger:
            # Endorsement references a QUOTED policy → must be rejected.
            - call: "POST /productions/${prod_id}/cast-endorsements/${endo_id}/issue"
              payload: {}
              as: UnderwriterAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

  # ============================================================
  # Rule 8 — resource_temporal_overlap
  # ============================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: foreign_travel_half_open_overlap
        grounds:
          - calculations.foreign_travel_overlap_validate
          - validations[priority=16]
          - errors[ERR_FOREIGN_TRAVEL_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) — two extensions
          with travel_window_start_new == travel_window_end_existing do
          NOT overlap; one starting strictly inside does. Resource:
          ForeignTravelExtension (territory-keyed).
        test_recipe:
          setup:
            - "Production ACTIVE with BOUND GL + FOREIGN_TRAVEL policies"
            - "Existing APPROVED extension for territory FR with window [2026-07-01, 2026-07-15)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-O1"
                title: "Overlap 1"
                production_type: "COMMERCIAL"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-08-01T00:00:00Z"
                budget_cents: 100000000
                requires_completion_bond: false
              as: BrokerAgent
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/policies"
              payload:
                coverage_line: "GENERAL_LIABILITY"
                carrier_code: "AIG"
                policy_number: "AIG-GL-O1"
                limit_cents: 100000000
                aggregate_limit_cents: 200000000
                deductible_cents: 100000
                effective_date: "2026-05-01T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 10000000
              as: BrokerAgent
              captures: { gl_id: $.data.id }
            - call: "POST /productions/${prod_id}/policies"
              payload:
                coverage_line: "FOREIGN_TRAVEL"
                carrier_code: "TRAVELERS"
                policy_number: "TRV-FT-O1"
                limit_cents: 50000000
                aggregate_limit_cents: 100000000
                deductible_cents: 50000
                effective_date: "2026-05-01T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 5000000
              as: BrokerAgent
              captures: { ft_id: $.data.id }
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/policies/${gl_id}/bind"
              payload: { expected_production_version: "${prod_v}" }
              as: BrokerAgent
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v2: $.data.version }
            - call: "POST /productions/${prod_id}/policies/${ft_id}/bind"
              payload: { expected_production_version: "${prod_v2}" }
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/activate"
              payload: {}
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/foreign-travel-extensions"
              payload:
                territory_code: "FR"
                travel_window_start: "2026-07-01T00:00:00Z"
                travel_window_end: "2026-07-15T00:00:00Z"
                travelers_count: 5
                repatriation_limit_cents: 500000
              as: ProductionManager
              captures: { fte_a: $.data.id }
            - call: "POST /productions/${prod_id}/foreign-travel-extensions/${fte_a}/approve"
              payload: {}
              as: UnderwriterAgent
            # Adjacent (touching at boundary) extension: half-open semantics → allowed
            - call: "POST /productions/${prod_id}/foreign-travel-extensions"
              payload:
                territory_code: "FR"
                travel_window_start: "2026-07-15T00:00:00Z"
                travel_window_end: "2026-07-25T00:00:00Z"
                travelers_count: 3
                repatriation_limit_cents: 300000
              as: ProductionManager
              captures: { fte_b: $.data.id }
            # Overlapping extension: strictly inside existing window → rejected
            - call: "POST /productions/${prod_id}/foreign-travel-extensions"
              payload:
                territory_code: "FR"
                travel_window_start: "2026-07-10T00:00:00Z"
                travel_window_end: "2026-07-20T00:00:00Z"
                travelers_count: 2
                repatriation_limit_cents: 200000
              as: ProductionManager
              captures: { fte_c: $.data.id }
          trigger:
            # Approve the adjacent one (should succeed)
            - call: "POST /productions/${prod_id}/foreign-travel-extensions/${fte_b}/approve"
              payload: {}
              as: UnderwriterAgent
              captures: { status_b: $.data.status }
            # Approve the overlapping one (should fail)
            - call: "POST /productions/${prod_id}/foreign-travel-extensions/${fte_c}/approve"
              payload: {}
              as: UnderwriterAgent
              captures: { err_c: $.data.error_id }
          assert:
            - "ForeignTravelExtension.${fte_b}.status == APPROVED"
            - "ForeignTravelExtension.${fte_c} approve returns error_id == ERR_FOREIGN_TRAVEL_OVERLAP"

      - name: certificate_window_subset_check
        grounds:
          - calculations.certificate_coverage_window_validate
          - validations[priority=15]
          - errors[ERR_CERT_WINDOW_OUTSIDE_POLICY]
        distinguishing_aspect: |
          Different interval semantics: SUBSET check (not overlap) with
          production-window extension buffer (+30 days) AND policy-window
          containment both required. Resource: Certificate (production-
          keyed), different from ForeignTravelExtension (territory-keyed).
        test_recipe:
          setup:
            - "Production ACTIVE with GL policy effective [2026-06-01, 2026-12-31)"
            - "Production principal_photography [2026-06-01, 2026-08-01]"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-O2"
                title: "Overlap 2"
                production_type: "COMMERCIAL"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-08-01T00:00:00Z"
                budget_cents: 100000000
                requires_completion_bond: false
              as: BrokerAgent
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/policies"
              payload:
                coverage_line: "GENERAL_LIABILITY"
                carrier_code: "AIG"
                policy_number: "AIG-GL-O2"
                limit_cents: 100000000
                aggregate_limit_cents: 200000000
                deductible_cents: 100000
                effective_date: "2026-06-01T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 10000000
              as: BrokerAgent
              captures: { pol_id: $.data.id }
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/policies/${pol_id}/bind"
              payload: { expected_production_version: "${prod_v}" }
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/activate"
              payload: {}
              as: BrokerAgent
            # Certificate with location_end past the +30 day production window
            - call: "POST /productions/${prod_id}/certificates"
              payload:
                certificate_type: "LOCATION"
                holder_name: "Far Lot"
                holder_address: "100 Far Ln"
                additional_insured_name: "Far Lot Owner"
                coverage_lines: ["GENERAL_LIABILITY"]
                location_start: "2026-06-01T00:00:00Z"
                location_end: "2026-10-01T00:00:00Z"
              as: BrokerAgent
              captures: { cert_id: $.data.id }
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v2: $.data.version }
          trigger:
            - call: "POST /productions/${prod_id}/certificates/${cert_id}/issue"
              payload: { expected_production_version: "${prod_v2}" }
              as: BrokerAgent
              captures: { err: $.data.error_id }
          assert:
            # location_end 2026-10-01 exceeds principal_photography_end+30d = 2026-08-31
            - "error_id == ERR_CERT_WINDOW_OUTSIDE_POLICY"

  # ============================================================
  # Rule 9 — compensating_invariant
  # ============================================================
  - rule_id: compensating_invariant
    instances:
      - name: claim_reserve_conservation
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_SETTLED
          - state_machines.Claim.UNDER_REVIEW_to_DENIED
          - calculations.claim_deductible_applied
          - entities.Claim.fields.reserve_cents
        distinguishing_aspect: |
          Conserved quantity: sum of loss_amount_cents across claims on a
          policy. Forward action: claim submission increments cumulative
          reserved loss; compensating settle/deny returns reserve to 0
          but the loss_amount_cents on the policy is unchanged. Net
          invariant: loss_amount_cents(claim) ==
          deductible_applied_cents(claim) + carrier_payable_cents(claim)
          at every state.
        test_recipe:
          setup:
            - "Production ACTIVE with GL policy BOUND, deductible 100000"
            - "Claim with loss_amount_cents=500000 submitted (deductible_applied=100000, carrier_payable=400000)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-I1"
                title: "Invariant 1"
                production_type: "COMMERCIAL"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-06-15T00:00:00Z"
                budget_cents: 100000000
                requires_completion_bond: false
              as: BrokerAgent
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/policies"
              payload:
                coverage_line: "GENERAL_LIABILITY"
                carrier_code: "AIG"
                policy_number: "AIG-GL-I1"
                limit_cents: 100000000
                aggregate_limit_cents: 200000000
                deductible_cents: 100000
                effective_date: "2026-05-01T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 10000000
              as: BrokerAgent
              captures: { pol_id: $.data.id }
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/policies/${pol_id}/bind"
              payload: { expected_production_version: "${prod_v}" }
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/activate"
              payload: {}
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/claims"
              payload:
                policy_id: "${pol_id}"
                claim_type: "DAMAGE"
                occurrence_date: "2026-06-05T00:00:00Z"
                loss_amount_cents: 500000
              as: ProductionManager
              captures: { claim_id: $.data.id }
            - call: "POST /productions/${prod_id}/claims/${claim_id}/acknowledge"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /productions/${prod_id}/claims/${claim_id}/settle"
              payload: { settlement_amount_cents: 300000 }
              as: ClaimsAdjuster
              as_user_id: "adjuster-A"
              captures: { st: $.data.status }
            - call: "GET /productions/${prod_id}/claims/${claim_id}"
              payload: {}
              as: ClaimsAdjuster
              captures: { final_loss: $.data.loss_amount_cents, final_ded: $.data.deductible_applied_cents, final_pay: $.data.carrier_payable_cents, final_reserve: $.data.reserve_cents }
          assert:
            - "Claim.${claim_id}.loss_amount_cents == 500000  # unchanged"
            - "Claim.${claim_id}.deductible_applied_cents == 100000  # unchanged"
            - "Claim.${claim_id}.carrier_payable_cents == 400000  # unchanged"
            - "Claim.${claim_id}.reserve_cents == 0  # zeroed on settle"
            - "invariant: loss_amount_cents == deductible_applied_cents + carrier_payable_cents"

      - name: certificate_count_conservation_across_void_expire
        grounds:
          - state_machines.Certificate.DRAFT_to_ISSUED
          - state_machines.Certificate.ISSUED_to_VOIDED
          - state_machines.Certificate.ISSUED_to_EXPIRED
          - state_machines.Production.ACTIVE_to_WRAPPED
        distinguishing_aspect: |
          Different conserved quantity: total certificate count for a
          production. Forward action: issuing a cert transitions DRAFT →
          ISSUED (total count unchanged). Compensating action: void /
          auto-expire on production wrap (total count still unchanged;
          only status mix changes). Distinct from claim cent conservation.
        test_recipe:
          setup:
            - "Production ACTIVE with GL policy BOUND, posture BOUND_PARTIAL"
            - "Two certificates created in DRAFT, both issued"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-I2"
                title: "Invariant 2"
                production_type: "COMMERCIAL"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-06-30T00:00:00Z"
                budget_cents: 100000000
                requires_completion_bond: false
              as: BrokerAgent
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/policies"
              payload:
                coverage_line: "GENERAL_LIABILITY"
                carrier_code: "AIG"
                policy_number: "AIG-GL-I2"
                limit_cents: 100000000
                aggregate_limit_cents: 200000000
                deductible_cents: 100000
                effective_date: "2026-05-01T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 10000000
              as: BrokerAgent
              captures: { pol_id: $.data.id }
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/policies/${pol_id}/bind"
              payload: { expected_production_version: "${prod_v}" }
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/activate"
              payload: {}
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/certificates"
              payload:
                certificate_type: "LOCATION"
                holder_name: "Lot A"
                holder_address: "1 A Ln"
                additional_insured_name: "A Owner"
                coverage_lines: ["GENERAL_LIABILITY"]
                location_start: "2026-06-01T00:00:00Z"
                location_end: "2026-06-15T00:00:00Z"
              as: BrokerAgent
              captures: { cert_a: $.data.id }
            - call: "POST /productions/${prod_id}/certificates"
              payload:
                certificate_type: "VENDOR"
                holder_name: "Vendor B"
                holder_address: "2 B Ln"
                coverage_lines: ["GENERAL_LIABILITY"]
                location_start: "2026-06-16T00:00:00Z"
                location_end: "2026-06-30T00:00:00Z"
              as: BrokerAgent
              captures: { cert_b: $.data.id }
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v2: $.data.version }
            - call: "POST /productions/${prod_id}/certificates/${cert_a}/issue"
              payload: { expected_production_version: "${prod_v2}" }
              as: BrokerAgent
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v3: $.data.version }
            - call: "POST /productions/${prod_id}/certificates/${cert_b}/issue"
              payload: { expected_production_version: "${prod_v3}" }
              as: BrokerAgent
            - call: "GET /productions/${prod_id}/certificates"
              payload: {}
              as: BrokerAgent
              captures: { count_before_wrap: $.data }
          trigger:
            # Wrap: ISSUED certs auto-expire. Total count must be unchanged.
            - call: "POST /productions/${prod_id}/wrap"
              payload: {}
              as: ProductionManager
            - call: "GET /productions/${prod_id}/certificates"
              payload: {}
              as: BrokerAgent
              captures: { certs_after: $.data }
            - call: "GET /productions/${prod_id}/certificates/${cert_a}"
              payload: {}
              as: BrokerAgent
              captures: { cert_a_status: $.data.status }
            - call: "GET /productions/${prod_id}/certificates/${cert_b}"
              payload: {}
              as: BrokerAgent
              captures: { cert_b_status: $.data.status }
          assert:
            - "Certificate.${cert_a}.status == EXPIRED"
            - "Certificate.${cert_b}.status == EXPIRED"
            - "Total certificate count for production unchanged (2 before wrap, 2 after wrap) — forward+compensating pair preserves count"
