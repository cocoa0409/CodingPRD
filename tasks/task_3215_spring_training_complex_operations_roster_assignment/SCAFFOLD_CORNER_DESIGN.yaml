  # ===========================================================================
  - section: validations
    instances:

      - name: duplicate_idp_number_is_rejected_across_the_whole_player_table
        claim_type: Violation -> Error
        grounds:
          - validations[priority=20]
          - errors[ERR_DUPLICATE_IDP_NUMBER]
        distinguishing_aspect: "Two players created with the same idp_number collide on the unscoped uniqueness rule with 409 ERR_DUPLICATE_IDP_NUMBER, regardless of which complex they report to."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. Two complexes and one player already holding idp_number IDP-61601 on the first complex."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cxa: $.data.id }
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Riverview Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cxb: $.data.id }
            - call: "POST /camp-ops/players"
              payload: { full_name: "First Holder", idp_number: "IDP-61601", position_code: "P", acquisition_channel: "NRI_ASSIGNMENT", mlb_service_days: 0, minor_league_option_years_used: 1, home_country: "United States", home_complex_id: "${cxa}" }
              as: RosterManager
          trigger:
            - call: "POST /camp-ops/players"
              payload: { full_name: "Second Holder", idp_number: "IDP-61601", position_code: "P", acquisition_channel: "NRI_ASSIGNMENT", mlb_service_days: 0, minor_league_option_years_used: 1, home_country: "United States", home_complex_id: "${cxb}" }
              as: RosterManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id is ERR_DUPLICATE_IDP_NUMBER"
            - "the duplicate is rejected even though the two players report to different complexes"
            - "a follow-up players list returns total_count 1"

      - name: assignment_create_beyond_group_capacity_is_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=16]
          - errors[ERR_GROUP_CAPACITY_EXCEEDED]
        distinguishing_aspect: "A group with capacity_units 1 accepts exactly one provisional assignment and rejects the second with 409 ERR_GROUP_CAPACITY_EXCEEDED, so the aggregate reservation is a hard ceiling."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One DEDICATED complex, one published-capable group with capacity 1, and two cleared pitchers."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
            - call: "POST /camp-ops/players"
              payload: { full_name: "Capacity One", idp_number: "IDP-61701", position_code: "P", acquisition_channel: "NRI_ASSIGNMENT", mlb_service_days: 0, minor_league_option_years_used: 1, home_country: "United States", home_complex_id: "${cx}" }
              as: RosterManager
              captures: { pa: $.data.id }
            - call: "POST /camp-ops/players"
              payload: { full_name: "Capacity Two", idp_number: "IDP-61702", position_code: "P", acquisition_channel: "NRI_ASSIGNMENT", mlb_service_days: 0, minor_league_option_years_used: 1, home_country: "United States", home_complex_id: "${cx}" }
              as: RosterManager
              captures: { pb: $.data.id }
            - call: "POST /camp-ops/complexes/${cx}/workout-groups"
              payload: { complex_id: "${cx}", roster_bucket: "MAJOR", group_name: "Pitchers Group A", facility_kind: "FIELD", capacity_units: 1 }
              as: ComplexDirector
              captures: { wg: $.data.id, wg_v: $.data.version }
            - call: "POST /camp-ops/workout-groups/${wg}/assignments"
              payload: { workout_group_id: "${wg}", player_id: "${pa}", roster_bucket: "MAJOR", assignment_kind: "ACTIVE_WORKOUT", expected_group_version: "${wg_v}" }
              as: FieldCoordinator
            - call: "GET /camp-ops/workout-groups/${wg}"
              payload: {}
              as: ComplexDirector
              captures: { wg_v2: $.data.version }
          trigger:
            - call: "POST /camp-ops/workout-groups/${wg}/assignments"
              payload: { workout_group_id: "${wg}", player_id: "${pb}", roster_bucket: "MAJOR", assignment_kind: "ACTIVE_WORKOUT", expected_group_version: "${wg_v2}" }
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id is ERR_GROUP_CAPACITY_EXCEEDED"
            - "WorkoutGroup.${wg}.assigned_units remains 1"
            - "the second player holds no GroupAssignment row"

      - name: assignment_bucket_must_match_the_owning_group_bucket
        claim_type: Violation -> Error
        grounds:
          - validations[priority=18]
          - errors[ERR_BUCKET_MISMATCH]
        distinguishing_aspect: "A MINOR roster_bucket posted against a MAJOR group is rejected with 422 ERR_BUCKET_MISMATCH even though the capacity and version checks would pass."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One DEDICATED complex and one cleared pitcher."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
            - call: "POST /camp-ops/players"
              payload: { full_name: "Bucket Mismatch", idp_number: "IDP-61801", position_code: "P", acquisition_channel: "NRI_ASSIGNMENT", mlb_service_days: 0, minor_league_option_years_used: 1, home_country: "United States", home_complex_id: "${cx}" }
              as: RosterManager
              captures: { pl: $.data.id }
            - call: "POST /camp-ops/complexes/${cx}/workout-groups"
              payload: { complex_id: "${cx}", roster_bucket: "MAJOR", group_name: "Pitchers Group A", facility_kind: "FIELD", capacity_units: 40 }
              as: ComplexDirector
              captures: { wg: $.data.id, wg_v: $.data.version }
          trigger:
            - call: "POST /camp-ops/workout-groups/${wg}/assignments"
              payload: { workout_group_id: "${wg}", player_id: "${pl}", roster_bucket: "MINOR", assignment_kind: "ACTIVE_WORKOUT", expected_group_version: "${wg_v}" }
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id is ERR_BUCKET_MISMATCH"
            - "WorkoutGroup.${wg}.assigned_units remains 0"

      - name: farm_scoped_entity_mutation_is_refused_for_a_mapped_player
        claim_type: Violation -> Error
        grounds:
          - validations[priority=23]
          - errors[ERR_FARM_ENTITY_EXCLUDED]
        distinguishing_aspect: "Once a player is mapped onto an ACTIVE SpringTrail row, a roster-record decision for that player is refused with 409 ERR_FARM_ENTITY_EXCLUDED before any state precondition is even considered."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One DEDICATED complex, one pitcher with an open roster record, and an ACTIVE SpringTrail mapping for that player."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
            - call: "POST /camp-ops/players"
              payload: { full_name: "Trail Mapped", idp_number: "IDP-61901", position_code: "P", acquisition_channel: "NRI_ASSIGNMENT", mlb_service_days: 0, minor_league_option_years_used: 1, home_country: "United States", home_complex_id: "${cx}" }
              as: RosterManager
              captures: { pl: $.data.id }
            - call: "POST /camp-ops/players/${pl}/roster-record"
              payload: { player_id: "${pl}" }
              as: RosterManager
            - call: "POST /camp-ops/players/${pl}/spring-trails"
              payload: { player_id: "${pl}", trail_level: "AAA" }
              as: MinorLeagueCoordinator
              captures: { tr: $.data.id }
          trigger:
            - call: "POST /camp-ops/players/${pl}/roster-record/decide"
              payload: { decision_type: "OPTION_ASSIGN" }
              as: RosterManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id is ERR_FARM_ENTITY_EXCLUDED"
            - "the roster record remains NRI with roster_decision_status DECISION_PENDING"
            - "SpringTrail.${tr}.trail_status == ACTIVE"
            - "ending the trail first would let the same decide succeed"

      - name: finalize_by_the_same_principal_that_applied_the_decision_is_forbidden
        claim_type: Violation -> Error
        grounds:
          - validations[priority=3]
          - errors[ERR_SOD_VIOLATION]
        distinguishing_aspect: "The same X-User-ID that applied an OPTION_ASSIGN decision cannot also finalize it: the finalize returns 403 ERR_SOD_VIOLATION, and a second finalize from a different principal succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One DEDICATED complex and one pitcher with a cleared medical path."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
