  # --- Test-driving endpoints (clock) ---
  - method: POST
    path: "/roastery/_clock/set_current_utc"
    description: "Set the server logical clock. Default startup time is 2026-08-01T00:00:00Z; before any set_current_utc call the logical clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["Lazy FRESH → STALE re-evaluation triggers on next read of any FinishedGoodsLot"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers, or unrecognized role name" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role authenticated but not authorized to invoke this endpoint per RBAC" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body FK id does not resolve to an existing entity" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity is in a state that does not permit this transition per §1.2" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match parent's current version (OCC)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown field, enum out of set, numeric range violated, or malformed value" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Same user attempts two steps that must be performed by different people (hedge submit vs approve; roast vs cupping finalize)" }
  - { id: ERR_RECIPE_COMPONENT_SUM_INVALID, http: 422, condition: "Recipe components do not sum to exactly 1.00000 at approval" }
  - { id: ERR_SUBSTITUTION_RULE_INVALID, http: 422, condition: "substitution_grade non-null iff substitution_max_pct non-null, and substitution_grade must differ from required_grade" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "Price-fix would push counterparty provisional open exposure above credit_limit_usd" }
  - { id: ERR_OVER_FIX, http: 422, condition: "Cumulative fix_lbs across all PriceFixEvent rows would exceed contract.total_lbs" }
  - { id: ERR_FACILITY_LIMIT_EXCEEDED, http: 422, condition: "New FinancingReserve would push line.utilized_usd above facility_limit_usd" }
  - { id: ERR_INSUFFICIENT_GREEN_INVENTORY, http: 422, condition: "Blend allocation waterfall cannot satisfy all components from RELEASED lots + permitted substitution" }
  - { id: ERR_RECIPE_NOT_APPROVED, http: 422, condition: "RoastBatch pinned recipe is not APPROVED, or recipe does not belong to the specified product" }
  - { id: ERR_STALE_GOODS, http: 422, condition: "Fulfillment reservation references a FinishedGoodsLot whose lot_status is not FRESH" }
  - { id: ERR_INSUFFICIENT_FINISHED_GOODS, http: 422, condition: "Fulfillment line allocated_lbs exceeds FinishedGoodsLot.available_lbs" }
  - { id: ERR_DELIVERY_WINDOW_VIOLATION, http: 422, condition: "Shipment scheduled_arrival outside contract delivery window" }
  - { id: ERR_INVALID_DELIVERY_WINDOW, http: 422, condition: "delivery_window_end <= delivery_window_start" }
  - { id: ERR_LOT_NOT_PLEDGEABLE, http: 422, condition: "FinancingReserve pledge references a lot not in RELEASED status, or reserved_lbs exceeds available_lbs" }
  - { id: ERR_INVALID_PACK_QUANTITY, http: 422, condition: "packed_lbs <= 0 or packed_lbs > actual_roasted_lbs" }
  - { id: ERR_OVER_HEDGE, http: 422, condition: "Approving this hedge would push cumulative APPROVED hedge_lbs above contract.unpriced_lbs" }
  - { id: ERR_INVALID_FIX_QUANTITY, http: 422, condition: "fix_lbs <= 0 or futures_price_usd_per_lb <= 0" }
  - { id: ERR_NOT_CUPPABLE, http: 409, condition: "CuppingSession subject is not in a cuppable state (lot not in QUARANTINE; batch not in PENDING_QC)" }
  - { id: ERR_PANEL_TOO_SMALL, http: 422, condition: "CuppingSession finalize attempted with panelist_count < 3" }
  - { id: ERR_INVALID_YIELD, http: 422, condition: "actual_roasted_lbs <= 0 or actual_roasted_lbs >= scheduled_green_lbs on finish" }
  - { id: ERR_CONTRACT_CAPACITY_EXCEEDED, http: 422, condition: "Booking this shipment would push the contract's cumulative non-cancelled planned_lbs above contract.total_lbs" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Trader
    description: "Green coffee buyer / seller; books contracts, fixes prices, manages hedges, resolves quality disputes"
    identity: opaque
    exclusive_operations:
      - "POST /roastery/counterparties"
      - "POST /roastery/counterparties/{counterparty_id}/contracts"
      - "POST /roastery/contracts/{contract_id}/price-fixes"
      - "POST /roastery/contracts/{contract_id}/short-close"
      - "POST /roastery/contracts/{contract_id}/cancel"
      - "POST /roastery/shipments/{shipment_id}/resolve-dispute"
      - "POST /roastery/contracts/{contract_id}/futures-hedges"
      - "POST /roastery/futures-hedges/{hedge_id}/lift"
      - "POST /roastery/futures-hedges/{hedge_id}/cancel"
    shared_operations:
      - "GET /roastery/counterparties/{id}, GET /roastery/counterparties"
      - "GET /roastery/contracts/{id}, GET /roastery/contracts"
      - "GET /roastery/shipments/{id}"
      - "GET /roastery/green-lots/{id}, GET /roastery/green-lots"
      - "GET /roastery/warehouse-position"
      - "GET /roastery/financing-lines/{id}"
      - "GET /roastery/financing-reserves/{id}, GET /roastery/financing-reserves"
      - "GET /roastery/futures-hedges/{id}, GET /roastery/contracts/{id}/futures-hedges"
      - "GET /roastery/cupping-sessions/{id}"
      - "GET /roastery/products/{id}"
      - "GET /roastery/fulfillment-orders/{id}"
      - "GET /roastery/fulfillment-orders"
      - "GET /roastery/contracts/{id}/price-fixes"
      - "GET /roastery/contracts/{id}/shipments"

  - name: RiskManager
    description: "Approves futures hedges (segregation-of-duties vs Trader), manages financing lines and reserves"
    identity: opaque
    exclusive_operations:
      - "POST /roastery/financing-lines"
      - "POST /roastery/financing-lines/{line_id}/reserves"
      - "POST /roastery/financing-reserves/{reserve_id}/release"
      - "POST /roastery/financing-lines/{line_id}/suspend"
      - "POST /roastery/financing-lines/{line_id}/unsuspend"
      - "POST /roastery/financing-lines/{line_id}/close"
      - "POST /roastery/futures-hedges/{hedge_id}/approve"
    shared_operations:
      - "GET /roastery/counterparties/{id}, GET /roastery/counterparties"
      - "GET /roastery/contracts/{id}, GET /roastery/contracts"
      - "GET /roastery/green-lots/{id}, GET /roastery/green-lots"
      - "GET /roastery/warehouse-position"
      - "GET /roastery/financing-lines/{id}"
      - "GET /roastery/financing-reserves/{id}, GET /roastery/financing-reserves"
      - "GET /roastery/futures-hedges/{id}, GET /roastery/contracts/{id}/futures-hedges"
      - "GET /roastery/contracts/{id}/price-fixes"

  - name: LogisticsCoordinator
    description: "Books and tracks inbound shipments"
    identity: opaque
    exclusive_operations:
      - "POST /roastery/contracts/{contract_id}/shipments"
      - "POST /roastery/shipments/{shipment_id}/depart"
      - "POST /roastery/shipments/{shipment_id}/arrive"
      - "POST /roastery/shipments/{shipment_id}/cancel"
    shared_operations:
      - "GET /roastery/shipments/{id}"
      - "GET /roastery/contracts/{id}/shipments"
      - "GET /roastery/contracts/{id}, GET /roastery/contracts"

  - name: WarehouseClerk
    description: "Receives shipments into the warehouse and creates green lots"
    identity: opaque
    exclusive_operations:
      - "POST /roastery/shipments/{shipment_id}/receive"
    shared_operations:
      - "GET /roastery/shipments/{id}"
      - "GET /roastery/green-lots/{id}, GET /roastery/green-lots"
      - "GET /roastery/warehouse-position"
      - "GET /roastery/contracts/{id}/shipments"

  - name: HeadRoaster
    description: "Owns roast profiles, products, blend recipes; approves recipes"
    identity: opaque
    exclusive_operations:
      - "POST /roastery/roast-profiles"
      - "POST /roastery/products"
      - "POST /roastery/products/{product_id}/recipes"
      - "POST /roastery/recipes/{recipe_id}/components"
      - "POST /roastery/recipes/{recipe_id}/approve"
      - "POST /roastery/recipes/{recipe_id}/retire"
    shared_operations:
      - "GET /roastery/roast-profiles/{id}"
      - "GET /roastery/products/{id}, GET /roastery/products"
      - "GET /roastery/recipes/{id}, GET /roastery/products/{id}/recipes"
      - "GET /roastery/recipes/{id}/components"
      - "GET /roastery/roast-batches/{id}, GET /roastery/roast-batches"
      - "GET /roastery/roast-batches/{id}/allocations"
      - "GET /roastery/roast-input-allocations/{id}, GET /roastery/roast-input-allocations"
      - "GET /roastery/green-lots/{id}, GET /roastery/green-lots"
      - "GET /roastery/warehouse-position"
      - "GET /roastery/cupping-sessions/{id}"
      - "GET /roastery/finished-goods-lots/{id}, GET /roastery/finished-goods-lots"

  - name: RoastOperator
    description: "Schedules and executes roast batches; cannot finalize cupping on own batches (segregation-of-duties)"
    identity: opaque
    exclusive_operations:
      - "POST /roastery/roast-batches"
      - "POST /roastery/roast-batches/{batch_id}/start"
      - "POST /roastery/roast-batches/{batch_id}/finish"
      - "POST /roastery/roast-batches/{batch_id}/pack"
      - "POST /roastery/roast-batches/{batch_id}/void"
    shared_operations:
      - "GET /roastery/roast-profiles/{id}"
      - "GET /roastery/products/{id}, GET /roastery/products"
      - "GET /roastery/recipes/{id}, GET /roastery/products/{id}/recipes"
      - "GET /roastery/recipes/{id}/components"
      - "GET /roastery/roast-batches/{id}, GET /roastery/roast-batches"
      - "GET /roastery/roast-batches/{id}/allocations"
      - "GET /roastery/roast-input-allocations/{id}, GET /roastery/roast-input-allocations"
      - "GET /roastery/green-lots/{id}, GET /roastery/green-lots"
      - "GET /roastery/finished-goods-lots/{id}, GET /roastery/finished-goods-lots"

  - name: QAGrader
    description: "Runs cupping sessions and finalizes verdicts; cannot finalize own roast batches"
    identity: opaque
    exclusive_operations:
      - "POST /roastery/cupping-sessions"
      - "POST /roastery/cupping-sessions/{session_id}/finalize"
    shared_operations:
      - "GET /roastery/cupping-sessions/{id}"
      - "GET /roastery/green-lots/{id}, GET /roastery/green-lots"
      - "GET /roastery/roast-batches/{id}, GET /roastery/roast-batches"
      - "GET /roastery/shipments/{id}"

  - name: FulfillmentPlanner
    description: "Builds and ships private-label / subscription / wholesale fulfillment orders"
    identity: opaque
    exclusive_operations:
      - "POST /roastery/fulfillment-orders"
      - "POST /roastery/fulfillment-orders/{order_id}/lines"
      - "POST /roastery/fulfillment-orders/{order_id}/reserve"
      - "POST /roastery/fulfillment-orders/{order_id}/pack"
      - "POST /roastery/fulfillment-orders/{order_id}/ship"
      - "POST /roastery/fulfillment-orders/{order_id}/cancel"
    shared_operations:
      - "GET /roastery/fulfillment-orders/{id}"
      - "GET /roastery/fulfillment-orders"
      - "GET /roastery/fulfillment-orders/{id}/lines"
      - "GET /roastery/fulfillment-lines/{id}, GET /roastery/fulfillment-lines"
      - "GET /roastery/finished-goods-lots/{id}, GET /roastery/finished-goods-lots"
      - "GET /roastery/products/{id}, GET /roastery/products"
      - "GET /roastery/counterparties/{id}, GET /roastery/counterparties"

  - name: PlatformAdmin
    description: "Operator role used only for test-driving endpoints (logical clock)"
    identity: opaque
    exclusive_operations:
      - "POST /roastery/_clock/set_current_utc"
    shared_operations: []
