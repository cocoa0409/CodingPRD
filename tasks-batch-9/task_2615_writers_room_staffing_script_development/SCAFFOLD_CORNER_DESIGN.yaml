            - "Trigger call 3 returns 409 ERR_ASSIGNMENT_NOT_DELIVERED; ScriptAssignment.${a1}.approved_at and version are unchanged and no GUARANTEE_REALLOCATION ledger row was appended"
            - "GET /fee-ledger-entries?assignment_id=${a1} still returns exactly 2 rows"

      - name: seat_acceptance_consumes_the_earliest_containing_window_and_moves_four_counters
        claim_type: side_effect_execution
        grounds:
          - state_machines.RoomSeat.transitions.OFFERED_to_CONFIRMED
          - entities.RoomSeat.fields.consumed_window_id
          - entities.AvailabilityWindow.fields.consumed_by_seat_id
          - entities.Writer.fields.active_seat_count
          - calculations.room_weekly_burn
        distinguishing_aspect: |
          The acceptance selector is declared as earliest start_date with created_at as the tie-break, so
          with two OPEN windows that both contain the seat interval - one starting 2026-08-15 and a later
          one starting 2026-08-20 - the EARLIER window must be consumed and the later one must stay OPEN.
          Four derived values move in the same call (confirmed_seat_count, subtotal, burn, active_seat_count)
          and confirmed_at is stamped from the logical clock.
        test_recipe:
          setup:
            - "W1 holds two OPEN windows containing [2026-09-01, 2027-03-01): AW1 from 2026-08-15 and AW1B from 2026-08-20."
            - "Seat S1 for W1 is OFFERED in the STAFFING room RM; the logical clock is at 2026-08-01T00:00:00Z."
