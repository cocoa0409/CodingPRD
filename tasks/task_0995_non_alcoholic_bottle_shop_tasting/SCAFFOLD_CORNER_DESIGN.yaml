              as: ShopStaff
            - call: "GET /nabs/tasting-events/${eid}"
              as: ShopStaff
              captures:
                v1: "$.data.version"
            # First seat bumps version
            - call: "POST /nabs/tasting-events/${eid}/seats"
              payload: { member_id: "${m1}", expected_event_version: "${v1}" }
              as: Member
              as_user_id: "${m1}"
          trigger:
            # Second seat attempts with the same (stale) v1
            - call: "POST /nabs/tasting-events/${eid}/seats"
              payload: { member_id: "${m2}", expected_event_version: "${v1}" }
              as: Member
              as_user_id: "${m2}"
              captures:
                err: "$.data.error_id"
          assert:
            - "captured err == 'ERR_STALE_VERSION'"

      - name: pagination_limit_offset_interaction
        claim_type: pagination_with_filtering
        grounds:
          - "response_envelope.pagination_defaults"
          - "endpoints.\\\"GET /nabs/skus\\\""
        distinguishing_aspect: "limit=2 offset=1 returns the second and third SKUs (sorted by created_at ASC)."
        test_recipe:
          setup: ["Three SKUs"]
