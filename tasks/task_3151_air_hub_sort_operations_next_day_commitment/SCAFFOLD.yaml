# =============================================================================
# PRD Benchmark Seed Tables
# Task: task_3151_air_hub_sort_operations_next_day_commitment
# Domain: air-hub-sort-operations
#
# Air Hub Sort Operations & Next-Day Commitment Cutoffs (UPS Worldport):
# inbound aircraft arrival banks with unload sequencing against a fixed sort
# window, package induction, primary and secondary sort with irregular and
# hazardous material diversion, load planning for outbound aircraft by weight,
# balance and destination commitment, commitment cutoff decisions where a
# delayed inbound forces service downgrade or reroute, weather and mechanical
# contingency with alternate hub routing, sort labor staffing across a nightly
# window with volume forecast variance, ground feeder coordination for regional
# volume, service failure attribution and refund eligibility under money-back
# guarantees.
# =============================================================================

scenario: |
  Air Hub Sort Operations & Next-Day Commitment Cutoffs (UPS Worldport): inbound aircraft arrival
  banks with unload sequencing against a fixed sort window, package induction, primary and secondary
  sort with irregular and hazardous material diversion, load planning for outbound aircraft by weight,
  balance and destination commitment, commitment cutoff decisions where a delayed inbound forces
  service downgrade or reroute, weather and mechanical contingency with alternate hub routing, sort
  labor staffing across a nightly window with volume forecast variance, ground feeder coordination for
  regional volume, service failure attribution and refund eligibility under money-back guarantees.

domain_name: air-hub-sort-operations
api_prefix: /airhub

complexity_profile:
  primary_archetype: posture-driven gating
  secondary_archetype: quota / allocation
  complexity_layers:
    - cascading_side_effects
    - dual-variant_calculation
    - rate_threshold_triggers
    - selector_policy
    - derived_field_reconciliation
  entity_topology: flat with foreign-key references (every resource carries an explicit hub_id / parent FK in its body and URL; no nested collection paths)
  state_machine_shape: parallel dimensions on Package (induction_status x sort_status x commitment_status x handling_status) plus cyclic diverge/resolve loops, branching reclaim fork-join, and a posture-driven derived pair on Package
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential_gate (Buildup re-derives its load_plan_tier when its own rated_weight_grams crosses a tier boundary)
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Hub
    parent: null
    common_fields: true
    fields:
      - { name: iata_code, type: string, source: input, description: "Three-letter hub code", constraints: "unique across all Hubs; immutable after creation" }
      - { name: name, type: string, source: input, description: "Hub display name" }
      - { name: sort_window_open_minutes, type: integer, source: input, description: "Local minutes-of-day when the nightly sort window opens", constraints: "0..1439" }
      - { name: sort_window_close_minutes, type: integer, source: input, description: "Local minutes-of-day when the nightly sort window closes", constraints: "strictly greater than sort_window_open_minutes; a close at or before the open is rejected" }
      - { name: live_planned_package_total, type: integer, source: computed, description: "Sum of Package.planned_weight_grams over every Package on this Hub whose handling_status NOT IN {DIVERTED, HOLD_AT_HUB} and commitment_status NOT IN {VOIDED, UPGRADED_HELD}. Recomputed on every Package mutation on this hub." }
      - { name: posture, type: enum, source: computed, description: "OPEN | CONGESTED | LOCKDOWN | GROUND_STOP", constraints: "one of OPEN, CONGESTED, LOCKDOWN, GROUND_STOP" }
      - { name: contingency_mode, type: boolean, source: system, default: false, description: "Set true by declare-contingency; cleared by clear-contingency" }
      - { name: alternate_hub_id, type: string, source: input, description: "FK -> Hub.id; the alternate hub that normal diversions reroute to while contingency_mode is false. Self-referential: a Hub may name another Hub." }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by exactly 1 per run_ops checkpoint" }

  - name: ArrivalBank
    parent: null
    common_fields: true
    fields:
      - { name: hub_id, type: string, source: system, description: "FK -> Hub.id; owning hub" }
      - { name: bank_code, type: string, source: input, description: "Bank code, e.g. BANK_A", constraints: "unique within hub" }
      - { name: scheduled_start_minutes, type: integer, source: input, description: "Local minutes-of-day the bank was planned to start" }
      - { name: scheduled_end_minutes, type: integer, source: input, description: "Local minutes-of-day the bank was planned to end", constraints: "strictly greater than scheduled_start_minutes" }
      - { name: actual_start_minutes, type: integer, source: input, description: "Local minutes-of-day the bank actually started; null until the first aircraft in the bank is UNLOADED", default: null }
      - { name: hydraulic_crew_available, type: boolean, source: input, default: true, description: "Whether the hydraulic-lift crew is on site for this bank" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | EN_ROUTE | UNLOADING | UNLOADED | CLOSED | ABANDONED", constraints: "one of SCHEDULED, EN_ROUTE, UNLOADING, UNLOADED, CLOSED, ABANDONED" }
      - { name: effective_sort_budget_minutes, type: integer, source: computed, description: "Minutes of unload headroom this bank can still spend inside its fixed sort window. 0 once every aircraft has been UNLOADED or CANCELLED; 0 for a bank whose status is CLOSED or ABANDONED." }

  - name: Aircraft
    parent: null
    common_fields: true
    fields:
      - { name: bank_id, type: string, source: system, description: "FK -> ArrivalBank.id; owning bank" }
      - { name: tail_number, type: string, source: input, description: "Aircraft registration", constraints: "unique within hub" }
      - { name: origin_station_code, type: string, source: input, description: "Three-letter origin station code" }
      - { name: scheduled_arrival_minutes, type: integer, source: input, description: "Local minutes-of-day of planned arrival" }
      - { name: actual_arrival_minutes, type: integer, source: input, description: "Local minutes-of-day of actual arrival; null until the aircraft lands", default: null }
      - { name: capacity_weight_grams, type: integer, source: input, description: "Structural payload limit in grams", constraints: "strictly positive" }
      - { name: inbound_weight_grams, type: integer, source: input, description: "Declared weight of the inbound load; null until the aircraft lands", default: null }
      - { name: unload_completed_minutes, type: integer, source: input, description: "Local minutes-of-day the unload finished; null until UNLOADED", default: null }
      - { name: maintenance_hold, type: boolean, source: system, default: false, description: "Set true by the maintenance transition; cleared only by clearing the contingency that grounded this aircraft" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_FLIGHT | LANDED | UNLOADING | UNLOADED | CANCELLED", constraints: "one of SCHEDULED, IN_FLIGHT, LANDED, UNLOADING, UNLOADED, CANCELLED" }

  - name: Package
    parent: null
    common_fields: true
    fields:
      - { name: hub_id, type: string, source: system, description: "FK -> Hub.id; owning hub. Request bodies declare foreign keys in this order everywhere: hub_id, then the parent resource, then the operator." }
      - { name: aircraft_id, type: string, source: system, description: "FK -> Aircraft.id; the inbound aircraft that carried the package into the hub" }
      - { name: tracking_number, type: string, source: input, description: "Package tracking number", constraints: "unique within hub" }
      - { name: acknowledgement_number, type: string, source: input, description: "Client-supplied idempotency key; replaying a POST /airhub/packages carrying the same acknowledgement_number on the same hub returns the original Package with 200 rather than minting a second one" }
      - { name: commodity_class, type: enum, source: input, description: "GENERAL | IRREGULAR | HAZMAT | PERISHABLE", constraints: "one of GENERAL, IRREGULAR, HAZMAT, PERISHABLE" }
      - { name: destination_hub_code, type: string, source: input, description: "Three-letter destination gateway or station code" }
      - { name: service_level, type: enum, source: input, description: "NEXT_DAY_AIR | SECOND_DAY_AIR | GROUND", constraints: "one of NEXT_DAY_AIR, SECOND_DAY_AIR, GROUND" }
      - { name: commitment_cutoff_minutes, type: integer, source: computed, description: "Local minutes-of-day the package must be loaded by to keep its committed service level; absolute (clock independent)" }
      - { name: planned_weight_grams, type: integer, source: input, description: "Manifested weight attributed to the destination gateway", constraints: "strictly positive" }
      - { name: rated_weight_grams, type: integer, source: computed, description: "Sorted-lane handling weight: max(planned_weight_grams, dimension_weight_grams, DIM_MINIMUM_GRAMS=2000); round_half_up to the nearest RATE_ROUNDING_GRAMS=100" }
      - { name: dimension_weight_grams, type: integer, source: input, description: "Volumetric weight recorded at induction", constraints: "strictly positive" }
      - { name: induction_status, type: enum, source: system, description: "NOT_INDUCTED | INDUCTED | REJECTED", constraints: "one of NOT_INDUCTED, INDUCTED, REJECTED" }
      - { name: sort_status, type: enum, source: system, description: "UNSORTED | PRIMARY_SORTED | SECONDARY_SORTED | LOADED", constraints: "one of UNSORTED, PRIMARY_SORTED, SECONDARY_SORTED, LOADED" }
      - { name: commitment_status, type: enum, source: system, description: "COMMITTED | DOWNGRADED | REROUTED | VOIDED | UPGRADED_HELD", constraints: "one of COMMITTED, DOWNGRADED, REROUTED, VOIDED, UPGRADED_HELD" }
      - { name: handling_status, type: enum, source: system, description: "NORMAL | ROUTED_TO_IRREGULAR | ROUTED_TO_HAZMAT | DIVERTED | HOLD_AT_HUB", constraints: "one of NORMAL, ROUTED_TO_IRREGULAR, ROUTED_TO_HAZMAT, DIVERTED, HOLD_AT_HUB" }
      - { name: last_sort_minutes, type: integer, source: system, description: "Local minutes-of-day of the most recent successful primary or secondary sort; null before the first primary sort" }
      - { name: buildup_id, type: string, source: system, description: "FK -> Buildup.id; the destination buildup this package is assigned to; null until assigned" }
      - { name: assigned_lane_id, type: string, source: system, description: "FK -> SortLane.id; the lane this package currently occupies while sort_status IN {PRIMARY_SORTED, SECONDARY_SORTED}; null when UNSORTED or LOADED" }
      - { name: staged_feeder_id, type: string, source: system, description: "FK -> GroundFeeder.id; the feeder this package is staged on; null unless staged. Set by POST /airhub/feeders/{feeder_id}/stage-package and cleared when the feeder is cancelled." }
      - { name: handling_posture, type: enum, source: computed, description: "STANDARD | IRREGULAR_LANE | HAZMAT_LANE — derived aggregate that gates every subsequent sort/load/diverge action on this package" }
      - { name: commitment_posture, type: enum, source: computed, description: "COMMITTED_OK | DOWNGRADE_PENDING | REROUTE_PENDING — derived aggregate that gates the package's refund path and its load eligibility" }
      - { name: final_commitment_minutes, type: integer, source: computed, description: "Final offer-delivery minute in hub-local minutes-of-day; set by the LAST commitment decision written on this package (downgrade, reroute, or upgrade-hold), overwritten by each later decision" }

  - name: SortLane
    parent: null
    common_fields: true
    fields:
      - { name: hub_id, type: string, source: system, description: "FK -> Hub.id; owning hub" }
      - { name: lane_code, type: string, source: input, description: "Lane code, e.g. P-12", constraints: "unique within hub" }
      - { name: lane_kind, type: enum, source: input, description: "PRIMARY | SECONDARY | IRREGULAR | HAZMAT", constraints: "one of PRIMARY, SECONDARY, IRREGULAR, HAZMAT" }
      - { name: commodity_capability, type: enum, source: input, description: "GENERAL | IRREGULAR | HAZMAT | PERISHABLE — the commodity class this lane is certified to handle", constraints: "one of GENERAL, IRREGULAR, HAZMAT, PERISHABLE" }
      - { name: capacity_weight_grams, type: integer, source: input, description: "Hourly handling capacity in grams", constraints: "strictly positive" }
      - { name: certified_until_minutes, type: integer, source: input, description: "Local minutes-of-day after which this lane's certification lapses; a lane is certified while current_minutes < certified_until_minutes" }
      - { name: turnout_start_minutes, type: integer, source: input, description: "Hub-local minutes-of-day this lane's turnout face opens; half-open interval start" }
      - { name: turnout_end_minutes, type: integer, source: input, description: "Hub-local minutes-of-day this lane's turnout face closes; treated as CLOSED at this instant, so two same-kind lanes touching at a point merge", constraints: "strictly greater than turnout_start_minutes" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | SATURATED | CLOSED", constraints: "one of AVAILABLE, SATURATED, CLOSED" }
      - { name: lane_load_grams, type: computed, description: "Sum of rated_weight_grams over every Package assigned to this lane whose sort_status IN {PRIMARY_SORTED, SECONDARY_SORTED}" }

  - name: LoadMove
    parent: null
    common_fields: true
    fields:
      - { name: hub_id, type: string, source: system, description: "FK -> Hub.id; owning hub" }
      - { name: aircraft_id, type: string, source: system, description: "FK -> Aircraft.id; outbound aircraft this move loads" }
      - { name: sequence, type: integer, source: system, description: "Monotone counter assigned at creation within the hub; the stable, deterministic tie-break for gateway weight allocation within this move" }
      - { name: status, type: enum, source: system, description: "DRAFT | PLANNED | LOADING | LOADED | REWORK_REQUIRED | CANCELLED", constraints: "one of DRAFT, PLANNED, LOADING, LOADED, REWORK_REQUIRED, CANCELLED" }
      - { name: weight_limit_grams, type: integer, source: input, description: "Remaining payload this move may fill, as declared at planning", constraints: "strictly positive" }
      - { name: planned_weight_grams, type: computed, description: "Sum of planned_weight_grams over every Package on this move whose commitment_status != VOIDED" }
      - { name: loaded_weight_grams, type: computed, description: "Sum of planned_weight_grams over every Package on this move whose sort_status == LOADED and commitment_status != VOIDED" }
      - { name: forward_capacity_grams, type: computed, description: "= weight_limit_grams - planned_weight_grams (floored at 0). May legitimately be negative before the floor is applied, which is what makes it the exact mirror of the Buildup under-capacity breach." }
      - { name: load_plan_tier, type: enum, source: computed, description: "UNDER_CAPACITY | AT_CAPACITY | RESERVE_TIER — derived from forward_capacity_grams", constraints: "one of UNDER_CAPACITY, AT_CAPACITY, RESERVE_TIER" }
      - { name: gateway_requirements, type: object, source: computed, default: {}, description: "destination_gateway_code -> requires_container map, written by POST /airhub/moves/{move_id}/gateway-requirements" }

  - name: Buildup
    parent: null
    common_fields: true
    fields:
      - { name: load_move_id, type: string, source: system, description: "FK -> LoadMove.id; owning load move" }
      - { name: destination_gateway_code, type: string, source: input, description: "Three-letter gateway this buildup consolidates for", constraints: "unique within load move" }
      - { name: rated_weight_grams, type: computed, description: "Sum of rated_weight_grams over every Package assigned to this buildup whose commitment_status != VOIDED" }
      - { name: container_limit_grams, type: integer, source: input, description: "Container weight ceiling in grams", constraints: "strictly positive" }
      - { name: hazardous_load, type: boolean, source: computed, default: false, description: "True when at least one assigned Package has commodity_class HAZMAT and commitment_status != VOIDED" }
      - { name: hazardous_weight_grams, type: computed, description: "Sum of rated_weight_grams over every assigned Package with commodity_class HAZMAT whose commitment_status != VOIDED" }
      - { name: hazardous_cap_grams, type: integer, source: input, default: 0, description: "Weight cap for hazardous content in grams; 0 means the buildup accepts no hazardous content at all", constraints: "0 or strictly positive" }
      - { name: requires_container, type: boolean, source: input, default: false, description: "When true, sealing this buildup requires it to be filled to at least container_limit_grams - CONTAINER_FILL_TOLERANCE_GRAMS" }
      - { name: status, type: enum, source: system, description: "OPEN | SEALED | WEIGHT_BREACH | CANCELLED", constraints: "one of OPEN, SEALED, WEIGHT_BREACH, CANCELLED" }
      - { name: load_plan_tier, type: enum, source: computed, description: "UNDER_CAPACITY | AT_CAPACITY | RESERVE_TIER — derived from this buildup's own rated_weight_grams vs container_limit_grams; re-derived whenever its own rated_weight_grams changes", constraints: "one of UNDER_CAPACITY, AT_CAPACITY, RESERVE_TIER" }

  - name: GroundFeeder
    parent: null
    common_fields: true
    fields:
      - { name: hub_id, type: string, source: system, description: "FK -> Hub.id; owning hub" }
      - { name: feeder_code, type: string, source: input, description: "Feeder run code", constraints: "unique within hub" }
      - { name: origin_station_code, type: string, source: input, description: "Three-letter regional origin station" }
      - { name: scheduled_departure_minutes, type: integer, source: input, description: "Local minutes-of-day this feeder departs for the hub", constraints: "strictly greater than 0" }
      - { name: stage_capacity_grams, type: integer, source: input, description: "Weight the staging lane can hold for this feeder", constraints: "strictly positive" }
      - { name: window_minutes, type: integer, source: input, description: "Length in minutes of the staging turnout window", constraints: "strictly positive" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | STAGING | LOADING | DEPARTED | CANCELLED", constraints: "one of SCHEDULED, STAGING, LOADING, DEPARTED, CANCELLED" }
      - { name: staged_weight_grams, type: computed, description: "Sum of planned_weight_grams over every Package staged on this feeder whose commitment_status != VOIDED" }

  - name: LaborShift
    parent: null
    common_fields: true
    fields:
      - { name: hub_id, type: string, source: system, description: "FK -> Hub.id; owning hub" }
      - { name: shift_code, type: string, source: input, description: "Shift code, e.g. N-A", constraints: "unique within hub" }
      - { name: start_minutes, type: integer, source: input, description: "Local minutes-of-day the shift starts; may cross midnight when start_minutes > end_minutes" }
      - { name: end_minutes, type: integer, source: input, description: "Local minutes-of-day the shift ends; may be numerically smaller than start_minutes for an overnight shift", constraints: "strictly not equal to start_minutes" }
      - { name: headcount, type: integer, source: input, description: "Operators manning this shift", constraints: "strictly positive" }
      - { name: productivity_grams_per_operator_hour, type: integer, source: input, description: "Certified sort throughput per operator per hour", constraints: "strictly positive" }
      - { name: forecast_volume_grams, type: integer, source: input, description: "Forecast volume for the shift's window", constraints: "strictly positive" }
      - { name: certified_for_hazmat, type: boolean, source: input, default: false, description: "Whether this shift carries HAZMAT certification" }
      - { name: volume_variance_pct, type: number, source: computed, description: "= round_half_up((live_planned_package_total - forecast_volume_grams) / forecast_volume_grams, 4); a signed fraction" }
      - { name: staffing_posture, type: enum, source: computed, description: "AMBER | RED | SATURATED | GREEN — derived aggregate that gates induction and feeder staging during the shift's window" }

  - name: OpsRun
    parent: null
    common_fields: false
    fields:
      - { name: hub_id, type: string, source: system, description: "FK -> Hub.id; owning hub" }
      - { name: run_index, type: integer, source: system, description: "Sequential checkpoint number within the hub, starting at 1; assigned from Hub.ops_run_index + 1 at creation" }
      - { name: minute_of_day, type: integer, source: input, description: "Hub-local minute-of-day the checkpoint is declared to run at" }
      - { name: level, type: enum, source: input, description: "MINOR | MAJOR", constraints: "one of MINOR, MAJOR" }
      - { name: verdict, type: enum, source: system, description: "ADVANCED | HELD | RELEASED", constraints: "one of ADVANCED, HELD, RELEASED" }

  - name: ServiceFailure
    parent: null
    common_fields: true
    fields:
      - { name: package_id, type: string, source: system, description: "FK -> Package.id; package whose commitment was missed" }
      - { name: cause_code, type: enum, source: input, description: "LATE_INBOUND | SORT_MISS | WEATHER | MECHANICAL | NO_SCAN | BAD_ADDRESS | REVENUE_PRORATE", constraints: "one of LATE_INBOUND, SORT_MISS, WEATHER, MECHANICAL, NO_SCAN, BAD_ADDRESS, REVENUE_PRORATE" }
      - { name: attributed_role, type: enum, source: computed, description: "CARRIER | CUSTOMER | WEATHER_EVENT | MECHANICAL_EVENT — derived from cause_code by fixed mapping and frozen at creation" }
      - { name: failure_minutes, type: integer, source: input, description: "Hub-local minute-of-day the miss was recorded" }
      - { name: refund_eligible, type: boolean, source: computed, description: "Derived at creation and frozen; true only when attributed_role == CARRIER and cause_code IN {LATE_INBOUND, SORT_MISS, NO_SCAN}" }
      - { name: refund_amount_cents, type: computed, description: "Provisional-or-final money-back-guarantee refund, in whole cents; 0 when refund_eligible is false" }
      - { name: status, type: enum, source: system, description: "OPEN | FINALIZED | DISPUTED | VOIDED", constraints: "one of OPEN, FINALIZED, DISPUTED, VOIDED" }

  - name: ServiceFailureClaim
    parent: null
    common_fields: false
    fields:
      - { name: service_failure_id, type: string, source: system, description: "FK -> ServiceFailure.id; the failure this claim speaks for" }
      - { name: claim_index, type: integer, source: system, description: "Sequential claim number within the failure, starting at 1; assigned from the failure's current claim count + 1" }
      - { name: outcome, type: enum, source: input, description: "OPEN | FINALIZED | DISPUTED | VOIDED", constraints: "one of OPEN, FINALIZED, DISPUTED, VOIDED" }
      - { name: actor_role, type: enum, source: system, description: "The X-User-Role that wrote this claim: RefundAdjuster | HubOpsManager | WeatherOfficer", constraints: "one of RefundAdjuster, HubOpsManager, WeatherOfficer" }
      - { name: note, type: string, source: input, description: "Free-text claim note" }
# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Hub
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CONGESTED
        trigger: "system (recompute_live_planned_package_total after any Package mutation on this hub)"
        actor: system
        preconditions:
          - "live_planned_package_total > floor(sort_window_minutes * CONGESTED_GRAMS_PER_WINDOW_MINUTE) and live_planned_package_total <= floor(sort_window_minutes * LOCKDOWN_GRAMS_PER_WINDOW_MINUTE)"
        side_effects:
          - "posture recomputed by calculations.live_planned_package_total + calculations.hub_posture"
      - from: CONGESTED
        to: OPEN
        trigger: "system (recompute_live_planned_package_total after any Package mutation on this hub)"
        actor: system
        preconditions:
          - "live_planned_package_total <= floor(sort_window_minutes * CONGESTED_GRAMS_PER_WINDOW_MINUTE)"
        side_effects:
          - "posture recomputed by calculations.hub_posture"
      - from: OPEN
        to: LOCKDOWN
        trigger: POST /airhub/hubs/{hub_id}/declare-contingency
        actor: WeatherOfficer
        preconditions:
          - "hub.contingency_mode == false"
        side_effects:
          - "contingency_mode = true"
          - "clears AWAITING_ASSIGNMENT packages to COMMITTED only after clear-contingency (see CONFIRMED→OPEN)"
      - from: CONGESTED
        to: LOCKDOWN
        trigger: POST /airhub/hubs/{hub_id}/declare-contingency
        actor: WeatherOfficer
        preconditions:
          - "hub.contingency_mode == false"
        side_effects:
          - "contingency_mode = true"
      - from: LOCKDOWN
        to: GROUND_STOP
        trigger: POST /airhub/hubs/{hub_id}/ground-stop
        actor: HubOpsManager
        preconditions:
          - "hub.contingency_mode == true"
        side_effects:
          - "Every LoadMove on this hub in status PLANNED or LOADING → REWORK_REQUIRED; each returns its LOADED packages to SECONDARY_SORTED (Package.sort_status LOADED → SECONDARY_SORTED)"
      - from: LOCKDOWN
        to: OPEN
        trigger: POST /airhub/hubs/{hub_id}/clear-contingency
        actor: HubOpsManager
        preconditions:
          - "hub.contingency_mode == true"
        side_effects:
          - "contingency_mode = false"
          - "Hub.posture recomputed by calculations.hub_posture; with contingency_mode false the posture returns to OPEN or CONGESTED purely from live_planned_package_total"
          # ---- Rule 4 cascade A, hop 1 (depth 4): clear-contingency at minute M with no alternate declared ----
          - "For every Package on this hub in handling_status DIVERTED whose commitment_status is REROUTED: commitment_status REROUTED → COMMITTED (AWAITING_ASSIGNMENT), final_commitment_minutes = null, service_level restored to its original committed level; the REROUTED ServiceFailure for that package is VOIDED"
          - "For every Package on this hub in handling_status HOLD_AT_HUB whose commitment_status is COMMITTED: commitment_status COMMITTED → UPGRADED_HELD with final_commitment_minutes = commitment_cutoff_minutes + REROUTE_ASSURANCE_BUFFER_MINUTES (360) — hop 2 of the divergence, independent of any aircraft state"
          - "Hop 3: each Package that just became UPGRADED_HELD emits exactly one ServiceFailure with cause_code REVENUE_PRORATE, attributed_role CUSTOMER, failure_minutes = current hub minute, status OPEN, refund_eligible false"
          - "Hop 4: each such ServiceFailure is created with refund_amount_cents computed by calculations.money_back_guarantee_refund, which is 0 for attributed_role CUSTOMER"
          - "For every Aircraft on this hub whose maintenance_hold is true and hub.contingency_mode is now false: Aircraft.status remains CANCELLED until POST /airhub/aircraft/{aircraft_id}/reinstate is called (reinstatement is explicit, never automatic)"
        note: "A hub whose contingency is cleared with no alternate_hub_id declared strands its diverted and held packages: they cannot be diverted again (no alternate route) and take the DOWNGRADE-equivalent assurance path instead."

  - entity: ArrivalBank
    initial_state: SCHEDULED
    terminal_states: [CLOSED, ABANDONED]
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "system (automatic when the first Aircraft in this bank reaches IN_FLIGHT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EN_ROUTE
        to: UNLOADING
        trigger: POST /airhub/banks/{bank_id}/begin-unload
        actor: SortSupervisor
        preconditions:
          - "bank.hydraulic_crew_available == true"
          - "at least one Aircraft in the bank has status LANDED"
          - "hub.posture != GROUND_STOP"
        side_effects:
          - "actual_start_minutes = current hub minute"
          - "every Aircraft in status LANDED for this bank → UNLOADING"
      - from: UNLOADING
        to: UNLOADED
        trigger: "system (automatic when every Aircraft in this bank has status UNLOADED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNLOADED
        to: CLOSED
        trigger: "system (automatic during POST /airhub/hubs/{hub_id}/run-ops when no Package on this bank is still NOT_INDUCTED)"
        actor: system
        preconditions: []
        side_effects:
          - "effective_sort_budget_minutes recomputed by calculations.effective_sort_budget"
      - from: EN_ROUTE
        to: ABANDONED
        trigger: POST /airhub/banks/{bank_id}/abandon
        actor: HubOpsManager
        preconditions:
          - "hub.contingency_mode == true"
          - "an OpsRun on this hub exists with level MAJOR and verdict HELD"
        side_effects:
          - "Every Aircraft in this bank with status SCHEDULED or IN_FLIGHT → CANCELLED; each emits exactly one ServiceFailure with cause_code WEATHER, attributed_role WEATHER_EVENT, refund_eligible false"
          - "Every Package on those aircraft → commitment_status DOWNGRADED with final_commitment_minutes = commitment_cutoff_minutes + REROUTE_ASSURANCE_BUFFER_MINUTES (360); service_level NEXT_DAY_AIR → SECOND_DAY_AIR"
      - from: UNLOADING
        to: ABANDONED
        trigger: POST /airhub/banks/{bank_id}/abandon
        actor: HubOpsManager
        preconditions:
          - "hub.contingency_mode == true"
        side_effects:
          - "Every Aircraft still UNLOADING or LANDED in this bank → CANCELLED, maintenance_hold = true"

  - entity: Aircraft
    initial_state: SCHEDULED
    terminal_states: []
    transitions:
      - from: SCHEDULED
        to: IN_FLIGHT
        trigger: POST /airhub/aircraft/{aircraft_id}/depart-origin
        actor: GatewayCoordinator
        preconditions:
          - "hub.posture != GROUND_STOP"
        side_effects:
          - "parent bank SCHEDULED → EN_ROUTE if it was SCHEDULED"
      - from: IN_FLIGHT
        to: LANDED
        trigger: POST /airhub/aircraft/{aircraft_id}/land
        actor: GatewayCoordinator
        preconditions:
          - "hub.posture != GROUND_STOP"
        side_effects:
          - "actual_arrival_minutes = current hub minute"
          - "inbound_weight_grams = declared inbound weight supplied at landing"
          - "maintenance_hold is NOT set even when the landing is late (weather and mechanical contingencies are declared at the hub, not at touchdown)"
      - from: LANDED
        to: UNLOADING
        trigger: POST /airhub/aircraft/{aircraft_id}/begin-unload
        actor: SortSupervisor
        preconditions:
          - "parent bank.status == UNLOADING"
          - "bank.hydraulic_crew_available == true"
          - "no other Aircraft on the same bank currently holds status UNLOADING — the bank has exactly one unload face (ERR_UNLOAD_FACE_OCCUPIED)"
        side_effects: []
      - from: UNLOADING
        to: UNLOADED
        trigger: POST /airhub/aircraft/{aircraft_id}/complete-unload
        actor: SortSupervisor
        preconditions:
          - "unload_completed_minutes supplied is >= actual_arrival_minutes"
        side_effects:
          - "unload_completed_minutes = supplied value"
          # ---- Rule 4 cascade B, hop 1 (depth 3): late unload at minute M ----
          - "For every Package on this aircraft whose commitment_cutoff_minutes <= current hub minute: commitment_status COMMITTED → DOWNGRADED (service_level NEXT_DAY_AIR → SECOND_DAY_AIR, final_commitment_minutes = commitment_cutoff_minutes + REROUTE_ASSURANCE_BUFFER_MINUTES (360)); hop 2 fires only where the hub's contingency is now on"
          - "If hub.contingency_mode == true: that same Package.commitment_status DOWNGRADED → UPGRADED_HELD with final_commitment_minutes overwritten to commitment_cutoff_minutes (the guarantee is lost outright rather than extended); hop 3 emits the ServiceFailure"
          - "Hop 3: each Package that reached UPGRADED_HELD by the hop-2 rewrite emits exactly one ServiceFailure with cause_code WEATHER, attributed_role WEATHER_EVENT, status OPEN, refund_eligible false"
          - "Parent bank recomputes toward UNLOADED by calculations.effective_sort_budget"
      - from: LANDED
        to: CANCELLED
        trigger: POST /airhub/aircraft/{aircraft_id}/cancel
        actor: HubOpsManager
        preconditions:
          - "no Package on this aircraft has sort_status other than UNSORTED"
        side_effects:
          - "maintenance_hold = true when cause_code == MECHANICAL"
          # ---- Rule 4 cascade B variant, hop 1 (depth 3) ----
          - "For every Package on this aircraft: commitment_status COMMITTED → UPGRADED_HELD with final_commitment_minutes = commitment_cutoff_minutes + REROUTE_ASSURANCE_BUFFER_MINUTES (360); hop 2 is the ServiceFailure emitted on each; hop 3 is the Hub.refund_liability recalculation"
          - "Hop 2: each such Package emits exactly one ServiceFailure with cause_code MECHANICAL, attributed_role MECHANICAL_EVENT, status OPEN, refund_eligible false"
          - "Hop 3: Hub.live_planned_package_total and the owning LaborShift.staffing_posture recompute because every UPGRADED_HELD package leaves the live total"
      - from: IN_FLIGHT
        to: IN_FLIGHT
        trigger: POST /airhub/aircraft/{aircraft_id}/divert-maintenance
        actor: WeatherOfficer
        preconditions:
          - "hub.contingency_mode == true"
          - "aircraft.maintenance_hold == false"
        side_effects:
          - "maintenance_hold = true"
          - "actual_arrival_minutes is cleared to null (the aircraft is re-routed to a maintenance station and has not arrived at this hub)"
          - "the parent bank's effective_sort_budget_minutes recomputes by calculations.effective_sort_budget"
        note: "A self-transition: the aircraft stays IN_FLIGHT but is now excluded from every unload calculation."
      - from: CANCELLED
        to: IN_FLIGHT
        trigger: POST /airhub/aircraft/{aircraft_id}/reinstate
        actor: HubOpsManager
        preconditions:
          - "hub.contingency_mode == false"
          - "aircraft.maintenance_hold == false"
        side_effects:
          - "actual_arrival_minutes = null, unload_completed_minutes = null, inbound_weight_grams = null"
          - "Packages on this aircraft keep commitment_status UPGRADED_HELD and are NOT automatically returned to COMMITTED; each must be cleared by POST /airhub/packages/{package_id}/clear-upgrade-hold"

  - entity: Package
    initial_state: NOT_INDUCTED
    terminal_states: []
    transitions:
      # ---- canonical: induction → (primary) sort → (secondary) sort → load ----
      - from: NOT_INDUCTED
        to: INDUCTED
        trigger: POST /airhub/packages/{package_id}/induct
        actor: SortOperator
        preconditions:
          - "hub.posture IN {OPEN, CONGESTED}"
          - "owning LaborShift whose window contains the current hub minute has staffing_posture != SATURATED"
          - "aircraft on this package has status UNLOADED"
          - "dimension_weight_grams >= 1"
        side_effects:
          - "induction_status = INDUCTED"
          - "rated_weight_grams calculated by calculations.rated_sort_weight"
          - "Hub.live_planned_package_total and the owning LaborShift.volume_variance_pct recompute"
      - from: NOT_INDUCTED
        to: REJECTED
        trigger: POST /airhub/packages/{package_id}/reject-induction
        actor: SortOperator
        preconditions: []
        side_effects:
          - "induction_status = REJECTED (terminal dimension; no further sort, load, or commitment action is possible)"
      - from: UNSORTED
        to: PRIMARY_SORTED
        trigger: POST /airhub/packages/{package_id}/primary-sort
        actor: SortOperator
        preconditions:
          - "induction_status == INDUCTED"
          - "hub.posture != LOCKDOWN"
          - "handling_status IN {NORMAL, ROUTED_TO_IRREGULAR} — a package already parked in the hazmat lane must clear that routing first"
          - "the target PRIMARY SortLane exists on this hub, has status AVAILABLE, has commodity_capability equal to this package's commodity_class, and current hub minute < certified_until_minutes"
          - "lane_load_grams + rated_weight_grams <= capacity_weight_grams"
        side_effects:
          - "sort_status = PRIMARY_SORTED"
          - "last_sort_minutes = current hub minute"
          - "handling_status NORMAL → ROUTED_TO_IRREGULAR when commodity_class IN {IRREGULAR, PERISHABLE} (automatic, not optional)"
          - "handling_status NORMAL → ROUTED_TO_HAZMAT when commodity_class == HAZMAT (automatic, not optional)"
          - "target lane lane_load_grams recalculated by calculations.sort_lane_load"
      - from: PRIMARY_SORTED
        to: SECONDARY_SORTED
        trigger: POST /airhub/packages/{package_id}/secondary-sort
        actor: SortOperator
        preconditions:
          - "handling_status != ROUTED_TO_IRREGULAR (the IRREGULAR lane must be resolved first)"
          - "current hub minute - last_sort_minutes <= SECONDARY_STAGE_BUDGET_MINUTES"
          - "the target SECONDARY SortLane exists, is AVAILABLE, has commodity_capability equal to this package's commodity_class, and current hub minute < certified_until_minutes"
          - "handling_status != DIVERTED"
          - "when handling_status == ROUTED_TO_HAZMAT the target lane's lane_kind must be HAZMAT"
        side_effects:
          - "sort_status = SECONDARY_SORTED"
          - "last_sort_minutes = current hub minute"
          - "if handling_status == ROUTED_TO_HAZMAT the target lane must have lane_kind HAZMAT; a HAZMAT package may not be secondary-sorted onto a non-HAZMAT lane"
      - from: PRIMARY_SORTED
        to: UNSORTED
        trigger: POST /airhub/packages/{package_id}/reclaim-lane
        actor: SortOperator
        preconditions: []
        side_effects:
          - "sort_status = UNSORTED (the package must be primary-sorted again; last_sort_minutes is preserved)"
          - "handling_status ROUTED_TO_IRREGULAR → NORMAL, ROUTED_TO_HAZMAT → NORMAL"
          - "source lane lane_load_grams recalculated by calculations.sort_lane_load"
      - from: SECONDARY_SORTED
        to: UNSORTED
        trigger: POST /airhub/packages/{package_id}/reclaim-lane
        actor: SortOperator
        preconditions: []
        side_effects:
          - "sort_status = UNSORTED; the secondary lane's load recomputes"
      - from: SECONDARY_SORTED
        to: LOADED
        trigger: POST /airhub/moves/{move_id}/load-package
        actor: LoadPlanner
        preconditions:
          - "commitment_posture == COMMITTED_OK"
          - "load move status IN {PLANNED, LOADING}"
          - "the move's aircraft is not CANCELLED and not maintenance_hold"
          - "destination buildup guard: onboarding is rejected when a Buildup for this destination gateway exists on this move whose rated_weight_grams - container_limit_grams is strictly inside (0, BREACH_TOLERANCE_GRAMS] (ERR_BUILDUP_UNDER_CAPACITY)"
          - "hazardous buildup weight cap: onboarding a HAZMAT package is rejected when the target Buildup's hazardous_weight_grams + rated_weight_grams > hazardous_cap_grams (ERR_HAZMAT_CAP_EXCEEDED)"
          - "this load move's forward_capacity_grams before onboarding must be <= SORT_BUDGET_GRAMS_CEILING (350000)"
          - "this load move's forward_capacity_grams after onboarding must be >= SORT_BUDGET_GRAMS_FLOOR (-20000) (ERR_LOAD_WEIGHT_EXCEEDED)"
        side_effects:
          - "sort_status = LOADED; LoadMove.loaded_weight_grams, LoadMove.planned_weight_grams and Buildup.rated_weight_grams recalculated by calculations.forward_capacity"
          - "Buildup.load_plan_tier recomputed by calculations.buildup_reserve_tier"
          - "if Buildup.rated_weight_grams - Buildup.container_limit_grams > BREACH_TOLERANCE_GRAMS then Buildup.status OPEN → WEIGHT_BREACH"
      - from: LOADED
        to: SECONDARY_SORTED
        trigger: POST /airhub/moves/{move_id}/unload-package
        actor: LoadPlanner
        preconditions: []
        side_effects:
          - "sort_status = SECONDARY_SORTED; move and buildup weights recalculated by calculations.forward_capacity"
      # ---- handling dimension: irregular / hazmat diversion, driven by a divergence gate ----
      - from: NORMAL
        to: ROUTED_TO_IRREGULAR
        trigger: POST /airhub/packages/{package_id}/route-irregular
        actor: SortSupervisor
        preconditions:
          - "commodity_class IN {IRREGULAR, PERISHABLE}"
          - "sort_status == UNSORTED"
          - "the target IRREGULAR SortLane exists on this hub, is AVAILABLE, and current hub minute < certified_until_minutes"
        side_effects:
          - "handling_status = ROUTED_TO_IRREGULAR"
          - "handling_posture recomputed to IRREGULAR_LANE"
      - from: ROUTED_TO_IRREGULAR
        to: NORMAL
        trigger: POST /airhub/packages/{package_id}/resolve-irregular
        actor: SortSupervisor
        preconditions:
          - "last_sort_minutes is null, or current hub minute <= last_sort_minutes + IRREGULAR_RESOLVE_BUDGET_MINUTES (45)"
        side_effects:
          - "handling_status = NORMAL; handling_posture recomputed to STANDARD"
      - from: ROUTED_TO_HAZMAT
        to: NORMAL
        trigger: POST /airhub/packages/{package_id}/resolve-hazmat
        actor: HazmatCertifier
        preconditions:
          - "last_sort_minutes is null, or current hub minute <= last_sort_minutes + IRREGULAR_RESOLVE_BUDGET_MINUTES (45)"
        side_effects:
          - "handling_status = NORMAL; handling_posture recomputed to STANDARD"
      - from: ROUTED_TO_IRREGULAR
        to: ROUTED_TO_HAZMAT
        trigger: POST /airhub/packages/{package_id}/route-hazmat
        actor: HazmatCertifier
        preconditions:
          - "commodity_class == HAZMAT"
          - "the HAZMAT SortLane exists on this hub, is AVAILABLE, and current hub minute < certified_until_minutes"
          - "last_sort_minutes is null, or current hub minute <= last_sort_minutes + IRREGULAR_RESOLVE_BUDGET_MINUTES (45)"
          - "the lane-freshness gate: last_sort_minutes is null, or current hub minute <= last_sort_minutes (a clock advanced strictly past the last sort minute closes this gate even while the budget window is still open)"
        side_effects:
          - "handling_status = ROUTED_TO_HAZMAT; handling_posture recomputed to HAZMAT_LANE"
          - "the IRREGULAR lane this package occupied releases its grams (calculations.sort_lane_load)"
      - from: NORMAL
        to: ROUTED_TO_HAZMAT
        trigger: POST /airhub/packages/{package_id}/route-hazmat
        actor: HazmatCertifier
        preconditions:
          - "commodity_class == HAZMAT"
          - "the HAZMAT SortLane exists on this hub, is AVAILABLE, and current hub minute < certified_until_minutes"
        side_effects:
          - "handling_status = ROUTED_TO_HAZMAT; handling_posture recomputed to HAZMAT_LANE"

  - entity: SortLane
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: SATURATED
        trigger: "system (automatic recompute by calculations.sort_lane_load after any primary or secondary sort onto this lane)"
        actor: system
        preconditions:
          - "lane_load_grams >= capacity_weight_grams"
        side_effects: []
      - from: SATURATED
        to: AVAILABLE
        trigger: "system (automatic recompute by calculations.sort_lane_load after any reclaim or load)"
        actor: system
        preconditions:
          - "lane_load_grams < capacity_weight_grams"
        side_effects: []
      - from: AVAILABLE
        to: CLOSED
        trigger: POST /airhub/lanes/{lane_id}/close
        actor: SortSupervisor
        preconditions: []
        side_effects:
          - "no further primary or secondary sort may target this lane"
      - from: CLOSED
        to: AVAILABLE
        trigger: POST /airhub/lanes/{lane_id}/reopen
        actor: SortSupervisor
        preconditions: []
        side_effects: []

  - entity: LoadMove
    initial_state: DRAFT
    terminal_states: [LOADED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PLANNED
        trigger: POST /airhub/moves/{move_id}/plan-load
        actor: LoadPlanner
        preconditions:
          - "the move's Aircraft.status != CANCELLED"
          - "the move's Aircraft.maintenance_hold == false"
          - "the move's Aircraft.status != UNLOADED is permitted; the outbound aircraft may still be on the ground"
        side_effects:
          - "planned_weight_grams and forward_capacity_grams recomputed by calculations.forward_capacity"
          - "load_plan_tier recomputed by calculations.buildup_reserve_tier"
      - from: PLANNED
        to: REWORK_REQUIRED
        trigger: "system (automatic when hub.posture becomes LOCKDOWN or GROUND_STOP)"
        actor: system
        preconditions: []
        side_effects:
          - "every Package on this move with sort_status LOADED → SECONDARY_SORTED; move weights recomputed by calculations.forward_capacity"
          - "every Buildup on this move keeps its status but its rated_weight_grams recompute"
      - from: LOADING
        to: REWORK_REQUIRED
        trigger: POST /airhub/hubs/{hub_id}/ground-stop
        actor: system
        preconditions: []
        side_effects:
          - "every Package on this move with sort_status LOADED → SECONDARY_SORTED"
      - from: REWORK_REQUIRED
        to: PLANNED
        trigger: POST /airhub/moves/{move_id}/replan
        actor: LoadPlanner
        preconditions:
          - "hub.contingency_mode == false"
        side_effects:
          - "load move is returned to the planning surface; no weights change until the next load"
      - from: PLANNED
        to: LOADING
        trigger: POST /airhub/moves/{move_id}/begin-loading
        actor: LoadPlanner
        preconditions:
          - "hub.posture != GROUND_STOP"
        side_effects: []
      - from: LOADING
        to: LOADED
        trigger: POST /airhub/moves/{move_id}/complete-load
        actor: LoadPlanner
        preconditions:
          - "every Buildup on this move satisfies rated_weight_grams <= container_limit_grams OR rated_weight_grams - container_limit_grams > BREACH_TOLERANCE_GRAMS (ERR_BUILDUP_UNDER_CAPACITY)"
          - "this move's planned_weight_grams <= weight_limit_grams + USE_IT_OR_LOSE_IT_TOLERANCE_GRAMS (ERR_LOAD_WEIGHT_EXCEEDED)"
          - "hub.posture IN {OPEN, CONGESTED}"
        side_effects:
          - "every Buildup on this move with status OPEN → SEALED"
          - "the move's Aircraft is marked ready for departure"
      - from: DRAFT
        to: CANCELLED
        trigger: POST /airhub/moves/{move_id}/cancel
        actor: LoadPlanner
        preconditions: []
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: POST /airhub/moves/{move_id}/cancel
        actor: LoadPlanner
        preconditions:
          - "no Package on this move has sort_status LOADED"
        side_effects:
          - "every Package on this move in sort_status SECONDARY_SORTED keeps that status; the move simply stops accepting packages"
      - from: REWORK_REQUIRED
        to: CANCELLED
        trigger: POST /airhub/moves/{move_id}/cancel
        actor: LoadPlanner
        preconditions: []
        side_effects: []

  - entity: Buildup
    initial_state: OPEN
    terminal_states: [CANCELLED]
    transitions:
      - from: OPEN
        to: SEALED
        trigger: POST /airhub/buildups/{buildup_id}/seal
        actor: LoadPlanner
        preconditions:
          - "rated_weight_grams <= container_limit_grams"
          - "rated_weight_grams - container_limit_grams is not strictly inside (0, BREACH_TOLERANCE_GRAMS] (ERR_BUILDUP_UNDER_CAPACITY)"
          - "when the owning LoadMove's declared gateway_requires_container for this destination_gateway_code is true: rated_weight_grams >= container_limit_grams - CONTAINER_FILL_TOLERANCE_GRAMS"
        side_effects:
          - "load_plan_tier recomputed by calculations.buildup_reserve_tier"
      - from: SEALED
        to: OPEN
        trigger: POST /airhub/buildups/{buildup_id}/unseal
        actor: LoadPlanner
        preconditions: []
        side_effects: []
      - from: OPEN
        to: WEIGHT_BREACH
        trigger: "system (automatic recompute by calculations.buildup_reserve_tier after any package load or unload on this buildup)"
        actor: system
        preconditions:
          - "rated_weight_grams - container_limit_grams > BREACH_TOLERANCE_GRAMS"
        side_effects:
          - "load_plan_tier recomputed to RESERVE_TIER"
      - from: WEIGHT_BREACH
        to: OPEN
        trigger: "system (automatic when rated_weight_grams drops back to <= container_limit_grams + BREACH_TOLERANCE_GRAMS via POST /airhub/moves/{move_id}/unload-package)"
        actor: system
        preconditions: []
        side_effects:
          - "load_plan_tier recomputed"
      - from: OPEN
        to: CANCELLED
        trigger: POST /airhub/buildups/{buildup_id}/cancel
        actor: LoadPlanner
        preconditions:
          - "no Package on this buildup has sort_status LOADED"
        side_effects: []
      - from: SEALED
        to: CANCELLED
        trigger: POST /airhub/buildups/{buildup_id}/cancel
        actor: LoadPlanner
        preconditions:
          - "the owning LoadMove.status != LOADED"
        side_effects: []

  - entity: GroundFeeder
    initial_state: SCHEDULED
    terminal_states: [DEPARTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: STAGING
        trigger: POST /airhub/feeders/{feeder_id}/begin-staging
        actor: FeederCoordinator
        preconditions:
          - "current hub minute >= scheduled_departure_minutes - window_minutes"
          - "current hub minute < scheduled_departure_minutes"
          - "the owning hub is inside its sort window: current hub minute >= sort_window_open_minutes and current hub minute < sort_window_close_minutes"
          - "no other GroundFeeder with status STAGING exists on this hub within window_minutes of this feeder's scheduled_departure_minutes"
          - "the owning LaborShift whose window contains the current hub minute has staffing_posture not SATURATED"
        side_effects:
          - "staged_weight_grams recomputed by calculations.feeder_stage_load"
      - from: STAGING
        to: LOADING
        trigger: POST /airhub/feeders/{feeder_id}/begin-loading
        actor: FeederCoordinator
        preconditions:
          - "staged_weight_grams <= stage_capacity_grams"
        side_effects: []
      - from: LOADING
        to: DEPARTED
        trigger: POST /airhub/feeders/{feeder_id}/depart
        actor: FeederCoordinator
        preconditions:
          - "staged_weight_grams <= stage_capacity_grams"
          - "the hub's posture IN {OPEN, CONGESTED}"
        side_effects:
          - "every Package staged on this feeder → commitment_status VOIDED, handling_status DIVERTED, final_commitment_minutes = null"
          - "each such Package emits exactly one ServiceFailure with cause_code REVENUE_PRORATE, attributed_role CUSTOMER, status OPEN, refund_eligible false"
          - "Hub.live_planned_package_total recomputed"
      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /airhub/feeders/{feeder_id}/cancel
        actor: FeederCoordinator
        preconditions: []
        side_effects: []
      - from: STAGING
        to: CANCELLED
        trigger: POST /airhub/feeders/{feeder_id}/cancel
        actor: FeederCoordinator
        preconditions: []
        side_effects:
          - "every Package staged on this feeder is released back to the sort surface; staged_weight_grams recomputed to 0"
      - from: LOADING
        to: CANCELLED
        trigger: POST /airhub/feeders/{feeder_id}/cancel
        actor: FeederCoordinator
        preconditions: []
        side_effects:
          - "every Package staged on this feeder is released back to the sort surface"

  - entity: LaborShift
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OVERRUN
        trigger: "system (automatic recompute by calculations.labor_variance_and_posture while the shift's window contains the current hub minute)"
        actor: system
        preconditions:
          - "volume_variance_pct >= LABOR_OVERRUN_VARIANCE_PCT (0.15)"
        side_effects:
          - "staffing_posture recomputed to SATURATED"
      - from: OVERRUN
        to: SCHEDULED
        trigger: "system (automatic when volume_variance_pct falls back below LABOR_OVERRUN_VARIANCE_PCT)"
        actor: system
        preconditions: []
        side_effects:
          - "staffing_posture recomputed by calculations.labor_variance_and_posture"
      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /airhub/shifts/{shift_id}/cancel
        actor: SortSupervisor
        preconditions:
          - "no Package induction in progress claims this shift (the shift is not the one currently gating induction)"
        side_effects: []
      - from: OVERRUN
        to: COMPLETED
        trigger: POST /airhub/shifts/{shift_id}/complete
        actor: SortSupervisor
        preconditions:
          - "staffing_posture != SATURATED; the shift must be brought back under LABOR_OVERRUN_VARIANCE_PCT before it can close"
        side_effects: []

  - entity: OpsRun
    initial_state: ADVANCED
    terminal_states: [ADVANCED, RELEASED]
    transitions:
      - from: HELD
        to: ADVANCED
        trigger: POST /airhub/ops-runs/{ops_run_id}/advance
        actor: HubOpsManager
        preconditions:
          - "hub.contingency_mode == true"
        side_effects:
          # ---- Rule 4 cascade B hop 2 (re-assignment #1) — cascade B's hop 1 is the clear-contingency Package rewrite ----
          - "For every Package on this hub in commitment_status DOWNGRADED: commitment_status DOWNGRADED → REROUTED with final_commitment_minutes = commitment_cutoff_minutes + NORMAL_REROUTE_BUFFER_MINUTES (240)"
          - "For every Aircraft in status CANCELLED whose maintenance_hold is true: Aircraft.status CANCELLED → IN_FLIGHT with actual_arrival_minutes cleared to null (hop 3 of cascade B)"
          - "Hub.ops_run_index += 1"
      - from: HELD
        to: RELEASED
        trigger: POST /airhub/ops-runs/{ops_run_id}/release
        actor: HubOpsManager
        preconditions:
          - "hub.contingency_mode == false"
        side_effects:
          # ---- Rule 4 cascade B hop 2 (re-assignment #2) — same seeds, different C-level effect and no Aircraft mutation ----
          - "For every Package on this hub in commitment_status DOWNGRADED: commitment_status DOWNGRADED → UPGRADED_HELD with final_commitment_minutes = commitment_cutoff_minutes + REROUTE_ASSURANCE_BUFFER_MINUTES (360)"
          - "each re-assigned Package emits exactly one ServiceFailure (cause_code LATE_INBOUND, attributed_role CARRIER, refund_eligible true, status OPEN)"
          - "no Aircraft on this hub changes status (the aircraft-level compensation is exclusive to /advance)"
          - "Hub.ops_run_index += 1"

  - entity: ServiceFailure
    initial_state: OPEN
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: POST /airhub/failures/{failure_id}/finalize
        actor: RefundAdjuster
        preconditions:
          - "refund_eligible == true"
        side_effects:
          - "refund_amount_cents is frozen at its current calculated value by calculations.money_back_guarantee_refund"
      - from: OPEN
        to: DISPUTED
        trigger: POST /airhub/failures/{failure_id}/dispute
        actor: RefundAdjuster
        preconditions:
          - "attributed_role != CARRIER (a carrier-attributed failure is a refund obligation, not a dispute candidate) (ERR_CARRIER_ATTRIBUTED_NOT_DISPUTABLE)"
        side_effects: []
      - from: DISPUTED
        to: OPEN
        trigger: POST /airhub/failures/{failure_id}/reopen
        actor: RefundAdjuster
        preconditions:
          - "hub.posture IN {OPEN, CONGESTED} (ERR_REOPEN_POSTURE_BLOCKED when the hub is LOCKDOWN or GROUND_STOP)"
        side_effects: []
      - from: OPEN
        to: VOIDED
        trigger: POST /airhub/failures/{failure_id}/void
        actor: RefundAdjuster
        preconditions:
          - "attributed_role == CARRIER"
        side_effects:
          # ---- Rule 9 compensating invariant: voiding a carrier refund restores the package's commitment ----
          - "the related Package (ServiceFailure.package_id) has commitment_status DOWNGRADED → COMMITTED with final_commitment_minutes = null and service_level restored; sort_status is untouched"
          - "Hub.live_planned_package_total recomputed"

  - entity: PackageCommitment
    initial_state: COMMITTED
    terminal_states: [VOIDED]
    transitions:
      - from: COMMITTED
        to: DOWNGRADED
        trigger: POST /airhub/packages/{package_id}/downgrade-commitment
        actor: CommitmentController
        preconditions:
          - "sort_status != LOADED"
          - "current hub minute > commitment_cutoff_minutes - SERVICE_DOWNGRADE_LEAD_MINUTES (30)"
          - "current hub minute <= commitment_cutoff_minutes + COMMITMENT_GRACE_MINUTES (60)"
          - "handling_status != HOLD_AT_HUB"
        side_effects:
          - "projected over Package.commitment_status; the Package's service_level NEXT_DAY_AIR → SECOND_DAY_AIR and final_commitment_minutes = commitment_cutoff_minutes + 360"
          - "exactly one ServiceFailure is emitted with status OPEN at the provisional rate, cause_code LATE_INBOUND, attributed_role CARRIER, refund_eligible true" 
      - from: COMMITTED
        to: DOWNGRADED
        trigger: POST /airhub/packages/{package_id}/ground-downgrade
        actor: CommitmentController
        preconditions:
          - "hub.posture IN {LOCKDOWN, GROUND_STOP}"
          - "sort_status != LOADED"
        side_effects:
          - "projected over Package.commitment_status; final_commitment_minutes = commitment_cutoff_minutes + 1800"
          - "exactly one ServiceFailure is emitted (WEATHER / WEATHER_EVENT / refund_eligible false / status OPEN)"
      - from: COMMITTED
        to: REROUTED
        trigger: POST /airhub/packages/{package_id}/diverge
        actor: CommitmentController
        preconditions:
          - "hub.contingency_mode == true"
          - "hub.alternate_hub_id is not null"
          - "handling_status != HOLD_AT_HUB"
          - "current hub minute > commitment_cutoff_minutes"
        side_effects:
          - "projected over Package.commitment_status and Package.handling_status (DIVERTED); final_commitment_minutes = commitment_cutoff_minutes + 240"
          - "exactly one ServiceFailure is emitted (LATE_INBOUND / CARRIER / refund_eligible true / status OPEN)"
      - from: COMMITTED
        to: UPGRADED_HELD
        trigger: POST /airhub/packages/{package_id}/upgrade-hold
        actor: CommitmentController
        preconditions:
          - "hub.contingency_mode == false"
          - "current hub minute > commitment_cutoff_minutes"
          - "the Package's inbound Aircraft.status == CANCELLED"
        side_effects:
          - "projected over Package.commitment_status and Package.handling_status (HOLD_AT_HUB); final_commitment_minutes = commitment_cutoff_minutes + 360"
          - "Hub.live_planned_package_total and the owning LaborShift.staffing_posture recompute"
      - from: DOWNGRADED
        to: VOIDED
        trigger: POST /airhub/packages/{package_id}/void
        actor: CommitmentController
        preconditions:
          - "sort_status != LOADED"
          - "no ServiceFailure on this package has status FINALIZED"
        side_effects:
          - "projected over Package.commitment_status (VOIDED) and Package.handling_status (DIVERTED); the package is excluded from every load and feeder calculation"
      - from: DOWNGRADED
        to: COMMITTED
        trigger: POST /airhub/failures/{failure_id}/void
        actor: RefundAdjuster
        preconditions:
          - "the failure being voided is attributed to this package, is attributed_role CARRIER, and is still OPEN"
        side_effects:
          - "commitment_status DOWNGRADED → COMMITTED; service_level restored to its originally committed level; final_commitment_minutes = null"
          - "Hub.live_planned_package_total and Hub.posture recompute; the hub's refund batch total recomputes by calculations.refund_batch_total"
      - from: REROUTED
        to: COMMITTED
        trigger: POST /airhub/packages/{package_id}/clear-reroute
        actor: CommitmentController
        preconditions:
          - "hub.contingency_mode == false"
        side_effects:
          - "projected over Package.commitment_status (COMMITTED) and Package.handling_status (NORMAL); any OPEN REROUTED ServiceFailure for this package is VOIDED"
      - from: UPGRADED_HELD
        to: COMMITTED
        trigger: POST /airhub/packages/{package_id}/clear-upgrade-hold
        actor: CommitmentController
        preconditions:
          - "the Package's inbound Aircraft.status != CANCELLED"
          - "hub.contingency_mode == false"
        side_effects:
          - "projected over Package.commitment_status (COMMITTED), Package.handling_status (NORMAL) and Package.sort_status (UNSORTED with last_sort_minutes cleared)"

  - entity: ServiceFailureClaim
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: POST /airhub/failures/{failure_id}/claims
        actor: RefundAdjuster
        preconditions:
          - "every appended claim's outcome may be any of OPEN, FINALIZED, DISPUTED or VOIDED; the failure's status is re-derived from the claim history by calculations.service_failure_status"
        side_effects:
          - "claim_index assigned from the failure's current claim count + 1"
          - "the parent ServiceFailure.status is re-derived by calculations.service_failure_status; its refund_amount_cents is recomputed by calculations.money_back_guarantee_refund"
      - from: OPEN
        to: DISPUTED
        trigger: POST /airhub/failures/{failure_id}/claims
        actor: HubOpsManager
        preconditions: []
        side_effects:
          - "claim_index assigned; parent status re-derived"
      - from: OPEN
        to: VOIDED
        trigger: POST /airhub/failures/{failure_id}/claims
        actor: WeatherOfficer
        preconditions: []
        side_effects:
          - "claim_index assigned; parent status re-derived"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, resolved by OCC on the parent's version)
# =============================================================================
concurrency_rules:
  - rule_id: downgrade-stale-package
    parent_entity: Package
    write_endpoint: "POST /airhub/packages/{package_id}/downgrade-commitment"
    occ_field: "expected_package_version"
    description: |
      A commitment downgrade sent against a Package whose version has advanced
      since the client last observed it is rejected: the client's view of the
      package is stale, and the downgrade decision must be re-derived from the
      current cutoff position rather than applied blindly. This is a true race
      because a second sequential downgrade request observes an unchanged
      commitment position and would itself legitimately succeed — only the
      version field distinguishes the stale writer.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: load-package-stale-move
    parent_entity: LoadMove
    write_endpoint: "POST /airhub/moves/{move_id}/load-package"
    occ_field: "expected_load_move_version"
    description: |
      Onboarding a Package onto a LoadMove whose version has advanced since the
      client last observed it is rejected: another writer has already changed
      the move's weight commitment, so the client's capacity arithmetic is
      stale. A second sequential load of a different package against an
      unchanged move is legitimate, so this is a genuine race and is resolved
      by the move's version rather than by any state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: hub_sort_constants
    trigger: "configuration registry — read by every other rule, never recomputed"
    algorithm: constants_registry
    formula: |
      # Every named threshold referenced elsewhere in this scaffold is pinned here so no
      # downstream reader has to invent a value.
      SERVICE_DOWNGRADE_LEAD_MINUTES   = 30     # the downgrade window opens 30 minutes before the cutoff
      COMMITMENT_GRACE_MINUTES         = 60     # the downgrade window closes 60 minutes after the cutoff
      SECONDARY_STAGE_BUDGET_MINUTES   = 60     # max minutes from primary sort to secondary sort
      IRREGULAR_RESOLVE_BUDGET_MINUTES = 45     # max minutes to clear an irregular or hazmat routing
      REROUTE_ASSURANCE_BUFFER_MINUTES = 360    # guarantee-assurance extension added to the cutoff
      NORMAL_REROUTE_BUFFER_MINUTES    = 240    # ordinary reroute extension added to the cutoff
      GROUND_DOWNGRADE_SLIP_MINUTES    = 1440   # extra slip applied only by the ground-posture downgrade
      CONTAINER_FILL_TOLERANCE_GRAMS   = 5000   # how far under the container limit a requires_container buildup may seal
      SORT_BUDGET_GRAMS_CEILING        = 350000 # onboarding is rejected above this forward capacity
      SORT_BUDGET_GRAMS_FLOOR          = -20000 # onboarding is rejected below this forward capacity
      USE_IT_OR_LOSE_IT_TOLERANCE_GRAMS= 10000  # completed-move overflow allowance
      DEFAULT_UNLOAD_BUDGET_MINUTES    = 45     # per-aircraft unload budget
    input_set: "no entity; a static registry"
    constants:
      SERVICE_DOWNGRADE_LEAD_MINUTES: 30
      COMMITMENT_GRACE_MINUTES: 60
      SECONDARY_STAGE_BUDGET_MINUTES: 60
      IRREGULAR_RESOLVE_BUDGET_MINUTES: 45
      REROUTE_ASSURANCE_BUFFER_MINUTES: 360
      NORMAL_REROUTE_BUFFER_MINUTES: 240
      GROUND_DOWNGRADE_SLIP_MINUTES: 1440
      BREACH_TOLERANCE_GRAMS: 25000
      CONTAINER_FILL_TOLERANCE_GRAMS: 5000
      SORT_BUDGET_GRAMS_CEILING: 350000
      SORT_BUDGET_GRAMS_FLOOR: -20000
      USE_IT_OR_LOSE_IT_TOLERANCE_GRAMS: 10000
      DEFAULT_UNLOAD_BUDGET_MINUTES: 45
    precision: "integers and whole minutes; no arithmetic"
    variants: []

  - name: refund_batch_total
    trigger: "GET /airhub/hubs/{hub_id}/refund-summary, and refreshed whenever a ServiceFailure on the hub is created or finalized"
    algorithm: combinatorial_formula
    mode: "(b) nested rounding where the order matters"
    formula: |
      mbg_gross(f) = round_half_up(pkg(f).planned_weight_grams / 1000.0 * rate(pkg(f).service_level))
                     + (MBG_PERISHABLE_SURCHARGE_CENTS if pkg(f).commodity_class == "PERISHABLE" else 0)
      per_failure(f) = round_half_up(mbg_gross(f) * (MBG_PROVISIONAL_PCT if f.status == "OPEN" else 1.0))
      batch_total_cents = sum(per_failure(f) for f in ServiceFailure
                              where f.hub_id == this hub and f.attributed_role == "CARRIER")
      # EVALUATION ORDER IS PINNED: round EACH failure's value first, THEN sum.
      # Summing first and rounding once afterwards is FORBIDDEN and gives a different number.
      # Two OPEN NEXT_DAY_AIR failures on 250050-gram GENERAL packages:
      #   gross per failure = round_half_up(250.050 * 550) = round_half_up(137527.5) = 137528
      #   pinned  (round each then sum): round_half_up(137528*0.70)=round_half_up(96269.6)=96270 each -> 192540
      #   forbidden (sum then round):    round_half_up(137528*2*0.70)=round_half_up(192539.2)          -> 192539
    input_set: "ServiceFailure rows on this hub with attributed_role == CARRIER, whatever their status; CUSTOMER, WEATHER_EVENT and MECHANICAL_EVENT rows contribute 0 and are excluded"
    constants:
      MBG_NEXT_DAY_CENTS_PER_KG: 550
      MBG_SECOND_DAY_CENTS_PER_KG: 300
      MBG_GROUND_CENTS_PER_KG: 140
      MBG_PERISHABLE_SURCHARGE_CENTS: 250
      MBG_PROVISIONAL_PCT: 0.70
    precision: "whole cents, round_half_up per failure BEFORE summing"
    variants:
      - name: round_each_then_sum
        when: "always — this is the pinned order"
        difference: "192540 for the two-failure example above"
      - name: sum_then_round_once
        when: "the forbidden reading of the same prose"
        difference: "192539 — the one-cent divergence this rule exists to pin"

  - name: rated_sort_weight
    trigger: "POST /airhub/packages/{package_id}/induct"
    algorithm: combinatorial_formula
    mode: "(a) formula with >=3 inputs and non-linear interaction"
    formula: |
      raw = max(package.planned_weight_grams, package.dimension_weight_grams, DIM_MINIMUM_GRAMS)
      rated_weight_grams = round_half_up(raw / RATE_ROUNDING_GRAMS) * RATE_ROUNDING_GRAMS
      # The DIM minimum and the rounding are both applied BEFORE any lane capacity comparison,
      # so a package whose planned weight is 1 gram still occupies 2000.
    input_set: "the single Package being inducted, regardless of induction_status or sort_status; only INDUCTED packages count toward lane load"
    constants:
      DIM_MINIMUM_GRAMS: 2000
      RATE_ROUNDING_GRAMS: 100
    precision: "whole grams, round_half_up to the nearest RATE_ROUNDING_GRAMS"
    variants:
      - name: planned_only
        when: "the caller supplies dimension_weight_grams equal to planned_weight_grams (the manifest path)"
        difference: "the max() collapses to planned_weight_grams, so rated_weight_grams == round_half_up(planned/100)*100 and no dimensional uplift occurs"
      - name: dimensional_uplift
        when: "dimension_weight_grams > planned_weight_grams (the volumetric path)"
        difference: "the larger of the two wins before rounding, so a light bulky package rates far above its manifested weight"

  - name: live_planned_package_total
    trigger: "any Package creation or mutation on the hub (induct, route, sort, load, downgrade, diverge, upgrade-hold, void, clear-*)"
    algorithm: aggregation
    formula: |
      live_planned_package_total =
        sum(pkg.planned_weight_grams
            for pkg in Package
            where pkg.hub_id == this hub
              and pkg.handling_status NOT IN {DIVERTED, HOLD_AT_HUB}
              and pkg.commitment_status NOT IN {VOIDED, UPGRADED_HELD})
      # Inclusion set is pinned by enum, not by adjective: a package leaves the live
      # total the moment it is diverted or parked, and returns when it is cleared.
    input_set: "Package rows on this hub whose handling_status NOT IN {DIVERTED, HOLD_AT_HUB} AND commitment_status NOT IN {VOIDED, UPGRADED_HELD}"
    constants: {}
    precision: "whole grams"
    variants:
      - name: provisional_at_induction
        when: "read while packages are still arriving (bank status EN_ROUTE or UNLOADING)"
        difference: "counts only already-created Package rows, so the hub can read OPEN or CONGESTED before the bank's volume has landed"
      - name: settled_after_close
        when: "read after every bank on the hub is CLOSED"
        difference: "the same formula over a now-stable row set; any delta against the provisional value is the induction shortfall, not a rounding artefact"

  - name: hub_posture
    trigger: "any recompute of live_planned_package_total"
    algorithm: threshold
    formula: |
      sort_window_minutes = hub.sort_window_close_minutes - hub.sort_window_open_minutes
      congestion_threshold_grams  = floor(sort_window_minutes * CONGESTED_GRAMS_PER_WINDOW_MINUTE)   # 2000
      lockdown_threshold_grams    = floor(sort_window_minutes * LOCKDOWN_GRAMS_PER_WINDOW_MINUTE)    # 5000
      if hub.contingency_mode == true:
        posture = LOCKDOWN              # contingency dominates regardless of volume
      elif live_planned_package_total >= lockdown_threshold_grams:
        posture = LOCKDOWN
      elif live_planned_package_total > congestion_threshold_grams:
        posture = CONGESTED
      else:
        posture = OPEN
      # GROUND_STOP is never reached by this function: it is only set by POST /airhub/hubs/{hub_id}/ground-stop.
      # BOUNDARY: open↔congested uses STRICT >, congestion↔lockdown uses >=.
      # A live total of exactly floor(sort_window_minutes*2000) is OPEN, not CONGESTED;
      # exactly floor(sort_window_minutes*5000) is LOCKDOWN, not CONGESTED.
    input_set: "the hub's live_planned_package_total and contingency_mode"
    constants:
      CONGESTED_GRAMS_PER_WINDOW_MINUTE: 2000
      LOCKDOWN_GRAMS_PER_WINDOW_MINUTE: 5000
    precision: "integer grams compared against floored integer thresholds"
    variants:
      - name: volume_driven
        when: "contingency_mode == false"
        difference: "posture is a pure function of volume against the two thresholds"
      - name: contingency_driven
        when: "contingency_mode == true"
        difference: "posture is LOCKDOWN for every volume, including a live total of 0 — clearing contingency is what restores the volume-driven branch"

  - name: effective_sort_budget
    trigger: "any Aircraft unload, cancellation, maintenance diversion, or reinstate within a bank"
    algorithm: projection
    formula: |
      minutes = sum(DEFAULT_UNLOAD_BUDGET_MINUTES - ac.unload_slack_minutes
                    for ac in Aircraft
                    where ac.bank_id == this bank
                      and ac.status IN {SCHEDULED, IN_FLIGHT, LANDED, UNLOADING, UNLOADED})
      effective_sort_budget_minutes = max(0, minutes)
      ac.unload_slack_minutes = min(max(ac.actual_arrival_minutes - ac.scheduled_arrival_minutes, 0), unload_slack_cap_minutes)
      unload_slack_cap_minutes = min(DEFAULT_UNLOAD_BUDGET_MINUTES, max(0, hub.sort_window_close_minutes - bank.actual_start_minutes))
      # A LATE arrival (slack > 0) DECREASES the bank's budget. An aircraft in status CANCELLED
      # contributes nothing at all — the empty-set case yields max(0, 0) == 0, and a bank
      # whose every aircraft is CANCELLED reports exactly 0 rather than a negative number.
    input_set: "Aircraft on this bank with status IN {SCHEDULED, IN_FLIGHT, LANDED, UNLOADING, UNLOADED}; status CANCELLED is excluded"
    constants:
      DEFAULT_UNLOAD_BUDGET_MINUTES: 45
    precision: "whole minutes"
    variants:
      - name: without_slack
        when: "an aircraft's actual_arrival_minutes is null or equals its scheduled_arrival_minutes"
        difference: "that aircraft contributes the full DEFAULT_UNLOAD_BUDGET_MINUTES"
      - name: with_slack
        when: "an aircraft's actual_arrival_minutes is strictly greater than its scheduled_arrival_minutes"
        difference: "the slack (capped at unload_slack_cap_minutes) is subtracted, so a 12-minute-late arrival contributes 33 rather than 45"

  - name: commitment_cutoff
    trigger: "Package creation (computed on read, never stored as an input)"
    algorithm: constraint_propagation
    formula: |
      if package.service_level == "NEXT_DAY_AIR":
        commitment_cutoff_minutes = hub.sort_window_close_minutes
      elif package.service_level == "SECOND_DAY_AIR":
        commitment_cutoff_minutes = hub.sort_window_close_minutes + SECOND_DAY_SLIP_MINUTES            # +1440
      else:  # GROUND
        commitment_cutoff_minutes = hub.sort_window_close_minutes + GROUND_SLIP_MINUTES                # +2880
      # Absolute hub-local minutes-of-day; independent of any clock. committed_posture
      # gates on the position of the current minute RELATIVE to this value.
    input_set: "the package's service_level and its hub's sort_window_close_minutes"
    constants:
      SECOND_DAY_SLIP_MINUTES: 1440
      GROUND_SLIP_MINUTES: 2880
    precision: "whole minutes"

  - name: sort_lane_load
    trigger: "any primary or secondary sort, any reclaim, any load or unload"
    algorithm: aggregation
    formula: |
      lane_load_grams = sum(pkg.rated_weight_grams
                            for pkg in Package
                            where pkg.assigned_lane_id == this lane
                              and pkg.sort_status IN {PRIMARY_SORTED, SECONDARY_SORTED})
      # A package that has been LOADED vacates its lane; a package that is UNSORTED
      # (after a reclaim) vacates it too. So lane_load_grams drops on load, not only on reclaim.
    input_set: "Package rows assigned to this lane whose sort_status IN {PRIMARY_SORTED, SECONDARY_SORTED}"
    constants: {}
    precision: "whole grams"

  - name: forward_capacity
    trigger: "any package load, unload, or load-move planning"
    algorithm: combinatorial_formula
    mode: "(c) circular-looking dependency with an explicitly pinned evaluation order"
    formula: |
      # EVALUATION ORDER IS PINNED AND MUST NOT BE REORDERED.
      # Step 1: derive the filled weight from the CURRENT row set, before any tier label is read.
      filled_grams        = sum(pkg.planned_weight_grams for pkg in Package on this move where pkg.commitment_status != VOIDED)
      # Step 2: derive the raw forward capacity from Step 1.
      raw_forward_grams   = load_move.weight_limit_grams - filled_grams
      # Step 3: derive the tier label from the RAW value (NOT from the floored one).
      load_plan_tier      = UNDER_CAPACITY if raw_forward_grams > 0
                            else AT_CAPACITY if raw_forward_grams == 0
                            else RESERVE_TIER
      # Step 4: only now apply the floor, purely for display and for the onboarding guard.
      forward_capacity_grams = max(0, raw_forward_grams)
      # The dependency looks circular because the tier also feeds the reserve routing of §1.5
      # responsibility; evaluation order is pinned so the value is well defined: label from
      # raw_forward_grams, display from the floored value. A move whose raw forward capacity is
      # -5000 reads forward_capacity_grams 0 AND load_plan_tier RESERVE_TIER on the same read.
    input_set: "Packages on this move whose commitment_status != VOIDED"
    constants: {}
    precision: "whole grams"
    variants:
      - name: planned_read
        when: "called during planning, before any package is onboard"
        difference: "filled_grams is 0 so raw_forward_grams equals weight_limit_grams exactly"
      - name: reserved_after_load
        when: "called after a package was loaded and then unloaded"
        difference: "the row set is identical to the pre-load set, so both the tier and the floored capacity return to their pre-load values with no drift"

  - name: buildup_reserve_tier
    trigger: "any package load or unload on this buildup"
    algorithm: threshold
    formula: |
      delta_grams = buildup.rated_weight_grams - buildup.container_limit_grams
      if delta_grams <= 0:
        load_plan_tier = UNDER_CAPACITY
      elif delta_grams <= BREACH_TOLERANCE_GRAMS:
        load_plan_tier = AT_CAPACITY        # the "decision band"
      else:
        load_plan_tier = RESERVE_TIER
      # BOUNDARY: delta == 0 is UNDER_CAPACITY (not AT_CAPACITY); delta == 25 is AT_CAPACITY.
      # The SAME function is called with two different subjects and therefore yields two
      # different answers on the same hub at the same instant: once with the Buildup's own
      # rated_weight_grams vs container_limit_grams, and once (as forward_capacity) with the
      # owning LoadMove's weight_limit_grams vs the move's filled weight. A hub can therefore
      # hold LoadMove.load_plan_tier == RESERVE_TIER while its Buildup reads UNDER_CAPACITY.
    input_set: "the buildup's rated_weight_grams and container_limit_grams; when called via forward_capacity, the owning move's weight_limit_grams and filled weight"
    constants:
      BREACH_TOLERANCE_GRAMS: 25000
    precision: "whole grams"
    variants:
      - name: within_band
        when: "0 < rated_weight_grams - container_limit_grams <= BREACH_TOLERANCE_GRAMS"
        difference: "AT_CAPACITY — the band inside which neither sealing nor breach fires, and the band that the DESTINATION_BUILDUP_GUARD uses as its rejection window"
      - name: threshold_discontinuity
        when: "rated_weight_grams - container_limit_grams == BREACH_TOLERANCE_GRAMS + 100"
        difference: "the same weight crosses AT_CAPACITY into RESERVE_TIER AND flips the Buildup from OPEN to WEIGHT_BREACH; because rated_weight_grams is always a multiple of RATE_ROUNDING_GRAMS (100), 100000 grams against a 100000 container is AT_CAPACITY while 100100 is a breach"

  - name: labor_variance_and_posture
    trigger: "any recompute of live_planned_package_total while a shift's window contains the current hub minute"
    algorithm: weighted_scoring
    formula: |
      volume_variance_pct = round_half_up((live_planned_package_total - shift.forecast_volume_grams) / shift.forecast_volume_grams, 4)
      capacity_grams = shift.headcount * shift.productivity_grams_per_operator_hour * (shift_duration_minutes / 60)
      if live_planned_package_total > capacity_grams:
        staffing_posture = RED
      elif volume_variance_pct >= LABOR_OVERRUN_VARIANCE_PCT:
        staffing_posture = SATURATED
      elif abs(volume_variance_pct) < LABOR_UNDERSTAFF_VARIANCE_PCT:
        staffing_posture = GREEN
      else:
        staffing_posture = AMBER
      shift_duration_minutes = (shift.end_minutes - shift.start_minutes + 1440) % 1440
      # PRECEDENCE IS PINNED: the capacity rule is checked BEFORE the variance rules, so a
      # shift that is both over capacity and over variance reads RED, never SATURATED.
      # BOUNDARY: variance exactly 0.15 is SATURATED (>=), variance exactly 0.0999 is GREEN.
      # A shift whose window does not contain the current minute does not participate at all.
    input_set: "the shift's forecast_volume_grams, headcount, productivity, window, and the hub's live_planned_package_total"
    constants:
      LABOR_OVERRUN_VARIANCE_PCT: 0.15
      LABOR_UNDERSTAFF_VARIANCE_PCT: 0.10
    precision: "4 decimal places, round_half_up"
    variants:
      - name: under_forecast
        when: "live_planned_package_total < forecast_volume_grams and the shortfall fraction is >= LABOR_UNDERSTAFF_VARIANCE_PCT"
        difference: "AMBER — under-forecast is not the same posture as a matched forecast; GREEN is reserved for |variance| < 0.10"
      - name: over_capacity
        when: "live_planned_package_total > headcount * productivity * duration"
        difference: "RED regardless of the variance fraction; RED also dominates SATURATED, which matters for the ground-feeder staging gate that only checks SATURATED"

  - name: feeder_stage_load
    trigger: "any package staged on or released from a GroundFeeder"
    algorithm: interval_merge
    formula: |
      staged_weight_grams = sum(pkg.planned_weight_grams
                                for pkg in Package
                                where pkg.staged_feeder_id == this feeder
                                  and pkg.commitment_status != VOIDED)
      capacity_grams = floor(feeder.stage_capacity_grams * (feeder.window_minutes / feeder.window_minutes))  # == stage_capacity_grams
      depart_capacity_grams = floor(feeder.stage_capacity_grams * FEEDER_DEPART_TOLERANCE_PCT)               # 0.95
      # Two different capacity numbers are live at once: STAGING accepts up to the full
      # stage_capacity_grams, but DEPART requires the staged load to be at or below
      # floor(stage_capacity_grams * 0.95). A feeder staged to 100% of its lane is
      # over its departure ceiling by 5% even though it is compliant while staging.
      # Boundary: staged == stage_capacity_grams -> STAGING ok, DEPART rejected with ERR_FEEDER_OVER_CAPACITY.
    input_set: "Package rows with staged_feeder_id == this feeder whose commitment_status != VOIDED"
    constants:
      FEEDER_DEPART_TOLERANCE_PCT: 0.95
    precision: "whole grams"
    variants:
      - name: staging_read
        when: "feeder.status == STAGING"
        difference: "compared against stage_capacity_grams in full"
      - name: departure_read
        when: "feeder.status == LOADING and the feeder is being departed"
        difference: "compared against floor(stage_capacity_grams * 0.95), so the compliant staging load can be non-compliant at departure"

  - name: money_back_guarantee_refund
    trigger: "ServiceFailure creation, and again at /finalize"
    algorithm: tiered_pricing
    formula: |
      if failure.attributed_role != "CARRIER":
        refund_amount_cents = 0
      else:
        if package.service_level == "NEXT_DAY_AIR":
          rate_cents_per_kg = MBG_NEXT_DAY_CENTS_PER_KG           # 550
        elif package.service_level == "SECOND_DAY_AIR":
          rate_cents_per_kg = MBG_SECOND_DAY_CENTS_PER_KG         # 300
        else:
          rate_cents_per_kg = MBG_GROUND_CENTS_PER_KG             # 140
        perishable_surcharge_cents = MBG_PERISHABLE_SURCHARGE_CENTS if package.commodity_class == "PERISHABLE" else 0
        refund_amount_cents = round_half_up(package.planned_weight_grams / 1000.0 * rate_cents_per_kg) + perishable_surcharge_cents
        if failure.status == "OPEN":
          refund_amount_cents = round_half_up(refund_amount_cents * MBG_PROVISIONAL_PCT)   # 0.70, the provisional variant
      # The rate multiplier is keyed on SERVICE_LEVEL while the surcharge is keyed on
      # COMMODITY_CLASS: two orthogonal dimensions, and a package can be a PERISHABLE
      # NEXT_DAY_AIR shipment and collect both. Ground failures are never eligible.
    input_set: "the related Package's service_level, commodity_class and planned_weight_grams, plus the failure's attributed_role and status"
    constants:
      MBG_NEXT_DAY_CENTS_PER_KG: 550
      MBG_SECOND_DAY_CENTS_PER_KG: 300
      MBG_GROUND_CENTS_PER_KG: 140
      MBG_PERISHABLE_SURCHARGE_CENTS: 250
      MBG_PROVISIONAL_PCT: 0.70
    precision: "whole cents, round_half_up"
    variants:
      - name: provisional_while_open
        when: "the failure is still OPEN"
        difference: "70% of the gross figure, round_half_up — a NEXT_DAY_AIR 2500-gram package yields 963 cents (round_half_up(1375 * 0.70) = round_half_up(962.5) = 963) rather than 1375"
      - name: final_on_finalize
        when: "POST /airhub/failures/{failure_id}/finalize has run"
        difference: "the gross figure with no provisional scaling — the same package yields 1375, so finalizing meets the NEXT_DAY_AIR guarantee in full"

  - name: service_failure_status
    trigger: "POST /airhub/failures/{failure_id}/finalize, /dispute, /reopen, /void"
    algorithm: aggregation
    formula: |
      # Aggregate gate on the ServiceFailure's own scoped history, pinned in all three parts:
      #   (a) source: dedupe ServiceFailureClaim rows where service_failure_id == this failure
      #   (b) window: claims with claim_index <= this failure's claim_sequence, inclusive on both ends
      #   (c) tie-break: order by claim_index ASC, then by created_at ASC, then by claim_id ASC
      #                  (never by id-as-random). The LAST claim in that order decides the status.
      resolving_claim = last(claims ordered by (claim_index ASC, created_at ASC, claim_id ASC))
      failure.status = resolving_claim.outcome    # OPEN | FINALIZED | DISPUTED | VOIDED
      # A failure with zero claims is OPEN by construction from its initial_state.
    input_set: "ServiceFailureClaim rows scoped to this failure with claim_index <= claim_sequence"
    constants: {}
    precision: "no arithmetic; a total order over claims"

  - name: service_failure_attribution
    trigger: "ServiceFailure creation (frozen at creation, never recalculated)"
    algorithm: constraint_propagation
    formula: |
      CARRIER           <- {LATE_INBOUND, SORT_MISS, NO_SCAN}
      CUSTOMER          <- {BAD_ADDRESS, REVENUE_PRORATE}
      WEATHER_EVENT     <- {WEATHER}
      MECHANICAL_EVENT  <- {MECHANICAL}
      refund_eligible = (attributed_role == "CARRIER")
      # Frozen at creation: a later POST /_clock advance or a hub posture change never
      # re-derives attributed_role or refund_eligible for an existing failure.
    input_set: "the failure's cause_code"
    constants: {}
    precision: "no arithmetic; a fixed mapping"

  - name: labor_queue_triage
    trigger: "GET /airhub/hubs/{hub_id}/triage"
    algorithm: threshold
    formula: |
      containing = the LaborShift on this hub whose declared window contains the current hub minute M
                   (for start_minutes < end_minutes: start_minutes <= M < end_minutes;
                    for an overnight window start_minutes > end_minutes: M >= start_minutes or M < end_minutes)
      if containing is null:
        triage = NO_SHIFT
      elif containing.staffing_posture == "RED":
        triage = SHED_TO_NEXT_WINDOW
      elif containing.staffing_posture == "SATURATED":
        triage = THROTTLE_INDUCTION
      else:
        triage = ACCEPT
      # RED dominates SATURATED here exactly as it does in calculations.labor_variance_and_posture,
      # so a shift that is both over capacity and over variance sheds rather than throttles.
      # This is the observable surface for the depth-4 contingency cascade: a cascade that drives the
      # containing shift to RED is visible as SHED_TO_NEXT_WINDOW even though RED itself blocks no endpoint.
    input_set: "the containing LaborShift's staffing_posture, or null when no shift covers the current minute"
    constants: {}
    precision: "no arithmetic; an enum selection"

  - name: commitment_posture
    trigger: "any mutation of commitment_status, sort_status, handling_status, or the aircraft's status"
    algorithm: constraint_propagation
    formula: |
      if commitment_status in {"REROUTED", "UPGRADED_HELD"}:
        commitment_posture = REROUTE_PENDING
      elif commitment_status == "DOWNGRADED":
        commitment_posture = DOWNGRADE_PENDING
      elif commitment_status == "COMMITTED" and sort_status == "LOADED":
        commitment_posture = COMMITTED_OK
      else:
        commitment_posture = COMMITTED_OK
      # This is the gate that POST /airhub/packages/{id}/secondary-sort reads; a package whose
      # commitment has been downgraded observes DOWNGRADE_PENDING and is not loadable.
    input_set: "the package's commitment_status and sort_status"
    constants: {}
    precision: "no arithmetic"

  - name: concourse_width_rating
    trigger: "whenever two SortLanes of the same lane_kind are concurrently open on one hub"
    algorithm: interval_merge
    formula: |
      # Second of the two sort-lane metrics, keyed on lane_KIND rather than lane identity.
      # Two adjacent PRIMARY lanes whose closed-open minute intervals touch at a single
      # point (a.end == b.start) are CREDITED with an additional CONCOURSE_MERGE_CREDIT_MINUTES
      # of usable width — they merge into one continuous face. Two lanes that miss by one
      # minute (a.end == b.start - 1) do not merge and the credit is zero.
      open_intervals = sorted([(lane.turnout_start_minutes, lane.turnout_end_minutes) for lane in SortLane
                               where lane.hub_id == this hub and lane.lane_kind == this lane_kind and lane.status != CLOSED],
                              key=lambda iv: (iv[0], iv[1]))
      merged_minutes = sum(b.end - a.end for a, b in zip(open_intervals, open_intervals[1:]) if b.start <= a.end)
      concourse_width_rating = merged_minutes * CONCOURSE_MERGE_CREDIT_MINUTES
      # DISTINCT from sort_lane_load: sort_lane_load is a weight metric on ONE lane;
      # concourse_width_rating is a minute metric across a PAIR of lanes. They differ in
      # metric (grams vs minutes), in subject cardinality (one lane vs two), and in the
      # geometric treatment of adjacency (identical occupancy vs touching intervals).
    input_set: "SortLane rows on this hub with the same lane_kind and status != CLOSED, ordered by (turnout_start_minutes ASC, turnout_end_minutes ASC)"
    constants:
      CONCOURSE_MERGE_CREDIT_MINUTES: 4
    precision: "whole minutes, then whole credit units"
    variants:
      - name: adjacent_touching
        when: "two same-kind lanes' intervals satisfy b.start == a.end exactly"
        difference: "the pair merges and credits 4 units per merged minute"
      - name: adjacent_gapped
        when: "b.start == a.end + 1"
        difference: "no merge, zero credit — a single minute of gap disables the whole merge"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "Envelope gate: a declared X-User-Role, X-User-ID present for every entity_backed role, and a request whose body carries only declared input fields with the required ones present and correctly typed"
    error_id: "ERR_UNAUTHENTICATED / ERR_INVALID_REQUEST"
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The acting role must be permitted on the endpoint (peer-role ownership or segregation-of-duties conflict)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path resource must exist, validated left-to-right: hub, then bank, then aircraft, then package, then load move, then buildup"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: existence
    check: "Every FK supplied in a request body must exist within the same hub scope, validated in the order the endpoint's input list declares"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /airhub/packages, POST /sort-lanes, POST /load-moves, POST /ground-feeders, POST /service-failures"
  - priority: 5
    category: business_safety
    check: "A HAZMAT package may not be loaded into a destination buildup whose hazardous_cap_grams it would breach"
    error_id: ERR_HAZMAT_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /airhub/moves/{move_id}/load-package"
  - priority: 6
    category: business_safety
    check: "The hub must not be in GROUND_STOP, and must not be in LOCKDOWN, for any induction or load action"
    error_id: ERR_POSTURE_BLOCKS_INDUCTION
    http_status: 409
    applies_to: "POST /airhub/packages/{package_id}/induct, POST /airhub/moves/{move_id}/load-package, POST /airhub/aircraft/{aircraft_id}/depart-origin, POST /airhub/aircraft/{aircraft_id}/land"
  - priority: 7
    category: business_temporal
    check: "A SortLane must be certified at the current hub minute (current minute strictly before certified_until_minutes) for any sort targeting it"
    error_id: ERR_LANE_CERTIFICATION_LAPSED
    http_status: 409
    applies_to: "POST /airhub/packages/{package_id}/primary-sort, POST /airhub/packages/{package_id}/secondary-sort"
  - priority: 8
    category: business_constraint
    check: "A SortLane must be open and have commodity capability matching the package; no other Aircraft on the same bank may already hold status UNLOADING"
    error_id: ERR_LANE_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /airhub/packages/{package_id}/primary-sort, POST /airhub/packages/{package_id}/secondary-sort, POST /airhub/aircraft/{aircraft_id}/begin-unload"
  - priority: 9
    category: business_constraint
    check: "The destination buildup guard and the hazmat cap guard, checked before any load is written"
    error_id: ERR_BUILDUP_UNDER_CAPACITY
    http_status: 409
    applies_to: "POST /airhub/moves/{move_id}/load-package, POST /airhub/buildups/{buildup_id}/seal"
  - priority: 10
    category: business_fiscal
    check: "Weight capacity: the load move's forward capacity floor, the feeder's departure ceiling, and the feeder's turnout-window exclusivity"
    error_id: "ERR_LOAD_WEIGHT_EXCEEDED / ERR_FEEDER_OVER_CAPACITY / ERR_FEEDER_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /airhub/moves/{move_id}/load-package, POST /airhub/moves/{move_id}/complete-load, POST /airhub/feeders/{feeder_id}/depart"
  - priority: 11
    category: state
    check: "The target resource must be in a state that admits this transition, including the derived handling_posture and staffing_posture gates and every contingency-dependent precondition"
    error_id: "ERR_INVALID_STATE / ERR_CONTINGENCY_NOT_DECLARED / ERR_HUB_NOT_LOCKED / ERR_NO_ALTERNATE_HUB / ERR_CARRIER_ATTRIBUTED_NOT_DISPUTABLE / ERR_LANE_CAPACITY_EXCEEDED / ERR_SORT_STAGE_BUDGET_EXCEEDED / ERR_IRREGULAR_RESOLVE_BUDGET_EXCEEDED / ERR_CUTOFF_NOT_REACHED / ERR_COMMITMENT_GRACE_EXCEEDED / ERR_AIRCRAFT_NOT_CANCELLED / ERR_SORT_PENDING / ERR_FINALIZED_FAILURE_PRESENT / ERR_BANK_NOT_UNLOADING / ERR_HYDRAULIC_CREW_UNAVAILABLE / ERR_LATE_UNLOAD_REGRESSION / ERR_UNLOAD_FACE_OCCUPIED / ERR_DUPLICATE_LIVE_PACKAGE / ERR_ACK_MISMATCH / ERR_CLOCK_OUT_OF_ORDER"
    http_status: 409
    applies_to: "all state transition endpoints"
  - priority: 12
    category: concurrency
    check: "expected_<parent>_version must equal the parent resource's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /airhub/packages/{package_id}/downgrade-commitment, POST /airhub/moves/{move_id}/load-package"

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Hub + logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: pin the server's logical clock. The current hub minute is (UTC hour*60 + minute) plus 1440 when the clock's UTC time is strictly before 12:00Z — the hub operating day begins at 12:00Z and rolls into the 1440+ band after midnight. So 23:00Z reads minute 1380, 02:00Z reads minute 1560, and 06:01Z reads 1801. Every hub-local minute comparison in this scaffold uses that figure. Default at server startup is 2026-09-01T00:00:00Z (minute 1440), so an unset clock sits at the start of a 1440 open / 1560 close window, and the server never falls back to wall-clock time. Moving the clock strictly backwards is rejected with ERR_CLOCK_OUT_OF_ORDER." 
    roles: [HubOpsManager]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["the logical clock reads exactly current_utc for every subsequent read; no entity is mutated"]
  - method: POST
    path: "/airhub/hubs"
    description: "Create a hub"
    roles: [HubOpsManager]
    code: 201
    input: [iata_code, name, sort_window_open_minutes, sort_window_close_minutes, "alternate_hub_id?"]
    output: Hub
    side_effects: ["posture=OPEN, contingency_mode=false, ops_run_index=0, live_planned_package_total=0"]
  - method: GET
    path: "/airhub/hubs"
    description: "List hubs"
    roles: [HubOpsManager, SortSupervisor, SortOperator, LoadPlanner, CommitmentController, FeederCoordinator, GatewayCoordinator, HazmatCertifier, WeatherOfficer, RefundAdjuster]
    code: 200
    input: ["iata_code?", "alternate_hub_id?", "posture?", "limit?", "offset?"]
    output: "Hub[]"
    side_effects: []
  - method: GET
    path: "/airhub/hubs/{hub_id}"
    description: "Get a hub"
    roles: [HubOpsManager, SortSupervisor, SortOperator, LoadPlanner, CommitmentController, FeederCoordinator, GatewayCoordinator, HazmatCertifier, WeatherOfficer, RefundAdjuster]
    code: 200
    input: []
    output: Hub
    side_effects: []
  - method: POST
    path: "/airhub/hubs/{hub_id}/declare-contingency"
    description: "Declare a weather or mechanical contingency; forces the hub into LOCKDOWN"
    roles: [WeatherOfficer]
    code: 200
    input: []
    output: Hub
    side_effects: ["contingency_mode=true", "posture recomputed by calculations.hub_posture (LOCKDOWN)", "increments Hub.version by 1"]
  - method: POST
    path: "/airhub/hubs/{hub_id}/clear-contingency"
    description: "Clear the contingency; begins the stranding cascade for diverted and held packages"
    roles: [HubOpsManager]
    code: 200
    input: []
    output: Hub
    side_effects:
      - "contingency_mode=false; posture recomputed by calculations.hub_posture"
      - "REROUTED packages -> COMMITTED (AWAITING_ASSIGNMENT) with final_commitment_minutes=null"
      - "HOLD_AT_HUB COMMITTED packages -> UPGRADED_HELD with final_commitment_minutes=commitment_cutoff_minutes+360"
      - "each such package emits one ServiceFailure (REVENUE_PRORATE / CUSTOMER / refund_eligible=false) computed by calculations.money_back_guarantee_refund"
      - "increments Hub.version by 1"
  - method: POST
    path: "/airhub/hubs/{hub_id}/ground-stop"
    description: "Escalate a LOCKDOWN hub to GROUND_STOP and force every active load move into rework"
    roles: [HubOpsManager]
    code: 200
    input: []
    output: Hub
    side_effects: ["posture=GROUND_STOP", "every PLANNED or LOADING LoadMove -> REWORK_REQUIRED and returns its LOADED packages to SECONDARY_SORTED", "increments Hub.version by 1"]
  - method: POST
    path: "/airhub/hubs/{hub_id}/run-ops"
    description: "Run an operations checkpoint; records an OpsRun with verdict HELD, ADVANCED, or RELEASED"
    roles: [HubOpsManager]
    code: 201
    input: [minute_of_day, level]
    output: OpsRun
    side_effects: ["OpsRun created with run_index = hub.ops_run_index + 1 and verdict HELD", "Hub.ops_run_index incremented by 1", "Hub.version incremented by 1", "banks whose packages are all induced may close"]

  # --- ArrivalBank ---
  - method: POST
    path: "/airhub/banks"
    description: "Create an inbound arrival bank"
    roles: [HubOpsManager]
    code: 201
    input: [hub_id, bank_code, scheduled_start_minutes, scheduled_end_minutes, "hydraulic_crew_available?"]
    output: ArrivalBank
    side_effects: ["status=SCHEDULED, actual_start_minutes=null, effective_sort_budget_minutes=0"]
  - method: GET
    path: "/airhub/banks"
    description: "List arrival banks, filterable by hub or status"
    roles: [HubOpsManager, SortSupervisor, SortOperator, LoadPlanner, CommitmentController, FeederCoordinator, GatewayCoordinator, HazmatCertifier, WeatherOfficer, RefundAdjuster]
    code: 200
    input: ["hub_id?", "status?", "limit?", "offset?"]
    output: "ArrivalBank[]"
    side_effects: []
  - method: GET
    path: "/airhub/banks/{bank_id}"
    description: "Get an arrival bank"
    roles: [HubOpsManager, SortSupervisor, SortOperator, LoadPlanner, CommitmentController, FeederCoordinator, GatewayCoordinator, HazmatCertifier, WeatherOfficer, RefundAdjuster]
    code: 200
    input: []
    output: ArrivalBank
    side_effects: []
  - method: POST
    path: "/airhub/banks/{bank_id}/begin-unload"
    description: "Open the unload face for every landed aircraft in the bank"
    roles: [SortSupervisor]
    code: 200
    input: []
    output: ArrivalBank
    side_effects: ["actual_start_minutes=current hub minute", "status=UNLOADING", "the unload face is opened; each aircraft still begins and completes its own unload one at a time", "increments ArrivalBank.version by 1"]
  - method: POST
    path: "/airhub/banks/{bank_id}/abandon"
    description: "Abandon a bank under contingency; cancels its unfinished aircraft and downgrades their packages"
    roles: [HubOpsManager]
    code: 200
    input: []
    output: ArrivalBank
    side_effects: ["status=ABANDONED", "unfinished aircraft -> CANCELLED (maintenance_hold=true when still UNLOADING)", "each cancelled aircraft's packages -> DOWNGRADED with final_commitment_minutes=commitment_cutoff_minutes+360 and service_level NEXT_DAY_AIR->SECOND_DAY_AIR", "each emits one WEATHER ServiceFailure", "increments ArrivalBank.version by 1"]

  # --- Aircraft ---
  - method: POST
    path: "/airhub/aircraft"
    description: "Create an aircraft within an arrival bank"
    roles: [GatewayCoordinator]
    code: 201
    input: [bank_id, tail_number, origin_station_code, scheduled_arrival_minutes, capacity_weight_grams]
    output: Aircraft
    side_effects: ["status=SCHEDULED, maintenance_hold=false"]
  - method: GET
    path: "/airhub/aircraft"
    description: "List aircraft, filterable by bank"
    roles: [HubOpsManager, SortSupervisor, SortOperator, LoadPlanner, CommitmentController, FeederCoordinator, GatewayCoordinator, HazmatCertifier, WeatherOfficer, RefundAdjuster]
    code: 200
    input: ["bank_id?", "status?", "limit?", "offset?"]
    output: "Aircraft[]"
    side_effects: []
  - method: GET
    path: "/airhub/aircraft/{aircraft_id}"
    description: "Get an aircraft"
    roles: [HubOpsManager, SortSupervisor, SortOperator, LoadPlanner, CommitmentController, FeederCoordinator, GatewayCoordinator, HazmatCertifier, WeatherOfficer, RefundAdjuster]
    code: 200
    input: []
    output: Aircraft
    side_effects: []
  - method: POST
    path: "/airhub/aircraft/{aircraft_id}/depart-origin"
    description: "Put the aircraft in flight toward this hub"
    roles: [GatewayCoordinator]
    code: 200
    input: []
    output: Aircraft
    side_effects: ["status=IN_FLIGHT", "parent bank SCHEDULED->EN_ROUTE", "increments Aircraft.version by 1"]
  - method: POST
    path: "/airhub/aircraft/{aircraft_id}/land"
    description: "Land the aircraft and stamp its actual arrival"
    roles: [GatewayCoordinator]
    code: 200
    input: [inbound_weight_grams]
    output: Aircraft
    side_effects: ["status=LANDED", "actual_arrival_minutes=current hub minute", "increments Aircraft.version by 1"]
  - method: POST
    path: "/airhub/aircraft/{aircraft_id}/begin-unload"
    description: "Begin unloading a landed aircraft"
    roles: [SortSupervisor]
    code: 200
    input: []
    output: Aircraft
    side_effects: ["status=UNLOADING", "bank recomputes toward UNLOADING", "increments Aircraft.version by 1"]
  - method: POST
    path: "/airhub/aircraft/{aircraft_id}/complete-unload"
    description: "Complete the unload and apply the commitment cutoff test to every package aboard"
    roles: [SortSupervisor]
    code: 200
    input: [unload_completed_minutes]
    output: Aircraft
    side_effects: ["status=UNLOADED", "packages whose commitment_cutoff_minutes <= current hub minute -> DOWNGRADED (+360); under contingency they rewrite to UPGRADED_HELD (final_commitment_minutes=commitment_cutoff_minutes) and each emits one WEATHER ServiceFailure", "bank effective_sort_budget_minutes recomputed by calculations.effective_sort_budget", "increments Aircraft.version by 1"]
  - method: POST
    path: "/airhub/aircraft/{aircraft_id}/cancel"
    description: "Cancel an aircraft before any of its packages have been sorted"
    roles: [HubOpsManager]
    code: 200
    input: [cause_code]
    output: Aircraft
    side_effects: ["status=CANCELLED", "maintenance_hold=true when cause_code=MECHANICAL", "every package aboard -> UPGRADED_HELD (final_commitment_minutes=commitment_cutoff_minutes+360) and each emits one MECHANICAL ServiceFailure", "Hub.live_planned_package_total and the owning LaborShift.staffing_posture recompute", "increments Aircraft.version by 1"]
  - method: POST
    path: "/airhub/aircraft/{aircraft_id}/divert-maintenance"
    description: "Divert an in-flight aircraft to a maintenance station (self-transition)"
    roles: [WeatherOfficer]
    code: 200
    input: []
    output: Aircraft
    side_effects: ["maintenance_hold=true", "actual_arrival_minutes cleared to null", "aircraft remains IN_FLIGHT", "parent bank effective_sort_budget_minutes recomputed", "increments Aircraft.version by 1"]
  - method: POST
    path: "/airhub/aircraft/{aircraft_id}/reinstate"
    description: "Return a cancelled aircraft to service once the contingency is cleared"
    roles: [HubOpsManager]
    code: 200
    input: []
    output: Aircraft
    side_effects: ["status=IN_FLIGHT with actual_arrival_minutes, unload_completed_minutes and inbound_weight_grams cleared", "packages stay UPGRADED_HELD until individually cleared", "increments Aircraft.version by 1"]

