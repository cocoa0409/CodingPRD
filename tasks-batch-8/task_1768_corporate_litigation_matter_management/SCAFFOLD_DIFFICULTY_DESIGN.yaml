    - name: reserve_recognition_evaluation_order_circular
      grounds:
        - calculations.reserve_recognition
        - calculations.matter_accrual_rollup
        - entities.Matter.fields.reserve_amount_cents
      distinguishing_aspect: |
        Mode (c) circular-looking dependency: reserve depends on exposure_tier, which depends
        on the exposure triplet, while reserve also subtracts accrued_to_date_cents which is
        itself an aggregate over postings; the scaffold pins evaluation order
        (tier table -> probability scale -> subtract accrued -> floor at zero) so that a
        TIER_2 matter at prob=60 with 400000 accrued yields max(0, 2500000*60/100 - 400000) = 1100000,
        and reopening restores the full 1500000 by skipping the accrued subtraction.
