  - rule_id: resource_temporal_overlap
    instances:

      - name: settlement_windows_may_abut_but_never_intersect_for_one_partner
        grounds:
          - validations[priority=62]
          - entities.SettlementBatch.fields.window_start
          - entities.SettlementBatch.fields.window_end
          - endpoints[POST /oversight/settlement-batches]
        distinguishing_aspect: |
          The contended resource is a Partner's settlement calendar and the
          interval semantics are HALF-OPEN [window_start, window_end): a batch
          starting exactly where the previous one ends is ACCEPTED (201), a batch
          ending exactly where the previous one starts is ACCEPTED, a batch that
          overlaps by a single second is refused 409
          ERR_SETTLEMENT_WINDOW_OVERLAP, and the same overlapping window is
          ACCEPTED on a second partner, proving the exclusion is scoped per
          partner_id.
