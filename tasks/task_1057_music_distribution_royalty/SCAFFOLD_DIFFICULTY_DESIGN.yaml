  # =====================================================================
  # Rule 8 — resource temporal-overlap conflicts, different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: store_buffered_window_aggregate_capacity_saturation
        grounds:
          - calculations.store_window_occupancy
          - validations[priority=19]
          - errors[ERR_STORE_WINDOW_SATURATED]
          - entities.Store.fields.max_concurrent_deliveries
          - entities.Delivery.fields.scheduled_send_at
        distinguishing_aspect: |
          Interval semantics = BUFFER-EXPANDED AGGREGATE CAPACITY on resource entity Store: a delivery
          occupies [scheduled_send_at - 15min, scheduled_send_at + 75min) and is rejected only when the
          count of intersecting QUEUED/SENT windows reaches max_concurrent_deliveries == 2, so a third
          window at 11:10 is refused while a window at 11:30 — whose left edge exactly touches the first
          window's open right edge and therefore does not intersect it — is accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "Store SPOTIFY with delivery_lead_days 5 and max_concurrent_deliveries 2."
            - "Artist ORCA on an ACTIVE PRO subscription with an APPROVED release (release_date 2026-09-01) whose single track has isrc, explicit=false and a LOCKED sheet."
            - "Two QUEUED deliveries of that release to SPOTIFY, scheduled at 2026-08-01T10:00:00Z and 2026-08-01T11:00:00Z."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/subscription-plans"
              payload: { code: "PRO", name: "Pro", annual_fee_cents: 2000, included_release_slots: 5, commission_bps: 1500, allows_content_id: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /api/stores"
              payload: { code: "SPOTIFY", name: "Spotify", delivery_lead_days: 5, requires_isrc: true, requires_explicit_flag: true, surcharge_bps: 0, max_concurrent_deliveries: 2 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { store_spot: $.data.id }
            - call: "POST /api/artists"
              payload: { display_name: "Orca", legal_name: "Orca LLC", country_code: "US", email: "orca@example.com" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { artist_id: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { artist_id: "${artist_id}", plan_id: "${plan_id}", auto_renew: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sub_id: $.data.id }
            - call: "POST /api/subscriptions/${sub_id}/activate"
              payload: { payment_reference: "pay-orca-1" }
