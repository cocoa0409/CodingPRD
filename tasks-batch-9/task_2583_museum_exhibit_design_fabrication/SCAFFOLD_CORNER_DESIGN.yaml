      - name: the_supersede_pointer_names_the_immediate_successor_not_the_newest_package
        claim_type: cross_reference_link
        grounds:
          - endpoints.GET_/design-packages/{id}/superseded-packages
          - entities.DesignPackage.superseded_by_package_id
          - endpoints.POST_/exhibit-projects/{id}/design-packages
        distinguishing_aspect: |
          The self-referential FK is written by a cascade that only touches packages whose
          status is not already SUPERSEDED, so a third package of the same stage must NOT
          re-point the first package at itself: the chain stays A -> B -> C, one hop per
          link. The reverse listing therefore returns exactly one row for B and one row
          for C and an empty array for A, while an implementation that re-stamps every
          older package with the newest id returns two rows for C and none for B. The
          chain is also the only place in this API where a row points at a sibling of its
          own entity type, so the reverse channel is the only way to walk it.
        test_recipe:
          setup:
            - "a fresh project advanced to SCHEMATIC"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
          trigger:
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { w0: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${w0}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { pA: $.data.id }
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { w1: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${w1}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 80, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
