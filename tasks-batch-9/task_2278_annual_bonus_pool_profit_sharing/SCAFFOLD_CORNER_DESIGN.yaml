  - section: calculations
    instances:

      - name: blended_achievement_blends_company_bu_and_a_unity_individual_pillar
        claim_type: Correct Result
        grounds:
          - calculations.metric_achievement
          - calculations.company_achievement
          - calculations.bu_weighted_achievement
          - calculations.blended_achievement
          - calculations.funding_curve_multiplier
          - calculations.pool_funding_split
        distinguishing_aspect: |
          The individual pillar has no plan-level score, so blended_achievement
          contributes INDIVIDUAL_COMPONENT_PCT 100.00 for its 20.00 weight:
          0.50*110.00 + 0.30*150.00 + 0.20*100.00 = 120.00, which is exactly
          CURVE_CAP_PCT and therefore multiplier 1.5000. Dropping the
          individual pillar (renormalising to 0.80) would give 125.00 and
          re-normalised 1.5000 too, but the funded pool would still be
          computed from a blended figure of 125.00 recorded on the plan —
          blended_achievement_pct == 120.00 is the falsifier. Metric actual
          1040 must interpolate to 110.00 above target, not 104.00.
        test_recipe:
          setup:
            - "One unit, one plan (50/30/20), L3 target 10.00% with band 0.25..2.00, one REVENUE metric 900/1000/1200 with actual 1040, one pool with a certified 150.00 scorecard, two L3 participants at 10,000,000 hired 2025-01-01 (full plan year each -> 1,000,000 target each)."
