      - name: stale_branch_version_rejected_occ
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[cash-order-create-stale-branch]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first cash order bumps Branch.version, a second create carrying the previously-observed expected_branch_version is rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Branch B (version observed at creation); teller T; order 1 created for 2026-08-03 (bumps version)"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id, b_ver: $.data.version }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/cash-orders"
              payload: { delivery_date: "2026-08-03", expected_branch_version: "${b_ver}", requested_amount_cents: 100000 }
              as: Teller
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /api/branches/${b_id}/cash-orders"
