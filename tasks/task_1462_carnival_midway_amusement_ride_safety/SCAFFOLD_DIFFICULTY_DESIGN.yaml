            - "after load: credits_remaining == 3 and credits_redeemed == 2 (5 == 3 + 2 + 0)"
            - "after voiding the LOADING-phase redemption r2: credits_remaining == 4 and credits_redeemed == 1 (5 == 4 + 1 + 0)"
            - "after aborting the RUNNING cycle: credits_remaining == 5 and credits_redeemed == 0 and credits_forfeited == 0 (5 == 5 + 0 + 0)"
            - "RideCycle.${cyc}.rider_count == 0 and status == ABORTED; RideRedemption.${r1}.status == VOIDED"

