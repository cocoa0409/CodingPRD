      # --- equality boundary on premium payment amount (>=), via payments endpoint ---
      - name: premium_payment_exact_amount_accepted
        grounds:
          - validations[priority=17]
          - state_machines.Policy.UNBILLED_to_PAID
          - entities.Policy.fields.annual_premium_cents
        distinguishing_aspect: |
          Paying exactly annual_premium_cents (3,947 for a RING cv 1,000,000 rate 300 ALL_RISK STANDARD)
          satisfies amount_cents >= annual_premium_cents (boundary '>='); the metric is the payment-amount
          threshold on POST .../payments, a different endpoint and metric than the appraisal-value boundary.
        test_recipe:
          setup:
            - "BOUND policy with a single RING (cv 1,000,000, zone rate 300, ALL_RISK, STANDARD) whose annual_premium_cents == 3947."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
