          - "entities.OwnerReport.fields.eac_commitment_based_cents"
        distinguishing_aspect: "An ACCEPTED report's forecast fields are frozen: a later CO approval cascade refreshes DRAFT reports but leaves the accepted snapshot at its original values."
        test_recipe:
          setup: ["Program ACTIVE: budget 10000000, contingency 1000000; CT1 EXECUTED 4500000; report R for 2026-08 SUBMITTED then ACCEPTED (eac_cb frozen at 4500000)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-FRZ", owner_organization: "O" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
