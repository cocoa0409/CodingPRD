# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Buy-Nothing & Neighborhood Gifting Network (task 0957)
# 9 difficulty rules x 2 instances each = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: reputation_pending_vs_settled
        grounds:
          - calculations.calc_reputation_score
          - entities.Member.fields.reputation_score
          - entities.Member.fields.pending_reputation_score
          - state_machines.ReputationEvent.PENDING_to_SETTLED
        distinguishing_aspect: |
          Entity domain = Member reputation. Two valid variants over identical
          event data produce different numbers: provisional (PENDING+SETTLED)
          reads 5.0 while official (SETTLED only) reads 0.0 immediately after
          registration; after the 7-day settlement sweep they converge to 5.0.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-10T09:00:00Z"
            - "Freshly registered member M with one WELCOME_BONUS event (+5, PENDING)"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "rep_m@x.com", display_name: "Rep M" }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /v1/members/${m_id}"
              as: Member
              as_user_id: "${m_id}"
              captures: { rep_official: $.data.reputation_score, rep_pending: $.data.pending_reputation_score }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-18T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /v1/members/${m_id}"
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "first GET: Member.${m_id}.reputation_score == 0.0 (no SETTLED events)"
            - "first GET: Member.${m_id}.pending_reputation_score == 5.0 (PENDING WELCOME_BONUS included)"
            - "after clock +8d sweep: reputation_score == 5.0 (event settled, age 8d weight 1.0)"
            - "after clock +8d sweep: pending_reputation_score == 5.0 (variants converge)"

      - name: claim_queue_fifo_vs_fairness_promotion
        grounds:
          - calculations.calc_claim_queue_rank
          - calculations.calc_fairness_score
          - state_machines.Claim.QUEUED_to_OFFERED
          - entities.GiftPost.fields.claim_mode
        distinguishing_aspect: |
          Entity domain = Claim queue on GiftPost (different from the Member
          reputation instance above). Identical queue contents (claimer A before
          claimer B behind head C) promote DIFFERENT next claimers: FIRST_COME
          promotes A (created_at tie broken by claim_seq ASC), FAIRNESS_DRAW
          promotes B (fairness_score 50 > A's 40 after A's strike).
        test_recipe:
          setup:
            - "Logical clock at 2026-05-10T09:00:00Z (frozen: all claims share created_at, so claim_seq breaks ties)"
            - "Group G (OPEN, capacity 150) with approved members GV (giver), C1, A, B"
            - "A carries one STRIKE (severity 1) so A.fairness_score == 40 while B.fairness_score == 50"
            - "Post P1 FIRST_COME and post P2 FAIRNESS_DRAW, both OPEN; on each: C1 OFFERED (head), A QUEUED, B QUEUED"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "gv@x.com", display_name: "GV" }
              as: Anonymous
              captures: { gv_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "c1@x.com", display_name: "C1" }
              as: Anonymous
              captures: { c1_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "qa@x.com", display_name: "A" }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "qb@x.com", display_name: "B" }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Maple Block", zip_code: "98101", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${gv_id}"
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${c1_id}"
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${a_id}"
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${b_id}"
            - call: "POST /v1/gift-posts"
              payload: { group_id: "${g_id}", title: "Wooden chair", category: "FURNITURE", claim_mode: "FIRST_COME", expires_at: "2026-06-10T00:00:00Z" }
              as: Member
              as_user_id: "${gv_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /v1/gift-posts/${p1_id}/publish"
              as: Member
              as_user_id: "${gv_id}"
            - call: "POST /v1/claims"
              payload: { post_id: "${p1_id}" }
              as: Member
              as_user_id: "${c1_id}"
              captures: { cl_c1_p1: $.data.id }
            - call: "POST /v1/claims"
              payload: { post_id: "${p1_id}" }
              as: Member
              as_user_id: "${a_id}"
              captures: { cl_a_p1: $.data.id }
            - call: "POST /v1/claims"
              payload: { post_id: "${p1_id}" }
              as: Member
              as_user_id: "${b_id}"
              captures: { cl_b_p1: $.data.id }
            - call: "POST /v1/reports"
              payload: { group_id: "${g_id}", target_type: "MEMBER", target_id: "${a_id}", category: "SPAM" }
              as: Member
              as_user_id: "${b_id}"
              captures: { r_a: $.data.id }
            - call: "POST /v1/reports/${r_a}/start-review"
              as: PlatformAdmin
            - call: "POST /v1/reports/${r_a}/resolve"
              payload: { resolution: "ACTION", action_type: "STRIKE", severity_points: 1 }
              as: PlatformAdmin
            - call: "POST /v1/gift-posts"
              payload: { group_id: "${g_id}", title: "Desk lamp", category: "HOUSEHOLD", claim_mode: "FAIRNESS_DRAW", expires_at: "2026-06-10T00:00:00Z" }
              as: Member
              as_user_id: "${gv_id}"
              captures: { p2_id: $.data.id }
            - call: "POST /v1/gift-posts/${p2_id}/publish"
              as: Member
              as_user_id: "${gv_id}"
            - call: "POST /v1/claims"
              payload: { post_id: "${p2_id}" }
              as: Member
              as_user_id: "${c1_id}"
              captures: { cl_c1_p2: $.data.id }
            - call: "POST /v1/claims"
              payload: { post_id: "${p2_id}" }
              as: Member
              as_user_id: "${a_id}"
              captures: { cl_a_p2: $.data.id }
            - call: "POST /v1/claims"
              payload: { post_id: "${p2_id}" }
              as: Member
              as_user_id: "${b_id}"
              captures: { cl_b_p2: $.data.id }
          trigger:
            - call: "POST /v1/claims/${cl_c1_p1}/decline"
              as: Member
              as_user_id: "${c1_id}"
            - call: "POST /v1/claims/${cl_c1_p2}/decline"
              as: Member
              as_user_id: "${c1_id}"
            - call: "GET /v1/claims/${cl_a_p1}"
              as: Member
              as_user_id: "${a_id}"
            - call: "GET /v1/claims/${cl_b_p1}"
              as: Member
              as_user_id: "${b_id}"
            - call: "GET /v1/claims/${cl_a_p2}"
              as: Member
              as_user_id: "${a_id}"
            - call: "GET /v1/claims/${cl_b_p2}"
              as: Member
              as_user_id: "${b_id}"
          assert:
            - "P1 FIRST_COME: Claim.${cl_a_p1}.status == OFFERED (claim_seq 2 beats B's 3 on the created_at tie)"
            - "P1 FIRST_COME: Claim.${cl_b_p1}.status == QUEUED"
            - "P2 FAIRNESS_DRAW: Claim.${cl_b_p2}.status == OFFERED (fairness_score 50 > A's 40)"
            - "P2 FAIRNESS_DRAW: Claim.${cl_a_p2}.status == QUEUED"
            - "identical queue order (A claimed before B on both posts) yields different promoted claimer across the two variants"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: fairness_score_piecewise_inputs
        grounds:
          - calculations.calc_fairness_score
          - entities.Member.fields.fairness_score
          - entities.Member.fields.active_strike_points
        distinguishing_aspect: |
          Mode (a): formula with >= 3 inputs and non-linear interaction —
          clamp(min/max) around 50 + 2*given - 3*received - 10*strike_points +
          conditional seniority branch. Each severity-1 strike moves the score
          by exactly -10 while points stay below the suspension threshold:
          50 -> 40 -> 30 with the member still ACTIVE.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-10T09:00:00Z"
            - "Group G (OPEN) with members A and R; A has no gifts, no receives, no strikes, account age 0 days"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "fa@x.com", display_name: "A" }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "fr@x.com", display_name: "R" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Fairness Group", zip_code: "98102", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${a_id}"
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${r_id}"
            - call: "POST /v1/reports"
              payload: { group_id: "${g_id}", target_type: "MEMBER", target_id: "${a_id}", category: "SPAM" }
              as: Member
              as_user_id: "${r_id}"
              captures: { r1: $.data.id }
            - call: "POST /v1/reports/${r1}/start-review"
              as: PlatformAdmin
            - call: "POST /v1/reports/${r1}/resolve"
              payload: { resolution: "ACTION", action_type: "STRIKE", severity_points: 1 }
              as: PlatformAdmin
            - call: "POST /v1/reports"
              payload: { group_id: "${g_id}", target_type: "MEMBER", target_id: "${a_id}", category: "HARASSMENT" }
              as: Member
              as_user_id: "${r_id}"
              captures: { r2: $.data.id }
            - call: "POST /v1/reports/${r2}/start-review"
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/members/${a_id}"
              as: Member
              as_user_id: "${a_id}"
            - call: "POST /v1/reports/${r2}/resolve"
              payload: { resolution: "ACTION", action_type: "STRIKE", severity_points: 1 }
              as: PlatformAdmin
            - call: "GET /v1/members/${a_id}"
              as: Member
              as_user_id: "${a_id}"
          assert:
            - "after first STRIKE: Member.${a_id}.fairness_score == 40 (50 - 10*1) and active_strike_points == 1 and status == ACTIVE"
            - "after second STRIKE: Member.${a_id}.fairness_score == 30 (50 - 10*2) and active_strike_points == 2 and status == ACTIVE (2 < 3, no suspension yet)"

      - name: reputation_per_event_rounding_order
        grounds:
          - calculations.calc_reputation_score
          - entities.ReputationEvent.fields.base_points
          - entities.ReputationEvent.fields.status
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters (different mode from the
          fairness instance). Per-event round_half_up to 1 decimal THEN sum gives
          3.8 + 2.3 + 2.3 = 8.4; the forbidden sum-then-round gives 8.3. The
          scaffold pins per-event-first; the test locks 8.4.
        test_recipe:
          setup:
            - "Logical clock starts 2026-05-10T09:00:00Z; member M completes two receives on that day (2x RECEIVE_COMPLETED +3, plus WELCOME_BONUS +5)"
            - "Clock then advanced 40 days to 2026-06-19T09:00:00Z: all three events SETTLED, age 40d -> weight 0.75"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "rg@x.com", display_name: "G" }
              as: Anonymous
              captures: { g_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "rm@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Rounding Group", zip_code: "98103", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
              captures: { gr_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${gr_id}" }
              as: Member
              as_user_id: "${g_id}"
            - call: "POST /v1/memberships"
              payload: { group_id: "${gr_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/gift-posts"
              payload: { group_id: "${gr_id}", title: "Toaster", category: "HOUSEHOLD", claim_mode: "FIRST_COME", expires_at: "2026-06-10T00:00:00Z" }
              as: Member
              as_user_id: "${g_id}"
              captures: { p1: $.data.id }
            - call: "POST /v1/gift-posts/${p1}/publish"
              as: Member
              as_user_id: "${g_id}"
            - call: "POST /v1/claims"
              payload: { post_id: "${p1}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { c1: $.data.id }
            - call: "POST /v1/claims/${c1}/accept"
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/pickup-plans"
              payload: { claim_id: "${c1}", window_start: "2026-05-10T12:00:00Z", window_end: "2026-05-10T13:00:00Z" }
              as: Member
              as_user_id: "${g_id}"
              captures: { pp1: $.data.id }
            - call: "POST /v1/pickup-plans/${pp1}/confirm"
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/pickup-plans/${pp1}/complete"
              as: Member
              as_user_id: "${g_id}"
            - call: "POST /v1/gift-posts"
              payload: { group_id: "${gr_id}", title: "Kettle", category: "HOUSEHOLD", claim_mode: "FIRST_COME", expires_at: "2026-06-10T00:00:00Z" }
              as: Member
              as_user_id: "${g_id}"
              captures: { p2: $.data.id }
            - call: "POST /v1/gift-posts/${p2}/publish"
              as: Member
              as_user_id: "${g_id}"
            - call: "POST /v1/claims"
              payload: { post_id: "${p2}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { c2: $.data.id }
            - call: "POST /v1/claims/${c2}/accept"
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/pickup-plans"
              payload: { claim_id: "${c2}", window_start: "2026-05-10T14:00:00Z", window_end: "2026-05-10T15:00:00Z" }
              as: Member
              as_user_id: "${g_id}"
              captures: { pp2: $.data.id }
            - call: "POST /v1/pickup-plans/${pp2}/confirm"
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/pickup-plans/${pp2}/complete"
              as: Member
              as_user_id: "${g_id}"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/members/${m_id}"
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Member.${m_id}.reputation_score == 8.4 (per-event: round(5*0.75)=3.8, round(3*0.75)=2.3 twice; 3.8+2.3+2.3)"
            - "Member.${m_id}.pending_reputation_score == 8.4 (all events SETTLED at age 40d)"
            - "the sum-then-round alternative 8.3 (3.75+2.25+2.25=8.25 -> 8.3) is NOT produced"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: gift_post_open_reserved_open_cycle
        grounds:
          - state_machines.GiftPost.OPEN_to_RESERVED
          - state_machines.GiftPost.RESERVED_to_OPEN
          - state_machines.Claim.OFFERED_to_WITHDRAWN
        distinguishing_aspect: |
          GiftPost has a true cycle: OPEN -> RESERVED on first offer, RESERVED
          -> OPEN when the head claim withdraws with an empty queue, then
          OPEN -> RESERVED again on a fresh claim. Different entity from the
          PickupPlan negotiation loop instance.
        test_recipe:
          setup:
            - "Clock 2026-05-10T09:00:00Z; group G (OPEN) with giver GV and member M; post P published (OPEN)"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "cg@x.com", display_name: "GV" }
              as: Anonymous
              captures: { gv_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "cm@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Cycle Group", zip_code: "98104", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${gv_id}"
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/gift-posts"
              payload: { group_id: "${g_id}", title: "Bike pump", category: "OTHER", claim_mode: "FIRST_COME", expires_at: "2026-06-10T00:00:00Z" }
              as: Member
              as_user_id: "${gv_id}"
              captures: { p_id: $.data.id }
            - call: "POST /v1/gift-posts/${p_id}/publish"
              as: Member
              as_user_id: "${gv_id}"
          trigger:
            - call: "POST /v1/claims"
              payload: { post_id: "${p_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { c1: $.data.id }
            - call: "GET /v1/gift-posts/${p_id}"
              as: Member
              as_user_id: "${gv_id}"
            - call: "POST /v1/claims/${c1}/withdraw"
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /v1/gift-posts/${p_id}"
              as: Member
              as_user_id: "${gv_id}"
            - call: "POST /v1/claims"
              payload: { post_id: "${p_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { c2: $.data.id }
            - call: "GET /v1/gift-posts/${p_id}"
              as: Member
              as_user_id: "${gv_id}"
          assert:
            - "after first claim: GiftPost.${p_id}.status == RESERVED and current_claim_id == ${c1}"
            - "after withdraw (queue empty): GiftPost.${p_id}.status == OPEN and current_claim_id == null (cycle back)"
            - "after second claim: GiftPost.${p_id}.status == RESERVED again and current_claim_id == ${c2}"
            - "Claim.${c1}.status == WITHDRAWN; Claim.${c2}.status == OFFERED"

      - name: pickup_plan_counter_loop_max_rounds
        grounds:
          - state_machines.PickupPlan.PROPOSED_to_COUNTERED
          - state_machines.PickupPlan.COUNTERED_to_COUNTERED
          - state_machines.PickupPlan.COUNTERED_to_CONFIRMED
        distinguishing_aspect: |
          PickupPlan has a negotiation loop (PROPOSED -> COUNTERED -> COUNTERED
          ...) bounded at 3 rounds: the 4th proposal attempt is rejected with
          ERR_MAX_NEGOTIATION_ROUNDS, and the loop still joins at CONFIRMED.
          Different entity from the GiftPost cycle instance.
        test_recipe:
          setup:
            - "Clock 2026-05-10T09:00:00Z; group with giver GV and claimer M; claim C is ACCEPTED on post P"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "ng@x.com", display_name: "GV" }
              as: Anonymous
              captures: { gv_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "nm@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Negotiation Group", zip_code: "98105", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${gv_id}"
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/gift-posts"
              payload: { group_id: "${g_id}", title: "Bookshelf", category: "FURNITURE", claim_mode: "FIRST_COME", expires_at: "2026-06-10T00:00:00Z" }
              as: Member
              as_user_id: "${gv_id}"
              captures: { p_id: $.data.id }
            - call: "POST /v1/gift-posts/${p_id}/publish"
              as: Member
              as_user_id: "${gv_id}"
            - call: "POST /v1/claims"
              payload: { post_id: "${p_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { c_id: $.data.id }
            - call: "POST /v1/claims/${c_id}/accept"
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/pickup-plans"
              payload: { claim_id: "${c_id}", window_start: "2026-05-11T10:00:00Z", window_end: "2026-05-11T11:00:00Z" }
              as: Member
              as_user_id: "${gv_id}"
              captures: { pp: $.data.id }
          trigger:
            - call: "POST /v1/pickup-plans/${pp}/counter"
