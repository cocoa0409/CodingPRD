  # ======================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ======================================================================
  - rule_id: compensating_invariant
    instances:
      - name: preempt_makegood_conserves_week_booked_seconds
        grounds:
          - state_machines.Spot.SCHEDULED_to_PREEMPTED
          - state_machines.Spot.MAKE_GOOD_OFFERED_to_SCHEDULED
          - entities.AvailUnit.fields.booked_commercial_seconds
        distinguishing_aspect: |
          Conserved quantity: total booked seconds across ALL AvailUnits of
          the week. Preempt (-30s on unit A) paired with its make-good
          placement (+30s on unit C) leaves SUM(booked_commercial_seconds +
          booked_political_seconds over the week's units) unchanged:
          week_booked_total(after pair) == week_booked_total(before preempt).
        test_recipe:
          setup:
            - "Advertiser A18 (RETAIL), Program P18 (PRIME weekday 5 = Friday 2026-08-07, rating 5.0)"
            - "Week W18; units U18a (break 1, 60s) and U18c (break 2, 60s) — both on P18 so program-match and comparable-rating (5.0 >= 5.0) pass"
            - "Order approved, line on P18 (30s x 1, rate 9000c, guarantee 0); spot s18 placed in U18a"
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "A18", product_category: "RETAIL", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { adv18_id: "$.data.id"}
