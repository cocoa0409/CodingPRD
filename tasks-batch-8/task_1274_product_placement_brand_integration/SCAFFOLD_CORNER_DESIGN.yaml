scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_brand_returns_201_with_defaults
        claim_type: creation_defaults
        grounds: [entities.Brand.fields.watchlist_flag, entities.Brand.fields.status]
        distinguishing_aspect: "Omitting watchlist_flag applies the default false; system stamps status ACTIVE, version 1, and server-minted id/created_at."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id, b_watch: $.data.watchlist_flag, b_status: $.data.status, b_v: $.data.version } }
          assert:
            - "captured b_watch == false (default applied)"
            - "captured b_status == ACTIVE"
            - "captured b_v == 1"
            - "captured b_id is a non-null UUID"
      - name: create_brief_missing_required_budget_rejected
        claim_type: required_fields
        grounds: [entities.BrandBrief.fields.budget_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "budget_cents is a required input with no default; omitting it yields 400 ERR_INVALID_REQUEST and no brief is persisted."
        test_recipe:
          setup: ["Brand exists"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "No budget", objective: "test" }, as: BrandRep, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST"
            - "GET /brands/${b_id}/briefs returns total_count 0"
      - name: get_nonexistent_episode_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "A well-formed UUID that does not exist yields 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /episodes/00000000-0000-0000-0000-000000000000", as: AgencyAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_NOT_FOUND"
      - name: brand_create_system_fields_ignored_input
        claim_type: system_fields
        grounds: [entities.Brand]
        distinguishing_aspect: "Client-supplied id/version in the create body are ignored: the server mints its own id and sets version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE", id: "00000000-0000-0000-0000-000000000000", version: 99 }, as: AgencyAdmin, captures: { b_id: $.data.id, b_v: $.data.version } }
          assert:
            - "captured b_id != 00000000-0000-0000-0000-000000000000"
            - "captured b_v == 1 (client version 99 ignored)"
      - name: continuity_record_immutable_shape
        claim_type: immutability
        grounds: [entities.ContinuityRecord]
        distinguishing_aspect: "ContinuityRecord has common_fields false: its read representation carries id and created_at but no version or updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["ACTIVE contract with a STAGED shipment (full approval chain, GRANTED clearance, episode LOCKED)"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "Summer fizz", objective: "awareness", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id, ep_v: $.data.version } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 25 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_v}" }, as: IntegrationManager, captures: { cl_id: $.data.id } }
            - { call: "POST /clearances/${cl_id}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1" }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 1000000, guaranteed_seconds: 30, guaranteed_verbal_mentions: 0, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { p_id: $.data.id } }
            - { call: "POST /proposals/${p_id}/submit", as: IntegrationManager }
            - { call: "POST /proposals/${p_id}/production-decision", payload: { decision: "APPROVE" }, as: ProductionRep, as_user_id: "prod-2" }
            - { call: "POST /proposals/${p_id}/network-decision", payload: { decision: "APPROVE" }, as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /episodes/${ep_id}/lock", as: ProductionRep, as_user_id: "prod-1" }
            - { call: "POST /proposals/${p_id}/contract", as: IntegrationManager, captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/activate", as: IntegrationManager }
            - { call: "POST /contracts/${ct_id}/shipments", payload: { item_description: "Branded fridge", quantity: 1 }, as: IntegrationManager, captures: { sh_id: $.data.id } }
          trigger:
            - { call: "POST /contracts/${ct_id}/continuity-records", payload: { shipment_id: "${sh_id}", scene_timecode_seconds: 12, note: "fridge visible" }, as: ProductionRep, as_user_id: "prod-1", captures: { cr_id: $.data.id, cr_status: $.data.status } }
          assert:
            - "captured cr_status == LOGGED"
            - "response data has no version key and no updated_at key (common_fields false)"
            - "response data has id and created_at keys"
      - name: brief_remaining_budget_computed_on_create
        claim_type: computed_fields
        grounds: [entities.BrandBrief.fields.remaining_budget_cents, calculations.brief_budget_remaining]
        distinguishing_aspect: "remaining_budget_cents is computed, not client-set: at creation it equals budget_cents with zero holds."
        test_recipe:
          setup: ["Brand exists"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "Summer fizz", objective: "awareness", budget_cents: 500000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_remaining: $.data.remaining_budget_cents } }
          assert:
            - "captured br_remaining == 500000"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: brief_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.BrandBrief]
        distinguishing_aspect: "A newly created brief starts in DRAFT, before any submit."
        test_recipe:
          setup: ["Brand exists"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "T", objective: "O", budget_cents: 1000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_status: $.data.status } }
          assert:
            - "captured br_status == DRAFT"
      - name: submit_open_brief_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.BrandBrief.DRAFT_to_OPEN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submitting an already-OPEN brief is a non-terminal invalid transition: ERR_INVALID_STATE, no version change."
        test_recipe:
          setup: ["Brand with an OPEN brief"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "T", objective: "O", budget_cents: 1000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}", captures: { br_v: $.data.version } }
          trigger:
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_STATE"
            - "BrandBrief.${br_id}.version unchanged at captured br_v"
      - name: close_brief_with_inflight_proposal_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.BrandBrief.OPEN_to_CLOSED]
        distinguishing_aspect: "Close is blocked while a proposal is in-flight (DRAFT here); the precondition references proposal state across the aggregate."
        test_recipe:
          setup: ["Brand, OPEN brief, STANDARD series, episode, opportunity, DRAFT proposal"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "T", objective: "O", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 25 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 60000, guaranteed_seconds: 10, guaranteed_verbal_mentions: 0, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager }
          trigger:
            - { call: "POST /briefs/${br_id}/close", as: BrandRep, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_STATE"
            - "BrandBrief.${br_id}.status == OPEN"
      - name: network_decision_on_rejected_proposal_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.IntegrationProposal, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "REJECTED is terminal: a network decision on a rejected proposal yields ERR_ALREADY_TERMINAL, not ERR_INVALID_STATE."
        test_recipe:
          setup: ["Full proposal chain; production rejects"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "T", objective: "O", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 25 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 60000, guaranteed_seconds: 10, guaranteed_verbal_mentions: 0, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { p_id: $.data.id } }
            - { call: "POST /proposals/${p_id}/submit", as: IntegrationManager }
            - { call: "POST /proposals/${p_id}/production-decision", payload: { decision: "REJECT" }, as: ProductionRep, as_user_id: "prod-2", captures: { p_status: $.data.status } }
          trigger:
            - { call: "POST /proposals/${p_id}/network-decision", payload: { decision: "APPROVE" }, as: NetworkStandardsReviewer, as_user_id: "nsr-1", captures: { err: $.data.error_id } }
          assert:
            - "precondition: captured p_status == REJECTED"
            - "captured err == ERR_ALREADY_TERMINAL"
      - name: shipment_happy_path_walk
        claim_type: valid_transition
        grounds: [state_machines.PropShipment]
        distinguishing_aspect: "PENDING -> DISPATCHED -> DELIVERED -> STAGED each succeed in order with version increments."
        test_recipe:
          setup: ["ACTIVE contract (full approval chain with GRANTED clearance and LOCKED episode); shipment created"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "T", objective: "O", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id, ep_v: $.data.version } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 25 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_v}" }, as: IntegrationManager, captures: { cl_id: $.data.id } }
            - { call: "POST /clearances/${cl_id}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1" }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 1000000, guaranteed_seconds: 30, guaranteed_verbal_mentions: 0, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { p_id: $.data.id } }
            - { call: "POST /proposals/${p_id}/submit", as: IntegrationManager }
            - { call: "POST /proposals/${p_id}/production-decision", payload: { decision: "APPROVE" }, as: ProductionRep, as_user_id: "prod-2" }
            - { call: "POST /proposals/${p_id}/network-decision", payload: { decision: "APPROVE" }, as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /episodes/${ep_id}/lock", as: ProductionRep, as_user_id: "prod-1" }
            - { call: "POST /proposals/${p_id}/contract", as: IntegrationManager, captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/activate", as: IntegrationManager }
            - { call: "POST /contracts/${ct_id}/shipments", payload: { item_description: "Fridge", quantity: 1 }, as: IntegrationManager, captures: { sh_id: $.data.id, sh_v0: $.data.version } }
          trigger:
            - { call: "POST /shipments/${sh_id}/advance", payload: { to: "DISPATCHED" }, as: IntegrationManager, captures: { s1: $.data.status, v1: $.data.version } }
            - { call: "POST /shipments/${sh_id}/advance", payload: { to: "DELIVERED" }, as: IntegrationManager, captures: { s2: $.data.status } }
            - { call: "POST /shipments/${sh_id}/advance", payload: { to: "STAGED" }, as: IntegrationManager, captures: { s3: $.data.status, v3: $.data.version } }
          assert:
            - "captured s1 == DISPATCHED, captured s2 == DELIVERED, captured s3 == STAGED"
            - "captured v1 == ${sh_v0} + 1 and captured v3 == ${sh_v0} + 3"
      - name: shipment_skip_stage_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PropShipment, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PENDING -> DELIVERED skips DISPATCHED and is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE contract; shipment PENDING"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "T", objective: "O", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id, ep_v: $.data.version } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 25 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_v}" }, as: IntegrationManager, captures: { cl_id: $.data.id } }
            - { call: "POST /clearances/${cl_id}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1" }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 1000000, guaranteed_seconds: 30, guaranteed_verbal_mentions: 0, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { p_id: $.data.id } }
            - { call: "POST /proposals/${p_id}/submit", as: IntegrationManager }
            - { call: "POST /proposals/${p_id}/production-decision", payload: { decision: "APPROVE" }, as: ProductionRep, as_user_id: "prod-2" }
            - { call: "POST /proposals/${p_id}/network-decision", payload: { decision: "APPROVE" }, as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /episodes/${ep_id}/lock", as: ProductionRep, as_user_id: "prod-1" }
            - { call: "POST /proposals/${p_id}/contract", as: IntegrationManager, captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/activate", as: IntegrationManager }
            - { call: "POST /contracts/${ct_id}/shipments", payload: { item_description: "Fridge", quantity: 1 }, as: IntegrationManager, captures: { sh_id: $.data.id } }
          trigger:
            - { call: "POST /shipments/${sh_id}/advance", payload: { to: "DELIVERED" }, as: IntegrationManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_STATE"
            - "PropShipment.${sh_id}.status == PENDING"
      - name: shipment_reship_cycle
        claim_type: cyclic_shape
        grounds: [state_machines.PropShipment.RETURN_REQUESTED_to_DISPATCHED]
        distinguishing_aspect: "DELIVERED -> RETURN_REQUESTED -> DISPATCHED -> DELIVERED revisits DELIVERED: the shipment machine is cyclic for defective-prop reshipment."
        test_recipe:
          setup: ["ACTIVE contract; shipment advanced to DELIVERED"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "T", objective: "O", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id, ep_v: $.data.version } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 25 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_v}" }, as: IntegrationManager, captures: { cl_id: $.data.id } }
            - { call: "POST /clearances/${cl_id}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1" }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 1000000, guaranteed_seconds: 30, guaranteed_verbal_mentions: 0, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { p_id: $.data.id } }
            - { call: "POST /proposals/${p_id}/submit", as: IntegrationManager }
            - { call: "POST /proposals/${p_id}/production-decision", payload: { decision: "APPROVE" }, as: ProductionRep, as_user_id: "prod-2" }
            - { call: "POST /proposals/${p_id}/network-decision", payload: { decision: "APPROVE" }, as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /episodes/${ep_id}/lock", as: ProductionRep, as_user_id: "prod-1" }
            - { call: "POST /proposals/${p_id}/contract", as: IntegrationManager, captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/activate", as: IntegrationManager }
            - { call: "POST /contracts/${ct_id}/shipments", payload: { item_description: "Fridge", quantity: 1 }, as: IntegrationManager, captures: { sh_id: $.data.id } }
            - { call: "POST /shipments/${sh_id}/advance", payload: { to: "DISPATCHED" }, as: IntegrationManager }
            - { call: "POST /shipments/${sh_id}/advance", payload: { to: "DELIVERED" }, as: IntegrationManager }
          trigger:
            - { call: "POST /shipments/${sh_id}/advance", payload: { to: "RETURN_REQUESTED" }, as: IntegrationManager, captures: { s1: $.data.status } }
