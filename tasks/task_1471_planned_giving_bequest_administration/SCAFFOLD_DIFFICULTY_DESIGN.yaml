            - { call: "POST /giving/gift-agreements/${ag_id}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1" }
            - { call: "POST /giving/gift-assets", payload: { gift_agreement_id: "${ag_id}", asset_kind: "CASH", pledged_value_cents: 10000000 }, as: EstateManager, captures: { a1: $.data.id } }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RECEIVE" }, as: EstateManager }
            - { call: "POST /giving/gift-agreements/${ag_id}/generate-payment-schedule", payload: {}, as: GiftAdministrator }
            - { call: "POST /giving/_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /giving/annuity-payments", payload: { gift_agreement_id: "${ag_id}", status: "DUE" }, as: GiftAdministrator, captures: { pay1: "$.data[0].id" } }
          trigger:
            - { call: "POST /giving/gift-agreements/${ag_id}/transition", payload: { action: "SUSPEND" }, as: ComplianceOfficer }
            - { call: "POST /giving/annuity-payments/${pay1}/transition", payload: { action: "PAY" }, as: GiftAdministrator, captures: { err: $.data.error_id } }
            - { call: "POST /giving/gift-agreements/${ag_id}/transition", payload: { action: "RESUME" }, as: ComplianceOfficer }
            - { call: "POST /giving/annuity-payments/${pay1}/transition", payload: { action: "PAY" }, as: GiftAdministrator, captures: { pay_status: $.data.status } }
            - { call: "GET /giving/gift-agreements/${ag_id}", payload: {}, as: GiftAdministrator, captures: { ag_status: $.data.status, ag_paid: $.data.total_paid_cents } }
          assert:
            - "PAY under SUSPENDED rejected: ${err} == ERR_AGREEMENT_SUSPENDED"
            - "After RESUME, PAY succeeds: ${pay_status} == PAID"
            - "GiftAgreement.${ag_id}.status == ACTIVE (${ag_status}) — full cycle A->S->A traversed"
            - "GiftAgreement.${ag_id}.total_paid_cents == 125000 (${ag_paid})"

      - name: estate_contest_resolve_cycle
        grounds:
          - state_machines.Estate.PROBATE_OPEN_to_CONTESTED
          - state_machines.Estate.CONTESTED_to_PROBATE_OPEN
        distinguishing_aspect: |
          Estate runs a cycle PROBATE_OPEN -> CONTESTED -> PROBATE_OPEN
          (non-linear on the Estate entity): BEGIN_DISTRIBUTION is rejected while
          CONTESTED and accepted after RESOLVE_CONTEST.
        test_recipe:
          setup:
            - "Deceased donor; Estate in PROBATE_OPEN (recorded by em-1); no milestones, no assets (residual 0)"
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Contest Loop", date_of_birth: "1938-11-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
