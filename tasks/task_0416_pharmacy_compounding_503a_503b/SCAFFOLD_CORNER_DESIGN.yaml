      - name: reprocess_blocked_when_batch_has_dispensed_units
        claim_type: Cross-entity validation
        grounds:
          - state_machines.CompoundingBatch.QUARANTINED_to_IN_PROCESS
          - errors[ERR_BATCH_HAS_DISPENSED_UNITS]
          - entities.FinishedPreparation.fields.dispense_status
          - endpoints["POST /pharmacy-compounding/compounding-batches/{bid}/reprocess"]
        distinguishing_aspect: "Reprocess of a QUARANTINED batch is impossible here because a released-then-re-quarantine path is undefined; instead validate that with a DISPENSED unit the reprocess precondition fails ERR_BATCH_HAS_DISPENSED_UNITS — exercised after release+dispense then recall-free re-quarantine is not reachable, so this is asserted via the dispensed-state guard."
        excluded_because:
          difficulty_instance: non_linear_state_machine / batch_quarantined_reprocess_cycle_back_to_in_process
          rationale: "The reprocess transition and its no-dispensed-units precondition are exercised in that difficulty instance; a batch cannot reach QUARANTINED with a DISPENSED unit without first being RELEASED (which makes it RELEASED, not QUARANTINED), so the ERR_BATCH_HAS_DISPENSED_UNITS guard is covered as the documented precondition of the reprocess edge there."

