              captures: { err: $.data.error_id }
          assert:
            - "Rejected with error_id ERR_REVIEWER_CONFLICTED (http 422), not ERR_DUPLICATE_ASSIGNMENT"
            - "ReviewAssignment.${asg1}.recommendation_voided == true"
            - "ReviewAssignment.${asg1}.status == SUBMITTED"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (attendee-count threshold vs temporal
  # deadline, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: quorum_threshold_exact_count_boundary
        grounds:
          - calculations.quorum_determination
          - state_machines.BoardMeeting.SCHEDULED_to_CONVENED
          - errors[ERR_QUORUM_NOT_MET]
        distinguishing_aspect: |
          Count metric on POST /irb/board-meetings/{id}/convene: with 5 ACTIVE
          members the threshold is exactly floor(5/2)+1 = 3; 3 attendees
          convene succeeds (>= is inclusive of the threshold), 2 attendees
          fails with ERR_QUORUM_NOT_MET — the boundary value itself passes.
        test_recipe:
          setup:
            - "5 ACTIVE members: chair(SCIENTIST), sci2(SCIENTIST), nonsci(NON_SCIENTIST), unaff(UNAFFILIATED), pris(PRISONER_REPRESENTATIVE)"
            - "Meeting A (room R-QA, 2026-06-01T10:00:00Z) and meeting B (room R-QB, 2026-06-02T10:00:00Z), both SCHEDULED with no agenda items"
          setup_api_calls:
            - call: "POST /irb/irb-members"
              payload: { full_name: "Chair B", email: "chairb@univ.edu", member_category: "SCIENTIST", is_chair: true }
              as: IrbAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Sci Three", email: "sci3@univ.edu", member_category: "SCIENTIST" }
              as: IrbAdmin
              captures: { sci3: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "NS B", email: "nsb@univ.edu", member_category: "NON_SCIENTIST" }
              as: IrbAdmin
              captures: { nonsci: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "UN B", email: "unb@univ.edu", member_category: "UNAFFILIATED" }
              as: IrbAdmin
              captures: { unaff: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "PR B", email: "prb@univ.edu", member_category: "PRISONER_REPRESENTATIVE" }
              as: IrbAdmin
              captures: { pris: $.data.id }
            - call: "POST /irb/board-meetings"
              payload: { room_id: "R-QA", scheduled_at: "2026-06-01T10:00:00Z", duration_minutes: 60 }
              as: IrbCoordinator
              captures: { mtg_a: $.data.id }
            - call: "POST /irb/board-meetings"
              payload: { room_id: "R-QB", scheduled_at: "2026-06-02T10:00:00Z", duration_minutes: 60 }
              as: IrbCoordinator
              captures: { mtg_b: $.data.id }
          trigger:
            - call: "POST /irb/board-meetings/${mtg_a}/convene"
              payload: { attendee_member_ids: ["${chair_id}", "${nonsci}", "${unaff}"] }
              as: IrbChair
              as_user_id: "${chair_id}"
            - call: "POST /irb/board-meetings/${mtg_b}/convene"
              payload: { attendee_member_ids: ["${chair_id}", "${nonsci}"] }
              as: IrbChair
              as_user_id: "${chair_id}"
              captures: { err: $.data.error_id }
          assert:
            - "BoardMeeting.${mtg_a}.status == CONVENED (3 attendees == threshold 3 passes)"
            - "BoardMeeting.${mtg_a}.quorum_threshold == 3"
            - "Second convene rejected with error_id ERR_QUORUM_NOT_MET (http 422)"
            - "BoardMeeting.${mtg_b}.status == SCHEDULED"

      - name: ae_deadline_exact_second_boundary
        grounds:
          - calculations.ae_timeliness
          - entities.AdverseEventReport.fields.is_late
          - state_machines.AdverseEventReport.FILED_to_TRIAGED
        distinguishing_aspect: |
          Temporal metric on POST /irb/protocols/{id}/adverse-events (and its
          triage): a SERIOUS_ADVERSE_EVENT reported exactly at
          occurred_at+5days is ON TIME (deadline inclusive, is_late uses
          strict >), while one second past is late and its triage auto-opens a
          LATE_AE case — different metric (seconds) and different endpoint
          than the quorum count boundary.
        test_recipe:
          setup:
            - "Protocol P APPROVED via expedited track"
            - "Logical clock will be positioned at the exact deadline, then one second past"
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Edge", email: "edge@univ.edu", department: "Neurology", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_id: $.data.id }
