  - rule_id: non_linear_state_machine
    instances:

      - name: visit_parallel_dimensions_withhold_while_still_counting
        grounds:
          - state_machines.RedemptionVisit.PENDING_to_WITHHELD
          - state_machines.RedemptionVisit.WITHHELD_to_PENDING
          - state_machines.RedemptionVisit.COUNTING_to_COUNTING
          - state_machines.RedemptionVisit.COUNTING_to_COUNTED
          - state_machines.RedemptionVisit.PENDING_to_APPROVED
        distinguishing_aspect: |
          count_status and payout_status are independent dimensions of one RedemptionVisit: a
          manual WITHHOLD lands while count_status is still COUNTING, a further lot is accepted
          without disturbing payout_status WITHHELD, close-count moves only the counting
          dimension, and RELEASE_HOLD then APPROVE move only the payout dimension — the
          combined state (COUNTED, APPROVED) is reached by interleaving the two axes.
