            - "data.applied_tier_rate_bps == 1200 and data.royalty_due_cents == 114000"
            - "data.royalty_due_cents != 110400, which is what subtracting the full 80000 claim would produce"

      - name: closeout_line_within_cap_rates_two_bases_at_two_rates
        claim_type: satisfaction_to_pass
        grounds:
          - calculations.royalty_due_computation
          - entities.ProductCategory.fields.closeout_cap_pct_bps
          - entities.ProductCategory.fields.closeout_rate_bps
          - validations.priority_31
        distinguishing_aspect: |
          gross_sales_cents already INCLUDES the closeout sales, and only the part
          inside closeout_cap_pct_bps (1500 -> 150000 of a 1000000 gross) earns the
          reduced 500 bps rate; the 150000 of excess falls back to the regular tier
          rate. So the line pays 102000 on a 850000 regular basis plus 7500 on
          150000 of eligible closeout, i.e. 109500 — not 950000 * 1200 / 10000
          (114000) and not 850000 * 1200 / 10000 + 300000 * 500 / 10000 (117000).
          The authorization permits closeout, so priority 31 passes.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "licensee LIC_T2 ACTIVE with an ACTIVE agreement AGR_T2 on category JERSEY"
            - "an AUTHORIZED DEPARTMENT authorization with closeout_allowed == true"
            - "a DRAFT 2026Q2 report with one DEPARTMENT line: gross 1000000, closeout 300000 (under the 4000 bps hard limit of 400000), deductions 0"
