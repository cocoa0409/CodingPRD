  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: shift_overlap_half_open_adjacency
        grounds: ["validations[priority=9]", entities.VolunteerShift.fields.scheduled_start, "endpoints[POST /shifts]"]
        distinguishing_aspect: "Volunteer-resource intervals use pure half-open [start, end) semantics: 11:00-13:00 against an existing 09:00-12:00 shift overlaps and is rejected, while 12:00-15:00 merely TOUCHES at the endpoint and is accepted — no buffer, adjacency allowed; contrast with the buffered stand semantics."
        test_recipe:
          setup:
            - "One ACTIVE volunteer with an existing SCHEDULED shift 2026-08-10 09:00-12:00"
          setup_api_calls:
            - { call: "POST /volunteers", payload: { full_name: "V O", email: "vo@x.org" }, as: ShopCoordinator, captures: { v: $.data.id } }
            - { call: "POST /shifts", payload: { volunteer_id: "${v}", shift_role: "MECHANIC", scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: ShopCoordinator, captures: { sh_a: $.data.id } }
          trigger:
            - { call: "POST /shifts", payload: { volunteer_id: "${v}", shift_role: "INTAKE", scheduled_start: "2026-08-10T11:00:00Z", scheduled_end: "2026-08-10T13:00:00Z" }, as: ShopCoordinator, captures: { err_ov: $.data.error_id } }
            - { call: "POST /shifts", payload: { volunteer_id: "${v}", shift_role: "INTAKE", scheduled_start: "2026-08-10T12:00:00Z", scheduled_end: "2026-08-10T15:00:00Z" }, as: ShopCoordinator, captures: { sh_b: $.data.id } }
          assert:
            - "overlapping 11:00-13:00 -> error_id ERR_SHIFT_OVERLAP"
            - "adjacent 12:00-15:00 succeeds (half-open: existing end 12:00 == new start 12:00 does not intersect)"
            - "VolunteerShift.${sh_b}.status == SCHEDULED"

      - name: stand_buffer_gap_semantics
        grounds: ["validations[priority=9]", entities.ToolSession.fields.stand_number, "endpoints[POST /memberships/{id}/sessions]"]
        distinguishing_aspect: "Stand-resource intervals use buffered semantics: on the same stand a new session must keep a 15-minute cleanup gap, so 12:00 (adjacent, gap 0) AND 12:14 (gap 14m) are both rejected while 12:15 (gap exactly 15m, >= inclusive) is accepted; a different stand at a fully overlapping time is accepted — different interval arithmetic and different resource entity than the volunteer-shift rule."
        test_recipe:
          setup:
            - "ACTIVE membership with an existing BOOKED session on stand 2, 2026-08-10 10:00-12:00"
          setup_api_calls:
            - { call: "POST /memberships", payload: { member_name: "M S", member_email: "ms@x.org", tier: "BASIC", end_date: "2026-12-31" }, as: ShopCoordinator, captures: { m: $.data.id } }
            - { call: "POST /memberships/${m}/sessions", payload: { stand_number: 2, start_time: "2026-08-10T10:00:00Z", end_time: "2026-08-10T12:00:00Z" }, as: Member, as_user_id: "${m}", captures: { se_a: $.data.id } }
          trigger:
            - { call: "POST /memberships/${m}/sessions", payload: { stand_number: 2, start_time: "2026-08-10T12:00:00Z", end_time: "2026-08-10T14:00:00Z" }, as: Member, as_user_id: "${m}", captures: { err_adj: $.data.error_id } }
            - { call: "POST /memberships/${m}/sessions", payload: { stand_number: 2, start_time: "2026-08-10T12:14:00Z", end_time: "2026-08-10T14:00:00Z" }, as: Member, as_user_id: "${m}", captures: { err_14: $.data.error_id } }
            - { call: "POST /memberships/${m}/sessions", payload: { stand_number: 2, start_time: "2026-08-10T12:15:00Z", end_time: "2026-08-10T14:00:00Z" }, as: Member, as_user_id: "${m}", captures: { se_b: $.data.id } }
            - { call: "POST /memberships/${m}/sessions", payload: { stand_number: 3, start_time: "2026-08-10T10:30:00Z", end_time: "2026-08-10T11:30:00Z" }, as: Member, as_user_id: "${m}", captures: { se_c: $.data.id } }
          assert:
            - "same-stand 12:00 (gap 0) -> error_id ERR_STAND_BUFFER_CONFLICT"
            - "same-stand 12:14 (gap 14m < 15m) -> error_id ERR_STAND_BUFFER_CONFLICT"
            - "same-stand 12:15 (gap exactly 15m) succeeds: ToolSession.${se_b}.status == BOOKED  (buffer uses >= 15m, inclusive)"
            - "different-stand 10:30 fully overlapping succeeds: ToolSession.${se_c}.status == BOOKED  (buffer is per-stand)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: part_stock_usage_void_conservation
        grounds: [calculations.parts_cost_rollup, entities.Part.fields.quantity_on_hand, "endpoints[POST /usage-logs/{id}/void]", "concurrency_rules[part-usage-stale-stock]"]
        distinguishing_aspect: "Conserved quantity = Part.quantity_on_hand (physical stock units): invariant on_hand = restocked + harvested - used(COMMITTED) - helmets_distributed; forward usage of 3 then its void restores on_hand to exactly the pre-usage value (10) and bike.parts_cost_cents to 0 — no drift through the round trip."
        test_recipe:
          setup:
            - "Bike IN_REFURBISHMENT (APPRENTICE lead); Part unit_cost 100 restocked to on_hand 10"
          setup_api_calls:
            - { call: "POST /donors", payload: { display_name: "D CI", donor_type: "INDIVIDUAL", email: "dci@x.org" }, as: ShopCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "V CI", email: "vci@x.org" }, as: ShopCoordinator, captures: { v: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T1", level: "BASIC", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z", credit_hours: 6, capacity: 10 }, as: ShopCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T2", level: "BASIC", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z", credit_hours: 6, capacity: 10 }, as: ShopCoordinator, captures: { s2: $.data.id } }
            - { call: "POST /training-sessions/${s1}/enroll", payload: { volunteer_id: "${v}" }, as: ShopCoordinator, captures: { a1: $.data.id } }
            - { call: "POST /training-sessions/${s2}/enroll", payload: { volunteer_id: "${v}" }, as: ShopCoordinator, captures: { a2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: ShopCoordinator }
            - { call: "POST /training-sessions/${s1}/complete", payload: { marks: [ { attendance_id: "${a1}", outcome: "ATTENDED" } ] }, as: ShopCoordinator }
            - { call: "POST /training-sessions/${s2}/complete", payload: { marks: [ { attendance_id: "${a2}", outcome: "ATTENDED" } ] }, as: ShopCoordinator }
            - { call: "POST /volunteers/${v}/promote", as: ProgramDirector }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-CI", bike_type: "MTB", wheel_size_inches: 29 }, as: ShopCoordinator, captures: { bk: $.data.id } }
            - { call: "POST /bikes/${bk}/triage", payload: { condition_grade: "B", frame_damage: false }, as: ShopCoordinator }
            - { call: "POST /bikes/${bk}/route", payload: { destination: "REFURBISH", refurb_lead_volunteer_id: "${v}" }, as: ShopCoordinator }
            - { call: "POST /parts", payload: { name: "Pedal", category: "DRIVETRAIN", unit_cost_cents: 100 }, as: ShopCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /parts/${pt}/restock", payload: { quantity: 10 }, as: ShopCoordinator, captures: { q0: $.data.quantity_on_hand, pt_v: $.data.version } }
          trigger:
            - { call: "POST /bikes/${bk}/usage-logs", payload: { part_id: "${pt}", quantity: 3, expected_part_version: "${pt_v}" }, as: Volunteer, as_user_id: "${v}", captures: { u1: $.data.id } }
            - { call: "GET /parts/${pt}", as: ShopCoordinator, captures: { q_mid: $.data.quantity_on_hand } }
            - { call: "GET /bikes/${bk}", as: ShopCoordinator, captures: { pc_mid: $.data.parts_cost_cents } }
            - { call: "POST /usage-logs/${u1}/void", payload: { reason: "wrong bike" }, as: ProgramDirector, captures: { u_st: $.data.status } }
            - { call: "GET /parts/${pt}", as: ShopCoordinator, captures: { q_end: $.data.quantity_on_hand } }
            - { call: "GET /bikes/${bk}", as: ShopCoordinator, captures: { pc_end: $.data.parts_cost_cents } }
          assert:
            - "before usage: Part.quantity_on_hand == 10"
            - "after usage of 3: Part.quantity_on_hand == 7 and DonatedBike.parts_cost_cents == 300  (snapshot 100 x 3)"
            - "PartUsage.${u1}.status == VOIDED after void"
            - "after void: Part.quantity_on_hand == 10 == pre-usage value  (conserved)"
            - "after void: DonatedBike.${bk}.parts_cost_cents == 0  (rollup restored, snapshot reversed exactly)"

      - name: hours_approve_void_conservation
        grounds: [calculations.hours_accrual, entities.EarnABikeParticipant.fields.hours_earned, state_machines.HourLog.APPROVED_to_VOIDED]
        distinguishing_aspect: "Conserved quantity = EarnABikeParticipant.hours_earned (credited labor hours): invariant hours_earned == sum of APPROVED logs; approve(4)+approve(4) reaches 8/HOURS_MET, void of one 4h log restores the ledger to exactly 4 and flips the status back to ENROLLED — a different conserved quantity (hours, not stock units) than the part invariant."
        test_recipe:
          setup:
            - "YOUTH participant (required 8) with two PENDING 4h logs; clock 2026-08-07"
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "P HC", contact_email: "phc@x.org", age_group: "YOUTH" }, as: ShopCoordinator, captures: { pa: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: ShopCoordinator }
            - { call: "POST /participants/${pa}/hour-logs", payload: { work_date: "2026-08-02", hours: 4, activity_type: "REFURB_WORK" }, as: Participant, as_user_id: "${pa}", captures: { h1: $.data.id } }
            - { call: "POST /participants/${pa}/hour-logs", payload: { work_date: "2026-08-03", hours: 4, activity_type: "OUTREACH" }, as: Participant, as_user_id: "${pa}", captures: { h2: $.data.id } }
          trigger:
            - { call: "GET /participants/${pa}", as: ShopCoordinator, captures: { v1: $.data.version } }
            - { call: "POST /hour-logs/${h1}/approve", payload: { expected_participant_version: "${v1}" }, as: ShopCoordinator, as_user_id: "sc-approver-1" }
            - { call: "GET /participants/${pa}", as: ShopCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /hour-logs/${h2}/approve", payload: { expected_participant_version: "${v2}" }, as: ShopCoordinator, as_user_id: "sc-approver-1" }
            - { call: "GET /participants/${pa}", as: ShopCoordinator, captures: { h_mid: $.data.hours_earned, st_mid: $.data.status } }
            - { call: "POST /hour-logs/${h2}/void", payload: { reason: "duplicate" }, as: ProgramDirector }
            - { call: "GET /participants/${pa}", as: ShopCoordinator, captures: { h_end: $.data.hours_earned, st_end: $.data.status } }
          assert:
            - "after two approvals: hours_earned == 8 and status == HOURS_MET"
            - "after void of the second log: hours_earned == 4 == sum of remaining APPROVED logs (conserved; equals pre-second-approval value)"
            - "after void: status == ENROLLED  (4 < 8: threshold un-crossed)"
            - "HourLog.${h1}.status == APPROVED and HourLog.${h2}.status == VOIDED"
