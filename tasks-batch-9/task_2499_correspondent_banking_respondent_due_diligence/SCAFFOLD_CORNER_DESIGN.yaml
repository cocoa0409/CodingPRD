              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
            - call: "GET /correspondent-banking/respondents/${r_a_id}/nested-chain?state=DISCLOSED&limit=1&offset=0"
              payload: {}
              as: FIGRelationshipManager
            - call: "GET /correspondent-banking/respondents/${r_b_id}/nested-chain"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
          assert:
            - "first response.status == 200 and its data contains exactly the two rows ${nr_hop} and ${nr_leaf} with total_count 2"
            - "the row ${nr_hop} is reported with depth 2 - respondent A's own edge, extended transitively through B"
            - "the rows are ordered depth ASC and, for equal depths, created_at ASC (${nr_leaf} was created first)"
            - "second response.status == 200 with exactly 1 row and has_more true - the filter and pagination apply to the expanded chain"
            - "third response.status == 200 with exactly one row ${nr_leaf} at depth 1 - B's own chain does not include A's edge"
            - "the read performs no writes: NestedRelationship.${nr_hop}.depth is still 2 and RespondentBank.${r_a_id}.version is unchanged by the GETs"

      - name: calibration_require_recalibration_keeps_the_existing_thresholds
        claim_type: action_endpoint
        grounds:
