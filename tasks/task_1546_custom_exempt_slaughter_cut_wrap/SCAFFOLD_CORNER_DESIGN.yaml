      - name: booking_missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A booking request without valid X-User-Role/X-User-ID headers fails priority-1 auth before any business check."
        test_recipe:
          setup: ["CapacityDay 2026-08-20 cap 1 exists"]
          setup_api_calls:
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantManager, captures: { cd1: $.data.id } }
          trigger:
            - { call: "POST /locker/appointments", payload: { customer_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", capacity_day_id: "${cd1}", species: "BEEF", head_count: 1 }, as: Customer, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 401; error_id == ERR_UNAUTHENTICATED (headers absent/invalid); no appointment created"

