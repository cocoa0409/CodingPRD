              as: RealEstateAnalyst
              captures: { mdl_id: $.data.id }
            - call: "GET /api/sites/${site_id}"
              as: RealEstateAnalyst
              captures: { site_v: $.data.version }
          trigger:
            - call: "POST /api/trade-area-models/${mdl_id}/lock"
              payload: { expected_site_version: "${site_v} - 1" }
              as: RealEstateAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "Response 412 ERR_STALE_VERSION (expected ${site_v} - 1 vs actual ${site_v})"
            - "TradeAreaModel.${mdl_id}.model_status remains DRAFT; Site version still ${site_v}"

      - name: occ_stale_vote_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[vote-stale-review]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Two members both read review version 1; voter1's ballot succeeds (version 2), and the chair's ballot carrying the stale version 1 fails 412 ERR_STALE_VERSION — deterministic via strictly sequential calls."
        test_recipe:
