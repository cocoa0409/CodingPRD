            - "120-minute gap: call B confirm succeeds, status == CONFIRMED (equality is inclusive/allowed)"

  # ---------------------------------------------------------------- rule 7 ---
  - rule_id: cross_entity_state_dependency
    instances:
      - name: board_gated_by_call_and_customs
        grounds:
          - state_machines.ManifestEntry.SCREENED_to_EMBARKED
        distinguishing_aspect: |
          Entity pair ManifestEntry x PortCall AND ManifestEntry x CustomsCase:
          board is rejected while the call is ARRIVED (ERR_INVALID_STATE), then
          rejected while the case is FILED (ERR_CUSTOMS_NOT_CLEARED), succeeding
          only when both parents satisfy their gates. Different pairs than the
          ServiceOrder x BerthAssignment and BaggageItem x ManifestEntry
          instances.
        test_recipe:
          setup:
            - "Call ARRIVED; case FILED (not cleared); entry SCREENED (lane open)"
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV O", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 100, booked_debark_pax: 100 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id, pc_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "P1", direction: "EMBARK", cabin_class: "STANDARD" }, as: VesselAgent, as_user_id: "${ves}", captures: { e1: $.data.id } }
            - { call: "POST /port-ops/manifest-entries/${e1}/check-in", as: TerminalOperator }
            - { call: "POST /port-ops/port-calls/${pc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pc_v}" }, as: Harbormaster, captures: { ba: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${ba}/confirm", as: Harbormaster }
            - { call: "POST /port-ops/port-calls/${pc}/customs-cases", as: CustomsOfficer, captures: { cc: $.data.id } }
            - { call: "POST /port-ops/customs-cases/${cc}/file", as: CustomsOfficer }
            - { call: "POST /port-ops/screening-lanes", payload: { terminal_id: "${term}", lane_code: "L1" }, as: PortAuthorityAdmin, captures: { lane: $.data.id } }
            - { call: "POST /port-ops/screening-lanes/${lane}/open", payload: { officers_assigned: 2 }, as: TerminalOperator }
            - { call: "POST /port-ops/port-calls/${pc}/arrive", payload: { actual_eta: "2026-08-10T08:00:00Z" }, as: Harbormaster }
            - { call: "POST /port-ops/manifest-entries/${e1}/screen", as: TerminalOperator }
          trigger:
            - { call: "POST /port-ops/manifest-entries/${e1}/board", as: TerminalOperator, captures: { err1: $.data.error_id } }
            - { call: "POST /port-ops/port-calls/${pc}/begin-turnaround", as: TerminalOperator }
            - { call: "POST /port-ops/manifest-entries/${e1}/board", as: TerminalOperator, captures: { err2: $.data.error_id } }
            - { call: "POST /port-ops/customs-cases/${cc}/clear", as: CustomsOfficer }
            - { call: "POST /port-ops/manifest-entries/${e1}/board", as: TerminalOperator, captures: { st: $.data.status } }
          assert:
            - "err1 == ERR_INVALID_STATE (call ARRIVED, not TURNAROUND)"
            - "err2 == ERR_CUSTOMS_NOT_CLEARED (case FILED, not CLEARED)"
            - "Third attempt succeeds: st == EMBARKED; PortCall.${pc}.passengers_aboard == 1"
      - name: service_start_gated_by_active_assignment
        grounds:
          - state_machines.ServiceOrder.APPROVED_to_IN_PROGRESS
        distinguishing_aspect: |
          Entity pair ServiceOrder x BerthAssignment: start requires an ACTIVE
          assignment (vessel alongside). With only a CONFIRMED assignment the
          start is rejected; after arrive flips it ACTIVE, the same start
          succeeds. Different entity pair than the other two instances.
        test_recipe:
          setup:
            - "Call SCHEDULED; assignment CONFIRMED; PROVISIONING order APPROVED (posture OPERATIONAL, approved by TerminalOperator)"
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
