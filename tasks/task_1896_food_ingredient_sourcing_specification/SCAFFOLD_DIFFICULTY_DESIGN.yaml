  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: spec_review_reject_revision_cycle
        grounds:
          - state_machines.IngredientSpec.PENDING_REVIEW_to_REJECTED
          - state_machines.IngredientSpec.REJECTED_to_DRAFT
        distinguishing_aspect: |
          Cyclic shape on IngredientSpec: DRAFT -> PENDING_REVIEW -> REJECTED
          -> DRAFT -> PENDING_REVIEW -> APPROVED, a full revision loop (not a
          linear pipeline); the second cycle must allow adding parameters
          again because the spec returns to DRAFT.
        test_recipe:
          setup:
            - "Ingredient ENZ-CYC in DRAFT; author-1 creates spec v1 with one param, submits; qm-1 rejects"
          setup_api_calls:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "ENZ-CYC", name: "Cyclic Enzyme", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
              captures: { ing_id: $.data.id, ing_v: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/specs"
              payload: { spec_version_label: "v1", effective_date: "2026-07-01T00:00:00Z", version_note: "first draft of spec", expected_ingredient_version: "${ing_v}" }
              as: SpecAuthor
              as_user_id: author-1
              captures: { spec_id: $.data.id }
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/parameters"
              payload: { parameter_name: "activity", criticality: "CRITICAL", uom: "u_g", target_value: 100, min_value: 90, max_value: 110 }
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/submit"
              payload: {}
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/reject"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
          trigger:
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/revise"
              payload: {}
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/parameters"
              payload: { parameter_name: "moisture", criticality: "MINOR", uom: "percent", target_value: 5, min_value: 0, max_value: 10 }
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/submit"
              payload: {}
              as: SpecAuthor
              as_user_id: author-1
              captures: { st2: $.data.status }
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/approve"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
              captures: { st3: $.data.status }
          assert:
            - "After revise: status == DRAFT (cycle REJECTED -> DRAFT traversed)"
            - "Parameter add in second DRAFT pass succeeds (loop re-opens parameter editing)"
            - "Second submit: status == PENDING_REVIEW; approve: status == APPROVED"

      - name: corrective_action_resubmission_loop_and_audit_close_gate
        grounds:
          - state_machines.CorrectiveAction.OPEN_to_SUBMITTED
          - state_machines.CorrectiveAction.REJECTED_to_SUBMITTED
          - state_machines.CorrectiveAction.SUBMITTED_to_REJECTED
          - state_machines.SupplierAudit.REPORT_ISSUED_to_CLOSED
        distinguishing_aspect: |
          Cyclic shape on a different entity (CorrectiveAction): OPEN ->
          SUBMITTED -> REJECTED -> SUBMITTED -> VERIFIED; the parent audit's
          close transition is gated on all children reaching VERIFIED —
          compound gating layered on the child cycle.
        test_recipe:
          setup:
            - "Supplier SUP-Q QUALIFIED (via qualification approve)"
            - "Audit scheduled 2026-08-01..2026-08-15, started, report issued with score 65"
            - "CAPA raised (due 2026-08-20T00:00:00Z)"
          setup_api_calls:
            - call: "POST /sourcing/suppliers"
              payload: { supplier_code: "SUP-Q", legal_name: "Quality Supplier", risk_tier: "TIER_B", country_of_operation: "US" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
            - call: "POST /sourcing/suppliers/${sup_id}/qualifications"
              payload: { questionnaire_score: 80, document_pack_complete: true }
              as: SupplierQualityEngineer
              as_user_id: sqe-1
              captures: { qual_id: $.data.id }
            - call: "POST /sourcing/suppliers/${sup_id}/qualifications/${qual_id}/evaluate"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/suppliers/${sup_id}/qualifications/${qual_id}/decide"
              payload: { decision: "APPROVE", decision_note: "qualification approved" }
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/suppliers/${sup_id}/audits"
              payload: { scheduled_window_start: "2026-08-01T00:00:00Z", scheduled_window_end: "2026-08-15T00:00:00Z" }
              as: SupplierQualityEngineer
              as_user_id: sqe-1
              captures: { aud_id: $.data.id }
            - call: "POST /sourcing/suppliers/${sup_id}/audits/${aud_id}/start"
              payload: {}
              as: SupplierQualityEngineer
              as_user_id: sqe-1
            - call: "POST /sourcing/suppliers/${sup_id}/audits/${aud_id}/issue-report"
              payload: { audit_score: 65, findings_summary: "pest control gaps" }
              as: SupplierQualityEngineer
              as_user_id: sqe-1
            - call: "POST /sourcing/suppliers/${sup_id}/audits/${aud_id}/corrective-actions"
              payload: { description: "install bait stations", due_date: "2026-08-20T00:00:00Z" }
              as: QualityManager
              as_user_id: qm-1
              captures: { capa_id: $.data.id }
            - call: "POST /sourcing/suppliers/${sup_id}/audits/${aud_id}/corrective-actions/${capa_id}/submit-response"
              payload: { response_text: "stations ordered" }
              as: SupplierQualityEngineer
              as_user_id: sqe-1
            - call: "POST /sourcing/suppliers/${sup_id}/audits/${aud_id}/corrective-actions/${capa_id}/reject-response"
              payload: { verification_note: "evidence insufficient" }
              as: QualityManager
              as_user_id: qm-1
              captures: { capa_st: $.data.status }
            - call: "POST /sourcing/suppliers/${sup_id}/audits/${aud_id}/close"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
              captures: { close_err: $.data.error_id }
          trigger:
            - call: "POST /sourcing/suppliers/${sup_id}/audits/${aud_id}/corrective-actions/${capa_id}/submit-response"
              payload: { response_text: "stations installed, photos attached" }
              as: SupplierQualityEngineer
              as_user_id: sqe-1
            - call: "POST /sourcing/suppliers/${sup_id}/audits/${aud_id}/corrective-actions/${capa_id}/verify"
              payload: { verification_note: "verified on site visit" }
              as: QualityManager
              as_user_id: qm-1
              captures: { capa_final: $.data.status }
            - call: "POST /sourcing/suppliers/${sup_id}/audits/${aud_id}/close"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
              captures: { aud_final: $.data.status }
          assert:
            - "After reject-response: CAPA status == REJECTED (cyclic loop entered)"
            - "Audit close with REJECTED CAPA fails with ERR_OPEN_CAPAS_EXIST"
            - "Resubmission REJECTED -> SUBMITTED succeeds; verify -> VERIFIED"
            - "Second audit close succeeds: audit status == CLOSED"

