            - call: "POST /exemption-policies/${pol_v}/activate"
              payload: {}
              as: TreasurySupervisor
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "111-22-3333", debtor_name: "Pat Doe", debt_type: "FEDERAL_NONTAX", original_amount_cents: 8000, delinquent_since: "2026-02-01T00:00:00Z", notice_sent_at: "2026-08-01T00:00:00Z", due_process_completed: true }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_a: $.data.id }
            - call: "POST /debts/${debt_a}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "111-22-3333", debtor_name: "Pat Doe", debt_type: "FEDERAL_NONTAX", original_amount_cents: 8000, delinquent_since: "2026-01-01T00:00:00Z", notice_sent_at: "2026-08-01T00:00:00Z", due_process_completed: true }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_b: $.data.id }
            - call: "POST /debts/${debt_b}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
            - *k_file1
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", amount_cents: 10000, payment_type: "VENDOR" }
              as: PaymentAgencyAnalyst
              captures: { pay_1: $.data.id, pay_1_v: $.data.version }
          trigger:
            - call: "POST /payments/${pay_1}/evaluate-offsets"
              payload: { expected_payment_version: "${pay_1_v}" }
