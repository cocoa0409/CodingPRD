        grounds:
          - validations[priority=12]
          - entities.MillJob.fields.start_at
          - entities.MillJob.fields.end_at
          - errors[ERR_MACHINE_DOUBLE_BOOKED]
        distinguishing_aspect: >-
          MillMachine occupation uses half-open intervals [start_at, end_at): a job at [10:00,11:00) is rejected
          against an existing [09:00,10:30) (they intersect) while an adjacent [10:30,11:30) is accepted (touching
          endpoints do not overlap). Interval semantics: half-open, zero buffer, single-resource exclusivity.
