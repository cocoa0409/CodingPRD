            - call: "POST /cabling/mac-tickets/${w1}/schedule"
              payload: { scheduled_window_start: "2026-08-14T10:30:00Z", scheduled_window_end: "2026-08-14T11:30:00Z" }
              as: ProjectManager
            - call: "POST /cabling/mac-tickets/${w2}/schedule"
              payload: { scheduled_window_start: "2026-08-14T10:45:00Z", scheduled_window_end: "2026-08-14T11:15:00Z" }
              as: ProjectManager
            - call: "POST /cabling/mac-tickets/${w3}/schedule"
              payload: { scheduled_window_start: "2026-08-14T11:00:00Z", scheduled_window_end: "2026-08-14T11:20:00Z" }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "the W1 schedule returns 200 with ticket_state == \"SCHEDULED\" and estimated_billed_cents == 9600, because W0 ends exactly 30 minutes before W1's buffered start"
            - "the W2 schedule returns 200 with ticket_state == \"SCHEDULED\" and estimated_billed_cents == 9600, because only one occupying window overlaps and capacity is 2"
            - "the W3 schedule returns 409 with error_id == \"ERR_ROOM_WINDOW_CONFLICT\", because W1 and W2 both overlap the buffered candidate"
            - "GET /cabling/mac-tickets/${w3} still returns ticket_state == \"SUBMITTED\", scheduled_window_start == null and estimated_billed_cents == null"
            - "GET /cabling/projects/${proj} returns consumed_mac_cents == 28800 (three scheduled tickets at 9600), so the refused schedule committed nothing"

  - rule_id: compensating_invariant
    instances:

      - name: route_withdraw_returns_exactly_the_pathway_area_it_consumed
        grounds:
          - state_machines.LinkPathwayRoute.OCCUPYING_to_WITHDRAWN
          - calculations.pathway_fill_evaluation
          - entities.LinkPathwayRoute.fields.consumed_area_sq_mm
          - entities.PathwaySegment.fields.fill_area_used_sq_mm
        distinguishing_aspect: |
          Conserved quantity: PathwaySegment.fill_area_used_sq_mm. A create-then-withdraw pair
          returns the segment to its exact pre-route figures (0.00 sq mm used, 0 occupying
          routes, fill_ratio 0.0000) using the route's own consumed_area_sq_mm snapshot, so no
          rounding drift accumulates. The conserved quantity is pathway cross-section area,
          unlike assignment_release_returns_exactly_the_room_volt_amperes_it_drew, which conserves
          volt-amperes.
        test_recipe:
          setup:
            - "Project RVT1 with CABLE_TRAY segment PS-A (usable_area_sq_mm 20000.0, bend_count 0, allowed_fill_pct 50)"
            - "CAT6A CMP cable type of outer_diameter_mm 7.9, so cross_section_area_sq_mm is 49.02"
            - "Link TR01-A01 in install_state DESIGNED, routed once over PS-A"
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6A", jacket_rating: "CMP", outer_diameter_mm: 7.9, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 150, applications: ["DATA_HORIZONTAL"] }
              as: DesignEngineer
              captures: { ct: $.data.id }
            - call: "POST /cabling/pathway-segments"
              payload: { project_id: "${proj}", segment_code: "PS-A", pathway_type: "CABLE_TRAY", usable_area_sq_mm: 20000.0, length_m: 40.0, bend_count: 0, in_plenum_space: true, shared_with_power: false, power_separation_mm: 0 }
              as: DesignEngineer
              captures: { seg_a: $.data.id, seg_a_v1: $.data.version }
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct}", identifier: "TR01-A01", application: "DATA_HORIZONTAL", horizontal_length_m: 85.63, consolidation_point_stub_m: 0, patch_cord_allowance_m: 2.00 }
              as: DesignEngineer
              captures: { link: $.data.id }
            - call: "POST /cabling/link-routes"
              payload: { link_id: "${link}", pathway_segment_id: "${seg_a}", sequence_index: 1, expected_segment_version: "${seg_a_v1}" }
              as: DesignEngineer
              captures: { route: $.data.id, consumed: $.data.consumed_area_sq_mm }
            - call: "GET /cabling/pathway-segments/${seg_a}"
              payload: {}
              as: DesignEngineer
              captures: { seg_a_v2: $.data.version }
          trigger:
            - call: "POST /cabling/link-routes/${route}/withdraw"
              payload: { expected_segment_version: "${seg_a_v2}" }
              as: DesignEngineer
          assert:
            - "GET /cabling/pathway-segments/${seg_a} before the trigger returns fill_area_used_sq_mm == 49.02, occupying_route_count == 1, allowed_fill_pct == 50 and fill_ratio == 0.0025"
            - "the route create response has consumed_area_sq_mm == 49.02"
            - "the withdraw response has route_state == \"WITHDRAWN\" and consumed_area_sq_mm still == 49.02"
            - "GET /cabling/pathway-segments/${seg_a} after the trigger returns fill_area_used_sq_mm == 0.00, occupying_route_count == 0, allowed_fill_pct == 50 and fill_ratio == 0.0000"
            - "GET /cabling/links/${link} after the trigger returns routed_segment_count == 0 and install_state == \"DESIGNED\""

      - name: assignment_release_returns_exactly_the_room_volt_amperes_it_drew
        grounds:
          - state_machines.RackUnitAssignment.ACTIVE_to_RELEASED
          - calculations.room_power_ledger
          - calculations.rack_ru_ledger
          - entities.TelecomRoom.fields.power_headroom_va
        distinguishing_aspect: |
          A different conserved quantity across a different entity chain: the identity
          power_load_va + power_headroom_va == ups_capacity_va must hold on the TelecomRoom
          before and after the write, and the release must restore rack units AND volt-amperes to
          their exact pre-assignment values two hops up (RackUnitAssignment -> Rack ->
          TelecomRoom). route_withdraw_returns_exactly_the_pathway_area_it_consumed conserves
          pathway area on a single segment instead.
        test_recipe:
          setup:
            - "Project RVT1 with telecom room TR01 (ups_capacity_va 3000) and rack A of total_ru 42"
            - "RackUnitAssignment 'Core switch' ACTIVE over [1,4] with power_va 1200"
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
            - call: "POST /cabling/racks"
              payload: { telecom_room_id: "${room}", rack_code: "A", total_ru: 42 }
              as: DesignEngineer
              captures: { rack: $.data.id, rack_v1: $.data.version }
            - call: "POST /cabling/rack-unit-assignments"
              payload: { rack_id: "${rack}", equipment_label: "Core switch", start_ru: 1, end_ru: 4, power_va: 1200, expected_rack_version: "${rack_v1}" }
              as: DesignEngineer
              captures: { asg: $.data.id }
            - call: "GET /cabling/racks/${rack}"
              payload: {}
              as: DesignEngineer
              captures: { rack_v2: $.data.version }
          trigger:
            - call: "POST /cabling/rack-unit-assignments/${asg}/release"
              payload: { released_reason: "Switch relocated to TR02 during the MAC window", expected_rack_version: "${rack_v2}" }
              as: DesignEngineer
          assert:
            - "GET /cabling/racks/${rack} before the trigger returns occupied_ru == 4, available_ru == 38 and power_draw_va == 1200"
            - "GET /cabling/telecom-rooms/${room} before the trigger returns power_load_va == 1200 and power_headroom_va == 1800, whose sum equals ups_capacity_va 3000"
            - "the release response has assignment_state == \"RELEASED\", span_ru == 4 and released_reason stored"
            - "GET /cabling/racks/${rack} after the trigger returns occupied_ru == 0, available_ru == 42 and power_draw_va == 0"
            - "GET /cabling/telecom-rooms/${room} after the trigger returns power_load_va == 0 and power_headroom_va == 3000, whose sum still equals ups_capacity_va 3000"
