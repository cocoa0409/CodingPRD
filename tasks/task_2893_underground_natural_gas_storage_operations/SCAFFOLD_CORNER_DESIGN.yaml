      - name: nomination_gas_day_must_fall_inside_the_contract_term_inclusively
        claim_type: violation_to_error
        grounds:
          - validations.priority_17_ERR_GAS_DAY_OUTSIDE_TERM
          - errors.ERR_GAS_DAY_OUTSIDE_TERM
          - entities.StorageContract.fields.term_start_date
          - entities.StorageContract.fields.term_end_date
        distinguishing_aspect: |
          The term window is inclusive at BOTH ends and is checked before every later temporal or
          commercial rule: a gas day of 2026-12-31 (exactly term_end_date) is accepted, 2027-01-01 is
          refused, and 2026-07-31 — which also violates the priority 18 cutoff, since its window shut
          on 2026-07-30T13:00:00Z — is still reported as ERR_GAS_DAY_OUTSIDE_TERM because 17 sorts
          ahead of 18. A refused create leaves contract.version untouched.
