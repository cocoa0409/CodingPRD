              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/subrecipient-orgs"
              payload: { legal_name: "Sub", uei: "UEI-SWP1", single_audit_status: "CURRENT", audit_finding_count: 0 }
              as: SubrecipientManager
              captures: { org_id: $.data.id }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "Sweep", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_id}/subrecipient-commitments", payload: { subrecipient_org_id: "${org_id}", subaward_amount_cents: 500000, statement_of_work_received: false, budget_received: false }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "PERSONNEL", description: "salary", fiscal_year: 2027, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-finalizations", payload: { expected_proposal_version: "${pv}" }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_id}/cost-share-commitments", payload: { source_type: "DEPARTMENT", amount_cents: 1000000 }, as: PreAwardAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /pre-award/proposals/${prop_id}/compliance-reviews", payload: { review_type: "IRB" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-09-06T00:00:00Z" }, as: OSPSystemAdmin }
            - { call: "GET /pre-award/funding-opportunities/${opp_id}", payload: {}, as: OSPDirector, captures: { o_status: $.data.status } }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { p_status: $.data.status, p_approved: $.data.total_approved_cost_share_cents } }
            - { call: "GET /pre-award/proposals/${prop_id}/compliance-reviews", payload: {}, as: OSPDirector, captures: { rev_status: "$.data[0].status" } }
            - { call: "GET /pre-award/proposals/${prop_id}/cost-share-commitments", payload: {}, as: OSPDirector, captures: { cs_status: "$.data[0].status" } }
            - { call: "GET /pre-award/proposals/${prop_id}/subrecipient-commitments", payload: {}, as: OSPDirector, captures: { sub_status: "$.data[0].status" } }
          assert:
            - "o_status == INTAKE_CLOSED (link 1)"
            - "p_status == WITHDRAWN (link 2, caused by opportunity closure)"
            - "rev_status == CANCELLED and cs_status == WITHDRAWN and sub_status == VOIDED (link 3, caused by the proposal withdrawal)"
            - "p_approved == 0"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: constraint_vs_fiscal_on_route
        grounds:
          - validations[priority=9]
