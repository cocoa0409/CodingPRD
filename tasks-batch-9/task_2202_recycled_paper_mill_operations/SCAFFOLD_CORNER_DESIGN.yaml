          - errors[ERR_LAND_APPLICATION_BARRED]
          - validations.priority_41
          - calculations.effluent_rolling_compliance
          - endpoints.POST_sludge_manifests
        distinguishing_aspect: "Two over-limit flow days put the permit at EXCEEDANCE, so a manifest destined for LAND_APPLICATION must be refused with 409 ERR_LAND_APPLICATION_BARRED at creation time; the identical manifest to LANDFILL would be accepted, and no SludgeManifest row may exist afterwards."
