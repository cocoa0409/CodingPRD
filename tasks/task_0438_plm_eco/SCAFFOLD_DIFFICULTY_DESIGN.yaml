# =============================================================================
# task_0438_plm_eco — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# EXPERT band. 9 rule_ids x >=2 instances each (>=18 total).
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Asserts use literals pre-computed against §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: bom_cost_planned_vs_effective_diverges
        grounds:
          - calculations.bom_cost_rollup
          - entities.PartRevision.fields.planned_cost_cents
          - entities.PartRevision.fields.effective_cost_cents
        distinguishing_aspect: |
          On the SAME assembly revision, planned_cost_cents (latest non-OBSOLETE child rev:
          C1 rev B, qty 6) = 12000 while effective_cost_cents (released child rev: C1 rev A,
          qty 4) = 10600 — divergence on the PartRevision/BOM cost domain.
        test_recipe:
          setup:
            - "C3 BUY part base_cost 350; C2 BUY part base_cost 1200."
            - "C1 MAKE part labor 800 has rev A (RELEASED via ECO, BOM = C3 qty 4) and a newer rev B (WORKING, BOM = C3 qty 6)."
            - "Assembly A MAKE labor 5000, WORKING rev with BOM lines: C1 qty 2, C2 qty 1 (scrap 0)."
          setup_api_calls:
            - call: "POST /plm/suppliers"
              payload: { name: "Sup", supplier_code: "SUP-BCV" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /plm/parts"
              payload: { part_number: "C3", name: "Comp3", part_type: "BUY", base_cost_cents: 350, default_supplier_id: "${sup_id}" }
              as: Designer
              captures: { c3_id: $.data.id }
            - call: "POST /plm/parts"
              payload: { part_number: "C2", name: "Comp2", part_type: "BUY", base_cost_cents: 1200, default_supplier_id: "${sup_id}" }
              as: Designer
              captures: { c2_id: $.data.id }
            - call: "POST /plm/parts"
              payload: { part_number: "C1", name: "Comp1", part_type: "MAKE", base_cost_cents: 800 }
              as: Designer
              captures: { c1_id: $.data.id, c1_v0: $.data.version }
            # C1 rev A
            - call: "POST /plm/parts/${c1_id}/revisions"
              payload: { expected_part_version: "${c1_v0}" }
              as: Designer
              captures: { c1a_id: $.data.id, c1a_v: $.data.version }
            - call: "POST /plm/part-revisions/${c1a_id}/bom-lines"
              payload: { child_part_id: "${c3_id}", quantity: 4, expected_part_revision_version: "${c1a_v}" }
              as: Designer
            - call: "POST /plm/part-revisions/${c1a_id}/submit-review"
              payload: {}
              as: Designer
            # release C1 rev A through ECO flow
            - call: "POST /plm/change-requests"
              payload: { title: "rel C1A", affected_part_id: "${c1_id}", reason_code: "DESIGN_DEFECT" }
              as: Designer
              captures: { ecr1: $.data.id }
            - call: "POST /plm/change-requests/${ecr1}/submit"
              payload: {}
              as: Designer
            - call: "POST /plm/change-requests/${ecr1}/approve"
              payload: {}
              as: ChangeAdmin
            - call: "POST /plm/change-orders"
              payload: { change_request_id: "${ecr1}", effectivity_date: "2026-01-02T00:00:00Z", required_approvals: 1 }
              as: ChangeAdmin
              as_user_id: "ca1"
              captures: { eco1: $.data.id }
            - call: "POST /plm/change-orders/${eco1}/affected-items"
              payload: { part_revision_id: "${c1a_id}" }
              as: ChangeAdmin
              as_user_id: "ca1"
            - call: "POST /plm/change-orders/${eco1}/approval-tasks"
              payload: { assignee_user_id: "ap1" }
              as: ChangeAdmin
              as_user_id: "ca1"
              captures: { t1: $.data.id }
            - call: "POST /plm/change-orders/${eco1}/submit-for-approval"
              payload: {}
              as: ChangeAdmin
              as_user_id: "ca1"
            - call: "POST /plm/approval-tasks/${t1}/approve"
              payload: {}
              as: Approver
              as_user_id: "ap1"
            - call: "POST /plm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: ChangeAdmin
            - call: "POST /plm/change-orders/${eco1}/make-effective"
              payload: {}
              as: ChangeAdmin
              as_user_id: "ca1"
            # C1 rev B (newer WORKING) branched from released A
            - call: "GET /plm/parts/${c1_id}"
              payload: {}
              as: Designer
              captures: { c1_v1: $.data.version }
            - call: "POST /plm/parts/${c1_id}/revisions"
              payload: { expected_part_version: "${c1_v1}" }
              as: Designer
              captures: { c1b_id: $.data.id, c1b_v: $.data.version }
            - call: "POST /plm/part-revisions/${c1b_id}/bom-lines"
              payload: { child_part_id: "${c3_id}", quantity: 6, expected_part_revision_version: "${c1b_v}" }
              as: Designer
            # Assembly A WORKING rev
            - call: "POST /plm/parts"
              payload: { part_number: "ASM-A", name: "Assembly A", part_type: "MAKE", base_cost_cents: 5000 }
              as: Designer
              captures: { a_id: $.data.id, a_v0: $.data.version }
            - call: "POST /plm/parts/${a_id}/revisions"
              payload: { expected_part_version: "${a_v0}" }
              as: Designer
              captures: { arev_id: $.data.id, arev_v0: $.data.version }
            - call: "POST /plm/part-revisions/${arev_id}/bom-lines"
              payload: { child_part_id: "${c1_id}", quantity: 2, expected_part_revision_version: "${arev_v0}" }
              as: Designer
              captures: { arev_v1: $.data.version }
            - call: "POST /plm/part-revisions/${arev_id}/bom-lines"
              payload: { child_part_id: "${c2_id}", quantity: 1, expected_part_revision_version: "${arev_v1}" }
              as: Designer
          trigger:
            - call: "GET /plm/part-revisions/${arev_id}/cost"
              payload: {}
              as: Designer
              captures: { planned: $.data.planned_cost_cents, effective: $.data.effective_cost_cents }
          assert:
            - "GET cost.data.planned_cost_cents == 12000"
            - "GET cost.data.effective_cost_cents == 10600"
            - "planned_cost_cents != effective_cost_cents (delta 1400)"

      - name: where_used_as_designed_vs_as_released_diverges
        grounds:
          - calculations.where_used_blast_radius
          - entities.Part.fields.released_revision_id
          - entities.BomLine.fields.child_part_id
        distinguishing_aspect: |
          On a target Part T, as_designed_affected_count (parents with any non-OBSOLETE rev
          consuming T = {P1,P2}) = 2 while as_released_affected_count (parents whose
          released_revision_id consumes T = {P1}) = 1 — divergence on the Part impact-count
          domain (distinct from the PartRevision cost domain above).
        test_recipe:
          setup:
            - "Target T BUY part."
            - "P1 MAKE rev RELEASED (via ECO) consumes T qty 1; P2 MAKE rev WORKING consumes T qty 1."
          setup_api_calls:
            - call: "POST /plm/suppliers"
              payload: { name: "Sup", supplier_code: "SUP-WU" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /plm/parts"
              payload: { part_number: "T-COMP", name: "Target", part_type: "BUY", base_cost_cents: 500, default_supplier_id: "${sup_id}" }
              as: Designer
              captures: { t_id: $.data.id }
            - call: "POST /plm/parts"
              payload: { part_number: "P1", name: "Parent1", part_type: "MAKE", base_cost_cents: 100 }
              as: Designer
              captures: { p1_id: $.data.id, p1_v0: $.data.version }
            - call: "POST /plm/parts/${p1_id}/revisions"
              payload: { expected_part_version: "${p1_v0}" }
              as: Designer
              captures: { p1r_id: $.data.id, p1r_v: $.data.version }
            - call: "POST /plm/part-revisions/${p1r_id}/bom-lines"
              payload: { child_part_id: "${t_id}", quantity: 1, expected_part_revision_version: "${p1r_v}" }
              as: Designer
            - call: "POST /plm/part-revisions/${p1r_id}/submit-review"
              payload: {}
              as: Designer
            - call: "POST /plm/change-requests"
              payload: { title: "rel P1", affected_part_id: "${p1_id}", reason_code: "DESIGN_DEFECT" }
              as: Designer
              captures: { ecr2: $.data.id }
            - call: "POST /plm/change-requests/${ecr2}/submit"
              payload: {}
              as: Designer
            - call: "POST /plm/change-requests/${ecr2}/approve"
              payload: {}
              as: ChangeAdmin
            - call: "POST /plm/change-orders"
              payload: { change_request_id: "${ecr2}", effectivity_date: "2026-01-02T00:00:00Z", required_approvals: 1 }
              as: ChangeAdmin
              as_user_id: "ca1"
              captures: { eco2: $.data.id }
            - call: "POST /plm/change-orders/${eco2}/affected-items"
              payload: { part_revision_id: "${p1r_id}" }
              as: ChangeAdmin
              as_user_id: "ca1"
            - call: "POST /plm/change-orders/${eco2}/approval-tasks"
              payload: { assignee_user_id: "ap1" }
              as: ChangeAdmin
              as_user_id: "ca1"
              captures: { t2: $.data.id }
            - call: "POST /plm/change-orders/${eco2}/submit-for-approval"
              payload: {}
              as: ChangeAdmin
              as_user_id: "ca1"
            - call: "POST /plm/approval-tasks/${t2}/approve"
              payload: {}
              as: Approver
              as_user_id: "ap1"
            - call: "POST /plm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: ChangeAdmin
            - call: "POST /plm/change-orders/${eco2}/make-effective"
              payload: {}
              as: ChangeAdmin
              as_user_id: "ca1"
            # P2 WORKING parent consuming T
            - call: "POST /plm/parts"
              payload: { part_number: "P2", name: "Parent2", part_type: "MAKE", base_cost_cents: 100 }
              as: Designer
              captures: { p2_id: $.data.id, p2_v0: $.data.version }
            - call: "POST /plm/parts/${p2_id}/revisions"
              payload: { expected_part_version: "${p2_v0}" }
              as: Designer
              captures: { p2r_id: $.data.id, p2r_v: $.data.version }
            - call: "POST /plm/part-revisions/${p2r_id}/bom-lines"
              payload: { child_part_id: "${t_id}", quantity: 1, expected_part_revision_version: "${p2r_v}" }
              as: Designer
          trigger:
            - call: "GET /plm/parts/${t_id}/where-used"
              payload: {}
              as: Designer
              captures: { ad: $.data.as_designed_affected_count, ar: $.data.as_released_affected_count }
          assert:
            - "where-used.data.as_designed_affected_count == 2"
            - "where-used.data.as_released_affected_count == 1"
            - "as_designed_affected_count != as_released_affected_count"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: bom_rollup_nonlinear_by_part_type
        grounds:
          - calculations.bom_cost_rollup
          - entities.Part.fields.part_type
          - entities.Part.fields.base_cost_cents
        distinguishing_aspect: |
          MODE (a) non-linear: rollup branches on part_type (BUY=base_cost leaf;
          PHANTOM=children only, no own cost; MAKE=children + own labor) with >=3 inputs
          (quantity, child_unit, base_cost) and a conditional per part_type — verified by a
          PHANTOM sub-assembly that contributes its children but adds zero own cost.
        test_recipe:
          setup:
            - "BUY leaf L base_cost 700."
            - "PHANTOM sub-assembly PH (base 999, ignored) with BOM line L qty 3 (scrap 0)."
            - "MAKE assembly M labor 2000 with BOM line PH qty 2 (scrap 0)."
          setup_api_calls:
            - call: "POST /plm/suppliers"
              payload: { name: "Sup", supplier_code: "SUP-NL" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /plm/parts"
              payload: { part_number: "LEAF", name: "Leaf", part_type: "BUY", base_cost_cents: 700, default_supplier_id: "${sup_id}" }
              as: Designer
              captures: { l_id: $.data.id }
            - call: "POST /plm/parts"
              payload: { part_number: "PHAN", name: "Phantom", part_type: "PHANTOM", base_cost_cents: 999 }
              as: Designer
              captures: { ph_id: $.data.id, ph_v0: $.data.version }
            - call: "POST /plm/parts/${ph_id}/revisions"
              payload: { expected_part_version: "${ph_v0}" }
              as: Designer
              captures: { phr_id: $.data.id, phr_v: $.data.version }
            - call: "POST /plm/part-revisions/${phr_id}/bom-lines"
              payload: { child_part_id: "${l_id}", quantity: 3, expected_part_revision_version: "${phr_v}" }
              as: Designer
            - call: "POST /plm/parts"
              payload: { part_number: "MAKE-M", name: "MakeM", part_type: "MAKE", base_cost_cents: 2000 }
              as: Designer
              captures: { m_id: $.data.id, m_v0: $.data.version }
            - call: "POST /plm/parts/${m_id}/revisions"
              payload: { expected_part_version: "${m_v0}" }
              as: Designer
              captures: { mr_id: $.data.id, mr_v: $.data.version }
            - call: "POST /plm/part-revisions/${mr_id}/bom-lines"
              payload: { child_part_id: "${ph_id}", quantity: 2, expected_part_revision_version: "${mr_v}" }
              as: Designer
          trigger:
            - call: "GET /plm/part-revisions/${mr_id}/cost"
              payload: {}
              as: Designer
              captures: { planned: $.data.planned_cost_cents }
          assert:
            # PH planned: round(3*700)=2100 (PHANTOM adds 0). M planned: round(2*2100)=4200 + labor 2000 = 6200
            - "GET cost.data.planned_cost_cents == 6200"

      - name: bom_rollup_round_per_line_then_sum
        grounds:
          - calculations.bom_cost_rollup
          - entities.BomLine.fields.scrap_factor
          - entities.BomLine.fields.quantity
        distinguishing_aspect: |
          MODE (b) rounding-order: two BomLines each yield a fractional extended cost ending
          in .5 (100*1.005=100.5 -> 101; 300*1.005=301.5 -> 302). Round-per-line-then-sum
          = 403; sum-then-round would be 402 — the scaffold pins round-per-line (different
          mode from instance (a)).
        test_recipe:
          setup:
            - "BUY parts X base_cost 100, Y base_cost 300."
            - "MAKE assembly RA labor 5000, WORKING rev: line X qty 1 scrap 0.005, line Y qty 1 scrap 0.005."
          setup_api_calls:
            - call: "POST /plm/suppliers"
              payload: { name: "Sup", supplier_code: "SUP-RD" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /plm/parts"
              payload: { part_number: "RX", name: "X", part_type: "BUY", base_cost_cents: 100, default_supplier_id: "${sup_id}" }
              as: Designer
              captures: { x_id: $.data.id }
            - call: "POST /plm/parts"
              payload: { part_number: "RY", name: "Y", part_type: "BUY", base_cost_cents: 300, default_supplier_id: "${sup_id}" }
              as: Designer
              captures: { y_id: $.data.id }
            - call: "POST /plm/parts"
              payload: { part_number: "RASM", name: "RoundAsm", part_type: "MAKE", base_cost_cents: 5000 }
              as: Designer
              captures: { ra_id: $.data.id, ra_v0: $.data.version }
            - call: "POST /plm/parts/${ra_id}/revisions"
              payload: { expected_part_version: "${ra_v0}" }
              as: Designer
              captures: { rar_id: $.data.id, rar_v0: $.data.version }
            - call: "POST /plm/part-revisions/${rar_id}/bom-lines"
              payload: { child_part_id: "${x_id}", quantity: 1, scrap_factor: 0.005, expected_part_revision_version: "${rar_v0}" }
              as: Designer
              captures: { rar_v1: $.data.version }
            - call: "POST /plm/part-revisions/${rar_id}/bom-lines"
              payload: { child_part_id: "${y_id}", quantity: 1, scrap_factor: 0.005, expected_part_revision_version: "${rar_v1}" }
              as: Designer
          trigger:
            - call: "GET /plm/part-revisions/${rar_id}/cost"
              payload: {}
              as: Designer
              captures: { planned: $.data.planned_cost_cents }
          assert:
            # round(100.5)=101, round(301.5)=302, sum 403, + labor 5000 = 5403
            - "GET cost.data.planned_cost_cents == 5403"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: eco_in_approval_recall_cycle
        grounds:
          - state_machines.EngineeringChangeOrder.IN_APPROVAL_to_DRAFT
          - entities.EngineeringChangeOrder.fields.approval_count
        distinguishing_aspect: |
          ECO cycles IN_APPROVAL -> DRAFT via recall, resetting approval_count to 0 and all
          ApprovalTask decisions to PENDING — a true cyclic (revision-loop) machine on the
          ECO entity.
        test_recipe:
          setup:
            - "ECO with 2 approval tasks, IN_APPROVAL, one task already APPROVED (approval_count=1, required_approvals=2)."
          setup_api_calls:
            - call: "POST /plm/suppliers"
              payload: { name: "Sup", supplier_code: "SUP-RC" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /plm/parts"
              payload: { part_number: "LEAF-RC", name: "BuyLeaf", part_type: "BUY", base_cost_cents: 10, default_supplier_id: "${sup_id}" }
              as: Designer
              captures: { buy_leaf_id: $.data.id }
            - call: "POST /plm/parts"
              payload: { part_number: "RC-P", name: "RCPart", part_type: "MAKE", base_cost_cents: 100 }
              as: Designer
              captures: { rcp_id: $.data.id, rcp_v0: $.data.version }
            - call: "POST /plm/parts/${rcp_id}/revisions"
              payload: { expected_part_version: "${rcp_v0}" }
              as: Designer
              captures: { rcr_id: $.data.id, rcr_v: $.data.version }
            - call: "POST /plm/part-revisions/${rcr_id}/bom-lines"
              payload: { child_part_id: "${buy_leaf_id}", quantity: 1, expected_part_revision_version: "${rcr_v}" }
              as: Designer
            - call: "POST /plm/part-revisions/${rcr_id}/submit-review"
              payload: {}
              as: Designer
            - call: "POST /plm/change-requests"
              payload: { title: "rc", affected_part_id: "${rcp_id}", reason_code: "COST_REDUCTION" }
              as: Designer
              captures: { rc_ecr: $.data.id }
            - call: "POST /plm/change-requests/${rc_ecr}/submit"
              payload: {}
              as: Designer
            - call: "POST /plm/change-requests/${rc_ecr}/approve"
              payload: {}
              as: ChangeAdmin
            - call: "POST /plm/change-orders"
              payload: { change_request_id: "${rc_ecr}", effectivity_date: "2026-02-01T00:00:00Z", required_approvals: 2 }
              as: ChangeAdmin
              as_user_id: "ca1"
              captures: { rc_eco: $.data.id }
            - call: "POST /plm/change-orders/${rc_eco}/affected-items"
              payload: { part_revision_id: "${rcr_id}" }
              as: ChangeAdmin
              as_user_id: "ca1"
            - call: "POST /plm/change-orders/${rc_eco}/approval-tasks"
              payload: { assignee_user_id: "ap1" }
              as: ChangeAdmin
              as_user_id: "ca1"
              captures: { rc_t1: $.data.id }
            - call: "POST /plm/change-orders/${rc_eco}/approval-tasks"
              payload: { assignee_user_id: "ap2" }
              as: ChangeAdmin
              as_user_id: "ca1"
              captures: { rc_t2: $.data.id }
            - call: "POST /plm/change-orders/${rc_eco}/submit-for-approval"
              payload: {}
              as: ChangeAdmin
              as_user_id: "ca1"
            - call: "POST /plm/approval-tasks/${rc_t1}/approve"
              payload: {}
              as: Approver
              as_user_id: "ap1"
          trigger:
            - call: "POST /plm/change-orders/${rc_eco}/recall"
              payload: {}
              as: ChangeAdmin
              as_user_id: "ca1"
              captures: { st: $.data.status, ac: $.data.approval_count }
            - call: "GET /plm/approval-tasks/${rc_t1}"
              payload: {}
              as: Approver
              as_user_id: "ap1"
              captures: { t1_dec: $.data.decision }
          assert:
            - "recall.data.status == DRAFT"
            - "recall.data.approval_count == 0"
            - "ApprovalTask ${rc_t1}.decision == PENDING"

      - name: serialized_unit_parallel_dimensions
        grounds:
          - state_machines.SerializedUnit.CONFORMING_to_NONCONFORMING
          - entities.SerializedUnit.fields.build_status
          - entities.SerializedUnit.fields.conformance_status
        distinguishing_aspect: |
          SerializedUnit carries two independent state axes: build_status (PLANNED->BUILT)
          advances while conformance_status (CONFORMING->NONCONFORMING) flips independently
          on the same row — parallel dimensions on a DIFFERENT entity than the ECO cycle.
        test_recipe:
          setup:
            - "A SerializedUnit pinned to a RELEASED revision, BUILT and CONFORMING."
          setup_api_calls:
            - call: "POST /plm/suppliers"
              payload: { name: "Sup", supplier_code: "SUP-PAR" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /plm/parts"
              payload: { part_number: "LEAF-PAR", name: "BuyLeaf", part_type: "BUY", base_cost_cents: 10, default_supplier_id: "${sup_id}" }
              as: Designer
              captures: { buy_leaf_id: $.data.id }
            - call: "POST /plm/parts"
              payload: { part_number: "PAR-ASM", name: "ParAsm", part_type: "MAKE", base_cost_cents: 0 }
              as: Designer
              captures: { par_pid: $.data.id, par_v0: $.data.version }
            - call: "POST /plm/parts/${par_pid}/revisions"
              payload: { expected_part_version: "${par_v0}" }
              as: Designer
              captures: { released_rev_id: $.data.id, par_rv: $.data.version }
            - call: "POST /plm/part-revisions/${released_rev_id}/bom-lines"
              payload: { child_part_id: "${buy_leaf_id}", quantity: 1, expected_part_revision_version: "${par_rv}" }
              as: Designer
            - call: "POST /plm/part-revisions/${released_rev_id}/submit-review"
              payload: {}
              as: Designer
            - call: "POST /plm/change-requests"
              payload: { title: "par", affected_part_id: "${par_pid}", reason_code: "DESIGN_DEFECT" }
              as: Designer
              captures: { par_ecr: $.data.id }
            - call: "POST /plm/change-requests/${par_ecr}/submit"
              payload: {}
              as: Designer
            - call: "POST /plm/change-requests/${par_ecr}/approve"
              payload: {}
              as: ChangeAdmin
            - call: "POST /plm/change-orders"
              payload: { change_request_id: "${par_ecr}", effectivity_date: "2026-01-02T00:00:00Z", required_approvals: 1 }
              as: ChangeAdmin
              as_user_id: "ca1"
