  # ===================================================================
  # RULE 6 - Boundary / precision checks on distinct metrics reached
  #          through distinct endpoints
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: fee_surcharge_boundary_at_exactly_25000_discounted_cents
        grounds:
          - calculations.athlete_fee_settlement
          - entities.Athlete.fields.fee_total_cents
          - entities.Athlete.fields.fee_breakdown
          - state_machines.Athlete.PENDING_PAYMENT_to_REGISTERED
        distinguishing_aspect: |
          METRIC = MONEY IN INTEGER CENTS, ENDPOINT = POST /athletes/{athlete_id}/pay-fees. The
          surcharge tier is keyed on discounted_cents, and the SURCHARGE_LOW_THRESHOLD_CENTS
          boundary of 25000 is inclusive, so three athletes differing by one cent of event fee land
          at discounted_cents 24998, 24999 and exactly 25000 and pay 24998, 24999 and 26500 - a
          two-cent input change swings the total by 1502 cents because the 1500-cent surcharge
          switches on AT the threshold, not above it.
        test_recipe:
          setup:
            - "One GamesEdition in REGISTRATION_OPEN with age_reference_date 2026-12-31 and registration_deadline_utc 2026-08-25T23:59:59Z."
            - "One LOW-contact TRACK sport with min_age 50 and four 60-64 MEN events with capacity 8 and min_entries_to_stage 1: EA entry_fee_cents 8407, EB entry_fee_cents 8407, EC entry_fee_cents 8408, ED entry_fee_cents 8408."
            - "Three athletes all in age_group_code 60-64 and all in registration_status PENDING_PAYMENT: P born 1966-03-02 with SUBMITTED entries in EA and EB (event_fees 16814), Q born 1963-07-18 with SUBMITTED entries in EC and EB (event_fees 16815), R born 1962-11-30 with SUBMITTED entries in EC and ED (event_fees 16816)."
            - "The logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
            - call: "POST /senior-games/sports"
              payload: { sport_code: "TRACK", name: "Track and Field", contact_class: "LOW", mark_direction: "LOWER_IS_BETTER", required_certification_level: 2, min_age: 50 }
              as: GamesAdmin
              captures: { sp_track_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T100M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 8407, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_a_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T200M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 8407, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_b_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T400M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 8408, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_c_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T800M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 8408, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_d_id: $.data.id }
            - call: "POST /senior-games/games-editions/${ed_id}/open-registration"
              payload: {}
              as: GamesAdmin
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Pia Nordahl", email: "pia.nordahl@example.com", date_of_birth: "1966-03-02", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_p_id: $.data.id }
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Quinn Barrow", email: "quinn.barrow@example.com", date_of_birth: "1963-07-18", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_q_id: $.data.id }
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Rosa Delgado", email: "rosa.delgado@example.com", date_of_birth: "1962-11-30", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_r_id: $.data.id }
            - call: "POST /senior-games/sport-entries"
              payload: { athlete_id: "${ath_p_id}", sport_event_id: "${ev_a_id}", qualification_source: "ORGANIZER_INVITE" }
              as: RegistrationOfficer
              captures: { en_p1_id: $.data.id }
            - call: "POST /senior-games/sport-entries"
              payload: { athlete_id: "${ath_p_id}", sport_event_id: "${ev_b_id}", qualification_source: "ORGANIZER_INVITE" }
              as: RegistrationOfficer
              captures: { en_p2_id: $.data.id }
            - call: "POST /senior-games/sport-entries"
              payload: { athlete_id: "${ath_q_id}", sport_event_id: "${ev_c_id}", qualification_source: "ORGANIZER_INVITE" }
              as: RegistrationOfficer
              captures: { en_q1_id: $.data.id }
            - call: "POST /senior-games/sport-entries"
              payload: { athlete_id: "${ath_q_id}", sport_event_id: "${ev_b_id}", qualification_source: "ORGANIZER_INVITE" }
              as: RegistrationOfficer
              captures: { en_q2_id: $.data.id }
            - call: "POST /senior-games/sport-entries"
              payload: { athlete_id: "${ath_r_id}", sport_event_id: "${ev_c_id}", qualification_source: "ORGANIZER_INVITE" }
              as: RegistrationOfficer
              captures: { en_r1_id: $.data.id }
            - call: "POST /senior-games/sport-entries"
              payload: { athlete_id: "${ath_r_id}", sport_event_id: "${ev_d_id}", qualification_source: "ORGANIZER_INVITE" }
              as: RegistrationOfficer
              captures: { en_r2_id: $.data.id }
          trigger:
            - call: "POST /senior-games/athletes/${ath_p_id}/pay-fees"
              payload: { amount_cents: 24998 }
              as: GamesAdmin
            - call: "POST /senior-games/athletes/${ath_q_id}/pay-fees"
              payload: { amount_cents: 24999 }
              as: GamesAdmin
            - call: "POST /senior-games/athletes/${ath_r_id}/pay-fees"
              payload: { amount_cents: 26500 }
              as: GamesAdmin
          assert:
            - "THRESHOLD MINUS 2: Athlete.${ath_p_id}.fee_total_cents == 24998 and fee_breakdown == { entry_count: 2, event_fees_cents: 16814, subtotal_cents: 26314, discount_pct: 0.05, discount_cents: 1316, discounted_cents: 24998, surcharge_cents: 0 }"
            - "THRESHOLD MINUS 1: Athlete.${ath_q_id}.fee_total_cents == 24999 and fee_breakdown == { entry_count: 2, event_fees_cents: 16815, subtotal_cents: 26315, discount_pct: 0.05, discount_cents: 1316, discounted_cents: 24999, surcharge_cents: 0 }"
            - "AT THRESHOLD: Athlete.${ath_r_id}.fee_total_cents == 26500 and fee_breakdown == { entry_count: 2, event_fees_cents: 16816, subtotal_cents: 26316, discount_pct: 0.05, discount_cents: 1316, discounted_cents: 25000, surcharge_cents: 1500 }"
            - "all three athletes reach registration_status == REGISTERED with fee_paid_cents equal to fee_total_cents"
            - "the discount rounding is identical (1316) for all three despite raw products 1315.7, 1315.75 and 1315.8, so ONLY the surcharge switch distinguishes the totals"
            - "paying Athlete.${ath_r_id} with amount_cents 25000 instead returns HTTP 422 with error_id == ERR_FEE_AMOUNT_MISMATCH, proving the surcharge is inside fee_total_cents at the boundary"

      - name: waitlist_promotion_empty_candidate_set_boundary_is_a_silent_noop
        grounds:
          - calculations.waitlist_promotion_order
          - state_machines.SportEntry.WAITLISTED_to_ACCEPTED
          - state_machines.SportEntry.UNDER_REVIEW_to_WAITLISTED
          - entities.GamesEdition.fields.ops_epoch
          - entities.GamesEdition.fields.provisional_impact_cents
          - entities.SportEvent.fields.available_slots
        distinguishing_aspect: |
          METRIC = CARDINALITY OF THE PROMOTION CANDIDATE SET AT ZERO, ENDPOINT =
          POST /games-editions/{games_edition_id}/ops-run. The waterfall must treat an empty
          candidate set as a silent no-op rather than an error, and must distinguish the two
          distinct ways of reaching cardinality 0: (a) available_slots == 1 but the only WAITLISTED
          entry fails the registration/medical eligibility filter, and (b) the event is skipped
          entirely because available_slots == 0; in both cases ops_epoch still advances by exactly
          1 and provisional_impact_cents is still recomputed.
        test_recipe:
          setup:
            - "One GamesEdition in REGISTRATION_OPEN with registration_deadline_utc 2026-08-25T23:59:59Z, ops_epoch 0 and provisional_impact_cents 0."
            - "One LOW-contact TRACK sport and one 60-64 event T100M with capacity 2 and min_entries_to_stage 1."
            - "Athlete A born 1966-03-02 is REGISTERED (paid 15500 cents) and SCREENED_CLEARED with an ACCEPTED entry, so accepted_entry_count == 1 and available_slots == 1."
            - "Athlete B born 1963-07-18 is still PENDING_PAYMENT and NOT_SCREENED, and B's entry has been reviewed TAKE_UP then WAITLIST, so exactly one WAITLISTED entry exists on an event that has a free slot."
            - "The logical clock stays at 2026-08-01T00:00:00Z for every ops-run, which is strictly before the registration deadline, so no expiry and no edition-status advance can fire."
