              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { base_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", unit_type: "UNIT", unit_id: "1", parent_address_point_id: "${base_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { u1_id: $.data.id }
          trigger:
            - call: "POST /gis/address-points"
              payload: { house_number: 102, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", unit_type: "UNIT", unit_id: "2", parent_address_point_id: "${base_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { hn_err: $.data.error_id }
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "RIGHT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", unit_type: "UNIT", unit_id: "3", parent_address_point_id: "${base_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { side_err: $.data.error_id }
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", unit_type: "UNIT", unit_id: "4", parent_address_point_id: "${u1_id}" }
              as: GisAnalyst
