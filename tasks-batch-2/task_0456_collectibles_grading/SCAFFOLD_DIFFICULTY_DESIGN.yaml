    instances:

      - name: single_active_slab_per_item_blocks_second_encapsulation
        grounds:
          - validations[priority=11]
          - entities.Slab.fields.active
          - errors[ERR_ACTIVE_SLAB_EXISTS]
          - state_machines.SubmissionItem.AUTHENTICATED_to_ENCAPSULATED
        distinguishing_aspect: |
          Interval semantics = exclusive single-occupancy on the SubmissionItem
          'encapsulation slot': at most one active Slab may occupy an item at a
          time. A second encapsulate while an active slab exists is rejected
          with ERR_ACTIVE_SLAB_EXISTS (point-occupancy collision, no adjacency).
        test_recipe:
          setup:
            - "Item already ENCAPSULATED with an active slab; a second AUTHENTICATED pass attempted."
          setup_api_calls:
