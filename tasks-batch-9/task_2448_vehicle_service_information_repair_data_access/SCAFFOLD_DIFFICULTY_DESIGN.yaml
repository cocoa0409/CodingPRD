  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: parity_index_exactly_at_threshold_is_compliant_and_one_tenth_basis_point_over_is_not
        grounds:
          - calculations.parity_index
          - validations[priority=35]
          - entities.Manufacturer.fields.parity_status
          - errors[ERR_PARITY_NON_COMPLIANT]
        distinguishing_aspect: |
          Inclusive-threshold boundary at 4-decimal precision: 115000/100000 rounds to exactly
          1.1500 == PARITY_MAX_INDEX and is COMPLIANT (the comparison is <=), while 115100/100000
          rounds to 1.1510 and is NON_COMPLIANT — a 100-cent price move flips the license gate.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one SystemArea exists"
            - "Manufacturer ACME priced at independent 115000 / dealer 100000, i.e. exactly at PARITY_MAX_INDEX"
            - "Two DRAFT licenses exist under that manufacturer so the gate can be probed on both sides of the boundary"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /system-areas"
              payload: { code: "POWERTRAIN", name: "Powertrain", requires_calibration_doc: false, requires_security_credential: true }
              as: PlatformAdmin
              captures: { sa_pt_id: $.data.id }
            - call: "POST /manufacturers"
              payload: { name: "Acme Motors", oem_code: "ACME", region: "NA", independent_list_monthly_cents: 115000, independent_covered_system_count: 3, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
              as: PlatformAdmin
              captures: { mfr_id: $.data.id }
            - call: "POST /licenses"
              payload: { manufacturer_id: "${mfr_id}", license_model: "SUBSCRIPTION", monthly_fee_cents: 100000, per_vehicle_fee_cents: 2500, seat_cap: 5, covered_system_area_ids: ["${sa_pt_id}"], effective_start: "2026-08-01T00:00:00Z", effective_end: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { lic_a_id: $.data.id }
            - call: "POST /licenses"
              payload: { manufacturer_id: "${mfr_id}", license_model: "PER_VEHICLE", monthly_fee_cents: 100000, per_vehicle_fee_cents: 2500, seat_cap: 5, covered_system_area_ids: ["${sa_pt_id}"], effective_start: "2026-08-01T00:00:00Z", effective_end: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { lic_b_id: $.data.id }
          trigger:
            - call: "POST /licenses/${lic_a_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "PATCH /manufacturers/${mfr_id}/pricing"
              payload: { independent_list_monthly_cents: 115100 }
              as: PlatformAdmin
            - call: "POST /licenses/${lic_b_id}/activate"
              payload: {}
              as: PlatformAdmin
          assert:
            - "at setup: Manufacturer.${mfr_id}.parity_index == 1.1500 and parity_status == COMPLIANT"
            - "first trigger call: response status == 200 and License.${lic_a_id}.status == ACTIVE"
            - "after the PATCH: Manufacturer.${mfr_id}.parity_index == 1.1510 and parity_status == NON_COMPLIANT"
            - "after the PATCH: License.${lic_a_id}.status is still ACTIVE (the gate fires only on activation, there is no cascade)"
            - "third trigger call: response status == 409 and data.error_id == ERR_PARITY_NON_COMPLIANT"
            - "License.${lic_b_id}.status == DRAFT"

      - name: coverage_map_with_zero_active_entitlements_returns_empty_set_zeros
        grounds:
          - calculations.shop_coverage_completeness
          - entities.Shop.fields.coverage_completeness_pct
        distinguishing_aspect: |
          Empty-set boundary (a different boundary mechanism from the inclusive-threshold
          instance above): a shop whose only entitlement is PENDING has total_cells == 0, so the
          ratio is undefined and the pinned answer is completeness_pct == 0.00 with gaps == []
          rather than a division error or 100.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "ACTIVE License covering POWERTRAIN for a manufacturer that has one VehicleModel"
            - "A REPAIR_PROCEDURE publication for that cell exists with a VALIDATED + PUBLISHED version, so cells would be COVERED if any entitlement were ACTIVE"
            - "Shop 'Bay Auto' (tier PRO) funded 200000 holds exactly one entitlement, still in status PENDING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /system-areas"
              payload: { code: "POWERTRAIN", name: "Powertrain", requires_calibration_doc: false, requires_security_credential: true }
              as: PlatformAdmin
              captures: { sa_pt_id: $.data.id }
            - call: "POST /manufacturers"
              payload: { name: "Acme Motors", oem_code: "ACME", region: "NA", independent_list_monthly_cents: 115000, independent_covered_system_count: 3, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
