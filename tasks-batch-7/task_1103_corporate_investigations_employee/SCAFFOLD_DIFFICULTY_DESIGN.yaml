              as: GeneralCounsel
              captures: { notice_id: $.data.id }
            - { call: "POST /api/preservation-notices/${notice_id}/transition", payload: { to_status: ACKNOWLEDGED }, as: GeneralCounsel }
            - call: "POST /api/cases/${case_id}/collection-scopes"
              payload: { custodian_ref: "EMP-100", data_source: EMAIL, planned_start: "2026-05-05T00:00:00Z", planned_end: "2026-05-10T00:00:00Z", preservation_notice_id: "${notice_id}" }
              as: Investigator
              captures: { scope_id: $.data.id }
            - { call: "POST /api/collection-scopes/${scope_id}/transition", payload: { to_status: APPROVED }, as: InvestigationsManager, as_user_id: "mgr-1" }
            - { call: "POST /api/collection-scopes/${scope_id}/transition", payload: { to_status: IN_PROGRESS }, as: Investigator, as_user_id: "inv-1" }
            - call: "POST /api/collection-scopes/${scope_id}/evidence-items"
