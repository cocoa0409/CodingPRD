  # ===========================================================================
  # §1.7 RBAC — five opaque staff roles plus one entity_backed portal role,
  # under a segregation_of_duties role model. Auth pre-checks run at priorities
  # 1-4, the two id-comparing safety checks at 50-52.
  # ===========================================================================
  - section: rbac
    instances:

      - name: each_staff_role_exercises_its_own_write_surface
        claim_type: exclusive_operations
        grounds:
          - rbac.TradeMarketingDirector.exclusive_operations
          - rbac.KeyAccountManager.exclusive_operations
          - rbac.TradeFinanceAnalyst.exclusive_operations
          - rbac.DeductionSpecialist.exclusive_operations
          - rbac.ComplianceAuditor.exclusive_operations
        distinguishing_aspect: |
          One pass over all five staff roles, each performing an operation only it owns:
          director creates the program tree and approves, KAM plans and submits, analyst
          loads a volume fact, specialist books a claim, auditor opens an audit. Every call
          succeeds, which is the positive half of the matrix the next instance inverts.
        test_recipe:
          setup:
            - "An empty system with the logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
          trigger:
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 500000.00, accrual_method_default: "CONSUMPTION" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_id: $.data.id }
            - call: "POST /trade-marketing/brands"
              payload: { program_id: "${prog_id}", name: "Crisp Oat Cereal", list_price_per_case: 24.00, cogs_per_case: 8.70, baseline_units_per_week: 1200 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { brand_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "MegaMart", channel: "GROCERY", deduction_validation_policy: "EVIDENCE_BASED" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_id}", brand_id: "${brand_id}", event_type: "SEASONAL", planned_amount: 50000.00, baseline_units: 20000, planned_incremental_units: 10000 }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { alloc_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations/${alloc_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_v1: $.data.version, alloc_state: $.data.status }
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_id}", name: "Role Matrix Event", window_start: "2026-08-03", window_end: "2026-08-10", accrual_method: "CONSUMPTION", expected_allocation_version: "${alloc_v1}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { promo_id: $.data.id }
            - call: "POST /trade-marketing/promotions/${promo_id}/tactics"
              payload: { tactic_type: "TPR", planned_units: 4000, window_start: "2026-08-03", window_end: "2026-08-10", rate_per_case: 1.000 }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { tactic_id: $.data.id }
            - call: "POST /trade-marketing/promotions/${promo_id}/submit"
              payload: {}
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { submitted_state: $.data.lifecycle_status }
            - call: "POST /trade-marketing/promotions/${promo_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { approver: $.data.approved_by_user_id }
            - call: "POST /trade-marketing/volume-facts"
              payload: { customer_id: "${cust_id}", brand_id: "${brand_id}", fact_type: "CONSUMPTION", period_start: "2026-08-03", units: 5000, source: "EDI_852" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { fact_id: $.data.id }
            - call: "POST /trade-marketing/deductions"
              payload: { customer_id: "${cust_id}", claim_reference: "MM-CLAIM-0040", claimed_amount: 400.00, deduction_date: "2026-08-03" }
              as: DeductionSpecialist
              as_user_id: "ded-1"
              captures: { ded_id: $.data.id }
            - call: "POST /trade-marketing/customers/${cust_id}/compliance-audits"
              payload: { scope_start: "2026-07-06", scope_end: "2026-08-03" }
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { audit_id: $.data.id, auditor: $.data.auditor_user_id }
          assert:
            - "every call in the trigger returns its declared success code (201 or 200)"
            - "${alloc_state} == APPROVED and ${alloc_v1} == 2 — create then approve"
            - "${submitted_state} == SUBMITTED and ${approver} == dir-1"
            - "${auditor} == aud-1 and Customer.${cust_id}.audit_status == AUDIT_IN_PROGRESS"
            - "Customer.${cust_id}.trading_status == ACTIVE — the audit axis moved, the trading axis did not"
            - "Promotion.${promo_id}.lifecycle_status == APPROVED, PromotionTactic.${tactic_id}.status == PLANNED"
            - "VolumeFact.${fact_id}.units == 5000 and Deduction.${ded_id}.status == RECEIVED"

      - name: a_role_reaching_into_another_roles_surface_is_turned_away
        claim_type: cannot_perform_others_exclusive
        grounds:
          - rbac.TradeMarketingDirector.exclusive_operations
          - rbac.KeyAccountManager.exclusive_operations
          - rbac.TradeFinanceAnalyst.exclusive_operations
          - rbac.DeductionSpecialist.exclusive_operations
          - rbac.ComplianceAuditor.exclusive_operations
          - errors.ERR_ROLE_NOT_PERMITTED
          - validations.priority_3
        distinguishing_aspect: |
          Five cross-role writes, one per staff role, all answered with 403
          ERR_ROLE_NOT_PERMITTED at priority 3 — before any existence, state or fiscal rule
          could speak. The KAM attempt targets an existing program tree, so a 404 or 409
          would prove the role gate ran too late.
