            - "1 x 0.01 lbs batch rejected: err == ERR_MAGAZINE_CAPACITY_EXCEEDED (100.01 > 100.00)"
            - "Magazine.${mag}.current_new_lbs == 100.00"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ready_requires_security_posts_secured
        grounds:
          - state_machines.DisplayEvent.STANDBY_CONFIRMED_to_READY
          - state_machines.SecurityPost.transitions
          - errors[ERR_SECURITY_NOT_SECURED]
        distinguishing_aspect: |
          Entity pair (SecurityPost -> DisplayEvent): the READY transition is gated on the
          aggregate state of the event's SecurityPost children — with the single post still
          STAFFED (2 of 3 guards) /ready fails ERR_SECURITY_NOT_SECURED; only the 3rd
          assign's auto-transition to SECURED unblocks it.
        test_recipe:
          setup:
            - "Event STANDBY_CONFIRMED; post r=300 arc=45 (required_guards == 3) with only 2 guards assigned; crew and product gates satisfied"
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-K", venue_name: "County Park", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T23:00:00Z", declared_max_shell_diameter_in: 4 }, as: Operator, as_user_id: "${op}", captures: { ev: $.data.id, ev_v: $.data.version } }
            - { call: "POST /pyro/displays/${ev}/site-plans", payload: { diagram_ref: "D1", launch_area_width_ft: 200, launch_area_length_ft: 200, spectator_boundary_ft: 300, spectator_arc_center_deg: 0, nearest_structure_ft: 500, expected_display_event_version: "${ev_v}" }, as: Operator, as_user_id: "${op}", captures: { sp: $.data.id } }
            - { call: "POST /pyro/displays/${ev}/permit-applications", payload: { site_plan_id: "${sp}", standby_engines: 1 }, as: Operator, as_user_id: "${op}", captures: { app: $.data.id } }
            - { call: "POST /pyro/permit-applications/${app}/approve", payload: { decision_note: "ok" }, as: FireMarshal, as_user_id: "fm_1" }
            - { call: "POST /pyro/displays/${ev}/standby-confirm", payload: { standby_engines_on_site: 1 }, as: FireMarshal, as_user_id: "fm_2" }
            - { call: "POST /pyro/magazines", payload: { name: "MAG-1", atf_magazine_permit: "P-1", magazine_type: "OUTDOOR", capacity_new_lbs: 100.00, inspection_due_at: "2027-01-01T00:00:00Z" }, as: Operator, as_user_id: "${op}", captures: { mag: $.data.id } }
            - { call: "POST /pyro/magazines/${mag}/batches", payload: { product_name: "Shell 4in", un_number: "UN0335", shell_diameter_in: 4, quantity_units: 50, new_per_unit_lbs: 0.50, lot_number: "L1" }, as: Operator, as_user_id: "${op}", captures: { b1: $.data.id } }
            - { call: "POST /pyro/batches/${b1}/movements", payload: { movement_type: "CHECK_OUT", quantity: 10, display_event_id: "${ev}", driver_name: "Dan", vehicle_placard: "1.3G", cdl_hazmat_endorsed: true }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/operators/${op}/crew-members", payload: { full_name: "Lee", cert_level: "LEAD_OPERATOR", cert_expires_at: "2027-06-01T00:00:00Z", hazmat_endorsed: true }, as: Operator, as_user_id: "${op}", captures: { crew: $.data.id } }
            - { call: "POST /pyro/displays/${ev}/security-posts", payload: { post_label: "N", arc_degrees: 45, radius_ft: 300 }, as: Operator, as_user_id: "${op}", captures: { post: $.data.id, req: $.data.required_guards } }
            - { call: "POST /pyro/security-posts/${post}/assign", payload: { guard_name: "g1", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/security-posts/${post}/assign", payload: { guard_name: "g2", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
          trigger:
            - { call: "POST /pyro/displays/${ev}/ready", payload: {}, as: Operator, as_user_id: "${op}", captures: { err: $.data.error_id } }
            - { call: "POST /pyro/security-posts/${post}/assign", payload: { guard_name: "g3", guard_company: "SEC" }, as: Operator, as_user_id: "${op}", captures: { post_status: $.data.status } }
            - { call: "POST /pyro/displays/${ev}/ready", payload: {}, as: Operator, as_user_id: "${op}", captures: { ev_status: $.data.status } }
          assert:
            - "first /ready -> err == ERR_SECURITY_NOT_SECURED (post STAFFED at 2 of required 3)"
            - "third assign -> post status == SECURED (assigned_guards 3 >= required_guards 3)"
            - "second /ready -> DisplayEvent.${ev}.status == READY"

      - name: movement_blocked_until_permit_approved
        grounds:
          - state_machines.DisplayEvent.transitions
          - state_machines.PermitApplication.transitions
          - errors[ERR_PERMIT_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair (PermitApplication -> InventoryMovement, via the parent
          DisplayEvent): a CHECK_OUT while the application is still SUBMITTED fails
          ERR_PERMIT_NOT_APPROVED even though batch, magazine, and manifest are valid;
          the marshal's approve transition (a different entity's state) is what unblocks
          it. Different pair than ready_requires_security_posts_secured.
        test_recipe:
          setup:
            - "Event SUBMITTED (application pending review); batch in magazine with 50 units"
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-L", venue_name: "Stadium Lot", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T23:00:00Z", declared_max_shell_diameter_in: 4 }, as: Operator, as_user_id: "${op}", captures: { ev: $.data.id, ev_v: $.data.version } }
            - { call: "POST /pyro/displays/${ev}/site-plans", payload: { diagram_ref: "D1", launch_area_width_ft: 200, launch_area_length_ft: 200, spectator_boundary_ft: 300, spectator_arc_center_deg: 0, nearest_structure_ft: 500, expected_display_event_version: "${ev_v}" }, as: Operator, as_user_id: "${op}", captures: { sp: $.data.id } }
            - { call: "POST /pyro/displays/${ev}/permit-applications", payload: { site_plan_id: "${sp}", standby_engines: 1 }, as: Operator, as_user_id: "${op}", captures: { app: $.data.id } }
            - { call: "POST /pyro/magazines", payload: { name: "MAG-1", atf_magazine_permit: "P-1", magazine_type: "OUTDOOR", capacity_new_lbs: 100.00, inspection_due_at: "2027-01-01T00:00:00Z" }, as: Operator, as_user_id: "${op}", captures: { mag: $.data.id } }
            - { call: "POST /pyro/magazines/${mag}/batches", payload: { product_name: "Shell 4in", un_number: "UN0335", shell_diameter_in: 4, quantity_units: 50, new_per_unit_lbs: 0.50, lot_number: "L1" }, as: Operator, as_user_id: "${op}", captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /pyro/batches/${b1}/movements", payload: { movement_type: "CHECK_OUT", quantity: 10, display_event_id: "${ev}", driver_name: "Dan", vehicle_placard: "1.3G", cdl_hazmat_endorsed: true }, as: Operator, as_user_id: "${op}", captures: { err: $.data.error_id } }
            - { call: "POST /pyro/permit-applications/${app}/approve", payload: { decision_note: "ok" }, as: FireMarshal, as_user_id: "fm_1" }
            - { call: "POST /pyro/batches/${b1}/movements", payload: { movement_type: "CHECK_OUT", quantity: 10, display_event_id: "${ev}", driver_name: "Dan", vehicle_placard: "1.3G", cdl_hazmat_endorsed: true }, as: Operator, as_user_id: "${op}", captures: { mv: $.data.id } }
          assert:
            - "pre-approval CHECK_OUT -> err == ERR_PERMIT_NOT_APPROVED (http 409)"
            - "after PermitApplication APPROVED, identical CHECK_OUT succeeds and returns a movement id"
            - "ProductBatch.${b1}.qty_at_show == 10 after the approved movement"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_booking_buffer_boundary
        grounds:
          - validations[priority=10]
          - errors[ERR_VENUE_CONFLICT]
          - entities.DisplayEvent.fields.venue_id
        distinguishing_aspect: |
          Semantics: buffered half-open interval separation on the Venue resource — a new
          event must start at or after (existing_end + 120 min); A occupies
          20:00-21:00, so B starting 22:59 collides (ERR_VENUE_CONFLICT) while C starting
          at exactly 23:00 (== end + buffer) is accepted. Adjacency at exactly the buffer
          edge is NOT a conflict.
        test_recipe:
          setup:
            - "Operator with license through 2027; event A at VEN-X occupying 2026-09-01 20:00-21:00"
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-X", venue_name: "Old Mill", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T21:00:00Z", declared_max_shell_diameter_in: 4 }, as: Operator, as_user_id: "${op}", captures: { ea: $.data.id } }
          trigger:
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-X", venue_name: "Old Mill", scheduled_start_at: "2026-09-01T22:59:00Z", scheduled_end_at: "2026-09-01T23:30:00Z", declared_max_shell_diameter_in: 3 }, as: Operator, as_user_id: "${op}", captures: { err_b: $.data.error_id } }
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-X", venue_name: "Old Mill", scheduled_start_at: "2026-09-01T23:00:00Z", scheduled_end_at: "2026-09-02T00:30:00Z", declared_max_shell_diameter_in: 3 }, as: Operator, as_user_id: "${op}", captures: { ec: $.data.id } }
          assert:
            - "B at 22:59 -> err_b == ERR_VENUE_CONFLICT (inside A's trailing 120-minute buffer)"
            - "C at exactly 23:00 (A.end 21:00 + 120 min) -> 201 created, DisplayEvent.${ec} exists"
            - "license_validity check passes for both (license covers the window; only the venue rule discriminates)"

      - name: license_containment_inclusive_boundary
        grounds:
          - validations[priority=10]
          - errors[ERR_LICENSE_EXPIRED]
          - entities.Operator.fields.license_expires_at
        distinguishing_aspect: |
          Semantics: point-in-CLOSED-interval containment on the Operator-license resource —
          a show whose scheduled_start_at equals license_expires_at exactly is still
          covered (inclusive end), while one second past expiry is rejected
          (ERR_LICENSE_EXPIRED). Different resource and different interval geometry than
          venue_booking_buffer_boundary (containment vs buffered separation).
        test_recipe:
          setup:
            - "Operator L1 whose license expires exactly 2026-09-01T20:00:00Z; operator L2 whose license expires 2026-09-01T19:59:59Z"
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "L1 Pyro", atf_license_number: "ATF-L1", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2026-09-01T20:00:00Z" }, as: SystemAdmin, captures: { op1: $.data.id } }
            - { call: "POST /pyro/operators", payload: { legal_name: "L2 Pyro", atf_license_number: "ATF-L2", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2026-09-01T19:59:59Z" }, as: SystemAdmin, captures: { op2: $.data.id } }
          trigger:
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-Y", venue_name: "Fort Field", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T21:00:00Z", declared_max_shell_diameter_in: 4 }, as: Operator, as_user_id: "${op1}", captures: { e1: $.data.id } }
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-Z", venue_name: "Pier", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T21:00:00Z", declared_max_shell_diameter_in: 4 }, as: Operator, as_user_id: "${op2}", captures: { err2: $.data.error_id } }
          assert:
            - "L1 show starting exactly at license_expires_at -> 201 created (closed-interval containment)"
            - "L2 (expiry one second before start) -> err2 == ERR_LICENSE_EXPIRED"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: checkout_return_restores_magazine_mass
        grounds:
          - calculations.c_magazine_mass
          - entities.Magazine.fields.current_new_lbs
        distinguishing_aspect: |
          Conserved quantity: magazine net explosive mass (lbs). A CHECK_OUT(20) of a
          0.50 lbs/unit batch drops current_new_lbs 25.00 -> 15.00; the compensating
          RETURN(20) restores it to exactly 25.00 with zero drift.
        test_recipe:
          setup:
            - "Event APPROVED; magazine with one batch of 50 units x 0.50 lbs (25.00 lbs)"
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-M", venue_name: "Gravel Pit", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T23:00:00Z", declared_max_shell_diameter_in: 4 }, as: Operator, as_user_id: "${op}", captures: { ev: $.data.id, ev_v: $.data.version } }
