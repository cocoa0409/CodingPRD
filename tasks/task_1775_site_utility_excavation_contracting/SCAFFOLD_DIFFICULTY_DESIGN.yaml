              as: Foreman
              captures: { s2_id: $.data.id }
          trigger:
            - call: "POST /site-utility/shutdown-windows"
              payload: { project_id: "${p1_id}", utility_owner_id: "${o_id}", pipe_segment_id: "${s1_id}", window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T12:00:00Z", expected_project_version: "${p1_v}" }
              as: ProjectManager
              captures: { w1_id: $.data.id }
            - call: "POST /site-utility/shutdown-windows"
              payload: { project_id: "${p2_id}", utility_owner_id: "${o_id}", pipe_segment_id: "${s2_id}", window_start: "2026-08-03T12:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_project_version: "${p2_v}" }
              as: ProjectManager
              captures: { w2_id: $.data.id }
            - call: "GET /site-utility/projects/${p2_id}"
              payload: {}
