  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_floorplan_line_stale_vehicle_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[floor-plan-line-supersede]", "endpoints.POST_/vehicles/{id}/floor-plan-lines", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Re-flooring with a stale expected_vehicle_version (the version observed before the first floor) -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["A vehicle floored once; the original (pre-floor) version captured."]
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM2000061", condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 2200000, list_price_cents: 2000000 }
              as: InventoryClerk
              captures: { v_id: $.data.id, v_ver0: $.data.version }
            - call: "POST /vehicles/${v_id}/floor-plan-lines"
              payload: { lender_name: "FLOORBANK", principal_cents: 1800000, annual_rate_bps: 825, floored_on: "2026-05-01T00:00:00.000Z", expected_vehicle_version: "${v_ver0}" }
              as: InventoryClerk
          trigger:
            - call: "POST /vehicles/${v_id}/floor-plan-lines"
              payload: { lender_name: "FLOORBANK", principal_cents: 1700000, annual_rate_bps: 825, floored_on: "2026-05-15T00:00:00.000Z", expected_vehicle_version: "${v_ver0}" }
              as: InventoryClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412 and data.error_id == ERR_STALE_VERSION (v_ver0 is now stale; the first floor bumped Vehicle.version)"

      - name: occ_floorplan_line_fresh_version_supersedes
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[floor-plan-line-supersede]", state_machines.FloorPlanLine.ACTIVE_to_SUPERSEDED]
        distinguishing_aspect: "Re-flooring with the CURRENT vehicle version succeeds (201) and supersedes the prior ACTIVE FloorPlanLine."
        test_recipe:
          setup: ["A vehicle floored once; re-read version after first floor."]
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM2000062", condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 2200000, list_price_cents: 2000000 }
              as: InventoryClerk
              captures: { v_id: $.data.id, v_ver0: $.data.version }
            - call: "POST /vehicles/${v_id}/floor-plan-lines"
              payload: { lender_name: "FLOORBANK", principal_cents: 1800000, annual_rate_bps: 825, floored_on: "2026-05-01T00:00:00.000Z", expected_vehicle_version: "${v_ver0}" }
              as: InventoryClerk
              captures: { fp1_id: $.data.id }
            - call: "GET /vehicles/${v_id}"
              payload: {}
              as: InventoryClerk
              captures: { v_ver1: $.data.version }
          trigger:
            - call: "POST /vehicles/${v_id}/floor-plan-lines"
              payload: { lender_name: "FLOORBANK", principal_cents: 1700000, annual_rate_bps: 825, floored_on: "2026-05-15T00:00:00.000Z", expected_vehicle_version: "${v_ver1}" }
              as: InventoryClerk
              captures: { fp2_id: $.data.id }
          assert:
            - "response status == 201 and FloorPlanLine ${fp2_id} status ACTIVE"
            - "GET /vehicles/${v_id}/floor-plan-lines shows FloorPlanLine ${fp1_id} status SUPERSEDED"

      - name: occ_finance_contract_stale_deal_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[finance-contract-supersede]", "endpoints.POST_/deals/{id}/finance-contracts", "errors[ERR_STALE_VERSION]"]
