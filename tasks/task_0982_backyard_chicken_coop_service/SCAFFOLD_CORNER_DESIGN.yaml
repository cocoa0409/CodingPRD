            - call: "POST /coopcare/sitting-routes/${route_id}/publish"
              as: Dispatcher
              captures: { route_v_pub: $.data.version }
            - call: "POST /coopcare/sitting-engagements"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-02T00:00:00Z", daily_window_start: "08:00" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /coopcare/sitting-engagements/${eng_id}/quote"
              as: Dispatcher
            - call: "POST /coopcare/sitting-engagements/${eng_id}/confirm"
              as: Customer
              as_user_id: "${hh_id}"
          trigger:
            - call: "POST /coopcare/sitting-routes/${route_id}/stops"
              payload: { engagement_id: "${eng_id}", planned_start: "2026-08-01T12:00:00Z", planned_end: "2026-08-01T13:00:00Z", expected_route_version: "${route_v_pub}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
            - call: "GET /coopcare/sitting-routes/${route_id}"
              as: Dispatcher
              captures: { route_v_cur: $.data.version }
            - call: "POST /coopcare/sitting-routes/${route_id}/stops"
              payload: { engagement_id: "${eng_id}", planned_start: "2026-08-01T12:00:00Z", planned_end: "2026-08-01T13:00:00Z", expected_route_version: "${route_v_cur}" }
              as: Dispatcher
              captures: { stop_id: $.data.id, seq: $.data.sequence }
          assert:
            - "first add-stop rejected with error_id == ERR_STALE_VERSION (http 412): publish-time version went stale when confirm added a stop"
            - "second add-stop with the re-read version succeeds (201)"
            - "RouteStop.${stop_id}.sequence == 2 and SittingRoute.${route_id}.committed_stops == 2"

      - name: visit_list_pagination_filter_interaction
        claim_type: pagination_with_filtering
        grounds: [endpoints.GET_/coopcare/service-visits, response_envelope.pagination_fields]
        distinguishing_aspect: "Filter and pagination compose: with 3 visits where 1 is SCHEDULED, status=REQUESTED&limit=1 returns total_count 2 (filtered total, not the unfiltered 3) and has_more true."
        test_recipe:
          setup: ["URBAN household with PLANNED coop; 3 SETUP_INSTALL visits; one assigned to tech-1 (SCHEDULED)"]
          setup_api_calls:
            - call: "POST /coopcare/households"
              payload: { name: "H PF", email: "hpf@x.com", address: "57 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/coop-sites"
              payload: { household_id: "${hh_id}", site_label: "coop", coop_capacity_hens: 4 }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { coop_id: $.data.id }
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T11:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { v1: $.data.id }
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-06-11T09:00:00Z", scheduled_end: "2026-06-11T11:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-06-12T09:00:00Z", scheduled_end: "2026-06-12T11:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/service-visits/${v1}/assign"
              payload: { technician_id: "tech-1" }
              as: Dispatcher
          trigger:
            - call: "GET /coopcare/service-visits"
              payload: { household_id: "${hh_id}", status: "REQUESTED", limit: 1, offset: 0 }
              as: Dispatcher
          assert:
            - "page returns exactly 1 item"
            - "total_count == 2 (only REQUESTED visits counted)"
            - "has_more == true"

      - name: plan_change_pending_until_renew
        claim_type: scheduled_actions
        grounds: [entities.Subscription.fields.pending_plan_id, state_machines.Subscription.ACTIVE_to_ACTIVE]
        distinguishing_aspect: "A scheduled plan change is deferred: immediately after plan-changes the active plan_id is unchanged and only pending_plan_id is set; nothing about coverage or fees changes until renew-period."
        test_recipe:
          setup: ["plans A (included_cleanings 1) and B; subscription on A; plan change to B posted with fresh OCC version"]
          setup_api_calls:
            - call: "POST /coopcare/subscription-plans"
              payload: { plan_code: "PCA", monthly_fee_cents: 2900, included_cleanings_per_period: 1, included_health_checks_per_period: 0, supply_discount_pct: 0, sitting_discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_a: $.data.id }
            - call: "POST /coopcare/subscription-plans"
              payload: { plan_code: "PCB", monthly_fee_cents: 4900, included_cleanings_per_period: 4, included_health_checks_per_period: 2, supply_discount_pct: 0.10, sitting_discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_b: $.data.id }
            - call: "POST /coopcare/households"
              payload: { name: "H PC", email: "hpc@x.com", address: "58 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/subscriptions"
              payload: { household_id: "${hh_id}", plan_id: "${plan_a}", current_period_start: "2026-05-01T00:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { sub_id: $.data.id, sub_v: $.data.version }
          trigger:
            - call: "POST /coopcare/subscriptions/${sub_id}/plan-changes"
              payload: { new_plan_id: "${plan_b}", expected_subscription_version: "${sub_v}" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { plan_now: $.data.plan_id, pend: $.data.pending_plan_id }
          assert:
            - "Subscription.${sub_id}.plan_id == ${plan_a} (unchanged until renew-period)"
            - "Subscription.${sub_id}.pending_plan_id == ${plan_b}"
            - "Subscription.${sub_id}.status == ACTIVE"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_suspend
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, state_machines.HouseholdAccount.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "Immediate consistency: the suspend response and the very next GET both show status SUSPENDED and version 2; no reconciliation lag exists."
        test_recipe:
          setup: ["URBAN household exists (version 1)"]
          setup_api_calls:
            - call: "POST /coopcare/households"
              payload: { name: "H Imm", email: "himm@x.com", address: "59 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
          trigger:
            - call: "POST /coopcare/households/${hh_id}/suspend"
              as: BillingAdmin
              captures: { st: $.data.status, ver: $.data.version }
            - call: "GET /coopcare/households/${hh_id}"
              as: BillingAdmin
              captures: { st2: $.data.status, ver2: $.data.version }
          assert:
            - "suspend response status == SUSPENDED and version == 2"
            - "immediately following GET shows status == SUSPENDED and version == 2 (mutation visible in the same logical sequence)"
