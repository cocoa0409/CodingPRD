      - name: shoot_block_links_executed_agreements_and_counts_minors
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/casting/shoot-blocks
          - entities.ShootBlock.fields.participant_agreement_ids
          - entities.ShootBlock.fields.minor_participant_count
          - entities.Applicant.fields.is_minor
        distinguishing_aspect: |
          Cross-reference claim over an id ARRAY: the block resolves each agreement to
          its applicant and counts only the minors, so a block calling one minor and one
          adult reports minor_participant_count 1 while carrying two agreement links.
          The count is derived at write time from the referenced rows rather than
          supplied by the caller, so a build that echoed an input field or counted every
          link would report 0 or 2.
