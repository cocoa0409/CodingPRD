        claim_type: optimistic_concurrency
        grounds: [state_machines.Lounge.OPEN_to_CLOSED, "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Closing a lounge with a stale expected_lounge_version is rejected ERR_STALE_VERSION; correct version succeeds."
        test_recipe:
          setup: ["Lounge created at v0. One hold advances the version. A close carrying the pre-hold v0 is stale."]
          setup_api_calls:
            - call: "POST /membership-plans"
