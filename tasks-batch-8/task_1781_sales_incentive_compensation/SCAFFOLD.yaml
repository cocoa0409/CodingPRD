# =============================================================================
# SCAFFOLD.yaml — Sales Incentive Compensation Administration
# §1.0–§1.7 (difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  Sales Incentive Compensation Administration (sales compensation team): plan
  design & quota-to-payout curve, plan document acceptance & versioning,
  transaction crediting rules (splits/roll-ups/hierarchy), attainment
  calculation & accelerators, draws, guarantees & clawback on cancellation,
  dispute intake & adjustment approval, payout file to payroll & accrual,
  plan effectiveness analytics

domain_name: sales-incentive-compensation
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - rate_threshold_triggers        # accelerator tiers at attainment boundaries
    - cascading_side_effects         # posting -> rollup -> earned; cancel -> reverse -> clawback
    - ops_run_checkpoint             # period close generates statements, locks credits, advances epoch
    - optimistic_concurrency         # OCC on plan revise and period close
  entity_topology: flat              # peer resources at top-level paths, FK links in bodies/queries
  state_machine_shape: branching     # dispute fork-join + assignment acceptance cycle + parallel dimensions
  relationship_patterns:
    - one_to_many
    - self_referential               # Rep.manager_id -> Rep.id; CreditEntry.parent_credit_id -> CreditEntry.id
    - cross_aggregate
  role_model: segregation_of_duties  # plan creator != publisher; adjustment creator != approver
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CompProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: current_period_index, type: integer, source: system, default: 1, description: "Current open compensation period (1-based); incremented by close-period" }
      - { name: accrued_balance_cents, type: integer, source: computed, default: 0, description: "Recognized unpaid net payout liability: += sum(net_payable_cents) at period close; -= export total_cents at payroll export" }

  - name: CompPlan
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> CompProgram.id" }
      - { name: name, type: string, source: input, description: "Plan name" }
      - { name: effective_start_date, type: string, source: input, description: "YYYY-MM-DD; inclusive lower bound of plan window" }
      - { name: effective_end_date, type: string, source: input, description: "YYYY-MM-DD; INCLUSIVE upper bound (closed interval); must be >= effective_start_date", constraints: ">= effective_start_date" }
      - { name: curve_tiers, type: array, source: input, description: "Quota-to-payout curve: [{attainment_floor_bps, rate_bps}]; first floor must be 0, floors strictly ascending, rates >= 0", constraints: "non-empty; first attainment_floor_bps == 0; floors strictly ascending; rate_bps >= 0" }
      - { name: attainment_mode, type: enum, source: input, default: "DIRECT_ONLY", description: "DIRECT_ONLY | INCLUDE_ROLLUP — input set for attainment/curve", constraints: "enum {DIRECT_ONLY, INCLUDE_ROLLUP}" }
      - { name: rollup_rate_bps, type: integer, source: input, default: 0, description: "Fraction (bps) of a subordinate's posted credit rolled up to the direct manager, one hierarchy level only", constraints: ">= 0" }
      - { name: payout_cap_cents, type: integer, source: input, default: null, description: "Optional per-period gross payout cap; null = uncapped", constraints: "> 0 or null" }
      - { name: document_version, type: integer, source: system, default: 1, description: "Plan document version; incremented by revise; acceptances pin the version accepted" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; publish/revise require a different user (segregation of duties)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | ARCHIVED", constraints: "enum {DRAFT, PUBLISHED, ARCHIVED}" }

  - name: Rep
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> CompProgram.id" }
      - { name: name, type: string, source: input, description: "Rep display name" }
      - { name: employee_ref, type: string, source: input, description: "External employee reference; unique per program", constraints: "unique per program_id" }
      - { name: manager_id, type: string, source: input, default: null, description: "FK -> Rep.id; self-referential manager link; same program required; manager chain must be acyclic (a rep may not be their own manager or have a descendant as manager)", constraints: "same program; acyclic chain" }

  - name: PlanAssignment
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> CompProgram.id" }
      - { name: rep_id, type: string, source: input, description: "FK -> Rep.id" }
      - { name: plan_id, type: string, source: input, description: "FK -> CompPlan.id; plan must be PUBLISHED at creation" }
      - { name: quota_cents, type: integer, source: input, description: "Per-period quota for this assignment", constraints: "> 0" }
      - { name: draw_amount_cents_per_period, type: integer, source: input, default: 0, description: "Draw paid each closed period while assignment is ACTIVE", constraints: ">= 0" }
      - { name: draw_recoverable, type: boolean, source: input, default: true, description: "true: paid draws accrue to draw_outstanding_cents and are recovered from gross payout; false: draws never accrue" }
      - { name: guarantee_amount_cents_per_period, type: integer, source: input, default: 0, description: "Minimum net payable per closed period; 0 = no guarantee", constraints: ">= 0" }
      - { name: effective_start_date, type: string, source: input, description: "YYYY-MM-DD; half-open interval [start, end) per rep; end exclusive" }
      - { name: effective_end_date, type: string, source: input, default: null, description: "YYYY-MM-DD exclusive, or null = open-ended", constraints: "null or > effective_start_date" }
      - { name: status, type: enum, source: system, description: "Lifecycle dimension: ACTIVE | TERMINATED", constraints: "enum {ACTIVE, TERMINATED}" }
      - { name: acceptance_status, type: enum, source: system, description: "Document dimension: OFFERED | ACCEPTED | DECLINED; initial OFFERED", constraints: "enum {OFFERED, ACCEPTED, DECLINED}" }
      - { name: accepted_document_version, type: integer, source: system, default: null, description: "Plan document_version last accepted; null until first acceptance" }
      - { name: draw_outstanding_cents, type: integer, source: computed, default: 0, description: "Recoverable draw debt: paid - recovered - forgiven (see draw_ledger)" }
      - { name: draw_forgiven_cents, type: integer, source: computed, default: 0, description: "Draw debt forgiven at termination (or negative-earnings deficit forgiven when draw_recoverable=false)" }
      - { name: current_period_earned_cents, type: integer, source: computed, default: 0, description: "Net credited amount in the current open period: += credit_amount on POSTED; -= on same-period reversal; reset to 0 at period close" }
      - { name: current_attainment_bps, type: integer, source: computed, default: 0, description: "floor(mode-filtered earned * 10000 / quota_cents); recomputed on every credit change" }
      - { name: provisional_period_payout_cents, type: integer, source: computed, default: 0, description: "Estimate: curve applied to (mode-filtered current_period_earned + PENDING credits), no cap/draw/guarantee" }
      - { name: lifetime_earned_cents, type: integer, source: computed, default: 0, description: "Sum of earned_total_cents across all closed statements of this assignment" }
      - { name: lifetime_paid_cents, type: integer, source: computed, default: 0, description: "Sum of net_payable_cents across all closed statements of this assignment" }

  - name: SalesTransaction
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> CompProgram.id" }
      - { name: external_ref, type: string, source: input, description: "Client-supplied idempotency reference; unique per program regardless of status", constraints: "unique per program_id" }
      - { name: amount_cents, type: integer, source: input, description: "Total transaction amount to be credited", constraints: "> 0" }
      - { name: transaction_date, type: string, source: input, description: "YYYY-MM-DD business date (informational; period attribution uses posted_period_index)" }
      - { name: splits, type: array, source: input, description: "[{rep_id, split_bps}]; split_bps integers > 0; sum must equal exactly 10000", constraints: "sum(split_bps) == 10000; every rep must have an ACTIVE assignment in the program" }
      - { name: booked_period_index, type: integer, source: system, description: "program.current_period_index at creation" }
      - { name: status, type: enum, source: system, description: "BOOKED | CANCELLED", constraints: "enum {BOOKED, CANCELLED}" }

  - name: CreditEntry
    parent: null
    common_fields: true
    fields:
      - { name: transaction_id, type: string, source: system, description: "FK -> SalesTransaction.id" }
      - { name: assignment_id, type: string, source: system, description: "FK -> PlanAssignment.id; the credited rep's assignment" }
      - { name: rep_id, type: string, source: system, description: "FK -> Rep.id; the credited rep" }
      - { name: parent_credit_id, type: string, source: system, default: null, description: "FK -> CreditEntry.id; set on ROLLUP entries pointing to the subordinate credit that spawned them" }
      - { name: credit_type, type: enum, source: system, description: "DIRECT (from transaction splits) | ROLLUP (manager override, one level)", constraints: "enum {DIRECT, ROLLUP}" }
      - { name: credit_amount_cents, type: integer, source: computed, description: "Allocated amount: split rounding for DIRECT (see split_credit_allocation); round_half_up(parent * rollup_rate_bps/10000) for ROLLUP" }
      - { name: posted_period_index, type: integer, source: system, default: null, description: "Period in which the entry transitioned to POSTED; null while PENDING" }
      - { name: status, type: enum, source: system, description: "PENDING | POSTED | LOCKED | REVERSED", constraints: "enum {PENDING, POSTED, LOCKED, REVERSED}" }

  - name: Adjustment
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> PlanAssignment.id" }
      - { name: dispute_id, type: string, source: system, default: null, description: "FK -> Dispute.id; set when source == DISPUTE" }
      - { name: amount_cents, type: integer, source: input, description: "Signed adjustment amount; nonzero; negative for clawbacks", constraints: "!= 0" }
      - { name: source, type: enum, source: system, description: "MANUAL (analyst-created, PENDING_APPROVAL) | DISPUTE (auto-APPROVED on dispute approval) | CLAWBACK (auto-APPROVED on locked-credit reversal)", constraints: "enum {MANUAL, DISPUTE, CLAWBACK}" }
      - { name: reason, type: string, source: input, description: "Free-text reason (manual) or system note" }
      - { name: period_index, type: integer, source: system, description: "program.current_period_index at creation; the open period this adjustment settles into" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; approval requires a different user (segregation of duties)" }
      - { name: status, type: enum, source: system, description: "PENDING_APPROVAL | APPROVED | REJECTED", constraints: "enum {PENDING_APPROVAL, APPROVED, REJECTED}" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> PlanAssignment.id; Rep callers must own the assignment" }
      - { name: credit_entry_id, type: string, source: input, default: null, description: "FK -> CreditEntry.id; optional; must belong to the disputed assignment" }
      - { name: period_index, type: integer, source: input, description: "Target period; must satisfy current_period_index - 2 <= period_index <= current_period_index", constraints: "within [current-2, current]" }
      - { name: reason, type: enum, source: input, description: "CREDIT_MISSING | CREDIT_AMOUNT | QUOTA_ERROR | CURVE_MISAPPLIED | DRAW_ERROR | OTHER", constraints: "enum {CREDIT_MISSING, CREDIT_AMOUNT, QUOTA_ERROR, CURVE_MISAPPLIED, DRAW_ERROR, OTHER}" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Requested correction; must be > 0 and <= credited amount for that period (sum of POSTED/LOCKED credits of the assignment with posted_period_index == period_index)", constraints: "0 < requested <= credited_for_period" }
      - { name: approved_amount_cents, type: integer, source: system, default: null, description: "Set at approval; must be > 0 and <= requested_amount_cents" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | WITHDRAWN", constraints: "enum {SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED, WITHDRAWN}" }

  - name: PayoutStatement
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> PlanAssignment.id" }
      - { name: period_index, type: integer, source: system, description: "Settled (closed) period; unique per assignment", constraints: "unique per (assignment_id, period_index)" }
      - { name: earned_credits_cents, type: integer, source: computed, description: "assignment.current_period_earned_cents captured at close (mode-filtered per plan.attainment_mode)" }
      - { name: adjustments_cents, type: integer, source: computed, description: "Sum of APPROVED Adjustment.amount_cents with period_index == closing period for this assignment" }
      - { name: earned_total_cents, type: integer, source: computed, description: "earned_credits_cents + adjustments_cents" }
      - { name: attainment_bps, type: integer, source: computed, description: "floor(earned_total_cents * 10000 / quota_cents) when earned_total > 0 else 0" }
      - { name: gross_payout_cents, type: integer, source: computed, description: "quota_to_payout_curve over earned_total_cents with plan cap applied; 0 when earned_total <= 0" }
      - { name: payout_cap_applied, type: boolean, source: computed, description: "true when the uncapped curve result exceeded plan.payout_cap_cents" }
      - { name: draw_paid_cents, type: integer, source: computed, description: "assignment.draw_amount_cents_per_period (assignment ACTIVE at close)" }
      - { name: draw_recovered_cents, type: integer, source: computed, description: "min(gross_payout_cents, draw_outstanding_cents after this period's accrual)" }
      - { name: guarantee_trueup_cents, type: integer, source: computed, description: "max(0, guarantee_amount_cents_per_period - (gross - draw_recovered))" }
      - { name: deficit_cents, type: integer, source: computed, description: "max(0, -earned_total_cents); added to draw_outstanding when draw_recoverable else added to draw_forgiven" }
      - { name: net_payable_cents, type: integer, source: computed, description: "gross_payout_cents - draw_recovered_cents + guarantee_trueup_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | EXPORTED", constraints: "enum {DRAFT, APPROVED, EXPORTED}" }

  - name: PayrollExport
    parent: null
    common_fields: false
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> CompProgram.id" }
      - { name: period_index, type: integer, source: input, description: "Closed period to export; must be < current_period_index and not previously exported", constraints: "< current_period_index; unique per (program_id, period_index)" }
      - { name: statement_ids, type: array, source: system, description: "Ids of PayoutStatements transitioned APPROVED -> EXPORTED by this export" }
      - { name: statement_count, type: integer, source: computed, description: "len(statement_ids)" }
      - { name: total_cents, type: integer, source: computed, description: "Sum of net_payable_cents of exported statements; deducted from program.accrued_balance_cents" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CompPlan
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /plans/{planId}/publish"
        actor: CompAdmin
        preconditions:
          - "X-User-ID != plan.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "curve_tiers valid (non-empty, first floor 0, strictly ascending, rates >= 0) — re-checked (ERR_CURVE_TIERS_INVALID)"
        side_effects:
          - "status -> PUBLISHED; increments CompPlan.version by 1"
      - from: PUBLISHED
        to: PUBLISHED
        trigger: "POST /plans/{planId}/revise"
        actor: CompAdmin
        preconditions:
          - "expected_plan_version == plan.version (ERR_STALE_PLAN_VERSION)"
          - "X-User-ID != plan.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "if curve_tiers supplied: validity re-checked (ERR_CURVE_TIERS_INVALID)"
        side_effects:
          - "document_version += 1; increments CompPlan.version by 1"
          - "CASCADE link 1: every ACTIVE PlanAssignment of this plan has acceptance_status -> OFFERED (from ACCEPTED or DECLINED); accepted_document_version unchanged (historical)"
          - "New credits for reverted assignments will park PENDING until re-acceptance (existing POSTED/LOCKED credits unaffected)"
      - from: DRAFT
        to: ARCHIVED
        trigger: "POST /plans/{planId}/archive"
        actor: CompAdmin
        preconditions:
          - "No PlanAssignment of this plan with status == ACTIVE (ERR_PLAN_HAS_ACTIVE_ASSIGNMENTS)"
        side_effects: ["status -> ARCHIVED; increments CompPlan.version by 1"]
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /plans/{planId}/archive"
        actor: CompAdmin
        preconditions:
          - "No PlanAssignment of this plan with status == ACTIVE (ERR_PLAN_HAS_ACTIVE_ASSIGNMENTS)"
        side_effects: ["status -> ARCHIVED; increments CompPlan.version by 1"]

  - entity: PlanAssignment
    initial_state: "status=ACTIVE, acceptance_status=OFFERED (parallel dimensions)"
    terminal_states: ["status=TERMINATED (both dimensions freeze)"]
    transitions:
      - from: "status=ACTIVE, acceptance_status=OFFERED"
        to: "status=ACTIVE, acceptance_status=ACCEPTED"
        trigger: "POST /assignments/{assignmentId}/accept"
        actor: Rep
        preconditions:
          - "Caller Rep owns assignment: assignment.rep_id == X-User-ID (else ERR_NOT_FOUND)"
          - "Plan of this assignment is PUBLISHED (ERR_PLAN_NOT_PUBLISHED)"
        side_effects:
          - "acceptance_status -> ACCEPTED; accepted_document_version = plan.document_version"
          - "CASCADE: every PENDING CreditEntry of this assignment -> POSTED with posted_period_index = program.current_period_index; each posting runs the standard POSTED side effects (earned increment + rollup spawn)"
      - from: "status=ACTIVE, acceptance_status=DECLINED"
        to: "status=ACTIVE, acceptance_status=ACCEPTED"
        trigger: "POST /assignments/{assignmentId}/accept"
        actor: Rep
        preconditions:
          - "Caller Rep owns assignment (else ERR_NOT_FOUND)"
          - "Plan is PUBLISHED (ERR_PLAN_NOT_PUBLISHED)"
        side_effects:
          - "acceptance_status -> ACCEPTED; accepted_document_version = plan.document_version"
          - "CASCADE: PENDING CreditEntries -> POSTED as above"
      - from: "status=ACTIVE, acceptance_status=OFFERED"
        to: "status=ACTIVE, acceptance_status=DECLINED"
        trigger: "POST /assignments/{assignmentId}/decline"
        actor: Rep
        preconditions:
          - "Caller Rep owns assignment (else ERR_NOT_FOUND)"
        side_effects: ["acceptance_status -> DECLINED"]
      - from: "status=ACTIVE, acceptance_status=ACCEPTED"
        to: "status=ACTIVE, acceptance_status=OFFERED"
        trigger: "system (cascade from POST /plans/{planId}/revise — new document version re-offers)"
        actor: system
        preconditions: []
        side_effects: ["acceptance_status -> OFFERED; accepted_document_version retained as history"]
      - from: "status=ACTIVE, acceptance_status=DECLINED"
        to: "status=ACTIVE, acceptance_status=OFFERED"
        trigger: "system (cascade from POST /plans/{planId}/revise)"
        actor: system
        preconditions: []
        side_effects: ["acceptance_status -> OFFERED"]
      - from: "status=ACTIVE, any acceptance_status"
        to: "status=TERMINATED (acceptance dimension frozen)"
        trigger: "POST /assignments/{assignmentId}/terminate"
        actor: CompAdmin
        preconditions: []
        side_effects:
          - "PENDING CreditEntries of this assignment -> REVERSED"
          - "POSTED CreditEntries with posted_period_index == program.current_period_index -> REVERSED and current_period_earned_cents decremented per entry (compensation)"
          - "If draw_recoverable: draw_forgiven_cents += draw_outstanding_cents; draw_outstanding_cents = 0"
          - "increments PlanAssignment.version by 1"

  - entity: SalesTransaction
    initial_state: BOOKED
    terminal_states: [CANCELLED]
    transitions:
      - from: "(create)"
        to: BOOKED
        trigger: "POST /transactions"
        actor: CompAnalyst
        preconditions:
          - "sum(splits.split_bps) == 10000 exactly (ERR_SPLIT_TOTAL_INVALID)"
          - "Every split rep has a PlanAssignment with status == ACTIVE in this program (ERR_SPLIT_REP_INELIGIBLE)"
          - "external_ref unique per program (ERR_DUPLICATE_TRANSACTION_REF)"
        side_effects:
          - "CASCADE link 1: one DIRECT CreditEntry per split via split_credit_allocation; status POSTED (assignment ACTIVE + ACCEPTED + plan PUBLISHED) else PENDING; posted entries get posted_period_index = program.current_period_index"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /transactions/{transactionId}/cancel"
        actor: CompAnalyst
        preconditions:
          - "status == BOOKED (ERR_TRANSACTION_ALREADY_CANCELLED)"
        side_effects:
          - "CASCADE link 1: every CreditEntry of this transaction in {PENDING, POSTED, LOCKED} -> REVERSED (includes ROLLUP children)"
          - "CASCADE link 2a: reversing a POSTED entry with posted_period_index == current open period decrements its assignment.current_period_earned_cents by credit_amount_cents"
          - "CASCADE link 2b: reversing a LOCKED entry creates a CLAWBACK Adjustment (amount_cents = -credit_amount_cents, status APPROVED, period_index = current open period) on that entry's assignment"

  - entity: CreditEntry
    initial_state: "PENDING or POSTED (see SalesTransaction create)"
    terminal_states: [LOCKED, REVERSED]
    transitions:
      - from: PENDING
        to: POSTED
        trigger: "system (cascade from POST /assignments/{assignmentId}/accept)"
        actor: system
        preconditions:
          - "Assignment ACTIVE + acceptance_status == ACCEPTED + plan PUBLISHED"
        side_effects:
          - "posted_period_index = program.current_period_index"
          - "CASCADE link 2: assignment.current_period_earned_cents += credit_amount_cents (raw, both credit types)"
          - "CASCADE link 3 (only for DIRECT entries): if credited rep.manager_id is set AND the manager has a PlanAssignment with status ACTIVE on the SAME plan, spawn a ROLLUP CreditEntry (parent_credit_id = this entry; amount via rollup_credit_amount); the rollup lands POSTED when the manager's assignment is ACCEPTED, else PENDING (it posts later via that assignment's accept cascade); a POSTED rollup runs these same posting side effects for the manager's assignment"
          - "Recompute assignment.current_attainment_bps and provisional_period_payout_cents"
      - from: POSTED
        to: LOCKED
        trigger: "system (POST /programs/{programId}/close-period sweeps entries with posted_period_index == closing period)"
        actor: system
        preconditions: []
        side_effects: ["status -> LOCKED"]
      - from: PENDING
        to: REVERSED
        trigger: "system (transaction cancel or assignment terminate)"
        actor: system
        preconditions: []
        side_effects: ["status -> REVERSED; no earned impact (never posted)"]
      - from: POSTED
        to: REVERSED
        trigger: "system (transaction cancel or assignment terminate)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> REVERSED"
          - "If posted_period_index == current open period: assignment.current_period_earned_cents -= credit_amount_cents (earlier-period POSTED entries cannot exist — close locks them)"
          - "ROLLUP children (parent_credit_id == this entry) in {PENDING, POSTED} -> REVERSED with the same rules"
      - from: LOCKED
        to: REVERSED
        trigger: "system (transaction cancel only — locked entries survive assignment terminate)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> REVERSED"
          - "Create CLAWBACK Adjustment on the entry's assignment: amount_cents = -credit_amount_cents, source CLAWBACK, status APPROVED, period_index = current open period"

  - entity: Adjustment
    initial_state: "PENDING_APPROVAL (MANUAL) | APPROVED (DISPUTE, CLAWBACK)"
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /adjustments/{adjustmentId}/approve"
        actor: CompManager
        preconditions:
          - "X-User-ID != adjustment.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["status -> APPROVED; enters the assignment's next period-close settlement via adjustments_cents"]
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /adjustments/{adjustmentId}/reject"
        actor: CompManager
        preconditions: []
        side_effects: ["status -> REJECTED; never settles"]

  - entity: Dispute
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: "(create)"
        to: SUBMITTED
        trigger: "POST /disputes"
        actor: Rep
        preconditions:
          - "Caller owns assignment (else ERR_NOT_FOUND)"
          - "Window: current_period_index - 2 <= period_index <= current_period_index (ERR_DISPUTE_WINDOW_CLOSED)"
          - "No other dispute of same (assignment_id, period_index) in {SUBMITTED, UNDER_REVIEW} (ERR_DISPUTE_ALREADY_ACTIVE)"
          - "credit_entry_id, if given, belongs to this assignment (ERR_DISPUTE_CREDIT_ENTRY_MISMATCH)"
          - "0 < requested_amount_cents <= credited_for_period (ERR_DISPUTE_AMOUNT_EXCEEDS_CREDIT)"
        side_effects: []
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /disputes/{disputeId}/start-review"
        actor: CompManager
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /disputes/{disputeId}/approve"
        actor: CompManager
        preconditions:
          - "0 < approved_amount_cents <= requested_amount_cents (ERR_DISPUTE_AMOUNT_EXCEEDS_CREDIT)"
        side_effects:
          - "approved_amount_cents set; status -> APPROVED"
          - "Create Adjustment: source DISPUTE, amount_cents = approved_amount_cents, status APPROVED, period_index = current open period, dispute_id = this dispute"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /disputes/{disputeId}/reject"
        actor: CompManager
        preconditions: []
        side_effects: ["status -> REJECTED; no adjustment"]
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /disputes/{disputeId}/reject"
        actor: CompManager
        preconditions: []
        side_effects: ["status -> REJECTED; no adjustment"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /disputes/{disputeId}/withdraw"
        actor: Rep
        preconditions: ["Caller owns the dispute's assignment (else ERR_NOT_FOUND)"]
        side_effects: ["status -> WITHDRAWN; no adjustment"]
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /disputes/{disputeId}/withdraw"
        actor: Rep
        preconditions: ["Caller owns the dispute's assignment (else ERR_NOT_FOUND)"]
        side_effects: ["status -> WITHDRAWN; no adjustment"]

  - entity: PayoutStatement
    initial_state: DRAFT
    terminal_states: [EXPORTED]
    transitions:
      - from: "(create)"
        to: DRAFT
        trigger: "system (POST /programs/{programId}/close-period generates one DRAFT statement per ACTIVE assignment)"
        actor: system
        preconditions: []
        side_effects: ["All computed money fields populated via period_settlement"]
      - from: DRAFT
        to: APPROVED
        trigger: "POST /statements/{statementId}/approve"
        actor: CompManager
        preconditions: []
        side_effects: ["status -> APPROVED"]
      - from: APPROVED
        to: EXPORTED
        trigger: "system (POST /payroll-exports for the statement's program+period)"
        actor: system
        preconditions:
          - "Every statement of the (program, period) is APPROVED (ERR_STATEMENTS_NOT_APPROVED)"
        side_effects:
          - "status -> EXPORTED; id appended to PayrollExport.statement_ids"
          - "program.accrued_balance_cents -= net_payable_cents"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: plan-revise-stale-version
    parent_entity: CompPlan
    write_endpoint: "POST /plans/{planId}/revise"
    occ_field: expected_plan_version
    description: |
      Revising a plan document supersedes the currently accepted document for
      every assignment. A revise request carrying an expected_plan_version that
      no longer matches the plan's current version is rejected, because another
      revision (or publish) has already advanced the document lineage the
      caller based their edits on. The OCC check is evaluated only after the
      state precondition (plan must be PUBLISHED) passes — a revise on an
      ARCHIVED plan fails with ERR_INVALID_STATE_TRANSITION regardless of the
      version carried.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
  - rule_id: program-close-stale-version
    parent_entity: CompProgram
    write_endpoint: "POST /programs/{programId}/close-period"
    occ_field: expected_program_version
    description: |
      Closing a period advances the program epoch and snapshots all assignments.
      A close request whose expected_program_version no longer matches the
      program's current version is rejected, because a period boundary the
      caller did not observe has already been crossed. The OCC check is
      evaluated only after business guards (e.g., ERR_OPEN_DISPUTES_EXIST) pass.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: split_credit_allocation
    trigger: "POST /transactions (per split, at CreditEntry creation)"
    algorithm: weighted_scoring
    formula: |
      For each split i (in request array order):
        raw_i = amount_cents * split_bps_i / 10000
        credit_i = round_half_up(raw_i)            # per-split rounding FIRST
      remainder = amount_cents - sum(credit_i)      # may be positive or negative
      if remainder != 0:
        target = split with the largest split_bps; tie -> lowest array index
        credit_target += remainder                   # remainder added (or subtracted) to that one split
      INVARIANT: sum(DIRECT credits of a transaction) == amount_cents exactly
    input_set: "the request's splits array, in array order"
    constants:
      TOTAL_BPS: 10000
    precision: "integer cents; round_half_up per split, THEN sum; remainder reconciled to one split"
    variants: []

  - name: rollup_credit_amount
    trigger: "a DIRECT CreditEntry transitions to POSTED (creation fast-path or acceptance cascade)"
    algorithm: aggregation
    formula: |
      if credited_rep.manager_id is null: no rollup
      manager_asg = the manager's PlanAssignment with status == ACTIVE
                    on the SAME plan as the credited rep's assignment
      if no such manager_asg: no rollup
      rollup_amount = round_half_up(credit_amount_cents * plan.rollup_rate_bps / 10000)
      create ROLLUP CreditEntry: rep = manager, assignment = manager_asg,
        parent_credit_id = source entry,
        status = POSTED (posted_period_index = current period) when manager_asg
                 is ACCEPTED, else PENDING (posted later by the manager's accept cascade)
      Hierarchy depth: exactly ONE level (the direct manager only).
    input_set: "the single POSTED DIRECT credit; plan.rollup_rate_bps; manager's assignment set"
    constants: {}
    precision: "integer cents, round_half_up"
    variants: []

  - name: attainment_calculation
    trigger: "recomputed on every credit/adjustment change (current_attainment_bps); frozen into PayoutStatement.attainment_bps at period close"
    algorithm: aggregation
    formula: |
      earned = input set per plan.attainment_mode (see variants)
      attainment_bps = floor(earned * 10000 / quota_cents)   # integer floor, never rounded up
      if earned <= 0: attainment_bps = 0
    input_set: "POSTED credits of the assignment in the open period (live) / statement earned_total_cents (at close)"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer bps, floor"
    variants:
      - name: direct_only
        when: "plan.attainment_mode == DIRECT_ONLY"
        difference: "input set includes ONLY CreditEntries with credit_type == DIRECT; ROLLUP entries excluded entirely"
      - name: include_rollup
        when: "plan.attainment_mode == INCLUDE_ROLLUP"
        difference: "input set includes BOTH DIRECT and ROLLUP entries; identical raw credits therefore yield strictly higher attainment whenever any rollup exists"

  - name: quota_to_payout_curve
    trigger: "period_settlement (final) and provisional_period_payout_cents (estimate)"
    algorithm: tiered_pricing
    formula: |
      # Marginal tiered curve over attainment-defined credit bands.
      # Tier i covers attainment in [floor_i, floor_{i+1}); top tier is open-ended.
      # Band i spans credit amounts [floor_i * quota / 10000, floor_{i+1} * quota / 10000).
      gross_uncapped = 0
      for each tier i in ascending floor order:
        lo_cents = floor_i * quota_cents / 10000          # exact when quota multiple of 10000; else floor
        hi_cents = floor_{i+1} * quota_cents / 10000      # +infinity for top tier
        band_credit = clamp(earned - lo_cents, 0, hi_cents - lo_cents)
        band_payout = round_half_up(band_credit * rate_i / 10000)   # per-band rounding FIRST
        gross_uncapped += band_payout                     # THEN sum (pinned order)
      if plan.payout_cap_cents is not null:
        payout_cap_applied = gross_uncapped > plan.payout_cap_cents
        gross = min(gross_uncapped, plan.payout_cap_cents)
      else:
        payout_cap_applied = false
        gross = gross_uncapped
    input_set: "earned (mode-filtered per attainment_calculation); plan.curve_tiers; plan.payout_cap_cents; assignment.quota_cents"
    constants: {}
    precision: "integer cents; round_half_up per band, then sum; cap via min() applied LAST"
    variants: []

  - name: payout_estimate
    trigger: "provisional: recomputed on every credit create/post/reverse for the assignment; final: period close (period_settlement)"
    algorithm: forward_looking
    formula: |
      provisional_period_payout_cents = quota_to_payout_curve(
          earned = mode-filtered current_period_earned_cents
                 + sum(mode-filtered PENDING credits of the assignment),
          cap = IGNORED,               # provisional never applies the plan cap
          draw/guarantee = IGNORED)    # provisional is a gross-curve estimate only
      final gross = quota_to_payout_curve(earned_total_cents, cap applied)
    input_set: "provisional: POSTED + PENDING credits of the open period; final: settled earned_total_cents only (PENDING excluded)"
    constants: {}
    precision: "integer cents, per quota_to_payout_curve"
    variants:
      - name: provisional
        when: "any read of PlanAssignment before period close"
        difference: "includes PENDING credits (assumes future acceptance), ignores payout cap, draws, guarantees — optimistic forward-looking estimate"
      - name: final
        when: "period close writes PayoutStatement"
        difference: "excludes PENDING credits, applies cap/draw/guarantee — identical underlying credits can therefore yield provisional != final"

  - name: period_settlement
    trigger: "POST /programs/{programId}/close-period, once per ACTIVE assignment"
    algorithm: constraint_propagation
    formula: |
      # PINNED evaluation order (each step consumes only outputs of earlier steps):
      e1 = assignment.current_period_earned_cents filtered by plan.attainment_mode
           (DIRECT_ONLY: subtract POSTED-then-reversed/current ROLLUP amounts from the raw counter)
      e2 = e1 + sum(APPROVED Adjustment.amount_cents where period_index == closing period)
      if e2 <= 0:
        attainment_bps = 0; gross = 0; payout_cap_applied = false
        deficit = -e2  (0 when e2 == 0)
      else:
        attainment_bps = floor(e2 * 10000 / quota_cents)
        (gross, payout_cap_applied) = quota_to_payout_curve(e2)   # cap applied here
        deficit = 0
      draw_paid = draw_amount_cents_per_period                     # assignment is ACTIVE at close
      if draw_recoverable: draw_outstanding += draw_paid
      draw_recovered = min(gross, draw_outstanding)                # recovery BEFORE guarantee
      draw_outstanding -= draw_recovered
      net_before_guarantee = gross - draw_recovered
      guarantee_trueup = max(0, guarantee_amount_cents_per_period - net_before_guarantee)
      net_payable = net_before_guarantee + guarantee_trueup
      if deficit > 0:
        if draw_recoverable: draw_outstanding += deficit
        else: draw_forgiven += deficit
      # ledger sync: lifetime_earned += e2; lifetime_paid += net_payable; current_period_earned reset to 0
    input_set: "assignments with status == ACTIVE at close; their open-period credits (mode-filtered) and APPROVED adjustments for the closing period"
    constants: {}
    precision: "integer cents throughout; floor only in attainment; round_half_up only inside curve bands"
    variants: []

  - name: draw_ledger
    trigger: "invariant maintained by period_settlement and assignment terminate"
    algorithm: aggregation
    formula: |
      INVARIANT at every observable instant:
        draw_outstanding_cents == sum(draw_paid_cents over closed statements, recoverable portion)
                                  - sum(draw_recovered_cents over closed statements)
                                  - draw_forgiven_cents
      Termination (draw_recoverable only): draw_forgiven += draw_outstanding; draw_outstanding = 0.
      Non-recoverable draws never enter the ledger (paid but not accrued).
    input_set: "all PayoutStatements of the assignment; termination event"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: plan_effectiveness
    trigger: "GET /plans/{planId}/effectiveness (computed on read)"
    algorithm: aggregation
    formula: |
      source = all PayoutStatements whose assignment.plan_id == this plan (any status DRAFT/APPROVED/EXPORTED, all closed periods)
      assignments_count = count of PlanAssignments of this plan (any status)
      statements_count = len(source)
      avg_attainment_bps = floor(sum(attainment_bps) / statements_count)   # 0 when no statements
      total_earned_cents = sum(earned_total_cents)
      total_payout_cents = sum(net_payable_cents)
      distribution (inclusive lower bound, exclusive upper):
        LT_8000      = count(attainment_bps < 8000)
        B8000_10000  = count(8000 <= attainment_bps < 10000)
        GTE_10000    = count(attainment_bps >= 10000)
      Sums/counts are order-insensitive; no tie-break needed.
    input_set: "PayoutStatements joined through PlanAssignment.plan_id"
    constants:
      BUCKET_MID_BPS: 8000
      BUCKET_HIGH_BPS: 10000
    precision: "integer; avg uses floor"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's role list"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path/body ids exist, validated left-to-right; Rep callers additionally only SEE resources linked to their own Rep id (assignments, credits, statements, disputes) — foreign resources behave as absent"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 4
    category: state
    check: "Target resource is in a valid from-state for the requested transition (incl. ERR_PLAN_NOT_PUBLISHED for assignment create/accept, ERR_TRANSACTION_ALREADY_CANCELLED, generic ERR_INVALID_STATE_TRANSITION elsewhere)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "Segregation of duties: plan publish/revise actor != plan.created_by_user_id; adjustment approve actor != adjustment.created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /plans/{id}/publish, POST /plans/{id}/revise, POST /adjustments/{id}/approve"
  - priority: 6
    category: business_temporal
    check: "Temporal windows: dispute period within [current-2, current] (ERR_DISPUTE_WINDOW_CLOSED); payroll export period < current_period_index (ERR_PAYROLL_PERIOD_NOT_CLOSED); date sanity start <= end (ERR_INVALID_REQUEST)"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /disputes, POST /payroll-exports, date-bearing creates"
  - priority: 7
    category: business_constraint
    check: "Structural constraints: split sum == 10000 (ERR_SPLIT_TOTAL_INVALID); curve tiers well-formed (ERR_CURVE_TIERS_INVALID); unique external_ref / employee_ref (ERR_DUPLICATE_TRANSACTION_REF / ERR_DUPLICATE_EMPLOYEE_REF); acyclic manager chain (ERR_REP_HIERARCHY_CYCLE); plan window closed-interval overlap (ERR_PLAN_WINDOW_OVERLAP); assignment half-open overlap per rep (ERR_ASSIGNMENT_WINDOW_OVERLAP); single active dispute per assignment+period (ERR_DISPUTE_ALREADY_ACTIVE); one payroll export per program+period (ERR_PAYROLL_EXPORT_EXISTS); no active assignments on archive (ERR_PLAN_HAS_ACTIVE_ASSIGNMENTS); close blocked by open disputes (ERR_OPEN_DISPUTES_EXIST); export blocked by unapproved statements (ERR_STATEMENTS_NOT_APPROVED)"
    error_id: ERR_SPLIT_TOTAL_INVALID
    http_status: 422
    applies_to: "creates and guarded actions"
  - priority: 8
    category: business_referential
    check: "Cross-references coherent: every split rep has an ACTIVE assignment in the program (ERR_SPLIT_REP_INELIGIBLE); manager in same program (ERR_MANAGER_PROGRAM_MISMATCH); dispute credit_entry belongs to the disputed assignment (ERR_DISPUTE_CREDIT_ENTRY_MISMATCH)"
    error_id: ERR_SPLIT_REP_INELIGIBLE
    http_status: 409
    applies_to: "POST /transactions, POST /reps, POST /disputes"
  - priority: 9
    category: business_fiscal
    check: "Money sanity: quota_cents > 0 (ERR_QUOTA_INVALID); adjustment amount nonzero (ERR_ADJUSTMENT_AMOUNT_INVALID); dispute requested/approved amounts within credited/requested bounds (ERR_DISPUTE_AMOUNT_EXCEEDS_CREDIT)"
    error_id: ERR_QUOTA_INVALID
    http_status: 400
    applies_to: "POST /assignments, POST /adjustments, POST /disputes, POST /disputes/{id}/approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- CompProgram ---
  - method: POST
    path: "/programs"
    description: "Create a compensation program (period counter starts at 1, accrual at 0)"
    roles: [CompAdmin]
    code: 201
    input: [name]
    output: CompProgram
    side_effects: ["current_period_index = 1, accrued_balance_cents = 0"]
  - method: GET
    path: "/programs/{programId}"
    description: "Get a program (period counter, accrual balance, version)"
    roles: [CompAdmin, CompAnalyst, CompManager, Rep]
    code: 200
    input: []
    output: CompProgram
    side_effects: []
  - method: POST
    path: "/programs/{programId}/close-period"
    description: "Settle the current period: generate DRAFT statements per ACTIVE assignment via period_settlement, LOCK posted credits of the closing period, advance current_period_index by 1, accrue sum(net_payable). Blocked by non-terminal disputes. OCC-guarded."
    roles: [CompAdmin]
    code: 200
    input: [expected_program_version]
    output: CompProgram
    side_effects:
      - "increments CompProgram.version by 1"
      - "statements created (DRAFT); credits POSTED -> LOCKED; current_period_earned_cents reset to 0 per assignment"
      - "current_period_index += 1; accrued_balance_cents += sum(net_payable_cents)"
      - "ERR_OPEN_DISPUTES_EXIST if any dispute of the program is SUBMITTED or UNDER_REVIEW"
  - method: GET
    path: "/programs/{id}/payroll-exports"
    description: "List payroll exports of a program"
    roles: [CompAdmin, CompAnalyst, CompManager, Rep]
    code: 200
    input: []
    output: "PayrollExport[]"
    side_effects: []

  # --- CompPlan ---
  - method: POST
    path: "/plans"
    description: "Create a plan in DRAFT with curve tiers and document_version 1"
    roles: [CompAdmin]
    code: 201
    input: [program_id, name, effective_start_date, effective_end_date, curve_tiers, "attainment_mode?", "rollup_rate_bps?", "payout_cap_cents?"]
    output: CompPlan
    side_effects: ["status=DRAFT, document_version=1, created_by_user_id = X-User-ID; ERR_PLAN_WINDOW_OVERLAP on closed-interval collision with non-ARCHIVED plans of the program"]
  - method: GET
    path: "/plans/{planId}"
    description: "Get a plan"
    roles: [CompAdmin, CompAnalyst, CompManager, Rep]
    code: 200
    input: []
    output: CompPlan
    side_effects: []
  - method: GET
    path: "/plans"
    description: "List plans"
    roles: [CompAdmin, CompAnalyst, CompManager, Rep]
    code: 200
    input: ["program_id?", "status?"]
    output: "CompPlan[]"
    side_effects: []
  - method: POST
    path: "/plans/{planId}/publish"
    description: "Publish a DRAFT plan (segregation of duties: publisher != creator)"
    roles: [CompAdmin]
    code: 200
    input: []
    output: CompPlan
    side_effects: ["status DRAFT -> PUBLISHED; increments CompPlan.version by 1"]
  - method: POST
    path: "/plans/{planId}/revise"
    description: "Issue a new plan document version (OCC); cascades ACCEPTED/DECLINED assignments back to OFFERED"
    roles: [CompAdmin]
    code: 200
    input: [expected_plan_version, "curve_tiers?", "payout_cap_cents?", "rollup_rate_bps?", "attainment_mode?"]
    output: CompPlan
    side_effects: ["document_version += 1; increments CompPlan.version by 1; assignments of this plan with status ACTIVE revert acceptance_status to OFFERED"]
  - method: POST
    path: "/plans/{planId}/archive"
    description: "Archive a plan with no ACTIVE assignments"
    roles: [CompAdmin]
    code: 200
    input: []
    output: CompPlan
    side_effects: ["status -> ARCHIVED; increments CompPlan.version by 1"]
  - method: GET
    path: "/plans/{planId}/effectiveness"
    description: "Plan effectiveness analytics (plan_effectiveness calculation)"
    roles: [CompAdmin, CompAnalyst, CompManager, Rep]
    code: 200
    input: []
    output: { plan_id: string, assignments_count: integer, statements_count: integer, avg_attainment_bps: integer, total_earned_cents: integer, total_payout_cents: integer, distribution: object }
    side_effects: []

  # --- Rep ---
  - method: POST
    path: "/reps"
    description: "Create a rep; manager must be same-program and the manager chain acyclic"
    roles: [CompAdmin]
    code: 201
    input: [program_id, name, employee_ref, "manager_id?"]
    output: Rep
    side_effects: ["ERR_DUPLICATE_EMPLOYEE_REF per program; ERR_REP_HIERARCHY_CYCLE; ERR_MANAGER_PROGRAM_MISMATCH"]
  - method: GET
    path: "/reps/{repId}"
    description: "Get a rep"
    roles: [CompAdmin, CompAnalyst, CompManager, Rep]
    code: 200
    input: []
    output: Rep
    side_effects: []
  - method: PUT
    path: "/reps/{repId}"
    description: "Update a rep's name or manager; manager changes re-run the same-program and acyclicity checks"
    roles: [CompAdmin]
    code: 200
    input: ["name?", "manager_id?"]
    output: Rep
    side_effects: ["increments Rep.version by 1; ERR_REP_HIERARCHY_CYCLE on cycle; ERR_MANAGER_PROGRAM_MISMATCH across programs"]
  - method: GET
    path: "/reps"
    description: "List reps (program and manager filters)"
    roles: [CompAdmin, CompAnalyst, CompManager, Rep]
    code: 200
    input: ["program_id?", "manager_id?"]
    output: "Rep[]"
    side_effects: []

  # --- PlanAssignment ---
  - method: POST
    path: "/assignments"
    description: "Assign a rep to a plan with quota/draw/guarantee; plan must be PUBLISHED; per-rep half-open window overlap rejected"
    roles: [CompAdmin]
    code: 201
    input: [program_id, rep_id, plan_id, quota_cents, "draw_amount_cents_per_period?", "draw_recoverable?", "guarantee_amount_cents_per_period?", effective_start_date, "effective_end_date?"]
    output: PlanAssignment
    side_effects: ["status=ACTIVE, acceptance_status=OFFERED; ERR_PLAN_NOT_PUBLISHED; ERR_ASSIGNMENT_WINDOW_OVERLAP; ERR_QUOTA_INVALID"]
  - method: GET
    path: "/assignments/{assignmentId}"
    description: "Get an assignment (Rep callers: own assignments only, else 404)"
    roles: [CompAdmin, CompAnalyst, CompManager, Rep]
    code: 200
    input: []
    output: PlanAssignment
    side_effects: []
  - method: GET
    path: "/assignments"
    description: "List assignments"
    roles: [CompAdmin, CompAnalyst, CompManager, Rep]
    code: 200
    input: ["program_id?", "rep_id?", "plan_id?", "status?", "acceptance_status?"]
    output: "PlanAssignment[]"
    side_effects: []
  - method: POST
    path: "/assignments/{assignmentId}/accept"
    description: "Owning rep accepts the current plan document; posts held PENDING credits"
    roles: [Rep]
    code: 200
    input: []
    output: PlanAssignment
    side_effects: ["acceptance_status -> ACCEPTED; accepted_document_version = plan.document_version; PENDING credits -> POSTED (with posting side effects incl. rollup spawn)"]
  - method: POST
    path: "/assignments/{assignmentId}/decline"
    description: "Owning rep declines the offered plan document"
    roles: [Rep]
    code: 200
    input: []
    output: PlanAssignment
    side_effects: ["acceptance_status OFFERED -> DECLINED"]
  - method: POST
    path: "/assignments/{assignmentId}/terminate"
    description: "Terminate an assignment; reverses unposted/current-period credits and forgives recoverable draw debt"
    roles: [CompAdmin]
    code: 200
    input: []
    output: PlanAssignment
    side_effects: ["status ACTIVE -> TERMINATED; PENDING and current-period POSTED credits -> REVERSED with earned compensation; draw_forgiven += draw_outstanding; draw_outstanding = 0"]

  # --- SalesTransaction ---
  - method: POST
    path: "/transactions"
    description: "Book a sales transaction; allocates DIRECT credits per split rounding; eligible credits post immediately (spawning rollups), others park PENDING"
    roles: [CompAnalyst]
    code: 201
    input: [program_id, external_ref, amount_cents, transaction_date, splits]
    output: SalesTransaction
    side_effects: ["status=BOOKED; DIRECT CreditEntries created (split_credit_allocation); POSTED entries trigger rollup_credit_amount cascade"]
  - method: GET
    path: "/transactions/{transactionId}"
    description: "Get a transaction"
    roles: [CompAdmin, CompAnalyst, CompManager, Rep]
    code: 200
    input: []
    output: SalesTransaction
    side_effects: []
  - method: GET
    path: "/transactions"
    description: "List transactions"
    roles: [CompAdmin, CompAnalyst, CompManager, Rep]
    code: 200
    input: ["program_id?", "status?"]
    output: "SalesTransaction[]"
    side_effects: []
  - method: POST
    path: "/transactions/{transactionId}/cancel"
    description: "Cancel a booked transaction; reverses all credits; locked credits spawn CLAWBACK adjustments into the open period"
    roles: [CompAnalyst]
    code: 200
    input: []
    output: SalesTransaction
    side_effects: ["status -> CANCELLED; credits -> REVERSED; same-period earned compensation; CLAWBACK adjustments for LOCKED credits"]

  # --- CreditEntry ---
  - method: GET
    path: "/credit-entries/{creditEntryId}"
    description: "Get a credit entry (Rep callers: own credits only)"
    roles: [CompAdmin, CompAnalyst, CompManager, Rep]
    code: 200
    input: []
    output: CreditEntry
    side_effects: []
  - method: GET
    path: "/credit-entries"
    description: "List credit entries with filters"
    roles: [CompAdmin, CompAnalyst, CompManager, Rep]
    code: 200
    input: ["transaction_id?", "assignment_id?", "rep_id?", "parent_credit_id?", "status?"]
    output: "CreditEntry[]"
    side_effects: []

  # --- Adjustment ---
  - method: POST
    path: "/adjustments"
    description: "Create a MANUAL adjustment (PENDING_APPROVAL) against the open period"
    roles: [CompAnalyst]
    code: 201
    input: [assignment_id, amount_cents, reason]
    output: Adjustment
    side_effects: ["status=PENDING_APPROVAL; source=MANUAL; period_index = current open period; created_by_user_id = X-User-ID"]
  - method: GET
    path: "/adjustments/{adjustmentId}"
    description: "Get an adjustment"
    roles: [CompAdmin, CompAnalyst, CompManager, Rep]
    code: 200
    input: []
    output: Adjustment
    side_effects: []
  - method: GET
    path: "/adjustments"
    description: "List adjustments with filters"
    roles: [CompAdmin, CompAnalyst, CompManager, Rep]
    code: 200
    input: ["assignment_id?", "dispute_id?", "period_index?", "status?"]
    output: "Adjustment[]"
    side_effects: []
  - method: POST
    path: "/adjustments/{adjustmentId}/approve"
    description: "Approve a PENDING_APPROVAL manual adjustment (approver != creator)"
    roles: [CompManager]
    code: 200
    input: []
    output: Adjustment
    side_effects: ["status -> APPROVED; ERR_SEGREGATION_OF_DUTIES when approver == creator"]
  - method: POST
    path: "/adjustments/{adjustmentId}/reject"
    description: "Reject a PENDING_APPROVAL manual adjustment"
    roles: [CompManager]
    code: 200
    input: []
    output: Adjustment
    side_effects: ["status -> REJECTED"]

  # --- Dispute ---
  - method: POST
    path: "/disputes"
    description: "Owning rep files a dispute for a period within the filing window"
    roles: [Rep]
    code: 201
    input: [assignment_id, period_index, "credit_entry_id?", reason, requested_amount_cents]
    output: Dispute
    side_effects: ["status=SUBMITTED"]
  - method: GET
    path: "/disputes/{disputeId}"
    description: "Get a dispute (Rep callers: own disputes only)"
    roles: [CompAdmin, CompAnalyst, CompManager, Rep]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: GET
    path: "/disputes"
    description: "List disputes with filters"
    roles: [CompAdmin, CompAnalyst, CompManager, Rep]
    code: 200
    input: ["assignment_id?", "credit_entry_id?", "status?"]
    output: "Dispute[]"
    side_effects: []
  - method: POST
    path: "/disputes/{disputeId}/start-review"
    description: "Move a submitted dispute into review"
    roles: [CompManager]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status SUBMITTED -> UNDER_REVIEW"]
  - method: POST
    path: "/disputes/{disputeId}/approve"
    description: "Approve a dispute under review with an approved amount; spawns an APPROVED DISPUTE adjustment"
    roles: [CompManager]
    code: 200
    input: [approved_amount_cents]
    output: Dispute
    side_effects: ["status -> APPROVED; create Adjustment(source=DISPUTE, amount=approved_amount_cents, status=APPROVED)"]
  - method: POST
    path: "/disputes/{disputeId}/reject"
    description: "Reject a dispute (from SUBMITTED or UNDER_REVIEW); no adjustment"
    roles: [CompManager]
    code: 200
    input: ["note?"]
    output: Dispute
    side_effects: ["status -> REJECTED"]
  - method: POST
    path: "/disputes/{disputeId}/withdraw"
    description: "Owning rep withdraws a dispute (from SUBMITTED or UNDER_REVIEW); no adjustment"
    roles: [Rep]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> WITHDRAWN"]

  # --- PayoutStatement ---
  - method: GET
    path: "/statements/{statementId}"
    description: "Get a payout statement (Rep callers: own statements only)"
    roles: [CompAdmin, CompAnalyst, CompManager, Rep]
    code: 200
    input: []
    output: PayoutStatement
    side_effects: []
  - method: GET
    path: "/statements"
    description: "List payout statements with filters"
    roles: [CompAdmin, CompAnalyst, CompManager, Rep]
    code: 200
    input: ["assignment_id?", "period_index?", "status?"]
    output: "PayoutStatement[]"
    side_effects: []
  - method: POST
    path: "/statements/{statementId}/approve"
    description: "Approve a DRAFT statement (prerequisite for payroll export)"
    roles: [CompManager]
    code: 200
    input: []
    output: PayoutStatement
    side_effects: ["status DRAFT -> APPROVED"]

  # --- PayrollExport ---
  - method: POST
    path: "/payroll-exports"
    description: "Export all APPROVED statements of a closed (program, period) to payroll; one export per program+period; relieves accrual"
    roles: [CompAdmin]
    code: 201
    input: [program_id, period_index]
    output: PayrollExport
    side_effects: ["statements APPROVED -> EXPORTED; total_cents = sum(net_payable); program.accrued_balance_cents -= total_cents"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/malformed or role undeclared" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not in the endpoint's role list" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Resource id does not exist; or Rep caller references a resource not linked to their own Rep id (ownership hiding)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum value, or end date before start date" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Action not allowed from the resource's current state (incl. acting on terminal states)" }
  - { id: ERR_STALE_PLAN_VERSION, http: 412, condition: "expected_plan_version != plan.version on revise" }
  - { id: ERR_STALE_PROGRAM_VERSION, http: 412, condition: "expected_program_version != program.version on close-period" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Plan publish/revise by plan creator, or adjustment approval by adjustment creator" }
  - { id: ERR_PLAN_NOT_PUBLISHED, http: 409, condition: "Assignment create/accept against a plan not in PUBLISHED status" }
  - { id: ERR_PLAN_WINDOW_OVERLAP, http: 409, condition: "Plan [start, end] CLOSED interval collides with another non-ARCHIVED plan of the program (shared boundary date counts as overlap)" }
  - { id: ERR_PLAN_HAS_ACTIVE_ASSIGNMENTS, http: 409, condition: "Archive attempted with ACTIVE assignments on the plan" }
  - { id: ERR_CURVE_TIERS_INVALID, http: 400, condition: "curve_tiers empty, first floor != 0, floors not strictly ascending, or negative rate" }
  - { id: ERR_DUPLICATE_EMPLOYEE_REF, http: 409, condition: "employee_ref already used by another rep of the program" }
  - { id: ERR_REP_HIERARCHY_CYCLE, http: 409, condition: "manager_id is the rep itself or a descendant of the rep" }
  - { id: ERR_MANAGER_PROGRAM_MISMATCH, http: 409, condition: "manager_id references a rep of a different program" }
  - { id: ERR_ASSIGNMENT_WINDOW_OVERLAP, http: 409, condition: "Rep already has a non-TERMINATED assignment whose half-open [start, end) window intersects (adjacency end == start is allowed; null end is open-ended)" }
  - { id: ERR_QUOTA_INVALID, http: 400, condition: "quota_cents <= 0" }
  - { id: ERR_SPLIT_TOTAL_INVALID, http: 422, condition: "sum(splits.split_bps) != 10000" }
  - { id: ERR_SPLIT_REP_INELIGIBLE, http: 409, condition: "A split rep has no ACTIVE assignment in the program" }
  - { id: ERR_DUPLICATE_TRANSACTION_REF, http: 409, condition: "external_ref already exists in the program, regardless of transaction status" }
  - { id: ERR_TRANSACTION_ALREADY_CANCELLED, http: 409, condition: "Cancel attempted on a CANCELLED transaction" }
  - { id: ERR_DISPUTE_ALREADY_ACTIVE, http: 409, condition: "A dispute in {SUBMITTED, UNDER_REVIEW} already exists for the same (assignment_id, period_index)" }
  - { id: ERR_DISPUTE_WINDOW_CLOSED, http: 409, condition: "period_index outside [current_period_index - 2, current_period_index]" }
  - { id: ERR_DISPUTE_AMOUNT_EXCEEDS_CREDIT, http: 409, condition: "requested_amount_cents > credited amount for the period; or approved_amount_cents > requested_amount_cents / <= 0" }
  - { id: ERR_DISPUTE_CREDIT_ENTRY_MISMATCH, http: 409, condition: "credit_entry_id belongs to a different assignment than the dispute" }
  - { id: ERR_ADJUSTMENT_AMOUNT_INVALID, http: 400, condition: "adjustment amount_cents == 0" }
  - { id: ERR_OPEN_DISPUTES_EXIST, http: 409, condition: "close-period attempted while any dispute of the program is SUBMITTED or UNDER_REVIEW" }
  - { id: ERR_STATEMENTS_NOT_APPROVED, http: 409, condition: "payroll export attempted while any statement of the (program, period) is still DRAFT" }
  - { id: ERR_PAYROLL_EXPORT_EXISTS, http: 409, condition: "an export already exists for this (program_id, period_index)" }
  - { id: ERR_PAYROLL_PERIOD_NOT_CLOSED, http: 409, condition: "export period_index >= program.current_period_index (period not closed yet)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CompAdmin
    description: "Sales compensation administrator: owns program, plans, reps, assignments; runs period close and payroll export; blocked by segregation-of-duties from publishing self-created plans"
    identity: opaque
    exclusive_operations:
      - "POST /programs — create program"
      - "POST /programs/{id}/close-period — settle period (ops-run checkpoint)"
      - "POST /plans, POST /plans/{id}/publish, POST /plans/{id}/revise, POST /plans/{id}/archive — plan lifecycle"
      - "POST /reps — create rep"
      - "PUT /reps/{id} — update name / manager (hierarchy maintenance)"
      - "POST /assignments, POST /assignments/{id}/terminate — assignment lifecycle"
      - "POST /payroll-exports — payout file to payroll"
    shared_operations:
      - "All GET list/detail endpoints"
  - name: CompAnalyst
    description: "Compensation operations analyst: books and cancels transactions, drafts manual adjustments"
    identity: opaque
    exclusive_operations:
      - "POST /transactions — book transaction with splits"
      - "POST /transactions/{id}/cancel — cancel transaction (clawback)"
      - "POST /adjustments — draft manual adjustment"
    shared_operations:
      - "All GET list/detail endpoints"
  - name: CompManager
    description: "Compensation manager: reviews disputes, approves adjustments and statements; cannot approve own adjustments"
    identity: opaque
    exclusive_operations:
      - "POST /disputes/{id}/start-review, /approve, /reject — dispute resolution"
      - "POST /adjustments/{id}/approve, /reject — adjustment adjudication"
      - "POST /statements/{id}/approve — statement approval"
    shared_operations:
      - "All GET list/detail endpoints"
  - name: Rep
    description: "Sales representative: accepts/declines own plan documents, files/withdraws own disputes, reads own assignments/credits/statements"
    identity: "entity_backed:Rep"
    exclusive_operations:
      - "POST /assignments/{id}/accept, /decline — plan document acceptance (own assignments only)"
      - "POST /disputes — file dispute (own assignments only)"
      - "POST /disputes/{id}/withdraw — withdraw own dispute"
    shared_operations:
      - "All GET list/detail endpoints (own-linked resources only; foreign ids behave as absent)"
