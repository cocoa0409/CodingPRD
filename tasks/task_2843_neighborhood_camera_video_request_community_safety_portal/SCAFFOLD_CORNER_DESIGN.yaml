      - name: share_and_decline_gates_each_return_their_own_error
        claim_type: error_triggerability
        grounds:
          - errors.ERR_CLIP_OUTSIDE_REQUEST_WINDOW
          - errors.ERR_SOLICITATION_DEADLINE_PASSED
          - errors.ERR_REQUEST_NOT_SOLICITING
          - validations[priority=15]
          - validations[priority=35]
          - validations[priority=36]
        distinguishing_aspect: "The consent endpoints have three distinct temporal gates and the priority order between them is visible: footage outside the justified window is 422, an answer after the 72-hour deadline is 409 ERR_SOLICITATION_DEADLINE_PASSED, and once the officer withdraws the request the deadline error is superseded by 409 ERR_REQUEST_NOT_SOLICITING at priority 15."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; agency ONBOARDED with min_device_threshold 3; officer O1 REQUESTER; three cameras at (0,10), (0,20), (0,30); the area at (0,0) radius 500 over 2026-08-08T00:00:00Z..2026-08-08T06:00:00Z is LOCKED and its request has been justified and submitted, so three solicitations are SOLICITED with respond_deadline_utc 2026-08-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/agencies"
