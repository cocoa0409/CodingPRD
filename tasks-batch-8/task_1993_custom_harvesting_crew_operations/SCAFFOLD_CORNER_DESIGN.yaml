  - section: endpoints
    instances:
      - name: settlement_dispute_then_resolve_cascade_to_contract_settled
        claim_type: side_effect_execution
        grounds:
          - state_machines.Settlement.transitions.DISPUTED_to_RESOLVED
          - state_machines.CustomerContract.transitions.HARVESTED_to_SETTLED
        distinguishing_aspect: "resolve on a DISPUTED settlement cascades parent contract HARVESTED → SETTLED."
        test_recipe:
          setup: ["Settlement in DISPUTED status"]
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
