            - "${headcount_3} == 2 and ${integ_3} == SYNCED"

      - name: dispute_reversal_undoes_every_original_economic_side_effect
        claim_type: compensation
        grounds:
          - state_machines.Dispute.status.MERCHANT_RESPONDED_to_RESOLVED_MERCHANT_FAULT
          - entities.LedgerEntry.fields.entry_type
          - entities.Merchant.fields.accrued_commission_payable_cents
          - entities.Employer.fields.accrued_share_cents
        excluded_because:
          difficulty_instance: compensating_invariant / dispute_reversal_and_goodwill_credit_return_the_redemption_ledger_to_zero
          rationale: "That §1.8 instance already walks the six ledger rows of one redemption through reversal and goodwill credit and asserts every derived balance returns to its pre-verification value with no drift, which is exactly the compensation-pattern claim."

      - name: employment_termination_adjusts_the_redemption_and_offer_aggregates
        claim_type: cross_entity
        grounds:
          - state_machines.EmployeeMembership.status.ELIGIBLE_to_REVOKED
          - state_machines.Redemption.verification_status.PENDING_to_VOID
          - entities.Offer.fields.inventory_reserved
        excluded_because:
          difficulty_instance: transitive_cascade / employment_termination_revokes_membership_voids_redemption_and_frees_inventory
          rationale: "That §1.8 instance drives one employment-status write through membership revocation into the redemption and offer aggregates and asserts each downstream entity's state and fields, which is the cross-entity side-effect claim."

      - name: agreement_termination_expires_only_the_non_terminal_offers
        claim_type: conditional_cascade
        grounds:
          - state_machines.PartnerAgreement.status.ACTIVE_to_TERMINATED
          - state_machines.Offer.status.ACTIVE_to_EXPIRED
          - entities.Offer.fields.expired_at
          - entities.PartnerAgreement.fields.exclusivity_granted
          - entities.Merchant.fields.active_agreement_count
        distinguishing_aspect: |
          Terminating one agreement that carries five offers expires exactly the four whose
          status is in {DRAFT, PENDING_REVIEW, ACTIVE, PAUSED} and leaves the REJECTED one at
          REJECTED with expired_at still null, so the cascade is conditional on the child's
          state rather than unconditional on parentage.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; merchant Bistro Uno ACTIVE with one ACTIVE DINING/CA agreement and no employer rows at all, so the category-coverage floor cannot block termination."
            - "Five offers hang off that agreement: offer_active ACTIVE, offer_paused PAUSED, offer_draft DRAFT, offer_review PENDING_REVIEW and offer_rejected REJECTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
