        claim_type: violation_to_error
        grounds: ["validations[priority=28]", "errors[ERR_ADDON_ALREADY_REQUESTED]"]
        distinguishing_aspect: "A second REPTILE_SHOW add-on while the first is still REQUESTED is rejected; the OCC version must also be fresh or the stale-version error would mask it."
