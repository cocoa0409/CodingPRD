            - call: "POST /floor-plans"
              payload: { model_code: "FP-3410", chassis_class: "CLASS_A", length_ft: 34, base_msrp_cents: 18500000, base_station_hours: 46.00, base_dry_weight_lbs: 22400, gvwr_lbs: 26000, required_wheelbase_in: 242, electrical_service_amps: 50, fresh_water_capacity_gal: 90 }
