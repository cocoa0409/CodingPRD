# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2273 Faculty Credential Verification
#
# 9 §0.5 rule_ids x 2 differentiated instances = 18 instances.
# Every numeric literal in every `assert:` line was computed by executing the
# corresponding §1.3 `formula:` with its `constants:` in Python (Decimal,
# ROUND_HALF_UP) before being written here.
#
# Shared fixture calls are YAML anchors defined at first use and re-used by
# alias (`- *c_clock`). An alias re-runs the identical call (including its
# `captures:`), so placeholder closure holds independently inside every
# instance.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc  (2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: qualification_policy_degree_field_vs_coursework_18_diverge_on_identical_dossier
        grounds:
          - calculations.assignment_qualification_determination
          - calculations.discipline_alignment_score
          - entities.Program.fields.qualification_policy
          - entities.CourseAssignment.fields.qualification_basis
          - entities.CourseAssignment.fields.exception_code
          - state_machines.CourseAssignment.PENDING_VERIFICATION_to_VERIFIED_QUALIFIED
          - state_machines.CourseAssignment.PENDING_VERIFICATION_to_EXCEPTION_FLAGGED
        distinguishing_aspect: |
          This instance switches the variant on Program.qualification_policy and observes the
          divergence on CourseAssignment (the credentialing-decision domain): one identical
          faculty dossier yields EXCEPTION_FLAGGED / DEGREE_LEVEL_INSUFFICIENT under
          DEGREE_FIELD and VERIFIED_QUALIFIED / COURSEWORK_18_HOUR under COURSEWORK_18, while
          alignment_score is 1.0000 in both arms.
        test_recipe:
          setup:
            - "Discipline forest: Communication 09.01 (root) with children Journalism 09.04 and Public Relations 09.07, both requiring MASTERS and min_graduate_credit_hours 18."
            - "Two Journalism programs identical except for qualification_policy: DEGREE_FIELD and COURSEWORK_18."
            - "Term 2026FA is OPEN; the logical clock sits at the mandatory default 2026-08-01T00:00:00Z."
            - "Dana Reyes (ADJUNCT) holds two VERIFIED, OFFICIAL_RECEIVED, domestic records: a MASTERS in Public Relations (sibling of Journalism -> alignment 0.6500) and a NON_DEGREE_GRADUATE record in Journalism with exactly 18 graduate credit hours (alignment 1.0000). dossier_status == VERIFIED, appointment_status == CREDENTIALED_ELIGIBLE."
            - "One 3-credit LOWER_DIVISION Journalism section in each program, on different weekdays so no teaching block can collide."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-01"
            - &c_comm
              call: "POST /disciplines"
              payload: { code: "09.01", name: "Communication", required_terminal_degree_level: MASTERS, min_graduate_credit_hours: 18 }
              as: SystemAdmin
              as_user_id: "admin-01"
              captures: { comm_id: $.data.id }
            - &c_journ
              call: "POST /disciplines"
              payload: { code: "09.04", name: "Journalism", parent_discipline_id: "${comm_id}", required_terminal_degree_level: MASTERS, min_graduate_credit_hours: 18 }
              as: SystemAdmin
              as_user_id: "admin-01"
              captures: { journ_id: $.data.id }
            - &c_pr
              call: "POST /disciplines"
              payload: { code: "09.07", name: "Public Relations", parent_discipline_id: "${comm_id}", required_terminal_degree_level: MASTERS, min_graduate_credit_hours: 18 }
              as: SystemAdmin
              as_user_id: "admin-01"
              captures: { pr_id: $.data.id }
            - &c_prog_df
              call: "POST /programs"
              payload: { name: "BA Journalism (Degree-Field Policy)", discipline_id: "${journ_id}", degree_level: BACHELORS, qualification_policy: DEGREE_FIELD, adequacy_basis: HEADCOUNT, min_terminal_ratio: 0.60, credential_budget_cents: 500000 }
              as: SystemAdmin
              as_user_id: "admin-01"
              captures: { prog_df_id: $.data.id }
            - &c_prog_cw
              call: "POST /programs"
              payload: { name: "BA Journalism (Coursework Policy)", discipline_id: "${journ_id}", degree_level: BACHELORS, qualification_policy: COURSEWORK_18, adequacy_basis: CREDIT_HOUR_COVERAGE, min_terminal_ratio: 0.60, credential_budget_cents: 500000 }
              as: SystemAdmin
              as_user_id: "admin-01"
              captures: { prog_cw_id: $.data.id }
            - &c_term
              call: "POST /terms"
              payload: { code: "2026FA", start_date: "2026-09-15", end_date: "2026-12-20", census_date: "2026-10-01" }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { term_id: $.data.id }
            - &c_term_open
              call: "POST /terms/${term_id}/status"
              payload: { to_status: OPEN }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
            - &c_fac_d
              call: "POST /faculty-members"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@example.edu", employment_class: ADJUNCT, home_program_id: "${prog_df_id}" }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { fac_d_id: $.data.id }
            - &c_rec_d_pr
              call: "POST /credential-records"
              payload: { faculty_member_id: "${fac_d_id}", degree_level: MASTERS, discipline_id: "${pr_id}", conferring_institution: "State University", is_foreign_institution: false, graduate_credit_hours_in_discipline: 30 }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { rec_d_pr_id: $.data.id }
            - &c_rec_d_ndg
              call: "POST /credential-records"
              payload: { faculty_member_id: "${fac_d_id}", degree_level: NON_DEGREE_GRADUATE, discipline_id: "${journ_id}", conferring_institution: "State University", is_foreign_institution: false, graduate_credit_hours_in_discipline: 18 }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { rec_d_ndg_id: $.data.id }
            - &c_tr_d_pr
              call: "POST /credential-records/${rec_d_pr_id}/transcript"
              payload: { transcript_status: OFFICIAL_RECEIVED }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
            - &c_tr_d_ndg
              call: "POST /credential-records/${rec_d_ndg_id}/transcript"
              payload: { transcript_status: OFFICIAL_RECEIVED }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
            - &c_vf_d_pr
              call: "POST /credential-records/${rec_d_pr_id}/verification"
              payload: { decision: VERIFY }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
            - &c_vf_d_ndg
              call: "POST /credential-records/${rec_d_ndg_id}/verification"
              payload: { decision: VERIFY }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
            - &c_sec_df
              call: "POST /course-sections"
              payload: { course_code: "JOUR101", title: "News Writing", program_id: "${prog_df_id}", term_id: "${term_id}", discipline_id: "${journ_id}", course_level: LOWER_DIVISION, credit_hours: 3, delivery_mode: IN_PERSON, building_code: "HALL-A", meeting_days: ["MO"], meeting_start_minute: 540, meeting_end_minute: 620 }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { sec_df_id: $.data.id, sec_df_v: $.data.version }
            - &c_sec_cw
              call: "POST /course-sections"
              payload: { course_code: "JOUR102", title: "Reporting Practicum", program_id: "${prog_cw_id}", term_id: "${term_id}", discipline_id: "${journ_id}", course_level: LOWER_DIVISION, credit_hours: 3, delivery_mode: IN_PERSON, building_code: "HALL-A", meeting_days: ["TU"], meeting_start_minute: 540, meeting_end_minute: 620 }
              as: ProgramDean
              as_user_id: "${prog_cw_id}"
              captures: { sec_cw_id: $.data.id, sec_cw_v: $.data.version }
          trigger:
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_id}", faculty_member_id: "${fac_d_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_df_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { asn_df_id: $.data.id }
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_cw_id}", faculty_member_id: "${fac_d_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_cw_v}" }
              as: ProgramDean
              as_user_id: "${prog_cw_id}"
              captures: { asn_cw_id: $.data.id }
          assert:
            - "CourseAssignment.${asn_df_id}.status == EXCEPTION_FLAGGED"
            - "CourseAssignment.${asn_df_id}.qualification_basis == NONE"
            - "CourseAssignment.${asn_df_id}.exception_code == DEGREE_LEVEL_INSUFFICIENT"
            - "CourseAssignment.${asn_df_id}.alignment_score == 1.0000"
            - "CourseAssignment.${asn_cw_id}.status == VERIFIED_QUALIFIED"
            - "CourseAssignment.${asn_cw_id}.qualification_basis == COURSEWORK_18_HOUR"
            - "CourseAssignment.${asn_cw_id}.exception_code == null"
            - "CourseAssignment.${asn_cw_id}.alignment_score == 1.0000"
            - "Both arms read the same eligible_set, so alignment_score is identical (1.0000) and only qualification_basis / exception_code diverge"
            - "FacultyMember.${fac_d_id}.assigned_credit_hours == 6"
            - "CourseSection.${sec_df_id}.instructor_of_record_id == ${fac_d_id}"

      - name: adequacy_basis_headcount_vs_credit_hour_coverage_cross_status_bands
        grounds:
          - calculations.program_faculty_adequacy
          - calculations.roster_snapshot_recompute
          - entities.Program.fields.adequacy_basis
          - entities.Program.fields.adequacy_ratio
          - entities.Program.fields.adequacy_status
          - entities.FacultyRoster.fields.adequacy_ratio_snapshot
          - endpoints[GET /programs/{programId}/adequacy]
        distinguishing_aspect: |
          This instance switches the variant on Program.adequacy_basis and observes the
          divergence on Program/FacultyRoster (the accreditation-adequacy domain, a different
          entity domain from instance 1): the same two assignments yield 1/2 = 0.5000 AT_RISK
          under HEADCOUNT but 1/5 = 0.2000 INSUFFICIENT under CREDIT_HOUR_COVERAGE, i.e. the
          two variants land in different adequacy_status bands, and basis_override never
          overwrites the persisted value.
        test_recipe:
          setup:
            - "Same discipline forest, programs, term and Dana Reyes dossier as the previous instance."
            - "Morgan Ellis (FULL_TIME, home program = the COURSEWORK_18 program) holds one VERIFIED, OFFICIAL_RECEIVED, domestic MASTERS in Journalism (alignment 1.0000)."
            - "In the COURSEWORK_18 program: a 1-credit LOWER_DIVISION Journalism lab taught by Morgan (qualifies TERMINAL_DEGREE) and a 4-credit LOWER_DIVISION Journalism survey taught by Dana (qualifies COURSEWORK_18_HOUR)."
            - "The program's anchor FacultyRoster for 2026FA has been generated once, so adequacy is persisted under the program's own basis CREDIT_HOUR_COVERAGE with min_terminal_ratio 0.60."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_d
            - *c_rec_d_pr
            - *c_rec_d_ndg
            - *c_tr_d_pr
            - *c_tr_d_ndg
            - *c_vf_d_pr
            - *c_vf_d_ndg
            - &c_fac_m
              call: "POST /faculty-members"
              payload: { full_name: "Morgan Ellis", email: "morgan.ellis@example.edu", employment_class: FULL_TIME, home_program_id: "${prog_cw_id}" }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { fac_m_id: $.data.id }
            - &c_rec_m_journ
              call: "POST /credential-records"
              payload: { faculty_member_id: "${fac_m_id}", degree_level: MASTERS, discipline_id: "${journ_id}", conferring_institution: "Northern University", is_foreign_institution: false, graduate_credit_hours_in_discipline: 36 }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { rec_m_journ_id: $.data.id }
            - &c_tr_m_journ
              call: "POST /credential-records/${rec_m_journ_id}/transcript"
              payload: { transcript_status: OFFICIAL_RECEIVED }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
            - &c_vf_m_journ
              call: "POST /credential-records/${rec_m_journ_id}/verification"
              payload: { decision: VERIFY }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
            - &c_sec_lab
              call: "POST /course-sections"
              payload: { course_code: "JOUR190", title: "Newsroom Lab", program_id: "${prog_cw_id}", term_id: "${term_id}", discipline_id: "${journ_id}", course_level: LOWER_DIVISION, credit_hours: 1, delivery_mode: IN_PERSON, building_code: "HALL-A", meeting_days: ["WE"], meeting_start_minute: 540, meeting_end_minute: 600 }
              as: ProgramDean
              as_user_id: "${prog_cw_id}"
              captures: { sec_lab_id: $.data.id, sec_lab_v: $.data.version }
            - &c_sec_survey
              call: "POST /course-sections"
              payload: { course_code: "JOUR110", title: "Media Survey", program_id: "${prog_cw_id}", term_id: "${term_id}", discipline_id: "${journ_id}", course_level: LOWER_DIVISION, credit_hours: 4, delivery_mode: IN_PERSON, building_code: "HALL-A", meeting_days: ["TH"], meeting_start_minute: 540, meeting_end_minute: 660 }
              as: ProgramDean
              as_user_id: "${prog_cw_id}"
              captures: { sec_survey_id: $.data.id, sec_survey_v: $.data.version }
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_lab_id}", faculty_member_id: "${fac_m_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_lab_v}" }
              as: ProgramDean
              as_user_id: "${prog_cw_id}"
              captures: { asn_lab_id: $.data.id }
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_survey_id}", faculty_member_id: "${fac_d_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_survey_v}" }
              as: ProgramDean
              as_user_id: "${prog_cw_id}"
              captures: { asn_survey_id: $.data.id }
            - &c_roster_cw
              call: "POST /faculty-rosters"
              payload: { program_id: "${prog_cw_id}", term_id: "${term_id}" }
              as: AccreditationLiaison
              as_user_id: "liaison-01"
              captures: { roster_cw_id: $.data.id }
            - &c_roster_cw_gen
              call: "POST /faculty-rosters/${roster_cw_id}/generate"
              payload: {}
              as: AccreditationLiaison
              as_user_id: "liaison-01"
          trigger:
            - call: "GET /programs/${prog_cw_id}/adequacy"
              payload: { term_id: "${term_id}" }
              as: AccreditationLiaison
              as_user_id: "liaison-01"
            - call: "GET /programs/${prog_cw_id}/adequacy"
              payload: { term_id: "${term_id}", basis_override: HEADCOUNT }
              as: AccreditationLiaison
              as_user_id: "liaison-01"
          assert:
            - "First trigger response: basis_applied == CREDIT_HOUR_COVERAGE, numerator == 1, denominator == 5, adequacy_ratio == 0.2000, adequacy_status == INSUFFICIENT, unqualified_assignment_count == 0, roster_id == ${roster_cw_id}"
            - "Second trigger response: basis_applied == HEADCOUNT, numerator == 1, denominator == 2, adequacy_ratio == 0.5000, adequacy_status == AT_RISK"
            - "The two variants land in DIFFERENT bands: 0.5000 >= 0.60 - 0.15 = 0.45 is AT_RISK while 0.2000 < 0.45 is INSUFFICIENT"
            - "Program.${prog_cw_id}.adequacy_ratio == 0.2000 and Program.${prog_cw_id}.adequacy_status == INSUFFICIENT after the basis_override read — the override is a projection and persists nothing"
            - "Program.${prog_cw_id}.adequacy_term_id == ${term_id}"
            - "FacultyRoster.${roster_cw_id}.credit_hours_total == 5"
            - "FacultyRoster.${roster_cw_id}.credit_hours_terminal_qualified == 1"
            - "FacultyRoster.${roster_cw_id}.terminal_qualified_headcount == 1"
            - "FacultyRoster.${roster_cw_id}.distinct_faculty_count == 2"
            - "FacultyRoster.${roster_cw_id}.adequacy_ratio_snapshot == 0.2000"
            - "FacultyRoster.${roster_cw_id}.blocking_reason_codes == [ADEQUACY_BELOW_MINIMUM]"
            - "FacultyRoster.${roster_cw_id}.certification_readiness == BLOCKED"
            - "CourseAssignment.${asn_lab_id}.qualification_basis == TERMINAL_DEGREE and CourseAssignment.${asn_survey_id}.qualification_basis == COURSEWORK_18_HOUR"

  # ===========================================================================
  # RULE 2 — combinatorial_formula  (3 instances; modes a / b / c all differ)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: evaluation_fee_tiered_pages_times_expedite_multiplier_with_floor_and_cap
        grounds:
          - calculations.evaluation_fee_cents
          - entities.CredentialEvaluation.fields.fee_cents
          - entities.CredentialEvaluation.fields.service_level
          - validations[priority=17]
          - endpoints[POST /credential-evaluations]
        distinguishing_aspect: |
          Mode (a): three-bracket marginal page pricing plus a fixed base and a foreign
          surcharge, multiplied ONCE by the expedite multiplier and only then clamped by a
          floor and a cap — the composition order (brackets -> surcharge -> multiplier ->
          floor/cap) is what the six pinned fees falsify.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Journalism discipline; the DEGREE_FIELD program with credential_budget_cents 500000."
            - "Dana Reyes holds one FOREIGN MASTERS credential record from Universidad Central (is_foreign_institution true), which validation priority 17 requires before any evaluation can be ordered."
            - "No evaluation exists yet, so budget_reserved_cents and budget_spent_cents are both 0."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_prog_df
            - *c_fac_d
            - &c_rec_d_for
              call: "POST /credential-records"
              payload: { faculty_member_id: "${fac_d_id}", degree_level: MASTERS, discipline_id: "${journ_id}", conferring_institution: "Universidad Central", is_foreign_institution: true, graduate_credit_hours_in_discipline: 24 }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { rec_d_for_id: $.data.id }
          trigger:
            - call: "POST /credential-evaluations"
              payload: { credential_record_id: "${rec_d_for_id}", billed_program_id: "${prog_df_id}", evaluator_agency: "WES", page_count: 24, service_level: EXPEDITED }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
              captures: { ev_24_exp_id: $.data.id, fee_24_exp: $.data.fee_cents }
            - call: "POST /credential-evaluations"
              payload: { credential_record_id: "${rec_d_for_id}", billed_program_id: "${prog_df_id}", evaluator_agency: "WES", page_count: 24, service_level: STANDARD }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
              captures: { ev_24_std_id: $.data.id, fee_24_std: $.data.fee_cents }
            - call: "POST /credential-evaluations"
              payload: { credential_record_id: "${rec_d_for_id}", billed_program_id: "${prog_df_id}", evaluator_agency: "WES", page_count: 12, service_level: EXPEDITED }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
              captures: { ev_12_exp_id: $.data.id, fee_12_exp: $.data.fee_cents }
            - call: "POST /credential-evaluations"
              payload: { credential_record_id: "${rec_d_for_id}", billed_program_id: "${prog_df_id}", evaluator_agency: "WES", page_count: 13, service_level: EXPEDITED }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
              captures: { ev_13_exp_id: $.data.id, fee_13_exp: $.data.fee_cents }
            - call: "POST /credential-evaluations"
              payload: { credential_record_id: "${rec_d_for_id}", billed_program_id: "${prog_df_id}", evaluator_agency: "WES", page_count: 4, service_level: STANDARD }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
              captures: { ev_floor_id: $.data.id, fee_floor: $.data.fee_cents }
            - call: "POST /credential-evaluations"
              payload: { credential_record_id: "${rec_d_for_id}", billed_program_id: "${prog_df_id}", evaluator_agency: "WES", page_count: 600, service_level: EXPEDITED }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
              captures: { ev_cap_id: $.data.id, fee_cap: $.data.fee_cents }
          assert:
            - "CredentialEvaluation.${ev_24_exp_id}.fee_cents == 22591"
            - "CredentialEvaluation.${ev_24_std_id}.fee_cents == 15580"
            - "fee_24_exp - fee_24_std == 7011 — the multiplier is applied to the whole subtotal, not to the page charge alone"
            - "CredentialEvaluation.${ev_12_exp_id}.fee_cents == 19459"
            - "CredentialEvaluation.${ev_13_exp_id}.fee_cents == 19720"
            - "fee_13_exp - fee_12_exp == 261 == round_half_up(180 * 1.45) — page 9 is priced at RATE_B, proving the bracket boundary sits after exactly 8 billable pages"
            - "CredentialEvaluation.${ev_floor_id}.fee_cents == 15000 — raw 11500 is lifted to FEE_FLOOR_CENTS"
            - "CredentialEvaluation.${ev_cap_id}.fee_cents == 95000 — raw 122815 is clamped to FEE_CAP_CENTS"
            - "Program.${prog_df_id}.budget_reserved_cents == 187350 == 22591 + 15580 + 19459 + 19720 + 15000 + 95000"
            - "Program.${prog_df_id}.budget_spent_cents == 0 — nothing is spent until an evaluation reaches COMPLETED"
            - "All six evaluations have status == ORDERED"

      - name: evaluation_cost_allocation_floor_then_residual_by_weight_desc_then_created_at
        grounds:
          - calculations.evaluation_cost_allocation
          - calculations.evaluation_fee_cents
          - entities.CredentialEvaluation.fields.allocation_shares
          - entities.Program.fields.budget_spent_cents
          - state_machines.CredentialEvaluation.IN_REVIEW_to_COMPLETED
        distinguishing_aspect: |
          Mode (b): a waterfall allocation that floors every share first and then hands the
          integer residual out in a pinned order (weight_credit_hours DESC, then
          Program.created_at ASC) — a fundamentally different composition from mode (a)'s
          bracket-then-multiplier-then-clamp, and the only one whose correctness is a
          conservation property (shares sum to fee_cents exactly).
        test_recipe:
          setup:
            - "Three programs created in this order: the DEGREE_FIELD program (A), the COURSEWORK_18 program (B), and an MA Strategic Communication program (C)."
            - "Morgan Ellis (FULL_TIME, cap 15 credit hours) teaches 3 credit hours in A, 3 in B and 4 in C in the OPEN 2026FA term, so weight_credit_hours = 3 / 3 / 4 and total_weight = 10."
            - "Morgan's domestic Journalism MASTERS is VERIFIED first (so appointment_status is CREDENTIALED_ELIGIBLE and assignments are permitted), and only afterwards does a FOREIGN record get filed."
            - "A 24-page EXPEDITED evaluation on the foreign record is billed to program A: fee_cents 22591, status IN_REVIEW."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_prog_df
            - *c_prog_cw
            - &c_prog_c
              call: "POST /programs"
              payload: { name: "MA Strategic Communication", discipline_id: "${comm_id}", degree_level: MASTERS, qualification_policy: DEGREE_FIELD, adequacy_basis: HEADCOUNT, min_terminal_ratio: 0.75, credential_budget_cents: 200000 }
              as: SystemAdmin
              as_user_id: "admin-01"
              captures: { prog_c_id: $.data.id }
            - *c_term
            - *c_term_open
            - *c_fac_m
