  - section: validations
    instances:
      - name: publish_rejects_unauthenticated_before_role_and_existence
        claim_type: priority_ordering
        grounds:
          - validations[priority 10 ERR_UNAUTHENTICATED]
          - validations[priority 20 ERR_ROLE_NOT_PERMITTED]
          - validations[priority 30 per-entity ERR_<ENTITY>_NOT_FOUND]
          - endpoints[POST /recommerce/diversion-reports/{id}/publish]
        distinguishing_aspect: "One nonexistent report id produces three different errors depending only on the caller: an empty X-User-ID yields 401 ERR_UNAUTHENTICATED, a MerchandisingManager (absent from the endpoint's roles) yields 403 ERR_ROLE_NOT_PERMITTED, and a ProgramAdmin finally reaches the 404. An implementation that resolves the path id first would answer 404 in all three cases."
        test_recipe:
          setup:
            - "No domain data at all is required; the id 00000000-0000-0000-0000-000000000000 belongs to no DiversionReport."
          setup_api_calls: []
          trigger:
            - call: "POST /recommerce/diversion-reports/00000000-0000-0000-0000-000000000000/publish"
              payload: {}
              as: none
              as_user_id: ""
              captures: { e1: "$.data.error_id" }
            - call: "POST /recommerce/diversion-reports/00000000-0000-0000-0000-000000000000/publish"
              payload: {}
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { e2: "$.data.error_id" }
            - call: "POST /recommerce/diversion-reports/00000000-0000-0000-0000-000000000000/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { e3: "$.data.error_id" }
            - call: "POST /recommerce/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: none
              as_user_id: ""
              captures: { clk: "$.data.current_utc" }
          assert:
            - "${e1} == ERR_UNAUTHENTICATED with HTTP 401 — the X-User-ID header is present but empty, which is exactly as unauthenticated as an absent header"
            - "${e2} == ERR_ROLE_NOT_PERMITTED with HTTP 403 — publish is ProgramAdmin-only"
            - "${e3} == ERR_DIVERSION_REPORT_NOT_FOUND with HTTP 404"
            - "${clk} == 2026-08-02T00:00:00Z with HTTP 200 — POST /recommerce/_clock/set_current_utc is the single endpoint exempt from the authentication rule"

      - name: invalid_enum_outranks_the_trade_in_state_error
        claim_type: priority_ordering
        grounds:
          - validations[priority 25 ERR_INVALID_REQUEST]
          - validations[priority 50 per-transition state error]
          - state_machines.TradeIn.transitions[RECEIVED -> AUTHENTICATED]
        distinguishing_aspect: "A SUBMITTED trade-in given authenticity_result BOGUS answers 422 ERR_INVALID_REQUEST, not the 409 ERR_TRADE_IN_NOT_AUTHENTICATABLE its state would justify; the same call with a legal enum then does return the 409, and only after /receive does it succeed."
        test_recipe:
          setup:
            - "One SUBMITTED MAIL_IN OUTERWEAR grade B trade-in from Ava at the 2026-08-01T00:00:00Z default clock; it has not been received."
          setup_api_calls:
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "OUTERWEAR", condition_grade: "B", base_credit_pct_bp: 2000, resale_price_pct_bp: 3900, refurb_budget_cap_pct_bp: 3000, restock_fee_pct_bp: 1200, warranty_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/store-locations"
              payload: { code: "ST-01", region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { store_id: "$.data.id" }
            - call: "POST /recommerce/customers"
              payload: { email: "ava@example.com", full_name: "Ava Reyes", loyalty_tier: "PLUS" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { cust_id: "$.data.id" }
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${cust_id}", store_location_id: "${store_id}", channel: "MAIL_IN", product_category: "OUTERWEAR", declared_grade: "B", msrp_minor: 50000, item_mass_grams: 1400 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: "$.data.id", ti_status: "$.data.status" }
          trigger:
            - call: "POST /recommerce/trade-ins/${ti_id}/authenticate"
              payload: { authenticity_result: "BOGUS" }
              as: Authenticator
              as_user_id: "auth-001"
              captures: { e1: "$.data.error_id" }
            - call: "POST /recommerce/trade-ins/${ti_id}/authenticate"
              payload: { authenticity_result: "GENUINE", assessed_grade: "B" }
              as: Authenticator
              as_user_id: "auth-001"
              captures: { e2: "$.data.error_id" }
            - call: "POST /recommerce/trade-ins/${ti_id}/receive"
              payload: {}
              as: IntakeAgent
              as_user_id: "intake-001"
              captures: { st_recv: "$.data.status" }
            - call: "POST /recommerce/trade-ins/${ti_id}/authenticate"
              payload: { authenticity_result: "GENUINE", assessed_grade: "B" }
              as: Authenticator
              as_user_id: "auth-001"
              captures: { st_auth: "$.data.status", grader: "$.data.graded_by_user_id", cred: "$.data.appraised_credit_minor" }
          assert:
            - "${ti_status} == SUBMITTED"
            - "${e1} == ERR_INVALID_REQUEST with HTTP 422  # schema beats state"
            - "${e2} == ERR_TRADE_IN_NOT_AUTHENTICATABLE with HTTP 409"
            - "${st_recv} == RECEIVED then ${st_auth} == AUTHENTICATED, ${grader} == auth-001 and ${cred} == 11500  # 10000 base + 1000 mail-in + 500 PLUS"

      - name: missing_foreign_key_outranks_customer_suspension_and_closed_store
        claim_type: priority_ordering
        grounds:
          - validations[priority 35 per-entity ERR_<ENTITY>_NOT_FOUND]
          - validations[priority 58 ERR_CUSTOMER_SUSPENDED]
          - validations[priority 59 ERR_STORE_LOCATION_CLOSED]
          - endpoints[PATCH /recommerce/customers/{id}]
          - endpoints[PATCH /recommerce/store-locations/{id}]
        distinguishing_aspect: "With a SUSPENDED customer, a bogus store_location_id still answers 404 ERR_STORE_LOCATION_NOT_FOUND; only once the FK resolves does 409 ERR_CUSTOMER_SUSPENDED appear, and only once the customer is reactivated does the CLOSED store's 409 ERR_STORE_LOCATION_CLOSED surface."
        test_recipe:
          setup:
            - "Ava is SUSPENDED via PATCH; store ST-01 is ACTIVE to begin with."
          setup_api_calls:
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "OUTERWEAR", condition_grade: "B", base_credit_pct_bp: 2000, resale_price_pct_bp: 3900, refurb_budget_cap_pct_bp: 3000, restock_fee_pct_bp: 1200, warranty_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/store-locations"
              payload: { code: "ST-01", region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { store_id: "$.data.id" }
            - call: "POST /recommerce/customers"
              payload: { email: "ava@example.com", full_name: "Ava Reyes", loyalty_tier: "PLUS" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { cust_id: "$.data.id" }
            - call: "PATCH /recommerce/customers/${cust_id}"
              payload: { status: "SUSPENDED" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { cust_status: "$.data.status" }
          trigger:
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${cust_id}", store_location_id: "00000000-0000-0000-0000-000000000000", channel: "MAIL_IN", product_category: "OUTERWEAR", declared_grade: "B", msrp_minor: 50000, item_mass_grams: 1400 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { e1: "$.data.error_id" }
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${cust_id}", store_location_id: "${store_id}", channel: "MAIL_IN", product_category: "OUTERWEAR", declared_grade: "B", msrp_minor: 50000, item_mass_grams: 1400 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { e2: "$.data.error_id" }
            - call: "PATCH /recommerce/customers/${cust_id}"
              payload: { status: "ACTIVE" }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "PATCH /recommerce/store-locations/${store_id}"
              payload: { status: "CLOSED" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { store_status: "$.data.status" }
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${cust_id}", store_location_id: "${store_id}", channel: "MAIL_IN", product_category: "OUTERWEAR", declared_grade: "B", msrp_minor: 50000, item_mass_grams: 1400 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { e3: "$.data.error_id" }
            - call: "PATCH /recommerce/store-locations/${store_id}"
              payload: { status: "ACTIVE" }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${cust_id}", store_location_id: "${store_id}", channel: "MAIL_IN", product_category: "OUTERWEAR", declared_grade: "B", msrp_minor: 50000, item_mass_grams: 1400 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ok_status: "$.data.status", deadline: "$.data.receive_deadline_at" }
          assert:
            - "${cust_status} == SUSPENDED and ${store_status} == CLOSED"
            - "${e1} == ERR_STORE_LOCATION_NOT_FOUND with HTTP 404  # FK existence at priority 35 beats the suspension at 58"
            - "${e2} == ERR_CUSTOMER_SUSPENDED with HTTP 409"
            - "${e3} == ERR_STORE_LOCATION_CLOSED with HTTP 409  # referenced-row state at priority 59"
            - "the final create returns 201 with ${ok_status} == SUBMITTED and ${deadline} == 2026-08-22T00:00:00Z  # MAIL_IN_INTAKE_WINDOW_DAYS 21 from 2026-08-01"

      - name: stale_customer_version_outranks_the_redemption_cap
