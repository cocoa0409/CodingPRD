              as: ParkingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_INTERVAL (HTTP 400)"

      - name: sod_decide_own_citation_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_SEGREGATION_OF_DUTIES]", "roles"]
        distinguishing_aspect: "Segregation of duties: when the AppealsOfficer's X-User-ID equals the citation's issued_by_officer_id (off-7), the decision is rejected; a different officer (off-9) can decide."
        test_recipe:
          setup: ["patron with permit plate S777; citation issued by officer off-7 and appealed (UNDER_APPEAL)"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "S", campus_role: "STAFF", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { s_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LA", name: "Lot A", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_a: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LB", name: "Lot B", zone: "REMOTE", capacity_total: 50 }
