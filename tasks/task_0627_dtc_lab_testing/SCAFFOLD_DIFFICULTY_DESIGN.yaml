# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# DTC Lab Testing. Nine §0.5 rules × >= 2 instances each (>= 18 total).
# Every grounds[] resolves into SCAFFOLD.yaml §1.1–§1.7; every setup_api_calls
# chain is executable from empty-DB using only §1.5 endpoints. All numeric
# asserts are pre-computed literals (see verification snippets in worklog).
# Clock default: 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: pricing_cart_estimate_vs_order_final_invoice_diverge
        grounds:
          - calculations.cart_estimated_total
          - calculations.order_final_invoiced_total
          - state_machines.LabResult.PROCESSING_to_RELEASED
          - entities.Cart.fields.estimated_total_cents
          - entities.Order.fields.invoiced_total_cents
        distinguishing_aspect: |
          Pricing domain: with bundle WELLNESS3 {A,B,C}@9000 plus standalone D@30000, the
          forward-looking Cart estimate is 35100 (bundle applied, 10% tier), but after only D
          results (A,B,C rejected) the chronological Order invoice is 27000 (bundle voided
          because not all members RESULTED) — same inputs, different totals.
        test_recipe:
          setup:
            - "Catalog: offerings A,B,C @4000, D @30000 (none PWN-restricted, none fasting); bundle WELLNESS3 = {A,B,C} @9000."
            - "Patient P (CARD). Cart with lines A,B,C,D; checked out as HOME_KIT order; A,B,C specimens rejected, D processed+released."
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "A", display_name: "Test A", list_price_cents: 4000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_a: '$.data.id' }
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "B", display_name: "Test B", list_price_cents: 4000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_b: '$.data.id' }
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "C", display_name: "Test C", list_price_cents: 4000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_c: '$.data.id' }
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "D", display_name: "Test D", list_price_cents: 30000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_d: '$.data.id' }
            - call: "POST /catalog/panel-bundles"
              payload: { bundle_code: "WELLNESS3", display_name: "Wellness 3", member_test_codes: ["A","B","C"], bundle_price_cents: 9000 }
              as: CatalogAdmin
            - call: "POST /catalog/patients"
              payload: { email: "p1@x.com", full_name: "P One", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
              captures: { p1: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${p1}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${p1}"
              captures: { cart1: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cart1}", test_offering_id: "${off_a}" }
              as: Patient
              as_user_id: "${p1}"
              captures: { line_a: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cart1}", test_offering_id: "${off_b}" }
              as: Patient
              as_user_id: "${p1}"
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cart1}", test_offering_id: "${off_c}" }
              as: Patient
              as_user_id: "${p1}"
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cart1}", test_offering_id: "${off_d}" }
              as: Patient
              as_user_id: "${p1}"
            - call: "GET /catalog/carts/${cart1}"
              as: Patient
              as_user_id: "${p1}"
              captures: { cart1_est: '$.data.estimated_total_cents', cart1_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cart1}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cart1_v}" }
              as: Patient
              as_user_id: "${p1}"
              captures: { order1: '$.data.id' }
            - call: "POST /catalog/home-kits"
              payload: { order_id: "${order1}", shipping_state_code: "CA" }
              as: Patient
              as_user_id: "${p1}"
            - call: "GET /catalog/order-lines?order_id=${order1}"
              as: CatalogAdmin
              captures: { ol_a: '$.data[0].id', ol_d: '$.data[3].id' }
            - call: "POST /catalog/order-lines/${ol_d}/collect"
              as: PhlebotomyTech
              captures: { spec_d: '$.data.id' }
            - call: "POST /catalog/specimens/${spec_d}/process"
              payload: { analyzer_value: 5 }
              as: LabTech
              captures: { res_d: '$.data.id' }
            - call: "POST /catalog/lab-results/${res_d}/release"
              as: LabTech
          trigger:
            - call: "GET /catalog/orders/${order1}"
              as: CatalogAdmin
              captures: { order1_invoiced: '$.data.invoiced_total_cents' }
          assert:
            - "Cart.${cart1}.estimated_total_cents == 35100"
            - "Order.${order1}.invoiced_total_cents == 27000"
            - "Cart.${cart1}.estimated_total_cents != Order.${order1}.invoiced_total_cents"

      - name: clinical_result_provisional_vs_final_flag_diverge
        grounds:
          - calculations.result_provisional_flag
          - calculations.result_final_flag
          - entities.LabResult.fields.provisional_flag
          - entities.LabResult.fields.final_flag
          - state_machines.LabResult.PROCESSING_to_RELEASED
        distinguishing_aspect: |
          Clinical domain (LabResult, not pricing): analyzer_value 95 for GLU (ref 70–100) is
          provisional_flag NORMAL, but with a prior RELEASED GLU result of 44 the absolute delta
          is 51 (>= DELTA_CHECK_ABS 50), escalating final_flag to ABNORMAL — same value, two flags.
        test_recipe:
          setup:
            - "Offering GLU ref_low 70 ref_high 100 critical_low 40 critical_high 400. Patient P2."
            - "Prior order: GLU collected, processed analyzer_value 44, released (final_flag NORMAL). Second order: GLU processed analyzer_value 95."
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "GLU", display_name: "Glucose", list_price_cents: 4000, specimen_type: "BLOOD", critical_low: 40, critical_high: 400, ref_low: 70, ref_high: 100 }
              as: CatalogAdmin
              captures: { off_glu: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "p2@x.com", full_name: "P Two", date_of_birth: "1985-05-05", state_code: "CA" }
              as: CatalogAdmin
              captures: { p2: '$.data.id' }
            # ---- prior released GLU=44 ----
            - call: "POST /catalog/carts"
              payload: { patient_id: "${p2}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${p2}"
              captures: { cartA: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cartA}", test_offering_id: "${off_glu}" }
              as: Patient
              as_user_id: "${p2}"
            - call: "GET /catalog/carts/${cartA}"
              as: Patient
              as_user_id: "${p2}"
              captures: { cartA_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cartA}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cartA_v}" }
              as: Patient
              as_user_id: "${p2}"
              captures: { orderA: '$.data.id' }
            - call: "POST /catalog/home-kits"
              payload: { order_id: "${orderA}", shipping_state_code: "CA" }
              as: Patient
              as_user_id: "${p2}"
            - call: "GET /catalog/order-lines?order_id=${orderA}"
              as: CatalogAdmin
              captures: { olA: '$.data[0].id' }
            - call: "POST /catalog/order-lines/${olA}/collect"
              as: PhlebotomyTech
              captures: { specA: '$.data.id' }
            - call: "POST /catalog/specimens/${specA}/process"
              payload: { analyzer_value: 44 }
              as: LabTech
              captures: { resA: '$.data.id' }
            - call: "POST /catalog/lab-results/${resA}/release"
              as: LabTech
            # ---- second order GLU=95 processed (kept in PROCESSING) ----
            - call: "POST /catalog/carts"
              payload: { patient_id: "${p2}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${p2}"
              captures: { cartB: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cartB}", test_offering_id: "${off_glu}" }
              as: Patient
              as_user_id: "${p2}"
            - call: "GET /catalog/carts/${cartB}"
              as: Patient
              as_user_id: "${p2}"
              captures: { cartB_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cartB}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cartB_v}" }
              as: Patient
              as_user_id: "${p2}"
              captures: { orderB: '$.data.id' }
            - call: "POST /catalog/home-kits"
              payload: { order_id: "${orderB}", shipping_state_code: "CA" }
              as: Patient
              as_user_id: "${p2}"
            - call: "GET /catalog/order-lines?order_id=${orderB}"
              as: CatalogAdmin
              captures: { olB: '$.data[0].id' }
            - call: "POST /catalog/order-lines/${olB}/collect"
              as: PhlebotomyTech
              captures: { specB: '$.data.id' }
            - call: "POST /catalog/specimens/${specB}/process"
              payload: { analyzer_value: 95 }
              as: LabTech
              captures: { resB: '$.data.id', resB_prov: '$.data.provisional_flag' }
          trigger:
            - call: "POST /catalog/lab-results/${resB}/release"
              as: LabTech
              captures: { resB_final: '$.data.final_flag' }
          assert:
            - "LabResult.${resB}.provisional_flag == NORMAL"
            - "LabResult.${resB}.final_flag == ABNORMAL"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: per_line_repeat_discount_rounds_then_sums_mode_b
        grounds:
          - calculations.cart_estimated_total
          - entities.CartLine.fields.repeat_discount_applied
          - entities.Cart.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (b) nested rounding order: two repeat-discounted lines of 110 each round PER LINE
          (round_half_up(110*0.85)=94) then sum to 188; the rejected sum-then-round path
          (round_half_up(220*0.85)=187) differs by 1 cent — the scaffold pins round-then-sum.
        test_recipe:
          setup:
            - "Offering RPT @110. Patient P3 already has a RELEASED RPT result (repeat-eligible). Cart with two RPT lines."
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "RPT", display_name: "Repeat Cheap", list_price_cents: 110, specimen_type: "URINE" }
              as: CatalogAdmin
              captures: { off_rpt: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "p3@x.com", full_name: "P Three", date_of_birth: "1980-03-03", state_code: "CA" }
              as: CatalogAdmin
              captures: { p3: '$.data.id' }
            # prior released RPT so repeat_discount_applied becomes true on later cart lines
            - call: "POST /catalog/carts"
              payload: { patient_id: "${p3}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${p3}"
              captures: { cart_prior: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cart_prior}", test_offering_id: "${off_rpt}" }
              as: Patient
              as_user_id: "${p3}"
            - call: "GET /catalog/carts/${cart_prior}"
              as: Patient
              as_user_id: "${p3}"
              captures: { cart_prior_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cart_prior}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cart_prior_v}" }
              as: Patient
              as_user_id: "${p3}"
              captures: { order_prior: '$.data.id' }
            - call: "POST /catalog/home-kits"
              payload: { order_id: "${order_prior}", shipping_state_code: "CA" }
              as: Patient
              as_user_id: "${p3}"
            - call: "GET /catalog/order-lines?order_id=${order_prior}"
              as: CatalogAdmin
              captures: { ol_prior: '$.data[0].id' }
            - call: "POST /catalog/order-lines/${ol_prior}/collect"
              as: PhlebotomyTech
              captures: { spec_prior: '$.data.id' }
            - call: "POST /catalog/specimens/${spec_prior}/process"
              payload: { analyzer_value: 1 }
              as: LabTech
              captures: { res_prior: '$.data.id' }
            - call: "POST /catalog/lab-results/${res_prior}/release"
              as: LabTech
            # now a fresh cart with two repeat-eligible RPT lines
            - call: "POST /catalog/carts"
              payload: { patient_id: "${p3}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${p3}"
              captures: { cart3: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cart3}", test_offering_id: "${off_rpt}" }
              as: Patient
              as_user_id: "${p3}"
              captures: { l1: '$.data.id', l1_repeat: '$.data.repeat_discount_applied' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cart3}", test_offering_id: "${off_rpt}" }
              as: Patient
              as_user_id: "${p3}"
          trigger:
            - call: "GET /catalog/carts/${cart3}"
              as: Patient
              as_user_id: "${p3}"
              captures: { cart3_subtotal: '$.data.subtotal_cents', cart3_total: '$.data.estimated_total_cents' }
          assert:
            - "CartLine.${l1}.repeat_discount_applied == true"
            - "Cart.${cart3}.subtotal_cents == 188"
            - "Cart.${cart3}.estimated_total_cents == 188"

      - name: hsa_capture_split_pinned_eval_order_mode_c
        grounds:
          - calculations.hsa_capture_split
          - calculations.order_final_invoiced_total
          - entities.Order.fields.hsa_applied_cents
          - entities.Order.fields.patient_due_cents
          - state_machines.Order.payment_status=AUTHORIZED_to_payment_status=CAPTURED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: patient_due = total - hsa_applied, but
          hsa_applied = min(hsa_balance, total_after_platform_discount) and the platform tier keys
          off the total. Pinned order (discount→hsa→due) yields total 27000, hsa_applied 20000,
          due 7000 for hsa_balance 20000 — not 30000-20000.
        test_recipe:
          setup:
            - "Offering D @30000. Patient P4 HSA balance 20000, fund_source HSA_FSA. Single-line HOME_KIT order, D processed+released, order COMPLETED."
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "D4", display_name: "Test D4", list_price_cents: 30000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_d4: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "p4@x.com", full_name: "P Four", date_of_birth: "1975-07-07", state_code: "CA", hsa_balance_cents: 20000 }
              as: CatalogAdmin
              captures: { p4: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${p4}", fund_source: "HSA_FSA" }
              as: Patient
              as_user_id: "${p4}"
              captures: { cart4: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cart4}", test_offering_id: "${off_d4}" }
              as: Patient
              as_user_id: "${p4}"
            - call: "GET /catalog/carts/${cart4}"
              as: Patient
              as_user_id: "${p4}"
              captures: { cart4_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cart4}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cart4_v}" }
              as: Patient
              as_user_id: "${p4}"
              captures: { order4: '$.data.id' }
            - call: "POST /catalog/home-kits"
              payload: { order_id: "${order4}", shipping_state_code: "CA" }
              as: Patient
              as_user_id: "${p4}"
            - call: "GET /catalog/order-lines?order_id=${order4}"
              as: CatalogAdmin
              captures: { ol4: '$.data[0].id' }
            - call: "POST /catalog/order-lines/${ol4}/collect"
              as: PhlebotomyTech
              captures: { spec4: '$.data.id' }
            - call: "POST /catalog/specimens/${spec4}/process"
              payload: { analyzer_value: 5 }
              as: LabTech
              captures: { res4: '$.data.id' }
            - call: "POST /catalog/lab-results/${res4}/release"
              as: LabTech
            - call: "GET /catalog/orders/${order4}"
              as: Patient
              as_user_id: "${p4}"
              captures: { order4_v: '$.data.version' }
          trigger:
            - call: "POST /catalog/orders/${order4}/capture-payment"
              payload: { expected_order_version: "${order4_v}" }
              as: Patient
              as_user_id: "${p4}"
              captures: { order4_due: '$.data.patient_due_cents', order4_hsa: '$.data.hsa_applied_cents' }
          assert:
            - "Order.${order4}.invoiced_total_cents == 27000"
            - "Order.${order4}.hsa_applied_cents == 20000"
            - "Order.${order4}.patient_due_cents == 7000"
            - "Patient.${p4}.hsa_balance_cents == 0"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: physician_order_cyclic_needs_more_info_back_to_submitted
        grounds:
          - state_machines.PhysicianOrder.SUBMITTED_to_NEEDS_MORE_INFO
          - state_machines.PhysicianOrder.NEEDS_MORE_INFO_to_SUBMITTED
          - state_machines.PhysicianOrder.SUBMITTED_to_APPROVED
          - entities.PhysicianOrder.fields.status
        distinguishing_aspect: |
          PhysicianOrder cycles SUBMITTED → NEEDS_MORE_INFO → SUBMITTED (a revision loop), then
          can still reach APPROVED — a non-linear cyclic shape, distinct from the parallel Order
          machine in the sibling instance.
        test_recipe:
          setup:
            - "PWN-restricted offering TST (in PWN_RESTRICTED_TEST_CODES). Patient P5 (CA, adult). Order placed -> SUBMITTED PhysicianOrder."
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "TST", display_name: "Testosterone", list_price_cents: 5000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_tst: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "p5@x.com", full_name: "P Five", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
              captures: { p5: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${p5}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${p5}"
              captures: { cart5: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cart5}", test_offering_id: "${off_tst}" }
              as: Patient
              as_user_id: "${p5}"
            - call: "GET /catalog/carts/${cart5}"
              as: Patient
              as_user_id: "${p5}"
              captures: { cart5_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cart5}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cart5_v}" }
              as: Patient
              as_user_id: "${p5}"
              captures: { order5: '$.data.id' }
            - call: "GET /catalog/order-lines?order_id=${order5}"
              as: CatalogAdmin
              captures: { ol5: '$.data[0].id' }
            - call: "GET /catalog/physician-orders?order_line_id=${ol5}"
              as: OrderingPhysician
              captures: { po5: '$.data[0].id' }
          trigger:
            - call: "POST /catalog/physician-orders/${po5}/decision"
              payload: { decision: "REQUEST_INFO" }
              as: OrderingPhysician
              captures: { po5_s1: '$.data.status' }
            - call: "POST /catalog/physician-orders/${po5}/resubmit"
              payload: { clinical_note: "added labs" }
              as: Patient
              as_user_id: "${p5}"
              captures: { po5_s2: '$.data.status' }
            - call: "POST /catalog/physician-orders/${po5}/decision"
              payload: { decision: "APPROVE" }
              as: OrderingPhysician
              captures: { po5_s3: '$.data.status' }
          assert:
            - "PhysicianOrder.${po5}.status after REQUEST_INFO == NEEDS_MORE_INFO"
            - "PhysicianOrder.${po5}.status after resubmit == SUBMITTED"
            - "PhysicianOrder.${po5}.status after APPROVE == APPROVED"

      - name: order_parallel_payment_and_fulfillment_axes_evolve_independently
        grounds:
          - state_machines.Order.payment_status=AUTH_PENDING_to_payment_status=AUTHORIZED
          - state_machines.Order.fulfillment_status=AWAITING_COLLECTION_to_fulfillment_status=IN_PROCESSING
          - state_machines.Order.fulfillment_status=IN_PROCESSING_to_fulfillment_status=COMPLETED
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Order carries two independent axes: payment_status reaches AUTHORIZED at placement and
          stays there while fulfillment_status advances AWAITING_COLLECTION → IN_PROCESSING →
          COMPLETED through collection/release — parallel dimensions on one entity (distinct from
          the cyclic PhysicianOrder machine).
        test_recipe:
          setup:
            - "Offering E @4000 (non-restricted). Patient P6. Single-line HOME_KIT order, collected, processed, released."
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "E", display_name: "Test E", list_price_cents: 4000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_e: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "p6@x.com", full_name: "P Six", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
              captures: { p6: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${p6}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${p6}"
              captures: { cart6: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cart6}", test_offering_id: "${off_e}" }
              as: Patient
              as_user_id: "${p6}"
            - call: "GET /catalog/carts/${cart6}"
              as: Patient
              as_user_id: "${p6}"
              captures: { cart6_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cart6}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cart6_v}" }
              as: Patient
              as_user_id: "${p6}"
              captures: { order6: '$.data.id', order6_pay0: '$.data.payment_status', order6_ful0: '$.data.fulfillment_status' }
            - call: "POST /catalog/home-kits"
              payload: { order_id: "${order6}", shipping_state_code: "CA" }
              as: Patient
              as_user_id: "${p6}"
            - call: "GET /catalog/order-lines?order_id=${order6}"
              as: CatalogAdmin
              captures: { ol6: '$.data[0].id' }
            - call: "POST /catalog/order-lines/${ol6}/collect"
              as: PhlebotomyTech
              captures: { spec6: '$.data.id' }
            - call: "GET /catalog/orders/${order6}"
              as: CatalogAdmin
              captures: { order6_ful_mid: '$.data.fulfillment_status', order6_pay_mid: '$.data.payment_status' }
            - call: "POST /catalog/specimens/${spec6}/process"
              payload: { analyzer_value: 5 }
              as: LabTech
              captures: { res6: '$.data.id' }
          trigger:
            - call: "POST /catalog/lab-results/${res6}/release"
              as: LabTech
            - call: "GET /catalog/orders/${order6}"
              as: CatalogAdmin
              captures: { order6_ful_end: '$.data.fulfillment_status', order6_pay_end: '$.data.payment_status' }
          assert:
            - "Order.${order6}.payment_status == AUTHORIZED at placement, mid, and end"
            - "Order.${order6}.fulfillment_status == AWAITING_COLLECTION at placement"
            - "Order.${order6}.fulfillment_status == IN_PROCESSING after collect"
            - "Order.${order6}.fulfillment_status == COMPLETED after release"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: physician_decline_cascades_orderline_reject_to_order_completion_depth3
        grounds:
          - state_machines.PhysicianOrder.SUBMITTED_to_DECLINED
          - state_machines.OrderLine.ORDERED_to_REJECTED
          - state_machines.Order.fulfillment_status=IN_PROCESSING_to_fulfillment_status=COMPLETED
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Depth-3 chain from a PhysicianOrder DECLINE: (1) PhysicianOrder → DECLINED mutates its
          OrderLine ORDERED → REJECTED; (2) that line rejection mutates Order.fulfillment_status
          (bubble); (3) because the order's only other line is already RESULTED, the order
          auto-advances to COMPLETED. Each hop is caused by the previous, not by the decline.
        test_recipe:
          setup:
            - "PWN-restricted offering TST2 and non-restricted offering F @4000. Patient P7 (CA adult)."
            - "Order with 2 lines (F, TST2). F is collected/processed/released (RESULTED). TST2 has a SUBMITTED PhysicianOrder."
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "F", display_name: "Test F", list_price_cents: 4000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_f: '$.data.id' }
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "TST2", display_name: "Restricted 2", list_price_cents: 5000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_tst2: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "p7@x.com", full_name: "P Seven", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
              captures: { p7: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${p7}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${p7}"
              captures: { cart7: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cart7}", test_offering_id: "${off_f}" }
              as: Patient
              as_user_id: "${p7}"
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cart7}", test_offering_id: "${off_tst2}" }
              as: Patient
              as_user_id: "${p7}"
            - call: "GET /catalog/carts/${cart7}"
              as: Patient
              as_user_id: "${p7}"
              captures: { cart7_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cart7}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cart7_v}" }
              as: Patient
              as_user_id: "${p7}"
              captures: { order7: '$.data.id' }
            - call: "POST /catalog/home-kits"
              payload: { order_id: "${order7}", shipping_state_code: "CA" }
              as: Patient
              as_user_id: "${p7}"
            - call: "GET /catalog/order-lines?order_id=${order7}"
              as: CatalogAdmin
              captures: { ol7_f: '$.data[0].id', ol7_tst2: '$.data[1].id' }
            - call: "POST /catalog/order-lines/${ol7_f}/collect"
              as: PhlebotomyTech
              captures: { spec7_f: '$.data.id' }
            - call: "POST /catalog/specimens/${spec7_f}/process"
              payload: { analyzer_value: 5 }
              as: LabTech
              captures: { res7_f: '$.data.id' }
            - call: "POST /catalog/lab-results/${res7_f}/release"
              as: LabTech
            - call: "GET /catalog/physician-orders?order_line_id=${ol7_tst2}"
              as: OrderingPhysician
              captures: { po7: '$.data[0].id' }
          trigger:
            - call: "POST /catalog/physician-orders/${po7}/decision"
              payload: { decision: "DECLINE" }
              as: OrderingPhysician
            - call: "GET /catalog/order-lines/${ol7_tst2}"
              as: CatalogAdmin
              captures: { ol7_tst2_status: '$.data.status' }
            - call: "GET /catalog/orders/${order7}"
              as: CatalogAdmin
              captures: { order7_ful: '$.data.fulfillment_status' }
          assert:
            - "OrderLine.${ol7_tst2}.status == REJECTED"
            - "Order.${order7}.fulfillment_status == COMPLETED"
            - "Order.${order7}.invoiced_total_cents == 4000"

      - name: result_release_cascades_line_resulted_to_invoice_recompute_depth2
        grounds:
          - state_machines.LabResult.PROCESSING_to_RELEASED
          - state_machines.OrderLine.COLLECTED_to_RESULTED
          - calculations.order_final_invoiced_total
          - entities.Order.fields.invoiced_total_cents
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (lab-result release, not a physician decline):
          (1) LabResult RELEASED marks its OrderLine COLLECTED → RESULTED; (2) that line resulting
          recomputes Order.invoiced_total_cents. The invoice change is caused by the line hop, not
          directly by the release call.
        test_recipe:
          setup:
            - "Offering G @4000. Patient P8. Single-line HOME_KIT order, collected, processed (PROCESSING)."
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "G", display_name: "Test G", list_price_cents: 4000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_g: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "p8@x.com", full_name: "P Eight", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
              captures: { p8: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${p8}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${p8}"
              captures: { cart8: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cart8}", test_offering_id: "${off_g}" }
              as: Patient
              as_user_id: "${p8}"
            - call: "GET /catalog/carts/${cart8}"
              as: Patient
              as_user_id: "${p8}"
              captures: { cart8_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cart8}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cart8_v}" }
              as: Patient
              as_user_id: "${p8}"
              captures: { order8: '$.data.id' }
            - call: "POST /catalog/home-kits"
              payload: { order_id: "${order8}", shipping_state_code: "CA" }
              as: Patient
              as_user_id: "${p8}"
            - call: "GET /catalog/order-lines?order_id=${order8}"
              as: CatalogAdmin
              captures: { ol8: '$.data[0].id' }
            - call: "POST /catalog/order-lines/${ol8}/collect"
              as: PhlebotomyTech
              captures: { spec8: '$.data.id' }
            - call: "GET /catalog/orders/${order8}"
              as: CatalogAdmin
              captures: { order8_inv_pre: '$.data.invoiced_total_cents' }
            - call: "POST /catalog/specimens/${spec8}/process"
              payload: { analyzer_value: 5 }
              as: LabTech
              captures: { res8: '$.data.id' }
          trigger:
            - call: "POST /catalog/lab-results/${res8}/release"
              as: LabTech
            - call: "GET /catalog/order-lines/${ol8}"
              as: CatalogAdmin
              captures: { ol8_status: '$.data.status' }
            - call: "GET /catalog/orders/${order8}"
              as: CatalogAdmin
              captures: { order8_inv_post: '$.data.invoiced_total_cents' }
          assert:
            - "Order.${order8}.invoiced_total_cents before release == 0"
            - "OrderLine.${ol8}.status == RESULTED"
            - "Order.${order8}.invoiced_total_cents after release == 4000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_release_critical_unack_state_wins
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_RESULT_NOT_RELEASABLE]
          - errors[ERR_CRITICAL_CALLBACK_REQUIRED]
        distinguishing_aspect: |
          Category pair state (priority 7, ERR_RESULT_NOT_RELEASABLE) vs business_safety
          (priority 8, ERR_CRITICAL_CALLBACK_REQUIRED): a release on an already-RELEASED result
          that was also CRITICAL fails the state check first → ERR_RESULT_NOT_RELEASABLE, not the
          critical-callback error.
        test_recipe:
          setup:
            - "Offering CR ref 70-100 critical_high 400. Patient P9 (consent true). Order: CR processed analyzer 50 (NORMAL), released RELEASED. Second order CR processed 500 (CRITICAL) then released after ack — but we target the FIRST released result for a double-release."
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "CR", display_name: "Critical Test", list_price_cents: 4000, specimen_type: "BLOOD", ref_low: 70, ref_high: 100, critical_high: 400 }
              as: CatalogAdmin
              captures: { off_cr: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "p9@x.com", full_name: "P Nine", date_of_birth: "1990-01-01", state_code: "CA", consent_share_results: true }
              as: CatalogAdmin
              captures: { p9: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${p9}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${p9}"
              captures: { cart9: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cart9}", test_offering_id: "${off_cr}" }
              as: Patient
              as_user_id: "${p9}"
            - call: "GET /catalog/carts/${cart9}"
              as: Patient
              as_user_id: "${p9}"
              captures: { cart9_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cart9}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cart9_v}" }
              as: Patient
              as_user_id: "${p9}"
              captures: { order9: '$.data.id' }
            - call: "POST /catalog/home-kits"
              payload: { order_id: "${order9}", shipping_state_code: "CA" }
              as: Patient
              as_user_id: "${p9}"
            - call: "GET /catalog/order-lines?order_id=${order9}"
              as: CatalogAdmin
              captures: { ol9: '$.data[0].id' }
            - call: "POST /catalog/order-lines/${ol9}/collect"
              as: PhlebotomyTech
              captures: { spec9: '$.data.id' }
            - call: "POST /catalog/specimens/${spec9}/process"
              payload: { analyzer_value: 50 }
              as: LabTech
              captures: { res9: '$.data.id' }
            - call: "POST /catalog/lab-results/${res9}/release"
              as: LabTech
          trigger:
            - call: "POST /catalog/lab-results/${res9}/release"
              as: LabTech
              captures: { err: '$.data.error_id' }
          assert:
            - "release on RELEASED result returns 409 ERR_RESULT_NOT_RELEASABLE"
            - "error_id != ERR_CRITICAL_CALLBACK_REQUIRED"

      - name: existence_vs_invalid_request_order_missing_cart_existence_wins
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Category pair existence (priority 4, ERR_NOT_FOUND) vs business_constraint (priority 5,
          ERR_INVALID_REQUEST): a checkout referencing a non-existent cart_id AND omitting the
          required expected_cart_version fails the existence check first → ERR_NOT_FOUND, not the
          malformed-body error.
        test_recipe:
          setup:
            - "Patient P10 exists; no cart created. Checkout names a random non-existent cart_id and omits expected_cart_version."
          setup_api_calls:
            - call: "POST /catalog/patients"
              payload: { email: "p10@x.com", full_name: "P Ten", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
              captures: { p10: '$.data.id' }
          trigger:
            - call: "POST /catalog/orders"
              payload: { cart_id: "00000000-0000-4000-8000-000000000000", fulfillment_mode: "HOME_KIT" }
              as: Patient
              as_user_id: "${p10}"
              captures: { err: '$.data.error_id' }
          assert:
            - "returns 404 ERR_NOT_FOUND"
            - "error_id != ERR_INVALID_REQUEST"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: platform_discount_tier1_at_exactly_20000_subtotal
        grounds:
          - calculations.cart_estimated_total
          - entities.Cart.fields.subtotal_cents
          - entities.Cart.fields.estimated_total_cents
        distinguishing_aspect: |
          Numeric-threshold boundary on the platform tier (>= vs >): a subtotal of exactly 20000
          triggers PLATFORM_TIER1_RATE 10% (estimated 18000), while 19999 stays at 0% (estimated
          19999). Reached via GET cart after adding a single 20000-cent line.
        test_recipe:
          setup:
            - "Offering Z20 @20000 (no repeat history). Patient P11. Cart with one Z20 line."
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "Z20", display_name: "Twenty K", list_price_cents: 20000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_z20: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "p11@x.com", full_name: "P Eleven", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
              captures: { p11: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${p11}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${p11}"
              captures: { cart11: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cart11}", test_offering_id: "${off_z20}" }
              as: Patient
              as_user_id: "${p11}"
          trigger:
            - call: "GET /catalog/carts/${cart11}"
              as: Patient
              as_user_id: "${p11}"
              captures: { c11_sub: '$.data.subtotal_cents', c11_tot: '$.data.estimated_total_cents' }
          assert:
            - "Cart.${cart11}.subtotal_cents == 20000"
            - "Cart.${cart11}.estimated_total_cents == 18000"

      - name: empty_cart_checkout_zero_line_count_boundary
        grounds:
          - validations[priority=19]
          - errors[ERR_EMPTY_CART]
          - entities.Cart.fields.line_count
          - state_machines.Order.payment_status=AUTH_PENDING_to_payment_status=AUTHORIZED
        distinguishing_aspect: |
          Empty-collection boundary on a different metric (line_count == 0) reached through a
          different endpoint (POST /catalog/orders): a cart with zero lines is rejected with
          ERR_EMPTY_CART rather than producing an order. Distinct from the numeric-threshold boundary.
        test_recipe:
          setup:
            - "Patient P12 with an OPEN cart that has zero lines (line_count == 0)."
          setup_api_calls:
            - call: "POST /catalog/patients"
              payload: { email: "p12@x.com", full_name: "P Twelve", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
              captures: { p12: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${p12}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${p12}"
              captures: { cart12: '$.data.id', cart12_v: '$.data.version' }
          trigger:
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cart12}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cart12_v}" }
              as: Patient
              as_user_id: "${p12}"
              captures: { err: '$.data.error_id' }
          assert:
            - "returns 409 ERR_EMPTY_CART"
            - "Cart.${cart12}.line_count == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: orderline_collect_requires_physician_order_approved
        grounds:
          - state_machines.OrderLine.ORDERED_to_COLLECTED
          - state_machines.PhysicianOrder.SUBMITTED_to_APPROVED
          - validations[priority=11]
          - errors[ERR_PHYSICIAN_ORDER_REQUIRED]
        distinguishing_aspect: |
          Entity pair OrderLine→PhysicianOrder: a PWN-restricted OrderLine cannot transition
          ORDERED→COLLECTED while its PhysicianOrder is SUBMITTED (ERR_PHYSICIAN_ORDER_REQUIRED);
          the same collect succeeds only once the PhysicianOrder reaches APPROVED.
        test_recipe:
          setup:
            - "PWN-restricted offering TST3. Patient P13 (CA adult). HOME_KIT order; PhysicianOrder still SUBMITTED."
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "TST3", display_name: "Restricted 3", list_price_cents: 5000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_tst3: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "p13@x.com", full_name: "P Thirteen", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
