            offset_days: 5
            mandatory: false
          required_doc_types: []
        as: SystemAdmin
        captures:
          tmpl_id: $.data.id
      - call: POST /tc/checklist-templates/${tmpl_id}/publish
        payload: {}
        as: SystemAdmin
      - call: POST /tc/files
        payload:
          billing_model: PER_FILE
          state_code: TX
          contract_type: LISTING_ONLY
          property_address: 1 Main St
          effective_date: '2026-08-03'
          closing_date: '2026-08-10'
          list_price_cents: 45000000
          seller_agent_id: ${seller1}
          inspection_offset_days: 7
          appraisal_offset_days: 14
        as: Coordinator
        as_user_id: ${coord1}
        captures:
          file9: $.data.id
      - call: POST /tc/files
        payload:
          billing_model: PER_FILE
          state_code: TX
          contract_type: LISTING_ONLY
          property_address: 2 Oak Ave
          effective_date: '2026-08-03'
