# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3487_election_night_vote_count_collection_race_calling
# Breadth probe over §1.1–§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: event_create_returns_posture_setup_and_envelope_meta
        claim_type: Creation
        grounds:
          - entities.ElectionEvent
          - response_envelope
          - endpoints.POST_/election-events
        distinguishing_aspect: "A minimal event POST returns 201 with posture SETUP (never client-supplied), version 1, system id/created_at/updated_at, the stringer_selection_mode default CAREER, and the fixed envelope meta fields."
        test_recipe:
          setup: ["Logical clock at 2026-10-15T00:00:00Z; empty database."]
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T00:00:00Z" }
              as: ElectionOpsAdmin
          trigger:
            - &k_ev
              call: "POST /election-events"
              payload: { event_name: "2026 General Election", event_date: "2026-11-03", event_type: "GENERAL", total_stringer_hour_budget: 400 }
              as: ElectionOpsAdmin
              captures: { ev: $.data.id }
          assert:
            - "response status 201, response_type object, meta.api_request_id and meta.api_request_timestamp present"
            - "ElectionEvent.${ev}.posture == SETUP and version == 1"
            - "ElectionEvent.${ev}.stringer_selection_mode == CAREER (default applied)"
            - "ElectionEvent.${ev}.created_at == 2026-10-15T00:00:00Z (logical clock stamp, not wall clock)"

      - name: contest_created_with_zeroed_computed_fields
        claim_type: Computed Fields
        grounds:
          - entities.Contest.fields.reported_precincts
          - entities.Contest.fields.outstanding_estimate
          - entities.Contest.fields.margin_pct
          - endpoints.POST_/election-events/{id}/contests
        distinguishing_aspect: "A fresh contest reports tabulation AWAITING / call UNCALLED, null called_candidate_id, and zeroed reported_precincts / total_votes / margin_pct / outstanding_estimate — all computed, none settable by the client."
        test_recipe:
          setup: ["Clock set; one event in SETUP."]
          setup_api_calls:
            - *k_clock
            - *k_ev
          trigger:
            - &k_cst
              call: "POST /election-events/${ev}/contests"
              payload: { office_name: "US Senator", state_code: "CA", contest_type: "FEDERAL_SENATE" }
              as: ElectionOpsAdmin
              captures: { cst: $.data.id }
          assert:
            - "Contest.${cst}.seats == 1 (default)"
            - "Contest.${cst}.tabulation_status == AWAITING and call_status == UNCALLED"
            - "Contest.${cst}.reported_precincts == 0 and total_votes == 0 and margin_pct == 0.0 and outstanding_estimate == 0"
            - "Contest.${cst}.called_candidate_id is null"

      - name: county_create_applies_nullable_defaults
        claim_type: Defaults
        grounds:
          - entities.County.fields.survey_turnout_estimate
          - entities.County.fields.historical_dem_share
          - entities.County.fields.status
          - endpoints.POST_/election-events/{id}/counties
        distinguishing_aspect: "Omitting both optional baselines stores nulls (not zeros), reported_precincts starts 0, and county status computes to PENDING."
        test_recipe:
          setup: ["Clock set; one event in SETUP."]
          setup_api_calls:
            - *k_clock
            - *k_ev
          trigger:
            - &k_cty_a
              call: "POST /election-events/${ev}/counties"
              payload: { county_fips: "06001", county_name: "Alameda", state_code: "CA", expected_precincts: 10, expected_vote_total: 10000, survey_turnout_estimate: 8000, historical_dem_share: 0.60 }
              as: ElectionOpsAdmin
              captures: { cty_a: $.data.id }
            - &k_cty_b
              call: "POST /election-events/${ev}/counties"
              payload: { county_fips: "06013", county_name: "Contra Costa", state_code: "CA", expected_precincts: 5, expected_vote_total: 4000 }
              as: ElectionOpsAdmin
              captures: { cty_b: $.data.id }
          assert:
            - "County.${cty_a}.survey_turnout_estimate == 8000 and historical_dem_share == 0.60"
            - "County.${cty_b}.survey_turnout_estimate is null and historical_dem_share is null"
            - "County.${cty_b}.status == PENDING and reported_precincts == 0"

      - name: county_create_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=16]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting expected_precincts from a county POST fails 400 ERR_INVALID_REQUEST and stores nothing."
        test_recipe:
          setup: ["Clock set; one event in SETUP."]
          setup_api_calls:
            - *k_clock
            - *k_ev
          trigger:
            - call: "POST /election-events/${ev}/counties"
              payload: { county_fips: "06041", county_name: "Marin", state_code: "CA", expected_vote_total: 3000 }
              as: ElectionOpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "GET /election-events/${ev}/counties returns total_count == 0"

      - name: contest_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_CONTEST_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "A well-formed but unknown contest UUID resolves to 404 ERR_CONTEST_NOT_FOUND, not a generic 400."
        test_recipe:
          setup: ["Clock set; one event exists."]
          setup_api_calls:
            - *k_clock
            - *k_ev
          trigger:
            - call: "GET /contests/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ElectionOpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CONTEST_NOT_FOUND and http status 404"

      - name: stringer_create_initializes_counters_and_both_scores
        claim_type: Creation
        grounds:
          - entities.Stringer
          - calculations.stringer_reliability_score
          - endpoints.POST_/stringers
        distinguishing_aspect: "A new stringer carries zeroed no_show/accepted/voided counters and both reliability variants pinned at 100."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - &k_str
              call: "POST /stringers"
              payload: { stringer_name: "Sally Stringer", home_state: "CA" }
              as: StringerCoordinator
              captures: { str_s: $.data.id }
          assert:
            - "Stringer.${str_s}.no_show_count == 0 and accepted_report_count == 0 and voided_report_count == 0"
            - "Stringer.${str_s}.reliability_career == 100 and reliability_recent_form == 100"
            - "Stringer.${str_s}.version == 1"

      - name: customer_create_and_self_read_roundtrip
        claim_type: Retrieval
        grounds:
          - entities.MediaCustomer
          - endpoints.GET_/media-customers/{id}
          - roles.MediaCustomer
        distinguishing_aspect: "A BASIC customer licensed for CA reads its own resource with X-User-ID equal to the customer id and gets the stored tier and licensed_states verbatim."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - &k_cust_b
              call: "POST /media-customers"
              payload: { customer_name: "WireLite", license_tier: "BASIC", licensed_states: ["CA"] }
              as: ElectionOpsAdmin
              captures: { cust_b: $.data.id }
            - call: "GET /media-customers/${cust_b}"
              payload: {}
              as: MediaCustomer
              as_user_id: "${cust_b}"
          assert:
            - "the self-read returns 200 with license_tier == BASIC and licensed_states == [\"CA\"]"

      - name: contests_list_paginates_total_count_and_has_more
        claim_type: Listing
        grounds:
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - endpoints.GET_/election-events/{id}/contests
        distinguishing_aspect: "With two contests, limit=1 yields total_count 2 and has_more true; offset=1 yields the remaining row with has_more false — total_count spans the filtered set, not the page."
        test_recipe:
          setup: ["Clock set; one event with two contests."]
          setup_api_calls:
            - *k_clock
            - *k_ev
            - *k_cst
            - call: "POST /election-events/${ev}/contests"
              payload: { office_name: "Governor", state_code: "CA", contest_type: "STATE", seats: 1 }
              as: ElectionOpsAdmin
              captures: { cst_g: $.data.id }
          trigger:
            - call: "GET /election-events/${ev}/contests"
              payload: { limit: 1, offset: 0 }
              as: ElectionOpsAdmin
            - call: "GET /election-events/${ev}/contests"
              payload: { limit: 1, offset: 1 }
              as: ElectionOpsAdmin
          assert:
            - "page 1: response_type array, 1 row, total_count == 2, has_more == true"
            - "page 2: 1 row, total_count == 2, has_more == false"
            - "the two pages together contain exactly ${cst} and ${cst_g}"

      - name: county_link_is_immutable_without_version
        claim_type: Immutability
        grounds:
          - entities.ContestCounty
          - endpoints.POST_/contests/{id}/county-links
        distinguishing_aspect: "ContestCounty carries common_fields: false — the response has id and created_at but no version and no updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["Clock set; event with one county and one contest."]
          setup_api_calls:
            - *k_clock
            - *k_ev
            - *k_cty_a
            - *k_cst
          trigger:
            - &k_lnk_a
              call: "POST /contests/${cst}/county-links"
              payload: { county_id: "${cty_a}" }
              as: ElectionOpsAdmin
              captures: { lnk_a: $.data.id }
          assert:
            - "the 201 response carries id and created_at"
            - "the response has no version field and no updated_at field"
            - "ContestCounty.${lnk_a}.contest_id == ${cst} and county_id == ${cty_a}"

      - name: feed_create_defaults_priority_tier_secondary
        claim_type: Defaults
        grounds:
          - entities.FeedSource.fields.priority_tier
          - endpoints.POST_/election-events/{id}/feed-sources
        distinguishing_aspect: "Omitting priority_tier stores SECONDARY, and the feed is listable under its event."
        test_recipe:
          setup: ["Clock set; one event."]
          setup_api_calls:
            - *k_clock
            - *k_ev
          trigger:
            - &k_feed
              call: "POST /election-events/${ev}/feed-sources"
              payload: { feed_name: "StateWire CA", state_codes: ["CA"] }
              as: ElectionOpsAdmin
              captures: { feed: $.data.id }
          assert:
            - "FeedSource.${feed}.priority_tier == SECONDARY (default)"
            - "GET /election-events/${ev}/feed-sources contains exactly ${feed}"

      - name: vote_report_computed_fields_derived_at_intake
        claim_type: Computed Fields
        grounds:
          - entities.VoteReport.fields.reported_total
          - entities.VoteReport.fields.deviation_ratio
          - entities.VoteReport.fields.swing_deviation
          - calculations.qc_deviation_check
        distinguishing_aspect: "The intake response itself carries computed reported_total 7000, deviation_ratio 0.3, swing_deviation 0.028571 and status RECEIVED — the client supplies only raw precinct/vote rows."
        test_recipe:
          setup:
            - "Standard universe (Alameda 10p/10000/survey 8000/hist 0.60, Contra Costa 5p/4000), contest US Senator with candidates Wanda (DEM) and Tom (REP), feed StateWire CA, posture LIVE at 2026-11-03T13:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_ev
            - *k_cty_a
            - *k_cty_b
            - *k_cst
            - *k_lnk_a
            - &k_lnk_b
              call: "POST /contests/${cst}/county-links"
              payload: { county_id: "${cty_b}" }
              as: ElectionOpsAdmin
            - &k_cw
              call: "POST /contests/${cst}/candidates"
              payload: { candidate_name: "Wanda Wynn", party: "DEM" }
              as: ElectionOpsAdmin
              captures: { cand_w: $.data.id }
            - &k_ct
              call: "POST /contests/${cst}/candidates"
              payload: { candidate_name: "Tom Traylor", party: "REP" }
              as: ElectionOpsAdmin
              captures: { cand_t: $.data.id }
            - *k_feed
            - &k_lock
              call: "POST /election-events/${ev}/posture-transitions"
              payload: { target_posture: "CANDIDATES_LOCKED" }
              as: ElectionOpsAdmin
            - &k_eday
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-03T13:00:00Z" }
              as: ElectionOpsAdmin
            - &k_live
              call: "POST /election-events/${ev}/posture-transitions"
              payload: { target_posture: "LIVE" }
              as: ElectionOpsAdmin
            - &k_cv
              call: "GET /contests/${cst}"
              payload: {}
              as: ElectionOpsAdmin
              captures: { cv: $.data.version }
          trigger:
            - &k_rep_a
              call: "POST /contests/${cst}/vote-reports"
              payload: { county_id: "${cty_a}", source: "FEED", precincts_reporting: 5, candidate_votes: [{ candidate_id: "${cand_w}", votes: 4000 }, { candidate_id: "${cand_t}", votes: 3000 }], expected_contest_version: "${cv}" }
              as: FeedOperator
              captures: { rep_a: $.data.id }
          assert:
            - "VoteReport.${rep_a}.reported_total == 7000"
            - "VoteReport.${rep_a}.deviation_ratio == 0.3 (|7000-10000|/10000)"
            - "VoteReport.${rep_a}.swing_deviation == 0.028571 (|4000/7000 - 0.60| at 6dp)"
            - "VoteReport.${rep_a}.status == RECEIVED (both QC ratios within thresholds)"
            - "Contest.${cst}.version advanced by 1 from the pre-submit read"

      - name: duplicate_county_fips_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=17]
          - errors[ERR_DUPLICATE_COUNTY]
        distinguishing_aspect: "A second county carrying FIPS 06001 in the same event fails 409 ERR_DUPLICATE_COUNTY; the same FIPS in a different event would be legal."
        test_recipe:
          setup: ["Clock set; event with Alameda 06001 already registered."]
          setup_api_calls:
            - *k_clock
            - *k_ev
            - *k_cty_a
          trigger:
            - call: "POST /election-events/${ev}/counties"
              payload: { county_fips: "06001", county_name: "Alameda Clone", state_code: "CA", expected_precincts: 3, expected_vote_total: 3000 }
              as: ElectionOpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_COUNTY"
            - "GET /election-events/${ev}/counties total_count == 1"

      - name: duplicate_candidate_name_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=17]
          - errors[ERR_DUPLICATE_CANDIDATE]
        distinguishing_aspect: "candidate_name is unique per contest: the second 'Wanda Wynn' POST fails ERR_DUPLICATE_CANDIDATE."
        test_recipe:
          setup: ["Clock set; event with contest holding Wanda Wynn."]
          setup_api_calls:
            - *k_clock
            - *k_ev
            - *k_cst
            - *k_cw
          trigger:
            - call: "POST /contests/${cst}/candidates"
              payload: { candidate_name: "Wanda Wynn", party: "REP" }
              as: ElectionOpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_CANDIDATE (the party difference does not rescue the duplicate name)"

      - name: duplicate_feed_name_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=17]
          - errors[ERR_DUPLICATE_FEED]
        distinguishing_aspect: "feed_name is unique per event: re-registering StateWire CA fails ERR_DUPLICATE_FEED."
        test_recipe:
          setup: ["Clock set; event with feed StateWire CA."]
          setup_api_calls:
            - *k_clock
            - *k_ev
            - *k_feed
          trigger:
            - call: "POST /election-events/${ev}/feed-sources"
              payload: { feed_name: "StateWire CA", state_codes: ["NV"] }
              as: ElectionOpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_FEED"

      - name: duplicate_county_link_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=17]
          - errors[ERR_DUPLICATE_COUNTY_LINK]
        distinguishing_aspect: "Linking the same county to the same contest twice fails ERR_DUPLICATE_COUNTY_LINK and the link list still holds exactly one row."
        test_recipe:
          setup: ["Clock set; event with county, contest, and the county already linked."]
          setup_api_calls:
            - *k_clock
            - *k_ev
            - *k_cty_a
            - *k_cst
            - *k_lnk_a
          trigger:
            - call: "POST /contests/${cst}/county-links"
              payload: { county_id: "${cty_a}" }
              as: ElectionOpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_COUNTY_LINK"
            - "GET /contests/${cst}/county-links total_count == 1"

      - name: duplicate_invoice_period_rejected
        claim_type: Type Constraints
        grounds:
          - calculations.media_invoice_total
          - errors[ERR_DUPLICATE_INVOICE]
        distinguishing_aspect: "The (customer_id, period) pair is unique: a second POST for 2026-11 fails ERR_DUPLICATE_INVOICE while the first invoice stands with delivery_count 0 on an empty month."
        test_recipe:
          setup: ["Clock set; BASIC customer WireLite exists; no deliveries."]
          setup_api_calls:
            - *k_clock
            - *k_cust_b
            - call: "POST /media-customers/${cust_b}/invoices"
              payload: { period: "2026-11" }
              as: ElectionOpsAdmin
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /media-customers/${cust_b}/invoices"
              payload: { period: "2026-11" }
              as: ElectionOpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_INVOICE"
            - "MediaInvoice.${inv}.delivery_count == 0 and total_fee_cents == 0 (empty period is a legal invoice)"

  - section: state_machines
    instances:
      - name: posture_happy_path_setup_to_archived
        claim_type: Valid Transition
        grounds:
          - state_machines.ElectionEvent
          - endpoints.POST_/election-events/{id}/posture-transitions
        distinguishing_aspect: "The full forward ladder SETUP -> CANDIDATES_LOCKED -> LIVE -> TABULATION -> CERTIFICATION -> ARCHIVED traverses cleanly when each gate's precondition is met, ending in the terminal posture."
        test_recipe:
          setup:
            - "Standard universe fully built; both counties fully reported and accepted (Alameda p10 W6000/T4000, Contra Costa p5 W2200/T1800) so the contest is COMPLETE."
          setup_api_calls:
            - *k_clock
            - *k_ev
            - *k_cty_a
            - *k_cty_b
            - *k_cst
            - *k_lnk_a
            - *k_lnk_b
            - *k_cw
            - *k_ct
            - *k_feed
            - *k_lock
            - *k_eday
            - *k_live
            - *k_cv
            - call: "POST /contests/${cst}/vote-reports"
              payload: { county_id: "${cty_a}", source: "FEED", precincts_reporting: 10, candidate_votes: [{ candidate_id: "${cand_w}", votes: 6000 }, { candidate_id: "${cand_t}", votes: 4000 }], expected_contest_version: "${cv}" }
              as: FeedOperator
              captures: { rep_a: $.data.id }
            - call: "POST /vote-reports/${rep_a}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: TabulationClerk
            - call: "GET /contests/${cst}"
              payload: {}
              as: ElectionOpsAdmin
              captures: { cv2: $.data.version }
            - call: "POST /contests/${cst}/vote-reports"
              payload: { county_id: "${cty_b}", source: "FEED", precincts_reporting: 5, candidate_votes: [{ candidate_id: "${cand_w}", votes: 2200 }, { candidate_id: "${cand_t}", votes: 1800 }], expected_contest_version: "${cv2}" }
              as: FeedOperator
              captures: { rep_b: $.data.id }
            - call: "POST /vote-reports/${rep_b}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: TabulationClerk
            - &k_tab
              call: "POST /election-events/${ev}/posture-transitions"
              payload: { target_posture: "TABULATION" }
              as: ElectionOpsAdmin
          trigger:
            - call: "POST /election-events/${ev}/posture-transitions"
              payload: { target_posture: "CERTIFICATION" }
              as: ElectionOpsAdmin
            - call: "POST /election-events/${ev}/posture-transitions"
              payload: { target_posture: "ARCHIVED" }
              as: ElectionOpsAdmin
          assert:
            - "ElectionEvent.${ev}.posture == ARCHIVED (terminal)"
            - "Contest.${cst}.tabulation_status == COMPLETE throughout the posture ladder"

      - name: posture_illegal_jump_setup_to_live_returns_invalid_state
        claim_type: Invalid Transition
        grounds:
          - state_machines.ElectionEvent
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "SETUP -> LIVE skips CANDIDATES_LOCKED and is not a declared transition: ERR_INVALID_STATE, posture unchanged."
        test_recipe:
          setup: ["Clock set; event freshly created in SETUP."]
          setup_api_calls:
            - *k_clock
            - *k_ev
          trigger:
            - call: "POST /election-events/${ev}/posture-transitions"
              payload: { target_posture: "LIVE" }
              as: ElectionOpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "ElectionEvent.${ev}.posture == SETUP"

      - name: posture_lock_blocked_until_candidates_and_links_exist
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ElectionEvent.SETUP_to_CANDIDATES_LOCKED
        distinguishing_aspect: "A contest holding only one candidate fails the >= 2 candidates lock precondition: ERR_INVALID_STATE and posture stays SETUP; adding the second candidate plus a county link unlocks the transition."
        test_recipe:
          setup: ["Clock set; event with one county, one contest, one candidate."]
          setup_api_calls:
            - *k_clock
            - *k_ev
            - *k_cty_a
            - *k_cst
            - *k_cw
          trigger:
            - call: "POST /election-events/${ev}/posture-transitions"
              payload: { target_posture: "CANDIDATES_LOCKED" }
              as: ElectionOpsAdmin
              captures: { err: $.data.error_id }
            - *k_lnk_a
            - *k_ct
            - call: "POST /election-events/${ev}/posture-transitions"
              payload: { target_posture: "CANDIDATES_LOCKED" }
              as: ElectionOpsAdmin
          assert:
            - "first attempt: err == ERR_INVALID_STATE"
            - "second attempt succeeds and posture == CANDIDATES_LOCKED"

      - name: primary_event_lock_requires_approved_coverage
        claim_type: Cross-entity Precondition
        grounds:
          - state_machines.ElectionEvent.SETUP_to_CANDIDATES_LOCKED
          - state_machines.CoverageDecision.PROPOSED_to_APPROVED
        distinguishing_aspect: "Guarded transition: a PRIMARY event refuses CANDIDATES_LOCKED while its contest lacks an APPROVED or FUNDED CoverageDecision; a PROPOSED one is not enough — only after the admin APPROVE does the lock succeed."
        test_recipe:
          setup: ["Clock set; PRIMARY event for 2026-06-02 with county, contest, link, two candidates, and a PROPOSED coverage decision."]
          setup_api_calls:
            - *k_clock
            - call: "POST /election-events"
              payload: { event_name: "2026 Primary CA", event_date: "2026-06-02", event_type: "PRIMARY", total_stringer_hour_budget: 100 }
              as: ElectionOpsAdmin
              captures: { evp: $.data.id }
            - call: "POST /election-events/${evp}/counties"
              payload: { county_fips: "06001", county_name: "Alameda", state_code: "CA", expected_precincts: 10, expected_vote_total: 10000 }
              as: ElectionOpsAdmin
              captures: { cty_p: $.data.id }
            - call: "POST /election-events/${evp}/contests"
              payload: { office_name: "US Senator", state_code: "CA", contest_type: "FEDERAL_SENATE", seats: 1 }
              as: ElectionOpsAdmin
              captures: { cst_p: $.data.id }
