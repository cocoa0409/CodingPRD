# =============================================================================
# SCAFFOLD — task_3339_agent_desk_fee_model_commission_retention_administration
# Agent Desk Fee Model & Commission Retention Administration (RE/MAX-style)
# =============================================================================

scenario: |
  Agent Desk Fee Model & Commission Retention Administration (RE/MAX): agent
  agreements where the agent pays a monthly management fee and office overhead
  share in exchange for retaining most commission, office franchise economics
  dependent on agent count rather than transaction share, agent onboarding with
  fee schedules, technology subscriptions and marketing costs disclosed upfront,
  commission disbursement at closing with fee deduction, escrow and
  reconciliation, agent departure with fee proration and pending transaction
  handling, broker supervision responsibilities that persist regardless of the
  compensation model, franchisee recruitment competition and agent retention
  analysis, referral network fees between offices across markets.

domain_name: agent-desk-fee-model
api_prefix: /

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - scheduled_actions
  entity_topology: hybrid          # Office tree + flat Transaction / ReferralAgreement
  state_machine_shape: cyclic      # Offer<->Countered loop; Transaction re-list loop; parallel CD review ladder
  relationship_patterns:
    - one_to_many                  # Office -> Agent, Invoice -> InvoiceLine, Transaction -> ClosingStatementLine
    - self_referential             # ReferralAgreement.replaces_agreement_id
    - cross_aggregate              # FeeAssignment -> FeeSchedule; ClosingStatementLine -> InvoiceLine
    - many_to_many                 # Transaction parties implicitly via Transaction
  role_model: peer_roles           # BrokerOfRecord / ManagingBroker / Agent / FranchiseeOwner / TrustAccountant / ComplianceAuditor
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Office
    parent: null
    common_fields: true
    fields:
      - name: office_name
        type: string
        source: input
        description: "Franchise office legal name"
      - name: market_code
        type: string
        source: input
        description: "Market identifier (e.g. DEN, PHX) used for referral network grouping"
      - name: status
        type: enum
        source: system
        description: "ACTIVE | SUSPENDED | CLOSED — lifecycle of the franchise office; computed transition target of close_office"
      - name: recruiting_target_agents
        type: integer
        source: input
        description: "Franchisee recruitment target headcount; economics scale with agent count, not transaction share"
        constraints: "must be >= 1"
      - name: active_agent_count
        type: integer
        source: computed
        description: "Count of Agents with status == ACTIVE; recomputed on every Agent activation, termination, and on office close"
      - name: trust_balance_cents
        type: integer
        source: computed
        description: "Escrow trust balance = SUM(CommissionEntry where status IN {ESCROW_HELD, OFFICE_FEE_ACCRUED, DEPARTURE_HOLD}) + SUM(Invoice where status IN {ISSUED, PARTIALLY_PAID, COLLECTIONS} of amount_due_cents)"
      - name: closed_at
        type: datetime
        source: system
        description: "Set by close_office; null while ACTIVE/SUSPENDED"
        default: null

  - name: FeeSchedule
    parent: null
    common_fields: true
    fields:
      - name: schedule_name
        type: string
        source: input
        description: "Human-readable name, e.g. '95/5 Desk Plan'"
      - name: desk_fee_cents
        type: integer
        source: input
        description: "Monthly management fee charged to the agent, in cents"
        constraints: "must be >= 0"
      - name: overhead_share_bps
        type: integer
        source: input
        description: "Office overhead share in basis points (100 bps = 1%), applied to GCI at statement time"
        constraints: "0 <= overhead_share_bps <= 10000"
      - name: retention_bps
        type: integer
        source: input
        description: "Agent commission retention in basis points; office keeps (10000 - retention_bps)"
        constraints: "0 <= retention_bps <= 10000"
      - name: referral_fee_bps
        type: integer
        source: input
        description: "Cross-office referral fee in basis points, deducted from GCI before agent/office split"
        constraints: "0 <= referral_fee_bps <= 5000"
      - name: tech_subscription_monthly_cents
        type: integer
        source: input
        description: "Monthly technology subscription cost disclosed upfront at onboarding"
        constraints: "must be >= 0"
      - name: marketing_monthly_cents
        type: integer
        source: input
        description: "Monthly marketing cost disclosed upfront at onboarding"
        constraints: "must be >= 0"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the effective window [effective_from, effective_to)"
      - name: effective_to
        type: datetime
        source: input
        description: "Exclusive end of the effective window; must equal null-sentinel '9999-12-31T00:00:00Z' for open-ended schedules; a new window must start exactly at the predecessor's effective_to (adjacent, gap=0 allowed)"
      - name: status
        type: enum
        source: system
        description: "DRAFT | ACTIVE | ARCHIVED — a schedule becomes ACTIVE when its window contains the logical clock; ARCHIVED when superseded or window passed"

  - name: Agent
    parent: Office
    common_fields: true
    fields:
      - name: office_id
        type: string
        source: system
        description: "FK -> Office.id; owning office"
      - name: full_name
        type: string
        source: input
        description: "Agent legal name"
      - name: email
        type: string
        source: input
        description: "Agent contact email"
      - name: license_number
        type: string
        source: input
        description: "State real-estate license number"
        constraints: "unique across the whole system; ERR_DUPLICATE_LICENSE on conflict"
      - name: status
        type: enum
        source: system
        description: "PENDING_ONBOARDING | ACTIVE | TERMINATION_PENDING | TERMINATED"
      - name: onboarded_at
        type: datetime
        source: system
        description: "Set when Agent transitions PENDING_ONBOARDING -> ACTIVE"
        default: null
      - name: termination_requested_at
        type: datetime
        source: system
        description: "Set when termination is initiated; basis for proration"
        default: null
      - name: terminated_at
        type: datetime
        source: system
        description: "Set on completion of departure processing"
        default: null
      - name: supervision_cadence_days
        type: integer
        source: computed
        default: 30
        description: "Broker supervision review interval in days; 30 for ACTIVE agents, 7 for TERMINATION_PENDING; persists regardless of compensation model"
      - name: unearned_advance_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Outstanding advanced commission the agent owes the office; debited by advance_commission, credited at closing and by return_advance"

  - name: FeeAssignment
    parent: Agent
    common_fields: true
    fields:
      - name: agent_id
        type: string
        source: system
        description: "FK -> Agent.id; assignee"
      - name: fee_schedule_id
        type: string
        source: input
        description: "FK -> FeeSchedule.id; the schedule this assignment binds"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive window start [effective_from, effective_to)"
      - name: effective_to
        type: datetime
        source: input
        description: "Exclusive window end; must be > effective_from"
      - name: expected_agent_version
        type: integer
        source: input
        description: "OCC field naming the Agent.version the client last observed; mismatched -> ERR_STALE_VERSION"
      - name: status
        type: enum
        source: system
        description: "PROPOSED | ACCEPTED | REJECTED | SUPERSEDED | CANCELLED"

  - name: Offer
    parent: Office
    common_fields: true
    fields:
      - name: office_id
        type: string
        source: system
        description: "FK -> Office.id; listing office that received the offer"
      - name: listing_reference
        type: string
        source: input
        description: "External listing identifier"
      - name: buyer_name
        type: string
        source: input
        description: "Buyer legal name"
      - name: offer_price_cents
        type: integer
        source: input
        description: "Offer amount in cents"
        constraints: "must be > 0"
      - name: offer_round
        type: integer
        source: system
        default: 1
        description: "Negotiation round; increments on every counter (COUNTERED -> OFFERED cycle)"
      - name: status
        type: enum
        source: system
        description: "OFFERED | COUNTERED | ACCEPTED | REJECTED | EXPIRED | WITHDRAWN"

  - name: Transaction
    parent: Office
    common_fields: true
    fields:
      - name: office_id
        type: string
        source: system
        description: "FK -> Office.id; office responsible for the deal"
      - name: listing_agent_id
        type: string
        source: input
        description: "FK -> Agent.id; listing-side agent"
      - name: selling_agent_id
        type: string
        source: input
        description: "FK -> Agent.id; selling-side agent; may equal listing_agent_id"
      - name: offer_id
        type: string
        source: input
        description: "FK -> Offer.id; the accepted offer this transaction originates from"
      - name: sale_price_cents
        type: integer
        source: input
        description: "Contracted sale price in cents (immutable snapshot of Offer.offer_price_cents at acceptance)"
        constraints: "must be > 0"
      - name: gross_commission_cents
        type: integer
        source: input
        description: "Gross commission income (GCI) in cents owed to the office at closing"
        constraints: "must be > 0"
      - name: status
        type: enum
        source: system
        description: "LISTED | UNDER_CONTRACT | PENDING_CLOSE | CLOSED | FELL_THROUGH | RELISTED"
      - name: closed_at
        type: datetime
        source: system
        description: "Set when Transaction -> CLOSED; null otherwise"
        default: null

  - name: CommissionDisbursementAuthorization
    parent: Transaction
    common_fields: true
    fields:
      - name: transaction_id
        type: string
        source: system
        description: "FK -> Transaction.id; the deal this CDA governs"
      - name: authorizing_broker_id
        type: string
        source: system
        description: "Agent.id of the ManagingBroker or BrokerOfRecord who issued the CDA; supervision duty persists regardless of compensation model"
      - name: review_ladder
        type: array
        source: input
        description: "Ordered list of reviewer role names; exactly [\"COMPLIANCE_REVIEW\", \"TRUST_REVIEW\", \"BROKER_SIGNOFF\"]; the CDA walks the ladder one rung per review_cda call, cycling back to COMPLIANCE_REVIEW whenever a REJECT is recorded"
      - name: current_rung
        type: integer
        source: system
        default: 0
        description: "Index into review_ladder of the rung currently awaiting review"
      - name: status
        type: enum
        source: system
        description: "DRAFT | IN_REVIEW | APPROVED | REJECTED | SUPERSEDED"

  - name: ClosingStatementLine
    parent: Transaction
    common_fields: true
    fields:
      - name: transaction_id
        type: string
        source: system
        description: "FK -> Transaction.id; parent deal"
      - name: line_type
        type: enum
        source: system
        description: "GCI | REFERRAL_FEE | AGENT_RETENTION | OFFICE_SPLIT | OVERHEAD_SHARE | ADVANCE_RECOVERY"
      - name: agent_id
        type: string
        source: system
        description: "FK -> Agent.id; nullable — null on office-side lines (REFERRAL_FEE, OFFICE_SPLIT)"
        default: null
      - name: amount_cents
        type: integer
        source: computed
        description: "Signed line amount in cents computed by closing_statement; sum over all lines of a CLOSED statement == 0"
      - name: applied_invoice_line_id
        type: string
        source: system
        description: "FK -> InvoiceLine.id; nullable — set when this closing line satisfies (partially) an outstanding invoice line"
        default: null
      - name: variant
        type: enum
        source: system
        description: "STANDARD | FORMER_AGENT — which closing-statement variant produced this line"
      - name: status
        type: enum
        source: system
        description: "PROVISIONAL | FINAL | VOIDED"

  - name: Invoice
    parent: Office
    common_fields: true
    fields:
      - name: office_id
        type: string
        source: system
        description: "FK -> Office.id; billing office"
      - name: agent_id
        type: string
        source: system
        description: "FK -> Agent.id; billed agent"
      - name: billing_month
        type: string
        source: input
        description: "Billing period as YYYY-MM; generate_invoices writes it for AUTO invoices; manual invoices supply it"
      - name: origin
        type: enum
        source: system
        description: "AUTO_RUN | DEPARTURE | MANUAL"
      - name: amount_due_cents
        type: integer
        source: computed
        description: "Total due = SUM(InvoiceLine.amount_cents) over the invoice's lines"
      - name: due_date
        type: datetime
        source: computed
        description: "AUTO_RUN: first day of billing_month + 7 days. DEPARTURE: terminated_at + 14 days. MANUAL: created_at + 7 days."
      - name: amount_paid_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of payments applied via pay_invoice"
      - name: status
        type: enum
        source: system
        description: "DRAFT | ISSUED | PARTIALLY_PAID | PAID | OVERDUE | COLLECTIONS | WRITTEN_OFF | CANCELLED"

  - name: InvoiceLine
    parent: Invoice
    common_fields: true
    fields:
      - name: invoice_id
        type: string
        source: system
        description: "FK -> Invoice.id; parent invoice"
      - name: line_kind
        type: enum
        source: system
        description: "DESK_FEE | OVERHEAD_SHARE | TECH_SUBSCRIPTION | MARKETING | PRORATED_DESK_FEE | ADVANCE_RECOVERY"
      - name: period_label
        type: string
        source: system
        description: "Human label of the billed period, e.g. '2026-09 desk fee'"
      - name: amount_cents
        type: integer
        source: computed
        description: "Line amount; each line is individually rounded half-up to whole cents BEFORE the invoice sum (line-rounding order is pinned by the invoice_line_totals calculation)"
      - name: applied_at_closing_cents
        type: integer
        source: computed
        default: 0
        description: "Portion of this line satisfied by closing-statement offsets (advance_recovery_offset)"

  - name: CommissionEntry
    parent: Office
    common_fields: true
    fields:
      - name: office_id
        type: string
        source: system
        description: "FK -> Office.id; escrow office"
      - name: transaction_id
        type: string
        source: system
        description: "FK -> Transaction.id; nullable — null on MANUAL_ADJUSTMENT entries"
        default: null
      - name: entry_kind
        type: enum
        source: system
        description: "GCI_RECEIPT | AGENT_DISBURSEMENT | OFFICE_FEE_ACCRUAL | REFERRAL_PAYOUT | ADVANCE | ADVANCE_RETURN | MANUAL_ADJUSTMENT | DEPARTURE_HOLD | DEPARTURE_RELEASE"
      - name: amount_cents
        type: integer
        source: computed
        description: "Signed escrow movement in cents; invariants invariant_pending_gci_conservation and invariant_escrow_arithmetic_identity pin the sums"
      - name: entry_month
        type: string
        source: system
        description: "Ledger month YYYY-MM derived from the logical clock at posting time; drives agent_retention_index monthly aggregation"
      - name: status
        type: enum
        source: system
        description: "ESCROW_HELD | AGENT_PAYABLE | OFFICE_FEE_ACCRUED | REFERRAL_PAYABLE | DEPARTURE_HOLD | DISBURSED | RECONCILED | REVERSED"

  - name: ReferralAgreement
    parent: null
    common_fields: true
    fields:
      - name: referring_office_id
        type: string
        source: input
        description: "FK -> Office.id; office that sends the client out"
      - name: receiving_office_id
        type: string
        source: input
        description: "FK -> Office.id; office in the destination market that works the client"
      - name: agent_id
        type: string
        source: input
        description: "FK -> Agent.id; the receiving office's agent handling the referred client"
      - name: referral_fee_bps
        type: integer
        source: input
        description: "Negotiated referral fee in basis points deducted from GCI before the agent/office split"
        constraints: "0 <= referral_fee_bps <= 5000"
      - name: status
        type: enum
        source: system
        description: "PROPOSED | ACTIVE | FULFILLED | DECLINED | WITHDRAWN"
      - name: replaces_agreement_id
        type: string
        source: input
        description: "FK -> ReferralAgreement.id; nullable self-reference — when set, the replaced agreement must be ACTIVE and transitions to WITHDRAWN as this one activates"
        default: null
      - name: fulfilled_transaction_id
        type: string
        source: system
        description: "FK -> Transaction.id; nullable — set when the referred transaction closes"
        default: null

  - name: AgentRetentionReport
    parent: Office
    common_fields: true
    fields:
      - name: office_id
        type: string
        source: system
        description: "FK -> Office.id; subject office"
      - name: period_month
        type: string
        source: system
        description: "Report month YYYY-MM supplied to compute_retention"
      - name: headcount_start
        type: integer
        source: computed
        description: "Agents with onboarded_at < first instant of period_month and (terminated_at null or >= first instant)"
      - name: headcount_end
        type: integer
        source: computed
        description: "Agents with onboarded_at < first instant of next month and (terminated_at null or >= first instant of next month)"
      - name: retention_bps
        type: integer
        source: computed
        description: "headcount_end * 10000 / headcount_start, rounded half-up; ERR_NO_RETENTION_BASELINE when headcount_start == 0"
      - name: churned_agent_count
        type: integer
        source: computed
        description: "headcount_start - headcount_end"
      - name: report_variant
        type: enum
        source: system
        description: "CHURN | COHORT — CHURN uses headcount window; COHORT tracks the cohort onboarded within period_month through month-end"
      - name: status
        type: enum
        source: system
        description: "COMPUTED | ARCHIVED"

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Office
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when any invoice for the office enters COLLECTIONS)"
        actor: system
        preconditions: []
        side_effects:
          - "Office.status -> SUSPENDED"
          - "New agent onboarding into this office is rejected with ERR_OFFICE_SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (automatic when the office has zero invoices in COLLECTIONS after a pay_invoice)"
        actor: system
        preconditions: []
        side_effects:
          - "Office.status -> ACTIVE"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /offices/{officeId}/close"
        actor: FranchiseeOwner
        preconditions:
          - "office has zero ACTIVE Agents (ERR_OFFICE_NOT_EMPTY)"
        side_effects:
          - "Office.closed_at set to logical clock"
          - "All Agents in status TERMINATION_PENDING for this office -> TERMINATED, terminated_at set (conditional cascade)"
          - "All Invoices in status IN {ISSUED, PARTIALLY_PAID, OVERDUE} for this office -> COLLECTIONS (cascade down)"
          - "increments Office.version by 1"

  - entity: Agent
    initial_state: PENDING_ONBOARDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_ONBOARDING
        to: ACTIVE
        trigger: "system (automatic when the first FeeAssignment for the agent reaches ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Agent.onboarded_at set to logical clock"
          - "Agent.office_id.active_agent_count += 1 (ledger sync to Office)"
          - "increments Agent.version by 1"
      - from: ACTIVE
        to: TERMINATION_PENDING
        trigger: "POST /agents/{agentId}/terminate"
        actor: Agent
        preconditions:
          - "caller X-User-ID == agent.id (agents initiate their own departure)"
        side_effects:
          - "Agent.termination_requested_at set to logical clock"
          - "Agent.supervision_cadence_days tightened 30 -> 7 (supervision persists regardless of compensation model)"
          - "Every InvoiceLine for the agent with applied_at_closing_cents < amount_cents on an invoice in status IN {ISSUED, PARTIALLY_PAID, OVERDUE} spawns a CommissionEntry of kind DEPARTURE_HOLD, status DEPARTURE_HOLD, amount equal to the line's remaining balance (transitive cascade hop 1)"
          - "increments Agent.version by 1"
      - from: TERMINATION_PENDING
        to: TERMINATED
        trigger: "POST /agents/{agentId}/complete-termination"
        actor: ManagingBroker
        preconditions:
          - "logical clock >= termination_requested_at + 14 days (ERR_TERMINATION_WINDOW_OPEN)"
        side_effects:
          - "Agent.terminated_at set to logical clock"
          - "Agent.office_id.active_agent_count -= 1"
          - "Departure invoice generated (origin DEPARTURE) with PRORATED_DESK_FEE and ADVANCE_RECOVERY lines per departure_proration"
          - "All CommissionEntry in DEPARTURE_HOLD for the agent -> DEPARTURE_RELEASE then DISBURSED if the departure invoice nets to <= 0, else stays held against the invoice"
          - "increments Agent.version by 1"

  - entity: FeeAssignment
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, REJECTED, SUPERSEDED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /fee-assignments/{assignmentId}/accept"
        actor: Agent
        preconditions:
          - "caller X-User-ID == assignment.agent_id"
          - "the FeeSchedule window [effective_from, effective_to) contains the assignment's effective_from and the clock (ERR_SCHEDULE_WINDOW_VIOLATION)"
        side_effects:
          - "Agent.status PENDING_ONBOARDING -> ACTIVE when this is the agent's first ACCEPTED assignment"
          - "increments Agent.version by 1 (cascade to parent)"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /fee-assignments/{assignmentId}/reject"
        actor: Agent
        preconditions:
          - "caller X-User-ID == assignment.agent_id"
        side_effects: []
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system (automatic when a second FeeAssignment for the same agent is created while a PROPOSED one exists)"
        actor: system
        preconditions: []
        side_effects:
          - "the prior PROPOSED assignment -> SUPERSEDED"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /fee-assignments/{assignmentId}/cancel"
        actor: ManagingBroker
        preconditions: []
        side_effects: []

  - entity: Offer
    initial_state: OFFERED
    terminal_states: [ACCEPTED, REJECTED, EXPIRED, WITHDRAWN]
    transitions:
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /offers/{offerId}/counter"
        actor: Agent
        preconditions:
          - "caller is the listing office's agent for the deal"
        side_effects:
          - "increments Offer.version by 1"
      - from: COUNTERED
        to: OFFERED
        trigger: "POST /offers/{offerId}/reoffer"
        actor: Agent
        preconditions:
          - "offer_round < 4 (ERR_NEGOTIATION_EXHAUSTED at the start of round 5)"
        side_effects:
          - "Offer.offer_round += 1"
          - "increments Offer.version by 1"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /offers/{offerId}/accept"
        actor: Agent
        preconditions: []
        side_effects:
          - "Transaction created (status LISTED -> UNDER_CONTRACT in the same request) with sale_price_cents and gross_commission_cents snapshotted from input"
      - from: OFFERED
        to: REJECTED
        trigger: "POST /offers/{offerId}/reject"
        actor: Agent
        preconditions: []
        side_effects: []
      - from: COUNTERED
        to: REJECTED
        trigger: "POST /offers/{offerId}/reject"
        actor: Agent
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: EXPIRED
        trigger: "system (automatic when logical clock advances past 72 hours after the offer's last status change while still OFFERED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /offers/{offerId}/withdraw"
        actor: Agent
        preconditions: []
        side_effects: []

  - entity: Transaction
    initial_state: LISTED
    terminal_states: [CLOSED, FELL_THROUGH]
    transitions:
      - from: LISTED
        to: UNDER_CONTRACT
        trigger: "system (same request as Offer.accept — the Transaction is born UNDER_CONTRACT when created via offer acceptance; direct creation lands LISTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_CONTRACT
        to: PENDING_CLOSE
        trigger: "POST /transactions/{transactionId}/request-close"
        actor: Agent
        preconditions:
          - "a CDA exists for the transaction with status == APPROVED (ERR_CDA_NOT_APPROVED)"
          - "listing_agent_id.status == ACTIVE (ERR_AGENT_NOT_ACTIVE) — cross-entity dependency Transaction -> Agent"
        side_effects: []
      - from: PENDING_CLOSE
        to: CLOSED
        trigger: "POST /transactions/{transactionId}/close"
        actor: ManagingBroker
        preconditions:
          - "logical clock >= the transaction's request-close timestamp (same-day close allowed)"
        side_effects:
          - "Transaction.closed_at set"
          - "closing_statement calculation runs; ClosingStatementLine rows created (PROVISIONAL -> FINAL immediately for STANDARD variant, FORMER_AGENT variant when the agent is TERMINATION_PENDING/TERMINATED)"
          - "CommissionEntry GCI_RECEIPT posted (status ESCROW_HELD) (cascade hop 1)"
          - "AGENT_DISBURSEMENT entries posted per agent, status AGENT_PAYABLE (cascade hop 2, caused by the receipt being split)"
          - "OFFICE_FEE_ACCRUAL entry posted, status OFFICE_FEE_ACCRUED (cascade hop 2)"
          - "REFERRAL_PAYOUT entry posted when an ACTIVE ReferralAgreement covers the deal, status REFERRAL_PAYABLE; that ReferralAgreement -> FULFILLED (cascade hop 3, caused by the payout entry)"
          - "advance_recovery_offset applies against the agent's unearned_advance_balance_cents and outstanding invoice lines"
          - "increments Transaction.version by 1"
      - from: UNDER_CONTRACT
        to: FELL_THROUGH
        trigger: "POST /transactions/{transactionId}/mark-fell-through"
        actor: Agent
        preconditions: []
        side_effects:
          - "Offer that seeded the transaction is unaffected (already ACCEPTED)"
      - from: PENDING_CLOSE
        to: FELL_THROUGH
        trigger: "POST /transactions/{transactionId}/mark-fell-through"
        actor: Agent
        preconditions: []
        side_effects: []
      - from: FELL_THROUGH
        to: RELISTED
        trigger: "POST /transactions/{transactionId}/relist"
        actor: Agent
        preconditions: []
        side_effects: []
      - from: RELISTED
        to: UNDER_CONTRACT
        trigger: "POST /transactions/{transactionId}/recontract"
        actor: Agent
        preconditions: []
        side_effects: []
        note: "re-list loop: FELL_THROUGH -> RELISTED -> UNDER_CONTRACT forms the cycle"

  - entity: CommissionDisbursementAuthorization
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /transactions/{transactionId}/cdas (creation) — the CDA is born IN_REVIEW at rung 0"
        actor: ManagingBroker
        preconditions:
          - "transaction status IN {UNDER_CONTRACT, PENDING_CLOSE} (ERR_INVALID_STATE)"
          - "no other CDA for this transaction in status IN {DRAFT, IN_REVIEW, APPROVED} (ERR_CDA_EXISTS)"
        side_effects:
          - "current_rung = 0 (COMPLIANCE_REVIEW)"
      - from: IN_REVIEW
        to: IN_REVIEW
        trigger: "POST /cdas/{cdaId}/review with verdict APPROVE (advances the ladder) or REJECT (cycles the ladder back to rung 0)"
        actor: TrustAccountant
        preconditions:
          - "caller role matches review_ladder[current_rung]'s owning role: rung 0 ComplianceAuditor, rung 1 TrustAccountant, rung 2 ManagingBroker (ERR_REVIEW_RUNG_MISMATCH)"
        side_effects:
          - "APPROVE: current_rung += 1; when current_rung was 2, status -> APPROVED"
          - "REJECT: current_rung reset to 0; status stays IN_REVIEW (rejection cycles the ladder, does not terminate it)"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "system (automatic when the BROKER_SIGNOFF rung is approved)"
        actor: system
        preconditions: []
        side_effects:
          - "Transaction may now advance to PENDING_CLOSE"
      - from: IN_REVIEW
        to: SUPERSEDED
        trigger: "system (automatic when the parent Transaction -> FELL_THROUGH)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ClosingStatementLine
    initial_state: PROVISIONAL
    terminal_states: [FINAL, VOIDED]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "system (same request as Transaction.close — lines finalize atomically with the close)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FINAL
        to: VOIDED
        trigger: "system (automatic if the Transaction close is unwound by a subsequent FELL_THROUGH from RELISTED re-contract failure — reserved; not reachable in v1 flows)"
        actor: system
        preconditions: []
        side_effects:
          - "paired reversing CommissionEntry posted"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, WRITTEN_OFF, CANCELLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "system (invoices are born ISSUED by generate_invoices / complete-termination; POST /invoices manual creation lands DRAFT and is issued by POST /invoices/{invoiceId}/issue)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /invoices/{invoiceId}/pay with amount_cents < amount_due_cents - amount_paid_cents"
        actor: Agent
        preconditions:
          - "caller X-User-ID == invoice.agent_id"
          - "amount_cents > 0 and <= remaining balance (ERR_OVERPAYMENT)"
        side_effects:
          - "Invoice.amount_paid_cents += amount_cents"
          - "Office.trust_balance_cents unchanged (payment sits in escrow as part of the office trust) until reconciliation"
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{invoiceId}/pay with amount_cents == remaining balance"
        actor: Agent
        preconditions:
          - "caller X-User-ID == invoice.agent_id"
        side_effects:
          - "Invoice.amount_paid_cents = amount_due_cents"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /invoices/{invoiceId}/pay completing the balance"
        actor: Agent
        preconditions:
          - "caller X-User-ID == invoice.agent_id"
        side_effects:
          - "Invoice.amount_paid_cents = amount_due_cents"
      - from: ISSUED
        to: OVERDUE
        trigger: "system (automatic when logical clock passes due_date while unpaid)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_PAID
        to: OVERDUE
        trigger: "system (automatic when logical clock passes due_date with balance remaining)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OVERDUE
        to: COLLECTIONS
        trigger: "system (automatic when logical clock passes due_date + 30 days)"
        actor: system
        preconditions: []
        side_effects:
          - "Office.status -> SUSPENDED (cascade up)"
      - from: OVERDUE
        to: PARTIALLY_PAID
        trigger: "POST /invoices/{invoiceId}/pay (partial)"
        actor: Agent
        preconditions: []
        side_effects: []
      - from: OVERDUE
        to: PAID
        trigger: "POST /invoices/{invoiceId}/pay (full remaining balance)"
        actor: Agent
        preconditions: []
        side_effects:
          - "if the office has zero COLLECTIONS invoices and was SUSPENDED, Office.status -> ACTIVE"
      - from: COLLECTIONS
        to: PAID
        trigger: "POST /invoices/{invoiceId}/pay (full remaining balance)"
        actor: Agent
        preconditions: []
        side_effects:
          - "if this was the office's last COLLECTIONS invoice, Office.status SUSPENDED -> ACTIVE (compensation of the suspension cascade)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /invoices/{invoiceId}/cancel"
        actor: ManagingBroker
        preconditions: []
        side_effects: []
      - from: COLLECTIONS
        to: WRITTEN_OFF
        trigger: "POST /invoices/{invoiceId}/write-off"
        actor: BrokerOfRecord
        preconditions:
          - "invoice.age >= 90 days past due_date (ERR_WRITE_OFF_TOO_EARLY)"
        side_effects:
          - "Office.trust_balance_cents reduced by the unpaid balance (bad-debt recognition)"
          - "if this was the office's last COLLECTIONS invoice, Office.status SUSPENDED -> ACTIVE"

  - entity: CommissionEntry
    initial_state: ESCROW_HELD
    terminal_states: [DISBURSED, RECONCILED, REVERSED]
    transitions:
      - from: ESCROW_HELD
        to: AGENT_PAYABLE
        trigger: "system (part of Transaction.close split)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ESCROW_HELD
        to: OFFICE_FEE_ACCRUED
        trigger: "system (part of Transaction.close split)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ESCROW_HELD
        to: REFERRAL_PAYABLE
        trigger: "system (part of Transaction.close split when a referral applies)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ESCROW_HELD
        to: DEPARTURE_HOLD
        trigger: "system (Agent.terminate cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEPARTURE_HOLD
        to: DISBURSED
        trigger: "system (Agent.complete-termination when the departure invoice nets <= 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AGENT_PAYABLE
        to: DISBURSED
        trigger: "POST /offices/{officeId}/reconcile"
        actor: TrustAccountant
        preconditions: []
        side_effects:
          - "Office.trust_balance_cents -= entry.amount_cents (cash leaves escrow)"
      - from: REFERRAL_PAYABLE
        to: DISBURSED
        trigger: "POST /offices/{officeId}/reconcile"
        actor: TrustAccountant
        preconditions: []
        side_effects:
          - "referring office receives the payout"
      - from: OFFICE_FEE_ACCRUED
        to: RECONCILED
        trigger: "POST /offices/{officeId}/reconcile"
        actor: TrustAccountant
        preconditions: []
        side_effects:
          - "recognized as office revenue; trust_balance_cents -= entry.amount_cents"
      - from: AGENT_PAYABLE
        to: REVERSED
        trigger: "system (only via closing unwind; not reachable in v1)"
        actor: system
        preconditions: []
        side_effects:
          - "amount returned to ESCROW_HELD parent"

  - entity: ReferralAgreement
    initial_state: PROPOSED
    terminal_states: [FULFILLED, DECLINED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /referral-agreements/{agreementId}/accept"
        actor: ManagingBroker
        preconditions:
          - "caller belongs to receiving_office_id"
          - "referring_office_id.market_code != receiving_office_id.market_code (ERR_SAME_MARKET_REFERRAL) — referral network fees apply only across markets"
          - "when replaces_agreement_id is set: the referenced agreement exists and is ACTIVE (ERR_REPLACED_NOT_ACTIVE)"
        side_effects:
          - "when replaces_agreement_id set: the replaced ReferralAgreement -> WITHDRAWN (self-referential cascade)"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /referral-agreements/{agreementId}/decline"
        actor: ManagingBroker
        preconditions:
          - "caller belongs to receiving_office_id"
        side_effects: []
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /referral-agreements/{agreementId}/withdraw"
        actor: ManagingBroker
        preconditions:
          - "caller belongs to referring_office_id OR receiving_office_id"
          - "fulfilled_transaction_id is null (ERR_AGREEMENT_LOCKED)"
        side_effects: []
      - from: ACTIVE
        to: FULFILLED
        trigger: "system (automatic when a Transaction for agent_id closes with this agreement applied)"
        actor: system
        preconditions: []
        side_effects:
          - "fulfilled_transaction_id set"
          - "REFERRAL_PAYOUT CommissionEntry already posted by the closing cascade"

  - entity: AgentRetentionReport
    initial_state: COMPUTED
    terminal_states: [ARCHIVED]
    transitions:
      - from: COMPUTED
        to: ARCHIVED
        trigger: "system (automatic when a newer report for the same office and period_month is computed)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on parent version only
# =============================================================================
concurrency_rules:
  - rule_id: fee-assignment-stale-agent
    parent_entity: Agent
    write_endpoint: "POST /agents/{agentId}/fee-assignments"
    occ_field: "expected_agent_version"
    description: |
      Creating a FeeAssignment against an Agent whose version has advanced since
      the client last observed it is rejected. A FeeAssignment creation mutates
      the parent Agent (a prior PROPOSED assignment is superseded, and acceptance
      of a sibling assignment may have activated the agent), so the create
      requires the client to present the Agent.version it based its decision on;
      a stale version means the client's view of the agent's fee posture is
      outdated.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: closing_statement
    trigger: "POST /transactions/{transactionId}/close (Transaction PENDING_CLOSE -> CLOSED)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned (circular-looking dependency resolved):
      #   1. referral    2. net_gci   3. agent_retention   4. overhead_share
      #   5. office_split   6. advance_recovery_offset
      # overhead_share keys off net_gci (post-referral), NOT gross — the
      # overhead line can only be computed after the referral tier is removed.
      schedule = the FeeAssignment with status == ACCEPTED covering the
                 transaction's selling_agent_id whose window contains
                 Transaction.closed_at; its FeeSchedule supplies the bps rates.
      if an ACTIVE ReferralAgreement covers (selling_agent_id, receiving
         office == transaction.office_id):
        referral_fee_bps = ReferralAgreement.referral_fee_bps
      else:
        referral_fee_bps = FeeSchedule.referral_fee_bps
      referral_fee_cents        = round_half_up(gross_commission_cents * referral_fee_bps / 10000)
      net_gci_cents             = gross_commission_cents - referral_fee_cents
      agent_retention_cents     = round_half_up(net_gci_cents * retention_bps / 10000)
      overhead_share_cents      = round_half_up(net_gci_cents * overhead_share_bps / 10000)
      office_split_cents        = net_gci_cents - agent_retention_cents - overhead_share_cents
      advance_recovery_offset_cents = min(agent_retention_cents,
                                          Agent.unearned_advance_balance_cents)
      agent_disbursed_cents     = agent_retention_cents - advance_recovery_offset_cents
    input_set: "The closing Transaction (status PENDING_CLOSE), its selling Agent's ACCEPTED FeeAssignment + FeeSchedule, any ACTIVE ReferralAgreement covering the agent, and the agent's unearned_advance_balance_cents"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer cents; every rate application rounds half-up at the line it appears on, in the pinned evaluation order"
    variants:
      - name: standard_closing
        when: "selling agent status == ACTIVE at close"
        difference: "full retention formula above; ClosingStatementLine.variant = STANDARD"
      - name: former_agent_closing
        when: "selling agent status IN {TERMINATION_PENDING, TERMINATED} at close"
        difference: "agent_retention_cents is computed identically but routed into DEPARTURE_HOLD entries instead of AGENT_PAYABLE, and overhead_share_cents is waived (0) — departing agents do not carry overhead share; ClosingStatementLine.variant = FORMER_AGENT"

  - name: departure_proration
    trigger: "POST /agents/{agentId}/complete-termination (Agent TERMINATION_PENDING -> TERMINATED)"
    algorithm: forward_looking
    formula: |
      # Daily proration against a 30-day fixed month; BOTH variants must pin
      # the same day-count convention or the totals drift.
      D = day-of-month of Agent.termination_requested_at (1-based)
      period_start = first day of the calendar month containing termination_requested_at
      # owed variant — what the departing agent owes for the partial month:
      owed_cents  = round_half_up(desk_fee_cents * D / 30)
      # refund variant — what the office credits back when the desk fee for
      # the full month was already collected:
      refund_cents = round_half_up(desk_fee_cents * (30 - D) / 30)
      # invariant: owed_cents + refund_cents == desk_fee_cents exactly
      advance_recovery_cents = Agent.unearned_advance_balance_cents
    input_set: "The terminating Agent, the ACCEPTED FeeAssignment + FeeSchedule in force at termination_requested_at, and the agent's unearned_advance_balance_cents"
    constants:
      FIXED_MONTH_DAYS: 30
      DEPARTURE_NOTICE_DAYS: 14
    precision: "integer cents, round_half_up; owed and refund rounded independently then reconciled so their sum equals desk_fee_cents exactly"
    variants:
      - name: owed_variant
        when: "the departure invoice charges the partial month"
        difference: "PRORATED_DESK_FEE InvoiceLine.amount_cents = owed_cents (charges days 1..D)"
      - name: refund_variant
        when: "the desk fee for the full month was already invoiced and PAID before termination was requested"
        difference: "a credit of refund_cents is netted against the departure invoice (days D+1..30 returned); owed and refund NEVER both appear on the same departure invoice"

  - name: invoice_line_totals
    trigger: "Invoice creation (generate_invoices, complete-termination, or POST /invoices) and any line-level adjustment"
    algorithm: aggregation
    formula: |
      # Rounding order is pinned: round EACH LINE to whole cents half-up
      # FIRST, then sum the rounded lines. Summing unrounded fractional
      # amounts and rounding the total (the alternative order) produces
      # different cents and is forbidden.
      for each line: line.amount_cents = round_half_up(unrounded_line_amount)
      Invoice.amount_due_cents = SUM(line.amount_cents over all lines)
      # AUTO_RUN line set per ACTIVE agent with an ACCEPTED assignment whose
      # window contains the billing month:
      #   desk_fee  = FeeSchedule.desk_fee_cents
      #   tech      = FeeSchedule.tech_subscription_monthly_cents
      #   marketing = FeeSchedule.marketing_monthly_cents
      #   overhead_share accrual is NOT a monthly line — it is deducted at
      #   closing via closing_statement; only fixed monthly costs are billed.
    input_set: "All Agents with status == ACTIVE in the office whose ACCEPTED FeeAssignment window contains the billing month; exactly one invoice per agent per billing_month (re-running generate_invoices for the same month is idempotent)"
    constants: {}
    precision: "integer cents; per-line round_half_up then sum (never sum-then-round)"

  - name: advance_recovery_offset
    trigger: "inside closing_statement after agent_retention_cents is known"
    algorithm: waterfall_allocation
    formula: |
      # Buckets in priority order; overflow rolls to the next bucket; the
      # rounding remainder stays in the LAST bucket touched.
      offset = min(agent_retention_cents, Agent.unearned_advance_balance_cents)
      bucket 1 (oldest first, tie-break InvoiceLine.created_at ASC — never id):
        outstanding ADVANCE_RECOVERY / PRORATED_DESK_FEE / DESK_FEE invoice
        lines for the agent on invoices IN {ISSUED, PARTIALLY_PAID, OVERDUE}
      bucket 2: any remainder offsets the agent's TECH_SUBSCRIPTION then
        MARKETING lines, oldest first
      Agent.unearned_advance_balance_cents -= offset
      each touched InvoiceLine.applied_at_closing_cents += its applied portion
    input_set: "The closing Transaction's selling Agent, that agent's open InvoiceLines, and unearned_advance_balance_cents"
    constants: {}
    precision: "integer cents; no fractional remainders (offset is bounded by integer inputs)"

  - name: trust_balance
    trigger: "any CommissionEntry or Invoice status change"
    algorithm: aggregation
    formula: |
      Office.trust_balance_cents =
          SUM(CommissionEntry.amount_cents
              WHERE office_id == Office.id
                AND status IN {ESCROW_HELD, OFFICE_FEE_ACCRUED, DEPARTURE_HOLD})
        + SUM(Invoice.amount_due_cents - Invoice.amount_paid_cents
              WHERE office_id == Office.id
                AND status IN {ISSUED, PARTIALLY_PAID, COLLECTIONS})
      # OVERDUE invoices remain in the trust base (still owed); WRITTEN_OFF
      # and PAID invoices drop out.
    input_set: "All CommissionEntries and Invoices for the office in the statuses listed"
    constants: {}
    precision: "integer cents"

  - name: agent_retention_index
    trigger: "POST /offices/{officeId}/retention-reports/compute"
    algorithm: aggregation
    formula: |
      month_start = first instant of period_month
      next_month_start = first instant of period_month + 1 month
      headcount_start = COUNT(Agent WHERE office_id == office
                              AND onboarded_at < month_start
                              AND (terminated_at IS NULL OR terminated_at >= month_start))
      if headcount_start == 0: reject with ERR_NO_RETENTION_BASELINE
      headcount_end   = COUNT(Agent WHERE office_id == office
                              AND onboarded_at < next_month_start
                              AND (terminated_at IS NULL OR terminated_at >= next_month_start))
      retention_bps = round_half_up(headcount_end * 10000 / headcount_start)
      churned_agent_count = headcount_start - headcount_end
    input_set: "All Agents ever attached to the office (any status), filtered by the timestamp window predicates above; boundaries are [) half-open at both ends"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer bps, round_half_up"
    variants:
      - name: churn_variant
        when: "report_variant == CHURN (default)"
        difference: "headcount window across the whole office as above"
      - name: cohort_variant
        when: "report_variant == COHORT"
        difference: "headcount_start counts only agents onboarded within period_month; headcount_end counts that same cohort still unterminated at next_month_start; ERR_NO_RETENTION_BASELINE when the cohort is empty"

  - name: referral_network_fee
    trigger: "inside closing_statement step 1 when a ReferralAgreement applies"
    algorithm: threshold
    formula: |
      # Referral fee applies only across markets; within a market the
      # agreement cannot even activate (ERR_SAME_MARKET_REFERRAL).
      if ReferralAgreement.referral_fee_bps > 5000: unreachable (validation)
      referral_fee_cents = round_half_up(gross_commission_cents * referral_fee_bps / 10000)
      # Boundary precision: fee applies when gross_commission_cents > 0
      # (always true by validation) and the agreement's market pair differs;
      # fee is 0 iff referral_fee_bps == 0.
    input_set: "The ACTIVE ReferralAgreement whose agent_id == transaction.selling_agent_id and receiving_office_id == transaction.office_id; at most one such agreement may be ACTIVE (enforced by replaces/withdraw flows)"
    constants:
      MAX_REFERRAL_FEE_BPS: 5000
    precision: "integer cents, round_half_up"

  - name: offer_expiry_check
    trigger: "any read of an Offer in OFFERED status, and on POST /offers/{offerId}/accept"
    algorithm: threshold
    formula: |
      # Half-open boundary: an offer whose last status change was exactly
      # 72h ago at the current logical clock is EXPIRED (>= boundary
      # triggers); 71:59:59 is still acceptable.
      if logical_clock >= offer.updated_at + 72h AND status == OFFERED:
        status -> EXPIRED
    input_set: "Single Offer row"
    constants:
      OFFER_TTL_HOURS: 72
    precision: "whole seconds against the logical clock"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per the RBAC matrix; entity-backed roles must own the resource where the endpoint declares ownership (Agent acting on own invoices/assignments/termination)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-segment ids exist, validated left-to-right (office -> agent -> child); body foreign keys checked in the endpoint's declared input order"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition exists (per the §1.2 machines)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition and action endpoints"

  - priority: 5
    category: business_referential
    check: "Body foreign keys resolve to live entities compatible with the operation: fee_schedule_id exists and its window covers the assignment; replaces_agreement_id references an ACTIVE agreement; transaction's offer_id exists"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "POST /agents/{id}/fee-assignments, POST /referral-agreements, POST /transactions"

  - priority: 6
    category: business_constraint
    check: "Uniqueness and occupancy constraints: Agent.license_number unique system-wide; FeeAssignment windows for one agent must not overlap (adjacency allowed); FeeSchedule windows for overlapping schedule coverage must not overlap"
    error_id: ERR_DUPLICATE_LICENSE
    http_status: 409
    applies_to: "POST /offices/{id}/agents"
    note: "license uniqueness"

  - priority: 7
    category: business_constraint
    check: "FeeAssignment [effective_from, effective_to) does not intersect any other non-terminal FeeAssignment window for the same agent; touching endpoints (a.effective_to == b.effective_from) is NOT an overlap"
    error_id: ERR_ASSIGNMENT_OVERLAP
    http_status: 409
    applies_to: "POST /agents/{id}/fee-assignments"

  - priority: 8
    category: business_constraint
    check: "FeeSchedule windows do not overlap; a new schedule window must tile the calendar — gap=0 adjacency to the predecessor's effective_to is required when a predecessor exists"
    error_id: ERR_SCHEDULE_WINDOW_VIOLATION
    http_status: 409
    applies_to: "POST /fee-schedules"

  - priority: 9
    category: business_temporal
    check: "Clock-dependent gates: offer TTL (72h), termination notice (14d), invoice due dates, write-off floor (90d), CDA review on the correct rung"
    error_id: ERR_TEMPORAL_GATE
    http_status: 409
    applies_to: "time-gated transitions"

  - priority: 10
    category: business_fiscal
    check: "Money checks: pay amount <= remaining balance (ERR_OVERPAYMENT); sale_price_cents and gross_commission_cents > 0; retention computation inputs present (ACCEPTED assignment in force)"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /invoices/{id}/pay, POST /transactions, POST /transactions/{id}/close"

  - priority: 11
    category: business_safety
    check: "Supervision and compliance gates that persist regardless of the compensation model: transaction close requires an APPROVED CDA; CDA review must come from the role owning the current rung; office suspension blocks onboarding"
    error_id: ERR_CDA_NOT_APPROVED
    http_status: 409
    applies_to: "POST /transactions/{id}/request-close, POST /cdas/{id}/review, POST /offices/{id}/agents"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-09-01T00:00:00Z; before any set_current_utc call the logical clock reads this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "re-evaluates time-gated states: offer expiry (72h), invoice OVERDUE / COLLECTIONS escalations, FeeSchedule ACTIVE windows"

  # --- Office ---
  - method: POST
    path: "/offices"
    description: "Create a franchise office"
    roles: [FranchiseeOwner]
    code: 201
    input: [office_name, market_code, recruiting_target_agents, "active_agent_count?", "trust_balance_cents?"]
    output: Office
    side_effects: ["status=ACTIVE, active_agent_count=0, trust_balance_cents=0"]

  - method: GET
    path: "/offices/{officeId}"
    description: "Get an office"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: []
    output: Office
    side_effects: []

  - method: GET
    path: "/offices"
    description: "List offices"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: ["market_code?", "status?", "office_id?", "limit?", "offset?"]
    output: Office[]
    side_effects: []

  - method: POST
    path: "/offices/{officeId}/close"
    description: "Close an office (requires zero ACTIVE agents)"
    roles: [FranchiseeOwner]
    code: 200
    input: []
    output: Office
    side_effects:
      - "Office -> CLOSED, closed_at set"
      - "TERMINATION_PENDING agents -> TERMINATED"
      - "open invoices -> COLLECTIONS"
      - "increments Office.version by 1"

  # --- FeeSchedule ---
  - method: POST
    path: "/fee-schedules"
    description: "Create a fee schedule (window must not overlap sibling schedules; adjacency required)"
    roles: [BrokerOfRecord]
    code: 201
    input: [schedule_name, desk_fee_cents, overhead_share_bps, retention_bps, referral_fee_bps, tech_subscription_monthly_cents, marketing_monthly_cents, effective_from, effective_to]
    output: FeeSchedule
    side_effects: ["status computed from window vs logical clock"]

  - method: GET
    path: "/fee-schedules/{scheduleId}"
    description: "Get a fee schedule"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: []
    output: FeeSchedule
    side_effects: []

  - method: GET
    path: "/fee-schedules"
    description: "List fee schedules"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: ["status?", "fee_schedule_id?", "limit?", "offset?"]
    output: FeeSchedule[]
    side_effects: []

  # --- Agent ---
  - method: POST
    path: "/offices/{officeId}/agents"
    description: "Onboard an agent into an office"
    roles: [ManagingBroker]
    code: 201
    input: [full_name, email, license_number]
    output: Agent
    side_effects:
      - "status=PENDING_ONBOARDING, supervision_cadence_days=30, unearned_advance_balance_cents=0"
      - "rejected when office status != ACTIVE (ERR_OFFICE_SUSPENDED)"

  - method: GET
    path: "/agents/{agentId}"
    description: "Get an agent"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: []
    output: Agent
    side_effects: []

  - method: GET
    path: "/agents"
    description: "List agents"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: ["office_id?", "agent_id?", "status?", "limit?", "offset?"]
    output: Agent[]
    side_effects: []

  - method: POST
    path: "/agents/{agentId}/terminate"
    description: "Agent initiates departure (termination notice)"
    roles: [Agent]
    code: 200
    input: []
    output: Agent
    side_effects:
      - "Agent ACTIVE -> TERMINATION_PENDING; termination_requested_at set; supervision_cadence_days -> 7"
      - "DEPARTURE_HOLD CommissionEntries spawned for open invoice balances"
      - "increments Agent.version by 1"

  - method: POST
    path: "/agents/{agentId}/complete-termination"
    description: "Finalize departure after the 14-day notice window"
    roles: [ManagingBroker]
    code: 200
    input: []
    output: Agent
    side_effects:
      - "Agent TERMINATION_PENDING -> TERMINATED; terminated_at set; office.active_agent_count -= 1"
      - "departure invoice generated (departure_proration)"
      - "DEPARTURE_HOLD entries released or netted against the departure invoice"
      - "increments Agent.version by 1"

  - method: POST
    path: "/agents/{agentId}/advance-commission"
    description: "Advance commission to an agent (creates an ADVANCE entry and debit balance)"
    roles: [ManagingBroker]
    code: 201
    input: [amount_cents]
    output: CommissionEntry
    side_effects:
      - "Agent.unearned_advance_balance_cents += amount_cents"
      - "CommissionEntry kind=ADVANCE posted, status DISBURSED (cash out of trust)"

  - method: POST
    path: "/agents/{agentId}/return-advance"
    description: "Agent returns an advance (compensating action for advance-commission)"
    roles: [Agent]
    code: 201
    input: [amount_cents]
    output: CommissionEntry
    side_effects:
      - "Agent.unearned_advance_balance_cents -= amount_cents (ERR_OVERPAYMENT if amount exceeds balance)"
      - "CommissionEntry kind=ADVANCE_RETURN posted"

  # --- FeeAssignment ---
  - method: POST
    path: "/agents/{agentId}/fee-assignments"
    description: "Propose a fee assignment for an agent (OCC on Agent.version)"
    roles: [ManagingBroker]
    code: 201
    input: [fee_schedule_id, effective_from, effective_to, expected_agent_version]
    output: FeeAssignment
    side_effects:
      - "status=PROPOSED"
      - "any existing PROPOSED assignment for the agent -> SUPERSEDED"
      - "increments Agent.version by 1"

  - method: GET
    path: "/fee-assignments/{assignmentId}"
    description: "Get a fee assignment"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: []
    output: FeeAssignment
    side_effects: []

  - method: GET
    path: "/agents/{agentId}/fee-assignments"
    description: "List an agent's fee assignments"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: ["status?", "agent_id?", "fee_schedule_id?", "limit?", "offset?"]
    output: FeeAssignment[]
    side_effects: []

  - method: POST
    path: "/fee-assignments/{assignmentId}/accept"
    description: "Agent accepts the proposed fee assignment"
    roles: [Agent]
    code: 200
    input: []
    output: FeeAssignment
    side_effects:
      - "PROPOSED -> ACCEPTED"
      - "first ACCEPTED assignment activates the agent (PENDING_ONBOARDING -> ACTIVE), office.active_agent_count += 1"
      - "increments Agent.version by 1"

  - method: POST
    path: "/fee-assignments/{assignmentId}/reject"
    description: "Agent rejects the proposed fee assignment"
    roles: [Agent]
    code: 200
    input: []
    output: FeeAssignment
    side_effects: ["PROPOSED -> REJECTED"]

  - method: POST
    path: "/fee-assignments/{assignmentId}/cancel"
    description: "Broker cancels a proposed fee assignment"
    roles: [ManagingBroker]
    code: 200
    input: []
    output: FeeAssignment
    side_effects: ["PROPOSED -> CANCELLED"]

  - method: GET
    path: "/fee-assignments"
    description: "List fee assignments across agents"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: ["agent_id?", "fee_schedule_id?", "status?", "limit?", "offset?"]
    output: FeeAssignment[]
    side_effects: []

  # --- Offer ---
  - method: POST
    path: "/offices/{officeId}/offers"
    description: "Register a buyer offer on a listing"
    roles: [Agent, ManagingBroker]
    code: 201
    input: [listing_reference, buyer_name, offer_price_cents, "offer_round?", "status?"]
    output: Offer
    side_effects: ["status=OFFERED, offer_round=1"]

  - method: GET
    path: "/offers/{offerId}"
    description: "Get an offer (expiry re-checked on read)"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: []
    output: Offer
    side_effects: ["may transition OFFERED -> EXPIRED if TTL elapsed"]

  - method: POST
    path: "/offers/{offerId}/counter"
    description: "Counter the offer"
    roles: [Agent]
    code: 200
    input: []
    output: Offer
    side_effects: ["OFFERED -> COUNTERED; increments Offer.version by 1"]

  - method: POST
    path: "/offers/{offerId}/reoffer"
    description: "Buyer re-offers after a counter (cycle back to OFFERED, round += 1)"
    roles: [Agent]
    code: 200
    input: []
    output: Offer
    side_effects: ["COUNTERED -> OFFERED; offer_round += 1; increments Offer.version by 1"]

  - method: POST
    path: "/offers/{offerId}/accept"
    description: "Accept the offer and open a transaction"
    roles: [Agent]
    code: 200
    input: []
    output: Offer
    side_effects:
      - "OFFERED -> ACCEPTED"
      - "Transaction created (born UNDER_CONTRACT)"

  - method: POST
    path: "/offers/{offerId}/reject"
    description: "Reject the offer"
    roles: [Agent]
    code: 200
    input: []
    output: Offer
    side_effects: ["OFFERED/COUNTERED -> REJECTED"]

  - method: POST
    path: "/offers/{offerId}/withdraw"
    description: "Withdraw a countered offer"
    roles: [Agent]
    code: 200
    input: []
    output: Offer
    side_effects: ["COUNTERED -> WITHDRAWN"]

  # --- Transaction ---
  - method: POST
    path: "/offices/{officeId}/transactions"
    description: "Create a transaction directly (lands LISTED)"
    roles: [ManagingBroker]
    code: 201
    input: [listing_agent_id, selling_agent_id, offer_id, sale_price_cents, gross_commission_cents]
    output: Transaction
    side_effects: ["status=LISTED"]

  - method: GET
    path: "/transactions/{transactionId}"
    description: "Get a transaction"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: []
    output: Transaction
    side_effects: []

  - method: GET
    path: "/transactions"
    description: "List transactions"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: ["office_id?", "status?", "selling_agent_id?", "listing_agent_id?", "offer_id?", "limit?", "offset?"]
    output: Transaction[]
    side_effects: []

  - method: POST
    path: "/transactions/{transactionId}/request-close"
    description: "Request closing (requires APPROVED CDA and ACTIVE listing agent)"
    roles: [Agent]
    code: 200
    input: []
    output: Transaction
    side_effects: ["UNDER_CONTRACT -> PENDING_CLOSE"]

  - method: POST
    path: "/transactions/{transactionId}/close"
    description: "Close the transaction: runs closing_statement, posts escrow entries, applies advance offsets, fulfills referrals"
    roles: [ManagingBroker]
    code: 200
    input: []
    output: Transaction
    side_effects:
      - "PENDING_CLOSE -> CLOSED; closed_at set"
      - "ClosingStatementLine rows created and finalized"
      - "CommissionEntry cascade: GCI_RECEIPT -> AGENT_DISBURSEMENT / OFFICE_FEE_ACCRUAL / REFERRAL_PAYOUT"
      - "covered ReferralAgreement -> FULFILLED"
      - "advance_recovery_offset applied"
      - "increments Transaction.version by 1"

  - method: POST
    path: "/transactions/{transactionId}/mark-fell-through"
    description: "Mark a deal fallen through"
    roles: [Agent]
    code: 200
    input: []
    output: Transaction
    side_effects:
      - "UNDER_CONTRACT/PENDING_CLOSE -> FELL_THROUGH"
      - "any IN_REVIEW CDA -> SUPERSEDED"

  - method: POST
    path: "/transactions/{transactionId}/relist"
    description: "Re-list a fallen-through deal"
    roles: [Agent]
    code: 200
    input: []
    output: Transaction
    side_effects: ["FELL_THROUGH -> RELISTED"]

  - method: POST
    path: "/transactions/{transactionId}/recontract"
    description: "Put a re-listed deal back under contract"
    roles: [Agent]
    code: 200
    input: []
    output: Transaction
    side_effects: ["RELISTED -> UNDER_CONTRACT"]

  # --- CDA ---
  - method: POST
    path: "/transactions/{transactionId}/cdas"
    description: "Open a Commission Disbursement Authorization review ladder"
    roles: [ManagingBroker]
    code: 201
    input: [review_ladder]
    output: CommissionDisbursementAuthorization
    side_effects: ["born IN_REVIEW at rung 0"]

  - method: GET
    path: "/cdas/{cdaId}"
    description: "Get a CDA"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: []
    output: CommissionDisbursementAuthorization
    side_effects: []

  - method: GET
    path: "/transactions/{transactionId}/cdas"
    description: "List CDAs for a transaction"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: ["transaction_id?"]
    output: CommissionDisbursementAuthorization[]
    side_effects: []

  - method: POST
    path: "/cdas/{cdaId}/review"
    description: "Review the current rung of the ladder (APPROVE advances, REJECT cycles back to rung 0)"
    roles: [ComplianceAuditor, TrustAccountant, ManagingBroker]
    code: 200
    input: [verdict]
    output: CommissionDisbursementAuthorization
    side_effects:
      - "APPROVE at rungs 0/1: current_rung += 1"
      - "APPROVE at rung 2: status -> APPROVED"
      - "REJECT at any rung: current_rung -> 0 (cycle)"

  - method: GET
    path: "/closing-statement-lines/{lineId}"
    description: "Get a single closing statement line"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: []
    output: ClosingStatementLine
    side_effects: []

  - method: GET
    path: "/cdas"
    description: "List CDAs across transactions"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: ["transaction_id?", "status?", "limit?", "offset?"]
    output: CommissionDisbursementAuthorization[]
    side_effects: []

  # --- ClosingStatementLine ---
  - method: GET
    path: "/transactions/{transactionId}/closing-statement-lines"
    description: "List the closing statement lines for a transaction"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: ["variant?", "status?", "transaction_id?", "agent_id?", "applied_invoice_line_id?", "limit?", "offset?"]
    output: ClosingStatementLine[]
    side_effects: []

  # --- Offer (flat list for FK reverse-reachability) ---
  - method: GET
    path: "/offers"
    description: "List offers"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: ["office_id?", "status?", "limit?", "offset?"]
    output: Offer[]
    side_effects: ["may transition OFFERED -> EXPIRED rows lazily on read"]

  # --- InvoiceLine (flat list for FK reverse-reachability) ---
  - method: GET
    path: "/invoice-lines"
    description: "List invoice lines across invoices"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: ["invoice_id?", "line_kind?", "limit?", "offset?"]
    output: InvoiceLine[]
    side_effects: []

  - method: GET
    path: "/closing-statement-lines"
    description: "List closing statement lines across transactions"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: ["transaction_id?", "agent_id?", "applied_invoice_line_id?", "variant?", "status?", "limit?", "offset?"]
    output: ClosingStatementLine[]
    side_effects: []

  # --- Invoice ---
  - method: POST
    path: "/offices/{officeId}/generate-invoices"
    description: "Monthly billing run: one AUTO_RUN invoice per ACTIVE agent with an in-force ACCEPTED assignment"
    roles: [ManagingBroker]
    code: 200
    input: [billing_month]
    output: Invoice[]
    side_effects:
      - "invoice_line_totals runs per agent; invoices born ISSUED"
      - "idempotent per (agent, billing_month): re-run for the same month returns the existing invoices without duplicating"

  - method: POST
    path: "/invoices"
    description: "Create a manual invoice (lands DRAFT)"
    roles: [ManagingBroker]
    code: 201
    input: [office_id, agent_id, billing_month, lines]
    output: Invoice
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/invoices/{invoiceId}"
    description: "Get an invoice"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["may transition ISSUED/PARTIALLY_PAID -> OVERDUE -> COLLECTIONS if the clock has passed the gates"]

  - method: GET
    path: "/invoices"
    description: "List invoices"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: ["office_id?", "agent_id?", "invoice_id?", "status?", "billing_month?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/invoices/{invoiceId}/issue"
    description: "Issue a DRAFT manual invoice"
    roles: [ManagingBroker]
    code: 200
    input: []
    output: Invoice
    side_effects: ["DRAFT -> ISSUED"]

  - method: POST
    path: "/invoices/{invoiceId}/pay"
    description: "Agent pays an invoice (full or partial)"
    roles: [Agent]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects:
      - "amount_paid_cents += amount_cents"
      - "status transitions ISSUED/OVERDUE/COLLECTIONS -> PARTIALLY_PAID or PAID"
      - "office suspension lifted when last COLLECTIONS invoice clears"

  - method: POST
    path: "/invoices/{invoiceId}/cancel"
    description: "Cancel a DRAFT invoice"
    roles: [ManagingBroker]
    code: 200
    input: []
    output: Invoice
    side_effects: ["DRAFT -> CANCELLED"]

  - method: POST
    path: "/invoices/{invoiceId}/write-off"
    description: "Write off a COLLECTIONS invoice at least 90 days past due"
    roles: [BrokerOfRecord]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "COLLECTIONS -> WRITTEN_OFF"
      - "Office.trust_balance_cents reduced by unpaid balance"
      - "office suspension lifted when last COLLECTIONS invoice clears"

  # --- InvoiceLine ---
  - method: GET
    path: "/invoice-lines/{lineId}"
    description: "Get a single invoice line"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: []
    output: InvoiceLine
    side_effects: []

  - method: GET
    path: "/invoices/{invoiceId}/lines"
    description: "List an invoice's lines"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: ["invoice_id?"]
    output: InvoiceLine[]
    side_effects: []

  # --- CommissionEntry ---
  - method: GET
    path: "/commission-entries/{entryId}"
    description: "Get a single commission entry"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: []
    output: CommissionEntry
    side_effects: []

  - method: GET
    path: "/commission-entries"
    description: "List commission entries (ledger)"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: ["office_id?", "transaction_id?", "status?", "entry_kind?", "entry_month?", "limit?", "offset?"]
    output: CommissionEntry[]
    side_effects: []

  - method: POST
    path: "/offices/{officeId}/reconcile"
    description: "Trust reconciliation run: settles AGENT_PAYABLE / REFERRAL_PAYABLE / OFFICE_FEE_ACCRUED entries"
    roles: [TrustAccountant]
    code: 200
    input: []
    output: Office
    side_effects:
      - "AGENT_PAYABLE -> DISBURSED, REFERRAL_PAYABLE -> DISBURSED, OFFICE_FEE_ACCRUED -> RECONCILED"
      - "Office.trust_balance_cents recomputed"
      - "increments Office.version by 1"

  - method: GET
    path: "/retention-reports/{reportId}"
    description: "Get a single retention report"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: []
    output: AgentRetentionReport
    side_effects: []

  - method: GET
    path: "/retention-reports"
    description: "List retention reports across offices"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: ["office_id?", "period_month?", "status?", "limit?", "offset?"]
    output: AgentRetentionReport[]
    side_effects: []

  # --- ReferralAgreement ---
  - method: POST
    path: "/referral-agreements"
    description: "Propose a cross-market referral agreement"
    roles: [ManagingBroker]
    code: 201
    input: [referring_office_id, receiving_office_id, agent_id, referral_fee_bps, "replaces_agreement_id?"]
    output: ReferralAgreement
    side_effects: ["status=PROPOSED"]

  - method: GET
    path: "/referral-agreements/{agreementId}"
    description: "Get a referral agreement"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, Agent, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: []
    output: ReferralAgreement
    side_effects: []

  - method: GET
    path: "/referral-agreements"
    description: "List referral agreements"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: ["referring_office_id?", "receiving_office_id?", "agent_id?", "status?", "replaces_agreement_id?", "fulfilled_transaction_id?", "limit?", "offset?"]
    output: ReferralAgreement[]
    side_effects: []

  - method: POST
    path: "/referral-agreements/{agreementId}/accept"
    description: "Receiving office accepts the referral (cross-market only)"
    roles: [ManagingBroker]
    code: 200
    input: []
    output: ReferralAgreement
    side_effects:
      - "PROPOSED -> ACTIVE"
      - "replaced agreement (if any) -> WITHDRAWN"

  - method: POST
    path: "/referral-agreements/{agreementId}/decline"
    description: "Receiving office declines the referral"
    roles: [ManagingBroker]
    code: 200
    input: []
    output: ReferralAgreement
    side_effects: ["PROPOSED -> DECLINED"]

  # --- AgentRetentionReport ---
  - method: POST
    path: "/offices/{officeId}/retention-reports/compute"
    description: "Compute the agent retention index for a period month (franchisee recruitment competition and retention analysis)"
    roles: [FranchiseeOwner, BrokerOfRecord]
    code: 201
    input: [period_month, "report_variant?"]
    output: AgentRetentionReport
    side_effects:
      - "agent_retention_index runs; report born COMPUTED; any prior COMPUTED report for the same (office, period_month) -> ARCHIVED"
      - "ERR_NO_RETENTION_BASELINE when headcount_start == 0"

  - method: GET
    path: "/offices/{officeId}/retention-reports"
    description: "List retention reports for an office"
    roles: [FranchiseeOwner, BrokerOfRecord, ManagingBroker, TrustAccountant, ComplianceAuditor, PlatformAdmin]
    code: 200
    input: ["period_month?", "status?", "office_id?", "limit?", "offset?"]
    output: AgentRetentionReport[]
    side_effects: []

  - method: POST
    path: "/referral-agreements/{agreementId}/withdraw"
    description: "Either office withdraws an unfulfilled ACTIVE agreement"
    roles: [ManagingBroker]
    code: 200
    input: []
    output: ReferralAgreement
    side_effects: ["ACTIVE -> WITHDRAWN (blocked once fulfilled)"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or role not declared"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for the endpoint, or entity-backed caller does not own the target resource"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-segment or body-referenced resource id does not exist"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is in a state from which the requested transition does not exist"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_agent_version on FeeAssignment creation does not match the Agent's current version"

  - id: ERR_DUPLICATE_LICENSE
    http: 409
    condition: "Agent.license_number already registered system-wide"

  - id: ERR_ASSIGNMENT_OVERLAP
    http: 409
    condition: "FeeAssignment window intersects another non-terminal assignment for the same agent (adjacency is not overlap)"

  - id: ERR_SCHEDULE_WINDOW_VIOLATION
    http: 409
    condition: "FeeSchedule window overlaps a sibling schedule, or an assignment's window is not covered by its schedule's window"

  - id: ERR_OFFICE_SUSPENDED
    http: 409
    condition: "Onboarding into an office whose status is SUSPENDED or CLOSED"

  - id: ERR_OFFICE_NOT_EMPTY
    http: 409
    condition: "close_office while the office still has ACTIVE agents"

  - id: ERR_CDA_EXISTS
    http: 409
    condition: "A CDA in status DRAFT/IN_REVIEW/APPROVED already exists for the transaction"

  - id: ERR_CDA_NOT_APPROVED
    http: 409
    condition: "request-close without an APPROVED CDA on the transaction"

  - id: ERR_REVIEW_RUNG_MISMATCH
    http: 409
    condition: "CDA review submitted by a role that does not own the current rung"

  - id: ERR_AGENT_NOT_ACTIVE
    http: 409
    condition: "Operation requires an ACTIVE agent (e.g. request-close with a TERMINATION_PENDING listing agent)"

  - id: ERR_NEGOTIATION_EXHAUSTED
    http: 409
    condition: "reoffer attempted when offer_round would reach 5 (max 4 rounds)"

  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "accept attempted on an offer whose 72h TTL has elapsed"

  - id: ERR_SAME_MARKET_REFERRAL
    http: 422
    condition: "Referral agreement between two offices in the same market_code"

  - id: ERR_AGREEMENT_LOCKED
    http: 409
    condition: "withdraw attempted on a FULFILLED referral agreement"

  - id: ERR_REPLACED_NOT_ACTIVE
    http: 409
    condition: "replaces_agreement_id references an agreement that is not ACTIVE"

  - id: ERR_OVERPAYMENT
    http: 422
    condition: "Payment amount exceeds the remaining invoice balance (or advance return exceeds unearned_advance_balance_cents)"

  - id: ERR_TERMINATION_WINDOW_OPEN
    http: 409
    condition: "complete-termination before termination_requested_at + 14 days"

  - id: ERR_WRITE_OFF_TOO_EARLY
    http: 409
    condition: "write-off attempted before the invoice is 90 days past due_date"

  - id: ERR_NO_RETENTION_BASELINE
    http: 422
    condition: "retention report computed for a period whose headcount_start (or cohort) is zero"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, malformed value, enum outside its declared set, or non-positive money/quantity"

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: FranchiseeOwner
    description: "Owns the franchise office; economics scale with agent count, not transaction share; runs retention analysis"
    identity: opaque
    exclusive_operations:
      - "POST /offices"
      - "POST /offices/{id}/close"
    shared_operations:
      - "GET /offices, GET /offices/{id}"
      - "GET /agents, GET /agents/{id}"
      - "GET /fee-schedules, GET /fee-schedules/{id}"
      - "GET /fee-assignments/{id}, GET /agents/{id}/fee-assignments"
      - "GET /transactions, GET /transactions/{id}"
      - "GET /transactions/{id}/closing-statement-lines"
      - "GET /cdas/{id}, GET /transactions/{id}/cdas"
      - "GET /offers/{id}"
      - "GET /invoices, GET /invoices/{id}, GET /invoices/{id}/lines"
      - "GET /commission-entries"
      - "GET /referral-agreements, GET /referral-agreements/{id}"
      - "POST /offices/{id}/retention-reports/compute, GET /offices/{id}/retention-reports"

  - name: BrokerOfRecord
    description: "The supervising broker; supervision duties persist regardless of compensation model; owns fee schedules and write-offs"
    identity: opaque
    exclusive_operations:
      - "POST /fee-schedules"
      - "POST /invoices/{id}/write-off"
    shared_operations:
      - "all GET endpoints"
      - "POST /offices/{id}/retention-reports/compute"

  - name: ManagingBroker
    description: "Day-to-day office manager: onboards agents, proposes fee assignments, opens CDAs, closes transactions, runs billing"
    identity: opaque
    exclusive_operations:
      - "POST /offices/{id}/agents"
      - "POST /agents/{id}/fee-assignments"
      - "POST /fee-assignments/{id}/cancel"
      - "POST /agents/{id}/complete-termination"
      - "POST /agents/{id}/advance-commission"
      - "POST /transactions/{id}/close"
      - "POST /transactions/{id}/cdas"
      - "POST /offices/{id}/generate-invoices"
      - "POST /invoices"
      - "POST /invoices/{id}/issue"
      - "POST /invoices/{id}/cancel"
      - "POST /referral-agreements"
      - "POST /referral-agreements/{id}/accept"
      - "POST /referral-agreements/{id}/decline"
      - "POST /referral-agreements/{id}/withdraw"
    shared_operations:
      - "all GET endpoints"
      - "POST /cdas/{id}/review (BROKER_SIGNOFF rung)"
      - "POST /offers (offices/{id}/offers)"

  - name: Agent
    description: "The desk-fee agent; acts only on own resources (identity-bound)"
    identity: "entity_backed:Agent"
    exclusive_operations:
      - "POST /fee-assignments/{id}/accept"
      - "POST /fee-assignments/{id}/reject"
      - "POST /agents/{id}/terminate"
      - "POST /invoices/{id}/pay"
      - "POST /agents/{id}/return-advance"
    shared_operations:
      - "GET endpoints for own office, own record, own assignments, own invoices"
      - "POST /offices/{id}/offers and offer negotiation endpoints"
      - "POST /transactions/{id}/request-close, mark-fell-through, relist, recontract"

  - name: TrustAccountant
    description: "Escrow and trust reconciliation operator"
    identity: opaque
    exclusive_operations:
      - "POST /offices/{id}/reconcile"
    shared_operations:
      - "all GET endpoints"
      - "POST /cdas/{id}/review (TRUST_REVIEW rung)"

  - name: ComplianceAuditor
    description: "Independent compliance reviewer on the CDA ladder"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "all GET endpoints"
      - "POST /cdas/{id}/review (COMPLIANCE_REVIEW rung)"

  - name: PlatformAdmin
    description: "System operator; controls the logical clock and fixture-level setup"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"
