  # =========================================================================
  - section: rbac
    instances:

      - name: request_missing_x_user_id_returns_unauthenticated
        claim_type: unauthenticated_access
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority 1]
          - roles
        distinguishing_aspect: "Authentication is a header-shape check that precedes everything: an absent X-User-Role, an X-User-Role naming a role that is not one of the six declared roles, and an absent X-User-ID each return 401 ERR_UNAUTHENTICATED on the very same well-formed body that succeeds with both headers present."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /prospects"
              payload: { household_name: "Alvarez Household", primary_age: 45, household_income_cents: 10000000, marital_status: "MARRIED" }
              as: "(X-User-Role header omitted)"
            - call: "POST /prospects"
              payload: { household_name: "Alvarez Household", primary_age: 45, household_income_cents: 10000000, marital_status: "MARRIED" }
              as: "SalesDirector"
            - call: "POST /prospects"
              payload: { household_name: "Alvarez Household", primary_age: 45, household_income_cents: 10000000, marital_status: "MARRIED" }
              as: MarketingManager
              as_user_id: "(X-User-ID header omitted)"
            - call: "POST /prospects"
              payload: { household_name: "Alvarez Household", primary_age: 45, household_income_cents: 10000000, marital_status: "MARRIED" }
              as: MarketingManager
              as_user_id: "mm-primary"
              captures: { p1: $.data.id }
          assert:
            - "trigger 1 returns 401 with error_id ERR_UNAUTHENTICATED"
            - "trigger 2 returns 401 with error_id ERR_UNAUTHENTICATED -- an undeclared role name is not a 403"
            - "trigger 3 returns 401 with error_id ERR_UNAUTHENTICATED"
            - "trigger 4 returns 201 and Prospect.${p1}.household_name == \"Alvarez Household\""
            - "no Prospect row exists for triggers 1-3"

      - name: roles_cannot_reach_other_roles_exclusive_operations
        claim_type: role_denied
        grounds:
          - roles
          - errors[ERR_UNAUTHORIZED]
          - validations[priority 2]
        distinguishing_aspect: "The six duty roles are non-overlapping and the authorization check runs at priority 2, ahead of the priority-4 existence check: every one of these nine calls returns 403 ERR_UNAUTHORIZED even though eight of them address ids that do not exist, and PlatformAdmin -- the clock operator -- is refused a business write like any other outsider."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z; no business rows exist, so every path id below is unresolvable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tour-bookings/00000000-0000-4000-8000-000000000001/check-in"
              payload: { issue_incentive_gift: true }
              as: MarketingManager
            - call: "POST /tour-channels"
              payload: { name: "Off-Property Contact", channel_code: "OFF_PROPERTY_CONTACT", incentive_gift_value_cents: 12500, min_age: 30, min_household_income_cents: 5000000, min_qualification_score: 55 }
              as: GalleryManager
            - call: "POST /prospects"
              payload: { household_name: "Alvarez Household", primary_age: 45, household_income_cents: 10000000, marital_status: "MARRIED" }
              as: SalesRepresentative
              as_user_id: "rep-any"
            - call: "POST /purchase-agreements/00000000-0000-4000-8000-000000000001/fund"
              payload: { funding_reference: "WIRE-1", collected_amount_cents: 1 }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /sales-presentations/00000000-0000-4000-8000-000000000001/review"
              payload: { decision: "CLEAR" }
              as: ContractAdministrator
              as_user_id: "admin-intake"
            - call: "POST /tour-channels"
              payload: { name: "Off-Property Contact", channel_code: "OFF_PROPERTY_CONTACT", incentive_gift_value_cents: 12500, min_age: 30, min_household_income_cents: 5000000, min_qualification_score: 55 }
              as: PlatformAdmin
            - call: "GET /sales-representatives/00000000-0000-4000-8000-000000000001/rescission-analysis"
              payload: {}
              as: MarketingManager
            - call: "GET /tour-channels/00000000-0000-4000-8000-000000000001/no-show-summary"
              payload: {}
              as: SalesRepresentative
              as_user_id: "rep-any"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "admin-intake"
          assert:
            - "all nine triggers return 403 with error_id ERR_UNAUTHORIZED"
            - "triggers 1, 4, 5, 7 and 8 do NOT return 404, proving priority 2 is evaluated before priority 4"
            - "trigger 6 shows PlatformAdmin holds no business write authority despite operating the clock"
            - "trigger 7 and 8 show the two read carve-outs: MarketingManager is denied the rescission analysis and SalesRepresentative is denied the channel no-show summary"
            - "the logical clock is still 2026-08-01T00:00:00Z after trigger 9"

      - name: each_role_performs_its_own_exclusive_operations
        claim_type: role_permitted
        grounds:
