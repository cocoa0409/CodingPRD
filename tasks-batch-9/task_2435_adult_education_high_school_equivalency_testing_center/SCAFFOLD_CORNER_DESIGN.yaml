          - errors[ERR_VOUCHER_ADJUSTMENT_INVALID]
        distinguishing_aspect: |
          A clawback larger than the balance is refused with no partial application, while a clawback
          of exactly the balance is allowed and lands on zero - the boundary is 0, not 1.
        test_recipe:
