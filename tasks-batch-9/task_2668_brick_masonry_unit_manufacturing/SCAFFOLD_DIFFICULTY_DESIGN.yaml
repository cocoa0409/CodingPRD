# ===========================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2668 - Brick & Masonry Unit Manufacturing
#
# Every instance grounds in elements already declared in SCAFFOLD.yaml
# sections 1.1-1.7. Deleting this file leaves the scaffold's declared behavior
# identical; it only makes coverage harder to audit.
#
# Shared bootstrap conventions used by the setup chains below:
#   - The logical clock starts at 2026-08-01T00:00:00Z and is only moved when an
#     instance explicitly needs a later instant.
#   - Plant "P1" sits at grid (0,0) with market_radius_miles 300,
#     freight_rate_cents_per_ton_mile 42 and base_capacity_green_units_per_day
#     40000; jobsite (30,30) is therefore 60 rectilinear miles away.
#   - Formulation "F1" is 50.00 percent CLAY pit (Fe 7.500 / CaO 1.200) plus
#     50.00 percent SHALE pit (Fe 5.000 / CaO 0.800), giving blend_iron_oxide_pct
#     6.250, blend_lime_pct 1.000, shale_share_pct 50.00, absorption_index
#     exactly 8.00 and computed_durability_grade SW.
#   - Kiln "K1" has position_count 5 (centerline 3.0), setpoint_peak_c 1050 and
#     cooldown_buffer_hours 6.0. Fired at 1040 C for 3.0 h, base_cdi is 20.68, so
#     position 3 yields color_index 52.18 and positions 1 and 5 yield 49.81;
#     fired at 1045 C for 3.0 h, position 3 yields 53.17.
# ===========================================================================
scaffold_difficulty_design:

  # =======================================================================
  # RULE 1 - dual_variant_calc
  # =======================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: green_yield_projected_versus_actual_on_close_green
        grounds:
          - calculations.green_yield
          - entities.ProductionRun.fields.projected_net_green_units
          - entities.ProductionRun.fields.green_loss_variance_units
          - state_machines.ProductionRun.SETTING_to_SET
        distinguishing_aspect: |
          This instance's two variants diverge on the SAME ProductionRun row because
          PROJECTED charges a modelled loss (ceil of 350 basis points plus a flat
          12-unit setting allowance) while ACTUAL subtracts the operator's reported
          loss, so identical run data yields 9638 versus 9600 and a signed variance
          of -38; the other dual-variant instance in this rule diverges on a
          different entity (Order) because its two variants read DIFFERENT INPUT
          FIELDS (requested units versus real packaged weight) rather than applying
          different loss models to one field.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default"
            - "Plant P1 ACTIVE with two clay pits and BodyFormulation F1 QUALIFIED at 100.00 percent share"
            - "KilnCar C1 IDLE with capacity_green_units 12000"
            - "ProductionRun R1 created in SETTING with green_units_set 10000, so projected_net_green_units is 9638"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CUSTOMER_FORKLIFT", "TRUCK_MOUNTED_FORKLIFT", "CRANE"] }
              as: PlantAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-A", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 7.500, lime_pct: 1.200 }
              as: PlantAdmin
              captures: { pit_a: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-SHALE-B", material_type: "SHALE", proven_reserve_tons: 5000.00, iron_oxide_pct: 5.000, lime_pct: 0.800 }
              as: PlantAdmin
              captures: { pit_b: "$.data.id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F1", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
              captures: { f1: "$.data.id", f1v1: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_a}", share_pct: 50.00, expected_formulation_version: "${f1v1}" }
              as: BodyEngineer
              captures: { f1v2: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_b}", share_pct: 50.00, expected_formulation_version: "${f1v2}" }
              as: BodyEngineer
            - call: "POST /formulations/${f1}/qualify"
              payload: {}
              as: BodyEngineer
            - call: "POST /plants/${p1}/kiln-cars"
              payload: { car_code: "C1", capacity_green_units: 12000 }
              as: PlantAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /production-runs"
              payload: { plant_id: "${p1}", formulation_id: "${f1}", kiln_car_id: "${c1}", run_code: "R1", texture: "WIRE_CUT", green_units_set: 10000 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { r1: "$.data.id", r1_projected: "$.data.projected_net_green_units" }
          trigger:
            - call: "POST /production-runs/${r1}/close-green"
              payload: { green_loss_units: 400 }
              as: PlantOperator
              as_user_id: "${p1}"
          assert:
            - "The PROJECTED variant wrote projected_net_green_units == 9638 at creation (10000 - ceil(10000 * 350 / 10000) - 12)"
            - "${r1_projected} == 9638"
            - "The ACTUAL variant writes net_green_units == 9600 (10000 - 400), ignoring both loss constants"
            - "green_loss_pct == 4.00"
            - "green_loss_variance_units == -38, the signed gap between the two variants on identical run data"
            - "status == SET because 4.00 <= 6.00"
            - "clay_tons_committed remains 32.00 and is untouched by either yield variant"

      - name: order_freight_estimated_versus_final_on_package
        grounds:
          - calculations.order_freight_cost
          - entities.Order.fields.estimated_freight_cents
          - entities.Order.fields.final_freight_cents
          - entities.Order.fields.freight_variance_cents
          - state_machines.Order.ESTIMATED_to_FINALIZED
        distinguishing_aspect: |
          This instance's two variants diverge because they read DIFFERENT INPUT
          FIELDS of the same Order - ESTIMATED bills requested_units alone for 27.00
          tons and 71102 cents, while FINAL bills real packaged weight including
          pallet tare and steel banding for 27.79 tons and 73182 cents - and the
          divergence is persisted as freight_variance_cents 2080; the green_yield
          instance in this rule instead applies two different LOSS MODELS to one
          input field on a different entity.
        test_recipe:
          setup:
            - "Plant P1 ACTIVE at grid (0,0) with freight_rate_cents_per_ton_mile 42"
            - "Fired lots L1 (color_index 52.18, 9600 units) and L2 (color_index 49.81, 9600 units), both RED / WIRE_CUT / SW at P1"
            - "Order O1 for 12000 units to jobsite (30,30), 60 rectilinear miles out, banding_type STEEL, requires_panel_approval false"
            - "Order O1 assigned to P1 with estimated_freight_cents 71102; blend B1 allocated to exactly 12000 units and CERTIFIED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CUSTOMER_FORKLIFT", "TRUCK_MOUNTED_FORKLIFT", "CRANE"] }
              as: PlantAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-A", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 7.500, lime_pct: 1.200 }
              as: PlantAdmin
              captures: { pit_a: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-SHALE-B", material_type: "SHALE", proven_reserve_tons: 5000.00, iron_oxide_pct: 5.000, lime_pct: 0.800 }
              as: PlantAdmin
              captures: { pit_b: "$.data.id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F1", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
              captures: { f1: "$.data.id", f1v1: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_a}", share_pct: 50.00, expected_formulation_version: "${f1v1}" }
              as: BodyEngineer
              captures: { f1v2: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_b}", share_pct: 50.00, expected_formulation_version: "${f1v2}" }
              as: BodyEngineer
            - call: "POST /formulations/${f1}/qualify"
              payload: {}
              as: BodyEngineer
            - call: "POST /plants/${p1}/kilns"
              payload: { kiln_code: "K1", position_count: 5, setpoint_peak_c: 1050, cooldown_buffer_hours: 6.0 }
              as: PlantAdmin
              captures: { k1: "$.data.id" }
            - call: "POST /plants/${p1}/kiln-cars"
              payload: { car_code: "C1", capacity_green_units: 12000 }
              as: PlantAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /plants/${p1}/kiln-cars"
              payload: { car_code: "C2", capacity_green_units: 12000 }
              as: PlantAdmin
              captures: { c2: "$.data.id" }
            - call: "POST /production-runs"
              payload: { plant_id: "${p1}", formulation_id: "${f1}", kiln_car_id: "${c1}", run_code: "R1", texture: "WIRE_CUT", green_units_set: 10000 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { r1: "$.data.id" }
            - call: "POST /production-runs/${r1}/close-green"
              payload: { green_loss_units: 400 }
              as: PlantOperator
              as_user_id: "${p1}"
            - call: "POST /production-runs"
              payload: { plant_id: "${p1}", formulation_id: "${f1}", kiln_car_id: "${c2}", run_code: "R2", texture: "WIRE_CUT", green_units_set: 10000 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { r2: "$.data.id" }
            - call: "POST /production-runs/${r2}/close-green"
              payload: { green_loss_units: 400 }
              as: PlantOperator
              as_user_id: "${p1}"
            - call: "POST /kiln-runs"
              payload: { kiln_id: "${k1}", formulation_id: "${f1}", run_code: "KR1", start_at: "2026-08-05T00:00:00Z", end_at: "2026-08-07T00:00:00Z", planned_peak_temp_c: 1050, planned_soak_hours: 3.0 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { kr1: "$.data.id", kr1v1: "$.data.version" }
            - call: "POST /kiln-runs/${kr1}/load"
              payload: { production_run_id: "${r1}", kiln_position: 3, expected_kiln_run_version: "${kr1v1}" }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { kr1v2: "$.data.version" }
            - call: "POST /kiln-runs/${kr1}/load"
              payload: { production_run_id: "${r2}", kiln_position: 1, expected_kiln_run_version: "${kr1v2}" }
              as: PlantOperator
              as_user_id: "${p1}"
            - call: "POST /kiln-runs/${kr1}/start"
              payload: {}
              as: PlantOperator
              as_user_id: "${p1}"
            - call: "POST /kiln-runs/${kr1}/grade"
              payload: { actual_peak_temp_c: 1040, actual_soak_hours: 3.0 }
              as: PlantOperator
              as_user_id: "${p1}"
            - call: "GET /fired-lots"
              payload: { production_run_id: "${r1}" }
              as: BlendTechnician
              captures: { l1: "$.data[0].id" }
            - call: "GET /fired-lots"
              payload: { production_run_id: "${r2}" }
              as: BlendTechnician
              captures: { l2: "$.data[0].id" }
            - call: "POST /orders"
              payload: { order_code: "O1", jobsite_grid_x: 30, jobsite_grid_y: 30, requested_units: 12000, color_family: "RED", texture: "WIRE_CUT", durability_grade: "SW", unloading_equipment_required: "TRUCK_MOUNTED_FORKLIFT", banding_type: "STEEL" }
              as: SalesRep
              as_user_id: "sales-001"
              captures: { o1: "$.data.id" }
            - call: "POST /orders/${o1}/assign-plant"
              payload: {}
              as: SalesRep
              as_user_id: "sales-001"
              captures: { o1_est: "$.data.estimated_freight_cents", o1_est_tons: "$.data.estimated_billable_tons" }
            - call: "POST /orders/${o1}/blends"
              payload: { blend_code: "B1", target_color_index_min: 48.00, target_color_index_max: 54.00, requested_units: 12000 }
              as: BlendTechnician
              as_user_id: "blend-001"
              captures: { b1: "$.data.id", b1v1: "$.data.version" }
            - call: "POST /blends/${b1}/components"
              payload: { fired_lot_id: "${l1}", units: 5000, expected_blend_version: "${b1v1}" }
              as: BlendTechnician
              as_user_id: "blend-001"
              captures: { b1v2: "$.data.version" }
            - call: "POST /blends/${b1}/components"
              payload: { fired_lot_id: "${l2}", units: 7000, expected_blend_version: "${b1v2}" }
              as: BlendTechnician
              as_user_id: "blend-001"
            - call: "POST /blends/${b1}/compose"
              payload: {}
              as: BlendTechnician
              as_user_id: "blend-001"
            - call: "POST /blends/${b1}/certify"
              payload: {}
              as: QualityManager
              as_user_id: "qual-001"
          trigger:
            - call: "POST /orders/${o1}/package"
              payload: { pallet_count: 24, band_count: 48 }
              as: LogisticsCoordinator
              as_user_id: "logi-001"
          assert:
            - "${o1_est_tons} == 27.00 and ${o1_est} == 71102 (base 68040 at the 4.5 percent tier plus 3062)"
            - "final_billable_tons == 27.79 from 55584 lb (24 * 60 pallet tare + 48 * 3.0 steel banding + 12000 * 4.5 brick)"
            - "final_base_freight_cents == 70031 (60 miles * 42 cents * 27.79 tons, round_half_up)"
            - "final_fuel_surcharge_cents == 3151 at the same 4.5 percent tier"
            - "final_freight_cents == 73182"
            - "freight_variance_cents == 2080, exactly final minus estimated"
            - "estimated_freight_cents is unchanged at 71102 after packaging"
            - "fulfillment_status == PACKAGED and freight_status == FINALIZED"

  # =======================================================================
  # RULE 2 - combinatorial_formula
  # =======================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: clay_tonnage_per_pit_rounding_residual_mode_b
        grounds:
          - calculations.clay_tonnage_commitment
          - entities.ClayPit.fields.committed_tons
          - entities.ProductionRun.fields.clay_tons_committed
        distinguishing_aspect: |
          MODE (b) - round-per-item-then-sum versus sum-then-round: the run-level
          total is rounded FIRST to 32.00 tons and each of three pit shares
          (33.33 / 33.33 / 33.34 percent) is then rounded from that already-rounded
          total, producing 10.67 / 10.67 / 10.67 whose sum overshoots by 0.01, so the
          -0.01 residual is assigned entirely to the LAST component in created_at ASC
          order, giving 10.67 / 10.67 / 10.66. Recomputing shares from the unrounded
          total or rounding only the sum yields a different per-pit vector.
        test_recipe:
          setup:
            - "Plant P1 ACTIVE with three pits of identical chemistry (Fe 6.000, CaO 1.000), the third being SHALE, each with proven_reserve_tons 5000.00"
            - "BodyFormulation F2 QUALIFIED with component shares appended in order 33.33, 33.33, 33.34 summing to exactly 100.00, clay_tons_per_thousand_units 3.20"
            - "KilnCar C1 IDLE with capacity_green_units 12000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CUSTOMER_FORKLIFT", "TRUCK_MOUNTED_FORKLIFT", "CRANE"] }
              as: PlantAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-1", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 6.000, lime_pct: 1.000 }
              as: PlantAdmin
              captures: { pit_1: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-2", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 6.000, lime_pct: 1.000 }
              as: PlantAdmin
              captures: { pit_2: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-3", material_type: "SHALE", proven_reserve_tons: 5000.00, iron_oxide_pct: 6.000, lime_pct: 1.000 }
              as: PlantAdmin
              captures: { pit_3: "$.data.id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F2", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
              captures: { f2: "$.data.id", f2v1: "$.data.version" }
            - call: "POST /formulations/${f2}/components"
              payload: { pit_id: "${pit_1}", share_pct: 33.33, expected_formulation_version: "${f2v1}" }
              as: BodyEngineer
              captures: { f2v2: "$.data.version" }
            - call: "POST /formulations/${f2}/components"
              payload: { pit_id: "${pit_2}", share_pct: 33.33, expected_formulation_version: "${f2v2}" }
              as: BodyEngineer
              captures: { f2v3: "$.data.version" }
            - call: "POST /formulations/${f2}/components"
              payload: { pit_id: "${pit_3}", share_pct: 33.34, expected_formulation_version: "${f2v3}" }
              as: BodyEngineer
            - call: "POST /formulations/${f2}/qualify"
              payload: {}
              as: BodyEngineer
            - call: "POST /plants/${p1}/kiln-cars"
              payload: { car_code: "C1", capacity_green_units: 12000 }
              as: PlantAdmin
              captures: { c1: "$.data.id" }
          trigger:
            - call: "POST /production-runs"
              payload: { plant_id: "${p1}", formulation_id: "${f2}", kiln_car_id: "${c1}", run_code: "R1", texture: "WIRE_CUT", green_units_set: 10000 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { r1: "$.data.id" }
          assert:
            - "clay_tons_committed == 32.00 (10000 / 1000 * 3.20, rounded once at the run level)"
            - "GET /plants/${p1}/clay-pits shows PIT-1.committed_tons == 10.67"
            - "GET /plants/${p1}/clay-pits shows PIT-2.committed_tons == 10.67"
            - "GET /plants/${p1}/clay-pits shows PIT-3.committed_tons == 10.66, carrying the -0.01 residual as the last component in created_at ASC order"
            - "The three committed_tons values sum to exactly 32.00, equal to clay_tons_committed"
            - "PIT-1.available_tons == 4989.33, PIT-2.available_tons == 4989.33, PIT-3.available_tons == 4989.34"
            - "Each pit still satisfies proven_reserve_tons == available_tons + committed_tons + consumed_tons == 5000.00"
            - "The formulation's absorption_index == 9.63 and computed_durability_grade == MW, unaffected by the tonnage split"

      - name: freight_surcharge_tier_keyed_on_base_mode_c
        grounds:
          - calculations.order_freight_cost
          - entities.Order.fields.estimated_base_freight_cents
          - entities.Order.fields.estimated_fuel_surcharge_cents
          - validations[priority=43]
        distinguishing_aspect: |
          MODE (c) - evaluation-order dependence: the fuel-surcharge tier is selected
          from the already-rounded base_freight_cents and applied as a WHOLE-BILL rate,
          so shrinking the order from 11111 to 11106 units drops billable tons from
          25.00 to 24.99, drops the base from 50000 to 49980, and thereby falls back
          from the 4.5 percent tier to the 6.5 percent tier - raising the total from
          52250 to 53229 cents. Keying the tier on the TOTAL instead of the base, or
          applying marginal per-bracket rates, changes both numbers; this is a
          different mode from the round-then-sum residual instance in this rule.
        test_recipe:
          setup:
            - "Plant P3 ACTIVE at grid (0,0) with market_radius_miles 300, freight_rate_cents_per_ton_mile 40 and base_capacity_green_units_per_day 40000"
            - "BodyFormulation F1 QUALIFIED at P3 for RED with computed_durability_grade SW"
            - "Order OX for 11111 units and order OY for 11106 units, both RED / WIRE_CUT / SW to jobsite (25,25), 50 rectilinear miles out"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plants"
              payload: { plant_code: "P3", name: "Tier Edge Works", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 40, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CUSTOMER_FORKLIFT", "TRUCK_MOUNTED_FORKLIFT", "CRANE"] }
              as: PlantAdmin
              captures: { p3: "$.data.id" }
            - call: "POST /plants/${p3}/clay-pits"
              payload: { pit_name: "PIT-CLAY-A", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 7.500, lime_pct: 1.200 }
              as: PlantAdmin
              captures: { pit_a: "$.data.id" }
            - call: "POST /plants/${p3}/clay-pits"
              payload: { pit_name: "PIT-SHALE-B", material_type: "SHALE", proven_reserve_tons: 5000.00, iron_oxide_pct: 5.000, lime_pct: 0.800 }
              as: PlantAdmin
              captures: { pit_b: "$.data.id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p3}", formulation_code: "F1", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
              captures: { f1: "$.data.id", f1v1: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_a}", share_pct: 50.00, expected_formulation_version: "${f1v1}" }
              as: BodyEngineer
              captures: { f1v2: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_b}", share_pct: 50.00, expected_formulation_version: "${f1v2}" }
              as: BodyEngineer
            - call: "POST /formulations/${f1}/qualify"
              payload: {}
              as: BodyEngineer
            - call: "POST /orders"
