# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_2310
# 9 rule_ids, 23 instances. Every literal in `assert:` was computed against the
# §1.3 formulas and constants before being written here.
# Logical clock default: 2026-08-01T00:00:00Z (POST /valve-mfg/_clock/set_current_utc).
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: actuator_sizing_catalog_variant_vs_datasheet_variant
        grounds:
          - calculations.required_actuator_torque_nm
          - entities.ActuatorPackage.fields.sizing_basis
          - entities.ActuatorPackage.fields.sized_torque_nm
          - entities.EngineeredOrder.fields.datasheet_torque_source
          - concurrency_rules[actuator-package-create-stale-unit]
        distinguishing_aspect: |
          The CATALOG variant sizes from ValveModel.base_break_torque_nm while the DATASHEET variant sizes from
          the order's customer-stated datasheet torque inflated by DATASHEET_UNCERTAINTY_FACTOR 1.10; with
          identical torque figures (420.0 Nm) the two variants must produce required_torque_nm 562.4 and 618.6
          respectively — a 56.2 Nm divergence on the same model and the same margin tier.
        test_recipe:
          setup:
            - "One RELEASED BALL model, class 300, seat METAL, bore 100 mm, base_break_torque_nm 420.0, no special services."
            - "One QUALIFIED CASTING/CF8M qualification covering class 600 and one RELEASED heat lot with two BODY components."
            - "One GRANTED monogram license scoped to BALL and GATE."
            - "Unit SN-A stands alone; unit SN-B belongs to an engineered order whose datasheet states 420.0 Nm CUSTOMER_STATED."
          setup_api_calls:
            - call: "POST /valve-mfg/foundries"
              payload: { foundry_code: "FDY-01", name: "Alpha Castings", country_code: "IN" }
              as: ProcurementSpecialist
              captures: { f_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications"
              payload: { foundry_id: "${f_id}", process: "CASTING", material_grade: "CF8M", max_pressure_class: 600, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: ProcurementSpecialist
              captures: { q_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications/${q_id}/actions"
              payload: { action: "QUALIFY" }
              as: QualityManager
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-CF8M", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 420.0 }
              as: ProductEngineer
              captures: { m_id: $.data.id }
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ProductEngineer
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "RELEASE" }
              as: QualityManager
            - call: "POST /valve-mfg/heat-lots"
              payload: { foundry_id: "${f_id}", heat_number: "H-1001", material_grade: "CF8M", process: "CASTING", qty_received_kg: 500.000, mtr_document_ref: "MTR-1001", carbon_equivalent_pct: 0.35, impact_energy_j: 40 }
              as: ProcurementSpecialist
              captures: { l_id: $.data.id }
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "VERIFY" }
              as: QualityManager
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "RELEASE" }
              as: QualityManager
            - call: "POST /valve-mfg/components"
              payload: { heat_lot_id: "${l_id}", target_model_id: "${m_id}", component_type: "BODY", net_weight_kg: 120.500 }
              as: ProcurementSpecialist
              captures: { c1_id: $.data.id }
            - call: "POST /valve-mfg/components"
              payload: { heat_lot_id: "${l_id}", target_model_id: "${m_id}", component_type: "BODY", net_weight_kg: 120.500 }
              as: ProcurementSpecialist
              captures: { c2_id: $.data.id }
            - call: "POST /valve-mfg/monogram-licenses"
              payload: { license_code: "MON-01", facility_code: "FAC-1", scope_valve_types: ["BALL", "GATE"], lead_auditor_user_id: "aud-1", audit_window_start: "2026-07-01T00:00:00Z", audit_window_end: "2026-07-31T00:00:00Z" }
              as: QualityManager
              captures: { lic_id: $.data.id }
            - call: "POST /valve-mfg/monogram-licenses/${lic_id}/actions"
              payload: { action: "START_AUDIT" }
              as: MonogramAuditor
              as_user_id: "aud-1"
            - call: "POST /valve-mfg/monogram-licenses/${lic_id}/actions"
              payload: { action: "CLOSE_AUDIT" }
              as: MonogramAuditor
              as_user_id: "aud-1"
            - call: "POST /valve-mfg/monogram-licenses/${lic_id}/actions"
              payload: { action: "GRANT" }
              as: MonogramAuditor
              as_user_id: "aud-1"
            - call: "POST /valve-mfg/valve-units"
              payload: { model_id: "${m_id}", body_component_id: "${c1_id}", monogram_license_id: "${lic_id}", serial_number: "SN-A" }
              as: ProductEngineer
              captures: { ua_id: $.data.id, ua_v: $.data.version }
            - call: "POST /valve-mfg/engineered-orders"
              payload: { order_code: "ETO-1", model_id: "${m_id}", ordered_qty: 1, unit_price_cents: 1000000, customer_credit_limit_cents: 5000000, datasheet_break_torque_nm: 420.0, datasheet_torque_source: "CUSTOMER_STATED" }
              as: ProductEngineer
              captures: { o_id: $.data.id }
            - call: "POST /valve-mfg/valve-units"
              payload: { model_id: "${m_id}", body_component_id: "${c2_id}", monogram_license_id: "${lic_id}", serial_number: "SN-B", engineered_order_id: "${o_id}" }
              as: ProductEngineer
              captures: { ub_id: $.data.id, ub_v: $.data.version }
          trigger:
            - call: "POST /valve-mfg/actuator-packages"
              payload: { valve_unit_id: "${ua_id}", actuator_type: "PNEUMATIC", supply_pressure_bar: 5.5, output_torque_nm: 900.0, sizing_basis: "CATALOG", expected_valve_unit_version: "${ua_v}" }
              as: ProductEngineer
              captures: { pkg_a_id: $.data.id }
            - call: "POST /valve-mfg/actuator-packages"
              payload: { valve_unit_id: "${ub_id}", actuator_type: "PNEUMATIC", supply_pressure_bar: 5.5, output_torque_nm: 900.0, sizing_basis: "DATASHEET", expected_valve_unit_version: "${ub_v}" }
              as: ProductEngineer
              captures: { pkg_b_id: $.data.id }
          assert:
            - "ActuatorPackage.${pkg_a_id}.required_torque_nm == 562.4"
            - "ActuatorPackage.${pkg_a_id}.safety_margin_pct == 0.25"
            - "ActuatorPackage.${pkg_a_id}.sized_torque_nm == 703.0"
            - "ActuatorPackage.${pkg_b_id}.required_torque_nm == 618.6"
            - "ActuatorPackage.${pkg_b_id}.safety_margin_pct == 0.25"
            - "ActuatorPackage.${pkg_b_id}.sized_torque_nm == 773.3"
            - "ActuatorPackage.${pkg_b_id}.required_torque_nm - ActuatorPackage.${pkg_a_id}.required_torque_nm == 56.2"
            - "ActuatorPackage.${pkg_a_id}.sizing_status == PROPOSED and ActuatorPackage.${pkg_b_id}.sizing_status == PROPOSED"

      - name: fugitive_emission_peak_variant_vs_time_weighted_variant
        grounds:
          - calculations.fugitive_emission_leak_class
          - entities.ValveUnit.fields.provisional_emission_leak_class
          - entities.ValveUnit.fields.final_emission_leak_class
          - state_machines.ValveUnit.TESTS_PASSED_to_CERTIFIED
          - calculations.model_qualified_special_services
        distinguishing_aspect: |
          The PEAK_READING variant (written at test time) takes max(leak_rate_ppm) = 140 ppm and bands to class B,
          while the TIME_WEIGHTED variant (frozen at CERTIFY) takes 65.00 ppm and bands to class A — the same two
          records give a worse provisional class than final class, and the divergence lives on a different entity
          and a different domain (emission classing) from the torque-sizing dual variant.
        test_recipe:
          setup:
            - "A BALL model, class 300, bore 100 mm, seat SOFT, base 420.0, required_special_services [FUGITIVE_EMISSION], still IN_REVIEW."
            - "A prototype unit of that model carrying special_services [FUGITIVE_EMISSION], build_status ASSEMBLED."
            - "Two PASS FUGITIVE_EMISSION records: 40 ppm held 300 s, then 140 ppm held 100 s; plus PASS SHELL and SEAT records."
            - "The model is RELEASED only after the type test exists, so qualified_special_services == [FUGITIVE_EMISSION]."
          setup_api_calls:
            - call: "POST /valve-mfg/foundries"
              payload: { foundry_code: "FDY-02", name: "Beta Castings", country_code: "IN" }
              as: ProcurementSpecialist
              captures: { f_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications"
              payload: { foundry_id: "${f_id}", process: "CASTING", material_grade: "CF8M", max_pressure_class: 600, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: ProcurementSpecialist
              captures: { q_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications/${q_id}/actions"
              payload: { action: "QUALIFY" }
              as: QualityManager
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-FE", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "SOFT", base_break_torque_nm: 420.0, required_special_services: ["FUGITIVE_EMISSION"] }
              as: ProductEngineer
              captures: { m_id: $.data.id }
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ProductEngineer
            - call: "POST /valve-mfg/heat-lots"
              payload: { foundry_id: "${f_id}", heat_number: "H-2001", material_grade: "CF8M", process: "CASTING", qty_received_kg: 500.000, mtr_document_ref: "MTR-2001", carbon_equivalent_pct: 0.35, impact_energy_j: 40 }
              as: ProcurementSpecialist
              captures: { l_id: $.data.id }
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "VERIFY" }
              as: QualityManager
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "RELEASE" }
              as: QualityManager
            - call: "POST /valve-mfg/components"
              payload: { heat_lot_id: "${l_id}", target_model_id: "${m_id}", component_type: "BODY", net_weight_kg: 120.500 }
              as: ProcurementSpecialist
              captures: { c_id: $.data.id }
            - call: "POST /valve-mfg/monogram-licenses"
              payload: { license_code: "MON-02", facility_code: "FAC-1", scope_valve_types: ["BALL"], lead_auditor_user_id: "aud-1", audit_window_start: "2026-07-01T00:00:00Z", audit_window_end: "2026-07-31T00:00:00Z" }
              as: QualityManager
              captures: { lic_id: $.data.id }
            - call: "POST /valve-mfg/monogram-licenses/${lic_id}/actions"
              payload: { action: "START_AUDIT" }
              as: MonogramAuditor
              as_user_id: "aud-1"
            - call: "POST /valve-mfg/monogram-licenses/${lic_id}/actions"
              payload: { action: "CLOSE_AUDIT" }
              as: MonogramAuditor
              as_user_id: "aud-1"
            - call: "POST /valve-mfg/monogram-licenses/${lic_id}/actions"
              payload: { action: "GRANT" }
              as: MonogramAuditor
              as_user_id: "aud-1"
            - call: "POST /valve-mfg/valve-units"
              payload: { model_id: "${m_id}", body_component_id: "${c_id}", monogram_license_id: "${lic_id}", serial_number: "SN-FE-1", special_services: ["FUGITIVE_EMISSION"] }
              as: ProductEngineer
              captures: { u_id: $.data.id }
            - call: "POST /valve-mfg/valve-units/${u_id}/build-actions"
              payload: { action: "ADVANCE", to_build_status: "MACHINED" }
              as: TestTechnician
              as_user_id: "tech-1"
            - call: "POST /valve-mfg/valve-units/${u_id}/build-actions"
              payload: { action: "ADVANCE", to_build_status: "ASSEMBLED" }
              as: TestTechnician
              as_user_id: "tech-1"
            - call: "POST /valve-mfg/valve-units/${u_id}/test-records"
              payload: { test_type: "SHELL", test_bench_code: "BENCH-1", started_at: "2026-08-01T08:00:00Z", ended_at: "2026-08-01T09:00:00Z", test_pressure_bar: 80.0, hold_seconds: 60, result: "PASS" }
              as: TestTechnician
              as_user_id: "tech-1"
            - call: "POST /valve-mfg/valve-units/${u_id}/test-records"
              payload: { test_type: "SEAT", test_bench_code: "BENCH-1", started_at: "2026-08-01T09:00:00Z", ended_at: "2026-08-01T10:00:00Z", test_pressure_bar: 60.0, hold_seconds: 60, result: "PASS" }
              as: TestTechnician
              as_user_id: "tech-1"
            - call: "POST /valve-mfg/valve-units/${u_id}/test-records"
              payload: { test_type: "FUGITIVE_EMISSION", test_bench_code: "BENCH-2", started_at: "2026-08-01T08:00:00Z", ended_at: "2026-08-01T09:00:00Z", test_pressure_bar: 0.0, hold_seconds: 300, result: "PASS", leak_rate_ppm: 40 }
              as: TestTechnician
              as_user_id: "tech-1"
            - call: "POST /valve-mfg/valve-units/${u_id}/test-records"
              payload: { test_type: "FUGITIVE_EMISSION", test_bench_code: "BENCH-2", started_at: "2026-08-01T09:00:00Z", ended_at: "2026-08-01T10:00:00Z", test_pressure_bar: 0.0, hold_seconds: 100, result: "PASS", leak_rate_ppm: 140 }
              as: TestTechnician
              as_user_id: "tech-1"
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "RELEASE" }
              as: QualityManager
              as_user_id: "qm-1"
          trigger:
            - call: "POST /valve-mfg/valve-units/${u_id}/cert-actions"
              payload: { action: "CERTIFY" }
              as: QualityManager
              as_user_id: "qm-1"
          assert:
            - "ValveUnit.${u_id}.provisional_emission_leak_class == B"
            - "ValveUnit.${u_id}.final_emission_leak_class == A"
            - "ValveUnit.${u_id}.cert_status == CERTIFIED"
            - "ValveUnit.${u_id}.certified_at == 2026-08-01T00:00:00Z"
            - "ValveModel.${m_id}.qualified_special_services == [FUGITIVE_EMISSION]"
            - "ValveModel.${m_id}.status == RELEASED"

  - rule_id: combinatorial_formula
    instances:
      - name: eto_price_pinned_step_order_discount_tier_before_expedite
        grounds:
          - calculations.eto_order_price_cents
          - state_machines.EngineeredOrder.UNDER_REVIEW_to_APPROVED
          - entities.EngineeredOrder.fields.gross_quoted_cents
          - calculations.model_qualified_special_services
        distinguishing_aspect: |
          Mode (c) — pinned evaluation order: the volume discount tier is keyed on pre_discount_cents 5,900,000
          (0.03), not on the 6,180,840 grand total (which would have hit 0.06), and the 8% expedite fee is charged
          on the post-discount base; only the declared step order yields gross_quoted_cents == 6180840.
        test_recipe:
          setup:
            - "A RELEASED BALL model, class 300, bore 100 mm, seat METAL, base 420.0, required_special_services [FIRE_SAFE, CRYOGENIC]."
            - "A prototype unit of that model with PASS SHELL, SEAT, FIRE_SAFE and CRYOGENIC records, so the model's qualified_special_services covers both special services."
            - "An engineered order for 4 units at 1,250,000 cents each, requesting FIRE_SAFE and CRYOGENIC, expedited, credit limit 9,000,000, submitted for review."
          setup_api_calls:
            - call: "POST /valve-mfg/foundries"
              payload: { foundry_code: "FDY-03", name: "Gamma Castings", country_code: "IN" }
              as: ProcurementSpecialist
              captures: { f_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications"
              payload: { foundry_id: "${f_id}", process: "CASTING", material_grade: "CF8M", max_pressure_class: 600, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: ProcurementSpecialist
              captures: { q_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications/${q_id}/actions"
              payload: { action: "QUALIFY" }
              as: QualityManager
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-SS", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 420.0, required_special_services: ["FIRE_SAFE", "CRYOGENIC"] }
              as: ProductEngineer
              captures: { m_id: $.data.id }
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ProductEngineer
            - call: "POST /valve-mfg/heat-lots"
              payload: { foundry_id: "${f_id}", heat_number: "H-3001", material_grade: "CF8M", process: "CASTING", qty_received_kg: 500.000, mtr_document_ref: "MTR-3001", carbon_equivalent_pct: 0.35, impact_energy_j: 40 }
              as: ProcurementSpecialist
              captures: { l_id: $.data.id }
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "VERIFY" }
              as: QualityManager
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "RELEASE" }
              as: QualityManager
            - call: "POST /valve-mfg/components"
              payload: { heat_lot_id: "${l_id}", target_model_id: "${m_id}", component_type: "BODY", net_weight_kg: 120.500 }
              as: ProcurementSpecialist
              captures: { c_id: $.data.id }
            - call: "POST /valve-mfg/monogram-licenses"
              payload: { license_code: "MON-03", facility_code: "FAC-1", scope_valve_types: ["BALL"], lead_auditor_user_id: "aud-1", audit_window_start: "2026-07-01T00:00:00Z", audit_window_end: "2026-07-31T00:00:00Z" }
              as: QualityManager
              captures: { lic_id: $.data.id }
            - call: "POST /valve-mfg/valve-units"
              payload: { model_id: "${m_id}", body_component_id: "${c_id}", monogram_license_id: "${lic_id}", serial_number: "SN-PROTO", special_services: ["FIRE_SAFE", "CRYOGENIC"] }
              as: ProductEngineer
              captures: { u_id: $.data.id }
            - call: "POST /valve-mfg/valve-units/${u_id}/build-actions"
              payload: { action: "ADVANCE", to_build_status: "MACHINED" }
              as: TestTechnician
              as_user_id: "tech-1"
            - call: "POST /valve-mfg/valve-units/${u_id}/build-actions"
              payload: { action: "ADVANCE", to_build_status: "ASSEMBLED" }
              as: TestTechnician
              as_user_id: "tech-1"
            - call: "POST /valve-mfg/valve-units/${u_id}/test-records"
              payload: { test_type: "SHELL", test_bench_code: "BENCH-1", started_at: "2026-08-01T08:00:00Z", ended_at: "2026-08-01T09:00:00Z", test_pressure_bar: 80.0, hold_seconds: 60, result: "PASS" }
              as: TestTechnician
              as_user_id: "tech-1"
            - call: "POST /valve-mfg/valve-units/${u_id}/test-records"
              payload: { test_type: "SEAT", test_bench_code: "BENCH-1", started_at: "2026-08-01T09:00:00Z", ended_at: "2026-08-01T10:00:00Z", test_pressure_bar: 60.0, hold_seconds: 60, result: "PASS" }
              as: TestTechnician
              as_user_id: "tech-1"
