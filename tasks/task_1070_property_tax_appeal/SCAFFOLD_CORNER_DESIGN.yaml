        distinguishing_aspect: "After issuing a 28250 invoice and paying 10000, Client.outstanding_balance_cents == 18250 and Invoice stays ISSUED (not PAID)."
        test_recipe:
          setup: ["Issued invoice fee 28250 (decision 27000000, realized 75000)."]
          setup_api_calls:
            - call: "POST /api/analysts"
              payload: { full_name: "A", email: "cx3@f.test", license_number: "XL3" }
              as: FirmAdmin
              captures: { an_id: $.data.id }
            - call: "POST /api/analysts"
              payload: { full_name: "B", email: "cx3b@f.test", license_number: "XL3b" }
              as: FirmAdmin
              captures: { an2_id: $.data.id }
            - call: "POST /api/clients"
              payload: { full_name: "CX3", email: "cx3c@x.test", entity_type: "INDIVIDUAL" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /api/jurisdictions"
              payload: { name: "JXP", state_code: "CA", filing_window_days: 60, equalization_ratio: 0.90 }
              as: FirmAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /api/fee-agreements"
              payload: { client_id: "${cl_id}" }
              as: FirmAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /api/fee-agreements/${fa_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /api/parcels"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${jur_id}", apn: "XX3", address: "a", property_class: "RESIDENTIAL" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { p_id: $.data.id }
            - call: "POST /api/assessments"
              payload: { parcel_id: "${p_id}", tax_year: 2026, original_assessed_value_cents: 30000000, millage_rate: 25.0, notice_date: "2026-06-15T00:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { as_id: $.data.id }
            - call: "POST /api/appeals"
              payload: { assessment_id: "${as_id}", analyst_id: "${an_id}", fee_agreement_id: "${fa_id}", valuation_method: "SALES_COMPARISON" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /api/appeals/${ap_id}/evidence"
              payload: { comp_address: "x", sale_price_cents: 30000000, sale_date: "2025-06-01T00:00:00Z", comp_assessed_value_cents: 27000000, adjustment_pct: 0.00 }
              as: Analyst
              as_user_id: "${an_id}"
            - call: "POST /api/appeals/${ap_id}/file"
              payload: {}
              as: Analyst
              as_user_id: "${an_id}"
            - call: "POST /api/appeals/${ap_id}/hearings"
              payload: { representative_id: "${an2_id}", docket_room: "R1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { h_id: $.data.id }
            - call: "POST /api/hearings/${h_id}/hold"
              payload: {}
              as: Analyst
              as_user_id: "${an2_id}"
            - call: "POST /api/appeals/${ap_id}/record-decision"
              payload: { decision_value_cents: 27000000 }
              as: Analyst
              as_user_id: "${an_id}"
            - call: "GET /api/invoices?appeal_id=${ap_id}"
              as: Billing
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /api/invoices/${inv_id}/issue"
              payload: {}
              as: Billing
          trigger:
            - call: "POST /api/invoices/${inv_id}/payments"
              payload: { amount_cents: 10000, method: "CHECK" }
              as: Billing
              captures: { pay_id: $.data.id }
          assert:
            - "Invoice.${inv_id}.amount_paid_cents == 10000"
            - "Invoice.${inv_id}.status == ISSUED"
            - "Client.${cl_id}.outstanding_balance_cents == 18250"

  - section: consistency_model
    instances:
      - name: corner_immediate_visibility_on_client_create
        claim_type: immediate
        grounds: [entities.Client]
        distinguishing_aspect: "POST /api/clients returns the server-minted id and defaults in the SAME response (immediate consistency)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/clients"
              payload: { full_name: "Now", email: "now@x.test", entity_type: "INDIVIDUAL" }
              as: FirmAdmin
              captures: { cl_id: $.data.id, ver: $.data.version }
          assert:
            - "response data.id is a non-empty UUID"
            - "Client.${cl_id}.version == 1"
