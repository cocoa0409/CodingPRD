scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — dual_variant_calc (3 instances, 3 different entity domains)
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ratio_headcount_vs_listing_count_divergence
        grounds:
          - calculations.network_ratio_headcount
          - entities.RegionSpecialtyResult.fields.provider_count
          - entities.RegionSpecialtyResult.fields.listing_count
          - entities.RegionSpecialtyResult.fields.ratio_ok
        distinguishing_aspect: |
          Entity domain = RegionSpecialtyResult (network adequacy). With one provider listed at two
          locations, the OFFICIAL headcount variant counts 1 provider (ratio 2400 > 1200*1, DEFICIENT)
          while the listing-count variant counts 2 (ratio 1200, would pass) — identical input data,
          two valid counting interpretations, opposite compliance verdicts.
        test_recipe:
          setup:
            - "Clock at 2026-05-01; URBAN region R enrolled 2400; CARDIOLOGY/URBAN standard max_members_per_provider=1200"
            - "One EFFECTIVE provider P (effective 2026-04-01) with two OPEN-panel locations L1,L2 in R, each hosting a LISTED CARDIOLOGY listing"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06001", name: "Alameda", geo_class: "URBAN", enrolled_member_count: 2400 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "CARDIOLOGY", geo_class: "URBAN", max_members_per_provider: 1200, max_travel_minutes: 30, max_travel_miles: 15, max_wait_days_routine: 15, max_wait_days_urgent: 2 }, as: NetworkManager }
            - { call: "POST /network/providers", payload: { npi: "1000000001", legal_name: "Heart One", specialty: "CARDIOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { prov: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${prov}", region_id: "${reg}", address_line: "1 Main St", panel_status: "OPEN", avg_travel_minutes: 10, avg_travel_miles: 5 }, as: NetworkManager, captures: { loc1: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${prov}", region_id: "${reg}", address_line: "2 Oak Ave", panel_status: "OPEN", avg_travel_minutes: 12, avg_travel_miles: 6 }, as: NetworkManager, captures: { loc2: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${prov}", location_id: "${loc1}", specialty: "CARDIOLOGY", display_name: "Heart One Main", phone: "555-0101", accepts_new_patients: true }, as: NetworkManager, captures: { lst1: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${prov}", location_id: "${loc2}", specialty: "CARDIOLOGY", display_name: "Heart One Oak", phone: "555-0102", accepts_new_patients: true }, as: NetworkManager, captures: { lst2: "$.data.id" } }
            - { call: "POST /network/listings/${lst1}/publish", as: NetworkManager }
            - { call: "POST /network/listings/${lst2}/publish", as: NetworkManager }
          trigger:
            - { call: "POST /network/evaluations", payload: { measurement_period: "2026-Q2", period_start_date: "2026-06-01", period_end_date: "2026-06-11" }, as: NetworkManager, captures: { ev: "$.data.id" } }
            - { call: "POST /network/evaluations/${ev}/finalize", as: NetworkManager }
            - { call: "GET /network/results", payload: { evaluation_id: "${ev}", region_id: "${reg}" }, as: NetworkManager, captures: { r_count: "$.data[0].provider_count", r_listings: "$.data[0].listing_count", r_ratio: "$.data[0].ratio_members_per_provider", r_ok: "$.data[0].ratio_ok", r_overall: "$.data[0].overall_status" } }
          assert:
            - "RegionSpecialtyResult.provider_count == 1 (headcount variant counts the distinct provider once)"
            - "RegionSpecialtyResult.listing_count == 2 (listing variant counts both listings)"
            - "RegionSpecialtyResult.ratio_members_per_provider == 2400.0"
            - "RegionSpecialtyResult.ratio_ok == false (2400 > 1200 * 1)"
            - "RegionSpecialtyResult.overall_status == DEFICIENT — the official headcount variant governs even though the listing variant ratio 2400/2 = 1200 would comply"

      - name: wait_time_mean_vs_p90_divergence
        grounds:
          - calculations.wait_time_compliance
          - entities.RegionSpecialtyResult.fields.mean_wait_days
          - entities.RegionSpecialtyResult.fields.p90_wait_days
          - entities.RegionSpecialtyResult.fields.wait_time_compliant
        distinguishing_aspect: |
          Entity domain = AvailabilityProbe aggregation (appointment availability). Days sample
          [3,5,6,7,20]: official mean gate gives 8.2 <= 15 (compliant) while the p90 filing variant
          reads 20 > 15 — same probes, two valid statistics, opposite verdicts; the p90 is reported
          but must NOT gate overall_status.
        test_recipe:
          setup:
            - "Clock inside measurement period; URBAN region R enrolled 500; CARDIOLOGY/URBAN standard wait_routine=15"
            - "One EFFECTIVE provider with one OPEN location and one LISTED CARDIOLOGY listing; 5 ROUTINE probes requested 2026-06-02, recorded KEPT with offered dates yielding waits 3,5,6,7,20 days"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06003", name: "Alpine", geo_class: "URBAN", enrolled_member_count: 500 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "CARDIOLOGY", geo_class: "URBAN", max_members_per_provider: 1200, max_travel_minutes: 30, max_travel_miles: 15, max_wait_days_routine: 15, max_wait_days_urgent: 2 }, as: NetworkManager }
            - { call: "POST /network/providers", payload: { npi: "1000000003", legal_name: "Heart Three", specialty: "CARDIOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { prov: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${prov}", region_id: "${reg}", address_line: "3 Pine St", panel_status: "OPEN", avg_travel_minutes: 10, avg_travel_miles: 5 }, as: NetworkManager, captures: { loc: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${prov}", location_id: "${loc}", specialty: "CARDIOLOGY", display_name: "Heart Three", phone: "555-0103", accepts_new_patients: true }, as: NetworkManager, captures: { lst: "$.data.id" } }
            - { call: "POST /network/listings/${lst}/publish", as: NetworkManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T09:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/probes", payload: { listing_id: "${lst}", probe_type: "ROUTINE", requested_date: "2026-06-02" }, as: NetworkManager, captures: { pb1: "$.data.id" } }
            - { call: "POST /network/probes", payload: { listing_id: "${lst}", probe_type: "ROUTINE", requested_date: "2026-06-02" }, as: NetworkManager, captures: { pb2: "$.data.id" } }
            - { call: "POST /network/probes", payload: { listing_id: "${lst}", probe_type: "ROUTINE", requested_date: "2026-06-02" }, as: NetworkManager, captures: { pb3: "$.data.id" } }
            - { call: "POST /network/probes", payload: { listing_id: "${lst}", probe_type: "ROUTINE", requested_date: "2026-06-02" }, as: NetworkManager, captures: { pb4: "$.data.id" } }
            - { call: "POST /network/probes", payload: { listing_id: "${lst}", probe_type: "ROUTINE", requested_date: "2026-06-02" }, as: NetworkManager, captures: { pb5: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-22T09:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/probes/${pb1}/record", payload: { outcome: "KEPT", offered_appointment_date: "2026-06-05" }, as: NetworkManager }
            - { call: "POST /network/probes/${pb2}/record", payload: { outcome: "KEPT", offered_appointment_date: "2026-06-07" }, as: NetworkManager }
            - { call: "POST /network/probes/${pb3}/record", payload: { outcome: "KEPT", offered_appointment_date: "2026-06-08" }, as: NetworkManager }
            - { call: "POST /network/probes/${pb4}/record", payload: { outcome: "KEPT", offered_appointment_date: "2026-06-09" }, as: NetworkManager }
            - { call: "POST /network/probes/${pb5}/record", payload: { outcome: "KEPT", offered_appointment_date: "2026-06-22" }, as: NetworkManager }
          trigger:
            - { call: "POST /network/evaluations", payload: { measurement_period: "2026-06", period_start_date: "2026-06-01", period_end_date: "2026-06-30" }, as: NetworkManager, captures: { ev: "$.data.id" } }
            - { call: "POST /network/evaluations/${ev}/finalize", as: NetworkManager }
            - { call: "GET /network/results", payload: { evaluation_id: "${ev}", region_id: "${reg}" }, as: NetworkManager, captures: { r_mean: "$.data[0].mean_wait_days", r_p90: "$.data[0].p90_wait_days", r_waitok: "$.data[0].wait_time_compliant", r_overall: "$.data[0].overall_status" } }
          assert:
            - "RegionSpecialtyResult.mean_wait_days == 8.2 (mean of 3,5,6,7,20)"
            - "RegionSpecialtyResult.p90_wait_days == 20 (sorted ASC, 1-based index ceil(0.9*5) = 5)"
            - "RegionSpecialtyResult.wait_time_compliant == true (official mean gate 8.2 <= 15)"
            - "RegionSpecialtyResult.overall_status == COMPLIANT — the p90 variant reading (20 > 15) is reported but does not gate"

      - name: attestation_response_rate_strict_vs_lenient
        grounds:
          - calculations.attestation_response_rate
          - entities.AttestationCycle.fields.responded_count
          - entities.AttestationCycle.fields.total_records
        distinguishing_aspect: |
          Entity domain = AttestationCycle (directory attestation). With one record ATTESTED and one
          CORRECTION_REQUESTED out of two, the strict rate numerator counts 1 while the lenient
          numerator counts 2 — identical records, two valid response-rate interpretations.
        test_recipe:
          setup:
            - "Two LISTED listings of one EFFECTIVE provider; attestation cycle opened (2 PENDING records); provider rep attests one cleanly and requests a correction on the other"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06005", name: "Butte", geo_class: "URBAN", enrolled_member_count: 100 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "CARDIOLOGY", geo_class: "URBAN", max_members_per_provider: 1200, max_travel_minutes: 30, max_travel_miles: 15, max_wait_days_routine: 15, max_wait_days_urgent: 2 }, as: NetworkManager }
            - { call: "POST /network/providers", payload: { npi: "1000000005", legal_name: "Heart Five", specialty: "CARDIOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { prov: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${prov}", region_id: "${reg}", address_line: "5 Elm St", panel_status: "OPEN", avg_travel_minutes: 10, avg_travel_miles: 5 }, as: NetworkManager, captures: { loc1: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${prov}", region_id: "${reg}", address_line: "7 Elm St", panel_status: "OPEN", avg_travel_minutes: 11, avg_travel_miles: 5 }, as: NetworkManager, captures: { loc2: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${prov}", location_id: "${loc1}", specialty: "CARDIOLOGY", display_name: "Five A", phone: "555-0105", accepts_new_patients: true }, as: NetworkManager, captures: { lst1: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${prov}", location_id: "${loc2}", specialty: "CARDIOLOGY", display_name: "Five B", phone: "555-0106", accepts_new_patients: true }, as: NetworkManager, captures: { lst2: "$.data.id" } }
            - { call: "POST /network/listings/${lst1}/publish", as: NetworkManager }
            - { call: "POST /network/listings/${lst2}/publish", as: NetworkManager }
            - { call: "POST /network/attestation-cycles", payload: { cycle_label: "2026-Q2A", open_date: "2026-05-01", due_date: "2026-05-10", outreach_close_date: "2026-05-20" }, as: NetworkManager, captures: { cyc: "$.data.id" } }
            - { call: "POST /network/attestation-cycles/${cyc}/advance", as: NetworkManager }
            - { call: "GET /network/attestation-records", payload: { cycle_id: "${cyc}", listing_id: "${lst1}" }, as: NetworkManager, captures: { rec1: "$.data[0].id" } }
            - { call: "GET /network/attestation-records", payload: { cycle_id: "${cyc}", listing_id: "${lst2}" }, as: NetworkManager, captures: { rec2: "$.data[0].id" } }
          trigger:
            - { call: "POST /network/attestation-records/${rec1}/respond", payload: { data_accurate: true }, as: ProviderRep, as_user_id: "${prov}" }
            - { call: "POST /network/attestation-records/${rec2}/respond", payload: { data_accurate: false, corrected_payload: { phone: "555-0199" } }, as: ProviderRep, as_user_id: "${prov}" }
            - { call: "GET /network/attestation-cycles/${cyc}", as: NetworkManager, captures: { c_total: "$.data.total_records", c_resp: "$.data.responded_count", c_pend: "$.data.pending_count" } }
          assert:
            - "AttestationCycle.total_records == 2"
            - "AttestationCycle.responded_count == 2 (lenient numerator: ATTESTED + CORRECTION_REQUESTED)"
            - "AttestationCycle.pending_count == 0"
            - "strict numerator (ATTESTED only) == 1 — strict rate 0.5 vs lenient rate 1.0 for identical records"
            - "a DirectoryCorrection with changes.phone == '555-0199' and status SUBMITTED was spawned for listing ${lst2}"

  # =================================================================
  # Rule 2 — combinatorial_formula (2 instances, modes (a) and (b))
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: deficiency_penalty_tier_repeat_interplay
        grounds:
          - calculations.deficiency_penalty_accrual
          - entities.DeficiencyRecord.fields.prior_closure_count
          - entities.DeficiencyRecord.fields.last_accrual_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (days, member-count tier, prior-closure repeat count) with non-linear
          interaction (tiered branch + conditional repeat multiplier + nested min cap). A deficiency
          reopened after one prior closure on a 12000-member region accrues
          9999 * 9 days * 1.5 tier * 1.5 repeat = 202479.75 -> 202480 cents.
        test_recipe:
          setup:
            - "URBAN region R enrolled 12000 (tier mult 1.5); DERMATOLOGY/URBAN standard max 15000; no dermatology providers initially"
            - "Eval E1 (2026-06-01..2026-06-11) finalized DEFICIENT -> D1 OPEN accrues 149985; then a dermatologist is published and E2 (06-12..06-21) closes D1; provider terminated; E3 (06-22..07-01, 9 days) opens D2 with prior_closure_count == 1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06007", name: "Colusa", geo_class: "URBAN", enrolled_member_count: 12000 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "DERMATOLOGY", geo_class: "URBAN", max_members_per_provider: 15000, max_travel_minutes: 45, max_travel_miles: 30, max_wait_days_routine: 20, max_wait_days_urgent: 3 }, as: NetworkManager }
            - { call: "POST /network/evaluations", payload: { measurement_period: "E1", period_start_date: "2026-06-01", period_end_date: "2026-06-11" }, as: NetworkManager, captures: { ev1: "$.data.id" } }
            - { call: "POST /network/evaluations/${ev1}/finalize", as: NetworkManager }
            - { call: "GET /network/deficiencies", payload: { evaluation_id: "${ev1}", region_id: "${reg}" }, as: NetworkManager, captures: { d1: "$.data[0].id", d1_accrued: "$.data[0].accrued_penalty_cents" } }
            - { call: "POST /network/providers", payload: { npi: "1000000007", legal_name: "Derm One", specialty: "DERMATOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { prov: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${prov}", region_id: "${reg}", address_line: "9 Birch Rd", panel_status: "OPEN", avg_travel_minutes: 20, avg_travel_miles: 10 }, as: NetworkManager, captures: { loc: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${prov}", location_id: "${loc}", specialty: "DERMATOLOGY", display_name: "Derm One", phone: "555-0107", accepts_new_patients: true }, as: NetworkManager, captures: { lst: "$.data.id" } }
            - { call: "POST /network/listings/${lst}/publish", as: NetworkManager }
            - { call: "POST /network/evaluations", payload: { measurement_period: "E2", period_start_date: "2026-06-12", period_end_date: "2026-06-21" }, as: NetworkManager, captures: { ev2: "$.data.id" } }
            - { call: "POST /network/evaluations/${ev2}/finalize", as: NetworkManager }
            - { call: "PATCH /network/providers/${prov}", payload: { to_status: "TERMINATED" }, as: NetworkManager }
          trigger:
            - { call: "POST /network/evaluations", payload: { measurement_period: "E3", period_start_date: "2026-06-22", period_end_date: "2026-07-01" }, as: NetworkManager, captures: { ev3: "$.data.id" } }
            - { call: "POST /network/evaluations/${ev3}/finalize", as: NetworkManager }
            - { call: "GET /network/deficiencies", payload: { evaluation_id: "${ev3}", region_id: "${reg}" }, as: NetworkManager, captures: { d2_prior: "$.data[0].prior_closure_count", d2_last: "$.data[0].last_accrual_cents", d2_accrued: "$.data[0].accrued_penalty_cents" } }
            - { call: "GET /network/evaluations/${ev3}", as: NetworkManager, captures: { ev3_total: "$.data.total_penalty_cents" } }
          assert:
            - "DeficiencyRecord D1 (from E1) accrued_penalty_cents == 149985 (9999*10*1.5*1.0)"
            - "DeficiencyRecord ${d2} prior_closure_count == 1 (one CLOSED record for the pair at creation)"
            - "DeficiencyRecord ${d2} last_accrual_cents == 202480 (9999*9*1.5*1.5 = 202479.75, round_half_up)"
            - "AdequacyEvaluation ${ev3} total_penalty_cents == 202480"

      - name: evaluation_rollup_round_per_row_then_sum
        grounds:
          - calculations.evaluation_penalty_rollup
          - entities.AdequacyEvaluation.fields.total_penalty_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Two regions each accrue raw 44995.5 cents
          (9999*3*1.5); pinned order rounds each row first (44996 + 44996 = 89992) — the forbidden
          sum-then-round order yields round(89991.0) = 89991, one cent less.
        test_recipe:
          setup:
            - "Two URBAN regions enrolled 11000 and 12000; DERMATOLOGY/URBAN standard max 15000; zero dermatology providers anywhere; evaluation period 2026-06-01..2026-06-04 (3 days)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06009", name: "Del Norte", geo_class: "URBAN", enrolled_member_count: 11000 }, as: NetworkManager, captures: { reg1: "$.data.id" } }
            - { call: "POST /network/regions", payload: { county_fips: "06011", name: "Fresno", geo_class: "URBAN", enrolled_member_count: 12000 }, as: NetworkManager, captures: { reg2: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "DERMATOLOGY", geo_class: "URBAN", max_members_per_provider: 15000, max_travel_minutes: 45, max_travel_miles: 30, max_wait_days_routine: 20, max_wait_days_urgent: 3 }, as: NetworkManager }
          trigger:
            - { call: "POST /network/evaluations", payload: { measurement_period: "R1", period_start_date: "2026-06-01", period_end_date: "2026-06-04" }, as: NetworkManager, captures: { ev: "$.data.id" } }
            - { call: "POST /network/evaluations/${ev}/finalize", as: NetworkManager }
            - { call: "GET /network/evaluations/${ev}", as: NetworkManager, captures: { ev_total: "$.data.total_penalty_cents" } }
            - { call: "GET /network/deficiencies", payload: { evaluation_id: "${ev}", region_id: "${reg1}" }, as: NetworkManager, captures: { d1_last: "$.data[0].last_accrual_cents" } }
          assert:
            - "each DeficiencyRecord.last_accrual_cents == 44996 (raw 44995.5 rounded per row, round_half_up)"
            - "AdequacyEvaluation.total_penalty_cents == 89992 — per-row rounding THEN summation; sum-then-round would give 89991"

  # =================================================================
  # Rule 3 — non_linear_state_machine (2 instances, different entities)
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: access_plan_denied_resubmit_cycle
        grounds:
          - state_machines.AccessPlanRequest.DENIED_to_SUBMITTED
          - state_machines.AccessPlanRequest.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          AccessPlanRequest is cyclic: DRAFT -> SUBMITTED -> DENIED -> SUBMITTED -> APPROVED. The
          DENIED state is not terminal; resubmission reuses the same request and clears decided_at.
        test_recipe:
          setup:
            - "URBAN region enrolled 12000; DERMATOLOGY standard max 15000; zero providers; E1 finalized 2026-06-01..06-11 -> deficiency D OPEN with accrual 149985; clock 2026-06-15"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06013", name: "Glenn", geo_class: "URBAN", enrolled_member_count: 12000 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "DERMATOLOGY", geo_class: "URBAN", max_members_per_provider: 15000, max_travel_minutes: 45, max_travel_miles: 30, max_wait_days_routine: 20, max_wait_days_urgent: 3 }, as: NetworkManager }
            - { call: "POST /network/evaluations", payload: { measurement_period: "E1", period_start_date: "2026-06-01", period_end_date: "2026-06-11" }, as: NetworkManager, captures: { ev1: "$.data.id" } }
            - { call: "POST /network/evaluations/${ev1}/finalize", as: NetworkManager }
            - { call: "GET /network/deficiencies", payload: { evaluation_id: "${ev1}", region_id: "${reg}" }, as: NetworkManager, captures: { d1: "$.data[0].id", d1_v: "$.data[0].version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/deficiencies/${d1}/access-plan-requests", payload: { expected_deficiency_version: "${d1_v}", remedy_summary: "Contract two dermatologists", excuse_start_date: "2026-07-01", excuse_through_date: "2026-07-31" }, as: NetworkManager, captures: { req: "$.data.id" } }
          trigger:
            - { call: "POST /network/access-plan-requests/${req}/submit", as: NetworkManager, captures: { st1: "$.data.status" } }
            - { call: "POST /network/access-plan-requests/${req}/decide", payload: { decision: "DENIED", notes: "insufficient remedy detail" }, as: Regulator, captures: { st2: "$.data.status" } }
            - { call: "POST /network/access-plan-requests/${req}/submit", as: NetworkManager, captures: { st3: "$.data.status" } }
            - { call: "POST /network/access-plan-requests/${req}/decide", payload: { decision: "APPROVED", notes: "revised plan accepted" }, as: Regulator, captures: { st4: "$.data.status" } }
            - { call: "GET /network/deficiencies/${d1}", as: NetworkManager, captures: { d_status: "$.data.status", d_out: "$.data.outstanding_penalty_cents" } }
          assert:
            - "status after first submit == SUBMITTED"
            - "status after DENIED decision == DENIED with decided_at set"
            - "status after resubmit == SUBMITTED (cycle DENIED -> SUBMITTED traversed)"
            - "final status == APPROVED"
            - "DeficiencyRecord ${d1}.status == EXCUSED and outstanding_penalty_cents == 0"

      - name: listing_suppress_reinstate_cycle
        grounds:
          - state_machines.DirectoryListing.LISTED_to_SUPPRESSED
          - state_machines.DirectoryListing.SUPPRESSED_to_LISTED
        distinguishing_aspect: |
          DirectoryListing is cyclic: LISTED -> SUPPRESSED (MANUAL) -> LISTED. Reinstatement clears
          suppress_reason back to NONE and restores the listing to the adequacy counted set.
        test_recipe:
          setup:
            - "One published LISTED listing of an EFFECTIVE provider"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06015", name: "Humboldt", geo_class: "URBAN", enrolled_member_count: 100 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "CARDIOLOGY", geo_class: "URBAN", max_members_per_provider: 1200, max_travel_minutes: 30, max_travel_miles: 15, max_wait_days_routine: 15, max_wait_days_urgent: 2 }, as: NetworkManager }
            - { call: "POST /network/providers", payload: { npi: "1000000009", legal_name: "Heart Nine", specialty: "CARDIOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { prov: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${prov}", region_id: "${reg}", address_line: "11 Cedar St", panel_status: "OPEN", avg_travel_minutes: 10, avg_travel_miles: 5 }, as: NetworkManager, captures: { loc: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${prov}", location_id: "${loc}", specialty: "CARDIOLOGY", display_name: "Heart Nine", phone: "555-0109", accepts_new_patients: true }, as: NetworkManager, captures: { lst: "$.data.id" } }
            - { call: "POST /network/listings/${lst}/publish", as: NetworkManager, captures: { lst_v1: "$.data.version" } }
          trigger:
            - { call: "PATCH /network/listings/${lst}", payload: { expected_listing_version: "${lst_v1}", to_status: "SUPPRESSED", suppress_reason: "MANUAL" }, as: NetworkManager, captures: { lst_v2: "$.data.version", st_sup: "$.data.status", sr_sup: "$.data.suppress_reason" } }
            - { call: "PATCH /network/listings/${lst}", payload: { expected_listing_version: "${lst_v2}", to_status: "LISTED" }, as: NetworkManager, captures: { st_back: "$.data.status", sr_back: "$.data.suppress_reason" } }
            - { call: "GET /network/listings", payload: { provider_id: "${prov}", status: "LISTED" }, as: NetworkManager, captures: { n_listed: "$.data[0].status" } }
          assert:
            - "after suppress: status == SUPPRESSED, suppress_reason == MANUAL, suppressed_at set"
            - "after reinstate: status == LISTED, suppress_reason == NONE"
            - "GET /network/listings?status=LISTED returns the listing again (count restored to 1)"
            - "ghost_strike_count == 0 throughout"
  # =================================================================
  # Rule 4 — transitive_cascade (2 instances, different triggers)
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: finalize_result_deficiency_accrual_rollup_chain
        grounds:
          - state_machines.AdequacyEvaluation.OPEN_to_FINALIZED
          - calculations.deficiency_penalty_accrual
          - calculations.evaluation_penalty_rollup
        distinguishing_aspect: |
          Depth-4 chain from the finalize trigger: evaluation FINALIZED -> RegionSpecialtyResult rows
          created (link 1) -> DEFICIENT pair opens DeficiencyRecord (link 2) -> deficiency accrues
          penalty 9999*10*1.5 = 149985 (link 3) -> evaluation.total_penalty_cents rollup updated
          (link 4). Each link is caused by the previous one, not by the original call.
        test_recipe:
          setup:
            - "URBAN region enrolled 12000; DERMATOLOGY/URBAN standard max 15000; zero dermatology providers; evaluation E1 OPEN for 2026-06-01..2026-06-11 (10 days)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06017", name: "Imperial", geo_class: "URBAN", enrolled_member_count: 12000 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "DERMATOLOGY", geo_class: "URBAN", max_members_per_provider: 15000, max_travel_minutes: 45, max_travel_miles: 30, max_wait_days_routine: 20, max_wait_days_urgent: 3 }, as: NetworkManager }
            - { call: "POST /network/evaluations", payload: { measurement_period: "E1", period_start_date: "2026-06-01", period_end_date: "2026-06-11" }, as: NetworkManager, captures: { ev1: "$.data.id" } }
          trigger:
            - { call: "POST /network/evaluations/${ev1}/finalize", as: NetworkManager }
            - { call: "GET /network/results", payload: { evaluation_id: "${ev1}", region_id: "${reg}" }, as: NetworkManager, captures: { r_overall: "$.data[0].overall_status", r_pc: "$.data[0].provider_count" } }
            - { call: "GET /network/deficiencies", payload: { evaluation_id: "${ev1}", region_id: "${reg}" }, as: NetworkManager, captures: { d_status: "$.data[0].status", d_opened: "$.data[0].opened_date", d_last: "$.data[0].last_accrual_cents", d_out: "$.data[0].outstanding_penalty_cents" } }
            - { call: "GET /network/evaluations/${ev1}", as: NetworkManager, captures: { ev_status: "$.data.status", ev_total: "$.data.total_penalty_cents" } }
          assert:
            - "link 1: RegionSpecialtyResult row exists with overall_status == DEFICIENT, provider_count == 0"
            - "link 2: DeficiencyRecord created with status == OPEN and opened_date == '2026-06-01'"
            - "link 3: deficiency last_accrual_cents == 149985 and outstanding_penalty_cents == 149985"
            - "link 4: evaluation status == FINALIZED and total_penalty_cents == 149985"

      - name: provider_terminate_removes_listings_cancels_records_updates_cycle
        grounds:
          - state_machines.Provider.EFFECTIVE_to_TERMINATED
          - state_machines.AttestationRecord.PENDING_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger (provider terminate, not finalize): PATCH provider
          TERMINATED -> its two LISTED listings become REMOVED (link 1) -> their PENDING
          AttestationRecords in the OPEN cycle become CANCELLED (link 2) -> the owning cycle's
          computed counters recompute, dropping total_records from 2 to 0 (link 3).
        test_recipe:
          setup:
            - "EFFECTIVE provider with 2 LISTED listings; attestation cycle OPEN with 2 PENDING records (one per listing)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06019", name: "Kern", geo_class: "URBAN", enrolled_member_count: 100 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "CARDIOLOGY", geo_class: "URBAN", max_members_per_provider: 1200, max_travel_minutes: 30, max_travel_miles: 15, max_wait_days_routine: 15, max_wait_days_urgent: 2 }, as: NetworkManager }
            - { call: "POST /network/providers", payload: { npi: "1000000011", legal_name: "Heart Eleven", specialty: "CARDIOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { prov: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${prov}", region_id: "${reg}", address_line: "13 Ash St", panel_status: "OPEN", avg_travel_minutes: 10, avg_travel_miles: 5 }, as: NetworkManager, captures: { loc1: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${prov}", region_id: "${reg}", address_line: "15 Ash St", panel_status: "OPEN", avg_travel_minutes: 10, avg_travel_miles: 5 }, as: NetworkManager, captures: { loc2: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${prov}", location_id: "${loc1}", specialty: "CARDIOLOGY", display_name: "Eleven A", phone: "555-0111", accepts_new_patients: true }, as: NetworkManager, captures: { lst1: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${prov}", location_id: "${loc2}", specialty: "CARDIOLOGY", display_name: "Eleven B", phone: "555-0112", accepts_new_patients: true }, as: NetworkManager, captures: { lst2: "$.data.id" } }
            - { call: "POST /network/listings/${lst1}/publish", as: NetworkManager }
            - { call: "POST /network/listings/${lst2}/publish", as: NetworkManager }
            - { call: "POST /network/attestation-cycles", payload: { cycle_label: "2026-Q2B", open_date: "2026-05-01", due_date: "2026-05-10", outreach_close_date: "2026-05-20" }, as: NetworkManager, captures: { cyc: "$.data.id" } }
            - { call: "POST /network/attestation-cycles/${cyc}/advance", as: NetworkManager }
          trigger:
            - { call: "PATCH /network/providers/${prov}", payload: { to_status: "TERMINATED" }, as: NetworkManager }
            - { call: "GET /network/listings", payload: { provider_id: "${prov}", status: "REMOVED" }, as: NetworkManager, captures: { rem1: "$.data[0].status" } }
            - { call: "GET /network/attestation-records", payload: { cycle_id: "${cyc}", status: "CANCELLED" }, as: NetworkManager, captures: { canc1: "$.data[0].status" } }
            - { call: "GET /network/attestation-cycles/${cyc}", as: NetworkManager, captures: { c_total: "$.data.total_records", c_pend: "$.data.pending_count" } }
          assert:
            - "link 1: both listings of ${prov} have status == REMOVED"
            - "link 2: both attestation records of cycle ${cyc} have status == CANCELLED"
            - "link 3: cycle total_records == 0 and pending_count == 0 (CANCELLED excluded from total_records)"

  # =================================================================
  # Rule 5 — priority_pair_validation_conflict (3 instances, distinct category pairs)
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: publish_state_error_beats_referential_error
        grounds:
          - validations[priority=5]
          - validations[priority=8]
        distinguishing_aspect: |
          Category pair = state (priority 5) vs business_referential (priority 8). Publish of a
          DERMATOLOGY listing whose provider is SUSPENDED AND for which no DERMATOLOGY/URBAN
          standard exists must return 409 ERR_PROVIDER_NOT_EFFECTIVE, not 422 ERR_SPECIALTY_STANDARD_MISSING.
        test_recipe:
          setup:
            - "Provider created EFFECTIVE (2026-04-01) then SUSPENDED; location in URBAN region; DERMATOLOGY listing in DRAFT; NO dermatology standard exists"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06021", name: "Kings", geo_class: "URBAN", enrolled_member_count: 100 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/providers", payload: { npi: "1000000013", legal_name: "Derm Thirteen", specialty: "DERMATOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { prov: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${prov}", region_id: "${reg}", address_line: "17 Fig St", panel_status: "OPEN", avg_travel_minutes: 20, avg_travel_miles: 10 }, as: NetworkManager, captures: { loc: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${prov}", location_id: "${loc}", specialty: "DERMATOLOGY", display_name: "Derm 13", phone: "555-0113", accepts_new_patients: true }, as: NetworkManager, captures: { lst: "$.data.id" } }
            - { call: "PATCH /network/providers/${prov}", payload: { to_status: "SUSPENDED" }, as: NetworkManager }
          trigger:
            - { call: "POST /network/listings/${lst}/publish", as: NetworkManager, captures: { err: "$.data.error_id" } }
          assert:
            - "publish rejected with error_id == ERR_PROVIDER_NOT_EFFECTIVE (409), NOT ERR_SPECIALTY_STANDARD_MISSING (422) — state priority 5 beats business_referential priority 8"

      - name: file_complaint_state_error_beats_temporal_error
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          Category pair = state (priority 5) vs business_temporal (priority 7). A complaint against a
          REMOVED listing whose error_observed_date is also 121 days in the past must return
          409 ERR_LISTING_REMOVED, not 422 ERR_COMPLAINT_WINDOW_EXPIRED.
        test_recipe:
          setup:
            - "Published listing subsequently REMOVED; ENROLLED member in the same region; clock at 2026-08-01; error_observed_date 2026-04-01 (> 90 days before filing)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06023", name: "Lake", geo_class: "URBAN", enrolled_member_count: 100 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "CARDIOLOGY", geo_class: "URBAN", max_members_per_provider: 1200, max_travel_minutes: 30, max_travel_miles: 15, max_wait_days_routine: 15, max_wait_days_urgent: 2 }, as: NetworkManager }
            - { call: "POST /network/providers", payload: { npi: "1000000015", legal_name: "Heart Fifteen", specialty: "CARDIOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { prov: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${prov}", region_id: "${reg}", address_line: "19 Ivy St", panel_status: "OPEN", avg_travel_minutes: 10, avg_travel_miles: 5 }, as: NetworkManager, captures: { loc: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${prov}", location_id: "${loc}", specialty: "CARDIOLOGY", display_name: "Heart Fifteen", phone: "555-0115", accepts_new_patients: true }, as: NetworkManager, captures: { lst: "$.data.id" } }
            - { call: "POST /network/listings/${lst}/publish", as: NetworkManager, captures: { lst_v: "$.data.version" } }
            - { call: "PATCH /network/listings/${lst}", payload: { expected_listing_version: "${lst_v}", to_status: "REMOVED" }, as: NetworkManager }
            - { call: "POST /network/members", payload: { region_id: "${reg}", member_ref: "M-9001", full_name: "Ann Lee", enrolled_on: "2026-04-15" }, as: NetworkManager, captures: { mem: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkManager }
          trigger:
            - { call: "POST /network/complaints", payload: { listing_id: "${lst}", error_type: "WRONG_PHONE", error_observed_date: "2026-04-01", description: "phone disconnected" }, as: Member, as_user_id: "${mem}", captures: { err: "$.data.error_id" } }
          assert:
            - "complaint rejected with error_id == ERR_LISTING_REMOVED (409), NOT ERR_COMPLAINT_WINDOW_EXPIRED (422) — state priority 5 beats business_temporal priority 7"

      - name: cycle_advance_temporal_beats_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=9]
        distinguishing_aspect: |
          Category pair = business_temporal (priority 7) vs business_constraint (priority 9).
          Advancing cycle C2 while (a) the clock is before C2.open_date AND (b) cycle C1 is OPEN
          must return 422 ERR_CYCLE_NOT_YET_ADVANCEABLE, not 409 ERR_CYCLE_ALREADY_ACTIVE.
        test_recipe:
          setup:
            - "C1 [2026-05-01, 2026-05-20) opened at clock 2026-05-05; C2 [2026-06-01, 2026-06-20) still SCHEDULED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/attestation-cycles", payload: { cycle_label: "C1", open_date: "2026-05-01", due_date: "2026-05-10", outreach_close_date: "2026-05-20" }, as: NetworkManager, captures: { c1: "$.data.id" } }
            - { call: "POST /network/attestation-cycles/${c1}/advance", as: NetworkManager }
            - { call: "POST /network/attestation-cycles", payload: { cycle_label: "C2", open_date: "2026-06-01", due_date: "2026-06-10", outreach_close_date: "2026-06-20" }, as: NetworkManager, captures: { c2: "$.data.id" } }
          trigger:
            - { call: "POST /network/attestation-cycles/${c2}/advance", as: NetworkManager, captures: { err: "$.data.error_id" } }
          assert:
            - "advance rejected with error_id == ERR_CYCLE_NOT_YET_ADVANCEABLE (422), NOT ERR_CYCLE_ALREADY_ACTIVE (409) — temporal priority 7 beats constraint priority 9"

  # =================================================================
  # Rule 6 — boundary_precision_check (3 instances, distinct metrics/endpoints)
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ratio_exactly_at_max_boundary_compliant_vs_one_over_deficient
        grounds:
          - calculations.network_ratio_headcount
          - entities.RegionSpecialtyResult.fields.ratio_ok
        distinguishing_aspect: |
          Metric = member:provider ratio, endpoint = POST /network/evaluations/{id}/finalize.
          Boundary is INCLUSIVE: enrolled 2400 with 2 providers and max 1200 gives 2400 <= 2400
          (compliant); one member more (2401) flips the same-shaped pair to DEFICIENT.
        test_recipe:
          setup:
            - "URBAN regions R1 (enrolled 2400) and R2 (enrolled 2401); shared CARDIOLOGY/URBAN standard max 1200; each region has 2 EFFECTIVE providers with 1 OPEN location + 1 LISTED listing each"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06025", name: "Lassen", geo_class: "URBAN", enrolled_member_count: 2400 }, as: NetworkManager, captures: { reg1: "$.data.id" } }
            - { call: "POST /network/regions", payload: { county_fips: "06027", name: "Madera", geo_class: "URBAN", enrolled_member_count: 2401 }, as: NetworkManager, captures: { reg2: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "CARDIOLOGY", geo_class: "URBAN", max_members_per_provider: 1200, max_travel_minutes: 30, max_travel_miles: 15, max_wait_days_routine: 15, max_wait_days_urgent: 2 }, as: NetworkManager }
            - { call: "POST /network/providers", payload: { npi: "1000000017", legal_name: "P A1", specialty: "CARDIOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { pa1: "$.data.id" } }
            - { call: "POST /network/providers", payload: { npi: "1000000018", legal_name: "P A2", specialty: "CARDIOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { pa2: "$.data.id" } }
            - { call: "POST /network/providers", payload: { npi: "1000000019", legal_name: "P B1", specialty: "CARDIOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { pb1: "$.data.id" } }
            - { call: "POST /network/providers", payload: { npi: "1000000020", legal_name: "P B2", specialty: "CARDIOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { pb2: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${pa1}", region_id: "${reg1}", address_line: "1 A St", panel_status: "OPEN", avg_travel_minutes: 10, avg_travel_miles: 5 }, as: NetworkManager, captures: { la1: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${pa2}", region_id: "${reg1}", address_line: "2 A St", panel_status: "OPEN", avg_travel_minutes: 10, avg_travel_miles: 5 }, as: NetworkManager, captures: { la2: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${pb1}", region_id: "${reg2}", address_line: "1 B St", panel_status: "OPEN", avg_travel_minutes: 10, avg_travel_miles: 5 }, as: NetworkManager, captures: { lb1: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${pb2}", region_id: "${reg2}", address_line: "2 B St", panel_status: "OPEN", avg_travel_minutes: 10, avg_travel_miles: 5 }, as: NetworkManager, captures: { lb2: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${pa1}", location_id: "${la1}", specialty: "CARDIOLOGY", display_name: "A1", phone: "555-0201", accepts_new_patients: true }, as: NetworkManager, captures: { sa1: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${pa2}", location_id: "${la2}", specialty: "CARDIOLOGY", display_name: "A2", phone: "555-0202", accepts_new_patients: true }, as: NetworkManager, captures: { sa2: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${pb1}", location_id: "${lb1}", specialty: "CARDIOLOGY", display_name: "B1", phone: "555-0203", accepts_new_patients: true }, as: NetworkManager, captures: { sb1: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${pb2}", location_id: "${lb2}", specialty: "CARDIOLOGY", display_name: "B2", phone: "555-0204", accepts_new_patients: true }, as: NetworkManager, captures: { sb2: "$.data.id" } }
            - { call: "POST /network/listings/${sa1}/publish", as: NetworkManager }
            - { call: "POST /network/listings/${sa2}/publish", as: NetworkManager }
            - { call: "POST /network/listings/${sb1}/publish", as: NetworkManager }
            - { call: "POST /network/listings/${sb2}/publish", as: NetworkManager }
