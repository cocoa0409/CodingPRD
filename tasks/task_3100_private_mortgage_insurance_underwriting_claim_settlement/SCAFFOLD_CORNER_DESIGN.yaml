# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3100_private_mortgage_insurance_underwriting_claim_settlement
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7, walking the claim-extraction
# guide section by section. Corners already exercised by a §1.8 instance appear
# as `excluded_because:` stubs with no test_recipe.
#
# Shared fixtures are bound once with YAML anchors at their first use:
#   &mp      master policy MP-1001  (curtailments 0.12 / 0.08, LTV tolerance 0.05,
#                                    PARTICIPATION_COMPLETE, relief cycles 2,
#                                    third-party floor 1500 bps, exposure 0.35)
#   &rc_bpm  rate card credit B / band 831_TO_85 / coverage 25 / BPM / 62 bps
#   &lender_d  a delegated lender           &servicer  an active TIER_2 servicer
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:

      - name: master_policy_create_applies_defaults_and_starts_active
        claim_type: Creation
        grounds:
          - entities.MasterPolicy
          - endpoints.POST_/master-policies
          - response_envelope.success
        distinguishing_aspect: "A master policy posted without coverage_percent_default comes back 201 with the 25 percent default applied, status ACTIVE, version 1, and system-minted id and timestamps, so the omitted default is server-supplied rather than echoed."
        test_recipe:
          setup:
            - "Logical clock at the server default 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /mortgage-insurance/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: MasterPolicyAdmin
          trigger:
            - call: "POST /mortgage-insurance/master-policies"
              payload: { policy_number: "MP-DEFAULT", anniversary_utc: "2026-03-01T00:00:00Z", delegated_curtailment_rate: 0.15, nondelagated_curtailment_rate: 0.10, ltv_variance_tolerance: 0.05, servicer_loss_mitigation_standard: "PARTICIPATION", rescission_relief_cycles: 2, min_third_party_net_bps: 2000, two_year_effective_flag: false, exposure_contribution_rate: 0.50 }
              as: MasterPolicyAdmin
              captures: { mp_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "MasterPolicy.${mp_id}.coverage_percent_default == 25"
            - "MasterPolicy.${mp_id}.status == ACTIVE and MasterPolicy.${mp_id}.version == 1"
            - "the response data carries a non-null id, created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: lender_create_with_delegated_authority_round_trips_through_get
        claim_type: Retrieval
        grounds:
          - entities.Lender
          - endpoints.POST_/lenders
          - endpoints.GET_/lenders/{id}
          - errors[ERR_LENDER_NOT_FOUND]
        distinguishing_aspect: "Every Lender field round-trips through the single-resource read unchanged, including the boolean delegated_underwriting flag, and the read on an unallocated id produces the lender-specific 404 rather than a generic one."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a delegated lender already on file."
          setup_api_calls:
            - call: "POST /mortgage-insurance/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: MasterPolicyAdmin
            - call: "POST /mortgage-insurance/lenders"
              payload: { lender_name: "Cascade Mortgage", delegated_underwriting: true, policy_exposure_cap_cents: 200000000 }
              as: MasterPolicyAdmin
              captures: { lender_id: $.data.id }
          trigger:
            - call: "GET /mortgage-insurance/lenders/${lender_id}"
              payload: {}
              as: Underwriter
          assert:
            - "the response status is 200"
            - "Lender.${lender_id}.lender_name == \"Cascade Mortgage\" and delegated_underwriting == true"
            - "Lender.${lender_id}.policy_exposure_cap_cents == 200000000 and status == ACTIVE"
            - "Lender.${lender_id}.version == 1"
            - "GET /mortgage-insurance/lenders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2 returns 404 with error_id ERR_LENDER_NOT_FOUND"

      - name: loans_list_paginates_and_filters_by_coverage_status
        claim_type: Listing
        grounds:
          - endpoints.GET_/loans
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three loans on file, limit=2&offset=0 returns two rows with total_count 3 and has_more true, offset=2 returns the remaining row with has_more false, and the coverage_status filter narrows the set — total_count counts the filtered set rather than the whole table."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one delegated lender and three issued loans, the third carrying a borrower-request cancellation notice so it is not ACTIVE."
          setup_api_calls:
            - call: "POST /mortgage-insurance/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: MasterPolicyAdmin
            - &mp
              call: "POST /mortgage-insurance/master-policies"
              payload: { policy_number: "MP-1001", anniversary_utc: "2026-01-15T00:00:00Z", coverage_percent_default: 25, delegated_curtailment_rate: 0.12, nondelagated_curtailment_rate: 0.08, ltv_variance_tolerance: 0.05, servicer_loss_mitigation_standard: "PARTICIPATION_COMPLETE", rescission_relief_cycles: 2, min_third_party_net_bps: 1500, two_year_effective_flag: true, exposure_contribution_rate: 0.35 }
              as: MasterPolicyAdmin
              captures: { mp_id: $.data.id }
            - &rc_bpm
              call: "POST /mortgage-insurance/rate-cards"
              payload: { master_policy_id: "${mp_id}", credit_grade: "B", ltv_band: "831_TO_85", coverage_percent: 25, premium_plan: "BPM", rate_bps: 62, min_borrower_reserves_months: 0 }
              as: MasterPolicyAdmin
              captures: { rc_bpm_id: $.data.id }
            - &lender_d
              call: "POST /mortgage-insurance/lenders"
              payload: { lender_name: "Cascade Mortgage", delegated_underwriting: true, policy_exposure_cap_cents: 200000000 }
              as: MasterPolicyAdmin
              captures: { lender_id: $.data.id }
            - &servicer
              call: "POST /mortgage-insurance/servicers"
              payload: { servicer_name: "Northline Servicing", tier: "TIER_2", loss_mitigation_capability: "PARTICIPATION_COMPLETE" }
              as: MasterPolicyAdmin
              captures: { servicer_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications"
              payload: { lender_id: "${lender_id}", master_policy_id: "${mp_id}", rate_card_id: "${rc_bpm_id}", borrower_reference: "PAGE-A", loan_amount_cents: 34000000, property_value_cents: 40000000, credit_grade: "B", coverage_percent: 25, premium_plan: "BPM", borrower_paid: true, financed_premium: false, borrower_reserves_months: 6, county_code: "06037", term_months: 360 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications"
              payload: { lender_id: "${lender_id}", master_policy_id: "${mp_id}", rate_card_id: "${rc_bpm_id}", borrower_reference: "PAGE-B", loan_amount_cents: 34000000, property_value_cents: 40000000, credit_grade: "B", coverage_percent: 25, premium_plan: "BPM", borrower_paid: true, financed_premium: false, borrower_reserves_months: 6, county_code: "06037", term_months: 360 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { app_b_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications"
              payload: { lender_id: "${lender_id}", master_policy_id: "${mp_id}", rate_card_id: "${rc_bpm_id}", borrower_reference: "PAGE-C", loan_amount_cents: 34000000, property_value_cents: 40000000, credit_grade: "B", coverage_percent: 25, premium_plan: "BPM", borrower_paid: true, financed_premium: false, borrower_reserves_months: 6, county_code: "06037", term_months: 360 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { app_c_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications/${app_a_id}/delegated-approve"
              payload: {}
              as: Lender
              as_user_id: "${lender_id}"
            - call: "POST /mortgage-insurance/coverage-applications/${app_b_id}/delegated-approve"
              payload: {}
              as: Lender
              as_user_id: "${lender_id}"
            - call: "POST /mortgage-insurance/coverage-applications/${app_c_id}/delegated-approve"
              payload: {}
              as: Lender
              as_user_id: "${lender_id}"
            - call: "POST /mortgage-insurance/loans"
              payload: { application_id: "${app_a_id}", servicer_id: "${servicer_id}", reinsurance_treaty_id: "TREATY-NONE" }
              as: MasterPolicyAdmin
            - call: "POST /mortgage-insurance/loans"
              payload: { application_id: "${app_b_id}", servicer_id: "${servicer_id}", reinsurance_treaty_id: "TREATY-NONE" }
              as: MasterPolicyAdmin
            - call: "POST /mortgage-insurance/loans"
              payload: { application_id: "${app_c_id}", servicer_id: "${servicer_id}", reinsurance_treaty_id: "TREATY-NONE" }
              as: MasterPolicyAdmin
              captures: { loan_c_id: $.data.id }
            - call: "POST /mortgage-insurance/loans/${loan_c_id}/cancellation-notices"
              payload: { request_kind: "BORROWER_REQUEST", requested_by_role: "BORROWER", notice_utc: "2026-09-01T00:00:00Z", evidence_cents: 3000000, applied_utc: "2026-10-15T00:00:00Z" }
              as: Lender
              as_user_id: "${lender_id}"
          trigger:
            - call: "GET /mortgage-insurance/loans"
              payload: { limit: 2, offset: 0 }
              as: Underwriter
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /mortgage-insurance/loans?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /mortgage-insurance/loans?coverage_status=ACTIVE returns exactly 2 rows"
            - "GET /mortgage-insurance/loans?coverage_status=PENDING_CANCELLATION returns exactly 1 row"
            - "GET /mortgage-insurance/loans with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0"

      - name: claim_create_stamps_system_fields_and_leaves_arithmetic_null
        claim_type: System Fields
        grounds:
          - entities.Claim.fields.status
          - entities.Claim.fields.trace_number
          - endpoints.POST_/claims
        distinguishing_aspect: "A claim posted with only its business inputs comes back with status FILED, version 1, a server-minted trace number and a null settlement_option_kind, so no client-supplied status or identifier is honoured."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a delegated loan already issued."
          setup_api_calls:
            - call: "POST /mortgage-insurance/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: MasterPolicyAdmin
            - *mp
            - *rc_bpm
            - *lender_d
            - *servicer
            - call: "POST /mortgage-insurance/coverage-applications"
              payload: { lender_id: "${lender_id}", master_policy_id: "${mp_id}", rate_card_id: "${rc_bpm_id}", borrower_reference: "SYS-1", loan_amount_cents: 34000000, property_value_cents: 40000000, credit_grade: "B", coverage_percent: 25, premium_plan: "BPM", borrower_paid: true, financed_premium: false, borrower_reserves_months: 6, county_code: "06037", term_months: 360 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { app_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications/${app_id}/delegated-approve"
              payload: {}
              as: Lender
              as_user_id: "${lender_id}"
            - call: "POST /mortgage-insurance/loans"
              payload: { application_id: "${app_id}", servicer_id: "${servicer_id}", reinsurance_treaty_id: "TREATY-NONE" }
              as: MasterPolicyAdmin
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /mortgage-insurance/claims"
              payload: { loan_id: "${loan_id}", event_kind: "FORECLOSURE", event_completed_utc: "2026-08-01T00:00:00Z", unpaid_principal_cents: 8000000, accrued_interest_cents: 1500000, allowable_advances_cents: 5000000, gross_proceeds_cents: 7000000, expenses_of_sale_cents: 500000 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { claim_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Claim.${claim_id}.status == FILED and Claim.${claim_id}.version == 1"
            - "Claim.${claim_id}.trace_number is a non-null server-minted string"
            - "Claim.${claim_id}.settlement_option_kind is null"
            - "Claim.${claim_id}.net_claim_amount_cents is null and Claim.${claim_id}.settlement_amount_cents is null, so no arithmetic runs at filing"

      - name: claim_create_rejects_a_future_event_instant
        claim_type: Type Constraints
        grounds:
          - validations[priority=24]
          - errors[ERR_INVALID_REQUEST]
          - entities.Claim.fields.event_completed_utc
        distinguishing_aspect: "The range constraint on the event instant: a claim whose title-transferring event is dated after the logical clock is refused with 400 ERR_INVALID_REQUEST rather than filed and later barred by the timeout rule."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a delegated loan already issued."
          setup_api_calls:
            - call: "POST /mortgage-insurance/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: MasterPolicyAdmin
            - *mp
            - *rc_bpm
            - *lender_d
            - *servicer
            - call: "POST /mortgage-insurance/coverage-applications"
              payload: { lender_id: "${lender_id}", master_policy_id: "${mp_id}", rate_card_id: "${rc_bpm_id}", borrower_reference: "FUTURE-1", loan_amount_cents: 34000000, property_value_cents: 40000000, credit_grade: "B", coverage_percent: 25, premium_plan: "BPM", borrower_paid: true, financed_premium: false, borrower_reserves_months: 6, county_code: "06037", term_months: 360 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { app_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications/${app_id}/delegated-approve"
              payload: {}
              as: Lender
              as_user_id: "${lender_id}"
            - call: "POST /mortgage-insurance/loans"
              payload: { application_id: "${app_id}", servicer_id: "${servicer_id}", reinsurance_treaty_id: "TREATY-NONE" }
              as: MasterPolicyAdmin
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /mortgage-insurance/claims"
              payload: { loan_id: "${loan_id}", event_kind: "FORECLOSURE", event_completed_utc: "2026-12-01T00:00:00Z", unpaid_principal_cents: 8000000, accrued_interest_cents: 1500000, allowable_advances_cents: 5000000, gross_proceeds_cents: 7000000, expenses_of_sale_cents: 500000 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { error: $.data.error_id }
          assert:
            - "the response status is 400"
            - "the response error_id == ERR_INVALID_REQUEST"
            - "GET /mortgage-insurance/loans/${loan_id}/claims returns 0 rows, so the invalid claim was not persisted"

      - name: portfolio_snapshot_is_a_frozen_computed_record
        claim_type: Immutability
        grounds:
          - entities.PortfolioSnapshot
          - endpoints.POST_/portfolio-snapshots
          - endpoints.GET_/portfolio-snapshots/{id}
        distinguishing_aspect: "A snapshot is a point-in-time computed record: no update endpoint is declared for it, and re-reading it after the underlying in-force book changes still returns the originally computed segments."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one delegated loan in county 06037 and a snapshot already computed over it; the loan is then cancelled."
          setup_api_calls:
            - call: "POST /mortgage-insurance/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: MasterPolicyAdmin
            - *mp
            - *rc_bpm
            - *lender_d
            - *servicer
            - call: "POST /mortgage-insurance/coverage-applications"
              payload: { lender_id: "${lender_id}", master_policy_id: "${mp_id}", rate_card_id: "${rc_bpm_id}", borrower_reference: "SNAP-1", loan_amount_cents: 34000000, property_value_cents: 40000000, credit_grade: "B", coverage_percent: 25, premium_plan: "BPM", borrower_paid: true, financed_premium: false, borrower_reserves_months: 6, county_code: "06037", term_months: 360 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { app_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications/${app_id}/delegated-approve"
              payload: {}
              as: Lender
              as_user_id: "${lender_id}"
            - call: "POST /mortgage-insurance/loans"
              payload: { application_id: "${app_id}", servicer_id: "${servicer_id}", reinsurance_treaty_id: "TREATY-NONE" }
              as: MasterPolicyAdmin
              captures: { loan_id: $.data.id }
            - call: "POST /mortgage-insurance/portfolio-snapshots"
              payload: { snapshot_utc: "2026-09-01T00:00:00Z", cluster_in_force_threshold_cents: 8000000 }
              as: MasterPolicyAdmin
              captures: { snapshot_id: $.data.id }
            - call: "POST /mortgage-insurance/loans/${loan_id}/cancellation-notices"
              payload: { request_kind: "BORROWER_REQUEST", requested_by_role: "BORROWER", notice_utc: "2026-09-01T00:00:00Z", evidence_cents: 3000000, applied_utc: "2026-09-30T00:00:00Z" }
              as: Lender
              as_user_id: "${lender_id}"
            - call: "POST /mortgage-insurance/_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T00:00:00Z" }
              as: MasterPolicyAdmin
          trigger:
            - call: "GET /mortgage-insurance/portfolio-snapshots/${snapshot_id}"
              payload: {}
              as: MasterPolicyAdmin
          assert:
            - "the response status is 200"
            - "PortfolioSnapshot.${snapshot_id}.geography_totals still reports county 06037 with total 8500000 despite the later cancellation"
            - "PortfolioSnapshot.${snapshot_id}.segment_statuses for county 06037 is still BREACHED against the 8000000-cent threshold"
            - "PortfolioSnapshot.${snapshot_id}.version == 1, so no update touched the snapshot"
  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: coverage_application_underwrite_moves_the_application_to_in_underwriting
        claim_type: Valid Transition
        grounds:
          - state_machines.CoverageApplication.SUBMITTED_to_IN_UNDERWRITING
          - endpoints.POST_/coverage-applications/{id}/underwrite
          - entities.CoverageApplication.fields.underwriting_path
        distinguishing_aspect: "A non-delegated lender's application leaves SUBMITTED for IN_UNDERWRITING exactly once, and the transition records NON_DELEGATED as the underwriting path regardless of what the application was carrying before."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a non-delegated lender, a master policy and a rate card; one application already submitted."
          setup_api_calls:
            - call: "POST /mortgage-insurance/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: MasterPolicyAdmin
            - &mp_sm
              call: "POST /mortgage-insurance/master-policies"
              payload: { policy_number: "MP-1001", anniversary_utc: "2026-01-15T00:00:00Z", coverage_percent_default: 25, delegated_curtailment_rate: 0.12, nondelagated_curtailment_rate: 0.08, ltv_variance_tolerance: 0.05, servicer_loss_mitigation_standard: "PARTICIPATION_COMPLETE", rescission_relief_cycles: 2, min_third_party_net_bps: 1500, two_year_effective_flag: true, exposure_contribution_rate: 0.35 }
              as: MasterPolicyAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /mortgage-insurance/rate-cards"
              payload: { master_policy_id: "${mp_id}", credit_grade: "B", ltv_band: "831_TO_85", coverage_percent: 25, premium_plan: "BPM", rate_bps: 62, min_borrower_reserves_months: 0 }
              as: MasterPolicyAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /mortgage-insurance/lenders"
              payload: { lender_name: "Bayline Funding", delegated_underwriting: false, policy_exposure_cap_cents: 200000000 }
              as: MasterPolicyAdmin
              captures: { lender_nd_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications"
              payload: { lender_id: "${lender_nd_id}", master_policy_id: "${mp_id}", rate_card_id: "${rc_id}", borrower_reference: "SM-1", loan_amount_cents: 34000000, property_value_cents: 40000000, credit_grade: "B", coverage_percent: 25, premium_plan: "BPM", borrower_paid: true, financed_premium: false, borrower_reserves_months: 6, county_code: "06037", term_months: 360 }
              as: Lender
              as_user_id: "${lender_nd_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /mortgage-insurance/coverage-applications/${app_id}/underwrite"
              payload: {}
              as: Underwriter
          assert:
            - "the response status is 200"
            - "CoverageApplication.${app_id}.status == IN_UNDERWRITING"
            - "CoverageApplication.${app_id}.underwriting_path == NON_DELEGATED"
            - "CoverageApplication.${app_id}.underwritten_utc == 2026-09-01T00:00:00Z"
            - "CoverageApplication.${app_id}.version == 2, so the transition advanced the row exactly once"

      - name: delegated_approve_is_refused_for_a_lender_without_delegated_authority
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CoverageApplication.SUBMITTED_to_APPROVED
          - errors[ERR_PATH_MISMATCH]
          - validations[priority=6]
        distinguishing_aspect: "The delegated-approval precondition is enforced on the lender's authority flag: a non-delegated lender using the delegated path is refused with ERR_PATH_MISMATCH while the same application on a delegated lender succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a non-delegated lender and a submitted application."
          setup_api_calls:
            - call: "POST /mortgage-insurance/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: MasterPolicyAdmin
            - call: "POST /mortgage-insurance/master-policies"
              payload: { policy_number: "MP-1001", anniversary_utc: "2026-01-15T00:00:00Z", coverage_percent_default: 25, delegated_curtailment_rate: 0.12, nondelagated_curtailment_rate: 0.08, ltv_variance_tolerance: 0.05, servicer_loss_mitigation_standard: "PARTICIPATION_COMPLETE", rescission_relief_cycles: 2, min_third_party_net_bps: 1500, two_year_effective_flag: true, exposure_contribution_rate: 0.35 }
              as: MasterPolicyAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /mortgage-insurance/rate-cards"
              payload: { master_policy_id: "${mp_id}", credit_grade: "B", ltv_band: "831_TO_85", coverage_percent: 25, premium_plan: "BPM", rate_bps: 62, min_borrower_reserves_months: 0 }
              as: MasterPolicyAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /mortgage-insurance/lenders"
              payload: { lender_name: "Bayline Funding", delegated_underwriting: false, policy_exposure_cap_cents: 200000000 }
              as: MasterPolicyAdmin
              captures: { lender_nd_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications"
