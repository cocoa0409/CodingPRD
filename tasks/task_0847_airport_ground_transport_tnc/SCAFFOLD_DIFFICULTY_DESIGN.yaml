              payload: { name: "LotI", geofence_center_lat: 40.64, geofence_center_lng: -73.78, geofence_radius_m: 5000, capacity: 5 }
              as: AirportAuthority
              captures: { lot_id: $.data.id }
            - call: "POST /v1/queue-entries"
              payload: { staging_lot_id: "${lot_id}", vehicle_id: "${veh_id}", lat: 40.64, lng: -73.78 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qe1: $.data.id }
            - call: "POST /v1/queue-entries/${qe1}/transitions"
              payload: { action: "EXIT" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-28T08:10:00Z" }
              as: AirportAuthority
          trigger:
            - call: "POST /v1/queue-entries"
              payload: { staging_lot_id: "${lot_id}", vehicle_id: "${veh_id}", lat: 40.64, lng: -73.78 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STAGING_BUFFER_VIOLATION"
            - "response http_status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: curb_occupancy_conserved_assign_then_release
        grounds:
          - state_machines.CurbAssignment.ACTIVE_to_RELEASED
          - state_machines.Trip.PICKED_UP_to_COMPLETED
          - entities.CurbAssignment.fields.status
        distinguishing_aspect: |
          Conserved quantity is the INTEGER occupancy count zone_active_occupancy(Z) =
          |{CurbAssignment: curb_zone_id==Z, status==ACTIVE}|. Forward assign (+1) then the
          compensating release on trip COMPLETE (-1) returns the count to its 0 baseline.
        test_recipe:
          setup:
            - "Operator ACTIVE; a DISPATCHED trip; a capacity-2 curb zone with zero ACTIVE assignments; clock 2026-05-10T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T10:00:00Z" }
              as: AirportAuthority
            - call: "POST /v1/operators"
              payload: { legal_name: "Occ Co", operator_type: "TNC", contact_email: "oc@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op_id}", plate: "OV1" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { veh_id: $.data.id, veh_v: $.data.version }
            - call: "POST /v1/permits"
              payload: { vehicle_id: "${veh_id}", avi_tag_id: "AVI-OV1", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${veh_v}" }
              as: AirportAuthority
              captures: { permit_id: $.data.id }
            - call: "POST /v1/permits/${permit_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/staging-lots"
              payload: { name: "LotJ", geofence_center_lat: 40.64, geofence_center_lng: -73.78, geofence_radius_m: 5000, capacity: 5 }
              as: AirportAuthority
              captures: { lot_id: $.data.id }
            - call: "POST /v1/queue-entries"
              payload: { staging_lot_id: "${lot_id}", vehicle_id: "${veh_id}", lat: 40.64, lng: -73.78 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qe_id: $.data.id }
            - call: "POST /v1/trips"
              payload: { vehicle_id: "${veh_id}", staging_lot_id: "${lot_id}", trip_kind: "PICKUP" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /v1/curb-zones"
              payload: { name: "Z4", terminal: "T2", capacity: 2 }
              as: AirportAuthority
              captures: { zone_id: $.data.id }
          trigger:
            - call: "POST /v1/curb-assignments"
              payload: { curb_zone_id: "${zone_id}", trip_id: "${trip_id}", start_ts: "2026-05-10T10:00:00Z", end_ts: "2026-05-10T10:30:00Z" }
              as: CurbCoordinator
              captures: { ca_id: $.data.id }
            - call: "POST /v1/trips/${trip_id}/transitions"
              payload: { action: "PICKUP" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /v1/trips/${trip_id}/transitions"
              payload: { action: "COMPLETE" }
              as: Operator
              as_user_id: "${op_id}"
          assert:
            - "CurbAssignment.${ca_id}.status == RELEASED"
            - "GET /v1/curb-assignments?curb_zone_id=${zone_id}&status=ACTIVE has total_count == 0 (occupancy returned to baseline 0)"

      - name: outstanding_fees_conserved_complete_then_void
        grounds:
          - state_machines.Trip.PICKED_UP_to_COMPLETED
          - state_machines.Trip.COMPLETED_to_VOIDED
          - entities.Operator.fields.outstanding_fees_cents
        distinguishing_aspect: |
          Conserved quantity is MONEY: operator.outstanding_fees_cents = sum(final_fee_cents
          of COMPLETED, unswept trips). Forward COMPLETE (+350) then compensating VOID (-350)
          leaves it at the 0 baseline; a different conserved-quantity type than occupancy count.
        test_recipe:
          setup:
            - "TNC operator ACTIVE; a trip dispatched off-peak (12:00) so final fee = 350; clock 2026-05-15T12:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T12:00:00Z" }
              as: AirportAuthority
            - call: "POST /v1/operators"
              payload: { legal_name: "Ledger Co", operator_type: "TNC", contact_email: "le@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op_id}", plate: "LV1" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { veh_id: $.data.id, veh_v: $.data.version }
            - call: "POST /v1/permits"
              payload: { vehicle_id: "${veh_id}", avi_tag_id: "AVI-LV1", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${veh_v}" }
              as: AirportAuthority
              captures: { permit_id: $.data.id }
            - call: "POST /v1/permits/${permit_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/staging-lots"
              payload: { name: "LotK", geofence_center_lat: 40.64, geofence_center_lng: -73.78, geofence_radius_m: 5000, capacity: 5 }
              as: AirportAuthority
              captures: { lot_id: $.data.id }
            - call: "POST /v1/queue-entries"
              payload: { staging_lot_id: "${lot_id}", vehicle_id: "${veh_id}", lat: 40.64, lng: -73.78 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qe_id: $.data.id }
            - call: "POST /v1/trips"
              payload: { vehicle_id: "${veh_id}", staging_lot_id: "${lot_id}", trip_kind: "PICKUP" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /v1/trips/${trip_id}/transitions"
              payload: { action: "PICKUP" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /v1/trips/${trip_id}/transitions"
              payload: { action: "COMPLETE" }
              as: Operator
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /v1/trips/${trip_id}/transitions"
              payload: { action: "VOID" }
              as: AirportAuthority
              captures: { st: $.data.status }
          assert:
            - "Trip.${trip_id}.final_fee_cents == 350"
            - "Trip.${trip_id}.status == VOIDED"
            - "Operator.${op_id}.outstanding_fees_cents == 0"
