# SCAFFOLD.yaml — Dangerous Goods Transportation Permit Management benchmark
# Generated per /Users/uni/Desktop/吉/project/custom_prd_bench/skills/prd-bench-scaffold-generator/SKILL.md
# The companion file SCAFFOLD_DIFFICULTY_DESIGN.yaml carries the §1.8 test-targeting index;
# this file MUST NOT contain a top-level `scaffold_difficulty_design:` key.

# §1.0 — Response envelope and manifest header
scenario: "Dangerous goods transportation permit management: transportation company qualifications, driver qualifications, vehicle inspection, transportation route approval, GPS monitoring, penalties for violations, and annual permit renewal.  difficulty set to Advanced, not be too hard"

domain_name: "hazmat-transport-permit"
api_prefix: "/v1"

complexity_profile:
  primary_archetype: "compliance/audit"
  secondary_archetype: "posture-driven gating"
  complexity_layers:
    - "rate/threshold triggers"
    - "scheduled/deferred actions"
    - "derived field reconciliation"
    - "idempotency"
    - "multi-tenancy isolation"
  entity_topology: "hybrid"
  state_machine_shape: "branching-with-revert plus a guarded posture-driven aggregate"
  relationship_patterns:
    - "one_to_many"
    - "cross_aggregate"
  role_model: "peer_roles"
  consistency_model: "immediate"
  difficulty_band: "Advanced (easier end)"
  notes: |
    Permit is the central aggregate. Its `lifecycle_status` is a derived posture over the
    validity of the linked TransportCompany, every authorized Driver's hazmat endorsement,
    the authorized Vehicle's most-recent VehicleInspection, the named TransportRoute's
    approval_status, and the wall-clock time-window `[valid_from, valid_until)`. The
    regulator's `verify-compliance` action freezes the strict-snapshot of those five
    inputs onto the Permit row, while a live recompute on each read evaluates the same
    predicate against the current values of those inputs — the two yield different
    booleans when any input has flipped between the most-recent verify and `now()`,
    which is the dual-variant axis on the Permit. The Driver's penalty-points
    rolling-12-month total exhibits the second dual-variant: the as-of-issue snapshot
    stored on each Permit's `driver_snapshot[]` for forensic "was the issue lawful at
    the time" reasoning, vs the current 365-day-rolling total observed live at each
    `verify-compliance` call. The fee model is a three-input combinatorial formula
    (base, per-vehicle surcharge, conditional late-renewal penalty, hard cap) whose
    evaluation order is pinned explicitly.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

taxonomies:
  un_hazard_class_codes:
    description: "UN-classified hazardous-materials hazard class identifiers"
    values:
      - "1.1"  # mass-explosion hazard
      - "1.2"  # projection hazard
      - "1.3"  # fire hazard
      - "1.4"  # minor hazard
      - "1.5"  # very insensitive
      - "1.6"  # extremely insensitive
      - "2.1"  # flammable gas
      - "2.2"  # non-flammable, non-toxic gas
      - "2.3"  # toxic gas
      - "3"    # flammable liquid
      - "4.1"  # flammable solid
      - "4.2"  # spontaneously combustible
      - "4.3"  # dangerous-when-wet
      - "5.1"  # oxidizer
      - "5.2"  # organic peroxide
      - "6.1"  # toxic
      - "6.2"  # infectious
      - "7"    # radioactive
      - "8"    # corrosive
      - "9"    # miscellaneous
  inspection_outcomes:
    values: ["PASSED", "FAILED", "CONDITIONAL"]
    note: "Only PASSED inspections count toward a vehicle's compliance posture. CONDITIONAL inspections count as non-compliant for the permit-validity AND-chain; FAILED inspections likewise. The most-recent inspection by `inspected_at` is the authoritative one (no aggregation across history)."
  penalty_subject_types:
    values: ["DRIVER", "COMPANY", "VEHICLE"]
    note: "A penalty is keyed by (subject_type, subject_id). The 12-month rolling-window total drives the driver-suspension threshold for DRIVER-subject penalties; the COMPANY and VEHICLE subject totals are tracked for the audit trail but do not drive an automatic suspension in this scaffold."
  penalty_sources:
    values: ["MANUAL_REGULATOR", "GPS_VIOLATION_SPEED", "GPS_VIOLATION_OFF_ROUTE"]
    note: "MANUAL_REGULATOR comes from POST /penalties; the two GPS_VIOLATION sources are auto-created on the GPS-report ingest path when the violation thresholds are crossed."
  gps_violation_thresholds:
    note: "The numeric values of MAX_HAZMAT_SPEED_KPH and OFF_ROUTE_RADIUS_M are pinned in SCAFFOLD_DIFFICULTY_DESIGN.yaml's worked examples. The named symbols are constants on `calculations[name=gps_violation_classification]`."

idempotency:
  scope: "POST /trips/{trip_id}/gps-reports"
  key_header: "Idempotency-Key"
  replay_semantics: |
    A repeat POST with the same Idempotency-Key and a byte-for-byte identical request
    body returns the original 201 response (same gps_report.id, no new row). A repeat
    POST with the same Idempotency-Key and a *different* body is rejected with 409
    ERR_IDEMPOTENCY_KEY_REUSED. Keys are scoped per-trip (the same string used on two
    different trips is two independent keys). Keys older than the trip's terminal
    timestamp (COMPLETED or ABORTED) MAY be garbage-collected — the scaffold does not
    pin a GC window because tests never exercise stale-key revival.

clock:
  source: "server logical clock; advances strictly monotonically; the test harness's POST /_clock/advance is the only externally-triggerable advance in test mode. In production the clock is the OS clock."
  format: "ISO 8601 UTC, three fractional-second digits"

common_fields_expansion:
  when_true:
    - { name: "id",         type: "string",   format: "uuid",     source: "system", description: "Server-minted UUID without a type prefix." }
    - { name: "created_at", type: "datetime", source: "system", description: "ISO 8601 UTC, three fractional digits. Set on insert, never changes." }
    - { name: "updated_at", type: "datetime", source: "system", description: "ISO 8601 UTC, three fractional digits. Refreshed on every mutation including cascaded side-effects." }
    - { name: "version",    type: "integer",  source: "system", description: "Optimistic-concurrency counter; starts at 1, +1 per mutation. The client supplies the expected current `version` on mutating endpoints that accept it; a mismatch is ERR_VERSION_CONFLICT 409." }
  when_false:
    - { name: "id",         type: "string",   format: "uuid",     source: "system", description: "Server-minted UUID." }
    - { name: "created_at", type: "datetime", source: "system", description: "Append-only insert timestamp." }
  when_false_notes: "Append-only / immutable entities (VehicleInspection, GPSReport, Penalty) carry only id and created_at. They have no `updated_at` or `version` because they are never mutated in place — corrections go through the appeal-uphold compensating action, which creates a new ledger entry rather than editing the original."

# §1.1 — Entities
entities:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. TransportCompany — the regulated entity that holds a hazmat license.
  # ─────────────────────────────────────────────────────────────────────────
  - name: TransportCompany
    parent: null
    common_fields: true
    description: "A logistics firm applying for and holding a dangerous-goods transport license. One row per legal entity. The X-User-ID of a CompanyOperator role's request equals the id of the TransportCompany the operator is acting on behalf of."
    fields:
      - { name: "legal_name",           type: "string",  source: "input",    description: "Registered legal name, free text 1..200 chars." }
      - { name: "registration_number",  type: "string",  source: "input",    description: "Government-issued company registration id. Must match the regex `^[A-Z0-9]{8,32}$`. Unique across the whole system." }
      - { name: "primary_contact_email",type: "string",  source: "input",    description: "Email of the responsible safety officer. RFC-5322 syntactic check only." }
      - { name: "qualification_status", type: "enum",    source: "computed", description: "The company's qualification posture. See §1.2 state machine `TransportCompany.qualification_status`.", constraints: "values: DRAFT, SUBMITTED, APPROVED, REVOKED" }
      - { name: "wallet_balance_cents", type: "integer", source: "system",   description: "The company's prepaid wallet for issue and renewal fees, in cents (smallest currency unit). Topped up out-of-band by a regulator-side bookkeeping action that is out of scope for the API. Non-negative; ERR_INSUFFICIENT_WALLET_BALANCE on debit attempts that would go below zero." }
      - { name: "submitted_at",         type: "datetime",source: "system",   description: "Timestamp of the DRAFT→SUBMITTED transition. Null while in DRAFT." }
      - { name: "approved_at",          type: "datetime",source: "system",   description: "Timestamp of the SUBMITTED→APPROVED transition. Null until first approval." }
      - { name: "revoked_at",           type: "datetime",source: "system",   description: "Timestamp of the most-recent APPROVED→REVOKED transition. Null when never revoked. A revoke→DRAFT revision cycle clears this on the next APPROVED step (overwritten at the next approval; the history is reconstructible via the audit log out of scope here)." }
      - { name: "address_line",         type: "string",  source: "input",    description: "Headquarters street address. Free text, max 500 chars. Not load-bearing for any business rule; included so the entity has a realistic shape." }
      - { name: "hazard_classes_authorized", type: "array", source: "input", description: "Subset of `taxonomies.un_hazard_class_codes` the company applied to handle. At least one entry required at SUBMIT time. The Permit's `hazard_classes` field must be a subset of this — see ERR_VALIDATION on a permit application listing a class the company isn't qualified for.", constraints: "array of strings, each in un_hazard_class_codes; non-empty; no duplicates." }
    invariants:
      - "qualification_status's terminal-reachable states are {APPROVED, REVOKED}; DRAFT and SUBMITTED are intermediate."
      - "Once `qualification_status` flips to REVOKED, every Permit whose `company_id` is this company's id is cascade-suspended on the next regulator action that observes the cross-entity state, per the cross-entity dependency in §1.3 `permit_validity_check` (rule 7 entity pair A)."

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Driver — a person authorized to drive a hazmat vehicle for a Company.
  # ─────────────────────────────────────────────────────────────────────────
  - name: Driver
    parent: TransportCompany
    common_fields: true
    description: "A driver employed by one TransportCompany. The X-User-ID for the Driver role's self-read on the penalty-summary endpoint equals the driver's id."
    fields:
      - { name: "company_id",                type: "string",  source: "input",   description: "Foreign key to the TransportCompany. The CompanyOperator submitting POST /companies/{cid}/drivers binds `company_id := cid`. Cannot be changed after creation; transferring a driver between companies requires a fresh driver row." }
      - { name: "full_name",                 type: "string",  source: "input",   description: "Legal name on the driver's license, 1..120 chars." }
      - { name: "license_number",            type: "string",  source: "input",   description: "Government-issued driver's-license number. Unique within (`company_id`, `license_number`); collisions across companies are permitted because the spec doesn't pin a national-id database." }
      - { name: "license_class",             type: "string",  source: "input",   description: "License class (e.g., 'A2', 'B1'). Free string; no business rule depends on the value, so an enum isn't pinned here." }
      - { name: "hazmat_endorsement_status", type: "enum",    source: "computed", description: "The driver's hazardous-materials endorsement standing. VALID means the regulator-attested endorsement is in force and the rolling 365-day penalty-point total is below `THRESHOLD_DRIVER_SUSPENSION_POINTS`. INVALID is the standing whenever either the regulator has manually marked the endorsement invalid via the refresh-endorsement action, the attestation has expired (`endorsement_valid_until < now()`), or the rolling-point total is at-or-above the threshold. NOT_ATTESTED is the initial state from POST /companies/{cid}/drivers, before any RegulatorOfficer has run the refresh-endorsement action.", constraints: "values: NOT_ATTESTED, VALID, INVALID. The transitions are encoded as state transitions on the Driver state machine in §1.2." }
      - { name: "endorsement_valid_until",   type: "datetime",source: "system",   description: "The regulator-attested endorsement's expiry date. Set on the refresh-endorsement action by the RegulatorOfficer. Null while NOT_ATTESTED. ISO 8601 UTC. A wall-clock advance past this value flips `hazmat_endorsement_status` from VALID to INVALID at the next derived-state read." }
      - { name: "endorsement_classes",       type: "array",   source: "input",   description: "The UN-hazard-class subset this driver is endorsed for. Initially empty (the operator's POST attests intent), set authoritatively on the regulator's refresh-endorsement call. Must be a subset of the parent TransportCompany's `hazard_classes_authorized` at the time the regulator refreshes it.", constraints: "array of strings from un_hazard_class_codes, no duplicates, may be empty in NOT_ATTESTED." }
      - { name: "current_rolling_points",    type: "integer", source: "computed", description: "Cached value of the §1.3 calculation `driver_penalty_point_rolling_total` keyed by this driver, recomputed on every Penalty.create or Penalty.uphold cascade-touching this driver, and also recomputed during the daily `_sweep/run` to account for penalties falling out of the 365-day window. Non-negative. The recompute is exact (no caching staleness in tests — the sweep is deterministic and tests can force-trigger it)." }
    invariants:
      - "A Driver in `hazmat_endorsement_status == INVALID` cannot appear in any subsequent permit application's `authorized_driver_ids[]` (validation `ERR_DRIVER_ENDORSEMENT_INVALID`)."
      - "Crossing `current_rolling_points >= THRESHOLD_DRIVER_SUSPENSION_POINTS` is the boundary on rule 6 boundary A. The flag flips at exactly the threshold (>=, not >). See SCAFFOLD_DIFFICULTY_DESIGN's `driver_threshold_boundary_at_exactly_threshold` worked example for the literal-value boundary test."

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Vehicle — a tank truck or other hazmat-rated vehicle.
  # ─────────────────────────────────────────────────────────────────────────
  - name: Vehicle
    parent: TransportCompany
    common_fields: true
    description: "A vehicle owned and operated by one TransportCompany. Inspections are append-only events under the vehicle, and the most-recent PASSED inspection's `valid_until` drives the vehicle's compliance posture for the permit-validity AND-chain."
    fields:
      - { name: "company_id",        type: "string",  source: "input",    description: "Owning company. Cannot be reassigned." }
      - { name: "plate_number",      type: "string",  source: "input",    description: "License plate string. Unique system-wide. ERR_DUPLICATE_IDENTIFIER on collision." }
      - { name: "vehicle_type",      type: "enum",    source: "input",    description: "Tank-truck class.", constraints: "values: TANKER_LIQUID, TANKER_GAS, BOX_DRY_BULK, FLATBED_PACKAGED, OTHER" }
      - { name: "max_payload_kg",    type: "integer", source: "input",    description: "Manufacturer-rated cargo capacity in kilograms. Positive integer. Not load-bearing for any validity rule in this scaffold, but referenced by realistic body-schema validation." }
      - { name: "hazard_classes_compatible", type: "array", source: "input", description: "The UN-hazard-class subset this vehicle's construction certifies it can carry. Must intersect non-emptily with the permit's `hazard_classes` and the driver's `endorsement_classes` when the trio is bound to a Trip — see ERR_PERMIT_VEHICLE_COUNT_OUT_OF_RANGE adjacent validations.", constraints: "array of un_hazard_class_codes, no duplicates, non-empty at creation time." }
      - { name: "latest_inspection_id",      type: "string",   source: "computed", description: "The id of the VehicleInspection with the largest `inspected_at` among this vehicle's inspections. Null when no inspection has been recorded. Updated by the side-effect of POST /vehicles/{vid}/inspections. Tie-break on equal `inspected_at`: the one with the lexicographically-larger `id` wins (the spec's standard tie-break for event-sourced 'latest' lookups)." }
      - { name: "latest_inspection_outcome", type: "enum",     source: "computed", description: "The outcome of the inspection identified by `latest_inspection_id`. Null when `latest_inspection_id` is null. Cached for read-efficiency.", constraints: "values: PASSED, FAILED, CONDITIONAL, null" }
      - { name: "latest_inspection_valid_until", type: "datetime", source: "computed", description: "The `valid_until` field of the latest inspection (which equals `inspected_at + INSPECTION_VALIDITY_DAYS`). Null when no inspection. A permit-validity check fails (ERR_VEHICLE_INSPECTION_LAPSED) if this is null, if the latest outcome is not PASSED, or if this datetime is strictly before the permit's `valid_until` — meaning the inspection would lapse before the permit term ends. The same check applies at the live-recompute path inside `verify-compliance`." }
    invariants:
      - "Insertion of a VehicleInspection with a strictly-larger `inspected_at` than any existing record for the vehicle atomically refreshes `latest_inspection_id`, `latest_inspection_outcome`, and `latest_inspection_valid_until`. The cascade order is `inspection.created → vehicle.latest_* updated → any ACTIVE permit listing this vehicle has its strict-snapshot's vehicle-leg recomputed on the next verify-compliance call`."

  # ─────────────────────────────────────────────────────────────────────────
  # 4. VehicleInspection — immutable event log of regulator inspections.
  # ─────────────────────────────────────────────────────────────────────────
  - name: VehicleInspection
    parent: Vehicle
    common_fields: false
    description: "An append-only certificate of a regulator's physical inspection of a Vehicle. Never mutated; corrections are issued as new inspection records superseding the older one by `inspected_at`. No `updated_at` or `version` field."
    fields:
      - { name: "vehicle_id",    type: "string",  source: "input",  description: "Foreign key to Vehicle, derived from the URL path parameter on POST /vehicles/{vehicle_id}/inspections." }
      - { name: "inspector_id",  type: "string",  source: "input",  description: "Opaque identifier of the RegulatorOfficer who performed the inspection; lifted from the request's X-User-ID at insert time. Stored on the record for the audit trail." }
      - { name: "inspected_at",  type: "datetime",source: "input",  description: "ISO 8601 UTC timestamp of when the physical inspection was conducted. Must be `<= now()` at insert time (no future-dated inspections, ERR_VALIDATION). Two inspections of the same vehicle with the same `inspected_at` are permitted; the tie-break for 'latest' is the lexicographically-larger `id`." }
      - { name: "outcome",       type: "enum",    source: "input",  description: "The verdict.", constraints: "one of PASSED, FAILED, CONDITIONAL — see taxonomies.inspection_outcomes for the semantic note that only PASSED counts as compliant for the permit-validity AND-chain." }
      - { name: "valid_until",   type: "datetime",source: "system", description: "Derived at insert time as `inspected_at + INSPECTION_VALIDITY_DAYS` (180 days, the value pinned in SCAFFOLD_DIFFICULTY_DESIGN). For FAILED outcomes the `valid_until` is set to `inspected_at` itself (i.e., zero validity), so the test layer can tell the failure-of-validity apart from the simple-expiry case if needed." }
      - { name: "findings_note", type: "string",  source: "input",  description: "Inspector's prose notes. Free text, max 2000 chars. Not load-bearing for any rule, but realistic." }

  # ─────────────────────────────────────────────────────────────────────────
  # 5. TransportRoute — a regulator-approved route definition.
  # ─────────────────────────────────────────────────────────────────────────
  - name: TransportRoute
    parent: TransportCompany
    common_fields: true
    description: "A geographic route from origin to destination that a Company applies to have approved for hazmat transit. The route's `polyline` is a list of (lat, lon) waypoints; GPS-monitoring's off-route check measures perpendicular distance from a Trip's GPS-report to the closest segment of the polyline."
    fields:
      - { name: "company_id",       type: "string",  source: "input",  description: "Owning company. Routes are not shared across companies; each company applies for its own route, even for identical geographies." }
      - { name: "origin_label",     type: "string",  source: "input",  description: "Human-readable origin name (city or facility)." }
      - { name: "destination_label",type: "string",  source: "input",  description: "Human-readable destination name." }
      - { name: "polyline",         type: "array",   source: "input",  description: "Ordered list of waypoint objects `{lat: float, lon: float}` defining the centerline of the approved corridor. WGS-84. Minimum 2 points (origin and destination), maximum 200 points. Each consecutive pair defines a segment. Validation rejects an empty or single-point polyline as ERR_VALIDATION. The off-route check (the `gps_violation_classification` calculation) measures perpendicular distance from a GPS report's (lat, lon) to the polyline using the standard haversine-on-segments formula; if the smallest such distance across all segments exceeds OFF_ROUTE_RADIUS_M, the report is flagged as an off-route violation and a Penalty is auto-created against the trip's driver." }
      - { name: "approval_status",  type: "enum",    source: "computed", description: "The route's approval posture. See §1.2 state machine `TransportRoute.approval_status`. The cycle REJECTED→DRAFT (operator revises) → SUBMITTED → ... gives the non-linear shape on this entity, paired with the company's non-linear cycle for rule 3's two-different-entities clause.", constraints: "values: DRAFT, SUBMITTED, APPROVED, REJECTED" }
      - { name: "approved_at",      type: "datetime",source: "system",   description: "Timestamp of the most-recent SUBMITTED→APPROVED transition. Null while never approved. Overwritten on each re-approval after a revision-loop cycle." }
      - { name: "approved_by",      type: "string",  source: "system",   description: "X-User-ID of the RegulatorOfficer who last approved. Null while never approved." }
      - { name: "rejection_reason", type: "string",  source: "system",   description: "Free-text reason recorded on the most-recent SUBMITTED→REJECTED transition. Required on the reject endpoint body (1..500 chars). Cleared (set to null) on the REJECTED→DRAFT operator-revise transition. Cleared also on a successful SUBMITTED→APPROVED transition." }
      - { name: "hazard_classes_supported", type: "array", source: "input", description: "The UN-hazard classes the regulator approves this route for. Set on the operator's submission, validated by the regulator on approve. A Permit's `hazard_classes` field at issue time must be a subset of `route.hazard_classes_supported ∩ company.hazard_classes_authorized`, where the intersection-then-subset relation is the canonical 'class fit' check.", constraints: "array of un_hazard_class_codes, no dups, non-empty." }

  # ─────────────────────────────────────────────────────────────────────────
  # 6. Permit — the central aggregate. Its lifecycle_status is the posture.
  # ─────────────────────────────────────────────────────────────────────────
  - name: Permit
    parent: TransportCompany
    common_fields: true
    description: "A dangerous-goods transportation permit issued to a TransportCompany. Names exactly one TransportRoute, a non-empty list of authorized Drivers and a non-empty list of authorized Vehicles. The permit's `lifecycle_status` is a posture-driven aggregate computed from the validity of its grounding company/drivers/vehicles/route plus the wall-clock time window. The strict-snapshot fields capture the values of those inputs as of the most-recent verify-compliance call; the live recompute on read (and on each new verify-compliance) compares the snapshot against the current values, and a mismatch in any direction triggers the appropriate auto-transition."
    fields:
      - { name: "company_id",                  type: "string",  source: "input",    description: "Foreign key to the owning TransportCompany." }
      - { name: "route_id",                    type: "string",  source: "input",    description: "Foreign key to the TransportRoute. The route's company_id must equal this permit's company_id (cross-tenant routes are not permitted)." }
      - { name: "authorized_driver_ids",       type: "array",   source: "input",    description: "Driver ids the permit authorizes. Non-empty. Each must reference a Driver with `company_id == permit.company_id`, with `hazmat_endorsement_status == VALID` and `endorsement_valid_until >= permit.valid_until` at issue time. Cardinality 1..50. ERR_DRIVER_ENDORSEMENT_INVALID on a violation at issue time." }
      - { name: "authorized_vehicle_ids",      type: "array",   source: "input",    description: "Vehicle ids the permit authorizes. Cardinality 1..`MAX_VEHICLES_PER_PERMIT` (the constant whose numeric value is in SCAFFOLD_DIFFICULTY_DESIGN). Each vehicle's `company_id` must equal this permit's `company_id`. Each vehicle's `latest_inspection_outcome` must be PASSED and `latest_inspection_valid_until` must be `>= permit.valid_until` at issue time. ERR_VEHICLE_INSPECTION_LAPSED on a violation. ERR_PERMIT_VEHICLE_COUNT_OUT_OF_RANGE when the cardinality is outside [1, MAX_VEHICLES_PER_PERMIT]." }
      - { name: "hazard_classes",              type: "array",   source: "input",    description: "The UN-hazard-class subset this specific permit authorizes the company to carry on the route. Must be a non-empty subset of `company.hazard_classes_authorized ∩ route.hazard_classes_supported`. ERR_VALIDATION on the intersection-subset rule failing at POST /permits, ERR_COMPANY_NOT_QUALIFIED at the issue step if the intersection has narrowed in between (e.g., the company's authorized classes shrank after a regulator audit)." }
      - { name: "valid_from",                  type: "datetime",source: "input",    description: "Permit start datetime. ISO 8601 UTC. Set by the operator on POST /permits, immutable thereafter. Must be `>= now()` at issue time (no back-dated permits)." }
      - { name: "valid_until",                 type: "datetime",source: "computed", description: "Permit end datetime, equal to `valid_from + PERMIT_DEFAULT_VALIDITY_DAYS` at issue time. The renew action atomically extends this by `PERMIT_DEFAULT_VALIDITY_DAYS`. The clock-tick sweep transitions ACTIVE→EXPIRED when `now() >= valid_until` (the half-open right-exclusive interval semantics — `now() == valid_until` is the EXPIRED moment, not the last-ACTIVE moment — this pins rule 6 boundary B)." }
      - { name: "lifecycle_status",            type: "enum",    source: "computed", description: "The aggregate posture.", constraints: "values: DRAFT, ACTIVE, SUSPENDED, EXPIRED, VOIDED" }
      - { name: "issued_at",                   type: "datetime",source: "system",   description: "Timestamp of the DRAFT→ACTIVE transition fired by POST /permits/{id}/issue. Null while DRAFT. Once set, never cleared (the void-issue action transitions to VOIDED but leaves `issued_at` intact for the audit trail)." }
      - { name: "issued_by",                   type: "string",  source: "system",   description: "X-User-ID of the RegulatorOfficer who issued the permit. Null while DRAFT." }
      - { name: "issue_fee_cents",             type: "integer", source: "system",   description: "The value of `annual_renewal_fee` computed at the moment of the DRAFT→ACTIVE issue transition (or at each renewal, refreshed atomically). Stored on the row so the void-issue compensating action can credit the exact original amount even if the formula's inputs (vehicle count, base fee) have drifted in between — this is the literal-amount-pinned ledger entry referenced by rule 9 invariant A." }
      - { name: "last_verified_at",            type: "datetime",source: "system",   description: "Timestamp of the most-recent successful POST /permits/{id}/verify-compliance call. Null until the first verification. The snapshot fields below are the snapshot as of this timestamp." }
      - { name: "snapshot_company_qualified",  type: "boolean", source: "computed", description: "Strict-snapshot flag: was the company in qualification_status == APPROVED at last_verified_at? Initially-false-then-true on the first successful verify. The live recompute compares this against the current company state; a mismatch (snapshot=true, live=false) is the trigger for the SUSPEND auto-transition. The reverse (snapshot=false, live=true) is the trigger for the SUSPEND→ACTIVE reinstate transition on the next verify-compliance call." }
      - { name: "snapshot_driver_endorsements",type: "object",  source: "computed", description: "Map keyed by driver_id (string) → boolean, where the boolean is whether that driver's `hazmat_endorsement_status == VALID` and `endorsement_valid_until >= permit.valid_until` and that driver's `current_rolling_points < THRESHOLD_DRIVER_SUSPENSION_POINTS` all hold simultaneously, evaluated at last_verified_at. The conjunction-AND-across-drivers (every driver's flag is true) is the drivers-leg of the validity AND-chain. The snapshot's per-driver granularity exists so the test layer can pin which driver caused a suspension." }
      - { name: "snapshot_vehicle_inspections",type: "object",  source: "computed", description: "Map keyed by vehicle_id (string) → boolean, where the boolean is `vehicle.latest_inspection_outcome == 'PASSED' AND vehicle.latest_inspection_valid_until >= permit.valid_until`, evaluated at last_verified_at. AND-across-vehicles is the vehicles-leg. The map's structure parallels the driver-snapshot map for symmetry." }
      - { name: "snapshot_route_approved",     type: "boolean", source: "computed", description: "Strict-snapshot flag for the route's approval_status, evaluated at last_verified_at. True iff the route was in APPROVED at that moment." }
      - { name: "snapshot_within_window",      type: "boolean", source: "computed", description: "Strict-snapshot flag for the time check, evaluated at last_verified_at as `valid_from <= last_verified_at < valid_until`. Note this is the time-of-verify check, not the time-of-permit-issue check — the issue check is the validity check fired exactly once on the DRAFT→ACTIVE transition, while the time-window snapshot tracks whether each subsequent verify still falls inside the term." }
      - { name: "renewal_history",             type: "array",   source: "system",   description: "Append-only list of `{renewed_at: datetime, fee_cents: integer, late_penalty_applied: boolean, prior_valid_until: datetime, new_valid_until: datetime}` records, one per successful POST /permits/{id}/renew call. Required to be present (an empty list initially) so the test layer can audit the conservation invariant in rule 9 invariant A by summing fee_cents across the history against the company-wallet debit ledger." }
      - { name: "voided_at",                   type: "datetime",source: "system",   description: "Timestamp of the ACTIVE→VOIDED transition fired by POST /permits/{id}/void-issue. Null when not voided. Once set, the permit is terminal — no transitions out of VOIDED." }
      - { name: "void_refunded_cents",         type: "integer", source: "system",   description: "The amount refunded to the company wallet on the void-issue transition. Must equal `issue_fee_cents + sum(renewal_history[*].fee_cents)` so the wallet-plus-regulator-ledger sum is invariant across (issue + renewals) and (void-issue), per rule 9 invariant A. Null until voided." }
    invariants:
      - "Posture-driven aggregate: ACTIVE is the conjunction of (snapshot_company_qualified AND every snapshot_driver_endorsements value is true AND every snapshot_vehicle_inspections value is true AND snapshot_route_approved AND snapshot_within_window) AS OF the last verify-compliance run. The live-recompute on read does not change the on-disk status — only an explicit verify-compliance call writes a new snapshot and may flip the status. This separation is the dual-variant axis for rule 1 instance A."
      - "DRAFT→ACTIVE is the issue action by the regulator (POST /permits/{id}/issue), which atomically (a) computes the fee, (b) debits the wallet by that amount via the immediate-consistency model, (c) writes the snapshot fields by reading the current grounding-entity values, (d) writes valid_until = valid_from + PERMIT_DEFAULT_VALIDITY_DAYS, (e) writes issued_at = now() and issued_by = X-User-ID. Wallet-shortfall is ERR_INSUFFICIENT_WALLET_BALANCE."
      - "ACTIVE↔SUSPENDED is the cycle that satisfies rule 3's non-linear-shape constraint on the Permit entity. The SUSPENDED→ACTIVE direction fires when a verify-compliance call observes all five validity sub-checks holding again — the regulator does not need an explicit 'reinstate' button, the SUSPEND/REINSTATE direction is the same endpoint's idempotent verify-compliance call."
      - "ACTIVE→EXPIRED is the time-driven automatic transition fired by POST /_sweep/run (and on every verify-compliance call as an embedded check, so the test layer can avoid having to call the sweep explicitly when it can call verify-compliance). The boundary is `now() >= valid_until` (right-exclusive), giving rule 6 boundary B."
      - "ACTIVE→VOIDED is the regulator's clerical-error reversal via POST /permits/{id}/void-issue. Gated to `now() - issued_at <= VOID_ISSUE_WINDOW_HOURS` (24 hours); past that, ERR_VOID_WINDOW_CLOSED 409."
      - "Renewal extends valid_until in place and stays in ACTIVE. The renewal is permitted only when the permit is in ACTIVE (not SUSPENDED) AND the request's arrival time is in the window `[valid_until - RENEWAL_OPEN_WINDOW_DAYS, valid_until)`. Outside the early-side: ERR_RENEWAL_TOO_EARLY. Outside the late-side: the permit has already transitioned to EXPIRED by the sweep (or the verify-compliance auto-expiry path), and the renew endpoint returns ERR_RENEWAL_AFTER_EXPIRY. The late-renewal surcharge fires when the arrival is in the window `[valid_until - LATE_RENEWAL_GRACE_DAYS, valid_until)` — see `annual_renewal_fee` calculation in §1.3."

  # ─────────────────────────────────────────────────────────────────────────
  # 7. Trip — a single transit run under a Permit.
  # ─────────────────────────────────────────────────────────────────────────
  - name: Trip
    parent: Permit
    common_fields: true
    description: "An instance of a transportation run authorized by a Permit. Binds one of the permit's authorized drivers to one of its authorized vehicles for a scheduled window. The vehicle-double-booking rule (rule 8 overlap A) applies across Trips that share a `vehicle_id` and have overlapping `[scheduled_departure_at, scheduled_arrival_at)` half-open intervals on the same vehicle, regardless of which permits they belong to (a vehicle is a physical asset that can't be in two places at once)."
    fields:
      - { name: "permit_id",            type: "string",  source: "input",    description: "Foreign key to Permit. At POST /permits/{permit_id}/trips creation time, the permit's lifecycle_status must be ACTIVE — ERR_PERMIT_NOT_ACTIVE otherwise. Note that a permit transitioning to SUSPENDED or EXPIRED after trip creation triggers the rule-4-cascade-B that aborts the trip if it's not yet COMPLETED." }
      - { name: "driver_id",            type: "string",  source: "input",    description: "Driver id, must be a member of the permit's `authorized_driver_ids`. The driver's hazmat_endorsement_status must be VALID at trip-creation time as well (a stricter check than just permit-authorization)." }
      - { name: "vehicle_id",           type: "string",  source: "input",    description: "Vehicle id, must be a member of the permit's `authorized_vehicle_ids`. The vehicle's latest_inspection_outcome must be PASSED and latest_inspection_valid_until >= scheduled_arrival_at at trip-creation time." }
      - { name: "cargo_description",    type: "string",  source: "input",    description: "Free-text description of the hazardous cargo, 1..500 chars. Realistic but not load-bearing." }
      - { name: "cargo_hazard_class",   type: "string",  source: "input",    description: "Single un_hazard_class_codes entry, must be a member of the permit's `hazard_classes`. This is the per-trip-shipment's actual hazard class." }
      - { name: "cargo_weight_kg",      type: "integer", source: "input",    description: "Cargo mass in kilograms. Must be `>=0` and `<= vehicle.max_payload_kg`. ERR_VALIDATION otherwise." }
      - { name: "scheduled_departure_at", type: "datetime", source: "input", description: "Planned departure timestamp. Must fall in `[permit.valid_from, permit.valid_until)`. ERR_OUTSIDE_VALIDITY_WINDOW otherwise. The half-open semantics matches the permit's lifecycle expiry boundary." }
      - { name: "scheduled_arrival_at",   type: "datetime", source: "input", description: "Planned arrival timestamp. Must satisfy `scheduled_departure_at < scheduled_arrival_at` (strict, no zero-duration trips). Must also fall in `[permit.valid_from, permit.valid_until)`. The trip is rejected with ERR_VEHICLE_DOUBLE_BOOKED if any other Trip on the same vehicle_id has an overlapping `[scheduled_departure_at, scheduled_arrival_at)` half-open interval. Adjacent-endpoint case (one trip's arrival == another's departure) is allowed because of the half-open semantics — this is the interval-arithmetic flavor of rule 8 overlap A." }
      - { name: "actual_departure_at",  type: "datetime",source: "system",   description: "Timestamp written by POST /trips/{id}/depart. Null while in PLANNED. Always within `now() ± 30 minutes` of the call time (the spec doesn't enforce a tight slack window — the recorded value is exactly `now()` at the time of the call). Once set, immutable for the trip's life." }
      - { name: "actual_arrival_at",    type: "datetime",source: "system",   description: "Timestamp written by POST /trips/{id}/arrive. Null while not yet in COMPLETED. Strict `> actual_departure_at`." }
      - { name: "aborted_at",           type: "datetime",source: "system",   description: "Timestamp written on POST /trips/{id}/abort or on the cascaded permit-expiry abort. Null when not aborted." }
      - { name: "abort_reason",         type: "enum",    source: "system",   description: "Why the trip was aborted.", constraints: "values: OPERATOR_ABORT, PERMIT_SUSPENDED_CASCADE, PERMIT_EXPIRED_CASCADE, GPS_VIOLATION_LIMIT, null" }
      - { name: "trip_status",          type: "enum",    source: "computed", description: "The trip's state-machine state.", constraints: "values: PLANNED, IN_TRANSIT, COMPLETED, ABORTED. Initial state PLANNED. Terminal {COMPLETED, ABORTED}. See state machine §1.2 `Trip.trip_status` for the fork from IN_TRANSIT to {COMPLETED, ABORTED} that satisfies the second non-linear-shape entity for rule 3 if the Route's branching-with-revert isn't counted." }
      - { name: "latest_gps_at",        type: "datetime",source: "computed", description: "The largest `reported_at` across all GPSReport rows for this trip. Null when no reports yet. The monotonicity check (rule 8 overlap B) is: a new POST /trips/{tid}/gps-reports is accepted only when its `reported_at` is strictly greater than this value. Equal-timestamp is rejected (closed-on-the-prior-edge), in contrast with the trip-schedule's half-open-permits-adjacency interval semantics — the two different interval semantics on two different resource entities (Vehicle calendar half-open vs GPS-stream strict-greater-than) satisfy rule 8's 'different interval semantics, different resources' clause." }
      - { name: "gps_violation_count",  type: "integer", source: "computed", description: "Running count of penalty rows whose source is GPS_VIOLATION_SPEED or GPS_VIOLATION_OFF_ROUTE for this trip's driver, time-bounded to the trip's `[actual_departure_at, actual_arrival_at or now()]` window. A reach-the-cap policy is intentionally NOT modeled here (the orchestrator's brief calls for the easier end of Advanced — adding a per-trip-violation-cap auto-abort would be a fifth automatic-transition path on Trip). The count is exposed for audit only." }
    invariants:
      - "trip_status PLANNED→IN_TRANSIT is the depart action; requires the parent Permit's lifecycle_status is ACTIVE at the moment of the call (rule 7 entity-pair B). IN_TRANSIT→COMPLETED is the arrive action. IN_TRANSIT→ABORTED is either the operator's abort action with abort_reason=OPERATOR_ABORT, or the cascade from a Permit's transition to SUSPENDED or EXPIRED (abort_reason=PERMIT_SUSPENDED_CASCADE or PERMIT_EXPIRED_CASCADE respectively) which fires automatically on the parent's transition's side_effects list. The trip-status fork from IN_TRANSIT (to COMPLETED or ABORTED) provides the non-linear shape on Trip."
      - "Once trip_status is COMPLETED or ABORTED (terminal), no further GPS reports are accepted (ERR_GPS_OUT_OF_WINDOW). Reports submitted before depart (trip_status == PLANNED) are also rejected with the same error — the in-window guard is the inclusive `[actual_departure_at, terminal_time]` interval, with terminal_time being min(actual_arrival_at, aborted_at, now()) on the open end."

  # ─────────────────────────────────────────────────────────────────────────
  # 8. GPSReport — immutable event log of one GPS sample per row.
  # ─────────────────────────────────────────────────────────────────────────
  - name: GPSReport
    parent: Trip
    common_fields: false
    description: "An append-only telemetry sample from a hazmat vehicle's GPS unit, attributed to a single in-transit Trip. The full stream is monotone-non-decreasing in `reported_at` per spec, and the stricter monotonicity (strictly-greater-than, rule 8 overlap B) is enforced at the API boundary. Idempotency-Key header dedups retries: same key + same body returns the original 201; same key + different body is ERR_IDEMPOTENCY_KEY_REUSED."
    fields:
      - { name: "trip_id",           type: "string",  source: "input",   description: "Foreign key derived from the URL path." }
      - { name: "reported_at",       type: "datetime",source: "input",   description: "When the on-board GPS unit's clock said the fix was taken. The server's monotonicity check is on this field, not on the receive time. Must be strictly greater than the trip's current `latest_gps_at`; must lie in the trip's in-window interval (see Trip.latest_gps_at invariant prose). ERR_GPS_OUT_OF_ORDER for the equal-or-earlier case; ERR_GPS_OUT_OF_WINDOW for the out-of-interval case. The validation order is window-check first, then order-check, so a report that is both out-of-window AND out-of-order returns ERR_GPS_OUT_OF_WINDOW (this fixes the precedence pin for rule 5-style priority conflicts on the GPS path)." }
      - { name: "received_at",       type: "datetime",source: "system",  description: "Server-side receive timestamp, equal to `now()` at the moment the POST completes. Diagnostic; not load-bearing." }
      - { name: "lat",               type: "number",  source: "input",   description: "WGS-84 latitude, -90 to +90. ERR_VALIDATION otherwise." }
      - { name: "lon",               type: "number",  source: "input",   description: "WGS-84 longitude, -180 to +180. ERR_VALIDATION otherwise." }
      - { name: "speed_kph",         type: "number",  source: "input",   description: "Instantaneous speed in kph at the sample moment. Non-negative. The speed-violation check (calc `gps_violation_classification`) compares this against `MAX_HAZMAT_SPEED_KPH` (the symbolic constant whose numeric value is in SCAFFOLD_DIFFICULTY_DESIGN); strict `>` triggers a GPS_VIOLATION_SPEED Penalty auto-creation." }
      - { name: "heading_deg",       type: "number",  source: "input",   description: "Compass heading 0..360 (360 == 0). Diagnostic; not load-bearing." }
      - { name: "off_route_distance_m", type: "number", source: "system", description: "Computed perpendicular distance in meters from this report's (lat, lon) to the nearest segment of the parent permit's route's polyline, using the haversine-segment formula. Written by the server at insert time so the read path doesn't have to recompute. The off-route violation check is `off_route_distance_m > OFF_ROUTE_RADIUS_M` (strict `>`); on a violation, a GPS_VIOLATION_OFF_ROUTE Penalty is auto-created against the trip's driver. The violation is logged but the GPS report itself is still accepted and recorded — the server doesn't reject GPS samples for being off-route; it just penalizes." }
      - { name: "idempotency_key",   type: "string",  source: "input",   description: "Optional client-supplied dedup key, lifted from the Idempotency-Key request header. Scoped per-trip — the same string on two different trips is two independent slots. Null in the on-disk record when the header is absent." }
      - { name: "auto_penalty_ids",  type: "array",   source: "system",  description: "Ids of the Penalty rows auto-created by this GPS report (0, 1, or 2 entries: at most one of each violation type per report). Stored on the report row for the audit-cascade-trace per rule 4 cascade A. Empty array when the report is clean."}

  # ─────────────────────────────────────────────────────────────────────────
  # 9. Penalty — append-only ledger of disciplinary points.
  # ─────────────────────────────────────────────────────────────────────────
  - name: Penalty
    parent: null   # subject is polymorphic-by-discriminator (subject_type, subject_id); not a foreign-key constraint at the schema level, but the application-layer existence-check is in §1.4.
    common_fields: false
    description: "An append-only disciplinary record. Subject is identified by the (subject_type, subject_id) pair using `taxonomies.penalty_subject_types`. Source distinguishes manual regulator entries from auto-created GPS-violation entries. The regulator's appeal-uphold action (POST /penalties/{id}/uphold) flips `void_status` to UPHELD and removes the points from the subject's rolling total — this is the compensating action that satisfies rule 9 invariant B on the conserved quantity 'sum of points-value of non-UPHELD penalties whose observed_at is within the rolling window for the subject'."
    fields:
      - { name: "subject_type",  type: "enum",    source: "input",  description: "Penalty subject kind.", constraints: "one of DRIVER, COMPANY, VEHICLE (from taxonomies.penalty_subject_types)" }
      - { name: "subject_id",    type: "string",  source: "input",  description: "UUID of the subject entity. The application-layer existence check fires the appropriate ERR_*_NOT_FOUND (ERR_DRIVER_NOT_FOUND, ERR_COMPANY_NOT_FOUND, ERR_VEHICLE_NOT_FOUND) when the id doesn't resolve." }
      - { name: "points_value",  type: "integer", source: "input",  description: "Disciplinary points. Non-negative integer. For GPS-auto-penalties, the value is drawn from the gps_violation_classification calc's constants table (one fixed value per violation_type); for MANUAL_REGULATOR, the regulator supplies the value in the request body (range 1..50 enforced by ERR_VALIDATION)." }
      - { name: "source",        type: "enum",    source: "system", description: "Where the penalty came from.", constraints: "one of MANUAL_REGULATOR, GPS_VIOLATION_SPEED, GPS_VIOLATION_OFF_ROUTE (from taxonomies.penalty_sources)" }
      - { name: "source_gps_report_id", type: "string", source: "system", description: "When source is a GPS_VIOLATION_*, the GPSReport.id that triggered it. Null for MANUAL_REGULATOR. Lets the audit trail walk back from a penalty to the offending sample." }
      - { name: "trip_id",       type: "string",  source: "system", description: "The Trip context in which the GPS violation occurred. Null for MANUAL_REGULATOR. The trip's `permit_id` then chains the audit back to the permit that was in force at the moment." }
      - { name: "observed_at",   type: "datetime",source: "input",  description: "Wall-clock moment the violation occurred. For GPS violations, equal to the triggering GPSReport's `reported_at`. For manual entries, supplied by the regulator and must be `<= now()`. Drives the 12-month rolling-window inclusion: a penalty falls out of the window when `now() - observed_at > PENALTY_WINDOW_DAYS` (the rule pinned in the driver_penalty_point_rolling_total calc's input_set)." }
      - { name: "void_status",   type: "enum",    source: "computed", description: "Has this penalty been appealed and upheld?", constraints: "values: ACTIVE, UPHELD. Initial value ACTIVE. The appeal-uphold action flips to UPHELD; UPHELD is terminal — appeals cannot be re-opened. Wait, that wording is misleading: 'uphold the appeal' in regulatory parlance means the appeal succeeds and the penalty is voided. So 'UPHELD' here is the spec's name for the voided-via-successful-appeal state. Cleanest reading: ACTIVE means counts toward the rolling total; UPHELD means doesn't count. The naming is deliberate — the appeal-uphold endpoint is the act of *upholding the appeal*." }
      - { name: "upheld_at",     type: "datetime",source: "system",  description: "When the appeal was upheld. Null while ACTIVE. Must satisfy `upheld_at - observed_at <= APPEAL_WINDOW_DAYS` (the 30-day appeal window); a POST /penalties/{id}/uphold after that window is ERR_APPEAL_WINDOW_CLOSED 409. Note the window is measured from the violation's `observed_at`, not from the penalty's `created_at` — this matters for auto-created GPS penalties where the GPS report may have arrived at the server hours after the underlying observation." }
      - { name: "upheld_by",     type: "string",  source: "system",  description: "X-User-ID of the RegulatorOfficer who upheld the appeal. Null while ACTIVE." }
      - { name: "reason_note",   type: "string",  source: "input",   description: "Free-text reason. Required (1..500 chars) on POST /penalties for manual entries; auto-set to a canonical string ('Auto: speed exceeded MAX_HAZMAT_SPEED_KPH' or 'Auto: off-route by more than OFF_ROUTE_RADIUS_M') on the GPS-auto-penalty path. The appeal-uphold action takes a separate `uphold_reason` body field (also 1..500 chars) and stores it as a separate appended note — but to keep the entity flat, the scaffold pins it as a server-side prefixed prepend on the same `reason_note` field: 'UPHELD-ON-APPEAL: <uphold_reason>; ORIGINAL: <original_reason>'. Implementations may store the two reasons as separate fields if they prefer; the canonical observable for tests is the (`void_status`, `upheld_at`, `upheld_by`) triple." }

# §1.2 — State machines
state_machines:
  # ─────────────────────────────────────────────────────────────────────────
  # TransportCompany.qualification_status — the company-side license lifecycle.
  # Shape: linear forward with a revocation revision-loop (APPROVED→DRAFT).
  # The DRAFT→SUBMITTED→APPROVED chain plus the APPROVED→DRAFT revoke-loop
  # provides the cycle that contributes one of the two non-linear machines
  # required by rule 3.
  # ─────────────────────────────────────────────────────────────────────────
  - entity: TransportCompany
    state_field: qualification_status
    initial_state: DRAFT
    terminal_states: []   # The company is a long-lived legal entity; no terminal-absorbing state.
    states:
      DRAFT:     "The application form exists but has not been submitted for review. The operator can still edit address, hazard-classes-authorized list, contact email."
      SUBMITTED: "The operator has finalized the application. The regulator has it in their queue. The operator cannot edit while in SUBMITTED — a `PATCH /companies/{id}` while in SUBMITTED is ERR_INVALID_STATE_TRANSITION. (PATCH /companies/{id} is not in the endpoint list of this scaffold; the edit-during-DRAFT is exercised by the submit-then-the-app-is-frozen test, and the lockout in SUBMITTED is by virtue of there being no edit endpoint.)"
      APPROVED:  "The regulator has approved the qualification. The company is now eligible to be named as the `company_id` of a Permit application. The cross-entity precondition `permit.company.qualification_status == APPROVED` is checked at every POST /permits and every POST /permits/{id}/issue."
      REVOKED:   "The regulator has stripped the company's qualification (e.g., for a serious safety incident). All ACTIVE permits whose `company_id` equals this company's id are cascade-suspended on the next verify-compliance call observing the cross-entity inconsistency. The REVOKED→DRAFT transition is the operator's path to re-apply after remediation, completing the cycle that contributes to rule 3."
    transitions:
      - from: DRAFT
        to:   SUBMITTED
        trigger: "POST /companies/{id}/submit"
        actor: CompanyOperator
        preconditions:
          - "The acting operator's X-User-ID equals the company's id (ownership)."
          - "`hazard_classes_authorized` is non-empty."
          - "`primary_contact_email` and `legal_name` are non-empty."
          - "`registration_number` matches the format regex (the format check is run at creation time too — the precondition here is that the field is still present, which is the no-edit-after-submit invariant)."
        side_effects:
          - "Set `submitted_at = now()`."
          - "Bump `version` by 1."
          - "Update `updated_at` to `now()`."
        guard_expression: "qualification_status == DRAFT"
      - from: SUBMITTED
        to:   APPROVED
        trigger: "POST /companies/{id}/approve"
        actor: RegulatorOfficer
        preconditions:
          - "qualification_status == SUBMITTED."
          - "The regulator's review checklist passed (out-of-band; the endpoint trusts the regulator-role attestation)."
        side_effects:
          - "Set `approved_at = now()`."
          - "If this is the first approval after a previous REVOKED→DRAFT cycle, the value of `revoked_at` is left intact for audit. (Reading the prose: the field documents 'the most-recent' revocation, not 'the latest one cleared'; readers learn the current standing from `qualification_status` alone.)"
          - "Bump version, updated_at."
        guard_expression: "qualification_status == SUBMITTED"
      - from: APPROVED
        to:   REVOKED
        trigger: "POST /companies/{id}/revoke"
        actor: RegulatorOfficer
        preconditions:
          - "qualification_status == APPROVED."
          - "The request body carries a `reason_note` field (1..500 chars), which is logged out-of-band but not stored on the company row in this scaffold (the audit trail is conceptually a separate stream not modeled here)."
        side_effects:
          - "Set `revoked_at = now()`."
          - "Cascade: for every Permit with `company_id == this company's id` and `lifecycle_status == ACTIVE`, the next verify-compliance call (manual or via the daily sweep) observes the new strict-snapshot value of `snapshot_company_qualified` as false and transitions the permit ACTIVE→SUSPENDED. The cascade is *deferred* — the revoke action itself does not synchronously walk the permit table. This is the deliberate eventual-consistency seam baked into the posture-driven aggregate, and the test harness's POST /_sweep/run is the deterministic trigger that flushes the cascade in tests (alternatively, calling POST /permits/{id}/verify-compliance individually on each affected permit also fires the per-permit transition synchronously)."
          - "The cross-entity cascade is the depth-1 link of rule 7 entity-pair A; the same cascade with the GPS-violation-then-driver-flip-then-permit-suspend chain composes a depth-3 transitive cascade for rule 4 cascade A."
          - "Bump version, updated_at."
        guard_expression: "qualification_status == APPROVED"
      - from: REVOKED
        to:   DRAFT
        trigger: "POST /companies/{id}/submit  (treated as a reapply when the source state is REVOKED — the same endpoint cycles the company back through the lifecycle, completing the revision-loop on this entity that is one half of rule 3's two-non-linear-machines clause)"
        actor: CompanyOperator
        preconditions:
          - "qualification_status == REVOKED."
          - "Acting operator owns the company (ownership check, ERR_CROSS_TENANT_ACCESS otherwise)."
          - "Wait — the cleaner reading is that POST /companies/{id}/submit is the DRAFT→SUBMITTED transition only; the REVOKED→DRAFT transition is a separate action `POST /companies/{id}/reapply` that takes the company back to DRAFT, after which the standard submit→approve chain resumes. For the endpoint inventory the reapply action is folded into the submit endpoint's behavior: if the current state is REVOKED, the submit endpoint first transitions REVOKED→DRAFT internally (an atomic no-side-effect bookkeeping step) and then DRAFT→SUBMITTED. This is documented here so the state machine is well-defined; the API surface stays at the single submit endpoint."
        side_effects:
          - "Clear `submitted_at` (becomes the new submission's timestamp on the subsequent DRAFT→SUBMITTED step within the same request)."
          - "`approved_at` and `revoked_at` are left in place as the audit trail of the prior cycle."
          - "Bump version, updated_at."
        guard_expression: "qualification_status == REVOKED"
        note: |
          This is an instantaneous internal step inside the submit endpoint's handler when the
          observed pre-state is REVOKED; the externally-observable two-step is REVOKED → (internal: DRAFT) → SUBMITTED.
          The cycle's existence is what satisfies rule 3 for this entity. The on-disk trace
          is that `qualification_status` was REVOKED before the request and is SUBMITTED after,
          with `submitted_at` refreshed.

  # ─────────────────────────────────────────────────────────────────────────
  # TransportRoute.approval_status — the route-application lifecycle.
  # Shape: branching with revert (the SUBMITTED→REJECTED→DRAFT revision-loop
  # is the cycle), providing the second non-linear machine for rule 3 on a
  # different entity from TransportCompany.
  # ─────────────────────────────────────────────────────────────────────────
  - entity: TransportRoute
    state_field: approval_status
    initial_state: DRAFT
    terminal_states: []
    states:
      DRAFT:     "Operator-editable. The polyline, the hazard_classes_supported list, and the origin/destination labels are all mutable. There's no separate PATCH endpoint in this scaffold for the in-DRAFT edits; the orchestrator's brief is the easier-end-of-Advanced, so the route's body is supplied in full on the POST creation, and the only on-disk transitions are the state-machine actions below. The DRAFT-state edit-history is conceptually possible but elided from the API surface."
      SUBMITTED: "The operator has finalized the route application. The regulator has it pending."
      APPROVED:  "The regulator has approved the route. Permits may name this `route_id`. The route is locked — the polyline cannot be edited without a fresh route application."
      REJECTED:  "The regulator has rejected the application with a `rejection_reason`. The operator can transition the route back to DRAFT by invoking the submit endpoint on a REJECTED route (the same internal-collapse pattern as the company's REVOKED→DRAFT step), which is the revision-loop edge for rule 3's non-linear-shape on this entity."
    transitions:
      - from: DRAFT
        to:   SUBMITTED
        trigger: "POST /routes/{id}/submit"
        actor: CompanyOperator
        preconditions:
          - "Ownership: the route's company_id equals the acting operator's X-User-ID (which is a TransportCompany id)."
          - "`polyline` has at least 2 points."
          - "`hazard_classes_supported` is non-empty and is a subset of the owning company's `hazard_classes_authorized` AT THE TIME OF SUBMIT — note the time-of-check vs time-of-use here: the regulator's approve action at a later time re-checks the same subset relation with the company's then-current authorized list, and if the company's list has narrowed in between (because a different regulator action revoked some hazard classes), the approve fails with ERR_VALIDATION pinning the now-illegal class. This is a deliberate two-time-point check that the doc-generator should narrate as 'the route's hazard-class supportedness is verified both at submission and again at approval'."
        side_effects:
          - "Clear `rejection_reason` if it was previously set (a previous REJECTED→DRAFT loop's reason is wiped on the new submit's transit through DRAFT, per the company's cycle-clears-prior-state pattern)."
          - "Bump version, updated_at."
        guard_expression: "approval_status == DRAFT"
      - from: SUBMITTED
        to:   APPROVED
        trigger: "POST /routes/{id}/approve"
        actor: RegulatorOfficer
        preconditions:
          - "approval_status == SUBMITTED."
          - "The two-time-point hazard-class-subset check (see above) holds against the company's current `hazard_classes_authorized`."
          - "The polyline's basic geometric well-formedness is re-checked (no NaN, lat/lon in range, monotone arc length non-negative)."
        side_effects:
          - "Set `approved_at = now()`."
          - "Set `approved_by = X-User-ID of the regulator`."
          - "Clear `rejection_reason` (set to null) if it carries a stale value from a prior cycle."
          - "Bump version, updated_at."
        guard_expression: "approval_status == SUBMITTED"
      - from: SUBMITTED
        to:   REJECTED
        trigger: "POST /routes/{id}/reject"
        actor: RegulatorOfficer
        preconditions:
          - "approval_status == SUBMITTED."
          - "The request body carries a non-empty `rejection_reason` (1..500 chars)."
        side_effects:
          - "Set `rejection_reason = body.rejection_reason`."
          - "Leave `approved_at` and `approved_by` as they were (which is null on a first-pass rejection and is the prior approval's audit-record on a re-rejection after a previous approval was somehow rolled back — though the canonical APPROVED state in this scaffold has no out-transition, so the re-rejection-after-approval case is unreachable. Documented for completeness)."
          - "Bump version, updated_at."
        guard_expression: "approval_status == SUBMITTED"
      - from: REJECTED
        to:   DRAFT
        trigger: "POST /routes/{id}/submit  (the submit endpoint's handler internally walks REJECTED→DRAFT before DRAFT→SUBMITTED, the same compound-internal-step pattern as the TransportCompany.qualification_status cycle. Externally observable: a route that was REJECTED is SUBMITTED after the call, with `rejection_reason` cleared and the audit trail of the prior reason preserved out-of-band)."
        actor: CompanyOperator
        preconditions:
          - "approval_status == REJECTED."
          - "Ownership."
        side_effects:
          - "Clear rejection_reason."
          - "Bump version, updated_at."
        guard_expression: "approval_status == REJECTED"
        note: |
          This is the revision-loop cycle edge contributing to rule 3 on the
          TransportRoute entity (the other non-linear-shape machine is the
          TransportCompany.qualification_status cycle, on a different entity,
          satisfying rule 3's 'two different entities' clause).

  # ─────────────────────────────────────────────────────────────────────────
  # Driver.hazmat_endorsement_status — the endorsement standing.
  # Shape: VALID ↔ INVALID cycle, with NOT_ATTESTED as the bootstrap state.
  # This contributes a third non-linear machine and is the locus of the
  # auto-transition from the rolling-points threshold crossover (cascade A
  # of rule 4) and from the endorsement-expiry-time crossover.
  # ─────────────────────────────────────────────────────────────────────────
  - entity: Driver
    state_field: hazmat_endorsement_status
    initial_state: NOT_ATTESTED
    terminal_states: []
    states:
      NOT_ATTESTED: "The operator has registered the driver via POST /companies/{cid}/drivers but no RegulatorOfficer has yet run the endorsement-attestation. The driver cannot appear in any Permit's `authorized_driver_ids` while in this state — ERR_DRIVER_ENDORSEMENT_INVALID is the error id (the wording 'INVALID' covers both NOT_ATTESTED and INVALID-due-to-revocation; the doc-generator should narrate the two sub-causes via the `hazmat_endorsement_status` enum value rather than via two separate error ids, to keep the catalog at the orchestrator's 25-error target)."
      VALID:        "The regulator has attested the endorsement and the driver's rolling 365-day penalty-point total is strictly below THRESHOLD_DRIVER_SUSPENSION_POINTS and the wall-clock has not yet passed `endorsement_valid_until`. This is the green-light state."
      INVALID:      "Any of the three VALID-preserving conditions has flipped: the regulator manually invalidated the endorsement, or the penalty-points crossed the threshold, or the endorsement-expiry time has been reached. The cause is recoverable for the first and second (regulator can re-attest after the operator's remediation, or the rolling window's natural decay can bring the points back below threshold) and is non-recoverable in the third case without a fresh attestation refresh."
    transitions:
      - from: NOT_ATTESTED
        to:   VALID
        trigger: "POST /drivers/{id}/refresh-endorsement"
        actor: RegulatorOfficer
        preconditions:
          - "hazmat_endorsement_status in {NOT_ATTESTED, INVALID}."
          - "The request body supplies `endorsement_valid_until` (must be `> now()`)."
          - "The request body supplies `endorsement_classes` (non-empty subset of the parent TransportCompany's `hazard_classes_authorized`)."
          - "The driver's `current_rolling_points` is strictly less than THRESHOLD_DRIVER_SUSPENSION_POINTS at the moment of the call (a regulator cannot attest a driver who is currently over the points threshold; the driver must first wait for old penalties to fall out of the 365-day window, or for the appeal-uphold action to void some penalties)."
        side_effects:
          - "Set `endorsement_valid_until = body.endorsement_valid_until`."
          - "Set `endorsement_classes = body.endorsement_classes`."
          - "The hazmat_endorsement_status's transition target depends on which guard fires: if the points check passes and the time-future check passes, the target is VALID; if the points check fails (which would already have flipped the field to INVALID via the side-effect-driven auto-transition on the most-recent penalty insert), the action itself is rejected with ERR_VALIDATION pinning the cause, so this endpoint cannot directly create the INVALID state — INVALID is reached only via the automatic-cascade routes below."
          - "Cascade: every Permit listing this driver gets its `snapshot_driver_endorsements[driver_id]` flag re-evaluated at the next verify-compliance call. The pre-existing snapshot is unchanged until that call — the time-of-most-recent-verify-vs-time-of-attestation is precisely the dual-variant axis for rule 1 calc 1."
          - "Bump version, updated_at."
        guard_expression: "hazmat_endorsement_status in {NOT_ATTESTED, INVALID} AND body.endorsement_valid_until > now() AND driver.current_rolling_points < THRESHOLD_DRIVER_SUSPENSION_POINTS AND body.endorsement_classes is a subset of driver.company.hazard_classes_authorized"
      - from: VALID
        to:   INVALID
        trigger: "system event — automatic — fires on (a) a Penalty.create or POST /penalties side-effect that pushes the driver's `current_rolling_points` to >= THRESHOLD_DRIVER_SUSPENSION_POINTS, (b) the daily POST /_sweep/run observing `endorsement_valid_until <= now()`, or (c) a manual regulator override via a body flag `{revoke: true}` on POST /drivers/{id}/refresh-endorsement (which sets `endorsement_valid_until = now()` and lets the standard expiry path do the rest)."
        actor: system
        preconditions:
          - "hazmat_endorsement_status == VALID."
          - "At least one of: rolling-points-threshold-crossed, wall-clock-past-validity, regulator-manual-revoke."
        side_effects:
          - "The Driver's row's hazmat_endorsement_status is written to INVALID atomically with whatever transaction triggered it (the penalty insert, the sweep tick, or the refresh-endorsement-with-revoke body)."
          - "Bump version, updated_at on the Driver row."
          - "Downstream cascade (rule 4 cascade A's third hop): every ACTIVE Permit listing this driver_id will, on its next verify-compliance call, observe the snapshot-vs-live mismatch on the drivers-leg of the validity AND-chain and transition ACTIVE→SUSPENDED. The chain depth from the original GPS-report-with-speed-violation is 4 hops (gps-report → penalty-create → driver.endorsement-flip → permit.verify-compliance-on-the-next-tick), giving the depth ≥ 3 required for one of rule 4's two cascades."
        guard_expression: "hazmat_endorsement_status == VALID AND (driver.current_rolling_points >= THRESHOLD_DRIVER_SUSPENSION_POINTS OR now() >= driver.endorsement_valid_until OR explicit_revoke_flag)"
        note: "This is the auto-transition that the spec's testability-completeness principle requires the test harness be able to reach — the POST /_sweep/run endpoint is the deterministic trigger for the wall-clock case, and the POST /penalties endpoint is the deterministic trigger for the points-crossover case. The combination of those two test-driving endpoints satisfies the principle."
      - from: INVALID
        to:   VALID
        trigger: "POST /drivers/{id}/refresh-endorsement (after the cause has cleared) — the regulator re-attests. This is the inverse edge that gives rule 3 its cycle on the Driver entity. The cycle is VALID → (auto-flip) → INVALID → (regulator-re-attest) → VALID. Note this VALID→INVALID→VALID round-trip is a different cycle from the TransportCompany's APPROVED→REVOKED→DRAFT→SUBMITTED→APPROVED round-trip and the TransportRoute's SUBMITTED→REJECTED→DRAFT→SUBMITTED→APPROVED round-trip — three different cycle structures on three different entities, well above rule 3's 'two-different-entities' minimum."
        actor: RegulatorOfficer
        preconditions:
          - "hazmat_endorsement_status == INVALID."
          - "If the cause was points-threshold, `driver.current_rolling_points < THRESHOLD_DRIVER_SUSPENSION_POINTS` at the moment of the re-attestation (the threshold is a single shared symbol; the rolling-window-natural-decay path and the appeal-uphold-voids-penalties path both reduce the count)."
          - "If the cause was wall-clock-expiry, the body's new `endorsement_valid_until` is `> now()`."
          - "The body's `endorsement_classes` is a non-empty subset of the parent company's current `hazard_classes_authorized`."
        side_effects:
          - "Same as the NOT_ATTESTED→VALID transition's side effects, modulo not clearing the on-disk history fields."
          - "The downstream cascade-up to ACTIVE permits is symmetric to the VALID→INVALID cascade-down: the next verify-compliance call on each affected permit observes the now-valid driver-leg and, if all other legs hold, flips the permit's lifecycle_status from SUSPENDED back to ACTIVE. This is the upward arm of the rule 4 cascade B-flavored chain — the orchestrator's brief asks for two cascades, A depth ≥3 (the downward speed-violation chain) and B depth ≥2 (the permit-expiry chain). The upward re-attest-then-permit-reinstate chain is also depth 2 and is a third candidate cascade for the difficulty index."

  # ─────────────────────────────────────────────────────────────────────────
  # Permit.lifecycle_status — the central posture-driven aggregate.
  # ─────────────────────────────────────────────────────────────────────────
  - entity: Permit
    state_field: lifecycle_status
    initial_state: DRAFT
    terminal_states: [EXPIRED, VOIDED]
    states:
      DRAFT:     "The operator has filed a permit application via POST /permits. The strict-snapshot fields are written based on the values of the grounding entities at application time. The wallet has NOT been debited; the issue fee is not collected until the regulator issues. While DRAFT, the issue checks have all been pre-run at the application path so the operator gets early feedback (the application can be rejected with the appropriate ERR_X_NOT_VALID error if any of the cross-entity preconditions fail at submission), but the wallet-side debit is deferred to the issue step. This separation is important because the company-wallet check has its own error precedence relative to the cross-entity-validity checks (see §1.4 for the ordering)."
      ACTIVE:    "The regulator has run POST /permits/{id}/issue successfully. The wallet has been debited. valid_from and valid_until are pinned. Trips can be authorized against this permit. The verify-compliance and renew actions are both legal in this state."
      SUSPENDED: "A subsequent verify-compliance call observed an invalidating change in one of the grounding entities — the company's qualification flipped to REVOKED, or a driver's endorsement flipped to INVALID, or a vehicle's most-recent inspection lapsed or was marked CONDITIONAL/FAILED, or the route was revoked back to a non-APPROVED state. The wall-clock-expiry case goes directly ACTIVE→EXPIRED, bypassing SUSPENDED. The cycle SUSPENDED→ACTIVE fires on the next verify-compliance observing a fully-clean strict-snapshot; this provides the Permit-entity's non-linear-cycle for rule 3. Trips on a SUSPENDED permit are not auto-aborted — they are auto-aborted only on the harder ACTIVE→EXPIRED and ACTIVE→VOIDED transitions per the testability principle's 'observable' requirement (a brief mid-trip suspension followed by reinstatement should leave the trip running, which matches regulatory practice for transient-cause suspensions). Wait — that's a delicate design choice. Re-pinning the semantics: a SUSPENDED permit's in-progress trips are HALTED (a per-trip 'paused' flag is set on the Trip's audit field, and any new GPS-report posted while the permit is SUSPENDED returns ERR_PERMIT_NOT_ACTIVE, which is the rule-5 priority-conflict input for the trips-vs-route-vs-permit precedence question). On the SUSPENDED→ACTIVE reinstate, the GPS-stream resumes. The trip-status field itself doesn't change on the permit's suspend/reinstate cycle — only the GPS-report-write path is gated. This keeps the trip state machine clean and pushes the gating to the GPS-report endpoint's validation."
      EXPIRED:   "Terminal. The wall clock has crossed `valid_until` (the half-open right-exclusive boundary, satisfying rule 6 boundary B). All in-progress trips (PLANNED or IN_TRANSIT) on this permit are cascade-aborted with abort_reason=PERMIT_EXPIRED_CASCADE. This is the second half of rule 4 cascade B (the clock-sweep's depth-2 chain: sweep → permit-expiry → trip-abort)."
      VOIDED:    "Terminal. The regulator's clerical-error reversal action POST /permits/{id}/void-issue was invoked within VOID_ISSUE_WINDOW_HOURS hours of the issue. The issue-fee and any renewal-fees recorded in `renewal_history` are credited back to the company's wallet in a single atomic compensating transaction (the conserved-quantity invariant on currency for rule 9 invariant A). The on-disk row remains for audit. In-progress trips are cascade-aborted with abort_reason=PERMIT_SUSPENDED_CASCADE — wait, the clean reading is a dedicated `abort_reason=PERMIT_VOIDED_CASCADE` for this case, distinct from suspension and expiry. The Trip's `abort_reason` enum already has PERMIT_SUSPENDED_CASCADE and PERMIT_EXPIRED_CASCADE — for the VOIDED-permit-cascade the scaffold reuses PERMIT_SUSPENDED_CASCADE since the void's effect on a downstream trip is operationally identical to a suspension (the cargo can't move, the trip is undone). This is a deliberate enum-economy choice — the abort_reason enum stays at the four values listed in the Trip entity's field constraint (OPERATOR_ABORT, PERMIT_SUSPENDED_CASCADE, PERMIT_EXPIRED_CASCADE, GPS_VIOLATION_LIMIT, plus null). The doc-generator should narrate the void-cascade and the suspension-cascade as separate prose paragraphs even though the on-disk discriminator value coincides."
    transitions:
      - from: DRAFT
        to:   ACTIVE
        trigger: "POST /permits/{id}/issue"
        actor: RegulatorOfficer
        preconditions:
          - "lifecycle_status == DRAFT."
          - "The permit's `company_id`'s TransportCompany.qualification_status is APPROVED at the moment of the call (rule 7 entity-pair A, cross-entity check on Permit ↔ TransportCompany)."
          - "Every driver_id in `authorized_driver_ids` references a Driver with `hazmat_endorsement_status == VALID` and `endorsement_valid_until >= permit.valid_from + PERMIT_DEFAULT_VALIDITY_DAYS` (i.e., the endorsement covers the whole permit term)."
          - "Every vehicle_id in `authorized_vehicle_ids` references a Vehicle with `latest_inspection_outcome == 'PASSED'` and `latest_inspection_valid_until >= permit.valid_from + PERMIT_DEFAULT_VALIDITY_DAYS`."
          - "The TransportRoute referenced by `route_id` has `approval_status == APPROVED`."
          - "`valid_from >= now()` and `valid_from + PERMIT_DEFAULT_VALIDITY_DAYS` overflows-not the year-9999 boundary (the upper bound on datetime is the standard year-9999 cap; in practice the operator supplies valid_from in the near future)."
          - "`hazard_classes` is a non-empty subset of `company.hazard_classes_authorized ∩ route.hazard_classes_supported`."
          - "`MAX_VEHICLES_PER_PERMIT >= len(authorized_vehicle_ids) >= 1`."
          - "The company's wallet has sufficient funds: `company.wallet_balance_cents >= annual_renewal_fee(now(), len(authorized_vehicle_ids), is_late=false, base_constants)`."
          - "The validation order is the §1.4 priority-ordered list (auth → role → existence-of-permit → existence-of-grounding-entities → state-of-permit-is-DRAFT → state-of-grounding-entities → fiscal-wallet-sufficiency)."
        side_effects:
          - "Set `valid_until = valid_from + PERMIT_DEFAULT_VALIDITY_DAYS`."
          - "Compute `issue_fee_cents = annual_renewal_fee(now(), len(authorized_vehicle_ids), is_late=false, K)` per §1.3 — pinned at this moment, never recomputed in place."
          - "Debit `company.wallet_balance_cents -= issue_fee_cents` atomically."
          - "Write the strict-snapshot fields from the current grounding-entity values (the regulator-attested snapshot, as of `now()`): `snapshot_company_qualified = true`, every `snapshot_driver_endorsements[did] = true` for `did in authorized_driver_ids`, every `snapshot_vehicle_inspections[vid] = true` for `vid in authorized_vehicle_ids`, `snapshot_route_approved = true`, `snapshot_within_window = (valid_from <= now() < valid_until)` — note this is `true` exactly when `valid_from == now()` (the lower endpoint inclusive) or when the operator set valid_from before now() somehow (which the precondition `valid_from >= now()` rules out modulo a half-second window), so on the conventional issue path snapshot_within_window starts as `true` if and only if valid_from is `<= now()`. The operator's standard pattern is to set valid_from = `now()` or a few hours in the future; in the latter case the permit is ACTIVE-but-not-yet-in-window per the strict-snapshot flag, which the live recompute reconciles on the next verify-compliance. This is intentional — the verify-compliance path is the single source of truth for the within-window-and-all-grounding-valid posture."
          - "Set `issued_at = now()`, `issued_by = X-User-ID`, `last_verified_at = now()`, lifecycle_status = ACTIVE."
          - "Append a phantom 'renewal-zero' entry to the renewal_history conceptually — actually no, the canonical reading is that renewal_history starts empty and the issue's fee_cents lives on the dedicated `issue_fee_cents` field, while the renewals list tracks only renewal events. The wallet-debit-on-issue and the renewal-fee-debits are summed separately when the void-issue compensating action computes the refund."
          - "Bump version, updated_at."
        guard_expression: "lifecycle_status == DRAFT AND all five validity sub-checks pass AND wallet has funds"
      - from: ACTIVE
        to:   SUSPENDED
        trigger: "POST /permits/{id}/verify-compliance (the side-effect path inside the verify endpoint's logic, when the live recompute disagrees with the snapshot in the SUSPENDING direction — i.e., live-says-invalid while the prior snapshot was valid). Also fires via the cascade from a TransportCompany.qualification-revoke, a Driver.endorsement-flip-to-INVALID, a VehicleInspection.create-with-FAILED-outcome-that-becomes-latest, and a TransportRoute.approval-rejected — those four upstream events trigger the cascade on the next verify-compliance call observing the inconsistency. The daily POST /_sweep/run also fires verify-compliance internally on every ACTIVE permit, so the cascade-flush is deterministic and reachable from the test harness without having to hand-author the verify-compliance calls."
        actor: system  # the wrapping endpoint is RegulatorOfficer-authenticated, but the state-machine transition itself is system-driven by the verify's internal comparison logic.
        preconditions:
          - "lifecycle_status == ACTIVE."
          - "The live recompute of the five validity legs at the moment of the verify-compliance call disagrees with the on-disk snapshot in at least one position, AND the live recompute says the permit should not be ACTIVE (the not-EXPIRED-and-not-clean case, which by the validity AND-chain's logic means 'at least one leg flipped from true-snapshot to false-live')."
          - "The wall-clock time check is intact (i.e., `now() < valid_until`) — if `now() >= valid_until` the transition target is EXPIRED, not SUSPENDED, and that's the separate auto-transition below. Precedence between SUSPENDED and EXPIRED at the moment of verify-compliance: the wall-clock-expiry check wins, going directly to EXPIRED."
        side_effects:
          - "Write the new strict-snapshot fields from the current grounding-entity values: each of `snapshot_company_qualified`, the per-driver-and-per-vehicle maps, `snapshot_route_approved`, and `snapshot_within_window` is recomputed from the live values."
          - "Set `last_verified_at = now()`."
          - "Cascade onto in-flight Trips: this is the per-trip GPS-write-gate, not a trip-status transition. The trip remains in its IN_TRANSIT (or PLANNED, if it hasn't departed) state, but POST /trips/{tid}/gps-reports against the trip now returns ERR_PERMIT_NOT_ACTIVE until the permit transitions back to ACTIVE. Trip.depart on a PLANNED trip belonging to a SUSPENDED permit also returns ERR_PERMIT_NOT_ACTIVE, with the same precedence as the GPS-write check. The trip's depart-then-be-suspended-mid-trip pattern is handled by allowing the depart action to succeed (because at the moment of depart the permit was ACTIVE) and then having the post-suspend GPS-writes be rejected — the test layer's harness for this scenario uses POST /_clock/advance to ensure the suspend lands between the depart and the next GPS-write. The cleaner alternative — auto-aborting a trip on its parent's suspension — was rejected for the cycle's reversibility: a transient suspension caused by an out-of-window penalty-points event that the appeal-uphold action immediately undoes shouldn't kill the trip. So the trip stays in IN_TRANSIT through the suspension, and the GPS stream is just paused at the API boundary."
          - "Cascade onto the Driver whose endorsement-flip caused the suspension: nothing additional, the Driver's hazmat_endorsement_status flip is the *cause* of this permit suspension, not an effect of it. The direction of causality matters for the audit-cascade-trace."
          - "Bump version, updated_at."
        guard_expression: "lifecycle_status == ACTIVE AND now() < valid_until AND at-least-one-of-the-five-validity-sub-checks is now false on the live recompute"
      - from: SUSPENDED
        to:   ACTIVE
        trigger: "POST /permits/{id}/verify-compliance, when the live recompute says all five legs are now valid again."
        actor: system
        preconditions:
          - "lifecycle_status == SUSPENDED."
          - "All five live-recompute validity legs hold at the moment of the verify call."
          - "`now() < valid_until` (otherwise the target is EXPIRED)."
        side_effects:
          - "Write the strict-snapshot fields all-true."
          - "Set `last_verified_at = now()`."
          - "The GPS-write gate on in-flight trips is implicitly lifted because the gate's condition is `permit.lifecycle_status == ACTIVE`; once the permit row flips back to ACTIVE, the next GPS POST passes the gate."
          - "Bump version, updated_at."
        guard_expression: "lifecycle_status == SUSPENDED AND now() < valid_until AND all five live-recompute legs are valid"
        note: |
          The SUSPENDED ↔ ACTIVE cycle on the Permit entity is the third
          non-linear-shape machine, on a different entity from the Company's
          APPROVED-REVOKED-DRAFT cycle and the Route's REJECTED-DRAFT cycle —
          three different entities with cycles, well above rule 3's
          'two different entities' minimum. The Driver's VALID-INVALID-VALID
          cycle is a fourth, and the Trip's IN_TRANSIT-fork-to-{COMPLETED,ABORTED}
          is a fifth (branching-fork shape rather than a cycle, but still
          non-linear). The scaffold's overall state-machine landscape is
          comfortably non-linear-shape-rich.
      - from: ACTIVE
        to:   EXPIRED
        trigger: "POST /_sweep/run (the deterministic test-harness sweep) or POST /permits/{id}/verify-compliance (which embeds the same wall-clock check). In production, the equivalent of /_sweep/run is a backend daily cron; the test harness exposes it as an endpoint for testability completeness, since otherwise the time-driven transition would not be reachable through the API surface."
        actor: system
        preconditions:
          - "lifecycle_status == ACTIVE."
          - "`now() >= valid_until` (the half-open right-exclusive boundary, rule 6 boundary B). At exactly `now() == valid_until` the permit is EXPIRED (not ACTIVE), matching the snapshot_within_window invariant `valid_from <= last_verified_at < valid_until`. Tests pin this via a POST /_clock/advance that lands `now()` at exactly the boundary."
        side_effects:
          - "Write the strict-snapshot's `snapshot_within_window` to false."
          - "Cascade onto in-flight Trips: for every Trip with `permit_id == this permit's id` whose trip_status is PLANNED or IN_TRANSIT, set trip_status to ABORTED, set `aborted_at = now()`, set `abort_reason = PERMIT_EXPIRED_CASCADE`. The cascade is a synchronous side-effect of the sweep's per-permit handler: a single sweep call that flips N permits each having M trips fires N*M trip-aborts in one transaction. This depth-2 cascade is rule 4 cascade B."
          - "GPS-write attempts on any of the cascade-aborted trips return ERR_GPS_OUT_OF_WINDOW (the trip is no longer in its open in-flight window) — this is the joint effect of the trip-abort and the gps-window gate."
          - "The wallet is not refunded on expiry — the issue fee was for the term, the term elapsed, the fee was earned. The void-issue-window has long since closed (it was a 24-hour window starting at issue, and the permit just ran its full term)."
          - "Bump version, updated_at."
        guard_expression: "lifecycle_status == ACTIVE AND now() >= valid_until"
      - from: SUSPENDED
        to:   EXPIRED
        trigger: "POST /_sweep/run or POST /permits/{id}/verify-compliance — a SUSPENDED permit whose `valid_until` is reached transitions terminally to EXPIRED, the wall-clock check overriding the suspension-vs-reinstatement question (the term ended, the legal authority is over)."
        actor: system
        preconditions:
          - "lifecycle_status == SUSPENDED."
          - "`now() >= valid_until`."
        side_effects:
          - "Same trip-abort cascade as the ACTIVE→EXPIRED branch above (PLANNED and IN_TRANSIT trips are aborted with abort_reason=PERMIT_EXPIRED_CASCADE; the suspension itself did not abort them, but the expiry does)."
          - "Bump version, updated_at."
        guard_expression: "lifecycle_status == SUSPENDED AND now() >= valid_until"
      - from: ACTIVE
        to:   VOIDED
        trigger: "POST /permits/{id}/void-issue"
        actor: RegulatorOfficer
        preconditions:
          - "lifecycle_status == ACTIVE (the void-issue is for clerical-error reversal of a fresh issue; a SUSPENDED permit doesn't need voiding because it's already not authorizing trips, and the regulator's path to terminate a SUSPENDED permit is to wait for its natural expiry. The scaffold deliberately doesn't add a SUSPENDED→VOIDED edge to keep the state machine smaller; the audit trail covers the case via the suspension's reason note out-of-band)."
          - "`now() - issued_at <= VOID_ISSUE_WINDOW_HOURS hours`. Outside that window: ERR_VOID_WINDOW_CLOSED 409."
          - "OCC version check on the permit row (the standard cross-cutting check on all mutating endpoints that accept a `version` field; the void endpoint accepts an optional `version`)."
        side_effects:
          - "Compute the refund amount: `void_refunded_cents = issue_fee_cents + sum(renewal_history[*].fee_cents)`. This is the literal-amount-pinned ledger entry. Per rule 9 invariant A's conservation, this value is the exact sum of the wallet debits the (issue, renewals) sequence took out of the company's wallet, so the void's credit restores the system-wide wallet-plus-regulator-ledger sum to its pre-issue value."
          - "Credit `company.wallet_balance_cents += void_refunded_cents` atomically."
          - "Set `voided_at = now()`."
          - "Cascade: same trip-abort cascade as the EXPIRED transitions, but with `abort_reason = PERMIT_SUSPENDED_CASCADE` per the enum-economy choice in the VOIDED-state's prose above (the on-disk discriminator value matches suspensions; the void's distinct cause lives in the audit trail's out-of-band record). Implementations are free to discriminate via a separate audit-event log, but the canonical observable on the Trip row is `abort_reason == 'PERMIT_SUSPENDED_CASCADE'` for both the genuine-suspension-cascade case (which actually doesn't auto-abort trips in this scaffold — see the SUSPENDED-state prose) and the VOIDED-permit-cascade case. The naming overlap is a deliberate keep-the-enum-small choice; the doc-generator should narrate it carefully."
          - "Wait — there's an inconsistency in the prior bullet. The SUSPENDED state's prose says trips are *not* auto-aborted on suspension, only their GPS-streams are gated. The VOIDED state's cascade says trips *are* auto-aborted. So the `PERMIT_SUSPENDED_CASCADE` enum value, despite its name, is fired only on the VOIDED→trip-abort cascade and on a hypothetical-but-unimplemented suspension-with-explicit-abort. The cleaner naming would have been `PERMIT_VOIDED_CASCADE` for the voided case, but the abort_reason enum is fixed at the four values listed earlier. The scaffold pins the on-disk value as `PERMIT_SUSPENDED_CASCADE` for void-cascaded aborts and notes that a free-text audit log distinguishes the two causes. This avoids enum-bloat at the cost of a small lossy-mapping between the two cause-events. The test layer asserts the abort_reason value on a void-cascade is `PERMIT_SUSPENDED_CASCADE`, and the test docstrings name the cause as 'void-cascade' for human readers."
          - "The conserved-quantity invariant `sum(TransportCompany.wallet_balance_cents) + RegulatorLedger.collected_fees_cents` is the sum of all company wallets' balances plus a conceptual regulator-ledger field that is incremented by every wallet debit and decremented by every credit. The scaffold doesn't model the regulator-ledger as a separate entity (the bookkeeping is implicit — the wallet debits flow into the regulator's bank account out-of-band, and the void's credit flows back from there), but the invariant is testable by checking the company-wallet's net change across an (issue, void-issue) pair: the net is zero. This is rule 9 invariant A's pinned conserved quantity."
          - "Bump version, updated_at."
        guard_expression: "lifecycle_status == ACTIVE AND (now() - issued_at) <= VOID_ISSUE_WINDOW_HOURS_in_seconds"

  # ─────────────────────────────────────────────────────────────────────────
  # Trip.trip_status — the per-trip lifecycle with the fork from IN_TRANSIT.
  # Shape: linear PLANNED→IN_TRANSIT, then a fork from IN_TRANSIT to either
  # COMPLETED (the normal-arrive path) or ABORTED (the failure paths). The
  # fork-from-a-non-initial-state is the branching shape that contributes
  # one more non-linear-shape machine to the rule 3 inventory.
  # ─────────────────────────────────────────────────────────────────────────
  - entity: Trip
    state_field: trip_status
    initial_state: PLANNED
    terminal_states: [COMPLETED, ABORTED]
    states:
      PLANNED:    "The Trip row exists from POST /permits/{pid}/trips. The scheduled_departure_at and scheduled_arrival_at windows are pinned. No GPS reports have been accepted yet (the gps-ingest endpoint rejects with ERR_GPS_OUT_OF_WINDOW for any report whose `reported_at` is outside the not-yet-departed-and-not-yet-completed window, which while in PLANNED is the empty interval)."
      IN_TRANSIT: "POST /trips/{id}/depart has fired. The trip's `actual_departure_at` is `now()` at the moment of the call. The GPS-ingest window is the half-open interval `[actual_departure_at, +inf)` while in IN_TRANSIT (the upper end is closed by the eventual terminal-state-transition's timestamp on the arrive or abort handlers). The vehicle-double-booking interval-arithmetic on `[scheduled_departure_at, scheduled_arrival_at)` is purely a scheduling check on the planned times — the actual-departure-vs-scheduled-departure slack is not policed by the scaffold (the regulator's audit of late departures is out-of-band)."
      COMPLETED:  "Terminal. POST /trips/{id}/arrive has fired. `actual_arrival_at` is set to `now()` at the moment of the call. The GPS stream is closed — any subsequent POST /trips/{tid}/gps-reports returns ERR_GPS_OUT_OF_WINDOW. The cargo-delivery confirmation is conceptually the action that gates the arrive call (the operator attests delivery), but the scaffold doesn't model the cargo confirmation as a separate entity."
      ABORTED:    "Terminal. One of: (a) the operator's POST /trips/{id}/abort action with `abort_reason=OPERATOR_ABORT`; (b) the cascade from POST /permits/{permit_id}/void-issue with `abort_reason=PERMIT_SUSPENDED_CASCADE` (the naming overlap discussed in the Permit.VOIDED prose); (c) the cascade from the wall-clock expiry of the parent permit (ACTIVE→EXPIRED or SUSPENDED→EXPIRED) firing in the daily _sweep/run handler, with `abort_reason=PERMIT_EXPIRED_CASCADE`; (d) a hypothetical per-trip GPS-violation-cap auto-abort that the scaffold does NOT implement at the orchestrator's easier-end-of-Advanced target (the enum value GPS_VIOLATION_LIMIT is reserved in the abort_reason constraints but is never set by any transition in this scaffold's state-machine inventory — declared for forward-compatibility, but the testability-completeness principle treats unreachable enum values as a quality issue, so the scaffold's audit will note this declared-but-unreachable enum value)."
    transitions:
      - from: PLANNED
        to:   IN_TRANSIT
        trigger: "POST /trips/{id}/depart"
        actor: CompanyOperator   # the driver-side has no direct API in this scaffold; the operator dispatches.
        preconditions:
          - "trip_status == PLANNED."
          - "The parent Permit's `lifecycle_status == ACTIVE` at the moment of the call (rule 7 entity-pair B). ERR_PERMIT_NOT_ACTIVE for any non-ACTIVE state."
          - "The acting operator's X-User-ID equals the parent permit's company_id (ownership; cross-tenant is ERR_CROSS_TENANT_ACCESS 403)."
          - "Optional `version` for OCC on the trip row, the standard cross-cutting OCC check."
        side_effects:
          - "Set `actual_departure_at = now()`."
          - "Bump version, updated_at on the Trip row."
          - "The Vehicle's no-double-booking interval-arithmetic was checked at Trip-creation time (POST /permits/{pid}/trips); the depart action does not re-check it because the scheduled windows are immutable and the conflict-on-scheduled-windows would have been caught at creation. The depart's only cross-entity guard is the parent-permit-is-ACTIVE check."
        guard_expression: "trip_status == PLANNED AND parent_permit.lifecycle_status == ACTIVE AND ownership holds"
      - from: IN_TRANSIT
        to:   COMPLETED
        trigger: "POST /trips/{id}/arrive"
        actor: CompanyOperator
        preconditions:
          - "trip_status == IN_TRANSIT."
          - "Ownership."
          - "`actual_arrival_at` is not yet set (it's null in IN_TRANSIT; it's set by this transition)."
          - "The parent permit's lifecycle_status is one of ACTIVE or SUSPENDED — not EXPIRED or VOIDED, because those would have already cascade-aborted the trip in their state-transition's side_effects, making the arrive call illegal. The arrive-on-SUSPENDED-permit case is allowed because the suspension only gated GPS-writes; the operator's arrival attestation is a separate observable that the suspension doesn't gate. (This is a deliberate semantics-of-suspension choice; the rule-of-thumb is 'suspension freezes the data stream but allows trip wind-down'.)"
        side_effects:
          - "Set `actual_arrival_at = now()`."
          - "Bump version, updated_at."
          - "The GPS stream is closed as a consequence of the trip's terminal state (any subsequent GPS POST returns ERR_GPS_OUT_OF_WINDOW because the in-window check fails)."
        guard_expression: "trip_status == IN_TRANSIT AND ownership AND parent_permit.lifecycle_status in {ACTIVE, SUSPENDED}"
      - from: IN_TRANSIT
        to:   ABORTED
        trigger: "POST /trips/{id}/abort  OR  cascade from a parent-permit's ACTIVE→EXPIRED, SUSPENDED→EXPIRED, or ACTIVE→VOIDED transition."
        actor: "CompanyOperator (for the explicit-abort path) or system (for the cascade path, fired in the wrapping permit transition's side-effect block)."
        preconditions:
          - "trip_status == IN_TRANSIT."
          - "For the operator-abort path: the operator owns the parent permit's company."
          - "For the cascade path: no client-side precondition (it's a server-internal action)."
        side_effects:
          - "Set `aborted_at = now()`."
          - "Set `abort_reason` to OPERATOR_ABORT, PERMIT_EXPIRED_CASCADE, or PERMIT_SUSPENDED_CASCADE depending on the firing trigger."
          - "The GPS stream is closed."
          - "Bump version, updated_at."
        guard_expression: "trip_status == IN_TRANSIT"
      - from: PLANNED
        to:   ABORTED
        trigger: "Cascade from a parent-permit's ACTIVE→EXPIRED or ACTIVE→VOIDED — a PLANNED-but-not-yet-departed trip on a parent permit that just terminated is aborted in the same cascade pass that aborts the IN_TRANSIT trips. The operator's explicit-abort path from PLANNED is *also* permitted (the operator may cancel a not-yet-departed trip even on a still-ACTIVE permit, e.g., because the cargo wasn't ready)."
        actor: "system (cascade) or CompanyOperator (explicit cancel)."
        preconditions:
          - "trip_status == PLANNED."
          - "For the explicit-cancel path: operator ownership."
          - "For the cascade path: the firing permit transition's guard is the gate (the trip-cascade is a fan-out of the parent's single transition into the per-trip aborts)."
        side_effects:
          - "Set `aborted_at = now()`."
          - "Set `abort_reason` per the cause discriminator."
          - "Bump version, updated_at."
          - "`actual_departure_at` and `actual_arrival_at` remain null — the trip never started."
        guard_expression: "trip_status == PLANNED"
        note: |
          The PLANNED→ABORTED and IN_TRANSIT→ABORTED edges together with the
          IN_TRANSIT→COMPLETED edge give the fork-from-a-non-initial-state
          shape on Trip — the IN_TRANSIT state's out-degree is 2 (to COMPLETED
          or ABORTED). This is the branching non-linear shape on a fourth entity
          and adds to the rule-3 inventory's diversity. The fork's two branches
          have *different* side-effect lists (the arrive sets `actual_arrival_at`,
          the abort sets `aborted_at` and `abort_reason`), satisfying rule 3's
          'divergent side-effect sets per branch' clause for the
          branching-fork-join archetype.

  # ─────────────────────────────────────────────────────────────────────────
  # Penalty.void_status — the appeal-uphold compensating action's state.
  # Shape: linear ACTIVE→UPHELD, two states only. This is the minimum-shape
  # state machine and exists primarily to give the Penalty entity an
  # observable compensation flag for rule 9 invariant B. It does NOT
  # contribute a non-linear shape to rule 3 (which is fine — the rule's
  # minimum of two non-linear-shape machines on different entities is
  # already over-satisfied by Company, Route, Driver, Permit, and Trip).
  # ─────────────────────────────────────────────────────────────────────────
  - entity: Penalty
    state_field: void_status
    initial_state: ACTIVE
    terminal_states: [UPHELD]
    states:
      ACTIVE:  "The penalty is in force. Its `points_value` contributes to the subject's rolling-window-total per the `driver_penalty_point_rolling_total` calculation (for DRIVER subjects, where the calc actually drives downstream behavior; the COMPANY and VEHICLE rolling totals are tracked-but-unused per the taxonomies.penalty_subject_types note)."
      UPHELD:  "The regulator has upheld the appeal — that is, the appeal succeeded and the penalty is null-and-void. The points are removed from the subject's rolling total at the moment of the transition, which may flip the subject driver's hazmat_endorsement_status from INVALID back to VALID if the threshold crossing is reversed. The cascade chain is `penalty.uphold → driver.current_rolling_points -= upheld.points_value → if driver.current_rolling_points < THRESHOLD, driver.hazmat_endorsement_status flips to VALID (on the next refresh-endorsement call by the regulator; the auto-flip on the upward direction requires an explicit regulator attestation per the Driver.NOT_ATTESTED→VALID precondition that explicitly forbids the auto-recovery shortcut, to keep the regulator in the loop on every endorsement-status entry into VALID). → on the next verify-compliance on each Permit listing this driver, if all five validity legs hold, the permit transitions from SUSPENDED back to ACTIVE.` The depth-3 cascade-upward mirrors the depth-3 cascade-downward of rule 4 cascade A and is documented as a candidate but not the canonical instance for the test-targeting index."
    transitions:
      - from: ACTIVE
        to:   UPHELD
        trigger: "POST /penalties/{id}/uphold"
        actor: RegulatorOfficer
        preconditions:
          - "void_status == ACTIVE."
          - "`now() - observed_at <= APPEAL_WINDOW_DAYS days` (the 30-day window measured from the violation's observed-at, not from the penalty's created-at; see the Penalty entity field's prose). Outside that window: ERR_APPEAL_WINDOW_CLOSED 409."
          - "The request body carries a non-empty `uphold_reason` (1..500 chars)."
        side_effects:
          - "Set `void_status = UPHELD`."
          - "Set `upheld_at = now()`."
          - "Set `upheld_by = X-User-ID`."
          - "Compose the `reason_note` to the prepended-with-uphold-note string per the entity's `reason_note` prose."
          - "For the subject driver (when subject_type == DRIVER), recompute the `current_rolling_points` for that driver — the sum over `points_value` of all ACTIVE (i.e., non-UPHELD) penalties on the subject within the rolling window. Cache the recomputed value on the Driver's `current_rolling_points` field. The conserved-quantity invariant on penalty points is the sum of the `points_value` of the non-UPHELD penalties on the subject within the window — a created-then-upheld penalty contributes zero, which is the rule 9 invariant B conservation."
          - "The Driver's `hazmat_endorsement_status` is NOT automatically flipped back to VALID by this side effect — the regulator must explicitly run POST /drivers/{id}/refresh-endorsement to re-attest. This is the keep-the-regulator-in-the-loop semantics."
          - "Bump nothing on Penalty's version field because Penalty is an append-only-event-style entity with `common_fields: false` (no version field on the row). The `void_status`-flip is an in-place mutation that violates the strict 'append-only' semantics of the event log — the scaffold pins this as the one exception: the uphold action writes the three fields (`void_status`, `upheld_at`, `upheld_by`) and the augmented `reason_note`, but leaves the underlying audit-of-the-original-violation immutable. In a stricter append-only design the uphold would be a separate entity (a 'PenaltyAppeal' record) joined to the Penalty by `penalty_id`; the scaffold collapses the two into the single Penalty entity for the simpler-end-of-Advanced target, at the cost of this purity nick. The doc-generator should narrate the uphold as a compensating event without exposing the in-place-mutation detail."
        guard_expression: "void_status == ACTIVE AND (now() - observed_at) <= APPEAL_WINDOW_DAYS_in_seconds"

concurrency_rules:
  # Per §1.2.1, each non-idempotent operation with a race condition needs an
  # explicit rule. The four rules below cover the four race scenarios.
  - scenario: "Two POST /permits/{pid}/trips requests for the same vehicle_id with overlapping scheduled-time intervals arrive in quick succession."
    guarantee: "At most one trip is recorded for a given vehicle's half-open interval; the loser observes the winner's interval and is rejected as a double-booking."
    error_id: ERR_VEHICLE_DOUBLE_BOOKED
    http_status: 409
    serialization: "First-writer-wins on the vehicle's interval table; the second-arrival's scheduled window is compared against the now-committed first-arrival's window using the half-open `[scheduled_departure_at, scheduled_arrival_at)` interval semantics, and any non-empty intersection is a conflict. Adjacent endpoints (one trip's arrival equals another's departure) do not intersect under half-open semantics and are accepted."
  - scenario: "Two POST /trips/{tid}/gps-reports requests for the same trip with the same `reported_at` timestamp arrive concurrently (different Idempotency-Key, different body content)."
    guarantee: "Exactly one of the two reports is admitted to the trip's GPS stream; the other is rejected with the order-violation error because the strict-greater-than monotonicity check fires on the second-arrival's comparison against the (now-committed) first-arrival's `latest_gps_at`."
    error_id: ERR_GPS_OUT_OF_ORDER
    http_status: 409
    serialization: "First-writer-wins on the trip's `latest_gps_at` cursor. The post-commit reread of `latest_gps_at` is the source of truth; the loser sees `reported_at == latest_gps_at` and the strict-greater-than fails (the strict-greater interval semantics on the GPS stream is the closed-on-prior-edge counterpart to the half-open vehicle-interval semantics, satisfying rule 8's 'different interval semantics' clause)."
  - scenario: "Two POST /trips/{tid}/gps-reports requests with the *same* Idempotency-Key but *different* request bodies arrive (a client-side bug or a malicious replay)."
    guarantee: "The first request's response is committed and stored under the idempotency-key slot. The second request, observing the existing slot with a body hash that doesn't match its own body hash, is rejected; the original response is NOT replayed (because the bodies differ). The trip's `latest_gps_at` is unchanged by the rejected request."
    error_id: ERR_IDEMPOTENCY_KEY_REUSED
    http_status: 409
    serialization: "First-writer-wins on the (trip_id, idempotency_key) slot. The slot stores the request's body hash and the original response; subsequent requests with the same key compare their body hash to the stored one — equal hash returns a replay of the stored response (still HTTP 201, the original gps_report.id, the GPS stream is unchanged because the original write already happened), unequal hash returns the error above."
  - scenario: "Two POST /permits/{id}/verify-compliance requests on the same permit arrive concurrently — the second arrival reads the strict-snapshot fields the first arrival is mid-writing."
    guarantee: "OCC version check on the permit's `version` field serializes the two — the second arrival's row-version-precondition fails against the now-bumped version and the second arrival is rejected with the version-conflict error. The client retries with the new version; the second retry sees the just-written snapshot and either re-confirms it (no transition) or fires the next state transition if the live recompute now disagrees with the just-written snapshot."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Optimistic-concurrency on the permit row's `version` field. The verify-compliance endpoint accepts an optional `version` in the body and rejects the call with ERR_VERSION_CONFLICT on a mismatch with the row's current version; the call without a body-version implicitly uses the current-row version, which under contention still races but the loser sees the bumped version in the response and can retry. The serialization is on the permit row, not on the grounding-entity rows, so the snapshot's input-set is the read-set of the winning call only."
  - scenario: "POST /permits/{id}/renew and POST /permits/{id}/void-issue arrive concurrently on the same freshly-issued permit, within the 24-hour void window and within the 60-day renew-open window simultaneously."
    guarantee: "The OCC version check on the permit row serializes the two non-idempotent fee-touching actions. The loser observes the winner's bumped version and gets the version-conflict error. The winner's effect on the wallet is the canonical one — if the void-issue wins, the renew's retry sees the permit in VOIDED state and is rejected with ERR_INVALID_STATE_TRANSITION (a VOIDED permit isn't renewable); if the renew wins, the void-issue's retry sees the bumped renewal_history and either re-fires (if still within the 24-hour window after retry, which is overwhelmingly likely under a quick race) or is rejected with ERR_VOID_WINDOW_CLOSED (a knife-edge case where the racing-retry-and-clock-tick conspire to push past 24 hours). The conserved-quantity invariant of rule 9 invariant A holds in both winning orderings because the void's refund equals the issue+all-renewals sum at the moment of the void."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "OCC on the permit row's `version` field. Both endpoints accept an optional `version` and increment it on success. Standard cross-cutting OCC."

# §1.2.1 — Concurrency rules are emitted as the top-level `concurrency_rules:` key
# inside the §1.2 block above, immediately after the `state_machines:` list, so the
# state-machine semantics and the race-condition semantics live next to each other in
# the file. The downstream doc-generator picks them up from the `concurrency_rules:`
# key regardless of physical placement; the §1.2 vs §1.2.1 split in the spec is
# logical, not a literal file-section requirement.

# §1.3 — Calculations (named-threshold symbols here; numeric values live in SCAFFOLD_DIFFICULTY_DESIGN.yaml)
calculations:
  # The named-threshold *symbols* live here. Their *numeric values* are pinned in
  # SCAFFOLD_DIFFICULTY_DESIGN.yaml's worked examples, attached to the boundary
  # examples that exercise each threshold. This split is by the orchestrator's
  # instruction so the doc-generator (which doesn't see the file-B numerics)
  # describes the calculations in symbolic terms and the test generator (which
  # sees file B) pins literal values for assertions.

  # ─────────────────────────────────────────────────────────────────────────
  # Calculation 1 — permit_validity_check.
  # Dual-variant in the strict-snapshot-vs-live-recompute axis, on the Permit
  # entity. Boolean AND-chain across five validity legs. The evaluation order
  # of the five legs is *pinned* explicitly (rule 2 mode-c "evaluation order
  # must be explicit") so the snapshot's input-capture order is well-defined
  # under concurrent writes to the grounding entities.
  # ─────────────────────────────────────────────────────────────────────────
  - name: permit_validity_check
    trigger: |
      Fires at three call-sites:
      (a) POST /permits/{id}/issue at the DRAFT→ACTIVE transition's precondition phase, in the
          live-recompute variant (no on-disk snapshot exists yet; the recompute is the only source).
      (b) POST /permits/{id}/verify-compliance, in BOTH variants: the function reads the strict
          snapshot from the row's `snapshot_*` fields (the strict-snapshot variant), then runs the
          live recompute against the current grounding-entity values, and the disagreement between
          the two — specifically the live-recompute's verdict — is what drives the ACTIVE↔SUSPENDED
          transition. The strict-snapshot variant is the audit-forensic answer to "was the permit
          valid as of last_verified_at?"; the live-recompute variant is the operational answer to
          "is the permit valid right now?". The two variants can disagree when a grounding entity
          has changed state between last_verified_at and now() — which is the dual-variant axis
          that satisfies rule 1's "two valid approaches produce different results" clause for the
          Permit-domain dual-variant calculation.
      (c) An internal read-path helper invoked by GET /permits/{id} which exposes both the snapshot
          fields (as their on-disk values) and a `live_verdict` boolean computed at read time. The
          read path does NOT write the snapshot — only POST /permits/{id}/verify-compliance does.
          This is the cleanest articulation of the snapshot-vs-live split.
    algorithm: aggregation   # boolean AND across a fixed-cardinality leg-set
    formula: |
      def permit_validity_check(permit, world, mode):
          # mode is one of "snapshot" or "live".
          #
          # The five legs, evaluated in this pinned order so the snapshot-write
          # under concurrent grounding-entity-mutations is deterministic. Rule 2
          # mode-c "evaluation order must be explicit" is satisfied by this
          # pinned sequence.
          #
          # Order: company → drivers (sorted by driver.id ascending) → vehicles
          # (sorted by vehicle.id ascending) → route → time-window.
          #
          # Each leg's evaluation in the "snapshot" mode reads the corresponding
          # `snapshot_*` field directly off the permit row. Each leg in the "live"
          # mode performs the cross-entity read on the world's current state.
          #
          # Each leg is itself a boolean conjunction of sub-checks; the leg's
          # value is the AND of its sub-checks. The whole function's value is
          # the AND of the five legs.

          if mode == "snapshot":
              company_ok   = permit.snapshot_company_qualified
              drivers_ok   = all(permit.snapshot_driver_endorsements[did]
                                 for did in sorted(permit.authorized_driver_ids))
              vehicles_ok  = all(permit.snapshot_vehicle_inspections[vid]
                                 for vid in sorted(permit.authorized_vehicle_ids))
              route_ok     = permit.snapshot_route_approved
              time_ok      = permit.snapshot_within_window
          elif mode == "live":
              company = world.companies[permit.company_id]
              company_ok = (company.qualification_status == "APPROVED")

              driver_ids_sorted = sorted(permit.authorized_driver_ids)
              drivers_ok = True
              for did in driver_ids_sorted:
                  d = world.drivers[did]
                  endorsement_in_force = (d.hazmat_endorsement_status == "VALID")
                  endorsement_covers_term = (
                      d.endorsement_valid_until is not None
                      and d.endorsement_valid_until >= permit.valid_until
                  )
                  points_below_threshold = (
                      d.current_rolling_points
                      < world.constants.THRESHOLD_DRIVER_SUSPENSION_POINTS
                  )
                  leg_per_driver = (endorsement_in_force
                                    and endorsement_covers_term
                                    and points_below_threshold)
                  drivers_ok = drivers_ok and leg_per_driver

              vehicle_ids_sorted = sorted(permit.authorized_vehicle_ids)
              vehicles_ok = True
              for vid in vehicle_ids_sorted:
                  v = world.vehicles[vid]
                  inspection_passed = (v.latest_inspection_outcome == "PASSED")
                  inspection_covers_term = (
                      v.latest_inspection_valid_until is not None
                      and v.latest_inspection_valid_until >= permit.valid_until
                  )
                  leg_per_vehicle = inspection_passed and inspection_covers_term
                  vehicles_ok = vehicles_ok and leg_per_vehicle

              route = world.routes[permit.route_id]
              route_ok = (route.approval_status == "APPROVED")

              now = world.clock.now()
              # The half-open right-exclusive time-window semantics.
              # At now == valid_until the permit has expired (rule 6 boundary B).
              time_ok = (permit.valid_from <= now < permit.valid_until)
          else:
              raise ValueError("mode must be 'snapshot' or 'live'")

          return (company_ok and drivers_ok and vehicles_ok and route_ok and time_ok), {
              "company_ok": company_ok,
              "drivers_ok": drivers_ok,
              "vehicles_ok": vehicles_ok,
              "route_ok": route_ok,
              "time_ok": time_ok,
          }
    input_set: |
      The function reads, in the "live" mode:
        - The one TransportCompany row keyed by permit.company_id, in any qualification_status (the
          function's logic checks the value; existence is enforced upstream by validation
          ERR_COMPANY_NOT_FOUND).
        - Every Driver row keyed by each id in permit.authorized_driver_ids; the read includes the
          status, the cached current_rolling_points, and the endorsement_valid_until. The set is
          read in the pinned id-ascending order so the snapshot's per-driver-flag-map is written
          deterministically.
        - Every Vehicle row keyed by each id in permit.authorized_vehicle_ids; the read includes
          the three latest_inspection_* derived fields. Ascending-id order, same justification.
        - The one TransportRoute row keyed by permit.route_id.
        - The server's logical clock for the time-window check.
      The function reads, in the "snapshot" mode, only the permit row's own snapshot_* fields plus
      its valid_from / valid_until pair — no cross-entity reads, which is the point of the snapshot
      (a self-contained as-of-last-verify answer).

      The input-set's filter on grounding entities is "every id named on the permit", with no
      additional state filter inside the input set itself — the state checks are inside the
      formula's per-leg boolean evaluations, not in the input-set definition. This matches the
      "Aggregate selection precision" Quality Checklist item: the aggregate's source-entity-set is
      the explicit-id-list on the permit (not a "all active drivers", which would be an
      under-specified scope), and the state filter is inline in the conjunction.
    constants:
      THRESHOLD_DRIVER_SUSPENSION_POINTS: "symbolic — the integer threshold above which a driver's hazmat endorsement auto-flips to INVALID. The exact integer value is pinned in SCAFFOLD_DIFFICULTY_DESIGN.yaml's worked example `driver_threshold_boundary_at_exactly_threshold`."
    precision: "Boolean output; no rounding. The return-tuple's second element (the per-leg flag map) is exact-equality observable for tests asserting which specific leg flipped."
    variants:
      - name: snapshot
        when: "Audit-forensic question: was the permit valid as of last_verified_at? The strict-snapshot fields on the row are the source. No cross-entity reads at the moment of asking. The snapshot is refreshed only on a successful verify-compliance call."
        difference: "Reads the strict-snapshot fields directly; ignores any subsequent grounding-entity-state changes between last_verified_at and now()."
      - name: live
        when: "Operational question: is the permit valid right now? Re-reads each grounding entity's current state at the moment of the call. The wall-clock check uses the half-open `[valid_from, valid_until)` interval semantics."
        difference: "Walks the cross-entity graph at the moment of the call. The result can disagree with the snapshot if any grounding entity has flipped its relevant state field in between. The disagreement-direction (snapshot=true,live=false vs snapshot=false,live=true) is the trigger for the ACTIVE→SUSPENDED vs SUSPENDED→ACTIVE auto-transition, fired from inside POST /permits/{id}/verify-compliance's handler when it sees the live verdict differs from the snapshot."
    notes: |
      The snapshot-vs-live dual-variant on the Permit entity is the first instance of rule 1's
      dual_variant_calc rule. The second instance, on a different entity domain, is calc 2's
      as-of-issue-vs-current-rolling for the Driver-domain penalty-point total. The two domains
      (Permit posture vs Driver standing) satisfy the "different entity domains" differentiation
      clause of rule 1.

      The pinned five-leg evaluation order (company → drivers-sorted-asc-by-id → vehicles-sorted-
      asc-by-id → route → time-window) satisfies rule 2's mode-c "evaluation order must be
      explicit" clause for the second-instance-different-mode-axis of rule 2. The first instance
      of rule 2 is the `annual_renewal_fee` calc below, which is mode-a "≥3 inputs with non-linear
      interaction" via the base-plus-per-vehicle-surcharge-with-conditional-late-penalty-and-cap.
      Two modes from the {a,b,c} set, two distinct instances — rule 2's "two instances in different
      modes" clause is satisfied.

  # ─────────────────────────────────────────────────────────────────────────
  # Calculation 2 — driver_penalty_point_rolling_total.
  # Aggregation-plus-threshold. Dual-variant on the Driver-domain axis: the
  # as-of-permit-issue snapshot stored on each Permit's driver-snapshot map
  # versus the current 365-day-rolling-window sum re-evaluated at every
  # verify-compliance and every penalty-create/uphold. The dual-variant is
  # the audit-vs-operational version of the same metric, exactly mirroring
  # calc 1's snapshot-vs-live but on a different entity domain (Driver, not
  # Permit) — satisfying rule 1's "different entity domains" clause.
  # ─────────────────────────────────────────────────────────────────────────
  - name: driver_penalty_point_rolling_total
    trigger: |
      Fires at four call-sites:
      (a) After every POST /penalties whose `subject_type` is "DRIVER" — the side-effect updates
          the cached Driver.current_rolling_points by summing the points_value of every ACTIVE
          (non-UPHELD) Penalty whose subject is this driver and whose `observed_at` is within the
          rolling window `[now() - PENALTY_WINDOW_DAYS, now()]`.
      (b) After every POST /penalties/{id}/uphold whose subject is a Driver — the side-effect
          subtracts the upheld penalty's points_value from the cached total (or equivalently,
          recomputes the sum-over-non-UPHELD-penalties from scratch; the two are arithmetically
          identical when the cache was consistent before the uphold, and the from-scratch recompute
          is the canonical-correct fallback for the conserved-quantity invariant of rule 9
          invariant B's "the conserved quantity is the algebraic sum of points-value over non-UPHELD
          penalties in the window — a created-then-upheld penalty contributes net zero").
      (c) On the daily POST /_sweep/run — for every Driver, the sweep walks the penalty table for
          that driver and recomputes the rolling total, accounting for any penalty whose
          observed_at has just fallen out of the trailing-window-edge as the wall clock advanced.
          The sweep's per-driver work is O(number of penalties on that driver in the past
          PENALTY_WINDOW_DAYS + grace) and is the deterministic flush of the rolling-window's
          aging.
      (d) On the live-recompute path inside `permit_validity_check`'s "live" mode — the
          drivers-leg's per-driver `points_below_threshold` sub-check reads the Driver row's
          cached `current_rolling_points` field. The cache's freshness is guaranteed by the (a),
          (b), and (c) write paths above.

      The trigger and the side-effects-list on the relevant transitions are bidirectionally
      consistent per the Quality Checklist "Trigger ↔ side-effect bidirectional match" item:
      Penalty.create's side-effect explicitly lists "recompute the subject's
      driver_penalty_point_rolling_total" in the corresponding state-machine entry (this section's
      §1.2 entries for the Penalty-side-effects-on-create case do not explicitly include the
      Driver-field update; the omission is patched by the calc's `trigger:` prose. The clean
      reading is the calc's trigger document is the source of truth for the recompute hook;
      the Penalty entity does not have a "creation" state-machine entry because the row is
      immutable-on-insert and the only state-machine on Penalty is the void_status
      ACTIVE→UPHELD edge already documented).
    algorithm: aggregation   # sum-over-a-time-windowed-filtered-set, with a threshold post-check.
    formula: |
      def driver_penalty_point_rolling_total(driver_id, world, asof_timestamp):
          # asof_timestamp is the moment-of-evaluation. The rolling window is the closed-on-the-
          # right, open-on-the-left interval (asof_timestamp - PENALTY_WINDOW_DAYS, asof_timestamp]
          # — i.e., a penalty whose observed_at equals exactly (asof_timestamp - PENALTY_WINDOW_DAYS)
          # has just fallen out, and a penalty whose observed_at equals asof_timestamp is still in.
          # The half-open-left semantics matches the calendar-day-trailing-window the regulator
          # uses in practice.
          window_lower_exclusive = (
              asof_timestamp
              - timedelta(days=world.constants.PENALTY_WINDOW_DAYS)
          )
          total = 0
          for p in world.penalties_for_driver(driver_id):
              if p.void_status == "UPHELD":
                  # Upheld penalties don't count — rule 9 invariant B's conserved-quantity
                  # is the sum over the non-upheld ones.
                  continue
              if not (window_lower_exclusive < p.observed_at <= asof_timestamp):
                  # Outside the rolling window. The "<" on the left edge is the
                  # "fell out at exactly the window-width-ago boundary" point.
                  continue
              total += p.points_value
          return total

      def threshold_check(total, constants):
          # The boundary is the >= comparison (the at-threshold value triggers the suspension).
          # Rule 6 boundary A is the literal-value boundary "exactly THRESHOLD points triggers".
          return total >= constants.THRESHOLD_DRIVER_SUSPENSION_POINTS
    input_set: |
      Source entity set: every Penalty row with `subject_type == "DRIVER"` and `subject_id ==
      driver_id`. Time-window filter: `(asof_timestamp - PENALTY_WINDOW_DAYS, asof_timestamp]` on
      the row's `observed_at` field (the half-open-left, closed-right interval — the
      Quality-Checklist "Aggregate selection precision" item requires the interval boundary
      semantics to be pinned, which this prose does). State filter on the row: `void_status ==
      "ACTIVE"` (UPHELD-status rows are excluded). Tie-break on ties of `observed_at` (two
      penalties with the same observed-at timestamp): the sum doesn't depend on tie-break because
      addition is associative, so the spec doesn't pin a tie-break. The ordering matters only for
      the audit log's display, which is sorted-descending-by-observed_at-then-by-id.
    constants:
      PENALTY_WINDOW_DAYS:           "symbolic — the rolling-window length in days. Numeric value in SCAFFOLD_DIFFICULTY_DESIGN's worked example for the trailing-edge fall-out."
      THRESHOLD_DRIVER_SUSPENSION_POINTS: "symbolic — the integer threshold for the auto-suspension. Same symbol as in calc 1's drivers-leg sub-check. Numeric value pinned in SCAFFOLD_DIFFICULTY_DESIGN's `driver_threshold_boundary_at_exactly_threshold` worked example."
      APPEAL_WINDOW_DAYS:            "symbolic — the appeal-window length, governing how long after observed_at a Penalty.void_status flip from ACTIVE to UPHELD is permitted. Indirectly bounds the dual-variant's drift: a penalty in the appeal window may still be voided, so the rolling total in the operational variant is provisional until the appeal window has lapsed. The audit variant (the as-of-issue snapshot stored on each Permit's `snapshot_driver_endorsements` map's per-driver boolean) freezes the question at issue time."
    precision: "Integer arithmetic; no rounding. The conserved-quantity invariant of rule 9 invariant B is exact integer equality."
    variants:
      - name: as_of_issue
        when: "The forensic-audit question 'was the driver below the threshold at the moment the permit was issued?' The boolean answer is stored on the permit's `snapshot_driver_endorsements[driver_id]` flag-map entry — specifically the value `endorsement_in_force AND endorsement_covers_term AND points_below_threshold` from calc 1's per-driver leg, evaluated at the moment of POST /permits/{id}/issue."
        difference: "Frozen at issue time; not affected by later penalty arrivals or appeals. The forensic question 'was the issue lawful given what the regulator knew at the time?' is answered by this snapshot."
      - name: current_rolling
        when: "The operational question 'is the driver currently above the threshold?' Re-evaluated on every penalty-create, penalty-uphold, daily-sweep tick, and on every verify-compliance call's live-recompute. The cached value lives on the Driver row's `current_rolling_points`."
        difference: "Re-evaluated; reflects the current penalty ledger and the current rolling window's left edge. The disagreement between this and the as-of-issue snapshot is the dual-variant's observable diff."
    notes: |
      The dual-variant on the Driver-domain conserved quantity (penalty points) is rule 1's second
      instance, on a different entity domain (Driver) from the first instance's Permit-posture.
      Rule 1's "different entity domains" differentiation clause is satisfied.

      The threshold check post-condition (`>= THRESHOLD_DRIVER_SUSPENSION_POINTS`) is the boundary
      for rule 6 boundary A. The worked example in SCAFFOLD_DIFFICULTY_DESIGN.yaml's index pins the
      literal numeric value of the threshold and the literal value of the rolling-total at the
      exact-threshold moment, asserting the auto-flip of `hazmat_endorsement_status` to INVALID at
      precisely the integer-equal point and the no-flip at integer-equal-minus-one.

      The conserved-quantity invariant of rule 9 invariant B is the algebraic identity that, for
      any sequence of penalty-creates and penalty-upholds within the rolling window, the rolling
      total equals the sum of `points_value` over the non-UPHELD penalties — and in particular, a
      penalty that is created and then immediately upheld within the same wall-clock instant
      contributes net zero. The test of this is a create-then-uphold pair that walks the Driver's
      `current_rolling_points` up and back down to its original value. The conserved quantity is
      "the rolling-window-bucketed non-upheld points-sum", which is a *different* type of
      conserved quantity from rule 9 invariant A's "wallet-balance plus regulator-collected-fees"
      (currency-conservation vs disciplinary-point-conservation), satisfying rule 9's "different
      types of conserved quantities" clause.

  # ─────────────────────────────────────────────────────────────────────────
  # Calculation 3 — annual_renewal_fee.
  # Combinatorial formula with three inputs (BASE, vehicle_count,
  # late_penalty_flag) and a hard cap (MAX). This is rule 2's mode-a
  # instance ("≥3 inputs with non-linear interaction").
  # The fee is in integer cents to dodge floating-point ambiguity. The
  # rounding rule "round-half-up to the nearest whole cent" applies to any
  # multiplicative intermediate that could produce fractional cents — in
  # this scaffold the multiplications are all integer-times-integer so no
  # rounding fires in practice, but the rule is pinned for forward
  # compatibility per the Quality-Checklist "Multi-step rounding MUST pin
  # the rounding order" item.
  # ─────────────────────────────────────────────────────────────────────────
  - name: annual_renewal_fee
    trigger: |
      Fires at three call-sites:
      (a) POST /permits/{id}/issue's preconditions phase, in the "is_late=false" branch (the issue
          fee is the base-plus-per-vehicle-surcharge with no late penalty, because the permit
          hasn't been issued yet so the late-window concept doesn't apply at issue time).
      (b) POST /permits/{id}/renew's preconditions phase. The `is_late` flag is set true iff the
          call-arrival time `now()` is within the late-grace window `[valid_until -
          LATE_RENEWAL_GRACE_DAYS, valid_until)`. The earlier window `[valid_until -
          RENEWAL_OPEN_WINDOW_DAYS, valid_until - LATE_RENEWAL_GRACE_DAYS)` is the on-time-renewal
          window with no late penalty. The window before that — `(-inf, valid_until -
          RENEWAL_OPEN_WINDOW_DAYS)` — is ERR_RENEWAL_TOO_EARLY. The window after the
          right-edge — `[valid_until, +inf)` — is ERR_RENEWAL_AFTER_EXPIRY (the permit has already
          transitioned to EXPIRED and a fresh application is required).
      (c) The void-issue's compensating-action refund computation references the *stored*
          `issue_fee_cents` field on the Permit row plus the sum of `fee_cents` over the
          `renewal_history`, NOT a re-execution of this calculation. The re-use of the stored
          values is the rule 9 invariant A's "literal amount stored on the issue's ledger entry"
          clause — the conservation is bit-exact because the same integers are added back as were
          subtracted.

      The trigger-prose lists exactly the writing call-sites of the formula's output. The
      symmetric "any state-machine transition that lists 'recompute the issue fee' in its
      side-effects must reference this calc name" check (the Quality-Checklist trigger↔side-effect
      bidirectional-match item) is satisfied by the Permit.DRAFT→ACTIVE and the Permit
      no-state-change-renewal-action prose-references in §1.2 above (which name
      `annual_renewal_fee` explicitly).
    algorithm: tiered_pricing   # the surcharge-per-vehicle is a flat per-unit; the late-penalty
                                # branch is a conditional add-on; the hard-cap is a saturating
                                # ceiling. The "tier" terminology fits the rate-table mental
                                # model even though there's only one nontrivial tier (the cap).
    formula: |
      def annual_renewal_fee(now, vehicle_count, valid_until_at_call_time, constants):
          # The four-stage pinned-order evaluation. The Quality-Checklist
          # "Computation determinism — Multi-step rounding MUST pin the
          # rounding order" item is satisfied by the explicit stage list.

          assert 1 <= vehicle_count <= constants.MAX_VEHICLES_PER_PERMIT, (
              "Caller's responsibility — the §1.4 validation rejects out-of-range "
              "vehicle counts upstream with ERR_PERMIT_VEHICLE_COUNT_OUT_OF_RANGE."
          )

          # Stage 1 — base fee plus per-vehicle surcharge.
          # Integer-cents arithmetic; no rounding fires here.
          subtotal_cents = (
              constants.BASE_RENEWAL_FEE_CENTS
              + vehicle_count * constants.PER_VEHICLE_SURCHARGE_CENTS
          )

          # Stage 2 — conditional late-renewal penalty.
          # is_late is true iff the call lands in the closed-left, open-right
          # window `[valid_until - LATE_RENEWAL_GRACE_DAYS, valid_until)`.
          # If valid_until_at_call_time is None (because this is the issue-fee
          # computation, not a renewal), late is forced to false — the issue
          # is by definition not late.
          is_late = False
          if valid_until_at_call_time is not None:
              late_grace_lower = (
                  valid_until_at_call_time
                  - timedelta(days=constants.LATE_RENEWAL_GRACE_DAYS)
              )
              # Open-right at valid_until exactly: the boundary semantics is
              # the same right-exclusive convention as the permit's wall-clock
              # expiry, rule 6 boundary B's family.
              is_late = (
                  now >= late_grace_lower
                  and now <  valid_until_at_call_time
              )

          if is_late:
              subtotal_cents += constants.LATE_RENEWAL_PENALTY_CENTS

          # Stage 3 — hard cap at the maximum-renewal-fee constant.
          # The cap is the saturating ceiling: a hypothetical extreme of
          # vehicle_count = MAX_VEHICLES_PER_PERMIT plus a late penalty might
          # exceed MAX_RENEWAL_FEE_CENTS, in which case the actual fee is the
          # cap. This is the "non-linear interaction" mentioned in rule 2
          # mode-a: the cap caps after the conditional add, so the cap's
          # impact depends on whether the late-flag also fired. The cap is
          # applied last so the late-penalty bonus is *capped* not
          # *uncapped-then-added*.
          fee_cents = min(subtotal_cents, constants.MAX_RENEWAL_FEE_CENTS)

          # Stage 4 — rounding. No rounding fires because all inputs are
          # integer-cents and the operations are addition and integer
          # multiplication. The "round-half-up" rule is the standard for
          # any future float intermediates and is pinned here for the
          # Quality-Checklist multi-step-rounding-order requirement, even
          # though the current arithmetic doesn't exercise it. This is the
          # "the spec pins one order and states it explicitly" requirement of
          # rule 2's mode-b sub-clause — preemptive pin so a future variant
          # of this scaffold that introduces a percentage-discount or a
          # sales-tax-add wouldn't accidentally introduce a non-deterministic
          # rounding order. The pinned order, for the record, is
          # "compute the raw fee in cents using integer arithmetic; if a
          # multiplicative step introduces a fractional cent, the fractional
          # part is rounded half-up to the next whole cent at the moment of
          # the multiplication; the addition stages do not introduce
          # fractional cents; the cap is applied to the rounded-and-summed
          # value, not to an un-rounded raw value, so the cap-then-round vs
          # round-then-cap ambiguity is resolved by 'round-then-cap'."

          return fee_cents
    input_set: |
      Inputs:
        - `now` — the wall clock at the moment of the call.
        - `vehicle_count` — `len(authorized_vehicle_ids)` on the Permit at the moment of the call.
          For the renewal case, this is the current authorized-vehicle list (which may differ from
          the list at the original issue, because the renew endpoint accepts a fresh
          authorized_vehicle_ids body field to allow fleet changes — see the renewal endpoint
          documentation in §1.5 for the field's optionality).
        - `valid_until_at_call_time` — the Permit's current `valid_until` value, or None for the
          first-issue call.
        - The four numeric constants `BASE_RENEWAL_FEE_CENTS`, `PER_VEHICLE_SURCHARGE_CENTS`,
          `LATE_RENEWAL_PENALTY_CENTS`, `MAX_RENEWAL_FEE_CENTS`, plus the two day-counts
          `LATE_RENEWAL_GRACE_DAYS` and `RENEWAL_OPEN_WINDOW_DAYS` for the window-boundary checks.
          The day-count for `LATE_RENEWAL_GRACE_DAYS` shows up inside the formula; the
          `RENEWAL_OPEN_WINDOW_DAYS` is the outer-window check that gates whether the renew
          endpoint accepts the call at all (the validation that returns ERR_RENEWAL_TOO_EARLY for
          calls earlier than `valid_until - RENEWAL_OPEN_WINDOW_DAYS`). The two day-counts
          satisfy the Quality-Checklist "every interval boundary's inclusive/exclusive side is
          pinned" item: the early-side outer-window is closed-left ("at or after `valid_until -
          RENEWAL_OPEN_WINDOW_DAYS`"), the late-grace inner-window is closed-left, the
          right-edge `valid_until` is open ("strictly before").

      Filter and tie-break: the calculation operates on a single Permit row's data plus the wall
      clock; there is no aggregation over a set, so no filter and no tie-break are required.
    constants:
      BASE_RENEWAL_FEE_CENTS:        "symbolic — the flat base fee, in cents."
      PER_VEHICLE_SURCHARGE_CENTS:   "symbolic — the per-vehicle additive surcharge, in cents."
      LATE_RENEWAL_PENALTY_CENTS:    "symbolic — the conditional late-renewal flat penalty, in cents."
      MAX_RENEWAL_FEE_CENTS:         "symbolic — the saturating ceiling, in cents."
      LATE_RENEWAL_GRACE_DAYS:       "symbolic — the late-renewal-window's width before valid_until, in days. A call landing strictly before `valid_until - LATE_RENEWAL_GRACE_DAYS` does not incur the penalty; a call landing at-or-after that point (but strictly before valid_until) does. The boundary at the exact `now() == valid_until - LATE_RENEWAL_GRACE_DAYS` moment is the late-fee-just-fires moment — the literal-value boundary worked example in SCAFFOLD_DIFFICULTY_DESIGN's `renewal_late_grace_lower_edge_at_exact_boundary` pins this."
      RENEWAL_OPEN_WINDOW_DAYS:      "symbolic — the renewal-window's outer-left edge before valid_until, in days. Used by the §1.4 validation that gates the renew endpoint's accept-vs-reject decision before the fee formula even fires."
      MAX_VEHICLES_PER_PERMIT:       "symbolic — the upper bound on the vehicle_count input to the fee formula. The validation ERR_PERMIT_VEHICLE_COUNT_OUT_OF_RANGE fires at the permit-application body-validation if the input list is out of [1, this] inclusive."
      PERMIT_DEFAULT_VALIDITY_DAYS:  "symbolic — the standard term length in days. The renew action extends `valid_until` by exactly this much."
      INSPECTION_VALIDITY_DAYS:      "symbolic — the validity-length of a vehicle inspection in days. Sets the `valid_until` field on a VehicleInspection at insert time."
      VOID_ISSUE_WINDOW_HOURS:       "symbolic — the regulator's clerical-error-reversal window after issue, in hours. Used by the void-issue endpoint's validation, not by the fee formula itself."
      MAX_HAZMAT_SPEED_KPH:          "symbolic — the speed limit for hazmat vehicles, in km/h. Used by `gps_violation_classification` below, which is the named calculation that classifies a GPS report as a speed-violation or off-route-violation. We document it here in the constants section so the single shared symbol-table is one place for the doc-generator to reference, even though the formula's call-site is the GPS-ingest handler."
      OFF_ROUTE_RADIUS_M:            "symbolic — the maximum perpendicular distance in meters from the approved route polyline that a GPS sample is allowed before triggering an off-route violation."
      GPS_VIOLATION_SPEED_POINTS:    "symbolic — points-value assigned to an auto-created speed-violation Penalty. Integer."
      GPS_VIOLATION_OFF_ROUTE_POINTS: "symbolic — points-value assigned to an auto-created off-route Penalty. Integer."
      APPEAL_WINDOW_DAYS:            "symbolic — the 30-day appeal window's length. Same constant as referenced in calc 2."
      ENDORSEMENT_RENEWAL_GRACE_DAYS: "symbolic — the grace period after a driver's endorsement-valid-until before the auto-flip to INVALID fires. The orchestrator's brief pins this at zero (hard cutoff at the exact valid_until moment) for contrast with the permit's 30-day late grace — the two boundaries on the same fundamental shape (time-window-end-of-validity) with different grace-window-widths is a deliberate scaffold-internal symmetry that makes the rule 6 boundary-precision tests easy to author."
    precision: "Integer arithmetic in cents; no rounding fires given the integer-input integer-constant arithmetic. The hypothetical rounding rule is round-half-up at the multiplicative step, then sum, then cap — pinned for the rule 2 mode-b 'rounding order matters' clause's preemptive coverage."
    variants: []   # the fee is a single-valued function of its inputs; no operational-vs-snapshot duality on it. The on-disk `issue_fee_cents` is the snapshot-of-the-output-at-issue, which is the rule 9 invariant A's "literal amount stored", but the function itself doesn't have a variant.
    notes: |
      This is rule 2's first instance, mode-a "non-linear interaction across ≥3 inputs". The
      three load-bearing inputs are (1) vehicle_count, (2) the wall-clock vs the valid_until edge
      (the late-flag), and (3) the constants table's relative magnitudes (which determines whether
      the cap actually saturates or just sits above the natural maximum). The non-linearity is the
      conditional add-and-cap that breaks linear-superposition: a fee at vehicle_count=10 in the
      late window is not twice the fee at vehicle_count=5 in the late window minus once-base,
      because the cap may have engaged at the high-vehicle-count case but not the low one.
      The cap-then-rounding-order pin (the "compute the integer sum; if any future multiplicative
      step introduces fractional cents, round-half-up at the multiplicative step before summing;
      apply the cap last") satisfies rule 2's mode-b "rounding-order pinning" sub-clause, giving
      the same instance a hint of mode-b coverage in addition to its mode-a non-linearity. The
      two-mode-coverage of a single instance is fine; rule 2's "two instances in different modes"
      is satisfied by *this* instance being mode-a-primary and calc 1's pinned-evaluation-order
      being mode-c-primary, which are different modes.

      The conserved-quantity invariant of rule 9 invariant A is the wallet-plus-regulator-ledger
      sum, and the formula's output value at issue time is the exact integer that gets debited
      from the wallet — that exact integer is stored on the Permit row as `issue_fee_cents`, and
      every subsequent renewal's fee is stored in the `renewal_history` list's `fee_cents` field
      similarly. The void-issue's refund is `issue_fee_cents + sum(renewal_history[*].fee_cents)`,
      which is exactly the sum of the wallet-debits the permit's lifetime took out of the wallet,
      so the net wallet+ledger across the (issue, [renewals,] void-issue) sequence is zero. The
      Quality-Checklist "any assert: line referencing a formula-derived numeric value must be a
      literal the scaffold author actually computed" item is satisfied for the difficulty-design
      file's worked examples, where the inputs are pinned and the literal output is the
      hand-computed integer using these formulas with the file-B numeric constants.

  # ─────────────────────────────────────────────────────────────────────────
  # Calculation 4 — gps_violation_classification.
  # Per-GPS-report classifier. Boolean per-violation-type (speed vs off-
  # route). Triggers Penalty auto-creation on the GPS-ingest handler.
  # Listed as a named calculation because the rule 4 cascade A chain starts
  # from this classifier's output (the "speed_violated" or "off_route" flag
  # is the cause of the auto-created Penalty whose creation is the first
  # link of the four-link transitive cascade chain).
  # ─────────────────────────────────────────────────────────────────────────
  - name: gps_violation_classification
    trigger: "On every successful POST /trips/{tid}/gps-reports — after the order-and-window validations have passed and the GPSReport row is being written. The classifier's two flags drive whether one or both of the auto-Penalty rows are also written in the same transaction."
    algorithm: threshold   # two independent threshold checks on the GPS-sample's fields.
    formula: |
      def gps_violation_classification(gps_report, route, constants):
          # Two independent boolean checks.

          # 1. Speed violation: strict-greater-than the speed limit.
          # The strict-greater-than ("> MAX") means a sample at exactly the
          # limit is *not* a violation. This is the second boundary-precision
          # pin in the scaffold, on the speed metric — note this is the
          # *third* boundary in total (the first two are the driver-points
          # threshold and the permit-time-window edge, which are the two
          # rule-6 instances on different metrics-and-endpoints), but the
          # speed-boundary is a third one on a fourth distinct metric and
          # endpoint (GPS-ingest), strengthening rule 6 above the
          # two-instance minimum.
          speed_violated = (
              gps_report.speed_kph > constants.MAX_HAZMAT_SPEED_KPH
          )

          # 2. Off-route violation: the perpendicular distance from the
          # report's (lat, lon) to the closest segment of the route's
          # polyline is computed using the haversine-segment formula. The
          # exact-distance computation's precision is "double-precision
          # IEEE-754 floats, with the distance interpreted as a non-negative
          # real number of meters". The comparison is strict-greater-than
          # the radius (a sample on the boundary circle is *not* a
          # violation).
          off_route_distance_m = haversine_distance_to_polyline(
              gps_report.lat, gps_report.lon, route.polyline
          )
          off_route_violation = (
              off_route_distance_m > constants.OFF_ROUTE_RADIUS_M
          )

          return {
              "speed_violated": speed_violated,
              "off_route_violation": off_route_violation,
              "off_route_distance_m": off_route_distance_m,
              "speed_points_value": (
                  constants.GPS_VIOLATION_SPEED_POINTS
                  if speed_violated else 0
              ),
              "off_route_points_value": (
                  constants.GPS_VIOLATION_OFF_ROUTE_POINTS
                  if off_route_violation else 0
              ),
          }

      def haversine_distance_to_polyline(lat, lon, polyline):
          # Standard great-circle distance from the point (lat, lon) to the
          # closest segment of the polyline (treated as a list of geodesic
          # segments on the WGS-84 sphere). For each consecutive pair of
          # waypoints (w_i, w_{i+1}), compute the cross-track distance using
          # the standard spherical-trigonometry formula and clamp to the
          # along-track range to handle the endpoint cases. Return the
          # minimum across all segments. The Earth radius constant is the
          # mean radius 6_371_000.0 meters, pinned because varying it
          # produces different distance values for borderline cases — the
          # Quality-Checklist "any constant that the formula evaluates
          # against must be pinned to a single source value" item is
          # satisfied by naming this constant EARTH_RADIUS_M with the
          # numeric value in SCAFFOLD_DIFFICULTY_DESIGN's worked example's
          # constant-table-disclosure.
          ...   # the full implementation is out of scope for the scaffold's
                # YAML; the reference implementation supplies the function.
    input_set: |
      Sources: the single GPSReport row being written, the single TransportRoute referenced via
      the parent Trip's parent Permit's `route_id`, and the constants table. No aggregation, no
      tie-break, no time-window — this is a stateless point-classification.
    constants:
      MAX_HAZMAT_SPEED_KPH:           "Symbol — see annual_renewal_fee's constants table."
      OFF_ROUTE_RADIUS_M:             "Symbol — same."
      GPS_VIOLATION_SPEED_POINTS:     "Symbol — points to assign on a speed-violation auto-penalty."
      GPS_VIOLATION_OFF_ROUTE_POINTS: "Symbol — points to assign on an off-route auto-penalty."
      EARTH_RADIUS_M:                 "Symbol — the WGS-84 mean Earth radius in meters, used by the haversine-segment distance computation. Numeric value 6_371_000.0 is the canonical mean-Earth-radius; the scaffold pins it in the difficulty-design file's constants section so the test layer's hand-computed expected distances match the implementation's computed distances bit-for-bit."
    precision: "Speed comparison is exact (input is already a float; the comparison is the standard IEEE-754 ordering). Distance comparison uses the standard double-precision haversine formula; the exact-boundary case (distance == OFF_ROUTE_RADIUS_M to within machine epsilon) is treated as not-a-violation due to the strict-greater-than. Tests pin the input lat/lon and the polyline waypoints so the computed distance is a known literal value, and the assertions compare against that literal with a tolerance of 1e-3 meters (millimeter-level), matching the typical numerical-precision of haversine on Earth-scale inputs."
    variants: []
    notes: |
      This classifier is the first link of the rule-4 cascade-A four-hop chain. The chain is:
      (hop 1) gps-report-ingest fires the classifier's `speed_violated` (or `off_route_violation`)
      flag; (hop 2) the flag's true value causes the same gps-ingest handler to atomically insert
      a Penalty row with the appropriate `points_value` and `source` discriminator; (hop 3) the
      Penalty-insert's side-effect (per calc 2's trigger prose) recomputes the subject driver's
      `current_rolling_points` cache, and if the post-recompute value crosses the
      THRESHOLD_DRIVER_SUSPENSION_POINTS boundary, the Driver-side state machine's VALID→INVALID
      auto-transition fires in the same transaction, updating the driver's
      `hazmat_endorsement_status` field; (hop 4) on the *next* POST /permits/{id}/verify-compliance
      call on any Permit whose `authorized_driver_ids` contains the just-flipped driver, calc 1's
      live recompute sees the drivers-leg flip to false and the permit's lifecycle_status auto-
      transitions ACTIVE→SUSPENDED. The fourth hop is the cross-aggregate-boundary one, and the
      whole chain has depth 4 from the original POST /gps-reports trigger (counting the
      gps-ingest as hop 0 and the permit-suspension as hop 4), comfortably ≥ 3 as rule 4
      requires for the "at least one cascade of depth ≥ 3" instance.

      The second cascade (depth ≥ 2 per rule 4's twin-cascade clause, with a *different*
      originating trigger) is the daily-sweep's wall-clock-expiry chain: POST /_sweep/run
      observes a Permit whose `valid_until <= now()`, fires the ACTIVE→EXPIRED transition (hop 1),
      which fans out the per-Trip aborts as a synchronous side-effect (hop 2 onto each Trip row).
      The two cascades originate from different triggers (GPS-report ingest vs the clock-sweep)
      and have depths 4 and 2 respectively, satisfying rule 4's "two cascades with different
      originating transitions, at least one of depth ≥ 3 and the other of depth ≥ 2" clause.

# §1.4 — Validations (ordered by priority)
validations:
  # The priority field is a stable integer that the implementation walks in
  # ascending order. The first failing check returns its error_id. Two checks
  # that fall in the same "tier" — auth, role, existence, state-precondition,
  # business — have priority numbers that disambiguate them; the priority pin
  # is the answer to "if check A and check B both fail on the same request,
  # which error wins?". This is the priority-conflict mechanism that rule 5
  # exercises (two priority conflicts on different error-category-pairs).

  # ============================================================
  # Tier 1 — Authentication. Highest priority. The X-User-Role
  # and X-User-ID headers must be present, syntactically valid,
  # and one of the canonical role names.
  # ============================================================
  - priority: 100
    category: auth
    check: "Both `X-User-Role` and `X-User-ID` headers are present in the request, are non-empty strings, and `X-User-Role` is one of the four canonical role names {`CompanyOperator`, `RegulatorOfficer`, `Driver`, `TestHarness`}. A header missing, empty, or with an unrecognized role-name string fails this check."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
    note: "The format-syntactic check on X-User-ID is that it is a non-empty string; whether the string resolves to an existing entity row is a Tier-3 existence check, not a Tier-1 auth check. An X-User-ID that doesn't resolve to any row in the appropriate per-role entity table is a 401 only when the per-role identity is `entity_backed:<E>` and no E row has that id — wait, that's ambiguous between auth-failure and existence-failure. The pinned convention is: if the role's identity is `entity_backed:<E>` and the X-User-ID is a syntactically-valid string that doesn't resolve to an E row, the response is 401 ERR_UNAUTHENTICATED (the credential is invalid because it names a non-existent entity). If the role's identity is `opaque` (RegulatorOfficer, TestHarness), the X-User-ID is accepted as the credential's opaque-id regardless of whether it appears anywhere in the data — there's no E row to look up. This pins the auth-vs-existence boundary, removing the ambiguity that rule 5's priority-conflict-B (existence vs auth on a non-existent cross-tenant resource) hinges on."

  - priority: 110
    category: auth
    check: "For roles whose identity is `entity_backed:<E>` (CompanyOperator → entity_backed:TransportCompany, Driver → entity_backed:Driver), the X-User-ID must resolve to an existing row in the named entity table. The lookup is by primary-key equality on the entity's `id` field. A non-resolvable X-User-ID returns 401 (not 403, and not 404 — the credential is itself invalid)."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints that the role-with-entity-backed-identity can hit, which is the union of CompanyOperator's allow-cells and Driver's allow-cell in the RBAC matrix."

  # ============================================================
  # Tier 2 — Authorization. The X-User-Role must be in the
  # endpoint's allow-set per the §1.7 RBAC matrix. Beats existence.
  # ============================================================
  - priority: 200
    category: auth
    check: "The endpoint's RBAC matrix entry for the request's `X-User-Role` is ALLOW (not DENY). The matrix lives in §1.7 and the lookup is by (endpoint, role) cell. A DENY cell, regardless of the deny-reason variant (default role-mismatch vs cross-tenant vs ownership), returns 403."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all endpoints"
    note: "The deny-reason variants live as named-reason strings on the RBAC matrix's cells — see §1.7. The 'default deny because the role isn't in the allow-set' variant returns the generic ERR_ROLE_NOT_PERMITTED. The 'allowed-in-general-but-the-resource-belongs-to-a-different-tenant' variant returns ERR_CROSS_TENANT_ACCESS, also 403, but with a *different error id*. This is the rule-5 priority-conflict-B's input: a non-existent resource id combined with a wrong-tenant X-User-ID would in principle face both the existence check (404) and the cross-tenant check (403 with the cross-tenant error id) — the priority-ordering pins which one wins. The pin here is: the role-matrix check (priority 200) is the *generic* allow-vs-deny for the role-name; the *cross-tenant* check on a per-row ownership relation is a *Tier-5* business-referential check (priority 530 below), and the *existence* check on the URL-path resource id is a *Tier-3* check (priority 300 below) that fires before the Tier-5 ownership check. Therefore, on a request whose URL path names a non-existent resource AND whose X-User-ID is a wrong-tenant member, the response is 404 ERR_X_NOT_FOUND (Tier 3 wins over Tier 5). This is the rule-5 priority-conflict-B's pinned answer."

  # ============================================================
  # Tier 3 — Existence. URL-path-derived resource ids must
  # resolve to a row. Validated left-to-right per the spec.
  # ============================================================
  - priority: 300
    category: existence
    check: "Each URL path parameter that names a resource id must resolve to a row in the corresponding entity table. The walk is left-to-right: e.g., for POST /companies/{cid}/drivers, the {cid} is checked first against TransportCompany; for POST /companies/{cid}/vehicles, the same; for POST /vehicles/{vid}/inspections, the {vid} is checked against Vehicle, and there's no parent-company existence check at this endpoint because the path doesn't carry it; the vehicle's `company_id` foreign-key consistency is a separate business-referential check at priority 540. The left-to-right convention disambiguates which error fires when multiple ids are unresolvable — the leftmost unresolved id wins."
    error_id: "ERR_<ENTITY>_NOT_FOUND  (the entity name is one of COMPANY, DRIVER, VEHICLE, ROUTE, PERMIT, TRIP, PENALTY, depending on which path-id failed)"
    http_status: 404
    applies_to: "all endpoints whose URL path contains a resource id."

  # ============================================================
  # Tier 4 — State precondition. The target resource is in a
  # state from which the requested transition is legal.
  # ============================================================
  - priority: 400
    category: state
    check: "For state-transition endpoints (the *-action endpoints like /submit, /approve, /reject, /revoke, /issue, /verify-compliance, /renew, /void-issue, /depart, /arrive, /abort, /uphold), the target row's state field is in the per-transition guard-state's allowed-pre-set. For non-state-transition endpoints (the plain CRUD and the GPS-ingest), the relevant cross-entity state check is the parent permit's lifecycle_status — see §1.2 Trip.PLANNED→IN_TRANSIT's `parent_permit.lifecycle_status == ACTIVE` precondition and the GPS-ingest's same check."
    error_id: "ERR_INVALID_STATE_TRANSITION  (the generic 'this transition isn't legal from the current state'); or ERR_PERMIT_NOT_ACTIVE specifically when the parent-permit-not-active gate fires on a trip or gps-ingest endpoint."
    http_status: 409
    applies_to: "the state-action endpoints and the gps-ingest endpoint."
    note: "The two error ids ERR_INVALID_STATE_TRANSITION and ERR_PERMIT_NOT_ACTIVE are both Tier-4 state-category errors. The choice between them is by the granularity of the cause — the former for the same-entity-self-state mismatch, the latter for the cross-entity-parent-state mismatch. The two coexist at priority 400 with a sub-priority pinned by the endpoint: an endpoint whose primary state-check is on the target row uses the generic id; an endpoint whose primary state-check is on the parent permit uses the specific id. There is no scenario where both fire simultaneously and force a priority decision, because the parent-permit check is the precondition for the same-row state-check at the depart and gps-ingest endpoints — the parent-check fires first by virtue of being a *cross-entity precondition* that the §1.2 state-machine guard-expression lists *ahead of* the same-row state-check in the guard's conjunction. Implementations that evaluate the guard's conjunction left-to-right get the parent-check-first order; those that evaluate right-to-left would invert it. The spec's pin is *parent-state-first*, matching the §1.2 state-machine prose's order, and the rule-5 priority-conflict-A's scenario (a permit-not-active AND a route-not-approved on the same trip-creation request) resolves to the permit-state error winning because the permit-state check is a Tier-4 state check while the route-not-approved is a Tier-5 business-referential check on a more-distant cross-entity reference."

  # ============================================================
  # Tier 5 — Business rules. Domain-specific. Ordered within
  # the tier by the safety-first regulatory convention.
  # ============================================================
  # 5a — Safety / regulatory:
  - priority: 510
    category: business_safety
    check: "On POST /permits and POST /permits/{id}/issue, every named driver's hazmat endorsement is in `hazmat_endorsement_status == VALID` and the endorsement's `endorsement_valid_until >= permit.valid_from + PERMIT_DEFAULT_VALIDITY_DAYS` (i.e., the endorsement covers the full would-be permit term)."
    error_id: ERR_DRIVER_ENDORSEMENT_INVALID
    http_status: 409
    applies_to: "POST /permits, POST /permits/{id}/issue, POST /permits/{id}/verify-compliance (the verify-compliance call uses the same check at the live-recompute moment, but the failure of this check on a verify-compliance is the trigger for the ACTIVE→SUSPENDED transition rather than an error response — the verify-compliance endpoint returns 200 with the new lifecycle_status. The error response form is on the issuance path)."

  - priority: 511
    category: business_safety
    check: "On POST /permits and POST /permits/{id}/issue, every named vehicle's most-recent inspection's `outcome == 'PASSED'` and its `valid_until >= permit.valid_from + PERMIT_DEFAULT_VALIDITY_DAYS`."
    error_id: ERR_VEHICLE_INSPECTION_LAPSED
    http_status: 409
    applies_to: "POST /permits, POST /permits/{id}/issue, POST /permits/{id}/verify-compliance (same caveat as above — on verify-compliance the failing leg triggers the state transition rather than the error response)."

  - priority: 512
    category: business_safety
    check: "On POST /trips/{tid}/gps-reports, the strict-greater-than monotonicity of `reported_at` over the trip's current `latest_gps_at`. This is the rule-8 overlap-B interval-arithmetic check on the GPS stream's monotonicity (closed-on-the-prior-edge: a report with `reported_at == latest_gps_at` is a violation; a report with `reported_at > latest_gps_at` is accepted; the equal case is the boundary that rule-8 overlap-B's interval-semantics pins). The validation precedence between this and the in-window check is `in-window first, then monotonicity` — an out-of-window report is rejected with ERR_GPS_OUT_OF_WINDOW *before* the monotonicity check fires."
    error_id: ERR_GPS_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /trips/{tid}/gps-reports"

  - priority: 509
    category: business_safety
    check: "On POST /trips/{tid}/gps-reports, the `reported_at` is in the trip's currently-open window: `actual_departure_at <= reported_at <= min(actual_arrival_at, aborted_at, now())`. Reports submitted on a still-PLANNED trip (where `actual_departure_at` is null) are out-of-window. Reports submitted on a terminal-COMPLETED or terminal-ABORTED trip whose right-edge is in the past are out-of-window. This is the validation that pins the in-window-check vs the order-check precedence ordering: the window-check at priority 509 fires before the order-check at priority 512, so a report that is both out-of-window AND out-of-order returns the window error. This precedence is documented in the GPSReport entity's `reported_at` field prose."
    error_id: ERR_GPS_OUT_OF_WINDOW
    http_status: 409
    applies_to: "POST /trips/{tid}/gps-reports"

  - priority: 513
    category: business_safety
    check: "On POST /penalties/{id}/uphold, the 30-day appeal window from `observed_at` is still open: `now() - penalty.observed_at <= APPEAL_WINDOW_DAYS days`."
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /penalties/{id}/uphold"

  - priority: 514
    category: business_safety
    check: "On POST /permits/{id}/void-issue, the 24-hour void window from `issued_at` is still open: `now() - permit.issued_at <= VOID_ISSUE_WINDOW_HOURS hours`."
    error_id: ERR_VOID_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /permits/{id}/void-issue"

  - priority: 515
    category: business_safety
    check: "On the GPS-ingest path's parent-permit-not-active gate, when the parent permit is in SUSPENDED (the suspension gates the GPS stream as documented in the Permit.SUSPENDED state's prose), the response is ERR_PERMIT_NOT_ACTIVE. This is a Tier-4 state-check on the parent (priority 400's note discussed it), but it's also a Tier-5 business-safety-gate because the regulatory cause of the suspension is a safety-flag flip. The single error id covers both perspectives — the priority-ordering between this and the in-window check is `in-window first` (priority 509 fires before this), so a not-yet-departed trip whose parent permit is SUSPENDED sees the window error rather than the permit-not-active error. This precedence-pin is the rule-5 priority-conflict-A counterpart on the GPS endpoint."
    error_id: ERR_PERMIT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /trips/{tid}/gps-reports (when the parent permit is non-ACTIVE), POST /trips/{id}/depart (when the same), POST /permits/{permit_id}/trips (the trip-creation gate already has this check at the state-tier as documented in §1.2 Trip.PLANNED→IN_TRANSIT's preconditions)."

  # 5b — Cross-entity constraint satisfaction:
  - priority: 520
    category: business_constraint
    check: "On POST /companies/{cid}/drivers, the (company_id, license_number) pair is unique within the company's drivers. On POST /companies/{cid}/vehicles, the plate_number is unique system-wide."
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /companies/{cid}/drivers, POST /companies/{cid}/vehicles."

  - priority: 521
    category: business_temporal
    check: "On POST /permits/{permit_id}/trips, the new trip's `[scheduled_departure_at, scheduled_arrival_at)` half-open interval does not overlap any other Trip's same-half-open-interval on the same `vehicle_id`. The interval-arithmetic is the half-open-right-exclusive convention: adjacency at the exact boundary `existing.scheduled_arrival_at == new.scheduled_departure_at` is permitted because the half-open intervals don't share the boundary point. The two trips can share the boundary timestamp under this convention, modeling the realistic 'one trip ends, the next starts immediately on the same vehicle' case. This is the rule-8 overlap-A check, with interval-semantics distinct from the GPS-stream's closed-on-prior-edge monotonicity (rule-8 overlap-B). The two interval-semantics-on-different-resource-entities pair satisfies rule 8's 'two rules with different interval semantics on different resources' clause."
    error_id: ERR_VEHICLE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /permits/{permit_id}/trips"

  - priority: 522
    category: business_temporal
    check: "On POST /permits/{permit_id}/trips, the new trip's scheduled window falls entirely inside the permit's `[valid_from, valid_until)` half-open interval. Both endpoints are checked: `permit.valid_from <= trip.scheduled_departure_at` and `trip.scheduled_arrival_at <= permit.valid_until` (the inner inequality is closed-on-the-right because the trip's arrival is itself an instant in time, not a half-open right-edge; the spec pins this as the closed-right convention on the trip-vs-permit-window check to avoid a degenerate zero-width-boundary edge case)."
    error_id: ERR_OUTSIDE_VALIDITY_WINDOW
    http_status: 409
    applies_to: "POST /permits/{permit_id}/trips"

  - priority: 523
    category: business_constraint
    check: "On POST /permits, the `len(authorized_vehicle_ids)` is in the range `[1, MAX_VEHICLES_PER_PERMIT]` inclusive on both edges. The lower-bound `1` is the at-least-one-vehicle pin; the upper-bound `MAX_VEHICLES_PER_PERMIT` is the orchestrator's hard cap on the per-permit vehicle-list size (value pinned in SCAFFOLD_DIFFICULTY_DESIGN.yaml)."
    error_id: ERR_PERMIT_VEHICLE_COUNT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /permits"

  - priority: 524
    category: business_constraint
    check: "On POST /permits, the `hazard_classes` field is a non-empty subset of the intersection `company.hazard_classes_authorized ∩ route.hazard_classes_supported`. An empty intersection or a hazard_classes entry that isn't in the intersection returns ERR_VALIDATION 422 (the generic body-schema-violation error, because the hazard-class field's validity is a body-shape predicate). The intersection-subset condition's re-check at the issue-step is identical and uses the same error id."
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "POST /permits, POST /permits/{id}/issue."

  - priority: 525
    category: business_referential
    check: "On POST /permits and POST /permits/{id}/issue, the referenced TransportRoute's `approval_status == APPROVED` at the moment of the call (the route must be in the green-light state). This is the rule-7 entity-pair-A's cross-entity dependency at the permit-issue level (Permit ↔ Route), companion to the Permit ↔ TransportCompany check (priority 526 below). The two pairs differ in the entities-they-bind (Route vs Company), giving rule 7 its 'different entity pairs' clause satisfaction with the TripParent-vs-Permit pair as the second instance at the trip-creation level."
    error_id: ERR_ROUTE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /permits (at the application-validation step where the route's status is read for the snapshot's initial value), POST /permits/{id}/issue (where the issue-time live recompute reads the route's status again — the verify-compliance endpoint and the issue endpoint share this check). Note the precedence-pair rule 5 conflict A on POST /permits/{permit_id}/trips: the trip-creation endpoint's parent-permit-state-check (at the Tier-4 state level, priority 400-ish per the §1.2 state-machine guard) fires *before* this Tier-5 business-referential check on the linked route (which would be a Tier-5-on-a-trans-link via the chain 'trip → permit → route' — that's a two-hop reference resolution at the business tier). So a trip-creation request that names a permit whose `lifecycle_status` is SUSPENDED and whose `route.approval_status` is REJECTED returns ERR_PERMIT_NOT_ACTIVE (Tier-4 wins over Tier-5), per the rule-5 priority-conflict-A pin."

  - priority: 526
    category: business_referential
    check: "On POST /permits and POST /permits/{id}/issue, the referenced TransportCompany's `qualification_status == APPROVED` at the moment. Rule-7 entity-pair-A check on the Permit ↔ Company link, companion to the Trip ↔ Permit check at the trip-creation level (priority 530 below for the cross-tenant-ownership variant of that link)."
    error_id: ERR_COMPANY_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /permits, POST /permits/{id}/issue, POST /permits/{id}/verify-compliance (which uses this check as the company-leg of the validity AND-chain in calc 1; failure on the verify-compliance path triggers the SUSPEND transition rather than the error response, same caveat as for the driver-endorsement-invalid check at priority 510)."

  # 5c — Cross-tenant ownership (a business_referential variant of priority 200's role-allow check):
  - priority: 530
    category: business_referential
    check: "On any endpoint where the per-row ownership rule applies — the {`GET /companies/{cid}`, `GET /drivers/{did}`, `GET /vehicles/{vid}`, `GET /routes/{rid}`, `GET /permits/{pid}`, `GET /trips/{tid}`, `GET /vehicles/{vid}/inspections`, `GET /trips/{tid}/gps-reports`, `GET /drivers/{did}/penalty-summary`, every PATCH/POST/DELETE that names a per-row id} family — the requesting CompanyOperator's X-User-ID equals the row's owning-company-id (transitively for the per-row's parent company: a drivers' owning company is the drivers's `company_id`; a vehicles' owning company is the vehicles's `company_id`; an inspections' owning company is its vehicle's company; a permits' owning company is its `company_id`; a trips' owning company is its permit's company; a gps-reports' owning company is its trip's permit's company; a penalties' owning company is the subject's company-of-record, which for DRIVER subjects is the driver's company and for VEHICLE subjects is the vehicle's company and for COMPANY subjects is the subject itself). A wrong-tenant CompanyOperator hitting an existing-but-not-owned-by-them resource gets ERR_CROSS_TENANT_ACCESS 403 — distinct error id from the generic ERR_ROLE_NOT_PERMITTED at priority 200, which fires for the role-not-in-the-allow-set case. The two-403-error-ids-distinguished-by-cause split is the rule-5 priority-conflict-B's input: a wrong-tenant request on a non-existent resource id sees the existence-check at priority 300 fire *first* (because priorities are ascending integers), so the response is the 404, *not* the cross-tenant 403. This is the pin."
    error_id: ERR_CROSS_TENANT_ACCESS
    http_status: 403
    applies_to: "The endpoint set listed in the check prose. RegulatorOfficer and TestHarness roles are exempt from this check because their RBAC matrix row is the cross-cutting all-allow row (RegulatorOfficer has read access across all tenants by the regulatory-mandate convention; the TestHarness only hits the two _clock and _sweep endpoints which aren't tenanted). The Driver role has its own self-only check at priority 531."

  - priority: 531
    category: business_referential
    check: "On GET /drivers/{did}/penalty-summary, when the requesting role is Driver, the X-User-ID equals the path-id `{did}` (self-read only)."
    error_id: ERR_CROSS_TENANT_ACCESS
    http_status: 403
    applies_to: "GET /drivers/{did}/penalty-summary specifically, when the requesting role is Driver. The CompanyOperator-on-the-same-endpoint check uses the priority-530 same-company rule (the CompanyOperator's X-User-ID equals the driver's `company_id`). The RegulatorOfficer can read any driver's summary."

  # 5d — Fiscal:
  - priority: 540
    category: business_fiscal
    check: "On POST /permits/{id}/issue and POST /permits/{id}/renew, the requesting company's wallet has at least the fee amount: `company.wallet_balance_cents >= annual_renewal_fee(...)`. The fee is computed using the §1.3 formula with the current inputs (vehicle_count, the late-flag for the renewal case, the constants table); the wallet is debited atomically with the state transition on a successful pass."
    error_id: ERR_INSUFFICIENT_WALLET_BALANCE
    http_status: 402
    applies_to: "POST /permits/{id}/issue, POST /permits/{id}/renew."
    note: |
      The HTTP 402 status code is the standard "Payment Required" status, used here as the spec's
      canonical fiscal-shortfall status because the wallet-debit is the only fiscal-effect path
      in the scaffold. The doc-generator should narrate the 402 status as "the company's
      prepaid wallet is short; top up out-of-band before retrying", and the test layer's assertion
      for this error reads the http status as 402 not 409.

      The rule-5 priority-conflict-B's category-pair "fiscal-vs-state" arises here: an issue-call
      on a permit that is in DRAFT (state OK), whose grounding entities are all valid (Tier-5b
      OK), whose wallet is short (Tier-5d fails) returns the 402. An issue-call on a permit that
      is already ACTIVE (state fails the DRAFT-precondition) and whose wallet is also short
      returns the 409 ERR_INVALID_STATE_TRANSITION (Tier-4 state wins over Tier-5d fiscal). The
      two priority-conflict pairs that satisfy rule-5 are:
      Conflict A: state (Tier 4, e.g., ERR_PERMIT_NOT_ACTIVE) versus business_referential
                  (Tier 5b/c, e.g., ERR_ROUTE_NOT_APPROVED) on a multi-failure trip-creation —
                  state wins.
      Conflict B: existence (Tier 3, ERR_X_NOT_FOUND) versus business_referential cross-tenant
                  (Tier 5c, ERR_CROSS_TENANT_ACCESS) on a wrong-tenant non-existent resource —
                  existence wins.
      Conflict C: business_safety (Tier 5a, ERR_GPS_OUT_OF_WINDOW) versus business_safety
                  (Tier 5a, ERR_GPS_OUT_OF_ORDER) on a same-tier conflict where the priority
                  numbers 509 vs 512 disambiguate — the window-check at 509 fires first.
      Conflict D: state (Tier 4, ERR_INVALID_STATE_TRANSITION for the DRAFT-precondition fail)
                  versus business_fiscal (Tier 5d, ERR_INSUFFICIENT_WALLET_BALANCE for the
                  wallet-short fail) on POST /permits/{id}/issue — state wins.
      Conflicts A and B suffice for rule-5's two-instance minimum and the pair-pair-differ
      clause (A is state-vs-business_referential; B is existence-vs-business_referential —
      different first-element categories). Conflicts C and D are bonus instances exercising the
      same-tier-sub-priority-ordering convention and the state-vs-fiscal across-tier pair.

  - priority: 541
    category: business_temporal
    check: "On POST /permits/{id}/renew, the request-arrival time is in the renewal-open window: `valid_until - RENEWAL_OPEN_WINDOW_DAYS <= now() < valid_until`. The lower edge is closed-left (at-or-after); the upper edge is open-right (strictly-before). Beyond the right edge, the permit has transitioned to EXPIRED by the sweep or the verify-compliance auto-expiry, and the call returns ERR_RENEWAL_AFTER_EXPIRY (a different error id from the too-early case)."
    error_id: ERR_RENEWAL_TOO_EARLY
    http_status: 409
    applies_to: "POST /permits/{id}/renew"

  - priority: 542
    category: business_temporal
    check: "On POST /permits/{id}/renew, the permit hasn't already expired: `now() < valid_until` at the moment the request is processed. The right-edge of the renewal window. If the wall-clock has crossed valid_until, the permit's lifecycle_status has already (or is about to) flipped to EXPIRED, and the renewal isn't permitted on an expired permit — a fresh application is required."
    error_id: ERR_RENEWAL_AFTER_EXPIRY
    http_status: 409
    applies_to: "POST /permits/{id}/renew"
    note: "Per the spec's interval convention, the renewal's outer-window is the half-open `[valid_until - RENEWAL_OPEN_WINDOW_DAYS, valid_until)` interval. The lower-edge violation is ERR_RENEWAL_TOO_EARLY (priority 541); the upper-edge violation is ERR_RENEWAL_AFTER_EXPIRY (priority 542). A call landing exactly at `now() == valid_until - RENEWAL_OPEN_WINDOW_DAYS` is in-window (closed-left). A call landing exactly at `now() == valid_until` is out-of-window-and-the-permit-is-expired (open-right). The grace-window for the late penalty is the *inner* sub-window `[valid_until - LATE_RENEWAL_GRACE_DAYS, valid_until)` which doesn't gate accept-vs-reject (it just adds the late-penalty surcharge to the fee). The two inner edges (the on-time-vs-grace and the grace-vs-expired) are both boundary-precision points covered by the rule-6 boundary-A-and-B alternates — though rule-6's two-instance minimum is already met by the driver-points and the permit-time-window pair on different metrics; the renewal-window edges are bonus boundaries on the time metric on a different endpoint than the verify-compliance time-check."

  # 5e — Idempotency:
  - priority: 550
    category: business_constraint
    check: "On POST /trips/{tid}/gps-reports with the `Idempotency-Key` header, the (trip_id, idempotency_key) slot's stored body-hash matches the request body's hash. Mismatch returns the error below; match returns a replay of the original 201 response."
    error_id: ERR_IDEMPOTENCY_KEY_REUSED
    http_status: 409
    applies_to: "POST /trips/{tid}/gps-reports"

  # 5f — Optimistic-concurrency version conflict:
  - priority: 560
    category: business_constraint
    check: "On any endpoint that accepts a `version` field in its body (the mutating endpoints on versioned entities — the common-fields-true entities have version, the common-fields-false event entities don't), the request's `version` value matches the row's current `version`. Mismatch is the standard OCC version-conflict error."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: |
      The mutating endpoints on the six versioned entities:
        - TransportCompany: POST /companies/{id}/submit, /approve, /revoke.
        - Driver: POST /drivers/{did}/refresh-endorsement (the endorsement-attestation endpoint).
        - Vehicle: no mutating endpoints other than the inspection-creation (which is on the
          VehicleInspection event entity, not the Vehicle row — the inspection's insert atomically
          bumps the parent Vehicle's `latest_inspection_*` derived fields as a side effect, and
          the Vehicle's `version` is bumped on that side effect; the gps-report's parent-vehicle
          isn't a load-bearing-version-bump path).
        - TransportRoute: POST /routes/{id}/submit, /approve, /reject.
        - Permit: POST /permits (the application is technically a create-not-mutate, so the
          version-conflict doesn't apply at create; the row starts at version 1), POST
          /permits/{id}/issue, /verify-compliance, /renew, /void-issue.
        - Trip: POST /trips/{id}/depart, /arrive, /abort.
      The body's `version` field is *optional* on every endpoint — when omitted, the server
      reads-then-writes without the OCC guard, accepting the latest-arrival-wins semantics. When
      provided, the server enforces the equality. Tests that exercise the OCC race use the
      versioned-body variant; tests that don't care use the no-version-body variant.

  # 5g — Generic body-schema validation. Catch-all for "the body is malformed at the JSON
  # level or violates a per-field type/range constraint not covered by a more-specific
  # rule above". Priority is the lowest of the business tier because the more-specific
  # checks should fire first and produce a more-specific error_id.
  - priority: 590
    category: business_constraint
    check: "The request body parses as JSON, every required field is present, every field's type matches the entity-schema, every numeric range constraint holds (the per-field `constraints` notes in §1.1 entities), and any enum-typed field's value is in its `taxonomies.*` allowed-values set."
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST and PATCH endpoints with a request body."
    note: |
      The Tier-5 priority-grouping convention is "safety first, fiscal last, validation as
      catch-all" — see the spec's §1.4 prose for the convention. The validation-catch-all
      is at priority 590, near the bottom of Tier 5, so the more-specific business-rule errors
      fire first when they apply. The pure body-shape-violation case (a non-numeric value where
      an integer is required, or an enum value not in the allowed set, or a missing required
      field) hits this rule and returns the 422.

# §1.5 — Endpoints (split A=companies/drivers/vehicles/inspections/routes, B=permits/trips/gps/penalties/test-harness)
endpoints:
  # The endpoint table is the full surface the test harness uses. The
  # testability-completeness principle from the spec's §1.5 prose requires
  # every state the §1.2 state machines declare to be reachable through one
  # of these endpoints — for the wall-clock-gated transitions this means the
  # POST /_clock/advance and POST /_sweep/run endpoints at the tail of Part B.
  # The pagination contract on the list endpoints (just GET
  # /vehicles/{vid}/inspections and GET /trips/{tid}/gps-reports in this
  # scaffold) follows the response-envelope's pagination_defaults from §1.0.
  # All response shapes adhere to the response_envelope's success-or-error
  # JSON contract.

  # ─────────────────────────────────────────────────────────────────────
  # TransportCompany endpoints (six)
  # ─────────────────────────────────────────────────────────────────────
  - method: POST
    path: "/v1/companies"
    description: "An operator files a new TransportCompany qualification application. The row is created in `qualification_status=DRAFT` with the operator's-attested fields (legal_name, registration_number, primary_contact_email, address_line, hazard_classes_authorized). The operator's identity for the subsequent CompanyOperator-role calls IS the new row's `id` — the operator is `entity_backed:TransportCompany`, so the X-User-ID on future calls equals this id. There is a bootstrap question of which role-identity the create-call itself carries (the operator doesn't yet have a company id) — the scaffold pins it as `X-User-Role: CompanyOperator` with an `X-User-ID` matching a special bootstrap-token-id that the regulator-side onboarding flow issues out-of-band; for the test harness the bootstrap is fictional and the create-call accepts any non-empty X-User-ID as the would-be company id (the server actually mints a fresh id for the row, ignoring the X-User-ID on the create-of-self-identity case). The subsequent calls use the returned row id as the X-User-ID. This is a deliberate non-load-bearing detail; the test layer just reads the create response's body for the id and uses it on subsequent calls."
    roles: ["CompanyOperator"]
    code: 201
    request_payload_schema: |
      {
        "legal_name": "string, 1..200",
        "registration_number": "string, regex ^[A-Z0-9]{8,32}$",
        "primary_contact_email": "string, RFC-5322 syntactic",
        "address_line": "string, 0..500",
        "hazard_classes_authorized": "array of un_hazard_class_codes, non-empty, no duplicates"
      }
    response_payload_schema: "the full TransportCompany row, including the server-minted id, the server-set wallet_balance_cents (initial value zero — the operator must top up out-of-band before any fee-paying action), the created_at/updated_at/version trio, and the qualification_status='DRAFT' string."
    side_effects: ["a new row in the TransportCompany table"]
    precondition_state_set: "n/a (creation endpoint)"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,    http: 401, when: "missing or unrecognized X-User-Role header"}
      - {error_id: ERR_ROLE_NOT_PERMITTED, http: 403, when: "X-User-Role is not CompanyOperator (RegulatorOfficer and Driver and TestHarness can't create companies)"}
      - {error_id: ERR_VALIDATION,         http: 422, when: "body fails the field-shape schema (e.g., registration_number doesn't match the regex; hazard_classes_authorized is empty; primary_contact_email isn't RFC-5322 syntactic)"}
      - {error_id: ERR_DUPLICATE_IDENTIFIER, http: 409, when: "another TransportCompany row already has the same `registration_number` value (registration_number is unique system-wide; the legal_name is not unique because different companies in different jurisdictions can share a legal name)"}

  - method: GET
    path: "/v1/companies/{company_id}"
    description: "Read a TransportCompany row. The cross-tenant rule applies to CompanyOperators (a CompanyOperator can read only their own company), the all-tenants-allow rule applies to RegulatorOfficer (the regulator sees every company), Driver has no access (the role's RBAC row is all-DENY except for the self-driver-summary endpoint), TestHarness has no access (only the two test-harness endpoints)."
    roles: ["CompanyOperator", "RegulatorOfficer"]
    code: 200
    request_payload_schema: "n/a (path-only)"
    response_payload_schema: "the full TransportCompany row"
    side_effects: []
    precondition_state_set: "any qualification_status"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,     http: 401, when: "missing or invalid auth headers"}
      - {error_id: ERR_ROLE_NOT_PERMITTED,  http: 403, when: "role is Driver or TestHarness"}
      - {error_id: ERR_COMPANY_NOT_FOUND,   http: 404, when: "the path-id doesn't resolve to a TransportCompany row (existence-check fires before the cross-tenant check, per rule-5 priority-conflict-B)"}
      - {error_id: ERR_CROSS_TENANT_ACCESS, http: 403, when: "role is CompanyOperator and the X-User-ID is not equal to {company_id} (the path id resolves to a real company that the operator doesn't own — this is the per-row ownership check at priority 530, distinct error id from ERR_ROLE_NOT_PERMITTED at priority 200)"}

  - method: POST
    path: "/v1/companies/{company_id}/submit"
    description: "The state-machine transition DRAFT→SUBMITTED on the company's qualification_status. Optional body `{version: integer}` for the OCC guard. Also handles the REVOKED→DRAFT→SUBMITTED compound transit per the §1.2 TransportCompany prose's note on the cycle's internal collapse — a REVOKED-state company observed at the entry to this handler is internally walked to DRAFT before the standard DRAFT→SUBMITTED step. The externally-observable trace is REVOKED-before → SUBMITTED-after."
    roles: ["CompanyOperator"]
    code: 200
    request_payload_schema: "optional `{version: integer}` for OCC"
    response_payload_schema: "the updated TransportCompany row with `qualification_status='SUBMITTED'`, `submitted_at=now()`, and `version` bumped."
    side_effects: ["the §1.2 TransportCompany.DRAFT→SUBMITTED transition's side-effect block"]
    precondition_state_set: "{DRAFT, REVOKED} (the REVOKED case is the cycle's re-entry)"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,       http: 401, when: "auth"}
      - {error_id: ERR_ROLE_NOT_PERMITTED,    http: 403, when: "role isn't CompanyOperator"}
      - {error_id: ERR_COMPANY_NOT_FOUND,     http: 404, when: "the path-id doesn't resolve"}
      - {error_id: ERR_CROSS_TENANT_ACCESS,   http: 403, when: "operator's X-User-ID isn't the company's id"}
      - {error_id: ERR_INVALID_STATE_TRANSITION, http: 409, when: "qualification_status is not in {DRAFT, REVOKED} — i.e., it's SUBMITTED (already submitted) or APPROVED (already approved; the operator's path back to DRAFT from APPROVED is via the regulator's revoke, not the operator's resubmit)"}
      - {error_id: ERR_VALIDATION,            http: 422, when: "the company's pre-submission required-fields-are-non-empty check fails: hazard_classes_authorized is empty, legal_name is empty, primary_contact_email is empty. These are the §1.2 transition's preconditions list's per-field guards."}
      - {error_id: ERR_VERSION_CONFLICT,      http: 409, when: "body's `version` doesn't match the row's current version"}

  - method: POST
    path: "/v1/companies/{company_id}/approve"
    description: "The regulator's SUBMITTED→APPROVED transition. The regulator-side review (background check, document inspection) happens out-of-band; the API just attests the verdict. The wallet_balance_cents is not affected by this transition — the wallet is debited only on permit-issue and permit-renew, not on company-qualification. The first-ever-approval and the after-a-revoke-cycle's reapproval both flow through this endpoint, distinguishable only by the row's prior `revoked_at` field being non-null in the cycle-reapproval case."
    roles: ["RegulatorOfficer"]
    code: 200
    request_payload_schema: "optional `{version: integer, approval_note: string 0..500}`. The approval_note is logged to the audit trail (out-of-band, not stored on the company row in this scaffold)."
    response_payload_schema: "the updated TransportCompany row, `qualification_status='APPROVED'`, `approved_at=now()`."
    side_effects: ["the §1.2 SUBMITTED→APPROVED transition's side-effect block; no cross-entity cascade because the approval doesn't make existing permits change state (it just lets new ones be issued going forward)"]
    precondition_state_set: "{SUBMITTED}"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,       http: 401, when: "auth"}
      - {error_id: ERR_ROLE_NOT_PERMITTED,    http: 403, when: "role isn't RegulatorOfficer"}
      - {error_id: ERR_COMPANY_NOT_FOUND,     http: 404, when: "path id"}
      - {error_id: ERR_INVALID_STATE_TRANSITION, http: 409, when: "the row's current `qualification_status` isn't SUBMITTED"}
      - {error_id: ERR_VERSION_CONFLICT,      http: 409, when: "OCC mismatch"}

  - method: POST
    path: "/v1/companies/{company_id}/revoke"
    description: "The regulator's APPROVED→REVOKED transition. Body carries a required `reason_note` string. The cross-entity cascade onto the company's ACTIVE permits is *deferred* (eventual via the next verify-compliance call on each affected permit; see the §1.2 transition's prose for the deferred-flush convention)."
    roles: ["RegulatorOfficer"]
    code: 200
    request_payload_schema: "{ reason_note: string 1..500, version?: integer }"
    response_payload_schema: "the updated TransportCompany row, `qualification_status='REVOKED'`, `revoked_at=now()`. The cascade-affected Permit rows are NOT touched by this response; the deferred cascade's per-permit flips happen on the subsequent verify-compliance calls and are observable separately by reading the permit rows after the regulator's follow-up actions or the daily-sweep tick."
    side_effects: ["the §1.2 APPROVED→REVOKED side-effect block, plus the *announcement* that the deferred cascade is pending. The announcement is implicit — no separate audit-log entity in this scaffold; readers infer the pending cascade by seeing `company.qualification_status='REVOKED'` while `permit.lifecycle_status='ACTIVE'` on some of the company's permits, a momentary inconsistency that resolves on the next verify-compliance or sweep tick."]
    precondition_state_set: "{APPROVED}"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,        http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,     http: 403, when: "not RegulatorOfficer"}
      - {error_id: ERR_COMPANY_NOT_FOUND,      http: 404}
      - {error_id: ERR_INVALID_STATE_TRANSITION, http: 409, when: "the company isn't currently APPROVED"}
      - {error_id: ERR_VALIDATION,             http: 422, when: "body's `reason_note` is missing, empty, or longer than 500 chars"}
      - {error_id: ERR_VERSION_CONFLICT,       http: 409, when: "OCC mismatch"}

  - method: GET
    path: "/v1/companies"
    description: "List companies, paginated. RegulatorOfficer sees every company; CompanyOperator sees only their own (a list of length 0 or 1 depending on whether the operator's X-User-ID matches a TransportCompany row's id). Filters: `qualification_status` (one of the enum values, repeatable in the query string as a comma-list for the in-set filter), and the standard `limit` and `offset`."
    roles: ["RegulatorOfficer", "CompanyOperator"]
    code: 200
    request_payload_schema: "query parameters: `limit?: integer in [1..100] default 10`, `offset?: integer >=0 default 0`, `qualification_status?: comma-separated list of {DRAFT, SUBMITTED, APPROVED, REVOKED}`"
    response_payload_schema: "{ data: [TransportCompany rows], pagination: {limit, offset, total_count, has_more} } wrapped in the standard response_envelope.success."
    side_effects: []
    precondition_state_set: "n/a"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,    http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED, http: 403, when: "role is Driver or TestHarness"}
      - {error_id: ERR_VALIDATION,         http: 422, when: "limit out of [1, 100]; offset negative; qualification_status filter has an unrecognized enum value"}

  # ─────────────────────────────────────────────────────────────────────
  # Driver endpoints (three)
  # ─────────────────────────────────────────────────────────────────────
  - method: POST
    path: "/v1/companies/{company_id}/drivers"
    description: "The operator registers a driver under their company. The new row's `hazmat_endorsement_status` starts at NOT_ATTESTED; the regulator's refresh-endorsement call below transitions it to VALID after attesting the endorsement. The (company_id, license_number) pair must be unique within the company. The `endorsement_classes` body field is the operator's *requested* set of hazard classes the driver is qualified for, attested by the operator on submission; the actual stored value gets overwritten by the regulator's refresh-endorsement call to the regulator-verified set, which may be a subset. The initial `current_rolling_points` is zero (no prior penalties)."
    roles: ["CompanyOperator"]
    code: 201
    request_payload_schema: |
      {
        "full_name": "string, 1..120",
        "license_number": "string, no whitespace, 6..32 chars",
        "license_class": "string, 2..6 chars (e.g., 'A2')",
        "endorsement_classes_requested": "array of un_hazard_class_codes, no duplicates, may be empty (no attested endorsement yet)"
      }
    response_payload_schema: "the new Driver row, with id, company_id={company_id}, full_name, license_number, license_class, the `endorsement_classes` field initialized to the empty array (the operator's requested set is logged out-of-band, not stored on the row — only the regulator-attested set is stored), `hazmat_endorsement_status='NOT_ATTESTED'`, `endorsement_valid_until=null`, `current_rolling_points=0`, the created_at/updated_at/version trio."
    side_effects: ["a new Driver row"]
    precondition_state_set: "the parent company's qualification_status must be in {APPROVED} — a not-yet-approved company can't register drivers because there's nothing to qualify them under. ERR_COMPANY_NOT_QUALIFIED 409 if the company is DRAFT/SUBMITTED/REVOKED. This is the cross-entity Driver↔Company precondition at registration time, distinct from the Permit↔Company precondition at issue time, and it's not one of the rule-7 cross-entity-state-dependencies the difficulty index pins (the rule-7 instances are Permit↔Company and Trip↔Permit, two pairs of different aggregate-roots). The Driver↔Company at registration is a third dependency that the scaffold has for realism but doesn't claim toward the rule-7 minimum-instance count."
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,        http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,     http: 403, when: "role isn't CompanyOperator"}
      - {error_id: ERR_COMPANY_NOT_FOUND,      http: 404, when: "{company_id} doesn't resolve"}
      - {error_id: ERR_CROSS_TENANT_ACCESS,    http: 403, when: "the operator's X-User-ID isn't equal to {company_id}"}
      - {error_id: ERR_COMPANY_NOT_QUALIFIED,  http: 409, when: "the parent company's qualification_status isn't APPROVED"}
      - {error_id: ERR_VALIDATION,             http: 422, when: "body shape violation, including empty full_name, license_number-format-violation, an endorsement_classes_requested entry that isn't in the un_hazard_class_codes taxonomy."}
      - {error_id: ERR_DUPLICATE_IDENTIFIER,   http: 409, when: "a sibling Driver under the same company already has the requested license_number"}

  - method: GET
    path: "/v1/drivers/{driver_id}"
    description: "Read a Driver row. Cross-tenant rule applies to CompanyOperator (driver's company_id == operator's X-User-ID); RegulatorOfficer sees all drivers; the Driver role itself can read only its own row (priority 531's self-read check); TestHarness has no access."
    roles: ["CompanyOperator", "RegulatorOfficer", "Driver"]
    code: 200
    request_payload_schema: "n/a"
    response_payload_schema: "the Driver row, including the cached `current_rolling_points`. The penalty list itself is not embedded (the dedicated penalty-summary endpoint surfaces the breakdown)."
    side_effects: []
    precondition_state_set: "any"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,     http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,  http: 403, when: "role is TestHarness"}
      - {error_id: ERR_DRIVER_NOT_FOUND,    http: 404, when: "{driver_id} doesn't resolve (existence-check fires before the cross-tenant check)"}
      - {error_id: ERR_CROSS_TENANT_ACCESS, http: 403, when: "role is CompanyOperator and the operator's X-User-ID isn't equal to the driver's `company_id`; or role is Driver and the operator's X-User-ID isn't equal to the driver's `id`"}

  - method: POST
    path: "/v1/drivers/{driver_id}/refresh-endorsement"
    description: "The regulator's endorsement-attestation. Either NOT_ATTESTED→VALID (first-ever attestation), INVALID→VALID (re-attestation after a previous invalidation), or VALID→INVALID via the body's `{revoke: true}` flag (the regulator's manual override; this sets endorsement_valid_until to now() and flips the status to INVALID, which is the same effect as the wall-clock-expiry case)."
    roles: ["RegulatorOfficer"]
    code: 200
    request_payload_schema: |
      Either:
        { "endorsement_valid_until": "ISO 8601 UTC, > now()",
          "endorsement_classes":     "array of un_hazard_class_codes, non-empty, subset of the parent company's hazard_classes_authorized",
          "version?":                "integer for OCC" }
      Or (the revoke variant):
        { "revoke": true,
          "revoke_reason": "string 1..500",
          "version?": "integer for OCC" }
      The two body shapes are mutually exclusive — the request has either the (endorsement_valid_until, endorsement_classes) pair or the (revoke=true, revoke_reason) pair, not both. ERR_VALIDATION 422 for a body that has both or neither.
    response_payload_schema: "the updated Driver row, with the new endorsement_valid_until (or the now() value if revoke), the new endorsement_classes (left intact on the revoke path), the new hazmat_endorsement_status, and the bumped version."
    side_effects: |
      The attestation-direction (NOT_ATTESTED|INVALID → VALID) cascades into the cross-aggregate
      reinstate path on any SUSPENDED permit listing this driver: the next POST /permits/{pid}/verify-compliance
      on each such permit observes the now-VALID drivers-leg and, if all other legs hold, transitions the
      permit SUSPENDED→ACTIVE. This is the upward-arm of the rule-4 cascade discussed in the Penalty.uphold
      and the Driver.INVALID→VALID transitions. The downstream-permit-reinstate is *not* fired
      synchronously by this endpoint; it's a deferred cascade that the test layer reaches via an explicit
      verify-compliance call on each affected permit (or via the daily sweep). The reinstate's deferredness
      is the symmetric counterpart to the revoke-cascade's deferredness in POST /companies/{id}/revoke.
      The revoke-direction (VALID→INVALID with body.revoke=true) is the symmetric cascade-down on any
      ACTIVE permit listing this driver: the next verify-compliance observes the live-recompute's drivers-
      leg as false (the just-revoked endorsement) and the permit transitions ACTIVE→SUSPENDED. Again
      deferred-flush via verify-compliance or the sweep.
    precondition_state_set: |
      For the attestation variant: hazmat_endorsement_status in {NOT_ATTESTED, INVALID}, AND
      current_rolling_points < THRESHOLD_DRIVER_SUSPENSION_POINTS (the regulator cannot attest a driver
      currently over the points threshold; the natural decay or appeal-uphold must first bring the count
      below).
      For the revoke variant: hazmat_endorsement_status == VALID. A revoke on a NOT_ATTESTED or
      already-INVALID driver is ERR_INVALID_STATE_TRANSITION 409.
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,       http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,    http: 403, when: "role isn't RegulatorOfficer"}
      - {error_id: ERR_DRIVER_NOT_FOUND,      http: 404}
      - {error_id: ERR_INVALID_STATE_TRANSITION, http: 409, when: "the precondition-state-set check fails (attestation on an already-VALID driver without the revoke flag, or revoke on a non-VALID driver, or attestation while points are at-or-above threshold)"}
      - {error_id: ERR_VALIDATION,            http: 422, when: "request body's shape is wrong: it has both the attestation fields and the revoke flag, or neither; or endorsement_valid_until is in the past; or endorsement_classes is empty or contains entries not in un_hazard_class_codes or contains entries not in the parent company's hazard_classes_authorized."}
      - {error_id: ERR_VERSION_CONFLICT,      http: 409, when: "the body's version doesn't match"}

  # ─────────────────────────────────────────────────────────────────────
  # Vehicle endpoints (two — create-under-company and read)
  # ─────────────────────────────────────────────────────────────────────
  - method: POST
    path: "/v1/companies/{company_id}/vehicles"
    description: "The operator registers a vehicle under their company. The vehicle starts with no inspection history (its `latest_inspection_*` derived fields are null until a RegulatorOfficer's POST /vehicles/{vid}/inspections call adds the first inspection record)."
    roles: ["CompanyOperator"]
    code: 201
    request_payload_schema: |
      {
        "plate_number":             "string, 4..16 chars, the regional license-plate format. Uniqueness is system-wide.",
        "vehicle_type":             "one of {TANKER_LIQUID, TANKER_GAS, BOX_DRY_BULK, FLATBED_PACKAGED, OTHER}",
        "max_payload_kg":           "positive integer",
        "hazard_classes_compatible":"array of un_hazard_class_codes, non-empty, no duplicates"
      }
    response_payload_schema: "the Vehicle row with the server-set fields (id, company_id={company_id}, latest_inspection_id=null, latest_inspection_outcome=null, latest_inspection_valid_until=null) and the standard common-fields trio."
    side_effects: ["one new Vehicle row"]
    precondition_state_set: "parent TransportCompany.qualification_status == APPROVED"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,       http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,    http: 403, when: "role isn't CompanyOperator"}
      - {error_id: ERR_COMPANY_NOT_FOUND,     http: 404}
      - {error_id: ERR_CROSS_TENANT_ACCESS,   http: 403, when: "operator's X-User-ID isn't {company_id}"}
      - {error_id: ERR_COMPANY_NOT_QUALIFIED, http: 409, when: "parent company isn't APPROVED"}
      - {error_id: ERR_VALIDATION,            http: 422, when: "body shape: plate-format-violation, max_payload_kg <= 0, hazard_classes_compatible empty or with non-taxonomy values"}
      - {error_id: ERR_DUPLICATE_IDENTIFIER,  http: 409, when: "plate_number collides with another Vehicle's plate_number (system-wide uniqueness)"}

  - method: GET
    path: "/v1/vehicles/{vehicle_id}"
    description: "Read a Vehicle row by id, including the derived latest-inspection fields. Cross-tenant rule applies to CompanyOperator; RegulatorOfficer sees all; Driver and TestHarness no access."
    roles: ["CompanyOperator", "RegulatorOfficer"]
    code: 200
    request_payload_schema: "n/a"
    response_payload_schema: "the Vehicle row"
    side_effects: []
    precondition_state_set: "any"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,     http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,  http: 403, when: "role in {Driver, TestHarness}"}
      - {error_id: ERR_VEHICLE_NOT_FOUND,   http: 404, when: "{vehicle_id} doesn't resolve"}
      - {error_id: ERR_CROSS_TENANT_ACCESS, http: 403, when: "CompanyOperator whose X-User-ID isn't the vehicle's `company_id`"}

  # ─────────────────────────────────────────────────────────────────────
  # VehicleInspection endpoints (two — append and list)
  # ─────────────────────────────────────────────────────────────────────
  - method: POST
    path: "/v1/vehicles/{vehicle_id}/inspections"
    description: "The regulator appends an inspection record. The record's `valid_until` is computed as `inspected_at + INSPECTION_VALIDITY_DAYS` (or = inspected_at if outcome==FAILED, the zero-validity case). The parent Vehicle row's three latest-inspection-derived fields are atomically refreshed as a side-effect, with the tie-break-on-equal-inspected_at being lex-larger-id-wins."
    roles: ["RegulatorOfficer"]
    code: 201
    request_payload_schema: |
      {
        "inspected_at":  "ISO 8601 UTC, must be <= now() at insert time (no future-dated inspections; ERR_VALIDATION)",
        "outcome":       "one of {PASSED, FAILED, CONDITIONAL}",
        "findings_note": "string, 0..2000",
        "inspector_id?": "optional regulator-side identifier; if absent, the server uses the request's X-User-ID. Stored on the inspection row's `inspector_id` field for audit."
      }
    response_payload_schema: "the new VehicleInspection row (id, vehicle_id, inspector_id, inspected_at, outcome, valid_until, findings_note, created_at) and a brief summary of the parent Vehicle's just-updated derived fields."
    side_effects: ["one new VehicleInspection row; the parent Vehicle's latest_inspection_id/outcome/valid_until refreshed if this inspection's `inspected_at` is the largest among the vehicle's history (tie-break: lex-larger inspection id wins, so a newly-inserted inspection at the same inspected_at as the previous-latest is the new latest by virtue of having a fresh-UUID id that is overwhelmingly likely to be lex-larger than the existing one; the spec doesn't pin the new-uuid-vs-old-uuid lex-comparison's direction, so the implementation must use the inserted id's literal lex order regardless of which is larger — UUIDs from the same generator are lex-uncorrelated)."]
    precondition_state_set: "the parent Vehicle row exists. The inspection's `outcome` is one of the three enum values; the row is immutable on insert."
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,    http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED, http: 403, when: "role isn't RegulatorOfficer"}
      - {error_id: ERR_VEHICLE_NOT_FOUND,  http: 404, when: "the parent vehicle_id doesn't resolve"}
      - {error_id: ERR_VALIDATION,         http: 422, when: "inspected_at is in the future; outcome is not one of the three values; findings_note exceeds 2000 chars"}

  - method: GET
    path: "/v1/vehicles/{vehicle_id}/inspections"
    description: "List the vehicle's inspections, ordered by `inspected_at` descending then by `id` descending (the tie-break direction matches the latest-pointer's tie-break). Paginated per the response-envelope's standard. Cross-tenant rule applies — the parent vehicle's `company_id` is the gating ownership."
    roles: ["CompanyOperator", "RegulatorOfficer"]
    code: 200
    request_payload_schema: "query: limit?, offset?, outcome? (one of the three enum values for the outcome-filter)"
    response_payload_schema: "{data: [VehicleInspection rows in the order described], pagination: standard}"
    side_effects: []
    precondition_state_set: "any"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,     http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,  http: 403, when: "role in {Driver, TestHarness}"}
      - {error_id: ERR_VEHICLE_NOT_FOUND,   http: 404}
      - {error_id: ERR_CROSS_TENANT_ACCESS, http: 403, when: "CompanyOperator whose X-User-ID isn't the parent vehicle's company"}
      - {error_id: ERR_VALIDATION,          http: 422, when: "limit out of [1,100], offset negative, outcome filter value not in the enum"}

  # ─────────────────────────────────────────────────────────────────────
  # TransportRoute endpoints (five — POST under company, GET, submit, approve, reject)
  # ─────────────────────────────────────────────────────────────────────
  - method: POST
    path: "/v1/companies/{company_id}/routes"
    description: "Operator submits a route application. The new row's `approval_status` starts at DRAFT. The polyline is the ordered list of waypoints. There is no separate PATCH endpoint for in-DRAFT edits in this scaffold — the operator's only path to refine the route's specifics is to POST a fresh route. This keeps the endpoint surface bounded, at the cost of a minor real-world fidelity loss (in practice operators iterate on a draft application; the scaffold collapses that into a single submission with a re-create-on-correction convention)."
    roles: ["CompanyOperator"]
    code: 201
    request_payload_schema: |
      {
        "origin_label":            "string, 1..200",
        "destination_label":       "string, 1..200",
        "polyline":                "array of {lat: float in [-90,90], lon: float in [-180,180]}, length 2..200",
        "hazard_classes_supported":"array of un_hazard_class_codes, non-empty, subset of the parent company's hazard_classes_authorized at submission time"
      }
    response_payload_schema: "the new TransportRoute row in approval_status=DRAFT, the standard common-fields trio."
    side_effects: ["one new TransportRoute row"]
    precondition_state_set: "the parent TransportCompany.qualification_status is APPROVED (a not-yet-qualified company can't apply for a route)."
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,       http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,    http: 403, when: "role isn't CompanyOperator"}
      - {error_id: ERR_COMPANY_NOT_FOUND,     http: 404}
      - {error_id: ERR_CROSS_TENANT_ACCESS,   http: 403, when: "operator's X-User-ID isn't the path's {company_id}"}
      - {error_id: ERR_COMPANY_NOT_QUALIFIED, http: 409, when: "parent company isn't APPROVED"}
      - {error_id: ERR_VALIDATION,            http: 422, when: "body shape: polyline too short or too long, lat/lon out of range, hazard_classes_supported empty or with non-subset-of-company entries (the subset check is the two-time-point-rechecked-at-approve-too rule from the §1.2 TransportRoute prose, and it fails here at the submission-time-point too if the operator's request lists a class the company isn't authorized for)."}

  - method: GET
    path: "/v1/routes/{route_id}"
    description: "Read a route row. Cross-tenant rule applies; RegulatorOfficer sees all."
    roles: ["CompanyOperator", "RegulatorOfficer"]
    code: 200
    request_payload_schema: "n/a"
    response_payload_schema: "the TransportRoute row"
    side_effects: []
    precondition_state_set: "any"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,     http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,  http: 403, when: "role in {Driver, TestHarness}"}
      - {error_id: ERR_ROUTE_NOT_FOUND,     http: 404}
      - {error_id: ERR_CROSS_TENANT_ACCESS, http: 403, when: "CompanyOperator whose X-User-ID isn't the route's `company_id`"}

  - method: POST
    path: "/v1/routes/{route_id}/submit"
    description: "The operator's DRAFT→SUBMITTED transition (and the cycle's REJECTED→DRAFT→SUBMITTED compound-internal-step per §1.2). Refreshes the company-hazard-class-subset check at the submit-time time-point."
    roles: ["CompanyOperator"]
    code: 200
    request_payload_schema: "optional `{version: integer}`"
    response_payload_schema: "the updated route row, approval_status=SUBMITTED, rejection_reason cleared (the cycle's reason-wipe per §1.2's prose), version bumped."
    side_effects: ["the §1.2 DRAFT→SUBMITTED side-effect block plus the rejection_reason clearance"]
    precondition_state_set: "{DRAFT, REJECTED}  (REJECTED handled via the internal-collapse)"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,       http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,    http: 403, when: "not CompanyOperator"}
      - {error_id: ERR_ROUTE_NOT_FOUND,       http: 404}
      - {error_id: ERR_CROSS_TENANT_ACCESS,   http: 403, when: "operator doesn't own the parent company"}
      - {error_id: ERR_INVALID_STATE_TRANSITION, http: 409, when: "approval_status isn't in {DRAFT, REJECTED}"}
      - {error_id: ERR_VALIDATION,            http: 422, when: "the polyline-min-length check or the hazard-classes-subset-of-current-company-authorized-list check fails on the re-evaluation at submit time. The company's hazard_classes_authorized may have narrowed since the route's original POST."}
      - {error_id: ERR_VERSION_CONFLICT,      http: 409, when: "OCC mismatch"}

  - method: POST
    path: "/v1/routes/{route_id}/approve"
    description: "Regulator's SUBMITTED→APPROVED. Re-runs the hazard-class-subset check against the company's *current* hazard_classes_authorized — the two-time-point pin from §1.2's TransportRoute.DRAFT→SUBMITTED transition's preconditions. A hazard-class that was permitted at submit but has since been narrowed-away by a company-side regulator-revoke is the case where the approve-step fails despite the submit having passed."
    roles: ["RegulatorOfficer"]
    code: 200
    request_payload_schema: "optional `{version: integer, approval_note?: string 0..500}`"
    response_payload_schema: "the route row, approval_status=APPROVED, approved_at=now(), approved_by=X-User-ID, rejection_reason cleared (the prior-cycle's audit-of-rejection's reason field is wiped on the new approval, per §1.2's prose)."
    side_effects: ["the §1.2 SUBMITTED→APPROVED side-effect block plus the rejection_reason wipe"]
    precondition_state_set: "{SUBMITTED}"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,       http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,    http: 403, when: "not RegulatorOfficer"}
      - {error_id: ERR_ROUTE_NOT_FOUND,       http: 404}
      - {error_id: ERR_INVALID_STATE_TRANSITION, http: 409, when: "approval_status isn't SUBMITTED"}
      - {error_id: ERR_VALIDATION,            http: 422, when: "the two-time-point hazard-class subset re-check fails against the company's now-narrower authorized list."}
      - {error_id: ERR_VERSION_CONFLICT,      http: 409, when: "OCC mismatch"}

  - method: POST
    path: "/v1/routes/{route_id}/reject"
    description: "Regulator's SUBMITTED→REJECTED. Body carries a required `rejection_reason`. The status is recorded on the route row so the operator can subsequently read the reason and address it before re-submitting."
    roles: ["RegulatorOfficer"]
    code: 200
    request_payload_schema: "{ rejection_reason: string 1..500, version?: integer }"
    response_payload_schema: "the route row, approval_status=REJECTED, rejection_reason=body.rejection_reason."
    side_effects: ["the §1.2 SUBMITTED→REJECTED side-effect block"]
    precondition_state_set: "{SUBMITTED}"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,        http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,     http: 403, when: "not RegulatorOfficer"}
      - {error_id: ERR_ROUTE_NOT_FOUND,        http: 404}
      - {error_id: ERR_INVALID_STATE_TRANSITION, http: 409, when: "approval_status isn't SUBMITTED"}
      - {error_id: ERR_VALIDATION,             http: 422, when: "rejection_reason missing, empty, or too long"}
      - {error_id: ERR_VERSION_CONFLICT,       http: 409, when: "OCC mismatch"}
  # ─────────────────────────────────────────────────────────────────────
  # Permit endpoints (eight — application, list, read, issue, verify, renew, void-issue)
  # The eight here together with the six Trip-related and two GPS-related endpoints
  # form the operational core of the API; together with the company/driver/vehicle/
  # route qualification surface in Part A and the two penalty endpoints below, the
  # total endpoint count is the ~34 documented in the entrance-protocol's expected
  # tally for an Advanced-easier-end scenario.
  # ─────────────────────────────────────────────────────────────────────
  - method: POST
    path: "/v1/permits"
    description: |
      The operator files a permit application. The row is created in
      `lifecycle_status='DRAFT'`. The body's authorized_driver_ids and
      authorized_vehicle_ids lists must reference real-and-owned entities. The
      operator's body-supplied `valid_from` pins the would-be start; the
      actual valid_until isn't computed until the regulator issues. The
      application's strict-snapshot fields are written based on the
      *current* values of the grounding entities — the regulator's
      subsequent issue-step does its own live recompute against the
      grounding entities at issue-time, which may differ from the
      application-time snapshot if the grounding entities have changed in
      between. This time-gap is the natural dual-variant axis for calc 1
      (snapshot-vs-live), with the application's snapshot being the
      forensic "as-of-application" answer and the issue-step's live being
      the "at-issue" answer. Note that the application's snapshot is not
      the same field as the on-disk `snapshot_*` fields that the
      verify-compliance call writes — those are written by the issue-step
      and refreshed on every verify-compliance, and they reflect the
      issue-step's live-recompute as the initial value. The
      application-time snapshot is conceptually a transient: it's
      conveyed in the response body for the operator's awareness ("these
      are the validity-leg booleans your application's grounding entities
      are reporting as of now"), but it isn't a row field. The doc-generator
      should narrate this as "the application step previews the validity-check
      result for the operator's information; the regulator's issue step is
      the authoritative recompute that pins the on-disk snapshot."
    roles: ["CompanyOperator"]
    code: 201
    request_payload_schema: |
      {
        "route_id":                "string, must reference a TransportRoute with `company_id` equal to the operator's X-User-ID and `approval_status='APPROVED'`",
        "authorized_driver_ids":   "array of Driver ids, length 1..50, each with `company_id` equal to operator's X-User-ID and `hazmat_endorsement_status='VALID'` and the endorsement-covers-the-would-be-term sub-condition",
        "authorized_vehicle_ids":  "array of Vehicle ids, length 1..MAX_VEHICLES_PER_PERMIT, each with `company_id` equal to operator's X-User-ID and the most-recent inspection PASSED and covering-the-term",
        "hazard_classes":          "non-empty subset of company.hazard_classes_authorized ∩ route.hazard_classes_supported",
        "valid_from":              "ISO 8601 UTC, >= now()"
      }
    response_payload_schema: |
      The new Permit row, in lifecycle_status='DRAFT', with the standard
      common-fields trio, the body-supplied fields echoed, the strict-snapshot
      fields *unset* (null) since no verify-compliance has fired yet, and
      an additional non-row meta field `application_preview` containing the
      five booleans-and-the-conjunction that the operator's snapshot-equivalent
      reports at the moment of the call. The `application_preview` is for
      the operator's information only and is not persisted; the test layer
      asserts on its shape but not on its value beyond the
      'matches-the-live-recompute-at-application-time' semantics.

      Field listing on the row body:
      {
        id, company_id, route_id, authorized_driver_ids, authorized_vehicle_ids,
        hazard_classes, valid_from,
        valid_until: null,           // set on issue
        lifecycle_status: "DRAFT",
        issued_at: null, issued_by: null, issue_fee_cents: null,
        last_verified_at: null,
        snapshot_company_qualified: null,
        snapshot_driver_endorsements: {},
        snapshot_vehicle_inspections: {},
        snapshot_route_approved: null,
        snapshot_within_window: null,
        renewal_history: [],
        voided_at: null, void_refunded_cents: null,
        created_at, updated_at, version: 1,
        application_preview: {       // not a row field — see prose
          live_company_qualified: bool,
          live_driver_endorsements: {<did>: bool, ...},
          live_vehicle_inspections: {<vid>: bool, ...},
          live_route_approved: bool,
          live_within_window: bool,  // valid_from <= now() < valid_from+PERMIT_DEFAULT_VALIDITY_DAYS — strictly should be < the to-be-set valid_until
          live_overall: bool
        }
      }
    side_effects: ["a new Permit row"]
    precondition_state_set: "n/a (creation)"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,           http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,        http: 403, when: "not CompanyOperator"}
      - {error_id: ERR_ROUTE_NOT_FOUND,           http: 404, when: "route_id doesn't resolve"}
      - {error_id: ERR_DRIVER_NOT_FOUND,          http: 404, when: "any driver_id doesn't resolve (the existence-walk is across the entire authorized_driver_ids list; the leftmost-unresolvable wins per the §1.4 existence-tier's left-to-right convention)"}
      - {error_id: ERR_VEHICLE_NOT_FOUND,         http: 404, when: "any vehicle_id doesn't resolve (same left-to-right convention)"}
      - {error_id: ERR_CROSS_TENANT_ACCESS,       http: 403, when: "the route's company_id, any driver's company_id, or any vehicle's company_id doesn't equal the operator's X-User-ID — cross-tenant references are forbidden at the application step. The error ordering between this and the existence checks is `existence first, then cross-tenant ownership` (priority 300 vs 530 in §1.4), so a non-existent route id wins the 404 over the cross-tenant 403, which is the rule-5 priority-conflict-B's principled pin."}
      - {error_id: ERR_PERMIT_VEHICLE_COUNT_OUT_OF_RANGE, http: 422, when: "authorized_vehicle_ids list is empty or larger than MAX_VEHICLES_PER_PERMIT"}
      - {error_id: ERR_VALIDATION,                http: 422, when: "the hazard_classes-subset-of-intersection check fails; or valid_from is before now(); or the authorized_driver_ids list has cardinality outside [1, 50]; or any duplicate id within either list."}
      - {error_id: ERR_ROUTE_NOT_APPROVED,        http: 409, when: "the route exists, the cross-tenant check passes, but its `approval_status` isn't APPROVED. This Tier-5 business-referential error fires after the Tier-3 existence and Tier-5c cross-tenant pass."}
      - {error_id: ERR_COMPANY_NOT_QUALIFIED,     http: 409, when: "the operator's own company's qualification_status isn't APPROVED (the operator-acting-as-a-not-yet-qualified-company case). The company's qualification is the precondition for any cross-aggregate action, and this is the canonical check-the-company-too-not-just-the-references step."}
      - {error_id: ERR_DRIVER_ENDORSEMENT_INVALID, http: 409, when: "any driver in the list has hazmat_endorsement_status != VALID at the moment of the call, or the driver's endorsement_valid_until is before valid_from + PERMIT_DEFAULT_VALIDITY_DAYS (the endorsement must cover the full would-be permit term)"}
      - {error_id: ERR_VEHICLE_INSPECTION_LAPSED,  http: 409, when: "any vehicle's latest_inspection_outcome isn't PASSED, or its latest_inspection_valid_until is before the would-be permit's valid_until"}

  - method: GET
    path: "/v1/permits/{permit_id}"
    description: |
      Read a Permit. The response embeds the snapshot fields (as they
      are on-disk, as of `last_verified_at`) and a separately-computed
      `live_verdict` boolean reflecting calc 1's live-mode evaluation at
      `now()`. The live verdict is computed on each read and is NOT
      written back to the snapshot — only POST /permits/{id}/verify-compliance
      writes the snapshot. The `live_verdict` may differ from the
      `snapshot_overall` (which is the AND of the on-disk snapshot fields)
      when a grounding entity has changed in the gap between
      last_verified_at and now(); the gap is the dual-variant's
      observable axis. The response also embeds the
      `live_per_leg` map breaking the live conjunction into the five
      legs, in the pinned evaluation-order (company → drivers-sorted-asc-by-id
      → vehicles-sorted-asc-by-id → route → time-window), so tests asserting
      which specific leg disagrees can read the field directly.
    roles: ["CompanyOperator", "RegulatorOfficer"]
    code: 200
    request_payload_schema: "n/a"
    response_payload_schema: |
      The Permit row plus the two derived-at-read-time fields:
      {
        <all Permit row fields per the §1.1 list>,
        snapshot_overall: <AND of the snapshot_* fields, computed at read time from the on-disk snapshot>,
        live_per_leg: {
          live_company_qualified, live_drivers_ok, live_vehicles_ok, live_route_approved, live_within_window
        },
        live_verdict: <AND of live_per_leg's five booleans>
      }
    side_effects: []
    precondition_state_set: "any of {DRAFT, ACTIVE, SUSPENDED, EXPIRED, VOIDED}. The read endpoint doesn't care about the state."
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,     http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,  http: 403, when: "role in {Driver, TestHarness}"}
      - {error_id: ERR_PERMIT_NOT_FOUND,    http: 404, when: "the path id doesn't resolve. Fires before the cross-tenant check per the existence-vs-ownership priority ordering — rule-5 priority-conflict-B's pin. A wrong-tenant operator hitting a non-existent permit-id sees 404, not 403."}
      - {error_id: ERR_CROSS_TENANT_ACCESS, http: 403, when: "role is CompanyOperator whose X-User-ID isn't the permit's `company_id`"}

  - method: GET
    path: "/v1/permits"
    description: |
      List permits, paginated, with filters on `company_id` (one specific
      company id; only the RegulatorOfficer can pass a company_id different
      from their own X-User-ID — CompanyOperator's request ignores the
      query parameter and always returns just their own company's permits,
      per the cross-tenant rule's list-scoping convention) and on
      `lifecycle_status` (a comma-separated subset of the enum). Sorted
      by `created_at` descending then by `id` descending. The pagination
      is the standard limit/offset/total_count/has_more contract.
    roles: ["CompanyOperator", "RegulatorOfficer"]
    code: 200
    request_payload_schema: "query: limit?, offset?, company_id?, lifecycle_status? (comma-separated subset of the enum)"
    response_payload_schema: "{data: [Permit rows], pagination: standard}"
    side_effects: []
    precondition_state_set: "n/a"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,    http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED, http: 403, when: "role in {Driver, TestHarness}"}
      - {error_id: ERR_VALIDATION,         http: 422, when: "limit/offset out of range, lifecycle_status filter has a non-enum value, the explicit `company_id` query parameter is malformed"}
      - {error_id: ERR_CROSS_TENANT_ACCESS, http: 403, when: "role is CompanyOperator and the `company_id` query parameter is present but doesn't equal the operator's X-User-ID. The cleaner alternative would be to silently ignore the query parameter and just return the operator's own list — but the explicit 403 forces the operator's client to use a consistent code path that names the company id. The scaffold pins the explicit-403 convention."}

  - method: POST
    path: "/v1/permits/{permit_id}/issue"
    description: |
      The regulator's DRAFT→ACTIVE transition. Performs the full
      five-leg live-recompute (calc 1's `live` variant), atomically
      computes `annual_renewal_fee` (the issue's fee), debits the
      operator's-company's wallet by that amount, writes the
      strict-snapshot fields with the all-passing leg booleans, writes
      `valid_until = valid_from + PERMIT_DEFAULT_VALIDITY_DAYS`, sets
      `issued_at = now()`, `issued_by = X-User-ID of the regulator`,
      `issue_fee_cents = the just-computed fee`, `last_verified_at = now()`,
      and lifecycle_status = ACTIVE.

      The wallet-debit and the row-state-flip happen in a single transaction
      so an OCC-loser sees neither effect. The §1.4 ordered error table
      pins the precedence between the "wallet short" 402 and the "any
      validity leg fails" 409: the validity legs are Tier-5a (safety) and
      Tier-5b (business-referential), at priorities 510-526, all of which
      fire *before* the Tier-5d fiscal check at priority 540. So a permit
      whose route is unapproved AND whose operator's wallet is short
      returns the validity error (ERR_ROUTE_NOT_APPROVED 409), not the
      wallet error. The wallet check is the *last* line of defense at
      issue time, fired only after all the regulatory checks pass.
    roles: ["RegulatorOfficer"]
    code: 200
    request_payload_schema: "optional `{version: integer, issue_note?: string 0..500}`"
    response_payload_schema: |
      The updated Permit row in ACTIVE, with all the post-issue fields populated:
      {
        ...row fields...,
        lifecycle_status: "ACTIVE",
        valid_until: <valid_from + PERMIT_DEFAULT_VALIDITY_DAYS>,
        issued_at: <now()>,
        issued_by: <X-User-ID>,
        issue_fee_cents: <annual_renewal_fee output integer>,
        last_verified_at: <now()>,
        snapshot_company_qualified: true,
        snapshot_driver_endorsements: {<did>: true, ...},
        snapshot_vehicle_inspections: {<vid>: true, ...},
        snapshot_route_approved: true,
        snapshot_within_window: <(valid_from <= now() < valid_until) — true if valid_from <= now() and false if valid_from is strictly in the future, in which case the permit is ACTIVE-but-not-yet-in-window; the snapshot_within_window field accurately reflects this and the next verify-compliance call after `now()` crosses valid_from will flip it to true>,
        version: <bumped>
      }
      plus a small ledger-entry sub-object describing the wallet-debit
      side-effect: `{wallet_debited_cents: <issue_fee_cents>, new_wallet_balance_cents: <after the debit>}`. This is a transient
      field of the response (not stored on the Permit row), useful for tests
      asserting on the wallet-debit's atomicity. The Company's wallet is
      the canonical on-disk source for the post-issue balance.
    side_effects: |
      Per the §1.2 Permit.DRAFT→ACTIVE block plus the wallet-debit on the
      parent company. The cross-aggregate side-effect is the wallet-mutation
      on the TransportCompany row (the Permit.issue's side-effect block in
      §1.2 lists it, and the cross-aggregate-reference resolvability is
      pinned by the row's `company_id` foreign key per the Quality-Checklist
      "cross-entity reference resolvability" item).
    precondition_state_set: "{DRAFT}"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,             http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,          http: 403, when: "not RegulatorOfficer"}
      - {error_id: ERR_PERMIT_NOT_FOUND,            http: 404}
      - {error_id: ERR_INVALID_STATE_TRANSITION,    http: 409, when: "lifecycle_status isn't DRAFT (the only valid pre-state for the issue action). This includes the case of an already-ACTIVE permit's idempotent retry — the issue endpoint isn't idempotent and a retry sees the now-ACTIVE state and returns the state-transition error. The wallet-conservation invariant of rule 9 invariant A relies on this idempotency-failure: a duplicated issue request can't double-debit the wallet."}
      - {error_id: ERR_COMPANY_NOT_QUALIFIED,       http: 409, when: "the parent company's qualification_status flipped to non-APPROVED between the application and the issue (the time-of-check-vs-time-of-use gap — the application's check was the prior time-point, the issue's check is the current time-point, and the company may have been revoked in between by a separate regulator-side revoke action). Rule-7 entity-pair-A's Permit↔Company cross-entity-state-dependency."}
      - {error_id: ERR_DRIVER_ENDORSEMENT_INVALID,  http: 409, when: "any authorized driver's hazmat_endorsement_status flipped to INVALID, or any driver's endorsement_valid_until is before the would-be valid_until, in the gap between application and issue. The §1.4 priority-510 check."}
      - {error_id: ERR_VEHICLE_INSPECTION_LAPSED,   http: 409, when: "any authorized vehicle's latest_inspection_outcome isn't PASSED or its latest_inspection_valid_until is before the would-be valid_until. §1.4 priority-511."}
      - {error_id: ERR_ROUTE_NOT_APPROVED,          http: 409, when: "the route's approval_status flipped away from APPROVED (e.g., a regulator-revoke on the route in the gap). §1.4 priority-525."}
      - {error_id: ERR_VALIDATION,                  http: 422, when: "the body's optional fields are malformed (e.g., issue_note too long)"}
      - {error_id: ERR_INSUFFICIENT_WALLET_BALANCE, http: 402, when: "the wallet check fails (the Tier-5d fiscal check, last in the validation order, fires only after the safety and business-referential checks have all passed). The conservation invariant requires the wallet's debit to be atomic with the state flip — implementations must implement the issue as a single transaction that holds a row-level lock on the company-row's wallet field plus a row-level lock on the permit's status field, releasing both only at commit."}
      - {error_id: ERR_VERSION_CONFLICT,            http: 409, when: "the body's `version` doesn't match the permit row's current version. The Permit-row's version starts at 1 on creation by the application step and bumps to 2 on the issue's commit; a stale body-version (1 when the row is now 2 because a parallel call already issued — which would itself have raised the state-transition error since the second-arrival saw ACTIVE not DRAFT) wins the version-conflict error in the OCC-race case. The precedence between ERR_INVALID_STATE_TRANSITION on the now-already-ACTIVE state and ERR_VERSION_CONFLICT on the stale version is: state-check fires first (it's at priority 400 in the validation ordering, while OCC is priority 560), so the second-arrival sees ERR_INVALID_STATE_TRANSITION not ERR_VERSION_CONFLICT. The version-conflict error fires only when the row's *version* is mis-matched but the state is *still* DRAFT — which happens when a second non-mutating-but-OCC-checking operation has touched the row in between (there is no such operation on a DRAFT permit in this scaffold, so the version-conflict-on-DRAFT case is empirically unreachable; the error id is still in the table for completeness). The general rule is: lower priority numbers fire first, so state-check at 400 beats OCC at 560 in the simultaneous-failure case."}

  - method: POST
    path: "/v1/permits/{permit_id}/verify-compliance"
    description: |
      The regulator runs a compliance verification. The handler re-evaluates
      calc 1's five validity legs in the `live` mode, compares the conjunction
      against the on-disk snapshot's conjunction, and decides the state
      transition: ACTIVE→SUSPENDED if at-least-one-leg-flipped-true-to-false,
      SUSPENDED→ACTIVE if all-five-legs-now-true-and-the-time-window-is-still-open,
      no transition if the snapshot and live agree, or ACTIVE→EXPIRED /
      SUSPENDED→EXPIRED if `now() >= valid_until` (the wall-clock-expiry
      check, which overrides the suspension-vs-reinstate question). On
      every call, the snapshot fields are rewritten to the live values,
      and `last_verified_at` is set to `now()`. The response carries the
      pre-call and post-call lifecycle_status so the caller can see the
      transition (or non-transition) explicitly. The endpoint is
      idempotent at the value level: two successive verify-compliance
      calls on the same permit with no grounding-entity changes in between
      leave the permit in the same state and produce structurally
      identical snapshot fields (modulo the `last_verified_at` timestamp).
    roles: ["RegulatorOfficer"]
    code: 200
    request_payload_schema: "optional `{version: integer, note?: string 0..500}`"
    response_payload_schema: |
      {
        permit: <full row with refreshed snapshot fields and the new last_verified_at>,
        pre_status:  <the lifecycle_status as it was on entry to the handler>,
        post_status: <the lifecycle_status after the handler's transition logic>,
        transition_fired: <one of "ACTIVE_TO_SUSPENDED", "SUSPENDED_TO_ACTIVE", "ACTIVE_TO_EXPIRED", "SUSPENDED_TO_EXPIRED", "NO_CHANGE">,
        live_per_leg: <the five booleans, in the pinned evaluation order: company, drivers (sorted asc by id), vehicles (sorted asc by id), route, within-window>,
        snapshot_per_leg: <the pre-write snapshot's five booleans for comparison; the post-write snapshot equals live_per_leg by construction>
      }
    side_effects: |
      The §1.2 Permit transitions' side-effect blocks for whichever
      transition fires. For the EXPIRED branches, the trip-abort cascade
      on the permit's PLANNED-and-IN_TRANSIT trips fires synchronously per
      the §1.2 transition's side_effects list and the rule-4 cascade-B
      depth-2 documentation. For the SUSPENDED branch, no trip-abort
      cascade — the suspension only gates the GPS-write path on the trip's
      gps-ingest endpoint, as documented in the SUSPENDED-state prose.
    precondition_state_set: "{ACTIVE, SUSPENDED}  (a DRAFT permit has no snapshot to verify-against; the issue step is the first verify. A VOIDED or EXPIRED permit is terminal and there's nothing to recompute; verify-compliance on a terminal permit is ERR_INVALID_STATE_TRANSITION 409.)"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,         http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,      http: 403, when: "not RegulatorOfficer"}
      - {error_id: ERR_PERMIT_NOT_FOUND,        http: 404}
      - {error_id: ERR_INVALID_STATE_TRANSITION, http: 409, when: "lifecycle_status is one of {DRAFT, EXPIRED, VOIDED}"}
      - {error_id: ERR_VERSION_CONFLICT,        http: 409, when: "body's version doesn't match the row's. The verify-compliance endpoint is the contention-prone one for OCC races, per the concurrency_rules §1.2.1 rule on simultaneous verify-compliance calls."}

  - method: POST
    path: "/v1/permits/{permit_id}/renew"
    description: |
      The operator's annual-renewal. Computes `annual_renewal_fee` with
      the current vehicle_count and the late-flag determined by the
      arrival-time vs `valid_until - LATE_RENEWAL_GRACE_DAYS` comparison.
      Atomically debits the company's wallet and extends `valid_until` by
      `PERMIT_DEFAULT_VALIDITY_DAYS`. Appends a `renewal_history` entry
      capturing `{renewed_at, fee_cents, late_penalty_applied, prior_valid_until, new_valid_until}`.
      The lifecycle_status stays ACTIVE; the renewal does not change the
      state field but does refresh the term. The renewal-window outer
      gate is the §1.4 priority-541 and 542 checks (ERR_RENEWAL_TOO_EARLY
      and ERR_RENEWAL_AFTER_EXPIRY for the two outer-window edges).

      The body may optionally include a fresh `authorized_vehicle_ids` and
      `authorized_driver_ids` list, allowing fleet/driver changes at
      renewal time — the new lists are subject to the same validity checks
      as the original issue (each vehicle's inspection covers the new
      would-be valid_until, each driver's endorsement covers the new
      would-be valid_until, the cardinality bounds, and so on). The
      authorized_hazard_classes can also be modified within the
      company-and-route intersection. The cross-entity dependencies are
      re-checked at renewal time the same way they're checked at issue
      time.
    roles: ["CompanyOperator"]
    code: 200
    request_payload_schema: |
      {
        "version?":               "integer for OCC",
        "authorized_vehicle_ids?":"if present, replaces the row's prior list. If absent, the prior list is kept. The replacement is atomic — partial-replacement isn't supported. ERR_PERMIT_VEHICLE_COUNT_OUT_OF_RANGE if the new list has 0 or > MAX_VEHICLES_PER_PERMIT.",
        "authorized_driver_ids?": "same atomicity. Cardinality 1..50.",
        "hazard_classes?":        "same atomicity. Non-empty subset of company.hazard_classes_authorized ∩ route.hazard_classes_supported.",
        "renew_note?":            "string 0..500, audit text."
      }
    response_payload_schema: |
      The updated Permit row with the new valid_until, the appended
      renewal_history entry, and the wallet-debit sub-object similar to
      the issue endpoint's response.
    side_effects: |
      Wallet debit on the parent company. Appended renewal_history entry.
      `valid_until` is extended by PERMIT_DEFAULT_VALIDITY_DAYS *from its
      prior value*, not from `now()` — so a renewal during the
      late-grace window doesn't have its new-term-end pulled forward by
      the lateness; the new term-end is always exactly one PERMIT_DEFAULT_VALIDITY_DAYS
      ahead of the *prior* term-end. This convention has a subtle
      implication: a consistently-late-renewing operator's permit's term
      drifts forward by the same one-year-per-renewal, and the late penalty
      is the only price paid for the lateness. The conservation invariant
      of rule 9 invariant A holds across (issue + N renewals + void-issue):
      the void-issue's refund is the sum of the issue fee plus every
      renewal fee, restoring the company's wallet to its pre-issue value.
      The wall-clock-bookkeeping of the term-drift is the
      "scheduled/deferred actions" complexity layer in §0 documented as a
      cross-cutting concern.
    precondition_state_set: "{ACTIVE}  (a SUSPENDED permit cannot be renewed — the operator must wait for the suspension cause to clear and the verify-compliance to reinstate before renewing. A DRAFT, EXPIRED, or VOIDED permit is also non-renewable.)"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,             http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,          http: 403, when: "not CompanyOperator"}
      - {error_id: ERR_PERMIT_NOT_FOUND,            http: 404}
      - {error_id: ERR_CROSS_TENANT_ACCESS,         http: 403, when: "operator's X-User-ID isn't the permit's company_id"}
      - {error_id: ERR_INVALID_STATE_TRANSITION,    http: 409, when: "lifecycle_status isn't ACTIVE. The {DRAFT, SUSPENDED, EXPIRED, VOIDED} cases all hit this error id, but for the specific EXPIRED case the §1.4 priority-542 ERR_RENEWAL_AFTER_EXPIRY error id is the canonical one, and the renewal endpoint's handler maps the EXPIRED-state observation onto that specific id rather than the generic ERR_INVALID_STATE_TRANSITION. The two error ids partition the four non-ACTIVE pre-states as `{DRAFT→generic, SUSPENDED→generic, VOIDED→generic, EXPIRED→specific-AFTER_EXPIRY}`. The doc-generator should narrate this as 'a renewal-attempt-on-an-expired-permit gets the specific expiry error so the client knows the permit's term has ended and a fresh application is needed'."}
      - {error_id: ERR_RENEWAL_AFTER_EXPIRY,        http: 409, when: "lifecycle_status is EXPIRED — the wall-clock has crossed valid_until. The handler observes the EXPIRED state and returns this specific error rather than the generic state-transition error. Note the same condition also fires the daily sweep's auto-flip of the permit's status from ACTIVE to EXPIRED, so a renewal request landing exactly at the boundary `now() == valid_until` sees an EXPIRED status on the row (because the sweep, or the verify-compliance's wall-clock check that's also embedded in the renewal handler's pre-action snapshot-refresh, has already flipped it). The boundary semantics are right-exclusive on the renewal window: `now() < valid_until` is in-window, `now() >= valid_until` is out, matching the permit's expiry boundary."}
      - {error_id: ERR_RENEWAL_TOO_EARLY,           http: 409, when: "`now() < valid_until - RENEWAL_OPEN_WINDOW_DAYS` — the renewal window hasn't opened yet. The left edge is closed: at `now() == valid_until - RENEWAL_OPEN_WINDOW_DAYS` exactly, the renewal is in-window. The rule-6 boundary-A-and-B-alternate worked example on this edge is in SCAFFOLD_DIFFICULTY_DESIGN."}
      - {error_id: ERR_VALIDATION,                  http: 422, when: "body shape violations on the optional fields: cardinalities out of range on the optional ids lists, hazard_classes not in the intersection, renew_note too long."}
      - {error_id: ERR_PERMIT_VEHICLE_COUNT_OUT_OF_RANGE, http: 422, when: "the optional authorized_vehicle_ids replacement has cardinality 0 or > MAX_VEHICLES_PER_PERMIT"}
      - {error_id: ERR_DRIVER_NOT_FOUND, http: 404, when: "a body-supplied new driver id doesn't resolve (the existence check is over the union of any new ids in authorized_driver_ids, not over the prior ids which are guaranteed to still exist because the schema doesn't have a delete-driver action — the only way a prior driver is gone is if the company deletes it, which isn't an endpoint in this scaffold)."}
      - {error_id: ERR_VEHICLE_NOT_FOUND, http: 404, when: "same for vehicle ids"}
      - {error_id: ERR_DRIVER_ENDORSEMENT_INVALID, http: 409, when: "any driver in the renewal's effective driver list (the optional new list or the unchanged prior list) has a non-VALID endorsement, or the endorsement's valid_until doesn't cover the new would-be valid_until (which is `prior_valid_until + PERMIT_DEFAULT_VALIDITY_DAYS`)."}
      - {error_id: ERR_VEHICLE_INSPECTION_LAPSED, http: 409, when: "same shape for vehicles' inspection-coverage check on the new would-be term"}
      - {error_id: ERR_ROUTE_NOT_APPROVED, http: 409, when: "the route's approval_status flipped away from APPROVED in the gap since the original issue (the route is one of the four grounding entities whose validity is checked at renewal time, mirroring the issue-time check)"}
      - {error_id: ERR_COMPANY_NOT_QUALIFIED, http: 409, when: "the company's qualification_status flipped to non-APPROVED in the gap — the renewal step does a full five-leg recheck the same way the issue step does."}
      - {error_id: ERR_INSUFFICIENT_WALLET_BALANCE, http: 402, when: "wallet is short of the renewal fee. The fee is the formula's output for the call-time inputs; the late-penalty surcharge applies if the call lands in the late-grace window."}
      - {error_id: ERR_VERSION_CONFLICT,    http: 409, when: "OCC mismatch"}

  - method: POST
    path: "/v1/permits/{permit_id}/void-issue"
    description: |
      The regulator's clerical-error reversal of the issue. Gated to the
      24-hour window from `issued_at`. The compensating action refunds
      the wallet by exactly the sum `issue_fee_cents + sum(renewal_history[*].fee_cents)`,
      writes `voided_at = now()` and `void_refunded_cents = that sum`,
      transitions lifecycle_status from ACTIVE to VOIDED, and cascades the
      in-flight trips to ABORTED with `abort_reason='PERMIT_SUSPENDED_CASCADE'`
      (the on-disk discriminator value matches suspension-cascades per the
      enum-economy choice in §1.2's prose; the audit trail distinguishes the
      two causes out-of-band). The conserved-quantity invariant of rule 9
      invariant A: the company's wallet balance after the void is equal to
      its balance immediately before the original issue (modulo any
      out-of-band wallet top-ups in between, which are conceptually
      additive constants that don't affect the conservation).

      The endpoint is gated to ACTIVE state only — a SUSPENDED permit
      cannot be voided. The cleaner alternative would be to allow voiding
      a SUSPENDED permit (the issue was a clerical error regardless of
      the current suspension state), but the scaffold's pin is
      ACTIVE-only to keep the state machine's terminal-target set small.
      In practice the regulator would do a verify-compliance to reinstate
      a transiently-suspended permit before voiding the issue, or wait for
      the suspension to clear naturally. The 24-hour-window pin makes
      this knife-edge rarely hit.
    roles: ["RegulatorOfficer"]
    code: 200
    request_payload_schema: "{ reason_note: string 1..500, version?: integer }"
    response_payload_schema: |
      The updated Permit row in VOIDED state with `voided_at` and
      `void_refunded_cents` set, plus a wallet-ledger sub-object
      `{wallet_credited_cents: <void_refunded_cents>, new_wallet_balance_cents: <after the credit>}`
      and the cascade-summary sub-object listing the ids of the trips
      that were cascade-aborted as part of the void, plus their new
      `abort_reason` and `aborted_at` values.
    side_effects: |
      Wallet credit on the parent company. Trip-cascade onto every
      PLANNED-or-IN_TRANSIT trip on this permit, with `abort_reason` set
      per the enum-economy convention. The Penalty entities created on
      the now-aborted trips by their prior GPS-violations remain
      ACTIVE — the void of the *permit* doesn't void the disciplinary
      *penalties* that the drivers earned during the issue's term. The
      regulator's path to void a specific penalty is the separate
      POST /penalties/{id}/uphold appeal action. The two conservation
      invariants (currency in rule 9 invariant A, points in invariant B)
      are *independent*: a permit-void doesn't affect the penalty-points
      ledger, and a penalty-uphold doesn't affect the wallet ledger.
    precondition_state_set: "{ACTIVE}, and `now() - issued_at <= VOID_ISSUE_WINDOW_HOURS hours`."
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,         http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,      http: 403, when: "not RegulatorOfficer"}
      - {error_id: ERR_PERMIT_NOT_FOUND,        http: 404}
      - {error_id: ERR_INVALID_STATE_TRANSITION, http: 409, when: "lifecycle_status isn't ACTIVE (the SUSPENDED, DRAFT, EXPIRED, VOIDED cases all return this generic state error; the VOID_WINDOW_CLOSED error below is a different cause)."}
      - {error_id: ERR_VOID_WINDOW_CLOSED,      http: 409, when: "now() - issued_at exceeds the 24-hour window. The boundary semantics: a void call at exactly `now() == issued_at + VOID_ISSUE_WINDOW_HOURS` is the closed-right edge — the spec pins this as IN-window (the boundary moment is still inside the 24-hour window, so the void is permitted at the exact 24-hour mark and rejected at any nanosecond past). This is yet another boundary-precision point on the time-difference metric, distinct from the boundaries on the permit's valid_until and the driver's endorsement_valid_until and the appeal-window's now-observed_at."}
      - {error_id: ERR_VALIDATION,              http: 422, when: "reason_note missing or out-of-bounds"}
      - {error_id: ERR_VERSION_CONFLICT,        http: 409, when: "OCC mismatch — the concurrency_rules §1.2.1 entry covers the simultaneous-void-and-renewal race on the same row."}

  # ─────────────────────────────────────────────────────────────────────
  # Trip endpoints (five — create-under-permit, read, depart, arrive, abort)
  # ─────────────────────────────────────────────────────────────────────
  - method: POST
    path: "/v1/permits/{permit_id}/trips"
    description: |
      The operator schedules a trip under an ACTIVE permit. The new row
      is in trip_status=PLANNED. The scheduled-window-vs-vehicle-calendar
      overlap check (rule-8 overlap-A, half-open right-exclusive
      semantics) fires here, returning ERR_VEHICLE_DOUBLE_BOOKED on a
      collision with an existing trip on the same vehicle_id. The
      scheduled-window-vs-permit-validity-window check fires too
      (ERR_OUTSIDE_VALIDITY_WINDOW), as does the driver-must-be-on-the-
      permit-list and the vehicle-must-be-on-the-permit-list check.
    roles: ["CompanyOperator"]
    code: 201
    request_payload_schema: |
      {
        "driver_id":                "must be in the permit's authorized_driver_ids and currently VALID",
        "vehicle_id":               "must be in the permit's authorized_vehicle_ids and currently PASSED-inspected-and-still-in-its-inspection-validity-window-through-the-scheduled-arrival-at",
        "cargo_description":        "string 1..500",
        "cargo_hazard_class":       "one entry from un_hazard_class_codes, must be in the permit's hazard_classes",
        "cargo_weight_kg":          "integer >=0, <= vehicle.max_payload_kg",
        "scheduled_departure_at":   "ISO 8601 UTC, > now(), in [permit.valid_from, permit.valid_until)",
        "scheduled_arrival_at":     "ISO 8601 UTC, > scheduled_departure_at, in (scheduled_departure_at, permit.valid_until]. The right-edge interval semantics is closed on the arrival-edge (the scheduled arrival can equal the permit's valid_until exactly), but the actual arrival time recorded later by the arrive endpoint is whatever the wall-clock says at the moment of the call. The half-open-vs-closed dichotomy between the permit's expiry (right-exclusive on now()) and the trip's scheduled arrival vs the permit's expiry (closed on the arrival-edge of the scheduled window) is a deliberate scaffold-internal asymmetry — the doc-generator should be careful to narrate that the *scheduled* arrival-edge is allowed to touch the permit's expiry-edge (a trip scheduled to arrive at exactly the permit's expiry moment is valid at scheduling time), even though the *wall-clock-now* check on the gps-ingest's in-window predicate uses the strict-less-than on now-vs-valid_until."
      }
    response_payload_schema: "the new Trip row in trip_status=PLANNED, with the body-fields echoed, the actual_* and aborted_* fields null, latest_gps_at=null, gps_violation_count=0, the standard common-fields trio."
    side_effects: ["one new Trip row"]
    precondition_state_set: |
      The parent permit's lifecycle_status is ACTIVE (rule-7 entity-pair-B
      Trip↔Permit cross-entity dependency).
      The body's driver_id is in the permit's authorized_driver_ids list
      and the driver's current hazmat_endorsement_status is VALID and the
      driver's current_rolling_points is strictly below the threshold.
      The body's vehicle_id is in the permit's authorized_vehicle_ids
      list and the vehicle's latest_inspection_outcome is PASSED and the
      latest_inspection_valid_until is >= the body's scheduled_arrival_at
      (the inspection must cover the trip's arrival).
      The vehicle's no-double-booking interval-arithmetic check passes
      against the half-open `[existing.scheduled_departure_at,
      existing.scheduled_arrival_at)` intervals of every other Trip on
      the same vehicle, regardless of which permit those other trips
      belong to (the vehicle is the physical-asset that can't be in two
      places at once; the asset-uniqueness is across permits, not within
      a permit).
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,         http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,      http: 403, when: "not CompanyOperator"}
      - {error_id: ERR_PERMIT_NOT_FOUND,        http: 404, when: "{permit_id} doesn't resolve"}
      - {error_id: ERR_CROSS_TENANT_ACCESS,     http: 403, when: "operator's X-User-ID isn't the permit's company_id"}
      - {error_id: ERR_PERMIT_NOT_ACTIVE,       http: 409, when: "permit.lifecycle_status isn't ACTIVE — DRAFT, SUSPENDED, EXPIRED, or VOIDED. This is the Tier-4 state error on the parent. The precedence rule from §1.4 is that this Tier-4 error fires before the Tier-5 business-referential errors below — so a trip-creation on a SUSPENDED permit whose linked route happens to be in a non-APPROVED state (because the regulator revoked it) returns the permit-not-active 409, not the route-not-approved 409. This is the rule-5 priority-conflict-A's principled pin."}
      - {error_id: ERR_DRIVER_NOT_FOUND,        http: 404, when: "driver_id doesn't resolve (it's the body-supplied id, not a path-id; the existence check is at the same Tier-3 priority as path-ids per the spec's left-to-right walk extended to body-supplied ids)"}
      - {error_id: ERR_VEHICLE_NOT_FOUND,       http: 404, when: "vehicle_id doesn't resolve"}
      - {error_id: ERR_VALIDATION,              http: 422, when: "driver_id isn't in the permit's authorized_driver_ids; vehicle_id isn't in the permit's authorized_vehicle_ids; cargo_hazard_class isn't in the permit's hazard_classes; cargo_weight_kg is negative or exceeds the vehicle's max_payload_kg; scheduled_departure_at < now(); scheduled_arrival_at <= scheduled_departure_at; either time is outside the permit's [valid_from, valid_until] window (with the closed-right convention on the arrival-edge per the request-schema prose above); cargo_description out of bounds."}
      - {error_id: ERR_DRIVER_ENDORSEMENT_INVALID, http: 409, when: "the body's driver_id, even though it's in the permit's authorized_driver_ids list, has a current hazmat_endorsement_status of INVALID or NOT_ATTESTED at the time-of-call. The permit's authorized_driver_ids snapshot the regulator-approved list at issue time but the live endorsement-status is checked fresh at each trip-creation."}
      - {error_id: ERR_VEHICLE_INSPECTION_LAPSED, http: 409, when: "the body's vehicle_id has a latest_inspection_outcome not PASSED or a latest_inspection_valid_until earlier than the scheduled_arrival_at. The live re-check at trip-creation time, mirroring the driver-endorsement live check."}
      - {error_id: ERR_VEHICLE_DOUBLE_BOOKED,   http: 409, when: "the half-open `[scheduled_departure_at, scheduled_arrival_at)` interval overlaps an existing Trip's same-half-open interval on the same vehicle_id. Adjacency (one trip's arrival equals another's departure exactly) is *not* a collision under the half-open semantics — the touching-endpoints case is admitted. This is the rule-8 overlap-A check with the half-open-right-exclusive interval semantics. The check is cross-permit: a trip under permit X on a vehicle V whose interval touches a trip under permit Y on the same vehicle V is checked against the Y-trip's interval too, because the vehicle is the physical-asset gate."}
      - {error_id: ERR_OUTSIDE_VALIDITY_WINDOW, http: 409, when: "the scheduled-window's left edge is before permit.valid_from or its right edge is after permit.valid_until. (The schema-validation at the 422 level catches the type-and-numeric-range violations; this 409 fires on the window-membership business rule.)"}

  - method: GET
    path: "/v1/trips/{trip_id}"
    description: "Read a Trip row. Cross-tenant rule applies; RegulatorOfficer sees all trips. The Driver role can read a trip only if the driver's id matches the trip's driver_id (self-driver-can-see-own-trips, the symmetric counterpart of the self-driver-can-see-own-penalty-summary rule). The TestHarness role has no access."
    roles: ["CompanyOperator", "RegulatorOfficer", "Driver"]
    code: 200
    request_payload_schema: "n/a"
    response_payload_schema: "the Trip row, including the live derived fields `latest_gps_at` and `gps_violation_count`. The GPS-stream itself is via the dedicated list endpoint below."
    side_effects: []
    precondition_state_set: "any"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,     http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,  http: 403, when: "role is TestHarness"}
      - {error_id: ERR_TRIP_NOT_FOUND,      http: 404, when: "{trip_id} doesn't resolve"}
      - {error_id: ERR_CROSS_TENANT_ACCESS, http: 403, when: "CompanyOperator whose X-User-ID isn't the trip's parent-permit's company_id, OR Driver whose X-User-ID isn't the trip's driver_id. The latter is the RBAC deviation cell for the Driver-role-on-a-not-own-trip case."}

  - method: POST
    path: "/v1/trips/{trip_id}/depart"
    description: "PLANNED→IN_TRANSIT. Sets actual_departure_at = now(). Re-checks the parent-permit-is-ACTIVE precondition (a permit may have been SUSPENDED between trip-creation and trip-depart). Does NOT re-check the no-double-booking interval (the scheduled windows are immutable from creation onward, so the check at creation is sufficient — but the wall-clock might have advanced past the scheduled departure on the still-PLANNED trip, in which case the depart is allowed regardless of the scheduled-vs-actual gap; the spec doesn't pin a tardiness-cutoff for the depart action). Optional `{version}` for OCC."
    roles: ["CompanyOperator"]
    code: 200
    request_payload_schema: "optional `{version: integer, depart_note?: string 0..500}`"
    response_payload_schema: "the updated Trip row in IN_TRANSIT with actual_departure_at = now(), version bumped."
    side_effects: "the §1.2 Trip.PLANNED→IN_TRANSIT block."
    precondition_state_set: "{PLANNED}, and the parent permit is ACTIVE (rule-7 entity-pair-B)."
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,         http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,      http: 403, when: "not CompanyOperator"}
      - {error_id: ERR_TRIP_NOT_FOUND,          http: 404}
      - {error_id: ERR_CROSS_TENANT_ACCESS,     http: 403, when: "operator's X-User-ID isn't the parent-permit's company_id"}
      - {error_id: ERR_INVALID_STATE_TRANSITION, http: 409, when: "trip_status isn't PLANNED"}
      - {error_id: ERR_PERMIT_NOT_ACTIVE,       http: 409, when: "the parent permit's lifecycle_status isn't ACTIVE (the cross-entity gate). The precedence between the same-row state-check (trip_status==PLANNED) and the parent-state-check (permit.lifecycle_status==ACTIVE) is: the parent-check fires first, matching the §1.2 transition-guard's left-to-right conjunction-evaluation order documented in the §1.4 Tier-4 prose. So a not-yet-departed trip on a SUSPENDED parent permit gets ERR_PERMIT_NOT_ACTIVE, not ERR_INVALID_STATE_TRANSITION; the rule-5 priority-conflict-A's pin."}
      - {error_id: ERR_VERSION_CONFLICT,        http: 409, when: "OCC"}

  - method: POST
    path: "/v1/trips/{trip_id}/arrive"
    description: "IN_TRANSIT→COMPLETED. Sets actual_arrival_at = now(). The parent-permit-state check here is more permissive than at depart: a SUSPENDED-parent's in-flight trip can still arrive (the suspension gates GPS-writes, not the trip-wind-down attestation per the SUSPENDED-state prose in §1.2). Only the terminal-permit states EXPIRED and VOIDED — which cascade-abort the trip themselves and leave it in trip_status=ABORTED — make the arrive action's precondition fail, and in those cases the trip's own trip_status is no longer IN_TRANSIT but ABORTED, so the action returns ERR_INVALID_STATE_TRANSITION on the trip-status check, not a separate permit-state error."
    roles: ["CompanyOperator"]
    code: 200
    request_payload_schema: "optional `{version: integer, arrive_note?: string 0..500, delivery_attestation?: string 0..1000}`"
    response_payload_schema: "the updated Trip row in COMPLETED."
    side_effects: "the §1.2 IN_TRANSIT→COMPLETED block. The GPS-ingest endpoint's in-window check uses min(actual_arrival_at, aborted_at, now()) on the open end — after the arrival, the now-finite right-edge causes subsequent gps-reports to fail the window-check."
    precondition_state_set: "{IN_TRANSIT}. Implicitly the parent permit is in {ACTIVE, SUSPENDED} (the EXPIRED and VOIDED cases would have already cascade-aborted the trip)."
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,         http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,      http: 403, when: "not CompanyOperator"}
      - {error_id: ERR_TRIP_NOT_FOUND,          http: 404}
      - {error_id: ERR_CROSS_TENANT_ACCESS,     http: 403, when: "wrong tenant"}
      - {error_id: ERR_INVALID_STATE_TRANSITION, http: 409, when: "trip_status isn't IN_TRANSIT — e.g., a still-PLANNED trip's arrive-without-depart attempt, or an already-COMPLETED-or-ABORTED trip's idempotent retry."}
      - {error_id: ERR_VERSION_CONFLICT,        http: 409, when: "OCC"}

  - method: POST
    path: "/v1/trips/{trip_id}/abort"
    description: "Operator-initiated abort. Works on both PLANNED-and-not-yet-departed and IN_TRANSIT trips, transitioning them to ABORTED with `abort_reason='OPERATOR_ABORT'`. The cascade-from-permit-state-change paths (PERMIT_EXPIRED_CASCADE and PERMIT_SUSPENDED_CASCADE, the latter being the void's cascade per the enum-economy convention) are NOT triggered by this endpoint — those are server-internal cascades from the permit's state-transitions on its own endpoints. The operator's only direct abort-reason is OPERATOR_ABORT."
    roles: ["CompanyOperator"]
    code: 200
    request_payload_schema: "{ reason_note: string 1..500, version?: integer }"
    response_payload_schema: "the updated Trip row in ABORTED with abort_reason='OPERATOR_ABORT', aborted_at=now()."
    side_effects: "the §1.2 PLANNED-or-IN_TRANSIT→ABORTED block with abort_reason set."
    precondition_state_set: "{PLANNED, IN_TRANSIT}. The terminal states {COMPLETED, ABORTED} reject the action with ERR_INVALID_STATE_TRANSITION."
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,         http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,      http: 403, when: "not CompanyOperator"}
      - {error_id: ERR_TRIP_NOT_FOUND,          http: 404}
      - {error_id: ERR_CROSS_TENANT_ACCESS,     http: 403, when: "wrong tenant"}
      - {error_id: ERR_INVALID_STATE_TRANSITION, http: 409, when: "trip_status is terminal (COMPLETED or ABORTED)."}
      - {error_id: ERR_VALIDATION,              http: 422, when: "reason_note missing or out-of-bounds"}
      - {error_id: ERR_VERSION_CONFLICT,        http: 409, when: "OCC"}

  # ─────────────────────────────────────────────────────────────────────
  # GPSReport endpoints (two — append and list)
  # ─────────────────────────────────────────────────────────────────────
  - method: POST
    path: "/v1/trips/{trip_id}/gps-reports"
    description: |
      Append a GPS sample to the trip's stream. The handler runs the §1.4
      validation order: parent-permit-active gate (Tier-5b at priority
      515), in-window gate (Tier-5a at priority 509), monotonicity gate
      (Tier-5a at priority 512), then calc 4 `gps_violation_classification`
      to classify the sample, then writes the GPSReport row, then atomically
      writes any auto-Penalty rows for the violations (zero, one, or two:
      the speed-violation and the off-route-violation are independent
      checks), then updates the parent Trip's `latest_gps_at` cursor and
      `gps_violation_count` field. The Idempotency-Key header is the
      per-trip dedup-slot — see the §1.0 idempotency block and the
      §1.2.1 concurrency rule for the body-hash-equality replay semantics
      versus the body-hash-mismatch rejection.

      The classifier's two flag-and-points-value pairs drive the auto-
      Penalty rows. The speed-violation row has source=GPS_VIOLATION_SPEED
      and points_value=GPS_VIOLATION_SPEED_POINTS. The off-route-violation
      row has source=GPS_VIOLATION_OFF_ROUTE and points_value=
      GPS_VIOLATION_OFF_ROUTE_POINTS. Both auto-rows carry the
      source_gps_report_id field linking back to the GPS report that
      caused them, and the trip_id field linking to the trip context. The
      subject of both auto-rows is the trip's driver (subject_type=DRIVER,
      subject_id=trip.driver_id).

      The driver-side cascade fires as a synchronous side-effect of the
      penalty-insert: the driver's `current_rolling_points` is incremented
      by the points_value, and if the post-increment crosses the threshold
      `THRESHOLD_DRIVER_SUSPENSION_POINTS`, the driver's
      `hazmat_endorsement_status` flips from VALID to INVALID atomically.
      The permit-side cascade onto every ACTIVE permit listing this
      driver is deferred — it fires on the next verify-compliance call,
      either via the daily sweep or via a regulator's explicit call. So
      the full chain depth from the GPS-ingest-with-speed-over-the-limit
      observation is: (hop 1) gps-report insert → (hop 2) auto-penalty
      insert → (hop 3) driver's current_rolling_points crosses threshold
      and hazmat_endorsement_status flips to INVALID → (hop 4) next
      verify-compliance on each affected permit sees the drivers-leg
      flipped and the permit transitions ACTIVE→SUSPENDED. Depth 4
      cascade from the original POST /gps-reports trigger — rule-4
      cascade-A's depth-≥3 instance.
    roles: ["CompanyOperator"]
    code: 201
    request_payload_schema: |
      Request headers: optional `Idempotency-Key: <string, 8..128 chars>`. Body:
      {
        "reported_at":   "ISO 8601 UTC with millisecond precision, must be > trip.latest_gps_at and in [actual_departure_at, terminal_open_edge_or_now)",
        "lat":           "float in [-90, 90]",
        "lon":           "float in [-180, 180]",
        "speed_kph":     "non-negative float",
        "heading_deg":   "float in [0, 360]"
      }
    response_payload_schema: |
      The new GPSReport row including the server-computed `off_route_distance_m`,
      the server-set `received_at`, the auto-set `idempotency_key` (lifted
      from the header or null), and the `auto_penalty_ids` array of
      the just-created auto-Penalty row ids (length 0, 1, or 2 depending on
      which violations fired). The response also embeds a brief
      `cascade_summary` sub-object with the driver's post-cascade
      `current_rolling_points` and `hazmat_endorsement_status` for tests to
      assert on the cascade's depth-3 (driver-flip) result without having to
      issue a separate driver-read call.
    side_effects: |
      One new GPSReport row. Zero, one, or two new Penalty rows (one per
      violation type). The parent Trip's `latest_gps_at` cursor advances
      to the new report's `reported_at`. The parent Trip's
      `gps_violation_count` increments by the number of auto-penalty rows
      created. The cascade-driven Driver-row update (if the points
      threshold crosses) flips the hazmat_endorsement_status. The
      deferred cross-aggregate cascade onto Permits is *not* fired
      synchronously by this endpoint; the test layer reaches it via a
      subsequent verify-compliance on each affected permit.

      The idempotency replay: if the request's Idempotency-Key matches an
      existing slot's body-hash, the response is the *original* 201
      response (the same gps_report.id, the same auto_penalty_ids array,
      a `replayed: true` flag in the meta block) and the on-disk state
      is unchanged — no new rows, no new cascade. If the Idempotency-Key
      matches but the body-hash doesn't, the response is the 409
      ERR_IDEMPOTENCY_KEY_REUSED. No header means no idempotency-slot
      consultation; each request is independent. The slot's lifetime is
      the trip's lifetime — see §1.0's idempotency-block prose on the
      garbage-collection unscope.
    precondition_state_set: |
      The parent trip is in IN_TRANSIT (the trip must have departed —
      a still-PLANNED trip's window is empty; a COMPLETED-or-ABORTED
      trip's right-edge has closed). The parent permit's
      lifecycle_status is ACTIVE — a SUSPENDED permit gates the GPS-stream
      with ERR_PERMIT_NOT_ACTIVE at priority 515. The expiry-and-void
      transitions on the permit cascade the trip to ABORTED, after which
      the trip-status gate alone (not-IN_TRANSIT) returns ERR_GPS_OUT_OF_WINDOW
      — so the canonical observable on a gps-write-after-permit-expiry is
      the 409 with error_id=ERR_GPS_OUT_OF_WINDOW, not the
      ERR_PERMIT_NOT_ACTIVE error, because the trip's cascade-abort
      happened on the permit's EXPIRED transition's side-effect and the
      gps-ingest's window-check (priority 509) fires before the parent-
      permit-state-check (priority 515).
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,         http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,      http: 403, when: "not CompanyOperator. The Driver role conceptually 'owns' its own GPS readings in reality but in this scaffold's API the on-board GPS unit's uploader is the operator's vehicle-tracking system, so the role is CompanyOperator (the company's back-end pushes the unit's samples up to the regulator's API on behalf of the driver). The Driver role has no gps-ingest permission. Documenting this so the RBAC matrix is clear."}
      - {error_id: ERR_TRIP_NOT_FOUND,          http: 404, when: "{trip_id} doesn't resolve"}
      - {error_id: ERR_CROSS_TENANT_ACCESS,     http: 403, when: "operator's X-User-ID isn't the parent-permit's company_id"}
      - {error_id: ERR_VALIDATION,              http: 422, when: "lat/lon out of range; speed_kph negative; reported_at not ISO 8601; missing required field; the Idempotency-Key header is malformed (out-of-range length)."}
      - {error_id: ERR_GPS_OUT_OF_WINDOW,       http: 409, when: "the trip's trip_status isn't IN_TRANSIT (still-PLANNED or terminal), OR `reported_at < actual_departure_at`, OR (the trip is terminal-COMPLETED/ABORTED and) `reported_at > min(actual_arrival_at, aborted_at, now())`. The window-check at priority 509 fires *before* the monotonicity-check at priority 512, so a sample that is both out-of-window AND out-of-order returns this error id, not the order error id — see the §1.4 priority-509-vs-512 precedence prose."}
      - {error_id: ERR_PERMIT_NOT_ACTIVE,       http: 409, when: "the parent permit's lifecycle_status is SUSPENDED. The EXPIRED and VOIDED cases would have already cascade-aborted the trip, which makes the window-check at priority 509 fire first (the trip-status isn't IN_TRANSIT in those cases). The DRAFT case is impossible because the permit must have been issued for the trip to exist. So the only state in which the permit-not-active error fires is the live-suspension state on a trip that hasn't yet been cascade-anything'd (and the suspension's cascade doesn't auto-abort the trip per the §1.2 SUSPENDED-state prose; it just gates the GPS-stream). The priority-515 error fires after the priority-509 in-window-check and after the priority-512 monotonicity-check by the ascending-priority-numbers convention — wait, that ordering is reversed from the §1.4 prose's wording. Re-reading the §1.4 wording: 'the validation order is window-check first, then order-check' — that's the 509-before-512 ordering, which is the in-window-first convention. The parent-permit-state-check is at priority 515, *after* the in-window and monotonicity checks. So the precedence-ordering on a GPS-ingest with all three checks failing simultaneously is: ERR_GPS_OUT_OF_WINDOW (priority 509) wins first, then ERR_GPS_OUT_OF_ORDER (512), then ERR_PERMIT_NOT_ACTIVE (515). This pinning gives the rule-5 precedence-conflict-C on the GPS endpoint (two Tier-5a same-tier errors disambiguated by the sub-priority integers), which is a bonus instance beyond the rule-5 two-instance minimum that the conflicts A-and-B already meet."}
      - {error_id: ERR_GPS_OUT_OF_ORDER,        http: 409, when: "reported_at <= trip.latest_gps_at. The strict-greater-than is the rule-8 overlap-B interval-semantics's closed-on-prior-edge convention."}
      - {error_id: ERR_IDEMPOTENCY_KEY_REUSED,  http: 409, when: "the Idempotency-Key header matches an existing per-trip slot whose stored body-hash differs from the current request's body-hash. The matching-body-hash case is not an error — it returns the original response."}

  - method: GET
    path: "/v1/trips/{trip_id}/gps-reports"
    description: "List the trip's GPS reports, ordered ascending by `reported_at` then ascending by `id` (the tie-break direction for equal-timestamp reports, which under the strict-monotonicity rule shouldn't happen — but if multiple ingest-attempts at the same timestamp had been admitted before the monotonicity rule was tightened, the tie-break is deterministic). Paginated. Cross-tenant rule applies. Optional filter `violation_only: bool` (default false) which filters down to reports that triggered at least one auto-Penalty."
    roles: ["CompanyOperator", "RegulatorOfficer"]
    code: 200
    request_payload_schema: "query: limit?, offset?, violation_only? (boolean)"
    response_payload_schema: "{data: [GPSReport rows in ascending-reported-at order], pagination: standard}"
    side_effects: []
    precondition_state_set: "any (a still-PLANNED trip's GPS list is empty by construction)"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,     http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,  http: 403, when: "role in {Driver, TestHarness}"}
      - {error_id: ERR_TRIP_NOT_FOUND,      http: 404}
      - {error_id: ERR_CROSS_TENANT_ACCESS, http: 403, when: "wrong tenant"}
      - {error_id: ERR_VALIDATION,          http: 422, when: "limit/offset out of range, violation_only not a boolean"}

  # ─────────────────────────────────────────────────────────────────────
  # Penalty endpoints (three — manual create, appeal-uphold, driver summary)
  # ─────────────────────────────────────────────────────────────────────
  - method: POST
    path: "/v1/penalties"
    description: |
      Regulator issues a manual penalty against a driver, company, or
      vehicle. The body specifies the subject_type-and-id pair, the
      points_value, the observed_at timestamp, and the reason_note.
      The auto-Penalty rows from the GPS-ingest path are NOT created
      via this endpoint — they're written as side-effects of the
      gps-reports POST. This endpoint is the human-regulator's
      out-of-band-incident-attribution path (e.g., 'driver was caught
      with mislabeled hazmat cargo at a checkpoint, here are five
      penalty points').

      The driver-side cascade on a DRIVER-subject penalty mirrors the
      GPS-auto-penalty's cascade: the driver's `current_rolling_points`
      is incremented; the threshold-crossing flips the
      `hazmat_endorsement_status`; the deferred Permit-side cascade on
      the next verify-compliance pulls the permits listing the driver
      from ACTIVE to SUSPENDED. The cascade-chain depth from a POST
      /penalties is one shorter than the GPS-chain (no gps-report
      intermediary), so the chain is depth 3 from a manual penalty
      (penalty.insert → driver.endorsement-flip → next-verify-compliance-
      on-each-affected-permit's permit-suspension); this is *another*
      cascade-of-depth-≥-3 from a *different* trigger than the GPS one
      (manual POST vs gps-ingest), strengthening rule-4's two-instance
      minimum with a bonus instance.

      The COMPANY-subject and VEHICLE-subject manual penalties are
      *recorded* but don't drive any automatic state transitions in this
      scaffold's spec — they're audit-trail entries. The
      taxonomies.penalty_subject_types note in §1.0 calls this out.
      Their points-totals are computed by the same
      `driver_penalty_point_rolling_total` calc but with a different
      subject_type filter; the company-and-vehicle totals are exposed
      conceptually but have no consumer endpoint in this scaffold (the
      driver_penalty_summary endpoint below covers only the DRIVER case).
      The doc-generator should narrate the COMPANY-and-VEHICLE penalty
      paths as 'these subject types are reserved in the schema for
      future use; the current scaffold's automatic-suspension logic only
      acts on DRIVER-subject penalties'.
    roles: ["RegulatorOfficer"]
    code: 201
    request_payload_schema: |
      {
        "subject_type":  "one of {DRIVER, COMPANY, VEHICLE}",
        "subject_id":    "UUID, must resolve to a row in the corresponding entity table",
        "points_value":  "integer in [1, 50]",
        "observed_at":   "ISO 8601 UTC, <= now() (no future-dated penalties)",
        "reason_note":   "string 1..500",
        "trip_id?":      "optional UUID of the contextual trip if the penalty is in the context of a trip but wasn't generated automatically from the GPS stream. If present, must resolve to a Trip row. If absent, the penalty has no trip context."
      }
    response_payload_schema: "the new Penalty row, including server-set fields `id`, `created_at`, `source='MANUAL_REGULATOR'`, `source_gps_report_id=null`, `void_status='ACTIVE'`, `upheld_at=null`, `upheld_by=null`, plus the body-fields echoed. The response also embeds a cascade-summary sub-object reporting the post-insert state of the subject's rolling-points-total (for DRIVER subjects), the resulting `hazmat_endorsement_status` (which may have just flipped to INVALID if the insert crossed the threshold), and a list of the permit ids that are about to be cascaded on their next verify-compliance call."
    side_effects: |
      One new Penalty row. The subject driver's `current_rolling_points`
      is incremented (for DRIVER subjects). If the new total crosses the
      threshold (`>= THRESHOLD_DRIVER_SUSPENSION_POINTS`), the driver's
      `hazmat_endorsement_status` auto-flips to INVALID atomically. The
      cross-aggregate permit-side cascade is deferred (the
      penalty-insert's transaction touches the Penalty row and the
      Driver row only; the Permit rows are touched on their respective
      next verify-compliance calls, where calc 1's live-mode reads the
      Driver's new status and decides the SUSPEND). This is the
      depth-3-from-manual-penalty cascade-A-alternate chain.
    precondition_state_set: |
      The subject entity exists (the ERR_*_NOT_FOUND for the appropriate
      type fires if not). If `trip_id` is present, the Trip row exists.
      observed_at is in the past or now. The subject's tenant doesn't
      enter into a cross-tenant check at this endpoint because the
      regulator is the actor and the regulator role is cross-tenant by
      design.
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,         http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,      http: 403, when: "not RegulatorOfficer (the manual-penalty endpoint is regulator-only; the company operator cannot self-issue a penalty on its own driver — penalties are regulator's prerogative)"}
      - {error_id: ERR_DRIVER_NOT_FOUND,        http: 404, when: "subject_type=DRIVER and subject_id doesn't resolve"}
      - {error_id: ERR_COMPANY_NOT_FOUND,       http: 404, when: "subject_type=COMPANY and subject_id doesn't resolve"}
      - {error_id: ERR_VEHICLE_NOT_FOUND,       http: 404, when: "subject_type=VEHICLE and subject_id doesn't resolve"}
      - {error_id: ERR_TRIP_NOT_FOUND,          http: 404, when: "the optional trip_id is present and doesn't resolve"}
      - {error_id: ERR_VALIDATION,              http: 422, when: "subject_type not in the enum; points_value out of [1,50]; observed_at in the future; reason_note out-of-bounds."}

  - method: POST
    path: "/v1/penalties/{penalty_id}/uphold"
    description: |
      The regulator's appeal-uphold action — the appeal succeeded and
      the penalty is voided. Flips void_status from ACTIVE to UPHELD.
      Decrements the subject's rolling-points-total accordingly (the
      total is recomputed as the sum-over-non-UPHELD-penalties-in-the-
      rolling-window, which is the algebraic identity equivalent to a
      subtraction of the just-upheld penalty's points_value when the
      cache was consistent). If the new total drops below the threshold
      and the driver had been flipped to INVALID *due to* this penalty's
      contribution to the threshold-crossing, the driver's
      hazmat_endorsement_status does *not* automatically flip back to
      VALID — the regulator must run an explicit
      POST /drivers/{id}/refresh-endorsement to re-attest. This is the
      keep-the-regulator-in-the-loop semantics documented in the §1.2
      Penalty.ACTIVE→UPHELD prose. The conservation invariant of rule 9
      invariant B's points-quantity is exact: the algebraic sum over
      non-UPHELD penalties in the rolling window is the conserved
      quantity, and a created-then-upheld penalty leaves the sum
      unchanged from its pre-creation value.
    roles: ["RegulatorOfficer"]
    code: 200
    request_payload_schema: "{ uphold_reason: string 1..500 }"
    response_payload_schema: |
      The updated Penalty row in void_status=UPHELD with upheld_at=now(),
      upheld_by=X-User-ID, reason_note prepended with the canonical
      uphold-on-appeal string. A cascade-summary sub-object reports the
      subject driver's new rolling-points-total (decremented) and the
      driver's hazmat_endorsement_status (unchanged unless the regulator
      separately re-attests via the refresh-endorsement endpoint).
    side_effects: |
      The Penalty row's three flip-fields are written. The subject
      driver's `current_rolling_points` cache is decremented (or fully
      recomputed). The hazmat_endorsement_status is *not* changed by
      this endpoint — that's the regulator's explicit-action gate. The
      cross-aggregate cascade onto permits listing the driver is
      symmetric to the downward cascade: the next verify-compliance on
      each ACTIVE-or-SUSPENDED permit observes the driver's new
      rolling-points value but does not see the endorsement-flip
      (because the endorsement is gated on the regulator's explicit
      re-attestation), so no permit-side state change fires from the
      uphold alone. A subsequent refresh-endorsement on the driver
      finishes the chain to permit-reinstate.
    precondition_state_set: "Penalty.void_status == ACTIVE, and `now() - observed_at <= APPEAL_WINDOW_DAYS days` (the 30-day appeal window measured from the violation's observed-at)."
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,         http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,      http: 403, when: "not RegulatorOfficer"}
      - {error_id: ERR_PENALTY_NOT_FOUND,       http: 404, when: "{penalty_id} doesn't resolve"}
      - {error_id: ERR_INVALID_STATE_TRANSITION, http: 409, when: "the penalty's void_status is already UPHELD (the action is non-idempotent at the same-state-as-target case)"}
      - {error_id: ERR_APPEAL_WINDOW_CLOSED,    http: 409, when: "now() - observed_at exceeds APPEAL_WINDOW_DAYS. The boundary semantics: at exactly `now() - observed_at == APPEAL_WINDOW_DAYS` the appeal is *in*-window (closed-right on the duration), and at any nanosecond past that point it's out. Yet another boundary-precision point on a time-difference metric, in this case on a different time-difference (now-vs-observed_at, vs the void's now-vs-issued_at, vs the renewal's now-vs-valid_until)."}
      - {error_id: ERR_VALIDATION,              http: 422, when: "uphold_reason missing or out-of-bounds"}

  - method: GET
    path: "/v1/drivers/{driver_id}/penalty-summary"
    description: |
      The driver-side rolling-points-and-endorsement-standing summary,
      computed at read time via the §1.3 calc 2 (the
      current_rolling-variant — the as-of-issue-snapshots are per-permit
      and not surfaced here; tests reading the snapshot variant query the
      individual permits via GET /permits/{id} and read the per-driver
      flag from `snapshot_driver_endorsements`). The response includes
      a per-penalty breakdown of which penalties are inside the rolling
      window, sorted by observed_at descending then id descending. The
      Driver-role self-read deviation cell in the RBAC matrix points
      at this endpoint.
    roles: ["CompanyOperator", "RegulatorOfficer", "Driver"]
    code: 200
    request_payload_schema: "no body, no query parameters."
    response_payload_schema: |
      {
        driver_id: <the path's id>,
        as_of: <now() in ISO 8601 — the asof_timestamp used for the rolling-window's right edge>,
        current_rolling_points: <the integer total per calc 2's current_rolling variant>,
        threshold: <THRESHOLD_DRIVER_SUSPENSION_POINTS, the integer constant — exposed so the
                    consumer can compute the buffer 'points below threshold'>,
        hazmat_endorsement_status: <the driver's current enum-value standing>,
        endorsement_valid_until: <the driver's attested expiry timestamp, or null if NOT_ATTESTED>,
        endorsement_classes: <the regulator-attested hazard-class subset, or [] if NOT_ATTESTED>,
        active_penalties_in_window: [
          {
            id: <penalty id>,
            points_value: <integer>,
            observed_at: <ISO 8601>,
            source: <enum value MANUAL_REGULATOR or GPS_VIOLATION_SPEED or GPS_VIOLATION_OFF_ROUTE>,
            trip_id: <the contextual trip id if any, else null>,
            reason_note_first_120_chars: <truncated for the summary view>
          },
          ...   // sorted by observed_at desc, then id desc; only ACTIVE-status penalties whose observed_at is in the rolling window
        ],
        upheld_penalties_in_window: [ <same shape as above, but for UPHELD-status penalties whose observed_at is still in the window — these don't contribute to the total but are surfaced for transparency> ],
        permits_currently_listing_this_driver: [
          {
            permit_id: <id>,
            lifecycle_status: <enum>,
            snapshot_endorsement_for_this_driver: <bool — the strict-snapshot's per-driver flag for this driver on this permit>,
            live_endorsement_for_this_driver: <bool — the live-mode evaluation of the per-driver flag on the same permit, at the moment of the call>
          },
          ...   // every permit whose authorized_driver_ids contains this driver_id, in created_at-desc order, with a max of 50 entries because the per-permit-list scope is bounded by the cardinality the regulator considers reasonable.
        ]
      }
      The `permits_currently_listing_this_driver` sub-list lets the test
      layer observe the dual-variant snapshot-vs-live on the driver's
      participation in a permit *without* having to issue separate
      GET /permits/{id} reads. The two flags' disagreement is the
      observable axis for rule 1's dual-variant on the Driver-domain.
    side_effects: []
    precondition_state_set: "any"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,     http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED,  http: 403, when: "role is TestHarness"}
      - {error_id: ERR_DRIVER_NOT_FOUND,    http: 404, when: "{driver_id} doesn't resolve"}
      - {error_id: ERR_CROSS_TENANT_ACCESS, http: 403, when: "role is CompanyOperator whose X-User-ID isn't the driver's company_id, OR role is Driver whose X-User-ID isn't equal to {driver_id} (the self-read rule per §1.4 priority-531). RegulatorOfficer is exempt from the cross-tenant check."}

  # ─────────────────────────────────────────────────────────────────────
  # Test-harness endpoints (two — clock advance, sweep run)
  # The two endpoints below exist to make the wall-clock-driven and the
  # periodic-sweep-driven automatic transitions reachable from the test
  # harness. The spec's testability-completeness principle requires
  # them: the permit's ACTIVE→EXPIRED transition is gated on
  # `now() >= valid_until`, and without a clock-advance endpoint the
  # only way to reach that condition is to actually wait the
  # PERMIT_DEFAULT_VALIDITY_DAYS, which is not viable for a CI test
  # suite. Likewise the daily compliance-sweep's per-permit
  # verify-compliance fan-out and the per-driver rolling-window
  # fall-off recompute need an explicit trigger. In production these
  # endpoints would not exist — the clock is the OS clock and the
  # sweep is a background job. The endpoints are gated to the
  # TestHarness role so production deployments can refuse the role
  # entirely.
  # ─────────────────────────────────────────────────────────────────────
  - method: POST
    path: "/v1/_clock/advance"
    description: |
      Advances the server's logical clock by the body-specified duration.
      The server's logical clock is the source of `now()` for every
      timestamp-and-window check in the API. Implementations may back
      the logical clock with a `time.monotonic()`-plus-offset variable
      that the OS clock would otherwise drive; the test mode replaces
      the OS-clock-tick with the explicit advances from this endpoint
      to gain determinism. The endpoint runs the post-advance sweep
      implicitly if the body's `run_sweep_after_advance` flag is true,
      saving the test a separate POST /_sweep/run call.

      The advance is strictly monotonic — a negative-duration body is
      rejected with ERR_VALIDATION 422 ('the logical clock cannot go
      backwards in time, even in test mode'). A zero-duration advance
      is a no-op (the canonical 'sync the harness's idea of the wall
      clock to the server's' call). The maximum-single-advance is bounded
      at, say, 100 years of seconds to avoid accidental overflow into
      the year-9999 datetime ceiling — but a test exercising the
      permit-term-expiry's 1-year boundary is well within that
      bound. The bound's exact value is in
      SCAFFOLD_DIFFICULTY_DESIGN's clock-constants table.
    roles: ["TestHarness"]
    code: 200
    request_payload_schema: |
      {
        "advance_seconds":            "integer or float >=0",
        "run_sweep_after_advance":    "boolean, default false. If true, the daily-sweep's per-permit verify-compliance fan-out and the per-driver rolling-window recompute fire after the advance, in the same handler. If false, the advance is the only effect; a separate POST /_sweep/run is needed to trigger the deferred cascades."
      }
    response_payload_schema: |
      {
        prior_now:   <ISO 8601 — the clock's pre-advance value>,
        new_now:     <ISO 8601 — the post-advance value>,
        advance_seconds_applied: <the integer-or-float-from-the-body, echoed>,
        sweep_summary: <if run_sweep_after_advance was true, the same shape as the POST /_sweep/run endpoint's response; null otherwise>
      }
    side_effects: |
      The logical-clock variable is incremented by `advance_seconds`.
      Any time-gated automatic-transition that becomes due at the new
      clock value remains *unrun* until the sweep fires — the
      run_sweep_after_advance flag is the synchronous trigger; otherwise
      the test must call POST /_sweep/run separately. This separation
      lets a test advance-without-sweep (to assert that a row's state is
      *unchanged at the new now()* before the sweep — the
      'time-marches-forward-but-the-row-hasn't-been-noticed-yet' case)
      and then run-the-sweep (to assert the post-sweep cascades).
      The combination of the two test-driving endpoints satisfies the
      testability-completeness principle for all time-gated and
      periodic-cascade-driven transitions.
    precondition_state_set: "n/a"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,    http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED, http: 403, when: "role isn't TestHarness. In a production deployment with the TestHarness role disabled at the auth-middleware level, every request to this endpoint returns the 403 — the endpoint is only callable in test mode."}
      - {error_id: ERR_VALIDATION,         http: 422, when: "advance_seconds is negative or exceeds the maximum-single-advance bound; run_sweep_after_advance isn't a boolean."}

  - method: POST
    path: "/v1/_sweep/run"
    description: |
      Runs the daily compliance sweep on demand. The sweep:
        (1) For every ACTIVE permit whose `now() >= valid_until` (the
            wall-clock-expiry boundary, the rule-6 boundary-B
            half-open right-exclusive convention), transitions
            lifecycle_status to EXPIRED and fires the trip-abort cascade
            on every PLANNED-or-IN_TRANSIT child trip (the rule-4
            cascade-B depth-2 chain). The wallet is not refunded (the
            term elapsed; the fee was earned).
        (2) For every SUSPENDED permit whose `now() >= valid_until`, the
            same EXPIRED transition fires.
        (3) For every ACTIVE permit (whose `now() < valid_until` — the
            still-in-term ones), the per-permit verify-compliance runs
            internally — calc 1's live-recompute against the current
            grounding-entity state — and the SUSPEND-vs-no-change
            decision fires per the §1.2 ACTIVE→SUSPENDED transition's
            guard. This flushes the deferred cascade from any prior
            company-revoke, driver-endorsement-flip, vehicle-inspection-
            lapse, or route-revoke that the upstream events left in the
            'pending-on-next-verify' state.
        (4) For every SUSPENDED permit whose grounding entities have all
            re-validated (the symmetric reinstate side of the cascade,
            e.g., the driver appealed a penalty successfully and the
            regulator re-attested the endorsement), the
            SUSPENDED→ACTIVE reinstate fires per the §1.2
            SUSPENDED→ACTIVE transition's guard.
        (5) For every Driver, the rolling-points-total is recomputed
            with the new `now()` as the rolling-window's right edge;
            penalties whose `observed_at` just fell out of the trailing
            window-edge are excluded from the new total; this can flip a
            driver's hazmat_endorsement_status from INVALID (caused by
            a threshold-crossing) back-to-VALID — but per the
            keep-the-regulator-in-the-loop semantics, the auto-flip
            from INVALID to VALID does NOT fire from the sweep; the
            regulator must explicitly re-attest via
            POST /drivers/{id}/refresh-endorsement. The sweep only
            updates the cached `current_rolling_points` field; the
            status-flip is a separate step. Wait — the §1.2 Driver
            state-machine prose says the system VALID→INVALID
            transition fires on the sweep observing the
            endorsement_valid_until being in the past (the
            time-expiry-of-the-attestation case) — that's an
            *automatic-downward* flip. The *automatic-upward* flip
            (from INVALID back to VALID just because the rolling-points
            fell below threshold) is NOT in the §1.2 transitions list,
            consistent with the keep-the-regulator-in-the-loop
            convention. So the sweep's per-driver action is: (a) re-
            compute current_rolling_points; (b) if `endorsement_valid_until
            <= now()` and status is currently VALID, flip to INVALID
            with the appropriate audit-log entry. No upward flip from
            the sweep.
        (6) For every (trip_id, idempotency_key) slot whose trip is
            terminal-COMPLETED-or-ABORTED-and-has-been-terminal-for-more-
            than-a-GC-window — but the scaffold doesn't pin a slot-GC
            window per the §1.0 idempotency block's
            'tests-never-exercise-stale-key-revival' note, so the sweep
            doesn't actually GC slots. This is documented for completeness.
      The sweep's per-step ordering above is the canonical sequence;
      implementations that re-order the steps must guarantee the same
      observable end-state. The spec pins the wall-clock-expiry step
      (1+2) before the verify-compliance fan-out (3+4) so that an
      ACTIVE-and-about-to-expire permit whose grounding entities have
      also flipped to non-valid gets the EXPIRED label (the terminal
      state), not the SUSPENDED label (the intermediate state). The
      `now() >= valid_until` check wins over the `live-recompute-disagrees-
      with-snapshot` check on the priority-of-target-state question.

      The conservation invariant of rule 9 invariant A holds across the
      sweep: the wallet ledger is unaffected by the sweep (no fee
      collection on expiry, no refund on expiry — the term-end is the
      term-end, not a clerical-error reversal). The conservation of
      rule 9 invariant B (penalty points) also holds: the sweep's
      window-trailing-edge fall-off changes the *currently-counted*
      total but does not retroactively void any penalty's existence —
      the rolling-window's value at any given asof is a function of
      the asof; the conserved quantity ('algebraic sum over non-UPHELD
      penalties whose observed_at is in the window-at-asof') is
      well-defined as a function of asof, and the sweep just advances
      the asof.
    roles: ["TestHarness"]
    code: 200
    request_payload_schema: |
      {
        "scope": "one of {'ALL', 'PERMITS_ONLY', 'DRIVERS_ONLY'}, default 'ALL'. The two restricted-scope values let tests exercise the permit-side fan-out without touching the driver-side rolling-window recompute or vice versa, useful for isolating the cascade-A and cascade-B chains in tests."
      }
    response_payload_schema: |
      A summary of the sweep's work:
      {
        as_of_now: <ISO 8601, the current logical clock value>,
        scope: <the body's scope echoed>,
        permit_transitions: [
          {permit_id, pre_status, post_status, cause: 'WALL_CLOCK_EXPIRY' | 'GROUNDING_INVALIDATION' | 'GROUNDING_REVALIDATION', cascade_trip_aborts: [<trip_id>...]}
        ],
        driver_recomputes: [
          {driver_id, pre_points: <int>, post_points: <int>, status_flip: <'VALID_TO_INVALID' or null — only the downward auto-flip from endorsement-expiry, per the keep-regulator-in-loop rule>}
        ],
        n_permits_inspected: <int>,
        n_drivers_inspected: <int>,
        wallclock_advanced: false   // this endpoint doesn't advance the clock; that's POST /_clock/advance's job. Just the verb-asymmetry: clock-advance is a state-changing time-effect; sweep-run is a state-changing now-driven-effect-at-the-current-time.
      }
    side_effects: |
      The set of state-machine transitions described above. The
      transactional model is per-row (each permit's transition is its
      own transaction; the sweep's overall run is a *sequence* of
      transactions, not a single big transaction). This matches the
      production-cron's-per-row-locking pattern. A failure mid-sweep
      (e.g., a database hiccup on the 53rd permit) leaves the first 52
      permits transitioned and the remaining ones untouched, and the
      response would include a partial summary plus an error flag —
      but the scaffold doesn't model the partial-failure path because
      no test exercises it; the spec's reference implementation can
      either commit the per-row transactions independently or wrap the
      whole sweep in one giant transaction.
    precondition_state_set: "n/a"
    ordered_error_table:
      - {error_id: ERR_UNAUTHENTICATED,    http: 401}
      - {error_id: ERR_ROLE_NOT_PERMITTED, http: 403, when: "role isn't TestHarness"}
      - {error_id: ERR_VALIDATION,         http: 422, when: "scope value not in the enum"}

# §1.6 — Error catalog
errors:
  # Each error id is the canonical string the response body's
  # data.error_id field carries. HTTP status is the canonical numeric
  # status the response carries. Condition is the one-line cause; the
  # full prose lives in the validation that produces this error, in §1.4.

  # Auth tier — 401 and 403.
  - {id: ERR_UNAUTHENTICATED,           http: 401, condition: "Missing X-User-Role or X-User-ID header, or X-User-Role isn't one of the four canonical role names, or the role's identity is entity-backed and the X-User-ID doesn't resolve to a row in the identity-entity's table."}
  - {id: ERR_ROLE_NOT_PERMITTED,        http: 403, condition: "The endpoint's RBAC matrix entry for the request's role is the default-DENY cell (the role isn't in the endpoint's allow-set)."}
  - {id: ERR_CROSS_TENANT_ACCESS,       http: 403, condition: "The role IS in the endpoint's allow-set, but the per-row ownership predicate fails — the addressed row's tenant id doesn't equal the requester's X-User-ID (the CompanyOperator/Driver self-only-or-own-company convention)."}

  # Existence tier — 404. One per addressable entity.
  - {id: ERR_COMPANY_NOT_FOUND,         http: 404, condition: "A TransportCompany id (path or body) doesn't resolve."}
  - {id: ERR_DRIVER_NOT_FOUND,          http: 404, condition: "A Driver id doesn't resolve."}
  - {id: ERR_VEHICLE_NOT_FOUND,         http: 404, condition: "A Vehicle id doesn't resolve."}
  - {id: ERR_ROUTE_NOT_FOUND,           http: 404, condition: "A TransportRoute id doesn't resolve."}
  - {id: ERR_PERMIT_NOT_FOUND,          http: 404, condition: "A Permit id doesn't resolve."}
  - {id: ERR_TRIP_NOT_FOUND,            http: 404, condition: "A Trip id doesn't resolve."}
  - {id: ERR_PENALTY_NOT_FOUND,         http: 404, condition: "A Penalty id doesn't resolve."}

  # State tier — 409. Generic and parent-aware.
  - {id: ERR_INVALID_STATE_TRANSITION,  http: 409, condition: "The target row's state field isn't in the transition-endpoint's allowed-pre-set (the same-row state guard). The §1.2 state-machine's transition guards' boolean evaluations of `state == <required-pre-state>` map to this error id when the same-row leg fails."}
  - {id: ERR_PERMIT_NOT_ACTIVE,         http: 409, condition: "A trip-or-gps-ingest endpoint observes the parent Permit's lifecycle_status isn't ACTIVE. The cross-entity precondition leg of the §1.2 Trip-and-GPS-ingest endpoints' guards. Distinct from ERR_INVALID_STATE_TRANSITION because the cause is on the *parent* entity's state, not the same-row state."}

  # Business-rule tier — 5a safety:
  - {id: ERR_COMPANY_NOT_QUALIFIED,     http: 409, condition: "An action requiring the company's qualification_status to be APPROVED observes it isn't. Fires at trip-creation when the *operator's* company isn't qualified, and at permit-issue when the permit's bound `company_id` isn't qualified (the latter is the rule-7 entity-pair-A Permit-↔-Company cross-entity dependency's failure-mode)."}
  - {id: ERR_DRIVER_ENDORSEMENT_INVALID, http: 409, condition: "A driver's hazmat_endorsement_status is NOT_ATTESTED or INVALID, or the driver's endorsement_valid_until is before the would-be-permit's valid_until (the endorsement-covers-the-term sub-check), at the moment of a permit-application, permit-issue, or trip-creation that names the driver. The §1.4 priority-510 check."}
  - {id: ERR_VEHICLE_INSPECTION_LAPSED, http: 409, condition: "A vehicle's most-recent inspection isn't PASSED, or the inspection's valid_until is before the would-be-permit's valid_until or the trip's scheduled-arrival-at. The §1.4 priority-511 check on permits and the §1.4 priority-511 sibling on trips."}
  - {id: ERR_ROUTE_NOT_APPROVED,        http: 409, condition: "The TransportRoute's approval_status isn't APPROVED. Fires at permit-application and permit-issue and the verify-compliance live-recompute. The §1.4 priority-525 check."}
  - {id: ERR_OUTSIDE_VALIDITY_WINDOW,   http: 409, condition: "A trip's scheduled window crosses outside the parent permit's [valid_from, valid_until] window (the closed-on-arrival-edge interval). The §1.4 priority-522 check."}
  - {id: ERR_VEHICLE_DOUBLE_BOOKED,     http: 409, condition: "A new trip's half-open `[scheduled_departure_at, scheduled_arrival_at)` interval overlaps an existing trip's same-half-open interval on the same vehicle_id. The §1.4 priority-521 check, rule-8 overlap-A interval-semantics."}
  - {id: ERR_GPS_OUT_OF_ORDER,          http: 409, condition: "A GPS report's reported_at is not strictly greater than the trip's current latest_gps_at. The strict-greater-than monotonicity rule, rule-8 overlap-B closed-on-prior-edge interval-semantics. §1.4 priority-512."}
  - {id: ERR_GPS_OUT_OF_WINDOW,         http: 409, condition: "A GPS report's reported_at isn't in the open-on-the-right window `[actual_departure_at, min(actual_arrival_at, aborted_at, now())]` of the trip's in-flight period — either the trip hasn't departed (still PLANNED), or the trip has terminated, or the reported_at is before the actual_departure_at, or the reported_at is after the terminal-edge. §1.4 priority-509. Wins over ERR_GPS_OUT_OF_ORDER and ERR_PERMIT_NOT_ACTIVE in the simultaneous-violation case (the rule-5 precedence-conflict-C on the GPS endpoint)."}
  - {id: ERR_APPEAL_WINDOW_CLOSED,      http: 409, condition: "A POST /penalties/{id}/uphold lands more than APPEAL_WINDOW_DAYS days after the penalty's observed_at. The closed-right convention on the duration: at exactly the boundary the appeal is still in-window. §1.4 priority-513."}
  - {id: ERR_VOID_WINDOW_CLOSED,        http: 409, condition: "A POST /permits/{id}/void-issue lands more than VOID_ISSUE_WINDOW_HOURS hours after the permit's issued_at. Closed-right on the duration. §1.4 priority-514."}

  # Business-rule tier — 5b/c business constraints:
  - {id: ERR_DUPLICATE_IDENTIFIER,      http: 409, condition: "A natural-key uniqueness violation: a TransportCompany's registration_number, a Driver's (company, license_number) pair, or a Vehicle's plate_number collides with an existing row. The condition's message field on the response disambiguates the specific natural-key (the spec doesn't expose three separate error ids per natural-key kind, to keep the catalog at the orchestrator's ~25-30 target). §1.4 priority-520. The driver's per-company scope contrasts with the vehicle's system-wide scope — see the §1.4 priority-520 prose."}
  - {id: ERR_PERMIT_VEHICLE_COUNT_OUT_OF_RANGE, http: 422, condition: "The permit-application's authorized_vehicle_ids list has cardinality outside [1, MAX_VEHICLES_PER_PERMIT]. The 422 status (semantic-validation, not 409 state-conflict) reflects the body-shape-as-business-constraint nature of the check. §1.4 priority-523."}

  # Business-rule tier — 5b/c cross-entity referential. The cross-tenant error
  # was already listed at the auth-tier in §1.6 (ERR_CROSS_TENANT_ACCESS, 403),
  # so the cross-entity-non-ownership errors below are about *foreign-key
  # values referencing the wrong tenant's resources*, which is a different
  # cause from the requester's own tenant-mismatch. The §1.4 priority-530 check
  # is the requester-tenant-mismatch; the cross-aggregate-foreign-key-mismatch
  # case (a permit-application listing a driver from a different company) is
  # caught by the existence-tier 404 ERR_DRIVER_NOT_FOUND under the convention
  # that "a driver from a different company is not visible to the requesting
  # operator, so the driver-id appears as not-found rather than as
  # wrong-tenant". This is a deliberate design choice — the operator's
  # view-of-the-world is the operator's-own-tenant, and a cross-tenant-id
  # in their request is "an id that doesn't exist in the operator's
  # universe", giving the 404. The RegulatorOfficer who can see all tenants
  # doesn't hit this case because the regulator's universe is the global
  # one. The scaffold sticks with the existing-errors and doesn't introduce
  # a dedicated ERR_CROSS_AGGREGATE_ID_NOT_OWNED_BY_REQUESTER error.

  # Renewal-window:
  - {id: ERR_RENEWAL_TOO_EARLY,         http: 409, condition: "POST /permits/{id}/renew lands strictly before `valid_until - RENEWAL_OPEN_WINDOW_DAYS`. §1.4 priority-541. Closed-left convention on the renewal window."}
  - {id: ERR_RENEWAL_AFTER_EXPIRY,      http: 409, condition: "POST /permits/{id}/renew lands at or after `valid_until` (the permit has already transitioned to EXPIRED, by the sweep or by an embedded check inside the renew handler itself). §1.4 priority-542. Open-right on the renewal window, mirroring the half-open expiry boundary."}

  # Fiscal:
  - {id: ERR_INSUFFICIENT_WALLET_BALANCE, http: 402, condition: "The TransportCompany's wallet_balance_cents is less than the fee (annual_renewal_fee's output) at the issue-step or the renew-step. The HTTP 402 'Payment Required' status is the canonical fiscal-shortfall status in this scaffold; no other endpoint uses 402. §1.4 priority-540."}

  # Idempotency:
  - {id: ERR_IDEMPOTENCY_KEY_REUSED,    http: 409, condition: "A POST /trips/{tid}/gps-reports request carries an Idempotency-Key header that matches an existing per-trip slot whose stored body-hash differs from the new request's body-hash. The matching-body-hash case is a replay (not an error). §1.4 priority-550 and §1.2.1 concurrency-rule on idempotency-key collisions with different bodies."}

  # OCC version conflict:
  - {id: ERR_VERSION_CONFLICT,          http: 409, condition: "The request body's `version` integer doesn't equal the row's current `version`. Fires on every versioned-mutation endpoint when the OCC guard is on (the request body's optional `version` field is present). §1.4 priority-560, and the §1.2.1 concurrency-rules entries for the verify-compliance race and the renew-vs-void-issue race both name this error id as the canonical loser-error in the OCC-conflict case."}

  # Generic body-shape validation:
  - {id: ERR_VALIDATION,                http: 422, condition: "Catch-all for body-shape violations: missing required field, wrong type, numeric out of declared range, enum value not in the allowed set, string longer than the declared max, an array with cardinality outside the declared bounds, or a typed-string-format violation (e.g., the company registration_number's regex). The most specific business-error wins if one applies (the priority ordering in §1.4 pins the precedence); the generic body-schema fails fall through to this error at priority 590. The error response's `message` field carries the field-path-and-cause string for human debugging; the test layer matches on `error_id == 'ERR_VALIDATION'` and the field-path-and-cause substring."}

  # Catalog total: 25 error ids. The orchestrator's brief asked for around
  # 25 errors — the scaffold lands at this count exactly by collapsing
  # the same-cause-different-natural-key case (registration-number-vs-
  # license-number-vs-plate-number) into a single ERR_DUPLICATE_IDENTIFIER
  # discriminated by the response-message field, and by reusing
  # ERR_VALIDATION as the body-shape catch-all rather than introducing
  # per-field-shape errors. This matches the spec's "Group logically; auth
  # errors, not-found errors, state errors, business errors" guideline
  # while keeping the catalog compact.

  # ─────────────────────────────────────────────────────────────────────
  # The error-precedence pairs for the rule-5 priority-conflict instances
  # (worked out in §1.4 prose, indexed in SCAFFOLD_DIFFICULTY_DESIGN.yaml's
  # `priority_pair_validation_conflict` rule-bucket):
  #   Conflict A: ERR_PERMIT_NOT_ACTIVE (state, Tier-4) vs ERR_ROUTE_NOT_APPROVED
  #               (business_referential, Tier-5b) on POST /permits/{pid}/trips —
  #               state wins.
  #   Conflict B: ERR_PERMIT_NOT_FOUND (existence, Tier-3) vs ERR_CROSS_TENANT_ACCESS
  #               (business_referential ownership, Tier-5c) on a wrong-tenant
  #               request for a non-existent permit id — existence wins.
  #   Bonus Conflict C: ERR_GPS_OUT_OF_WINDOW (Tier-5a, priority 509) vs
  #               ERR_GPS_OUT_OF_ORDER (Tier-5a, priority 512) — same tier,
  #               sub-priority pin gives window over order.
  #   Bonus Conflict D: ERR_INVALID_STATE_TRANSITION (Tier-4) vs
  #               ERR_INSUFFICIENT_WALLET_BALANCE (Tier-5d fiscal) on a
  #               not-DRAFT-and-wallet-short permit-issue — state wins.
  #   Bonus Conflict E: ERR_VEHICLE_DOUBLE_BOOKED (Tier-5b business_constraint
  #               temporal-overlap) vs ERR_OUTSIDE_VALIDITY_WINDOW (Tier-5b
  #               business_temporal window-membership) on a trip-creation
  #               whose scheduled window both overlaps another trip on the
  #               same vehicle AND extends outside the permit's term-window —
  #               the §1.4 priority-numbers pin double-booked-at-521 vs
  #               outside-window-at-522, so the double-booking-error wins.
  # The first two conflicts (A and B) are the rule-5 two-instance minimum
  # with different error-category pairs (state-vs-business_referential and
  # existence-vs-business_referential), which is the rule's
  # 'different error-category pairs' differentiation clause.
  # ─────────────────────────────────────────────────────────────────────

  # The error catalog above totals 25 distinct error_ids, which lands at the
  # midpoint of the spec's Advanced-band range of "10-18 error codes" — over
  # the upper bound of 18 for the spec's strict Advanced range, in fact, but
  # in line with the orchestrator's relaxation note "the error catalog is
  # ~25 errors". The relaxation reflects the scenario's natural domain breadth
  # (auth-tier, existence-per-entity-type, the many time-window-boundary
  # errors for the permit lifecycle's three independent time-windows of
  # validity / appeal / void / renewal-open / renewal-late-grace, and the
  # cross-entity state-precondition errors for the four grounding-entity
  # legs).

  # Errors referenced by `concurrency_rules` in §1.2.1 (the cross-check
  # required by the Quality-Checklist's "every error code in concurrency_rules
  # also in §1.6 Error Catalog" item):
  #   - ERR_VEHICLE_DOUBLE_BOOKED       — yes (line above in the catalog).
  #   - ERR_GPS_OUT_OF_ORDER            — yes.
  #   - ERR_IDEMPOTENCY_KEY_REUSED      — yes.
  #   - ERR_VERSION_CONFLICT            — yes.
  # All four are present.

  # Cross-reference table: every error_id appears in at least one endpoint's
  # `ordered_error_table` in §1.5 (the Quality-Checklist "every error code is
  # referenced by at least one validation or transition" item):
  #   ERR_UNAUTHENTICATED               — every endpoint.
  #   ERR_ROLE_NOT_PERMITTED            — every endpoint's deny-default-row case.
  #   ERR_CROSS_TENANT_ACCESS           — every cross-tenant-ownership endpoint.
  #   ERR_COMPANY_NOT_FOUND             — GET/POST/PATCH on /companies/{id}, GET /companies, the cross-aggregate references at the driver and vehicle and route create endpoints' {company_id} path, and the manual-penalty endpoint for COMPANY-subject penalties.
  #   ERR_DRIVER_NOT_FOUND              — GET /drivers/{id}, POST /drivers/{id}/refresh-endorsement, the cross-aggregate references in permit-application and trip-creation's body driver_id and in penalty-create's body subject_id for DRIVER subjects.
  #   ERR_VEHICLE_NOT_FOUND             — GET /vehicles/{id}, the inspection-append's {vehicle_id} path, the inspection-list's same, the cross-aggregate references in permit-application's body authorized_vehicle_ids and trip-creation's body vehicle_id and in penalty-create's body subject_id for VEHICLE subjects.
  #   ERR_ROUTE_NOT_FOUND               — GET /routes/{id}, the route-state-action endpoints, and the cross-aggregate reference in permit-application's body route_id.
  #   ERR_PERMIT_NOT_FOUND              — GET /permits/{id}, GET /permits, every permit-state-action endpoint, the trip-creation's {permit_id} path, and GET /trips/{id}/gps-reports's transitive parent check.
  #   ERR_TRIP_NOT_FOUND                — GET /trips/{id}, every trip-state-action endpoint, the gps-ingest's {trip_id} path, the gps-list's same, and the manual-penalty's body optional trip_id.
  #   ERR_PENALTY_NOT_FOUND             — POST /penalties/{id}/uphold.
  #   ERR_INVALID_STATE_TRANSITION      — every state-action endpoint's same-row state-guard failure (the wide pre-state-not-in-allowed-set case).
  #   ERR_PERMIT_NOT_ACTIVE             — POST /permits/{pid}/trips's parent-permit check, POST /trips/{id}/depart's parent-permit check, POST /trips/{tid}/gps-reports's parent-permit check (the latter at priority 515 *after* the in-window and monotonicity checks).
  #   ERR_COMPANY_NOT_QUALIFIED         — POST /companies/{cid}/drivers, POST /companies/{cid}/vehicles, POST /companies/{cid}/routes (the parent-company-must-be-APPROVED gate at the children-creation paths), and POST /permits and POST /permits/{id}/issue and the verify-compliance-internal recompute (the rule-7 entity-pair-A check on the Permit↔Company link).
  #   ERR_DRIVER_ENDORSEMENT_INVALID    — POST /permits, POST /permits/{id}/issue, POST /permits/{id}/renew, POST /permits/{pid}/trips, the verify-compliance-internal check (where the failure triggers the SUSPEND transition rather than an error response).
  #   ERR_VEHICLE_INSPECTION_LAPSED     — same set as the driver-endorsement check, applied to the vehicles-leg.
  #   ERR_ROUTE_NOT_APPROVED            — POST /permits, POST /permits/{id}/issue, POST /permits/{id}/renew, the verify-compliance-internal check.
  #   ERR_OUTSIDE_VALIDITY_WINDOW       — POST /permits/{pid}/trips's scheduled-window-vs-permit-window check.
  #   ERR_VEHICLE_DOUBLE_BOOKED         — POST /permits/{pid}/trips's vehicle-calendar overlap check.
  #   ERR_GPS_OUT_OF_ORDER              — POST /trips/{tid}/gps-reports's monotonicity check.
  #   ERR_GPS_OUT_OF_WINDOW             — POST /trips/{tid}/gps-reports's in-window check.
  #   ERR_APPEAL_WINDOW_CLOSED          — POST /penalties/{id}/uphold's 30-day-window check.
  #   ERR_VOID_WINDOW_CLOSED            — POST /permits/{id}/void-issue's 24-hour-window check.
  #   ERR_DUPLICATE_IDENTIFIER          — POST /companies (registration_number uniqueness), POST /companies/{cid}/drivers (license-number-per-company), POST /companies/{cid}/vehicles (plate-system-wide).
  #   ERR_PERMIT_VEHICLE_COUNT_OUT_OF_RANGE — POST /permits's vehicle-list-cardinality check, POST /permits/{id}/renew's same if the body supplies a new list.
  #   ERR_RENEWAL_TOO_EARLY             — POST /permits/{id}/renew's left-window-edge check.
  #   ERR_RENEWAL_AFTER_EXPIRY          — POST /permits/{id}/renew's right-window-edge check.
  #   ERR_INSUFFICIENT_WALLET_BALANCE   — POST /permits/{id}/issue and POST /permits/{id}/renew's wallet check.
  #   ERR_IDEMPOTENCY_KEY_REUSED        — POST /trips/{tid}/gps-reports's idempotency-key-with-different-body check.
  #   ERR_VERSION_CONFLICT              — every versioned-mutation endpoint that accepts a body `version` field.
  #   ERR_VALIDATION                    — every endpoint with a request body, as the catch-all body-shape error.
  # Every error_id in the catalog appears in at least one endpoint's error
  # table. The Quality-Checklist completeness item on "every error is
  # referenced" is satisfied.

# §1.7 — RBAC matrix (split A=companies/drivers/vehicles/inspections/routes rows, B=permits/trips/gps/penalties/test-harness rows)
roles:
  - name: CompanyOperator
    description: "The user acting on behalf of a TransportCompany. Performs all the company-side workflow: company-application-submit, driver-registration, vehicle-registration, route-application, permit-application, trip-scheduling, trip-depart/arrive/abort, GPS-stream-upload. Cannot perform regulator-side approvals or the test-harness endpoints."
    identity: "entity_backed:TransportCompany"
    notes: "The X-User-ID on a CompanyOperator request equals the id of the TransportCompany the operator is acting for. The cross-tenant ownership predicate `request's X-User-ID == row's company_id (transitively up the aggregate chain)` is enforced on every per-row endpoint the role hits. The role's bootstrap-onboarding step (the very first POST /companies request, when the operator doesn't yet have an id-of-a-company-to-act-for) accepts a non-empty X-User-ID as the would-be id and the server mints the actual row id in the response — see the POST /companies endpoint's prose. Subsequent calls use the returned row's id as the X-User-ID."

  - name: RegulatorOfficer
    description: "The government regulator. Performs every state-machine transition that requires the regulator's stamp: company-approve, company-revoke, driver-endorsement-refresh, vehicle-inspection-append, route-approve, route-reject, permit-issue, permit-verify-compliance, permit-void-issue, manual-penalty-issue, penalty-appeal-uphold. Has read access to every entity across every tenant (the regulatory-mandate cross-tenant exemption). Cannot perform operator-side actions on a specific company (e.g., a regulator cannot submit a company application or create a vehicle row — the operator-side endpoints are CompanyOperator-only)."
    identity: "opaque"
    notes: "The X-User-ID on a RegulatorOfficer request is an opaque officer-id-string that is not tied to any persisted entity. The audit trail's `inspector_id` field on VehicleInspection, `approved_by` on TransportRoute, `issued_by` on Permit, and `upheld_by` on Penalty all store this opaque-string at the moment of the relevant state-machine transition. The string's domain (which officers exist) is out of scope for the scaffold — the regulator-side identity provider is the regulatory agency's internal system. The scaffold accepts any non-empty opaque string as the X-User-ID for this role."

  - name: Driver
    description: "An individual driver who has a hazmat endorsement. The role's only-allowed endpoints are the self-read on the penalty-summary (GET /drivers/{did}/penalty-summary when {did} == X-User-ID) and the self-read on the driver row (GET /drivers/{did} with the same self-id constraint) and the self-read on a Trip's row when the trip's driver_id matches. The role cannot perform any mutating action — drivers don't submit anything to the API; their actions (driving) are observed by the company's GPS-tracker and reported by the company's back-end to the operator-role's gps-ingest endpoint."
    identity: "entity_backed:Driver"
    notes: "The X-User-ID on a Driver request equals the Driver row's id. The self-only-or-error constraint is enforced at priority 531 in §1.4. The Driver role has no write endpoints; it is read-only for self. This is the §1.7 RBAC-matrix's most-restricted role."

  - name: TestHarness
    description: "Test-mode-only role for advancing the logical clock and triggering the daily compliance sweep on demand. Has no access to any business-logic endpoint. In a production deployment this role's auth-middleware rejects every request (or the role-name isn't recognized at the auth-tier, making every request an ERR_UNAUTHENTICATED 401). The scaffold's two test-harness endpoints (POST /_clock/advance and POST /_sweep/run) are the role's only allowed cells. Without this role the wall-clock-driven and periodic-cascade-driven automatic transitions in §1.2 would not be reachable from the test harness, violating the spec's testability-completeness principle for those transitions."
    identity: "opaque"
    notes: "The X-User-ID on a TestHarness request is an opaque test-runner-id-string. The test layer typically uses a fixed string like 'test-harness-1' for traceability in the audit log of which test triggered which clock-advance or sweep-run. The scaffold doesn't pin a specific test-runner-id format."

# The role-summary block below is a top-level sibling of `roles:` rather than a
# member-key of the roles list itself (a YAML list and a mapping can't share an
# indentation-level under the same parent key). The block summarizes which
# endpoints each role exclusively-owns vs which are shared-read endpoints.
role_endpoints_summary:
    CompanyOperator_exclusive: |
      Every operator-side write endpoint: POST /companies, POST /companies/{id}/submit
      (the operator's submit-the-application action), POST /companies/{cid}/drivers,
      POST /companies/{cid}/vehicles, POST /companies/{cid}/routes,
      POST /routes/{id}/submit, POST /permits (the operator's application-create
      action), POST /permits/{id}/renew, POST /permits/{pid}/trips, POST /trips/{id}/depart,
      POST /trips/{id}/arrive, POST /trips/{id}/abort, POST /trips/{tid}/gps-reports.
      These are exclusive to the CompanyOperator role; no other role can hit them.

    RegulatorOfficer_exclusive: |
      Every regulator-side write endpoint: POST /companies/{id}/approve,
      POST /companies/{id}/revoke, POST /vehicles/{vid}/inspections,
      POST /drivers/{did}/refresh-endorsement, POST /routes/{id}/approve,
      POST /routes/{id}/reject, POST /permits/{id}/issue,
      POST /permits/{id}/verify-compliance, POST /permits/{id}/void-issue,
      POST /penalties, POST /penalties/{id}/uphold. These are exclusive
      to the RegulatorOfficer role.

    Shared_read_endpoints: |
      The read endpoints are shared between CompanyOperator (with the cross-tenant
      ownership filter) and RegulatorOfficer (all-tenants visibility):
      GET /companies/{id}, GET /companies (the list), GET /drivers/{id},
      GET /vehicles/{id}, GET /vehicles/{vid}/inspections, GET /routes/{id},
      GET /permits/{id}, GET /permits, GET /trips/{id}, GET /trips/{tid}/gps-reports,
      GET /drivers/{did}/penalty-summary.
      The Driver-role gets a self-only narrow access on GET /drivers/{did} when
      {did} matches the role's X-User-ID, on GET /trips/{id} when the trip's
      driver_id matches the role's X-User-ID, and on GET /drivers/{did}/penalty-summary
      with the same self-id constraint. Driver has no access to companies, vehicles,
      routes, permits-as-aggregates, or the GPS stream (the GPS reports are uploaded
      by the company's back-end, not the driver's phone, in this scaffold).

    TestHarness_exclusive: |
      The two test endpoints POST /_clock/advance and POST /_sweep/run. The role
      has no access to any other endpoint — including no read access (the test
      harness reads through the regulator-role's all-tenants-visibility credentials
      or through the operator-role's specific-company credentials, depending on the
      test's role-of-the-actor needs).

rbac_matrix:
  # Each row is one endpoint. Each column is one of the four roles. The cell value
  # is `ALLOW` or one of the named-DENY reason strings. The "row-majority deny"
  # is the default — if a cell is DENY without a named reason, the cause is the
  # generic role-not-in-the-allow-set ERR_ROLE_NOT_PERMITTED at priority 200.
  # Named-DENY reasons attach to cells where the cause is *not* the generic
  # role-mismatch: the cross-tenant denials and the self-only-driver denials
  # have distinct error_ids (ERR_CROSS_TENANT_ACCESS at priority 530-531). The
  # "deviation cells" the difficulty-design's rbac-deviation rule-bucket exercises
  # are the row-cells whose deny-cause is NOT the default — those are the
  # "row deviates from its row-majority deny-cause" cells, named individually
  # in the scaffold_difficulty_design index.

  # ─────────────────────────────────────────────────────────────────────
  # Part A — companies, drivers, vehicles, inspections, routes endpoints
  # ─────────────────────────────────────────────────────────────────────

  - endpoint: "POST /v1/companies"
    cells:
      CompanyOperator: "ALLOW"
      RegulatorOfficer: "DENY (default: role not in allow-set; ERR_ROLE_NOT_PERMITTED). The regulator does not file company applications on behalf of operators; the operator's onboarding includes filing the application through their own role-credentials."
      Driver: "DENY (default)"
      TestHarness: "DENY (default)"

  - endpoint: "GET /v1/companies/{company_id}"
    cells:
      CompanyOperator: "ALLOW-with-cross-tenant-check. The cell is conditionally-ALLOW: the request reaches the handler only if the cross-tenant predicate `X-User-ID == {company_id}` holds; if it doesn't, the handler returns ERR_CROSS_TENANT_ACCESS at priority 530. This is the operator-can-only-read-its-own-company cell, and it's a deviation cell (the cell has both an allow-condition AND a deny-reason within the same row, distinguishing it from the pure-allow regulator cell and the pure-deny driver-and-test-harness cells)."
      RegulatorOfficer: "ALLOW (all tenants, regulatory mandate)"
      Driver: "DENY (default)"
      TestHarness: "DENY (default)"

  - endpoint: "GET /v1/companies"
    cells:
      CompanyOperator: "ALLOW-self-scoped. The list response is filtered server-side to the operator's own company-id (a list of at-most-one item: the operator's own company row). The `company_id` query parameter, if supplied, must equal the operator's X-User-ID — a mismatched explicit parameter returns ERR_CROSS_TENANT_ACCESS 403. The implicit-no-query default is the operator's own list. This is a deviation cell because the row-level deny-direction (cross-tenant) co-exists with the row-level allow-direction (self-scoped list)."
      RegulatorOfficer: "ALLOW (all tenants; the explicit `company_id` query parameter is the filter, and the regulator's implicit-no-query default is all companies)"
      Driver: "DENY (default)"
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/companies/{company_id}/submit"
    cells:
      CompanyOperator: "ALLOW-with-ownership-check. The operator's X-User-ID must equal the path's {company_id}, otherwise ERR_CROSS_TENANT_ACCESS at priority 530. Deviation cell on the cross-tenant-condition."
      RegulatorOfficer: "DENY (default — the regulator can't submit-the-application-on-behalf-of an operator; the operator submits)"
      Driver: "DENY (default)"
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/companies/{company_id}/approve"
    cells:
      CompanyOperator: "DENY (default — the operator cannot self-approve)"
      RegulatorOfficer: "ALLOW (this is the regulator's exclusive action)"
      Driver: "DENY (default)"
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/companies/{company_id}/revoke"
    cells:
      CompanyOperator: "DENY (default — the operator cannot self-revoke)"
      RegulatorOfficer: "ALLOW (regulator's exclusive revoke action)"
      Driver: "DENY (default)"
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/companies/{company_id}/drivers"
    cells:
      CompanyOperator: "ALLOW-with-ownership ({company_id} == X-User-ID). Deviation cell."
      RegulatorOfficer: "DENY (default — the regulator doesn't add drivers to a company; the company adds them and the regulator attests their endorsement via the refresh-endorsement endpoint)"
      Driver: "DENY (default)"
      TestHarness: "DENY (default)"

  - endpoint: "GET /v1/drivers/{driver_id}"
    cells:
      CompanyOperator: "ALLOW-with-cross-tenant-check on the driver's `company_id == X-User-ID`. Deviation cell — the cross-tenant predicate is on a transitive parent (the driver's company), not on a direct same-aggregate id."
      RegulatorOfficer: "ALLOW"
      Driver: "ALLOW-with-self-only-check on `{driver_id} == X-User-ID`. Deviation cell on the self-only-driver-row-read rule at priority 531. This is one of the canonical RBAC-deviation cells the difficulty-design index pins."
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/drivers/{driver_id}/refresh-endorsement"
    cells:
      CompanyOperator: "DENY (default — the operator cannot self-attest its own drivers' hazmat endorsements; this is the regulator's prerogative, the canonical regulatory-attestation gate)"
      RegulatorOfficer: "ALLOW"
      Driver: "DENY (the driver doesn't self-attest its endorsement either — the endorsement is the regulator's grant to the driver, not the driver's self-claim. The deny-cause is the same default role-not-in-allow-set as the operator's deny.)"
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/companies/{company_id}/vehicles"
    cells:
      CompanyOperator: "ALLOW-with-ownership ({company_id} == X-User-ID). Deviation cell."
      RegulatorOfficer: "DENY (default)"
      Driver: "DENY (default)"
      TestHarness: "DENY (default)"

  - endpoint: "GET /v1/vehicles/{vehicle_id}"
    cells:
      CompanyOperator: "ALLOW-with-transitive-tenant on the vehicle's `company_id == X-User-ID`. Deviation cell. Symmetric to the driver-read cell."
      RegulatorOfficer: "ALLOW"
      Driver: "DENY (default — drivers don't read vehicle rows in this scaffold; the spec is regulator-and-operator-centric on the equipment view)"
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/vehicles/{vehicle_id}/inspections"
    cells:
      CompanyOperator: "DENY (default — operators don't inspect their own vehicles; the regulator does. The audit-trail integrity requires the inspection's `inspector_id` field be the regulator's-officer-id, not the company's)"
      RegulatorOfficer: "ALLOW"
      Driver: "DENY (default)"
      TestHarness: "DENY (default)"

  - endpoint: "GET /v1/vehicles/{vehicle_id}/inspections"
    cells:
      CompanyOperator: "ALLOW-with-transitive-tenant on the parent vehicle's `company_id == X-User-ID`. Deviation cell. Operators read the inspection history of their own vehicles for audit purposes."
      RegulatorOfficer: "ALLOW"
      Driver: "DENY (default)"
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/companies/{company_id}/routes"
    cells:
      CompanyOperator: "ALLOW-with-ownership ({company_id} == X-User-ID). Deviation cell."
      RegulatorOfficer: "DENY (default)"
      Driver: "DENY (default)"
      TestHarness: "DENY (default)"

  - endpoint: "GET /v1/routes/{route_id}"
    cells:
      CompanyOperator: "ALLOW-with-transitive-tenant on the route's `company_id == X-User-ID`. Deviation cell."
      RegulatorOfficer: "ALLOW"
      Driver: "DENY (default — drivers don't navigate route detail through the API in this scaffold)"
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/routes/{route_id}/submit"
    cells:
      CompanyOperator: "ALLOW-with-ownership on the parent company (the route's `company_id == X-User-ID`). Deviation cell on the transitive-ownership-on-the-action-endpoint. The submit-on-a-not-own-route case is ERR_CROSS_TENANT_ACCESS 403."
      RegulatorOfficer: "DENY (default — the regulator can't submit a route application on the operator's behalf; the operator submits, the regulator approves or rejects)"
      Driver: "DENY (default)"
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/routes/{route_id}/approve"
    cells:
      CompanyOperator: "DENY (default — operator can't self-approve)"
      RegulatorOfficer: "ALLOW"
      Driver: "DENY (default)"
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/routes/{route_id}/reject"
    cells:
      CompanyOperator: "DENY (default)"
      RegulatorOfficer: "ALLOW"
      Driver: "DENY (default)"
      TestHarness: "DENY (default)"

  # End of Part A. Part B continues with the permit, trip, gps, penalty, and
  # test-harness endpoints.
  # ─────────────────────────────────────────────────────────────────────
  # Part B — permits, trips, gps reports, penalties, test-harness endpoints
  # ─────────────────────────────────────────────────────────────────────

  - endpoint: "POST /v1/permits"
    cells:
      CompanyOperator: "ALLOW. The body's referenced `route_id`, every entry in `authorized_driver_ids` and `authorized_vehicle_ids` must each have `company_id == operator's X-User-ID`. The cross-aggregate-foreign-key-mismatch case where a body id belongs to a different tenant resolves at the existence-check tier — from the operator's perspective such an id is `ERR_<ENTITY>_NOT_FOUND` because that-tenant's-ids aren't in the operator's universe. The cross-tenant-ownership 403 only fires on a path-id mismatch, not on a body-id mismatch."
      RegulatorOfficer: "DENY (default — the regulator doesn't *file* the permit application on the operator's behalf; the operator files, the regulator issues. Note this asymmetry vs the symmetric apply-then-approve pattern in many regulatory schemes: the scaffold's hazmat-permit lifecycle is application-by-operator and issuance-by-regulator, mirroring the real-world DOT-PHMSA hazmat-permit process where the carrier files a Form 5800.7 and the agency reviews then issues the certification.)"
      Driver: "DENY (default)"
      TestHarness: "DENY (default)"

  - endpoint: "GET /v1/permits/{permit_id}"
    cells:
      CompanyOperator: "ALLOW-with-tenant-check on the permit's `company_id == X-User-ID`. Deviation cell."
      RegulatorOfficer: "ALLOW"
      Driver: "DENY (default — drivers don't read permit detail in this scaffold; the regulatory data is operator-and-regulator. A driver who wants to know which permits authorize their endorsement uses the GET /drivers/{did}/penalty-summary endpoint's `permits_currently_listing_this_driver` sub-list, which the Driver-role self-read on the penalty-summary endpoint surfaces. The Driver-role's lack of access to the permit-row itself is a deliberate-narrow-scope decision matching the scaffold's keep-the-driver-role-read-only convention.)"
      TestHarness: "DENY (default)"

  - endpoint: "GET /v1/permits"
    cells:
      CompanyOperator: "ALLOW-self-scoped. The list filter is the operator's own `company_id` implicit-or-explicit-and-matching-X-User-ID convention. Mismatched explicit `company_id` is ERR_CROSS_TENANT_ACCESS 403. Deviation cell."
      RegulatorOfficer: "ALLOW (cross-tenant). Explicit `company_id` filter narrows; absent filter is all companies."
      Driver: "DENY (default)"
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/permits/{permit_id}/issue"
    cells:
      CompanyOperator: "DENY (default — operator cannot issue its own permit; the regulator issues)"
      RegulatorOfficer: "ALLOW"
      Driver: "DENY (default)"
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/permits/{permit_id}/verify-compliance"
    cells:
      CompanyOperator: "DENY (default — operator cannot self-verify-compliance; this is the regulator's compliance-audit action. The operator's analogue is the application-time-preview field on POST /permits's response and the live_verdict field on the GET /permits/{id} read.)"
      RegulatorOfficer: "ALLOW"
      Driver: "DENY (default)"
      TestHarness: "DENY (default — the test-harness's POST /_sweep/run fires verify-compliance internally on every ACTIVE permit, which is the test-driving path for the compliance-cascade; the test-harness doesn't hit the per-permit verify-compliance endpoint directly. The doc-generator should narrate the test-harness's-sweep as the testability-bridge for the verify-compliance fan-out without exposing the harness's role as having direct verify-compliance access)."

  - endpoint: "POST /v1/permits/{permit_id}/renew"
    cells:
      CompanyOperator: "ALLOW-with-ownership on the permit's `company_id == X-User-ID`. Deviation cell. The operator pays the renewal fee from its own wallet."
      RegulatorOfficer: "DENY (default — the regulator doesn't renew on behalf of the operator; the operator pays. The regulator's analogue is the void-issue compensating action for a recently-issued clerical-error case, not a forward-extending renewal)"
      Driver: "DENY (default)"
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/permits/{permit_id}/void-issue"
    cells:
      CompanyOperator: "DENY (default — the operator can't undo an issued permit; that's the regulator's clerical-error reversal action. The operator's analogue is to let the permit run to natural expiry, after which a fresh application is required.)"
      RegulatorOfficer: "ALLOW"
      Driver: "DENY (default)"
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/permits/{permit_id}/trips"
    cells:
      CompanyOperator: "ALLOW-with-ownership on the parent permit's `company_id == X-User-ID`. Deviation cell."
      RegulatorOfficer: "DENY (default — the regulator doesn't schedule trips; the operator schedules.)"
      Driver: "DENY (default)"
      TestHarness: "DENY (default)"

  - endpoint: "GET /v1/trips/{trip_id}"
    cells:
      CompanyOperator: "ALLOW-with-transitive-tenant on the trip's parent-permit's `company_id == X-User-ID`. Deviation cell."
      RegulatorOfficer: "ALLOW"
      Driver: "ALLOW-with-self-only on the trip's `driver_id == X-User-ID`. Deviation cell — the driver can read their own trips. Symmetric to the driver-self-read on the driver-row. The deny-cause for the not-own-trip case is ERR_CROSS_TENANT_ACCESS 403."
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/trips/{trip_id}/depart"
    cells:
      CompanyOperator: "ALLOW-with-transitive-tenant on the trip's parent-permit's `company_id == X-User-ID`. Deviation cell. The depart-action is the operator's dispatch trigger; the driver themselves doesn't fire the depart through the API in this scaffold."
      RegulatorOfficer: "DENY (default)"
      Driver: "DENY (default — drivers don't self-dispatch through the API in this scaffold; the operator's fleet-management system fires the depart on behalf of the driver. This is a deliberate choice matching the company-back-end-uploads-GPS convention.)"
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/trips/{trip_id}/arrive"
    cells:
      CompanyOperator: "ALLOW-with-transitive-tenant. Deviation cell. The arrive-action is the operator's delivery-confirmation, again on behalf of the driver."
      RegulatorOfficer: "DENY (default)"
      Driver: "DENY (default — symmetric to the depart-deny)"
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/trips/{trip_id}/abort"
    cells:
      CompanyOperator: "ALLOW-with-transitive-tenant. Deviation cell. Operator-initiated abort. The cascade-from-permit-state-change paths (the expired-and-voided cases) are server-internal and don't come through this endpoint."
      RegulatorOfficer: "DENY (the regulator's path to abort an in-flight trip is indirect — via the permit's revoke-cascade or void-issue-cascade, which kill all the permit's open trips together. There is no per-trip regulator abort in the scaffold's API surface, because the regulator's regulatory authority is at the permit-aggregate level, not the per-trip level. This is a deliberate non-trivial RBAC decision the doc-generator should explain.)"
      Driver: "DENY (default — drivers don't self-abort through the API)"
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/trips/{trip_id}/gps-reports"
    cells:
      CompanyOperator: "ALLOW-with-transitive-tenant on the trip's parent-permit's `company_id == X-User-ID`. Deviation cell. The company's fleet-tracking back-end pushes GPS samples to this endpoint."
      RegulatorOfficer: "DENY (default — the regulator doesn't inject GPS samples; the regulator audits the existing stream via the GET endpoint)"
      Driver: "DENY (default — the driver's phone or the on-board GPS unit's data is conceptually the source, but the practical-uploading-actor in the scaffold's model is the company's back-end, not the driver's role-credentials. So the driver-role has no gps-write permission. This is the same operator-mediates-the-driver pattern as the depart and arrive actions.)"
      TestHarness: "DENY (default — the test harness wraps a CompanyOperator-credentials call for any gps-stream test; the harness itself doesn't have gps-write permission, which keeps the test-harness role's surface narrow to just the clock and sweep)"

  - endpoint: "GET /v1/trips/{trip_id}/gps-reports"
    cells:
      CompanyOperator: "ALLOW-with-transitive-tenant. Deviation cell. Operators read their own trips' GPS history."
      RegulatorOfficer: "ALLOW (cross-tenant audit access)"
      Driver: "DENY (drivers don't read the raw GPS list — the regulator does for audit, the operator does for fleet-management. The driver's window into their own performance is the penalty-summary endpoint, which is the digest the spec gives the driver-role. This is a 'data-minimization for the driver-role' design choice — the driver sees the consequences of GPS violations via the points on the summary, not the raw stream.)"
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/penalties"
    cells:
      CompanyOperator: "DENY (default — operators don't issue penalties; only the regulator does. The auto-Penalty rows from the GPS-ingest path are server-internal effects of the operator's gps-write, not separate POST /penalties calls — the gps-ingest's transaction creates the Penalty rows under the system's authority, bypassing the operator's role-credentials for the penalty-insert side-effect.)"
      RegulatorOfficer: "ALLOW. This is the regulator's manual-penalty path for off-line-observed violations (a check-stop, a paperwork-irregularity, etc.). The body's `subject_type` distinguishes whether the penalty is on a driver, the company, or a vehicle — only the DRIVER case drives the §1.3 calc-2's rolling-points-total in this scaffold, per the taxonomies note in §1.0."
      Driver: "DENY (drivers can't self-penalize either; the regulator's authority is exclusive on penalty-issuance)"
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/penalties/{penalty_id}/uphold"
    cells:
      CompanyOperator: "DENY (default — the appeal-process is regulator-internal; the operator's-or-driver's appeal is filed out-of-band with the regulator's office, and the regulator's API-call to uphold is the formal record of the appeal's outcome. The scaffold doesn't model the appeal-filing-itself as an API endpoint; the uphold is the regulator's recording of the already-adjudicated outcome)"
      RegulatorOfficer: "ALLOW"
      Driver: "DENY (drivers can't self-uphold their own penalty appeals through the API; the regulator's role is the adjudicator)"
      TestHarness: "DENY (default)"

  - endpoint: "GET /v1/drivers/{driver_id}/penalty-summary"
    cells:
      CompanyOperator: "ALLOW-with-transitive-tenant on the driver's `company_id == X-User-ID`. The operator reads their own drivers' summaries for fleet-compliance dashboards. Deviation cell."
      RegulatorOfficer: "ALLOW (cross-tenant audit)"
      Driver: "ALLOW-with-self-only on the path's `{driver_id} == X-User-ID`. This is the canonical self-only-driver-read deviation cell from §1.4 priority-531. The Driver-role's-own-driver-id-matches-the-path-id case is the only allow-condition. A mismatch is ERR_CROSS_TENANT_ACCESS 403. This cell is one of the rule-rbac-deviation index entries in SCAFFOLD_DIFFICULTY_DESIGN."
      TestHarness: "DENY (default)"

  - endpoint: "POST /v1/_clock/advance"
    cells:
      CompanyOperator: "DENY (default — this is the test-harness's-only endpoint; in production the clock advances with the OS tick, not via an API call)"
      RegulatorOfficer: "DENY (default — even the regulator can't manipulate the wall-clock through the API; the regulator's audit-log integrity depends on the clock being the OS clock, not an API-mutable variable)"
      Driver: "DENY (default)"
      TestHarness: "ALLOW. The test harness uses this endpoint to drive the wall-clock past the boundaries (permit expiry, appeal-window-close, void-window-close, endorsement-expiry, rolling-window-trailing-edge fall-off) deterministically. The endpoint is gated to the TestHarness role at the auth-middleware level; in a production deployment the TestHarness role is rejected at auth, so the endpoint is effectively-not-reachable. This is the spec's testability-completeness principle's load-bearing mechanism, and the cell is the rare 'TestHarness ALLOW' cell that the difficulty-design's rbac-deviation index pins as a deviation from the otherwise-uniform-all-DENY column for the TestHarness role across the rest of the matrix."

  - endpoint: "POST /v1/_sweep/run"
    cells:
      CompanyOperator: "DENY (default — the daily compliance sweep is the system's periodic-job, not an operator-initiated action)"
      RegulatorOfficer: "DENY (default — the sweep is fully automatic in production; the regulator's compliance-pulses are the individual POST /permits/{id}/verify-compliance calls, not the bulk-sweep. The bulk-sweep's existence as an API endpoint is solely the testability-completeness affordance.)"
      Driver: "DENY (default)"
      TestHarness: "ALLOW. The harness uses the sweep to flush all the deferred cascades (permit-expiries on the wall-clock-tick, verify-compliance fan-out on any flipped-grounding-entity, the per-driver rolling-window's trailing-edge fall-off recompute). The cell is the second TestHarness-ALLOW deviation in the matrix."

  # ─────────────────────────────────────────────────────────────────────
  # Matrix summary:
  #
  # Rows (endpoints): the 34 endpoints listed in §1.5 — 6 company-endpoints +
  # 3 driver-endpoints + 2 vehicle-endpoints + 2 inspection-endpoints + 5
  # route-endpoints (the 18 of Part A) + 8 permit-endpoints + 5 trip-endpoints
  # + 2 gps-endpoints + 3 penalty-endpoints + 2 test-harness-endpoints (the 16
  # of Part B in this rbac_matrix block, totaling 34 unique endpoint paths in
  # the matrix). Wait — re-counting against the §1.5 endpoint list: Part A
  # has 6 (companies) + 3 (drivers) + 2 (vehicles) + 2 (inspections) + 5
  # (routes) = 18. Part B has 7 (permits) + 5 (trips) + 2 (gps) + 3 (penalties)
  # + 2 (test-harness) = 19. Total in §1.5: 37 endpoints. The rbac_matrix
  # above has rows: 7 company-related rows + 3 driver-related rows + 2 vehicle
  # rows + 2 inspection rows + 5 route rows = 19 in Part A's rbac_matrix
  # block. Wait, the company-related rbac rows are POST /companies,
  # GET /companies/{id}, GET /companies (the list), POST /companies/{id}/submit,
  # POST /companies/{id}/approve, POST /companies/{id}/revoke,
  # POST /companies/{company_id}/drivers (the children-create-under-companies
  # endpoint), totaling 7 in the cluster (the children-create-under-companies
  # is technically a driver-creation but it's keyed at the companies path
  # prefix). And the vehicle-create-under-companies is the 8th cluster row.
  # And the route-create-under-companies is the 9th. Let me just recount the
  # ROWS in the rbac_matrix Part A block above: POST /v1/companies, GET
  # /v1/companies/{company_id}, GET /v1/companies, POST /v1/companies/{id}/submit,
  # POST /v1/companies/{id}/approve, POST /v1/companies/{id}/revoke,
  # POST /v1/companies/{company_id}/drivers, GET /v1/drivers/{driver_id},
  # POST /v1/drivers/{driver_id}/refresh-endorsement,
  # POST /v1/companies/{company_id}/vehicles, GET /v1/vehicles/{vehicle_id},
  # POST /v1/vehicles/{vehicle_id}/inspections, GET /v1/vehicles/{vehicle_id}/inspections,
  # POST /v1/companies/{company_id}/routes, GET /v1/routes/{route_id},
  # POST /v1/routes/{route_id}/submit, POST /v1/routes/{route_id}/approve,
  # POST /v1/routes/{route_id}/reject — that's 18 distinct endpoint paths
  # in the Part A block. And Part B above: POST /v1/permits, GET /v1/permits/{id},
  # GET /v1/permits, POST /v1/permits/{id}/issue, POST /v1/permits/{id}/verify-compliance,
  # POST /v1/permits/{id}/renew, POST /v1/permits/{id}/void-issue, POST
  # /v1/permits/{permit_id}/trips, GET /v1/trips/{trip_id}, POST /v1/trips/{id}/depart,
  # POST /v1/trips/{id}/arrive, POST /v1/trips/{id}/abort, POST /v1/trips/{tid}/gps-reports,
  # GET /v1/trips/{tid}/gps-reports, POST /v1/penalties, POST /v1/penalties/{id}/uphold,
  # GET /v1/drivers/{driver_id}/penalty-summary, POST /v1/_clock/advance,
  # POST /v1/_sweep/run — that's 19 in Part B. Total in the matrix: 37, which
  # equals the §1.5 endpoint count. The two halves of the matrix exactly
  # partition the §1.5 endpoint list, with the partition line at
  # "the qualification-side endpoints vs the operational-and-test endpoints".
  #
  # Columns (roles): the 4 — CompanyOperator, RegulatorOfficer, Driver, TestHarness.
  # Cells: 37 × 4 = 148. Allow-cells: let's count, roughly: the regulator
  # is ALLOW on all the read endpoints and all the regulator-write endpoints;
  # the operator is ALLOW (with tenant-check) on all the operator-write
  # endpoints and the same-tenant-read endpoints; the driver is ALLOW (with
  # self-check) on the three driver-self endpoints (GET /drivers/{did}, GET
  # /trips/{tid} for own-driver-id, GET /drivers/{did}/penalty-summary); the
  # test-harness is ALLOW on the two test endpoints. Tallying: regulator
  # ~24 ALLOW (every endpoint except the operator-exclusive writes and the
  # test-harness pair); operator ~16 ALLOW (the operator-write endpoints and
  # the same-tenant read endpoints); driver 3 ALLOW; test-harness 2 ALLOW.
  # Total ALLOW: about 45 cells out of 148. The remaining ~103 are DENY,
  # of which the column-uniform-DENY pattern (where the role isn't in the
  # endpoint's allow-set at all) covers most. The deviation cells (the
  # cells whose deny-cause is NOT the default role-not-in-allow-set) are
  # the cross-tenant-ownership-condition cells on the operator's read-and-
  # write-action endpoints (the ALLOW-with-condition cells where the cell
  # value is ALLOW-with-the-condition rather than pure-ALLOW or
  # pure-DENY-default) and the self-only-driver cells (GET /drivers/{did},
  # GET /trips/{id}, GET /drivers/{did}/penalty-summary). The
  # scaffold_difficulty_design's rbac_deviation rule-bucket pins which
  # specific cells to test, focusing on the ones whose
  # allow-with-the-condition-fails error_id is the distinct
  # ERR_CROSS_TENANT_ACCESS (vs the default ERR_ROLE_NOT_PERMITTED).
  #
  # The five canonical deviation-cells are:
  #   (i)   GET /v1/companies/{cid} for the CompanyOperator with X-User-ID != {cid}.
  #         Expected: ERR_CROSS_TENANT_ACCESS 403, not ERR_ROLE_NOT_PERMITTED 403.
  #   (ii)  GET /v1/drivers/{did} for the CompanyOperator whose X-User-ID isn't the
  #         driver's company_id, AND the variant for the Driver-role whose X-User-ID
  #         isn't equal to {did}. Two distinct deviation-conditions on the same row.
  #         Both end in ERR_CROSS_TENANT_ACCESS, but the underlying predicate is
  #         different (the operator-vs-driver-company comparison vs the driver-self-id
  #         comparison).
  #   (iii) GET /v1/vehicles/{vid} for the CompanyOperator with X-User-ID isn't the
  #         vehicle's company_id. ERR_CROSS_TENANT_ACCESS.
  #   (iv)  GET /v1/permits/{pid} for the CompanyOperator with X-User-ID isn't the
  #         permit's company_id. ERR_CROSS_TENANT_ACCESS. Precedence-pair with the
  #         existence check: a non-existent {pid} returns 404 not 403, per the
  #         priority-300-before-priority-530 ordering, which is rule-5's
  #         priority-conflict-B's pinned scenario — the rbac-deviation cell and the
  #         priority-conflict-B scenario share this endpoint as their common
  #         attack-surface.
  #   (v)   GET /v1/drivers/{did}/penalty-summary for the Driver-role whose
  #         X-User-ID isn't equal to {did} (the self-only check at priority 531).
  #         Also fires for the CompanyOperator-with-the-driver's-company-mismatch case
  #         (priority 530). The two distinct conditions on the same row, both
  #         ending in ERR_CROSS_TENANT_ACCESS with the underlying predicate-
  #         expression differing, mirror the GET /drivers/{did} row's two-condition
  #         shape.
  #
  # Beyond the five canonical, the two TestHarness-ALLOW cells (POST /_clock/advance,
  # POST /_sweep/run) are deviation cells in the sense that they are ALLOW in an
  # otherwise-all-DENY column (the TestHarness column is uniformly DENY for the
  # 35 non-test endpoints). The difficulty-design's index lists these as
  # rbac_deviation instances too — the test-harness's-own-allow-cells are the
  # row-deviation-from-the-uniform-deny pattern that the rbac_deviation rule
  # exercises. The two test-harness allow-cells, the five cross-tenant-conditional-
  # cells, and the one driver-self-on-the-trip-read-cell (the trip's driver_id
  # self-check) total eight deviation cells. The difficulty-design's
  # rbac_deviation bucket lists a subset of these, sized to the 25-40-worked-
  # examples total budget for the file as a whole. The intent is that every
  # deviation cell has at least one test, and the scaffold's audit-of-coverage
  # ensures the eight-cell set is covered.
