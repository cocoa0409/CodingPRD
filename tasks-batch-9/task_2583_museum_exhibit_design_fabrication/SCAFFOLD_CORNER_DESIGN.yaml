  - section: validations
    instances:
      - name: every_scoped_unique_code_collides_only_inside_its_own_project_and_only_exactly
        claim_type: violation_to_error
        grounds:
          - validations.priority_28
          - errors.ERR_DUPLICATE_CODE
        distinguishing_aspect: |
          Five separate human-authored code fields on five different entities share
          ONE error id and ONE scope rule, and the rule has two edges that a naive
          global-unique-index implementation gets wrong in opposite directions: the
          comparison is case-SENSITIVE, so "z-a" is a different zone code from "Z-A"
          and must be accepted in the same project, and the scope is per project_id,
          so a second project may reuse "Z-A" verbatim. The zone probe also carries a
          fresh visitor_route_order, which is itself unique per project, so the 409
          cannot be blamed on the route ordinal.
        test_recipe:
          setup:
            - "project in DESIGN_DEV with zone Z-A, artifact 2019.14.3, case C-01, interactives INT-STRATA and INT-EXT, and material spec Powder-coated aluminium housing"
