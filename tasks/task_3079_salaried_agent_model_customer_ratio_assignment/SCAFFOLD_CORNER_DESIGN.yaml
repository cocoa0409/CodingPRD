scaffold_corner_design:

# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3079_salaried_agent_model_customer_ratio_assignment
#
# Breadth probe: every testable claim §1.1–§1.7 declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8 already
# covers appear as `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: region_create_returns_derived_defaults_and_generated_identity
        claim_type: Creation
        grounds:
          - entities.Region
          - endpoints.POST_/regions
        distinguishing_aspect: "A region created with only its four required inputs comes back 201 with agent_count 0, clients_in_pipeline 0, occupancy_pct 0.0, referral_count 0 and occupancy_band UNDER_TARGET, plus system-minted id / created_at / updated_at and version 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /regions"
              payload: { name: "Puget Sound", service_area_codes: ["98101", "98102", "98103"], traditional_commission_pct: 0.025, target_client_ratio: 2.0 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Region.${region_id}.agent_count == 0 and clients_in_pipeline == 0 and referral_count == 0"
            - "Region.${region_id}.occupancy_pct == 0.0 and occupancy_band == UNDER_TARGET"
            - "Region.${region_id}.capacity == 10 (the declared default) and enrolment_is_required == false"
            - "Region.${region_id}.version == 1 and id / created_at / updated_at are non-null"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: agent_get_round_trips_salary_benefits_and_expense_fields
        claim_type: Retrieval
        grounds:
          - entities.Agent
          - endpoints.GET_/agents/{id}
        distinguishing_aspect: "Every declared salary component round-trips through GET unchanged, including the omitted-optional defaults (benefits_cents and expense_allowance_cents both 0 when absent) and the agent_kind discriminator."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region and one ASSOCIATE agent created with only the required salary field."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regions"
              payload: { name: "Puget Sound", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${region_id}", full_name: "Ann Associate", agent_kind: "ASSOCIATE", home_zip: "98102", base_salary_cents: 6000000 }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
          trigger:
            - call: "GET /agents/${agent_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the response status is 200"
            - "Agent.${agent_id}.full_name == \"Ann Associate\" and agent_kind == ASSOCIATE"
            - "Agent.${agent_id}.base_salary_cents == 6000000"
            - "Agent.${agent_id}.benefits_cents == 0 and expense_allowance_cents == 0 (declared defaults applied)"
            - "Agent.${agent_id}.salary_commitment_cents == 6000000"
            - "Agent.${agent_id}.home_zip == \"98102\""

      - name: clients_list_paginates_with_total_count_and_agent_filter
        claim_type: Listing
        grounds:
          - endpoints.GET_/clients
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three clients on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true while offset=2 returns the last row with has_more false — total_count counts the whole filtered set, and assigned_agent_id narrows it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region, one lead agent, three clients."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regions"
              payload: { name: "Puget Sound", service_area_codes: ["98101", "98102", "98103"], traditional_commission_pct: 0.025, target_client_ratio: 2.0 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${region_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Alpha Buyer", email: "alpha@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_1: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Beta Buyer", email: "beta@x.com", service_area_code: "98102", need_kind: "BUY" }
              as: OperationsCoordinator
            - call: "POST /clients"
              payload: { full_name: "Gamma Seller", email: "gamma@x.com", service_area_code: "98103", need_kind: "SELL" }
              as: OperationsCoordinator
            - call: "POST /clients/${client_1}/assign-agent"
              payload: {}
              as: OperationsCoordinator
          trigger:
            - call: "GET /clients"
              payload: { region_id: "${region_id}", limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "the response status is 200 and response_type is array"
            - "the page returns exactly 2 rows with total_count == 3 and has_more == true and limit == 2 and offset == 0"
            - "GET /clients?region_id=${region_id}&limit=2&offset=2 returns exactly 1 row with has_more == false"
            - "GET /clients?assigned_agent_id=${agent_id} returns exactly 1 row, the Alpha Buyer client"
            - "GET /clients?service_area_code=98103 returns exactly 1 row, the Gamma Seller client"
            - "GET /clients?need_kind=SELL returns exactly 1 row with status UNASSIGNED"

      - name: tour_get_with_an_unknown_id_returns_tour_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/tours/{id}
          - errors.ERR_TOUR_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated id on the tour path produces the entity-specific 404 ERR_TOUR_NOT_FOUND rather than a generic ERR_NOT_FOUND and rather than a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No tour has been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /tours/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_TOUR_NOT_FOUND"
            - "error_id != ERR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: agent_create_missing_base_salary_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Agent.fields.base_salary_cents
          - validations[priority=3a]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "base_salary_cents is source: input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the required-field check — distinct from the 409 ERR_GEOGRAPHY_MISMATCH a present-but-wrong home_zip produces."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regions"
              payload: { name: "Puget Sound", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
          trigger:
            - call: "POST /agents"
              payload: { region_id: "${region_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "error_id != ERR_GEOGRAPHY_MISMATCH"
            - "GET /agents?region_id=${region_id} returns 0 rows"

      - name: client_create_omitting_need_kind_is_rejected_as_invalid_request
        claim_type: Defaults
        grounds:
          - entities.Client.fields.need_kind
          - entities.Agent.fields.benefits_cents
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Contrasting defaults: benefits_cents and expense_allowance_cents declare a 0 default and are silently filled in, while need_kind has no default, so the same omission pattern produces success on one entity and ERR_INVALID_REQUEST on the other."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regions"
              payload: { name: "Puget Sound", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${region_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { agent_id: $.data.id, benefits: $.data.benefits_cents }
          trigger:
            - call: "POST /clients"
              payload: { full_name: "No Kind Buyer", email: "nokind@x.com", service_area_code: "98101" }
              as: OperationsCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "the agent create succeeded with benefits == 0 — the declared default was applied"
            - "the client create returns 400 with error_id == ERR_INVALID_REQUEST, because need_kind declares no default"
            - "GET /clients?region_id=${region_id} returns 0 rows"

      - name: tour_access_code_is_release_windowed_on_read
        claim_type: Computed Fields
        grounds:
          - entities.Tour.fields.access_code
          - calculations.tour_access_release
          - endpoints.GET_/tours/{id}
        distinguishing_aspect: "Tour.access_code is a computed, clock-windowed field: null on every read before the release instant and populated at and after it, with no write in between and no change to the row's version."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region, one lead agent, one assigned client, one tour scheduled for 2026-09-02T12:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regions"
              payload: { name: "Puget Sound", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${region_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Tina Tour", email: "tina@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /tours"
              payload: { client_id: "${client_id}", scheduled_at: "2026-09-02T12:00:00Z", access_instructions: "Lockbox 4821 at the side gate" }
              as: OperationsCoordinator
              captures: { tour_id: $.data.id, tour_v0: $.data.version }
          trigger:
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: PlatformAdmin
              captures: { code_before: $.data.access_code }
          assert:
            - "at 2026-09-01T00:00:00Z code_before is null — release_at is 2026-09-02T10:00:00Z"
            - "after POST /_clock/set_current_utc to 2026-09-02T09:59:59Z the same GET still reports access_code null"
            - "after POST /_clock/set_current_utc to 2026-09-02T10:00:00Z the same GET reports a non-null access_code (the boundary is inclusive)"
            - "Tour.${tour_id}.version is unchanged at ${tour_v0} across all three reads"

      - name: listing_agreement_create_extra_field_status_and_posted_at_ignored_input
        claim_type: System Fields
        grounds:
          - entities.ListingAgreement.fields.status
          - entities.ListingAgreement.fields.posted_at
          - endpoints.POST_/listing-agreements
        distinguishing_aspect: "status and posted_at are source: system; a client that supplies status ACTIVE or a posted_at in the create body is ignored, the row is created DRAFT with posted_at null, and version is 1 regardless of a supplied version."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region, one lead agent, one assigned SELL client."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regions"
              payload: { name: "Puget Sound", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0 }
              as: PlatformAdmin
              captures: { region_id: $.data.id, region_v: $.data.version }
            - call: "POST /agents"
              payload: { region_id: "${region_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Gamma Seller", email: "gamma@x.com", service_area_code: "98102", need_kind: "SELL" }
              as: OperationsCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "GET /regions/${region_id}"
              payload: {}
              as: PlatformAdmin
              captures: { region_v_before: $.data.version }
          trigger:
            - call: "POST /listing-agreements"
              payload: { client_id: "${client_id}", list_price_cents: 60000000, list_fee_rate_pct: 0.0125, service_tier: "FULL_SERVICE", expected_region_version: "${region_v_before}", status: "ACTIVE", posted_at: "2020-01-01T00:00:00Z", version: 99 }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { agreement_id: $.data.id }
          assert:
            - "the response status is 201"
            - "ListingAgreement.${agreement_id}.status == DRAFT (the supplied ACTIVE was ignored)"
            - "ListingAgreement.${agreement_id}.posted_at is null"
            - "ListingAgreement.${agreement_id}.version == 1"
            - "after POST /listing-agreements/${agreement_id}/publish, status == ACTIVE and posted_at is non-null"

      - name: client_create_with_an_out_of_enum_need_kind_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Client.fields.need_kind
          - entities.Agent.fields.agent_kind
          - validations[priority=3a]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "need_kind and agent_kind are closed enums; a value outside the declared member set is rejected at the request-shape check with 400 ERR_INVALID_REQUEST rather than being coerced into a default band."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regions"
              payload: { name: "Puget Sound", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Hedger", email: "hedger@x.com", service_area_code: "98101", need_kind: "RENT" }
              as: OperationsCoordinator
              captures: { client_error: $.data.error_id }
            - call: "POST /agents"
              payload: { region_id: "${region_id}", full_name: "Solo Agent", agent_kind: "PARTNER", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { agent_error: $.data.error_id }
          assert:
            - "the client request returns 400 and client_error == ERR_INVALID_REQUEST"
            - "the agent request returns 400 and agent_error == ERR_INVALID_REQUEST"
            - "GET /clients?region_id=${region_id} returns 0 rows and GET /agents?region_id=${region_id} returns 0 rows"

      - name: survey_create_extra_field_response_status_and_score_are_ignored_input
        claim_type: System Fields
        grounds:
          - entities.Survey.fields.response_status
          - entities.Survey.fields.bonus_eligible
          - endpoints.POST_/transactions/{id}/surveys
        distinguishing_aspect: "Survey.response_status and bonus_eligible are source: system. A dispatch created with no score is DISPATCHED with bonus_eligible false no matter what the body claims, and only the score-supplied form lands RESPONDED with bonus_eligible true."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region, one lead agent, one assigned client with a CLOSED transaction."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regions"
              payload: { name: "Puget Sound", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${region_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Closed Buyer", email: "closed@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${client_id}/transactions"
              payload: {}
              as: TransactionCoordinator
              captures: { transaction_id: $.data.id }
            - call: "POST /transactions/${transaction_id}/coordination"
              payload: { coordination_status: "REVIEW", contract_price_cents: 75000000 }
              as: TransactionCoordinator
            - call: "POST /transactions/${transaction_id}/close"
              payload: {}
              as: TransactionCoordinator
          trigger:
            - call: "POST /transactions/${transaction_id}/surveys"
              payload: { agent_id: "${agent_id}", response_status: "RESPONDED", bonus_eligible: true, version: 99 }
              as: TransactionCoordinator
              captures: { survey_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Survey.${survey_id}.response_status == DISPATCHED (the supplied RESPONDED was ignored)"
            - "Survey.${survey_id}.bonus_eligible == false"
            - "Survey.${survey_id}.version == 1 and score is null"
            - "GET /surveys/${survey_id} returns the same row, so it is readable and listed by GET /surveys?transaction_id=${transaction_id}"

      - name: agent_create_rejects_home_zip_outside_the_region_service_area
        claim_type: Parent Relationships
        grounds:
          - validations[priority=7]
          - errors.ERR_GEOGRAPHY_MISMATCH
          - entities.Agent.fields.region_id
        distinguishing_aspect: "The agent's parent region is validated against its own home_zip: an existing region with a home_zip outside its service_area_codes is a 409 ERR_GEOGRAPHY_MISMATCH, and an unknown region id is a 404 ERR_REGION_NOT_FOUND — two different failure classes on the same parent relationship."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region serving 98101 and 98102 only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regions"
              payload: { name: "Puget Sound", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
          trigger:
            - call: "POST /agents"
              payload: { region_id: "${region_id}", full_name: "Out Of Area", agent_kind: "LEAD", home_zip: "97001", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
            - call: "POST /agents"
              payload: { region_id: "00000000-0000-4000-8000-000000000000", full_name: "No Region", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { error_id_region: $.data.error_id }
          assert:
            - "the first request returns 409 and error_id == ERR_GEOGRAPHY_MISMATCH"
            - "the second request returns 404 and error_id_region == ERR_REGION_NOT_FOUND — the parent is checked before the geography rule"
            - "GET /agents?region_id=${region_id} returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: tour_cancel_from_already_completed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Tour.transitions.CONFIRMED_to_COMPLETED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "A tour already COMPLETED is terminal, so a cancel from that state is refused with ERR_INVALID_STATE rather than silently succeeding or re-running the completion side effects."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T10:00:00Z. One region, one lead agent, one associate agent, one assigned client whose tour has been confirmed and completed."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Puget Sound", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${region_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${region_id}", full_name: "Ann Associate", agent_kind: "ASSOCIATE", home_zip: "98102", base_salary_cents: 6000000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Tina Tour", email: "tina@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /tours"
              payload: { client_id: "${client_id}", associate_agent_id: "${assoc_id}", scheduled_at: "2026-09-02T11:00:00Z", access_instructions: "Lockbox 4821" }
              as: OperationsCoordinator
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/confirm"
              payload: {}
              as: AssociateAgent
              as_user_id: "${assoc_id}"
            - call: "POST /tours/${tour_id}/complete"
              payload: { feedback_rating: 4 }
              as: AssociateAgent
              as_user_id: "${assoc_id}"
