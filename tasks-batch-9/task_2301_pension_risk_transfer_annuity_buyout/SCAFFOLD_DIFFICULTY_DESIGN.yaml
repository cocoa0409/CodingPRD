      - name: admin_fee_tier_ceilings_are_inclusive_and_net_is_non_monotonic
        grounds:
          - calculations.lump_sum_present_value
          - entities.ParticipantElection.fields.admin_fee_bp
          - entities.ParticipantElection.fields.net_lump_sum_cents
        distinguishing_aspect: |
          Both tier ceilings are probed from directly below and directly above
          with the smallest representable step in the monthly benefit (one cent,
          which becomes 120 cents of raw present value at the DEFERRED_VESTED
          factor of 100000 bp). raw_pv 2400000 sits ON the tier-1 ceiling and pays
          0 bp; raw_pv 2400120 pays 75 bp = 18001 cents, so a 120-cent larger
          entitlement produces a 17881-cent SMALLER net payment. raw_pv 12000000
          sits ON the tier-2 ceiling and pays 75 bp = 90000; raw_pv 12000120 pays
          40 bp = 48000, so crossing that ceiling makes the net payment jump by
          42120 cents. Off-by-one on either comparison operator, or truncating
          instead of round_half_up on the 18000.9 and 48000.48 quotients, is
          detected.
