            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n2: $.data.id } }
            - call: "POST /api/events"
