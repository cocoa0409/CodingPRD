          assert:
            - "captured ful == 100.00"
            - "captured err1 == ERR_CONTRACT_HAS_DELIVERIES (amend blocked despite fresh OCC version)"
            - "captured err2 == ERR_CONTRACT_HAS_DELIVERIES (cancel blocked)"

      - name: layer_cascading_side_effects_covered
