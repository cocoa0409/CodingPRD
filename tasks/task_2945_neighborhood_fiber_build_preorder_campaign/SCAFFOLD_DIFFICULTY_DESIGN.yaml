  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_buffered_halfopen_interval_rejects_11_29_accepts_11_30
        grounds:
          - validations[priority 21 ERR_CREW_WINDOW_CONFLICT]
          - entities.InstallCrew.fields.travel_buffer_minutes
          - entities.InstallAppointment.fields.occupied_minutes
          - endpoints["POST /install-appointments"]
        distinguishing_aspect: |
          Resource entity InstallCrew with BUFFERED HALF-OPEN interval semantics: an existing
          09:00..11:00 booking occupies [09:00, 11:30) once the crew's 30-minute travel buffer is
          appended, so a start at 11:29 collides while a start at exactly 11:30 does not — the
          shared instant is not an overlap. An implementation using closed intervals rejects 11:30
          too, and one that forgets the buffer accepts 11:29.
        test_recipe:
          setup:
            - "Zone IN_CONSTRUCTION: household_count 10, threshold_pct 10.00, ROW permit APPROVED, one pole ATTACHED on a 12000-cent quote."
            - "Two SERVICEABLE addresses with two preorders, both QUALIFIED then CONVERTED with drop_method BURY."
            - "One BURY crew with travel_buffer_minutes 30 and daily_capacity_minutes 480."
            - "One SCHEDULED DROP_BURY appointment on that crew 2026-10-05T09:00:00Z..2026-10-05T11:00:00Z."
