scenario: |
  2411. Household Staff Placement Agency (British American Household Staffing): client intake with role
  scoping (estate manager, housekeeper, chef, chauffeur) and confidentiality agreement, candidate vetting,
  reference chain and background verification, trial-day and working-interview coordination, placement fee
  as a percentage of first-year compensation with milestone billing, replacement guarantee window and
  pro-rated refund, household employer payroll and tax guidance handoff, non-solicitation and candidate
  poaching enforcement, live-in accommodation and schedule negotiation

domain_name: household-staff-placement
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer collections joined by foreign keys. Only five read paths are nested
  # (`/clients/{id}/ledger-entries`, `/candidates/{id}/background-verifications`,
  # `/placements/{id}/fee-milestones`, `/placements/{id}/replacement-claims`,
  # `/placements/{id}/payroll-handoffs`); every other resource is addressed at
  # top level with FK fields carried in the body.

  state_machine_shape: cyclic
  # Cyclic is the dominant shape: RoleRequisition SOURCING -> SCOPING -> SOURCING
  # (re-scope rounds), AccommodationTerm COUNTERED -> COUNTERED (negotiation
  # rounds), ReplacementClaim UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW,
  # BackgroundVerification INCONCLUSIVE -> INCONCLUSIVE (re-runs), Candidate
  # vetting REJECTED -> SCREENING, Candidate availability COOLING_OFF ->
  # AVAILABLE, Client ONBOARDED -> SUSPENDED -> ONBOARDED. Two entities also
  # carry parallel state dimensions (Candidate: vetting_status x
  # availability_status; Placement: placement_status x billing_status) and
  # BackgroundVerification branches INITIATED -> {CLEARED | FLAGGED |
  # INCONCLUSIVE} with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # Client -> RoleRequisition -> TrialEngagement
    - many_to_many         # Candidate <-> RoleRequisition via TrialEngagement / AccommodationTerm
    - self_referential     # ReferenceCheck.prior_reference_id -> ReferenceCheck.id (the reference chain)
    - polymorphic          # LedgerEntry.related_ref_type + related_ref_id
    - cross_aggregate      # FeeMilestone gating reads PayrollHandoff across aggregate boundaries

  role_model: segregation_of_duties
  # Two hard SoD rules: (1) the VettingSpecialist X-User-ID that created a
  # ReferenceCheck may not be the X-User-ID that verifies it; (2) the
  # ComplianceOfficer X-User-ID that opened a NonSolicitationCase may not be the
  # X-User-ID that resolves it. Layered on top of peer-role ownership
  # (PlacementConsultant / VettingSpecialist / BillingAdministrator /
  # ComplianceOfficer / AgencyPrincipal) plus two entity-backed principals
  # (Client, Candidate).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

global_constants:
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
  MILESTONE_WEIGHTS_BPS: { ENGAGEMENT: 3000, TRIAL_CLEARED: 3000, START_DATE: 4000 }
  NET_TERMS_DAYS: 14
  PRESENTATION_MIN_SCORE: 70
  MIN_VERIFIED_REFERENCES: 2
  MIN_CHAIN_MONTHS_SENIOR: 24          # ESTATE_MANAGER, CHEF
  MIN_CHAIN_MONTHS_STANDARD: 12        # HOUSEKEEPER, CHAUFFEUR
  MIN_CHAIN_MONTHS_VETTING_GATE: 12    # gate for vetting_status REFERENCES_VERIFIED
  TRIAL_BUFFER_MINUTES: 120
  CANDIDATE_WEEKLY_TRIAL_CAP: 2
  MAX_SCOPING_ROUNDS: 3
  MAX_NEGOTIATION_ROUNDS: 4
  CREDIT_HOLD_LIMIT_CENTS: 5000000
  COOLING_OFF_DAYS: 30
  NON_SOLICITATION_TERM_DAYS: 730
  PENALTY_FLOOR_CENTS: 750000
  PENALTY_CAP_CENTS: 7500000
  ADMIN_RETENTION_TIER_BPS: { UNDER_1M: 500, ONE_TO_3M: 750, AT_OR_OVER_3M: 1000 }

entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: household_name
        type: string
        source: input
        description: Principal household name used on the engagement letter.
        constraints: 1..120 chars, required
      - name: primary_contact_email
        type: string
        source: input
        description: Household point of contact.
        constraints: must contain '@', required
      - name: region_code
        type: enum
        source: input
        description: Service region driving the payroll guidance packet.
        constraints: one of {NY, CA, FL, TX, MA}
      - name: status
        type: enum
        source: computed
        description: Client lifecycle state; see state_machines.Client.
        default: PROSPECT
        constraints: one of {PROSPECT, ONBOARDED, SUSPENDED}
      - name: confidentiality_agreement_status
        type: enum
        source: computed
        description: Two-party NDA progress; COUNTERSIGNED is the gate for role scoping.
        default: UNSIGNED
        constraints: one of {UNSIGNED, SIGNED, COUNTERSIGNED}
      - name: signatory_name
        type: string
        source: computed
        description: Name captured on the client's SIGN action; null until signed.
      - name: countersigned_at
        type: datetime
        source: computed
        description: Logical-clock instant of the agency COUNTERSIGN action; null until countersigned.
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: Sum of signed_amount_cents over every LedgerEntry whose client_id equals this client's id (calculations.client_outstanding_balance). May be negative.
        default: 0
      - name: placement_count
        type: integer
        source: computed
        description: Count of Placement rows with client_id == this client and placement_status IN {ACTIVE, GUARANTEE_EXPIRED, TERMINATED_REPLACED, TERMINATED_REFUNDED, TERMINATED_NO_REMEDY}.
        default: 0
      - name: non_solicitation_expires_on
        type: string
        source: computed
        description: Latest start_date among the client's Placement rows with placement_status != VOIDED, plus NON_SOLICITATION_TERM_DAYS; null when placement_count == 0. ISO date.

  - name: FeeSchedule
    parent: null
    common_fields: true
    fields:
      - name: role_type
        type: enum
        source: input
        description: Role family this schedule prices.
        constraints: one of {ESTATE_MANAGER, HOUSEKEEPER, CHEF, CHAUFFEUR}
      - name: comp_band_floor_cents
        type: integer
        source: input
        description: Inclusive lower bound of the first-year compensation band.
        constraints: integer >= 0
      - name: comp_band_ceiling_cents
        type: integer
        source: input
        description: Inclusive upper bound of the band; null means unbounded above.
        constraints: null or integer >= comp_band_floor_cents
      - name: fee_percent_bps
        type: integer
        source: input
        description: Placement fee as basis points of first-year compensation.
        constraints: 1..5000
      - name: guarantee_window_days
        type: integer
        source: input
        description: Replacement guarantee length in days, snapshotted onto Placement at confirm-start.
        constraints: 1..730
      - name: effective_from
        type: string
        source: input
        description: ISO date from which this schedule may be selected.
        constraints: ISO date YYYY-MM-DD
      - name: status
        type: enum
        source: computed
        description: Only ACTIVE rows enter the fee-schedule candidate set.
        default: ACTIVE
        constraints: one of {ACTIVE, RETIRED}

  - name: RoleRequisition
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; the household this search serves.
      - name: role_type
        type: enum
        source: input
        description: Role being searched.
        constraints: one of {ESTATE_MANAGER, HOUSEKEEPER, CHEF, CHAUFFEUR}
      - name: first_year_compensation_cents
        type: integer
        source: input
        description: Scoped first-year compensation used by the PROVISIONAL fee variant.
        constraints: integer >= 100000
      - name: live_in_required
        type: boolean
        source: input
        description: Whether the household requires live-in accommodation.
        default: false
      - name: schedule_pattern
        type: enum
        source: input
        description: Working-schedule template negotiated with the candidate.
        default: FIVE_TWO
        constraints: one of {FIVE_TWO, SIX_ONE, ROTA_TWO_TWO, ON_CALL}
      - name: scope_note
        type: string
        source: input
        description: Free-text scoping brief captured on the latest scope action.
      - name: status
        type: enum
        source: computed
        description: Search lifecycle; see state_machines.RoleRequisition.
        default: DRAFT
        constraints: one of {DRAFT, SCOPING, SOURCING, TRIALING, OFFER_PENDING, PLACED, WITHDRAWN}
      - name: scoping_round
        type: integer
        source: computed
        description: Number of completed entries into SCOPING; capped by MAX_SCOPING_ROUNDS.
        default: 0
      - name: resolved_fee_schedule_id
        type: string
        source: computed
        description: FK -> FeeSchedule.id; row selected by calculations.fee_percent_resolution at finalize-scope. Null while status IN {DRAFT, SCOPING}.
      - name: fee_percent_bps
        type: integer
        source: computed
        description: fee_percent_bps copied from resolved_fee_schedule_id at finalize-scope.
      - name: guarantee_window_days
        type: integer
        source: computed
        description: guarantee_window_days copied from resolved_fee_schedule_id at finalize-scope.
      - name: provisional_fee_cents
        type: integer
        source: computed
        description: PROVISIONAL variant output of calculations.placement_fee_computation, stamped at finalize-scope.
      - name: active_trial_count
        type: integer
        source: computed
        description: Count of TrialEngagement rows with requisition_id == this id and status IN {SCHEDULED, IN_PROGRESS}.
        default: 0
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the PlacementConsultant that created the requisition.

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Candidate legal name.
        constraints: 1..120 chars, required
      - name: contact_email
        type: string
        source: input
        description: Candidate contact email.
        constraints: must contain '@', required
      - name: primary_role_type
        type: enum
        source: input
        description: Role family the candidate is represented for.
        constraints: one of {ESTATE_MANAGER, HOUSEKEEPER, CHEF, CHAUFFEUR}
      - name: years_experience
        type: integer
        source: input
        description: Whole years of household-service experience; feeds experience_points.
        constraints: integer 0..60
      - name: live_in_willing
        type: boolean
        source: input
        description: Whether the candidate will accept live-in accommodation.
        default: false
      - name: vetting_status
        type: enum
        source: computed
        description: First parallel state dimension; see state_machines.Candidate (state_field vetting_status).
        default: UNVETTED
        constraints: one of {UNVETTED, SCREENING, REFERENCES_VERIFIED, BACKGROUND_PENDING, CLEARED, REJECTED}
      - name: availability_status
        type: enum
        source: computed
        description: Second parallel state dimension; see state_machines.Candidate (state_field availability_status). Evolves independently of vetting_status.
        default: AVAILABLE
        constraints: one of {AVAILABLE, ON_TRIAL, OFFER_HELD, PLACED, COOLING_OFF, INACTIVE}
      - name: cooling_off_until
        type: string
        source: computed
        description: ISO date before which release-availability is refused while availability_status == COOLING_OFF; null otherwise.
      - name: verified_reference_count
        type: integer
        source: computed
        description: Count of ReferenceCheck rows for this candidate with status == VERIFIED.
        default: 0
      - name: reference_coverage_months
        type: integer
        source: computed
        description: total_coverage_months output of calculations.reference_chain_coverage.
        default: 0
      - name: longest_contiguous_months
        type: integer
        source: computed
        description: longest_contiguous_months output of calculations.reference_chain_coverage.
        default: 0
      - name: screening_score
        type: integer
        source: computed
        description: SCREENING variant output of calculations.candidate_vetting_score; gate for presenting the candidate to a household.
        default: 0
      - name: placement_ready_score
        type: integer
        source: computed
        description: PLACEMENT_READY variant output of calculations.candidate_vetting_score; gate for extending an offer. Diverges from screening_score because it also consumes background results and DISPUTED references.
        default: 0

  - name: ReferenceCheck
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: FK -> Candidate.id; the candidate being referenced.
      - name: prior_reference_id
        type: string
        source: input
        description: FK -> ReferenceCheck.id; the immediately older link in this candidate's reference chain. Null for the chain head.
      - name: principal_employer_name
        type: string
        source: input
        description: Household or agency that employed the candidate for this period.
        constraints: 1..120 chars, required
      - name: relationship_type
        type: enum
        source: input
        description: Referee relationship; drives the reference base weight (PRINCIPAL_EMPLOYER 12, AGENCY_SUPERVISOR 8, PEER 4).
        constraints: one of {PRINCIPAL_EMPLOYER, AGENCY_SUPERVISOR, PEER}
      - name: employment_start_month
        type: string
        source: input
        description: Inclusive first month of the employment period, YYYY-MM.
        constraints: matches ^\d{4}-(0[1-9]|1[0-2])$
      - name: employment_end_month
        type: string
        source: input
        description: Inclusive last month of the employment period, YYYY-MM; must be >= employment_start_month.
        constraints: matches ^\d{4}-(0[1-9]|1[0-2])$
      - name: contact_email
        type: string
        source: input
        description: Referee email.
        constraints: must contain '@', required
      - name: status
        type: enum
        source: computed
        description: Verification outcome; see state_machines.ReferenceCheck.
        default: PENDING
        constraints: one of {PENDING, VERIFIED, UNREACHABLE, DISPUTED}
      - name: verification_note
        type: string
        source: computed
        description: Note recorded by the verifying VettingSpecialist; null while PENDING.
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID that created this reference row (SoD subject).
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID that recorded the verification outcome; must differ from created_by_user_id.

  - name: BackgroundVerification
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: FK -> Candidate.id; subject of the background screen.
      - name: provider_reference
        type: string
        source: input
        description: Vendor order reference.
        constraints: 1..64 chars, required
      - name: scope_items
        type: array
        source: input
        description: Screen components ordered from the vendor.
        constraints: non-empty array of {IDENTITY, CRIMINAL, DMV, CREDENTIAL, SOCIAL_MEDIA}
      - name: status
        type: enum
        source: computed
        description: Branching screen state; see state_machines.BackgroundVerification.
        default: INITIATED
        constraints: one of {INITIATED, CLEARED, FLAGGED, INCONCLUSIVE, ADJUDICATED_PASS, ADJUDICATED_FAIL}
      - name: findings_note
        type: string
        source: computed
        description: Vendor findings captured on record-result; null while INITIATED.
      - name: rerun_count
        type: integer
        source: computed
        description: Number of record-result calls made from an INCONCLUSIVE status.
        default: 0
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the VettingSpecialist that recorded the latest result.
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: X-User-ID of the AgencyPrincipal that adjudicated a FLAGGED result.
      - name: waiver_note
        type: string
        source: computed
        description: Justification recorded on an ADJUDICATED_PASS disposition.

  - name: TrialEngagement
    parent: null
    common_fields: true
    fields:
      - name: requisition_id
        type: string
        source: input
        description: FK -> RoleRequisition.id; the search this trial serves.
      - name: candidate_id
        type: string
        source: input
        description: FK -> Candidate.id; the presented candidate.
      - name: client_id
        type: string
        source: computed
        description: FK -> Client.id; denormalised from the requisition so household-slot overlap is a single-table check.
      - name: engagement_type
        type: enum
        source: input
        description: Trial day (paid, in-household) or working interview (unpaid observation).
        constraints: one of {TRIAL_DAY, WORKING_INTERVIEW}
      - name: start_at
        type: datetime
        source: input
        description: Inclusive window start, ISO 8601 UTC with three fractional digits.
      - name: end_at
        type: datetime
        source: input
        description: Exclusive window end; must be strictly after start_at.
      - name: day_rate_cents
        type: integer
        source: input
        description: Trial-day rate paid to the candidate; must be 0 when engagement_type == WORKING_INTERVIEW.
        constraints: integer >= 0
      - name: iso_week_key
        type: string
        source: computed
        description: ISO year-week of start_at formatted YYYY-Www (Monday 00:00:00.000Z starts the week); the bucket for CANDIDATE_WEEKLY_TRIAL_CAP.
      - name: status
        type: enum
        source: computed
        description: Trial lifecycle; see state_machines.TrialEngagement.
        default: SCHEDULED
        constraints: one of {SCHEDULED, IN_PROGRESS, PASSED, FAILED, CANCELLED}
      - name: cancel_reason
        type: enum
        source: computed
        description: Why the trial was cancelled; null unless status == CANCELLED.
        constraints: one of {CLIENT_REQUEST, CANDIDATE_WITHDRAWN, VETTING_FAILED, CLIENT_SUSPENDED}
      - name: outcome_note
        type: string
        source: computed
        description: Evaluation note captured on record-outcome.

  - name: AccommodationTerm
    parent: null
    common_fields: true
    fields:
      - name: requisition_id
        type: string
        source: input
        description: FK -> RoleRequisition.id; the search being negotiated.
      - name: candidate_id
        type: string
        source: input
        description: FK -> Candidate.id; the counterparty candidate.
      - name: round_no
        type: integer
        source: computed
        description: Negotiation round; 1 on PROPOSED, incremented on each COUNTER; capped by MAX_NEGOTIATION_ROUNDS.
        default: 1
      - name: live_in
        type: boolean
        source: input
        description: Whether the offered package includes live-in accommodation.
      - name: weekly_hours
        type: integer
        source: input
        description: Contracted weekly hours.
        constraints: integer 20..80
      - name: days_off_per_week
        type: integer
        source: input
        description: Guaranteed days off per week.
        constraints: integer 0..3
      - name: private_quarters
        type: boolean
        source: input
        description: Whether separate private quarters are provided.
        default: false
      - name: imputed_accommodation_cents
        type: integer
        source: input
        description: Annual imputed value of provided accommodation; must be 0 when live_in is false.
        constraints: integer >= 0
      - name: status
        type: enum
        source: computed
        description: Negotiation state; see state_machines.AccommodationTerm.
        default: PROPOSED
        constraints: one of {PROPOSED, COUNTERED, ACCEPTED, REJECTED, SUPERSEDED}
      - name: last_responder_role
        type: enum
        source: computed
        description: Party that most recently moved the term.
        default: AGENCY
        constraints: one of {AGENCY, CLIENT, CANDIDATE}
      - name: note
        type: string
        source: computed
        description: Free-text note from the most recent response.

  - name: Placement
    parent: null
    common_fields: true
    fields:
      - name: requisition_id
        type: string
        source: input
        description: FK -> RoleRequisition.id; the fulfilled search.
      - name: candidate_id
        type: string
        source: input
        description: FK -> Candidate.id; the hired candidate.
      - name: client_id
        type: string
        source: computed
        description: FK -> Client.id; denormalised from the requisition for ledger and credit checks.
      - name: snapshot_fee_schedule_id
        type: string
        source: computed
        description: FK -> FeeSchedule.id; the schedule row pinned by the active fee variant.
      - name: start_date
        type: string
        source: input
        description: ISO date the placement begins; also the guarantee-window origin.
      - name: base_salary_cents
        type: integer
        source: input
        description: Annual base salary component.
        constraints: integer >= 0
      - name: guaranteed_bonus_cents
        type: integer
        source: input
        description: Contractually guaranteed annual bonus component.
        constraints: integer >= 0
      - name: accommodation_imputed_cents
        type: integer
        source: input
        description: Imputed annual value of live-in accommodation component.
        constraints: integer >= 0
      - name: overtime_allowance_cents
        type: integer
        source: input
        description: Budgeted annual overtime allowance component.
        constraints: integer >= 0
      - name: actual_first_year_compensation_cents
        type: integer
        source: computed
        description: base_salary_cents + guaranteed_bonus_cents + accommodation_imputed_cents + overtime_allowance_cents.
      - name: fee_variant
        type: enum
        source: computed
        description: Which variant of calculations.placement_fee_computation produced fee_cents.
        default: PROVISIONAL
        constraints: one of {PROVISIONAL, FINAL}
      - name: fee_percent_bps
        type: integer
        source: computed
        description: Basis points from snapshot_fee_schedule_id under the active variant.
      - name: fee_cents
        type: integer
        source: computed
        description: Placement fee under the active variant; the conserved total that FeeMilestone rows must sum to.
      - name: guarantee_window_days
        type: integer
        source: computed
        description: guarantee_window_days snapshotted from snapshot_fee_schedule_id.
      - name: guarantee_expires_on
        type: string
        source: computed
        description: start_date + guarantee_window_days days, ISO date; the window is half-open [start_date, guarantee_expires_on).
      - name: placement_status
        type: enum
        source: computed
        description: First parallel dimension; see state_machines.Placement (state_field placement_status).
        default: PENDING_ACCEPTANCE
        constraints: one of {PENDING_ACCEPTANCE, ACTIVE, VOIDED, TERMINATED_NO_REMEDY, TERMINATED_REPLACED, TERMINATED_REFUNDED, GUARANTEE_EXPIRED}
      - name: billing_status
        type: enum
        source: computed
        description: Second parallel dimension; see state_machines.Placement (state_field billing_status). Evolves independently of placement_status.
        default: UNBILLED
        constraints: one of {UNBILLED, PARTIALLY_BILLED, FULLY_BILLED, REVERSED, REFUNDED}
      - name: separation_date
        type: string
        source: computed
        description: ISO date the placed employee separated; null while never terminated.
      - name: void_reason
        type: enum
        source: computed
        description: Why the placement was voided; null unless placement_status == VOIDED.
        constraints: one of {SUPERSEDED_BY_NEW_OFFER, CLIENT_WITHDRAWN}
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the PlacementConsultant that created the placement.

  - name: FeeMilestone
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: FK -> Placement.id; the placement being billed.
      - name: milestone_type
        type: enum
        source: computed
        description: Billing trigger for this installment.
        constraints: one of {ENGAGEMENT, TRIAL_CLEARED, START_DATE}
      - name: sequence_no
        type: integer
        source: computed
        description: 1 for ENGAGEMENT, 2 for TRIAL_CLEARED, 3 for START_DATE; the pinned allocation and list order.
      - name: weight_bps
        type: integer
        source: computed
        description: Nominal share of the placement fee from MILESTONE_WEIGHTS_BPS.
      - name: amount_cents
        type: integer
        source: computed
        description: Allocated amount from calculations.milestone_billing_schedule.
      - name: invoice_status
        type: enum
        source: computed
        description: Billing state; see state_machines.FeeMilestone.
        default: PENDING
        constraints: one of {PENDING, INVOICED, OVERDUE, PAID, REVERSED, VOIDED}
      - name: invoiced_on
        type: string
        source: computed
        description: ISO date (logical clock) the milestone was invoiced; null while PENDING.
      - name: due_date
        type: string
        source: computed
        description: invoiced_on + NET_TERMS_DAYS days; the OVERDUE sweep boundary.
      - name: paid_on
        type: string
        source: computed
        description: ISO date the payment was recorded.
      - name: payment_reference
        type: string
        source: computed
        description: Remittance reference captured on record-payment.
      - name: invoiced_by_user_id
        type: string
        source: system
        description: X-User-ID of the BillingAdministrator that invoiced this milestone.

  - name: ReplacementClaim
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: FK -> Placement.id; the placement under guarantee.
      - name: requested_remedy
        type: enum
        source: input
        description: Remedy the household asks for.
        constraints: one of {REPLACEMENT, REFUND}
      - name: separation_date
        type: string
        source: input
        description: ISO date the placed employee left; must fall in [placement.start_date, placement.guarantee_expires_on).
      - name: narrative
        type: string
        source: input
        description: Household account of the separation.
        constraints: 1..2000 chars, required
      - name: status
        type: enum
        source: computed
        description: Claim adjudication state; see state_machines.ReplacementClaim.
        default: SUBMITTED
        constraints: one of {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, APPROVED_REPLACEMENT, APPROVED_REFUND, DENIED, SUPERSEDED}
      - name: info_request_round
        type: integer
        source: computed
        description: Number of REQUEST_INFO cycles completed on this claim.
        default: 0
      - name: elapsed_days
        type: integer
        source: computed
        description: separation_date - placement.start_date in whole days (half-open, so a same-day separation is 0).
      - name: unused_days
        type: integer
        source: computed
        description: max(0, placement.guarantee_window_days - elapsed_days).
      - name: gross_refund_cents
        type: integer
        source: computed
        description: Step 1 of calculations.replacement_refund_proration; null until an APPROVE_REFUND decision.
      - name: retained_admin_fee_cents
        type: integer
        source: computed
        description: Step 3 of calculations.replacement_refund_proration; null until an APPROVE_REFUND decision.
      - name: net_refund_cents
        type: integer
        source: computed
        description: Step 4 of calculations.replacement_refund_proration; the amount credited to the client ledger.
      - name: decision_note
        type: string
        source: computed
        description: Reviewer note from the most recent review action.

  - name: PayrollHandoff
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: FK -> Placement.id; the placement whose household-employer payroll is handed off.
      - name: provider_name
        type: string
        source: input
        description: Household payroll provider taking over withholding and filings.
        constraints: 1..120 chars, required
      - name: ein_status
        type: enum
        source: input
        description: Household employer identification number progress.
        constraints: one of {NOT_APPLIED, APPLIED, ISSUED}
      - name: guidance_packet_version
        type: string
        source: input
        description: Version tag of the state-specific tax guidance packet delivered.
        constraints: 1..32 chars, required
      - name: status
        type: enum
        source: computed
        description: Handoff state; see state_machines.PayrollHandoff.
        default: PREPARED
        constraints: one of {PREPARED, ATTESTED}
      - name: attested_by_name
        type: string
        source: computed
        description: Name recorded on the household attestation; null while PREPARED.
      - name: attested_at
        type: datetime
        source: computed
        description: Logical-clock instant of the attestation.

  - name: NonSolicitationCase
    parent: null
    common_fields: true
    fields:
      - name: respondent_client_id
        type: string
        source: input
        description: FK -> Client.id; the household accused of poaching.
      - name: candidate_id
        type: string
        source: input
        description: FK -> Candidate.id; the solicited candidate.
      - name: source_placement_id
        type: string
        source: input
        description: FK -> Placement.id; the placement that established the non-solicitation duty. Null when the candidate was only presented, never placed.
      - name: allegation_note
        type: string
        source: input
        description: Description of the alleged direct approach.
        constraints: 1..2000 chars, required
      - name: discovered_on
        type: string
        source: input
        description: ISO date the agency learned of the approach.
      - name: status
        type: enum
        source: computed
        description: Enforcement state; see state_machines.NonSolicitationCase.
        default: ALLEGED
        constraints: one of {ALLEGED, INVESTIGATING, SUBSTANTIATED, UNSUBSTANTIATED, SETTLED}
      - name: prior_substantiated_count
        type: integer
        source: computed
        description: Count of other NonSolicitationCase rows with the same respondent_client_id, status IN {SUBSTANTIATED, SETTLED}, and substantiated_at strictly before this case's investigation_opened_at. Frozen at the resolve step.
        default: 0
      - name: penalty_cents
        type: integer
        source: computed
        description: Output of calculations.non_solicitation_penalty; null until SUBSTANTIATED.
      - name: settlement_amount_cents
        type: integer
        source: input
        description: Negotiated settlement recorded at the settle step; must be <= penalty_cents.
      - name: investigation_opened_at
        type: datetime
        source: computed
        description: Logical-clock instant the case entered INVESTIGATING.
      - name: substantiated_at
        type: datetime
        source: computed
        description: Logical-clock instant the case became SUBSTANTIATED; null otherwise.
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer that filed the case (SoD subject).
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer that resolved the case; must differ from opened_by_user_id.
      - name: findings_note
        type: string
        source: computed
        description: Investigation findings captured at resolve.

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: client_id
        type: string
        source: computed
        description: FK -> Client.id; the household whose receivable this entry moves.
      - name: sequence_no
        type: integer
        source: computed
        description: 1-based monotonic counter within a client; the pinned append and list order.
      - name: entry_type
        type: enum
        source: input
        description: Movement kind. Sign convention is fixed per kind.
        constraints: one of {FEE_INVOICED, FEE_PAYMENT, FEE_REVERSAL, REFUND_ISSUED, PENALTY_ASSESSED, PENALTY_SETTLED, MANUAL_ADJUSTMENT}
      - name: signed_amount_cents
        type: integer
        source: input
        description: Signed movement; positive increases the receivable (FEE_INVOICED, PENALTY_ASSESSED), negative decreases it (FEE_PAYMENT, FEE_REVERSAL, REFUND_ISSUED, PENALTY_SETTLED). MANUAL_ADJUSTMENT may be either sign but not zero.
        constraints: non-zero integer
      - name: related_ref_type
        type: enum
        source: computed
        description: Polymorphic tag of the object that caused this entry.
        default: NONE
        constraints: one of {NONE, PLACEMENT, FEE_MILESTONE, REPLACEMENT_CLAIM, NON_SOLICITATION_CASE}
      - name: related_ref_id
        type: string
        source: computed
        description: Id of the object named by related_ref_type; null when related_ref_type == NONE. Deliberately NOT a declared FK - it is polymorphic and resolved by related_ref_type.
      - name: memo
        type: string
        source: input
        description: Human-readable reason.
        constraints: 1..200 chars
      - name: balance_after_cents
        type: integer
        source: computed
        description: Client.outstanding_balance_cents immediately after this entry was appended.

state_machines:
  - entity: Client
    state_field: status
    initial_state: PROSPECT
    terminal_states: []
    transitions:
      - from: PROSPECT
        to: ONBOARDED
        trigger: "POST /clients/{id}/confidentiality-agreement with action=COUNTERSIGN"
        actor: AgencyPrincipal
        preconditions:
          - "Client.confidentiality_agreement_status == SIGNED"
        side_effects:
          - "set Client.confidentiality_agreement_status = COUNTERSIGNED"
          - "set Client.countersigned_at = logical clock"
          - "increment Client.version by 1"
        note: "PROSPECT -> ONBOARDED is the only path that unlocks role scoping."
      - from: ONBOARDED
        to: SUSPENDED
        trigger: "system event: a NonSolicitationCase with respondent_client_id == this client reaches SUBSTANTIATED"
        actor: system
        preconditions:
          - "Client.status == ONBOARDED"
        side_effects:
          - "cascade hop 3: recompute Client.outstanding_balance_cents from the ledger fold"
          - "cascade hop 4: because the client is now SUSPENDED, every TrialEngagement with client_id == this client and status == SCHEDULED transitions to CANCELLED with cancel_reason = CLIENT_SUSPENDED"
          - "cascade hop 5: because those trials were cancelled, every RoleRequisition of this client with status == TRIALING whose recomputed active_trial_count == 0 transitions to SOURCING"
          - "each cancelled trial sets its Candidate.availability_status from ON_TRIAL back to AVAILABLE"
          - "increment Client.version by 1"
      - from: SUSPENDED
        to: ONBOARDED
        trigger: "POST /non-solicitation-cases/{id}/settle"
        actor: BillingAdministrator
        preconditions:
          - "no other NonSolicitationCase with respondent_client_id == this client has status == SUBSTANTIATED after this settlement"
        side_effects:
          - "append LedgerEntry PENALTY_SETTLED with signed_amount_cents = -settlement_amount_cents"
          - "recompute Client.outstanding_balance_cents"
          - "increment Client.version by 1"
        note: "Cyclic: a household can be suspended and reinstated repeatedly."

  - entity: FeeSchedule
    state_field: status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /fee-schedules/{id}/retire"
        actor: AgencyPrincipal
        preconditions:
          - "FeeSchedule.status == ACTIVE"
        side_effects:
          - "row leaves the calculations.fee_percent_resolution candidate set for all future resolutions"
          - "already-stamped RoleRequisition.resolved_fee_schedule_id and Placement.snapshot_fee_schedule_id references are left untouched (version pinning)"
          - "increment FeeSchedule.version by 1"

  - entity: RoleRequisition
    state_field: status
    initial_state: DRAFT
    terminal_states: [PLACED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SCOPING
        trigger: "POST /role-requisitions/{id}/scope"
        actor: PlacementConsultant | Client
        preconditions:
          - "Client(client_id).confidentiality_agreement_status == COUNTERSIGNED"
          - "Client(client_id).status == ONBOARDED"
          - "RoleRequisition.scoping_round < MAX_SCOPING_ROUNDS"
        side_effects:
          - "increment RoleRequisition.scoping_round by 1"
          - "overwrite scope_note, and first_year_compensation_cents / live_in_required / schedule_pattern when supplied"
          - "increment RoleRequisition.version by 1"
      - from: SOURCING
        to: SCOPING
        trigger: "POST /role-requisitions/{id}/scope"
        actor: PlacementConsultant | Client
        preconditions:
          - "Client(client_id).status == ONBOARDED"
          - "RoleRequisition.scoping_round < MAX_SCOPING_ROUNDS"
          - "RoleRequisition.active_trial_count == 0"
        side_effects:
          - "increment RoleRequisition.scoping_round by 1"
          - "clear resolved_fee_schedule_id, fee_percent_bps, guarantee_window_days and provisional_fee_cents to null"
          - "increment RoleRequisition.version by 1"
        note: "The re-scope loop: SOURCING -> SCOPING -> SOURCING. Fee inputs are discarded so the next finalize-scope re-resolves the schedule."
      - from: SCOPING
        to: SOURCING
        trigger: "POST /role-requisitions/{id}/finalize-scope"
        actor: PlacementConsultant
        preconditions:
          - "RoleRequisition.status == SCOPING"
          - "calculations.fee_percent_resolution yields a non-empty candidate set for (role_type, first_year_compensation_cents)"
        side_effects:
          - "run calculations.fee_percent_resolution; stamp resolved_fee_schedule_id, fee_percent_bps, guarantee_window_days"
          - "run calculations.placement_fee_computation variant PROVISIONAL; stamp provisional_fee_cents"
          - "increment RoleRequisition.version by 1"
      - from: SOURCING
        to: TRIALING
        trigger: "POST /role-requisitions/{id}/trial-engagements"
        actor: PlacementConsultant
        preconditions:
          - "RoleRequisition.status == SOURCING"
        side_effects:
          - "recompute RoleRequisition.active_trial_count"
          - "increment RoleRequisition.version by 1"
      - from: TRIALING
        to: TRIALING
        trigger: "POST /role-requisitions/{id}/trial-engagements (an additional candidate presented while a trial is already live)"
        actor: PlacementConsultant
        preconditions:
          - "RoleRequisition.status == TRIALING"
        side_effects:
          - "recompute RoleRequisition.active_trial_count"
          - "increment RoleRequisition.version by 1"
      - from: TRIALING
        to: SOURCING
        trigger: "system event: the requisition's last non-terminal TrialEngagement leaves {SCHEDULED, IN_PROGRESS} (record-outcome FAILED, or cancel)"
        actor: system
        preconditions:
          - "recomputed RoleRequisition.active_trial_count == 0"
          - "no Placement with requisition_id == this id has placement_status == PENDING_ACCEPTANCE"
        side_effects:
          - "recompute RoleRequisition.active_trial_count to 0"
          - "increment RoleRequisition.version by 1"
      - from: TRIALING
        to: OFFER_PENDING
        trigger: "POST /placements"
        actor: PlacementConsultant
        preconditions:
          - "RoleRequisition.status == TRIALING"
          - "a TrialEngagement with requisition_id == this id, candidate_id == the offered candidate and status == PASSED exists"
        side_effects:
          - "recompute active_trial_count"
          - "increment RoleRequisition.version by 1"
      - from: OFFER_PENDING
        to: OFFER_PENDING
        trigger: "POST /placements (supersede path, guarded by concurrency_rules.placement-create-supersedes-offer)"
        actor: PlacementConsultant
        preconditions:
          - "exactly one Placement with requisition_id == this id has placement_status == PENDING_ACCEPTANCE"
          - "payload expected_requisition_version == RoleRequisition.version"
        side_effects:
          - "cascade hop 1: the incumbent PENDING_ACCEPTANCE Placement transitions to VOIDED with void_reason = SUPERSEDED_BY_NEW_OFFER"
          - "increment RoleRequisition.version by 1"
        note: "A household may switch candidates while an offer is outstanding; the newer Placement legitimately supersedes the older one."
      - from: OFFER_PENDING
        to: SOURCING
        trigger: "system event: the requisition's only PENDING_ACCEPTANCE Placement becomes VOIDED and no replacement offer exists"
        actor: system
        preconditions:
          - "no Placement with requisition_id == this id has placement_status IN {PENDING_ACCEPTANCE, ACTIVE}"
        side_effects:
          - "increment RoleRequisition.version by 1"
      - from: OFFER_PENDING
        to: PLACED
        trigger: "POST /placements/{id}/confirm-start"
        actor: AgencyPrincipal
        preconditions:
          - "the Placement being confirmed has requisition_id == this id and placement_status == PENDING_ACCEPTANCE"
        side_effects:
          - "increment RoleRequisition.version by 1"
      - from: PLACED
        to: SOURCING
        trigger: "system event: a ReplacementClaim on this requisition's ACTIVE placement reaches APPROVED_REPLACEMENT"
        actor: system
        preconditions:
          - "RoleRequisition.status == PLACED"
        side_effects:
          - "increment RoleRequisition.version by 1"
        note: "A granted replacement reopens the search without consuming a scoping round."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /role-requisitions/{id}/withdraw"
        actor: PlacementConsultant | Client
        preconditions:
          - "RoleRequisition.status IN {DRAFT, SCOPING, SOURCING, TRIALING}"
        side_effects:
          - "every TrialEngagement of this requisition with status IN {SCHEDULED, IN_PROGRESS} transitions to CANCELLED with cancel_reason = CLIENT_REQUEST"
          - "every AccommodationTerm of this requisition with status IN {PROPOSED, COUNTERED} transitions to REJECTED"
          - "increment RoleRequisition.version by 1"
      - from: SCOPING
        to: WITHDRAWN
        trigger: "POST /role-requisitions/{id}/withdraw"
        actor: PlacementConsultant | Client
        preconditions:
          - "RoleRequisition.status == SCOPING"
        side_effects:
          - "increment RoleRequisition.version by 1"
      - from: SOURCING
        to: WITHDRAWN
        trigger: "POST /role-requisitions/{id}/withdraw"
        actor: PlacementConsultant | Client
        preconditions:
          - "RoleRequisition.status == SOURCING"
        side_effects:
          - "increment RoleRequisition.version by 1"
      - from: TRIALING
        to: WITHDRAWN
        trigger: "POST /role-requisitions/{id}/withdraw"
        actor: PlacementConsultant | Client
        preconditions:
          - "RoleRequisition.status == TRIALING"
        side_effects:
          - "every TrialEngagement of this requisition with status IN {SCHEDULED, IN_PROGRESS} transitions to CANCELLED with cancel_reason = CLIENT_REQUEST, each restoring its Candidate.availability_status to AVAILABLE"
          - "increment RoleRequisition.version by 1"

  - entity: Candidate
    state_field: vetting_status
    initial_state: UNVETTED
    terminal_states: []
    transitions:
      - from: UNVETTED
        to: SCREENING
        trigger: "POST /candidates/{id}/reference-checks (first reference row)"
        actor: VettingSpecialist
        preconditions:
          - "Candidate.vetting_status == UNVETTED"
        side_effects:
          - "recompute verified_reference_count, reference_coverage_months, longest_contiguous_months"
          - "increment Candidate.version by 1"
      - from: REJECTED
        to: SCREENING
        trigger: "POST /candidates/{id}/reference-checks (re-vetting a previously rejected candidate)"
        actor: VettingSpecialist
        preconditions:
          - "Candidate.vetting_status == REJECTED"
        side_effects:
          - "increment Candidate.version by 1"
        note: "Cyclic re-entry: a rejected candidate can be re-vetted from scratch by adding a new reference."
      - from: SCREENING
        to: REFERENCES_VERIFIED
        trigger: "POST /reference-checks/{id}/verify with outcome=VERIFIED"
        actor: VettingSpecialist
        preconditions:
          - "recomputed Candidate.verified_reference_count >= MIN_VERIFIED_REFERENCES"
          - "recomputed Candidate.longest_contiguous_months >= MIN_CHAIN_MONTHS_VETTING_GATE"
        side_effects:
          - "recompute verified_reference_count, reference_coverage_months, longest_contiguous_months"
          - "increment Candidate.version by 1"
      - from: REFERENCES_VERIFIED
        to: BACKGROUND_PENDING
        trigger: "POST /candidates/{id}/background-verifications"
        actor: VettingSpecialist
        preconditions:
          - "Candidate.vetting_status == REFERENCES_VERIFIED"
        side_effects:
          - "increment Candidate.version by 1"
      - from: BACKGROUND_PENDING
        to: CLEARED
        trigger: "system event: a BackgroundVerification of this candidate reaches CLEARED or ADJUDICATED_PASS"
        actor: system
        preconditions:
          - "Candidate.vetting_status == BACKGROUND_PENDING"
        side_effects:
          - "increment Candidate.version by 1"
      - from: BACKGROUND_PENDING
        to: REJECTED
        trigger: "system event: a BackgroundVerification of this candidate reaches ADJUDICATED_FAIL"
        actor: system
        preconditions:
          - "Candidate.vetting_status == BACKGROUND_PENDING"
        side_effects:
          - "cascade hop 2: because the candidate is now REJECTED, every TrialEngagement with candidate_id == this candidate and status IN {SCHEDULED, IN_PROGRESS} transitions to CANCELLED with cancel_reason = VETTING_FAILED"
          - "set Candidate.availability_status = INACTIVE and clear cooling_off_until"
          - "increment Candidate.version by 1"

  - entity: Candidate
    state_field: availability_status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ON_TRIAL
        trigger: "POST /role-requisitions/{id}/trial-engagements"
        actor: PlacementConsultant
        preconditions:
          - "Candidate.availability_status == AVAILABLE"
        side_effects:
          - "increment Candidate.version by 1"
      - from: ON_TRIAL
        to: AVAILABLE
        trigger: "POST /trial-engagements/{id}/cancel, or POST /trial-engagements/{id}/record-outcome with outcome=FAILED"
        actor: PlacementConsultant | Client | system
        preconditions:
          - "the candidate holds no other TrialEngagement with status IN {SCHEDULED, IN_PROGRESS} after this transition"
        side_effects:
          - "increment Candidate.version by 1"
        note: "Slot conservation: the candidate returns to the pool exactly as it left it."
      - from: ON_TRIAL
        to: OFFER_HELD
        trigger: "POST /placements"
        actor: PlacementConsultant
        preconditions:
          - "Candidate.availability_status == ON_TRIAL"
        side_effects:
          - "increment Candidate.version by 1"
      - from: OFFER_HELD
        to: OFFER_HELD
        trigger: "POST /placements (supersede path: a revised offer is extended to the candidate who already holds the incumbent PENDING_ACCEPTANCE Placement on the same requisition)"
        actor: PlacementConsultant
        preconditions:
          - "Candidate.availability_status == OFFER_HELD"
          - "the candidate is the candidate_id of the incumbent PENDING_ACCEPTANCE Placement on the requisition named in the request"
        side_effects:
          - "the incumbent Placement is VOIDED with void_reason = SUPERSEDED_BY_NEW_OFFER, which would otherwise return the candidate to AVAILABLE; the new offer holds the slot instead, so the dimension stays at OFFER_HELD"
          - "increment Candidate.version by 1"
      - from: OFFER_HELD
        to: AVAILABLE
        trigger: "system event: the candidate's PENDING_ACCEPTANCE Placement becomes VOIDED"
        actor: system
        preconditions:
          - "Candidate.availability_status == OFFER_HELD"
        side_effects:
          - "increment Candidate.version by 1"
      - from: OFFER_HELD
        to: PLACED
        trigger: "POST /placements/{id}/confirm-start"
        actor: AgencyPrincipal
        preconditions:
          - "Candidate.availability_status == OFFER_HELD"
        side_effects:
          - "increment Candidate.version by 1"
      - from: PLACED
        to: COOLING_OFF
        trigger: "POST /placements/{id}/terminate, or a ReplacementClaim reaching APPROVED_REPLACEMENT or APPROVED_REFUND"
        actor: PlacementConsultant | Client | system
        preconditions:
          - "Candidate.availability_status == PLACED"
        side_effects:
          - "set Candidate.cooling_off_until = logical clock date + COOLING_OFF_DAYS days"
          - "increment Candidate.version by 1"
      - from: COOLING_OFF
        to: AVAILABLE
        trigger: "POST /candidates/{id}/release-availability"
        actor: VettingSpecialist | PlacementConsultant
        preconditions:
          - "logical clock date >= Candidate.cooling_off_until"
        side_effects:
          - "clear cooling_off_until to null"
          - "increment Candidate.version by 1"
        note: "Cyclic: candidates re-enter the pool after the cooling-off period."
      - from: ON_TRIAL
        to: INACTIVE
        trigger: "system event: the candidate's vetting_status becomes REJECTED"
        actor: system
        preconditions:
          - "Candidate.vetting_status == REJECTED"
        side_effects:
          - "clear cooling_off_until to null"
          - "increment Candidate.version by 1"
        note: "Parallel dimensions: the availability axis is driven here by a change on the vetting axis, and only in this direction."
      - from: INACTIVE
        to: AVAILABLE
        trigger: "POST /candidates/{id}/release-availability"
        actor: VettingSpecialist | PlacementConsultant
        preconditions:
          - "Candidate.vetting_status == CLEARED"
        side_effects:
          - "increment Candidate.version by 1"

  - entity: ReferenceCheck
    state_field: status
    initial_state: PENDING
    terminal_states: [VERIFIED, UNREACHABLE, DISPUTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /reference-checks/{id}/verify with outcome=VERIFIED"
        actor: VettingSpecialist
        preconditions:
          - "ReferenceCheck.status == PENDING"
          - "X-User-ID != ReferenceCheck.created_by_user_id"
        side_effects:
          - "stamp verified_by_user_id and verification_note"
          - "recompute Candidate.verified_reference_count, reference_coverage_months, longest_contiguous_months"
          - "possibly advance Candidate.vetting_status SCREENING -> REFERENCES_VERIFIED"
          - "increment ReferenceCheck.version by 1"
      - from: PENDING
        to: UNREACHABLE
        trigger: "POST /reference-checks/{id}/verify with outcome=UNREACHABLE"
        actor: VettingSpecialist
        preconditions:
          - "ReferenceCheck.status == PENDING"
          - "X-User-ID != ReferenceCheck.created_by_user_id"
        side_effects:
          - "stamp verified_by_user_id and verification_note; the row contributes 0 reference weight and 0 coverage months"
          - "increment ReferenceCheck.version by 1"
      - from: PENDING
        to: DISPUTED
        trigger: "POST /reference-checks/{id}/verify with outcome=DISPUTED"
        actor: VettingSpecialist
        preconditions:
          - "ReferenceCheck.status == PENDING"
          - "X-User-ID != ReferenceCheck.created_by_user_id"
        side_effects:
          - "stamp verified_by_user_id and verification_note; the row contributes 0 reference weight and 0 coverage months"
          - "increment ReferenceCheck.version by 1"

  - entity: BackgroundVerification
    state_field: status
    initial_state: INITIATED
    terminal_states: [ADJUDICATED_PASS, ADJUDICATED_FAIL]
    transitions:
      - from: INITIATED
        to: CLEARED
        trigger: "POST /background-verifications/{id}/record-result with result=CLEARED"
        actor: VettingSpecialist
        preconditions:
          - "BackgroundVerification.status IN {INITIATED, INCONCLUSIVE}"
        side_effects:
          - "stamp findings_note and recorded_by_user_id"
          - "advance Candidate.vetting_status BACKGROUND_PENDING -> CLEARED"
          - "increment BackgroundVerification.version by 1"
        note: "Branch 1 of the fork - clean pass, no adjudication needed."
      - from: INITIATED
        to: FLAGGED
        trigger: "POST /background-verifications/{id}/record-result with result=FLAGGED"
        actor: VettingSpecialist
        preconditions:
          - "BackgroundVerification.status IN {INITIATED, INCONCLUSIVE}"
        side_effects:
          - "stamp findings_note and recorded_by_user_id"
          - "Candidate.vetting_status is left at BACKGROUND_PENDING pending adjudication"
          - "increment BackgroundVerification.version by 1"
        note: "Branch 2 of the fork - requires an AgencyPrincipal adjudication to rejoin."
      - from: INITIATED
        to: INCONCLUSIVE
        trigger: "POST /background-verifications/{id}/record-result with result=INCONCLUSIVE"
        actor: VettingSpecialist
        preconditions:
          - "BackgroundVerification.status IN {INITIATED, INCONCLUSIVE}"
        side_effects:
          - "stamp findings_note and recorded_by_user_id"
          - "increment BackgroundVerification.version by 1"
        note: "Branch 3 of the fork - no candidate-side effect at all."
      - from: INCONCLUSIVE
        to: INCONCLUSIVE
        trigger: "POST /background-verifications/{id}/record-result with result=INCONCLUSIVE (vendor re-run)"
        actor: VettingSpecialist
        preconditions:
          - "BackgroundVerification.status == INCONCLUSIVE"
        side_effects:
          - "increment rerun_count by 1"
          - "increment BackgroundVerification.version by 1"
        note: "Self-loop: re-runs are unbounded and observable only through rerun_count."
      - from: FLAGGED
        to: ADJUDICATED_PASS
        trigger: "POST /background-verifications/{id}/adjudicate with disposition=PASS"
        actor: AgencyPrincipal
        preconditions:
          - "BackgroundVerification.status == FLAGGED"
          - "payload expected_candidate_version == Candidate.version"
        side_effects:
          - "stamp adjudicated_by_user_id and waiver_note"
          - "advance Candidate.vetting_status BACKGROUND_PENDING -> CLEARED"
          - "increment Candidate.version by 1 and BackgroundVerification.version by 1"
        note: "Join branch A - divergent side-effect set: candidate is cleared with a recorded waiver."
      - from: FLAGGED
        to: ADJUDICATED_FAIL
        trigger: "POST /background-verifications/{id}/adjudicate with disposition=FAIL"
        actor: AgencyPrincipal
        preconditions:
          - "BackgroundVerification.status == FLAGGED"
          - "payload expected_candidate_version == Candidate.version"
        side_effects:
          - "cascade hop 1: Candidate.vetting_status BACKGROUND_PENDING -> REJECTED"
          - "cascade hop 2: because the candidate is REJECTED, its SCHEDULED / IN_PROGRESS TrialEngagement rows transition to CANCELLED with cancel_reason = VETTING_FAILED"
          - "cascade hop 3: because those trials left the active set, each affected RoleRequisition with status == TRIALING and recomputed active_trial_count == 0 transitions to SOURCING"
          - "cascade hop 4: Candidate.availability_status ON_TRIAL -> INACTIVE"
          - "increment Candidate.version by 1 and BackgroundVerification.version by 1"
        note: "Join branch B - divergent side-effect set: a four-hop cascade instead of a clearance."

  - entity: TrialEngagement
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /trial-engagements/{id}/start"
        actor: PlacementConsultant
        preconditions:
          - "TrialEngagement.status == SCHEDULED"
          - "logical clock >= TrialEngagement.start_at"
          - "Candidate(candidate_id).vetting_status != REJECTED"
        side_effects:
          - "increment TrialEngagement.version by 1"
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /trial-engagements/{id}/record-outcome with outcome=PASSED"
        actor: PlacementConsultant
        preconditions:
          - "TrialEngagement.status == IN_PROGRESS"
          - "logical clock >= TrialEngagement.end_at"
        side_effects:
          - "recompute RoleRequisition.active_trial_count"
          - "Candidate.availability_status stays ON_TRIAL so an offer can be extended"
          - "increment TrialEngagement.version by 1"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /trial-engagements/{id}/record-outcome with outcome=FAILED"
        actor: PlacementConsultant
        preconditions:
          - "TrialEngagement.status == IN_PROGRESS"
          - "logical clock >= TrialEngagement.end_at"
        side_effects:
          - "recompute RoleRequisition.active_trial_count"
          - "Candidate.availability_status ON_TRIAL -> AVAILABLE when the candidate holds no other active trial"
          - "RoleRequisition TRIALING -> SOURCING when active_trial_count reaches 0"
          - "increment TrialEngagement.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /trial-engagements/{id}/cancel, or a system cascade (VETTING_FAILED / CLIENT_SUSPENDED / CLIENT_REQUEST)"
        actor: PlacementConsultant | Client | system
        preconditions:
          - "TrialEngagement.status == SCHEDULED"
        side_effects:
          - "stamp cancel_reason"
          - "Candidate.availability_status ON_TRIAL -> AVAILABLE when the candidate holds no other active trial and vetting_status != REJECTED"
          - "recompute RoleRequisition.active_trial_count; RoleRequisition TRIALING -> SOURCING when it reaches 0"
          - "increment TrialEngagement.version by 1"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /trial-engagements/{id}/cancel"
        actor: PlacementConsultant | Client | system
        preconditions:
          - "TrialEngagement.status == IN_PROGRESS"
        side_effects:
          - "same side-effect set as the SCHEDULED -> CANCELLED transition"
          - "increment TrialEngagement.version by 1"

  - entity: AccommodationTerm
    state_field: status
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, REJECTED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /accommodation-terms/{id}/respond with response=COUNTER"
        actor: Client | Candidate
        preconditions:
          - "AccommodationTerm.status IN {PROPOSED, COUNTERED}"
          - "AccommodationTerm.round_no < MAX_NEGOTIATION_ROUNDS"
          - "the responding party is not the same party as last_responder_role"
        side_effects:
          - "increment round_no by 1"
          - "overwrite live_in / weekly_hours / days_off_per_week / private_quarters / imputed_accommodation_cents with the supplied counter values"
          - "set last_responder_role to CLIENT or CANDIDATE per X-User-Role"
          - "increment AccommodationTerm.version by 1"
      - from: COUNTERED
        to: COUNTERED
        trigger: "POST /accommodation-terms/{id}/respond with response=COUNTER (further rounds)"
        actor: Client | Candidate
        preconditions:
          - "AccommodationTerm.round_no < MAX_NEGOTIATION_ROUNDS"
          - "the responding party is not the same party as last_responder_role"
        side_effects:
          - "increment round_no by 1; overwrite the negotiated fields; flip last_responder_role"
          - "increment AccommodationTerm.version by 1"
        note: "Self-loop: the negotiation cycles between CLIENT and CANDIDATE until MAX_NEGOTIATION_ROUNDS."
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /accommodation-terms/{id}/respond with response=ACCEPT"
        actor: Client | Candidate
        preconditions:
          - "AccommodationTerm.status IN {PROPOSED, COUNTERED}"
          - "the accepting party is not the same party as last_responder_role"
          - "AccommodationTerm.live_in == false OR Candidate(candidate_id).live_in_willing == true"
        side_effects:
          - "set RoleRequisition.live_in_required = AccommodationTerm.live_in and RoleRequisition.schedule_pattern is left untouched"
          - "increment AccommodationTerm.version by 1"
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /accommodation-terms/{id}/respond with response=ACCEPT"
        actor: Client | Candidate
        preconditions:
          - "AccommodationTerm.status == PROPOSED"
          - "AccommodationTerm.live_in == false OR Candidate(candidate_id).live_in_willing == true"
        side_effects:
          - "increment AccommodationTerm.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /accommodation-terms/{id}/respond with response=REJECT, or a requisition withdraw cascade"
        actor: Client | Candidate | system
        preconditions:
          - "AccommodationTerm.status IN {PROPOSED, COUNTERED}"
        side_effects:
          - "increment AccommodationTerm.version by 1"
      - from: COUNTERED
        to: REJECTED
        trigger: "POST /accommodation-terms/{id}/respond with response=REJECT"
        actor: Client | Candidate
        preconditions:
          - "AccommodationTerm.status == COUNTERED"
        side_effects:
          - "increment AccommodationTerm.version by 1"
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system event: a newer AccommodationTerm is created on the same requisition_id (guarded by concurrency_rules.accommodation-term-supersedes-open-term)"
        actor: system
        preconditions:
          - "AccommodationTerm.status IN {PROPOSED, COUNTERED}"
        side_effects:
          - "increment AccommodationTerm.version by 1"
      - from: COUNTERED
        to: SUPERSEDED
        trigger: "system event: a newer AccommodationTerm is created on the same requisition_id"
        actor: system
        preconditions:
          - "AccommodationTerm.status == COUNTERED"
        side_effects:
          - "increment AccommodationTerm.version by 1"

  - entity: Placement
    state_field: placement_status
    initial_state: PENDING_ACCEPTANCE
    terminal_states: [VOIDED, TERMINATED_REPLACED, TERMINATED_REFUNDED, GUARANTEE_EXPIRED]
    transitions:
      - from: PENDING_ACCEPTANCE
        to: ACTIVE
        trigger: "POST /placements/{id}/confirm-start"
        actor: AgencyPrincipal
        preconditions:
          - "Placement.placement_status == PENDING_ACCEPTANCE"
          - "an AccommodationTerm with requisition_id == Placement.requisition_id, candidate_id == Placement.candidate_id and status == ACCEPTED exists"
          - "calculations.fee_percent_resolution yields a non-empty candidate set for (role_type, actual_first_year_compensation_cents)"
        side_effects:
          - "re-run calculations.fee_percent_resolution against actual_first_year_compensation_cents; overwrite snapshot_fee_schedule_id, fee_percent_bps, guarantee_window_days"
          - "run calculations.placement_fee_computation variant FINAL; overwrite fee_cents and set fee_variant = FINAL"
          - "recompute guarantee_expires_on"
          - "re-run calculations.milestone_billing_schedule; PENDING milestones are re-amounted, INVOICED / OVERDUE / PAID milestones are frozen"
          - "Candidate.availability_status OFFER_HELD -> PLACED"
          - "RoleRequisition OFFER_PENDING -> PLACED"
          - "recompute Client.placement_count and Client.non_solicitation_expires_on"
          - "increment Placement.version by 1"
      - from: PENDING_ACCEPTANCE
        to: VOIDED
        trigger: "system event: a newer Placement supersedes this one on the same requisition"
        actor: system
        preconditions:
          - "Placement.placement_status == PENDING_ACCEPTANCE"
        side_effects:
          - "set void_reason = SUPERSEDED_BY_NEW_OFFER"
          - "cascade hop 2: every FeeMilestone of this placement with invoice_status == PENDING transitions to VOIDED, and every FeeMilestone with invoice_status IN {INVOICED, OVERDUE} transitions to REVERSED"
          - "cascade hop 3: each REVERSED milestone appends a LedgerEntry FEE_REVERSAL with signed_amount_cents = -amount_cents and related_ref_type = FEE_MILESTONE"
          - "cascade hop 4: because ledger rows were appended, Client.outstanding_balance_cents is recomputed"
          - "Placement.billing_status -> REVERSED when at least one milestone was REVERSED, otherwise it stays UNBILLED"
          - "Candidate.availability_status OFFER_HELD -> AVAILABLE"
          - "increment Placement.version by 1"
      - from: ACTIVE
        to: TERMINATED_NO_REMEDY
        trigger: "POST /placements/{id}/terminate"
        actor: PlacementConsultant | Client
        preconditions:
          - "Placement.placement_status == ACTIVE"
          - "separation_date >= Placement.start_date"
        side_effects:
          - "stamp separation_date"
          - "Candidate.availability_status PLACED -> COOLING_OFF with cooling_off_until = clock date + COOLING_OFF_DAYS"
          - "increment Placement.version by 1"
        note: "Termination alone grants no remedy; the household must file a ReplacementClaim inside the guarantee window."
      - from: TERMINATED_NO_REMEDY
        to: TERMINATED_REPLACED
        trigger: "system event: a ReplacementClaim on this placement reaches APPROVED_REPLACEMENT"
        actor: system
        preconditions:
          - "Placement.placement_status IN {ACTIVE, TERMINATED_NO_REMEDY}"
        side_effects:
          - "every FeeMilestone with invoice_status == PENDING transitions to VOIDED (the paid fee is carried as search credit, no ledger movement)"
          - "RoleRequisition PLACED -> SOURCING"
          - "Candidate.availability_status PLACED -> COOLING_OFF when it is still PLACED"
          - "increment Placement.version by 1"
      - from: TERMINATED_NO_REMEDY
        to: TERMINATED_REFUNDED
        trigger: "system event: a ReplacementClaim on this placement reaches APPROVED_REFUND"
        actor: system
        preconditions:
          - "Placement.placement_status IN {ACTIVE, TERMINATED_NO_REMEDY}"
        side_effects:
          - "run calculations.replacement_refund_proration; stamp the claim's gross_refund_cents, retained_admin_fee_cents, net_refund_cents"
          - "every FeeMilestone with invoice_status == PENDING transitions to VOIDED"
          - "append LedgerEntry REFUND_ISSUED with signed_amount_cents = -net_refund_cents and related_ref_type = REPLACEMENT_CLAIM"
          - "recompute Client.outstanding_balance_cents"
          - "set Placement.billing_status = REFUNDED"
          - "Candidate.availability_status PLACED -> COOLING_OFF when it is still PLACED"
          - "increment Placement.version by 1"
      - from: ACTIVE
        to: GUARANTEE_EXPIRED
        trigger: "system sweep on POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "Placement.placement_status == ACTIVE"
          - "new logical clock date >= Placement.guarantee_expires_on"
        side_effects:
          - "increment Placement.version by 1"
        note: "After this transition no ReplacementClaim may be filed."

  - entity: Placement
    state_field: billing_status
    initial_state: UNBILLED
    terminal_states: [REFUNDED]
    transitions:
      - from: UNBILLED
        to: PARTIALLY_BILLED
        trigger: "system event: the first FeeMilestone of this placement reaches INVOICED"
        actor: system
        preconditions:
          - "at least one FeeMilestone has invoice_status IN {INVOICED, OVERDUE, PAID} and at least one has invoice_status == PENDING"
        side_effects:
          - "increment Placement.version by 1"
      - from: PARTIALLY_BILLED
        to: FULLY_BILLED
        trigger: "system event: no FeeMilestone of this placement remains PENDING"
        actor: system
        preconditions:
          - "every FeeMilestone of this placement has invoice_status IN {INVOICED, OVERDUE, PAID, VOIDED, REVERSED}"
          - "at least one FeeMilestone has invoice_status == PAID"
        side_effects:
          - "increment Placement.version by 1"
      - from: PARTIALLY_BILLED
        to: REVERSED
        trigger: "system event: every non-VOIDED FeeMilestone of this placement is REVERSED"
        actor: system
        preconditions:
          - "no FeeMilestone of this placement has invoice_status IN {INVOICED, OVERDUE, PAID}"
          - "at least one FeeMilestone has invoice_status == REVERSED"
        side_effects:
          - "increment Placement.version by 1"
      - from: FULLY_BILLED
        to: REFUNDED
        trigger: "system event: a ReplacementClaim on this placement reaches APPROVED_REFUND"
        actor: system
        preconditions:
          - "Placement.billing_status IN {PARTIALLY_BILLED, FULLY_BILLED}"
        side_effects:
          - "increment Placement.version by 1"
        note: "Parallel dimensions: billing_status can reach REFUNDED from either PARTIALLY_BILLED or FULLY_BILLED, independent of where placement_status sits."

  - entity: FeeMilestone
    state_field: invoice_status
    initial_state: PENDING
    terminal_states: [PAID, REVERSED, VOIDED]
    transitions:
      - from: PENDING
        to: INVOICED
        trigger: "POST /fee-milestones/{id}/invoice"
        actor: BillingAdministrator
        preconditions:
          - "FeeMilestone.invoice_status == PENDING"
          - "Placement.placement_status IN {PENDING_ACCEPTANCE, ACTIVE} for milestone_type == ENGAGEMENT"
          - "Placement.placement_status == ACTIVE for milestone_type IN {TRIAL_CLEARED, START_DATE}"
          - "for milestone_type == START_DATE, a PayrollHandoff of this placement has status == ATTESTED"
        side_effects:
          - "stamp invoiced_on = clock date, due_date = clock date + NET_TERMS_DAYS days, invoiced_by_user_id"
          - "append LedgerEntry FEE_INVOICED with signed_amount_cents = +amount_cents, related_ref_type = FEE_MILESTONE"
          - "recompute Client.outstanding_balance_cents"
          - "advance Placement.billing_status UNBILLED -> PARTIALLY_BILLED"
          - "increment FeeMilestone.version by 1"
      - from: INVOICED
        to: OVERDUE
        trigger: "system sweep on POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "FeeMilestone.invoice_status == INVOICED"
          - "new logical clock date > FeeMilestone.due_date"
        side_effects:
          - "increment FeeMilestone.version by 1"
        note: "Strictly greater than due_date: a clock landing exactly on due_date leaves the milestone INVOICED."
      - from: INVOICED
        to: PAID
        trigger: "POST /fee-milestones/{id}/record-payment"
        actor: BillingAdministrator
        preconditions:
          - "FeeMilestone.invoice_status IN {INVOICED, OVERDUE}"
          - "payload paid_amount_cents == FeeMilestone.amount_cents"
        side_effects:
          - "stamp paid_on = clock date and payment_reference"
          - "append LedgerEntry FEE_PAYMENT with signed_amount_cents = -amount_cents"
          - "recompute Client.outstanding_balance_cents"
          - "advance Placement.billing_status PARTIALLY_BILLED -> FULLY_BILLED when no PENDING milestone remains"
          - "increment FeeMilestone.version by 1"
      - from: OVERDUE
        to: PAID
        trigger: "POST /fee-milestones/{id}/record-payment"
        actor: BillingAdministrator
        preconditions:
          - "FeeMilestone.invoice_status == OVERDUE"
          - "payload paid_amount_cents == FeeMilestone.amount_cents"
        side_effects:
          - "same side-effect set as INVOICED -> PAID"
          - "increment FeeMilestone.version by 1"
      - from: INVOICED
        to: REVERSED
        trigger: "POST /fee-milestones/{id}/reverse, or a placement-void cascade"
        actor: BillingAdministrator | system
        preconditions:
          - "FeeMilestone.invoice_status IN {INVOICED, OVERDUE}"
        side_effects:
          - "append LedgerEntry FEE_REVERSAL with signed_amount_cents = -amount_cents, related_ref_type = FEE_MILESTONE"
          - "recompute Client.outstanding_balance_cents"
          - "increment FeeMilestone.version by 1"
        note: "Compensation: FEE_INVOICED (+amount) and FEE_REVERSAL (-amount) sum to exactly 0, so the client receivable returns to its pre-invoice value."
      - from: OVERDUE
        to: REVERSED
        trigger: "POST /fee-milestones/{id}/reverse"
        actor: BillingAdministrator | system
        preconditions:
          - "FeeMilestone.invoice_status == OVERDUE"
        side_effects:
          - "same side-effect set as INVOICED -> REVERSED"
          - "increment FeeMilestone.version by 1"
      - from: PENDING
        to: VOIDED
        trigger: "system event: the placement is voided, replaced or refunded"
        actor: system
        preconditions:
          - "FeeMilestone.invoice_status == PENDING"
        side_effects:
          - "amount_cents is left at its last allocated value and the row leaves the allocation base of calculations.milestone_billing_schedule"
          - "increment FeeMilestone.version by 1"

  - entity: ReplacementClaim
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED_REPLACEMENT, APPROVED_REFUND, DENIED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /replacement-claims/{id}/review with action=OPEN_REVIEW"
        actor: AgencyPrincipal
        preconditions:
          - "ReplacementClaim.status == SUBMITTED"
        side_effects:
          - "stamp decision_note"
          - "increment ReplacementClaim.version by 1"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /replacement-claims/{id}/review with action=REQUEST_INFO"
        actor: AgencyPrincipal
        preconditions:
          - "ReplacementClaim.status == UNDER_REVIEW"
        side_effects:
          - "increment info_request_round by 1"
          - "increment ReplacementClaim.version by 1"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /replacement-claims/{id}/provide-info"
        actor: Client
        preconditions:
          - "ReplacementClaim.status == INFO_REQUESTED"
        side_effects:
          - "append the supplied info_note to decision_note"
          - "increment ReplacementClaim.version by 1"
        note: "Cyclic: UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW repeats, each loop bumping info_request_round."
      - from: UNDER_REVIEW
        to: APPROVED_REPLACEMENT
        trigger: "POST /replacement-claims/{id}/review with action=APPROVE_REPLACEMENT"
        actor: AgencyPrincipal
        preconditions:
          - "ReplacementClaim.status == UNDER_REVIEW"
          - "ReplacementClaim.requested_remedy == REPLACEMENT"
        side_effects:
          - "Placement -> TERMINATED_REPLACED with its PENDING milestones VOIDED"
          - "RoleRequisition PLACED -> SOURCING"
          - "increment ReplacementClaim.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED_REFUND
        trigger: "POST /replacement-claims/{id}/review with action=APPROVE_REFUND"
        actor: AgencyPrincipal
        preconditions:
          - "ReplacementClaim.status == UNDER_REVIEW"
          - "ReplacementClaim.requested_remedy == REFUND"
        side_effects:
          - "cascade hop 1: run calculations.replacement_refund_proration and stamp gross_refund_cents, retained_admin_fee_cents, net_refund_cents"
          - "cascade hop 2: Placement -> TERMINATED_REFUNDED, billing_status -> REFUNDED, PENDING milestones VOIDED"
          - "cascade hop 3: because the placement was refunded, a LedgerEntry REFUND_ISSUED of -net_refund_cents is appended"
          - "cascade hop 4: because a ledger row was appended, Client.outstanding_balance_cents is recomputed"
          - "increment ReplacementClaim.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /replacement-claims/{id}/review with action=DENY"
        actor: AgencyPrincipal
        preconditions:
          - "ReplacementClaim.status == UNDER_REVIEW"
        side_effects:
          - "the placement keeps its current placement_status and billing_status"
          - "increment ReplacementClaim.version by 1"
      - from: DENIED
        to: SUPERSEDED
        trigger: "system event: the household files a newer ReplacementClaim on the same placement (guarded by concurrency_rules.claim-create-supersedes-denied-claim)"
        actor: system
        preconditions:
          - "ReplacementClaim.status == DENIED"
        side_effects:
          - "increment ReplacementClaim.version by 1"

  - entity: PayrollHandoff
    state_field: status
    initial_state: PREPARED
    terminal_states: [ATTESTED]
    transitions:
      - from: PREPARED
        to: ATTESTED
        trigger: "POST /payroll-handoffs/{id}/attest"
        actor: Client | ComplianceOfficer
        preconditions:
          - "PayrollHandoff.status == PREPARED"
          - "PayrollHandoff.ein_status == ISSUED"
        side_effects:
          - "stamp attested_by_name and attested_at = logical clock"
          - "unblocks POST /fee-milestones/{id}/invoice for the placement's START_DATE milestone"
          - "increment PayrollHandoff.version by 1"

  - entity: NonSolicitationCase
    state_field: status
    initial_state: ALLEGED
    terminal_states: [UNSUBSTANTIATED, SETTLED]
    transitions:
      - from: ALLEGED
        to: INVESTIGATING
        trigger: "POST /non-solicitation-cases/{id}/investigate"
        actor: ComplianceOfficer
        preconditions:
          - "NonSolicitationCase.status == ALLEGED"
          - "Client(respondent_client_id).non_solicitation_expires_on is not null and discovered_on <= Client.non_solicitation_expires_on"
        side_effects:
          - "stamp investigation_opened_at = logical clock"
          - "increment NonSolicitationCase.version by 1"
      - from: INVESTIGATING
        to: SUBSTANTIATED
        trigger: "POST /non-solicitation-cases/{id}/resolve with disposition=SUBSTANTIATE"
        actor: ComplianceOfficer
        preconditions:
          - "NonSolicitationCase.status == INVESTIGATING"
          - "X-User-ID != NonSolicitationCase.opened_by_user_id"
        side_effects:
          - "freeze prior_substantiated_count and run calculations.non_solicitation_penalty; stamp penalty_cents"
          - "stamp substantiated_at = logical clock and resolved_by_user_id"
          - "cascade hop 2: append LedgerEntry PENALTY_ASSESSED with signed_amount_cents = +penalty_cents, related_ref_type = NON_SOLICITATION_CASE"
          - "cascade hop 3: recompute Client.outstanding_balance_cents"
          - "cascade hop 4: Client ONBOARDED -> SUSPENDED"
          - "cascade hop 5: every SCHEDULED TrialEngagement of that client is CANCELLED with cancel_reason = CLIENT_SUSPENDED, and every TRIALING RoleRequisition of that client whose active_trial_count reaches 0 falls back to SOURCING"
          - "increment NonSolicitationCase.version by 1"
      - from: INVESTIGATING
        to: UNSUBSTANTIATED
        trigger: "POST /non-solicitation-cases/{id}/resolve with disposition=UNSUBSTANTIATE"
        actor: ComplianceOfficer
        preconditions:
          - "NonSolicitationCase.status == INVESTIGATING"
          - "X-User-ID != NonSolicitationCase.opened_by_user_id"
        side_effects:
          - "stamp resolved_by_user_id and findings_note; penalty_cents stays null and no ledger row is appended"
          - "increment NonSolicitationCase.version by 1"
      - from: SUBSTANTIATED
        to: SETTLED
        trigger: "POST /non-solicitation-cases/{id}/settle"
        actor: BillingAdministrator
        preconditions:
          - "NonSolicitationCase.status == SUBSTANTIATED"
          - "payload settlement_amount_cents <= NonSolicitationCase.penalty_cents"
        side_effects:
          - "stamp settlement_amount_cents"
          - "append LedgerEntry PENALTY_SETTLED with signed_amount_cents = -settlement_amount_cents"
          - "recompute Client.outstanding_balance_cents"
          - "Client SUSPENDED -> ONBOARDED when no other SUBSTANTIATED case remains for that client"
          - "increment NonSolicitationCase.version by 1"

concurrency_rules:
  - rule_id: placement-create-supersedes-offer
    parent_entity: RoleRequisition
    write_endpoint: "POST /placements"
    occ_field: "expected_requisition_version"
    description: |
      Creating a Placement against a RoleRequisition whose version has advanced since the
      client last observed it is rejected. This captures the case where another writer has
      already created a Placement that legitimately supersedes the incumbent
      PENDING_ACCEPTANCE offer (state_machines.RoleRequisition OFFER_PENDING -> OFFER_PENDING),
      so the current writer's view of the requisition - which candidate holds the offer, which
      trials are still active - is stale.
    error_id: ERR_STALE_REQUISITION_VERSION
    http_status: 412
  - rule_id: accommodation-term-supersedes-open-term
    parent_entity: RoleRequisition
    write_endpoint: "POST /role-requisitions/{id}/accommodation-terms"
    occ_field: "expected_requisition_version"
    description: |
      Proposing a new AccommodationTerm on a RoleRequisition whose version has advanced since
      the client last observed it is rejected. A fresh proposal legitimately drives any open
      PROPOSED / COUNTERED term to SUPERSEDED, so a writer holding a stale requisition version
      would silently overwrite a negotiation round it never saw.
    error_id: ERR_STALE_REQUISITION_VERSION
    http_status: 412
  - rule_id: background-adjudication-guards-candidate
    parent_entity: Candidate
    write_endpoint: "POST /background-verifications/{id}/adjudicate"
    occ_field: "expected_candidate_version"
    description: |
      Adjudicating a FLAGGED background result against a Candidate whose version has advanced
      since the principal last observed it is rejected. The FAIL disposition fans a four-hop
      cascade out across the candidate's trials and their requisitions, so a stale candidate
      version means the adjudicator has not seen the newest vetting state, score or trial set
      that the cascade is about to act on.
    error_id: ERR_STALE_CANDIDATE_VERSION
    http_status: 412
  - rule_id: claim-create-supersedes-denied-claim
    parent_entity: Placement
    write_endpoint: "POST /placements/{id}/replacement-claims"
    occ_field: "expected_placement_version"
    description: |
      Filing a ReplacementClaim against a Placement whose version has advanced since the
      household last observed it is rejected. Re-filing after a DENIED claim is legitimate and
      drives the older claim to SUPERSEDED, so a stale placement version means the filer has
      not seen the newest decision, milestone re-schedule or guarantee snapshot.
    error_id: ERR_STALE_PLACEMENT_VERSION
    http_status: 412

calculations:
  - name: fee_percent_resolution
    entity: RoleRequisition
    target_fields: [resolved_fee_schedule_id, fee_percent_bps, guarantee_window_days]
    algorithm_type: threshold
    input_set: |
      All FeeSchedule rows with status == ACTIVE, role_type == the subject role_type, and
      comp_band_floor_cents <= subject_compensation_cents AND
      (comp_band_ceiling_cents IS NULL OR subject_compensation_cents < comp_band_ceiling_cents).
      Bands are half-open [floor, ceiling): a compensation landing exactly on a ceiling belongs to
      the NEXT band, and a compensation landing exactly on a floor belongs to THAT band.
    constants: {}
    formula: |
      candidate_set = input_set as defined above
      if candidate_set is empty -> raise ERR_NO_FEE_SCHEDULE_MATCH (the calculation has no result)
      winner = the row in candidate_set with the greatest effective_from;
               tie-break on created_at ascending (earliest created row wins)
      resolved_fee_schedule_id = winner.id
      fee_percent_bps        = winner.fee_percent_bps
      guarantee_window_days  = winner.guarantee_window_days
    precision: "exact integer basis points; no rounding"
    invoked_by:
      - "POST /role-requisitions/{id}/finalize-scope, with subject_compensation_cents = RoleRequisition.first_year_compensation_cents"
      - "POST /placements/{id}/confirm-start, with subject_compensation_cents = Placement.actual_first_year_compensation_cents"
    note: |
      The same band table is consulted twice in a placement's life against two different
      compensation figures, so a household whose actual package crosses a band ceiling is
      re-priced at confirm-start.

  - name: placement_fee_computation
    entity: Placement
    target_fields: [fee_cents, fee_variant]
    algorithm_type: tiered_pricing
    input_set: |
      PROVISIONAL: the single scalar RoleRequisition.first_year_compensation_cents.
      FINAL: the four Placement compensation components base_salary_cents,
      guaranteed_bonus_cents, accommodation_imputed_cents, overtime_allowance_cents.
    constants: {}
    variants:
      - variant: PROVISIONAL
        applies_when: "POST /placements creates the row, and POST /role-requisitions/{id}/finalize-scope stamps RoleRequisition.provisional_fee_cents"
        formula: |
          fee_percent_bps = RoleRequisition.fee_percent_bps (resolved against the requisition's
                            first_year_compensation_cents)
          fee_cents = ROUND_HALF_UP(first_year_compensation_cents * fee_percent_bps / 10000)
          fee_variant = PROVISIONAL
        note: "One rounding operation, applied to the aggregate compensation figure."
      - variant: FINAL
        applies_when: "POST /placements/{id}/confirm-start"
        formula: |
          fee_percent_bps = re-resolved by calculations.fee_percent_resolution against
                            actual_first_year_compensation_cents
          actual_first_year_compensation_cents = base_salary_cents + guaranteed_bonus_cents
                            + accommodation_imputed_cents + overtime_allowance_cents
          per_component[i] = ROUND_HALF_UP(component[i] * fee_percent_bps / 10000)
                             for the four components in the fixed order
                             [base_salary, guaranteed_bonus, accommodation_imputed, overtime_allowance]
          fee_cents = sum(per_component)
          fee_variant = FINAL
          guarantee_expires_on = start_date + guarantee_window_days days (half-open: the window
                             covers [start_date, guarantee_expires_on))
        note: |
          Four independent rounding operations, then a sum. Rounding is applied BEFORE the sum,
          so FINAL is not simply PROVISIONAL recomputed: with fee_percent_bps = 2233 and the four
          components 12002500 / 1502500 / 902500 / 592500 (aggregate 15000000) the per-component
          results are 2680158 / 335508 / 201528 / 132305 summing to 3349499, whereas rounding the
          15000000 aggregate once yields 3349500. The two variants differ by exactly 1 cent on
          identical total compensation.
    precision: "integer cents, ROUND_HALF_UP, rounding applied at the point stated in each variant"
    reconciliation: |
      When confirm-start switches the row from PROVISIONAL to FINAL, fee_cents is overwritten and
      calculations.milestone_billing_schedule is re-run so that the sum of non-VOIDED FeeMilestone
      amounts again equals the new fee_cents. Already INVOICED / OVERDUE / PAID milestones are
      frozen and the delta is absorbed by the still-PENDING milestones.

  - name: milestone_billing_schedule
    entity: FeeMilestone
    target_fields: [amount_cents, weight_bps]
    algorithm_type: waterfall_allocation
    input_set: |
      The three FeeMilestone rows of the placement in ascending sequence_no order
      (1 = ENGAGEMENT, 2 = TRIAL_CLEARED, 3 = START_DATE), partitioned into
      FROZEN = rows with invoice_status IN {INVOICED, OVERDUE, PAID, REVERSED} and
      OPEN   = rows with invoice_status == PENDING.
      Rows with invoice_status == VOIDED are excluded from both partitions.
    constants:
      MILESTONE_WEIGHTS_BPS: { ENGAGEMENT: 3000, TRIAL_CLEARED: 3000, START_DATE: 4000 }
    formula: |
      remaining_cents = Placement.fee_cents - sum(FROZEN[i].amount_cents)
      open_weight_total = sum(weight_bps of rows in OPEN)
      for each row in OPEN in ascending sequence_no order except the last:
          row.amount_cents = ROUND_HALF_UP(remaining_cents * row.weight_bps / open_weight_total)
      last row in OPEN:
          row.amount_cents = remaining_cents - sum(amounts already assigned in this pass)
      FROZEN rows keep their stored amount_cents unchanged.
    precision: "integer cents, ROUND_HALF_UP on every OPEN row except the last, which takes the exact remainder"
    invariant: |
      After every run, sum(amount_cents) over all FeeMilestone rows of the placement whose
      invoice_status != VOIDED equals Placement.fee_cents exactly. The final row absorbing the
      remainder is what makes this hold under re-allocation.
    invoked_by:
      - "POST /placements (initial allocation of the PROVISIONAL fee across three PENDING rows)"
      - "POST /placements/{id}/confirm-start (re-allocation of the FINAL fee with FROZEN rows pinned)"
    note: |
      Worked example: fee_cents 3349500 allocates 1004850 / 1004850 / 1339800. If ENGAGEMENT is
      then PAID and confirm-start lowers fee_cents to 3349499, remaining_cents is 2344649,
      open_weight_total is 7000, TRIAL_CLEARED becomes ROUND_HALF_UP(2344649*3000/7000) = 1004850
      and START_DATE takes the remainder 1339799 - so the three amounts still sum to 3349499.

  - name: reference_chain_coverage
    entity: Candidate
    target_fields: [verified_reference_count, reference_coverage_months, longest_contiguous_months]
    algorithm_type: interval_merge
    input_set: |
      All ReferenceCheck rows with candidate_id == this candidate and status == VERIFIED.
      PENDING, UNREACHABLE and DISPUTED rows contribute nothing - neither to the count nor to
      any month total.
    constants: {}
    formula: |
      verified_reference_count = count(input_set)
      intervals = [ (employment_start_month, employment_end_month) for each row in input_set ],
                  each interval CLOSED and INCLUSIVE at both ends and measured in whole months
      merged = intervals sorted by start, then merged pairwise when they overlap OR are adjacent
               (adjacent means next.start_month is the calendar month immediately after
               prev.end_month, i.e. a gap of zero months)
      reference_coverage_months  = sum over merged of (months from start to end inclusive)
      longest_contiguous_months  = max over merged of (months from start to end inclusive), or 0
                                   when merged is empty
    precision: "whole months; a single-month reference (start_month == end_month) counts as 1 month"
    invoked_by:
      - "POST /candidates/{id}/reference-checks"
      - "POST /reference-checks/{id}/verify"
    note: |
      Worked example: VERIFIED 2023-01..2023-12 (12 months) and VERIFIED 2024-01..2024-04
      (4 months) are adjacent with a zero-month gap, so they merge into 2023-01..2024-04:
      reference_coverage_months 16 and longest_contiguous_months 16. Shortening the second row to
      2024-01..2024-03 yields 15 and 15.

  - name: candidate_vetting_score
    entity: Candidate
    target_fields: [screening_score, placement_ready_score]
    algorithm_type: weighted_scoring
    input_set: |
      The candidate's years_experience, its VERIFIED ReferenceCheck rows (with DISPUTED rows also
      consulted by the PLACEMENT_READY variant), its reference_coverage_months, and its
      BackgroundVerification rows.
    constants:
      RELATIONSHIP_WEIGHTS: { PRINCIPAL_EMPLOYER: 12, AGENCY_SUPERVISOR: 8, PEER: 4 }
      EXPERIENCE_POINTS_PER_YEAR: 3
      EXPERIENCE_POINTS_CAP: 36
      REFERENCE_POINTS_CAP: 24
      COVERAGE_POINTS_CAP: 20
      CLEARED_BACKGROUND_POINTS: 20
      ADJUDICATED_PASS_BACKGROUND_POINTS: 10
      DISPUTED_REFERENCE_PENALTY_POINTS: 15
      PRESENTATION_MIN_SCORE: 70
      PLACEMENT_MIN_SCORE: 80
    variants:
      - variant: SCREENING
        applies_when: "POST /role-requisitions/{id}/trial-engagements - the gate for presenting a candidate to a household"
        formula: |
          experience_points = MIN(years_experience * 3, 36)
          reference_points  = MIN(sum of RELATIONSHIP_WEIGHTS[row.relationship_type]
                                  over VERIFIED rows, 24)
          coverage_points   = MIN(reference_coverage_months, 20)
          background_points = 0            # background work is not yet expected at screening time
          disputed_penalty  = 0            # disputed references are ignored at screening time
          screening_score = experience_points + reference_points + coverage_points
          gate: screening_score >= PRESENTATION_MIN_SCORE (70), evaluated with >= so a score of exactly 70 passes
      - variant: PLACEMENT_READY
        applies_when: "POST /placements - the gate for extending an offer"
        formula: |
          experience_points = MIN(years_experience * 3, 36)
          reference_points  = MIN(sum of RELATIONSHIP_WEIGHTS[row.relationship_type]
                                  over VERIFIED rows, 24)
          coverage_points   = MIN(reference_coverage_months, 20)
          background_points = 20 when a BackgroundVerification of this candidate has
                                 status == CLEARED,
                              10 when the best status is ADJUDICATED_PASS (a waived flag is worth
                                 half of a clean result),
                              0 otherwise
          disputed_penalty  = 15 * count(ReferenceCheck rows with status == DISPUTED)
          placement_ready_score = MAX(experience_points + reference_points + coverage_points
                  + background_points - disputed_penalty, 0)
          gate: placement_ready_score >= PLACEMENT_MIN_SCORE (80)
    precision: "integer points; no rounding, no fractional weights"
    invoked_by:
      - "POST /candidates/{id}/reference-checks (both fields recomputed)"
      - "POST /reference-checks/{id}/verify (both fields recomputed)"
      - "POST /background-verifications/{id}/record-result (both fields recomputed)"
      - "POST /background-verifications/{id}/adjudicate (both fields recomputed)"
    divergence_note: |
      The two variants disagree on both the input set and the threshold. A candidate with
      years_experience 10 (30 points), two VERIFIED PRINCIPAL_EMPLOYER references (24 points,
      already at cap), reference_coverage_months 16 (16 points), one ADJUDICATED_PASS background
      (10 points) and one DISPUTED reference (-15 points) scores 70 under SCREENING - exactly
      passing its 70 gate - and 65 under PLACEMENT_READY, failing its 80 gate. The same stored
      data therefore admits the candidate to a trial day and refuses an offer.

  - name: replacement_refund_proration
    entity: ReplacementClaim
    target_fields: [elapsed_days, unused_days, gross_refund_cents, retained_admin_fee_cents, net_refund_cents]
    algorithm_type: threshold
    input_set: |
      The subject Placement's fee_cents, start_date and guarantee_window_days, plus the claim's
      separation_date. FeeMilestone payment state is NOT an input: the refund is computed on the
      contracted fee, not on the amount collected so far.
    constants:
      ADMIN_RETENTION_TIER_BPS: { UNDER_1M: 500, ONE_TO_3M: 750, AT_OR_OVER_3M: 1000 }
    formula: |
      The five steps are evaluated in exactly this order and each step consumes the previous
      step's rounded output:
        step 1  elapsed_days = separation_date - Placement.start_date, in whole days
        step 2  unused_days  = MAX(Placement.guarantee_window_days - elapsed_days, 0)
        step 3  gross_refund_cents = ROUND_HALF_UP(Placement.fee_cents * unused_days
                                                   / Placement.guarantee_window_days)
        step 4  tier_bps = ADMIN_RETENTION_TIER_BPS keyed on gross_refund_cents (NOT on fee_cents
                           and NOT on the amount invoiced):
                             gross_refund_cents < 1000000                -> 500
                             1000000 <= gross_refund_cents < 3000000     -> 750
                             gross_refund_cents >= 3000000               -> 1000
                retained_admin_fee_cents = ROUND_HALF_UP(gross_refund_cents * tier_bps / 10000)
        step 5  net_refund_cents = gross_refund_cents - retained_admin_fee_cents
    precision: "integer cents, ROUND_HALF_UP at step 3 and again at step 4; step 5 is exact subtraction"
    order_sensitivity: |
      Reordering the pinned steps changes the answer. With fee_cents 3349499,
      guarantee_window_days 90 and elapsed_days 28 (unused_days 62) the correct result is
      gross 2307433, tier 750, retained 173057, net 2134376. Keying the tier on fee_cents instead
      of on the prorated gross selects 1000 bps and yields net 2076690. Retaining the admin fee
      from the full fee first and prorating afterwards yields net 2134375. Truncating instead of
      rounding half up at step 3 also yields net 2134375.
    invoked_by:
      - "POST /replacement-claims/{id}/review with action=APPROVE_REFUND"

  - name: non_solicitation_penalty
    entity: NonSolicitationCase
    target_fields: [penalty_cents]
    algorithm_type: tiered_pricing
    input_set: |
      The source Placement's fee_cents when source_placement_id is set, and the count of earlier
      SUBSTANTIATED NonSolicitationCase rows against the same respondent_client_id frozen at the
      moment of substantiation (NonSolicitationCase.prior_substantiated_count).
    constants:
      POACHING_RATE_TIERS_BPS: { UNDER_2M: 10000, TWO_TO_5M: 7500, AT_OR_OVER_5M: 5000 }
      PENALTY_FLOOR_CENTS: 750000
      PENALTY_CAP_CENTS: 7500000
    formula: |
      Evaluated in exactly this order:
        step 1  base_cents = source Placement.fee_cents when source_placement_id is not null,
                             otherwise PENALTY_FLOOR_CENTS
        step 2  rate_bps = POACHING_RATE_TIERS_BPS keyed on base_cents (a regressive schedule):
                             base_cents < 2000000               -> 10000
                             2000000 <= base_cents < 5000000     -> 7500
                             base_cents >= 5000000               -> 5000
        step 3  rated_cents = ROUND_HALF_UP(base_cents * rate_bps / 10000)
        step 4  multiplied_cents = rated_cents * (1 + prior_substantiated_count)
        step 5  penalty_cents = MIN(MAX(multiplied_cents, PENALTY_FLOOR_CENTS), PENALTY_CAP_CENTS)
    precision: "integer cents, ROUND_HALF_UP at step 3 only; the repeat-offender multiplier is exact"
    order_sensitivity: |
      The tier is keyed on the pre-multiplier base and the floor/cap are applied only after the
      multiplier. With base_cents 3349499 the tier is 7500 bps and rated_cents is 2512124
      (3349499 * 0.75 = 2512124.25, rounded down). A first repeat (prior_substantiated_count 1)
      gives 5024248, inside the band. A second repeat (prior_substantiated_count 2) gives
      7536372, which the cap trims to exactly 7500000. Clamping before the multiplier, or keying
      the tier on the multiplied figure, both give different answers.
    invoked_by:
      - "POST /non-solicitation-cases/{id}/resolve with disposition=SUBSTANTIATE"

  - name: client_receivable_balance
    entity: Client
    target_fields: [outstanding_balance_cents]
    algorithm_type: aggregation
    input_set: |
      Every LedgerEntry row with client_id == this client, in ascending sequence_no order. The
      ledger is append-only: nothing is ever updated or deleted, so a reversal is a new row with
      the opposite sign rather than a mutation of the original.
    constants:
      CREDIT_HOLD_LIMIT_CENTS: 5000000
    formula: |
      running = 0
      for each LedgerEntry in ascending sequence_no order:
          running = running + entry.signed_amount_cents
          entry.balance_after_cents = running       # stamped once, at append time
      Client.outstanding_balance_cents = running
      Sign convention: FEE_INVOICED and PENALTY_ASSESSED are positive (the household owes more);
      FEE_PAYMENT, FEE_REVERSAL, REFUND_ISSUED and PENALTY_SETTLED are negative;
      MANUAL_ADJUSTMENT may be either sign but never zero.
    precision: "exact integer cents; the balance may be negative when a household is in credit"
    invariant: |
      Client.outstanding_balance_cents always equals the sum of signed_amount_cents over the
      client's ledger, and the last row's balance_after_cents equals that same figure. Because
      FEE_INVOICED (+amount_cents) and FEE_REVERSAL (-amount_cents) carry identical magnitudes,
      invoicing a milestone and then reversing it returns the balance to its exact prior value.
    invoked_by:
      - "every transition that appends a LedgerEntry row (milestone invoice, payment, reversal, refund issue, penalty assessment, penalty settlement)"
      - "POST /clients/{id}/ledger-adjustments"

validations:
  - priority: 10
    rule_id: auth_headers_present
    category: auth
    applies_to: "every endpoint except POST /_clock/set_current_utc and GET /_clock"
    condition: "X-User-ID or X-User-Role request header is absent or empty"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    note: "Evaluated before anything else, including path-parameter parsing, so an unauthenticated request to a non-existent id still returns 401."

  - priority: 11
    rule_id: role_recognised
    category: auth
    applies_to: "every authenticated endpoint"
    condition: "X-User-Role is not one of the seven roles in the RBAC matrix"
    error_id: ERR_INVALID_ROLE
    http_status: 401

  - priority: 12
    rule_id: role_permitted_for_operation
    category: auth
    applies_to: "every authenticated endpoint"
    condition: "the RBAC matrix does not grant X-User-Role the requested operation"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    note: "Precedes request-shape validation: a forbidden role sending a malformed body gets 403, not 400."

  - priority: 20
    rule_id: required_fields_present
    category: request_shape
    applies_to: "every endpoint with a request body"
    condition: "a field declared required in the endpoint's input is absent or null"
    error_id: ERR_INVALID_REQUEST
    http_status: 400

  - priority: 21
    rule_id: enum_values_recognised
    category: request_shape
    applies_to: "every endpoint whose input carries an enum field"
    condition: "an enum-typed input value is outside the declared value set"
    error_id: ERR_INVALID_ENUM
    http_status: 400

  - priority: 22
    rule_id: numeric_ranges_respected
    category: request_shape
    applies_to: "every endpoint whose input carries a numeric field"
    condition: |
      any *_cents field is negative; years_experience outside 0..60; weekly_hours outside 1..80;
      days_off_per_week outside 0..7; fee_percent_bps outside 1..10000; guarantee_window_days
      outside 1..365; scope_items empty; limit outside 1..200; offset negative
    error_id: ERR_INVALID_RANGE
    http_status: 400

  - priority: 23
    rule_id: temporal_formats_valid
    category: request_shape
    applies_to: "every endpoint whose input carries a date, timestamp or month key"
    condition: "a date is not YYYY-MM-DD, a timestamp is not RFC3339 UTC with a trailing Z, or a month key is not YYYY-MM"
    error_id: ERR_INVALID_DATE_FORMAT
    http_status: 400

  - priority: 24
    rule_id: interval_ordering
    category: request_shape
    applies_to: "POST /role-requisitions/{id}/trial-engagements, POST /candidates/{id}/reference-checks, POST /fee-schedules"
    condition: "end_at <= start_at; employment_end_month < employment_start_month; comp_band_ceiling_cents is not null and comp_band_ceiling_cents <= comp_band_floor_cents"
    error_id: ERR_INVALID_INTERVAL
    http_status: 400

  - priority: 25
    rule_id: ledger_amount_non_zero
    category: request_shape
    applies_to: "POST /clients/{id}/ledger-adjustments"
    condition: "signed_amount_cents == 0"
    error_id: ERR_INVALID_LEDGER_AMOUNT
    http_status: 400

  - priority: 30
    rule_id: path_entity_exists
    category: referential
    applies_to: "every endpoint with a path parameter"
    condition: "the id in the path does not resolve to a stored row of the expected entity"
    error_id: "ERR_CLIENT_NOT_FOUND | ERR_FEE_SCHEDULE_NOT_FOUND | ERR_REQUISITION_NOT_FOUND | ERR_CANDIDATE_NOT_FOUND | ERR_REFERENCE_CHECK_NOT_FOUND | ERR_BACKGROUND_VERIFICATION_NOT_FOUND | ERR_TRIAL_NOT_FOUND | ERR_ACCOMMODATION_TERM_NOT_FOUND | ERR_PLACEMENT_NOT_FOUND | ERR_FEE_MILESTONE_NOT_FOUND | ERR_REPLACEMENT_CLAIM_NOT_FOUND | ERR_PAYROLL_HANDOFF_NOT_FOUND | ERR_NON_SOLICITATION_CASE_NOT_FOUND"
    http_status: 404
    note: "The error id is selected by the entity the segment addresses, so /placements/{id}/... with a bad id is ERR_PLACEMENT_NOT_FOUND."

  - priority: 31
    rule_id: payload_reference_exists
    category: referential
    applies_to: "POST /role-requisitions, POST /placements, POST /role-requisitions/{id}/trial-engagements, POST /role-requisitions/{id}/accommodation-terms, POST /candidates/{id}/reference-checks, POST /non-solicitation-cases"
    condition: "a foreign-key id supplied in the request body does not resolve to a stored row"
    error_id: "same per-entity NOT_FOUND catalogue as path_entity_exists"
    http_status: 404

  - priority: 32
    rule_id: reference_ownership_consistent
    category: referential
    applies_to: "POST /candidates/{id}/reference-checks, POST /placements, POST /non-solicitation-cases"
    condition: |
      prior_reference_id belongs to a different candidate; the candidate named in a placement has
      no TrialEngagement on the named requisition; source_placement_id names a placement whose
      candidate_id differs from the case's candidate_id
    error_id: ERR_ENTITY_RELATIONSHIP_MISMATCH
    http_status: 409

  - priority: 40
    rule_id: optimistic_version_matches
    category: concurrency
    applies_to: "POST /placements, POST /role-requisitions/{id}/accommodation-terms, POST /placements/{id}/replacement-claims, POST /background-verifications/{id}/adjudicate"
    condition: "the supplied expected_<parent>_version differs from the stored parent version"
    error_id: "ERR_STALE_REQUISITION_VERSION | ERR_STALE_PLACEMENT_VERSION | ERR_STALE_CANDIDATE_VERSION"
    http_status: 412
    note: "Checked after the parent has been resolved but before any state or business rule, so a stale version on an otherwise-invalid request still returns 412."

  - priority: 50
    rule_id: transition_legal_from_current_state
    category: state
    applies_to: "every action endpoint that drives a state machine"
    condition: "the subject row's current state has no transition to the requested target under state_machines"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_REQUISITION_NOT_SCOPING | ERR_TRIAL_NOT_SCHEDULED | ERR_TRIAL_NOT_IN_PROGRESS | ERR_BACKGROUND_NOT_FLAGGED | ERR_CLAIM_NOT_UNDER_REVIEW | ERR_MILESTONE_NOT_INVOICED | ERR_PLACEMENT_NOT_ACTIVE | ERR_CASE_NOT_INVESTIGATING"
    http_status: 409
    note: |
      The specific error id is chosen per endpoint, so record-outcome on a SCHEDULED trial is
      ERR_TRIAL_NOT_IN_PROGRESS. This rule outranks every business_temporal rule, which is what
      makes the pairing with trial_window_elapsed observable.

  - priority: 51
    rule_id: terminal_state_locked
    category: state
    applies_to: "every action endpoint that drives a state machine"
    condition: "the subject row is already in a terminal state of the machine being driven"
    error_id: ERR_ENTITY_TERMINAL
    http_status: 409

  - priority: 60
    rule_id: nda_countersigned_before_scoping
    category: business_referential
    applies_to: "POST /role-requisitions, POST /role-requisitions/{id}/scope"
    condition: "Client.confidentiality_agreement_status != COUNTERSIGNED"
    error_id: ERR_NDA_NOT_COUNTERSIGNED
    http_status: 409
    note: "Cross-entity gate: the child's admissibility is decided by a field on its parent."

  - priority: 61
    rule_id: client_not_suspended
    category: business_referential
    applies_to: "POST /role-requisitions, POST /role-requisitions/{id}/scope, POST /role-requisitions/{id}/finalize-scope, POST /role-requisitions/{id}/trial-engagements, POST /placements"
    condition: "Client.status == SUSPENDED"
    error_id: ERR_CLIENT_SUSPENDED
    http_status: 409

  - priority: 62
    rule_id: scoping_round_cap
    category: business_constraint
    applies_to: "POST /role-requisitions/{id}/scope"
    condition: "RoleRequisition.scoping_round >= MAX_SCOPING_ROUNDS (3)"
    error_id: ERR_SCOPING_ROUND_LIMIT
    http_status: 409
    note: "The third scope call is accepted (scoping_round moves 2 -> 3); the fourth is refused."

  - priority: 63
    rule_id: rescope_requires_no_active_trials
    category: business_constraint
    applies_to: "POST /role-requisitions/{id}/scope"
    condition: "RoleRequisition.status == SOURCING and RoleRequisition.active_trial_count > 0"
    error_id: ERR_REQUISITION_HAS_ACTIVE_TRIALS
    http_status: 409

  - priority: 64
    rule_id: fee_schedule_band_match_exists
    category: business_referential
    applies_to: "POST /role-requisitions/{id}/finalize-scope, POST /placements/{id}/confirm-start"
    condition: "calculations.fee_percent_resolution produces an empty candidate set for the (role_type, compensation) pair"
    error_id: ERR_NO_FEE_SCHEDULE_MATCH
    http_status: 422
    note: "The empty-set boundary: a compensation exactly equal to the top band's ceiling falls outside every band when no unbounded band exists."

  - priority: 65
    rule_id: fee_band_no_overlap
    category: business_constraint
    applies_to: "POST /fee-schedules"
    condition: "an ACTIVE FeeSchedule with the same role_type and the same effective_from has a half-open band that overlaps the proposed [comp_band_floor_cents, comp_band_ceiling_cents)"
    error_id: ERR_FEE_BAND_OVERLAP
    http_status: 409
    note: "Bands that merely touch (one band's ceiling equals the next band's floor) do not overlap and are accepted."

  - priority: 70
    rule_id: segregation_of_duties
    category: business_safety
    applies_to: "POST /reference-checks/{id}/verify, POST /non-solicitation-cases/{id}/resolve"
    condition: "X-User-ID equals the subject row's created_by_user_id (ReferenceCheck) or opened_by_user_id (NonSolicitationCase)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    note: "Same role, different human: the maker may not be the checker."

  - priority: 71
    rule_id: reference_chain_continuity
    category: business_referential
    applies_to: "POST /candidates/{id}/reference-checks"
    condition: "prior_reference_id is supplied and the referenced row's employment_end_month is later than the new row's employment_start_month"
    error_id: ERR_REFERENCE_CHAIN_MISMATCH
    http_status: 422
    note: |
      Outranks reference_period_overlap at priority 90. A payload that both breaks the chain order
      and overlaps a stored period returns ERR_REFERENCE_CHAIN_MISMATCH.

  - priority: 72
    rule_id: candidate_vetting_gate
    category: business_safety
    applies_to: "POST /role-requisitions/{id}/trial-engagements, POST /placements"
    condition: |
      for a trial engagement, Candidate.vetting_status is not in {REFERENCES_VERIFIED,
      BACKGROUND_PENDING, CLEARED}; for a placement, Candidate.vetting_status != CLEARED
    error_id: ERR_CANDIDATE_NOT_VETTED
    http_status: 409

  - priority: 73
    rule_id: candidate_availability_gate
    category: business_safety
    applies_to: "POST /role-requisitions/{id}/trial-engagements, POST /placements"
    condition: |
      for a trial engagement, Candidate.availability_status != AVAILABLE;
      for a placement, Candidate.availability_status NOT IN {ON_TRIAL, OFFER_HELD}, and OFFER_HELD is
      accepted only on the supersede path - the candidate must be the candidate_id of the incumbent
      PENDING_ACCEPTANCE Placement on the requisition named in the request, otherwise the offer is
      still refused
    error_id: ERR_CANDIDATE_UNAVAILABLE
    http_status: 409
    note: "OFFER_HELD is admitted only so that a household can revise its own open offer to the same candidate; a second household cannot poach a candidate who is holding an offer."

  - priority: 74
    rule_id: cooling_off_elapsed
    category: business_temporal
    applies_to: "POST /candidates/{id}/release-availability"
    condition: "Candidate.availability_status == COOLING_OFF and the logical clock date is earlier than Candidate.cooling_off_until"
    error_id: ERR_COOLING_OFF_ACTIVE
    http_status: 409
    note: "A clock landing exactly on cooling_off_until releases the candidate; one day earlier does not."

  - priority: 75
    rule_id: trial_start_reached
    category: business_temporal
    applies_to: "POST /trial-engagements/{id}/start"
    condition: "the logical clock is earlier than TrialEngagement.start_at"
    error_id: ERR_TRIAL_NOT_STARTED
    http_status: 409

  - priority: 76
    rule_id: trial_window_elapsed
    category: business_temporal
    applies_to: "POST /trial-engagements/{id}/record-outcome"
    condition: "the logical clock is earlier than TrialEngagement.end_at"
    error_id: ERR_TRIAL_WINDOW_NOT_ELAPSED
    http_status: 409
    note: |
      Ranks below transition_legal_from_current_state (priority 50). Recording an outcome on a
      SCHEDULED trial before its end_at violates both rules and must surface
      ERR_TRIAL_NOT_IN_PROGRESS.

  - priority: 77
    rule_id: household_trial_no_overlap
    category: business_constraint
    applies_to: "POST /role-requisitions/{id}/trial-engagements"
    condition: |
      another TrialEngagement with the same client_id and status IN {SCHEDULED, IN_PROGRESS} has a
      half-open occupancy interval [start_at - TRIAL_BUFFER_MINUTES, end_at + TRIAL_BUFFER_MINUTES)
      that intersects the proposed [start_at, end_at)
    error_id: ERR_TRIAL_OVERLAP
    http_status: 409
    note: |
      Half-open comparison plus a 120-minute changeover buffer on each side. After a 09:00-17:00
      trial the next admissible start on the same household is 19:00 exactly; 18:59 is refused.

  - priority: 78
    rule_id: candidate_weekly_trial_cap
    category: business_constraint
    applies_to: "POST /role-requisitions/{id}/trial-engagements"
    condition: "the candidate already has CANDIDATE_WEEKLY_TRIAL_CAP (2) TrialEngagement rows with status IN {SCHEDULED, IN_PROGRESS, PASSED, FAILED} whose iso_week_key equals the proposed row's iso_week_key"
    error_id: ERR_TRIAL_WEEKLY_CAP_EXCEEDED
    http_status: 409
    note: "Aggregate rule: each individual trial is admissible, the third one in the same ISO week is not. Cancelled trials do not count against the cap."

  - priority: 79
    rule_id: candidate_score_threshold
    category: business_safety
    applies_to: "POST /role-requisitions/{id}/trial-engagements, POST /placements"
    condition: |
      for a trial engagement, Candidate.screening_score < PRESENTATION_MIN_SCORE (70);
      for a placement, Candidate.placement_ready_score < PLACEMENT_MIN_SCORE (80)
    error_id: ERR_CANDIDATE_SCORE_BELOW_THRESHOLD
    http_status: 422
    note: |
      Outranks client_credit_hold at priority 86. A household that is both over its credit limit
      and presented an under-scoring candidate is told about the candidate, because a safety
      judgement is never traded against a receivable.

  - priority: 80
    rule_id: reference_chain_length_by_role
    category: business_safety
    applies_to: "POST /placements"
    condition: |
      Candidate.longest_contiguous_months < MIN_CHAIN_MONTHS_SENIOR (24) when
      RoleRequisition.role_type IN {ESTATE_MANAGER, CHEF}, or
      < MIN_CHAIN_MONTHS_STANDARD (12) when role_type IN {HOUSEKEEPER, CHAUFFEUR}
    error_id: ERR_REFERENCE_CHAIN_TOO_SHORT
    http_status: 422
    note: "Conditional rule: the same stored chain passes for a housekeeper and fails for a chef."

  - priority: 81
    rule_id: live_in_compatibility
    category: business_constraint
    applies_to: "POST /role-requisitions/{id}/accommodation-terms, POST /accommodation-terms/{id}/respond"
    condition: "the term's live_in is true and Candidate.live_in_willing is false"
    error_id: ERR_LIVE_IN_INCOMPATIBLE
    http_status: 409

  - priority: 82
    rule_id: negotiation_round_cap
    category: business_constraint
    applies_to: "POST /accommodation-terms/{id}/respond"
    condition: "response == COUNTER and AccommodationTerm.round_no >= MAX_NEGOTIATION_ROUNDS (4)"
    error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 409

  - priority: 83
    rule_id: responder_must_alternate
    category: business_constraint
    applies_to: "POST /accommodation-terms/{id}/respond"
    condition: "the party implied by X-User-Role equals AccommodationTerm.last_responder_role"
    error_id: ERR_RESPONDER_MUST_ALTERNATE
    http_status: 409
    note: "A household cannot counter its own counter; the candidate must answer first."

  - priority: 84
    rule_id: passed_trial_required
    category: business_referential
    applies_to: "POST /placements"
    condition: "no TrialEngagement with the given requisition_id and candidate_id has status == PASSED"
    error_id: ERR_NO_PASSED_TRIAL
    http_status: 409

  - priority: 85
    rule_id: accepted_accommodation_required
    category: business_referential
    applies_to: "POST /placements/{id}/confirm-start"
    condition: "no AccommodationTerm with the placement's requisition_id and candidate_id has status == ACCEPTED"
    error_id: ERR_ACCOMMODATION_NOT_ACCEPTED
    http_status: 409

  - priority: 86
    rule_id: client_credit_hold
    category: business_fiscal
    applies_to: "POST /placements, POST /role-requisitions/{id}/trial-engagements"
    condition: "Client.outstanding_balance_cents > CREDIT_HOLD_LIMIT_CENTS (5000000)"
    error_id: ERR_CLIENT_CREDIT_HOLD
    http_status: 409
    note: "Strictly greater than: a balance of exactly 5000000 still transacts."

  - priority: 87
    rule_id: payroll_handoff_attested_for_start_date_milestone
    category: business_referential
    applies_to: "POST /fee-milestones/{id}/invoice"
    condition: "FeeMilestone.milestone_type == START_DATE and no PayrollHandoff of the placement has status == ATTESTED"
    error_id: ERR_PAYROLL_HANDOFF_NOT_ATTESTED
    http_status: 409
    note: "Cross-entity gate on a sibling aggregate: the billing arm is blocked by the compliance arm."

  - priority: 88
    rule_id: ein_issued_before_attest
    category: business_referential
    applies_to: "POST /payroll-handoffs/{id}/attest"
    condition: "PayrollHandoff.ein_status != ISSUED"
    error_id: ERR_EIN_NOT_ISSUED
    http_status: 409

  - priority: 89
    rule_id: single_payroll_handoff_per_placement
    category: business_constraint
    applies_to: "POST /placements/{id}/payroll-handoffs"
    condition: "a PayrollHandoff already exists for the placement"
    error_id: ERR_PAYROLL_HANDOFF_EXISTS
    http_status: 409

  - priority: 90
    rule_id: reference_period_overlap
    category: business_constraint
    applies_to: "POST /candidates/{id}/reference-checks"
    condition: |
      the proposed closed month interval [employment_start_month, employment_end_month]
      intersects the interval of an existing ReferenceCheck of the same candidate whose status is
      not UNREACHABLE
    error_id: ERR_REFERENCE_PERIOD_OVERLAP
    http_status: 409
    note: "Closed intervals: sharing a single month is an overlap, but 2023-12 followed by 2024-01 is adjacency and is accepted."

  - priority: 91
    rule_id: milestone_payment_amount_exact
    category: business_fiscal
    applies_to: "POST /fee-milestones/{id}/record-payment"
    condition: "paid_amount_cents != FeeMilestone.amount_cents"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    note: "No partial payments: the household pays a milestone in full or not at all."

  - priority: 92
    rule_id: guarantee_window_open
    category: business_temporal
    applies_to: "POST /placements/{id}/replacement-claims"
    condition: "the logical clock date is on or after Placement.guarantee_expires_on, or Placement.placement_status == GUARANTEE_EXPIRED"
    error_id: ERR_GUARANTEE_WINDOW_EXPIRED
    http_status: 409
    note: "Half-open window: a claim filed on the day before guarantee_expires_on is admissible with unused_days == 1; a claim filed on guarantee_expires_on itself is refused."

  - priority: 93
    rule_id: separation_date_bounds
    category: business_temporal
    applies_to: "POST /placements/{id}/terminate, POST /placements/{id}/replacement-claims"
    condition: "separation_date < Placement.start_date, or separation_date is later than the logical clock date"
    error_id: ERR_INVALID_SEPARATION_DATE
    http_status: 422

  - priority: 94
    rule_id: single_open_claim_per_placement
    category: business_constraint
    applies_to: "POST /placements/{id}/replacement-claims"
    condition: "a ReplacementClaim on this placement has status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED}"
    error_id: ERR_OPEN_CLAIM_EXISTS
    http_status: 409
    note: "Re-filing after a DENIED claim is allowed and supersedes it; re-filing while a claim is open is not."

  - priority: 95
    rule_id: remedy_matches_requested
    category: business_constraint
    applies_to: "POST /replacement-claims/{id}/review"
    condition: "action == APPROVE_REPLACEMENT while requested_remedy == REFUND, or action == APPROVE_REFUND while requested_remedy == REPLACEMENT"
    error_id: ERR_REMEDY_MISMATCH
    http_status: 409

  - priority: 96
    rule_id: non_solicitation_term_active
    category: business_temporal
    applies_to: "POST /non-solicitation-cases/{id}/investigate"
    condition: "Client.non_solicitation_expires_on is null, or discovered_on is later than Client.non_solicitation_expires_on"
    error_id: ERR_NON_SOLICITATION_TERM_EXPIRED
    http_status: 422
    note: "The term runs NON_SOLICITATION_TERM_DAYS (730) from the household's most recent confirmed placement; conduct discovered on the last covered day is still actionable."

  - priority: 97
    rule_id: settlement_within_penalty
    category: business_fiscal
    applies_to: "POST /non-solicitation-cases/{id}/settle"
    condition: "settlement_amount_cents > NonSolicitationCase.penalty_cents or settlement_amount_cents < 0"
    error_id: ERR_SETTLEMENT_EXCEEDS_PENALTY
    http_status: 422

  - priority: 98
    rule_id: clock_monotonic
    category: business_temporal
    applies_to: "POST /_clock/set_current_utc"
    condition: "the requested timestamp is earlier than the currently stored logical clock"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    note: "The logical clock only moves forward, so sweep-driven transitions can never be un-fired."

endpoints:
  # ---- ops / logical clock -------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    purpose: "Set the logical clock. Advancing it runs the ops sweep that ages INVOICED milestones past their due_date to OVERDUE and moves ACTIVE placements past guarantee_expires_on to GUARANTEE_EXPIRED."
    roles: [AgencyPrincipal, PlacementConsultant, VettingSpecialist, BillingAdministrator, ComplianceOfficer, Client, Candidate]
    input: [current_utc]
    output: "{ current_utc: string, milestones_marked_overdue: integer, placements_guarantee_expired: integer }"
    side_effects:
      - "stores the new logical clock; every subsequent now() reads it"
      - "FeeMilestone INVOICED -> OVERDUE for each row whose due_date is strictly before the new clock date"
      - "Placement ACTIVE -> GUARANTEE_EXPIRED for each row whose guarantee_expires_on is on or before the new clock date"
    errors: [ERR_INVALID_DATE_FORMAT, ERR_CLOCK_NOT_MONOTONIC]
    note: "Default clock before any call is DEFAULT_CLOCK_UTC (2026-08-01T00:00:00Z)."

  - method: GET
    path: /_clock
    purpose: "Read the current logical clock."
    roles: [AgencyPrincipal, PlacementConsultant, VettingSpecialist, BillingAdministrator, ComplianceOfficer, Client, Candidate]
    input: []
    output: "{ current_utc: string }"
    side_effects: []
    errors: []

  # ---- Client --------------------------------------------------------------
  - method: POST
    path: /clients
    purpose: "Intake a prospective household."
    roles: [AgencyPrincipal, PlacementConsultant]
    input: [household_name, primary_contact_email, region_code]
    output: Client
    side_effects:
      - "creates the Client in status PROSPECT with confidentiality_agreement_status UNSIGNED, outstanding_balance_cents 0, placement_count 0, version 1"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_INVALID_ROLE, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_ENUM]

  - method: GET
    path: /clients/{id}
    purpose: "Read one household, including its derived receivable balance."
    roles: [AgencyPrincipal, PlacementConsultant, VettingSpecialist, BillingAdministrator, ComplianceOfficer, Client, Candidate]
    input: []
    output: Client
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADER, ERR_CLIENT_NOT_FOUND]

  - method: GET
    path: /clients
    purpose: "List households."
    roles: [AgencyPrincipal, PlacementConsultant, VettingSpecialist, BillingAdministrator, ComplianceOfficer]
    input: ["status?", "region_code?", "confidentiality_agreement_status?", "limit?", "offset?"]
    output: Client[]
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADER, ERR_INVALID_ENUM, ERR_INVALID_RANGE]

  - method: POST
    path: /clients/{id}/confidentiality-agreement
    purpose: "Sign (household) or countersign (agency) the confidentiality agreement. action=SIGN is exclusive to the Client role; action=COUNTERSIGN is exclusive to AgencyPrincipal."
    roles: [AgencyPrincipal, Client]
    input: [action, "signatory_name?"]
    output: Client
    side_effects:
      - "action=SIGN sets confidentiality_agreement_status UNSIGNED -> SIGNED and stores signatory_name"
      - "action=COUNTERSIGN sets confidentiality_agreement_status SIGNED -> COUNTERSIGNED, stamps countersigned_at and drives Client PROSPECT -> ONBOARDED"
      - "increments Client.version"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_ENUM, ERR_CLIENT_NOT_FOUND, ERR_INVALID_STATE_TRANSITION]

  - method: POST
    path: /clients/{id}/ledger-adjustments
    purpose: "Append a manual ledger movement to a household's account."
    roles: [BillingAdministrator]
    input: [entry_type, signed_amount_cents, "memo?"]
    output: LedgerEntry
    side_effects:
      - "appends a LedgerEntry with the next sequence_no, related_ref_type NONE and balance_after_cents stamped by calculations.client_receivable_balance"
      - "recomputes Client.outstanding_balance_cents and increments Client.version"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_ENUM, ERR_INVALID_LEDGER_AMOUNT, ERR_CLIENT_NOT_FOUND]
    note: "entry_type is restricted to MANUAL_ADJUSTMENT here; all other entry types are produced only by their own workflow transitions."

  - method: GET
    path: /clients/{id}/ledger-entries
    purpose: "Read a household's append-only ledger in sequence order."
    roles: [AgencyPrincipal, BillingAdministrator, ComplianceOfficer, Client]
    input: ["entry_type?", "related_ref_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_CLIENT_NOT_FOUND, ERR_INVALID_ENUM]

  # ---- FeeSchedule ---------------------------------------------------------
  - method: POST
    path: /fee-schedules
    purpose: "Publish a fee band for a role type."
    roles: [AgencyPrincipal]
    input: [role_type, comp_band_floor_cents, "comp_band_ceiling_cents?", fee_percent_bps, guarantee_window_days, effective_from]
    output: FeeSchedule
    side_effects:
      - "creates the FeeSchedule in status ACTIVE with version 1"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_ENUM, ERR_INVALID_RANGE, ERR_INVALID_DATE_FORMAT, ERR_INVALID_INTERVAL, ERR_FEE_BAND_OVERLAP]
    note: "Omitting comp_band_ceiling_cents publishes an unbounded top band."

  - method: GET
    path: /fee-schedules/{id}
    purpose: "Read one fee band."
    roles: [AgencyPrincipal, PlacementConsultant, BillingAdministrator, ComplianceOfficer, Client]
    input: []
    output: FeeSchedule
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADER, ERR_FEE_SCHEDULE_NOT_FOUND]

  - method: GET
    path: /fee-schedules
    purpose: "List fee bands."
    roles: [AgencyPrincipal, PlacementConsultant, BillingAdministrator, ComplianceOfficer, Client]
    input: ["role_type?", "status?", "limit?", "offset?"]
    output: FeeSchedule[]
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADER, ERR_INVALID_ENUM, ERR_INVALID_RANGE]

  - method: POST
    path: /fee-schedules/{id}/retire
    purpose: "Retire a fee band so future resolutions ignore it."
    roles: [AgencyPrincipal]
    input: ["reason?"]
    output: FeeSchedule
    side_effects:
      - "FeeSchedule ACTIVE -> RETIRED; already-stamped requisition and placement snapshots are untouched"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_FEE_SCHEDULE_NOT_FOUND, ERR_ENTITY_TERMINAL]

  # ---- RoleRequisition -----------------------------------------------------
  - method: POST
    path: /role-requisitions
    purpose: "Open a role search for a household."
    roles: [PlacementConsultant, Client]
    input: [client_id, role_type, first_year_compensation_cents, schedule_pattern, "live_in_required?", "scope_note?"]
    output: RoleRequisition
    side_effects:
      - "creates the RoleRequisition in status DRAFT with scoping_round 0, active_trial_count 0, null fee fields, version 1"
      - "stamps created_by_user_id from X-User-ID"
