  - rule_id: compensating_invariant
    instances:
      - name: route_stop_count_conserved_on_schedule_then_cancel
        grounds:
          - state_machines.WorkOrder.DRAFT_to_SCHEDULED
          - state_machines.WorkOrder.SCHEDULED_to_CANCELLED
          - entities.Route.fields.assigned_stop_count
        distinguishing_aspect: |
          Conserved quantity = Route.assigned_stop_count (a count). Schedule increments 0->1,
          cancel decrements 1->0; invariant assigned_stop_count == count(WO with route_id==route
          and status IN {SCHEDULED,DISPATCHED}) holds, no drift.
        test_recipe:
          setup:
            - "Account GOOD; Site; ACTIVE tech; OPEN route; PUMPING WO scheduled (assigned_stop_count=1)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
