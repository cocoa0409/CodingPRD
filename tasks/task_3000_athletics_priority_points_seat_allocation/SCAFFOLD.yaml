  - method: GET
    path: "/athletics/selection-slots/{id}"
    description: "Fetch one selection slot, including rank_at_publish and the half-open pick window."
    roles: [DevelopmentOfficer, PointsCertifier, PolicyCommittee, PlatformAdmin, Donor]
