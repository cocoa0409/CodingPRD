            - "${d1_state3} == 'CLOSED' with ${d1_tons3} == 166.60 and ${d1_airspace3} == 196.00 — identical to the first close, no drift"
            - "after the re-close Cell.${c2_id}.consumed_airspace_cy == 196.00 (not 392.00) with fill_pct 98.00 and status 'FULL'; Landfill.${lf_id}.consumed_airspace_cy == 196.00 and operating_status == 'SUSPENDED_NO_AIRSPACE' again"
            - "${l1_bill3} == 'FINALIZED', ${l1_royalty3} == 368.14, ${l1_final3} == 8073.39 and ${l1_gate3} == 7705.25 — the gate variant was never recomputed across close, amend and re-close"
            - "OperatingDay.${d1_id}.version, Cell.${c2_id}.version and Landfill.${lf_id}.version all strictly increased across the amend and the re-close; compensation reverses field values, never version counters"

      - name: amend_rebases_special_waste_tonnage_and_reverses_exhaustion
        grounds:
          - state_machines.OperatingDay.CLOSED_to_AMENDED
          - state_machines.SpecialWasteApproval.APPROVED_to_EXHAUSTED
          - state_machines.SpecialWasteApproval.EXHAUSTED_to_APPROVED
          - entities.SpecialWasteApproval.fields.consumed_tons
          - validations[priority=25]
        distinguishing_aspect: |
          The approval's consumed_tons ledger is measured on TWO different bases depending on
          each referencing load's billing dimension: manifest tons while PROVISIONAL, certified
          tons once FINALIZED. So the day close silently re-bases 130.00 to 137.25 and pushes
          the approval past a cap of 137.00 that the manifest basis never touched, and the
          amend re-bases it back to 130.00 and un-exhausts it. The cap check at clear-screening
          used the manifest basis and legitimately passed, which is exactly why an
          implementation that keeps a single running counter cannot reproduce either number.
        test_recipe:
          setup:
            - "Landfill LF with a single large cell C-1 (design_airspace_cy 1000000) ACTIVE, funded assurance and an EXECUTED HostCommunityAgreement, so nothing else blocks closing."
            - "SpecialWasteApproval SWA: profile_stream INDUSTRIAL_SPECIAL, approved_tons_cap 137.00, APPROVED."
            - "OperatingDay D1 on 2026-08-05 against C-1 (ALTERNATIVE_TARP, working_face_area_sf 5000)."
            - "Two INDUSTRIAL_SPECIAL loads linked to SWA: L1 manifest_tons 40.00 certified 45.25, L2 manifest_tons 90.00 certified 92.0, both cleared before certification."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000, daily_load_limit: 200 }
