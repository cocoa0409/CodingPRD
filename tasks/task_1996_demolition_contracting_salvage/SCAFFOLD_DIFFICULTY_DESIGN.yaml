          assert:
            - "link 1: EngineeringSurvey.${es_id}.status == DRAFT and revision_number == 2"
            - "link 2 (caused by link 1 pin invalidation): ${p_st} == PRECONDITIONS_PENDING and ${p_pin_rev} == 1 (pin kept but stale)"
