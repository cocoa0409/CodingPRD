          setup:
            - "The standard single-load harvest chain: producer, block, reference QualitySpec, lane, crew, ACTIVE TONNAGE contract GC-DISPUTE with base 450000 and committed_tons 40.000, completed PICK_READY sampling visit, acknowledged pick call, one appointment."
