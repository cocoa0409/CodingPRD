  - rule_id: non_linear_state_machine
    instances:
      - name: upheld_rebuttal_returns_review_to_selected_and_clears_the_score
        grounds:
          - state_machines.Review.SCORED_to_DISPUTED
          - state_machines.Review.DISPUTED_to_SELECTED
          - state_machines.Review.SCORED_to_SCORED
          - entities.Review.fields.rebuttal_round_count
        distinguishing_aspect: |
          True cycle, not a forward-only chain: SELECTED -> SCORED -> DISPUTED -> SELECTED -> SCORED
          returns the Review to a state it already occupied, with provisional_composite_score and
          scored_at reset to null while current_sheet_round keeps climbing (1 then 2) and
          rebuttal_round_count monotonically records the loop count.
        test_recipe:
          setup:
            - "Program with max_rebuttal_rounds 2 and rebuttal_window_days 14."
