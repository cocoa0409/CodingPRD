# ===========================================================================
  - section: consistency_model
    instances:

      - name: rejected_allowance_apply_leaves_no_partial_credit
        claim_type: saga
        grounds:
          - complexity_profile.consistency_model
          - calculations.capacity_guarantee_reserve_floor
          - errors[ERR_GUARANTEE_FLOOR_BREACH]
        distinguishing_aspect: "When the allowance apply fails the headroom check the multi-step allowancing sequence compensates completely: the allowance stays ALLOWANCE_ISSUED, applied_amount_cents stays 0 and the site's reserved_capacity_hold_count does not advance."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. One site with one active PPA seeded at capacity_reserve_pre_cents 200000 and loss_floor_cents 25000, already carrying two applied allowances totalling 175000 cents."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Hopland Aggregate", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id }
            - call: "POST /power/customers"
              payload: { name: "Hopland Aggregates Inc", industry_code: "212321", credit_tier: "CREDIT_STANDARD" }
              as: CustomerService
              captures: { cust_id: $.data.id }
            - call: "POST /power/ppas"
              payload: { site_id: "${site_id}", customer_id: "${cust_id}", term_years: 15, contracted_kw: 500, contracted_efficiency_kwh_per_therm: 7.4, contracted_annual_kwh: 3240000, tariff_base_cents_per_kwh: 12.0, escalator_pct: 0.03, fuel_adder_cents_per_therm: 2.50, guaranteed_availability_pct: 0.97, guaranteed_delivery_kwh: 3240000, customer_cure_deadline_days: 30, fuel_responsibility: "PPA_FUEL_INCLUDED", loss_floor_cents: 25000, capacity_reserve_pre_cents: 200000 }
              as: SiteOperator
              captures: { ppa_id: $.data.id }
            - call: "POST /power/ppas/${ppa_id}/activate"
              payload: {}
              as: SiteOperator
              captures: { ppa_v: $.data.version }
            - call: "POST /power/ppa-accruals"
              payload: { ppa_id: "${ppa_id}", site_id: "${site_id}", accrual_type: "CAPACITY_ACCRUAL", amount_cents: 400000, period_anchor_iso8601: "2026-01-01T00:00:00Z" }
              as: SettlementAnalyst
              captures: { ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/allowances"
              payload: { allowance_kind: "CAPACITY_ALLOWANCE", amount_cents: 50000, expected_ppa_version: "${ppa_v}" }
              as: SettlementAnalyst
              captures: { a1_id: $.data.id, ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/allowances"
              payload: { allowance_kind: "CAPACITY_ALLOWANCE", amount_cents: 75000, expected_ppa_version: "${ppa_v}" }
              as: SettlementAnalyst
              captures: { a2_id: $.data.id, ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/allowances"
              payload: { allowance_kind: "CAPACITY_ALLOWANCE", amount_cents: 50000, expected_ppa_version: "${ppa_v}" }
              as: SettlementAnalyst
              captures: { a3_id: $.data.id }
            - call: "POST /power/ppas/${ppa_id}/allowances/${a1_id}/apply"
              payload: {}
              as: SettlementAnalyst
            - call: "POST /power/ppas/${ppa_id}/allowances/${a2_id}/apply"
              payload: {}
              as: SettlementAnalyst
          trigger:
            - call: "POST /power/ppas/${ppa_id}/allowances/${a3_id}/apply"
              payload: {}
              as: SettlementAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and data.error_id == ERR_GUARANTEE_FLOOR_BREACH"
            - "SettlementAllowance.${a3_id}.lifecycle_state is still ALLOWANCE_ISSUED"
            - "SettlementAllowance.${a3_id}.applied_amount_cents == 0 and SettlementAllowance.${a3_id}.applied_days == 0"
            - "Ppa.${ppa_id}.capacity_reserve_credits_cents == 125000 and is unchanged by the rejected apply"
            - "the site's reserved_capacity_hold_count is unchanged by the rejected apply"

      - name: reverse_restores_the_pool_the_settle_had_drained
        claim_type: saga
        grounds:
          - state_machines.SettlementLine.SETTLEMENT_APPLIED_to_SETTLEMENT_REVERSED
