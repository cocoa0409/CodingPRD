              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
          assert:
            - "HTTP 200; FlightLeg.${leg2_id}.status == \"CANCELLED\""
            - "ScheduleVersion.${sv_id}.unslotted_leg_count == 1, schedule_compliance_score == 92.00, compliance_state == \"CLEAN\" (WARNED -> CLEAN re-derivation)"
            - "ScheduleVersion.${sv_id}.leg_count == 2 — leg_count counts every leg ever added, including cancelled ones"
            - "GET /flight-legs filtered by schedule_version_id ${sv_id} and status \"CANCELLED\" returns total_count == 1"

      - name: compensation_tier_flips_to_mandatory_at_exactly_one_hundred_twenty_minutes
        claim_type: tier_boundary
        grounds:
          - calculations.notification_compensation_cents
          - endpoints.POST_notification_obligations
        distinguishing_aspect: |
          TIER_THRESHOLD_MINUTES 120 is the inclusive floor of MANDATORY_REACCOMMODATION: 119 minutes is
          ADVISORY at 37.5% (10 * RATE_ECONOMY_CENTS 25124 = 251240, * 0.375 = 94215) while exactly
          120 minutes is MANDATORY_REACCOMMODATION at MANDATORY_MULTIPLIER_PCT 100.0 (251240). The same
          recipe pins MIN_MAGNITUDE_MINUTES 30 from below — 29
          minutes is rejected outright — and NOTIFY_WINDOW_HOURS 72 against the default clock, giving
          notify_deadline_utc 2026-08-04T00:00:00Z.
        test_recipe:
          setup:
            - "Home carrier HX; MUC and TXL LEVEL_2_FACILITATED; Season W26 OPEN; ScheduleVersion W26-N1 with one MUC->TXL leg on 2026-11-03 08:00Z->09:00Z."
            - "The leg carries a booking snapshot of booked_first 0, booked_business 0, booked_economy 10, so only the economy rate is in play and the per-cabin rounding is exact."
            - "The logical clock is left at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "TXL", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: false }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { txl_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-N1" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX320", origin_station_id: "${muc_id}", dest_station_id: "${txl_id}", dep_utc: "2026-11-03T08:00:00Z", arr_utc: "2026-11-03T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg_id: "$.data.id" }
            - call: "POST /flight-legs/${leg_id}/booking-snapshot"
              payload: { booked_first: 0, booked_business: 0, booked_economy: 10 }
              as: ComplianceOfficer
              as_user_id: "usr-comp-1"
          trigger:
            - call: "POST /notification-obligations"
              payload: { flight_leg_id: "${leg_id}", trigger_kind: "RETIME", change_magnitude_minutes: 119 }
              as: ComplianceOfficer
              as_user_id: "usr-comp-1"
              captures: { ob_adv_id: "$.data.id" }
            - call: "POST /notification-obligations"
              payload: { flight_leg_id: "${leg_id}", trigger_kind: "RETIME", change_magnitude_minutes: 120 }
              as: ComplianceOfficer
              as_user_id: "usr-comp-1"
              captures: { ob_man_id: "$.data.id" }
            - call: "POST /notification-obligations"
              payload: { flight_leg_id: "${leg_id}", trigger_kind: "RETIME", change_magnitude_minutes: 29 }
              as: ComplianceOfficer
              as_user_id: "usr-comp-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "obligation ${ob_adv_id}: obligation_tier == \"ADVISORY\", booked_total == 10, compensation_cents == 94215, notify_deadline_utc == \"2026-08-04T00:00:00Z\""
            - "obligation ${ob_man_id}: obligation_tier == \"MANDATORY_REACCOMMODATION\", booked_total == 10, compensation_cents == 251240 — exactly 120 is on the mandatory side"
            - "trigger call 3 -> HTTP 422 with data.error_id == \"ERR_INVALID_REQUEST\" because 29 < MIN_MAGNITUDE_MINUTES 30"
            - "FlightLeg.${leg_id}.open_obligation_count == 2 — the rejected call did not increment it"
            - "both obligations have status \"PENDING\", dispatched_channel == null, regulator_reference == null and late_dispatch == false"

      - name: mct_shortfall_is_zero_at_exactly_the_station_minimum_connect_time
