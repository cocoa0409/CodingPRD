scaffold_corner_design:

  # =========================================================================
  # SECTION: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_pending_kyc
        claim_type: Creation
        grounds: [entities.Customer, endpoints."POST /customers"]
        distinguishing_aspect: "POST /customers with all required fields -> 201; kyc_status==PENDING, risk_tier==STANDARD, risk_score==0, version==1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "New Cust", id_type: "DRIVERS_LICENSE", id_number: "DL-100", date_of_birth: "1990-01-01" }
              as: Teller
              as_user_id: "teller-1"
              captures: { cust_id: $.data.id }
          assert:
            - "response code == 201"
            - "Customer.${cust_id}.kyc_status == PENDING"
            - "Customer.${cust_id}.risk_tier == STANDARD"
            - "Customer.${cust_id}.risk_score == 0"
            - "Customer.${cust_id}.version == 1"

      - name: get_customer_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Customer, 'endpoints."GET /customers/{id}"']
        distinguishing_aspect: "GET /customers/{id} returns the stored customer with matching full_name."
        test_recipe:
          setup: ["one customer registered"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Read Me", id_type: "PASSPORT", id_number: "P-101", date_of_birth: "1980-02-02" }
              as: Teller
              as_user_id: "teller-1"
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
          assert:
            - "response code == 200"
            - "Customer.${cust_id}.full_name == Read Me"

      - name: list_customers_paginated_envelope
        claim_type: Listing
        grounds: [entities.Customer, endpoints."GET /customers"]
        distinguishing_aspect: "GET /customers returns response_type==array with total_count and has_more present."
        test_recipe:
          setup: ["two customers registered"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C One", id_type: "STATE_ID", id_number: "SID-102", date_of_birth: "1981-03-03" }
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /customers"
              payload: { full_name: "C Two", id_type: "STATE_ID", id_number: "SID-103", date_of_birth: "1982-04-04" }
              as: Teller
              as_user_id: "teller-1"
          trigger:
            - call: "GET /customers"
              payload: { limit: 1, offset: 0 }
              as: Teller
              as_user_id: "teller-1"
          assert:
            - "response response_type == array"
            - "response total_count == 2"
            - "response has_more == true"

      - name: get_customer_not_found
        claim_type: Not Found
        grounds: [entities.Customer, 'validations[priority=3]']
        distinguishing_aspect: "GET /customers/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "response http_status == 404"

      - name: create_customer_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Customer.fields.id_number, endpoints."POST /customers"]
        distinguishing_aspect: "POST /customers omitting id_number (source input, no default) -> ERR_VALIDATION (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "No IdNum", id_type: "DRIVERS_LICENSE", date_of_birth: "1990-01-01" }
              as: Teller
              as_user_id: "teller-1"
          assert:
            - "response error_id == ERR_VALIDATION"
            - "response http_status == 422"

      - name: fee_schedule_active_defaults_true
        claim_type: Defaults
        grounds: [entities.FeeSchedule.fields.active, endpoints."POST /fee-schedules"]
        distinguishing_aspect: "POST /fee-schedules omitting active -> defaults to true."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /fee-schedules"
              payload: { check_type: "PERSONAL", base_fee_cents: 500, percent_rate_bps: 300, tier_breakpoint_cents: 100000, high_percent_rate_bps: 400, max_fee_cents: 10000 }
              as: StoreManager
              as_user_id: "manager-9"
              captures: { sched_id: $.data.id }
          assert:
            - "FeeSchedule.${sched_id}.active == true"

      - name: transaction_fee_computed_ignores_client_value
        claim_type: Computed Fields
        grounds: [entities.Transaction.fields.fee_cents, calculations.service_fee]
        distinguishing_aspect: "fee_cents is server-computed; a BILL_PAY transaction always yields fee_cents==195 regardless of any client-supplied value (field not in input)."
        test_recipe:
          setup: ["VERIFIED customer, OPEN drawer"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Bill Payer", id_type: "DRIVERS_LICENSE", id_number: "DL-104", date_of_birth: "1985-05-05" }
              as: Teller
              as_user_id: "teller-1"
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
              as_user_id: "manager-9"
            - call: "POST /cash-drawers"
              payload: { store_code: "C1", business_date: "2026-05-01", opening_float_cents: 1000000 }
              as: StoreManager
              as_user_id: "manager-9"
              captures: { drawer_id: $.data.id }
          trigger:
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "BILL_PAY", face_amount_cents: 80000, biller_code: "ELEC", account_reference: "ACC-1" }
              as: Teller
              as_user_id: "teller-1"
              captures: { txn_id: $.data.id }
          assert:
            - "Transaction.${txn_id}.fee_cents == 195"

      - name: customer_system_fields_generated
        claim_type: System Fields
        grounds: [entities.Customer.fields.id, entities.Customer.fields.created_at]
        distinguishing_aspect: "id, created_at, updated_at, version are system-generated; a client-supplied id in the body is ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Sys Fields", id_type: "STATE_ID", id_number: "SID-105", date_of_birth: "1988-08-08" }
              as: Teller
              as_user_id: "teller-1"
              captures: { cust_id: $.data.id }
          assert:
            - "Customer.${cust_id}.id is a server-minted UUID with no type prefix"
            - "Customer.${cust_id}.created_at is ISO 8601 UTC with three fractional digits"
            - "Customer.${cust_id}.version == 1"

      - name: customer_invalid_id_type_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Customer.fields.id_type]
        distinguishing_aspect: "POST /customers with id_type not in {DRIVERS_LICENSE,STATE_ID,PASSPORT,MILITARY_ID} -> ERR_VALIDATION (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Bad Enum", id_type: "FACE_TATTOO", id_number: "X-1", date_of_birth: "1990-01-01" }
              as: Teller
              as_user_id: "teller-1"
          assert:
            - "response error_id == ERR_VALIDATION"
            - "response http_status == 422"

      - name: compliance_screen_immutable_no_version
        claim_type: Immutability
        grounds: [entities.ComplianceScreen]
        distinguishing_aspect: "ComplianceScreen has common_fields=false: it carries only id and created_at, no version field, and no update endpoint exists."
        test_recipe:
          setup: ["a screened customer"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Screen Sub", id_type: "PASSPORT", id_number: "P-106", date_of_birth: "1979-09-09" }
              as: Teller
              as_user_id: "teller-1"
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
              as_user_id: "manager-9"
              captures: { screen_id: $.data.id }
          trigger:
            - call: "GET /customers/${cust_id}/compliance-screens"
              payload: {}
              as: StoreManager
              as_user_id: "manager-9"
          assert:
            - "ComplianceScreen list contains ${screen_id}"
            - "ComplianceScreen entries expose no version field"

      - name: transaction_face_amount_zero_rejected
        claim_type: Type Constraints
        grounds: [entities.Transaction.fields.face_amount_cents]
        distinguishing_aspect: "face_amount_cents has constraint >=1; a value of 0 -> ERR_VALIDATION (422). Boundary: zero quantity on a numeric input field."
        test_recipe:
          setup: ["VERIFIED customer, OPEN drawer"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Zero Face", id_type: "DRIVERS_LICENSE", id_number: "DL-107", date_of_birth: "1990-01-01" }
              as: Teller
              as_user_id: "teller-1"
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
              as_user_id: "manager-9"
            - call: "POST /cash-drawers"
              payload: { store_code: "C2", business_date: "2026-05-01", opening_float_cents: 1000000 }
              as: StoreManager
              as_user_id: "manager-9"
              captures: { drawer_id: $.data.id }
          trigger:
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "MONEY_ORDER", face_amount_cents: 0, payee_name: "Z" }
              as: Teller
              as_user_id: "teller-1"
          assert:
            - "response error_id == ERR_VALIDATION"
            - "response http_status == 422"

  # =========================================================================
  # SECTION: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: checkitem_initial_state_verifying
        claim_type: Initial State
        grounds: [state_machines.CheckItem, entities.CheckItem.fields.verification_state]
        distinguishing_aspect: "A CHECK_CASH posting that goes RISK_HELD leaves the CheckItem observable; but a held check's CheckItem starts at VERIFYING then immediately resolves — assert hold path produces VERIFYING->RISK_HELD, not a stuck VERIFYING."
        test_recipe:
          setup: ["VERIFIED customer, PAYROLL schedule, OPEN drawer, check face=350000 (AMOUNT hold)"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Init State", id_type: "STATE_ID", id_number: "SID-108", date_of_birth: "1983-03-13" }
              as: Teller
              as_user_id: "teller-1"
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
              as_user_id: "manager-9"
            - call: "POST /fee-schedules"
              payload: { check_type: "PAYROLL", base_fee_cents: 199, percent_rate_bps: 150, tier_breakpoint_cents: 199999, high_percent_rate_bps: 275, max_fee_cents: 2000000, active: true }
              as: StoreManager
              as_user_id: "manager-9"
              captures: { sched_id: $.data.id }
            - call: "POST /cash-drawers"
              payload: { store_code: "C3", business_date: "2026-05-01", opening_float_cents: 2000000 }
              as: StoreManager
              as_user_id: "manager-9"
              captures: { drawer_id: $.data.id }
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "CHECK_CASH", face_amount_cents: 350000, fee_schedule_id: "${sched_id}", maker_account_risk: "LOW" }
              as: Teller
              as_user_id: "teller-1"
              captures: { txn_id: $.data.id }
          trigger:
            - call: "GET /transactions/${txn_id}/check-items"
              payload: {}
              as: StoreManager
              as_user_id: "manager-9"
              captures: { check_id: "$.data[0].id" }
          assert:
            - "CheckItem.${check_id}.verification_state == RISK_HELD"

      - name: maker_high_risk_hold_reason_maker_risk
        claim_type: Side Effect Execution
        grounds: [state_machines.CheckItem.VERIFYING_to_RISK_HELD, entities.CheckItem.fields.hold_reason]
        distinguishing_aspect: "A CHECK_CASH below HOLD_THRESHOLD with maker_account_risk==HIGH goes RISK_HELD with hold_reason==MAKER_RISK (AMOUNT not matched first since face < threshold)."
        test_recipe:
          setup: ["VERIFIED customer, GOVT schedule, OPEN drawer, check face=100000 maker HIGH"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Maker High", id_type: "PASSPORT", id_number: "P-109", date_of_birth: "1984-04-14" }
              as: Teller
              as_user_id: "teller-1"
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
              as_user_id: "manager-9"
            - call: "POST /fee-schedules"
              payload: { check_type: "GOVERNMENT", base_fee_cents: 99, percent_rate_bps: 100, tier_breakpoint_cents: 500000, high_percent_rate_bps: 200, max_fee_cents: 50000, active: true }
              as: StoreManager
              as_user_id: "manager-9"
              captures: { sched_id: $.data.id }
            - call: "POST /cash-drawers"
              payload: { store_code: "C4", business_date: "2026-05-01", opening_float_cents: 1000000 }
              as: StoreManager
              as_user_id: "manager-9"
              captures: { drawer_id: $.data.id }
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "CHECK_CASH", face_amount_cents: 100000, fee_schedule_id: "${sched_id}", maker_account_risk: "HIGH" }
              as: Teller
              as_user_id: "teller-1"
              captures: { txn_id: $.data.id }
          trigger:
            - call: "GET /transactions/${txn_id}/check-items"
              payload: {}
              as: StoreManager
              as_user_id: "manager-9"
              captures: { check_id: "$.data[0].id" }
          assert:
            - "CheckItem.${check_id}.verification_state == RISK_HELD"
            - "CheckItem.${check_id}.hold_reason == MAKER_RISK"

      - name: release_already_cleared_check_invalid_state
        claim_type: Invalid Transition
        grounds: [state_machines.CheckItem.RISK_HELD_to_CLEARED, 'validations[priority=4]']
        distinguishing_aspect: "POST /check-items/{id}/release on a CheckItem already CLEARED (auto-cleared at post) -> ERR_INVALID_STATE (409); release is only valid from RISK_HELD."
        test_recipe:
          setup: ["VERIFIED customer, GOVT schedule, OPEN drawer, a CHECK_CASH face=100000 maker LOW that auto-CLEARED"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Already Clear", id_type: "DRIVERS_LICENSE", id_number: "DL-110", date_of_birth: "1990-10-10" }
              as: Teller
              as_user_id: "teller-1"
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
              as_user_id: "manager-9"
            - call: "POST /fee-schedules"
              payload: { check_type: "GOVERNMENT", base_fee_cents: 99, percent_rate_bps: 100, tier_breakpoint_cents: 500000, high_percent_rate_bps: 200, max_fee_cents: 50000, active: true }
              as: StoreManager
              as_user_id: "manager-9"
              captures: { sched_id: $.data.id }
            - call: "POST /cash-drawers"
              payload: { store_code: "C5", business_date: "2026-05-01", opening_float_cents: 1000000 }
              as: StoreManager
              as_user_id: "manager-9"
              captures: { drawer_id: $.data.id }
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "CHECK_CASH", face_amount_cents: 100000, fee_schedule_id: "${sched_id}", maker_account_risk: "LOW" }
              as: Teller
              as_user_id: "teller-1"
              captures: { txn_id: $.data.id }
            - call: "GET /transactions/${txn_id}/check-items"
              payload: {}
              as: StoreManager
              as_user_id: "manager-9"
              captures: { check_id: "$.data[0].id" }
          trigger:
            - call: "POST /check-items/${check_id}/release"
              payload: {}
              as: StoreManager
              as_user_id: "manager-9"
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response http_status == 409"

      - name: void_already_voided_transaction_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Transaction.lifecycle_POSTED_to_lifecycle_VOIDED, 'validations[priority=4]']
        distinguishing_aspect: "POST /transactions/{id}/void a second time on an already-VOIDED transaction -> ERR_INVALID_STATE (409); void is only valid from POSTED."
        test_recipe:
          setup: ["VERIFIED customer, OPEN drawer, a POSTED MONEY_ORDER then VOIDED once"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Double Void", id_type: "STATE_ID", id_number: "SID-111", date_of_birth: "1986-06-16" }
              as: Teller
              as_user_id: "teller-1"
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
              as_user_id: "manager-9"
            - call: "POST /cash-drawers"
              payload: { store_code: "C6", business_date: "2026-05-01", opening_float_cents: 1000000 }
              as: StoreManager
              as_user_id: "manager-9"
              captures: { drawer_id: $.data.id }
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "MONEY_ORDER", face_amount_cents: 50000, payee_name: "X" }
              as: Teller
              as_user_id: "teller-1"
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/void"
              payload: {}
              as: StoreManager
              as_user_id: "manager-9"
          trigger:
            - call: "POST /transactions/${txn_id}/void"
              payload: {}
              as: StoreManager
              as_user_id: "manager-9"
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response http_status == 409"

      - name: closed_drawer_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.CashDrawer, state_machines.CashDrawer.RECONCILING_to_CLOSED]
        distinguishing_aspect: "begin-reconcile on a CLOSED drawer -> ERR_INVALID_STATE (409); CLOSED is terminal, no transitions out."
        test_recipe:
          setup: ["a drawer opened, begin-reconciled, and CLOSED with a matching count"]
          setup_api_calls:
            - call: "POST /cash-drawers"
              payload: { store_code: "C7", business_date: "2026-05-01", opening_float_cents: 300000 }
              as: StoreManager
              as_user_id: "manager-9"
              captures: { drawer_id: $.data.id }
            - call: "POST /cash-drawers/${drawer_id}/begin-reconcile"
              payload: {}
              as: StoreManager
              as_user_id: "manager-9"
            - call: "GET /cash-drawers/${drawer_id}"
              payload: {}
              as: StoreManager
              as_user_id: "manager-9"
              captures: { dv: $.data.version }
            - call: "POST /cash-drawers/${drawer_id}/close"
              payload: { counted_cash_cents: 300000, expected_drawer_version: "${dv}" }
              as: StoreManager
              as_user_id: "manager-9"
          trigger:
            - call: "POST /cash-drawers/${drawer_id}/begin-reconcile"
              payload: {}
              as: StoreManager
              as_user_id: "manager-9"
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response http_status == 409"

      - name: drawer_close_over_short_on_variance
        claim_type: Valid Transition
        grounds: [state_machines.CashDrawer.RECONCILING_to_OVER_SHORT, entities.CashDrawer.fields.variance_cents]
        distinguishing_aspect: "Close with counted_cash_cents != expected_cash_cents -> status OVER_SHORT, variance_cents signed (counted - expected). Branch divergent from the CLOSED path."
        test_recipe:
          setup: ["a RECONCILING drawer with opening_float 500000 and no postings (expected 500000)"]
          setup_api_calls:
            - call: "POST /cash-drawers"
              payload: { store_code: "C8", business_date: "2026-05-01", opening_float_cents: 500000 }
              as: StoreManager
              as_user_id: "manager-9"
              captures: { drawer_id: $.data.id }
            - call: "POST /cash-drawers/${drawer_id}/begin-reconcile"
              payload: {}
              as: StoreManager
              as_user_id: "manager-9"
            - call: "GET /cash-drawers/${drawer_id}"
              payload: {}
              as: StoreManager
              as_user_id: "manager-9"
              captures: { dv: $.data.version }
          trigger:
            - call: "POST /cash-drawers/${drawer_id}/close"
              payload: { counted_cash_cents: 499000, expected_drawer_version: "${dv}" }
              as: StoreManager
              as_user_id: "manager-9"
          assert:
            - "CashDrawer.${drawer_id}.status == OVER_SHORT"
            - "CashDrawer.${drawer_id}.variance_cents == -1000"

      - name: write_off_clears_remaining_recovery_and_risk
        claim_type: Side Effect Execution
        grounds: [state_machines.ReturnedItem.OUTSTANDING_to_WRITTEN_OFF, entities.Customer.fields.outstanding_recovery_cents, entities.Customer.fields.risk_score]
        distinguishing_aspect: "Write-off of an OUTSTANDING item (total_owed 102500) clears Customer.outstanding_recovery_cents to 0 and adds WRITE_OFF_RISK_DELTA 200 to risk_score (which was 250 from the return -> 450)."
        test_recipe:
          setup: ["a RETURNED CHECK_CASH face=100000, ReturnedItem OUTSTANDING, customer risk_score 250, outstanding 102500"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Write Off", id_type: "PASSPORT", id_number: "P-112", date_of_birth: "1977-07-27" }
              as: Teller
              as_user_id: "teller-1"
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
              as_user_id: "manager-9"
            - call: "POST /fee-schedules"
              payload: { check_type: "GOVERNMENT", base_fee_cents: 99, percent_rate_bps: 100, tier_breakpoint_cents: 500000, high_percent_rate_bps: 200, max_fee_cents: 50000, active: true }
              as: StoreManager
              as_user_id: "manager-9"
              captures: { sched_id: $.data.id }
            - call: "POST /cash-drawers"
              payload: { store_code: "C9", business_date: "2026-05-01", opening_float_cents: 1000000 }
