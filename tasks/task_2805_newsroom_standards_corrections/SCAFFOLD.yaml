  - method: GET
    path: "/standards-desk/outside-activity-requests/{id}"
    description: "Read an outside-activity request."
    roles: [Reporter, StandardsEditor, ExecutiveEditor, PublicEditor]
    code: 200
    input: []
    output: OutsideActivityRequest
    side_effects: []

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------

errors:
  # --- auth ---------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for the endpoint, X-User-ID does not resolve to an entity of the role's backing type or carries the wrong role_title/discipline, or a Reporter acts on another journalist's resource"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting user is the same person as a party they may not judge: the story's lead journalist deciding its anonymous source or adjudicating its correction, the investigation's subject or opener deciding the case, or the investigation's subject or decider hearing the appeal"
  # --- existence ----------------------------------------------------------
  - id: ERR_NEWSROOM_NOT_FOUND
    http: 404
    condition: "newsroom_id in the path or body does not resolve"
  - id: ERR_JOURNALIST_NOT_FOUND
    http: 404
    condition: "journalist_id or lead_journalist_id does not resolve"
  - id: ERR_REVIEWER_NOT_FOUND
    http: 404
    condition: "reviewer_id does not resolve"
  - id: ERR_STORY_NOT_FOUND
    http: 404
    condition: "story_id does not resolve"
  - id: ERR_SOURCE_APPROVAL_NOT_FOUND
    http: 404
    condition: "approval_id does not resolve"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "review_id does not resolve"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignment_id does not resolve"
  - id: ERR_CORRECTION_REQUEST_NOT_FOUND
    http: 404
    condition: "request_id on a correction-request route does not resolve"
  - id: ERR_INVESTIGATION_NOT_FOUND
    http: 404
    condition: "investigation_id does not resolve"
  - id: ERR_DISCLOSURE_NOT_FOUND
    http: 404
    condition: "disclosure_id does not resolve"
  - id: ERR_ACTIVITY_REQUEST_NOT_FOUND
    http: 404
    condition: "request_id on an outside-activity route does not resolve"
  # --- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unrecognized enum member, out-of-range integer, malformed string or unknown field in the request body"
  - id: ERR_INVALID_INTERVAL
    http: 400
    condition: "ends_at not strictly after starts_at, ends_on not strictly after starts_on, or to_iso8601 not a parseable ISO 8601 UTC instant"
  # --- optimistic concurrency --------------------------------------------
  - id: ERR_STALE_STORY_VERSION
    http: 412
    condition: "expected_story_version does not equal the story's current version, so the submitting client's view of the story is stale"
  - id: ERR_STALE_REVIEWER_VERSION
    http: 412
    condition: "expected_reviewer_version does not equal the reviewer's current version, so the booking client's view of the reviewer's minute ledger is stale"
  # --- state --------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The trigger has no declared transition from the target's current state, including resubmitting a review that has already used all three rounds"
  - id: ERR_STORY_NOT_CLEARED
    http: 409
    condition: "Publish attempted while publication_status is not CLEARED"
  - id: ERR_STORY_NOT_PUBLISHED
    http: 409
    condition: "Unpublish attempted while publication_status is not PUBLISHED"
  - id: ERR_REVIEW_ROUND_NOT_OPEN
    http: 409
    condition: "A verdict was recorded against a review round that is already cleared, blocked, revised or past that verdict's stage"
  - id: ERR_LEGAL_VERDICT_REQUIRED
    http: 409
    condition: "A standards verdict was recorded on a round that requires legal review before the legal verdict cleared it"
  - id: ERR_SOURCE_ALREADY_DECIDED
    http: 409
    condition: "An anonymous-source decision was submitted for a record whose status is no longer REQUESTED"
  - id: ERR_CORRECTION_NOT_INVESTIGATED
    http: 409
    condition: "Adjudication attempted while the correction request is not INVESTIGATING or AWAITING_SUBJECT"
  - id: ERR_APPEAL_NOT_ALLOWED
    http: 409
    condition: "An appeal was heard on an investigation whose status is not SUSTAINED"
  - id: ERR_POSTURE_LOCKDOWN
    http: 409
    condition: "Clearing a review or publishing a story while the newsroom's standards_posture is LOCKDOWN"
  - id: ERR_JOURNALIST_SUSPENDED
    http: 409
    condition: "The story's lead journalist has employment_status SUSPENDED"
  - id: ERR_OUTSIDE_ACTIVITY_OVERLAP
    http: 409
    condition: "The requested activity's half-open [starts_on, ends_on) window overlaps an already APPROVED activity of the same journalist"
  - id: ERR_REVIEWER_SLOT_CONFLICT
    http: 409
    condition: "The requested slot collides with a SCHEDULED assignment of the same reviewer once the 30-minute buffer is applied to both sides"
  - id: ERR_DUPLICATE_TRAINING_MODULE
    http: 409
    condition: "The journalist already has a TrainingRecord for that module_code"
  - id: ERR_DUPLICATE_SOURCE_ALIAS
    http: 409
    condition: "The story already carries an AnonymousSourceApproval with that source_alias"
  # --- business rules -----------------------------------------------------
  - id: ERR_HEIGHTENED_REQUIRES_EXEC
    http: 403
    condition: "A StandardsEditor attempted to clear a review while the newsroom's standards_posture is HEIGHTENED"
  - id: ERR_INSUFFICIENT_SOURCE_DOCUMENTATION
    http: 422
    condition: "Approval attempted while documentation_complete is false: the editor does not know the source's identity or the justification is shorter than 20 characters"
  - id: ERR_INSUFFICIENT_CORROBORATION
    http: 422
    condition: "Approval of a SEVERE harm_risk source with corroboration_count below 2"
  - id: ERR_TRAINING_NOT_CURRENT
    http: 422
    condition: "Publication of a HIGH risk_tier story whose lead journalist has training_current false"
  - id: ERR_SOURCE_NOT_APPROVED
    http: 422
    condition: "Publication attempted while an anonymous source of the story is still REQUESTED or has been REVOKED"
  - id: ERR_CROSS_NEWSROOM_REFERENCE
    http: 422
    condition: "A story's lead journalist belongs to a different newsroom, or a booked reviewer belongs to a different newsroom than the review's story"
  - id: ERR_REVIEWER_DISCIPLINE_MISMATCH
    http: 422
    condition: "The booked reviewer's discipline does not match the stage the review round is waiting on"
  - id: ERR_COI_DISCLOSURE_PENDING
    http: 422
    condition: "Approval of an outside activity while the journalist still has a ConflictDisclosure in status SUBMITTED"
  - id: ERR_ACTIVITY_BEAT_RESTRICTED
    http: 422
    condition: "The activity's related_beat is a member of the journalist's restricted_beats"
  - id: ERR_UNPUBLISH_NOT_JUSTIFIED
    http: 422
    condition: "Unpublish attempted with neither a SUSTAINED misconduct investigation on the story nor a SEVERE correction on the record"
  - id: ERR_NOTICE_TEXT_REQUIRED
    http: 422
    condition: "notice_text missing for an outcome_type that publishes a notice, or supplied for NO_ACTION"
  - id: ERR_REVIEWER_CAPACITY_EXCEEDED
    http: 422
    condition: "The reviewer's reserved_minutes plus the new slot's duration_minutes would exceed weekly_capacity_minutes"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix — segregation of duties
# ---------------------------------------------------------------------------

roles:
  - name: Reporter
    description: "Writes the stories. Owns the source-approval requests, the review submissions, their own conflict disclosures and outside-activity requests, and cannot judge their own work."
    identity: "entity_backed:Journalist"
    exclusive_operations:
      - "POST /standards-desk/stories"
      - "POST /standards-desk/anonymous-source-approvals"
      - "POST /standards-desk/pre-publication-reviews"
      - "POST /standards-desk/pre-publication-reviews/{id}/resubmit"
      - "POST /standards-desk/conflict-disclosures"
      - "POST /standards-desk/outside-activity-requests"
    shared_operations:
      - "POST /standards-desk/training-records"
      - "GET /standards-desk/stories/{id}"
      - "GET /standards-desk/stories"
      - "GET /standards-desk/pre-publication-reviews/{id}"
      - "GET /standards-desk/correction-requests/{id}"
  - name: StandardsEditor
    description: "Runs the standards desk: decides anonymous sources, records standards verdicts, clears rounds outside heightened posture, adjudicates corrections and opens misconduct investigations."
    identity: "entity_backed:Journalist"
    exclusive_operations:
      - "POST /standards-desk/pre-publication-reviews/{id}/standards-verdict"
      - "POST /standards-desk/conflict-disclosures/{id}/review"
      - "POST /standards-desk/outside-activity-requests/{id}/decide"
    shared_operations:
      - "POST /standards-desk/anonymous-source-approvals/{id}/decide"
      - "POST /standards-desk/anonymous-source-approvals/{id}/revoke"
      - "POST /standards-desk/pre-publication-reviews/{id}/clear"
      - "POST /standards-desk/review-assignments"
      - "POST /standards-desk/review-assignments/{id}/cancel"
      - "POST /standards-desk/correction-requests"
      - "POST /standards-desk/correction-requests/{id}/start-investigation"
      - "POST /standards-desk/correction-requests/{id}/adjudicate"
      - "POST /standards-desk/correction-requests/{id}/resolve"
      - "POST /standards-desk/misconduct-investigations"
      - "POST /standards-desk/misconduct-investigations/{id}/advance"
      - "POST /standards-desk/misconduct-investigations/{id}/decide"
      - "POST /standards-desk/training-records"
  - name: LegalCounsel
    description: "Newsroom lawyer. Sole author of the pre-publication defamation and privacy analysis; books legal review slots against their own capacity."
    identity: "entity_backed:Reviewer"
    exclusive_operations:
      - "POST /standards-desk/pre-publication-reviews/{id}/legal-verdict"
    shared_operations:
      - "POST /standards-desk/review-assignments"
      - "POST /standards-desk/review-assignments/{id}/cancel"
      - "GET /standards-desk/review-assignments"
      - "GET /standards-desk/newsrooms/{id}/reviewers"
  - name: ExecutiveEditor
    description: "Accountable editor. Registers the desk and its people, publishes and unpublishes, clears rounds under heightened posture and hears misconduct appeals. Bootstrap-exempt from identity binding on newsroom and journalist creation."
    identity: "entity_backed:Journalist"
    exclusive_operations:
      - "POST /standards-desk/newsrooms"
      - "POST /standards-desk/journalists"
      - "POST /standards-desk/reviewers"
      - "POST /standards-desk/stories/{id}/publish"
      - "POST /standards-desk/stories/{id}/unpublish"
      - "POST /standards-desk/misconduct-investigations/{id}/appeal"
      - "POST /standards-desk/_clock/set_current_utc"
    shared_operations:
      - "POST /standards-desk/anonymous-source-approvals/{id}/decide"
      - "POST /standards-desk/pre-publication-reviews/{id}/standards-verdict"
      - "POST /standards-desk/pre-publication-reviews/{id}/clear"
      - "POST /standards-desk/correction-requests/{id}/adjudicate"
      - "POST /standards-desk/misconduct-investigations"
      - "POST /standards-desk/misconduct-investigations/{id}/decide"
  - name: PublicEditor
    description: "Reader advocate. Operational identity not tied to any journalist record; takes in correction requests from readers and subjects, runs the outreach and closes out published notices."
    identity: "opaque"
    exclusive_operations:
      - "POST /standards-desk/correction-requests/{id}/subject-outreach"
    shared_operations:
      - "POST /standards-desk/correction-requests"
      - "POST /standards-desk/correction-requests/{id}/start-investigation"
      - "POST /standards-desk/correction-requests/{id}/resolve"
      - "GET /standards-desk/newsrooms/{id}/standards-summary"
      - "GET /standards-desk/newsrooms/{id}/audit-events"
