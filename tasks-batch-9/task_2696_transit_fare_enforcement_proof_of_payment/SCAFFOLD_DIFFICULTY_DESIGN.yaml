      - name: citation_adjudication_and_settlement_dimensions_advance_independently
        grounds:
          - state_machines.Citation.adjudication_status.ISSUED_to_CONTESTED
          - state_machines.Citation.adjudication_status.CONTESTED_to_REDUCED
          - state_machines.Citation.settlement_status.OUTSTANDING_to_PLAN_ACTIVE
          - calculations.citation_admin_fee_cents
          - calculations.payment_plan_schedule
          - validations[priority=54]
        distinguishing_aspect: |
          Citation carries two orthogonal state dimensions: adjudication_status walks
          ISSUED -> CONTESTED -> REDUCED while settlement_status stays OUTSTANDING throughout and
          then moves to PLAN_ACTIVE without touching the adjudication dimension. A single-status
          implementation cannot represent REDUCED + PLAN_ACTIVE at once, and the REDUCE decision
          must re-derive the admin fee (12000 -> 1440 -> total 13440) rather than keep the original.
        test_recipe:
          setup:
            - "Zone Z1 DESIGNATED (12000 bps), line L1 assigned, deployment D1 ACTIVE 06:00..14:00."
            - "Rider R-100 has one prior WARNING_ISSUED encounter and a citation from a second NO_PROOF encounter: assessed 18000, fee 2160, total_due 20160, reduction_floor 9000, adjudication ISSUED, settlement OUTSTANDING."
