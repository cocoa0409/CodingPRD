# Difficulty design index for task 2666 - Cruise Revenue Management & Cabin Inventory.
# Every instance grounds in SCAFFOLD.yaml sections 1.1-1.7. Deleting this file leaves the
# scaffold's declared behaviour identical.
#
# Canonical fixture vocabulary used across instances (each instance builds its own chain
# from empty DB; nothing is shared implicitly):
#   CabinCategory BA  tier_rank 3, max_occupancy 3, onboard lower 14000 / upper 9000, no upgrade target
#   CabinCategory OV  tier_rank 2, max_occupancy 4, onboard lower 11000 / upper 7000, upgrade_to BA
#   CabinCategory IA  tier_rank 1, max_occupancy 4, is_guarantee true, onboard lower 9000 / upper 6000, upgrade_to OV
#   Sailing AUR-2701  embark 2027-01-10T17:00:00Z, nights 7, final_payment_days_before 75
#   Logical clock default 2026-08-01T00:00:00Z  ->  days_to_sail 162 on AUR-2701

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: ralbd_gross_versus_net_capacity_basis_on_group_held_sailing
        grounds:
          - calculations.sailing_ralbd
          - entities.Sailing.fields.ralbd_gross_cents
          - entities.Sailing.fields.ralbd_net_cents
          - entities.Sailing.fields.available_lower_berth_days_net
          - entities.SailingInventory.fields.group_held_cabins
        distinguishing_aspect: |
          One revenue total (372000 cents) is divided by two different capacity denominators
          on the same sailing in the same response: GROSS_CAPACITY_BASIS uses all 40 available
          lower berth days and yields 9300, NET_CAPACITY_BASIS removes the 4 lower berth days
          fenced inside the tentative group block and yields 15500 - a 6200-cent divergence.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z default; sailing GRP-2701 has 10 lower berths over 4 nights."
            - "One IA allotment of 5 physical cabins, no oversell allowance."
            - "One TENTATIVE group block holding 2 IA cabins with zero pick-up, so SailingInventory.group_held_cabins == 2 and 2 x 2 == 4 lower berths are fenced."
            - "One OPTION booking of 2 adults in IA priced from the single 730..0 fare window at base 150000, net_ticket_cents 300000, projected_onboard_net_cents 72000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "GRP-2701", embark_date: "2027-01-10T17:00:00Z", nights: 4, total_lower_berths: 10, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_g: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_g}", cabin_category_id: "${cat_ia}", physical_cabins: 5, oversell_allowance: 0 }
              as: RevenueManager
              captures: { inv_g: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_g}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 150000, third_berth_fare_cents: 50000, fourth_berth_fare_cents: 40000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_g}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { sailing_id: "${sail_g}", cabin_category_id: "${cat_ia}", agency_name: "Meridian Travel", cabins_held: 2, review_date: "2026-09-15T00:00:00Z", release_policy: "ATTRITION_50" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { blk_g: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Bo Chen", email: "bo@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_none: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_g}", cabin_category_id: "${cat_ia}", guest_id: "${g_none}", occupancy_adults: 2 }
              as: ReservationAgent
              captures: { bk_g: $.data.id }
          trigger:
            - call: "GET /sailings/${sail_g}/revenue-summary"
              payload: {}
              as: RevenueManager
          assert:
            - "Sailing.${sail_g}.gross_ticket_revenue_cents == 300000"
            - "Sailing.${sail_g}.projected_onboard_revenue_cents == 72000"
            - "Sailing.${sail_g}.compensation_liability_cents == 0"
            - "Sailing.${sail_g}.available_lower_berth_days_gross == 40"
            - "Sailing.${sail_g}.available_lower_berth_days_net == 24"
            - "Sailing.${sail_g}.ralbd_gross_cents == 9300"
            - "Sailing.${sail_g}.ralbd_net_cents == 15500"
            - "Sailing.${sail_g}.ralbd_net_cents - Sailing.${sail_g}.ralbd_gross_cents == 6200"
            - "Sailing.${sail_g}.revenue_alert == true (the NET variant 15500 is below RALBD_ALERT_FLOOR_CENTS 20000)"
            - "SailingInventory.${inv_g}.group_held_cabins == 2 and available_cabins == 2"

      - name: cancellation_penalty_provisional_quote_versus_final_settlement
        grounds:
          - calculations.cancellation_settlement
          - state_machines.Booking.PENALTY_ASSESSED_to_REFUNDED
          - entities.Booking.fields.provisional_penalty_cents
          - entities.Booking.fields.cancellation_penalty_cents
          - entities.Booking.fields.refund_cents
        distinguishing_aspect: |
          The same booking's penalty is evaluated twice on the same net_ticket_cents 361531:
          the PROVISIONAL variant at the cancel instant (days_to_sail 100, 25 percent) writes
          90383 and moves no cash, while the FINAL variant at the settlement instant
          (days_to_sail 77, 50 percent) writes 180766 and is the only figure that drives the
          180765-cent refund; provisional_penalty_cents is never retroactively corrected.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing AUR-2701 OPEN_FOR_SALE with an IA allotment and the 365..120 fare window (base 189995 / third 64997)."
            - "Promotion EARLY15, audience GENERAL, discount_pct 0.15, ACTIVE."
            - "Guest with prior_sailings_count 4, hence loyalty_tier GOLD and repeat_guest_offer_pct 0.03."
            - "Booking of 2 adults plus one third berth quoting EARLY15: net_ticket_cents 361531, deposit_due_cents 75000, paid in full (amount_paid_cents 361531), booking_status CONFIRMED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "AUR-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail1: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ia}", physical_cabins: 60, oversell_allowance: 4 }
              as: RevenueManager
              captures: { inv_ia: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 365, window_close_days_to_sail: 120, base_lower_berth_fare_cents: 189995, third_berth_fare_cents: 64997, fourth_berth_fare_cents: 49997 }
              as: RevenueManager
            - call: "POST /sailings/${sail1}/open-for-sale"
              payload: {}
              as: RevenueManager
              captures: { sail1_v1: $.data.version }
            - call: "POST /promotions"
              payload: { sailing_id: "${sail1}", code: "EARLY15", audience: "GENERAL", discount_pct: 0.15, starts_on: "2026-08-01T00:00:00Z", ends_on: "2026-09-10T00:00:00Z", max_redemptions: 5, expected_sailing_version: "${sail1_v1}" }
              as: RevenueManager
              captures: { promo1: $.data.id }
            - call: "POST /promotions/${promo1}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", prior_sailings_count: 4 }
              as: ReservationAgent
              captures: { g_gold: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ia}", guest_id: "${g_gold}", occupancy_adults: 2, third_berth_guests: 1, promotion_id: "${promo1}" }
              as: ReservationAgent
              captures: { bk1: $.data.id }
            - call: "POST /bookings/${bk1}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 75000 }
              as: ReservationAgent
            - call: "POST /bookings/${bk1}/payments"
              payload: { kind: "FINAL_PAYMENT", amount_cents: 286531 }
              as: ReservationAgent
            - call: "POST /bookings/${bk1}/confirm"
              payload: {}
              as: ReservationAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: RevenueManager
            - call: "POST /bookings/${bk1}/cancel"
              payload: { reason: "GUEST_REQUEST" }
              as: ReservationAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-25T00:00:00Z" }
              as: RevenueManager
          trigger:
            - call: "POST /bookings/${bk1}/settle-cancellation"
              payload: {}
              as: RevenueManager
          assert:
            - "Booking.${bk1}.net_ticket_cents == 361531"
            - "Booking.${bk1}.provisional_penalty_cents == 90383 (unchanged by settlement)"
            - "Booking.${bk1}.cancellation_penalty_cents == 180766"
            - "Booking.${bk1}.refund_cents == 180765"
            - "Booking.${bk1}.payment_status == REFUNDED"
            - "Booking.${bk1}.settled_at == 2026-10-25T00:00:00Z"
            - "GET /bookings/${bk1}/payment-events returns 3 events with kinds [DEPOSIT, FINAL_PAYMENT, REFUND] and amount_cents [75000, 286531, 180765]"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: oversell_allowance_min_max_ceil_nest_and_deposit_floor_max
        grounds:
          - calculations.oversell_availability
          - calculations.booking_fare_buildup
          - entities.SailingInventory.fields.effective_oversell_cabins
          - entities.Booking.fields.deposit_due_cents
          - validations[priority=19]
        distinguishing_aspect: |
          Mode (a) - nested min / max / ceil operators. Two independent nests are pinned in one
          chain: effective_oversell_cabins = max(0, min(5, ceil(2 * 0.10))) == 1, where the
          requested allowance of 5 is clipped by the ceil-derived cap of 1; and
          deposit_due_cents = max(25000 * 1, round_half_up(87500 * 0.20)) == 25000, where the
          per-guest floor of 25000 beats the percentage arm of 17500.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing OSL-2701 with 20 lower berths over 7 nights, OPEN_FOR_SALE."
            - "IA is a guarantee category with only 2 physical cabins and a requested oversell_allowance of 5."
            - "One 730..0 fare window at base_lower_berth_fare_cents 50000."
            - "Three single-adult bookings already exist, so booked_cabins == 3 against a sellable capacity of 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "OSL-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 20, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_o: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_o}", cabin_category_id: "${cat_ia}", physical_cabins: 2, oversell_allowance: 5 }
              as: RevenueManager
              captures: { inv_o: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_o}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 50000, third_berth_fare_cents: 50000, fourth_berth_fare_cents: 40000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_o}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Guest One", email: "one@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g1: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Guest Two", email: "two@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g2: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Guest Three", email: "three@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g3: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Guest Four", email: "four@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g4: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_o}", cabin_category_id: "${cat_ia}", guest_id: "${g1}", occupancy_adults: 1 }
              as: ReservationAgent
              captures: { bk_o1: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_o}", cabin_category_id: "${cat_ia}", guest_id: "${g2}", occupancy_adults: 1 }
              as: ReservationAgent
              captures: { bk_o2: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_o}", cabin_category_id: "${cat_ia}", guest_id: "${g3}", occupancy_adults: 1 }
              as: ReservationAgent
              captures: { bk_o3: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_o}", cabin_category_id: "${cat_ia}", guest_id: "${g4}", occupancy_adults: 1, allow_waitlist: false }
              as: ReservationAgent
          assert:
            - "the trigger returns 422 with data.error_id == ERR_CATEGORY_SOLD_OUT"
            - "SailingInventory.${inv_o}.oversell_allowance == 5"
            - "SailingInventory.${inv_o}.effective_oversell_cabins == 1"
            - "SailingInventory.${inv_o}.booked_cabins == 3 and available_cabins == 0"
            - "Booking.${bk_o1}.lower_berth_subtotal_cents == 87500 and berth_discount_pct == 0.00"
            - "Booking.${bk_o1}.net_ticket_cents == 87500"
            - "Booking.${bk_o1}.deposit_due_cents == 25000"
            - "Booking.${bk_o3}.deposit_due_cents == 25000"

      - name: promo_then_loyalty_per_component_rounding_order
        grounds:
          - calculations.booking_fare_buildup
          - entities.Booking.fields.promo_discount_cents
          - entities.Booking.fields.loyalty_discount_cents
          - entities.Guest.fields.repeat_guest_offer_pct
        distinguishing_aspect: |
          Mode (b) - multi-step rounding whose order is observable. Rounding the 15 percent
          promotion per component (round_half_up(379990 * 0.15) == 56999 plus
          round_half_up(58497 * 0.15) == 8775) yields promo_discount_cents 65774, whereas
          rounding the total once (round_half_up(438487 * 0.15)) yields 65773; the 3 percent
          GOLD offer is then applied to the post-promotion components 322991 and 49722, again
          rounded per component, giving 11182 and a final net_ticket_cents of 361531.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing AUR-2701 OPEN_FOR_SALE with the 365..120 IA fare window (base 189995 / third 64997 / fourth 49997)."
            - "Promotion EARLY15, GENERAL, discount_pct 0.15, status ACTIVE, max_redemptions 5."
            - "Guest with prior_sailings_count 4, so loyalty_tier GOLD and repeat_guest_offer_pct 0.03."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "AUR-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail1: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ia}", physical_cabins: 60, oversell_allowance: 4 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 365, window_close_days_to_sail: 120, base_lower_berth_fare_cents: 189995, third_berth_fare_cents: 64997, fourth_berth_fare_cents: 49997 }
              as: RevenueManager
            - call: "POST /sailings/${sail1}/open-for-sale"
              payload: {}
              as: RevenueManager
              captures: { sail1_v1: $.data.version }
            - call: "POST /promotions"
              payload: { sailing_id: "${sail1}", code: "EARLY15", audience: "GENERAL", discount_pct: 0.15, starts_on: "2026-08-01T00:00:00Z", ends_on: "2026-09-10T00:00:00Z", max_redemptions: 5, expected_sailing_version: "${sail1_v1}" }
              as: RevenueManager
              captures: { promo1: $.data.id }
            - call: "POST /promotions/${promo1}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", prior_sailings_count: 4 }
              as: ReservationAgent
              captures: { g_gold: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ia}", guest_id: "${g_gold}", occupancy_adults: 2, third_berth_guests: 1, promotion_id: "${promo1}" }
              as: ReservationAgent
              captures: { bk_r: $.data.id }
          assert:
            - "Booking.${bk_r}.lower_berth_subtotal_cents == 379990"
            - "Booking.${bk_r}.third_berth_net_cents == 58497"
            - "Booking.${bk_r}.gross_ticket_cents == 438487"
            - "Booking.${bk_r}.promo_discount_cents == 65774"
            - "Booking.${bk_r}.promo_discount_cents != 65773"
            - "Booking.${bk_r}.loyalty_discount_cents == 11182"
            - "Booking.${bk_r}.net_ticket_cents == 361531"
            - "Booking.${bk_r}.deposit_due_cents == 75000"
            - "Guest.${g_gold}.loyalty_tier == GOLD and repeat_guest_offer_pct == 0.03"
            - "Promotion.${promo1}.redemption_count == 1 and status == ACTIVE"

      - name: berth_tier_selected_from_lower_subtotal_before_upper_berths_priced
        grounds:
          - calculations.booking_fare_buildup
          - entities.Booking.fields.berth_discount_pct
          - entities.Booking.fields.third_berth_net_cents
          - entities.Booking.fields.gross_ticket_cents
        distinguishing_aspect: |
          Mode (c) - the same operands produce different results under different evaluation
          order. The berth-utilisation tier must be read off lower_berth_subtotal_cents 379990
          (tier 1, 0.10) BEFORE the third berth is priced, giving third_berth_net_cents 58497
          and gross_ticket_cents 438487; deriving the tier after the fact from
          gross_ticket_cents 438487 would cross the 400000 floor into 0.20 and produce
          third_berth_net_cents 51998 and gross 431988 instead.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing AUR-2701 OPEN_FOR_SALE with the 365..120 IA fare window (base 189995 / third 64997)."
            - "Guest with prior_sailings_count 0, so loyalty_tier NONE and repeat_guest_offer_pct 0.00, and no promotion is quoted - the only discount in play is the berth tier."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "AUR-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail1: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ia}", physical_cabins: 60, oversell_allowance: 4 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 365, window_close_days_to_sail: 120, base_lower_berth_fare_cents: 189995, third_berth_fare_cents: 64997, fourth_berth_fare_cents: 49997 }
              as: RevenueManager
            - call: "POST /sailings/${sail1}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Bo Chen", email: "bo@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_none: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ia}", guest_id: "${g_none}", occupancy_adults: 2, third_berth_guests: 1 }
              as: ReservationAgent
              captures: { bk_t: $.data.id }
          assert:
            - "Booking.${bk_t}.lower_berth_subtotal_cents == 379990"
            - "Booking.${bk_t}.berth_discount_pct == 0.10"
            - "Booking.${bk_t}.berth_discount_pct != 0.20"
            - "Booking.${bk_t}.third_berth_net_cents == 58497"
            - "Booking.${bk_t}.gross_ticket_cents == 438487"
            - "Booking.${bk_t}.promo_discount_cents == 0 and loyalty_discount_cents == 0"
            - "Booking.${bk_t}.net_ticket_cents == 438487"
            - "Booking.${bk_t}.deposit_due_cents == 87697"
            - "Booking.${bk_t}.guest_count == 3 and payment_terms == STANDARD"
