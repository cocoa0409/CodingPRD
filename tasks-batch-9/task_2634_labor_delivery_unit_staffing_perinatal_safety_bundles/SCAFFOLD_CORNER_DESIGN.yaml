      - name: three_structural_guard_ids_that_only_exist_because_the_specific_over_generic_carve_out_holds
        claim_type: Error Triggerability
        grounds: |
          §1.6 ERR_BED_HAS_FUTURE_HOLDS (409), ERR_INDUCTION_ALREADY_ADMITTED (409) and
          ERR_SHIFT_HAS_ACTIVE_COVERAGE (409); §1.2 Bed (DELETE declared only from AVAILABLE|BLOCKED yet
          refused "while any InductionBooking with status IN {CAPACITY_HELD, CONFIRMED} references it"),
          InductionBooking (CANCELLED declared from REQUESTED|CAPACITY_HELD|CONFIRMED with precondition
          "status != ADMITTED") and ShiftAssignment (CANCELLED declared only from SCHEDULED with
          precondition "No CareAssignment references this shift with status == ACTIVE"); §1.4 carve-outs
          (a), (b) and (d) of the priority-8 note; §1.5 DELETE /beds/{bedId},
          POST /induction-bookings/{bookingId}/cancel and POST /shift-assignments/{shiftId}/cancel.
        distinguishing_aspect: |
          Each of these three ids sits on a status that is NOT a declared `from:` state for its edge, so a
          naive implementation returns ERR_INVALID_STATE_TRANSITION for all three and the ids become dead
          catalogue entries. The instance pins the specific answer in each case AND pins the boundary of the
          carve-out with a contrast pair on the shift endpoint: cancelling the same ACTIVE shift is
          ERR_SHIFT_HAS_ACTIVE_COVERAGE while an ACTIVE CareAssignment references it and
          ERR_INVALID_STATE_TRANSITION the moment that assignment is released - identical call, identical
          status, different id, proving the specific id is conditioned on the reason and not on the status.
          The bed probe fires on both blocking statuses (CAPACITY_HELD and then CONFIRMED) and the admit
          itself lands exactly on the 30-minute early-grace boundary.
