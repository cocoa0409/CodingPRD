      - name: open_call_venue_attendance_aggregate_over_closed_windows
        grounds:
          - validations[priority=43]
          - errors[ERR_VENUE_CAPACITY_EXCEEDED]
          - entities.CastingCall.fields.expected_attendance
          - entities.Location.fields.capacity
          - state_machines.CastingCall.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          Third interval semantics on the venue resource: CLOSED windows with aggregate
          head capacity, not the half-open buffered occupancy of shoot blocks. Windows
          2026-08-05..2026-08-10 and 2026-08-10..2026-08-15 share only their touching
          endpoint yet still intersect, so 300 + 250 = 550 breaches a 500 capacity, while
          moving the second window to start 2026-08-11 makes it disjoint and it publishes.
        test_recipe:
          setup:
            - "One DOCUSOAP / CA production with casting_posture OPEN."
            - "Location Venue C with capacity 500."
            - "One PUBLISHED OPEN_CALL call at Venue C, expected_attendance 300, window 2026-08-05..2026-08-10."
            - "Two DRAFT OPEN_CALL calls at Venue C, both expected_attendance 250: one with window 2026-08-10..2026-08-15 (touching), one with window 2026-08-11..2026-08-15 (disjoint)."
