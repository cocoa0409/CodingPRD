  - method: GET
    path: "/child-find/screening-slots/{id}"
    description: "Fetch one screening slot."
    roles: [ChildFindCoordinator, PlacementAdministrator, Parent, DistrictAdmin]
    code: 200
    input: []
    output: ScreeningSlot
    side_effects: []

  - method: GET
    path: "/child-find/referrals/{id}"
    description: "Fetch one referral with both state dimensions, eligibility_pathway and evaluation_due_date."
