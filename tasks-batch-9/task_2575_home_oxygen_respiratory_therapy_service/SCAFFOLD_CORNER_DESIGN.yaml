            - "${st_pending} == TRANSFER_PENDING with transfer_to_branch_id ${br2_id} and transfer_effective_date 2026-08-10; RentalContract.${c_id}.billing_status == SUSPENDED with suspension_reason TRANSFER"
            - "${e_not_due} == ERR_TRANSFER_NOT_DUE (409): the clock is still 2026-08-01, before the effective date"
            - "The clock advance to 2026-08-10T09:00:00Z reports expired_cmn_count 0 and suspended_contract_count 0 — recert_due_date is 2027-08-01, so the sweep finds nothing"
            - "${st_back} == ACTIVE and ${br_after} == ${br2_id}; transfer_to_branch_id and transfer_effective_date are both null again, and RentalContract.${c_id}.billing_status == ACCRUING with suspension_reason NONE"
            - "${st_pending2} == TRANSFER_PENDING (the cycle re-enters), and ${st_cancelled} == ACTIVE with ${br_after_cancel} == ${br2_id}: the cancel edge leaves branch_id exactly where it was"
            - "After the cancel, RentalContract.${c_id}.billing_status == ACCRUING with suspension_reason NONE and Patient.${p_id}.version has been incremented once per transition"

      - name: travel_authorization_decision_is_final
