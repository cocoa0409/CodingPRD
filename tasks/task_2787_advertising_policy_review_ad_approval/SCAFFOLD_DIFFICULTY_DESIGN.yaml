              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED", evidence_ref: "reg-2026-0001" }
              as: PolicyAdmin
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "Rev Regulated US", queue_specialties: ["REGULATED_CERT"], country_authorizations: ["US"], max_concurrent_claims: 2 }
              as: PolicyAdmin
              captures: { rev_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Single malt tasting flight", body_text: "Reserve a single malt tasting flight this weekend.", declared_category_codes: ["ALC_SPIRITS"], target_country_codes: ["US"], landing_page_url: "https://www.northharbor.example/tasting", display_url: "https://www.northharbor.example/tasting", disclaimer_text: "Drink responsibly. 21+" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
