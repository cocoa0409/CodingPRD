      - name: intake_screening_starts_in_draft_with_null_computed_verdict
        claim_type: Initial State
        grounds:
          - state_machines.IntakeScreening.initial_state
          - endpoints[POST /intake-screenings]
        distinguishing_aspect: "A freshly created IntakeScreening is DRAFT with legal_eligibility_verdict, urgency_score, urgency_tier and urgency_variant_applied all null — nothing is computed before the screen step."
        test_recipe:
          setup:
            - "One cycle whose period contains the clock date 2026-08-03 and one Client with fpl_percent 77.76."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /capacity-cycles"
              payload: { cycle_label: "FY26-H2", period_start_date: "2026-07-01", period_end_date: "2026-12-31", total_case_slots: 10, reserved_detained_slots: 2 }
              as: ProgramDirector
              captures: { cycle_id: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Rosa Mena", preferred_language_code: "es", country_of_birth_code: "GT", date_of_birth: "1990-04-11", household_size: 3, annual_household_income_cents: 2000000 }
              as: ProgramDirector
              captures: { client_id: "$.data.id" }
          trigger:
            - call: "POST /intake-screenings"
              payload: { client_id: "${client_id}", cycle_id: "${cycle_id}", case_type: "U_VISA", detained: false }
              as: ProgramDirector
              captures: { intake_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "IntakeScreening.${intake_id}.status == 'DRAFT'"
            - "IntakeScreening.${intake_id}.legal_eligibility_verdict == null"
            - "IntakeScreening.${intake_id}.urgency_score == null"
            - "IntakeScreening.${intake_id}.urgency_tier == null"
            - "IntakeScreening.${intake_id}.urgency_variant_applied == null"
            - "ProgramCapacityCycle.${cycle_id}.available_slot_count == 10"

      - name: intake_screen_records_screener_and_all_four_urgency_fields
        claim_type: Side Effect Execution
        grounds:
          - state_machines.IntakeScreening.transitions.DRAFT_to_SCREENED
          - calculations.intake_urgency_score
          - calculations.legal_eligibility_verdict
        distinguishing_aspect: "The DRAFT -> SCREENED side-effect list writes five fields at once: screener_representative_id from X-User-ID, screened_at_utc from the logical clock, the verdict, and the urgency triple. A non-detained U_VISA with no statutory deadline scores exactly 22.00 / ROUTINE with a null anchor."
        test_recipe:
          setup:
            - "Cycle FY26-H2 open; Representative Sara Ruiz is the acting IntakeScreener; client income 2000000 for household 3 gives fpl_percent 77.76 (below the 200.00 ceiling)."
            - "The intake is U_VISA, detained false, statutory_deadline_date omitted, so the STRICT_STATUTORY variant finds no anchor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /capacity-cycles"
              payload: { cycle_label: "FY26-H2", period_start_date: "2026-07-01", period_end_date: "2026-12-31", total_case_slots: 10, reserved_detained_slots: 2 }
              as: ProgramDirector
              captures: { cycle_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Sara Ruiz", rep_type: "STAFF_ATTORNEY", languages: ["en", "es"], max_case_load: 25, max_supervisees: 10, weekly_capacity_hours: 40, bar_number: "BAR-3003" }
              as: ProgramDirector
              captures: { screener_id: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Rosa Mena", preferred_language_code: "es", country_of_birth_code: "GT", date_of_birth: "1990-04-11", household_size: 3, annual_household_income_cents: 2000000 }
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { client_id: "$.data.id" }
            - call: "POST /intake-screenings"
              payload: { client_id: "${client_id}", cycle_id: "${cycle_id}", case_type: "U_VISA", detained: false }
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { intake_id: "$.data.id" }
          trigger:
            - call: "POST /intake-screenings/${intake_id}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
          assert:
            - "HTTP status == 200"
            - "IntakeScreening.${intake_id}.status == 'SCREENED'"
            - "IntakeScreening.${intake_id}.screener_representative_id == '${screener_id}'"
            - "IntakeScreening.${intake_id}.screened_at_utc == '2026-08-03T09:00:00.000Z'"
            - "IntakeScreening.${intake_id}.legal_eligibility_verdict == 'ELIGIBLE'"
            - "IntakeScreening.${intake_id}.urgency_variant_applied == 'STRICT_STATUTORY'"
            - "IntakeScreening.${intake_id}.urgency_anchor_date == null"
            - "IntakeScreening.${intake_id}.urgency_score == 22.00"
            - "IntakeScreening.${intake_id}.urgency_tier == 'ROUTINE'"
            - "Client.${client_id}.fpl_percent == 77.76"

