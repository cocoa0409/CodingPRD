      - name: duplicate_treatment_limitation_supersedes_the_prior_row
        claim_type: Side Effect Execution
        grounds:
          - state_machines.TreatmentLimitation.ACTIVE_to_SUPERSEDED
          - calculations.qtl_substantially_all_ratio
