              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order_id}/submit"
              payload: {}
              as: CustomerBuyer
              as_user_id: "${cust_id}"
            - call: "POST /bakery-distribution/orders/${order_id}/allocate"
              payload: {}
              as: WarehouseOperator
              as_user_id: "wo_1"
              captures: { ov0: $.data.version }
            - call: "POST /bakery-distribution/substitution-requests"
              payload: { order_line_id: "${line_id}", proposed_product_id: "${prod_b}", rationale: "First proposal against the stale token", expected_order_version: "${ov0}" }
              as: TechnicalSpecialist
              as_user_id: "ts_1"
              captures: { sub_one: $.data.id }
            - call: "GET /bakery-distribution/orders/${order_id}"
              payload: {}
              as: TechnicalSpecialist
