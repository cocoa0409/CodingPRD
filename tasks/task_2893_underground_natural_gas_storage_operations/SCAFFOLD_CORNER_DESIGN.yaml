            - call: "POST /storage-contracts/${c2}/activate"
              payload: {}
              as: SchedulingCoordinator
            - call: "GET /storage-contracts/${c2}"
              payload: {}
              as: SchedulingCoordinator
              captures: { cv1: $.data.version }
          trigger:
            - call: "POST /nominations"
              payload: { contract_id: "${c2}", gas_day: "2026-09-15", direction: "WITHDRAWAL", nominated_volume_dth: 200000, expected_contract_version: "${cv1}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { e1: $.data.error_id }
            - call: "POST /nominations"
              payload: { contract_id: "${c2}", gas_day: "2026-08-20", direction: "WITHDRAWAL", nominated_volume_dth: 200000, expected_contract_version: "${cv1}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { e2: $.data.error_id }
            - call: "POST /nominations"
              payload: { contract_id: "${c2}", gas_day: "2026-08-20", direction: "INJECTION", nominated_volume_dth: 200000, expected_contract_version: "${cv1}" }
