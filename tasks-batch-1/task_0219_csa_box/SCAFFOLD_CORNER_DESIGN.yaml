      - name: error_hold_window_passed_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_HOLD_WINDOW_PASSED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / hold_window_half_open_before_delivery_date
          rationale: "ERR_HOLD_WINDOW_PASSED is asserted as the failure of that §1.8 boundary instance."

      - name: error_offer_expired_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_OFFER_EXPIRED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / waitlist_offer_window_inclusive_deadline
          rationale: "The inclusive-deadline instance reaches the boundary; the past-deadline accept produces ERR_OFFER_EXPIRED on the same window."

      - name: error_season_capacity_full_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEASON_CAPACITY_FULL]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / season_capacity_strict_less_than_boundary
          rationale: "The strict-less-than boundary instance crosses into ERR_SEASON_CAPACITY_FULL at confirmed_share_count == capacity."

      - name: error_addon_supply_exhausted_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_ADDON_SUPPLY_EXHAUSTED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / addon_supply_exhausted_zero_remaining_boundary
          rationale: "ERR_ADDON_SUPPLY_EXHAUSTED is the asserted failure of that §1.8 instance."

      - name: error_site_capacity_full_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_SITE_CAPACITY_FULL]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / promote_requires_site_capacity_waitlist_vs_pickupsite
          rationale: "ERR_SITE_CAPACITY_FULL is asserted as the promotion failure of that §1.8 instance."

  # ===========================================================================
  # §1.9.7 RBAC
  # ===========================================================================
  - section: rbac
    instances:
      - name: member_cannot_confirm_subscription
        claim_type: forbidden_operation
        grounds: ["roles", "validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "A Member calling POST /subscriptions/{id}/confirm (FarmManager-exclusive) → ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["A PENDING_PAYMENT subscription owned by a member"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S-rbac1", week_count: 10, first_delivery_date: "2026-09-01T00:00:00Z", signup_close_date: "2026-12-25T00:00:00Z", total_share_capacity: 50 }
              as: FarmManager
              captures: { season_id: "$.data.id" }
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Site", kind: "PICKUP", weekly_capacity: 100 }
              as: DeliveryCoordinator
              captures: { site_id: "$.data.id" }
            - call: "POST /share-types"
              payload: { season_id: "${season_id}", size: "MEDIUM", base_price_cents: 50000, items_per_box: 8 }
              as: FarmManager
              captures: { share_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/open"
              payload: {}
              as: FarmManager
            - call: "POST /members"
              payload: { email: "rbac1@x.com", full_name: "Rb1", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { season_id: "${season_id}", member_id: "${member_id}", share_type_id: "${share_id}", current_site_id: "${site_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { sub_id: "$.data.id" }
            - call: "GET /seasons/${season_id}"
              as: FarmManager
              captures: { sea_v: "$.data.version" }
          trigger:
            - call: "POST /subscriptions/${sub_id}/confirm"
              payload: { expected_season_version: "${sea_v}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response code == 403"
            - "response error_id == ERR_FORBIDDEN_ROLE"

      - name: farmmanager_cannot_create_pickup_site
        claim_type: forbidden_operation
        grounds: ["roles", "validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Peer-role isolation: FarmManager calling POST /pickup-sites (DeliveryCoordinator-exclusive) → ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["A DRAFT season exists"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S-rbac2", week_count: 10, first_delivery_date: "2026-09-01T00:00:00Z", signup_close_date: "2026-12-25T00:00:00Z", total_share_capacity: 50 }
              as: FarmManager
              captures: { season_id: "$.data.id" }
          trigger:
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Site", kind: "PICKUP", weekly_capacity: 100 }
              as: FarmManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response code == 403"
            - "response error_id == ERR_FORBIDDEN_ROLE"

      - name: member_not_owner_cancel_covered_by_difficulty
        claim_type: ownership_denial
        grounds: ["roles", "validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / not_owner_beats_invalid_state_auth_vs_state
          rationale: "Member-B cancelling Member-A's subscription producing ERR_NOT_RESOURCE_OWNER is exercised by that §1.8 instance."

  # ===========================================================================
  # §1.9.8 Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_confirm_correct_season_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[confirm-stale-season]", "endpoints"]
        distinguishing_aspect: "Confirm with expected_season_version matching the season's current version succeeds and bumps Season.version by 1 (OCC happy path)."
        test_recipe:
          setup: ["OPEN season, site, share, member, one PENDING_PAYMENT subscription"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S-occ1", week_count: 10, first_delivery_date: "2026-09-01T00:00:00Z", signup_close_date: "2026-12-25T00:00:00Z", total_share_capacity: 50 }
              as: FarmManager
              captures: { season_id: "$.data.id" }
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Site", kind: "PICKUP", weekly_capacity: 100 }
              as: DeliveryCoordinator
              captures: { site_id: "$.data.id" }
            - call: "POST /share-types"
              payload: { season_id: "${season_id}", size: "MEDIUM", base_price_cents: 50000, items_per_box: 8 }
              as: FarmManager
              captures: { share_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/open"
              payload: {}
              as: FarmManager
            - call: "POST /members"
              payload: { email: "occ1@x.com", full_name: "Occ1", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { season_id: "${season_id}", member_id: "${member_id}", share_type_id: "${share_id}", current_site_id: "${site_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { sub_id: "$.data.id" }
            - call: "GET /seasons/${season_id}"
              as: FarmManager
              captures: { sea_v: "$.data.version" }
          trigger:
            - call: "POST /subscriptions/${sub_id}/confirm"
              payload: { expected_season_version: "${sea_v}" }
              as: FarmManager
            - call: "GET /seasons/${season_id}"
              as: FarmManager
              captures: { sea_v_after: "$.data.version" }
          assert:
            - "Subscription.${sub_id}.billing_status == CONFIRMED"
            - "Season.${season_id}.version == ${sea_v} + 1 after confirm"

      - name: occ_confirm_stale_season_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[confirm-stale-season]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Confirming a second subscription carrying a stale expected_season_version (the version observed before a prior confirm bumped it) → ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["OPEN season cap 5; two PENDING_PAYMENT subscriptions on distinct members; first confirmed (Season.version bumped)"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S-occ2", week_count: 10, first_delivery_date: "2026-09-01T00:00:00Z", signup_close_date: "2026-12-25T00:00:00Z", total_share_capacity: 5 }
              as: FarmManager
              captures: { season_id: "$.data.id" }
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Site", kind: "PICKUP", weekly_capacity: 100 }
              as: DeliveryCoordinator
              captures: { site_id: "$.data.id" }
            - call: "POST /share-types"
              payload: { season_id: "${season_id}", size: "MEDIUM", base_price_cents: 50000, items_per_box: 8 }
              as: FarmManager
              captures: { share_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/open"
              payload: {}
              as: FarmManager
            - call: "POST /members"
              payload: { email: "occ2a@x.com", full_name: "Occ2A", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_a_id: "$.data.id" }
            - call: "POST /members"
              payload: { email: "occ2b@x.com", full_name: "Occ2B", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_b_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { season_id: "${season_id}", member_id: "${member_a_id}", share_type_id: "${share_id}", current_site_id: "${site_id}" }
              as: Member
              as_user_id: "${member_a_id}"
              captures: { sub_a_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { season_id: "${season_id}", member_id: "${member_b_id}", share_type_id: "${share_id}", current_site_id: "${site_id}" }
              as: Member
              as_user_id: "${member_b_id}"
              captures: { sub_b_id: "$.data.id" }
            - call: "GET /seasons/${season_id}"
              as: FarmManager
              captures: { sea_v_stale: "$.data.version" }
            - call: "POST /subscriptions/${sub_a_id}/confirm"
              payload: { expected_season_version: "${sea_v_stale}" }
              as: FarmManager
          trigger:
            - call: "POST /subscriptions/${sub_b_id}/confirm"
              payload: { expected_season_version: "${sea_v_stale}" }
              as: FarmManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response code == 412"
            - "response error_id == ERR_STALE_VERSION"
            - "Subscription.${sub_b_id}.billing_status == PENDING_PAYMENT (unchanged)"

      - name: derived_field_active_subscription_count_reconciles_on_cancel
        claim_type: derived_field_reconciliation
        grounds: ["entities.PickupSite.fields.active_subscription_count", "state_machines.Subscription.CONFIRMED_to_CANCELLED"]
        distinguishing_aspect: "PickupSite.active_subscription_count goes 0→1 on confirm and 1→0 on cancel — the denormalized counter reconciles with the confirmed-subscription set after each mutation."
        test_recipe:
          setup: ["OPEN season, site cap 10; one subscription confirmed then cancelled"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S-derv", week_count: 10, first_delivery_date: "2026-09-01T00:00:00Z", signup_close_date: "2026-12-25T00:00:00Z", total_share_capacity: 50 }
              as: FarmManager
              captures: { season_id: "$.data.id" }
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Site", kind: "PICKUP", weekly_capacity: 10 }
              as: DeliveryCoordinator
              captures: { site_id: "$.data.id" }
            - call: "POST /share-types"
              payload: { season_id: "${season_id}", size: "MEDIUM", base_price_cents: 50000, items_per_box: 8 }
              as: FarmManager
              captures: { share_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/open"
              payload: {}
              as: FarmManager
            - call: "POST /members"
              payload: { email: "derv@x.com", full_name: "Derv", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { season_id: "${season_id}", member_id: "${member_id}", share_type_id: "${share_id}", current_site_id: "${site_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { sub_id: "$.data.id" }
            - call: "GET /seasons/${season_id}"
              as: FarmManager
              captures: { sea_v: "$.data.version" }
            - call: "POST /subscriptions/${sub_id}/confirm"
              payload: { expected_season_version: "${sea_v}" }
              as: FarmManager
          trigger:
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
            - call: "GET /pickup-sites/${site_id}"
              as: FarmManager
              captures: { count_after: "$.data.active_subscription_count" }
          assert:
            - "PickupSite.${site_id}.active_subscription_count == 0 after cancel (reconciled from 1)"
            - "Season.${season_id}.confirmed_share_count == 0 after cancel"

  # ===========================================================================
  # §1.9.9 Consistency Model
  # ===========================================================================
  - section: consistency_model
    instances:
