            - "after the rejection Listing.${lst2}.bid_count == 0 and BuyerAccount.${ba}.outstanding_exposure_cents is still 1140000"
            - "after the limit is raised: Bid.${bid2}.bid_status == WINNING and BuyerAccount.${ba}.outstanding_exposure_cents == 2280000"
            - "BuyerAccount.${ba}.approved_credit_limit_cents == 2280000 and wallet_credit_cents == 0, so exposure sits exactly on the inclusive ceiling"
            - "BuyerAccount.${ba}.requested_credit_limit_cents is still 2279999 (advisory field, never used in the check)"

      - name: closed_listing_state_beats_the_fiscal_bid_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority 9 -> ERR_LISTING_STATE_INVALID]
          - validations[priority 16 -> ERR_BID_BELOW_MINIMUM]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / closed_listing_state_error_wins_over_bid_below_minimum
          rationale: "The named §1.8 instance already violates both rules in one request and pins the priority-9 error."

      - name: pickup_temporal_error_beats_the_dock_capacity_check
        claim_type: Priority conflict
        grounds:
          - validations[priority 12 -> ERR_PICKUP_DEADLINE_PASSED]
          - validations[priority 13 -> ERR_DOCK_CAPACITY_EXHAUSTED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / pickup_deadline_temporal_error_wins_over_dock_capacity
          rationale: "The named §1.8 instance saturates both doors past the deadline and pins the priority-12 error."

  # ===========================================================================
  # Guide section 5 - Endpoints
  # ===========================================================================
  - section: endpoints
    instances:

      - name: recovery_analytics_returns_zeros_for_a_seller_with_no_listed_lots
        claim_type: Computed read
        grounds:
          - endpoints[GET /liquidation/recovery-analytics]
          - calculations.recovery_rate
          - entities.SellerAccount.fields.listed_retail_value_cents
        distinguishing_aspect: >
          Both denominators are empty for a seller whose only lot is still DRAFT, so the read
          returns 0.0000 for both rates instead of dividing by zero, and the default group_by NONE
          returns an empty groups list even though the DRAFT lot carries 10000000 cents of
          declared retail value.
        test_recipe:
          setup:
            - "One ACTIVE seller with a single DRAFT lot holding one manifest line of 100 x 100000 (declared_retail_value_cents 10000000)."
            - "The lot has never been published, so it is outside both the GROSS and the NET lot populations."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/seller-accounts"
              payload: { legal_name: "Northline Returns LLC", tax_id: "S-1001", state_code: "OH", contact_email: "ops@northline.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: "$.data.id" }
            - call: "POST /liquidation/warehouses"
              payload: { name: "Columbus DC", state_code: "OH", dock_door_count: 2, turnaround_buffer_minutes: 15 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { w1: "$.data.id" }
            - call: "POST /liquidation/lots"
              payload: { seller_id: "${s1}", warehouse_id: "${w1}", title: "Draft apparel lot", category_code: "APPAREL", condition_grade: "CUSTOMER_RETURNS" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lotd: "$.data.id" }
            - call: "POST /liquidation/lots/${lotd}/manifest-lines"
              payload: { sku: "APP-D1", unit_count: 100, unit_retail_cents: 100000, declared_condition: "USED_GOOD" }
              as: SellerOps
              as_user_id: "${s1}"
          trigger:
            - call: "GET /liquidation/recovery-analytics"
              payload: { seller_id: "${s1}" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { g0: "$.data.gross_recovery_rate", n0: "$.data.net_recovery_rate" }
          assert:
            - "HTTP 200 with seller_id == ${s1} and group_by == NONE (the default was applied)"
            - "groups == [] (an empty list, not a null and not a per-category fan-out)"
            - "gross_hammer_cents == 0, listed_retail_value_cents == 0, ${g0} == 0.0000"
            - "net_proceeds_cents == 0, sold_retail_value_cents == 0, ${n0} == 0.0000"
            - "Lot.${lotd}.lot_status == DRAFT and declared_retail_value_cents == 10000000, proving the DRAFT lot is excluded rather than counted"
            - "the read persists nothing: SellerAccount.${s1}.gross_recovery_rate is still 0.0000 and commission_tier == TIER_STANDARD"

      - name: pickup_deadline_sweep_abandons_only_the_overdue_order
        claim_type: Bulk action
        grounds:
          - endpoints[POST /liquidation/pickup-deadline-sweeps]
          - state_machines.SaleOrder.AWAITING_APPOINTMENT_to_ABANDONED
          - calculations.recovery_rate
          - calculations.buyer_exposure
        distinguishing_aspect: >
          The sweep is a skip-not-fail bulk action driven by a strict comparison: at
          2026-08-15T01:00:01Z it returns exactly one row (the order whose deadline was
          2026-08-15T01:00:00Z), leaves the order deadlined 2026-08-16T01:00:00Z untouched, and a
          second identical sweep returns an empty list because abandoned orders are skipped.
