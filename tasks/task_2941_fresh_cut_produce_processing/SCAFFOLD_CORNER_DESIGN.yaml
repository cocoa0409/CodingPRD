              captures: { lot2: "$.data.id", lot2_st: "$.data.status", lot2_pre: "$.data.preharvest_risk_score" }
            - call: "POST /raw-receipts"
              payload: { grower_lot_id: "${lot2}", received_at: "2026-08-02T05:20:00Z", pulp_temp_c: 2.0, gross_weight_lb: 10000.00, tare_weight_lb: 1000.00 }
              as: ReceivingClerk
              captures: { rcpt2_st: "$.data.status" }
            - call: "POST /lines/${line_id}/sanitation-events"
