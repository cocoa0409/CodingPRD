scaffold_corner_design:

  # =========================================================================
  # Section 1 - entities  (flat topology, 15 entities, 3 of them immutable)
  # =========================================================================
  - section: entities
    instances:
      - name: create_program_returns_201_with_zeroed_counters_and_full_health
        claim_type: Creation
        grounds:
          - entities.Program
          - endpoints["POST /programs"]
          - response_envelope
        distinguishing_aspect: |
          A create call with only the two required inputs must return 201 with the success
          envelope and every computed counter at its declared opening value - committed 0,
          send_quota_used 0, brand_health_score 100.00 (a program with no reviews is perfectly
          healthy) and version 1. An implementation that leaves brand_health_score null or
          version 0 fails.
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
          assert:
            - "HTTP 201 and the body is { success: true, data: { ... } } with no error key"
            - "data.id is a bare UUID with no type prefix and data.version == 1"
            - "Program.${program_id}.attribution_model == LINEAR (declared default), pool_job_board_cents == 0, pool_social_cents == 0, pool_programmatic_cents == 0, flex_reserve_cents == 0, send_quota_total == 0"
            - "Program.${program_id}.committed_budget_cents == 0, send_quota_used == 0, brand_health_score == 100.00, last_attribution_recompute_at == null"
            - "data.created_at and data.updated_at are ISO 8601 UTC with three fractional digits"

      - name: get_job_family_returns_stored_inputs_and_derived_availability
        claim_type: Retrieval
        grounds:
          - entities.JobFamily
          - endpoints["GET /job-families/{familyId}"]
        distinguishing_aspect: |
          A single read must echo every stored input unchanged and expose the derived
          dedicated_available_cents, which is dedicated_budget_cents minus reserved_cents - 800000
          on an untouched family. A read that omits derived fields or recomputes the code/name
          fails.
        test_recipe:
          setup:
            - "One Program and one JobFamily with dedicated_budget_cents 800000 and no reservations."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, dedicated_budget_cents: 800000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
          trigger:
            - call: "GET /job-families/${family_id}"
              as: PersonaResearcher
          assert:
            - "HTTP 200 with success true"
            - "data.program_id == ${program_id}, data.name == Software Engineering, data.code == SWE, data.cpqa_target_cents == 15000, data.priority_rank == 1"
            - "data.dedicated_budget_cents == 800000, data.reserved_cents == 0, data.dedicated_available_cents == 800000"
            - "data.version == 1 and data.updated_at == data.created_at"

      - name: list_job_families_filters_by_program_and_paginates_in_declared_order
        claim_type: Listing
        grounds:
          - endpoints["GET /job-families"]
          - entities.JobFamily.fields.priority_rank
        distinguishing_aspect: |
          The list endpoint must scope by program_id and page with limit/offset while preserving
          the declared ordering (priority_rank ASC, then created_at ASC). With three families in
          program A and one in program B, limit 2 offset 1 must return exactly the second and
          third families of A and never the family of B.
        test_recipe:
          setup:
            - "Program A with families SWE (priority_rank 1), SALES (2) and OPS (3), created in that order."
            - "Program B with a single family DATA (priority_rank 1)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Program A", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { prog_a_id: $.data.id }
            - call: "POST /programs"
              payload: { name: "Program B", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { prog_b_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${prog_a_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { swe_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${prog_a_id}", name: "Enterprise Sales", code: "SALES", cpqa_target_cents: 22000, priority_rank: 2 }
              as: BrandProgramLead
              captures: { sales_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${prog_a_id}", name: "Operations", code: "OPS", cpqa_target_cents: 9000, priority_rank: 3 }
              as: BrandProgramLead
              captures: { ops_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${prog_b_id}", name: "Data Science", code: "DATA", cpqa_target_cents: 30000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { data_id: $.data.id }
          trigger:
            - call: "GET /job-families?program_id=${prog_a_id}&limit=2&offset=1"
              as: MediaBuyer
          assert:
            - "HTTP 200 and data is a list of exactly 2 rows"
            - "data[0].id == ${sales_id} and data[1].id == ${ops_id} - priority_rank ASC with offset 1 skips SWE"
            - "No row of program ${prog_b_id} appears, so ${data_id} is absent"
            - "GET /job-families?program_id=${prog_a_id} without paging returns 3 rows in the order ${swe_id}, ${sales_id}, ${ops_id}"

      - name: get_unknown_media_flight_id_returns_flight_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=6].ERR_FLIGHT_NOT_FOUND
          - endpoints["GET /media-flights/{flightId}"]
          - errors[ERR_FLIGHT_NOT_FOUND]
        distinguishing_aspect: |
          A syntactically valid UUID that matches no MediaFlight row must produce the
          entity-specific 404 ERR_FLIGHT_NOT_FOUND, not a generic ERR_RECORD_NOT_FOUND and not a
          500. The path-existence rule is priority 6, so it fires before any business rule.
        test_recipe:
          setup:
            - "Empty database; no MediaFlight rows exist at all."
          setup_api_calls: []
          trigger:
            - call: "GET /media-flights/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: MediaBuyer
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 404 with success false and data.error_id == ERR_FLIGHT_NOT_FOUND"
            - "data.message is a non-empty human-readable string"
            - "No row is created as a side effect of the failed read"

      - name: create_channel_without_channel_type_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=4].ERR_INVALID_REQUEST
          - entities.Channel.fields.channel_type
          - endpoints["POST /channels"]
        distinguishing_aspect: |
          channel_type carries source input and no default, so omitting it is a 422
          ERR_INVALID_REQUEST at priority 4 - before the priority-7 FK existence check, which is
          why supplying a bogus program_id in the same request must still surface
          ERR_INVALID_REQUEST rather than ERR_PROGRAM_NOT_FOUND.
        test_recipe:
          setup:
            - "One Program exists so that a well-formed retry can succeed."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
          trigger:
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Board A", daily_capacity_cents: 100000 }
              as: BrandProgramLead
              captures: { error_id: $.data.error_id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Board A", channel_type: "JOB_BOARD", daily_capacity_cents: 100000 }
              as: BrandProgramLead
              captures: { channel_id: $.data.id }
          assert:
            - "Trigger call 1 returns HTTP 422 with data.error_id == ERR_INVALID_REQUEST and no Channel row is created"
            - "Trigger call 2 returns 201 with data.channel_type == JOB_BOARD and data.min_flight_days == 1 (declared default)"
            - "Channel.${channel_id}.spent_cents == 0, credited_qualified_bp == 0, active_flight_count == 0, pacing_status == PACING_UNKNOWN, blended_target_cents == null, cpqa_cents == null, idle_since == null"

      - name: talent_community_member_applies_declared_defaults_on_join
        claim_type: Defaults
        grounds:
          - entities.TalentCommunityMember.fields.frequency_cap_per_30d
          - entities.TalentCommunityMember.fields.consent_status
          - endpoints["POST /talent-community-members"]
        distinguishing_aspect: |
          Omitting frequency_cap_per_30d must yield the declared default of 4, not 0 and not null,
          and consent_status must open at PENDING_CONFIRMATION with a non-null consent_token while
          every timestamp stays null - a member is never subscribed by the act of joining, which
          is what the consent rules of this domain hang on.
        test_recipe:
          setup:
            - "One Program; the logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
          trigger:
            - call: "POST /talent-community-members"
              payload: { program_id: "${program_id}", email: "joiner@example.com" }
              as: Anonymous
              captures: { member_id: $.data.id, token: $.data.consent_token }
          assert:
            - "HTTP 201 with data.frequency_cap_per_30d == 4 and data.consent_status == PENDING_CONFIRMATION"
            - "data.consent_token is a non-empty string and ${token} differs from ${member_id}"
            - "data.interest_job_family_id == null, sent_count_total == 0, last_sent_at == null, consent_confirmed_at == null, consent_changed_at == null"
            - "data.version == 1"

      - name: create_employer_review_with_rating_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.EmployerReview.fields.rating
          - entities.EmployerReview.fields.platform
          - validations[priority=4].ERR_INVALID_REQUEST
        distinguishing_aspect: |
          rating is constrained to 1-5 and platform to the three declared enum members, so 6 and
          LINKEDIN are both 422 ERR_INVALID_REQUEST. The boundary value 5 must be accepted, which
          separates a correct range check from an off-by-one one.
        test_recipe:
          setup:
            - "One Program with no reviews."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
          trigger:
            - call: "POST /employer-reviews"
              payload: { program_id: "${program_id}", platform: "GLASSDOOR", external_ref: "gd-1", rating: 6, posted_at: "2026-07-31T12:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { error_id: $.data.error_id }
            - call: "POST /employer-reviews"
              payload: { program_id: "${program_id}", platform: "LINKEDIN", external_ref: "li-1", rating: 4, posted_at: "2026-07-31T12:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /employer-reviews"
              payload: { program_id: "${program_id}", platform: "COMPARABLY", external_ref: "cp-1", rating: 5, posted_at: "2026-07-31T12:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { review_id: $.data.id }
          assert:
            - "Trigger call 1 returns 422 ERR_INVALID_REQUEST (rating 6 is outside 1-5)"
            - "Trigger call 2 returns 422 ERR_INVALID_REQUEST (LINKEDIN is not a declared platform)"
            - "Trigger call 3 returns 201 with data.rating == 5, data.platform == COMPARABLY, data.state == NEW and data.response_due_at == 2026-08-07T12:00:00Z (168-hour band)"
            - "Program.${program_id}.brand_health_score == 100.00 - a 5-star review carries max(0, 3 - 5) == 0 penalty"
            - "Exactly one EmployerReview row exists and its id is ${review_id}"

      - name: touchpoint_is_immutable_and_exposes_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Touchpoint
          - endpoints["GET /touchpoints/{touchpointId}"]
          - endpoints["POST /touchpoints"]
        distinguishing_aspect: |
          Touchpoint is declared common_fields false, so it carries id and created_at only - no
          updated_at, no version - and the §1.5 surface exposes exactly three operations for it
          (create, read one, list). Its credit_bp is mutated only by the qualification cascade, so
          the row is append-only from the client's point of view.
        test_recipe:
          setup:
            - "A PUBLISHED, CLEARED posting of a family with an APPROVED persona, one JOB_BOARD channel and one STARTED application, so a touchpoint can be ingested."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Board A", channel_type: "JOB_BOARD", daily_capacity_cents: 100000 }
              as: BrandProgramLead
              captures: { ch1_id: $.data.id }
            - call: "POST /candidate-personas"
              payload: { job_family_id: "${family_id}", name: "Backend IC", mix_method: "SURVEY_WEIGHTED", research_window_days: 180 }
              as: PersonaResearcher
              as_user_id: "u-res-1"
              captures: { persona_id: $.data.id }
            - call: "POST /channel-preference-signals"
              payload: { persona_id: "${persona_id}", channel_id: "${ch1_id}", preference_score: 70, sample_size: 400, engagement_events: 100, collected_at: "2026-07-20T00:00:00Z" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/submit"
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/review"
              payload: { decision: "APPROVE", review_note: "approved" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id, posting_version: $.data.version }
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${posting_version}" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings/${posting_id}/compliance-review"
              payload: { decision: "CLEAR", note: "clean" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
            - call: "POST /job-postings/${posting_id}/publish"
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /applications"
              payload: { job_posting_id: "${posting_id}", candidate_email: "immutable@example.com" }
              as: Anonymous
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /touchpoints"
              payload: { application_id: "${app_id}", channel_id: "${ch1_id}", touch_type: "ORGANIC_VISIT", occurred_at: "2026-07-30T08:00:00Z" }
              as: MediaBuyer
              captures: { tp_id: $.data.id }
            - call: "GET /touchpoints/${tp_id}"
              as: RecruitingOps
          assert:
            - "Trigger call 1 returns 201 with data.credit_bp == 0 and data.media_cost_cents == 0 (declared default)"
            - "Trigger call 1 and 2 responses expose data.id and data.created_at but no updated_at and no version key"
            - "The §1.5 surface declares no PATCH, PUT or DELETE for /touchpoints - the entity is append-only"
            - "data.media_flight_id == null because the touch was organic, and GET /touchpoints?application_id=${app_id} returns exactly this one row"

      - name: body_foreign_keys_are_validated_in_declared_input_order
        claim_type: flat
        grounds:
          - validations[priority=7].ERR_JOB_FAMILY_NOT_FOUND
          - entities.JobPosting.fields.job_family_id
          - entities.ChannelPreferenceSignal.fields.persona_id
          - endpoints["POST /channel-preference-signals"]
        distinguishing_aspect: |
          The topology is flat, so every parent link is a body FK checked at priority 7 in the
          order the fields appear in the endpoint's input list. A posting whose job_family_id does
          not exist is ERR_JOB_FAMILY_NOT_FOUND; a signal that names a bogus persona_id and a
          bogus channel_id at once must report the persona error, because persona_id is declared
          first.
        test_recipe:
          setup:
            - "One Program, one JobFamily and one DRAFT CandidatePersona of that family."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /candidate-personas"
              payload: { job_family_id: "${family_id}", name: "Backend IC", mix_method: "SURVEY_WEIGHTED", research_window_days: 180 }
              as: PersonaResearcher
              as_user_id: "u-res-1"
              captures: { persona_id: $.data.id }
          trigger:
            - call: "POST /job-postings"
              payload: { job_family_id: "11111111-1111-4111-8111-111111111111", title: "Ghost Role", pay_range_min_cents: 1000000, pay_range_max_cents: 2000000 }
              as: BrandProgramLead
              captures: { error_id: $.data.error_id }
            - call: "POST /channel-preference-signals"
              payload: { persona_id: "22222222-2222-4222-8222-222222222222", channel_id: "33333333-3333-4333-8333-333333333333", preference_score: 50, sample_size: 100, engagement_events: 10, collected_at: "2026-07-20T00:00:00Z" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
          assert:
            - "Trigger call 1 returns 404 with data.error_id == ERR_JOB_FAMILY_NOT_FOUND and no JobPosting row is created"
            - "Trigger call 2 returns 404 with data.error_id == ERR_PERSONA_NOT_FOUND, not ERR_CHANNEL_NOT_FOUND - persona_id precedes channel_id in the endpoint's input list"
            - "CandidatePersona.${persona_id}.signal_count == 0 and channel_mix == [] after both rejections"

      - name: computed_fields_reject_client_values_supplied_as_an_extra_field
        claim_type: Computed Fields
        grounds:
          - entities.Channel.fields.spent_cents
          - entities.Channel.fields.pacing_status
          - endpoints["POST /channels"]
        distinguishing_aspect: |
          Nine of Channel's twelve fields are computed or system-owned and none of them is a declared
          input, so a body that tries to seed spent_cents 999999 and pacing_status ON_TARGET must not
          take those values - the row opens at 0 and PACING_UNKNOWN. The same holds for
          Program.committed_budget_cents and JobFamily.reserved_cents, which only ledger entries may
          move.
        test_recipe:
          setup:
            - "One Program with no channels."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
          trigger:
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Board A", channel_type: "JOB_BOARD", daily_capacity_cents: 100000, spent_cents: 999999, pacing_status: "ON_TARGET", credited_qualified_bp: 5000 }
              as: BrandProgramLead
              captures: { channel_id: $.data.id }
          assert:
            - "The three non-input keys are either ignored outright or rejected with 422 ERR_INVALID_REQUEST - an implementation must not accept them as values"
            - "If the row is created, Channel.${channel_id}.spent_cents == 0, credited_qualified_bp == 0, pacing_status == PACING_UNKNOWN, cpqa_cents == null and blended_target_cents == null"
            - "data.daily_capacity_cents == 100000 - the legitimate input is still honoured"
            - "Program.${program_id}.committed_budget_cents is still 0"

      - name: system_fields_are_server_generated_and_client_input_ignored
        claim_type: System Fields
        grounds:
          - response_envelope
          - entities.Program
          - entities.TalentCommunityMember.fields.consent_token
        distinguishing_aspect: |
          id, created_at, updated_at and version are minted by the server, and so is the
          double-opt-in consent_token: a client that posts its own id or consent_token must not be
          able to choose them, which is what makes the token a real secret rather than a guessable
          field.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, id: "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb", version: 99 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /talent-community-members"
              payload: { program_id: "${program_id}", email: "tokenpicker@example.com", consent_token: "i-choose-this" }
              as: Anonymous
              captures: { member_id: $.data.id, token: $.data.consent_token }
            - call: "POST /talent-community-members/${member_id}/confirm-consent"
              payload: { consent_token: "i-choose-this" }
              as: Anonymous
              captures: { error_id: $.data.error_id }
          assert:
            - "Trigger call 1 either ignores the supplied id and version or returns 422 ERR_INVALID_REQUEST; if it returns 201 then ${program_id} != bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb and data.version == 1"
            - "Trigger call 2 mints its own token, so ${token} != i-choose-this"
            - "Trigger call 3 returns 422 with data.error_id == ERR_CONSENT_TOKEN_INVALID and the member stays PENDING_CONFIRMATION"
            - "A confirm-consent call carrying ${token} afterwards succeeds, proving only the generated token works"

  # =========================================================================
  # Section 2 - state_machines  (8 machines; consent, posting, flight, review)
  # =========================================================================
  - section: state_machines
    instances:
      - name: confirm_consent_moves_pending_member_to_subscribed_and_stamps_both_times
        claim_type: Valid Transition
        grounds:
          - state_machines.TalentCommunityMember["PENDING_CONFIRMATION -> SUBSCRIBED"]
          - endpoints["POST /talent-community-members/{memberId}/confirm-consent"]
        distinguishing_aspect: |
          Double opt-in is the only path out of PENDING_CONFIRMATION, and it must stamp both
          consent_confirmed_at and consent_changed_at with the logical clock (not the wall clock)
          while bumping version to 2. An implementation that sets only one of the two timestamps,
          or that uses real time, fails.
        test_recipe:
          setup:
            - "One Program and one PENDING_CONFIRMATION member; the logical clock is moved to 2026-08-03T09:15:00Z before the trigger."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /talent-community-members"
              payload: { program_id: "${program_id}", email: "optin@example.com" }
              as: Anonymous
              captures: { member_id: $.data.id, token: $.data.consent_token }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:15:00Z" }
              as: RecruitingOps
          trigger:
            - call: "POST /talent-community-members/${member_id}/confirm-consent"
              payload: { consent_token: "${token}" }
              as: Anonymous
          assert:
            - "HTTP 200 with data.consent_status == SUBSCRIBED"
            - "data.consent_confirmed_at == 2026-08-03T09:15:00.000Z and data.consent_changed_at == 2026-08-03T09:15:00.000Z"
            - "data.version == 2 and data.sent_count_total == 0"
            - "data.consent_token is still the same value ${token} - confirmation does not rotate it"

      - name: confirm_consent_with_a_wrong_token_returns_consent_token_invalid
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.TalentCommunityMember["PENDING_CONFIRMATION -> SUBSCRIBED"].preconditions
          - validations[priority=22].ERR_CONSENT_TOKEN_INVALID
        distinguishing_aspect: |
          The token check is a 422 at priority 22, which sits after the state check at priority 18,
          so a wrong token on a still-pending member is ERR_CONSENT_TOKEN_INVALID while the same
          wrong token on an already-subscribed member is ERR_CONSENT_ALREADY_RESOLVED. The failed
          attempt must not consume the token or advance the state.
        test_recipe:
          setup:
            - "One PENDING_CONFIRMATION member with a known consent_token."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /talent-community-members"
              payload: { program_id: "${program_id}", email: "optin@example.com" }
              as: Anonymous
              captures: { member_id: $.data.id, token: $.data.consent_token }
          trigger:
            - call: "POST /talent-community-members/${member_id}/confirm-consent"
              payload: { consent_token: "not-the-real-token" }
              as: Anonymous
              captures: { error_id: $.data.error_id }
            - call: "POST /talent-community-members/${member_id}/confirm-consent"
              payload: { consent_token: "${token}" }
              as: Anonymous
            - call: "POST /talent-community-members/${member_id}/confirm-consent"
              payload: { consent_token: "not-the-real-token" }
              as: Anonymous
          assert:
            - "Trigger call 1 returns 422 with data.error_id == ERR_CONSENT_TOKEN_INVALID"
            - "After call 1 the member is still PENDING_CONFIRMATION with version 1 and consent_confirmed_at null"
            - "Trigger call 2 returns 200 with consent_status SUBSCRIBED and version 2"
            - "Trigger call 3 returns 409 with data.error_id == ERR_CONSENT_ALREADY_RESOLVED - the state check at priority 18 now outranks the token check at priority 22"

      - name: unsubscribed_member_cannot_be_resumed_or_paused
        claim_type: Invalid Transitions
        grounds:
          - state_machines.TalentCommunityMember["SUBSCRIBED -> UNSUBSCRIBED"]
          - validations[priority=18].ERR_CONSENT_TRANSITION_INVALID
          - errors[ERR_CONSENT_ALREADY_RESOLVED]
        distinguishing_aspect: |
          UNSUBSCRIBED is absorbing for consent: RESUME and PAUSE from it are 409
          ERR_CONSENT_TRANSITION_INVALID, while a second UNSUBSCRIBE is 409
          ERR_CONSENT_ALREADY_RESOLVED because its own precondition set names the three non-terminal
          statuses. The member must remain permanently excluded from every audience.
        test_recipe:
          setup:
            - "One SUBSCRIBED member who then unsubscribes; the CommunityManager acts on her behalf."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /talent-community-members"
              payload: { program_id: "${program_id}", email: "leaver@example.com" }
              as: Anonymous
              captures: { member_id: $.data.id, token: $.data.consent_token }
            - call: "POST /talent-community-members/${member_id}/confirm-consent"
              payload: { consent_token: "${token}" }
              as: Anonymous
            - call: "POST /talent-community-members/${member_id}/consent-change"
              payload: { action: "UNSUBSCRIBE" }
              as: CommunityManager
              as_user_id: "u-cm-1"
          trigger:
            - call: "POST /talent-community-members/${member_id}/consent-change"
              payload: { action: "RESUME" }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { error_id: $.data.error_id }
            - call: "POST /talent-community-members/${member_id}/consent-change"
              payload: { action: "PAUSE" }
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /talent-community-members/${member_id}/consent-change"
              payload: { action: "UNSUBSCRIBE" }
              as: CommunityManager
              as_user_id: "u-cm-1"
          assert:
            - "Trigger call 1 returns 409 with data.error_id == ERR_CONSENT_TRANSITION_INVALID (RESUME requires PAUSED)"
            - "Trigger call 2 returns 409 with data.error_id == ERR_CONSENT_TRANSITION_INVALID (PAUSE requires SUBSCRIBED)"
            - "Trigger call 3 returns 409 with data.error_id == ERR_CONSENT_ALREADY_RESOLVED"
            - "The member is still UNSUBSCRIBED and version has not moved past 3 - no failed call bumps version"

      - name: re_triaging_a_triaged_review_is_rejected_rather_than_treated_as_idempotent
        claim_type: Idempotency
        grounds:
          - state_machines.EmployerReview["NEW -> TRIAGED"].preconditions
          - errors[ERR_REVIEW_NOT_NEW]
        distinguishing_aspect: |
          Action endpoints in this scaffold are not idempotent by state re-entry: triage requires
          state == NEW exactly, so a second triage is 409 ERR_REVIEW_NOT_NEW and must not re-stamp
          sla_status or bump version. This is the opposite of draft-response, whose precondition
          admits {TRIAGED, DRAFTING} and so is legitimately repeatable.
        test_recipe:
          setup:
            - "One 2-star review, triaged once."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /employer-reviews"
              payload: { program_id: "${program_id}", platform: "GLASSDOOR", external_ref: "gd-77", rating: 2, posted_at: "2026-07-31T00:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { review_id: $.data.id }
            - call: "POST /employer-reviews/${review_id}/triage"
              payload: { note: "first pass" }
              as: CommunityManager
              as_user_id: "u-cm-1"
          trigger:
            - call: "POST /employer-reviews/${review_id}/triage"
              payload: { note: "second pass" }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { error_id: $.data.error_id }
            - call: "POST /employer-reviews/${review_id}/draft-response"
              payload: { response_body: "first draft" }
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /employer-reviews/${review_id}/draft-response"
              payload: { response_body: "second draft" }
              as: CommunityManager
              as_user_id: "u-cm-1"
          assert:
            - "Trigger call 1 returns 409 with data.error_id == ERR_REVIEW_NOT_NEW and the review stays TRIAGED at version 2"
            - "Trigger call 2 returns 200 with state DRAFTING, response_body first draft and version 3"
            - "Trigger call 3 returns 200 - the DRAFTING self-admitting precondition allows redrafting - with response_body second draft and version 4"
            - "response_due_at is still the value computed at creation (2026-08-01T00:00:00.000Z, the 24-hour band for rating <= 2) - triage re-evaluates sla_status but never recomputes the deadline"

      - name: spending_on_a_cancelled_flight_is_rejected_because_the_state_is_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.MediaFlight["RESERVED -> CANCELLED"]
          - errors[ERR_FLIGHT_ALREADY_TERMINAL]
          - validations[priority=16]
        distinguishing_aspect: |
          CANCELLED and COMPLETED are absorbing: both a second cancel and a spend attempt collapse
          onto ERR_FLIGHT_ALREADY_TERMINAL per the priority-16 dispatch table, while activate on a
          non-RESERVED flight is ERR_FLIGHT_NOT_RESERVED. The released budget must stay released -
          the failed calls write no ledger row at all.
        test_recipe:
          setup:
            - "A program with pool_job_board_cents 1000000, one JOB_BOARD channel with daily_capacity_cents 100000, a PUBLISHED CLEARED posting and one RESERVED flight that is then cancelled."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, pool_job_board_cents: 1000000 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Board A", channel_type: "JOB_BOARD", daily_capacity_cents: 100000 }
              as: BrandProgramLead
              captures: { ch1_id: $.data.id }
            - call: "POST /candidate-personas"
              payload: { job_family_id: "${family_id}", name: "Backend IC", mix_method: "SURVEY_WEIGHTED", research_window_days: 180 }
              as: PersonaResearcher
              as_user_id: "u-res-1"
              captures: { persona_id: $.data.id }
            - call: "POST /channel-preference-signals"
              payload: { persona_id: "${persona_id}", channel_id: "${ch1_id}", preference_score: 70, sample_size: 400, engagement_events: 100, collected_at: "2026-07-20T00:00:00Z" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/submit"
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/review"
              payload: { decision: "APPROVE", review_note: "ok" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id, pv1: $.data.version }
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${pv1}" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings/${posting_id}/compliance-review"
              payload: { decision: "CLEAR", note: "clean" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
            - call: "POST /job-postings/${posting_id}/publish"
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "GET /programs/${program_id}"
              as: MediaBuyer
              captures: { prog_v: $.data.version }
            - call: "POST /media-flights"
              payload: { channel_id: "${ch1_id}", job_family_id: "${family_id}", job_posting_id: "${posting_id}", start_date: "2026-08-05", end_date: "2026-08-10", daily_cap_cents: 50000, expected_program_version: "${prog_v}" }
              as: MediaBuyer
              captures: { flight_id: $.data.id }
            - call: "POST /media-flights/${flight_id}/cancel"
              payload: { reason: "plan change" }
              as: MediaBuyer
          trigger:
            - call: "POST /media-flights/${flight_id}/cancel"
              payload: { reason: "again" }
              as: MediaBuyer
              captures: { error_id: $.data.error_id }
            - call: "POST /media-flights/${flight_id}/spend"
              payload: { amount_cents: 1000, spent_on: "2026-08-06" }
              as: MediaBuyer
            - call: "POST /media-flights/${flight_id}/activate"
              as: MediaBuyer
          assert:
            - "Trigger call 1 returns 409 with data.error_id == ERR_FLIGHT_ALREADY_TERMINAL"
            - "Trigger call 2 returns 409 with data.error_id == ERR_FLIGHT_ALREADY_TERMINAL and spent_cents stays 0"
            - "Trigger call 3 returns 409 with data.error_id == ERR_FLIGHT_NOT_RESERVED"
            - "GET /budget-ledger-entries?source_id=${flight_id} returns exactly two rows - one RESERVE and its mirroring RELEASE - after all three failed calls"
            - "Program.${program_id}.committed_budget_cents == 0 and the flight stays CANCELLED with release_reason CANCELLED"

      - name: event_completion_converts_the_reservation_into_spend_without_a_ledger_row
        claim_type: Side Effect Execution
        grounds:
          - state_machines.EventPresence["CONFIRMED -> COMPLETED"].side_effects
          - validations[priority=45].ERR_EVENT_WINDOW_OPEN
          - calculations.media_budget_waterfall
        distinguishing_aspect: |
          Confirmation reserves booth_cost_cents through the two-bucket event variant of the
          waterfall (FAMILY_DEDICATED then FLEX_RESERVE) and completion is the one release-shaped
          transition that writes no ledger entry - reserved_cents deliberately stays at
          booth_cost_cents because the money was actually spent. Completion also requires the clock
          to be strictly after end_at, so calling it exactly at end_at is ERR_EVENT_WINDOW_OPEN.
        test_recipe:
          setup:
            - "A program with flex_reserve_cents 500000, a family with no dedicated budget, and one PLANNED presence of 200000 cents running 2026-08-19T09:00:00Z to 2026-08-20T18:00:00Z."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, flex_reserve_cents: 500000 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /event-presences"
              payload: { program_id: "${program_id}", job_family_id: "${family_id}", venue_code: "CAMPUS-A", start_at: "2026-08-19T09:00:00Z", end_at: "2026-08-20T18:00:00Z", booth_cost_cents: 200000 }
              as: MediaBuyer
              captures: { presence_id: $.data.id }
            - call: "POST /event-presences/${presence_id}/confirm"
              as: MediaBuyer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T18:00:00Z" }
              as: RecruitingOps
          trigger:
            - call: "POST /event-presences/${presence_id}/complete"
              as: MediaBuyer
              captures: { error_id: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T18:00:01Z" }
              as: RecruitingOps
            - call: "POST /event-presences/${presence_id}/complete"
              as: MediaBuyer
          assert:
            - "After confirm, reserved_cents == 200000, confirmed_at is set, and GET /budget-ledger-entries?source_id=${presence_id} returns exactly one RESERVE row with bucket FLEX_RESERVE and delta_cents 200000"
            - "Program.${program_id}.committed_budget_cents == 200000 and JobFamily.${family_id}.reserved_cents == 200000 after confirm"
            - "Trigger call 1 returns 409 with data.error_id == ERR_EVENT_WINDOW_OPEN - the clock exactly at end_at is not strictly after it"
            - "Trigger call 3 returns 200 with state COMPLETED and reserved_cents still 200000"
            - "GET /budget-ledger-entries?source_id=${presence_id} still returns exactly one row after completion - no RELEASE is written"

      - name: newly_created_rows_open_in_their_declared_initial_states
        claim_type: Initial State
        grounds:
          - state_machines.CandidatePersona
          - state_machines.NurtureCampaign
          - state_machines.EmployerReview
          - state_machines.EventPresence
          - state_machines.Application
        distinguishing_aspect: |
          Five of the eight machines are entered by a plain create call, and each has a different
          opening label - persona DRAFT, campaign DRAFT, review NEW, presence PLANNED, application
          STARTED - while MediaFlight is the only machine whose creation transition already performs
          money side effects (it opens at RESERVED, never at DRAFT).
        test_recipe:
          setup:
            - "One Program and one JobFamily; nothing else."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, send_quota_total: 50 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
          trigger:
            - call: "POST /candidate-personas"
              payload: { job_family_id: "${family_id}", name: "Backend IC" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
              captures: { persona_id: $.data.id }
            - call: "POST /nurture-campaigns"
              payload: { program_id: "${program_id}", job_family_id: "${family_id}", name: "August Warm-up", max_sends: 10 }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { campaign_id: $.data.id }
            - call: "POST /employer-reviews"
              payload: { program_id: "${program_id}", platform: "INDEED", external_ref: "in-1", rating: 3, posted_at: "2026-07-31T00:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { review_id: $.data.id }
            - call: "POST /event-presences"
              payload: { program_id: "${program_id}", job_family_id: "${family_id}", venue_code: "CAMPUS-B", start_at: "2026-09-10T09:00:00Z", end_at: "2026-09-10T17:00:00Z", booth_cost_cents: 50000 }
              as: MediaBuyer
              captures: { presence_id: $.data.id }
          assert:
            - "CandidatePersona.${persona_id}.state == DRAFT with mix_method default SURVEY_WEIGHTED, research_window_days default 180, channel_mix [], signal_count 0 and mix_confidence_pct 0"
            - "NurtureCampaign.${campaign_id}.state == DRAFT with scheduled_for null and audience_size 0"
            - "EmployerReview.${review_id}.state == NEW, sla_status == PENDING and response_due_at == 2026-08-03T00:00:00.000Z (rating exactly 3 selects the 72-hour band)"
            - "EventPresence.${presence_id}.state == PLANNED with reserved_cents 0 and confirmed_at null - planning reserves nothing"
            - "Every created row has version 1"

      - name: sm_parallel_dimensions_content_status_and_compliance_status
        claim_type: parallel
        grounds:
          - state_machines.JobPosting
        excluded_because:
          difficulty_instance: posting_optimize_self_transition_retracts_compliance_clearance
          rationale: |
            JobPosting carries two orthogonal state dimensions (content_status and
            compliance_status), and the §1.8 non_linear_state_machine instance already exercises
            their interaction in the hardest direction - an OPTIMIZED -> OPTIMIZED self transition
            that silently drags compliance_status back from CLEARED to UNREVIEWED and thereby blocks
            the next publish. A separate corner test would only re-walk that pair.

      - name: sm_cyclic_return_from_legal_review_to_drafting
        claim_type: cyclic
        grounds:
          - state_machines.EmployerReview["LEGAL_REVIEW -> DRAFTING"]
        excluded_because:
          difficulty_instance: employer_review_legal_rejection_cycle_revisits_drafting_twice
          rationale: |
            The only cycle in the scaffold is DRAFTING -> LEGAL_REVIEW -> DRAFTING, and the §1.8
            instance already traverses it twice, asserting that rejection_count accumulates to 2
            while response_body survives and sla_status is only decided on the final approval.

      - name: sm_cascade_down_from_qualification_to_the_budget_ledger
        claim_type: Cascade down
        grounds:
          - state_machines.Application["SCREENED -> QUALIFIED"].side_effects
        excluded_because:
          difficulty_instance: qualification_cascade_five_hops_from_decide_to_budget_release
          rationale: |
            The deepest downward cascade is decide(QUALIFIED) -> touchpoint credit -> channel
            counters -> channel throttle -> flight pause -> ledger release, five hops, and the §1.8
            transitive_cascade instance already asserts every hop plus the THROTTLED-over-IDLE
            precedence at the end of it.

      - name: sm_cross_entity_suspension_of_flights_by_a_compliance_flag
        claim_type: Cross-entity
        grounds:
          - state_machines.JobPosting["PUBLISHED -> SUSPENDED"].side_effects
        excluded_because:
          difficulty_instance: compliance_flag_cascade_five_hops_from_review_to_idle_channel
          rationale: |
            The cross-entity fan-out from a compliance FLAG (posting -> flights -> channels ->
            program ledger) is the subject of the second §1.8 transitive_cascade instance, which
            also pins the IDLE resolution and the mirroring RELEASE rows.

      - name: sm_ledger_sync_between_reservations_and_program_counters
        claim_type: Ledger sync
        grounds:
          - entities.BudgetLedgerEntry
          - entities.Program.fields.committed_budget_cents
        excluded_because:
          difficulty_instance: budget_cents_are_conserved_across_a_three_bucket_reservation_and_its_cancellation
          rationale: |
            Ledger-to-counter synchronisation is exactly the invariant of the §1.8
            compensating_invariant instance, which walks a three-bucket reservation, its
            cancellation, the mirroring RELEASE rows in ascending source sequence_no, and an
            identical re-draw afterwards.

      - name: sm_compensation_when_a_qualified_application_is_disqualified
        claim_type: Compensation
        grounds:
          - state_machines.Application["QUALIFIED -> DISQUALIFIED"].side_effects
        excluded_because:
          difficulty_instance: attribution_basis_points_stay_conserved_when_a_qualified_application_is_disqualified
          rationale: |
            The compensating branch that strips attribution credit while leaving paused flights
            paused is the first §1.8 compensating_invariant instance; it already asserts the global
            identity sum(Channel.credited_qualified_bp) == 10000 * count(QUALIFIED applications)
            before and after the compensation.

  # =========================================================================
  # Section 3 - calculations  (11 calculations, 2 of them dual-variant)
  # =========================================================================
  - section: calculations
    instances:
      - name: review_response_deadline_selects_the_right_sla_band_for_each_rating
        claim_type: Correct Result
        grounds:
          - calculations.review_response_deadline
          - entities.EmployerReview.fields.response_due_at
        distinguishing_aspect: |
          The band predicate is rating <= 2 -> 24h, rating == 3 -> 72h, else 168h, so rating 2 and
          rating 3 differ by three days from the same posted_at. An implementation that reads the
          low band as rating == 1 puts the 2-star review three days too late.
        test_recipe:
          setup:
            - "One Program; three reviews posted at the same instant 2026-07-30T06:00:00Z with ratings 2, 3 and 4."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
          trigger:
            - call: "POST /employer-reviews"
              payload: { program_id: "${program_id}", platform: "GLASSDOOR", external_ref: "gd-r2", rating: 2, posted_at: "2026-07-30T06:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { r2_id: $.data.id }
            - call: "POST /employer-reviews"
              payload: { program_id: "${program_id}", platform: "GLASSDOOR", external_ref: "gd-r3", rating: 3, posted_at: "2026-07-30T06:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { r3_id: $.data.id }
            - call: "POST /employer-reviews"
              payload: { program_id: "${program_id}", platform: "GLASSDOOR", external_ref: "gd-r4", rating: 4, posted_at: "2026-07-30T06:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { r4_id: $.data.id }
          assert:
            - "EmployerReview.${r2_id}.response_due_at == 2026-07-31T06:00:00.000Z (24 hours)"
            - "EmployerReview.${r3_id}.response_due_at == 2026-08-02T06:00:00.000Z (72 hours)"
            - "EmployerReview.${r4_id}.response_due_at == 2026-08-06T06:00:00.000Z (168 hours)"
            - "All three rows open with state NEW and sla_status PENDING"

      - name: brand_health_window_excludes_a_review_posted_exactly_ninety_days_ago
        claim_type: Input Set Filtering
        grounds:
          - calculations.program_brand_health_score.input_set
          - calculations.program_brand_health_score.constants.HEALTH_WINDOW_DAYS
        distinguishing_aspect: |
          The 90-day window is half-open on the left, so a review posted at exactly
          now - 90 days contributes nothing while one posted a single day later contributes at the
          0.25 recency weight. With the clock at 2026-08-01T00:00:00Z the correct score is 93.75;
          an inclusive lower bound would give 92.50.
        test_recipe:
          setup:
            - "One Program; the logical clock stays at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
          trigger:
            - call: "POST /employer-reviews"
              payload: { program_id: "${program_id}", platform: "GLASSDOOR", external_ref: "gd-in", rating: 1, posted_at: "2026-07-31T00:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /employer-reviews"
              payload: { program_id: "${program_id}", platform: "INDEED", external_ref: "in-edge", rating: 1, posted_at: "2026-05-03T00:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /employer-reviews"
              payload: { program_id: "${program_id}", platform: "COMPARABLY", external_ref: "cp-inside", rating: 1, posted_at: "2026-05-04T00:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
          assert:
            - "The 2026-07-31 review is 1 day old, weight 1.00, penalty max(0, 3-1) * 2.5 * 1.00 == 5.000"
            - "The 2026-05-03 review is exactly 90 days old and is OUTSIDE the half-open window - it contributes 0.000"
            - "The 2026-05-04 review is 89 days old, weight 0.25, penalty 2 * 2.5 * 0.25 == 1.250"
            - "Program.${program_id}.brand_health_score == 93.75 after the third create (100 - 5.000 - 1.250)"
            - "A wrong inclusive lower bound would yield 92.50, which must fail"

      - name: brand_health_recency_weights_switch_at_thirty_and_sixty_days
        claim_type: Constants Applied
        grounds:
          - calculations.program_brand_health_score
          - calculations.program_brand_health_score.constants.RATING_PENALTY_PER_STAR
        distinguishing_aspect: |
          age_days uses floor of whole days and the weight bands are <= 30 -> 1.00, <= 60 -> 0.50,
          else 0.25, so reviews at exactly 30 and exactly 60 days sit in the HIGHER band. Three
          identical 1-star reviews at ages 30, 60 and 61 therefore contribute 5.000 + 2.500 + 1.250
          == 8.750 and the score is 91.25, not 90.00 and not 92.50.
        test_recipe:
          setup:
            - "One Program; clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
          trigger:
            - call: "POST /employer-reviews"
              payload: { program_id: "${program_id}", platform: "GLASSDOOR", external_ref: "gd-a30", rating: 1, posted_at: "2026-07-02T00:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /employer-reviews"
              payload: { program_id: "${program_id}", platform: "GLASSDOOR", external_ref: "gd-a60", rating: 1, posted_at: "2026-06-02T00:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /employer-reviews"
              payload: { program_id: "${program_id}", platform: "GLASSDOOR", external_ref: "gd-a61", rating: 1, posted_at: "2026-06-01T00:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
          assert:
            - "The age-30 review takes weight 1.00 (band boundary belongs to the newer band) -> 5.000"
            - "The age-60 review takes weight 0.50 -> 2.500"
            - "The age-61 review takes weight 0.25 -> 1.250"
            - "Program.${program_id}.brand_health_score == 91.25 and no BREACHED SLA penalty is applied because no review has been responded to"

      - name: brand_health_rounds_half_up_to_two_decimals_at_the_end
        claim_type: Precision
        grounds:
          - calculations.program_brand_health_score.precision
          - entities.Program.fields.brand_health_score
        distinguishing_aspect: |
          A single 2-star review at the 0.25 weight produces the exact penalty 0.625 and the exact
          score 99.375, which must be published as 99.38 - round_half_up applied once at the end.
          Truncation gives 99.37 and banker's rounding gives 99.38 only by luck; rounding each
          intermediate term first gives 99.50.
        test_recipe:
          setup:
            - "One Program; clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
          trigger:
            - call: "POST /employer-reviews"
              payload: { program_id: "${program_id}", platform: "INDEED", external_ref: "in-frac", rating: 2, posted_at: "2026-06-01T00:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { review_id: $.data.id }
            - call: "GET /programs/${program_id}"
              as: BrandProgramLead
          assert:
            - "The review is 61 days old, weight 0.25, penalty max(0, 3-2) * 2.5 * 0.25 == 0.625"
            - "data.brand_health_score == 99.38 exactly (two decimal places), not 99.37 and not 99.375"
            - "The score is still comfortably above FLIGHT_ACTIVATION_MIN_HEALTH 55.00, so flight activation is not gated"

      - name: waterfall_rejects_and_persists_nothing_when_the_last_bucket_cannot_close_the_gap
        claim_type: waterfall_allocation
        grounds:
          - calculations.media_budget_waterfall
          - validations[priority=48].ERR_MEDIA_BUDGET_EXHAUSTED
          - state_machines.MediaFlight["None -> RESERVED"].preconditions
        distinguishing_aspect: |
          Funding is all-or-nothing: a flight costing 257500 cents against a 100000-cent job-board
          pool with no dedicated and no flex money must be rejected outright, leaving no MediaFlight
          row, no partial RESERVE ledger entry and an unchanged Program.version. A partial-draw
          implementation would leave 100000 committed.
        test_recipe:
          setup:
            - "A program with pool_job_board_cents 100000 and every other bucket at 0, a family with no dedicated budget, a JOB_BOARD channel with daily_capacity_cents 100000, and a DRAFT posting."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, pool_job_board_cents: 100000 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Board A", channel_type: "JOB_BOARD", daily_capacity_cents: 100000 }
              as: BrandProgramLead
              captures: { ch1_id: $.data.id }
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id }
            - call: "GET /programs/${program_id}"
              as: MediaBuyer
              captures: { prog_v: $.data.version }
          trigger:
            - call: "POST /media-flights"
              payload: { channel_id: "${ch1_id}", job_family_id: "${family_id}", job_posting_id: "${posting_id}", start_date: "2026-08-05", end_date: "2026-08-10", daily_cap_cents: 50000, expected_program_version: "${prog_v}" }
              as: MediaBuyer
              captures: { error_id: $.data.error_id }
          assert:
            - "base_gross_cents would be 50000 * 5 == 250000 -> TIER_1 -> discount 0 -> fee round_half_up(250000 * 0.03) == 7500 -> total_cost_cents 257500"
            - "HTTP 409 with data.error_id == ERR_MEDIA_BUDGET_EXHAUSTED"
            - "GET /media-flights?channel_id=${ch1_id} returns an empty list - nothing was persisted"
            - "GET /budget-ledger-entries?program_id=${program_id} returns an empty list"
            - "GET /programs/${program_id} still reports version ${prog_v}, committed_budget_cents 0 and JobFamily.${family_id}.reserved_cents 0"

      - name: engagement_weighted_mix_applies_the_thirty_day_decay_steps_and_its_ten_percent_floor
        claim_type: decay_function
        grounds:
          - calculations.persona_channel_mix
          - calculations.persona_channel_mix.constants.DECAY_STEP_DAYS
          - calculations.persona_channel_mix.constants.DECAY_FLOOR_PCT
        distinguishing_aspect: |
          The decay is a step function on floor(age_days / 30), so ages 0, 60 and 300 days give
          100 %, 80 % and the 10 % floor (the raw formula would give 0 % or a negative weight at 300
          days). With three equal-engagement signals of preference_score 50 the scores are 5000,
          4000 and 500 and the floor-then-largest-remainder split is 5263 / 4211 / 526 - the single
          leftover basis point goes to channel B, whose fractional part 0.5263 is the largest.
        test_recipe:
          setup:
            - "One Program, one JobFamily, three channels A, B and C created in that order, one ENGAGEMENT_WEIGHTED persona with research_window_days 365; clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "AAA Board", channel_type: "JOB_BOARD", daily_capacity_cents: 100000 }
              as: BrandProgramLead
              captures: { ch_a: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "BBB Social", channel_type: "SOCIAL", daily_capacity_cents: 100000 }
              as: BrandProgramLead
              captures: { ch_b: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "CCC Programmatic", channel_type: "PROGRAMMATIC", daily_capacity_cents: 100000 }
              as: BrandProgramLead
              captures: { ch_c: $.data.id }
            - call: "POST /candidate-personas"
              payload: { job_family_id: "${family_id}", name: "Backend IC", mix_method: "ENGAGEMENT_WEIGHTED", research_window_days: 365 }
              as: PersonaResearcher
              as_user_id: "u-res-1"
              captures: { persona_id: $.data.id }
          trigger:
            - call: "POST /channel-preference-signals"
              payload: { persona_id: "${persona_id}", channel_id: "${ch_a}", preference_score: 50, sample_size: 100, engagement_events: 100, collected_at: "2026-08-01T00:00:00Z" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /channel-preference-signals"
              payload: { persona_id: "${persona_id}", channel_id: "${ch_b}", preference_score: 50, sample_size: 100, engagement_events: 100, collected_at: "2026-06-02T00:00:00Z" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /channel-preference-signals"
              payload: { persona_id: "${persona_id}", channel_id: "${ch_c}", preference_score: 50, sample_size: 100, engagement_events: 100, collected_at: "2025-10-05T00:00:00Z" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "GET /candidate-personas/${persona_id}"
              as: PersonaResearcher
              as_user_id: "u-res-1"
          assert:
            - "decay percentages are 100 for age 0, 80 for age 60 (floor(60/30) == 2 steps) and the DECAY_FLOOR_PCT 10 for age 300 (10 steps would give 0)"
            - "data.signal_count == 3 - the age-300 signal is inside the 365-day research window"
            - "data.channel_mix == [ { channel_id: ${ch_a}, share_bp: 5263 }, { channel_id: ${ch_b}, share_bp: 4211 }, { channel_id: ${ch_c}, share_bp: 526 } ] and the share_bp values sum to exactly 10000"
            - "data.mix_confidence_pct == 30 (floor(300 / 10)), which is below MIN_CONFIDENCE_TO_SUBMIT_PCT 40, so POST /candidate-personas/${persona_id}/submit would return ERR_INSUFFICIENT_RESEARCH_CONFIDENCE"

      - name: conversion_metrics_count_started_applications_in_the_denominator_only
        claim_type: aggregation
        grounds:
          - calculations.posting_conversion_metrics
          - endpoints["GET /job-postings/{postingId}/conversion"]
        distinguishing_aspect: |
          apply_start_count counts applications in ANY status while submitted_count counts the four
          post-submission statuses, so three starts with one submission give
          floor(10000 * 1 / 3) == 3333 basis points - and a later DISQUALIFIED decision does not
          lower submitted_count, because DISQUALIFIED is still a submitted application.
        test_recipe:
          setup:
            - "A PUBLISHED, CLEARED posting whose family has an APPROVED persona."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Board A", channel_type: "JOB_BOARD", daily_capacity_cents: 100000 }
              as: BrandProgramLead
              captures: { ch1_id: $.data.id }
            - call: "POST /candidate-personas"
              payload: { job_family_id: "${family_id}", name: "Backend IC", mix_method: "SURVEY_WEIGHTED", research_window_days: 180 }
              as: PersonaResearcher
              as_user_id: "u-res-1"
              captures: { persona_id: $.data.id }
            - call: "POST /channel-preference-signals"
              payload: { persona_id: "${persona_id}", channel_id: "${ch1_id}", preference_score: 70, sample_size: 400, engagement_events: 100, collected_at: "2026-07-20T00:00:00Z" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/submit"
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/review"
              payload: { decision: "APPROVE", review_note: "ok" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id, pv1: $.data.version }
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${pv1}" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings/${posting_id}/compliance-review"
              payload: { decision: "CLEAR", note: "clean" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
            - call: "POST /job-postings/${posting_id}/publish"
              as: BrandProgramLead
              as_user_id: "u-lead-1"
          trigger:
            - call: "POST /applications"
              payload: { job_posting_id: "${posting_id}", candidate_email: "a1@example.com" }
              as: Anonymous
              captures: { app1: $.data.id }
            - call: "POST /applications"
              payload: { job_posting_id: "${posting_id}", candidate_email: "a2@example.com" }
              as: Anonymous
              captures: { app2: $.data.id }
            - call: "POST /applications"
              payload: { job_posting_id: "${posting_id}", candidate_email: "a3@example.com" }
              as: Anonymous
              captures: { app3: $.data.id }
            - call: "POST /applications/${app1}/submit"
              as: Anonymous
            - call: "GET /job-postings/${posting_id}/conversion"
              as: MediaBuyer
            - call: "POST /applications/${app1}/screen"
              as: RecruitingOps
            - call: "POST /applications/${app1}/decide"
              payload: { outcome: "DISQUALIFIED", reason: "no eligible touch" }
              as: RecruitingOps
              as_user_id: "u-ops-1"
            - call: "GET /job-postings/${posting_id}/conversion"
              as: MediaBuyer
          assert:
            - "The first conversion read returns apply_start_count 3, submitted_count 1, qualified_count 0 and conversion_rate_bp 3333 (floor, not 3334)"
            - "The second conversion read still returns submitted_count 1 and conversion_rate_bp 3333 - a DISQUALIFIED application stays inside submitted_count"
            - "qualified_count stays 0 and no Channel counter moves, because the DISQUALIFIED branch assigns no attribution credit"
            - "A posting with no applications at all reports conversion_rate_bp null, never 0"

      - name: optimization_score_sums_five_weighted_components_with_their_own_bands
        claim_type: weighted_scoring
        grounds:
          - calculations.posting_optimization_score
          - state_machines.JobPosting["DRAFT -> OPTIMIZED"].side_effects
        distinguishing_aspect: |
          The title band is 25 only for 3-12 words, 10 up to 20 words and 0 beyond - so a 2-word
          title scores 10, not 0 and not 25. responsibility_count below 5 scores 4 per item rather
          than 0, and benefits are capped at 5 items. A 2-word title with 3 responsibilities, a
          valid pay range, an EEO statement and 7 benefits scores 10 + 12 + 15 + 15 + 25 == 77,
          while a 21-word title with 5 responsibilities and no benefits scores 0 + 20 + 15 + 15 + 0
          == 50 and stays below MIN_SCORE_TO_PUBLISH.
        test_recipe:
          setup:
            - "One Program and one JobFamily; two DRAFT postings with the shapes described above."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Backend Engineer", responsibility_count: 3, benefit_count: 7, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { short_id: $.data.id, short_v: $.data.version }
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Extremely Senior Distinguished Principal Staff Backend Platform Reliability Infrastructure Engineer For Global Talent Systems And Data Services Group Team", responsibility_count: 5, benefit_count: 0, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { long_id: $.data.id, long_v: $.data.version }
          trigger:
            - call: "POST /job-postings/${short_id}/optimize"
              payload: { expected_posting_version: "${short_v}" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings/${long_id}/optimize"
              payload: { expected_posting_version: "${long_v}" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
          assert:
            - "JobPosting.${short_id}.title_word_count == 2 and optimization_score == 77 (10 + 12 + 15 + 15 + 25, benefits capped at 5 items)"
            - "JobPosting.${long_id}.title_word_count == 21 and optimization_score == 50 (0 + 20 + 15 + 15 + 0)"
            - "Both postings move to content_status OPTIMIZED with optimized_by_user_id u-lead-1 and version 2"
            - "Publishing ${long_id} after a compliance clearance would return ERR_OPTIMIZATION_SCORE_TOO_LOW because 50 < 70"

      - name: calc_threshold_band_of_the_pacing_verdict
        claim_type: threshold
        grounds:
          - calculations.channel_cpqa
        excluded_because:
          difficulty_instance: cpqa_exactly_at_pacing_threshold_stays_on_target_one_cent_over_throttles
          rationale: |
            The only threshold with a strict comparison is the pacing verdict, and the §1.8
            boundary_precision_check instance already pins both sides of it (18000 stays ON_TARGET,
            18001 throttles) on the spend endpoint, including the round_half_up of the threshold
            itself.

      - name: calc_tiered_pricing_of_the_flight_cost_ladder
        claim_type: tiered_pricing
        grounds:
          - calculations.flight_gross_cost
        excluded_because:
          difficulty_instance: flight_pricing_pins_tier_from_base_gross_and_fee_on_net_mode_c
          rationale: |
            Tier selection, the floored volume discount and the fee-on-net rule are the whole
            subject of the §1.8 combinatorial_formula instance, which pins the tier from
            base_gross_cents and rejects both re-deriving it from the net amount and charging the
            fee on gross.

      - name: calc_chronological_ordering_of_the_attribution_touch_set
        claim_type: chronological
        grounds:
          - calculations.application_touch_credit
        excluded_because:
          difficulty_instance: attribution_linear_vs_position_based_on_identical_touch_set
          rationale: |
            Chronological ordering only matters because POSITION_BASED weights depend on which touch
            is first and which is last; the §1.8 dual_variant_calc instance runs both variants over
            the same chronologically ordered touch set and so already covers the ordering claim.

      - name: calc_variant_divergence_of_the_two_attribution_models
        claim_type: Variant Divergence
        grounds:
          - calculations.application_touch_credit
          - entities.Program.fields.attribution_model
        excluded_because:
          difficulty_instance: attribution_linear_vs_position_based_on_identical_touch_set
          rationale: |
            Divergence between LINEAR (3334/3333/3333) and POSITION_BASED (4000/2000/4000) on an
            identical three-touch set is asserted directly by the §1.8 dual_variant_calc instance.

      - name: calc_variant_selection_by_the_persona_mix_method
        claim_type: Variant Selection
        grounds:
          - calculations.persona_channel_mix
          - entities.CandidatePersona.fields.mix_method
        excluded_because:
          difficulty_instance: persona_mix_survey_weighted_vs_engagement_weighted_on_identical_signals
          rationale: |
            Selection of the weighting variant by CandidatePersona.mix_method - sample_size versus
            decayed engagement_events over the very same signal rows - is the second §1.8
            dual_variant_calc instance.

  # =========================================================================
  # Section 4 - validations  (50 ordered checks, one global priority ladder)
  # =========================================================================
  - section: validations
    instances:
      - name: clearing_a_posting_without_an_eeo_statement_returns_eeo_statement_missing
        claim_type: Violation → Error
        grounds:
          - validations[priority=23].ERR_EEO_STATEMENT_MISSING
          - state_machines.JobPosting["UNREVIEWED -> CLEARED"].preconditions
        distinguishing_aspect: |
          Equal-opportunity language is a hard advertising-compliance gate: a posting whose
          eeo_statement_included is false cannot be cleared, and the 409 must arrive before the
          optimization-score gate at priority 32 ever runs, so a low-scoring posting without an EEO
          statement still reports ERR_EEO_STATEMENT_MISSING.
        test_recipe:
          setup:
            - "One Program, one JobFamily, one OPTIMIZED posting with eeo_statement_included false."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: false, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id, pv1: $.data.version }
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${pv1}" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
              captures: { pv2: $.data.version }
          trigger:
            - call: "POST /job-postings/${posting_id}/compliance-review"
              payload: { decision: "CLEAR", note: "looks fine to me" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_EEO_STATEMENT_MISSING"
            - "JobPosting.${posting_id}.compliance_status is still UNREVIEWED, cleared_by_user_id is null and version is still ${pv2}"
            - "optimization_score is 85 (25 + 20 + 15 + 0 + 25) - the score gate would have passed, proving the EEO check fired first"
            - "A subsequent publish returns ERR_POSTING_COMPLIANCE_NOT_CLEARED (priority 25), not ERR_EEO_STATEMENT_MISSING"

      - name: superlative_claim_needs_a_substantiation_url_before_it_can_be_cleared
        claim_type: Conditional validation
        grounds:
          - validations[priority=24].ERR_UNSUBSTANTIATED_CLAIM
          - entities.JobPosting.fields.superlative_claim_included
          - entities.JobPosting.fields.substantiation_url
        distinguishing_aspect: |
          The check is conditional on superlative_claim_included: it is inert when the flag is false
          and demands a non-null substantiation_url when it is true. Supplying the URL through a
          second optimize call must flip the same posting from ERR_UNSUBSTANTIATED_CLAIM to a clean
          clearance, and the EEO check at priority 23 must not mask it.
        test_recipe:
          setup:
            - "One OPTIMIZED posting with eeo_statement_included true, superlative_claim_included true and no substantiation_url."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Best Backend Team On Earth Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: true }
              as: BrandProgramLead
              captures: { posting_id: $.data.id, pv1: $.data.version }
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${pv1}" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
              captures: { pv2: $.data.version }
          trigger:
            - call: "POST /job-postings/${posting_id}/compliance-review"
              payload: { decision: "CLEAR", note: "first look" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
              captures: { error_id: $.data.error_id }
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${pv2}", substantiation_url: "https://example.com/awards/2026" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
              captures: { pv3: $.data.version }
            - call: "POST /job-postings/${posting_id}/compliance-review"
              payload: { decision: "CLEAR", note: "award page checked" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
          assert:
            - "Trigger call 1 returns 409 with data.error_id == ERR_UNSUBSTANTIATED_CLAIM and compliance_status stays UNREVIEWED"
            - "Trigger call 2 returns 200, stores substantiation_url and keeps content_status OPTIMIZED (the OPTIMIZED -> OPTIMIZED self transition), with version ${pv3} == ${pv2} + 1"
            - "Trigger call 3 returns 200 with compliance_status CLEARED and cleared_by_user_id u-comp-1"
            - "A posting with superlative_claim_included false and no substantiation_url clears without ever consulting this rule"

      - name: channel_daily_capacity_is_an_aggregate_over_every_overlapping_flight
        claim_type: Aggregate validation
        grounds:
          - validations[priority=47].ERR_CHANNEL_DAILY_CAPACITY_EXCEEDED
          - state_machines.MediaFlight["None -> RESERVED"].preconditions
        distinguishing_aspect: |
          The capacity check sums daily_cap_cents across every non-released flight on the channel
          whose half-open window intersects the new one, regardless of job family - so 60000 plus
          50000 against a 100000-cent channel is rejected while 60000 plus 40000 is accepted at
          exactly the cap. Because the two flights belong to different families, the
          window-overlap rule at priority 40 stays silent and the aggregate rule is the one that
          speaks.
        test_recipe:
          setup:
            - "A program with pool_job_board_cents 1000000, two families A and B, one JOB_BOARD channel with daily_capacity_cents 100000, one DRAFT posting, and one existing flight of family A with daily_cap_cents 60000 over 2026-08-05 to 2026-08-10."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, pool_job_board_cents: 1000000 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { fam_a: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Enterprise Sales", code: "SALES", cpqa_target_cents: 22000, priority_rank: 2 }
              as: BrandProgramLead
              captures: { fam_b: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Board A", channel_type: "JOB_BOARD", daily_capacity_cents: 100000 }
              as: BrandProgramLead
              captures: { ch1_id: $.data.id }
            - call: "POST /job-postings"
              payload: { job_family_id: "${fam_a}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id }
            - call: "GET /programs/${program_id}"
              as: MediaBuyer
              captures: { pv_a: $.data.version }
            - call: "POST /media-flights"
              payload: { channel_id: "${ch1_id}", job_family_id: "${fam_a}", job_posting_id: "${posting_id}", start_date: "2026-08-05", end_date: "2026-08-10", daily_cap_cents: 60000, expected_program_version: "${pv_a}" }
              as: MediaBuyer
              captures: { flight_a: $.data.id }
          trigger:
            - call: "GET /programs/${program_id}"
              as: MediaBuyer
              captures: { pv_b: $.data.version }
            - call: "POST /media-flights"
              payload: { channel_id: "${ch1_id}", job_family_id: "${fam_b}", job_posting_id: "${posting_id}", start_date: "2026-08-07", end_date: "2026-08-12", daily_cap_cents: 50000, expected_program_version: "${pv_b}" }
              as: MediaBuyer
              captures: { error_id: $.data.error_id }
            - call: "POST /media-flights"
              payload: { channel_id: "${ch1_id}", job_family_id: "${fam_b}", job_posting_id: "${posting_id}", start_date: "2026-08-07", end_date: "2026-08-12", daily_cap_cents: 40000, expected_program_version: "${pv_b}" }
              as: MediaBuyer
              captures: { flight_b: $.data.id }
          assert:
            - "Trigger call 2 returns 409 with data.error_id == ERR_CHANNEL_DAILY_CAPACITY_EXCEEDED because 50000 + 60000 > 100000 on the overlapping days 2026-08-07 to 2026-08-09"
            - "Trigger call 2 leaves Program.version at ${pv_b} - a rejected creation never bumps the optimistic-concurrency counter, which is why trigger call 3 may reuse ${pv_b}"
            - "Trigger call 3 returns 201 because 40000 + 60000 == 100000 is allowed at exactly the cap"
            - "MediaFlight.${flight_b}.total_cost_cents == 206000 (40000 * 5 == 200000, TIER_1, no discount, 3 % fee 6000) and Program.committed_budget_cents == 309000 + 206000 == 515000"
            - "No ERR_FLIGHT_WINDOW_OVERLAP is raised at any point - flight ${flight_a} belongs to family ${fam_a} and the overlap rule is scoped to channel_id plus job_family_id"

      - name: campaign_scheduling_and_dispatch_windows_are_inclusive_at_their_boundaries
        claim_type: Temporal validation
        grounds:
          - validations[priority=42].ERR_SCHEDULE_IN_PAST
          - validations[priority=43].ERR_DISPATCH_TOO_EARLY
          - state_machines.NurtureCampaign
        distinguishing_aspect: |
          Both time gates compare against the logical clock with an at-or-after semantics: a
          scheduled_for one second before the clock is rejected, a dispatch one second before
          scheduled_for is rejected, and a dispatch at exactly scheduled_for is accepted. The two
          errors also sit on different priorities, so a DRAFT campaign dispatched too early reports
          the state error at priority 19 instead.
        test_recipe:
          setup:
            - "A program with send_quota_total 10, one SUBSCRIBED member, one DRAFT campaign with max_sends 5; the clock starts at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, send_quota_total: 10 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /talent-community-members"
              payload: { program_id: "${program_id}", email: "nurtured@example.com" }
              as: Anonymous
              captures: { member_id: $.data.id, token: $.data.consent_token }
            - call: "POST /talent-community-members/${member_id}/confirm-consent"
              payload: { consent_token: "${token}" }
              as: Anonymous
            - call: "POST /nurture-campaigns"
              payload: { program_id: "${program_id}", name: "August Warm-up", max_sends: 5 }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { campaign_id: $.data.id }
          trigger:
            - call: "POST /nurture-campaigns/${campaign_id}/dispatch"
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { error_id: $.data.error_id }
            - call: "POST /nurture-campaigns/${campaign_id}/schedule"
              payload: { scheduled_for: "2026-07-31T23:59:59Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /nurture-campaigns/${campaign_id}/schedule"
              payload: { scheduled_for: "2026-08-05T00:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /nurture-campaigns/${campaign_id}/dispatch"
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T23:59:59Z" }
              as: RecruitingOps
            - call: "POST /nurture-campaigns/${campaign_id}/dispatch"
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: RecruitingOps
            - call: "POST /nurture-campaigns/${campaign_id}/dispatch"
              as: CommunityManager
              as_user_id: "u-cm-1"
          assert:
            - "Trigger call 1 returns 409 with data.error_id == ERR_CAMPAIGN_NOT_SCHEDULED - the priority-19 state check precedes both time gates"
            - "Trigger call 2 returns 409 with data.error_id == ERR_SCHEDULE_IN_PAST (one second before the clock) and the campaign stays DRAFT"
            - "Trigger call 3 returns 200 with state SCHEDULED and scheduled_for 2026-08-05T00:00:00.000Z"
            - "Trigger calls 4 and 6 return 409 with data.error_id == ERR_DISPATCH_TOO_EARLY, the second of them exactly one second short"
            - "Trigger call 8 returns 200 with state DISPATCHED, sent_count 1, audience_size 1 and Program.send_quota_used == 1 - the clock exactly at scheduled_for is allowed"

      - name: flight_activation_passes_at_a_brand_health_score_of_exactly_fifty_five
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=27].ERR_BRAND_HEALTH_GATE
          - calculations.program_brand_health_score.constants.FLIGHT_ACTIVATION_MIN_HEALTH
          - state_machines.MediaFlight["RESERVED -> ACTIVE"].preconditions
        distinguishing_aspect: |
          The gate is a >= comparison against 55.00, so nine 1-star reviews at full recency weight
          (penalty 9 * 5.000 == 45.000, score exactly 55.00) still allow activation, while a tenth
          identical review drops the score to 50.00 and blocks the next activation. An
          implementation using a strict > comparison fails the first activation.
        test_recipe:
          setup:
            - "The standard publish chain (approved persona, OPTIMIZED, CLEARED, PUBLISHED posting) plus a program with pool_job_board_cents 1000000 and two non-overlapping RESERVED flights on one JOB_BOARD channel."
            - "Nine 1-star GLASSDOOR reviews posted at 2026-07-31T00:00:00Z with external_ref gd-01 through gd-09; the clock stays at 2026-08-01T00:00:00Z so every review is 1 day old and carries recency weight 1.00."
