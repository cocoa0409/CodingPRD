  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_window_overlap
        grounds:
          - validations[priority=9]
          - entities.RouteAssignment.fields.window_start_at
          - errors[ERR_VEHICLE_DOUBLE_BOOKED]
        distinguishing_aspect: |
          A second assignment for the SAME vehicle whose half-open [window_start,window_end) overlaps an
          existing {PLANNED,IN_PROGRESS} assignment (01:00-05:00 vs 03:00-07:00) is rejected
          ERR_VEHICLE_DOUBLE_BOOKED; adjacency (end==start) would be allowed. Plain half-open interval
          semantics on the Vehicle resource.
        test_recipe:
          setup:
            - "One COMBO vehicle; operator on-call; two routes; an existing PLANNED assignment on route1 for the vehicle over 01:00-05:00; storm version captured after that create."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Yard", salt_tons_on_hand: 100, brine_gallons_on_hand: 1000 }
              as: YardManager
