        grounds:
          - state_machines.Policy.ACTIVE_to_LAPSED
          - state_machines.Policy.PENDING_PAYMENT_to_ACTIVE
          - entities.Account.fields.monthly_premium_cents
        distinguishing_aspect: |
          Different conserved quantity Account.monthly_premium_cents: lapsing P2 then activating a fresh
          identical P3 must return the account premium to its pre-lapse value 8970 (no drift in the multi-pet price).
        test_recipe:
          setup:
            - "Account with two ACTIVE policies P1 (4500 rider) + P2 (3800 no rider); premium 8970."
          setup_api_calls:
            - call: "POST /accounts"
