            - call: "POST /collections/associations"
              payload: { name: "Vale HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Mira Ng" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 200000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/accounts/${acct_id}/transition"
              payload: { to_status: "DELINQUENT" }
              as: CollectionsAgent
            - call: "POST /collections/notices"
              payload: { account_id: "${acct_id}", notice_type: "INTENT_TO_LIEN" }
              as: CollectionsAgent
              captures: { notice_id: $.data.id }
            - call: "POST /collections/notices/${notice_id}/transition"
              payload: { to_status: "SENT" }
              as: CollectionsAgent
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-30T00:00:00Z" }
              as: CollectionsAgent
          trigger:
            - call: "POST /collections/liens"
              payload: { account_id: "${acct_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "response data.error_id == ERR_VALIDATION_PERIOD_ACTIVE"

      - name: notice_cooldown_boundary_day30_allowed
        claim_type: Temporal validation
        grounds:
          - state_machines.Notice.DRAFT_to_SENT
          - validations[priority=11]
        distinguishing_aspect: "Half-open boundary: sending a second DEMAND at exactly sent_date+NOTICE_COOLDOWN_DAYS (2026-05-31, the excluded endpoint of [05-01,05-31)) succeeds — notice2 reaches SENT."
        test_recipe:
          setup: ["Account with DEMAND notice1 SENT 2026-05-01; DEMAND notice2 DRAFT; clock advanced to 2026-05-31."]
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Wisp HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Noe Ox" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/notices"
              payload: { account_id: "${acct_id}", notice_type: "DEMAND" }
              as: CollectionsAgent
              captures: { notice1_id: $.data.id }
            - call: "POST /collections/notices/${notice1_id}/transition"
              payload: { to_status: "SENT" }
              as: CollectionsAgent
            - call: "POST /collections/notices"
              payload: { account_id: "${acct_id}", notice_type: "DEMAND" }
              as: CollectionsAgent
              captures: { notice2_id: $.data.id }
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-31T00:00:00Z" }
              as: CollectionsAgent
          trigger:
            - call: "POST /collections/notices/${notice2_id}/transition"
              payload: { to_status: "SENT" }
              as: CollectionsAgent
              captures: { st: $.data.status, sd: $.data.sent_date }
          assert:
            - "trigger response data.status == SENT"
            - "trigger response data.sent_date == 2026-05-31T00:00:00Z"

      - name: plan_adjacency_touching_endpoint_allowed
        claim_type: Aggregate validation
        grounds:
          - validations[priority=11]
          - entities.PaymentPlan.fields.final_due_date
          - concurrency_rules[plan-create-stale-account]
        distinguishing_aspect: "Adjacent (touching) plan intervals do not strictly overlap: plan2 first_due 2026-07-31 == plan1.final_due_date is accepted (DRAFT created), unlike the strict-overlap case."
        test_recipe:
          setup: ["Account DELINQUENT (REGULAR 90000 due 2026-01-01). Plan1 first_due 2026-06-01 num 3 (final 2026-07-31) DRAFT. Plan2 first_due 2026-07-31 num 1."]
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Zeph HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Ola Pym" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 90000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/accounts/${acct_id}/transition"
              payload: { to_status: "DELINQUENT" }
              as: CollectionsAgent
            - call: "GET /collections/accounts/${acct_id}"
              as: CollectionsAgent
              captures: { acct_v1: $.data.version }
            - call: "POST /collections/payment-plans"
              payload: { account_id: "${acct_id}", total_amount_cents: 60000, installment_cents: 20000, num_installments: 3, first_due_date: "2026-06-01T00:00:00Z", expected_account_version: "${acct_v1}" }
              as: CollectionsAgent
              captures: { plan1_id: $.data.id }
            - call: "GET /collections/accounts/${acct_id}"
              as: CollectionsAgent
              captures: { acct_v2: $.data.version }
          trigger:
            - call: "POST /collections/payment-plans"
              payload: { account_id: "${acct_id}", total_amount_cents: 30000, installment_cents: 30000, num_installments: 1, first_due_date: "2026-07-31T00:00:00Z", expected_account_version: "${acct_v2}" }
              as: CollectionsAgent
              captures: { plan2_id: $.data.id, st: $.data.status }
          assert:
            - "trigger response HTTP status == 201"
            - "trigger response data.status == DRAFT"

      - name: remittance_period_end_before_start_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=14]
          - errors[ERR_PERIOD_INVALID]
        distinguishing_aspect: "Creating a Remittance with period_end earlier than period_start returns ERR_PERIOD_INVALID (422)."
        test_recipe:
          setup: ["An Association exists; capture its version."]
          setup_api_calls:
            - call: "POST /collections/associations"
              payload: { name: "Quay HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id, assoc_v: $.data.version }
          trigger:
            - call: "POST /collections/remittances"
              payload: { association_id: "${assoc_id}", period_start: "2026-06-30T00:00:00Z", period_end: "2026-06-01T00:00:00Z", basis: "CASH", expected_association_version: "${assoc_v}" }
              as: TrustAccountant
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 422"
            - "response data.error_id == ERR_PERIOD_INVALID"

      - name: remittance_remit_exceeds_trust_rejected
        claim_type: Cross-entity validation
        grounds:
          - state_machines.Remittance.PENDING_to_REMITTED
          - errors[ERR_INVALID_AMOUNT]
        distinguishing_aspect: "A CASH remittance whose gross (80000, counting a later-reversed payment) exceeds the current trust_balance (50000) cannot be REMITTED — returns ERR_INVALID_AMOUNT (422)."
        test_recipe:
          setup: ["Association with p1 50000 (POSTED) and p2 30000 (reversed) received in June; trust 50000. CASH remittance gross 80000 PENDING."]
          setup_api_calls:
            - call: "POST /collections/associations"
              payload: { name: "Reef HOA", state_code: "CA", management_fee_pct: 20.0 }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Pia Qi" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/payments"
              payload: { account_id: "${acct_id}", amount_cents: 50000, received_date: "2026-06-05T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/payments"
              payload: { account_id: "${acct_id}", amount_cents: 30000, received_date: "2026-06-20T00:00:00Z" }
              as: CollectionsAgent
              captures: { p2_id: $.data.id }
            - call: "POST /collections/payments/${p2_id}/reverse"
              payload: { reversal_reason: "NSF" }
              as: CollectionsAgent
            - call: "GET /collections/associations/${assoc_id}"
              as: TrustAccountant
              captures: { assoc_v: $.data.version }
            - call: "POST /collections/remittances"
              payload: { association_id: "${assoc_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", basis: "CASH", expected_association_version: "${assoc_v}" }
              as: TrustAccountant
              captures: { rem_id: $.data.id }
          trigger:
            - call: "POST /collections/remittances/${rem_id}/transition"
              payload: { to_status: "REMITTED" }
              as: TrustAccountant
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 422"
            - "response data.error_id == ERR_INVALID_AMOUNT"

      - name: remittance_remit_decreases_trust
        claim_type: Cross-entity validation
        grounds:
          - state_machines.Remittance.PENDING_to_REMITTED
          - calculations.trust_balance
        distinguishing_aspect: "A NET remittance gross 50000 (fee 10000, net 40000) that is REMITTED decreases Association.trust_balance_cents from 50000 to 0."
        test_recipe:
          setup: ["Association with one Account and a single POSTED payment 50000 received 2026-06-05; trust 50000. NET remittance PENDING."]
          setup_api_calls:
            - call: "POST /collections/associations"
              payload: { name: "Silt HOA", state_code: "CA", management_fee_pct: 20.0 }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Rex So" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/payments"
              payload: { account_id: "${acct_id}", amount_cents: 50000, received_date: "2026-06-05T00:00:00Z" }
              as: CollectionsAgent
            - call: "GET /collections/associations/${assoc_id}"
              as: TrustAccountant
              captures: { assoc_v: $.data.version }
            - call: "POST /collections/remittances"
              payload: { association_id: "${assoc_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", basis: "NET", expected_association_version: "${assoc_v}" }
              as: TrustAccountant
              captures: { rem_id: $.data.id, gross: $.data.gross_amount_cents, net: $.data.net_amount_cents }
          trigger:
            - call: "POST /collections/remittances/${rem_id}/transition"
              payload: { to_status: "REMITTED" }
              as: TrustAccountant
              captures: { st: $.data.status }
          assert:
            - "remittance data.gross_amount_cents == 50000"
            - "remittance data.net_amount_cents == 40000"
            - "trigger response data.status == REMITTED"
            - "GET /collections/associations/${assoc_id} data.trust_balance_cents == 0"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: create_account_missing_role_returns_unauthenticated
        claim_type: RBAC denial
        grounds:
          - roles
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request to POST /collections/accounts with no valid X-User-Role header returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["An Association exists."]
          setup_api_calls:
            - call: "POST /collections/associations"
              payload: { name: "Tarn HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
          trigger:
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Sia Tu" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 401"
            - "response data.error_id == ERR_UNAUTHENTICATED"

      - name: trust_accountant_cannot_record_lien_unauthorized
        claim_type: RBAC denial
        grounds:
          - roles
          - endpoints["POST /collections/liens"]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "POST /collections/liens is exclusive to ComplianceOfficer; a TrustAccountant attempt returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["An Account exists (state irrelevant — authz precedes business checks)."]
          setup_api_calls:
            - call: "POST /collections/associations"
              payload: { name: "Urn HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Tad Uz" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /collections/liens"
              payload: { account_id: "${acct_id}" }
              as: TrustAccountant
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 403"
            - "response data.error_id == ERR_UNAUTHORIZED"

      - name: same_officer_lien_and_referral_sod_denied
        claim_type: Segregation of duties
        grounds:
          - validations[priority=3]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "The ComplianceOfficer who recorded the lien (officer-1) cannot also refer its foreclosure — same X-User-ID returns ERR_SEGREGATION_OF_DUTIES (403)."
        test_recipe:
          setup: ["Account with a RECORDED lien recorded by officer-1 (delinquent, notice sent+elapsed, balance 200000)."]
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Vane HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Uri Vo" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 200000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/accounts/${acct_id}/transition"
              payload: { to_status: "DELINQUENT" }
              as: CollectionsAgent
            - call: "POST /collections/notices"
              payload: { account_id: "${acct_id}", notice_type: "INTENT_TO_LIEN" }
              as: CollectionsAgent
              captures: { notice_id: $.data.id }
            - call: "POST /collections/notices/${notice_id}/transition"
              payload: { to_status: "SENT" }
              as: CollectionsAgent
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/liens"
              payload: { account_id: "${acct_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { lien_id: $.data.id }
          trigger:
            - call: "POST /collections/foreclosure-referrals"
              payload: { account_id: "${acct_id}", lien_id: "${lien_id}", attorney_name: "Firm B" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 403"
            - "response data.error_id == ERR_SEGREGATION_OF_DUTIES"

      - name: association_manager_cross_scope_unauthorized
        claim_type: RBAC denial
        grounds:
          - roles
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "AssociationManager (entity_backed:Association) reading an account belonging to a different association than X-User-ID returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Association A1 with account acct1; Association A2 (different). Manager acts as A2."]
          setup_api_calls:
            - call: "POST /collections/associations"
              payload: { name: "A-One HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc1_id: $.data.id }
            - call: "POST /collections/associations"
              payload: { name: "A-Two HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc2_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc1_id}", unit_number: "1", owner_name: "Val Wu" }
              as: CollectionsAgent
              captures: { acct1_id: $.data.id }
          trigger:
            - call: "GET /collections/accounts/${acct1_id}"
              as: AssociationManager
              as_user_id: "${assoc2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 403"
            - "response data.error_id == ERR_UNAUTHORIZED"

      - name: automatic_stay_blocks_notice_send
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=7]
          - errors[ERR_AUTOMATIC_STAY]
        distinguishing_aspect: "While Account.status == BANKRUPTCY, sending a new notice (DRAFT->SENT) is blocked by the automatic stay -> ERR_AUTOMATIC_STAY (403)."
        test_recipe:
          setup: ["Account DELINQUENT then BANKRUPTCY (case filed). A DRAFT DEMAND notice exists; attempt to SEND it."]
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Wold HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Wes Xi" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 100000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/accounts/${acct_id}/transition"
              payload: { to_status: "DELINQUENT" }
              as: CollectionsAgent
            - call: "POST /collections/notices"
              payload: { account_id: "${acct_id}", notice_type: "DEMAND" }
              as: CollectionsAgent
              captures: { notice_id: $.data.id }
            - call: "POST /collections/bankruptcy-cases"
              payload: { account_id: "${acct_id}", chapter: "CH13", case_number: "26-77", filed_date: "2026-05-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
          trigger:
            - call: "POST /collections/notices/${notice_id}/transition"
              payload: { to_status: "SENT" }
              as: CollectionsAgent
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 403"
            - "response data.error_id == ERR_AUTOMATIC_STAY"

  # ---------------------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: occ_plan_create_stale_account_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-create-stale-account]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "A plan create carrying the account version observed at creation (1) after an intervening mark-DELINQUENT bumped it is stale -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Account created (version 1 captured), assessment posted, then marked DELINQUENT (version advances). Plan create still carries version 1."]
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Xyl HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Xia Yo" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 60000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/accounts/${acct_id}/transition"
              payload: { to_status: "DELINQUENT" }
              as: CollectionsAgent
          trigger:
            - call: "POST /collections/payment-plans"
              payload: { account_id: "${acct_id}", total_amount_cents: 60000, installment_cents: 20000, num_installments: 3, first_due_date: "2026-06-01T00:00:00Z", expected_account_version: "${acct_v0}" }
              as: CollectionsAgent
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 412"
            - "response data.error_id == ERR_STALE_VERSION"

      - name: occ_remittance_create_stale_association_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[remittance-create-stale-association]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "A second remittance create reusing the association version observed before the first create (1) is stale after the first create bumped it -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Association created (version 1 captured). One remittance created with version 1 (bumps to 2). Second create still carries version 1."]
          setup_api_calls:
            - call: "POST /collections/associations"
              payload: { name: "Yarn HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id, assoc_v0: $.data.version }
            - call: "POST /collections/remittances"
              payload: { association_id: "${assoc_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", basis: "CASH", expected_association_version: "${assoc_v0}" }
              as: TrustAccountant
              captures: { rem1_id: $.data.id }
          trigger:
            - call: "POST /collections/remittances"
              payload: { association_id: "${assoc_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-31T00:00:00Z", basis: "CASH", expected_association_version: "${assoc_v0}" }
              as: TrustAccountant
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 412"
            - "response data.error_id == ERR_STALE_VERSION"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: accounts_list_pagination_and_filter
        claim_type: Listing
        grounds:
          - endpoints["GET /collections/accounts"]
          - entities.Account.fields.association_id
        distinguishing_aspect: "GET /collections/accounts?association_id=&limit=2 over three accounts returns 2 items with total_count 3 and has_more true (reverse-reachability + pagination for Account.association_id)."
        test_recipe:
          setup: ["One Association with three accounts."]
          setup_api_calls:
            - call: "POST /collections/associations"
              payload: { name: "Zed HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Ann A" }
              as: CollectionsAgent
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "2", owner_name: "Ben B" }
              as: CollectionsAgent
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "3", owner_name: "Cy C" }
              as: CollectionsAgent
          trigger:
            - call: "GET /collections/accounts"
              payload: { association_id: "${assoc_id}", limit: 2, offset: 0 }
              as: CollectionsAgent
          assert:
            - "response response_type == array"
            - "response data length == 2"
            - "response meta/pagination total_count == 3"
            - "response has_more == true"

      - name: assessments_reverse_reachable_by_account
        claim_type: Cross-reference link
        grounds:
          - endpoints["GET /collections/assessments"]
          - entities.Assessment.fields.account_id
        distinguishing_aspect: "GET /collections/assessments?account_id returns the account's assessments as an array (FK reverse-reachability for Assessment.account_id)."
        test_recipe:
          setup: ["Account with two assessments."]
          setup_api_calls:
            - call: "POST /collections/associations"
              payload: { name: "Ada HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Deb D" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 10000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "LATE_FEE", amount_cents: 2500, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
          trigger:
            - call: "GET /collections/assessments"
              payload: { account_id: "${acct_id}" }
              as: AssociationManager
              as_user_id: "${assoc_id}"
          assert:
            - "response response_type == array"
            - "response data length == 2"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_plan_overlap_covered
        claim_type: Violation → Error
        grounds:
          - errors[ERR_PLAN_OVERLAP]
        excluded_because:
          difficulty_instance: ov_plan_overlap_strict
          rationale: "ERR_PLAN_OVERLAP is asserted as the failure path of the named §1.8 instance."
      - name: error_notice_cooldown_covered
        claim_type: Violation → Error
        grounds:
          - errors[ERR_NOTICE_COOLDOWN]
        excluded_because:
          difficulty_instance: ov_notice_cooldown_halfopen
          rationale: "ERR_NOTICE_COOLDOWN is asserted as the failure path of the named §1.8 instance."
      - name: error_active_dispute_covered
        claim_type: Violation → Error
        grounds:
          - errors[ERR_ACTIVE_DISPUTE]
        excluded_because:
          difficulty_instance: pp_dispute_beats_demand
          rationale: "ERR_ACTIVE_DISPUTE is the winning error of the named §1.8 priority-pair instance."
      - name: error_demand_notice_required_covered
        claim_type: Violation → Error
        grounds:
          - errors[ERR_DEMAND_NOTICE_REQUIRED]
        excluded_because:
          difficulty_instance: ce_lien_requires_notice_sent
          rationale: "ERR_DEMAND_NOTICE_REQUIRED is asserted by the named §1.8 cross-entity instance."
      - name: error_lien_required_covered
        claim_type: Violation → Error
        grounds:
          - errors[ERR_LIEN_REQUIRED]
        excluded_because:
          difficulty_instance: ce_referral_requires_lien_recorded
          rationale: "ERR_LIEN_REQUIRED is asserted by the named §1.8 cross-entity instance."
      - name: error_plan_not_breachable_triggered
        claim_type: Violation → Error
        grounds:
          - errors[ERR_PLAN_NOT_BREACHABLE]
          - calculations.plan_breach_evaluation
        distinguishing_aspect: "Breaching an ACTIVE plan with missed_count 0 (no installment yet due) returns ERR_PLAN_NOT_BREACHABLE (409)."
        test_recipe:
          setup: ["Account DELINQUENT (REGULAR 60000 due 2026-01-01). Plan active, first_due 2026-06-01, clock 2026-05-01 (no installment due yet -> missed_count 0)."]
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Bir HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Eli E" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 60000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/accounts/${acct_id}/transition"
              payload: { to_status: "DELINQUENT" }
              as: CollectionsAgent
            - call: "GET /collections/accounts/${acct_id}"
              as: CollectionsAgent
              captures: { acct_v: $.data.version }
            - call: "POST /collections/payment-plans"
              payload: { account_id: "${acct_id}", total_amount_cents: 60000, installment_cents: 20000, num_installments: 3, first_due_date: "2026-06-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: CollectionsAgent
              captures: { plan_id: $.data.id }
            - call: "POST /collections/payment-plans/${plan_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CollectionsAgent
          trigger:
            - call: "POST /collections/payment-plans/${plan_id}/transition"
              payload: { to_status: "BREACHED" }
              as: CollectionsAgent
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "response data.error_id == ERR_PLAN_NOT_BREACHABLE"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_cascade_visible_in_same_response
        claim_type: immediate
        grounds:
          - state_machines.Account.DELINQUENT_to_LIEN
        excluded_because:
          difficulty_instance: bp_lien_minimum_exact_ge
          rationale: "The lien-record response already reflects Account->LIEN synchronously; asserted by the named §1.8 boundary instance."
