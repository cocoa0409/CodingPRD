        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/plans"
              payload: {}
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_UNAUTHENTICATED"

