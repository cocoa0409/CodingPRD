        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]", "validations[priority=12]", "entities.ReliefPlan.fields.recommender_user_id", "state_machines.ReliefPlan.transitions.OVERLAY_RECOMMENDED_to_ORDERED"]
        distinguishing_aspect: "The second segregation pair is a different field on a different entity: admin-1 stamped recommender_user_id at CLOSE_AND_RECOMMEND, so the ORDER is refused for admin-1 even though ORDER is a RegulatoryApprover action and every other precondition - window closed, non-colliding 380, effective_at well past the 90-day buffer - is satisfied."
