            - { call: "POST /phases/${ph_id}/start-install", as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /punch-tickets", payload: { installation_phase_id: "${ph_id}", severity: "MINOR", description: "Scuff" }, as: EndUserRep, as_user_id: "${euA}", captures: { pt_id: "$.data.id" } }
            - { call: "POST /punch-tickets/${pt_id}/resolve", payload: { resolution_note: "Polished" }, as: DealerRep, as_user_id: "${dlr_id}" }
          trigger:
            - { call: "POST /punch-tickets/${pt_id}/verify", payload: { outcome: "CONFIRMED" }, as: EndUserRep, as_user_id: "${euB}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_FORBIDDEN_OWNERSHIP and http status 403; ticket stays RESOLVED"

      - name: rbac_enduserrep_agreement_read_forbidden_for_others
        claim_type: ownership_scope
        grounds:
          - "validations[priority=4]"
          - "roles.EndUserRep"
          - "errors[ERR_FORBIDDEN_OWNERSHIP]"
        distinguishing_aspect: "GET /volume-agreements/{id} as the agreement's own end user returns 200; as a different end user, 403 ERR_FORBIDDEN_OWNERSHIP."
        test_recipe:
          setup: ["end users A and B; agreement with end user A"]
          setup_api_calls:
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { euA: "$.data.id" } }
            - { call: "POST /end-users", payload: { name: "GigaCorp", industry: "finance" }, as: ManufacturerAdmin, captures: { euB: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${euA}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id" } }
          trigger:
            - { call: "GET /volume-agreements/${agr_id}", as: EndUserRep, as_user_id: "${euA}", captures: { ok_id: "$.data.id" } }
            - { call: "GET /volume-agreements/${agr_id}", as: EndUserRep, as_user_id: "${euB}", captures: { err: "$.data.error_id" } }
          assert:
            - "owner read returns 200 with the agreement id"
            - "other end user read fails ERR_FORBIDDEN_OWNERSHIP 403"

  # ================================================ cross_cutting_layers ====
  - section: cross_cutting_layers
    instances:
      - name: layer_occ_stale_spec_lock_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[spec-lock-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "after a lock (v2) and a revise (v3), a lock carrying the pre-lock version v1 is rejected 412 ERR_STALE_VERSION while the spec is legitimately DRAFT (state is correct, only the version is stale); the retry with the current version succeeds."
        test_recipe:
          setup: ["configuration created (v1), locked (v2), revised back to DRAFT (v3)"]
          setup_api_calls:
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /configurations", payload: { name: "Chairs", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id", cfg_v1: "$.data.version" } }
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v1}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /configurations/${cfg_id}/revise", as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_v3: "$.data.version" } }
          trigger:
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v1}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v3}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { st: "$.data.status", v4: "$.data.version" } }
          assert:
            - "stale lock (create-time version 1 vs current 3) fails ERR_STALE_VERSION 412 while status is DRAFT"
            - "lock with the current version succeeds: status LOCKED, version 4"

      - name: layer_version_ladder_on_order_lifecycle
        claim_type: optimistic_concurrency
        grounds:
          - "entities.ProjectOrder"
          - "state_machines.ProjectOrder"
        distinguishing_aspect: "version increments by exactly 1 on every successful mutation: create v1 -> submit v2 -> acknowledge v3 -> cancel v4, observable in each response."
        test_recipe:
          setup: ["locked config; active agreement"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { eu_id: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${eu_id}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /volume-agreements/${agr_id}/activate", as: ManufacturerAdmin }
            - { call: "POST /configurations", payload: { name: "Chairs", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id" , cfg_v: "$.data.version" } }
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
          trigger:
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { v1: "$.data.version", ord_id: "$.data.id" } }
            - { call: "POST /project-orders/${ord_id}/submit", payload: { expected_order_version: "${v1}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { v2: "$.data.version" } }
            - { call: "POST /project-orders/${ord_id}/acknowledge", as: ManufacturerAdmin, captures: { v3: "$.data.version" } }
            - { call: "POST /project-orders/${ord_id}/cancel", payload: { reason: "done" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { v4: "$.data.version" } }
          assert:
            - "v1 == 1, v2 == 2, v3 == 3, v4 == 4 (each mutation increments by exactly 1)"

      - name: layer_cascading_side_effects
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.ProjectOrder"
          - "state_machines.Dealer"
        excluded_because:
          difficulty_instance: order_cancel_cascades_phase_window_and_frees_plant_capacity
          rationale: "the order-cancel depth-3 cascade and (in order_hold_release_cycle_via_dealer_suspension) the dealer-suspension cascade are asserted end-to-end by §1.8 instances."

      - name: layer_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds:
          - "calculations.order_pricing"
          - "calculations.punch_escalation_age"
        excluded_because:
          difficulty_instance: order_pricing_provisional_excludes_final_includes_current_order
          rationale: "both dual-variant calculations are asserted by §1.8 rule-1 instances (pricing tiers; punch business-vs-calendar aging)."

  # ===================================================== consistency_model ====
  - section: consistency_model
    instances:
      - name: consistency_immediate_read_after_write
        claim_type: immediate
        grounds:
          - "complexity_profile"
          - "endpoints.\"PATCH /dealers/{dealerId}\""
        distinguishing_aspect: "immediate consistency: PATCH capability 2 -> 5 is visible to the very next request — the SYSTEMS order that failed submit with ERR_CAPABILITY_INSUFFICIENT succeeds on the immediate retry (same order version, proving the failed submit never mutated)."
        test_recipe:
          setup: ["dealer level 2; locked SYSTEMS config; DRAFT order; first submit failed with ERR_CAPABILITY_INSUFFICIENT"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "SYS-7500", name: "Systems 7500", category: "SYSTEMS", base_lead_time_days: 42 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Beta", territory_codes: ["MI"], service_capability_level: 2 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { eu_id: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${eu_id}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /volume-agreements/${agr_id}/activate", as: ManufacturerAdmin }
            - { call: "POST /configurations", payload: { name: "One station", modules: [{ module_type: "WORKSTATION_6X6", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id" , cfg_v: "$.data.version" } }
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ord_id: "$.data.id", ord_v: "$.data.version" } }
            - { call: "POST /project-orders/${ord_id}/submit", payload: { expected_order_version: "${ord_v}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { err_first: "$.data.error_id" } }
          trigger:
            - { call: "PATCH /dealers/${dlr_id}", payload: { service_capability_level: 5 }, as: ManufacturerAdmin, captures: { lvl: "$.data.service_capability_level" } }
            - { call: "POST /project-orders/${ord_id}/submit", payload: { expected_order_version: "${ord_v}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { st: "$.data.status" } }
          assert:
            - "first submit failed ERR_CAPABILITY_INSUFFICIENT"
            - "PATCH response shows service_capability_level == 5 (mutation visible in its own response)"
            - "immediate retry with the SAME expected_order_version succeeds (status SUBMITTED): the failed submit never bumped the version and the new capability is readable at once"
