          - entities.SolidsBatch.fields.pathogen_class
          - validations.priority_33_business_safety
          - errors[ERR_PATHOGEN_CLASS_INSUFFICIENT]
        distinguishing_aspect: "Detention is 10.0 days against the CLASS_B_MIN_DAYS constant of 15.0 while the temperature 36.0 C clears CLASS_B_MIN_TEMP_C of 35.0, so the conjunction fails and pathogen_class is NONE - certification is refused even though the reduction figures and the metal panel are both fine."
        test_recipe:
          setup:
            - "One facility, one ACTIVE CADMIUM limit (ceiling 85.0, monthly avg 39.0), one batch dewatered with volatile solids 70.00 -> 55.00 (van Kleeck 47.62, mass balance 37.14), detention_days 10.0, digester_temp_c 36.0, pathogen_option PSRP_ALT1_TIME_TEMP, vector_option VAR_OPTION_1_VSR, and one CADMIUM result of 20.0 mg/kg on sampling round 0."
