            - call: "POST /ops/units/${u}/checklists/${run}/submit"
              payload: {}
              as: UnitManager
              as_user_id: "um-1"
          trigger:
            - call: "POST /ops/units/${u}/checklists/${run}/approve"
              payload: {}
              as: CommandCenterAdmin
              as_user_id: "um-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails with error_id == ERR_SEGREGATION_OF_DUTIES (403) — approver identity equals submitter identity"
            - "ChecklistRun.${run}.status == SUBMITTED (unchanged)"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_storm_stale_version_on_escalate
        claim_type: "optimistic_concurrency stale write"
        grounds:
          - concurrency_rules[storm-event-mutation-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Escalate with a version one behind the current (a prior escalate already advanced it) returns 412 ERR_STALE_VERSION; the same call with the fresh version succeeds — deterministic sequential OCC, no parallelism."
        test_recipe:
          setup: ["Clock 2026-09-10T08:00:00Z. Storm created (WATCH, version 1), escalated once (WARNING, version 2)."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id, se_v: $.data.version }
            - call: "POST /ops/storm-events/${se}/escalate"
              payload: { expected_storm_event_version: "${se_v}" }
              as: CommandCenterAdmin
              captures: { se_v2: $.data.version }
          trigger:
            - call: "POST /ops/storm-events/${se}/deescalate"
              payload: { expected_storm_event_version: "${se_v2} - 1" }
              as: CommandCenterAdmin
              captures: { err: $.data.error_id }
            - call: "POST /ops/storm-events/${se}/deescalate"
              payload: { expected_storm_event_version: "${se_v2}" }
              as: CommandCenterAdmin
              captures: { st: $.data.status }
          assert:
            - "stale deescalate fails with error_id == ERR_STALE_VERSION (412)"
            - "fresh deescalate succeeds: StormEvent.${se}.status == WATCH and version == 3"

      - name: version_increments_on_every_mutation
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Unit
          - complexity_profile.complexity_layers
        distinguishing_aspect: "Unit.version tracks every mutation including cascades: create (1) -> condition report (2) -> menu activation is a child and does not bump unit -> second condition report (3) -> fund top-up (4) — each write bumps exactly 1 and updated_at refreshes."
        test_recipe:
          setup: ["Clock 2026-09-10T08:00:00Z. Storm with unit U."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-1", address: "1 Storm Way" }
              as: CommandCenterAdmin
              captures: { u: $.data.id, v0: $.data.version, ua0: $.data.updated_at }
          trigger:
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "DOWN", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/units/${u}/menu-activations"
              payload: { tier: "TIER1_NO_POWER" }
              as: UnitManager
            - call: "GET /ops/units/${u}"
              as: CommandCenterAdmin
              captures: { v1: $.data.version }
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "UP", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "PATCH /ops/units/${u}"
              payload: { lodging_fund_top_up_cents: 500 }
              as: CommandCenterAdmin
              captures: { v2: $.data.version }
          assert:
            - "Unit.${u}.version == 1 at creation"
            - "after one condition report and one child menu activation: version == 2 (child creation does not bump the unit)"
            - "after a second condition report and a fund top-up: version == 4"
            - "updated_at advances on each mutation (never earlier than the previous updated_at)"

      - name: cash_only_flag_derives_from_payment_axis_only
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Unit.fields.cash_only_flag
          - complexity_profile.complexity_layers
        distinguishing_aspect: "cash_only_flag reconciles with the payment axis on every report: power/water/gas DOWN without payment DOWN leaves the flag false; payment DOWN sets it true; payment restored clears it — no other axis participates."
        test_recipe:
          setup: ["Clock 2026-09-10T08:00:00Z. Storm with unit U. Report 1: power+water+gas DOWN, payment UP. Report 2: all four DOWN. Report 3: payment UP, others still DOWN."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-1", address: "1 Storm Way" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
          trigger:
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "DOWN", water: "DOWN", gas: "DOWN", payment_network: "UP" }
              as: UnitManager
            - call: "GET /ops/units/${u}"
              as: CommandCenterAdmin
              captures: { c1: $.data.cash_only_flag }
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "DOWN", water: "DOWN", gas: "DOWN", payment_network: "DOWN" }
              as: UnitManager
            - call: "GET /ops/units/${u}"
              as: CommandCenterAdmin
              captures: { c2: $.data.cash_only_flag }
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "DOWN", water: "DOWN", gas: "DOWN", payment_network: "UP" }
              as: UnitManager
            - call: "GET /ops/units/${u}"
              as: CommandCenterAdmin
              captures: { c3: $.data.cash_only_flag }
          assert:
            - "after report 1 (payment UP): cash_only_flag == false despite three other axes DOWN"
            - "after report 2 (payment DOWN): cash_only_flag == true"
            - "after report 3 (payment UP again): cash_only_flag == false while menu_tier stays TIER1_NO_POWER"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: cascade_visible_immediately_in_same_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Unit
        distinguishing_aspect: "Immediate consistency: the GET /ops/units/{id} issued right after a condition report reflects the recomputed menu_tier, cash_only_flag and bumped version in the same logical instant — no eventual lag."
        test_recipe:
          setup: ["Clock 2026-09-10T08:00:00Z. Storm with unit U all UP."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-1", address: "1 Storm Way" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
          trigger:
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "UP", water: "DOWN", gas: "UP", payment_network: "DOWN" }
