# =============================================================================
# SCAFFOLD — Rideshare Payload Manifest, Launch Slot Assignment & Range
# Scheduling (SpaceX-style rideshare mission operations)
# §1.0–§1.7 seed tables. §1.8 and §1.9 live in their own sibling files.
# =============================================================================

scenario: |
  Rideshare Payload Manifest, Launch Slot Assignment & Range Scheduling (SpaceX): rideshare mission manifest construction assigning many small payloads to a single launch with mass, volume and orbit compatibility, customer contracting with launch date windows, rebooking rights and price per kilogram tiers, payload integration scheduling including dispenser assignment, mechanical and electrical interface verification and safety review, regulatory licensing for launch and payload operators with spectrum and orbital debris considerations, range scheduling with other operators, weather constraints and collision avoidance windows, launch delay cascading effects on customer schedules and rebooking to later missions, deployment sequencing and separation timing to avoid recontact, post-launch confirmation and anomaly investigation

domain_name: rideshare-manifest-ops
api_prefix: /rideshare

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  versioning_policy: "An entity's version increments by 1 only where a state-machine transition or an endpoint's side_effects list says so (creates start at 1). Pure derived-field recomputation (e.g. committed_mass_kg, firm_mass_kg after a confirm) refreshes updated_at without a version bump; child-row creation (dispenser ports, verifications, safety reviews) never bumps the parent's version."
  entity_count: 14
  state_machine_count: 8
  calculation_count: 10
  endpoint_count: 40
  error_code_count: 39
  role_count: 8

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities, flat topology)
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: org_name, type: string, source: input, description: "Customer organization legal name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: default_rebookings, type: integer, source: input, default: 1, description: "Default number of free rebooking rights granted to each new contract of this customer" }

  - name: Mission
    parent: null
    common_fields: true
    fields:
      - { name: mission_name, type: string, source: input, description: "Mission name, e.g. Transporter-19" }
      - { name: target_orbit, type: enum, source: input, description: "SSO | LEO | GTO — orbit class this launch injects into" }
      - { name: window_open_utc, type: datetime, source: input, description: "Earliest permitted launch instant (closed bound)" }
      - { name: window_close_utc, type: datetime, source: input, description: "Latest permitted launch instant (closed bound); must be strictly after window_open_utc" }
      - { name: mass_capacity_kg, type: number, source: input, description: "Total payload mass capacity in kg; must be > 0" }
      - { name: volume_capacity_m3, type: number, source: input, description: "Total payload volume capacity in cubic meters; must be > 0" }
      - { name: committed_mass_kg, type: number, source: computed, default: 0, description: "TOTAL variant of manifest_commitment: sum of mass_kg over payloads whose assignments to this mission are in {PROVISIONAL, CONFIRMED, INTEGRATED}" }
      - { name: committed_volume_m3, type: number, source: computed, default: 0, description: "TOTAL variant volume: sum of volume_m3 over payloads whose assignments to this mission are in {PROVISIONAL, CONFIRMED, INTEGRATED}" }
      - { name: firm_mass_kg, type: number, source: computed, default: 0, description: "FIRM variant of manifest_commitment: sum of mass_kg over payloads whose assignments are in {CONFIRMED, INTEGRATED} only" }
      - { name: integration_revenue_cents, type: integer, source: computed, default: 0, description: "Stored at lock-manifest: sum of per-assignment integration_fee_cents AFTER each line is rounded (round-per-line-then-sum order, see calculations.integration_fee_ledger)" }
      - { name: revenue_estimate_cents, type: integer, source: computed, default: 0, description: "Stored at lock-manifest: round of the sum of UNROUNDED per-assignment fee terms (sum-then-round order); may differ from integration_revenue_cents by a few cents" }
      - { name: status, type: enum, source: system, description: "MANIFEST_OPEN | MANIFEST_LOCKED | RANGE_SCHEDULED | LAUNCHED | COMPLETED | SCRUBBED" }

  - name: DispenserPort
    parent: null
    common_fields: true
    fields:
      - { name: mission_id, type: string, source: system, description: "FK -> Mission.id; the mission whose dispenser ring carries this port" }
      - { name: port_code, type: string, source: input, description: "Port label, unique per mission (ERR_DUPLICATE_PORT_CODE)" }
      - { name: stack_position, type: integer, source: input, description: "Position on the dispenser stack; higher deploys earlier; unique per mission" }
      - { name: max_mass_kg, type: number, source: input, description: "Maximum payload mass this port can carry; must be > 0" }
      - { name: supported_interface_classes, type: array, source: input, description: "Non-empty array of interface enums drawn from RING_15 | RING_24 | CUBESAT" }

  - name: LaunchContract
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; contracting customer" }
      - { name: target_mission_id, type: string, source: input, default: null, description: "FK -> Mission.id; nullable preferred mission. Once set, assignments for this contract's payloads must target this mission (ERR_MISSION_MISMATCH)" }
      - { name: pricing_mode, type: enum, source: input, description: "MARGINAL | FLAT — selects the variant of calculations.contract_price_quote" }
      - { name: window_open_utc, type: datetime, source: input, description: "Contract launch-date window open (closed bound)" }
      - { name: window_close_utc, type: datetime, source: input, description: "Contract launch-date window close (closed bound); strictly after window_open_utc" }
      - { name: rebookings_remaining, type: integer, source: input, default: -1, description: "Free rebooking rights; -1 sentinel at create means inherit customer.default_rebookings" }
      - { name: quoted_price_cents, type: integer, source: computed, default: 0, description: "Computed at sign from calculations.contract_price_quote over the contract's payloads; immutable thereafter (rebooking never re-quotes)" }
      - { name: total_rebooking_fees_cents, type: integer, source: computed, default: 0, description: "Accumulated rebooking fees charged on this contract" }
      - { name: rebook_eligible, type: boolean, source: system, default: false, description: "Set true by delay/scrub cascades that stripped this contract's assignments; a rebooking while true charges no fee and consumes no rights, then clears the flag" }
      - { name: status, type: enum, source: system, description: "DRAFT | SIGNED | MANIFESTED | FULFILLED | EXPIRED" }

  - name: Payload
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> LaunchContract.id; owning contract (payloads are created atomically with the contract)" }
      - { name: payload_name, type: string, source: input, description: "Payload label supplied inside the contract's payloads array" }
      - { name: mass_kg, type: number, source: input, description: "Payload mass in kg; must be > 0" }
      - { name: volume_m3, type: number, source: input, description: "Payload volume in cubic meters; must be > 0" }
      - { name: interface_class, type: enum, source: input, description: "RING_15 | RING_24 | CUBESAT — mechanical/electrical dispenser interface class" }
      - { name: required_orbit, type: enum, source: input, description: "SSO | LEO | GTO — orbit this payload must be injected into" }
      - { name: status, type: enum, source: system, description: "REGISTERED | MANIFESTED | DEPLOYED" }

  - name: ManifestAssignment
    parent: null
    common_fields: true
    fields:
      - { name: mission_id, type: string, source: input, description: "FK -> Mission.id; mission the payload is manifested on" }
      - { name: payload_id, type: string, source: input, description: "FK -> Payload.id; manifested payload" }
      - { name: dispenser_port_id, type: string, source: input, description: "FK -> DispenserPort.id; port on that mission's dispenser" }
      - { name: integration_fee_cents, type: integer, source: computed, description: "Per-line integration fee, round_half_up(mass_kg x INTEGRATION_RATE_CENTS_PER_KG x interface factor, 0) computed at assignment creation" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | CONFIRMED | INTEGRATED | DEPLOYED | REMOVED" }

  - name: InterfaceVerification
    parent: null
    common_fields: false
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> ManifestAssignment.id; verified assignment (from path)" }
      - { name: check_type, type: enum, source: input, description: "MECHANICAL | ELECTRICAL" }
      - { name: outcome, type: enum, source: input, description: "PASSED | FAILED" }
      - { name: notes, type: string, source: input, default: null, description: "Optional free-text notes" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID header value of the IntegrationEngineer who recorded this verification; feeds segregation-of-duties" }

  - name: SafetyReview
    parent: null
    common_fields: false
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> ManifestAssignment.id; reviewed assignment (from path)" }
      - { name: decision, type: enum, source: input, description: "APPROVE | REJECT; the latest SafetyReview by created_at governs the assignment" }
      - { name: rationale, type: string, source: input, default: null, description: "Optional free-text rationale" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID header value of the SafetyOfficer who recorded this review; feeds segregation-of-duties" }

  - name: RegulatoryLicense
    parent: null
    common_fields: true
    fields:
      - { name: subject_type, type: enum, source: input, description: "MISSION | CUSTOMER — what this license covers" }
      - { name: mission_id, type: string, source: input, default: null, description: "FK -> Mission.id; required iff subject_type == MISSION" }
      - { name: customer_id, type: string, source: input, default: null, description: "FK -> Customer.id; required iff subject_type == CUSTOMER" }
      - { name: kind, type: enum, source: input, description: "LAUNCH_AUTHORIZATION (MISSION subjects only) | PAYLOAD_OPERATOR (CUSTOMER subjects only)" }
      - { name: debris_score, type: integer, source: input, description: "Orbital-debris mitigation plan quality, integer 0..100" }
      - { name: spectrum_score, type: integer, source: input, description: "Spectrum coordination quality, integer 0..100" }
      - { name: operator_history_score, type: integer, source: input, description: "Operator track record, integer 0..100" }
      - { name: composite_score, type: integer, source: computed, description: "round_half_up(0.5*debris_score + 0.3*spectrum_score + 0.2*operator_history_score, 0); grant requires >= 70" }
      - { name: valid_until, type: datetime, source: input, description: "License validity end (closed bound); must be strictly in the future at creation" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | GRANTED | DENIED | REVOKED | EXPIRED" }

  - name: RangeSlot
    parent: null
    common_fields: true
    fields:
      - { name: mission_id, type: string, source: input, description: "FK -> Mission.id; mission requesting range time" }
      - { name: range_code, type: enum, source: input, description: "CCAFS | VAFB — launch range" }
      - { name: window_open_utc, type: datetime, source: input, description: "Slot window open (closed bound)" }
      - { name: window_close_utc, type: datetime, source: input, description: "Slot window close (closed bound); strictly after window_open_utc" }
      - { name: status, type: enum, source: system, description: "REQUESTED | RESERVED | CONFIRMED | CONSUMED | RELEASED" }

  - name: ExclusionWindow
    parent: null
    common_fields: false
    fields:
      - { name: scope_type, type: enum, source: input, description: "RANGE | ORBIT — what scope_value refers to" }
      - { name: scope_value, type: string, source: input, description: "A range_code (CCAFS|VAFB) when scope_type == RANGE, an orbit (SSO|LEO|GTO) when scope_type == ORBIT" }
      - { name: kind, type: enum, source: input, description: "WEATHER (requires scope_type RANGE) | COLA (requires scope_type ORBIT)" }
      - { name: start_utc, type: datetime, source: input, description: "Half-open interval start (inclusive)" }
      - { name: end_utc, type: datetime, source: input, description: "Half-open interval end (exclusive); strictly after start_utc" }

  - name: DelayEvent
    parent: null
    common_fields: false
    fields:
      - { name: mission_id, type: string, source: system, description: "FK -> Mission.id; delayed mission (from path)" }
      - { name: previous_window_open_utc, type: datetime, source: system, description: "Mission window_open_utc before the delay" }
      - { name: previous_window_close_utc, type: datetime, source: system, description: "Mission window_close_utc before the delay" }
      - { name: new_window_open_utc, type: datetime, source: input, description: "Replacement window open; must be strictly after the previous window_open_utc" }
      - { name: new_window_close_utc, type: datetime, source: input, description: "Replacement window close; strictly after new_window_open_utc" }
      - { name: reason_code, type: string, source: input, description: "Delay reason (free text)" }
      - { name: slot_released, type: boolean, source: system, description: "True when the delay forced the mission's CONFIRMED range slot to RELEASED" }
      - { name: assignments_removed_count, type: integer, source: system, description: "Number of assignments the delay cascade moved to REMOVED" }

  - name: SeparationEvent
    parent: null
    common_fields: true
    fields:
      - { name: mission_id, type: string, source: system, description: "FK -> Mission.id; launching mission" }
      - { name: assignment_id, type: string, source: system, description: "FK -> ManifestAssignment.id; assignment being separated" }
      - { name: sequence_index, type: integer, source: system, description: "0-based deployment order assigned by calculations.separation_sequence at launch" }
      - { name: offset_seconds, type: integer, source: system, description: "Seconds after liftoff at which this separation is commanded" }
      - { name: status, type: enum, source: system, description: "PLANNED | EXECUTED | ANOMALOUS" }

  - name: AnomalyReport
    parent: null
    common_fields: true
    fields:
      - { name: mission_id, type: string, source: system, description: "FK -> Mission.id; mission the anomaly is raised against (auto-copied from the separation event)" }
      - { name: category, type: enum, source: input, description: "SEPARATION | PAYLOAD_TELEMETRY; supplied as anomaly_category on report-outcome" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH; supplied as anomaly_severity on report-outcome" }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_INVESTIGATION | ESCALATED | RESOLVED" }
      - { name: disposition, type: enum, source: system, default: null, description: "NOMINAL | LOSS — recorded when the anomaly reaches RESOLVED" }
      - { name: resolution_notes, type: string, source: input, default: null, description: "Notes supplied at resolve time" }

# =============================================================================
# §1.2 State Machine Table (8 machines)
# =============================================================================
state_machines:
  - entity: Mission
    initial_state: MANIFEST_OPEN
    terminal_states: [COMPLETED, SCRUBBED]
    transitions:
      - from: MANIFEST_OPEN
        to: MANIFEST_LOCKED
        trigger: "POST /rideshare/missions/{id}/lock-manifest"
        actor: MissionOps
        preconditions:
          - "At least one ManifestAssignment on this mission is CONFIRMED (else ERR_INVALID_STATE)"
          - "Every ManifestAssignment on this mission is in {CONFIRMED, REMOVED} (else ERR_INVALID_STATE)"
        side_effects:
          - "Every CONFIRMED assignment -> INTEGRATED"
          - "Compute and store integration_revenue_cents (round-per-line-then-sum) and revenue_estimate_cents (sum-then-round) per calculations.integration_fee_ledger"
          - "Increments Mission.version by 1"

      - from: MANIFEST_LOCKED
        to: RANGE_SCHEDULED
        trigger: "system (automatic when a RangeSlot for this mission reaches CONFIRMED)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments Mission.version by 1"

      - from: RANGE_SCHEDULED
        to: MANIFEST_LOCKED
        trigger: "system (automatic inside POST /rideshare/missions/{id}/delay when the CONFIRMED slot no longer contains the new mission window)"
        actor: system
        preconditions: []
        side_effects:
          - "The mission's CONFIRMED RangeSlot -> RELEASED (this hop is itself the head of the delay cascade, see delay_cascade_assessment)"
          - "Increments Mission.version by 1"

      - from: RANGE_SCHEDULED
        to: LAUNCHED
        trigger: "POST /rideshare/missions/{id}/launch"
        actor: MissionOps
        preconditions:
          - "Checks run in §1.4 priority order: state (RANGE_SCHEDULED) first, then business_safety weather, then business_temporal window containment"
          - "No WEATHER ExclusionWindow scoped to the slot's range_code has start_utc <= t < end_utc (half-open) else ERR_WEATHER_HOLD"
          - "Logical clock instant t satisfies Mission.window_open_utc <= t <= Mission.window_close_utc (closed) else ERR_LAUNCH_WINDOW_VIOLATION"
          - "The mission's CONFIRMED slot satisfies slot.window_open_utc <= t <= slot.window_close_utc (closed) else ERR_LAUNCH_WINDOW_VIOLATION"
        side_effects:
          - "The mission's CONFIRMED RangeSlot -> CONSUMED"
          - "Run calculations.separation_sequence: create one SeparationEvent per INTEGRATED assignment"
          - "Increments Mission.version by 1"

      - from: LAUNCHED
        to: COMPLETED
        trigger: "system (automatic when every SeparationEvent of this mission is EXECUTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments Mission.version by 1"

      - from: MANIFEST_LOCKED
        to: SCRUBBED
        trigger: "POST /rideshare/missions/{id}/scrub"
        actor: MissionOps
        preconditions: []
        side_effects:
          - "All assignments in {PROVISIONAL, CONFIRMED, INTEGRATED} -> REMOVED; each payload -> REGISTERED; each contract with no remaining live assignments and status MANIFESTED -> SIGNED with rebook_eligible = true"
          - "Recompute mission commitment fields (all zero after the removal sweep)"
          - "Increments Mission.version by 1"

      - from: RANGE_SCHEDULED
        to: SCRUBBED
        trigger: "POST /rideshare/missions/{id}/scrub"
        actor: MissionOps
        preconditions: []
        side_effects:
          - "The mission's RESERVED or CONFIRMED RangeSlot -> RELEASED"
          - "Same assignment/contract/mass cascade as MANIFEST_LOCKED -> SCRUBBED"
          - "Increments Mission.version by 1"

  - entity: LaunchContract
    initial_state: DRAFT
    terminal_states: [FULFILLED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /rideshare/contracts/{id}/sign"
        actor: Customer
        preconditions:
          - "Caller is the contract's customer (X-User-ID == contract.customer_id; else 404 ERR_CONTRACT_NOT_FOUND by scoping)"
        side_effects:
          - "Compute and store quoted_price_cents per calculations.contract_price_quote over the contract's payloads"
          - "Increments LaunchContract.version by 1"

      - from: SIGNED
        to: MANIFESTED
        trigger: "system (automatic when the first live ManifestAssignment is created for one of the contract's payloads)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments LaunchContract.version by 1"

      - from: MANIFESTED
        to: SIGNED
        trigger: "system (automatic when the contract's last live assignment leaves {PROVISIONAL, CONFIRMED, INTEGRATED} via removal, delay cascade, license revoke cascade, or scrub cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments LaunchContract.version by 1"

      - from: MANIFESTED
        to: FULFILLED
        trigger: "system (automatic when every payload of the contract is DEPLOYED)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments LaunchContract.version by 1"

      - from: SIGNED
        to: EXPIRED
        trigger: "system (expiry sweep inside POST /_clock/set_current_utc: SIGNED contract whose window_close_utc < current logical time)"
        actor: system
        preconditions: []
        side_effects:
          - "rebook_eligible set false"
          - "Increments LaunchContract.version by 1"

  - entity: Payload
    initial_state: REGISTERED
    terminal_states: [DEPLOYED]
    transitions:
      - from: REGISTERED
        to: MANIFESTED
        trigger: "system (automatic when a ManifestAssignment is created for this payload)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments Payload.version by 1"

      - from: MANIFESTED
        to: REGISTERED
        trigger: "system (automatic when the payload's live assignment is REMOVED by any path: manual remove, delay cascade, license revoke cascade, scrub cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments Payload.version by 1"

      - from: MANIFESTED
        to: DEPLOYED
        trigger: "system (automatic when the payload's assignment's SeparationEvent reaches EXECUTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments Payload.version by 1"

  - entity: ManifestAssignment
    initial_state: PROVISIONAL
    terminal_states: [DEPLOYED, REMOVED]
    transitions:
      - from: PROVISIONAL
        to: CONFIRMED
        trigger: "POST /rideshare/assignments/{id}/confirm"
        actor: MissionOps
        preconditions:
          - "Latest InterfaceVerification for check_type MECHANICAL has outcome PASSED, and latest for ELECTRICAL has outcome PASSED (else ERR_VERIFICATION_INCOMPLETE)"
          - "Latest SafetyReview by created_at for this assignment has decision APPROVE (else ERR_SAFETY_REVIEW_REQUIRED)"
          - "The payload's contract's customer holds a GRANTED RegulatoryLicense of kind PAYLOAD_OPERATOR (else ERR_LICENSE_NOT_GRANTED)"
        side_effects:
          - "Increments ManifestAssignment.version by 1"

      - from: CONFIRMED
        to: INTEGRATED
        trigger: "system (automatic inside POST /rideshare/missions/{id}/lock-manifest)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments ManifestAssignment.version by 1"

      - from: INTEGRATED
        to: DEPLOYED
        trigger: "system (automatic when this assignment's SeparationEvent reaches EXECUTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments ManifestAssignment.version by 1"

      - from: PROVISIONAL
        to: REMOVED
        trigger: "POST /rideshare/assignments/{id}/remove OR delay/license-revoke/scrub cascade"
        actor: MissionOps
        preconditions:
          - "Manual remove is allowed only from PROVISIONAL or CONFIRMED (else ERR_INVALID_STATE); cascades may also remove INTEGRATED"
        side_effects:
          - "Release capacity: recompute mission committed_mass_kg / committed_volume_m3 / firm_mass_kg"
          - "Payload -> REGISTERED"
          - "If the contract has no other live assignments, contract MANIFESTED -> SIGNED"
          - "Increments ManifestAssignment.version by 1 and increments Mission.version by 1"

      - from: CONFIRMED
        to: REMOVED
        trigger: "POST /rideshare/assignments/{id}/remove OR cascade"
        actor: MissionOps
        preconditions: []
        side_effects:
          - "Same release/bubble-up side effects as PROVISIONAL -> REMOVED"

      - from: INTEGRATED
        to: REMOVED
        trigger: "system (delay cascade, license revoke cascade, or scrub cascade only)"
        actor: system
        preconditions: []
        side_effects:
          - "Same release/bubble-up side effects as PROVISIONAL -> REMOVED"

  - entity: RangeSlot
    initial_state: REQUESTED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: REQUESTED
        to: RESERVED
        trigger: "POST /rideshare/range-slots/{id}/reserve"
        actor: RangeOfficer
        preconditions:
          - "calculations.range_slot_overlap passes: no slot on the same range_code in {RESERVED, CONFIRMED} violates the TURNAROUND_MINUTES buffer against this slot (else ERR_RANGE_WINDOW_CONFLICT)"
        side_effects:
          - "Increments RangeSlot.version by 1"

      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /rideshare/range-slots/{id}/confirm"
        actor: RangeOfficer
        preconditions:
          - "Checks run in §1.4 priority order: state first, then business_safety (license, COLA), then business_temporal (containment)"
          - "Mission is in MANIFEST_LOCKED (else ERR_INVALID_STATE)"
          - "Mission holds a GRANTED LAUNCH_AUTHORIZATION license with valid_until >= slot.window_close_utc (else ERR_LICENSE_NOT_GRANTED)"
          - "calculations.exclusion_window_checks COLA rule passes for this mission's target_orbit against the slot window (else ERR_COLA_CONFLICT)"
          - "Slot window contains the mission window: slot.window_open_utc <= mission.window_open_utc AND slot.window_close_utc >= mission.window_close_utc (else ERR_WINDOW_INCOMPATIBLE)"
        side_effects:
          - "Mission MANIFEST_LOCKED -> RANGE_SCHEDULED"
          - "Increments RangeSlot.version by 1"

      - from: RESERVED
        to: RELEASED
        trigger: "system (delay or scrub cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CONFIRMED
        to: RELEASED
        trigger: "system (delay or scrub cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CONFIRMED
        to: CONSUMED
        trigger: "system (automatic inside POST /rideshare/missions/{id}/launch)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RegulatoryLicense
    initial_state: SUBMITTED
    terminal_states: [DENIED, REVOKED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: GRANTED
        trigger: "POST /rideshare/licenses/{id}/transition with to_state GRANTED"
        actor: Regulator
        preconditions:
          - "composite_score >= GRANT_THRESHOLD (70) else ERR_LICENSE_SCORE_TOO_LOW"
        side_effects:
          - "Increments RegulatoryLicense.version by 1"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /rideshare/licenses/{id}/transition with to_state DENIED"
        actor: Regulator
        preconditions: []
        side_effects:
          - "Increments RegulatoryLicense.version by 1"

      - from: GRANTED
        to: REVOKED
        trigger: "POST /rideshare/licenses/{id}/transition with to_state REVOKED"
        actor: Regulator
        preconditions: []
        side_effects:
          - "If subject_type == CUSTOMER and kind == PAYLOAD_OPERATOR: every live assignment (status in {PROVISIONAL, CONFIRMED, INTEGRATED}) of a payload belonging to this customer's contracts, on missions in {MANIFEST_OPEN, MANIFEST_LOCKED, RANGE_SCHEDULED}, -> REMOVED (each removal then runs its own release/bubble-up side effects)"
          - "Increments RegulatoryLicense.version by 1"

      - from: GRANTED
        to: EXPIRED
        trigger: "system (expiry sweep inside POST /_clock/set_current_utc: GRANTED license whose valid_until < current logical time)"
        actor: system
        preconditions: []
        side_effects:
          - "No assignment cascade on expiry (contrast with REVOKED)"
          - "Increments RegulatoryLicense.version by 1"

  - entity: SeparationEvent
    initial_state: PLANNED
    terminal_states: [EXECUTED]
    transitions:
      - from: PLANNED
        to: EXECUTED
        trigger: "POST /rideshare/separation-events/{id}/report-outcome with outcome EXECUTED"
        actor: MissionOps
        preconditions: []
        side_effects:
          - "Assignment INTEGRATED -> DEPLOYED; payload MANIFESTED -> DEPLOYED"
          - "If all payloads of the assignment's contract are DEPLOYED, contract MANIFESTED -> FULFILLED"
          - "If all SeparationEvents of the mission are EXECUTED, mission LAUNCHED -> COMPLETED"

      - from: PLANNED
        to: ANOMALOUS
        trigger: "POST /rideshare/separation-events/{id}/report-outcome with outcome ANOMALOUS"
        actor: MissionOps
        preconditions:
          - "anomaly_category and anomaly_severity must be present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "Create AnomalyReport(mission_id = event.mission_id, category, severity, status OPEN)"

      - from: ANOMALOUS
        to: EXECUTED
        trigger: "POST /rideshare/separation-events/{id}/report-outcome with outcome EXECUTED"
        actor: MissionOps
        preconditions:
          - "Every AnomalyReport of this mission is RESOLVED (else ERR_ANOMALIES_UNRESOLVED)"
        side_effects:
          - "Same deployment/bubble-up side effects as PLANNED -> EXECUTED"

  - entity: AnomalyReport
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: UNDER_INVESTIGATION
        trigger: "POST /rideshare/anomalies/{id}/transition with to_state UNDER_INVESTIGATION"
        actor: MissionOps | SafetyOfficer
        preconditions: []
        side_effects:
          - "Increments AnomalyReport.version by 1"

      - from: UNDER_INVESTIGATION
        to: ESCALATED
        trigger: "POST /rideshare/anomalies/{id}/transition with to_state ESCALATED"
        actor: MissionOps | SafetyOfficer
        preconditions: []
        side_effects:
          - "Increments AnomalyReport.version by 1"

      - from: ESCALATED
        to: UNDER_INVESTIGATION
        trigger: "POST /rideshare/anomalies/{id}/transition with to_state UNDER_INVESTIGATION"
        actor: MissionOps | SafetyOfficer
        preconditions: []
        side_effects:
          - "Increments AnomalyReport.version by 1"

      - from: UNDER_INVESTIGATION
        to: RESOLVED
        trigger: "POST /rideshare/anomalies/{id}/transition with to_state RESOLVED"
        actor: MissionOps | SafetyOfficer
        preconditions:
          - "disposition must be present and one of NOMINAL | LOSS (else ERR_INVALID_REQUEST)"
        side_effects:
          - "Set disposition and resolution_notes"
          - "Increments AnomalyReport.version by 1"

      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /rideshare/anomalies/{id}/transition with to_state RESOLVED"
        actor: MissionOps | SafetyOfficer
        preconditions:
          - "disposition must be present and one of NOMINAL | LOSS (else ERR_INVALID_REQUEST)"
        side_effects:
          - "Set disposition and resolution_notes"
          - "Increments AnomalyReport.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-mission
    parent_entity: Mission
    write_endpoint: "POST /rideshare/assignments"
    occ_field: "expected_mission_version"
    description: |
      Creating a ManifestAssignment against a Mission whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another manifest write (assignment create/remove, lock, delay) has just
      landed and the writer's view of capacity is therefore stale.
    error_id: ERR_STALE_MISSION_VERSION
    http_status: 412
  - rule_id: contract-rebook-stale-version
    parent_entity: LaunchContract
    write_endpoint: "POST /rideshare/contracts/{id}/rebook"
    occ_field: "expected_contract_version"
    description: |
      Rebooking a LaunchContract whose version has advanced since the client last
      observed it is rejected. This captures the case where another rebooking has
      just landed and the writer's view of rebookings_remaining and fees is stale.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (9 rules)
# =============================================================================
calculations:
  - name: contract_price_quote
    trigger: "POST /rideshare/contracts/{id}/sign (DRAFT -> SIGNED)"
    algorithm: tiered_pricing
    formula: |
      total_mass = sum(payload.mass_kg for payload in contract payloads)   # all payloads regardless of status
      MARGINAL variant (waterfall across tiers):
        tier1_kg = min(total_mass, 50);        tier1_cents = tier1_kg * 600000
        tier2_kg = min(max(total_mass - 50, 0), 150);  tier2_cents = tier2_kg * 500000
        tier3_kg = max(total_mass - 200, 0);   tier3_cents = tier3_kg * 425000
        quoted_price_cents = tier1_cents + tier2_cents + tier3_cents
      FLAT variant (entire mass billed at the rate of the highest tier reached):
        rate = 600000 if total_mass <= 50; 500000 if 50 < total_mass <= 200; 425000 if total_mass > 200
        quoted_price_cents = total_mass * rate
      Tier boundary rule: 50 kg exactly bills entirely in tier 1 (boundary belongs to the lower tier);
      200 kg exactly bills tier1 + tier2 with zero tier3.
    input_set: "All Payload rows of the contract (any status); evaluated once at signing"
    constants:
      TIER1_MAX_KG: 50
      TIER1_RATE_CENTS_PER_KG: 600000
      TIER2_MAX_KG: 200
      TIER2_RATE_CENTS_PER_KG: 500000
      TIER3_RATE_CENTS_PER_KG: 425000
    precision: "integer cents; masses may be fractional kg, product round_half_up to whole cents per tier line before summing (MARGINAL) or once (FLAT)"
    variants:
      - name: MARGINAL
        when: "contract.pricing_mode == MARGINAL"
        difference: "Waterfall across tier breakpoints; early kilograms keep the expensive rate"
      - name: FLAT
        when: "contract.pricing_mode == FLAT"
        difference: "Entire mass at the highest reached tier's rate; cheaper for heavy contracts"

  - name: manifest_commitment
    trigger: "assignment create, assignment remove (manual or cascaded), lock-manifest, scrub"
    algorithm: aggregation
    formula: |
      TOTAL variant (stored as mission.committed_mass_kg / committed_volume_m3):
        sum payload.mass_kg / volume_m3 over assignments of this mission
        with status in {PROVISIONAL, CONFIRMED, INTEGRATED}
      FIRM variant (stored as mission.firm_mass_kg):
        same sum but only over assignments with status in {CONFIRMED, INTEGRATED}
      Recomputed immediately (consistency_model: immediate) on every triggering mutation.
    input_set: "ManifestAssignment rows of the mission filtered by the status sets above"
    constants: {}
    precision: "number, same precision as inputs (no rounding)"
    variants:
      - name: TOTAL
        when: "capacity gating at assignment creation; mission.committed_* fields"
        difference: "Includes PROVISIONAL reservations"
      - name: FIRM
        when: "lock-manifest readiness reporting; mission.firm_mass_kg"
        difference: "Excludes PROVISIONAL; for a mission with 100 kg CONFIRMED + 50 kg PROVISIONAL, TOTAL = 150 and FIRM = 100"

  - name: integration_fee_ledger
    trigger: "per-line at assignment creation (stores ManifestAssignment.integration_fee_cents); totals at lock-manifest"
    algorithm: aggregation
    formula: |
      INTERFACE_FACTOR: RING_15 = 1.0, RING_24 = 1.25, CUBESAT = 0.8
      Per assignment line (rounding order PINNED — round each line first):
        integration_fee_cents = round_half_up(payload.mass_kg * 12000 * INTERFACE_FACTOR[payload.interface_class], 0)
      Mission totals at lock-manifest over assignments that are INTEGRATED after the lock flip:
        integration_revenue_cents = sum of the per-line ROUNDED fees        (round-per-line-then-sum)
        revenue_estimate_cents    = round_half_up(sum of the UNROUNDED per-line terms, 0)   (sum-then-round)
      The two totals legitimately differ; both are stored on the mission.
    input_set: "Assignments of the mission that reach INTEGRATED at lock time"
    constants:
      INTEGRATION_RATE_CENTS_PER_KG: 12000
    precision: "integer cents; round_half_up; per-line rounding precedes summation for the stored total"
    variants:
      - name: revenue_estimate
        when: "revenue_estimate_cents field"
        difference: "Sums unrounded terms and rounds once — e.g. two CUBESAT lines of 1.001 kg each give stored 19220 vs estimate 19219"

  - name: rebooking_fee
    trigger: "POST /rideshare/contracts/{id}/rebook"
    algorithm: threshold
    formula: |
      if contract.rebook_eligible == true:
        fee_cents = 0; rebook_eligible := false; rebookings_remaining unchanged
      elif contract.rebookings_remaining > 0:
        fee_cents = 0; rebookings_remaining -= 1
      else:
        days = floor((to_mission.window_open_utc - current logical time) / 86400 seconds)
        pct = 0.10 if days >= 61; 0.25 if 31 <= days <= 60; 0.50 if days <= 30
        fee_cents = round_half_up(contract.quoted_price_cents * pct, 0)
      contract.total_rebooking_fees_cents += fee_cents
      contract.target_mission_id := to_mission_id
    input_set: "The contract being rebooked and the target mission"
    constants:
      FEE_PCT_FAR: 0.10
      FEE_PCT_MID: 0.25
      FEE_PCT_NEAR: 0.50
      FAR_MIN_DAYS: 61
      MID_MIN_DAYS: 31
    precision: "integer cents, round_half_up"

  - name: license_composite_score
    trigger: "POST /rideshare/licenses (stored at creation); consulted at GRANT transition"
    algorithm: weighted_scoring
    formula: |
      composite_score = round_half_up(0.5 * debris_score + 0.3 * spectrum_score + 0.2 * operator_history_score, 0)
      GRANT requires composite_score >= 70 (boundary: 70 exactly grants; 69 rejects with ERR_LICENSE_SCORE_TOO_LOW)
    input_set: "The license application being decided"
    constants:
      W_DEBRIS: 0.5
      W_SPECTRUM: 0.3
      W_HISTORY: 0.2
      GRANT_THRESHOLD: 70
    precision: "integer score, round_half_up"

  - name: range_slot_overlap
    trigger: "POST /rideshare/range-slots/{id}/reserve"
    algorithm: interval_merge
    formula: |
      Conflict on the same range_code with an existing slot E in {RESERVED, CONFIRMED} iff
        NOT ( new.window_close_utc + TURNAROUND_MINUTES <= E.window_open_utc
              OR E.window_close_utc + TURNAROUND_MINUTES <= new.window_open_utc )
      i.e. a gap of AT LEAST 45 minutes must exist on one side; a gap of exactly 45 minutes is allowed
      (boundary: >= is passing, < is conflict). Slots in REQUESTED/RELEASED/CONSUMED never conflict.
    input_set: "RangeSlots sharing the new slot's range_code with status in {RESERVED, CONFIRMED}"
    constants:
      TURNAROUND_MINUTES: 45

  - name: exclusion_window_checks
    trigger: "COLA rule at POST /rideshare/range-slots/{id}/confirm; WEATHER rule at POST /rideshare/missions/{id}/launch"
    algorithm: interval_merge
    formula: |
      WEATHER (instant membership, half-open): at launch instant t, a WEATHER ExclusionWindow
        scoped to the slot's range_code blocks launch iff start_utc <= t < end_utc.
        Boundary: t == start_utc blocks; t == end_utc is clear.
      COLA (window intersection, half-open): a COLA ExclusionWindow scoped to the mission's
        target_orbit blocks confirm iff slot.window_open_utc < W.end_utc AND W.start_utc < slot.window_close_utc.
        Touching intervals (slot.window_close_utc == W.start_utc or slot.window_open_utc == W.end_utc) do NOT conflict.
    input_set: "ExclusionWindows matching scope (range for WEATHER, orbit for COLA)"
    constants: {}

  - name: separation_sequence
    trigger: "POST /rideshare/missions/{id}/launch (creates SeparationEvents)"
    algorithm: chronological
    formula: |
      Candidates: the mission's assignments that are INTEGRATED at launch.
      Order: dispenser port stack_position DESCENDING (tip of the stack deploys first);
             tie-break: ManifestAssignment.created_at ASCENDING. (ids never used for ordering.)
      Offsets: offset[0] = 0; for i >= 1:
        gap_i = BASE_GAP_S + (SAME_INTERFACE_EXTRA_GAP_S if payload[i].interface_class == payload[i-1].interface_class else 0)
        offset[i] = offset[i-1] + gap_i
      sequence_index is the 0-based position in this order.
    input_set: "ManifestAssignments of the mission with status INTEGRATED at launch time"
    constants:
      BASE_GAP_S: 30
      SAME_INTERFACE_EXTRA_GAP_S: 15

  - name: delay_cascade_assessment
    trigger: "POST /rideshare/missions/{id}/delay"
    algorithm: constraint_propagation
    formula: |
      1. Mission window := [new_window_open_utc, new_window_close_utc]; create DelayEvent.
      2. If mission was RANGE_SCHEDULED: the CONFIRMED slot no longer contains the new window
         (containment test: slot.open <= new.open AND slot.close >= new.close) =>
         slot -> RELEASED, DelayEvent.slot_released = true, mission -> MANIFEST_LOCKED.
         (If the slot still contains the new window, the slot stays CONFIRMED and the mission
         stays RANGE_SCHEDULED; pin: a containing slot is never released by delay.)
      3. For every LaunchContract whose target_mission_id == this mission OR which has a live
         assignment on this mission, processed in contract.created_at ASC order:
         if contract.window_close_utc < new_window_close_utc, the contract is IMPACTED:
           - its payloads' live assignments on THIS mission -> REMOVED (each with full release
             side effects: payload -> REGISTERED, capacity recompute)
           - contract MANIFESTED -> SIGNED (after its last live assignment leaves)
           - contract.rebook_eligible := true
      4. Recompute mission commitment fields. DelayEvent.assignments_removed_count = number removed.
      Contracts whose window still covers the new mission window are untouched.
    input_set: "The delayed mission, its slots, and contracts referencing or manifested on it"
    constants: {}

  - name: expiry_sweep
    trigger: "POST /_clock/set_current_utc (runs synchronously after the clock moves)"
    algorithm: checkpoint
    formula: |
      For every LaunchContract in SIGNED with window_close_utc < now: -> EXPIRED, rebook_eligible := false.
      For every RegulatoryLicense in GRANTED with valid_until < now: -> EXPIRED (no assignment cascade).
      Contracts in DRAFT, MANIFESTED, FULFILLED are never swept. Licenses in SUBMITTED/DENIED/REVOKED are never swept.
    input_set: "All contracts and licenses, filtered by the states above"
    constants: {}

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The X-User-Role must be in the endpoint's roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "Customer scoping: a Customer-role caller may only touch contracts/licenses/payloads/delay-events of the customer whose id equals X-User-ID; violations surface as not-found, never as a permission leak"
    error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "GET /rideshare/contracts/{id}, POST /rideshare/contracts/{id}/sign, POST /rideshare/contracts/{id}/rebook, GET /rideshare/contracts/{id}/payloads, and Customer-role list endpoints (auto-filter to own customer_id)"

  - priority: 4
    category: existence
    check: "Request shape: all required fields present, enum values in domain, numeric domains (mass_kg > 0, volume_m3 > 0, max_mass_kg > 0, scores 0..100), window_open strictly before window_close, WEATHER windows scope RANGE, COLA windows scope ORBIT, subject_type/kind coherence on license creation (MISSION<=>LAUNCH_AUTHORIZATION, CUSTOMER<=>PAYLOAD_OPERATOR, and the matching FK present)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

  - priority: 5
    category: existence
    check: "Referenced resources exist, validated left-to-right in path, then body fields in declared input order"
    error_id: "ERR_CUSTOMER_NOT_FOUND / ERR_MISSION_NOT_FOUND / ERR_CONTRACT_NOT_FOUND / ERR_PAYLOAD_NOT_FOUND / ERR_DISPENSER_PORT_NOT_FOUND / ERR_ASSIGNMENT_NOT_FOUND / ERR_RANGE_SLOT_NOT_FOUND / ERR_LICENSE_NOT_FOUND / ERR_SEPARATION_EVENT_NOT_FOUND / ERR_ANOMALY_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 6
    category: existence
    check: "OCC: expected_mission_version must equal Mission.version on POST /rideshare/assignments; expected_contract_version must equal LaunchContract.version on POST /rideshare/contracts/{id}/rebook"
    error_id: "ERR_STALE_MISSION_VERSION / ERR_STALE_CONTRACT_VERSION"
    http_status: 412
    applies_to: "POST /rideshare/assignments, POST /rideshare/contracts/{id}/rebook"

  - priority: 7
    category: state
    check: "Lifecycle precondition of the target resource(s): mission/contract/assignment/slot/event/anomaly/license in a from-state of the requested transition; assignment creation requires mission MANIFEST_OPEN (ERR_MANIFEST_LOCKED), payload REGISTERED (ERR_PAYLOAD_ALREADY_MANIFESTED), contract SIGNED or MANIFESTED (ERR_CONTRACT_NOT_SIGNED); rebook requires contract SIGNED and target mission MANIFEST_OPEN (ERR_REBOOKING_NOT_ELIGIBLE); confirm requires verifications/safety review state (ERR_VERIFICATION_INCOMPLETE, ERR_SAFETY_REVIEW_REQUIRED); ANOMALOUS->EXECUTED requires all mission anomalies RESOLVED (ERR_ANOMALIES_UNRESOLVED)"
    error_id: "ERR_INVALID_STATE / ERR_CONTRACT_NOT_SIGNED / ERR_MANIFEST_LOCKED / ERR_PAYLOAD_ALREADY_MANIFESTED / ERR_REBOOKING_NOT_ELIGIBLE / ERR_VERIFICATION_INCOMPLETE / ERR_SAFETY_REVIEW_REQUIRED / ERR_ANOMALIES_UNRESOLVED"
    http_status: 409
    applies_to: "state transition and creation endpoints"

  - priority: 8
    category: business_safety
    check: "Regulatory and safety gates: PAYLOAD_OPERATOR license GRANTED for the payload's customer at assignment confirm; LAUNCH_AUTHORIZATION GRANTED with valid_until >= slot close at range-slot confirm; segregation of duties (safety reviewer must not equal any PASSED verification's created_by_user_id, ERR_SOD_VIOLATION 403); license composite >= 70 for GRANT (ERR_LICENSE_SCORE_TOO_LOW); COLA window intersection (ERR_COLA_CONFLICT); WEATHER instant membership (ERR_WEATHER_HOLD)"
    error_id: "ERR_LICENSE_NOT_GRANTED / ERR_LICENSE_SCORE_TOO_LOW / ERR_SOD_VIOLATION / ERR_COLA_CONFLICT / ERR_WEATHER_HOLD"
    http_status: 422
    applies_to: "confirm/review/license-transition/range-confirm/launch endpoints"

  - priority: 9
    category: business_temporal
    check: "Window arithmetic: contract window must cover the mission window at assignment creation and rebook (ERR_WINDOW_INCOMPATIBLE); slot window must contain the mission window at confirm (ERR_WINDOW_INCOMPATIBLE); launch instant within mission and slot windows (ERR_LAUNCH_WINDOW_VIOLATION); delay new_window_open must be strictly after the previous window_open (ERR_DELAY_REGRESSION)"
    error_id: "ERR_WINDOW_INCOMPATIBLE / ERR_LAUNCH_WINDOW_VIOLATION / ERR_DELAY_REGRESSION"
    http_status: 422
    applies_to: "assignment create, rebook, range confirm, launch, delay"

  - priority: 10
    category: business_constraint
    check: "Compatibility and uniqueness: payload.required_orbit == mission.target_orbit (ERR_ORBIT_MISMATCH); payload.interface_class in port.supported_interface_classes (ERR_INTERFACE_INCOMPATIBLE); port has no other live assignment (ERR_PORT_OCCUPIED); contract.target_mission_id unset or equal to the assignment's mission (ERR_MISSION_MISMATCH); port_code/stack_position uniqueness (ERR_DUPLICATE_PORT_CODE)"
    error_id: "ERR_ORBIT_MISMATCH / ERR_INTERFACE_INCOMPATIBLE / ERR_PORT_OCCUPIED / ERR_MISSION_MISMATCH / ERR_DUPLICATE_PORT_CODE"
    http_status: 422
    applies_to: "assignment create, dispenser port create"

  - priority: 11
    category: business_fiscal
    check: "Capacity: after adding the payload, mission committed_mass_kg <= mass_capacity_kg (equality allowed) else ERR_MASS_CAPACITY_EXCEEDED; then committed_volume_m3 <= volume_capacity_m3 else ERR_VOLUME_CAPACITY_EXCEEDED; port.max_mass_kg >= payload.mass_kg else ERR_MASS_CAPACITY_EXCEEDED"
    error_id: "ERR_MASS_CAPACITY_EXCEEDED / ERR_VOLUME_CAPACITY_EXCEEDED"
    http_status: 422
    applies_to: "POST /rideshare/assignments"

# =============================================================================
# §1.5 API Endpoint Table (40 endpoints)
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-09-01T00:00:00Z and never wall-clock; every time rule reads this clock. After moving, runs calculations.expiry_sweep synchronously."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["calculations.expiry_sweep (contract and license expiry)"]

  # --- customers ---
  - method: POST
    path: "/rideshare/customers"
    description: "Register a customer organization"
    roles: [PlatformAdmin]
    code: 201
    input: [org_name, contact_email, "default_rebookings?"]
    output: Customer
    side_effects: []

  # --- missions ---
  - method: POST
    path: "/rideshare/missions"
    description: "Create a rideshare mission (status MANIFEST_OPEN, commitment fields 0)"
    roles: [MissionOps]
    code: 201
    input: [mission_name, target_orbit, window_open_utc, window_close_utc, mass_capacity_kg, volume_capacity_m3]
    output: Mission
    side_effects: []

  - method: GET
    path: "/rideshare/missions/{id}"
    description: "Read a mission including computed commitment and revenue fields"
    roles: [MissionOps, RangeOfficer, IntegrationEngineer, SafetyOfficer, ContractManager, Regulator, PlatformAdmin, Customer]
    code: 200
    input: []
    output: Mission
    side_effects: []

  - method: POST
    path: "/rideshare/missions/{id}/lock-manifest"
    description: "MANIFEST_OPEN -> MANIFEST_LOCKED; flips CONFIRMED assignments to INTEGRATED and stores both integration revenue totals"
    roles: [MissionOps]
    code: 200
    input: []
    output: Mission
    side_effects: ["assignments CONFIRMED -> INTEGRATED", "calculations.integration_fee_ledger totals", "increments Mission.version by 1"]

  - method: POST
    path: "/rideshare/missions/{id}/launch"
    description: "RANGE_SCHEDULED -> LAUNCHED; consumes the confirmed slot and creates SeparationEvents per calculations.separation_sequence"
    roles: [MissionOps]
    code: 200
    input: []
    output: Mission
    side_effects: ["RangeSlot CONFIRMED -> CONSUMED", "calculations.separation_sequence creates SeparationEvents", "increments Mission.version by 1"]

  - method: POST
    path: "/rideshare/missions/{id}/scrub"
    description: "MANIFEST_LOCKED or RANGE_SCHEDULED -> SCRUBBED; releases slots, removes live assignments, reverts contracts with rebook_eligible=true"
    roles: [MissionOps]
    code: 200
    input: [reason_code]
    output: Mission
    side_effects: ["RangeSlot RESERVED/CONFIRMED -> RELEASED", "live assignments -> REMOVED", "payloads -> REGISTERED", "contracts MANIFESTED -> SIGNED with rebook_eligible=true", "increments Mission.version by 1"]

  - method: POST
    path: "/rideshare/missions/{id}/delay"
    description: "Move the mission window later; runs calculations.delay_cascade_assessment (slot release, contract impact sweep, assignment removals)"
    roles: [MissionOps]
    code: 201
    input: [new_window_open_utc, new_window_close_utc, reason_code]
    output: DelayEvent
    side_effects: ["calculations.delay_cascade_assessment", "increments Mission.version by 1"]

  - method: POST
    path: "/rideshare/missions/{id}/dispenser-ports"
    description: "Add a dispenser port to a mission (port_code and stack_position unique per mission)"
    roles: [MissionOps]
    code: 201
    input: [port_code, stack_position, max_mass_kg, supported_interface_classes]
    output: DispenserPort
    side_effects: []

  - method: GET
    path: "/rideshare/missions/{id}/dispenser-ports"
    description: "List dispenser ports of a mission, ordered by stack_position DESC"
    roles: [MissionOps, IntegrationEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: DispenserPort[]
    side_effects: []

  - method: GET
    path: "/rideshare/missions/{id}/range-slots"
    description: "List range slots of a mission"
    roles: [MissionOps, RangeOfficer]
    code: 200
    input: ["status?"]
    output: RangeSlot[]
    side_effects: []

  - method: GET
    path: "/rideshare/missions/{id}/delay-events"
    description: "List delay events of a mission"
    roles: [MissionOps, ContractManager, Customer]
    code: 200
    input: []
    output: DelayEvent[]
    side_effects: []

  - method: GET
    path: "/rideshare/missions/{id}/anomalies"
    description: "List anomaly reports of a mission"
    roles: [MissionOps, SafetyOfficer]
    code: 200
    input: ["status?"]
    output: AnomalyReport[]
    side_effects: []

  # --- contracts & payloads ---
  - method: POST
    path: "/rideshare/contracts"
    description: "Create a contract in DRAFT with its payloads atomically (bulk: any invalid payload fails the whole create); rebookings_remaining omitted or -1 inherits customer.default_rebookings"
    roles: [ContractManager]
    code: 201
    input: [customer_id, pricing_mode, window_open_utc, window_close_utc, payloads, "target_mission_id?", "rebookings_remaining?"]
    output: LaunchContract
    side_effects: ["creates one Payload row per payloads[] entry (REGISTERED)"]

  - method: GET
    path: "/rideshare/contracts"
    description: "List contracts, ordered by created_at ASC; Customer role sees only its own"
    roles: [ContractManager, Customer, MissionOps]
    code: 200
    input: ["customer_id?", "target_mission_id?", "status?", "limit?", "offset?"]
    output: LaunchContract[]
    side_effects: []

  - method: GET
    path: "/rideshare/contracts/{id}"
    description: "Read a contract including quoted price, fees, and rebooking counters"
    roles: [ContractManager, Customer, MissionOps]
    code: 200
    input: []
    output: LaunchContract
    side_effects: []

  - method: POST
    path: "/rideshare/contracts/{id}/sign"
    description: "DRAFT -> SIGNED by the owning customer; computes quoted_price_cents via calculations.contract_price_quote"
    roles: [Customer]
    code: 200
    input: []
    output: LaunchContract
    side_effects: ["calculations.contract_price_quote", "increments LaunchContract.version by 1"]

  - method: POST
    path: "/rideshare/contracts/{id}/rebook"
    description: "Retarget a SIGNED contract to a later mission; computes calculations.rebooking_fee (eligibility waiver > rights consumption > bracketed fee)"
    roles: [Customer, ContractManager]
    code: 200
    input: [to_mission_id, expected_contract_version]
    output: LaunchContract
    side_effects: ["calculations.rebooking_fee", "sets target_mission_id", "increments LaunchContract.version by 1"]

  - method: GET
    path: "/rideshare/contracts/{id}/payloads"
    description: "List payloads of a contract, returned in the order they were declared in the contract create payloads array"
    roles: [ContractManager, Customer, MissionOps, IntegrationEngineer]
    code: 200
    input: ["status?"]
    output: Payload[]
    side_effects: []

  # --- manifest assignments ---
  - method: POST
    path: "/rideshare/assignments"
    description: "Manifest a payload onto a mission port (PROVISIONAL); reserves capacity and computes the per-line integration fee. OCC-guarded on Mission.version."
    roles: [MissionOps]
    code: 201
    input: [mission_id, payload_id, dispenser_port_id, expected_mission_version]
    output: ManifestAssignment
    side_effects: ["calculations.manifest_commitment recompute", "payload REGISTERED -> MANIFESTED", "contract SIGNED -> MANIFESTED (first live assignment)", "calculations.integration_fee_ledger per-line fee", "increments Mission.version by 1"]

  - method: GET
    path: "/rideshare/assignments"
    description: "List assignments with filters, ordered by created_at ASC"
    roles: [MissionOps, IntegrationEngineer, SafetyOfficer]
    code: 200
    input: ["mission_id?", "payload_id?", "dispenser_port_id?", "status?", "limit?", "offset?"]
    output: ManifestAssignment[]
    side_effects: []

  - method: GET
    path: "/rideshare/assignments/{id}"
    description: "Read an assignment including its integration_fee_cents"
    roles: [MissionOps, IntegrationEngineer, SafetyOfficer]
    code: 200
    input: []
    output: ManifestAssignment
    side_effects: []

  - method: POST
    path: "/rideshare/assignments/{id}/confirm"
    description: "PROVISIONAL -> CONFIRMED; requires passed MECHANICAL+ELECTRICAL verifications, latest safety review APPROVE, and a GRANTED PAYLOAD_OPERATOR license for the customer"
    roles: [MissionOps]
    code: 200
    input: []
    output: ManifestAssignment
    side_effects: ["increments ManifestAssignment.version by 1"]

  - method: POST
    path: "/rideshare/assignments/{id}/remove"
    description: "PROVISIONAL or CONFIRMED -> REMOVED; releases capacity and bubbles up to payload and contract"
    roles: [MissionOps]
    code: 200
    input: ["reason_code?"]
    output: ManifestAssignment
    side_effects: ["calculations.manifest_commitment recompute", "payload -> REGISTERED", "contract MANIFESTED -> SIGNED if no other live assignments", "increments Mission.version by 1"]

  - method: POST
    path: "/rideshare/assignments/{id}/verifications"
    description: "Record an interface verification (immutable); latest outcome per check_type governs confirm"
    roles: [IntegrationEngineer]
    code: 201
    input: [check_type, outcome, "notes?"]
    output: InterfaceVerification
    side_effects: ["stores created_by_user_id from X-User-ID"]

  - method: GET
    path: "/rideshare/assignments/{id}/verifications"
    description: "List interface verifications of an assignment"
    roles: [IntegrationEngineer, SafetyOfficer, MissionOps]
    code: 200
    input: ["check_type?", "outcome?"]
    output: InterfaceVerification[]
    side_effects: []

  - method: POST
    path: "/rideshare/assignments/{id}/safety-reviews"
    description: "Record a safety review decision (immutable); segregation of duties forbids reviewing one's own PASSED verification"
    roles: [SafetyOfficer]
    code: 201
    input: [decision, "rationale?"]
    output: SafetyReview
    side_effects: ["stores created_by_user_id from X-User-ID"]

  - method: GET
    path: "/rideshare/assignments/{id}/safety-reviews"
    description: "List safety reviews of an assignment"
    roles: [SafetyOfficer, MissionOps]
    code: 200
    input: ["decision?"]
    output: SafetyReview[]
    side_effects: []

  # --- regulatory licensing ---
  - method: POST
    path: "/rideshare/licenses"
    description: "File a license application (SUBMITTED); computes composite_score. MISSION subject requires role MissionOps + mission_id; CUSTOMER subject requires role Customer with X-User-ID == customer_id"
    roles: [MissionOps, Customer]
    code: 201
    input: [subject_type, kind, valid_until, debris_score, spectrum_score, operator_history_score, "mission_id?", "customer_id?"]
    output: RegulatoryLicense
    side_effects: ["calculations.license_composite_score"]

  - method: GET
    path: "/rideshare/licenses"
    description: "List licenses, ordered by created_at ASC; Customer role sees only its own"
    roles: [Regulator, MissionOps, Customer]
    code: 200
    input: ["mission_id?", "customer_id?", "kind?", "status?", "limit?", "offset?"]
    output: RegulatoryLicense[]
    side_effects: []

  - method: GET
    path: "/rideshare/licenses/{id}"
    description: "Read a license including composite_score"
    roles: [Regulator, MissionOps, Customer]
    code: 200
    input: []
    output: RegulatoryLicense
    side_effects: []

  - method: POST
    path: "/rideshare/licenses/{id}/transition"
    description: "SUBMITTED -> GRANTED/DENIED; GRANTED -> REVOKED. CUSTOMER PAYLOAD_OPERATOR revoke cascades to remove that customer's live assignments on unlaunched missions."
    roles: [Regulator]
    code: 200
    input: [to_state]
    output: RegulatoryLicense
    side_effects: ["on REVOKED of a CUSTOMER PAYLOAD_OPERATOR license: live assignments -> REMOVED with full release/bubble-up side effects", "increments RegulatoryLicense.version by 1"]

  # --- range scheduling ---
  - method: POST
    path: "/rideshare/range-slots"
    description: "Request range time for a mission (REQUESTED)"
    roles: [RangeOfficer]
    code: 201
    input: [mission_id, range_code, window_open_utc, window_close_utc]
    output: RangeSlot
    side_effects: []

  - method: POST
    path: "/rideshare/range-slots/{id}/reserve"
    description: "REQUESTED -> RESERVED; enforces calculations.range_slot_overlap turnaround buffer against other operators' slots"
    roles: [RangeOfficer]
    code: 200
    input: []
    output: RangeSlot
    side_effects: ["increments RangeSlot.version by 1"]

  - method: POST
    path: "/rideshare/range-slots/{id}/confirm"
    description: "RESERVED -> CONFIRMED; requires slot contains mission window, mission LAUNCH_AUTHORIZATION GRANTED and valid through slot close, COLA clear; mission auto-advances to RANGE_SCHEDULED"
    roles: [RangeOfficer]
    code: 200
    input: []
    output: RangeSlot
    side_effects: ["mission MANIFEST_LOCKED -> RANGE_SCHEDULED", "increments RangeSlot.version by 1"]

  - method: POST
    path: "/rideshare/exclusion-windows"
    description: "Publish a WEATHER (range-scoped) or COLA (orbit-scoped) exclusion window; half-open [start_utc, end_utc)"
    roles: [RangeOfficer]
    code: 201
    input: [scope_type, scope_value, kind, start_utc, end_utc]
    output: ExclusionWindow
    side_effects: []

  # --- post-launch ---
  - method: GET
    path: "/rideshare/separation-events"
    description: "List separation events with filters, ordered by sequence_index ASC"
    roles: [MissionOps, IntegrationEngineer, SafetyOfficer]
    code: 200
    input: ["mission_id?", "assignment_id?", "status?", "limit?", "offset?"]
    output: SeparationEvent[]
    side_effects: []

  - method: GET
    path: "/rideshare/separation-events/{id}"
    description: "Read a separation event"
    roles: [MissionOps, IntegrationEngineer, SafetyOfficer]
    code: 200
    input: []
    output: SeparationEvent
    side_effects: []

  - method: POST
    path: "/rideshare/separation-events/{id}/report-outcome"
    description: "PLANNED -> EXECUTED | ANOMALOUS; ANOMALOUS creates an AnomalyReport and requires anomaly_category+anomaly_severity; ANOMALOUS -> EXECUTED requires all mission anomalies RESOLVED"
    roles: [MissionOps]
    code: 200
    input: [outcome, "anomaly_category?", "anomaly_severity?"]
    output: SeparationEvent
    side_effects: ["on EXECUTED: assignment -> DEPLOYED, payload -> DEPLOYED, contract/mission bubble-up", "on ANOMALOUS: create AnomalyReport(OPEN)"]

  - method: POST
    path: "/rideshare/anomalies/{id}/transition"
    description: "OPEN -> UNDER_INVESTIGATION -> ESCALATED <-> UNDER_INVESTIGATION -> RESOLVED (disposition required at resolve)"
    roles: [MissionOps, SafetyOfficer]
    code: 200
    input: [to_state, "disposition?", "resolution_notes?"]
    output: AnomalyReport
    side_effects: ["increments AnomalyReport.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog (39 errors)
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not in the endpoint's roles list, or Customer filing a license for another customer_id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, enum outside domain, non-positive mass/volume, inverted windows, WEATHER/COLA scope mismatch, license subject/kind incoherence, missing anomaly_category on ANOMALOUS outcome, missing disposition on RESOLVED transition" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "customer_id does not exist (or is invisible to a Customer-role caller by scoping)" }
  - { id: ERR_MISSION_NOT_FOUND, http: 404, condition: "mission id in path or body does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "contract id does not exist, or belongs to another customer for a Customer-role caller" }
  - { id: ERR_PAYLOAD_NOT_FOUND, http: 404, condition: "payload_id does not exist" }
  - { id: ERR_DISPENSER_PORT_NOT_FOUND, http: 404, condition: "dispenser_port_id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "assignment id does not exist" }
  - { id: ERR_RANGE_SLOT_NOT_FOUND, http: 404, condition: "range slot id does not exist" }
  - { id: ERR_LICENSE_NOT_FOUND, http: 404, condition: "license id does not exist" }
  - { id: ERR_SEPARATION_EVENT_NOT_FOUND, http: 404, condition: "separation event id does not exist" }
  - { id: ERR_ANOMALY_NOT_FOUND, http: 404, condition: "anomaly id does not exist" }
  - { id: ERR_STALE_MISSION_VERSION, http: 412, condition: "expected_mission_version != Mission.version on POST /rideshare/assignments" }
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "expected_contract_version != LaunchContract.version on rebook" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid lifecycle transition for the resource's current state" }
  - { id: ERR_CONTRACT_NOT_SIGNED, http: 409, condition: "Assignment creation against a contract not in {SIGNED, MANIFESTED}" }
  - { id: ERR_MANIFEST_LOCKED, http: 409, condition: "New assignment against a mission no longer MANIFEST_OPEN" }
  - { id: ERR_PAYLOAD_ALREADY_MANIFESTED, http: 409, condition: "Assignment creation for a payload not in REGISTERED" }
  - { id: ERR_VERIFICATION_INCOMPLETE, http: 409, condition: "Confirm without latest PASSED MECHANICAL and ELECTRICAL verifications" }
  - { id: ERR_SAFETY_REVIEW_REQUIRED, http: 409, condition: "Confirm without a latest SafetyReview decision of APPROVE" }
  - { id: ERR_ANOMALIES_UNRESOLVED, http: 409, condition: "ANOMALOUS -> EXECUTED while any mission anomaly is not RESOLVED" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "SafetyOfficer whose X-User-ID equals a PASSED verification's created_by_user_id on the same assignment" }
  - { id: ERR_LICENSE_NOT_GRANTED, http: 422, condition: "Required license missing, not GRANTED, or valid_until short of the gated window" }
  - { id: ERR_LICENSE_SCORE_TOO_LOW, http: 422, condition: "GRANT transition with composite_score < 70" }
  - { id: ERR_COLA_CONFLICT, http: 422, condition: "Range slot window intersects a COLA exclusion window for the mission's orbit (half-open intersection)" }
  - { id: ERR_WEATHER_HOLD, http: 422, condition: "Launch instant inside a WEATHER exclusion window for the slot's range (start <= t < end)" }
  - { id: ERR_LAUNCH_WINDOW_VIOLATION, http: 422, condition: "Launch instant outside the mission window or the confirmed slot window (closed bounds)" }
  - { id: ERR_WINDOW_INCOMPATIBLE, http: 422, condition: "Contract window does not cover the mission window, or slot window does not contain the mission window" }
  - { id: ERR_ORBIT_MISMATCH, http: 422, condition: "payload.required_orbit != mission.target_orbit" }
  - { id: ERR_INTERFACE_INCOMPATIBLE, http: 422, condition: "payload.interface_class not in port.supported_interface_classes" }
  - { id: ERR_PORT_OCCUPIED, http: 409, condition: "Dispenser port already carries a live (non-REMOVED) assignment" }
  - { id: ERR_MISSION_MISMATCH, http: 422, condition: "Contract has target_mission_id set and the assignment or check targets a different mission" }
  - { id: ERR_MASS_CAPACITY_EXCEEDED, http: 422, condition: "Mission committed_mass_kg would exceed mass_capacity_kg (strictly greater; equality allowed), or payload exceeds port max_mass_kg" }
  - { id: ERR_VOLUME_CAPACITY_EXCEEDED, http: 422, condition: "Mission committed_volume_m3 would exceed volume_capacity_m3 (checked after mass)" }
  - { id: ERR_RANGE_WINDOW_CONFLICT, http: 422, condition: "Range slot violates the 45-minute turnaround buffer against a RESERVED/CONFIRMED slot on the same range" }
  - { id: ERR_REBOOKING_NOT_ELIGIBLE, http: 409, condition: "Rebook with contract not SIGNED or target mission not MANIFEST_OPEN" }
  - { id: ERR_DELAY_REGRESSION, http: 422, condition: "new_window_open_utc not strictly after the mission's current window_open_utc" }
  - { id: ERR_DUPLICATE_PORT_CODE, http: 422, condition: "Dispenser port creation reusing a port_code or stack_position already present on the same mission" }

# =============================================================================
# §1.7 RBAC Matrix (8 roles)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; seeds customers and drives the logical clock"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc", "POST /rideshare/customers"]
    shared_operations: ["GET /rideshare/missions/{id}"]

  - name: MissionOps
    description: "Launch provider mission operator; owns missions, dispenser config, manifest assignments, launch, delay, scrub, deployment outcome reporting"
    identity: opaque
    exclusive_operations: ["POST /rideshare/missions", "POST /rideshare/missions/{id}/lock-manifest", "POST /rideshare/missions/{id}/launch", "POST /rideshare/missions/{id}/scrub", "POST /rideshare/missions/{id}/delay", "POST /rideshare/missions/{id}/dispenser-ports", "POST /rideshare/assignments", "POST /rideshare/assignments/{id}/confirm", "POST /rideshare/assignments/{id}/remove", "POST /rideshare/separation-events/{id}/report-outcome"]
    shared_operations: ["GET endpoints", "POST /rideshare/licenses (MISSION subject)", "POST /rideshare/anomalies/{id}/transition"]

  - name: ContractManager
    description: "Launch provider contracting officer; drafts contracts and may rebook on a customer's behalf"
    identity: opaque
    exclusive_operations: ["POST /rideshare/contracts"]
    shared_operations: ["GET /rideshare/contracts", "GET /rideshare/contracts/{id}", "GET /rideshare/contracts/{id}/payloads", "POST /rideshare/contracts/{id}/rebook", "GET /rideshare/missions/{id}/delay-events", "GET /rideshare/missions/{id}"]

  - name: Customer
    description: "Payload customer; signs and rebooks its own contracts, files its own payload-operator licenses, reads its own resources"
    identity: "entity_backed:Customer"
    exclusive_operations: ["POST /rideshare/contracts/{id}/sign"]
    shared_operations: ["GET /rideshare/contracts (own only)", "GET /rideshare/contracts/{id} (own only)", "GET /rideshare/contracts/{id}/payloads (own only)", "POST /rideshare/contracts/{id}/rebook (own only)", "POST /rideshare/licenses (CUSTOMER subject, own id)", "GET /rideshare/licenses (own only)", "GET /rideshare/missions/{id}/delay-events", "GET /rideshare/missions/{id}"]

  - name: IntegrationEngineer
    description: "Payload integration engineer; records mechanical/electrical interface verifications"
    identity: opaque
    exclusive_operations: ["POST /rideshare/assignments/{id}/verifications"]
    shared_operations: ["GET /rideshare/assignments", "GET /rideshare/assignments/{id}", "GET /rideshare/assignments/{id}/verifications", "GET /rideshare/missions/{id}/dispenser-ports", "GET /rideshare/separation-events", "GET /rideshare/separation-events/{id}", "GET /rideshare/missions/{id}", "GET /rideshare/contracts/{id}/payloads"]

  - name: SafetyOfficer
    description: "Independent safety reviewer; records safety review decisions and escalates anomalies; segregation of duties forbids reviewing an assignment whose PASSED verification they recorded"
    identity: opaque
    exclusive_operations: ["POST /rideshare/assignments/{id}/safety-reviews"]
    shared_operations: ["GET /rideshare/assignments", "GET /rideshare/assignments/{id}", "GET /rideshare/assignments/{id}/verifications", "GET /rideshare/assignments/{id}/safety-reviews", "GET /rideshare/separation-events", "GET /rideshare/separation-events/{id}", "GET /rideshare/missions/{id}/anomalies", "POST /rideshare/anomalies/{id}/transition", "GET /rideshare/missions/{id}"]

  - name: RangeOfficer
    description: "Range scheduling authority; manages range slots, reservations, confirmations, and publishes weather/COLA exclusion windows"
    identity: opaque
    exclusive_operations: ["POST /rideshare/range-slots", "POST /rideshare/range-slots/{id}/reserve", "POST /rideshare/range-slots/{id}/confirm", "POST /rideshare/exclusion-windows"]
    shared_operations: ["GET /rideshare/missions/{id}/range-slots", "GET /rideshare/missions/{id}"]

  - name: Regulator
    description: "Licensing authority; grants, denies, and revokes launch and payload-operator licenses"
    identity: opaque
    exclusive_operations: ["POST /rideshare/licenses/{id}/transition"]
    shared_operations: ["GET /rideshare/licenses", "GET /rideshare/licenses/{id}", "GET /rideshare/missions/{id}"]
