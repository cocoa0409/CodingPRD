# =============================================================================
# PRD Benchmark Seed Tables — task_2151_implant_device_udi_tracking
# Implant & Device Tracking (UDI)
# Sections §1.0 – §1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!2151. Implant & Device Tracking (UDI): implant receipt & serialized inventory by lot, case documentation of implanted device & patient linkage, recall/field-action lookup across implanted patients, consignment reconciliation & vendor billing, expiration monitoring & rotation, explant/return processing, registry submission requirement, charge capture accuracy for high-cost implants

domain_name: implant-device-udi-tracking
api_prefix: /udi

# =============================================================================
# §0.1–§0.3 Complexity Profile
# =============================================================================
complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: graph
  entity_topology_note: |
    No single ownership tree. DeviceUnit is the hub: it points at Lot, at
    ConsignmentAgreement, at VendorInvoice, at SurgicalCase (reservation), and
    at itself (replaced_unit_id). ImplantRecord is a three-way junction over
    SurgicalCase x DeviceUnit x Patient. RecallNotification is a junction over
    FieldAction x ImplantRecord x Patient. Cycles exist in the reference graph
    (DeviceUnit -> SurgicalCase -> ... -> ImplantRecord -> DeviceUnit).

  state_machine_shape: parallel
  state_machine_shape_note: |
    DeviceUnit carries two independent state dimensions on one row
    (custody_state x billing_state). SurgicalCase.cancel is a fork whose
    side-effect set differs per source state. RegistrySubmission and
    ImplantRecord both contain cycles. Lot and FieldAction are compound
    (their transitions are driven by aggregate child state).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  role_model_note: |
    Three named separations, each enforced on X-User-ID rather than on role:
    (1) the user who received a Lot may not release it from quarantine;
    (2) the user who documented an ImplantRecord may not verify it;
    (3) the user who matched a VendorInvoice may not approve it.

  consistency_model: immediate

  counts:
    entities: 14
    state_machines: 11
    concurrency_rules: 3
    calculations: 11
    validations: 31
    endpoints: 72
    errors: 49
    roles: 6

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Authentication contract (applies to every endpoint including /_clock)
# =============================================================================
auth_contract:
  headers:
    X-User-Role: "REQUIRED on every request. Must be one of the six §1.7 role names."
    X-User-ID: "REQUIRED on every request. For opaque roles any non-empty string is accepted and is persisted verbatim into actor fields (received_by_user_id, released_by_user_id, documented_by_user_id, verified_by_user_id, matched_by_user_id, approved_by_user_id). For the entity_backed role VendorRep it MUST equal an existing Vendor.id."
  missing_or_blank_either_header: "ERR_UNAUTHENTICATED (401)"
  unknown_role_value: "ERR_UNAUTHENTICATED (401)"
  vendorrep_id_not_a_vendor: "ERR_UNAUTHENTICATED (401)"

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal name of the implant manufacturer/distributor" }
      - { name: vendor_code, type: string, source: input, description: "Short vendor code", constraints: "globally unique, non-empty" }
      - { name: standing, type: enum, source: system, default: ACTIVE, description: "Commercial standing gate for invoicing", constraints: "ACTIVE | HOLD" }
      - { name: open_consignment_liability_cents, type: integer, source: computed, default: 0, description: "Money the hospital currently owes this vendor for consigned units; see calculations.vendor_open_consignment_liability" }
      - { name: recall_open_count, type: integer, source: computed, default: 0, description: "Count of this vendor's FieldActions whose status is in {PUBLISHED, IN_REMEDIATION}" }

  - name: ConsignmentAgreement
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; the vendor that owns the consigned stock" }
      - { name: agreement_code, type: string, source: input, description: "Contract reference", constraints: "unique per vendor_id" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Agreement lifecycle", constraints: "DRAFT | ACTIVE | EXPIRED" }
      - { name: billing_trigger, type: enum, source: input, description: "When a consigned unit becomes billable to the hospital", constraints: "ON_IMPLANT | ON_RECEIPT" }
      - { name: reconciliation_method, type: enum, source: input, description: "Selects which variant of calculations.consignment_expected_total runs at invoice match", constraints: "UNIT_MATCH | PERIOD_TRUEUP" }
      - { name: invoice_tolerance_bps, type: integer, source: input, default: 150, description: "Absolute variance tolerance in basis points; variance_bps strictly greater than this puts the invoice on VARIANCE_HOLD", constraints: ">= 0 and <= 10000" }
      - { name: price_list_version, type: integer, source: system, default: 1, description: "Monotonic counter; incremented by POST /udi/consignment-agreements/{agreement_id}/price-list-revisions" }
      - { name: period_start_utc, type: datetime, source: input, description: "Inclusive lower bound of the true-up period" }
      - { name: period_end_utc, type: datetime, source: input, description: "Inclusive upper bound of the true-up period" }
      - { name: replenishment_days, type: integer, source: input, default: 14, description: "Contractual replenishment SLA in days; reported by ops-runs, not enforced" }

  - name: CatalogItem
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; the manufacturer of this device model" }
      - { name: device_identifier, type: string, source: input, description: "UDI-DI (GS1 GTIN-14) of the device model", constraints: "globally unique, non-empty" }
      - { name: description, type: string, source: input, description: "Human-readable device description" }
      - { name: category, type: enum, source: input, description: "Charge-policy class", constraints: "HIGH_COST_IMPLANT | STANDARD_IMPLANT | ACCESSORY" }
      - { name: list_charge_cents, type: integer, source: input, description: "Chargemaster list price in cents; the PROVISIONAL base of calculations.implant_charge_amount", constraints: "> 0" }
      - { name: charge_code, type: string, source: input, description: "Chargemaster code stamped onto every ChargeCapture for this item" }
      - { name: registry_required, type: boolean, source: input, default: false, description: "When true, verifying an ImplantRecord for this item creates a RegistrySubmission" }
      - { name: shelf_life_days, type: integer, source: input, description: "Nominal shelf life, informational only" }
      - { name: on_hand_available_qty, type: integer, source: computed, default: 0, description: "Count of DeviceUnits under this catalog item whose custody_state is AVAILABLE" }

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - { name: catalog_item_id, type: string, source: input, description: "FK -> CatalogItem.id; the device model this lot contains" }
      - { name: lot_number, type: string, source: input, description: "Manufacturer lot/batch number (UDI-PI lot)", constraints: "unique per catalog_item_id" }
      - { name: expiration_date, type: string, source: input, description: "Calendar expiry as YYYY-MM-DD; the expiry INSTANT is this date at 23:59:59.999Z" }
      - { name: status, type: enum, source: system, default: QUARANTINE, description: "Lot lifecycle", constraints: "QUARANTINE | AVAILABLE | RECALLED | EXPIRED | DEPLETED" }
      - { name: received_at_utc, type: datetime, source: system, description: "Logical-clock instant at which POST /udi/lots was accepted" }
      - { name: received_by_user_id, type: string, source: system, description: "X-User-ID of the actor that created the lot; separation-of-duties source for quarantine release" }
      - { name: released_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the actor that released the lot from quarantine" }
      - { name: received_qty, type: integer, source: computed, default: 0, description: "Count of all DeviceUnits ever created on this lot" }
      - { name: on_hand_qty, type: integer, source: computed, default: 0, description: "Count of this lot's DeviceUnits whose custody_state is in {QUARANTINED, AVAILABLE, RESERVED, RECALL_HOLD}" }
      - { name: consumed_qty, type: integer, source: computed, default: 0, description: "Count of this lot's DeviceUnits whose custody_state is in {IMPLANTED, EXPLANTED, WASTED, EXPIRED, RETURNED_TO_VENDOR, DISPOSED}" }

  - name: DeviceUnit
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; the lot this serialized unit was received under" }
      - { name: consignment_agreement_id, type: string, source: input, default: null, description: "FK -> ConsignmentAgreement.id; null means the unit is hospital-OWNED stock and never becomes billable" }
      - { name: vendor_invoice_id, type: string, source: system, default: null, description: "FK -> VendorInvoice.id; set when the unit is placed on an invoice, cleared when that invoice is disputed" }
      - { name: reserved_case_id, type: string, source: system, default: null, description: "FK -> SurgicalCase.id; non-null exactly while custody_state is RESERVED" }
      - { name: replaced_unit_id, type: string, source: input, default: null, description: "FK -> DeviceUnit.id; self-reference set on a replacement unit implanted after an explant" }
      - { name: udi_serial, type: string, source: input, description: "UDI-PI serial number", constraints: "unique per catalog item (resolved through lot_id -> catalog_item_id)" }
      - { name: udi_di_snapshot, type: string, source: system, description: "Copy of CatalogItem.device_identifier taken at unit receipt" }
      - { name: custody_state, type: enum, source: system, default: QUARANTINED, description: "Physical custody dimension", constraints: "QUARANTINED | AVAILABLE | RESERVED | IMPLANTED | EXPLANTED | RECALL_HOLD | EXPIRED | WASTED | RETURNED_TO_VENDOR | DISPOSED" }
      - { name: billing_state, type: enum, source: system, default: NOT_BILLABLE, description: "Financial dimension, evolves independently of custody_state", constraints: "NOT_BILLABLE | BILLABLE | INVOICED | RECONCILED | CREDIT_PENDING | CREDITED" }
      - { name: ownership, type: enum, source: system, default: OWNED, description: "CONSIGNED when consignment_agreement_id is non-null at receipt, otherwise OWNED", constraints: "CONSIGNED | OWNED" }
      - { name: acquisition_cost_cents, type: integer, source: input, description: "Negotiated purchase price for THIS serial, captured at receipt; the FINAL base of calculations.implant_charge_amount", constraints: "> 0" }
      - { name: contract_price_cents, type: integer, source: system, default: null, description: "Frozen copy of acquisition_cost_cents taken at the moment billing_state first becomes BILLABLE" }
      - { name: price_list_version_at_billing, type: integer, source: system, default: null, description: "Copy of ConsignmentAgreement.price_list_version taken at the same moment as contract_price_cents" }
      - { name: implanted_at_utc, type: datetime, source: system, default: null, description: "Logical-clock instant at which custody_state became IMPLANTED" }
      - { name: expired_at_utc, type: datetime, source: system, default: null, description: "Logical-clock instant at which an ops-run moved this unit to EXPIRED" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: mrn, type: string, source: input, description: "Medical record number", constraints: "globally unique, non-empty" }
      - { name: display_name, type: string, source: input, description: "Patient display name" }
      - { name: registry_consent, type: enum, source: input, default: UNKNOWN, description: "Consent to national implant registry submission", constraints: "GRANTED | DECLINED | UNKNOWN" }
      - { name: implant_count, type: integer, source: computed, default: 0, description: "Count of ImplantRecords for this patient whose status is in {DOCUMENTED, VERIFIED, AMENDED, EXPLANTED}" }

  - name: SurgicalCase
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; the patient this case operates on" }
      - { name: case_number, type: string, source: input, description: "Operating-room case number", constraints: "globally unique, non-empty" }
      - { name: or_room_code, type: string, source: input, description: "Operating room identifier; the temporal resource guarded by the half-open room-overlap rule" }
      - { name: scheduled_start_utc, type: datetime, source: input, description: "Inclusive start of the room booking" }
      - { name: scheduled_end_utc, type: datetime, source: input, description: "Exclusive end of the room booking", constraints: "strictly after scheduled_start_utc" }
      - { name: surgeon_code, type: string, source: input, description: "Operating surgeon identifier" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Case lifecycle", constraints: "SCHEDULED | IN_PROGRESS | CLOSED | CANCELLED | ABORTED" }
      - { name: readiness_status, type: enum, source: computed, default: READY, description: "Close-gate posture; see calculations.case_close_readiness", constraints: "READY | BLOCKED_RESERVATION | BLOCKED_DOCUMENTATION | BLOCKED_REGISTRY | BLOCKED_CHARGE" }
      - { name: blocked_reservation_count, type: integer, source: system, default: 0, description: "Incremented by one each time a unit reserved to this case is force-detached by a recall or expiry cascade; decremented by one (floor 0) on each successful reservation" }
      - { name: total_posted_charge_cents, type: integer, source: computed, default: 0, description: "Sum of effective_charge_cents over this case's ChargeCaptures whose status is in {POSTED, CORRECTION_REQUIRED, FINALIZED}" }
      - { name: implant_record_count, type: integer, source: computed, default: 0, description: "Count of ImplantRecords for this case whose status is not VOIDED" }

  - name: ImplantRecord
    parent: null
    common_fields: true
    fields:
      - { name: surgical_case_id, type: string, source: input, description: "FK -> SurgicalCase.id; the case in which the device was implanted" }
      - { name: device_unit_id, type: string, source: input, description: "FK -> DeviceUnit.id; the serialized unit that was implanted" }
      - { name: patient_id, type: string, source: input, default: null, description: "FK -> Patient.id; when omitted it is copied from the case, when supplied it MUST equal SurgicalCase.patient_id" }
      - { name: status, type: enum, source: system, default: DOCUMENTED, description: "Documentation lifecycle", constraints: "DOCUMENTED | VERIFIED | AMENDED | EXPLANTED | VOIDED" }
      - { name: udi_di, type: string, source: input, description: "UDI-DI transcribed at the point of care; MUST equal DeviceUnit.udi_di_snapshot" }
      - { name: udi_pi_serial, type: string, source: input, description: "UDI-PI serial transcribed at the point of care; MUST equal DeviceUnit.udi_serial" }
      - { name: anatomic_site, type: string, source: input, description: "Anatomic site of implantation" }
      - { name: laterality, type: enum, source: input, description: "Side of the body", constraints: "LEFT | RIGHT | BILATERAL | NOT_APPLICABLE" }
      - { name: documented_by_user_id, type: string, source: system, description: "X-User-ID of the actor that created the record; separation-of-duties source for verification" }
      - { name: verified_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the actor that most recently verified the record" }
      - { name: documented_at_utc, type: datetime, source: system, description: "Logical-clock instant of creation" }
      - { name: verified_at_utc, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent verification" }
      - { name: amendment_count, type: integer, source: system, default: 0, description: "Incremented by one on each VERIFIED -> AMENDED transition" }

  - name: ChargeCapture
    parent: null
    common_fields: true
    fields:
      - { name: implant_record_id, type: string, source: input, description: "FK -> ImplantRecord.id; the documented implant this charge line bills for" }
      - { name: charge_code, type: string, source: system, description: "Copy of CatalogItem.charge_code resolved through the implanted unit" }
      - { name: quantity, type: integer, source: input, default: 1, description: "Number of chargeable units on this line", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Charge lifecycle", constraints: "DRAFT | POSTED | CORRECTION_REQUIRED | FINALIZED | VOIDED" }
      - { name: provisional_charge_cents, type: integer, source: computed, description: "PROVISIONAL variant output of calculations.implant_charge_amount, computed at creation" }
      - { name: final_charge_cents, type: integer, source: computed, default: null, description: "FINAL variant output of calculations.implant_charge_amount, computed at finalize" }
      - { name: variance_cents, type: integer, source: computed, default: null, description: "provisional_charge_cents minus final_charge_cents, computed at finalize" }
      - { name: effective_charge_cents, type: integer, source: computed, description: "final_charge_cents when it is non-null, otherwise provisional_charge_cents" }
      - { name: capture_variant, type: enum, source: computed, default: PROVISIONAL, description: "Which variant produced effective_charge_cents", constraints: "PROVISIONAL | FINAL" }

  - name: RegistrySubmission
    parent: null
    common_fields: true
    fields:
      - { name: implant_record_id, type: string, source: system, description: "FK -> ImplantRecord.id; the verified implant this submission reports" }
      - { name: status, type: enum, source: system, default: REQUIRED, description: "Registry lifecycle", constraints: "REQUIRED | SUBMITTED | ACCEPTED | REJECTED | EXEMPT" }
      - { name: completeness_score, type: integer, source: computed, default: 0, description: "0-100 score from calculations.registry_completeness_score, recomputed on every read and on every submit attempt" }
      - { name: registry_code, type: string, source: input, default: null, description: "External registry identifier supplied at submit" }
      - { name: submitted_at_utc, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent submit" }
      - { name: adjudicated_at_utc, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent adjudication" }
      - { name: rejection_reason, type: string, source: input, default: null, description: "Reason recorded when an adjudication outcome is REJECTED" }
      - { name: resubmission_count, type: integer, source: system, default: 0, description: "Incremented by one on each REJECTED -> SUBMITTED transition" }
      - { name: deadline_utc, type: datetime, source: system, description: "verified_at_utc of the implant record plus REGISTRY_DEADLINE_DAYS" }

  - name: FieldAction
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; the vendor issuing the field action" }
      - { name: catalog_item_id, type: string, source: input, description: "FK -> CatalogItem.id; the device model in scope" }
      - { name: action_code, type: string, source: input, description: "Field-action reference", constraints: "globally unique, non-empty" }
      - { name: action_class, type: enum, source: input, description: "Regulatory severity class; drives RecallNotification.due_utc", constraints: "CLASS_I | CLASS_II | CLASS_III" }
      - { name: scope_type, type: enum, source: input, description: "How affected units are matched; see calculations.recall_exposure_cohort", constraints: "CATALOG | LOT | SERIAL_RANGE" }
      - { name: lot_numbers, type: array, source: input, default: null, description: "Lot numbers in scope; required when scope_type is LOT, otherwise MUST be omitted" }
      - { name: serial_low, type: string, source: input, default: null, description: "Inclusive lower bound of the affected serial range; required when scope_type is SERIAL_RANGE" }
      - { name: serial_high, type: string, source: input, default: null, description: "Inclusive upper bound of the affected serial range; required when scope_type is SERIAL_RANGE" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Field-action lifecycle", constraints: "DRAFT | PUBLISHED | IN_REMEDIATION | CLOSED" }
      - { name: effective_from_utc, type: datetime, source: input, description: "Regulatory effective instant; RecallNotification.due_utc is measured from here" }
      - { name: published_at_utc, type: datetime, source: system, default: null, description: "Logical-clock instant of publication" }
      - { name: implanted_cohort_size, type: integer, source: computed, default: 0, description: "Number of distinct ImplantRecords matched at publication" }
      - { name: on_hand_cohort_size, type: integer, source: computed, default: 0, description: "Number of DeviceUnits moved to RECALL_HOLD at publication" }
      - { name: notification_open_count, type: integer, source: computed, default: 0, description: "Count of this action's RecallNotifications whose status is PENDING" }

  - name: RecallNotification
    parent: null
    common_fields: true
    fields:
      - { name: field_action_id, type: string, source: system, description: "FK -> FieldAction.id; the action that produced this notification" }
      - { name: implant_record_id, type: string, source: system, description: "FK -> ImplantRecord.id; the implanted record in the exposure cohort" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; denormalized from the implant record for recall lookup" }
      - { name: status, type: enum, source: system, default: PENDING, description: "Outreach lifecycle", constraints: "PENDING | NOTIFIED | ACKNOWLEDGED | UNREACHABLE | CLOSED" }
      - { name: due_utc, type: datetime, source: system, description: "FieldAction.effective_from_utc plus the class-based outreach window" }
      - { name: outcome_note, type: string, source: input, default: null, description: "Free-text note recorded at resolution" }
      - { name: escalation_level, type: integer, source: system, default: 0, description: "Incremented by one per ops-run while the notification is PENDING and past due_utc" }

  - name: VendorInvoice
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; MUST equal X-User-ID of the submitting VendorRep" }
      - { name: consignment_agreement_id, type: string, source: input, description: "FK -> ConsignmentAgreement.id; the agreement being billed under" }
      - { name: invoice_number, type: string, source: input, description: "Vendor invoice number", constraints: "unique per vendor_id" }
      - { name: submitted_total_cents, type: integer, source: input, description: "Total the vendor is asking for, in cents", constraints: "> 0" }
      - { name: device_unit_ids, type: array, source: input, description: "Serial-level device units this invoice bills for", constraints: "non-empty" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "Invoice lifecycle", constraints: "SUBMITTED | MATCHED | VARIANCE_HOLD | DISPUTED | APPROVED" }
      - { name: expected_total_cents, type: integer, source: computed, default: null, description: "Output of calculations.consignment_expected_total, computed at match" }
      - { name: variance_cents, type: integer, source: computed, default: null, description: "submitted_total_cents minus expected_total_cents, computed at match" }
      - { name: variance_bps, type: integer, source: computed, default: null, description: "Absolute variance in basis points of expected_total_cents, computed at match" }
      - { name: reconciliation_variant, type: enum, source: computed, default: null, description: "Which variant of calculations.consignment_expected_total ran", constraints: "UNIT_MATCH | PERIOD_TRUEUP" }
      - { name: credit_applied_cents, type: integer, source: computed, default: null, description: "Output of calculations.net_consignment_settlement, computed at approve" }
      - { name: net_payable_cents, type: integer, source: computed, default: null, description: "expected_total_cents minus credit_applied_cents, computed at approve" }
      - { name: matched_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the actor that matched the invoice; separation-of-duties source for approval" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the actor that approved the invoice" }
      - { name: override_reason, type: string, source: input, default: null, description: "Justification required to approve an invoice sitting on VARIANCE_HOLD" }

  - name: ExplantRecord
    parent: null
    common_fields: true
    fields:
      - { name: implant_record_id, type: string, source: input, description: "FK -> ImplantRecord.id; the implant being reversed" }
      - { name: replacement_device_unit_id, type: string, source: input, default: null, description: "FK -> DeviceUnit.id; the unit implanted in place of the explanted one, when the explant is part of a revision" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "Return lifecycle", constraints: "RECORDED | RETURN_AUTHORIZED | SHIPPED | CREDIT_ISSUED | CREDIT_DENIED | DISPOSED_LOCALLY" }
      - { name: reason, type: enum, source: input, description: "Clinical reason for explantation", constraints: "DEVICE_FAILURE | INFECTION | RECALL | UPGRADE | OTHER" }
      - { name: explanted_at_utc, type: datetime, source: system, description: "Logical-clock instant at which the explant was recorded" }
      - { name: return_authorization_no, type: string, source: input, default: null, description: "Vendor RA number; required when disposition is RETURN_TO_VENDOR" }
      - { name: credit_expected_cents, type: integer, source: computed, description: "Output of calculations.explant_return_credit, computed at creation" }
      - { name: credit_issued_cents, type: integer, source: input, default: null, description: "Credit the vendor actually issued, recorded at POST /udi/explant-records/{explant_record_id}/credit" }

# =============================================================================
# §1.2 State Machine Table
#
# DeviceUnit carries TWO independent dimensions on one row. They are listed as
# two separate machines (state_field: custody_state and state_field:
# billing_state) and evolve independently: an IMPLANTED unit may be
# NOT_BILLABLE, BILLABLE, INVOICED or RECONCILED, and a CREDIT_PENDING unit may
# be EXPLANTED or RETURNED_TO_VENDOR.
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- DeviceUnit
  - entity: DeviceUnit
    state_field: custody_state
    shape: branching_with_cycle
    initial_state: QUARANTINED
    terminal_states: [EXPIRED, WASTED, RETURNED_TO_VENDOR, DISPOSED]
    transitions:

      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /udi/lots/{lot_id}/release (cascade from Lot.QUARANTINE_to_AVAILABLE)"
        actor: system
        preconditions:
          - "Lot.status == QUARANTINE"
          - "X-User-ID of the release request != Lot.received_by_user_id"
        side_effects:
          - "Lot.status := AVAILABLE"
          - "Lot.released_by_user_id := X-User-ID"
          - "Recompute Lot.on_hand_qty and Lot.consumed_qty"
          - "Recompute CatalogItem.on_hand_available_qty for the lot's catalog item"
          - "When ConsignmentAgreement.billing_trigger == ON_RECEIPT for a unit whose consignment_agreement_id is non-null: that unit's billing_state := BILLABLE, contract_price_cents := acquisition_cost_cents, price_list_version_at_billing := ConsignmentAgreement.price_list_version, and Vendor.open_consignment_liability_cents is recomputed"

      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /udi/surgical-cases/{case_id}/reservations"
        actor: CircClinician
        preconditions:
          - "Lot.status == AVAILABLE"
          - "SurgicalCase.status == SCHEDULED"
          - "The lot expiry instant is strictly after SurgicalCase.scheduled_end_utc"
          - "DeviceUnit.reserved_case_id is null"
        side_effects:
          - "DeviceUnit.reserved_case_id := SurgicalCase.id"
          - "SurgicalCase.blocked_reservation_count := max(0, blocked_reservation_count - 1)"
          - "Recompute CatalogItem.on_hand_available_qty"
          - "Recompute SurgicalCase.readiness_status"

      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /udi/device-units/{device_unit_id}/release-reservation"
        actor: InventoryLead
        preconditions:
          - "DeviceUnit.reserved_case_id is non-null"
          - "SurgicalCase.status is in {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "DeviceUnit.reserved_case_id := null"
          - "Recompute CatalogItem.on_hand_available_qty"
          - "Recompute SurgicalCase.readiness_status"
          - "Lot.on_hand_qty and Lot.consumed_qty are unchanged (see calculations.lot_unit_conservation)"
        note: "Cycle AVAILABLE -> RESERVED -> AVAILABLE; the conserved quantity Lot.on_hand_qty + Lot.consumed_qty is invariant across the round trip."

      - from: RESERVED
        to: IMPLANTED
        trigger: "POST /udi/surgical-cases/{case_id}/implant-records"
        actor: CircClinician
        preconditions:
          - "SurgicalCase.status == IN_PROGRESS"
          - "DeviceUnit.reserved_case_id == SurgicalCase.id"
          - "Lot.status == AVAILABLE"
          - "The lot's expiry instant is strictly after the logical clock"
        side_effects:
          - "Create ImplantRecord in status DOCUMENTED"
          - "DeviceUnit.reserved_case_id := null; DeviceUnit.implanted_at_utc := logical clock"
          - "When ownership == CONSIGNED and ConsignmentAgreement.billing_trigger == ON_IMPLANT: billing_state := BILLABLE, contract_price_cents := acquisition_cost_cents, price_list_version_at_billing := ConsignmentAgreement.price_list_version"
          - "That billing_state change itself recomputes Vendor.open_consignment_liability_cents"
          - "Recompute Lot.on_hand_qty, Lot.consumed_qty, CatalogItem.on_hand_available_qty, Patient.implant_count, SurgicalCase.implant_record_count and SurgicalCase.readiness_status"
          - "Increment SurgicalCase.version by 1"

      - from: AVAILABLE
        to: IMPLANTED
        trigger: "POST /udi/surgical-cases/{case_id}/implant-records (emergency use of unreserved stock)"
        actor: CircClinician
        preconditions:
          - "SurgicalCase.status == IN_PROGRESS"
          - "DeviceUnit.reserved_case_id is null"
          - "Lot.status == AVAILABLE"
          - "The lot's expiry instant is strictly after the logical clock"
        side_effects:
          - "Identical to the RESERVED_to_IMPLANTED side-effect list"
        note: "Fork: the same trigger reaches IMPLANTED from two different source states; the branch taken is determined by DeviceUnit.custody_state, not by any request field."

      - from: AVAILABLE
        to: WASTED
        trigger: "POST /udi/device-units/{device_unit_id}/waste"
        actor: CircClinician
        preconditions:
          - "DeviceUnit.custody_state is in {AVAILABLE, RESERVED}"
        side_effects:
          - "DeviceUnit.reserved_case_id := null"
          - "Recompute Lot.on_hand_qty, Lot.consumed_qty and CatalogItem.on_hand_available_qty"
          - "When Lot.status == AVAILABLE and the recomputed Lot.on_hand_qty == 0: Lot.status := DEPLETED"

      - from: RESERVED
        to: WASTED
        trigger: "POST /udi/device-units/{device_unit_id}/waste"
        actor: CircClinician
        preconditions:
          - "DeviceUnit.custody_state is in {AVAILABLE, RESERVED}"
        side_effects:
          - "Identical to the AVAILABLE_to_WASTED side-effect list, plus recompute SurgicalCase.readiness_status for the detached case"

      - from: AVAILABLE
        to: EXPIRED
        trigger: "POST /udi/ops-runs (cascade from Lot.AVAILABLE_to_EXPIRED)"
        actor: system
        preconditions:
          - "Lot expiry instant <= logical clock"
          - "DeviceUnit.custody_state is in {QUARANTINED, AVAILABLE}"
        side_effects:
          - "DeviceUnit.expired_at_utc := logical clock"
          - "That custody change itself recomputes Lot.on_hand_qty / Lot.consumed_qty, which itself recomputes CatalogItem.on_hand_available_qty"

      - from: QUARANTINED
        to: EXPIRED
        trigger: "POST /udi/ops-runs (cascade from Lot.QUARANTINE_to_EXPIRED)"
        actor: system
        preconditions:
          - "Lot expiry instant <= logical clock"
        side_effects:
          - "Identical to the AVAILABLE_to_EXPIRED side-effect list"

      - from: AVAILABLE
        to: RECALL_HOLD
        trigger: "POST /udi/field-actions/{field_action_id}/publish (cascade from Lot.AVAILABLE_to_RECALLED)"
        actor: system
        preconditions:
          - "The unit is in the on-hand cohort of calculations.recall_exposure_cohort"
        side_effects:
          - "Recompute CatalogItem.on_hand_available_qty"

      - from: QUARANTINED
        to: RECALL_HOLD
        trigger: "POST /udi/field-actions/{field_action_id}/publish (cascade)"
        actor: system
        preconditions:
          - "The unit is in the on-hand cohort of calculations.recall_exposure_cohort"
        side_effects:
          - "Recompute Lot.on_hand_qty"

      - from: RESERVED
        to: RECALL_HOLD
        trigger: "POST /udi/field-actions/{field_action_id}/publish (cascade)"
        actor: system
        preconditions:
          - "The unit is in the on-hand cohort of calculations.recall_exposure_cohort"
        side_effects:
          - "DeviceUnit.reserved_case_id := null"
          - "That detachment itself increments SurgicalCase.blocked_reservation_count by 1, which itself flips SurgicalCase.readiness_status to BLOCKED_RESERVATION"
          - "Recompute CatalogItem.on_hand_available_qty"

      - from: RECALL_HOLD
        to: RETURNED_TO_VENDOR
        trigger: "POST /udi/field-actions/{field_action_id}/close with on_hand_disposition = RETURN_TO_VENDOR"
        actor: system
        preconditions:
          - "FieldAction.notification_open_count == 0"
        side_effects:
          - "Recompute Lot.on_hand_qty and Lot.consumed_qty"

      - from: RECALL_HOLD
        to: DISPOSED
        trigger: "POST /udi/field-actions/{field_action_id}/close with on_hand_disposition = DISPOSE"
        actor: system
        preconditions:
          - "FieldAction.notification_open_count == 0"
        side_effects:
          - "Recompute Lot.on_hand_qty and Lot.consumed_qty"

      - from: IMPLANTED
        to: EXPLANTED
        trigger: "POST /udi/implant-records/{implant_record_id}/explants (cascade from ImplantRecord.VERIFIED_to_EXPLANTED)"
        actor: system
        preconditions:
          - "ImplantRecord.status == VERIFIED"
        side_effects:
          - "When billing_state is in {BILLABLE, INVOICED}: billing_state := CREDIT_PENDING"
          - "Recompute Lot.on_hand_qty and Lot.consumed_qty"

      - from: EXPLANTED
        to: RETURNED_TO_VENDOR
        trigger: "POST /udi/explant-records/{explant_record_id}/ship"
        actor: InventoryLead
        preconditions:
          - "ExplantRecord.status == RETURN_AUTHORIZED"

      - from: EXPLANTED
        to: DISPOSED
        trigger: "POST /udi/explant-records/{explant_record_id}/disposition with disposition = DISPOSE_LOCALLY"
        actor: InventoryLead
        preconditions:
          - "ExplantRecord.status == RECORDED"
        side_effects:
          - "When billing_state == CREDIT_PENDING: billing_state := BILLABLE (the hospital keeps the liability because nothing is going back to the vendor)"
          - "That billing_state change itself recomputes Vendor.open_consignment_liability_cents"

  - entity: DeviceUnit
    state_field: billing_state
    shape: branching_with_cycle
    initial_state: NOT_BILLABLE
    terminal_states: [RECONCILED, CREDITED]
    transitions:

      - from: NOT_BILLABLE
        to: BILLABLE
        trigger: "POST /udi/surgical-cases/{case_id}/implant-records (billing_trigger ON_IMPLANT) or POST /udi/lots/{lot_id}/release (billing_trigger ON_RECEIPT)"
        actor: system
        preconditions:
          - "DeviceUnit.ownership == CONSIGNED"
          - "ConsignmentAgreement.status == ACTIVE"
        side_effects:
          - "contract_price_cents := acquisition_cost_cents"
          - "price_list_version_at_billing := ConsignmentAgreement.price_list_version"
          - "Recompute Vendor.open_consignment_liability_cents"

      - from: BILLABLE
        to: INVOICED
        trigger: "POST /udi/vendor-invoices"
        actor: VendorRep
        preconditions:
          - "DeviceUnit.vendor_invoice_id is null"
          - "DeviceUnit.billing_state == BILLABLE"
        side_effects:
          - "DeviceUnit.vendor_invoice_id := VendorInvoice.id"

      - from: INVOICED
        to: BILLABLE
        trigger: "POST /udi/vendor-invoices/{invoice_id}/dispute"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "VendorInvoice.status == VARIANCE_HOLD"
        side_effects:
          - "DeviceUnit.vendor_invoice_id := null"
        note: "Cycle BILLABLE -> INVOICED -> BILLABLE; the invoice can then be resubmitted, driving the units back to INVOICED."

      - from: INVOICED
        to: RECONCILED
        trigger: "POST /udi/vendor-invoices/{invoice_id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "VendorInvoice.status is in {MATCHED, VARIANCE_HOLD}"
        side_effects:
          - "Recompute Vendor.open_consignment_liability_cents (RECONCILED units leave the liability base)"

      - from: BILLABLE
        to: CREDIT_PENDING
        trigger: "POST /udi/implant-records/{implant_record_id}/explants"
        actor: system
        preconditions:
          - "DeviceUnit.custody_state transitions IMPLANTED -> EXPLANTED in the same request"
        side_effects:
          - "Recompute Vendor.open_consignment_liability_cents"

      - from: INVOICED
        to: CREDIT_PENDING
        trigger: "POST /udi/implant-records/{implant_record_id}/explants"
        actor: system
        preconditions:
          - "DeviceUnit.custody_state transitions IMPLANTED -> EXPLANTED in the same request"
        side_effects:
          - "Recompute Vendor.open_consignment_liability_cents"

      - from: CREDIT_PENDING
        to: CREDITED
        trigger: "POST /udi/explant-records/{explant_record_id}/credit with credit_issued_cents > 0"
        actor: VendorRep
        preconditions:
          - "ExplantRecord.status == SHIPPED"

      - from: CREDIT_PENDING
        to: BILLABLE
        trigger: "POST /udi/explant-records/{explant_record_id}/credit with credit_issued_cents == 0, or POST /udi/explant-records/{explant_record_id}/disposition with disposition = DISPOSE_LOCALLY"
        actor: system
        preconditions:
          - "DeviceUnit.billing_state == CREDIT_PENDING"
        side_effects:
          - "Recompute Vendor.open_consignment_liability_cents"
        note: "Compensating branch: when no credit arrives the liability returns to the vendor's open balance."

  # ---------------------------------------------------------------------- Lot
  - entity: Lot
    state_field: status
    shape: compound
    initial_state: QUARANTINE
    terminal_states: [EXPIRED, RECALLED, DEPLETED]
    transitions:
      - from: QUARANTINE
        to: AVAILABLE
        trigger: "POST /udi/lots/{lot_id}/release"
        actor: InventoryLead
        preconditions:
          - "Lot.status == QUARANTINE"
          - "X-User-ID != Lot.received_by_user_id"
          - "Lot.received_qty >= 1"
        side_effects:
          - "Every DeviceUnit on the lot in QUARANTINED moves to AVAILABLE (cascade)"
          - "Lot.released_by_user_id := X-User-ID"
      - from: AVAILABLE
        to: EXPIRED
        trigger: "POST /udi/ops-runs"
        actor: system
        preconditions:
          - "expiry instant (expiration_date at 23:59:59.999Z) <= logical clock"
        side_effects:
          - "Every DeviceUnit on the lot in {QUARANTINED, AVAILABLE} moves to EXPIRED (cascade)"
          - "Units in RESERVED are NOT expired; instead each one is detached (reserved_case_id := null) and its case's blocked_reservation_count is incremented by 1"
      - from: QUARANTINE
        to: EXPIRED
        trigger: "POST /udi/ops-runs"
        actor: system
        preconditions:
          - "expiry instant <= logical clock"
        side_effects:
          - "Every DeviceUnit on the lot in QUARANTINED moves to EXPIRED (cascade)"
      - from: AVAILABLE
        to: RECALLED
        trigger: "POST /udi/field-actions/{field_action_id}/publish"
        actor: system
        preconditions:
          - "The lot is matched by calculations.recall_exposure_cohort"
        side_effects:
          - "Every DeviceUnit on the lot in {QUARANTINED, AVAILABLE, RESERVED} moves to RECALL_HOLD (cascade)"
      - from: QUARANTINE
        to: RECALLED
        trigger: "POST /udi/field-actions/{field_action_id}/publish"
        actor: system
        preconditions:
          - "The lot is matched by calculations.recall_exposure_cohort"
        side_effects:
          - "Every DeviceUnit on the lot in QUARANTINED moves to RECALL_HOLD (cascade)"
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system event: recomputation of Lot.on_hand_qty reaches 0"
        actor: system
        preconditions:
          - "Lot.status == AVAILABLE"
          - "Recomputed Lot.on_hand_qty == 0"
          - "Lot.received_qty >= 1"
        side_effects: []
        note: "Compound: the parent lot auto-transitions purely from aggregate child custody states."

  # ------------------------------------------------------------- SurgicalCase
  - entity: SurgicalCase
    state_field: status
    shape: branching
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /udi/surgical-cases/{case_id}/start"
        actor: CircClinician
        preconditions:
          - "SurgicalCase.status == SCHEDULED"
        side_effects:
          - "Recompute SurgicalCase.readiness_status"
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /udi/surgical-cases/{case_id}/close"
        actor: CircClinician
        preconditions:
          - "SurgicalCase.readiness_status == READY"
        side_effects:
          - "Every DeviceUnit still RESERVED to this case is released back to AVAILABLE (cascade)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /udi/surgical-cases/{case_id}/cancel"
        actor: CircClinician
        preconditions:
          - "SurgicalCase.status == SCHEDULED"
        side_effects:
          - "Every DeviceUnit RESERVED to this case moves back to AVAILABLE"
          - "SurgicalCase.blocked_reservation_count := 0"
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /udi/surgical-cases/{case_id}/cancel"
        actor: CircClinician
        preconditions:
          - "SurgicalCase.status == IN_PROGRESS"
        side_effects:
          - "Every DeviceUnit RESERVED to this case moves back to AVAILABLE"
          - "Every ImplantRecord of this case in status DOCUMENTED moves to VOIDED (cascade)"
          - "Each record moving to VOIDED itself moves every ChargeCapture of that record in {DRAFT, POSTED, CORRECTION_REQUIRED} to VOIDED"
          - "Each charge moving to VOIDED itself recomputes SurgicalCase.total_posted_charge_cents"
          - "Each record moving to VOIDED itself decrements Patient.implant_count"
          - "SurgicalCase.blocked_reservation_count := 0"
        note: "Fork with divergent side-effect sets: the same endpoint reaches CANCELLED from SCHEDULED (reservation release only) and ABORTED from IN_PROGRESS (reservation release plus a three-hop void cascade)."

  # ------------------------------------------------------------ ImplantRecord
  - entity: ImplantRecord
    state_field: status
    shape: cyclic
    initial_state: DOCUMENTED
    terminal_states: [EXPLANTED, VOIDED]
    transitions:
      - from: DOCUMENTED
        to: VERIFIED
        trigger: "POST /udi/implant-records/{implant_record_id}/verify"
        actor: CircClinician
        preconditions:
          - "ImplantRecord.status is in {DOCUMENTED, AMENDED}"
          - "X-User-ID != ImplantRecord.documented_by_user_id"
        side_effects:
          - "verified_by_user_id := X-User-ID; verified_at_utc := logical clock"
          - "When CatalogItem.registry_required is true and Patient.registry_consent != DECLINED and no RegistrySubmission exists for this record: create RegistrySubmission in status REQUIRED with deadline_utc = verified_at_utc + REGISTRY_DEADLINE_DAYS"
          - "When CatalogItem.registry_required is true and Patient.registry_consent == DECLINED and no RegistrySubmission exists: create RegistrySubmission directly in status EXEMPT"
          - "Recompute SurgicalCase.readiness_status"
      - from: AMENDED
        to: VERIFIED
        trigger: "POST /udi/implant-records/{implant_record_id}/verify"
        actor: CircClinician
        preconditions:
          - "ImplantRecord.status is in {DOCUMENTED, AMENDED}"
          - "X-User-ID != ImplantRecord.documented_by_user_id"
        side_effects:
          - "Identical to DOCUMENTED_to_VERIFIED; an existing RegistrySubmission is left untouched"
      - from: VERIFIED
        to: AMENDED
        trigger: "POST /udi/implant-records/{implant_record_id}/amend"
        actor: CircClinician
        preconditions:
          - "ImplantRecord.status == VERIFIED"
        side_effects:
          - "amendment_count += 1"
          - "Any RegistrySubmission for this record in status SUBMITTED moves back to REQUIRED"
          - "Recompute SurgicalCase.readiness_status"
        note: "Cycle VERIFIED -> AMENDED -> VERIFIED, unbounded, counted by amendment_count."
      - from: VERIFIED
        to: EXPLANTED
        trigger: "POST /udi/implant-records/{implant_record_id}/explants"
        actor: CircClinician
        preconditions:
          - "ImplantRecord.status == VERIFIED"
          - "DeviceUnit.custody_state == IMPLANTED"
        side_effects:
          - "Create ExplantRecord in status RECORDED with credit_expected_cents from calculations.explant_return_credit"
          - "That creation itself moves DeviceUnit.custody_state IMPLANTED -> EXPLANTED and (when billable) billing_state -> CREDIT_PENDING"
          - "That billing_state change itself recomputes Vendor.open_consignment_liability_cents"
          - "The custody change itself moves every ChargeCapture of this record in status POSTED to CORRECTION_REQUIRED"
          - "That charge change itself recomputes SurgicalCase.total_posted_charge_cents and SurgicalCase.readiness_status"
      - from: DOCUMENTED
        to: VOIDED
        trigger: "POST /udi/surgical-cases/{case_id}/cancel from IN_PROGRESS (cascade)"
        actor: system
        preconditions:
          - "ImplantRecord.status == DOCUMENTED"
        side_effects:
          - "Every ChargeCapture of this record in {DRAFT, POSTED, CORRECTION_REQUIRED} moves to VOIDED"
          - "Patient.implant_count is recomputed"

  # ------------------------------------------------------------ ChargeCapture
  - entity: ChargeCapture
    state_field: status
    shape: branching
    initial_state: DRAFT
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /udi/charge-captures/{charge_id}/post"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "ChargeCapture.status == DRAFT"
          - "ImplantRecord.status is in {VERIFIED, AMENDED}"
        side_effects:
          - "Recompute SurgicalCase.total_posted_charge_cents"
          - "Recompute SurgicalCase.readiness_status"
      - from: POSTED
        to: FINALIZED
        trigger: "POST /udi/charge-captures/{charge_id}/finalize"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "ChargeCapture.status == POSTED"
          - "abs(variance_cents) < HIGH_COST_VARIANCE_THRESHOLD_CENTS or CatalogItem.category != HIGH_COST_IMPLANT"
        side_effects:
          - "final_charge_cents and variance_cents are written from calculations.implant_charge_amount variant FINAL"
          - "capture_variant := FINAL"
          - "Recompute SurgicalCase.total_posted_charge_cents and SurgicalCase.readiness_status"
      - from: POSTED
        to: CORRECTION_REQUIRED
        trigger: "POST /udi/charge-captures/{charge_id}/finalize"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "ChargeCapture.status == POSTED"
          - "CatalogItem.category == HIGH_COST_IMPLANT and abs(variance_cents) >= HIGH_COST_VARIANCE_THRESHOLD_CENTS"
        side_effects:
          - "final_charge_cents and variance_cents are written; capture_variant := FINAL"
          - "Recompute SurgicalCase.total_posted_charge_cents and SurgicalCase.readiness_status"
        note: "Fork on the same trigger: the branch is chosen by the magnitude of the computed variance and the catalog category, never by a request field."
      - from: CORRECTION_REQUIRED
        to: FINALIZED
        trigger: "POST /udi/charge-captures/{charge_id}/correct"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "ChargeCapture.status == CORRECTION_REQUIRED"
          - "acknowledged_variance_cents == ChargeCapture.variance_cents"
        side_effects:
          - "Recompute SurgicalCase.readiness_status"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /udi/charge-captures/{charge_id}/void"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "ChargeCapture.status is in {DRAFT, POSTED, CORRECTION_REQUIRED}"
        side_effects:
          - "Recompute SurgicalCase.total_posted_charge_cents and SurgicalCase.readiness_status"
      - from: POSTED
        to: VOIDED
        trigger: "POST /udi/charge-captures/{charge_id}/void"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "ChargeCapture.status is in {DRAFT, POSTED, CORRECTION_REQUIRED}"
        side_effects:
          - "Recompute SurgicalCase.total_posted_charge_cents and SurgicalCase.readiness_status"
        note: "Compensating action for POST: SurgicalCase.total_posted_charge_cents returns exactly to its pre-post value, because a VOIDED line leaves the summation set defined in calculations.implant_charge_amount step 6."
      - from: CORRECTION_REQUIRED
        to: VOIDED
        trigger: "POST /udi/charge-captures/{charge_id}/void"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "ChargeCapture.status is in {DRAFT, POSTED, CORRECTION_REQUIRED}"
        side_effects:
          - "Recompute SurgicalCase.total_posted_charge_cents and SurgicalCase.readiness_status"

  # ------------------------------------------------------- RegistrySubmission
  - entity: RegistrySubmission
    state_field: status
    shape: cyclic
    initial_state: REQUIRED
    terminal_states: [ACCEPTED, EXEMPT]
    transitions:
      - from: REQUIRED
        to: SUBMITTED
        trigger: "POST /udi/registry-submissions/{submission_id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "RegistrySubmission.status is in {REQUIRED, REJECTED}"
          - "ImplantRecord.status is in {VERIFIED, EXPLANTED}"
          - "completeness_score >= REGISTRY_MIN_COMPLETENESS_SCORE"
        side_effects:
          - "submitted_at_utc := logical clock; registry_code := request value"
          - "Recompute SurgicalCase.readiness_status"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /udi/registry-submissions/{submission_id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "RegistrySubmission.status is in {REQUIRED, REJECTED}"
          - "completeness_score >= REGISTRY_MIN_COMPLETENESS_SCORE"
        side_effects:
          - "resubmission_count += 1"
          - "submitted_at_utc := logical clock"
          - "Recompute SurgicalCase.readiness_status"
        note: "Cycle SUBMITTED -> REJECTED -> SUBMITTED, counted by resubmission_count."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /udi/registry-submissions/{submission_id}/adjudicate with outcome = ACCEPTED"
        actor: ComplianceOfficer
        preconditions:
          - "RegistrySubmission.status == SUBMITTED"
        side_effects:
          - "adjudicated_at_utc := logical clock"
          - "Recompute SurgicalCase.readiness_status"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /udi/registry-submissions/{submission_id}/adjudicate with outcome = REJECTED"
        actor: ComplianceOfficer
        preconditions:
          - "RegistrySubmission.status == SUBMITTED"
          - "rejection_reason is present and non-empty"
        side_effects:
          - "adjudicated_at_utc := logical clock; rejection_reason := request value"
          - "Recompute SurgicalCase.readiness_status"
      - from: SUBMITTED
        to: REQUIRED
        trigger: "POST /udi/implant-records/{implant_record_id}/amend (cascade)"
        actor: system
        preconditions:
          - "RegistrySubmission.status == SUBMITTED"
        side_effects:
          - "Recompute SurgicalCase.readiness_status"

  # -------------------------------------------------------------- FieldAction
  - entity: FieldAction
    state_field: status
    shape: compound
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /udi/field-actions/{field_action_id}/publish"
        actor: ComplianceOfficer
        preconditions:
          - "FieldAction.status == DRAFT"
        side_effects:
          - "published_at_utc := logical clock"
          - "Run calculations.recall_exposure_cohort; write implanted_cohort_size and on_hand_cohort_size"
          - "Every matched Lot in {QUARANTINE, AVAILABLE} moves to RECALLED"
          - "Each Lot moving to RECALLED itself moves its non-terminal DeviceUnits to RECALL_HOLD"
          - "Each RESERVED unit moving to RECALL_HOLD itself detaches from its SurgicalCase, which itself flips that case's readiness_status to BLOCKED_RESERVATION"
          - "One RecallNotification in status PENDING is created per distinct ImplantRecord in the implanted cohort"
          - "When action_class == CLASS_I: Vendor.standing := HOLD"
          - "Vendor.recall_open_count is recomputed"
      - from: PUBLISHED
        to: IN_REMEDIATION
        trigger: "POST /udi/recall-notifications/{notification_id}/resolve (bubble-up on the first resolution)"
        actor: system
        preconditions:
          - "FieldAction.status == PUBLISHED"
        side_effects:
          - "Recompute notification_open_count"
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /udi/field-actions/{field_action_id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "FieldAction.notification_open_count == 0"
        side_effects:
          - "Every RecallNotification of this action in {NOTIFIED, ACKNOWLEDGED, UNREACHABLE} moves to CLOSED"
          - "Every DeviceUnit in RECALL_HOLD attributable to this action moves to RETURNED_TO_VENDOR or DISPOSED per on_hand_disposition"
          - "Vendor.recall_open_count is recomputed; when it reaches 0 the Vendor.standing returns to ACTIVE"
        note: "Reachable directly from PUBLISHED only when the implanted cohort was empty (notification_open_count == 0 with zero notifications ever created)."
      - from: IN_REMEDIATION
        to: CLOSED
        trigger: "POST /udi/field-actions/{field_action_id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "FieldAction.notification_open_count == 0"
        side_effects:
          - "Identical to the PUBLISHED_to_CLOSED side-effect list"

  # ------------------------------------------------------- RecallNotification
  - entity: RecallNotification
    state_field: status
    shape: branching
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: NOTIFIED
        trigger: "POST /udi/recall-notifications/{notification_id}/resolve with outcome = NOTIFIED"
        actor: ComplianceOfficer
        preconditions:
          - "RecallNotification.status == PENDING"
        side_effects:
          - "Recompute FieldAction.notification_open_count"
          - "When FieldAction.status == PUBLISHED it moves to IN_REMEDIATION"
      - from: PENDING
        to: ACKNOWLEDGED
        trigger: "POST /udi/recall-notifications/{notification_id}/resolve with outcome = ACKNOWLEDGED"
        actor: ComplianceOfficer
        preconditions:
          - "RecallNotification.status == PENDING"
        side_effects:
          - "Identical to PENDING_to_NOTIFIED"
      - from: PENDING
        to: UNREACHABLE
        trigger: "POST /udi/recall-notifications/{notification_id}/resolve with outcome = UNREACHABLE, or POST /udi/ops-runs when escalation_level reaches NOTIFICATION_ESCALATION_LIMIT"
        actor: ComplianceOfficer
        preconditions:
          - "RecallNotification.status == PENDING"
        side_effects:
          - "Identical to PENDING_to_NOTIFIED"
      - from: NOTIFIED
        to: CLOSED
        trigger: "POST /udi/field-actions/{field_action_id}/close (cascade)"
        actor: system
        preconditions:
          - "FieldAction.notification_open_count == 0"
      - from: ACKNOWLEDGED
        to: CLOSED
        trigger: "POST /udi/field-actions/{field_action_id}/close (cascade)"
        actor: system
        preconditions:
          - "FieldAction.notification_open_count == 0"
      - from: UNREACHABLE
        to: CLOSED
        trigger: "POST /udi/field-actions/{field_action_id}/close (cascade)"
        actor: system
        preconditions:
          - "FieldAction.notification_open_count == 0"

  # ------------------------------------------------------------ VendorInvoice
  - entity: VendorInvoice
    state_field: status
    shape: branching_with_cycle
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: MATCHED
        trigger: "POST /udi/vendor-invoices/{invoice_id}/match"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "VendorInvoice.status == SUBMITTED"
          - "variance_bps <= ConsignmentAgreement.invoice_tolerance_bps"
        side_effects:
          - "expected_total_cents, variance_cents, variance_bps and reconciliation_variant are written from calculations.consignment_expected_total"
          - "matched_by_user_id := X-User-ID"
      - from: SUBMITTED
        to: VARIANCE_HOLD
        trigger: "POST /udi/vendor-invoices/{invoice_id}/match"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "VendorInvoice.status == SUBMITTED"
          - "variance_bps > ConsignmentAgreement.invoice_tolerance_bps"
        side_effects:
          - "Identical write set to SUBMITTED_to_MATCHED"
        note: "Fork on a computed threshold; equality with the tolerance takes the MATCHED branch."
      - from: MATCHED
        to: APPROVED
        trigger: "POST /udi/vendor-invoices/{invoice_id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "VendorInvoice.status is in {MATCHED, VARIANCE_HOLD}"
          - "X-User-ID != VendorInvoice.matched_by_user_id"
          - "ConsignmentAgreement.status == ACTIVE"
        side_effects:
          - "credit_applied_cents and net_payable_cents are written from calculations.net_consignment_settlement"
          - "approved_by_user_id := X-User-ID"
          - "Every DeviceUnit on this invoice moves INVOICED -> RECONCILED"
          - "That billing_state change itself recomputes Vendor.open_consignment_liability_cents"
      - from: VARIANCE_HOLD
        to: APPROVED
        trigger: "POST /udi/vendor-invoices/{invoice_id}/approve with a non-empty override_reason"
        actor: ComplianceOfficer
        preconditions:
          - "VendorInvoice.status == VARIANCE_HOLD"
          - "override_reason is present and non-empty"
          - "X-User-ID != VendorInvoice.matched_by_user_id"
        side_effects:
          - "Identical to MATCHED_to_APPROVED"
      - from: VARIANCE_HOLD
        to: DISPUTED
        trigger: "POST /udi/vendor-invoices/{invoice_id}/dispute"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "VendorInvoice.status == VARIANCE_HOLD"
        side_effects:
          - "Every DeviceUnit on this invoice moves INVOICED -> BILLABLE and its vendor_invoice_id is cleared"
          - "That billing_state change itself recomputes Vendor.open_consignment_liability_cents"
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /udi/vendor-invoices/{invoice_id}/resubmit"
        actor: VendorRep
        preconditions:
          - "VendorInvoice.status == DISPUTED"
        side_effects:
          - "submitted_total_cents and device_unit_ids are replaced by the request values"
          - "Every listed DeviceUnit moves BILLABLE -> INVOICED with vendor_invoice_id set"
          - "expected_total_cents, variance_cents, variance_bps, reconciliation_variant and matched_by_user_id are reset to null"
        note: "Cycle SUBMITTED -> VARIANCE_HOLD -> DISPUTED -> SUBMITTED."

  # ------------------------------------------------------------ ExplantRecord
  - entity: ExplantRecord
    state_field: status
    shape: branching
    initial_state: RECORDED
    terminal_states: [CREDIT_ISSUED, CREDIT_DENIED, DISPOSED_LOCALLY]
    transitions:
      - from: RECORDED
        to: RETURN_AUTHORIZED
        trigger: "POST /udi/explant-records/{explant_record_id}/disposition with disposition = RETURN_TO_VENDOR"
        actor: InventoryLead
        preconditions:
          - "ExplantRecord.status == RECORDED"
          - "return_authorization_no is present and non-empty"
        side_effects:
          - "return_authorization_no := request value"
      - from: RECORDED
        to: DISPOSED_LOCALLY
        trigger: "POST /udi/explant-records/{explant_record_id}/disposition with disposition = DISPOSE_LOCALLY"
        actor: InventoryLead
        preconditions:
          - "ExplantRecord.status == RECORDED"
        side_effects:
          - "DeviceUnit.custody_state EXPLANTED -> DISPOSED"
          - "That custody change itself moves DeviceUnit.billing_state CREDIT_PENDING -> BILLABLE"
          - "That billing_state change itself recomputes Vendor.open_consignment_liability_cents"
        note: "Fork with divergent side effects: the RETURN branch keeps the credit alive, the DISPOSE branch compensates the liability back onto the hospital."
      - from: RETURN_AUTHORIZED
        to: SHIPPED
        trigger: "POST /udi/explant-records/{explant_record_id}/ship"
        actor: InventoryLead
        preconditions:
          - "ExplantRecord.status == RETURN_AUTHORIZED"
        side_effects:
          - "DeviceUnit.custody_state EXPLANTED -> RETURNED_TO_VENDOR"
      - from: SHIPPED
        to: CREDIT_ISSUED
        trigger: "POST /udi/explant-records/{explant_record_id}/credit with credit_issued_cents > 0"
        actor: VendorRep
        preconditions:
          - "ExplantRecord.status == SHIPPED"
          - "credit_issued_cents <= credit_expected_cents"
        side_effects:
          - "DeviceUnit.billing_state CREDIT_PENDING -> CREDITED"
          - "Recompute Vendor.open_consignment_liability_cents"
      - from: SHIPPED
        to: CREDIT_DENIED
        trigger: "POST /udi/explant-records/{explant_record_id}/credit with credit_issued_cents == 0"
        actor: VendorRep
        preconditions:
          - "ExplantRecord.status == SHIPPED"
        side_effects:
          - "DeviceUnit.billing_state CREDIT_PENDING -> BILLABLE"
          - "That billing_state change itself recomputes Vendor.open_consignment_liability_cents"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's `version` only
# =============================================================================
concurrency_rules:

  - rule_id: implant-record-create-stale-case
    parent_entity: SurgicalCase
    write_endpoint: "POST /udi/surgical-cases/{case_id}/implant-records"
    occ_field: "expected_case_version"
    description: |
      Documenting an implant against a SurgicalCase whose version has advanced
      since the client last observed it is rejected. A case legitimately accepts
      any number of implant records, so a second documentation request is not
      blocked by any state precondition; the stale-version check is the only
      guard that stops a writer from documenting against a case whose implant
      set, reservation set or readiness posture it no longer knows.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: device-unit-create-stale-lot
    parent_entity: Lot
    write_endpoint: "POST /udi/lots/{lot_id}/device-units"
    occ_field: "expected_lot_version"
    description: |
      Adding a serialized unit to a Lot whose version has advanced since the
      client last observed it is rejected. A lot legitimately accepts repeated
      unit additions while it is in QUARANTINE, so a later request is not
      blocked by a state precondition; the stale-version check is the only guard
      that stops a receiver from posting serials against a received_qty it no
      longer knows.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

  - rule_id: invoice-create-stale-agreement
    parent_entity: ConsignmentAgreement
    write_endpoint: "POST /udi/vendor-invoices"
    occ_field: "expected_agreement_version"
    description: |
      Submitting a VendorInvoice against a ConsignmentAgreement whose version
      has advanced since the vendor last observed it is rejected. An agreement
      legitimately accepts many invoices, so nothing in the invoice state
      machine blocks a later submission; the stale-version check is what stops a
      vendor from billing under a price-list revision it has not yet seen.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
#
# GLOBAL RULES
#  * All money is integer cents. `round_half_up(x)` rounds a Decimal to a whole
#    cent, ties away from zero.
#  * No calculation, selector, ranking, tie-break, cascade order or replay order
#    anywhere in this scaffold reads `id`. Where a precise fallback over common
#    fields is needed the key is `created_at ASC`.
#  * "logical clock" always means the value maintained by
#    POST /_clock/set_current_utc, whose startup default is 2026-08-01T00:00:00Z.
# =============================================================================
calculations:

  # ------------------------------------------------------------------ C1
  - name: implant_charge_amount
    trigger: "PROVISIONAL runs on POST /udi/implant-records/{implant_record_id}/charges (writes ChargeCapture.provisional_charge_cents). FINAL runs on POST /udi/charge-captures/{charge_id}/finalize (writes ChargeCapture.final_charge_cents and ChargeCapture.variance_cents)."
    algorithm: tiered_pricing
    entity_domain: "patient revenue — ChargeCapture / SurgicalCase"
    formula: |
      # ---- step 1: pick the base, which is what the two variants disagree on
      if variant == PROVISIONAL:
          base_cents = CatalogItem.list_charge_cents          # chargemaster list
      else:  # variant == FINAL
          base_cents = DeviceUnit.acquisition_cost_cents      # what this serial cost

      # ---- step 2: markup tier — lower bound inclusive, upper bound exclusive
      if   base_cents <  50000:    markup_pct = 0.60
      elif base_cents <  250000:   markup_pct = 0.45
      elif base_cents <  1000000:  markup_pct = 0.32
      else:                        markup_pct = 0.22

      # ---- step 3: ROUNDING ORDER IS PINNED: round the PER-UNIT amount to a
      #      whole cent FIRST, then multiply by quantity. Never multiply first.
      unit_cents = round_half_up(base_cents * (1 + markup_pct))
      line_cents = unit_cents * ChargeCapture.quantity

      # ---- step 4: high-cost cap, applied AFTER the quantity multiply
      if CatalogItem.category == "HIGH_COST_IMPLANT":
          line_cents = min(line_cents, base_cents + HIGH_COST_MARKUP_CAP_CENTS)

      # ---- step 5: FINAL only
      if variant == FINAL:
          ChargeCapture.final_charge_cents = line_cents
          ChargeCapture.variance_cents = provisional_charge_cents - final_charge_cents
          if CatalogItem.category == "HIGH_COST_IMPLANT" and abs(variance_cents) >= HIGH_COST_VARIANCE_THRESHOLD_CENTS:
              ChargeCapture.status = "CORRECTION_REQUIRED"
          else:
              ChargeCapture.status = "FINALIZED"

      # ---- step 6: SurgicalCase.total_posted_charge_cents
      # ROUNDING ORDER IS PINNED AT THE CASE LEVEL TOO: each ChargeCapture line
      # is already a whole-cent integer; the case total is the plain integer SUM
      # of those already-rounded lines. Summing un-rounded per-line products and
      # rounding once at the end is WRONG and produces a different total.
      SurgicalCase.total_posted_charge_cents =
          sum(effective_charge_cents
              for ChargeCapture c in this case's records
              if c.status in {POSTED, CORRECTION_REQUIRED, FINALIZED})
      # effective_charge_cents = final_charge_cents if non-null else provisional_charge_cents
    input_set: "The CatalogItem reached through ChargeCapture -> ImplantRecord -> DeviceUnit -> Lot -> CatalogItem. Case-level sum includes only ChargeCaptures whose status is in {POSTED, CORRECTION_REQUIRED, FINALIZED}; DRAFT and VOIDED lines are excluded."
    constants:
      MARKUP_TIER_1_UPPER_CENTS: 50000
      MARKUP_TIER_2_UPPER_CENTS: 250000
      MARKUP_TIER_3_UPPER_CENTS: 1000000
      MARKUP_PCT_TIER_1: 0.60
      MARKUP_PCT_TIER_2: 0.45
      MARKUP_PCT_TIER_3: 0.32
      MARKUP_PCT_TIER_4: 0.22
      HIGH_COST_MARKUP_CAP_CENTS: 750000
      HIGH_COST_VARIANCE_THRESHOLD_CENTS: 25000
    precision: "whole cents, round_half_up, applied per line before the quantity multiply"
    variants:
      - name: PROVISIONAL
        when: "At charge creation, before the device's true acquisition cost is reconciled."
        difference: "Base is CatalogItem.list_charge_cents. Because the tier ladder is keyed on the base, a list price and an acquisition cost that fall in different tiers also get different markup percentages, so the two variants diverge by more than the base difference."
      - name: FINAL
        when: "At POST /udi/charge-captures/{charge_id}/finalize, after the serial's negotiated price is known."
        difference: "Base is DeviceUnit.acquisition_cost_cents. Writes variance_cents and forks the charge into FINALIZED or CORRECTION_REQUIRED."

  # ------------------------------------------------------------------ C2
  - name: consignment_expected_total
    trigger: "POST /udi/vendor-invoices/{invoice_id}/match (writes VendorInvoice.expected_total_cents, variance_cents, variance_bps, reconciliation_variant)"
    algorithm: aggregation
    entity_domain: "vendor payables — VendorInvoice / ConsignmentAgreement / DeviceUnit"
    formula: |
      variant = ConsignmentAgreement.reconciliation_method

      if variant == "UNIT_MATCH":
          expected_total_cents = sum(u.contract_price_cents
                                     for u in invoice_units)          # serial by serial

      else:  # variant == "PERIOD_TRUEUP"
          expected_total_cents = 0
          for each catalog_item C represented among invoice_units, iterated in
              ascending CatalogItem.created_at order:
              pool = [ every DeviceUnit u where
                         u.consignment_agreement_id == invoice.consignment_agreement_id
                         and u.lot -> catalog_item_id == C.id
                         and u.billing_state in {BILLABLE, INVOICED, RECONCILED}
                         and period_start_utc <= u.implanted_at_utc <= period_end_utc ]
              # ROUNDING ORDER IS PINNED: round the per-catalog-item average to a
              # whole cent FIRST, then multiply by this invoice's unit count for
              # that catalog item, then add into the running total.
              avg_cents = round_half_up(sum(x.contract_price_cents for x in pool) / len(pool))
              n_on_invoice = count of invoice_units whose catalog item is C
              expected_total_cents += avg_cents * n_on_invoice

      variance_cents = VendorInvoice.submitted_total_cents - expected_total_cents
      variance_bps   = round_half_up(abs(variance_cents) * 10000 / expected_total_cents)
      # BOUNDARY: strictly greater than tolerance holds the invoice; equality passes.
      status = "VARIANCE_HOLD" if variance_bps > ConsignmentAgreement.invoice_tolerance_bps else "MATCHED"
    input_set: "invoice_units = the DeviceUnits whose vendor_invoice_id equals this invoice's id at match time. PERIOD_TRUEUP widens the denominator to every unit of the same catalog item under the SAME agreement, in any of {BILLABLE, INVOICED, RECONCILED}, implanted inside the agreement's closed period window — including units that are NOT on this invoice. That widening is the entire source of divergence between the two variants."
    constants:
      BPS_SCALE: 10000
    precision: "whole cents, round_half_up; the per-catalog-item average is rounded before it is multiplied"
    variants:
      - name: UNIT_MATCH
        when: "ConsignmentAgreement.reconciliation_method == UNIT_MATCH"
        difference: "Serial-level: the expected total is the exact sum of the invoiced serials' frozen contract prices. Never looks outside the invoice."
      - name: PERIOD_TRUEUP
        when: "ConsignmentAgreement.reconciliation_method == PERIOD_TRUEUP"
        difference: "Period-level: the expected total is a rounded per-catalog-item weighted average over the whole period's consumption, multiplied by this invoice's count. When the price list moved mid-period the two variants produce different expected totals for byte-identical invoices."

  # ------------------------------------------------------------------ C3
  - name: registry_completeness_score
    trigger: "Recomputed on GET /udi/registry-submissions/{submission_id}, on GET /udi/registry-submissions, and on every POST /udi/registry-submissions/{submission_id}/submit attempt"
    algorithm: weighted_scoring
    formula: |
      # five weighted components with conditional and partial-credit branches,
      # then a recall penalty, then a clamp — six inputs, non-linear interaction
      s = 0
      di_ok = ImplantRecord.udi_di is non-empty
      pi_ok = ImplantRecord.udi_pi_serial is non-empty
      if di_ok and pi_ok:      s += 30
      elif di_ok or pi_ok:     s += 15          # partial credit branch
      if Patient.registry_consent == "GRANTED": s += 25
      if ImplantRecord.anatomic_site is non-empty and ImplantRecord.laterality != "NOT_APPLICABLE":
                                                s += 20
      turnaround_hours = (ImplantRecord.verified_at_utc - ImplantRecord.documented_at_utc) in whole hours, floored
      if turnaround_hours <= VERIFY_TURNAROUND_HOURS:            s += 15
      if Lot.expiration_date is non-null:                        s += 10
      penalty = RECALLED_LOT_PENALTY if Lot.status == "RECALLED" else 0
      completeness_score = max(0, min(100, s - penalty))
    input_set: "The ImplantRecord named by RegistrySubmission.implant_record_id, its Patient, its DeviceUnit and that unit's Lot. No other records participate."
    constants:
      VERIFY_TURNAROUND_HOURS: 72
      RECALLED_LOT_PENALTY: 20
      REGISTRY_MIN_COMPLETENESS_SCORE: 80
      REGISTRY_DEADLINE_DAYS: 30
    precision: "integer 0-100, no rounding required"

  # ------------------------------------------------------------------ C4
  - name: fefo_unit_selection
    trigger: "POST /udi/surgical-cases/{case_id}/reservations when the request carries catalog_item_id (server-side pick). Skipped entirely when the request carries device_unit_id."
    algorithm: chronological
    formula: |
      # (a) ELIGIBILITY FILTER — explicit predicate, no fuzzy adjectives
      candidates = [ DeviceUnit u where
            u.custody_state == "AVAILABLE"
        and u.reserved_case_id is null
        and u.lot.status == "AVAILABLE"
        and u.lot.catalog_item_id == request.catalog_item_id
        and lot_expiry_instant(u.lot) > SurgicalCase.scheduled_end_utc ]
      # lot_expiry_instant(L) = L.expiration_date at 23:59:59.999Z

      # (b) RANKING EXPRESSION — first-expiring-first-out
      sort candidates by  lot.expiration_date ASC
      # (c) TIE-BREAKS, applied in order, all over entity fields, never over id
      then by             lot.received_at_utc ASC
      then by             DeviceUnit.created_at ASC

      # (d) EMPTY-POOL FALLBACK
      if candidates is empty: reject with ERR_NO_ELIGIBLE_UNIT (409)
      selected = candidates[0]
    input_set: "Only DeviceUnits satisfying every clause of the eligibility filter above. Units in QUARANTINED, RESERVED, RECALL_HOLD, IMPLANTED or any terminal custody state are excluded, as are units whose lot expires on or before the case's scheduled end."
    constants: {}
    precision: "n/a — selection, not arithmetic"

  # ------------------------------------------------------------------ C5
  - name: recall_exposure_cohort
    trigger: "POST /udi/field-actions/{field_action_id}/publish (persists the cohort sizes and creates notifications) and GET /udi/field-actions/{field_action_id}/exposure (recomputed read)"
    algorithm: aggregation
    formula: |
      # scope predicate over DeviceUnit u, resolved through u.lot
      base = u.lot.catalog_item_id == FieldAction.catalog_item_id
      if   FieldAction.scope_type == "CATALOG":
              in_scope = base
      elif FieldAction.scope_type == "LOT":
              in_scope = base and u.lot.lot_number in FieldAction.lot_numbers
      else:  # SERIAL_RANGE — lexicographic byte comparison, BOTH ends INCLUSIVE
              in_scope = base and FieldAction.serial_low <= u.udi_serial <= FieldAction.serial_high

      on_hand_cohort  = [ u in_scope where u.custody_state in {QUARANTINED, AVAILABLE, RESERVED} ]
      implanted_units = [ u in_scope where u.custody_state in {IMPLANTED, EXPLANTED} ]
      implanted_cohort = distinct ImplantRecords r where r.device_unit_id in implanted_units
                         and r.status in {DOCUMENTED, VERIFIED, AMENDED, EXPLANTED}
      # deterministic creation order for notifications: ImplantRecord.created_at ASC
      on_hand_cohort_size    = len(on_hand_cohort)
      implanted_cohort_size  = len(implanted_cohort)
      # EMPTY-SET EDGE: an implanted cohort of size 0 creates zero
      # RecallNotifications, leaves notification_open_count at 0, and therefore
      # lets the action be CLOSED straight out of PUBLISHED.
    input_set: "Every DeviceUnit whose lot points at FieldAction.catalog_item_id and that satisfies the scope predicate. VOIDED implant records never enter the implanted cohort. Units already in terminal custody states other than EXPLANTED (WASTED, EXPIRED, RETURNED_TO_VENDOR, DISPOSED) enter neither cohort."
    constants:
      CLASS_I_NOTICE_DAYS: 7
      CLASS_II_NOTICE_DAYS: 30
      CLASS_III_NOTICE_DAYS: 90
      NOTIFICATION_ESCALATION_LIMIT: 2
    precision: "integer counts"

  # ------------------------------------------------------------------ C6
  - name: vendor_open_consignment_liability
    trigger: "Recomputed whenever any DeviceUnit.billing_state changes, i.e. on lot release (ON_RECEIPT terms), implant documentation (ON_IMPLANT terms), invoice create, invoice dispute, invoice approve, explant, explant disposition and explant credit"
    algorithm: aggregation
    formula: |
      Vendor.open_consignment_liability_cents =
          sum( u.contract_price_cents
               for every DeviceUnit u
               where u.lot -> catalog_item -> vendor_id == Vendor.id
                 and u.billing_state in {BILLABLE, INVOICED} )
      # CONSERVED-QUANTITY INVARIANT (monetary):
      #   liability_after_explant_return_cycle == liability_before_implant
      # Implant moves a unit NOT_BILLABLE -> BILLABLE (+contract_price_cents).
      # Explant moves it BILLABLE -> CREDIT_PENDING (-contract_price_cents).
      # Neither the ship nor the credit step touches the sum again, so the
      # forward action and its compensating action leave the named quantity
      # exactly where it started. Any drift is a defect.
    input_set: "All DeviceUnits of the vendor in billing_state BILLABLE or INVOICED. Units in NOT_BILLABLE, CREDIT_PENDING, CREDITED or RECONCILED contribute zero. OWNED units (consignment_agreement_id null) never reach BILLABLE and therefore never contribute."
    constants: {}
    precision: "integer cents; no rounding — the sum is over already-frozen integers"

  # ------------------------------------------------------------------ C7
  - name: lot_unit_conservation
    trigger: "Recomputed whenever any DeviceUnit.custody_state changes and on every POST /udi/lots/{lot_id}/device-units"
    algorithm: aggregation
    formula: |
      Lot.received_qty  = count of DeviceUnits whose lot_id == Lot.id (never decreases)
      Lot.on_hand_qty   = count of those units with custody_state in
                          {QUARANTINED, AVAILABLE, RESERVED, RECALL_HOLD}
      Lot.consumed_qty  = count of those units with custody_state in
                          {IMPLANTED, EXPLANTED, WASTED, EXPIRED, RETURNED_TO_VENDOR, DISPOSED}
      # CONSERVED-QUANTITY INVARIANT (unit count):
      #   Lot.on_hand_qty + Lot.consumed_qty == Lot.received_qty   -- always
      # The AVAILABLE -> RESERVED -> AVAILABLE round trip is the canonical
      # compensating pair: both custody states sit in the on_hand bucket, so
      # reserving and then releasing the reservation leaves on_hand_qty,
      # consumed_qty AND received_qty numerically identical.
      # Auto-depletion: when Lot.status == AVAILABLE and the recomputed
      # on_hand_qty == 0 and received_qty >= 1, Lot.status := DEPLETED.
    input_set: "Every DeviceUnit whose lot_id equals this lot, regardless of billing_state. The ten custody states partition into exactly these two buckets with no state left out and none counted twice."
    constants: {}
    precision: "integer counts"

  # ------------------------------------------------------------------ C8
  - name: net_consignment_settlement
    trigger: "POST /udi/vendor-invoices/{invoice_id}/approve (writes VendorInvoice.credit_applied_cents and VendorInvoice.net_payable_cents)"
    algorithm: waterfall_allocation
    formula: |
      # This calculation LOOKS circular: the payable depends on the credit, the
      # credit cap depends on a tier, and a tier keyed on the payable would
      # depend on the credit again. THE EVALUATION ORDER IS PINNED BELOW; the
      # tier is keyed on gross_due_cents (step 1) and NEVER re-keyed on
      # net_payable_cents. Re-keying is the wrong reading and yields a
      # different, unstable answer.

      # step 1
      gross_due_cents = VendorInvoice.expected_total_cents

      # step 2 — credit pool: explanted units awaiting vendor credit under the
      #          SAME agreement, whatever invoice they were originally billed on
      credit_pool_cents = sum( u.contract_price_cents
                               for DeviceUnit u
                               where u.consignment_agreement_id == invoice.consignment_agreement_id
                                 and u.billing_state == "CREDIT_PENDING" )

      # step 3 — tier keyed on gross_due_cents; lower bound inclusive
      if   gross_due_cents <  500000:   credit_cap_pct = 0.20
      elif gross_due_cents < 2500000:   credit_cap_pct = 0.35
      else:                             credit_cap_pct = 0.50

      # step 4
      credit_applied_cents = min(credit_pool_cents,
                                 round_half_up(gross_due_cents * credit_cap_pct))

      # step 5
      net_payable_cents = gross_due_cents - credit_applied_cents
    input_set: "gross_due_cents is the expected_total_cents already written by consignment_expected_total at match time — never the submitted_total_cents. The credit pool spans every CREDIT_PENDING unit under the agreement, including units never invoiced."
    constants:
      CREDIT_TIER_1_UPPER_CENTS: 500000
      CREDIT_TIER_2_UPPER_CENTS: 2500000
      CREDIT_CAP_PCT_TIER_1: 0.20
      CREDIT_CAP_PCT_TIER_2: 0.35
      CREDIT_CAP_PCT_TIER_3: 0.50
    precision: "whole cents, round_half_up on the cap only"

  # ------------------------------------------------------------------ C9
  - name: explant_return_credit
    trigger: "POST /udi/implant-records/{implant_record_id}/explants (writes ExplantRecord.credit_expected_cents)"
    algorithm: threshold
    formula: |
      days_implanted = floor( (logical_clock - DeviceUnit.implanted_at_utc) / 86400 seconds )
      # BOUNDARY: 30 is inside tier 1; 31 falls to tier 2.
      if   days_implanted <= RETURN_TIER_1_DAYS:  pct = 1.00
      elif days_implanted <= RETURN_TIER_2_DAYS:  pct = 0.75
      else:                                       pct = 0.50
      basis = DeviceUnit.contract_price_cents if it is non-null else 0
      credit_expected_cents = round_half_up(basis * pct)
    input_set: "Only the explanted DeviceUnit. A unit that never became BILLABLE has contract_price_cents null and therefore a credit_expected_cents of 0."
    constants:
      RETURN_TIER_1_DAYS: 30
      RETURN_TIER_2_DAYS: 180
      RETURN_PCT_TIER_1: 1.00
      RETURN_PCT_TIER_2: 0.75
      RETURN_PCT_TIER_3: 0.50
    precision: "whole cents, round_half_up"

  # ------------------------------------------------------------------ C10
  - name: case_close_readiness
    trigger: "Recomputed on every mutation touching a case's reservations, implant records, registry submissions or charges; read by GET /udi/surgical-cases/{case_id}/readiness; enforced by POST /udi/surgical-cases/{case_id}/close"
    algorithm: constraint_propagation
    formula: |
      # FIRST MATCH WINS, evaluated strictly top to bottom
      if SurgicalCase.status in {SCHEDULED, IN_PROGRESS} and SurgicalCase.blocked_reservation_count > 0:
          readiness_status = "BLOCKED_RESERVATION"
      elif any ImplantRecord r of this case has r.status in {DOCUMENTED, AMENDED}:
          readiness_status = "BLOCKED_DOCUMENTATION"
      elif any RegistrySubmission s of this case's records has s.status in {REQUIRED, REJECTED}:
          readiness_status = "BLOCKED_REGISTRY"
      elif any ChargeCapture c of this case's records has c.status in {DRAFT, POSTED, CORRECTION_REQUIRED}:
          readiness_status = "BLOCKED_CHARGE"
      else:
          readiness_status = "READY"

      # The close endpoint maps each blocked posture to a distinct error, and the
      # mapping is the same top-to-bottom order (validations priorities 24, 25, 30):
      #   BLOCKED_RESERVATION   -> ERR_CASE_READINESS_UNMET     (409)
      #   BLOCKED_DOCUMENTATION -> ERR_CASE_READINESS_UNMET     (409)
      #   BLOCKED_REGISTRY      -> ERR_REGISTRY_OUTSTANDING     (409)
      #   BLOCKED_CHARGE        -> ERR_CHARGE_VARIANCE_UNRESOLVED (409)
    input_set: "ImplantRecords of this case in any status except VOIDED and EXPLANTED; RegistrySubmissions and ChargeCaptures reached through those records. A case with zero implant records and zero charges is READY."
    constants: {}
    precision: "n/a — enum"

  # ------------------------------------------------------------------ C11
  - name: ops_run_checkpoint
    trigger: "POST /udi/ops-runs"
    algorithm: chronological
    formula: |
      # Rules execute in this exact order; later rules observe the effects of
      # earlier ones. Within each rule, entities are processed in
      # created_at ASC order (never id order).

      # RULE 1 — agreement period expiry
      for each ConsignmentAgreement a with a.status == "ACTIVE"
              and a.period_end_utc < logical_clock:
          a.status = "EXPIRED"

      # RULE 2 — lot expiry sweep (depth-3 cascade)
      expired_lot_count = 0; expired_unit_count = 0
      for each Lot L with L.status in {QUARANTINE, AVAILABLE}
              and lot_expiry_instant(L) <= logical_clock:
          L.status = "EXPIRED"; expired_lot_count += 1
          for each DeviceUnit u on L:
              if u.custody_state in {QUARANTINED, AVAILABLE}:
                  u.custody_state = "EXPIRED"; u.expired_at_utc = logical_clock
                  expired_unit_count += 1
              elif u.custody_state == "RESERVED":
                  case = u.reserved_case_id; u.reserved_case_id = null
                  u.custody_state = "EXPIRED"; u.expired_at_utc = logical_clock
                  expired_unit_count += 1
                  case.blocked_reservation_count += 1     # itself re-derives readiness_status
          recompute L.on_hand_qty, L.consumed_qty          # itself re-derives
          recompute CatalogItem.on_hand_available_qty      # CatalogItem counters

      # RULE 3 — rotation alert (report only, mutates nothing)
      rotation_alert_count = count of DeviceUnits u with
          u.custody_state == "AVAILABLE" and
          logical_clock <= lot_expiry_instant(u.lot) <= logical_clock + ROTATION_WINDOW_DAYS days

      # RULE 4 — recall notification escalation
      escalated_notification_count = 0
      for each RecallNotification n with n.status == "PENDING" and n.due_utc < logical_clock:
          n.escalation_level += 1; escalated_notification_count += 1
          if n.escalation_level >= NOTIFICATION_ESCALATION_LIMIT:
              n.status = "UNREACHABLE"
              recompute FieldAction.notification_open_count
              if FieldAction.status == "PUBLISHED": FieldAction.status = "IN_REMEDIATION"

      # RULE 5 — registry deadline breach (report only)
      overdue_submission_count = count of RegistrySubmissions with
          status in {REQUIRED, REJECTED} and deadline_utc < logical_clock

      ops_run_index = number of ops-runs executed so far, first run returns 1
    input_set: "All ConsignmentAgreements, Lots, DeviceUnits, RecallNotifications and RegistrySubmissions in the system. Rule 2 deliberately expires RESERVED units as well as free stock, which is what makes the blocked_reservation_count cascade observable."
    constants:
      ROTATION_WINDOW_DAYS: 45
      NOTIFICATION_ESCALATION_LIMIT: 2
    precision: "integer counts"

# =============================================================================
# §1.4 Validation Rules Table — evaluated in strict ascending priority order.
# The FIRST rule that fails determines the response; no later rule runs and no
# side effect from a later stage is applied.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID are both present and non-blank; X-User-Role is one of the six §1.7 role names; when X-User-Role is VendorRep, X-User-ID resolves to an existing Vendor.id"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role appears in the called endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request body shape: every required input field present and non-null; enum fields carry a declared member; integer fields are integers within their declared range; scheduled_end_utc strictly after scheduled_start_utc; exactly one of catalog_item_id / device_unit_id on reservations; lot_numbers present only when scope_type is LOT; serial_low and serial_high present only when scope_type is SERIAL_RANGE; pagination limit in [1,100] and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every path parameter resolves to a live row, validated left to right"
    error_id: "ERR_VENDOR_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_CATALOG_ITEM_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_DEVICE_UNIT_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_IMPLANT_RECORD_NOT_FOUND | ERR_CHARGE_NOT_FOUND | ERR_REGISTRY_SUBMISSION_NOT_FOUND | ERR_FIELD_ACTION_NOT_FOUND | ERR_RECALL_NOTIFICATION_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_EXPLANT_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "Every foreign-key value in the request body resolves to a live row, validated in the order the fields are declared in the endpoint's input list; for device_unit_ids arrays, in array order"
    error_id: "ERR_VENDOR_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_CATALOG_ITEM_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_DEVICE_UNIT_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_IMPLANT_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with foreign keys in the body"

  - priority: 6
    category: auth
    check: "A VendorRep may only act on rows whose vendor_id equals X-User-ID, resolved directly (VendorInvoice.vendor_id) or through ExplantRecord -> ImplantRecord -> DeviceUnit -> Lot -> CatalogItem.vendor_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /udi/vendor-invoices, POST /udi/vendor-invoices/{invoice_id}/resubmit, POST /udi/explant-records/{explant_record_id}/credit"

  - priority: 7
    category: state
    check: "expected_<parent>_version in the body equals the parent's current version (§1.2.1 optimistic concurrency)"
    error_id: "ERR_STALE_CASE_VERSION | ERR_STALE_LOT_VERSION | ERR_STALE_AGREEMENT_VERSION"
    http_status: 412
    applies_to: "POST /udi/surgical-cases/{case_id}/implant-records, POST /udi/lots/{lot_id}/device-units, POST /udi/vendor-invoices"

  - priority: 8
    category: state
    check: "The PATH-target resource is in a state from which the requested transition is declared in §1.2. Cross-referenced entities named in the body are NOT checked here — they are checked at priorities 15-18."
    error_id: "ERR_INVALID_CASE_STATE | ERR_INVALID_UNIT_STATE | ERR_INVALID_RECORD_STATE | ERR_INVALID_INVOICE_STATE | ERR_INVALID_LIFECYCLE_STATE"
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 9
    category: auth
    check: "Separation of duties on X-User-ID: release requires X-User-ID != Lot.received_by_user_id; verify requires X-User-ID != ImplantRecord.documented_by_user_id; approve requires X-User-ID != VendorInvoice.matched_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /udi/lots/{lot_id}/release, POST /udi/implant-records/{implant_record_id}/verify, POST /udi/vendor-invoices/{invoice_id}/approve"

  - priority: 10
    category: business_safety
    check: "The referenced DeviceUnit is not under a field action: custody_state != RECALL_HOLD and its Lot.status != RECALLED"
    error_id: ERR_UNIT_RECALLED
    http_status: 422
    applies_to: "POST /udi/surgical-cases/{case_id}/reservations, POST /udi/surgical-cases/{case_id}/implant-records"

  - priority: 11
    category: business_safety
    check: "The referenced DeviceUnit's lot expiry instant (expiration_date at 23:59:59.999Z) is strictly after the logical clock, and for reservations strictly after SurgicalCase.scheduled_end_utc"
    error_id: ERR_UNIT_EXPIRED
    http_status: 422
    applies_to: "POST /udi/surgical-cases/{case_id}/reservations (device_unit_id form), POST /udi/surgical-cases/{case_id}/implant-records"

  - priority: 12
    category: business_safety
    check: "UDI transcription matches the physical unit: udi_di equals DeviceUnit.udi_di_snapshot and udi_pi_serial equals DeviceUnit.udi_serial"
    error_id: ERR_UDI_INCOMPLETE
    http_status: 422
    applies_to: "POST /udi/surgical-cases/{case_id}/implant-records"

  - priority: 13
    category: business_safety
    check: "When patient_id is supplied it equals SurgicalCase.patient_id"
    error_id: ERR_PATIENT_LINK_MISMATCH
    http_status: 422
    applies_to: "POST /udi/surgical-cases/{case_id}/implant-records"

  - priority: 14
    category: business_safety
    check: "RegistrySubmission.completeness_score >= REGISTRY_MIN_COMPLETENESS_SCORE (80)"
    error_id: ERR_REGISTRY_SUBMISSION_INCOMPLETE
    http_status: 422
    applies_to: "POST /udi/registry-submissions/{submission_id}/submit"

  - priority: 15
    category: business_referential
    check: "The DeviceUnit's Lot.status == AVAILABLE (a lot still in QUARANTINE has not passed incoming inspection). This runs BEFORE the unit-custody check at priority 16, because a unit sitting in a quarantined lot always also fails that later check and the operator needs the lot-level reason."
    error_id: ERR_LOT_NOT_RELEASED
    http_status: 409
    applies_to: "POST /udi/surgical-cases/{case_id}/reservations, POST /udi/surgical-cases/{case_id}/implant-records"

  - priority: 16
    category: business_referential
    check: "The DeviceUnit referenced in the body is in an allowed custody_state: AVAILABLE for reservations; AVAILABLE or RESERVED for implant documentation; IMPLANTED for explants"
    error_id: ERR_INVALID_UNIT_STATE
    http_status: 409
    applies_to: "POST /udi/surgical-cases/{case_id}/reservations, POST /udi/surgical-cases/{case_id}/implant-records, POST /udi/implant-records/{implant_record_id}/explants"

  - priority: 17
    category: business_referential
    check: "The referenced ConsignmentAgreement.status == ACTIVE"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /udi/lots/{lot_id}/device-units, POST /udi/vendor-invoices, POST /udi/vendor-invoices/{invoice_id}/approve"

  - priority: 18
    category: business_referential
    check: "The referenced Vendor.standing == ACTIVE (a vendor under an open CLASS_I field action is on HOLD)"
    error_id: ERR_VENDOR_ON_HOLD
    http_status: 409
    applies_to: "POST /udi/vendor-invoices, POST /udi/vendor-invoices/{invoice_id}/resubmit"

  - priority: 19
    category: business_constraint
    check: "Uniqueness: DeviceUnit.udi_serial unique per catalog item; Lot.lot_number unique per catalog item; CatalogItem.device_identifier globally unique; VendorInvoice.invoice_number unique per vendor; Vendor.vendor_code, ConsignmentAgreement.agreement_code (per vendor), Patient.mrn, SurgicalCase.case_number and FieldAction.action_code unique in their declared scope"
    error_id: "ERR_DUPLICATE_UDI_SERIAL | ERR_DUPLICATE_LOT_NUMBER | ERR_DUPLICATE_IDENTIFIER"
    http_status: 409
    applies_to: "POST /udi/vendors, POST /udi/consignment-agreements, POST /udi/catalog-items, POST /udi/lots, POST /udi/lots/{lot_id}/device-units, POST /udi/patients, POST /udi/surgical-cases, POST /udi/field-actions, POST /udi/vendor-invoices"

  - priority: 20
    category: business_constraint
    check: "Every DeviceUnit listed in device_unit_ids has vendor_invoice_id null (not already carried on another invoice)"
    error_id: ERR_UNIT_ALREADY_INVOICED
    http_status: 409
    applies_to: "POST /udi/vendor-invoices, POST /udi/vendor-invoices/{invoice_id}/resubmit"

  - priority: 21
    category: business_temporal
    check: "OR-ROOM OCCUPANCY, HALF-OPEN, NO BUFFER. The requested [scheduled_start_utc, scheduled_end_utc) must not intersect the half-open interval of any other SurgicalCase with the same or_room_code whose status is in {SCHEDULED, IN_PROGRESS}. Touching endpoints (a.end == b.start) do NOT intersect and are accepted."
    error_id: ERR_OR_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /udi/surgical-cases"

  - priority: 22
    category: business_temporal
    check: "PATIENT RECOVERY OCCUPANCY, CLOSED, BUFFERED. Expand both the requested window and every existing window of the same patient_id (status in {SCHEDULED, IN_PROGRESS}) by PATIENT_RECOVERY_BUFFER_MINUTES = 120 on each side, then compare as CLOSED intervals: [start-120m, end+120m]. Touching endpoints DO intersect and are rejected. This is deliberately different geometry from priority 21."
    error_id: ERR_PATIENT_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /udi/surgical-cases"

  - priority: 23
    category: business_constraint
    check: "The FEFO candidate pool of calculations.fefo_unit_selection is non-empty (catalog_item_id form of the reservation request only)"
    error_id: ERR_NO_ELIGIBLE_UNIT
    http_status: 409
    applies_to: "POST /udi/surgical-cases/{case_id}/reservations"

  - priority: 24
    category: business_constraint
    check: "SurgicalCase.readiness_status is not BLOCKED_RESERVATION and not BLOCKED_DOCUMENTATION"
    error_id: ERR_CASE_READINESS_UNMET
    http_status: 409
    applies_to: "POST /udi/surgical-cases/{case_id}/close"

  - priority: 25
    category: business_constraint
    check: "SurgicalCase.readiness_status is not BLOCKED_REGISTRY"
    error_id: ERR_REGISTRY_OUTSTANDING
    http_status: 409
    applies_to: "POST /udi/surgical-cases/{case_id}/close"

  - priority: 26
    category: business_constraint
    check: "FieldAction.notification_open_count == 0"
    error_id: ERR_RECALL_REMEDIATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /udi/field-actions/{field_action_id}/close"

  - priority: 27
    category: business_fiscal
    check: "Every DeviceUnit listed in device_unit_ids has billing_state == BILLABLE"
    error_id: ERR_UNIT_NOT_BILLABLE
    http_status: 409
    applies_to: "POST /udi/vendor-invoices, POST /udi/vendor-invoices/{invoice_id}/resubmit"

  - priority: 28
    category: business_fiscal
    check: "An invoice in VARIANCE_HOLD may only be approved when override_reason is present and non-empty"
    error_id: ERR_INVOICE_TOLERANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /udi/vendor-invoices/{invoice_id}/approve"

  - priority: 29
    category: business_fiscal
    check: "acknowledged_variance_cents equals ChargeCapture.variance_cents exactly"
    error_id: ERR_VARIANCE_ACK_MISMATCH
    http_status: 422
    applies_to: "POST /udi/charge-captures/{charge_id}/correct"

  - priority: 30
    category: business_fiscal
    check: "SurgicalCase.readiness_status is not BLOCKED_CHARGE"
    error_id: ERR_CHARGE_VARIANCE_UNRESOLVED
    http_status: 409
    applies_to: "POST /udi/surgical-cases/{case_id}/close"

  - priority: 31
    category: business_fiscal
    check: "credit_issued_cents <= ExplantRecord.credit_expected_cents"
    error_id: ERR_CREDIT_EXCEEDS_EXPECTED
    http_status: 422
    applies_to: "POST /udi/explant-records/{explant_record_id}/credit"

# =============================================================================
# §1.5 API Endpoint Table
# All business paths are prefixed /udi. The single test-driving endpoint lives
# under /_clock per the §1.5 priority ladder (no business endpoint can move a
# logical clock backwards or forwards arbitrarily).
# =============================================================================
endpoints:

  # ------------------------------------------------------------- logical clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time. Every expiry, deadline, turnaround and interval rule in this scaffold reads the logical clock."
    roles: [ReceivingTech, InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst, VendorRep]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: datetime }"
    side_effects: ["Sets the logical clock; performs no sweeps (only POST /udi/ops-runs sweeps)"]

  # ------------------------------------------------------------------ Vendors
  - method: POST
    path: "/udi/vendors"
    description: "Register an implant vendor"
    roles: [InventoryLead]
    code: 201
    input: ["name", "vendor_code"]
    output: Vendor
    side_effects: ["standing := ACTIVE", "open_consignment_liability_cents := 0", "recall_open_count := 0"]

  - method: GET
    path: "/udi/vendors/{vendor_id}"
    description: "Read one vendor including its live consignment liability"
    roles: [ReceivingTech, InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst, VendorRep]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: GET
    path: "/udi/vendors"
    description: "List vendors"
    roles: [ReceivingTech, InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst, VendorRep]
    code: 200
    input: ["standing?", "limit?", "offset?"]
    output: Vendor[]
    side_effects: []

  # ---------------------------------------------------- Consignment agreements
  - method: POST
    path: "/udi/consignment-agreements"
    description: "Create a consignment agreement in DRAFT"
    roles: [InventoryLead]
    code: 201
    input: ["vendor_id", "agreement_code", "billing_trigger", "reconciliation_method", "period_start_utc", "period_end_utc", "invoice_tolerance_bps?", "replenishment_days?"]
    output: ConsignmentAgreement
    side_effects: ["status := DRAFT", "price_list_version := 1"]

  - method: POST
    path: "/udi/consignment-agreements/{agreement_id}/activate"
    description: "Activate a DRAFT agreement"
    roles: [InventoryLead]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects: ["status := ACTIVE", "increments ConsignmentAgreement.version by 1"]

  - method: POST
    path: "/udi/consignment-agreements/{agreement_id}/price-list-revisions"
    description: "Record a vendor price-list revision against an ACTIVE agreement"
    roles: [InventoryLead]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects: ["price_list_version += 1", "increments ConsignmentAgreement.version by 1"]

  - method: GET
    path: "/udi/consignment-agreements/{agreement_id}"
    description: "Read one agreement"
    roles: [ReceivingTech, InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst, VendorRep]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects: []

  - method: GET
    path: "/udi/consignment-agreements"
    description: "List agreements, optionally scoped to one vendor"
    roles: [ReceivingTech, InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst, VendorRep]
    code: 200
    input: ["vendor_id?", "status?", "limit?", "offset?"]
    output: ConsignmentAgreement[]
    side_effects: []

  # ------------------------------------------------------------ Catalog items
  - method: POST
    path: "/udi/catalog-items"
    description: "Register a device model (UDI-DI record)"
    roles: [InventoryLead]
    code: 201
    input: ["vendor_id", "device_identifier", "description", "category", "list_charge_cents", "charge_code", "shelf_life_days", "registry_required?"]
    output: CatalogItem
    side_effects: ["on_hand_available_qty := 0"]

  - method: GET
    path: "/udi/catalog-items/{catalog_item_id}"
    description: "Read one catalog item"
    roles: [ReceivingTech, InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst, VendorRep]
    code: 200
    input: []
    output: CatalogItem
    side_effects: []

  - method: GET
    path: "/udi/catalog-items"
    description: "List catalog items, optionally scoped to one vendor"
    roles: [ReceivingTech, InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst, VendorRep]
    code: 200
    input: ["vendor_id?", "category?", "limit?", "offset?"]
    output: CatalogItem[]
    side_effects: []

  # --------------------------------------------------------------------- Lots
  - method: POST
    path: "/udi/lots"
    description: "Receive a lot into quarantine"
    roles: [ReceivingTech]
    code: 201
    input: ["catalog_item_id", "lot_number", "expiration_date"]
    output: Lot
    side_effects: ["status := QUARANTINE", "received_at_utc := logical clock", "received_by_user_id := X-User-ID", "received_qty := 0"]

  - method: POST
    path: "/udi/lots/{lot_id}/device-units"
    description: "Add one serialized unit to a lot still in QUARANTINE (optimistic-concurrency guarded)"
    roles: [ReceivingTech]
    code: 201
    input: ["udi_serial", "acquisition_cost_cents", "expected_lot_version", "consignment_agreement_id?", "replaced_unit_id?"]
    output: DeviceUnit
    side_effects: ["custody_state := QUARANTINED", "billing_state := NOT_BILLABLE", "ownership := CONSIGNED when consignment_agreement_id is supplied else OWNED", "udi_di_snapshot := CatalogItem.device_identifier", "recompute Lot.received_qty and Lot.on_hand_qty", "increments Lot.version by 1"]

  - method: POST
    path: "/udi/lots/{lot_id}/release"
    description: "Release a quarantined lot after incoming inspection. Separation of duties: the releasing X-User-ID must differ from Lot.received_by_user_id."
    roles: [ReceivingTech, InventoryLead]
    code: 200
    input: []
    output: Lot
    side_effects: ["status := AVAILABLE", "released_by_user_id := X-User-ID", "every QUARANTINED unit on the lot moves to AVAILABLE", "ON_RECEIPT consigned units move to BILLABLE and freeze contract_price_cents", "recompute CatalogItem.on_hand_available_qty and Vendor.open_consignment_liability_cents"]

  - method: GET
    path: "/udi/lots/{lot_id}"
    description: "Read one lot with its live conservation counters"
    roles: [ReceivingTech, InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst, VendorRep]
    code: 200
    input: []
    output: Lot
    side_effects: []

  - method: GET
    path: "/udi/lots"
    description: "List lots, optionally scoped to one catalog item"
    roles: [ReceivingTech, InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst, VendorRep]
    code: 200
    input: ["catalog_item_id?", "status?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []

  # ------------------------------------------------------------- Device units
  - method: GET
    path: "/udi/device-units/{device_unit_id}"
    description: "Read one serialized unit with both state dimensions"
    roles: [ReceivingTech, InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst, VendorRep]
    code: 200
    input: []
    output: DeviceUnit
    side_effects: []

  - method: GET
    path: "/udi/device-units"
    description: "List serialized units. Every foreign key on DeviceUnit is exposed as a filter here, including the self-reference replaced_unit_id."
    roles: [ReceivingTech, InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst, VendorRep]
    code: 200
    input: ["lot_id?", "consignment_agreement_id?", "vendor_invoice_id?", "reserved_case_id?", "replaced_unit_id?", "custody_state?", "billing_state?", "limit?", "offset?"]
    output: DeviceUnit[]
    side_effects: []

  - method: POST
    path: "/udi/device-units/{device_unit_id}/release-reservation"
    description: "Release a unit's reservation back to free stock"
    roles: [InventoryLead, CircClinician]
    code: 200
    input: []
    output: DeviceUnit
    side_effects: ["custody_state := AVAILABLE", "reserved_case_id := null", "recompute CatalogItem.on_hand_available_qty and SurgicalCase.readiness_status", "Lot.on_hand_qty and Lot.consumed_qty are unchanged"]

  - method: POST
    path: "/udi/device-units/{device_unit_id}/waste"
    description: "Record a unit opened but not implanted"
    roles: [CircClinician]
    code: 200
    input: []
    output: DeviceUnit
    side_effects: ["custody_state := WASTED", "reserved_case_id := null", "recompute Lot.on_hand_qty / Lot.consumed_qty / CatalogItem.on_hand_available_qty", "Lot auto-depletes when on_hand_qty reaches 0"]

  # ----------------------------------------------------------------- Patients
  - method: POST
    path: "/udi/patients"
    description: "Register a patient"
    roles: [CircClinician]
    code: 201
    input: ["mrn", "display_name", "registry_consent?"]
    output: Patient
    side_effects: ["implant_count := 0"]

  - method: PATCH
    path: "/udi/patients/{patient_id}"
    description: "Update patient demographics or registry consent"
    roles: [CircClinician, ComplianceOfficer]
    code: 200
    input: ["registry_consent?", "display_name?"]
    output: Patient
    side_effects: ["increments Patient.version by 1"]

  - method: GET
    path: "/udi/patients/{patient_id}"
    description: "Read one patient. VendorRep is excluded — vendors never see PHI."
    roles: [CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/udi/patients"
    description: "List patients. VendorRep is excluded."
    roles: [CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst]
    code: 200
    input: ["registry_consent?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []

  # ---------------------------------------------------------- Surgical cases
  - method: POST
    path: "/udi/surgical-cases"
    description: "Schedule a surgical case. Guarded by two different interval geometries: the OR room is half-open and unbuffered, the patient is closed and buffered by 120 minutes."
    roles: [CircClinician]
    code: 201
    input: ["patient_id", "case_number", "or_room_code", "scheduled_start_utc", "scheduled_end_utc", "surgeon_code"]
    output: SurgicalCase
    side_effects: ["status := SCHEDULED", "readiness_status := READY", "blocked_reservation_count := 0"]

  - method: GET
    path: "/udi/surgical-cases/{case_id}"
    description: "Read one case"
    roles: [ReceivingTech, InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst]
    code: 200
    input: []
    output: SurgicalCase
    side_effects: []

  - method: GET
    path: "/udi/surgical-cases"
    description: "List cases, optionally scoped to one patient"
    roles: [ReceivingTech, InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst]
    code: 200
    input: ["patient_id?", "status?", "or_room_code?", "limit?", "offset?"]
    output: SurgicalCase[]
    side_effects: []

  - method: GET
    path: "/udi/surgical-cases/{case_id}/readiness"
    description: "Computed read of the close-gate posture and its four counters"
    roles: [ReceivingTech, InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst]
    code: 200
    input: []
    output: "{ readiness_status: string, blocked_reservation_count: integer, unverified_record_count: integer, outstanding_registry_count: integer, unfinalized_charge_count: integer, total_posted_charge_cents: integer }"
    side_effects: []

  - method: POST
    path: "/udi/surgical-cases/{case_id}/reservations"
    description: "Reserve a device unit for a scheduled case. Supply catalog_item_id for a server-side FEFO pick, or device_unit_id to pin a specific serial. Exactly one of the two is required."
    roles: [CircClinician, InventoryLead]
    code: 201
    input: ["catalog_item_id?", "device_unit_id?"]
    output: DeviceUnit
    side_effects: ["custody_state := RESERVED", "reserved_case_id := SurgicalCase.id", "SurgicalCase.blocked_reservation_count := max(0, count - 1)", "recompute CatalogItem.on_hand_available_qty and SurgicalCase.readiness_status"]

  - method: POST
    path: "/udi/surgical-cases/{case_id}/start"
    description: "Move a scheduled case into the OR"
    roles: [CircClinician]
    code: 200
    input: []
    output: SurgicalCase
    side_effects: ["status := IN_PROGRESS", "increments SurgicalCase.version by 1"]

  - method: POST
    path: "/udi/surgical-cases/{case_id}/implant-records"
    description: "Document an implanted device and link it to the patient (optimistic-concurrency guarded on the case)"
    roles: [CircClinician]
    code: 201
    input: ["device_unit_id", "udi_di", "udi_pi_serial", "anatomic_site", "laterality", "expected_case_version", "patient_id?"]
    output: ImplantRecord
    side_effects: ["ImplantRecord.status := DOCUMENTED", "DeviceUnit.custody_state := IMPLANTED and implanted_at_utc := logical clock", "ON_IMPLANT consigned units move to BILLABLE and freeze contract_price_cents and price_list_version_at_billing", "recompute Vendor.open_consignment_liability_cents, Lot counters, CatalogItem.on_hand_available_qty, Patient.implant_count, SurgicalCase.implant_record_count and readiness_status", "increments SurgicalCase.version by 1"]

  - method: POST
    path: "/udi/surgical-cases/{case_id}/close"
    description: "Close a case. Rejected unless readiness_status is READY."
    roles: [CircClinician]
    code: 200
    input: []
    output: SurgicalCase
    side_effects: ["status := CLOSED", "every unit still RESERVED to the case returns to AVAILABLE"]

  - method: POST
    path: "/udi/surgical-cases/{case_id}/cancel"
    description: "Cancel a SCHEDULED case or abort an IN_PROGRESS one. The side-effect set differs per source state."
    roles: [CircClinician]
    code: 200
    input: []
    output: SurgicalCase
    side_effects: ["from SCHEDULED: status := CANCELLED and reservations released", "from IN_PROGRESS: status := ABORTED, reservations released, DOCUMENTED implant records voided, their charges voided, case totals and Patient.implant_count recomputed"]

  # --------------------------------------------------------- Implant records
  - method: GET
    path: "/udi/implant-records/{implant_record_id}"
    description: "Read one implant record"
    roles: [ReceivingTech, InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst]
    code: 200
    input: []
    output: ImplantRecord
    side_effects: []

  - method: GET
    path: "/udi/implant-records"
    description: "List implant records. This is the recall lookup surface across implanted patients: filter by patient_id to answer 'what is in this patient', by device_unit_id to answer 'where did this serial go'."
    roles: [ReceivingTech, InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst]
    code: 200
    input: ["surgical_case_id?", "device_unit_id?", "patient_id?", "status?", "limit?", "offset?"]
    output: ImplantRecord[]
    side_effects: []

  - method: POST
    path: "/udi/implant-records/{implant_record_id}/verify"
    description: "Verify a documented implant. Separation of duties: the verifying X-User-ID must differ from documented_by_user_id."
    roles: [CircClinician, ComplianceOfficer]
    code: 200
    input: []
    output: ImplantRecord
    side_effects: ["status := VERIFIED", "verified_by_user_id and verified_at_utc written", "creates a RegistrySubmission in REQUIRED when the catalog item requires registry reporting and consent is not DECLINED, or directly in EXEMPT when consent is DECLINED", "recompute SurgicalCase.readiness_status"]

  - method: POST
    path: "/udi/implant-records/{implant_record_id}/amend"
    description: "Reopen a verified record for amendment"
    roles: [CircClinician]
    code: 200
    input: []
    output: ImplantRecord
    side_effects: ["status := AMENDED", "amendment_count += 1", "any SUBMITTED RegistrySubmission for this record reverts to REQUIRED", "recompute SurgicalCase.readiness_status"]

  - method: POST
    path: "/udi/implant-records/{implant_record_id}/explants"
    description: "Record an explantation, creating the return record"
    roles: [CircClinician]
    code: 201
    input: ["reason", "replacement_device_unit_id?"]
    output: ExplantRecord
    side_effects: ["ExplantRecord.status := RECORDED with credit_expected_cents from calculations.explant_return_credit", "ImplantRecord.status := EXPLANTED", "DeviceUnit.custody_state := EXPLANTED and billing_state BILLABLE|INVOICED := CREDIT_PENDING", "recompute Vendor.open_consignment_liability_cents", "POSTED charges of the record move to CORRECTION_REQUIRED", "recompute SurgicalCase.total_posted_charge_cents and readiness_status"]

  # --------------------------------------------------------- Charge captures
  - method: POST
    path: "/udi/implant-records/{implant_record_id}/charges"
    description: "Create a charge line for an implanted device, computing the PROVISIONAL amount"
    roles: [RevenueIntegrityAnalyst]
    code: 201
    input: ["quantity?"]
    output: ChargeCapture
    side_effects: ["status := DRAFT", "charge_code copied from the catalog item", "provisional_charge_cents written by calculations.implant_charge_amount variant PROVISIONAL", "capture_variant := PROVISIONAL"]

  - method: GET
    path: "/udi/charge-captures/{charge_id}"
    description: "Read one charge line"
    roles: [InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst]
    code: 200
    input: []
    output: ChargeCapture
    side_effects: []

  - method: GET
    path: "/udi/charge-captures"
    description: "List charge lines, optionally scoped to one implant record"
    roles: [InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst]
    code: 200
    input: ["implant_record_id?", "status?", "limit?", "offset?"]
    output: ChargeCapture[]
    side_effects: []

  - method: POST
    path: "/udi/charge-captures/{charge_id}/post"
    description: "Post a draft charge to the case ledger"
    roles: [RevenueIntegrityAnalyst]
    code: 200
    input: []
    output: ChargeCapture
    side_effects: ["status := POSTED", "recompute SurgicalCase.total_posted_charge_cents and readiness_status"]

  - method: POST
    path: "/udi/charge-captures/{charge_id}/finalize"
    description: "Recompute the charge under the FINAL variant. Forks to FINALIZED or CORRECTION_REQUIRED on the computed variance."
    roles: [RevenueIntegrityAnalyst]
    code: 200
    input: []
    output: ChargeCapture
    side_effects: ["final_charge_cents, variance_cents and capture_variant := FINAL written", "status := FINALIZED, or CORRECTION_REQUIRED for a high-cost implant whose absolute variance is at least 25000 cents", "recompute SurgicalCase.total_posted_charge_cents and readiness_status"]

  - method: POST
    path: "/udi/charge-captures/{charge_id}/correct"
    description: "Acknowledge a high-cost variance and finalize the line"
    roles: [RevenueIntegrityAnalyst]
    code: 200
    input: ["acknowledged_variance_cents"]
    output: ChargeCapture
    side_effects: ["status := FINALIZED", "recompute SurgicalCase.readiness_status"]

  - method: POST
    path: "/udi/charge-captures/{charge_id}/void"
    description: "Void a charge line, compensating the case ledger exactly"
    roles: [RevenueIntegrityAnalyst]
    code: 200
    input: []
    output: ChargeCapture
    side_effects: ["status := VOIDED", "recompute SurgicalCase.total_posted_charge_cents and readiness_status"]

  # ----------------------------------------------------- Registry submissions
  - method: GET
    path: "/udi/registry-submissions/{submission_id}"
    description: "Read one registry submission with a freshly recomputed completeness_score"
    roles: [CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst]
    code: 200
    input: []
    output: RegistrySubmission
    side_effects: ["completeness_score recomputed on read"]

  - method: GET
    path: "/udi/registry-submissions"
    description: "List registry submissions, optionally scoped to one implant record"
    roles: [CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst]
    code: 200
    input: ["implant_record_id?", "status?", "limit?", "offset?"]
    output: RegistrySubmission[]
    side_effects: ["completeness_score recomputed on read"]

  - method: POST
    path: "/udi/registry-submissions/{submission_id}/submit"
    description: "Submit to the national registry. Rejected unless completeness_score is at least 80."
    roles: [ComplianceOfficer]
    code: 200
    input: ["registry_code"]
    output: RegistrySubmission
    side_effects: ["status := SUBMITTED", "submitted_at_utc written", "resubmission_count += 1 when the previous status was REJECTED", "recompute SurgicalCase.readiness_status"]

  - method: POST
    path: "/udi/registry-submissions/{submission_id}/adjudicate"
    description: "Record the registry's response"
    roles: [ComplianceOfficer]
    code: 200
    input: ["outcome", "rejection_reason?"]
    output: RegistrySubmission
    side_effects: ["status := ACCEPTED or REJECTED", "adjudicated_at_utc written", "recompute SurgicalCase.readiness_status"]

  # ------------------------------------------------------------ Field actions
  - method: POST
    path: "/udi/field-actions"
    description: "Draft a vendor field action / recall"
    roles: [ComplianceOfficer]
    code: 201
    input: ["vendor_id", "catalog_item_id", "action_code", "action_class", "scope_type", "effective_from_utc", "lot_numbers?", "serial_low?", "serial_high?"]
    output: FieldAction
    side_effects: ["status := DRAFT", "cohort sizes := 0"]

  - method: POST
    path: "/udi/field-actions/{field_action_id}/publish"
    description: "Publish the field action, running the exposure cohort and the four-hop quarantine cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: FieldAction
    side_effects: ["status := PUBLISHED and published_at_utc written", "matched lots move to RECALLED", "their non-terminal units move to RECALL_HOLD", "RESERVED units detach and increment their case's blocked_reservation_count, flipping that case to BLOCKED_RESERVATION", "one PENDING RecallNotification per distinct implanted record", "CLASS_I sets Vendor.standing := HOLD", "recompute Vendor.recall_open_count"]

  - method: POST
    path: "/udi/field-actions/{field_action_id}/close"
    description: "Close a field action once every notification is resolved, disposing the held stock"
    roles: [ComplianceOfficer]
    code: 200
    input: ["on_hand_disposition"]
    output: FieldAction
    side_effects: ["status := CLOSED", "non-terminal notifications move to CLOSED", "RECALL_HOLD units move to RETURNED_TO_VENDOR or DISPOSED", "recompute Vendor.recall_open_count and return Vendor.standing to ACTIVE when it reaches 0"]

  - method: GET
    path: "/udi/field-actions/{field_action_id}"
    description: "Read one field action"
    roles: [ReceivingTech, InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst, VendorRep]
    code: 200
    input: []
    output: FieldAction
    side_effects: []

  - method: GET
    path: "/udi/field-actions"
    description: "List field actions, optionally scoped to one vendor or one catalog item"
    roles: [ReceivingTech, InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst, VendorRep]
    code: 200
    input: ["vendor_id?", "catalog_item_id?", "status?", "limit?", "offset?"]
    output: FieldAction[]
    side_effects: []

  - method: GET
    path: "/udi/field-actions/{field_action_id}/exposure"
    description: "Recall lookup across implanted patients: recomputed exposure cohort for this action"
    roles: [ComplianceOfficer, CircClinician, InventoryLead, RevenueIntegrityAnalyst]
    code: 200
    input: []
    output: "{ implanted_cohort_size: integer, on_hand_cohort_size: integer, patient_ids: string[], implant_record_ids: string[], notification_open_count: integer }"
    side_effects: []

  # ------------------------------------------------------ Recall notifications
  - method: GET
    path: "/udi/recall-notifications/{notification_id}"
    description: "Read one recall notification"
    roles: [ComplianceOfficer, CircClinician, InventoryLead, RevenueIntegrityAnalyst]
    code: 200
    input: []
    output: RecallNotification
    side_effects: []

  - method: GET
    path: "/udi/recall-notifications"
    description: "List recall notifications, optionally scoped to one field action, implant record or patient"
    roles: [ComplianceOfficer, CircClinician, InventoryLead, RevenueIntegrityAnalyst]
    code: 200
    input: ["field_action_id?", "implant_record_id?", "patient_id?", "status?", "limit?", "offset?"]
    output: RecallNotification[]
    side_effects: []

  - method: POST
    path: "/udi/recall-notifications/{notification_id}/resolve"
    description: "Record the outcome of patient outreach"
    roles: [ComplianceOfficer]
    code: 200
    input: ["outcome", "outcome_note?"]
    output: RecallNotification
    side_effects: ["status := NOTIFIED, ACKNOWLEDGED or UNREACHABLE", "recompute FieldAction.notification_open_count", "a PUBLISHED field action bubbles up to IN_REMEDIATION"]

  # ---------------------------------------------------------- Vendor invoices
  - method: POST
    path: "/udi/vendor-invoices"
    description: "Vendor submits a consignment invoice (optimistic-concurrency guarded on the agreement)"
    roles: [VendorRep]
    code: 201
    input: ["vendor_id", "consignment_agreement_id", "invoice_number", "submitted_total_cents", "device_unit_ids", "expected_agreement_version"]
    output: VendorInvoice
    side_effects: ["status := SUBMITTED", "every listed unit moves BILLABLE -> INVOICED with vendor_invoice_id set", "increments ConsignmentAgreement.version by 1"]

  - method: POST
    path: "/udi/vendor-invoices/{invoice_id}/match"
    description: "Reconcile the invoice against consumption; forks to MATCHED or VARIANCE_HOLD"
    roles: [RevenueIntegrityAnalyst]
    code: 200
    input: []
    output: VendorInvoice
    side_effects: ["expected_total_cents, variance_cents, variance_bps and reconciliation_variant written by calculations.consignment_expected_total", "matched_by_user_id := X-User-ID", "status := MATCHED or VARIANCE_HOLD"]

  - method: POST
    path: "/udi/vendor-invoices/{invoice_id}/approve"
    description: "Approve for payment. Separation of duties: the approving X-User-ID must differ from matched_by_user_id."
    roles: [ComplianceOfficer, RevenueIntegrityAnalyst]
    code: 200
    input: ["override_reason?"]
    output: VendorInvoice
    side_effects: ["credit_applied_cents and net_payable_cents written by calculations.net_consignment_settlement", "status := APPROVED", "every unit on the invoice moves INVOICED -> RECONCILED", "recompute Vendor.open_consignment_liability_cents"]

  - method: POST
    path: "/udi/vendor-invoices/{invoice_id}/dispute"
    description: "Dispute an invoice held on variance, releasing its units back to billable"
    roles: [RevenueIntegrityAnalyst]
    code: 200
    input: []
    output: VendorInvoice
    side_effects: ["status := DISPUTED", "every unit moves INVOICED -> BILLABLE and vendor_invoice_id cleared", "recompute Vendor.open_consignment_liability_cents"]

  - method: POST
    path: "/udi/vendor-invoices/{invoice_id}/resubmit"
    description: "Vendor resubmits a disputed invoice with a corrected total and unit list"
    roles: [VendorRep]
    code: 200
    input: ["submitted_total_cents", "device_unit_ids"]
    output: VendorInvoice
    side_effects: ["status := SUBMITTED", "listed units move BILLABLE -> INVOICED", "expected_total_cents, variance_cents, variance_bps, reconciliation_variant and matched_by_user_id reset to null"]

  - method: GET
    path: "/udi/vendor-invoices/{invoice_id}"
    description: "Read one invoice"
    roles: [InventoryLead, ComplianceOfficer, RevenueIntegrityAnalyst, VendorRep]
    code: 200
    input: []
    output: VendorInvoice
    side_effects: []

  - method: GET
    path: "/udi/vendor-invoices"
    description: "List invoices, optionally scoped to one vendor or agreement"
    roles: [InventoryLead, ComplianceOfficer, RevenueIntegrityAnalyst, VendorRep]
    code: 200
    input: ["vendor_id?", "consignment_agreement_id?", "status?", "limit?", "offset?"]
    output: VendorInvoice[]
    side_effects: []

  # ---------------------------------------------------------- Explant records
  - method: GET
    path: "/udi/explant-records/{explant_record_id}"
    description: "Read one explant/return record"
    roles: [InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst, VendorRep]
    code: 200
    input: []
    output: ExplantRecord
    side_effects: []

  - method: GET
    path: "/udi/explant-records"
    description: "List explant records, optionally scoped to one implant record or replacement unit"
    roles: [InventoryLead, CircClinician, ComplianceOfficer, RevenueIntegrityAnalyst, VendorRep]
    code: 200
    input: ["implant_record_id?", "replacement_device_unit_id?", "status?", "limit?", "offset?"]
    output: ExplantRecord[]
    side_effects: []

  - method: POST
    path: "/udi/explant-records/{explant_record_id}/disposition"
    description: "Authorize a vendor return or dispose the explant locally; the two branches have different side-effect sets"
    roles: [InventoryLead]
    code: 200
    input: ["disposition", "return_authorization_no?"]
    output: ExplantRecord
    side_effects: ["RETURN_TO_VENDOR: status := RETURN_AUTHORIZED and return_authorization_no stored", "DISPOSE_LOCALLY: status := DISPOSED_LOCALLY, unit custody := DISPOSED, unit billing CREDIT_PENDING := BILLABLE, recompute Vendor.open_consignment_liability_cents"]

  - method: POST
    path: "/udi/explant-records/{explant_record_id}/ship"
    description: "Ship an authorized return to the vendor"
    roles: [InventoryLead]
    code: 200
    input: []
    output: ExplantRecord
    side_effects: ["status := SHIPPED", "unit custody := RETURNED_TO_VENDOR", "recompute Lot.on_hand_qty and Lot.consumed_qty"]

  - method: POST
    path: "/udi/explant-records/{explant_record_id}/credit"
    description: "Vendor records the credit actually issued; zero denies the credit"
    roles: [VendorRep]
    code: 200
    input: ["credit_issued_cents"]
    output: ExplantRecord
    side_effects: ["credit_issued_cents > 0: status := CREDIT_ISSUED and unit billing := CREDITED", "credit_issued_cents == 0: status := CREDIT_DENIED and unit billing := BILLABLE", "recompute Vendor.open_consignment_liability_cents"]

  # ------------------------------------------------------------------ Ops run
  - method: POST
    path: "/udi/ops-runs"
    description: "Advance the operational epoch: expire agreements past their period, sweep expired lots and their units, count rotation alerts, escalate overdue recall notifications, count overdue registry submissions"
    roles: [InventoryLead]
    code: 200
    input: []
    output: "{ ops_run_index: integer, expired_agreement_count: integer, expired_lot_count: integer, expired_unit_count: integer, detached_reservation_count: integer, rotation_alert_count: integer, escalated_notification_count: integer, overdue_submission_count: integer }"
    side_effects: ["Executes calculations.ops_run_checkpoint rules 1-5 in order"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- authentication / authorization
  - { id: ERR_UNAUTHENTICATED,               http: 401, condition: "X-User-Role or X-User-ID missing/blank, role not one of the six declared names, or X-User-Role=VendorRep with an X-User-ID that is not an existing Vendor.id" }
  - { id: ERR_UNAUTHORIZED,                  http: 403, condition: "Role not listed in the endpoint's roles, or a VendorRep acting on a row belonging to a different vendor" }
  - { id: ERR_SEGREGATION_OF_DUTIES,         http: 403, condition: "Same X-User-ID attempts both halves of a separated pair: receive+release a lot, document+verify an implant record, or match+approve an invoice" }

  # ---- request shape
  - { id: ERR_INVALID_REQUEST,               http: 400, condition: "Missing required field, undeclared enum member, non-integer where an integer is required, scheduled_end_utc not strictly after scheduled_start_utc, both or neither of catalog_item_id/device_unit_id on a reservation, scope fields inconsistent with scope_type, or pagination limit outside [1,100] / negative offset" }

  # ---- existence
  - { id: ERR_VENDOR_NOT_FOUND,              http: 404, condition: "vendor_id in a path or body does not resolve" }
  - { id: ERR_AGREEMENT_NOT_FOUND,           http: 404, condition: "agreement_id or consignment_agreement_id does not resolve" }
  - { id: ERR_CATALOG_ITEM_NOT_FOUND,        http: 404, condition: "catalog_item_id does not resolve" }
  - { id: ERR_LOT_NOT_FOUND,                 http: 404, condition: "lot_id does not resolve" }
  - { id: ERR_DEVICE_UNIT_NOT_FOUND,         http: 404, condition: "device_unit_id, replacement_device_unit_id, replaced_unit_id or a member of device_unit_ids does not resolve" }
  - { id: ERR_PATIENT_NOT_FOUND,             http: 404, condition: "patient_id does not resolve" }
  - { id: ERR_CASE_NOT_FOUND,                http: 404, condition: "case_id does not resolve" }
  - { id: ERR_IMPLANT_RECORD_NOT_FOUND,      http: 404, condition: "implant_record_id does not resolve" }
  - { id: ERR_CHARGE_NOT_FOUND,              http: 404, condition: "charge_id does not resolve" }
  - { id: ERR_REGISTRY_SUBMISSION_NOT_FOUND, http: 404, condition: "submission_id does not resolve" }
  - { id: ERR_FIELD_ACTION_NOT_FOUND,        http: 404, condition: "field_action_id does not resolve" }
  - { id: ERR_RECALL_NOTIFICATION_NOT_FOUND, http: 404, condition: "notification_id does not resolve" }
  - { id: ERR_INVOICE_NOT_FOUND,             http: 404, condition: "invoice_id does not resolve" }
  - { id: ERR_EXPLANT_RECORD_NOT_FOUND,      http: 404, condition: "explant_record_id does not resolve" }

  # ---- optimistic concurrency
  - { id: ERR_STALE_CASE_VERSION,            http: 412, condition: "expected_case_version does not equal SurgicalCase.version" }
  - { id: ERR_STALE_LOT_VERSION,             http: 412, condition: "expected_lot_version does not equal Lot.version" }
  - { id: ERR_STALE_AGREEMENT_VERSION,       http: 412, condition: "expected_agreement_version does not equal ConsignmentAgreement.version" }

  # ---- state of the path-target resource
  - { id: ERR_INVALID_CASE_STATE,            http: 409, condition: "SurgicalCase is not in a state from which the requested transition is declared (e.g. documenting an implant on a case that is not IN_PROGRESS, starting a case that is not SCHEDULED, closing a CLOSED case)" }
  - { id: ERR_INVALID_UNIT_STATE,            http: 409, condition: "DeviceUnit custody_state or billing_state does not permit the operation (e.g. wasting an IMPLANTED unit, releasing a reservation on a unit that is not RESERVED, reserving a unit that is not AVAILABLE)" }
  - { id: ERR_INVALID_RECORD_STATE,          http: 409, condition: "ImplantRecord is not in a state permitting verify, amend or explant" }
  - { id: ERR_INVALID_INVOICE_STATE,         http: 409, condition: "VendorInvoice is not in a state permitting match, approve, dispute or resubmit" }
  - { id: ERR_INVALID_LIFECYCLE_STATE,       http: 409, condition: "Lot, ChargeCapture, RegistrySubmission, FieldAction, RecallNotification, ConsignmentAgreement or ExplantRecord is not in a state permitting the requested transition, including releasing a lot with received_qty 0" }

  # ---- clinical safety / compliance
  - { id: ERR_UNIT_RECALLED,                 http: 422, condition: "The referenced DeviceUnit is in RECALL_HOLD or its Lot is RECALLED" }
  - { id: ERR_UNIT_EXPIRED,                  http: 422, condition: "The referenced unit's lot expiry instant is at or before the logical clock, or (for a reservation) at or before the case's scheduled end" }
  - { id: ERR_UDI_INCOMPLETE,                http: 422, condition: "udi_di does not equal DeviceUnit.udi_di_snapshot or udi_pi_serial does not equal DeviceUnit.udi_serial" }
  - { id: ERR_PATIENT_LINK_MISMATCH,         http: 422, condition: "A supplied patient_id differs from SurgicalCase.patient_id" }
  - { id: ERR_REGISTRY_SUBMISSION_INCOMPLETE,http: 422, condition: "RegistrySubmission.completeness_score is below 80" }

  # ---- cross-entity referential state
  - { id: ERR_LOT_NOT_RELEASED,              http: 409, condition: "The referenced unit's Lot is still in QUARANTINE" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE,          http: 409, condition: "The referenced ConsignmentAgreement is DRAFT or EXPIRED" }
  - { id: ERR_VENDOR_ON_HOLD,                http: 409, condition: "The vendor's standing is HOLD because a CLASS_I field action of theirs is still open" }

  # ---- uniqueness / constraint
  - { id: ERR_DUPLICATE_UDI_SERIAL,          http: 409, condition: "udi_serial already exists for another unit of the same catalog item" }
  - { id: ERR_DUPLICATE_LOT_NUMBER,          http: 409, condition: "lot_number already exists for the same catalog item" }
  - { id: ERR_DUPLICATE_IDENTIFIER,          http: 409, condition: "vendor_code, agreement_code (per vendor), device_identifier, mrn, case_number, action_code or invoice_number (per vendor) already exists" }
  - { id: ERR_UNIT_ALREADY_INVOICED,         http: 409, condition: "A device unit in device_unit_ids already carries a vendor_invoice_id" }

  # ---- temporal
  - { id: ERR_OR_ROOM_CONFLICT,              http: 409, condition: "The requested half-open room window intersects another non-terminal case in the same or_room_code; touching endpoints are accepted" }
  - { id: ERR_PATIENT_SCHEDULE_CONFLICT,     http: 409, condition: "The requested window, expanded by 120 minutes on each side and compared as a closed interval, intersects another non-terminal case of the same patient; touching endpoints are rejected" }

  # ---- selector
  - { id: ERR_NO_ELIGIBLE_UNIT,              http: 409, condition: "The FEFO candidate pool for the requested catalog item is empty" }

  # ---- workflow gates
  - { id: ERR_CASE_READINESS_UNMET,          http: 409, condition: "Close attempted while readiness_status is BLOCKED_RESERVATION or BLOCKED_DOCUMENTATION" }
  - { id: ERR_REGISTRY_OUTSTANDING,          http: 409, condition: "Close attempted while readiness_status is BLOCKED_REGISTRY" }
  - { id: ERR_RECALL_REMEDIATION_INCOMPLETE, http: 409, condition: "Field-action close attempted while notification_open_count is greater than 0" }

  # ---- fiscal
  - { id: ERR_UNIT_NOT_BILLABLE,             http: 409, condition: "A device unit in device_unit_ids is not in billing_state BILLABLE" }
  - { id: ERR_INVOICE_TOLERANCE_EXCEEDED,    http: 422, condition: "Approve attempted on a VARIANCE_HOLD invoice without a non-empty override_reason" }
  - { id: ERR_VARIANCE_ACK_MISMATCH,         http: 422, condition: "acknowledged_variance_cents does not equal ChargeCapture.variance_cents" }
  - { id: ERR_CHARGE_VARIANCE_UNRESOLVED,    http: 409, condition: "Close attempted while readiness_status is BLOCKED_CHARGE" }
  - { id: ERR_CREDIT_EXCEEDS_EXPECTED,       http: 422, condition: "credit_issued_cents is greater than ExplantRecord.credit_expected_cents" }

# =============================================================================
# §1.7 RBAC Matrix — segregation_of_duties
# Five opaque operational roles plus one entity-backed vendor role. The three
# separations are enforced on X-User-ID, so two users holding the SAME role
# still satisfy them, and one user cannot satisfy them by switching roles.
# =============================================================================
roles:

  - name: ReceivingTech
    description: "Dock/receiving technician. Books lots and serialized units into quarantine."
    identity: opaque
    exclusive_operations:
      - "POST /udi/lots"
      - "POST /udi/lots/{lot_id}/device-units"
    shared_operations:
      - "POST /udi/lots/{lot_id}/release (shared with InventoryLead; blocked for the X-User-ID that received the lot)"
      - "All GET endpoints except /udi/patients, /udi/patients/{patient_id}, /udi/charge-captures, /udi/charge-captures/{charge_id}, /udi/registry-submissions, /udi/registry-submissions/{submission_id}, /udi/vendor-invoices, /udi/vendor-invoices/{invoice_id}, /udi/explant-records, /udi/explant-records/{explant_record_id}, /udi/recall-notifications, /udi/recall-notifications/{notification_id}, /udi/field-actions/{field_action_id}/exposure"
      - "POST /_clock/set_current_utc"

  - name: InventoryLead
    description: "Materials management lead. Owns master data, quarantine release, reservations, rotation and the ops-run checkpoint."
    identity: opaque
    exclusive_operations:
      - "POST /udi/vendors"
      - "POST /udi/consignment-agreements"
      - "POST /udi/consignment-agreements/{agreement_id}/activate"
      - "POST /udi/consignment-agreements/{agreement_id}/price-list-revisions"
      - "POST /udi/catalog-items"
      - "POST /udi/ops-runs"
      - "POST /udi/explant-records/{explant_record_id}/disposition"
      - "POST /udi/explant-records/{explant_record_id}/ship"
    shared_operations:
      - "POST /udi/lots/{lot_id}/release (shared with ReceivingTech)"
      - "POST /udi/surgical-cases/{case_id}/reservations (shared with CircClinician)"
      - "POST /udi/device-units/{device_unit_id}/release-reservation (shared with CircClinician)"
      - "All GET endpoints except /udi/patients and /udi/patients/{patient_id}"
      - "POST /_clock/set_current_utc"

  - name: CircClinician
    description: "Circulating nurse / OR documentation. Owns patients, cases and implant documentation."
    identity: opaque
    exclusive_operations:
      - "POST /udi/patients"
      - "POST /udi/surgical-cases"
      - "POST /udi/surgical-cases/{case_id}/start"
      - "POST /udi/surgical-cases/{case_id}/implant-records"
      - "POST /udi/surgical-cases/{case_id}/close"
      - "POST /udi/surgical-cases/{case_id}/cancel"
      - "POST /udi/implant-records/{implant_record_id}/amend"
      - "POST /udi/implant-records/{implant_record_id}/explants"
      - "POST /udi/device-units/{device_unit_id}/waste"
    shared_operations:
      - "PATCH /udi/patients/{patient_id} (shared with ComplianceOfficer)"
      - "POST /udi/implant-records/{implant_record_id}/verify (shared with ComplianceOfficer; blocked for the X-User-ID that documented the record)"
      - "POST /udi/surgical-cases/{case_id}/reservations (shared with InventoryLead)"
      - "POST /udi/device-units/{device_unit_id}/release-reservation (shared with InventoryLead)"
      - "All GET endpoints except /udi/vendor-invoices and /udi/vendor-invoices/{invoice_id}"
      - "POST /_clock/set_current_utc"

  - name: ComplianceOfficer
    description: "Regulatory affairs. Owns field actions, recall outreach and registry reporting; also the second signature on invoice approval."
    identity: opaque
    exclusive_operations:
      - "POST /udi/field-actions"
      - "POST /udi/field-actions/{field_action_id}/publish"
      - "POST /udi/field-actions/{field_action_id}/close"
      - "POST /udi/recall-notifications/{notification_id}/resolve"
      - "POST /udi/registry-submissions/{submission_id}/submit"
      - "POST /udi/registry-submissions/{submission_id}/adjudicate"
    shared_operations:
      - "PATCH /udi/patients/{patient_id} (shared with CircClinician)"
      - "POST /udi/implant-records/{implant_record_id}/verify (shared with CircClinician)"
      - "POST /udi/vendor-invoices/{invoice_id}/approve (shared with RevenueIntegrityAnalyst; blocked for the X-User-ID that matched the invoice)"
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: RevenueIntegrityAnalyst
    description: "Revenue integrity. Owns charge capture accuracy and the invoice reconciliation half of the payables separation."
    identity: opaque
    exclusive_operations:
      - "POST /udi/implant-records/{implant_record_id}/charges"
      - "POST /udi/charge-captures/{charge_id}/post"
      - "POST /udi/charge-captures/{charge_id}/finalize"
      - "POST /udi/charge-captures/{charge_id}/correct"
      - "POST /udi/charge-captures/{charge_id}/void"
      - "POST /udi/vendor-invoices/{invoice_id}/match"
      - "POST /udi/vendor-invoices/{invoice_id}/dispute"
    shared_operations:
      - "POST /udi/vendor-invoices/{invoice_id}/approve (shared with ComplianceOfficer; blocked for the X-User-ID that matched the invoice)"
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: VendorRep
    description: "Vendor representative. Submits and resubmits consignment invoices and records return credits."
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /udi/vendor-invoices"
      - "POST /udi/vendor-invoices/{invoice_id}/resubmit"
      - "POST /udi/explant-records/{explant_record_id}/credit"
    shared_operations:
      - "GET endpoints for vendors, agreements, catalog items, lots, device units, field actions, invoices and explant records"
      - "POST /_clock/set_current_utc"
    note: "X-User-ID MUST equal an existing Vendor.id. Priority-6 ownership then forces vendor_id == X-User-ID on every write."
