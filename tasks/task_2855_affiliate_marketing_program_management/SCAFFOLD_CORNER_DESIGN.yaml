      - name: case_verification_must_not_be_performed_by_the_opening_analyst
        claim_type: segregation_of_duties
        grounds:
          - roles[ComplianceAnalyst]
          - validations[priority 16]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.PolicyViolationCase[REMEDIATION_SUBMITTED -> VERIFIED_CLEARED]
        distinguishing_aspect: "The VERIFY hop declares the precondition X-User-ID != case.opened_by_user_id, so cmp-001 — who opened the case and requested remediation — is refused with ERR_SEGREGATION_OF_DUTIES (403) even though ComplianceAnalyst is a declared actor for the hop, and the case keeps state REMEDIATION_SUBMITTED with version 3. A second analyst cmp-002 clears the identical payload, taking the case to VERIFIED_CLEARED at version 4 and decrementing open_violation_case_count to 0."
        test_recipe:
          setup:
            - "Clock 2026-07-05T00:00:00Z."
            - "One Network, one PENDING_APPLICATION CONTENT affiliate."
            - "cmp-001 opens one FORCED_CLICK case (version 1), requests remediation (version 2); the partner submits evidence (version 3)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
