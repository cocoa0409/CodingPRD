  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict
  #   pair 1: business_safety(50) beats business_temporal(60)
  #   pair 2: state(40)           beats business_fiscal(70)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dry_jurisdiction_safety_beats_restricted_hours_temporal
        grounds:
          - validations[priority=50]
          - validations[priority=60]
          - calculations.delivery_permissibility_evaluation
          - errors.ERR_DRY_JURISDICTION_PROHIBITED
          - errors.ERR_OUTSIDE_RESTRICTED_HOURS
        distinguishing_aspect: |
          Category pair business_safety (priority 50, ERR_DRY_JURISDICTION_PROHIBITED)
          versus business_temporal (priority 60, ERR_OUTSIDE_RESTRICTED_HOURS). The same
          submit violates both: the destination US-KS is DRY for ALCOHOL, and the scheduled
          instant 2026-08-21T04:00:00Z is local minute 1380 at utc_offset_minutes -300,
          outside the half-open window [600, 1200). Only the priority-50 error may surface.
          A control order into WET US-NY at the same instant proves the priority-60 rule is
          genuinely live and would otherwise fire.
        test_recipe:
          setup:
            - "logical clock at 2026-08-20T12:00:00Z"
            - "jurisdiction US-KS with dry_status DRY and utc_offset_minutes -300, carrying a PERMITTED ALCOHOL policy with window [600, 1200) so that policy resolution at priority 45 succeeds"
            - "jurisdiction US-NY with dry_status WET and utc_offset_minutes -240, carrying a PERMITTED ALCOHOL policy with window [600, 1200)"
            - "customer attested and MATCH-pre-verified"
            - "order_ks (3xWINE-A, 5.18 units, well under the 6.97 ceiling) delivering into US-KS, scheduled 2026-08-21T04:00:00Z"
            - "order_ny (identical lines) delivering into US-NY, scheduled 2026-08-21T04:00:00Z, used as the control"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-KS", name: "Kansas", dry_status: "DRY", utc_offset_minutes: -300 }
              as: PlatformAdmin
              captures: { j_ks: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
            - call: "POST /restriction-policies"
              payload: { jurisdiction_id: "${j_ks}", restriction_type: "ALCOHOL", permissibility: "PERMITTED", min_age_years: 21, delivery_window_start_minute: 600, delivery_window_end_minute: 1200, unit_scale_factor: 1.15, max_units_per_order: 6.97, rolling_window_days: 30, max_units_per_window: 40.00, acceptable_document_types: ["DRIVERS_LICENSE", "PASSPORT", "STATE_ID"], requires_scan: true, effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: PlatformAdmin
              captures: { pol_ks: $.data.id }
            - call: "POST /restriction-policies"
              payload: { jurisdiction_id: "${j_ny}", restriction_type: "ALCOHOL", permissibility: "PERMITTED", min_age_years: 21, delivery_window_start_minute: 600, delivery_window_end_minute: 1200, unit_scale_factor: 1.15, max_units_per_order: 6.97, rolling_window_days: 30, max_units_per_window: 40.00, acceptable_document_types: ["DRIVERS_LICENSE", "PASSPORT", "STATE_ID"], requires_scan: true, effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: PlatformAdmin
              captures: { pol_ny: $.data.id }
            - call: "POST /products"
              payload: { sku: "WINE-A", name: "Cabernet 750ml", restriction_type: "ALCOHOL", restricted_units_per_item: 1.50, list_price_cents: 6800 }
              as: PlatformAdmin
              captures: { prod_a: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada Lin", email: "ada@example.com", jurisdiction_id: "${j_ny}" }
              as: PlatformAdmin
