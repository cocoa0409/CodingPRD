              as: ProgramAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_validity_days: 30, vaccination_required: true, vaccination_min_days_before_inspection: 14, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/test-records"
              payload: { premises_id: "${prem_b}", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_date: "2026-06-26T00:00:00Z", lab_reference: "LAB-B" }
              as: LabTechnician
              captures: { test_b: $.data.id }
            - call: "POST /api/test-records/${test_b}/result"
              payload: { result: "NEGATIVE" }
              as: LabTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_a}", destination_state_code: "KS", species_code: "CATTLE", head_count: 10, inspection_date: "2026-08-10T00:00:00Z", test_record_id: "${test_b}", vaccination_date: "2026-07-12T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /api/certificates/${cert_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_TEST_RECORD_MISMATCH' (referential, priority 8)"
            - "error_id != 'ERR_TEST_VALIDITY_EXPIRED' even though the test is 45 days old (temporal, priority 9 loses)"

