            - "tc3 == true (late completion from OVERDUE restores currency)"

      - name: risk_tier_boundary_exactly_30_is_medium
        claim_type: constants_applied
        grounds: [calculations.counterparty_exposure_index, entities.Counterparty.fields.risk_tier]
