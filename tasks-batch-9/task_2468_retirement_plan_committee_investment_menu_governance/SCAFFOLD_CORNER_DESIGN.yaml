              payload: { plan_id: "${plan_id}", provider_name: "Halloran Plan Audit LLP", provider_role: "AUDITOR", term_start_date: "2026-01-01", term_end_date: "2027-12-31", per_head_fee_cents: 3000, asset_based_bps: 15, benchmark_percentile: 74, last_rfp_quarter_index: 0 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { eng_aud_id: $.data.id }
            - call: "POST /governance/service-provider-engagements"
              payload: { plan_id: "${plan_id}", provider_name: "Meridian Trust Custody", provider_role: "CUSTODIAN", term_start_date: "2026-01-01", term_end_date: "2027-12-31", per_head_fee_cents: 6000, asset_based_bps: 10, benchmark_percentile: 60, last_rfp_quarter_index: 0 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { eng_cus_id: $.data.id }
            - call: "POST /governance/plans"
              payload: { plan_name: "Sable Foundry Starter 401(k)", plan_sponsor_name: "Sable Foundry LLC", erisa_covered: true, participant_account_count: 250, menu_slot_capacity: 4, quorum_min_voting_members: 3, voting_threshold_pct: 0.6000, max_voting_seats: 5 }
              as: PlanSponsorAdmin
