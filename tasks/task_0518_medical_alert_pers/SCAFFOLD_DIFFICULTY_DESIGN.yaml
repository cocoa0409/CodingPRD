          - entities.EquipmentReturn.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from finalize-cancellation: Contract->CANCELLED (hop1) cascades
          its Device->DEACTIVATED (hop2), and EACH deactivated device's transition itself
          creates an EquipmentReturn(INITIATED) (hop3). Each link is caused by the previous.
