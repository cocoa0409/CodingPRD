  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_club_version_rejected_on_meeting_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[meeting-create-stale-club]
          - errors[ERR_STALE_VERSION]
          - entities.Club.fields.version
        distinguishing_aspect: "The meeting-create OCC rule rejects a second meeting that still carries the club version observed before the first meeting was created, returning ERR_STALE_VERSION with HTTP 412."
        test_recipe:
          setup: ["one ORGANIZING club with one paid member and the club version captured before any meeting exists"]
          setup_api_calls:
            - call: "POST /toastmasters/clubs"
              payload: { club_name: "Riverside Voices", club_type: "COMMUNITY", district_number: "42", division_code: "C", area_code: "C-3", venue_name: "Riverside Library", club_dues_cents: 3000, cycle_opened_at: "2026-09-01T00:00:00Z" }
              as: WorldHeadquarters
              captures: { club_id: "$.data.id" }
            - call: "POST /toastmasters/memberships/bulk"
              payload: { club_id: "${club_id}", pay_dues_immediately: true, members: [ { full_name: "Ada Lovelace", email: "ada@example.org" } ] }
              as: WorldHeadquarters
              captures: { ms_ada_id: "$.data.memberships[0].id" }
            - call: "GET /toastmasters/clubs/${club_id}"
              as: WorldHeadquarters
              captures: { club_v: "$.data.version" }
            - call: "POST /toastmasters/meetings"
              payload: { club_id: "${club_id}", scheduled_at: "2026-09-10T18:30:00Z", duration_minutes: 90, venue_name: "Riverside Library", expected_club_version: "${club_v}" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { first_meeting_id: "$.data.id" }
          trigger:
            - call: "POST /toastmasters/meetings"
              payload: { club_id: "${club_id}", scheduled_at: "2026-09-20T18:30:00Z", duration_minutes: 90, venue_name: "Riverside Library", expected_club_version: "${club_v}" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { err: "$.data.error_id" }
            - call: "GET /toastmasters/meetings?club_id=${club_id}"
              as: WorldHeadquarters
              captures: { listed: "$.data" }
          assert:
            - "the first meeting is created with HTTP 201"
            - "the second meeting returns ERR_STALE_VERSION with HTTP 412"
            - "the second meeting's window does not overlap the first, so only the stale version can explain the rejection"
            - "exactly one meeting exists for the club"

