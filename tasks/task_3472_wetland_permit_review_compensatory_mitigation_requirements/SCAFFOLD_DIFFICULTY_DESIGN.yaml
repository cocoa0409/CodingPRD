            - { call: "POST /wetland-permits/applications/${app_id}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/applications/${app_id}/screening", payload: { action: "BEGIN" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/applications/${app_id}/screening", payload: { action: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/alternatives-analyses", payload: { application_id: "${app_id}", avoidance_demonstrated: true, avoidance_narrative: "Avoidance shown", minimization_steps: ["Step one", "Step two"], ledpa_conclusion: "PROPOSED_IS_LEDPA", offsite_alternatives_considered: 1 }, as: Applicant, as_user_id: "${ap_id}", captures: { aa_id: "$.data.id" } }
            - { call: "POST /wetland-permits/alternatives-analyses/${aa_id}/review", payload: { verdict: "ACCEPT" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/mitigation-plans", payload: { application_id: "${app_id}", mechanism: "BANK_CREDITS" }, as: Applicant, as_user_id: "${ap_id}", captures: { plan_id: "$.data.id" } }
            - { call: "POST /wetland-permits/mitigation-plans/${plan_id}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/mitigation-plans/${plan_id}/review", payload: { verdict: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/mitigation-banks", payload: { bank_name: "Shenandoah Mitigation Bank", sponsor_name: "Shenandoah Conservancy", state_code: "VA", service_area_watersheds: ["18020101"], credit_capacity: { FORESTED_WETLAND: 5 }, base_price_per_credit: { FORESTED_WETLAND: 30000 } }, as: SystemAdmin, captures: { bank_id: "$.data.id" } }
            - { call: "POST /wetland-permits/mitigation-banks/${bank_id}/approve", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
          trigger:
            - { call: "POST /wetland-permits/credit-transactions", payload: { bank_id: "${bank_id}", plan_id: "${plan_id}", resource_type: "FORESTED_WETLAND", credits: 5.0 }, as: Applicant, as_user_id: "${ap_id}", captures: { txn_ok: "$.data.id", txn_st: "$.data.status" } }
            - { call: "POST /wetland-permits/credit-transactions", payload: { bank_id: "${bank_id}", plan_id: "${plan_id}", resource_type: "FORESTED_WETLAND", credits: 0.5 }, as: Applicant, as_user_id: "${ap_id}", captures: { err_over: "$.data.error_id" } }
            - { call: "GET /wetland-permits/mitigation-banks/${bank_id}", as: Reviewer, as_user_id: "rev-1", captures: { avail: "$.data.available_credits_by_type" } }
          assert:
            - "txn_st == RESERVED — requesting exactly the available 5.0 succeeds (>= semantics)"
            - "err_over == ERR_INSUFFICIENT_CREDIT_INVENTORY — 0.5 above available fails"
            - "avail == {FORESTED_WETLAND: 0.0} after the exact-size reservation"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_requires_jurisdictional_jd
        grounds:
          - state_machines.PermitApplication.DRAFT_to_SUBMITTED
          - validations[priority=7]
          - validations[priority=18]
          - errors[ERR_JD_NOT_JURISDICTIONAL]
        distinguishing_aspect: |
          Entity pair PermitApplication -> JurisdictionalDetermination: submit is gated
          on the JD's status (ISSUED) and on its determination value (JURISDICTIONAL);
          a NON_JURISDICTIONAL determination and a never-issued DRAFT JD produce the two
          distinct errors ERR_JD_NOT_JURISDICTIONAL and ERR_JD_INVALID_STATE.
        test_recipe:
          setup:
            - "Site with two JDs: jd_nj ISSUED with determination NON_JURISDICTIONAL; jd_draft never issued"
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Piney Branch Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["FORESTED_WETLAND"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site_id}", jd_type: "APPROVED", determination: "NON_JURISDICTIONAL", rationale: "Isolated wetland, no interstate commerce nexus" }, as: Reviewer, as_user_id: "rev-1", captures: { jd_nj: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd_nj}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site_id}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "Second delineation under review" }, as: Reviewer, as_user_id: "rev-1", captures: { jd_draft: "$.data.id" } }
          trigger:
            - { call: "POST /wetland-permits/applications", payload: { site_id: "${site_id}", jd_id: "${jd_nj}", pathway: "INDIVIDUAL", impacts: [ { resource_type: "FORESTED_WETLAND", impact_acres: 2.0 } ], project_purpose: "Stormwater facility", estimated_cost_dollars: 750000 }, as: Applicant, as_user_id: "${ap_id}", captures: { app1: "$.data.id" } }
            - { call: "POST /wetland-permits/applications/${app1}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}", captures: { err_nj: "$.data.error_id" } }
            - { call: "POST /wetland-permits/applications", payload: { site_id: "${site_id}", jd_id: "${jd_draft}", pathway: "INDIVIDUAL", impacts: [ { resource_type: "FORESTED_WETLAND", impact_acres: 2.0 } ], project_purpose: "Stormwater facility", estimated_cost_dollars: 750000 }, as: Applicant, as_user_id: "${ap_id}", captures: { app2: "$.data.id" } }
            - { call: "POST /wetland-permits/applications/${app2}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}", captures: { err_draft: "$.data.error_id" } }
          assert:
            - "err_nj == ERR_JD_NOT_JURISDICTIONAL (ISSUED but NON_JURISDICTIONAL)"
            - "err_draft == ERR_JD_INVALID_STATE (never issued)"
            - "both applications remain in DRAFT"

      - name: plan_creation_requires_accepted_alternatives
        grounds:
          - state_machines.MitigationPlan
          - validations[priority=19]
          - errors[ERR_AA_NOT_ACCEPTED]
        distinguishing_aspect: |
          Entity pair MitigationPlan -> AlternativesAnalysis (different pair than
          Application -> JD): the avoidance-minimization-before-compensation sequencing
          gate rejects plan creation while the AA is merely SUBMITTED, and admits it the
          moment the AA flips to ACCEPTED — the plan's own fields are unchanged.
        test_recipe:
          setup:
            - "Individual application in ALTERNATIVES_REVIEW; AA SUBMITTED but not yet reviewed"
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Piney Branch Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["FORESTED_WETLAND"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site_id}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "Jurisdictional" }, as: Reviewer, as_user_id: "rev-1", captures: { jd_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd_id}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /wetland-permits/applications", payload: { site_id: "${site_id}", jd_id: "${jd_id}", pathway: "INDIVIDUAL", impacts: [ { resource_type: "FORESTED_WETLAND", impact_acres: 2.0 } ], project_purpose: "Stormwater facility", estimated_cost_dollars: 750000 }, as: Applicant, as_user_id: "${ap_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /wetland-permits/applications/${app_id}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/applications/${app_id}/screening", payload: { action: "BEGIN" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/applications/${app_id}/screening", payload: { action: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/alternatives-analyses", payload: { application_id: "${app_id}", avoidance_demonstrated: true, avoidance_narrative: "Avoidance shown", minimization_steps: ["Step one", "Step two"], ledpa_conclusion: "PROPOSED_IS_LEDPA", offsite_alternatives_considered: 2 }, as: Applicant, as_user_id: "${ap_id}", captures: { aa_id: "$.data.id" } }
          trigger:
            - { call: "POST /wetland-permits/mitigation-plans", payload: { application_id: "${app_id}", mechanism: "BANK_CREDITS" }, as: Applicant, as_user_id: "${ap_id}", captures: { err_seq: "$.data.error_id" } }
            - { call: "POST /wetland-permits/alternatives-analyses/${aa_id}/review", payload: { verdict: "ACCEPT" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/mitigation-plans", payload: { application_id: "${app_id}", mechanism: "BANK_CREDITS" }, as: Applicant, as_user_id: "${ap_id}", captures: { plan_id: "$.data.id", req: "$.data.required_credits_by_type" } }
          assert:
            - "err_seq == ERR_AA_NOT_ACCEPTED while the AA is SUBMITTED (compensation considered before avoidance/minimization is accepted)"
            - "after the ACCEPT verdict the identical plan creation succeeds (201) with req == {FORESTED_WETLAND: 6.00}"

  - rule_id: resource_temporal_overlap
    instances:
      - name: jd_issuance_blocked_by_live_validity_window
        grounds:
          - validations[priority=22]
          - state_machines.JurisdictionalDetermination.DRAFT_to_ISSUED
          - entities.JurisdictionalDetermination.fields.expiration_date
          - errors[ERR_ACTIVE_JD_EXISTS]
        distinguishing_aspect: |
          Interval semantics = point-in-window membership on resource WatersSite: a
          second JD may not be ISSUED while another JD's validity window
          [issued_date, expiration_date] contains the current clock — inclusive of the
          expiration day itself (blocked at clock == expiration_date, allowed the next
          day). The blocking window is 1825 days, not a pairwise interval comparison.
        test_recipe:
          setup:
            - "Site with jd1 ISSUED at 2026-09-01 (expiration_date 2031-08-31); jd2 in DRAFT for the same site"
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Piney Branch Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["FORESTED_WETLAND"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site_id}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "First delineation" }, as: Reviewer, as_user_id: "rev-1", captures: { jd1: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd1}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1", captures: { exp1: "$.data.expiration_date" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site_id}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "Renewal delineation" }, as: Reviewer, as_user_id: "rev-1", captures: { jd2: "$.data.id" } }
          trigger:
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd2}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1", captures: { err_overlap: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2031-08-31T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd2}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1", captures: { err_boundary: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2031-09-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd2}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1", captures: { st2: "$.data.status", issued2: "$.data.issued_date" } }
          assert:
            - "exp1 == 2031-08-31T00:00:00Z (2026-09-01 + 1825 days)"
            - "err_overlap == ERR_ACTIVE_JD_EXISTS while jd1's window covers the clock"
            - "err_boundary == ERR_ACTIVE_JD_EXISTS at clock == expiration_date exactly (the window is closed at its right end)"
            - "st2 == ISSUED and issued2 == 2031-09-01T00:00:00Z one day after expiry"

      - name: monitoring_coverage_requires_zero_gap_contiguity
        grounds:
          - validations[priority=26]
          - state_machines.MonitoringReport.DUE_to_SUBMITTED
          - errors[ERR_COVERAGE_INTERVAL_CONFLICT]
        distinguishing_aspect: |
          Interval semantics = pairwise half-open coverage intervals on the permit's
          report series: each report's coverage_start must equal the previous ACCEPTED or
          SUBMITTED sibling's coverage_end — a one-day gap (2027-10-03) and an overlap
          (2027-09-02) are both rejected, only exact adjacency (2027-10-02) is accepted.
          Different arithmetic than the JD point-in-window rule, on a different resource.
        test_recipe:
          setup:
            - "Permit ISSUED at 2026-10-02 (secured plan, 5 DUE reports); report 1 SUBMITTED with coverage [2026-10-02, 2027-10-02] and ACCEPTED"
