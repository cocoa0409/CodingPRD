      - name: house_visit_calendar_half_open_windows_with_capacity_two
        grounds:
          - validations[priority=27]
          - errors[ERR_VISIT_CAPACITY_CONFLICT]
          - state_machines.MaintenanceTicket.OPEN_to_SCHEDULED
          - concurrency_rules[visit-schedule-stale-house]
