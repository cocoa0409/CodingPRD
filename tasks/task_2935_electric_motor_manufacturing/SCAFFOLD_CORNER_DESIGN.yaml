      - name: nameplate_jurisdiction_outranks_the_standard_and_efficiency_gates
        claim_type: priority_conflict
        grounds:
          - validations[priority=45]
          - validations[priority=69]
          - validations[priority=70]
          - calculations.regulatory_standard_selector
          - calculations.test_measured_efficiency
          - errors[ERR_JURISDICTION_MISMATCH]
          - errors[ERR_NO_APPLICABLE_STANDARD]
          - errors[ERR_EFFICIENCY_BELOW_REGULATORY_MINIMUM]
