# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Custom Picture Framing — breadth probe across claim-extraction-guide sections.
# All formula-derived asserts are pre-computed literals (round_half_up, 2 dp).
# Names are unique across this file AND SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_derived_discount
        claim_type: Creation
        grounds:
          - entities.Customer.fields.loyalty_discount_pct
          - entities.Customer.fields.loyalty_tier
        distinguishing_aspect: "POST /customers with loyalty_tier=PREFERRED returns 201 and loyalty_discount_pct==0.10, scores seeded (no_show 0, settled 50)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "New Cust", email: "nc@x.com", phone: "555-0200", loyalty_tier: "PREFERRED" }
              as: FrontDeskClerk
              captures: { cust_id: $.data.id, disc: $.data.loyalty_discount_pct }
          assert:
            - "Customer.${cust_id}.loyalty_discount_pct == 0.10"
            - "Customer.${cust_id}.no_show_risk_score == 0"
            - "Customer.${cust_id}.settled_reputation_score == 50"
            - "Customer.${cust_id}.version == 1"

      - name: get_framing_order_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.FramingOrder
          - errors[ERR_ORDER_NOT_FOUND]
        distinguishing_aspect: "GET /framing-orders/{random-uuid} returns ERR_ORDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /framing-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FrameDesigner
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_ORDER_NOT_FOUND"

      - name: create_frame_line_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.FrameLine.fields.molding_rate_per_ui
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST frame-lines omitting required molding_rate_per_ui returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Order INTAKE, version 1"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Req", email: "req@x.com", phone: "555-0201" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}" }
              as: FrameDesigner
              captures: { order_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v0}", artwork_label: "NoRate", nominal_width_in: 8, nominal_height_in: 10 }
              as: FrameDesigner
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: frame_line_default_fields_applied_on_omission
        claim_type: Defaults
        grounds:
          - entities.FrameLine.fields.mat_border_in
          - entities.FrameLine.fields.mat_layers
          - entities.FrameLine.fields.glass_type
          - entities.FrameLine.fields.mounting_type
        distinguishing_aspect: "Omitting mat_border_in/mat_layers/glass_type/mounting_type defaults to 2/1/REGULAR/NONE; an 8x10 line then costs estimate_subtotal 64.47."
        test_recipe:
          setup: ["Order INTAKE, version 1"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Def", email: "def@x.com", phone: "555-0202" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}" }
              as: FrameDesigner
              captures: { order_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v0}", artwork_label: "D", nominal_width_in: 8, nominal_height_in: 10, molding_rate_per_ui: 0.30 }
              as: FrameDesigner
              captures: { line_id: $.data.id, mb: $.data.mat_border_in, ml: $.data.mat_layers, gt: $.data.glass_type, mt: $.data.mounting_type, sub: $.data.estimate_subtotal }
          assert:
            - "FrameLine.${line_id}.mat_border_in == 2"
            - "FrameLine.${line_id}.mat_layers == 1"
            - "FrameLine.${line_id}.glass_type == REGULAR"
            - "FrameLine.${line_id}.mounting_type == NONE"
            - "FrameLine.${line_id}.estimate_subtotal == 64.47"

      - name: system_fields_generated_and_input_ignored_on_create_order
        claim_type: System Fields
        grounds:
          - entities.FramingOrder.fields.id
          - entities.FramingOrder.fields.production_status
          - entities.FramingOrder.fields.payment_status
          - entities.FramingOrder.fields.version
        distinguishing_aspect: "On create, production_status=INTAKE, payment_status=UNBILLED, version=1 are server-set regardless of any client value."
        test_recipe:
          setup: ["A customer exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Sys", email: "sys@x.com", phone: "555-0203" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}" }
              as: FrameDesigner
              captures: { order_id: $.data.id, prod: $.data.production_status, pay: $.data.payment_status, v: $.data.version }
          assert:
            - "FramingOrder.${order_id}.production_status == INTAKE"
            - "FramingOrder.${order_id}.payment_status == UNBILLED"
            - "FramingOrder.${order_id}.version == 1"

      - name: invalid_enum_glass_type_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.FrameLine.fields.glass_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST frame-lines with glass_type=PLEXI (not in REGULAR/CONSERVATION/MUSEUM) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Order INTAKE, version 1"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Enum", email: "enum@x.com", phone: "555-0204" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}" }
              as: FrameDesigner
              captures: { order_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v0}", artwork_label: "Bad", nominal_width_in: 8, nominal_height_in: 10, molding_rate_per_ui: 0.30, glass_type: "PLEXI" }
              as: FrameDesigner
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: notification_immutable_entity_has_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Notification
          - entities.Notification.fields.kind
        distinguishing_aspect: "Notification has common_fields:false — its listed records expose id/created_at/order_id/channel/kind/sent_to but no version; a READY notification exists after mark-ready."
        test_recipe:
          setup: ["Order driven to READY (one 8x10 line, deposit+balance paid, task completed) so a READY Notification was emitted"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Imm", email: "imm@x.com", phone: "555-0205" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
            - call: "POST /workbenches"
              payload: { bench_name: "Asm Im", bench_type: "ASSEMBLY" }
              as: FrameProductionTech
              captures: { bench_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}", deposit_pct: 0.30 }
              as: FrameDesigner
              captures: { order_id: $.data.id, v0: $.data.version }
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v0}", artwork_label: "Im", nominal_width_in: 8, nominal_height_in: 10, molding_rate_per_ui: 0.30 }
              as: FrameDesigner
              captures: { line_id: $.data.id }
            - call: "POST /frame-lines/${line_id}/measure"
              payload: { measured_width_in: 8, measured_height_in: 10 }
              as: FrameDesigner
            - call: "POST /framing-orders/${order_id}/quote"
              payload: {}
              as: FrameDesigner
            - call: "POST /framing-orders/${order_id}/payments"
              payload: { kind: "DEPOSIT", amount: 25.00 }
              as: FrontDeskClerk
            - call: "POST /framing-orders/${order_id}/start-production"
              payload: {}
              as: FrameProductionTech
            - call: "POST /production-tasks"
              payload: { order_id: "${order_id}", workbench_id: "${bench_id}", start_minute: 0, end_minute: 30 }
              as: FrameProductionTech
              captures: { task_id: $.data.id }
            - call: "POST /production-tasks/${task_id}/complete"
              payload: {}
              as: FrameProductionTech
            - call: "POST /framing-orders/${order_id}/mark-ready"
              payload: {}
              as: FrameProductionTech
          trigger:
            - call: "GET /framing-orders/${order_id}/notifications"
              payload: {}
              as: FrontDeskClerk
              captures: { n_kind: "$.data[0].kind" }
          assert:
            - "Notification list contains an entry with kind == READY"
            - "Notification.READY.sent_to == imm@x.com"

      - name: order_requires_existing_customer_else_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.FramingOrder.fields.customer_id
          - errors[ERR_CUSTOMER_NOT_FOUND]
        distinguishing_aspect: "POST /framing-orders with a non-existent customer_id returns ERR_CUSTOMER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /framing-orders"
              payload: { customer_id: "00000000-0000-4000-8000-000000000abc" }
              as: FrameDesigner
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_CUSTOMER_NOT_FOUND"

      - name: flat_topology_workbench_fk_validated_on_task_create
        claim_type: flat
        grounds:
          - entities.ProductionTask.fields.workbench_id
          - errors[ERR_WORKBENCH_NOT_FOUND]
        distinguishing_aspect: "Flat-topology FK check: POST /production-tasks with a non-existent workbench_id returns ERR_WORKBENCH_NOT_FOUND (404)."
        test_recipe:
          setup: ["Order IN_PRODUCTION with one measured 8x10 line, deposit paid"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Flat", email: "flat@x.com", phone: "555-0206" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}", deposit_pct: 0.30 }
              as: FrameDesigner
              captures: { order_id: $.data.id, v0: $.data.version }
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v0}", artwork_label: "Fl", nominal_width_in: 8, nominal_height_in: 10, molding_rate_per_ui: 0.30 }
              as: FrameDesigner
              captures: { line_id: $.data.id }
            - call: "POST /frame-lines/${line_id}/measure"
              payload: { measured_width_in: 8, measured_height_in: 10 }
              as: FrameDesigner
            - call: "POST /framing-orders/${order_id}/quote"
              payload: {}
              as: FrameDesigner
            - call: "POST /framing-orders/${order_id}/payments"
              payload: { kind: "DEPOSIT", amount: 25.00 }
              as: FrontDeskClerk
            - call: "POST /framing-orders/${order_id}/start-production"
              payload: {}
              as: FrameProductionTech
          trigger:
            - call: "POST /production-tasks"
              payload: { order_id: "${order_id}", workbench_id: "00000000-0000-4000-8000-0000000bench0", start_minute: 0, end_minute: 30 }
              as: FrameProductionTech
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_WORKBENCH_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: quote_from_already_quoted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.FramingOrder.INTAKE_to_QUOTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Re-quoting an order already in QUOTED (no INTAKE->QUOTED available from QUOTED) returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["Order QUOTED (one measured line)"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Q2", email: "q2@x.com", phone: "555-0207" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}" }
              as: FrameDesigner
              captures: { order_id: $.data.id, v0: $.data.version }
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v0}", artwork_label: "Q", nominal_width_in: 8, nominal_height_in: 10, molding_rate_per_ui: 0.30 }
              as: FrameDesigner
              captures: { line_id: $.data.id }
            - call: "POST /frame-lines/${line_id}/measure"
              payload: { measured_width_in: 8, measured_height_in: 10 }
              as: FrameDesigner
            - call: "POST /framing-orders/${order_id}/quote"
              payload: {}
              as: FrameDesigner
          trigger:
            - call: "POST /framing-orders/${order_id}/quote"
              payload: {}
              as: FrameDesigner
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: cancel_from_picked_up_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.FramingOrder.READY_to_PICKED_UP
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "PICKED_UP is terminal; POST cancel on a PICKED_UP order returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Order driven to PICKED_UP (8x10 line, deposit+balance paid, task completed, marked ready, picked up)"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Term", email: "term@x.com", phone: "555-0208" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
            - call: "POST /workbenches"
              payload: { bench_name: "Asm Tm", bench_type: "ASSEMBLY" }
              as: FrameProductionTech
              captures: { bench_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}", deposit_pct: 0.30 }
              as: FrameDesigner
              captures: { order_id: $.data.id, v0: $.data.version }
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v0}", artwork_label: "Tm", nominal_width_in: 8, nominal_height_in: 10, molding_rate_per_ui: 0.30 }
              as: FrameDesigner
              captures: { line_id: $.data.id }
            - call: "POST /frame-lines/${line_id}/measure"
              payload: { measured_width_in: 8, measured_height_in: 10 }
              as: FrameDesigner
            - call: "POST /framing-orders/${order_id}/quote"
              payload: {}
              as: FrameDesigner
            - call: "POST /framing-orders/${order_id}/payments"
              payload: { kind: "DEPOSIT", amount: 25.00 }
              as: FrontDeskClerk
            - call: "POST /framing-orders/${order_id}/start-production"
              payload: {}
              as: FrameProductionTech
            - call: "POST /production-tasks"
              payload: { order_id: "${order_id}", workbench_id: "${bench_id}", start_minute: 0, end_minute: 30 }
              as: FrameProductionTech
              captures: { task_id: $.data.id }
            - call: "POST /production-tasks/${task_id}/complete"
              payload: {}
              as: FrameProductionTech
            - call: "POST /framing-orders/${order_id}/mark-ready"
              payload: {}
              as: FrameProductionTech
            - call: "POST /framing-orders/${order_id}/payments"
              payload: { kind: "BALANCE", amount: 39.47 }
              as: FrontDeskClerk
            - call: "POST /framing-orders/${order_id}/pickup"
              payload: {}
              as: FrontDeskClerk
          trigger:
            - call: "POST /framing-orders/${order_id}/cancel"
              payload: {}
              as: FrontDeskClerk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: reopen_intake_blocked_after_deposit_paid
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.FramingOrder.QUOTED_to_INTAKE
          - errors[ERR_DEPOSIT_ALREADY_PAID]
        distinguishing_aspect: "reopen-intake on a QUOTED order whose deposit is already paid (payment_status DEPOSIT_PAID) returns ERR_DEPOSIT_ALREADY_PAID (409)."
        test_recipe:
          setup: ["Order QUOTED with deposit 25.00 paid (payment_status DEPOSIT_PAID)"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Reo", email: "reo@x.com", phone: "555-0209" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}", deposit_pct: 0.30 }
              as: FrameDesigner
              captures: { order_id: $.data.id, v0: $.data.version }
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v0}", artwork_label: "Re", nominal_width_in: 8, nominal_height_in: 10, molding_rate_per_ui: 0.30 }
              as: FrameDesigner
              captures: { line_id: $.data.id }
            - call: "POST /frame-lines/${line_id}/measure"
              payload: { measured_width_in: 8, measured_height_in: 10 }
              as: FrameDesigner
            - call: "POST /framing-orders/${order_id}/quote"
              payload: {}
              as: FrameDesigner
            - call: "POST /framing-orders/${order_id}/payments"
              payload: { kind: "DEPOSIT", amount: 25.00 }
              as: FrontDeskClerk
          trigger:
            - call: "POST /framing-orders/${order_id}/reopen-intake"
              payload: {}
              as: FrameDesigner
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_DEPOSIT_ALREADY_PAID"

      - name: start_production_blocked_when_deposit_not_paid
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.FramingOrder.QUOTED_to_IN_PRODUCTION
          - errors[ERR_DEPOSIT_NOT_PAID]
        distinguishing_aspect: "start-production on a QUOTED, fully-measured order with payment_status DEPOSIT_DUE (no deposit paid) returns ERR_DEPOSIT_NOT_PAID (409)."
        test_recipe:
          setup: ["Order QUOTED with one MEASURED line but no deposit paid (payment_status DEPOSIT_DUE)"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "NoDep", email: "nodep@x.com", phone: "555-0210" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}", deposit_pct: 0.30 }
              as: FrameDesigner
              captures: { order_id: $.data.id, v0: $.data.version }
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v0}", artwork_label: "ND", nominal_width_in: 8, nominal_height_in: 10, molding_rate_per_ui: 0.30 }
              as: FrameDesigner
              captures: { line_id: $.data.id }
            - call: "POST /frame-lines/${line_id}/measure"
              payload: { measured_width_in: 8, measured_height_in: 10 }
              as: FrameDesigner
            - call: "POST /framing-orders/${order_id}/quote"
              payload: {}
              as: FrameDesigner
          trigger:
            - call: "POST /framing-orders/${order_id}/start-production"
              payload: {}
              as: FrameProductionTech
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_DEPOSIT_NOT_PAID"

      - name: measure_blocked_once_order_in_production
        claim_type: guarded transitions
        grounds:
          - state_machines.FrameLine.DRAFT_to_MEASURED
          - errors[ERR_ORDER_NOT_EDITABLE]
        distinguishing_aspect: "Adding/measuring a line is guarded by the owning order's state: with order IN_PRODUCTION, measuring any line returns ERR_ORDER_NOT_EDITABLE (409). (Reached by adding a second DRAFT line before production, then starting production with only the first measured — but start-production needs all measured, so instead: measure attempt after start fails.)"
        test_recipe:
          setup: ["Order IN_PRODUCTION; a previously-added DRAFT line that was never measured is targeted (order had a single measured line to start; we add a second line in INTAKE? No — order is past INTAKE). Use order IN_PRODUCTION and target its only line which is already MEASURED; re-measure rejected by order-not-editable guard."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Guard", email: "guard@x.com", phone: "555-0211" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}", deposit_pct: 0.30 }
              as: FrameDesigner
              captures: { order_id: $.data.id, v0: $.data.version }
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v0}", artwork_label: "G", nominal_width_in: 8, nominal_height_in: 10, molding_rate_per_ui: 0.30 }
              as: FrameDesigner
              captures: { line_id: $.data.id }
            - call: "POST /frame-lines/${line_id}/measure"
              payload: { measured_width_in: 8, measured_height_in: 10 }
              as: FrameDesigner
            - call: "POST /framing-orders/${order_id}/quote"
              payload: {}
              as: FrameDesigner
            - call: "POST /framing-orders/${order_id}/payments"
              payload: { kind: "DEPOSIT", amount: 25.00 }
              as: FrontDeskClerk
            - call: "POST /framing-orders/${order_id}/start-production"
              payload: {}
              as: FrameProductionTech
          trigger:
            - call: "POST /frame-lines/${line_id}/measure"
              payload: { measured_width_in: 8, measured_height_in: 10 }
              as: FrameDesigner
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_ORDER_NOT_EDITABLE"

      - name: cancel_cascades_release_of_scheduled_tasks
        claim_type: Cascade down
        grounds:
          - state_machines.FramingOrder.IN_PRODUCTION_to_CANCELLED
          - state_machines.ProductionTask.SCHEDULED_to_RELEASED
          - entities.ProductionTask.fields.task_status
        distinguishing_aspect: "Cancelling an IN_PRODUCTION order cascades all its SCHEDULED tasks to RELEASED (task moves SCHEDULED->RELEASED)."
        test_recipe:
          setup: ["Order IN_PRODUCTION with one SCHEDULED task on an ASSEMBLY bench"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Casc", email: "casc@x.com", phone: "555-0212" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
            - call: "POST /workbenches"
              payload: { bench_name: "Asm Cd", bench_type: "ASSEMBLY" }
              as: FrameProductionTech
              captures: { bench_id: $.data.id }
            - call: "POST /framing-orders"
