              as: Foreman
              captures: { s_id: $.data.id }
            - call: "POST /site-utility/trench-safety-plans"
              payload: { project_id: "${p_id}", pipe_segment_id: "${s_id}", max_depth_ft: 9.5, soil_class: SOIL_C, protective_system: SLOPING, slope_ratio: 1.5 }
              as: Foreman
              captures: { sp_id: $.data.id }
            - call: "POST /site-utility/trench-safety-plans/${sp_id}/submit"
              payload: {}
              as: Foreman
              as_user_id: "foreman-1"
            - call: "POST /site-utility/trench-safety-plans/${sp_id}/review"
              payload: { decision: APPROVE }
              as: SafetyOfficer
              as_user_id: "safety-1"
