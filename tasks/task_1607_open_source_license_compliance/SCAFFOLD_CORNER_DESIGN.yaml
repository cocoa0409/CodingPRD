      - name: vulnerability_computed_read
        claim_type: computed_read
        grounds: ["endpoints[GET /oss-products/{productId}/vulnerability-findings]"]
        distinguishing_aspect: "VulnerabilityFinding includes computed remediation_deadline based on severity"
        test_recipe:
