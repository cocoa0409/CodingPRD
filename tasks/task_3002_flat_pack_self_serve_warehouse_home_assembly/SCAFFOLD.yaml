# =============================================================================
# SCAFFOLD — task_3002_flat_pack_self_serve_warehouse_home_assembly
# Flat-Pack Self-Serve Warehouse & Home Assembly Services (IKEA U.S.)
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Flat-Pack Self-Serve Warehouse & Home Assembly Services (IKEA U.S.): article
  number to aisle-bin mapping with self-serve versus full-serve pick
  determination, in-store stock signaling to shoppers with reservation of bulky
  articles at the pickup counter, multi-carton article integrity where a single
  product ships as several boxes that must be picked together, home delivery
  slotting by vehicle capacity and building access constraints, third-party
  assembly service dispatch with per-article labor time standards, spare-part
  free replacement claims without receipt, family membership pricing and
  in-store food offer linkage, returns of partially assembled goods with
  restocking and damage grading

domain_name: flat-pack-warehouse-assembly
api_prefix: /api

complexity_profile:
  primary_archetype: quota_allocation          # finite bin stock + vehicle capacity reserved/committed/released
  secondary_archetype: workflow_orchestration  # order → reservation/booking/assembly pipelines with compensation
  complexity_layers:
    - optimistic_concurrency                   # OCC on DeliverySlot.version and BinStock.version
    - cascading_side_effects                   # cancel→promote→order chains; assembly-complete→close→points
    - dual_variant_calculation                 # assembly estimate vs billed; receipted vs no-receipt refund
    - ops_run_checkpoint                       # run_sweep expires reservations and promotes waitlisted bookings
  entity_topology: flat                        # peer entities joined by FK references; no URL nesting ownership
  state_machine_shape: parallel                # Order carries status × delivery_status × assembly_status; others cyclic/branching
  relationship_patterns:
    - one_to_many                              # Article→Carton, Order→OrderLine, ReturnRequest→ReturnLine
    - cross_aggregate                          # BinStock joins Store×Carton; Booking joins Slot×Order
  role_model: peer_roles                       # StoreOps / DeliveryCoordinator / AssemblyProvider / Customer own disjoint surfaces
  consistency_model: immediate                 # all mutations + cascades visible in the same response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Store display name" }
      - { name: code, type: string, source: input, description: "Unique store code", constraints: "unique across stores" }
      - { name: low_stock_threshold, type: integer, source: input, default: 5, description: "Units at or above which an article signals IN_STOCK", constraints: ">= 1" }

  - name: Article
    parent: null
    common_fields: true
    fields:
      - { name: article_number, type: string, source: input, description: "IKEA-style article number", constraints: "unique across articles" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: category, type: enum, source: input, description: "FURNITURE | FOOD | ACCESSORY" }
      - { name: pick_policy, type: enum, source: input, description: "SELF_SERVE (shopper picks from aisle) | FULL_SERVE (bulky; pickup-counter reservation)" }
      - { name: price_cents, type: integer, source: input, description: "Regular unit price in cents", constraints: ">= 0" }
      - { name: family_price_cents, type: integer, source: input, default: null, description: "Family-member unit price in cents; null means no member price" , constraints: ">= 0 when set" }
      - { name: lowest_price_365d_cents, type: integer, source: input, default: null, description: "Lowest sale price in trailing 365 days for no-receipt refunds; null means use current price_cents" }
      - { name: requires_assembly, type: boolean, source: input, default: false, description: "Whether the article is eligible for third-party assembly" }
      - { name: carton_count, type: integer, source: computed, description: "Number of Carton rows; 0 until cartons are registered" }
      - { name: is_multi_carton, type: boolean, source: computed, description: "carton_count > 1" }

  - name: Carton
    parent: Article
    common_fields: true
    fields:
      - { name: article_id, type: string, source: system, description: "FK -> Article.id" }
      - { name: carton_seq, type: integer, source: input, description: "1-based sequence within the article", constraints: "unique per article" }
      - { name: aisle, type: string, source: input, description: "Aisle locator" }
      - { name: bin, type: string, source: input, description: "Bin locator" }
      - { name: weight_kg, type: number, source: input, description: "Carton gross weight in kg", constraints: "> 0" }
      - { name: volume_m3, type: number, source: input, description: "Carton volume in cubic meters", constraints: "> 0" }

  - name: BinStock
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: carton_id, type: string, source: input, description: "FK -> Carton.id; one BinStock row per (store, carton)", constraints: "unique (store_id, carton_id) pair" }
      - { name: on_hand, type: integer, source: input, default: 0, description: "Physical units on the shelf", constraints: ">= 0" }
      - { name: reserved, type: integer, source: computed, default: 0, description: "Units promised to ACTIVE reservations or CONFIRMED delivery bookings", constraints: ">= 0 and <= on_hand" }
      - { name: available, type: integer, source: computed, description: "= on_hand - reserved" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Customer email", constraints: "unique" }
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: member_status, type: enum, source: system, default: "NONE", description: "NONE | ACTIVE family membership" }
      - { name: member_since, type: datetime, source: system, default: null, description: "Enrollment timestamp" }
      - { name: points_balance, type: integer, source: computed, default: 0, description: "Family points; 1 point = 1 cent at redemption" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; taken from X-User-ID of the creating Customer" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | PAID | FULFILLED | DELIVERED | CLOSED | CANCELLED" }
      - { name: delivery_status, type: enum, source: system, default: "NONE", description: "NONE | WAITLISTED | SCHEDULED | OUT_FOR_DELIVERY | DELIVERED (parallel dimension)" }
      - { name: assembly_status, type: enum, source: system, default: "NONE", description: "NONE | SCHEDULED | IN_PROGRESS | COMPLETED (parallel dimension)" }
      - { name: fulfillment_channel, type: enum, source: input, default: "CARRYOUT", description: "CARRYOUT | DELIVERY; pinned at checkout" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of line_gross_cents" }
      - { name: discount_cents, type: integer, source: computed, default: 0, description: "Sum of per-line member/food discounts" }
      - { name: points_discount_cents, type: integer, source: computed, default: 0, description: "Points redemption applied at checkout" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "= subtotal_cents - discount_cents - points_discount_cents" }
      - { name: points_earned, type: integer, source: computed, default: 0, description: "floor(total_cents / 100) credited to member on CLOSED" }

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: article_id, type: string, source: input, description: "FK -> Article.id" }
      - { name: qty, type: integer, source: input, description: "Units ordered", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Effective unit price captured at checkout (family price if member eligible, else regular)" }
      - { name: line_gross_cents, type: integer, source: computed, default: 0, description: "unit_price_cents * qty" }
      - { name: line_discount_cents, type: integer, source: computed, default: 0, description: "Per-line food-offer discount, round_half_up(line_gross * 0.10) for FOOD + member" }
      - { name: line_total_cents, type: integer, source: computed, default: 0, description: "= line_gross_cents - line_discount_cents" }
      - { name: effective_unit_paid_cents, type: integer, source: computed, default: 0, description: "round_half_up(line_total_cents / qty); basis for receipted refunds; excludes points discount" }
      - { name: fulfillment_mode, type: enum, source: computed, description: "SELF_PICK (article SELF_SERVE) | PICKUP_COUNTER (article FULL_SERVE)" }
      - { name: returned_qty, type: integer, source: computed, default: 0, description: "Units already accepted on settled return lines" }

  - name: StockReservation
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: article_id, type: string, source: input, description: "FK -> Article.id; must be FULL_SERVE" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: order_line_id, type: string, source: system, default: null, description: "FK -> OrderLine.id; set when auto-created at checkout, null for standalone counter reservations" }
      - { name: qty, type: integer, source: input, description: "Units reserved", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | FULFILLED | CANCELLED | EXPIRED" }
      - { name: reserved_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: expires_at, type: datetime, source: system, description: "= reserved_at + 24h; fulfill allowed only while now < expires_at" }

  - name: DeliverySlot
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: service_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) of the delivery day" }
      - { name: vehicle_id, type: string, source: input, description: "Vehicle identifier" }
      - { name: zone, type: enum, source: input, description: "ZONE_A | ZONE_B | ZONE_C (distance band)" }
      - { name: capacity_weight_kg, type: number, source: input, description: "Max cumulative booking weight", constraints: "> 0" }
      - { name: capacity_volume_m3, type: number, source: input, description: "Max cumulative booking volume", constraints: "> 0" }
      - { name: used_weight_kg, type: number, source: computed, default: 0, description: "Sum of CONFIRMED/OUT_FOR_DELIVERY booking weights" }
      - { name: used_volume_m3, type: number, source: computed, default: 0, description: "Sum of CONFIRMED/OUT_FOR_DELIVERY booking volumes" }
      - { name: posture, type: enum, source: computed, description: "OPEN | FULL; FULL when free weight == 0 or free volume == 0" }

  - name: DeliveryBooking
    parent: null
    common_fields: true
    fields:
      - { name: slot_id, type: string, source: input, description: "FK -> DeliverySlot.id" }
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | WAITLISTED | OUT_FOR_DELIVERY | DELIVERED | CANCELLED" }
      - { name: access_type, type: enum, source: input, description: "ELEVATOR | WALKUP_LOW (floors 1-2) | WALKUP_HIGH (floor >= 3)" }
      - { name: floor, type: integer, source: input, description: "Destination floor", constraints: ">= 0" }
      - { name: total_weight_kg, type: number, source: computed, description: "Sum over order lines of qty * sum(carton weight_kg)" }
      - { name: total_volume_m3, type: number, source: computed, description: "Sum over order lines of qty * sum(carton volume_m3)" }
      - { name: fee_cents, type: integer, source: computed, description: "Delivery fee per delivery_fee_quote" }

  - name: AssemblyStandard
    parent: null
    common_fields: true
    fields:
      - { name: article_id, type: string, source: input, description: "FK -> Article.id", constraints: "unique per article" }
      - { name: minutes_per_unit, type: integer, source: input, description: "Standard labor minutes per unit", constraints: "> 0" }
      - { name: crew_size, type: integer, source: input, default: 1, description: "Crew size the standard assumes", constraints: ">= 1" }

  - name: AssemblyJob
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: provider_id, type: string, source: input, description: "Third-party crew identifier (opaque)" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | DISPATCHED | IN_PROGRESS | ON_HOLD | COMPLETED | CANCELLED" }
      - { name: window_start, type: datetime, source: input, description: "Service window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Service window end (inclusive); must be after window_start" }
      - { name: estimated_minutes, type: integer, source: computed, description: "Sum over lines with requires_assembly of qty * standard minutes_per_unit" }
      - { name: actual_minutes, type: integer, source: input, default: null, description: "Reported minutes at completion" }
      - { name: billed_minutes, type: integer, source: computed, default: null, description: "min(actual_minutes, ceil(estimated_minutes * 1.5)) at completion" }
      - { name: hold_reason, type: string, source: input, default: null, description: "Reason recorded on hold" }

  - name: SparePartClaim
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: article_id, type: string, source: input, description: "FK -> Article.id" }
      - { name: part_number, type: string, source: input, description: "Spare part identifier" }
      - { name: part_value_cents, type: integer, source: input, description: "Declared part value", constraints: ">= 0" }
      - { name: reason, type: string, source: input, description: "Free-text claim reason (no receipt required)" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | APPROVED | DENIED | SHIPPED" }
      - { name: review_note, type: string, source: input, default: null, description: "Reviewer note" }

  - name: ReturnRequest
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: order_id, type: string, source: input, default: null, description: "FK -> Order.id; null = no-receipt return" }
      - { name: receipted, type: boolean, source: computed, description: "order_id is not null" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | GRADING | SETTLED | DISPUTED" }
      - { name: refund_total_cents, type: integer, source: computed, default: 0, description: "Sum of return-line refund_cents at settle" }
      - { name: writeoff_total_cents, type: integer, source: computed, default: 0, description: "Sum over receipted lines of (basis value - refund_cents)" }

  - name: ReturnLine
    parent: ReturnRequest
    common_fields: true
    fields:
      - { name: return_id, type: string, source: system, description: "FK -> ReturnRequest.id" }
      - { name: article_id, type: string, source: input, description: "FK -> Article.id" }
      - { name: order_line_id, type: string, source: input, default: null, description: "FK -> OrderLine.id; required when the return is receipted, null for no-receipt lines" }
      - { name: qty, type: integer, source: input, description: "Units returned", constraints: ">= 1" }
      - { name: assembly_state, type: enum, source: input, description: "UNOPENED | PARTIALLY_ASSEMBLED | ASSEMBLED" }
      - { name: condition_grade, type: enum, source: input, default: null, description: "LIKE_NEW | OPEN_BOX | DAMAGED | SCRAP; set by grading" }
      - { name: effective_condition_grade, type: enum, source: computed, default: null, description: "condition_grade capped at OPEN_BOX when assembly_state != UNOPENED" }
      - { name: unit_basis_cents, type: integer, source: computed, default: null, description: "Receipted: order line effective_unit_paid_cents; no-receipt: round_half_up(lowest_price_365d * 0.9)" }
      - { name: refund_cents, type: integer, source: computed, default: null, description: "round_half_up(unit_basis_cents * qty * condition_factor)" }
      - { name: writeoff_cents, type: integer, source: computed, default: null, description: "Receipted only: unit_basis_cents * qty - refund_cents" }
      - { name: restocked_units, type: integer, source: computed, default: 0, description: "Units put back to BinStock on_hand at settle (LIKE_NEW only)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Order
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    # Parallel dimensions: status × delivery_status × assembly_status evolve independently.
    transitions:
      - from: DRAFT
        to: PAID
        trigger: "POST /api/orders/{id}/checkout"
        actor: Customer
        preconditions:
          - "order has >= 1 line"
          - "for every line: article available_units in the order store >= qty (min over its cartons of BinStock.available); else ERR_INSUFFICIENT_STOCK (all cartons short) or ERR_MULTI_CARTON_SHORTAGE (some cartons sufficient, at least one short)"
          - "every line's article has carton_count >= 1 and every carton has a BinStock row in the store"
          - "redeem_points (if given) <= customer.points_balance (else ERR_INSUFFICIENT_POINTS)"
        side_effects:
          - "order_pricing computed per line (unit capture, food discount, totals, points redemption)"
          - "points_discount_cents debited from customer.points_balance"
          - "channel CARRYOUT, line SELF_PICK: BinStock.on_hand -= qty per carton row of the article"
          - "channel CARRYOUT, line PICKUP_COUNTER: create ACTIVE StockReservation (order_line_id set, expires_at = now + 24h); BinStock.reserved += qty per carton row"
          - "channel DELIVERY: no stock movement (reservation happens at booking CONFIRMED)"
      - from: PAID
        to: FULFILLED
        trigger: "POST /api/orders/{id}/pickup-complete"
        actor: StoreOps
        preconditions:
          - "fulfillment_channel == CARRYOUT"
          - "every PICKUP_COUNTER line's reservation is FULFILLED"
        side_effects: []
      - from: PAID
        to: DELIVERED
        trigger: "system (when its DeliveryBooking transitions to DELIVERED)"
        actor: system
        preconditions: ["delivery_status == OUT_FOR_DELIVERY"]
        side_effects: ["auto-close evaluation"]
      - from: FULFILLED
        to: CLOSED
        trigger: "POST /api/orders/{id}/close OR system (auto when assembly_status becomes COMPLETED)"
        actor: Customer | system
        preconditions: ["assembly_status IN {NONE, COMPLETED}"]
        side_effects: ["points_accrual: if member ACTIVE, points_earned = floor(total_cents/100), customer.points_balance += points_earned"]
      - from: DELIVERED
        to: CLOSED
        trigger: "POST /api/orders/{id}/close OR system (auto when assembly_status becomes COMPLETED)"
        actor: Customer | system
        preconditions: ["assembly_status IN {NONE, COMPLETED}"]
        side_effects: ["points_accrual credited"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects: []
      - from: PAID
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "delivery_status == NONE (no active booking; cancel booking first)"
          - "assembly_status == NONE"
          - "no PICKUP_COUNTER line reservation is FULFILLED"
        side_effects:
          - "compensation: SELF_PICK lines restock (BinStock.on_hand += qty per carton)"
          - "compensation: ACTIVE auto-reservations -> CANCELLED (BinStock.reserved -= qty per carton)"
          - "compensation: points_discount_cents re-credited to customer.points_balance"
      # --- delivery_status dimension ---
      - from: NONE
        to: CONFIRMED_OR_WAITLISTED
        trigger: "POST /api/orders/{id}/delivery-bookings -> delivery_status = SCHEDULED if booking CONFIRMED else WAITLISTED"
        actor: Customer
        preconditions: ["status == PAID", "fulfillment_channel == DELIVERY", "delivery_status == NONE (else ERR_DUPLICATE_BOOKING)"]
        side_effects: ["booking CONFIRMED: BinStock.reserved += qty per carton per line; DeliverySlot.used_* += booking totals; DeliverySlot.version += 1"]
        note: "dimension target is SCHEDULED or WAITLISTED"
      - from: WAITLISTED
        to: SCHEDULED
        trigger: "system (waitlist_promotion on booking cancel or run_sweep)"
        actor: system
        preconditions: ["booking fits remaining slot capacity"]
        side_effects: ["BinStock.reserved += qty per carton per line", "DeliverySlot.used_* += booking totals", "DeliverySlot.version += 1"]
      - from: WAITLISTED
        to: NONE
        trigger: "POST /api/delivery-bookings/{id}/cancel"
        actor: Customer | DeliveryCoordinator
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: OUT_FOR_DELIVERY
        trigger: "POST /api/delivery-bookings/{id}/start"
        actor: DeliveryCoordinator
        preconditions: []
        side_effects: []
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /api/delivery-bookings/{id}/complete"
        actor: DeliveryCoordinator
        preconditions: []
        side_effects: ["BinStock: on_hand -= qty and reserved -= qty per carton per line", "order status -> DELIVERED"]
      - from: SCHEDULED
        to: NONE
        trigger: "POST /api/delivery-bookings/{id}/cancel"
        actor: Customer | DeliveryCoordinator
        preconditions: []
        side_effects: ["release stock reservation (reserved -= qty per carton per line)", "DeliverySlot.used_* -= booking totals", "DeliverySlot.version += 1", "waitlist_promotion scan on the slot"]
      # --- assembly_status dimension ---
      - from: NONE
        to: SCHEDULED
        trigger: "POST /api/orders/{id}/assembly-jobs"
        actor: Customer
        preconditions: ["status IN {FULFILLED, DELIVERED}", "assembly_status == NONE"]
        side_effects: []
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/assembly-jobs/{id}/start"
        actor: AssemblyProvider
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/assembly-jobs/{id}/complete"
        actor: AssemblyProvider
        preconditions: []
        side_effects: ["auto-close evaluation: if order status IN {FULFILLED, DELIVERED} -> CLOSED with points_accrual"]
      - from: SCHEDULED
        to: NONE
        trigger: "POST /api/assembly-jobs/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects: []

  - entity: StockReservation
    initial_state: ACTIVE
    terminal_states: [FULFILLED, CANCELLED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: FULFILLED
        trigger: "POST /api/reservations/{id}/fulfill"
        actor: StoreOps
        preconditions: ["now < expires_at (else transition EXPIRED and reject ERR_RESERVATION_EXPIRED)"]
        side_effects: ["BinStock.reserved -= qty and on_hand -= qty per carton of the article"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/reservations/{id}/cancel OR system (order cancel cascade)"
        actor: Customer | StoreOps | system
        preconditions: []
        side_effects: ["BinStock.reserved -= qty per carton"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /api/stores/{id}/run_sweep with expires_at <= now; or lazily on fulfill past expiry)"
        actor: system
        preconditions: []
        side_effects: ["BinStock.reserved -= qty per carton", "stock signal recomputed"]

  - entity: DeliveryBooking
    initial_state: CONFIRMED  # or WAITLISTED when the slot cannot fit it
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "system (waitlist_promotion)"
        actor: system
        preconditions: ["fits remaining slot weight and volume"]
        side_effects: ["slot used_* += totals; slot.version += 1; stock reserved +=; order.delivery_status -> SCHEDULED"]
      - from: CONFIRMED
        to: OUT_FOR_DELIVERY
        trigger: "POST /api/delivery-bookings/{id}/start"
        actor: DeliveryCoordinator
        preconditions: []
        side_effects: ["order.delivery_status -> OUT_FOR_DELIVERY"]
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /api/delivery-bookings/{id}/complete"
        actor: DeliveryCoordinator
        preconditions: []
        side_effects: ["stock on_hand -= and reserved -= per carton per line", "order.delivery_status -> DELIVERED", "order.status -> DELIVERED", "auto-close evaluation"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/delivery-bookings/{id}/cancel"
        actor: Customer | DeliveryCoordinator
        preconditions: []
        side_effects: ["slot used_* -= totals; slot.version += 1; stock reserved -= per carton per line", "order.delivery_status -> NONE", "waitlist_promotion scan"]
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /api/delivery-bookings/{id}/cancel"
        actor: Customer | DeliveryCoordinator
        preconditions: []
        side_effects: ["order.delivery_status -> NONE"]

  - entity: AssemblyJob
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: DISPATCHED
        trigger: "POST /api/assembly-jobs/{id}/dispatch"
        actor: AssemblyProvider
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /api/assembly-jobs/{id}/start"
        actor: AssemblyProvider
        preconditions: []
        side_effects: ["order.assembly_status -> IN_PROGRESS"]
      - from: IN_PROGRESS
        to: ON_HOLD
        trigger: "POST /api/assembly-jobs/{id}/hold"
        actor: AssemblyProvider
        preconditions: []
        side_effects: []
      - from: ON_HOLD
        to: IN_PROGRESS
        trigger: "POST /api/assembly-jobs/{id}/resume"
        actor: AssemblyProvider
        preconditions: []
        side_effects: []
        note: "cyclic revision loop: IN_PROGRESS <-> ON_HOLD may repeat"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/assembly-jobs/{id}/complete"
        actor: AssemblyProvider
        preconditions: []
        side_effects: ["billed_minutes computed (capped_actual_billing)", "order.assembly_status -> COMPLETED", "auto-close: order -> CLOSED and points_accrual credited"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /api/assembly-jobs/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects: ["order.assembly_status -> NONE"]
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /api/assembly-jobs/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects: ["order.assembly_status -> NONE"]

  - entity: SparePartClaim
    initial_state: SUBMITTED
    terminal_states: [DENIED, SHIPPED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/spare-part-claims/{id}/review (decision=APPROVE)"
        actor: StoreOps
        preconditions: ["spare_part_claim_eligibility passes (rolling 365d count < 3; rolling value + part_value_cents <= 3000)"]
        side_effects: []
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /api/spare-part-claims/{id}/review (decision=DENY)"
        actor: StoreOps
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SHIPPED
        trigger: "POST /api/spare-part-claims/{id}/ship"
        actor: StoreOps
        preconditions: []
        side_effects: []

  - entity: ReturnRequest
    initial_state: DRAFT
    terminal_states: []  # SETTLED is quasi-terminal; DISPUTED cycle may reopen it
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/returns/{id}/submit"
        actor: Customer
        preconditions: ["has >= 1 line"]
        side_effects: []
      - from: SUBMITTED
        to: GRADING
        trigger: "system (auto when the first line is graded)"
        actor: system
        preconditions: []
        side_effects: []
      - from: GRADING
        to: SETTLED
        trigger: "POST /api/returns/{id}/settle"
        actor: StoreOps
        preconditions: ["every line has condition_grade set (else ERR_UNGRADED_LINES)"]
        side_effects:
          - "refund_total_cents / writeoff_total_cents computed (return_refund)"
          - "LIKE_NEW receipted lines: BinStock.on_hand += qty per carton (restocked_units = qty); order line returned_qty += qty"
          - "non-receipted lines: no restock; no-receipt writeoff contributes 0 to writeoff_total_cents"
          - "receipted non-LIKE_NEW lines: order line returned_qty += qty, no restock"
      - from: SETTLED
        to: DISPUTED
        trigger: "POST /api/returns/{id}/dispute"
        actor: Customer
        preconditions: []
        side_effects: ["reverse previous settlement: restocked LIKE_NEW units removed (on_hand -= restocked_units); returned_qty rolled back"]
      - from: DISPUTED
        to: GRADING
        trigger: "POST /api/returns/{id}/reopen"
        actor: StoreOps
        preconditions: []
        side_effects: ["lines may be re-graded; settle recomputes refund/writeoff from scratch"]
        note: "cycle SETTLED -> DISPUTED -> GRADING -> SETTLED allowed; each settle is a full recompute"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-slot
    parent_entity: DeliverySlot
    write_endpoint: "POST /api/orders/{id}/delivery-bookings"
    occ_field: "expected_slot_version"
    description: |
      Creating a DeliveryBooking against a DeliverySlot whose version has
      advanced since the client last observed it is rejected. The booking
      quotes fee and capacity from a point-in-time view of the slot; a stale
      view (e.g. another booking has since consumed capacity, bumping the
      slot version) must be re-read before booking.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: stock-adjust-stale-binstock
    parent_entity: BinStock
    write_endpoint: "POST /api/bin-stock/{id}/adjust"
    occ_field: "expected_stock_version"
    description: |
      A manual stock adjustment carries the BinStock version the operator
      last observed. Because adjustments are delta-based, a request written
      against a stale row (the row has since been mutated by a checkout,
      reservation, fulfillment, return restock, or a prior adjustment) is
      rejected so the operator re-reads the row before re-applying the delta.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: stock_availability_and_signal
    trigger: "GET /api/stores/{id}/articles/{article_id}/signal; recomputed after every BinStock mutation"
    algorithm: aggregation
    formula: |
      cartons = all Carton rows of the article (ordered by carton_seq ASC)
      if no cartons or any carton lacks a BinStock row in this store: available_units = 0
      else: available_units = min over cartons c of (BinStock(c).on_hand - BinStock(c).reserved)
      threshold = store.low_stock_threshold
      if available_units == 0: signal = OUT_OF_STOCK
      elif available_units < threshold: signal = LOW_STOCK
      else (available_units >= threshold): signal = IN_STOCK
    input_set: "all Carton rows of the article and their BinStock rows in the given store"
    constants:
      DEFAULT_LOW_STOCK_THRESHOLD: 5
    precision: "integer units"

  - name: order_pricing
    trigger: "POST /api/orders/{id}/checkout"
    algorithm: tiered_pricing
    formula: |
      evaluation order is pinned (no circularity):
      (1) per line: unit = (member ACTIVE and article.family_price_cents not null)
            ? article.family_price_cents : article.price_cents
      (2) line_gross_cents = unit * qty
      (3) food offer: if member ACTIVE and article.category == FOOD:
            line_discount_cents = round_half_up(line_gross_cents * 0.10)
          else 0
      (4) line_total_cents = line_gross_cents - line_discount_cents
      (5) effective_unit_paid_cents = round_half_up(line_total_cents / qty)
      (6) subtotal = sum(line_gross); discount = sum(line_discount)
      (7) points redemption: applied = min(redeem_points requested,
            customer.points_balance, floor((subtotal - discount) * 0.20))
      (8) total_cents = subtotal - discount - applied
      ROUNDING ORDER IS PINNED: discount is rounded PER LINE (half-up) and the
      rounded per-line values are summed. Sum-then-round is NOT used and
      produces different cents (e.g. two FOOD lines at 115 cents each:
      per-line 12 + 12 = 24; sum-then-round would give 23).
    input_set: "all OrderLine rows of the order"
    constants:
      FOOD_MEMBER_DISCOUNT_PCT: 0.10
      POINTS_REDEMPTION_CAP_PCT: 0.20
    precision: "integer cents, round_half_up per line"

  - name: points_accrual
    trigger: "Order transitions to CLOSED"
    algorithm: aggregation
    formula: |
      if customer.member_status == ACTIVE: points_earned = floor(order.total_cents / 100)
      else points_earned = 0
      customer.points_balance += points_earned
    input_set: "the closing order"
    precision: "integer points"

  - name: delivery_fee_quote
    trigger: "POST /api/orders/{id}/delivery-bookings"
    algorithm: tiered_pricing
    formula: |
      W = booking total_weight_kg (sum over lines of qty * sum carton weight_kg)
      base = ZONE_BASE[slot.zone]
      weight_surcharge =
        0                          if W <= 50
        2500                       if 50 < W <= 150
        2500 + ceil(W - 150) * 15  if W > 150
      access_fee = 1200 if access_type == WALKUP_HIGH else 0
      feasibility: if access_type == WALKUP_HIGH and any carton of any line
        weighs > 40 kg -> reject ERR_ACCESS_INFEASIBLE (no fee quoted)
      gross = base + weight_surcharge + access_fee
      fee_cents = round_half_up(gross * 0.80) if member ACTIVE else gross
    input_set: "order lines + their cartons, slot zone, customer membership"
    constants:
      ZONE_BASE_A: 4900
      ZONE_BASE_B: 7900
      ZONE_BASE_C: 12900
      WEIGHT_TIER1_KG: 50
      WEIGHT_TIER2_KG: 150
      TIER2_FLAT_CENTS: 2500
      OVERAGE_CENTS_PER_KG: 15
      WALKUP_HIGH_FEE_CENTS: 1200
      WALKUP_HIGH_MAX_CARTON_KG: 40
      MEMBER_FEE_DISCOUNT_PCT: 0.20
    precision: "integer cents, round_half_up once at the member-discount step"
    variants:
      - name: member_quote
        when: "customer member_status == ACTIVE"
        difference: "20% off the gross fee, rounded half-up once at the end"

  - name: slot_capacity_consumption
    trigger: "booking create, cancel, promotion"
    algorithm: aggregation
    formula: |
      used_weight_kg = sum(total_weight_kg) over bookings in {CONFIRMED, OUT_FOR_DELIVERY}
      used_volume_m3 = sum(total_volume_m3) over the same set
      a candidate booking FITS iff used_weight + candidate.weight <= capacity_weight
                                AND used_volume + candidate.volume <= capacity_volume
      (<= is inclusive: a booking that exactly fills both dimensions FITS)
      booking weight > capacity_weight OR volume > capacity_volume on an EMPTY
      slot -> ERR_BOOKING_NEVER_FITS (422) instead of WAITLISTED
    input_set: "bookings on the slot with status CONFIRMED or OUT_FOR_DELIVERY"

  - name: waitlist_promotion
    trigger: "delivery booking cancel; run_sweep"
    algorithm: waterfall_allocation
    formula: |
      candidates = WAITLISTED bookings on the slot
      rank: created_at ASC; tie-break total_weight_kg ASC, then total_volume_m3 ASC
      greedy scan in rank order: if candidate FITS remaining capacity -> CONFIRMED
      (consume capacity, reserve stock, order.delivery_status -> SCHEDULED);
      else skip and continue scanning smaller candidates.
      empty candidate set: no-op (no error).
    input_set: "WAITLISTED DeliveryBooking rows of the slot"

  - name: assembly_labor_estimate
    trigger: "POST /api/orders/{id}/assembly-jobs (estimate) and /complete (billing)"
    algorithm: aggregation
    formula: |
      estimated_minutes = sum over order lines where article.requires_assembly
        of qty * AssemblyStandard(article).minutes_per_unit
      missing standard for any requires_assembly line -> reject ERR_STANDARD_MISSING
      at completion: billed_minutes = min(actual_minutes, ceil(estimated_minutes * 1.5))
    input_set: "order lines with article.requires_assembly == true"
    constants:
      BILLING_CAP_FACTOR: 1.5
    precision: "integer minutes, ceil on the cap"
    variants:
      - name: standard_estimate
        when: "job creation"
        difference: "pure table sum; ignores reported actuals"
      - name: capped_actual_billing
        when: "job completion"
        difference: "uses provider-reported actual_minutes capped at 1.5x estimate; identical inputs can bill less than (or equal to) the estimate-derived cap, never more"

  - name: crew_window_conflict
    trigger: "POST /api/orders/{id}/assembly-jobs"
    algorithm: interval_merge
    formula: |
      for the same provider_id, consider existing jobs with status IN
      {REQUESTED, DISPATCHED, IN_PROGRESS, ON_HOLD}.
      BUFFER = 30 minutes applied on BOTH sides of every existing window.
      conflict iff new.window_start < existing.window_end + BUFFER
               AND existing.window_start - BUFFER < new.window_end
      a gap of exactly 30 minutes is allowed (strict < on both sides).
    input_set: "non-terminal AssemblyJob rows with the same provider_id"
    constants:
      CREW_BUFFER_MINUTES: 30

  - name: spare_part_claim_eligibility
    trigger: "POST /api/spare-part-claims/{id}/review with decision=APPROVE"
    algorithm: threshold
    formula: |
      window = [now - 365 days, now]
      prior = claims of this customer with status IN {APPROVED, SHIPPED}
              and created_at in window
      check order pinned: (1) count, (2) value
      if count(prior) >= 3 -> ERR_CLAIM_LIMIT_EXCEEDED
      if sum(prior.part_value_cents) + this.part_value_cents > 3000
        -> ERR_CLAIM_VALUE_EXCEEDED
      exactly 3000 cumulative after this claim is allowed (> not >=).
    input_set: "customer's APPROVED/SHIPPED claims in the rolling window"
    constants:
      MAX_CLAIMS_365D: 3
      MAX_CLAIM_VALUE_365D_CENTS: 3000

  - name: return_refund
    trigger: "ReturnRequest settle (and re-settle after dispute)"
    algorithm: tiered_pricing
    formula: |
      per return line (rounded PER LINE, half-up, then summed):
      factor = LIKE_NEW 1.00 | OPEN_BOX 0.85 | DAMAGED 0.50 | SCRAP 0.00
      effective_grade = condition_grade, capped at OPEN_BOX when
        assembly_state IN {PARTIALLY_ASSEMBLED, ASSEMBLED}
      receipted line (order_line_id set):
        unit_basis_cents = OrderLine.effective_unit_paid_cents
      no-receipt line (order_line_id null; requires member ACTIVE else
        ERR_RECEIPT_REQUIRED at line creation):
        lowest = article.lowest_price_365d_cents if not null else article.price_cents
        unit_basis_cents = round_half_up(lowest * 0.9)
      refund_cents = round_half_up(unit_basis_cents * qty * factor)
      receipted writeoff_cents = unit_basis_cents * qty - refund_cents
      no-receipt writeoff_cents = 0
    input_set: "all ReturnLine rows of the request"
    constants:
      NO_RECEIPT_PENALTY_PCT: 0.10
      GRADE_FACTOR_LIKE_NEW: 1.00
      GRADE_FACTOR_OPEN_BOX: 0.85
      GRADE_FACTOR_DAMAGED: 0.50
      GRADE_FACTOR_SCRAP: 0.00
    precision: "integer cents, round_half_up per line"
    variants:
      - name: receipted_value
        when: "line references an order line"
        difference: "basis is the price actually paid (effective_unit_paid_cents)"
      - name: no_receipt_value
        when: "line has no order line"
        difference: "basis is the lowest price in 365 days further discounted by a 10% no-receipt penalty; identical article and grade refund less than receipted"

  - name: reservation_expiry
    trigger: "run_sweep; lazy check on fulfill"
    algorithm: chronological
    formula: |
      expires_at = reserved_at + 24h exactly
      fulfill allowed iff now < expires_at; at now == expires_at the
      reservation is expired (boundary: >= expires_at means expired).
      run_sweep expires every ACTIVE reservation with expires_at <= now,
      releasing BinStock.reserved, and then runs waitlist_promotion on every
      slot of the store.
    input_set: "ACTIVE StockReservation rows of the store"
    constants:
      RESERVATION_TTL_HOURS: 24

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "request shape: required fields present, enums valid, types correct"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "role permitted for endpoint; entity_backed Customer may only act on own resources (X-User-ID == resource customer_id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "path and body-referenced ids exist, validated left-to-right"
    error_id: "ERR_STORE_NOT_FOUND | ERR_ARTICLE_NOT_FOUND | ERR_CARTON_NOT_FOUND | ERR_BIN_STOCK_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ORDER_LINE_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_JOB_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_RETURN_NOT_FOUND | ERR_RETURN_LINE_NOT_FOUND | ERR_STANDARD_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: business_constraint
    check: "OCC: expected_slot_version / expected_stock_version matches current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/orders/{id}/delivery-bookings, POST /api/bin-stock/{id}/adjust"
  - priority: 6
    category: state
    check: "state machine from-state and cross-entity state preconditions (order payable, order delivered/fulfilled for assembly, order returnable, reservation active, no duplicate booking, lines all graded)"
    error_id: "ERR_INVALID_STATE | ERR_ORDER_NOT_RETURNABLE | ERR_RESERVATION_EXPIRED | ERR_DUPLICATE_BOOKING | ERR_UNGRADED_LINES"
    http_status: 409
    applies_to: "state-transition endpoints"
  - priority: 7
    category: business_temporal
    check: "temporal rules: assembly window not in the past, delivery slot service_date not in the past"
    error_id: "ERR_WINDOW_IN_PAST | ERR_SLOT_IN_PAST"
    http_status: 422
    applies_to: "POST /api/orders/{id}/assembly-jobs, POST /api/orders/{id}/delivery-bookings"
  - priority: 8
    category: business_constraint
    check: "constraint satisfaction: stock sufficiency, multi-carton completeness, duplicate bin stock row, slot fits, building access feasibility, crew window conflict, assembly standard present, receipt required, return qty within purchased remainder"
    error_id: "ERR_INSUFFICIENT_STOCK | ERR_MULTI_CARTON_SHORTAGE | ERR_DUPLICATE_BIN_STOCK | ERR_BOOKING_NEVER_FITS | ERR_ACCESS_INFEASIBLE | ERR_CREW_WINDOW_CONFLICT | ERR_STANDARD_MISSING | ERR_RECEIPT_REQUIRED | ERR_RETURN_QTY_EXCEEDED"
    http_status: 422
    applies_to: "business write endpoints"
  - priority: 9
    category: business_fiscal
    check: "fiscal limits last: points balance, spare-part claim count/value caps"
    error_id: "ERR_INSUFFICIENT_POINTS | ERR_CLAIM_LIMIT_EXCEEDED | ERR_CLAIM_VALUE_EXCEEDED"
    http_status: 422
    applies_to: "checkout, spare-part claim review"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: []

  # --- Store ---
  - method: POST
    path: "/api/stores"
    description: "Create a store"
    roles: [PlatformAdmin]
    code: 201
    input: [name, code, "low_stock_threshold?"]
    output: Store
    side_effects: []

  - method: GET
    path: "/api/stores/{id}"
    description: "Get a store"
    roles: [PlatformAdmin, StoreOps, DeliveryCoordinator, AssemblyProvider, Customer]
    code: 200
    input: []
    output: Store
    side_effects: []

  - method: GET
    path: "/api/stores/{id}/stock"
    description: "List BinStock rows of a store"
    roles: [PlatformAdmin, StoreOps, DeliveryCoordinator, AssemblyProvider, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: BinStock[]
    side_effects: []

  - method: GET
    path: "/api/stores/{id}/articles/{article_id}/signal"
    description: "In-store stock signal for a shopper (multi-carton aggregate)"
    roles: [PlatformAdmin, StoreOps, DeliveryCoordinator, AssemblyProvider, Customer]
    code: 200
    input: []
    output: { article_id: string, store_id: string, available_units: integer, threshold_used: integer, signal: enum }
    side_effects: []

  - method: POST
    path: "/api/stores/{id}/run_sweep"
    description: "Ops-run checkpoint: expire reservations with expires_at <= now (releasing reserved stock) and run waitlist promotion on every slot of the store"
    roles: [StoreOps]
    code: 200
    input: []
    output: { expired_reservation_ids: array, promoted_booking_ids: array }
    side_effects: ["reservation_expiry", "waitlist_promotion"]

  # --- Article / Carton ---
  - method: POST
    path: "/api/articles"
    description: "Create an article"
    roles: [PlatformAdmin]
    code: 201
    input: [article_number, name, category, pick_policy, price_cents, "family_price_cents?", "lowest_price_365d_cents?", "requires_assembly?"]
    output: Article
    side_effects: []

  - method: GET
    path: "/api/articles/{id}"
    description: "Get an article"
    roles: [PlatformAdmin, StoreOps, DeliveryCoordinator, AssemblyProvider, Customer]
    code: 200
    input: []
    output: Article
    side_effects: []

  - method: PATCH
    path: "/api/articles/{id}"
    description: "Update pricing fields of an article"
    roles: [PlatformAdmin]
    code: 200
    input: ["price_cents?", "family_price_cents?", "lowest_price_365d_cents?"]
    output: Article
    side_effects: []

  - method: POST
    path: "/api/articles/{id}/cartons"
    description: "Register a carton (aisle/bin mapping) for an article"
    roles: [PlatformAdmin]
    code: 201
    input: [carton_seq, aisle, bin, weight_kg, volume_m3]
    output: Carton
    side_effects: ["article.carton_count recomputed"]

  - method: GET
    path: "/api/articles/{id}/cartons"
    description: "List cartons of an article"
    roles: [PlatformAdmin, StoreOps, DeliveryCoordinator, AssemblyProvider, Customer]
    code: 200
    input: []
    output: Carton[]
    side_effects: []

  # --- BinStock ---
  - method: POST
    path: "/api/bin-stock"
    description: "Create the BinStock row for a (store, carton) pair"
    roles: [StoreOps]
    code: 201
    input: [store_id, carton_id, "on_hand?"]
    output: BinStock
    side_effects: []

  - method: GET
    path: "/api/bin-stock/{id}"
    description: "Get a BinStock row"
    roles: [PlatformAdmin, StoreOps, DeliveryCoordinator, AssemblyProvider, Customer]
    code: 200
    input: []
    output: BinStock
    side_effects: []

  - method: GET
    path: "/api/bin-stock"
    description: "List BinStock rows with filters"
    roles: [PlatformAdmin, StoreOps, DeliveryCoordinator, AssemblyProvider, Customer]
    code: 200
    input: ["store_id?", "carton_id?", "limit?", "offset?"]
    output: BinStock[]
    side_effects: []

  - method: POST
    path: "/api/bin-stock/{id}/adjust"
    description: "Manual delta adjustment of on_hand (OCC-guarded)"
    roles: [StoreOps]
    code: 200
    input: [delta_on_hand, expected_stock_version]
    output: BinStock
    side_effects: ["on_hand += delta_on_hand (must stay >= reserved and >= 0)", "increments BinStock.version by 1"]

  # --- Customer ---
  - method: POST
    path: "/api/customers"
    description: "Register a customer"
    roles: [PlatformAdmin, StoreOps]
    code: 201
    input: [email, full_name]
    output: Customer
    side_effects: []

  - method: GET
    path: "/api/customers/{id}"
    description: "Get a customer"
    roles: [PlatformAdmin, StoreOps, DeliveryCoordinator, AssemblyProvider, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/api/customers/{id}/enroll"
    description: "Enroll a customer in the family membership"
    roles: [StoreOps]
    code: 200
    input: []
    output: Customer
    side_effects: ["member_status -> ACTIVE", "member_since = now"]

  - method: GET
    path: "/api/customers/{id}/orders"
    description: "List orders of a customer"
    roles: [PlatformAdmin, StoreOps, DeliveryCoordinator, AssemblyProvider, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Order[]
    side_effects: []

