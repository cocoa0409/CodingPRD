            - *n_cert2
            - *n_read_dealer
            - *n_commit
            - *n_submit
            - *n_submit_agree
            - *n_ready
            - call: "POST /dealer-network/dealer-agreements/${ag_id}/activate"
              payload: {}
              as: DealerNetworkManager
            - call: "GET /dealer-network/dealer-agreements/${ag_id}"
              payload: {}
              as: DealerNetworkManager
              captures: { ag_v: $.data.version }
            - call: "POST /dealer-network/rebuild-claims"
              payload: { dealer_id: "${d_id}", product_family: "EXCAVATION", machine_serial: "SN-7200", machine_operating_weight_lb: 90000, client_meter_hours: 3000, requested_at: "2026-08-22T00:00:00Z", core_purchase_value_cents: 4000000, rebuild_labor_hours: 10.0, rebuild_labor_rate_cents: 14000, certified_rebuild_spec_code: "CAT_CERTIFIED_2" }
              as: RebuildProgramSpecialist
              captures: { rc_id: $.data.id, rc_v: $.data.version }
          trigger:
            - call: "POST /dealer-network/rebuild-claims/${rc_id}/approve"
              payload: { expected_rebuildclaim_version: "${rc_v}" }
              as: RebuildProgramSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_NO_RESTRICTION_PRIORITY"
            - "err != ERR_REBUILD_SPEC_EXCEEDED"
            - "RebuildClaim.${rc_id}.status is still REQUESTED"
            - "GET /dealer-network/parts-commitments?dealer_id=${d_id}&status=PERFORMANCE_DEFICIENT returns 0 rows"

      - name: restore_claim_denies_the_agreement_terminate_when_a_batch_is_open
        claim_type: Violation to Error
        grounds:
          - errors.ERR_AGREEMENT_COMMITMENT_OPEN
          - state_machines.DealerAgreement.ACTIVE_to_TERMINATED
          - endpoints.POST_/dealer-network/dealer-agreements/{id}/terminate
        distinguishing_aspect: "DealerAgreement.DRAFT_to_TERMINATED does not exist as a transition, so a terminate from DRAFT answers 409 ERR_INVALID_STATE, while the same call from ACTIVE with an ordered batch answers 409 ERR_AGREEMENT_COMMITMENT_OPEN — the two 409s come from different layers on the same endpoint."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One dealer T-410 whose ACTIVE agreement holds a commitment with an ORDERED batch."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - *n_agree
