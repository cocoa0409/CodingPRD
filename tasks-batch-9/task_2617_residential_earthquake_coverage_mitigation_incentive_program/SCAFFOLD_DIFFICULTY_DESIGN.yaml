      - name: grant_cycle_windows_collide_on_touching_endpoints_within_one_track
        grounds:
          - validations.ERR_GRANT_CYCLE_WINDOW_OVERLAP
          - entities.GrantCycle.fields.program_track
          - entities.GrantCycle.fields.opens_at
        distinguishing_aspect: |
          GrantCycle windows are CLOSED intervals with no buffer, scoped to program_track and
          checked against cycles in ANY status, so a BRACE_AND_BOLT cycle opening exactly on the
          incumbent's closes_at is refused while one opening a single second later is accepted, the
          same colliding window is accepted on the MOBILE_HOME track, and closing the incumbent does
          not free its window.
        test_recipe:
          setup:
            - "An incumbent BRACE_AND_BOLT cycle covering the closed interval [2026-01-01T00:00:00Z, 2026-06-30T00:00:00Z]"
            - "No grants exist, so nothing but the window rule can refuse the probes"
          setup_api_calls:
            - call: "POST /eqp/grant-cycles"
              payload: { program_track: "BRACE_AND_BOLT", label: "2026 H1 Brace and Bolt", opens_at: "2026-01-01T00:00:00Z", closes_at: "2026-06-30T00:00:00Z", total_pool_cents: 5000000 }
              as: ProgramAdmin
              captures: { gc_1: $.data.id, gc_1_status: $.data.status }
          trigger:
            - call: "POST /eqp/grant-cycles"
              payload: { program_track: "BRACE_AND_BOLT", label: "Touching H2", opens_at: "2026-06-30T00:00:00Z", closes_at: "2026-12-31T00:00:00Z", total_pool_cents: 5000000 }
              as: ProgramAdmin
              captures: { t1_err: $.data.error_id }
            - call: "POST /eqp/grant-cycles"
              payload: { program_track: "MOBILE_HOME", label: "Same window other track", opens_at: "2026-06-30T00:00:00Z", closes_at: "2026-12-31T00:00:00Z", total_pool_cents: 5000000 }
              as: ProgramAdmin
              captures: { t2_id: $.data.id, t2_track: $.data.program_track, t2_status: $.data.status }
            - call: "POST /eqp/grant-cycles"
              payload: { program_track: "BRACE_AND_BOLT", label: "One second clear", opens_at: "2026-06-30T00:00:01Z", closes_at: "2026-12-31T00:00:00Z", total_pool_cents: 5000000 }
              as: ProgramAdmin
              captures: { t3_id: $.data.id, t3_opens: $.data.opens_at }
            - call: "POST /eqp/grant-cycles"
              payload: { program_track: "BRACE_AND_BOLT", label: "Touching the early end", opens_at: "2025-06-01T00:00:00Z", closes_at: "2026-01-01T00:00:00Z", total_pool_cents: 5000000 }
              as: ProgramAdmin
              captures: { t4_err: $.data.error_id }
            - call: "POST /eqp/grant-cycles/${gc_1}/close"
              payload: {}
              as: ProgramAdmin
              captures: { closed_status: $.data.status }
            - call: "POST /eqp/grant-cycles"
              payload: { program_track: "BRACE_AND_BOLT", label: "Retry after close", opens_at: "2026-06-30T00:00:00Z", closes_at: "2026-12-30T00:00:00Z", total_pool_cents: 5000000 }
              as: ProgramAdmin
              captures: { t5_err: $.data.error_id }
          assert:
            - "${gc_1_status} == \"OPEN\""
            - "probe 1 returns HTTP 409 with ${t1_err} == \"ERR_GRANT_CYCLE_WINDOW_OVERLAP\" - the single shared instant 2026-06-30T00:00:00Z is a collision because both bounds are inclusive"
            - "probe 2 is accepted: ${t2_track} == \"MOBILE_HOME\" and ${t2_status} == \"OPEN\" - the rule is scoped per program_track"
            - "probe 3 is accepted with ${t3_opens} == \"2026-06-30T00:00:01Z\" - one second of clearance is enough, so there is no buffer"
            - "probe 4 returns HTTP 409 with ${t4_err} == \"ERR_GRANT_CYCLE_WINDOW_OVERLAP\" - touching the incumbent's opens_at collides on the early side as well"
            - "${closed_status} == \"CLOSED\""
            - "probe 5 returns HTTP 409 with ${t5_err} == \"ERR_GRANT_CYCLE_WINDOW_OVERLAP\" - a CLOSED cycle still reserves its historical window"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: policy_renewal_gated_on_the_reoffered_mandatory_offer_being_reaccepted
        grounds:
          - state_machines.Policy.lifecycle_status.ACTIVE_to_ACTIVE_renew
          - state_machines.MandatoryOffer.status.ACCEPTED_to_PENDING_reoffer
          - validations.ERR_MANDATORY_OFFER_NOT_ACCEPTED
        distinguishing_aspect: |
          A renewal is refused not because of anything on the Policy but because the annual re-offer
          pushed the linked MandatoryOffer from ACCEPTED back to PENDING; the identical renew call
          succeeds the moment the policyholder re-accepts that offer, and the renewal then moves the
          policy's own renewal window forward so an immediate second renew is refused for a different
          reason entirely.
        test_recipe:
          setup:
            - "A bound one-year policy on a TIER_2 / STIFF / WOOD_FRAME_SLAB / 1990 dwelling of 20,000,000 cents at deductible 10 (base premium 64,000 cents)"
            - "Bound at the default clock 2026-08-01T00:00:00Z, so effective_at = 2026-08-01 and expires_at = 2027-08-01"
            - "The clock is then advanced to 2027-07-01T00:00:00Z, inside the renewal window [2027-06-17, 2027-08-01)"
          setup_api_calls:
            - call: "POST /eqp/insurers"
              payload: { name: "Coast Range Mutual", naic_code: "12207", market_share_pct: 11.0 }
              as: ProgramAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /eqp/policyholders"
              payload: { full_name: "Ronan Vega", email: "ronan@example.com", county_code: "CA-SCR" }
              as: ProgramAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "88 Ridge Fault Road", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_SLAB", year_built: 1990, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { dw_id: $.data.id }
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_id}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_id: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_id}/respond"
              payload: { response: "ACCEPT" }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /eqp/policies"
              payload: { dwelling_id: "${dw_id}", insurer_id: "${ins_id}", accepted_offer_id: "${off_id}", deductible_pct: 10, contents_sublimit_cents: 4000000, loss_of_use_sublimit_cents: 2000000 }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { pol_id: $.data.id, quoted_premium: $.data.annual_premium_cents }
            - call: "POST /eqp/policies/${pol_id}/bind"
              payload: {}
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { bound_expires: $.data.expires_at, term_1: $.data.term_number }
            - call: "POST /eqp/_clock/set_current_utc"
              payload: { current_utc: "2027-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eqp/mandatory-offers/${off_id}/reoffer"
              payload: {}
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { reoffer_status: $.data.status, reoffer_round: $.data.offer_round, reoffer_expires: $.data.expires_at }
          trigger:
            - call: "POST /eqp/policies/${pol_id}/renew"
              payload: {}
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { blocked_err: $.data.error_id }
            - call: "POST /eqp/mandatory-offers/${off_id}/respond"
              payload: { response: "ACCEPT" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { reaccept_status: $.data.status }
            - call: "POST /eqp/policies/${pol_id}/renew"
              payload: {}
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { term_2: $.data.term_number, r_effective: $.data.effective_at, r_expires: $.data.expires_at, r_variant: $.data.rating_variant, r_base: $.data.base_premium_cents, r_annual: $.data.annual_premium_cents }
            - call: "POST /eqp/policies/${pol_id}/renew"
              payload: {}
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { second_err: $.data.error_id }
          assert:
            - "${quoted_premium} == 64000 and ${term_1} == 1 and ${bound_expires} == \"2027-08-01T00:00:00Z\""
            - "${reoffer_status} == \"PENDING\", ${reoffer_round} == 2, ${reoffer_expires} == \"2027-08-30T00:00:00Z\" - the re-offer resets the response"
            - "the first renew returns HTTP 409 with ${blocked_err} == \"ERR_MANDATORY_OFFER_NOT_ACCEPTED\" even though the policy is ACTIVE and the clock is inside the renewal window"
            - "${reaccept_status} == \"ACCEPTED\""
            - "the second renew returns HTTP 200 with ${term_2} == 2, ${r_effective} == \"2027-08-01T00:00:00Z\", ${r_expires} == \"2028-07-31T00:00:00Z\""
            - "${r_variant} == \"RENEWAL_TIME\" and ${r_base} == 64000 and ${r_annual} == 64000 - an unretrofitted dwelling rates identically under both variants, so the divergence here is purely in the gating"
            - "the third renew returns HTTP 409 with ${second_err} == \"ERR_RENEWAL_WINDOW_NOT_OPEN\": the accepted offer is still ACCEPTED, but the term rolled forward and 2027-07-01 is no longer within 45 days of 2028-07-31"

      - name: bind_gated_on_insurer_compliance_driven_by_undocumented_decline_count
        grounds:
          - state_machines.ParticipatingInsurer.compliance_status.COMPLIANT_to_SANCTIONED
          - calculations.take_up_rate_evaluation
          - validations.ERR_INSURER_SANCTIONED
        distinguishing_aspect: |
          The take-up evaluation sanctions the insurer on the undocumented-decline trigger while the
          take-up rate sits exactly on the 2500 bp floor and therefore cannot downgrade anything,
          which blocks a bind of a completely valid quote; REINSTATE unblocks the bind without
          clearing undocumented_decline_count, and a later evaluation over an offer-free window
          recomputes that counter down to zero because it is window-derived rather than cumulative.
        test_recipe:
          setup:
            - "One insurer and one policyholder with four dwellings, one mandatory offer per dwelling, all offered at the default clock 2026-08-01T00:00:00Z"
            - "Offer 1 is ACCEPTED; offers 2, 3 and 4 are DECLINED with decline_documented omitted, so it defaults to false"
            - "Dwelling 1 is TIER_2 / STIFF / WOOD_FRAME_SLAB / 1990 / 20,000,000 cents; a policy is quoted on it at deductible 10 BEFORE the sanction lands"
          setup_api_calls:
            - call: "POST /eqp/insurers"
              payload: { name: "Delta Levee Insurance", naic_code: "13318", market_share_pct: 8.0 }
              as: ProgramAdmin
              captures: { ins_id: $.data.id, initial_compliance: $.data.compliance_status }
