  # ===========================================================================
  # RULE 9 — compensating_invariant
  # Two DIFFERENT conserved quantities, each with its own compensating action:
  #   instance 1 = acuity_load_conservation (staffing acuity units) compensated
  #                by POST /bundle-activations/{activationId}/rescind
  #   instance 2 = induction_bed_minute_conservation (schedulable LDR bed-minutes
  #                per UTC day) compensated by /confirm -> /bump and /cancel
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: bundle_rescind_returns_the_shared_shift_load_to_1_3_not_to_zero_and_not_to_2_8
        grounds:
          - invariants.acuity_load_conservation
          - calculations.care_assignment_unit_debit
          - calculations.encounter_required_coverage_units
          - calculations.unit_posture_derivation
          - entities.ShiftAssignment.fields.assigned_acuity_load_units
          - entities.ShiftAssignment.fields.capacity_units_effective
          - entities.CareAssignment.fields.acuity_units_consumed
          - entities.LaborEncounter.fields.required_coverage_units
          - entities.LaborEncounter.fields.assigned_coverage_units
          - entities.LaborEncounter.fields.magnesium_infusion_active
          - entities.ObstetricUnit.fields.coverage_deficit_units
          - entities.SafetyBundleActivation.fields.on_time_step_count
          - entities.SafetyBundleActivation.fields.missed_step_count
          - state_machines.SafetyBundleActivation.STAGE_1_IN_PROGRESS_to_RESCINDED
          - state_machines.BundleChecklistItem.COMPLETED_to_NOT_APPLICABLE
          - state_machines.LaborEncounter.COVERAGE_BREACH_to_RATIO_COVERED
          - endpoints[POST /bundle-activations/{activationId}/rescind]
        distinguishing_aspect: |
          The conserved quantity is a SHARED sum, so "undo" cannot be implemented
          as "reset". ONE BEDSIDE shift (capacity_units_effective 4.0) carries two
          RATIO_SHARED assignments: encounter E1 (ANTEPARTUM, TIER_I) priced at
          1.0 * 0.5 = 0.5 and encounter E2 (ANTEPARTUM but prior_cesarean, so
          TIER_II) priced at round_half_up(1.5 * 0.5, 1) = 0.8 — a per-row
          rounding, not a rounding of the sum. Baseline
          assigned_acuity_load_units = 1.3.
          Completing MAGNESIUM_LOADED sets E1.magnesium_infusion_active, which
          drives E1 to TIER_IV / one_to_one_required and re-prices its ACTIVE row
          IN PLACE from 0.5 to 4.0 * 0.5 = 2.0, taking the shift to 2.8, the unit
          deficit to 4.0 - 2.0 = 2.0 (RATIO_STRAINED, buffer 75) and E1 to
          COVERAGE_BREACH — even though 2.8 is still under the 4.0 capacity,
          because one_to_one_required is set and no ONE_TO_ONE row exists.
          The rescind must land on 1.3 EXACTLY. Every plausible shortcut lands
          somewhere else:
            * zeroing the shift on rescind, or crediting back "the bundle's
              units", yields 0.0 or 0.8 — E2's load is not the bundle's to give
              back;
            * crediting the NEW 2.0 without re-debiting the OLD 0.5 yields 0.8;
            * only recomputing required_coverage_units and forgetting the ACTIVE
              row's re-price leaves 2.8 with a 0.5 requirement;
            * releasing E1's assignment instead of re-pricing it leaves 0.8 and
              an encounter at UNASSIGNED rather than RATIO_COVERED.
          Three independent ledgers must agree afterwards: the shift sum (1.3),
          E1.assigned_coverage_units (0.5) and unit.coverage_deficit_units (0.0),
          and the posture-derived turnover_buffer_minutes must fall back from 75
          to 45. The bundle's own residue is equally specific: EVERY item —
          including the COMPLETED magnesium row — becomes NOT_APPLICABLE, all
          three counters return to 0, and both scores stay null (variant
          rescinded_activation), while unit.bundle_breach_count is untouched at 0.
          Note the activation itself is load-neutral: at status ACTIVATED no tier
          clause of calc encounter_required_coverage_units matches, so the entire
          2.8 excursion is caused by the single checklist completion, and the
          rescind is legal only because highest_stage_reached is exactly 1.
        test_recipe:
          setup: |
            One unit (3 LDR beds, 1 OR room) with one ACTIVE BEDSIDE shift held by
            an ADVANCED-cert RN — capacity_units_effective = min(4.0, 4.0) with no
            CHARGE offset and no TIER_IV focus penalty yet = 4.0 — covering TWO
            walk-in ANTEPARTUM encounters through RATIO_SHARED assignments: E1
            (parity 1, 39 weeks, vertex singleton, no prior cesarean -> TIER_I,
            required 0.5) and E2 (parity 2, 39 weeks, prior_cesarean true ->
            TIER_II, required 0.8). Both are RATIO_COVERED, the unit deficit is
            0.0 and the shift carries 1.3 of its 4.0 units. A SEVERE_HYPERTENSION
            bundle is then activated on E1 at 09:00 (168/114, both over the
            160/110 criteria) and its MAGNESIUM_LOADED row — step_sequence 2,
            stage_gate 1, therefore completable while the activation is still
            ACTIVATED — is completed at 09:20, inside the activation-anchored
            deadline of 09:00 + 90 minutes, which moves the activation to
            STAGE_1_IN_PROGRESS (highest_stage_reached 1, still rescindable) and
            pushes E1 to TIER_IV. The performing RN satisfies validation 12
            through her ACTIVE CareAssignment on E1, not through a CHARGE shift.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-24T08:00:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /obstetric-units
              payload: { unit_name: "Halverstock Perinatal Institute", licensed_ldr_beds: 3, licensed_or_rooms: 1, max_daily_induction_bed_minutes: 2880 }
