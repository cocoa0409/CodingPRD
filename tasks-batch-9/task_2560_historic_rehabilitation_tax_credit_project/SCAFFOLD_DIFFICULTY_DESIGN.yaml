# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2560 — Historic Rehabilitation Tax Credit Project
#
# Nine rule_ids from SKILL.md §0.5, two instances each = 18 instances.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# Every numeric assert below was computed against the named calculations[].formula
# and its constants (round_half_up, integer cents).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: qre_provisional_vs_final_divergence_flips_substantial_test
        grounds:
          - calculations.qre_totals
          - calculations.substantial_rehabilitation_test
          - calculations.ratable_credit_schedule
          - entities.Project.fields.qre_total_provisional_cents
          - entities.Project.fields.qre_total_final_cents
          - entities.CostLineItem.fields.classification
        distinguishing_aspect: |
          Cost-accounting variant on the Project entity domain: the PROVISIONAL
          variant counts a PENDING_CLASSIFICATION line item in a QRE-eligible
          category while the FINAL variant excludes it, and on the same data the two
          variants land on opposite sides of the substantial rehabilitation
          threshold (250000000 vs 210000000 against a threshold of 250000000).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One developer, one property, one MASTER_LEASE project with adjusted_basis_cents = 250000000 and a 24-month measuring period starting 2026-09-01 (so the half-open window is [2026-09-01, 2028-09-01))."
            - "Two in-period costs classified QRE (200000000 HARD_CONSTRUCTION, 10000000 ARCHITECTURAL_ENGINEERING) and one in-period cost of 40000000 HARD_CONSTRUCTION left PENDING_CLASSIFICATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /developers"
              payload: { legal_name: "Elm Mill Partners LLC", taxpayer_id_last4: "4821", entity_type: "LLC" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /properties"
              payload: { name: "Elm Mill", street_address: "120 Elm Street", city: "Dayton", state_code: "OH", year_built: 1912, listing_status: "INDIVIDUAL_LISTED" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", property_id: "${prop_id}", project_name: "Elm Mill Rehab", structure_type: "MASTER_LEASE", adjusted_basis_cents: 250000000, measuring_period_months: 24, measuring_period_start_date: "2026-09-01" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /cost-line-items"
              payload: { project_id: "${proj_id}", vendor_name: "Keystone Masonry", category: "HARD_CONSTRUCTION", amount_cents: 200000000, incurred_date: "2027-01-15", classification: "QRE" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /cost-line-items"
              payload: { project_id: "${proj_id}", vendor_name: "Hale Architects", category: "ARCHITECTURAL_ENGINEERING", amount_cents: 10000000, incurred_date: "2027-02-10", classification: "QRE" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /cost-line-items"
              payload: { project_id: "${proj_id}", vendor_name: "Riverbend Millwork", category: "HARD_CONSTRUCTION", amount_cents: 40000000, incurred_date: "2027-03-05" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { c3_id: $.data.id }
          trigger:
            - call: "GET /projects/${proj_id}/qre-summary"
              payload: { variant: "PROVISIONAL" }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "GET /projects/${proj_id}/qre-summary"
              payload: { variant: "FINAL" }
              as: Developer
              as_user_id: "${dev_id}"
          assert:
            - "PROVISIONAL response: data.qre_total_cents == 250000000"
            - "PROVISIONAL response: data.variant_applied == PROVISIONAL"
            - "PROVISIONAL response: data.substantial_test_status_under_variant == MET"
            - "PROVISIONAL response: data.pending_classification_item_count == 1"
            - "FINAL response: data.qre_total_cents == 210000000"
            - "FINAL response: data.substantial_test_status_under_variant == NOT_MET"
            - "FINAL response: data.substantial_test_threshold_cents == 250000000"
            - "Project.${proj_id}.qre_total_provisional_cents == 250000000"
            - "Project.${proj_id}.qre_total_final_cents == 210000000"
            - "Project.${proj_id}.substantial_test_status == NOT_MET"
            - "Project.${proj_id}.annual_credit_cents == 0"
            - "Project.${proj_id}.total_claimable_credit_cents == 0"

      - name: investor_risk_admission_vs_in_service_variant_divergence
        grounds:
          - calculations.investor_disqualification_risk
          - entities.InvestorInterest.fields.disqualification_risk_score
          - entities.InvestorInterest.fields.risk_variant_applied
          - state_machines.ComplianceCovenant.PENDING_ATTESTATION_to_BREACHED
          - entities.Project.fields.max_investor_risk_score
        distinguishing_aspect: |
          Risk-scoring variant on the InvestorInterest entity domain — a different
          subject and a different metric from the Project cost-accounting variant:
          identical party attributes score 42 under ADMISSION and 62 under
          IN_SERVICE once one covenant is BREACHED, because only the IN_SERVICE
          variant adds the capped project-level adder.
        test_recipe:
          setup:
            - "A project that has cleared Part 1 and Part 2 review and has been placed in service on 2029-01-15, clock at 2029-02-01T00:00:00Z."
            - "One MASTER_LEASE_LESSEE interest: PARTNERSHIP tax status, lease_term_years = 23, pass-through election made (so the PENDING penalty has dropped out) → ADMISSION score 10 + 10 + 22 + 0 = 42."
            - "One USE_RESTRICTION covenant in PENDING_ATTESTATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /developers"
              payload: { legal_name: "Elm Mill Partners LLC", taxpayer_id_last4: "4821", entity_type: "LLC" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /reviewers"
              payload: { full_name: "S. Hale", agency: "SHPO", state_code: "OH" }
              as: PlatformAdmin
              captures: { shpo_id: $.data.id }
            - call: "POST /reviewers"
              payload: { full_name: "N. Park", agency: "NPS", state_code: "DC" }
              as: PlatformAdmin
              captures: { nps_id: $.data.id }
            - call: "POST /properties"
              payload: { name: "Elm Mill", street_address: "120 Elm Street", city: "Dayton", state_code: "OH", year_built: 1912, listing_status: "INDIVIDUAL_LISTED" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", property_id: "${prop_id}", project_name: "Elm Mill Rehab", structure_type: "MASTER_LEASE", adjusted_basis_cents: 60000000, measuring_period_months: 24, measuring_period_start_date: "2026-09-01" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id, proj_v1: $.data.version }
            - call: "POST /part-applications"
              payload: { project_id: "${proj_id}", part_number: 1, narrative: "Evaluation of significance for the Elm Mill complex.", expected_project_version: "${proj_v1}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { pa1_id: $.data.id }
            - call: "POST /part-applications/${pa1_id}/submit"
              payload: { shpo_reviewer_id: "${shpo_id}" }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /part-applications/${pa1_id}/shpo-recommend"
              payload: { recommendation: "RECOMMEND_APPROVAL" }
              as: ShpoReviewer
              as_user_id: "${shpo_id}"
            - call: "POST /part-applications/${pa1_id}/nps-determination"
              payload: { determination: "APPROVED" }
              as: NpsReviewer
              as_user_id: "${nps_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_v2: $.data.version }
            - call: "POST /part-applications"
              payload: { project_id: "${proj_id}", part_number: 2, narrative: "Rehabilitation plan measured against the ten Standards.", expected_project_version: "${proj_v2}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { pa2_id: $.data.id }
            - call: "POST /part-applications/${pa2_id}/submit"
              payload: { shpo_reviewer_id: "${shpo_id}" }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /part-applications/${pa2_id}/shpo-recommend"
              payload: { recommendation: "RECOMMEND_APPROVAL" }
              as: ShpoReviewer
              as_user_id: "${shpo_id}"
            - call: "POST /part-applications/${pa2_id}/nps-determination"
              payload: { determination: "APPROVED" }
              as: NpsReviewer
              as_user_id: "${nps_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /projects/${proj_id}/place-in-service"
              payload: { placed_in_service_date: "2029-01-15" }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /investor-interests"
              payload: { project_id: "${proj_id}", kind: "MASTER_LEASE_LESSEE", party_legal_name: "Bridge Credit Fund II LP", party_tax_status: "PARTNERSHIP", capital_committed_cents: 40000000, credit_allocation_pct: 99.00, lease_term_years: 23 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { inv_id: $.data.id }
            - call: "POST /investor-interests/${inv_id}/elect-pass-through"
              payload: {}
              as: InvestorAdmin
              as_user_id: "${inv_id}"
            - call: "POST /compliance-covenants"
              payload: { project_id: "${proj_id}", covenant_type: "USE_RESTRICTION", monitoring_frequency: "ANNUAL", window_start_date: "2029-01-15", window_end_date: "2030-01-14" }
              as: ComplianceMonitor
              captures: { cov_id: $.data.id }
          trigger:
            - call: "POST /compliance-covenants/${cov_id}/attest"
              payload: { period_end_date: "2029-01-31", outcome: "EXCEPTION" }
              as: Developer
              as_user_id: "${dev_id}"
          assert:
            - "before the trigger: InvestorInterest.${inv_id}.disqualification_risk_score == 42"
            - "before the trigger: InvestorInterest.${inv_id}.risk_variant_applied == ADMISSION"
            - "after the trigger: InvestorInterest.${inv_id}.disqualification_risk_score == 62"
            - "after the trigger: InvestorInterest.${inv_id}.risk_variant_applied == IN_SERVICE"
            - "Project.${proj_id}.max_investor_risk_score == 62"
            - "ComplianceCovenant.${cov_id}.status == BREACHED"
            - "ComplianceCovenant.${cov_id}.exception_count == 1"
            - "Project.${proj_id}.compliance_status == CURE_PENDING"

  - rule_id: combinatorial_formula
    instances:
      - name: ratable_credit_rounding_order_pinned_per_year_then_multiply
        grounds:
          - calculations.ratable_credit_schedule
          - calculations.qre_totals
          - entities.Project.fields.annual_credit_cents
          - entities.Project.fields.total_claimable_credit_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters: with
          qre_total_final_cents = 62500013, rounding the per-year amount first gives
          annual = 2500001 and total = 12500005, whereas the forbidden "rate x years
          then round" order gives 12500003; the scaffold pins the per-year-first
          order and the test asserts the 2-cent difference.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One MASTER_LEASE project with adjusted_basis_cents = 60000000 and a 24-month measuring period starting 2026-09-01, no costs yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /developers"
              payload: { legal_name: "Elm Mill Partners LLC", taxpayer_id_last4: "4821", entity_type: "LLC" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /properties"
              payload: { name: "Elm Mill", street_address: "120 Elm Street", city: "Dayton", state_code: "OH", year_built: 1912, listing_status: "INDIVIDUAL_LISTED" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", property_id: "${prop_id}", project_name: "Elm Mill Rehab", structure_type: "MASTER_LEASE", adjusted_basis_cents: 60000000, measuring_period_months: 24, measuring_period_start_date: "2026-09-01" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /cost-line-items"
              payload: { project_id: "${proj_id}", vendor_name: "Keystone Masonry", category: "HARD_CONSTRUCTION", amount_cents: 62500013, incurred_date: "2027-05-10", classification: "QRE" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { c1_id: $.data.id }
          assert:
            - "Project.${proj_id}.qre_total_final_cents == 62500013"
            - "Project.${proj_id}.substantial_test_threshold_cents == 60000000"
            - "Project.${proj_id}.substantial_test_status == MET"
            - "Project.${proj_id}.annual_credit_cents == 2500001"
            - "Project.${proj_id}.total_claimable_credit_cents == 12500005"
            - "Project.${proj_id}.total_claimable_credit_cents != 12500003 (the value produced by rounding after multiplying by RATABLE_YEARS)"
            - "Project.${proj_id}.credit_unclaimed_cents == 12500005"

      - name: claim_settlement_evaluation_order_offset_before_ledger_write
        grounds:
          - calculations.claim_settlement
          - calculations.recapture_assessment
          - state_machines.CreditClaim.DRAFT_to_FILED
          - state_machines.RecaptureEvent.ASSESSED_to_SETTLED
          - entities.CreditClaim.fields.recapture_offset_cents
          - entities.Project.fields.recapture_balance_cents
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency pinned by evaluation order: the
          offset is a function of recapture_balance_cents while the same write
          mutates recapture_balance_cents, so the scaffold pins offset-then-mutate
          and the test asserts offset == 2000001 with net == 500000; mutating the
          ledger first would double-count the offset and leave the balance negative.
        test_recipe:
          setup:
            - "Project fully certified through Part 3 with qre_total_final_cents = 62500013, annual_credit_cents = 2500001 frozen, placed in service 2029-01-15."
            - "Master-lease lessee admitted with the pass-through election made (risk score 42)."
            - "Tax-year 2029 claim already filed for its full gross of 2500001, so credit_claimed_to_date_cents == 2500001."
            - "A COVENANT_BREACH recapture event dated 2030-01-20 (full_years_elapsed == 1, pct == 0.80) assessed at 2000001, leaving recapture_balance_cents == 2000001."
            - "A DRAFT tax-year 2030 claim with gross_credit_cents == 2500001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /developers"
              payload: { legal_name: "Elm Mill Partners LLC", taxpayer_id_last4: "4821", entity_type: "LLC" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /reviewers"
