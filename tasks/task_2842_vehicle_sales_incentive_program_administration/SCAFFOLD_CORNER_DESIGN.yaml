              captures: { b_status_after_close: $.data.status }
          assert:
            - "${a_status} == ACTIVE and ${a_closed} == CLOSED"
            - "${b_status} == DRAFT and ${b_rule_id} is created: authoring a fully colliding program is ALLOWED — nothing at creation time consults the incumbent"
            - "${err_overlap} == ERR_PROGRAM_WINDOW_OVERLAP (409): both the half-open windows [08-01,09-01) and [08-15,09-15) and the closed build-date intervals 05-01..07-31 and 06-01..08-31 intersect, on the same incentive_type, model and region"
            - "${b_status_after_fail} == DRAFT and ${b_version_after_fail} == 1 — the refused submit was completely inert"
            - "${b_status_after_close} == PENDING_APPROVAL: the identical request now passes because A is CLOSED and the rule only looks at {PENDING_APPROVAL, ACTIVE}"
            - "no StackabilityConstraint was ever needed — the escape hatch is one way to pass the rule, not the only way"

      - name: shape_bounds_accept_equal_inclusive_endpoints_and_refuse_a_zero_length_program_window
        claim_type: violation_error
        grounds:
          - validations[priority=6]
        distinguishing_aspect: "Four boundary cases separate the STRICT bound from the three inclusive ones in the very same check: effective_to == effective_from is refused, while build_date_to == build_date_from, period_end == period_start and scheduled_pay_date == period_end are all accepted. An implementation that uses one comparison operator everywhere fails exactly one of the four."
        test_recipe:
          setup:
            - "No prior payment batch in region ZZBND, so the period-overlap and settlement-buffer rules cannot interfere."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
          trigger:
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-V-BND1", name: "Zero Length Window", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-08-01T00:00:00.000Z", per_unit_amount_cents: 100000, budget_cents: 1000000, stack_group: "CRNBND", priority_rank: 419, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { err_zero_window: $.data.error_id }
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-V-BND2", name: "Bad Enum Program", incentive_type: "CUSTOMER_CASHBACK", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 100000, budget_cents: 1000000, stack_group: "CRNBND", priority_rank: 420, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { err_enum: $.data.error_id }
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-V-BND3", name: "Bad Tier Ladder", incentive_type: "DEALER_STAIR_STEP", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 0, budget_cents: 1000000, stack_group: "CRNBND", priority_rank: 421, tier_schedule: [{ tier_index: 1, threshold_bps: 9000, per_unit_bonus_cents: 20000 }, { tier_index: 2, threshold_bps: 9000, per_unit_bonus_cents: 40000 }], tier_bonus_mode: "MARGINAL" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { err_tier: $.data.error_id }
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-V-BND4", name: "One Millisecond Window", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-08-01T00:00:00.001Z", per_unit_amount_cents: 100000, budget_cents: 1000000, stack_group: "CRNBND", priority_rank: 422, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { ok_prog: $.data.id, ok_from: $.data.effective_from, ok_to: $.data.effective_to }
            - call: "POST /incentives/programs/${ok_prog}/eligibility-rules"
              payload: { model_code: "MX5", region_code: "ZZBND", build_date_from: "2026-06-01T00:00:00.000Z", build_date_to: "2026-06-01T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { ok_rule: $.data.id, rule_from: $.data.build_date_from, rule_to: $.data.build_date_to }
            - call: "POST /incentives/payment-batches"
              payload: { batch_code: "CRN-B-BND", region_code: "ZZBND", period_start: "2026-08-10T00:00:00.000Z", period_end: "2026-08-10T00:00:00.000Z", scheduled_pay_date: "2026-08-10T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { ok_batch: $.data.id, batch_status: $.data.status, batch_count: $.data.claim_count }
          assert:
            - "${err_zero_window} == ERR_INVALID_REQUEST (400): effective_to must be STRICTLY greater than effective_from, so a zero-length program is impossible"
            - "${err_enum} == ERR_INVALID_REQUEST — CUSTOMER_CASHBACK is one letter group away from a real member and must still be refused"
            - "${err_tier} == ERR_INVALID_REQUEST — tier_schedule must be strictly ascending in BOTH tier_index and threshold_bps, and these two tiers tie on threshold_bps"
            - "${ok_from} == 2026-08-01T00:00:00.000Z and ${ok_to} == 2026-08-01T00:00:00.001Z: one millisecond is a legal window, which shows the refusal above was about equality and not about brevity"
            - "${ok_rule} is created with ${rule_from} == ${rule_to} == 2026-06-01T00:00:00.000Z: build_date_to >= build_date_from, so a single-day build footprint is legal"
            - "${batch_status} == OPEN and ${batch_count} == 0 with period_end == period_start == scheduled_pay_date all equal: period_end >= period_start and scheduled_pay_date >= period_end are both inclusive"
            - "every instant echoed back carries exactly three fractional digits"

      - name: an_unknown_role_header_is_unauthenticated_while_a_known_but_wrong_role_is_unauthorized
        claim_type: violation_error
        grounds:
          - validations[priority=1]
          - validations[priority=2]
        distinguishing_aspect: "Three header states are separated on the same GET: absent headers and a syntactically fine but undeclared role BOTH yield 401 ERR_UNAUTHENTICATED, whereas a declared role that simply is not on the endpoint's list yields 403 ERR_UNAUTHORIZED. Collapsing an unknown role into 403 is the natural mistake and is caught here."
        test_recipe:
          setup:
            - "One DRAFT program to read, and one existing dealer."
            - "Calls marked `as: NONE` are sent with NEITHER X-User-Role nor X-User-ID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/dealers"
              payload: { dealer_code: "CRN-D-AUTH", name: "Auth Motors", region_code: "WEST", historical_volume_units: 4, market_opportunity_bps: 0 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { dealer_id: $.data.id }
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-V-AUTH", name: "Auth Program", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 100000, budget_cents: 1000000, stack_group: "CRNAUTH", priority_rank: 423, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /incentives/programs/${prog_id}"
              payload: {}
              as: NONE
              as_user_id: NONE
              captures: { err_absent: $.data.error_id }
            - call: "GET /incentives/programs/${prog_id}"
              payload: {}
              as: RegionalAnalyst
              as_user_id: "u-ghost-1"
              captures: { err_unknown_role: $.data.error_id }
            - call: "GET /incentives/programs/${prog_id}"
              payload: {}
              as: ProgramDesigner
              as_user_id: NONE
              captures: { err_no_user: $.data.error_id }
            - call: "GET /incentives/programs"
              payload: {}
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { err_wrong_role: $.data.error_id }
            - call: "POST /incentives/dealers"
              payload: { dealer_code: "CRN-D-AUTH2", name: "Auth Motors Two", region_code: "WEST", historical_volume_units: 1, market_opportunity_bps: 0 }
              as: RegionalAnalyst
              as_user_id: "u-ghost-1"
              captures: { err_unknown_write: $.data.error_id }
          assert:
            - "${err_absent} == ERR_UNAUTHENTICATED with HTTP 401 — no headers at all"
            - "${err_unknown_role} == ERR_UNAUTHENTICATED with HTTP 401, NOT ERR_UNAUTHORIZED: RegionalAnalyst is not one of the five declared roles, so the request fails at priority 1 before any endpoint role list is consulted"
            - "${err_no_user} == ERR_UNAUTHENTICATED — both headers are required, and a valid role without an X-User-ID is still unauthenticated"
            - "${err_wrong_role} == ERR_UNAUTHORIZED with HTTP 403: Dealer IS a declared role but is absent from the roles list of GET /incentives/programs, which is the collection listing a dealer must never see"
            - "${err_unknown_write} == ERR_UNAUTHENTICATED — the unknown role behaves identically on a write, so no undeclared role can ever reach a business check"
            - "GET /incentives/programs/{id} DOES include Dealer, so the 401s above cannot be explained away by the endpoint refusing dealers"

      - name: duplicate_claim_check_looks_past_rejected_and_charged_back_predecessors
