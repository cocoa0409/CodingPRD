            - "every one of the five responses carries response_type == \"error\" and a data object whose keys are exactly {error_id, message}"
            - "m409, m401, m404, m422 and m400 are all non-empty strings and each one renders the catalog's message_template for its id (e.g. m404 names the junction id 88888888-8888-4888-8888-888888888888)"
            - "meta.api_request_id and meta.api_request_timestamp are present on all five, and the five api_request_id values are pairwise distinct"
