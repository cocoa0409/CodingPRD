          trigger:
            - call: "POST /casting/casting-calls/${call_touch_id}/publish"
              payload: {}
              as: CastingDirector
              captures: { err_id: $.data.error_id }
            - call: "POST /casting/casting-calls/${call_disjoint_id}/publish"
              payload: {}
              as: CastingDirector
              captures: { disjoint_status: $.data.status }
          assert:
            - "${err_id} == ERR_VENUE_CAPACITY_EXCEEDED"
            - "HTTP status of the touching-window publish == 409"
            - "CastingCall.${call_touch_id}.status == DRAFT"
            - "${disjoint_status} == PUBLISHED"
            - "CastingCall.${call_disjoint_id}.status == PUBLISHED"
            - "CastingCall.${call_a_id}.status == PUBLISHED"

