              captures: { cv_b: $.data.version }
            - call: "POST /contests/${cst}/vote-reports"
              payload: { county_id: "${cty_b}", source: "FEED", precincts_reporting: 5, candidate_votes: [{ candidate_id: "${cand_w}", votes: 2010 }, { candidate_id: "${cand_t}", votes: 1990 }], expected_contest_version: "${cv_b}" }
              as: FeedOperator
              captures: { rep_b: $.data.id }
            - call: "POST /vote-reports/${rep_b}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: TabulationClerk
            - *tab_posture
            - call: "GET /contests/${cst}"
              payload: {}
              as: DecisionAnalyst
              as_user_id: "analyst-nina"
              captures: { cv_c: $.data.version }
            - call: "POST /contests/${cst}/calls"
              payload: { winner_candidate_id: "${cand_w}", expected_contest_version: "${cv_c}" }
              as: DecisionAnalyst
              as_user_id: "analyst-nina"
              captures: { call_w: $.data.id }
            - call: "POST /contests/${cst}/recount-cases"
              payload: {}
              as: RecountOfficer
              captures: { rc: $.data.id }
            - call: "POST /recount-cases/${rc}/decisions"
              payload: { action: "ACTIVATE" }
              as: RecountOfficer
          trigger:
            - call: "POST /calls/${call_w}/decisions"
              payload: { action: "PUBLISH" }
              as: DecisionDeskChief
              as_user_id: "chief-ray"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RECOUNT_ACTIVE_BLOCKS_CALL"
            - "RaceCall.${call_w}.status == PROPOSED"
            - "Contest.${cst}.call_status == UNCALLED"
            - "Contest.${cst}.tabulation_status == COMPLETE (activation outside CERTIFICATION does not reopen)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: stringer_windows_half_open_overlap
        grounds:
          - state_machines.StringerAssignment.creation_to_SCHEDULED
          - validations[priority=14]
          - entities.StringerAssignment.fields.window_start
          - errors[ERR_ASSIGNMENT_WINDOW_OVERLAP]
        distinguishing_aspect: "Half-open pairwise interval semantics on the Stringer resource: an overlapping window [19:00, 23:00) against [08:00, 20:00) is rejected, while the merely touching window [20:00, 23:00) is accepted because half-open intervals share no instant."
        test_recipe:
          setup:
            - "Event and Alameda registered; stringer Sally holds a SCHEDULED assignment for Alameda covering [2026-11-03T08:00:00Z, 2026-11-03T20:00:00Z)."
          setup_api_calls:
            - *clock0
            - *ev
            - *cty_a
            - *str_s
            - call: "POST /election-events/${ev}/assignments"
              payload: { county_id: "${cty_a}", window_start: "2026-11-03T08:00:00Z", window_end: "2026-11-03T20:00:00Z", stringer_id: "${str_s}" }
              as: StringerCoordinator
              captures: { asg1: $.data.id }
          trigger:
            - call: "POST /election-events/${ev}/assignments"
              payload: { county_id: "${cty_a}", window_start: "2026-11-03T19:00:00Z", window_end: "2026-11-03T23:00:00Z", stringer_id: "${str_s}" }
              as: StringerCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /election-events/${ev}/assignments"
              payload: { county_id: "${cty_a}", window_start: "2026-11-03T20:00:00Z", window_end: "2026-11-03T23:00:00Z", stringer_id: "${str_s}" }
              as: StringerCoordinator
              captures: { asg2: $.data.id }
          assert:
            - "err == ERR_ASSIGNMENT_WINDOW_OVERLAP for the 19:00 overlap"
            - "StringerAssignment.${asg2} created 201 with status SCHEDULED — adjacency at 20:00 is not an overlap"
            - "GET /stringers/${str_s}/assignments returns exactly 2 rows"

      - name: coverage_budget_closed_interval_aggregate_capacity
        grounds:
          - state_machines.CoverageDecision.PROPOSED_to_APPROVED
          - validations[priority=19]
          - entities.ElectionEvent.fields.total_stringer_hour_budget
          - errors[ERR_COVERAGE_BUDGET_EXCEEDED]
        distinguishing_aspect: "Closed-interval aggregate-capacity semantics on the event-level stringer-hour pool — not pairwise window overlap: decisions sharing the boundary day 2026-11-03 DO intersect, the check sums hours across all intersecting APPROVED/FUNDED decisions, and the cap is inclusive (250 + 150 == 400 approves, 250 + 200 == 450 rejects)."
        test_recipe:
          setup:
            - "Event budget 400 stringer-hours; contest exists; decision D1 (250h, [2026-10-30, 2026-11-03]) APPROVED."
          setup_api_calls:
            - *clock0
            - *ev
            - *cty_a
            - *cst
            - *lnk_a
            - *cand_w
            - *cand_t
            - call: "POST /election-events/${ev}/coverage-decisions"
              payload: { contest_id: "${cst}", allocated_stringer_hours: 250, coverage_start: "2026-10-30", coverage_end: "2026-11-03" }
              as: CoveragePlanner
              captures: { d1: $.data.id }
            - call: "POST /coverage-decisions/${d1}/review"
              payload: { decision: "APPROVE" }
              as: ElectionOpsAdmin
            - call: "POST /election-events/${ev}/coverage-decisions"
              payload: { contest_id: "${cst}", allocated_stringer_hours: 200, coverage_start: "2026-11-03", coverage_end: "2026-11-05" }
              as: CoveragePlanner
              captures: { d2: $.data.id }
            - call: "POST /election-events/${ev}/coverage-decisions"
              payload: { contest_id: "${cst}", allocated_stringer_hours: 150, coverage_start: "2026-11-03", coverage_end: "2026-11-04" }
              as: CoveragePlanner
              captures: { d3: $.data.id }
          trigger:
            - call: "POST /coverage-decisions/${d2}/review"
              payload: { decision: "APPROVE" }
              as: ElectionOpsAdmin
              captures: { err: $.data.error_id }
            - call: "POST /coverage-decisions/${d3}/review"
              payload: { decision: "APPROVE" }
              as: ElectionOpsAdmin
          assert:
            - "err == ERR_COVERAGE_BUDGET_EXCEEDED (250 + 200 = 450 > 400; closed intervals intersect on 2026-11-03)"
            - "CoverageDecision.${d2}.status == PROPOSED (failed review leaves state unchanged)"
            - "CoverageDecision.${d3}.status == APPROVED (250 + 150 = 400 <= 400 inclusive boundary)"
            - "CoverageDecision.${d1}.status == APPROVED"

  - rule_id: compensating_invariant
    instances:
      - name: accept_then_void_restores_contest_totals
        grounds:
          - state_machines.VoteReport.RECEIVED|FLAGGED_to_ACCEPTED
          - state_machines.VoteReport.ACCEPTED_to_VOIDED
          - state_machines.Contest.tabulation_status_COMPLETE_to_REPORTING
          - calculations.tabulation_rollup
        distinguishing_aspect: "Conserved quantity: contest vote totals and precinct counts. ACCEPT of the Contra Costa report moves the contest to (W 8200, T 5800, reported 15, COMPLETE); the paired VOID must restore exactly (W 6000, T 4000, reported 10, REPORTING) — any drift violates the invariant."
        test_recipe:
          setup:
            - "Standard universe at LIVE; Alameda report p10 W6000/T4000 ACCEPTED (contest REPORTING, totals W6000/T4000, reported_precincts 10); Contra Costa report p5 W2200/T1800 ACCEPTED (contest COMPLETE, totals W8200/T5800, reported_precincts 15)."
          setup_api_calls:
            - *clock0
            - *ev
            - *cty_a
            - *cty_b
            - *cst
            - *lnk_a
            - *lnk_b
            - *cand_w
            - *cand_t
            - *feed
            - *lock
            - *eday
            - *live
            - *cv
            - call: "POST /contests/${cst}/vote-reports"
              payload: { county_id: "${cty_a}", source: "FEED", precincts_reporting: 10, candidate_votes: [{ candidate_id: "${cand_w}", votes: 6000 }, { candidate_id: "${cand_t}", votes: 4000 }], expected_contest_version: "${cv}" }
              as: FeedOperator
              captures: { rep_a: $.data.id }
            - call: "POST /vote-reports/${rep_a}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: TabulationClerk
            - call: "GET /contests/${cst}"
              payload: {}
              as: ElectionOpsAdmin
              captures: { cv_b: $.data.version }
            - call: "POST /contests/${cst}/vote-reports"
              payload: { county_id: "${cty_b}", source: "FEED", precincts_reporting: 5, candidate_votes: [{ candidate_id: "${cand_w}", votes: 2200 }, { candidate_id: "${cand_t}", votes: 1800 }], expected_contest_version: "${cv_b}" }
              as: FeedOperator
              captures: { rep_b: $.data.id }
            - call: "POST /vote-reports/${rep_b}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: TabulationClerk
          trigger:
            - call: "POST /vote-reports/${rep_b}/review-decisions"
              payload: { decision: "VOID" }
              as: TabulationClerk
          assert:
            - "VoteReport.${rep_b}.status == VOIDED and accepted_at is null"
            - "Contest.${cst}.total_votes == 10000 (14000 - 4000 exactly; conserved)"
            - "Contest.${cst}.reported_precincts == 10"
            - "GET /contests/${cst}/tabulation candidate_totals: ${cand_w} == 6000 and ${cand_t} == 4000"
            - "Contest.${cst}.tabulation_status == REPORTING (completion undone by the compensation)"

      - name: publish_then_retract_nets_invoice_to_zero
        grounds:
          - state_machines.RaceCall.PROPOSED_to_PUBLISHED
          - state_machines.RaceCall.PUBLISHED_to_RETRACTED
          - calculations.media_invoice_total
          - entities.ResultDelivery.fields.fee_cents
        distinguishing_aspect: "Conserved quantity: money. A publish (+4999 PREMIUM CALL fee) paired with its retraction (CALL_CREDIT -4999) nets exactly zero on the monthly invoice — total equals the lone VOTE_UPDATE fee 999, not 5998 and not 0."
        test_recipe:
          setup:
            - "Standard universe, contest linked to Alameda only; PREMIUM customer Metro News licensed for CA; Alameda p10 W6000/T4000 ACCEPTED (contest COMPLETE, outstanding 0); posture TABULATION; call on Wanda published then retracted."
          setup_api_calls:
            - *clock0
            - *ev
            - *cty_a
            - *cst
            - *lnk_a
            - *cand_w
            - *cand_t
            - *feed
            - *cust_prem
            - *lock
            - *eday
            - *live
            - *cv
            - call: "POST /contests/${cst}/vote-reports"
              payload: { county_id: "${cty_a}", source: "FEED", precincts_reporting: 10, candidate_votes: [{ candidate_id: "${cand_w}", votes: 6000 }, { candidate_id: "${cand_t}", votes: 4000 }], expected_contest_version: "${cv}" }
              as: FeedOperator
              captures: { rep_a: $.data.id }
            - call: "POST /vote-reports/${rep_a}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: TabulationClerk
            - *tab_posture
            - call: "GET /contests/${cst}"
              payload: {}
              as: DecisionAnalyst
              as_user_id: "analyst-nina"
              captures: { cv_c: $.data.version }
            - call: "POST /contests/${cst}/calls"
              payload: { winner_candidate_id: "${cand_w}", expected_contest_version: "${cv_c}" }
              as: DecisionAnalyst
              as_user_id: "analyst-nina"
              captures: { call_w: $.data.id }
            - call: "POST /calls/${call_w}/decisions"
              payload: { action: "PUBLISH" }
              as: DecisionDeskChief
              as_user_id: "chief-ray"
            - call: "POST /calls/${call_w}/decisions"
              payload: { action: "RETRACT", reason: "bad exit-poll feed integration" }
              as: DecisionDeskChief
              as_user_id: "chief-ray"
          trigger:
            - call: "POST /media-customers/${cust_prem}/invoices"
              payload: { period: "2026-11" }
              as: ElectionOpsAdmin
              captures: { inv: $.data.id }
          assert:
            - "MediaInvoice.${inv}.total_fee_cents == 999 (999 VOTE_UPDATE + 4999 CALL - 4999 CALL_CREDIT; the call pair nets to zero)"
            - "MediaInvoice.${inv}.delivery_count == 3 (STALE rows are still billed)"
            - "the customer's CALL delivery has status STALE and the CALL_CREDIT delivery has fee_cents == -4999"
            - "Contest.${cst}.call_status == UNCALLED"
