# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2144 — Antitrust & Competition Compliance Program
# Breadth probe over §1.1–§1.7; depth corners already claimed by §1.8 appear
# as excluded_because stubs. Logical clock startup default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: business_unit_creation_returns_declared_defaults_and_version_one
        claim_type: Creation
        grounds:
          - entities.BusinessUnit.fields.exposure_points
          - entities.BusinessUnit.fields.posture
          - entities.BusinessUnit.fields.risk_band
          - endpoints[POST /compliance/business-units]
        distinguishing_aspect: "A freshly created BusinessUnit returns 201 with exposure_points 0, review_minutes_consumed 0, document_violation_count 0, risk_band LOW, posture OPEN and version 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /compliance/business-units"
              payload: { name: "Specialty Resins EMEA", market_code: "EU-RESIN", market_share_bps: 1200, interaction_point_count: 4, competitor_overlap_pct: 25, exposure_budget_points: 100, review_minutes_budget: 480 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { bu_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "BusinessUnit.${bu_id}.exposure_points == 0"
            - "BusinessUnit.${bu_id}.manual_exposure_adjustment_points == 0"
            - "BusinessUnit.${bu_id}.review_minutes_consumed == 0"
            - "BusinessUnit.${bu_id}.document_violation_count == 0"
            - "BusinessUnit.${bu_id}.risk_band == LOW"
            - "BusinessUnit.${bu_id}.posture == OPEN"
            - "BusinessUnit.${bu_id}.version == 1"
            - "BusinessUnit.${bu_id}.id is a bare UUID with no type prefix"

      - name: business_unit_optional_budget_fields_apply_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.BusinessUnit.fields.exposure_budget_points
          - entities.BusinessUnit.fields.review_minutes_budget
        distinguishing_aspect: "Omitting exposure_budget_points and review_minutes_budget yields exactly 100 and 480, not null and not zero."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /compliance/business-units"
              payload: { name: "Defaults Unit", market_code: "EU-DEF", market_share_bps: 900, interaction_point_count: 1, competitor_overlap_pct: 0 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { bu_id: $.data.id }
          assert:
            - "BusinessUnit.${bu_id}.exposure_budget_points == 100"
            - "BusinessUnit.${bu_id}.review_minutes_budget == 480"

      - name: business_unit_get_with_unknown_uuid_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_BUSINESS_UNIT_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "GET on a syntactically valid but unknown UUID returns 404 ERR_BUSINESS_UNIT_NOT_FOUND, not 400 and not an empty object."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /compliance/business-units/00000000-0000-4000-8000-000000000000"
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == 'ERR_BUSINESS_UNIT_NOT_FOUND'"

      - name: business_unit_creation_missing_required_market_code_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required market_code returns 400 ERR_INVALID_REQUEST and persists nothing."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /compliance/business-units"
              payload: { name: "No Market Code", market_share_bps: 1200, interaction_point_count: 4, competitor_overlap_pct: 25 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err_id} == 'ERR_INVALID_REQUEST'"
            - "GET /compliance/business-units returns total_count == 0"

      - name: business_unit_market_share_bps_above_ten_thousand_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.BusinessUnit.fields.market_share_bps
          - validations[priority=3]
        distinguishing_aspect: "market_share_bps of 20000 breaches the declared 0..10000 range and returns 400 ERR_INVALID_REQUEST rather than being clamped to 10000."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /compliance/business-units"
              payload: { name: "Impossible Share", market_code: "EU-IMP", market_share_bps: 20000, interaction_point_count: 4, competitor_overlap_pct: 25 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err_id} == 'ERR_INVALID_REQUEST'"

      - name: trade_association_invalid_approval_tier_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.TradeAssociation.fields.approval_tier
          - validations[priority=3]
        distinguishing_aspect: "An approval_tier value outside {TIER_1_LOW, TIER_2_MEDIUM, TIER_3_HIGH} returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /compliance/trade-associations"
              payload: { name: "Bad Tier Council", approval_tier: "TIER_4_EXTREME", competitor_density_pct: 10 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err_id} == 'ERR_INVALID_REQUEST'"

      - name: employee_computed_training_status_starts_none_and_clearance_starts_none
        claim_type: Computed Fields
        grounds:
          - entities.EmployeeProfile.fields.training_status
          - entities.EmployeeProfile.fields.clearance_status
          - calculations.employee_training_status
        distinguishing_aspect: "A brand-new EmployeeProfile reports training_status NONE (not EXPIRED), training_expires_at null, and clearance_status NONE."
        test_recipe:
          setup: ["One BusinessUnit."]
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /compliance/business-units"
              payload: { name: "Specialty Resins EMEA", market_code: "EU-RESIN", market_share_bps: 1200, interaction_point_count: 4, competitor_overlap_pct: 25 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { bu_id: $.data.id }
          trigger:
            - call: "POST /compliance/employees"
              payload: { business_unit_id: "${bu_id}", full_name: "Ruth Adeyemi", email: "ruth.adeyemi@example.com", role_category: "SALES" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { emp_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "EmployeeProfile.${emp_id}.training_status == NONE"
            - "EmployeeProfile.${emp_id}.training_expires_at == null"
            - "EmployeeProfile.${emp_id}.clearance_status == NONE"

      - name: employee_creation_with_unknown_business_unit_returns_business_unit_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=6]
          - errors[ERR_BUSINESS_UNIT_NOT_FOUND]
          - entities.EmployeeProfile.fields.business_unit_id
        distinguishing_aspect: "A body FK that does not resolve returns 404 ERR_BUSINESS_UNIT_NOT_FOUND, proving the FK is validated rather than stored blindly."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /compliance/employees"
              payload: { business_unit_id: "00000000-0000-4000-8000-000000000000", full_name: "Ghost Employee", email: "ghost@example.com", role_category: "OTHER" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == 'ERR_BUSINESS_UNIT_NOT_FOUND'"

      - name: employees_filtered_list_by_business_unit_returns_only_that_units_rows
        claim_type: Listing
        grounds:
          - endpoints[GET /compliance/employees]
          - entities.EmployeeProfile.fields.business_unit_id
        distinguishing_aspect: "GET /compliance/employees?business_unit_id=X returns exactly the two employees of X and none of unit Y's, with total_count 2 and has_more false."
        test_recipe:
          setup: ["Two BusinessUnits; unit X has two employees, unit Y has one."]
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /compliance/business-units"
              payload: { name: "Unit X", market_code: "EU-X", market_share_bps: 1200, interaction_point_count: 4, competitor_overlap_pct: 25 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { bux_id: $.data.id }
            - call: "POST /compliance/business-units"
              payload: { name: "Unit Y", market_code: "EU-Y", market_share_bps: 1200, interaction_point_count: 4, competitor_overlap_pct: 25 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { buy_id: $.data.id }
            - call: "POST /compliance/employees"
              payload: { business_unit_id: "${bux_id}", full_name: "X One", email: "x1@example.com", role_category: "SALES" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { x1_id: $.data.id }
            - call: "POST /compliance/employees"
              payload: { business_unit_id: "${bux_id}", full_name: "X Two", email: "x2@example.com", role_category: "LEGAL" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { x2_id: $.data.id }
            - call: "POST /compliance/employees"
              payload: { business_unit_id: "${buy_id}", full_name: "Y One", email: "y1@example.com", role_category: "PRICING" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { y1_id: $.data.id }
          trigger:
            - call: "GET /compliance/employees"
              as: AntitrustCounsel
              as_user_id: "counsel-1"
          assert:
            - "GET /compliance/employees?business_unit_id=${bux_id} returns total_count == 2 and has_more == false"
            - "that response contains ${x1_id} and ${x2_id} and does not contain ${y1_id}"
            - "GET /compliance/employees?business_unit_id=${buy_id}&limit=1&offset=0 returns total_count == 1 and has_more == false"

      - name: risk_assessment_retrieval_exposes_every_index_component
        claim_type: Retrieval
        grounds:
          - entities.RiskAssessment.fields.share_component
          - entities.RiskAssessment.fields.overlap_component
          - endpoints[GET /compliance/risk-assessments/{id}]
        distinguishing_aspect: "GET on a stored RiskAssessment returns share_component 25, interaction_component 12, overlap_component 8.00 and market_risk_index 45.00 — the components are persisted, not recomputed on read."
        test_recipe:
          setup: ["One BusinessUnit with market_share_bps 1500, interaction_point_count 4, competitor_overlap_pct 40 and one ACTIVE BASELINE assessment."]
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /compliance/business-units"
              payload: { name: "Component Unit", market_code: "EU-CMP", market_share_bps: 1500, interaction_point_count: 4, competitor_overlap_pct: 40 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { bu_id: $.data.id }
            - call: "GET /compliance/business-units/${bu_id}"
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { bu_v1: $.data.version }
            - call: "POST /compliance/risk-assessments"
              payload: { business_unit_id: "${bu_id}", variant: "BASELINE", expected_business_unit_version: "${bu_v1}" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { ra_id: $.data.id }
          trigger:
            - call: "GET /compliance/risk-assessments/${ra_id}"
              as: AntitrustCounsel
              as_user_id: "counsel-1"
          assert:
            - "RiskAssessment.${ra_id}.share_component == 25"
            - "RiskAssessment.${ra_id}.interaction_component == 12"
            - "RiskAssessment.${ra_id}.overlap_component == 8.00"
            - "RiskAssessment.${ra_id}.market_risk_index == 45.00"
            - "RiskAssessment.${ra_id}.risk_band == MODERATE"
            - "RiskAssessment.${ra_id}.status == ACTIVE"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: competitor_contact_initial_state_is_logged
        claim_type: Initial State
        grounds:
          - state_machines.CompetitorContact
          - entities.CompetitorContact.fields.status
        distinguishing_aspect: "A newly logged contact is LOGGED with review_opened_by_user_id null, remediation_instructions null and remediation_response null."
        test_recipe:
          setup: ["One BusinessUnit and one LEGAL-role employee."]
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /compliance/business-units"
              payload: { name: "Specialty Resins EMEA", market_code: "EU-RESIN", market_share_bps: 1200, interaction_point_count: 4, competitor_overlap_pct: 25 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { bu_id: $.data.id }
            - call: "POST /compliance/employees"
              payload: { business_unit_id: "${bu_id}", full_name: "Ines Vogel", email: "ines.vogel@example.com", role_category: "LEGAL" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /compliance/competitor-contacts"
              payload: { business_unit_id: "${bu_id}", employee_id: "${emp_id}", competitor_name: "Rivex SA", contact_channel: "EMAIL", topic_tags: [], pricing_topic: false, occurred_at: "2026-07-20T10:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { c_id: $.data.id }
          assert:
            - "CompetitorContact.${c_id}.status == LOGGED"
            - "CompetitorContact.${c_id}.review_opened_by_user_id == null"
            - "CompetitorContact.${c_id}.exposure_points_charged == 5.00"
            - "CompetitorContact.${c_id}.band_multiplier_applied == 1.0"
            - "BusinessUnit.${bu_id}.exposure_points == 5.00"

      - name: competitor_contact_clearance_from_logged_state_is_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.CompetitorContact.UNDER_REVIEW_to_CLEARED
          - errors[ERR_INVALID_STATE]
          - validations[priority=10]
        distinguishing_aspect: "Clearing a contact that is still LOGGED (no review opened) returns 409 ERR_INVALID_STATE and leaves exposure_points_charged untouched at 5.00."
        test_recipe:
          setup: ["One BusinessUnit, one LEGAL employee and one contact in LOGGED."]
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /compliance/business-units"
              payload: { name: "Specialty Resins EMEA", market_code: "EU-RESIN", market_share_bps: 1200, interaction_point_count: 4, competitor_overlap_pct: 25 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { bu_id: $.data.id }
            - call: "POST /compliance/employees"
              payload: { business_unit_id: "${bu_id}", full_name: "Ines Vogel", email: "ines.vogel@example.com", role_category: "LEGAL" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { emp_id: $.data.id }
            - call: "POST /compliance/competitor-contacts"
              payload: { business_unit_id: "${bu_id}", employee_id: "${emp_id}", competitor_name: "Rivex SA", contact_channel: "EMAIL", topic_tags: [], pricing_topic: false, occurred_at: "2026-07-20T10:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /compliance/competitor-contacts/${c_id}/clearance"
              payload: { notes: "Nothing to see here" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err_id} == 'ERR_INVALID_STATE'"
            - "CompetitorContact.${c_id}.status == LOGGED"
            - "CompetitorContact.${c_id}.exposure_points_charged == 5.00"
            - "BusinessUnit.${bu_id}.exposure_points == 5.00"

      - name: competitor_contact_second_escalation_is_rejected_as_idempotency_guard
        claim_type: Idempotency
        grounds:
          - state_machines.CompetitorContact.UNDER_REVIEW_to_ESCALATED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Escalating an already ESCALATED contact returns 409 ERR_INVALID_STATE and does NOT apply the surcharge a second time — exposure_points_charged stays at 10.00, not 20.00."
        test_recipe:
          setup: ["One BusinessUnit, one LEGAL employee, one contact already ESCALATED with exposure_points_charged 10.00."]
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /compliance/business-units"
              payload: { name: "Specialty Resins EMEA", market_code: "EU-RESIN", market_share_bps: 1200, interaction_point_count: 4, competitor_overlap_pct: 25 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { bu_id: $.data.id }
            - call: "POST /compliance/employees"
              payload: { business_unit_id: "${bu_id}", full_name: "Ines Vogel", email: "ines.vogel@example.com", role_category: "LEGAL" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { emp_id: $.data.id }
            - call: "POST /compliance/competitor-contacts"
              payload: { business_unit_id: "${bu_id}", employee_id: "${emp_id}", competitor_name: "Rivex SA", contact_channel: "EMAIL", topic_tags: [], pricing_topic: false, occurred_at: "2026-07-20T10:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { c_id: $.data.id }
            - call: "POST /compliance/competitor-contacts/${c_id}/review-opening"
              payload: {}
              as: AntitrustCounsel
              as_user_id: "counsel-1"
            - call: "POST /compliance/competitor-contacts/${c_id}/escalation"
              payload: { reason: "Email thread shows a discount coordination attempt" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
          trigger:
            - call: "POST /compliance/competitor-contacts/${c_id}/escalation"
              payload: { reason: "Escalating again by mistake" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err_id} == 'ERR_INVALID_STATE'"
            - "CompetitorContact.${c_id}.exposure_points_charged == 10.00"
            - "BusinessUnit.${bu_id}.exposure_points == 10.00"

      - name: transaction_filing_from_draft_is_rejected_before_any_analysis
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Transaction.ANALYZED_to_FILED
          - errors[ERR_TRANSACTION_NOT_ANALYZED]
          - validations[priority=13]
        distinguishing_aspect: "Filing a Transaction still in DRAFT returns 409 ERR_TRANSACTION_NOT_ANALYZED; filed_at and waiting_period_end stay null."
        test_recipe:
          setup: ["One BusinessUnit and one DRAFT Transaction with no HsrAnalysis at all."]
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /compliance/business-units"
              payload: { name: "Specialty Resins EMEA", market_code: "EU-RESIN", market_share_bps: 1200, interaction_point_count: 4, competitor_overlap_pct: 25 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { bu_id: $.data.id }
            - call: "POST /compliance/transactions"
              payload: { business_unit_id: "${bu_id}", target_name: "Unanalysed BV", deal_value_cents: 20000000000, assumed_liabilities_cents: 0, market_valuation_cents: 20000000000, acquirer_total_assets_cents: 50000000000, target_total_assets_cents: 5000000000, signed_at: "2026-06-01T00:00:00Z", exemption_code: "NONE" }
              as: BusinessLead
              as_user_id: "${bu_id}"
              captures: { tx_id: $.data.id }
          trigger:
            - call: "POST /compliance/transactions/${tx_id}/filing"
              payload: {}
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err_id} == 'ERR_TRANSACTION_NOT_ANALYZED'"
            - "Transaction.${tx_id}.status == DRAFT"
            - "Transaction.${tx_id}.filed_at == null"
            - "Transaction.${tx_id}.waiting_period_end == null"

      - name: readiness_drill_start_before_window_start_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ReadinessDrill.SCHEDULED_to_IN_PROGRESS
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Starting a drill while the logical clock is still before window_start returns 409 ERR_INVALID_STATE; the drill remains SCHEDULED."
        test_recipe:
          setup: ["One Site with capacity 1 and one SCHEDULED drill whose window opens on 2026-09-01T08:00:00Z; the clock stands at 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
