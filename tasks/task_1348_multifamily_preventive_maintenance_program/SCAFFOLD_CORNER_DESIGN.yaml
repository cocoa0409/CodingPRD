  # ===========================================================================
  # Section: calculations — input-set filtering and constants
  # ===========================================================================
  - section: calculations
    instances:
      - name: forecast_excludes_decommissioned_assets
        claim_type: input_set_filtering
        grounds: [calculations.capital_replacement_forecast]
        distinguishing_aspect: "The forecast input set excludes DECOMMISSIONED assets: after decommissioning the only asset, a 5-year AGE_BASED snapshot returns all-zero per_year_cents and asset_count_projected == 0."
        test_recipe:
          setup: ["Property with one asset (life 84 months from 2020-08-01), then asset decommissioned"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { property_code: "CA-P1", display_name: "Calc P1", notice_lead_hours: 24, default_labor_rate_cents_per_hour: 6000 }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings"
              payload: { building_label: "A", floors: 1 }
              as: PropertyManager
              captures: { b_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings/${b_id}/units"
              payload: { unit_number: "101", occupancy_status: "VACANT" }
              as: PropertyManager
              captures: { u_id: $.data.id }
            - call: "POST /properties/${p_id}/units/${u_id}/assets"
              payload: { component_type: "HVAC", installed_on: "2020-08-01T00:00:00Z", warranty_months: 12, expected_life_months: 84, replacement_cost_cents: 500000 }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /properties/${p_id}/assets/${a_id}/decommission"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /properties/${p_id}/capital-forecasts"
              payload: { horizon_years: 5, variant: "AGE_BASED" }
              as: PropertyManager
              captures: { per_year: $.data.per_year_cents, total: $.data.total_projected_cents, count: $.data.asset_count_projected }
          assert:
            - "per_year_cents == [0, 0, 0, 0, 0] (decommissioned asset excluded)"
            - "asset_count_projected == 0"

      - name: vacant_unit_due_window_one_day
        claim_type: constants_applied
        grounds: [calculations.next_due_date]
        distinguishing_aspect: "vacant_unit_relaxation variant: for a VACANT unit the DUE window opens at next_due - 1 day, not 7; an asset whose last_completed yields next_due = clock + 3 days stays COMPLIANT in a vacant unit but would be DUE in an occupied one."
        test_recipe:
          setup: ["Two properties each with one unit (one VACANT, one OCCUPIED), one asset each installed 2026-07-25 with 7-day-frequency template; clock 2026-08-01 (next_due = 2026-08-01T00:00 = installed+7d; 3-day-ahead probe via clock set to 2026-07-29 -> next_due in 3 days)"]
