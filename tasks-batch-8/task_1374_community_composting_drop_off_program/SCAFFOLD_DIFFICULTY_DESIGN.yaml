        distinguishing_aspect: |
          Different entity pair DistributionAllocation → CompostDistribution:
          REQUESTED → DISTRIBUTED requires the parent distribution OPEN; once
          cancelled (which cascades the allocation to CANCELLED and refunds
          credits), the distribute attempt fails ERR_INVALID_STATE. Distinct
          pair from Site→Agreement.
