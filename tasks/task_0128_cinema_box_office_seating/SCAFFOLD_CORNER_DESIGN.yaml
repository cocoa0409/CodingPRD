# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Cinema Box Office & Seating — breadth walk of the claim-extraction-guide
# against SCAFFOLD.yaml §1.1–§1.7. §1.8 is the depth probe; this is breadth.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_auditorium_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Auditorium, "endpoints[POST /auditoriums]"]
        distinguishing_aspect: "POST /auditoriums with name+seat_count returns 201; status defaults ACTIVE; version 1; turnaround_minutes defaults 20."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /auditoriums"
              payload: { name: "Hall 1", seat_count: 4 }
              as: CinemaManager
              captures: { aud_id: "$.data.id" }
          assert:
            - "HTTP 201; data.name == 'Hall 1'; data.seat_count == 4; data.status == ACTIVE; data.turnaround_minutes == 20; data.version == 1"

      - name: get_auditorium_not_found
        claim_type: Not Found
        grounds: [entities.Auditorium, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /auditoriums/{unknown-uuid} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /auditoriums/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CinemaManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"

      - name: create_film_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.Film, "validations[priority=19]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /films missing required runtime_minutes returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["A distributor exists"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Acme Films" }
              as: CinemaManager
              captures: { dist_id: "$.data.id" }
          trigger:
            - call: "POST /films"
              payload: { title: "F", distributor_id: "${dist_id}", release_date: "2026-06-01T00:00:00.000Z", split_schedule: [ { week_index: 0, distributor_pct: 0.70 } ] }
              as: CinemaManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422; error_id == ERR_INVALID_REQUEST"

      - name: distributor_default_minimum_guarantee_zero
        claim_type: Defaults
        grounds: [entities.Distributor.fields.minimum_guarantee_cents, "endpoints[POST /distributors]"]
        distinguishing_aspect: "Omitting minimum_guarantee_cents on POST /distributors applies default 0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /distributors"
              payload: { name: "Acme Films" }
              as: CinemaManager
              captures: { dist_id: "$.data.id" }
          assert:
            - "HTTP 201; data.minimum_guarantee_cents == 0"

      - name: showtime_computed_ends_at_from_runtime_and_pad
        claim_type: Computed Fields
        grounds: [entities.Showtime.fields.ends_at, calculations.ticket_price_provisional]
        distinguishing_aspect: "Showtime.ends_at == starts_at + runtime_minutes(90) + TRAILER_PAD_MINUTES(15); 20:00 -> 21:45; input ends_at (if any) ignored."
        test_recipe:
          setup: ["Distributor+film (runtime 90), auditorium"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Acme Films", minimum_guarantee_cents: 0 }
              as: CinemaManager
              captures: { dist_id: "$.data.id" }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 90, distributor_id: "${dist_id}", release_date: "2026-06-01T00:00:00.000Z", split_schedule: [ { week_index: 0, distributor_pct: 0.70 } ] }
              as: CinemaManager
              captures: { film_id: "$.data.id" }
            - call: "POST /auditoriums"
              payload: { name: "Hall 1", seat_count: 4, turnaround_minutes: 20 }
              as: CinemaManager
              captures: { aud_id: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T09:00:00.000Z" }
              as: CinemaManager
          trigger:
            - call: "POST /auditoriums/${aud_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-10T20:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 1000 }
              as: CinemaManager
              captures: { st_id: "$.data.id" }
          assert:
            - "data.ends_at == '2026-06-10T21:45:00.000Z'"

      - name: showtime_creation_materializes_seat_map
        claim_type: Creation
        grounds: [entities.Seat, "endpoints[POST /auditoriums/{id}/showtimes]", "endpoints[GET /showtimes/{id}/seats]"]
        distinguishing_aspect: "Scheduling a showtime in a 4-seat auditorium creates exactly 4 Seat rows, all occupancy FREE."
        test_recipe:
          setup: ["Distributor+film, 4-seat auditorium, clock set"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Acme Films", minimum_guarantee_cents: 0 }
              as: CinemaManager
              captures: { dist_id: "$.data.id" }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 90, distributor_id: "${dist_id}", release_date: "2026-06-01T00:00:00.000Z", split_schedule: [ { week_index: 0, distributor_pct: 0.70 } ] }
              as: CinemaManager
              captures: { film_id: "$.data.id" }
            - call: "POST /auditoriums"
              payload: { name: "Hall 1", seat_count: 4, turnaround_minutes: 20 }
              as: CinemaManager
              captures: { aud_id: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T09:00:00.000Z" }
              as: CinemaManager
            - call: "POST /auditoriums/${aud_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-10T20:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 1000 }
              as: CinemaManager
              captures: { st_id: "$.data.id" }
          trigger:
            - call: "GET /showtimes/${st_id}/seats"
              payload: {}
              as: CinemaManager
          assert:
            - "response_type array; total_count == 4; every seat.occupancy == FREE"

      - name: list_combos_pagination_envelope
        claim_type: Listing
        grounds: [entities.ConcessionCombo, "endpoints[GET /combos]"]
        distinguishing_aspect: "GET /combos returns paginated array with total_count and has_more in meta; default limit 10."
        test_recipe:
          setup: ["Two combos created"]
          setup_api_calls:
            - call: "POST /combos"
              payload: { name: "C1", price_cents: 1000 }
              as: CinemaManager
            - call: "POST /combos"
              payload: { name: "C2", price_cents: 1200 }
              as: CinemaManager
          trigger:
            - call: "GET /combos"
              payload: {}
              as: BoxOfficeAgent
          assert:
            - "response_type == array; total_count == 2; has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: open_showtime_from_already_on_sale_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Showtime.SCHEDULED_to_ON_SALE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Opening an already-ON_SALE showtime returns ERR_INVALID_STATE 409 (from-state must be SCHEDULED)."
        test_recipe:
          setup: ["An ON_SALE showtime"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Acme Films", minimum_guarantee_cents: 0 }
              as: CinemaManager
              captures: { dist_id: "$.data.id" }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 90, distributor_id: "${dist_id}", release_date: "2026-06-01T00:00:00.000Z", split_schedule: [ { week_index: 0, distributor_pct: 0.70 } ] }
              as: CinemaManager
              captures: { film_id: "$.data.id" }
            - call: "POST /auditoriums"
              payload: { name: "Hall 1", seat_count: 4, turnaround_minutes: 20 }
              as: CinemaManager
              captures: { aud_id: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T09:00:00.000Z" }
              as: CinemaManager
            - call: "POST /auditoriums/${aud_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-10T20:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 1000 }
              as: CinemaManager
              captures: { st_id: "$.data.id" }
            - call: "POST /showtimes/${st_id}/open"
              payload: {}
              as: CinemaManager
          trigger:
            - call: "POST /showtimes/${st_id}/open"
              payload: {}
              as: CinemaManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE"

      - name: cancel_already_cancelled_showtime_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Showtime.SCHEDULED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED showtime (terminal) rejects a second cancel with ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["A SCHEDULED showtime cancelled once"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Acme Films", minimum_guarantee_cents: 0 }
              as: CinemaManager
              captures: { dist_id: "$.data.id" }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 90, distributor_id: "${dist_id}", release_date: "2026-06-01T00:00:00.000Z", split_schedule: [ { week_index: 0, distributor_pct: 0.70 } ] }
              as: CinemaManager
              captures: { film_id: "$.data.id" }
            - call: "POST /auditoriums"
              payload: { name: "Hall 1", seat_count: 4, turnaround_minutes: 20 }
              as: CinemaManager
              captures: { aud_id: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T09:00:00.000Z" }
              as: CinemaManager
            - call: "POST /auditoriums/${aud_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-10T20:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 1000 }
              as: CinemaManager
              captures: { st_id: "$.data.id", st_v: "$.data.version" }
            - call: "POST /showtimes/${st_id}/cancel"
              payload: { expected_showtime_version: "${st_v}" }
              as: CinemaManager
              captures: { st_v2: "$.data.version" }
          trigger:
            - call: "POST /showtimes/${st_id}/cancel"
              payload: { expected_showtime_version: "${st_v2}" }
              as: CinemaManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE"

      - name: newly_created_showtime_initial_state_scheduled
        claim_type: Initial State
        grounds: [state_machines.Showtime.initial_state, entities.Showtime.fields.status]
        distinguishing_aspect: "A freshly scheduled showtime starts in SCHEDULED."
        test_recipe:
          setup: ["Distributor+film+auditorium, clock set"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Acme Films", minimum_guarantee_cents: 0 }
              as: CinemaManager
              captures: { dist_id: "$.data.id" }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 90, distributor_id: "${dist_id}", release_date: "2026-06-01T00:00:00.000Z", split_schedule: [ { week_index: 0, distributor_pct: 0.70 } ] }
              as: CinemaManager
              captures: { film_id: "$.data.id" }
            - call: "POST /auditoriums"
              payload: { name: "Hall 1", seat_count: 4, turnaround_minutes: 20 }
              as: CinemaManager
              captures: { aud_id: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T09:00:00.000Z" }
              as: CinemaManager
          trigger:
            - call: "POST /auditoriums/${aud_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-10T20:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 1000 }
              as: CinemaManager
          assert:
            - "data.status == SCHEDULED"

      - name: open_first_showtime_bubbles_film_to_running
        claim_type: Side Effect Execution
        grounds: [state_machines.Film.BOOKING_to_RUNNING, state_machines.Showtime.SCHEDULED_to_ON_SALE]
        distinguishing_aspect: "Opening the first showtime of a BOOKING film bubbles Film.status to RUNNING."
        test_recipe:
          setup: ["A BOOKING film with one SCHEDULED showtime"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Acme Films", minimum_guarantee_cents: 0 }
              as: CinemaManager
              captures: { dist_id: "$.data.id" }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 90, distributor_id: "${dist_id}", release_date: "2026-06-01T00:00:00.000Z", split_schedule: [ { week_index: 0, distributor_pct: 0.70 } ] }
              as: CinemaManager
              captures: { film_id: "$.data.id" }
            - call: "POST /auditoriums"
              payload: { name: "Hall 1", seat_count: 4, turnaround_minutes: 20 }
              as: CinemaManager
              captures: { aud_id: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T09:00:00.000Z" }
              as: CinemaManager
            - call: "POST /auditoriums/${aud_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-10T20:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 1000 }
              as: CinemaManager
              captures: { st_id: "$.data.id" }
          trigger:
            - call: "POST /showtimes/${st_id}/open"
              payload: {}
              as: CinemaManager
          assert:
            - "GET /films/${film_id}: status == RUNNING"

      - name: held_order_expires_after_ttl_releases_seats
        claim_type: Side Effect Execution
        grounds: [state_machines.Order.HELD_to_EXPIRED, entities.Order.fields.hold_expires_at, entities.Seat.fields.occupancy]
        distinguishing_aspect: "Advancing the clock past hold_expires_at expires a HELD order, voids its tickets, and frees its seats."
        test_recipe:
          setup: ["An ON_SALE showtime with one HELD order created at clock 2026-06-02T09:00 (TTL 15m)"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Acme Films", minimum_guarantee_cents: 0 }
              as: CinemaManager
              captures: { dist_id: "$.data.id" }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 90, distributor_id: "${dist_id}", release_date: "2026-06-01T00:00:00.000Z", split_schedule: [ { week_index: 0, distributor_pct: 0.70 } ] }
              as: CinemaManager
              captures: { film_id: "$.data.id" }
            - call: "POST /auditoriums"
              payload: { name: "Hall 1", seat_count: 4, turnaround_minutes: 20 }
              as: CinemaManager
              captures: { aud_id: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T09:00:00.000Z" }
              as: CinemaManager
            - call: "POST /auditoriums/${aud_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-10T20:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 1000 }
              as: CinemaManager
              captures: { st_id: "$.data.id" }
            - call: "POST /showtimes/${st_id}/open"
              payload: {}
              as: CinemaManager
              captures: { st_v: "$.data.version" }
            - call: "GET /showtimes/${st_id}/seats"
              payload: {}
              as: CinemaManager
              captures: { seat0: "$.data[0].id" }
            - call: "POST /members"
              payload: { email: "m@x.com", full_name: "M" }
              as: CinemaManager
              captures: { m_id: "$.data.id" }
            - call: "POST /showtimes/${st_id}/orders"
              payload: { member_id: "${m_id}", seat_ids: ["${seat0}"], expected_showtime_version: "${st_v}" }
              as: BoxOfficeAgent
              captures: { ord_id: "$.data.id" }
          trigger:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T09:30:00.000Z" }
              as: CinemaManager
          assert:
            - "GET /orders/${ord_id}: status == EXPIRED"
            - "GET /showtimes/${st_id}/seats: seat ${seat0}.occupancy == FREE"

      - name: cancel_held_order_releases_seats
        claim_type: Valid Transition
        grounds: [state_machines.Order.HELD_to_CANCELLED, entities.Seat.fields.occupancy]
        distinguishing_aspect: "POST /orders/{id}/cancel on a HELD order sets CANCELLED, voids tickets, frees seats."
        test_recipe:
          setup: ["An ON_SALE showtime with one HELD order on one seat"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Acme Films", minimum_guarantee_cents: 0 }
              as: CinemaManager
              captures: { dist_id: "$.data.id" }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 90, distributor_id: "${dist_id}", release_date: "2026-06-01T00:00:00.000Z", split_schedule: [ { week_index: 0, distributor_pct: 0.70 } ] }
              as: CinemaManager
              captures: { film_id: "$.data.id" }
            - call: "POST /auditoriums"
              payload: { name: "Hall 1", seat_count: 4, turnaround_minutes: 20 }
              as: CinemaManager
              captures: { aud_id: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T09:00:00.000Z" }
              as: CinemaManager
            - call: "POST /auditoriums/${aud_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-10T20:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 1000 }
              as: CinemaManager
              captures: { st_id: "$.data.id" }
            - call: "POST /showtimes/${st_id}/open"
              payload: {}
              as: CinemaManager
              captures: { st_v: "$.data.version" }
            - call: "GET /showtimes/${st_id}/seats"
              payload: {}
              as: CinemaManager
              captures: { seat0: "$.data[0].id" }
            - call: "POST /members"
              payload: { email: "m@x.com", full_name: "M" }
              as: CinemaManager
              captures: { m_id: "$.data.id" }
            - call: "POST /showtimes/${st_id}/orders"
              payload: { member_id: "${m_id}", seat_ids: ["${seat0}"], expected_showtime_version: "${st_v}" }
              as: BoxOfficeAgent
              captures: { ord_id: "$.data.id" }
          trigger:
            - call: "POST /orders/${ord_id}/cancel"
              payload: {}
              as: BoxOfficeAgent
          assert:
            - "data.status == CANCELLED"
            - "GET /showtimes/${st_id}/seats: seat ${seat0}.occupancy == FREE"

      - name: close_creates_box_office_settlement
        claim_type: Side Effect Execution
        grounds: [state_machines.Showtime.ON_SALE_to_CLOSED, entities.Settlement, calculations.distributor_sliding_split]
        distinguishing_aspect: "Closing a finished ON_SALE showtime creates exactly one Settlement; gross_receipts_cents snapshots sold receipts."
        test_recipe:
          setup: ["An ON_SALE showtime with one paid 2-seat order (gross 2000), clock advanced past ends_at"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Acme Films", minimum_guarantee_cents: 0 }
              as: CinemaManager
              captures: { dist_id: "$.data.id" }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 90, distributor_id: "${dist_id}", release_date: "2026-06-01T00:00:00.000Z", split_schedule: [ { week_index: 0, distributor_pct: 0.70 } ] }
              as: CinemaManager
              captures: { film_id: "$.data.id" }
            - call: "POST /auditoriums"
              payload: { name: "Hall 1", seat_count: 4, turnaround_minutes: 20 }
              as: CinemaManager
              captures: { aud_id: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T09:00:00.000Z" }
              as: CinemaManager
            - call: "POST /auditoriums/${aud_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-05T13:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 1000 }
              as: CinemaManager
              captures: { st_id: "$.data.id" }
            - call: "POST /showtimes/${st_id}/open"
              payload: {}
              as: CinemaManager
              captures: { st_v: "$.data.version" }
            - call: "GET /showtimes/${st_id}/seats"
              payload: {}
              as: CinemaManager
              captures: { sa: "$.data[0].id", sb: "$.data[1].id" }
            - call: "POST /members"
              payload: { email: "m@x.com", full_name: "M" }
              as: CinemaManager
              captures: { m_id: "$.data.id" }
            - call: "POST /showtimes/${st_id}/orders"
              payload: { member_id: "${m_id}", seat_ids: ["${sa}", "${sb}"], expected_showtime_version: "${st_v}" }
              as: BoxOfficeAgent
              captures: { ord_id: "$.data.id" }
            - call: "POST /orders/${ord_id}/pay"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T15:00:00.000Z" }
              as: CinemaManager
          trigger:
            - call: "POST /showtimes/${st_id}/close"
              payload: {}
              as: CinemaManager
          assert:
            - "data.status == CLOSED"
            - "GET /showtimes/${st_id}/settlement: total_count == 1; settlement.gross_receipts_cents == 2000; applied_distributor_pct == 0.70; distributor_share_cents == 1400"

      - name: close_before_ends_at_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Showtime.ON_SALE_to_CLOSED, "validations[priority=18]", "errors[ERR_SHOWTIME_NOT_OVER]"]
        distinguishing_aspect: "Closing a showtime before current_utc reaches ends_at returns ERR_SHOWTIME_NOT_OVER 409."
        test_recipe:
          setup: ["An ON_SALE showtime starting in the future; clock still before ends_at"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Acme Films", minimum_guarantee_cents: 0 }
              as: CinemaManager
              captures: { dist_id: "$.data.id" }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 90, distributor_id: "${dist_id}", release_date: "2026-06-01T00:00:00.000Z", split_schedule: [ { week_index: 0, distributor_pct: 0.70 } ] }
              as: CinemaManager
              captures: { film_id: "$.data.id" }
            - call: "POST /auditoriums"
              payload: { name: "Hall 1", seat_count: 4, turnaround_minutes: 20 }
              as: CinemaManager
              captures: { aud_id: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T09:00:00.000Z" }
              as: CinemaManager
            - call: "POST /auditoriums/${aud_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-10T20:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 1000 }
              as: CinemaManager
              captures: { st_id: "$.data.id" }
            - call: "POST /showtimes/${st_id}/open"
              payload: {}
