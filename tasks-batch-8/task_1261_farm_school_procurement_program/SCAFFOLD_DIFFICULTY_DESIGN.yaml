            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "LIABILITY_INSURANCE", issuer: "InsCo", coverage_cents: 600000, effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/farms/${farm}/approve", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/offerings", payload: { farm_id: "${farm}", program_year_id: "${yr}", product_id: "${prod}", price_cents_per_unit: 250, max_weekly_quantity: 500, harvest_start_week: 4, harvest_end_week: 12 }, as: FarmManager, as_user_id: "${farm}", captures: { off: $.data.id } }
            - { call: "POST /f2s/offerings/${off}/submit", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/offerings/${off}/verify", payload: {}, as: DistrictProgramAdmin }
