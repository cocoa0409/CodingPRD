      - OccupancyMeasurement.${m_strict}.variant == SNAPSHOT_STRICT
      - OccupancyMeasurement.${m_strict}.total_gla_sqft == 300000
      - OccupancyMeasurement.${m_strict}.occupied_gla_sqft == 225000
      - OccupancyMeasurement.${m_strict}.gla_occupancy_pct == 75.00
      - OccupancyMeasurement.${m_strict}.counted_lease_count == 4
      - OccupancyMeasurement.${m_strict}.excluded_lease_count == 1
      - OccupancyMeasurement.${m_strict}.open_store_count == 2
      - OccupancyMeasurement.${m_strict}.open_anchor_count == 2
      - OccupancyMeasurement.${m_grace}.variant == TRAILING_GRACE
      - OccupancyMeasurement.${m_grace}.occupied_gla_sqft == 255000
      - OccupancyMeasurement.${m_grace}.gla_occupancy_pct == 85.00
      - OccupancyMeasurement.${m_grace}.counted_lease_count == 5
      - OccupancyMeasurement.${m_grace}.excluded_lease_count == 0
      - OccupancyMeasurement.${m_grace}.open_store_count == 3
      - OccupancyMeasurement.${m_grace}.open_anchor_count == 2
      - OccupancyMeasurement.${m_grace}.gla_occupancy_pct - OccupancyMeasurement.${m_strict}.gla_occupancy_pct == 10.00
      - ShoppingCenter.${ctr}.open_occupancy_pct == 75.00
