        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role is rejected 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/customers", payload: { name: "X", billing_email: "x@farm.test", rate_per_acre_cents: 100, credit_limit_cents: 1000 }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "trigger error == ERR_UNAUTHENTICATED (http 401) — no role header present"

      - name: approve_prescription_with_buffer_violation_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_BUFFER_VIOLATION]", state_machines.Prescription.DRAFT_to_APPROVED]
        distinguishing_aspect: "A product whose required_buffer_ft (200) exceeds the field's buffer_clearance_ft (100) blocks prescription approval."
        test_recipe:
          setup: ["customer, field clearance 100, product requiring 200ft buffer, DRAFT prescription"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Solo Farm", billing_email: "s@farm.test", rate_per_acre_cents: 900, credit_limit_cents: 500000 }, as: CoopAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /api/fields", payload: { customer_id: "${c_id}", label: "Tight Field", crop: "CORN", acres: 100, buffer_clearance_ft: 100 }, as: Grower, as_user_id: "${c_id}", captures: { f_id: $.data.id } }
