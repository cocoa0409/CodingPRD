# =============================================================================
# PRD Benchmark Seed Tables
# Scenario: Net Lease Investment Acquisition & Due Diligence (net lease REIT
# acquisitions)
# =============================================================================

scenario: |
  Net Lease Investment Acquisition & Due Diligence (net lease REIT acquisitions):
  deal sourcing & cap-rate underwriting, tenant credit analysis & lease
  term/rollover risk, purchase agreement & due diligence period milestones,
  title/survey review & exception resolution, environmental & property condition
  assessment, estoppel/SNDA collection from tenant & lender, financing
  contingency & loan assumption, closing prorations & post-closing true-up.

domain_name: net-lease-acquisition
api_prefix: /acquisition-deals

complexity_profile:
  primary_archetype: compliance_audit        # regulatory/audit-driven acquisition pipeline with milestone gates
  secondary_archetype: multi_party_negotiation  # estoppel/SNDA sign-off across buyer, seller, tenant, lender
  complexity_layers:
    - cascading_side_effects       # exception cure → milestone recheck → deal posture recompute → closing statement re-issue
    - dual_variant_calculation     # provisional vs final closing prorations; cap-rate vs cash-on-cash underwriting
    - version_pinning_on_approval  # underwriting model version pinned to PSA execution; stale model blocks closing
    - scheduled_deferred_actions   # DD period expiry, financing contingency expiry driven by logical clock
    - optimistic_concurrency       # OCC on Deal.version and PurchaseAgreement.version

  entity_topology: hybrid            # deal → property/PSA/DD tree with cross-cutting tenant/lender references
  state_machine_shape: compound      # Deal posture is a derived aggregate over milestones, exceptions, estoppels, financing
  relationship_patterns:
    - one_to_many
    - cross_aggregate                # Lease references Tenant; EstoppelCertificate references Tenant + Lease + Deal
    - self_referential               # TitleException.cured_by_exception_id (a cured exception may be superseded by a revised exception)
  role_model: segregation_of_duties  # AcquisitionsAnalyst underwrites; UnderwritingCommittee approves; separate DueDiligenceOfficer / EscrowOfficer / AssetManager
  consistency_model: immediate       # all cascades atomic within a single request

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Deal
    parent: null
    common_fields: true
    fields:
      - { name: deal_name, type: string, source: input, description: "Human-readable deal name" }
      - { name: deal_type, type: enum, source: input, description: "SINGLE_TENANT | MULTI_TENANT | SALE_LEASEBACK | PORTFOLIO" }
      - { name: sourcing_channel, type: enum, source: input, default: "BROKER", description: "BROKER | OFF_MARKET | AUCTION | DIRECT" }
      - { name: target_close_date, type: datetime, source: input, description: "Target closing date (ISO8601, must be >= 30 days after deal creation date)" }
      - { name: earnest_money_cents, type: integer, source: input, description: "Earnest money deposit in cents; must be >= 1% of purchase_price_cents at PSA execution" }
      - { name: purchase_price_cents, type: integer, source: input, description: "Contract purchase price in cents" }
      - { name: posture, type: enum, source: computed, description: "Derived aggregate gate: SOURCING | UNDER_REVIEW | DD_OPEN | DD_BLOCKED | CLEAR_TO_CLOSE | CLOSED | TERMINATED. Computed from milestones, exceptions, estoppels, financing." }
      - { name: dd_period_end, type: datetime, source: computed, description: "Computed at PSA execution = psa_executed_at + DD_PERIOD_DAYS; drives milestone deadlines" }
      - { name: financing_contingency_end, type: datetime, source: computed, description: "Computed at PSA execution = psa_executed_at + FINANCING_CONTINGENCY_DAYS; financing must be committed or deal terminates after this date" }
      - { name: earnest_money_released, type: boolean, source: computed, default: false, description: "True once earnest money is released to seller at closing or forfeited on buyer-default termination" }
      - { name: pinned_underwriting_model_id, type: string, source: system, description: "FK -> UnderwritingModel.id; pinned at PSA execution, must equal latest APPROVED model version at closing" }
      - { name: closing_statement_id, type: string, source: system, description: "FK -> ClosingStatement.id; populated when closing statement is first issued" }
      - { name: status, type: enum, source: system, description: "SOURCING → PSA_PENDING → PSA_EXECUTED → DUE_DILIGENCE → CLEAR_TO_CLOSE → CLOSED | TERMINATED" }

  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Tenant legal entity name" }
      - { name: credit_rating, type: enum, source: input, description: "INVESTMENT_GRADE | NON_INVESTMENT_GRADE | UNRATED; drives underwriting haircut" }
      - { name: credit_score, type: integer, source: input, description: "Numeric credit score 0-1000" }
      - { name: annual_revenue_cents, type: integer, source: input, description: "Tenant annual revenue, used for coverage ratio" }
      - { name: is_guaranteed, type: boolean, source: input, default: false, description: "Whether a parent guarantee exists" }
      - { name: credit_assessment_status, type: enum, source: system, description: "PENDING → ANALYZED → APPROVED | REJECTED" }

  - name: Property
    parent: Deal
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id; owning deal" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: property_type, type: enum, source: input, description: "RETAIL | INDUSTRIAL | OFFICE | MEDICAL | QSR" }
      - { name: rentable_sqft, type: integer, source: input, description: "Rentable square feet; must be > 0" }
      - { name: year_built, type: integer, source: input, description: "Year built; must be >= 1800 and <= current logical year" }
      - { name: status, type: enum, source: system, description: "IDENTIFIED → SURVEYED → CLEAR | FLAGGED" }

  - name: Lease
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; leased property" }
      - { name: tenant_id, type: string, source: input, description: "FK -> Tenant.id; leasing tenant" }
      - { name: lease_type, type: enum, source: input, description: "NNN | NN | GROSS | ABSOLUTE_NET; drives proration responsibility split" }
      - { name: annual_base_rent_cents, type: integer, source: input, description: "Annual base rent in cents" }
      - { name: lease_commencement_date, type: datetime, source: input, description: "Lease start date" }
      - { name: lease_expiration_date, type: datetime, source: input, description: "Lease expiration date; must be > commencement" }
      - { name: remaining_term_months, type: integer, source: computed, description: "Computed at underwriting = whole months between logical clock now and lease_expiration_date; rollover-risk input" }
      - { name: renewal_options_count, type: integer, source: input, default: 0, description: "Number of unexercised renewal options" }
      - { name: rollover_risk_tier, type: enum, source: computed, description: "LOW | MEDIUM | HIGH | CRITICAL; derived from remaining_term_months thresholds" }
      - { name: status, type: enum, source: system, description: "DRAFT → VERIFIED → ESTOPPEL_PENDING → ESTOPPELED | EXPIRED" }

  - name: UnderwritingModel
    parent: Deal
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id" }
      - { name: model_version, type: integer, source: system, description: "Monotonic per-deal, assigned at creation as max(existing)+1" }
      - { name: noi_cents, type: integer, source: computed, description: "Net operating income = sum of VERIFIED-or-later lease annual_base_rent_cents minus opex allowance (computed via dual-variant algorithm)" }
      - { name: cap_rate_bps, type: integer, source: computed, description: "noi_cents * 10000 / purchase_price_cents, rounded to basis points" }
      - { name: cash_on_cash_bps, type: integer, source: computed, description: "(noi_cents - annual_debt_service_cents) * 10000 / equity_cents; variant divergence vs cap-rate path" }
      - { name: opex_allowance_variant, type: enum, source: input, default: "CONSERVATIVE", description: "CONSERVATIVE (15% of gross rent) | MARKET (12% of gross rent); dual-variant calculation driver" }
      - { name: walt_months, type: integer, source: computed, description: "Weighted average lease term across VERIFIED+ leases, weighted by annual_base_rent_cents; weighted-scoring calculation" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → APPROVED | REJECTED | SUPERSEDED" }

  - name: PurchaseAgreement
    parent: Deal
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id" }
      - { name: psa_price_cents, type: integer, source: input, description: "Negotiated PSA price; must equal deal.purchase_price_cents at execution (retrade amendments adjust both atomically)" }
      - { name: earnest_money_cents, type: integer, source: input, description: "PSA earnest money; must be >= EARNEST_MONEY_MIN_PCT (1%) of psa_price_cents" }
      - { name: dd_period_days, type: integer, source: input, description: "Due diligence period length in days; must be in [15, 120]" }
      - { name: financing_contingency_days, type: integer, source: input, description: "Financing contingency length in days; must be in [0, dd_period_days + 30]" }
      - { name: executed_at, type: datetime, source: system, description: "Set when both parties execute; drives dd_period_end and financing_contingency_end" }
      - { name: amendment_count, type: integer, source: system, default: 0, description: "Number of executed amendments; each amendment bumps version" }
      - { name: status, type: enum, source: system, description: "DRAFT → EXECUTED → AMENDED | TERMINATED | CLOSED" }

  - name: DueDiligenceMilestone
    parent: Deal
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id" }
      - { name: milestone_type, type: enum, source: input, description: "TITLE_REVIEW | SURVEY_REVIEW | ENVIRONMENTAL | PCA | ESTOPPEL_COLLECTION | SNDA_COLLECTION | FINANCING_COMMITMENT | FINAL_WALKTHROUGH" }
      - { name: due_date, type: datetime, source: input, description: "Milestone deadline; must be <= deal.dd_period_end" }
      - { name: completed_at, type: datetime, source: system, description: "Timestamp of completion" }
      - { name: waived, type: boolean, source: input, default: false, description: "Waived milestones count as satisfied for posture but require UnderwritingCommittee waiver" }
      - { name: status, type: enum, source: system, description: "PENDING → IN_PROGRESS → SATISFIED | WAIVED | OVERDUE" }

  - name: TitleReview
    parent: Deal
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id" }
      - { name: title_company, type: string, source: input, description: "Title insurer name" }
      - { name: survey_type, type: enum, source: input, default: "ALTA", description: "ALTA | BOUNDARY | TOPOGRAPHIC" }
      - { name: received_at, type: datetime, source: input, description: "Date title commitment received" }
      - { name: exception_count, type: integer, source: computed, description: "Count of linked TitleException records in any non-RESOLVED state" }
      - { name: status, type: enum, source: system, description: "RECEIVED → UNDER_REVIEW → EXCEPTIONS_RAISED → CLEARED | REJECTED" }

  - name: TitleException
    parent: TitleReview
    common_fields: true
    fields:
      - { name: title_review_id, type: string, source: system, description: "FK -> TitleReview.id" }
      - { name: exception_code, type: string, source: input, description: "Title commitment schedule B-II exception code" }
      - { name: severity, type: enum, source: input, description: "STANDARD | MATERIAL | FATAL" }
      - { name: description, type: string, source: input, description: "Exception description" }
      - { name: cured_by_exception_id, type: string, source: system, description: "FK -> TitleException.id; self-referential — a revised exception supersedes a cured one" }
      - { name: cure_cost_cents, type: integer, source: input, default: 0, description: "Cost to cure; MATERIAL+ exceptions with cure_cost > TITLE_CURE_THRESHOLD_CENTS require committee sign-off" }
      - { name: status, type: enum, source: system, description: "OPEN → CURE_PROPOSED → CURED | WAIVED | SUPERSEDED" }

  - name: EnvironmentalAssessment
    parent: Deal
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id" }
      - { name: phase, type: enum, source: input, description: "PHASE_I | PHASE_II" }
      - { name: recognized_environmental_condition, type: boolean, source: input, description: "Whether a REC was identified" }
      - { name: remediation_cost_cents, type: integer, source: input, default: 0, description: "Estimated remediation cost" }
      - { name: reliance_letter_received, type: boolean, source: input, default: false, description: "Reliance letter required before reliance on report" }
      - { name: status, type: enum, source: system, description: "ORDERED → RECEIVED → CLEARED | CONDITIONAL | FAILED" }

  - name: PropertyConditionAssessment
    parent: Deal
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id" }
      - { name: immediate_repair_cost_cents, type: integer, source: input, description: "Immediate (year-1) repair cost" }
      - { name: capital_reserve_cents_per_sqft, type: integer, source: input, description: "Capital reserve per sqft, in cents" }
      - { name: total_reserve_cents, type: integer, source: computed, description: "= capital_reserve_cents_per_sqft * rentable_sqft of linked property" }
      - { name: condition_rating, type: enum, source: input, description: "GOOD | FAIR | POOR | CRITICAL" }
      - { name: status, type: enum, source: system, description: "ORDERED → RECEIVED → ACCEPTED | REJECTED" }

  - name: EstoppelCertificate
    parent: Deal
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id" }
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id" }
      - { name: tenant_id, type: string, source: input, description: "FK -> Tenant.id" }
      - { name: rent_confirmed_cents, type: integer, source: input, description: "Tenant-confirmed annual rent; must equal lease.annual_base_rent_cents within ESTOPPEL_TOLERANCE_BPS or estoppel is DEFICIENT" }
      - { name: default_confirmed, type: boolean, source: input, description: "Tenant confirms no landlord default; if false, estoppel is DEFICIENT" }
      - { name: deficiency_reason, type: string, source: system, description: "Populated when status = DEFICIENT" }
      - { name: status, type: enum, source: system, description: "REQUESTED → RECEIVED → CERTIFIED | DEFICIENT | EXPIRED" }

  - name: SNDA
    parent: Deal
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id" }
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id" }
      - { name: lender_name, type: string, source: input, description: "Lender whose non-disturbance is required" }
      - { name: non_disturbance_confirmed, type: boolean, source: input, description: "Lender non-disturbance clause confirmed; required for CERTIFIED" }
      - { name: status, type: enum, source: system, description: "REQUESTED → RECEIVED → CERTIFIED | REJECTED" }

  - name: FinancingApplication
    parent: Deal
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id" }
      - { name: loan_type, type: enum, source: input, description: "NEW_LOAN | ASSUMPTION" }
      - { name: loan_amount_cents, type: integer, source: input, description: "Requested loan amount; must be <= MAX_LTV_PCT (65%) of psa_price_cents" }
      - { name: interest_rate_bps, type: integer, source: input, description: "Annual interest rate in basis points" }
      - { name: amortization_months, type: integer, source: input, description: "Amortization period in months; 0 = interest-only" }
      - { name: annual_debt_service_cents, type: integer, source: computed, description: "Computed via amortization or interest-only formula (dual-variant)" }
      - { name: dscr, type: number, source: computed, description: "noi_cents / annual_debt_service_cents; must be >= MIN_DSCR (1.25) at commitment" }
      - { name: assumption_fee_cents, type: integer, source: computed, description: "For ASSUMPTION loans = 1% of loan_amount_cents; 0 for NEW_LOAN" }
      - { name: committed_at, type: datetime, source: system, description: "Set when commitment letter issued; must be <= financing_contingency_end or contingency lapses" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → COMMITTED | DECLINED | WITHDRAWN | LAPSED" }

  - name: ClosingStatement
    parent: Deal
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id" }
      - { name: statement_version, type: integer, source: system, description: "Monotonic per deal; re-issuance increments" }
      - { name: closing_date, type: datetime, source: input, description: "Actual closing date; must be >= executed_at and drives proration denominator" }
      - { name: total_prorations_cents, type: integer, source: computed, description: "Net proration total across all Proration lines; sum of per-line rounded values (pinned rounding order: round per line, then sum)" }
      - { name: cash_to_close_cents, type: integer, source: computed, description: "= psa_price_cents - loan_amount_cents (if financing) + total_prorations_cents + assumption_fee_cents - earnest_money_cents; layered compounding formula" }
      - { name: provisional, type: boolean, source: system, description: "True until post-closing true-up is finalized; provisional vs final dual-variant" }
      - { name: status, type: enum, source: system, description: "DRAFT → ISSUED → ACKNOWLEDGED → TRUED_UP | SUPERSEDED" }

  - name: Proration
    parent: ClosingStatement
    common_fields: false  # immutable line items; corrections happen via true-up adjustments
    fields:
      - { name: closing_statement_id, type: string, source: system, description: "FK -> ClosingStatement.id" }
      - { name: line_type, type: enum, source: input, description: "BASE_RENT | CAM | TAX | INSURANCE | UTILITY" }
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; rent/CAM lines are per-lease, TAX/INSURANCE lines reference the anchor lease of the property" }
      - { name: annual_amount_cents, type: integer, source: input, description: "Annualized amount to prorate" }
      - { name: period_start, type: datetime, source: input, description: "Proration period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Proration period end (exclusive); half-open interval semantics" }
      - { name: prorated_cents, type: integer, source: computed, description: "Computed per-line: annual_amount_cents * days_in_period / days_in_year, rounded half-up per line; day-count convention ACT/365" }
      - { name: direction, type: enum, source: computed, description: "BUYER_CREDIT | SELLER_CREDIT; determined by whether period spans closing_date" }

  - name: TrueUpAdjustment
    parent: ClosingStatement
    common_fields: true
    fields:
      - { name: closing_statement_id, type: string, source: system, description: "FK -> ClosingStatement.id" }
      - { name: line_type, type: enum, source: input, description: "BASE_RENT | CAM | TAX | INSURANCE | UTILITY | REPAIR_CREDIT | OTHER" }
      - { name: amount_cents, type: integer, source: input, description: "Signed adjustment amount; positive = buyer receives credit" }
      - { name: reason, type: string, source: input, description: "Adjustment reason; required" }
      - { name: approved, type: boolean, source: system, description: "Both EscrowOfficer and AssetManager must approve; segregation of duties" }
      - { name: status, type: enum, source: system, description: "PROPOSED → ESCROW_APPROVED → FULLY_APPROVED | REJECTED | APPLIED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Deal
    initial_state: SOURCING
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: SOURCING
        to: PSA_PENDING
        trigger: POST /acquisition-deals/deals/{id}/submit-for-psa
        actor: AcquisitionsAnalyst
        preconditions:
          - "Deal must be in SOURCING (ERR_DEAL_INVALID_STATE)"
          - "Deal must have at least one Property (ERR_DEAL_NO_PROPERTY)"
          - "Deal must have a latest UnderwritingModel in APPROVED status (ERR_NO_APPROVED_UNDERWRITING)"
        side_effects:
          - "posture → UNDER_REVIEW"

      - from: PSA_PENDING
        to: PSA_EXECUTED
        trigger: POST /acquisition-deals/deals/{id}/purchase-agreements/{psaId}/execute
        actor: AcquisitionsAnalyst
        preconditions:
          - "PSA must be in DRAFT (ERR_PSA_NOT_EXECUTABLE)"
          - "psa_price_cents == deal.purchase_price_cents (ERR_PRICE_MISMATCH)"
          - "earnest_money_cents >= 1% of psa_price_cents (ERR_EARNEST_MONEY_INSUFFICIENT)"
        side_effects:
          - "PSA.status → EXECUTED, executed_at = logical clock now"
          - "deal.dd_period_end = executed_at + psa.dd_period_days"
          - "deal.financing_contingency_end = executed_at + psa.financing_contingency_days"
          - "deal.pinned_underwriting_model_id = latest APPROVED UnderwritingModel.id (version-pinning)"
          - "posture → DD_OPEN"
          - "Auto-create 8 DueDiligenceMilestone records (one per milestone_type) in PENDING, each with due_date = deal.dd_period_end"
          - "If financing_contingency_days == 0 (no financing contingency): the FINANCING_COMMITMENT milestone is created directly in WAIVED status (financing not required)"
          - "Increments deal.version"
          - "Milestone auto-satisfaction map: TITLE_REVIEW and SURVEY_REVIEW ← TitleReview CLEARED; ENVIRONMENTAL ← EnvironmentalAssessment CLEARED or CONDITIONAL; PCA ← PropertyConditionAssessment ACCEPTED; ESTOPPEL_COLLECTION ← all requested EstoppelCertificates CERTIFIED; SNDA_COLLECTION ← all requested SNDAs CERTIFIED; FINANCING_COMMITMENT ← FinancingApplication COMMITTED (or auto-WAIVED when no contingency); FINAL_WALKTHROUGH ← manual complete only"

      - from: PSA_EXECUTED
        to: DUE_DILIGENCE
        trigger: system (automatic when first DueDiligenceMilestone transitions PENDING → IN_PROGRESS)
        actor: system
        preconditions: []
        side_effects: []

      - from: DUE_DILIGENCE
        to: CLEAR_TO_CLOSE
        trigger: POST /acquisition-deals/deals/{id}/certify-clear-to-close
        actor: UnderwritingCommittee
        preconditions:
          - "All milestones SATISFIED or WAIVED (ERR_MILESTONES_OUTSTANDING)"
          - "No TitleException in OPEN or CURE_PROPOSED with severity FATAL (ERR_FATAL_TITLE_EXCEPTION)"
          - "All non-waived EnvironmentalAssessment in CLEARED or CONDITIONAL (ERR_ENVIRONMENTAL_UNRESOLVED)"
          - "All required EstoppelCertificate records CERTIFIED (ERR_ESTOPPEL_INCOMPLETE)"
          - "All required SNDA records CERTIFIED (ERR_SNDA_INCOMPLETE)"
          - "If financing required: FinancingApplication COMMITTED with committed_at <= financing_contingency_end (ERR_FINANCING_NOT_COMMITTED)"
          - "deal.pinned_underwriting_model_id must still be the latest APPROVED model (ERR_STALE_UNDERWRITING_MODEL)"
        side_effects:
          - "posture → CLEAR_TO_CLOSE"
          - "Issue provisional ClosingStatement (DRAFT) with computed prorations"

      - from: CLEAR_TO_CLOSE
        to: CLOSED
        trigger: POST /acquisition-deals/deals/{id}/close
        actor: EscrowOfficer
        preconditions:
          - "Deal posture == CLEAR_TO_CLOSE (ERR_NOT_CLEAR_TO_CLOSE)"
          - "ClosingStatement ISSUED and ACKNOWLEDGED (ERR_CLOSING_STATEMENT_NOT_ACKNOWLEDGED)"
        side_effects:
          - "Deal.status → CLOSED, posture → CLOSED"
          - "earnest_money_released → true"
          - "PSA.status → CLOSED"
          - "All leases status → ESTOPPELED preserved (no-op if already)"

      - from: DUE_DILIGENCE
        to: TERMINATED
        trigger: POST /acquisition-deals/deals/{id}/terminate
        actor: AcquisitionsAnalyst
        preconditions:
          - "Deal in DUE_DILIGENCE or CLEAR_TO_CLOSE (ERR_DEAL_INVALID_STATE)"
        side_effects:
          - "posture → TERMINATED"
          - "PSA.status → TERMINATED"
          - "All non-terminal milestones → WAIVED (system)"
          - "If termination_reason == BUYER_DEFAULT: earnest_money_released → true (forfeit to seller)"
          - "FinancingApplication → WITHDRAWN (if not COMMITTED)"

      - from: PSA_EXECUTED
        to: TERMINATED
        trigger: POST /acquisition-deals/deals/{id}/terminate
        actor: AcquisitionsAnalyst
        preconditions: []
        side_effects:
          - "posture → TERMINATED; PSA → TERMINATED; milestones → WAIVED"

      - from: CLEAR_TO_CLOSE
        to: TERMINATED
        trigger: POST /acquisition-deals/deals/{id}/terminate
        actor: AcquisitionsAnalyst
        preconditions: []
        side_effects:
          - "posture → TERMINATED; PSA → TERMINATED"

  - entity: UnderwritingModel
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /acquisition-deals/deals/{id}/underwriting-models/{modelId}/submit
        actor: AcquisitionsAnalyst
        preconditions:
          - "Model in DRAFT (ERR_MODEL_INVALID_STATE)"
          - "noi_cents > 0 (ERR_NOI_NON_POSITIVE)"
          - "cap_rate_bps within [MIN_CAP_RATE_BPS, MAX_CAP_RATE_BPS] = [300, 1200] (ERR_CAP_RATE_OUT_OF_BAND)"
        side_effects: []

      - from: SUBMITTED
        to: APPROVED
        trigger: POST /acquisition-deals/deals/{id}/underwriting-models/{modelId}/approve
        actor: UnderwritingCommittee
        preconditions:
          - "Model in SUBMITTED (ERR_MODEL_INVALID_STATE)"
          - "Segregation of duties: approver X-User-ID != submitter user id (ERR_SOD_VIOLATION)"
        side_effects:
          - "All other APPROVED models for this deal → SUPERSEDED"
          - "Deal's pinned_underwriting_model_id refreshed only if deal not yet PSA_EXECUTED"

      - from: SUBMITTED
        to: REJECTED
        trigger: POST /acquisition-deals/deals/{id}/underwriting-models/{modelId}/reject
        actor: UnderwritingCommittee
        preconditions:
          - "Model in SUBMITTED"
          - "Segregation of duties: rejector X-User-ID != submitter user id (ERR_SOD_VIOLATION)"
        side_effects: []

      - from: DRAFT
        to: SUPERSEDED
        trigger: system (automatic when a newer DRAFT model is submitted — old DRAFT auto-superseded)
        actor: system
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: SUPERSEDED
        trigger: system (automatic when a newer model is APPROVED)
        actor: system
        preconditions: []
        side_effects:
          - "If deal.pinned_underwriting_model_id == superseded model id and deal is PSA_EXECUTED or later, deal posture unchanged but certify-clear-to-close will fail ERR_STALE_UNDERWRITING_MODEL until an amendment re-pins"

  - entity: PurchaseAgreement
    initial_state: DRAFT
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: POST /acquisition-deals/deals/{id}/purchase-agreements/{psaId}/execute
        actor: AcquisitionsAnalyst
        preconditions:
          - "PSA in DRAFT (ERR_PSA_NOT_EXECUTABLE)"
          - "Deal in PSA_PENDING"
          - "psa_price_cents == deal.purchase_price_cents (ERR_PRICE_MISMATCH)"
          - "earnest_money_cents >= 1% of psa_price_cents (ERR_EARNEST_MONEY_INSUFFICIENT)"
        side_effects:
          - "executed_at = logical clock now"
          - "Deal → PSA_EXECUTED; milestones auto-created; pinned model set (see Deal machine)"

      - from: EXECUTED
        to: AMENDED
        trigger: POST /acquisition-deals/deals/{id}/purchase-agreements/{psaId}/amend
        actor: AcquisitionsAnalyst
        preconditions:
          - "PSA in EXECUTED or AMENDED (cyclic amendment loop)"
          - "expected_psa_version OCC check passes (ERR_STALE_PSA_VERSION)"
          - "earnest_money_cents >= 1% of new psa_price_cents"
        side_effects:
          - "amendment_count += 1; deal.purchase_price_cents updated atomically"
          - "Any SUBMITTED FinancingApplication whose loan now exceeds 65% of new price → WITHDRAWN (cascade)"
          - "Increments psa.version"

      - from: AMENDED
        to: AMENDED
        trigger: POST /acquisition-deals/deals/{id}/purchase-agreements/{psaId}/amend
        actor: AcquisitionsAnalyst
        preconditions:
          - "PSA in EXECUTED or AMENDED"
          - "expected_psa_version OCC check passes (ERR_STALE_PSA_VERSION)"
          - "earnest_money_cents >= 1% of new psa_price_cents"
        side_effects:
          - "amendment_count += 1; deal.purchase_price_cents updated atomically; LTV cascade; increments psa.version"

      - from: EXECUTED
        to: CLOSED
        trigger: system (automatic on deal close)
        actor: system
        preconditions: []
        side_effects: []

      - from: AMENDED
        to: CLOSED
        trigger: system (automatic on deal close)
        actor: system
        preconditions: []
        side_effects: []

      - from: EXECUTED
        to: TERMINATED
        trigger: system (automatic on deal terminate)
        actor: system
        preconditions: []
        side_effects: []

      - from: AMENDED
        to: TERMINATED
        trigger: system (automatic on deal terminate)
        actor: system
        preconditions: []
        side_effects: []

  - entity: TitleReview
    initial_state: RECEIVED
    terminal_states: [CLEARED, REJECTED]
    transitions:
      - from: RECEIVED
        to: UNDER_REVIEW
        trigger: POST /acquisition-deals/deals/{id}/title-reviews/{reviewId}/begin-review
        actor: DueDiligenceOfficer
        preconditions:
          - "Review in RECEIVED (ERR_TITLE_REVIEW_INVALID_STATE)"
        side_effects: []

      - from: UNDER_REVIEW
        to: EXCEPTIONS_RAISED
        trigger: system (automatic when first TitleException created with status OPEN)
        actor: system
        preconditions: []
        side_effects:
          - "Recompute TitleReview.exception_count"
          - "Deal posture → DD_BLOCKED if any exception severity == FATAL"

      - from: UNDER_REVIEW
        to: CLEARED
        trigger: POST /acquisition-deals/deals/{id}/title-reviews/{reviewId}/clear
        actor: DueDiligenceOfficer
        preconditions:
          - "Review in UNDER_REVIEW or EXCEPTIONS_RAISED"
          - "exception_count == 0 (ERR_UNRESOLVED_TITLE_EXCEPTIONS)"
        side_effects:
          - "Milestone TITLE_REVIEW + SURVEY_REVIEW → SATISFIED"
          - "Recompute deal posture"

      - from: EXCEPTIONS_RAISED
        to: CLEARED
        trigger: POST /acquisition-deals/deals/{id}/title-reviews/{reviewId}/clear
        actor: DueDiligenceOfficer
        preconditions:
          - "exception_count == 0"
        side_effects:
          - "Milestone TITLE_REVIEW + SURVEY_REVIEW → SATISFIED; posture recompute"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: POST /acquisition-deals/deals/{id}/title-reviews/{reviewId}/reject
        actor: DueDiligenceOfficer
        preconditions:
          - "At least one FATAL exception exists (ERR_NO_FATAL_EXCEPTION)"
        side_effects:
          - "Deal posture → DD_BLOCKED"

  - entity: TitleException
    initial_state: OPEN
    terminal_states: [CURED, WAIVED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: CURE_PROPOSED
        trigger: POST /acquisition-deals/deals/{id}/title-reviews/{reviewId}/exceptions/{exId}/propose-cure
        actor: DueDiligenceOfficer
        preconditions:
          - "Exception in OPEN (ERR_EXCEPTION_INVALID_STATE)"
        side_effects: []

      - from: CURE_PROPOSED
        to: CURED
        trigger: POST /acquisition-deals/deals/{id}/title-reviews/{reviewId}/exceptions/{exId}/confirm-cure
        actor: DueDiligenceOfficer
        preconditions:
          - "Exception in CURE_PROPOSED"
          - "If severity MATERIAL or FATAL and cure_cost_cents > TITLE_CURE_THRESHOLD_CENTS (100000): UnderwritingCommittee sign-off required (ERR_CURE_COST_NEEDS_COMMITTEE)"
        side_effects:
          - "Recompute TitleReview.exception_count (decrement)"
          - "If exception was FATAL, deal posture recomputed (may exit DD_BLOCKED)"
          - "Milestone TITLE_REVIEW rechecked"

      - from: OPEN
        to: WAIVED
        trigger: POST /acquisition-deals/deals/{id}/title-reviews/{reviewId}/exceptions/{exId}/waive
        actor: UnderwritingCommittee
        preconditions:
          - "severity != FATAL (ERR_FATAL_NOT_WAIVABLE)"
        side_effects:
          - "exception_count decrement; posture recompute"

      - from: CURED
        to: SUPERSEDED
        trigger: system (automatic when a revised exception links cured_by_exception_id to this one)
        actor: system
        preconditions: []
        side_effects:
          - "Revised exception created in OPEN; exception_count incremented"

  - entity: EnvironmentalAssessment
    initial_state: ORDERED
    terminal_states: [CLEARED, CONDITIONAL, FAILED]
    transitions:
      - from: ORDERED
        to: RECEIVED
        trigger: POST /acquisition-deals/deals/{id}/environmental-assessments/{eaId}/receive
        actor: DueDiligenceOfficer
        preconditions:
          - "EA in ORDERED"
          - "reliance_letter_received == true (ERR_RELIANCE_LETTER_REQUIRED)"
        side_effects: []

      - from: RECEIVED
        to: CLEARED
        trigger: POST /acquisition-deals/deals/{id}/environmental-assessments/{eaId}/clear
        actor: DueDiligenceOfficer
        preconditions:
          - "EA in RECEIVED"
          - "recognized_environmental_condition == false (ERR_REC_PRESENT)"
        side_effects:
          - "Milestone ENVIRONMENTAL → SATISFIED; posture recompute"

      - from: RECEIVED
        to: CONDITIONAL
        trigger: POST /acquisition-deals/deals/{id}/environmental-assessments/{eaId}/mark-conditional
        actor: UnderwritingCommittee
        preconditions:
          - "EA in RECEIVED"
          - "recognized_environmental_condition == true"
          - "remediation_cost_cents > 0 and remediation plan costed"
        side_effects:
          - "Milestone ENVIRONMENTAL → SATISFIED (conditional counts as satisfied)"
          - "Posture recompute"

      - from: RECEIVED
        to: FAILED
        trigger: POST /acquisition-deals/deals/{id}/environmental-assessments/{eaId}/fail
        actor: DueDiligenceOfficer
        preconditions:
          - "EA in RECEIVED"
          - "recognized_environmental_condition == true"
        side_effects:
          - "Deal posture → DD_BLOCKED"

  - entity: PropertyConditionAssessment
    initial_state: ORDERED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: ORDERED
        to: RECEIVED
        trigger: POST /acquisition-deals/deals/{id}/property-condition-assessments/{pcaId}/receive
        actor: DueDiligenceOfficer
        preconditions:
          - "PCA in ORDERED"
        side_effects:
          - "Compute total_reserve_cents"

      - from: RECEIVED
        to: ACCEPTED
        trigger: POST /acquisition-deals/deals/{id}/property-condition-assessments/{pcaId}/accept
        actor: UnderwritingCommittee
        preconditions:
          - "PCA in RECEIVED"
          - "condition_rating != CRITICAL (ERR_PCA_CRITICAL_CONDITION)"
        side_effects:
          - "Milestone PCA → SATISFIED"

      - from: RECEIVED
        to: REJECTED
        trigger: POST /acquisition-deals/deals/{id}/property-condition-assessments/{pcaId}/reject
        actor: UnderwritingCommittee
        preconditions:
          - "PCA in RECEIVED"
        side_effects: []

  - entity: EstoppelCertificate
    initial_state: REQUESTED
    terminal_states: [CERTIFIED, DEFICIENT, EXPIRED]
    transitions:
      - from: REQUESTED
        to: RECEIVED
        trigger: POST /acquisition-deals/deals/{id}/estoppels/{estoppelId}/receive
        actor: DueDiligenceOfficer
        preconditions:
          - "Estoppel in REQUESTED"
        side_effects:
          - "Lease status → ESTOPPEL_PENDING"

      - from: RECEIVED
        to: CERTIFIED
        trigger: POST /acquisition-deals/deals/{id}/estoppels/{estoppelId}/certify
        actor: DueDiligenceOfficer
        preconditions:
          - "Estoppel in RECEIVED"
          - "default_confirmed == true (ERR_ESTOPPEL_DEFAULT_DISCLOSED)"
          - "abs(rent_confirmed_cents - lease.annual_base_rent_cents) * 10000 <= lease.annual_base_rent_cents * ESTOPPEL_TOLERANCE_BPS (50 bps) (ERR_ESTOPPEL_RENT_MISMATCH)"
        side_effects:
          - "Lease status → ESTOPPELED"
          - "Milestone ESTOPPEL_COLLECTION rechecked: SATISFIED when all required estoppels CERTIFIED"

      - from: RECEIVED
        to: DEFICIENT
        trigger: system (automatic when certify preconditions fail — recorded for audit)
        actor: system
        preconditions: []
        side_effects:
          - "deficiency_reason populated"

      - from: REQUESTED
        to: EXPIRED
        trigger: system (automatic when logical clock passes dd_period_end and estoppel still REQUESTED)
        actor: system
        preconditions: []
        side_effects:
          - "Milestone ESTOPPEL_COLLECTION → OVERDUE"

  - entity: SNDA
    initial_state: REQUESTED
    terminal_states: [CERTIFIED, REJECTED]
    transitions:
      - from: REQUESTED
        to: RECEIVED
        trigger: POST /acquisition-deals/deals/{id}/sndas/{sndaId}/receive
        actor: DueDiligenceOfficer
        preconditions:
          - "SNDA in REQUESTED"
        side_effects: []

      - from: RECEIVED
        to: CERTIFIED
        trigger: POST /acquisition-deals/deals/{id}/sndas/{sndaId}/certify
        actor: DueDiligenceOfficer
        preconditions:
          - "SNDA in RECEIVED"
          - "non_disturbance_confirmed == true (ERR_SNDA_NON_DISTURBANCE_MISSING)"
        side_effects:
          - "Milestone SNDA_COLLECTION rechecked"

      - from: RECEIVED
        to: REJECTED
        trigger: POST /acquisition-deals/deals/{id}/sndas/{sndaId}/reject
        actor: DueDiligenceOfficer
        preconditions:
          - "SNDA in RECEIVED"
        side_effects: []

  - entity: FinancingApplication
    initial_state: DRAFT
    terminal_states: [COMMITTED, DECLINED, WITHDRAWN, LAPSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /acquisition-deals/deals/{id}/financing-applications/{appId}/submit
        actor: CapitalMarketsOfficer
        preconditions:
          - "Application in DRAFT"
          - "loan_amount_cents <= 65% of psa_price_cents (ERR_LTV_EXCEEDED)"
        side_effects:
          - "Compute annual_debt_service_cents (dual-variant: amortizing vs interest-only)"

      - from: SUBMITTED
        to: COMMITTED
        trigger: POST /acquisition-deals/deals/{id}/financing-applications/{appId}/commit
        actor: CapitalMarketsOfficer
        preconditions:
          - "Application in SUBMITTED"
          - "dscr >= MIN_DSCR (1.25) (ERR_DSCR_BELOW_MINIMUM)"
          - "logical clock now <= deal.financing_contingency_end (ERR_FINANCING_CONTINGENCY_LAPSED)"
        side_effects:
          - "committed_at = logical clock now"
          - "Milestone FINANCING_COMMITMENT → SATISFIED"
          - "Posture recompute"

      - from: SUBMITTED
        to: DECLINED
        trigger: POST /acquisition-deals/deals/{id}/financing-applications/{appId}/decline
        actor: CapitalMarketsOfficer
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: WITHDRAWN
        trigger: POST /acquisition-deals/deals/{id}/financing-applications/{appId}/withdraw
        actor: CapitalMarketsOfficer
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: POST /acquisition-deals/deals/{id}/financing-applications/{appId}/withdraw
        actor: CapitalMarketsOfficer
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: LAPSED
        trigger: system (automatic when logical clock passes financing_contingency_end and application still SUBMITTED)
        actor: system
        preconditions: []
        side_effects:
          - "Milestone FINANCING_COMMITMENT → OVERDUE"
          - "Posture recompute (may → DD_BLOCKED)"

  - entity: ClosingStatement
    initial_state: DRAFT
    terminal_states: [TRUED_UP, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: POST /acquisition-deals/deals/{id}/closing-statements/{stmtId}/issue
        actor: EscrowOfficer
        preconditions:
          - "Statement in DRAFT"
          - "Deal posture == CLEAR_TO_CLOSE"
        side_effects:
          - "Compute all Proration lines (provisional variant)"
          - "Compute total_prorations_cents (round per line, then sum)"
          - "Compute cash_to_close_cents"

      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: POST /acquisition-deals/deals/{id}/closing-statements/{stmtId}/acknowledge
        actor: AcquisitionsAnalyst
        preconditions:
          - "Statement in ISSUED"
          - "Segregation of duties: acknowledger != issuing EscrowOfficer (ERR_SOD_VIOLATION)"
        side_effects: []

      - from: ACKNOWLEDGED
        to: TRUED_UP
        trigger: POST /acquisition-deals/deals/{id}/closing-statements/{stmtId}/finalize-true-up
        actor: EscrowOfficer
        preconditions:
          - "Deal.status == CLOSED (ERR_DEAL_NOT_CLOSED)"
          - "All TrueUpAdjustment records in FULLY_APPROVED or REJECTED (ERR_TRUE_UP_PENDING)"
        side_effects:
          - "provisional → false"
          - "Recompute prorations using final variant (actual amounts from adjustments)"
          - "Recompute total_prorations_cents and cash_to_close_cents"

      - from: ISSUED
        to: SUPERSEDED
        trigger: POST /acquisition-deals/deals/{id}/closing-statements/{stmtId}/reissue
        actor: EscrowOfficer
        preconditions:
          - "Statement in ISSUED"
          - "expected_deal_version OCC check passes (ERR_STALE_DEAL_VERSION)"
        side_effects:
          - "Old statement → SUPERSEDED; new statement created DRAFT with statement_version+1"
          - "Increments deal.version"

  - entity: TrueUpAdjustment
    initial_state: PROPOSED
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: PROPOSED
        to: ESCROW_APPROVED
        trigger: POST /acquisition-deals/deals/{id}/closing-statements/{stmtId}/true-ups/{adjId}/escrow-approve
        actor: EscrowOfficer
        preconditions:
          - "Adjustment in PROPOSED"
        side_effects: []

      - from: ESCROW_APPROVED
        to: FULLY_APPROVED
        trigger: POST /acquisition-deals/deals/{id}/closing-statements/{stmtId}/true-ups/{adjId}/asset-manager-approve
        actor: AssetManager
        preconditions:
          - "Adjustment in ESCROW_APPROVED"
          - "Segregation of duties: AssetManager X-User-ID != proposing user (ERR_SOD_VIOLATION)"
        side_effects:
          - "approved → true"

      - from: PROPOSED
        to: REJECTED
        trigger: POST /acquisition-deals/deals/{id}/closing-statements/{stmtId}/true-ups/{adjId}/reject
        actor: EscrowOfficer
        preconditions:
          - "Adjustment in PROPOSED"
        side_effects: []

      - from: FULLY_APPROVED
        to: APPLIED
        trigger: system (automatic at finalize-true-up)
        actor: system
        preconditions: []
        side_effects:
          - "amount_cents folded into final proration recompute"

  - entity: DueDiligenceMilestone
    initial_state: PENDING
    terminal_states: [SATISFIED, WAIVED, OVERDUE]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: POST /acquisition-deals/deals/{id}/milestones/{milestoneId}/start
        actor: DueDiligenceOfficer
        preconditions:
          - "Milestone in PENDING"
          - "Deal in PSA_EXECUTED or DUE_DILIGENCE"
        side_effects:
          - "If deal.status == PSA_EXECUTED, deal.status → DUE_DILIGENCE"

      - from: PENDING
        to: SATISFIED
        trigger: system (automatic when the gating artifact reaches its terminal-good state — e.g., TitleReview CLEARED satisfies TITLE_REVIEW and SURVEY_REVIEW directly from PENDING)
        actor: system
        preconditions:
          - "Artifact-specific gate (per the milestone auto-satisfaction map on the Deal execute transition)"
        side_effects:
          - "completed_at = logical clock now; posture recompute"

      - from: IN_PROGRESS
        to: SATISFIED
        trigger: system (automatic when the gating artifact reaches its terminal-good state) OR POST /acquisition-deals/deals/{id}/milestones/{milestoneId}/complete
        actor: system | DueDiligenceOfficer
        preconditions:
          - "Artifact-specific gate (e.g., TitleReview CLEARED for TITLE_REVIEW)"
        side_effects:
          - "completed_at = logical clock now; posture recompute"

      - from: IN_PROGRESS
        to: WAIVED
        trigger: POST /acquisition-deals/deals/{id}/milestones/{milestoneId}/waive
        actor: UnderwritingCommittee
        preconditions:
          - "Milestone in IN_PROGRESS or PENDING"
          - "milestone_type not in {TITLE_REVIEW, ENVIRONMENTAL} (ERR_MILESTONE_NOT_WAIVABLE)"
        side_effects:
          - "waived → true; posture recompute"

      - from: PENDING
        to: WAIVED
        trigger: POST /acquisition-deals/deals/{id}/milestones/{milestoneId}/waive
        actor: UnderwritingCommittee
        preconditions:
          - "milestone_type not in {TITLE_REVIEW, ENVIRONMENTAL}"
        side_effects: []

      - from: PENDING
        to: OVERDUE
        trigger: system (automatic when logical clock passes due_date)
        actor: system
        preconditions: []
        side_effects:
          - "Deal posture → DD_BLOCKED"

  - entity: Lease
    initial_state: DRAFT
    terminal_states: [ESTOPPELED, EXPIRED]
    transitions:
      - from: DRAFT
        to: VERIFIED
        trigger: POST /acquisition-deals/deals/{id}/properties/{propertyId}/leases/{leaseId}/verify
        actor: AcquisitionsAnalyst
        preconditions:
          - "Lease in DRAFT"
          - "Tenant credit_assessment_status == APPROVED (ERR_TENANT_CREDIT_NOT_APPROVED)"
        side_effects:
          - "Compute remaining_term_months and rollover_risk_tier"

      - from: VERIFIED
        to: ESTOPPEL_PENDING
        trigger: system (automatic when EstoppelCertificate for this lease → RECEIVED)
        actor: system
        preconditions: []
        side_effects: []

      - from: ESTOPPEL_PENDING
        to: ESTOPPELED
        trigger: system (automatic when EstoppelCertificate for this lease → CERTIFIED)
        actor: system
        preconditions: []
        side_effects: []

      - from: ESTOPPEL_PENDING
        to: VERIFIED
        trigger: system (automatic when EstoppelCertificate for this lease → DEFICIENT — negotiation loop)
        actor: system
        preconditions: []
        side_effects:
          - "New EstoppelCertificate may be re-requested (cyclic loop)"

      - from: ESTOPPELED
        to: ESTOPPEL_PENDING
        trigger: system (automatic when a NEW EstoppelCertificate for this lease → RECEIVED after a prior certification — re-confirmation round)
        actor: system
        preconditions: []
        side_effects: []

  - entity: Tenant
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: ANALYZED
        trigger: POST /tenants/{id}/analyze-credit
        actor: UnderwritingCommittee
        preconditions:
          - "Tenant credit_assessment_status == PENDING (ERR_TENANT_CREDIT_INVALID_STATE)"
        side_effects: []

      - from: ANALYZED
        to: APPROVED
        trigger: POST /tenants/{id}/approve-credit
        actor: UnderwritingCommittee
        preconditions:
          - "Tenant credit_assessment_status == ANALYZED"
          - "If credit_rating == UNRATED and is_guaranteed == false: approval blocked (ERR_UNRATED_UNGUARANTEED_TENANT)"
        side_effects: []

      - from: ANALYZED
        to: REJECTED
        trigger: POST /tenants/{id}/reject-credit
        actor: UnderwritingCommittee
        preconditions:
          - "Tenant credit_assessment_status == ANALYZED"
        side_effects: []

  - entity: Property
    initial_state: IDENTIFIED
    terminal_states: [CLEAR, FLAGGED]
    transitions:
      - from: IDENTIFIED
        to: SURVEYED
        trigger: POST /acquisition-deals/deals/{id}/properties/{propertyId}/mark-surveyed
        actor: DueDiligenceOfficer
        preconditions:
          - "Property in IDENTIFIED"
        side_effects: []

      - from: SURVEYED
        to: CLEAR
        trigger: POST /acquisition-deals/deals/{id}/properties/{propertyId}/clear
        actor: DueDiligenceOfficer
        preconditions:
          - "Property in SURVEYED"
        side_effects: []

      - from: SURVEYED
        to: FLAGGED
        trigger: POST /acquisition-deals/deals/{id}/properties/{propertyId}/flag
        actor: DueDiligenceOfficer
        preconditions:
          - "Property in SURVEYED"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: deal-closing-statement-reissue-stale-version
    parent_entity: Deal
    write_endpoint: "POST /acquisition-deals/deals/{id}/closing-statements/{stmtId}/reissue"
    occ_field: "expected_deal_version"
    description: |
      Reissuing a closing statement against a Deal whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has modified deal-level state (posture change,
      amendment) that invalidates the proration basis on which the client
      computed the reissue.
    error_id: ERR_STALE_DEAL_VERSION
    http_status: 412

  - rule_id: psa-amend-stale-version
    parent_entity: PurchaseAgreement
    write_endpoint: "POST /acquisition-deals/deals/{id}/purchase-agreements/{psaId}/amend"
    occ_field: "expected_psa_version"
    description: |
      Amending a PSA whose version has advanced since the client last observed
      it is rejected. This captures the case where another amendment has just
      been executed and the current writer's view of the price/terms is stale.
    error_id: ERR_STALE_PSA_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: net_operating_income
    trigger: "UnderwritingModel creation and recompute (submit/approve)"
    algorithm: aggregation
    formula: |
      1. Collect all Lease records for all Properties of the deal whose
         status IN {VERIFIED, ESTOPPEL_PENDING, ESTOPPELED}
      2. gross_rent_cents = sum(lease.annual_base_rent_cents)
      3. opex_allowance_cents = gross_rent_cents * OPEX_PCT(variant)
         where OPEX_PCT = 0.15 for CONSERVATIVE, 0.12 for MARKET
      4. noi_cents = gross_rent_cents - opex_allowance_cents
    input_set: "Leases of deal's properties with status in {VERIFIED, ESTOPPEL_PENDING, ESTOPPELED}; DRAFT and EXPIRED leases excluded"
    constants:
      OPEX_PCT_CONSERVATIVE: 0.15
      OPEX_PCT_MARKET: 0.12
    precision: "integer cents, no rounding needed (multiplication then truncation)"
    variants:
      - name: conservative
        when: "opex_allowance_variant == CONSERVATIVE"
        difference: "Uses 15% opex allowance → lower NOI than market variant"
      - name: market
        when: "opex_allowance_variant == MARKET"
        difference: "Uses 12% opex allowance → higher NOI; same leases, different NOI output"

  - name: cap_rate
    trigger: "UnderwritingModel recompute"
    algorithm: threshold
    formula: |
      cap_rate_bps = round_half_up(noi_cents * 10000 / purchase_price_cents)
    input_set: "UnderwritingModel.noi_cents and Deal.purchase_price_cents"
    constants:
      MIN_CAP_RATE_BPS: 300
      MAX_CAP_RATE_BPS: 1200
    precision: "integer basis points, round_half_up"

  - name: cash_on_cash_return
    trigger: "UnderwritingModel recompute when FinancingApplication exists"
    algorithm: threshold
    formula: |
      equity_cents = purchase_price_cents - loan_amount_cents + assumption_fee_cents
      cash_on_cash_bps = round_half_up((noi_cents - annual_debt_service_cents) * 10000 / equity_cents)
    input_set: "UnderwritingModel.noi_cents, FinancingApplication.{loan_amount_cents, annual_debt_service_cents, assumption_fee_cents}, Deal.purchase_price_cents"
    constants: {}
    precision: "integer basis points, round_half_up"
    note: "Dual-variant with cap_rate — same NOI input, different denominator and subtraction of debt service; the two produce different returns for identical deal data"

  - name: annual_debt_service
    trigger: "FinancingApplication submit"
    algorithm: tiered_pricing
    formula: |
      If amortization_months == 0:  # interest-only variant
        annual_debt_service_cents = round_half_up(loan_amount_cents * interest_rate_bps / 10000)
      Else:  # amortizing variant — standard constant-payment amortization
        r = interest_rate_bps / 10000 / 12
        n = amortization_months
        payment_cents = round_half_up(loan_amount_cents * r * (1+r)^n / ((1+r)^n - 1))
        annual_debt_service_cents = payment_cents * 12
    input_set: "FinancingApplication.{loan_amount_cents, interest_rate_bps, amortization_months}"
    constants: {}
    precision: "integer cents, round_half_up at payment then multiply (pinned order)"
    variants:
      - name: interest_only
        when: "amortization_months == 0"
        difference: "Annual DS = loan * rate (simple multiplication)"
      - name: amortizing
        when: "amortization_months > 0"
        difference: "Annual DS = monthly constant payment * 12; differs from interest-only for identical loan_amount and rate"

  - name: weighted_average_lease_term
    trigger: "UnderwritingModel recompute"
    algorithm: weighted_scoring
    formula: |
      For each included Lease (status in {VERIFIED, ESTOPPEL_PENDING, ESTOPPELED}):
        weight_i = lease.annual_base_rent_cents
        term_i = lease.remaining_term_months
      walt_months = round_half_up(sum(weight_i * term_i) / sum(weight_i))
      If no included leases: walt_months = 0
    input_set: "Leases with status in {VERIFIED, ESTOPPEL_PENDING, ESTOPPELED}"
    constants: {}
    precision: "integer months, round_half_up"

  - name: rollover_risk_tier_assignment
    trigger: "Lease verification"
    algorithm: threshold
    formula: |
      If remaining_term_months < 24: rollover_risk_tier = CRITICAL
      Elif remaining_term_months < 60: rollover_risk_tier = HIGH
      Elif remaining_term_months < 120: rollover_risk_tier = MEDIUM
      Else: rollover_risk_tier = LOW
      # Boundary: exactly 24 → HIGH (not CRITICAL); exactly 60 → MEDIUM; exactly 120 → LOW
    input_set: "Lease.remaining_term_months"
    constants:
      CRITICAL_LT: 24
      HIGH_LT: 60
      MEDIUM_LT: 120
    precision: "integer months comparison, strict <"

  - name: proration_line
    trigger: "ClosingStatement issue and finalize-true-up"
    algorithm: chronological
    formula: |
      # Day-count convention: ACT/365, half-open interval [period_start, period_end)
      days_in_period = (period_end - period_start).days
      days_in_year = 365
      # Proration splits at closing_date: seller responsible for days < closing_date,
      # buyer for days >= closing_date. Direction depends on whether the line is
      # pre-paid (seller paid through period_end → buyer credit) or arrears.
      seller_days = max(0, (min(period_end, closing_date) - period_start).days)
      buyer_days = days_in_period - seller_days
      per_day_cents = annual_amount_cents * days_in_period / days_in_year / days_in_period
                    = annual_amount_cents / 365   # simplifies; still round per line
      prorated_cents = round_half_up(annual_amount_cents * buyer_days / 365)
      direction = BUYER_CREDIT if line_type in {BASE_RENT, CAM} (rent pre-paid by tenant
                  to seller through period_end) else SELLER_CREDIT
    input_set: "Proration line inputs; all leases with status in {ESTOPPELED, ESTOPPEL_PENDING} contribute rent lines"
    constants:
      DAYS_IN_YEAR: 365
    precision: "integer cents, round_half_up PER LINE, then sum lines for total (pinned rounding order)"

  - name: total_prorations
    trigger: "ClosingStatement issue and finalize-true-up"
    algorithm: aggregation
    formula: |
      # Pinned rounding order: round each line first, then sum.
      # Alternative (sum exact, then round) produces different cents and is forbidden.
      credits = sum(line.prorated_cents for line where direction == BUYER_CREDIT)
      debits  = sum(line.prorated_cents for line where direction == SELLER_CREDIT)
      total_prorations_cents = credits - debits
    input_set: "All Proration lines on the ClosingStatement"
    constants: {}
    precision: "integer cents (already rounded per line)"

  - name: cash_to_close
    trigger: "ClosingStatement issue and finalize-true-up"
    algorithm: waterfall_allocation
    formula: |
      # Layered compounding formula — order matters (each layer uses the result of prior):
      base = psa_price_cents
      layer1 = base - loan_amount_cents              # financing reduces cash needed (0 if no financing)
      layer2 = layer1 + total_prorations_cents       # net prorations (can be negative)
      layer3 = layer2 + assumption_fee_cents         # assumption fee (0 for NEW_LOAN or no financing)
      cash_to_close_cents = layer3 - earnest_money_cents
    input_set: "Deal.{psa via PSA.psa_price_cents, earnest_money_cents}, FinancingApplication.{loan_amount_cents, assumption_fee_cents}, ClosingStatement.total_prorations_cents"
    constants: {}
    precision: "integer cents"
    note: "Evaluation order pinned: financing layer → prorations layer → assumption fee layer → earnest money credit. Reordering produces different cents when prorations are negative."

  - name: remaining_term_months
    trigger: "Lease verification"
    algorithm: chronological
    formula: |
      # Whole months between logical clock now and lease_expiration_date,
      # computed as: (expiry.year - now.year) * 12 + (expiry.month - now.month)
      # minus 1 if expiry.day < now.day (partial month not counted)
      months = (expiry.year - now.year) * 12 + (expiry.month - now.month)
      if expiry.day < now.day: months -= 1
      remaining_term_months = max(0, months)
    input_set: "Lease.lease_expiration_date, logical clock now"
    constants: {}
    precision: "integer months"

  - name: dscr_check
    trigger: "FinancingApplication commit"
    algorithm: threshold
    formula: |
      dscr = noi_cents / annual_debt_service_cents   # number, 4 decimal places
      commit allowed iff dscr >= MIN_DSCR            # boundary: exactly 1.25 passes
    input_set: "Latest APPROVED UnderwritingModel.noi_cents, FinancingApplication.annual_debt_service_cents"
    constants:
      MIN_DSCR: 1.25
    precision: "4 decimal places, round_half_up; boundary >= is inclusive"

  - name: estoppel_rent_match_check
    trigger: "EstoppelCertificate certify"
    algorithm: threshold
    formula: |
      diff_bps = abs(rent_confirmed_cents - lease.annual_base_rent_cents) * 10000 / lease.annual_base_rent_cents
      certify allowed iff diff_bps <= ESTOPPEL_TOLERANCE_BPS   # boundary: exactly 50 bps passes
    input_set: "EstoppelCertificate.rent_confirmed_cents, Lease.annual_base_rent_cents"
    constants:
      ESTOPPEL_TOLERANCE_BPS: 50
    precision: "basis points, round_half_up; boundary <= is inclusive"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be authorized for this endpoint per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Resource IDs in path must exist, validated left-to-right (deal → property → lease → child)"
    error_id: "ERR_DEAL_NOT_FOUND | ERR_TENANT_NOT_FOUND | ERR_PROPERTY_NOT_FOUND | ERR_LEASE_NOT_FOUND | ERR_MODEL_NOT_FOUND | ERR_PSA_NOT_FOUND | ERR_MILESTONE_NOT_FOUND | ERR_TITLE_REVIEW_NOT_FOUND | ERR_EXCEPTION_NOT_FOUND | ERR_EA_NOT_FOUND | ERR_PCA_NOT_FOUND | ERR_ESTOPPEL_NOT_FOUND | ERR_SNDA_NOT_FOUND | ERR_FINANCING_NOT_FOUND | ERR_STATEMENT_NOT_FOUND | ERR_PRORATION_NOT_FOUND | ERR_TRUE_UP_NOT_FOUND"
    http_status: 404
    applies_to: "all nested endpoints and flat single-resource GETs"

  - priority: 4
    category: existence
    check: "Referenced body FKs must exist (tenant_id on lease, lease_id on estoppel, etc.)"
    error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http_status: 422
    applies_to: "endpoints with body FKs"

  - priority: 5
    category: state
    check: "Target resource must be in a valid from-state for the requested transition"
    error_id: "ERR_DEAL_INVALID_STATE | ERR_MODEL_INVALID_STATE | ERR_PSA_NOT_EXECUTABLE | ERR_TITLE_REVIEW_INVALID_STATE | ERR_EXCEPTION_INVALID_STATE | ERR_EA_INVALID_STATE | ERR_PCA_INVALID_STATE | ERR_ESTOPPEL_INVALID_STATE | ERR_SNDA_INVALID_STATE | ERR_FINANCING_INVALID_STATE | ERR_STATEMENT_INVALID_STATE | ERR_TRUE_UP_INVALID_STATE | ERR_MILESTONE_INVALID_STATE | ERR_LEASE_INVALID_STATE | ERR_PROPERTY_INVALID_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "OCC expected_*_version must match current parent version"
    error_id: "ERR_STALE_DEAL_VERSION | ERR_STALE_PSA_VERSION"
    http_status: 412
    applies_to: "execute PSA, reissue closing statement, amend PSA"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: underwriting approver != submitter; closing-statement acknowledger != issuing EscrowOfficer; true-up AssetManager approver != proposer"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "approve/reject underwriting model, acknowledge closing statement, asset-manager-approve true-up"

  - priority: 8
    category: business_safety
    check: "Tenant credit must be APPROVED before lease verification; UNRATED + unguaranteed tenants cannot be approved"
    error_id: "ERR_TENANT_CREDIT_NOT_APPROVED | ERR_UNRATED_UNGUARANTEED_TENANT"
    http_status: 422
    applies_to: "verify lease, approve tenant credit"

  - priority: 9
    category: business_safety
    check: "Environmental reliance letter required before receive; REC present blocks plain clear"
    error_id: "ERR_RELIANCE_LETTER_REQUIRED | ERR_REC_PRESENT"
    http_status: 422
    applies_to: "receive/clear environmental assessment"

  - priority: 10
    category: business_safety
    check: "FATAL title exceptions are not waivable; REJECTED title review requires at least one FATAL exception"
    error_id: "ERR_FATAL_NOT_WAIVABLE | ERR_NO_FATAL_EXCEPTION"
    http_status: 422
    applies_to: "waive title exception, reject title review"

  - priority: 11
    category: business_constraint
    check: "PSA field-range constraints: dd_period_days in [15,120], financing_contingency_days in [0, dd_period_days+30], target_close_date >= creation + 30 days, rentable_sqft > 0, lease_expiration > commencement, year_built in [1800, current logical year]"
    error_id: ERR_FIELD_CONSTRAINT_VIOLATION
    http_status: 400
    applies_to: "create/update endpoints"

  - priority: 12
    category: business_constraint
    check: "Price consistency: psa_price_cents == deal.purchase_price_cents at execution"
    error_id: ERR_PRICE_MISMATCH
    http_status: 409
    applies_to: "execute PSA"

  - priority: 13
    category: business_constraint
    check: "Milestone due_date must be <= deal.dd_period_end; milestone_type TITLE_REVIEW/ENVIRONMENTAL not waivable"
    error_id: "ERR_MILESTONE_DUE_DATE_EXCEEDS_DD | ERR_MILESTONE_NOT_WAIVABLE"
    http_status: 422
    applies_to: "create milestone, waive milestone"

  - priority: 14
    category: business_constraint
    check: "Estoppel rent within tolerance; no landlord default disclosed; SNDA non-disturbance confirmed"
    error_id: "ERR_ESTOPPEL_RENT_MISMATCH | ERR_ESTOPPEL_DEFAULT_DISCLOSED | ERR_SNDA_NON_DISTURBANCE_MISSING"
    http_status: 422
    applies_to: "certify estoppel, certify SNDA"

  - priority: 15
    category: business_fiscal
    check: "Earnest money >= 1% of PSA price at execution"
    error_id: ERR_EARNEST_MONEY_INSUFFICIENT
    http_status: 422
    applies_to: "execute PSA"

  - priority: 16
    category: business_fiscal
    check: "LTV <= 65% of PSA price"
    error_id: ERR_LTV_EXCEEDED
    http_status: 422
    applies_to: "submit financing application"

  - priority: 17
    category: business_fiscal
    check: "DSCR >= 1.25 at commitment"
    error_id: ERR_DSCR_BELOW_MINIMUM
    http_status: 422
    applies_to: "commit financing application"

  - priority: 18
    category: business_fiscal
    check: "Cap rate within [300, 1200] bps and NOI > 0 at model submission"
    error_id: "ERR_CAP_RATE_OUT_OF_BAND | ERR_NOI_NON_POSITIVE"
    http_status: 422
    applies_to: "submit underwriting model"

  - priority: 19
    category: business_fiscal
    check: "Cure cost > TITLE_CURE_THRESHOLD_CENTS (100000) for MATERIAL/FATAL exception requires committee sign-off"
    error_id: ERR_CURE_COST_NEEDS_COMMITTEE
    http_status: 422
    applies_to: "confirm-cure title exception"

  - priority: 20
    category: business_temporal
    check: "Financing commitment must occur on or before financing_contingency_end"
    error_id: ERR_FINANCING_CONTINGENCY_LAPSED
    http_status: 422
    applies_to: "commit financing application"

  - priority: 21
    category: business_temporal
    check: "Closing date must be >= PSA executed_at"
    error_id: ERR_CLOSING_DATE_BEFORE_EXECUTION
    http_status: 422
    applies_to: "create closing statement"

  - priority: 22
    category: business_referential
    check: "Deal must have property + APPROVED underwriting model before submit-for-psa"
    error_id: "ERR_DEAL_NO_PROPERTY | ERR_NO_APPROVED_UNDERWRITING"
    http_status: 422
    applies_to: "submit-for-psa"

  - priority: 23
    category: business_referential
    check: "Certify-clear-to-close gates: milestones satisfied, no unresolved FATAL exceptions, environmental resolved, estoppels certified, SNDAs certified, financing committed, pinned model fresh"
    error_id: "ERR_MILESTONES_OUTSTANDING | ERR_FATAL_TITLE_EXCEPTION | ERR_ENVIRONMENTAL_UNRESOLVED | ERR_ESTOPPEL_INCOMPLETE | ERR_SNDA_INCOMPLETE | ERR_FINANCING_NOT_COMMITTED | ERR_STALE_UNDERWRITING_MODEL"
    http_status: 422
    applies_to: "certify-clear-to-close"

  - priority: 24
    category: business_referential
    check: "Deal must be CLOSED before finalize-true-up; all true-ups decided"
    error_id: "ERR_DEAL_NOT_CLOSED | ERR_TRUE_UP_PENDING"
    http_status: 422
    applies_to: "finalize-true-up"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-08-01T00:00:00Z; before any set call the clock reads exactly this default and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects:
      - "Advance logical clock; fire time-based system transitions (milestone OVERDUE, estoppel EXPIRED, financing LAPSED)"

  # --- Deal ---
  - method: POST
    path: "/acquisition-deals/deals"
    description: "Create a new acquisition deal"
    roles: [AcquisitionsAnalyst]
    code: 201
    input: [deal_name, deal_type, "sourcing_channel?", target_close_date, earnest_money_cents, purchase_price_cents]
    output: Deal
    side_effects:
      - "status = SOURCING; posture = SOURCING; earnest_money_released = false"

  - method: GET
    path: "/acquisition-deals/deals"
    description: "List acquisition deals; supports reverse-lookup filters on back-reference FKs (pinned_underwriting_model_id, closing_statement_id)"
    roles: [AcquisitionsAnalyst, UnderwritingCommittee, DueDiligenceOfficer, EscrowOfficer, AssetManager, CapitalMarketsOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "posture?", "pinned_underwriting_model_id?", "closing_statement_id?"]
    output: "Deal[]"
    side_effects: []

  - method: GET
    path: "/acquisition-deals/deals/{id}"
    description: "Get a specific deal"
    roles: [AcquisitionsAnalyst, UnderwritingCommittee, DueDiligenceOfficer, EscrowOfficer, AssetManager, CapitalMarketsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Deal
    side_effects: []

  - method: POST
    path: "/acquisition-deals/deals/{id}/submit-for-psa"
    description: "Submit deal for PSA drafting"
    roles: [AcquisitionsAnalyst]
    code: 200
    input: []
    output: Deal
    side_effects: ["status → PSA_PENDING; posture → UNDER_REVIEW"]

  - method: POST
    path: "/acquisition-deals/deals/{id}/certify-clear-to-close"
    description: "Committee certifies deal is clear to close"
    roles: [UnderwritingCommittee]
    code: 200
    input: []
    output: Deal
    side_effects: ["posture → CLEAR_TO_CLOSE; status → CLEAR_TO_CLOSE; provisional ClosingStatement created in DRAFT"]

  - method: POST
    path: "/acquisition-deals/deals/{id}/close"
    description: "Close the deal"
    roles: [EscrowOfficer]
    code: 200
    input: []
    output: Deal
    side_effects: ["status → CLOSED; earnest_money_released → true; PSA → CLOSED"]

  - method: POST
    path: "/acquisition-deals/deals/{id}/terminate"
    description: "Terminate the deal"
    roles: [AcquisitionsAnalyst]
    code: 200
    input: [termination_reason]
    output: Deal
    side_effects: ["status → TERMINATED; PSA → TERMINATED; milestones → WAIVED; conditional earnest money forfeit"]

  # --- Tenant ---
  - method: POST
    path: "/tenants"
    description: "Create a tenant"
    roles: [AcquisitionsAnalyst]
    code: 201
    input: [legal_name, credit_rating, credit_score, annual_revenue_cents, "is_guaranteed?"]
    output: Tenant
    side_effects: ["credit_assessment_status = PENDING"]

  - method: GET
    path: "/tenants"
    description: "List tenants"
    roles: [AcquisitionsAnalyst, UnderwritingCommittee, DueDiligenceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Tenant[]"
    side_effects: []

  - method: GET
    path: "/tenants/{id}"
    description: "Get a tenant"
    roles: [AcquisitionsAnalyst, UnderwritingCommittee, DueDiligenceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Tenant
    side_effects: []

  - method: POST
    path: "/tenants/{id}/analyze-credit"
    description: "Analyze tenant credit (PENDING → ANALYZED)"
    roles: [UnderwritingCommittee]
    code: 200
    input: []
    output: Tenant
    side_effects: ["credit_assessment_status → ANALYZED"]

  - method: POST
    path: "/tenants/{id}/approve-credit"
    description: "Approve tenant credit"
    roles: [UnderwritingCommittee]
    code: 200
    input: []
    output: Tenant
    side_effects: ["credit_assessment_status → APPROVED (requires ANALYZED)"]

  - method: POST
    path: "/tenants/{id}/reject-credit"
    description: "Reject tenant credit"
    roles: [UnderwritingCommittee]
    code: 200
    input: []
    output: Tenant
    side_effects: ["credit_assessment_status → REJECTED (requires ANALYZED)"]

  # --- Property ---
  - method: POST
    path: "/acquisition-deals/deals/{id}/properties"
    description: "Add a property to a deal"
    roles: [AcquisitionsAnalyst]
    code: 201
    input: [address, property_type, rentable_sqft, year_built]
    output: Property
    side_effects: ["status = IDENTIFIED"]

  - method: GET
    path: "/acquisition-deals/deals/{id}/properties"
    description: "List properties of a deal"
    roles: [AcquisitionsAnalyst, UnderwritingCommittee, DueDiligenceOfficer, EscrowOfficer, AssetManager, CapitalMarketsOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Property[]"
    side_effects: []

  - method: GET
    path: "/acquisition-deals/deals/{id}/properties/{propertyId}"
    description: "Get a property"
    roles: [AcquisitionsAnalyst, UnderwritingCommittee, DueDiligenceOfficer, EscrowOfficer, AssetManager, CapitalMarketsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: POST
    path: "/acquisition-deals/deals/{id}/properties/{propertyId}/mark-surveyed"
    description: "Mark property surveyed"
    roles: [DueDiligenceOfficer]
    code: 200
    input: []
    output: Property
    side_effects: ["status → SURVEYED"]

  - method: POST
    path: "/acquisition-deals/deals/{id}/properties/{propertyId}/clear"
    description: "Clear property"
    roles: [DueDiligenceOfficer]
    code: 200
    input: []
    output: Property
    side_effects: ["status → CLEAR"]

  - method: POST
    path: "/acquisition-deals/deals/{id}/properties/{propertyId}/flag"
    description: "Flag property"
    roles: [DueDiligenceOfficer]
    code: 200
    input: []
    output: Property
    side_effects: ["status → FLAGGED"]

  # --- Lease ---
  - method: POST
    path: "/acquisition-deals/deals/{id}/properties/{propertyId}/leases"
    description: "Create a lease on a property"
    roles: [AcquisitionsAnalyst]
    code: 201
    input: [tenant_id, lease_type, annual_base_rent_cents, lease_commencement_date, lease_expiration_date, "renewal_options_count?"]
    output: Lease
    side_effects: ["status = DRAFT"]

  - method: GET
