scenario: |
  489. Alcohol Beverage Control License (ABC): license type (on/off-premise,
  manufacturer) & quota, application & background/zoning, fee & renewal cycle,
  server/seller permit, violation & administrative action (suspension/fine),
  transfer/relocation, three-tier compliance & reporting, protest/hearing

domain_name: alcohol-beverage-control
api_prefix: /
# Flat topology: every entity is a root-level collection (/licenses, /applicants,
# /violations, ...). The API has no single nesting prefix, so api_prefix is the
# root "/"; each entity's collection segment is its own top-level path.

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions

  entity_topology: flat
  # Flat: peer entities linked by foreign keys. LicenseApplication, License,
  # ServerPermit, Violation, Protest, TransferRequest are all top-level
  # resources referencing each other and the configuration entities by FK.
  # No URL nesting beyond action sub-paths.

  state_machine_shape: branching
  # LicenseApplication branches on protest (DECISION fork: APPROVED vs
  # PROTEST_HEARING), and License has a cyclic renewal loop (ACTIVE -> ... ->
  # ACTIVE) plus a suspend/reinstate revert cycle. Multiple non-linear shapes
  # on different entities.

  relationship_patterns:
    - one_to_many        # QuotaRegion -> many LicenseApplication; License -> many ServerPermit
    - cross_aggregate    # Violation references License; Protest references LicenseApplication
    - flat_fk_references # every resource carries explicit FK fields

  role_model: segregation_of_duties
  # An Investigator who files a Violation cannot be the AdjudicationOfficer who
  # decides its AdministrativeAction. A LicensingExaminer who recommends an
  # application cannot be the Director who issues the license over a sustained
  # protest. Compliance-driven separation.

  consistency_model: immediate
  # All cascades (background check + zoning review synthesis, fee ledger debits,
  # quota counter increments) complete atomically within the triggering request.

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  # Configuration entities
  # ---------------------------------------------------------------------------
  - name: LicenseClass
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique class code, e.g. 'ON_47' (on-premise restaurant), 'OFF_21' (off-premise package), 'MFR_23' (manufacturer/brewery)."
        constraints: "Unique across all LicenseClass; immutable after creation; matches ^[A-Z]{2,3}_[0-9]{1,3}$."
      - name: premise_type
        type: enum
        source: input
        description: "Premise category this class authorizes."
        constraints: "One of {ON_PREMISE, OFF_PREMISE, MANUFACTURER}."
      - name: quota_managed
        type: boolean
        source: input
        description: "When true, issuance is capped by per-region population quota (see QuotaRegion). MANUFACTURER classes are typically quota_managed=false."
        default: true
      - name: base_fee_cents
        type: integer
        source: input
        description: "Base annual license fee in cents, before surcharges and proration."
        constraints: ">= 0."
      - name: renewal_cycle_months
        type: integer
        source: input
        description: "Length of one license term in months; renewal window opens 60 days before term end."
        constraints: "One of {12, 24, 36}."
      - name: requires_zoning
        type: boolean
        source: input
        description: "When true, an application for this class triggers a ZoningReview on submission. OFF_PREMISE and ON_PREMISE require zoning; MANUFACTURER does not."
        default: true
      - name: max_servers_per_license
        type: integer
        source: input
        description: "Maximum number of ACTIVE ServerPermits attachable to one License of this class (0 for OFF_PREMISE/MANUFACTURER which do not pour)."
        constraints: ">= 0."

  - name: QuotaRegion
    parent: null
    common_fields: true
    fields:
      - name: region_code
        type: string
        source: input
        description: "Unique region (county) code, e.g. 'CTY_LA'."
        constraints: "Unique across all QuotaRegion; immutable after creation."
      - name: population
        type: integer
        source: input
        description: "Census population used to derive per-class quota caps."
        constraints: ">= 0."
      - name: persons_per_license
        type: integer
        source: input
        description: "Population divisor: one quota slot per this many persons, for quota_managed classes."
        constraints: ">= 1."
      - name: moratorium
        type: boolean
        source: input
        description: "When true, no new quota_managed application may be SUBMITTED in this region regardless of available slots."
        default: false

  # ---------------------------------------------------------------------------
  # Actor-backed entity
  # ---------------------------------------------------------------------------
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal business/person name."
        constraints: "Non-empty."
      - name: disqualified
        type: boolean
        source: system
        description: "Set true when a background check returns FAILED for any of this applicant's applications; blocks future submissions."
        default: false
      - name: felony_flag
        type: boolean
        source: input
        description: "Self-declared prior felony conviction. Drives BackgroundCheck outcome simulation."
        default: false

  - name: Premise
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the owner of this premise."
      - name: region_code
        type: string
        source: input
        description: "FK -> QuotaRegion.region_code; the region the premise sits in. (region_code is QuotaRegion's natural key.)"
      - name: street_address
        type: string
        source: input
        description: "Physical address."
        constraints: "Non-empty."
      - name: distance_to_school_m
        type: integer
        source: input
        description: "Distance in metres to the nearest school/place of worship; used by ZoningReview's buffer rule."
        constraints: ">= 0."
      - name: zoning_district
        type: enum
        source: input
        description: "Local zoning district code."
        constraints: "One of {COMMERCIAL, MIXED_USE, RESIDENTIAL, INDUSTRIAL}."

  # ---------------------------------------------------------------------------
  # Core application resource
  # ---------------------------------------------------------------------------
  - name: LicenseApplication
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; who is applying."
      - name: premise_id
        type: string
        source: input
        description: "FK -> Premise.id; where the license would operate."
      - name: license_class_code
        type: string
        source: input
        description: "FK -> LicenseClass.code; the class requested. (code is LicenseClass's natural key.)"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state."
        default: DRAFT
        constraints: "One of {DRAFT, SUBMITTED, UNDER_REVIEW, PROTEST_PERIOD, PROTEST_HEARING, APPROVED, ISSUED, DENIED, WITHDRAWN}."
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when status entered SUBMITTED; null in DRAFT."
      - name: protest_period_ends_at
        type: datetime
        source: system
        description: "submitted_at + 30 days; the instant after which no new Protest may be filed. Null until SUBMITTED."
      - name: fee_quoted_cents
        type: integer
        source: computed
        description: "Total application fee computed at submission by the fee_assessment calculation (base + surcharges, prorated). Frozen once SUBMITTED."
      - name: fee_paid_cents
        type: integer
        source: system
        description: "Cumulative cents paid against fee_quoted_cents via payment endpoint."
        default: 0
      - name: quota_slot_held
        type: boolean
        source: system
        description: "True while this application holds a reserved quota slot in its region+class (reserved on SUBMITTED for quota_managed classes, released on DENIED/WITHDRAWN, converted to committed on ISSUED)."
        default: false
      - name: background_check_id
        type: string
        source: system
        description: "Back-reference id of the BackgroundCheck synthesized on SUBMITTED (the authoritative FK is BackgroundCheck.application_id -> LicenseApplication.id; this is a convenience 1:1 pointer, discoverable via GET /license-applications/{id}/background-checks). Null in DRAFT."
      - name: zoning_review_id
        type: string
        source: system
        description: "Back-reference id of the ZoningReview synthesized on SUBMITTED when the class requires_zoning (the authoritative FK is ZoningReview.application_id -> LicenseApplication.id; convenience 1:1 pointer, discoverable via GET /license-applications/{id}/zoning-reviews). Null otherwise."
      - name: examiner_user_id
        type: string
        source: system
        description: "X-User-ID of the LicensingExaminer who moved the application to UNDER_REVIEW (recommendation actor); used for segregation-of-duties against issuance."

  - name: BackgroundCheck
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: system
        description: "FK -> LicenseApplication.id; the application this check belongs to."
      - name: applicant_id
        type: string
        source: system
        description: "Denormalized applicant id (subject of the check), copied from the parent LicenseApplication.applicant_id; not an independent FK — the applicant is reached via the application. Discoverable via the application's own applicant_id."
      - name: result
        type: enum
        source: system
        description: "Outcome. Synthesized PENDING on creation; resolved by the resolve endpoint to PASSED or FAILED."
        default: PENDING
        constraints: "One of {PENDING, PASSED, FAILED}."
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock instant the check was resolved; null while PENDING."

  - name: ZoningReview
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: system
        description: "FK -> LicenseApplication.id; the application this review belongs to."
      - name: premise_id
        type: string
        source: system
        description: "Denormalized premise id (the premise reviewed), copied from the parent LicenseApplication.premise_id; not an independent FK — the premise is reached via the application."
      - name: result
        type: enum
        source: system
        description: "Outcome. PENDING on creation; CLEARED, VARIANCE_GRANTED, or BLOCKED after the zoning officer decides."
        default: PENDING
        constraints: "One of {PENDING, CLEARED, VARIANCE_GRANTED, BLOCKED}."
      - name: buffer_satisfied
        type: boolean
        source: computed
        description: "True iff Premise.distance_to_school_m >= the class's required buffer (see zoning_buffer_eval). Computed on creation."
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock instant the review was decided; null while PENDING."

  # ---------------------------------------------------------------------------
  # Protest / hearing
  # ---------------------------------------------------------------------------
  - name: Protest
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> LicenseApplication.id; the application protested."
      - name: protester_name
        type: string
        source: input
        description: "Name of the third party filing the protest."
        constraints: "Non-empty."
      - name: grounds
        type: enum
        source: input
        description: "Statutory ground cited."
        constraints: "One of {PUBLIC_NUISANCE, OVER_CONCENTRATION, ZONING, MORAL_CHARACTER}."
      - name: status
        type: enum
        source: system
        description: "Protest lifecycle."
        default: FILED
        constraints: "One of {FILED, SCHEDULED, SUSTAINED, OVERRULED, WITHDRAWN}."
      - name: hearing_id
        type: string
        source: system
        description: "Back-reference id of the Hearing scheduled to resolve this protest (1:1 convenience pointer; the hearing is discoverable via GET /protests/{id}/hearings). Null until SCHEDULED."

  - name: Hearing
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: system
        description: "FK -> LicenseApplication.id; the application under hearing."
      - name: room_code
        type: string
        source: input
        description: "Hearing room identifier; overlap rule forbids two hearings booking the same room in overlapping windows."
        constraints: "Non-empty."
      - name: starts_at
        type: datetime
        source: input
        description: "Logical-clock start instant of the hearing window (closed lower bound)."
      - name: ends_at
        type: datetime
        source: input
        description: "Logical-clock end instant of the hearing window (open upper bound). Must be > starts_at."
      - name: outcome
        type: enum
        source: system
        description: "Decision rendered at the hearing."
        default: PENDING
        constraints: "One of {PENDING, PROTEST_SUSTAINED, PROTEST_OVERRULED}."
      - name: officer_user_id
        type: string
        source: system
        description: "X-User-ID of the AdjudicationOfficer who rendered the outcome; null while PENDING."

  # ---------------------------------------------------------------------------
  # Issued license + renewal
  # ---------------------------------------------------------------------------
  - name: License
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: system
        description: "FK -> LicenseApplication.id; the originating application."
      - name: license_class_code
        type: string
        source: system
        description: "FK -> LicenseClass.code; class denormalized from the application. (code is LicenseClass's natural key.)"
      - name: region_code
        type: string
        source: system
        description: "FK -> QuotaRegion.region_code; region denormalized from the premise. (region_code is QuotaRegion's natural key.)"
      - name: status
        type: enum
        source: system
        description: "License lifecycle. Renews cyclically; can suspend/reinstate; revoke and expire are terminal."
        default: ACTIVE
        constraints: "One of {ACTIVE, RENEWAL_DUE, SUSPENDED, REVOKED, EXPIRED}."
      - name: term_start_at
        type: datetime
        source: system
        description: "Logical-clock start of the current term."
      - name: term_end_at
        type: datetime
        source: system
        description: "term_start_at + class.renewal_cycle_months; current term expiry."
      - name: renewal_window_opens_at
        type: datetime
        source: system
        description: "term_end_at - 60 days; the instant on/after which renewal is permitted."
      - name: renewal_count
        type: integer
        source: system
        description: "Number of completed renewals; starts at 0."
        default: 0
      - name: demerit_points
        type: integer
        source: system
        description: "Running disciplinary points from SUSTAINED violations; never below 0. Drives the suspension_threshold trigger."
        default: 0
      - name: active_server_count
        type: integer
        source: system
        description: "Count of attached ServerPermits in status ACTIVE; kept in sync as permits activate/revoke."
        default: 0
      - name: outstanding_fine_cents
        type: integer
        source: system
        description: "Sum of unpaid AdministrativeAction fines; renewal is blocked while > 0."
        default: 0

  - name: ServerPermit
    parent: null
    common_fields: true
    fields:
      - name: license_id
        type: string
        source: input
        description: "FK -> License.id; the license this permit pours under."
      - name: holder_name
        type: string
        source: input
        description: "Name of the server/seller."
        constraints: "Non-empty."
      - name: status
        type: enum
        source: system
        description: "Permit lifecycle."
        default: PENDING
        constraints: "One of {PENDING, ACTIVE, EXPIRED, REVOKED}."
      - name: training_completed
        type: boolean
        source: input
        description: "Whether the holder completed the responsible-beverage-service course (precondition for activation)."
        default: false
      - name: expires_at
        type: datetime
        source: system
        description: "Logical-clock instant the permit lapses (set to activation instant + 36 months on activation)."

  # ---------------------------------------------------------------------------
  # Enforcement
  # ---------------------------------------------------------------------------
  - name: Violation
    parent: null
    common_fields: true
    fields:
      - name: license_id
        type: string
        source: input
        description: "FK -> License.id; the cited license."
      - name: investigator_user_id
        type: string
        source: system
        description: "X-User-ID of the Investigator who filed; segregation-of-duties bars this user from adjudicating the resulting action."
      - name: severity
        type: enum
        source: input
        description: "Violation severity, drives demerit points and fine tier."
        constraints: "One of {MINOR, SERIOUS, EGREGIOUS}."
      - name: status
        type: enum
        source: system
        description: "Violation lifecycle."
        default: ALLEGED
        constraints: "One of {ALLEGED, CONTESTED, SUSTAINED, DISMISSED}."
      - name: action_id
        type: string
        source: system
        description: "Back-reference id of the AdministrativeAction created when SUSTAINED (the authoritative FK is AdministrativeAction.violation_id -> Violation.id; convenience 1:1 pointer, discoverable via GET /violations/{id}/administrative-actions). Null otherwise."

  - name: AdministrativeAction
    parent: null
    common_fields: true
    fields:
      - name: violation_id
        type: string
        source: system
        description: "FK -> Violation.id; the sustained violation this action enforces."
      - name: license_id
        type: string
        source: system
        description: "FK -> License.id; denormalized cited license."
      - name: action_type
        type: enum
        source: system
        description: "Enforcement type chosen by the adjudicator."
        constraints: "One of {FINE, SUSPENSION, REVOCATION}."
      - name: fine_cents
        type: integer
        source: computed
        description: "Fine amount in cents from the fine_assessment calculation; 0 for pure SUSPENSION/REVOCATION."
        default: 0
      - name: fine_paid_cents
        type: integer
        source: system
        description: "Cumulative cents paid against fine_cents."
        default: 0
      - name: suspension_days
        type: integer
        source: input
        description: "Length of suspension in days; 0 for FINE-only or REVOCATION."
        default: 0
        constraints: ">= 0."
      - name: adjudicator_user_id
        type: string
        source: system
        description: "X-User-ID of the AdjudicationOfficer; must differ from the Violation's investigator_user_id."

  - name: ComplianceReport
    parent: null
    common_fields: true
    fields:
      - name: license_id
        type: string
        source: input
        description: "FK -> License.id; the reporting license."
      - name: tier
        type: enum
        source: input
        description: "Three-tier classification of the reporting party."
        constraints: "One of {SUPPLIER, WHOLESALER, RETAILER}."
      - name: period_code
        type: string
        source: input
        description: "Reporting period, e.g. '2026-Q1'."
        constraints: "Non-empty; matches ^[0-9]{4}-Q[1-4]$."
      - name: gross_sales_cents
        type: integer
        source: input
        description: "Gross sales in the period, in cents."
        constraints: ">= 0."
      - name: excise_due_cents
        type: integer
        source: computed
        description: "Excise tax computed by the excise_assessment tiered calculation at submission."

  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - name: license_id
        type: string
        source: input
        description: "FK -> License.id; the license being transferred/relocated."
      - name: transfer_type
        type: enum
        source: input
        description: "OWNERSHIP transfers to a new applicant; LOCATION relocates to a new premise."
        constraints: "One of {OWNERSHIP, LOCATION}."
      - name: new_applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; required (and only allowed) when transfer_type=OWNERSHIP; null for LOCATION."
      - name: new_premise_id
        type: string
        source: input
        description: "FK -> Premise.id; required (and only allowed) when transfer_type=LOCATION; null for OWNERSHIP."
      - name: status
        type: enum
        source: system
        description: "Transfer lifecycle."
        default: PENDING
        constraints: "One of {PENDING, APPROVED, REJECTED}."

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: LicenseApplication
    initial_state: DRAFT
    terminal_states: [ISSUED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /license-applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "Applicant.disqualified == false"
          - "If LicenseClass.quota_managed: QuotaRegion.moratorium == false"
          - "If LicenseClass.quota_managed: region+class available quota slots > 0 (see quota_availability calc)"
        side_effects:
          - "Set submitted_at = clock.now; protest_period_ends_at = submitted_at + 30 days"
          - "Run fee_assessment -> freeze fee_quoted_cents"
          - "Synthesize BackgroundCheck (result=PENDING) -> set background_check_id"
          - "If LicenseClass.requires_zoning: synthesize ZoningReview (result=PENDING, buffer_satisfied computed via zoning_buffer_eval) -> set zoning_review_id"
          - "If LicenseClass.quota_managed: reserve a quota slot (set quota_slot_held=true); quota_availability now counts this application"
          - "increments LicenseApplication.version by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /license-applications/{id}/begin-review"
        actor: LicensingExaminer
        preconditions:
          - "BackgroundCheck.result == PASSED"
          - "If zoning_review_id set: ZoningReview.result IN {CLEARED, VARIANCE_GRANTED}"
        side_effects:
          - "Set examiner_user_id = X-User-ID (recommendation actor for segregation-of-duties)"
          - "increments LicenseApplication.version by 1"
      - from: UNDER_REVIEW
        to: PROTEST_PERIOD
        trigger: "POST /license-applications/{id}/open-protest-period"
        actor: LicensingExaminer
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "increments LicenseApplication.version by 1"
        note: "Opens the window in which Protests may be filed; window closes at protest_period_ends_at."
      - from: PROTEST_PERIOD
        to: APPROVED
        trigger: "POST /license-applications/{id}/approve"
        actor: Director
        preconditions:
          - "clock.now >= protest_period_ends_at (protest window elapsed)"
          - "No Protest for this application in status {FILED, SCHEDULED} (unresolved)"
          - "No Protest for this application in status SUSTAINED"
          - "X-User-ID != examiner_user_id (segregation of duties: issuer differs from recommender)"
        side_effects:
          - "increments LicenseApplication.version by 1"
      - from: PROTEST_PERIOD
        to: PROTEST_HEARING
        trigger: "POST /protests/{id}/schedule-hearing (cross-entity)"
        actor: AdjudicationOfficer
        preconditions:
          - "At least one Protest for this application in status FILED"
        side_effects:
          - "Application moves to PROTEST_HEARING (branch fork distinct from APPROVED)"
          - "increments LicenseApplication.version by 1"
      - from: PROTEST_HEARING
        to: PROTEST_PERIOD
        trigger: "POST /hearings/{id}/render (outcome=PROTEST_OVERRULED, cross-entity)"
        actor: AdjudicationOfficer
        preconditions:
          - "Hearing.application_id == this application"
        side_effects:
          - "Protest -> OVERRULED; application returns to PROTEST_PERIOD so Director may approve (branch rejoin)"
          - "increments LicenseApplication.version by 1"
      - from: PROTEST_HEARING
        to: DENIED
        trigger: "POST /hearings/{id}/render (outcome=PROTEST_SUSTAINED, cross-entity)"
        actor: AdjudicationOfficer
        preconditions:
          - "Hearing.application_id == this application"
        side_effects:
          - "Protest -> SUSTAINED; application DENIED"
          - "If quota_slot_held: release reserved quota slot (set quota_slot_held=false) -> region quota frees by one"
          - "increments LicenseApplication.version by 1"
      - from: APPROVED
        to: ISSUED
        trigger: "POST /license-applications/{id}/issue"
        actor: Director
        preconditions:
          - "fee_paid_cents >= fee_quoted_cents (fee fully paid)"
          - "X-User-ID != examiner_user_id (segregation of duties)"
        side_effects:
          - "Create License (status=ACTIVE, term_start_at=clock.now, term_end_at=now+renewal_cycle_months, renewal_window_opens_at=term_end_at-60d)"
          - "If quota_slot_held: convert reservation to committed (quota_slot_held stays true; counts as ISSUED in quota_availability)"
          - "increments LicenseApplication.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /license-applications/{id}/withdraw"
        actor: Applicant
        preconditions: ["status == DRAFT"]
        side_effects:
          - "increments LicenseApplication.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /license-applications/{id}/withdraw"
        actor: Applicant
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "If quota_slot_held: release reserved quota slot (set quota_slot_held=false)"
          - "increments LicenseApplication.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /license-applications/{id}/deny"
        actor: Director
        preconditions:
          - "X-User-ID != examiner_user_id (segregation of duties)"
        side_effects:
          - "If quota_slot_held: release reserved quota slot (set quota_slot_held=false)"
          - "increments LicenseApplication.version by 1"

  # ---------------------------------------------------------------------------
  - entity: BackgroundCheck
    initial_state: PENDING
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /background-checks/{id}/resolve (decision=PASS)"
        actor: LicensingExaminer
        preconditions:
          - "Applicant.felony_flag == false (a PASS decision against a felony_flag applicant is rejected)"
        side_effects:
          - "Set result=PASSED, resolved_at=clock.now"
          - "increments BackgroundCheck.version by 1"
      - from: PENDING
        to: FAILED
        trigger: "POST /background-checks/{id}/resolve (decision=FAIL)"
        actor: LicensingExaminer
        preconditions: []
        side_effects:
          - "Set result=FAILED, resolved_at=clock.now"
          - "Set Applicant.disqualified=true (cross-entity cascade hop 1)"
          - "increments BackgroundCheck.version by 1"

  # ---------------------------------------------------------------------------
  - entity: ZoningReview
    initial_state: PENDING
    terminal_states: [CLEARED, VARIANCE_GRANTED, BLOCKED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /zoning-reviews/{id}/decide (decision=CLEAR)"
        actor: ZoningOfficer
        preconditions:
          - "buffer_satisfied == true (cannot CLEAR when buffer fails; must use VARIANCE or BLOCK)"
        side_effects:
          - "Set result=CLEARED, resolved_at=clock.now"
          - "increments ZoningReview.version by 1"
      - from: PENDING
        to: VARIANCE_GRANTED
        trigger: "POST /zoning-reviews/{id}/decide (decision=VARIANCE)"
        actor: ZoningOfficer
        preconditions:
          - "Premise.zoning_district != RESIDENTIAL (no variance into residential)"
        side_effects:
          - "Set result=VARIANCE_GRANTED, resolved_at=clock.now"
          - "increments ZoningReview.version by 1"
      - from: PENDING
        to: BLOCKED
        trigger: "POST /zoning-reviews/{id}/decide (decision=BLOCK)"
        actor: ZoningOfficer
        preconditions: []
        side_effects:
          - "Set result=BLOCKED, resolved_at=clock.now"
          - "increments ZoningReview.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Protest
    initial_state: FILED
    terminal_states: [SUSTAINED, OVERRULED, WITHDRAWN]
    transitions:
      - from: FILED
        to: SCHEDULED
        trigger: "POST /protests/{id}/schedule-hearing"
        actor: AdjudicationOfficer
        preconditions:
          - "LicenseApplication.status == PROTEST_PERIOD"
          - "Hearing room window does not overlap an existing Hearing in the same room (see hearing_room_overlap)"
        side_effects:
          - "Create Hearing (outcome=PENDING) -> set hearing_id"
          - "Application: PROTEST_PERIOD -> PROTEST_HEARING (cross-entity)"
          - "increments Protest.version by 1"
      - from: SCHEDULED
        to: SUSTAINED
        trigger: "POST /hearings/{id}/render (outcome=PROTEST_SUSTAINED)"
        actor: AdjudicationOfficer
        preconditions:
          - "Hearing.outcome == PENDING"
        side_effects:
          - "Application: PROTEST_HEARING -> DENIED (cross-entity)"
          - "increments Protest.version by 1"
      - from: SCHEDULED
        to: OVERRULED
        trigger: "POST /hearings/{id}/render (outcome=PROTEST_OVERRULED)"
        actor: AdjudicationOfficer
        preconditions:
          - "Hearing.outcome == PENDING"
        side_effects:
          - "Application: PROTEST_HEARING -> PROTEST_PERIOD (cross-entity, branch rejoin)"
          - "increments Protest.version by 1"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /protests/{id}/withdraw"
        actor: Director
        preconditions: ["status == FILED"]
        side_effects:
          - "increments Protest.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Hearing
    initial_state: PENDING
    terminal_states: [PROTEST_SUSTAINED, PROTEST_OVERRULED]
    transitions:
      - from: PENDING
        to: PROTEST_SUSTAINED
        trigger: "POST /hearings/{id}/render (outcome=PROTEST_SUSTAINED)"
        actor: AdjudicationOfficer
        preconditions:
          - "clock.now >= Hearing.starts_at"
        side_effects:
          - "Set officer_user_id=X-User-ID; Protest -> SUSTAINED; Application -> DENIED; release quota slot if held"
          - "increments Hearing.version by 1"
      - from: PENDING
        to: PROTEST_OVERRULED
        trigger: "POST /hearings/{id}/render (outcome=PROTEST_OVERRULED)"
        actor: AdjudicationOfficer
        preconditions:
          - "clock.now >= Hearing.starts_at"
        side_effects:
          - "Set officer_user_id=X-User-ID; Protest -> OVERRULED; Application -> PROTEST_PERIOD"
          - "increments Hearing.version by 1"

  # ---------------------------------------------------------------------------
  - entity: License
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: RENEWAL_DUE
        trigger: "POST /_clock/set_current_utc (system: clock crosses renewal_window_opens_at) then GET re-evaluates; or POST /licenses/{id}/check-renewal-window"
        actor: system
        preconditions:
          - "clock.now >= renewal_window_opens_at"
        side_effects:
          - "increments License.version by 1"
        note: "Posture flip; child ServerPermit operations remain allowed but renewal is now actionable."
      - from: RENEWAL_DUE
        to: ACTIVE
        trigger: "POST /licenses/{id}/renew"
        actor: Applicant
        preconditions:
          - "clock.now >= renewal_window_opens_at"
          - "outstanding_fine_cents == 0 (no unpaid fines)"
          - "demerit_points < 10 (suspension threshold not breached)"
          - "renewal_fee fully paid (renewal payment recorded; see fee_assessment renewal variant)"
        side_effects:
          - "term_start_at = term_end_at (old); term_end_at = old term_end_at + renewal_cycle_months; renewal_window_opens_at = new term_end_at - 60d"
          - "renewal_count += 1"
          - "increments License.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /administrative-actions/{id}/enforce (cross-entity, action_type=SUSPENSION) OR suspension_threshold auto-trigger"
        actor: AdjudicationOfficer
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "All attached ServerPermits in status ACTIVE -> SUSPENDED-equivalent: set to EXPIRED (cross-entity cascade hop), active_server_count -> 0"
          - "increments License.version by 1"
        note: "Suspension cascades to pourers; see cross-entity cascade chain."
      - from: RENEWAL_DUE
        to: SUSPENDED
        trigger: "POST /administrative-actions/{id}/enforce (action_type=SUSPENSION)"
        actor: AdjudicationOfficer
        preconditions:
          - "status == RENEWAL_DUE"
        side_effects:
          - "Attached ACTIVE ServerPermits -> EXPIRED; active_server_count -> 0"
          - "increments License.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /licenses/{id}/reinstate"
        actor: Director
        preconditions:
          - "outstanding_fine_cents == 0"
          - "demerit_points < 10"
        side_effects:
          - "increments License.version by 1"
        note: "Reinstatement does NOT auto-restore server permits (they were EXPIRED, terminal); holder must re-apply."
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /administrative-actions/{id}/enforce (action_type=REVOCATION)"
        actor: AdjudicationOfficer
        preconditions:
          - "status IN {ACTIVE, SUSPENDED, RENEWAL_DUE}"
        side_effects:
          - "Attached ACTIVE ServerPermits -> REVOKED; active_server_count -> 0; release nothing (terminal license)"
          - "increments License.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /administrative-actions/{id}/enforce (action_type=REVOCATION)"
        actor: AdjudicationOfficer
        preconditions:
          - "status IN {ACTIVE, SUSPENDED, RENEWAL_DUE}"
        side_effects:
          - "increments License.version by 1"
      - from: RENEWAL_DUE
        to: EXPIRED
        trigger: "POST /licenses/{id}/check-renewal-window (system: clock.now >= term_end_at and not renewed)"
        actor: system
        preconditions:
          - "clock.now >= term_end_at"
        side_effects:
          - "Attached ACTIVE ServerPermits -> EXPIRED; active_server_count -> 0"
          - "increments License.version by 1"

  # ---------------------------------------------------------------------------
  - entity: ServerPermit
    initial_state: PENDING
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /server-permits/{id}/activate"
        actor: Applicant
        preconditions:
          - "training_completed == true"
          - "License.status == ACTIVE"
          - "License.active_server_count < LicenseClass.max_servers_per_license"
        side_effects:
          - "Set expires_at = clock.now + 36 months"
          - "License.active_server_count += 1 (bubble-up to parent license)"
          - "increments ServerPermit.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /server-permits/{id}/revoke"
        actor: Director
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "License.active_server_count -= 1 (bubble-up)"
          - "increments ServerPermit.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /server-permits/{id}/check-expiry (system: clock.now >= expires_at) OR license suspend/revoke/expire cascade"
        actor: system
        preconditions: ["clock.now >= expires_at OR parent license left ACTIVE"]
        side_effects:
          - "License.active_server_count -= 1 (bubble-up, floored at 0)"
          - "increments ServerPermit.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Violation
    initial_state: ALLEGED
    terminal_states: [SUSTAINED, DISMISSED]
    transitions:
      - from: ALLEGED
        to: CONTESTED
        trigger: "POST /violations/{id}/contest"
        actor: Applicant
        preconditions: ["status == ALLEGED"]
        side_effects:
          - "increments Violation.version by 1"
      - from: ALLEGED
        to: SUSTAINED
        trigger: "POST /violations/{id}/sustain"
        actor: AdjudicationOfficer
        preconditions:
          - "X-User-ID != investigator_user_id (segregation of duties: adjudicator differs from filer)"
        side_effects:
          - "Create AdministrativeAction (action_type from request) -> set action_id; run fine_assessment -> fine_cents (cascade hop 1)"
          - "License.demerit_points += demerit_for(severity) (cascade hop 2)"
          - "License.outstanding_fine_cents += fine_cents (cascade hop 2, ledger sync)"
          - "If License.demerit_points >= 10 (suspension_threshold): License ACTIVE/RENEWAL_DUE -> SUSPENDED (cascade hop 3); ACTIVE ServerPermits -> EXPIRED, active_server_count -> 0 (cascade hop 4)"
          - "increments Violation.version by 1"
      - from: CONTESTED
        to: SUSTAINED
        trigger: "POST /violations/{id}/sustain"
        actor: AdjudicationOfficer
        preconditions:
          - "X-User-ID != investigator_user_id (segregation of duties)"
        side_effects:
          - "Same cascade as ALLEGED -> SUSTAINED"
          - "increments Violation.version by 1"
      - from: CONTESTED
        to: DISMISSED
        trigger: "POST /violations/{id}/dismiss"
        actor: AdjudicationOfficer
        preconditions:
          - "X-User-ID != investigator_user_id (segregation of duties)"
        side_effects:
          - "increments Violation.version by 1"

  # ---------------------------------------------------------------------------
  - entity: TransferRequest
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /transfer-requests/{id}/approve"
        actor: Director
        preconditions:
          - "License.status == ACTIVE"
          - "License.outstanding_fine_cents == 0"
          - "If transfer_type=OWNERSHIP: new Applicant.disqualified == false"
          - "If transfer_type=LOCATION: new Premise.region_code == License.region_code (no cross-region relocation; quota tied to region)"
          - "If transfer_type=LOCATION: the target Premise must not already host a non-terminal License of the SAME license_class_code whose term window [term_start_at, term_end_at] (CLOSED interval, both endpoints inclusive) overlaps this license's term window (see premise_term_overlap)"
        side_effects:
          - "If OWNERSHIP: License.application's applicant association updates to new_applicant_id (denormalized)"
          - "If LOCATION: relocate premise (no region change permitted)"
          - "increments TransferRequest.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /transfer-requests/{id}/reject"
        actor: Director
        preconditions: ["status == PENDING"]
        side_effects:
          - "increments TransferRequest.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: quota-reserve-stale-region
    parent_entity: QuotaRegion
    write_endpoint: "POST /license-applications/{id}/submit"
    occ_field: "expected_region_version"
    description: |
      Submitting a quota_managed application reserves one of the region's
      finite quota slots and advances the region's version. A submit whose
      expected_region_version is older than the region's current version is
      rejected: the client's view of how many slots remain is stale because
      another submit (or a slot release) has since mutated the region. This is
      the canonical CREATE-with-supersede race — a second submit observing the
      same slot count would itself legitimately reserve, so OCC on the region
      version is required to make the last-slot contention deterministic.
    error_id: ERR_STALE_REGION_VERSION
    http_status: 412

  - rule_id: server-activate-stale-license
    parent_entity: License
    write_endpoint: "POST /server-permits/{id}/activate"
    occ_field: "expected_license_version"
    description: |
      Activating a ServerPermit consumes one of the license's finite
      max_servers_per_license capacity slots and advances the license version.
      An activate carrying an expected_license_version older than the license's
      current version is rejected: another permit activation (or a violation
      cascade that suspended the license and zeroed the server count) has since
      mutated the license, so the client's view of remaining server capacity is
      stale. OCC on the license version makes last-seat contention
      deterministic.
    error_id: ERR_STALE_LICENSE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- Rule 1 instance A (cost accounting on LicenseApplication) ---
  # --- Rule 2 instance (b): nested rounding order pinned ---
  - name: fee_assessment
    trigger: "On POST /license-applications/{id}/submit (freezes fee_quoted_cents); renewal variant on POST /licenses/{id}/renew"
    algorithm: forward_looking
    formula: |
      # Forward-looking initial application fee at SUBMIT.
      base = LicenseClass.base_fee_cents
      # Surcharge tiers stack additively, each computed as a percentage of base.
      zoning_surcharge   = requires_zoning ? round_half_up(base * 0.10) : 0
      manufacturer_surch = (premise_type == MANUFACTURER) ? round_half_up(base * 0.25) : 0
      # Proration: applications submitted into a region with moratorium recently
      # lifted get NO proration; standard new apps pay the full first term.
      # ROUNDING ORDER (PINNED): round EACH surcharge to whole cents FIRST,
      # THEN sum. "round-per-component then add", NOT "sum then round".
      fee_quoted_cents = base + zoning_surcharge + manufacturer_surch
    input_set: "Single LicenseApplication + its LicenseClass; no aggregation."
    constants:
      ZONING_SURCHARGE_PCT: 0.10
      MANUFACTURER_SURCHARGE_PCT: 0.25
    precision: "Whole cents, round_half_up; round each surcharge component independently BEFORE summing."
    variants:
      - name: initial_application
        when: "status DRAFT -> SUBMITTED"
        difference: "Full base + all applicable surcharges; this is fee_quoted_cents."
      - name: renewal
        when: "status RENEWAL_DUE -> ACTIVE via renew"
        difference: "Renewal fee = base only (NO surcharges) PLUS a late fee of round_half_up(base * 0.05) IF clock.now >= term_end_at at renewal (grace lapsed). Surcharges are one-time at first issuance, not re-charged on renewal."

  # --- Rule 1 instance B (risk/disciplinary scoring on License) ---
  # --- Rule 2 instance (a): >=3 inputs, nested min/max + conditional branches ---
  - name: fine_assessment
    trigger: "On Violation ALLEGED/CONTESTED -> SUSTAINED, computing AdministrativeAction.fine_cents"
    algorithm: weighted_scoring
    formula: |
      # Disciplinary fine for a sustained violation. THREE inputs interact
      # non-linearly: severity tier, the license's prior demerit_points
      # (recidivism), and the chosen action_type.
      sev_base = { MINOR: 25000, SERIOUS: 75000, EGREGIOUS: 200000 }[severity]
      # Recidivism multiplier from CURRENT demerit_points (BEFORE this violation
      # adds its own points): 1.0 if < 4 points, 1.5 if 4..8, 2.0 if > 8.
      recidivism = (demerit_points > 8) ? 2.0 : ((demerit_points >= 4) ? 1.5 : 1.0)
      raw = sev_base * recidivism
      # Action-type interaction: REVOCATION carries no monetary fine; SUSPENSION
      # halves the fine (the suspension itself is the primary penalty); FINE pays full.
      if action_type == REVOCATION: fine_cents = 0
      elif action_type == SUSPENSION: fine_cents = round_half_up(raw * 0.5)
      else: fine_cents = round_half_up(raw)
      # Statutory cap: a single fine never exceeds 500000 cents.
      fine_cents = min(fine_cents, 500000)
    input_set: "Single Violation + its License's demerit_points snapshot taken BEFORE this violation's points are added + requested action_type."
    constants:
      MINOR_BASE: 25000
      SERIOUS_BASE: 75000
      EGREGIOUS_BASE: 200000
      RECIDIVISM_MID: 1.5
      RECIDIVISM_HIGH: 2.0
      FINE_CAP_CENTS: 500000
    precision: "Whole cents, round_half_up; apply cap AFTER rounding."
    variants:
      - name: demerit_for
        when: "Same sustain transition, computing demerit points to add to License.demerit_points"
        difference: "Demerit points added = { MINOR: 2, SERIOUS: 4, EGREGIOUS: 6 }[severity]; independent of fine_cents and action_type."

  # --- Rule 2 instance (c): circular-looking dependency, evaluation order pinned ---
  - name: excise_assessment
    trigger: "On POST /compliance-reports (three-tier reporting), computing excise_due_cents"
    algorithm: tiered_pricing
    formula: |
      # Tiered excise on gross_sales_cents, with a tier-dependent compliance
      # rebate that is itself keyed on the tier the TOTAL falls into — a
      # circular-looking dependency resolved by PINNED evaluation order:
      #   STEP 1: compute marginal tiered excise over gross_sales_cents.
      #   STEP 2: determine rebate tier from the STEP-1 excise (not from sales).
      #   STEP 3: apply rebate; final = excise - rebate.
      # Marginal tiers on gross_sales_cents (cents):
      #   first 1_000_000      @ 2%
      #   next  4_000_000      @ 4%   (i.e. 1_000_001 .. 5_000_000)
      #   above 5_000_000      @ 6%
      excise = 0
      t1 = min(gross_sales_cents, 1_000_000)
      t2 = min(max(gross_sales_cents - 1_000_000, 0), 4_000_000)
      t3 = max(gross_sales_cents - 5_000_000, 0)
      excise = round_half_up(t1*0.02) + round_half_up(t2*0.04) + round_half_up(t3*0.06)
      # Compliance rebate keyed on the EXCISE tier (STEP 2):
      #   excise <= 50_000        -> rebate 0
      #   50_001 .. 200_000       -> rebate = round_half_up(excise * 0.05)
      #   excise > 200_000        -> rebate = round_half_up(excise * 0.10)
      # SUPPLIER tier gets DOUBLE rebate; WHOLESALER standard; RETAILER none.
      tier_mult = { SUPPLIER: 2.0, WHOLESALER: 1.0, RETAILER: 0.0 }[tier]
      rebate_base = (excise > 200_000) ? round_half_up(excise*0.10)
                    : (excise > 50_000) ? round_half_up(excise*0.05) : 0
      rebate = round_half_up(rebate_base * tier_mult)
      excise_due_cents = max(excise - rebate, 0)
    input_set: "Single ComplianceReport: gross_sales_cents + tier."
    constants:
      TIER1_CAP: 1000000
      TIER2_CAP: 4000000
      TIER1_RATE: 0.02
      TIER2_RATE: 0.04
      TIER3_RATE: 0.06
    precision: "Whole cents, round_half_up; round each tier band BEFORE summing (per-band rounding), then rebate."

  # --- Quota availability (drives quota allocation + boundary checks) ---
  - name: quota_availability
    trigger: "On POST /license-applications/{id}/submit precondition; on GET /quota-regions/{id}/quota-status"
    algorithm: aggregation
    formula: |
      # For a given (region_code, license_class_code) with quota_managed=true:
      cap = floor(QuotaRegion.population / QuotaRegion.persons_per_license)
      # Used = applications HOLDING a slot: status IN {SUBMITTED, UNDER_REVIEW,
      # PROTEST_PERIOD, PROTEST_HEARING, APPROVED, ISSUED} AND quota_slot_held=true
      # for this region+class. DENIED/WITHDRAWN/DRAFT do NOT count.
      used = count(LicenseApplication where region_code==R and license_class_code==C
                   and quota_slot_held==true)
      available = cap - used
      # A new submit is permitted iff available > 0 (strict). available==0 blocks.
    input_set: "All LicenseApplications in region R for class C with quota_slot_held==true."
    constants: {}
    precision: "Integer counts; cap uses floor division."

  # --- Zoning buffer (drives ZoningReview.buffer_satisfied + a boundary check) ---
  - name: zoning_buffer_eval
    trigger: "On ZoningReview synthesis at application SUBMIT, computing buffer_satisfied"
    algorithm: threshold
    formula: |
      # Required separation buffer (metres) from nearest school/place of worship,
      # by the requested class's premise_type:
      #   ON_PREMISE, OFF_PREMISE -> 100 metres
      #   MANUFACTURER            -> 0 metres
      required = (LicenseClass.premise_type == MANUFACTURER) ? 0 : 100
      # Boundary is inclusive: distance EXACTLY equal to required SATISFIES.
      buffer_satisfied = (Premise.distance_to_school_m >= required)
    input_set: "Single Premise + its application's LicenseClass."
    constants:
      BUFFER_METRES: 100
    precision: "Integer metres; >= comparison (boundary inclusive)."

  # --- Premise term overlap (second temporal-overlap rule; CLOSED intervals) ---
  - name: premise_term_overlap
    trigger: "On POST /transfer-requests/{id}/approve when transfer_type==LOCATION, against the target new_premise_id"
    algorithm: interval_merge
    formula: |
      # CLOSED-interval overlap on License.term over a Premise. Two closed
      # windows [a_start, a_end] and [b_start, b_end] CONFLICT iff
      #   a_start <= b_end AND b_start <= a_end
      # (touching at a single endpoint COUNTS as a conflict — distinct from the
      # half-open hearing-room rule where touching is allowed).
      # Candidate set: Licenses with status IN {ACTIVE, RENEWAL_DUE, SUSPENDED}
      # AND license_class_code == relocating_license.license_class_code AND
      # currently located at the target premise (region_code denormalized; a
      # license is "at" a premise once a LOCATION transfer to it is APPROVED, or
      # at its originating application's premise).
      conflict = exists L in candidates where
        relocating.term_start_at <= L.term_end_at AND
        L.term_start_at <= relocating.term_end_at
      # conflict==true -> reject ERR_PREMISE_TERM_CONFLICT
    input_set: "Non-terminal Licenses of the same class at the target premise."
    constants: {}
    precision: "Datetime comparison on logical-clock instants; closed intervals (inclusive endpoints)."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a recognised role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /protests (anonymous public protest allowed)"

  - priority: 2
    category: auth
    check: "Acting role is permitted for the endpoint per the RBAC matrix."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist (Applicant, Premise, LicenseClass, QuotaRegion, LicenseApplication, License, Protest, Hearing, Violation, etc.), validated left-to-right in the path then body FKs."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is defined (state-machine from-set)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID must differ from the conflicting prior actor (issuer != examiner on approve/issue/deny; adjudicator != investigator on sustain/dismiss)."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /license-applications/{id}/approve, /issue, /deny; POST /violations/{id}/sustain, /dismiss"

  - priority: 6
    category: business_safety
    check: "An applicant flagged disqualified=true may not submit a new application; a PASS background decision against a felony_flag applicant is rejected."
    error_id: ERR_APPLICANT_DISQUALIFIED
    http_status: 422
    applies_to: "POST /license-applications/{id}/submit, POST /background-checks/{id}/resolve"

  - priority: 7
    category: business_constraint
    check: "Zoning: for requires_zoning classes, the application may not advance to UNDER_REVIEW unless its ZoningReview.result IN {CLEARED, VARIANCE_GRANTED}; BLOCKED zoning bars review."
    error_id: ERR_ZONING_NOT_CLEARED
    http_status: 422
    applies_to: "POST /license-applications/{id}/begin-review"

  - priority: 8
    category: business_constraint
    check: "Background: the application may not advance to UNDER_REVIEW unless BackgroundCheck.result == PASSED."
    error_id: ERR_BACKGROUND_NOT_PASSED
    http_status: 422
    applies_to: "POST /license-applications/{id}/begin-review"

  - priority: 9
    category: business_temporal
    check: "Protest window: a Protest may only be filed while clock.now < LicenseApplication.protest_period_ends_at AND application.status IN {PROTEST_PERIOD}. Filing after the window closes is rejected."
    error_id: ERR_PROTEST_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /protests"

  - priority: 10
    category: business_temporal
    check: "Approval timing: Director may not approve until clock.now >= protest_period_ends_at (protest window must have fully elapsed)."
    error_id: ERR_PROTEST_WINDOW_OPEN
    http_status: 422
    applies_to: "POST /license-applications/{id}/approve"

  - priority: 11
    category: business_constraint
    check: "Unresolved/sustained protest: Director may not approve while any Protest for the application is in {FILED, SCHEDULED, SUSTAINED}."
    error_id: ERR_PROTEST_UNRESOLVED
    http_status: 422
    applies_to: "POST /license-applications/{id}/approve"

  - priority: 12
    category: business_temporal
    check: "Hearing room overlap: a scheduled Hearing window [starts_at, ends_at) must not overlap an existing PENDING/decided Hearing in the same room_code; adjacency (one ends exactly where the next starts) is allowed (half-open)."
    error_id: ERR_HEARING_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /protests/{id}/schedule-hearing"

  - priority: 13
    category: business_constraint
    check: "Server capacity: a ServerPermit may activate only if License.active_server_count < LicenseClass.max_servers_per_license."
    error_id: ERR_SERVER_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /server-permits/{id}/activate"

  - priority: 14
    category: business_constraint
    check: "Server training: a ServerPermit may activate only if training_completed == true."
    error_id: ERR_TRAINING_INCOMPLETE
    http_status: 422
    applies_to: "POST /server-permits/{id}/activate"

  - priority: 15
    category: business_temporal
    check: "Renewal window: a License may only renew when clock.now >= renewal_window_opens_at and status == RENEWAL_DUE."
    error_id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /licenses/{id}/renew"

  - priority: 16
    category: business_fiscal
    check: "Outstanding fine: a License may not renew, reinstate, or be transferred while outstanding_fine_cents > 0."
    error_id: ERR_OUTSTANDING_FINE
    http_status: 422
    applies_to: "POST /licenses/{id}/renew, /reinstate; POST /transfer-requests/{id}/approve"

  - priority: 17
    category: business_constraint
    check: "Demerit threshold: a License with demerit_points >= 10 may not renew or reinstate (must clear discipline)."
    error_id: ERR_DEMERIT_THRESHOLD
    http_status: 422
    applies_to: "POST /licenses/{id}/renew, /reinstate"

  - priority: 18
    category: business_fiscal
    check: "Issuance fee: a LicenseApplication may not be issued until fee_paid_cents >= fee_quoted_cents."
    error_id: ERR_FEE_UNPAID
    http_status: 422
    applies_to: "POST /license-applications/{id}/issue"

  - priority: 19
    category: business_fiscal
    check: "Quota: a quota_managed application may not be SUBMITTED when region+class available slots == 0, or when the region is under moratorium."
    error_id: ERR_QUOTA_EXHAUSTED
    http_status: 422
    applies_to: "POST /license-applications/{id}/submit"

  - priority: 20
    category: business_constraint
    check: "Transfer type integrity: OWNERSHIP requires new_applicant_id and forbids new_premise_id; LOCATION requires new_premise_id and forbids new_applicant_id; LOCATION premise must be in the same region as the license."
    error_id: ERR_TRANSFER_TYPE_INVALID
    http_status: 422
    applies_to: "POST /transfer-requests, POST /transfer-requests/{id}/approve"

  - priority: 21
    category: business_temporal
    check: "Premise term overlap (LOCATION transfer approve): the target Premise must not already host a non-terminal License (status IN {ACTIVE, RENEWAL_DUE, SUSPENDED}) of the SAME license_class_code whose closed term window [term_start_at, term_end_at] overlaps the relocating license's closed term window. Closed-interval semantics: windows touching exactly at an endpoint (one's term_end_at == other's term_start_at) DO conflict."
    error_id: ERR_PREMISE_TERM_CONFLICT
    http_status: 409
    applies_to: "POST /transfer-requests/{id}/approve"

  - priority: 22
    category: business_referential
    check: "Required body fields present and well-typed; enum members valid; numeric fields satisfy declared constraints; ends_at > starts_at on hearings."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 23
    category: state
    check: "OCC: expected_region_version / expected_license_version must equal the parent's current version on the quota-reserve and server-activate writes."
    error_id: ERR_STALE_REGION_VERSION
    http_status: 412
    applies_to: "POST /license-applications/{id}/submit, POST /server-permits/{id}/activate"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-01-01T00:00:00Z; before any call to this endpoint the clock reads exactly that default and never falls back to wall-clock time. All deadline/window/expiry rules read this clock."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator]
    code: 200
    input: [to_iso8601]
    output: "{ now: datetime }"
    side_effects: ["Logical clock advances; does NOT auto-fire scheduled transitions — call check-renewal-window / check-expiry to re-evaluate."]

  # --- Configuration ---
  - method: POST
    path: "/license-classes"
    description: "Create a license class (configuration)."
    roles: [Director]
    code: 201
    input: [code, premise_type, "quota_managed?", base_fee_cents, renewal_cycle_months, "requires_zoning?", max_servers_per_license]
    output: LicenseClass
    side_effects: []
  - method: GET
    path: "/license-classes/{id}"
    description: "Fetch a license class by id."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: []
    output: LicenseClass
    side_effects: []
  - method: GET
    path: "/license-classes"
    description: "List license classes."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: ["limit?", "offset?", "code?"]
    output: LicenseClass[]
    side_effects: []

  - method: POST
    path: "/quota-regions"
    description: "Create a quota region (configuration)."
    roles: [Director]
    code: 201
    input: [region_code, population, persons_per_license, "moratorium?"]
    output: QuotaRegion
    side_effects: []
  - method: GET
    path: "/quota-regions/{id}"
    description: "Fetch a quota region by id."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: []
    output: QuotaRegion
    side_effects: []
  - method: GET
    path: "/quota-regions"
    description: "List/filter quota regions (filter by region_code natural key)."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: ["limit?", "offset?", "region_code?"]
    output: QuotaRegion[]
    side_effects: []
  - method: GET
    path: "/quota-regions/{id}/quota-status"
    description: "Computed read: per-class quota cap/used/available for this region (runs quota_availability)."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: [license_class_code]
    output: "{ region_code: string, license_class_code: string, cap: integer, used: integer, available: integer }"
    side_effects: []
  - method: PATCH
    path: "/quota-regions/{id}/moratorium"
    description: "Toggle a region moratorium; bumps QuotaRegion.version."
    roles: [Director]
    code: 200
    input: [moratorium, expected_region_version]
    output: QuotaRegion
    side_effects: ["Sets moratorium; increments QuotaRegion.version by 1"]

  # --- Applicants & premises ---
  - method: POST
    path: "/applicants"
    description: "Register an applicant."
    roles: [Director, LicensingExaminer]
    code: 201
    input: [legal_name, "felony_flag?"]
    output: Applicant
    side_effects: []
  - method: GET
    path: "/applicants/{id}"
    description: "Fetch applicant."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: []
    output: Applicant
    side_effects: []
  - method: GET
    path: "/applicants/{id}/premises"
    description: "Reverse-reachability: list premises owned by this applicant."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: Premise[]
    side_effects: []
  - method: GET
    path: "/applicants/{id}/applications"
    description: "Reverse-reachability: list applications filed by this applicant."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: LicenseApplication[]
    side_effects: []

  - method: POST
    path: "/premises"
    description: "Register a premise for an applicant in a region."
    roles: [Director, LicensingExaminer, Applicant]
    code: 201
    input: [applicant_id, region_code, street_address, distance_to_school_m, zoning_district]
    output: Premise
    side_effects: []
  - method: GET
    path: "/premises/{id}"
    description: "Fetch premise."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: []
    output: Premise
    side_effects: []

  # --- License applications ---
  - method: POST
    path: "/license-applications"
    description: "Create a DRAFT application."
    roles: [Director, LicensingExaminer, Applicant]
    code: 201
    input: [applicant_id, premise_id, license_class_code]
    output: LicenseApplication
    side_effects: ["Application created in DRAFT"]
  - method: GET
    path: "/license-applications/{id}"
    description: "Fetch application (includes fee_quoted_cents, status, FKs to checks/reviews)."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: []
    output: LicenseApplication
    side_effects: []
  - method: GET
    path: "/license-applications"
    description: "List/filter applications by applicant, premise, class, status."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: ["limit?", "offset?", "applicant_id?", "premise_id?", "license_class_code?", "status?"]
    output: LicenseApplication[]
    side_effects: []
  - method: POST
    path: "/license-applications/{id}/submit"
    description: "DRAFT -> SUBMITTED: freeze fee, synthesize background check + zoning review, reserve quota slot (quota_managed). Requires expected_region_version for quota OCC when the class is quota_managed."
    roles: [Applicant]
    code: 200
    input: ["expected_region_version?"]
    output: LicenseApplication
    side_effects: ["Run fee_assessment; create BackgroundCheck (PENDING); create ZoningReview (PENDING) if requires_zoning; reserve quota slot + increments QuotaRegion.version by 1 if quota_managed; set submitted_at, protest_period_ends_at"]
  - method: POST
    path: "/license-applications/{id}/begin-review"
    description: "SUBMITTED -> UNDER_REVIEW (examiner recommendation; requires background PASSED + zoning cleared)."
    roles: [LicensingExaminer]
    code: 200
    input: []
    output: LicenseApplication
    side_effects: ["Set examiner_user_id"]
  - method: POST
    path: "/license-applications/{id}/open-protest-period"
    description: "UNDER_REVIEW -> PROTEST_PERIOD (opens protest filing window)."
    roles: [LicensingExaminer]
    code: 200
    input: []
    output: LicenseApplication
    side_effects: []
  - method: POST
    path: "/license-applications/{id}/approve"
    description: "PROTEST_PERIOD -> APPROVED (Director; window elapsed, no unresolved/sustained protest, segregation of duties)."
    roles: [Director]
    code: 200
    input: []
    output: LicenseApplication
    side_effects: []
  - method: POST
    path: "/license-applications/{id}/issue"
    description: "APPROVED -> ISSUED: create the License, commit quota slot."
    roles: [Director]
    code: 200
    input: []
    output: LicenseApplication
    side_effects: ["Create License (ACTIVE); commit quota slot"]
  - method: POST
    path: "/license-applications/{id}/deny"
    description: "UNDER_REVIEW -> DENIED (Director; releases quota slot)."
    roles: [Director]
    code: 200
    input: []
    output: LicenseApplication
    side_effects: ["Release quota slot if held"]
  - method: POST
    path: "/license-applications/{id}/withdraw"
    description: "DRAFT or SUBMITTED -> WITHDRAWN (releases quota slot if held)."
    roles: [Applicant]
    code: 200
    input: []
    output: LicenseApplication
    side_effects: ["Release quota slot if held"]
  - method: POST
    path: "/license-applications/{id}/pay-fee"
    description: "Record a fee payment against fee_quoted_cents."
    roles: [Applicant]
    code: 200
    input: [amount_cents]
    output: LicenseApplication
    side_effects: ["fee_paid_cents += amount_cents"]

  # --- Background checks & zoning reviews (reverse-reachable children) ---
  - method: GET
    path: "/license-applications/{id}/background-checks"
    description: "Reverse-reachability: the application's background check(s) (0 or 1)."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: []
    output: BackgroundCheck[]
    side_effects: []
  - method: GET
    path: "/background-checks/{id}"
    description: "Fetch a background check."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: []
  - method: POST
    path: "/background-checks/{id}/resolve"
    description: "PENDING -> PASSED|FAILED. FAIL sets Applicant.disqualified=true."
    roles: [LicensingExaminer]
    code: 200
    input: [decision]
    output: BackgroundCheck
    side_effects: ["On FAIL: Applicant.disqualified=true (cascade)"]
  - method: GET
    path: "/license-applications/{id}/zoning-reviews"
    description: "Reverse-reachability: the application's zoning review(s) (0 or 1)."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: []
    output: ZoningReview[]
    side_effects: []
  - method: GET
    path: "/zoning-reviews/{id}"
    description: "Fetch a zoning review."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: []
    output: ZoningReview
    side_effects: []
  - method: POST
    path: "/zoning-reviews/{id}/decide"
    description: "PENDING -> CLEARED|VARIANCE_GRANTED|BLOCKED."
    roles: [ZoningOfficer]
    code: 200
    input: [decision]
    output: ZoningReview
    side_effects: []

  # --- Protests & hearings ---
  - method: POST
    path: "/protests"
    description: "File a protest against an application (public; anonymous allowed within the protest window)."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant, Anonymous]
    code: 201
    input: [application_id, protester_name, grounds]
    output: Protest
    side_effects: []
  - method: GET
    path: "/protests/{id}"
    description: "Fetch a protest."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: []
    output: Protest
    side_effects: []
  - method: GET
    path: "/license-applications/{id}/protests"
    description: "Reverse-reachability: protests filed against this application."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: Protest[]
    side_effects: []
  - method: POST
    path: "/protests/{id}/schedule-hearing"
    description: "Protest FILED -> SCHEDULED: create Hearing, move application PROTEST_PERIOD -> PROTEST_HEARING. Hearing room overlap rejected."
    roles: [AdjudicationOfficer]
    code: 200
    input: [room_code, starts_at, ends_at]
    output: Protest
    side_effects: ["Create Hearing (PENDING); application -> PROTEST_HEARING"]
  - method: POST
    path: "/protests/{id}/withdraw"
    description: "Protest FILED -> WITHDRAWN."
    roles: [Director]
    code: 200
    input: []
    output: Protest
    side_effects: []
  - method: GET
    path: "/hearings/{id}"
    description: "Fetch a hearing."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: []
    output: Hearing
    side_effects: []
  - method: GET
    path: "/protests/{id}/hearings"
    description: "Reverse-reachability: the hearing(s) for this protest (0 or 1)."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: []
    output: Hearing[]
    side_effects: []
  - method: GET
    path: "/license-applications/{id}/hearings"
    description: "Reverse-reachability: hearings for this application."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: Hearing[]
    side_effects: []
  - method: POST
    path: "/hearings/{id}/render"
    description: "PENDING -> PROTEST_SUSTAINED|PROTEST_OVERRULED. SUSTAINED -> application DENIED (+ release quota); OVERRULED -> application back to PROTEST_PERIOD."
    roles: [AdjudicationOfficer]
    code: 200
    input: [outcome]
    output: Hearing
    side_effects: ["Protest + application transitions; quota release on sustain"]

  # --- Licenses & renewal ---
  - method: GET
    path: "/licenses/{id}"
    description: "Fetch a license."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: []
    output: License
    side_effects: []
  - method: GET
    path: "/licenses"
    description: "List/filter licenses by application, class, region, status."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: ["limit?", "offset?", "application_id?", "license_class_code?", "region_code?", "status?"]
    output: License[]
    side_effects: []
  - method: POST
    path: "/licenses/{id}/check-renewal-window"
    description: "System re-evaluation: if clock.now >= renewal_window_opens_at -> ACTIVE becomes RENEWAL_DUE; if clock.now >= term_end_at and not renewed -> RENEWAL_DUE becomes EXPIRED (cascading permit expiry)."
    roles: [Director, LicensingExaminer]
    code: 200
    input: []
    output: License
    side_effects: ["Posture flip per clock; EXPIRED cascades permits"]
  - method: POST
    path: "/licenses/{id}/renew"
    description: "RENEWAL_DUE -> ACTIVE: roll the term forward; blocked by outstanding fines / demerit threshold / unpaid renewal fee."
    roles: [Applicant]
    code: 200
    input: [renewal_fee_paid_cents]
    output: License
    side_effects: ["Run fee_assessment renewal variant; roll term; renewal_count += 1"]
  - method: POST
    path: "/licenses/{id}/reinstate"
    description: "SUSPENDED -> ACTIVE (Director); blocked by outstanding fines / demerit threshold."
    roles: [Director]
    code: 200
    input: []
    output: License
    side_effects: []
  - method: POST
    path: "/licenses/{id}/pay-fine"
    description: "Record a payment reducing License.outstanding_fine_cents (and the underlying AdministrativeAction.fine_paid_cents)."
    roles: [Applicant]
    code: 200
    input: [action_id, amount_cents]
    output: License
    side_effects: ["AdministrativeAction.fine_paid_cents += amount_cents; License.outstanding_fine_cents -= amount_cents (floored 0)"]

  # --- Server permits ---
  - method: POST
    path: "/server-permits"
    description: "Create a PENDING server permit under a license."
    roles: [Applicant]
    code: 201
    input: [license_id, holder_name, "training_completed?"]
    output: ServerPermit
    side_effects: []
  - method: GET
    path: "/server-permits/{id}"
    description: "Fetch a server permit."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: []
    output: ServerPermit
    side_effects: []
  - method: GET
    path: "/licenses/{id}/server-permits"
    description: "Reverse-reachability: permits attached to a license."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: ServerPermit[]
    side_effects: []
  - method: POST
    path: "/server-permits/{id}/activate"
    description: "PENDING -> ACTIVE: consumes a server capacity slot, sets expires_at, bumps License.active_server_count. Requires expected_license_version (capacity OCC)."
    roles: [Applicant]
    code: 200
    input: [expected_license_version]
    output: ServerPermit
    side_effects: ["License.active_server_count += 1; increments License.version by 1; set expires_at"]
  - method: POST
    path: "/server-permits/{id}/revoke"
    description: "ACTIVE -> REVOKED (Director); decrements License.active_server_count."
    roles: [Director]
    code: 200
    input: []
    output: ServerPermit
    side_effects: ["License.active_server_count -= 1"]
  - method: POST
    path: "/server-permits/{id}/check-expiry"
    description: "System re-evaluation: if clock.now >= expires_at, ACTIVE -> EXPIRED (decrement active_server_count)."
    roles: [Director, LicensingExaminer]
    code: 200
    input: []
    output: ServerPermit
    side_effects: ["active_server_count -= 1 if expired"]

  # --- Violations & administrative actions ---
  - method: POST
    path: "/violations"
    description: "File a violation against a license (Investigator)."
    roles: [Investigator]
    code: 201
    input: [license_id, severity]
    output: Violation
    side_effects: ["Set investigator_user_id"]
  - method: GET
    path: "/violations/{id}"
    description: "Fetch a violation."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: []
    output: Violation
    side_effects: []
  - method: GET
    path: "/licenses/{id}/violations"
    description: "Reverse-reachability: violations against a license."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Violation[]
    side_effects: []
  - method: POST
    path: "/violations/{id}/contest"
    description: "ALLEGED -> CONTESTED (Applicant)."
    roles: [Applicant]
    code: 200
    input: []
    output: Violation
    side_effects: []
  - method: POST
    path: "/violations/{id}/sustain"
    description: "ALLEGED|CONTESTED -> SUSTAINED: create AdministrativeAction, run fine_assessment, add demerits, sync outstanding fine, fire suspension_threshold cascade. Segregation of duties enforced."
    roles: [AdjudicationOfficer]
    code: 200
    input: [action_type, "suspension_days?"]
    output: Violation
    side_effects: ["Create AdministrativeAction; fine_assessment; demerit_points += demerit_for(severity); outstanding_fine_cents += fine_cents; suspension_threshold cascade if demerit_points >= 10"]
  - method: POST
    path: "/violations/{id}/dismiss"
    description: "CONTESTED -> DISMISSED (AdjudicationOfficer; segregation of duties)."
    roles: [AdjudicationOfficer]
    code: 200
    input: []
    output: Violation
    side_effects: []
  - method: GET
    path: "/administrative-actions/{id}"
    description: "Fetch an administrative action (fine_cents, suspension_days)."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: []
    output: AdministrativeAction
    side_effects: []
  - method: GET
    path: "/violations/{id}/administrative-actions"
    description: "Reverse-reachability: the action(s) for a violation (0 or 1)."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: []
    output: AdministrativeAction[]
    side_effects: []
  - method: GET
    path: "/licenses/{id}/administrative-actions"
    description: "Reverse-reachability: actions enforced against a license."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: AdministrativeAction[]
    side_effects: []
  - method: POST
    path: "/administrative-actions/{id}/enforce"
    description: "Apply a SUSPENSION/REVOCATION action to the license (cascades to server permits). FINE-only actions need no enforce."
    roles: [AdjudicationOfficer]
    code: 200
    input: []
    output: AdministrativeAction
    side_effects: ["License suspend/revoke + ServerPermit cascade"]

  # --- Compliance reports (three-tier) ---
  - method: POST
    path: "/compliance-reports"
    description: "Submit a three-tier compliance report; runs excise_assessment -> excise_due_cents."
    roles: [Applicant]
    code: 201
    input: [license_id, tier, period_code, gross_sales_cents]
    output: ComplianceReport
    side_effects: ["Run excise_assessment"]
  - method: GET
    path: "/compliance-reports/{id}"
    description: "Fetch a compliance report (includes excise_due_cents)."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: []
  - method: GET
    path: "/licenses/{id}/compliance-reports"
    description: "Reverse-reachability: reports filed under a license."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: ["limit?", "offset?", "period_code?"]
    output: ComplianceReport[]
    side_effects: []

  # --- Transfer / relocation ---
  - method: POST
    path: "/transfer-requests"
    description: "Request an OWNERSHIP or LOCATION transfer of a license."
    roles: [Applicant, Director]
    code: 201
    input: [license_id, transfer_type, "new_applicant_id?", "new_premise_id?"]
    output: TransferRequest
    side_effects: []
  - method: GET
    path: "/transfer-requests/{id}"
    description: "Fetch a transfer request."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: []
    output: TransferRequest
    side_effects: []
  - method: GET
    path: "/licenses/{id}/transfer-requests"
    description: "Reverse-reachability: transfer requests against a license."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: TransferRequest[]
    side_effects: []
  - method: GET
    path: "/applicants/{id}/transfer-requests"
    description: "Reverse-reachability: transfer requests proposing this applicant as new owner."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: TransferRequest[]
    side_effects: []
  - method: GET
    path: "/premises/{id}/transfer-requests"
    description: "Reverse-reachability: transfer requests proposing this premise as new location."
    roles: [Director, LicensingExaminer, AdjudicationOfficer, ZoningOfficer, Investigator, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: TransferRequest[]
    side_effects: []
  - method: POST
    path: "/transfer-requests/{id}/approve"
    description: "PENDING -> APPROVED (Director)."
    roles: [Director]
    code: 200
    input: []
    output: TransferRequest
    side_effects: []
  - method: POST
    path: "/transfer-requests/{id}/reject"
    description: "PENDING -> REJECTED (Director)."
    roles: [Director]
    code: 200
    input: []
    output: TransferRequest
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid auth headers; or anonymous on an endpoint that requires a known role."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Authenticated role not permitted for this endpoint."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Acting user is the same person barred by separation-of-duties (issuer==examiner, or adjudicator==investigator)."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state from which the transition is defined."
  - id: ERR_HEARING_ROOM_CONFLICT
    http: 409
    condition: "Hearing room window overlaps an existing hearing in the same room."
  - id: ERR_STALE_REGION_VERSION
    http: 412
    condition: "expected_region_version != QuotaRegion.version on quota-reserve submit."
  - id: ERR_STALE_LICENSE_VERSION
    http: 412
    condition: "expected_license_version != License.version on server-permit activate."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing/ill-typed body field; invalid enum; constraint violation; ends_at <= starts_at."
  - id: ERR_APPLICANT_DISQUALIFIED
    http: 422
    condition: "Disqualified applicant submits; or PASS background decision against a felony_flag applicant."
  - id: ERR_ZONING_NOT_CLEARED
    http: 422
    condition: "begin-review while zoning review not in {CLEARED, VARIANCE_GRANTED}."
  - id: ERR_BACKGROUND_NOT_PASSED
    http: 422
    condition: "begin-review while background check not PASSED."
  - id: ERR_PROTEST_WINDOW_CLOSED
    http: 422
    condition: "Protest filed after protest_period_ends_at or while application not in PROTEST_PERIOD."
  - id: ERR_PROTEST_WINDOW_OPEN
    http: 422
    condition: "Approve before protest_period_ends_at elapsed."
  - id: ERR_PROTEST_UNRESOLVED
    http: 422
    condition: "Approve while a protest is FILED/SCHEDULED/SUSTAINED."
  - id: ERR_SERVER_CAPACITY_EXCEEDED
    http: 422
    condition: "Activate server permit when active_server_count == max_servers_per_license."
  - id: ERR_TRAINING_INCOMPLETE
    http: 422
    condition: "Activate server permit when training_completed == false."
  - id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http: 422
    condition: "Renew before renewal_window_opens_at or when status != RENEWAL_DUE."
  - id: ERR_OUTSTANDING_FINE
    http: 422
    condition: "Renew/reinstate/transfer-approve while outstanding_fine_cents > 0."
  - id: ERR_DEMERIT_THRESHOLD
    http: 422
    condition: "Renew/reinstate while demerit_points >= 10."
  - id: ERR_FEE_UNPAID
    http: 422
    condition: "Issue while fee_paid_cents < fee_quoted_cents."
  - id: ERR_QUOTA_EXHAUSTED
    http: 422
    condition: "Submit quota_managed app when available slots == 0 or region under moratorium."
  - id: ERR_TRANSFER_TYPE_INVALID
    http: 422
    condition: "Transfer field combination invalid for transfer_type, or LOCATION crosses region."
  - id: ERR_PREMISE_TERM_CONFLICT
    http: 409
    condition: "LOCATION transfer approve where the target premise already hosts a non-terminal same-class license whose closed term window overlaps."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Director
    description: "Senior authority: approves/issues/denies applications, reinstates licenses, withdraws protests, approves transfers, manages configuration. Cannot pre-empt examiner recommendation (segregation)."
    identity: opaque
    exclusive_operations:
      - "POST /license-classes"
      - "POST /quota-regions"
      - "PATCH /quota-regions/{id}/moratorium"
      - "POST /license-applications/{id}/approve"
      - "POST /license-applications/{id}/issue"
      - "POST /license-applications/{id}/deny"
      - "POST /licenses/{id}/reinstate"
      - "POST /protests/{id}/withdraw"
      - "POST /server-permits/{id}/revoke"
      - "POST /transfer-requests/{id}/approve"
      - "POST /transfer-requests/{id}/reject"
    shared_operations:
      - "POST /applicants"
      - "POST /premises"
      - "POST /license-applications"
      - "POST /transfer-requests"
      - "GET (all read endpoints)"

  - name: LicensingExaminer
    description: "Processes applications: begins review (recommendation), opens protest period, resolves background checks. Recommendation actor barred from issuance by segregation."
    identity: opaque
    exclusive_operations:
      - "POST /license-applications/{id}/begin-review"
      - "POST /license-applications/{id}/open-protest-period"
      - "POST /background-checks/{id}/resolve"
      - "POST /licenses/{id}/check-renewal-window"
      - "POST /server-permits/{id}/check-expiry"
    shared_operations:
      - "POST /applicants"
      - "POST /premises"
      - "POST /license-applications"
      - "GET (all read endpoints)"

  - name: ZoningOfficer
    description: "Decides zoning reviews only."
    identity: opaque
    exclusive_operations:
      - "POST /zoning-reviews/{id}/decide"
    shared_operations:
      - "GET (all read endpoints)"

  - name: AdjudicationOfficer
    description: "Conducts protest hearings and adjudicates violations. Barred from adjudicating violations they personally filed (none, since filing is Investigator-only) and bound by segregation against the investigator on each case."
    identity: opaque
    exclusive_operations:
      - "POST /protests/{id}/schedule-hearing"
      - "POST /hearings/{id}/render"
      - "POST /violations/{id}/sustain"
      - "POST /violations/{id}/dismiss"
      - "POST /administrative-actions/{id}/enforce"
    shared_operations:
      - "GET (all read endpoints)"

  - name: Investigator
    description: "Files violations. Barred from adjudicating any violation they filed (segregation)."
    identity: opaque
    exclusive_operations:
      - "POST /violations"
    shared_operations:
      - "GET (all read endpoints)"

  - name: Applicant
    description: "The licensee/business. Creates and submits applications, pays fees, manages server permits, renews licenses, contests violations, files compliance reports, requests transfers."
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /license-applications/{id}/submit"
      - "POST /license-applications/{id}/withdraw"
      - "POST /license-applications/{id}/pay-fee"
      - "POST /server-permits"
      - "POST /server-permits/{id}/activate"
      - "POST /licenses/{id}/renew"
      - "POST /licenses/{id}/pay-fine"
      - "POST /violations/{id}/contest"
      - "POST /compliance-reports"
    shared_operations:
      - "POST /premises"
      - "POST /license-applications"
      - "POST /transfer-requests"
      - "POST /protests"
      - "GET (all read endpoints)"

  - name: Anonymous
    description: "Unauthenticated public party. May only file a protest within the open protest window."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /protests"
