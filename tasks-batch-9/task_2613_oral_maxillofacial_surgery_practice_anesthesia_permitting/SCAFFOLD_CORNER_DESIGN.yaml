            - call: "POST /block-times"
              payload: { practice_id: "${prac_id}", surgeon_id: "${surg_id}", room_code: "OR-1", block_start: "2028-09-10T13:00:00Z", block_end: "2028-09-10T17:00:00Z", release_deadline_hours: 48 }
              as: SchedulingCoordinator
