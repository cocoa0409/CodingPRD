  # ===========================================================================
  - section: state_machines
    instances:
      - name: incident_review_then_close_records_corrective_action
        claim_type: valid_transition
        grounds:
          - state_machines.Incident
          - endpoints["POST /challenge-course/incidents/{incident_id}/review"]
          - endpoints["POST /challenge-course/incidents/{incident_id}/close"]
        distinguishing_aspect: "REPORTED -> UNDER_REVIEW -> CLOSED_CORRECTIVE stores the corrective_action text and, because a SERIOUS incident under review restricts the course, the closure releases posture back to OPEN."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course with two ACTIVE facilitators (so rescue readiness passes and posture is driven only by the incident); one REPORTED SERIOUS incident with EMS activated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
            - call: "POST /challenge-course/facilitators"
              payload: { course_id: "${course_id}", full_name: "Dana Reyes", staff_type: "SAFETY_OFFICER", certification_level: "LEVEL_3", cert_expires_on: "2027-06-30", is_operator_employee: true }
              as: ProgramDirector
              captures: { so_id: $.data.id }
            - call: "POST /challenge-course/training-records"
              payload: { facilitator_id: "${so_id}", kind: "RESCUE_DRILL", completed_on: "2026-07-15" }
              as: ProgramDirector
            - call: "POST /challenge-course/training-records"
              payload: { facilitator_id: "${so_id}", kind: "REFRESHER", completed_on: "2026-07-15", hours: 8 }
              as: ProgramDirector
            - call: "POST /challenge-course/facilitators"
              payload: { course_id: "${course_id}", full_name: "Kim Alvarez", staff_type: "STAFF_FACILITATOR", certification_level: "LEVEL_2", cert_expires_on: "2027-06-30", is_operator_employee: true }
              as: ProgramDirector
              captures: { f1_id: $.data.id }
            - call: "POST /challenge-course/training-records"
              payload: { facilitator_id: "${f1_id}", kind: "RESCUE_DRILL", completed_on: "2026-07-15" }
              as: ProgramDirector
            - call: "POST /challenge-course/training-records"
              payload: { facilitator_id: "${f1_id}", kind: "REFRESHER", completed_on: "2026-07-15", hours: 8 }
              as: ProgramDirector
            - call: "POST /challenge-course/incidents"
              payload: { course_id: "${course_id}", reported_by_facilitator_id: "${f1_id}", occurred_at: "2026-08-10T09:15:00Z", severity: "SERIOUS", narrative: "Participant fell from the second staple and was immobilised", ems_activated: true }
              as: Facilitator
              as_user_id: "${f1_id}"
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /challenge-course/incidents/${inc_id}/review"
              payload: {}
              as: SafetyOfficer
              as_user_id: "${so_id}"
              captures: { status_under_review: $.data.status }
            - call: "GET /challenge-course/courses/${course_id}"
              payload: {}
              as: ProgramDirector
              captures: { posture_under_review: $.data.posture, reason_under_review: $.data.posture_reason }
            - call: "POST /challenge-course/incidents/${inc_id}/close"
              payload: { disposition: "CLOSED_CORRECTIVE", corrective_action: "Staple spacing re-rigged and belay briefing script updated" }
              as: SafetyOfficer
              as_user_id: "${so_id}"
          assert:
            - "${status_under_review} == UNDER_REVIEW"
            - "${posture_under_review} == RESTRICTED"
            - "${reason_under_review} == SERIOUS_INCIDENT"
            - "Incident.${inc_id}.status == CLOSED_CORRECTIVE"
            - "Incident.${inc_id}.corrective_action == Staple spacing re-rigged and belay briefing script updated"
            - "Incident.${inc_id}.ems_activated == true"
            - "Course.${course_id}.posture == OPEN"
            - "Course.${course_id}.posture_reason == NONE"

      - name: close_incident_twice_rejects_second_attempt
        claim_type: idempotency
        grounds:
          - state_machines.Incident
          - errors.ERR_INCIDENT_NOT_UNDER_REVIEW
        distinguishing_aspect: "Replaying close on an already CLOSED_NO_ACTION incident answers ERR_INCIDENT_NOT_UNDER_REVIEW at 409 and leaves corrective_action null rather than overwriting the first disposition."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course with a LEVEL_3 safety officer and a staff facilitator; one MINOR incident already reviewed and closed with no action."
          setup_api_calls:
