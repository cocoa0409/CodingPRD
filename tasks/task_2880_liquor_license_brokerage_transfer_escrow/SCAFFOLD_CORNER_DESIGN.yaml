# Scaffold Corner Design - task 2880 Liquor License Brokerage & Transfer Escrow
# Breadth index over SCAFFOLD.yaml 1.1-1.7: every testable claim the surface
# declares that SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already assert.
# Sections and claim_types come from references/claim-extraction-guide.md only.
# Logical clock default (unset) is 2026-08-01T00:00:00Z; every literal below was
# computed by executing the referenced calculations[].formula in code.
scaffold_corner_design:

  - section: entities
    instances:

      - name: county_create_returns_all_fields_with_zero_quota_counters
        claim_type: creation
        grounds:
          - endpoints[POST /counties]
          - entities.County
          - calculations.county_quota_position
        distinguishing_aspect: "POST /counties with only the four required fields returns 201 and every County field, with quota_licenses_counted 0, quota_available equal to quota_licenses_total, quota_utilization_bps 0 and escrow_committed_count 0."
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /counties"
              payload: { county_code: "NAP", name: "Napa", state_code: "CA", quota_licenses_total: 40 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == object and meta.api_request_id present"
            - "County.${c_id}.quota_licenses_total == 40 and quota_licenses_counted == 0"
            - "County.${c_id}.quota_available == 40 and quota_utilization_bps == 0"
            - "County.${c_id}.escrow_committed_count == 0"
            - "County.${c_id}.version == 1 and created_at == 2026-08-01T00:00:00.000Z"

      - name: county_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - endpoints[POST /counties]
          - entities.County.fields.posting_period_days
          - entities.County.fields.protest_window_days
          - entities.County.fields.transfer_fee_bps
          - entities.County.fields.default_valuation_basis
        distinguishing_aspect: "Omitting every optional County field yields the declared defaults - posting_period_days 30, protest_window_days 15, transfer_fee_bps 150, distance minima 600/600, default_valuation_basis COMPARABLE_SALES - rather than nulls."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /counties"
              payload: { county_code: "MRN", name: "Marin", state_code: "CA", quota_licenses_total: 25 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
          assert:
            - "County.${c_id}.posting_period_days == 30 and protest_window_days == 15"
            - "County.${c_id}.transfer_fee_bps == 150"
            - "County.${c_id}.distance_min_feet_school == 600 and distance_min_feet_church == 600"
            - "County.${c_id}.default_valuation_basis == COMPARABLE_SALES"
            - "County.${c_id}.permitted_zoning_codes contains C1"

      - name: agreement_contingency_days_default_is_120
        claim_type: defaults
        grounds:
          - endpoints[POST /purchase-agreements]
          - entities.PurchaseAgreement.fields.contingency_days
          - entities.PurchaseAgreement.fields.contingency_deadline_at
        distinguishing_aspect: "Omitting contingency_days on POST /purchase-agreements applies the declared default 120, so a 2026-09-01T00:00:00Z closing window yields contingency_deadline_at 2026-12-30T00:00:00Z, not the 30-day minimum."
        test_recipe:
          setup:
            - "County SON with quota_licenses_total 100, one CLASS_47_ONSALE_GENERAL licence, one ACTIVE listing, one buyer with a premises."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "SON", name: "Sonoma", state_code: "CA", quota_licenses_total: 100 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /seller-profiles"
              payload: { legal_name: "Vine Holdings LLC", contact_email: "seller@example.com", tax_clearance_status: "CLEARED" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /buyer-profiles"
              payload: { legal_name: "Coast Hospitality LLC", entity_type: "LLC", residency_state: "CA", citizenship_verified: true }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /brokerages"
              payload: { firm_name: "Bay Brokers", state_broker_license_no: "BRK-0001", commission_rate_bps: 575 }
              as: PlatformAdmin
              captures: { brk_id: $.data.id }
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "DEF-1", license_class: "CLASS_47_ONSALE_GENERAL", annual_gross_receipts_cents: 120000000, last_active_date: "2026-07-01" }
              as: PlatformAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /premises"
              payload: { buyer_id: "${b_id}", county_id: "${c_id}", address_line: "7 Vine St", zoning_code: "C1", distance_to_nearest_school_feet: 900, distance_to_nearest_church_feet: 900 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { prem_id: $.data.id }
            - call: "POST /listings"
              payload: { license_id: "${lic_id}", brokerage_id: "${brk_id}", ask_price_cents: 18500000 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: Broker
              as_user_id: "${brk_id}"
              captures: { lst_v1: $.data.version }
          trigger:
            - call: "POST /purchase-agreements"
              payload: { listing_id: "${lst_id}", buyer_id: "${b_id}", premises_id: "${prem_id}", purchase_price_cents: 18500010, deposit_pct_bps: 1000, closing_window_start: "2026-09-01T00:00:00Z", expected_listing_version: "${lst_v1}" }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { agr_id: $.data.id }
          assert:
            - "HTTP 201 with PurchaseAgreement.${agr_id}.contingency_days == 120"
            - "PurchaseAgreement.${agr_id}.contingency_deadline_at == 2026-12-30T00:00:00Z"
            - "PurchaseAgreement.${agr_id}.agreement_status == DRAFT and escrow_status == AWAITING_DEPOSIT"
            - "PurchaseAgreement.${agr_id}.escrow_balance_cents == 0"

      - name: license_create_missing_license_class_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=16]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /licenses]
        distinguishing_aspect: "Omitting the required license_class on POST /licenses returns 400 ERR_INVALID_REQUEST and persists nothing, so the county's quota counters stay at zero."
        test_recipe:
          setup:
            - "One county SON with quota_licenses_total 100 and one seller profile."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "SON", name: "Sonoma", state_code: "CA", quota_licenses_total: 100 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /seller-profiles"
              payload: { legal_name: "Vine Holdings LLC", contact_email: "seller@example.com", tax_clearance_status: "CLEARED" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "NOCLASS-1", annual_gross_receipts_cents: 120000000, last_active_date: "2026-07-01" }
              as: PlatformAdmin
              captures: { err_missing: $.data.error_id }
          assert:
            - "HTTP 400 with ${err_missing} == ERR_INVALID_REQUEST"
            - "response_type == error and data.message is a non-empty string"
            - "GET /licenses?county_id=${c_id} returns total_count == 0"
            - "County.${c_id}.quota_licenses_counted == 0 and version == 1"

      - name: premises_zoning_verification_rejects_unknown_enum_value
        claim_type: type_constraints
        grounds:
          - validations[priority=16]
          - endpoints[POST /premises/{premises_id}/zoning-verification]
          - entities.Premises.fields.conditional_use_permit_status
        distinguishing_aspect: "conditional_use_permit_status MAYBE is outside the declared enum, so the verification is refused with 400 ERR_INVALID_REQUEST and the premises keeps REQUIRED_NOT_FILED and its version 1."
        test_recipe:
          setup:
            - "One county SON, one buyer, one brokerage and one lawfully-sited premises at (CONDITIONAL, CUP_OUTSTANDING)."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "SON", name: "Sonoma", state_code: "CA", quota_licenses_total: 100 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /buyer-profiles"
              payload: { legal_name: "Coast Hospitality LLC", entity_type: "LLC", residency_state: "CA", citizenship_verified: true }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /brokerages"
              payload: { firm_name: "Bay Brokers", state_broker_license_no: "BRK-0001", commission_rate_bps: 575 }
              as: PlatformAdmin
              captures: { brk_id: $.data.id }
            - call: "POST /premises"
              payload: { buyer_id: "${b_id}", county_id: "${c_id}", address_line: "8 Vine St", zoning_code: "C1", distance_to_nearest_school_feet: 900, distance_to_nearest_church_feet: 900 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { prem_id: $.data.id }
          trigger:
            - call: "POST /premises/${prem_id}/zoning-verification"
              payload: { conditional_use_permit_status: "MAYBE" }
              as: RegulatorAnalyst
              as_user_id: "analyst-1"
              captures: { err_enum: $.data.error_id }
          assert:
            - "HTTP 400 with ${err_enum} == ERR_INVALID_REQUEST"
            - "Premises.${prem_id}.conditional_use_permit_status == REQUIRED_NOT_FILED (unchanged)"
            - "Premises.${prem_id}.suitability_status == CONDITIONAL with suitability_reason_code == CUP_OUTSTANDING"
            - "Premises.${prem_id}.version == 1"

      - name: license_get_with_unknown_id_returns_license_not_found
        claim_type: not_found
        grounds:
          - validations[priority=18]
          - errors[ERR_LICENSE_NOT_FOUND]
          - endpoints[GET /licenses/{license_id}]
        distinguishing_aspect: "A syntactically valid but unknown license_id in the path returns 404 ERR_LICENSE_NOT_FOUND in the standard error envelope, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database - no licence has been created."
          setup_api_calls: []
          trigger:
            - call: "GET /licenses/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err_nf: $.data.error_id }
          assert:
            - "HTTP 404 with ${err_nf} == ERR_LICENSE_NOT_FOUND"
            - "response_type == error and data has exactly the keys error_id and message"

      - name: license_create_with_unknown_county_returns_county_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=20]
          - errors[ERR_COUNTY_NOT_FOUND]
          - endpoints[POST /licenses]
        distinguishing_aspect: "In the flat topology the body FK county_id is validated before owner_seller_id, so an unknown county with a valid seller returns 404 ERR_COUNTY_NOT_FOUND and not ERR_SELLER_NOT_FOUND."
        test_recipe:
          setup:
            - "One seller profile exists; no county has been created."
          setup_api_calls:
            - call: "POST /seller-profiles"
              payload: { legal_name: "Vine Holdings LLC", contact_email: "seller@example.com", tax_clearance_status: "CLEARED" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /licenses"
              payload: { county_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", owner_seller_id: "${s_id}", license_number: "ORPHAN-1", license_class: "CLASS_47_ONSALE_GENERAL", annual_gross_receipts_cents: 120000000, last_active_date: "2026-07-01" }
              as: PlatformAdmin
              captures: { err_fk: $.data.error_id }
          assert:
            - "HTTP 404 with ${err_fk} == ERR_COUNTY_NOT_FOUND"
            - "${err_fk} != ERR_SELLER_NOT_FOUND (the seller in the body is valid)"
            - "GET /licenses returns total_count == 0"

      - name: licenses_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /licenses]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three licences in one county, GET /licenses?county_id=...&limit=2&offset=0 returns 2 rows in created_at ASC order with total_count 3 and has_more true, and offset=2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "County SON with quota_licenses_total 100 and exactly three CLASS_21_OFFSALE_GENERAL licences created in the order PAGE-1, PAGE-2, PAGE-3."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "SON", name: "Sonoma", state_code: "CA", quota_licenses_total: 100 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /seller-profiles"
              payload: { legal_name: "Vine Holdings LLC", contact_email: "seller@example.com", tax_clearance_status: "CLEARED" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "PAGE-1", license_class: "CLASS_21_OFFSALE_GENERAL", annual_gross_receipts_cents: 20000000, last_active_date: "2026-07-01" }
              as: PlatformAdmin
              captures: { lic1: $.data.id }
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "PAGE-2", license_class: "CLASS_21_OFFSALE_GENERAL", annual_gross_receipts_cents: 20000000, last_active_date: "2026-07-01" }
              as: PlatformAdmin
              captures: { lic2: $.data.id }
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "PAGE-3", license_class: "CLASS_21_OFFSALE_GENERAL", annual_gross_receipts_cents: 20000000, last_active_date: "2026-07-01" }
              as: PlatformAdmin
              captures: { lic3: $.data.id }
          trigger:
            - call: "GET /licenses?county_id=${c_id}&limit=2&offset=0"
              payload: {}
              as: PlatformAdmin
              captures: { first_page_head: "$.data[0].license_number" }
            - call: "GET /licenses?county_id=${c_id}&limit=2&offset=2"
              payload: {}
              as: PlatformAdmin
              captures: { second_page_head: "$.data[0].license_number" }
          assert:
            - "the first page returns response_type == array with exactly 2 rows, total_count == 3 and has_more == true"
            - "${first_page_head} == PAGE-1 (created_at ASC ordering, never id ordering)"
            - "the second page returns exactly 1 row, total_count == 3 and has_more == false"
            - "${second_page_head} == PAGE-3"
            - "County.${c_id}.quota_licenses_counted == 3 and quota_available == 97"

      - name: escrow_ledger_entry_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.EscrowLedgerEntry
          - endpoints[GET /purchase-agreements/{agreement_id}/escrow-ledger]
        distinguishing_aspect: "EscrowLedgerEntry declares common_fields false, so each ledger row exposes only id and created_at plus its own fields - no version, no updated_at - and no endpoint in 1.5 can update or delete a row once appended."
        test_recipe:
          setup:
            - "The default happy path to a funded escrow: one county, seller, buyer, brokerage, licence, premises, ACTIVE listing, DRAFT agreement with required_deposit_cents 2405001, deposit paid."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "SON", name: "Sonoma", state_code: "CA", quota_licenses_total: 100 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /seller-profiles"
              payload: { legal_name: "Vine Holdings LLC", contact_email: "seller@example.com", tax_clearance_status: "CLEARED" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /buyer-profiles"
              payload: { legal_name: "Coast Hospitality LLC", entity_type: "LLC", residency_state: "CA", citizenship_verified: true }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /brokerages"
              payload: { firm_name: "Bay Brokers", state_broker_license_no: "BRK-0001", commission_rate_bps: 575 }
              as: PlatformAdmin
              captures: { brk_id: $.data.id }
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "IMM-1", license_class: "CLASS_47_ONSALE_GENERAL", annual_gross_receipts_cents: 120000000, last_active_date: "2026-07-01" }
              as: PlatformAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /premises"
              payload: { buyer_id: "${b_id}", county_id: "${c_id}", address_line: "9 Vine St", zoning_code: "C1", distance_to_nearest_school_feet: 900, distance_to_nearest_church_feet: 900 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { prem_id: $.data.id }
            - call: "POST /listings"
              payload: { license_id: "${lic_id}", brokerage_id: "${brk_id}", ask_price_cents: 18500000 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: Broker
              as_user_id: "${brk_id}"
              captures: { lst_v1: $.data.version }
            - call: "POST /purchase-agreements"
              payload: { listing_id: "${lst_id}", buyer_id: "${b_id}", premises_id: "${prem_id}", purchase_price_cents: 18500010, deposit_pct_bps: 1000, closing_window_start: "2026-09-01T00:00:00Z", expected_listing_version: "${lst_v1}" }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { agr_id: $.data.id }
            - call: "POST /purchase-agreements/${agr_id}/escrow-deposit"
              payload: { amount_cents: 2405001, deposit_reference: "wire/abc" }
              as: Buyer
              as_user_id: "${b_id}"
          trigger:
            - call: "GET /purchase-agreements/${agr_id}/escrow-ledger"
              payload: {}
              as: EscrowOfficer
              captures: { row0_type: "$.data[0].entry_type" }
          assert:
            - "exactly 1 ledger row with total_count == 1"
            - "${row0_type} == DEPOSIT with amount_cents == 2405001 and balance_after_cents == 2405001"
            - "the row exposes id and created_at but no version and no updated_at field"
            - "the row's occurred_at == 2026-08-01T00:00:00Z"
            - "1.5 declares no PATCH, PUT or DELETE endpoint for any ledger row"

      - name: agreement_read_returns_every_frozen_field_unchanged
        claim_type: retrieval
        grounds:
          - endpoints[GET /purchase-agreements/{agreement_id}]
          - entities.PurchaseAgreement.fields.required_deposit_cents
          - entities.PurchaseAgreement.fields.contingency_deadline_at
        distinguishing_aspect: "A single read of a DRAFT agreement returns the client's own inputs plus the fields frozen at draft time - required_deposit_cents 2405001, contingency_deadline_at 2026-12-30 and the three denormalised ids copied off the listing chain - byte for byte identical to the create response."
        test_recipe:
          setup:
            - "A DRAFT agreement at 18500010 cents with deposit_pct_bps 1000 and default contingency_days 120."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "SON", name: "Sonoma", state_code: "CA", quota_licenses_total: 100 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /seller-profiles"
              payload: { legal_name: "Vine Holdings LLC", contact_email: "seller@example.com", tax_clearance_status: "CLEARED" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /buyer-profiles"
              payload: { legal_name: "Harbor Hospitality LLC", entity_type: "LLC", residency_state: "CA", citizenship_verified: true }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /brokerages"
              payload: { firm_name: "Bay Brokers", state_broker_license_no: "BRK-0001", commission_rate_bps: 575 }
              as: PlatformAdmin
              captures: { brk_id: $.data.id }
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "SON-47-1", license_class: "CLASS_47_ONSALE_GENERAL", annual_gross_receipts_cents: 120000000, last_active_date: "2026-07-01" }
              as: PlatformAdmin
              captures: { lic_id: $.data.id, lic_v1: $.data.version }
            - call: "POST /premises"
              payload: { buyer_id: "${b_id}", county_id: "${c_id}", address_line: "12 Vine St", zoning_code: "C1", distance_to_nearest_school_feet: 900, distance_to_nearest_church_feet: 900 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { prem_id: $.data.id }
            - call: "POST /premises/${prem_id}/zoning-verification"
              payload: { conditional_use_permit_status: "GRANTED" }
              as: RegulatorAnalyst
              as_user_id: "analyst-1"
            - call: "POST /premises/${prem_id}/landlord-consent"
              payload: { landlord_consent_status: "GRANTED" }
              as: Broker
              as_user_id: "${brk_id}"
            - call: "POST /buyer-profiles/${b_id}/qualification-review"
              payload: { review_mode: "FINAL_REVIEW", premises_id: "${prem_id}" }
              as: RegulatorAnalyst
              as_user_id: "analyst-1"
            - call: "POST /listings"
              payload: { license_id: "${lic_id}", brokerage_id: "${brk_id}", ask_price_cents: 18500000 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: Broker
              as_user_id: "${brk_id}"
              captures: { lst_v1: $.data.version }
            - call: "POST /purchase-agreements"
              payload: { listing_id: "${lst_id}", buyer_id: "${b_id}", premises_id: "${prem_id}", purchase_price_cents: 18500010, deposit_pct_bps: 1000, closing_window_start: "2026-09-01T00:00:00Z", expected_listing_version: "${lst_v1}" }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { agr_id: $.data.id }
          trigger:
            - call: "GET /purchase-agreements/${agr_id}"
              payload: {}
              as: Buyer
              as_user_id: "${b_id}"
              captures: { price: $.data.purchase_price_cents, dep: $.data.required_deposit_cents, cdl: $.data.contingency_deadline_at, brk: $.data.brokerage_id, lic: $.data.license_id, sel: $.data.seller_id, ver: $.data.version }
          assert:
            - "${price} == 18500010 and ${dep} == 2405001"
            - "${cdl} == 2026-12-30T00:00:00Z (closing_window_start 2026-09-01 plus the default 120 contingency days)"
            - "${brk} == ${brk_id}, ${lic} == ${lic_id} and ${sel} == ${s_id}, all denormalised by the server and not sent by the client"
            - "${ver} == 1 and agreement_status == DRAFT with escrow_status AWAITING_DEPOSIT and escrow_balance_cents 0"
            - "the read is identical to the create response and repeating it changes nothing"

      - name: computed_fields_are_derived_not_accepted_from_the_client
        claim_type: computed_fields
        grounds:
          - entities.Premises.fields.suitability_status
          - entities.Premises.fields.suitability_reason_code
          - entities.County.fields.quota_available
          - calculations.premises_suitability_evaluation
        distinguishing_aspect: "suitability_status, suitability_reason_code and quota_available never appear in any endpoint's input list: the premises create derives (UNSUITABLE, SCHOOL_DISTANCE) purely from a 500-foot school distance against the county minimum of 600, and a later zoning-verification re-derives it to SUITABLE once the distance is corrected."
        test_recipe:
          setup:
            - "County SON with the default distance_min_feet_school 600 and permitted_zoning_codes [C1, C2, MU1]."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "SON", name: "Sonoma", state_code: "CA", quota_licenses_total: 8 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, avail: $.data.quota_available }
            - call: "POST /buyer-profiles"
              payload: { legal_name: "Harbor Hospitality LLC", entity_type: "LLC", residency_state: "CA", citizenship_verified: true }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /brokerages"
              payload: { firm_name: "Bay Brokers", state_broker_license_no: "BRK-0001", commission_rate_bps: 575 }
              as: PlatformAdmin
              captures: { brk_id: $.data.id }
          trigger:
            - call: "POST /premises"
              payload: { buyer_id: "${b_id}", county_id: "${c_id}", address_line: "9 School Way", zoning_code: "C1", distance_to_nearest_school_feet: 500, distance_to_nearest_church_feet: 900 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { prem_id: $.data.id, sst: $.data.suitability_status, srs: $.data.suitability_reason_code }
            - call: "POST /premises/${prem_id}/zoning-verification"
              payload: { conditional_use_permit_status: "NOT_REQUIRED", distance_to_nearest_school_feet: 900 }
              as: RegulatorAnalyst
              as_user_id: "analyst-1"
              captures: { sst2: $.data.suitability_status, srs2: $.data.suitability_reason_code }
          assert:
            - "${avail} == 8 on a county with no licences, computed rather than supplied"
            - "${sst} == UNSUITABLE and ${srs} == SCHOOL_DISTANCE, derived from the two distance inputs alone"
            - "${sst2} == SUITABLE and ${srs2} is null once the corrected survey is recorded"
            - "Premises.${prem_id}.version == 2 after the re-derivation"
            - "no endpoint in 1.5 accepts suitability_status, suitability_reason_code or quota_available as input"

      - name: system_fields_are_generated_by_the_server_on_every_row
        claim_type: system_fields
        grounds:
          - entities.County
          - envelope.common_fields
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "id, created_at, updated_at and version are system-owned: a fresh county comes back with a server-assigned id, created_at and updated_at equal to the logical clock and version 1, and a later write on the same row moves updated_at and version while created_at and id never move."
        test_recipe:
          setup:
            - "Empty system at the default logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "SON", name: "Sonoma", state_code: "CA", quota_licenses_total: 100 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, cre: $.data.created_at, upd: $.data.updated_at, ver: $.data.version }
            - call: "POST /seller-profiles"
              payload: { legal_name: "Vine Holdings LLC", contact_email: "seller@example.com", tax_clearance_status: "CLEARED" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "SON-47-1", license_class: "CLASS_47_ONSALE_GENERAL", annual_gross_receipts_cents: 120000000, last_active_date: "2026-07-01" }
              as: PlatformAdmin
              captures: { lic_id: $.data.id }
            - call: "GET /counties/${c_id}"
              payload: {}
              as: PlatformAdmin
              captures: { cre2: $.data.created_at, upd2: $.data.updated_at, ver2: $.data.version }
          assert:
            - "${cre} == ${upd} == 2026-08-01T00:00:00Z and ${ver} == 1 on creation"
            - "${c_id} is a server-generated identifier that the client never supplied"
            - "the licence create recomputes the county's quota counters, so ${ver2} == 2 and ${upd2} == 2026-08-20T00:00:00Z"
            - "${cre2} == ${cre}: created_at is immutable once written"
            - "License.${lic_id}.created_at == 2026-08-20T00:00:00Z, drawn from the logical clock rather than the wall clock"

  - section: state_machines
