      - name: milestone_deliver_requires_engagement_active
        grounds:
          - validations[priority=6]
          - state_machines.Milestone.PENDING_to_DELIVERED
          - state_machines.Engagement
        distinguishing_aspect: |
          Entity pair Milestone -> Engagement: delivery is gated on the
          ENGAGEMENT's state (must be ACTIVE); delivering into a CLOSED
          engagement fails with ERR_ENGAGEMENT_NOT_ACTIVE while the ownership
          check still passes (caller IS the awarded supplier). Distinct pair
          from timesheet_requires_assignment_active.
        test_recipe:
