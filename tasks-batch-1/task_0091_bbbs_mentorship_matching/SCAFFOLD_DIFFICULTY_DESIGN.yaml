  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: volunteer_active_match_count_conserved_across_accept_finalize
        grounds:
          - state_machines.MatchProposal.OFFERED_to_ACCEPTED
          - state_machines.Match.ACTIVE_to_CLOSED
          - entities.Volunteer.fields.active_match_count
          - state_machines.Volunteer.MATCHED_to_ELIGIBLE
        distinguishing_aspect: "Conserved quantity Q1 = Volunteer.active_match_count, pinned as count(Matches with relationship_status IN {CONFIRMED, INTRODUCED, ACTIVE} for the volunteer). accept (+1) paired with exit-finalize (-1) returns active_match_count to its pre-pair value 0 with the Volunteer back in ELIGIBLE; no drift."
        test_recipe:
          setup:
            - "An ELIGIBLE Volunteer with active_match_count 0; take it through accept (count->1) and exit-finalize SUCCESSFUL_CLOSURE (count->0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
