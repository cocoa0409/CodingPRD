            - "supervision_posture is COMPLIANT throughout: the 412s are pure concurrency refusals with no bearing on the supervision ratio (3 licensees against SUPERVISION_RATIO_MAX)"
      - name: a_stale_recovery_fund_version_is_refused_because_a_third_party_fine_payment_credited_the_fund
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.disbursement-stale-recovery-fund
          - errors.ERR_RECOVERY_FUND_VERSION_CONFLICT
          - endpoints["POST /commission/recovery-fund/disbursements"]
          - calculations.recovery_fund_award_waterfall
        distinguishing_aspect: |
          The trustee's stale view is created by a DIFFERENT actor on a DIFFERENT endpoint: the
          respondent's fine payment credits the fund and bumps its version, so the distributable
          balance the trustee read is no longer the one the waterfall would use. The refused run must
          award nothing - the claim stays ELIGIBLE with awarded_cents 0 - and the refreshed run then
          pays it in full out of the larger balance the payment created.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with Dana Broker ACTIVE and self-supervising and Sam Reed ACTIVE"
            - "a FINE consent order of 500000 cents against Sam Reed is ISSUED with effective_at 2026-08-01T00:00:00Z"
            - "Pat Buyer has filed an ELIGIBLE recovery claim of 200000 cents against that order"
            - "the fund holds a 6000000 appropriation and nothing else"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 88, taken_on: "2026-07-01" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Harbor Realty Group", designated_broker_id: "${br_id}", trust_account_required: false, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "no trust account required" }
              as: LicensingAnalyst
              captures: { bkg_v1: $.data.version }
            - call: "POST /commission/licensees/${br_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v1}" }
              as: LicensingAnalyst
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Sam Reed", prelicense_hours: 90 }
              as: LicensingAnalyst
              captures: { sam_id: $.data.id }
            - call: "POST /commission/licensees/${sam_id}/exam-results"
              payload: { score: 84, taken_on: "2026-07-05" }
              as: LicensingAnalyst
            - call: "GET /commission/brokerages/${bkg_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { bkg_v2: $.data.version }
            - call: "POST /commission/licensees/${sam_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v2}" }
              as: LicensingAnalyst
            - call: "POST /commission/complaints"
              payload: { complainant_name: "Pat Buyer", respondent_licensee_id: "${sam_id}", allegation_type: "MISREPRESENTATION", alleged_loss_cents: 200000 }
              as: LicensingAnalyst
              captures: { cmp_id: $.data.id }
            - call: "POST /commission/complaints/${cmp_id}/disposition"
              payload: { disposition: "INVESTIGATE", investigator_user_id: "counsel-05" }
              as: CommissionCounsel
              as_user_id: "counsel-05"
            - call: "POST /commission/complaints/${cmp_id}/disposition"
              payload: { disposition: "PROBABLE_CAUSE" }
              as: CommissionCounsel
              as_user_id: "counsel-05"
            - call: "POST /commission/complaints/${cmp_id}/consent-agreements"
              payload: { proposed_sanction_type: "FINE", proposed_fine_cents: 500000, proposed_suspension_days: 0 }
              as: CommissionCounsel
              as_user_id: "counsel-01"
              captures: { con_id: $.data.id }
            - call: "POST /commission/consent-agreements/${con_id}/respondent-response"
              payload: { action: "ACCEPT" }
              as: Respondent
              as_user_id: "${sam_id}"
            - call: "POST /commission/consent-agreements/${con_id}/commission-action"
              payload: { action: "EXECUTE" }
              as: CommissionCounsel
              as_user_id: "counsel-02"
            - call: "GET /commission/sanction-orders?complaint_id=${cmp_id}"
              payload: {}
              as: RecoveryFundTrustee
              as_user_id: "trustee-03"
              captures: { so_id: "$.data[0].id" }
            - call: "POST /commission/sanction-orders/${so_id}/recovery-claims"
              payload: { claimant_name: "Pat Buyer", claimed_loss_cents: 200000 }
              as: Public
              as_user_id: "public-pat"
              captures: { cl_id: $.data.id }
            - call: "POST /commission/recovery-fund/appropriations"
              payload: { amount_cents: 6000000, appropriation_note: "FY27 appropriation" }
              as: RecoveryFundTrustee
              as_user_id: "trustee-03"
              captures: { rf_v1: $.data.version }
          trigger:
            - call: "POST /commission/sanction-orders/${so_id}/fine-payments"
              payload: { amount_cents: 100000, paid_on: "2026-08-01" }
              as: Respondent
              as_user_id: "${sam_id}"
            - call: "POST /commission/recovery-fund/disbursements"
              payload: { sanction_order_id: "${so_id}", expected_recovery_fund_version: "${rf_v1}" }
              as: RecoveryFundTrustee
              as_user_id: "trustee-03"
              captures: { e1: $.data.error_id }
            - call: "GET /commission/recovery-fund"
              payload: {}
              as: RecoveryFundTrustee
              as_user_id: "trustee-03"
              captures: { rf_v2: $.data.version }
            - call: "POST /commission/recovery-fund/disbursements"
              payload: { sanction_order_id: "${so_id}", expected_recovery_fund_version: "${rf_v2}" }
              as: RecoveryFundTrustee
              as_user_id: "trustee-03"
          assert:
            - "the claim was ELIGIBLE on filing (order ISSUED, sanction_type FINE, inside the 365-day window) with awarded_cents == 0"
            - "the fine payment returns 200 with fine_paid_cents == 100000 and credits the fund: fine_credits_cents == 100000 and balance_cents == 6100000"
            - "the disbursement holding ${rf_v1} returns 412 with ${e1} == ERR_RECOVERY_FUND_VERSION_CONFLICT - the trustee's view predates a credit made by the respondent on a different endpoint"
            - "after the 412 the claim ${cl_id} is still ELIGIBLE with awarded_cents == 0, awarded_cents and assessment_cents on the fund are still 0 and balance_cents is still 6100000"
            - "${rf_v2} == ${rf_v1} + 1: the fine payment bumped the fund exactly once and the refused disbursement not at all"
            - "the refreshed run returns 200 with total_awarded_cents == 200000, assessment_cents == 4000 (0.02 x 200000, round_half_up), balance_cents_after == 5896000, paid_claim_count == 1, partially_paid_claim_count == 0 and shaved_claim_id == null"
            - "the response's fund_version == ${rf_v2} + 1, claim ${cl_id} is PAID with awarded_cents == 200000, and Licensee.${sam_id}.recovery_paid_cents == 200000"
            - "the fund's counters reconcile: appropriated_cents == 6000000, fine_credits_cents == 100000, awarded_cents == 200000, assessment_cents == 4000, clawed_back_cents == 0 and balance_cents == 5896000"
      - name: an_n_level_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.Hearing.CONVENED_to_DECIDED
        excluded_because:
          difficulty_instance: transitive_cascade / hearing_revocation_cascades_five_levels_to_a_third_party_student_ce_balance
          rationale: "Both deep_cascade_chain instances of §1.8 walk a four- and a five-level chain end to end, asserting every intermediate level (never only the endpoints) and the ordering sensitivity of the chain."
      - name: both_variants_of_a_dual_variant_calculation_are_produced_and_the_delta_is_checked
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.trust_account_shortage
        excluded_because:
          difficulty_instance: dual_variant_calc / trust_shortage_book_basis_vs_bank_basis_diverge_on_one_ledger
          rationale: "That instance audits one ledger on both bases and asserts the exact delta between BOOK and BANK, plus the variant-selection rule (basis is fixed at scheduling time and never re-chosen)."
      - name: a_cumulative_threshold_is_tested_at_its_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.brokerage_supervision_posture
        excluded_because:
          difficulty_instance: boundary_precision_check / posture_shortage_threshold_99999_watch_versus_100000_restricted_on_ledger_append
          rationale: "The named instance appends one cent at the boundary and flips WATCH to RESTRICTED at exactly 100000, and the reset direction is covered by trust_ledger_correction_restores_book_available_and_the_posture_without_mutating_a_row."

  - section: consistency_model
    instances:
      - name: every_cascade_of_a_write_is_visible_in_that_writes_own_response
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - state_machines.TrustAudit.FINDINGS_ISSUED_to_REMEDIATION_ORDERED
          - state_machines.TrustAccount.OPEN_to_RESTRICTED
          - calculations.brokerage_supervision_posture
        distinguishing_aspect: |
          The declared consistency model is `immediate`, so there is no legal window in which a
          derived field lags. One ISSUE_FINDINGS call moves the audit two states (FINDINGS_ISSUED then
          REMEDIATION_ORDERED), restricts the trust account and re-derives the brokerage posture, and
          all of it must already be true in the responses read immediately afterwards with no
          intervening sweep, retry or delay - and identical on a second read, which rules out a
          read-time recomputation that only happens to agree the first time.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with Dana Broker ACTIVE and self-supervising and an OPEN ESCROW account TA carrying OBLIGATION_OPENED 1000000 and DEPOSIT 800000"
            - "auditor-41 is the auditor of a SCHEDULED BOOK audit with fieldwork already open"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 88, taken_on: "2026-07-01" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Harbor Realty Group", designated_broker_id: "${br_id}", trust_account_required: true, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/trust-accounts"
              payload: { bank_name: "Seaside Bank", account_type: "ESCROW" }
              as: LicensingAnalyst
              captures: { ta_id: $.data.id, ta_v0: $.data.version }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "escrow account opened" }
              as: LicensingAnalyst
              captures: { bkg_v1: $.data.version }
            - call: "POST /commission/licensees/${br_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v1}" }
              as: LicensingAnalyst
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "OBLIGATION_OPENED", amount_cents: 1000000, effective_date: "2026-08-01", transaction_reference: "OBL-41", expected_trust_account_version: "${ta_v0}" }
              as: Broker
              as_user_id: "${br_id}"
            - call: "GET /commission/trust-accounts/${ta_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { ta_v1: $.data.version }
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 800000, effective_date: "2026-08-01", cleared_date: "2026-08-01", transaction_reference: "DEP-41", expected_trust_account_version: "${ta_v1}" }
              as: Broker
              as_user_id: "${br_id}"
            - call: "POST /commission/trust-accounts/${ta_id}/audits"
              payload: { auditor_user_id: "auditor-41", basis: "BOOK", as_of_date: "2026-08-31", fieldwork_start_at: "2026-08-01T00:00:00Z", fieldwork_end_at: "2026-08-01T16:00:00Z" }
              as: TrustAuditor
              as_user_id: "auditor-41"
              captures: { au_id: $.data.id }
            - call: "POST /commission/trust-audits/${au_id}/fieldwork"
              payload: {}
              as: TrustAuditor
              as_user_id: "auditor-41"
          trigger:
            - call: "POST /commission/trust-audits/${au_id}/disposition"
              payload: { action: "ISSUE_FINDINGS", remediation_days: 7 }
              as: TrustAuditor
              as_user_id: "auditor-41"
            - call: "GET /commission/trust-accounts/${ta_id}"
              payload: {}
              as: LicensingAnalyst
            - call: "GET /commission/brokerages/${bkg_id}"
              payload: {}
              as: LicensingAnalyst
            - call: "GET /commission/trust-audits/${au_id}"
              payload: {}
              as: LicensingAnalyst
            - call: "GET /commission/brokerages/${bkg_id}"
              payload: {}
              as: LicensingAnalyst
          assert:
            - "the ISSUE_FINDINGS response itself already reports status == REMEDIATION_ORDERED - not FINDINGS_ISSUED - with computed_shortage_cents == 200000, remediation_round == 1 and remediation_due_at == 2026-08-08T00:00:00Z: the L1b cascade is part of the same request, not a follow-up"
            - "the immediately following read of the trust account shows status == RESTRICTED and shortage_cents == 200000 with no sweep having run"
            - "the immediately following read of the brokerage shows supervision_posture == RESTRICTED and open_audit_finding_count == 1, so the posture calculation was re-derived inside the same request"
            - "the re-read of the audit returns byte-identical status, computed_shortage_cents, remediation_round and remediation_due_at values - the first read was not a lazy recomputation"
            - "the second read of the brokerage returns the same supervision_posture == RESTRICTED and the same version as the first read: reads never mutate and nothing converges after the fact"
