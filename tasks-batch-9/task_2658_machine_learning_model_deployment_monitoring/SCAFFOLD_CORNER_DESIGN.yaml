            - call: "POST /deployments/${d1_id}/ramp"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { ramped_state: $.data.rollout_state, ramped_traffic: $.data.traffic_pct }
            - call: "POST /skew-checks"
              payload: { model_version_id: "${v1_id}", deployment_id: "${d1_id}", training_feature_stats: { amount: { mean: 1.0000 } }, serving_feature_stats: {} }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { empty_serving_err: $.data.error_id }
            - call: "POST /skew-checks"
              payload: { model_version_id: "${v1_id}", deployment_id: "${d1_id}", training_feature_stats: { amount: { mean: 1.0000 } }, serving_feature_stats: { amount: { mean: 1.0000 } } }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { sc_status: $.data.status, sc_ratio: $.data.max_skew_ratio }
            - call: "POST /monitoring-windows"
              payload: { deployment_id: "${d1_id}", model_version_id: "${v1_id}", window_kind: "PERFORMANCE", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z", prediction_count: 1000, labeled_prediction_count: 500, correct_labeled_count: 400, positive_rate: 0.30, p95_latency_ms: 200, observed_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20] }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { w_id: $.data.id, w_score: $.data.health_score, w_status: $.data.status }
          assert:
            - "SHARED CODE, THREE ENDPOINTS: against the PENDING deployment, POST /monitoring-windows and POST /prediction-incidents both return HTTP 409 'ERR_DEPLOYMENT_NOT_SERVING'"
            - "PRIORITY 8 BEATS 66: a skew check with an empty training_feature_stats map on the same PENDING deployment returns HTTP 400 'ERR_INVALID_FEATURE_STATS'"
            - "PRIORITY 44 BEATS 66: a window naming version 1.1.0 on a deployment serving 1.0.0 returns HTTP 422 'ERR_WINDOW_VERSION_MISMATCH', not the serving code"
            - "after one ramp the deployment is 'RAMPING' at traffic_pct 5.00 and the serving precondition is satisfied"
            - "BOTH MAPS ARE CHECKED: an empty serving_feature_stats map still returns HTTP 400 'ERR_INVALID_FEATURE_STATS'"
            - "with both maps populated the skew check is accepted with status 'PASS' and max_skew_ratio 1.0000"
            - "the window is finally accepted with HTTP 201, status 'OPEN' and health_score 91.00 — the same payload that failed twice now succeeds, so nothing was left half-written"

      - name: err_invalid_state_covered_by_the_state_versus_referential_priority_pair
        excluded_because:
          difficulty_instance: state_priority_15_beats_referential_priority_40_on_version_approve
          rationale: |
            ERR_INVALID_STATE (priority 15) is triggered there on POST /model-versions/{id}/decision from a
            DRAFT version, and the same instance proves it outranks ERR_DATASET_NOT_APPROVED. A separate
            §1.9 instance would repeat the identical call with a weaker assertion set.

      - name: err_dataset_not_approved_covered_by_the_cross_entity_gate
        excluded_because:
          difficulty_instance: version_approve_gated_by_training_dataset_approval_state
          rationale: |
            That instance walks the dataset through DRAFT, PENDING_APPROVAL, CHANGES_REQUESTED, REVOKED and
            APPROVED and asserts ERR_DATASET_NOT_APPROVED on every non-APPROVED state, which strictly
            contains any single-shot §1.9 probe of the code.

      - name: err_serving_endpoint_not_open_covered_by_the_operational_state_gate
        excluded_because:
          difficulty_instance: deployment_create_and_ramp_gated_by_serving_endpoint_operational_state
          rationale: |
            ERR_SERVING_ENDPOINT_NOT_OPEN is asserted there on BOTH endpoints that carry it (create and
            ramp) under FROZEN and DRAINED, plus the recovery back to OPEN.

      - name: err_open_incident_and_capacity_codes_covered_by_the_safety_fiscal_pair
        excluded_because:
          difficulty_instance: safety_priority_33_beats_fiscal_priority_70_on_ramp
          rationale: |
            ERR_OPEN_INCIDENT_BLOCKS_ACTION and ERR_ENDPOINT_CAPACITY_EXHAUSTED are both triggered there,
            individually and simultaneously, so the catalogue coverage and the ordering claim are already
            proven on the ramp endpoint.

      - name: err_duplicate_open_window_and_overlap_codes_covered_by_the_constraint_temporal_pair
        excluded_because:
          difficulty_instance: constraint_priority_53_beats_temporal_priority_62_on_monitoring_window
          rationale: |
            ERR_DUPLICATE_OPEN_WINDOW and ERR_MONITORING_WINDOW_OVERLAP are both raised there on
            POST /monitoring-windows, including the case where a single payload violates both.

      - name: err_serve_window_conflict_covered_by_the_cooldown_overlap_instance
        excluded_because:
          difficulty_instance: serve_window_half_open_with_asymmetric_trailing_cooldown_buffer
          rationale: |
            ERR_SERVE_WINDOW_CONFLICT is triggered there at the exact cooldown boundary and one minute
            inside it, which is a strictly stronger probe than an arbitrary overlapping pair.

      - name: err_max_extensions_reached_covered_by_the_extend_cycle_instance
        excluded_because:
          difficulty_instance: challenger_evaluation_inconclusive_extend_cycle
          rationale: |
            The bounded cycle is walked to exhaustion there, so ERR_MAX_EXTENSIONS_REACHED is asserted on
            the third extend attempt together with the extension_count and evaluation_ends_at arithmetic.

      - name: err_skew_check_failed_covered_by_the_block_threshold_boundary
        excluded_because:
          difficulty_instance: skew_ratio_exactly_at_block_threshold_on_skew_checks
          rationale: |
            ERR_SKEW_CHECK_FAILED is asserted there on the ramp that follows a FAIL_SKEW check produced at
            exactly SKEW_BLOCK, and the superseding WARN check that clears it.

      - name: err_health_critical_blocked_covered_by_the_critical_drift_cascade
        excluded_because:
          difficulty_instance: drift_report_critical_cascade_depth_five
          rationale: |
            The CRITICAL cascade leaves the deployment health_state CRITICAL, and that instance asserts
            ERR_HEALTH_CRITICAL_BLOCKED on the blocked ramp and RESUME that follow, so the code is already
            triggerable from the cascade fixture.

      - name: a_version_that_is_not_yet_approved_cannot_be_deployed_at_any_pre_approval_state
        claim_type: Error triggerable
        grounds:
          - errors.ERR_VERSION_NOT_APPROVED
          - endpoints.POST_deployments
          - state_machines.ModelVersion
        distinguishing_aspect: |
          ERR_VERSION_NOT_APPROVED is the one referential gate on POST /deployments that is NOT satisfied by
          "the row exists": the version must be in exactly one of seven approval states. The instance walks
          three distinct pre-approval states — DRAFT, PENDING_REVIEW and CHANGES_REQUESTED — through the same
          create call, so an implementation that only guards DRAFT (or only guards "not APPROVED or BLOCKED")
          is caught. It also proves the rejected writes never advance the OCC parent: one and the same
          expected_serving_endpoint_version token works for all four attempts.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default"
            - "one APPROVED dataset with feature_hash fs-v1, one freshly registered DRAFT version 1.0.0, one OPEN cluster serving fs-v1"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml" }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { m_id: $.data.id }
            - call: "POST /training-datasets"
              payload: { name: "snap-2026-07", snapshot_uri: "s3://snaps/2026-07", row_count: 1000000, feature_hash: "fs-v1", baseline_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20], baseline_positive_rate: 0.30, license_class: "INTERNAL", pii_review_passed: true }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ds_id: $.data.id }
            - call: "POST /training-datasets/${ds_id}/submit"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /training-datasets/${ds_id}/decision"
              payload: { decision: "APPROVE" }
              as: DataSteward
              as_user_id: "u_stew_1"
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.0.0", artifact_digest: "sha256:aaa", feature_spec_hash: "fs-v1", baseline_accuracy: 0.82, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 200, doc_sections: ["INTENDED_USE", "TRAINING_DATA", "EVALUATION", "LIMITATIONS"], repro_artifacts: ["TRAINING_CODE_COMMIT", "ENV_LOCKFILE_DIGEST", "RANDOM_SEED", "FEATURE_SPEC_HASH"] }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v1_id: $.data.id, v1_state0: $.data.approval_state }
            - call: "POST /serving-endpoints"
              payload: { name: "rt-cluster-a", region: "us-east-1", serving_feature_spec_hash: "fs-v1", max_traffic_pct: 100.00, deploy_cooldown_minutes: 30 }
              as: PlatformAdmin
              as_user_id: "u_admin_1"
              captures: { se_id: $.data.id, se_v: $.data.version }
          trigger:
            - call: "POST /deployments"
              payload: { model_version_id: "${v1_id}", serving_endpoint_id: "${se_id}", pattern: "REALTIME", serve_from: "2026-08-01T00:00:00Z", serve_until: "2026-12-31T00:00:00Z", expected_serving_endpoint_version: "${se_v}", fallback_strategy: "PREVIOUS_CHAMPION" }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { draft_err: $.data.error_id }
            - call: "POST /model-versions/${v1_id}/submit-for-review"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v1_state1: $.data.approval_state }
            - call: "POST /deployments"
              payload: { model_version_id: "${v1_id}", serving_endpoint_id: "${se_id}", pattern: "REALTIME", serve_from: "2026-08-01T00:00:00Z", serve_until: "2026-12-31T00:00:00Z", expected_serving_endpoint_version: "${se_v}", fallback_strategy: "PREVIOUS_CHAMPION" }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { pending_err: $.data.error_id }
            - call: "POST /model-versions/${v1_id}/decision"
              payload: { decision: "REQUEST_CHANGES" }
              as: ModelApprover
              as_user_id: "u_appr_1"
              captures: { v1_state2: $.data.approval_state }
            - call: "POST /deployments"
              payload: { model_version_id: "${v1_id}", serving_endpoint_id: "${se_id}", pattern: "REALTIME", serve_from: "2026-08-01T00:00:00Z", serve_until: "2026-12-31T00:00:00Z", expected_serving_endpoint_version: "${se_v}", fallback_strategy: "PREVIOUS_CHAMPION" }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { changes_err: $.data.error_id }
            - call: "PATCH /model-versions/${v1_id}/documentation"
              payload: { doc_sections: ["INTENDED_USE", "TRAINING_DATA", "EVALUATION", "LIMITATIONS", "ETHICAL_REVIEW"], repro_artifacts: ["TRAINING_CODE_COMMIT", "ENV_LOCKFILE_DIGEST", "RANDOM_SEED", "FEATURE_SPEC_HASH"] }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v1_state3: $.data.approval_state, v1_doc_pct: $.data.doc_completeness_pct }
            - call: "POST /model-versions/${v1_id}/submit-for-review"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /model-versions/${v1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ModelApprover
              as_user_id: "u_appr_1"
              captures: { v1_state4: $.data.approval_state }
            - call: "GET /serving-endpoints/${se_id}"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { se_v_before_success: $.data.version }
            - call: "POST /deployments"
              payload: { model_version_id: "${v1_id}", serving_endpoint_id: "${se_id}", pattern: "REALTIME", serve_from: "2026-08-01T00:00:00Z", serve_until: "2026-12-31T00:00:00Z", expected_serving_endpoint_version: "${se_v}", fallback_strategy: "PREVIOUS_CHAMPION" }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { d1_id: $.data.id, d1_state: $.data.rollout_state }
          assert:
            - "the freshly registered version is in 'DRAFT', and POST /deployments against it returns HTTP 422 with error_id 'ERR_VERSION_NOT_APPROVED'"
            - "after submit-for-review the version is 'PENDING_REVIEW' and the identical create still returns HTTP 422 'ERR_VERSION_NOT_APPROVED' — being under review is not being approved"
            - "after REQUEST_CHANGES the version is 'CHANGES_REQUESTED' and the identical create returns HTTP 422 'ERR_VERSION_NOT_APPROVED' for the third time"
            - "the documentation PATCH returns the version to 'DRAFT' (and lifts doc_completeness_pct to 100.00 with all five sections present), so the re-review path is the only way forward"
            - "once the version reaches 'APPROVED' the very same request body succeeds: HTTP 201 with rollout_state 'PENDING'"
            - "REJECTED WRITES DO NOT BUMP THE OCC PARENT: the cluster is still at version 1 right before the successful create, which is why the unchanged expected_serving_endpoint_version token was accepted on the fourth attempt"

  # ===========================================================================
  # 7. From Table 7 (RBAC) — role_model: segregation_of_duties
  # ===========================================================================
  - section: rbac
    instances:

      - name: approval_roles_cannot_reach_each_others_exclusive_operations
        claim_type: Role exclusive operation
        grounds:
          - roles.MLEngineer.exclusive_operations
          - roles.ModelApprover.exclusive_operations
          - roles.PlatformAdmin.description
          - validations.priority_2
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          The registration/approval split is structural in both directions: the engineer who registers a
          version cannot decide it and the approver who decides it cannot register or document one. The
          instance also nails the deliberate NON-superuser shape of PlatformAdmin — it is refused on
          version registration, deployment creation and ramping, which no role can do on the admin's behalf.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default"
            - "one APPROVED dataset, one PENDING_REVIEW version 1.0.0 and one PENDING REALTIME deployment of an APPROVED version 1.1.0"
