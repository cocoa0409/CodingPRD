# =============================================================================
# Task 1363: Tortilla & Masa Production — §1.9 Scaffold Corner Design
# Breadth coverage of every §1.1–§1.7 claim not already probed by §1.8.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: entities_product_defaults_and_computed_fields
        claim_type: creation_defaults_computed
        grounds: [entities.Product.fields.weight_tolerance_pct, entities.Product.fields.shelf_life_days, entities.Product.fields.declared_pack_net_g]
        distinguishing_aspect: "Omitting weight_tolerance_pct applies the 2.0 default; shelf_life_days and declared weights are server-computed (NONE preservative -> 5 days)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plant/products", payload: { sku_code: "E-DEF", diameter_in: "D10", count_per_pack: 24, packs_per_case: 6, unit_weight_g: 25, channel: "FOODSERVICE", preservative_system: "NONE", allergen_class: "CORN_ONLY" }, as: PlantManager, captures: { p: "$.data.id", tol: "$.data.weight_tolerance_pct", sld: "$.data.shelf_life_days", pack_g: "$.data.declared_pack_net_g", ver: "$.data.version" } }
          assert:
            - "Product.${p}.weight_tolerance_pct == 2.0 (default applied)"
            - "Product.${p}.shelf_life_days == 5 (NONE preservative)"
            - "Product.${p}.declared_pack_net_g == 600.0 (25 x 24)"
            - "Product.${p}.product_status == ACTIVE and version == 1"

      - name: entities_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but absent UUID yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /plant/products/00000000-0000-4000-8000-000000000000", payload: {}, as: PlantManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

      - name: entities_fk_reference_must_exist
        claim_type: parent_relationship
        grounds:
          - "entities.NixtamalBatch.fields.ingredient_lot_id"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Creating a batch against a nonexistent ingredient lot is rejected with ERR_NOT_FOUND before any state logic runs."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plant/nixtamal-batches", payload: { ingredient_lot_id: "00000000-0000-4000-8000-000000000000", corn_kg: 100, lime_pct: 1.0, cook_minutes: 90, steep_target_hours: 8 }, as: MillerOperator, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_FOUND (dangling FK)"

      - name: entities_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Product.fields.diameter_in"
          - "errors[ERR_INVALID_ENUM]"
        distinguishing_aspect: "diameter_in 'D7' is not a declared member -> ERR_INVALID_ENUM."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plant/products", payload: { sku_code: "E-ENUM", diameter_in: "D7", count_per_pack: 12, packs_per_case: 10, unit_weight_g: 30, channel: "RETAIL", preservative_system: "PROPIONATE", allergen_class: "CORN_ONLY" }, as: PlantManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_ENUM (http 400)"

      - name: entities_product_create_missing_required_sku
        claim_type: required_fields
        grounds:
          - "entities.Product.fields.sku_code"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required sku_code -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plant/products", payload: { diameter_in: "D6", count_per_pack: 12, packs_per_case: 10, unit_weight_g: 30, channel: "RETAIL", preservative_system: "PROPIONATE", allergen_class: "CORN_ONLY" }, as: PlantManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"

      - name: entities_duplicate_sku_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Product.fields.sku_code"
          - "errors[ERR_DUPLICATE_CODE]"
        distinguishing_aspect: "Second product reusing an existing sku_code -> ERR_DUPLICATE_CODE (409)."
        test_recipe:
          setup: ["product DUP-1 already exists"]
          setup_api_calls:
            - { call: "POST /plant/products", payload: { sku_code: "DUP-1", diameter_in: "D6", count_per_pack: 12, packs_per_case: 10, unit_weight_g: 30, channel: "RETAIL", preservative_system: "PROPIONATE", allergen_class: "CORN_ONLY" }, as: PlantManager }
          trigger:
            - { call: "POST /plant/products", payload: { sku_code: "DUP-1", diameter_in: "D8", count_per_pack: 10, packs_per_case: 8, unit_weight_g: 40, channel: "FOODSERVICE", preservative_system: "NONE", allergen_class: "SOY_BLENDED" }, as: PlantManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_DUPLICATE_CODE"

      - name: entities_lot_auto_depletes_at_zero
        claim_type: computed_fields
        grounds: [entities.IngredientLot.fields.available_kg, state_machines.IngredientLot.CONDITIONED_to_DEPLETED]
        distinguishing_aspect: "Drawing the full 1000 kg of a CONDITIONED lot into a batch drives available_kg to exactly 0 and auto-transitions the lot to DEPLETED."
        test_recipe:
          setup: ["CONDITIONED lot of exactly 1000 kg"]
          setup_api_calls:
            - { call: "POST /plant/ingredient-lots", payload: { lot_code: "LOT-DEP", corn_variety: "BLUE_CORN", received_kg: 1000, moisture_pct: 14.0 }, as: PlantManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /plant/ingredient-lots/${lot_id}/condition", payload: {}, as: MillerOperator }
          trigger:
            - { call: "POST /plant/nixtamal-batches", payload: { ingredient_lot_id: "${lot_id}", corn_kg: 1000, lime_pct: 1.0, cook_minutes: 90, steep_target_hours: 8 }, as: MillerOperator, captures: { batch_id: "$.data.id", theo: "$.data.theoretical_masa_kg" } }
            - { call: "GET /plant/ingredient-lots/${lot_id}", payload: {}, as: MillerOperator, captures: { lot_status: "$.data.lot_status", avail: "$.data.available_kg", drawn: "$.data.drawn_kg" } }
          assert:
            - "IngredientLot.available_kg == 0 and drawn_kg == 1000"
            - "IngredientLot.lot_status == DEPLETED (auto-transition at zero)"
            - "batch theoretical_masa_kg == 1600.0 (1000 x 1.60 BLUE_CORN)"

      - name: entities_pagination_defaults_and_windowing
        claim_type: listing
        grounds: [response_envelope.pagination_defaults, entities.CustomerAccount]
        distinguishing_aspect: "Default page is limit=10/offset=0; 12 customers -> first page 10 items with has_more true; limit=2&offset=10 returns the last 2 with has_more false."
        test_recipe:
          setup: ["12 customers created"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { account_name: "C01", channel: "RETAIL_GROCERY", region: "R1", base_weekly_cases: 1, priority_tier: "A", min_shelf_life_pct: 10 }, as: PlantManager }
            - { call: "POST /plant/customers", payload: { account_name: "C02", channel: "RETAIL_GROCERY", region: "R1", base_weekly_cases: 1, priority_tier: "A", min_shelf_life_pct: 10 }, as: PlantManager }
            - { call: "POST /plant/customers", payload: { account_name: "C03", channel: "RETAIL_GROCERY", region: "R1", base_weekly_cases: 1, priority_tier: "A", min_shelf_life_pct: 10 }, as: PlantManager }
            - { call: "POST /plant/customers", payload: { account_name: "C04", channel: "RETAIL_GROCERY", region: "R1", base_weekly_cases: 1, priority_tier: "A", min_shelf_life_pct: 10 }, as: PlantManager }
            - { call: "POST /plant/customers", payload: { account_name: "C05", channel: "RETAIL_GROCERY", region: "R1", base_weekly_cases: 1, priority_tier: "A", min_shelf_life_pct: 10 }, as: PlantManager }
            - { call: "POST /plant/customers", payload: { account_name: "C06", channel: "RETAIL_GROCERY", region: "R1", base_weekly_cases: 1, priority_tier: "A", min_shelf_life_pct: 10 }, as: PlantManager }
            - { call: "POST /plant/customers", payload: { account_name: "C07", channel: "RETAIL_GROCERY", region: "R1", base_weekly_cases: 1, priority_tier: "A", min_shelf_life_pct: 10 }, as: PlantManager }
            - { call: "POST /plant/customers", payload: { account_name: "C08", channel: "RETAIL_GROCERY", region: "R1", base_weekly_cases: 1, priority_tier: "A", min_shelf_life_pct: 10 }, as: PlantManager }
            - { call: "POST /plant/customers", payload: { account_name: "C09", channel: "RETAIL_GROCERY", region: "R1", base_weekly_cases: 1, priority_tier: "A", min_shelf_life_pct: 10 }, as: PlantManager }
            - { call: "POST /plant/customers", payload: { account_name: "C10", channel: "RETAIL_GROCERY", region: "R1", base_weekly_cases: 1, priority_tier: "A", min_shelf_life_pct: 10 }, as: PlantManager }
            - { call: "POST /plant/customers", payload: { account_name: "C11", channel: "RETAIL_GROCERY", region: "R1", base_weekly_cases: 1, priority_tier: "A", min_shelf_life_pct: 10 }, as: PlantManager }
            - { call: "POST /plant/customers", payload: { account_name: "C12", channel: "RETAIL_GROCERY", region: "R1", base_weekly_cases: 1, priority_tier: "A", min_shelf_life_pct: 10 }, as: PlantManager }
          trigger:
            - { call: "GET /plant/customers", payload: {}, as: PlantManager }
            - { call: "GET /plant/customers?limit=2&offset=10", payload: {}, as: PlantManager }
          assert:
            - "page 1: 10 items, total_count == 12, has_more == true (defaults limit=10, offset=0)"
            - "page 2 with limit=2&offset=10: 2 items, has_more == false"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: sm_batch_terminal_rejected_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.NixtamalBatch"
          - "errors[ERR_BATCH_INVALID_STATE]"
        distinguishing_aspect: "A REJECTED batch accepts no further transitions: start-cook fails with ERR_BATCH_INVALID_STATE."
        test_recipe:
          setup: ["batch driven to REJECTED via evaluate REJECT"]
          setup_api_calls:
            - { call: "POST /plant/ingredient-lots", payload: { lot_code: "LOT-TL", corn_variety: "WHITE_CORN", received_kg: 5000, moisture_pct: 12.5 }, as: PlantManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /plant/ingredient-lots/${lot_id}/condition", payload: {}, as: MillerOperator }
            - { call: "POST /plant/nixtamal-batches", payload: { ingredient_lot_id: "${lot_id}", corn_kg: 500, lime_pct: 1.0, cook_minutes: 90, steep_target_hours: 8 }, as: MillerOperator, captures: { batch_id: "$.data.id" } }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/start-cook", payload: {}, as: MillerOperator }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/start-steep", payload: {}, as: MillerOperator }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/evaluate", payload: { decision: "REJECT" }, as: QualityInspector, captures: { st: "$.data.batch_status" } }
          trigger:
            - { call: "POST /plant/nixtamal-batches/${batch_id}/start-cook", payload: {}, as: MillerOperator, captures: { err: "$.data.error_id" } }
          assert:
            - "batch_status == REJECTED after evaluate REJECT"
            - "start-cook on terminal batch: error_id == ERR_BATCH_INVALID_STATE; no fields mutate"

      - name: sm_run_initial_states_are_planned_and_pending
        claim_type: initial_state
        grounds: [state_machines.ProductionRun, entities.ProductionRun.fields.qc_status]
        distinguishing_aspect: "A newly created run starts PLANNED on the production dimension and PENDING on the qc dimension."
        test_recipe:
          setup: ["one product and one SHARED line"]
          setup_api_calls:
            - { call: "POST /plant/products", payload: { sku_code: "SM-INIT", diameter_in: "D6", count_per_pack: 12, packs_per_case: 10, unit_weight_g: 30, channel: "RETAIL", preservative_system: "PROPIONATE", allergen_class: "CORN_ONLY" }, as: PlantManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /plant/lines", payload: { line_code: "L-INIT", allergen_zone: "SHARED", cases_per_hour: 100 }, as: PlantManager, captures: { line_id: "$.data.id", lv: "$.data.version" } }
          trigger:
            - { call: "POST /plant/runs", payload: { product_id: "${prod_id}", line_id: "${line_id}", planned_cases: 10, start_at: "2026-08-02T10:00:00Z", end_at: "2026-08-02T11:00:00Z", expected_line_version: "${lv}" }, as: LineScheduler, captures: { run_id: "$.data.id", ps: "$.data.production_status", qc: "$.data.qc_status", req: "$.data.masa_required_kg" } }
          assert:
            - "production_status == PLANNED and qc_status == PENDING"
            - "masa_required_kg == 38.88 (10 x 10 x 12 x 30 / 1000 x 1.08, 2dp)"

      - name: sm_run_start_from_planned_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.ProductionRun.SCHEDULED_to_IN_PROGRESS"
          - "errors[ERR_RUN_INVALID_STATE]"
        distinguishing_aspect: "start requires SCHEDULED; calling it on a PLANNED run fails with ERR_RUN_INVALID_STATE (skipping schedule is not allowed)."
        test_recipe:
          setup: ["product + line + PLANNED run"]
          setup_api_calls:
            - { call: "POST /plant/products", payload: { sku_code: "SM-PS", diameter_in: "D6", count_per_pack: 12, packs_per_case: 10, unit_weight_g: 30, channel: "RETAIL", preservative_system: "PROPIONATE", allergen_class: "CORN_ONLY" }, as: PlantManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /plant/lines", payload: { line_code: "L-PS", allergen_zone: "SHARED", cases_per_hour: 100 }, as: PlantManager, captures: { line_id: "$.data.id", lv: "$.data.version" } }
            - { call: "POST /plant/runs", payload: { product_id: "${prod_id}", line_id: "${line_id}", planned_cases: 10, start_at: "2026-08-02T10:00:00Z", end_at: "2026-08-02T11:00:00Z", expected_line_version: "${lv}" }, as: LineScheduler, captures: { run_id: "$.data.id" } }
          trigger:
            - { call: "POST /plant/runs/${run_id}/start", payload: {}, as: LineScheduler, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_RUN_INVALID_STATE"

      - name: sm_pack_order_double_seal_rejected
        claim_type: idempotency
        grounds:
          - "state_machines.PackOrder.PASSED_to_SEALED"
          - "errors[ERR_PACK_INVALID_STATE]"
        distinguishing_aspect: "Sealing an already-SEALED pack order fails with ERR_PACK_INVALID_STATE — seal is not idempotent."
        test_recipe:
          setup: ["full chain: batch milled, run IN_PROGRESS, pack order SEALED with 5 cases"]
          setup_api_calls:
            - { call: "POST /plant/ingredient-lots", payload: { lot_code: "LOT-DS", corn_variety: "WHITE_CORN", received_kg: 5000, moisture_pct: 12.5 }, as: PlantManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /plant/ingredient-lots/${lot_id}/condition", payload: {}, as: MillerOperator }
            - { call: "POST /plant/nixtamal-batches", payload: { ingredient_lot_id: "${lot_id}", corn_kg: 1000, lime_pct: 1.0, cook_minutes: 90, steep_target_hours: 8 }, as: MillerOperator, captures: { batch_id: "$.data.id" } }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/start-cook", payload: {}, as: MillerOperator }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/start-steep", payload: {}, as: MillerOperator }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/evaluate", payload: { decision: "PASS" }, as: QualityInspector }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/mill", payload: { milled_masa_kg: 1620, measured_moisture_pct: 58, masa_wasted_kg: 20 }, as: MillerOperator }
            - { call: "POST /plant/products", payload: { sku_code: "SM-DS", diameter_in: "D6", count_per_pack: 12, packs_per_case: 10, unit_weight_g: 30, channel: "RETAIL", preservative_system: "PROPIONATE", allergen_class: "CORN_ONLY" }, as: PlantManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /plant/lines", payload: { line_code: "L-DS", allergen_zone: "SHARED", cases_per_hour: 100 }, as: PlantManager, captures: { line_id: "$.data.id", lv: "$.data.version" } }
            - { call: "POST /plant/runs", payload: { product_id: "${prod_id}", line_id: "${line_id}", planned_cases: 50, start_at: "2026-08-02T10:00:00Z", end_at: "2026-08-02T12:00:00Z", expected_line_version: "${lv}" }, as: LineScheduler, captures: { run_id: "$.data.id" } }
            - { call: "POST /plant/runs/${run_id}/schedule", payload: {}, as: LineScheduler }
            - { call: "POST /plant/allocations", payload: { nixtamal_batch_id: "${batch_id}", production_run_id: "${run_id}", allocated_kg: 194.4 }, as: LineScheduler }
            - { call: "POST /plant/runs/${run_id}/start", payload: {}, as: LineScheduler }
            - { call: "POST /plant/pack-orders", payload: { production_run_id: "${run_id}", cases_planned: 5, verification_method: "AVERAGE_WEIGHT" }, as: PackagingLead, captures: { po_id: "$.data.id" } }
            - { call: "POST /plant/pack-orders/${po_id}/start-packing", payload: {}, as: PackagingLead }
            - { call: "POST /plant/pack-orders/${po_id}/weight-check", payload: { cases_packed: 5, sample_weights_g: [360.0, 360.0, 360.0] }, as: PackagingLead }
            - { call: "POST /plant/pack-orders/${po_id}/seal", payload: {}, as: PackagingLead, captures: { st1: "$.data.pack_status" } }
          trigger:
            - { call: "POST /plant/pack-orders/${po_id}/seal", payload: {}, as: PackagingLead, captures: { err: "$.data.error_id" } }
          assert:
            - "first seal: pack_status == SEALED"
            - "second seal: error_id == ERR_PACK_INVALID_STATE; expires_on and sealed_at unchanged"

      - name: sm_allocation_release_twice_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.BatchAllocation.RESERVED_to_RELEASED"
          - "errors[ERR_ALLOCATION_INVALID_STATE]"
        distinguishing_aspect: "Releasing an already-RELEASED allocation fails with ERR_ALLOCATION_INVALID_STATE and must not double-restore masa."
        test_recipe:
          setup: ["batch MASA_AVAILABLE 1552.0; run PLANNED; allocation of 100 kg created then released"]
          setup_api_calls:
            - { call: "POST /plant/ingredient-lots", payload: { lot_code: "LOT-AR", corn_variety: "WHITE_CORN", received_kg: 5000, moisture_pct: 12.5 }, as: PlantManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /plant/ingredient-lots/${lot_id}/condition", payload: {}, as: MillerOperator }
            - { call: "POST /plant/nixtamal-batches", payload: { ingredient_lot_id: "${lot_id}", corn_kg: 1000, lime_pct: 1.0, cook_minutes: 90, steep_target_hours: 8 }, as: MillerOperator, captures: { batch_id: "$.data.id" } }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/start-cook", payload: {}, as: MillerOperator }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/start-steep", payload: {}, as: MillerOperator }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/evaluate", payload: { decision: "PASS" }, as: QualityInspector }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/mill", payload: { milled_masa_kg: 1620, measured_moisture_pct: 58, masa_wasted_kg: 20 }, as: MillerOperator }
            - { call: "POST /plant/products", payload: { sku_code: "SM-AR", diameter_in: "D6", count_per_pack: 12, packs_per_case: 10, unit_weight_g: 30, channel: "RETAIL", preservative_system: "PROPIONATE", allergen_class: "CORN_ONLY" }, as: PlantManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /plant/lines", payload: { line_code: "L-AR", allergen_zone: "SHARED", cases_per_hour: 100 }, as: PlantManager, captures: { line_id: "$.data.id", lv: "$.data.version" } }
            - { call: "POST /plant/runs", payload: { product_id: "${prod_id}", line_id: "${line_id}", planned_cases: 50, start_at: "2026-08-02T10:00:00Z", end_at: "2026-08-02T12:00:00Z", expected_line_version: "${lv}" }, as: LineScheduler, captures: { run_id: "$.data.id" } }
            - { call: "POST /plant/allocations", payload: { nixtamal_batch_id: "${batch_id}", production_run_id: "${run_id}", allocated_kg: 100 }, as: LineScheduler, captures: { al_id: "$.data.id" } }
            - { call: "POST /plant/allocations/${al_id}/release", payload: {}, as: LineScheduler }
          trigger:
            - { call: "POST /plant/allocations/${al_id}/release", payload: {}, as: LineScheduler, captures: { err: "$.data.error_id" } }
            - { call: "GET /plant/nixtamal-batches/${batch_id}", payload: {}, as: LineScheduler, captures: { avail: "$.data.masa_available_kg" } }
          assert:
            - "second release: error_id == ERR_ALLOCATION_INVALID_STATE"
            - "masa_available_kg == 1552.0 (no double restore)"

      - name: sm_window_activate_twice_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.SeasonalWindow"
          - "errors[ERR_WINDOW_INVALID_STATE]"
        distinguishing_aspect: "Activating an already-ACTIVE window fails with ERR_WINDOW_INVALID_STATE and does not duplicate allotments."
        test_recipe:
          setup: ["window 2026-08-10..16 ACTIVE with one customer"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { account_name: "WA", channel: "RETAIL_GROCERY", region: "R1", base_weekly_cases: 10, priority_tier: "A", min_shelf_life_pct: 10 }, as: PlantManager }
            - { call: "POST /plant/seasonal-windows", payload: { window_name: "W2X", starts_on: "2026-08-10", ends_on: "2026-08-16", demand_multiplier: 1.2, forecast_total_cases: 100 }, as: PlantManager, captures: { win_id: "$.data.id" } }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/seasonal-windows/${win_id}/activate", payload: {}, as: PlantManager }
          trigger:
