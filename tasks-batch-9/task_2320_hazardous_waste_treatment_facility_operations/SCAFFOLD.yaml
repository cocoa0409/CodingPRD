  - { error_id: ERR_UNAUTHENTICATED, http_status: 401, message: "Missing or malformed authentication headers", trigger: "validation priority 1" }
  - { error_id: ERR_ROLE_NOT_PERMITTED, http_status: 403, message: "Role is not permitted to perform this operation", trigger: "validation priority 2" }
  - { error_id: ERR_GENERATOR_SCOPE_VIOLATION, http_status: 403, message: "Generator callers may only address their own rows", trigger: "validation priority 3" }
  - { error_id: ERR_INVALID_REQUEST, http_status: 400, message: "Request body or query parameters are invalid", trigger: "validation priority 4" }
  - { error_id: ERR_FACILITY_NOT_FOUND, http_status: 404, message: "Facility does not exist", trigger: "validation priority 5 on a facility path" }
  - { error_id: ERR_GENERATOR_NOT_FOUND, http_status: 404, message: "Generator does not exist", trigger: "validation priority 5 on a generator path" }
  - { error_id: ERR_WASTE_PROFILE_NOT_FOUND, http_status: 404, message: "Waste profile does not exist", trigger: "validation priority 5 on a waste-profile path" }
  - { error_id: ERR_MANIFEST_NOT_FOUND, http_status: 404, message: "Manifest does not exist", trigger: "validation priority 5 on a manifest path" }
  - { error_id: ERR_STORAGE_UNIT_NOT_FOUND, http_status: 404, message: "Storage unit does not exist", trigger: "validation priority 5 on a storage-unit path" }
  - { error_id: ERR_CONTAINER_NOT_FOUND, http_status: 404, message: "Container does not exist", trigger: "validation priority 5 on a container path" }
  - { error_id: ERR_TREATMENT_BATCH_NOT_FOUND, http_status: 404, message: "Treatment batch does not exist", trigger: "validation priority 5 on a treatment-batch path" }
  - { error_id: ERR_RESOURCE_NOT_FOUND, http_status: 404, message: "Addressed resource does not exist", trigger: "validation priority 5 on an instrument, sample, inspection, repair order or finding path" }
