        claim_type: violation_to_error
        grounds: ["errors[ERR_KILN_OVERLAP]", "errors[ERR_SAW_LINE_BOOKED]"]
        excluded_because:
          difficulty_instance: kiln_charge_overlap_turnaround_buffer
          rationale: "Both overlap errors are the asserted outcomes of the two §1.8 rule-8 instances (kiln_charge_overlap_turnaround_buffer and saw_line_daily_booking_adjacency)."

      - name: deck_capacity_and_contract_not_active_error_paths
        claim_type: violation_to_error
        grounds: ["errors[ERR_DECK_CAPACITY_EXCEEDED]", "errors[ERR_CONTRACT_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: deck_undeck_occupancy_conservation
          rationale: "ERR_DECK_CAPACITY_EXCEEDED is asserted in deck_undeck_occupancy_conservation; ERR_CONTRACT_NOT_ACTIVE is asserted in order_placement_gated_on_contract_active."

      - name: schedule_in_past_priority_path
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=7]"]
        excluded_because:
          difficulty_instance: kiln_create_temporal_beats_constraint
          rationale: "Temporal-beats-constraint priority asserted in §1.8; the standalone ERR_SCHEDULE_IN_PAST trigger is covered by start_charge_before_window_returns_schedule_in_past."

