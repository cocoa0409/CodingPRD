# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-reference of SCAFFOLD.yaml §1.1-§1.7 against the nine §0.5 Difficulty
# Rules. Every instance grounds in already-declared scaffold elements.
#
# Shared fixture vocabulary used across instances (all values are literals):
#   P1  CU-500-XHHW  COPPER  12.5 lb/1000ft  base 18 c/ft  min_cut 100
#                    cut_charge 3500  deposit 12500  master 2500 ft  320.0 lbs
#   P3  AL-BARE-4/0  ALUMINUM 0 lb/1000ft   base 100 c/ft min_cut 50
#                    cut_charge 0     deposit 0     master 1000 ft  100.0 lbs
#   P4  CU-14-THHN   COPPER   2.0 lb/1000ft base 4 c/ft   min_cut 25
#                    cut_charge 1500  deposit 7500  master 5000 ft   90.0 lbs
#   CI1 2026-07-30 @ 450 c/lb    CI2 2026-08-03 @ 500 c/lb (11.1% shock)
#   CI3 2026-08-03 @ 460 c/lb (2.22%, below the 3% tolerance)
#   Logical clock starts at 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: metal_pass_through_quoted_vs_invoiced_on_order_lines
        grounds:
          - calculations.quote_line_pricing
          - calculations.order_money_rollup
          - entities.OrderLine.fields.quoted_extended_cents
          - entities.OrderLine.fields.invoiced_extended_cents
          - entities.SalesOrder.fields.metal_variance_cents
          - state_machines.SalesOrder.STAGED_to_DELIVERED
        distinguishing_aspect: |
          This dual variant lives on the ORDER-LINE MONEY domain: identical
          footage and identical base and cut components price to 6737 cents under
          variant QUOTED (index pinned at issue, 450 c/lb) and 6822 cents under
          variant INVOICED (index effective on the delivery date, 500 c/lb),
          because only the copper component moves.
        test_recipe:
          setup:
            - "One branch with zero freight surcharge and cut capacity 1, one customer with a 5,000,000-cent limit, product P1, index CI1 at 450 c/lb."
            - "A quote with two identical CUT lines of 137 ft, issued at the default clock against CI1, converted to a SalesOrder."
            - "Both lines allocated from a single 1000 ft reel, both cut in non-colliding bay windows, so the order is STAGED."
            - "A delivery run is scheduled and dispatched; index CI2 at 500 c/lb effective 2026-08-03 is published; the clock is moved to 2026-08-07T09:00:00Z."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Houston DC", region_code: "TX", concurrent_cut_capacity: 1, delivery_surcharge_cents: 0 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id" }
            - call: "POST /customers"
              payload: { name: "Gulf Electric", credit_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { part_number: "CU-500-XHHW", conductor_metal: "COPPER", copper_lbs_per_1000ft: 12.5, base_price_cents_per_ft: 18, min_cut_length_ft: 100, cut_charge_cents: 3500, reel_deposit_cents: 12500, master_reel_length_ft: 2500, reel_weight_lbs: 320.0, allowed_put_ups: ["MASTER_REEL", "CUT"] }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /copper-index-entries"
              payload: { effective_date: "2026-07-30", price_cents_per_lb: 450 }
              as: PlatformAdmin
              captures: { ci1_id: "$.data.id" }
            - call: "POST /trucks"
              payload: { branch_id: "${br_id}", truck_code: "T-1", has_boom_lift: false, max_reel_slots: 6 }
              as: PlatformAdmin
              captures: { tr_id: "$.data.id" }
            - call: "POST /reels"
              payload: { product_id: "${p1_id}", branch_id: "${br_id}", lot_code: "L1", nominal_length_ft: 1000 }
              as: PlatformAdmin
              captures: { r1_id: "$.data.id" }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", branch_id: "${br_id}" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { q_id: "$.data.id", q_v1: "$.data.version" }
            - call: "POST /quotes/${q_id}/lines"
              payload: { product_id: "${p1_id}", put_up: "CUT", requested_length_ft: 137, parallel_set_size: 1, expected_quote_version: "${q_v1}" }
              as: SalesRep
              as_user_id: "rep-1"
            - call: "GET /quotes/${q_id}"
              as: SalesRep
              as_user_id: "rep-1"
              captures: { q_v2: "$.data.version" }
            - call: "POST /quotes/${q_id}/lines"
              payload: { product_id: "${p1_id}", put_up: "CUT", requested_length_ft: 137, parallel_set_size: 1, expected_quote_version: "${q_v2}" }
              as: SalesRep
              as_user_id: "rep-1"
            - call: "POST /quotes/${q_id}/issue"
              as: SalesRep
              as_user_id: "rep-2"
            - call: "POST /quotes/${q_id}/convert"
              as: SalesRep
              as_user_id: "rep-2"
              captures: { so_id: "$.data.id", so_v1: "$.data.version" }
            - call: "GET /order-lines"
              payload: { sales_order_id: "${so_id}" }
              as: PlatformAdmin
              captures: { ol1_id: "$.data[0].id", ol2_id: "$.data[1].id" }
            - call: "POST /sales-orders/${so_id}/allocate"
              payload: { allocation_policy: "MINIMIZE_REMNANT", expected_sales_order_version: "${so_v1}" }
              as: BranchOps
              as_user_id: "${br_id}"
            - call: "GET /allocations"
              payload: { order_line_id: "${ol1_id}" }
              as: BranchOps
              as_user_id: "${br_id}"
              captures: { a1_id: "$.data[0].id" }
            - call: "GET /allocations"
              payload: { order_line_id: "${ol2_id}" }
              as: BranchOps
              as_user_id: "${br_id}"
              captures: { a2_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /allocations/${a1_id}/cut"
              payload: { cut_window_start: "2026-08-06T08:00:00Z", cut_window_end: "2026-08-06T09:00:00Z" }
              as: BranchOps
              as_user_id: "${br_id}"
            - call: "POST /allocations/${a2_id}/cut"
              payload: { cut_window_start: "2026-08-06T10:00:00Z", cut_window_end: "2026-08-06T11:00:00Z" }
              as: BranchOps
              as_user_id: "${br_id}"
            - call: "POST /delivery-runs"
              payload: { sales_order_id: "${so_id}", truck_id: "${tr_id}", window_start: "2026-08-07T08:00:00Z", window_end: "2026-08-07T10:00:00Z", jobsite_address: "1200 Bayou Rd", jobsite_has_forklift: false }
              as: BranchOps
              as_user_id: "${br_id}"
              captures: { run_id: "$.data.id" }
            - call: "POST /delivery-runs/${run_id}/dispatch"
              as: Driver
              as_user_id: "${tr_id}"
            - call: "POST /copper-index-entries"
              payload: { effective_date: "2026-08-03", price_cents_per_lb: 500 }
              as: PlatformAdmin
              captures: { ci2_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /delivery-runs/${run_id}/deliver"
              as: Driver
              as_user_id: "${tr_id}"
          assert:
            - "OrderLine.${ol1_id}.quoted_extended_cents == 6737"
            - "OrderLine.${ol1_id}.invoiced_extended_cents == 6822"
            - "OrderLine.${ol2_id}.quoted_extended_cents == 6737"
            - "OrderLine.${ol2_id}.invoiced_extended_cents == 6822"
            - "SalesOrder.${so_id}.quoted_total_cents == 26974"
            - "SalesOrder.${so_id}.invoiced_total_cents == 27144"
            - "SalesOrder.${so_id}.metal_variance_cents == 170"
            - "SalesOrder.${so_id}.billing_status == INVOICED"
            - "Customer.${cust_id}.open_balance_cents == 27144"
            - "Customer.${cust_id}.credit_status == ACTIVE"

      - name: allocation_policy_minimize_remnant_vs_fewest_reels_on_reel_pool
        grounds:
          - calculations.reel_allocation_plan
          - entities.Allocation.fields.reel_id
          - entities.Reel.fields.allocated_length_ft
          - state_machines.Reel.IN_STOCK_to_ALLOCATED_PARTIAL
          - endpoints["POST /sales-orders/{orderId}/allocate"]
        distinguishing_aspect: |
          This dual variant lives on the REEL INVENTORY domain, not on money:
          against two structurally identical branch pools of 400 ft, 1000 ft and
          250 ft reels, a 300 ft demand broaches the 400 ft reel under
          MINIMIZE_REMNANT and the 1000 ft reel under FEWEST_REELS, so the two
          policies write different Allocation.reel_id values for identical input.
        test_recipe:
          setup:
            - "Two branches, Houston DC and Dallas DC, each stocked with P1 reels of 400 ft, 1000 ft and 250 ft, received in that order."
            - "One customer with a 5,000,000-cent limit; index CI1 at 450 c/lb."
            - "One converted order per branch, each carrying a single CUT line of 300 ft (required_length_ft 300)."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Houston DC", region_code: "TX", concurrent_cut_capacity: 1, delivery_surcharge_cents: 0 }
              as: PlatformAdmin
              captures: { bra_id: "$.data.id" }
            - call: "POST /branches"
              payload: { name: "Dallas DC", region_code: "TX", concurrent_cut_capacity: 1, delivery_surcharge_cents: 0 }
              as: PlatformAdmin
              captures: { brb_id: "$.data.id" }
            - call: "POST /customers"
              payload: { name: "Gulf Electric", credit_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { part_number: "CU-500-XHHW", conductor_metal: "COPPER", copper_lbs_per_1000ft: 12.5, base_price_cents_per_ft: 18, min_cut_length_ft: 100, cut_charge_cents: 3500, reel_deposit_cents: 12500, master_reel_length_ft: 2500, reel_weight_lbs: 320.0, allowed_put_ups: ["MASTER_REEL", "CUT"] }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /copper-index-entries"
              payload: { effective_date: "2026-07-30", price_cents_per_lb: 450 }
              as: PlatformAdmin
            - call: "POST /reels"
              payload: { product_id: "${p1_id}", branch_id: "${bra_id}", lot_code: "LA", nominal_length_ft: 400 }
              as: PlatformAdmin
              captures: { ra1_id: "$.data.id" }
            - call: "POST /reels"
              payload: { product_id: "${p1_id}", branch_id: "${bra_id}", lot_code: "LA", nominal_length_ft: 1000 }
              as: PlatformAdmin
              captures: { ra2_id: "$.data.id" }
            - call: "POST /reels"
              payload: { product_id: "${p1_id}", branch_id: "${bra_id}", lot_code: "LA", nominal_length_ft: 250 }
              as: PlatformAdmin
              captures: { ra3_id: "$.data.id" }
            - call: "POST /reels"
              payload: { product_id: "${p1_id}", branch_id: "${brb_id}", lot_code: "LB", nominal_length_ft: 400 }
              as: PlatformAdmin
              captures: { rb1_id: "$.data.id" }
            - call: "POST /reels"
              payload: { product_id: "${p1_id}", branch_id: "${brb_id}", lot_code: "LB", nominal_length_ft: 1000 }
              as: PlatformAdmin
              captures: { rb2_id: "$.data.id" }
            - call: "POST /reels"
              payload: { product_id: "${p1_id}", branch_id: "${brb_id}", lot_code: "LB", nominal_length_ft: 250 }
              as: PlatformAdmin
              captures: { rb3_id: "$.data.id" }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", branch_id: "${bra_id}" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { qa_id: "$.data.id", qa_v1: "$.data.version" }
            - call: "POST /quotes/${qa_id}/lines"
              payload: { product_id: "${p1_id}", put_up: "CUT", requested_length_ft: 300, parallel_set_size: 1, expected_quote_version: "${qa_v1}" }
              as: SalesRep
              as_user_id: "rep-1"
            - call: "POST /quotes/${qa_id}/issue"
              as: SalesRep
              as_user_id: "rep-2"
            - call: "POST /quotes/${qa_id}/convert"
              as: SalesRep
              as_user_id: "rep-2"
              captures: { soa_id: "$.data.id", soa_v1: "$.data.version" }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", branch_id: "${brb_id}" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { qb_id: "$.data.id", qb_v1: "$.data.version" }
            - call: "POST /quotes/${qb_id}/lines"
              payload: { product_id: "${p1_id}", put_up: "CUT", requested_length_ft: 300, parallel_set_size: 1, expected_quote_version: "${qb_v1}" }
              as: SalesRep
              as_user_id: "rep-1"
            - call: "POST /quotes/${qb_id}/issue"
              as: SalesRep
              as_user_id: "rep-2"
            - call: "POST /quotes/${qb_id}/convert"
              as: SalesRep
              as_user_id: "rep-2"
              captures: { sob_id: "$.data.id", sob_v1: "$.data.version" }
          trigger:
            - call: "POST /sales-orders/${soa_id}/allocate"
              payload: { allocation_policy: "MINIMIZE_REMNANT", expected_sales_order_version: "${soa_v1}" }
              as: BranchOps
              as_user_id: "${bra_id}"
            - call: "POST /sales-orders/${sob_id}/allocate"
              payload: { allocation_policy: "FEWEST_REELS", expected_sales_order_version: "${sob_v1}" }
              as: BranchOps
              as_user_id: "${brb_id}"
          assert:
            - "Reel.${ra1_id}.allocated_length_ft == 300 and Reel.${ra1_id}.status == ALLOCATED_PARTIAL"
            - "Reel.${ra2_id}.allocated_length_ft == 0 and Reel.${ra2_id}.status == IN_STOCK"
            - "Reel.${ra3_id}.allocated_length_ft == 0"
            - "Reel.${rb2_id}.allocated_length_ft == 300 and Reel.${rb2_id}.status == ALLOCATED_PARTIAL"
            - "Reel.${rb1_id}.allocated_length_ft == 0 and Reel.${rb1_id}.status == IN_STOCK"
            - "Reel.${rb3_id}.allocated_length_ft == 0"
            - "SalesOrder.${soa_id}.fulfillment_status == ALLOCATED and SalesOrder.${soa_id}.allocation_policy == MINIMIZE_REMNANT"
            - "SalesOrder.${sob_id}.fulfillment_status == ALLOCATED and SalesOrder.${sob_id}.allocation_policy == FEWEST_REELS"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: cut_charge_tier_keyed_on_per_conductor_billable_length_mode_a
        grounds:
          - calculations.cut_charge_and_billable_length
          - entities.QuoteLine.fields.cut_charge_cents_total
          - entities.QuoteLine.fields.billable_length_ft
          - entities.QuoteLine.fields.parallel_set_size
          - endpoints["POST /quotes/{quoteId}/lines"]
        distinguishing_aspect: |
          Mode (a): four inputs (put_up, requested_length_ft = 200,
          parallel_set_size = 3, product.min_cut_length_ft = 100) run through a
          nested max() into a three-way tier selector that is keyed on the
          PER-CONDUCTOR billable length 200 (tier 1x = 3500) and only then
          multiplied by 3 -- keying the tier on the paralleled total 600 would
          select the free tier and yield 14175 instead of 24675.
        test_recipe:
          setup:
            - "One branch with zero surcharge, one customer with a 5,000,000-cent limit, product P1, index CI1 at 450 c/lb."
            - "A DRAFT quote carrying a single CUT line of 200 ft with parallel_set_size 3, then issued at the default clock."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Houston DC", region_code: "TX", concurrent_cut_capacity: 1, delivery_surcharge_cents: 0 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id" }
            - call: "POST /customers"
              payload: { name: "Gulf Electric", credit_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { part_number: "CU-500-XHHW", conductor_metal: "COPPER", copper_lbs_per_1000ft: 12.5, base_price_cents_per_ft: 18, min_cut_length_ft: 100, cut_charge_cents: 3500, reel_deposit_cents: 12500, master_reel_length_ft: 2500, reel_weight_lbs: 320.0, allowed_put_ups: ["MASTER_REEL", "CUT"] }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /copper-index-entries"
              payload: { effective_date: "2026-07-30", price_cents_per_lb: 450 }
              as: PlatformAdmin
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", branch_id: "${br_id}" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { q_id: "$.data.id", q_v1: "$.data.version" }
            - call: "POST /quotes/${q_id}/lines"
              payload: { product_id: "${p1_id}", put_up: "CUT", requested_length_ft: 200, parallel_set_size: 3, expected_quote_version: "${q_v1}" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { ql_id: "$.data.id" }
          trigger:
            - call: "POST /quotes/${q_id}/issue"
              as: SalesRep
              as_user_id: "rep-2"
          assert:
            - "QuoteLine.${ql_id}.billable_length_ft == 200"
            - "QuoteLine.${ql_id}.cut_charge_cents_total == 10500"
            - "QuoteLine.${ql_id}.base_cents == 10800"
            - "QuoteLine.${ql_id}.metal_cents == 3375"
            - "QuoteLine.${ql_id}.deposit_cents_total == 0"
            - "QuoteLine.${ql_id}.quoted_extended_cents == 24675"
            - "Quote.${q_id}.physical_reel_count == 3"
            - "Quote.${q_id}.gross_freight_cents == 16000"
            - "Quote.${q_id}.quoted_total_cents == 40675"

      - name: metal_rounding_per_line_then_sum_mode_b
        grounds:
          - calculations.quote_line_pricing
          - calculations.order_money_rollup
          - entities.QuoteLine.fields.metal_cents
          - entities.QuoteLine.fields.copper_adder_cents_per_ft
          - entities.Quote.fields.line_subtotal_cents
        distinguishing_aspect: |
          Mode (b): the rounding ORDER is what moves the number. Two identical
          137 ft lines at an unrounded 5.6250 c/ft each round HALF_UP to 771
          cents for a 1542-cent metal total, whereas summing first
          (5.6250 x 274 = 1541.25) rounds to 1541 -- a one-cent divergence that
          makes Quote.line_subtotal_cents 13474 rather than 13473.
        test_recipe:
          setup:
            - "One branch with zero surcharge, one customer with a 5,000,000-cent limit, product P1, index CI1 at 450 c/lb."
            - "A DRAFT quote carrying two identical CUT lines of 137 ft, then issued at the default clock."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Houston DC", region_code: "TX", concurrent_cut_capacity: 1, delivery_surcharge_cents: 0 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id" }
            - call: "POST /customers"
              payload: { name: "Gulf Electric", credit_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { part_number: "CU-500-XHHW", conductor_metal: "COPPER", copper_lbs_per_1000ft: 12.5, base_price_cents_per_ft: 18, min_cut_length_ft: 100, cut_charge_cents: 3500, reel_deposit_cents: 12500, master_reel_length_ft: 2500, reel_weight_lbs: 320.0, allowed_put_ups: ["MASTER_REEL", "CUT"] }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /copper-index-entries"
              payload: { effective_date: "2026-07-30", price_cents_per_lb: 450 }
              as: PlatformAdmin
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", branch_id: "${br_id}" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { q_id: "$.data.id", q_v1: "$.data.version" }
            - call: "POST /quotes/${q_id}/lines"
              payload: { product_id: "${p1_id}", put_up: "CUT", requested_length_ft: 137, parallel_set_size: 1, expected_quote_version: "${q_v1}" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { ql1_id: "$.data.id" }
            - call: "GET /quotes/${q_id}"
              as: SalesRep
              as_user_id: "rep-1"
              captures: { q_v2: "$.data.version" }
            - call: "POST /quotes/${q_id}/lines"
              payload: { product_id: "${p1_id}", put_up: "CUT", requested_length_ft: 137, parallel_set_size: 1, expected_quote_version: "${q_v2}" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { ql2_id: "$.data.id" }
          trigger:
            - call: "POST /quotes/${q_id}/issue"
              as: SalesRep
              as_user_id: "rep-2"
          assert:
            - "QuoteLine.${ql1_id}.copper_adder_cents_per_ft == 5.6250"
            - "QuoteLine.${ql1_id}.metal_cents == 771"
            - "QuoteLine.${ql2_id}.metal_cents == 771"
            - "Quote.${q_id}.line_subtotal_cents == 13474"
            - "Quote.${q_id}.quoted_total_cents == 26974"

      - name: freight_waiver_and_rebate_tier_evaluation_order_mode_c
        grounds:
          - calculations.order_money_rollup
          - entities.Branch.fields.delivery_surcharge_cents
          - entities.Quote.fields.rebate_pct
          - entities.Quote.fields.freight_cents
          - entities.Quote.fields.quoted_total_cents
        distinguishing_aspect: |
          Mode (c): freight feeds the rebate tier and the rebate feeds the
          free-freight waiver, so the six-step order is the only thing that makes
          the answer well-defined. One extra cent of branch surcharge (23400 vs
          23399) moves net_before_waiver from exactly 500000 to 499999, flipping
          freight from 0 to 34399 while rebate_cents stays 14400 in both cases
          because the tier is never recomputed after the waiver.
        test_recipe:
          setup:
            - "Two branches: Waiver DC with delivery_surcharge_cents 23400 and Shortfall DC with 23399."
            - "One customer with a 5,000,000-cent limit, product P3 (aluminium, 100 c/ft base, no cut charge), index CI1."
            - "One single-line CUT quote of 4800 ft per branch, each authored by rep-1 and issued by rep-2 because the 480000-cent subtotal is at or above the segregation-of-duties threshold."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Waiver DC", region_code: "TX", concurrent_cut_capacity: 1, delivery_surcharge_cents: 23400 }
              as: PlatformAdmin
              captures: { brx_id: "$.data.id" }
            - call: "POST /branches"
              payload: { name: "Shortfall DC", region_code: "TX", concurrent_cut_capacity: 1, delivery_surcharge_cents: 23399 }
              as: PlatformAdmin
              captures: { bry_id: "$.data.id" }
            - call: "POST /customers"
              payload: { name: "Gulf Electric", credit_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
