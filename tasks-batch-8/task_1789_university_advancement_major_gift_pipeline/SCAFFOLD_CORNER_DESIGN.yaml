      - name: writeoff_latest_first_allocation_order
        claim_type: correct_result
        grounds: [calculations.pledge_outstanding_balance]
        excluded_because:
          difficulty_instance: writeoff_approval_pledge_campaign_recognition_cascade
          rationale: "That instance asserts installment 3 (latest due) is WRITTEN_OFF while partially-paid installment 2 becomes PAID — the latest-first order is exactly what those literals prove."
      - name: campaign_totals_correct_result_both_variants
        claim_type: correct_result
        grounds: [calculations.campaign_counted_totals]
        excluded_because:
          difficulty_instance: campaign_face_value_vs_cash_receipts_divergence
          rationale: "FACE 10000000 / CASH 3666667 literals there are the correct-result assertions for both variants."
      - name: recognition_scoring_variant_delta
        claim_type: variant_divergence
        grounds: [calculations.recognition_society_scoring]
        excluded_because:
          difficulty_instance: recognition_cash_only_vs_comprehensive_divergence
          rationale: "member null vs projected BRONZE on identical data is the variant-divergence assertion."
      - name: approval_tier_correct_result
        claim_type: correct_result
        grounds: [calculations.approval_tier_determination]
        excluded_because:
          difficulty_instance: approval_tier_multi_input_branching
          rationale: "Three computed tiers (MAJOR/PRINCIPAL/MAJOR) with pinned inputs are asserted there."
      - name: credit_split_correct_result
        claim_type: correct_result
        grounds: [calculations.credit_split_rounding]
        excluded_because:
          difficulty_instance: credit_split_residual_rounding_order
          rationale: "The 3401/3300/3300 split literals there are the correct-result assertions."
      - name: endowment_allowance_correct_result
        claim_type: correct_result
        grounds: [calculations.endowment_spending_allowance]
        excluded_because:
          difficulty_instance: spending_allowance_pinned_evaluation_order
          rationale: "spendable 4500000 and 4140000 are computed-literal assertions of the allowance formula."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call without X-User-Role/X-User-ID headers is rejected 401 before any other check, even for a GET."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /advancement/prospects/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_UNAUTHENTICATED\" and http status 401"

      - name: role_check_precedes_schema_validation
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "A ProspectResearcher creating a campaign with a malformed body (missing goal_cents) receives ERR_UNAUTHORIZED_ROLE, proving role (priority 2) runs before schema (priority 3)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /advancement/campaigns"
              payload: { name: "Bad" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_UNAUTHORIZED_ROLE\"  # not ERR_INVALID_REQUEST despite the missing required field"

      - name: existence_check_precedes_ownership
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]", "errors[ERR_PROSPECT_NOT_FOUND]"]
        distinguishing_aspect: "A GiftOfficer moving a nonexistent prospect receives ERR_PROSPECT_NOT_FOUND, proving existence (priority 4) runs before portfolio ownership (priority 5)."
        test_recipe:
          setup: ["one fundraiser exists (the acting officer)"]
          setup_api_calls:
            - call: "POST /advancement/fundraisers"
              payload: { display_name: "Officer One", email: "o1@x.edu", max_prospect_count: 10, max_open_ask_cents: 100000000 }
              as: VPAdvancement
              as_user_id: "vp-1"
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /advancement/prospects/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/moves"
              payload: { target_stage: "CULTIVATION" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_PROSPECT_NOT_FOUND\"  # not ERR_NOT_PROSPECT_OWNER"

      - name: sod_check_precedes_state_check
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=8]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Reviewing an already-APPROVED assessment as its own creator surfaces ERR_SEGREGATION_OF_DUTIES, proving segregation (priority 6) runs before the SUBMITTED-state check (priority 8)."
        test_recipe:
          setup: ["assessment created by res-1 and already APPROVED by dir-1"]
          setup_api_calls:
            - call: "POST /advancement/prospects"
              payload: { full_name: "Donor A", prospect_type: "INDIVIDUAL", contact_email: "a@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p_id: $.data.id }
            - call: "POST /advancement/prospects/${p_id}/assessments"
              payload: { assessed_capacity_cents: 30000000, engagement_score: 80, philanthropy_score: 70, recency_score: 60, evidence_tier: "VERIFIED_DOCUMENT" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { a_id: $.data.id }
            - call: "POST /advancement/assessments/${a_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
          trigger:
            - call: "POST /advancement/assessments/${a_id}/review"
              payload: { decision: "REJECT" }
              as: AdvancementDirector
              as_user_id: "res-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_SEGREGATION_OF_DUTIES\"  # not ERR_ASSESSMENT_NOT_REVIEWABLE"
            - "the dual-failure condition held: reviewer == created_by AND status APPROVED != SUBMITTED"

      - name: ask_exceeding_rated_capacity_rejected
        claim_type: cross_entity_validation
        grounds: ["errors[ERR_ASK_EXCEEDS_CAPACITY]", entities.Prospect.fields.rated_adjusted_capacity_cents]
