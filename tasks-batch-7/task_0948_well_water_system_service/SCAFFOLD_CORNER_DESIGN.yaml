  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_occ_quote_line_add_rejects_a_version_the_client_already_spent
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[quote-line-add-stale-quote]", "errors[ERR_STALE_QUOTE_VERSION]", "validations[priority=27]", "entities.Quote.fields.version"]
        distinguishing_aspect: |
          Adding a line is legitimately repeatable, so the guard is purely the version:
          the first add against expected_quote_version equal to the quote's creation
          version succeeds and advances Quote.version by exactly 1; replaying that SAME
          version is refused 412 ERR_STALE_QUOTE_VERSION and creates no line; re-reading
          the quote and using the fresh version succeeds again. An implementation that
          ignores the field, or that bumps the version without checking it, accepts the
          replay and ends with three lines instead of two.
        test_recipe:
          setup:
            - "One account, property, well, JOURNEYMAN technician, one COMPLETED inspection and one CONTROL part costing 5000 cents."
            - "One DRAFT quote of scope REPAIR with no lines and version 1."
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Quote OCC Co", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "qo@corner.example" }
              as: PlatformAdmin
